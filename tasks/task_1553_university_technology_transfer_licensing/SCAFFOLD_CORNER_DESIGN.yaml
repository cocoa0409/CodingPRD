scaffold_corner_design:
- section: entities
  instances:
  - name: create_department_applies_defaults
    claim_type: creation
    grounds:
    - entities.Department
    - endpoints[POST /tlo/departments]
    distinguishing_aspect: 201 response carries server-minted id, version 1, and computed distribution_pool_cents == 0; client
      cannot set the pool.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
          pool: $.data.distribution_pool_cents
          ver: $.data.version
      assert:
      - Department.${dept_id}.distribution_pool_cents == 0
      - Department.${dept_id}.version == 1 and id is a bare UUID without type prefix
  - name: create_inventor_missing_required_field_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Inventor.fields.appointment_type
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting appointment_type (no default) is rejected with ERR_INVALID_REQUEST (400); each required
      field behaves the same.
    test_recipe:
      setup:
      - one department
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      trigger:
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
        as: SystemAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST, http 400
  - name: create_federal_disclosure_without_grant_number_rejected
    claim_type: required_fields
    grounds:
    - entities.InventionDisclosure.fields.grant_number
    - validations[priority=4]
    distinguishing_aspect: 'Conditional requirement: funding_source FEDERAL without grant_number (or federal_agency) -> ERR_INVALID_REQUEST;
      NON_FEDERAL omits them freely.'
    test_recipe:
      setup:
      - one inventor
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
          appointment_type: FACULTY
        as: SystemAdmin
        captures:
          inv_id: $.data.id
      trigger:
      - call: POST /tlo/disclosures
        payload:
          title: X
          description: Y
          funding_source: FEDERAL
          federal_agency: NSF
        as: Inventor
        as_user_id: ${inv_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (grant_number missing for FEDERAL)
  - name: disclosure_unknown_payload_field_rejected
    claim_type: system_fields
    grounds:
    - validations[priority=4]
    - entities.InventionDisclosure
    distinguishing_aspect: "Client-sent computed/system fields (unreimbursed_cost_cents, status, id) are rejected as unknown\
      \ payload keys with ERR_INVALID_REQUEST \u2014 strict input schemas."
    test_recipe:
      setup:
      - one inventor
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
          appointment_type: FACULTY
        as: SystemAdmin
        captures:
          inv_id: $.data.id
      trigger:
      - call: POST /tlo/disclosures
        payload:
          title: X
          description: Y
          funding_source: NON_FEDERAL
          unreimbursed_cost_cents: 999
        as: Inventor
        as_user_id: ${inv_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (client may not set computed fields)
  - name: disclosure_invalid_enum_value_rejected
    claim_type: type_constraints
    grounds:
    - entities.InventionDisclosure.fields.funding_source
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: 'funding_source: ''CORPORATE'' is not in the enum -> ERR_INVALID_REQUEST.'
    test_recipe:
      setup:
      - one inventor
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
          appointment_type: FACULTY
        as: SystemAdmin
        captures:
          inv_id: $.data.id
      trigger:
      - call: POST /tlo/disclosures
        payload:
          title: X
          description: Y
          funding_source: CORPORATE
        as: Inventor
        as_user_id: ${inv_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST
  - name: get_core_entities_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_DISCLOSURE_NOT_FOUND]
    - errors[ERR_DISCLOSURE_ENTRY_NOT_FOUND]
    - errors[ERR_DISPUTE_NOT_FOUND]
    - errors[ERR_DEPARTMENT_NOT_FOUND]
    - errors[ERR_INVENTOR_NOT_FOUND]
    distinguishing_aspect: Each GET/action with a well-formed but nonexistent UUID yields the resource-specific 404 error_id,
      not a generic one.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /tlo/disclosures/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e1: $.data.error_id
      - call: GET /tlo/disclosure-entries/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e2: $.data.error_id
      - call: GET /tlo/inventorship-disputes/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e3: $.data.error_id
      - call: GET /tlo/departments/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e4: $.data.error_id
      - call: GET /tlo/inventors/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e5: $.data.error_id
      assert:
      - e1 == ERR_DISCLOSURE_NOT_FOUND; e2 == ERR_DISCLOSURE_ENTRY_NOT_FOUND; e3 == ERR_DISPUTE_NOT_FOUND; e4 == ERR_DEPARTMENT_NOT_FOUND;
        e5 == ERR_INVENTOR_NOT_FOUND; all http 404
  - name: get_lifecycle_entities_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_PATENT_APPLICATION_NOT_FOUND]
    - errors[ERR_LICENSE_NOT_FOUND]
    - errors[ERR_MILESTONE_NOT_FOUND]
    - errors[ERR_ROYALTY_REPORT_NOT_FOUND]
    - errors[ERR_DISTRIBUTION_NOT_FOUND]
    - errors[ERR_STARTUP_NOT_FOUND]
    - errors[ERR_COI_PLAN_NOT_FOUND]
    - errors[ERR_COMPLIANCE_REPORT_NOT_FOUND]
    distinguishing_aspect: The remaining eight resource families each return their own 404 error_id.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /tlo/patent-applications/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e1: $.data.error_id
      - call: GET /tlo/licenses/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e2: $.data.error_id
      - call: GET /tlo/milestones/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e3: $.data.error_id
      - call: GET /tlo/royalty-reports/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e4: $.data.error_id
      - call: GET /tlo/distributions/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e5: $.data.error_id
      - call: GET /tlo/startups/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e6: $.data.error_id
      - call: GET /tlo/coi-plans/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e7: $.data.error_id
      - call: GET /tlo/compliance-reports/11111111-1111-4111-8111-111111111111
        payload: {}
        as: Any
        captures:
          e8: $.data.error_id
      assert:
      - e1 == ERR_PATENT_APPLICATION_NOT_FOUND; e2 == ERR_LICENSE_NOT_FOUND; e3 == ERR_MILESTONE_NOT_FOUND; e4 == ERR_ROYALTY_REPORT_NOT_FOUND;
        e5 == ERR_DISTRIBUTION_NOT_FOUND; e6 == ERR_STARTUP_NOT_FOUND; e7 == ERR_COI_PLAN_NOT_FOUND; e8 == ERR_COMPLIANCE_REPORT_NOT_FOUND
  - name: roster_reverse_reachability_from_inventor
    claim_type: parent_relationships
    grounds:
    - entities.DisclosureInventor.fields.inventor_id
    - endpoints[GET /tlo/inventors/{id}/disclosure-entries]
    distinguishing_aspect: 'Many-to-many junction is traversable both ways: GET /tlo/inventors/{id}/disclosure-entries returns
      the inventor''s roster entries across disclosures.'
    test_recipe:
      setup:
      - one inventor on one disclosure roster
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
          appointment_type: FACULTY
        as: SystemAdmin
        captures:
          inv_id: $.data.id
      - call: POST /tlo/disclosures
        payload:
          title: X
          description: Y
          funding_source: NON_FEDERAL
        as: Inventor
        as_user_id: ${inv_id}
        captures:
          disc_id: $.data.id
      - call: POST /tlo/disclosures/${disc_id}/inventors
        payload:
          inventor_id: ${inv_id}
          share_bp: 10000
        as: TechTransferOfficer
        captures:
          entry_id: $.data.id
      trigger:
      - call: GET /tlo/inventors/${inv_id}/disclosure-entries
        payload: {}
        as: Any
      assert:
      - response is DisclosureInventor[] of length 1 containing entry ${entry_id}
  - name: department_pool_is_computed_not_input
    claim_type: computed_fields
    grounds:
    - entities.Department.fields.distribution_pool_cents
    excluded_because:
      difficulty_instance: transitive_cascade / distribution_pay_cascade
      rationale: Pool crediting at pay is asserted there; create-time default asserted in create_department_applies_defaults.
  - name: disclosure_cost_rollups_reconcile_after_cost_create
    claim_type: computed_fields
    grounds:
    - calculations.unreimbursed_cost_rollup
    - entities.InventionDisclosure.fields.unreimbursed_cost_cents
    distinguishing_aspect: 'Derived-field reconciliation: each cost create immediately recomputes both application- and disclosure-level
      rollups.'
    test_recipe:
      setup:
      - NON_FEDERAL disclosure PATENT_PURSUED; PROVISIONAL application
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
          appointment_type: FACULTY
        as: SystemAdmin
        captures:
          inv_id: $.data.id
      - call: POST /tlo/disclosures
        payload:
          title: X
          description: Y
          funding_source: NON_FEDERAL
        as: Inventor
        as_user_id: ${inv_id}
        captures:
          disc_id: $.data.id
      - call: POST /tlo/disclosures/${disc_id}/inventors
        payload:
          inventor_id: ${inv_id}
          share_bp: 10000
        as: TechTransferOfficer
        captures:
          entry_id: $.data.id
      - call: POST /tlo/disclosure-entries/${entry_id}/confirm
        payload: {}
        as: Inventor
        as_user_id: ${inv_id}
      - call: GET /tlo/disclosures/${disc_id}
        payload: {}
        as: Any
        captures:
          disc_v: $.data.version
      - call: POST /tlo/disclosures/${disc_id}/inventorship/finalize
        payload:
          expected_disclosure_version: ${disc_v}
        as: TechTransferOfficer
      - call: POST /tlo/disclosures/${disc_id}/assessment
        payload:
          patentability_rating: HIGH
          market_rating: HIGH
        as: TechTransferOfficer
      - call: POST /tlo/disclosures/${disc_id}/decision
        payload:
          decision: PURSUE_PATENT
        as: TechTransferOfficer
      - call: POST /tlo/disclosures/${disc_id}/patent-applications
        payload:
          docket_number: DKT-1
          application_type: PROVISIONAL
          filed_date: '2026-02-15T00:00:00Z'
        as: TechTransferOfficer
        captures:
          app_id: $.data.id
      trigger:
      - call: POST /tlo/patent-applications/${app_id}/costs
        payload:
          cost_type: FILING_FEE
          amount_cents: 125000
          incurred_date: '2026-03-01T00:00:00Z'
        as: TechTransferOfficer
      - call: POST /tlo/patent-applications/${app_id}/costs
        payload:
          cost_type: ATTORNEY_FEE
          amount_cents: 75000
          incurred_date: '2026-03-02T00:00:00Z'
        as: TechTransferOfficer
      - call: GET /tlo/disclosures/${disc_id}
        payload: {}
        as: Any
        captures:
          unreimb: $.data.unreimbursed_cost_cents
      - call: GET /tlo/patent-applications/${app_id}
        payload: {}
        as: Any
        captures:
          app_total: $.data.total_cost_cents
          app_unreimb: $.data.unreimbursed_cost_cents
      assert:
      - InventionDisclosure.${disc_id}.unreimbursed_cost_cents == 200000
      - PatentApplication.${app_id}.total_cost_cents == 200000 and unreimbursed_cost_cents == 200000
- section: state_machines
  instances:
  - name: disclosure_initial_state
    claim_type: initial_state
    grounds:
    - state_machines.InventionDisclosure
    distinguishing_aspect: A newly created disclosure starts in INVENTORSHIP_REVIEW with null ratings.
    test_recipe:
      setup:
      - one inventor
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
          appointment_type: FACULTY
        as: SystemAdmin
        captures:
          inv_id: $.data.id
      trigger:
      - call: POST /tlo/disclosures
        payload:
          title: X
          description: Y
          funding_source: NON_FEDERAL
        as: Inventor
        as_user_id: ${inv_id}
        captures:
          st: $.data.status
          pat: $.data.patentability_rating
      assert:
      - status == INVENTORSHIP_REVIEW; patentability_rating is null; submitter_inventor_id == ${inv_id}
  - name: assessment_before_finalize_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.InventionDisclosure.INVENTORSHIP_CONFIRMED_to_UNDER_ASSESSMENT
    - errors[ERR_DISCLOSURE_INVALID_STATE]
    distinguishing_aspect: Assessment from INVENTORSHIP_REVIEW (finalize not done) -> ERR_DISCLOSURE_INVALID_STATE; no ratings
      stored.
    test_recipe:
      setup:
      - disclosure in INVENTORSHIP_REVIEW with one PENDING entry
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
          appointment_type: FACULTY
        as: SystemAdmin
        captures:
          inv_id: $.data.id
      - call: POST /tlo/disclosures
        payload:
          title: X
          description: Y
          funding_source: NON_FEDERAL
        as: Inventor
        as_user_id: ${inv_id}
        captures:
          disc_id: $.data.id
      - call: POST /tlo/disclosures/${disc_id}/inventors
        payload:
          inventor_id: ${inv_id}
          share_bp: 10000
        as: TechTransferOfficer
      trigger:
      - call: POST /tlo/disclosures/${disc_id}/assessment
        payload:
          patentability_rating: HIGH
          market_rating: HIGH
        as: TechTransferOfficer
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DISCLOSURE_INVALID_STATE; status remains INVENTORSHIP_REVIEW
  - name: low_patentability_blocks_pursue_but_allows_shelve
    claim_type: precondition_enforcement
    grounds:
    - state_machines.InventionDisclosure.UNDER_ASSESSMENT_to_PATENT_PURSUED
    - errors[ERR_ASSESSMENT_GATE_FAILED]
    distinguishing_aspect: "patentability_rating LOW fails the PURSUE_PATENT gate (ERR_ASSESSMENT_GATE_FAILED) while SHELF\
      \ succeeds from the same state \u2014 the assessment-gating rule."
    test_recipe:
      setup:
      - disclosure UNDER_ASSESSMENT with patentability LOW, market HIGH
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
          appointment_type: FACULTY
        as: SystemAdmin
        captures:
          inv_id: $.data.id
      - call: POST /tlo/disclosures
        payload:
          title: X
          description: Y
          funding_source: NON_FEDERAL
        as: Inventor
        as_user_id: ${inv_id}
        captures:
          disc_id: $.data.id
      - call: POST /tlo/disclosures/${disc_id}/inventors
        payload:
          inventor_id: ${inv_id}
          share_bp: 10000
        as: TechTransferOfficer
        captures:
          entry_id: $.data.id
      - call: POST /tlo/disclosure-entries/${entry_id}/confirm
        payload: {}
        as: Inventor
        as_user_id: ${inv_id}
      - call: GET /tlo/disclosures/${disc_id}
        payload: {}
        as: Any
        captures:
          disc_v: $.data.version
      - call: POST /tlo/disclosures/${disc_id}/inventorship/finalize
        payload:
          expected_disclosure_version: ${disc_v}
        as: TechTransferOfficer
      - call: POST /tlo/disclosures/${disc_id}/assessment
        payload:
          patentability_rating: LOW
          market_rating: HIGH
        as: TechTransferOfficer
      trigger:
      - call: POST /tlo/disclosures/${disc_id}/decision
        payload:
          decision: PURSUE_PATENT
        as: TechTransferOfficer
        captures:
          err: $.data.error_id
      - call: POST /tlo/disclosures/${disc_id}/decision
        payload:
          decision: SHELF
        as: TechTransferOfficer
        captures:
          st: $.data.status
      assert:
      - PURSUE_PATENT fails with ERR_ASSESSMENT_GATE_FAILED
      - SHELF then succeeds -> status SHELVED
  - name: terminal_disclosure_lockdown
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.InventionDisclosure
    distinguishing_aspect: 'From WAIVED_TO_INVENTORS no transition exists: patent-application create and startup create both
      fail with ERR_DISCLOSURE_INVALID_STATE.'
    test_recipe:
      setup:
      - disclosure decided WAIVE_TO_INVENTORS
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
          appointment_type: FACULTY
        as: SystemAdmin
        captures:
          inv_id: $.data.id
      - call: POST /tlo/disclosures
        payload:
          title: X
          description: Y
          funding_source: NON_FEDERAL
        as: Inventor
        as_user_id: ${inv_id}
        captures:
          disc_id: $.data.id
      - call: POST /tlo/disclosures/${disc_id}/inventors
        payload:
          inventor_id: ${inv_id}
          share_bp: 10000
        as: TechTransferOfficer
        captures:
          entry_id: $.data.id
      - call: POST /tlo/disclosure-entries/${entry_id}/confirm
        payload: {}
        as: Inventor
        as_user_id: ${inv_id}
      - call: GET /tlo/disclosures/${disc_id}
        payload: {}
        as: Any
        captures:
          disc_v: $.data.version
      - call: POST /tlo/disclosures/${disc_id}/inventorship/finalize
        payload:
          expected_disclosure_version: ${disc_v}
        as: TechTransferOfficer
      - call: POST /tlo/disclosures/${disc_id}/assessment
        payload:
          patentability_rating: LOW
          market_rating: LOW
        as: TechTransferOfficer
      - call: POST /tlo/disclosures/${disc_id}/decision
        payload:
          decision: WAIVE_TO_INVENTORS
        as: TechTransferOfficer
      trigger:
      - call: POST /tlo/disclosures/${disc_id}/patent-applications
        payload:
          docket_number: DKT-1
          application_type: PROVISIONAL
          filed_date: '2026-02-15T00:00:00Z'
        as: TechTransferOfficer
        captures:
          err1: $.data.error_id
      - call: POST /tlo/disclosures/${disc_id}/startups
        payload:
          name: SpinCo
          founded_date: '2026-02-01T00:00:00Z'
          equity_model: FIXED
        as: TechTransferOfficer
        captures:
          err2: $.data.error_id
      assert:
      - err1 == ERR_DISCLOSURE_INVALID_STATE and err2 == ERR_DISCLOSURE_INVALID_STATE
  - name: confirm_already_confirmed_entry_rejected
    claim_type: idempotency
    grounds:
    - state_machines.DisclosureInventor.PENDING_to_CONFIRMED
    - errors[ERR_ENTRY_NOT_CONFIRMABLE]
    distinguishing_aspect: "Second confirm of the same entry is rejected with ERR_ENTRY_NOT_CONFIRMABLE \u2014 the trigger\
      \ is not idempotent."
    test_recipe:
      setup:
      - entry e1 CONFIRMED
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
      - call: POST /tlo/inventors
        payload:
          full_name: Ada Lovelace
          email: ada@uni.edu
          department_id: ${dept_id}
          appointment_type: FACULTY
        as: SystemAdmin
        captures:
          inv_id: $.data.id
      - call: POST /tlo/disclosures
        payload:
          title: X
          description: Y
          funding_source: NON_FEDERAL
