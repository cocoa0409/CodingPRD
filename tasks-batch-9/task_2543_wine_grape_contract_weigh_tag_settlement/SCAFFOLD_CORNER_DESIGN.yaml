            - "The first appointment is created with 201 even though window_start == target_pick_at exactly: priority 35's lower edge is inclusive"
            - "planned_tons 40.000 == max_load_tons 40.000 is accepted: priority 45 compares with <="
            - "The second appointment is created with 201: its window_start 10:30 is exactly one 30-minute buffer after the first window's end, and the buffered comparison is half-open, so touching windows do not conflict"
            - "The second appointment is also accepted by priority 44: 40.000 + 40.000 == daily_capacity_tons 80.000 exactly"
            - "The weigh tag is created with 201 at now == window_start exactly: priority 36's arrival envelope is inclusive at the start"
            - "The lane reports committed_tons == 80.000 and scheduled_appointment_count == 2 (the ARRIVED appointment still counts, since the ledger spans SCHEDULED and ARRIVED)"

      - name: higher_priority_rule_wins_when_two_rules_are_violated_at_once
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: suspended_grower_outranks_lane_window_conflict
          rationale: |
            §1.8's priority_pair_validation_conflict rule exists to prove the ordering: a
            suspended producer booked into an already-occupied lane window must return
            ERR_GROWER_SUSPENDED (priority 31), and the instance also reverses the setup so the
            lower-priority error is observed on its own, which is the only way to show the
            ordering rather than a coincidence.

      - name: violating_two_rules_across_categories_returns_the_lower_numbered_priority
        claim_type: Priority conflict
        excluded_because:
          difficulty_instance: pick_window_temporal_outranks_lane_daily_capacity
          rationale: |
            The second priority pair covers a cross-category conflict — business_temporal
            (priority 35) against business_fiscal (priority 44) — on a single POST
            /grower-relations/delivery-appointments call where both conditions are true, and
            asserts that the fiscal error appears once the temporal defect is repaired.

      - name: the_earlier_check_runs_before_the_check_that_depends_on_it
        claim_type: Cascading validation
        excluded_because:
          difficulty_instance: appointment_state_outranks_arrival_window
          rationale: |
            That instance stacks a state check (priority 22, appointment CANCELLED) on top of a
            temporal check (priority 36, clock outside the arrival envelope) on POST
            /grower-relations/weigh-tags, so the state error must surface first; it then relaxes
            the clock to expose the state error alone and cancels a different appointment to
            expose the temporal error alone.

      - name: an_operation_valid_now_that_creates_a_future_conflict_is_detected
        claim_type: Temporal validation
        excluded_because:
          difficulty_instance: crush_pad_lane_buffered_adjacency_one_minute_either_side
          rationale: |
            Lane exclusivity is the temporal-conflict rule of this domain, and that §1.8
            instance probes it one minute either side of the buffered edge in both directions
            (new booking before and after the incumbent), which is strictly stronger than a
            single future-conflict probe.

      - name: individually_valid_bookings_that_collectively_exceed_the_limit_are_refused
        claim_type: Aggregate validation
        excluded_because:
          difficulty_instance: sampling_crew_aggregate_concurrency_with_half_open_adjacency
          rationale: |
            Crew saturation is the aggregate rule: each visit is individually legal and only
            the count of overlapping SCHEDULED visits breaks max_concurrent_visits. The lane's
            daily tonnage aggregate has its own boundary instance in
            lane_daily_capacity_exact_equality_accepted.

      - name: producer_lien_is_grower_wide_and_overpayment_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.priority_48
          - validations.priority_47
          - errors[ERR_LIEN_OUTSTANDING]
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
        distinguishing_aspect: |
          The statutory producer lien attaches to the PRODUCER, not to the contract: an unpaid
          lien-protected installment on contract C1 must block a termination notice on the
          unrelated contract C2 of the same grower. Every implementation scopes this to the
          contract being terminated and passes a same-contract probe. The instance also pins
          priority 47: an overpayment of one cent is refused outright rather than spilled into
          the next installment or clamped to the balance, and a partial payment leaves the lien
          standing until the balance reaches zero.
        test_recipe:
          setup:
            - "One producer with TWO contracts. C1 takes a single clean 20.000-net-ton load and is settlement-closed, leaving one lien-protected installment of 8,595,000 cents. C2 stays ACTIVE and untouched."
