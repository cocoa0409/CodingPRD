          trigger:
            - { call: "POST /piano-works/concert-loans/${ln}/confirm", payload: { technician_id: "${cr_voi}" }, as: Apprentice, as_user_id: "${apr}", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_UNAUTHORIZED_ROLE with http 403"
            - "ConcertLoan.${ln}.status == REQUESTED"

      - name: rbac_liaison_cannot_advance_build
        claim_type: role_exclusive_denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Advance is shared only between MasterCraftsman and Apprentice; ArtistLiaison is denied 403."
        test_recipe:
          setup: ["build COMMISSIONED version 1"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
          trigger:
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 100, expected_build_order_version: "${bv}" }, as: ArtistLiaison, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_UNAUTHORIZED_ROLE with http 403"
            - "BuildOrder.${b_id}.status == COMMISSIONED and version == ${bv}"

      - name: rbac_craftsman_cannot_log_hours
        claim_type: role_exclusive_denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "log-hours is Apprentice-exclusive; a MasterCraftsman caller is denied 403 even on an existing endorsement."
        test_recipe:
          setup: ["one IN_TRAINING endorsement"]
          setup_api_calls:
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/apprentices", payload: { name: "Apr H" }, as: WorkshopManager, captures: { apr: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements", payload: { apprentice_id: "${apr}", operation_type: RIM_BENDING }, as: WorkshopManager, captures: { en: $.data.id } }
          trigger:
            - { call: "POST /piano-works/skill-endorsements/${en}/log-hours", payload: { hours: 10, supervising_craftsman_id: "${cr_rim}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_UNAUTHORIZED_ROLE with http 403"

      - name: apprentice_cannot_log_others_endorsement_forbidden
        claim_type: ownership_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_RESOURCE]"]
        distinguishing_aspect: "Ownership check beyond role: apprentice apr2 calling log-hours on apr1's endorsement is 403 ERR_FORBIDDEN_RESOURCE (role is correct; identity does not own the resource)."
        test_recipe:
          setup: ["two apprentices; endorsement owned by apr1"]
          setup_api_calls:
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/apprentices", payload: { name: "Apr One" }, as: WorkshopManager, captures: { apr1: $.data.id } }
            - { call: "POST /piano-works/apprentices", payload: { name: "Apr Two" }, as: WorkshopManager, captures: { apr2: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements", payload: { apprentice_id: "${apr1}", operation_type: RIM_BENDING }, as: WorkshopManager, captures: { en: $.data.id } }
          trigger:
            - { call: "POST /piano-works/skill-endorsements/${en}/log-hours", payload: { hours: 10, supervising_craftsman_id: "${cr_rim}" }, as: Apprentice, as_user_id: "${apr2}", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_FORBIDDEN_RESOURCE with http 403"
            - "SkillEndorsement.${en}.logged_hours == 0"

  - section: consistency_model
    instances:
      - name: immediate_visibility_after_advance
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the advance response itself carries the new status RIM_BENT and version 2, and a subsequent GET agrees without any lag."
        test_recipe:
          setup: ["build COMMISSIONED version 1; RIM_BENDING craftsman"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
          trigger:
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 100, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { st: $.data.status, v2: $.data.version } }
            - { call: "GET /piano-works/build-orders/${b_id}", as: Apprentice, captures: { st2: $.data.status } }
          assert:
            - "advance response captured status ${st} == RIM_BENT and version ${v2} == 2 in the same request"
            - "follow-up GET (as a different role) captured ${st2} == RIM_BENT"

  - section: state_machines
    instances:
      - name: artist_review_suspend_met_and_reinstate_branches
        claim_type: cyclic_transition
        grounds: [state_machines.Artist]
        distinguishing_aspect: "All three review branches exercised: artA ACTIVE->SUSPENDED->ACTIVE (counter retained while suspended, next_review_date := clock+365 on reinstatement), artB ACTIVE->ACTIVE with counter reset and next_review_date rolled from the old schedule date."
        test_recipe:
          setup: ["artA quota 2 (0 performances) reviewed into SUSPENSION at 2027-09-01; artB quota 1 with 1 performance reviewed (met) same day; artA then logs 2 catch-up performances at clock 2027-12-01"]
          setup_api_calls:
            - { call: "POST /piano-works/artists", payload: { name: "Art A", tier: STANDARD, performance_quota: 2 }, as: ArtistLiaison, captures: { artA: $.data.id } }
            - { call: "POST /piano-works/artists", payload: { name: "Art B", tier: STANDARD, performance_quota: 1 }, as: ArtistLiaison, captures: { artB: $.data.id } }
            - { call: "POST /piano-works/artists/${artB}/performances", payload: { venue: "Opener", performed_at: "2026-09-01T00:00:00Z" }, as: ArtistLiaison }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-01T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/artists/${artA}/review", payload: {}, as: ArtistLiaison, captures: { stA1: $.data.status } }
            - { call: "POST /piano-works/artists/${artB}/review", payload: {}, as: ArtistLiaison, captures: { stB: $.data.status, nrdB: $.data.next_review_date, cntB: $.data.performances_logged } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-12-01T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/artists/${artA}/performances", payload: { venue: "Catchup 1", performed_at: "2027-10-01T00:00:00Z" }, as: ArtistLiaison }
            - { call: "POST /piano-works/artists/${artA}/performances", payload: { venue: "Catchup 2", performed_at: "2027-10-02T00:00:00Z" }, as: ArtistLiaison }
          trigger:
            - { call: "POST /piano-works/artists/${artA}/review", payload: {}, as: ArtistLiaison, captures: { stA2: $.data.status, nrdA: $.data.next_review_date, cntA: $.data.performances_logged } }
          assert:
            - "artA first review captured ${stA1} == SUSPENDED (0 < 2, counter retained)"
            - "artB met review captured ${stB} == ACTIVE, performances_logged ${cntB} == 0 (reset), next_review_date ${nrdB} == 2028-09-01T00:00:00Z (rolled from old date)"
            - "artA reinstatement captured ${stA2} == ACTIVE, performances_logged ${cntA} == 0, next_review_date ${nrdA} == 2028-12-01T00:00:00Z (clock now + 365 days)"
