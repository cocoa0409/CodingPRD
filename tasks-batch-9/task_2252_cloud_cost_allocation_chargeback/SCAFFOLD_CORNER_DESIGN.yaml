              - call: "GET /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "Bad Pool: HTTP 422 with data.error_id == \"ERR_PARTICIPANT_OUT_OF_SCOPE\"."
              - "Good Pool: HTTP 201 — the scope root and its descendant are both in scope."
              - "Pool list: meta.total_count == 1 and data[0].name == \"Good Pool\"."

        - name: provisioning_against_a_draft_policy_is_rejected
          claim_type: Violation → Error
          grounds: "§1.4 priority 54 ERR_POLICY_NOT_ACTIVE (409) on request creation, retag and approve; §1.1 TaggingPolicy.status starts DRAFT."
          distinguishing_aspect: "The reference itself resolves (the policy exists), so this is a state-of-the-referenced-entity check rather than a 404; activating the policy makes the identical body succeed."
          test_recipe:
            setup:
              - "One unit and one DRAFT policy that is never activated up front."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/tagging-policies"
                payload: { name: "Std", mandatory_dimensions: ["team", "environment", "application"] }
