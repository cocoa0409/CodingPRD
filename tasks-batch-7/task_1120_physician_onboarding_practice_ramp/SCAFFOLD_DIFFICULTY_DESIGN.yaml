            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 1, start_minute: 480, end_minute: 960, block_type: "CLINIC" }, as: PracticeManager, captures: { t1: "$.data.id" } }
