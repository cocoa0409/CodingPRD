      - name: system_and_computed_field_input_ignored_never_honoured
        claim_type: system_fields
        grounds:
          - entities.Store.fields.status
          - entities.FixturePlan.fields.capacity_units
          - entities.Item.fields.lifecycle_state
          - entities.StorePosition.fields.stock_status
          - entities.Receipt.fields.status
          - validations[priority:4]
        distinguishing_aspect: |
          Five writes each smuggle system and computed fields into the body alongside a fully valid input
          set. The server must MINT those fields itself and ignore the smuggled values - and it must not
          reject the request either, because the priority-4 shape rule enumerates missing fields, bad enums,
          out-of-range integers, money precision and datetime format, and undeclared keys are not on that
          list. Each probe is chosen so the smuggled value is clearly distinguishable from the correct one:
          status CLOSED vs the minted ACTIVE, capacity 9999 vs 60, lifecycle MARKDOWN vs ACTIVE,
