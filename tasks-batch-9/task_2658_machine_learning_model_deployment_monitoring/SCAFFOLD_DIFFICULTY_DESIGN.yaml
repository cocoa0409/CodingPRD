            - "the compensation is exact, not approximate: Deployment.${d1_id}.cumulative_ramp_delta_pct == 0.00, i.e. the signed deltas +5.00, +10.00, +20.00, -35.00 sum to zero"
            - "the appended row is a genuine reversal entry: GET /traffic-ramp-steps?deployment_id=${d1_id} returns total_count 4, and the fourth row has reason 'ROLLBACK_RELEASE', delta_pct -35.00 and to_traffic_pct 0.00"
            - "LEDGER RESTORED: ServingEndpoint.${se1_id}.allocated_traffic_pct == 10.00 — exactly the value it would have held had D1 never ramped, and exactly alloc_peak minus D1's released 35.00"
            - "SCOPED: the co-tenant is untouched — Deployment.${d2_id}.traffic_pct is still 10.00 and rollout_state is still 'RAMPING'"
