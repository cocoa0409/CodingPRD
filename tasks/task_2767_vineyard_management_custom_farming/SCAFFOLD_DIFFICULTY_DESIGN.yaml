  - rule_id: transitive_cascade
    instances:
      - name: spray_apply_cascades_five_levels_to_plan_posture
        grounds:
          - state_machines.SprayRecord.RECOMMENDED_to_APPLIED
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - calculations.spray_interval_clearances
          - calculations.farming_plan_committed_cost
          - calculations.farming_plan_budget_posture
          - concurrency_rules[spray-apply-stale-block]
          - entities.LaborCrew.fields.scheduled_work_order_count
        distinguishing_aspect: |
          One POST /spray-records/{id}/apply propagates five levels — SprayRecord clearances ->
          Block.rei_clear_at/compliance_posture -> auto-CANCEL of the SCHEDULED work order whose
          scheduled_start falls inside the new re-entry interval and whose crew is not pest
          certified -> LaborCrew.scheduled_work_order_count -> FarmingPlan.committed_cost and
