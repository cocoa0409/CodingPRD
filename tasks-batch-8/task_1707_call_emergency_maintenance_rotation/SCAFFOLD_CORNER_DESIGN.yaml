            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T12:00:00Z", end_at: "2026-08-01T20:00:00Z" }, as: PropertyAdmin, captures: { shC: $.data.id } }
