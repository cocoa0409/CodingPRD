            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-08", minutes: 960, service_category: "GIFT_SHOP" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e6: $.data.id } }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-09", minutes: 240, service_category: "GIFT_SHOP" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e7: $.data.id } }
          trigger:
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v1: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e1}/approve", payload: { expected_volunteer_version: "${v1}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e2}/approve", payload: { expected_volunteer_version: "${v2}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v3: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e3}/approve", payload: { expected_volunteer_version: "${v3}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v4: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e4}/approve", payload: { expected_volunteer_version: "${v4}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v5: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e5}/approve", payload: { expected_volunteer_version: "${v5}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v6: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e6}/approve", payload: { expected_volunteer_version: "${v6}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}/summary", as: VolunteerCoordinator, captures: { pts_mid: $.data.recognition_points, tier_mid: $.data.recognition_tier } }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v7: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e7}/approve", payload: { expected_volunteer_version: "${v7}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}/summary", as: VolunteerCoordinator, captures: { pts_fin: $.data.recognition_points, tier_fin: $.data.recognition_tier } }
            - { call: "GET /auxiliary/recognition-events", payload: {}, as: VolunteerCoordinator, captures: { ev_tier: "$.data[0].tier", ev_type: "$.data[0].event_type", ev_pts: "$.data[0].points_snapshot" } }
          assert:
            - "after 6 x 960min approvals: recognition_points == 96.00 and recognition_tier == NONE (below threshold)"
            - "after the 240min approval: recognition_points == 100.00 EXACTLY and recognition_tier == BRONZE (>= boundary is inclusive)"
            - "exactly one RecognitionEvent exists: event_type == TIER_INCREASED, tier == BRONZE, points_snapshot == 100.00"

