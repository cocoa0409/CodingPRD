      - name: fraud_pool_excludes_captured_items_and_clamps_the_weighted_score
        claim_type: input_set_filtering
        grounds:
          - calculations.retailer_fraud_score
          - state_machines.CouponItem
          - endpoints.POST./retailers/{id}/fraud-rescore
        distinguishing_aspect: |
          Only adjudicated items count: the retailer has 7 captured coupons but
          only the 4 in the finalized lot are in the denominator, so the
          counterfeit rate is 3/4 == 75.00 and not 3/7 == 42.86. The 2.00
          counterfeit weight then pushes the raw score to 150.00, which the
          min(100.00, ...) clamp caps at exactly 100.00 rather than letting it
          overflow the declared 0..100 range.
        test_recipe:
          setup:
            - "one retailer with a submission verified at 7, split into lot F (counted 4) and lot G (counted 3)"
            - "lot F holds 3 items whose barcode does not match the offer plus 1 clean item; lot G's 3 items are captured and its finalize is never called"
