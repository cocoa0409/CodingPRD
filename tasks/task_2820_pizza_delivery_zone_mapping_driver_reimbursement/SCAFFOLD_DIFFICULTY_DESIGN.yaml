# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2820 — Pizza Delivery Zone Mapping & Driver Reimbursement
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7.
# Every numeric literal in every `assert:` was computed by executing the
# relevant §1.3 formula as code before being written here.
#
# Shared literal geometry used throughout (store origin 39000000 / -84000000,
# MICRO_PER_MILE 15000, zone ring 38.90..39.20 N by 84.20..83.80 W,
# base_drive_minutes 6, minutes_per_mile 3, max_drive_time_minutes 40):
#   addr_a  (39030000, -84015000) grid 3.00  drive 15 IN_ZONE  BASE tier
#   addr_a2 (39015000, -84030000) grid 3.00  drive 15 IN_ZONE  BASE tier
#   addr_b  (39090000, -84045000) grid 9.00  drive 33 IN_ZONE  FAR  tier
#   addr_d  (39094950, -84000000) grid 6.33  drive 25 IN_ZONE  MID  tier
#   addr_g  (39169950, -84000000) grid 11.33 drive 40 IN_ZONE  (exactly at ceiling)
#   addr_h  (39170100, -84000000) grid 11.34 drive 41 EDGE     (one minute over)
#   addr_p  (39003750, -84000000) grid 0.25  drive  7 IN_ZONE
#   addr_q  (39000000, -84003750) grid 0.25  drive  7 IN_ZONE
#   addr_c  (39400000, -84000000) grid 26.67 drive 87 OUT_OF_ZONE (outside ring)
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: reimbursement_estimated_vs_actual_diverge_on_three_stop_route
        grounds:
          - calculations.dispatch_reimbursement
          - entities.Dispatch.fields.estimated_reimbursement_cents
          - entities.Dispatch.fields.actual_reimbursement_cents
          - entities.Dispatch.fields.reimbursement_variance_cents
          - entities.ReimbursementLine.fields.basis
          - state_machines.Dispatch.RETURNED_to_SETTLED
        distinguishing_aspect: |
          The two variants of dispatch_reimbursement read DIFFERENT mileage
          columns of the same three stops (planned_miles vs actual_miles) and
          therefore consume the cumulative tier-1 cap at different stops,
          producing 1170 cents on the ESTIMATED basis and 1203 cents on the
          ACTUAL basis, a +33 cent variance; this instance lives in the
          DRIVER PAYROLL domain (Dispatch / ReimbursementLine / Driver).
        test_recipe:
          setup:
            - "A store with the ceiling-40 zone model in force, three IN_ZONE addresses at grid 3.00, 3.00 and 9.00 miles."
            - "One CAR cost model: per_delivery 150, tier1_cap_miles 5.00, tier1 62c/mi, tier2 41c/mi, per-stop minimum 100."
            - "One QUALIFIED, insured CAR driver."
            - "Three orders, all fee-disclosed and READY, stacked in that order onto one dispatch which is locked, departed and fully delivered with odometer readings 3.40, 2.80 and 9.60 miles, then returned."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000, promise_minutes: 30, delivery_fee_cents: 399, cash_limit_cents: 5000, hot_bag_count: 4, max_stacked_stops: 3, handoff_minutes_per_stop: 6, dispatch_reset_buffer_minutes: 10, service_posture: "OPEN" }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "12 Oak St", latitude_micro: 39030000, longitude_micro: -84015000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_a_id: $.data.id }
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "44 Elm St", latitude_micro: 39015000, longitude_micro: -84030000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_a2_id: $.data.id }
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "900 Ridge Rd", latitude_micro: 39090000, longitude_micro: -84045000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_b_id: $.data.id }
            - call: "POST /store-ops/vehicle-cost-models"
              payload: { store_id: "${store_id}", vehicle_class: "CAR", per_delivery_cents: 150, tier1_cap_miles: 5.00, tier1_per_mile_cents: 62, tier2_per_mile_cents: 41, min_reimbursement_per_stop_cents: 100, effective_from: "2026-07-01T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { cm_car_id: $.data.id }
            - call: "POST /store-ops/drivers"
              payload: { store_id: "${store_id}", full_name: "Dana Ortiz", license_number: "DL-1001", vehicle_class: "CAR" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /store-ops/drivers/${drv_id}/mvr-checks"
