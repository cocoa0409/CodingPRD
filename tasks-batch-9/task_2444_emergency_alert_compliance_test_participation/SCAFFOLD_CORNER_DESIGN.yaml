          - "§1.5 the twelve GET /{resource}/{id} read endpoints, each open to all four roles"
        distinguishing_aspect: "Every one of the twelve declared 404 ids is reachable, each on a syntactically valid but unresolvable UUID, and each error id is distinct per resource — no endpoint collapses to a shared generic not-found code."
