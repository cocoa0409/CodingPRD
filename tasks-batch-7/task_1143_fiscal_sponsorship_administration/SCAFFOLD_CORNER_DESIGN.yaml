          trigger:
            - { call: "POST /fsa/donations/${d}/request-refund", payload: { amount_cents: 100001, reason: "too much" }, as: Donor, as_user_id: user_donor_1, captures: { e: $.data.error_id } }
          assert:
            - "error_id == ERR_REFUND_EXCEEDS_REMAINING; status remains RECEIVED; pending_refund_amount_cents stays null"

      - name: v_remediation_overcount_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=30]", "errors[ERR_REMEDIATION_EXCEEDS_OPEN]"]
