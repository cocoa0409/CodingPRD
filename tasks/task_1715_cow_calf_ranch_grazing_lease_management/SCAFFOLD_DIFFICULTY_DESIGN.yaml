# =============================================================================
# §1.8: Scaffold Difficulty Design (Test Targeting Index)
# Cow-Calf Ranch & Grazing Lease Management
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: lease_settlement_allotment_vs_actual_use
        grounds:
          - calculations.lease_settlement_charge
          - entities.GrazingLease.fields.settlement_basis
          - entities.LeaseStatement.fields.total_due_cents
        distinguishing_aspect: |
          Dual-variant logic on the LEASE FINANCE domain: two leases with identical terms and identical
          measured usage (400.0 AUM) settle differently purely because of settlement_basis —
          ALLOTMENT bills the full 500-AUM allotment (1250000.0 cents) while ACTUAL_USE bills
          max(usage, minimum_commit) (1000000.0 cents).
        test_recipe:
          setup:
            - "Ranch R (posture NORMAL by default); LEASED pasture P base_capacity_aum=1000"
            - "Two leases on P with identical terms (allotment 500, rate 2500c, minimum_commit 300, tier1 cap 75 @3000c, tier2 @3750c, window 2026-01-01..2026-12-31): LA basis ALLOTMENT, LB basis ACTUAL_USE; both ACTIVE (aggregate 1000 <= 1000)"
            - "HerdGroup G: 200 MATURE_COW @1000 lbs; one assignment on P 2026-03-01..2026-04-30 (60 days), completed on schedule => consumed_aum 400.0 within period 2026"
            - "Clock advanced to 2026-05-01 so completion is legal"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "DV Ranch", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "Section 12", acreage: 3000, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 1000 }, as: RangeManager, captures: { pasture_id: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${pasture_id}", lessor_name: "Bureau of Land Mgmt", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 500, rate_per_aum_cents: 2500, minimum_commit_aum: 300, overage_tier1_cap_aum: 75, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ALLOTMENT" }, as: RangeManager, captures: { lease_a: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${pasture_id}", lessor_name: "Bureau of Land Mgmt", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 500, rate_per_aum_cents: 2500, minimum_commit_aum: 300, overage_tier1_cap_aum: 75, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease_b: $.data.id } }
            - { call: "POST /api/grazing-leases/${lease_a}/activate", payload: {}, as: RangeManager }
            - { call: "POST /api/grazing-leases/${lease_b}/activate", payload: {}, as: RangeManager }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 200, avg_weight_lbs: 1000 }, as: HerdManager, captures: { group_id: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${group_id}", ranch_id: "${ranch_id}", start_date: "2026-03-01", planned_end_date: "2026-04-30" }, as: RangeManager, captures: { asg_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/grazing-assignments/${asg_id}/complete", payload: { actual_end_date: "2026-04-30" }, as: RangeManager }
          trigger:
            - { call: "POST /api/lease-statements", payload: { lease_id: "${lease_a}", ranch_id: "${ranch_id}", period_year: 2026 }, as: RangeManager, captures: { stmt_a: $.data.id } }
            - { call: "POST /api/lease-statements", payload: { lease_id: "${lease_b}", ranch_id: "${ranch_id}", period_year: 2026 }, as: RangeManager, captures: { stmt_b: $.data.id } }
          assert:
            - "LeaseStatement.${stmt_a}.actual_aum_used == 400.0 and LeaseStatement.${stmt_b}.actual_aum_used == 400.0 (identical measured usage)"
            - "LeaseStatement.${stmt_a}.base_charge_cents == 1250000.0 (500 allotment x 2500)"
            - "LeaseStatement.${stmt_b}.base_charge_cents == 1000000.0 (max(400.0, 300) x 2500)"
            - "LeaseStatement.${stmt_a}.total_due_cents == 1250000.0 and LeaseStatement.${stmt_b}.total_due_cents == 1000000.0 — same usage, different variant, different money"
            - "Both statements have overage_charge_cents == 0.0 (usage below allotment)"

      - name: adj205_age_only_vs_dam_adjusted
        grounds:
          - calculations.adjusted_205d_weight
          - entities.CalfCrop.fields.adj205_age_only_lbs
          - entities.CalfCrop.fields.adj205_dam_adjusted_lbs
        distinguishing_aspect: |
          Dual-variant logic on the CALF GROWTH domain (different entity domain than lease finance):
          one weaning record produces two adjusted 205-day weights — AGE_ONLY 572.0 lbs vs
          AGE_DAM 626.0 lbs for a 2-year-old-dam crop (dam-age adjustment +54.0).
        test_recipe:
          setup:
            - "Ranch R; HerdGroup G 60 MATURE_COW @1000; BreedingSeason S (exposed 50 -> required_bull_count 2) driven to GESTATION via two PASSED bulls turned in 2026-04-15..2026-06-15 and removed"
            - "CalfCrop C created from S: 100 steers, 60 heifers; clock set to 2026-09-15"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Adj Ranch", hq_state: "WY" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { group_id: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${group_id}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 50 }, as: HerdManager, captures: { season_id: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B101", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { bull1: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B102", breed: "ANGUS", birth_year: 2020 }, as: HerdManager, captures: { bull2: $.data.id } }
            - { call: "POST /api/bulls/${bull1}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 34.5 }, as: HerdManager }
            - { call: "POST /api/bulls/${bull2}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 36.0 }, as: HerdManager }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${bull1}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { to1: $.data.id } }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${bull2}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { to2: $.data.id } }
            - { call: "POST /api/bull-turnouts/${to1}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to2}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${season_id}/begin-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to1}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to2}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${season_id}/end-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/calf-crops", payload: { breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", crop_year: 2026, steer_head: 100, heifer_head: 60 }, as: HerdManager, captures: { crop_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: RanchManager }
          trigger:
            - { call: "POST /api/calf-crops/${crop_id}/record-weaning", payload: { weaning_date: "2026-09-15", avg_wean_weight_lbs: 560, avg_wean_age_days: 200, avg_birth_weight_lbs: 80, avg_dam_age_years: 2 }, as: HerdManager }
          assert:
            - "CalfCrop.${crop_id}.adj205_age_only_lbs == 572.0  ((560-80)/200*205+80)"
            - "CalfCrop.${crop_id}.adj205_dam_adjusted_lbs == 626.0  (572.0 + DAM_ADJ 54 for 2-year-old dams)"
            - "CalfCrop.${crop_id}.wean_status == WEANED"
            - "adj205_dam_adjusted_lbs - adj205_age_only_lbs == 54.0 — identical inputs, variant divergence"

  # ---------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes)
  # ---------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: aum_demand_class_weight_day_interaction
        grounds:
          - calculations.animal_unit_factor
          - calculations.grazing_aum_demand
          - entities.GrazingAssignment.fields.reserved_aum
        distinguishing_aspect: |
          Mode (a): a 3+-input formula with non-linear interaction — class-conditional base AU,
          max(0, weight-1000) weight branch, day scaling. 120 MATURE_COW @1150 lbs over 60 days
          reserve 250.8 AUM; 120 GROWING @1150 over 60 days reserve 188.11 AUM — the class branch
          changes the multiplier the weight branch compounds on.
        test_recipe:
          setup:
            - "Ranch R (posture NORMAL); DEEDED pasture P base_capacity_aum 1000, min_rest_days 45"
            - "Group GC: 120 MATURE_COW @1150; Group GG: 120 GROWING @1150"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "AU Ranch", hq_state: "CO" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "Bench", acreage: 2000, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 1000, min_rest_days: 45 }, as: RangeManager, captures: { pasture_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 120, avg_weight_lbs: 1150 }, as: HerdManager, captures: { g_cows: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Yearlings", animal_class: "GROWING", head_count: 120, avg_weight_lbs: 1150 }, as: HerdManager, captures: { g_grow: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g_cows}", ranch_id: "${ranch_id}", start_date: "2026-06-01", planned_end_date: "2026-07-31" }, as: RangeManager, captures: { asg_cow: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g_grow}", ranch_id: "${ranch_id}", start_date: "2026-09-15", planned_end_date: "2026-11-14" }, as: RangeManager, captures: { asg_gro: $.data.id } }
          assert:
            - "GrazingAssignment.${asg_cow}.au_factor == 1.045  (1.00 x (1 + 150/1000 x 0.30))"
            - "GrazingAssignment.${asg_cow}.reserved_aum == 250.8  (120 x 1.045 x 60 / 30)"
            - "GrazingAssignment.${asg_gro}.au_factor == 0.7838  (0.75 x 1.045 rounded to 4 dp)"
            - "GrazingAssignment.${asg_gro}.reserved_aum == 188.11  (120 x 0.7838 x 60 / 30 = 188.112 -> 188.11)"
            - "Pasture.${pasture_id}.available_aum == 561.09  (1000 - 250.8 - 188.11)"

      - name: sale_settlement_per_head_rounding_then_multiply
        grounds:
          - calculations.sale_lot_settlement
          - entities.SaleLot.fields.per_head_gross_cents
          - entities.SaleLot.fields.gross_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins round-per-head-THEN-multiply:
          at 96 head the pinned order yields gross 12891442.56 while the alternative
          lot-weight-x-price order yields 12891442.18 (a 38-cent divergence). Asserts pin slide-up
          pricing, CERTIFIED premium applied after the slide, per-head rounding, and the net waterfall.
        test_recipe:
          setup:
            - "Ranch R; season S driven to GESTATION (2 qualified bulls, exposed 50); CalfCrop C: 100 steers / 60 heifers"
            - "C WEANED on 2026-09-15 (560 lbs, 200 d, 80 birth, dam age 5); precon ENROLLED; vaccine rounds 2026-09-20 and 2026-10-10; clock 2026-10-30 (45 days); CERTIFIED"
            - "SaleLot L: 96 STEER, base 25000c/cwt @550 lbs, slide 15c/lb, shrink 0.04, claim CERTIFIED, freight 3500c/head, commission 0.03; OFFERED then CONTRACTED"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Sale Ranch", hq_state: "NE" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { group_id: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${group_id}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 50 }, as: HerdManager, captures: { season_id: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B201", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { bull1: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B202", breed: "ANGUS", birth_year: 2020 }, as: HerdManager, captures: { bull2: $.data.id } }
            - { call: "POST /api/bulls/${bull1}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 34.5 }, as: HerdManager }
            - { call: "POST /api/bulls/${bull2}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 36.0 }, as: HerdManager }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${bull1}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { to1: $.data.id } }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${bull2}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { to2: $.data.id } }
            - { call: "POST /api/bull-turnouts/${to1}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to2}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${season_id}/begin-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to1}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to2}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${season_id}/end-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/calf-crops", payload: { breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", crop_year: 2026, steer_head: 100, heifer_head: 60 }, as: HerdManager, captures: { crop_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/calf-crops/${crop_id}/record-weaning", payload: { weaning_date: "2026-09-15", avg_wean_weight_lbs: 560, avg_wean_age_days: 200, avg_birth_weight_lbs: 80, avg_dam_age_years: 5 }, as: HerdManager }
            - { call: "POST /api/calf-crops/${crop_id}/enroll-preconditioning", payload: {}, as: HerdManager }
            - { call: "POST /api/calf-crops/${crop_id}/record-vaccine", payload: { round_number: 1, vaccine_date: "2026-09-20" }, as: HerdManager }
            - { call: "POST /api/calf-crops/${crop_id}/record-vaccine", payload: { round_number: 2, vaccine_date: "2026-10-10" }, as: HerdManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/calf-crops/${crop_id}/certify-preconditioning", payload: {}, as: HerdManager }
            - { call: "POST /api/sale-lots", payload: { calf_crop_id: "${crop_id}", ranch_id: "${ranch_id}", lot_class: "STEER", head_count: 96, base_price_cents_per_cwt: 25000, slide_cents_per_lb: 15, base_weight_lbs: 550, shrink_pct: 0.04, precon_claim: "CERTIFIED", freight_cents_per_head: 3500, commission_pct: 0.03 }, as: SalesAgent, as_user_id: "u-sale-1", captures: { lot_id: $.data.id } }
            - { call: "POST /api/sale-lots/${lot_id}/offer", payload: {}, as: SalesAgent, as_user_id: "u-sale-1" }
            - { call: "POST /api/sale-lots/${lot_id}/contract", payload: { buyer_name: "Five Rivers" }, as: SalesAgent, as_user_id: "u-sale-1" }
          trigger:
            - { call: "POST /api/sale-lots/${lot_id}/deliver", payload: { delivered_avg_weight_lbs: 535 }, as: SalesAgent, as_user_id: "u-sale-1" }
          assert:
            - "SaleLot.${lot_id}.pay_weight_lbs == 513.6  (535 x 0.96)"
            - "SaleLot.${lot_id}.final_price_cents_per_cwt == 26146.0  (25000 + (550-513.6) x 15 slide-up = 25546, then + 600 CERTIFIED premium — slide BEFORE premium)"
            - "SaleLot.${lot_id}.per_head_gross_cents == 134285.86  (26146.0 x 513.6 / 100 = 134285.856, rounded per head)"
            - "SaleLot.${lot_id}.gross_cents == 12891442.56  (134285.86 x 96 — pinned round-per-head-first; lot-level order would give 12891442.18)"
            - "SaleLot.${lot_id}.commission_cents == 386743.28  (gross x 0.03)"
            - "SaleLot.${lot_id}.freight_cents == 336000  (96 x 3500)"
            - "SaleLot.${lot_id}.net_settlement_cents == 12168699.28"
            - "SaleLot.${lot_id}.lot_status == DELIVERED"

      - name: destock_single_pass_class_priority
        grounds:
          - calculations.destock_required_reduction
          - calculations.ranch_production_pct_and_posture
          - entities.DestockOrder.fields.required_reduction_head
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the AUM deficit depends on herd demand, but every head
          removed changes demand; the scaffold pins a single left-to-right pass in class-priority order
          (GROWING, then MATURE_COW, then REPLACEMENT_HEIFER) with ceil per group: deficit 55.8 is
          covered by liquidating all 40 GROWING (30.0 AUM) plus ceil(25.8/1.03)=26 MATURE_COW => 66 head,
          and the REPLACEMENT_HEIFER group is never touched.
        test_recipe:
          setup:
            - "Ranch R (destock_grace_days default 30); pastures P1 base 300, P2 base 200 (both DEEDED)"
            - "Groups: G1 40 GROWING @800 (30.0 AUM/mo), G2 60 MATURE_COW @1100 (61.8), G3 20 REPLACEMENT_HEIFER @700 (14.0) — total demand 105.8"
            - "Assessment: P1 @40 pct, P2 @50 pct -> ranch pct 44.0 -> CRITICAL; supply 500 x 0.5 / 5 = 50.0; deficit 55.8"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Dry Ranch", hq_state: "NV" }, as: RanchManager, captures: { ranch_id: $.data.id, ranch_v: $.data.version } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "North", acreage: 1500, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 300 }, as: RangeManager, captures: { p1: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "South", acreage: 1000, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 200 }, as: RangeManager, captures: { p2: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Stockers", animal_class: "GROWING", head_count: 40, avg_weight_lbs: 800 }, as: HerdManager, captures: { g1: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1100 }, as: HerdManager, captures: { g2: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Heifers", animal_class: "REPLACEMENT_HEIFER", head_count: 20, avg_weight_lbs: 700 }, as: HerdManager, captures: { g3: $.data.id } }
            - { call: "POST /api/drought-assessments", payload: { ranch_id: "${ranch_id}", assessment_date: "2026-08-01", pasture_measurements: [ { pasture_id: "${p1}", production_pct_of_normal: 40 }, { pasture_id: "${p2}", production_pct_of_normal: 50 } ] }, as: RangeManager, captures: { asm_id: $.data.id } }
          trigger:
            - { call: "POST /api/drought-assessments/${asm_id}/finalize", payload: { expected_ranch_version: "${ranch_v}" }, as: RangeManager }
          assert:
            - "DroughtAssessment.${asm_id}.ranch_production_pct == 44.0 and resulting_posture == CRITICAL"
            - "DroughtAssessment.${asm_id}.monthly_supply_aum == 50.0 and monthly_demand_aum == 105.8 and deficit_aum_per_30d == 55.8"
            - "Exactly one DestockOrder exists for ranch: required_reduction_head == 66 (40 GROWING + 26 MATURE_COW, single pass, ceil per group), received_reduction_head == 0, deadline_date == 2026-08-31, order_status == OPEN"
            - "The 26-head cow removal overshoots (26 x 1.03 = 26.78 >= 25.8 residual) — ceil overshoot is pinned, REPLACEMENT_HEIFER group contributes 0"

  # ---------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (three entities)
  # ---------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: lease_suspend_reinstate_cycle
        grounds:
          - state_machines.GrazingLease.ACTIVE_to_SUSPENDED
          - state_machines.GrazingLease.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on GrazingLease: ACTIVE -> SUSPENDED -> ACTIVE -> SUSPENDED -> ACTIVE loops
          without bound; version increments on every hop (1 create .. 7 terminate), and the cycle
          terminates only via TERMINATED from SUSPENDED.
        test_recipe:
          setup:
