scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Canonical fixtures referenced by the chains below (all literals, no magic):
  #   logical clock startup default            = 2026-08-01T00:00:00Z
  #   StandardDomain set (weights sum 1.00):
  #     LEARNING_ENVIRONMENT  block 1 max 20 min 10 weight 0.30 observation_linked true  min_composite 4.00
  #     STAFF_QUALIFICATIONS  block 1 max 20 min  8 weight 0.20 observation_linked false
  #     FAMILY_PARTNERSHIP    block 2 max 20 min 10 weight 0.20 observation_linked false
  #     ADMINISTRATION        block 2 max 20 min 10 weight 0.15 observation_linked false
  #     CHILD_ASSESSMENT      block 3 max 20 min 10 weight 0.15 observation_linked false
  #   "T1 spine"  = the tier-1 ACTIVE provider spine (single lead observer, all raw_score 4.0,
  #                 composite 4.00, verified {LE 12, SQ 8, FP 0, AD 0, CA 0}, weighted_total 26.00,
  #                 points_tier 1, highest_block_cleared 1, awarded_tier 1, validity_months 24,
  #                 awarded_on 2026-08-11, effective_date 2026-09-01, expires_on 2028-08-31)
  #   "T4/T5 spine" = the two-observer spine (all raw_score 6.0, composite 6.00, reliability 100.00)
  # ---------------------------------------------------------------------------

  - section: entities
    instances:
      - name: create_provider_returns_applied_with_echoed_inputs
        claim_type: creation
        grounds:
          - endpoints[POST /providers]
          - entities.Provider.fields.legal_name
          - entities.Provider.fields.region_code
          - entities.Provider.fields.status
        distinguishing_aspect: "POST /providers with every required input returns 201 and a Provider whose input-sourced fields echo the request verbatim while status is forced to APPLIED."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /providers", payload: { legal_name: "Sunrise Center", license_number: "LIC-3001", county_code: "DANE", region_code: "URBAN", licensed_capacity: 60, active_staff_fte: 1.00, weekly_onsite_cap_hours: 12 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
          assert:
            - "HTTP status == 201"
            - "Provider.${pid}.legal_name == 'Sunrise Center'"
            - "Provider.${pid}.license_number == 'LIC-3001'"
            - "Provider.${pid}.county_code == 'DANE'"
            - "Provider.${pid}.region_code == URBAN"
            - "Provider.${pid}.licensed_capacity == 60"
            - "Provider.${pid}.active_staff_fte == 1.00"
            - "Provider.${pid}.status == APPLIED"

      - name: provider_system_fields_are_server_minted_at_creation
        claim_type: system_fields
        grounds:
          - entities.Provider.fields.status
          - entities.Provider.fields.enrolled_on
          - endpoints[POST /providers]
        distinguishing_aspect: "id, created_at and version are server-minted (version == 1) and enrolled_on is null while status is APPLIED, even though the request supplied no such fields."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Sunrise Center", license_number: "LIC-3001", county_code: "DANE", region_code: "URBAN", licensed_capacity: 60, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
          trigger:
            - { call: "GET /providers/${pid}", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1" }
          assert:
            - "Provider.${pid}.id is a non-empty string"
            - "Provider.${pid}.version == 1"
            - "Provider.${pid}.created_at == '2026-08-03T00:00:00Z'"
            - "Provider.${pid}.enrolled_on == null"
            - "Provider.${pid}.status == APPLIED"

      - name: provider_computed_fields_initialised_to_unrated_posture
        claim_type: computed_fields
        grounds:
          - entities.Provider.fields.current_rating_cycle_id
          - entities.Provider.fields.current_tier
          - entities.Provider.fields.credential_compliance_pct
          - entities.Provider.fields.reimbursement_adjustment_cents
          - entities.Provider.fields.public_listing_visible
        distinguishing_aspect: "All five computed Provider fields hold their unrated defaults immediately after creation: current_rating_cycle_id null, current_tier null, credential_compliance_pct 0.00, reimbursement_adjustment_cents 0, public_listing_visible false."
        test_recipe:
          setup:
            - "Empty database; one APPLIED provider with no credentials and no rating cycle."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Sunrise Center", license_number: "LIC-3001", county_code: "DANE", region_code: "URBAN", licensed_capacity: 60, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
          trigger:
            - { call: "GET /providers/${pid}", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1" }
          assert:
            - "Provider.${pid}.current_rating_cycle_id == null"
            - "Provider.${pid}.current_tier == null"
            - "Provider.${pid}.credential_compliance_pct == 0.00"
            - "Provider.${pid}.reimbursement_adjustment_cents == 0"
            - "Provider.${pid}.public_listing_visible == false"

      - name: provider_weekly_onsite_cap_hours_default_twelve
        claim_type: defaults
        grounds:
          - entities.Provider.fields.weekly_onsite_cap_hours
          - endpoints[POST /providers]
        distinguishing_aspect: "Omitting the optional weekly_onsite_cap_hours yields exactly 12 (the declared default), not null and not 0."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /providers", payload: { legal_name: "Default Cap Center", license_number: "LIC-3002", county_code: "DANE", region_code: "RURAL", licensed_capacity: 30, active_staff_fte: 2.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
          assert:
            - "HTTP status == 201"
            - "Provider.${pid}.weekly_onsite_cap_hours == 12"

      - name: create_provider_missing_license_number_rejected
        claim_type: required_fields
        grounds:
          - entities.Provider.fields.license_number
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "license_number has source input with no default, so omitting it returns ERR_VALIDATION (422) and persists no Provider row."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /providers", payload: { legal_name: "No License Center", county_code: "DANE", region_code: "URBAN", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_VALIDATION'"
            - "GET /providers returns total_count == 0"

      - name: create_provider_region_code_outside_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Provider.fields.region_code
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "region_code accepts only {URBAN, RURAL, FRONTIER}; the value SUBURBAN returns ERR_VALIDATION (422) rather than being stored or coerced."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /providers", payload: { legal_name: "Bad Region Center", license_number: "LIC-3003", county_code: "DANE", region_code: "SUBURBAN", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_VALIDATION'"
            - "GET /providers returns total_count == 0"

      - name: staff_credential_level_above_six_rejected
        claim_type: type_constraints
        grounds:
          - entities.StaffCredential.fields.credential_level
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "credential_level is bounded 1..6; the value 7 returns ERR_VALIDATION (422) and leaves Provider.credential_compliance_pct at 0.00."
        test_recipe:
          setup:
            - "One ENROLLED provider with active_staff_fte 1.00 and no credentials."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Sunrise Center", license_number: "LIC-3001", county_code: "DANE", region_code: "URBAN", licensed_capacity: 60, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
            - { call: "POST /providers/${pid}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /providers/${pid}/staff-credentials", payload: { staff_registry_id: "REG-1", role_type: "DIRECTOR", credential_level: 7, fte: 1.00 }, as: Provider, as_user_id: "${pid}" }
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_VALIDATION'"
            - "GET /staff-credentials?provider_id=${pid} returns total_count == 0"
            - "Provider.${pid}.credential_compliance_pct == 0.00"

      - name: get_provider_unknown_id_returns_provider_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_PROVIDER_NOT_FOUND]
          - endpoints[GET /providers/{provider_id}]
        distinguishing_aspect: "A syntactically valid but unknown provider_id on GET /providers/{provider_id} returns ERR_PROVIDER_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "One provider exists so the collection is non-empty, guaranteeing the 404 comes from id resolution and not from an empty table."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Sunrise Center", license_number: "LIC-3001", county_code: "DANE", region_code: "URBAN", licensed_capacity: 60, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
          trigger:
            - { call: "GET /providers/00000000-0000-0000-0000-0000000000ff", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1" }
          assert:
            - "HTTP status == 404"
            - "data.error_id == 'ERR_PROVIDER_NOT_FOUND'"

      - name: list_providers_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /providers]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With 3 providers stored, GET /providers?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Three APPLIED providers with distinct license numbers."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "A Center", license_number: "LIC-3001", county_code: "DANE", region_code: "URBAN", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "B Center", license_number: "LIC-3002", county_code: "DANE", region_code: "RURAL", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "C Center", license_number: "LIC-3003", county_code: "ROCK", region_code: "FRONTIER", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "GET /providers", payload: { limit: 2, offset: 0 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "GET /providers", payload: { limit: 2, offset: 2 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          assert:
            - "first response data length == 2 with meta pagination total_count == 3 and has_more == true"
            - "second response data length == 1 with total_count == 3 and has_more == false"
            - "response_type == 'array' on both responses"

      - name: observation_score_is_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ObservationScore.fields.attempt_no
          - entities.ObservationScore.fields.is_current
          - endpoints[GET /observation-scores/{observation_score_id}]
        distinguishing_aspect: "ObservationScore declares common_fields false: re-submitting SPACE_FURNISHINGS appends attempt_no 2 and flips attempt_no 1 to is_current false; the attempt_no 1 row's raw_score 4.0 is still readable and the payload exposes no version field."
        test_recipe:
          setup:
            - "T1 spine driven up to an IN_PROGRESS visit with one SPACE_FURNISHINGS score of 4.0 entered by the lead observer at clock 2026-08-10T09:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "LEARNING_ENVIRONMENT", block_level: 1, max_points: 20, block_min_points: 10, weight: 0.30, observation_linked: true, min_composite_for_block: 4.00 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "STAFF_QUALIFICATIONS", block_level: 1, max_points: 20, block_min_points: 8, weight: 0.20, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "FAMILY_PARTNERSHIP", block_level: 2, max_points: 20, block_min_points: 10, weight: 0.20, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "ADMINISTRATION", block_level: 2, max_points: 20, block_min_points: 10, weight: 0.15, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "CHILD_ASSESSMENT", block_level: 3, max_points: 20, block_min_points: 10, weight: 0.15, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Sunrise Center", license_number: "LIC-3001", county_code: "DANE", region_code: "URBAN", licensed_capacity: 60, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
            - { call: "POST /providers/${pid}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers/${pid}/staff-credentials", payload: { staff_registry_id: "REG-1", role_type: "DIRECTOR", credential_level: 5, fte: 1.00, employment_status: "ACTIVE" }, as: Provider, as_user_id: "${pid}", captures: { cred1: $.data.id } }
            - { call: "POST /staff-credentials/${cred1}/registry-link", payload: { registry_status: "VERIFIED", verified_on: "2026-08-03T00:00:00Z", expires_on: "2030-01-01T00:00:00Z", credential_level: 5 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "GET /providers/${pid}", payload: {}, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pver: $.data.version } }
            - { call: "POST /providers/${pid}/rating-cycles", payload: { cycle_type: "INITIAL", expected_provider_version: "${pver}" }, as: Provider, as_user_id: "${pid}", captures: { cid: $.data.id } }
            - { call: "POST /rating-cycles/${cid}/self-assessments", payload: { claimed_points: { LEARNING_ENVIRONMENT: 12, STAFF_QUALIFICATIONS: 8, FAMILY_PARTNERSHIP: 0, ADMINISTRATION: 0, CHILD_ASSESSMENT: 0 }, documentation: [ { domain_code: "LEARNING_ENVIRONMENT", evidence_type: "LESSON_PLAN", reference_label: "LP-1", page_count: 4 }, { domain_code: "STAFF_QUALIFICATIONS", evidence_type: "ROSTER", reference_label: "RO-1", page_count: 2 } ] }, as: Provider, as_user_id: "${pid}", captures: { said: $.data.id } }
            - { call: "POST /self-assessments/${said}/verification-decisions", payload: { decision: "APPROVE", verified_points: { LEARNING_ENVIRONMENT: 12, STAFF_QUALIFICATIONS: 8, FAMILY_PARTNERSHIP: 0, ADMINISTRATION: 0, CHILD_ASSESSMENT: 0 } }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /observers", payload: { full_name: "Lead Obs", tool_code: "ERS_EARLY_CHILDHOOD" }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { lead_oid: $.data.id } }
            - { call: "POST /observers/${lead_oid}/reliability-certifications", payload: { decision: "CERTIFY", anchor_agreement_pct: 96.00, certified_until: "2026-12-31T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /rating-cycles/${cid}/observation-visits", payload: { lead_observer_id: "${lead_oid}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T17:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { vid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /observation-visits/${vid}/scores", payload: { subscale_code: "SPACE_FURNISHINGS", raw_score: 4.0 }, as: Observer, as_user_id: "${lead_oid}", captures: { sc1: $.data.id } }
          trigger:
            - { call: "POST /observation-visits/${vid}/scores", payload: { subscale_code: "SPACE_FURNISHINGS", raw_score: 6.0 }, as: Observer, as_user_id: "${lead_oid}", captures: { sc2: $.data.id } }
          assert:
            - "ObservationScore.${sc2}.attempt_no == 2 and ObservationScore.${sc2}.is_current == true"
            - "ObservationScore.${sc1}.attempt_no == 1 and ObservationScore.${sc1}.is_current == false"
            - "ObservationScore.${sc1}.raw_score == 4.0 (the superseded row is never mutated in place)"
            - "GET /observation-scores/${sc1} response data contains no 'version' key"
            - "GET /observation-scores?observation_visit_id=${vid}&subscale_code=SPACE_FURNISHINGS returns total_count == 2"

      - name: self_assessment_under_unknown_cycle_returns_rating_artifact_not_found
        claim_type: parent_relationships
        grounds:
          - entities.SelfAssessment.parent
          - validations[priority=3]
          - errors[ERR_RATING_ARTIFACT_NOT_FOUND]
        distinguishing_aspect: "SelfAssessment is a child of RatingCycle: posting one under an unknown rating_cycle_id returns ERR_RATING_ARTIFACT_NOT_FOUND (404) and creates nothing, even though the acting Provider owns a real cycle."
        test_recipe:
          setup:
            - "One ENROLLED provider owning one DRAFT rating cycle; the 5 StandardDomain rows exist."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "LEARNING_ENVIRONMENT", block_level: 1, max_points: 20, block_min_points: 10, weight: 0.30, observation_linked: true, min_composite_for_block: 4.00 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "STAFF_QUALIFICATIONS", block_level: 1, max_points: 20, block_min_points: 8, weight: 0.20, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "FAMILY_PARTNERSHIP", block_level: 2, max_points: 20, block_min_points: 10, weight: 0.20, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "ADMINISTRATION", block_level: 2, max_points: 20, block_min_points: 10, weight: 0.15, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /standard-domains", payload: { domain_code: "CHILD_ASSESSMENT", block_level: 3, max_points: 20, block_min_points: 10, weight: 0.15, observation_linked: false }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Sunrise Center", license_number: "LIC-3001", county_code: "DANE", region_code: "URBAN", licensed_capacity: 60, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
            - { call: "POST /providers/${pid}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pver: $.data.version } }
            - { call: "POST /providers/${pid}/rating-cycles", payload: { cycle_type: "INITIAL", expected_provider_version: "${pver}" }, as: Provider, as_user_id: "${pid}", captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /rating-cycles/00000000-0000-0000-0000-0000000000ff/self-assessments", payload: { claimed_points: { LEARNING_ENVIRONMENT: 12, STAFF_QUALIFICATIONS: 8, FAMILY_PARTNERSHIP: 0, ADMINISTRATION: 0, CHILD_ASSESSMENT: 0 }, documentation: [ { domain_code: "LEARNING_ENVIRONMENT", evidence_type: "LESSON_PLAN", reference_label: "LP-1", page_count: 4 } ] }, as: Provider, as_user_id: "${pid}" }
          assert:
            - "HTTP status == 404"
            - "data.error_id == 'ERR_RATING_ARTIFACT_NOT_FOUND'"
            - "GET /self-assessments?rating_cycle_id=${cid} returns total_count == 0"
            - "RatingCycle.${cid}.status == DRAFT"

      - name: rating_cycle_read_exposes_hybrid_cross_spine_links
        claim_type: hybrid
        grounds:
          - entities.RatingCycle.fields.supersedes_cycle_id
          - entities.Provider.fields.current_rating_cycle_id
          - endpoints[GET /rating-cycles/{rating_cycle_id}]
          - endpoints[GET /rating-cycles]
        distinguishing_aspect: "The hybrid topology is observable in one read: the second (RERATING) cycle carries supersedes_cycle_id pointing at the first cycle while Provider.current_rating_cycle_id still points at the first, and GET /rating-cycles?supersedes_cycle_id=<first> finds exactly the second."
        test_recipe:
          setup:
            - "T1 spine: provider ACTIVE at 2026-09-01 holding cycle 1 ACTIVE (awarded_tier 1, expires_on 2028-08-31, rerating_window_opens_on 2028-06-02)."
