              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
