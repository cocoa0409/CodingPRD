              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { term_id: "$.data.id" }
            - call: "POST /stipend-policies"
              payload: { term_id: "${term_id}", assistantship_type: "RESEARCH", degree_level: "DOCTORAL", min_fte_monthly_stipend_cents: 400000, per_credit_tuition_cents: 50000, max_remission_cents_per_term: 900000, term_insurance_premium_cents: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /pay-periods"
              payload: { term_id: "${term_id}", sequence_no: 1, period_start: "2026-09-01", period_end_exclusive: "2027-01-01", pay_date: "2027-01-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms/${term_id}/open"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /students"
              payload: { student_number: "GS-1070", full_name: "Ada Vance", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.60, enrolled_credit_hours: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { student_id: "$.data.id" }
          trigger:
            - call: "POST /appointments"
              payload: { student_id: "${student_id}", department_id: "${dept_id}", term_id: "${term_id}", assistantship_type: "RESEARCH", effort_pct: 110, start_date: "2026-09-01", end_date: "2026-12-31", monthly_stipend_cents: 300000, supervisor_user_id: "user-fac-7" }
              as: DepartmentAdmin
              as_user_id: "user-dept-1"
            - call: "POST /students"
              payload: { student_number: "GS-1071", full_name: "Ben Ortiz", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 5.00 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /appointments"
              payload: { term_id: "${term_id}", limit: 500 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
          assert:
            - "all three responses are HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "each response body carries a non-empty message string"
            - "no Appointment row and no GS-1071 GraduateStudent row was created"

      - name: term_not_open_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TERM_NOT_OPEN]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / term_not_open_outranks_funding_insufficient_on_verify_funding
          rationale: "That §1.8 instance triggers ERR_TERM_NOT_OPEN on verify-funding in a PAYROLL_LOCKED term."

      - name: funding_source_not_active_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FUNDING_SOURCE_NOT_ACTIVE]
          - validations[priority=12]
        excluded_because:
          difficulty_instance: state_dependent_behaviour / verify_funding_blocked_when_one_cost_share_source_suspended
          rationale: "That §1.8 instance suspends one of two cost-share sources and asserts ERR_FUNDING_SOURCE_NOT_ACTIVE."

      - name: international_hour_limit_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INTERNATIONAL_HOUR_LIMIT_EXCEEDED]
          - validations[priority=14]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / international_hour_limit_outranks_allocation_shares_invalid_on_submit
          rationale: "That §1.8 instance drives an F-1 student past 20 weekly hours and asserts the priority-14 error."

      - name: over_appointment_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OVER_APPOINTMENT]
          - validations[priority=17]
        excluded_because:
          difficulty_instance: boundary_window_arithmetic / over_appointment_on_single_day_inclusive_window_touch
          rationale: "That §1.8 instance overlaps two appointments on exactly one shared day and asserts ERR_OVER_APPOINTMENT."

      - name: pay_period_overlap_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PAY_PERIOD_OVERLAP]
          - validations[priority=23]
        excluded_because:
          difficulty_instance: boundary_window_arithmetic / pay_period_half_open_adjacency_allowed_overlap_rejected
          rationale: "That §1.8 instance contrasts an accepted adjacent period with a one-day overlap that raises ERR_PAY_PERIOD_OVERLAP."

      - name: stipend_below_minimum_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STIPEND_BELOW_MINIMUM]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: threshold_boundary_exactness / fte_stipend_exactly_at_policy_minimum_passes_one_cent_below_rejected
          rationale: "That §1.8 instance submits one cent below the FTE-equivalent minimum and asserts ERR_STIPEND_BELOW_MINIMUM."

  # ===========================================================================
  # Table 7 - RBAC
  # ===========================================================================
  - section: rbac
    instances:

      - name: missing_headers_and_wrong_role_rejected
        claim_type: role_denial
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "A term create with no X-User-ID/X-User-Role headers returns 401 ERR_UNAUTHENTICATED, and the same body sent as DepartmentAdmin returns 403 ERR_ROLE_NOT_PERMITTED - authentication is checked strictly before authorization."
        test_recipe:
          setup: ["Empty database; no fixtures required."]
          setup_api_calls: []
          trigger:
            - call: "POST /academic-terms"
              payload: { term_code: "FALL2026", term_start: "2026-09-01", term_end: "2026-12-31", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-09-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /academic-terms"
              payload: { term_code: "FALL2026", term_start: "2026-09-01", term_end: "2026-12-31", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-09-15" }
              as: DepartmentAdmin
              as_user_id: "user-dept-1"
          assert:
            - "headerless call: HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "DepartmentAdmin call: HTTP 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "no AcademicTerm row exists afterwards"

      - name: student_user_reading_another_student_rejected
        claim_type: resource_ownership
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.StudentUser
        distinguishing_aspect: "A StudentUser whose X-User-ID is student A's id gets 403 ERR_NOT_RESOURCE_OWNER on GET /students/{B} and on GET /appointments?student_id={B}, but 200 on its own id."
        test_recipe:
          setup: ["Two doctoral students GS-1080 and GS-1081; no appointments required."]
          setup_api_calls:
            - call: "POST /students"
              payload: { student_number: "GS-1080", full_name: "Ada Vance", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.60, enrolled_credit_hours: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { s_a_id: "$.data.id" }
            - call: "POST /students"
              payload: { student_number: "GS-1081", full_name: "Ben Ortiz", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.60, enrolled_credit_hours: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { s_b_id: "$.data.id" }
          trigger:
            - call: "GET /students/${s_b_id}"
              payload: {}
              as: StudentUser
              as_user_id: "${s_a_id}"
            - call: "GET /appointments"
              payload: { student_id: "${s_b_id}" }
              as: StudentUser
              as_user_id: "${s_a_id}"
            - call: "GET /students/${s_a_id}"
              payload: {}
              as: StudentUser
              as_user_id: "${s_a_id}"
          assert:
            - "first two calls: HTTP 403 with error_id == ERR_NOT_RESOURCE_OWNER"
            - "third call: HTTP 200 with data.id == ${s_a_id} and data.student_number == GS-1080"

      - name: grant_accountant_exclusive_source_operations_permitted
        claim_type: exclusive_operation
        grounds:
          - roles.GrantAccountant
          - endpoints[POST /funding-sources/{id}/suspend]
          - endpoints[POST /funding-sources/{id}/reinstate]
        distinguishing_aspect: "suspend and reinstate are GrantAccountant-only: user-ga-1 drives NSF-A ACTIVE -> SUSPENDED -> ACTIVE while the same suspend attempted by GradSchoolAdmin returns 403 ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup: ["Department CHEM and ACTIVE grant NSF-A."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "CHEM", name: "Chemistry" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
