              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 5000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 100, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 4800, window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T14:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SAFE_FILL_EXCEEDED (422) — 4800 + 0 > 5000*0.95 = 4750 wins over the truck window overlap with the 08:00-12:00 drop"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: credit_limit_equality_allowed
        grounds:
          - calculations.projected_credit_check
          - validations[priority=10]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Boundary on a cents metric via POST /api/transport-drops: projected
          exposure EXACTLY EQUAL to credit_limit_cents (1772800 == 1772800) is
          allowed (rejection requires strict >), while any positive excess is
          rejected.
        test_recipe:
          setup:
            - "Station (NM, excise 0) limit exactly 1772800; POSTED gasoline 2000 tc; tank cap 30000 opening 0; truck"
            - "First drop 8000 gal: estimate = fuel 1600000 + freight 25600 + tax 147200 = 1772800"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Bnd", state_code: "NM", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 0, credit_limit_cents: 1772800 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
