scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_case_returns_201_with_computed_defaults
        claim_type: Creation
        grounds: [entities.AdoptionCase, "endpoints.POST /cases"]
        distinguishing_aspect: "POST /cases with agency_id, case_label, child_state, family_state -> 201; phase=INTAKE, escrow_balance_cents=0, reimbursable_expense_cents=0, interstate computed from child_state!=family_state."
        test_recipe:
          setup: ["An Agency exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "NV", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
          assert:
            - "response.status == 201"
            - "AdoptionCase.${case_id}.phase == 'INTAKE'"
            - "AdoptionCase.${case_id}.escrow_balance_cents == 0"
            - "AdoptionCase.${case_id}.reimbursable_expense_cents == 0"
            - "AdoptionCase.${case_id}.interstate == true"

      - name: get_case_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.AdoptionCase, "endpoints.GET /cases/{id}"]
        distinguishing_aspect: "GET /cases/{id} returns the stored case with matching id and case_label."
        test_recipe:
          setup: ["An Agency and a Case exist."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-ret", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Supervisor
              captures: { got: $.data.id }
          assert:
            - "response.status == 200"
            - "AdoptionCase.${case_id}.case_label == 'C-ret'"
            - "AdoptionCase.${case_id}.interstate == false"

      - name: list_cases_pagination_envelope
        claim_type: Listing
        grounds: [entities.AdoptionCase, "endpoints.GET /cases"]
        distinguishing_aspect: "GET /cases returns array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Agency with two Cases."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-a", child_state: "CA", family_state: "CA" }
              as: Supervisor
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-b", child_state: "CA", family_state: "CA" }
              as: Supervisor
          trigger:
            - call: "GET /cases?agency_id=${agency_id}&limit=1&offset=0"
              payload: {}
              as: Supervisor
          assert:
            - "response.response_type == 'array'"
            - "response.data.total_count == 2"
            - "response.data.has_more == true"

      - name: get_case_not_found
        claim_type: Not Found
        grounds: [entities.AdoptionCase, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /cases/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No matching case exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == 'ERR_NOT_FOUND'"

      - name: create_family_missing_required_field
        claim_type: Required Fields
        grounds: [entities.AdoptiveFamily, "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /families missing annual_income_cents -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Agency and Case exist."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2 }
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: create_birth_parent_illegal_enum
        claim_type: Type Constraints
        grounds: [entities.BirthParent.fields.parent_role, "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /birth-parents with parent_role='UNCLE' (not in enum) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Agency exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat", birth_state: "CA", parent_role: "UNCLE" }
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: system_fields_generated_on_create_case
        claim_type: System Fields
        grounds: [entities.AdoptionCase, entities.AgencyFeeInvoice]
        distinguishing_aspect: "On POST /cases, id/created_at/updated_at/version are server-minted; version starts at 1 and a client-supplied version in body is ignored."
        test_recipe:
          setup: ["Agency exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-sys", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, ver: $.data.version }
          assert:
            - "AdoptionCase.${case_id}.version == 1"
            - "AdoptionCase.${case_id}.created_at is a non-null ISO8601 string"

      - name: escrow_transaction_immutable_no_version
        claim_type: Immutability
        grounds: [entities.EscrowTransaction]
        distinguishing_aspect: "EscrowTransaction has common_fields:false — no version field, no update/transition endpoint; only id and created_at as system fields."
        test_recipe:
          setup: ["Case with a DEPOSIT EscrowTransaction."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, cv0: $.data.version }
            - call: "POST /escrow-transactions"
              payload: { case_id: "${case_id}", txn_type: "DEPOSIT", amount_cents: 500000, expected_case_version: "${cv0}" }
              as: FinanceOfficer
              captures: { txn_id: $.data.id }
          trigger:
            - call: "GET /escrow-transactions/${txn_id}"
              payload: {}
              as: FinanceOfficer
              captures: { got: $.data.id }
          assert:
            - "EscrowTransaction.${txn_id}.txn_type == 'DEPOSIT'"
            - "response.data does not contain a 'version' field"

      - name: create_family_wrong_parent_case_not_found
        claim_type: Parent Relationships
        grounds: [entities.AdoptiveFamily.fields.case_id, "validations[priority=5]", "errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /families with a non-existent case_id FK -> ERR_REFERENCED_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Agency exists; case_id is bogus."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /families"
              payload: { case_id: "00000000-0000-0000-0000-000000000000", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == 'ERR_REFERENCED_RESOURCE_NOT_FOUND'"

      - name: fk_reverse_reachability_expenses_by_case
        claim_type: Foreign key references validated; cross-reference integrity
        grounds: [entities.ExpenseEntry.fields.case_id, "endpoints.GET /expense-entries"]
        distinguishing_aspect: "Flat topology FK reverse-reachability: GET /expense-entries?case_id= returns ExpenseEntry[] for the case, discovering children created on it."
        test_recipe:
          setup: ["Case with two logged expenses."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "MEDICAL", amount_cents: 100000 }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "LEGAL", amount_cents: 200000 }
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "GET /expense-entries?case_id=${case_id}"
              payload: {}
              as: FinanceOfficer
          assert:
            - "response.response_type == 'array'"
            - "response.data.total_count == 2"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: home_study_initial_state_draft
        claim_type: Initial State
        grounds: [state_machines.HomeStudy, entities.HomeStudy.fields.status]
        distinguishing_aspect: "A newly created HomeStudy starts in DRAFT with revision_count=0 and expires_at=null."
        test_recipe:
          setup: ["Case and family exist."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
          trigger:
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id, st: $.data.status }
          assert:
            - "HomeStudy.${hs_id}.status == 'DRAFT'"
            - "HomeStudy.${hs_id}.revision_count == 0"
            - "HomeStudy.${hs_id}.expires_at == null"

      - name: approve_home_study_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.HomeStudy.UNDER_REVIEW_to_APPROVED, "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a HomeStudy still in DRAFT (not UNDER_REVIEW) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT HomeStudy (never submitted)."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
          trigger:
            - call: "POST /home-studies/${hs_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: terminal_match_declined_no_further_transition
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Match, state_machines.Match.PROPOSED_to_DECLINED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DECLINED Match (terminal) rejects a subsequent accept with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PROPOSED Match that is then DECLINED."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat", birth_state: "CA", parent_role: "BIRTH_MOTHER" }
              as: Caseworker
              captures: { bp_id: $.data.id }
            - call: "POST /matches"
              payload: { case_id: "${case_id}", family_id: "${family_id}", birth_parent_id: "${bp_id}" }
              as: Caseworker
              captures: { match_id: $.data.id }
            - call: "POST /matches/${match_id}/decline"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /matches/${match_id}/accept"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: idempotency_double_sign_consent
        claim_type: Idempotency
        grounds: [state_machines.ConsentRecord.PENDING_to_SIGNED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Signing an already-SIGNED ConsentRecord a second time -> ERR_INVALID_STATE (no double side-effects)."
        test_recipe:
          setup: ["A ConsentRecord signed once (SIGNED) on a case with ACCEPTED Match and clock past child_dob+72h."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-06-04T08:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, cv0: $.data.version }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /home-studies/${hs_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat", birth_state: "CA", parent_role: "BIRTH_MOTHER" }
              as: Caseworker
              captures: { bp_id: $.data.id }
            - call: "POST /matches"
              payload: { case_id: "${case_id}", family_id: "${family_id}", birth_parent_id: "${bp_id}" }
              as: Caseworker
              captures: { match_id: $.data.id }
            - call: "POST /matches/${match_id}/accept"
              payload: {}
              as: Supervisor
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Supervisor
              captures: { cv1: $.data.version }
            - call: "POST /consent-records"
              payload: { case_id: "${case_id}", birth_parent_id: "${bp_id}", child_dob: "2026-06-01T08:00:00.000Z", revocation_basis: "CALENDAR_DAYS", expected_case_version: "${cv1}" }
              as: Caseworker
              captures: { consent_id: $.data.id }
            - call: "POST /consent-records/${consent_id}/sign"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /consent-records/${consent_id}/sign"
              payload: {}
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: bubble_up_phase_to_matched_on_match_accept
        claim_type: Bubble up
        grounds: [state_machines.Match.PROPOSED_to_ACCEPTED, entities.AdoptionCase.fields.phase]
        distinguishing_aspect: "When a Match is accepted, AdoptionCase.phase bubbles up to MATCHED (compound parent re-derived from child state)."
        test_recipe:
          setup: ["Case with APPROVED HomeStudy and a PROPOSED Match."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /home-studies/${hs_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat", birth_state: "CA", parent_role: "BIRTH_MOTHER" }
              as: Caseworker
              captures: { bp_id: $.data.id }
            - call: "POST /matches"
              payload: { case_id: "${case_id}", family_id: "${family_id}", birth_parent_id: "${bp_id}" }
              as: Caseworker
              captures: { match_id: $.data.id }
          trigger:
            - call: "POST /matches/${match_id}/accept"
              payload: {}
              as: Supervisor
          assert:
            - "Match.${match_id}.status == 'ACCEPTED'"
            - "AdoptionCase.${case_id}.phase == 'MATCHED'"

      - name: consent_revoke_cascade
        claim_type: Cross-entity
        grounds: [state_machines.ConsentRecord.SIGNED_to_REVOKED]
        excluded_because:
          difficulty_instance: transitive_cascade / consent_revoke_cascades_placement_visits_phase
          rationale: "The revoke cascade onto Placement, visits, and case phase is the full subject of the named §1.8 instance."

  # ===========================================================================
  # Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: required_visits_interstate_six
        claim_type: Correct Result
        grounds: [calculations.required_visit_count, entities.Placement.fields.required_visits]
        distinguishing_aspect: "On activation of an interstate-case Placement, required_visits computes to 6 (REQUIRED_VISITS_INTERSTATE)."
        test_recipe:
          setup: ["Interstate case (NV->CA) advanced through IRREVOCABLE consent and RECEIVING_APPROVED ICPC; Placement activated."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-06-04T08:00:00.000Z" }
              as: AgencyAdmin
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-int", child_state: "NV", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, cv0: $.data.version }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /home-studies/${hs_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat", birth_state: "NV", parent_role: "BIRTH_MOTHER" }
              as: Caseworker
              captures: { bp_id: $.data.id }
            - call: "POST /matches"
              payload: { case_id: "${case_id}", family_id: "${family_id}", birth_parent_id: "${bp_id}" }
              as: Caseworker
              captures: { match_id: $.data.id }
            - call: "POST /matches/${match_id}/accept"
