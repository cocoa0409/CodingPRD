              as: FrontDesk
              captures: { wb14_id: "$.data.id" }
            - call: "POST /resorts/${r14_id}/reservations"
              payload: { room_type_id: "${rt14_id}", guest_count: 2, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { res14_id: "$.data.id" }
            - call: "POST /resorts/${r14_id}/reservations/${res14_id}/check_in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /resorts/${r14_id}/admissions"
