    side_effects: ["none"]

  - method: GET
    path: "/ria/standing-instructions/{id}"
    description: "Read one standing instruction."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, Client, PlatformAdmin]
    code: 200
    input: []
    output: StandingInstruction
    side_effects: ["none"]

  - method: POST
    path: "/ria/standing-instructions/{id}/verify"
    description: "Client consumes the issued token to verify the instruction."
    roles: [Client]
    code: 200
    input: [verification_token, "if_match?"]
    output: StandingInstruction
    side_effects: ["StandingInstruction.verification_status := VERIFIED", "sets verified_at", "increments StandingInstruction.version by 1"]

  - method: POST
    path: "/ria/standing-instructions/{id}/expire-check"
    description: "Expire a verified instruction whose round trip has reached seven days, rejecting its in-flight movements."
    roles: [CustodyOperationsOfficer]
    code: 200
    input: ["if_match?"]
    output: StandingInstruction
    side_effects: ["StandingInstruction.verification_status := EXPIRED", "rejects the account's non-terminal movements", "increments StandingInstruction.version by 1"]

  - method: POST
    path: "/ria/standing-instructions/{id}/revoke"
    description: "Revoke a verified instruction."
    roles: [ComplianceReviewer]
    code: 200
    input: ["if_match?"]
    output: StandingInstruction
    side_effects: ["StandingInstruction.verification_status := REVOKED", "rejects the account's non-terminal movements", "increments StandingInstruction.version by 1"]

  - method: POST
    path: "/ria/money-movements"
    description: "Create a money movement against a verified standing instruction."
    roles: [AdvisorOperationsLead]
    code: 201
    input: [account_id, standing_instruction_id, amount_cents, movement_type, authorization_note]
    output: MoneyMovementInstruction
    side_effects: ["MoneyMovementInstruction.movement_status := DRAFT"]

  - method: GET
    path: "/ria/accounts/{id}/money-movements"
    description: "List an account's money movements."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, Client, PlatformAdmin]
    code: 200
    input: ["movement_status?", "limit?", "offset?"]
    output: MoneyMovementInstruction[]
    side_effects: ["none"]

  - method: GET
    path: "/ria/accounts/{id}/money-movements/summary"
    description: "Read-only C7 DOMINANT_RULE probe: reports, per movement on the account, each restriction's independent withdrawal demand and the single largest one."
    roles: [AdvisorOperationsLead, ComplianceReviewer, CustodyOperationsOfficer, Client, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: MoneyMovementInstruction[]
    side_effects: ["none (pure read)"]

  - method: GET
    path: "/ria/money-movements/{id}"
    description: "Read one money movement."
    roles: [AdvisorOperationsLead, AdvisorSupportAnalyst, CustodyOperationsOfficer, ComplianceReviewer, Client, PlatformAdmin]
    code: 200
    input: []
    output: MoneyMovementInstruction
    side_effects: ["none"]

  - method: POST
    path: "/ria/money-movements/{id}/submit"
    description: "Submit a drafted movement for client authorization."
    roles: [AdvisorOperationsLead]
    code: 200
    input: ["if_match?"]
    output: MoneyMovementInstruction
    side_effects: ["MoneyMovementInstruction.movement_status := PENDING_AUTHORIZATION", "increments MoneyMovementInstruction.version by 1"]

  - method: POST
    path: "/ria/money-movements/{id}/authorize"
    description: "Client authorization; runs C7 verification and withholding."
    roles: [Client]
    code: 200
    input: ["if_match?"]
    output: MoneyMovementInstruction
    side_effects: ["runs C7", "MoneyMovementInstruction.movement_status := AUTHORIZED", "StandingInstruction.consumed_period_cents += amount_cents", "recompute C1", "increments MoneyMovementInstruction.version and StandingInstruction.version by 1"]

  - method: POST
    path: "/ria/money-movements/{id}/reject"
    description: "Client rejects a pending movement."
    roles: [Client]
    code: 200
    input: ["if_match?"]
    output: MoneyMovementInstruction
    side_effects: ["MoneyMovementInstruction.movement_status := REJECTED", "increments MoneyMovementInstruction.version by 1"]

  - method: POST
    path: "/ria/money-movements/{id}/cancel"
    description: "Adviser cancels a drafted movement."
    roles: [AdvisorOperationsLead]
    code: 200
    input: ["if_match?"]
    output: MoneyMovementInstruction
    side_effects: ["MoneyMovementInstruction.movement_status := CANCELLED", "increments MoneyMovementInstruction.version by 1"]

  - method: POST
    path: "/ria/money-movements/{id}/complete"
    description: "Custodian completes an authorized movement."
    roles: [CustodyOperationsOfficer]
    code: 200
    input: ["if_match?"]
    output: MoneyMovementInstruction
    side_effects: ["MoneyMovementInstruction.movement_status := COMPLETED", "increments MoneyMovementInstruction.version by 1"]

  # ---- onboarding batches --------------------------------------------------
  - method: POST
    path: "/ria/onboarding-batches"
    description: "Create a bulk onboarding batch of one of four kinds. ACCOUNTS materialises HouseholdAccount rows, TRANSFERS materialises AssetTransfer rows with their lots, LOTS appends TransferLot rows to an existing transfer, EVIDENCE materialises CustodyRulesEvidence rows."
    roles: [AdvisorOperationsLead]
    code: 201
    input: [firm_id, batch_kind, items, "chunk_size?"]
    output: OnboardingBatch
    side_effects: ["materialises child rows for the dispatched batch_kind", "OnboardingBatch.batch_status := DISPATCHED"]

  - method: PUT
    path: "/ria/onboarding-batches/{id}"
    description: "Dispatch a batch; rows already materialised are skipped as duplicates, so a retried dispatch never duplicates them."
    roles: [AdvisorOperationsLead]
    code: 200
    input: ["chunk_size?", "if_match?"]
    output: OnboardingBatch
    side_effects: ["OnboardingBatch.batch_status := DISPATCHED or COMPLETED", "increments OnboardingBatch.version by 1"]

  - method: GET
    path: "/ria/onboarding-batches/{id}"
    description: "Read one onboarding batch and its dispatch counts."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: []
    output: OnboardingBatch
    side_effects: ["none"]

  - method: GET
    path: "/ria/firms/{id}/onboarding-batches"
    description: "List a firm's onboarding batches."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["batch_kind?", "limit?", "offset?"]
    output: OnboardingBatch[]
    side_effects: ["none"]

  # ---- custody evidence & examination --------------------------------------
  - method: POST
    path: "/ria/firms/{id}/custody-evidence"
    description: "Raise a custody-rule evidence requirement against a firm."
    roles: [AdvisorOperationsLead]
    code: 201
    input: [requirement_code, critical]
    output: CustodyRulesEvidence
    side_effects: ["CustodyRulesEvidence.requirement_status := PENDING", "recompute C10"]

  - method: GET
    path: "/ria/firms/{id}/custody-evidence"
    description: "List a firm's custody evidence."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["requirement_status?", "critical?", "limit?", "offset?"]
    output: CustodyRulesEvidence[]
    side_effects: ["none"]

  - method: GET
    path: "/ria/custody-evidence/{id}"
    description: "Read one evidence row."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: []
    output: CustodyRulesEvidence
    side_effects: ["none"]

  - method: POST
    path: "/ria/custody-evidence/{id}/submit"
    description: "Submit an evidence package."
    roles: [AdvisorOperationsLead]
    code: 200
    input: ["if_match?"]
    output: CustodyRulesEvidence
    side_effects: ["CustodyRulesEvidence.requirement_status := SUBMITTED", "records drafted_by_user_id", "recompute C10", "increments CustodyRulesEvidence.version by 1"]

  - method: POST
    path: "/ria/custody-evidence/{id}/accept"
    description: "Compliance accepts an evidence package; the accepting reviewer must differ from the submitter."
    roles: [ComplianceReviewer]
    code: 200
    input: ["if_match?"]
    output: CustodyRulesEvidence
    side_effects: ["CustodyRulesEvidence.requirement_status := ACCEPTED", "mints evidence_document_hash", "recompute C10", "increments CustodyRulesEvidence.version by 1"]

  - method: POST
    path: "/ria/custody-evidence/{id}/reject"
    description: "Compliance marks an evidence package deficient, bumping the correction round."
    roles: [ComplianceReviewer]
    code: 200
    input: [deficiency_reason_code, "if_match?"]
    output: CustodyRulesEvidence
    side_effects: ["CustodyRulesEvidence.requirement_status := DEFICIENT", "evidence_round_number += 1", "recompute C10", "increments CustodyRulesEvidence.version by 1"]

  - method: POST
    path: "/ria/custody-evidence/{id}/resubmit"
    description: "Resubmit a deficient evidence package (cycle close; capped at four rounds)."
    roles: [AdvisorOperationsLead]
    code: 200
    input: ["if_match?"]
    output: CustodyRulesEvidence
    side_effects: ["CustodyRulesEvidence.requirement_status := SUBMITTED", "increments CustodyRulesEvidence.version by 1"]

  - method: POST
    path: "/ria/custody-evidence/{id}/waive"
    description: "Waive a non-critical evidence requirement."
    roles: [ComplianceReviewer]
    code: 200
    input: ["if_match?"]
    output: CustodyRulesEvidence
    side_effects: ["CustodyRulesEvidence.requirement_status := WAIVED", "increments CustodyRulesEvidence.version by 1"]

  - method: POST
    path: "/ria/custody-evidence/{id}/lapse"
    description: "Lapse an accepted evidence row once its annual window has elapsed."
    roles: [ComplianceReviewer]
    code: 200
    input: ["if_match?"]
    output: CustodyRulesEvidence
    side_effects: ["CustodyRulesEvidence.requirement_status := LAPSED", "recompute C10", "increments CustodyRulesEvidence.version by 1"]

  - method: POST
    path: "/ria/firms/{id}/examination-bundles"
    description: "Open an examination bundle for a half-open evidence period."
    roles: [ComplianceReviewer]
    code: 201
    input: [period_start_date, period_end_date]
    output: ExaminationBundle
    side_effects: ["ExaminationBundle.bundle_status := ASSEMBLING"]

  - method: GET
    path: "/ria/firms/{id}/examination-bundles"
    description: "List a firm's examination bundles."
    roles: [ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ExaminationBundle[]
    side_effects: ["none"]

  - method: POST
    path: "/ria/examination-bundles/{id}/generate"
    description: "Assemble the bundle via C12 and refresh its missing-evidence list."
    roles: [ComplianceReviewer]
    code: 200
    input: ["if_match?"]
    output: ExaminationBundle
    side_effects: ["runs C12", "ExaminationBundle.bundle_status := GENERATED or INCOMPLETE", "sets generated_at", "increments ExaminationBundle.version by 1"]

  - method: POST
    path: "/ria/examination-bundles/{id}/seal"
    description: "Seal a generated bundle."
    roles: [ComplianceReviewer]
    code: 200
    input: ["if_match?"]
    output: ExaminationBundle
    side_effects: ["ExaminationBundle.bundle_status := SEALED", "mints sealed_evidence_hash", "increments ExaminationBundle.version by 1"]

  # ---- data feeds ----------------------------------------------------------
  - method: POST
    path: "/ria/data-feeds"
    description: "Request an advisor technology data feed."
    roles: [AdvisorOperationsLead]
    code: 201
    input: [firm_id, feed_type, delivery_endpoint_host]
    output: DataFeedProvision
    side_effects: ["DataFeedProvision.provision_status := REQUESTED"]

  - method: GET
    path: "/ria/firms/{id}/data-feeds"
    description: "List a firm's data feed provisions."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["provision_status?", "limit?", "offset?"]
    output: DataFeedProvision[]
    side_effects: ["none"]

  - method: POST
    path: "/ria/data-feeds/{id}/provision"
    description: "Turn a requested feed on."
    roles: [AdvisorOperationsLead]
    code: 200
    input: ["if_match?"]
    output: DataFeedProvision
    side_effects: ["DataFeedProvision.provision_status := ACTIVE", "increments DataFeedProvision.version by 1"]

  - method: POST
    path: "/ria/data-feeds/{id}/revoke"
    description: "Revoke a live or throttled feed."
    roles: [ComplianceReviewer]
    code: 200
    input: ["if_match?"]
    output: DataFeedProvision
    side_effects: ["DataFeedProvision.provision_status := REVOKED", "increments DataFeedProvision.version by 1"]

  - method: POST
    path: "/ria/data-feeds/{id}/pull"
    description: "Deliver one page of records; the feed must not be THROTTLED (this is the behavioural probe of the invariant chain). The response carries the provision plus the page's record count, and increments provisioned_records_count."
    roles: [AdvisorOperationsLead]
    code: 200
    input: ["limit?", "offset?"]
    output: DataFeedProvision
    side_effects: ["DataFeedProvision.provisioned_records_count += delivered page size", "sets last_delivered_at"]

  # ---- deep reverse-reachability reads & custodian research ----------------
  - method: GET
    path: "/ria/billing-runs/{id}/fee-credits"
    description: "List the fee credits consumed by a billing run."
    roles: [ComplianceReviewer, AdvisorOperationsLead, PlatformAdmin]
    code: 200
    input: []
    output: FeeCredit[]
    side_effects: ["none"]

  - method: GET
    path: "/ria/standing-instructions/{id}/money-movements"
    description: "List the money movements raised against a standing instruction."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, Client, PlatformAdmin]
    code: 200
    input: ["movement_status?", "limit?", "offset?"]
    output: MoneyMovementInstruction[]
    side_effects: ["none"]

  - method: GET
    path: "/ria/models/{id}/block-orders"
    description: "List the block orders raised against a model."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, InvestmentCommitteeChair, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["block_status?", "limit?", "offset?"]
    output: BlockOrder[]
    side_effects: ["none"]

  - method: GET
    path: "/ria/accounts/{id}/block-allocations"
    description: "List the block allocations that target an account."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["allocation_status?", "limit?", "offset?"]
    output: BlockAllocation[]
    side_effects: ["none"]

  - method: GET
    path: "/ria/accounts/{id}/asset-transfers"
    description: "List the asset transfers receiving into an account."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["transfer_status?", "limit?", "offset?"]
    output: AssetTransfer[]
    side_effects: ["none"]

  - method: GET
    path: "/ria/custody-agreements/{id}/firm-entitlements"
    description: "List the entitlements that claim a custody agreement as their authority."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["entitlement_status?"]
    output: AdvisorFirmEntitlement[]
    side_effects: ["none"]

  - method: GET
    path: "/ria/custody-agreements/{id}/successors"
    description: "List the agreements that superseded this one (self-referential successor chain)."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: []
    output: CustodyAgreement[]
    side_effects: ["none"]

  - method: POST
    path: "/ria/lookup/lot-inventory"
    description: "Custodian research lookup: report the highest shares-held balance for one symbol on one account over the lookback window. Purely diagnostic; writes nothing."
    roles: [CustodyOperationsOfficer]
    code: 200
    input: [account_id, symbol, lookback_days]
    output: LotInventoryCard
    side_effects: ["none (pure read)"]


  - method: GET
    path: "/ria/models/{id}/accounts"
    description: "List the accounts assigned to a model."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, InvestmentCommitteeChair, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["account_status?", "limit?", "offset?"]
    output: HouseholdAccount[]
    side_effects: ["none"]

  - method: GET
    path: "/ria/firms/{id}/billing-runs"
    description: "List a firm's fee billing runs."
    roles: [AdvisorOperationsLead, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["billing_run_status?", "limit?", "offset?"]
    output: FeeBillingRun[]
    side_effects: ["none"]

# =============================================================================
# §1.6 Error Code Catalog (50 codes)
# =============================================================================
errors:

  # -- authentication / authorization ----------------------------------------
  - id: ERR_AUTHENTICATION_REQUIRED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role is not a role declared in §1.7"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_FIRM_FROZEN
    http: 403
    condition: "the firm's firm_posture is FROZEN and the endpoint is not one of the two exempt endpoints"
  - id: ERR_ENTITLEMENT_NOT_GRANTED
    http: 403
    condition: "the entitlement an endpoint requires is REQUESTED, SUSPENDED or REVOKED for the acting firm"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "the acting X-User-ID equals the recorded drafter on a two-party control"

  # -- existence -------------------------------------------------------------
  - id: ERR_FIRM_NOT_FOUND
    http: 404
    condition: "the AdvisorFirm referenced by the path or body does not exist"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path parameter or body FK does not resolve to a row declared in §1.1"
  - id: ERR_PARENT_CHILD_MISMATCH
    http: 404
    condition: "the resolved child row is not owned by the resolved parent row in the path"

  # -- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row's state is not the transition's declared from state"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target row is in a terminal state for its machine"
  - id: ERR_ACCOUNT_NOT_ELIGIBLE
    http: 409
    condition: "the target account's account_status is not in the set the action requires"
  - id: ERR_MODEL_NOT_APPROVED
    http: 409
    condition: "a block is submitted against a model whose model_status is not APPROVED or ACTIVE"
  - id: ERR_HOUSEHOLD_BILLING_HELD
    http: 409
    condition: "a new billing run is seeded for a household whose household_status is BILLING_HELD"
  - id: ERR_FEED_THROTTLED
    http: 409
    condition: "a feed pull is attempted on a DataFeedProvision whose provision_status is THROTTLED"

  # -- custody-rule / posture ------------------------------------------------
  - id: ERR_CUSTODY_AGREEMENT_REQUIRED
    http: 409
    condition: "the firm has no CustodyAgreement with agreement_status EXECUTED, or the referenced agreement is not the current one"
  - id: ERR_ENTITLEMENT_AGREEMENT_SUPERSEDED
    http: 409
    condition: "an entitlement points at a custody agreement that a newer executed agreement superseded"
  - id: ERR_ENTITLEMENT_DUPLICATE
    http: 409
    condition: "a sibling entitlement of the same firm already holds the same entitlement_code in state GRANTED"
  - id: ERR_FIRM_NOT_OPEN_FOR_TRADING
    http: 409
    condition: "a trading-path action is attempted while firm_posture is not OPEN"
  - id: ERR_ADMIN_ACTION_OUTSTANDING
    http: 409
    condition: "an UNACKNOWLEDGED admin action blocks the requested two-party action"
  - id: ERR_OPEN_ACCOUNTS_BLOCK_TERMINATION
    http: 409
    condition: "a custody agreement termination is attempted while the firm still has an OPEN account"
  - id: ERR_MODEL_MANAGEMENT_ENTITLEMENT_REQUIRED
    http: 409
    condition: "a model write requires MODEL_MANAGEMENT but the entitlement is SUSPENDED or REVOKED"

  # -- model / allocation ----------------------------------------------------
  - id: ERR_MODEL_WEIGHTS_INVALID
    http: 422
    condition: "the model's target weights do not sum to exactly 10000 basis points"
  - id: ERR_ALLOCATION_NOT_CONSISTENT
    http: 422
    condition: "requested shares sum to less than the executed total, or allocation_rank is duplicated within the block"
  - id: ERR_ALLOCATION_INCOMPLETE
    http: 409
    condition: "settlement is attempted while unallocated_share_micros is non-zero"
  - id: ERR_NO_ELIGIBLE_ALLOCATION_TARGET
    http: 409
    condition: "no allocation targets an OPEN account, or executed_share_micros is zero"

  # -- money movement --------------------------------------------------------
  - id: ERR_STANDING_INSTRUCTION_NOT_VERIFIED
    http: 409
    condition: "the linked standing instruction's verification_status is not VERIFIED"
  - id: ERR_STANDING_INSTRUCTION_EXPIRED
    http: 409
    condition: "the linked standing instruction's round_trip_days has reached 7"
  - id: ERR_STANDING_LIMIT_EXCEEDED
    http: 409
    condition: "the movement amount exceeds the standing instruction's remaining periodic limit"
  - id: ERR_AUTHORIZATION_NOTE_REQUIRED
    http: 422
    condition: "the authorization note is blank"

  # -- alternatives ----------------------------------------------------------
  - id: ERR_VALUATION_STALE
    http: 422
    condition: "the valuation age exceeds 270 days"
  - id: ERR_VALUATION_BELOW_FLOOR
    http: 422
    condition: "the stated value is below the holding's valuation floor"
  - id: ERR_DUPLICATE_ALTERNATIVE_HOLDING
    http: 409
    condition: "the account already hosts an UNDER_REVIEW holding with the same asset name"

  # -- billing ---------------------------------------------------------------
  - id: ERR_FEE_BASIS_ZERO
    http: 409
    condition: "the household's fee basis is zero when a billing run is seeded"
  - id: ERR_FEE_INVOICE_MISMATCH
    http: 409
    condition: "the stated invoice differs from the recomputed net fee"
  - id: ERR_CREDIT_EXCEEDS_FEE
    http: 422
    condition: "issuing the credit would push the household's outstanding credit balance above its annual fee"
  - id: ERR_LISTING_COOLDOWN
    http: 409
    condition: "a listing is requested inside the account's one-hour listing-slot cooldown window"
  - id: ERR_BILLING_PERIOD_INVALID
    http: 422
    condition: "period_end_date is not strictly after period_start_date, or the requested period is longer than 400 days"
  - id: ERR_FEE_BASIS_BELOW_MINIMUM
    http: 409
    condition: "the household's fee basis is below the inclusive 250000000-cent minimum billing threshold"

  # -- evidence / examination ------------------------------------------------
  - id: ERR_EVIDENCE_ROUND_LIMIT
    http: 409
    condition: "a deficient evidence row already sits at the four-round ceiling"
  - id: ERR_BUNDLE_NOT_SEALABLE
    http: 409
    condition: "the bundle is not in GENERATED state when sealing is attempted"
  - id: ERR_AMBIGUOUS_VALUATION_BINDING
    http: 409
    condition: "two alternative holdings on the same account are UNDER_REVIEW, so the valuation binding cannot be resolved by the pinned selector"
  - id: ERR_DUPLICATE_VALUATION_PERIOD
    http: 409
    condition: "a valuation as-of date lands on the same day as an existing accepted valuation for the same asset name"

  # -- onboarding / referential ----------------------------------------------
  - id: ERR_REFERENCE_MISMATCH
    http: 422
    condition: "a body FK points at a row owned by a different firm"
  - id: ERR_ONBOARDING_BATCH_NOT_DISPATCHABLE
    http: 409
    condition: "the batch kind's materialised entity is missing or in a state that blocks dispatch"
  - id: ERR_INVARIANT_CHAIN_BROKEN
    http: 409
    condition: "a firm-scoped invariant is BROKEN under ENFORCED enforcement"
  - id: ERR_INVALID_IF_MATCH
    http: 412
    condition: "the supplied If-Match ETag does not match the target row's current version"
  - id: ERR_IF_MATCH_REQUIRED
    http: 428
    condition: "a state-changing PUT or POST omits the required If-Match header"

  # -- OCC (see §1.2.1) ------------------------------------------------------
  - id: ERR_STALE_MODEL_VERSION
    http: 412
    condition: "expected_model_portfolio_version does not match ModelPortfolio.version"
  - id: ERR_STALE_BLOCK_VERSION
    http: 412
    condition: "expected_block_order_version does not match BlockOrder.version"
  - id: ERR_STALE_HOUSEHOLD_VERSION
    http: 412
    condition: "expected_household_version does not match Household.version"

# =============================================================================
# §1.7 RBAC Matrix (7 roles)
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Custody-platform operator who provisions firms, the logical clock, system configuration and regulatory admin actions."
    identity: opaque
    exclusive_operations:
      - "POST /firms"
      - "POST /_clock/set_current_utc"
      - "POST /systems/config"
      - "PATCH /systems/config/{id}"
      - "POST /admin-actions/issue"
    shared_operations:
      - "GET /firms/{id}"
      - "GET /firms"
      - "GET /accounts/{id}"
      - "GET /invariants/evaluate"
      - "GET /firms/{id}/invariants"
      - "all read endpoints on §1.1 entities"

  - name: AdvisorOperationsLead
    description: "The adviser firm's own operations staff: drafts agreements, opens accounts, runs onboarding batches, trades to model, and seeds fee runs."
    identity: opaque
    exclusive_operations:
      - "POST /firms/{id}/custody-agreements"
      - "POST /custody-agreements/{id}/submit"
      - "POST /custody-agreements/{id}/revert"
      - "POST /households"
      - "POST /accounts"
      - "POST /asset-transfers"
      - "POST /transfers/{id}/lots"
