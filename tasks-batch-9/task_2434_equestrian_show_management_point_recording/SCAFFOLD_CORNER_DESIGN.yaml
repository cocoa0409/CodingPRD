            rider_standings_national_scale_vs_regional_scale), both of which assert both
            variants over one data set plus the delta between them.

  - section: consistency_model
    instances:
      - name: failed_posting_leaves_no_partial_prize_writes
        claim_type: saga
        grounds:
          - validations.priority_62
          - errors.ERR_UNPAID_PLACED_ENTRY
          - calculations.show_prize_ledger
        distinguishing_aspect: |
          Posting results is the saga step that fans money out across three levels at once
          (ClassEntry.prize_cents, ShowClass.awarded_prize_cents, Show.allocated_prize_cents).
          When the last precondition fails on the THIRD placed entry, an implementation
          that writes as it walks the placings leaves the first two rows paid and the show
          ledger half-moved. Nothing may be written: the check is complete before the
          first cent moves, the class stays JUDGED, and replaying the refused call must
          reproduce the same failure with the same zero ledger rather than drifting.
          The refund that causes the failure is itself a compensation — withdrawing a
          PAID entry releases its stalls and flips it to REFUNDED with zero drift — so
          this instance pins one compensation landing correctly and one saga step
          refusing to start.
        test_recipe:
          setup:
            - "APPROVED LOCAL show, pool 750000, stall_capacity 40, stall_fee 7500; Open Jumper division share 3333 with class 101 (1.20m, fee 25000) share 1669 -> purse floor(floor(750000*3333/10000)*1669/10000) == 41721."
            - "Three riders and horses, three PAID entries on class 101: entry1 with 2 stalls (25000 + 15000 -> subtotal 40000 -> office fee 5000 -> 45000), entries 2 and 3 with no stalls (25000 + 5000 -> 30000)."
            - "All three ClassEntries CONFIRMED, so the class has 3 confirmed entries: estimated 26 minutes at 1.20m with a 10-minute turnover buffer."
            - "Slot at 2026-09-10T14:00 in Ring A with a JUDGE and a STEWARD assigned, an ACTIVE VETERINARIAN shift, clock 13:30 -> slot started -> results recorded with placings 1/2/3 -> class JUDGED, every ClassEntry COMPLETED, prize_cents still 0."
