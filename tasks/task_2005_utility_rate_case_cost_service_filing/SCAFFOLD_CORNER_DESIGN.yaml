            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/deficiency-review", payload: { outcome: "ACCEPTED" }, as: CommissionStaff }
            - { call: "POST /api/v1/rate-cases/${rc}/open-discovery", payload: {}, as: CommissionStaff }
            - { call: "POST /api/v1/rate-cases/${rc}/advance-to-hearing", payload: {}, as: ALJ }
            - { call: "POST /api/v1/rate-cases/${rc}/open-settlement-window", payload: {}, as: ALJ }
            - { call: "GET /api/v1/rate-cases/${rc}", payload: {}, as: UtilityFiler, captures: { rc_v: $.data.version } }
          trigger:
            - { call: "POST /api/v1/settlement-proposals", payload: { rate_case_id: "${rc}", proposed_revenue_requirement_cents: 1850000000, terms: "Round 1", expected_rate_case_version: "${rc_v}" }, as: UtilityFiler, captures: { sp1: $.data.id, sp1_round: $.data.round_number } }
            - { call: "POST /api/v1/settlement-proposals", payload: { rate_case_id: "${rc}", proposed_revenue_requirement_cents: 1840000000, terms: "Round 2 with stale version", expected_rate_case_version: "${rc_v}" }, as: UtilityFiler, captures: { err: $.data.error_id } }
            - { call: "GET /api/v1/rate-cases/${rc}", payload: {}, as: UtilityFiler, captures: { rc_v2: $.data.version } }
            - { call: "POST /api/v1/settlement-proposals", payload: { rate_case_id: "${rc}", proposed_revenue_requirement_cents: 1840000000, terms: "Round 2 with fresh version", expected_rate_case_version: "${rc_v2}" }, as: UtilityFiler, captures: { sp2: $.data.id, sp2_round: $.data.round_number } }
          assert:
            - "First create: 201, ${sp1_round} == 1, and RateCase.version advanced beyond ${rc_v}"
            - "Second create with the SAME (now stale) version: ${err} == ERR_STALE_VERSION, HTTP 412"
