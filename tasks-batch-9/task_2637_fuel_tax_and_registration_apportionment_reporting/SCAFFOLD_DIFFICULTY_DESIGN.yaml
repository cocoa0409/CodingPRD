  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_trip_intervals_are_half_open_so_adjacency_is_allowed
        grounds:
          - validations.priority_32_ERR_TRIP_INTERVAL_OVERLAP
          - calculations.mileage_gap_detection
          - state_machines.TripRecord.CAPTURED_to_REJECTED
        distinguishing_aspect: |
          The contended resource is a Vehicle's timeline and the interval arithmetic is
          half-open on [trip_start_utc, trip_end_utc): a trip that starts at the exact instant
          the previous one ended is accepted with zero buffer, while starting one second earlier
          is a 409. The same instance also proves the overlap set is state-filtered — rejecting
          the adjacent trip frees its interval, so an identical replacement trip is accepted and
          gap detection re-links across the rejected row.
        test_recipe:
          setup:
            - "Jurisdiction IL declared; carrier cC1 with one power unit."
            - "Trip H1 occupies 2026-04-10T06:00:00Z to 2026-04-10T18:00:00Z with odometer 100000.0 to 100600.0 and one IL leg of 600.0 mi."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Half Open Interval Trucking LLC", usdot_number: "USDOT-2637140", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { cc1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${cc1_id}", unit_number: "U-1401", vin: "1FUJA6CK21L901401", weight_group_code: "W80", factory_price_amount: 146000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { vc1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${cc1_id}", vehicle_id: "${vc1_id}", trip_start_utc: "2026-04-10T06:00:00Z", trip_end_utc: "2026-04-10T18:00:00Z", start_odometer: 100000.0, end_odometer: 100600.0, legs: [{ jurisdiction_code: "IL", leg_miles: 600.0 }] }
              as: MileageAnalyst
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${cc1_id}", vehicle_id: "${vc1_id}", trip_start_utc: "2026-04-10T18:00:00Z", trip_end_utc: "2026-04-11T02:00:00Z", start_odometer: 100600.0, end_odometer: 100900.0, legs: [{ jurisdiction_code: "IL", leg_miles: 300.0 }] }
              as: MileageAnalyst
              captures: { h2_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${cc1_id}", vehicle_id: "${vc1_id}", trip_start_utc: "2026-04-10T17:59:59Z", trip_end_utc: "2026-04-11T03:00:00Z", start_odometer: 100900.0, end_odometer: 101200.0, legs: [{ jurisdiction_code: "IL", leg_miles: 300.0 }] }
              as: MileageAnalyst
            - call: "POST /apportionment/trip-records/${h2_id}/review"
              payload: { decision: "REJECT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${cc1_id}", vehicle_id: "${vc1_id}", trip_start_utc: "2026-04-10T18:00:00Z", trip_end_utc: "2026-04-11T02:00:00Z", start_odometer: 100600.0, end_odometer: 100900.0, legs: [{ jurisdiction_code: "IL", leg_miles: 300.0 }] }
              as: MileageAnalyst
              captures: { h4_id: $.data.id }
          assert:
            - "the first trigger call succeeds with 201: trip_start_utc equals H1's trip_end_utc exactly, and half-open intervals treat that as adjacency, not overlap"
            - "TripRecord.${h2_id}.gap_miles_from_previous == 0.0 and trip_status == CAPTURED"
            - "the second trigger call returns 409 with error_id ERR_TRIP_INTERVAL_OVERLAP — one second of overlap is enough, and the overlap check at priority 32 fires before any gap computation"
            - "no TripRecord row was created by the rejected call: GET /apportionment/trip-records?vehicle_id=${vc1_id} returns 2 rows at that point"
            - "after the REJECT, TripRecord.${h2_id}.trip_status == REJECTED with no ACTIVE legs"
            - "the fourth trigger call succeeds: the identical interval is free again because REJECTED trips are excluded from the overlap set"
            - "TripRecord.${h4_id}.gap_miles_from_previous == 0.0 — gap detection skipped the REJECTED row and compared against H1's end_odometer 100600.0"
            - "Carrier.${cc1_id}.unsubstantiated_mileage_ratio == 0.0000 throughout, since no trip is GAP_FLAGGED or RECONSTRUCTED"

      - name: driver_credential_windows_are_closed_and_buffered_by_two_days
        grounds:
          - validations.priority_33_ERR_DRIVER_CREDENTIAL_WINDOW_CONFLICT
          - calculations.credential_validity_window
          - state_machines.Credential.ISSUED_to_DISTRIBUTED
          - entities.Credential.fields.valid_from_date
        distinguishing_aspect: |
          A different contended resource with the opposite interval geometry: the driver's hands,
          on closed [valid_from_date, valid_to_date] windows that are BOTH expanded by
          DRIVER_HANDOVER_BUFFER_DAYS 2 before the overlap test, so two windows need more than
          four clear days between them. A handover with exactly two clear days (2026-06-29 then
          2026-07-02) is therefore rejected even though the raw windows are disjoint — the
          opposite outcome from the zero-buffer trip adjacency above. The conflict is scoped per
          credential_type, so the same second window is accepted for a different credential type.
