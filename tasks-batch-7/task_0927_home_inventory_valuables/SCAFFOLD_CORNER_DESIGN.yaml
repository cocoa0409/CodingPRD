              as_user_id: "${exec_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first allocation returns HTTP 201"
            - "${err} == ERR_STALE_PLAN_VERSION"
            - "the second allocation returns HTTP 412"
            - "Item.${it_id}.allocated_quantity == 1"
            - "EstatePlan.${plan_id}.unallocated_item_count == 1"
            - "GET /vault/allocations?estate_plan_id=${plan_id} returns exactly 1 row"

      - name: stale_subscription_version_on_change_tier_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tier-change-stale-subscription]
          - errors[ERR_STALE_SUBSCRIPTION_VERSION]
          - endpoints.POST /vault/subscriptions/{subscription_id}/attest-refresh
        distinguishing_aspect: "An attest-refresh between the version read and the change-tier bumps Subscription.version, so the tier change is refused with ERR_STALE_SUBSCRIPTION_VERSION (412) and tier, monthly_fee_cents and last_proration_charge_cents are all unchanged."
        test_recipe:
          setup:
            - "A PLUS household with an ACTIVE subscription whose version has been read, followed by an attest-refresh that advances it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "c46@example.com", full_name: "Corner Fortysix" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 46", address_label: "46 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vault/subscriptions/${sub_id}/billing-event"
              payload: { outcome: "PAYMENT_SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /vault/subscriptions/${sub_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { sub_v_stale: $.data.version }
            - call: "POST /vault/subscriptions/${sub_id}/attest-refresh"
              payload: { attestation_note: "early attestation" }
              as: Homeowner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /vault/subscriptions/${sub_id}/change-tier"
              payload: { tier: "ESTATE", proration_mode: "DAILY", expected_subscription_version: "${sub_v_stale}" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_SUBSCRIPTION_VERSION"
            - "the response HTTP status is 412"
            - "Subscription.${sub_id}.tier == PLUS"
            - "Subscription.${sub_id}.monthly_fee_cents == 2900"
            - "Subscription.${sub_id}.last_proration_charge_cents == 0"
            - "Subscription.${sub_id}.refresh_state == CURRENT"
            - "Subscription.${sub_id}.last_attested_at == 2026-05-01T00:00:00.000Z"

      - name: soft_deleted_asset_is_excluded_from_the_default_asset_list
        claim_type: soft_delete
        grounds:
          - entities.Asset.fields.status
          - endpoints.GET /vault/assets
          - endpoints.DELETE /vault/assets/{asset_id}
        distinguishing_aspect: "After deleting one of two assets, GET /vault/assets?item_id=X returns only the STORED row, while the same query with status=DELETED returns only the deleted row, and Household.asset_count drops from 2 to 1."
        test_recipe:
          setup:
            - "A PLUS household with one item carrying a PHOTO and a RECEIPT asset."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vault/category-schedules"
              payload: { category: "GENERAL", useful_life_months: 120, annual_depreciation_pct: 8.0, salvage_floor_pct: 20.0, blanket_sublimit_cents: 900000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "c47@example.com", full_name: "Corner Fortyseven" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 47", address_label: "47 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Kitchen", floor_label: "1" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Mixer", category: "GENERAL", acquired_at: "2025-01-01T00:00:00Z", serial_number: "GN-47" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_id: $.data.id }
            - call: "POST /vault/items/${it_id}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 6000, checksum: "sha-c47a", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_id}/assets"
              payload: { asset_kind: "RECEIPT", byte_size: 4000, checksum: "sha-c47b", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { receipt_id: $.data.id }
            - call: "POST /vault/items/${it_id}/declare-value"
              payload: { declared_value_cents: 70000 }
              as: Homeowner
              as_user_id: "${owner_id}"
          trigger:
            - call: "DELETE /vault/assets/${receipt_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "GET /vault/assets"
              payload: { item_id: "${it_id}" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "GET /vault/assets"
              payload: { item_id: "${it_id}", status: "DELETED" }
              as: Homeowner
              as_user_id: "${owner_id}"
          assert:
            - "AFTER SETUP, before the trigger: Item.${it_id}.evidence_tier == DOCUMENTED"
            - "the default list returns exactly 1 row and its asset_kind == PHOTO"
            - "the status=DELETED list returns exactly 1 row and its id == ${receipt_id}"
            - "Asset.${receipt_id}.status == DELETED"
            - "Item.${it_id}.evidence_tier == PHOTO_SERIAL"
            - "Household.${hh_id}.asset_count == 1"
            - "Household.${hh_id}.asset_bytes_used == 6000"

  - section: consistency_model
    instances:
      - name: claim_creation_response_already_carries_its_cascade_results
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Item.lifecycle_state.CATALOGED_to_FROZEN
          - entities.LossClaim.fields.frozen_item_count
        distinguishing_aspect: "The consistency model is immediate: the POST /vault/claims response body itself reports frozen_item_count 1, and a GET of the item in the very next request already shows lifecycle_state FROZEN - nothing is deferred to a later reconciliation."
        test_recipe:
          setup:
            - "A PLUS household with one CATALOGED GENERAL item, a policy and a GENERATED package."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vault/category-schedules"
              payload: { category: "GENERAL", useful_life_months: 120, annual_depreciation_pct: 8.0, salvage_floor_pct: 20.0, blanket_sublimit_cents: 900000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "c48@example.com", full_name: "Corner Fortyeight" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 48", address_label: "48 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Bedroom", floor_label: "2" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Headboard", category: "GENERAL", acquired_at: "2025-01-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_id: $.data.id }
            - call: "POST /vault/items/${it_id}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 5000, checksum: "sha-c48", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_id}/declare-value"
              payload: { declared_value_cents: 130000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/policies"
              payload: { household_id: "${hh_id}", carrier_name: "Northwind Mutual", policy_number: "NW-C48", deductible_cents: 0, scheduled_allowance_cents: 0, effective_from: "2026-05-01T00:00:00Z" }
              as: Homeowner
