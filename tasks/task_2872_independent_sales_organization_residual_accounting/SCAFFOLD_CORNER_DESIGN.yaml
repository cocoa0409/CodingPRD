            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9099", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: Agent
              as_user_id: "${a1}"
              is_negative_trigger: true
              captures: { e4: $.data.error_id }
            - call: "GET /agent-advances"
              payload: { agent_id: "${a1}" }
              as: ResidualAnalyst
