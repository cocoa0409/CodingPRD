      - name: a_missing_or_unrecognised_identity_header_is_unauthenticated_before_anything_else
        claim_type: authentication_required
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: |
          Priority 1 is checked before existence (4), authorization (2) and ownership (3),
          so a request with no usable identity must yield 401 even when it also names a
          non-existent resource and a role that would be unauthorized anyway. Both header
          halves are required: a recognised role with no X-User-ID is still 401.
        test_recipe:
          setup:
            - "One district exists so that a legitimate read is available for comparison"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "GET /districts/${d_id}"
              as: "(X-User-Role header omitted entirely)"
              as_user_id: "someone"
              captures: { e_no_role: $.data.error_id }
            - call: "GET /districts/${d_id}"
              as: LeagueAdmin
              as_user_id: "(X-User-ID header omitted entirely)"
              captures: { e_no_user: $.data.error_id }
            - call: "POST /districts"
              payload: { name: "Ghost District", state_code: "CA" }
              as: "Superintendent (not one of the seven declared roles)"
              as_user_id: "ghost"
              captures: { e_bad_role: $.data.error_id }
            - call: "GET /teams/00000000-0000-4000-8000-000000000000"
              as: "Superintendent (not one of the seven declared roles)"
              as_user_id: "ghost"
              captures: { e_beats_404: $.data.error_id }
            - call: "POST /teams/00000000-0000-4000-8000-000000000000/register"
              payload: {}
              as: "(X-User-Role header omitted entirely)"
              as_user_id: "ghost"
              captures: { e_beats_403: $.data.error_id }
            - call: "GET /districts/${d_id}"
              as: Recruiter
              as_user_id: "recruiter-1"
          assert:
            - "triggers 1, 2 and 3 all return 401 with data.error_id == ERR_UNAUTHENTICATED — both header halves are mandatory and the role must be one of the seven declared names"
            - "trigger 4 returns 401, NOT 404 — priority 1 precedes the priority-4 existence check even though the team id cannot resolve"
            - "trigger 5 returns 401, NOT 403 and NOT 404 — priority 1 precedes both authorization and existence"
            - "no district was created by trigger 3: GET /districts returns exactly 1 row, ${d_id}"
            - "trigger 6 returns 200 with data.id == ${d_id}, proving the endpoint itself is reachable and only the identity headers were at fault"

