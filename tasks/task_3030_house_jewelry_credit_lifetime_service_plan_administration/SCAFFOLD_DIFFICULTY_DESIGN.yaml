  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      # --- Boundary 1: numeric threshold crossing on the down-payment formula ---
      - name: down_payment_shortfall_flips_at_exactly_the_ceil_boundary
        grounds:
          - calculations.credit_limit_registry_pricing
          - validations[priority=22]
          - entities.CreditApplication.fields.min_down_payment_required_cents
          - entities.CreditApplication.fields.down_payment_shortfall_cents
        distinguishing_aspect: "A numeric threshold crossing reachable through POST /credit-applications/{id}/decision: at the worked 10 percent rate the required minimum is ceil(0.10 x requested_purchase_amount_cents), so requested 300000 with 30000 down gives shortfall 0 while requested 300001 gives shortfall 1 — the boundary is exact to the cent."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store 0142 OPEN and ACTIVE. Customer Nina. TX TIER_3 registry row with min_down_payment_pct 0.10 and base_limit_cents 300000. Three applications: A at 300000 purchase amount with 30000 down, B at 300001 with 30000 down, C at 300050 with 30000 down."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_id: $.data.id }
