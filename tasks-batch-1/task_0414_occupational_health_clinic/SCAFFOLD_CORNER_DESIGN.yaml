              as: ClinicAdmin
              captures: { emp_v_stale: $.data.version }
            - call: "POST /_clock/set"
              payload: { employer_id: "${emp_id}", to_iso8601: "2026-03-20" }
              as: ClinicAdmin
          trigger:
