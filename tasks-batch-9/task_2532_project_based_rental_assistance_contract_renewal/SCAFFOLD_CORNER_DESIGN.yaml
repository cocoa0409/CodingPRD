  - section: validations
    instances:
      - name: uniqueness_rules_reject_a_duplicate_tin_a_live_unit_number_and_a_second_open_case
        claim_type: Violation → Error
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - validations[priority=31]
          - errors[ERR_DUPLICATE_TIN]
          - errors[ERR_DUPLICATE_UNIT_NUMBER]
          - errors[ERR_OPEN_RENEWAL_CASE_EXISTS]
        distinguishing_aspect: "Three different uniqueness scopes are probed in one fixture and each is proved to be scoped rather than absolute: the TIN is global, the unit number is per property and only over rows whose status is not MOVED_OUT (so unit 101 is re-usable after a move-out, asserted as a 201), and the open-case rule counts cases whose rent_track_status is not EXECUTED for that one contract."
        test_recipe:
          setup:
            - "Owner (tin 27-3310011), property, contract, household T1 in unit 101 certified 2026-07-01, clock 2026-12-01, and one open RenewalCase on the contract."
