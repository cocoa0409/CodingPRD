    description: "Computed read decomposing calc unit_posture_derivation: one row per in-unit LaborEncounter in the six non-terminal labor phases with its required/assigned coverage units and its deficit contribution, plus the rolled-up coverage_deficit_units and the posture branch that fired. Rows are ordered created_at ASC."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
