            - "PartOrder.${order_y_id}.subtotal_cents == 10399 and PartOrder.${order_y_id}.total_cents == 10399"
            - "InventoryRecord.${inv_a_p1_id}.reserved_units == 1 and InventoryRecord.${inv_a_p1_id}.available_units == 9"

      - name: return_window_day_thirty_accepted_day_thirty_one_expired
