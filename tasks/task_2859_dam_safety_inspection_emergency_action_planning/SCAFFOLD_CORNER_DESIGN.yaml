      - name: clock_rewind_rejected_but_resetting_to_the_same_instant_succeeds
        claim_type: temporal_validation
        grounds:
          - validations[priority 42]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The monotonicity rule is non-strict: setting the clock one second back is a 422 while
          setting it to the identical instant is a successful no-op, and a rejected rewind does not
          disturb the value seen by the next created entity.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-08-05T13:00:00Z."
            - "One owner exists so a later creation can be timestamped for comparison."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T13:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:59:59Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T13:00:00Z" }
              as: ProgramAdmin
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
          assert:
            - "the rewind returns HTTP 422 with error_id ERR_CLOCK_NOT_MONOTONIC"
            - "the equal-value set returns HTTP 200"
            - "Engineer.${eng_a_id}.created_at == 2026-08-05T13:00:00Z, proving the clock never moved back"
            - "Owner.${owner_id}.created_at == 2026-08-01T00:00:00Z (untouched by the later clock moves)"

