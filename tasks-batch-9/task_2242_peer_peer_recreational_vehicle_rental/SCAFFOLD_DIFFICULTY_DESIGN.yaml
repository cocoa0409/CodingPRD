  # ===========================================================================
  - rule_id: non_linear_state_machine
    scaffold_basis: >-
      §1.2 declares five machines over four entities with three non-linear
      shapes: Booking carries two INDEPENDENT dimensions (trip_status and
      settlement_status) that advance on different triggers, DamageClaim has a
      bounded UNDER_REVIEW ⇄ INFO_REQUESTED revision CYCLE, and
      DeliveryAssignment FORKS from REQUESTED into SCHEDULED or WAITLISTED on one
      and the same trigger with divergent side-effect sets.
    instances:

      - name: booking_two_dimensions_advance_on_different_triggers
        grounds: >-
          §1.2 Booking trip_status and §1.2 Booking settlement_status, plus the
          note on the NONE -> HELD row that /start moves only the trip dimension
          while /settlement/reverse moves only the settlement dimension.
        distinguishing_aspect: >-
          The pair (trip_status, settlement_status) must reach a combination that
          neither dimension could produce alone. /start advances CONFIRMED ->
          IN_TRIP while settlement_status stays HELD, and /settlement/reverse
          advances SETTLED -> RECONCILING while trip_status stays CLOSED — the
          terminal combination (CLOSED, RECONCILING) is legal even though CLOSED
          is a trip-dimension terminal state. An implementation that models one
          enum, or that treats CLOSED as globally terminal, either rejects the
          reverse or drags trip_status backwards.
        test_recipe:
          setup: >-
            Canonical marketplace through IN_TRIP with all three readings and
            both photo phases recorded, then read the booking back so the
            (IN_TRIP, HELD) combination is observed before the return.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
