scenario: "1839. Candy & Confectionery Plant Production (confectionery plant): cooking/tempering process control, mold/depositor changeover & shape inventory, seasonal (holiday) production windows & inventory build, allergen segregation & cross-contact prevention, shelf-life & bloom quality issue, co-pack/private label & gifting assembly, packaging component lead time, post-season markdown & rework"

domain_name: "confectionery-plant-production"
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: "Unique sellable-unit code (e.g. TRUFFLE-24)."
        constraints: "Unique across all products; required."
      - name: name
        type: string
        source: input
        description: "Display name."
      - name: product_type
        type: enum
        source: input
        description: "STANDARD (year-round), SEASONAL (holiday build/markdown eligible), GIFT_SET (assembled from component products)."
        constraints: "One of {STANDARD, SEASONAL, GIFT_SET}."
      - name: brand
        type: enum
        source: input
        description: "OWN (own-label) or PRIVATE_LABEL (co-pack customer program)."
        constraints: "One of {OWN, PRIVATE_LABEL}."
      - name: customer_name
        type: string
        source: input
        description: "Co-pack customer name; required when brand == PRIVATE_LABEL, ignored otherwise."
        default: null
      - name: base_price_cents
        type: integer
        source: input
        description: "List price per unit in cents before any markdown."
        constraints: "> 0"
      - name: unit_weight_grams
        type: number
        source: input
        description: "Net weight per finished unit."
        constraints: "> 0"
      - name: shelf_life_days
        type: integer
        source: input
        description: "Days from manufacture date to expiry date; drives Lot.expiry_date."
        constraints: "> 0"
      - name: packaging_component_id
        type: string
        source: input
        description: "FK -> PackagingComponent.id; the primary packaging component consumed per unit."

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product this recipe produces."
      - name: name
        type: string
        source: input
        description: "Recipe name (e.g. 'Truffle mass v2')."
      - name: shape_code
        type: string
        source: input
        description: "Required mold/depositor shape; the line's installed mold must carry the same shape_code at run start."
      - name: cook_temp_min_c
        type: number
        source: input
        description: "Lower bound of the allowed cooking temperature band (inclusive)."
      - name: cook_temp_max_c
        type: number
        source: input
        description: "Upper bound of the allowed cooking temperature band (inclusive)."
      - name: temper_exit_min_c
        type: number
        source: input
        description: "Lower bound of the allowed temperer exit temperature band (inclusive)."
      - name: temper_exit_max_c
        type: number
        source: input
        description: "Upper bound of the allowed temperer exit temperature band (inclusive)."
      - name: allergens
        type: array
        source: input
        description: "Allergens present in the mass; subset of {MILK, SOY, PEANUT, TREE_NUT, EGG, WHEAT, SESAME}. Empty array means allergen-free."
        default: []
      - name: standard_yield_pct
        type: number
        source: input
        description: "Standard (planned) fraction of input mass that becomes saleable product; used by the rework_yield standard variant."
        constraints: "0 < value <= 1"

  - name: PackagingComponent
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: "Unique component code (e.g. BOX-24)."
        constraints: "Unique."
      - name: name
        type: string
        source: input
        description: "Component name."
      - name: units_per_component
        type: integer
        source: input
        description: "How many finished units one component packs (e.g. a 24-count box packs 10 units => units_per_component semantics: one component packs N units)."
        constraints: ">= 1"
      - name: lead_time_days
        type: integer
        source: input
        description: "Supplier lead time; a purchase order cannot be received before ordered_at + lead_time_days."
        constraints: ">= 0"
      - name: qty_on_hand
        type: integer
        source: input
        description: "Physical components in stock at creation; afterwards mutated only by PO receipt and run completion consumption."
        constraints: ">= 0"
      - name: qty_reserved
        type: integer
        source: system
        description: "Components reserved by PLANNED/IN_PROGRESS/ON_HOLD runs."
        default: 0
      - name: qty_available
        type: integer
        source: computed
        description: "= qty_on_hand - qty_reserved; recomputed on every mutation of either operand."

  - name: PackagingPO
    parent: null
    common_fields: true
    fields:
      - name: component_id
        type: string
        source: input
        description: "FK -> PackagingComponent.id (from path); component being ordered."
      - name: order_qty
        type: integer
        source: input
        description: "Components ordered."
        constraints: "> 0"
      - name: ordered_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at creation."
      - name: due_at
        type: datetime
        source: computed
        description: "= ordered_at + component.lead_time_days days."
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of receipt; null until received."
        default: null
      - name: status
        type: enum
        source: system
        description: "ORDERED on creation; RECEIVED after the receive action."
        constraints: "One of {ORDERED, RECEIVED}."
        default: ORDERED

  - name: Mold
    parent: null
    common_fields: true
    fields:
      - name: shape_code
        type: string
        source: input
        description: "Shape this mold/depositor produces; matched against Recipe.shape_code at run start."
      - name: cavity_count
        type: integer
        source: input
        description: "Impressions per mold."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "AVAILABLE (in shape inventory) or INSTALLED (on a line). A mold may be installed on at most one line."
        constraints: "One of {AVAILABLE, INSTALLED}."
        default: AVAILABLE

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Line name (e.g. LINE-1)."
      - name: current_mold_id
        type: string
        source: system
        description: "FK -> Mold.id; mold currently installed. Null at creation; set by changeover release."
        default: null
      - name: cleared_allergens
        type: array
        source: system
        description: "Allergen set the line is currently verified clean for. Set to Changeover.target_allergens on ALLERGEN_WASH release; reset to [] on SHAPE_ONLY or FULL release."
        default: []
      - name: status
        type: enum
        source: system
        description: "AVAILABLE or CHANGEOVER (a changeover is in progress, line cannot start runs)."
        constraints: "One of {AVAILABLE, CHANGEOVER}."
        default: AVAILABLE

  - name: Changeover
    parent: null
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: system
        description: "FK -> ProductionLine.id (from path); line being changed over."
      - name: changeover_type
        type: enum
        source: input
        description: "SHAPE_ONLY (mold swap, no allergen clearance), FULL (deep clean without allergen validation), ALLERGEN_WASH (validated allergen wash; requires target_allergens)."
        constraints: "One of {SHAPE_ONLY, FULL, ALLERGEN_WASH}."
      - name: to_mold_id
        type: string
        source: input
        description: "FK -> Mold.id; mold to install on release. Omit for a wash without mold swap."
        default: null
      - name: target_allergens
        type: array
        source: input
        description: "Allergen set the line will be cleared for after this wash. Required when changeover_type == ALLERGEN_WASH; forbidden otherwise."
        default: null
      - name: swab_recorded_by
        type: string
        source: system
        description: "X-User-ID of the SanitationLead who recorded the swab."
        default: null
      - name: swab_passed
        type: boolean
        source: system
        description: "Swab result as recorded."
        default: null
      - name: qa_released_by
        type: string
        source: system
        description: "X-User-ID of the QualityManager who released the line; must differ from swab_recorded_by."
        default: null
      - name: status
        type: enum
        source: system
        description: "PENDING_SWAB -> PENDING_QA -> RELEASED."
        constraints: "One of {PENDING_SWAB, PENDING_QA, RELEASED}."
        default: PENDING_SWAB

  - name: SeasonalWindow
    parent: null
    common_fields: true
    fields:
      - name: season_code
        type: string
        source: input
        description: "Season identifier (e.g. HOLIDAY, EASTER, BASE). Ship-interval overlap is only checked between windows with equal season_code."
      - name: build_start
        type: datetime
        source: input
        description: "Earliest scheduled_start for runs in this window (inclusive)."
      - name: build_end
        type: datetime
        source: input
        description: "Latest scheduled_end for runs in this window (inclusive); production must complete by this instant."
      - name: ship_start
        type: datetime
        source: input
        description: "Season ship period start."
      - name: ship_end
        type: datetime
        source: input
        description: "Season end date; markdown eligibility and window close are measured against this date."
      - name: target_units
        type: integer
        source: input
        description: "Build target for the season."
        constraints: "> 0"
      - name: markdown_tiers
        type: array
        source: input
        description: "Array of {day_offset_min: integer >= 0, discount_pct: number in [0,1)} sorted by day_offset_min ascending with unique offsets; tier applies when days_after_season_end >= day_offset_min."
      - name: confirmed_build_units
        type: integer
        source: computed
        description: "Sum of qty_on_hand over Lots whose run.window_id == this window and lot.status == ACTIVE. See seasonal_build_projection."
        default: 0
      - name: projected_build_units
        type: integer
        source: computed
        description: "= confirmed_build_units + sum of planned_units over runs in this window with status in {PLANNED, IN_PROGRESS, ON_HOLD}. See seasonal_build_projection."
        default: 0
      - name: coverage_pct
        type: number
        source: computed
        description: "= round(100 * confirmed_build_units / target_units, 1)."
        default: 0
      - name: shortfall
        type: boolean
        source: computed
        description: "= confirmed_build_units < target_units."
        default: true
      - name: status
        type: enum
        source: system
        description: "DRAFT -> PUBLISHED -> CLOSED. Runs may only be created against PUBLISHED windows."
        constraints: "One of {DRAFT, PUBLISHED, CLOSED}."
        default: DRAFT

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: window_id
        type: string
        source: input
        description: "FK -> SeasonalWindow.id; production window this run belongs to."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product being produced."
      - name: recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; recipe executed; must belong to product_id."
      - name: line_id
        type: string
        source: input
        description: "FK -> ProductionLine.id; line the run is scheduled on."
      - name: run_type
        type: enum
        source: input
        description: "STANDARD (cook/temper/deposit), GIFT_ASSEMBLY (assemble gift set from component lots, product must be GIFT_SET), REWORK (consume source_lot_id into a new lot)."
        constraints: "One of {STANDARD, GIFT_ASSEMBLY, REWORK}."
      - name: planned_units
        type: integer
        source: input
        description: "Planned output units; drives packaging reservation ceil(planned_units / units_per_component)."
        constraints: "> 0"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned start; must be >= window.build_start."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Planned end; must be <= window.build_end and > scheduled_start. Half-open interval [start, end) is occupied on the line."
      - name: source_lot_id
        type: string
        source: input
        description: "FK -> Lot.id; lot consumed by a REWORK run. Required when run_type == REWORK; forbidden otherwise."
        default: null
      - name: rework_qty
        type: integer
        source: input
        description: "Units drawn from the source lot. Required when run_type == REWORK; must be <= source lot qty_on_hand."
        default: null
      - name: packaging_reserved_qty
        type: integer
        source: system
        description: "Components reserved at creation; released on cancel, consumed on complete."
        default: 0
      - name: output_units
        type: integer
        source: system
        description: "Actual saleable units recorded at completion; null until COMPLETED."
        default: null
      - name: expected_output_units
        type: integer
        source: computed
        description: "REWORK runs only: floor(rework_qty * recipe.standard_yield_pct); the standard-yield variant projection. Null for other run types."
        default: null
      - name: created_lot_id
        type: string
        source: system
        description: "FK -> Lot.id; lot produced at completion. Null until COMPLETED."
        default: null
      - name: status
        type: enum
        source: system
        description: "PLANNED -> IN_PROGRESS -> COMPLETED; IN_PROGRESS <-> ON_HOLD loop; PLANNED/ON_HOLD -> CANCELLED."
        constraints: "One of {PLANNED, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED}."
        default: PLANNED

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: system
        description: "FK -> Product.id; taken from the producing run."
      - name: run_id
        type: string
        source: system
        description: "FK -> ProductionRun.id; run that produced this lot."
      - name: mfg_date
        type: datetime
        source: system
        description: "Logical-clock timestamp at run completion."
      - name: expiry_date
        type: datetime
        source: computed
        description: "= mfg_date + product.shelf_life_days days. A lot is expired when current_utc >= expiry_date."
      - name: qty_on_hand
        type: integer
        source: system
        description: "Unreserved saleable units. Reduced by rework reservation, gift backflush, release trim, and scrap."
      - name: qty_reserved_rework
        type: integer
        source: system
        description: "Units earmarked by PLANNED/IN_PROGRESS/ON_HOLD REWORK runs."
        default: 0
      - name: qty_scrapped
        type: integer
        source: system
        description: "Units written off (release trim of affected units, or full-lot scrap)."
        default: 0
      - name: unit_price_cents
        type: integer
        source: system
        description: "Product.base_price_cents at creation (gift sets: gift_set_price); overwritten by apply-markdown."
      - name: quality_status
        type: enum
        source: system
        description: "OK normally; SUSPECT when the run completed with an out-of-band process deviation."
        constraints: "One of {OK, SUSPECT}."
        default: OK
      - name: status
        type: enum
        source: system
        description: "ACTIVE -> BLOCKED (quality hold) -> ACTIVE (release); ACTIVE|BLOCKED -> SCRAPPED or DEPLETED."
        constraints: "One of {ACTIVE, BLOCKED, DEPLETED, SCRAPPED}."
        default: ACTIVE

  - name: QualityHold
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; lot under hold. For auto-created holds (process deviation) this is system-set."
      - name: defect_type
        type: enum
        source: input
        description: "BLOOM (fat/sugar bloom complaint), TEMPER_DEVIATION (auto-created on out-of-band completion), FOREIGN_MATERIAL, OTHER."
        constraints: "One of {BLOOM, TEMPER_DEVIATION, FOREIGN_MATERIAL, OTHER}."
      - name: affected_units
        type: integer
        source: input
        description: "Units affected by the defect. For auto-created TEMPER_DEVIATION holds this equals the run's output_units."
        constraints: "> 0 and <= lot.qty_on_hand at hold creation"
      - name: lot_qty_at_open
        type: integer
        source: system
        description: "Snapshot of lot.qty_on_hand at hold creation; denominator of defect_rate_pct."
      - name: defect_rate_pct
        type: number
        source: computed
        description: "= round(100 * affected_units / lot_qty_at_open, 2) per bloom_defect_rate."
      - name: opened_by
        type: string
        source: system
        description: "X-User-ID of creator, or 'system' for auto-created deviation holds."
      - name: disposition_by
        type: string
        source: system
        description: "X-User-ID of the QualityManager who dispositioned the hold."
        default: null
      - name: status
        type: enum
        source: system
        description: "OPEN -> RELEASED | SCRAPPED | REWORK_PENDING; REWORK_PENDING -> CLOSED_REWORK when the sourcing rework run completes."
        constraints: "One of {OPEN, RELEASED, SCRAPPED, REWORK_PENDING, CLOSED_REWORK}."
        default: OPEN

  - name: GiftComponent
    parent: null
    common_fields: false
    fields:
      - name: gift_product_id
        type: string
        source: input
        description: "FK -> Product.id; the GIFT_SET product. Immutable after creation (no update endpoint)."
      - name: component_product_id
        type: string
        source: input
        description: "FK -> Product.id; a component product. May itself be a GIFT_SET (nested kits), but the resulting graph must stay acyclic."
      - name: qty_per_set
        type: integer
        source: input
        description: "Units of the component product in one gift set."
        constraints: "> 0"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProductionRun
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /production-runs/{id}/start"
        actor: LineOperator
        preconditions:
          - "run.status == PLANNED (else ERR_INVALID_STATE)"
          - "line.status == AVAILABLE (else ERR_LINE_NOT_AVAILABLE)"
          - "recipe.allergens is a subset of line.cleared_allergens (else ERR_ALLERGEN_WASH_REQUIRED)"
          - "line.current_mold_id references a Mold whose shape_code == recipe.shape_code (else ERR_MOLD_SHAPE_MISMATCH)"
        side_effects:
          - "run.updated_at refreshed; run.version incremented"
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /production-runs/{id}/hold"
        actor: LineOperator
        preconditions:
          - "run.status == IN_PROGRESS (else ERR_INVALID_STATE)"
        side_effects:
          - "run.updated_at refreshed; run.version incremented"
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /production-runs/{id}/resume"
        actor: LineOperator
        preconditions:
          - "run.status == ON_HOLD (else ERR_INVALID_STATE)"
        side_effects:
          - "run.updated_at refreshed; run.version incremented"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /production-runs/{id}/complete"
        actor: LineOperator
        preconditions:
          - "run.status == IN_PROGRESS (else ERR_INVALID_STATE)"
          - "GIFT_ASSEMBLY runs: FEFO pool must cover qty_per_set * output_units for every component (else ERR_INSUFFICIENT_COMPONENT_LOTS)"
        side_effects:
          - "run.output_units := payload.output_units; run.status := COMPLETED; run.version incremented"
          - "packaging consume: component.qty_reserved -= run.packaging_reserved_qty AND component.qty_on_hand -= run.packaging_reserved_qty (qty_available recomputed)"
          - "create Lot L: product_id/run_id from run, mfg_date := current clock, expiry_date := mfg_date + shelf_life_days, qty_on_hand := output_units, quality_status := OK, status := ACTIVE; run.created_lot_id := L.id"
          - "DEVIATION (cascade hop 1): if actual_cook_temp_c outside [recipe.cook_temp_min_c, recipe.cook_temp_max_c] or actual_temper_exit_c outside [recipe.temper_exit_min_c, recipe.temper_exit_max_c], set L.quality_status := SUSPECT"
          - "DEVIATION (cascade hop 2): a SUSPECT lot causes the system to create a QualityHold (defect_type TEMPER_DEVIATION, affected_units := output_units, opened_by 'system', status OPEN)"
          - "DEVIATION (cascade hop 3): that QualityHold creation sets L.status := BLOCKED"
          - "DEVIATION (cascade hop 4): L becoming BLOCKED re-triggers seasonal_build_projection on the window (confirmed_build_units now excludes L), bumping SeasonalWindow.version"
          - "GIFT_ASSEMBLY: fefo_allocation deducts qty_per_set * output_units of each component product from eligible lots; any lot reaching qty_on_hand == 0 transitions to DEPLETED (each depletion re-triggers seasonal_build_projection on its own window); gift lot L.unit_price_cents := gift_set_price(product)"
          - "REWORK: source_lot.qty_reserved_rework -= run.rework_qty; if source_lot.qty_on_hand == 0 and qty_reserved_rework == 0 then source_lot transitions to DEPLETED; if the source lot has a QualityHold in REWORK_PENDING, that hold transitions to CLOSED_REWORK"
          - "seasonal_build_projection recomputed on run.window_id (confirmed/projected/coverage_pct/shortfall); SeasonalWindow.version incremented"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /production-runs/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "run.status in {PLANNED, ON_HOLD} (else ERR_INVALID_STATE)"
        side_effects:
          - "release packaging reservation: component.qty_reserved -= run.packaging_reserved_qty (qty_available recomputed)"
          - "REWORK runs: source_lot.qty_reserved_rework -= run.rework_qty AND source_lot.qty_on_hand += run.rework_qty (unit conservation restored)"
          - "seasonal_build_projection recomputed on run.window_id; SeasonalWindow.version incremented"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /production-runs/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "run.status in {PLANNED, ON_HOLD} (else ERR_INVALID_STATE)"
        side_effects:
          - "same side effects as PLANNED -> CANCELLED"

  - entity: Changeover
    initial_state: PENDING_SWAB
    terminal_states: [RELEASED]
    transitions:
      - from: null
        to: PENDING_SWAB
        trigger: "POST /production-lines/{id}/changeovers"
        actor: LineOperator
        preconditions:
          - "line.status == AVAILABLE (else ERR_LINE_NOT_AVAILABLE)"
          - "to_mold_id, when provided, references a Mold with status == AVAILABLE (else ERR_MOLD_NOT_AVAILABLE)"
          - "changeover_type == ALLERGEN_WASH requires non-empty target_allergens; other types forbid target_allergens (else ERR_INVALID_REQUEST)"
          - "OCC: payload.expected_line_version == line.version (else ERR_STALE_VERSION)"
        side_effects:
          - "line.status := CHANGEOVER; ProductionLine.version incremented by 1"
      - from: PENDING_SWAB
        to: PENDING_QA
        trigger: "POST /changeovers/{id}/swab"
        actor: SanitationLead
        preconditions:
          - "changeover.status == PENDING_SWAB (else ERR_INVALID_STATE)"
          - "payload.swab_passed == true (else ERR_SWAB_FAILED; changeover stays PENDING_SWAB)"
        side_effects:
          - "changeover.swab_recorded_by := X-User-ID; changeover.swab_passed := true; changeover.version incremented"
      - from: PENDING_QA
        to: RELEASED
        trigger: "POST /changeovers/{id}/release"
        actor: QualityManager
        preconditions:
          - "changeover.status == PENDING_QA (else ERR_INVALID_STATE)"
          - "X-User-ID != changeover.swab_recorded_by (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "changeover.qa_released_by := X-User-ID; changeover.version incremented"
          - "line.status := AVAILABLE; ProductionLine.version incremented"
          - "if to_mold_id present: previous line.current_mold_id mold (if any) -> AVAILABLE; to_mold -> INSTALLED; line.current_mold_id := to_mold_id"
          - "if changeover_type == ALLERGEN_WASH: line.cleared_allergens := changeover.target_allergens; else line.cleared_allergens := []"

  - entity: ProductionLine
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: CHANGEOVER
        trigger: "POST /production-lines/{id}/changeovers (changeover created)"
        actor: LineOperator
        preconditions:
          - "see Changeover creation preconditions"
        side_effects:
          - "ProductionLine.version incremented"
      - from: CHANGEOVER
        to: AVAILABLE
        trigger: "POST /changeovers/{id}/release (changeover released)"
        actor: QualityManager
        preconditions:
          - "see Changeover release preconditions"
        side_effects:
          - "mold install/clearance side effects per Changeover release"
          - "ProductionLine.version incremented"

  - entity: Mold
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: INSTALLED
        trigger: "POST /changeovers/{id}/release with to_mold_id == this mold"
        actor: QualityManager
        preconditions:
          - "mold.status == AVAILABLE at changeover creation"
        side_effects:
          - "Mold.version incremented"
      - from: INSTALLED
        to: AVAILABLE
        trigger: "POST /changeovers/{id}/release installing a different mold on the same line"
        actor: QualityManager
        preconditions:
          - "mold is line.current_mold_id of the changeover's line"
        side_effects:
          - "Mold.version incremented"

  - entity: SeasonalWindow
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /seasonal-windows/{id}/publish"
        actor: PlantManager
        preconditions:
          - "window.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "SeasonalWindow.version incremented"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /seasonal-windows/{id}/close"
        actor: PlantManager
        preconditions:
          - "window.status == PUBLISHED (else ERR_INVALID_STATE)"
          - "current clock date is strictly after ship_end date (else ERR_PREMATURE_CLOSE)"
        side_effects:
          - "SeasonalWindow.version incremented"

  - entity: PackagingPO
    initial_state: ORDERED
    terminal_states: [RECEIVED]
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /purchase-orders/{id}/receive"
        actor: ProductionPlanner
        preconditions:
          - "po.status == ORDERED (else ERR_INVALID_STATE)"
          - "current clock timestamp >= po.due_at (else ERR_PO_NOT_DUE)"
        side_effects:
          - "po.received_at := current clock"
          - "ledger sync: component.qty_on_hand += po.order_qty (qty_available recomputed); PackagingComponent.version incremented"

  - entity: Lot
    initial_state: ACTIVE
    terminal_states: [DEPLETED, SCRAPPED]
    transitions:
      - from: ACTIVE
        to: BLOCKED
        trigger: "system: a QualityHold is created on this lot (manual POST /quality-holds or auto-created on process deviation)"
        actor: system
        preconditions:
          - "lot.status == ACTIVE"
        side_effects:
          - "seasonal_build_projection recomputed on the lot's run's window (confirmed_build_units excludes BLOCKED lots); SeasonalWindow.version incremented"
      - from: BLOCKED
        to: ACTIVE
        trigger: "POST /quality-holds/{id}/disposition with action RELEASE on this lot's OPEN hold"
        actor: QualityManager
        preconditions:
          - "see QualityHold RELEASE preconditions"
        side_effects:
          - "lot.qty_on_hand -= hold.affected_units; lot.qty_scrapped += hold.affected_units"
          - "if lot.qty_on_hand == 0 after trim, lot transitions to DEPLETED instead of ACTIVE"
          - "seasonal_build_projection recomputed; SeasonalWindow.version incremented"
      - from: ACTIVE
        to: SCRAPPED
        trigger: "POST /quality-holds/{id}/disposition with action SCRAP"
        actor: QualityManager
        preconditions:
          - "hold.status == OPEN and hold.lot_id == this lot"
        side_effects:
          - "lot.qty_scrapped += lot.qty_on_hand; lot.qty_on_hand := 0"
          - "seasonal_build_projection recomputed; SeasonalWindow.version incremented"
      - from: BLOCKED
        to: SCRAPPED
        trigger: "POST /quality-holds/{id}/disposition with action SCRAP"
        actor: QualityManager
        preconditions:
          - "hold.status == OPEN and hold.lot_id == this lot"
        side_effects:
          - "same as ACTIVE -> SCRAPPED (rework reservation, if any, must already be released)"
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: qty_on_hand reaches 0 via gift FEFO backflush or rework completion consumption"
        actor: system
        preconditions:
          - "qty_on_hand == 0 and qty_reserved_rework == 0"
        side_effects:
          - "seasonal_build_projection recomputed on the lot's run's window; SeasonalWindow.version incremented"
      - from: BLOCKED
        to: DEPLETED
        trigger: "system: sourcing REWORK run completes and consumes the remaining reserved units"
        actor: system
        preconditions:
          - "qty_on_hand == 0 and qty_reserved_rework == 0 after consumption"
        side_effects:
          - "the lot's REWORK_PENDING hold transitions to CLOSED_REWORK"
          - "seasonal_build_projection recomputed; SeasonalWindow.version incremented"

  - entity: QualityHold
    initial_state: OPEN
    terminal_states: [RELEASED, SCRAPPED, CLOSED_REWORK]
    transitions:
      - from: OPEN
        to: RELEASED
        trigger: "POST /quality-holds/{id}/disposition with action RELEASE"
        actor: QualityManager
        preconditions:
          - "hold.status == OPEN (else ERR_INVALID_STATE)"
          - "if hold.defect_type == BLOOM then hold.defect_rate_pct < 2.00 (else ERR_BLOOM_RELEASE_FORBIDDEN)"
        side_effects:
          - "hold.disposition_by := X-User-ID; hold.version incremented"
          - "lot trim side effects per Lot BLOCKED -> ACTIVE"
      - from: OPEN
        to: SCRAPPED
        trigger: "POST /quality-holds/{id}/disposition with action SCRAP"
        actor: QualityManager
        preconditions:
          - "hold.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "hold.disposition_by := X-User-ID; hold.version incremented"
          - "lot scrap side effects per Lot -> SCRAPPED (cascade: lot SCRAPPED triggers window recompute and may flip window.shortfall)"
      - from: OPEN
        to: REWORK_PENDING
        trigger: "POST /quality-holds/{id}/disposition with action REWORK"
        actor: QualityManager
        preconditions:
          - "hold.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "hold.disposition_by := X-User-ID; hold.version incremented"
          - "lot remains BLOCKED and becomes eligible as a REWORK run source"
      - from: REWORK_PENDING
        to: CLOSED_REWORK
        trigger: "system: a REWORK ProductionRun with source_lot_id == hold.lot_id completes"
        actor: system
        preconditions:
          - "hold.status == REWORK_PENDING"
        side_effects:
          - "hold.version incremented"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-window
    parent_entity: SeasonalWindow
    write_endpoint: "POST /production-runs"
    occ_field: "expected_window_version"
    description: |
      Creating a ProductionRun against a SeasonalWindow whose version has
      advanced since the client last observed it is rejected with 412. A run
      created against stale window data may have been planned against outdated
      build dates or targets, so the client must re-read the window and retry.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: changeover-create-stale-line
    parent_entity: ProductionLine
    write_endpoint: "POST /production-lines/{id}/changeovers"
    occ_field: "expected_line_version"
    description: |
      Creating a Changeover against a ProductionLine whose version has advanced
      since the client last observed it is rejected with 412. A changeover
      supersedes the line's mold/clearance state, so the client must re-read
      the line and retry with the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: seasonal_build_projection
    trigger: "On any of: ProductionRun created/cancelled for the window; ProductionRun completed (lot created); Lot status change (BLOCKED/ACTIVE/SCRAPPED/DEPLETED) for a lot whose run belongs to the window; lot qty_on_hand mutation."
    algorithm: aggregation
    formula: |
      active_lot_units(window) =
        sum(Lot.qty_on_hand) over Lot where Lot.run_id -> ProductionRun.window_id == window.id
        AND Lot.status == ACTIVE
      confirmed_build_units = active_lot_units(window)
      pipeline_units(window) =
        sum(ProductionRun.planned_units) over ProductionRun where window_id == window.id
        AND status IN {PLANNED, IN_PROGRESS, ON_HOLD}
      projected_build_units = confirmed_build_units + pipeline_units(window)
      coverage_pct = round(100 * confirmed_build_units / target_units, 1)
      shortfall = confirmed_build_units < target_units
    input_set: "Lots: status == ACTIVE only, joined through their run to the window. Runs for pipeline: status IN {PLANNED, IN_PROGRESS, ON_HOLD}; COMPLETED and CANCELLED runs contribute nothing to the pipeline term."
    constants: {}
    precision: "coverage_pct: 1 decimal place, round_half_up"
    variants:
      - name: confirmed
        when: "Actual build position (post-production truth)."
        difference: "Counts only ACTIVE lots' qty_on_hand; excludes anything still in the run pipeline."
      - name: projected
        when: "Forward-looking build planning (will we hit target if the schedule executes?)."
        difference: "Adds planned_units of not-yet-completed runs on top of confirmed; for the same window state projected >= confirmed, and the two diverge whenever any run is in the pipeline."

  - name: markdown_price
    trigger: "POST /seasonal-windows/{id}/apply-markdown."
    algorithm: tiered_pricing
    formula: |
      d = (current_clock_date - window.ship_end_date).days   # whole-day difference, UTC dates
      discount_pct = max over tiers t where d >= t.day_offset_min of t.discount_pct
                     (0 when no tier qualifies)
      for each lot L where L.run.window_id == window.id AND L.status == ACTIVE
                        AND L.product.product_type == SEASONAL:
        raw = L.product.base_price_cents * (1 - discount_pct)
        L.unit_price_cents = max(round_half_up(raw), MIN_PRICE_FLOOR_CENTS)
    input_set: "Lots of SEASONAL products whose run belongs to this window and whose status == ACTIVE. BLOCKED/DEPLETED/SCRAPPED lots and STANDARD/GIFT_SET products are excluded."
    constants:
      MIN_PRICE_FLOOR_CENTS: 50
    precision: "integer cents, round_half_up applied to raw before the floor"
    variants: []

  - name: gift_set_price
    trigger: "Completion of a GIFT_ASSEMBLY run; result stored as the gift lot's unit_price_cents."
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round each component line first, then sum.
      # (Sum-then-round can differ by a cent; per-line-then-sum is the contract.)
      gift_price = sum over GiftComponent gc where gc.gift_product_id == product.id of
        round_half_up( gc.component_product.base_price_cents * gc.qty_per_set
                       * (1 - GIFT_KIT_DISCOUNT_PCT) )
    input_set: "All GiftComponent rows for the gift product (acyclic graph guaranteed at creation). Component price is the component product's current base_price_cents."
    constants:
      GIFT_KIT_DISCOUNT_PCT: 0.10
    precision: "integer cents; round_half_up per component line, then integer sum"
    variants: []

  - name: fefo_allocation
    trigger: "Completion of a GIFT_ASSEMBLY run (backflush of component products)."
    algorithm: chronological
    formula: |
      needed(c) = gc.qty_per_set * output_units   for each component c of the gift product
      eligible_lots(c) = Lot where product_id == c AND status == ACTIVE
                         AND quality_status == OK AND expiry_date > current clock
                         AND qty_on_hand > 0
      order: expiry_date ASC, tie-break created_at ASC
      walk the ordered lots, taking take_i = min(remaining, lot.qty_on_hand);
      lot.qty_on_hand -= take_i (lot -> DEPLETED when it reaches 0)
      if sum(eligible qty_on_hand) < needed(c) for any component -> reject the whole
      completion with ERR_INSUFFICIENT_COMPONENT_LOTS (no partial deduction)
    input_set: "Only ACTIVE, quality OK, unexpired lots of each component product. Expired means expiry_date <= current clock."
    constants: {}
    precision: "integer units"
    variants: []

  - name: bloom_defect_rate
    trigger: "QualityHold creation (manual or automatic)."
    algorithm: threshold
    formula: |
      defect_rate_pct = round_half_up(100 * affected_units / lot_qty_at_open, 2)
      if defect_type == BLOOM and defect_rate_pct >= 2.00:
        RELEASE disposition is forbidden (ERR_BLOOM_RELEASE_FORBIDDEN);
        only SCRAP or REWORK remain.
      Non-BLOOM defect types are not threshold-gated.
    input_set: "Single lot; denominator is the lot's qty_on_hand snapshot at hold creation (lot_qty_at_open)."
    constants:
      BLOOM_RELEASE_MAX_PCT: 2.00
    precision: "2 decimal places, round_half_up; comparison is >= on the rounded value"
    variants: []

  - name: rework_yield
    trigger: "Standard variant: REWORK run creation (stored as expected_output_units). Actual variant: REWORK run completion (becomes the new lot's qty_on_hand and feeds seasonal_build_projection)."
    algorithm: aggregation
    formula: |
      standard variant: expected_output_units = floor(rework_qty * recipe.standard_yield_pct)
      actual variant:   output_units = payload output_units recorded at completion (operator count)
    input_set: "The sourcing lot's rework_qty and the run's recipe."
    constants: {}
    precision: "integer units, floor for the standard variant"
    variants:
      - name: standard
        when: "Planning/projection at REWORK run creation."
        difference: "Derived from recipe.standard_yield_pct; deterministic at create time."
      - name: actual
        when: "Completion of the REWORK run."
        difference: "Operator-recorded count; for identical inputs it diverges from standard whenever actual yield differs from the recipe standard, and it (not the standard) is what lands in the lot and the window's confirmed_build_units."

  - name: packaging_requirement
    trigger: "ProductionRun creation (reservation); released on cancel, consumed on completion."
    algorithm: aggregation
    formula: |
      required_components = ceil(planned_units / product.packaging_component.units_per_component)
      reserve:  component.qty_reserved += required_components
      release:  component.qty_reserved -= run.packaging_reserved_qty
      consume:  component.qty_reserved -= run.packaging_reserved_qty
                AND component.qty_on_hand -= run.packaging_reserved_qty
      invariant at all times: qty_available == qty_on_hand - qty_reserved >= 0
    input_set: "The run's planned_units and the product's single packaging_component."
    constants: {}
    precision: "integer components, ceiling division"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role in X-User-Role is listed in the endpoint's roles."
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids exist, validated left-to-right; body FK ids (window_id, product_id, recipe_id, line_id, source_lot_id, lot_id, component_id, to_mold_id, gift_product_id, component_product_id, packaging_component_id) reference existing resources. Also: recipe.product_id must equal the run's product_id; scheduled_start < scheduled_end; run_type == GIFT_ASSEMBLY requires a GIFT_SET product; run_type == REWORK requires source_lot_id and rework_qty present."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all (request-shape violations within this group return ERR_INVALID_REQUEST 400 instead: missing required fields, bad enums, recipe/product mismatch, GIFT_ASSEMBLY on non-GIFT_SET product, REWORK without source_lot_id/rework_qty, scheduled_start >= scheduled_end, target_allergens presence mismatch)"
  - priority: 4
    category: state
    check: "Target entity in the required state: run start requires PLANNED; hold requires IN_PROGRESS; resume requires ON_HOLD; complete requires IN_PROGRESS; cancel requires PLANNED or ON_HOLD; window publish requires DRAFT; close requires PUBLISHED; apply-markdown requires CLOSED; run creation requires window PUBLISHED; PO receive requires ORDERED; disposition requires hold OPEN; swab requires PENDING_SWAB; release requires PENDING_QA. Line must be AVAILABLE for run start (ERR_LINE_NOT_AVAILABLE) and changeover creation (ERR_LINE_NOT_AVAILABLE). REWORK source lot must be ACTIVE, or BLOCKED with a hold in REWORK_PENDING (ERR_LOT_NOT_REWORKABLE). OCC: expected_window_version == window.version on run creation and expected_line_version == line.version on changeover creation (ERR_STALE_VERSION)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition and state-gated endpoints (specific errors: ERR_LINE_NOT_AVAILABLE 409, ERR_LOT_NOT_REWORKABLE 409, ERR_STALE_VERSION 412)"
  - priority: 5
    category: business_safety
    check: "Allergen & sanitation safety: run start requires recipe.allergens subset of line.cleared_allergens (ERR_ALLERGEN_WASH_REQUIRED); gift-component creation requires the union of the component product's recipes' allergens to be a subset of the union of the gift product's recipes' allergens (ERR_UNDECLARED_ALLERGEN); changeover release requires X-User-ID != swab_recorded_by (ERR_SEGREGATION_OF_DUTIES); swab_passed must be true (ERR_SWAB_FAILED)."
    error_id: ERR_ALLERGEN_WASH_REQUIRED
    http_status: 422
    applies_to: "POST /production-runs/{id}/start; POST /gift-components; POST /changeovers/{id}/release; POST /changeovers/{id}/swab (specific errors: ERR_UNDECLARED_ALLERGEN 422, ERR_SEGREGATION_OF_DUTIES 403, ERR_SWAB_FAILED 422)"
  - priority: 6
    category: business_constraint
    check: "Structural constraints: installed mold shape_code must equal recipe.shape_code at run start (ERR_MOLD_SHAPE_MISMATCH); to_mold must be AVAILABLE at changeover creation (ERR_MOLD_NOT_AVAILABLE); run [scheduled_start, scheduled_end) must not overlap another run on the same line with status in {PLANNED, IN_PROGRESS, ON_HOLD} — half-open, so adjacent runs touching at an endpoint are allowed (ERR_LINE_SCHEDULE_CONFLICT); a new window's [ship_start, ship_end] must not intersect any existing window with the same season_code — closed interval, so touching endpoints count as overlap (ERR_WINDOW_OVERLAP); window dates must satisfy build_start <= build_end <= ship_start <= ship_end (ERR_WINDOW_DATE_ORDER); gift-component graph must stay acyclic, self-loops included (ERR_GIFT_CYCLE)."
    error_id: ERR_MOLD_SHAPE_MISMATCH
    http_status: 422
    applies_to: "POST /production-runs/{id}/start; POST /production-lines/{id}/changeovers; POST /production-runs; POST /seasonal-windows; POST /gift-components (specific errors: ERR_MOLD_NOT_AVAILABLE 409, ERR_LINE_SCHEDULE_CONFLICT 409, ERR_WINDOW_OVERLAP 409, ERR_WINDOW_DATE_ORDER 422, ERR_GIFT_CYCLE 422)"
  - priority: 7
    category: business_temporal
    check: "Time-window rules: run schedule must satisfy window.build_start <= scheduled_start and scheduled_end <= window.build_end (ERR_OUTSIDE_PRODUCTION_WINDOW); window close requires current date strictly after ship_end (ERR_PREMATURE_CLOSE); PO receive requires current clock >= due_at (ERR_PO_NOT_DUE); REWORK source lot must not be expired, i.e. current clock < lot.expiry_date (ERR_LOT_EXPIRED)."
    error_id: ERR_OUTSIDE_PRODUCTION_WINDOW
    http_status: 422
    applies_to: "POST /production-runs; POST /seasonal-windows/{id}/close; POST /purchase-orders/{id}/receive (specific errors: ERR_PREMATURE_CLOSE 422, ERR_PO_NOT_DUE 422, ERR_LOT_EXPIRED 422)"
  - priority: 8
    category: business_fiscal
    check: "Capacity/quota: packaging_requirement must fit qty_available (ERR_PACKAGING_SHORTAGE); REWORK rework_qty <= source lot qty_on_hand (ERR_REWORK_QTY_EXCEEDS_LOT); GIFT_ASSEMBLY completion requires the FEFO pool to cover every component (ERR_INSUFFICIENT_COMPONENT_LOTS)."
    error_id: ERR_PACKAGING_SHORTAGE
    http_status: 422
    applies_to: "POST /production-runs; POST /production-runs/{id}/complete (specific errors: ERR_REWORK_QTY_EXCEEDS_LOT 422, ERR_INSUFFICIENT_COMPONENT_LOTS 422)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/products"
    description: "Create a finished-good SKU (own-label, private-label co-pack, or gift set)."
    roles: [ProductionPlanner]
    code: 201
    input: [sku_code, name, product_type, brand, "customer_name?", base_price_cents, unit_weight_grams, shelf_life_days, packaging_component_id]
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "List products with optional filters and envelope pagination."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: ["product_type?", "brand?", "packaging_component_id?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "Fetch one product."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/products/{id}/recipes"
    description: "List recipes of a product (FK reverse lookup for Recipe.product_id)."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: Recipe[]
    side_effects: []
  - method: GET
    path: "/products/{id}/gift-components"
    description: "List gift-component rows where the product participates (as gift set or as component)."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: GiftComponent[]
    side_effects: []
  - method: POST
    path: "/recipes"
    description: "Create a recipe with cooking/tempering bands, shape, and allergen set."
    roles: [ProductionPlanner]
    code: 201
    input: [product_id, name, shape_code, cook_temp_min_c, cook_temp_max_c, temper_exit_min_c, temper_exit_max_c, allergens, standard_yield_pct]
    output: Recipe
    side_effects: []
  - method: POST
    path: "/gift-components"
    description: "Add a component product to a gift set BOM; enforces allergen subset and acyclicity."
    roles: [ProductionPlanner]
    code: 201
    input: [gift_product_id, component_product_id, qty_per_set]
    output: GiftComponent
    side_effects: []
  - method: POST
    path: "/packaging-components"
    description: "Register a packaging component (film/carton/tray) with lead time and opening stock."
    roles: [ProductionPlanner]
    code: 201
    input: [sku_code, name, units_per_component, lead_time_days, qty_on_hand]
    output: PackagingComponent
    side_effects: []
  - method: GET
    path: "/packaging-components"
    description: "List packaging components."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: PackagingComponent[]
    side_effects: []
  - method: POST
    path: "/packaging-components/{id}/purchase-orders"
    description: "Order more of a packaging component; due_at = ordered_at + lead_time_days."
    roles: [ProductionPlanner]
    code: 201
    input: [order_qty]
    output: PackagingPO
    side_effects: ["PackagingPO created in ORDERED with system ordered_at and computed due_at"]
  - method: GET
    path: "/purchase-orders"
    description: "List purchase orders (FK reverse lookup for PackagingPO.component_id)."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: ["component_id?", "limit?", "offset?"]
    output: PackagingPO[]
    side_effects: []
  - method: GET
    path: "/purchase-orders/{id}"
    description: "Fetch one purchase order."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: PackagingPO
    side_effects: []
  - method: POST
    path: "/purchase-orders/{id}/receive"
    description: "Receive a PO once the clock reaches due_at; adds stock to the component."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: PackagingPO
    side_effects: ["component.qty_on_hand += order_qty; PackagingComponent.version incremented"]
  - method: POST
    path: "/molds"
    description: "Register a mold/depositor in shape inventory."
    roles: [ProductionPlanner]
    code: 201
    input: [shape_code, cavity_count]
    output: Mold
    side_effects: []
  - method: GET
    path: "/molds"
    description: "List molds."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: ["shape_code?", "status?", "limit?", "offset?"]
    output: Mold[]
    side_effects: []
  - method: POST
    path: "/production-lines"
    description: "Register a production/depositor line."
    roles: [ProductionPlanner]
    code: 201
    input: [name]
    output: ProductionLine
    side_effects: []
  - method: GET
    path: "/production-lines"
    description: "List production lines (FK reverse lookup for ProductionLine.current_mold_id)."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: ["current_mold_id?", "limit?", "offset?"]
    output: ProductionLine[]
    side_effects: []
  - method: GET
    path: "/production-lines/{id}"
    description: "Fetch one production line."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []
  - method: POST
    path: "/production-lines/{id}/changeovers"
    description: "Open a mold/allergen changeover on a line (OCC-guarded on the line's version); line enters CHANGEOVER."
    roles: [LineOperator]
    code: 201
    input: [changeover_type, "to_mold_id?", "target_allergens?", expected_line_version]
    output: Changeover
    side_effects: ["line.status := CHANGEOVER; increments ProductionLine.version by 1"]
  - method: GET
    path: "/production-lines/{id}/changeovers"
    description: "List changeovers of a line (FK reverse lookup for Changeover.line_id)."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: Changeover[]
    side_effects: []
  - method: GET
    path: "/changeovers"
    description: "List changeovers (FK reverse lookup for Changeover.to_mold_id)."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: ["line_id?", "to_mold_id?", "limit?", "offset?"]
    output: Changeover[]
    side_effects: []
  - method: GET
    path: "/changeovers/{id}"
    description: "Fetch one changeover."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: Changeover
    side_effects: []
  - method: POST
    path: "/changeovers/{id}/swab"
    description: "Sanitation lead records the post-wash allergen swab result."
    roles: [SanitationLead]
    code: 200
    input: [swab_passed]
    output: Changeover
    side_effects: ["swab_recorded_by := X-User-ID; status PENDING_SWAB -> PENDING_QA when swab_passed"]
  - method: POST
    path: "/changeovers/{id}/release"
    description: "QA releases the line (segregation of duties vs swab recorder); installs mold and sets allergen clearance."
    roles: [QualityManager]
    code: 200
    input: []
    output: Changeover
    side_effects: ["line.status := AVAILABLE; mold install/swap; line.cleared_allergens updated; increments ProductionLine.version by 1"]
  - method: POST
    path: "/seasonal-windows"
    description: "Create a seasonal production window in DRAFT; closed-interval ship-overlap check per season_code."
    roles: [ProductionPlanner]
    code: 201
    input: [season_code, build_start, build_end, ship_start, ship_end, target_units, markdown_tiers]
    output: SeasonalWindow
    side_effects: []
  - method: GET
    path: "/seasonal-windows"
    description: "List seasonal windows."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: ["status?", "season_code?", "limit?", "offset?"]
    output: SeasonalWindow[]
    side_effects: []
  - method: GET
    path: "/seasonal-windows/{id}"
    description: "Fetch one window with computed build projection fields."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: SeasonalWindow
    side_effects: []
  - method: POST
    path: "/seasonal-windows/{id}/publish"
    description: "Publish a DRAFT window so runs can be scheduled against it."
    roles: [PlantManager]
    code: 200
    input: []
    output: SeasonalWindow
    side_effects: ["increments SeasonalWindow.version by 1"]
  - method: POST
    path: "/seasonal-windows/{id}/close"
    description: "Close a PUBLISHED window once the clock is strictly past ship_end; enables markdown and rework."
    roles: [PlantManager]
    code: 200
    input: []
    output: SeasonalWindow
    side_effects: ["increments SeasonalWindow.version by 1"]
  - method: POST
    path: "/seasonal-windows/{id}/apply-markdown"
    description: "Apply the current markdown tier price to all ACTIVE lots of SEASONAL products built in this window."
    roles: [PlantManager]
    code: 200
    input: []
    output: { updated_lot_count: integer, discount_pct: number, days_after_season_end: integer }
    side_effects: ["markdown_price applied per lot; Lot.version incremented per updated lot"]
  - method: POST
    path: "/production-runs"
    description: "Schedule a production/gift-assembly/rework run in a PUBLISHED window (OCC-guarded on the window's version); reserves packaging and rework units."
    roles: [ProductionPlanner]
    code: 201
    input: [window_id, product_id, recipe_id, line_id, run_type, planned_units, scheduled_start, scheduled_end, "source_lot_id?", "rework_qty?", expected_window_version]
    output: ProductionRun
    side_effects:
      - "packaging_requirement reservation: component.qty_reserved += ceil(planned_units / units_per_component); PackagingComponent.version incremented"
      - "REWORK: source_lot.qty_on_hand -= rework_qty; source_lot.qty_reserved_rework += rework_qty; Lot.version incremented"
      - "REWORK: expected_output_units := floor(rework_qty * recipe.standard_yield_pct)"
      - "seasonal_build_projection recompute on the window; increments SeasonalWindow.version by 1"
  - method: GET
    path: "/production-runs"
    description: "List production runs (FK reverse lookups for window_id, product_id, recipe_id, line_id, source_lot_id, created_lot_id)."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: ["window_id?", "product_id?", "recipe_id?", "line_id?", "source_lot_id?", "created_lot_id?", "status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: GET
    path: "/production-runs/{id}"
    description: "Fetch one production run."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: POST
    path: "/production-runs/{id}/start"
    description: "Start a PLANNED run; gates on line availability, allergen clearance, and mold shape."
    roles: [LineOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["increments ProductionRun.version by 1"]
  - method: POST
    path: "/production-runs/{id}/hold"
    description: "Pause an in-progress run (process upset, depotting delay)."
    roles: [LineOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["increments ProductionRun.version by 1"]
  - method: POST
    path: "/production-runs/{id}/resume"
    description: "Resume a held run."
    roles: [LineOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["increments ProductionRun.version by 1"]
  - method: POST
    path: "/production-runs/{id}/complete"
    description: "Complete an in-progress run with actual process temperatures and output; creates the lot and fires deviation/gift/rework cascades."
    roles: [LineOperator]
    code: 200
    input: [actual_cook_temp_c, actual_temper_exit_c, output_units]
    output: ProductionRun
    side_effects: ["see ProductionRun IN_PROGRESS -> COMPLETED side effects (lot creation, packaging consumption, deviation cascade, FEFO backflush, rework bookkeeping, window recompute)"]
  - method: POST
    path: "/production-runs/{id}/cancel"
    description: "Cancel a PLANNED or ON_HOLD run; releases packaging reservation and rework earmark."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["packaging reservation released; REWORK earmark restored to source lot; window projection recomputed"]
  - method: GET
    path: "/lots"
    description: "List lots (FK reverse lookups for Lot.product_id and Lot.run_id)."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: ["product_id?", "run_id?", "status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []
  - method: GET
    path: "/lots/{id}"
    description: "Fetch one lot."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: POST
    path: "/quality-holds"
    description: "Open a quality hold on an ACTIVE lot (e.g. a bloom complaint); blocks the lot."
    roles: [QualityManager, LineOperator]
    code: 201
    input: [lot_id, defect_type, affected_units]
    output: QualityHold
    side_effects: ["lot.status := BLOCKED; lot_qty_at_open snapshot; defect_rate_pct computed; seasonal_build_projection recompute on the lot's window"]
  - method: GET
    path: "/quality-holds"
    description: "List quality holds (FK reverse lookup for QualityHold.lot_id)."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: ["lot_id?", "status?", "limit?", "offset?"]
    output: QualityHold[]
    side_effects: []
  - method: GET
    path: "/quality-holds/{id}"
    description: "Fetch one quality hold."
    roles: [ProductionPlanner, PlantManager, LineOperator, SanitationLead, QualityManager]
    code: 200
    input: []
    output: QualityHold
    side_effects: []
  - method: POST
    path: "/quality-holds/{id}/disposition"
    description: "Disposition an OPEN hold: RELEASE (trim affected units, unblock), SCRAP (write off the lot), or REWORK (offer the lot to a rework run)."
    roles: [QualityManager]
    code: 200
    input: [action]
    output: QualityHold
    side_effects: ["per QualityHold state machine: lot trim/scrap side effects and window recompute; REWORK leaves lot BLOCKED and rework-eligible"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced; no entity mutations"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unknown X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Authenticated role is not in the endpoint's roles list."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id (validated left-to-right) or a body FK references a non-existent resource."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request: missing required field, bad enum value, recipe/product mismatch, GIFT_ASSEMBLY on a non-GIFT_SET product, REWORK without source_lot_id/rework_qty, scheduled_start >= scheduled_end, target_allergens present on a non-ALLERGEN_WASH changeover or absent on ALLERGEN_WASH."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State-machine precondition violated (wrong from-state for the requested transition, window not PUBLISHED at run creation, hold not OPEN at disposition, PO not ORDERED at receive, terminal-state lockdown)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch: expected_window_version != window.version on run creation, or expected_line_version != line.version on changeover creation."
  - id: ERR_LINE_NOT_AVAILABLE
    http: 409
    condition: "Line is in CHANGEOVER when a run start or a new changeover requires AVAILABLE."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Changeover release attempted by the same X-User-ID that recorded the swab."
  - id: ERR_SWAB_FAILED
    http: 422
    condition: "Swab recorded with swab_passed == false; changeover stays PENDING_SWAB."
  - id: ERR_ALLERGEN_WASH_REQUIRED
    http: 422
    condition: "Run start where recipe.allergens is not a subset of line.cleared_allergens (cross-contact prevention)."
  - id: ERR_UNDECLARED_ALLERGEN
    http: 422
    condition: "Gift component would introduce an allergen (union of the component product's recipes) not declared by any recipe of the gift product."
  - id: ERR_MOLD_SHAPE_MISMATCH
    http: 422
    condition: "Run start where the line's installed mold shape_code differs from the recipe's shape_code (including no mold installed)."
  - id: ERR_MOLD_NOT_AVAILABLE
    http: 409
    condition: "Changeover to_mold_id references a mold that is already INSTALLED on a line."
  - id: ERR_LINE_SCHEDULE_CONFLICT
    http: 409
    condition: "New run's half-open [scheduled_start, scheduled_end) intersects another run on the same line with status in {PLANNED, IN_PROGRESS, ON_HOLD}; touching at an endpoint is allowed."
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "New window's closed [ship_start, ship_end] intersects an existing window with the same season_code; touching endpoints count as overlap."
  - id: ERR_GIFT_CYCLE
    http: 422
    condition: "Gift-component edge would create a cycle in the gift-set graph (including gift_product_id == component_product_id)."
  - id: ERR_WINDOW_DATE_ORDER
    http: 422
    condition: "Window dates violate build_start <= build_end <= ship_start <= ship_end."
  - id: ERR_OUTSIDE_PRODUCTION_WINDOW
    http: 422
    condition: "Run scheduled_start before window.build_start or scheduled_end after window.build_end."
  - id: ERR_PREMATURE_CLOSE
    http: 422
    condition: "Window close attempted while current clock date is on or before ship_end."
  - id: ERR_PO_NOT_DUE
    http: 422
    condition: "PO receive attempted before due_at (ordered_at + lead_time_days)."
  - id: ERR_LOT_EXPIRED
    http: 422
    condition: "REWORK source lot whose expiry_date <= current clock."
  - id: ERR_PACKAGING_SHORTAGE
    http: 422
    condition: "ceil(planned_units / units_per_component) exceeds the component's qty_available at run creation."
  - id: ERR_INSUFFICIENT_COMPONENT_LOTS
    http: 422
    condition: "GIFT_ASSEMBLY completion where the FEFO-eligible pool (ACTIVE, quality OK, unexpired) cannot cover qty_per_set * output_units for some component."
  - id: ERR_REWORK_QTY_EXCEEDS_LOT
    http: 422
    condition: "REWORK run's rework_qty exceeds the source lot's qty_on_hand."
  - id: ERR_BLOOM_RELEASE_FORBIDDEN
    http: 422
    condition: "RELEASE disposition on a BLOOM hold whose defect_rate_pct >= 2.00."
  - id: ERR_LOT_NOT_REWORKABLE
    http: 409
    condition: "REWORK source lot is DEPLETED/SCRAPPED, or BLOCKED without a hold in REWORK_PENDING."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProductionPlanner
    description: "Plans the season: masters (products, recipes, gift BOMs, packaging, molds, lines, windows), purchase orders, and run scheduling."
    identity: opaque
    exclusive_operations:
      - "POST /products, /recipes, /gift-components, /packaging-components, /molds, /production-lines, /seasonal-windows"
      - "POST /packaging-components/{id}/purchase-orders, POST /purchase-orders/{id}/receive"
      - "POST /production-runs, POST /production-runs/{id}/cancel"
    shared_operations:
      - "all GET endpoints"
  - name: PlantManager
    description: "Owns season governance: publishes/closes windows, applies post-season markdown, operates the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /seasonal-windows/{id}/publish, /close, /apply-markdown"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
  - name: LineOperator
    description: "Runs the floor: executes runs, opens changeovers, and can raise quality holds."
    identity: opaque
    exclusive_operations:
      - "POST /production-runs/{id}/start, /hold, /resume, /complete"
      - "POST /production-lines/{id}/changeovers"
    shared_operations:
      - "all GET endpoints"
      - "POST /quality-holds (shared with QualityManager)"
  - name: SanitationLead
    description: "Records allergen swab results after washdown. May never release the line (segregation of duties with QualityManager)."
    identity: opaque
    exclusive_operations:
      - "POST /changeovers/{id}/swab"
    shared_operations:
      - "all GET endpoints"
  - name: QualityManager
    description: "Dispositions quality holds and releases changeovers after independent QA review (must differ from the swab recorder)."
    identity: opaque
    exclusive_operations:
      - "POST /changeovers/{id}/release"
      - "POST /quality-holds/{id}/disposition"
    shared_operations:
      - "all GET endpoints"
      - "POST /quality-holds (shared with LineOperator)"
