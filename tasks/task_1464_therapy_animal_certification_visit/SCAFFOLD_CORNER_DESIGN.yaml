# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Therapy Animal Certification & Visit Scheduling
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: handler_creation_defaults
        claim_type: creation
        grounds:
          - entities.Handler
          - state_machines.Handler
        distinguishing_aspect: "A freshly self-registered handler starts in APPLICANT with computed fields at their zero defaults."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "New H", email: "new@x.com", region_code: "WA", volunteer_since: "2025-01-15" }, as: Anonymous, captures: { h: $.data.id, st: $.data.status, lt: $.data.lifetime_minutes, tier: $.data.recognition_tier, ver: $.data.version } }
          assert:
            - "st == APPLICANT (initial state)"
            - "lt == 0 AND tier == NONE (computed defaults)"
            - "ver == 1 (common_fields version starts at 1)"
            - "id is a bare UUID with no type prefix"

      - name: handler_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Handler.fields.email
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required input email is rejected at schema priority 5."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/handlers", payload: { full_name: "No Email", region_code: "WA", volunteer_since: "2025-01-15" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

      - name: animal_invalid_species_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.Animal.fields.species
          - errors[ERR_INVALID_ENUM_VALUE]
        distinguishing_aspect: "species is a closed enum; LLAMA is rejected even though the rest of the payload is valid."
        test_recipe:
          setup: ["handler h ACTIVE"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H E", email: "he@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/animals", payload: { name: "Larry", species: "LLAMA", breed: "Alpaca cross", date_of_birth: "2022-01-01" }, as: Handler, as_user_id: "${h}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_ENUM_VALUE (400)"

      - name: animal_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_ANIMAL_NOT_FOUND]
        distinguishing_aspect: "Reading a non-existent animal id yields the entity-specific 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/animals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ANIMAL_NOT_FOUND (404)"

      - name: visit_request_listing_pagination_and_envelope
        claim_type: listing
        grounds:
          - entities.VisitRequest
          - response_envelope
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more, and the envelope carries meta.api_request_id with response_type array."
        test_recipe:
          setup: ["facility f ONBOARDING (created via facility + draft agreement); three OPEN requests"]
          setup_api_calls:
            - { call: "POST /v1/facilities", payload: { name: "Fac Pg", facility_type: "SCHOOL", region_code: "WA", max_visit_minutes: 60, allowed_species: ["DOG"], min_liability_coverage_cents: 100000000, max_overlapping_teams: 2, visits_per_week_cap: 5 }, as: ProgramAdmin, captures: { f: $.data.id } }
            - { call: "POST /v1/visit-requests", payload: { requested_start: "2026-08-10T10:00:00Z", requested_end: "2026-08-10T10:30:00Z", visit_program: "GENERAL", priority: "ROUTINE" }, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/visit-requests", payload: { requested_start: "2026-08-11T10:00:00Z", requested_end: "2026-08-11T10:30:00Z", visit_program: "READING", priority: "HIGH" }, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/visit-requests", payload: { requested_start: "2026-08-12T10:00:00Z", requested_end: "2026-08-12T10:30:00Z", visit_program: "REHAB", priority: "URGENT" }, as: FacilityCoordinator, as_user_id: "${f}" }
          trigger:
            - { call: "GET /v1/visit-requests?facility_id=${f}&limit=2&offset=0", payload: {}, as: ProgramAdmin }
            - { call: "GET /v1/visit-requests?facility_id=${f}&limit=2&offset=2", payload: {}, as: ProgramAdmin }
          assert:
            - "Page 1: 2 rows, total_count == 3, has_more == true; envelope meta.api_request_id present and response_type == array"
            - "Page 2 (offset 2): 1 row, total_count == 3, has_more == false"

      - name: hour_credit_ledger_rows_immutable
        claim_type: immutability
        grounds:
          - entities.HourCredit
        distinguishing_aspect: "HourCredit is common_fields:false — responses carry id and created_at only (no version/updated_at) and no mutation endpoint exists beyond creation."
        test_recipe:
          setup: ["handler h ACTIVE"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H HC", email: "hhc@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/hour-credits/adjustments", payload: { handler_id: "${h}", minutes: 45, reason: "seed" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { hc: $.data.id, kind: $.data.kind } }
            - { call: "GET /v1/hour-credits/${hc}", payload: {}, as: ProgramAdmin }
          assert:
            - "kind == ADJUSTMENT and minutes == 45"
            - "The HourCredit representation has id and created_at but NO version or updated_at fields"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: handler_approve_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Handler.APPLICANT_to_ACTIVE
          - errors[ERR_HANDLER_NOT_APPLICANT]
        distinguishing_aspect: "Approve is only valid from APPLICANT; repeating it on an ACTIVE handler is rejected and idempotency is NOT assumed."
        test_recipe:
          setup: ["handler h ACTIVE"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H A2", email: "ha2@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_HANDLER_NOT_APPLICANT (409)"

      - name: revoked_certification_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Certification
          - errors[ERR_CERT_NOT_RENEWABLE]
          - errors[ERR_CERT_NOT_SUSPENDED]
        distinguishing_aspect: "REVOKED is terminal: renew and reinstate are both rejected afterwards."
        test_recipe:
          setup: ["certification c ACTIVE (canonical certified-team chain, rabies valid_until 2029-12-31, policy through 2029-12-31)"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H RT", email: "hrt@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "D", species: "DOG", breed: "Beagle", date_of_birth: "2021-01-01" }, as: Handler, as_user_id: "${h}", captures: { a: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "TRT" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev RT", email: "evrt@x.com", region_code: "WA", specializations: ["DOG"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 80, obedience_score: 70 }, as: Evaluator, as_user_id: "${ev}" }
            - { call: "POST /v1/vaccination-records", payload: { animal_id: "${a}", vaccine_type: "RABIES", administered_on: "2026-07-01", valid_until: "2029-12-31", veterinarian_name: "Dr V" }, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/insurance-policies", payload: { insurer_name: "INS", policy_number: "P-RT", coverage_cents: 200000000, effective_from: "2026-01-01", effective_until: "2029-12-31" }, as: Handler, as_user_id: "${h}", captures: { p: $.data.id } }
            - { call: "POST /v1/insurance-policies/${p}/verify", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/certifications", payload: { team_id: "${t}", evaluation_id: "${e}" }, as: ProgramAdmin, captures: { c: $.data.id } }
            - { call: "POST /v1/certifications/${c}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/certifications/${c}/revoke", payload: { reason: "fraudulent records" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { st: $.data.status } }
            - { call: "POST /v1/certifications/${c}/renew", payload: {}, as: ProgramAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /v1/certifications/${c}/reinstate", payload: {}, as: ComplianceOfficer, as_user_id: "co-1", captures: { err2: $.data.error_id } }
          assert:
            - "st == REVOKED"
            - "err1 == ERR_CERT_NOT_RENEWABLE"
            - "err2 == ERR_CERT_NOT_SUSPENDED"
            - "Team.${t}.status == DISSOLVED (revocation cascade)"

      - name: evaluation_cancelled_cannot_be_scored
        claim_type: invalid_transition
        grounds:
          - state_machines.Evaluation
          - errors[ERR_EVALUATION_NOT_SCHEDULED]
        distinguishing_aspect: "Scoring requires SCHEDULED; a CANCELLED evaluation rejects scoring."
        test_recipe:
          setup: ["evaluation e REQUESTED then cancelled by its handler"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H EC", email: "hec@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "D", species: "DOG", breed: "Beagle", date_of_birth: "2021-01-01" }, as: Handler, as_user_id: "${h}", captures: { a: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "TEC" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev EC", email: "evec@x.com", region_code: "WA", specializations: ["DOG"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e}/cancel", payload: {}, as: Handler, as_user_id: "${h}" }
          trigger:
            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 90, obedience_score: 90 }, as: Evaluator, as_user_id: "${ev}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVALUATION_NOT_SCHEDULED (409)"

      - name: evaluation_appeal_window_closed_then_swept
        claim_type: valid_transition
        grounds:
          - state_machines.Evaluation.FAILED_to_APPEALED
          - state_machines.Evaluation.FAILED_to_EXPIRED
          - errors[ERR_EVALUATION_APPEAL_WINDOW_CLOSED]
        distinguishing_aspect: "Appeal at failed_at + 15 days is rejected, and the sweep then moves the stale FAILED evaluation to EXPIRED."
        test_recipe:
          setup: ["evaluation e FAILED at 2026-08-02T11:00:00Z; clock advanced to 2026-08-17T00:00:00Z (> failed_at + 14d)"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H AW", email: "haw@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "D", species: "DOG", breed: "Beagle", date_of_birth: "2021-01-01" }, as: Handler, as_user_id: "${h}", captures: { a: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "TEW" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev AW", email: "evaw@x.com", region_code: "WA", specializations: ["DOG"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 60, obedience_score: 60 }, as: Evaluator, as_user_id: "${ev}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/evaluations/${e}/appeal", payload: {}, as: Handler, as_user_id: "${h}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/_sweeps/run", payload: {}, as: ProgramAdmin, captures: { swept: $.data.evaluations_expired } }
            - { call: "GET /v1/evaluations/${e}", payload: {}, as: ProgramAdmin, captures: { st: $.data.status } }
          assert:
            - "err == ERR_EVALUATION_APPEAL_WINDOW_CLOSED"
            - "swept == 1 AND st == EXPIRED"

      - name: sweep_offer_expiry_reopens_without_decline_count
        claim_type: valid_transition
        grounds:
          - state_machines.VisitRequest.OFFERED_to_OPEN
        distinguishing_aspect: "Sweep-driven offer expiry returns the request to OPEN like a decline but does NOT increment decline_count — the two reopen paths are distinguishable."
        test_recipe:
          setup: ["request r OFFERED to team t at 2026-08-02T12:00:00Z (offer_expires_at 2026-08-05T12:00:00Z); clock 2026-08-05T12:00:01Z; no sweep has run yet"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H OE", email: "hoe@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "D", species: "DOG", breed: "Beagle", date_of_birth: "2021-01-01" }, as: Handler, as_user_id: "${h}", captures: { a: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "TOE" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev OE", email: "evoe@x.com", region_code: "WA", specializations: ["DOG"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 80, obedience_score: 70 }, as: Evaluator, as_user_id: "${ev}" }
            - { call: "POST /v1/vaccination-records", payload: { animal_id: "${a}", vaccine_type: "RABIES", administered_on: "2026-07-01", valid_until: "2029-12-31", veterinarian_name: "Dr V" }, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/insurance-policies", payload: { insurer_name: "INS", policy_number: "P-OE", coverage_cents: 200000000, effective_from: "2026-01-01", effective_until: "2029-12-31" }, as: Handler, as_user_id: "${h}", captures: { p: $.data.id } }
            - { call: "POST /v1/insurance-policies/${p}/verify", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/certifications", payload: { team_id: "${t}", evaluation_id: "${e}" }, as: ProgramAdmin, captures: { c: $.data.id } }
            - { call: "POST /v1/certifications/${c}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facilities", payload: { name: "School U", facility_type: "SCHOOL", region_code: "WA", max_visit_minutes: 60, allowed_species: ["DOG"], min_liability_coverage_cents: 100000000, max_overlapping_teams: 2, visits_per_week_cap: 5 }, as: ProgramAdmin, captures: { f: $.data.id } }
            - { call: "POST /v1/facility-agreements", payload: { facility_id: "${f}", start_on: "2026-07-01", end_on: "2027-06-30", agreed_max_visit_minutes: 90, insurance_minimum_cents: 100000000, terms_version: "t1" }, as: ProgramAdmin, captures: { ag: $.data.id } }
            - { call: "POST /v1/facility-agreements/${ag}/submit", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facility-agreements/${ag}/sign-facility", payload: {}, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/facility-agreements/${ag}/sign-program", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/orientation-records", payload: { team_id: "${t}" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { o: $.data.id } }
            - { call: "POST /v1/orientation-records/${o}/complete", payload: { attended_on: "2026-08-02" }, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/liability-waivers", payload: { team_id: "${t}", facility_id: "${f}", waiver_version: "v1", signed_on: "2026-08-02" }, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/visit-requests", payload: { requested_start: "2026-08-10T14:00:00Z", requested_end: "2026-08-10T15:00:00Z", visit_program: "GENERAL", priority: "ROUTINE" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/visit-requests/${r}/offers", payload: { team_id: "${t}", expected_visit_request_version: "${r_v}" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T12:00:01Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/_sweeps/run", payload: {}, as: ProgramAdmin, captures: { oe: $.data.offers_expired } }
            - { call: "GET /v1/visit-requests/${r}", payload: {}, as: ProgramAdmin, captures: { st: $.data.status, dc: $.data.decline_count, ot: $.data.offered_team_id } }
          assert:
            - "oe == 1"
            - "st == OPEN AND dc == 0 (sweep expiry does NOT count as a decline) AND ot == null"

      - name: sweep_request_expiry_feeds_unmet_demand
        claim_type: side_effect_execution
        grounds:
          - state_machines.VisitRequest.OPEN_to_EXPIRED
          - calculations.unmet_demand_index
        distinguishing_aspect: "A request whose window lapses unmet is swept to EXPIRED with expired_on stamped, and the facility demand summary reflects it (open 0, expired_last_90d 1, index 1)."
        test_recipe:
          setup: ["facility f ACTIVE with agreement; one request window 2026-08-10T14:00:00Z-15:00:00Z never offered; clock 2026-08-11T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /v1/facilities", payload: { name: "Fac D", facility_type: "SCHOOL", region_code: "WA", max_visit_minutes: 60, allowed_species: ["DOG"], min_liability_coverage_cents: 100000000, max_overlapping_teams: 2, visits_per_week_cap: 5 }, as: ProgramAdmin, captures: { f: $.data.id } }
            - { call: "POST /v1/facility-agreements", payload: { facility_id: "${f}", start_on: "2026-07-01", end_on: "2027-06-30", agreed_max_visit_minutes: 90, insurance_minimum_cents: 100000000, terms_version: "t1" }, as: ProgramAdmin, captures: { ag: $.data.id } }
            - { call: "POST /v1/facility-agreements/${ag}/submit", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facility-agreements/${ag}/sign-facility", payload: {}, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/facility-agreements/${ag}/sign-program", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/visit-requests", payload: { requested_start: "2026-08-10T14:00:00Z", requested_end: "2026-08-10T15:00:00Z", visit_program: "GENERAL", priority: "URGENT" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { r: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/_sweeps/run", payload: {}, as: ProgramAdmin, captures: { re: $.data.requests_expired } }
            - { call: "GET /v1/facilities/${f}/demand-summary", payload: {}, as: ProgramAdmin, captures: { oc: $.data.open_request_count, ex: $.data.expired_last_90d, idx: $.data.unmet_demand_index } }
          assert:
            - "re == 1"
            - "oc == 0 AND ex == 1 AND idx == 1 (unmet_demand_index = open + expired_last_90d)"

      - name: deemed_verified_posts_final_credit
        claim_type: valid_transition
        grounds:
          - state_machines.VisitVerification.UNVERIFIED_to_VERIFIED
          - calculations.visit_credit_minutes
        distinguishing_aspect: "A COMPLETED visit left UNVERIFIED for more than 14 days is swept to VERIFIED and the FINAL credit (from actual minutes) replaces the provisional exactly once."
        test_recipe:
