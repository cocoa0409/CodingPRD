scenario: "2154. State & Local Tax Apportionment Filing (multistate SALT team): nexus determination by activity & economic thresholds, apportionment factor computation (sales/property/payroll) & sourcing rules, combined vs separate filing election, state modifications & credits, estimated payment & extension by state, notice/assessment response & appeal, voluntary disclosure agreement for past exposure, filing calendar & registration maintenance — design task harder than expert level"
domain_name: salt-apportionment-filing
api_prefix: /salt

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. `ActivityRecord` is a junction
  # row between `LegalEntity` and `StateRegistration`; nothing is nested more than
  # one level deep in a URL path.

  state_machine_shape: parallel
  # `StateFiling` carries two independent axes (preparation_status x payment_status).
  # `Notice` is cyclic (RESPONDED -> INFO_REQUESTED -> RESPONDED) AND branching
  # (APPEAL_FILED -> {APPEAL_SUSTAINED, APPEAL_DENIED}).
  # `FilingElection` is cyclic (ELECTED -> REVOKED -> ELECTED).
  # `StateRegistration` carries two axes (nexus_status x registration_status).

  relationship_patterns:
    - one_to_many
    - many_to_many        # ActivityRecord joins LegalEntity x StateRegistration
    - cross_aggregate     # Notice/VDAAgreement reach across the filing aggregate

  role_model: segregation_of_duties
  # The user who submits a filing for review (X-User-ID recorded as
  # StateFiling.preparer_user_id) MUST NOT be the user who approves it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  RENT_CAPITALIZATION_MULTIPLE: 8
  FACTOR_RATIO_PRECISION: 6
  MONEY_PRECISION: 2
  ROUNDING_MODE: round_half_up
  EXTENSION_PREPAY_PCT: 0.90
  UNDERPAYMENT_PENALTY_RATE: 0.05
  SAFE_HARBOR_PRIOR_YEAR_100_FACTOR: 1.00
  SAFE_HARBOR_PRIOR_YEAR_110_FACTOR: 1.10
  SAFE_HARBOR_CURRENT_YEAR_90_FACTOR: 0.90
  INSTALLMENT_DUE_MONTHS: [4, 6, 9, 12]
  INSTALLMENT_DUE_DAY: 15
  NOTICE_PENALTY_RATE: 0.10
  NOTICE_PENALTY_CAP: 2500.00
  NOTICE_INTEREST_RATE: 0.06
  DAYS_PER_YEAR: 365
  APPEAL_WINDOW_DAYS: 90
  DEFAULT_RESPONSE_DUE_DAYS: 45
  FULL_EXPOSURE_YEARS: 7
  VDA_MAX_LOOKBACK_YEARS: 4
  VDA_PENALTY_WAIVER_RATE: 0.25
  VDA_COOLING_MONTHS: 24
  VDA_SHIELD_MONTHS: 24

# =========================================================================
# 1.1 Entity-Relationship Table
# =========================================================================
entities:

  - name: TaxpayerGroup
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the combined-reporting group
      - name: base_state_code
        type: string
        source: input
        description: two-letter commercial-domicile state code
        constraints: exactly 2 uppercase letters
      - name: fiscal_year_end_month
        type: integer
        source: input
        description: calendar month the group's tax year ends
        default: 12
        constraints: 1..12
      - name: everywhere_sales
        type: number
        source: input
        description: total gross receipts everywhere; base denominator of the SALES factor
        constraints: ">= 0"
      - name: everywhere_property
        type: number
        source: input
        description: total average owned+capitalized-rented property everywhere; denominator of the PROPERTY factor
        constraints: ">= 0"
      - name: everywhere_payroll
        type: number
        source: input
        description: total compensation everywhere; denominator of the PAYROLL factor
        constraints: ">= 0"
      - name: open_registration_obligations
        type: integer
        source: computed
        description: count of this group's StateRegistration rows whose registration_status == REGISTRATION_REQUIRED
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: derived group posture per calculations.group_compliance_posture
        default: COMPLIANT
        constraints: "COMPLIANT | EXPOSED | DELINQUENT"
      - name: nowhere_sales_pool
        type: number
        source: computed
        description: cumulative origin_sales of the most recent compute-factors run whose purchaser_taxable_in_state == false and whose registration throwback_rule == NONE (sales assigned to no state)
        default: 0

  - name: LegalEntity
    parent: TaxpayerGroup
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> TaxpayerGroup.id; owning combined group
      - name: name
        type: string
        source: input
        description: legal name of the member entity
      - name: entity_type
        type: enum
        source: input
        description: organizational form of the member
        default: CORP
        constraints: "CORP | LLC | PARTNERSHIP | DISREGARDED"
      - name: incorporation_state_code
        type: string
        source: input
        description: two-letter state of incorporation/organization
      - name: is_unitary_member
        type: boolean
        source: input
        description: whether this member is included in the group's unitary business
        default: true
      - name: vda_shield_until
        type: datetime
        source: computed
        description: set when a VDAAgreement naming this entity reaches EXECUTED; executed_on_date + VDA_SHIELD_MONTHS
        default: null

  - name: StateRegistration
    parent: TaxpayerGroup
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> TaxpayerGroup.id; group this state profile belongs to
      - name: state_code
        type: string
        source: input
        description: two-letter taxing-state code; unique per group
      - name: factor_formula
        type: enum
        source: input
        description: the state's apportionment weighting scheme
        constraints: "EQUAL_WEIGHTED_THREE | DOUBLE_WEIGHTED_SALES | SINGLE_SALES_FACTOR"
      - name: tax_rate
        type: number
        source: input
        description: state corporate income tax rate applied to state_taxable_income
        constraints: "0 <= tax_rate <= 1"
      - name: throwback_rule
        type: enum
        source: input
        description: treatment of origin sales whose purchaser is not taxable in the destination state
        constraints: "THROWBACK | THROWOUT | NONE"
      - name: service_sourcing_rule
        type: enum
        source: input
        description: how service receipts are sourced to this state
        constraints: "MARKET_BASED | COST_OF_PERFORMANCE"
      - name: economic_nexus_sales_threshold
        type: number
        source: input
        description: in-state receipts at or above which economic nexus attaches
        default: 500000
      - name: economic_nexus_employee_days_threshold
        type: integer
        source: input
        description: in-state employee-days at or above which physical nexus attaches for unprotected activity
        default: 15
      - name: nexus_status
        type: enum
        source: computed
        description: nexus axis, set by calculations.nexus_determination or by VDA execution
        default: NONE
        constraints: "NONE | PROTECTED_PL86272 | ECONOMIC | PHYSICAL | VOLUNTARY"
      - name: registration_status
        type: enum
        source: computed
        description: registration axis, independent of nexus_status
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | REGISTRATION_REQUIRED | REGISTERED | WITHDRAWN"
      - name: state_account_number
        type: string
        source: system
        description: state-issued account number, stamped by complete-registration
        default: null
      - name: registered_on_date
        type: datetime
        source: system
        description: logical-clock instant at which registration_status became REGISTERED
        default: null
      - name: due_month
        type: integer
        source: input
        description: month of the original return due date in the year following the tax year
        default: 4
        constraints: 1..12
      - name: due_day
        type: integer
        source: input
        description: day of month of the original return due date
        default: 15
        constraints: 1..28
      - name: extension_months
        type: integer
        source: input
        description: months added to original_due_date when an ExtensionRequest is GRANTED
        default: 6
        constraints: 0..12
      - name: estimated_installment_count
        type: integer
        source: input
        description: number of estimated-tax installments the state requires per year
        default: 4
        constraints: 1..4
      - name: safe_harbor_basis
        type: enum
        source: input
        description: which estimated-payment variant this state's safe harbor uses
        default: PRIOR_YEAR_100
        constraints: "PRIOR_YEAR_100 | PRIOR_YEAR_110 | CURRENT_YEAR_90"
      - name: prior_year_tax
        type: number
        source: input
        description: prior-year state tax liability, base of the PRIOR_YEAR safe-harbor variant
        default: 0
      - name: current_year_estimated_tax
        type: number
        source: input
        description: annualized current-year state tax estimate, base of the CURRENT_YEAR_90 variant
        default: 0
      - name: state_permits_early_revocation
        type: boolean
        source: input
        description: whether this state allows a FilingElection to be revoked inside its binding period
        default: false
      - name: calendar_rolled_through_year
        type: integer
        source: computed
        description: highest through_tax_year passed to roll-filing-calendar on this registration
        default: 0
      - name: total_payments_received
        type: number
        source: computed
        description: sum of EstimatedPayment.amount for this registration whose status IN {RECEIVED, APPLIED, UNAPPLIED, REFUNDED}
        default: 0
      - name: unapplied_payment_balance
        type: number
        source: computed
        description: sum of EstimatedPayment.amount for this registration whose status IN {RECEIVED, UNAPPLIED}
        default: 0

  - name: ActivityRecord
    parent: StateRegistration
    common_fields: false
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> StateRegistration.id; the state this activity occurred in
      - name: legal_entity_id
        type: string
        source: input
        description: FK -> LegalEntity.id; the group member that conducted the activity
      - name: tax_year
        type: integer
        source: input
        description: tax year the activity belongs to
      - name: destination_sales
        type: number
        source: input
        description: tangible-goods receipts delivered to purchasers in this state
        default: 0
      - name: origin_sales
        type: number
        source: input
        description: tangible-goods receipts shipped FROM this state to out-of-state purchasers
        default: 0
      - name: purchaser_taxable_in_state
        type: boolean
        source: input
        description: whether the purchaser of origin_sales is taxable in the destination state
        default: true
      - name: service_receipts
        type: number
        source: input
        description: receipts from services connected to this state
        default: 0
      - name: cost_of_performance_state_code
        type: string
        source: input
        description: state where the greater cost of performing the services occurred; used only when service_sourcing_rule == COST_OF_PERFORMANCE
        default: null
      - name: property_average_value
        type: number
        source: input
        description: average value of owned real and tangible personal property in this state
        default: 0
      - name: rented_property_annual_rent
        type: number
        source: input
        description: annual rent for property in this state; capitalized at RENT_CAPITALIZATION_MULTIPLE
        default: 0
      - name: payroll_compensation
        type: number
        source: input
        description: compensation paid for services performed in this state
        default: 0
      - name: employee_days_in_state
        type: integer
        source: input
        description: employee-days physically spent in this state
        default: 0
      - name: protected_solicitation_only
        type: boolean
        source: input
        description: whether the member's only in-state activity was P.L. 86-272 protected solicitation of orders
        default: false

  - name: FilingElection
    parent: StateRegistration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> StateRegistration.id; state the election binds
      - name: election_basis
        type: enum
        source: input
        description: reporting basis elected for the binding period
        constraints: "COMBINED_UNITARY | SEPARATE_ENTITY | CONSOLIDATED"
      - name: effective_tax_year
        type: integer
        source: input
        description: first tax year covered by the election
      - name: binding_years
        type: integer
        source: input
        description: number of tax years the election binds, counting effective_tax_year
        constraints: ">= 1"
      - name: expires_after_tax_year
        type: integer
        source: computed
        description: effective_tax_year + binding_years - 1
      - name: status
        type: enum
        source: computed
        description: election lifecycle state
        default: ELECTED
        constraints: "ELECTED | REVOKED | EXPIRED"
      - name: revocation_tax_year
        type: integer
        source: system
        description: first tax year no longer covered after a revoke
        default: null
      - name: reinstatement_count
        type: integer
        source: computed
        description: number of times this election has gone REVOKED -> ELECTED
        default: 0
      - name: reason
        type: string
        source: input
        description: free-text note recorded by revoke
        default: null

  - name: StateFiling
    parent: StateRegistration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> StateRegistration.id; state and calendar this return belongs to
      - name: election_id
        type: string
        source: input
        description: FK -> FilingElection.id; the election that governs this return's basis; null when the state has no election on file
        default: null
      - name: primary_legal_entity_id
        type: string
        source: input
        description: FK -> LegalEntity.id; required when filing_basis == SEPARATE_ENTITY, ignored otherwise
        default: null
      - name: tax_year
        type: integer
        source: input
        description: tax year of the return
      - name: filing_basis
        type: enum
        source: input
        description: reporting basis actually used on this return
        constraints: "COMBINED_UNITARY | SEPARATE_ENTITY | CONSOLIDATED"
      - name: federal_taxable_income
        type: number
        source: input
        description: starting-point federal taxable income before state modifications
      - name: apportionment_variant
        type: enum
        source: computed
        description: member-inclusion doctrine used by the most recent compute-factors run
        default: null
        constraints: "JOYCE | FINNIGAN"
      - name: preparation_status
        type: enum
        source: computed
        description: preparation axis of the return
        default: DRAFT
        constraints: "DRAFT | FACTORS_LOCKED | IN_REVIEW | APPROVED | FILED | AMENDED"
      - name: payment_status
        type: enum
        source: computed
        description: settlement axis of the return, derived per calculations.filing_balance_due
        default: UNPAID
        constraints: "UNPAID | PARTIALLY_PAID | PAID | OVERPAID | REFUND_CLAIMED"
      - name: apportionment_percentage
        type: number
        source: computed
        description: weighted apportionment percentage, 6 decimal places
        default: 0
      - name: modification_total
        type: number
        source: computed
        description: signed sum of per-line rounded Modification.line_amount values
        default: 0
      - name: state_taxable_income
        type: number
        source: computed
        description: round((federal_taxable_income + modification_total) * apportionment_percentage, 2)
        default: 0
      - name: tax_before_credits
        type: number
        source: computed
        description: round(state_taxable_income * StateRegistration.tax_rate, 2)
        default: 0
      - name: credits_applied_total
        type: number
        source: computed
        description: sum of CreditClaim.applied_amount for this filing
        default: 0
      - name: estimated_credits_applied
        type: number
        source: computed
        description: sum of EstimatedPayment.amount for payments whose applied_filing_id == this filing and status == APPLIED
        default: 0
      - name: assessment_added_total
        type: number
        source: computed
        description: sum of Notice.assessment_final_amount for notices on this filing whose status IN {APPEAL_DENIED, APPEAL_SUSTAINED, CLOSED}
        default: 0
      - name: balance_due
        type: number
        source: computed
        description: round(tax_before_credits - credits_applied_total - estimated_credits_applied + assessment_added_total, 2)
        default: 0
      - name: original_due_date
        type: datetime
        source: computed
        description: midnight UTC of (tax_year + 1, registration.due_month, registration.due_day)
      - name: extended_due_date
        type: datetime
        source: computed
        description: original_due_date + registration.extension_months months; set only by a GRANTED ExtensionRequest
        default: null
      - name: preparer_user_id
        type: string
        source: system
        description: X-User-ID of the actor who called submit-review most recently
        default: null
      - name: approver_user_id
        type: string
        source: system
        description: X-User-ID of the actor who called approve most recently; cleared on demotion and on reject
        default: null
      - name: confirmation_number
        type: string
        source: input
        description: state e-file confirmation captured at file time
        default: null
      - name: filed_on_date
        type: datetime
        source: system
        description: logical-clock instant at which preparation_status became FILED
        default: null
      - name: amendment_count
        type: integer
        source: computed
        description: number of times this filing has gone FILED -> AMENDED
        default: 0

  - name: ApportionmentFactor
    parent: StateFiling
    common_fields: true
    fields:
      - name: filing_id
        type: string
        source: input
        description: FK -> StateFiling.id; return this factor belongs to
      - name: factor_type
        type: enum
        source: computed
        description: which UDITPA factor this row holds
        constraints: "SALES | PROPERTY | PAYROLL"
      - name: numerator
        type: number
        source: computed
        description: in-state amount for this factor after sourcing and throwback
        default: 0
      - name: denominator
        type: number
        source: computed
        description: everywhere amount for this factor after throwout adjustment
        default: 0
      - name: ratio
        type: number
        source: computed
        description: round(numerator / denominator, 6); 0 when the factor is excluded
        default: 0
      - name: weight
        type: number
        source: computed
        description: renormalized weight actually used in the apportionment sum, round(base_weight / sum of included base weights, 6); 0 when excluded
        default: 0
      - name: included
        type: boolean
        source: computed
        description: false when denominator == 0, in which case the factor is dropped and weights renormalize
        default: true
      - name: throwback_added
        type: number
        source: computed
        description: origin_sales added to the SALES numerator under THROWBACK; 0 for other factor types
        default: 0
      - name: throwout_removed
        type: number
        source: computed
        description: origin_sales removed from the SALES denominator under THROWOUT; 0 for other factor types
        default: 0

  - name: Modification
    parent: StateFiling
    common_fields: true
    fields:
      - name: filing_id
        type: string
        source: input
        description: FK -> StateFiling.id; return this modification adjusts
      - name: modification_code
        type: string
        source: input
        description: state modification identifier, e.g. STATE_TAX_ADDBACK
      - name: direction
        type: enum
        source: input
        description: whether the line increases or decreases apportionable income
        constraints: "ADDITION | SUBTRACTION"
      - name: raw_amount
        type: number
        source: input
        description: unallocated federal-basis amount of the modification
        constraints: ">= 0"
      - name: allocation_ratio
        type: number
        source: input
        description: portion of raw_amount attributable to this return
        constraints: "0 <= allocation_ratio <= 1"
      - name: line_amount
        type: number
        source: computed
        description: round(raw_amount * allocation_ratio, 2), rounded at the line before any summation
        default: 0
      - name: sequence_number
        type: integer
        source: computed
        description: 1-based position of this line among the filing's modifications ordered by created_at ASC
        default: 1

  - name: CreditClaim
    parent: StateFiling
    common_fields: true
    fields:
      - name: filing_id
        type: string
        source: input
        description: FK -> StateFiling.id; return claiming the credit
      - name: credit_code
        type: string
        source: input
        description: state credit identifier, e.g. RD_CREDIT
      - name: granted_amount
        type: number
        source: input
        description: total credit granted by the state for this claim
        constraints: "> 0"
      - name: refundable
        type: boolean
        source: input
        description: refundable credits apply in full even beyond the remaining liability
        default: false
      - name: priority_order
        type: integer
        source: input
        description: waterfall position; lower applies first, ties broken by created_at ASC
        constraints: ">= 1"
      - name: expires_after_years
        type: integer
        source: input
        description: carryforward life in years measured from the filing's tax_year
        default: 5
      - name: applied_amount
        type: number
        source: computed
        description: portion of granted_amount consumed by this filing's liability
        default: 0
      - name: carryforward_amount
        type: number
        source: computed
        description: unconsumed, still-living portion of granted_amount
        default: 0
      - name: expired_amount
        type: number
        source: computed
        description: unconsumed portion whose carryforward life has lapsed
        default: 0
      - name: status
        type: enum
        source: computed
        description: waterfall outcome for this claim
        default: PENDING
        constraints: "PENDING | PARTIALLY_APPLIED | FULLY_APPLIED | CARRIED_FORWARD | EXPIRED"

  - name: EstimatedPayment
    parent: StateRegistration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> StateRegistration.id; state the remittance was sent to
      - name: applied_filing_id
        type: string
        source: input
        description: FK -> StateFiling.id; return the payment is currently applied against; null while unapplied
        default: null
      - name: tax_year
        type: integer
        source: input
        description: tax year the installment belongs to
      - name: installment_number
        type: integer
        source: input
        description: 1-based installment index; unique per (registration_id, tax_year)
        constraints: 1..4
      - name: amount
        type: number
        source: input
        description: remitted amount
        constraints: "> 0"
      - name: paid_on_date
        type: datetime
        source: input
        description: instant the remittance was made
      - name: due_date
        type: datetime
        source: computed
        description: midnight UTC of (tax_year, INSTALLMENT_DUE_MONTHS[installment_number-1], INSTALLMENT_DUE_DAY)
      - name: is_timely
        type: boolean
        source: computed
        description: paid_on_date <= due_date
        default: true
      - name: safe_harbor_required_amount
        type: number
        source: computed
        description: cumulative safe-harbor requirement through this installment per calculations.estimated_installment_requirement
        default: 0
      - name: underpayment_amount
        type: number
        source: computed
        description: max(0, safe_harbor_required_amount - cumulative amount remitted through this installment)
        default: 0
      - name: underpayment_penalty
        type: number
        source: computed
        description: round(underpayment_amount * UNDERPAYMENT_PENALTY_RATE, 2)
        default: 0
      - name: status
        type: enum
        source: computed
        description: application lifecycle of the remittance
        default: RECEIVED
        constraints: "RECEIVED | APPLIED | UNAPPLIED | REFUNDED"

  - name: ExtensionRequest
    parent: StateFiling
    common_fields: true
    fields:
      - name: filing_id
        type: string
        source: input
        description: FK -> StateFiling.id; return the extension covers
      - name: estimated_tax_paid
        type: number
        source: input
        description: amount the taxpayer represents as already remitted toward this return
        constraints: ">= 0"
      - name: requested_on_date
        type: datetime
        source: system
        description: logical-clock instant at which the extension was requested
      - name: required_prepayment
        type: number
        source: computed
        description: round(StateFiling.tax_before_credits * EXTENSION_PREPAY_PCT, 2) at request time
        default: 0
      - name: status
        type: enum
        source: computed
        description: extension lifecycle
        default: REQUESTED
        constraints: "REQUESTED | GRANTED | DENIED"
      - name: new_due_date
        type: datetime
        source: computed
        description: original_due_date + registration.extension_months months; set only when status becomes GRANTED
        default: null
      - name: state_confirmation
        type: string
        source: input
        description: state acknowledgement reference recorded at acknowledge time
        default: null

  - name: Notice
    parent: StateFiling
    common_fields: true
    fields:
      - name: filing_id
        type: string
        source: input
        description: FK -> StateFiling.id; return the notice was issued against
      - name: notice_type
        type: enum
        source: input
        description: kind of state correspondence
        constraints: "MATH_ERROR | NEXUS_INQUIRY | PROPOSED_ASSESSMENT | FINAL_ASSESSMENT"
      - name: state_notice_number
        type: string
        source: input
        description: state-issued notice reference
      - name: assessed_tax
        type: number
        source: input
        description: additional tax the state proposes to assess
        constraints: ">= 0"
      - name: notice_date
        type: datetime
        source: input
        description: date printed on the notice; anchors both deadline windows and interest accrual
      - name: response_due_days
        type: integer
        source: input
        description: days from notice_date within which a response must be filed
        default: 45
      - name: response_due_date
        type: datetime
        source: computed
        description: notice_date + response_due_days days
      - name: appeal_due_date
        type: datetime
        source: computed
        description: notice_date + APPEAL_WINDOW_DAYS days
      - name: status
        type: enum
        source: computed
        description: notice/appeal lifecycle
        default: OPEN
        constraints: "OPEN | RESPONDED | INFO_REQUESTED | APPEAL_FILED | APPEAL_SUSTAINED | APPEAL_DENIED | CLOSED"
      - name: response_round
        type: integer
        source: computed
        description: number of times respond has been called on this notice
        default: 0
      - name: contested_amount
        type: number
        source: computed
        description: amount of assessed_tax the taxpayer disputes, from the most recent respond
        default: 0
      - name: sustained_amount
        type: number
        source: system
        description: amount abated in the taxpayer's favor by the appeal decision
        default: 0
      - name: penalty_amount
        type: number
        source: computed
        description: round(min(final_tax * NOTICE_PENALTY_RATE, NOTICE_PENALTY_CAP), 2)
        default: 0
      - name: interest_amount
        type: number
        source: computed
        description: round((final_tax + penalty_amount) * NOTICE_INTEREST_RATE * days_outstanding / DAYS_PER_YEAR, 2)
        default: 0
      - name: assessment_final_amount
        type: number
        source: computed
        description: round(final_tax + penalty_amount + interest_amount, 2)
        default: 0

  - name: VDAAgreement
    parent: StateRegistration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> StateRegistration.id; state the disclosure is made to
      - name: legal_entity_id
        type: string
        source: input
        description: FK -> LegalEntity.id; the member disclosing past exposure
      - name: anchor_tax_year
        type: integer
        source: input
        description: last tax year covered by the lookback window
      - name: lookback_years
        type: integer
        source: input
        description: number of tax years the disclosure covers, counting anchor_tax_year
        constraints: ">= 1"
      - name: exposure_variant
        type: enum
        source: input
        description: which exposure algorithm applies
        constraints: "LOOKBACK_LIMITED | FULL_EXPOSURE"
      - name: estimated_exposure_tax
        type: number
        source: input
        description: taxpayer's estimate of full unlimited-lookback tax exposure
        constraints: ">= 0"
      - name: effective_lookback_years
        type: integer
        source: computed
        description: lookback_years for LOOKBACK_LIMITED; FULL_EXPOSURE_YEARS for FULL_EXPOSURE
        default: 0
      - name: lookback_start_year
        type: integer
        source: computed
        description: anchor_tax_year - effective_lookback_years + 1
        default: 0
      - name: lookback_end_year
        type: integer
        source: computed
        description: equal to anchor_tax_year
        default: 0
      - name: computed_exposure_tax
        type: number
        source: computed
        description: exposure per calculations.vda_exposure
        default: 0
      - name: waived_penalty_amount
        type: number
        source: computed
        description: penalty relief granted under the agreement
        default: 0
      - name: negotiated_tax
        type: number
        source: input
        description: tax figure agreed with the state at execution; defaults to computed_exposure_tax
        default: null
      - name: negotiated_interest
        type: number
        source: input
        description: interest figure agreed with the state at execution
        default: 0
      - name: settlement_total
        type: number
        source: computed
        description: round(negotiated_tax + negotiated_interest, 2), set at execution
        default: 0
      - name: status
        type: enum
        source: computed
        description: disclosure lifecycle
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | EXECUTED | WITHDRAWN"
      - name: executed_on_date
        type: datetime
        source: system
        description: logical-clock instant at which status became EXECUTED
        default: null
      - name: shield_expires_at
        type: datetime
        source: computed
        description: executed_on_date + VDA_SHIELD_MONTHS months
        default: null

# =========================================================================
# 1.2 State Machine Table
# =========================================================================
state_machines:

  # ---- StateRegistration: two independent axes on one row -----------------
  - entity: StateRegistration
    dimension: nexus_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: ECONOMIC
        trigger: "POST /salt/registrations/{id}/evaluate-nexus"
        actor: TaxManager
        preconditions:
          - "registration.registration_status != WITHDRAWN"
          - "calculations.nexus_determination resolves to ECONOMIC for as_of_tax_year"
        side_effects:
          - "registration.nexus_status = ECONOMIC"
          - "LINK 1 -> if registration.registration_status == NOT_REQUIRED it becomes REGISTRATION_REQUIRED"
          - "LINK 2 (caused by LINK 1) -> TaxpayerGroup.open_registration_obligations increments by 1"
          - "LINK 3 (caused by LINK 2) -> TaxpayerGroup.compliance_posture recomputed; COMPLIANT becomes EXPOSED once the counter reaches 1"
          - "LINK 4 (caused by LINK 3) -> when compliance_posture changes COMPLIANT -> EXPOSED, every StateFiling of that group with preparation_status == APPROVED is demoted to IN_REVIEW and its approver_user_id is cleared"
          - "increments StateRegistration.version by 1"
        note: "The nexus ladder is ordered: PHYSICAL is tested before ECONOMIC, ECONOMIC before PROTECTED_PL86272."
      - from: NONE
        to: PHYSICAL
        trigger: "POST /salt/registrations/{id}/evaluate-nexus"
        actor: TaxManager
        preconditions:
          - "registration.registration_status != WITHDRAWN"
          - "calculations.nexus_determination resolves to PHYSICAL for as_of_tax_year"
        side_effects:
          - "registration.nexus_status = PHYSICAL"
          - "same LINK 1..LINK 4 chain as NONE -> ECONOMIC"
          - "increments StateRegistration.version by 1"
      - from: NONE
        to: PROTECTED_PL86272
        trigger: "POST /salt/registrations/{id}/evaluate-nexus"
        actor: TaxManager
        preconditions:
          - "registration.registration_status != WITHDRAWN"
          - "calculations.nexus_determination resolves to PROTECTED_PL86272 for as_of_tax_year"
        side_effects:
          - "registration.nexus_status = PROTECTED_PL86272"
          - "registration_status is left unchanged (protected solicitation creates no filing obligation)"
          - "increments StateRegistration.version by 1"
      - from: ECONOMIC
        to: NONE
        trigger: "POST /salt/registrations/{id}/evaluate-nexus"
        actor: TaxManager
        preconditions:
          - "calculations.nexus_determination resolves to NONE for as_of_tax_year"
        side_effects:
          - "registration.nexus_status = NONE"
          - "registration_status is NOT rolled back; an obligation once opened is closed only by complete-registration or withdraw"
          - "increments StateRegistration.version by 1"
        note: "Nexus is cyclic: a later year with lower activity moves the axis back to NONE."
      - from: PROTECTED_PL86272
        to: ECONOMIC
        trigger: "POST /salt/registrations/{id}/evaluate-nexus"
        actor: TaxManager
        preconditions:
          - "calculations.nexus_determination resolves to ECONOMIC for as_of_tax_year"
        side_effects:
          - "registration.nexus_status = ECONOMIC"
          - "LINK 1..LINK 4 chain as NONE -> ECONOMIC"
          - "increments StateRegistration.version by 1"
      - from: ECONOMIC
        to: VOLUNTARY
        trigger: "POST /salt/vda-agreements/{id}/execute"
        actor: TaxManager
        preconditions:
          - "the VDAAgreement's registration_id equals this registration"
        side_effects:
          - "registration.nexus_status = VOLUNTARY"
          - "increments StateRegistration.version by 1"
      - from: NONE
        to: VOLUNTARY
        trigger: "POST /salt/vda-agreements/{id}/execute"
        actor: TaxManager
        preconditions:
          - "the VDAAgreement's registration_id equals this registration"
        side_effects:
          - "registration.nexus_status = VOLUNTARY"
          - "increments StateRegistration.version by 1"

  - entity: StateRegistration
    dimension: registration_status
    initial_state: NOT_REQUIRED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: NOT_REQUIRED
        to: REGISTRATION_REQUIRED
        trigger: "system, as LINK 1 of POST /salt/registrations/{id}/evaluate-nexus resolving to ECONOMIC or PHYSICAL"
        actor: system
        preconditions:
          - "nexus_status resolves to ECONOMIC or PHYSICAL"
        side_effects:
          - "TaxpayerGroup.open_registration_obligations increments by 1"
          - "TaxpayerGroup.compliance_posture recomputed"
      - from: REGISTRATION_REQUIRED
        to: REGISTERED
        trigger: "POST /salt/registrations/{id}/complete-registration"
        actor: TaxManager
        preconditions:
          - "registration.registration_status == REGISTRATION_REQUIRED"
        side_effects:
          - "registration.state_account_number = state_account_number; registration.registered_on_date = current logical clock"
          - "LINK 1 -> TaxpayerGroup.open_registration_obligations decrements by 1"
          - "LINK 2 (caused by LINK 1) -> TaxpayerGroup.compliance_posture recomputed; EXPOSED returns to COMPLIANT once the counter reaches 0"
          - "increments StateRegistration.version by 1"
      - from: REGISTRATION_REQUIRED
        to: REGISTERED
        trigger: "POST /salt/vda-agreements/{id}/execute"
        actor: TaxManager
        preconditions:
          - "the VDAAgreement's registration_id equals this registration"
        side_effects:
          - "registration.state_account_number = 'VDA-' + VDAAgreement.id; registration.registered_on_date = current logical clock"
          - "LINK 1 -> TaxpayerGroup.open_registration_obligations decrements by 1"
          - "LINK 2 (caused by LINK 1) -> TaxpayerGroup.compliance_posture recomputed"
          - "increments StateRegistration.version by 1"
      - from: REGISTRATION_REQUIRED
        to: WITHDRAWN
        trigger: "POST /salt/registrations/{id}/withdraw"
        actor: TaxManager
        preconditions:
          - "registration.registration_status IN {NOT_REQUIRED, REGISTRATION_REQUIRED, REGISTERED}"
          - "no StateFiling on this registration has preparation_status IN {DRAFT, FACTORS_LOCKED, IN_REVIEW, APPROVED}"
        side_effects:
          - "LINK 1 -> TaxpayerGroup.open_registration_obligations decrements by 1"
          - "LINK 2 (caused by LINK 1) -> TaxpayerGroup.compliance_posture recomputed"
          - "increments StateRegistration.version by 1"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /salt/registrations/{id}/withdraw"
        actor: TaxManager
        preconditions:
          - "no StateFiling on this registration has preparation_status IN {DRAFT, FACTORS_LOCKED, IN_REVIEW, APPROVED}"
        side_effects:
          - "obligation counter is unchanged (a REGISTERED row was not counted)"
          - "increments StateRegistration.version by 1"
      - from: NOT_REQUIRED
        to: WITHDRAWN
        trigger: "POST /salt/registrations/{id}/withdraw"
        actor: TaxManager
        preconditions:
          - "no StateFiling on this registration has preparation_status IN {DRAFT, FACTORS_LOCKED, IN_REVIEW, APPROVED}"
        side_effects:
          - "obligation counter is unchanged"
          - "increments StateRegistration.version by 1"

  # ---- FilingElection: cyclic (ELECTED -> REVOKED -> ELECTED) -------------
  - entity: FilingElection
    dimension: status
    initial_state: ELECTED
    terminal_states: [EXPIRED]
    transitions:
      - from: ELECTED
        to: REVOKED
        trigger: "POST /salt/elections/{id}/revoke"
        actor: TaxManager
        preconditions:
          - "election.status == ELECTED"
          - "revocation_tax_year > election.effective_tax_year"
          - "revocation_tax_year > election.expires_after_tax_year OR registration.state_permits_early_revocation == true"
        side_effects:
          - "election.revocation_tax_year = revocation_tax_year; election.reason = reason"
          - "the election's occupied year interval contracts to [effective_tax_year, revocation_tax_year - 1] for validations.election_period_overlap"
          - "increments FilingElection.version by 1"
      - from: REVOKED
        to: ELECTED
        trigger: "POST /salt/elections/{id}/reinstate"
        actor: TaxManager
        preconditions:
          - "election.status == REVOKED"
          - "the proposed [effective_tax_year, effective_tax_year + binding_years - 1] interval does not intersect any other election interval on the same registration"
        side_effects:
          - "election.effective_tax_year and binding_years replaced; expires_after_tax_year recomputed; revocation_tax_year cleared to null"
          - "election.reinstatement_count increments by 1"
          - "increments FilingElection.version by 1"
        note: "This is the cycle: an election may be revoked and re-elected any number of times."
      - from: ELECTED
        to: EXPIRED
        trigger: "POST /salt/registrations/{id}/roll-filing-calendar"
        actor: TaxManager
        preconditions:
          - "election.status == ELECTED"
          - "election.expires_after_tax_year < through_tax_year"
        side_effects:
          - "registration.calendar_rolled_through_year = through_tax_year"
          - "increments FilingElection.version by 1"

  # ---- StateFiling axis 1: preparation_status (cyclic via reject/demote) --
  - entity: StateFiling
    dimension: preparation_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FACTORS_LOCKED
        trigger: "POST /salt/filings/{id}/lock-factors"
        actor: StateAnalyst
        preconditions:
          - "filing.preparation_status IN {DRAFT, AMENDED}"
          - "at least one ApportionmentFactor row exists for this filing (compute-factors has run)"
          - "registration.nexus_status NOT IN {NONE, PROTECTED_PL86272}"
          - "registration.registration_status == REGISTERED"
        side_effects:
          - "filing snapshot is frozen: modifications and credit claims can no longer be created"
          - "increments StateFiling.version by 1"
      - from: AMENDED
        to: FACTORS_LOCKED
        trigger: "POST /salt/filings/{id}/lock-factors"
        actor: StateAnalyst
        preconditions:
          - "same preconditions as DRAFT -> FACTORS_LOCKED"
        side_effects:
          - "increments StateFiling.version by 1"
      - from: FACTORS_LOCKED
        to: IN_REVIEW
        trigger: "POST /salt/filings/{id}/submit-review"
        actor: StateAnalyst
        preconditions:
          - "filing.preparation_status == FACTORS_LOCKED"
        side_effects:
          - "filing.preparer_user_id = X-User-ID of the caller"
          - "increments StateFiling.version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /salt/filings/{id}/approve"
        actor: Controller
        preconditions:
          - "filing.preparation_status == IN_REVIEW"
          - "X-User-ID != filing.preparer_user_id (segregation of duties)"
        side_effects:
          - "filing.approver_user_id = X-User-ID of the caller"
          - "increments StateFiling.version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /salt/filings/{id}/reject"
        actor: Controller
        preconditions:
          - "filing.preparation_status == IN_REVIEW"
        side_effects:
          - "filing.approver_user_id cleared to null"
          - "modifications and credit claims become creatable again"
          - "increments StateFiling.version by 1"
        note: "Revision loop: DRAFT -> FACTORS_LOCKED -> IN_REVIEW -> DRAFT may repeat without limit."
      - from: APPROVED
        to: IN_REVIEW
        trigger: "system, as LINK 4 of an evaluate-nexus run that flips the group's compliance_posture COMPLIANT -> EXPOSED"
        actor: system
        preconditions:
          - "filing.preparation_status == APPROVED at the moment the posture flips"
        side_effects:
          - "filing.approver_user_id cleared to null; re-approval is required"
          - "increments StateFiling.version by 1"
      - from: APPROVED
        to: FILED
        trigger: "POST /salt/filings/{id}/file"
        actor: Controller
        preconditions:
          - "filing.preparation_status == APPROVED"
          - "when filing.election_id is not null: the referenced FilingElection.status == ELECTED and filing.filing_basis == election.election_basis"
          - "current logical clock <= (filing.extended_due_date if not null else filing.original_due_date)"
        side_effects:
          - "filing.confirmation_number set; filing.filed_on_date = current logical clock"
          - "increments StateFiling.version by 1"
      - from: FILED
        to: AMENDED
        trigger: "POST /salt/filings/{id}/amend"
        actor: Controller
        preconditions:
          - "filing.preparation_status == FILED"
        side_effects:
          - "filing.amendment_count increments by 1; filing.federal_taxable_income replaced when supplied"
          - "COMPENSATION -> every CreditClaim on this filing is reset to applied_amount = 0, carryforward_amount = granted_amount, expired_amount = 0, status = PENDING; filing.credits_applied_total returns to 0"
          - "filing.balance_due and payment_status recomputed"
          - "increments StateFiling.version by 1"
        note: "Amend is the compensating action for the credit waterfall; the conserved quantity granted_amount = applied + carryforward + expired is unchanged by the round trip."

  # ---- StateFiling axis 2: payment_status (independent of axis 1) --------
  - entity: StateFiling
    dimension: payment_status
    initial_state: UNPAID
    terminal_states: [REFUND_CLAIMED]
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "system, on POST /salt/payments/{id}/apply or any recompute where balance_due > 0 and estimated_credits_applied > 0"
        actor: system
        preconditions:
          - "balance_due > 0 AND estimated_credits_applied > 0"
        side_effects:
          - "payment_status = PARTIALLY_PAID"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system, on any recompute where balance_due == 0"
        actor: system
        preconditions:
          - "balance_due == 0 exactly"
        side_effects:
          - "payment_status = PAID"
      - from: UNPAID
        to: PAID
        trigger: "system, on any recompute where balance_due == 0"
        actor: system
        preconditions:
          - "balance_due == 0 exactly"
        side_effects:
          - "payment_status = PAID"
      - from: PARTIALLY_PAID
        to: OVERPAID
        trigger: "system, on any recompute where balance_due < 0"
        actor: system
        preconditions:
          - "balance_due < 0"
        side_effects:
          - "payment_status = OVERPAID"
      - from: PAID
        to: OVERPAID
        trigger: "system, on any recompute where balance_due < 0"
        actor: system
        preconditions:
          - "balance_due < 0"
        side_effects:
          - "payment_status = OVERPAID"
      - from: PARTIALLY_PAID
        to: UNPAID
        trigger: "system, on POST /salt/payments/{id}/unapply"
        actor: system
        preconditions:
          - "after unapply, estimated_credits_applied == 0 and balance_due > 0"
        side_effects:
          - "payment_status = UNPAID"
      - from: OVERPAID
        to: REFUND_CLAIMED
        trigger: "POST /salt/filings/{id}/claim-refund"
        actor: Controller
        preconditions:
          - "filing.payment_status == OVERPAID"
          - "filing.preparation_status IN {FILED, AMENDED}"
        side_effects:
          - "every EstimatedPayment whose applied_filing_id == this filing moves to status REFUNDED"
          - "increments StateFiling.version by 1"

  # ---- CreditClaim: waterfall outcome, system driven ---------------------
  - entity: CreditClaim
    dimension: status
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: FULLY_APPLIED
        trigger: "system, on any run of calculations.credit_application_waterfall"
        actor: system
        preconditions:
          - "applied_amount == granted_amount"
        side_effects:
          - "filing.credits_applied_total recomputed"
      - from: PENDING
        to: PARTIALLY_APPLIED
        trigger: "system, on any run of calculations.credit_application_waterfall"
        actor: system
        preconditions:
          - "0 < applied_amount < granted_amount"
        side_effects:
          - "carryforward_amount = granted_amount - applied_amount"
      - from: PENDING
        to: CARRIED_FORWARD
        trigger: "system, on any run of calculations.credit_application_waterfall"
        actor: system
        preconditions:
          - "applied_amount == 0 AND the carryforward life has not lapsed"
        side_effects:
          - "carryforward_amount = granted_amount"
      - from: CARRIED_FORWARD
        to: EXPIRED
        trigger: "system, on any run of calculations.credit_application_waterfall"
        actor: system
        preconditions:
          - "filing.tax_year + expires_after_years < calendar year of the current logical clock"
        side_effects:
          - "expired_amount = carryforward_amount; carryforward_amount = 0"
      - from: PARTIALLY_APPLIED
        to: PENDING
        trigger: "POST /salt/filings/{id}/amend"
        actor: Controller
        preconditions:
          - "the owning filing transitions FILED -> AMENDED"
        side_effects:
          - "applied_amount = 0; carryforward_amount = granted_amount; expired_amount = 0"
      - from: FULLY_APPLIED
        to: PENDING
        trigger: "POST /salt/filings/{id}/amend"
        actor: Controller
        preconditions:
          - "the owning filing transitions FILED -> AMENDED"
        side_effects:
          - "applied_amount = 0; carryforward_amount = granted_amount; expired_amount = 0"

  # ---- EstimatedPayment: cyclic apply/unapply ----------------------------
  - entity: EstimatedPayment
    dimension: status
    initial_state: RECEIVED
    terminal_states: [REFUNDED]
    transitions:
      - from: RECEIVED
        to: APPLIED
        trigger: "POST /salt/payments/{id}/apply"
        actor: Controller
        preconditions:
          - "payment.status IN {RECEIVED, UNAPPLIED}"
          - "the target StateFiling.registration_id == payment.registration_id"
          - "target filing.preparation_status != DRAFT"
        side_effects:
          - "payment.applied_filing_id = filing_id"
          - "registration.unapplied_payment_balance decreases by payment.amount"
          - "filing.estimated_credits_applied increases by payment.amount; filing.balance_due and payment_status recomputed"
          - "increments EstimatedPayment.version by 1"
      - from: APPLIED
        to: UNAPPLIED
        trigger: "POST /salt/payments/{id}/unapply"
        actor: Controller
        preconditions:
          - "payment.status == APPLIED"
          - "the applied filing's payment_status != REFUND_CLAIMED"
        side_effects:
          - "payment.applied_filing_id cleared to null"
          - "registration.unapplied_payment_balance increases by payment.amount"
          - "filing.estimated_credits_applied decreases by payment.amount; filing.balance_due and payment_status recomputed"
          - "increments EstimatedPayment.version by 1"
        note: "Compensating action for apply; StateRegistration.total_payments_received is invariant across the round trip."
      - from: UNAPPLIED
        to: APPLIED
        trigger: "POST /salt/payments/{id}/apply"
        actor: Controller
        preconditions:
          - "same preconditions as RECEIVED -> APPLIED"
        side_effects:
          - "same side effects as RECEIVED -> APPLIED"
      - from: APPLIED
        to: REFUNDED
        trigger: "POST /salt/filings/{id}/claim-refund"
        actor: Controller
        preconditions:
          - "payment.applied_filing_id == the filing being refunded"
        side_effects:
          - "payment leaves the applicable pool; registration.total_payments_received is unchanged"

  # ---- ExtensionRequest: branching fork with divergent side effects -------
  - entity: ExtensionRequest
    dimension: status
    initial_state: REQUESTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /salt/extensions/{id}/acknowledge with decision = GRANTED"
        actor: TaxManager
        preconditions:
          - "extension.status == REQUESTED"
        side_effects:
          - "extension.new_due_date = filing.original_due_date + registration.extension_months months"
          - "filing.extended_due_date = extension.new_due_date"
          - "increments ExtensionRequest.version by 1 and StateFiling.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /salt/extensions/{id}/acknowledge with decision = DENIED"
        actor: TaxManager
        preconditions:
          - "extension.status == REQUESTED"
        side_effects:
          - "extension.new_due_date stays null; filing.extended_due_date is NOT set"
          - "increments ExtensionRequest.version by 1"
        note: "The two branches diverge: only GRANTED writes filing.extended_due_date."

  # ---- Notice: cyclic response rounds plus an appeal fork ----------------
  - entity: Notice
    dimension: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /salt/notices/{id}/respond"
        actor: Controller
        preconditions:
          - "notice.status IN {OPEN, INFO_REQUESTED}"
          - "current logical clock <= notice.response_due_date"
        side_effects:
          - "notice.response_round increments by 1; notice.contested_amount = contested_amount"
          - "increments Notice.version by 1"
      - from: RESPONDED
        to: INFO_REQUESTED
        trigger: "POST /salt/notices/{id}/request-info"
        actor: TaxManager
        preconditions:
          - "notice.status == RESPONDED"
        side_effects:
          - "notice.response_due_date extended by DEFAULT_RESPONSE_DUE_DAYS days from the current logical clock"
          - "increments Notice.version by 1"
      - from: INFO_REQUESTED
        to: RESPONDED
        trigger: "POST /salt/notices/{id}/respond"
        actor: Controller
        preconditions:
          - "current logical clock <= notice.response_due_date"
        side_effects:
          - "notice.response_round increments by 1"
          - "increments Notice.version by 1"
        note: "Cycle: RESPONDED -> INFO_REQUESTED -> RESPONDED may repeat; response_round counts the rounds."
      - from: RESPONDED
        to: APPEAL_FILED
        trigger: "POST /salt/notices/{id}/appeal"
        actor: Controller
        preconditions:
          - "notice.status IN {OPEN, RESPONDED, INFO_REQUESTED}"
          - "current logical clock <= notice.appeal_due_date"
          - "the linked StateFiling.preparation_status IN {FILED, AMENDED}"
        side_effects:
          - "increments Notice.version by 1"
      - from: OPEN
        to: APPEAL_FILED
        trigger: "POST /salt/notices/{id}/appeal"
        actor: Controller
        preconditions:
          - "same preconditions as RESPONDED -> APPEAL_FILED"
        side_effects:
          - "increments Notice.version by 1"
      - from: APPEAL_FILED
        to: APPEAL_DENIED
        trigger: "POST /salt/notices/{id}/appeal-decision with outcome = DENIED"
        actor: TaxManager
        preconditions:
          - "notice.status == APPEAL_FILED"
        side_effects:
          - "notice.sustained_amount = sustained_amount (0 by default); penalty_amount, interest_amount and assessment_final_amount computed per calculations.notice_assessment_total"
          - "LINK 1 -> filing.assessment_added_total increases by notice.assessment_final_amount"
          - "LINK 2 (caused by LINK 1) -> filing.balance_due recomputed and filing.payment_status re-derived"
          - "LINK 3 (caused by LINK 2) -> TaxpayerGroup.compliance_posture recomputed; a FILED/AMENDED filing with balance_due > 0 and assessment_added_total > 0 forces DELINQUENT"
          - "increments Notice.version by 1 and StateFiling.version by 1"
      - from: APPEAL_FILED
        to: APPEAL_SUSTAINED
        trigger: "POST /salt/notices/{id}/appeal-decision with outcome = SUSTAINED"
        actor: TaxManager
        preconditions:
          - "notice.status == APPEAL_FILED"
          - "sustained_amount <= notice.assessed_tax"
        side_effects:
          - "same LINK 1..LINK 3 chain as APPEAL_DENIED, but final_tax = assessed_tax - sustained_amount"
          - "increments Notice.version by 1 and StateFiling.version by 1"
        note: "Branch divergence: DENIED abates nothing, SUSTAINED abates sustained_amount before penalty and interest are computed."
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /salt/notices/{id}/close"
        actor: TaxManager
        preconditions:
          - "notice.status IN {RESPONDED, APPEAL_SUSTAINED, APPEAL_DENIED}"
        side_effects:
          - "increments Notice.version by 1"
      - from: APPEAL_DENIED
        to: CLOSED
        trigger: "POST /salt/notices/{id}/close"
        actor: TaxManager
        preconditions:
          - "notice.status IN {RESPONDED, APPEAL_SUSTAINED, APPEAL_DENIED}"
        side_effects:
          - "increments Notice.version by 1"
      - from: APPEAL_SUSTAINED
        to: CLOSED
        trigger: "POST /salt/notices/{id}/close"
        actor: TaxManager
        preconditions:
          - "notice.status IN {RESPONDED, APPEAL_SUSTAINED, APPEAL_DENIED}"
        side_effects:
          - "increments Notice.version by 1"

  # ---- VDAAgreement ------------------------------------------------------
  - entity: VDAAgreement
    dimension: status
    initial_state: DRAFT
    terminal_states: [EXECUTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /salt/vda-agreements/{id}/submit"
        actor: TaxManager
        preconditions:
          - "vda.status == DRAFT"
        side_effects:
          - "increments VDAAgreement.version by 1"
      - from: SUBMITTED
        to: EXECUTED
        trigger: "POST /salt/vda-agreements/{id}/execute"
        actor: TaxManager
        preconditions:
          - "vda.status == SUBMITTED"
          - "no StateFiling on vda.registration_id has preparation_status IN {FILED, AMENDED} with tax_year between vda.lookback_start_year and vda.lookback_end_year inclusive"
        side_effects:
          - "vda.executed_on_date = current logical clock; vda.shield_expires_at = executed_on_date + VDA_SHIELD_MONTHS months; vda.settlement_total computed"
          - "LegalEntity.vda_shield_until = vda.shield_expires_at"
          - "LINK 1 -> registration.nexus_status = VOLUNTARY and, when registration_status == REGISTRATION_REQUIRED, registration_status = REGISTERED"
          - "LINK 2 (caused by LINK 1) -> TaxpayerGroup.open_registration_obligations decrements by 1"
          - "LINK 3 (caused by LINK 2) -> TaxpayerGroup.compliance_posture recomputed"
          - "increments VDAAgreement.version by 1 and StateRegistration.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /salt/vda-agreements/{id}/withdraw"
        actor: TaxManager
        preconditions:
          - "vda.status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "the agreement's lookback window stops blocking new VDAAgreement windows for the same legal entity"
          - "increments VDAAgreement.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /salt/vda-agreements/{id}/withdraw"
        actor: TaxManager
        preconditions:
          - "vda.status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "increments VDAAgreement.version by 1"

# =========================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =========================================================================
concurrency_rules:
  - rule_id: credit-claim-create-stale-filing
    parent_entity: StateFiling
    write_endpoint: "POST /salt/filings/{id}/credit-claims"
    occ_field: "expected_filing_version"
    description: |
      Adding a CreditClaim to a StateFiling whose version has advanced since
      the client last observed it is rejected. A second claim on the same
      filing is legitimate product behaviour - it re-runs the whole waterfall
      and can push an earlier claim from FULLY_APPLIED to PARTIALLY_APPLIED -
      so the server cannot fall back to a state precondition; the stale
      version is the only evidence that the caller priced this claim against
      an out-of-date liability.
    error_id: ERR_STALE_FILING_VERSION
    http_status: 412

  - rule_id: estimated-payment-create-stale-registration
    parent_entity: StateRegistration
    write_endpoint: "POST /salt/registrations/{id}/payments"
    occ_field: "expected_registration_version"
    description: |
      Recording an EstimatedPayment against a StateRegistration whose version
      has advanced since the client last observed it is rejected. Multiple
      installments on one registration are ordinary product behaviour, and
      every earlier remittance changes the cumulative safe-harbor arithmetic
      this installment is measured against, so a stale registration view means
      the caller computed safe_harbor_required_amount from superseded data.
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412

# =========================================================================
# 1.3 Calculation Rules Table
# =========================================================================
calculations:

  - name: nexus_determination
    trigger: "POST /salt/registrations/{id}/evaluate-nexus"
    algorithm: threshold
    formula: |
      # candidate set: ALL ActivityRecord rows R with
      #   R.registration_id == registration.id AND R.tax_year == as_of_tax_year
      # (every LegalEntity of the group participates; no status filter exists on
      #  ActivityRecord because it is immutable)
      sourced_service(R) =
        R.service_receipts                                   if registration.service_sourcing_rule == MARKET_BASED
        R.service_receipts if R.cost_of_performance_state_code == registration.state_code else 0
                                                             if registration.service_sourcing_rule == COST_OF_PERFORMANCE
      total_state_receipts = sum over R of (R.destination_sales + sourced_service(R))
      max_employee_days    = max over R of R.employee_days_in_state, or 0 when the candidate set is empty
      any_unprotected      = EXISTS R with R.protected_solicitation_only == false
                             AND (R.payroll_compensation > 0 OR R.property_average_value > 0)
      any_protected        = EXISTS R with R.protected_solicitation_only == true

      # LADDER - first match wins, evaluated strictly top to bottom
      1. PHYSICAL            if any_unprotected AND max_employee_days >= registration.economic_nexus_employee_days_threshold
      2. ECONOMIC            if total_state_receipts >= registration.economic_nexus_sales_threshold
      3. PROTECTED_PL86272   if any_protected AND total_state_receipts > 0
      4. NONE                otherwise
    input_set: "ActivityRecord rows for (registration_id, as_of_tax_year); the empty set yields NONE"
    constants:
      DEFAULT_SALES_THRESHOLD: 500000
      DEFAULT_EMPLOYEE_DAYS_THRESHOLD: 15
    precision: "receipts compared at 2 decimal places; the comparison at rung 2 is >= (a value exactly equal to the threshold DOES attach economic nexus)"

  - name: apportionment_factor_computation
    trigger: "POST /salt/filings/{id}/compute-factors; also re-run as LINK 1 of that endpoint's cascade"
    algorithm: weighted_scoring
    formula: |
      # --- member inclusion -------------------------------------------------
      included_members =
        {filing.primary_legal_entity_id}                          if filing.filing_basis == SEPARATE_ENTITY
        {LegalEntity L of the group with L.is_unitary_member == true}
                                                                  if filing.filing_basis IN {COMBINED_UNITARY, CONSOLIDATED}
      records = ActivityRecord rows R with R.registration_id == filing.registration_id
                AND R.tax_year == filing.tax_year
                AND R.legal_entity_id IN included_members

      # --- the JOYCE / FINNIGAN doctrine switch (see variants) --------------
      taxable_in_state(L) = EXISTS R in records with R.legal_entity_id == L
                            AND R.protected_solicitation_only == false
      counts(R) = taxable_in_state(R.legal_entity_id)      when apportionment_variant == JOYCE
      counts(R) = true                                     when apportionment_variant == FINNIGAN

      # --- SALES factor -----------------------------------------------------
      sourced_service(R) = R.service_receipts                                   if MARKET_BASED
                           R.service_receipts if R.cost_of_performance_state_code == registration.state_code else 0
                                                                                if COST_OF_PERFORMANCE
      nowhere(R)  = R.origin_sales if R.purchaser_taxable_in_state == false else 0
      throwback_added   = sum over R where counts(R) of nowhere(R)   if registration.throwback_rule == THROWBACK else 0
      throwout_removed  = sum over R where counts(R) of nowhere(R)   if registration.throwback_rule == THROWOUT  else 0
      SALES.numerator   = sum over R where counts(R) of (R.destination_sales + sourced_service(R)) + throwback_added
      SALES.denominator = group.everywhere_sales - throwout_removed

      # --- PROPERTY factor --------------------------------------------------
      PROPERTY.numerator   = sum over R where counts(R) of
                             (R.property_average_value + RENT_CAPITALIZATION_MULTIPLE * R.rented_property_annual_rent)
      PROPERTY.denominator = group.everywhere_property

      # --- PAYROLL factor ---------------------------------------------------
      PAYROLL.numerator   = sum over R where counts(R) of R.payroll_compensation
      PAYROLL.denominator = group.everywhere_payroll

      # --- ratios, exclusion, renormalization, weighted sum -----------------
      for each factor f in [SALES, PROPERTY, PAYROLL]:
          f.included = (f.denominator > 0)
          f.ratio    = round(f.numerator / f.denominator, 6) if f.included else 0

      base_weight by registration.factor_formula:
          EQUAL_WEIGHTED_THREE  -> SALES 1, PROPERTY 1, PAYROLL 1
          DOUBLE_WEIGHTED_SALES -> SALES 2, PROPERTY 1, PAYROLL 1
          SINGLE_SALES_FACTOR   -> SALES 1, PROPERTY 0, PAYROLL 0

      weight_denominator = sum of base_weight[f] over f where f.included == true
      if weight_denominator == 0: raise ERR_FACTOR_DENOMINATOR_ZERO (no factor survives)
      f.weight = round(base_weight[f] / weight_denominator, 6)
      f.weight = 0 for every excluded factor

      # ROUNDING ORDER IS PINNED: each ratio is rounded to 6 dp FIRST, then
      # multiplied by its weight, then the products are summed, then the sum is
      # rounded to 6 dp. Summing unrounded ratios first gives a different value.
      filing.apportionment_percentage = round( sum over f of (f.ratio * f.weight), 6 )

      # nowhere-sales bookkeeping (group level, rewritten by every run):
      group.nowhere_sales_pool =
          sum over R where counts(R) of nowhere(R)   if registration.throwback_rule == NONE
          0                                          otherwise
    input_set: "ActivityRecord rows for (filing.registration_id, filing.tax_year) restricted to included_members; excluded factors are those whose denominator is exactly 0"
    constants:
      RENT_CAPITALIZATION_MULTIPLE: 8
      FACTOR_RATIO_PRECISION: 6
    precision: "6 decimal places, round_half_up, applied to each factor ratio and once more to the weighted sum"
    variants:
      - name: JOYCE
        when: "compute-factors called with apportionment_variant = JOYCE"
        difference: "A member's amounts enter every numerator only if that member is itself taxable in the state - i.e. it has at least one ActivityRecord with protected_solicitation_only == false. A P.L. 86-272 protected member contributes nothing to SALES, PROPERTY or PAYROLL numerators while still sitting in the everywhere denominators."
      - name: FINNIGAN
        when: "compute-factors called with apportionment_variant = FINNIGAN"
        difference: "Every included member's amounts enter the numerators regardless of that member's own taxability, so a protected member's destination sales, market-sourced services, property and payroll all count. Identical ActivityRecord data therefore yields a strictly larger apportionment_percentage than JOYCE whenever any included member is protected-only."

  - name: state_modification_total
    trigger: "POST /salt/filings/{id}/modifications; also re-run as part of the compute-factors recompute chain"
    algorithm: aggregation
    formula: |
      # order: Modification rows of the filing sorted by created_at ASC; that
      # order also assigns sequence_number = 1, 2, 3, ...
      # ROUNDING ORDER IS PINNED: round at the LINE, then sum.
      for each Modification m of the filing (created_at ASC):
          m.line_amount = round(m.raw_amount * m.allocation_ratio, 2)
          signed(m)     = + m.line_amount   if m.direction == ADDITION
                          - m.line_amount   if m.direction == SUBTRACTION
      filing.modification_total = round( sum over m of signed(m), 2 )

      # The forbidden alternative "sum the exact products first, round once" is
      # NOT what this system does and generally differs by whole cents.
    input_set: "every Modification row whose filing_id == filing.id; there is no status filter because a Modification has no lifecycle"
    constants: {}
    precision: "2 decimal places, round_half_up, applied once per line before summation and once to the signed sum"

  - name: state_tax_before_credits
    trigger: "system, as LINK 2 of the compute-factors cascade and of every modification/credit recompute"
    algorithm: chronological
    formula: |
      apportionable_income      = filing.federal_taxable_income + filing.modification_total
      filing.state_taxable_income = round(apportionable_income * filing.apportionment_percentage, 2)
      filing.tax_before_credits   = round(filing.state_taxable_income * registration.tax_rate, 2)
      # Two-step rounding is pinned: state_taxable_income is rounded to cents
      # BEFORE the rate is applied. Applying the rate to the unrounded product
      # is a different number.
    input_set: "the single StateFiling row plus its StateRegistration.tax_rate"
    constants: {}
    precision: "2 decimal places, round_half_up, at each of the two steps"

  - name: credit_application_waterfall
    trigger: "system, as LINK 3 of the compute-factors cascade; also on POST /salt/filings/{id}/credit-claims; reversed by POST /salt/filings/{id}/amend"
    algorithm: waterfall_allocation
    formula: |
      remaining = filing.tax_before_credits
      order     = CreditClaim rows of the filing sorted by (priority_order ASC, created_at ASC)
      current_year = calendar year of the current logical clock
      for each claim c in order:
          if c.refundable == false:
              c.applied_amount = min(c.granted_amount, remaining)
          else:
              c.applied_amount = c.granted_amount          # refundable pays out past the liability
          remaining = max(0, remaining - c.applied_amount)
          c.carryforward_amount = c.granted_amount - c.applied_amount
          c.expired_amount = 0
          if filing.tax_year + c.expires_after_years < current_year:
              c.expired_amount = c.carryforward_amount
              c.carryforward_amount = 0
          c.status = FULLY_APPLIED      if c.applied_amount == c.granted_amount
                     PARTIALLY_APPLIED  if 0 < c.applied_amount < c.granted_amount
                     EXPIRED            if c.applied_amount == 0 and c.expired_amount > 0
                     CARRIED_FORWARD    if c.applied_amount == 0 and c.carryforward_amount > 0
      filing.credits_applied_total = round(sum over c of c.applied_amount, 2)

      # CONSERVED QUANTITY (invariant, checked after every run and after amend):
      #   for every claim c:  c.granted_amount == round(c.applied_amount + c.carryforward_amount + c.expired_amount, 2)
    input_set: "every CreditClaim row whose filing_id == filing.id, no status filter (the waterfall recomputes every row from granted_amount each run)"
    constants: {}
    precision: "2 decimal places, round_half_up; each claim's applied_amount is already at 2 dp so the outer sum round is a no-op"

  - name: filing_balance_due
    trigger: "system, as LINK 4 of the compute-factors cascade and after apply/unapply/appeal-decision/amend"
    algorithm: aggregation
    formula: |
      filing.estimated_credits_applied =
          round(sum of EstimatedPayment.amount for payments with
                applied_filing_id == filing.id AND status == APPLIED, 2)
      filing.assessment_added_total =
          round(sum of Notice.assessment_final_amount for notices with
                filing_id == filing.id AND status IN {APPEAL_DENIED, APPEAL_SUSTAINED, CLOSED}, 2)
      filing.balance_due = round(
          filing.tax_before_credits
        - filing.credits_applied_total
        - filing.estimated_credits_applied
        + filing.assessment_added_total, 2)

      payment_status (only when current payment_status != REFUND_CLAIMED):
          balance_due  < 0                                        -> OVERPAID
          balance_due == 0                                        -> PAID
          balance_due  > 0 and estimated_credits_applied  > 0      -> PARTIALLY_PAID
          balance_due  > 0 and estimated_credits_applied == 0      -> UNPAID
      # The == 0 rung is exact: a balance of 0.00 is PAID, a balance of 0.01 is UNPAID.
    input_set: "EstimatedPayment rows filtered to status == APPLIED; Notice rows filtered to status IN {APPEAL_DENIED, APPEAL_SUSTAINED, CLOSED}"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: estimated_installment_requirement
    trigger: "POST /salt/registrations/{id}/payments"
    algorithm: threshold
    formula: |
      # --- variant selection is driven by registration.safe_harbor_basis ----
      annual_required =
          round(registration.prior_year_tax * SAFE_HARBOR_PRIOR_YEAR_100_FACTOR, 2)  if PRIOR_YEAR_100
          round(registration.prior_year_tax * SAFE_HARBOR_PRIOR_YEAR_110_FACTOR, 2)  if PRIOR_YEAR_110
          round(registration.current_year_estimated_tax * SAFE_HARBOR_CURRENT_YEAR_90_FACTOR, 2) if CURRENT_YEAR_90

      n = this payment's installment_number
      payment.safe_harbor_required_amount =
          round(annual_required * n / registration.estimated_installment_count, 2)

      cumulative_paid = sum of EstimatedPayment.amount for the SAME
          (registration_id, tax_year) whose installment_number <= n and whose
          status IN {RECEIVED, APPLIED, UNAPPLIED}, including this payment
      payment.underpayment_amount  = max(0, round(payment.safe_harbor_required_amount - cumulative_paid, 2))
      payment.underpayment_penalty = round(payment.underpayment_amount * UNDERPAYMENT_PENALTY_RATE, 2)

      payment.due_date = midnight UTC of
          (tax_year, INSTALLMENT_DUE_MONTHS[n - 1], INSTALLMENT_DUE_DAY)
      payment.is_timely = payment.paid_on_date <= payment.due_date
    input_set: "EstimatedPayment rows of the same (registration_id, tax_year) with installment_number <= n and status IN {RECEIVED, APPLIED, UNAPPLIED}; REFUNDED payments are excluded"
    constants:
      SAFE_HARBOR_PRIOR_YEAR_100_FACTOR: 1.00
      SAFE_HARBOR_PRIOR_YEAR_110_FACTOR: 1.10
      SAFE_HARBOR_CURRENT_YEAR_90_FACTOR: 0.90
      UNDERPAYMENT_PENALTY_RATE: 0.05
      INSTALLMENT_DUE_MONTHS: [4, 6, 9, 12]
      INSTALLMENT_DUE_DAY: 15
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PRIOR_YEAR_SAFE_HARBOR
        when: "registration.safe_harbor_basis IN {PRIOR_YEAR_100, PRIOR_YEAR_110}"
        difference: "The annual requirement is anchored to last year's settled liability (prior_year_tax) times 1.00 or 1.10 and is completely blind to the current year's economics; current_year_estimated_tax is not read."
      - name: CURRENT_YEAR_ANNUALIZED
        when: "registration.safe_harbor_basis == CURRENT_YEAR_90"
        difference: "The annual requirement is 90% of the annualized current-year estimate (current_year_estimated_tax) and ignores prior_year_tax entirely, so two registrations holding identical prior_year_tax, current_year_estimated_tax, installment count and remittance history produce different safe_harbor_required_amount, underpayment_amount and underpayment_penalty."

  - name: extension_required_prepayment
    trigger: "POST /salt/filings/{id}/extensions"
    algorithm: threshold
    formula: |
      extension.required_prepayment = round(filing.tax_before_credits * EXTENSION_PREPAY_PCT, 2)
      if extension.estimated_tax_paid < extension.required_prepayment:
          raise ERR_EXTENSION_PREPAYMENT_INSUFFICIENT
      # boundary is >=: estimated_tax_paid exactly equal to required_prepayment passes
    input_set: "the single StateFiling row's tax_before_credits as of the request instant"
    constants:
      EXTENSION_PREPAY_PCT: 0.90
    precision: "2 decimal places, round_half_up"

  - name: notice_assessment_total
    trigger: "POST /salt/notices/{id}/appeal-decision"
    algorithm: constraint_propagation
    formula: |
      final_tax = notice.assessed_tax - sustained_amount        # sustained_amount is 0 on a DENIED outcome
      # EVALUATION ORDER IS PINNED and the dependency looks circular because the
      # penalty is capped on a pre-interest base while the interest base already
      # contains the penalty. Resolve strictly in this order:
      #   step 1 - penalty from final_tax, capped
      #   step 2 - interest from (final_tax + penalty), never from final_tax alone
      #   step 3 - total
      notice.penalty_amount  = round(min(final_tax * NOTICE_PENALTY_RATE, NOTICE_PENALTY_CAP), 2)
      days_outstanding       = floor((current logical clock - notice.notice_date) / 1 day)
      notice.interest_amount = round((final_tax + notice.penalty_amount)
                                     * NOTICE_INTEREST_RATE * days_outstanding / DAYS_PER_YEAR, 2)
      notice.assessment_final_amount = round(final_tax + notice.penalty_amount + notice.interest_amount, 2)
    input_set: "the single Notice row plus the current logical clock; no aggregation"
    constants:
      NOTICE_PENALTY_RATE: 0.10
      NOTICE_PENALTY_CAP: 2500.00
      NOTICE_INTEREST_RATE: 0.06
      DAYS_PER_YEAR: 365
    precision: "2 decimal places, round_half_up, applied at each of the three steps"

  - name: vda_exposure
    trigger: "POST /salt/registrations/{id}/vda-agreements"
    algorithm: decay_function
    formula: |
      effective_lookback_years =
          vda.lookback_years    if exposure_variant == LOOKBACK_LIMITED
          FULL_EXPOSURE_YEARS   if exposure_variant == FULL_EXPOSURE
      vda.lookback_end_year   = vda.anchor_tax_year
      vda.lookback_start_year = vda.anchor_tax_year - effective_lookback_years + 1

      vda.computed_exposure_tax =
          round(vda.estimated_exposure_tax * effective_lookback_years / FULL_EXPOSURE_YEARS, 2)
                                                if exposure_variant == LOOKBACK_LIMITED
          round(vda.estimated_exposure_tax, 2)  if exposure_variant == FULL_EXPOSURE
      vda.waived_penalty_amount =
          round(vda.computed_exposure_tax * VDA_PENALTY_WAIVER_RATE, 2)
                                                if exposure_variant == LOOKBACK_LIMITED
          0.00                                  if exposure_variant == FULL_EXPOSURE

      # at execution:
      vda.settlement_total = round(coalesce(negotiated_tax, vda.computed_exposure_tax) + negotiated_interest, 2)
    input_set: "the single VDAAgreement row; the disclosure window is [lookback_start_year, lookback_end_year] inclusive"
    constants:
      FULL_EXPOSURE_YEARS: 7
      VDA_PENALTY_WAIVER_RATE: 0.25
      VDA_MAX_LOOKBACK_YEARS: 4
    precision: "2 decimal places, round_half_up"
    variants:
      - name: LOOKBACK_LIMITED
        when: "exposure_variant == LOOKBACK_LIMITED"
        difference: "Exposure is pro-rated to the negotiated window (lookback_years / 7) and a quarter of the pro-rated tax is recorded as waived penalty; the window covers only lookback_years tax years."
      - name: FULL_EXPOSURE
        when: "exposure_variant == FULL_EXPOSURE"
        difference: "The full estimate is owed, no penalty is waived, and effective_lookback_years is forced to FULL_EXPOSURE_YEARS regardless of the submitted lookback_years, so the window and the money both differ from LOOKBACK_LIMITED on identical inputs."

  - name: group_compliance_posture
    trigger: "system, whenever open_registration_obligations changes or a filing's balance_due / assessment_added_total changes"
    algorithm: projection
    formula: |
      # LADDER - first match wins
      1. DELINQUENT if EXISTS StateFiling f with f.registration_id IN (registrations of this group)
                       AND f.preparation_status IN {FILED, AMENDED}
                       AND f.balance_due > 0
                       AND f.assessment_added_total > 0
      2. EXPOSED    if group.open_registration_obligations >= 1
      3. COMPLIANT  otherwise

      # CONSERVED QUANTITY (invariant):
      #   group.open_registration_obligations
      #     == COUNT(StateRegistration r where r.group_id == group.id
      #              AND r.registration_status == 'REGISTRATION_REQUIRED')
    input_set: "StateRegistration rows of the group filtered to registration_status == REGISTRATION_REQUIRED; StateFiling rows filtered to preparation_status IN {FILED, AMENDED}"
    constants: {}
    precision: "integer count; the >= 1 comparison at rung 2 is exact"

# =========================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority)
# =========================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list in section 1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id in the request path resolves, validated left to right"
    error_id: "ERR_GROUP_NOT_FOUND | ERR_LEGAL_ENTITY_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_ACTIVITY_RECORD_NOT_FOUND | ERR_ELECTION_NOT_FOUND | ERR_FILING_NOT_FOUND | ERR_CREDIT_CLAIM_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_EXTENSION_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_VDA_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves: legal_entity_id, election_id, primary_legal_entity_id, filing_id"
    error_id: "ERR_LEGAL_ENTITY_NOT_FOUND | ERR_ELECTION_NOT_FOUND | ERR_FILING_NOT_FOUND"
    http_status: 404
    applies_to: "POST /salt/registrations/{id}/activity-records, POST /salt/registrations/{id}/filings, POST /salt/registrations/{id}/vda-agreements, POST /salt/payments/{id}/apply"

  - priority: 5
    category: business_constraint
    check: "required body fields present; enum members valid; numeric ranges honored (tax_rate 0..1, allocation_ratio 0..1, installment_number 1..4, binding_years >= 1, lookback_years >= 1, granted_amount > 0, amount > 0, state_code exactly two uppercase letters)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: state
    check: "expected_filing_version equals StateFiling.version / expected_registration_version equals StateRegistration.version"
    error_id: "ERR_STALE_FILING_VERSION | ERR_STALE_REGISTRATION_VERSION"
    http_status: 412
    applies_to: "POST /salt/filings/{id}/credit-claims, POST /salt/registrations/{id}/payments"

  - priority: 7
    category: state
    check: "the target StateFiling.preparation_status is a legal source state for the requested operation: DRAFT or AMENDED for compute-factors, lock-factors, modifications and credit-claims; FACTORS_LOCKED, IN_REVIEW or APPROVED for extensions; FACTORS_LOCKED for submit-review; IN_REVIEW for approve and reject; APPROVED for file; FILED for amend"
    error_id: ERR_INVALID_FILING_STATE
    http_status: 409
    applies_to: "POST /salt/filings/{id}/compute-factors, /lock-factors, /submit-review, /approve, /reject, /file, /amend, /modifications, /credit-claims, /extensions"
    note: "Beats every business rule below. Pairs with priority 39 in the dual-failure case 'extension requested on a DRAFT filing with insufficient prepayment'."

  - priority: 8
    category: state
    check: "the target StateFiling.payment_status == OVERPAID before a refund can be claimed"
    error_id: ERR_INVALID_FILING_STATE
    http_status: 409
    applies_to: "POST /salt/filings/{id}/claim-refund"
    note: "Pairs with priority 40 in the dual-failure case 'claim-refund on a filing that is neither OVERPAID nor has applied payments'."

  - priority: 9
    category: state
    check: "the target Notice.status is a legal `from` state for respond / request-info / appeal / appeal-decision / close"
    error_id: ERR_INVALID_NOTICE_STATE
    http_status: 409
    applies_to: "POST /salt/notices/{id}/respond, /request-info, /appeal, /appeal-decision, /close"

  - priority: 10
    category: state
    check: "the target FilingElection.status is ELECTED for revoke and REVOKED for reinstate"
    error_id: ERR_INVALID_ELECTION_STATE
    http_status: 409
    applies_to: "POST /salt/elections/{id}/revoke, POST /salt/elections/{id}/reinstate"

  - priority: 11
    category: state
    check: "the target VDAAgreement.status is DRAFT for submit, SUBMITTED for execute, DRAFT or SUBMITTED for withdraw"
    error_id: ERR_INVALID_VDA_STATE
    http_status: 409
    applies_to: "POST /salt/vda-agreements/{id}/submit, /execute, /withdraw"

  - priority: 12
    category: state
    check: "the target ExtensionRequest.status == REQUESTED"
    error_id: ERR_INVALID_EXTENSION_STATE
    http_status: 409
    applies_to: "POST /salt/extensions/{id}/acknowledge"

  - priority: 13
    category: state
    check: "payment.status IN {RECEIVED, UNAPPLIED} for apply; payment.status == APPLIED for unapply"
    error_id: ERR_INVALID_PAYMENT_STATE
    http_status: 409
    applies_to: "POST /salt/payments/{id}/apply, POST /salt/payments/{id}/unapply"

  - priority: 14
    category: state
    check: "the owning StateRegistration.registration_status != WITHDRAWN"
    error_id: ERR_REGISTRATION_WITHDRAWN
    http_status: 409
    applies_to: "POST /salt/registrations/{id}/evaluate-nexus, /complete-registration, /activity-records, /elections, /filings, /payments, /vda-agreements"

  - priority: 15
    category: business_safety
    check: "the owning StateRegistration.nexus_status != NONE before any apportionment work is done"
    error_id: ERR_NEXUS_NOT_ESTABLISHED
    http_status: 422
    applies_to: "POST /salt/filings/{id}/compute-factors, POST /salt/filings/{id}/lock-factors"
    note: "Beats priority 29. Pairs with priority 29 in the dual-failure case 'compute-factors on a registration with no nexus whose SALES denominator is also zero'."

  - priority: 16
    category: business_safety
    check: "the owning StateRegistration.nexus_status != PROTECTED_PL86272 - a protected-solicitation state cannot be assessed net income tax, whatever the registration status"
    error_id: ERR_PL86272_PROTECTED
    http_status: 422
    applies_to: "POST /salt/filings/{id}/lock-factors"

  - priority: 17
    category: business_safety
    check: "the owning StateRegistration.registration_status == REGISTERED before the return can be locked"
    error_id: ERR_REGISTRATION_NOT_COMPLETE
    http_status: 422
    applies_to: "POST /salt/filings/{id}/lock-factors"

  - priority: 18
    category: business_safety
    check: "X-User-ID of the approver differs from StateFiling.preparer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /salt/filings/{id}/approve"

  - priority: 19
    category: business_referential
    check: "legal_entity_id belongs to the same TaxpayerGroup as the registration in the path"
    error_id: ERR_ENTITY_NOT_IN_GROUP
    http_status: 422
    applies_to: "POST /salt/registrations/{id}/activity-records, POST /salt/registrations/{id}/vda-agreements, POST /salt/registrations/{id}/filings (primary_legal_entity_id)"

  - priority: 20
    category: business_referential
    check: "ActivityRecord.tax_year of the row being created is not earlier than the group's earliest allowed year (tax_year >= 2000) and, for VDA disclosure windows, anchor_tax_year >= lookback_years"
    error_id: ERR_ACTIVITY_YEAR_MISMATCH
    http_status: 422
    applies_to: "POST /salt/registrations/{id}/activity-records, POST /salt/registrations/{id}/vda-agreements"

  - priority: 21
    category: business_referential
    check: "primary_legal_entity_id is supplied when filing_basis == SEPARATE_ENTITY"
    error_id: ERR_PRIMARY_ENTITY_REQUIRED
    http_status: 422
    applies_to: "POST /salt/registrations/{id}/filings"

  - priority: 22
    category: business_referential
    check: "a supplied election_id belongs to the same registration, has status ELECTED, and covers the filing's tax_year (effective_tax_year <= tax_year <= expires_after_tax_year)"
    error_id: ERR_ELECTION_NOT_GOVERNING
    http_status: 422
    applies_to: "POST /salt/registrations/{id}/filings"

  - priority: 23
    category: business_referential
    check: "at file time, when filing.election_id is not null, filing.filing_basis equals the governing FilingElection.election_basis and that election is still ELECTED"
    error_id: ERR_ELECTION_BASIS_MISMATCH
    http_status: 422
    applies_to: "POST /salt/filings/{id}/file"
    note: "Beats priority 34. Pairs with priority 34 in the dual-failure case 'file a basis-mismatched return after the extended due date'."

  - priority: 24
    category: business_referential
    check: "the target filing's registration_id equals the payment's registration_id"
    error_id: ERR_FILING_REGISTRATION_MISMATCH
    http_status: 422
    applies_to: "POST /salt/payments/{id}/apply"

  - priority: 25
    category: business_referential
    check: "the target filing's tax_year equals the payment's tax_year"
    error_id: ERR_PAYMENT_TAX_YEAR_MISMATCH
    http_status: 422
    applies_to: "POST /salt/payments/{id}/apply"

  - priority: 26
    category: business_referential
    check: "no StateFiling on the VDA's registration with preparation_status IN {FILED, AMENDED} has tax_year inside [lookback_start_year, lookback_end_year]"
    error_id: ERR_VDA_YEAR_ALREADY_FILED
    http_status: 422
    applies_to: "POST /salt/vda-agreements/{id}/execute"

  - priority: 27
    category: business_constraint
    check: "no other StateRegistration for the same group already carries this state_code"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /salt/groups/{id}/registrations"

  - priority: 28
    category: business_constraint
    check: "at least one ActivityRecord exists for (filing.registration_id, filing.tax_year) restricted to the filing's included members"
    error_id: ERR_NO_ACTIVITY_RECORDS
    http_status: 422
    applies_to: "POST /salt/filings/{id}/compute-factors"

  - priority: 29
    category: business_constraint
    check: "after excluding every factor whose denominator is exactly 0, at least one factor with a non-zero base weight survives"
    error_id: ERR_FACTOR_DENOMINATOR_ZERO
    http_status: 422
    applies_to: "POST /salt/filings/{id}/compute-factors"

  - priority: 30
    category: business_constraint
    check: "ApportionmentFactor rows exist for the filing AND no ActivityRecord for (filing.registration_id, filing.tax_year) was created after the filing's most recent compute-factors run"
    error_id: ERR_FACTORS_STALE
    http_status: 409
    applies_to: "POST /salt/filings/{id}/lock-factors"

  - priority: 31
    category: business_constraint
    check: "the proposed election's closed integer year interval [effective_tax_year, effective_tax_year + binding_years - 1] does not intersect the occupied interval of any other election on the same registration"
    error_id: ERR_ELECTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /salt/registrations/{id}/elections, POST /salt/elections/{id}/reinstate"

  - priority: 32
    category: business_constraint
    check: "the proposed disclosure window, widened by VDA_COOLING_MONTHS on both ends, does not intersect the un-widened half-open window of any other VDAAgreement for the same legal_entity_id whose status IN {DRAFT, SUBMITTED, EXECUTED}"
    error_id: ERR_VDA_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /salt/registrations/{id}/vda-agreements"

  - priority: 33
    category: business_constraint
    check: "no other EstimatedPayment exists with the same (registration_id, tax_year, installment_number)"
    error_id: ERR_DUPLICATE_INSTALLMENT
    http_status: 409
    applies_to: "POST /salt/registrations/{id}/payments"

  - priority: 34
    category: business_temporal
    check: "the current logical clock is at or before filing.extended_due_date when set, otherwise at or before filing.original_due_date (the boundary instant itself is allowed)"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /salt/filings/{id}/file"

  - priority: 35
    category: business_temporal
    check: "the current logical clock is at or before filing.original_due_date (the boundary instant itself is allowed)"
    error_id: ERR_EXTENSION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /salt/filings/{id}/extensions"

  - priority: 36
    category: business_temporal
    check: "the current logical clock is at or before notice.response_due_date"
    error_id: ERR_RESPONSE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /salt/notices/{id}/respond"

  - priority: 37
    category: business_temporal
    check: "the current logical clock is at or before notice.appeal_due_date"
    error_id: ERR_APPEAL_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /salt/notices/{id}/appeal"

  - priority: 38
    category: business_temporal
    check: "revocation_tax_year is later than election.expires_after_tax_year, unless registration.state_permits_early_revocation == true"
    error_id: ERR_BINDING_PERIOD_ACTIVE
    http_status: 422
    applies_to: "POST /salt/elections/{id}/revoke"

  - priority: 39
    category: business_fiscal
    check: "estimated_tax_paid >= round(filing.tax_before_credits * EXTENSION_PREPAY_PCT, 2)"
    error_id: ERR_EXTENSION_PREPAYMENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /salt/filings/{id}/extensions"

  - priority: 40
    category: business_fiscal
    check: "at least one EstimatedPayment with status == APPLIED points at this filing, so there is money available to refund"
    error_id: ERR_REFUND_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /salt/filings/{id}/claim-refund"

  - priority: 41
    category: business_fiscal
    check: "when exposure_variant == LOOKBACK_LIMITED, lookback_years <= VDA_MAX_LOOKBACK_YEARS"
    error_id: ERR_VDA_EXPOSURE_MISMATCH
    http_status: 422
    applies_to: "POST /salt/registrations/{id}/vda-agreements"

# =========================================================================
# 1.5 API Endpoint Table
# =========================================================================
endpoints:

  # ---- logical clock (test-driving endpoint) -----------------------------
  - method: POST
    path: "/salt/_clock/set_current_utc"
    description: "Set the server's logical clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time."
    roles: [TaxManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "every subsequent deadline, window, interest-accrual and carryforward-expiry comparison reads this instant"

  # ---- TaxpayerGroup -----------------------------------------------------
  - method: POST
    path: "/salt/groups"
    description: "Create a combined-reporting taxpayer group."
    roles: [TaxManager]
    code: 201
    input: [name, base_state_code, everywhere_sales, everywhere_property, everywhere_payroll, "fiscal_year_end_month?"]
    output: TaxpayerGroup
    side_effects:
      - "compliance_posture initialized to COMPLIANT and open_registration_obligations to 0"

  - method: GET
    path: "/salt/groups/{id}"
    description: "Read one taxpayer group including its derived posture and obligation counter."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: []
    output: TaxpayerGroup
    side_effects: []

  - method: GET
    path: "/salt/groups"
    description: "List taxpayer groups, newest last, with limit/offset pagination."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: TaxpayerGroup[]
    side_effects: []

  # ---- LegalEntity -------------------------------------------------------
  - method: POST
    path: "/salt/groups/{id}/legal-entities"
    description: "Add a member entity to the group."
    roles: [TaxManager]
    code: 201
    input: [name, incorporation_state_code, "entity_type?", "is_unitary_member?"]
    output: LegalEntity
    side_effects: []

  - method: GET
    path: "/salt/legal-entities/{id}"
    description: "Read one member entity."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: []
    output: LegalEntity
    side_effects: []

  - method: GET
    path: "/salt/groups/{id}/legal-entities"
    description: "List the group's member entities (reverse lookup for LegalEntity.group_id)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: LegalEntity[]
    side_effects: []

  # ---- StateRegistration -------------------------------------------------
  - method: POST
    path: "/salt/groups/{id}/registrations"
    description: "Open a state profile for the group: apportionment formula, sourcing rules, filing calendar and safe-harbor basis."
    roles: [TaxManager]
    code: 201
    input: [state_code, factor_formula, tax_rate, throwback_rule, service_sourcing_rule, "safe_harbor_basis?", "economic_nexus_sales_threshold?", "economic_nexus_employee_days_threshold?", "due_month?", "due_day?", "extension_months?", "estimated_installment_count?", "prior_year_tax?", "current_year_estimated_tax?", "state_permits_early_revocation?"]
    output: StateRegistration
    side_effects:
      - "nexus_status initialized to NONE and registration_status to NOT_REQUIRED"

  - method: GET
    path: "/salt/registrations/{id}"
    description: "Read one state registration including both status axes and the payment pools."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: []
    output: StateRegistration
    side_effects: []

  - method: GET
    path: "/salt/groups/{id}/registrations"
    description: "List the group's state registrations (reverse lookup for StateRegistration.group_id)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: StateRegistration[]
    side_effects: []

  - method: PATCH
    path: "/salt/registrations/{id}"
    description: "Registration maintenance: adjust filing-calendar and safe-harbor configuration in place."
    roles: [TaxManager]
    code: 200
    input: ["safe_harbor_basis?", "prior_year_tax?", "current_year_estimated_tax?", "tax_rate?", "due_month?", "due_day?", "extension_months?", "economic_nexus_sales_threshold?", "economic_nexus_employee_days_threshold?", "state_permits_early_revocation?", "factor_formula?", "throwback_rule?", "service_sourcing_rule?"]
    output: StateRegistration
    side_effects:
      - "increments StateRegistration.version by 1"
      - "already-created EstimatedPayment rows keep the values computed at their own creation instant; the new configuration only affects later writes"

  - method: POST
    path: "/salt/registrations/{id}/evaluate-nexus"
    description: "Run calculations.nexus_determination for one tax year and write the nexus axis."
    roles: [TaxManager]
    code: 200
    input: [as_of_tax_year]
    output: StateRegistration
    side_effects:
      - "sets registration.nexus_status per calculations.nexus_determination"
      - "LINK 1 -> NOT_REQUIRED becomes REGISTRATION_REQUIRED when the result is ECONOMIC or PHYSICAL"
      - "LINK 2 -> TaxpayerGroup.open_registration_obligations increments"
      - "LINK 3 -> TaxpayerGroup.compliance_posture recomputed per calculations.group_compliance_posture"
      - "LINK 4 -> every APPROVED StateFiling of the group is demoted to IN_REVIEW with approver_user_id cleared when the posture flips COMPLIANT -> EXPOSED"
      - "increments StateRegistration.version by 1"

  - method: POST
    path: "/salt/registrations/{id}/complete-registration"
    description: "Record that the state has issued an account number, closing the registration obligation."
    roles: [TaxManager]
    code: 200
    input: [state_account_number]
    output: StateRegistration
    side_effects:
      - "registration_status REGISTRATION_REQUIRED -> REGISTERED; registered_on_date stamped from the logical clock"
      - "LINK 1 -> TaxpayerGroup.open_registration_obligations decrements"
      - "LINK 2 -> TaxpayerGroup.compliance_posture recomputed"
      - "increments StateRegistration.version by 1"

  - method: POST
    path: "/salt/registrations/{id}/withdraw"
    description: "Withdraw a state registration; the row stays queryable but accepts no further work."
    roles: [TaxManager]
    code: 200
    input: [reason]
    output: StateRegistration
    side_effects:
      - "registration_status -> WITHDRAWN"
      - "TaxpayerGroup.open_registration_obligations decrements when the row was REGISTRATION_REQUIRED, then compliance_posture is recomputed"
      - "increments StateRegistration.version by 1"

  - method: POST
    path: "/salt/registrations/{id}/roll-filing-calendar"
    description: "Filing-calendar maintenance: advance the registration's calendar horizon and expire every election whose binding period ended before through_tax_year."
    roles: [TaxManager]
    code: 200
    input: [through_tax_year]
    output: StateRegistration
    side_effects:
      - "every FilingElection on this registration with status ELECTED and expires_after_tax_year < through_tax_year moves to EXPIRED"
      - "registration.calendar_rolled_through_year = through_tax_year"
      - "increments StateRegistration.version by 1"

  # ---- ActivityRecord ----------------------------------------------------
  - method: POST
    path: "/salt/registrations/{id}/activity-records"
    description: "Record one member entity's in-state activity for one tax year. Immutable once written."
    roles: [TaxManager, StateAnalyst]
    code: 201
    input: [legal_entity_id, tax_year, "destination_sales?", "origin_sales?", "purchaser_taxable_in_state?", "service_receipts?", "cost_of_performance_state_code?", "property_average_value?", "rented_property_annual_rent?", "payroll_compensation?", "employee_days_in_state?", "protected_solicitation_only?"]
    output: ActivityRecord
    side_effects:
      - "no derived field on any other entity changes until evaluate-nexus or compute-factors is run"

  - method: GET
    path: "/salt/activity-records/{id}"
    description: "Read one activity record."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: []
    output: ActivityRecord
    side_effects: []

  - method: GET
    path: "/salt/activity-records"
    description: "List activity records filtered by registration, member entity and tax year (reverse lookup for both ActivityRecord foreign keys)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["registration_id?", "legal_entity_id?", "tax_year?", "limit?", "offset?"]
    output: ActivityRecord[]
    side_effects: []

  # ---- FilingElection ----------------------------------------------------
  - method: POST
    path: "/salt/registrations/{id}/elections"
    description: "File a combined-vs-separate reporting election binding a closed range of tax years."
    roles: [TaxManager]
    code: 201
    input: [election_basis, effective_tax_year, binding_years]
    output: FilingElection
    side_effects:
      - "expires_after_tax_year computed as effective_tax_year + binding_years - 1"
      - "the closed interval [effective_tax_year, expires_after_tax_year] becomes occupied on this registration"

  - method: GET
    path: "/salt/elections/{id}"
    description: "Read one filing election."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: []
    output: FilingElection
    side_effects: []

  - method: GET
    path: "/salt/registrations/{id}/elections"
    description: "List the registration's elections (reverse lookup for FilingElection.registration_id)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: FilingElection[]
    side_effects: []

  - method: POST
    path: "/salt/elections/{id}/revoke"
    description: "Revoke an election effective with revocation_tax_year, contracting its occupied interval."
    roles: [TaxManager]
    code: 200
    input: [revocation_tax_year, "reason?"]
    output: FilingElection
    side_effects:
      - "status ELECTED -> REVOKED; occupied interval contracts to [effective_tax_year, revocation_tax_year - 1]"
      - "increments FilingElection.version by 1"

  - method: POST
    path: "/salt/elections/{id}/reinstate"
    description: "Re-elect a revoked election over a fresh binding period."
    roles: [TaxManager]
    code: 200
    input: [effective_tax_year, binding_years]
    output: FilingElection
    side_effects:
      - "status REVOKED -> ELECTED; effective_tax_year, binding_years and expires_after_tax_year replaced; revocation_tax_year cleared"
      - "reinstatement_count increments by 1"
      - "increments FilingElection.version by 1"

  # ---- StateFiling -------------------------------------------------------
  - method: POST
    path: "/salt/registrations/{id}/filings"
    description: "Open a state return for one tax year on one registration."
    roles: [StateAnalyst, TaxManager]
    code: 201
    input: [tax_year, filing_basis, federal_taxable_income, "election_id?", "primary_legal_entity_id?"]
    output: StateFiling
    side_effects:
      - "original_due_date computed from the registration's due_month/due_day in tax_year + 1"
      - "preparation_status DRAFT, payment_status UNPAID"

  - method: GET
    path: "/salt/filings/{id}"
    description: "Read one state return with both status axes and every derived money field."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: []
    output: StateFiling
    side_effects: []

  - method: GET
    path: "/salt/filings"
    description: "List state returns filtered by registration, election, primary member entity, tax year and preparation status (reverse lookup for all three StateFiling foreign keys)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["registration_id?", "election_id?", "primary_legal_entity_id?", "tax_year?", "preparation_status?", "limit?", "offset?"]
    output: StateFiling[]
    side_effects: []

  - method: POST
    path: "/salt/filings/{id}/compute-factors"
    description: "Run the sales/property/payroll factor computation under the chosen member-inclusion doctrine and cascade the whole liability chain."
    roles: [StateAnalyst, TaxManager]
    code: 200
    input: [apportionment_variant]
    output: StateFiling
    side_effects:
      - "three ApportionmentFactor rows (SALES, PROPERTY, PAYROLL) are created or replaced for this filing"
      - "LINK 1 -> filing.apportionment_variant and filing.apportionment_percentage set per calculations.apportionment_factor_computation"
      - "LINK 2 (caused by LINK 1) -> filing.modification_total, state_taxable_income and tax_before_credits recomputed per calculations.state_modification_total and calculations.state_tax_before_credits"
      - "LINK 3 (caused by LINK 2) -> calculations.credit_application_waterfall re-runs, rewriting every CreditClaim.applied_amount / carryforward_amount / expired_amount / status and filing.credits_applied_total"
      - "LINK 4 (caused by LINK 3) -> calculations.filing_balance_due recomputes filing.balance_due and re-derives filing.payment_status"
      - "TaxpayerGroup.nowhere_sales_pool rewritten per calculations.apportionment_factor_computation (non-zero only when throwback_rule == NONE)"
      - "increments StateFiling.version by 1"

  - method: POST
    path: "/salt/filings/{id}/lock-factors"
    description: "Freeze the computed return so no further modifications or credit claims can be added."
    roles: [StateAnalyst, TaxManager]
    code: 200
    input: []
    output: StateFiling
    side_effects:
      - "preparation_status DRAFT|AMENDED -> FACTORS_LOCKED"
      - "increments StateFiling.version by 1"

  - method: POST
    path: "/salt/filings/{id}/submit-review"
    description: "Submit the frozen return for review; the caller is recorded as preparer."
    roles: [StateAnalyst, Controller]
    code: 200
    input: ["preparer_note?"]
    output: StateFiling
    side_effects:
      - "preparation_status FACTORS_LOCKED -> IN_REVIEW"
      - "filing.preparer_user_id = X-User-ID of the caller"
      - "increments StateFiling.version by 1"

  - method: POST
    path: "/salt/filings/{id}/approve"
    description: "Approve a return for filing. The approver may not be the preparer."
    roles: [Controller, TaxManager]
    code: 200
    input: ["approval_note?"]
    output: StateFiling
    side_effects:
      - "preparation_status IN_REVIEW -> APPROVED"
      - "filing.approver_user_id = X-User-ID of the caller"
      - "increments StateFiling.version by 1"

  - method: POST
    path: "/salt/filings/{id}/reject"
    description: "Send a return under review back to the preparer for revision."
    roles: [Controller, TaxManager]
    code: 200
    input: [rejection_reason]
    output: StateFiling
    side_effects:
      - "preparation_status IN_REVIEW -> DRAFT; approver_user_id cleared"
      - "increments StateFiling.version by 1"

  - method: POST
    path: "/salt/filings/{id}/file"
    description: "Transmit the approved return to the state."
    roles: [Controller, TaxManager]
    code: 200
    input: [confirmation_number]
    output: StateFiling
    side_effects:
      - "preparation_status APPROVED -> FILED; confirmation_number stored; filed_on_date stamped from the logical clock"
      - "increments StateFiling.version by 1"

  - method: POST
    path: "/salt/filings/{id}/amend"
    description: "Reopen a filed return for amendment, reversing the credit waterfall."
    roles: [Controller, TaxManager]
    code: 200
    input: [reason, "federal_taxable_income?"]
    output: StateFiling
    side_effects:
      - "preparation_status FILED -> AMENDED; amendment_count increments by 1"
      - "COMPENSATION -> every CreditClaim on the filing returns to applied_amount 0, carryforward_amount = granted_amount, expired_amount 0, status PENDING; filing.credits_applied_total returns to 0"
      - "filing.balance_due and payment_status recomputed per calculations.filing_balance_due"
      - "increments StateFiling.version by 1"

  - method: POST
    path: "/salt/filings/{id}/claim-refund"
    description: "Claim a refund of the overpayment on a filed return."
    roles: [Controller, TaxManager]
    code: 200
    input: ["refund_method?"]
    output: StateFiling
    side_effects:
      - "payment_status OVERPAID -> REFUND_CLAIMED"
      - "every EstimatedPayment applied to this filing moves to status REFUNDED"
      - "increments StateFiling.version by 1"

  - method: GET
    path: "/salt/filings/{id}/factors"
    description: "List the three apportionment factor rows of a return (reverse lookup for ApportionmentFactor.filing_id)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ApportionmentFactor[]
    side_effects: []

  # ---- Modification ------------------------------------------------------
  - method: POST
    path: "/salt/filings/{id}/modifications"
    description: "Add a state addition or subtraction modification line to a return."
    roles: [StateAnalyst, TaxManager]
    code: 201
    input: [modification_code, direction, raw_amount, allocation_ratio]
    output: Modification
    side_effects:
      - "line_amount = round(raw_amount * allocation_ratio, 2); sequence_number assigned by created_at ASC"
      - "filing.modification_total recomputed per calculations.state_modification_total, then state_taxable_income, tax_before_credits, the credit waterfall and balance_due are recomputed in that order"
      - "increments StateFiling.version by 1"

  - method: GET
    path: "/salt/filings/{id}/modifications"
    description: "List a return's modification lines in sequence_number order (reverse lookup for Modification.filing_id)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Modification[]
    side_effects: []

  # ---- CreditClaim -------------------------------------------------------
  - method: POST
    path: "/salt/filings/{id}/credit-claims"
    description: "Claim a state credit on a return. Guarded by optimistic concurrency on the filing's version because every claim re-runs the whole waterfall."
    roles: [StateAnalyst, TaxManager]
    code: 201
    input: [credit_code, granted_amount, priority_order, expected_filing_version, "refundable?", "expires_after_years?"]
    output: CreditClaim
    side_effects:
      - "calculations.credit_application_waterfall re-runs over every claim of the filing, rewriting applied_amount, carryforward_amount, expired_amount and status on each"
      - "filing.credits_applied_total and filing.balance_due recomputed; payment_status re-derived"
      - "increments StateFiling.version by 1"

  - method: GET
    path: "/salt/credit-claims/{id}"
    description: "Read one credit claim with its waterfall outcome."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: []
    output: CreditClaim
    side_effects: []

  - method: GET
    path: "/salt/filings/{id}/credit-claims"
    description: "List a return's credit claims in waterfall order (reverse lookup for CreditClaim.filing_id)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: CreditClaim[]
    side_effects: []

  # ---- EstimatedPayment --------------------------------------------------
  - method: POST
    path: "/salt/registrations/{id}/payments"
    description: "Record an estimated-tax installment. Guarded by optimistic concurrency on the registration's version because every remittance shifts the cumulative safe-harbor arithmetic."
    roles: [Controller, TaxManager]
    code: 201
    input: [tax_year, installment_number, amount, paid_on_date, expected_registration_version]
    output: EstimatedPayment
    side_effects:
      - "due_date, is_timely, safe_harbor_required_amount, underpayment_amount and underpayment_penalty computed per calculations.estimated_installment_requirement"
      - "registration.total_payments_received and registration.unapplied_payment_balance each increase by amount"
      - "increments StateRegistration.version by 1"

  - method: GET
    path: "/salt/payments/{id}"
    description: "Read one estimated-tax payment."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: []
    output: EstimatedPayment
    side_effects: []

  - method: GET
    path: "/salt/payments"
    description: "List estimated-tax payments filtered by registration, applied return and status (reverse lookup for both EstimatedPayment foreign keys)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["registration_id?", "applied_filing_id?", "status?", "tax_year?", "limit?", "offset?"]
    output: EstimatedPayment[]
    side_effects: []

  - method: POST
    path: "/salt/payments/{id}/apply"
    description: "Apply a remittance to a specific return."
    roles: [Controller, TaxManager]
    code: 200
    input: [filing_id]
    output: EstimatedPayment
    side_effects:
      - "payment.status -> APPLIED; payment.applied_filing_id = filing_id"
      - "registration.unapplied_payment_balance decreases by amount; registration.total_payments_received unchanged"
      - "filing.estimated_credits_applied increases by amount; balance_due and payment_status recomputed"
      - "increments EstimatedPayment.version by 1 and StateFiling.version by 1"

  - method: POST
    path: "/salt/payments/{id}/unapply"
    description: "Detach a remittance from a return, returning it to the unapplied pool."
    roles: [Controller, TaxManager]
    code: 200
    input: [reason]
    output: EstimatedPayment
    side_effects:
      - "payment.status -> UNAPPLIED; payment.applied_filing_id cleared"
      - "registration.unapplied_payment_balance increases by amount; registration.total_payments_received unchanged"
      - "filing.estimated_credits_applied decreases by amount; balance_due and payment_status recomputed"
      - "increments EstimatedPayment.version by 1 and StateFiling.version by 1"

  # ---- ExtensionRequest --------------------------------------------------
  - method: POST
    path: "/salt/filings/{id}/extensions"
    description: "Request a filing extension for a return; requested_on_date is stamped from the logical clock."
    roles: [StateAnalyst, TaxManager]
    code: 201
    input: [estimated_tax_paid]
    output: ExtensionRequest
    side_effects:
      - "required_prepayment computed per calculations.extension_required_prepayment"
      - "status initialized to REQUESTED; new_due_date stays null until acknowledgement"

  - method: GET
    path: "/salt/filings/{id}/extensions"
    description: "List a return's extension requests (reverse lookup for ExtensionRequest.filing_id)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ExtensionRequest[]
    side_effects: []

  - method: POST
    path: "/salt/extensions/{id}/acknowledge"
    description: "Record the state's grant or denial of an extension request."
    roles: [TaxManager]
    code: 200
    input: [decision, "state_confirmation?"]
    output: ExtensionRequest
    side_effects:
      - "GRANTED branch -> new_due_date = filing.original_due_date + registration.extension_months months AND filing.extended_due_date is set to it"
      - "DENIED branch -> new_due_date stays null and filing.extended_due_date is left untouched"
      - "increments ExtensionRequest.version by 1"

  # ---- Notice ------------------------------------------------------------
  - method: POST
    path: "/salt/filings/{id}/notices"
    description: "Record a state notice or proposed assessment against a filed return."
    roles: [TaxManager, Controller]
    code: 201
    input: [notice_type, state_notice_number, assessed_tax, notice_date, "response_due_days?"]
    output: Notice
    side_effects:
      - "response_due_date = notice_date + response_due_days days; appeal_due_date = notice_date + APPEAL_WINDOW_DAYS days"
      - "status initialized to OPEN, response_round 0"

  - method: GET
    path: "/salt/notices/{id}"
    description: "Read one notice with its penalty/interest breakdown."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: []
    output: Notice
    side_effects: []

  - method: GET
    path: "/salt/filings/{id}/notices"
    description: "List a return's notices (reverse lookup for Notice.filing_id)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Notice[]
    side_effects: []

  - method: POST
    path: "/salt/notices/{id}/respond"
    description: "File a response to a notice, contesting some or all of the assessed tax."
    roles: [Controller, TaxManager]
    code: 200
    input: [response_summary, "contested_amount?"]
    output: Notice
    side_effects:
      - "status OPEN|INFO_REQUESTED -> RESPONDED; response_round increments by 1; contested_amount recorded"
      - "increments Notice.version by 1"

  - method: POST
    path: "/salt/notices/{id}/request-info"
    description: "Record that the state has asked for more information, reopening the response window."
    roles: [TaxManager]
    code: 200
    input: [info_requested]
    output: Notice
    side_effects:
      - "status RESPONDED -> INFO_REQUESTED; response_due_date reset to the logical clock + DEFAULT_RESPONSE_DUE_DAYS days"
      - "increments Notice.version by 1"

  - method: POST
    path: "/salt/notices/{id}/appeal"
    description: "Appeal a notice to the state's appellate division."
    roles: [Controller, TaxManager]
    code: 200
    input: [appeal_grounds]
    output: Notice
    side_effects:
      - "status -> APPEAL_FILED"
      - "increments Notice.version by 1"

  - method: POST
    path: "/salt/notices/{id}/appeal-decision"
    description: "Record the appellate outcome, finalize penalty and interest, and push the assessment into the return's balance."
    roles: [TaxManager]
    code: 200
    input: [outcome, "sustained_amount?"]
    output: Notice
    side_effects:
      - "status APPEAL_FILED -> APPEAL_DENIED or APPEAL_SUSTAINED"
      - "penalty_amount, interest_amount and assessment_final_amount computed per calculations.notice_assessment_total"
      - "LINK 1 -> filing.assessment_added_total increases by assessment_final_amount"
      - "LINK 2 (caused by LINK 1) -> filing.balance_due recomputed and payment_status re-derived per calculations.filing_balance_due"
      - "LINK 3 (caused by LINK 2) -> TaxpayerGroup.compliance_posture recomputed per calculations.group_compliance_posture"
      - "increments Notice.version by 1 and StateFiling.version by 1"

  - method: POST
    path: "/salt/notices/{id}/close"
    description: "Close a notice after the response or appeal has run its course."
    roles: [TaxManager]
    code: 200
    input: [closure_reason]
    output: Notice
    side_effects:
      - "status -> CLOSED"
      - "increments Notice.version by 1"

  # ---- VDAAgreement ------------------------------------------------------
  - method: POST
    path: "/salt/registrations/{id}/vda-agreements"
    description: "Draft a voluntary disclosure agreement covering a member entity's past exposure in this state."
    roles: [TaxManager]
    code: 201
    input: [legal_entity_id, anchor_tax_year, lookback_years, exposure_variant, estimated_exposure_tax]
    output: VDAAgreement
    side_effects:
      - "effective_lookback_years, lookback_start_year, lookback_end_year, computed_exposure_tax and waived_penalty_amount computed per calculations.vda_exposure"
      - "the half-open window [lookback_start_year-01-01, (lookback_end_year+1)-01-01) becomes occupied for this legal entity"

  - method: GET
    path: "/salt/vda-agreements/{id}"
    description: "Read one voluntary disclosure agreement."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: []
    output: VDAAgreement
    side_effects: []

  - method: GET
    path: "/salt/vda-agreements"
    description: "List voluntary disclosure agreements filtered by registration, member entity and status (reverse lookup for both VDAAgreement foreign keys)."
    roles: [TaxManager, StateAnalyst, Controller, Auditor]
    code: 200
    input: ["registration_id?", "legal_entity_id?", "status?", "limit?", "offset?"]
    output: VDAAgreement[]
    side_effects: []

  - method: POST
    path: "/salt/vda-agreements/{id}/submit"
    description: "Submit a drafted disclosure to the state."
    roles: [TaxManager]
    code: 200
    input: []
    output: VDAAgreement
    side_effects:
      - "status DRAFT -> SUBMITTED"
      - "increments VDAAgreement.version by 1"

  - method: POST
    path: "/salt/vda-agreements/{id}/execute"
    description: "Execute the disclosure: settle the exposure and convert the state registration to voluntary compliance."
    roles: [TaxManager]
    code: 200
    input: ["negotiated_tax?", "negotiated_interest?"]
    output: VDAAgreement
    side_effects:
      - "status SUBMITTED -> EXECUTED; executed_on_date stamped from the logical clock; shield_expires_at = executed_on_date + VDA_SHIELD_MONTHS months; settlement_total computed"
      - "LegalEntity.vda_shield_until set to shield_expires_at"
      - "LINK 1 -> registration.nexus_status = VOLUNTARY and REGISTRATION_REQUIRED becomes REGISTERED"
      - "LINK 2 (caused by LINK 1) -> TaxpayerGroup.open_registration_obligations decrements"
      - "LINK 3 (caused by LINK 2) -> TaxpayerGroup.compliance_posture recomputed"
      - "increments VDAAgreement.version by 1 and StateRegistration.version by 1"

  - method: POST
    path: "/salt/vda-agreements/{id}/withdraw"
    description: "Withdraw a disclosure before execution, freeing its lookback window."
    roles: [TaxManager]
    code: 200
    input: [reason]
    output: VDAAgreement
    side_effects:
      - "status DRAFT|SUBMITTED -> WITHDRAWN"
      - "the agreement's window no longer blocks new disclosures for the same legal entity"
      - "increments VDAAgreement.version by 1"

# =========================================================================
# 1.6 Error Code Catalog
# =========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of TaxManager / StateAnalyst / Controller / Auditor"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed for the target endpoint in section 1.5"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "approve called with X-User-ID equal to the filing's preparer_user_id"

  - id: ERR_GROUP_NOT_FOUND
    http: 404
    condition: "no TaxpayerGroup with the given id"
  - id: ERR_LEGAL_ENTITY_NOT_FOUND
    http: 404
    condition: "no LegalEntity with the given id, in the path or in legal_entity_id / primary_legal_entity_id"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "no StateRegistration with the given id"
  - id: ERR_ACTIVITY_RECORD_NOT_FOUND
    http: 404
    condition: "no ActivityRecord with the given id"
  - id: ERR_ELECTION_NOT_FOUND
    http: 404
    condition: "no FilingElection with the given id, in the path or in election_id"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "no StateFiling with the given id, in the path or in filing_id"
  - id: ERR_CREDIT_CLAIM_NOT_FOUND
    http: 404
    condition: "no CreditClaim with the given id"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "no EstimatedPayment with the given id"
  - id: ERR_EXTENSION_NOT_FOUND
    http: 404
    condition: "no ExtensionRequest with the given id"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "no Notice with the given id"
  - id: ERR_VDA_NOT_FOUND
    http: 404
    condition: "no VDAAgreement with the given id"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, unknown enum member, or a numeric value outside its declared range"

  - id: ERR_STALE_FILING_VERSION
    http: 412
    condition: "expected_filing_version does not equal the target StateFiling.version"
  - id: ERR_STALE_REGISTRATION_VERSION
    http: 412
    condition: "expected_registration_version does not equal the target StateRegistration.version"

  - id: ERR_INVALID_FILING_STATE
    http: 409
    condition: "the StateFiling's preparation_status (or payment_status for claim-refund) is not a legal source state for the requested transition"
  - id: ERR_INVALID_NOTICE_STATE
    http: 409
    condition: "the Notice's status is not a legal source state for respond / request-info / appeal / appeal-decision / close"
  - id: ERR_INVALID_ELECTION_STATE
    http: 409
    condition: "revoke on a non-ELECTED election or reinstate on a non-REVOKED election"
  - id: ERR_INVALID_VDA_STATE
    http: 409
    condition: "submit on a non-DRAFT agreement, execute on a non-SUBMITTED agreement, or withdraw on an EXECUTED agreement"
  - id: ERR_INVALID_EXTENSION_STATE
    http: 409
    condition: "acknowledge on an ExtensionRequest whose status is no longer REQUESTED"
  - id: ERR_INVALID_PAYMENT_STATE
    http: 409
    condition: "apply on a payment that is APPLIED or REFUNDED, or unapply on a payment that is not APPLIED"
  - id: ERR_REGISTRATION_WITHDRAWN
    http: 409
    condition: "any write against a StateRegistration whose registration_status == WITHDRAWN"

  - id: ERR_NEXUS_NOT_ESTABLISHED
    http: 422
    condition: "compute-factors or lock-factors on a filing whose registration still has nexus_status == NONE"
  - id: ERR_REGISTRATION_NOT_COMPLETE
    http: 422
    condition: "lock-factors on a filing whose registration is not yet REGISTERED"
  - id: ERR_PL86272_PROTECTED
    http: 422
    condition: "lock-factors on a filing whose registration has nexus_status == PROTECTED_PL86272"

  - id: ERR_ENTITY_NOT_IN_GROUP
    http: 422
    condition: "the supplied legal_entity_id / primary_legal_entity_id belongs to a different TaxpayerGroup than the registration"
  - id: ERR_ACTIVITY_YEAR_MISMATCH
    http: 422
    condition: "tax_year earlier than 2000 on an activity record, or anchor_tax_year smaller than lookback_years on a disclosure"
  - id: ERR_PRIMARY_ENTITY_REQUIRED
    http: 422
    condition: "filing_basis == SEPARATE_ENTITY without primary_legal_entity_id"
  - id: ERR_ELECTION_NOT_GOVERNING
    http: 422
    condition: "the supplied election_id belongs to another registration, is not ELECTED, or does not cover the filing's tax_year"
  - id: ERR_ELECTION_BASIS_MISMATCH
    http: 422
    condition: "file called on a return whose filing_basis differs from the governing election's election_basis"
  - id: ERR_FILING_REGISTRATION_MISMATCH
    http: 422
    condition: "apply called with a filing_id whose registration differs from the payment's registration"
  - id: ERR_PAYMENT_TAX_YEAR_MISMATCH
    http: 422
    condition: "apply called with a filing whose tax_year differs from the payment's tax_year"
  - id: ERR_VDA_YEAR_ALREADY_FILED
    http: 422
    condition: "execute on a disclosure whose lookback window contains a tax year already covered by a FILED or AMENDED return on the same registration"

  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "a StateRegistration with the same state_code already exists for the group"
  - id: ERR_NO_ACTIVITY_RECORDS
    http: 422
    condition: "compute-factors with no ActivityRecord for (registration, tax_year) among the filing's included members"
  - id: ERR_FACTOR_DENOMINATOR_ZERO
    http: 422
    condition: "every factor carrying a non-zero base weight has a denominator of exactly 0, so no factor survives exclusion"
  - id: ERR_FACTORS_STALE
    http: 409
    condition: "lock-factors before compute-factors has ever run for the filing, or after a new ActivityRecord for the same (registration, tax_year) was written since the last compute-factors run"
  - id: ERR_ELECTION_PERIOD_OVERLAP
    http: 409
    condition: "the proposed election's closed year interval intersects another election's occupied interval on the same registration"
  - id: ERR_VDA_WINDOW_OVERLAP
    http: 409
    condition: "the proposed disclosure window widened by VDA_COOLING_MONTHS intersects another live disclosure window for the same legal entity"
  - id: ERR_DUPLICATE_INSTALLMENT
    http: 409
    condition: "an EstimatedPayment already exists for the same (registration_id, tax_year, installment_number)"

  - id: ERR_FILING_DEADLINE_PASSED
    http: 422
    condition: "file called after the extended_due_date, or after original_due_date when no extension was granted"
  - id: ERR_EXTENSION_WINDOW_CLOSED
    http: 422
    condition: "an extension is requested after the return's original_due_date"
  - id: ERR_RESPONSE_DEADLINE_PASSED
    http: 422
    condition: "respond called after the notice's response_due_date"
  - id: ERR_APPEAL_DEADLINE_PASSED
    http: 422
    condition: "appeal called after the notice's appeal_due_date"
  - id: ERR_BINDING_PERIOD_ACTIVE
    http: 422
    condition: "revoke with revocation_tax_year inside the binding period in a state that does not permit early revocation"

  - id: ERR_EXTENSION_PREPAYMENT_INSUFFICIENT
    http: 422
    condition: "estimated_tax_paid is below 90 percent of the return's tax_before_credits"
  - id: ERR_REFUND_NOT_AVAILABLE
    http: 422
    condition: "claim-refund on a return with no EstimatedPayment in status APPLIED"
  - id: ERR_VDA_EXPOSURE_MISMATCH
    http: 422
    condition: "LOOKBACK_LIMITED disclosure requesting more than VDA_MAX_LOOKBACK_YEARS years of lookback"

# =========================================================================
# 1.7 RBAC Matrix
# =========================================================================
roles:
  - name: TaxManager
    description: "SALT practice lead. Owns registrations, nexus determinations, elections, the filing calendar, state correspondence outcomes and voluntary disclosures. Holds a hierarchical override on preparation and controller operations."
    identity: opaque
    exclusive_operations:
      - "POST /salt/groups"
      - "POST /salt/groups/{id}/legal-entities"
      - "POST /salt/groups/{id}/registrations"
      - "PATCH /salt/registrations/{id}"
      - "POST /salt/registrations/{id}/evaluate-nexus"
      - "POST /salt/registrations/{id}/complete-registration"
      - "POST /salt/registrations/{id}/withdraw"
      - "POST /salt/registrations/{id}/roll-filing-calendar"
      - "POST /salt/registrations/{id}/elections"
      - "POST /salt/elections/{id}/revoke"
      - "POST /salt/elections/{id}/reinstate"
      - "POST /salt/extensions/{id}/acknowledge"
      - "POST /salt/notices/{id}/request-info"
      - "POST /salt/notices/{id}/appeal-decision"
      - "POST /salt/notices/{id}/close"
      - "POST /salt/registrations/{id}/vda-agreements"
      - "POST /salt/vda-agreements/{id}/submit"
      - "POST /salt/vda-agreements/{id}/execute"
      - "POST /salt/vda-agreements/{id}/withdraw"
      - "POST /salt/_clock/set_current_utc"
    shared_operations:
      - "POST /salt/registrations/{id}/activity-records (with StateAnalyst)"
      - "POST /salt/registrations/{id}/filings, /compute-factors, /lock-factors, /modifications, /credit-claims, /extensions (with StateAnalyst)"
      - "POST /salt/filings/{id}/approve, /reject, /file, /amend, /claim-refund, /notices, /notices/{id}/respond, /notices/{id}/appeal (with Controller)"
      - "POST /salt/registrations/{id}/payments, /payments/{id}/apply, /payments/{id}/unapply (with Controller)"
      - "every GET endpoint"

  - name: StateAnalyst
    description: "Return preparer. Builds activity records, opens returns, computes factors, adds modifications and credit claims, and submits work for review. Cannot approve, file or move money."
    identity: opaque
    exclusive_operations:
      - "POST /salt/filings/{id}/lock-factors is shared, but no other role may prepare without TaxManager override"
    shared_operations:
      - "POST /salt/registrations/{id}/activity-records (with TaxManager)"
      - "POST /salt/registrations/{id}/filings (with TaxManager)"
      - "POST /salt/filings/{id}/compute-factors, /lock-factors, /modifications, /credit-claims, /extensions (with TaxManager)"
      - "POST /salt/filings/{id}/submit-review (with Controller)"
      - "every GET endpoint"

  - name: Controller
    description: "Approver and cash owner. Approves, rejects, files and amends returns, records and applies estimated payments, and handles notices. May also submit a return for review, in which case segregation of duties forbids that same user from approving it."
    identity: opaque
    exclusive_operations:
      - "POST /salt/filings/{id}/claim-refund is shared with TaxManager only"
    shared_operations:
      - "POST /salt/filings/{id}/submit-review (with StateAnalyst)"
      - "POST /salt/filings/{id}/approve, /reject, /file, /amend, /claim-refund (with TaxManager)"
      - "POST /salt/registrations/{id}/payments, /payments/{id}/apply, /payments/{id}/unapply (with TaxManager)"
      - "POST /salt/filings/{id}/notices, /notices/{id}/respond, /notices/{id}/appeal (with TaxManager)"
      - "every GET endpoint"

  - name: Auditor
    description: "Read-only reviewer. May read every resource in the system and may perform no write of any kind."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint (with TaxManager, StateAnalyst and Controller)"
