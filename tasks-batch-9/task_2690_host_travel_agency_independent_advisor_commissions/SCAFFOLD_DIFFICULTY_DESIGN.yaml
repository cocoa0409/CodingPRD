  - rule_id: compensating_invariant
    instances:
      - name: trust_cash_conserved_across_disbursement_and_compensating_deposit
        grounds:
          - calculations.client_trust_balance
          - entities.TrustLedgerEntry
          - entities.Client.fields.trust_balance_cents
          - validations[priority=80]
          - errors[ERR_TRUST_FUNDS_INSUFFICIENT]
        distinguishing_aspect: |
          Conserved quantity: client_trust_cash_cents — the signed sum of the client's
          append-only trust ledger must equal Client.trust_balance_cents after every operation
          and may never go negative. The forward action is the automatic DISBURSEMENT swept by
          booking confirm; the compensating action is an explicit DEPOSIT returning the same
          cents after the booking is cancelled, followed by a REFUND that drains the account.
          The ledger is immutable, so compensation happens by appending an opposing line rather
          than by editing history, and an over-refund is rejected without appending anything.
        test_recipe:
          setup:
            - "One ACTIVE advisor in CA (trust_account_required true), accredited with Meridian Air."
            - "One client whose trust ledger is empty."
            - "The advisor deposits 300000 into the client's trust account."
            - "A CLIENT_TRUST booking of gross 2000000 with deposit_amount_cents 100000 is submitted and confirmed, sweeping 100000 out as a DISBURSEMENT."
            - "The booking is then cancelled, which deliberately does NOT auto-refund."
