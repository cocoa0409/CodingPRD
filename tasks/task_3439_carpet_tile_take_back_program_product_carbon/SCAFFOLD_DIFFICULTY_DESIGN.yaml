  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: feedstock_allocate_deallocate_mass_conserved
        grounds:
          - calculations.batch_recycled_content
          - entities.FeedstockLot.fields.available_kg
          - entities.FeedstockLot.fields.allocated_kg
          - endpoints."POST /carpetloop/feedstock-lots/{lot_id}/deallocate"
          - state_machines.FeedstockLot.QC_PASSED_to_DEPLETED
          - state_machines.FeedstockLot.DEPLETED_to_QC_PASSED
        distinguishing_aspect: "Conserved quantity is feedstock kilograms: available_kg + allocated_kg == quantity_kg (500) after every step of an allocate/allocate/deallocate sequence — including the DEPLETED auto-transition at 0 available and its reversion to QC_PASSED when the compensating deallocate restores 120 kg."
        test_recipe:
          setup:
            - "Collection CIR; batch DL-100 (200 m2) in QUARANTINE (mix still editable; no release needed)."
            - "Lot L-NET: 500 kg RECLAIMED_FISHING_NET @0.50, QC_PASSED."
          setup_api_calls:
            - *k_clock
            - *k_col_grave_none
            - call: "POST /carpetloop/feedstock-lots"
