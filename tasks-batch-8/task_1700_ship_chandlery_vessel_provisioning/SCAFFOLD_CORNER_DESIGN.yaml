              as: ChandlerOpsManager
              captures: { vc73: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vc73}/requisitions"
              payload: { title: "Cold73", lines: [{ catalog_item_id: "${fishC10}", requested_qty: 10, allows_substitution: false }] }
              as: VesselCateringOfficer
