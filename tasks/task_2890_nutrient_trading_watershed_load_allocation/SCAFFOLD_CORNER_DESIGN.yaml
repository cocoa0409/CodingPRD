      - name: tmdl_assessment_starts_in_draft_with_zero_revision_round
        claim_type: initial_state
        grounds:
          - state_machines.TmdlAssessment.initial_state
          - entities.TmdlAssessment.fields.revision_round
          - entities.TmdlAssessment.fields.approved_at
        distinguishing_aspect: "A freshly created TmdlAssessment is DRAFT with revision_round 0, approved_at null, allocation_variant null and all five allocation totals at 0.00 — no allocation has run yet."
        test_recipe:
          setup:
            - "Watershed SCR exists with one mainstem reach."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
