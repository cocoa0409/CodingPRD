              payload: { decision: "APPROVE", approval_note: "ok" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fb_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 5000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Sfax", latest_shipment_date: "2026-09-15", expiry_date: "2026-10-05", expiry_place: "Genoa", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { cb_id: $.data.id }
            - call: "POST /credits/${cb_id}/documentary-requirements"
