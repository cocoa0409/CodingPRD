  # =========================================================================
  # STATE MACHINES - initial states, valid transitions, preconditions,
  # side effects, invalid triggers, terminal lockdown, idempotency and the
  # two cyclic loops (dispute rounds, work-order escalation ladder). The
  # parallel-shape, cascade, ledger-sync, bubble-up, compensation and
  # cross-entity guard claims are the depth probe's territory and appear
  # here only as excluded stubs.
  # =========================================================================
  - section: state_machines
    instances:

      - name: unit_offline_maintenance_round_trip_moves_only_two_counters
        claim_type: valid_transition
        grounds:
          - state_machines.HousingUnit.AVAILABLE_to_OFFLINE_MAINTENANCE
          - state_machines.HousingUnit.OFFLINE_MAINTENANCE_to_AVAILABLE
          - endpoints.POST_/housing-units/{id}/status
          - calculations.unit_inventory_conservation
        distinguishing_aspect: "The operator round trip AVAILABLE -> OFFLINE_MAINTENANCE -> AVAILABLE succeeds from both ends, bumping HousingUnit.version once per hop, and each hop moves exactly the two Installation counters named in the transition while the five-counter sum stays at the inventory total of 2."
        test_recipe:
          setup:
            - "One installation with the declared defaults and two units A-101 and A-102, both AVAILABLE."
            - "The logical clock stands at 2026-08-01T00:00:00Z and no lease, application or hazard case exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-102", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u2_id: "$.data.id" }
          trigger:
            - call: "POST /housing-units/${u1_id}/status"
              payload: { status: "OFFLINE_MAINTENANCE" }
              as: PropertyManager
              captures: { s1_status: "$.data.status", s1_ver: "$.data.version" }
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PropertyManager
              captures: { c1_avail: "$.data.available_unit_count", c1_off: "$.data.offline_unit_count", c1_assigned: "$.data.assigned_unit_count", c1_occ: "$.data.occupied_unit_count", c1_haz: "$.data.hazard_hold_unit_count", c1_total: "$.data.total_unit_count" }
            - call: "POST /housing-units/${u1_id}/status"
              payload: { status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { s2_status: "$.data.status", s2_ver: "$.data.version", s2_reason: "$.data.hazard_hold_reason" }
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PropertyManager
              captures: { c2_avail: "$.data.available_unit_count", c2_off: "$.data.offline_unit_count" }
          assert:
            - "the first status call returns HTTP 200 with ${s1_status} == OFFLINE_MAINTENANCE and ${s1_ver} == 2"
            - "${c1_avail} == 1 and ${c1_off} == 1 - only the two counters named in the transition moved"
            - "${c1_assigned} == 0 and ${c1_occ} == 0 and ${c1_haz} == 0 and ${c1_total} == 2"
            - "${c1_avail} + ${c1_off} + ${c1_assigned} + ${c1_occ} + ${c1_haz} == 2, i.e. the five-counter sum still equals total_unit_count"
            - "the second status call returns HTTP 200 with ${s2_status} == AVAILABLE, ${s2_ver} == 3 and ${s2_reason} == null"
            - "${c2_avail} == 2 and ${c2_off} == 0"
            - "HousingUnit A-102 is untouched: its status is still AVAILABLE and its version is still 1"

