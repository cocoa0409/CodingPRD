            - call: "POST /eas/solicitations/${sol1_id}/preferences"
              payload: { expected_solicitation_version: "${sol1_v}", rankings: [{ proposal_id: "${p1_sub_id}", rank: 1 }, { proposal_id: "${p1_draft_id}", rank: 2 }], rationale: "includes a draft proposal" }
              as: CommunityRepresentative
              as_user_id: "${comm1_id}"
              captures: { draft_proposal_error_id: $.data.error_id }
            - call: "POST /eas/solicitations/${sol1_id}/preferences"
              payload: { expected_solicitation_version: "${sol1_v}", rankings: [{ proposal_id: "00000000-0000-4000-8000-000000000005", rank: 1 }], rationale: "names a proposal that does not exist" }
              as: CommunityRepresentative
              as_user_id: "${comm1_id}"
              captures: { unknown_proposal_error_id: $.data.error_id }
            - call: "POST /eas/solicitations/${sol1_id}/preferences"
              payload: { expected_solicitation_version: "${sol1_v}", rankings: [{ proposal_id: "${p1_sub_id}", rank: 1 }], rationale: "the one submitted proposal of this solicitation" }
              as: CommunityRepresentative
              as_user_id: "${comm1_id}"
