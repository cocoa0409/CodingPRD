              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "SOD_PACK", price_tier: "T1", list_price_minor: 900, line_items: [{ sku: "SOD_COINS", base_price_minor: 900, declared_value_minor: 1200, granted_currency_code: "SOFT_COIN", granted_amount_minor: 1200 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
          trigger:
            - call: "POST /offers/${offer_id}/review"
              payload: { decision: "APPROVE", note: "Self approval attempt" }
              as: ComplianceOfficer
              as_user_id: "u_designer_1"
              captures: { err: $.data.error_id }
            - call: "POST /offers/${offer_id}/review"
              payload: { decision: "APPROVE", note: "Independent review" }
