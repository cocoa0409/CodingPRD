# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3135_donated_medicine_allocation_safety_net_providers
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: manufacturer_donor_create_returns_all_declared_fields_and_active_status
        claim_type: Creation
        grounds:
          - entities.ManufacturerDonor
          - endpoints.POST_/medicine-relief/donors
        distinguishing_aspect: "POST /donors with all required fields returns 201 with status ACTIVE, version 1, and server-generated id / created_at / updated_at; the client cannot supply status."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "Meridian Pharma", country_code: "US", tax_id: "12-3456789", dea_registration_no: "BM1234567" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "ManufacturerDonor.${donor_id}.legal_name == \"Meridian Pharma\""
            - "ManufacturerDonor.${donor_id}.status == ACTIVE"
            - "ManufacturerDonor.${donor_id}.version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: product_lot_get_returns_stored_record_with_computed_fields
        claim_type: Retrieval
        grounds:
          - entities.ProductLot
          - endpoints.GET_/medicine-relief/lots/{lot_id}
        distinguishing_aspect: "A lot intake round-trips all input fields and surfaces the computed quantity_available / quantity_quarantined / requires_cold_chain / is_controlled flags derived from product_class."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Donor D ACTIVE."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "D", country_code: "US", tax_id: "T" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "N1", product_name: "Insulin Glargine", product_class: "COLD_CHAIN", dosage_form: "VIAL", unit_of_measure: "VIAL", quantity_received: 200, expiration_date: "2027-03-31T00:00:00Z", storage_temp_min_c: 2, storage_temp_max_c: 8, restricted_use_conditions: ["hospital-only"], unit_acquisition_value_usd: 12.50, unit_wholesale_value_usd: 18.00 }
              as: QAPharmacist
              captures: { lot_id: $.data.id }
          trigger:
            - call: "GET /medicine-relief/lots/${lot_id}"
              payload: {}
              as: QAPharmacist
          assert:
            - "ProductLot.${lot_id}.lot_posture == QUARANTINED"
            - "ProductLot.${lot_id}.quantity_received == 200"
            - "ProductLot.${lot_id}.quantity_quarantined == 200"
            - "ProductLot.${lot_id}.quantity_available == 0"
            - "ProductLot.${lot_id}.requires_cold_chain == true"
            - "ProductLot.${lot_id}.is_controlled == false"
            - "ProductLot.${lot_id}.restricted_use_conditions == [\"hospital-only\"]"

      - name: sites_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/medicine-relief/sites
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three sites in mixed qualification statuses, limit=2 returns 2 rows with total_count 3 and has_more true; filtering by qualification_status returns only matching rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Three sites: S1 PENDING_REVIEW (US), S2 QUALIFIED (US, with verified license), S3 PENDING_REVIEW (HT)."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "S1", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { s1: $.data.id }
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "S2", site_type: "FQHC", country_code: "US", cold_storage_capacity_l: 200, has_dea_registration: false, monthly_patient_volume: 500, underserved_index: 0.7 }
              as: ComplianceOfficer
              captures: { s2: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${s2}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-S2", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_s2: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_s2}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${s2}/qualify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "S3", site_type: "RURAL_HEALTH_CENTER", country_code: "HT", cold_storage_capacity_l: 0, has_dea_registration: false, monthly_patient_volume: 50, underserved_index: 0.9 }
              as: ComplianceOfficer
              captures: { s3: $.data.id }
          trigger:
            - call: "GET /medicine-relief/sites"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /medicine-relief/sites?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /medicine-relief/sites?qualification_status=PENDING_REVIEW returns 2 rows"
            - "GET /medicine-relief/sites?qualification_status=QUALIFIED returns 1 row (S2)"
            - "GET /medicine-relief/sites?country_code=HT returns 1 row (S3)"

      - name: license_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/medicine-relief/licenses/{license_id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated license id returns 404 ERR_NOT_FOUND, not 400 or 500."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /medicine-relief/licenses/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id == ERR_NOT_FOUND"

      - name: allocation_request_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/medicine-relief/allocation-requests
          - errors.ERR_INVALID_REQUEST
          - validations.priority_22_business_referential
        distinguishing_aspect: "POST without quantity_requested (a required field) returns 400 ERR_INVALID_REQUEST before any state or business check fires."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Site S exists."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "S", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /medicine-relief/allocation-requests"
              payload: { site_id: "${site_id}", ndc_code: "N1", justification_text: "r" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: recipient_site_active_license_count_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.RecipientSite.fields.active_license_count
        distinguishing_aspect: "A newly created site has active_license_count == 0 (computed default), and the value is server-supplied regardless of any client attempt to provide it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "S", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
          assert:
            - "RecipientSite.${site_id}.active_license_count == 0"
            - "RecipientSite.${site_id}.qualified_at is null"

      - name: lot_quantity_available_computed_after_release_and_partial_allocation
        claim_type: Computed Fields
        grounds:
          - entities.ProductLot.fields.quantity_available
          - calculations.lot_available_quantity
        distinguishing_aspect: "After release, quantity_available equals quantity_received (100). After a 30-unit decision is finalized, quantity_available drops to 70 and quantity_committed rises to 30. Any client-supplied value for these fields is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Donor D, lot L quantity_received=100, RELEASABLE."
            - "Site S QUALIFIED. UNDER_REVIEW request R for 30 units. DRAFT decision with one line of 30 against L."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "D", country_code: "US", tax_id: "T" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "N1", product_name: "P", product_class: "STANDARD", dosage_form: "TABLET", unit_of_measure: "UNIT", quantity_received: 100, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 1.00, unit_wholesale_value_usd: 1.50 }
              as: QAPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /medicine-relief/lots/${lot_id}/release"
              payload: {}
              as: QAPharmacist
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "S", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_id}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-1", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${site_id}/qualify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/allocation-requests"
              payload: { site_id: "${site_id}", ndc_code: "N1", quantity_requested: 30, justification_text: "r" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { req_id: $.data.id }
            - call: "POST /medicine-relief/allocation-requests/${req_id}/begin-review"
              payload: {}
              as: AllocationOfficer
            - call: "GET /medicine-relief/allocation-requests/${req_id}"
              payload: {}
              as: AllocationOfficer
              captures: { req_v: $.data.version }
            - call: "POST /medicine-relief/allocation-decisions"
              payload: { request_id: "${req_id}", rationale: "r", lines: [{ lot_id: "${lot_id}", quantity: 30 }] }
              as: AllocationOfficer
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /medicine-relief/allocation-decisions/${dec_id}/finalize"
              payload: { expected_request_version: "${req_v}" }
              as: AllocationOfficer
          assert:
            - "ProductLot.${lot_id}.quantity_committed == 30"
            - "ProductLot.${lot_id}.quantity_available == 70"
            - "ProductLot.${lot_id}.quantity_shipped == 0"
            - "ProductLot.${lot_id}.quantity_expired == 0"

      - name: common_fields_server_generated_id_and_timestamps_ignore_client_input
        claim_type: System Fields
        grounds:
          - entities.RecipientSite
        distinguishing_aspect: "Client cannot supply id, created_at, updated_at, or version on create; even if attempted, the server overrides them."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "S", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
          assert:
            - "RecipientSite.${site_id}.id is a server-minted UUID (no client control)"
            - "RecipientSite.${site_id}.version == 1"
            - "RecipientSite.${site_id}.created_at == 2026-09-01T00:00:00.000Z (logical clock)"

      - name: product_lot_invalid_product_class_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ProductLot.fields.product_class
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "An out-of-enum product_class value (e.g. BIOHAZARD) is rejected at intake with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Donor D."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "D", country_code: "US", tax_id: "T" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "N1", product_name: "P", product_class: "BIOHAZARD", dosage_form: "TABLET", unit_of_measure: "UNIT", quantity_received: 100, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 1.00, unit_wholesale_value_usd: 1.50 }
              as: QAPharmacist
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: license_site_fk_reference_must_resolve
        claim_type: Parent Relationships
        grounds:
          - entities.License.fields.site_id
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Creating a License with a non-existent site_id returns 404 ERR_NOT_FOUND — the FK must resolve."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "00000000-0000-0000-0000-000000000000", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-X", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: lot_release_from_releasable_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ProductLot.QUARANTINED_to_RELEASABLE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Calling release on an already-RELEASABLE lot is rejected; the transition is only valid from QUARANTINED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Donor D, lot L already RELEASABLE."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "D", country_code: "US", tax_id: "T" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "N1", product_name: "P", product_class: "STANDARD", dosage_form: "TABLET", unit_of_measure: "UNIT", quantity_received: 100, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 1.00, unit_wholesale_value_usd: 1.50 }
              as: QAPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /medicine-relief/lots/${lot_id}/release"
              payload: {}
              as: QAPharmacist
          trigger:
            - call: "POST /medicine-relief/lots/${lot_id}/release"
              payload: {}
              as: QAPharmacist
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE"
            - "ProductLot.${lot_id}.lot_posture remains RELEASABLE"

      - name: site_revoked_is_terminal_no_reinstate
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RecipientSite
        distinguishing_aspect: "REVOKED is a terminal state; a subsequent reinstate attempt is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Site S QUALIFIED."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "S", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_id}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-1", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${site_id}/qualify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${site_id}/revoke"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /medicine-relief/sites/${site_id}/reinstate"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE"
            - "RecipientSite.${site_id}.qualification_status remains REVOKED"

      - name: allocation_request_initial_state_is_submitted
        claim_type: initial_state
        grounds:
          - state_machines.AllocationRequest
        distinguishing_aspect: "A newly created AllocationRequest always starts in SUBMITTED status with quantity_approved == 0 and need_score null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Site S QUALIFIED."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "S", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_id}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-1", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${site_id}/qualify"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /medicine-relief/allocation-requests"
              payload: { site_id: "${site_id}", ndc_code: "N1", quantity_requested: 10, justification_text: "r" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { req_id: $.data.id }
          assert:
            - "AllocationRequest.${req_id}.status == SUBMITTED"
            - "AllocationRequest.${req_id}.quantity_approved == 0"
            - "AllocationRequest.${req_id}.need_score is null"

      - name: shipment_delivery_failure_marks_lines_forfeited_and_moves_quantity_to_expired
        claim_type: side_effect_execution
        grounds:
          - state_machines.Shipment.DISPATCHED_to_DELIVERY_FAILED
          - state_machines.AllocationLine.SHIPPED_to_DELIVERED
          - state_machines.AllocationLine.RESERVED_to_FORFEITED
        distinguishing_aspect: "Marking a DISPATCHED shipment failed transitions SHIPPED lines to FORFEITED, decrements lot.quantity_shipped, and increments lot.quantity_expired (product spoiled in transit)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Lot L (100 units), Site S QUALIFIED, decision D finalized (10 units), shipment SH DISPATCHED."
