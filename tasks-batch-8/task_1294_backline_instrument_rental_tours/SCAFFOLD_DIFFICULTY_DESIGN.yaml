              as: TourManager
              captures: { ovrl2: $.data.id }
          trigger:
            - call: "POST /backline/rider-lines/${ovrl2}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-15T00:00:00Z", end_date: "2026-08-20T00:00:00Z" }
              as: LogisticsCoordinator
