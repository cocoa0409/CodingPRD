            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: MeltSupervisor, captures: { heat2_id: $.data.id, heat2_v: $.data.version } }
          trigger:
            - { call: "POST /api/heats/${heat2_id}/charges", payload: { expected_heat_version: "${heat2_v}", additions: [ { source: "RETURN_LOT", return_lot_id: "${lot_id}", weight_kg: 100.0 } ] }, as: MeltSupervisor }
            - { call: "GET /api/return-lots/${lot_id}", as: MeltSupervisor, captures: { lot_mid: $.data } }
            - { call: "POST /api/scrap-records/${scrap_id}/weigh", payload: { actual_weight_kg: 190.0 }, as: QualityInspector }
            - { call: "GET /api/return-lots/${lot_id}", as: MeltSupervisor, captures: { lot_final: $.data } }
          assert:
            - "After consume: remaining_weight_kg == 570.0, consumed_weight_kg == 100.0, scrap_credited_kg == 170.0"
            - "After weigh (actual 190.0): scrap_credited_kg == 190.0, remaining_weight_kg == 590.0"
            - "INVARIANT: collected 500.0 + scrap_credited 190.0 == consumed 100.0 + remaining 590.0 + downgraded 0.0 (690.0 == 690.0, zero drift across the forward/consume and compensating/credit pair)"

      - name: sand_mass_conserved_across_commit_reclaim_discard
        grounds:
          - calculations.sand_mass_invariant
          - entities.SandBatch.fields.current_weight_kg
          - state_machines.SandBatch.IN_SERVICE_to_RECLAIMING
        distinguishing_aspect: |
          Different conserved quantity than alloy mass: SAND MASS on a SandBatch. The forward action
          (mold creation commits 120 kg) and its compensating chain (shakeout -> reclaim 110/10 ->
          passing test) keep virgin == current + committed + spent + pending + discarded exactly:
          1000 == 990.0 + 0 + 0 + 0 + 10.0 at the end.
        test_recipe:
          setup:
            - "Batch IN_SERVICE (1000 kg virgin); mold (sand 120) poured, cooled, shaken out (spent 120)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "Acme", credit_limit_cents: 100000000 }, as: FoundryAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "MOLDING_LINE", label: "Line-A", daily_minute_capacity: 480, cleanup_buffer_minutes: 30 }, as: FoundryAdmin, captures: { line_id: $.data.id } }
            - { call: "POST /api/sand-batches", payload: { foundry_id: "${f_id}", virgin_weight_kg: 1000, max_loi_pct: 3.0 }, as: LineOperator, captures: { sb_id: $.data.id } }
            - { call: "POST /api/sand-batches/${sb_id}/test", payload: { loi_pct: 2.5 }, as: QualityInspector }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0, 50.0, 25.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
            - { call: "POST /api/patterns/${pat_id}/qualify", payload: { measured_dimensions_mm: [107.1, 56.6, 31.3] }, as: PatternMaker }
            - { call: "POST /api/orders", payload: { foundry_id: "${f_id}", customer_id: "${cust_id}", pattern_id: "${pat_id}", quantity: 1, unit_price_cents: 100000, machining_allowance_pct: 0.15, warranty_months: 12, warranty_budget_cents: 500000 }, as: FoundryAdmin, captures: { ord_id: $.data.id } }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: MeltSupervisor, captures: { heat_id: $.data.id, heat_v: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v}", additions: [ { source: "VIRGIN", weight_kg: 1000, composition: { C: 3.40 } } ] }, as: MeltSupervisor, captures: { heat_v2: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 3.40 } }, as: Spectrographer, as_user_id: "spectro_1" }
            - { call: "POST /api/heats/${heat_id}/tap", payload: { tap_weight_kg: 1000 }, as: MeltSupervisor }
            - { call: "POST /api/molds", payload: { pattern_id: "${pat_id}", sand_batch_id: "${sb_id}", order_id: "${ord_id}", sand_weight_kg: 120, metal_weight_kg: 200, cooling_hours: 2 }, as: LineOperator, captures: { mold_id: $.data.id } }
            - { call: "POST /api/pour-slots", payload: { molding_line_id: "${line_id}", heat_id: "${heat_id}", mold_ids: ["${mold_id}"], start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: LineOperator, captures: { slot_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:30:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/pour-slots/${slot_id}/complete", payload: {}, as: LineOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T13:00:00Z" }, as: FoundryAdmin }
            - { call: "GET /api/foundries/${f_id}", as: FoundryAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/foundries/${f_id}/run-ops", payload: { expected_foundry_version: "${f_v}" }, as: FoundryAdmin }
            - { call: "POST /api/molds/${mold_id}/shakeout", payload: {}, as: LineOperator, captures: { mold_after: $.data.status } }
          trigger:
            - { call: "GET /api/sand-batches/${sb_id}", as: LineOperator, captures: { b_mid: $.data } }
            - { call: "POST /api/sand-batches/${sb_id}/reclaim", payload: { reclaimed_weight_kg: 110.0, loss_weight_kg: 10.0 }, as: LineOperator }
            - { call: "POST /api/sand-batches/${sb_id}/test", payload: { loi_pct: 2.0 }, as: QualityInspector, captures: { b_final: $.data } }
          assert:
            - "After shakeout: current 880.0, committed 0.0, spent 120.0 (forward action pair complete)"
            - "After reclaim: status RECLAIMING, spent 0.0, pending_reclaim 110.0, discarded 10.0 (110.0 + 10.0 == 120.0 enforced)"
            - "After passing test: status IN_SERVICE, current_weight_kg == 990.0, pending_reclaim_kg == 0.0"
            - "INVARIANT: virgin 1000 == current 990.0 + committed 0 + spent 0 + pending 0 + discarded 10.0 (zero drift)"
