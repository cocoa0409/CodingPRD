          - state_machines.VendorContract.transitions.SUSPENDED_to_ACTIVE
          - state_machines.MaintenanceWorkOrder.transitions.ON_HOLD_to_IN_PROGRESS.preconditions
          - calculations.encumbrance_conservation_invariant
        distinguishing_aspect: "Suspension pushes the SCHEDULED order to ON_HOLD with hold_reason CONTRACT_SUSPENDED while KEEPING its 400000-cent encumbrance, and reinstatement is not a mirror image: the order stays ON_HOLD (no auto-resume) and must be started explicitly, so committed_cents reads 400000 at every step of the cycle."
