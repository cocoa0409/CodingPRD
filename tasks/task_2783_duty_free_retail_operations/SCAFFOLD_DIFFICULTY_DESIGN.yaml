      - name: zero_sales_period_close_floors_rent_at_minimum_guarantee_with_single_elapsed_day
        grounds:
          - calculations.concession_rent_accrual
          - calculations.net_rent_settlement
          - state_machines.ConcessionAgreement.ACTIVE_to_CLOSED
          - validations[priority=72]
        distinguishing_aspect: |
          Endpoint POST /concession-agreements/{agreement_id}/close-period at the empty-input
          boundary: with gross_sales_cents 0 the percentage rent is 0, so final_rent_cents pins to
          the full guarantee 10000 on basis MINIMUM_GUARANTEE and the lowest marketing tier of 100
          bps yields credit 100 / net 9900; the projection at period_start proves elapsed_days is
          clamped up to 1, giving a prorated guarantee of 323 rather than 0.
        test_recipe:
          setup:
            - "Terminal SIN in SG"
            - "ConcessionAgreement 2026-08 over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) at 1200 bps with a 10000-cent minimum guarantee, ACTIVE"
            - "No sales at all against the agreement"
            - "Logical clock at the startup default 2026-08-01T00:00:00Z for the projection, then advanced to 2026-09-01T00:00:00Z for the close"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
              captures: { ag_aug: $.data.id }
            - call: "POST /concession-agreements/${ag_aug}/activate"
              payload: {}
              as: TerminalAdmin
          trigger:
            - call: "GET /concession-agreements/${ag_aug}/rent-projection"
              as: TerminalAdmin
            - call: "POST /concession-agreements/${ag_aug}/close-period"
              payload: {}
              as: TerminalAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: TerminalAdmin
            - call: "POST /concession-agreements/${ag_aug}/close-period"
              payload: {}
              as: TerminalAdmin
          assert:
            - "rent-projection response data.elapsed_days == 1"
            - "rent-projection response data.period_days == 31"
            - "rent-projection response data.percentage_rent_cents == 0"
            - "rent-projection response data.prorated_minimum_guarantee_cents == 323"
            - "rent-projection response data.provisional_rent_cents == 323"
            - "rent-projection response data.rent_basis == MINIMUM_GUARANTEE"
            - "the first close-period call returns HTTP 409 with error_id ERR_PERIOD_NOT_ENDED"
            - "ConcessionAgreement.${ag_aug}.status == ACTIVE after the first close-period call"
            - "the second close-period call returns HTTP 200"
            - "ConcessionAgreement.${ag_aug}.gross_sales_cents == 0"
            - "ConcessionAgreement.${ag_aug}.percentage_rent_cents == 0"
            - "ConcessionAgreement.${ag_aug}.final_rent_cents == 10000"
            - "ConcessionAgreement.${ag_aug}.rent_basis == MINIMUM_GUARANTEE"
            - "ConcessionAgreement.${ag_aug}.marketing_credit_cents == 100"
            - "ConcessionAgreement.${ag_aug}.net_rent_cents == 9900"

