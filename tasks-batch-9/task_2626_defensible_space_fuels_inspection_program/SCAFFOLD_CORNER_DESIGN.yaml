      - name: third_access_denial_after_abandoned_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ACCESS_DENIAL_LIMIT_REACHED]
          - state_machines.Inspection.NOTICED_to_ABANDONED
          - entities.Inspection.fields.access_denial_count
        distinguishing_aspect: |
          access_denial_count is NOT reset by the intervening reschedule, so the second denial lands on
          ABANDONED (a terminal state) and a third denial is refused 409
          ERR_ACCESS_DENIAL_LIMIT_REACHED rather than ERR_INVALID_STATE, with the count frozen at
          MAX_ACCESS_DENIALS 2 and no additional ViolationNotice created.
        test_recipe:
          setup:
            - "Active cycle; one HIGH-risk parcel; clock 2026-08-01T00:00:00Z; an inspection noticed, denied, rescheduled to 2026-09-10, re-noticed and denied a second time into ABANDONED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
