      - name: invitation_lifecycle_time_gates
        claim_type: precondition_enforcement
        grounds: [state_machines.ReviewerInvitation.SOLICITED_to_EXPIRED, state_machines.ReviewerInvitation.ACCEPTED_to_LETTER_RECEIVED, "errors[ERR_INVITATION_EXPIRED]", "errors[ERR_REVIEW_WINDOW_CLOSED]", "errors[ERR_INVALID_INVITATION_STATE]"]
        distinguishing_aspect: "Lazy expiry is clock-driven and state-changing: accept after response_deadline fails with ERR_INVITATION_EXPIRED and flips the invitation to EXPIRED (a second accept then fails with ERR_INVALID_INVITATION_STATE); an on-time accept followed by a letter after review_window_end fails with ERR_REVIEW_WINDOW_CLOSED."
