        distinguishing_aspect: "Sale-lot creation against an UNWEANED crop fails ERR_CROP_NOT_WEANED before any head/claim checks."
        test_recipe:
          setup: ["Ranch R; season S in GESTATION (1 bull); crop C 40/60 UNWEANED"]
          setup_api_calls:
