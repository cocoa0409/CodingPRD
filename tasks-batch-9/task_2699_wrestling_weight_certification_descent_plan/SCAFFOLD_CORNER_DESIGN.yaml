              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 121.0, body_fat_pct: 13.1, urine_specific_gravity: 1.019 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_c: $.data.id }
            - call: "POST /assessments/${assess_c}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { c_lean: $.data.lean_body_weight_lbs, c_min: $.data.minimum_certified_weight_lbs, c_class: $.data.min_weight_class_lbs }
            - call: "GET /wrestlers/${wrestler_c}"
