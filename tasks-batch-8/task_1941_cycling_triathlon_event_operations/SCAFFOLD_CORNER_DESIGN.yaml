  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_default_is_fixed_launch_time
        claim_type: conditional_action
        grounds:
          - endpoints["POST /_clock/set_current_utc"]
          - calculations.refund_estimate
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z: a withdraw then computes days-until-event from that fixed instant (75 days for a 2026-10-15 start -> 75% tier), never from wall-clock."
        test_recipe:
          setup: ["event start 2026-10-15T08:00:00Z; athlete PAID 20000; no clock call ever made"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { ath: $.data.id }
            - call: "POST /events/${ev}/registrations"
              payload: { athlete_id: "${ath}", division: "AGE_GROUP", entry_fee_cents: 20000 }
