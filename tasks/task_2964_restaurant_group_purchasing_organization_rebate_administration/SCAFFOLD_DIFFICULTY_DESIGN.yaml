            - "hop 2 — RebateAccrual.${a1_id}.status == REVERSED and reversal_reason == DISPUTE_UPHELD"
            - "hop 3 — Member.${m1_id}.accrued_member_share_cents == 4365, attributed_gpo_retention_cents == 1455, attributed_admin_fee_cents == 180 (each decremented by that accrual's exact component, not recomputed)"
