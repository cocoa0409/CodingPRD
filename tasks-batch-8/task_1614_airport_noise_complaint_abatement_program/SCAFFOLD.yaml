# =============================================================================
# Task 1614 — Airport Noise Complaint & Abatement Program
# Scaffold seed tables (§1.0–§1.7). Difficulty target: beyond Expert.
# =============================================================================

scenario: |
  Airport Noise Complaint & Abatement Program (airport noise office): complaint
  intake & flight-track correlation, noise monitor data & event classification,
  voluntary curfew/procedure compliance reporting, repeat-complainant handling &
  community outreach, operator notification & follow-up, part 150 study &
  land-use compatibility, sound insulation program eligibility, quarterly
  reporting to board

domain_name: airport-noise-abatement
api_prefix: /noise-program

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Complainant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Complainant full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone", constraints: "optional" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: zone_code, type: string, source: input, description: "Community zone code used for correlation distance penalty and annoyance index" }
      - { name: outreach_opt_in, type: boolean, source: input, default: true, description: "Whether complainant accepts outreach contact" }
      - { name: standing, type: enum, source: system, description: "GOOD_STANDING | REPEAT | RESTRICTED; auto-derived from complaints_90d thresholds" }
      - { name: complaints_90d, type: integer, source: computed, description: "Count of complainant's NoiseComplaints with created_at in [max(now-90d, repeat_baseline_at), now] and status != WITHDRAWN" }
      - { name: filed_total, type: integer, source: computed, description: "Lifetime count of NoiseComplaints ever created for this complainant (any status)" }
      - { name: open_count, type: integer, source: computed, description: "Complaints in RECEIVED|UNDER_REVIEW|AWAITING_COMPLAINANT|CORRELATED|REOPENED" }
      - { name: closed_count, type: integer, source: computed, description: "Complaints in CLOSED_SUBSTANTIATED|CLOSED_UNSUBSTANTIATED" }
      - { name: withdrawn_count, type: integer, source: computed, description: "Complaints in WITHDRAWN" }
      - { name: substantiated_count, type: integer, source: computed, description: "Complaints currently in CLOSED_SUBSTANTIATED" }
      - { name: repeat_baseline_at, type: datetime, source: system, description: "Set to now when an OutreachCase is RESOLVED; complaints filed before this instant are excluded from complaints_90d", constraints: "nullable" }
      - { name: low_priority_flag, type: boolean, source: computed, default: false, description: "true while standing == RESTRICTED; their complaints never auto-notify operators" }

  - name: NoiseComplaint
    parent: null
    common_fields: true
    fields:
      - { name: complainant_id, type: string, source: input, description: "FK -> Complainant.id; filing complainant" }
      - { name: occurred_at, type: datetime, source: input, description: "When the disturbance occurred (UTC)" }
      - { name: channel, type: enum, source: input, description: "WEB | PHONE | APP | EMAIL" }
      - { name: disturbance_type, type: enum, source: input, description: "LOUD_EVENT | SLEEP_DISTURBANCE | LOW_FLYING | GROUND_RUNUP | VIBRATION | OTHER" }
      - { name: narrative, type: string, source: input, description: "Free-text description", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_REVIEW | AWAITING_COMPLAINANT | CORRELATED | CLOSED_SUBSTANTIATED | CLOSED_UNSUBSTANTIATED | REOPENED | WITHDRAWN" }
      - { name: correlated_flight_id, type: string, source: system, description: "FK -> FlightOperation.id; set by correlate", constraints: "nullable" }
      - { name: correlated_event_id, type: string, source: system, description: "FK -> NoiseEvent.id; set by correlate", constraints: "nullable" }
      - { name: correlation_confidence, type: number, source: computed, description: "0.0-100.0, 1 decimal, from correlation_confidence_score; 0.0 when uncorrelated" }
      - { name: correlation_variant_used, type: enum, source: system, description: "STRICT | RELAXED | NONE" }
      - { name: substantiation_eligible, type: boolean, source: computed, default: false, description: "true when correlation_confidence >= 60.0" }
      - { name: closure_outcome, type: enum, source: system, description: "SUBSTANTIATED | UNSUBSTANTIATED", constraints: "nullable" }
      - { name: closed_at, type: datetime, source: system, description: "When closed; cleared on reopen", constraints: "nullable" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times reopened (max 3)" }
      - { name: info_request_note, type: string, source: system, description: "Note sent when info requested", constraints: "nullable" }

  - name: FlightOperation
    parent: null
    common_fields: true
    fields:
      - { name: flight_number, type: string, source: input, description: "Carrier flight number" }
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; operating carrier" }
      - { name: aircraft_type, type: string, source: input, description: "Aircraft type code, e.g. B738" }
      - { name: engine_class, type: enum, source: input, description: "STAGE_3 | STAGE_4 | STAGE_5" }
      - { name: operation_type, type: enum, source: input, description: "ARRIVAL | DEPARTURE | RUNUP" }
      - { name: runway_code, type: string, source: input, description: "Runway designator, e.g. 09L" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled time UTC" }
      - { name: actual_at, type: datetime, source: input, description: "Actual time UTC, recorded via PATCH when OPERATED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPERATED | CANCELLED | DIVERTED" }
      - { name: exemption_code, type: enum, source: input, description: "NONE | EMERGENCY | WEATHER_DIVERT | ATC_DELAY; recorded via PATCH", default: "NONE" }
      - { name: zone_code, type: string, source: input, description: "Community zone overflown (approach/departure corridor)" }
      - { name: linked_complaint_count, type: integer, source: computed, description: "Complaints currently correlated to this flight (status != WITHDRAWN)" }
      - { name: linked_event_count, type: integer, source: computed, description: "NoiseEvents classified CLASSIFIED_AIRCRAFT/VERIFIED linked to this flight" }
      - { name: curfew_movement, type: boolean, source: computed, default: false, description: "Computed once when status becomes OPERATED: actual_at falls in any matching ACTIVE CurfewRule window" }
      - { name: curfew_violation, type: boolean, source: computed, default: false, description: "Computed once when OPERATED: curfew_movement && not in grace band && exemption_code == NONE; immutable afterwards" }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Operator legal name" }
      - { name: iata_code, type: string, source: input, description: "2-3 letter IATA code", constraints: "unique across all operators" }
      - { name: contact_email, type: string, source: input, description: "Noise office contact email" }
      - { name: compliance_standing, type: enum, source: system, description: "GOOD | WATCH | PROBATION; derived from compliance score and escalations" }
      - { name: curfew_grace_minutes, type: integer, source: system, default: 15, description: "Grace band applied to curfew windows; revoked to 0 when standing hits PROBATION via escalation" }
      - { name: compliance_score_latest, type: number, source: computed, description: "Most recently computed curfew_compliance_score, 1 decimal", constraints: "nullable" }
      - { name: on_time_responses_90d, type: integer, source: computed, description: "Notifications closed with closed_at <= due_at in trailing 90 days" }
      - { name: notifications_sent_total, type: integer, source: computed, description: "Lifetime notifications sent (SENT or beyond, excluding AUTO_CLOSED from DRAFT)" }
      - { name: notifications_open, type: integer, source: computed, description: "Notifications in SENT|ACKNOWLEDGED|RESPONSE_RECEIVED|ESCALATED" }
      - { name: notifications_closed, type: integer, source: computed, description: "Notifications in CLOSED|AUTO_CLOSED" }
      - { name: notifications_draft, type: integer, source: computed, description: "Notifications in DRAFT; invariant: notifications_draft + notifications_open + notifications_closed == total notifications ever created for this operator" }

  - name: NoiseMonitor
    parent: null
    common_fields: true
    fields:
      - { name: station_code, type: string, source: input, description: "Unique station identifier", constraints: "unique across all monitors" }
      - { name: zone_code, type: string, source: input, description: "Community zone the monitor covers" }
      - { name: latitude, type: number, source: input, description: "Station latitude" }
      - { name: longitude, type: number, source: input, description: "Station longitude" }
      - { name: commissioned_at, type: datetime, source: input, description: "Commissioning timestamp" }
      - { name: status, type: enum, source: system, description: "ONLINE | DECOMMISSIONED" }
      - { name: uptime_pct_30d, type: number, source: computed, description: "round_half_up((43200 - outage_minutes_overlapping_[now-30d,now))/43200*100, 1); half-open overlap" }
      - { name: events_captured_total, type: integer, source: computed, description: "Lifetime NoiseEvents ingested on this monitor (excluding DISCARDED? no: all ingested)" }

  - name: NoiseEvent
    parent: null
    common_fields: true
    fields:
      - { name: monitor_id, type: string, source: input, description: "FK -> NoiseMonitor.id; capturing station" }
      - { name: started_at, type: datetime, source: input, description: "Event start UTC" }
      - { name: duration_seconds, type: integer, source: input, description: "Event duration; must be >= 5" }
      - { name: lmax_db, type: number, source: input, description: "Maximum A-weighted level dB" }
      - { name: sel_db, type: number, source: input, description: "Sound Exposure Level dB" }
      - { name: status, type: enum, source: system, description: "CAPTURED | SCREENING | CLASSIFIED_AIRCRAFT | CLASSIFIED_COMMUNITY | CLASSIFIED_MIXED | VERIFIED | DISCARDED" }
      - { name: flight_id, type: string, source: system, description: "FK -> FlightOperation.id; linked at classification", constraints: "nullable" }
      - { name: classification_basis, type: string, source: system, description: "Analyst note recorded at classify", constraints: "nullable" }
      - { name: classification_confidence, type: number, source: computed, description: "round_half_up(min(100, 40 + (lmax_db-65.0)*2 + (duration_seconds>=30 ? 20 : 0) + (flight linked ? 20 : 0)), 1); recomputed at classify", default: 0 }
      - { name: reclassify_count, type: integer, source: system, default: 0, description: "Times sent back to SCREENING (max 2)" }
      - { name: exceeds_threshold, type: boolean, source: computed, description: "lmax_db >= 65.0" }
      - { name: quarter_key, type: string, source: computed, description: "Quarter label of started_at, e.g. 2026-Q3" }

  - name: MonitorOutage
    parent: null
    common_fields: false
    fields:
      - { name: monitor_id, type: string, source: input, description: "FK -> NoiseMonitor.id; outaged station" }
      - { name: start_at, type: datetime, source: input, description: "Outage start UTC (half-open interval start)" }
      - { name: end_at, type: datetime, source: input, description: "Outage end UTC (exclusive); must be > start_at" }
      - { name: outage_type, type: enum, source: input, description: "CALIBRATION | MAINTENANCE | FAULT" }
      - { name: reason, type: string, source: input, description: "Free-text reason", constraints: "optional" }

  - name: CurfewRule
    parent: null
    common_fields: true
    fields:
      - { name: runway_code, type: string, source: input, description: "Runway designator the rule applies to" }
      - { name: season, type: enum, source: input, description: "SUMMER (months 4-9) | WINTER (months 10,11,12,1,2,3) | YEAR_ROUND" }
      - { name: window_start_minute, type: integer, source: input, description: "UTC minute-of-day 0-1439, inclusive" }
      - { name: window_end_minute, type: integer, source: input, description: "UTC minute-of-day 0-1439, inclusive; must be > window_start_minute (no cross-midnight windows)" }
      - { name: applies_to, type: enum, source: input, description: "ARRIVAL | DEPARTURE | BOTH (BOTH matches any operation_type; RUNUP matches only BOTH)" }
      - { name: grace_minutes, type: integer, source: input, default: 15, description: "Per-rule grace band; effective grace = min(rule.grace_minutes, operator.curfew_grace_minutes)" }
      - { name: effective_from, type: string, source: input, description: "First effective date YYYY-MM-DD, inclusive" }
      - { name: effective_to, type: string, source: input, description: "Last effective date YYYY-MM-DD, inclusive; must be >= effective_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: OperatorNotification
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; notified operator" }
      - { name: complaint_id, type: string, source: input, description: "FK -> NoiseComplaint.id; related complaint", constraints: "nullable; at least one of complaint_id/noise_event_id required" }
      - { name: noise_event_id, type: string, source: input, description: "FK -> NoiseEvent.id; related event", constraints: "nullable" }
      - { name: severity, type: enum, source: input, description: "ADVISORY | FORMAL; system raises to ESCALATION on escalate" }
      - { name: subject, type: string, source: input, description: "Subject line" }
      - { name: body, type: string, source: input, description: "Notification body" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACKNOWLEDGED | RESPONSE_RECEIVED | CLOSED | ESCALATED | AUTO_CLOSED" }
      - { name: sent_at, type: datetime, source: system, description: "Send timestamp", constraints: "nullable" }
      - { name: due_at, type: datetime, source: computed, description: "sent_at + 10 days; response SLA", constraints: "nullable" }
      - { name: acknowledged_at, type: datetime, source: system, constraints: "nullable", description: "ACK timestamp" }
      - { name: responded_at, type: datetime, source: system, constraints: "nullable", description: "Response timestamp" }
      - { name: closed_at, type: datetime, source: system, constraints: "nullable", description: "Close timestamp" }
      - { name: response_text, type: string, source: system, description: "Operator response; min 20 chars at respond", constraints: "nullable" }
      - { name: escalation_reason, type: string, source: system, constraints: "nullable", description: "Why escalated" }
      - { name: closed_outcome, type: enum, source: system, description: "RESOLVED | COMPLAINT_WITHDRAWN | OVERRIDE", constraints: "nullable" }

  - name: NoiseStudy
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Study title" }
      - { name: baseline_year, type: integer, source: input, description: "Data baseline year" }
      - { name: description, type: string, source: input, description: "Scope description", constraints: "optional" }
      - { name: supersedes_study_id, type: string, source: input, description: "FK -> NoiseStudy.id; prior ADOPTED study this one replaces", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCOPING | DATA_COLLECTION | DRAFTED | PUBLIC_REVIEW | ADOPTED | SUPERSEDED" }
      - { name: adopted_at, type: datetime, source: system, constraints: "nullable", description: "Adoption timestamp" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Times returned from PUBLIC_REVIEW to DATA_COLLECTION" }
      - { name: parcels_assessed_count, type: integer, source: computed, description: "Count of LandUseParcels linked to this study" }

  - name: LandUseParcel
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> NoiseStudy.id; owning study" }
      - { name: parcel_ref, type: string, source: input, description: "Assessor parcel reference", constraints: "unique within the study" }
      - { name: land_use, type: enum, source: input, description: "RESIDENTIAL | SCHOOL | HOSPITAL | COMMERCIAL | INDUSTRIAL | OPEN_SPACE" }
      - { name: dnl_db_measured, type: number, source: input, description: "Measured DNL dB, 1 decimal" }
      - { name: dnl_db_modeled, type: number, source: input, description: "Modeled DNL dB, 1 decimal" }
      - { name: zone_code, type: string, source: input, description: "Community zone containing the parcel" }
      - { name: dnl_db_effective, type: number, source: computed, description: "Variant-selected DNL: study ADOPTED -> dnl_db_measured; otherwise round_half_up(dnl_db_modeled - 1.5, 1)" }
      - { name: dnl_band, type: integer, source: computed, description: "floor(dnl_db_effective / 5) * 5" }
      - { name: compatibility_status, type: enum, source: computed, description: "COMPATIBLE | COMPATIBLE_WITH_MEASURES | INCOMPATIBLE_RESIDENTIAL | INCOMPATIBLE_NONRES" }
      - { name: insulation_eligible, type: boolean, source: computed, description: "true iff compatibility_status == INCOMPATIBLE_RESIDENTIAL" }
      - { name: reassessed_at, type: datetime, source: system, constraints: "nullable", description: "Last recompute timestamp" }

  - name: SoundInsulationApplication
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> LandUseParcel.id; subject parcel" }
      - { name: complainant_id, type: string, source: input, description: "FK -> Complainant.id; owner/resident if a known complainant", constraints: "nullable" }
      - { name: dwelling_type, type: enum, source: input, description: "SINGLE_FAMILY | MULTI_FAMILY | MOBILE_HOME" }
      - { name: rooms_count, type: integer, source: input, description: "Habitable rooms; must be >= 1" }
      - { name: est_cost_cents, type: integer, source: input, description: "Estimated treatment cost, whole cents; >= 1" }
      - { name: actual_cost_cents, type: integer, source: system, description: "Actual cost recorded at disburse", constraints: "nullable" }
      - { name: eligibility_status, type: enum, source: system, description: "NEW | SUBMITTED | SCREENING | ELIGIBLE_TIER1 | ELIGIBLE_TIER2 | INELIGIBLE | APPEALED | WITHDRAWN (dimension A)" }
      - { name: funding_status, type: enum, source: system, description: "UNFUNDED | OFFER_ISSUED | OFFER_DECLINED | GRANT_COMMITTED | REIMBURSED (dimension B, evolves independently of dimension A)" }
      - { name: fund_id, type: string, source: system, description: "FK -> InsulationFund.id; fund holding the reservation", constraints: "nullable" }
      - { name: priority_score, type: integer, source: computed, description: "Weighted score from insulation_priority_score; recomputed on decision and on study adoption cascade" }
      - { name: tier_cap_cents, type: integer, source: computed, description: "8_000_000 for ELIGIBLE_TIER1 else 4_000_000; 0 before eligibility", default: 0 }
      - { name: offered_amount_cents, type: integer, source: computed, description: "Provisional obligation total at issue-offer", constraints: "nullable" }
      - { name: offer_issued_at, type: datetime, source: system, constraints: "nullable", description: "Offer timestamp" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "offer_issued_at + 45 days", constraints: "nullable" }
      - { name: last_offer_expired_at, type: datetime, source: system, constraints: "nullable", description: "When the last offer lapsed" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Final obligation total actually disbursed", constraints: "nullable" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Appeals filed (max 2)" }
      - { name: submitted_at, type: datetime, source: system, constraints: "nullable", description: "Submission timestamp" }
      - { name: decided_at, type: datetime, source: system, constraints: "nullable", description: "Latest eligibility decision timestamp" }

  - name: InsulationFund
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: string, source: input, description: "Fiscal year label e.g. FY2026", constraints: "unique across all funds" }
      - { name: total_allocation_cents, type: integer, source: input, description: "Total program budget, whole cents; >= 1" }
      - { name: intake_opens_at, type: datetime, source: input, description: "Application intake window open (inclusive)" }
      - { name: intake_closes_at, type: datetime, source: input, description: "Application intake window close (exclusive); must be > intake_opens_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED; at most one ACTIVE fund exists" }
      - { name: available_cents, type: integer, source: computed, description: "total - reserved - disbursed; invariant: available + reserved + disbursed == total_allocation_cents at all times" }
      - { name: reserved_cents, type: integer, source: computed, description: "Sum of offered_amount_cents on applications with funding_status OFFER_ISSUED|GRANT_COMMITTED linked to this fund" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Sum of disbursed_cents on REIMBURSED applications linked to this fund" }
      - { name: projected_pipeline_cents, type: integer, source: computed, description: "Sum of provisional obligations of UNFUNDED applications in ELIGIBLE_TIER1|ELIGIBLE_TIER2 (pipeline forecast)" }

  - name: OutreachCase
    parent: null
    common_fields: true
    fields:
      - { name: complainant_id, type: string, source: input, description: "FK -> Complainant.id; outreach subject" }
      - { name: trigger_reason, type: enum, source: input, description: "REPEAT_THRESHOLD | RESTRICTED_THRESHOLD | MANUAL" }
      - { name: status, type: enum, source: system, description: "OPEN | CONTACT_ATTEMPTED | ENGAGED | RESOLVED | DORMANT" }
      - { name: contact_attempts, type: integer, source: system, default: 0, description: "Logged contact attempts" }
      - { name: opened_at, type: datetime, source: system, description: "Open timestamp" }
      - { name: resolved_at, type: datetime, source: system, constraints: "nullable", description: "Resolution timestamp; sets complainant.repeat_baseline_at" }
      - { name: resolution_summary, type: string, source: system, constraints: "nullable", description: "Resolution notes" }

  - name: QuarterlyReport
    parent: null
    common_fields: true
    fields:
      - { name: quarter_label, type: string, source: input, description: "Quarter label YYYY-Qn", constraints: "unique across all reports" }
      - { name: period_start, type: datetime, source: computed, description: "Quarter start UTC, inclusive" }
      - { name: period_end, type: datetime, source: computed, description: "Quarter end UTC, exclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | PUBLISHED" }
      - { name: notes, type: string, source: input, description: "Narrative notes (editable via PATCH while DRAFT)", constraints: "optional" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, constraints: "nullable", description: "X-User-ID of approver" }
      - { name: published_at, type: datetime, source: system, constraints: "nullable", description: "Publish timestamp; publishing locks the quarter" }
      - { name: revision_round_count, type: integer, source: system, default: 0, description: "Times returned for revision" }
      - { name: complaints_received_count, type: integer, source: computed, description: "Complaints created_at in [period_start, period_end), any status; snapshot at creation" }
      - { name: complaints_substantiated_count, type: integer, source: computed, description: "Complaints status CLOSED_SUBSTANTIATED with closed_at in period; snapshot at creation" }
      - { name: distinct_complainants_count, type: integer, source: computed, description: "Distinct complainant_id among complaints created in period" }
      - { name: events_aircraft_count, type: integer, source: computed, description: "Events started in period with status CLASSIFIED_AIRCRAFT|VERIFIED" }
      - { name: events_community_count, type: integer, source: computed, description: "Events started in period with status CLASSIFIED_COMMUNITY" }
      - { name: events_mixed_count, type: integer, source: computed, description: "Events started in period with status CLASSIFIED_MIXED" }
      - { name: curfew_movements_count, type: integer, source: computed, description: "OPERATED flights actual_at in period with curfew_movement" }
      - { name: curfew_violations_count, type: integer, source: computed, description: "OPERATED flights actual_at in period with curfew_violation" }
      - { name: avg_operator_compliance_score, type: number, source: computed, description: "Mean (1dp half-up) of per-operator curfew_compliance_score over operators with >=1 OPERATED flight in period; 0.0 when none" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Complainant
    initial_state: GOOD_STANDING
    terminal_states: []
    note: "standing field; transitions are system auto-transitions re-evaluated after every complaint create/withdraw/reopen/close and after outreach resolve"
    transitions:
      - from: GOOD_STANDING
        to: REPEAT
        trigger: "system: complaints_90d >= 10 and < 25 after counter recompute"
        actor: system
        preconditions: ["complaints_90d >= 10 (boundary inclusive)"]
        side_effects:
          - "standing = REPEAT"
          - "auto-create OutreachCase(trigger_reason=REPEAT_THRESHOLD, status=OPEN) iff no case with status OPEN|CONTACT_ATTEMPTED|ENGAGED exists for this complainant"
      - from: REPEAT
        to: RESTRICTED
        trigger: "system: complaints_90d >= 25 after counter recompute"
        actor: system
        preconditions: ["complaints_90d >= 25 (boundary inclusive)"]
        side_effects:
          - "standing = RESTRICTED; low_priority_flag = true"
          - "auto-create OutreachCase(trigger_reason=RESTRICTED_THRESHOLD) iff none open"
      - from: REPEAT
        to: GOOD_STANDING
        trigger: "system: complaints_90d < 10 after recompute (aging past 90d window, outreach baseline reset, or withdrawal)"
        actor: system
        preconditions: ["complaints_90d <= 9"]
        side_effects: ["standing = GOOD_STANDING"]
      - from: RESTRICTED
        to: REPEAT
        trigger: "system: complaints_90d drops to [10, 24] after recompute"
        actor: system
        preconditions: ["10 <= complaints_90d <= 24"]
        side_effects: ["standing = REPEAT; low_priority_flag = false"]
      - from: RESTRICTED
        to: GOOD_STANDING
        trigger: "system: complaints_90d <= 9 after recompute"
        actor: system
        preconditions: ["complaints_90d <= 9"]
        side_effects: ["standing = GOOD_STANDING; low_priority_flag = false"]

  - entity: NoiseComplaint
    initial_state: RECEIVED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /noise-program/noise-complaints/{complaintId}/begin-review"
        actor: NoiseAnalyst
        preconditions: ["status == RECEIVED (else ERR_INVALID_COMPLAINT_STATE)"]
        side_effects: ["increments NoiseComplaint.version by 1"]
      - from: UNDER_REVIEW
        to: AWAITING_COMPLAINANT
        trigger: "POST /noise-program/noise-complaints/{complaintId}/request-info"
        actor: NoiseAnalyst
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_COMPLAINT_STATE)"]
        side_effects: ["info_request_note recorded", "increments NoiseComplaint.version by 1"]
      - from: AWAITING_COMPLAINANT
        to: UNDER_REVIEW
        trigger: "POST /noise-program/noise-complaints/{complaintId}/provide-info"
        actor: "Complainant (owner) | CommunityLiaison"
        preconditions:
          - "status == AWAITING_COMPLAINANT (else ERR_INVALID_COMPLAINT_STATE)"
          - "if role == Complainant: X-User-ID == complaint.complainant_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["narrative appended", "increments NoiseComplaint.version by 1"]
      - from: "UNDER_REVIEW|CORRELATED"
        to: CORRELATED
        trigger: "POST /noise-program/noise-complaints/{complaintId}/correlate"
        actor: NoiseAnalyst
        preconditions:
          - "status in UNDER_REVIEW|CORRELATED (else ERR_INVALID_COMPLAINT_STATE); re-correlation from CORRELATED supersedes the prior correlation"
          - "expected_complaint_version == complaint.version (else ERR_STALE_CORRELATION_VERSION 412)"
          - "at least one of flight_id / noise_event_id present (else ERR_CORRELATION_TARGET_REQUIRED)"
          - "flight, if given, must be status OPERATED (else ERR_FLIGHT_NOT_OPERATED)"
          - "event, if given, must be status CLASSIFIED_AIRCRAFT|CLASSIFIED_MIXED|VERIFIED (else ERR_EVENT_NOT_CLASSIFIED)"
          - "an eligible correlation must exist within STRICT or RELAXED window (else ERR_CORRELATION_WINDOW_EXCEEDED)"
        side_effects:
          - "compute correlation_confidence via correlation_confidence_score (STRICT preferred, RELAXED fallback)"
          - "set correlated_flight_id / correlated_event_id, correlation_variant_used, substantiation_eligible = (confidence >= 60.0)"
          - "supersede: if a prior correlation existed, decrement prior flight's linked_complaint_count (compensation)"
          - "increment new flight's linked_complaint_count by 1 (hop B of cascade correlate->flight)"
          - "if flight.linked_complaint_count crosses to >= 5: auto-create OperatorNotification(DRAFT, severity=ADVISORY) to that operator (hop C)"
          - "increments NoiseComplaint.version by 1"
      - from: CORRELATED
        to: CLOSED_SUBSTANTIATED
        trigger: "POST /noise-program/noise-complaints/{complaintId}/close outcome=SUBSTANTIATED"
        actor: NoiseAnalyst
        preconditions:
          - "status == CORRELATED (else ERR_INVALID_COMPLAINT_STATE)"
          - "correlation_confidence >= 60.0 (else ERR_CONFIDENCE_BELOW_THRESHOLD)"
        side_effects:
          - "closure_outcome=SUBSTANTIATED, closed_at=now"
          - "complainant: open_count-1, closed_count+1, substantiated_count+1, standing recompute (hop B)"
          - "increments NoiseComplaint.version by 1"
      - from: UNDER_REVIEW
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /noise-program/noise-complaints/{complaintId}/close outcome=UNSUBSTANTIATED"
        actor: NoiseAnalyst
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_COMPLAINT_STATE)"]
        side_effects: ["closure_outcome=UNSUBSTANTIATED, closed_at=now", "complainant counters + standing recompute", "increments NoiseComplaint.version by 1"]
      - from: CORRELATED
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /noise-program/noise-complaints/{complaintId}/close outcome=UNSUBSTANTIATED"
        actor: NoiseAnalyst
        preconditions: ["status == CORRELATED (else ERR_INVALID_COMPLAINT_STATE)"]
        side_effects: ["closure_outcome=UNSUBSTANTIATED, closed_at=now", "flight linked_complaint_count-1 (compensation)", "complainant counters + standing recompute", "increments NoiseComplaint.version by 1"]
      - from: CLOSED_SUBSTANTIATED
        to: REOPENED
        trigger: "POST /noise-program/noise-complaints/{complaintId}/reopen"
        actor: "Complainant (owner) | CommunityLiaison"
        preconditions:
          - "status in CLOSED_SUBSTANTIATED|CLOSED_UNSUBSTANTIATED (else ERR_INVALID_COMPLAINT_STATE)"
          - "now <= closed_at + 30 days (else ERR_REOPEN_WINDOW_EXPIRED)"
          - "reopen_count < 3 (else ERR_REOPEN_LIMIT_REACHED)"
        side_effects:
          - "reopen_count+1, closed_at=null; if was SUBSTANTIATED: complainant.substantiated_count-1 (compensation)"
          - "complainant: closed_count-1, open_count+1, standing recompute"
          - "increments NoiseComplaint.version by 1"
      - from: CLOSED_UNSUBSTANTIATED
        to: REOPENED
        trigger: "POST /noise-program/noise-complaints/{complaintId}/reopen"
        actor: "Complainant (owner) | CommunityLiaison"
        preconditions: ["same as CLOSED_SUBSTANTIATED -> REOPENED"]
        side_effects: ["same as above (no substantiated decrement)", "increments NoiseComplaint.version by 1"]
      - from: REOPENED
        to: UNDER_REVIEW
        trigger: "POST /noise-program/noise-complaints/{complaintId}/resume-review"
        actor: NoiseAnalyst
        preconditions: ["status == REOPENED (else ERR_INVALID_COMPLAINT_STATE)"]
        side_effects: ["increments NoiseComplaint.version by 1"]
      - from: "* (any non-terminal)"
        to: WITHDRAWN
        trigger: "POST /noise-program/noise-complaints/{complaintId}/withdraw"
        actor: "Complainant (owner) | CommunityLiaison"
        preconditions:
          - "status != WITHDRAWN (else ERR_INVALID_COMPLAINT_STATE)"
          - "if role == Complainant: X-User-ID == complaint.complainant_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "complainant counters recompute (open_count or closed_count decremented, withdrawn_count+1), standing recompute"
          - "cascade D hop 1: linked OperatorNotifications in DRAFT -> AUTO_CLOSED (closed_outcome=COMPLAINT_WITHDRAWN)"
          - "cascade D hop 2: operator.notifications_open/notifications_closed recomputed for affected operators"
          - "if correlated: flight.linked_complaint_count-1 (compensation)"
          - "increments NoiseComplaint.version by 1"

  - entity: NoiseEvent
    initial_state: CAPTURED
    terminal_states: [VERIFIED, DISCARDED]
    transitions:
      - from: CAPTURED
        to: SCREENING
        trigger: "POST /noise-program/noise-events/{eventId}/begin-screening"
        actor: NoiseAnalyst
        preconditions: ["status == CAPTURED (else ERR_INVALID_EVENT_STATE)"]
        side_effects: ["increments NoiseEvent.version by 1"]
      - from: SCREENING
        to: CLASSIFIED_AIRCRAFT
        trigger: "POST /noise-program/noise-events/{eventId}/classify classification=AIRCRAFT"
        actor: NoiseAnalyst
        preconditions:
          - "status == SCREENING (else ERR_INVALID_EVENT_STATE)"
          - "flight_id required for AIRCRAFT; flight must exist (ERR_FLIGHT_NOT_FOUND)"
        side_effects:
          - "compute classification_confidence; set flight_id"
          - "cascade B hop 1: flight.linked_event_count += 1"
          - "cascade B hop 2: complaints with correlated_event_id == this event and status == CORRELATED recompute correlation_confidence WITH event-corroboration bonus; set substantiation_eligible = (confidence >= 60.0)"
          - "cascade B hop 3: if flight.linked_event_count crosses to >= 3: auto-create OperatorNotification(DRAFT, ADVISORY) to the flight's operator"
          - "increments NoiseEvent.version by 1"
      - from: SCREENING
        to: CLASSIFIED_COMMUNITY
        trigger: "POST /noise-program/noise-events/{eventId}/classify classification=COMMUNITY"
        actor: NoiseAnalyst
        preconditions: ["status == SCREENING (else ERR_INVALID_EVENT_STATE)"]
        side_effects: ["compute classification_confidence (no flight link allowed: flight_id must be absent, else ERR_VALIDATION)", "increments NoiseEvent.version by 1"]
      - from: SCREENING
        to: CLASSIFIED_MIXED
        trigger: "POST /noise-program/noise-events/{eventId}/classify classification=MIXED"
        actor: NoiseAnalyst
        preconditions: ["status == SCREENING (else ERR_INVALID_EVENT_STATE); flight_id optional for MIXED"]
        side_effects: ["compute classification_confidence; if flight_id present: flight.linked_event_count += 1 (hop 1 only)", "increments NoiseEvent.version by 1"]
      - from: CLASSIFIED_AIRCRAFT
        to: VERIFIED
        trigger: "POST /noise-program/noise-events/{eventId}/verify"
        actor: NoiseAnalyst
        preconditions:
          - "status in CLASSIFIED_AIRCRAFT|CLASSIFIED_COMMUNITY|CLASSIFIED_MIXED (else ERR_INVALID_EVENT_STATE)"
          - "classification_confidence >= 70.0 (else ERR_CONFIDENCE_BELOW_THRESHOLD)"
          - "monitor.uptime_pct_30d >= 80.0 (else ERR_UPTIME_BELOW_FLOOR)"
        side_effects: ["increments NoiseEvent.version by 1"]
      - from: CLASSIFIED_COMMUNITY
        to: VERIFIED
        trigger: "POST /noise-program/noise-events/{eventId}/verify"
        actor: NoiseAnalyst
        preconditions: ["same as CLASSIFIED_AIRCRAFT -> VERIFIED"]
        side_effects: ["increments NoiseEvent.version by 1"]
      - from: CLASSIFIED_MIXED
        to: VERIFIED
        trigger: "POST /noise-program/noise-events/{eventId}/verify"
        actor: NoiseAnalyst
        preconditions: ["same as CLASSIFIED_AIRCRAFT -> VERIFIED"]
        side_effects: ["increments NoiseEvent.version by 1"]
      - from: CLASSIFIED_AIRCRAFT
        to: SCREENING
        trigger: "POST /noise-program/noise-events/{eventId}/reclassify"
        actor: NoiseAnalyst
        preconditions:
          - "status in CLASSIFIED_AIRCRAFT|CLASSIFIED_COMMUNITY|CLASSIFIED_MIXED (else ERR_INVALID_EVENT_STATE)"
          - "reclassify_count < 2 (else ERR_RECLASSIFY_LIMIT_REACHED)"
        side_effects:
          - "reclassify_count += 1; flight_id cleared; if was AIRCRAFT/MIXED with flight: flight.linked_event_count -= 1 (compensation)"
          - "complaints correlated to this event recompute confidence WITHOUT corroboration bonus (compensation)"
          - "increments NoiseEvent.version by 1"
      - from: CLASSIFIED_COMMUNITY
        to: SCREENING
        trigger: "POST /noise-program/noise-events/{eventId}/reclassify"
        actor: NoiseAnalyst
        preconditions: ["same as CLASSIFIED_AIRCRAFT -> SCREENING"]
        side_effects: ["same compensations as above", "increments NoiseEvent.version by 1"]
      - from: CLASSIFIED_MIXED
        to: SCREENING
        trigger: "POST /noise-program/noise-events/{eventId}/reclassify"
        actor: NoiseAnalyst
        preconditions: ["same as CLASSIFIED_AIRCRAFT -> SCREENING"]
        side_effects: ["same compensations as above", "increments NoiseEvent.version by 1"]
      - from: SCREENING
        to: DISCARDED
        trigger: "POST /noise-program/noise-events/{eventId}/discard"
        actor: NoiseAnalyst
        preconditions: ["status == SCREENING (else ERR_INVALID_EVENT_STATE)"]
        side_effects: ["increments NoiseEvent.version by 1"]

  - entity: OperatorNotification
    initial_state: DRAFT
    terminal_states: [CLOSED, AUTO_CLOSED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /noise-program/operator-notifications/{notificationId}/send"
        actor: NoiseAnalyst
        preconditions: ["status == DRAFT (else ERR_INVALID_NOTIFICATION_STATE)"]
        side_effects: ["sent_at=now; due_at = sent_at + 10 days", "operator.notifications_sent_total+1, notifications_open+1", "increments OperatorNotification.version by 1"]
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /noise-program/operator-notifications/{notificationId}/acknowledge"
        actor: "OperatorRep (own operator only, else ERR_NOT_RESOURCE_OWNER)"
        preconditions: ["status == SENT (else ERR_INVALID_NOTIFICATION_STATE)"]
        side_effects: ["acknowledged_at=now", "increments OperatorNotification.version by 1"]
      - from: ACKNOWLEDGED
        to: RESPONSE_RECEIVED
        trigger: "POST /noise-program/operator-notifications/{notificationId}/respond"
        actor: "OperatorRep (own operator only, else ERR_NOT_RESOURCE_OWNER)"
        preconditions:
          - "status == ACKNOWLEDGED (else ERR_INVALID_NOTIFICATION_STATE)"
          - "len(response_text) >= 20 (else ERR_RESPONSE_TOO_SHORT)"
        side_effects: ["responded_at=now, response_text recorded", "increments OperatorNotification.version by 1"]
      - from: RESPONSE_RECEIVED
        to: CLOSED
        trigger: "POST /noise-program/operator-notifications/{notificationId}/close"
        actor: NoiseAnalyst
        preconditions:
          - "status == RESPONSE_RECEIVED (else ERR_INVALID_NOTIFICATION_STATE)"
          - "if complaint_id linked: complaint.status in CLOSED_SUBSTANTIATED|CLOSED_UNSUBSTANTIATED|WITHDRAWN (else ERR_LINKED_COMPLAINT_OPEN)"
        side_effects:
          - "closed_at=now, closed_outcome=RESOLVED"
          - "operator: notifications_open-1, notifications_closed+1; if closed_at <= due_at: on_time_responses_90d+1"
          - "increments OperatorNotification.version by 1"
      - from: SENT
        to: ESCALATED
        trigger: "POST /noise-program/operator-notifications/{notificationId}/escalate OR system auto-sweep when now > due_at and status in SENT|ACKNOWLEDGED (evaluated whenever the logical clock advances or the notification is read)"
        actor: "NoiseOfficeAdmin | system"
        preconditions: ["status in SENT|ACKNOWLEDGED (else ERR_INVALID_NOTIFICATION_STATE); manual escalate always allowed; auto requires now > due_at"]
        side_effects:
          - "severity -> ESCALATION; escalation_reason recorded"
          - "cascade C hop 1: operator.compliance_standing demoted one level (GOOD->WATCH, WATCH->PROBATION; PROBATION stays)"
          - "cascade C hop 2: if operator now PROBATION: curfew_grace_minutes -> 0 and future violation points weighted x1.25"
          - "increments OperatorNotification.version by 1"
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "same as SENT -> ESCALATED"
        actor: "NoiseOfficeAdmin | system"
        preconditions: ["same as SENT -> ESCALATED"]
        side_effects: ["same as SENT -> ESCALATED"]
      - from: ESCALATED
        to: CLOSED
        trigger: "POST /noise-program/operator-notifications/{notificationId}/close"
        actor: NoiseAnalyst
        preconditions:
          - "status == ESCALATED (else ERR_INVALID_NOTIFICATION_STATE)"
          - "closed_outcome == OVERRIDE allowed only for NoiseAnalyst with linked complaint terminal or response received; pin: response must exist (responded_at not null) OR closed_outcome == OVERRIDE (else ERR_INVALID_NOTIFICATION_STATE)"
          - "if complaint_id linked: complaint terminal (else ERR_LINKED_COMPLAINT_OPEN)"
        side_effects: ["closed_at=now; operator counters recompute (no on-time credit)", "increments OperatorNotification.version by 1"]
      - from: DRAFT
        to: AUTO_CLOSED
        trigger: "system: linked complaint withdrawn (cascade D)"
        actor: system
        preconditions: ["status == DRAFT"]
        side_effects: ["closed_at=now, closed_outcome=COMPLAINT_WITHDRAWN", "increments OperatorNotification.version by 1"]

  - entity: SoundInsulationApplication_Eligibility
    note: "Dimension A (eligibility_status) of SoundInsulationApplication; evolves independently of dimension B (funding_status) — a parallel state-dimension machine"
    initial_state: NEW
    terminal_states: [WITHDRAWN]
    transitions:
      - from: NEW
        to: SUBMITTED
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/submit"
        actor: CommunityLiaison
        preconditions:
          - "eligibility_status == NEW (else ERR_INVALID_APPLICATION_STATE)"
          - "an ACTIVE InsulationFund exists and now in [intake_opens_at, intake_closes_at) (else ERR_SUBMISSION_WINDOW_CLOSED)"
        side_effects: ["submitted_at=now", "increments SoundInsulationApplication.version by 1"]
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/begin-screening"
        actor: StudyCoordinator
        preconditions: ["eligibility_status == SUBMITTED (else ERR_INVALID_APPLICATION_STATE)"]
        side_effects: ["increments SoundInsulationApplication.version by 1"]
      - from: APPEALED
        to: SCREENING
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/begin-screening"
        actor: StudyCoordinator
        preconditions: ["eligibility_status == APPEALED (else ERR_INVALID_APPLICATION_STATE)"]
        side_effects: ["increments SoundInsulationApplication.version by 1"]
      - from: SCREENING
        to: ELIGIBLE_TIER1
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/record-decision decision=ELIGIBLE_TIER1"
        actor: StudyCoordinator
        preconditions:
          - "eligibility_status == SCREENING (else ERR_INVALID_APPLICATION_STATE)"
          - "parcel.dnl_db_effective >= 70.0 OR parcel.land_use in SCHOOL|HOSPITAL (else ERR_TIER_NOT_PERMITTED)"
        side_effects: ["compute priority_score + tier_cap_cents=8_000_000", "decided_at=now", "fund.projected_pipeline_cents recompute", "increments SoundInsulationApplication.version by 1"]
      - from: SCREENING
        to: ELIGIBLE_TIER2
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/record-decision decision=ELIGIBLE_TIER2"
        actor: StudyCoordinator
        preconditions: ["eligibility_status == SCREENING (else ERR_INVALID_APPLICATION_STATE)"]
        side_effects: ["compute priority_score + tier_cap_cents=4_000_000", "decided_at=now", "fund pipeline recompute", "increments SoundInsulationApplication.version by 1"]
      - from: SCREENING
        to: INELIGIBLE
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/record-decision decision=INELIGIBLE"
        actor: StudyCoordinator
        preconditions: ["eligibility_status == SCREENING (else ERR_INVALID_APPLICATION_STATE)"]
        side_effects: ["decided_at=now", "increments SoundInsulationApplication.version by 1"]
      - from: INELIGIBLE
        to: APPEALED
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/appeal"
        actor: CommunityLiaison
        preconditions:
          - "eligibility_status == INELIGIBLE (else ERR_INVALID_APPLICATION_STATE)"
          - "appeal_count < 2 (else ERR_APPEAL_LIMIT_REACHED)"
          - "now <= decided_at + 30 days (else ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects: ["appeal_count += 1", "increments SoundInsulationApplication.version by 1"]
      - from: "SUBMITTED|SCREENING|ELIGIBLE_TIER1|ELIGIBLE_TIER2"
        to: INELIGIBLE
        trigger: "system: owning study adopted and parcel recompute flips insulation_eligible to false (cascade A hop C1)"
        actor: system
        preconditions: ["eligibility_status in SUBMITTED|SCREENING|ELIGIBLE_TIER1|ELIGIBLE_TIER2", "funding_status == UNFUNDED (offers with reservations are never auto-revoked)"]
        side_effects: ["decided_at=now", "priority_score recomputed", "fund pipeline recompute (hop D)", "increments SoundInsulationApplication.version by 1"]
      - from: "* (any except WITHDRAWN)"
        to: WITHDRAWN
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/withdraw"
        actor: CommunityLiaison
        preconditions: ["eligibility_status != WITHDRAWN (else ERR_INVALID_APPLICATION_STATE)"]
        side_effects:
          - "compensation: if funding_status == OFFER_ISSUED|GRANT_COMMITTED: release reservation (fund.reserved -> available), funding_status -> UNFUNDED"
          - "fund pipeline recompute"
          - "increments SoundInsulationApplication.version by 1"

  - entity: SoundInsulationApplication_Funding
    note: "Dimension B (funding_status) of SoundInsulationApplication; guards read dimension A"
    initial_state: UNFUNDED
    terminal_states: [REIMBURSED]
    transitions:
      - from: UNFUNDED
        to: OFFER_ISSUED
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/issue-offer OR POST /noise-program/insulation-funds/{fundId}/allocate (waterfall)"
        actor: NoiseOfficeAdmin
        preconditions:
          - "funding_status == UNFUNDED (else ERR_INVALID_APPLICATION_STATE)"
          - "dimension A eligibility_status in ELIGIBLE_TIER1|ELIGIBLE_TIER2 (cross-dimension guard, else ERR_INVALID_APPLICATION_STATE)"
          - "parcel's study status == ADOPTED (else ERR_STUDY_NOT_ADOPTED)"
          - "an ACTIVE fund exists (else ERR_NO_ACTIVE_FUND); direct issue-offer: expected_fund_version == fund.version (else ERR_STALE_FUND_VERSION 412)"
          - "fund.available_cents >= 50% of provisional obligation (else ERR_INSUFFICIENT_FUNDS); full when >= 100%, partial otherwise"
        side_effects:
          - "compute provisional obligation via grant_obligation_split on est_cost_cents; offered_amount_cents = min(obligation, fund.available_cents)"
          - "fund: available -> reserved (reserve offered_amount_cents); fund.version += 1; fund pipeline recompute"
          - "offer_issued_at=now; offer_expires_at = now + 45 days"
          - "increments SoundInsulationApplication.version by 1"
      - from: OFFER_ISSUED
        to: GRANT_COMMITTED
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/accept-offer"
        actor: CommunityLiaison
        preconditions:
          - "funding_status == OFFER_ISSUED (else ERR_INVALID_APPLICATION_STATE)"
          - "now < offer_expires_at (else ERR_OFFER_EXPIRED; auto-expire sweep fires first)"
        side_effects: ["increments SoundInsulationApplication.version by 1"]
      - from: OFFER_ISSUED
        to: OFFER_DECLINED
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/decline-offer"
        actor: CommunityLiaison
        preconditions: ["funding_status == OFFER_ISSUED (else ERR_INVALID_APPLICATION_STATE)"]
        side_effects: ["compensation: fund.reserved -> available (release offered_amount_cents); fund.version += 1", "increments SoundInsulationApplication.version by 1"]
      - from: OFFER_ISSUED
        to: UNFUNDED
        trigger: "system: auto-expire sweep evaluated on READ of the application (GET single/list) when now >= offer_expires_at; the clock advance alone does NOT sweep offers, so accept-offer on an expired-but-unswept offer deterministically returns ERR_OFFER_EXPIRED"
        actor: system
        preconditions: ["funding_status == OFFER_ISSUED"]
        side_effects: ["last_offer_expired_at=now", "compensation: fund.reserved -> available; fund.version += 1", "increments SoundInsulationApplication.version by 1"]
      - from: OFFER_DECLINED
        to: UNFUNDED
        trigger: "system: immediate re-queue after decline (same request)"
        actor: system
        preconditions: ["funding_status == OFFER_DECLINED"]
        side_effects: ["funding_status = UNFUNDED (application may receive a future offer)"]
      - from: GRANT_COMMITTED
        to: REIMBURSED
        trigger: "POST /noise-program/sound-insulation-applications/{applicationId}/disburse"
        actor: NoiseOfficeAdmin
        preconditions: ["funding_status == GRANT_COMMITTED (else ERR_INVALID_APPLICATION_STATE)", "actual_cost_cents >= 1 (else ERR_VALIDATION)"]
        side_effects:
          - "compute FINAL obligation via grant_obligation_split on actual_cost_cents; disbursed_cents = final total"
          - "fund: reserved -> disbursed (move disbursed_cents); release surplus reserved->available when final < provisional (delta reconciliation); fund.version += 1"
          - "increments SoundInsulationApplication.version by 1"

  - entity: NoiseStudy
    initial_state: SCOPING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SCOPING
        to: DATA_COLLECTION
        trigger: "POST /noise-program/noise-studies/{studyId}/start-data-collection"
        actor: StudyCoordinator
        preconditions: ["status == SCOPING (else ERR_INVALID_STUDY_STATE)"]
        side_effects: ["increments NoiseStudy.version by 1"]
      - from: DATA_COLLECTION
        to: DRAFTED
        trigger: "POST /noise-program/noise-studies/{studyId}/release-draft"
        actor: StudyCoordinator
        preconditions: ["status == DATA_COLLECTION (else ERR_INVALID_STUDY_STATE)"]
        side_effects: ["increments NoiseStudy.version by 1"]
      - from: DRAFTED
        to: PUBLIC_REVIEW
        trigger: "POST /noise-program/noise-studies/{studyId}/open-public-comment"
        actor: StudyCoordinator
        preconditions: ["status == DRAFTED (else ERR_INVALID_STUDY_STATE)"]
        side_effects: ["increments NoiseStudy.version by 1"]
      - from: PUBLIC_REVIEW
        to: DATA_COLLECTION
        trigger: "POST /noise-program/noise-studies/{studyId}/request-revision"
        actor: StudyCoordinator
        preconditions: ["status == PUBLIC_REVIEW (else ERR_INVALID_STUDY_STATE)"]
        side_effects: ["revision_count += 1", "increments NoiseStudy.version by 1"]
      - from: PUBLIC_REVIEW
        to: ADOPTED
        trigger: "POST /noise-program/noise-studies/{studyId}/adopt"
        actor: NoiseOfficeAdmin
        preconditions: ["status == PUBLIC_REVIEW (else ERR_INVALID_STUDY_STATE)"]
        side_effects:
          - "adopted_at=now"
          - "if supersedes_study_id set: that study (must be ADOPTED, else ERR_INVALID_STUDY_STATE) -> SUPERSEDED"
          - "cascade A hop B: every LandUseParcel of this study recomputes dnl_db_effective (variant switch PRELIMINARY->FINAL: modeled-1.5 -> measured), dnl_band, compatibility_status, insulation_eligible, reassessed_at=now"
          - "cascade A hop C: applications on parcels whose insulation_eligible flipped true->false with eligibility_status in SUBMITTED|SCREENING|ELIGIBLE_TIER1|ELIGIBLE_TIER2 and funding_status == UNFUNDED -> INELIGIBLE (system); priority_score recomputed for ALL non-terminal applications on this study's parcels"
          - "cascade A hop D: ACTIVE fund projected_pipeline_cents recomputed"
          - "increments NoiseStudy.version by 1"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system: a newer study with supersedes_study_id == this study is adopted"
        actor: system
        preconditions: ["status == ADOPTED"]
        side_effects: ["increments NoiseStudy.version by 1"]

  - entity: QuarterlyReport
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /noise-program/quarterly-reports/{reportId}/submit-for-review"
        actor: NoiseAnalyst
        preconditions:
          - "status == DRAFT (else ERR_INVALID_REPORT_STATE)"
          - "period_end <= now (else ERR_QUARTER_NOT_CLOSED)"
          - "no NoiseEvents with started_at in period and status CAPTURED|SCREENING (cross-entity gate, else ERR_UNCLASSIFIED_EVENTS_REMAIN)"
        side_effects: ["increments QuarterlyReport.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /noise-program/quarterly-reports/{reportId}/approve"
        actor: BoardMember
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_REPORT_STATE)"
          - "X-User-ID != created_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approved_by_user_id recorded", "increments QuarterlyReport.version by 1"]
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /noise-program/quarterly-reports/{reportId}/return-for-revision"
        actor: BoardMember
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_REPORT_STATE)"]
        side_effects: ["revision_round_count += 1", "increments QuarterlyReport.version by 1"]
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /noise-program/quarterly-reports/{reportId}/publish"
        actor: NoiseOfficeAdmin
        preconditions: ["status == APPROVED (else ERR_INVALID_REPORT_STATE)"]
        side_effects:
          - "published_at=now"
          - "quarter lock: future complaint filings with occurred_at in [period_start, period_end) are rejected with ERR_REPORT_QUARTER_LOCKED"
          - "increments QuarterlyReport.version by 1"

  - entity: OutreachCase
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: CONTACT_ATTEMPTED
        trigger: "POST /noise-program/outreach-cases/{caseId}/log-contact outcome=NO_ANSWER|REACHED"
        actor: CommunityLiaison
        preconditions: ["status == OPEN (else ERR_INVALID_OUTREACH_STATE)"]
        side_effects: ["contact_attempts += 1; if outcome == REACHED: status ENGAGED instead", "increments OutreachCase.version by 1"]
      - from: CONTACT_ATTEMPTED
        to: ENGAGED
        trigger: "POST /noise-program/outreach-cases/{caseId}/log-contact outcome=REACHED"
        actor: CommunityLiaison
        preconditions: ["status == CONTACT_ATTEMPTED (else ERR_INVALID_OUTREACH_STATE)"]
        side_effects: ["contact_attempts += 1", "increments OutreachCase.version by 1"]
      - from: CONTACT_ATTEMPTED
        to: CONTACT_ATTEMPTED
        trigger: "POST /noise-program/outreach-cases/{caseId}/log-contact outcome=NO_ANSWER"
        actor: CommunityLiaison
        preconditions: ["status == CONTACT_ATTEMPTED (else ERR_INVALID_OUTREACH_STATE)"]
        side_effects: ["contact_attempts += 1", "increments OutreachCase.version by 1"]
      - from: ENGAGED
        to: RESOLVED
        trigger: "POST /noise-program/outreach-cases/{caseId}/resolve"
        actor: CommunityLiaison
        preconditions: ["status == ENGAGED (else ERR_INVALID_OUTREACH_STATE)"]
        side_effects:
          - "resolved_at=now, resolution_summary recorded"
          - "complainant.repeat_baseline_at = now -> complaints_90d recomputed (only filings after baseline count) -> standing re-evaluated (decay/reset)"
          - "increments OutreachCase.version by 1"
      - from: ENGAGED
        to: DORMANT
        trigger: "POST /noise-program/outreach-cases/{caseId}/mark-dormant"
        actor: CommunityLiaison
        preconditions: ["status == ENGAGED (else ERR_INVALID_OUTREACH_STATE)"]
        side_effects: ["increments OutreachCase.version by 1"]
      - from: DORMANT
        to: OPEN
        trigger: "POST /noise-program/outreach-cases/{caseId}/reactivate"
        actor: CommunityLiaison
        preconditions: ["status == DORMANT (else ERR_INVALID_OUTREACH_STATE)"]
        side_effects: ["increments OutreachCase.version by 1"]

  - entity: FlightOperation
    initial_state: SCHEDULED
    terminal_states: [OPERATED, CANCELLED, DIVERTED]
    transitions:
      - from: SCHEDULED
        to: OPERATED
        trigger: "PATCH /noise-program/flight-operations/{flightId} status=OPERATED (actual_at required)"
        actor: NoiseOfficeAdmin
        preconditions: ["status == SCHEDULED (else ERR_INVALID_FLIGHT_STATE)", "actual_at present (else ERR_VALIDATION)"]
        side_effects: ["compute curfew_movement + curfew_violation once (immutable afterwards) using effective grace = min(rule.grace_minutes, operator.curfew_grace_minutes)", "increments FlightOperation.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "PATCH /noise-program/flight-operations/{flightId} status=CANCELLED"
        actor: NoiseOfficeAdmin
        preconditions: ["status == SCHEDULED (else ERR_INVALID_FLIGHT_STATE)"]
        side_effects: ["increments FlightOperation.version by 1"]
      - from: SCHEDULED
        to: DIVERTED
        trigger: "PATCH /noise-program/flight-operations/{flightId} status=DIVERTED"
        actor: NoiseOfficeAdmin
        preconditions: ["status == SCHEDULED (else ERR_INVALID_FLIGHT_STATE)"]
        side_effects: ["increments FlightOperation.version by 1"]

  - entity: NoiseMonitor
    initial_state: ONLINE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ONLINE
        to: DECOMMISSIONED
        trigger: "POST /noise-program/noise-monitors/{monitorId}/decommission"
        actor: NoiseOfficeAdmin
        preconditions: ["status == ONLINE (else ERR_MONITOR_NOT_ONLINE)"]
        side_effects: ["increments NoiseMonitor.version by 1"]

  - entity: InsulationFund
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /noise-program/insulation-funds/{fundId}/close"
        actor: NoiseOfficeAdmin
        preconditions: ["status == ACTIVE (else ERR_INVALID_FUND_STATE)", "reserved_cents == 0 (else ERR_FUND_HAS_RESERVED)"]
        side_effects: ["increments InsulationFund.version by 1"]

  - entity: CurfewRule
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /noise-program/curfew-rules/{curfewRuleId}/suspend"
        actor: NoiseOfficeAdmin
        preconditions: ["status == ACTIVE (else ERR_INVALID_CURFEW_RULE_STATE)"]
        side_effects: ["SUSPENDED rules are ignored by curfew matching and by overlap checks", "increments CurfewRule.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: report-edit-stale-version
    parent_entity: QuarterlyReport
    write_endpoint: "PATCH /noise-program/quarterly-reports/{reportId}"
    occ_field: expected_report_version
    description: |
      Editing a DRAFT report's narrative with an expected_report_version that no
      longer matches the report's current version is rejected: another edit has
      advanced the version since the client last read the report, so the client's
      change is based on a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: complaint-correlation-supersede
    parent_entity: NoiseComplaint
    write_endpoint: "POST /noise-program/noise-complaints/{complaintId}/correlate"
    occ_field: expected_complaint_version
    description: |
      Correlating a complaint with an expected_complaint_version that no longer
      matches is rejected: a prior correlation (or other mutation) has advanced
      the complaint's version, and the new correlation would supersede data the
      client never saw.
    error_id: ERR_STALE_CORRELATION_VERSION
    http_status: 412
  - rule_id: offer-issue-stale-fund
    parent_entity: InsulationFund
    write_endpoint: "POST /noise-program/sound-insulation-applications/{applicationId}/issue-offer"
    occ_field: expected_fund_version
    description: |
      Issuing an offer against an InsulationFund whose version has advanced since
      the client last read it is rejected: the reservation arithmetic must be
      based on the fund's current available_cents, not a stale snapshot.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: correlation_confidence_score
    trigger: "on POST correlate and on cascade B recompute (event classified/reclassified)"
    algorithm: weighted_scoring
    formula: |
      dt = abs(complaint.occurred_at - flight.actual_at) in seconds
      STRICT variant (tried first): eligible iff dt <= 300
        score = 100 - 40*(dt/300) - (0 if flight.zone_code == complainant.zone_code else 10)
                + (15 if linked event is CLASSIFIED_AIRCRAFT or VERIFIED else 0)
      RELAXED variant (fallback when no STRICT-eligible flight): eligible iff dt <= 1200
        score = 85 - 55*(dt/1200) - (0 if zone match else 15)
                + (10 if linked event is CLASSIFIED_AIRCRAFT or VERIFIED else 0)
      clamp score to [0, 100]; event-only correlation (no flight): 70.0 if event VERIFIED else 55.0
      if neither variant yields eligibility: reject ERR_CORRELATION_WINDOW_EXCEEDED
    input_set: "complaint (occurred_at, complainant.zone_code), candidate flight (actual_at, zone_code, status==OPERATED), optionally linked NoiseEvent (status)"
    constants:
      STRICT_WINDOW_SEC: 300
      RELAXED_WINDOW_SEC: 1200
      STRICT_ZONE_PENALTY: 10
      RELAXED_ZONE_PENALTY: 15
      STRICT_EVENT_BONUS: 15
      RELAXED_EVENT_BONUS: 10
      SUBSTANTIATION_THRESHOLD: 60.0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: STRICT
        when: "dt <= 300 for the selected flight"
        difference: "full base 100, gentler decay (40 over window), smaller zone penalty, larger event bonus"
      - name: RELAXED
        when: "no STRICT-eligible flight but dt <= 1200"
        difference: "base 85, steeper decay (55 over window), larger zone penalty, smaller event bonus; same inputs produce a different (lower) score"

  - name: parcel_dnl_exposure
    trigger: "on parcel create, on POST reassess, and on cascade A (study adoption)"
    algorithm: dual_variant_calculation
    formula: |
      if study.status == ADOPTED:  variant FINAL       -> dnl_db_effective = dnl_db_measured
      else:                        variant PRELIMINARY -> dnl_db_effective = round_half_up(dnl_db_modeled - 1.5, 1)
      dnl_band = floor(dnl_db_effective / 5) * 5
      compatibility (RESIDENTIAL|SCHOOL|HOSPITAL):
        dnl_db_effective >= 65.0 -> INCOMPATIBLE_RESIDENTIAL
        60.0 <= dnl_db_effective < 65.0 -> COMPATIBLE_WITH_MEASURES
        < 60.0 -> COMPATIBLE
      compatibility (COMMERCIAL|INDUSTRIAL):
        dnl_db_effective >= 75.0 -> INCOMPATIBLE_NONRES else COMPATIBLE
      OPEN_SPACE -> always COMPATIBLE
      insulation_eligible = (compatibility_status == INCOMPATIBLE_RESIDENTIAL)
    input_set: "parcel (dnl_db_measured, dnl_db_modeled, land_use), owning study.status"
    constants:
      PRELIMINARY_CONSERVATIVE_ADJUST_DB: 1.5
      RESIDENTIAL_INCOMPATIBLE_DNL: 65.0
      COMPATIBLE_WITH_MEASURES_DNL: 60.0
      NONRES_INCOMPATIBLE_DNL: 75.0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: PRELIMINARY
        when: "owning study not yet ADOPTED"
        difference: "uses modeled DNL minus 1.5 dB conservative adjustment"
      - name: FINAL
        when: "owning study ADOPTED"
        difference: "uses measured DNL verbatim; identical parcel data can flip eligibility across the two variants"

  - name: grant_obligation_split
    trigger: "on issue-offer (PROVISIONAL, using est_cost_cents) and on disburse (FINAL, using actual_cost_cents)"
    algorithm: tiered_pricing
    formula: |
      PINNED ROUNDING ORDER: round each component to whole cents FIRST, then sum.
      if tier == ELIGIBLE_TIER1: structure = min(cost_cents, 8_000_000)
      if tier == ELIGIBLE_TIER2: eligible_amount = round_half_up(cost_cents * 0.80); structure = min(eligible_amount, 4_000_000)
      contingency_cents = round_half_up(structure_cents * 0.10)
      admin_fee_cents   = min(round_half_up(structure_cents * 0.05), 250_000)
      total_obligation_cents = structure_cents + contingency_cents + admin_fee_cents
      (sum-then-round is FORBIDDEN: e.g. cost 1_111_115 TIER1 -> pinned 1_277_783 vs naive 1_277_782)
    input_set: "application (est_cost_cents or actual_cost_cents, eligibility tier, tier_cap_cents)"
    constants:
      TIER1_CAP_CENTS: 8000000
      TIER2_CAP_CENTS: 4000000
      TIER2_COVERAGE_PCT: 0.80
      CONTINGENCY_PCT: 0.10
      ADMIN_FEE_PCT: 0.05
      ADMIN_FEE_CAP_CENTS: 250000
    precision: "whole cents, round_half_up per component before summation"
    variants:
      - name: PROVISIONAL
        when: "issue-offer / allocate"
        difference: "cost basis = est_cost_cents; result held in offered_amount_cents and fund.reserved_cents"
      - name: FINAL
        when: "disburse"
        difference: "cost basis = actual_cost_cents; same inputs shape, different cost basis yields different total; delta (provisional - final) is released reserved->available when positive"

  - name: curfew_compliance_score
    trigger: "on GET compliance-summary and on quarterly_rollup (avg score)"
    algorithm: threshold
    formula: |
      EVALUATION ORDER PINNED: standing multiplier uses the operator's CURRENT stored
      compliance_standing BEFORE this recalculation (no fixed-point re-iteration).
      movements = OPERATED flights of operator with actual_at in [q_start, q_end) and curfew_movement
      violations = subset with curfew_violation (exemption_code in EMERGENCY|WEATHER_DIVERT|ATC_DELAY excluded at flag time)
      points per violation = 100 * class_mult * standing_mult
        class_mult: STAGE_3 -> 1.5, STAGE_4 -> 1.0, STAGE_5 -> 0.5
        standing_mult: PROBATION -> 1.25 else 1.0
      score = max(0, 1000 - sum(points))
      standing: score >= 900 -> GOOD; 700 <= score < 900 -> WATCH; score < 700 -> PROBATION
      curfew window match: minute_of_day(actual_at) in [window_start_minute, window_end_minute] inclusive,
        rule ACTIVE, season matches month (SUMMER=4-9, WINTER=10-3, YEAR_ROUND=any),
        applies_to matches operation_type (BOTH matches all; RUNUP matches only BOTH),
        effective_from <= date(actual_at) <= effective_to
      grace: effective_grace = min(rule.grace_minutes, operator.curfew_grace_minutes); a movement is a
        violation only if minute in [start+effective_grace, end-effective_grace]; boundary minutes are violations
    input_set: "FlightOperations status==OPERATED of one operator within quarter; ACTIVE CurfewRules; operator standing"
    constants:
      BASE_POINTS: 100
      STAGE3_MULT: 1.5
      STAGE4_MULT: 1.0
      STAGE5_MULT: 0.5
      PROBATION_MULT: 1.25
      GOOD_FLOOR: 900
      WATCH_FLOOR: 700
    precision: "1 decimal place, round_half_up"

  - name: complaints_90d_count
    trigger: "on complaint create / close / reopen / withdraw, on outreach resolve, evaluated for the affected complainant"
    algorithm: decay_function
    formula: |
      window_start = max(now - 90 days, complainant.repeat_baseline_at if set else -infinity)
      complaints_90d = count(complaints of complainant with created_at in [window_start, now] and status != WITHDRAWN)
      standing: >= 25 -> RESTRICTED; >= 10 -> REPEAT; else GOOD_STANDING (boundaries inclusive)
      reset mechanism: OutreachCase resolve sets repeat_baseline_at = now, shrinking the window
    input_set: "complainant's complaints (created_at, status), repeat_baseline_at, logical clock"
    constants:
      WINDOW_DAYS: 90
      REPEAT_THRESHOLD: 10
      RESTRICTED_THRESHOLD: 25
    precision: "integer count"

  - name: monitor_uptime_30d
    trigger: "on event verify (gate) and whenever outages are recorded"
    algorithm: aggregation
    formula: |
      window = [now - 30 days, now) ; total = 43200 minutes
      outage_minutes = sum over MonitorOutages of overlap_minutes([start_at, end_at) ∩ window), half-open, clipped to window
      uptime_pct_30d = round_half_up((43200 - outage_minutes) / 43200 * 100, 1)
      verify gate: uptime_pct_30d >= 80.0 (boundary inclusive)
    input_set: "monitor's MonitorOutages overlapping the trailing 30-day window"
    constants:
      WINDOW_MINUTES: 43200
      UPTIME_FLOOR_PCT: 80.0
    precision: "1 decimal place, round_half_up"

  - name: dnl_from_events
    trigger: "on GET /noise-program/noise-monitors/{monitorId}/dnl?date=..."
    algorithm: aggregation
    formula: |
      included events: started_at within the UTC calendar date, status in CLASSIFIED_AIRCRAFT | CLASSIFIED_MIXED | VERIFIED
        (CAPTURED, SCREENING, CLASSIFIED_COMMUNITY, DISCARDED are EXCLUDED)
      night event: hour(started_at) UTC in [22, 24) ∪ [0, 7) -> SEL_adj = sel_db + 10 else sel_db
      DNL = 10 * log10( sum(10^(SEL_adj/10)) / 86400 )
      empty inclusion set -> dnl_db = 0.0
    input_set: "monitor's NoiseEvents on the given UTC date, filtered by status"
    constants:
      NIGHT_PENALTY_DB: 10
      SECONDS_PER_DAY: 86400
    precision: "1 decimal place, round_half_up"

  - name: insulation_priority_score
    trigger: "on record-decision to ELIGIBLE_TIER1|ELIGIBLE_TIER2 and on cascade A rescore"
    algorithm: weighted_scoring
    formula: |
      band_points: dnl_band >= 75 -> 80; 70-74 -> 60; 65-69 -> 40; else 0
      land_use_points: SCHOOL|HOSPITAL -> 20; RESIDENTIAL -> 10; else 0
      complainant_points: complainant_id set AND that complainant.substantiated_count >= 5 -> 10 else 0
      rooms_points: rooms_count >= 8 -> 5 else 0
      priority_score = sum (integer)
    input_set: "application (parcel's dnl_band, parcel land_use, complainant link, rooms_count)"
    constants:
      BAND75_PTS: 80
      BAND70_PTS: 60
      BAND65_PTS: 40
      INSTITUTION_PTS: 20
      RESIDENTIAL_PTS: 10
      COMPLAINANT_HISTORY_PTS: 10
      LARGE_DWELLING_PTS: 5
    precision: "integer"

  - name: waterfall_allocation
    trigger: "on POST /noise-program/insulation-funds/{fundId}/allocate"
    algorithm: waterfall_allocation
    formula: |
      candidates = applications with eligibility_status in {ELIGIBLE_TIER1, ELIGIBLE_TIER2} AND funding_status == UNFUNDED
      order: priority_score DESC, then submitted_at ASC, then created_at ASC (never id)
      for each candidate: obligation = grant_obligation_split PROVISIONAL total
        if fund.available_cents >= obligation: issue full offer (reserve obligation)
        elif fund.available_cents >= obligation / 2 (boundary inclusive): issue PARTIAL offer (offered = remaining available, reserve it all)
        else: skip (record in skipped_application_ids) and continue to next candidate
      returns { offers_issued, total_reserved_cents, skipped_application_ids }
    input_set: "UNFUNDED eligible applications; the target fund (must be ACTIVE else ERR_INVALID_FUND_STATE)"
    constants:
      PARTIAL_FLOOR_PCT: 0.50
    precision: "whole cents"

  - name: community_annoyance_index
    trigger: "on GET /noise-program/community-zones/{zoneCode}/annoyance-index"
    algorithm: constraint_propagation
    formula: |
      CIRCULAR-LOOKING DEPENDENCY — EVALUATION ORDER PINNED (tier keyed on base ONLY; never re-keyed after bonus):
      distinct_30d = count(distinct complainants with complaints created in [now-30d, now] and complainant.zone_code == zone)
      subst_90d    = count(complaints status == CLOSED_SUBSTANTIATED, closed_at in [now-90d, now], complainant.zone_code == zone)
      viol_90d     = count(OPERATED flights with curfew_violation, actual_at in [now-90d, now], flight.zone_code == zone)
      step 1: base_index = round_half_up(2.5*distinct_30d + 4*sqrt(subst_90d) + 1.5*viol_90d, 1)
      step 2: tier = LOW if base_index < 20; MODERATE if < 40; HIGH otherwise   (keyed on base_index ONLY)
      step 3: final_index = base_index + bonus; bonus: LOW 0, MODERATE 6, HIGH 15
      (tier MUST NOT be re-evaluated after adding bonus: base 34.5 -> MODERATE, final 40.5 stays MODERATE)
    input_set: "complaints + complainants (zone), flights (zone, violation flag), logical clock"
    constants:
      DISTINCT_WEIGHT: 2.5
      SUBSTANTIATED_WEIGHT: 4
      VIOLATION_WEIGHT: 1.5
      MODERATE_FLOOR: 20
      HIGH_FLOOR: 40
      MODERATE_BONUS: 6
      HIGH_BONUS: 15
    precision: "1 decimal place, round_half_up"

  - name: quarterly_rollup
    trigger: "on POST /noise-program/quarterly-reports (snapshot at creation; metrics frozen thereafter)"
    algorithm: aggregation
    formula: |
      period = [period_start, period_end) derived from quarter_label (Q1=[Jan1,Apr1), Q2=[Apr1,Jul1), Q3=[Jul1,Oct1), Q4=[Oct1,Jan1))
      complaints_received_count   = count(complaints created_at in period, any status)
      complaints_substantiated_count = count(status == CLOSED_SUBSTANTIATED and closed_at in period)
      distinct_complainants_count = count(distinct complainant_id among complaints created in period)
      events_aircraft/community/mixed = count(events started_at in period with status in
        {CLASSIFIED_AIRCRAFT|VERIFIED} / {CLASSIFIED_COMMUNITY} / {CLASSIFIED_MIXED})
      curfew_movements_count / curfew_violations_count = count(OPERATED flights actual_at in period with flags)
      avg_operator_compliance_score = round_half_up(mean of curfew_compliance_score over operators with >= 1 OPERATED flight in period, 1); 0.0 when none
      boundary: records exactly at period_end are EXCLUDED (half-open window)
    input_set: "complaints, events, flights within the quarter window; operators"
    constants: {}
    precision: "counts integer; average 1 decimal place, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: business_constraint, check: "request shape: required fields present, types valid, enum members valid, quarter_label matches YYYY-Qn, numeric ranges (rooms_count>=1, est_cost_cents>=1, minutes 0-1439, end>start, effective_to>=effective_from, intake_closes_at>intake_opens_at, duration_seconds>=5). Unknown fields and system/computed fields sent in the body are IGNORED, never rejected", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "entity-backed ownership: Complainant role may only act on resources where complainant_id == X-User-ID; OperatorRep only on resources of operator_id == X-User-ID", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "complaint provide-info/reopen/withdraw, complainant self-GET, OperatorRep acknowledge/respond and own-resource GETs" }
  - { priority: 5, category: auth, check: "segregation of duties: report approver X-User-ID != report.created_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /noise-program/quarterly-reports/{reportId}/approve" }
  - { priority: 6, category: existence, check: "path identifiers resolve, left to right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all parameterized endpoints" }
  - { priority: 7, category: existence, check: "body foreign keys resolve: complainant_id (ERR_COMPLAINANT_NOT_FOUND), flight_id (ERR_FLIGHT_NOT_FOUND), noise_event_id (ERR_EVENT_NOT_FOUND), parcel_id (ERR_PARCEL_NOT_FOUND), operator_id (ERR_OPERATOR_NOT_FOUND), study/supersedes (ERR_STUDY_NOT_FOUND)", error_id: ERR_COMPLAINANT_NOT_FOUND, http_status: 404, applies_to: "endpoints taking FK fields in body" }
  - { priority: 8, category: state, check: "target resource in a valid from-state for the transition; OCC expected_*_version matches current version (ERR_STALE_VERSION / ERR_STALE_CORRELATION_VERSION / ERR_STALE_FUND_VERSION, 412)", error_id: ERR_INVALID_COMPLAINT_STATE, http_status: 409, applies_to: "all action endpoints (per-entity ids: ERR_INVALID_COMPLAINT_STATE, ERR_INVALID_EVENT_STATE, ERR_INVALID_NOTIFICATION_STATE, ERR_INVALID_APPLICATION_STATE, ERR_INVALID_STUDY_STATE, ERR_INVALID_REPORT_STATE, ERR_INVALID_OUTREACH_STATE, ERR_INVALID_FLIGHT_STATE, ERR_INVALID_FUND_STATE, ERR_INVALID_CURFEW_RULE_STATE, ERR_MONITOR_NOT_ONLINE)" }
  - { priority: 9, category: business_safety, check: "regulatory/data-integrity guards: complaint occurred_at not in a PUBLISHED report's quarter (ERR_REPORT_QUARTER_LOCKED); event ingest must not overlap any MonitorOutage (ERR_EVENT_DURING_OUTAGE); event verify requires monitor.uptime_pct_30d >= 80.0 (ERR_UPTIME_BELOW_FLOOR)", error_id: ERR_REPORT_QUARTER_LOCKED, http_status: 409, applies_to: "complaint create, event ingest, event verify" }
  - { priority: 10, category: business_temporal, check: "windows: insulation submit within ACTIVE fund intake (ERR_SUBMISSION_WINDOW_CLOSED); accept-offer before offer_expires_at (ERR_OFFER_EXPIRED); reopen within closed_at+30d (ERR_REOPEN_WINDOW_EXPIRED); appeal within decided_at+30d (ERR_APPEAL_WINDOW_EXPIRED); report submit-for-review requires period_end <= now (ERR_QUARTER_NOT_CLOSED)", error_id: ERR_SUBMISSION_WINDOW_CLOSED, http_status: 422, applies_to: "submit, accept-offer, reopen, appeal, submit-for-review" }
  - { priority: 11, category: business_constraint, check: "conflicts & uniqueness & thresholds: outage overlap half-open (ERR_OUTAGE_OVERLAP); curfew window overlap closed-interval (ERR_CURFEW_WINDOW_OVERLAP); active application per parcel (ERR_ACTIVE_APPLICATION_EXISTS); unique quarter_label (ERR_DUPLICATE_QUARTER_REPORT); unique fiscal_year (ERR_DUPLICATE_FISCAL_YEAR_FUND); single ACTIVE fund (ERR_ACTIVE_FUND_EXISTS); unique station_code (ERR_DUPLICATE_STATION_CODE); unique iata_code (ERR_DUPLICATE_IATA_CODE); correlate needs >=1 target (ERR_CORRELATION_TARGET_REQUIRED); notification needs >=1 target (ERR_NOTIFICATION_TARGET_REQUIRED); response_text >= 20 chars (ERR_RESPONSE_TOO_SHORT); SUBSTANTIATED close needs confidence >= 60.0 (ERR_CONFIDENCE_BELOW_THRESHOLD); correlate window exceeded (ERR_CORRELATION_WINDOW_EXCEEDED); appeal_count < 2 (ERR_APPEAL_LIMIT_REACHED); reopen_count < 3 (ERR_REOPEN_LIMIT_REACHED); reclassify_count < 2 (ERR_RECLASSIFY_LIMIT_REACHED); fund close needs reserved == 0 (ERR_FUND_HAS_RESERVED); manual outreach needs standing REPEAT|RESTRICTED (ERR_STANDING_NOT_ELEVATED); TIER1 decision needs dnl>=70 or institution (ERR_TIER_NOT_PERMITTED)", error_id: ERR_OUTAGE_OVERLAP, http_status: 409, applies_to: "domain create/action endpoints" }
  - { priority: 12, category: business_referential, check: "cross-entity state guards: application create needs parcel.insulation_eligible (ERR_PARCEL_NOT_INCOMPATIBLE); issue-offer needs parcel's study ADOPTED (ERR_STUDY_NOT_ADOPTED); notification close needs linked complaint terminal (ERR_LINKED_COMPLAINT_OPEN); report submit needs zero unclassified events in period (ERR_UNCLASSIFIED_EVENTS_REMAIN); correlate flight must be OPERATED (ERR_FLIGHT_NOT_OPERATED); correlate event must be classified (ERR_EVENT_NOT_CLASSIFIED)", error_id: ERR_PARCEL_NOT_INCOMPATIBLE, http_status: 422, applies_to: "application create, issue-offer, notification close, report submit, correlate" }
  - { priority: 13, category: business_fiscal, check: "money guards LAST: ACTIVE fund exists for offer (ERR_NO_ACTIVE_FUND); fund.available_cents >= 50% of provisional obligation (ERR_INSUFFICIENT_FUNDS)", error_id: ERR_INSUFFICIENT_FUNDS, http_status: 422, applies_to: "issue-offer, allocate, disburse" }

# =============================================================================
# §1.5 API Endpoint Table
