  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_fail
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Every endpoint except candidate self-registration requires the two context headers; an unauthenticated read fails at priority 1."
        test_recipe:
          setup: ["one level exists"]
          setup_api_calls:
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
          trigger:
            - call: "GET /registry/level-definitions"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "400; error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (Anonymous sends no headers; only POST /registry/candidates is exempt)"

      - name: shape_error_beats_existence
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=4]"
        distinguishing_aspect: "A request missing the required level_id AND referencing a nonexistent completion record fails shape validation (P3) before existence (P4): ERR_INVALID_REQUEST, never ERR_NOT_FOUND."
        test_recipe:
          setup: ["one registered candidate"]
          setup_api_calls:
            - call: "POST /registry/candidates"
              payload: { full_name: "Shapey", email: "shapey@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
          trigger:
            - call: "POST /registry/exam-applications"
              payload: { completion_record_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: Candidate
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "400; error_id == ERR_INVALID_REQUEST (missing level_id) even though the completion_record_id also does not exist"

