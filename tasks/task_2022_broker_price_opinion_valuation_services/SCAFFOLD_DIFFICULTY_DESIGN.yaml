  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict: two DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_submit
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LICENSE_NOT_VALID_FOR_STATE]
        distinguishing_aspect: |
          Pair (state, business_safety). Submit an order whose property is
          ARCHIVED (state violation, priority 26 — wait, property check is
          priority 26 which is business_state class; we use a different
          setup): submit an order in DISPATCHED state (not INTAKE — state
          error, priority 5) AND where the broker lacks the proper license
          (business_safety, priority 7). The expected winner is the
          state-category error because state checks (priority 5) precede
          business_safety (priority 7).
        test_recipe:
          setup:
            - "Order created and dispatched (so fulfillment_status == DISPATCHED, not INTAKE); broker has BPO license but order is APPRAISAL (would trigger ERR_LICENSE_NOT_VALID_FOR_STATE if state check didn't fire first)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bpo/state-regulations"
              payload: { state_code: "FL", bpo_permitted: true, appraisal_required_for_interior: false, min_driveby_radius_miles: 1.0, min_interior_radius_miles: 0.5 }
              as: ComplianceOfficer
            - call: "POST /bpo/client-accounts"
              payload: { client_code: "CLI", display_name: "Client I", sla_hours_standard: 72, sla_hours_rush: 24, late_penalty_bps_per_day: 250 }
              as: PlatformAdmin
              captures: { cl_i: $.data.id }
            - call: "POST /bpo/brokers"
              payload: { broker_code: "BRKI", full_name: "Broker I", email: "bi@x.com", max_concurrent_orders: 5 }
              as: ComplianceOfficer
              captures: { brk_i: $.data.id }
            - call: "POST /bpo/brokers/${brk_i}/licenses"
              payload: { state_code: "FL", license_kind: "BPO", license_number: "LIC-FL-I", expires_on: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bpo/brokers/${brk_i}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bpo/properties"
              payload: { street_address: "90 A", city: "MIA", state_code: "FL", postal_code: "33101", living_area_sqft: 1200, lot_area_sqft: 4000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { prop_i1: $.data.id }
            - call: "POST /bpo/valuation-orders"
              payload: { property_id: "${prop_i1}", order_kind: "BPO", inspection_level: "DRIVE_BY", priority: "STANDARD", agreed_fee_cents: 10000, client_id: "${cl_i}" }
              as: ClientAdmin
              as_user_id: "${cl_i}"
              captures: { ord_i: $.data.id, ord_i_v: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_i}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_i}"
              captures: { ord_i_v2: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_i}/dispatch"
              payload: { broker_id: "${brk_i}", expected_order_version: "${ord_i_v2}" }
              as: DispatchCoordinator
          trigger:
            # Attempt submit while order is DISPATCHED (state violation) AND order_kind would also fail licensing at dispatch — but submit is the wrong state
            - call: "POST /bpo/valuation-orders/${ord_i}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_i}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state category at priority 5 wins over any business_safety category)"
            - "NOT ERR_INVALID_REQUEST and NOT ERR_BPO_NOT_PERMITTED"

      - name: business_constraint_vs_business_fiscal_on_report
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_INSUFFICIENT_COMPARABLES]
