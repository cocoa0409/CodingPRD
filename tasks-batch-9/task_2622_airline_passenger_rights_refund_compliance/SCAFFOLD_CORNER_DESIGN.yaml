          assert:
            - "The sweep at 2026-10-04T09:00:00Z returns complaint_answer_breach_flagged_count == 0 (${answer_flags_at_due}) and open_violation_count == 0 (${violations_at_due})"
            - "It also returns complaint_ack_breach_flagged_count == 0 — acknowledged_at_utc is set, so the long-elapsed ack_due is irrelevant"
            - "The sweep at 2026-10-04T09:00:01Z returns complaint_answer_breach_flagged_count == 1 (${answer_flags_after}) and open_violation_count == 1 (${violations_after})"
            - "ConsumerComplaint.${cmp_id}.answer_breached == true and ConsumerComplaint.${cmp_id}.ack_breached == false after the second sweep"
            - "ConsumerComplaint.${cmp_id}.status == ACKNOWLEDGED throughout — breach flagging is not a state transition"

      - name: obligation_not_deadline_breached_at_exact_deadline_instant
        claim_type: satisfaction_to_pass
        grounds: ["calculations.compliance_sweep_recount.precision", "calculations.refund_deadline_resolution", "endpoints[POST /compliance/compliance-sweeps]"]
        distinguishing_aspect: "A sweep at exactly deadline_utc (2026-08-17T10:00:00Z) reports deadline_breach_flagged_count 0 yet still auto-defaults the election whose earlier 2026-08-15T10:00:00Z window HAS elapsed, proving the two clock comparisons are evaluated per-deadline rather than once per obligation."
        test_recipe:
          setup:
            - "Booking total_fare_cents = 50000 paid by CREDIT_CARD with one segment cancelled 2026-08-10T10:00:00Z, giving one PENDING_ELECTION obligation with election_deadline_utc 2026-08-15T10:00:00Z and deadline_utc 2026-08-17T10:00:00Z."
