      - name: lease_execute_deposit_rule_versus_frozen_home_priority
        claim_type: priority_ordering
        grounds:
          - validations[V502]
          - validations[V602]
        excluded_because:
          difficulty_instance: lease_execute_frozen_home_beats_unfunded_deposit
          rationale: >
            The pair (V502 ERR_HOME_LEASING_FROZEN, V602 ERR_DEPOSIT_NOT_FUNDED) is the
            deliberately inverted priority conflict on lease execution, and the difficulty instance
            already fires a doubly-violating execute (frozen home AND an unfunded deposit) to prove
            the posture check answers first, then clears the posture to show the deposit rule was
            waiting underneath it.

      - name: slot_booking_state_rule_versus_unverified_identity_priority
        claim_type: priority_ordering
        grounds:
          - validations[V302]
          - validations[V420]
        excluded_because:
          difficulty_instance: slot_book_unavailable_state_beats_unverified_identity
          rationale: >
            The pair (V302 ERR_SHOWING_SLOT_NOT_AVAILABLE, V420 ERR_PROSPECT_IDENTITY_UNVERIFIED) is
            the second inverted conflict, where a business constraint outranks a state guard. The
            difficulty instance books an already-booked slot as an unverified prospect and asserts the
            identity error wins, so repeating the same double violation here would add nothing.

