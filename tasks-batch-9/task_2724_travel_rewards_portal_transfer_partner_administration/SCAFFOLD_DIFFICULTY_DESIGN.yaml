      - name: boundary_benefit_allowance_last_unit_admitted_then_exhausted
        grounds:
          - calculations.benefit_allowance_remaining
          - validations[priority=71]
          - errors.ERR_BENEFIT_ALLOWANCE_EXHAUSTED
          - entities.BenefitEntitlement.fields.remaining_allowance
        distinguishing_aspect: |
          A different metric and a different endpoint: an integer consumption counter reaching
          exactly zero remaining, checked on POST /rewards/benefit-entitlements/{id}/consume. The
          admission test is `remaining_allowance >= 1`, so the single-allowance row admits its
          first consume and rejects the second with 409 ERR_BENEFIT_ALLOWANCE_EXHAUSTED while
          remaining_allowance stays floored at 0 rather than going negative.
        test_recipe:
          setup:
            - "One CORE account with posture CLEAR."
            - "One ACTIVE TRAVEL_INSURANCE entitlement with annual_allowance 1 and requires_portal_booking false."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Pia Renner", email: "pia@example.com", card_product_code: "CORE", enrolled_at: "2025-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/benefit-entitlements"
              payload: { account_id: "${a_id}", benefit_type: "TRAVEL_INSURANCE", annual_allowance: 1, expires_at: "2027-01-01T00:00:00Z", requires_portal_booking: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { be_id: $.data.id }
          trigger:
            - call: "POST /rewards/benefit-entitlements/${be_id}/consume"
              as: Cardholder
              as_user_id: "${a_id}"
            - call: "POST /rewards/benefit-entitlements/${be_id}/consume"
              as: Cardholder
              as_user_id: "${a_id}"
          assert:
            - "the first consume returns 200 and the second returns 409 with error_id ERR_BENEFIT_ALLOWANCE_EXHAUSTED"
            - "BenefitEntitlement.${be_id}.used_count == 1"
            - "BenefitEntitlement.${be_id}.remaining_allowance == 0"
            - "BenefitEntitlement.${be_id}.status == ACTIVE"
            - "BenefitEntitlement.${be_id}.last_consumed_at == 2026-08-01T00:00:00Z"

      - name: boundary_statement_credit_exact_minimum_and_exact_balance_admitted
        grounds:
          - calculations.available_points_for_redemption
          - calculations.redemption_points_price_and_parity
          - validations[priority=68]
          - validations[priority=70]
        distinguishing_aspect: |
          A third metric on a third endpoint: two independent `>=` boundaries met at exact equality
          in one POST /rewards/redemption-orders call. points_requested is exactly
          STATEMENT_CREDIT_MIN_POINTS (2500) and exactly equals available_points (2500), so both
          the 422 minimum check and the 402 sufficiency check must admit the request rather than
          treating equality as a breach.
        test_recipe:
          setup:
            - "One CORE account whose only transaction of 250000 cents earned exactly 2500 points."
            - "No other reservations, so available_points is exactly 2500."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Omar Fiske", email: "omar@example.com", card_product_code: "CORE", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 250000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rewards/redemption-orders"
              payload: { account_id: "${a_id}", channel: "STATEMENT_CREDIT", points_requested: 2500 }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { ro_id: $.data.id }
          assert:
            - "the response status is 201"
            - "RedemptionOrder.${ro_id}.points_debited == 2500"
            - "RedemptionOrder.${ro_id}.statement_credit_cents == 2500"
            - "RedemptionOrder.${ro_id}.cash_copay_cents == 0"
            - "RedemptionOrder.${ro_id}.inventory_offer_id == null"
            - "RedemptionOrder.${ro_id}.fulfillment_status == QUOTED"
            - "RedemptionOrder.${ro_id}.settlement_status == UNSETTLED"
            - "Account.${a_id}.points_balance == 2500"
            - "Account.${a_id}.points_pending_redemption == 2500"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_transfer_screening_requires_active_partner_agreement
        grounds:
          - state_machines.TransferRequest.SUBMITTED_to_QUEUED
          - state_machines.PartnerAgreement.ACTIVE_to_SUSPENDED
          - validations[priority=44]
          - errors.ERR_AGREEMENT_NOT_ACTIVE
        distinguishing_aspect: |
          Entity pair TransferRequest -> PartnerAgreement. The SUBMITTED -> QUEUED transition is
          guarded by a state that lives on a different aggregate: suspending the agreement after
          the request was already accepted makes screening clearance fail with 409
          ERR_AGREEMENT_NOT_ACTIVE, while the request itself stays SUBMITTED and its points stay
          reserved.
        test_recipe:
          setup:
            - "One CORE account holding 10000 points, posture CLEAR."
            - "One ACTIVE PartnerAgreement and one SUBMITTED TransferRequest of 4000 points against it."
            - "The agreement is then suspended, which is the only state change between submission and screening."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Ada Vogel", email: "ada@example.com", card_product_code: "CORE", enrolled_at: "2025-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 1000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements"
              payload: { partner_name: "Skyward Miles", partner_program_code: "SKYW", ratio_points_out: 1000, ratio_partner_units_in: 1000, min_transfer_points: 1000, transfer_increment_points: 1000, transfer_latency_hours: 48, reversal_window_hours: 72, settlement_cost_cents_per_1k: 900 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements/${pa_id}/approve"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "GET /rewards/accounts/${a_id}"
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { a_v: $.data.version }
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "${a_id}", partner_agreement_id: "${pa_id}", points_out: 4000, expected_account_version: "${a_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/suspend"
              payload: { suspension_reason: "PARTNER_API_OUTAGE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rewards/transfer-requests/${tr_id}/clear-screening"
              as: FraudAnalyst
              as_user_id: "fraud-1"
          assert:
            - "the response status is 409"
            - "the response error_id is ERR_AGREEMENT_NOT_ACTIVE"
            - "PartnerAgreement.${pa_id}.status == SUSPENDED"
            - "TransferRequest.${tr_id}.status == SUBMITTED"
            - "TransferRequest.${tr_id}.screening_cleared_at == null"
            - "TransferRequest.${tr_id}.scheduled_post_at == null"
            - "Account.${a_id}.points_balance == 6000"
            - "Account.${a_id}.points_pending_redemption == 4000"

      - name: cross_entity_ticketing_requires_active_travel_agency
        grounds:
          - state_machines.RedemptionOrder.CONFIRMED_to_TICKETED
          - state_machines.TravelAgencyPartner.ACTIVE_to_SUSPENDED
          - validations[priority=45]
          - errors.ERR_AGENCY_SUSPENDED
        distinguishing_aspect: |
          A different entity pair, RedemptionOrder -> TravelAgencyPartner, reached through the
          offer rather than through a direct FK on the order. Suspending the agency cascades the
          offer OPEN -> SUSPENDED but explicitly leaves the already-CONFIRMED order alone, so the
          order is blocked at ticketing with 409 ERR_AGENCY_SUSPENDED while its points stay
          debited and the agency's payable_cents is never credited.
        test_recipe:
          setup:
            - "One PREMIER account holding 72000 points from a single 1600000-cent DINING transaction at base_multiplier 3.0."
            - "One ACTIVE agency (markup 2000 bps, tolerance 1000 bps) with one OPEN, IN_PARITY offer priced at 48000 cents with a 4000-cent copay."
            - "One CONFIRMED order on that offer with points_debited 35200 and issuer_cost_provisional_cents 36000."
            - "The agency is then suspended."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5812", display_name: "Restaurants", base_category: "DINING", base_multiplier: 3.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
