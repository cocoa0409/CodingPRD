# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_0410_oncology_infusion_chemo_center
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids x >= 2 instances each = 19 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_bsa_vs_auc_ordered_dose
        grounds:
          - calculations.ordered_dose
          - entities.DrugOrder.fields.ordered_dose_mg
          - entities.OrderSetItem.fields.dosing_method
        distinguishing_aspect: |
          The same DrugOrder create endpoint produces a BSA-method dose (319 mg from
          dose_per_m2=175 * bsa_snapshot=1.82) versus an AUC/Calvert-method dose
          (525 mg from target_auc=5 * (min(gfr_snapshot=80,125)+25)); two valid
          dosing algorithms keyed on a different snapshot field (BSA vs GFR) yield
          different ordered_dose_mg on the DrugOrder domain.
        test_recipe:
          setup:
            - "Patient height_cm=170, weight_kg=70 (bsa_m2=1.82), gfr_ml_min=80"
            - "Published protocol with one BSA CHEMO item (dose_per_m2=175, vial 50) and one AUC CHEMO item (target_auc=5, vial 150)"
            - "ACTIVE cycle freezing bsa_snapshot=1.82, gfr_snapshot=80"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M1", full_name: "P One", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "DUO1", name: "Duo", cycle_length_days: 21, total_cycles: 2 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugB", role: "CHEMO", dosing_method: "BSA", dose_per_m2: 175, vial_size_mg: 50, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi_bsa: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugA", role: "CHEMO", dosing_method: "AUC", target_auc: 5, vial_size_mg: 150, day_offset: 1, sequence_index: 2 }
              as: Pharmacist
              captures: { osi_auc: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi_bsa}" }
              as: Pharmacist
              captures: { do_bsa: $.data.id, dose_bsa: $.data.ordered_dose_mg }
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi_auc}" }
              as: Pharmacist
              captures: { do_auc: $.data.id, dose_auc: $.data.ordered_dose_mg }
          assert:
            - "DrugOrder.${do_bsa}.ordered_dose_mg == 319"
            - "DrugOrder.${do_auc}.ordered_dose_mg == 525"
            - "DrugOrder.${do_bsa}.ordered_dose_mg != DrugOrder.${do_auc}.ordered_dose_mg"

      - name: dual_variant_frozen_snapshot_vs_live_patient_bsa
        grounds:
          - calculations.patient_bsa_mosteller
          - calculations.ordered_dose
          - entities.TreatmentCycle.fields.bsa_snapshot_m2
          - entities.Patient.fields.bsa_m2
        distinguishing_aspect: |
          Dosing uses the cycle's FROZEN bsa_snapshot_m2 (1.82, captured at activation)
          while the Patient's LIVE bsa_m2 is recomputed to 2.00 after a height/weight
          PATCH; an order placed post-PATCH still doses off 1.82 (=> 319 mg), proving
          the snapshot variant on TreatmentCycle diverges from the live variant on
          Patient — two conserved-value sources on different entity domains.
        test_recipe:
          setup:
            - "Patient bsa 1.82 at activation; later PATCHed to 180/80 => live bsa 2.00"
            - "ACTIVE cycle with frozen bsa_snapshot=1.82"
            - "One BSA CHEMO item dose_per_m2=175 vial 50"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M2", full_name: "P Two", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "FRZ1", name: "Frz", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugB", role: "CHEMO", dosing_method: "BSA", dose_per_m2: 175, vial_size_mg: 50, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi_bsa: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
            - call: "PATCH /infusion-center/patients/${pat_id}"
              payload: { height_cm: 180, weight_kg: 80 }
              as: Pharmacist
              captures: { live_bsa: $.data.bsa_m2 }
          trigger:
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi_bsa}" }
              as: Pharmacist
              captures: { do_id: $.data.id, dose: $.data.ordered_dose_mg }
          assert:
            - "Patient.${pat_id}.bsa_m2 == 2.0"
            - "DrugOrder.${do_id}.ordered_dose_mg == 319"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_dose_reduction_then_round_order_fixed
        grounds:
          - calculations.ordered_dose
          - entities.DrugOrder.fields.dose_reduction_pct
          - entities.DrugOrder.fields.ordered_dose_mg
        distinguishing_aspect: |
          Mode (b) nested rounding order: reduction is applied to the UNROUNDED base
          then rounded (AUC base 525 * 0.80 = 420 -> 420), NOT round-then-reduce
          (round(525)*0.80 = 420 here but the pinned order is base->reduce->round);
          the scaffold pins reduce-before-round so dose_reduction_pct=20 on AUC base
          525 yields exactly 420 mg.
        test_recipe:
          setup:
            - "Patient gfr 80; published AUC CHEMO item target_auc=5 vial 150; ACTIVE cycle gfr_snapshot 80"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M3", full_name: "P Three", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "RED1", name: "Red", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugA", role: "CHEMO", dosing_method: "AUC", target_auc: 5, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi_auc: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi_auc}", dose_reduction_pct: 20 }
              as: Pharmacist
              captures: { do_id: $.data.id }
          assert:
            - "DrugOrder.${do_id}.ordered_dose_mg == 420"
            - "DrugOrder.${do_id}.vials_drawn == 3"
            - "DrugOrder.${do_id}.waste_mg == 30"

      - name: combinatorial_auc_calvert_min_cap_nonlinear
        grounds:
          - calculations.ordered_dose
          - entities.Patient.fields.gfr_ml_min
          - entities.TreatmentCycle.fields.gfr_snapshot_ml_min
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear interaction with a nested min(): Calvert
          ordered_dose = target_auc * (min(gfr_snapshot,125)+25); with gfr_snapshot=140
          the cap clamps to 125 so dose=5*150=750, NOT the uncapped 5*165=825 — the
          min() makes the formula non-linear in GFR above 125.
        test_recipe:
          setup:
            - "Patient gfr 140; published AUC CHEMO item target_auc=5 vial 150; ACTIVE cycle gfr_snapshot 140"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M4", full_name: "P Four", height_cm: 170, weight_kg: 70, gfr_ml_min: 140 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CAP1", name: "Cap", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugA", role: "CHEMO", dosing_method: "AUC", target_auc: 5, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi_auc: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi_auc}" }
              as: Pharmacist
              captures: { do_id: $.data.id }
          assert:
            - "DrugOrder.${do_id}.ordered_dose_mg == 750"
            - "DrugOrder.${do_id}.waste_mg == 0"
            - "DrugOrder.${do_id}.jw_modifier == false"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_drug_order_prepare_reject_revert_loop
        grounds:
          - state_machines.DrugOrder.PREPARED_to_ORDERED
          - state_machines.DrugOrder.ORDERED_to_PREPARED
          - entities.DrugOrder.fields.prepared_by_nurse_id
        distinguishing_aspect: |
          DrugOrder is cyclic on the ORDERED<->PREPARED axis: prepare moves
          ORDERED->PREPARED (sets prepared_by_nurse_id), a second nurse's reject
          moves PREPARED->ORDERED (clears prepared_by_nurse_id), and prepare can run
          again — a revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE cycle with one FLAT CHEMO order in ORDERED; two nurses N1, N2 (N2 certified)"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M5", full_name: "P Five", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "N1", is_chemo_certified: true }
              as: Pharmacist
              captures: { n1: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "N2", is_chemo_certified: true }
              as: Pharmacist
              captures: { n2: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "LOOP1", name: "Loop", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugF", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi}" }
              as: Pharmacist
              captures: { do_id: $.data.id }
            - call: "POST /infusion-center/drug-orders/${do_id}/prepare"
              payload: {}
              as: Nurse
              as_user_id: "${n1}"
          trigger:
            - call: "POST /infusion-center/drug-orders/${do_id}/reject"
              payload: {}
              as: Nurse
              as_user_id: "${n2}"
              captures: { st_after_reject: $.data.status }
            - call: "POST /infusion-center/drug-orders/${do_id}/prepare"
              payload: {}
              as: Nurse
              as_user_id: "${n2}"
              captures: { st_after_reprepare: $.data.status, preparer: $.data.prepared_by_nurse_id }
          assert:
            - "DrugOrder.${do_id} status was ORDERED immediately after reject"
            - "DrugOrder.${do_id}.status == PREPARED after re-prepare"
            - "DrugOrder.${do_id}.prepared_by_nurse_id == ${n2}"

      - name: nonlinear_treatment_cycle_active_onhold_cycle
        grounds:
          - state_machines.TreatmentCycle.ACTIVE_to_ON_HOLD
          - state_machines.TreatmentCycle.ON_HOLD_to_ACTIVE
          - entities.TreatmentCycle.fields.status
        distinguishing_aspect: |
          TreatmentCycle cycles on the ACTIVE<->ON_HOLD axis: hold moves
          ACTIVE->ON_HOLD, resume moves ON_HOLD->ACTIVE, and the cycle can hold
          again — a back-and-forth loop on a different entity than DrugOrder.
        test_recipe:
          setup:
            - "ACTIVE cycle with no unresolved toxicity"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M6", full_name: "P Six", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "HOLD1", name: "Hold", cycle_length_days: 21, total_cycles: 2 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/hold"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/resume"
              payload: {}
              as: Pharmacist
              captures: { st_resumed: $.data.status }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/hold"
              payload: {}
              as: Pharmacist
              captures: { st_held_again: $.data.status }
          assert:
            - "TreatmentCycle.${cyc_id}.status == ON_HOLD after the second hold"
            - "TreatmentCycle.${cyc_id} returned to ACTIVE between the resume and the second hold"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_toxicity_grade3_holds_cycle_cancels_children
        grounds:
          - entities.ToxicityEvent.fields.triggered_hold
          - state_machines.TreatmentCycle.ACTIVE_to_ON_HOLD
          - state_machines.DrugOrder.ORDERED_to_CANCELLED
          - state_machines.InfusionAppointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from a SINGLE trigger: recording a grade>=3 ToxicityEvent (A)
          mutates the TreatmentCycle to ON_HOLD (B); that hold itself cascades each
          non-terminal DrugOrder to CANCELLED (C) and each non-terminal
          InfusionAppointment to CANCELLED (C'). Each hop is caused by the prior hop,
          not directly by the toxicity insert.
        test_recipe:
          setup:
            - "ACTIVE cycle with one ORDERED DrugOrder and one SCHEDULED InfusionAppointment"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M7", full_name: "P Seven", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/chairs"
              payload: { label: "C-1" }
              as: Pharmacist
              captures: { chair_id: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "N7", is_chemo_certified: true, max_acuity_load: 6 }
              as: Pharmacist
              captures: { nurse_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "TOX1", name: "Tox", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
              captures: { cyc_v1: $.data.version }
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi}" }
              as: Pharmacist
              captures: { do_id: $.data.id }
            - call: "POST /infusion-center/infusion-appointments"
              payload: { treatment_cycle_id: "${cyc_id}", chair_id: "${chair_id}", nurse_id: "${nurse_id}", start_at: "2026-07-01T09:00:00Z", end_at: "2026-07-01T10:30:00Z", acuity: 2, expected_treatment_cycle_version: "${cyc_v1}" }
              as: Pharmacist
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /infusion-center/toxicity-events"
              payload: { treatment_cycle_id: "${cyc_id}", drug_order_id: "${do_id}", ctcae_grade: 4, description: "anaphylaxis" }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { tox_id: $.data.id, hold: $.data.triggered_hold }
          assert:
            - "ToxicityEvent.${tox_id}.triggered_hold == true"
            - "TreatmentCycle.${cyc_id}.status == ON_HOLD"
            - "DrugOrder.${do_id}.status == CANCELLED"
            - "InfusionAppointment.${appt_id}.status == CANCELLED"

      - name: cascade_administer_consumes_pa_then_exhausts
        grounds:
          - state_machines.DrugOrder.VERIFIED_to_ADMINISTERED
          - state_machines.PriorAuthorization.APPROVED_to_EXHAUSTED
          - calculations.prior_auth_consumed_units
          - entities.PriorAuthorization.fields.consumed_units_mg
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (administer, not toxicity): the
          administer transition (A) increments PriorAuthorization.consumed_units_mg
          to 525 (B), and that increment itself crosses the authorized_units_mg=525
          boundary, auto-transitioning the PA APPROVED->EXHAUSTED (C, caused by B not
          by the administer directly).
        test_recipe:
          setup:
            - "Approved PA for drug 'SpecialtyX' authorized_units_mg=525; ACTIVE cycle; one CHEMO AUC order (525 mg) VERIFIED and linked to the PA"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M8", full_name: "P Eight", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "Na", is_chemo_certified: true }
              as: Pharmacist
              captures: { na: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "Nb", is_chemo_certified: true }
              as: Pharmacist
              captures: { nb: $.data.id }
            - call: "POST /infusion-center/prior-authorizations"
              payload: { patient_id: "${pat_id}", drug_name: "SpecialtyX", payer: "Acme" }
              as: PriorAuthCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /infusion-center/prior-authorizations/${pa_id}/decide"
              payload: { decision: "APPROVE", authorized_units_mg: 525 }
              as: PriorAuthCoordinator
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "PA1", name: "Pa", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "SpecialtyX", role: "CHEMO", dosing_method: "AUC", target_auc: 5, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/drug-orders"
