    roles: [ComplianceOfficer, ProgramDirector]
    input: [category, severity, occurred_at, complainant_note, "program_id?", "episode_id?", "underwriting_spot_id?", "respondent_volunteer_id?", "sanction?"]
    output: ComplianceIncident
    status: 201
    errors: [ERR_VALIDATION, ERR_INCIDENT_TARGET_REQUIRED, ERR_PROGRAM_NOT_FOUND, ERR_EPISODE_NOT_FOUND, ERR_SPOT_NOT_FOUND, ERR_VOLUNTEER_NOT_FOUND, ERR_UNAUTHORIZED]
