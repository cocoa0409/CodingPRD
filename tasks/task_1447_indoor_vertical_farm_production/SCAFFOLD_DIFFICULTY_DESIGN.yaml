            - { call: "POST /farm/sanitation-cycles/${cy1}/start", as: SanitationLead }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T03:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sanitation-cycles/${cy1}/record-result", payload: { result: "PASSED", coliform_cfu: 0 }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T06:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches/${b1}/mark-harvest-ready", as: Grower }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T06:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches/${b1}/harvest", payload: { grade_a_lb: 46.0, grade_b_lb: 0.0, cull_lb: 0.0 }, as: Grower, as_user_id: "grower-7" }
            - { call: "POST /farm/batches/${b1}/safety-release", payload: { decision: "RELEASED", lab_ref: "LAB-71" }, as: QualityAssurance, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /farm/batches/${b1}/pack", payload: { packed_lb: 46.0 }, as: Grower, captures: { err: "$.data.error_id" } }
          assert:
            - "pack at 2026-08-24T06:30:00Z is 75h00m after the last PASS (2026-08-21T03:30:00Z) -> error_id == ERR_SANITATION_RECENCY_MISSING (strictly-greater-than-72h rule; exactly 72h00m would pass)"

      - name: assignment_requires_shift_published
        grounds:
          - state_machines.ShiftAssignment
          - state_machines.LaborShift
          - validations[priority=6]
        distinguishing_aspect: |
          Pair ShiftAssignment -> LaborShift (vs batch->rack and batch->cycle above): assignment
          creation on a DRAFT shift is rejected ERR_SHIFT_NOT_PUBLISHED; the same payload succeeds
          after publish — the parent shift's state gates the child collection write.
        test_recipe:
          setup:
            - "Worker W1 (HARVEST_CREW certified); LaborShift DRAFT (never published)"
