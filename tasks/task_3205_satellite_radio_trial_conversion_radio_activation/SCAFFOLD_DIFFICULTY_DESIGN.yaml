          assert:
            - "campaign CB activates (state == ACTIVE): window_start_at == CA.window_end_at is NOT an overlap (half-open)"
            - "campaign CC rejected with ERR_CAMPAIGN_OVERLAP: one second of intersection suffices"

      - name: radio_single_nonterminal_subscription_occupancy
        grounds:
          - calculations.trial_eligibility
          - validations[priority=10]
          - errors[ERR_RADIO_INELIGIBLE]
        distinguishing_aspect: |
          Different resource (Radio, not campaign window) and different interval
          semantics: occupancy is a COUNT (non-terminal subscriptions == 0), not
          half-open timestamp arithmetic — a new subscription's lifetime
          [start_at, end_at) is rejected outright when the radio is occupied,
          regardless of whether intervals would even intersect. GEN1/GEN2 and
          terminal subs (EXPIRED) free the slot.
        test_recipe:
          setup:
            - "customer C10; radio R10 (GEN2) on NEW vehicle; trial plan T10 (30d); trial sub T sub ACTIVE (acked) occupying R10 until 2026-10-01"
            - "second trial plan T10b"
          setup_api_calls:
