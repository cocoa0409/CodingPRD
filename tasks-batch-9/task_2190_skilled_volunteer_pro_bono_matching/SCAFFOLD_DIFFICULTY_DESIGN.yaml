      - name: admin_overhead_minimum_charge_clamp_at_45
        grounds:
          - calculations.engagement_admin_overhead
          - calculations.engagement_admin_overhead.constants.OVERHEAD_FLOOR_USD
          - calculations.engagement_admin_overhead.constants.OVERHEAD_TIER_MID_FLOOR_USD
          - calculations.volunteer_hour_valuation
        distinguishing_aspect: |
          The only boundary in this rule that is a CLAMP rather than a band selector: nothing
          changes state, an amount is silently lifted, and the floor is expressed in dollars
          while the steerable input is hours. That indirection creates a dead zone no other
          instance has - a range of base amounts where the clamped and unclamped answers are
          the same cent, so a missing max() is invisible. This instance pins the exact edges of
          that dead zone, and it is also the only instance whose boundary must hold when the
          input degenerates to zero.

          Reachable-value analysis (canonical volunteer: professional_rate_usd_per_hour 150.00,
          seniority SENIOR so MARKET_RATE_CAP_USD 320.00 and min(150.00, 320.00) = 150.00;
          CLASS_FACTOR DELIVERY 1.00, ADMIN 0.50, TRAVEL 0.00; TimeLog.hours has 2 decimals).
          A MARKET_RATE line is therefore round(hours * 150.00 * factor, 2), i.e. 1.50 per
          DELIVERY cent-hour and 0.75 per ADMIN cent-hour, so base_amount_usd moves on a
          0.75-grained lattice. The clamp is invisible unless round(base * 0.12, 2) < 45.00,
          which needs base * 0.12 < 44.995, i.e. base < 374.958333...; it is strictly exceeded
          only when base * 0.12 >= 45.005, i.e. base > 375.041666.... Hence:
            ARM A  base 374.25 (DELIVERY 2.49 -> 373.50, ADMIN 0.01 -> 0.75) - the largest
                   reachable base BELOW the dead zone:
                   tier_rate 0.12 (374.25 < 2500.00)
                   round(374.25 * 0.12, 2) = round(44.9100, 2) = 44.91
                   admin_overhead_usd = max(45.00, 44.91) = 45.00   <- clamp actually bites
                   total_amount_usd = round(374.25 + 45.00, 2) = 419.25
                   hours_included = 2.50, rate_applied_usd = 150.00
            ARM B  base 375.00 (DELIVERY 2.50) - exactly ON the floor:
                   round(375.00 * 0.12, 2) = 45.00, admin_overhead_usd = max(45.00, 45.00)
                   = 45.00 (the inclusive max returns the tie), total = 420.00,
                   hours_included = 2.50
            ARM C  base 375.75 (DELIVERY 2.50 + ADMIN 0.01) - the smallest reachable base
                   ABOVE the dead zone:
                   round(375.75 * 0.12, 2) = round(45.0900, 2) = 45.09
                   admin_overhead_usd = 45.09 (clamp inert), total = 420.84,
                   hours_included = 2.51
          ARMs A, B and C are one cent of an hour apart in the log set and 45.00 / 45.00 /
          45.09 apart in the answer: the dead zone [374.26, 375.74] on the lattice, i.e. every
          base strictly between 374.958333 and 375.041666 in exact terms, yields 45.00 whether
          or not the clamp exists, which is why ARM A (not ARM B) is the arm that fails a
          missing max().
            ARM D  degenerate base: the only approved log is TRAVEL 3.00, CLASS_FACTOR 0.00.
                   MARKET_RATE: eligible set is empty -> base_amount_usd = 0.00,
                   hours_included = 0.00, rate_applied_usd = min(150.00, 320.00) = 150.00,
                   admin_overhead_usd = max(45.00, round(0.00 * 0.12, 2) = 0.00) = 45.00,
                   total_amount_usd = round(0.00 + 45.00, 2) = 45.00 - a valuation whose
                   entire value is overhead. Priority 19 does not apply to valuations, so this
                   post is legal.
                   INDEPENDENT_SECTOR on the same engagement admits TRAVEL:
                   hours_included = 3.00, rate_applied_usd = 34.79,
                   base_amount_usd = round(3.00 * 34.79, 2) = 104.37,
                   round(104.37 * 0.12, 2) = round(12.5244, 2) = 12.52 -> clamped to 45.00,
                   total_amount_usd = round(104.37 + 45.00, 2) = 149.37.
            ARM E  tier floor 2500.00, which pins the "tier from base, never from total"
                   ordering that the clamp shares its formula with:
                   base 2499.75 (DELIVERY 12.00 + 4.66, ADMIN 0.01) -> tier_rate 0.12,
                     round(2499.75 * 0.12, 2) = 299.97 (floor inert), total = 2799.72
                   base 2500.50 (DELIVERY 12.00 + 4.67)             -> tier_rate 0.09,
                     round(2500.50 * 0.09, 2) = round(225.045, 2) = 225.05, total = 2725.55
                   0.75 more base buys 74.92 LESS overhead, so the tier floor is inclusive and
                   is read off base_amount_usd. Exactly 2500.00 is unreachable at a 150.00
                   rate (the lattice is 0.75-grained), so the floor is bracketed at its two
                   nearest reachable points. The companion case base 2380.50
                   (DELIVERY 12.00 + 3.87) -> tier 0.12, overhead round(285.66, 2) = 285.66,
                   total 2666.16 shows the trap in the other direction: the TOTAL lands in the
                   0.09 band while the tier used is 0.12.
