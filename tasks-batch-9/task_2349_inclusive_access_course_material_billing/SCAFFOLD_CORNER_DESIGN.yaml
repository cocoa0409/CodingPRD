      - name: calc_opt_out_deadline_add_drop_cap_then_minimum_floor
        claim_type: interval_merge
        grounds:
          - calculations.opt_out_deadline
          - validations[priority=77]
          - endpoints[POST /opt-out-requests]
        distinguishing_aspect: |
          The deadline is the max of a floor and the min of two ceilings, and all three candidates
          are made to win in turn on the same term: a day-one charge caps at the add/drop end-of-day
          instant, a charge posted 2026-08-31T20:00Z gets the 5-day floor (2026-09-05T20:00Z) even
          though that is AFTER the add/drop cap, and a charge posted 2026-09-08T10:00Z - long past
          add/drop - still gets a full 5-day floor. The boundary itself is inclusive.
        test_recipe:
          setup:
            - "The fixture of calc_day_one_charge_priced_prorated_and_shared with charge ${chg1_id} posted 2026-08-24T09:00:00Z. Term FA26 stays OPEN throughout."
            - "S-1002 enrolls 2026-08-31 (REGULAR) and S-1003 enrolls 2026-09-08 (LATE); their charges post at 2026-08-31T20:00:00Z and 2026-09-08T10:00:00Z respectively."
