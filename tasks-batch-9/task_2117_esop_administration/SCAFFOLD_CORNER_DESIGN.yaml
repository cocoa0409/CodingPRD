              payload: { plan_name: "Patch Plan", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-777", date_of_birth: "1980-04-11", hire_date: "2015-01-05", eligible_compensation_cents: 10000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { p_id: $.data.id }
          trigger:
            - call: "PATCH /participants/${p_id}"
              payload: { eligible_compensation_cents: 41000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
          assert:
            - "HTTP 200 with Participant.${p_id}.eligible_compensation_cents == 41000000"
            - "Participant.${p_id}.annual_hours == 2000, employee_number == E-777, hire_date == 2015-01-05 and status == ACTIVE"
            - "Participant.${p_id}.version == 2 and updated_at is later than created_at"

  # =========================================================================
  - section: state_machines
    instances:

      - name: plan_year_cycle_returns_to_open_with_incremented_year
        claim_type: cyclic
        grounds:
          - state_machines.EsopPlan.ALLOCATION_LOCKED_to_OPEN
          - entities.EsopPlan.fields.plan_year
          - endpoints.POST /plans/{plan_id}/rollover
        distinguishing_aspect: "The plan traverses OPEN -> VALUATION_PENDING -> ALLOCATION_LOCKED -> OPEN, returning to a state it already occupied with plan_year advanced from 2026 to 2027 and diversification anchors recomputed."
        test_recipe:
          setup:
            - "A plan in ALLOCATION_LOCKED for plan_year 2026 after a finalized run of 500 shares, with forfeiture_posture CLEAR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
