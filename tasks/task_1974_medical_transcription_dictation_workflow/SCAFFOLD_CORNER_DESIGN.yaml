  # ========================================================== validations ====
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A call without X-User-ID / X-User-Role fails 400 before any role or existence check runs."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /clinic-accounts/00000000-0000-4000-8000-000000000000", payload: {}, as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "request sent WITHOUT headers -> error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400 (priority 1 precedes even the 404 existence check)"

      - name: job_action_on_nonexistent_job_returns_404_before_state
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_JOB_NOT_FOUND]"
        distinguishing_aspect: "Existence (P4) beats state (P6): submit against an unknown job id returns 404, never ERR_JOB_NOT_EDITING."
        test_recipe:
          setup: ["Editor E exists"]
          setup_api_calls:
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
          trigger:
            - { call: "POST /dictation-jobs/00000000-0000-4000-8000-000000000000/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_JOB_NOT_FOUND and http status == 404"

      - name: claim_with_mismatched_editor_id_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_FORBIDDEN_OWNERSHIP]"
        distinguishing_aspect: "Entity-backed ownership: Editor role claiming with editor_id != X-User-ID is rejected 403 even though both editors exist."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P; editors E1, E2; job J QUEUED"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E1" }, as: VendorAdmin, captures: { e1: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E2" }, as: VendorAdmin, captures: { e2: $.data.id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
          trigger:
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e2}" }, as: Editor, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_OWNERSHIP (403): E1 may not file a claim naming E2"

      - name: claim_at_capacity_returns_capacity_full
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_EDITOR_CAPACITY_FULL]"
          - entities.Editor.fields.max_concurrent_claims
        distinguishing_aspect: "Provisional TIER_2 editor (max 3): three claims succeed, the fourth fails with ERR_EDITOR_CAPACITY_FULL — the aggregate constraint fires even though each claim is individually well-formed."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; four ROUTINE jobs QUEUED"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j1: $.data.id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j2: $.data.id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j3: $.data.id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j4: $.data.id } }
            - { call: "POST /dictation-jobs/${j1}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j2}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j3}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /dictation-jobs/${j4}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}", captures: { err: $.data.error_id } }
            - { call: "GET /editors/${e}", payload: {}, as: VendorAdmin, captures: { active: $.data.active_claim_count } }
          assert:
            - "error_id == ERR_EDITOR_CAPACITY_FULL (409) on the fourth claim"
            - "Editor.active_claim_count == 3 (unchanged by the rejected claim)"

      - name: claim_outside_shift_window_returns_temporal_error
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_OUTSIDE_SHIFT_WINDOW]"
        distinguishing_aspect: "An ACTIVE, under-capacity editor claiming a ROUTINE job still fails when the current logical time falls outside every declared window (temporal gate isolated from safety/capacity)."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P; editor E whose only window is [2026-08-03, 2026-08-04) — does NOT cover T0; job J QUEUED"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-04T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
          trigger:
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OUTSIDE_SHIFT_WINDOW (422); job remains QUEUED"

      - name: qa_self_review_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SELF_REVIEW_FORBIDDEN]"
        distinguishing_aspect: "Segregation of duties: the QA review is rejected when the reviewer's X-User-ID equals the transcript author's editor_id — even though the QASupervisor role is otherwise valid."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; job J submitted (transcript authored by E)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 0, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "${e}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SELF_REVIEW_FORBIDDEN (403): reviewer id equals transcript.editor_id"
            - "job stays SUBMITTED; no QAReview recorded (GET /dictation-jobs/{J}/qa-reviews -> 0 items)"

      - name: upload_without_sla_policy_returns_referential_error
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_SLA_POLICY_MISSING]"
        distinguishing_aspect: "Referential completeness: clinic has a STAT policy but no ROUTINE row — the ROUTINE upload fails even though provider is ACTIVE and no billing hold exists."
        test_recipe:
          setup:
            - "Clinic C with ONLY a STAT SLAPolicy; provider P ACTIVE"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: STAT, tat_minutes: 120, rate_per_line_cents: 20, breach_credit_pct: 25, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SLA_POLICY_MISSING (422)"

      - name: duplicate_sla_policy_returns_conflict
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_DUPLICATE_SLA_POLICY]"
        distinguishing_aspect: "Uniqueness over (clinic_account_id, priority): the second STAT row for the same clinic is rejected; the same priority for a DIFFERENT clinic is fine."
        test_recipe:
          setup:
            - "Clinics C1, C2; C1 already has a STAT policy"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C1" }, as: VendorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /clinic-accounts", payload: { name: "C2" }, as: VendorAdmin, captures: { c2: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c1}", priority: STAT, tat_minutes: 120, rate_per_line_cents: 20, breach_credit_pct: 25, measurement_basis: END_TO_END }, as: VendorAdmin }
          trigger:
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c1}", priority: STAT, tat_minutes: 60, rate_per_line_cents: 30, breach_credit_pct: 50, measurement_basis: PRODUCTION_WINDOW }, as: VendorAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c2}", priority: STAT, tat_minutes: 60, rate_per_line_cents: 30, breach_credit_pct: 50, measurement_basis: PRODUCTION_WINDOW }, as: VendorAdmin }
          assert:
            - "second STAT row for C1 -> ERR_DUPLICATE_SLA_POLICY (409)"
            - "STAT row for C2 succeeds (uniqueness is per clinic)"

      - name: macro_duplicate_shortcut_conflict_then_reuse_after_archive
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_DUPLICATE_MACRO_SHORTCUT]"
          - entities.Macro.fields.status
        distinguishing_aspect: "Uniqueness spans only ACTIVE macros: duplicate shortcut rejected while the first is ACTIVE, allowed again once it is ARCHIVED (soft delete frees the key)."
        test_recipe:
          setup:
            - "Clinic C, provider P (created via ClientAdmin; version captured for nothing here — macros carry no OCC)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /macros", payload: { provider_id: "${p}", shortcut: "sig", expansion_text: "Regards, Dr. P" }, as: Provider, as_user_id: "${p}", captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /macros", payload: { provider_id: "${p}", shortcut: "sig", expansion_text: "other" }, as: Provider, as_user_id: "${p}", captures: { err: $.data.error_id } }
            - { call: "POST /macros/${m1}/archive", payload: {}, as: Provider, as_user_id: "${p}" }
            - { call: "POST /macros", payload: { provider_id: "${p}", shortcut: "sig", expansion_text: "other" }, as: Provider, as_user_id: "${p}", captures: { m2: $.data.id, st: $.data.status } }
          assert:
            - "second create while first ACTIVE -> ERR_DUPLICATE_MACRO_SHORTCUT (409)"
            - "after archive, the same shortcut is accepted again: new Macro id != ${m1}, status == ACTIVE"

      - name: billing_hold_alone_blocks_upload_fiscal
        claim_type: violation_to_error
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_CLINIC_BILLING_HOLD]"
          - calculations.billing_hold_evaluation
        distinguishing_aspect: "Fiscal gate in isolation: an ACTIVE provider (no transcripts) on a clinic whose FINALIZED period hits exactly finalized_at + 14d -> hold flips at the inclusive boundary and uploads fail 402."
        test_recipe:
          setup:
            - "Clinic C (grace 14d) with ROUTINE SLA; provider P; EMPTY period closed+finalized at T0 (finalized_at = 2026-08-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: VendorAdmin, captures: { bp: $.data.id } }
            - { call: "POST /billing-periods/${bp}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /billing-periods/${bp}/finalize", payload: {}, as: VendorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T23:59:59Z" }, as: VendorAdmin }
            - { call: "GET /clinic-accounts/${c}", payload: {}, as: VendorAdmin, captures: { hold0: $.data.billing_hold } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: VendorAdmin }
          trigger:
            - { call: "GET /clinic-accounts/${c}", payload: {}, as: VendorAdmin, captures: { hold1: $.data.billing_hold } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { err: $.data.error_id } }
          assert:
            - "at 2026-08-14T23:59:59Z billing_hold == false (one second before the grace boundary)"
            - "at exactly finalized_at + 14d billing_hold == true (>= boundary)"
            - "upload error_id == ERR_CLINIC_BILLING_HOLD (402) — fiscal gate alone, provider never suspended"

      - name: template_reference_mismatches_return_referential_errors
        claim_type: violation_to_error
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_TEMPLATE_PROVIDER_MISMATCH]"
          - "errors[ERR_TEMPLATE_WORK_TYPE_MISMATCH]"
        distinguishing_aspect: "template_id must resolve to the SAME provider and the SAME work_type: another provider's template -> ERR_TEMPLATE_PROVIDER_MISMATCH; own template of a different work_type -> ERR_TEMPLATE_WORK_TYPE_MISMATCH."
        test_recipe:
          setup:
            - "Clinic C with ROUTINE SLA; providers P1, P2; T1 = P1's CONSULT template"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P One", specialty: GENERAL }, as: ClientAdmin, captures: { p1: $.data.id, p1v: $.data.version } }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P Two", specialty: GENERAL }, as: ClientAdmin, captures: { p2: $.data.id } }
            - { call: "POST /provider-templates", payload: { provider_id: "${p1}", work_type: CONSULT, name: "T1", body_text: "body", expected_provider_version: "${p1v}" }, as: Provider, as_user_id: "${p1}", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p2}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60, template_id: "${t1}" }, as: Provider, as_user_id: "${p2}", captures: { err1: $.data.error_id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p1}", work_type: OP_NOTE, priority: ROUTINE, audio_duration_seconds: 60, template_id: "${t1}" }, as: Provider, as_user_id: "${p1}", captures: { err2: $.data.error_id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p1}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60, template_id: "${t1}" }, as: Provider, as_user_id: "${p1}", captures: { ok: $.data.id } }
          assert:
            - "err1 == ERR_TEMPLATE_PROVIDER_MISMATCH (template owned by P1, job filed by P2)"
            - "err2 == ERR_TEMPLATE_WORK_TYPE_MISMATCH (CONSULT template on OP_NOTE job)"
            - "matching provider + work_type succeeds and the job records template_id == ${t1}"

      - name: inverted_intervals_return_invalid_window
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_INVALID_WINDOW]"
        distinguishing_aspect: "Well-formedness precedes overlap: end <= start is rejected on both window types before any overlap check runs."
        test_recipe:
          setup:
            - "Clinic C; editor E"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
          trigger:
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-08-03T12:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: Editor, as_user_id: "${e}", captures: { err1: $.data.error_id } }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: VendorAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "zero-length shift window -> ERR_INVALID_WINDOW (422)"
            - "reversed billing period -> ERR_INVALID_WINDOW (422)"

  # ============================================================ endpoints ====
  - section: endpoints
    instances:
      - name: vendor_admin_release_on_behalf_of_editor
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /dictation-jobs/{id}/release]"
          - "roles[VendorAdmin].shared_operations"
        distinguishing_aspect: "Release is a shared operation: VendorAdmin may release another editor's claimed job (ops recovery), with identical compensation semantics."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; job J claimed by E (EDITING)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /dictation-jobs/${j}/release", payload: {}, as: VendorAdmin, captures: { st: $.data.workflow_status } }
            - { call: "GET /editors/${e}", payload: {}, as: VendorAdmin, captures: { active: $.data.active_claim_count } }
          assert:
            - "release by VendorAdmin succeeds: job QUEUED, claimed_by_editor_id null"
            - "Editor.active_claim_count back to 0"

      - name: cancel_editing_job_releases_claim_compensation
        claim_type: action_endpoint
        grounds:
          - state_machines.DictationJob.EDITING_to_CANCELLED
        distinguishing_aspect: "Cancelling an EDITING job compensates the claim: editor counter decremented; cancelling a QUEUED job touches no editor."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; J1 claimed by E, J2 still QUEUED"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j1: $.data.id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j2: $.data.id } }
            - { call: "POST /dictation-jobs/${j1}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /dictation-jobs/${j1}/cancel", payload: {}, as: Provider, as_user_id: "${p}", captures: { st1: $.data.workflow_status } }
            - { call: "POST /dictation-jobs/${j2}/cancel", payload: {}, as: Provider, as_user_id: "${p}", captures: { st2: $.data.workflow_status } }
            - { call: "GET /editors/${e}", payload: {}, as: VendorAdmin, captures: { active: $.data.active_claim_count } }
          assert:
            - "both jobs CANCELLED"
            - "Editor.active_claim_count == 0 (the EDITING cancel released the claim; the QUEUED cancel touched nothing)"

      - name: fk_reverse_reachability_lists_resolve
        claim_type: computed_read
        grounds:
          - entities.DictationJob.fields.provider_id
          - entities.DictationJob.fields.claimed_by_editor_id
          - entities.QAReview.fields.transcript_id
          - entities.LineItem.fields.billing_period_id
        distinguishing_aspect: "Every FK has a working reverse GET: jobs by provider / by claiming editor, qa-reviews by transcript, line-items by period and by transcript."
        test_recipe:
          setup:
            - "Full happy path: clinic C, ROUTINE SLA, provider P, editor E + window; job J claimed, submitted, QA-passed; period closed"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 0, major_error_count: 1, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
            - { call: "GET /transcripts?dictation_job_id=${j}", payload: {}, as: VendorAdmin, captures: { t: "$.data[0].id" } }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }, as: VendorAdmin, captures: { bp: $.data.id } }
            - { call: "POST /billing-periods/${bp}/close", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "GET /dictation-jobs?provider_id=${p}", payload: {}, as: VendorAdmin, captures: { by_p: "$.data[0].id" } }
            - { call: "GET /dictation-jobs?claimed_by_editor_id=${e}", payload: {}, as: VendorAdmin }
            - { call: "GET /transcripts/${t}/qa-reviews", payload: {}, as: VendorAdmin, captures: { qa_score: "$.data[0].accuracy_score" } }
            - { call: "GET /billing-periods/${bp}/line-items", payload: {}, as: VendorAdmin, captures: { li_t: "$.data[0].transcript_id" } }
            - { call: "GET /transcripts/${t}/line-items", payload: {}, as: VendorAdmin, captures: { li_bp: "$.data[0].billing_period_id" } }
          assert:
            - "GET /dictation-jobs?provider_id=P returns exactly J"
            - "GET /dictation-jobs?claimed_by_editor_id=E returns 0 items after delivery (claim ended) — filter reflects current claim state"
            - "GET /transcripts/{T}/qa-reviews returns 1 review with accuracy_score == 95.0"
            - "line-items of period reference T; line-items of transcript reference BP"

  # =============================================================== errors ====
  - section: errors
    instances:
      - name: resource_not_found_catalog_spot_checks
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CLINIC_NOT_FOUND]"
          - "errors[ERR_TRANSCRIPT_NOT_FOUND]"
          - "errors[ERR_TEMPLATE_NOT_FOUND]"
          - "errors[ERR_MACRO_NOT_FOUND]"
          - "errors[ERR_BILLING_PERIOD_NOT_FOUND]"
          - "errors[ERR_EDITOR_NOT_FOUND]"
        distinguishing_aspect: "Each resource family raises its own typed 404; body-FK misses (claim with unknown editor_id) also resolve to the typed 404."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, one QUEUED job J; no templates/macros/periods"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id, p_v: $.data.version } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
          trigger:
            - { call: "GET /clinic-accounts/00000000-0000-4000-8000-000000000001", payload: {}, as: VendorAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /transcripts/00000000-0000-4000-8000-000000000002", payload: {}, as: VendorAdmin, captures: { e2: $.data.error_id } }
            - { call: "PUT /provider-templates/00000000-0000-4000-8000-000000000003", payload: { expected_template_version: "${p_v}" }, as: Provider, as_user_id: "${p}", captures: { e3: $.data.error_id } }
            - { call: "POST /macros/00000000-0000-4000-8000-000000000004/archive", payload: {}, as: Provider, as_user_id: "${p}", captures: { e4: $.data.error_id } }
            - { call: "POST /billing-periods/00000000-0000-4000-8000-000000000005/close", payload: {}, as: VendorAdmin, captures: { e5: $.data.error_id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "00000000-0000-4000-8000-000000000006" }, as: Editor, as_user_id: "00000000-0000-4000-8000-000000000006", captures: { e6: $.data.error_id } }
          assert:
            - "e1 == ERR_CLINIC_NOT_FOUND, e2 == ERR_TRANSCRIPT_NOT_FOUND, e3 == ERR_TEMPLATE_NOT_FOUND, e4 == ERR_MACRO_NOT_FOUND, e5 == ERR_BILLING_PERIOD_NOT_FOUND — all 404"
            - "e6 == ERR_EDITOR_NOT_FOUND (404): body FK validated, and existence precedes ownership checks"

      - name: job_cancel_from_submitted_returns_not_cancellable
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_JOB_NOT_CANCELLABLE]"
        distinguishing_aspect: "SUBMITTED work is under QA and cannot be cancelled — only QUEUED/EDITING are cancellable."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; job J claimed and submitted"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /dictation-jobs/${j}/cancel", payload: {}, as: Provider, as_user_id: "${p}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_JOB_NOT_CANCELLABLE (409); job remains SUBMITTED"

      - name: resolve_dispute_on_finalized_returns_not_disputed
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BILLING_PERIOD_NOT_DISPUTED]"
        distinguishing_aspect: "resolve-dispute requires DISPUTED; on a FINALIZED period it is rejected (dispute must come first)."
        test_recipe:
          setup:
            - "Clinic C; period closed then finalized (empty membership)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: VendorAdmin, captures: { bp: $.data.id } }
            - { call: "POST /billing-periods/${bp}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /billing-periods/${bp}/finalize", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "POST /billing-periods/${bp}/resolve-dispute", payload: { outcome: UPHELD }, as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BILLING_PERIOD_NOT_DISPUTED (409)"

      - name: resolve_dispute_invalid_outcome_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - "endpoints[POST /billing-periods/{id}/resolve-dispute]"
        distinguishing_aspect: "outcome outside {UPHELD, REVERSED} fails schema validation with 400 before the state machine runs."
        test_recipe:
          setup:
            - "Clinic C; period DISPUTED"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: VendorAdmin, captures: { bp: $.data.id } }
            - { call: "POST /billing-periods/${bp}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /billing-periods/${bp}/finalize", payload: {}, as: VendorAdmin }
            - { call: "POST /billing-periods/${bp}/dispute", payload: {}, as: ClientAdmin }
          trigger:
            - { call: "POST /billing-periods/${bp}/resolve-dispute", payload: { outcome: MAYBE }, as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); period remains DISPUTED"

      - name: error_provider_suspended_triggerability
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PROVIDER_SUSPENDED]"
        excluded_because:
          difficulty_instance: upload_gated_by_provider_standing
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_probation_stat_triggerability
        claim_type: violation_to_error
        grounds:
