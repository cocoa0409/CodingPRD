          - errors[ERR_MASS_BALANCE_VIOLATION]
          - entities.CarcassLot.fields.cold_carcass_weight_lbs
        distinguishing_aspect: |
          Conserved quantity: carcass mass (lbs). Forward actions (each cut record)
          plus the compensating close-out (trim_waste_lbs) must reconcile to
