  - name: monitoring_periods_refuse_a_repeated_month_and_a_scan_that_arrives_before_the_window_opens
    claim_type: error_triggerable
    grounds:
    - validations[priority=28]
    - validations[priority=24]
    - errors[ERR_DUPLICATE_MONITORING_PERIOD]
    - errors[ERR_SCAN_WINDOW_NOT_OPEN]
    - endpoints.POST /authorizations/{id}/monitoring-periods
    distinguishing_aspect: 'period_month is unique per authorization, so re-opening the month the authorization decision already
      opened is a 409 — while a DIFFERENT month is accepted even though the current one is still OPEN. That future period
      then proves the window gate: its window_start is two months past the clock, so a complete, well-formed scan set is still
      refused at priority 24, after the completeness check at priority 21 has passed.'
    test_recipe:
      setup:
