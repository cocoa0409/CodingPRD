          assert:
            - "Borrower.${bc_id}.available_credit_cents == 0 after activating App C1"
            - "activating App C2 returns error_id == ERR_INSUFFICIENT_CREDIT (409)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: grace_window_half_open_late_determination
        grounds:
          - calculations.late_fee_assessment
          - calculations.delinquency_posture
          - state_machines.Installment.SCHEDULED_to_LATE
        distinguishing_aspect: |
          Interval semantics: the grace occupation on an Installment is the HALF-OPEN
          window (due_date, due_date + GRACE_DAYS] — `now` colliding with it (now <=
          due+GRACE) keeps the installment SCHEDULED; a late determination is admitted
          only once `now` exits the window (strict >). Resource = Installment.
        test_recipe:
          setup:
            - "Loan A PAY_IN_4 financed 100000 activated 2026-01-01; inst1 due 2026-01-01; GRACE_DAYS=10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-11T00:00:00Z" }
              as: Servicer
            - call: "GET /loans/${loan_a_id}"
              as: Servicer
              captures: { dq_in: $.data.delinquency_status }
          assert:
            - "at 2026-01-11 (now == due+GRACE) Loan.${loan_a_id}.delinquency_status == CURRENT"
            - "at 2026-01-11 the sequence_no==1 installment status == SCHEDULED"

      - name: settlement_hold_window_closed_inclusive_release
        grounds:
          - validations[priority=8]
          - state_machines.MerchantSettlement.PENDING_to_RELEASED
          - entities.Merchant.fields.settlement_hold_days
        distinguishing_aspect: |
          Interval semantics DIFFER from the grace window: the settlement-hold
          occupation on a MerchantSettlement (resource != Installment) is CLOSED on the
          release side — release is admitted at `now >= created_at + hold_days` (>=
          inclusive boundary), whereas the grace window above is strict >. With
          hold_days=2 and creation 2026-01-01, release collides with the hold at
          2026-01-02 (rejected) but clears it at 2026-01-03.
        test_recipe:
          setup:
            - "Merchant M settlement_hold_days=2; Loan A activated 2026-01-01; settlement S PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600, settlement_hold_days: 2 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
            - call: "GET /merchant-settlements?merchant_id=${m_id}"
              as: Servicer
              captures: { s_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: Servicer
            - call: "POST /merchant-settlements/${s_id}/release"
              as: Servicer
              captures: { s_status: $.data.status }
          assert:
            - "release at 2026-01-03 (now == created+hold_days) returns MerchantSettlement.${s_id}.status == RELEASED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: borrower_credit_conserved_across_activate_and_payoff
        grounds:
          - entities.Borrower.fields.eligible_credit_limit_cents
          - entities.Borrower.fields.available_credit_cents
          - entities.Borrower.fields.outstanding_principal_cents
          - state_machines.Application.APPROVED_to_ACTIVATED
          - state_machines.Loan.ACTIVE_to_PAID_OFF
        distinguishing_aspect: |
          Conserved quantity = borrower credit: available_credit_cents +
          outstanding_principal_cents == eligible_credit_limit_cents (500000) must hold
          BOTH after the forward action (activate Loan A: available 400000 +
          outstanding 100000) AND after the compensating action (pay Loan A off:
          available 500000 + outstanding 0). No drift in the named quantity.
        test_recipe:
          setup:
            - "Merchant M ACTIVE; Borrower BA limit 500000; App A PAY_IN_4 cart 100000 approved+disclosed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
            - call: "GET /borrowers/${ba_id}"
              as: Servicer
              captures: { avail_after_activate: $.data.available_credit_cents, out_after_activate: $.data.outstanding_principal_cents }
          trigger:
            - call: "POST /payments"
              payload: { loan_id: "${loan_a_id}", amount_cents: 100000, source: "MANUAL" }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "GET /borrowers/${ba_id}"
              as: Servicer
              captures: { avail_after_payoff: $.data.available_credit_cents, out_after_payoff: $.data.outstanding_principal_cents }
          assert:
            - "after activate Borrower.${ba_id}.available_credit_cents == 400000 AND outstanding_principal_cents == 100000 (sum 500000)"
            - "after payoff Borrower.${ba_id}.available_credit_cents == 500000 AND outstanding_principal_cents == 0 (sum 500000)"

      - name: merchant_net_settled_conserved_across_release_and_clawback
        grounds:
          - entities.Merchant.fields.net_settled_cents
          - entities.MerchantSettlement.fields.net_settlement_cents
          - entities.MerchantSettlement.fields.clawed_back_cents
          - state_machines.MerchantSettlement.PENDING_to_RELEASED
          - calculations.return_reallocation
        distinguishing_aspect: |
          Conserved quantity = merchant net settled (DIFFERENT quantity than borrower
          credit): for a fully-returned loan, Merchant.net_settled_cents returns to its
          pre-loan value 0 after the compensating clawback. Forward: release moves
          net_settled to 94000 (gross 100000 - mdr 6000). Compensating: a 100000 full
          return claws back the net settlement attributable to the returned goods =
          100000 - round_half_up(100000*600/10000)=6000 = 94000, capped at the
          settlement's net 94000, so net_settled returns to 0.
        test_recipe:
          setup:
            - "Merchant M mdr_bps 600, hold 0; Loan A PAY_IN_4 financed 100000 activated 2026-01-01."
            - "Settlement S: net 94000; released (net_settled 94000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600, settlement_hold_days: 0 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
            - call: "GET /merchant-settlements?merchant_id=${m_id}"
              as: Servicer
              captures: { s_id: "$.data[0].id" }
            - call: "POST /merchant-settlements/${s_id}/release"
              as: Servicer
            - call: "GET /merchants/${m_id}"
              as: Servicer
              captures: { net_after_release: $.data.net_settled_cents }
          trigger:
            - call: "POST /returns"
              payload: { loan_id: "${loan_a_id}", return_amount_cents: 100000 }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "GET /merchants/${m_id}"
              as: Servicer
              captures: { net_after_return: $.data.net_settled_cents }
          assert:
            - "after release Merchant.${m_id}.net_settled_cents == 94000"
            - "after full return Merchant.${m_id}.net_settled_cents == 0"
