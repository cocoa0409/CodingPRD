      - claim_type: input_set_filtering
        name: concession_gross_sales_counts_only_picked_up_sales
        grounds:
          - calculations.concession_rent_accrual
          - state_machines.Sale.ELIGIBILITY_CLEARED_to_PICKED_UP
          - endpoints["GET /concession-agreements/{agreement_id}/rent-projection"]
        distinguishing_aspect: |
          The rent input_set is PICKED_UP sales only. A CART basket and a cleared-but-not-collected
          basket MUST contribute 0 to gross_sales_cents; only the collected one counts. Summing every
          Sale row, or summing at clearance time, overstates the concession rent.
        test_recipe:
          setup:
            - "Terminal SIN in SG, one LISTED LIQUOR product at 8000 cents with 30 units, AU/LIQUOR allowance 5"
            - "ConcessionAgreement 2026-08 for SIN at 1200 bps with a 10000-cent guarantee, ACTIVE"
