            - "IdentityCheck.${idc_2}.confidence == 0.8500 and result == MATCH"
            - "IdentityCheck.${idc_2}.status == VALID"
            - "Customer.${cust}.latest_identity_check_result == MATCH"
            - "GET /customers/${cust}/identity-checks returns total_count == 2"
            - "GET /customers/${cust}/identity-checks?status=VALID returns total_count == 1 with id == ${idc_2}"

  # =========================================================================
  # Section 8 — Cross-Cutting Complexity Layers
  # (optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  #  ops_run_checkpoint)
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_identity_check_creation_enforces_the_customer_occ_field
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[identity-check-create-stale-customer]
          - errors[ERR_STALE_CUSTOMER_VERSION]
          - endpoints[POST /customers/{id}/identity-checks]
        distinguishing_aspect: |
          The §1.2.1 rule's own write_endpoint and occ_field are exercised in all three states:
          a version one behind is 412 ERR_STALE_CUSTOMER_VERSION and writes nothing, the observed
          version succeeds, and replaying that same now-consumed version is 412 again — proving
          Customer.version incremented on the child write rather than only on customer updates.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z; one attested customer, no identity checks yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/age-attestation"
              payload: { attested_dob: "2000-03-15", attestation_channel: "WEB_CHECKBOX" }
              as: Customer
              as_user_id: "${cust}"
              captures: { cust_v: $.data.version }
          trigger:
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v} - 1", provider: "STATE_DMV_GATEWAY", provided_dob: "2000-03-15", source_dob: "2000-03-15", source_signals: [{ source_type: "GOVERNMENT_ID_DB", matched: true }, { source_type: "CREDIT_BUREAU", matched: true }, { source_type: "WATCHLIST_NEGATIVE", matched: true }], validity_days: 90 }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { stale_err: $.data.error_id }
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v}", provider: "STATE_DMV_GATEWAY", provided_dob: "2000-03-15", source_dob: "2000-03-15", source_signals: [{ source_type: "GOVERNMENT_ID_DB", matched: true }, { source_type: "CREDIT_BUREAU", matched: true }, { source_type: "WATCHLIST_NEGATIVE", matched: true }], validity_days: 90 }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { idc: $.data.id }
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v}", provider: "TELCO_VERIFY", provided_dob: "2000-03-15", source_dob: "2000-03-15", source_signals: [{ source_type: "MOBILE_CARRIER", matched: true }], validity_days: 90 }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { replay_err: $.data.error_id }
          assert:
            - "first response: HTTP status 412 and data.error_id == \"ERR_STALE_CUSTOMER_VERSION\""
            - "after the stale attempt GET /customers/${cust}/identity-checks returns total_count == 0"
            - "after the stale attempt Customer.${cust}.version == ${cust_v} and latest_identity_check_result == NONE"
            - "second response: HTTP status 201, IdentityCheck.${idc}.result == MATCH and status == VALID"
            - "Customer.${cust}.version == ${cust_v} + 1 (the child write bumped the parent)"
            - "Customer.${cust}.latest_identity_check_result == MATCH"
            - "third response: HTTP status 412 and data.error_id == \"ERR_STALE_CUSTOMER_VERSION\" — the same literal that just succeeded is now stale"
            - "GET /customers/${cust}/identity-checks returns total_count == 1"
            - "IdentityCheck.${idc}.status is still VALID (the replay superseded nothing)"

      - name: corner_corrective_action_plan_creation_enforces_the_case_occ_field
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cap-create-stale-violation-case]
          - errors[ERR_STALE_CASE_VERSION]
          - endpoints[POST /violation-cases/{id}/corrective-action-plans]
        distinguishing_aspect: |
          The second §1.2.1 rule is exercised on its own declared endpoint and field: a case
          version one behind is 412 ERR_STALE_CASE_VERSION with no plan row created, the observed
          version yields the plan, and the plan write itself bumps ViolationCase.version so the
          replayed literal is rejected — a plan can never supersede a review it never saw.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z; a MAJOR case substantiated against one partner"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-21T18:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /secret-shopper-tests"
              payload: { courier_id: "${courier}", order_id: "${order}", scenario_type: "UNDERAGE_RECIPIENT", scheduled_at: "2026-08-21T18:00:00Z", expected_outcome: "REFUSAL" }
              as: SecretShopperAuditor
              captures: { sst: $.data.id }
            - call: "POST /violation-cases"
              payload: { delivery_partner_id: "${partner}", secret_shopper_test_id: "${sst}", severity: "MAJOR", summary: "Handover to an underage recipient." }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { case: $.data.id }
            - call: "POST /violation-cases/${case}/investigate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /violation-cases/${case}/decide"
              payload: { decision: "SUBSTANTIATED", assessed_severity: "MAJOR", notes: "Substantiated." }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /violation-cases/${case}/corrective-action-plans"
              payload: { expected_violation_case_version: "${case_v} - 1", remediation_items: ["Retrain the courier"], due_at: "2026-09-15T12:00:00Z" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { stale_err: $.data.error_id }
            - call: "POST /violation-cases/${case}/corrective-action-plans"
              payload: { expected_violation_case_version: "${case_v}", remediation_items: ["Retrain the courier", "Add a scan prompt to the courier app"], due_at: "2026-09-15T12:00:00Z" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { plan: $.data.id }
            - call: "POST /violation-cases/${case}/corrective-action-plans"
              payload: { expected_violation_case_version: "${case_v}", remediation_items: ["Second attempt from a stale view"], due_at: "2026-09-20T12:00:00Z" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { replay_err: $.data.error_id }
          assert:
            - "first response: HTTP status 412 and data.error_id == \"ERR_STALE_CASE_VERSION\""
            - "after the stale attempt GET /violation-cases/${case}/corrective-action-plans returns total_count == 0"
            - "after the stale attempt ViolationCase.${case}.version == ${case_v} and state == SUBSTANTIATED"
            - "second response: HTTP status 201, CorrectiveActionPlan.${plan}.state == SUBMITTED and revision_round == 1"
            - "CorrectiveActionPlan.${plan}.violation_case_id == ${case}"
            - "ViolationCase.${case}.version == ${case_v} + 1 (the child write bumped the parent)"
            - "third response: HTTP status 412 and data.error_id == \"ERR_STALE_CASE_VERSION\""
            - "GET /violation-cases/${case}/corrective-action-plans returns total_count == 1"
            - "CorrectiveActionPlan.${plan}.state is still SUBMITTED (the replay superseded nothing)"

      - name: corner_the_clock_sweep_reposts_a_partner_only_when_the_window_actually_expires
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - calculations.partner_license_risk_score.variants
          - calculations.partner_posture_derivation
          - domain_constants.ROLLING_WINDOW_DAYS
        distinguishing_aspect: |
          The checkpoint is time-driven, not write-driven: at exactly 90 days the CRITICAL case is
          still inside the rolling window, so the sweep reports repostured_partner_count == 0 and
          the partner stays RESTRICTED; one day later age_days becomes 91, the rolling variant
          drops the case to 0.00 while the lifetime variant only decays to 36.00, and that single
          sweep flips the posture to OPEN and counts exactly one repostured partner.
        test_recipe:
          setup:
            - "logical clock 2026-08-02T12:00:00Z; one STANDARD partner holding a single CRITICAL case substantiated at 2026-08-02T12:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-03T18:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /secret-shopper-tests"
              payload: { courier_id: "${courier}", order_id: "${order}", scenario_type: "INTOXICATED_RECIPIENT", scheduled_at: "2026-08-03T18:00:00Z", expected_outcome: "REFUSAL" }
              as: SecretShopperAuditor
              captures: { sst: $.data.id }
            - call: "POST /violation-cases"
              payload: { delivery_partner_id: "${partner}", secret_shopper_test_id: "${sst}", severity: "CRITICAL", summary: "Handover to a visibly intoxicated recipient." }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { case: $.data.id }
            - call: "POST /violation-cases/${case}/investigate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /violation-cases/${case}/decide"
              payload: { decision: "SUBSTANTIATED", assessed_severity: "CRITICAL", notes: "Substantiated at the checkpoint epoch." }
              as: ComplianceOfficer
              as_user_id: "officer_a"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T12:00:00Z" }
              as: PlatformAdmin
              captures: { sweep_90: $.data.repostured_partner_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T12:00:00Z" }
              as: PlatformAdmin
              captures: { sweep_91: $.data.repostured_partner_count }
          assert:
            - 'before the first sweep: ViolationCase.${case}.decided_at == "2026-08-02T12:00:00Z", risk_contribution == 40.00, DeliveryPartner.${partner}.license_risk_score == 40.00, lifetime_risk_score == 40.00, posture == RESTRICTED'
            - "first sweep response: repostured_partner_count == 0, expired_identity_check_count == 0, expired_certification_count == 0"
            - 'first sweep response: current_utc == "2026-10-31T12:00:00Z"'
            - "after the first sweep age_days == 90 which satisfies age_days <= 90, so license_risk_score is still 40.00 and posture is still RESTRICTED"
            - "after the first sweep lifetime_risk_score == 40.00 (weight 1.00 - 0.1 * floor(90 / 90) is not yet applied at exactly 90)"
            - "second sweep response: repostured_partner_count == 1"
            - "after the second sweep age_days == 91, so the rolling variant excludes the case: DeliveryPartner.${partner}.license_risk_score == 0.00"
            - "after the second sweep lifetime_risk_score == 36.00 (40 * max(0.25, 1.00 - 0.1 * floor(91 / 90)) = 40 * 0.90, tier multiplier 1.00)"
            - "DeliveryPartner.${partner}.posture == OPEN"
            - "GET /delivery-partners/${partner}/risk-assessment returns rolling_90d_score == 0.00, lifetime_weighted_score == 36.00, tier_multiplier == 1.00, open_case_count == 0, open_critical_case_count == 0, posture == OPEN"
            - "ViolationCase.${case}.state is still SUBSTANTIATED and assessed_severity is still CRITICAL — the sweep re-scores, it never rewrites case state"

      - name: corner_refusal_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /delivery-attempts/{id}/refuse].side_effects
          - calculations.partner_license_risk_score
          - calculations.partner_posture_derivation
        excluded_because:
          difficulty_instance: "transitive_cascade / door_refusal_cascades_through_case_posture_and_a_second_order"
          rationale: |
            §1.8 already walks the full four-level chain from one refuse call — attempt to REFUSED
            and order to RETURN_IN_TRANSIT, AUTO_REFUSAL case opened with the mapped severity,
            partner counts and posture recomputed, and a second DISPATCHED order of the same
            partner moved to HELD_AT_HUB with its compliance_state pushed back to
            PENDING_COMPLIANCE_REVIEW in created_at ASC order — including the ordering-sensitivity
            assertion. A §1.9 duplicate would add no distinguishable failure mode.

      - name: corner_both_risk_variants_are_computed_from_the_same_rows
        claim_type: dual_variant_calculation
        grounds:
          - calculations.partner_license_risk_score.variants
          - endpoints[GET /delivery-partners/{id}/risk-assessment]
        excluded_because:
          difficulty_instance: "dual_variant_calc / partner_risk_rolling_versus_lifetime_weighted"
          rationale: |
            §1.8 already pins both variants over one identical case set, asserts the exact delta
            between ROLLING_90D and LIFETIME_WEIGHTED, and proves that only ROLLING_90D feeds
            posture derivation while LIFETIME_WEIGHTED is report-only. The order-side variant pair
            is likewise covered by dual_variant_calc / order_exposure_provisional_versus_final_policy_epoch.

  # =========================================================================
  # Section 9 — Consistency Model (immediate)
  # =========================================================================
  - section: consistency_model
    instances:

      - name: corner_every_derived_field_is_already_present_in_the_writing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /orders/{id}/submit]
          - endpoints[POST /delivery-attempts/{id}/refuse]
          - response_envelope
        distinguishing_aspect: |
          No re-read is needed anywhere: the submit response body already carries the computed
          exposure, routing and money fields, and the refuse response already reflects its own
          cascade — every subsequent GET of the same rows returns byte-identical values, so an
          implementation that defers derivation to a later request or a background pass fails here.
        test_recipe:
          setup:
            - "SKELETON-RESTRICTED through dispatch: clock 2026-08-20T12:00:00Z, jurisdiction US-NY (WET, utc_offset_minutes -240), ALCOHOL policy min_age 21 with window [600,1320) and requires_scan true effective 2026-08-01..2026-08-31, product WINE-A (ALCOHOL, 1.50 units, 6800c), customer attested 2000-03-15 with a MATCH identity check, partner Empire Last Mile (STANDARD), courier Dana Reyes certified for ALCOHOL"
