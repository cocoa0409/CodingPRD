          assert:
            - "second apply returns ERR_ABUSE_LIMIT_EXCEEDED (409) — count at limit (1) rejects the next use"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # --- pair A: Cart lock depends on Promotion state ---
      - name: cesd_cart_lock_requires_promotion_active
        grounds:
          - state_machines.Cart.checkout_status.OPEN_to_LOCKED
          - state_machines.Promotion.ACTIVE_to_PAUSED
          - validations[priority=11]
        distinguishing_aspect: |
          Cart's OPEN->LOCKED transition depends on a different entity's state (each referenced Promotion must be
          ACTIVE). Pausing the promotion makes the lock fail with ERR_PROMO_NOT_REDEEMABLE. Entity pair
          Cart->Promotion — distinct from instance 2's Promotion->Segment pair.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Promotion CE1 PERCENT_OFF 10% ACTIVE, coupon CEC1; cart with line, coupon applied, repriced (PRICED); then promotion PAUSED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "ce1@x.com", display_name: "CE1" }
              as: Shopper
