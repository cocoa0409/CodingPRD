              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_v3: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v3}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight2_id: $.data.id }
          assert:
            - "the stale re-dispatch -> 412 with error_id ERR_STALE_ORDER_VERSION"
            - "Order.${order_id}.status == QUOTED and Order.${order_id}.version == 3 after the rejection (no bump on the failed write)"
            - "the re-dispatch with the re-read version -> 201; Flight.${flight2_id}.ops_state == PLANNED"
            - "Order.${order_id}.status == ASSIGNED and Order.${order_id}.version == 4"

      - name: occ_stale_drone_version_on_maintenance_schedule
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[maintenance-schedule-stale-drone]", "errors[ERR_STALE_DRONE_VERSION]"]
        distinguishing_aspect: "Drone.version is bumped by install-battery, so a technician who captured version 1 at registration and then installed a pack is rejected with 412 ERR_STALE_DRONE_VERSION when scheduling with expected_drone_version == 1; the re-read version is accepted."
