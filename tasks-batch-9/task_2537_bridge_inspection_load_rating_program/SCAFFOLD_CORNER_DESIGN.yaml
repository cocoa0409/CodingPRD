              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_INSPECTION_DATE_OUT_OF_WINDOW"
            - "Inspection.${ins_id}.status is still DRAFT with submitted_at == null and inspection_date == null"
            - "Inspection.${ins_id}.bridge_health_index, deck_group_ehi, superstructure_group_ehi, substructure_group_ehi and the three computed_*_rating fields are all still null - the submit side effects never ran"
            - "Bridge.${br_id}.version is still 1 and last_routine_inspection_date is still null"
            - "A submit with inspection_date 2026-09-02T07:59:59Z (one second before field_window_start) returns the same 422 ERR_INSPECTION_DATE_OUT_OF_WINDOW"

