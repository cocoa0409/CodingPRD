  # =========================================================================
  # Rule 8 — resource temporal overlap with different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exception_agreement_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=15]
          - errors.ERR_EXCEPTION_OVERLAP
          - entities.ExceptionAgreement.fields.effective_from
          - entities.ExceptionAgreement.fields.status
        distinguishing_aspect: |
          ExceptionAgreement intervals are half-open [from, to): a second agreement starting exactly
          at 2026-04-01T00:00:00Z, where the first ends, is accepted, while one starting one second
          earlier at 2026-03-31T23:59:59Z is rejected with ERR_EXCEPTION_OVERLAP — and the scope is
          the (customer_id, commodity_profile_id) pair, so the identical interval on a second
          commodity profile is accepted. PENDING agreements already occupy their interval.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-01T00:00:00Z; customer ACME; published standard NMFC-2026A with two commodity profiles CP1 and CP2."
            - "A PENDING EXCEPTION_CLASS agreement on (ACME, CP1) for [2026-03-01T00:00:00Z, 2026-04-01T00:00:00Z) at class 92.5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/customers"
              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id" }
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id" }
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "156600", description: "Machine parts, boxed", classification_basis: "DENSITY_BASED" }
              as: PricingAnalyst
              captures: { cp1: "$.data.id" }
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "049880", description: "Assorted hardware", classification_basis: "DENSITY_BASED" }
              as: PricingAnalyst
              captures: { cp2: "$.data.id" }
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/exception-agreements"
              payload: { customer_id: "${cust1}", commodity_profile_id: "${cp1}", agreement_type: "EXCEPTION_CLASS", agreed_class_code: 92.5, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z" }
              as: PricingAnalyst
              captures: { ea1: "$.data.id" }
          trigger:
            - call: "POST /ltl/exception-agreements"
              payload: { customer_id: "${cust1}", commodity_profile_id: "${cp1}", agreement_type: "EXCEPTION_CLASS", agreed_class_code: 100, effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-05-01T00:00:00Z" }
              as: PricingAnalyst
              captures: { ea2: "$.data.id" }
            - call: "POST /ltl/exception-agreements"
              payload: { customer_id: "${cust1}", commodity_profile_id: "${cp1}", agreement_type: "EXCEPTION_CLASS", agreed_class_code: 110, effective_from: "2026-03-31T23:59:59Z", effective_to: "2026-04-15T00:00:00Z" }
              as: PricingAnalyst
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /ltl/exception-agreements"
              payload: { customer_id: "${cust1}", commodity_profile_id: "${cp2}", agreement_type: "FAK", agreed_class_code: 92.5, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z" }
              as: PricingAnalyst
              captures: { ea4: "$.data.id" }
          assert:
            - "trigger[1] returns 201 (touching endpoints do not overlap)"
            - "ExceptionAgreement.${ea2}.status == PENDING"
            - "ExceptionAgreement.${ea2}.effective_from == 2026-04-01T00:00:00Z"
            - "trigger[2] returns 409 with error_id ERR_EXCEPTION_OVERLAP"
            - "trigger[3] returns 201 (different commodity_profile_id is a different overlap scope)"
            - "ExceptionAgreement.${ea4}.agreement_type == FAK"
            - "ExceptionAgreement.${ea1}.status == PENDING"
            - "ExceptionAgreement.${ea1}.approved_by_user_id == null"
            - "GET /ltl/exception-agreements?customer_id=${cust1} returns exactly 3 rows"

      - name: repricing_run_closed_window_with_strict_24_hour_buffer
        grounds:
          - validations[priority=15]
          - errors.ERR_REPRICING_WINDOW_OVERLAP
          - constants.REPRICING_BUFFER_HOURS
          - entities.RepricingRun.fields.sample_window_start_at
        distinguishing_aspect: |
          RepricingRun windows use CLOSED [start, end] semantics plus a REPRICING_BUFFER_HOURS gap,
          which is the opposite convention to the ExceptionAgreement rule: a window starting exactly
          24 h after the previous end (2026-04-01T00:00:00Z after 2026-03-31T00:00:00Z) is accepted,
          while one starting 12 h after it (2026-03-31T12:00:00Z) is rejected with
          ERR_REPRICING_WINDOW_OVERLAP even though the windows do not intersect. The buffer is keyed
          by new_tariff_version_id, so the same rejected window is accepted for another standard.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-15T00:00:00Z."
            - "Two published standards: NMFC-2026A effective 2026-01-01 and NMFC-2026B effective 2026-02-01."
            - "A DRAFT repricing run for NMFC-2026B over the sample window [2026-03-01T00:00:00Z, 2026-03-31T00:00:00Z], scope ALL_CLASS_BASED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id" }
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026B", effective_at: "2026-02-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv2: "$.data.id" }
            - call: "POST /ltl/tariff-versions/${tv2}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/repricing-runs"
              payload: { new_tariff_version_id: "${tv2}", scope: "ALL_CLASS_BASED", sample_window_start_at: "2026-03-01T00:00:00Z", sample_window_end_at: "2026-03-31T00:00:00Z" }
              as: PricingAnalyst
              captures: { rr1: "$.data.id" }
          trigger:
            - call: "POST /ltl/repricing-runs"
              payload: { new_tariff_version_id: "${tv2}", scope: "ALL_CLASS_BASED", sample_window_start_at: "2026-04-01T00:00:00Z", sample_window_end_at: "2026-04-30T00:00:00Z" }
              as: PricingAnalyst
              captures: { rr2: "$.data.id" }
            - call: "POST /ltl/repricing-runs"
              payload: { new_tariff_version_id: "${tv2}", scope: "ALL_CLASS_BASED", sample_window_start_at: "2026-03-31T12:00:00Z", sample_window_end_at: "2026-04-20T00:00:00Z" }
              as: PricingAnalyst
              captures: { err_buffer: "$.data.error_id" }
            - call: "POST /ltl/repricing-runs"
              payload: { new_tariff_version_id: "${tv1}", scope: "ALL_CLASS_BASED", sample_window_start_at: "2026-03-31T12:00:00Z", sample_window_end_at: "2026-04-20T00:00:00Z" }
              as: PricingAnalyst
              captures: { rr4: "$.data.id" }
          assert:
            - "trigger[1] returns 201 (gap of exactly REPRICING_BUFFER_HOURS = 24 h is allowed)"
            - "RepricingRun.${rr2}.status == DRAFT"
            - "RepricingRun.${rr2}.sample_window_start_at == 2026-04-01T00:00:00Z"
            - "trigger[2] returns 409 with error_id ERR_REPRICING_WINDOW_OVERLAP"
            - "trigger[3] returns 201 (buffer is scoped per new_tariff_version_id)"
            - "RepricingRun.${rr4}.new_tariff_version_id == ${tv1}"
            - "RepricingRun.${rr1}.status == DRAFT"
            - "RepricingRun.${rr1}.impacted_customer_count == 0"
            - "TariffVersion.${tv1}.status == SUPERSEDED"
            - "TariffVersion.${tv1}.superseded_by_tariff_version_id == ${tv2}"
            - "TariffVersion.${tv2}.status == PUBLISHED"

  # =========================================================================
  # Rule 9 — compensating invariants on conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: money_invariant_assessed_total_returns_to_pre_notice_value
        grounds:
          - entities.Shipment.fields.assessed_total_cents
          - calculations.credit_allocation_waterfall
          - entities.CreditMemo.fields.interest_credit_cents
          - state_machines.CorrectionNotice.DISPUTED_to_OVERTURNED
        distinguishing_aspect: |
          Conserved quantity = money. Two notices are issued against one shipment (12500 ->
          45314 -> 78128); the second is fully overturned and the ledger must return to exactly
          45314 — the value it had while only the UPHELD notice stood — even though the credit memo
          pays out 32956, because interest_credit_cents (142) sits deliberately OUTSIDE the ledger
          identity. Refunding the interest through the ledger leaves 45172 and drifts.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-10T08:00:00Z; terminal TRM1; customer ACME (default education_strike_interval) on an ACTIVE CLASS_BASED program (4200 c/cwt, 35%, 12500 minimum)."
            - "Shipment PROD001 (single 400 lb class 70 line, 4 pieces 48.0x40.0x48.0) billed at 12500; capture at 520 lb raises the automated BOTH notice A."
            - "Notice A is issued (assessed 45314), disputed and resolved UPHELD_CARRIER on 2026-02-05."
            - "On 2026-06-01 the auditor drafts and issues a manual RECLASS notice B citing the same capture (assessed 78128) and the shipper disputes it."
