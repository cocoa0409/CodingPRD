      - name: risk_alcohol_tier_and_postpartum_cap_constants_are_applied
        claim_type: constants_applied
        grounds:
          - calculations.donor_risk_score
          - entities.HealthHistoryQuestionnaire.fields.base_risk_points
          - state_machines.Donor.INFO_REQUESTED_to_SCREENING
        distinguishing_aspect: "At 30 months postpartum the POSTPARTUM_CAP clamps 18*3 = 54 down to 30, and 4 alcohol units per week lands in the 4-7 band worth 15 rather than the 1-3 band worth 5: the first questionnaire scores base 45 / screening 65 (INFO_REQUESTED band), the second, identical but for 3 alcohol units, scores base 35 / screening 55 (ACCEPTED band)."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 is APPLICANT with no serology, so both questionnaires carry the 20-point SEROLOGY_PENDING_PENALTY."
            - "base(alcohol=4) = 0*8 + 0 + 0 + 15 + min(30, (30-12)*3) = 45 and screening = 45 + 20 = 65, which is in (60, 85]."
            - "base(alcohol=3) = 0 + 0 + 0 + 5 + 30 = 35 and screening = 35 + 20 = 55, which is <= 60."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
          trigger:
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 0, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 4, months_postpartum: 30 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 0, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 30 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          assert:
            - "first response: data.base_risk_points == 45 and data.screening_risk_score == 65 and data.status == INFO_REQUESTED"
            - "second response: data.base_risk_points == 35 and data.screening_risk_score == 55 and data.status == ACCEPTED"
            - "Donor.${d1}.status == SCREENING"
            - "Donor.${d1}.screening_risk_score == 55"
            - "Donor.${d1}.surveillance_risk_score == 35"
            - "Donor.${d1}.version == 3"
            - "GET /milk-bank/donors/${d1}/health-history returns total_count == 2"

      - name: thermal_gap_of_601_seconds_restarts_the_hold_segment
        claim_type: correct_result
        grounds:
          - calculations.thermal_hold_verification
          - entities.PasteurizationRun.fields.longest_hold_seconds
          - entities.PasteurizationRun.fields.thermal_status
          - entities.PasteurizationRun.fields.peak_celsius
        distinguishing_aspect: "Five in-band readings at 0, 601, 1201, 1801 and 2401 seconds contain one 601-second gap, which exceeds MAX_READING_GAP_SECONDS and breaks the segment: the longest qualifying hold is 2401 - 601 = 1800 (exactly MIN_HOLD_SECONDS, so PASSED), not the 2401 an implementation that ignored the gap would report."
