          trigger:
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", deliverable_id: "${del_id}", release_kind: "DELIVERABLE_PAYOUT", requested_amount_cents: 120000, expected_deal_contract_version: "${dc_ver}" }
              as: TreasuryOfficer
              as_user_id: "dual-agent"
              captures: { err_id: $.data.error_id }
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", deliverable_id: "${del_id}", release_kind: "DELIVERABLE_PAYOUT", requested_amount_cents: 120000, expected_deal_contract_version: "${dc_ver}" }
              as: TreasuryOfficer
              as_user_id: "treasury-clean"
