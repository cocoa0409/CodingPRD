              captures: { err: $.data.error_id }
          assert:
            - "${count3} == 3 and ${date3} == 2026-12-01T00:00:00.000Z"
            - "${state_now} == HEARING_CONVENED — a legal from-state for CONTINUE"
            - "HTTP status is 409 and ${err} == ERR_CONTINUANCE_LIMIT_REACHED"
            - "${err} != ERR_INVALID_STATE"
            - "GET /disciplinary-proceedings/${proc_id} still reports continuance_count 3, hearing_date 2026-12-01T00:00:00.000Z and status HEARING_CONVENED"
            - "a REOPEN after the hearing closes is refused with the same code, because both cyclic edges draw on the one budget"

      - name: submitting_an_unpaid_renewal_returns_renewal_fee_unpaid
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors.ERR_RENEWAL_FEE_UNPAID
          - entities.RenewalApplication.fields.fee_applied_cents
        distinguishing_aspect: "The fiscal gate reads two fields, and the unpaid case is the one where fee_applied_cents is still 0 because the payment endpoint was never called: the licence is ACTIVE so rule 11 passes and the CE total is exactly 30.00 so rule 34 passes, leaving the 402 as the only possible answer."
        test_recipe:
          setup:
            - "An RN licence issued 2026-08-01 under board OH is ACTIVE and CLEAR."
            - "Its DRAFT renewal carries one accredited 1800-minute LIVE_CONTACT record and no payment."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id }
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: LicensureAnalyst
              captures: { lic_v: $.data.version }
            - call: "POST /renewal-applications"
              payload: { license_id: "${lic_id}", expected_license_version: "${lic_v}", attested_practice_hours: 1200 }
              as: LicensureAnalyst
              captures: { ren_id: $.data.id, fee0: $.data.fee_applied_cents, paid0: $.data.fee_paid_cents }
            - call: "POST /renewal-applications/${ren_id}/ce-records"
              payload: { provider_code: "OHNA-100", provider_accredited: true, category: "LIVE_CONTACT", minutes: 1800, completion_date: "2027-03-15T00:00:00Z" }
              as: LicensureAnalyst
              captures: { ce_hours: $.data.credit_hours }
          trigger:
            - call: "POST /renewal-applications/${ren_id}/submit"
              payload: {}
              as: LicensureAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${fee0} == 0 and ${paid0} == 0 — creation does not assess the fee"
            - "${ce_hours} == 30.00, so the CE rule at priority 34 is satisfied"
            - "HTTP status is 402 and ${err} == ERR_RENEWAL_FEE_UNPAID"
            - "${err} != ERR_CE_HOURS_INSUFFICIENT and ${err} != ERR_LICENSE_NOT_RENEWABLE"
            - "GET /renewal-applications/${ren_id} still reports renewal_status DRAFT and submitted_at null"
            - "after POST /renewal-applications/${ren_id}/payment sets fee_applied_cents and fee_paid_cents to 12000, the same submit returns 200 with renewal_status SUBMITTED"

  - section: endpoints
    instances:
      - name: create_and_read_back_a_board_config_through_the_standard_crud_pair
        claim_type: standard_crud
        grounds:
          - endpoints.POST /state-board-configs
          - endpoints.GET /state-board-configs/{id}
          - response_envelope.success
        distinguishing_aspect: "Exercises the create-then-read pair and the envelope contract at once: the 201 body is { data, meta } with a meta.request_id, the GET returns byte-identical field values, and version is still 1 because a read is not a write."
        test_recipe:
          setup:
            - "No board config exists for state code MI."
          setup_api_calls: []
          trigger:
            - call: "POST /state-board-configs"
              payload: { state_code: "MI", board_name: "Michigan Board of Nursing", compact_member: false, ce_hours_required: 25.00 }
              as: SystemAdmin
              captures: { board_id: $.data.id, created_at: $.data.created_at, ver: $.data.version }
            - call: "GET /state-board-configs/${board_id}"
              payload: {}
              as: LicensureAnalyst
              captures: { read_id: $.data.id, read_code: $.data.state_code, read_ce: $.data.ce_hours_required, read_ver: $.data.version }
          assert:
            - "the POST returns HTTP 201 with a top-level data object and a meta object carrying a request_id"
            - "the GET returns HTTP 200 and ${read_id} == ${board_id}, ${read_code} == MI, ${read_ce} == 25.00"
            - "${ver} == 1 and ${read_ver} == 1 — reads do not bump the version"
            - "${created_at} == 2026-08-01T00:00:00.000Z, taken from the logical clock rather than wall time"
            - "compact_member is false and status is ACTIVE"

      - name: patch_board_config_updates_only_the_supplied_fields
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH /state-board-configs/{id}
          - entities.StateBoardConfig
        distinguishing_aspect: "A partial update must be a true patch, not a replace: two of the twenty-one optional fields are supplied and every untouched field keeps its default, while version advances exactly once. state_code is not in the declared input at all, so it cannot be edited even by a caller who tries."
        test_recipe:
          setup:
            - "Board OH exists with every optional field defaulted."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id, ce_before: $.data.ce_hours_required, holds_before: $.data.max_concurrent_custodian_holds }
          trigger:
            - call: "PATCH /state-board-configs/${board_id}"
              payload: { audit_sample_rate_bp: 2500, phi_authorization_required: false }
              as: SystemAdmin
              captures: { rate_after: $.data.audit_sample_rate_bp, phi_after: $.data.phi_authorization_required, ce_after: $.data.ce_hours_required, holds_after: $.data.max_concurrent_custodian_holds, ver_after: $.data.version }
          assert:
            - "HTTP status is 200, ${rate_after} == 2500 and ${phi_after} == false"
            - "${ce_after} == ${ce_before} == 30.00 and ${holds_after} == ${holds_before} == 2 — omitted fields are untouched"
            - "${ver_after} == 2 — one write, one increment"
            - "state_code is still OH and updated_at is 2026-08-01T00:00:00.000Z"

      - name: privilege_summary_computed_read_matches_the_stored_privilege_triple
        claim_type: computed_read
        grounds:
          - endpoints.GET /licenses/{id}/privilege-summary
          - calculations.multistate_privilege_determination
        distinguishing_aspect: "The summary is a pure projection: it must echo the privilege triple already stored on the License plus the inputs that produced it (board state code, compact flag, declared and evidenced primary state), and calling it must not re-run the determination — the version of the License is unchanged afterwards."
        test_recipe:
          setup:
            - "Compact board OH has an APPROVED BSN programme."
            - "Nurse Dana Reed declares OH and carries one DRIVER_LICENSE residency entry for MI effective 2026-01-01."
            - "An RN licence was issued to her, so the issuance determination ran under RESIDENCY_DECLARED."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH", residency_evidence: [{ evidence_type: "DRIVER_LICENSE", state_code: "MI", effective_date: "2026-01-01T00:00:00Z" }] }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id, stored_priv: $.data.multistate_privilege_status, stored_variant: $.data.privilege_variant, stored_basis: $.data.privilege_basis_state, ver_before: $.data.version }
          trigger:
            - call: "GET /licenses/${lic_id}/privilege-summary"
              payload: {}
              as: BoardMember
              captures: { s_priv: $.data.multistate_privilege_status, s_variant: $.data.privilege_variant, s_basis: $.data.privilege_basis_state, s_board_state: $.data.board_state_code, s_compact: $.data.board_compact_member, s_declared: $.data.declared_primary_state, s_evidenced: $.data.evidenced_primary_state, s_lic: $.data.license_id }
          assert:
            - "HTTP status is 200 and ${s_lic} == ${lic_id}"
            - "${s_priv} == ${stored_priv} == MULTISTATE, ${s_variant} == ${stored_variant} == RESIDENCY_DECLARED, ${s_basis} == ${stored_basis} == OH"
            - "${s_board_state} == OH, ${s_compact} == true, ${s_declared} == OH"
            - "${s_evidenced} == MI — the summary exposes what the EVIDENCED variant would resolve to without applying it"
            - "GET /licenses/${lic_id} still reports version ${ver_before} and multistate_privilege_status MULTISTATE — the read has no side effect"

      - name: status_change_action_endpoint_drives_the_license_status_dimension
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /licenses/{id}/status-change
          - state_machines.License.license_status
        distinguishing_aspect: "An action endpoint takes a target state rather than a field patch, and it must reject a target that is not reachable from the current one. INACTIVE is reachable from ACTIVE and is applied; SURRENDERED is then still reachable from INACTIVE, but a second attempt at INACTIVE from INACTIVE is refused by the state check rather than treated as a no-op."
        test_recipe:
          setup:
            - "An RN licence under compact board OH is ACTIVE, CLEAR and MULTISTATE."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /licenses/${lic_id}/status-change"
              payload: { to_status: "INACTIVE" }
              as: LicensureAnalyst
              captures: { st1: $.data.license_status, priv1: $.data.multistate_privilege_status, ver1: $.data.version }
            - call: "POST /licenses/${lic_id}/status-change"
              payload: { to_status: "INACTIVE" }
              as: LicensureAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "the first call returns HTTP 200 with ${st1} == INACTIVE and ${priv1} == NOT_ELIGIBLE — the action re-ran the privilege determination"
            - "${ver1} == 2"
            - "the second call returns HTTP 409 with ${err} == ERR_INVALID_STATE — an action endpoint is not idempotent here"
            - "GET /licenses/${lic_id} still reports license_status INACTIVE and version 2"
            - "a following status-change to SURRENDERED succeeds, and one to ACTIVE from SURRENDERED is refused"

