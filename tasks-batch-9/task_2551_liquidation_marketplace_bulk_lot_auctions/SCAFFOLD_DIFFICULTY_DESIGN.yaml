            - "Negotiation.${ng}.negotiation_status == AWAITING_BUYER, round_number == 4, current_offer_cents == 1350000, current_offer_side == SELLER (the rejected call changed nothing)"
            - "Negotiation.${ng}.version == ${nv4} (no version bump on the rejected write)"
            - "Negotiation.${ng}.current_offer_expires_at == 2026-08-07T01:00:00Z (48-hour OFFER_TTL_HOURS from the round-4 counter at 2026-08-05T01:00:00Z)"
