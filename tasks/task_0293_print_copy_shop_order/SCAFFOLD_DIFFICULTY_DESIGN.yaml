# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Print & Copy Shop Order — 9 rules x 2 instances = 18 instances.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls
# chain drives empty-DB -> precondition using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: line_estimate_vs_locked_final_diverge_on_catalog_edit
        grounds:
          - calculations.estimate_line_price
          - calculations.final_line_price
          - entities.OrderLine.fields.estimate_line_cents
          - entities.OrderLine.fields.final_line_cents
          - state_machines.Order.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Domain = OrderLine cost. estimate_line_cents reads CURRENT rates and is
          frozen once the line leaves OPEN; final_line_cents snapshots the rates in
          force at confirm. Editing the product base price after the line is
          PREFLIGHT_OK leaves estimate at 95000 but locks final at 113000.
        test_recipe:
          setup:
            - "Shop (tax 825bps, standard 3d, rush 1d, cutoff 14, capacity 100) and a COPIES product base 1000, requires_proof false, requires_press false."
            - "PricingTier min_quantity 50, discount 1000bps for the product."
            - "An order owned by a NONE-tier customer with one line qty 100, one PER_UNIT finishing of 50c; artwork uploaded and preflight PASSED (line PREFLIGHT_OK, estimate_line_cents == 95000)."
            - "Product base price PATCHed 1000 -> 1200 AFTER the line is PREFLIGHT_OK (estimate unchanged because the line is no longer OPEN), then order confirmed."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Lock Shop", tax_rate_bps: 825, rush_surcharge_bps: 2000, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 100 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ShopStaff
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "a@x.com", name: "Ann" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Color Copy", category: "COPIES", base_unit_price_cents: 1000, unit_size: 1, requires_proof: false, requires_press: false, active: true }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /pricing-tiers"
              payload: { product_id: "${prod_id}", min_quantity: 50, discount_bps: 1000 }
              as: ShopStaff
            - call: "POST /finishing-options"
              payload: { product_id: "${prod_id}", code: "LAMINATE", surcharge_kind: "PER_UNIT", surcharge_cents: 50 }
              as: ShopStaff
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 100, finishing_codes: ["LAMINATE"], service_level: "STANDARD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "a.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "PATCH /products/${prod_id}"
              payload: { base_unit_price_cents: 1200 }
              as: ShopStaff
            - call: "POST /fulfillments"
              payload: { order_id: "${order_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "OrderLine.${line_id}.estimate_line_cents == 95000"
            - "OrderLine.${line_id}.final_line_cents == 113000"
            - "OrderLine.${line_id}.final_line_cents != OrderLine.${line_id}.estimate_line_cents"

      - name: loyalty_score_committed_vs_provisional_preview_diverge
        grounds:
          - calculations.committed_loyalty_score
          - entities.Customer.fields.loyalty_score
          - entities.Customer.fields.loyalty_tier
          - state_machines.Order.READY_to_FULFILLED
        distinguishing_aspect: |
          Domain = Customer loyalty (NOT line cost). The committed loyalty_score is
          recomputed only at hand-off from realized completed_order_count /
          lifetime_paid_cents; the provisional preview projects confirmed-but-unfulfilled
          orders forward. With one CONFIRMED-unfulfilled order outstanding, committed
          == 0.0/NONE while the preview projects 1.0 — they differ.
        test_recipe:
          setup:
            - "Shop + COPIES product (base 500, no proof/press) + NONE-tier customer."
            - "One order fully confirmed (line locked, capacity held) but NOT yet handed off, so committed loyalty_score stays 0.0 (tier NONE)."
            - "loyalty-preview projects that single confirmed order as completed: completed_order_count 1 -> projected_loyalty_score 1.0."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Loyal Shop", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 100 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ShopStaff
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "b@x.com", name: "Bob" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "BW Copy", category: "COPIES", base_unit_price_cents: 500, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "b.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /fulfillments"
              payload: { order_id: "${order_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /customers/${cust_id}/loyalty-preview"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { projected: $.data.projected_loyalty_score, committed: $.data.committed_loyalty_score }
          assert:
            - "Customer.${cust_id}.loyalty_score == 0.0"
            - "Customer.${cust_id}.loyalty_tier == NONE"
            - "loyalty-preview projected_loyalty_score == 1.0 and committed_loyalty_score == 0.0 (they diverge)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: line_price_nonlinear_tier_finishing_rush_inputs
        grounds:
          - calculations.estimate_line_price
          - calculations.final_line_price
          - entities.OrderLine.fields.rush_surcharge_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tier-discount selection
          (>= breakpoint), per-unit + flat finishing summed, then a conditional rush
          multiplier branch on service_level. qty 100 @1000c, tier 50@10%, PER_UNIT 50c
          finishing, RUSH 2000bps -> final_line_cents 95000 and rush_surcharge_cents 19000.
        test_recipe:
          setup:
            - "Shop rush_surcharge_bps 2000. COPIES product base 1000, tier 50@1000bps, PER_UNIT finishing 50c, NONE customer."
            - "One RUSH line qty 100 with the finishing; preflight PASSED; confirmed."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Combo Shop", tax_rate_bps: 0, rush_surcharge_bps: 2000, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 100 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ShopStaff
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "c@x.com", name: "Cara" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Color Copy", category: "COPIES", base_unit_price_cents: 1000, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /pricing-tiers"
              payload: { product_id: "${prod_id}", min_quantity: 50, discount_bps: 1000 }
              as: ShopStaff
            - call: "POST /finishing-options"
              payload: { product_id: "${prod_id}", code: "LAMINATE", surcharge_kind: "PER_UNIT", surcharge_cents: 50 }
              as: ShopStaff
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 100, finishing_codes: ["LAMINATE"], service_level: "RUSH" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "c.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /fulfillments"
              payload: { order_id: "${order_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "OrderLine.${line_id}.final_line_cents == 95000"
            - "OrderLine.${line_id}.rush_surcharge_cents == 19000"

      - name: order_total_pinned_eval_order_discount_then_tax_then_rush
        grounds:
          - calculations.order_total
          - calculations.order_loyalty_discount
          - calculations.order_subtotal
          - entities.Order.fields.total_cents
        distinguishing_aspect: |
          Mode (c): circular-looking evaluation order pinned — tax keys off the
          DISCOUNTED subtotal while rush keys off pre-discount line surcharges, and
          rush is NOT taxed. Single STANDARD line subtotal 95000, SILVER 5% ->
          discount 4750, taxable 90250, tax(825bps) 7446, rush 0 -> total 97696.
        test_recipe:
          setup:
            - "A customer whose committed loyalty is injected to SILVER (completed_order_count 3, lifetime_paid_cents 40000, loyalty_score 3.0, loyalty_tier SILVER) via the test-driving endpoint."
            - "Then one order, single STANDARD line qty 100 base 1000 with a 50@1000bps tier and a PER_UNIT 50c finishing (subtotal 95000), PICKUP, shop tax 825bps."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Tax Shop", tax_rate_bps: 825, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 100 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ShopStaff
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "d@x.com", name: "Dia" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /_inject/customer-loyalty"
              payload: { customer_id: "${cust_id}", completed_order_count: 3, lifetime_paid_cents: 40000, loyalty_score: 3.0, loyalty_tier: "SILVER" }
              as: ShopStaff
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Color Copy", category: "COPIES", base_unit_price_cents: 1000, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /pricing-tiers"
              payload: { product_id: "${prod_id}", min_quantity: 50, discount_bps: 1000 }
              as: ShopStaff
            - call: "POST /finishing-options"
              payload: { product_id: "${prod_id}", code: "LAMINATE", surcharge_kind: "PER_UNIT", surcharge_cents: 50 }
              as: ShopStaff
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 100, finishing_codes: ["LAMINATE"], service_level: "STANDARD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "d.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /fulfillments"
              payload: { order_id: "${order_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${order_id}.subtotal_cents == 95000"
            - "Order.${order_id}.loyalty_discount_cents == 4750"
            - "Order.${order_id}.tax_cents == 7446"
            - "Order.${order_id}.total_cents == 97696"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: proof_cycle_submitted_changes_requested_resubmit
        grounds:
          - state_machines.Proof.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.Proof.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.OrderLine.PROOF_PENDING_to_PREFLIGHT_OK
          - entities.Proof.fields.round_number
        distinguishing_aspect: |
          Entity = Proof. Cyclic shape: SUBMITTED -> CHANGES_REQUESTED -> (new) SUBMITTED.
          request-changes reopens the line to PREFLIGHT_OK; a second proof submit
          produces round_number 2. This is a cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "A line whose product requires_proof, preflight PASSED, first proof SUBMITTED then CHANGES_REQUESTED (line back to PREFLIGHT_OK)."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Proof Shop", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 100 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "e@x.com", name: "Eve" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Banner Proofed", category: "BANNER", base_unit_price_cents: 5000, requires_proof: true, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "e.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /proofs"
              payload: { order_line_id: "${line_id}" }
              as: ProductionOperator
              captures: { proof1_id: $.data.id }
            - call: "POST /proofs/${proof1_id}/request-changes"
              payload: { change_note: "Logo too small" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /proofs"
              payload: { order_line_id: "${line_id}" }
              as: ProductionOperator
              captures: { proof2_id: $.data.id }
          assert:
            - "Proof.${proof2_id}.round_number == 2"
            - "Proof.${proof2_id}.status == SUBMITTED"
            - "OrderLine.${line_id}.status == PROOF_PENDING"

      - name: order_parallel_production_and_payment_dimensions
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - state_machines.Order.UNPAID_to_INVOICED
          - state_machines.Order.INVOICED_to_PAID
          - entities.Order.fields.production_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Entity = Order. Parallel state dimensions: production_status and
          payment_status evolve on the same row independently. After confirm +
          invoice + pay, production_status == CONFIRMED while payment_status == PAID
          (production has not advanced to IN_PRODUCTION). Different entity from Proof.
        test_recipe:
          setup:
            - "Confirmed order (no proof/press), then invoiced and paid, but production NOT started."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Parallel Shop", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 100 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ShopStaff
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "f@x.com", name: "Fay" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "BW Copy", category: "COPIES", base_unit_price_cents: 500, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "f.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /fulfillments"
              payload: { order_id: "${order_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/invoice"
              payload: {}
              as: ShopStaff
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${order_id}.payment_status == PAID"
            - "Order.${order_id}.production_status == CONFIRMED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cancel_releases_capacity_and_press_depth3
        grounds:
          - state_machines.Order.DRAFT_to_CANCELLED
          - state_machines.CapacityReservation.HELD_to_RELEASED
          - state_machines.PressBooking.CONFIRMED_to_RELEASED
          - entities.CapacityReservation.fields.status
          - entities.PressBooking.fields.status
        distinguishing_aspect: |
          Trigger = Order cancel. Depth-3 chain: cancel mutates Order -> CANCELLED;
          that mutation causes each HELD CapacityReservation -> RELEASED; AND each
          CONFIRMED PressBooking for the order's lines -> RELEASED. Each link is
          caused by the prior (order cancellation), not directly issued by the client.
        test_recipe:
          setup:
            - "Confirmed order with one BANNER line (requires_press) that holds a CONFIRMED PressBooking and a HELD CapacityReservation."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Cascade Shop", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 100 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ShopStaff
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "g@x.com", name: "Gus" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
