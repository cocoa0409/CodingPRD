            - call: "POST /advocacy/expenditure-reports"
              payload: { registration_id: "${reg_id}", period_code: "2026Q3", basis: "METHOD_B", expected_registration_version: "${reg_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /advocacy/lobbying-activities/${act2_id}/void"
              payload: { void_reason: "Double-booked consultant hours removed after review" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
          assert:
            - "Before the void: LobbyingRegistration.${reg_id}.ytd_reportable_cents == 700000 and ytd_reportable_hours == 6.000; ExpenditureReport.${rep_id}.method_a_total_cents == 700000, method_b_total_cents == 751001, filed_total_cents == 751001, included_activity_count == 2"
            - "After the void: LobbyingActivity.${act2_id}.status == VOIDED with void_reason recorded, while LobbyingActivity.${act1_id}.status is still LOGGED with staff_cost_cents 28331"
            - "ACCUMULATOR RESTORED: LobbyingRegistration.${reg_id}.ytd_reportable_cents == 400000 and ytd_reportable_hours == 3.333, exactly the values before A2 was logged"
            - "OPEN REPORT RECOMPUTED: ExpenditureReport.${rep_id}.method_a_total_cents == 400000, method_b_total_cents == 428331 (NOT 428330), filed_total_cents == 428331, included_activity_count == 1, status still OPEN"
            - "LobbyingRegistration.${reg_id}.status is still ACTIVE and amendment_round is still 0 - the void never crossed the 1400000 threshold in either direction"
            - "Voiding A2 a second time is refused with 409 ERR_ACTIVITY_ALREADY_VOIDED, so the compensation cannot be applied twice"
