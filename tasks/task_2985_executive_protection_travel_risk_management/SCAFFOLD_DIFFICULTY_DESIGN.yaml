      - name: trip_approval_and_readiness_dimensions_advance_independently
        grounds:
          - state_machines.Trip.approval_state
          - state_machines.Trip.readiness_state
          - state_machines.Trip.NOT_READY_to_ADVANCE_IN_PROGRESS
          - state_machines.Trip.READY_to_DEGRADED
          - state_machines.Trip.DEGRADED_to_READY
          - entities.TripLeg.fields.lead_agent_covered
          - endpoints.POST_/exec-protection/detail-assignments/{id}/release
        distinguishing_aspect: |
          Parallel dimensions on a single Trip row: approval_state and readiness_state are
          two independent state fields on the same entity, not one composite. This walks a
          sequence in which each write moves at most one dimension — advance-progress moves
          readiness with approval frozen at DRAFT, submit-for-approval moves approval with
          readiness frozen at ADVANCE_IN_PROGRESS, release moves readiness READY ->
          DEGRADED with approval frozen at APPROVED, and re-covering the leg closes the
          readiness cycle back to READY without touching approval. A single-field
          implementation cannot reproduce the DRAFT/ADVANCE_IN_PROGRESS and
          APPROVED/DEGRADED combinations. Different entity from the cyclic instance above.
