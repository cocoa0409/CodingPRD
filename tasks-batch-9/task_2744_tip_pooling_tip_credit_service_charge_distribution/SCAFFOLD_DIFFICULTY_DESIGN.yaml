            - "PayPeriod.${period_id}.status is still COMPUTED with total_credited_minutes 480 and compute_variant WEEKLY_AGGREGATE"
            - "after POST /pay-periods/${period_id}/reopen the identical shift payload succeeds with 201, proving the rejection was about the period's state and nothing else"

      - name: compute_pay_period_with_pending_pool_returns_pool_not_distributed
        grounds:
          - validations.priority_18
          - errors.ERR_POOL_NOT_DISTRIBUTED
          - state_machines.ShiftTipPool.distribution_status
