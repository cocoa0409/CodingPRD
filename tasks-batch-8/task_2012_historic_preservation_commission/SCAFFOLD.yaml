# =============================================================================
# Task 2012 — Historic Preservation Commission & Certificate of Appropriateness
# Scaffold seed tables (§1.0–§1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2012. Historic Preservation Commission & Certificate of Appropriateness
  (municipal preservation commission): property inventory & district boundary,
  application intake with drawings/material specs, staff review vs commission
  hearing threshold, design guideline application & precedent consistency,
  hearing notice & public comment, approval conditions & appeal to council,
  demolition delay & economic hardship review, violation enforcement &
  after-the-fact applications

domain_name: historic-preservation
api_prefix: /preservation

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on Property.version (reclassify)
    - cascading_side_effects        # appeal-sustained chain; demolition completion chain
    - version_pinning_on_approval   # completeness acceptance pins the ADOPTED guideline set; decide detects supersede
    - rate_threshold_triggers       # review-track cost threshold; penalty tier/cap; escalation threshold
  entity_topology: flat             # peer resources linked by FK; no nested ownership paths
  state_machine_shape: cyclic       # resubmission loop + hearing deferral loop on Application; continue/reschedule on Hearing
  relationship_patterns:
    - one_to_many                   # District→Property, Application→Hearing, Hearing→PublicComment
    - cross_aggregate               # Application↔Violation after-the-fact link; Decision pins GuidelineSet version
  role_model: segregation_of_duties # completeness acceptor cannot decide the same STAFF-track application
  consistency_model: immediate      # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: HistoricDistrict
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District name" }
      - { name: boundary_description, type: string, source: input, description: "Narrative legal boundary of the district" }
      - { name: significance_tier, type: enum, source: input, description: "LOCAL | LANDMARK | ICONIC — drives review-track branch and demolition delay base days" }
      - { name: status, type: enum, source: system, description: "ACTIVE | BOUNDARY_REVIEW — starts ACTIVE; BOUNDARY_REVIEW freezes new application intake for properties in this district" }
      - { name: contributing_count, type: integer, source: computed, description: "Count of Properties with district_id = this district, listing_status != DEMOLISHED, contributing_status == CONTRIBUTING" }
      - { name: total_inventory_count, type: integer, source: computed, description: "Count of Properties with district_id = this district and listing_status != DEMOLISHED" }
      - { name: preservation_posture, type: enum, source: computed, description: "STABLE | AT_RISK — AT_RISK iff total_inventory_count > 0 AND contributing_count * 2 < total_inventory_count" }

  - name: DesignGuidelineSet
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> HistoricDistrict.id; guideline set applies to this district" }
      - { name: title, type: string, source: input, description: "Guideline set title" }
      - { name: sections, type: array, source: input, description: "Array of section objects {section_code, text} citable in decision rationales" }
      - { name: version_no, type: integer, source: system, description: "Per-district monotonic version: 1 + count of prior guideline sets for the district" }
      - { name: adopted_at, type: datetime, source: system, description: "Logical-clock timestamp when adopted; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | ADOPTED | SUPERSEDED — at most one ADOPTED set per district" }

  - name: PropertyOwner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Owner or authorized agent name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: mailing_address, type: string, source: input, description: "Mailing address for notices" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: parcel_number, type: string, source: input, description: "Assessor parcel number; unique across the inventory" }
      - { name: district_id, type: string, source: input, description: "FK -> HistoricDistrict.id; null = outside any district (inventory-only property)" }
      - { name: owner_id, type: string, source: input, description: "FK -> PropertyOwner.id; current recorded owner" }
      - { name: contributing_status, type: enum, source: input, description: "CONTRIBUTING | NON_CONTRIBUTING | VACANT_LOT" }
      - { name: construction_year, type: integer, source: input, description: "Year constructed" }
      - { name: assessed_value_cents, type: integer, source: input, description: "Current assessed value in cents; basis of the violation penalty cap" }
      - { name: listing_status, type: enum, source: system, description: "INVENTORY | DEMOLITION_PENDING | DEMOLISHED" }
      - { name: open_violation_count, type: integer, source: computed, description: "Count of Violations on this property in status OPEN | NOTICE_ISSUED | AFTER_THE_FACT_PENDING | COURT_REFERRAL" }
      - { name: compliance_posture, type: enum, source: computed, description: "CLEAR | UNDER_ENFORCEMENT — UNDER_ENFORCEMENT iff open_violation_count > 0" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; subject property" }
      - { name: owner_id, type: string, source: input, description: "FK -> PropertyOwner.id; applicant; MUST equal X-User-ID when X-User-Role == Applicant" }
      - { name: application_type, type: enum, source: input, description: "ALTERATION | ADDITION | NEW_CONSTRUCTION | DEMOLITION | RELOCATION" }
      - { name: is_visible_from_public_way, type: boolean, source: input, description: "Whether proposed work is visible from a public right-of-way" }
      - { name: after_the_fact, type: boolean, source: input, description: "True when the application legalizes work already performed under a Violation" }
      - { name: violation_id, type: string, source: input, description: "FK -> Violation.id; required iff after_the_fact == true, else null" }
      - { name: work_items, type: array, source: input, description: "Array of {category, description, estimated_cost_cents}; category in EXTERIOR_ALTERATION | ADDITION | NEW_CONSTRUCTION | DEMOLITION | RELOCATION | SITE_WORK" }
      - { name: declared_cost_cents, type: integer, source: computed, description: "Sum of work_items[*].estimated_cost_cents (recomputed on resubmit)" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Fee computed from declared work items at submission/resubmission; no hearing surcharge" }
      - { name: verified_work_items, type: array, source: system, description: "Staff-verified array of {category, verified_cost_cents} recorded at completeness acceptance" }
      - { name: verified_cost_cents, type: integer, source: computed, description: "Sum of verified_work_items[*].verified_cost_cents; null until ACCEPTED" }
      - { name: review_track, type: enum, source: computed, description: "STAFF | COMMISSION — computed at completeness acceptance; null before" }
      - { name: assessed_fee_cents, type: integer, source: computed, description: "Final fee computed at completeness acceptance incl. hearing surcharge when COMMISSION" }
      - { name: paid_fee_cents, type: integer, source: computed, description: "Sum of recorded fee payments" }
      - { name: refunded_fee_cents, type: integer, source: computed, description: "Refund issued on withdrawal per refund schedule" }
      - { name: fee_balance_cents, type: integer, source: computed, description: "assessed_fee_cents - paid_fee_cents; forced to 0 on withdrawal after refund" }
      - { name: guideline_set_id, type: string, source: system, description: "FK -> DesignGuidelineSet.id; ADOPTED set pinned at completeness acceptance; re-pinned on decide with guideline_override_ack" }
      - { name: completeness_accepted_by, type: string, source: system, description: "X-User-ID of the PreservationStaff user who accepted completeness (segregation-of-duties record)" }
      - { name: resubmission_count, type: integer, source: computed, description: "Number of resubmit transitions executed" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock timestamp of latest return-incomplete" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decision (also appeal-window anchor)" }
      - { name: decision_conditions, type: array, source: system, description: "Approval conditions recorded at decide; empty unless APPROVED_WITH_CONDITIONS" }
      - { name: denial_rationale_sections, type: array, source: system, description: "Guideline section codes cited for a DENY outcome" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_STAFF_REVIEW | INCOMPLETE | ACCEPTED | HEARING_SCHEDULED | HEARING_DEFERRED | HEARING_OPEN | APPROVED | APPROVED_WITH_CONDITIONS | DENIED | APPROVED_ON_APPEAL | DENIED_FINAL | WITHDRAWN" }

  - name: CommissionMeeting
    parent: null
    common_fields: true
    fields:
      - { name: meeting_date, type: datetime, source: input, description: "Scheduled meeting date/time (ISO8601 UTC)" }
      - { name: location, type: string, source: input, description: "Meeting location" }
      - { name: agenda_capacity, type: integer, source: input, description: "Maximum number of hearings with status SCHEDULED or OPENED that may occupy this meeting" }
      - { name: scheduled_hearing_count, type: integer, source: computed, description: "Count of Hearings with meeting_id = this meeting and status in {SCHEDULED, OPENED}" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application under hearing" }
      - { name: meeting_id, type: string, source: input, description: "FK -> CommissionMeeting.id; meeting the hearing occupies" }
      - { name: notice_posted_at, type: datetime, source: input, description: "Timestamp the hearing notice was posted; must be <= meeting_date - 15 days" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPENED | CONTINUED | DECIDED | WITHDRAWN" }

  - name: PublicComment
    parent: null
    common_fields: false
    fields:
      - { name: hearing_id, type: string, source: input, description: "FK -> Hearing.id; hearing commented on" }
      - { name: commenter_name, type: string, source: input, description: "Name of the commenter" }
      - { name: stance, type: enum, source: input, description: "SUPPORT | OPPOSE | NEUTRAL" }
      - { name: comment_text, type: string, source: input, description: "Comment body" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the DENIED application under appeal" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock filing timestamp; must be <= application.decided_at + 30 days" }
      - { name: grounds, type: string, source: input, description: "Grounds for appeal" }
      - { name: council_findings, type: string, source: system, description: "Council findings recorded at decide" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of council decision" }
      - { name: status, type: enum, source: system, description: "FILED | DECIDED_SUSTAINED | DECIDED_UPHELD | WITHDRAWN" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property where unpermitted work was observed" }
      - { name: observed_violation_date, type: datetime, source: input, description: "Date the unpermitted work was observed" }
      - { name: work_description, type: string, source: input, description: "Description of the unpermitted work" }
      - { name: notice_issued_at, type: datetime, source: system, description: "Logical-clock timestamp of notice issuance; penalty accrual starts here" }
      - { name: demand_letter_amount_cents, type: integer, source: computed, description: "Projected penalty if cured within the 30-day cure window (demand variant of civil_penalty)" }
      - { name: compliance_verified_at, type: datetime, source: system, description: "Timestamp accrual stopped (officer verification or after-the-fact approval)" }
      - { name: referred_at, type: datetime, source: system, description: "Timestamp of court referral" }
      - { name: final_penalty_cents, type: integer, source: computed, description: "Final assessed penalty (final variant of civil_penalty), set at compliance verification or close after referral" }
      - { name: penalty_capped, type: boolean, source: computed, description: "True when the cap (10% of property assessed value) limited the penalty" }
      - { name: status, type: enum, source: system, description: "OPEN | NOTICE_ISSUED | AFTER_THE_FACT_PENDING | COMPLIANCE_VERIFIED | COURT_REFERRAL | CLOSED" }

  - name: DemolitionDelay
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; the approved DEMOLITION application" }
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; denormalized from the application for overlap checks" }
      - { name: base_delay_days, type: integer, source: system, description: "Base delay from district significance tier: LOCAL 90 | LANDMARK 180 | ICONIC 365" }
      - { name: postponement_count, type: integer, source: system, description: "Number of granted postponements (max 2); each adds 30 days" }
      - { name: delay_start_at, type: datetime, source: system, description: "Equals the application's decided_at" }
      - { name: provisional_delay_end, type: datetime, source: computed, description: "delay_start_at + base_delay_days + postponement_count * 30 days" }
      - { name: final_delay_end, type: datetime, source: computed, description: "Set when hardship GRANTED: hardship decided_at + 10 days; otherwise null and provisional_delay_end governs" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | LIFTED_BY_HARDSHIP — EXPIRED is lazily evaluated: any read/action with clock >= effective end transitions it" }

  - name: HardshipReview
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; approved DEMOLITION application claiming economic hardship" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock filing timestamp; must satisfy decided_at < filed_at <= provisional_delay_end - 30 days" }
      - { name: claimed_rate_of_return_pct, type: number, source: input, description: "Applicant-claimed rate of return under the denial, percent" }
      - { name: appraisal_basis_cents, type: integer, source: input, description: "Applicant appraisal basis in cents" }
      - { name: findings, type: string, source: system, description: "Commission findings recorded at decide" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the hardship decision" }
      - { name: status, type: enum, source: system, description: "FILED | HEARD | GRANTED | DENIED" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; 1:1 — one certificate per approved application" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock issuance timestamp" }
      - { name: work_commence_deadline, type: datetime, source: computed, description: "issued_at + 365 days; work must commence (and complete) by this instant" }
      - { name: conditions, type: array, source: system, description: "Copied from the application's decision_conditions at issuance" }
      - { name: conditions_met_count, type: integer, source: system, description: "Staff-verified count of satisfied conditions" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion" }
      - { name: status, type: enum, source: system, description: "ISSUED | CONDITIONS_VERIFIED | COMPLETED | EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [APPROVED, APPROVED_WITH_CONDITIONS, APPROVED_ON_APPEAL, DENIED_FINAL, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_STAFF_REVIEW
        trigger: "POST /preservation/applications/{applicationId}/begin-review"
        actor: PreservationStaff
        preconditions: []
        side_effects: []

      - from: UNDER_STAFF_REVIEW
        to: INCOMPLETE
        trigger: "POST /preservation/applications/{applicationId}/return-incomplete"
        actor: PreservationStaff
        preconditions: []
        side_effects:
          - "returned_at := logical clock"

      - from: INCOMPLETE
        to: UNDER_STAFF_REVIEW
        trigger: "POST /preservation/applications/{applicationId}/resubmit"
        actor: Applicant
        preconditions:
          - "logical clock <= returned_at + 90 days (ERR_RESUBMISSION_WINDOW_LAPSED)"
          - "X-User-ID == application.owner_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "work_items replaced by payload; declared_cost_cents recomputed"
          - "provisional_fee_cents recomputed from new declared items"
          - "resubmission_count += 1"

      - from: UNDER_STAFF_REVIEW
        to: ACCEPTED
        trigger: "POST /preservation/applications/{applicationId}/accept-completeness"
        actor: PreservationStaff
        preconditions: []
        side_effects:
          - "verified_work_items recorded; verified_cost_cents computed"
          - "review_track computed (review_track_determination)"
          - "assessed_fee_cents computed (application_fee, final variant); fee_balance_cents := assessed_fee_cents"
          - "guideline_set_id pinned to district's currently ADOPTED DesignGuidelineSet (null if none or no district)"
          - "completeness_accepted_by := X-User-ID"

      - from: ACCEPTED
        to: HEARING_SCHEDULED
        trigger: "system (on POST /preservation/hearings for this application)"
        actor: system
        preconditions:
          - "application.review_track == COMMISSION"
        side_effects: []

      - from: HEARING_SCHEDULED
        to: HEARING_OPEN
        trigger: "system (on POST /preservation/hearings/{hearingId}/open)"
        actor: system
        preconditions: []
        side_effects: []

      - from: HEARING_SCHEDULED
        to: HEARING_DEFERRED
        trigger: "system (on POST /preservation/hearings/{hearingId}/continue)"
        actor: system
        preconditions: []
        side_effects: []

      - from: HEARING_OPEN
        to: HEARING_DEFERRED
        trigger: "system (on POST /preservation/hearings/{hearingId}/continue)"
        actor: system
        preconditions: []
        side_effects: []

      - from: HEARING_DEFERRED
        to: HEARING_SCHEDULED
        trigger: "system (on POST /preservation/hearings/{hearingId}/reschedule)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: APPROVED
        trigger: "POST /preservation/applications/{applicationId}/decide outcome=APPROVE"
        actor: PreservationStaff
        preconditions:
          - "application.review_track == STAFF (ERR_COMMISSION_HEARING_REQUIRED)"
          - "X-User-ID != completeness_accepted_by (ERR_SEGREGATION_OF_DUTIES)"
          - "if pinned guideline set is no longer ADOPTED, guideline_override_ack must be true (ERR_GUIDELINE_SET_SUPERSEDED)"
        side_effects:
          - "decided_at := logical clock; decision_conditions := []"
          - "demolition side effects if application_type == DEMOLITION (see decide-demotion note)"

      - from: ACCEPTED
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /preservation/applications/{applicationId}/decide outcome=APPROVE_WITH_CONDITIONS"
        actor: PreservationStaff
        preconditions:
          - "application.review_track == STAFF (ERR_COMMISSION_HEARING_REQUIRED)"
          - "X-User-ID != completeness_accepted_by (ERR_SEGREGATION_OF_DUTIES)"
          - "conditions array must be non-empty (ERR_CONDITIONS_REQUIRED)"
          - "if pinned guideline set is no longer ADOPTED, guideline_override_ack must be true (ERR_GUIDELINE_SET_SUPERSEDED)"
        side_effects:
          - "decided_at := logical clock; decision_conditions := payload conditions"
          - "demolition side effects if application_type == DEMOLITION"

      - from: ACCEPTED
        to: DENIED
        trigger: "POST /preservation/applications/{applicationId}/decide outcome=DENY"
        actor: PreservationStaff
        preconditions:
          - "application.review_track == STAFF (ERR_COMMISSION_HEARING_REQUIRED)"
          - "X-User-ID != completeness_accepted_by (ERR_SEGREGATION_OF_DUTIES)"
          - "denial_rationale_sections array must be non-empty (ERR_DENIAL_RATIONALE_REQUIRED)"
          - "if pinned guideline set is no longer ADOPTED, guideline_override_ack must be true (ERR_GUIDELINE_SET_SUPERSEDED)"
        side_effects:
          - "decided_at := logical clock; denial_rationale_sections recorded"

      - from: HEARING_OPEN
        to: APPROVED
        trigger: "POST /preservation/applications/{applicationId}/decide outcome=APPROVE"
        actor: Commissioner
        preconditions:
          - "application.review_track == COMMISSION (ERR_STAFF_DECISION_NOT_PERMITTED is N/A here; track already COMMISSION)"
          - "if pinned guideline set is no longer ADOPTED, guideline_override_ack must be true (ERR_GUIDELINE_SET_SUPERSEDED)"
        side_effects:
          - "decided_at := logical clock; decision_conditions := []"
          - "the OPENED Hearing -> DECIDED"
          - "demolition side effects if application_type == DEMOLITION"
          - "after-the-fact violation resolution if after_the_fact == true"

      - from: HEARING_OPEN
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /preservation/applications/{applicationId}/decide outcome=APPROVE_WITH_CONDITIONS"
        actor: Commissioner
        preconditions:
          - "conditions array must be non-empty (ERR_CONDITIONS_REQUIRED)"
          - "if pinned guideline set is no longer ADOPTED, guideline_override_ack must be true (ERR_GUIDELINE_SET_SUPERSEDED)"
        side_effects:
          - "decided_at := logical clock; decision_conditions := payload conditions"
          - "the OPENED Hearing -> DECIDED"
          - "demolition side effects if application_type == DEMOLITION"
          - "after-the-fact violation resolution if after_the_fact == true"

      - from: HEARING_OPEN
        to: DENIED
        trigger: "POST /preservation/applications/{applicationId}/decide outcome=DENY"
        actor: Commissioner
        preconditions:
          - "denial_rationale_sections array must be non-empty (ERR_DENIAL_RATIONALE_REQUIRED)"
          - "if pinned guideline set is no longer ADOPTED, guideline_override_ack must be true (ERR_GUIDELINE_SET_SUPERSEDED)"
        side_effects:
          - "decided_at := logical clock; denial_rationale_sections recorded"
          - "the OPENED Hearing -> DECIDED"

      - from: DENIED
        to: APPROVED_ON_APPEAL
        trigger: "system (on POST /preservation/appeals/{appealId}/decide outcome=SUSTAIN)"
        actor: system
        preconditions: []
        side_effects:
          - "after-the-fact violation resolution if after_the_fact == true (see Appeal decide cascade)"

      - from: DENIED
        to: DENIED_FINAL
        trigger: "system (on POST /preservation/appeals/{appealId}/decide outcome=UPHOLD)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DENIED
        to: DENIED_FINAL
        trigger: "POST /preservation/applications/{applicationId}/finalize-denial"
        actor: PreservationStaff
        preconditions:
          - "no Appeal for this application in status FILED (ERR_INVALID_STATE)"
          - "logical clock > decided_at + 30 days (ERR_INVALID_STATE — window still open)"
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /preservation/applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.owner_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "fee refund per fee_refund_schedule (stage SUBMITTED/UNDER_STAFF_REVIEW/INCOMPLETE = 100%)"
          - "fee_balance_cents := 0"

      - from: UNDER_STAFF_REVIEW
        to: WITHDRAWN
        trigger: "POST /preservation/applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID == application.owner_id"]
        side_effects: ["100% refund of paid_fee_cents", "fee_balance_cents := 0"]

      - from: INCOMPLETE
        to: WITHDRAWN
        trigger: "POST /preservation/applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID == application.owner_id"]
        side_effects: ["100% refund of paid_fee_cents", "fee_balance_cents := 0"]

      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /preservation/applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID == application.owner_id"]
        side_effects: ["50% refund of paid_fee_cents", "fee_balance_cents := 0"]

      - from: HEARING_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /preservation/applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID == application.owner_id"]
        side_effects:
          - "50% refund of paid_fee_cents; fee_balance_cents := 0"
          - "the SCHEDULED Hearing -> WITHDRAWN; meeting.scheduled_hearing_count -= 1"

      - from: HEARING_DEFERRED
        to: WITHDRAWN
        trigger: "POST /preservation/applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID == application.owner_id"]
        side_effects:
          - "50% refund of paid_fee_cents; fee_balance_cents := 0"
          - "the CONTINUED Hearing -> WITHDRAWN"

      - from: HEARING_OPEN
        to: WITHDRAWN
        trigger: "POST /preservation/applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions: ["X-User-ID == application.owner_id"]
        side_effects:
          - "0% refund; fee_balance_cents := 0"
          - "the OPENED Hearing -> WITHDRAWN; meeting.scheduled_hearing_count -= 1"

    note: |
      Demolition side effects (on any approval of an application_type == DEMOLITION application):
      (1) Property.listing_status -> DEMOLITION_PENDING;
      (2) DemolitionDelay created ACTIVE: delay_start_at := decided_at,
          base_delay_days from district tier, provisional_delay_end computed;
      (3) the delay-overlap check (ERR_DEMOLITION_DELAY_OVERLAP) runs BEFORE the approval commits.
      After-the-fact violation resolution (on any approval with after_the_fact == true):
      linked Violation -> COMPLIANCE_VERIFIED, compliance_verified_at := decided_at,
      final_penalty_cents computed (final variant, stop = decided_at),
      Property.open_violation_count -= 1 and compliance_posture recomputed.

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [DECIDED, WITHDRAWN]
    transitions:
      - from: SCHEDULED
        to: OPENED
        trigger: "POST /preservation/hearings/{hearingId}/open"
        actor: Commissioner
        preconditions:
          - "application must be HEARING_SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "Application HEARING_SCHEDULED -> HEARING_OPEN"
          - "public comment period closes (comments now rejected ERR_COMMENT_PERIOD_CLOSED)"

      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /preservation/hearings/{hearingId}/continue"
        actor: Commissioner
        preconditions: []
        side_effects:
          - "Application HEARING_SCHEDULED -> HEARING_DEFERRED"
          - "meeting.scheduled_hearing_count -= 1"

      - from: OPENED
        to: CONTINUED
        trigger: "POST /preservation/hearings/{hearingId}/continue"
        actor: Commissioner
        preconditions: []
        side_effects:
          - "Application HEARING_OPEN -> HEARING_DEFERRED"
          - "meeting.scheduled_hearing_count -= 1"

      - from: CONTINUED
        to: SCHEDULED
        trigger: "POST /preservation/hearings/{hearingId}/reschedule"
        actor: PreservationStaff
        preconditions:
          - "new notice_posted_at <= new meeting.meeting_date - 15 days (ERR_NOTICE_WINDOW_TOO_SHORT)"
          - "new meeting.scheduled_hearing_count < agenda_capacity (ERR_MEETING_AGENDA_FULL)"
        side_effects:
          - "meeting_id and notice_posted_at replaced"
          - "new meeting.scheduled_hearing_count += 1"
          - "Application HEARING_DEFERRED -> HEARING_SCHEDULED"

      - from: OPENED
        to: DECIDED
        trigger: "system (on POST /preservation/applications/{applicationId}/decide)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "system (on application withdraw)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPENED
        to: WITHDRAWN
        trigger: "system (on application withdraw)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONTINUED
        to: WITHDRAWN
        trigger: "system (on application withdraw)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Violation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: NOTICE_ISSUED
        trigger: "POST /preservation/violations/{violationId}/issue-notice"
        actor: EnforcementOfficer
        preconditions: []
        side_effects:
          - "notice_issued_at := logical clock"
          - "demand_letter_amount_cents computed (demand variant of civil_penalty)"

      - from: NOTICE_ISSUED
        to: AFTER_THE_FACT_PENDING
        trigger: "system (on submission of an after_the_fact Application with violation_id = this violation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: NOTICE_ISSUED
        to: COMPLIANCE_VERIFIED
        trigger: "POST /preservation/violations/{violationId}/verify-compliance"
        actor: EnforcementOfficer
        preconditions:
          - "by construction a NOTICE_ISSUED violation has no linked after-the-fact application (submission flips it to AFTER_THE_FACT_PENDING)"
        side_effects:
          - "compliance_verified_at := logical clock"
          - "final_penalty_cents computed (final variant, stop = compliance_verified_at); penalty_capped set"
          - "Property.open_violation_count -= 1; compliance_posture recomputed"

      - from: AFTER_THE_FACT_PENDING
        to: COMPLIANCE_VERIFIED
        trigger: "POST /preservation/violations/{violationId}/verify-compliance"
        actor: EnforcementOfficer
        preconditions:
          - "linked after-the-fact application must be in an approval terminal state (APPROVED | APPROVED_WITH_CONDITIONS | APPROVED_ON_APPEAL); otherwise ERR_LINKED_APPLICATION_NOT_APPROVED"
        side_effects:
          - "compliance_verified_at := logical clock"
          - "final_penalty_cents computed (final variant, stop = compliance_verified_at); penalty_capped set"
          - "Property.open_violation_count -= 1; compliance_posture recomputed"

      - from: AFTER_THE_FACT_PENDING
        to: COMPLIANCE_VERIFIED
        trigger: "system (on approval of the linked after-the-fact application, incl. APPROVED_ON_APPEAL)"
        actor: system
        preconditions: []
        side_effects:
          - "compliance_verified_at := application.decided_at (or appeal decided_at for APPROVED_ON_APPEAL)"
          - "final_penalty_cents computed (final variant, stop = compliance_verified_at); penalty_capped set"
          - "Property.open_violation_count -= 1; compliance_posture recomputed"

      - from: NOTICE_ISSUED
        to: COURT_REFERRAL
        trigger: "POST /preservation/violations/{violationId}/refer-court"
        actor: EnforcementOfficer
        preconditions:
          - "whole days between logical clock and notice_issued_at must be > 60 (ERR_ESCALATION_THRESHOLD_NOT_MET at <= 60)"
        side_effects:
          - "referred_at := logical clock"

      - from: COMPLIANCE_VERIFIED
        to: CLOSED
        trigger: "POST /preservation/violations/{violationId}/close"
        actor: EnforcementOfficer
        preconditions: []
        side_effects: []

      - from: COURT_REFERRAL
        to: CLOSED
        trigger: "POST /preservation/violations/{violationId}/close"
        actor: EnforcementOfficer
        preconditions: []
        side_effects:
          - "final_penalty_cents computed if not already set (final variant, stop = referred_at); penalty_capped set"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [DECIDED_SUSTAINED, DECIDED_UPHELD, WITHDRAWN]
    transitions:
      - from: FILED
        to: DECIDED_SUSTAINED
        trigger: "POST /preservation/appeals/{appealId}/decide outcome=SUSTAIN"
        actor: CouncilMember
        preconditions: []
        side_effects:
          - "decided_at := logical clock; council_findings recorded"
          - "Application DENIED -> APPROVED_ON_APPEAL"
          - "if application.after_the_fact: linked Violation NOTICE_ISSUED|AFTER_THE_FACT_PENDING -> COMPLIANCE_VERIFIED with compliance_verified_at := appeal.decided_at; final_penalty_cents computed (stop = appeal.decided_at)"
          - "Property.open_violation_count -= 1 (if violation resolved); compliance_posture recomputed"

      - from: FILED
        to: DECIDED_UPHELD
        trigger: "POST /preservation/appeals/{appealId}/decide outcome=UPHOLD"
        actor: CouncilMember
        preconditions: []
        side_effects:
          - "decided_at := logical clock; council_findings recorded"
          - "Application DENIED -> DENIED_FINAL"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /preservation/appeals/{appealId}/withdraw"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.owner_id (ERR_FORBIDDEN_ROLE)"
        side_effects: []

  - entity: DemolitionDelay
    initial_state: ACTIVE
    terminal_states: [EXPIRED, LIFTED_BY_HARDSHIP]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy evaluation on any read of or action on this delay when logical clock >= effective end, where effective end = final_delay_end if set else provisional_delay_end)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: LIFTED_BY_HARDSHIP
        trigger: "system (on POST /preservation/hardship-reviews/{hardshipReviewId}/decide outcome=GRANT)"
        actor: system
        preconditions: []
        side_effects:
          - "final_delay_end := hardship.decided_at + 10 days"

  - entity: HardshipReview
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: HEARD
        trigger: "POST /preservation/hardship-reviews/{hardshipReviewId}/hear"
        actor: Commissioner
        preconditions: []
        side_effects: []

      - from: HEARD
        to: GRANTED
        trigger: "POST /preservation/hardship-reviews/{hardshipReviewId}/decide outcome=GRANT"
        actor: Commissioner
        preconditions: []
        side_effects:
          - "decided_at := logical clock; findings recorded"
          - "linked DemolitionDelay ACTIVE -> LIFTED_BY_HARDSHIP; final_delay_end := decided_at + 10 days"

      - from: HEARD
        to: DENIED
        trigger: "POST /preservation/hardship-reviews/{hardshipReviewId}/decide outcome=DENY"
        actor: Commissioner
        preconditions: []
        side_effects:
          - "decided_at := logical clock; findings recorded"

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: ISSUED
        to: CONDITIONS_VERIFIED
        trigger: "POST /preservation/certificates/{certificateId}/verify-conditions"
        actor: PreservationStaff
        preconditions:
          - "conditions_met_count (payload) must equal len(certificate.conditions) (ERR_CONDITIONS_UNMET)"
        side_effects: []

      - from: CONDITIONS_VERIFIED
        to: COMPLETED
        trigger: "POST /preservation/certificates/{certificateId}/complete"
        actor: PreservationStaff
        preconditions:
          - "logical clock <= work_commence_deadline (ERR_CERTIFICATE_EXPIRED)"
          - "payload commenced_at <= work_commence_deadline (ERR_CERTIFICATE_EXPIRED)"
        side_effects:
          - "completed_at := logical clock"
          - "if application_type == DEMOLITION: Property DEMOLITION_PENDING -> DEMOLISHED; HistoricDistrict.contributing_count -= 1 iff property was CONTRIBUTING; total_inventory_count -= 1; preservation_posture recomputed"

      - from: ISSUED
        to: EXPIRED
        trigger: "POST /preservation/certificates/{certificateId}/expire"
        actor: PreservationStaff
        preconditions:
          - "logical clock > work_commence_deadline (ERR_CERTIFICATE_NOT_YET_EXPIRED at <= deadline)"
        side_effects: []

      - from: CONDITIONS_VERIFIED
        to: EXPIRED
        trigger: "POST /preservation/certificates/{certificateId}/expire"
        actor: PreservationStaff
        preconditions:
          - "logical clock > work_commence_deadline (ERR_CERTIFICATE_NOT_YET_EXPIRED)"
        side_effects: []

  - entity: HistoricDistrict
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: BOUNDARY_REVIEW
        trigger: "PATCH /preservation/districts/{districtId} status=BOUNDARY_REVIEW"
        actor: PreservationStaff
        preconditions: []
        side_effects: []

      - from: BOUNDARY_REVIEW
        to: ACTIVE
        trigger: "PATCH /preservation/districts/{districtId} status=ACTIVE"
        actor: PreservationStaff
        preconditions: []
        side_effects: []

  - entity: DesignGuidelineSet
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /preservation/guideline-sets/{guidelineSetId}/adopt"
        actor: PreservationStaff
        preconditions: []
        side_effects:
          - "adopted_at := logical clock"
          - "the district's previously ADOPTED set (if any) -> SUPERSEDED"

  - entity: Property
    initial_state: INVENTORY
    terminal_states: [DEMOLISHED]
    transitions:
      - from: INVENTORY
        to: DEMOLITION_PENDING
        trigger: "system (on approval of a DEMOLITION application for this property)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DEMOLITION_PENDING
        to: DEMOLISHED
        trigger: "system (on POST /preservation/certificates/{certificateId}/complete for the demolition certificate)"
        actor: system
        preconditions: []
        side_effects:
          - "HistoricDistrict census fields recomputed (see Certificate COMPLETED transition)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: reclassify-stale-property
    parent_entity: Property
    write_endpoint: "POST /preservation/properties/{propertyId}/reclassify"
    occ_field: "expected_property_version"
    description: |
      Reclassifying a Property whose version has advanced since the client last
      observed it is rejected. This protects the district contributing census:
      a reclassification legitimately mutates Property.version and the district
      counters, so a writer carrying a stale property version would otherwise
      apply a duplicate census delta.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: application_fee
    trigger: "application submission/resubmission (provisional variant) and completeness acceptance (final variant)"
    algorithm: tiered_pricing
    formula: |
      Per-work-item fee, ROUNDED PER ITEM FIRST, then summed (pinned order):
        item_fee(i) = BASE_FEE_CENTS[category(i)]
                      + round_half_up(RATE[category(i)] * item_cost_cents(i))
      fee = sum over items of item_fee(i)
      Final variant adds the hearing surcharge AFTER the per-item sum:
        assessed = sum(item_fee over verified items) + (HEARING_SURCHARGE_CENTS if review_track == COMMISSION else 0)
      Rounding-order note (normative): rounding each item to integer cents
      before summing gives a different result than summing raw products and
      rounding once; the per-item-then-sum order above is the pinned one.
    input_set: "provisional: application.work_items (declared); final: application.verified_work_items recorded at acceptance"
    constants:
      BASE_FEE_CENTS_EXTERIOR_ALTERATION: 15000
      BASE_FEE_CENTS_ADDITION: 30000
      BASE_FEE_CENTS_NEW_CONSTRUCTION: 50000
      BASE_FEE_CENTS_DEMOLITION: 25000
      BASE_FEE_CENTS_RELOCATION: 40000
      BASE_FEE_CENTS_SITE_WORK: 10000
      RATE_EXTERIOR_ALTERATION: 0.004
      RATE_ADDITION: 0.005
      RATE_NEW_CONSTRUCTION: 0.006
      RATE_DEMOLITION: 0.003
      RATE_RELOCATION: 0.005
      RATE_SITE_WORK: 0.002
      HEARING_SURCHARGE_CENTS: 20000
    precision: "integer cents, round_half_up applied per work item before summation"
    variants:
      - name: provisional
        when: "submission and resubmission; stored on provisional_fee_cents"
        difference: "uses applicant-declared estimated_cost_cents; never includes the hearing surcharge"
      - name: final
        when: "completeness acceptance; stored on assessed_fee_cents"
        difference: "uses staff-verified verified_cost_cents and adds HEARING_SURCHARGE_CENTS when review_track == COMMISSION"

  - name: review_track_determination
    trigger: "completeness acceptance (POST /preservation/applications/{id}/accept-completeness)"
    algorithm: threshold
    formula: |
      if application_type in {DEMOLITION, NEW_CONSTRUCTION, RELOCATION}:
        track = COMMISSION
      elif verified_cost_cents >= COMMISSION_REVIEW_THRESHOLD_CENTS:
        track = COMMISSION
      elif property.contributing_status == CONTRIBUTING
           AND application.is_visible_from_public_way == true
           AND district.significance_tier in {LANDMARK, ICONIC}:
        track = COMMISSION
      else:
        track = STAFF
      (Property without district_id: the third branch is false.)
    input_set: "the application being accepted, its property, and that property's district"
    constants:
      COMMISSION_REVIEW_THRESHOLD_CENTS: 1000000
    precision: "exact integer comparison; boundary is >= (verified_cost_cents == 1000000 selects COMMISSION)"

  - name: civil_penalty
    trigger: "issue-notice (demand variant); verify-compliance / after-the-fact approval / close-after-referral (final variant)"
    algorithm: chronological
    formula: |
      Accrual window: [notice_issued_at, stop_date), whole days elapsed:
        elapsed_days = floor((stop_date - notice_issued_at) / 86400)
      Marginal daily tiers (like tax brackets):
        first 30 days:      10000 cents/day
        days 31..60:        20000 cents/day
        days 61 and beyond: 50000 cents/day
      raw = 10000 * min(elapsed_days, 30)
            + 20000 * min(max(elapsed_days - 30, 0), 30)
            + 50000 * max(elapsed_days - 60, 0)
      cap = round_half_up(0.10 * property.assessed_value_cents)
      penalty = min(raw, cap); penalty_capped = (raw > cap)
    input_set: "the violation, its property (assessed_value_cents), and the applicable stop_date"
    constants:
      TIER1_DAILY_CENTS: 10000
      TIER2_DAILY_CENTS: 20000
      TIER3_DAILY_CENTS: 50000
      TIER1_DAYS: 30
      TIER2_DAYS: 30
      CAP_PCT_OF_ASSESSED_VALUE: 0.10
      CURE_WINDOW_DAYS: 30
    precision: "integer cents; elapsed_days is a whole-day floor; cap rounded round_half_up to integer cents"
    variants:
      - name: demand
        when: "issue-notice; stored on demand_letter_amount_cents"
        difference: "stop_date := notice_issued_at + 30 days (projects cure within the cure window)"
      - name: final
        when: "verify-compliance, after-the-fact approval, or close after court referral; stored on final_penalty_cents"
        difference: "stop_date := compliance_verified_at (or referred_at when closed from COURT_REFERRAL)"

  - name: demolition_delay_schedule
    trigger: "approval of a DEMOLITION application; postpone; hardship decide"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (the filing window depends on the provisional
      end, and the final end depends on a filing made inside that window):
      (1) provisional_delay_end = delay_start_at
            + BASE_DELAY_DAYS[district.significance_tier] days
            + postponement_count * POSTPONEMENT_EXTENSION_DAYS days
      (2) hardship filing window = (delay_start_at, provisional_delay_end
            - HARDSHIP_FILING_CUTOFF_DAYS days]  (filed_at must be strictly
            after the decision and no later than the cutoff instant)
      (3) if hardship GRANTED: final_delay_end = hardship.decided_at
            + HARDSHIP_LIFT_DAYS days, REPLACING the provisional end
      (4) effective end = final_delay_end if set else provisional_delay_end;
          the delay lazily expires when logical clock >= effective end
    input_set: "the DemolitionDelay, its application's decided_at, the district tier, postponements, and any hardship decision"
    constants:
      BASE_DELAY_DAYS_LOCAL: 90
      BASE_DELAY_DAYS_LANDMARK: 180
      BASE_DELAY_DAYS_ICONIC: 365
      POSTPONEMENT_EXTENSION_DAYS: 30
      MAX_POSTPONEMENTS: 2
      HARDSHIP_FILING_CUTOFF_DAYS: 30
      HARDSHIP_LIFT_DAYS: 10
    precision: "day-granularity datetimes; comparisons on full ISO8601 instants"

  - name: fee_refund_schedule
    trigger: "application withdrawal"
    algorithm: threshold
    formula: |
      refund_pct(application.status at withdrawal):
        SUBMITTED | UNDER_STAFF_REVIEW | INCOMPLETE      -> 1.00
        ACCEPTED | HEARING_SCHEDULED | HEARING_DEFERRED -> 0.50
        HEARING_OPEN                                    -> 0.00
      refunded_fee_cents = round_half_up(paid_fee_cents * refund_pct)
      After refund: fee_balance_cents := 0 (any unpaid assessed balance is forgiven).
      Invariant: paid_fee_cents - refunded_fee_cents == retained revenue;
      the pair (payment, withdrawal-refund) conserves
      paid - refunded + 0 == paid_fee_cents - round_half_up(paid * pct).
    input_set: "the withdrawing application"
    constants:
      REFUND_PCT_EARLY: 1.00
      REFUND_PCT_POST_ACCEPTANCE: 0.50
      REFUND_PCT_POST_OPEN: 0.00
    precision: "integer cents, round_half_up"

  - name: contributing_census
    trigger: "property creation, reclassification, demolition completion"
    algorithm: aggregation
    formula: |
      For district D:
        total_inventory_count(D) = count of Property p with p.district_id == D.id
                                   and p.listing_status != DEMOLISHED
        contributing_count(D)    = count of such p with p.contributing_status == CONTRIBUTING
        preservation_posture(D)  = AT_RISK if total_inventory_count > 0
                                   and contributing_count * 2 < total_inventory_count
                                   else STABLE
      Maintained incrementally on each triggering mutation (and always equal
      to the full recount); updated_at/version of the district bump on change.
    input_set: "all Properties of the district (status filter: listing_status != DEMOLISHED)"
    precision: "integer counts; strict < comparison for the 50% posture threshold"

  - name: notice_window_check
    trigger: "hearing creation and hearing reschedule"
    algorithm: threshold
    formula: |
      require notice_posted_at <= meeting.meeting_date - NOTICE_PERIOD_DAYS days
      Boundary is INCLUSIVE: notice_posted_at exactly 15 days before the
      meeting instant passes; one second later fails.
    input_set: "the hearing payload and the target CommissionMeeting"
    constants:
      NOTICE_PERIOD_DAYS: 15
    precision: "full ISO8601 instant comparison, <="

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role must be one of the declared roles. Malformed bodies, missing required fields, wrong types, and out-of-set enum values are rejected at the same outermost layer (request-shape gate)."
    error_id: "ERR_UNAUTHENTICATED | ERR_VALIDATION"
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's allowed role list; for Applicant actions on an existing application/appeal, X-User-ID == application.owner_id"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body-supplied references (property_id, owner_id, meeting_id, application_id, violation_id, district_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: state
    check: "Optimistic concurrency on reclassify: expected_property_version must equal Property.version (checked before any state/business evaluation of the write)"
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
    applies_to: "POST /preservation/properties/{id}/reclassify"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "DEMOLITION applications are prohibited for CONTRIBUTING properties in ICONIC-tier districts"
    error_id: ERR_DEMOLITION_PROHIBITED
    http_status: 422
    applies_to: "POST /preservation/applications"

  - priority: 7
    category: business_referential
    check: "Cross-entity referential gates: (a) certificate issuance requires property.open_violation_count == 0; (b) officer verify-compliance on an AFTER_THE_FACT_PENDING violation requires the linked application approved; (c) after_the_fact submission requires violation.status == NOTICE_ISSUED and violation.property_id == application.property_id; (d) application submission with a district requires district.status == ACTIVE"
    error_id: "ERR_UNRESOLVED_VIOLATION_EXISTS | ERR_LINKED_APPLICATION_NOT_APPROVED | ERR_VIOLATION_NOT_UNDER_NOTICE | ERR_VIOLATION_PROPERTY_MISMATCH | ERR_DISTRICT_UNDER_REVIEW"
    http_status: 409
    applies_to: "POST /preservation/certificates; POST /preservation/violations/{id}/verify-compliance; POST /preservation/applications"

  - priority: 8
    category: business_temporal
    check: "Window/deadline gates: hearing notice window; appeal filing window; resubmission window; hardship filing window; comment period open; certificate commence deadline; escalation threshold"
    error_id: "ERR_NOTICE_WINDOW_TOO_SHORT | ERR_APPEAL_WINDOW_LAPSED | ERR_RESUBMISSION_WINDOW_LAPSED | ERR_HARDSHIP_WINDOW_LAPSED | ERR_COMMENT_PERIOD_CLOSED | ERR_CERTIFICATE_EXPIRED | ERR_CERTIFICATE_NOT_YET_EXPIRED | ERR_ESCALATION_THRESHOLD_NOT_MET"
    http_status: 422
    applies_to: "hearing create/reschedule; appeal create; resubmit; hardship create; comment create; certificate complete/expire; violation refer-court"

  - priority: 9
    category: business_constraint
    check: "Structural gates: review-track decision authority; segregation of duties; agenda capacity; demolition-delay overlap; guideline supersede acknowledgement; required arrays non-empty; postponement limit; one pending appeal per application; one certificate per application"
    error_id: "ERR_COMMISSION_HEARING_REQUIRED | ERR_STAFF_DECISION_NOT_PERMITTED | ERR_SEGREGATION_OF_DUTIES | ERR_MEETING_AGENDA_FULL | ERR_DEMOLITION_DELAY_OVERLAP | ERR_GUIDELINE_SET_SUPERSEDED | ERR_EMPTY_WORK_ITEMS | ERR_DENIAL_RATIONALE_REQUIRED | ERR_CONDITIONS_REQUIRED | ERR_CONDITIONS_UNMET | ERR_POSTPONEMENT_LIMIT_REACHED | ERR_APPEAL_ALREADY_PENDING | ERR_CERTIFICATE_EXISTS"
    http_status: 409
    applies_to: "decide; hearings create/reschedule; certificate create/verify-conditions; application create; delay postpone; appeal create"

  - priority: 10
    category: business_fiscal
    check: "Fiscal gates: certificate issuance requires fee_balance_cents == 0; a fee payment must not exceed the outstanding balance"
    error_id: "ERR_FEE_BALANCE_OUTSTANDING | ERR_OVERPAYMENT"
    http_status: 402
    applies_to: "POST /preservation/certificates; POST /preservation/applications/{id}/fee-payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Districts & guideline sets ---
  - method: POST
    path: "/preservation/districts"
    description: "Create a historic district (status ACTIVE, census counters 0, posture STABLE)"
    roles: [PreservationStaff]
    code: 201
    input: [name, boundary_description, significance_tier]
    output: HistoricDistrict
    side_effects: []

  - method: GET
    path: "/preservation/districts"
    description: "List districts"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "HistoricDistrict[]"
    side_effects: []

  - method: GET
    path: "/preservation/districts/{districtId}"
    description: "Get one district (recomputed census counters and posture)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: []
    output: HistoricDistrict
    side_effects: []

  - method: PATCH
    path: "/preservation/districts/{districtId}"
    description: "Update district boundary/tier or move status ACTIVE <-> BOUNDARY_REVIEW"
    roles: [PreservationStaff]
    code: 200
    input: ["status?", "boundary_description?", "significance_tier?"]
    output: HistoricDistrict
    side_effects: ["increments HistoricDistrict.version by 1"]

  - method: GET
    path: "/preservation/districts/{id}/properties"
    description: "List properties in a district (reverse reachability for Property.district_id)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Property[]"
    side_effects: []

  - method: POST
    path: "/preservation/districts/{id}/guideline-sets"
    description: "Create a DRAFT guideline set for the district (version_no assigned per district)"
    roles: [PreservationStaff]
    code: 201
    input: [title, sections]
    output: DesignGuidelineSet
    side_effects: []

  - method: GET
    path: "/preservation/districts/{id}/guideline-sets"
    description: "List guideline sets of a district (reverse reachability for DesignGuidelineSet.district_id)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DesignGuidelineSet[]"
    side_effects: []

  - method: POST
    path: "/preservation/guideline-sets/{guidelineSetId}/adopt"
    description: "Adopt a DRAFT guideline set; the district's prior ADOPTED set becomes SUPERSEDED"
    roles: [PreservationStaff]
    code: 200
    input: []
    output: DesignGuidelineSet
    side_effects: ["prior ADOPTED set -> SUPERSEDED", "adopted_at := logical clock"]

  # --- Owners & properties ---
  - method: POST
    path: "/preservation/owners"
    description: "Register a property owner/agent"
    roles: [PreservationStaff]
    code: 201
    input: [full_name, email, mailing_address]
    output: PropertyOwner
    side_effects: []

  - method: POST
    path: "/preservation/properties"
    description: "Add a property to the inventory (district census counters update if district_id given)"
    roles: [PreservationStaff]
    code: 201
    input: [address, parcel_number, "district_id?", owner_id, contributing_status, construction_year, assessed_value_cents]
    output: Property
    side_effects: ["district total_inventory_count/contributing_count recomputed; preservation_posture recomputed"]

  - method: GET
    path: "/preservation/properties"
    description: "List properties; filterable (reverse reachability for Property.district_id and Property.owner_id)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["district_id?", "owner_id?", "contributing_status?", "listing_status?", "limit?", "offset?"]
    output: "Property[]"
    side_effects: []

  - method: GET
    path: "/preservation/properties/{propertyId}"
    description: "Get one property"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: POST
    path: "/preservation/properties/{propertyId}/reclassify"
    description: "Change contributing_status; district census counters adjust; OCC-guarded"
    roles: [PreservationStaff]
    code: 200
    input: [contributing_status, expected_property_version]
    output: Property
    side_effects:
      - "district contributing_count +=/-= 1 per delta (both old and new district counters stay consistent)"
      - "preservation_posture recomputed"
      - "increments Property.version by 1"

  # --- Meetings ---
  - method: POST
    path: "/preservation/meetings"
    description: "Schedule a commission meeting with agenda capacity"
    roles: [PreservationStaff]
    code: 201
    input: [meeting_date, location, agenda_capacity]
    output: CommissionMeeting
    side_effects: []

  - method: GET
    path: "/preservation/meetings"
    description: "List meetings"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CommissionMeeting[]"
    side_effects: []

  - method: GET
    path: "/preservation/meetings/{meetingId}"
    description: "Get one meeting (live scheduled_hearing_count)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: []
    output: CommissionMeeting
    side_effects: []

  # --- Applications (COA) ---
  - method: POST
    path: "/preservation/applications"
    description: "Submit a Certificate of Appropriateness application (with drawings/material work items)"
    roles: [Applicant]
    code: 201
    input: [property_id, owner_id, application_type, is_visible_from_public_way, after_the_fact, "violation_id?", work_items]
    output: Application
    side_effects:
      - "declared_cost_cents and provisional_fee_cents computed"
      - "if after_the_fact: linked Violation NOTICE_ISSUED -> AFTER_THE_FACT_PENDING"

  - method: GET
    path: "/preservation/applications"
    description: "List applications; filterable (precedent lookup by district/status/work category)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["property_id?", "owner_id?", "district_id?", "violation_id?", "guideline_set_id?", "status?", "work_category?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []

  - method: GET
    path: "/preservation/applications/{applicationId}"
    description: "Get one application"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/preservation/applications/{applicationId}/begin-review"
    description: "Staff begins completeness review (SUBMITTED -> UNDER_STAFF_REVIEW)"
    roles: [PreservationStaff]
    code: 200
    input: []
    output: Application
    side_effects: ["increments Application.version by 1"]

  - method: POST
    path: "/preservation/applications/{applicationId}/return-incomplete"
    description: "Staff returns the application for deficiency (UNDER_STAFF_REVIEW -> INCOMPLETE)"
    roles: [PreservationStaff]
    code: 200
    input: [deficiency_notes]
    output: Application
    side_effects: ["returned_at := logical clock", "increments Application.version by 1"]

  - method: POST
    path: "/preservation/applications/{applicationId}/resubmit"
    description: "Applicant resubmits with revised work items within 90 days (INCOMPLETE -> UNDER_STAFF_REVIEW)"
    roles: [Applicant]
    code: 200
    input: [work_items, "is_visible_from_public_way?"]
    output: Application
    side_effects:
      - "work_items replaced; declared_cost_cents and provisional_fee_cents recomputed"
      - "resubmission_count += 1"
      - "increments Application.version by 1"

  - method: POST
    path: "/preservation/applications/{applicationId}/accept-completeness"
    description: "Staff accepts completeness: verifies costs, computes review track, assesses final fee, pins guideline set"
    roles: [PreservationStaff]
    code: 200
    input: [verified_work_items]
    output: Application
    side_effects:
      - "verified_cost_cents, review_track, assessed_fee_cents computed; fee_balance_cents := assessed_fee_cents"
      - "guideline_set_id pinned to district's ADOPTED set (null if none)"
      - "completeness_accepted_by := X-User-ID"
      - "increments Application.version by 1"

  - method: POST
    path: "/preservation/applications/{applicationId}/decide"
    description: "Record decision: staff for STAFF-track ACCEPTED applications; commission for COMMISSION-track HEARING_OPEN applications"
    roles: [PreservationStaff, Commissioner]
    code: 200
    input: [outcome, "conditions?", "denial_rationale_sections?", "guideline_override_ack?"]
    output: Application
    side_effects:
      - "decided_at := logical clock"
      - "COMMISSION track: the OPENED Hearing -> DECIDED"
      - "approval of DEMOLITION: property -> DEMOLITION_PENDING; DemolitionDelay created ACTIVE (overlap check first)"
      - "approval of after_the_fact application: linked violation resolution cascade"
      - "increments Application.version by 1"

  - method: POST
    path: "/preservation/applications/{applicationId}/withdraw"
    description: "Applicant withdraws the application; fee refund per stage schedule; hearing cascade"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "refunded_fee_cents := round_half_up(paid_fee_cents * refund_pct[status]); fee_balance_cents := 0"
      - "non-terminal Hearing -> WITHDRAWN (frees meeting occupancy when SCHEDULED/OPENED)"
      - "increments Application.version by 1"

  - method: POST
    path: "/preservation/applications/{applicationId}/finalize-denial"
    description: "Staff finalizes a denial after the appeal window lapses (DENIED -> DENIED_FINAL)"
    roles: [PreservationStaff]
    code: 200
    input: []
    output: Application
    side_effects: ["increments Application.version by 1"]

  - method: POST
    path: "/preservation/applications/{applicationId}/fee-payments"
    description: "Record a fee payment against the assessed balance"
    roles: [Applicant]
    code: 201
    input: [amount_cents]
    output: Application
    side_effects:
      - "paid_fee_cents += amount_cents; fee_balance_cents -= amount_cents"
      - "rejects amount_cents > fee_balance_cents (ERR_OVERPAYMENT)"

  # --- Hearings & public comment ---
  - method: POST
    path: "/preservation/hearings"
    description: "Schedule a hearing for a COMMISSION-track ACCEPTED application into a meeting"
    roles: [PreservationStaff]
    code: 201
    input: [application_id, meeting_id, notice_posted_at]
    output: Hearing
    side_effects:
      - "Application ACCEPTED -> HEARING_SCHEDULED; increments Application.version by 1"
      - "meeting.scheduled_hearing_count += 1"

  - method: GET
    path: "/preservation/hearings"
    description: "List hearings; filterable (reverse reachability for Hearing.application_id and Hearing.meeting_id)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["application_id?", "meeting_id?", "status?", "limit?", "offset?"]
    output: "Hearing[]"
    side_effects: []

  - method: GET
    path: "/preservation/hearings/{hearingId}"
    description: "Get one hearing"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: []
    output: Hearing
    side_effects: []

  - method: POST
    path: "/preservation/hearings/{hearingId}/open"
    description: "Open the hearing at the meeting (SCHEDULED -> OPENED); closes the comment period"
    roles: [Commissioner]
    code: 200
    input: []
    output: Hearing
    side_effects: ["Application HEARING_SCHEDULED -> HEARING_OPEN"]

  - method: POST
    path: "/preservation/hearings/{hearingId}/continue"
    description: "Continue (defer) the hearing (SCHEDULED|OPENED -> CONTINUED); frees the agenda slot"
    roles: [Commissioner]
    code: 200
    input: []
    output: Hearing
    side_effects: ["Application -> HEARING_DEFERRED", "meeting.scheduled_hearing_count -= 1"]

  - method: POST
    path: "/preservation/hearings/{hearingId}/reschedule"
    description: "Reschedule a CONTINUED hearing into a (possibly different) meeting with a fresh notice window check"
    roles: [PreservationStaff]
    code: 200
    input: [meeting_id, notice_posted_at]
    output: Hearing
    side_effects:
      - "Hearing CONTINUED -> SCHEDULED; meeting_id/notice_posted_at replaced"
      - "new meeting.scheduled_hearing_count += 1"
      - "Application HEARING_DEFERRED -> HEARING_SCHEDULED"

  - method: POST
    path: "/preservation/hearings/{id}/comments"
    description: "Submit a public comment while the hearing is SCHEDULED or CONTINUED (comment period closes at open)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 201
    input: [commenter_name, stance, comment_text]
    output: PublicComment
    side_effects: ["submitted_at := logical clock"]

  - method: GET
    path: "/preservation/hearings/{id}/comments"
    description: "List comments on a hearing (reverse reachability for PublicComment.hearing_id)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PublicComment[]"
    side_effects: []

  # --- Appeals ---
  - method: POST
    path: "/preservation/appeals"
    description: "Applicant appeals a DENIED application to the council within 30 days of decided_at"
    roles: [Applicant]
    code: 201
    input: [application_id, grounds]
    output: Appeal
    side_effects: ["filed_at := logical clock"]

  - method: GET
    path: "/preservation/appeals"
    description: "List appeals; filterable (reverse reachability for Appeal.application_id)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/preservation/appeals/{appealId}"
    description: "Get one appeal"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/preservation/appeals/{appealId}/decide"
    description: "Council decides the appeal: SUSTAIN overturns the denial (cascade); UPHOLD finalizes it"
    roles: [CouncilMember]
    code: 200
    input: [outcome, council_findings]
    output: Appeal
    side_effects:
      - "SUSTAIN: Application DENIED -> APPROVED_ON_APPEAL; after-the-fact violation resolution cascade (violation -> COMPLIANCE_VERIFIED, property enforcement counters)"
      - "UPHOLD: Application DENIED -> DENIED_FINAL"
      - "decided_at := logical clock"

  - method: POST
    path: "/preservation/appeals/{appealId}/withdraw"
    description: "Appellant withdraws a pending appeal"
    roles: [Applicant]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  # --- Violations ---
  - method: POST
    path: "/preservation/violations"
    description: "Open a violation case for unpermitted work"
    roles: [EnforcementOfficer]
    code: 201
    input: [property_id, observed_violation_date, work_description]
    output: Violation
    side_effects: ["Property.open_violation_count += 1; compliance_posture recomputed"]

  - method: GET
    path: "/preservation/violations"
    description: "List violations; filterable (reverse reachability for Violation.property_id)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: "Violation[]"
    side_effects: []

  - method: GET
    path: "/preservation/violations/{violationId}"
    description: "Get one violation"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: POST
    path: "/preservation/violations/{violationId}/issue-notice"
    description: "Issue the violation notice; starts penalty accrual and computes the demand-letter amount"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["notice_issued_at := logical clock", "demand_letter_amount_cents computed (demand variant)"]

  - method: POST
    path: "/preservation/violations/{violationId}/verify-compliance"
    description: "Officer verifies correction (only when no linked after-the-fact application is pending)"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: Violation
    side_effects:
      - "compliance_verified_at := logical clock; final_penalty_cents computed (final variant)"
      - "Property.open_violation_count -= 1; compliance_posture recomputed"

  - method: POST
    path: "/preservation/violations/{violationId}/refer-court"
    description: "Refer to court once more than 60 days have elapsed since notice issuance"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["referred_at := logical clock"]

  - method: POST
    path: "/preservation/violations/{violationId}/close"
    description: "Close a COMPLIANCE_VERIFIED or COURT_REFERRAL violation"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["from COURT_REFERRAL: final_penalty_cents computed (stop = referred_at)"]

  # --- Demolition delays & hardship ---
  - method: GET
    path: "/preservation/demolition-delays"
    description: "List demolition delays; filterable (reverse reachability for DemolitionDelay.application_id / .property_id)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["property_id?", "application_id?", "status?", "limit?", "offset?"]
    output: "DemolitionDelay[]"
    side_effects: ["lazy EXPIRED evaluation against the logical clock"]

  - method: GET
    path: "/preservation/demolition-delays/{delayId}"
    description: "Get one demolition delay (lazy EXPIRED evaluation)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: []
    output: DemolitionDelay
    side_effects: ["lazy EXPIRED evaluation against the logical clock"]

  - method: POST
    path: "/preservation/demolition-delays/{delayId}/postpone"
    description: "Postpone an ACTIVE delay (+30 days each, max 2)"
    roles: [PreservationStaff]
    code: 200
    input: []
    output: DemolitionDelay
    side_effects: ["postponement_count += 1; provisional_delay_end recomputed"]

  - method: POST
    path: "/preservation/hardship-reviews"
    description: "Applicant files an economic-hardship review for an approved DEMOLITION application within the filing window"
    roles: [Applicant]
    code: 201
    input: [application_id, claimed_rate_of_return_pct, appraisal_basis_cents]
    output: HardshipReview
    side_effects: ["filed_at := logical clock"]

  - method: GET
    path: "/preservation/hardship-reviews"
    description: "List hardship reviews; filterable (reverse reachability for HardshipReview.application_id)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: "HardshipReview[]"
    side_effects: []

  - method: GET
    path: "/preservation/hardship-reviews/{hardshipReviewId}"
    description: "Get one hardship review"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: []
    output: HardshipReview
    side_effects: []

  - method: POST
    path: "/preservation/hardship-reviews/{hardshipReviewId}/hear"
    description: "Commission hears the hardship review (FILED -> HEARD)"
    roles: [Commissioner]
    code: 200
    input: []
    output: HardshipReview
    side_effects: []

  - method: POST
    path: "/preservation/hardship-reviews/{hardshipReviewId}/decide"
    description: "Commission decides hardship: GRANT lifts the delay (final end = decided_at + 10 days); DENY keeps it"
    roles: [Commissioner]
    code: 200
    input: [outcome, findings]
    output: HardshipReview
    side_effects:
      - "GRANT: linked DemolitionDelay ACTIVE -> LIFTED_BY_HARDSHIP; final_delay_end := decided_at + 10 days"
      - "decided_at := logical clock"

  # --- Certificates ---
  - method: POST
    path: "/preservation/certificates"
    description: "Issue the Certificate of Appropriateness for an approved application"
    roles: [PreservationStaff]
    code: 201
    input: [application_id]
    output: Certificate
    side_effects:
      - "issued_at := logical clock; work_commence_deadline := issued_at + 365 days"
      - "conditions copied from application.decision_conditions"

  - method: GET
    path: "/preservation/certificates"
    description: "List certificates; filterable (reverse reachability for Certificate.application_id)"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: "Certificate[]"
    side_effects: []

  - method: GET
    path: "/preservation/certificates/{certificateId}"
    description: "Get one certificate"
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: POST
    path: "/preservation/certificates/{certificateId}/verify-conditions"
    description: "Staff verifies all approval conditions are met (ISSUED -> CONDITIONS_VERIFIED)"
    roles: [PreservationStaff]
    code: 200
    input: [conditions_met_count]
    output: Certificate
    side_effects: []

  - method: POST
    path: "/preservation/certificates/{certificateId}/complete"
    description: "Complete the certificate; for DEMOLITION this demolishes the property and updates the district census"
    roles: [PreservationStaff]
    code: 200
    input: [commenced_at]
    output: Certificate
    side_effects:
      - "completed_at := logical clock"
      - "DEMOLITION: Property DEMOLITION_PENDING -> DEMOLISHED; district census and posture recomputed"

  - method: POST
    path: "/preservation/certificates/{certificateId}/expire"
    description: "Expire a certificate whose commence deadline has passed"
    roles: [PreservationStaff]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/preservation/_clock/set_current_utc"
    description: "Set the server logical clock (ISO8601 UTC). Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock MUST NOT fall back to wall-clock time."
    roles: [Applicant, PreservationStaff, Commissioner, CouncilMember, EnforcementOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequently evaluated deadlines/windows use the new logical time"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth / existence / state
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header, or undeclared role value" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's allowed list, or Applicant X-User-ID does not own the target application/appeal" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path id or body-supplied reference does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which §1.2 declares the requested transition" }
  # business_safety
  - { id: ERR_DEMOLITION_PROHIBITED, http: 422, condition: "DEMOLITION application for a CONTRIBUTING property in an ICONIC-tier district" }
  # business_referential
  - { id: ERR_DISTRICT_UNDER_REVIEW, http: 409, condition: "Application submission for a property whose district is in BOUNDARY_REVIEW status" }
  - { id: ERR_UNRESOLVED_VIOLATION_EXISTS, http: 409, condition: "Certificate issuance while property.open_violation_count > 0" }
  - { id: ERR_LINKED_APPLICATION_NOT_APPROVED, http: 409, condition: "Officer verify-compliance while a linked after-the-fact application exists and is not in an approval terminal state" }
  - { id: ERR_VIOLATION_NOT_UNDER_NOTICE, http: 409, condition: "after_the_fact application references a violation not in NOTICE_ISSUED status" }
  - { id: ERR_VIOLATION_PROPERTY_MISMATCH, http: 422, condition: "after_the_fact application's property_id differs from the violation's property_id" }
  # business_temporal
  - { id: ERR_NOTICE_WINDOW_TOO_SHORT, http: 422, condition: "notice_posted_at is later than meeting_date - 15 days" }
  - { id: ERR_APPEAL_WINDOW_LAPSED, http: 422, condition: "Appeal filed_at would be later than application.decided_at + 30 days" }
  - { id: ERR_RESUBMISSION_WINDOW_LAPSED, http: 422, condition: "Resubmit attempted later than returned_at + 90 days" }
  - { id: ERR_HARDSHIP_WINDOW_LAPSED, http: 422, condition: "Hardship filing after provisional_delay_end - 30 days (or before/at the approval instant)" }
  - { id: ERR_COMMENT_PERIOD_CLOSED, http: 409, condition: "Comment submitted to a hearing not in SCHEDULED or CONTINUED status" }
  - { id: ERR_CERTIFICATE_EXPIRED, http: 409, condition: "Certificate completion when logical clock or commenced_at is after work_commence_deadline" }
  - { id: ERR_CERTIFICATE_NOT_YET_EXPIRED, http: 409, condition: "Expire requested while logical clock <= work_commence_deadline" }
  - { id: ERR_ESCALATION_THRESHOLD_NOT_MET, http: 409, condition: "Court referral when whole days since notice_issued_at <= 60" }
  # business_constraint
  - { id: ERR_COMMISSION_HEARING_REQUIRED, http: 409, condition: "Staff decision attempted on a COMMISSION-track application (or decide from ACCEPTED when track is COMMISSION)" }
  - { id: ERR_STAFF_DECISION_NOT_PERMITTED, http: 409, condition: "PreservationStaff decide attempted on a COMMISSION-track application in HEARING_OPEN (commission-only) — Commissioner required" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "STAFF-track decide attempted by the same staff X-User-ID recorded as completeness_accepted_by" }
  - { id: ERR_MEETING_AGENDA_FULL, http: 409, condition: "Hearing create/reschedule when meeting.scheduled_hearing_count == agenda_capacity" }
  - { id: ERR_DEMOLITION_DELAY_OVERLAP, http: 409, condition: "Approving a DEMOLITION application whose new delay window [decided_at, provisional end) overlaps another ACTIVE delay on the same property (half-open: adjacency permitted)" }
  - { id: ERR_GUIDELINE_SET_SUPERSEDED, http: 409, condition: "Decide attempted when the pinned guideline set is no longer the district's ADOPTED set and guideline_override_ack is not true" }
  - { id: ERR_EMPTY_WORK_ITEMS, http: 422, condition: "Application submission or resubmission with an empty work_items array" }
  - { id: ERR_DENIAL_RATIONALE_REQUIRED, http: 422, condition: "decide outcome=DENY with an empty/missing denial_rationale_sections array" }
  - { id: ERR_CONDITIONS_REQUIRED, http: 422, condition: "decide outcome=APPROVE_WITH_CONDITIONS with an empty/missing conditions array" }
  - { id: ERR_CONDITIONS_UNMET, http: 422, condition: "verify-conditions with conditions_met_count != len(certificate.conditions)" }
  - { id: ERR_POSTPONEMENT_LIMIT_REACHED, http: 422, condition: "postpone when postponement_count == 2" }
  - { id: ERR_APPEAL_ALREADY_PENDING, http: 409, condition: "Second appeal filed while an appeal for the same application is FILED" }
  - { id: ERR_CERTIFICATE_EXISTS, http: 409, condition: "Second certificate for the same application" }
  # business_fiscal
  - { id: ERR_FEE_BALANCE_OUTSTANDING, http: 402, condition: "Certificate issuance while application.fee_balance_cents > 0" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Fee payment amount_cents exceeds fee_balance_cents" }
  # concurrency (OCC)
  - { id: ERR_STALE_PROPERTY_VERSION, http: 412, condition: "expected_property_version != Property.version on reclassify" }
  # request shape
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, or enum value outside the declared set" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Property owner or authorized agent filing and managing their own applications, appeals, fee payments, and hardship reviews; may comment at hearings"
    identity: "entity_backed:PropertyOwner"
    exclusive_operations:
      - "POST /preservation/applications (owner_id must equal X-User-ID)"
      - "POST /preservation/applications/{id}/resubmit, /withdraw, /fee-payments (own applications only)"
      - "POST /preservation/appeals, /appeals/{id}/withdraw (own applications only)"
      - "POST /preservation/hardship-reviews (own applications only)"
    shared_operations:
      - "GET reads across all resources"
      - "POST /preservation/hearings/{id}/comments"
      - "POST /preservation/_clock/set_current_utc"

  - name: PreservationStaff
    description: "Commission staff: inventory, districts, guideline sets, meetings, completeness review, STAFF-track decisions, hearing logistics, certificates, delay postponements"
    identity: "opaque"
    exclusive_operations:
      - "POST /preservation/districts, /owners, /properties, /meetings; PATCH /preservation/districts/{id}"
      - "POST /preservation/properties/{id}/reclassify"
      - "guideline-set create/adopt"
      - "begin-review, return-incomplete, accept-completeness, finalize-denial"
      - "decide on STAFF-track applications (excluding the staff user who accepted completeness)"
      - "hearing create/reschedule"
      - "certificate issue/verify-conditions/complete/expire"
      - "demolition-delays postpone"
    shared_operations:
      - "GET reads across all resources"
      - "POST /preservation/hearings/{id}/comments"
      - "POST /preservation/_clock/set_current_utc"

  - name: Commissioner
    description: "Preservation commission member: opens/continues hearings, decides COMMISSION-track applications, hears and decides hardship reviews"
    identity: "opaque"
    exclusive_operations:
      - "POST /preservation/hearings/{id}/open, /continue"
      - "decide on COMMISSION-track applications in HEARING_OPEN"
      - "hardship-reviews hear/decide"
    shared_operations:
      - "GET reads across all resources"
      - "POST /preservation/hearings/{id}/comments"
      - "POST /preservation/_clock/set_current_utc"

  - name: CouncilMember
    description: "City council member deciding appeals of commission denials"
    identity: "opaque"
    exclusive_operations:
      - "POST /preservation/appeals/{id}/decide"
    shared_operations:
      - "GET reads across all resources"
      - "POST /preservation/hearings/{id}/comments"
      - "POST /preservation/_clock/set_current_utc"

  - name: EnforcementOfficer
    description: "Code enforcement officer: violation cases from intake through notice, compliance verification, court referral, and closure"
    identity: "opaque"
    exclusive_operations:
      - "POST /preservation/violations and all /violations/{id}/* actions"
    shared_operations:
      - "GET reads across all resources"
      - "POST /preservation/hearings/{id}/comments"
      - "POST /preservation/_clock/set_current_utc"

