            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Suite St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
