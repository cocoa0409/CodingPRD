            - call: "POST /lab-results"
              payload: { patient_id: "${pt1}", collected_at: "2026-08-10T06:00:00Z", anc_value: 2.0, platelet_value: 150 }
              as: InfusionNurse
              as_user_id: "${nr1}"
              captures: { lr1: $.data.id, lr1_status: $.data.status }
            - call: "POST /appointments/${ap1}/start-infusion"
              payload: {}
              as: InfusionNurse
              as_user_id: "${nr1}"
              captures: { e_no_prep: $.data.error_id }
            - call: "POST /drug-preparations/${dp1}/prepare"
              payload: {}
              as: Pharmacist
              captures: { dp1_prepared: $.data.status, dp1_usable: $.data.usable_until }
