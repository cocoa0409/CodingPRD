      - "POST /pod/storefronts/{id}/resume-channel"
      - "POST /pod/fulfillment-partners"
      - "POST /pod/fulfillment-jobs/{id}/reprint-requests"
      - "POST /pod/reprint-requests/{id}/approve"
      - "POST /pod/reprint-requests/{id}/deny"
      - "POST /pod/creators/{id}/payout-cycles"
