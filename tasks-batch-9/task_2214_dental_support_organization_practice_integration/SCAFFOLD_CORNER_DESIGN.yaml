          - endpoints["POST /dso/payer-enrollments"]
        distinguishing_aspect: "The rollup is recomputed after each write rather than latched: it walks PENDING, SUBMITTED, APPROVED and then back to PENDING when a second not-yet-started enrollment is added for another payer."
