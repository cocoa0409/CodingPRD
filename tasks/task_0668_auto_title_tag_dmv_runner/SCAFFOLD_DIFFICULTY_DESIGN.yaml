            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Reject Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { rj_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${rj_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352", declared_price_cents: 0, expedite: false }
              as: IntakeClerk
