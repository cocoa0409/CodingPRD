  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: participant_rest_buffer_accepts_60_rejects_59_minute_gap
        grounds:
          - validations[priority=27]
          - errors[ERR_PARTICIPANT_REST_BUFFER_CONFLICT]
          - endpoints[POST /shift-assignments]
          - entities.ShiftAssignment.fields.participant_id
        distinguishing_aspect: |
          Interval semantics #1 - BUFFERED pairwise exclusion on the Participant resource: each interval
          is inflated by REST_BUFFER_MINUTES 60 on both sides, so a gap of exactly 60 minutes
          (13:00 after a shift ending 12:00) is accepted while a 59-minute gap (15:59 after a shift
          ending 15:00) is rejected. Adjacency is NOT allowed here.
        test_recipe:
          setup:
            - "Launched line with supervisor_capacity 3 so line-wide capacity never binds; participant p1 enrolled at wage 1650."
            - "Three shifts on Mon 2026-09-07: A 08:00-12:00, B 13:00-15:00 (60-minute gap after A), C 15:59-17:00 (59-minute gap after B)."
            - "p1 already ASSIGNED to shift A; clock at 2026-09-07T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 3, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T12:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws_a_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T13:00:00Z", ends_at: "2026-09-07T15:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws_b_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T15:59:00Z", ends_at: "2026-09-07T17:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws_c_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws_a_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { sa_a_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws_b_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { sa_b_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws_c_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger 1 responds HTTP 201 with ShiftAssignment.${sa_b_id}.status == ASSIGNED (gap A.ends_at 12:00 -> B.starts_at 13:00 is exactly 60 minutes, which the buffer accepts)"
            - "trigger 2 responds HTTP 409 with data.error_id == ERR_PARTICIPANT_REST_BUFFER_CONFLICT (gap B.ends_at 15:00 -> C.starts_at 15:59 is 59 minutes)"
            - "WorkShift.${ws_b_id}.assigned_count == 1 and WorkShift.${ws_c_id}.assigned_count == 0"
            - "Participant.${p1_id}.scheduled_hours_current_week == 6.000 (4.000 + 2.000; the rejected 1.017-hour shift contributes nothing)"

      - name: supervision_capacity_rejects_overlap_allows_adjacency
        grounds:
          - validations[priority=28]
          - errors[ERR_SUPERVISION_CAPACITY_EXCEEDED]
          - entities.BusinessLine.fields.supervisor_capacity
          - endpoints[POST /shift-assignments]
        distinguishing_aspect: |
          Interval semantics #2 on a DIFFERENT resource (the BusinessLine's supervisor_capacity, not a
          single participant): AGGREGATE concurrent occupancy with NO buffer, where touching intervals
          never contend. With supervisor_capacity 1, seating p2 on a shift overlapping p1's shift
          (10:00-14:00 vs 08:00-12:00) is rejected, while seating p2 on the merely adjacent shift
