        grounds:
          - validations[priority=11]
          - errors.ERR_ACCOUNT_RESTRICTED_NO_DISBURSEMENT
          - state_machines.TrustAccount.OPEN_to_RESTRICTED
          - state_machines.TrustAccount.RESTRICTED_to_OPEN
        distinguishing_aspect: |
          The restriction is entry-type-scoped, not account-wide: DEPOSIT, CORRECTION,
          OBLIGATION_OPENED and OBLIGATION_RELEASED all still append while the account is RESTRICTED
          and only DISBURSEMENT is refused. It is also state-driven, not shortage-driven - once the
          shortage is back to zero the disbursement is STILL refused, because only the audit's
          VERIFY_REMEDIATION returns the account to OPEN.
