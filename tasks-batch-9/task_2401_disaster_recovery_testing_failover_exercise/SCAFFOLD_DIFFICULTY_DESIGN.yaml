              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /runbook-steps"
              payload: { runbook_id: "${rb1_id}", step_number: 3, description: "Reroute core switch", owner_id: "${op1_id}", expected_minutes: 12, weight: 10, covers_asset_id: "${i1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
