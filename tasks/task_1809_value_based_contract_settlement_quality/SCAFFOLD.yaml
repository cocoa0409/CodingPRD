# =============================================================================
# Task 1809: Value-Based Contract Settlement & Quality Withhold (payer VBC)
# Scaffold seed tables — §1.0–§1.7
# =============================================================================

scenario: |
  1809. Value-Based Contract Settlement & Quality Withhold (payer value-based programs): contract terms (upside/downside, quality gates) modeling, attribution & population definition, cost/utilization performance measurement with risk adjustment, quality measure scoring & withhold release calculation, interim reporting & reserve accrual, dispute over data & reconciliation timeline, payment distribution to practices, contract renewal analysis

domain_name: value-based-contract-settlement
api_prefix: /vbc

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all FKs canonical)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Payer value-based program display name" }
      - { name: line_of_business, type: enum, source: input, description: "MEDICARE_ADVANTAGE | MEDICAID_MANAGED_CARE | COMMERCIAL_ACO" }
      - { name: program_status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | ARCHIVED" }

  - name: PracticeGroup
    parent: null
    common_fields: true
    fields:
      - { name: group_name, type: string, source: input, description: "Provider group legal name" }
      - { name: tin, type: string, source: input, description: "Federal tax id; unique across all groups regardless of status" }
      - { name: group_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: suspension_reason, type: string, source: system, default: null, description: "Recorded when suspended; cleared on reinstate" }

  - name: Practice
    parent: null
    common_fields: true
    fields:
      - { name: practice_group_id, type: string, source: input, description: "FK -> PracticeGroup.id; owning group" }
      - { name: practice_name, type: string, source: input, description: "Practice site name" }
      - { name: npi, type: string, source: input, description: "National provider identifier; unique across all practices" }
      - { name: practice_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; covered program" }
      - { name: member_ref, type: string, source: input, description: "Payer external member reference; unique per program" }
      - { name: birth_year, type: integer, source: input, description: "Member birth year (1900..2026)" }
      - { name: member_status, type: enum, source: system, default: ELIGIBLE, description: "ELIGIBLE | DISENROLLED" }

  - name: EligibilitySpan
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive lower bound (closed interval)" }
      - { name: end_date, type: string, source: input, description: "ISO date, inclusive upper bound (closed interval)" }
      - { name: span_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: practice_group_id, type: string, source: input, description: "FK -> PracticeGroup.id; contracted group" }
      - { name: contract_ref, type: string, source: input, description: "Contract reference; unique per program" }
      - { name: effective_start, type: string, source: input, description: "ISO date inclusive" }
      - { name: effective_end, type: string, source: input, description: "ISO date exclusive (half-open term)" }
      - { name: risk_track, type: enum, source: input, description: "ONE_SIDED_UPSIDE | TWO_SIDED" }
      - { name: risk_model, type: enum, source: input, description: "PROSPECTIVE | CONCURRENT; pinned at activation, selects authoritative RiskScore variant" }
      - { name: benchmark_pmpm_cents, type: integer, source: input, description: "Benchmark per-member-per-month cost, > 0" }
      - { name: shared_savings_rate_bp, type: integer, source: input, description: "Basis points of gross savings shared with group (0..10000)" }
      - { name: shared_loss_rate_bp, type: integer, source: input, description: "Basis points of gross losses owed by group; required iff risk_track == TWO_SIDED" }
      - { name: min_savings_rate_bp, type: integer, source: input, description: "MSR: minimum savings rate (bp of benchmark) to qualify for shared savings; >= comparison" }
      - { name: min_loss_rate_bp, type: integer, source: input, description: "MLR: minimum loss rate (bp of benchmark) before shared losses apply; <= comparison on signed rate" }
      - { name: savings_cap_bp, type: integer, source: input, description: "Cap on shared savings as bp of risk-adjusted benchmark" }
      - { name: loss_cap_bp, type: integer, source: input, description: "Cap on shared losses as bp of risk-adjusted benchmark; TWO_SIDED only" }
      - { name: stop_loss_cents, type: integer, source: input, description: "Per-member annual claims truncation cap for cost measurement" }
      - { name: withhold_rate_bp, type: integer, source: input, description: "Quality withhold rate (bp) applied per paid claim" }
      - { name: quality_gate_floor_points, type: integer, source: input, description: "Composite score floor (0..100); >= floor yields sliding-scale multiplier" }
      - { name: quality_gate_excellence_points, type: integer, source: input, description: "Composite score (0..100) at/above which multiplier = 100%" }
      - { name: estimate_method, type: enum, source: input, description: "ANNUALIZATION | COMPLETION_FACTOR; authoritative interim estimate variant" }
      - { name: quality_measures, type: array, source: input, description: "Measure catalog: [{ measure_code, weight_bp, decile_thresholds_bp: [9 ascending ints] }]; weights need not sum to 10000" }
      - { name: renewed_from_contract_id, type: string, source: system, default: null, description: "FK -> Contract.id; set on the successor contract created by renew" }
      - { name: contract_status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED | RENEWED" }

  - name: PerformanceYear
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: year_label, type: integer, source: input, description: "Calendar label (e.g., 2026); unique per contract" }
      - { name: period_start, type: string, source: input, description: "ISO date inclusive (half-open window lower bound)" }
      - { name: period_end, type: string, source: input, description: "ISO date exclusive (half-open window upper bound)" }
      - { name: year_status, type: enum, source: system, default: SETUP, description: "SETUP | ATTRIBUTION_OPEN | ATTRIBUTION_LOCKED | MEASURING | RECONCILING | SETTLED | CLOSED" }
      - { name: total_member_months, type: integer, source: computed, default: 0, description: "Sum of member_months over CONFIRMED AttributionRecords of the LOCKED run" }
      - { name: actual_cost_cents, type: integer, source: computed, default: 0, description: "Stop-loss-truncated sum of PAID in-period claims of attributed members" }
      - { name: benchmark_cost_cents, type: integer, source: computed, default: 0, description: "Risk-adjusted benchmark over the locked population" }
      - { name: risk_adjustment_factor_milli, type: integer, source: computed, default: null, description: "Member-month-weighted mean FINAL risk score (milli) under contract.risk_model" }
      - { name: withhold_pool_cents, type: integer, source: computed, default: 0, description: "Sum of per-claim rounded withhold over PAID in-period claims of attributed members" }
      - { name: accrued_reserve_cents, type: integer, source: computed, default: 0, description: "Reserve from latest PUBLISHED InterimReport; released to 0 on SETTLED" }
      - { name: locked_run_id, type: string, source: system, default: null, description: "FK -> AttributionRun.id; the run whose records define the measured population" }

  - name: AttributionRun
    parent: null
    common_fields: true
    fields:
      - { name: performance_year_id, type: string, source: input, description: "FK -> PerformanceYear.id" }
      - { name: run_label, type: string, source: input, description: "Analyst label for the run" }
      - { name: run_seq, type: integer, source: system, description: "Per-year monotonically increasing sequence, starts at 1" }
      - { name: run_status, type: enum, source: system, default: DRAFT, description: "DRAFT | COMPUTED | LOCKED | SUPERSEDED" }
      - { name: attributed_member_count, type: integer, source: computed, default: 0, description: "Records with status CONFIRMED at last compute" }

  - name: AttributionRecord
    parent: null
    common_fields: true
    fields:
      - { name: attribution_run_id, type: string, source: input, description: "FK -> AttributionRun.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; unique per run" }
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; attributed practice" }
      - { name: member_months, type: integer, source: computed, default: 0, description: "Eligible months overlapping the year by the mid-month rule; computed at run compute" }
      - { name: record_status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | CONFIRMED | EXCLUDED" }

  - name: RiskScore
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: performance_year_id, type: string, source: input, description: "FK -> PerformanceYear.id" }
      - { name: model_used, type: enum, source: input, description: "PROSPECTIVE | CONCURRENT" }
      - { name: score_milli, type: integer, source: input, description: "Risk score x1000 (e.g., 1250 = 1.250); 1..10000" }
      - { name: score_status, type: enum, source: system, default: PRELIMINARY, description: "PRELIMINARY | FINAL | SUPERSEDED" }

  - name: ClaimRecord
    parent: null
    common_fields: true
    fields:
      - { name: performance_year_id, type: string, source: input, description: "FK -> PerformanceYear.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: claim_ref, type: string, source: input, description: "Payer claim reference; unique per performance year" }
      - { name: service_date, type: string, source: input, description: "ISO date; must satisfy period_start <= service_date < period_end of the claim's year" }
      - { name: paid_amount_cents, type: integer, source: input, description: "Paid amount; > 0" }
      - { name: claim_status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | PAID | DENIED | VOIDED" }
      - { name: paid_on, type: string, source: system, default: null, description: "ISO date stamped from logical clock at mark-paid" }

  - name: QualityMeasureResult
    parent: null
    common_fields: true
    fields:
      - { name: performance_year_id, type: string, source: input, description: "FK -> PerformanceYear.id" }
      - { name: measure_code, type: string, source: input, description: "Must exist in the year's contract quality_measures catalog; one non-EXCLUDED result per (year, measure_code)" }
      - { name: numerator_count, type: integer, source: input, description: "Compliant members; 0 <= numerator <= denominator" }
      - { name: denominator_count, type: integer, source: input, description: "Eligible members; >= 1" }
      - { name: rate_bp, type: integer, source: computed, default: null, description: "round_half_up(numerator_count x 10000 / denominator_count); computed at validate" }
      - { name: achievement_points, type: integer, source: computed, default: null, description: "Count of the measure's 9 decile thresholds t with rate_bp >= t (0..9); computed at validate" }
      - { name: result_status, type: enum, source: system, default: REPORTED, description: "REPORTED | VALIDATED | LOCKED | EXCLUDED" }

  - name: InterimReport
    parent: null
    common_fields: true
    fields:
      - { name: performance_year_id, type: string, source: input, description: "FK -> PerformanceYear.id" }
      - { name: months_elapsed, type: integer, source: input, description: "Measurement months elapsed (1..11)" }
      - { name: report_seq, type: integer, source: system, description: "Per-year monotonically increasing sequence, starts at 1" }
      - { name: est_actual_annualization_cents, type: integer, source: computed, default: null, description: "YTD paid x 12 / months_elapsed (round_half_up)" }
      - { name: est_actual_completion_cents, type: integer, source: computed, default: null, description: "YTD paid x 1000 / COMPLETION_MILLI[months_elapsed] (round_half_up)" }
      - { name: est_net_payable_cents, type: integer, source: computed, default: null, description: "Estimated net under the contract's authoritative estimate_method" }
      - { name: reserve_accrual_cents, type: integer, source: computed, default: null, description: "round_half_up(max(0, est_net_payable) x months_elapsed / 12)" }
      - { name: report_status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SUPERSEDED | STALE" }
      - { name: published_on, type: string, source: system, default: null, description: "ISO date stamped at publish" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: performance_year_id, type: string, source: input, description: "FK -> PerformanceYear.id; at most one non-VOID settlement per year" }
      - { name: settlement_seq, type: integer, source: system, description: "Per-year monotonically increasing sequence, starts at 1" }
      - { name: settlement_status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | FINALIZED | DISPUTED | RECALCULATING | AUTHORIZED | DISTRIBUTED | VOID" }
      - { name: gross_savings_cents, type: integer, source: computed, default: null, description: "benchmark_cost_cents - actual_cost_cents (may be negative)" }
      - { name: savings_rate_bp, type: integer, source: computed, default: null, description: "truncated-toward-zero(gross x 10000 / benchmark)" }
      - { name: shared_savings_cents, type: integer, source: computed, default: 0, description: "Pre-quality shared savings after MSR gate and savings cap" }
      - { name: shared_losses_cents, type: integer, source: computed, default: 0, description: "Shared losses after MLR gate and loss cap (positive amount owed by group); TWO_SIDED only" }
      - { name: quality_composite_points, type: integer, source: computed, default: null, description: "Weighted composite over LOCKED quality results (0..100)" }
      - { name: quality_multiplier_bp, type: integer, source: computed, default: null, description: "Gate multiplier: 0 below floor, sliding scale floor..excellence, 10000 at/above excellence" }
      - { name: quality_adjusted_savings_cents, type: integer, source: computed, default: 0, description: "round_half_up(shared_savings x quality_multiplier / 10000)" }
      - { name: withhold_released_cents, type: integer, source: computed, default: 0, description: "round_half_up(withhold_pool x quality_multiplier / 10000)" }
      - { name: withhold_forfeited_cents, type: integer, source: computed, default: 0, description: "withhold_pool - withhold_released" }
      - { name: net_payable_cents, type: integer, source: computed, default: null, description: "quality_adjusted_savings + withhold_released - shared_losses (may be negative)" }
      - { name: undistributed_balance_cents, type: integer, source: computed, default: null, description: "max(0, net_payable) minus amounts on SCHEDULED/APPROVED/PAID remittances" }
      - { name: finalized_on, type: string, source: system, default: null, description: "ISO date stamped at finalize; dispute window anchor" }
      - { name: finalized_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the certifying SettlementOfficer; segregation-of-duties anchor" }
      - { name: needs_recompute, type: boolean, source: computed, default: false, description: "Set true by any post-finalize data mutation touching the year; cleared by recalculate" }

  - name: SettlementDispute
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: input, description: "FK -> Settlement.id" }
      - { name: dispute_ref, type: string, source: input, description: "Group-side reference; unique per settlement" }
      - { name: reason_code, type: enum, source: input, description: "ATTRIBUTION_ERROR | CLAIMS_MISSING | RISK_SCORE_ERROR | QUALITY_DATA_ERROR | BENCHMARK_ERROR" }
      - { name: claimed_adjustment_cents, type: integer, source: input, description: "Claimed dollar impact; > 0" }
      - { name: filed_on, type: string, source: system, description: "ISO date stamped from logical clock at filing" }
      - { name: review_started_on, type: string, source: system, default: null, description: "ISO date stamped at begin-review" }
      - { name: resolved_on, type: string, source: system, default: null, description: "ISO date stamped at resolve" }
      - { name: resolved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of resolving DisputeAdjudicator" }
      - { name: resolution_outcome, type: enum, source: system, default: null, description: "UPHELD | OVERRULED | null until resolved" }
      - { name: dispute_status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | UPHELD | OVERRULED | WITHDRAWN | EXPIRED" }

  - name: DistributionRemittance
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id" }
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id" }
      - { name: practice_member_months, type: integer, source: system, description: "Member-months weight used for allocation" }
      - { name: amount_cents, type: integer, source: computed, description: "Allocated share by largest-remainder waterfall" }
      - { name: remittance_status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | APPROVED | PAID | RETURNED" }
      - { name: paid_on, type: string, source: system, default: null, description: "ISO date stamped at mark-paid" }

  - name: RenewalAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: analysis_seq, type: integer, source: system, description: "Per-contract monotonically increasing sequence, starts at 1" }
      - { name: realized_savings_rate_bp, type: integer, source: computed, default: null, description: "Aggregated over the contract's CLOSED years: trunc((sum benchmark - sum actual) x 10000 / sum benchmark)" }
      - { name: quality_trend_points, type: integer, source: computed, default: null, description: "Latest CLOSED year composite minus earliest CLOSED year composite (by year_label)" }
      - { name: risk_growth_milli, type: integer, source: computed, default: null, description: "Latest CLOSED year RAF milli minus earliest CLOSED year RAF milli" }
      - { name: recommendation, type: enum, source: computed, default: null, description: "RENEW_AS_IS | RENEW_RENEGOTIATE | DO_NOT_RENEW; computed at complete" }
      - { name: analysis_status, type: enum, source: system, default: DRAFT, description: "DRAFT | COMPLETE | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - { from: DRAFT, to: ACTIVE, trigger: "POST /vbc/programs/{id}/activate", actor: PayerAdmin, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: ARCHIVED, trigger: "POST /vbc/programs/{id}/archive", actor: PayerAdmin, preconditions: ["No Contract of this program in {DRAFT, ACTIVE} (ERR_PROGRAM_HAS_OPEN_CONTRACTS)"], side_effects: [] }

  - entity: PracticeGroup
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - { from: ACTIVE, to: SUSPENDED, trigger: "POST /vbc/practice-groups/{id}/suspend", actor: PayerAdmin, preconditions: [], side_effects: ["suspension_reason := request reason"] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "POST /vbc/practice-groups/{id}/reinstate", actor: PayerAdmin, preconditions: [], side_effects: ["suspension_reason := null"] }
      - { from: ACTIVE, to: TERMINATED, trigger: "POST /vbc/practice-groups/{id}/terminate", actor: PayerAdmin, preconditions: ["No Contract with practice_group_id == this id in {DRAFT, ACTIVE} (ERR_GROUP_HAS_OPEN_CONTRACTS)"], side_effects: [] }
      - { from: SUSPENDED, to: TERMINATED, trigger: "POST /vbc/practice-groups/{id}/terminate", actor: PayerAdmin, preconditions: ["No Contract with practice_group_id == this id in {DRAFT, ACTIVE} (ERR_GROUP_HAS_OPEN_CONTRACTS)"], side_effects: [] }

  - entity: Practice
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - { from: ACTIVE, to: INACTIVE, trigger: "POST /vbc/practices/{id}/deactivate", actor: PayerAdmin, preconditions: [], side_effects: [] }

  - entity: Member
    initial_state: ELIGIBLE
    terminal_states: [DISENROLLED]
    transitions:
      - { from: ELIGIBLE, to: DISENROLLED, trigger: "POST /vbc/members/{id}/disenroll", actor: PayerAdmin, preconditions: [], side_effects: ["Member excluded from new attribution records (ERR_MEMBER_DISENROLLED); existing AttributionRecords and Claims unaffected"] }

  - entity: EligibilitySpan
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - { from: ACTIVE, to: CLOSED, trigger: "POST /vbc/eligibility-spans/{id}/close", actor: PayerAdmin, preconditions: [], side_effects: ["Span no longer counts toward member_months on subsequent attribution compute"] }

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED, RENEWED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /vbc/contracts/{id}/activate"
        actor: ContractManager
        preconditions:
          - "Program program_status == ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "PracticeGroup group_status == ACTIVE (ERR_GROUP_NOT_ACTIVE)"
        side_effects:
          - "risk_model pinned: subsequent RiskScore ingest with model_used != risk_model rejected (ERR_RISK_MODEL_MISMATCH); changing risk_model later is impossible (no update endpoint)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /vbc/contracts/{id}/expire"
        actor: ContractManager
        preconditions:
          - "Logical clock date >= effective_end (ERR_CONTRACT_TERM_NOT_ENDED)"
          - "Every PerformanceYear of this contract has year_status == CLOSED (ERR_YEARS_NOT_CLOSED)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /vbc/contracts/{id}/terminate"
        actor: ContractManager
        preconditions:
          - "No PerformanceYear of this contract in {ATTRIBUTION_OPEN, ATTRIBUTION_LOCKED, MEASURING, RECONCILING, SETTLED} (ERR_YEARS_IN_FLIGHT)"
        side_effects: []
      - from: EXPIRED
        to: RENEWED
        trigger: "POST /vbc/contracts/{id}/renew"
        actor: ContractManager
        preconditions:
          - "Exists RenewalAnalysis of this contract with analysis_status == COMPLETE and recommendation != DO_NOT_RENEW (ERR_RENEWAL_NOT_RECOMMENDED)"
        side_effects:
          - "Create successor Contract in DRAFT copying all terms, contract_ref := contract_ref + '-R', renewed_from_contract_id := this contract id; response body is the successor Contract (201)"

  - entity: PerformanceYear
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: ATTRIBUTION_OPEN
        trigger: "POST /vbc/performance-years/{id}/open-attribution"
        actor: PayerAdmin
        preconditions:
          - "Contract contract_status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "Year window inside contract term: period_start >= contract.effective_start AND period_end <= contract.effective_end (ERR_YEAR_OUTSIDE_TERM)"
        side_effects: []
      - from: ATTRIBUTION_OPEN
        to: ATTRIBUTION_LOCKED
        trigger: "POST /vbc/performance-years/{id}/lock-attribution"
        actor: PayerAdmin
        preconditions:
          - "Exactly one AttributionRun of this year has run_status == LOCKED (ERR_NO_LOCKED_ATTRIBUTION_RUN if none; at most one is enforced at run lock)"
        side_effects:
          - "locked_run_id := that run's id"
          - "Recompute total_member_months, risk_adjustment_factor_milli, benchmark_cost_cents per calculations.attribution_rollup"
      - from: ATTRIBUTION_LOCKED
        to: MEASURING
        trigger: "POST /vbc/performance-years/{id}/begin-measurement"
        actor: PayerAdmin
        preconditions: []
        side_effects:
          - "Recompute actual_cost_cents and withhold_pool_cents per calculations.cost_measurement and calculations.withhold_pool"
      - from: MEASURING
        to: RECONCILING
        trigger: "POST /vbc/performance-years/{id}/begin-reconciliation"
        actor: PayerAdmin
        preconditions:
          - "Logical clock date >= period_end (ERR_MEASUREMENT_PERIOD_NOT_ENDED)"
          - "total_member_months > 0 (ERR_EMPTY_POPULATION)"
          - "Every QualityMeasureResult of this year has result_status IN {LOCKED, EXCLUDED} (ERR_QUALITY_RESULTS_UNLOCKED)"
        side_effects: []
      - from: RECONCILING
        to: ATTRIBUTION_OPEN
        trigger: "POST /vbc/performance-years/{id}/reopen-attribution"
        actor: PayerAdmin
        preconditions:
          - "The year's Settlement (if any) has settlement_status == PROVISIONAL (ERR_SETTLEMENT_BEYOND_PROVISIONAL)"
        side_effects:
          - "LOCKED AttributionRun -> SUPERSEDED; locked_run_id := null"
          - "PROVISIONAL Settlement -> VOID"
          - "total_member_months := 0; benchmark_cost_cents := 0; risk_adjustment_factor_milli := null; actual_cost_cents := 0; withhold_pool_cents := 0"
      - from: RECONCILING
        to: SETTLED
        trigger: "POST /vbc/performance-years/{id}/mark-settled"
        actor: SettlementOfficer
        preconditions:
          - "Settlement exists with settlement_status IN {FINALIZED, AUTHORIZED, DISTRIBUTED} (ERR_SETTLEMENT_NOT_FINAL)"
          - "Logical clock date > settlement.finalized_on + DISPUTE_WINDOW_DAYS (ERR_DISPUTE_WINDOW_OPEN)"
        side_effects:
          - "accrued_reserve_cents := 0 (reserve released against finalized settlement)"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /vbc/performance-years/{id}/close"
        actor: Auditor
        preconditions:
          - "Settlement settlement_status == DISTRIBUTED (ERR_SETTLEMENT_NOT_DISTRIBUTED)"
        side_effects: []

  - entity: AttributionRun
    initial_state: DRAFT
    terminal_states: [LOCKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /vbc/attribution-runs/{id}/compute"
        actor: AttributionAnalyst
        preconditions: []
        side_effects:
          - "Each record: member_months recomputed per calculations.member_months (CLOSED spans excluded); PROVISIONAL -> CONFIRMED"
          - "attributed_member_count := count of CONFIRMED records"
      - from: COMPUTED
        to: LOCKED
        trigger: "POST /vbc/attribution-runs/{id}/lock"
        actor: AttributionAnalyst
        preconditions:
          - "PerformanceYear year_status == ATTRIBUTION_OPEN (ERR_YEAR_NOT_OPEN)"
          - "No other AttributionRun of this year in LOCKED (ERR_RUN_ALREADY_LOCKED)"
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new AttributionRun is created for the same year)"
        actor: system
        preconditions: []
        side_effects: ["Records of the superseded run remain queryable but never drive rollups"]
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "system (a new AttributionRun is created for the same year)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system (PerformanceYear reopen-attribution)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AttributionRecord
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: CONFIRMED
        trigger: "system (AttributionRun compute)"
        actor: system
        preconditions: []
        side_effects: ["member_months recomputed"]
      - from: CONFIRMED
        to: EXCLUDED
        trigger: "POST /vbc/attribution-records/{id}/exclude"
        actor: AttributionAnalyst
        preconditions:
          - "AttributionRun run_status == LOCKED (ERR_RUN_NOT_LOCKED)"
          - "PerformanceYear year_status NOT IN {SETTLED, CLOSED} (ERR_YEAR_LOCKED)"
        side_effects:
          - "Cascade link 1: year.total_member_months and benchmark_cost_cents recomputed without this record"
          - "Cascade link 2: Settlement of the year in {PROVISIONAL, FINALIZED} gets needs_recompute := true (triggered by the rollup change)"
      - from: EXCLUDED
        to: CONFIRMED
        trigger: "POST /vbc/attribution-records/{id}/reinstate"
        actor: AttributionAnalyst
        preconditions:
          - "AttributionRun run_status == LOCKED (ERR_RUN_NOT_LOCKED)"
          - "PerformanceYear year_status NOT IN {SETTLED, CLOSED} (ERR_YEAR_LOCKED)"
        side_effects:
          - "Year rollups recomputed with the record restored (compensating invariant: exclude then reinstate leaves total_member_months identical)"

  - entity: RiskScore
    initial_state: PRELIMINARY
    terminal_states: [SUPERSEDED]
    transitions:
      - { from: PRELIMINARY, to: FINAL, trigger: "POST /vbc/risk-scores/{id}/finalize", actor: ActuaryAnalyst, preconditions: [], side_effects: ["If year rollups already computed (ATTRIBUTION_LOCKED or later), benchmark_cost_cents and risk_adjustment_factor_milli recomputed; Settlement needs_recompute := true when in {PROVISIONAL, FINALIZED}"] }
      - { from: PRELIMINARY, to: SUPERSEDED, trigger: "POST /vbc/risk-scores/{id}/supersede", actor: ActuaryAnalyst, preconditions: [], side_effects: [] }
      - { from: FINAL, to: SUPERSEDED, trigger: "POST /vbc/risk-scores/{id}/supersede", actor: ActuaryAnalyst, preconditions: ["PerformanceYear year_status NOT IN {SETTLED, CLOSED} (ERR_YEAR_LOCKED)"], side_effects: ["Year rollups recomputed without this score (missing FINAL score falls back to DEFAULT_SCORE_MILLI); Settlement needs_recompute := true when in {PROVISIONAL, FINALIZED}"] }

  - entity: ClaimRecord
    initial_state: RECEIVED
    terminal_states: [DENIED, VOIDED]
    transitions:
      - { from: RECEIVED, to: PAID, trigger: "POST /vbc/claims/{id}/mark-paid", actor: ClaimsProcessor, preconditions: [], side_effects: ["paid_on := logical clock date", "If year past MEASURING: actual_cost_cents and withhold_pool_cents recomputed; PUBLISHED InterimReports -> STALE; Settlement needs_recompute := true when in {PROVISIONAL, FINALIZED}"] }
      - { from: RECEIVED, to: DENIED, trigger: "POST /vbc/claims/{id}/deny", actor: ClaimsProcessor, preconditions: [], side_effects: [] }
      - from: PAID
        to: VOIDED
        trigger: "POST /vbc/claims/{id}/void"
        actor: ClaimsProcessor
        preconditions:
          - "PerformanceYear year_status NOT IN {SETTLED, CLOSED} (ERR_YEAR_LOCKED)"
        side_effects:
          - "Cascade link 1: PerformanceYear.actual_cost_cents and withhold_pool_cents recomputed without this claim"
          - "Cascade link 2: every PUBLISHED InterimReport of the year -> STALE (triggered by the year-total mutation)"
          - "Cascade link 3: Settlement of the year in {PROVISIONAL, FINALIZED} gets needs_recompute := true (triggered by the staleness propagation)"

  - entity: QualityMeasureResult
    initial_state: REPORTED
    terminal_states: [EXCLUDED]
    transitions:
      - from: REPORTED
        to: VALIDATED
        trigger: "POST /vbc/quality-measure-results/{id}/validate"
        actor: QualityAnalyst
        preconditions:
          - "denominator_count >= 1 (ERR_EMPTY_DENOMINATOR)"
        side_effects:
          - "rate_bp and achievement_points computed per calculations.achievement_points"
      - { from: VALIDATED, to: REPORTED, trigger: "POST /vbc/quality-measure-results/{id}/return-for-correction", actor: QualityAnalyst, preconditions: ["PerformanceYear year_status IN {SETUP, ATTRIBUTION_OPEN, ATTRIBUTION_LOCKED, MEASURING} (ERR_YEAR_LOCKED)"], side_effects: ["rate_bp := null; achievement_points := null"] }
      - { from: VALIDATED, to: LOCKED, trigger: "POST /vbc/quality-measure-results/{id}/lock", actor: QualityAnalyst, preconditions: ["PerformanceYear year_status IN {ATTRIBUTION_OPEN, ATTRIBUTION_LOCKED, MEASURING} (ERR_YEAR_LOCKED)"], side_effects: [] }
      - { from: REPORTED, to: EXCLUDED, trigger: "POST /vbc/quality-measure-results/{id}/exclude", actor: QualityAnalyst, preconditions: ["PerformanceYear year_status NOT IN {SETTLED, CLOSED} (ERR_YEAR_LOCKED)"], side_effects: ["Settlement needs_recompute := true when in {PROVISIONAL, FINALIZED}"] }
      - { from: VALIDATED, to: EXCLUDED, trigger: "POST /vbc/quality-measure-results/{id}/exclude", actor: QualityAnalyst, preconditions: ["PerformanceYear year_status NOT IN {SETTLED, CLOSED} (ERR_YEAR_LOCKED)"], side_effects: ["Settlement needs_recompute := true when in {PROVISIONAL, FINALIZED}"] }
      - { from: LOCKED, to: EXCLUDED, trigger: "POST /vbc/quality-measure-results/{id}/exclude", actor: QualityAnalyst, preconditions: ["PerformanceYear year_status NOT IN {SETTLED, CLOSED} (ERR_YEAR_LOCKED)"], side_effects: ["Composite-dependent settlement fields stale: Settlement needs_recompute := true when in {PROVISIONAL, FINALIZED}"] }

  - entity: InterimReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, STALE]
    transitions:
      - { from: DRAFT, to: PUBLISHED, trigger: "POST /vbc/interim-reports/{id}/publish", actor: ActuaryAnalyst, preconditions: ["PerformanceYear year_status IN {MEASURING, RECONCILING} (ERR_YEAR_NOT_MEASURING)"], side_effects: ["Any other PUBLISHED InterimReport of the year -> SUPERSEDED", "PerformanceYear.accrued_reserve_cents := this report's reserve_accrual_cents", "published_on := logical clock date"] }
      - { from: DRAFT, to: SUPERSEDED, trigger: "system (a new InterimReport is created for the same year)", actor: system, preconditions: [], side_effects: [] }
      - { from: PUBLISHED, to: SUPERSEDED, trigger: "system (a newer InterimReport of the same year is published)", actor: system, preconditions: [], side_effects: [] }
      - { from: PUBLISHED, to: STALE, trigger: "system (year actual_cost_cents/withhold_pool_cents/population rollups mutate: claim void or mark-paid, attribution exclude/reinstate, risk-score finalize/supersede)", actor: system, preconditions: [], side_effects: ["accrued_reserve_cents on the year remains until a newer report publishes or the year settles"] }

  - entity: Settlement
    initial_state: PROVISIONAL
    terminal_states: [DISTRIBUTED, VOID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /vbc/settlements/{id}/finalize"
        actor: SettlementOfficer
        preconditions:
          - "Logical clock date >= year.period_end + RECONCILIATION_RUNOUT_DAYS (ERR_RECONCILIATION_RUNOUT_INCOMPLETE)"
          - "needs_recompute == false (ERR_SETTLEMENT_STALE)"
        side_effects:
          - "Recompute every computed field from current data (final runout variant: actuals only, no completion factor)"
          - "finalized_on := logical clock date; finalized_by_user_id := X-User-ID"
      - { from: PROVISIONAL, to: VOID, trigger: "system (PerformanceYear reopen-attribution)", actor: system, preconditions: [], side_effects: [] }
      - { from: FINALIZED, to: DISPUTED, trigger: "system (SettlementDispute filed)", actor: system, preconditions: [], side_effects: [] }
      - { from: DISPUTED, to: FINALIZED, trigger: "system (dispute OVERRULED, WITHDRAWN, or EXPIRED)", actor: system, preconditions: [], side_effects: ["finalized_on unchanged: the original dispute window anchor is preserved"] }
      - { from: DISPUTED, to: RECALCULATING, trigger: "system (dispute resolved UPHELD)", actor: system, preconditions: [], side_effects: [] }
      - from: RECALCULATING
        to: PROVISIONAL
        trigger: "system (automatic recalculation in the same request that upheld the dispute)"
        actor: system
        preconditions: []
        side_effects:
          - "All computed fields recomputed from current (corrected) data; settlement_seq unchanged; needs_recompute := false"
      - from: FINALIZED
        to: AUTHORIZED
        trigger: "POST /vbc/settlements/{id}/authorize-distribution"
        actor: SettlementOfficer
        preconditions:
          - "Logical clock date > finalized_on + DISPUTE_WINDOW_DAYS (ERR_DISPUTE_WINDOW_OPEN)"
        side_effects:
          - "Create one DistributionRemittance per practice with allocated amount > 0 per calculations.distribution_allocation (zero-amount practices get no remittance)"
          - "undistributed_balance_cents := max(0, net_payable_cents) - sum(remittance amounts)"
          - "If net_payable_cents <= 0: no remittances created and settlement transitions directly to DISTRIBUTED"
      - { from: AUTHORIZED, to: DISTRIBUTED, trigger: "system (every DistributionRemittance of the settlement reaches PAID)", actor: system, preconditions: [], side_effects: [] }

  - entity: SettlementDispute
    initial_state: FILED
    terminal_states: [UPHELD, OVERRULED, WITHDRAWN, EXPIRED]
    transitions:
      - { from: FILED, to: UNDER_REVIEW, trigger: "POST /vbc/settlement-disputes/{id}/begin-review", actor: DisputeAdjudicator, preconditions: [], side_effects: ["review_started_on := logical clock date"] }
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /vbc/settlement-disputes/{id}/resolve"
        actor: DisputeAdjudicator
        preconditions:
          - "payload outcome == UPHELD"
          - "Logical clock date <= filed_on + DISPUTE_RESOLUTION_DAYS (ERR_DISPUTE_RESOLUTION_WINDOW_ELAPSED)"
          - "X-User-ID != settlement.finalized_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Cascade link 1: Settlement DISPUTED -> RECALCULATING"
          - "Cascade link 2: settlement auto-recalculates to PROVISIONAL from corrected data (entering RECALCULATING triggers the recalc)"
          - "resolved_on := clock date; resolved_by_user_id := X-User-ID; resolution_outcome := UPHELD"
      - from: UNDER_REVIEW
        to: OVERRULED
        trigger: "POST /vbc/settlement-disputes/{id}/resolve"
        actor: DisputeAdjudicator
        preconditions:
          - "payload outcome == OVERRULED"
          - "Logical clock date <= filed_on + DISPUTE_RESOLUTION_DAYS (ERR_DISPUTE_RESOLUTION_WINDOW_ELAPSED)"
          - "X-User-ID != settlement.finalized_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Settlement DISPUTED -> FINALIZED (amounts unchanged)"
          - "resolved_on := clock date; resolved_by_user_id := X-User-ID; resolution_outcome := OVERRULED"
      - { from: FILED, to: WITHDRAWN, trigger: "POST /vbc/settlement-disputes/{id}/withdraw", actor: PracticeGroupRep, preconditions: ["Caller group owns the contract behind the settlement (ERR_FORBIDDEN_GROUP_SCOPE)"], side_effects: ["Settlement DISPUTED -> FINALIZED"] }
      - { from: UNDER_REVIEW, to: WITHDRAWN, trigger: "POST /vbc/settlement-disputes/{id}/withdraw", actor: PracticeGroupRep, preconditions: ["Caller group owns the contract behind the settlement (ERR_FORBIDDEN_GROUP_SCOPE)"], side_effects: ["Settlement DISPUTED -> FINALIZED"] }
      - from: UNDER_REVIEW
        to: EXPIRED
        trigger: "POST /vbc/settlement-disputes/{id}/expire"
        actor: DisputeAdjudicator
        preconditions:
          - "Logical clock date > filed_on + DISPUTE_RESOLUTION_DAYS (ERR_DISPUTE_NOT_EXPIRABLE)"
        side_effects: ["Settlement DISPUTED -> FINALIZED"]
      - { from: FILED, to: EXPIRED, trigger: "POST /vbc/settlement-disputes/{id}/expire", actor: DisputeAdjudicator, preconditions: ["Logical clock date > filed_on + DISPUTE_RESOLUTION_DAYS (ERR_DISPUTE_NOT_EXPIRABLE)"], side_effects: ["Settlement DISPUTED -> FINALIZED"] }

  - entity: DistributionRemittance
    initial_state: SCHEDULED
    terminal_states: [PAID]
    transitions:
      - { from: SCHEDULED, to: APPROVED, trigger: "POST /vbc/distribution-remittances/{id}/approve", actor: PaymentOps, preconditions: ["Settlement settlement_status == AUTHORIZED (ERR_SETTLEMENT_NOT_AUTHORIZED)", "PracticeGroup of the practice has group_status == ACTIVE (ERR_GROUP_NOT_ACTIVE)"], side_effects: [] }
      - { from: APPROVED, to: PAID, trigger: "POST /vbc/distribution-remittances/{id}/mark-paid", actor: PaymentOps, preconditions: [], side_effects: ["paid_on := logical clock date", "If all remittances of the settlement are PAID: Settlement AUTHORIZED -> DISTRIBUTED"] }
      - { from: APPROVED, to: RETURNED, trigger: "POST /vbc/distribution-remittances/{id}/return", actor: PaymentOps, preconditions: [], side_effects: ["Settlement.undistributed_balance_cents recomputed: RETURNED amounts are released back (compensating invariant with requeue)"] }
      - { from: RETURNED, to: SCHEDULED, trigger: "POST /vbc/distribution-remittances/{id}/requeue", actor: PaymentOps, preconditions: ["Settlement settlement_status == AUTHORIZED (ERR_SETTLEMENT_NOT_AUTHORIZED)"], side_effects: ["undistributed_balance_cents recomputed"] }

  - entity: RenewalAnalysis
    initial_state: DRAFT
    terminal_states: [COMPLETE, SUPERSEDED]
    transitions:
      - { from: DRAFT, to: COMPLETE, trigger: "POST /vbc/renewal-analyses/{id}/complete", actor: ContractManager, preconditions: [], side_effects: ["recommendation computed per calculations.renewal_recommendation"] }
      - { from: DRAFT, to: SUPERSEDED, trigger: "system (a new RenewalAnalysis is created for the same contract)", actor: system, preconditions: [], side_effects: [] }

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: attribution-run-create-stale-year
    parent_entity: PerformanceYear
    write_endpoint: "POST /vbc/performance-years/{id}/attribution-runs"
    occ_field: expected_performance_year_version
    description: |
      Creating an AttributionRun against a PerformanceYear whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a run (which legitimately
      supersedes the prior DRAFT/COMPUTED run) and the current writer's view of
      the year is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: interim-report-create-stale-year
    parent_entity: PerformanceYear
    write_endpoint: "POST /vbc/interim-reports"
    occ_field: expected_performance_year_version
    description: |
      Creating an InterimReport against a PerformanceYear whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a report (which legitimately
      supersedes the prior DRAFT report) and the current writer's view of the
      year is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: renewal-analysis-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /vbc/contracts/{id}/renewal-analyses"
    occ_field: expected_contract_version
    description: |
      Creating a RenewalAnalysis against a Contract whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created an analysis (which legitimately
      supersedes the prior DRAFT analysis) and the current writer's view of the
      contract is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: member_months
    trigger: "AttributionRun compute (per record)"
    algorithm: chronological
    formula: |
      For AttributionRecord r over year [period_start, period_end):
        months = 0
        for each calendar month m intersecting [period_start, period_end):
          fifteenth = date(m.year, m.month, 15)
          eligible = any ACTIVE EligibilitySpan of r.member_id with
                     start_date <= fifteenth AND end_date >= fifteenth   # closed span interval
          if fifteenth >= period_start AND fifteenth < period_end AND eligible: months += 1
        r.member_months = months
    input_set: "EligibilitySpans of the record's member with span_status == ACTIVE; CLOSED spans ignored"
    constants:
      MID_MONTH_DAY: 15
    precision: "integer months"

  - name: attribution_rollup
    trigger: "PerformanceYear lock-attribution; record exclude/reinstate; risk-score finalize/supersede"
    algorithm: aggregation
    formula: |
      population = AttributionRecords where attribution_run_id == year.locked_run_id
                   AND record_status == CONFIRMED
      year.total_member_months = sum(r.member_months for r in population)
      scores = for each r: RiskScore of (r.member_id, year) with model_used == contract.risk_model
               AND score_status == FINAL; if none, use DEFAULT_SCORE_MILLI
      year.risk_adjustment_factor_milli =
        floor( sum(r.member_months * score_milli(r)) / sum(r.member_months) )   # floor division
      year.benchmark_cost_cents =
        sum( round_half_up(contract.benchmark_pmpm_cents * r.member_months * score_milli(r) / 1000)
             for r in population )   # per-record rounding, THEN sum (pinned order)
    input_set: "CONFIRMED records of the LOCKED run only; EXCLUDED records and records of SUPERSEDED runs never counted"
    constants:
      DEFAULT_SCORE_MILLI: 1000
    precision: "benchmark per record round_half_up to whole cents, then summed; RAF floor to milli"

  - name: risk_model_variant
    trigger: "computed alongside attribution_rollup for reporting and renewal"
    algorithm: aggregation
    formula: |
      Same weighted-mean formula as attribution_rollup, computed twice:
      once over FINAL scores with model_used == PROSPECTIVE, once with model_used == CONCURRENT.
      The contract.risk_model value selects which variant is authoritative for
      benchmark_cost_cents; the other is observational only.
    input_set: "same population as attribution_rollup"
    constants:
      DEFAULT_SCORE_MILLI: 1000
    precision: "floor to milli"
    variants:
      - name: prospective
        when: "contract.risk_model == PROSPECTIVE"
        difference: "Uses PROSPECTIVE FINAL scores; identical population can yield a different benchmark than concurrent"
      - name: concurrent
        when: "contract.risk_model == CONCURRENT"
        difference: "Uses CONCURRENT FINAL scores"

  - name: cost_measurement
    trigger: "PerformanceYear begin-measurement; claim mark-paid/void; settlement finalize/recalculate"
    algorithm: aggregation
    formula: |
      claims = ClaimRecords of the year with claim_status == PAID
               AND period_start <= service_date < period_end
               AND member_id attributed (has CONFIRMED record in the LOCKED run)
      per member m: allowed(m) = min(sum(paid_amount_cents of m's claims), contract.stop_loss_cents)
      year.actual_cost_cents = sum(allowed(m))
    input_set: "PAID claims only; RECEIVED/DENIED/VOIDED never counted; claims of unattributed or EXCLUDED members never counted"
    constants: {}
    precision: "integer cents"

  - name: withhold_pool
    trigger: "PerformanceYear begin-measurement; claim mark-paid/void; settlement finalize/recalculate"
    algorithm: aggregation
    formula: |
      For each claim in the cost_measurement input set (pre-stop-loss):
        withhold_i = round_half_up(paid_amount_cents * contract.withhold_rate_bp / 10000)
      year.withhold_pool_cents = sum(withhold_i)
      PINNED ROUNDING ORDER: round per claim first, then sum.
      (Sum-then-round produces different cents and is forbidden.)
    input_set: "same claim set as cost_measurement, evaluated BEFORE stop-loss truncation"
    constants: {}
    precision: "per-claim round_half_up to whole cents, then summed"

  - name: achievement_points
    trigger: "QualityMeasureResult validate"
    algorithm: threshold
    formula: |
      rate_bp = round_half_up(numerator_count * 10000 / denominator_count)
      thresholds = contract.quality_measures[measure_code].decile_thresholds_bp  # 9 ascending ints
      achievement_points = count(t in thresholds where rate_bp >= t)   # 0..9, >= comparison pinned
    input_set: "the single result being validated; thresholds from the contract catalog entry matching measure_code"
    constants: {}
    precision: "rate round_half_up to whole bp; points integer"

  - name: quality_composite
    trigger: "Settlement finalize/recalculate (OFFICIAL variant); InterimReport create (INTERIM variant)"
    algorithm: weighted_scoring
    formula: |
      results = QualityMeasureResults of the year, filtered by variant
      num = sum(r.achievement_points * weight_bp(r.measure_code))
      den = sum(weight_bp(r.measure_code))
      if den == 0: composite_points = 0            # empty set -> 0 -> below any positive floor
      else: composite_points = round_half_up(num * 100 / (9 * den))
      weight_bp(code) = contract.quality_measures entry's weight_bp
    input_set: "OFFICIAL: results with result_status == LOCKED; INTERIM: results with result_status IN {VALIDATED, LOCKED}"
    constants: {}
    precision: "composite round_half_up to integer points 0..100"
    variants:
      - name: official
        when: "settlement finalize/recalculate and gate determination"
        difference: "LOCKED results only; identical measure data yields a different composite than interim when any result is VALIDATED-but-not-LOCKED"
      - name: interim
        when: "interim report estimation"
        difference: "VALIDATED and LOCKED results included"

  - name: quality_gate_multiplier
    trigger: "Settlement finalize/recalculate; InterimReport create (applied to estimates)"
    algorithm: threshold
    formula: |
      c = composite_points (variant per caller)
      if c >= contract.quality_gate_excellence_points: multiplier_bp = 10000
      elif c >= contract.quality_gate_floor_points:
        multiplier_bp = 5000 + round_half_up((c - floor) * 5000 / (excellence - floor))
      else: multiplier_bp = 0
      Boundaries pinned: c == floor -> sliding branch (5000); c == excellence -> 10000;
      c == floor - 1 -> 0.
    input_set: "composite_points from quality_composite"
    constants:
      SLIDING_BASE_BP: 5000
    precision: "round_half_up to whole bp"

  - name: shared_savings_and_loss
    trigger: "Settlement create/finalize/recalculate; InterimReport create (on estimated figures)"
    algorithm: tiered_pricing
    formula: |
      gross = benchmark_cost_cents - actual_cost_cents          # may be negative
      if benchmark_cost_cents == 0: rate_bp = 0 and shared_savings = shared_losses = 0  # guard: reachable only via interim estimates before attribution lock
      rate_bp = trunc_toward_zero(gross * 10000 / benchmark_cost_cents)
      if gross >= 0:
        if rate_bp >= contract.min_savings_rate_bp:             # >= pinned
          uncapped = round_half_up(gross * contract.shared_savings_rate_bp / 10000)
          cap = round_half_up(benchmark_cost_cents * contract.savings_cap_bp / 10000)
          shared_savings = min(uncapped, cap)
        else: shared_savings = 0
        shared_losses = 0
      else:
        shared_savings = 0
        if contract.risk_track == TWO_SIDED AND rate_bp <= -contract.min_loss_rate_bp:   # <= pinned
          uncapped = round_half_up(-gross * contract.shared_loss_rate_bp / 10000)
          cap = round_half_up(benchmark_cost_cents * contract.loss_cap_bp / 10000)
          shared_losses = min(uncapped, cap)
        else: shared_losses = 0
      Between MSR and -MLR is the zero corridor: neither savings nor losses.
    input_set: "benchmark_cost_cents and actual_cost_cents of the year (or interim estimates)"
    constants: {}
    precision: "each multiplication round_half_up to whole cents; min applied AFTER both sides rounded"

  - name: settlement_net
    trigger: "Settlement create/finalize/recalculate"
    algorithm: constraint_propagation
    formula: |
      evaluation order pinned (circular-looking otherwise):
      1. benchmark_cost_cents, actual_cost_cents, withhold_pool_cents (year rollups)
      2. shared_savings_cents, shared_losses_cents (shared_savings_and_loss)
      3. quality_composite_points -> quality_multiplier_bp (OFFICIAL variant)
      4. quality_adjusted_savings_cents = round_half_up(shared_savings_cents * multiplier_bp / 10000)
      5. withhold_released_cents = round_half_up(withhold_pool_cents * multiplier_bp / 10000)
      6. withhold_forfeited_cents = withhold_pool_cents - withhold_released_cents
      7. net_payable_cents = quality_adjusted_savings_cents + withhold_released_cents - shared_losses_cents
      8. undistributed_balance_cents = max(0, net_payable_cents) - sum(amount_cents of
         remittances in {SCHEDULED, APPROVED, PAID})
    input_set: "year rollups + LOCKED quality results + contract terms"
    constants: {}
    precision: "round_half_up at each step in the pinned order"

  - name: interim_estimate
    trigger: "InterimReport create"
    algorithm: forward_looking
    formula: |
      ytd = sum(paid_amount_cents of PAID claims of the year with paid_on <= clock date,
                member attributed per current LOCKED run)
      est_actual_annualization = round_half_up(ytd * 12 / months_elapsed)
      est_actual_completion = round_half_up(ytd * 1000 / COMPLETION_MILLI[months_elapsed])
      est_actual = annualization if contract.estimate_method == ANNUALIZATION else completion
      estimated gross/savings/losses via shared_savings_and_loss on (benchmark, est_actual)
      multiplier via quality_gate_multiplier on INTERIM composite
      est_net = round_half_up(shared_savings * mult / 10000) + round_half_up(ytd_pool * mult / 10000) - shared_losses
      reserve_accrual_cents = round_half_up(max(0, est_net) * months_elapsed / 12)
    input_set: "PAID claims with paid_on <= logical clock date; population of the LOCKED run; VALIDATED+LOCKED quality results"
    constants:
      COMPLETION_MILLI: { 1: 150, 2: 320, 3: 480, 4: 620, 5: 740, 6: 850, 7: 910, 8: 950, 9: 970, 10: 985, 11: 995 }
    precision: "round_half_up at each step"
    variants:
      - name: annualization
        when: "contract.estimate_method == ANNUALIZATION"
        difference: "YTD x 12 / months_elapsed; identical YTD data yields a different estimate than completion-factor"
      - name: completion_factor
        when: "contract.estimate_method == COMPLETION_FACTOR"
        difference: "YTD x 1000 / COMPLETION_MILLI[months_elapsed]"

  - name: distribution_allocation
    trigger: "Settlement authorize-distribution"
    algorithm: waterfall_allocation
    formula: |
      pool = max(0, net_payable_cents)
      practices = distinct practice_id over CONFIRMED records of the LOCKED run,
                  weighted by sum(member_months) per practice; W = total member months
      if pool == 0 OR W == 0: create no remittances
      else for each practice p:
        exact_p = pool * w_p / W
        amount_p = floor(exact_p)
      remainder = pool - sum(amount_p)          # 0 <= remainder < practice count
      distribute remainder as +1 cent per practice, ordered by fractional part
      (exact_p - amount_p) DESC; ties broken by Practice.created_at ASC
      (never by id); each practice receives at most one +1
    input_set: "CONFIRMED records of the LOCKED run; settlement.net_payable_cents"
    constants: {}
    precision: "floor per practice, then largest-remainder cents; conservation: sum(amount_p) == pool exactly"

  - name: renewal_recommendation
    trigger: "RenewalAnalysis complete"
    algorithm: threshold
    formula: |
      years = PerformanceYears of contract with year_status == CLOSED (>= 1 enforced at create)
      sum_bm = sum(benchmark_cost_cents); sum_act = sum(actual_cost_cents)
      realized_savings_rate_bp = trunc_toward_zero((sum_bm - sum_act) * 10000 / sum_bm)
      latest = CLOSED year with max year_label; earliest = min year_label
      quality_trend_points = composite(latest) - composite(earliest)   # OFFICIAL composite stored on each year's settlement
      risk_growth_milli = raf_milli(latest) - raf_milli(earliest)
      if realized_savings_rate_bp >= RENEW_MIN_SAVINGS_BP AND quality_trend_points >= -QUALITY_DROP_TOLERANCE:
        recommendation = RENEW_AS_IS
      elif realized_savings_rate_bp >= 0:
        recommendation = RENEW_RENEGOTIATE
      else:
        recommendation = DO_NOT_RENEW
    input_set: "CLOSED years of the contract; their settlements' stored composites and RAFs"
    constants:
      RENEW_MIN_SAVINGS_BP: 100
      QUALITY_DROP_TOLERANCE: 5
    precision: "rate truncated toward zero; comparisons >= pinned"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failing rule wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; X-User-Role names a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resource ids exist, validated left-to-right; body FK references exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 4, category: auth, check: "PracticeGroupRep scope: X-User-ID must equal the PracticeGroup id owning the targeted resource's contract", error_id: ERR_FORBIDDEN_GROUP_SCOPE, http_status: 403, applies_to: "settlement/dispute GET, dispute create/withdraw when caller role is PracticeGroupRep" }
  - { priority: 5, category: business_constraint, check: "Request shape: required fields present, no unknown fields, types valid, enum values in domain, scalar ranges (birth_year 1900..2026, score_milli 1..10000, months_elapsed 1..11)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 6, category: state, check: "Target resource is in a from-state of the invoked transition (ERR_INVALID_STATE_TRANSITION plus ERR_CONTRACT_NOT_ACTIVE, ERR_PROGRAM_NOT_ACTIVE, ERR_GROUP_NOT_ACTIVE, ERR_YEAR_NOT_OPEN, ERR_YEAR_LOCKED, ERR_YEAR_NOT_MEASURING, ERR_YEAR_NOT_RECONCILING, ERR_SETTLEMENT_NOT_FINAL, ERR_SETTLEMENT_STALE, ERR_SETTLEMENT_BEYOND_PROVISIONAL, ERR_SETTLEMENT_NOT_AUTHORIZED, ERR_SETTLEMENT_NOT_DISTRIBUTED, ERR_RUN_NOT_DRAFT, ERR_RUN_NOT_LOCKED, ERR_RUN_ALREADY_LOCKED, ERR_NO_LOCKED_ATTRIBUTION_RUN, ERR_CONTRACT_TERM_NOT_ENDED, ERR_RENEWAL_NOT_RECOMMENDED, ERR_PROGRAM_HAS_OPEN_CONTRACTS, ERR_GROUP_HAS_OPEN_CONTRACTS, ERR_YEARS_NOT_CLOSED, ERR_YEARS_IN_FLIGHT)", error_id: "state-family (see errors)", http_status: 409, applies_to: "all transition/action endpoints" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: dispute resolve X-User-ID != settlement.finalized_by_user_id (ERR_SEGREGATION_OF_DUTIES); risk-model pin: RiskScore.model_used == contract.risk_model (ERR_RISK_MODEL_MISMATCH)", error_id: "ERR_SEGREGATION_OF_DUTIES / ERR_RISK_MODEL_MISMATCH", http_status: 409, applies_to: "dispute resolve; risk-score create" }
  - { priority: 8, category: business_temporal, check: "Clock/window rules: dispute filing within finalized_on + DISPUTE_WINDOW_DAYS (ERR_DISPUTE_WINDOW_CLOSED); mark-settled/authorize only after it (ERR_DISPUTE_WINDOW_OPEN); resolve within filed_on + DISPUTE_RESOLUTION_DAYS (ERR_DISPUTE_RESOLUTION_WINDOW_ELAPSED); expire only after it (ERR_DISPUTE_NOT_EXPIRABLE); begin-reconciliation at/after period_end (ERR_MEASUREMENT_PERIOD_NOT_ENDED); finalize at/after period_end + RECONCILIATION_RUNOUT_DAYS (ERR_RECONCILIATION_RUNOUT_INCOMPLETE); year window inside contract term (ERR_YEAR_OUTSIDE_TERM); claim service_date inside year window (ERR_CLAIM_OUTSIDE_PERIOD)", error_id: "temporal-family (see errors)", http_status: 409, applies_to: "dated/windowed endpoints" }
  - { priority: 9, category: business_constraint, check: "Overlap rules: PerformanceYear half-open windows of one contract must not intersect (ERR_PERIOD_OVERLAP; adjacency allowed: new.start >= existing.end or new.end <= existing.start passes); EligibilitySpan closed intervals of one member must not share any calendar date (ERR_SPAN_OVERLAP; sharing one date IS overlap)", error_id: "ERR_PERIOD_OVERLAP / ERR_SPAN_OVERLAP", http_status: 409, applies_to: "performance-year create; eligibility-span create" }
  - { priority: 10, category: business_referential, check: "Cross-references: attribution record practice belongs to the contract's group (ERR_PRACTICE_GROUP_MISMATCH) and is ACTIVE (ERR_PRACTICE_INACTIVE); member belongs to contract's program (ERR_MEMBER_PROGRAM_MISMATCH), is ELIGIBLE (ERR_MEMBER_DISENROLLED), has >= 1 mid-month-eligible month in the year (ERR_MEMBER_NO_ELIGIBLE_MONTHS)", error_id: "referential-family (see errors)", http_status: 409, applies_to: "attribution-record create; dispute create" }
  - { priority: 11, category: business_constraint, check: "Uniqueness: tin (ERR_DUPLICATE_TIN); npi (ERR_DUPLICATE_NPI); member_ref per program (ERR_DUPLICATE_MEMBER_REF); contract_ref per program (ERR_DUPLICATE_CONTRACT_REF); year_label per contract (ERR_DUPLICATE_YEAR_LABEL); claim_ref per year (ERR_DUPLICATE_CLAIM_REF); one non-SUPERSEDED RiskScore per (member, year, model_used) (ERR_DUPLICATE_RISK_SCORE); one non-EXCLUDED QualityMeasureResult per (year, measure_code) (ERR_DUPLICATE_MEASURE_RESULT); one non-VOID Settlement per year (ERR_SETTLEMENT_EXISTS); measure_code in contract catalog (ERR_UNKNOWN_MEASURE_CODE)", error_id: "uniqueness-family (see errors)", http_status: 409, applies_to: "create endpoints" }
  - { priority: 12, category: business_fiscal, check: "Amount/rate sanity: benchmark_pmpm_cents > 0; rates in 0..10000; TWO_SIDED requires shared_loss_rate_bp and loss_cap_bp; quality_gate_floor_points < quality_gate_excellence_points both 0..100; quality_measures weights > 0 with exactly 9 strictly ascending decile thresholds (all ERR_INVALID_RATE_CONFIG); paid_amount_cents > 0 and claimed_adjustment_cents > 0 (ERR_INVALID_AMOUNT); start < end date ranges (ERR_INVALID_DATE_RANGE)", error_id: "fiscal-family (see errors)", http_status: 422, applies_to: "create endpoints" }
  - { priority: 13, category: business_constraint, check: "Quality math guards: numerator_count <= denominator_count (ERR_NUMERATOR_EXCEEDS_DENOMINATOR); validate requires denominator_count >= 1 (ERR_EMPTY_DENOMINATOR); begin-reconciliation requires total_member_months > 0 (ERR_EMPTY_POPULATION)", error_id: "quality-family (see errors)", http_status: 422, applies_to: "quality create/validate; begin-reconciliation" }
  - { priority: 14, category: state, check: "OCC: expected_<parent>_version equals the parent's current version on guarded creates", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /vbc/performance-years/{id}/attribution-runs; POST /vbc/interim-reports; POST /vbc/contracts/{id}/renewal-analyses" }

