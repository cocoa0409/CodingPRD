          assert:
            - "HTTP 409 with data.error_id == ERR_IMMINENT_HEALTH_HAZARD, not ERR_WATER_NOT_IN_RANGE"
            - "WaterChemistryReading.${rd_id}.compliance_status == IMMINENT_HAZARD and triggered_closure_order_id == null (an order was already open, so no second order was created)"
            - "GET /closure-orders?facility_id=${fac_id} returns exactly one row"
            - "ClosureOrder.${co_id}.status == REOPEN_REQUESTED"

  - section: endpoints
    instances:

      - name: patch_facility_recomputes_derived_fields_and_bumps_version
        claim_type: Standard CRUD
        grounds:
          - "endpoints.PATCH_/facilities/{id}"
          - calculations.facility_classification_derivation
          - entities.Facility.fields.required_signage_types
        distinguishing_aspect: "Shrinking surface_area_sqft from 1200 to 600 drops max_bather_load to 30, flips lifeguard_required to false, appends NO_LIFEGUARD_WARNING to required_signage_types and increments Facility.version by exactly 1."
        test_recipe:
          setup: ["A CLASS_B_PUBLIC pool of 1200 sqft exists with version 1."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
