            - call: "POST /monitoring-windows"
              payload: { deployment_id: "${d1_id}", model_version_id: "${v1_id}", window_kind: "PERFORMANCE", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T12:00:00Z", prediction_count: 10000, labeled_prediction_count: 10000, correct_labeled_count: 8800, positive_rate: 0.30, p95_latency_ms: 200, observed_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20] }
              as: ReliabilityEngineer
