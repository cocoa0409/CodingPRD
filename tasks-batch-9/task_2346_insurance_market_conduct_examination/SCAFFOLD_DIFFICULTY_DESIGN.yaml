            - "Insurer CEDAR: 30000 policies, 60 complaints (ratio 2.00 -> MODERATE), financial_stress_score 40, consumer_trend_score 30, annual_premium_written_cents 800000000 -> composite 34.00; it is the only insurer in the register."
