- section: consistency_model
  instances:
  - name: every_cascaded_write_is_visible_in_the_response_that_caused_it
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - state_machines.Lead[CLEARED -> QUOTED]
    - state_machines.Lead[QUOTED -> WON]
    - entities.InventoryDay.fields.held_group_rooms
    - entities.RateQuote.fields.hold_placed
    distinguishing_aspect: |
      An immediate consistency model forbids any lag between a write and its derived reads, so this instance never re-reads to give the server a second chance: the propose response ITSELF must already carry hold_placed true, and the very next inventory read must already show the hold on all three nights. The accept leg then does the same for a four-hop cascade — the sibling quote is WITHDRAWN and its hold released by the time the accept response returns.
