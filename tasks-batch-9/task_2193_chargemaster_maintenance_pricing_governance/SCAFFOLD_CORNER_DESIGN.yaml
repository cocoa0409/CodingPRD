              as_user_id: "ria_1"
              captures: { e1_deferred: $.data.status, e1_reason: $.data.defer_reason }
            - call: "POST /chargemaster/code-update-entries/${e1}/disposition"
              payload: { action: "MAP" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { e_entry_state: $.data.error_id }
            - call: "POST /chargemaster/code-update-entries/${e2}/disposition"
              payload: { action: "DEFER", defer_reason: "Ambiguous target pending CDM cleanup" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { e2_deferred: $.data.status, e2_reason: $.data.defer_reason }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/lifecycle"
              payload: { action: "APPROVE_CROSSWALK" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { e_nomapped: $.data.error_id }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { e_from_mapping: $.data.error_id }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/lifecycle"
              payload: { action: "CANCEL" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { cancelled: $.data.status, applied0: $.data.applied_entry_count }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/lifecycle"
              payload: { action: "START_MAPPING" }
