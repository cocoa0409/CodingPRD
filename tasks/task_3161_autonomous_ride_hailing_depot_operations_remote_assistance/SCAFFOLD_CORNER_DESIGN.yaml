  - section: rbac
    instances:
      - name: if_match_depot_technician_cannot_create_territory
        claim_type: Violation to Error
        grounds:
          - roles.DepotTechnician.exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Territory creation is TerritoryPlanner-exclusive: a DepotTechnician calling it is rejected with ERR_UNAUTHORIZED, while the same body from a TerritoryPlanner creates the territory."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. Empty database; a DepotTechnician identity and a TerritoryPlanner identity are both available."]
          setup_api_calls:
            - *c_clock
          trigger:
