      - name: the_cumulative_lot_footprint_threshold_admits_the_exact_fit_and_frees_it_on_release
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.lot_capacity_charge
          - errors[ERR_LOT_CAPACITY_EXCEEDED]
          - state_machines.RideAllocation
        distinguishing_aspect: |
          The cumulative-threshold layer at its exact boundary, then reset: a lot engineered to
          floor(9200 * 80 / 100) - ceil(42 * 0.5) = 7360 - 21 = 7339 usable sqft is filled to precisely 7339 by
          two units (5414 + 1925) and admits both, because the gate uses <=. An eleven-sqft tea-cup ride is then
          one sqft too much and raises ERR_LOT_CAPACITY_EXCEEDED. Releasing the kiddie unit returns the ledger to
          5414 — RELEASED allocations leave the input set — and the identical tea-cup reservation is then
          admitted, so the threshold is genuinely cumulative rather than a high-water mark.
