            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Shape Sorter", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 6, retail_value_cents: 4000, replacement_value_cents: 3000 }
              as: PlatformAdmin
