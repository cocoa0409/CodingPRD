              captures: { e2: $.data.id }
            - call: "POST /field-force/call-plans"
              payload: { territory_id: "${t_id}", cycle_label: "2026-Q4", expected_territory_version: "${t_v}" }
              as: DistrictManager
              captures: { plan_id: $.data.id }
            - call: "POST /field-force/call-plans/${plan_id}/publish"
              payload: {}
              as: DistrictManager
              as_user_id: "${rep_id}"
            - call: "POST /field-force/call-visits"
