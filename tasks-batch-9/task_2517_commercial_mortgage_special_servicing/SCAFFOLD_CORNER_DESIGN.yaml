              payload: { loan_id: "${loan_id}", advance_type: "PI_ADVANCE", amount_usd: 60000, advanced_on: "2026-07-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_id: "$.data.id" }
            - call: "GET /special-servicing/distribution-reports/${report_id}"
              as: Trustee
              as_user_id: "trustee-001"
              captures: { snap_advances_after: "$.data.total_advances_outstanding_snapshot_usd" }
            - call: "POST /special-servicing/distribution-reports/${report_id}/status"
              payload: { to_status: "CERTIFIED" }
              as: Trustee
              as_user_id: "trustee-001"
              captures: { certified_status: "$.data.status", certifier: "$.data.certified_by_user_id" }
            - call: "POST /special-servicing/distribution-reports/${report_id}/status"
              payload: { to_status: "DISTRIBUTED", recipients: [] }
              as: Trustee
              as_user_id: "trustee-001"
              captures: { empty_recipients_error: "$.data.error_id" }
            - call: "POST /special-servicing/distribution-reports/${report_id}/status"
              payload: { to_status: "DISTRIBUTED", recipients: ["TRUSTEE", "RATING_AGENCIES", "CERTIFICATE_HOLDERS"] }
              as: Trustee
              as_user_id: "trustee-001"
              captures: { distributed_status: "$.data.status", distributed_at: "$.data.distributed_at", recipients_out: "$.data.recipients" }
            - call: "GET /special-servicing/distribution-reports"
              payload: { trust_id: "${trust_id}", status: "DISTRIBUTED" }
              as: ControllingClassRepresentative
              as_user_id: "${trust_id}"
              captures: { listed_report_id: "$.data[0].id" }
          assert:
            - "The report is created in status DRAFT with loans_in_special_count 1, total_ara_snapshot_usd 0.00, total_advances_outstanding_snapshot_usd 0.00, realized_loss_snapshot_usd 0.00 and control_status_snapshot CONTROLLING"
            - "After the 60,000.00 advance, Trust.total_advances_outstanding_usd == 60000.00 but the report still reports total_advances_outstanding_snapshot_usd == 0.00 — the snapshot is frozen"
            - "CERTIFIED stamps certified_by_user_id 'trustee-001' and leaves every snapshot untouched"
