  # ===========================================================================
  - section: endpoints
    instances:
      - name: c_envelope_shape_on_success_and_error
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every response wraps data in the fixed envelope: meta.api_request_id + meta.api_request_timestamp present; response_type 'object' for single GET and 'error' with data.error_id on failures."
        test_recipe:
          setup: ["one site"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
          trigger:
            - { call: "GET /sites/${site_id}", as: PlatformAdmin }
            - call: "GET /sites/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "success: response_type == 'object', meta.api_request_id present, meta.api_request_timestamp present, data.id == ${site_id}"
            - "error: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message present, meta block present"

