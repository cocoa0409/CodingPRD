          The conflicting pair is category state (priority 34) versus category business_fiscal
          (priority 90) on POST /pip/capital-budgets/{id}/lock: a DRAFT budget that also carries
          a 730000-cent funding gap must answer ERR_BUDGET_NOT_LOCKABLE, and only after approval
          does the same call answer ERR_BUDGET_UNDERFUNDED.
