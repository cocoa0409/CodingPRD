          - validations.priority_63
          - endpoints.POST_/gmp-proposals/{id}/submit
        distinguishing_aspect: |
          Submit is NOT idempotent here: replaying it against a proposal already in OWNER_REVIEW
          must fail loudly rather than silently return 200. A tolerant implementation that
          re-runs the transition would bump revision_count and re-fire the project-axis side
          effect, so the assertion pins the project version to the value it had after the
          first submit.
