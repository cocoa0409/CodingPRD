        distinguishing_aspect: "Submit carrying a stale expected_contract_version (one less than current after a version-create bumped it) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["DRAFT contract; client observed contract.version at create time, then a new version bumped it."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org", risk_appetite_threshold: 200 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0 }
