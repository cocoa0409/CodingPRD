# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3119_ultra_cold_vaccine_distribution_thaw_window_management
#
# Every instance grounds in an element declared in SCAFFOLD.yaml §1.1–§1.7.
# Anchored base fixture (defined once, reused):
#   clock 2026-09-01T00:00:00Z, one FIXED_QUANTITY program (20 weekly cartons,
#   reservable 0.5 -> computed_cartons 10), one 12-carton batch, one ULTRA_COLD
#   site with a PASSED uber-cold freezer certificate, one accepted 2-carton order,
#   one shipper sealed and delivered with the carton back in ultra-cold.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: dose_accountability_interim_vs_certified
        grounds:
          - calculations.dose_accountability_variants
          - entities.ReportingPeriod.fields.accounted_doses
          - endpoints.POST_/reporting-periods/{id}/submit
          - endpoints.GET_/reporting-periods/{id}/accountability
        distinguishing_aspect: "For one identical period containing a single open excursion, the INTERIM variant counts the full WASTE ledger quantity while the CERTIFIED variant counts only certified_lost_doses, so accounted_doses differs by exactly 585 doses on the same data."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One product, one program, one 12-carton batch released, one window opened with a 10-carton entitlement, one site with a PASSED freezer certificate, one accepted 2-carton order dispatched and delivered so carton C-01 carries a RELEASE entry of 2340 doses and is back in ULTRA_COLD at the site."
            - "Reporting period [2026-09-01T00:00:00Z, 2026-09-08T00:00:00Z) open on the program. Carton C-01 is then thawed and an excursion is reported on it with min_temperature_c -65 so the evaluator classifies it SEVERE_COLD, giving certified_lost_doses == 117 already at adjudication time; the excursion is reviewed, adjudicated NOT_USABLE while still UNDER_REVIEW, and the adjudication is then reopened by an accepted appeal, which moves the 2340-dose WASTE entry to RECONCILED so it contributes nothing to the interim count while the certified count still carries the 117 certified doses."
          setup_api_calls:
            - &c_clock
              call: "POST /vaccine-distribution/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_prod
              call: "POST /vaccine-distribution/product-configurations"
              payload: { product_code: "PZ-UCV-2026", presentation: "MULTI_DOSE_VIAL", doses_per_vial: 6, vials_per_carton: 195, min_order_cartons: 1, ultra_cold_min_c: -90, ultra_cold_max_c: -60, refrigerated_min_c: 2, refrigerated_max_c: 8, thaw_stability_hours: 120, refrigerated_shelf_life_hours: 720, excursion_tolerance_min_c: -50, excursion_max_single_breach_minutes: 180, excursion_max_cumulative_minutes: 360, refreeze_prohibited: true, punctured_bud_hours: 6, wastage_threshold_pct: 0.05 }
              as: ManufacturingQA
              captures: { prod_id: "$.data.id" }
            - &c_prog
              call: "POST /vaccine-distribution/jurisdiction-programs"
              payload: { jurisdiction_code: "MI", regulatory_body: "MI Department of Health", allocation_basis: "FIXED_QUANTITY", fixed_weekly_cartons: 20, weekly_allocation_cap_cartons: 20, min_order_cartons: 2, reservable_carton_pct: 0.5, acceptance_window_hours: 48, shipping_days: ["MONDAY", "WEDNESDAY", "FRIDAY"], shipping_cutoff_utc: "14:00:00", quarantine_on_review: true, adjudication_sla_hours: 72, segment_rule: "TIE_CONTINUE", reporting_period_days: 30 }
              as: RegulatoryAffairsOfficer
              captures: { prog_id: "$.data.id" }
            - &c_batch
              call: "POST /vaccine-distribution/allocation-batches"
              payload: { batch_code: "UCV-BATCH-0001", product_configuration_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", released_cartons: 12, release_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z" }
              as: ManufacturingQA
              captures: { batch_id: "$.data.id" }
            - &c_cartons
              call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-01", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c01: "$.data.id" }
            - &c_release
              call: "POST /vaccine-distribution/allocation-batches/${batch_id}/release"
              payload: {}
              as: ManufacturingQA
            - &c_win
              call: "POST /vaccine-distribution/allocation-windows"
              payload: { allocation_batch_id: "${batch_id}", jurisdiction_program_id: "${prog_id}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-03T00:00:00Z" }
              as: DistributionPlanner
              captures: { win_id: "$.data.id", win_v0: "$.data.version" }
            - &c_open
              call: "POST /vaccine-distribution/allocation-windows/${win_id}/open"
              payload: { expected_allocation_window_version: "${win_v0}" }
              as: DistributionPlanner
              captures: { win_v: "$.data.version" }
            - &c_ent
              call: "GET /vaccine-distribution/allocation-windows/${win_id}/entitlements"
              payload: {}
              as: DistributionPlanner
              captures: { ent_id: "$.data[0].id" }
            - &c_site
              call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-01", site_name: "Riverbend Clinic", jurisdiction_program_id: "${prog_id}", storage_capability: "ULTRA_COLD", ultra_cold_capacity_cartons: 10, refrigerated_capacity_cartons: 10, cold_chain_equipment_type: "ULTRA_COLD_FREEZER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 3000 }
              as: DistributionPlanner
              captures: { site_id: "$.data.id" }
            - &c_verify
              call: "POST /vaccine-distribution/site-equipment-verifications"
              payload: { storage_site_id: "${site_id}", equipment_type: "ULTRA_COLD_FREEZER", certificate_number: "CERT-MI-0001", certificate_expires_at: "2027-01-01T00:00:00Z", verified_at: "2026-09-01T00:00:00Z", outcome: "PASSED" }
              as: ColdChainReviewer
            - &c_order
              call: "POST /vaccine-distribution/site-orders"
              payload: { allocation_entitlement_id: "${ent_id}", storage_site_id: "${site_id}", requested_cartons: 2, requested_doses: 1000 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { order_id: "$.data.id" }
            - &c_submit
              call: "POST /vaccine-distribution/site-orders/${order_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - &c_accept
              call: "POST /vaccine-distribution/site-orders/${order_id}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
            - &c_disp
              call: "POST /vaccine-distribution/dispatches"
              payload: { site_order_id: "${order_id}", storage_site_id: "${site_id}", entry_route: "DIRECT_ULTRA_COLD" }
              as: LogisticsOperator
              captures: { disp_id: "$.data.id" }
            - &c_pack
              call: "POST /vaccine-distribution/dispatches/${disp_id}/pack"
              payload: {}
              as: LogisticsOperator
            - &c_shipper
              call: "POST /vaccine-distribution/shippers"
              payload: { dispatch_order_id: "${disp_id}", shipper_serial: "SH-0001", dry_ice_kg: 20, packing_started_at: "2026-09-01T00:00:00Z", logger_serial: "LG-0001" }
              as: LogisticsOperator
              captures: { ship_id: "$.data.id" }
            - &c_attach
              call: "POST /vaccine-distribution/shippers/${ship_id}/attach-carton"
              payload: { carton_id: "${c01}" }
              as: LogisticsOperator
            - &c_readings
              call: "POST /vaccine-distribution/logger-readings"
              payload: { cold_chain_shipper_id: "${ship_id}", recorded_at: "2026-09-01T01:00:00Z", temperature_c: -75, source: "LOGGER" }
              as: LogisticsOperator
            - &c_read_delivered
              call: "POST /vaccine-distribution/logger-readings"
              payload: { cold_chain_shipper_id: "${ship_id}", recorded_at: "2026-09-01T06:05:00Z", temperature_c: -74, source: "LOGGER" }
              as: LogisticsOperator
            - &c_ship_v
              call: "GET /vaccine-distribution/shippers/${ship_id}"
              payload: {}
              as: ColdChainReviewer
              captures: { ship_v: "$.data.version" }
            - &c_seal
              call: "POST /vaccine-distribution/shippers/${ship_id}/seal"
              payload: { expected_shipper_version: "${ship_v}" }
              as: LogisticsOperator
            - &c_dispatch
              call: "POST /vaccine-distribution/dispatches/${disp_id}/dispatch"
              payload: {}
              as: LogisticsOperator
            - &c_deliver
              call: "POST /vaccine-distribution/dispatches/${disp_id}/deliver"
              payload: { arrived_at: "2026-09-01T06:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - &c_period
              call: "POST /vaccine-distribution/reporting-periods"
              payload: { jurisdiction_program_id: "${prog_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z" }
              as: RegulatoryAffairsOfficer
              captures: { period_id: "$.data.id" }
            - &c_exc_doselevel
              call: "POST /vaccine-distribution/temperature-excursions"
              payload: { carton_id: "${c01}", storage_site_id: "${site_id}", first_breach_at: "2026-09-01T07:00:00Z", last_breach_at: "2026-09-01T09:00:00Z", min_temperature_c: -65, reported_at: "2026-09-01T10:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { exc_id: "$.data.id" }
            - &c_exc_review
              call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/review"
              payload: {}
              as: ColdChainReviewer
            - &c_exc_adjudicate
              call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/adjudicate"
              payload: { outcome: "NOT_USABLE", rationale: "Sustained cold breach below the excursion tolerance band." }
              as: MedicalScienceLiaison
            - &c_appeal
              call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/appeals"
              payload: { filed_by_user_id: "coord-lena", filed_at: "2026-09-01T11:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { appeal_id: "$.data.id" }
            - &c_appeal_accept
              call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/appeals/${appeal_id}/accept"
              payload: {}
              as: RegulatoryAffairsOfficer
          trigger:
            - call: "GET /vaccine-distribution/reporting-periods/${period_id}/accountability"
              payload: { variant: "INTERIM" }
              as: RegulatoryAffairsOfficer
              captures: { interim_accounted: "$.data.accounted_doses" }
            - call: "GET /vaccine-distribution/reporting-periods/${period_id}/accountability"
              payload: { variant: "CERTIFIED" }
              as: RegulatoryAffairsOfficer
              captures: { certified_accounted: "$.data.accounted_doses" }
          assert:
            - "the INTERIM read reports accounted_doses == 14040"
            - "the CERTIFIED read reports accounted_doses == 13455"
            - "certified_accounted == interim_accounted - 585"
            - "ReportingPeriod.${period_id}.status is still OPEN because the period was never submitted"

      - name: beyond_use_wallclock_vs_effective_recovery
        grounds:
          - calculations.governing_beyond_use_date
          - calculations.cure_time_after_excursion
          - entities.Carton.fields.current_expires_at
          - endpoints.POST_/temperature-excursions/{id}/adjudicate
        distinguishing_aspect: "The same carton's current_expires_at moves LATER by exactly the recovered hours once a USABLE adjudication exists, so the effective variant and the wall-clock variant disagree on the carton's expiry instant while every physical fact is unchanged."
        test_recipe:
          setup:
            - "The anchored base fixture, with carton C-01 thawed at 2026-09-01T08:00:00Z so its current_expires_at is 2026-09-06T08:00:00Z (thawed_at plus min(120, 720) hours)."
            - "One excursion on C-01 spanning exactly 60 minutes, in the tolerance band, reviewed and adjudicated USABLE."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - *c_accept
            - *c_disp
            - *c_pack
            - *c_shipper
            - *c_attach
            - *c_readings
            - *c_read_delivered
            - *c_ship_v
            - *c_seal
            - *c_dispatch
            - *c_deliver
            - &c_clock_thaw
              call: "POST /vaccine-distribution/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: PlatformAdmin
            - &c_thaw
              call: "POST /vaccine-distribution/cartons/${c01}/thaw"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { c01_expires_before: "$.data.current_expires_at" }
            - &c_exc_inband
              call: "POST /vaccine-distribution/temperature-excursions"
              payload: { carton_id: "${c01}", storage_site_id: "${site_id}", first_breach_at: "2026-09-01T09:00:00Z", last_breach_at: "2026-09-01T10:00:00Z", min_temperature_c: -55, reported_at: "2026-09-01T10:05:00Z" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { exc_id: "$.data.id" }
            - call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/review"
              payload: {}
              as: ColdChainReviewer
          trigger:
            - call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/adjudicate"
              payload: { outcome: "USABLE", rationale: "Breach stayed inside the excursion tolerance band for sixty minutes." }
              as: MedicalScienceLiaison
              captures: { exc_v: "$.data.version" }
            - call: "GET /vaccine-distribution/cartons/${c01}"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { c01_expires_after: "$.data.current_expires_at" }
          assert:
            - "Carton.${c01}.current_expires_at was 2026-09-06T08:00:00Z before the adjudication"
            - "Carton.${c01}.current_expires_at is 2026-09-07T08:00:00Z after the USABLE adjudication"
            - "the recovery is exactly the 24-hour floor of the certified 60-minute breach, so the two variants differ by 86400 seconds"
            - "Carton.${c01}.temperature_state is still THAWED and thawed_at is unchanged at 2026-09-01T08:00:00Z"

  - rule_id: combinatorial_formula
    instances:

      - name: additive_seven_bucket_waterfall_carton_need
        grounds:
          - calculations.carton_rounding_waterfall
          - entities.SiteOrder.fields.rounded_from_doses
          - endpoints.POST_/site-orders/{id}/accept
        distinguishing_aspect: "The seven ordered buckets are additive rather than a waterfall with a remaining pool, so requested_doses 1000 rounds to a different carton count than a plain ceiling of 1000/1170 would give, and the minimum-order uplift is taken BEFORE any earlier rejection is netted."
        test_recipe:
          setup:
            - "The anchored base fixture, with the order still SUBMITTED and the entitlement holding 10 available cartons."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
          trigger:
            - call: "POST /vaccine-distribution/site-orders/${order_id}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
              captures: { order_v: "$.data.version" }
          assert:
            - "SiteOrder.${order_id}.rounded_from_doses == 1"
            - "SiteOrder.${order_id}.min_order_shortfall_cartons == 1 because the program minimum is 2 and the rounded need is 1"
            - "SiteOrder.${order_id}.accepted_cartons == 2 and SiteOrder.${order_id}.accepted_doses == 2340"
            - "SiteOrder.${order_id}.materialization_variance_doses == 1340"
            - "AllocationEntitlement.${ent_id}.available_cartons == 8"

      - name: holdback_rounding_and_pack_ceiling_on_rejection
        grounds:
          - calculations.jurisdiction_allocation_waterfall
          - calculations.carton_rounding_waterfall
          - entities.AllocationEntitlement.fields.computed_cartons
          - endpoints.POST_/site-orders/{id}/accept
        distinguishing_aspect: "The hold-back rounds an exact-integer product DOWN and any fractional product UP, so a derived carton count built by the same code path is not the natural integer rounding; the re-acceptance pack ceiling then preserves the already-taken rejection by adding it back before the ceiling division."
        test_recipe:
          setup:
            - "The anchored base fixture. The window opened from a FIXED_QUANTITY program with 20 weekly cartons and reservable_carton_pct 0.5, so the entitlement's computed_cartons is 10."
            - "A second program exists with fixed_weekly_cartons 5 and reservable_carton_pct 0.5, whose entitlement is computed by a separate window."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - call: "POST /vaccine-distribution/jurisdiction-programs"
              payload: { jurisdiction_code: "OH", regulatory_body: "Ohio Department of Health", allocation_basis: "FIXED_QUANTITY", fixed_weekly_cartons: 5, weekly_allocation_cap_cartons: 5, min_order_cartons: 2, reservable_carton_pct: 0.5, acceptance_window_hours: 48, shipping_days: ["MONDAY"], shipping_cutoff_utc: "09:00:00", quarantine_on_review: false, adjudication_sla_hours: 24, segment_rule: "STOP", reporting_period_days: 30 }
              as: RegulatoryAffairsOfficer
              captures: { prog_oh_id: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-windows"
              payload: { allocation_batch_id: "${batch_id}", jurisdiction_program_id: "${prog_oh_id}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-03T00:00:00Z" }
              as: DistributionPlanner
              captures: { win_oh_id: "$.data.id", win_oh_v0: "$.data.version" }
            - call: "POST /vaccine-distribution/allocation-windows/${win_oh_id}/open"
              payload: { expected_allocation_window_version: "${win_oh_v0}" }
              as: DistributionPlanner
          trigger:
            - call: "POST /vaccine-distribution/site-orders/${order_id}/accept"
              payload: { accepted_cartons: 3, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
              captures: { order_v: "$.data.version" }
            - call: "POST /vaccine-distribution/site-orders/${order_id}/accept"
              payload: { accepted_cartons: 1, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
          assert:
            - "AllocationEntitlement.${ent_id}.computed_cartons == 10 for the MI program"
            - "the OH program's entitlement from GET /allocation-windows/${win_oh_id}/entitlements has computed_cartons == 3"
            - "the second accept succeeds with SiteOrder.${order_id}.accepted_cartons == 1"
            - "SiteOrder.${order_id}.rejected_cartons == 2 after the two acceptances"
            - "AllocationEntitlement.${ent_id}.available_cartons == 7"

  - rule_id: non_linear_state_machine
    instances:

      - name: carton_two_independent_axes_with_compound_grade_and_cycle
        grounds:
          - state_machines.Carton.transitions.MI_ULTRA_COLD_to_THAWED
          - state_machines.Carton.transitions.REFRIGERATED_to_THAWED
          - state_machines.Carton.transitions.REFRIGERATED_to_PUNCTURED
          - state_machines.SiteTransfer.transitions.APPROVED_to_DISPATCHED
          - entities.Carton.fields.temperature_state
        distinguishing_aspect: "The Carton machine carries two independent axes on one row — a temperature dimension (ULTRA_COLD / THAWED / REFRIGERATED / PUNCTURED) and a custody dimension (IN_TRANSIT / PALLET_STAGED) — and both a revert edge back into THAWED and a self-loop on PUNCTURED exist, so the machine is cyclic and parallel rather than a pipeline."
        test_recipe:
          setup:
            - "The anchored base fixture, with carton C-01 back in ULTRA_COLD at MI-RIV-01 and carton C-02 registered on the same batch. MI-RIV-01 freezer certificate expires 2027-01-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-02", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c02: "$.data.id" }
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - *c_accept
            - *c_disp
            - *c_pack
            - *c_shipper
            - *c_attach
            - *c_readings
            - *c_read_delivered
            - *c_ship_v
            - *c_seal
            - *c_dispatch
            - *c_deliver
            - call: "POST /vaccine-distribution/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vaccine-distribution/cartons/${c01}/thaw"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /vaccine-distribution/dose-ledger-entries"
              payload: { carton_id: "${c01}", entry_type: "ADMINISTER", quantity_doses: 60, occurred_at: "2026-09-01T09:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { adm_id: "$.data.id" }
            - call: "POST /vaccine-distribution/cartons/${c01}/puncture"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { c01_punctured: "$.data.temperature_state" }
            - call: "POST /vaccine-distribution/cartons/${c01}/puncture"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { re_puncture_error: "$.data.error_id" }
            - call: "POST /vaccine-distribution/site-transfers"
              payload: { from_site_id: "${site_id}", to_site_id: "${site2_id}", carton_id: "${c02}", requested_at: "2026-09-01T10:00:00Z" }
              as: DistributionPlanner
              captures: { tr_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-transfers/${tr_id}/approve"
              payload: {}
              as: DistributionPlanner
            - call: "POST /vaccine-distribution/site-transfers/${tr_id}/dispatch"
              payload: {}
              as: LogisticsOperator
              captures: { c02_custody: "$.data.status" }
          assert:
            - "the first puncture moves TemperatureState to PUNCTURED and the second is refused with error_id == ERR_ALREADY_PUNCTURED"
            - "Carton.${c01}.current_expires_at is tightened to 2026-09-01T15:00:00Z, exactly punctured_at plus punctured_bud_hours of 6"
            - "Carton.${c02}.temperature_state == IN_TRANSIT while Carton.${c02}'s custody moves independently of its temperature axis"
            - "SiteTransfer.${tr_id}.status == DISPATCHED and Carton.${c02}.thawed_at is still null"

      - name: excursion_cyclic_reopen_and_adjudication_revision_loop
        grounds:
          - state_machines.TemperatureExcursion.transitions.ADJUDICATED_to_UNDER_REVIEW
          - state_machines.TemperatureExcursion.transitions.REPORTED_to_UNDER_REVIEW
          - state_machines.ExcursionAdjudication.transitions.APPEALED_to_SUPERSEDED
          - state_machines.WastageReport.transitions.RECONCILED_to_OPEN
          - entities.TemperatureExcursion.fields.current_resolution_trace_id
        distinguishing_aspect: "The excursion machine cycles ADJUDICATED → UNDER_REVIEW → ADJUDICATED while the adjudication machine cycles DECIDED → APPEALED → SUPERSEDED, and the wastage report is pulled back from RECONCILED to OPEN by the reversal — three cycles on three entities, none of them a forward pipeline."
        test_recipe:
          setup:
            - "The anchored base fixture, with carton C-01 thawed at 2026-09-01T08:00:00Z and one excursion reported on it with min_temperature_c -55 inside the tolerance band."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - *c_accept
            - *c_disp
            - *c_pack
            - *c_shipper
            - *c_attach
            - *c_readings
            - *c_read_delivered
            - *c_ship_v
            - *c_seal
            - *c_dispatch
            - *c_deliver
            - &c_thaw_base
              call: "POST /vaccine-distribution/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: PlatformAdmin
            - &c_thaw_call
              call: "POST /vaccine-distribution/cartons/${c01}/thaw"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - &c_exc_base
              call: "POST /vaccine-distribution/temperature-excursions"
              payload: { carton_id: "${c01}", storage_site_id: "${site_id}", first_breach_at: "2026-09-01T09:00:00Z", last_breach_at: "2026-09-01T10:00:00Z", min_temperature_c: -55, reported_at: "2026-09-01T10:05:00Z" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { exc_id: "$.data.id" }
            - call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/review"
              payload: {}
              as: ColdChainReviewer
            - call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/adjudicate"
              payload: { outcome: "NOT_USABLE", rationale: "Product held above the refrigerated range." }
              as: MedicalScienceLiaison
              captures: { adj_id: "$.data.id" }
          trigger:
            - call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/appeals"
              payload: { filed_by_user_id: "coord-lena", filed_at: "2026-09-01T11:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { appeal_id: "$.data.id" }
            - call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/appeals/${appeal_id}/accept"
              payload: {}
              as: RegulatoryAffairsOfficer
              captures: { reopened_status: "$.data.adjudication_status" }
            - call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/review"
              payload: {}
              as: ColdChainReviewer
            - call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/adjudicate"
              payload: { outcome: "USABLE", rationale: "Second review found the breach inside tolerance." }
              as: MedicalScienceLiaison
              captures: { second_adj_id: "$.data.id" }
          assert:
            - "the appeal accept leaves review_status UNDER_REVIEW with adjudication_status PENDING and adjudicated_at null"
            - "the second adjudication is accepted and the first adjudication's status becomes SUPERSEDED with prior_outcome NOT_USABLE"
            - "TemperatureExcursion.${exc_id}.current_resolution_trace_id == ${second_adj_id}"
            - "the first adjudication's WASTE entry has status RECONCILED after the reversal, and the second adjudication leaves Carton.${c01}.temperature_state == THAWED"

  - rule_id: transitive_cascade
    instances:

      - name: batch_recall_destroys_cartons_and_lapses_entitlement
        grounds:
          - state_machines.AllocationBatch.transitions.ALLOCATED_to_RECALLED
          - state_machines.Carton.transitions.REFRIGERATED_to_DESTROYED
          - state_machines.AllocationEntitlement.transitions.PARTIALLY_ACCEPTED_to_LAPSED
          - state_machines.JurisdictionProgram.transitions
          - endpoints.POST_/allocation-batches/{id}/recall
        distinguishing_aspect: "The recall on AllocationBatch propagates three hops — cartons become DESTROYED with a DESTROY ledger entry, the entitlement available to that batch lapses, and the program's released_cartons_to_date changes — so the third hop is caused by the second, not by the recall itself."
        test_recipe:
          setup:
            - "The anchored base fixture with the entitlement in PARTIALLY_ACCEPTED, carton C-01 back in ultra-cold at the site and 8 cartons still available on the entitlement."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - *c_accept
            - *c_disp
            - *c_pack
            - *c_shipper
            - *c_attach
            - *c_readings
            - *c_read_delivered
            - *c_ship_v
            - *c_seal
            - *c_dispatch
            - *c_deliver
            - call: "GET /vaccine-distribution/jurisdiction-programs/${prog_id}"
              payload: {}
              as: RegulatoryAffairsOfficer
              captures: { released_before: "$.data.released_cartons_to_date" }
          trigger:
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/recall"
              payload: { reason: "Potency out of specification at the stability station." }
              as: RegulatoryAffairsOfficer
              captures: { batch_v: "$.data.version" }
          assert:
            - "AllocationBatch.${batch_id}.status == RECALLED (hop 1)"
            - "Carton.${c01}.temperature_state == DESTROYED and a DESTROY ledger entry exists for it (hop 2)"
            - "AllocationEntitlement.${ent_id}.acceptance_status == LAPSED with held_cartons == 0 and available_cartons == 0 (hop 3)"
            - "JurisdictionProgram.${prog_id}.released_cartons_to_date is unchanged from ${released_before} while lapsed_carton_count is 0, because the recall lapses without a ShippingWindowLapse"

      - name: not_usable_adjudication_cascades_to_site_and_program
        grounds:
          - state_machines.TemperatureExcursion.transitions.UNDER_REVIEW_to_ADJUDICATED
          - state_machines.Carton.transitions.THAWED_to_DESTROYED
          - endpoints.POST_/temperature-excursions/{id}/adjudicate
          - entities.StorageSite.fields.usable_doses
          - entities.StorageSite.fields.inventory_status
        distinguishing_aspect: "One NOT_USABLE adjudication propagates WITHOUT a full user_id — carton destroyed, then the site's usable_doses and inventory_status fall, and the FamilyLinked site's open_excursion_count and inventory_status move as a third hop caused by the site mutation."
        test_recipe:
          setup:
            - "The anchored base fixture plus a FamilyLinked second site MI-RIV-05 in the same program with a PASSED freezer verification and one REFRIGERATED carton delivered to it. Carton C-01 is thawed at MI-RIV-01 and an excursion with min_temperature_c -65 is reported on it and moved to UNDER_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - *c_accept
            - *c_disp
            - *c_pack
            - *c_shipper
            - *c_attach
            - *c_readings
            - *c_read_delivered
            - *c_ship_v
            - *c_seal
            - *c_dispatch
            - *c_deliver
            - *c_thaw_base
            - *c_thaw_call
            - *c_exc_base
            - call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/review"
              payload: {}
              as: ColdChainReviewer
            - call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-05", site_name: "Riverside Annex", jurisdiction_program_id: "${prog_id}", storage_capability: "REFRIGERATED", ultra_cold_capacity_cartons: 0, refrigerated_capacity_cartons: 12, cold_chain_equipment_type: "THERMAL_SHIPPER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 1200 }
              as: DistributionPlanner
              captures: { site5_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-equipment-verifications"
              payload: { storage_site_id: "${site5_id}", equipment_type: "THERMAL_SHIPPER", certificate_number: "CERT-MI-0005", certificate_expires_at: "2027-01-01T00:00:00Z", verified_at: "2026-09-01T00:00:00Z", outcome: "PASSED" }
              as: ColdChainReviewer
            - call: "POST /vaccine-distribution/carton-families"
              payload: { site_id: "${site_id}", member_site_id: "${site5_id}", linked_at: "2026-09-01T00:00:00Z" }
              as: ColdChainReviewer
            - call: "POST /vaccine-distribution/carton-storage-reservations"
              payload: { storage_site_id: "${site5_id}", carton_id: "${c01}", entry_type: "REFRIGERATED", temp_state: "THAWED", reserved_capacity_cartons: 1, start_at: "2026-09-01T10:00:00Z", end_at: "2026-09-02T00:00:00Z", resolve_method: "CAPACITY_POOLED" }
              as: DistributionPlanner
          trigger:
            - call: "POST /vaccine-distribution/temperature-excursions/${exc_id}/adjudicate"
              payload: { outcome: "NOT_USABLE", rationale: "Breach below the excursion tolerance band for two hours." }
              as: MedicalScienceLiaison
              captures: { hor: "$.data.quarantine_status" }
          assert:
            - "Carton.${c01}.temperature_state == DESTROYED after the adjudication (hop 1)"
            - "GET /vaccine-distribution/storage-sites/${site_id}/usable-doses reports usable_doses == 0 and inventory_status RESTRICTED (hop 2)"
            - "GET /vaccine-distribution/storage-sites/${site5_id}/usable-doses reports open_excursion_count 0 and inventory_status RESTRICTED, the third hop caused by the family mutation rather than by the adjudication call itself"
            - "TemperatureExcursion.${exc_id}.quarantine_status is DESTROYED and adjudication_status NOT_USABLE"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precondition_beats_cold_chain_safety_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SITE_CAPACITY_INSUFFICIENT]
        distinguishing_aspect: "On a dispatch that is still DRAFT and whose destination capacity is too small, the state check at priority 5 wins and the answer is the state error, while the same dispatch after packing the destination solves to the capacity error — the pair (state, business_safety) resolves to state first, never to capacity."
        test_recipe:
          setup:
            - "The anchored base fixture, plus a second site MI-RIV-02 with ultra_cold_capacity_cartons 1 and a PASSED freezer verification, and one accepted order for that site."
