            - "the second provisioning (same now-stale version 2) returns HTTP 412 with data.error_id == ERR_STALE_VENDOR_APP_VERSION"
            - "GET /rostering/app-accounts?student_id=${s2_id} returns total_count 0 — the refused call created nothing"
            - "BuildingAllocation ${alloc_id}.consumed_seats is still 1 and VendorApp.consumed_seats 1, committed_charge_cents 1000, version still 3 — a rejected write does not bump the counter it guards"
            - "the replay with version 3 returns HTTP 201; VendorApp version becomes 4 with consumed_seats 2 and committed_charge_cents 2000"

