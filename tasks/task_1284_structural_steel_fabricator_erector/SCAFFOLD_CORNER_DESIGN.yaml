          trigger:
            - { call: "POST /welds", payload: { piece_id: "${pcc}", welder_id: "${wcc}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z" }, as: WELDER, as_user_id: "${wcc}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_WELDER_NOT_QUALIFIED (2026-01-15 to 2026-08-01 is 198 days > 183)"

      - name: weld_repair_limit_boundary
        claim_type: correct_result
        grounds: ["calculations.welder_continuity", "state_machines.Weld.VISUAL_REJECTED_to_WELDED", "errors[ERR_WELD_REPAIR_LIMIT]"]
