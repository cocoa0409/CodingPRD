            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 20 }, as: SalesAgent, as_user_id: "sa-1", captures: { o1: $.data.id } }
