  - rule_id: non_linear_state_machine
    instances:
      - name: shell_damaged_in_repair_damaged_reschedule_cycle
        grounds:
          - state_machines.Shell.DAMAGED_to_IN_REPAIR
          - state_machines.Shell.IN_REPAIR_to_DAMAGED
          - state_machines.DamageReport.TRIAGED_to_REPAIR_SCHEDULED
          - state_machines.DamageReport.REPAIR_SCHEDULED_to_TRIAGED
          - validations[priority=37]
        distinguishing_aspect: |
          The Shell machine is cyclic on the DAMAGED <-> IN_REPAIR pair driven by the paired
          DamageReport cycle TRIAGED <-> REPAIR_SCHEDULED: a re-triage walks the hull backwards
          out of IN_REPAIR, releases the bay reservation, and the identical bay window can then be
          claimed a second time, so the loop is re-traversable rather than one-way.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one reporting member, one member acting as EquipmentManager, one 1X hull"
            - "one MAJOR damage report driving the hull to DAMAGED, triaged to REPAIR and scheduled into BAY-A for 2026-08-03T08:00:00Z..12:00:00Z, so the hull sits in IN_REPAIR"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { rita_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Enid Boatman", tier: "RECREATIONAL", body_weight_kg: 75.0, club_roles: ["EQUIPMENT_MANAGER"] }
              as: ClubAdmin
              captures: { equip_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Heron", boat_class: "1X", hull_weight_kg: 14.5, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/damage-reports"
              payload: { shell_id: "${shell_id}", reported_by_member_id: "${rita_id}", severity: "MAJOR", narrative: "cracked rib at seat 1" }
              as: Member
              as_user_id: "${rita_id}"
              captures: { report_id: $.data.id }
            - call: "POST /boathouse/damage-reports/${report_id}/triage"
              payload: { disposition: "REPAIR" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/damage-reports/${report_id}/schedule-repair"
              payload: { assigned_repair_bay: "BAY-A", repair_window_start_at: "2026-08-03T08:00:00Z", repair_window_end_at: "2026-08-03T12:00:00Z" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
          trigger:
            - call: "POST /boathouse/damage-reports/${report_id}/triage"
              payload: { disposition: "REPAIR" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/damage-reports/${report_id}/schedule-repair"
              payload: { assigned_repair_bay: "BAY-A", repair_window_start_at: "2026-08-03T08:00:00Z", repair_window_end_at: "2026-08-03T12:00:00Z" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
          assert:
            - "after the first trigger call DamageReport.${report_id}.status == TRIAGED and Shell.${shell_id}.status == DAMAGED (the backwards leg of the cycle)"
            - "after the first trigger call DamageReport.${report_id}.assigned_repair_bay == null, repair_window_start_at == null and repair_window_end_at == null (the bay reservation is released)"
            - "after the second trigger call DamageReport.${report_id}.status == REPAIR_SCHEDULED and Shell.${shell_id}.status == IN_REPAIR (the same loop traversed a second time)"
            - "after the second trigger call DamageReport.${report_id}.assigned_repair_bay == BAY-A with repair_window_start_at == 2026-08-03T08:00:00Z, proving the released window did not stay reserved and no ERR_REPAIR_BAY_CONFLICT was raised"
            - "Shell.${shell_id}.status never became RETIRED and DamageReport.${report_id}.status never became VERIFIED during the cycle"

      - name: protest_remand_reopen_cycle_capped_at_two_rounds
        grounds:
          - state_machines.Protest.FILED_to_UNDER_JURY_REVIEW
          - state_machines.Protest.UNDER_JURY_REVIEW_to_REMANDED
          - state_machines.Protest.REMANDED_to_UNDER_JURY_REVIEW
          - entities.Protest.fields.review_round
          - validations[priority=48]
          - calculations.protest_deposit_ledger
        distinguishing_aspect: |
          A second, different entity carries the non-linear shape: the Protest machine cycles
          UNDER_JURY_REVIEW -> REMANDED -> UNDER_JURY_REVIEW while review_round monotonically
          counts the loop, and the cycle is bounded — the third opening attempt is rejected with
          ERR_MAX_JURY_ROUNDS_EXCEEDED once review_round has reached MAX_JURY_ROUNDS 2.
