              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
