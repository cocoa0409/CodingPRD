              payload: { shipment_id: "${s14}", claim_type: "LOSS", claimed_amount_cents: 5000 }
              as: ClaimsClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SHIPMENT_NOT_DELIVERED (or carrier-inactive variant — both roll up to cross-entity state rejection at priority 14)"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap: different interval semantics.
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: carrier_lane_assignment_window_overlap_rejected
        grounds:
          - entities.CarrierLaneAssignment
          - validations[priority=15]
        distinguishing_aspect: |
          Half-open interval semantics [effective_from, effective_to): creating
          a second CarrierLaneAssignment for same (carrier_id, lane_id) whose
          window overlaps the existing one is rejected via uniqueness/constraint
          check. Adjacent (one's effective_to == other's effective_from) is OK.
        test_recipe:
          setup:
            - "Existing assignment for (C15, L15) window [2026-01-01, 2026-12-31)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
