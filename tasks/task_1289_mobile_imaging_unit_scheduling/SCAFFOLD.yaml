    side_effects: []
  - method: POST
    path: "/api/transport-legs/{id}/arrive"
    description: "DISPATCHED -> ARRIVED"
    roles: [Technologist, OperationsDirector]
    code: 200
    input: []
    output: TransportLeg
    side_effects: ["status -> ARRIVED"]

  # --- Setup Checklists ---
  - method: POST
    path: "/api/setup-checklists"
    description: "Record the full setup checklist for a day in SETTING_UP (one per site day)"
    roles: [Technologist]
    code: 201
    input: [site_day_id, power_verify_passed, measured_amps, pad_level_passed, chiller_passed, rf_shield_passed, network_link_passed, measured_uplink_mbps]
    output: SetupChecklist
    side_effects: ["status computed (ALL_PASSED | HAS_FAILURES)"]
  - method: GET
    path: "/api/setup-checklists"
    description: "List checklists"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["site_day_id?", "limit?", "offset?"]
    output: "SetupChecklist[]"
    side_effects: []
  - method: GET
    path: "/api/setup-checklists/{id}"
    description: "Get a checklist"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: SetupChecklist
    side_effects: []
  - method: POST
    path: "/api/setup-checklists/{id}/record-item"
    description: "Overwrite one checklist item (cycle HAS_FAILURES -> ALL_PASSED); measured_value updates measured_amps for POWER_VERIFY or measured_uplink_mbps for NETWORK_LINK"
    roles: [Technologist]
    code: 200
    input: [item_key, passed, "measured_value?"]
    output: SetupChecklist
    side_effects: ["status recomputed"]

  # --- Breakdowns ---
  - method: POST
    path: "/api/breakdowns"
    description: "Report a breakdown; MINOR: no cascade; MAJOR: named day -> INTERRUPTED; CRITICAL: also unit -> OUT_OF_SERVICE"
    roles: [Technologist, OperationsDirector]
    code: 201
    input: [unit_id, "site_day_id?", severity, description]
    output: BreakdownEvent
    side_effects: ["status = REPORTED", "severity-driven cascades per state machines"]
  - method: GET
    path: "/api/breakdowns"
    description: "List breakdowns"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["unit_id?", "site_day_id?", "limit?", "offset?"]
    output: "BreakdownEvent[]"
    side_effects: []
  - method: GET
    path: "/api/breakdowns/{id}"
    description: "Get a breakdown"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: BreakdownEvent
    side_effects: []
  - method: POST
    path: "/api/breakdowns/{id}/resolve"
    description: "REPORTED -> RESOLVED; CRITICAL breakdown returns the unit to ACTIVE_SERVICE"
    roles: [OperationsDirector]
    code: 200
    input: [downtime_hours, resolution_notes]
    output: BreakdownEvent
    side_effects: ["status -> RESOLVED", "unit -> ACTIVE_SERVICE when active_breakdown_id matches"]

  # --- Radiation Dose Records ---
  - method: POST
    path: "/api/dose-records"
    description: "Record delivered dose for a COMPLETED CT/PET appointment; sets drl_exceeded; recomputes technologist dose aggregates"
    roles: [Technologist]
    code: 201
    input: [appointment_id, technologist_id, dose_msv]
    output: RadiationDoseRecord
    side_effects: ["drl_exceeded computed (dose > DRL_MSV[exam_type])", "Technologist.current_day_dose_msv / monthly_dose_msv recomputed", "PatientAppointment.actual_dose_msv recomputed"]
  - method: GET
    path: "/api/dose-records"
    description: "List dose records"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["appointment_id?", "technologist_id?", "limit?", "offset?"]
    output: "RadiationDoseRecord[]"
    side_effects: []
  - method: GET
    path: "/api/dose-records/{id}"
    description: "Get a dose record"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: RadiationDoseRecord
    side_effects: []

  # --- Accreditation ---
  - method: POST
    path: "/api/accreditations"
    description: "Create an accreditation record (initial status derived from clock)"
    roles: [ComplianceOfficer]
    code: 201
    input: [unit_id, accrediting_body, modality, issued_on, expires_on]
    output: AccreditationRecord
    side_effects: ["status derived from clock"]
  - method: GET
    path: "/api/accreditations"
    description: "List accreditation records"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: "AccreditationRecord[]"
    side_effects: []
  - method: GET
    path: "/api/accreditations/{id}"
    description: "Get an accreditation record"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: AccreditationRecord
    side_effects: []
  - method: POST
    path: "/api/accreditations/{id}/suspend"
    description: "ACTIVE/EXPIRING_SOON -> SUSPENDED (audit finding)"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: AccreditationRecord
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/api/accreditations/{id}/reinstate"
    description: "SUSPENDED -> clock-derived ACTIVE / EXPIRING_SOON / EXPIRED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AccreditationRecord
    side_effects: ["status re-derived from clock"]

  # --- Billing Statements (system-created) ---
  - method: GET
    path: "/api/billing-statements"
    description: "List statements"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["site_day_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: "BillingStatement[]"
    side_effects: []
  - method: GET
    path: "/api/billing-statements/{id}"
    description: "Get a statement"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: BillingStatement
    side_effects: []
  - method: POST
    path: "/api/billing-statements/{id}/finalize"
    description: "PROVISIONAL -> FINALIZED; recomputes final variant (delivered-image billable set for PER_SCAN)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: BillingStatement
    side_effects: ["final_amount_cents computed", "net_due_cents computed"]
  - method: POST
    path: "/api/billing-statements/{id}/dispute"
    description: "FINALIZED -> DISPUTED (facility's own coordinator only)"
    roles: [FacilityCoordinator]
    code: 200
    input: [reason]
    output: BillingStatement
    side_effects: ["status -> DISPUTED"]
  - method: POST
    path: "/api/billing-statements/{id}/resolve-dispute"
    description: "DISPUTED -> FINALIZED; ADJUST overwrites final_amount_cents with adjusted_amount_cents"
    roles: [OperationsDirector]
    code: 200
    input: [resolution, "adjusted_amount_cents?"]
    output: BillingStatement
    side_effects: ["status -> FINALIZED", "amounts per resolution"]
  - method: POST
    path: "/api/billing-statements/{id}/invoice"
    description: "FINALIZED -> INVOICED"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: BillingStatement
    side_effects: ["status -> INVOICED"]
  - method: POST
    path: "/api/billing-statements/{id}/mark-paid"
    description: "INVOICED -> PAID; paid_amount_cents must equal net_due_cents"
    roles: [OperationsDirector]
    code: 200
    input: [paid_amount_cents]
    output: BillingStatement
    side_effects: ["status -> PAID"]

  # --- Image Studies ---
  - method: POST
    path: "/api/image-studies"
    description: "Register a DICOM study for a COMPLETED appointment (QUEUED)"
    roles: [Technologist]
    code: 201
    input: [appointment_id, study_uid, size_mb]
    output: ImageStudy
    side_effects: ["status = QUEUED"]
  - method: GET
    path: "/api/image-studies"
    description: "List image studies"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["appointment_id?", "status?", "limit?", "offset?"]
    output: "ImageStudy[]"
    side_effects: []
  - method: GET
    path: "/api/image-studies/{id}"
    description: "Get an image study"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: ImageStudy
    side_effects: []
  - method: POST
    path: "/api/image-studies/{id}/transmit"
    description: "QUEUED -> DELIVERED when size_mb <= floor(day checklist measured_uplink_mbps * 7.5), else -> TRANSFER_FAILED"
    roles: [Technologist]
    code: 200
    input: []
    output: ImageStudy
    side_effects: ["transfer_attempts += 1", "delivered_at stamped on success"]
  - method: POST
    path: "/api/image-studies/{id}/retry"
    description: "TRANSFER_FAILED -> QUEUED (re-enqueue for another transmit)"
    roles: [Technologist]
    code: 200
    input: []
    output: ImageStudy
    side_effects: ["status -> QUEUED"]
  - method: POST
    path: "/api/image-studies/{id}/acknowledge"
    description: "DELIVERED -> ACKNOWLEDGED by the reading radiologist; computes sla_breached (ack more than 120 min after completed_at)"
    roles: [ReadingRadiologist]
    code: 200
    input: ["reader_notes?"]
    output: ImageStudy
    side_effects: ["acknowledged_at stamped", "sla_breached computed"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role undeclared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "ContractedFacility id not found" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "MobileImagingUnit id not found" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "ServiceContract id not found" }
  - { id: ERR_ROUTE_PLAN_NOT_FOUND, http: 404, condition: "RoutePlan id not found" }
  - { id: ERR_SITE_DAY_NOT_FOUND, http: 404, condition: "SiteDayAssignment id not found" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "PatientAppointment id not found" }
  - { id: ERR_TECHNOLOGIST_NOT_FOUND, http: 404, condition: "Technologist id not found" }
  - { id: ERR_STAFFING_NOT_FOUND, http: 404, condition: "StaffingAssignment id not found" }
  - { id: ERR_TRANSPORT_LEG_NOT_FOUND, http: 404, condition: "TransportLeg id not found" }
  - { id: ERR_CHECKLIST_NOT_FOUND, http: 404, condition: "SetupChecklist id not found" }
  - { id: ERR_BREAKDOWN_NOT_FOUND, http: 404, condition: "BreakdownEvent id not found" }
  - { id: ERR_ACCREDITATION_NOT_FOUND, http: 404, condition: "AccreditationRecord id not found" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "BillingStatement id not found" }
  - { id: ERR_STUDY_NOT_FOUND, http: 404, condition: "ImageStudy id not found" }
  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or enum value outside the declared set" }
  # --- OCC ---
  - { id: ERR_STALE_UNIT_VERSION, http: 412, condition: "expected_unit_version != unit.version on POST /api/route-plans" }
  - { id: ERR_STALE_ROUTE_PLAN_VERSION, http: 412, condition: "expected_route_plan_version != target plan.version on reschedule" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid-from state for the attempted transition" }
  - { id: ERR_PLAN_NOT_PUBLISHED, http: 409, condition: "Route plan not in the required DRAFT/PUBLISHED-family state for this operation" }
  - { id: ERR_PLAN_NOT_LOCKED, http: 409, condition: "Route plan must be LOCKED to close" }
  - { id: ERR_PLAN_WEEK_CONFLICT, http: 409, condition: "A PUBLISHED or LOCKED plan already exists for this unit and week_start_date" }
  - { id: ERR_EMPTY_ROUTE_PLAN, http: 409, condition: "Publish requires site_day_count >= 1" }
  - { id: ERR_PLAN_HAS_ACTIVE_DAYS, http: 409, condition: "Unpublish/close blocked by site days outside the allowed state set" }
  - { id: ERR_SITE_DAY_NOT_BOOKABLE, http: 409, condition: "Site day is INTERRUPTED, CANCELLED, COMPLETED, or RESCHEDULED and accepts no appointments" }
  - { id: ERR_SITE_DAY_NOT_IN_SERVICE, http: 409, condition: "Operation requires the site day to be IN_SERVICE (check-in also accepts READY)" }
  - { id: ERR_UNIT_OUT_OF_SERVICE, http: 409, condition: "Unit is OUT_OF_SERVICE (or otherwise not ACTIVE_SERVICE) for this operation" }
  - { id: ERR_UNIT_HAS_ACTIVE_DAY, http: 409, condition: "Maintenance blocked: unit has a site day in EN_ROUTE/SETTING_UP/READY/IN_SERVICE" }
  - { id: ERR_TRANSPORT_NOT_ARRIVED, http: 409, condition: "begin-setup requires every TransportLeg of the day to be ARRIVED" }
  - { id: ERR_NO_STAFF_ASSIGNED, http: 409, condition: "start-service requires at least one ASSIGNED StaffingAssignment" }
  - { id: ERR_OPEN_APPOINTMENTS, http: 409, condition: "complete requires every appointment terminal (COMPLETED/CANCELLED/NO_SHOW)" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 409, condition: "mark-ready requires a SetupChecklist in ALL_PASSED" }
  - { id: ERR_CHECKLIST_EXISTS, http: 409, condition: "Exactly one SetupChecklist per site day" }
  - { id: ERR_APPOINTMENT_NOT_CANCELLABLE, http: 409, condition: "Manual cancel allowed only from REQUESTED or CONFIRMED" }
  - { id: ERR_STATEMENT_NOT_FINALIZABLE, http: 409, condition: "finalize requires statement PROVISIONAL" }
  - { id: ERR_STUDY_NOT_TRANSFERRABLE, http: 409, condition: "transmit requires QUEUED; retry requires TRANSFER_FAILED" }
  - { id: ERR_BREAKDOWN_ALREADY_RESOLVED, http: 409, condition: "resolve requires breakdown REPORTED" }
  - { id: ERR_RESCHEDULE_SOURCE_INVALID, http: 409, condition: "reschedule requires the source day INTERRUPTED" }
  - { id: ERR_RESCHEDULE_TARGET_INVALID, http: 409, condition: "Target plan must be PUBLISHED and belong to the same unit" }
  # --- Business: safety / referential / temporal / constraint / fiscal ---
  - { id: ERR_DOSE_LIMIT_EXCEEDED, http: 422, condition: "projected_dose_msv would exceed 5.0 mSv daily technologist limit (strictly greater rejects)" }
  - { id: ERR_DOSE_NOT_APPLICABLE, http: 422, condition: "Dose records apply only to CT/PET exams (MRI emits no ionizing dose)" }
  - { id: ERR_PAD_POWER_INSUFFICIENT, http: 422, condition: "Pad amperage below unit requirement or voltage mismatch (create) / measured_amps below requirement (mark-ready)" }
  - { id: ERR_MODALITY_NOT_SUPPORTED, http: 422, condition: "Facility does not host the unit modality, or exam_type modality prefix differs from the day's unit modality" }
  - { id: ERR_MODALITY_CERT_MISMATCH, http: 422, condition: "Technologist lacks certification for the day's unit modality" }
  - { id: ERR_CONTRACT_FACILITY_MISMATCH, http: 422, condition: "contract.facility_id != site day facility_id" }
  - { id: ERR_FACILITY_MISMATCH, http: 403, condition: "Acting FacilityCoordinator's facility differs from the resource's facility" }
  - { id: ERR_TECHNOLOGIST_IDENTITY_MISMATCH, http: 403, condition: "dose-record technologist_id must equal X-User-ID" }
  - { id: ERR_TECHNOLOGIST_NOT_STAFFED, http: 422, condition: "Acting technologist holds no ASSIGNED StaffingAssignment on this site day" }
  - { id: ERR_DRIVE_TIME_EXCEEDED, http: 422, condition: "estimated_drive_minutes > technologist.max_daily_drive_minutes" }
  - { id: ERR_SERVICE_DATE_IN_PAST, http: 422, condition: "service_date before the logical clock date" }
  - { id: ERR_SERVICE_DATE_OUTSIDE_PLAN_WEEK, http: 422, condition: "service_date outside [week_start_date, week_start_date + 6]" }
  - { id: ERR_WINDOW_TOO_SHORT, http: 422, condition: "Window geometry violated: first_patient >= arrival + setup_minutes and departure >= last_patient + teardown_minutes required" }
  - { id: ERR_SLOT_OUTSIDE_WINDOW, http: 422, condition: "Appointment [start, effective end] not within [first_patient_time, last_patient_time]; end == last_patient_time is allowed (inclusive)" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Appointment collides with an existing {REQUESTED, CONFIRMED, CHECKED_IN, SCANNING} appointment under half-open + 10-min trailing turnover semantics" }
  - { id: ERR_UNIT_DAY_DOUBLE_BOOKED, http: 409, condition: "Another live (non-CANCELLED, non-RESCHEDULED) site day exists for the unit on that service_date" }
  - { id: ERR_STAFFING_DATE_CONFLICT, http: 409, condition: "Technologist already ASSIGNED to another site day on the same service_date" }
  - { id: ERR_ACCREDITATION_NOT_VALID, http: 422, condition: "Governing accreditation is EXPIRED or SUSPENDED (or missing) for the unit" }
  - { id: ERR_SCAN_CAP_EXCEEDED, http: 402, condition: "Contract monthly_scan_cap reached for the appointment's calendar month" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "paid_amount_cents != net_due_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: OperationsDirector
    description: "Mobile imaging operations dispatcher: owns facilities, units, contracts, route plans, site-day lifecycle, staffing, billing lifecycle, breakdown resolution, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/facilities, /api/units, /api/contracts, /api/technologists"
      - "POST /api/units/{id}/maintenance, /api/units/{id}/return-to-service"
      - "POST /api/route-plans and plan actions publish/unpublish/lock/close"
      - "GET /api/contracts/{id}/period-invoice"
      - "POST /api/site-days and day actions depart/begin-setup/mark-ready/start-service/complete/interrupt/reschedule"
      - "POST /api/appointments/{id}/confirm"
      - "POST /api/staffing-assignments, /api/staffing-assignments/{id}/release"
      - "POST /api/transport-legs"
      - "POST /api/breakdowns/{id}/resolve"
      - "POST /api/billing-statements/{id}/finalize|resolve-dispute|invoice|mark-paid"
    shared_operations:
      - "POST /api/site-days/{id}/cancel (with FacilityCoordinator)"
      - "POST /api/breakdowns (with Technologist)"
      - "POST /api/transport-legs/{id}/arrive (with Technologist)"
      - "All GET endpoints"
  - name: FacilityCoordinator
    description: "Front-desk scheduler at a contracted facility: books and manages patient appointments for own facility's site days, cancels days, disputes statements"
    identity: "entity_backed:ContractedFacility"
    exclusive_operations:
      - "POST /api/appointments"
      - "POST /api/appointments/{id}/check-in, /api/appointments/{id}/cancel, /api/appointments/{id}/mark-no-show"
      - "POST /api/billing-statements/{id}/dispute"
    shared_operations:
      - "POST /api/site-days/{id}/cancel (with OperationsDirector)"
      - "All GET endpoints"
  - name: Technologist
    description: "Traveling imaging technologist: runs setup checklists, scans, dose records, image transfers; reports breakdowns"
    identity: "entity_backed:Technologist"
    exclusive_operations:
      - "POST /api/setup-checklists, /api/setup-checklists/{id}/record-item"
      - "POST /api/appointments/{id}/begin-scan, /api/appointments/{id}/complete-scan"
      - "POST /api/dose-records"
      - "POST /api/image-studies, /api/image-studies/{id}/transmit, /api/image-studies/{id}/retry"
    shared_operations:
      - "POST /api/breakdowns (with OperationsDirector)"
      - "POST /api/transport-legs/{id}/arrive (with OperationsDirector)"
      - "All GET endpoints"
  - name: ReadingRadiologist
    description: "Remote reading radiologist: acknowledges delivered image studies (read confirmation)"
    identity: opaque
    exclusive_operations:
      - "POST /api/image-studies/{id}/acknowledge"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "Radiation-safety and accreditation officer: manages accreditation records, audits dose records"
    identity: opaque
    exclusive_operations:
      - "POST /api/accreditations"
      - "POST /api/accreditations/{id}/suspend, /api/accreditations/{id}/reinstate"
    shared_operations:
      - "All GET endpoints"
