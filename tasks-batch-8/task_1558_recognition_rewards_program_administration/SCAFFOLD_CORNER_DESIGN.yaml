  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_budget_exhausted_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUDGET_EXHAUSTED]"]
        excluded_because:
          difficulty_instance: budget_full_at_exact_allocation
          rationale: "Asserted as the failure path of the named §1.8 instance (1-point submission over a fully allocated budget)."

      - name: error_insufficient_points_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_POINTS]"]
        excluded_because:
          difficulty_instance: redemption_at_exact_balance
          rationale: "Asserted as the failure path of the named §1.8 instance (1-point order against a zeroed balance)."

      - name: error_budget_restricted_amount_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUDGET_RESTRICTED_AMOUNT]"]
        excluded_because:
          difficulty_instance: restricted_posture_nested_min_cap
          rationale: "Asserted as the 501-point rejection of the named §1.8 instance."

      - name: error_velocity_limit_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_VELOCITY_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: velocity_sixth_nomination_flagged
          rationale: "Asserted as the 6th-submission rejection of the named §1.8 instance."

      - name: error_employee_suspended_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_EMPLOYEE_SUSPENDED]"]
        excluded_because:
          difficulty_instance: suspension_beats_scope_on_nominate
          rationale: "Asserted as the priority-winning error of the named §1.8 instance."

      - name: error_program_not_active_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROGRAM_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: program_state_beats_budget_fiscal_on_submit
          rationale: "Asserted as the priority-winning error of the named §1.8 instance."

      - name: error_catalog_item_unavailable_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_CATALOG_ITEM_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: window_beats_balance_on_redeem
          rationale: "Asserted as the priority-winning error of the named §1.8 instance."

      - name: error_budget_period_overlap_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUDGET_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: budget_period_half_open_overlap
