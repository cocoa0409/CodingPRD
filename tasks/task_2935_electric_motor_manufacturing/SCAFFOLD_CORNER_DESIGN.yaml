      - name: rotor_air_gap_rounds_half_up_at_the_third_decimal
        claim_type: precision
        grounds:
          - calculations.rotor_air_gap
          - entities.RotorBuild.measured_air_gap_mm
          - entities.RotorBuild.air_gap_deviation_mm
        distinguishing_aspect: |
          A measured rod diameter of 134.503 mm makes the raw half-difference exactly 0.4485 mm —
          a tie at the third decimal. ROUND_HALF_UP must yield 0.449 and a deviation of -0.001;
          banker's rounding (ROUND_HALF_EVEN, Python's default for Decimal.quantize) yields 0.448
          and -0.002, and float truncation yields 0.448 as well. The rod value is chosen so the
          tie is exact in decimal arithmetic.
        test_recipe:
          setup:
            - "Design D1 (stator bore 135.400, design gap 0.450, tolerance 0.050) RELEASED; order CONFIRMED; work order WO1 in build_status RELEASED."
            - "A RotorBuild on WO1 taken to CAST_POURED."
