  # ===========================================================================
  - section: validations
    instances:

      - name: existence_checked_before_state_on_nested_action
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: "Abandoning a non-existent order id returns 404 ERR_ORDER_NOT_FOUND — existence (priority 3) outranks every state/business rule even when the request would also violate them."
        test_recipe:
          setup: ["Stand booted."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
          trigger:
            - call: "POST /orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/abandon"
              payload: {}
              as: ShiftLead
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_ORDER_NOT_FOUND"

      - name: payment_decline_maps_to_402_fiscal
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors[ERR_PAYMENT_DECLINED]
        distinguishing_aspect: "card_token DECLINE on an otherwise valid authorize yields 402 ERR_PAYMENT_DECLINED and no Payment row is created (order stays UNPAID)."
        test_recipe:
          setup: ["Stand OPEN; one MERGED window order."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
            - *k_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/payments/authorize"
              payload: { card_token: "DECLINE" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 402 with error_id ERR_PAYMENT_DECLINED"
            - "GET /payments?order_id= returns an empty list; order payment_status stays UNPAID"

      - name: refund_beyond_captured_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_REFUND_EXCEEDS_CAPTURED]
          - state_machines.Payment
        distinguishing_aspect: "After a 450-cent capture and a 200-cent auto refund, a further 300-cent refund exceeds the remaining captured balance and fails ERR_REFUND_EXCEEDS_CAPTURED; a 250-cent refund (exactly the remainder) succeeds."
        test_recipe:
          setup: ["Stand OPEN; 450-cent order captured with one 200-cent auto-approved refund already applied."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_lead
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
            - *k_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/payments/authorize"
              payload: { card_token: "VISA-OK" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /orders/${order_id}/call-to-window"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /payments/${pay_id}/capture"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /payments/${pay_id}/refunds"
              payload: { amount_cents: 200 }
              as: ShiftLead
              as_user_id: "${lead_id}"
          trigger:
            - call: "POST /payments/${pay_id}/refunds"
              payload: { amount_cents: 300 }
              as: ShiftLead
              as_user_id: "${lead_id}"
              captures: { err: $.data.error_id }
            - call: "POST /payments/${pay_id}/refunds"
              payload: { amount_cents: 250 }
              as: ShiftLead
              as_user_id: "${lead_id}"
              captures: { final_status: $.data.status, refunded: $.data.refunded_cents }
          assert:
            - "300-cent refund rejected ERR_REFUND_EXCEEDS_CAPTURED (422) — 200 + 300 > 450"
            - "250-cent refund succeeds; refunded_cents == 450 and status == REFUNDED"
            - "200-cent refund auto-approved (<= 2000) — never entered REFUND_PENDING"

      - name: capture_out_of_sequence_blocked_by_earlier_unpaid_car
        claim_type: Violation → Error
        grounds:
