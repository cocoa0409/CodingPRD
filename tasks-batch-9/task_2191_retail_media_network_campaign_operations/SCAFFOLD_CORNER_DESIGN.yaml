        distinguishing_aspect: "The claimable ceiling is net_cash_due_cents 227 + trade_fund_deduction_cents 57 = 284, so a 300-cent claim is refused with ERR_CLAIM_EXCEEDS_INVOICE even though 300 is far below the plan's committed total — the trade-fund-funded slice counts toward the claimable base but nothing beyond the invoice does."
        test_recipe:
          setup:
