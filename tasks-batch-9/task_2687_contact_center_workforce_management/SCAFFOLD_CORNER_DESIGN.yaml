          max_consecutive_days 2 the Monday and Tuesday publications both succeed (run 1 then 2,
          equality passes) and the Wednesday publication is refused with
          ERR_MAX_CONSECUTIVE_DAYS_EXCEEDED (422) at run 3, even though the weekly total of 22.50
          hours is far under max_weekly_hours 45 and every rest gap is 16 hours. An implementation
          that counts shifts-in-the-week rather than an adjacency run passes Wednesday.
