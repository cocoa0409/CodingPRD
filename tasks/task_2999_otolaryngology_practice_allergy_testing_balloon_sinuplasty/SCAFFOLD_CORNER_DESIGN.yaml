      - name: insufficient_vial_volume_at_the_fifth_dose
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INSUFFICIENT_VIAL_VOLUME
          - calculations.immunotherapy_vial_volume_ledger
          - calculations.immunotherapy_next_dose_volume.constants.SCHEDULE_ML
          - state_machines.ImmunotherapyDose.ADMINISTERED_to_CLEARED
        distinguishing_aspect: "A 1.00 mL vial funds the first four escalation steps exactly (0.05 + 0.10 + 0.20 + 0.30 = 0.65) and then fails on step 5, because 0.40 exceeds the remaining 0.35; the vial is still IN_USE rather than EXHAUSTED (0.35 >= MIN_DOSE_ML), which is what makes the error ERR_INSUFFICIENT_VIAL_VOLUME rather than ERR_VIAL_STATE_INVALID."
        test_recipe:
          setup:
            - "PayerPolicy with defaults (observation_floor_minutes 20); one low-risk adult Patient, so each dose needs 30 observation minutes."
            - "One ALLERGEN_CONCENTRATE lot; one BLUE_1_100 vial with volume_ml_initial 1.00, label-verified by a second nurse."
