          assert:
            - "response.data.contract_value == 7690.00"
            - "response.data.room_count == 4"
            - "response.data.accessory_set_count == 3"
            - "response.data.reshoot_credits_remaining == 1"
            - "response.data.restage_count == 0"
            - "response.data.fiscal_hold == false"
            - "response.data.payment_state == DEPOSIT_HELD"

