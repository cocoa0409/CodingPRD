          assert:
            - "Member.${m_id}.status == ACTIVE           # after two suspend+reinstate cycles"
            - "ProgramEnrollment.${e_id}.status == ACTIVE # cascade followed both cycles"
            - "Member.${m_id}.version >= 6                # activate + 2 suspends + 2 reinstates + create"

  # ===========================================================================
  # Rule 4 — transitive_cascade (≥2, different triggers, depths ≥3 and ≥2; ship 3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # Cascade A (depth 4): VolumeAudit.resolve -> PurchaseReport ADJUDICATED
      #   -> RebateAccrual recomputed -> RebateAccrual FINALIZED->OPEN (if differed)
      #   -> next close_quarter re-finalizes -> QuarterlyDistribution recalculated.
      - name: audit_resolve_cascades_to_redistribution
        grounds:
          - state_machines.VolumeAudit.ACCEPTED_to_RESOLVED
          - state_machines.PurchaseReport.SUBMITTED_to_ADJUDICATED
          - state_machines.RebateAccrual.FINALIZED_to_OPEN
          - state_machines.RebateAccrual.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Depth-4 cascade: audit.resolve -> report.adjudicated -> accrual recompute
          -> accrual state flip -> close_quarter re-finalize. Originates from
          VolumeAudit.resolve (different trigger than Instance B).
        test_recipe:
          setup:
            - "Member M (STANDARD) ACTIVE; Program P OPEN; Enrollment E ACTIVE"
            - "PurchaseReport R quarter=0 self_report_qty=120 self_report_cents=200000 (provisional=10000)"
            - "close_quarter -> quarter 1; accrual A FINALIZED final=10000 pass=7500 retained=2500"
            - "Distribution D created (quarter 0) calculated approved disbursed; A DISTRIBUTED"
            - "VolumeAudit V opened on R; driven to ACCEPTED"
