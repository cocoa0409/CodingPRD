  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: photo_match_requires_session_capture_open
        grounds:
          - state_machines.Photo.UNMATCHED_to_MATCHED
          - entities.PictureDaySession.fields.status
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair Photo -> PictureDaySession: a Photo can transition UNMATCHED -> MATCHED only
          while its parent PictureDaySession.status == CAPTURE_OPEN. The valid next-state of the Photo
          depends on a DIFFERENT entity's state.
        test_recipe:
          setup:
            - "Session in ROSTER_LOCKED (NOT yet CAPTURE_OPEN). A photo cannot be created until CAPTURE_OPEN, so we test the dependency at the open-capture boundary: capture a photo after open-capture, then reproduce the dependency by attempting match while session is GALLERY_OPEN."
            - "Concretely: session CAPTURE_OPEN, capture PH, then open-gallery; attempt match -> rejected because session is no longer CAPTURE_OPEN."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Magnolia School", scheduled_date: "2026-05-13T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
