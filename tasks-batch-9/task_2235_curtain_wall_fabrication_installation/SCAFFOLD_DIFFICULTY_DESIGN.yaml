# §1.8 Scaffold Difficulty Design (Test Targeting Index) - task_2235 curtain wall fabrication & installation
# 9 rule_id blocks, 24 instances. Every literal in `assert:` was computed by executing the §1.3 formulas.
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: zone_labor_provisional_forward_versus_final_chronological
    grounds:
    - calculations.zone_field_labor_cost
    - entities.InstallationZone.fields.provisional_labor_cost_cents
    - entities.InstallationZone.fields.final_labor_cost_cents
    - state_machines.InstallationZone.install_status ANCHORS_SET_to_PANELS_HUNG
    - state_machines.InstallationZone.weather_status NOT_TIGHT_to_WEATHER_TIGHT
    distinguishing_aspect: 'Field-labour cost on one InstallationZone: the PROVISIONAL_FORWARD variant fires at hang-panels
      from planned_panel_count at straight time with no elevation factor (940800), the FINAL_CHRONOLOGICAL variant fires
      at weather-tight certification by walking POSTED CrewDayLog rows with overtime at 1.5x and the 1.15 high-elevation
      factor (1149540); both values persist side by side on the same row so the 208740 delta is directly observable.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z, then advanced to 2026-08-10T09:00:00Z and 2026-08-13T09:00:00Z
      - 'package Tower A Facade: UNITIZED, planned_field_crew_size 4, base_labor_rate_cents_per_hour 9800, mockup PASSED,
        submittal APPROVED'
      - glass order RECEIVED with 240 lites; one zone floor 5 NORTH, area 412.37 sqm, height_m 24.0 (> 20.0 threshold),
        span 3200, planned_panel_count 36, budget_crew_hours 320.0
      - the zone reached PANELS_HUNG through a valid hoist window; three POSTED crew days (4x9.0, 4x8.0, 4x8.0); water and
        air field tests PASSED
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - &id002
        call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      - &id003
        call: POST /facade-packages/${pkg}/system-decision
        payload:
          system_type: UNITIZED
        as: CWProjectManager
      - &id004
        call: POST /test-labs
        payload:
          name: Chamber Labs NE
          chamber_capacity: 2
          accreditation_ref: AAMA-CL-01
        as: CWProjectManager
        captures:
          lab: $.data.id
      - &id005
        call: POST /mockup-tests
        payload:
          package_id: ${pkg}
          test_lab_id: ${lab}
          window_start: '2026-08-05T06:00:00Z'
          window_end: '2026-08-05T20:00:00Z'
          chambers_required: 1
        as: CWProjectManager
        captures:
          mock: $.data.id
      - &id006
        call: POST /mockup-tests/${mock}/record-result
        payload:
          water_penetration_observed: false
          air_infiltration_cfm: 0.04
          structural_deflection_mm: 15.0
        as: QCInspector
        as_user_id: u-qc-1
      - &id007
        call: POST /shop-drawing-submittals
        payload:
          package_id: ${pkg}
          submittal_type: SHOP_DRAWING
          title: Typical unitized panel set
          drawing_set_ref: SD-001
          delegated_design_scope: true
        as: CWDetailer
        captures:
          sub: $.data.id
      - &id008
        call: POST /shop-drawing-submittals/${sub}/seal
        payload:
          seal_license_no: PE-44821
        as: DelegatedEngineer
        as_user_id: u-eng-1
      - &id009
        call: POST /shop-drawing-submittals/${sub}/start-review
        payload: {}
        as: ArchitectOfRecord
        as_user_id: u-aor-1
      - &id010
        call: POST /shop-drawing-submittals/${sub}/review
        payload:
          decision: APPROVED
        as: ArchitectOfRecord
        as_user_id: u-aor-1
      - &id011
        call: POST /glass-orders
        payload:
          package_id: ${pkg}
          supplier_name: Vitro Flat Glass
          coating_code: LOWE-366
          quoted_lead_time_days: 90
          ordered_lites: 240
        as: GlazingProcurement
        captures:
          go: $.data.id
      - &id012
        call: POST /glass-orders/${go}/start-production
        payload: {}
        as: GlazingProcurement
      - &id013
        call: POST /glass-orders/${go}/receive
        payload:
          received_lites: 240
        as: GlazingProcurement
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 5
          elevation_label: NORTH
          area_sqm: 412.37
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          z1: $.data.id
      - call: GET /facade-packages/${pkg}
        payload: {}
        as: CWProjectManager
        captures:
          pkg_v: $.data.version
      - call: POST /fabrication-releases
        payload:
          package_id: ${pkg}
          submittal_id: ${sub}
          glass_order_id: ${go}
          zone_ids:
          - ${z1}
          panels_per_zone: 36
          lites_per_panel: 2
          expected_package_version: ${pkg_v}
        as: CWProjectManager
        captures:
          rel: $.data.id
      - call: GET /panel-lots
        payload:
          zone_id: ${z1}
        as: FieldSuperintendent
        captures:
          lot1: $.data[0].id
      - call: POST /panel-lots/${lot1}/advance-fabrication
        payload:
          to_status: GLAZED
        as: FieldSuperintendent
      - call: POST /panel-lots/${lot1}/advance-fabrication
        payload:
          to_status: SHIPPED
        as: FieldSuperintendent
      - call: POST /installation-zones/${z1}/embed-surveys
        payload:
          embed_layout_ref: EL-05-N
          planned_anchor_count: 72
        as: StructuralContractor
        captures:
          sv1: $.data.id
      - call: POST /embed-surveys/${sv1}/survey
        payload:
          surveyed_anchor_count: 72
          max_deviation_mm: 12.0
        as: StructuralContractor
      - call: POST /embed-surveys/${sv1}/confirm-pour
        payload:
          poured_at: '2026-08-06T12:00:00Z'
        as: StructuralContractor
      - call: POST /installation-zones/${z1}/set-anchors
        payload: {}
        as: FieldSuperintendent
      - call: POST /hoist-rigs
        payload:
          package_id: ${pkg}
          rig_code: HR-1
          rig_kind: MAST_CLIMBER
          capacity_panels_per_shift: 20
          changeover_buffer_minutes: 45
        as: FieldSuperintendent
        captures:
          rig: $.data.id
      - call: POST /hoist-reservations
        payload:
          rig_id: ${rig}
          zone_id: ${z1}
          window_start: '2026-08-10T06:00:00Z'
          window_end: '2026-08-10T18:00:00Z'
          planned_panel_count: 36
        as: FieldSuperintendent
        captures:
          res1: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T09:00:00Z'
        as: CWProjectManager
      - call: POST /installation-zones/${z1}/hang-panels
        payload:
          hoist_reservation_id: ${res1}
        as: FieldSuperintendent
      - call: POST /installation-zones/${z1}/crew-days
        payload:
          work_date: '2026-08-10'
          crew_size: 4
          shift_hours: 9.0
          panels_installed: 10
        as: FieldSuperintendent
        as_user_id: u-super-1
      - call: POST /installation-zones/${z1}/crew-days
        payload:
          work_date: '2026-08-11'
          crew_size: 4
          shift_hours: 8.0
          panels_installed: 13
        as: FieldSuperintendent
        as_user_id: u-super-1
      - call: POST /installation-zones/${z1}/crew-days
        payload:
          work_date: '2026-08-12'
          crew_size: 4
          shift_hours: 8.0
          panels_installed: 13
        as: FieldSuperintendent
        as_user_id: u-super-1
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-13T09:00:00Z'
        as: CWProjectManager
      - call: POST /installation-zones/${z1}/field-tests
        payload:
          test_kind: WATER_AAMA_501_2
          scheduled_for: '2026-08-13T08:00:00Z'
        as: QCInspector
        captures:
          ft_w1: $.data.id
      - call: POST /field-tests/${ft_w1}/record-result
        payload:
          water_penetration_observed: false
        as: QCInspector
        as_user_id: u-qc-2
      - call: POST /installation-zones/${z1}/field-tests
        payload:
          test_kind: AIR_INFILTRATION
          scheduled_for: '2026-08-13T10:00:00Z'
        as: QCInspector
        captures:
          ft_a1: $.data.id
      - call: POST /field-tests/${ft_a1}/record-result
        payload:
          measured_air_leakage_cfm: 0.04
        as: QCInspector
        as_user_id: u-qc-2
      trigger:
      - call: POST /installation-zones/${z1}/certify-weather-tight
        payload:
          certification_note: zone 5 north weather tight
        as: CWProjectManager
      assert:
      - InstallationZone.${z1}.provisional_labor_cost_cents == 940800 (unchanged by certification)
      - InstallationZone.${z1}.final_labor_cost_cents == 1149540
      - InstallationZone.${z1}.final_labor_cost_cents - InstallationZone.${z1}.provisional_labor_cost_cents == 208740
      - the three CrewDayLog rows of ${z1} carry day_cost_cents 428260, 360640, 360640 at day_index 1, 2, 3
      - InstallationZone.${z1}.consumed_crew_hours == 100.0 and InstallationZone.${z1}.remaining_crew_hours == 220.0
      - InstallationZone.${z1}.weather_status == WEATHER_TIGHT and InstallationZone.${z1}.install_status == PANELS_HUNG
      - InstallationZone.${z1}.certified_line_cents == 58266376
  - name: glass_risk_nominal_versus_expedite_adjusted_variant
    grounds:
    - calculations.glass_procurement_risk_score
    - entities.GlassOrder.fields.risk_variant
    - entities.GlassOrder.fields.effective_lead_days
    - entities.GlassOrder.fields.risk_score
    - entities.GlassOrder.fields.expedite_tier
    distinguishing_aspect: 'Procurement risk on one GlassOrder: variant selection is driven by stored flags (expedite_tier
      / coating_revision_count) rather than by which lifecycle step is executing, and the two variants diverge in two terms
      at once - effective_lead_days 90 -> 80 and horizon 90 -> 45 days - taking the same row from 48.11 to 26.87.'
    test_recipe:
      setup:
      - 'logical clock 2026-08-03T08:00:00Z; package weather_tightness_deadline_date 2026-12-15 (135 days is not used here:
        days_to_deadline is 134)'
      - glass order quoted_lead_time_days 90, ordered_lites 240, expedite_tier 0, coating_revision_count 0 -> variant NOMINAL
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      - call: POST /glass-orders
        payload:
          package_id: ${pkg}
          supplier_name: Vitro Flat Glass
          coating_code: LOWE-366
          quoted_lead_time_days: 90
          ordered_lites: 240
        as: GlazingProcurement
        captures:
          go: $.data.id
      trigger:
      - call: POST /glass-orders/${go}/request-expedite
        payload:
          expedite_tier: 1
        as: GlazingProcurement
      assert:
      - immediately after creation GlassOrder.${go}.risk_variant == NOMINAL, effective_lead_days == 90, risk_score == 48.11,
        risk_flag == false
      - after the expedite GlassOrder.${go}.risk_variant == EXPEDITE_ADJUSTED
      - GlassOrder.${go}.effective_lead_days == 80
      - GlassOrder.${go}.risk_score == 26.87
      - GlassOrder.${go}.risk_flag == false
      - the score delta between the two variants on identical stored inputs is 21.24
      - GlassOrder.${go}.state == ORDERED (the expedite is a pricing/lead-time event, not a lifecycle transition)
- rule_id: combinatorial_formula
  instances:
  - name: thermal_allowance_system_anchor_elevation_matrix
    grounds:
    - calculations.thermal_movement_allowance_mm
    - calculations.zone_deflection_limit_mm
    - entities.InstallationZone.fields.anchor_type
    - entities.InstallationZone.fields.height_m
    - state_machines.FacadePackage.DESIGN_ASSIST_to_SYSTEM_SELECTED
    distinguishing_aspect: 'Mode (a) multi-dimensional matrix: system_type (2) x anchor_type (3) x elevation band (3) =
      18 cells, and the instance pins four cells that isolate each axis - only anchor_type differs between zA/zB/zC, only
      system_type differs between zA and zD.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z
      - 'package Tower A Facade decided UNITIZED with design_temp_delta_c 60.0 and three zones: SLOTTED at height 18.0,
        FIXED at height 45.0, PINNED at height 30.0, all span 3200'
      - package Tower B Facade decided STICK_BUILT with design_temp_delta_c 60.0
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      - call: POST /facade-packages/${pkg}/system-decision
        payload:
          system_type: UNITIZED
        as: CWProjectManager
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 4
          elevation_label: NORTH
          area_sqm: 300.0
          height_m: 18.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          zA: $.data.id
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 14
          elevation_label: SOUTH
          area_sqm: 300.0
          height_m: 45.0
          span_mm: 3200
          anchor_type: FIXED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          zB: $.data.id
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 9
          elevation_label: EAST
          area_sqm: 300.0
          height_m: 30.0
          span_mm: 3200
          anchor_type: PINNED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          zC: $.data.id
      - call: POST /facade-packages
        payload:
          name: Tower B Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg2: $.data.id
      - call: POST /facade-packages/${pkg2}/system-decision
        payload:
          system_type: STICK_BUILT
        as: CWProjectManager
      trigger:
      - call: POST /installation-zones
        payload:
          package_id: ${pkg2}
          floor_number: 4
          elevation_label: NORTH
          area_sqm: 300.0
          height_m: 18.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 30
          budget_crew_hours: 240.0
        as: CWProjectManager
        captures:
          zD: $.data.id
      assert:
      - InstallationZone.${zA}.thermal_movement_allowance_mm == 5.84
      - InstallationZone.${zB}.thermal_movement_allowance_mm == 7.49
      - InstallationZone.${zC}.thermal_movement_allowance_mm == 6.67
      - InstallationZone.${zD}.thermal_movement_allowance_mm == 7.30
      - zA and zD share span, delta, anchor_type and elevation band and differ only in system_type, so 7.30 is exactly the
        1.25 stick-built factor applied to zA
      - InstallationZone.${zA}.deflection_limit_mm == 13.33 and InstallationZone.${zD}.deflection_limit_mm == 18.29
      - InstallationZone.${zB}.thermal_movement_allowance_mm includes the 3.00 high-band addend and InstallationZone.${zC}
        the 1.50 mid-band addend
