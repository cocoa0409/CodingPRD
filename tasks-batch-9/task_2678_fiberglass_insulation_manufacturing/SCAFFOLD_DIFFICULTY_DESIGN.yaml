            - "the boundary order is the only one served: AllocationLine for order_edge has allocated_sqft == 4400.00 and bags == 50, while ${order_late} still has allocated_sqft 0.00 -- the one-second-late order is excluded even when supply is ample"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: sku_certification_submission_gated_on_binder_reaching_certified
        grounds:
          - state_machines.ProductLine.DRAFT_to_PENDING_CERTIFICATION
          - state_machines.BinderFormulation.SUBMITTED_to_EMISSIONS_TESTING
          - state_machines.BinderFormulation.EMISSIONS_TESTING_to_CERTIFIED
          - validations.priority_52_ERR_BINDER_NOT_CERTIFIED
          - errors.ERR_BINDER_NOT_CERTIFIED
        distinguishing_aspect: |
          The gate is a FORWARD transition on ProductLine blocked by the status of a
          referenced BinderFormulation, and it is tested at two distinct blocking
          states rather than one: SUBMITTED and EMISSIONS_TESTING both fail, so an
          implementation that treats "binder has left DRAFT" or "binder has an
          emissions test on file" as sufficient is caught. Only status == CERTIFIED
          opens the gate, and the ProductLine's own certification_status is
          observably unchanged (DRAFT) after both rejections.
        test_recipe:
          setup:
            - "Program RCERT-PS and plant NWK exist."
            - "Binder BF-FREE-1 has been created and submitted, so its status is SUBMITTED and certified_at is null."
            - "SKU PL-A references BF-FREE-1 and is in certification_status DRAFT."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
