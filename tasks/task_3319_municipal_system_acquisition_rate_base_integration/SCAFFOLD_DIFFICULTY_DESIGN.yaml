              payload: { response: "DECLINED" }
              as: HRDirector
          assert:
            - "EmployeeTransition.${emp_id}.status == DECLINED"
            - "EmployeeTransition.${emp_id}.severance_weeks == 4 (exactly 5 years hits the >= 5 tier)"
            - "EmployeeTransition.${emp_id}.severance_cents == 480000"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: regulatory_filing_requires_council_approval
        grounds:
