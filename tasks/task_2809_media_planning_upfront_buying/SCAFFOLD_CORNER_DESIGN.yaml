      - name: forecast_create_read_and_filtered_list_round_trip
        claim_type: Standard CRUD
        grounds:
          - "endpoints[POST /upfront/inventory-forecasts]"
          - "endpoints[GET /upfront/inventory-forecasts/{forecastId}]"
          - "endpoints[GET /upfront/inventory-forecasts]"
          - "entities.InventoryForecast.fields.available_impressions"
        distinguishing_aspect: |
          Creation must default the avail to DRAFT with available_impressions equal to
          total_impressions, the single read must reflect the later publication (PUBLISHED, version 2)
          and the marketplace list must honour the status filter, returning exactly one PUBLISHED and
          exactly one DRAFT avail out of the two filed by the same seller. An implementation that
          initialises available_impressions to 0, or that ignores the status query parameter and
          returns both rows for each filter, fails.
        test_recipe:
          setup:
            - "one seller filing two avails for the same quarter, only the first of which is published"
          setup_api_calls:
            - call: "POST /upfront/sellers"
              payload: { name: "Harbor Broadcasting", platform_types: ["LINEAR", "CTV", "DIGITAL"], make_good_capacity_impressions: 50000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts"
              payload: { seller_id: "${sel_id}", market: "UPFRONT", fiscal_quarter: "2026Q4", daypart: "PRIME", program: "Harbor Nightly", platform: "LINEAR", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", total_impressions: 10000000, forecast_cpm_cents: 2200, exclusivity_mode: "SHARED" }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { f_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts"
              payload: { seller_id: "${sel_id}", market: "SCATTER", fiscal_quarter: "2026Q4", daypart: "DAYTIME", program: "Harbor Daytime", platform: "LINEAR", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", total_impressions: 5000000, forecast_cpm_cents: 1800, exclusivity_mode: "SHARED" }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { f2_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts/${f_id}/publish"
              payload: {}
              as: SellerRep
              as_user_id: "${sel_id}"
          trigger:
            - "GET /upfront/inventory-forecasts/${f_id} as AgencyBuyer"
            - "GET /upfront/inventory-forecasts?seller_id=${sel_id}&status=PUBLISHED as AgencyBuyer"
            - "GET /upfront/inventory-forecasts?seller_id=${sel_id}&status=DRAFT as AgencyBuyer"
          assert:
            - "the second create returned 201 with status \"DRAFT\", available_impressions == 5000000 and version == 1"
            - "the single read returns 200 with status \"PUBLISHED\", available_impressions == 10000000, forecast_cpm_cents == 2200 and version == 2"
            - "the PUBLISHED list returns meta.total_count == 1 with data[0].id == ${f_id}"
            - "the DRAFT list returns meta.total_count == 1 with data[0].id == ${f2_id}"
            - "both lists carry response_type array and meta.has_more == false"

      - name: waive_defaults_the_credit_to_the_frozen_shortfall_value
        claim_type: Conditional action
        grounds:
          - "endpoints[POST /upfront/make-goods/{makeGoodId}/waive]"
          - "entities.MakeGood.fields.waived_credit_cents"
          - "entities.MakeGood.fields.shortfall_value_cents"
          - "state_machines.Buy.stewardship_status.UNDER_DELIVERED_to_MADE_GOOD"
