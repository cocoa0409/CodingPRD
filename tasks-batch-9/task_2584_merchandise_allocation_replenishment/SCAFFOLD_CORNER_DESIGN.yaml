      - name: cluster_scorecard_included_set_is_narrower_than_the_cluster
        claim_type: aggregation
        grounds:
          - calculations.cluster_scorecard
          - calculations.cluster_scorecard.input_set
          - entities.PerformanceSnapshot.fields.included_position_count
          - entities.PerformanceSnapshot.fields.allocation_accuracy_bp
          - errors.ERR_NO_CLUSTER_POSITIONS
          - endpoints.POST /allocation/performance-snapshots
        distinguishing_aspect: |
          The scorecard sums numerators and denominators over a set that four different filters carve out of
          the cluster, and the sharp point is that this set is NOT the allocation candidate set: a REMODEL
          store is measured but can never be allocated to, so position 0102 contributes to both ratios while
          contributing 0 allocated units to the accuracy term. The other three filters remove a SUBURBAN
          store, a CLOSING store and a MARKDOWN item's position that sits in an otherwise included store. An
          empty result is a 422 rather than a zero-filled snapshot, and the OUTLET probe proves the emptiness
          test runs after the filters, not merely against the store list.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE, scorecard_basis UNIT_WEIGHTED by default; stores 0101 (A, URBAN, ACTIVE), 0102 (B, URBAN, moved to REMODEL), 0103 (C, SUBURBAN, ACTIVE), 0104 (D, OUTLET, moved to CLOSING)"
            - "SKU-1001 positions: 0101 on_hand 12 / min 20 / trailing 40, 0102 on_hand 8 / min 10 / trailing 20, 0103 on_hand 30 / min 8 / trailing 25, 0104 on_hand 4 / min 4 / trailing 8"
            - "SKU-2001 has one empty position at 0101 (min 5, trailing 9); one detection sweep raised its MARKDOWN action and executing it drove SKU-2001 to lifecycle_state MARKDOWN"
            - "A 12-unit receipt of SKU-1001 was proposed and COMMITTED, giving store 0101 a single PENDING line of 8 units (0103 needed nothing, 0102 and 0104 were not candidates)"
            - "The logical clock is 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
