        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[buyout-create-stale-contract]
        distinguishing_aspect: "Buyout creation carries expected_contract_version: after a renewal offer bumps the contract version, a buyout create priced against the old version is rejected 412 — two strictly sequential requests, no wall-clock dependence."
        test_recipe:
          setup:
            - "Logical clock 2028-06-01. Contract C51 in BUYOUT_PENDING (departed); client captured the contract version BEFORE a subsequent mutation."
