          setup:
            - "Concession at STEP_IN with concessionaire STEPPED_IN, driven there by a STEP_IN EnforcementAction with trigger_reason PERSISTENT_BREACH."
            - "One VERIFIED, INVOICED and PAID ServicePeriod (2027-03-01 .. 2027-04-01, deduction_cap_cents 1720833) carrying exactly one ISSUED 600-point DeductionEvent (raw 750000, allowed 750000), so total_deduction_cents == 750000 and net_payment_cents == 7854167."
            - "Concession.deduction_points_ytd == 600 and persistent_breach_flag == true (threshold 500)."
