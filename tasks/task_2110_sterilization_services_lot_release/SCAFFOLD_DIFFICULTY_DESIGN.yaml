            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: true }
              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 1 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-E1", modality: "ETO", pallet_capacity: 8, turnaround_minutes: 0, abatement_efficiency_pct: 96.0 }
              as: RegulatoryAdmin
              captures: { che1_id: $.data.id }
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-E2", modality: "ETO", pallet_capacity: 8, turnaround_minutes: 0, abatement_efficiency_pct: 96.0 }
              as: RegulatoryAdmin
              captures: { che2_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes"
              payload: { recipe_code: "RE", modality: "ETO", density_min_g_per_cm3: 0.1000, density_max_g_per_cm3: 0.1060, target_dose_kgy: 30.0, min_dose_kgy: 27.0, max_dose_kgy: 45.0, dose_basis: "ROUTINE_MEAN", aeration_base_hours: 12, required_min_zone_dosimeters: 1, required_routine_dosimeters: 1, required_biological_indicators: 0 }
              as: RegulatoryAdmin
              captures: { re_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${re_id}/approve"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p1_id}", recipe_id: "${re_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { qe_id: $.data.id }
            - call: "POST /sterilization/qualifications/${qe_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${che1_id}", recipe_id: "${re_id}", cycle_code: "C-A", scheduled_start_at: "2026-08-11T00:00:00Z", scheduled_end_at: "2026-08-11T06:00:00Z", raw_eto_charge_kg: 100.0 }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { cyc_a_id: $.data.id, cyc_a_v: $.data.version }
          trigger:
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${che2_id}", recipe_id: "${re_id}", cycle_code: "C-B", scheduled_start_at: "2026-08-11T06:00:00Z", scheduled_end_at: "2026-08-11T12:00:00Z", raw_eto_charge_kg: 100.0 }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { conc_err: $.data.error_id }
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${che2_id}", recipe_id: "${re_id}", cycle_code: "C-C", scheduled_start_at: "2026-08-11T06:00:01Z", scheduled_end_at: "2026-08-11T12:00:00Z", raw_eto_charge_kg: 100.0 }
              as: CycleOperator
