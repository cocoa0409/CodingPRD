      - name: session_complete_before_end_returns_session_not_ended
        claim_type: temporal_validation
        grounds: ["validations[priority=9]", "errors[ERR_SESSION_NOT_ENDED]"]
        distinguishing_aspect: "A training session cannot be completed before its scheduled_end: at clock 2026-08-01 for a session ending 2026-08-02T11:00Z the complete fails ERR_SESSION_NOT_ENDED."
        test_recipe:
          setup: ["session scheduled 2026-08-02 with one enrollee; clock still at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "V NE", email: "vne@x.org" }, as: ShopCoordinator, captures: { v: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "Early", level: "BASIC", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", credit_hours: 2, capacity: 5 }, as: ShopCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /training-sessions/${s1}/enroll", payload: { volunteer_id: "${v}" }, as: ShopCoordinator, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /training-sessions/${s1}/complete", payload: { marks: [ { attendance_id: "${a1}", outcome: "ATTENDED" } ] }, as: ShopCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SESSION_NOT_ENDED"
            - "TrainingSession.${s1}.status == SCHEDULED; volunteer.training_hours == 0"
