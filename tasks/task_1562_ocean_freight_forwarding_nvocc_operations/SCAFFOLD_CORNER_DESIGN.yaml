            - { call: "GET /freight/shippers/${s}", payload: {}, as: Any, captures: { st_mid: $.data.status, post_mid: $.data.credit_exposure_posted_cents } }
            - { call: "POST /freight/invoices/${inv2}/issue", payload: {}, as: FinanceController }
            - { call: "GET /freight/shippers/${s}", payload: {}, as: Any, captures: { st_end: $.data.status, post_end: $.data.credit_exposure_posted_cents } }
