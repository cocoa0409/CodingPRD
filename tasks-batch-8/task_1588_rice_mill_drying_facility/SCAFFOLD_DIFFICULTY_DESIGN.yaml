              as: ScaleOperator
              captures: { l_id: $.data.id }
            - call: "POST /mill/holds"
              payload: { season_id: "${s_id}", target_type: "LOT", target_id: "${l_id}", reason_code: "AFLATOXIN_SUSPECT" }
              as: SafetyOfficer
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /mill/lots/${l_id}/grade"
              payload: { moisture_pct_official: 15.0, foreign_matter_pct: 0.4, damage_pct: 0.4, broken_pct: 2.0 }
              as: QualityLabTech
              captures: { err: $.data.error_id }
            - call: "POST /mill/holds/${h_id}/release"
              payload: { resolution_note: "lab retest negative" }
              as: SafetyOfficer
            - call: "POST /mill/lots/${l_id}/grade"
              payload: { moisture_pct_official: 15.0, foreign_matter_pct: 0.4, damage_pct: 0.4, broken_pct: 2.0 }
              as: QualityLabTech
              captures: { st_ok: $.data.status, dry_ok: $.data.dry_weight_cwt }
          assert:
            - "captured err == ERR_ACTIVE_HOLD_BLOCKS_OPERATION (422) while the hold is ACTIVE"
            - "captured st_ok == GRADED after release"
            - "captured dry_ok == 352.84 (M 15.0: shrink 2.2988506% + 0.5 handling = 2.7988506%; 363 * 0.9720115 = 352.84)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: fumigation_half_open_adjacency_allowed
        grounds:
          - calculations.fumigation_window
          - entities.FumigationEvent.fields.clearance_at
        distinguishing_aspect: |
          Fumigation windows on a Bin use HALF-OPEN interval semantics
          [started_at, clearance_at): a successor starting at exactly the
          predecessor's clearance_at is legal, while one starting inside the
          window is rejected with ERR_FUMIGATION_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Season clock advanced to 2026-08-10T08:00:00Z; bin B-06; F1 ACTIVE started 2026-08-10T08:00:00Z exposure 48h aeration 24h (clearance 2026-08-13T08:00:00Z); F1 progressed ACTIVE->AERATING->CLEARED via clock"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/clock/set"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: MillAdmin
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-06", capacity_cwt: 500.00 }
              as: MillAdmin
              captures: { b_id: $.data.id }
            - call: "POST /mill/fumigation-events"
              payload: { season_id: "${s_id}", bin_id: "${b_id}", fumigant_code: "PH3", applicator_license: "LIC-7741", started_at: "2026-08-10T08:00:00Z", exposure_hours: 48, aeration_hours: 24 }
              as: FumigationTech
              captures: { f1: $.data.id }
            - call: "POST /mill/seasons/${s_id}/clock/set"
              payload: { to_iso8601: "2026-08-12T08:00:00Z" }
              as: MillAdmin
            - call: "POST /mill/fumigation-events/${f1}/begin-aeration"
              payload: {}
              as: FumigationTech
            - call: "POST /mill/seasons/${s_id}/clock/set"
              payload: { to_iso8601: "2026-08-13T08:00:00Z" }
              as: MillAdmin
            - call: "POST /mill/fumigation-events/${f1}/clear"
              payload: {}
              as: FumigationTech
              captures: { f1_st: $.data.status }
          trigger:
            - call: "POST /mill/fumigation-events"
              payload: { season_id: "${s_id}", bin_id: "${b_id}", fumigant_code: "PH3", applicator_license: "LIC-7741", started_at: "2026-08-12T08:00:00Z", exposure_hours: 24, aeration_hours: 12 }
              as: FumigationTech
              captures: { err: $.data.error_id }
            - call: "POST /mill/fumigation-events"
              payload: { season_id: "${s_id}", bin_id: "${b_id}", fumigant_code: "PH3", applicator_license: "LIC-7741", started_at: "2026-08-13T08:00:00Z", exposure_hours: 24, aeration_hours: 12 }
              as: FumigationTech
              captures: { f2: $.data.id, f2_st: $.data.status }
            - call: "GET /mill/bins/${b_id}"
              as: FumigationTech
              captures: { bin_st: $.data.status }
          assert:
            - "captured f1_st == CLEARED"
            - "captured err == ERR_FUMIGATION_WINDOW_CONFLICT (back-dated start 2026-08-12T08:00:00Z lies inside F1's window)"
            - "captured f2_st == ACTIVE (start exactly at F1 clearance 2026-08-13T08:00:00Z is NOT a conflict under half-open semantics)"
            - "captured bin_st == FUMIGATING"

      - name: packaging_line_changeover_buffer
        grounds:
          - calculations.packaging_line_overlap
          - entities.PackagingRun.fields.line_id
        distinguishing_aspect: |
          Packaging runs on a line use CLOSED intervals PLUS a 30-minute
          changeover buffer on both ends — different interval semantics than
          fumigation's half-open windows: a run starting exactly 30 minutes
          after the predecessor's end is legal, 29 minutes after is rejected,
          and the same window on the OTHER line is always legal.
        test_recipe:
          setup:
            - "Season; packaging run P1 on LINE_1 scheduled 2026-08-20T08:00:00Z-10:00:00Z"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/packaging-runs"
              payload: { season_id: "${s_id}", line_id: "LINE_1", brand_label: "MillHouse", package_size_kg: 25, units_planned: 100, starts_at: "2026-08-20T08:00:00Z", ends_at: "2026-08-20T10:00:00Z" }
              as: MillSupervisor
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /mill/packaging-runs"
              payload: { season_id: "${s_id}", line_id: "LINE_1", brand_label: "StoreBrand", package_size_kg: 10, units_planned: 50, starts_at: "2026-08-20T10:29:00Z", ends_at: "2026-08-20T11:30:00Z" }
              as: MillSupervisor
              captures: { err: $.data.error_id }
            - call: "POST /mill/packaging-runs"
              payload: { season_id: "${s_id}", line_id: "LINE_1", brand_label: "StoreBrand", package_size_kg: 10, units_planned: 50, starts_at: "2026-08-20T10:30:00Z", ends_at: "2026-08-20T11:30:00Z" }
              as: MillSupervisor
              captures: { p2: $.data.id, p2_st: $.data.status }
            - call: "POST /mill/packaging-runs"
              payload: { season_id: "${s_id}", line_id: "LINE_2", brand_label: "ChefLabel", package_size_kg: 5, units_planned: 40, starts_at: "2026-08-20T09:00:00Z", ends_at: "2026-08-20T10:00:00Z" }
              as: MillSupervisor
              captures: { p3_st: $.data.status }
          assert:
            - "captured err == ERR_LINE_SCHEDULE_CONFLICT (10:29 start is inside P1's 30-minute buffer)"
            - "captured p2_st == SCHEDULED (10:30 start: exactly one changeover buffer after P1's end — allowed)"
            - "captured p3_st == SCHEDULED (full time overlap with P1 but on LINE_2 — never a conflict)"

  - rule_id: compensating_invariant
    instances:
      - name: drying_reserve_cancel_preserves_bin_capacity
        grounds:
          - calculations.bin_capacity_allocation
          - state_machines.DryingRun.PLANNED_to_CANCELLED
          - entities.Bin.fields.available_cwt
        distinguishing_aspect: |
          Conserved quantity is MASS (bin cwt): the reserve/cancel pair must
          satisfy capacity_cwt - stock_cwt - reserved_cwt == 500.00 both before
          the reserve and after the cancel — no reservation drift.
        test_recipe:
          setup:
            - "Season INTAKE_OPEN; grower; bin B-07 cap 500.00 (available 500.00); SPOT lot net 300.00 graded M 16.0 -> dry 288.16, GRADED"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-07", capacity_cwt: 500.00 }
              as: MillAdmin
              captures: { b_id: $.data.id, avail0: $.data.available_cwt }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 42000, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 16.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { l_id: $.data.id }
            - call: "POST /mill/lots/${l_id}/grade"
              payload: { moisture_pct_official: 16.0, foreign_matter_pct: 0.4, damage_pct: 0.4, broken_pct: 2.0 }
              as: QualityLabTech
          trigger:
            - call: "POST /mill/drying-runs"
              payload: { season_id: "${s_id}", lot_ids: ["${l_id}"], destination_bin_id: "${b_id}" }
              as: DryerOperator
              captures: { dr_id: $.data.id }
            - call: "GET /mill/bins/${b_id}"
              as: DryerOperator
              captures: { res_mid: $.data.reserved_cwt, avail_mid: $.data.available_cwt }
            - call: "POST /mill/drying-runs/${dr_id}/cancel"
              payload: {}
              as: DryerOperator
            - call: "GET /mill/bins/${b_id}"
              as: DryerOperator
              captures: { res_end: $.data.reserved_cwt, stock_end: $.data.stock_cwt, avail_end: $.data.available_cwt }
          assert:
            - "captured avail0 == 500.00"
            - "captured res_mid == 288.16 and captured avail_mid == 211.84 (forward action)"
            - "captured res_end == 0 and captured stock_end == 0 and captured avail_end == 500.00 (compensating action)"
            - "invariant: capacity_cwt - stock_cwt - reserved_cwt identical before reserve and after cancel (500.00 == 500.00)"

      - name: dispute_cycle_preserves_paid_money
        grounds:
          - calculations.settlement_amount
          - state_machines.Settlement.APPROVED_to_DISPUTED
          - entities.Grower.fields.cumulative_paid_cents
        distinguishing_aspect: |
          Conserved quantity is MONEY (cents), a different quantity type than
          bin mass: across an APPROVED -> DISPUTED -> DRAFT -> ... -> PAID
          cycle, grower.cumulative_paid_cents must equal exactly the single
          final_net_cents (199398) — the dispute/revise path never double-pays
          or leaks a cent.
