# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2739 — Urology Practice & In-Office Procedure Suite
#
# Nine rule_id blocks, two differentiated instances each (18 instances total).
# Every grounds entry resolves to a declared element of SCAFFOLD.yaml §1.1–§1.7.
# Every setup_api_calls / trigger call is a §1.5 endpoint, every ${var} is bound
# by an earlier captures:, every expected_*_version is a captured placeholder,
# and every formula-derived assert is a pre-computed literal.
#
# Money is integer cents. The logical clock starts at 2026-08-01T00:00:00Z.

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dv_recall_protocol_vs_event_anchored
        grounds:
          - calculations.recall_due_date
          - entities.SurveillanceRecall.fields.due_basis
          - entities.SurveillanceRecall.fields.due_on
          - state_machines.SurveillanceRecall.OVERDUE_to_SCHEDULED_DUE
          - concurrency_rules[recall-create-stale-patient]
          - endpoints["POST /urology/recall-sweeps"]
        distinguishing_aspect: |
          This instance pins the recall_due_date variant pair: the same
          SurveillanceRecall row moves from due_on 2026-09-30 (PROTOCOL_ANCHORED,
          measured from its own anchor_date 2026-03-31) to due_on 2027-03-14
          (EVENT_ANCHORED, measured from the patient's latest COMPLETED
          CYSTOSCOPY on 2026-09-14) without any field of the row being written
          by a client. The other dual_variant instance switches variants on a
          money field of a different entity; this one switches on a calendar
          date and also flips a stored due_basis discriminator.
        test_recipe:
          setup:
            - "one urologist, one scheduler and one procedure nurse on the roster"
            - "patient Ivan Cole, egfr 60, not anticoagulated, no antibiotic allergy"
            - "room Cysto A of type CYSTO_SUITE with turnover_minutes 10"
            - "procedure type CYSTOSCOPY, base 20 minutes, cleanup HIGH, no scope, no antibiotic, no consignment, no required prep codes"
            - "logical clock at 2026-09-14T14:00:00Z"
            - "one CYSTOSCOPY case for that patient COMPLETED at that instant, so the patient has a completed bladder-cancer surveillance event"
            - "AFTER the case completes, one BLADDER_CANCER / INTERMEDIATE recall is opened with anchor_date 2026-03-31, so CASCADE A cannot have satisfied it"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Nina Park", npi: "1000000003", role_type: "RN" }
              as: PracticeAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-4101", full_name: "Ivan Cole", date_of_birth: "1962-04-11", primary_urologist_id: "${uro_id}", egfr: 60, anticoagulant_flag: false, antibiotic_allergy_class: "NONE" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id, room_v1: $.data.version }
            - call: "POST /urology/procedure-types"
              payload: { code: "CYSTOSCOPY", base_minutes: 20, cleanup_class: "HIGH", allowed_room_type: "CYSTO_SUITE", requires_scope: false, requires_specimen: false, requires_antibiotic: false, consignment_required: false, required_prep_codes: [] }
              as: PracticeAdmin
              captures: { cysto_type_id: $.data.id }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T14:00:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${cysto_type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T14:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_id: $.data.id }
            - call: "POST /urology/procedure-cases/${case_id}/schedule"
              payload: { expected_room_version: "${room_v1}" }
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "POST /urology/procedure-cases/${case_id}/clearance-review"
              payload: { decision: "CLEAR" }
              as: ProcedureNurse
              as_user_id: "${rn_id}"
            - call: "POST /urology/procedure-cases/${case_id}/check-in"
              payload: {}
              as: ProcedureNurse
              as_user_id: "${rn_id}"
            - call: "POST /urology/procedure-cases/${case_id}/complete"
              payload: {}
              as: Urologist
              as_user_id: "${uro_id}"
            - call: "GET /urology/patients/${pat_id}"
              payload: {}
              as: Urologist
              as_user_id: "${uro_id}"
              captures: { pat_v_now: $.data.version }
            - call: "POST /urology/surveillance-recalls"
              payload: { patient_id: "${pat_id}", protocol: "BLADDER_CANCER", risk_tier: "INTERMEDIATE", anchor_date: "2026-03-31", expected_patient_version: "${pat_v_now}" }
              as: Urologist
              as_user_id: "${uro_id}"
              captures: { recall_id: $.data.id }
          trigger:
            - call: "POST /urology/recall-sweeps"
              payload: {}
              as: Urologist
              as_user_id: "${uro_id}"
            - call: "GET /urology/surveillance-recalls/${recall_id}"
              payload: {}
              as: Urologist
              as_user_id: "${uro_id}"
          assert:
            - "the POST /urology/surveillance-recalls response had SurveillanceRecall.due_on == \"2026-09-30\" and SurveillanceRecall.due_basis == \"PROTOCOL_ANCHORED\" and SurveillanceRecall.interval_months == 6"
            - "after the sweep, SurveillanceRecall.${recall_id}.due_on == \"2027-03-14\" and SurveillanceRecall.${recall_id}.due_basis == \"EVENT_ANCHORED\""
            - "SurveillanceRecall.${recall_id}.status == \"SCHEDULED_DUE\" and SurveillanceRecall.${recall_id}.lapse_days == 0"
            - "the sweep response has recomputed_recall_count == 1, overdue_recall_count == 0, restored_recall_count == 0 and escalated_specimen_count == 0"
            - "the two variants disagree by 165 days on identical stored inputs, so an implementation that ignores completed surveillance cases returns 2026-09-30 and fails"

      - name: dv_consignment_provisional_vs_final
        grounds:
          - calculations.consignment_billing
          - entities.ConsignmentLot.fields.billed_amount_cents
          - entities.ConsignmentLot.fields.billing_basis
          - entities.ConsignmentLot.fields.billing_status
          - entities.ProcedureCase.fields.device_state
          - concurrency_rules[device-reservation-stale-lot]
        distinguishing_aspect: |
          This instance pins the consignment_billing variant pair on one
          unchanged unit count: three biopsy needles held by one case bill 7106
          cents under PROVISIONAL (markup 0.185, RESERVED lines only) and 6807
          cents under FINAL (markup 0.185 minus the 0.05 volume rebate that
          activates at quantity_consumed >= 3, CONSUMED lines only), a 299-cent
          delta produced solely by which variant ran. Unlike the recall
          instance, the variant here is selected by the endpoint that fired
          (device-reservation vs complete), not by a stored discriminator being
          recomputed on a sweep.
        test_recipe:
          setup:
            - "one urologist, one scheduler, one procedure nurse"
            - "patient Rosa Vance, egfr 60, not anticoagulated"
            - "room Cysto A of type CYSTO_SUITE with turnover_minutes 10"
            - "procedure type PROSTATE_BIOPSY, base 30 minutes, cleanup LOW, no scope, no antibiotic, consignment required with sku BX-NEEDLE-18G, no required prep codes"
            - "consignment lot of 10 biopsy needles at unit_price_cents 1999 expiring 2027-06-30"
            - "one case holding 3 units RESERVED, scheduled and checked in at 2026-09-14T08:00:00Z"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Nina Park", npi: "1000000003", role_type: "RN" }
              as: PracticeAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-4102", full_name: "Rosa Vance", date_of_birth: "1958-02-02", primary_urologist_id: "${uro_id}", egfr: 60, anticoagulant_flag: false, antibiotic_allergy_class: "NONE" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id, room_v1: $.data.version }
            - call: "POST /urology/procedure-types"
              payload: { code: "PROSTATE_BIOPSY", base_minutes: 30, cleanup_class: "LOW", allowed_room_type: "CYSTO_SUITE", requires_scope: false, requires_specimen: false, requires_antibiotic: false, consignment_required: true, single_use_device_sku: "BX-NEEDLE-18G", required_prep_codes: [] }
              as: PracticeAdmin
              captures: { bx_type_id: $.data.id }
            - call: "POST /urology/consignment-lots"
              payload: { supplier_name: "Meridian Devices", sku: "BX-NEEDLE-18G", device_class: "BIOPSY_NEEDLE", quantity_received: 10, unit_price_cents: 1999, lot_expires_on: "2027-06-30" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${bx_type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T08:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_id: $.data.id }
            - call: "POST /urology/procedure-cases/${case_id}/device-reservation"
              payload: { consignment_lot_id: "${lot_id}", quantity: 3, expected_lot_version: "${lot_v1}" }
              as: ProcedureNurse
              as_user_id: "${rn_id}"
            - call: "POST /urology/procedure-cases/${case_id}/schedule"
              payload: { expected_room_version: "${room_v1}" }
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "POST /urology/procedure-cases/${case_id}/clearance-review"
              payload: { decision: "CLEAR" }
              as: ProcedureNurse
              as_user_id: "${rn_id}"
            - call: "POST /urology/procedure-cases/${case_id}/check-in"
              payload: {}
              as: ProcedureNurse
              as_user_id: "${rn_id}"
          trigger:
            - call: "GET /urology/consignment-lots/${lot_id}"
              payload: {}
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases/${case_id}/complete"
              payload: {}
              as: Urologist
              as_user_id: "${uro_id}"
            - call: "GET /urology/consignment-lots/${lot_id}"
              payload: {}
              as: PracticeAdmin
          assert:
            - "trigger call 1 (before completion) returns ConsignmentLot.billed_amount_cents == 7106, billing_basis == \"PROVISIONAL\", billing_status == \"CONSIGNED\", quantity_reserved == 3, quantity_available == 7, quantity_consumed == 0"
            - "trigger call 3 (after completion) returns ConsignmentLot.billed_amount_cents == 6807, billing_basis == \"FINAL\", billing_status == \"PARTIALLY_INVOICED\", quantity_reserved == 0, quantity_consumed == 3, quantity_available == 7"
            - "the FINAL minus PROVISIONAL delta is exactly -299 cents on identical unit counts"
            - "ProcedureCase.${case_id}.device_state == \"CONSUMED\" and ProcedureCase.${case_id}.schedule_status == \"COMPLETED\""
            - "quantity_received 10 == quantity_available 7 + quantity_reserved 0 + quantity_consumed 3 + quantity_returned 0 + quantity_wasted 0 at both observations"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: cf_occupancy_window_three_way
        grounds:
          - calculations.case_occupancy_window
          - entities.ProcedureCase.fields.procedure_minutes
          - entities.ProcedureCase.fields.turnover_minutes
          - entities.ProcedureCase.fields.block_end_at
          - entities.ProcedureType.fields.cleanup_class
          - entities.Patient.fields.anticoagulant_flag
          - entities.Patient.fields.egfr
        distinguishing_aspect: |
          Mode (a) of the rule: one formula reading six inputs across three
          entities (ProcedureType.base_minutes, ProcedureType.cleanup_class,
          ProcedureType.requires_scope, ProcedureRoom.turnover_minutes,
          Patient.anticoagulant_flag, Patient.egfr) with two additive
          conditional branches and a nested max() floor. Three cases created
          from one shared configuration land on three different block_end_at
          values, and one of them (the urodynamics case) is decided by the
          MIN_TURNOVER_FLOOR_MIN floor rather than by the room's own turnover.
          The other combinatorial instance is mode (b): a pinned rounding order.
        test_recipe:
          setup:
            - "one urologist and one scheduler"
            - "patient Ivan Cole with egfr 60 and anticoagulant_flag false"
            - "patient Otto Blaine with egfr 40 and anticoagulant_flag true"
            - "room Cysto A: CYSTO_SUITE, turnover_minutes 10"
            - "room Uro Lab: URODYNAMICS_LAB, turnover_minutes 8"
            - "type CYSTOSCOPY: base 20, cleanup HIGH, scope required, antibiotic required"
            - "type URODYNAMICS: base 45, cleanup LOW, no scope, no antibiotic"
            - "type PROSTATE_BIOPSY: base 30, cleanup HIGH, scope required, antibiotic required"
            - "three DRAFT cases, none scheduled, so no occupancy conflict rule can interfere"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-4201", full_name: "Ivan Cole", date_of_birth: "1962-04-11", primary_urologist_id: "${uro_id}", egfr: 60, anticoagulant_flag: false, antibiotic_allergy_class: "NONE" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_hi_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-4202", full_name: "Otto Blaine", date_of_birth: "1949-07-30", primary_urologist_id: "${uro_id}", egfr: 40, anticoagulant_flag: true, antibiotic_allergy_class: "NONE" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_lo_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { cysto_room_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Uro Lab", room_type: "URODYNAMICS_LAB", turnover_minutes: 8, accreditation_body: "AIUM", accreditation_expires_on: "2027-01-31" }
              as: PracticeAdmin
              captures: { uds_room_id: $.data.id }
            - call: "POST /urology/procedure-types"
              payload: { code: "CYSTOSCOPY", base_minutes: 20, cleanup_class: "HIGH", allowed_room_type: "CYSTO_SUITE", requires_scope: true, requires_antibiotic: true, required_prep_codes: [] }
              as: PracticeAdmin
              captures: { cysto_type_id: $.data.id }
            - call: "POST /urology/procedure-types"
              payload: { code: "URODYNAMICS", base_minutes: 45, cleanup_class: "LOW", allowed_room_type: "URODYNAMICS_LAB", requires_scope: false, requires_antibiotic: false, required_prep_codes: [] }
              as: PracticeAdmin
              captures: { uds_type_id: $.data.id }
            - call: "POST /urology/procedure-types"
              payload: { code: "PROSTATE_BIOPSY", base_minutes: 30, cleanup_class: "HIGH", allowed_room_type: "CYSTO_SUITE", requires_scope: true, requires_antibiotic: true, required_prep_codes: [] }
              as: PracticeAdmin
              captures: { bx_type_id: $.data.id }
          trigger:
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_hi_id}", procedure_type_id: "${cysto_type_id}", room_id: "${cysto_room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T14:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_cysto_id: $.data.id }
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_hi_id}", procedure_type_id: "${uds_type_id}", room_id: "${uds_room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-16T10:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_uds_id: $.data.id }
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_lo_id}", procedure_type_id: "${bx_type_id}", room_id: "${cysto_room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-15T09:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_bx_id: $.data.id }
          assert:
            - "ProcedureCase.${case_cysto_id}.procedure_minutes == 20 and turnover_minutes == 40 and scheduled_end_at == \"2026-09-14T14:20:00.000Z\" and block_end_at == \"2026-09-14T15:00:00.000Z\""
            - "ProcedureCase.${case_uds_id}.procedure_minutes == 45 and turnover_minutes == 15 and scheduled_end_at == \"2026-09-16T10:45:00.000Z\" and block_end_at == \"2026-09-16T11:00:00.000Z\""
            - "ProcedureCase.${case_bx_id}.procedure_minutes == 55 and turnover_minutes == 40 and scheduled_end_at == \"2026-09-15T09:55:00.000Z\" and block_end_at == \"2026-09-15T10:35:00.000Z\""
            - "the urodynamics turnover is 15, not the room's 8, because MIN_TURNOVER_FLOOR_MIN dominates max(8 * 1, 15)"
            - "the biopsy procedure_minutes is 55 = 30 base + 15 ANTICOAG_EXTRA_MIN + 10 RENAL_EXTRA_MIN; an implementation that applies the anticoagulant surcharge to the cystoscopy case would return 35 there and fail"

      - name: cf_billing_round_per_line_then_sum
        grounds:
          - calculations.consignment_billing
          - entities.ConsignmentLot.fields.billed_amount_cents
          - entities.ConsignmentLot.fields.unit_price_cents
          - entities.ProcedureCase.fields.device_quantity
          - concurrency_rules[device-reservation-stale-lot]
        distinguishing_aspect: |
          Mode (b) of the rule: two lots with identical unit_price_cents 1999 and
          identical total held quantity 3 bill DIFFERENT amounts because the
          rounding order is pinned to round-per-line-then-sum. Lot A is held by
          three one-unit cases (three lines of round_half_up(2368.815) = 2369 ->
          7107) and lot B by one three-unit case (one line of
          round_half_up(7106.445) = 7106). The 1-cent gap is only observable
          because the order is pinned; the other combinatorial instance varies
          inputs, this one varies only the arithmetic sequence.
        test_recipe:
          setup:
            - "one urologist, one scheduler, one procedure nurse"
            - "patient Rosa Vance, egfr 60"
            - "room Cysto A: CYSTO_SUITE, turnover_minutes 10"
            - "type PROSTATE_BIOPSY with consignment required and sku BX-NEEDLE-18G"
            - "lot A from Meridian Devices and lot B from Anselm Surgical, each 10 units at unit_price_cents 1999, both expiring 2027-06-30"
            - "four DRAFT cases; device reservation has no schedule_status precondition so none is scheduled"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Nina Park", npi: "1000000003", role_type: "RN" }
              as: PracticeAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-4203", full_name: "Rosa Vance", date_of_birth: "1958-02-02", primary_urologist_id: "${uro_id}", egfr: 60 }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /urology/procedure-types"
              payload: { code: "PROSTATE_BIOPSY", base_minutes: 30, cleanup_class: "LOW", allowed_room_type: "CYSTO_SUITE", requires_scope: false, requires_antibiotic: false, consignment_required: true, single_use_device_sku: "BX-NEEDLE-18G", required_prep_codes: [] }
              as: PracticeAdmin
              captures: { bx_type_id: $.data.id }
            - call: "POST /urology/consignment-lots"
              payload: { supplier_name: "Meridian Devices", sku: "BX-NEEDLE-18G", device_class: "BIOPSY_NEEDLE", quantity_received: 10, unit_price_cents: 1999, lot_expires_on: "2027-06-30" }
              as: PracticeAdmin
              captures: { lot_a_id: $.data.id, lot_a_v1: $.data.version }
            - call: "POST /urology/consignment-lots"
              payload: { supplier_name: "Anselm Surgical", sku: "BX-NEEDLE-18G", device_class: "BIOPSY_NEEDLE", quantity_received: 10, unit_price_cents: 1999, lot_expires_on: "2027-06-30" }
              as: PracticeAdmin
              captures: { lot_b_id: $.data.id, lot_b_v1: $.data.version }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T07:00:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${bx_type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T08:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_a1_id: $.data.id }
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${bx_type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T09:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_a2_id: $.data.id }
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${bx_type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T10:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_a3_id: $.data.id }
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${bx_type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T11:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
