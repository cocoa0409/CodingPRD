          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The role check sits at priority 20, above the payload check at 25 and the path-id check at 30, so a forbidden role must get 403 even with a bogus resource id and an empty body. Shared operations are the counter-example: POST /content-edits is open to two roles and closed to the other five."
