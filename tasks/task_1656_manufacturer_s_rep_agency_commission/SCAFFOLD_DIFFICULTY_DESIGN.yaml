  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: registration_reject_resubmit_renew_cycle
        grounds:
          - state_machines.ProjectRegistration.SUBMITTED_to_REJECTED
          - state_machines.ProjectRegistration.REJECTED_to_SUBMITTED
          - state_machines.ProjectRegistration.APPROVED_to_APPROVED
        distinguishing_aspect: |
          Entity = ProjectRegistration, shape = cyclic: SUBMITTED->REJECTED->
          SUBMITTED (revision loop) plus APPROVED->APPROVED renewal self-loop
          that mutates protection_end (+90d) and renewals_used. End literals:
          180d from 2026-08-01 = 2027-01-28; +90d renewal = 2027-04-28.
        test_recipe:
          setup:
            - "BASE principal/agreement/schedule/reps/customer"
            - "reg1 submitted by R1, rejected by principal, resubmitted by R1, approved at clock 2026-08-01 -> protection [2026-08-01T00:00:00Z, 2027-01-28T00:00:00Z)"
            - "clock advanced into the renewal window (>= protection_end - 30d = 2026-12-29): 2027-01-10"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
