      - name: vehicle_parallel_dimensions_move_independently
        claim_type: Valid Transition
        grounds:
          - state_machines.Vehicle
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "Parallel state dimensions on Vehicle: telematics can reach ACTIVE while delivery is still ASSEMBLED, delivery can move to IN_TRANSIT while telematics later suspends — each dimension's transitions leave the other untouched."
        test_recipe:
          setup:
            - "Logical clock set; base order CONFIRMED; vehicle 1 registered (ASSEMBLED / OFFLINE)."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_mod1
            - *c_mod1_qa
            - *c_mod1_pass
            - *c_mod2
            - *c_mod2_qa
            - *c_mod2_pass
            - *c_order
            - *c_submit
            - *c_confirm
            - *c_veh1
            - *c_read1
            - *c_veh2
          trigger:
            - *c_t1p
            - *c_t1a
            - *c_d1t
            - call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "SUSPENDED" }
