          - calculations.csed_date
        distinguishing_aspect: >
          Date <= boundary on the csed_date metric via POST
          /tax-accounts/{id}/sweep-expired-csed: a period whose csed_date == current_utc
          (2020-01-16, exactly assessment 2010-01-15 + 3653 days) IS swept (the check is
          `csed_date <= now`, inclusive). Different metric (date vs amount) and different
          endpoint than the offer/RCP boundary.
        test_recipe:
          setup:
            - "Account with one period assessed 1000000 on 2010-01-15 (csed 2020-01-16); a payment posts so the period is IN_COLLECTION with balance > 0; clock set to exactly 2020-01-16."
          setup_api_calls:
