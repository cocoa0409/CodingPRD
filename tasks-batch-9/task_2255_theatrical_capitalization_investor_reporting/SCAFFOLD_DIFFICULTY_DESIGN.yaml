  rationale: |
    Recoupment is a >= comparison on cents while recoupment_pct is rounded to 4 decimals,
    so a one-cent gap is invisible in the percentage but decisive for the status flip. The
    offering ceiling is likewise an exact-cents comparison, and break-even shifts by a
    whole 842,105 cents depending on whether the aggregate pool floor is in force.
