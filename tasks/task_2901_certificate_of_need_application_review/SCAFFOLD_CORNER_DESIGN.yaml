# Scaffold Corner Design (§1.9) — breadth probe for
# task_2901_certificate_of_need_application_review.
#
# Walked row-by-row against references/claim-extraction-guide.md's nine sections
# and this scaffold's §1.1-§1.7 surface. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry `excluded_because:` stubs naming the
# covering §1.8 instance. Every recipe below drives empty-DB state through
# §1.5 endpoints only; the logical clock starts at 2026-08-01T00:00:00Z.

scaffold_corner_design:

  - section: entities
    instances:

      - name: health_service_area_creation_returns_declared_fields_with_zeroed_counters
        claim_type: Creation
        grounds:
          - entities.HealthServiceArea
          - endpoints[POST /health-service-areas]
        distinguishing_aspect: "POST /health-service-areas returns 201 with every §1.1 field present, the two system/computed counters at 0, status defaulted to ACTIVE, and the four common fields populated."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id, hsa_version: $.data.version }
          assert:
            - "HTTP status == 201"
            - "response_type == object and meta.api_request_id is present"
            - "HealthServiceArea.${hsa_id}.code == HSA-NORTH"
            - "HealthServiceArea.${hsa_id}.name == North Planning Area"
            - "HealthServiceArea.${hsa_id}.population_projection == 54750"
            - "HealthServiceArea.${hsa_id}.existing_licensed_beds == 70"
            - "HealthServiceArea.${hsa_id}.approved_unimplemented_beds == 0"
            - "HealthServiceArea.${hsa_id}.capital_authorization_committed_cents == 0"
            - "HealthServiceArea.${hsa_id}.status == ACTIVE"
            - "${hsa_version} == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: hearing_room_defaults_buffer_to_sixty_minutes_and_status_available
        claim_type: Defaults
        grounds:
          - entities.HearingRoom.fields.setup_buffer_minutes
          - entities.HearingRoom.fields.status
          - endpoints[POST /hearing-rooms]
        distinguishing_aspect: "Omitting the optional setup_buffer_minutes and status inputs yields exactly the declared defaults 60 and AVAILABLE, not null."
        test_recipe:
          setup:
            - "Empty database; the clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /hearing-rooms"
              payload: { name: "BOARD-A", seating_capacity: 120 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { room_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "HearingRoom.${room_id}.setup_buffer_minutes == 60"
            - "HearingRoom.${room_id}.status == AVAILABLE"
            - "HearingRoom.${room_id}.seating_capacity == 120"
            - "HearingRoom.${room_id}.version == 1"

      - name: applicant_get_returns_stored_row_with_standing_and_strike_defaults
        claim_type: Retrieval
        grounds:
          - entities.Applicant
          - endpoints[GET /applicants/{id}]
        distinguishing_aspect: "GET /applicants/{id} returns the stored row with the system-managed standing GOOD and compliance_strike_count 0 that creation initialised — a read must not recompute them."
        test_recipe:
          setup:
            - "Applicant Northside Hospital was created at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
          trigger:
            - call: "GET /applicants/${appl_a_id}"
              as: IntakeAnalyst
              as_user_id: "intake-1"
              captures: { read_standing: $.data.standing, read_strikes: $.data.compliance_strike_count }
          assert:
            - "HTTP status == 200"
            - "${read_standing} == GOOD"
            - "${read_strikes} == 0"
            - "Applicant.${appl_a_id}.legal_name == Northside Hospital"
            - "Applicant.${appl_a_id}.organization_type == HOSPITAL"
            - "Applicant.${appl_a_id}.version == 1"

      - name: applications_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /applications]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two DRAFT applications in one cycle, GET /applications?batching_cycle_id=...&limit=1&offset=0 returns exactly one row with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "Cycle 1 in HSA-NORTH is OPEN_FOR_LOI with two letters of intent, one from Northside and one from Lakeview, each converted into a DRAFT application."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Lakeview Medical", organization_type: "HOSPITAL", contact_email: "filings@lakeview.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_b_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "12-bed acute care expansion", capital_cost_cents: 800000000, bed_delta: 12 }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { loi_a_id: $.data.id }
            - call: "POST /applications"
              payload: { loi_id: "${loi_a_id}", requested_bed_count: 12, projected_capital_cost_cents: 800000000, narrative: "Northside 12-bed acute care application", partial_award_acceptable: false }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_b_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "10-bed acute care expansion", capital_cost_cents: 700000000, bed_delta: 10 }
              as: Applicant
              as_user_id: "${appl_b_id}"
              captures: { loi_b_id: $.data.id }
            - call: "POST /applications"
              payload: { loi_id: "${loi_b_id}", requested_bed_count: 10, projected_capital_cost_cents: 700000000, narrative: "Lakeview 10-bed acute care application", partial_award_acceptable: true }
              as: Applicant
              as_user_id: "${appl_b_id}"
              captures: { app_b_id: $.data.id }
          trigger:
            - call: "GET /applications?batching_cycle_id=${cycle_id}&limit=1&offset=0"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /applications?batching_cycle_id=${cycle_id}&limit=1&offset=1"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "both calls return HTTP status 200 with response_type == array"
            - "first call: data length == 1, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "first call: the single row's id == ${app_a_id} (created_at ASC ordering)"
            - "second call: data length == 1, total_count == 2, has_more == false, offset == 1"
            - "second call: the single row's id == ${app_b_id}"

      - name: get_applicant_with_unknown_id_returns_applicant_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_APPLICANT_NOT_FOUND]
          - endpoints[GET /applicants/{id}]
        distinguishing_aspect: "A syntactically valid but unpersisted applicant id on GET /applicants/{id} returns ERR_APPLICANT_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Applicant Northside exists, so the store is non-empty and the 404 cannot come from an empty table."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
          trigger:
            - call: "GET /applicants/11111111-1111-4111-8111-111111111111"
              as: IntakeAnalyst
              as_user_id: "intake-1"
              captures: { not_found_error: $.data.error_id }
          assert:
            - "${not_found_error} == ERR_APPLICANT_NOT_FOUND"
            - "HTTP status == 404"
            - "response_type == error and data.message is a non-empty string"
            - "GET /applicants/${appl_a_id} still returns 200"

      - name: health_service_area_creation_without_population_projection_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /health-service-areas]
        distinguishing_aspect: "population_projection has source input and no default, so omitting it must return ERR_INVALID_REQUEST (400) rather than defaulting to 0."
        test_recipe:
          setup:
            - "Empty database; the clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { shape_error: $.data.error_id }
          assert:
            - "${shape_error} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "no HealthServiceArea row was persisted: a subsequent POST /health-service-areas with the same code HSA-NORTH and population_projection 54750 succeeds with 201 (the unique-code rule is not tripped)"

      - name: applicant_creation_with_unknown_organization_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Applicant.fields.organization_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "organization_type is constrained to {HOSPITAL, NURSING_FACILITY, PHYSICIAN_GROUP, OTHER}; the out-of-set value CLINIC must be rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty database; the clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "CLINIC", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { enum_error: $.data.error_id }
          assert:
            - "${enum_error} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "no Applicant row was persisted; the same legal_name with organization_type HOSPITAL then succeeds with 201"

      - name: public_comment_is_immutable_row_without_version_or_update_path
        claim_type: Immutability
        grounds:
          - entities.PublicComment
          - endpoints[POST /applications/{id}/public-comments]
          - endpoints[GET /applications/{id}/public-comments]
        distinguishing_aspect: "PublicComment declares common_fields: false, so its response carries id/created_at and filed_at but no version and no updated_at, and §1.5 exposes no update or delete path for it."
        test_recipe:
          setup:
            - "Cycle 1 is OPEN_FOR_APPLICATIONS and Northside's application A is SUBMITTED; the clock is 2026-08-01T00:00:00Z, inside the comment period that closes 2026-08-25T00:00:00Z."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "12-bed acute care expansion", capital_cost_cents: 800000000, bed_delta: 12 }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { loi_a_id: $.data.id }
            - call: "POST /applications"
              payload: { loi_id: "${loi_a_id}", requested_bed_count: 12, projected_capital_cost_cents: 800000000, narrative: "Northside 12-bed acute care application", partial_award_acceptable: false }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "OPEN_FOR_APPLICATIONS" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /applications/${app_a_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_a_id}"
          trigger:
            - call: "POST /applications/${app_a_id}/public-comments"
              payload: { commenter_display_name: "Jane Resident", stance: "OPPOSE", body: "The community already has sufficient acute care capacity." }
              as: PublicParticipant
              as_user_id: "public-1"
              captures: { comment_id: $.data.id, comment_filed_at: $.data.filed_at }
          assert:
            - "HTTP status == 201"
            - "PublicComment.${comment_id}.commenter_user_id == public-1"
            - "PublicComment.${comment_id}.stance == OPPOSE"
            - "${comment_filed_at} == 2026-08-01T00:00:00Z"
            - "the response data object contains no version field and no updated_at field"
            - "GET /applications/${app_a_id}/public-comments returns total_count 1 and the same row without version"

      - name: application_creation_leaves_scoring_and_decision_fields_at_declared_zero_state
        claim_type: Computed Fields
        grounds:
          - entities.Application.fields.comparative_score
          - entities.Application.fields.score_sheet_count
          - entities.Application.fields.allocated_bed_count
          - entities.Application.fields.completeness_round_count
          - endpoints[POST /applications]
        distinguishing_aspect: "A freshly created application reports comparative_score null, score_sheet_count 0, allocated_bed_count 0, completeness_round_count 0, denial_reason null, decision_at null and appeal_window_closes_at null, and its applicant_id/batching_cycle_id are copied from the letter of intent rather than supplied by the client."
        test_recipe:
          setup:
            - "Cycle 1 is OPEN_FOR_LOI and Northside filed a reviewable letter of intent (capital_cost_cents 800000000, bed_delta 12)."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "12-bed acute care expansion", capital_cost_cents: 800000000, bed_delta: 12 }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { loi_a_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { loi_id: "${loi_a_id}", requested_bed_count: 12, projected_capital_cost_cents: 800000000, narrative: "Northside 12-bed acute care application" }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { app_a_id: $.data.id, app_status: $.data.status, app_partial: $.data.partial_award_acceptable }
          assert:
            - "HTTP status == 201"
            - "${app_status} == DRAFT"
            - "${app_partial} == false (declared default applied when the optional input is omitted)"
            - "Application.${app_a_id}.applicant_id == ${appl_a_id}"
            - "Application.${app_a_id}.batching_cycle_id == ${cycle_id}"
            - "Application.${app_a_id}.comparative_score == null"
            - "Application.${app_a_id}.score_sheet_count == 0"
            - "Application.${app_a_id}.allocated_bed_count == 0"
            - "Application.${app_a_id}.completeness_round_count == 0"
            - "Application.${app_a_id}.denial_reason == null"
            - "Application.${app_a_id}.decision_at == null"
            - "Application.${app_a_id}.appeal_window_closes_at == null"
            - "LetterOfIntent.${loi_a_id}.status == CONVERTED"

      - name: letter_of_intent_with_unknown_hsa_id_returns_hsa_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_HSA_NOT_FOUND]
          - endpoints[POST /letters-of-intent]
        distinguishing_aspect: "Flat topology: every body foreign key is resolved in input order, so a letter of intent naming a persisted applicant_id but an unpersisted hsa_id fails with ERR_HSA_NOT_FOUND (404), not with ERR_CYCLE_NOT_FOUND or 201."
        test_recipe:
          setup:
            - "Applicant Northside, HSA-NORTH, the ACUTE_CARE_BEDS formula and cycle 1 all exist; only the hsa_id sent on the letter of intent is a non-existent id."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "22222222-2222-4222-8222-222222222222", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "12-bed acute care expansion", capital_cost_cents: 800000000, bed_delta: 12 }
              as: Applicant
