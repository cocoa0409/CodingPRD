            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CAP3", specialty_track_id: "${track_id}", question_text: "Capacity filler consult three regarding exercise thresholds after stent placement.", icd10_primary: "Z95", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CAP4", specialty_track_id: "${track_id}", question_text: "Capacity filler consult four regarding aspirin therapy in primary prevention setting.", icd10_primary: "Z13", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CAP5", specialty_track_id: "${track_id}", question_text: "Capacity filler consult five regarding salt intake targets in treated hypertension.", icd10_primary: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}" }
          trigger:
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-CAP6", specialty_track_id: "${track_id}", question_text: "Sixth consult about palpitations workup when the panel member is fully loaded.", icd10_primary: "R00", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { c6_status: $.data.status, c6_memb: $.data.assigned_membership_id } }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { m_open: $.data.open_consult_count } }
          assert:
            - "after five assignments open_consult_count == 5 (== MAX_OPEN_CONSULTS, boundary)"
            - "sixth consult: status == QUEUED and assigned_membership_id == null (strict < makes 5 ineligible)"

      - name: compensation_dual_variant_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.final_response_compensation]
        excluded_because:
          difficulty_instance: provisional_vs_posted_response_compensation_diverge
          rationale: "Both variants and their divergence are asserted there."

      - name: avoided_visit_dual_variant_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.avoided_visit_counts]
        excluded_because:
          difficulty_instance: attributed_vs_conservative_avoided_visits_diverge
          rationale: "Both variants and their divergence are asserted there."

      - name: rebuke_cascade_ordering_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.QualityReview.PENDING_to_COMPLETED]
        excluded_because:
          difficulty_instance: rebuke_cascades_review_response_ledger_standing
          rationale: "The depth-4 cascade is asserted link-by-link there."

      - name: expiry_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.ConsultRequest.ASSIGNED_to_EXPIRED]
        excluded_because:
          difficulty_instance: clock_sweep_expiry_cascades_to_membership_counters
          rationale: "Both expiry branches and membership counter effects are asserted there."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: create_then_get_reflects_writes_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a GET issued right after a write returns the post-write state — the created consult's status (ASSIGNED), computed sla_due_at, and version are all visible in the very next request, and the version increments visibly after a PATCH."
        test_recipe:
          setup: ["one assigned consult"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000008001" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000008001" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-IM1", specialty_track_id: "${track_id}", question_text: "Routine question about ambulatory blood pressure monitoring interpretation thresholds.", icd10_primary: "R03", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id, cv: $.data.version } }
          trigger:
            - { call: "GET /econsult/consult-requests/${cons_id}", as: ProgramCoordinator, captures: { g_status: $.data.status, g_sla: $.data.sla_due_at, g_v: $.data.version } }
            - { call: "PATCH /econsult/consult-requests/${cons_id}", payload: { icd10_primary: "R04", expected_consult_version: "${cv}" }, as: ReferringProvider, as_user_id: "${prov_id}" }
            - { call: "GET /econsult/consult-requests/${cons_id}", as: ProgramCoordinator, captures: { g2_v: $.data.version, g2_icd: $.data.icd10_primary } }
          assert:
            - "GET right after create: status == ASSIGNED, sla_due_at == 2026-06-03T00:00:00Z, version == ${cv}"
            - "GET right after PATCH: version == ${cv} + 1 and icd10_primary == R04 — no read lag"
