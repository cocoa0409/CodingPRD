      - name: same_jurisdiction_transfer_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=17]
          - errors[ERR_SAME_JURISDICTION_TRANSFER]
          - state_machines.Case.UNDER_INVESTIGATION_to_TRANSFER_PENDING
        distinguishing_aspect: |
          Transfer to == from guard: requesting a transfer whose to_jurisdiction_id equals the
          case's current jurisdiction returns 409 ERR_SAME_JURISDICTION_TRANSFER (after the OCC
          version check passes).
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1; case CS in J1 interviewed (UNDER_INVESTIGATION)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
