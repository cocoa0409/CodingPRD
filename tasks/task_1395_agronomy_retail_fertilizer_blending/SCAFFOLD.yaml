  - method: PATCH
    path: "/agronomy/blend-orders/{orderId}"
    description: "Update a QUOTED order's lines/acres/price inputs; recomputes provisional pricing; OCC on order version"
    roles: [Grower, Agronomist]
    code: 200
    input: [expected_blend_order_version, "acres?", "price_mode?", "prepay_contract_id?", "lines?"]
    output: BlendOrder
    side_effects: ["provisional pricing recomputed", "increments BlendOrder.version by 1"]
  - method: POST
    path: "/agronomy/blend-orders/{orderId}/book"
    description: "Book a QUOTED order: full gate chain (grower, NMP, N cap, P restriction, recommendation, prepay/credit, inventory FIFO reservation)"
    roles: [Grower, Agronomist]
    code: 200
    input: []
    output: BlendOrder
    side_effects: ["inventory reservation (FIFO)", "payment_status UNPAID -> PREPAY_APPLIED | CREDIT_APPROVED", "increments BlendOrder.version by 1", "increments GrowerAccount.version by 1"]
  - method: POST
    path: "/agronomy/blend-orders/{orderId}/requote"
    description: "BOOKED -> QUOTED: releases reservations and payment posture; reprices at current sheets"
    roles: [Grower, Agronomist]
    code: 200
    input: []
    output: BlendOrder
    side_effects: ["reservations released", "payment_status -> UNPAID", "provisional repricing", "increments BlendOrder.version by 1", "increments GrowerAccount.version by 1"]
  - method: POST
    path: "/agronomy/blend-orders/{orderId}/cancel"
    description: "Cancel a QUOTED/BOOKED/SCHEDULED order; releases reservations and voids scheduled batch"
    roles: [Grower, Agronomist]
    code: 200
    input: ["reason?"]
    output: BlendOrder
    side_effects: ["reservations released; payment_status -> CANCELLED", "SCHEDULED batch -> VOIDED when present", "increments BlendOrder.version by 1", "increments GrowerAccount.version by 1"]
  - method: POST
    path: "/agronomy/blend-orders/{orderId}/confirm-application"
    description: "Grower confirms application (DELIVERED -> APPLIED_CONFIRMED; CLOSED when PAID)"
    roles: [Grower]
    code: 200
    input: []
    output: BlendOrder
    side_effects: ["CLOSED bubble-up when payment_status == PAID; season_closed_tons credited", "increments BlendOrder.version by 1"]
  - method: GET
    path: "/agronomy/blend-orders/{orderId}/lines"
    description: "List an order's blend lines"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: BlendLine[]
    side_effects: []
  - method: GET
    path: "/agronomy/blend-lines/{lineId}"
    description: "Get a blend line"
    roles: *all_roles
    code: 200
    input: []
    output: BlendLine
    side_effects: []
  - method: GET
    path: "/agronomy/blend-lines"
    description: "List blend lines (filtered)"
    roles: *all_roles
    code: 200
    input: ["product_id?", "blend_order_id?", "limit?", "offset?"]
    output: BlendLine[]
    side_effects: []

  # --- Blender / BlendBatch ---
  - method: POST
    path: "/agronomy/blenders"
    description: "Register a blender"
    roles: [PlantOperator, BranchAdmin]
    code: 201
    input: [name, site_code, capacity_tons_per_hour, form_supported]
    output: Blender
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/agronomy/blenders"
    description: "List blenders"
    roles: *all_roles
    code: 200
    input: ["site_code?", "status?", "limit?", "offset?"]
    output: Blender[]
    side_effects: []
  - method: GET
    path: "/agronomy/blenders/{blenderId}"
    description: "Get a blender"
    roles: *all_roles
    code: 200
    input: []
    output: Blender
    side_effects: []
  - method: POST
    path: "/agronomy/blenders/{blenderId}/out-of-service"
    description: "Take a blender out of service"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Blender
    side_effects: ["status -> OUT_OF_SERVICE", "increments Blender.version by 1"]
  - method: POST
    path: "/agronomy/blenders/{blenderId}/return-to-service"
    description: "Return a blender to service (blocked while its site BLENDER_SITE permit is not ACTIVE)"
    roles: [PlantOperator]
    code: 200
    input: []
    output: Blender
    side_effects: ["status -> ACTIVE", "increments Blender.version by 1"]
  - method: POST
    path: "/agronomy/blend-orders/{orderId}/batches"
    description: "Schedule a batch for a BOOKED order on a blender; window conflict + permit + form + payment-dimension gates"
    roles: [PlantOperator]
    code: 201
    input: [blender_id, scheduled_start, scheduled_end]
    output: BlendBatch
    side_effects: ["order fulfillment BOOKED -> SCHEDULED", "increments BlendOrder.version by 1"]
  - method: GET
    path: "/agronomy/blend-orders/{id}/batches"
    description: "List an order's batches"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: BlendBatch[]
    side_effects: []
  - method: GET
    path: "/agronomy/blend-batches/{batchId}"
    description: "Get a batch"
    roles: *all_roles
    code: 200
    input: []
    output: BlendBatch
    side_effects: []
  - method: GET
    path: "/agronomy/blend-batches"
    description: "List batches (filtered)"
    roles: *all_roles
    code: 200
    input: ["blender_id?", "status?", "limit?", "offset?"]
    output: BlendBatch[]
    side_effects: []
  - method: POST
    path: "/agronomy/blend-batches/{batchId}/start"
    description: "Start a scheduled batch (SCHEDULED -> IN_PROGRESS)"
    roles: [PlantOperator]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["increments BlendBatch.version by 1"]
  - method: POST
    path: "/agronomy/blend-batches/{batchId}/complete"
    description: "Complete a batch with scale actuals; runs the full pricing/inventory/credit cascade and invoicing"
    roles: [PlantOperator]
    code: 200
    input: [actuals]
    output: BlendBatch
    side_effects: ["batch completion cascade per BlendOrder SCHEDULED -> BATCHED (lines, totals, inventory convert, ledger, rebate, prepay drawdown)", "increments BlendBatch.version by 1"]
  - method: POST
    path: "/agronomy/blend-batches/{batchId}/void"
    description: "Void a SCHEDULED batch; order returns to BOOKED"
    roles: [PlantOperator]
    code: 200
    input: ["reason?"]
    output: BlendBatch
    side_effects: ["order fulfillment SCHEDULED -> BOOKED", "increments BlendBatch.version by 1", "increments BlendOrder.version by 1"]

  # --- Truck / DeliveryRoute / DeliveryStop ---
  - method: POST
    path: "/agronomy/trucks"
    description: "Register a truck"
    roles: [LogisticsDispatcher]
    code: 201
    input: [name, capacity_tons]
    output: Truck
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/agronomy/trucks"
    description: "List trucks"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: Truck[]
    side_effects: []
  - method: GET
    path: "/agronomy/trucks/{truckId}"
    description: "Get a truck"
    roles: *all_roles
    code: 200
    input: []
    output: Truck
    side_effects: []
  - method: POST
    path: "/agronomy/trucks/{truckId}/out-of-service"
    description: "Take a truck out of service (dispatch then rejects it)"
    roles: [LogisticsDispatcher]
    code: 200
    input: []
    output: Truck
    side_effects: ["status -> OUT_OF_SERVICE", "increments Truck.version by 1"]
  - method: POST
    path: "/agronomy/trucks/{truckId}/return-to-service"
    description: "Return a truck to service"
    roles: [LogisticsDispatcher]
    code: 200
    input: []
    output: Truck
    side_effects: ["status -> ACTIVE", "increments Truck.version by 1"]
  - method: POST
    path: "/agronomy/delivery-routes"
    description: "Create a delivery route for a truck and date (one non-cancelled route per truck per date)"
    roles: [LogisticsDispatcher]
    code: 201
    input: [truck_id, route_date]
    output: DeliveryRoute
    side_effects: ["status = PLANNED"]
  - method: GET
    path: "/agronomy/delivery-routes"
    description: "List delivery routes (filtered)"
    roles: *all_roles
    code: 200
    input: ["truck_id?", "route_date?", "status?", "limit?", "offset?"]
    output: DeliveryRoute[]
    side_effects: []
  - method: GET
    path: "/agronomy/delivery-routes/{routeId}"
    description: "Get a delivery route"
    roles: *all_roles
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: POST
    path: "/agronomy/delivery-routes/{routeId}/stops"
    description: "Add a stop for a BATCHED order to a PLANNED route; truck capacity enforced"
    roles: [LogisticsDispatcher]
    code: 201
    input: [blend_order_id, sequence, window_start, window_end]
    output: DeliveryStop
    side_effects: ["stop_tons = order tons_total", "route.total_stop_tons += stop_tons", "order fulfillment BATCHED -> LOADED", "increments DeliveryRoute.version by 1"]
  - method: GET
    path: "/agronomy/delivery-routes/{routeId}/stops"
    description: "List a route's stops"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: DeliveryStop[]
    side_effects: []
  - method: POST
    path: "/agronomy/delivery-routes/{routeId}/dispatch"
    description: "Dispatch a route (PLANNED -> DISPATCHED)"
    roles: [LogisticsDispatcher]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["increments DeliveryRoute.version by 1"]
  - method: POST
    path: "/agronomy/delivery-routes/{routeId}/cancel"
    description: "Cancel a PLANNED route; stops CANCELLED, orders revert LOADED -> BATCHED"
    roles: [LogisticsDispatcher]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["stop cancel cascade", "increments DeliveryRoute.version by 1"]
  - method: GET
    path: "/agronomy/delivery-stops/{stopId}"
    description: "Get a delivery stop"
    roles: *all_roles
    code: 200
    input: []
    output: DeliveryStop
    side_effects: []
  - method: GET
    path: "/agronomy/delivery-stops"
    description: "List delivery stops (filtered)"
    roles: *all_roles
    code: 200
    input: ["blend_order_id?", "delivery_route_id?", "limit?", "offset?"]
    output: DeliveryStop[]
    side_effects: []
  - method: POST
    path: "/agronomy/delivery-stops/{stopId}/complete"
    description: "Mark a stop delivered (route must be DISPATCHED); order -> DELIVERED; route bubble-up COMPLETED"
    roles: [LogisticsDispatcher]
    code: 200
    input: ["delivered_at?"]
    output: DeliveryStop
    side_effects: ["order fulfillment LOADED -> DELIVERED", "route COMPLETED when all stops DELIVERED", "increments DeliveryStop.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-ID or X-User-Role, or unrecognized role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation, or Grower X-User-ID does not own the addressed resource" }
  - { id: ERR_VALIDATION_FAILED, http: 400, condition: "Required field missing, invalid enum member, numeric range violated, unknown field, acres != field.acres on order create" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Any path id or body FK reference does not resolve (left-to-right path validation)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "Target resource not in a valid from-state for the requested transition (incl. terminal lockdown, double-fire, blender/truck out of service at route dispatch, route without stops)" }
  - { id: ERR_GROWER_NOT_ORDERABLE, http: 409, condition: "Grower credit_status != ACTIVE at prepay signing, order creation, or booking" }
  - { id: ERR_NMP_REQUIRED, http: 422, condition: "No APPROVED, non-expired NutrientManagementPlan for the order's field and current crop year at booking" }
  - { id: ERR_NITROGEN_CAP_EXCEEDED, http: 422, condition: "Cumulative N lbs/acre for the field-year plus the new order exceeds the plan cap (excess over, equality admitted)" }
  - { id: ERR_PHOSPHORUS_RESTRICTED, http: 422, condition: "Plan p_restriction_active and an order line product carries P2O5" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 422, condition: "Required EnvironmentalPermit (storage / blender-site / anhydrous) missing or not ACTIVE for the site" }
  - { id: ERR_STORAGE_CAPACITY_EXCEEDED, http: 422, condition: "Receipt would push total on_hand_tons beyond the ACTIVE storage permit's max_storage_tons" }
  - { id: ERR_PRICE_WINDOW_OVERLAP, http: 409, condition: "Publishing a price sheet whose half-open window intersects another PUBLISHED sheet of the same product" }
  - { id: ERR_BLENDER_WINDOW_CONFLICT, http: 409, condition: "Batch window plus cleanup buffer intersects a non-VOIDED batch window on the same blender" }
  - { id: ERR_PREPAY_FUNDING_DEADLINE_PASSED, http: 409, condition: "Funding attempted past the program funding_deadline (deadline instant itself admitted)" }
  - { id: ERR_NO_CURRENT_PRICE, http: 422, condition: "No PUBLISHED price sheet window contains the logical clock instant for a product being priced" }
  - { id: ERR_RECOMMENDATION_EXPIRED, http: 422, condition: "Referenced recommendation past valid_until at order create/book" }
  - { id: ERR_FORMULATION_UNSOLVABLE, http: 422, condition: "Selected products cannot satisfy the recommendation's N/P2O5/K2O rates" }
  - { id: ERR_BATCH_VARIANCE_EXCEEDED, http: 422, condition: "Completion actual outside +/-5% inclusive of a line target" }
  - { id: ERR_TRUCK_CAPACITY_EXCEEDED, http: 422, condition: "Stop would push route total beyond truck capacity (equality admitted)" }
  - { id: ERR_DUPLICATE_ROUTE_FOR_TRUCK_DATE, http: 409, condition: "A non-CANCELLED route already exists for the truck on the date" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "Available (on_hand - reserved) tons insufficient for a line at booking" }
  - { id: ERR_RECOMMENDATION_NOT_APPROVED, http: 422, condition: "Referenced recommendation not APPROVED at order create/book" }
  - { id: ERR_RECOMMENDATION_FIELD_MISMATCH, http: 422, condition: "Recommendation's field differs from order field, or field not owned by path grower" }
  - { id: ERR_RECOMMENDATION_SUPERSEDED, http: 422, condition: "Referenced recommendation is SUPERSEDED at order create/book" }
  - { id: ERR_PREPAY_CONTRACT_MISMATCH, http: 422, condition: "PRICE_LOCKED order references a contract that is not FUNDED, wrong grower, product absent from lines, or fully drawn" }
  - { id: ERR_CONTRACT_IN_USE, http: 409, condition: "Refund attempted while an open order references the contract" }
  - { id: ERR_PROGRAM_NOT_ENROLLING, http: 409, condition: "Contract signing outside enrollment window or program not ENROLLMENT_OPEN" }
  - { id: ERR_BLENDER_FORM_MISMATCH, http: 422, condition: "Blender form_supported does not cover a line product's form" }
  - { id: ERR_BLENDER_OUT_OF_SERVICE, http: 409, condition: "Blender OUT_OF_SERVICE at batch create/start" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "FLOATING booking would push exposure above credit limit, or credit-release while still over limit" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment exceeds total outstanding billed balance" }
  - { id: ERR_PREPAY_OVERFUND, http: 422, condition: "Funding would push funded_cents beyond contract_value_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Grower
    description: "Farming customer; acts only on own account's resources"
    identity: "entity_backed:GrowerAccount"
    exclusive_operations:
      - "POST /agronomy/blend-orders/{orderId}/confirm-application"
    shared_operations:
      - "create own fields, request soil tests, create/book/requote/cancel own blend orders"
      - "sign own prepay contracts (with OCC version)"
      - "read own account, ledger, exposure, orders, contracts"
  - name: Agronomist
    description: "Agronomy staff; owns soil testing, recommendations, nutrient plans (draft/submit), order assistance"
    identity: "opaque"
    exclusive_operations:
      - "soil test sampling/results posting"
      - "recommendation create/submit/supersede"
      - "nutrient plan create/submit"
    shared_operations:
      - "create fields and blend orders on behalf of growers; book/requote/cancel orders"
      - "formulation preview; reads"
  - name: PlantOperator
    description: "Plant operations; owns inventory receipts, blenders, batches"
    identity: "opaque"
    exclusive_operations:
      - "inventory lot receipt"
      - "blender register/out-of-service/return-to-service"
      - "batch schedule/start/complete/void"
    shared_operations: ["reads"]
  - name: LogisticsDispatcher
    description: "Logistics; owns trucks, routes, stops"
    identity: "opaque"
    exclusive_operations:
      - "truck registration"
      - "route create/dispatch/cancel, stop add/complete"
    shared_operations: ["reads"]
  - name: CreditManager
    description: "Credit & financing desk; owns grower accounts, credit posture, payments, prepay funding/refunds"
    identity: "opaque"
    exclusive_operations:
      - "grower create, credit-terms update, credit-hold/suspend/release"
      - "payment posting"
      - "prepay contract funding and refund"
    shared_operations:
      - "sign prepay contracts on behalf of growers"
      - "reads"
  - name: ComplianceOfficer
    description: "Regulatory compliance; owns recommendation/NMP approvals and environmental permits"
    identity: "opaque"
    exclusive_operations:
      - "recommendation approve/return"
      - "nutrient plan approve/return/suspend/reinstate"
      - "permit create/inspect/activate/renew/revoke"
    shared_operations: ["reads"]
  - name: BranchAdmin
    description: "Branch administrator; owns reference data and programs; may assist operational reads"
    identity: "opaque"
    exclusive_operations:
      - "product create, price sheet create/publish/expire"
      - "prepay program create/close-enrollment/settle"
      - "logical clock set"
    shared_operations:
      - "grower create, field create, blend order create"
      - "blender register"
      - "reads"
