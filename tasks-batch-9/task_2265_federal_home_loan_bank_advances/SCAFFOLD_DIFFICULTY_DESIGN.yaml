  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    applied: true
    summary: |
      Two conflict pairs drawn from different regions of the 13-tier ladder: a
      business_constraint (12) versus business_fiscal (13) pair inside the advance-create
      handler, and an authorization_scope (6) versus concurrency (7) pair in the same
      handler's preamble.
    instances:
      - name: term_out_of_range_beats_insufficient_capacity_rejected
        category_pair: "business_constraint (priority 12) vs business_fiscal (priority 13)"
        grounds:
          - "validations.term-within-product-range (priority 12, ERR_TERM_OUT_OF_RANGE)"
          - "validations.capacity-covers-request (priority 13, ERR_INSUFFICIENT_BORROWING_CAPACITY)"
        distinguishing_aspect: |
          The pair is (business_constraint, business_fiscal) — two adjacent BUSINESS tiers,
          both evaluated after the request is fully parsed, authorized and version-checked,
          and both resolved from the same request body. The discriminator is that a
          product-range violation must be reported before any capacity arithmetic is
          performed. Instance 2's pair is (authorization_scope, concurrency), which sits in
          the pre-business preamble and involves two DIFFERENT error categories, different
          HTTP statuses (403 vs 412) and no arithmetic at all.
        test_recipe:
          setup: |
            Harbor Savings ACTIVE with an executed BLANKET_LIEN pledge and exactly ONE
            ELIGIBLE HELOC asset worth 500,000 of lendable value, so the PROVISIONAL
            capacity is 500,000. Product FT-450 accepts terms of 30..1095 days with
            min_principal_cents 1,000,000. The request asks for term_days 2000 (violates
            priority 12) and 5,000,000 of net proceeds with fund_stock_from_advance false,
            so gross_principal_cents is 5,000,000, ten times the available capacity
            (violates priority 13). min_principal is satisfied, so exactly two rules are
            violated.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "HELOC", unpaid_principal_balance_cents: 1000000, market_value_cents: 1000000, ltv_bps: 7000, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_heloc: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_heloc}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "FT-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "YIELD_MAINTENANCE", activity_stock_pct_bps: 450, min_principal_cents: 1000000 }
              as: SystemAdmin
              captures: { product_id: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_a: "$.data.version" }
          trigger:
            call: "POST /fhlb/advances"
            payload: { member_bank_id: "${member_id}", advance_product_id: "${product_id}", term_days: 2000, requested_net_proceeds_cents: 5000000, expected_member_bank_version: "${ver_a}", fund_stock_from_advance: false }
            as: TreasuryOfficer
            as_user_id: "${member_id}"
            captures: { error_code: "$.data.error_id" }
          assert:
            - "the response is HTTP 409 with error_id == \"ERR_TERM_OUT_OF_RANGE\", NOT \"ERR_INSUFFICIENT_BORROWING_CAPACITY\""
            - "no Advance row is created: GET /fhlb/advances?member_bank_id={member_id} returns total_count == 0"
            - "MemberBank.version is unchanged at the value captured in ver_a and committed_advances_cents == 0"
            - "the same request with term_days 360 instead of 2000 fails with error_id == \"ERR_INSUFFICIENT_BORROWING_CAPACITY\", proving the lower-priority rule was genuinely violated and merely masked"

      - name: member_scope_beats_stale_version_returns_4XX
        category_pair: "authorization_scope (priority 6) vs concurrency (priority 7)"
        grounds:
          - "validations.treasury-officer-own-member-only (priority 6, ERR_MEMBER_SCOPE_VIOLATION, 403)"
          - "validations.member-version-current (priority 7, ERR_STALE_MEMBER_VERSION, 412)"
          - "concurrency_rules.advance-create-stale-member"
        distinguishing_aspect: |
          The pair is (authorization_scope, concurrency): a 403 identity check versus a 412
          optimistic-concurrency check, both in the pre-business preamble of the same
          endpoint and both resolvable without reading any product or collateral data. The
          point at issue is that a caller must never learn from a 412 that another member's
          row moved — scope is decided first. Instance 1's pair lives at the far end of the
          ladder (12 vs 13), returns 409 for both members of the pair, and turns on
          arithmetic rather than identity.
        test_recipe:
          setup: |
            Two member banks: Harbor Savings (M1) and Cascade Mutual (M2), both ACTIVE with
            executed BLANKET_LIEN pledges. M1 has one ELIGIBLE SF_MORTGAGE asset worth
            15,600,000, so a 5,000,000 advance would otherwise be affordable. M1's version
            is captured and then deliberately staled by a condition PATCH that re-tiers M1
            from tier 1 to tier 2. The request is then issued for M1 by a TreasuryOfficer
            whose X-User-ID is M2, carrying the stale version — so BOTH the scope rule and
            the OCC rule are violated by one request.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_one: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_one}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_one: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_one}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_one}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_one}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_one}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_one}"
              captures: { asset_one: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_one}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks"
              payload: { name: "Cascade Mutual", charter_type: "SAVINGS_BANK", total_assets_cents: 5000000000, credit_rating_tier: 2 }
              as: SystemAdmin
              captures: { member_two: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_two}", subscription_type: "MEMBERSHIP", amount_cents: 6000000 }
              as: CreditOfficer
              captures: { sub_two: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_two}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_two}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "FT-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "YIELD_MAINTENANCE", activity_stock_pct_bps: 450, min_principal_cents: 1000000 }
              as: SystemAdmin
              captures: { product_id: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_one}"
              payload: {}
              as: CreditOfficer
              captures: { ver_stale: "$.data.version" }
            - call: "PATCH /fhlb/member-banks/${member_one}/condition"
              payload: { credit_rating_tier: 2 }
              as: CreditOfficer
          trigger:
            call: "POST /fhlb/advances"
            payload: { member_bank_id: "${member_one}", advance_product_id: "${product_id}", term_days: 360, requested_net_proceeds_cents: 5000000, expected_member_bank_version: "${ver_stale}", fund_stock_from_advance: false }
            as: TreasuryOfficer
            as_user_id: "${member_two}"
            captures: { error_code: "$.data.error_id" }
          assert:
            - "the response is HTTP 403 with error_id == \"ERR_MEMBER_SCOPE_VIOLATION\", NOT HTTP 412 / \"ERR_STALE_MEMBER_VERSION\""
            - "no Advance row is created for either member: GET /fhlb/advances?member_bank_id={member_one} returns total_count == 0"
            - "MemberBank M1's version is unchanged by the refused call and its credit_rating_tier is 2 from the PATCH"
            - "the identical request sent with X-User-ID = M1 instead of M2 fails with HTTP 412 and error_id == \"ERR_STALE_MEMBER_VERSION\", proving the concurrency rule was genuinely violated and merely masked"
            - "the identical request sent with X-User-ID = M1 and the CURRENT member version succeeds with HTTP 201"

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    applied: true
    summary: |
      Two boundaries on different metrics measured at different endpoints: a rounded
      two-decimal exception-rate landing exactly on a haircut band edge at review close,
      and an empty-collateral capacity of exactly zero at advance create.
    instances:
      - name: exception_rate_exactly_five_percent_selects_seven_hundred_bps_band
        metric: "exception_rate_pct — a two-decimal percentage compared with >= at every band lower bound"
        grounds:
          - "calculations.verification_exception_rate (bands 2.00 / 5.00 / 10.00, round_half_up to 2 dp, >= at each lower bound)"
          - "entities.CollateralVerificationReview.exception_rate_pct / haircut_bps / outcome"
          - "endpoints.POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/close"
        distinguishing_aspect: |
          The metric is a ROUNDED PERCENTAGE at a band edge, and the endpoint is the review
          close action. Two consecutive closes straddle the 5.00 edge from below and land on
          it exactly: 1.75 weighted exceptions over a sample of 40 rounds to 4.38 and picks
          the 300 bps band, while 2.00 over 40 is exactly 5.00 and must pick the 700 bps
          band because the comparison is >= at the lower bound. Instance 2 tests a different
          metric (an integer cent capacity at exactly zero over an empty input set) at a
          different endpoint (advance create).
        test_recipe:
          setup: |
            Harbor Savings tier 1 under a BLANKET_LIEN pledge with three ELIGIBLE assets:
            A1 SF_MORTGAGE (basis 20,000,000, factor 7800, lendable 15,600,000), A3 HELOC
            (basis 1,000,000, factor 5000, lendable 500,000) and A4 HELOC (basis 1,000,000,
            factor 5000, lendable 500,000). Review 1 covers [2026-08-01, 2026-08-10) with
            sample_size 40 and carries 1 MAJOR plus 3 MINOR findings against A3; it closes
            first. Review 2 covers the adjacent window [2026-08-10, 2026-08-20) with
            sample_size 40 and carries exactly 2 MAJOR findings against A4.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "HELOC", unpaid_principal_balance_cents: 1000000, market_value_cents: 1000000, ltv_bps: 7000, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_heloc_a: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_heloc_a}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "HELOC", unpaid_principal_balance_cents: 1000000, market_value_cents: 1000000, ltv_bps: 6500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_heloc_b: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_heloc_b}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-verification-reviews"
              payload: { member_bank_id: "${member_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-10T00:00:00Z", sample_size: 40 }
              as: CollateralReviewAuditor
              captures: { review_one: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_one}/begin-field-work"
              payload: {}
              as: CollateralReviewAuditor
            - call: "POST /fhlb/collateral-verification-reviews/${review_one}/findings"
              payload: { collateral_asset_id: "${asset_heloc_a}", finding_type: "MISSING_NOTE", severity: "MAJOR" }
              as: CollateralReviewAuditor
              as_user_id: "auditor-1"
              captures: { finding_a1: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_one}/findings"
              payload: { collateral_asset_id: "${asset_heloc_a}", finding_type: "STALE_APPRAISAL", severity: "MINOR" }
              as: CollateralReviewAuditor
              as_user_id: "auditor-1"
              captures: { finding_a2: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_one}/findings"
              payload: { collateral_asset_id: "${asset_heloc_a}", finding_type: "DOCUMENT_MISMATCH", severity: "MINOR" }
              as: CollateralReviewAuditor
              as_user_id: "auditor-1"
              captures: { finding_a3: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_one}/findings"
              payload: { collateral_asset_id: "${asset_heloc_a}", finding_type: "UNREPORTED_DELINQUENCY", severity: "MINOR" }
              as: CollateralReviewAuditor
              as_user_id: "auditor-1"
              captures: { finding_a4: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_one}/issue-findings"
              payload: {}
              as: CollateralReviewAuditor
            - call: "POST /fhlb/collateral-verification-reviews/${review_one}/close"
              payload: {}
              as: CollateralReviewAuditor
            - call: "POST /fhlb/collateral-verification-reviews"
              payload: { member_bank_id: "${member_id}", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-20T00:00:00Z", sample_size: 40 }
              as: CollateralReviewAuditor
              captures: { review_two: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_two}/begin-field-work"
              payload: {}
              as: CollateralReviewAuditor
            - call: "POST /fhlb/collateral-verification-reviews/${review_two}/findings"
              payload: { collateral_asset_id: "${asset_heloc_b}", finding_type: "LIEN_DEFECT", severity: "MAJOR" }
              as: CollateralReviewAuditor
              as_user_id: "auditor-1"
              captures: { finding_b1: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_two}/findings"
              payload: { collateral_asset_id: "${asset_heloc_b}", finding_type: "MISSING_NOTE", severity: "MAJOR" }
              as: CollateralReviewAuditor
              as_user_id: "auditor-1"
              captures: { finding_b2: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_two}/issue-findings"
              payload: {}
              as: CollateralReviewAuditor
          trigger:
            call: "POST /fhlb/collateral-verification-reviews/${review_two}/close"
            payload: {}
            as: CollateralReviewAuditor
          assert:
            - "review 1 (just below the edge): weighted_exception_score == 1.75 (1 * 1.0 + 3 * 0.25), exception_rate_pct == 4.38 (100 * 1.75 / 40 = 4.375, round_half_up to 2 dp), haircut_bps == 300, outcome == \"QUALIFIED\""
            - "after review 1 closed: MemberBank.verification_haircut_bps == 300, asset A1 lendable_value_cents == 15000000 (factor 7500), asset A4 lendable_value_cents == 470000 (factor 4700), asset A3 status == \"SUSPENDED\" with lendable_value_cents == 0, MemberBank.lendable_collateral_value_cents == 15470000"
            - "review 2 (exactly on the edge): weighted_exception_score == 2.0, exception_rate_pct == 5.00, haircut_bps == 700 and NOT 300, outcome == \"QUALIFIED\""
            - "after the trigger: MemberBank.verification_haircut_bps == 700, asset A1 discount_factor_bps == 7100 and lendable_value_cents == 14200000, asset A4 status == \"SUSPENDED\" with lendable_value_cents == 0, MemberBank.lendable_collateral_value_cents == 14200000"
            - "a haircut_bps of 300 on review 2 indicates the band comparison used > instead of >= at the 5.00 lower bound; an exception_rate_pct of 4.37 on review 1 indicates round-half-even or truncation instead of round_half_up"
            - "outcome must remain QUALIFIED at exactly 5.00: a FAIL there indicates the outcome bands were aligned to the haircut bands rather than to 2.00 / 10.00"

      - name: zero_eligible_assets_capacity_boundary_rejects_advance
        metric: "borrowing_capacity_cents — integer cents over an EMPTY input set, tested at exactly 0"
        grounds:
          - "calculations.lendable_collateral_value (empty ELIGIBLE set)"
          - "calculations.borrowing_capacity (min() of two caps, then subtraction)"
          - "validations.capacity-covers-request (priority 13)"
          - "endpoints.POST /fhlb/advances"
        distinguishing_aspect: |
          A different metric (an integer-cent aggregate, not a rounded percentage) at a
          different boundary (the empty-set / exactly-zero edge rather than a band edge)
          reached through a different endpoint (advance create rather than review close).
          The subtlety is that a member with a large asset base and a fully executed pledge
          still has a capacity of exactly 0 until at least one asset is approved ELIGIBLE,
          and the guard must be a strict "gross > capacity" comparison against 0 rather than
          a null-safe short circuit that treats an empty portfolio as unconstrained.
          Nothing here touches findings, haircuts or rounding.
        test_recipe:
          setup: |
            Harbor Savings tier 1 with total assets 8,000,000,000 (statutory cap
            2,400,000,000) and an executed BLANKET_LIEN pledge, membership stock 9,600,000
            ISSUED and membership_status ACTIVE, but ZERO collateral assets of any kind.
            Both capacity variants must therefore report exactly 0. Product FT-450 has
            min_principal_cents 1,000,000, and the request asks for exactly that amount so
            the min-principal rule at priority 12 is satisfied and the capacity rule at
            priority 13 is the only violation.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "FT-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "YIELD_MAINTENANCE", activity_stock_pct_bps: 450, min_principal_cents: 1000000 }
              as: SystemAdmin
              captures: { product_id: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_id}/borrowing-capacity"
              payload: { variant: "PROVISIONAL" }
              as: CreditOfficer
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_a: "$.data.version" }
          trigger:
            call: "POST /fhlb/advances"
            payload: { member_bank_id: "${member_id}", advance_product_id: "${product_id}", term_days: 360, requested_net_proceeds_cents: 1000000, expected_member_bank_version: "${ver_a}", fund_stock_from_advance: false }
            as: TreasuryOfficer
            as_user_id: "${member_id}"
            captures: { error_code: "$.data.error_id" }
          assert:
            - "the PROVISIONAL capacity read reports lendable_collateral_value_cents == 0, capacity_base_cents == 0, outstanding_advances_cents == 0, commitments_cents == 0 and borrowing_capacity_cents == 0, with statutory_cap_cents == 2400000000 and tier_cap_bps == 10000 both non-binding"
            - "MemberBank.lendable_collateral_value_cents == 0 and borrowing_capacity_cents == 0 (not null)"
            - "MemberBank.collateral_posture == \"OPEN\" even at a capacity of exactly 0, because total_outstanding_advances_cents is 0 so the RESTRICTED buffer term is 0 and the capacity is not negative"
            - "the trigger returns HTTP 409 with error_id == \"ERR_INSUFFICIENT_BORROWING_CAPACITY\" (gross 1000000 > capacity 0)"
            - "no Advance row exists and MemberBank.version is unchanged at ver_a"
            - "a 201 here indicates the capacity gate was skipped for an empty portfolio, and a capacity of 2400000000 indicates the statutory cap was used as the base instead of min(tier-capped lendable, statutory cap)"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    applied: true
    summary: |
      Three distinct entity pairs in which a transition on one entity is gated by the
      current state of a different entity: Advance gated by MemberBank, review retest
      gated by ReviewFinding, and SafekeepingReceipt creation gated by CollateralAsset.
    instances:
      - name: advance_fund_rejected_when_member_posture_restricted
        entity_pair: "Advance -> MemberBank"
        grounds:
          - "state_machines.Advance.credit_status CREDIT_APPROVED -> FUNDED (precondition MemberBank.collateral_posture == OPEN)"
          - "validations.posture-frozen-blocks-credit (priority 9)"
          - "calculations.collateral_posture_recompute step 3 (latest_review_outcome == FAIL forces RESTRICTED)"
        distinguishing_aspect: |
          The gating pair is (Advance, MemberBank) — a CHILD blocked by its own PARENT's
          derived posture. The advance is legitimately CREDIT_APPROVED and the member's
          capacity is comfortably positive (11,600,000 against a 1,000,000 request), so the
          only thing standing in the way is that funding demands posture exactly OPEN while
          a failed verification review has pinned the member to RESTRICTED. Instance 2 gates
          a PARENT by its CHILDREN's aggregate status, and instance 3 gates a SIBLING
          creation by a peer entity's lifecycle state.
        test_recipe:
          setup: |
            Harbor Savings tier 1 with A1 SF_MORTGAGE (lendable 15,600,000) and A3 HELOC
            (lendable 500,000). Advance D asks for 950,000 of net proceeds with
            fund_stock_from_advance true, so gross is 1,000,000 with 50,000 of activity
            stock; it is created and approved while the posture is still OPEN with a term of
            360 days. A review over [2026-08-01, 2026-08-20) with sample_size 40 then closes
            with 4 MAJOR findings against A3: exception_rate_pct 10.00, haircut 1500,
            outcome FAIL. A1 re-prices to 12,600,000 and A3 is suspended, so lendable is
            12,600,000 and capacity is 12,600,000 - 0 outstanding - 1,000,000 committed =
            11,600,000, which is non-negative, so no shortfall opens; but
            latest_review_outcome == FAIL forces collateral_posture RESTRICTED.
