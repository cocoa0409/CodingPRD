          - endpoints.GET_/ipa/enrollees
        distinguishing_aspect: |
          MemberAssignment is the junction of Enrollee and PhysicianMember in a
          graph topology: the same row must be reachable by filtering on either
          parent, and the denormalised back-pointer Enrollee.assigned_physician_id
          must agree with it. Falsified if either filtered list misses the row or
          the back-pointer disagrees.
        test_recipe:
