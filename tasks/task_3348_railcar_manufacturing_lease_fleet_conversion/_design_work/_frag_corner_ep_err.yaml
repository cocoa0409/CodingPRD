            - "The rejection is atomic: GET /retrofit-programs/${p1_id} still reports status == ${p1_after} == \"PLANNED\""
            - "The rule is temporal, not state-based: the program was PLANNED and covered, so priority 5 and priority 18 were both satisfied and priority 9 is the rejecting rule"
