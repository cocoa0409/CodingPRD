              payload: {}
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
          assert:
            - "HTTP 204 with an empty body"
            - "a follow-up GET /peer-reviews/${pr_id} returns unallocated_hours == 40, total_scope_hours == 40, scope_limitation_count == 0, state == \"SCOPE_SET\""
            - "a follow-up GET /peer-reviewers/${reviewer_id} returns committed_hours_balance == 0"
            - "a follow-up GET /peer-review-selections/${prsel_lim_id} returns status == \"WITHDRAWN\" and hours_committed == 12"

