# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2469 — Hydrogen Production & Fueling Station Operations
#
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every grounds entry resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assert below was executed against the §1.3 formula and its
# constants (Decimal, ROUND_HALF_UP) before being written down.
# The logical clock defaults to 2026-08-01T00:00:00Z; chains that need another
# instant call POST /_clock/set_current_utc explicitly.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lot_carbon_intensity_annual_average_versus_hourly_matched
        grounds:
          - calculations.production_lot_carbon_intensity
          - entities.ProductionLot.fields.ci_provisional_gco2e_per_mj
          - entities.ProductionLot.fields.ci_certified_gco2e_per_mj
          - entities.ProductionLot.fields.ci_variant_applied
          - entities.PowerSupplyContract.fields.hourly_matching_enabled
          - state_machines.ProductionLot.PRODUCED_to_PRODUCED
        distinguishing_aspect: |
          Entity domain is carbon accounting on a ProductionLot: the SAME lot row carries two
          carbon intensities computed from the same energy and mass inputs but different renewable
          shares (annual_renewable_pct 62.500 vs hourly_matched_renewable_pct 41.000), so
          ci_provisional_gco2e_per_mj == 65.06 while ci_certified_gco2e_per_mj == 100.93.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PEM_ELECTROLYSIS ProductionAsset with ccs_capture_rate 0.0000."
            - "One PowerSupplyContract on that asset covering 2026-01-01 to 2027-01-01 with grid_ci_gco2e_per_mwh 385000.00, annual_renewable_pct 62.500, hourly_matched_renewable_pct 41.000 and hourly_matching_enabled true."
            - "One ProductionLot of mass_kg 1000.000 consuming 52000.0 kWh, no feedstock, no carryover, produced 2026-07-20 to 2026-07-21 so it falls inside the contract's effective window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /production-assets"
              payload: { asset_code: "PA-PEM-1", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, ccs_capture_rate: 0.0000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-HM-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 62.500, hourly_matched_renewable_pct: 41.000, hourly_matching_enabled: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
              captures: { psc_id: "$.data.id" }
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-CI-1", mass_kg: 1000.000, energy_consumed_kwh: 52000.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_id: "$.data.id", ci_prov: "$.data.ci_provisional_gco2e_per_mj" }
          trigger:
            - call: "POST /production-lots/${lot_id}/certify-ci"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { ci_cert: "$.data.ci_certified_gco2e_per_mj" }
          assert:
            - "ProductionLot.${lot_id}.selected_power_contract_id == ${psc_id}"
            - "ProductionLot.${lot_id}.ci_provisional_gco2e_per_mj == 65.06"
            - "ProductionLot.${lot_id}.ci_certified_gco2e_per_mj == 100.93"
            - "ProductionLot.${lot_id}.ci_variant_applied == HOURLY_MATCHED"
            - "ProductionLot.${lot_id}.ci_certified_gco2e_per_mj - ProductionLot.${lot_id}.ci_provisional_gco2e_per_mj == 35.87"
            - "ProductionLot.${lot_id}.ci_status == CERTIFIED"
            - "ProductionLot.${lot_id}.status == PRODUCED (the ci branch does not advance the lot lifecycle)"

      - name: delivery_loss_tube_trailer_heel_versus_liquid_tanker_boiloff
        grounds:
          - calculations.delivery_net_receipt
          - entities.Delivery.fields.heel_kg
          - entities.Delivery.fields.boiloff_kg
          - entities.Delivery.fields.net_receipt_kg
          - entities.Delivery.fields.mode
          - state_machines.Delivery.SCHEDULED_to_ARRIVED
        distinguishing_aspect: |
          Entity domain is transit-loss accounting on a Delivery, not carbon accounting on a lot:
          TUBE_TRAILER loses 42.000 kg of residual heel that is a pure function of trailer geometry
          and is invariant to transit_hours, while LIQUID_TANKER loses 0.450 kg of boil-off that is
          strictly linear in transit_hours and invariant to trailer geometry.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Station STN-D under one funding agreement, offload_bay_count 1, storage_capacity_kg 900.000, reserve_floor_kg 100.000, nozzle_count 4, max_pressure_class H70."
            - "Three vessels: HIGH 600 L at 950.00 bar (keeps posture OPEN), LOW-1 5000 L at 300.00 bar, LOW-2 5000 L at 300.00 bar; onsite_inventory_kg 285.600."
            - "Two current EMERGENCY_RESPONSE responder certifications so offload passes validations[priority=110]."
            - "One RELEASED ProductionLot of mass_kg 1000.000 (qa PASSED, ci CERTIFIED, released by a different user than the purity tester)."
            - "Delivery A booked TUBE_TRAILER 300.000 kg into LOW-1, window [2026-08-02T00:00:00Z, 2026-08-02T06:00:00Z), departed 2026-08-01T12:00:00Z, trailer 2500.0 L finishing at 210.00 bar."
            - "Delivery B booked LIQUID_TANKER 200.000 kg into LOW-2, window [2026-08-02T06:00:00Z, 2026-08-02T12:00:00Z), departed 2026-08-01T14:00:00Z — the touching window does not collide under validations[priority=160]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-D-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-D", name: "Delivery Yard D", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_low1: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_low2: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-D-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-D-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /production-assets"
              payload: { asset_code: "PA-D-1", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, ccs_capture_rate: 0.0000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-D-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 62.500, hourly_matched_renewable_pct: 41.000, hourly_matching_enabled: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-D-1", mass_kg: 1000.000, energy_consumed_kwh: 52000.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_id: "$.data.id" }
            - call: "POST /production-lots/${lot_id}/purity-tests"
              payload: { sampled_at: "2026-07-22T00:00:00Z", total_hydrocarbons_ppm: 1.000, water_ppm: 4.000, oxygen_ppm: 3.000, nitrogen_ppm: 50.000, carbon_monoxide_ppm: 0.150, carbon_dioxide_ppm: 1.000, total_sulfur_ppm: 0.004, ammonia_ppm: 0.050, helium_ppm: 100.000 }
              as: QualityAnalyst
              as_user_id: "QA-1"
            - call: "POST /production-lots/${lot_id}/certify-ci"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
            - call: "POST /production-lots/${lot_id}/release"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
            - call: "POST /deliveries"
              payload: { station_id: "${st_id}", production_lot_id: "${lot_id}", receiving_vessel_id: "${v_low1}", mode: "TUBE_TRAILER", planned_kg: 300.000, window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", departed_at: "2026-08-01T12:00:00Z", trailer_water_volume_l: 2500.0, trailer_final_pressure_bar: 210.00 }
              as: LogisticsDispatcher
              captures: { del_a: "$.data.id" }
            - call: "POST /deliveries"
              payload: { station_id: "${st_id}", production_lot_id: "${lot_id}", receiving_vessel_id: "${v_low2}", mode: "LIQUID_TANKER", planned_kg: 200.000, window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T12:00:00Z", departed_at: "2026-08-01T14:00:00Z" }
              as: LogisticsDispatcher
              captures: { del_b: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deliveries/${del_a}/arrive"
              payload: {}
              as: LogisticsDispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /deliveries/${del_b}/arrive"
              payload: {}
              as: LogisticsDispatcher
          assert:
            - "Delivery.${del_a}.transit_hours == 14.000"
            - "Delivery.${del_a}.heel_kg == 42.000"
            - "Delivery.${del_a}.boiloff_kg == 0.000"
            - "Delivery.${del_a}.net_receipt_kg == 258.000"
            - "Delivery.${del_b}.transit_hours == 18.000"
            - "Delivery.${del_b}.heel_kg == 0.000"
            - "Delivery.${del_b}.boiloff_kg == 0.450"
            - "Delivery.${del_b}.net_receipt_kg == 199.550"
            - "Delivery.${del_a}.net_receipt_kg / Delivery.${del_a}.planned_kg != Delivery.${del_b}.net_receipt_kg / Delivery.${del_b}.planned_kg (the two variants produce different loss ratios: 0.860 vs 0.997750)"
            - "Delivery.${del_a}.status == ARRIVED and Delivery.${del_b}.status == ARRIVED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: metering_rollup_rounds_per_session_before_summing_mode_b
        grounds:
          - calculations.metering_accuracy_rollup
          - calculations.dispense_metered_mass_correction
          - entities.Station.fields.corrected_kg_mtd
          - entities.Station.fields.metering_error_pct_mtd
          - entities.Station.fields.metering_accuracy_flag
          - state_machines.DispenseSession.PENDING_to_METERED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. Three settled fills whose per-session
          corrected masses round to 3.125, 4.284 and 5.539 sum to corrected_kg_mtd == 12.948 under the
          pinned round-then-sum order, whereas the forbidden sum-then-round order yields 12.947 and a
          metering_error_pct_mtd of -0.749 instead of the correct -0.757.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so all three sessions start inside the same UTC calendar month."
            - "Station STN-A with vessels HIGH 600 L at 950.00 bar, MEDIUM 1000 L at 700.00 bar, LOW 5000 L at 300.00 bar; onsite_inventory_kg 221.600, high_bank_deliverable_kg 36.000, safety_posture OPEN."
            - "Two current EMERGENCY_RESPONSE responder certifications."
            - "Three H35 sessions completed at ambient_temp_c 0.0 with metered_kg 3.100 / 4.250 / 5.500 and avg_dispense_pressure_bar 700.00 / 700.00 / 750.00 (density_correction_factor 1.008 / 1.008 / 1.007)."
            - "The first two sessions already settled to billing_status METERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-A-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-A", name: "Harbor Hydrogen A", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "MEDIUM", water_volume_l: 1000.0, mawp_bar: 1000.00, min_residual_bar: 150.00, initial_pressure_bar: 700.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_med: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_low: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-A-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-A-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v1: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 3.200, ambient_temp_c: 0.0, expected_station_version: "${st_v1}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s1: "$.data.id" }
            - call: "POST /dispense-sessions/${s1}/fuel"
              payload: { precool_temp_achieved_c: -20.0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s1}/complete"
              payload: { metered_kg: 3.100, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s1}/meter-settlement"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v2: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 4.300, ambient_temp_c: 0.0, expected_station_version: "${st_v2}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s2: "$.data.id" }
            - call: "POST /dispense-sessions/${s2}/fuel"
              payload: { precool_temp_achieved_c: -20.0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s2}/complete"
              payload: { metered_kg: 4.250, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s2}/meter-settlement"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v3: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 5.600, ambient_temp_c: 0.0, expected_station_version: "${st_v3}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s3: "$.data.id" }
            - call: "POST /dispense-sessions/${s3}/fuel"
              payload: { precool_temp_achieved_c: -20.0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s3}/complete"
              payload: { metered_kg: 5.500, avg_dispense_pressure_bar: 750.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
          trigger:
            - call: "POST /dispense-sessions/${s3}/meter-settlement"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
          assert:
            - "DispenseSession.${s1}.corrected_kg == 3.125"
            - "DispenseSession.${s2}.corrected_kg == 4.284"
            - "DispenseSession.${s3}.corrected_kg == 5.539"
            - "Station.${st_id}.metered_kg_mtd == 12.850"
            - "Station.${st_id}.corrected_kg_mtd == 12.948"
            - "Station.${st_id}.corrected_kg_mtd != 12.947 (the sum-then-round order is forbidden)"
            - "Station.${st_id}.metering_error_pct_mtd == -0.757"
            - "Station.${st_id}.metering_error_pct_mtd != -0.749"
            - "Station.${st_id}.metering_accuracy_flag == WITHIN_TOLERANCE"
            - "Station.${st_id}.onsite_inventory_kg == 208.652"

      - name: incentive_admin_fee_tier_keyed_on_gross_not_net_mode_c
        grounds:
          - calculations.incentive_credit_netting
          - entities.IncentiveClaim.fields.gross_credits_mt
          - entities.IncentiveClaim.fields.admin_fee_rate
          - entities.IncentiveClaim.fields.admin_fee_mt
          - entities.IncentiveClaim.fields.net_credits_mt
          - state_machines.IncentiveClaim.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order. gross_credits_mt lands
          exactly on ADMIN_TIER_MID_MT at 1.200, so admin_fee_rate must be 0.020 and net_credits_mt
          1.176; keying the tier on the netted total instead (1.176 < 1.200) would select 0.010 and
          yield 1.188, which the assert forbids.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and advances to 2026-08-02T02:00:00Z for arrival/offload."
            - "Station STN-C, storage_capacity_kg 2000.000, nozzle_count 4, offload_bay_count 1, max_pressure_class H70; vessels HIGH 600 L at 950.00 bar, MEDIUM 20000 L at 100.00 bar (the receiving vessel), LOW 5000 L at 950.00 bar; onsite_inventory_kg 585.600."
            - "Two current EMERGENCY_RESPONSE responder certifications."
            - "One RELEASED, ci-CERTIFIED ProductionLot with ci_certified_gco2e_per_mj 65.06 (ANNUAL_AVERAGE contract)."
            - "One TUBE_TRAILER delivery of 300.000 kg accepted at 2026-08-02T02:00:00Z (heel 42.000, net_receipt_kg 258.000), so accepted_delivered_kg is 258.000 and onsite_inventory_kg is 843.600."
            - "One H35 session with planned_kg 166.000, ambient_temp_c 0.0, metered_kg 165.377 settled to billing_status METERED, giving corrected_kg 166.700."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-C-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-C", name: "Credit Yard C", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 2000.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
