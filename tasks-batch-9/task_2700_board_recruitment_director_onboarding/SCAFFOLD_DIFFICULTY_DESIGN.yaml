# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: board-recruitment-director-onboarding (task 2700)
# Nine Difficulty Rules x 2 instances = 18 instances.
# Logical clock default: 2026-08-01T00:00:00Z (no clock call unless the instance needs to move time).
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: independence_bright_line_clears_what_enhanced_standard_disqualifies
        grounds:
          - calculations.independence_determination
          - calculations.active_policy_selector
          - entities.GovernancePolicy.fields.independence_standard
          - entities.IndependenceScreen.fields.standard_applied
          - entities.IndependenceScreen.fields.bright_line_fail_count
          - entities.IndependenceScreen.fields.qualitative_fail_count
          - entities.IndependenceScreen.fields.disqualifying_factor_code
          - state_machines.IndependenceScreen.SUBMITTED_to_DETERMINED_INDEPENDENT
          - state_machines.IndependenceScreen.SUBMITTED_to_DETERMINED_NOT_INDEPENDENT
        distinguishing_aspect: |
          Two identical screen payloads (prior_employment_end_on 2022-06-01, i.e. 1522 days before the
          default clock) diverge purely on the frozen standard_applied: the BRIGHT_LINE variant applies a
          3-year (1095-day) employment lookback and returns determination INDEPENDENT with
          bright_line_fail_count 0, while the ENHANCED variant applies the 5-year (1825-day) lookback and
          returns NOT_INDEPENDENT with disqualifying_factor_code RECENT_EMPLOYMENT.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with independence_standard BRIGHT_LINE, effective_from 2026-01-01."
            - "Candidate A (SHAREHOLDER_PROPOSAL) with one IndependenceScreen in status SUBMITTED, standard_applied frozen to BRIGHT_LINE, prior_employment_end_on 2022-06-01 and no other adverse factor."
            - "A second GovernancePolicy for cycle 2026 with independence_standard ENHANCED, effective_from 2026-02-01, is then adopted and supersedes the first."
            - "Candidate B (SHAREHOLDER_PROPOSAL) with a byte-identical screen payload in status SUBMITTED, standard_applied frozen to ENHANCED."
            - "One SEATED director acts as the nominating-committee chair. Logical clock left at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z", independence_standard: "BRIGHT_LINE" }
              as: CorporateSecretary
              captures: { policy_bl_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Dana Chair", email: "dana.chair@issuer.example", birth_date: "1962-03-15", appointed_on: "2019-05-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { chair_id: $.data.id }
            - call: "POST /governance/candidates"
              payload: { full_name: "Alice Bright", email: "alice.bright@cand.example", birth_date: "1972-04-02", source_channel: "SHAREHOLDER_PROPOSAL", shareholder_proponent_name: "Meridian Pension Fund" }
              as: GovernanceStaff
              captures: { cand_a_id: $.data.id }
            - call: "POST /governance/candidates/${cand_a_id}/screens"
              payload: { prior_employment_end_on: "2022-06-01", payments_to_company_cents: 0, recipient_gross_revenue_cents: 0, family_member_employed: false, auditor_affiliation: false, charitable_contributions_cents: 0, company_gross_revenue_cents: 0 }
              as: GovernanceStaff
              captures: { screen_a_id: $.data.id }
            - call: "POST /governance/screens/${screen_a_id}/submit"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-02-01T00:00:00Z", independence_standard: "ENHANCED" }
              as: CorporateSecretary
              captures: { policy_en_id: $.data.id }
            - call: "POST /governance/candidates"
              payload: { full_name: "Bob Enhanced", email: "bob.enhanced@cand.example", birth_date: "1972-04-02", source_channel: "SHAREHOLDER_PROPOSAL", shareholder_proponent_name: "Meridian Pension Fund" }
              as: GovernanceStaff
              captures: { cand_b_id: $.data.id }
            - call: "POST /governance/candidates/${cand_b_id}/screens"
              payload: { prior_employment_end_on: "2022-06-01", payments_to_company_cents: 0, recipient_gross_revenue_cents: 0, family_member_employed: false, auditor_affiliation: false, charitable_contributions_cents: 0, company_gross_revenue_cents: 0 }
              as: GovernanceStaff
              captures: { screen_b_id: $.data.id }
            - call: "POST /governance/screens/${screen_b_id}/submit"
              payload: {}
              as: GovernanceStaff
          trigger:
            - call: "POST /governance/screens/${screen_a_id}/determine"
              payload: {}
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "POST /governance/screens/${screen_b_id}/determine"
              payload: {}
              as: CommitteeChair
              as_user_id: "${chair_id}"
          assert:
            - "IndependenceScreen.${screen_a_id}.standard_applied == \"BRIGHT_LINE\""
            - "IndependenceScreen.${screen_a_id}.bright_line_fail_count == 0"
            - "IndependenceScreen.${screen_a_id}.qualitative_fail_count == 1"
            - "IndependenceScreen.${screen_a_id}.determination == \"INDEPENDENT\""
            - "IndependenceScreen.${screen_a_id}.status == \"DETERMINED_INDEPENDENT\""
            - "IndependenceScreen.${screen_a_id}.disqualifying_factor_code == null"
            - "Candidate.${cand_a_id}.status == \"SCREEN_PASSED\""
            - "Candidate.${cand_a_id}.independence_result == \"INDEPENDENT\""
            - "IndependenceScreen.${screen_b_id}.standard_applied == \"ENHANCED\""
            - "IndependenceScreen.${screen_b_id}.bright_line_fail_count == 0"
            - "IndependenceScreen.${screen_b_id}.qualitative_fail_count == 1"
            - "IndependenceScreen.${screen_b_id}.determination == \"NOT_INDEPENDENT\""
            - "IndependenceScreen.${screen_b_id}.status == \"DETERMINED_NOT_INDEPENDENT\""
            - "IndependenceScreen.${screen_b_id}.disqualifying_factor_code == \"RECENT_EMPLOYMENT\""
            - "Candidate.${cand_b_id}.status == \"REJECTED\""
            - "Candidate.${cand_b_id}.independence_result == \"NOT_INDEPENDENT\""
            - "Candidate.${cand_b_id}.rejection_reason_code == \"INDEPENDENCE_FAILED\""

      - name: skills_gap_self_reported_vs_validated_only_flip_priority_category
        grounds:
          - calculations.skills_gap_analysis
          - entities.DirectorSkillRating.fields.validation_status
          - entities.DirectorSkillRating.fields.validated_rating
          - entities.SkillCategory.fields.strategic_weight
          - entities.SkillCategory.fields.risk_oversight
          - entities.SkillCategory.fields.criticality
        distinguishing_aspect: |
          The same board and the same two rating rows produce board_gap_index 1.20 with
          priority_category_code CAPITAL_ALLOCATION under SELF_REPORTED, and board_gap_index 3.60 with
          priority_category_code CYBER_RISK under VALIDATED_ONLY, because VALIDATED_ONLY scores the
          UNVALIDATED row as 0 and reads the lower validated_rating on the validated row - a different
          entity domain (board composition) from the independence variants.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 (all thresholds default)."
            - "Two SkillCategory rows: CAPITAL_ALLOCATION (strategic_weight 0.6, risk_oversight false, required_min_directors 2, criticality STRATEGIC) and CYBER_RISK (strategic_weight 0.8, risk_oversight true, required_min_directors 2, criticality CORE)."
            - "Two SEATED directors D1 and D2, plus a SEATED chair director."
            - "D1 has a CYBER_RISK rating with self_rating 4 that the chair has VALIDATED down to validated_rating 2."
            - "D2 has a CYBER_RISK rating with self_rating 3 left UNVALIDATED. Neither director has any CAPITAL_ALLOCATION rating."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/skill-categories"
              payload: { code: "CAPITAL_ALLOCATION", name: "Capital Allocation", strategic_weight: 0.6, required_min_directors: 2, risk_oversight: false, criticality: "STRATEGIC" }
              as: GovernanceStaff
              captures: { cat_capital_id: $.data.id }
            - call: "POST /governance/skill-categories"
              payload: { code: "CYBER_RISK", name: "Cybersecurity Risk Oversight", strategic_weight: 0.8, required_min_directors: 2, risk_oversight: true, criticality: "CORE" }
              as: GovernanceStaff
              captures: { cat_cyber_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Dana Chair", email: "dana.chair@issuer.example", birth_date: "1962-03-15", appointed_on: "2019-05-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { chair_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Dir One", email: "d1@issuer.example", birth_date: "1968-01-10", appointed_on: "2021-05-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { d1_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Dir Two", email: "d2@issuer.example", birth_date: "1970-09-22", appointed_on: "2022-05-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { d2_id: $.data.id }
            - call: "POST /governance/directors/${d1_id}/skill-ratings"
              payload: { skill_category_id: "${cat_cyber_id}", self_rating: 4 }
              as: GovernanceStaff
              captures: { rating_d1_cyber_id: $.data.id }
            - call: "POST /governance/skill-ratings/${rating_d1_cyber_id}/validate"
              payload: { validated_rating: 2 }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "POST /governance/directors/${d2_id}/skill-ratings"
              payload: { skill_category_id: "${cat_cyber_id}", self_rating: 3 }
              as: GovernanceStaff
              captures: { rating_d2_cyber_id: $.data.id }
          trigger:
            - call: "GET /governance/skills-matrix/gap-analysis"
              payload: { variant: "SELF_REPORTED" }
              as: GovernanceStaff
            - call: "GET /governance/skills-matrix/gap-analysis"
              payload: { variant: "VALIDATED_ONLY" }
              as: GovernanceStaff
          assert:
            - "SELF_REPORTED response: data.seated_director_count == 3 and data.category_count == 2"
            - "SELF_REPORTED response: the CYBER_RISK element has covered_director_count == 2, gap == 0, weighted_gap == 0.00, severity == \"COVERED\""
            - "SELF_REPORTED response: the CAPITAL_ALLOCATION element has covered_director_count == 0, gap == 2, weighted_gap == 1.20, severity == \"CRITICAL_GAP\""
            - "SELF_REPORTED response: data.board_gap_index == 1.20 and data.priority_category_code == \"CAPITAL_ALLOCATION\""
            - "VALIDATED_ONLY response: the CYBER_RISK element has covered_director_count == 0, gap == 2, weighted_gap == 2.40, severity == \"CRITICAL_GAP\""
            - "VALIDATED_ONLY response: the CAPITAL_ALLOCATION element has weighted_gap == 1.20"
            - "VALIDATED_ONLY response: data.board_gap_index == 3.60 and data.priority_category_code == \"CYBER_RISK\""
            - "DirectorSkillRating.${rating_d1_cyber_id}.validation_status == \"VALIDATED\" and effective_rating == 2"
            - "DirectorSkillRating.${rating_d2_cyber_id}.validation_status == \"UNVALIDATED\" and effective_rating == 3"
            - "data.categories is ordered by code ascending: CAPITAL_ALLOCATION then CYBER_RISK, in both responses"

  - rule_id: combinatorial_formula
    instances:
      - name: search_fee_rounds_per_nominee_before_summing_across_two_tiers
        grounds:
          - calculations.search_firm_placement_fee
          - entities.SearchFirm.fields.placement_fee_pct
          - entities.SearchFirm.fields.placement_fee_tier2_pct
          - entities.SearchFirm.fields.committed_fee_cents
          - entities.SearchFirm.fields.retainer_credit_applied_cents
          - entities.SearchFirm.fields.net_payable_cents
          - entities.SlateNominee.fields.nominee_ordinal
          - entities.SlateNominee.fields.fee_tier_applied
          - entities.SlateNominee.fields.placement_fee_cents
          - entities.NominationSlate.fields.committed_search_fee_cents
        distinguishing_aspect: |
          Three fee-bearing nominees each land on a half-cent product (9625005.5, 11550005.5, 6300004.5),
          so rounding each to whole cents before summing yields committed_fee_cents 27475017 while summing
          the raw products and rounding once yields 27475016 - a one-cent divergence that pins the nested
          rounding ORDER, and the third nominee crosses the ordinal-2 tier boundary from 27.5% to 22.5%.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with min_completed_interviews 1 (all other thresholds default)."
            - "SearchFirm Aurora with fee_model RETAINER, retainer_fee_cents 5000000, placement_fee_pct 27.5, placement_fee_tier2_pct 22.5."
            - "Three SEARCH_FIRM candidates sourced by Aurora with target_annual_comp_cents 35000020, 42000020 and 28000020, each driven to SLATE_ELIGIBLE through a clean screen, one COMPLETED interview scored 4 and a clean reference check and conflict clearance."
            - "A DRAFT NominationSlate for cycle 2026 with the default search_fee_budget_cents 10000000000."
            - "One SEATED chair director and one SEATED interviewer director. Logical clock left at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z", min_completed_interviews: 1 }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/search-firms"
