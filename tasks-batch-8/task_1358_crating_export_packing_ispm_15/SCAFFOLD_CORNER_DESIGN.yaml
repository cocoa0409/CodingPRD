# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task 1358
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_customer_defaults
        claim_type: creation
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /customers with required inputs returns 201 with system defaults: status ACTIVE, open_exposure_cents 0, version 1, server-minted UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Default Co", site_code: "DEF-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id, st: $.data.status, expo: $.data.open_exposure_cents, ver: $.data.version } }
          trigger: []
          assert:
            - "response status 201; status == ACTIVE; open_exposure_cents == 0; version == 1"
            - "id is a UUID without any type prefix"
      - name: item_missing_required_weight_returns_400
        claim_type: required_fields
        grounds: [entities.Item, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required weight_kg on item create is rejected with ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["customer + QUOTED job exist"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Req Co", site_code: "REQ-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "No weight", length_cm: 50, width_cm: 50, height_cm: 50, fragile_class: STANDARD, declared_value_cents: 1000 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST; http 400; no Item persisted"]
      - name: item_battery_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Item.fields.battery_in_equipment, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "battery_in_equipment 'AA' is not in {NONE, LITHIUM_ION, LITHIUM_METAL, WET_CELL} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["customer + QUOTED job exist"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Enum Co", site_code: "ENM-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Bad enum", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 10, fragile_class: STANDARD, battery_in_equipment: "AA", declared_value_cents: 1000 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST"]
      - name: item_chargeable_weight_input_ignored
        claim_type: computed_fields
        grounds: [entities.Item.fields.chargeable_weight_kg, entities.Item.fields.dimensional_weight_kg]
        distinguishing_aspect: "Client-sent chargeable_weight_kg: 999 is ignored; server computes max(weight, dim) = max(40, 25.0) = 40.0 for a 50x50x50 / 40 kg item."
        test_recipe:
          setup: ["customer + QUOTED job exist"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Computed Co", site_code: "CMP-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Dense block", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 40, fragile_class: STANDARD, declared_value_cents: 1000, chargeable_weight_kg: 999, dimensional_weight_kg: 999 }, as: SalesRep, captures: { cw: $.data.chargeable_weight_kg, dw: $.data.dimensional_weight_kg } }
          assert:
            - "dimensional_weight_kg == 25.0 (125000 cm3 / 5000)"
            - "chargeable_weight_kg == 40.0 — client inputs 999 ignored (computed source)"
      - name: get_item_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Item, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /crating/items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_FOUND; http 404"]
      - name: design_computed_geometry_fields
        claim_type: computed_fields
        grounds: [calculations.crate_design_geometry, entities.CrateDesign]
        distinguishing_aspect: "For a DELICATE 60x40x40 / 45 kg item the design computes clearance 10, thickness 1.2, internal 80x60x60, external 82.4x62.4x62.4, board_feet 32, tare 57.6, indicator 50, barrier VCI."
        test_recipe:
          setup: ["customer + QUOTED job + item (60x40x40, 45 kg, DELICATE)"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Geo Co", site_code: "GEO-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Optics bench", length_cm: 60, width_cm: 40, height_cm: 40, weight_kg: 45, fragile_class: DELICATE, declared_value_cents: 150000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
          trigger:
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { clr: $.data.clearance_cm, th: $.data.thickness_cm, bf: $.data.board_feet_required, tare: $.data.tare_weight_kg, ind: $.data.shock_indicator_g, bar: $.data.moisture_barrier_required } }
          assert:
            - "clearance_cm == 10 and thickness_cm == 1.2 (45 kg < 50 tier)"
            - "board_feet_required == 32 (external 82.4x62.4x62.4 cm -> area 28354.56 cm2 = 2.835456 m2 -> 2.835456*11 = 31.190016 -> ceil = 32)"
            - "tare_weight_kg == 57.6 (32 * 1.8); shock_indicator_g == 50; moisture_barrier_required == VCI"

  - section: state_machines
    instances:
      - name: design_starts_draft
        claim_type: initial_state
        grounds: [state_machines.CrateDesign]
        distinguishing_aspect: "A newly created CrateDesign is DRAFT with revision 1 and no wood_batch_id."
        test_recipe:
          setup: ["customer + job + item"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Init Co", site_code: "INI-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Block", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 1000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
          trigger:
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { st: $.data.status, rev: $.data.revision, wb: $.data.wood_batch_id } }
          assert: ["status == DRAFT; revision == 1; wood_batch_id == null"]
      - name: seal_built_crate_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Crate.PACKED_to_SEALED, "errors[ERR_CRATE_INVALID_STATE]"]
        distinguishing_aspect: "Seal is only valid from PACKED; a BUILT crate returns ERR_CRATE_INVALID_STATE and mints no stamp."
        test_recipe:
          setup: ["crate driven to BUILT (item 50x50x50 / 50 kg STANDARD, batch with 2 stamps)"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Seal Co", site_code: "SEA-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Motor", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 30000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0100", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 500, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman }
            - { call: "POST /crating/items/${item_id}/crates", payload: { design_id: "${design_id}" }, as: ShopForeman, captures: { crate_id: $.data.id } }
            - { call: "POST /crating/crates/${crate_id}/build", payload: {}, as: ShopForeman }
          trigger:
            - { call: "POST /crating/crates/${crate_id}/seal", payload: {}, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CRATE_INVALID_STATE; Crate.${crate_id}.status remains BUILT; stamp_serial still null"]
      - name: cancel_packing_job_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PackingJob.QUOTED_to_CANCELLED, "errors[ERR_JOB_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is only valid from QUOTED|DESIGN; a PACKING job returns ERR_JOB_INVALID_STATE and no cascade fires (wood reservation intact)."
        test_recipe:
          setup: ["job in PACKING with one APPROVED design reserving 27 bf on batch HT-2026-0101 (received 500)"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Cancel Co", site_code: "CAN-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Pump", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 30000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0101", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 500, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/cancel", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "GET /crating/wood-batches/${batch_id}", payload: {}, as: SalesRep, captures: { reserved_after: $.data.reserved_board_feet } }
          assert:
            - "error_id == ERR_JOB_INVALID_STATE"
            - "no side effects: WoodBatch.reserved_board_feet still 27 (cascade did not fire)"
      - name: item_status_bubbles_from_crate
        claim_type: side_effect_execution
        grounds: [state_machines.Item.DESIGN_APPROVED_to_PACKED, state_machines.Item.PACKED_to_SEALED]
        distinguishing_aspect: "Item status is driven purely by child events: design approve -> DESIGN_APPROVED, crate pack -> PACKED, crate seal -> SEALED."
        test_recipe:
          setup: ["full chain to PACKED then SEALED crate for one item"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Bubble Co", site_code: "BUB-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Motor", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 30000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0102", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 500, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer, captures: { item_state_1: $.data.status } }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman }
            - { call: "POST /crating/items/${item_id}/crates", payload: { design_id: "${design_id}" }, as: ShopForeman, captures: { crate_id: $.data.id } }
            - { call: "POST /crating/crates/${crate_id}/build", payload: {}, as: ShopForeman }
          trigger:
            - { call: "POST /crating/crates/${crate_id}/pack", payload: { indicator_g: 75, moisture_barrier: NONE }, as: ShopForeman }
            - { call: "GET /crating/items/${item_id}", payload: {}, as: ShopForeman, captures: { item_state_packed: $.data.status } }
            - { call: "POST /crating/crates/${crate_id}/seal", payload: {}, as: ComplianceOfficer }
            - { call: "GET /crating/items/${item_id}", payload: {}, as: ShopForeman, captures: { item_state_sealed: $.data.status } }
          assert:
            - "after approve: Item.status == DESIGN_APPROVED"
            - "after pack: Item.status == PACKED"
            - "after seal: Item.status == SEALED"
      - name: container_unlock_with_payload_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Container.LOCKED_to_PLANNING, "errors[ERR_CONTAINER_INVALID_STATE]"]
        distinguishing_aspect: "Unlock requires payload_used_kg == 0; with a LOADED crate aboard (98.6 kg) unlock fails with ERR_CONTAINER_INVALID_STATE."
        test_recipe:
          setup: ["sealed crate (gross 98.6) loaded on 20FT container; container LOCKED"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Lock Co", site_code: "LCK-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Gearmotor", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 30000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0103", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 500, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman }
            - { call: "POST /crating/items/${item_id}/crates", payload: { design_id: "${design_id}" }, as: ShopForeman, captures: { crate_id: $.data.id } }
            - { call: "POST /crating/crates/${crate_id}/build", payload: {}, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/pack", payload: { indicator_g: 75, moisture_barrier: NONE }, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/seal", payload: {}, as: ComplianceOfficer }
            - { call: "POST /crating/containers", payload: { container_no: "BEAU4445556", size: 20FT, dunnage_weight_kg: 0 }, as: LogisticsCoordinator, captures: { cont_id: $.data.id } }
            - { call: "POST /crating/containers/${cont_id}/load-crate", payload: { crate_id: "${crate_id}" }, as: LogisticsCoordinator }
            - { call: "POST /crating/containers/${cont_id}/lock", payload: {}, as: LogisticsCoordinator }
          trigger:
            - { call: "POST /crating/containers/${cont_id}/unlock", payload: {}, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CONTAINER_INVALID_STATE; Container remains LOCKED with payload_used_kg == 98.6"]
      - name: double_accept_quote_rejected
        claim_type: idempotency
        grounds: [state_machines.PackingJob.QUOTED_to_DESIGN]
        excluded_because:
          difficulty_instance: accept_quote_state_beats_fiscal
          rationale: "The second accept-quote is the trigger of that §1.8 instance; ERR_JOB_INVALID_STATE asserted there."

  - section: calculations
    instances:
      - name: freight_class_tier_boundary
        claim_type: correct_result
        grounds: [calculations.freight_classification, entities.Crate.fields.freight_class]
        distinguishing_aspect: "Two crates with identical 50x50x50 geometry (tare 48.6, volume 0.257259 m3): weight 55 -> density 402.71 -> class '60' (>= 400 inclusive floor); weight 50 -> density 383.27 -> class '65'. The 400 kg/m3 tier floor is crossed by weight alone."
        test_recipe:
          setup: ["SHOP job with two STANDARD 50x50x50 items (55 kg and 50 kg); designs approved; quote accepted (DESIGN); crates created (freight_class computed at creation)"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Freight Co", site_code: "FRT-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Dense 55", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 55, fragile_class: STANDARD, declared_value_cents: 10000 }, as: SalesRep, captures: { item1_id: $.data.id, item1_v: $.data.version } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Light 50", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 10000 }, as: SalesRep, captures: { item2_id: $.data.id, item2_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0110", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 500, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item1_id}/designs", payload: { expected_item_version: "${item1_v}" }, as: CratingDesigner, captures: { design1_id: $.data.id } }
            - { call: "POST /crating/designs/${design1_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design1_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/items/${item2_id}/designs", payload: { expected_item_version: "${item2_v}" }, as: CratingDesigner, captures: { design2_id: $.data.id } }
            - { call: "POST /crating/designs/${design2_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design2_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /crating/items/${item1_id}/crates", payload: { design_id: "${design1_id}" }, as: ShopForeman, captures: { fc1: $.data.freight_class, d1: $.data.freight_density_kg_m3 } }
            - { call: "POST /crating/items/${item2_id}/crates", payload: { design_id: "${design2_id}" }, as: ShopForeman, captures: { fc2: $.data.freight_class, d2: $.data.freight_density_kg_m3 } }
          assert:
            - "crate1: freight_density_kg_m3 == 402.71 and freight_class == '60' (103.6 / 0.257259)"
            - "crate2: freight_density_kg_m3 == 383.27 and freight_class == '65' (98.6 / 0.257259)"
      - name: quote_onsite_mode_multiplier
        claim_type: constants_applied
        grounds: [calculations.job_quote, entities.PackingJob.fields.estimated_labor_hours]
        distinguishing_aspect: "ONSITE mode applies HOURS_PER_M3 2.5, rate 12000, and the flat 15000 travel surcharge: same 100x80x60/40kg item as the SHOP quote (34139) yields 70043 — only mode changed."
        test_recipe:
          setup: ["Customer, ONSITE/EXW job in QUOTED, one Item 100x80x60 / 40 kg / STANDARD with approved design (56 bf)"]
          setup_api_calls:
