scenario: |
  731. Plant Shop & Indoor-Garden Boutique: SKU & live-plant care/light tag,
  repotting service & workshop, plant warranty/guarantee, subscription
  (plant-of-the-month) & care reminder, local delivery & gift, loyalty,
  special order, shrink/care log

domain_name: plant-shop-boutique
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - rate_threshold_triggers
    - selector_policy

  entity_topology: flat
  # Peer entities linked through foreign keys; Order/Subscription/Workshop/WarrantyClaim
  # do not nest under Customer in URLs — they are queried via filtered lists.

  state_machine_shape: parallel
  # Order carries two independent state dimensions (payment_status × fulfillment_status);
  # SpecialOrder has a cyclic revision loop (QUOTED -> RE_QUOTED -> QUOTED);
  # WarrantyClaim has branching (SUBMITTED -> {APPROVED, DENIED, WITHDRAWN}).

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: peer_roles
  # Customer, DeliveryDriver own their own resources by ownership check;
  # ShopStaff, Horticulturist, Manager are opaque operator roles with
  # non-overlapping exclusive operations (Horticulturist: care log & warranty
  # review; ShopStaff: order pick/pack; Manager: pricing & catalog & scheduling
  # & clock).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entities
# =============================================================================

entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "unique email address", constraints: "lowercase, matches ^[^@]+@[^@]+\\.[^@]+$" }
      - { name: full_name, type: string, source: input, description: "customer display name" }
      - { name: delivery_zone, type: enum, source: input, description: "local delivery zone", constraints: "one of ZONE_A|ZONE_B|ZONE_C" }
      - { name: address_line, type: string, source: input, description: "street address for local delivery" }
      - { name: loyalty_tier, type: enum, source: computed, description: "derived from lifetime_points_earned via tiered_pricing thresholds", constraints: "one of BRONZE|SILVER|GOLD|PLATINUM", default: BRONZE }
      - { name: points_balance, type: integer, source: computed, description: "current spendable points; equals sum of LoyaltyLedger.delta_points where reason != REDEMPTION plus REDEMPTION deltas (which are negative)", default: 0 }
      - { name: lifetime_points_earned, type: integer, source: computed, description: "cumulative accrued points, never decremented on redemption; drives loyalty_tier", default: 0 }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "refund/warranty credit balance in cents; incremented by warranty approvals and cancels", default: 0 }
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "plant SKU display name" }
      - { name: light_tag, type: enum, source: input, description: "light requirement tag on the care tag", constraints: "one of LOW|MEDIUM|BRIGHT_INDIRECT|DIRECT" }
      - { name: care_tag, type: enum, source: input, description: "care difficulty tag on the care tag", constraints: "one of EASY|MODERATE|EXPERT" }
      - { name: weight_class, type: enum, source: input, description: "packaging weight class for delivery fee calc", constraints: "one of LIGHT|STANDARD|HEAVY" }
      - { name: unit_price_cents, type: integer, source: input, description: "list price per unit in cents", constraints: ">= 100" }
      - { name: warranty_days, type: integer, source: input, description: "days after delivery during which a WarrantyClaim is eligible", constraints: ">= 0" }
      - { name: available_count, type: integer, source: computed, description: "count of StockUnits under this Plant with sale_status=FOR_SALE and health_status IN {HEALTHY, RECOVERING}", default: 0 }
  - name: StockUnit
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; SKU this physical unit belongs to" }
      - { name: acquisition_date, type: datetime, source: input, description: "date this individual live-plant was received into inventory (UTC ISO 8601)" }
      - { name: health_status, type: enum, source: computed, description: "current health; set by /stock-units/{id}/adjust and by warranty-approve cascade", constraints: "one of HEALTHY|RECOVERING|DECLINING|DEAD", default: HEALTHY }
      - { name: sale_status, type: enum, source: computed, description: "position in sales pipeline; set by order/warranty/adjust cascades", constraints: "one of FOR_SALE|RESERVED|SOLD|SHRINK|RETURNED", default: FOR_SALE }
      - { name: shrink_reason, type: enum, source: computed, description: "reason recorded when sale_status transitions to SHRINK", constraints: "one of NONE|MORTALITY|DAMAGED|EXPIRED_HOLD|WARRANTY_RETURN", default: NONE }
  - name: CareLogEntry
    parent: StockUnit
    common_fields: false
    fields:
      - { name: stock_unit_id, type: string, source: input, description: "FK -> StockUnit.id; unit the entry logs care for" }
      - { name: entry_type, type: enum, source: input, description: "type of care action or observation", constraints: "one of WATER|LIGHT_CHECK|PRUNE|REPOT|OBSERVATION|SHRINK_DECLARE" }
      - { name: actor_role, type: enum, source: system, description: "role of the actor stamped from X-User-Role", constraints: "one of Horticulturist|Manager" }
      - { name: note, type: string, source: input, description: "free-text note", default: "" }
      - { name: entered_at, type: datetime, source: system, description: "UTC timestamp stamped from server clock at write time" }
  - name: DeliveryDriver
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "driver display name" }
      - { name: daily_capacity_minutes, type: integer, source: input, description: "maximum minutes of scheduled delivery windows per calendar day (UTC)", default: 240 }
    # Anchors X-User-Role=DeliveryDriver via identity: entity_backed:DeliveryDriver.
  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the order" }
      - { name: fulfillment_status, type: enum, source: computed, description: "fulfillment dimension; independent of payment_status", constraints: "one of PENDING|DISPATCHED|DELIVERED|CANCELLED", default: PENDING }
      - { name: payment_status, type: enum, source: computed, description: "payment dimension; independent of fulfillment_status", constraints: "one of UNPAID|PAID|REFUNDED", default: UNPAID }
      - { name: delivery_zone, type: enum, source: input, description: "delivery zone snapshot at checkout", constraints: "one of ZONE_A|ZONE_B|ZONE_C" }
      - { name: gift_flag, type: boolean, source: input, description: "true when the order is flagged as a gift (adds gift-wrap surcharge)", default: false }
      - { name: applied_redemption_cents, type: integer, source: input, description: "pre-tax loyalty redemption applied at checkout; 100 points = 100 cents", default: 0 }
      - { name: subtotal_cents, type: integer, source: computed, description: "sum of OrderLine.line_subtotal_cents" }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "computed via delivery_fee_calculation at POST /orders" }
      - { name: total_cents, type: integer, source: computed, description: "computed via order_total_computation at POST /orders" }
      - { name: points_provisional, type: integer, source: computed, description: "provisional variant of loyalty_points_accrual, stamped at order creation" }
      - { name: points_finalized, type: integer, source: computed, description: "final variant of loyalty_points_accrual, stamped when fulfillment_status flips to DELIVERED", default: 0 }
  - name: OrderLine
    parent: Order
    common_fields: false
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; parent order" }
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; SKU purchased on this line" }
      - { name: stock_unit_id, type: string, source: system, description: "FK -> StockUnit.id; physical unit reserved for this line at checkout (server-selected via subscription_stock_selector)" }
      - { name: qty, type: integer, source: input, description: "quantity of this SKU on the line", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Plant.unit_price_cents snapshot at checkout" }
      - { name: line_subtotal_cents, type: integer, source: computed, description: "qty * unit_price_cents (integer cents; no per-line rounding needed)" }
      - { name: refund_status, type: enum, source: computed, description: "warranty/refund lifecycle for this line", constraints: "one of NONE|PENDING_REVIEW|REFUNDED|DENIED", default: NONE }
      - { name: refund_amount_cents, type: integer, source: computed, description: "cents credited back to Customer.wallet_credit_cents upon WarrantyClaim approval; 0 until approve", default: 0 }
  - name: DeliveryAssignment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being delivered" }
      - { name: driver_id, type: string, source: input, description: "FK -> DeliveryDriver.id; assigned driver" }
      - { name: window_start_at, type: datetime, source: input, description: "inclusive start of delivery window (UTC)" }
      - { name: window_end_at, type: datetime, source: input, description: "inclusive end of delivery window (UTC)" }
      - { name: status, type: enum, source: computed, description: "delivery lifecycle", constraints: "one of SCHEDULED|DELIVERED|FAILED", default: SCHEDULED }
  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; subscriber" }
      - { name: plan_tier, type: enum, source: input, description: "monthly-fee tier that gates featured SKU eligibility", constraints: "one of STARTER|CLASSIC|CURATOR" }
      - { name: care_tag_preference, type: enum, source: input, description: "care difficulty preference for auto-selection; must match at least one Plant.care_tag", constraints: "one of EASY|MODERATE|EXPERT" }
      - { name: light_tag_preference, type: enum, source: input, description: "light preference for auto-selection", constraints: "one of LOW|MEDIUM|BRIGHT_INDIRECT|DIRECT" }
      - { name: status, type: enum, source: computed, description: "subscription lifecycle", constraints: "one of ACTIVE|PAUSED|CANCELLED|MISSING_STOCK", default: ACTIVE }
      - { name: next_fulfillment_at, type: datetime, source: computed, description: "scheduled UTC instant for next auto-fulfillment; advances by 30 days on each successful fulfillment" }
      - { name: monthly_fee_cents, type: integer, source: computed, description: "fee snapshot for this plan_tier; STARTER=2500, CLASSIC=4500, CURATOR=8000", default: 2500 }
  - name: CareReminder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; recipient" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; producing subscription (nullable)", default: null }
      - { name: due_at, type: datetime, source: input, description: "UTC instant when the reminder becomes due" }
      - { name: message, type: string, source: input, description: "reminder body" }
      - { name: status, type: enum, source: computed, description: "auto-flips PENDING -> DUE when clock >= due_at; -> DISMISSED via customer action (out of scope in this scaffold)", constraints: "one of PENDING|DUE|DISMISSED", default: PENDING }
  - name: Workshop
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "workshop title" }
      - { name: topic, type: enum, source: input, description: "workshop topic; REPOTTING topic doubles as the repotting-workshop feature", constraints: "one of REPOTTING|LIGHT_101|PROPAGATION|PEST_CONTROL" }
      - { name: room_id, type: enum, source: input, description: "shared studio room key; overlap on same room+time is rejected", constraints: "one of STUDIO_A|STUDIO_B" }
      - { name: start_at, type: datetime, source: input, description: "workshop start (UTC); half-open interval [start_at, end_at) drives overlap check" }
      - { name: end_at, type: datetime, source: input, description: "workshop end (UTC); half-open interval [start_at, end_at) drives overlap check" }
      - { name: capacity, type: integer, source: input, description: "maximum WorkshopRegistration count with status IN {REGISTERED, ATTENDED}", constraints: ">= 1" }
      - { name: status, type: enum, source: computed, description: "workshop lifecycle", constraints: "one of SCHEDULED|COMPLETED|CANCELLED", default: SCHEDULED }
  - name: WorkshopRegistration
    parent: null
    common_fields: true
    fields:
      - { name: workshop_id, type: string, source: input, description: "FK -> Workshop.id; workshop registered for" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; registering customer" }
      - { name: status, type: enum, source: computed, description: "registration lifecycle", constraints: "one of REGISTERED|ATTENDED|CANCELLED", default: REGISTERED }
  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: orderline_id, type: string, source: input, description: "FK -> OrderLine.id; line being claimed against" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; claiming customer (must equal the parent Order.customer_id)" }
      - { name: reason, type: enum, source: input, description: "claim reason category", constraints: "one of MORTALITY|DAMAGED|MISDELIVERY|OTHER" }
      - { name: submitted_at, type: datetime, source: system, description: "server clock at POST /warranty-claims" }
      - { name: status, type: enum, source: computed, description: "claim lifecycle", constraints: "one of SUBMITTED|APPROVED|DENIED", default: SUBMITTED }
      - { name: refund_amount_cents_provisional, type: integer, source: computed, description: "provisional variant of warranty_refund_amount, stamped at submission" }
      - { name: refund_amount_cents_final, type: integer, source: computed, description: "final variant of warranty_refund_amount, stamped at approval; 0 on denial", default: 0 }
  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; requesting customer" }
      - { name: service_type, type: enum, source: input, description: "distinguishes procurement of a non-catalog SKU from an in-shop repotting service", constraints: "one of PROCUREMENT|REPOTTING" }
      - { name: sku_description, type: string, source: input, description: "free-text description of the requested SKU or repotting service" }
      - { name: status, type: enum, source: computed, description: "special-order lifecycle; QUOTED -> RE_QUOTED -> QUOTED is a cycle", constraints: "one of REQUESTED|QUOTED|RE_QUOTED|CUSTOMER_APPROVED|FULFILLED|CANCELLED", default: REQUESTED }
      - { name: quoted_price_cents, type: integer, source: input, description: "manager-set quoted price for the customer" }
      - { name: revision_count, type: integer, source: computed, description: "number of times re-quoted; increments on every RE_QUOTED transition", default: 0 }
  - name: LoyaltyLedger
    parent: Customer
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ledger holder" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; source order for accrual/reversal (nullable for REDEMPTION and MANUAL entries)", default: null }
      - { name: reason, type: enum, source: input, description: "why the entry exists", constraints: "one of ACCRUAL_PROVISIONAL|ACCRUAL_FINAL_DELTA|REVERSAL|REDEMPTION|MANUAL_ADJUST" }
      - { name: delta_points, type: integer, source: input, description: "signed delta added to points_balance; also added to lifetime_points_earned when reason IN {ACCRUAL_PROVISIONAL, ACCRUAL_FINAL_DELTA}" }
      - { name: recorded_at, type: datetime, source: system, description: "server clock at insert; append-only" }

# =============================================================================
# §1.2 State Machines
# =============================================================================

state_machines:
  - entity: Order
    initial_state: "PENDING+UNPAID"
    terminal_states: ["CANCELLED+*", "DELIVERED+PAID", "DELIVERED+REFUNDED"]
    transitions:
      - from: "PENDING+UNPAID"
        to: "PENDING+PAID"
        trigger: "POST /orders/{id}/pay"
        actor: Customer|ShopStaff
        preconditions:
          - "order.payment_status == UNPAID"
          - "order.fulfillment_status == PENDING"
        side_effects:
          - "order.payment_status = PAID"
          - "order.updated_at = server_clock; order.version += 1"
      - from: "PENDING+PAID"
        to: "DISPATCHED+PAID"
        trigger: "POST /orders/{id}/dispatch"
        actor: ShopStaff|Manager
        preconditions:
          - "order.payment_status == PAID"
          - "order.fulfillment_status == PENDING"
          - "every OrderLine.stock_unit_id resolves to a StockUnit with sale_status == RESERVED"
        side_effects:
          - "create DeliveryAssignment with SCHEDULED status; enforce driver overlap & capacity"
          - "order.fulfillment_status = DISPATCHED"
          - "order.updated_at = server_clock; order.version += 1"
      - from: "DISPATCHED+PAID"
        to: "DELIVERED+PAID"
        trigger: "POST /deliveries/{id}/deliver"
        actor: DeliveryDriver
        preconditions:
          - "delivery.status == SCHEDULED"
          - "order.payment_status == PAID  # cross-entity: Order.payment_status must be PAID before delivery finalizes"
        side_effects:
          - "delivery.status = DELIVERED"
          - "order.fulfillment_status = DELIVERED"
          - "for each OrderLine: StockUnit.sale_status FOR_SALE|RESERVED -> SOLD"
          - "recompute loyalty_points_accrual final variant -> order.points_finalized"
          - "append LoyaltyLedger(reason=ACCRUAL_FINAL_DELTA, delta_points = order.points_finalized - order.points_provisional, order_id=order.id)"
          - "recompute Customer.lifetime_points_earned; if crosses tier threshold, Customer.loyalty_tier flips (see §1.3 loyalty_tier_evaluation)"
          - "order.version += 1"
      - from: "PENDING+*"
        to: "CANCELLED+*"
        trigger: "POST /orders/{id}/cancel"
        actor: Customer|Manager
        preconditions:
          - "order.fulfillment_status == PENDING"
          - "OCC: payload.expected_order_version == order.version"
        side_effects:
          - "order.fulfillment_status = CANCELLED"
          - "for each OrderLine: StockUnit.sale_status RESERVED -> FOR_SALE; recompute Plant.available_count"
          - "if order.payment_status == PAID: order.payment_status = REFUNDED; Customer.wallet_credit_cents += order.total_cents"
          - "append LoyaltyLedger(reason=REVERSAL, delta_points = -order.points_provisional, order_id=order.id)  # points invariant: sum(delta_points for customer) unchanged"
          - "order.version += 1"
      - from: "DISPATCHED+PAID"
        to: "CANCELLED+REFUNDED"
        trigger: "POST /orders/{id}/cancel"
        actor: Manager
        preconditions:
          - "order.fulfillment_status == DISPATCHED"
          - "OCC: payload.expected_order_version == order.version"
        side_effects:
          - "same as PENDING cancel except delivery.status = FAILED"
          - "order.version += 1"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Customer
        preconditions: ["subscription.status == ACTIVE"]
        side_effects: ["subscription.status = PAUSED", "subscription.version += 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: Customer
        preconditions: ["subscription.status == PAUSED"]
        side_effects: ["subscription.status = ACTIVE", "subscription.next_fulfillment_at = max(subscription.next_fulfillment_at, clock)", "subscription.version += 1"]
      - from: ACTIVE
        to: MISSING_STOCK
        trigger: "system event during POST /_scheduler/fulfill-subscriptions"
        actor: system
        preconditions:
          - "subscription.status == ACTIVE"
          - "subscription_stock_selector returns empty candidate set for subscription's care_tag_preference & light_tag_preference"
        side_effects:
          - "subscription.status = MISSING_STOCK"
          - "subscription.next_fulfillment_at unchanged (retries on next scheduler tick)"
          - "subscription.version += 1"
      - from: MISSING_STOCK
        to: ACTIVE
        trigger: "system event during POST /_scheduler/fulfill-subscriptions"
        actor: system
        preconditions: ["subscription.status == MISSING_STOCK", "subscription_stock_selector now returns non-empty candidate set"]
        side_effects:
          - "create Order + OrderLine for the selected StockUnit (payment_status=PAID via subscription auto-charge stub)"
          - "subscription.status = ACTIVE"
          - "subscription.next_fulfillment_at += 30 days"
          - "subscription.version += 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer|Manager
        preconditions: ["subscription.status IN {ACTIVE, PAUSED, MISSING_STOCK}"]
        side_effects: ["subscription.status = CANCELLED", "subscription.version += 1"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: Horticulturist|Manager
        preconditions:
          - "warranty.status == SUBMITTED"
          - "orderline.refund_status == PENDING_REVIEW"
          - "order.fulfillment_status == DELIVERED  # cross-entity: WarrantyClaim -> Order state gate"
          - "clock - orderline.delivered_at <= plant.warranty_days (warranty period boundary check, days interpreted as 86400s buckets floor-inclusive)"
        side_effects:
          - "warranty.status = APPROVED"
          - "recompute warranty_refund_amount final variant -> warranty.refund_amount_cents_final"
          - "orderline.refund_status = REFUNDED"
          - "orderline.refund_amount_cents = warranty.refund_amount_cents_final"
          - "Customer.wallet_credit_cents += warranty.refund_amount_cents_final"
          - "StockUnit.sale_status SOLD -> RETURNED; then set to SHRINK with shrink_reason=WARRANTY_RETURN"
          - "Plant.available_count unchanged (StockUnit no longer FOR_SALE)"
          - "append LoyaltyLedger(reason=REVERSAL, delta_points = -orderline.line_subtotal_cents/100 * tier_mult_at_delivery(rounded), order_id=order.id)"
          - "warranty.version += 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: Horticulturist|Manager
        preconditions: ["warranty.status == SUBMITTED"]
        side_effects: ["warranty.status = DENIED", "orderline.refund_status = DENIED", "warranty.version += 1"]

  - entity: SpecialOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: Manager
        preconditions: ["special_order.status == REQUESTED"]
        side_effects: ["special_order.status = QUOTED", "special_order.quoted_price_cents = payload.quoted_price_cents", "special_order.version += 1"]
      - from: QUOTED
        to: RE_QUOTED
        trigger: "POST /special-orders/{id}/re-quote"
        actor: Manager
        preconditions: ["special_order.status == QUOTED"]
        side_effects: ["special_order.status = RE_QUOTED", "special_order.quoted_price_cents = payload.quoted_price_cents", "special_order.revision_count += 1", "special_order.version += 1"]
      - from: RE_QUOTED
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: Manager
        preconditions: ["special_order.status == RE_QUOTED"]
        side_effects: ["special_order.status = QUOTED", "special_order.quoted_price_cents = payload.quoted_price_cents", "special_order.version += 1"]
        note: "This is the return leg of the RE_QUOTED -> QUOTED cycle. The re_quote endpoint drives QUOTED -> RE_QUOTED; the quote endpoint drives RE_QUOTED -> QUOTED (a single re-quote turnaround increments revision_count exactly once)."
      - from: QUOTED
        to: CUSTOMER_APPROVED
        trigger: "POST /special-orders/{id}/customer-approve"
        actor: Customer
        preconditions:
          - "special_order.status == QUOTED"
          - "OCC: payload.expected_special_order_version == special_order.version  # version-pinning on approval: any RE_QUOTED cycle after the client saw the quote MUST invalidate the approval"
        side_effects: ["special_order.status = CUSTOMER_APPROVED", "special_order.version += 1"]
      - from: RE_QUOTED
        to: CUSTOMER_APPROVED
        trigger: "POST /special-orders/{id}/customer-approve"
        actor: Customer
        preconditions:
          - "special_order.status == RE_QUOTED"
          - "OCC: payload.expected_special_order_version == special_order.version"
        side_effects: ["special_order.status = CUSTOMER_APPROVED", "special_order.version += 1"]

  - entity: Workshop
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /workshops/{id}/complete"
        actor: Manager
        preconditions: ["workshop.status == SCHEDULED", "clock >= workshop.end_at"]
        side_effects:
          - "workshop.status = COMPLETED"
          - "for each WorkshopRegistration under this workshop with status == REGISTERED: status = ATTENDED (cascade down)"
          - "workshop.version += 1"

  - entity: DeliveryAssignment
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, FAILED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /deliveries/{id}/deliver"
        actor: DeliveryDriver
        preconditions:
          - "delivery.status == SCHEDULED"
          - "the acting DeliveryDriver.id == delivery.driver_id (ownership check)"
          - "order.payment_status == PAID  # cross-entity guard: DeliveryAssignment -> Order.payment_status"
        side_effects:
          - "delivery.status = DELIVERED; drives Order transition to DELIVERED (see Order state machine)"
          - "delivery.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules — narrow scope, OCC on parent.version only
# =============================================================================

concurrency_rules:
  - rule_id: order-cancel-stale-version
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/cancel"
    occ_field: "expected_order_version"
    description: |
      Cancelling an Order whose version has advanced since the client last
      observed it is rejected. This captures the case where any other
      mutation (payment, dispatch, side-effect from a delivery, etc.) has
      bumped the order between the client's read and cancel; the client's
      view is stale so the cancel is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: special-order-approve-stale-version
    parent_entity: SpecialOrder
    write_endpoint: "POST /special-orders/{id}/customer-approve"
    occ_field: "expected_special_order_version"
    description: |
      Customer-approving a SpecialOrder whose version has advanced (typically
      because Manager issued a RE_QUOTED after the customer saw the price)
      is rejected. Version-pinning on approval ensures the customer can never
      lock in a stale quoted_price_cents.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: stock-unit-adjust-stale-version
    parent_entity: StockUnit
    write_endpoint: "POST /stock-units/{id}/adjust"
    occ_field: "expected_stock_unit_version"
    description: |
      Adjusting a StockUnit's health_status/sale_status whose version has
      advanced since the operator's read is rejected. The canonical case is
      creating a shrink-declare care log against a unit that a warranty
      cascade has already flipped SOLD -> SHRINK via WARRANTY_RETURN in
      between; the operator's view is stale so the adjust is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculations
# =============================================================================

calculations:
  - name: loyalty_points_accrual
    trigger: |
      Two invocations per Order:
      (1) at POST /orders — provisional variant stamps order.points_provisional and appends LoyaltyLedger(reason=ACCRUAL_PROVISIONAL, delta_points=+provisional).
      (2) at POST /deliveries/{id}/deliver — final variant recomputes; appends LoyaltyLedger(reason=ACCRUAL_FINAL_DELTA, delta_points=(final - provisional)).
    algorithm: weighted_scoring
    formula: |
      base_points = floor(order.subtotal_cents / 100)
      tier_mult = {BRONZE: 1.0, SILVER: 1.5, GOLD: 2.0, PLATINUM: 3.0}[customer.loyalty_tier]
      points = floor(base_points * tier_mult)
    input_set: |
      Order subtotal_cents (integer cents; pre-tax, pre-delivery, POST-loyalty-redemption per order_total_computation)
      and Customer.loyalty_tier as observed AT THE VARIANT'S INVOCATION TIME.
    constants:
      TIER_MULT: { BRONZE: 1.0, SILVER: 1.5, GOLD: 2.0, PLATINUM: 3.0 }
    precision: "integer points; floor after multiplication"
    variants:
      - name: provisional
        when: "computed at POST /orders (order creation). Uses customer.loyalty_tier observed at checkout."
        difference: "Uses customer.loyalty_tier at checkout. Stamps order.points_provisional."
      - name: final
        when: "computed at POST /deliveries/{id}/deliver (delivery finalization). Uses customer.loyalty_tier observed at delivery (which may have advanced due to intervening deliveries)."
        difference: "Uses customer.loyalty_tier at delivery time. Because tier may have advanced between checkout and delivery, final > provisional is possible. A tier flip during the same order's own delivery event uses the tier AS OF the pre-cascade snapshot (i.e., this order's own delivery does NOT bump its own tier for its own accrual)."

  - name: warranty_refund_amount
    trigger: |
      Two invocations per WarrantyClaim:
      (1) at POST /warranty-claims — provisional variant stamps refund_amount_cents_provisional.
      (2) at POST /warranty-claims/{id}/approve — final variant stamps refund_amount_cents_final and drives the wallet-credit cascade.
    algorithm: weighted_scoring
    formula: |
      base = orderline.line_subtotal_cents
      age_days = floor((clock - orderline.delivered_at).total_seconds() / 86400)
      # Provisional: full base, no care-log deduction
      # Final: deduct 20% per missing MANDATORY_CARE_EVENT (cap at 3 deductions -> min 40% payout)
      missing_events = max(0, MANDATORY_CARE_INTERVAL_COUNT - count(CareLogEntry where stock_unit_id = orderline.stock_unit_id AND entry_type IN {WATER, LIGHT_CHECK, PRUNE}))
      deductions = min(missing_events, 3)
      final = floor(base * (1.0 - DEDUCTION_PCT * deductions))
    input_set: |
      base uses orderline.line_subtotal_cents (integer cents from OrderLine).
      Final variant additionally counts CareLogEntry rows with stock_unit_id = orderline.stock_unit_id
      created BETWEEN orderline.delivered_at AND warranty.submitted_at. Entries after submitted_at are excluded.
    constants:
      DEDUCTION_PCT: 0.20
      MANDATORY_CARE_INTERVAL_COUNT: 3
    precision: "integer cents; floor after multiplication"
    variants:
      - name: provisional
        when: "computed at POST /warranty-claims (submission). Uses full base with zero deductions."
        difference: "No care-log adjudication; returns full line_subtotal_cents. Stamped to refund_amount_cents_provisional."
      - name: final
        when: "computed at POST /warranty-claims/{id}/approve. Applies care-log deductions."
        difference: "Deducts DEDUCTION_PCT per missing MANDATORY_CARE_EVENT (capped at 3). Stamped to refund_amount_cents_final. Drives Customer.wallet_credit_cents cascade."

  - name: delivery_fee_calculation
    trigger: "POST /orders — stamps order.delivery_fee_cents at checkout."
    algorithm: tiered_pricing
    formula: |
      # Mode (a) — ≥3 inputs (delivery_zone, heavy_present, gift_flag, subtotal), non-linear
      # with a conditional branch that gates heavy_surcharge on both zone and cart size.
      base = BASE_FEE_CENTS
      zone_surcharge = ZONE_SURCHARGE_CENTS[order.delivery_zone]
      heavy_present = (any orderline where plant.weight_class == HEAVY)
      heavy_surcharge = HEAVY_SURCHARGE_CENTS
                        if (heavy_present AND order.delivery_zone != ZONE_A AND order.subtotal_cents < HEAVY_WAIVER_THRESHOLD_CENTS)
                        else 0
      gift_surcharge = GIFT_SURCHARGE_CENTS if order.gift_flag else 0
      raw = base + zone_surcharge + heavy_surcharge + gift_surcharge
      fee = max(MIN_FEE_CENTS, min(raw, MAX_FEE_CENTS))
    input_set: "All OrderLine rows attached to the current Order; Plant.weight_class for each line."
    constants:
      BASE_FEE_CENTS: 500
      ZONE_SURCHARGE_CENTS: { ZONE_A: 0, ZONE_B: 300, ZONE_C: 700 }
      HEAVY_SURCHARGE_CENTS: 400
      GIFT_SURCHARGE_CENTS: 200
      MIN_FEE_CENTS: 800
      MAX_FEE_CENTS: 3000
      HEAVY_WAIVER_THRESHOLD_CENTS: 10000
    precision: "integer cents"

  - name: order_total_computation
    trigger: "POST /orders — stamps order.total_cents at checkout."
    algorithm: aggregation
    formula: |
      # Mode (b) — evaluation order pinned. The scaffold pins:
      #   Step 1: sum line subtotals (integer cents; no per-line rounding)
      #   Step 2: apply loyalty redemption BEFORE tax (pre-tax discount)
      #   Step 3: THEN apply tax on the discounted amount
      #   Step 4: add delivery fee
      # A "sum-then-tax-then-subtract-redemption" ordering yields a different total
      # whenever applied_redemption_cents * TAX_RATE >= 0.5 cent. This scaffold
      # rejects the alternative ordering.
      subtotal_cents = sum(orderline.line_subtotal_cents)   # integer sum
      after_redemption = subtotal_cents - order.applied_redemption_cents
      tax_cents = round_half_up(after_redemption * TAX_RATE)  # nearest integer cent
      total_cents = after_redemption + tax_cents + order.delivery_fee_cents
    input_set: "All OrderLine rows attached to the current Order."
    constants:
      TAX_RATE: 0.0875
    precision: "integer cents; round_half_up on the single tax rounding step; all other operations exact integer arithmetic."

  - name: subscription_stock_selector
    trigger: "POST /_scheduler/fulfill-subscriptions — for each ACTIVE or MISSING_STOCK subscription due for fulfillment (clock >= next_fulfillment_at), server selects a StockUnit."
    algorithm: waterfall_allocation
    formula: |
      candidates = [
        su for su in StockUnit
        if su.sale_status == FOR_SALE
        AND su.health_status == HEALTHY
        AND Plant(su.plant_id).care_tag == subscription.care_tag_preference
        AND Plant(su.plant_id).light_tag == subscription.light_tag_preference
        AND Plant(su.plant_id).unit_price_cents <= PLAN_PRICE_CEILING[subscription.plan_tier]
      ]
      # Ranking: prefer oldest acquisition_date (freshens stock rotation).
      # Tie-break (order-sensitive with equal ranking key): oldest StockUnit.created_at ASC.
      # UUID `id` values are NEVER used for ordering (§1.3 no-random rule).
      candidates.sort(key = (su.acquisition_date ASC, su.created_at ASC))
      # Empty fallback: subscription.status = MISSING_STOCK (see §1.2 Subscription state machine).
      selected = candidates[0] if candidates else None
    input_set: "All StockUnit rows in FOR_SALE + HEALTHY state matching the subscription's care/light preference and plan-tier price ceiling."
    constants:
      PLAN_PRICE_CEILING: { STARTER: 3000, CLASSIC: 6000, CURATOR: 15000 }
    precision: "N/A (selection)"

  - name: loyalty_tier_evaluation
    trigger: "Any mutation that changes Customer.lifetime_points_earned (LoyaltyLedger append with reason IN {ACCRUAL_PROVISIONAL, ACCRUAL_FINAL_DELTA}). Runs AFTER the ledger append."
    algorithm: threshold
    formula: |
      # >= comparisons: exactly 500 lifetime_points_earned crosses to SILVER.
      if lifetime >= TIER_THRESHOLDS.PLATINUM: tier = PLATINUM
      elif lifetime >= TIER_THRESHOLDS.GOLD: tier = GOLD
      elif lifetime >= TIER_THRESHOLDS.SILVER: tier = SILVER
      else: tier = BRONZE
    input_set: "Customer.lifetime_points_earned (recomputed after ledger append)."
    constants:
      TIER_THRESHOLDS: { SILVER: 500, GOLD: 2000, PLATINUM: 10000 }
    precision: "N/A (categorical)"

# =============================================================================
# §1.4 Validations (ordered by priority)
# =============================================================================

validations:
  # 1. Authentication
  - { priority: 1, category: auth, check: "X-User-Role header present and value is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "X-User-ID header present when the role is entity_backed (Customer, DeliveryDriver)", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  # 3. Authorization
  - { priority: 3, category: auth, check: "Role permitted for this operation per RBAC", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 4, category: auth, check: "For entity_backed roles, X-User-ID equals the resource's owning entity id (Customer: order.customer_id, subscription.customer_id, warranty.customer_id, workshop_registration.customer_id, care_reminder.customer_id, special_order.customer_id; DeliveryDriver: delivery.driver_id)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "Customer-owned & DeliveryDriver-owned endpoints" }
  # 5. Existence
  - { priority: 5, category: existence, check: "Every path parameter and every FK in payload references an existing entity (left-to-right in URL: {id} in /plants/{id}/stock-units resolves Plant first)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  # 6. Request shape
  - { priority: 6, category: existence, check: "All required input fields present; extra fields ignored; enum values match declared constraints; types match", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: all }
  # 7. State preconditions
  - { priority: 7, category: state, check: "Target resource in the correct FROM state for the requested transition (see §1.2 preconditions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all POST action endpoints" }
  - { priority: 8, category: state, check: "OCC parent.version match: payload.expected_<parent>_version == parent.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /orders/{id}/cancel; POST /special-orders/{id}/customer-approve; POST /stock-units/{id}/adjust" }
  # 9. Business — safety (care/warranty)
  - { priority: 9, category: business_safety, check: "WarrantyClaim: clock - orderline.delivered_at <= plant.warranty_days (boundary: >= plant.warranty_days+1 rejects)", error_id: ERR_WARRANTY_EXPIRED, http_status: 422, applies_to: "POST /warranty-claims" }
  - { priority: 10, category: business_safety, check: "StockUnit target of /adjust must not be in a terminal shrink state paired with an incoming FOR_SALE flip (SHRINK cannot become FOR_SALE)", error_id: ERR_STOCK_UNIT_UNHEALTHY, http_status: 422, applies_to: "POST /stock-units/{id}/adjust" }
  # 11. Business — referential/temporal (temporal takes priority over referential per Rule 5 instance-2 differentiation)
  - { priority: 11, category: business_temporal, check: "Workshop registration cutoff: clock < workshop.start_at - 24h; late registration rejected", error_id: ERR_WORKSHOP_TOO_LATE, http_status: 422, applies_to: "POST /workshops/{id}/register" }
  - { priority: 12, category: business_temporal, check: "Workshop create: no other workshop on the same room_id overlaps [start_at, end_at) OR falls within a 15-minute buffer window on either side", error_id: ERR_WORKSHOP_OVERLAP, http_status: 409, applies_to: "POST /workshops" }
  - { priority: 13, category: business_temporal, check: "DeliveryAssignment: no other delivery for the same driver_id has a [window_start_at, window_end_at] closed interval overlapping this one; and driver's total scheduled minutes on the UTC calendar day of window_start_at must not exceed daily_capacity_minutes", error_id: ERR_DELIVERY_OVERLAP, http_status: 409, applies_to: "POST /orders/{id}/dispatch" }
  - { priority: 14, category: business_referential, check: "Workshop registration: workshop has fewer than workshop.capacity registrations with status IN {REGISTERED, ATTENDED}", error_id: ERR_WORKSHOP_FULL, http_status: 409, applies_to: "POST /workshops/{id}/register" }
  - { priority: 15, category: business_referential, check: "OrderLine plant/stock: every payload line's plant_id has plant.available_count >= line.qty and a HEALTHY FOR_SALE StockUnit exists", error_id: ERR_STOCK_UNAVAILABLE, http_status: 409, applies_to: "POST /orders" }
  - { priority: 16, category: business_referential, check: "WarrantyClaim.customer_id == parent OrderLine.order.customer_id (the claimer must own the order)", error_id: ERR_WARRANTY_NOT_ELIGIBLE, http_status: 422, applies_to: "POST /warranty-claims" }
  # 17. Business — fiscal
  - { priority: 17, category: business_fiscal, check: "Order applied_redemption_cents <= customer.points_balance * 1 cent-per-point; and applied_redemption_cents <= sum(line_subtotal_cents)", error_id: ERR_INSUFFICIENT_LOYALTY, http_status: 402, applies_to: "POST /orders" }
  - { priority: 18, category: business_fiscal, check: "Manager cannot re-quote a SpecialOrder whose revision_count would exceed 3", error_id: ERR_SPECIAL_ORDER_INVALID_STATE, http_status: 409, applies_to: "POST /special-orders/{id}/re-quote" }
  - { priority: 19, category: business_fiscal, check: "Delivery zone consistency: order.delivery_zone matches customer.delivery_zone at checkout (customer cannot ship out-of-zone)", error_id: ERR_DELIVERY_OUT_OF_ZONE, http_status: 422, applies_to: "POST /orders" }

# =============================================================================
# §1.5 Endpoints
# =============================================================================

endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical clock. Default startup time is 2026-03-01T00:00:00Z;
      before any call to this endpoint the logical clock reads exactly 2026-03-01T00:00:00Z
      and MUST NOT fall back to real wall-clock time. Every time-gated feature
      (warranty period, workshop start_at, subscription next_fulfillment_at, care_reminder due_at)
      observes this logical clock.
    roles: [Manager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/customers/register"
    description: "Create a Customer (self-registration). loyalty_tier defaults to BRONZE and points_balance to 0."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, delivery_zone, address_line]
    output: Customer
    side_effects: ["customer created with lifetime_points_earned=0"]
  - method: GET
    path: "/customers/{id}"
    description: "Read a Customer."
    roles: [Customer, Manager, ShopStaff]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}/loyalty-ledger"
    description: "Reverse-reachability GET for LoyaltyLedger.customer_id (sub-resource form)."
    roles: [Customer, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: LoyaltyLedger[]
    side_effects: []
  - method: GET
    path: "/orders/{id}/loyalty-ledger"
    description: "Reverse-reachability GET for LoyaltyLedger.order_id (sub-resource form)."
    roles: [Customer, ShopStaff, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: LoyaltyLedger[]
    side_effects: []

  # --- Plant / StockUnit / CareLog ---
  - method: POST
    path: "/plants"
    description: "Create a Plant SKU."
    roles: [Manager]
    code: 201
    input: [name, light_tag, care_tag, weight_class, unit_price_cents, warranty_days]
    output: Plant
    side_effects: []
  - method: GET
    path: "/plants/{id}"
    description: "Read a Plant SKU."
    roles: [Anonymous, Customer, ShopStaff, Manager, Horticulturist]
    code: 200
    input: []
    output: Plant
    side_effects: []
  - method: POST
    path: "/plants/{id}/stock-units"
    description: "Intake a physical StockUnit under the given Plant."
    roles: [ShopStaff, Manager]
    code: 201
    input: [acquisition_date]
    output: StockUnit
    side_effects: ["Plant.available_count += 1"]
  - method: GET
    path: "/plants/{id}/stock-units"
    description: "Reverse-reachability GET for StockUnit.plant_id (sub-resource form)."
    roles: [ShopStaff, Manager, Horticulturist]
    code: 200
    input: ["health_status?", "sale_status?", "limit?", "offset?"]
    output: StockUnit[]
    side_effects: []
  - method: GET
    path: "/stock-units/{id}"
    description: "Read a StockUnit."
    roles: [ShopStaff, Manager, Horticulturist]
    code: 200
    input: []
    output: StockUnit
    side_effects: []
  - method: POST
    path: "/stock-units/{id}/adjust"
    description: "Adjust a StockUnit's health_status / sale_status (OCC on parent.version)."
    roles: [Manager]
    code: 200
    input: [expected_stock_unit_version, "health_status?", "sale_status?", "shrink_reason?"]
    output: StockUnit
    side_effects: ["StockUnit.version increments by 1", "if sale_status transitions to SHRINK, Plant.available_count -= 1 when the from-state was FOR_SALE"]
  - method: POST
    path: "/stock-units/{id}/care-log"
    description: "Append a CareLogEntry for the given StockUnit."
    roles: [Horticulturist, Manager]
    code: 201
    input: [entry_type, "note?"]
    output: CareLogEntry
    side_effects: ["CareLogEntry.entered_at stamped from clock"]
  - method: GET
    path: "/stock-units/{id}/care-log"
    description: "Reverse-reachability GET for CareLogEntry.stock_unit_id (sub-resource form)."
    roles: [Horticulturist, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: CareLogEntry[]
    side_effects: []

  # --- Delivery driver ---
  - method: POST
    path: "/delivery-drivers"
    description: "Onboard a DeliveryDriver."
    roles: [Manager]
    code: 201
    input: [name, "daily_capacity_minutes?"]
    output: DeliveryDriver
    side_effects: []
  - method: GET
    path: "/delivery-drivers/{id}"
    description: "Read a DeliveryDriver."
    roles: [DeliveryDriver, ShopStaff, Manager]
    code: 200
    input: []
    output: DeliveryDriver
    side_effects: []

  # --- Order & OrderLine ---
  - method: POST
    path: "/orders"
    description: "Checkout: create an Order and its OrderLines. Triggers delivery_fee_calculation, order_total_computation, and loyalty_points_accrual (provisional). Server reserves one FOR_SALE HEALTHY StockUnit per line via subscription_stock_selector-style eligibility (matching plant_id, oldest acquisition_date, tie-break by oldest created_at)."
    roles: [Customer, ShopStaff]
    code: 201
    input: [customer_id, delivery_zone, "gift_flag?", "applied_redemption_cents?", lines]
    output: Order
    side_effects:
      - "for each line: OrderLine created; server-selected StockUnit.sale_status FOR_SALE -> RESERVED; Plant.available_count -= line.qty"
      - "order.delivery_fee_cents computed"
      - "order.total_cents computed"
      - "order.points_provisional computed"
      - "append LoyaltyLedger(reason=ACCRUAL_PROVISIONAL, delta_points=+order.points_provisional)"
      - "Customer.points_balance and Customer.lifetime_points_earned recomputed"
      - "Customer.loyalty_tier re-evaluated (may cross a threshold)"
  - method: GET
    path: "/orders/{id}"
    description: "Read an Order."
    roles: [Customer, ShopStaff, Manager, DeliveryDriver]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "Filtered-list Order (reverse-reachability GET for Order.customer_id)."
    roles: [Customer, ShopStaff, Manager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "Filtered-list OrderLine (reverse-reachability GET for OrderLine.order_id, OrderLine.plant_id, OrderLine.stock_unit_id)."
    roles: [Customer, ShopStaff, Manager]
    code: 200
    input: ["order_id?", "plant_id?", "stock_unit_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/order-lines/{id}"
    description: "Read an OrderLine."
    roles: [Customer, ShopStaff, Manager]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: POST
    path: "/orders/{id}/pay"
    description: "Mark Order paid (payment dimension)."
    roles: [Customer, ShopStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["order.payment_status = PAID", "order.version += 1"]
  - method: POST
    path: "/orders/{id}/dispatch"
    description: "Dispatch an Order and schedule its DeliveryAssignment. Enforces DeliveryDriver overlap and daily capacity."
    roles: [ShopStaff, Manager]
    code: 201
    input: [driver_id, window_start_at, window_end_at]
    output: DeliveryAssignment
    side_effects:
      - "DeliveryAssignment created with status=SCHEDULED"
      - "order.fulfillment_status = DISPATCHED"
      - "order.version += 1"
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an Order (OCC on expected_order_version). Refunds if paid, releases reserved stock, appends a LoyaltyLedger REVERSAL entry that preserves the points invariant."
    roles: [Customer, Manager]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects:
      - "cascade per §1.2 Order transition PENDING+*|DISPATCHED+PAID -> CANCELLED+*"
      - "order.version += 1"

  # --- Delivery ---
  - method: POST
    path: "/deliveries/{id}/deliver"
    description: "Driver marks a DeliveryAssignment delivered. Drives Order DISPATCHED+PAID -> DELIVERED+PAID cascade and loyalty finalization."
    roles: [DeliveryDriver]
    code: 200
    input: []
    output: DeliveryAssignment
    side_effects:
      - "delivery.status = DELIVERED; delivery.version += 1"
      - "order.fulfillment_status = DELIVERED; order.version += 1"
      - "for each OrderLine: StockUnit.sale_status RESERVED -> SOLD"
      - "recompute loyalty_points_accrual final; append LoyaltyLedger(reason=ACCRUAL_FINAL_DELTA, delta_points=(final - provisional))"
      - "Customer.lifetime_points_earned and Customer.loyalty_tier recomputed"
  - method: GET
    path: "/deliveries"
    description: "Filtered-list DeliveryAssignment (reverse-reachability GET for DeliveryAssignment.order_id and DeliveryAssignment.driver_id)."
    roles: [ShopStaff, Manager, DeliveryDriver]
    code: 200
    input: ["order_id?", "driver_id?", "limit?", "offset?"]
    output: DeliveryAssignment[]
    side_effects: []
  - method: GET
    path: "/deliveries/{id}"
    description: "Read a DeliveryAssignment."
    roles: [DeliveryDriver, ShopStaff, Manager]
    code: 200
    input: []
    output: DeliveryAssignment
    side_effects: []

  # --- Subscription ---
  - method: POST
    path: "/subscriptions"
    description: "Create a plant-of-the-month Subscription. Sets next_fulfillment_at to now + 30 days."
    roles: [Customer]
    code: 201
    input: [customer_id, plan_tier, care_tag_preference, light_tag_preference]
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "Filtered-list Subscription (reverse-reachability GET for Subscription.customer_id)."
    roles: [Customer, Manager]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}"
    description: "Read a Subscription."
    roles: [Customer, Manager]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/pause"
    description: "Pause an ACTIVE Subscription."
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["subscription.status = PAUSED; subscription.version += 1"]
  - method: POST
    path: "/subscriptions/{id}/resume"
    description: "Resume a PAUSED Subscription."
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["subscription.status = ACTIVE; subscription.next_fulfillment_at bumped to max(next_fulfillment_at, clock); subscription.version += 1"]
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a Subscription (terminal)."
    roles: [Customer, Manager]
    code: 200
    input: []
    output: Subscription
    side_effects: ["subscription.status = CANCELLED; subscription.version += 1"]
  - method: POST
    path: "/_scheduler/fulfill-subscriptions"
    description: "Test-driving batch endpoint: for every Subscription with status IN {ACTIVE, MISSING_STOCK} and next_fulfillment_at <= clock, run subscription_stock_selector. On hit: create Order+OrderLine, transition MISSING_STOCK -> ACTIVE if needed, advance next_fulfillment_at by 30 days. On miss: transition ACTIVE -> MISSING_STOCK. Emits a batch summary in the response body."
    roles: [Manager]
    code: 200
    input: []
    output: { processed_count: integer, fulfilled_count: integer, missed_count: integer }
    side_effects:
      - "may create Order + OrderLine per fulfillment (cascades through all order creation side-effects)"
      - "subscription.status and next_fulfillment_at updated per §1.2"
      - "CareReminder rows may be created as post-fulfillment reminders"
  - method: GET
    path: "/care-reminders"
    description: "Filtered-list CareReminder (reverse-reachability GET for CareReminder.customer_id and CareReminder.subscription_id)."
    roles: [Customer, Manager]
    code: 200
    input: ["customer_id?", "subscription_id?", "status?", "limit?", "offset?"]
    output: CareReminder[]
    side_effects: []
  - method: GET
    path: "/care-reminders/{id}"
    description: "Read a CareReminder."
    roles: [Customer, Manager]
    code: 200
    input: []
    output: CareReminder
    side_effects: []

  # --- Workshop ---
  - method: POST
    path: "/workshops"
    description: "Schedule a Workshop (repotting, propagation, etc). Rejects overlap on same room_id and buffer."
    roles: [Manager]
    code: 201
    input: [title, topic, room_id, start_at, end_at, capacity]
    output: Workshop
    side_effects: []
  - method: GET
    path: "/workshops/{id}"
    description: "Read a Workshop."
    roles: [Anonymous, Customer, ShopStaff, Manager]
    code: 200
    input: []
    output: Workshop
    side_effects: []
  - method: POST
    path: "/workshops/{id}/register"
    description: "Customer registers for a Workshop. Rejects when full or when clock >= workshop.start_at - 24h."
    roles: [Customer]
    code: 201
    input: [customer_id]
    output: WorkshopRegistration
    side_effects: ["WorkshopRegistration created with status=REGISTERED"]
  - method: POST
    path: "/workshops/{id}/complete"
    description: "Manager marks a Workshop COMPLETED (only after end_at). Cascades REGISTERED -> ATTENDED across registrations."
    roles: [Manager]
    code: 200
    input: []
    output: Workshop
    side_effects: ["workshop.status = COMPLETED", "for each WorkshopRegistration with status == REGISTERED under this workshop: status = ATTENDED"]
  - method: GET
    path: "/workshop-registrations"
    description: "Filtered-list WorkshopRegistration (reverse-reachability GET for WorkshopRegistration.workshop_id and WorkshopRegistration.customer_id)."
    roles: [Customer, Manager]
    code: 200
    input: ["workshop_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: WorkshopRegistration[]
    side_effects: []
  - method: GET
    path: "/workshop-registrations/{id}"
    description: "Read a WorkshopRegistration."
    roles: [Customer, Manager]
    code: 200
    input: []
    output: WorkshopRegistration
    side_effects: []

  # --- Warranty ---
  - method: POST
    path: "/warranty-claims"
    description: "Submit a WarrantyClaim against an OrderLine. Provisional refund stamped from warranty_refund_amount."
    roles: [Customer]
    code: 201
    input: [orderline_id, customer_id, reason]
    output: WarrantyClaim
    side_effects: ["orderline.refund_status = PENDING_REVIEW", "warranty.refund_amount_cents_provisional computed"]
  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Approve a WarrantyClaim. Final refund computed, cascades through OrderLine, Customer.wallet_credit_cents, StockUnit shrink flag, and LoyaltyLedger reversal."
    roles: [Horticulturist, Manager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "warranty.status = APPROVED; warranty.refund_amount_cents_final computed"
      - "orderline.refund_status = REFUNDED; orderline.refund_amount_cents = final"
      - "Customer.wallet_credit_cents += final"
      - "StockUnit.sale_status SOLD -> RETURNED then SHRINK with shrink_reason=WARRANTY_RETURN"
      - "append LoyaltyLedger(reason=REVERSAL) offsetting the delivered accrual"
      - "warranty.version += 1"
  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Deny a WarrantyClaim."
    roles: [Horticulturist, Manager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["warranty.status = DENIED; orderline.refund_status = DENIED; warranty.version += 1"]
  - method: GET
    path: "/warranty-claims"
    description: "Filtered-list WarrantyClaim (reverse-reachability GET for WarrantyClaim.customer_id and WarrantyClaim.orderline_id)."
    roles: [Customer, Horticulturist, Manager]
    code: 200
    input: ["customer_id?", "orderline_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Read a WarrantyClaim."
    roles: [Customer, Horticulturist, Manager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  # --- Special order (repotting + procurement) ---
  - method: POST
    path: "/special-orders"
    description: "Customer requests a special procurement or an in-shop repotting service."
    roles: [Customer, ShopStaff]
    code: 201
    input: [customer_id, service_type, sku_description]
    output: SpecialOrder
    side_effects: ["status=REQUESTED"]
  - method: POST
    path: "/special-orders/{id}/quote"
    description: "Manager quotes a REQUESTED (or RE_QUOTED) SpecialOrder."
    roles: [Manager]
    code: 200
    input: [quoted_price_cents]
    output: SpecialOrder
    side_effects: ["status = QUOTED; quoted_price_cents set; version += 1"]
  - method: POST
    path: "/special-orders/{id}/re-quote"
    description: "Manager re-quotes a QUOTED SpecialOrder. QUOTED -> RE_QUOTED is the outbound leg of the revision cycle; a subsequent /quote returns RE_QUOTED -> QUOTED. Increments revision_count."
    roles: [Manager]
    code: 200
    input: [quoted_price_cents]
    output: SpecialOrder
    side_effects: ["status = RE_QUOTED; revision_count += 1; quoted_price_cents set; version += 1"]
  - method: POST
    path: "/special-orders/{id}/customer-approve"
    description: "Customer locks in the quoted price. OCC on expected_special_order_version prevents accepting a stale quote."
    roles: [Customer]
    code: 200
    input: [expected_special_order_version]
    output: SpecialOrder
    side_effects: ["status = CUSTOMER_APPROVED; version += 1"]
  - method: GET
    path: "/special-orders"
    description: "Filtered-list SpecialOrder (reverse-reachability GET for SpecialOrder.customer_id)."
    roles: [Customer, Manager]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: SpecialOrder[]
    side_effects: []
  - method: GET
    path: "/special-orders/{id}"
    description: "Read a SpecialOrder."
    roles: [Customer, Manager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []

# =============================================================================
# §1.6 Error catalog
# =============================================================================

errors:
  - { id: ERR_UNAUTHENTICATED,             http: 401, condition: "X-User-Role missing/invalid, or entity_backed role missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED,                http: 403, condition: "role not permitted for endpoint, or entity_backed role acting on non-owned resource" }
  - { id: ERR_NOT_FOUND,                   http: 404, condition: "path parameter or FK references a non-existent entity" }
  - { id: ERR_INVALID_REQUEST,             http: 400, condition: "required input field missing / enum out of range / type mismatch" }
  - { id: ERR_INVALID_STATE,               http: 409, condition: "target resource not in valid FROM state for requested transition" }
  - { id: ERR_STALE_VERSION,               http: 412, condition: "OCC parent.version mismatch: payload.expected_<parent>_version != parent.version" }
  - { id: ERR_STOCK_UNAVAILABLE,           http: 409, condition: "OrderLine cannot be reserved: Plant.available_count < line.qty or no FOR_SALE HEALTHY StockUnit exists" }
  - { id: ERR_STOCK_UNIT_UNHEALTHY,        http: 422, condition: "attempted /stock-units/{id}/adjust flip forbidden by state machine (e.g., SHRINK -> FOR_SALE)" }
  - { id: ERR_INSUFFICIENT_LOYALTY,        http: 402, condition: "applied_redemption_cents exceeds customer.points_balance (1 point = 1 cent) or exceeds order subtotal" }
  - { id: ERR_WARRANTY_EXPIRED,            http: 422, condition: "clock - orderline.delivered_at > plant.warranty_days (day-buckets floor)" }
  - { id: ERR_WARRANTY_NOT_ELIGIBLE,       http: 422, condition: "WarrantyClaim.customer_id != parent OrderLine.order.customer_id" }
  - { id: ERR_WORKSHOP_FULL,               http: 409, condition: "workshop has capacity registrations already in {REGISTERED, ATTENDED}" }
  - { id: ERR_WORKSHOP_OVERLAP,            http: 409, condition: "workshop room_id + half-open interval overlaps another workshop or falls within the 15-minute buffer on either side" }
  - { id: ERR_WORKSHOP_TOO_LATE,           http: 422, condition: "register attempt with clock >= workshop.start_at - 24h" }
  - { id: ERR_DELIVERY_OVERLAP,            http: 409, condition: "another SCHEDULED DeliveryAssignment for the same driver has a closed-interval overlap, or driver's daily_capacity_minutes would be exceeded" }
  - { id: ERR_DELIVERY_OUT_OF_ZONE,        http: 422, condition: "order.delivery_zone != customer.delivery_zone at checkout" }
  - { id: ERR_SPECIAL_ORDER_INVALID_STATE, http: 409, condition: "SpecialOrder re-quote/quote/customer-approve called from an invalid FROM state, OR revision_count would exceed 3 on re-quote" }
  - { id: ERR_SUBSCRIPTION_INACTIVE,       http: 409, condition: "attempted pause on a non-ACTIVE Subscription, or attempted resume on a non-PAUSED one" }
  - { id: ERR_SUBSCRIPTION_MISSING_STOCK,  http: 409, condition: "scheduler tried to fulfill a subscription but subscription_stock_selector returned empty; captured as a scheduler-summary field, not a client-facing error (state MISSING_STOCK stamped instead)" }
  - { id: ERR_REFUND_CAP_EXCEEDED,         http: 422, condition: "cumulative refund_amount_cents_final for a Customer's warranty approvals in the last 30 UTC days plus this claim's final would exceed 20000 cents (customer refund cap)" }

# =============================================================================
# §1.7 RBAC
# =============================================================================

roles:
  - name: Anonymous
    description: "Unauthenticated visitor; can register and browse catalog."
    identity: opaque
    exclusive_operations:
      - "POST /customers/register"
    shared_operations:
      - "GET /plants/{id}, /workshops/{id}"

  - name: Customer
    description: "Registered shopper; can place orders, subscribe, submit warranty claims, register for workshops, request special orders."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders (self)"
      - "POST /orders/{id}/cancel (own)"
      - "POST /orders/{id}/pay (own)"
      - "POST /subscriptions (self)"
      - "POST /subscriptions/{id}/pause /resume /cancel (own)"
      - "POST /workshops/{id}/register (self)"
      - "POST /warranty-claims (self)"
      - "POST /special-orders (self)"
      - "POST /special-orders/{id}/customer-approve (own)"
    shared_operations:
      - "GET reads of own resources; GET /plants, /workshops/{id}"

  - name: ShopStaff
    description: "In-store operator; picks/packs orders, intakes stock, can place orders on behalf of walk-in customers."
    identity: opaque
    exclusive_operations:
      - "POST /plants/{id}/stock-units"
      - "POST /orders/{id}/dispatch  (shared with Manager)"
    shared_operations:
      - "POST /orders (as ShopStaff on behalf of a Customer)"
      - "POST /orders/{id}/pay"
      - "POST /special-orders"
      - "GET reads across the shop's data"

  - name: Horticulturist
    description: "Care-log author and warranty adjudicator."
    identity: opaque
    exclusive_operations:
      - "POST /stock-units/{id}/care-log"
      - "POST /warranty-claims/{id}/approve  (shared with Manager)"
      - "POST /warranty-claims/{id}/deny  (shared with Manager)"
    shared_operations:
      - "GET stock/care-log/warranty reads"

  - name: DeliveryDriver
    description: "Assigned driver; can only mark deliveries DELIVERED on assignments where driver_id equals X-User-ID."
    identity: "entity_backed:DeliveryDriver"
    exclusive_operations:
      - "POST /deliveries/{id}/deliver (own)"
    shared_operations:
      - "GET /orders/{id}, /deliveries?driver_id"

  - name: Manager
    description: "Store manager with catalog/scheduling/pricing/clock authority. Hierarchical override for most business operations; cannot register as a customer or place customer-owned actions on behalf of customers except cancels."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_scheduler/fulfill-subscriptions"
      - "POST /plants"
      - "POST /stock-units/{id}/adjust"
      - "POST /delivery-drivers"
      - "POST /workshops"
      - "POST /workshops/{id}/complete"
      - "POST /special-orders/{id}/quote"
      - "POST /special-orders/{id}/re-quote"
    shared_operations:
      - "POST /orders/{id}/cancel (any); POST /orders/{id}/dispatch"
      - "POST /warranty-claims/{id}/approve /deny"
      - "POST /subscriptions/{id}/cancel"
      - "POST /plants/{id}/stock-units, POST /stock-units/{id}/care-log"
      - "GET reads across all resources"
