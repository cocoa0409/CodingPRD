  # =======================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cleaner_double_book_with_travel_buffer
        grounds:
          - validations[priority=12]
          - calculations.visit_window
          - entities.Booking.fields.scheduled_end
        distinguishing_aspect: |
          Resource Cleaner, buffer-extended interval semantics: a second booking whose
          start is only 20 minutes after the first STUDIO visit's end (< TRAVEL_BUFFER_MIN
          30) collides even though raw intervals do not overlap; rejected
          ERR_CLEANER_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Cleaner ${cl_id} ACTIVE with one SCHEDULED STUDIO booking 09:00-10:30 (90 min). A second booking at a different address pins the same cleaner starting 10:50 (20 min gap < 30 buffer)."
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "2026 Standard", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad1_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "2 B St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad2_id: $.data.id }
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad1_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z", cleaner_id: "${cl_id}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk1_id: $.data.id }
          trigger:
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad2_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T10:50:00Z", cleaner_id: "${cl_id}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the second booking trigger returns error_id == ERR_CLEANER_DOUBLE_BOOKED (first visit ends 10:30; 10:50 start is only 20 min later, inside the 30 min travel buffer)"

      - name: address_double_book_pure_half_open_no_buffer
        grounds:
          - validations[priority=13]
          - calculations.visit_window
          - entities.Booking.fields.address_id
        distinguishing_aspect: |
          Resource Address, pure half-open interval semantics (no buffer): two visits at
          the same address that share exactly the boundary instant (first ends 10:30,
          second starts 10:30) do NOT collide and both succeed, whereas a 10:29 start
          would overlap; distinct geometry from the buffered cleaner rule.
        test_recipe:
          setup:
            - "Two different ACTIVE cleaners serving 94110, and one address with a SCHEDULED STUDIO booking 09:00-10:30 assigned to cleaner1; a second booking at the SAME address starting exactly 10:30 assigned to cleaner2."
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
