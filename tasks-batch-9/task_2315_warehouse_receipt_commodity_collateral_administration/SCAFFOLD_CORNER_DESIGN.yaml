        distinguishing_aspect: "Identical readings (gross 1005, dockage 4.5, moisture 15.0 against max 14.0) net 949 bushels under COMMINGLED but 960 under IDENTITY_PRESERVED: the 11-bushel moisture shrink is the whole delta."
