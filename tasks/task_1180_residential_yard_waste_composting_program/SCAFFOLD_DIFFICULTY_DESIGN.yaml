# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1180: Residential Yard Waste & Composting Program
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# Shared fixture conventions: opt-in zone base 12000 / universal zone base
# 9000 (utility-billed) / flat credit 500 / max_strikes 3 / season
# 2026-05-01..2026-10-31 (183 days -> 27 season weeks). Route weekday MONDAY;
# 2026-05-04, 05-11, 05-18, 05-25, 06-01, 06-08, 06-15 are Mondays.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fee_optin_vs_universal_same_cart_config
        grounds:
          - calculations.subscription_seasonal_fee
          - entities.Subscription.fields.total_due_cents
          - entities.ServiceZone.fields.service_model
        distinguishing_aspect: |
          Identical cart configuration (one 64-gal cart) and identical signup
          timing produce total_due_cents 13500 + PENDING_PAYMENT in an OPT_IN
          zone but 1500 + ACTIVE in a UNIVERSAL zone — two valid fee variants
          on the Subscription domain diverge on both amount and lifecycle.
        test_recipe:
          setup:
            - "Clock at 2026-04-15 (OPEN_ENROLLMENT for both zones)"
            - "Zone O: OPT_IN, base 12000; Zone U: UNIVERSAL, base 9000, flat credit 500"
            - "Household A in zone O with 2026 subscription and one 64-gal cart"
            - "Household B in zone U with 2026 subscription and one 64-gal cart"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_b: $.data.id, hh_b_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_b}", season_year: 2026, expected_household_version: "${hh_b_v}" }, as: Resident, as_user_id: "${hh_b}", captures: { sub_b: $.data.id } }
            - { call: "POST /carts", payload: { household_id: "${hh_a}", subscription_id: "${sub_a}", size_gallons: "64" }, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /carts", payload: { household_id: "${hh_b}", subscription_id: "${sub_b}", size_gallons: "64" }, as: Resident, as_user_id: "${hh_b}" }
          trigger:
            - { call: "GET /subscriptions/${sub_a}", as: ProgramAdmin }
            - { call: "GET /subscriptions/${sub_b}", as: ProgramAdmin }
          assert:
            - "Subscription.${sub_a}.base_fee_cents == 12000"
            - "Subscription.${sub_a}.cart_fees_cents == 1500"
            - "Subscription.${sub_a}.total_due_cents == 13500"
            - "Subscription.${sub_a}.status == PENDING_PAYMENT"
            - "Subscription.${sub_b}.base_fee_cents == 0"
            - "Subscription.${sub_b}.cart_fees_cents == 1500"
            - "Subscription.${sub_b}.total_due_cents == 1500"
            - "Subscription.${sub_b}.status == ACTIVE"

      - name: missed_credit_prorated_vs_flat
        grounds:
          - calculations.missed_pickup_credit_amount
          - state_machines.PickupTicket.MISSED_REPORTED_to_MISSED
          - entities.ServiceCredit.fields.amount_cents
        distinguishing_aspect: |
          The same validated missed pickup yields a 444-cent prorated credit
          (floor(12000/27)) for the OPT_IN household but a 500-cent flat credit
          for the UNIVERSAL household — a second dual-variant calculation on a
          different entity domain (ServiceCredit ledger, not Subscription fee).
        test_recipe:
          setup:
            - "Clock 2026-04-15; zone O (OPT_IN, base 12000) and zone U (UNIVERSAL, flat credit 500)"
            - "Household A (zone O) with paid ACTIVE subscription; household B (zone U) auto-ACTIVE"
            - "Published MONDAY route in each zone; ticket for each household on 2026-05-04"
            - "Clock advanced to 2026-05-05; both tickets reported missed and validated by supervisor sup_1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_b: $.data.id, hh_b_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions/${sub_a}/pay", payload: { use_credit_balance: false }, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_b}", season_year: 2026, expected_household_version: "${hh_b_v}" }, as: Resident, as_user_id: "${hh_b}", captures: { sub_b: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_o: $.data.id } }
            - { call: "POST /routes/${route_o}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_u: $.data.id } }
            - { call: "POST /routes/${route_u}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_o}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_0", captures: { t_a: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_b}", route_id: "${route_u}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_0", captures: { t_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /pickup-tickets/${t_a}/report-missed", payload: {}, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /pickup-tickets/${t_b}/report-missed", payload: {}, as: Resident, as_user_id: "${hh_b}" }
            - { call: "POST /pickup-tickets/${t_a}/validate-missed", payload: { validated: true }, as: RouteSupervisor, as_user_id: "sup_1" }
            - { call: "POST /pickup-tickets/${t_b}/validate-missed", payload: { validated: true }, as: RouteSupervisor, as_user_id: "sup_1" }
            - { call: "GET /service-credits?subscription_id=${sub_a}&status=PENDING_APPROVAL", as: BillingClerk, as_user_id: "clerk_1", captures: { cred_a: "$.data[0].id" } }
            - { call: "GET /service-credits?subscription_id=${sub_b}&status=PENDING_APPROVAL", as: BillingClerk, as_user_id: "clerk_1", captures: { cred_b: "$.data[0].id" } }
          trigger:
            - { call: "POST /service-credits/${cred_a}/approve", payload: {}, as: BillingClerk, as_user_id: "clerk_1" }
            - { call: "POST /service-credits/${cred_b}/approve", payload: {}, as: BillingClerk, as_user_id: "clerk_1" }
          assert:
            - "ServiceCredit.${cred_a}.amount_cents == 444"
            - "ServiceCredit.${cred_b}.amount_cents == 500"
            - "ServiceCredit.${cred_a}.amount_cents != ServiceCredit.${cred_b}.amount_cents"
            - "Household.${hh_a}.credit_balance_cents == 444"
            - "Household.${hh_b}.credit_balance_cents == 500"

  - rule_id: combinatorial_formula
    instances:
      - name: fee_proration_tiered_carts_extra_fee
        grounds:
          - calculations.subscription_seasonal_fee
          - entities.Subscription.fields.base_fee_cents
          - entities.Subscription.fields.cart_fees_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: the fee combines a service-model branch, a
          mid-season proration branch (floor(12000 x 17/27) = 7555), tiered
          cart-size surcharges (1500 + 3000), and the extra-cart fee (2500 on
          the second cart) — four interacting inputs with non-linear tiers.
        test_recipe:
          setup:
            - "Clock 2026-07-01 (IN_SEASON; 122 days remain -> 17 full weeks of 27)"
            - "Zone O OPT_IN base 12000, season 2026-05-01..2026-10-31"
            - "Household with new subscription, then two carts: 64-gal and 96-gal"
          setup_api_calls:
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /carts", payload: { household_id: "${hh_a}", subscription_id: "${sub_a}", size_gallons: "64" }, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /carts", payload: { household_id: "${hh_a}", subscription_id: "${sub_a}", size_gallons: "96" }, as: Resident, as_user_id: "${hh_a}" }
          trigger:
            - { call: "GET /subscriptions/${sub_a}", as: ProgramAdmin }
          assert:
            - "Subscription.${sub_a}.base_fee_cents == 7555"
            - "Subscription.${sub_a}.cart_fees_cents == 7000"
            - "Subscription.${sub_a}.surcharge_cents == 0"
            - "Subscription.${sub_a}.total_due_cents == 14555"

      - name: entitlement_per_pickup_rounding_pinned
        grounds:
          - calculations.compost_entitlement
          - entities.Household.fields.compost_entitlement_gallons
          - state_machines.PickupTicket.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) combinatorial: rounding order is pinned per-pickup —
          round_half_up(133 x 0.025, 2) + round_half_up(67 x 0.025, 2) =
          3.33 + 1.68 = 5.01 gallons; the forbidden aggregate order would give
          round(200 x 0.025) = 5.00. Same weights, different result purely
          from rounding order.
        test_recipe:
          setup:
            - "Universal zone household with ACTIVE subscription and published MONDAY route"
            - "Two completed tickets: 133 lbs on 2026-05-04 and 67 lbs on 2026-05-11"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-11" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t2: $.data.id } }
          trigger:
            - { call: "POST /pickup-tickets/${t1}/complete", payload: { weight_lbs: 133 }, as: Driver, as_user_id: "drv_1" }
            - { call: "POST /pickup-tickets/${t2}/complete", payload: { weight_lbs: 67 }, as: Driver, as_user_id: "drv_1" }
            - { call: "GET /households/${hh_a}", as: ProgramAdmin }
          assert:
            - "Household.${hh_a}.compost_entitlement_gallons == 5.01"

  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_suspend_cure_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.SUSPENDED_to_ACTIVE
          - calculations.contamination_strike_assessment
        distinguishing_aspect: |
          Subscription cycles ACTIVE -> SUSPENDED -> ACTIVE via cure and can
          be suspended a second time in the same season (cyclic machine), with
          surcharge_cents accumulating 2000 per suspension.
        test_recipe:
          setup:
            - "Clock 2026-05-18; opt-in household with paid ACTIVE subscription (13500 paid, one 64-gal cart)"
            - "Published MONDAY route; tickets T1 05-04, T2 05-11, T3 05-18 each TAGGED_REJECTED -> SUSPENDED with surcharge 2000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /carts", payload: { household_id: "${hh_a}", subscription_id: "${sub_a}", size_gallons: "64" }, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /subscriptions/${sub_a}/pay", payload: { use_credit_balance: false }, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-11" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t2: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-18" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-18T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t1}", result: "TAGGED_REJECTED", violation_codes: ["PLASTIC_BAG"] }, as: FieldInspector, as_user_id: "insp_1" }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t2}", result: "TAGGED_REJECTED", violation_codes: ["FOOD_WASTE"] }, as: FieldInspector, as_user_id: "insp_1" }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t3}", result: "TAGGED_REJECTED", violation_codes: ["DIRT_ROCK"] }, as: FieldInspector, as_user_id: "insp_1" }
            - { call: "GET /subscriptions/${sub_a}", as: ProgramAdmin, captures: { st1: $.data.status, sur1: $.data.surcharge_cents } }
          trigger:
            - { call: "POST /subscriptions/${sub_a}/cure", payload: { payment_cents: 2000 }, as: Resident, as_user_id: "${hh_a}", captures: { st2: $.data.status } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-25" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t4: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-06-01" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t5: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-06-08" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t6: $.data.id } }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t4}", result: "TAGGED_REJECTED", violation_codes: ["PLASTIC_BAG"] }, as: FieldInspector, as_user_id: "insp_1" }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t5}", result: "TAGGED_REJECTED", violation_codes: ["FOOD_WASTE"] }, as: FieldInspector, as_user_id: "insp_1" }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t6}", result: "TAGGED_REJECTED", violation_codes: ["HAZARDOUS"] }, as: FieldInspector, as_user_id: "insp_1" }
          assert:
            - "pre-cure capture ${st1} == SUSPENDED"
            - "pre-cure capture ${sur1} == 2000"
            - "cure response ${st2} == ACTIVE"
            - "Subscription.${sub_a}.strikes_this_season == 3"
            - "Subscription.${sub_a}.status == SUSPENDED"
            - "Subscription.${sub_a}.surcharge_cents == 4000"
            - "Subscription.${sub_a}.paid_cents == 15500"

      - name: ticket_missed_report_invalidate_cycle
        grounds:
          - state_machines.PickupTicket.SCHEDULED_to_MISSED_REPORTED
          - state_machines.PickupTicket.MISSED_REPORTED_to_SCHEDULED
          - state_machines.PickupTicket.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          PickupTicket loops SCHEDULED -> MISSED_REPORTED -> SCHEDULED on
          invalidation (a cycle on a different entity than Subscription) and
          then still completes normally — a non-linear machine with a fork
          (validate true -> MISSED, validate false -> SCHEDULED).
        test_recipe:
          setup:
            - "Universal zone household with ACTIVE subscription, published MONDAY route, ticket on 2026-05-04"
            - "Clock 2026-05-05 (service_date due); resident reports missed"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /pickup-tickets/${t1}/report-missed", payload: {}, as: Resident, as_user_id: "${hh_a}" }
          trigger:
            - { call: "POST /pickup-tickets/${t1}/validate-missed", payload: { validated: false }, as: RouteSupervisor, as_user_id: "sup_1", captures: { st_after_inv: $.data.status } }
            - { call: "POST /pickup-tickets/${t1}/complete", payload: { weight_lbs: 100 }, as: Driver, as_user_id: "drv_1" }
          assert:
            - "invalidate response ${st_after_inv} == SCHEDULED"
            - "PickupTicket.${t1}.status == COMPLETED"
            - "PickupTicket.${t1}.weight_lbs == 100"
            - "PickupTicket.${t1}.missed_reported_by == null"
            - "Household.${hh_a}.compost_entitlement_gallons == 2.5"

  - rule_id: transitive_cascade
    instances:
      - name: contamination_suspension_skips_future_tickets_frees_route
        grounds:
          - state_machines.PickupTicket.SCHEDULED_to_REJECTED_CONTAMINATION
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.PickupTicket.SCHEDULED_to_SKIPPED
          - calculations.route_capacity_check
        distinguishing_aspect: |
          Depth-3 cascade from POST /contamination-inspections: inspection
          rejects the ticket (hop 1: strikes += 1) -> strike threshold suspends
          the subscription (hop 2) -> future SCHEDULED tickets become SKIPPED
          (hop 3) -> route per-date booked count decrements, freeing a slot
          that a different household's new ticket then occupies (observable
          hop-3 effect).
        test_recipe:
          setup:
            - "Clock 2026-05-18; opt-in zone; published MONDAY route with max_stops 2"
            - "H1 ACTIVE (paid) with tickets 05-04, 05-11, 05-18, 05-25; H2 ACTIVE (paid) with ticket 05-25 (route full that date: 2/2)"
            - "H1's 05-04 and 05-11 tickets already TAGGED_REJECTED (strikes 2)"
            - "H3 ACTIVE (paid), no tickets yet"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
