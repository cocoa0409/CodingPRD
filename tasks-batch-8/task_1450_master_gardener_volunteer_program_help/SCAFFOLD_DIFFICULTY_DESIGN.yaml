            - "DiagnosisReferral.${ref1}.status == ANSWERED with answered_at == due_at (equality is on time)"
            - "Specialist.${spec}.answered_count == 2"
            - "Specialist.${spec}.late_referral_count == 1   (only the +1s answer counts)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: entry_approve_blocked_by_cycle_posture
        grounds:
          - state_machines.CreditEntry.PENDING_to_APPROVED
          - state_machines.ProgramCycle.OPEN_to_RECERTIFICATION
          - validations[priority=7]
        distinguishing_aspect: |
          Pair (CreditEntry, ProgramCycle): approving a PENDING entry is legal
          only while its cycle is OPEN; once the cycle enters RECERTIFICATION
          the same transition fails with ERR_CYCLE_NOT_OPEN and the entry stays
          PENDING.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE; one PENDING SERVICE entry of 4.0"
            - "Clock 2026-11-02; cycle moved to RECERTIFICATION"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 4.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program-cycles/${cyc}/begin-recertification", as: ProgramCoordinator }
          trigger:
            - { call: "POST /credit-entries/${e1}/approve", as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
            - { call: "GET /credit-entries/${e1}", as: ProgramCoordinator, captures: { st: "$.data.status" } }
          assert:
            - "captured err == ERR_CYCLE_NOT_OPEN"
            - "captured st == PENDING   (failed cross-posture approve leaves the entry untouched)"

      - name: signup_requires_volunteer_active
        grounds:
          - state_machines.ShiftSignup.SIGNED_UP_to_COMPLETED
          - entities.ShiftSignup.fields.volunteer_id
          - validations[priority=8]
        distinguishing_aspect: |
          Pair (ShiftSignup, Volunteer) — different pair than CreditEntry x
          ProgramCycle: a TRAINEE volunteer (accepted but not yet trained) is
          rejected with ERR_VOLUNTEER_NOT_ACTIVE on signup even though the shift
          itself is perfectly bookable.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; application accepted -> volunteer TRAINEE (no training enrollment)"
            - "Shift 2026-08-20 09:00-12:00 capacity 2 OPEN"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-20T09:00:00Z", end_time: "2026-08-20T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}", captures: { err: "$.data.error_id" } }
            - { call: "GET /shifts/${sh}", as: ProgramCoordinator, captures: { filled: "$.data.filled_count" } }
          assert:
            - "captured err == ERR_VOLUNTEER_NOT_ACTIVE   (TRAINEE may not staff shifts)"
            - "captured filled == 0"

      - name: referral_requires_inquiry_triaged
        grounds:
          - state_machines.DiagnosisReferral.OPEN_to_IN_REVIEW
          - state_machines.Inquiry.LOGGED_to_TRIAGED
          - validations[priority=8]
        distinguishing_aspect: |
          Pair (DiagnosisReferral, Inquiry) — a third distinct pair: creating a
          referral against a LOGGED (never triaged) inquiry fails with
          ERR_INQUIRY_NOT_TRIAGED even though a matching under-capacity
          specialist exists.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE staffed on shift 2026-08-05 09:00-12:00; clock inside window"
            - "Specialist PEST available; inquiry logged but NOT triaged"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /specialists", payload: { name: "Dr. Pest", specialty: "PEST", max_concurrent_referrals: 3 }, as: ProgramCoordinator, captures: { spec: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-05T09:00:00Z", end_time: "2026-08-05T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh: "$.data.id" } }
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /shifts/${sh}/inquiries", payload: { volunteer_id: "${vol}", subject: "Aphids", contact_name: "R1", details: "on kale" }, as: Volunteer, as_user_id: "${vol}", captures: { inq: "$.data.id" } }
          trigger:
            - { call: "POST /inquiries/${inq}/referrals", payload: { specialist_id: "${spec}" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INQUIRY_NOT_TRIAGED"
            - "Inquiry.${inq}.status == LOGGED   (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (three different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_location_half_open_overlap
        grounds:
          - calculations.overlap_rules
          - entities.Shift.fields.location
        distinguishing_aspect: |
          Semantics A (half-open datetime intervals, zero buffer) on the
          LOCATION resource: a shift starting exactly at the occupant's end
          (12:00 == 12:00) is allowed, one minute of interior overlap is
          rejected, and a CANCELLED occupant stops blocking the location.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; existing shift E1 at Desk A 2026-08-10 09:00-12:00 OPEN"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-10T09:00:00Z", end_time: "2026-08-10T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { e1: "$.data.id" } }
          trigger:
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-10T12:00:00Z", end_time: "2026-08-10T15:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "OUTREACH", location: "Desk A", start_time: "2026-08-10T11:59:00Z", end_time: "2026-08-10T13:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { err_overlap: "$.data.error_id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "OUTREACH", location: "Annex", start_time: "2026-08-10T10:00:00Z", end_time: "2026-08-10T13:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { t3: "$.data.id" } }
            - { call: "POST /shifts/${e1}/cancel", as: ProgramCoordinator }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-10T10:00:00Z", end_time: "2026-08-10T11:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { t4: "$.data.id" } }
          assert:
            - "Shift.${t1}.status == OPEN   (back-to-back adjacency allowed under half-open semantics)"
            - "captured err_overlap == ERR_SHIFT_LOCATION_CONFLICT   (1-minute interior overlap rejected)"
            - "Shift.${t3}.status == OPEN   (different location, same window: no conflict)"
            - "Shift.${t4}.status == OPEN   (CANCELLED occupants no longer block the location)"

      - name: signup_travel_buffer_intervals
        grounds:
          - calculations.overlap_rules
          - entities.ShiftSignup.fields.volunteer_id
        distinguishing_aspect: |
          Semantics B (buffered adjacency) on the VOLUNTEER-SCHEDULE resource —
          different semantics and resource than the half-open location rule:
          same-location back-to-back (gap 0) passes, a 20-minute cross-location
          gap fails the 30-minute travel buffer, and a gap of exactly 30 minutes
          passes (>= semantics on the buffer).
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE"
            - "Shifts: A Desk A 09:00-12:00; D Desk A 12:00-13:00; B Annex 12:20-14:00; C Hall 13:30-15:00 (all 2026-08-10, capacity 2)"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-10T09:00:00Z", end_time: "2026-08-10T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { shA: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-10T12:00:00Z", end_time: "2026-08-10T13:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { shD: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "OUTREACH", location: "Annex", start_time: "2026-08-10T12:20:00Z", end_time: "2026-08-10T14:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { shB: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "OUTREACH", location: "Hall", start_time: "2026-08-10T13:30:00Z", end_time: "2026-08-10T15:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { shC: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${shA}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}", captures: { suA: "$.data.id" } }
            - { call: "POST /shifts/${shD}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}", captures: { suD: "$.data.id" } }
            - { call: "POST /shifts/${shB}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}", captures: { errB: "$.data.error_id" } }
            - { call: "POST /shifts/${shC}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}", captures: { suC: "$.data.id" } }
          assert:
            - "ShiftSignup.${suA}.status == SIGNED_UP"
            - "ShiftSignup.${suD}.status == SIGNED_UP   (same location, gap 0: allowed)"
            - "captured errB == ERR_SIGNUP_SCHEDULE_CONFLICT   (20 min cross-location gap < 30 min buffer)"
            - "ShiftSignup.${suC}.status == SIGNED_UP   (exactly 30 min gap from D: allowed, >= semantics)"
            - "Shift.${shB}.filled_count == 0"

      - name: garden_bed_closed_week_overlap
        grounds:
          - calculations.overlap_rules
          - calculations.consecutive_week_count
          - entities.RotationAssignment.fields.week_start
        distinguishing_aspect: |
          Semantics C (closed day-granularity week intervals) on the BED_CODE
          resource — a third semantics and resource: the same calendar week on
          the same bed is rejected, the immediately adjacent week is disjoint
          and allowed, and a volunteer's third CONSECUTIVE week on one bed is
          rejected by the separate rotation-fairness rule.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN (window 2026-01-01..2026-12-31 contains all September weeks)"
            - "Volunteers V1, V2 ACTIVE"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app1: "$.data.id" } }
            - { call: "POST /applications/${app1}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app1}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app1}", as: ProgramCoordinator, captures: { vol1: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol1}" }, as: ProgramCoordinator, captures: { enr1: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr1}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr1}/complete", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Bob Birch", email: "bob@example.org", county: "Cecil", prior_gardening_years: 3 }, as: ProgramCoordinator, captures: { app2: "$.data.id" } }
            - { call: "POST /applications/${app2}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app2}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app2}", as: ProgramCoordinator, captures: { vol2: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol2}" }, as: ProgramCoordinator, captures: { enr2: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr2}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr2}/complete", as: ProgramCoordinator }
          trigger:
            - { call: "POST /rotation-assignments", payload: { bed_code: "BED-1", volunteer_id: "${vol1}", week_start: "2026-09-07" }, as: ProgramCoordinator, captures: { r1: "$.data.id", we1: "$.data.week_end" } }
            - { call: "POST /rotation-assignments", payload: { bed_code: "BED-1", volunteer_id: "${vol2}", week_start: "2026-09-07" }, as: ProgramCoordinator, captures: { err_olap: "$.data.error_id" } }
            - { call: "POST /rotation-assignments", payload: { bed_code: "BED-1", volunteer_id: "${vol2}", week_start: "2026-09-14" }, as: ProgramCoordinator, captures: { r2: "$.data.id" } }
            - { call: "POST /rotation-assignments", payload: { bed_code: "BED-2", volunteer_id: "${vol1}", week_start: "2026-09-07" }, as: ProgramCoordinator }
            - { call: "POST /rotation-assignments", payload: { bed_code: "BED-2", volunteer_id: "${vol1}", week_start: "2026-09-14" }, as: ProgramCoordinator }
            - { call: "POST /rotation-assignments", payload: { bed_code: "BED-2", volunteer_id: "${vol1}", week_start: "2026-09-21" }, as: ProgramCoordinator, captures: { err_cons: "$.data.error_id" } }
          assert:
            - "captured we1 == 2026-09-13   (week_end = week_start + 6 days)"
            - "captured err_olap == ERR_BED_WEEK_CONFLICT   (identical closed week on the same bed)"
            - "RotationAssignment.${r2}.status == ASSIGNED   (adjacent week is disjoint and allowed)"
            - "RotationAssignment.${r1}.cycle_id == ${cyc}   (cycle derived by window containment)"
            - "captured err_cons == ERR_CONSECUTIVE_WEEK_LIMIT   (third consecutive week on BED-2 for V1)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: shift_seat_conservation_signup_cancel
        grounds:
          - entities.Shift.fields.filled_count
          - state_machines.Shift.OPEN_to_FULL
          - state_machines.Shift.FULL_to_OPEN
        distinguishing_aspect: |
          Conserved quantity SEAT ACCOUNTING: at every step,
          filled_count == count(SIGNED_UP signups) and
          filled_count + remaining_seats == capacity (2). The forward action
          (signup) and its compensating action (cancel) return the shift to the
          exact prior observable state (filled_count 1, status OPEN).
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteers V1, V2 ACTIVE; shift 2026-08-20 09:00-12:00 capacity 2"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app1: "$.data.id" } }
            - { call: "POST /applications/${app1}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app1}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app1}", as: ProgramCoordinator, captures: { vol1: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol1}" }, as: ProgramCoordinator, captures: { enr1: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr1}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr1}/complete", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Bob Birch", email: "bob@example.org", county: "Cecil", prior_gardening_years: 3 }, as: ProgramCoordinator, captures: { app2: "$.data.id" } }
            - { call: "POST /applications/${app2}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app2}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app2}", as: ProgramCoordinator, captures: { vol2: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol2}" }, as: ProgramCoordinator, captures: { enr2: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr2}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr2}/complete", as: ProgramCoordinator }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-20T09:00:00Z", end_time: "2026-08-20T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol1}" }, as: Volunteer, as_user_id: "${vol1}", captures: { su1: "$.data.id" } }
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol2}" }, as: Volunteer, as_user_id: "${vol2}", captures: { su2: "$.data.id" } }
            - { call: "GET /shifts/${sh}", as: ProgramCoordinator, captures: { st_full: "$.data.status", fc_full: "$.data.filled_count" } }
            - { call: "POST /shift-signups/${su1}/cancel", as: Volunteer, as_user_id: "${vol1}" }
            - { call: "GET /shifts/${sh}", as: ProgramCoordinator, captures: { st_back: "$.data.status", fc_back: "$.data.filled_count" } }
          assert:
            - "captured fc_full == 2 and st_full == FULL"
            - "captured fc_back == 1 and st_back == OPEN   (cancel exactly compensates the second signup)"
            - "ShiftSignup.${su1}.status == CANCELLED and ShiftSignup.${su2}.status == SIGNED_UP"
            - "Shift.${sh}.filled_count == count of SIGNED_UP signups (1) and <= capacity (2) at every step"

      - name: official_hours_conservation_approve_revoke
        grounds:
          - calculations.credit_totals
          - state_machines.CreditEntry.PENDING_to_APPROVED
          - state_machines.CreditEntry.APPROVED_to_VOIDED
          - entities.RecertificationRecord.fields.official_service_hours
        distinguishing_aspect: |
          Conserved quantity APPROVED HOUR LEDGER (different quantity than
          seats): approve adds exactly the entry's hours to
          official_service_hours and its compensating revoke subtracts exactly
          the same amount, returning the ledger to the pre-approve value 0.0
          with zero drift.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE with PENDING record; one PENDING SERVICE entry of 5.0"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "GET /recertification-records?volunteer_id=${vol}&cycle_id=${cyc}", as: ProgramCoordinator, captures: { rec: "$.data[0].id" } }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 5.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: "$.data.id" } }
          trigger:
            - { call: "POST /recertification-records/${rec}/evaluate", as: ProgramCoordinator, captures: { before: "$.data.official_service_hours" } }
            - { call: "POST /credit-entries/${e1}/approve", as: ProgramCoordinator }
            - { call: "POST /recertification-records/${rec}/evaluate", as: ProgramCoordinator, captures: { mid: "$.data.official_service_hours" } }
            - { call: "POST /credit-entries/${e1}/revoke", payload: { reason: "logged against wrong cycle" }, as: ProgramCoordinator }
            - { call: "POST /recertification-records/${rec}/evaluate", as: ProgramCoordinator, captures: { after: "$.data.official_service_hours" } }
          assert:
            - "captured before == 0.0"
            - "captured mid == 5.0"
            - "captured after == 0.0   (approve + revoke conserve the ledger exactly)"
            - "CreditEntry.${e1}.status == VOIDED"

      - name: specialist_open_count_conservation_assign_answer_return
        grounds:
          - entities.Specialist.fields.open_referral_count
          - state_machines.DiagnosisReferral.IN_REVIEW_to_ANSWERED
          - state_machines.DiagnosisReferral.IN_REVIEW_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity OPEN REFERRAL COUNT (a third quantity): assign
          increments open_referral_count by exactly 1 and answer/return
          decrement it by exactly 1, so after answer-then-return churn the
          global sum of open_referral_count equals the number of OPEN/IN_REVIEW
          referrals with zero drift.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE staffed on shift 2026-08-05 09:00-12:00; clock inside window"
            - "Specialists S1, S2 both PEST capacity 3; S1 created first"
            - "Two TRIAGED PEST inquiries"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /specialists", payload: { name: "Dr. Pest One", specialty: "PEST", max_concurrent_referrals: 3 }, as: ProgramCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /specialists", payload: { name: "Dr. Pest Two", specialty: "PEST", max_concurrent_referrals: 3 }, as: ProgramCoordinator, captures: { s2: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-05T09:00:00Z", end_time: "2026-08-05T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh: "$.data.id" } }
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /shifts/${sh}/inquiries", payload: { volunteer_id: "${vol}", subject: "Aphids", contact_name: "R1", details: "kale" }, as: Volunteer, as_user_id: "${vol}", captures: { inq1: "$.data.id" } }
            - { call: "POST /shifts/${sh}/inquiries", payload: { volunteer_id: "${vol}", subject: "Borer", contact_name: "R2", details: "squash" }, as: Volunteer, as_user_id: "${vol}", captures: { inq2: "$.data.id" } }
            - { call: "POST /inquiries/${inq1}/triage", payload: { category: "PEST" }, as: ProgramCoordinator }
            - { call: "POST /inquiries/${inq2}/triage", payload: { category: "PEST" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /inquiries/${inq1}/referrals", payload: {}, as: ProgramCoordinator, captures: { ref1: "$.data.id" } }
            - { call: "POST /diagnosis-referrals/${ref1}/start-review", as: Specialist, as_user_id: "${s1}" }
            - { call: "POST /diagnosis-referrals/${ref1}/answer", payload: { diagnosis_text: "blast with water" }, as: Specialist, as_user_id: "${s1}" }
            - { call: "POST /inquiries/${inq2}/referrals", payload: {}, as: ProgramCoordinator, captures: { ref2: "$.data.id", who2: "$.data.specialist_id" } }
            - { call: "POST /diagnosis-referrals/${ref2}/start-review", as: Specialist, as_user_id: "${s1}" }
            - { call: "POST /diagnosis-referrals/${ref2}/return", payload: { return_reason: "ambiguous photo" }, as: Specialist, as_user_id: "${s1}" }
            - { call: "POST /diagnosis-referrals/${ref2}/reassign", payload: {}, as: ProgramCoordinator, captures: { who2b: "$.data.specialist_id" } }
            - { call: "GET /specialists/${s1}", as: ProgramCoordinator, captures: { s1_open: "$.data.open_referral_count" } }
            - { call: "GET /specialists/${s2}", as: ProgramCoordinator, captures: { s2_open: "$.data.open_referral_count" } }
          assert:
            - "captured who2 == ${s1}   (after the answer both pools tie at 0 open; created_at ASC wins)"
            - "captured who2b == ${s2}   (reassign excludes the returning specialist)"
            - "captured s1_open == 0   (+1 assign, -1 answer, +1 assign, -1 return)"
            - "captured s2_open == 1   (+1 reassign)"
            - "Specialist.${s1}.answered_count == 1 and returned_count == 1"
            - "Global invariant: s1_open + s2_open == 1 == count of OPEN/IN_REVIEW referrals"
