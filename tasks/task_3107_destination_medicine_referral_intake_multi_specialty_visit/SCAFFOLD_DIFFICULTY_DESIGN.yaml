            - "Logical clock 2026-09-01. International patient (residence_country 'DE'), DESTINATION case with a 4-specialty care team; capacity 4 on a single imaging-capable service with 4 non-overlapping same-day slots; clearance CLEARED via the 30% tier deposit of 180000."
