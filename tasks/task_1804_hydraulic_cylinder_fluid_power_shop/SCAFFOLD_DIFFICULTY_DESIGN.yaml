            - "Shop defaults (emergency_cutoff 24, expedite_cutoff 48); kit; customer; two cylinders"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-A01", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl1_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-A02", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl2_id: "$.data.id" } }
          trigger:
            - call: "POST /fluid-power/work-orders"
              payload: { cylinder_id: "${cyl1_id}", tier: "EXPEDITE", promised_hours: 24, complaint: "burst hose" }
              as: ServiceAdvisor
              captures: { err: "$.data.error_id" }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl1_id}", tier: "EMERGENCY", promised_hours: 24, complaint: "burst hose" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id", wo_status: "$.data.status" } }
          assert:
            - "EXPEDITE with promised_hours == 24 rejected with ERR_PROMISE_INFEASIBLE (422)"
            - "EMERGENCY with promised_hours == 24 succeeds: WorkOrder.${wo_id}.status == INTAKE"
            - "boundary is inclusive: exactly 24 demands EMERGENCY, not merely < 24"

      - name: cleanliness_particle_boundary_2pow13
        grounds:
          - calculations.cleanliness_code_rollup
          - entities.WorkOrder.fields.cleanliness_passed
        distinguishing_aspect: |
          Metric particle-count: c14_count == 8192 (= 2^13) maps to code 13 and
          passes the <= 13 target, while 8193 maps to code 14 and fails — reached
          via POST /fluid-power/work-orders/{id}/cleanliness-checks, a different
          endpoint and metric than the turnaround boundary.
        test_recipe:
          setup:
            - "Approved WO in IN_REPAIR with reservation consumed"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-B01", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: true, rod_cut_length_mm: 500, tube_needed: false, honing_passes: 1, estimated_labor_hours: 2.5 }, as: Technician, as_user_id: "${tech1_id}" }
            - { call: "POST /fluid-power/inventory-items", payload: { material: "CHROME_ROD", diameter_mm: 45, length_mm: 1000, cost_per_mm_cents: 42 }, as: ShopAdmin }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id" } }
            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
            - { call: "POST /fluid-power/quotes/${quote_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-repair", payload: {}, as: Technician, as_user_id: "${tech1_id}" }
          trigger:
            - { call: "POST /fluid-power/work-orders/${wo_id}/cleanliness-checks", payload: { c4_count: 200000, c6_count: 60000, c14_count: 8192 }, as: Technician, as_user_id: "${tech1_id}", captures: { pass1: "$.data.cleanliness_passed", code14a: "$.data.latest_cleanliness_code14" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/cleanliness-checks", payload: { c4_count: 200000, c6_count: 60000, c14_count: 8193 }, as: Technician, as_user_id: "${tech1_id}", captures: { pass2: "$.data.cleanliness_passed", code14b: "$.data.latest_cleanliness_code14" } }
          assert:
            - "c14_count == 8192 -> latest_cleanliness_code14 == 13 and cleanliness_passed == true (${pass1})"
            - "c14_count == 8193 -> latest_cleanliness_code14 == 14 and cleanliness_passed == false (${pass2})"
            - "boundary is count <= 2^code, inclusive of the exact power of two"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: quote_send_requires_fresh_teardown_pin
        grounds:
          - state_machines.Quote.DRAFT_to_SENT
          - entities.Quote.fields.pinned_teardown_version
          - errors[ERR_TEARDOWN_STALE]
        distinguishing_aspect: |
          Entity pair Quote->TeardownReport: a quote pins the teardown report
          version at creation; after the report is revised (version 1 -> 2), the
          DRAFT quote's send is rejected with ERR_TEARDOWN_STALE even though the
          quote itself is in a valid from-state.
        test_recipe:
          setup:
            - "WO in QUOTE_DRAFT with teardown report v1 and a DRAFT quote pinned to v1; technician then revises findings (est hours 4.0) bumping the report to v2"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_id}", serial_number: "CYL-C01", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "EXPEDITE", promised_hours: 30, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/work-orders/${wo_id}/start-teardown", payload: { technician_id: "${tech1_id}" }, as: ServiceAdvisor }
            - { call: "POST /fluid-power/teardown-reports", payload: { work_order_id: "${wo_id}", rod_needed: true, rod_cut_length_mm: 500, tube_needed: false, honing_passes: 1, estimated_labor_hours: 2.5 }, as: Technician, as_user_id: "${tech1_id}", captures: { report_id: "$.data.id", report_v: "$.data.version" } }
            - { call: "POST /fluid-power/quotes", payload: { work_order_id: "${wo_id}" }, as: ServiceAdvisor, captures: { quote_id: "$.data.id", pin_v: "$.data.pinned_teardown_version" } }
            - { call: "PATCH /fluid-power/teardown-reports/${report_id}", payload: { expected_teardown_report_version: "${report_v}", estimated_labor_hours: 4.0 }, as: Technician, as_user_id: "${tech1_id}", captures: { report_v2: "$.data.version" } }
          trigger:
            - call: "POST /fluid-power/quotes/${quote_id}/send"
              payload: {}
              as: ServiceAdvisor
              captures: { err: "$.data.error_id" }
          assert:
            - "Quote.${quote_id}.pinned_teardown_version == 1 while TeardownReport.${report_id}.version == 2"
            - "send rejected with ERR_TEARDOWN_STALE (409)"
            - "Quote.${quote_id}.status remains DRAFT"

      - name: pressure_test_requires_work_order_assembled
        grounds:
          - state_machines.WorkOrder.ASSEMBLED_to_TEST_PENDING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair PressureTest->WorkOrder (different pair than the quote-pin
          instance): creating a pressure test is only legal while the work order
          is ASSEMBLED; attempting it while the work order is IN_REPAIR fails with
          ERR_INVALID_STATE and no test is created.
        test_recipe:
          setup:
            - "Approved WO in IN_REPAIR (repair under way, assembly not complete); bay exists"
          setup_api_calls:
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/shops", payload: { name: "FP Shop" }, as: ShopAdmin }
            - { call: "POST /fluid-power/seal-kits", payload: { kit_code: "SK-80-NBR", bore_min_mm: 60, bore_max_mm: 100, pressure_class_max: "CLASS_5000", fluid_compat: ["MINERAL_OIL", "WATER_GLYCOL"], price_cents: 18500, material: "NBR" }, as: ShopAdmin, captures: { kit_id: "$.data.id" } }
            - { call: "POST /fluid-power/customers", payload: { full_name: "Acme", email: "a@a.com", credit_limit_cents: 10000000 }, as: ServiceAdvisor, captures: { cust_id: "$.data.id" } }
