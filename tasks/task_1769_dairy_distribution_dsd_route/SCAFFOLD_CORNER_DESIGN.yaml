              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-EB", name: "Route EB", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-EB", name: "Store EB", credit_limit_cents: 100000000 }
