      - name: version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.SignUpPeriod]
        distinguishing_aspect: "Every successful mutating endpoint on SignUpPeriod increments version by exactly 1."
        test_recipe:
          setup: ["SignUpPeriod created at version 1"]
          setup_api_calls:
