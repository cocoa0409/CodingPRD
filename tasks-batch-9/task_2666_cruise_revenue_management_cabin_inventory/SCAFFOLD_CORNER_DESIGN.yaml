            - "Booking.${bk_b}.booking_status == CANCELLED with cancel_reason == INVENTORY_CLOSED, provisional_penalty_cents == 0 and cancellation_penalty_cents == 0"
            - "Booking.${bk_c}.booking_status == CANCELLED with cancel_reason == INVENTORY_CLOSED, provisional_penalty_cents == 0 and cancellation_penalty_cents == 0 - both waitlisted rows, not just the queue head"
            - "Booking.${bk_b}.payment_status == AWAITING_DEPOSIT and Booking.${bk_c}.payment_status == AWAITING_DEPOSIT (the payment dimension is untouched by a waitlisted cancel)"
