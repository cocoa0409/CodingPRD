      - name: mail_piece_progress_and_integrity_are_independent_dimensions
        claim_type: parallel
        grounds: [state_machines.MailPiece.piece_status, state_machines.MailPiece.integrity_status]
        excluded_because:
          difficulty_instance: mail_piece_progress_and_integrity_dimensions_advance_independently
          rationale: "That instance drives both dimensions of the same piece and asserts each combined state, which is exactly the parallel-shape claim."

      - name: abort_cascades_pieces_and_ledgers_back_one_step
        claim_type: cascade_down
        grounds: [state_machines.PrintRun.RUNNING_to_ABORTED, state_machines.MailPiece.PRINTED_to_COMPOSED]
        excluded_because:
          difficulty_instance: print_run_abort_unwinds_a_four_link_chain
          rationale: "The four-link abort cascade (run -> job -> pieces -> press ledger) is asserted link by link there."

      - name: last_manifested_batch_bubbles_the_job_to_manifested
        claim_type: bubble_up
        grounds: [state_machines.CompositionJob.VERIFIED_to_MANIFESTED]
        excluded_because:
          difficulty_instance: insert_stock_conserved_across_composition_reprint_and_manifest
          rationale: "That instance manifests the job's only batch and asserts the bubbled CompositionJob status MANIFESTED together with the insert consumption the bubble triggers."

      - name: unseal_reverses_every_seal_side_effect
        claim_type: compensation
        grounds: [state_machines.PresortBatch.SEALED_to_OPEN]
        excluded_because:
          difficulty_instance: postage_escrow_conserved_across_seal_and_unseal
          rationale: "Seal, unseal and re-seal are asserted there with literal escrow readings at every step plus the erasure of estimated_postage_cents and sealed_by_user_id."

      - name: scheduling_is_guarded_by_the_dr_site_state
        claim_type: guarded_transitions
        grounds: [state_machines.CompositionJob.PRESORTED_to_SCHEDULED, validations.priority_55]
        excluded_because:
          difficulty_instance: job_scheduling_depends_on_dr_site_readiness_state
          rationale: "The guarded PRESORTED -> SCHEDULED transition is tested from both the blocked and the permitted DrSite state there."

      - name: variance_hold_loops_the_file_back_to_received
        claim_type: cyclic
        grounds: [state_machines.DataFile.HELD_VARIANCE_to_RECEIVED]
        excluded_because:
          difficulty_instance: data_file_variance_hold_loops_back_to_received
          rationale: "The amend-control-totals loop back to RECEIVED, including the amendment_count increment and the second pass through the same two triggers, is asserted there."

