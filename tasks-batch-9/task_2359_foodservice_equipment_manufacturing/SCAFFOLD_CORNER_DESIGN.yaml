          setup:
            - "Full release chain at clock 2026-08-01T00:00:00Z as in program_posture_returns_to_on_track_when_its_only_at_risk_site_order_is_waived, but SiteOrder SITE-1 is committed for 2026-09-25 and carries TWO slots on LN-1: slot A 2026-09-07 -> 2026-09-08 (10 units) and slot B 2026-09-20 -> 2026-09-21 (10 units), which clear the 12-hour changeover pad."
            - "The clock is advanced to 2026-09-07T00:00:00Z and slot A is confirmed and started, so slot A is IN_BUILD, slot B is RESERVED, BuildLine.committed_units is 20 and the site order is IN_BUILD / COMMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
