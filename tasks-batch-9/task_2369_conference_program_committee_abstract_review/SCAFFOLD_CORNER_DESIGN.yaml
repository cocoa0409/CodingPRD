              captures: { ab_ok_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "One minute late", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology"] }
              as: Author
