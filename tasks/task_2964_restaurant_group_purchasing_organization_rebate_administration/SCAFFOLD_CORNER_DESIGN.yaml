              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /purchase-batches/${b1_id}/settle-recovery"
              payload: { outcome: "WRITTEN_OFF", recovered_cents: 100 }
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /purchase-batches/${b1_id}/settle-recovery"
              payload: { outcome: "RECOVERED", recovered_cents: 200 }
              as: GpoAdmin
          assert:
            - "call 1: 400 with error_id == ERR_INVALID_REQUEST — recovered_cents is required when outcome == RECOVERED"
            - "call 2: 400 with error_id == ERR_INVALID_REQUEST — recovered_cents must be OMITTED when outcome == WRITTEN_OFF, not merely ignored"
            - "after calls 1 and 2 the batch is untouched: audit_status == RECOVERY_REQUESTED, recovered_cents == 0, Distributor.${dist_id}.status == ACTIVE (a rejected WRITTEN_OFF must not suspend anybody) and Member.${m1_id}.recovery_credit_cents == 0"
            - "call 3: 200 with audit_status == RECOVERED and recovered_cents == 200"
            - "the allocation aggregates BY MEMBER before prorating: member_overbilled[${m1_id}] == 300 + 80 == 380 == the batch total, so floor(200*380/380) == 200 with no remainder cent and Member.${m1_id}.recovery_credit_cents == 200 — a per-LINE prorate would floor twice (157 + 42) and lose a cent"
            - "Distributor.${dist_id}.overbilled_recovered_cents == 200 and status stays ACTIVE"

      - name: revoking_a_letter_closes_the_data_feed_for_that_member
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /authorization-letters/{letter_id}/revoke"]
          - state_machines.AuthorizationLetter.ACTIVE_to_REVOKED
          - validations[priority=15]
        distinguishing_aspect: |
          Revoke is member-initiated and decrements BOTH counters, but it does not
          un-enroll the member: enrollment_status stays ACTIVE with payout_hold
          false. The observable consequence is downstream — the very next
          purchase-line ingest for that member on that distributor's batch is
          refused with ERR_LOA_NOT_ACTIVE, while a line for a DIFFERENT member who
          still holds a letter is accepted in the same batch.
        test_recipe:
          setup:
            - "Harbor Grill and Pier 9 are both ACTIVE members, each with an ACTIVE letter for METRO-01, so Distributor.active_letter_count == 2."
            - "A June batch for METRO-01 exists and is still RECEIVED."
