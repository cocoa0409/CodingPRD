        distinguishing_aspect: "FROZEN (program SUSPENDED) blocks even cash-restoring writes: a CONTRIBUTION ledger append during suspension is rejected with ERR_POSTURE_GATED."
        test_recipe:
          setup: ["Program open with cash 5,000,000; program suspended"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ops V1", staff_role: "OPS_ANALYST", email: "opsv1@x.com" }
              as: CIO
              captures: { ops: $.data.id }
