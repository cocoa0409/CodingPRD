  - method: POST
    path: /api/v1/allocation-entries/{id}/mark-shortfall
    description: "Mark an allocation entry as shortfall (cannot be fully fulfilled)"
    roles: [SUPPLY_CHAIN_PLANNER]
    code: 200
    input: [shortfall_reason]
    output: AllocationEntry
    side_effects: ["transitions entry to SHORTFALL"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or contains unrecognized role"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role is recognized but not authorized for the requested endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path parameter or FK in body) does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is in a state that does not allow the requested transition"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input fields missing, empty, or malformed"

  - id: ERR_INVALID_ENUM
    http: 422
    condition: "Enum field contains a value not in the declared enum set"

  - id: ERR_INVALID_RANGE
    http: 422
    condition: "Numeric field outside declared range (e.g., score > 100, batch_size_kg <= 0)"

  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Unique code field (profile_code, supplier_code, ingredient_code, formula_code) already exists"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The acting user is the same person who performed the prior step in a segregation-of-duties workflow"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC version mismatch: expected_<parent>_version does not match current version"

  - id: ERR_PROFILE_NOT_APPROVED
    http: 422
    condition: "Referenced NutrientProfile does not have status APPROVED"

  - id: ERR_NUTRIENT_RANGE_INVALID
    http: 422
    condition: "Nutrient spec has min > max, or target outside [min, max]"

  - id: ERR_PERCENTAGE_SUM_INVALID
    http: 422
    condition: "Formula ingredient percentages do not sum to 100.000 within tolerance"

  - id: ERR_SUPPLIER_NOT_QUALIFIED
    http: 422
    condition: "Supplier qualification_status is not QUALIFIED at time of lot consumption"

  - id: ERR_LOT_NOT_QC_PASSED
    http: 422
    condition: "Ingredient lot qc_status is not QC_PASSED"

  - id: ERR_LOT_EXPIRED
    http: 422
    condition: "Ingredient lot expiry_date is before or equal to current timestamp"

  - id: ERR_VALIDATION_REQUIRED
    http: 422
    condition: "Required process validation is missing, not PASSED, or expired"

  - id: ERR_FORMULA_NOT_ACTIVE
    http: 422
    condition: "Formula status is not ACTIVE; production batches cannot be created"

  - id: ERR_INSUFFICIENT_INGREDIENT_QUANTITY
    http: 422
    condition: "Total available quantity across eligible lots is insufficient for batch requirements"

  - id: ERR_AUDIT_TOO_OLD
    http: 422
    condition: "Audit date is more than 365 days in the past for qualification purposes"

  - id: ERR_BATCH_TESTS_FAILED
    http: 422
    condition: "Batch release blocked: at least one nutrient test failed or pathogen detected"

  - id: ERR_INCOMPLETE_TEST_RESULTS
    http: 422
    condition: "Test results do not cover all nutrients in the formula's NutrientProfile or required pathogen panel"

  - id: ERR_ACTIVE_BATCHES_EXIST
    http: 422
    condition: "Formula cannot be discontinued while production batches are in non-terminal states"

  - id: ERR_LABEL_NOT_APPROVED
    http: 422
    condition: "Formula has no APPROVED LabelSubmission; activation blocked"

  - id: ERR_ESCALATION_NOT_WARRANTED
    http: 422
    condition: "Complaint does not meet escalation criteria (not adverse event and severity not HIGH/CRITICAL)"

  - id: ERR_RECOVERY_THRESHOLD_NOT_MET
    http: 422
    condition: "Overall recovery percentage is below the threshold for the recall class"

  - id: ERR_FULFILLMENT_EXCEEDS_ALLOCATION
    http: 422
    condition: "Cumulative fulfilled_kg would exceed allocated_kg for this entry"

  - id: ERR_RECALL_SCOPE_EMPTY
    http: 422
    condition: "Recall campaign must have at least one RecallScope entry before notification"

  - id: ERR_ALLOCATION_PLAN_EMPTY
    http: 422
    condition: "Allocation plan must have at least one entry before activation"

