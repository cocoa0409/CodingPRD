  # =================================================================
  # Section: calculations
  # =================================================================
  - section: calculations
    instances:
      - name: availability_tier_worst_case_across_cases
        claim_type: correct_result
        grounds: [calculations.availability_tier_derivation]
        distinguishing_aspect: "With two open cases (one OUT designation, one MODIFIED), the athlete tier resolves to the worst (OUT); LONG_TERM forces OUT regardless of designation."
        test_recipe:
          setup: ["Team; athlete; case1 OPEN with OUT entry today; case2 OPEN with MODIFIED entry today; clock 2026-08-03"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case1: $.data.id }
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "TURF", mechanism: "NON_CONTACT" }
              as: MedicalStaff
              captures: { case2: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case1}", entry_date: "2026-08-03", designation: "OUT", symptom_free: false, functional_test_score: 30 }
              as: MedicalStaff
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case2}", entry_date: "2026-08-03", designation: "MODIFIED", symptom_free: true, functional_test_score: 70 }
              as: MedicalStaff
          trigger:
            - call: "GET /sports-med/athletes/${a_id}"
              payload: {}
              as: MedicalStaff
              captures: { tier: $.data.availability_tier }
          assert:
            - "Athlete.${a_id}.availability_tier == OUT (worst-case across the two open cases)"

      - name: acwr_null_below_min_sessions_gate
        claim_type: input_set_filtering
        grounds: [calculations.acute_chronic_workload_ratio, entities.Athlete.fields.acute_chronic_workload_ratio]
        distinguishing_aspect: "Fewer than ACWR_MIN_SESSIONS (8) qualifying sessions in the 28-day window yields a null ACWR and load_flag NONE; REHAB_SESSION type is excluded from the count."
        test_recipe:
          setup: ["Team (ROLLING); athlete; only 3 qualifying PRACTICE sessions + 2 REHAB_SESSION (excluded); clock 2026-07-28"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "FOOTBALL", season_start_date: "2026-07-01", season_end_date: "2027-02-01", acwr_variant: "ROLLING" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "QB", enrollment_date: "2026-07-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-28T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-07-26", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 5 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-07-27", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 5 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-07-28", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 5 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-07-27", session_type: "REHAB_SESSION", surface: "TRAINING_ROOM", duration_minutes: 60, rpe: 3 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-07-28", session_type: "REHAB_SESSION", surface: "TRAINING_ROOM", duration_minutes: 60, rpe: 3 }
              as: PerformanceStaff
          trigger:
            - call: "GET /sports-med/athletes/${a_id}"
              payload: {}
              as: PerformanceStaff
              captures: { ratio: $.data.acute_chronic_workload_ratio, flag: $.data.load_flag }
          assert:
            - "Athlete.${a_id}.acute_chronic_workload_ratio is null (only 3 qualifying sessions < 8; REHAB_SESSION excluded)"
            - "Athlete.${a_id}.load_flag == NONE"

      - name: session_load_and_exposure_derivation
        claim_type: constants_applied
        grounds: [entities.WorkloadSession.fields.session_load, entities.WorkloadSession.fields.counts_as_exposure]
        distinguishing_aspect: "session_load = duration_minutes * rpe; counts_as_exposure true only for PRACTICE/GAME/CONDITIONING with duration >= EXPOSURE_MIN_MINUTES (10); a 5-minute PRACTICE and a 60-minute REHAB_SESSION both fail the exposure test for different reasons."
        test_recipe:
          setup: ["Team; athlete; clock set"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "FOOTBALL", season_start_date: "2026-07-01", season_end_date: "2027-02-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "QB", enrollment_date: "2026-07-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-28T00:00:00Z" }
              as: TeamAdmin
          trigger:
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-07-28", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 90, rpe: 7 }
              as: PerformanceStaff
              captures: { s_load: $.data.session_load, s_exp: $.data.counts_as_exposure }
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-07-28", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 5, rpe: 9 }
              as: PerformanceStaff
              captures: { s2_exp: $.data.counts_as_exposure }
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_id}", session_date: "2026-07-28", session_type: "REHAB_SESSION", surface: "TRAINING_ROOM", duration_minutes: 60, rpe: 5 }
              as: PerformanceStaff
              captures: { s3_exp: $.data.counts_as_exposure }
          assert:
            - "s_load == 630 (90 * 7) and s_exp == true"
            - "s2_exp == false (duration 5 < EXPOSURE_MIN_MINUTES 10 despite PRACTICE type)"
            - "s3_exp == false (REHAB_SESSION type excluded despite duration 60)"

  # =================================================================
  # Section: validations
  # =================================================================
  - section: validations
    instances:
      - name: future_entry_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors.ERR_FUTURE_DATE_NOT_ALLOWED"]
        distinguishing_aspect: "DailyStatusEntry with entry_date later than current_utc date -> ERR_FUTURE_DATE_NOT_ALLOWED (422)."
        test_recipe:
          setup: ["Team; athlete; OPEN case; clock 2026-08-01"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-05", designation: "OUT", symptom_free: false, functional_test_score: 40 }
              as: MedicalStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_FUTURE_DATE_NOT_ALLOWED (entry_date 2026-08-05 > current_utc 2026-08-01)"

      - name: duplicate_policy_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors.ERR_DUPLICATE_POLICY_NUMBER"]
        distinguishing_aspect: "A second policy reusing an existing (athlete_id, policy_number) on a non-CANCELLED policy -> ERR_DUPLICATE_POLICY_NUMBER (409)."
        test_recipe:
          setup: ["Team; athlete; one ACTIVE policy PN-1"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/insurance-policies"
              payload: { athlete_id: "${a_id}", payer_name: "Payer", policy_number: "PN-1", deductible_cents: 0, coinsurance_pct: 80, oop_max_cents: 100000, policy_year_start: "2026-01-01", policy_year_end: "2026-12-31" }
              as: BillingStaff
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /sports-med/insurance-policies"
              payload: { athlete_id: "${a_id}", payer_name: "Payer2", policy_number: "PN-1", deductible_cents: 0, coinsurance_pct: 70, oop_max_cents: 50000, policy_year_start: "2026-01-01", policy_year_end: "2026-12-31" }
              as: BillingStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_DUPLICATE_POLICY_NUMBER"

      - name: max_appeals_enforced
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors.ERR_MAX_APPEALS_REACHED"]
        distinguishing_aspect: "After 3 appeals (appeals_count == MAX_APPEALS), a 4th appeal -> ERR_MAX_APPEALS_REACHED (409)."
        test_recipe:
          setup: ["Team; athlete; OPEN case; ACTIVE policy; claim cycled DENIED->APPEALED 3 times (appeals_count == 3, currently DENIED after 3rd re-adjudication with deny)"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "BASEBALL", season_start_date: "2026-08-01", season_end_date: "2026-11-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "P", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "M75.1", body_region: "SHOULDER", severity_class: "MODERATE", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "GRASS", mechanism: "OVERUSE" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/insurance-policies"
              payload: { athlete_id: "${a_id}", payer_name: "Payer", policy_number: "PN-A", deductible_cents: 0, coinsurance_pct: 80, oop_max_cents: 1000000, policy_year_start: "2026-01-01", policy_year_end: "2026-12-31" }
              as: BillingStaff
              captures: { pol_id: $.data.id, pol_v0: $.data.version }
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 10000, line_items: [ { cpt_code: "S1", charge_cents: 10000, service_date: "2026-08-02" } ] }
              as: BillingStaff
              captures: { claim_id: $.data.id }
            - call: "POST /sports-med/claims/${claim_id}/submit"
              payload: { expected_policy_version: "${pol_v0}" }
              as: BillingStaff
            # deny #1, appeal #1, deny #2, appeal #2, deny #3, appeal #3 -> appeals_count 3
            - call: "POST /sports-med/claims/${claim_id}/adjudicate"
              payload: { deny: true, denial_reason: "d1" }
              as: BillingStaff
            - call: "POST /sports-med/claims/${claim_id}/appeal"
              payload: { appeal_reason: "a1" }
              as: BillingStaff
            - call: "POST /sports-med/claims/${claim_id}/adjudicate"
              payload: { deny: true, denial_reason: "d2" }
              as: BillingStaff
            - call: "POST /sports-med/claims/${claim_id}/appeal"
              payload: { appeal_reason: "a2" }
              as: BillingStaff
            - call: "POST /sports-med/claims/${claim_id}/adjudicate"
              payload: { deny: true, denial_reason: "d3" }
              as: BillingStaff
            - call: "POST /sports-med/claims/${claim_id}/appeal"
              payload: { appeal_reason: "a3" }
              as: BillingStaff
              captures: { appeals_now: $.data.appeals_count }
            # third re-adjudication denied again to return to DENIED
            - call: "POST /sports-med/claims/${claim_id}/adjudicate"
              payload: { deny: true, denial_reason: "d4" }
              as: BillingStaff
              captures: { st_denied3: $.data.status, appeals3: $.data.appeals_count }
          trigger:
            - call: "POST /sports-med/claims/${claim_id}/appeal"
              payload: { appeal_reason: "a4" }
              as: BillingStaff
              captures: { err: $.data.error_id }
          assert:
            - "appeals3 == 3 (MAX_APPEALS reached)"
            - "trigger returns error_id ERR_MAX_APPEALS_REACHED on the 4th appeal"

      - name: supersede_wrong_case_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors.ERR_INVALID_SUPERSEDE_TARGET"]
        distinguishing_aspect: "A DailyStatusEntry whose supersedes_entry_id points to an entry of a DIFFERENT injury case -> ERR_INVALID_SUPERSEDE_TARGET (422)."
        test_recipe:
          setup: ["Team; athlete; two OPEN cases; entry E1 on case1; clock 2026-08-03"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case1: $.data.id }
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "TURF", mechanism: "NON_CONTACT" }
              as: MedicalStaff
              captures: { case2: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case1}", entry_date: "2026-08-03", designation: "OUT", symptom_free: false, functional_test_score: 40 }
              as: MedicalStaff
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case2}", entry_date: "2026-08-03", designation: "LIMITED", symptom_free: true, functional_test_score: 60, supersedes_entry_id: "${e1}" }
              as: MedicalStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_INVALID_SUPERSEDE_TARGET (supersede target belongs to a different injury case)"

      - name: invalid_audience_rejected_on_report
        claim_type: violation_to_error
        grounds: ["validations[priority=10.5]", "errors.ERR_AUDIENCE_INVALID"]
        distinguishing_aspect: "POST /availability-reports with audience=PUBLIC (not in enum) -> ERR_AUDIENCE_INVALID (400), the audience-specific field validation distinct from generic ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Team exists"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sports-med/availability-reports"
              payload: { team_id: "${t_id}", audience: "PUBLIC" }
              as: MedicalStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_AUDIENCE_INVALID (400)"

  # =================================================================
  # Section: endpoints
  # =================================================================
  - section: endpoints
    instances:
      - name: list_injury_cases_filter_by_status
        claim_type: filtered_list
        grounds: ["endpoints[GET /sports-med/injury-cases]"]
        distinguishing_aspect: "GET /injury-cases?status=OPEN returns only OPEN cases; pagination envelope fields present."
        test_recipe:
