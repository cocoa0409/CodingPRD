            - "the second weld log on B, taken while A is EXAM_SCHEDULED, returns HTTP 409 ERR_WELD_SEQUENCE_VIOLATION again: scheduling a radiograph is not acceptance"
            - "after A becomes RT_ACCEPTED the identical weld log returns HTTP 200 with WeldSeam.${sb}.status == 'WELDED', welder_id == ${w1_id} and welded_at_utc stamped from the logical clock"
            - "B's own status was never touched by the two rejections: it was 'FIT_READY' with welder_id == null both times"
