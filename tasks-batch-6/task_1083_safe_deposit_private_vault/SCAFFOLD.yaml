# =============================================================================
# Scaffold: safe-deposit-private-vault benchmark seed tables
# Difficulty band: Expert
# =============================================================================

scenario: "Safe-Deposit & Private-Vault Service: box/size & rental, access & dual-control/log, billing & auto-pay, drilling/abandonment, insurance/inventory add-on, beneficiary/access-grant, precious-metal storage, compliance"

domain_name: safe-deposit-private-vault
api_prefix: /vault

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities linked by explicit FK fields; URL paths are /vault/<collection>/{id}
  state_machine_shape: cyclic      # Rental cures back and forth; AccessGrant suspend/resume loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Branch display name" }
      - { name: code, type: string, source: input, description: "Short branch code, unique across branches" }
      - { name: viewing_room_capacity, type: integer, source: input, description: "Number of private viewing rooms available for concurrent access appointments", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED (CLOSED blocks new boxes/appointments)" }

  - name: BoxType
    parent: null
    common_fields: true
    fields:
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE | JUMBO" }
      - { name: annual_rate_cents, type: integer, source: input, description: "Annual rental charge for this size, in cents", constraints: "> 0" }
      - { name: height_mm, type: integer, source: input, description: "Interior height" }
      - { name: width_mm, type: integer, source: input, description: "Interior width" }
      - { name: depth_mm, type: integer, source: input, description: "Interior depth" }

  - name: Box
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id" }
      - { name: box_type_id, type: string, source: input, description: "FK -> BoxType.id" }
      - { name: box_number, type: string, source: input, description: "Physical box label, unique within a branch" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | RESERVED | RENTED | DELINQUENT | DRILL_PENDING | DRILLED | OUT_OF_SERVICE" }

  - name: Renter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the primary renter" }
      - { name: email, type: string, source: input, description: "Contact email, unique across renters" }
      - { name: gov_id_ref, type: string, source: input, description: "Reference to a government id document on file" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date of birth" }
      - { name: kyc_status, type: enum, source: system, default: "PENDING", description: "PENDING | VERIFIED | REJECTED" }
      - { name: standing, type: enum, source: system, default: "GOOD", description: "GOOD | FROZEN (FROZEN set while an active compliance HOLD exists)" }
      - { name: is_deceased, type: boolean, source: system, default: false, description: "Set true when a beneficiary access grant is activated with a death certificate" }

  - name: Rental
    parent: null
    common_fields: true
    fields:
      - { name: box_id, type: string, source: input, description: "FK -> Box.id" }
      - { name: renter_id, type: string, source: input, description: "FK -> Renter.id" }
      - { name: plan_term_months, type: integer, source: input, default: 12, description: "Lease term length in months", constraints: ">= 1" }
      - { name: annual_rate_cents, type: integer, source: system, description: "Snapshot of BoxType.annual_rate_cents captured at rental creation" }
      - { name: autopay_enabled, type: boolean, source: input, default: false, description: "Whether invoices are auto-paid from autopay_source_ref" }
      - { name: autopay_source_ref, type: string, source: input, default: null, description: "Reference to a stored payment instrument for autopay" }
      - { name: insurance_rider_enabled, type: boolean, source: input, default: false, description: "Whether the blanket contents insurance rider is active" }
      - { name: declared_contents_value_cents, type: integer, source: input, default: 0, description: "Renter-declared blanket contents value for the insurance rider, in cents" }
      - { name: start_date, type: string, source: system, description: "ISO date the rental became ACTIVE (set from logical clock at activation)" }
      - { name: balance_due_cents, type: integer, source: computed, description: "sum(Invoice.total_cents where status IN {OPEN}) - sum(Payment.applied_cents where status == CLEARED)" }
      - { name: paid_through_date, type: string, source: computed, default: null, description: "Latest period_end fully covered by cleared payments" }
      - { name: delinquent_since, type: string, source: system, default: null, description: "ISO timestamp the rental first entered DELINQUENT" }
      - { name: surrender_requested_at, type: string, source: system, default: null, description: "ISO timestamp of surrender request" }
      - { name: provisional_refund_cents, type: integer, source: computed, default: null, description: "Provisional refund computed at surrender request (whole-month basis)" }
      - { name: final_refund_cents, type: integer, source: computed, default: null, description: "Final refund computed at close (exact-day basis)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | PAST_DUE | DELINQUENT | SURRENDER_PENDING | CLOSED | ABANDONED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: rental_id, type: string, source: input, description: "FK -> Rental.id" }
      - { name: period_start, type: string, source: input, description: "ISO date of billing period start" }
      - { name: period_end, type: string, source: input, description: "ISO date of billing period end" }
      - { name: base_rent_cents, type: integer, source: computed, description: "Prorated base rent for the period (whole cents)" }
      - { name: insurance_rider_cents, type: integer, source: computed, description: "Rider charge = round_half_up(declared_contents_value_cents * INSURANCE_RIDER_ANNUAL_RATE_BP / 10000)" }
      - { name: precious_metal_surcharge_cents, type: integer, source: computed, description: "Sum of per-item PRECIOUS_METAL surcharges (each rounded then summed)" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Late fee accrued for this invoice (see late_fee_escalation)" }
      - { name: total_cents, type: integer, source: computed, description: "base_rent_cents + insurance_rider_cents + precious_metal_surcharge_cents + late_fee_cents" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Cleared payment amount applied to this invoice" }
      - { name: due_date, type: string, source: computed, description: "issued_on + INVOICE_DUE_DAYS (30 days)" }
      - { name: issued_on, type: string, source: system, description: "ISO timestamp the invoice was issued (from logical clock)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | PAID | VOID | WRITTEN_OFF" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: rental_id, type: string, source: input, description: "FK -> Rental.id" }
      - { name: invoice_id, type: string, source: input, default: null, description: "FK -> Invoice.id; omit to auto-apply to oldest OPEN invoice" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: "> 0" }
      - { name: method, type: enum, source: input, description: "AUTOPAY | CARD | CASH | CHECK | WIRE" }
      - { name: applied_cents, type: integer, source: computed, default: 0, description: "Amount applied to invoices once CLEARED" }
      - { name: cleared_on, type: string, source: system, default: null, description: "ISO timestamp the payment cleared" }
      - { name: status, type: enum, source: system, default: "INITIATED", description: "INITIATED | CLEARED | FAILED | REVERSED" }

  - name: AccessGrant
    parent: null
    common_fields: true
    fields:
      - { name: rental_id, type: string, source: input, description: "FK -> Rental.id" }
      - { name: grantee_renter_id, type: string, source: input, default: null, description: "FK -> Renter.id; null when grantee is an external (non-registered) person" }
      - { name: grant_type, type: enum, source: input, description: "CO_RENTER | DEPUTY | BENEFICIARY" }
      - { name: grantee_name, type: string, source: input, description: "Grantee legal name" }
      - { name: grantee_gov_id_ref, type: string, source: input, default: null, description: "Reference to grantee government id document" }
      - { name: dual_control_required, type: boolean, source: input, default: true, description: "Whether this grantee's access requires a supervising officer (dual control)" }
      - { name: requires_death_certificate, type: boolean, source: computed, description: "true iff grant_type == BENEFICIARY" }
      - { name: death_certificate_ref, type: string, source: system, default: null, description: "Set at activation for BENEFICIARY grants" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | SUSPENDED | REVOKED | EXERCISED" }

  - name: AccessAppointment
    parent: null
    common_fields: true
    fields:
      - { name: box_id, type: string, source: input, description: "FK -> Box.id" }
      - { name: rental_id, type: string, source: input, description: "FK -> Rental.id" }
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id (denormalized from the box for room-capacity checks)" }
      - { name: grant_id, type: string, source: input, default: null, description: "FK -> AccessGrant.id; present when access is exercised via a grant rather than the primary renter" }
      - { name: scheduled_start, type: string, source: input, description: "ISO timestamp of appointment window start" }
      - { name: scheduled_end, type: string, source: input, description: "ISO timestamp of appointment window end (half-open [start, end))" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }

  - name: AccessEvent
    parent: null
    common_fields: false
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> AccessAppointment.id" }
      - { name: box_id, type: string, source: input, description: "FK -> Box.id" }
      - { name: rental_id, type: string, source: input, description: "FK -> Rental.id" }
      - { name: event_type, type: enum, source: input, description: "ENTRY | EXIT" }
      - { name: occurred_at, type: string, source: system, description: "ISO timestamp from the logical clock at logging time" }
      - { name: primary_accessor_ref, type: string, source: input, description: "Identity reference of the person physically accessing the box" }
      - { name: dual_control_officer_ref, type: string, source: input, description: "Identity reference of the supervising vault officer (must differ from primary_accessor_ref)" }
      - { name: witness_count, type: integer, source: input, description: "Number of controlling parties present at the access", constraints: ">= 1" }

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - { name: rental_id, type: string, source: input, description: "FK -> Rental.id" }
      - { name: description, type: string, source: input, description: "Item description" }
      - { name: category, type: enum, source: input, description: "PRECIOUS_METAL | JEWELRY | DOCUMENT | OTHER" }
      - { name: metal_type, type: enum, source: input, default: null, description: "GOLD | SILVER | PLATINUM | null (required when category == PRECIOUS_METAL)" }
      - { name: weight_grams, type: number, source: input, default: null, description: "Metal weight in grams (required when category == PRECIOUS_METAL)" }
      - { name: purity, type: number, source: input, default: null, description: "Fineness 0<purity<=1 (required when category == PRECIOUS_METAL)" }
      - { name: declared_value_cents, type: integer, source: input, description: "Renter-declared value in cents", constraints: "> 0" }
      - { name: appraised_value_cents, type: integer, source: system, default: null, description: "Appraised value set at appraisal" }
      - { name: status, type: enum, source: system, default: "DECLARED", description: "DECLARED | APPRAISED | INSURED | RELEASED" }

  - name: DrillingOrder
    parent: null
    common_fields: true
    fields:
      - { name: box_id, type: string, source: input, description: "FK -> Box.id" }
      - { name: rental_id, type: string, source: input, description: "FK -> Rental.id" }
      - { name: reason, type: enum, source: input, description: "ABANDONMENT | DELINQUENCY | LOST_KEY | COURT_ORDER" }
      - { name: requested_by_ref, type: string, source: system, description: "X-User-ID of the requester (for segregation of duties)" }
      - { name: approved_by_ref, type: string, source: system, default: null, description: "X-User-ID of the approver (must differ from requested_by_ref)" }
      - { name: scheduled_at, type: string, source: system, default: null, description: "ISO timestamp drilling is scheduled" }
      - { name: drilled_at, type: string, source: system, default: null, description: "ISO timestamp drilling completed" }
      - { name: drilling_fee_cents, type: integer, source: input, default: 15000, description: "Fee charged for the drilling operation" }
      - { name: proceeds_cents, type: integer, source: input, default: 0, description: "Gross proceeds realized at completion (e.g., contents sale), supplied at complete" }
      - { name: proceeds_to_arrears_cents, type: integer, source: computed, default: null, description: "Waterfall bucket 1 allocation" }
      - { name: proceeds_to_drilling_cents, type: integer, source: computed, default: null, description: "Waterfall bucket 2 allocation" }
      - { name: proceeds_to_admin_cents, type: integer, source: computed, default: null, description: "Waterfall bucket 3 allocation" }
      - { name: proceeds_to_escrow_cents, type: integer, source: computed, default: null, description: "Waterfall remainder held for renter/state" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | SCHEDULED | DRILLED | CANCELLED" }

  - name: ComplianceCase
    parent: null
    common_fields: true
    fields:
      - { name: renter_id, type: string, source: input, description: "FK -> Renter.id" }
      - { name: rental_id, type: string, source: input, default: null, description: "FK -> Rental.id (optional link to a specific rental)" }
      - { name: case_type, type: enum, source: input, description: "KYC | SANCTIONS | SAR | CTR" }
      - { name: severity, type: enum, source: input, default: "STANDARD", description: "STANDARD | HOLD (HOLD freezes the renter and blocks access)" }
      - { name: opened_on, type: string, source: system, description: "ISO timestamp opened" }
      - { name: resolved_on, type: string, source: system, default: null, description: "ISO timestamp resolved" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | ESCALATED | CLEARED | CLOSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Renter
    initial_state: PENDING
    terminal_states: [REJECTED]
    note: "kyc_status lifecycle; standing is a separate flag driven by ComplianceCase side effects, not a state here."
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /vault/renters/{id}/verify-kyc"
        actor: ComplianceOfficer
        preconditions: ["Renter.kyc_status == PENDING"]
        side_effects: ["kyc_status = VERIFIED"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /vault/renters/{id}/verify-kyc with decision=REJECT"
        actor: ComplianceOfficer
        preconditions: ["Renter.kyc_status == PENDING"]
        side_effects: ["kyc_status = REJECTED"]

  - entity: Rental
    initial_state: PENDING
    terminal_states: [CLOSED, ABANDONED]
    note: "Cyclic: PAST_DUE/DELINQUENT cure back to ACTIVE when balance clears."
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /vault/rentals/{id}/activate"
        actor: VaultAdmin | BillingClerk
        preconditions:
          - "Renter.kyc_status == VERIFIED (else ERR_KYC_NOT_VERIFIED)"
          - "Renter.standing == GOOD and no ComplianceCase with severity HOLD open for the renter (else ERR_COMPLIANCE_HOLD)"
          - "Box.status == AVAILABLE (else ERR_BOX_NOT_AVAILABLE)  [cross-entity: Rental depends on Box]"
        side_effects:
          - "status = ACTIVE"
          - "start_date = clock.now; annual_rate_cents snapshotted at creation"
          - "Box.status: AVAILABLE -> RENTED  [cascade hop]"
          - "Issue first Invoice for the term (base_rent + insurance_rider + precious_metal_surcharge); rental.balance_due_cents recomputed"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "system (POST /vault/_billing/run_cycle when now > oldest OPEN invoice.due_date)"
        actor: system
        preconditions: ["Some OPEN invoice with now > due_date and balance_due_cents > 0"]
        side_effects: ["status = PAST_DUE"]
      - from: PAST_DUE
        to: DELINQUENT
        trigger: "system (POST /vault/_billing/run_cycle when days_past_due >= DELINQUENCY_GRACE_DAYS)"
        actor: system
        preconditions: ["max days_past_due over OPEN invoices >= DELINQUENCY_GRACE_DAYS (15)"]
        side_effects:
          - "status = DELINQUENT; delinquent_since = clock.now"
          - "Box.status: RENTED -> DELINQUENT  [cascade hop]"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "system (payment clears, POST /vault/payments/{id}/clear)"
        actor: system
        preconditions: ["balance_due_cents == 0 after applying payment"]
        side_effects: ["status = ACTIVE"]
      - from: DELINQUENT
        to: ACTIVE
        trigger: "system (payment clears, POST /vault/payments/{id}/clear)  [cascade origin: depth-2]"
        actor: system
        preconditions: ["balance_due_cents == 0 after applying payment"]
        side_effects:
          - "status = ACTIVE; delinquent_since = null  [cascade hop 1]"
          - "Box.status: DELINQUENT -> RENTED  [cascade hop 2]"
      - from: ACTIVE
        to: SURRENDER_PENDING
        trigger: "POST /vault/rentals/{id}/request-surrender"
        actor: Renter | VaultAdmin
        preconditions: ["Rental.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects:
          - "surrender_requested_at = clock.now"
          - "provisional_refund_cents computed (whole-month basis, provisional variant)"
      - from: SURRENDER_PENDING
        to: CLOSED
        trigger: "POST /vault/rentals/{id}/close"
        actor: VaultAdmin
        preconditions:
          - "balance_due_cents == 0 (else ERR_OUTSTANDING_BALANCE)"
          - "No AccessAppointment in BOOKED or CHECKED_IN (else ERR_APPOINTMENT_ACTIVE)"
        side_effects:
          - "status = CLOSED; final_refund_cents computed (exact-day basis, final variant)"
          - "Box.status -> AVAILABLE  [cascade hop 1]"
          - "All ACTIVE/SUSPENDED AccessGrants on this rental -> REVOKED  [cascade hop 2]"
          - "All non-RELEASED InventoryItems on this rental -> RELEASED  [cascade hop 3]"
      - from: DELINQUENT
        to: ABANDONED
        trigger: "system (DrillingOrder complete cascade)  [cascade hop from Box -> DRILLED]"
        actor: system
        preconditions: ["Box.status == DRILLED"]
        side_effects:
          - "status = ABANDONED  [cascade hop 3]"
          - "All ACTIVE/SUSPENDED AccessGrants -> REVOKED  [cascade hop 4]"

  - entity: Box
    initial_state: AVAILABLE
    terminal_states: []
    note: "Box status is driven mostly by cross-entity cascades from Rental and DrillingOrder."
    transitions:
      - from: AVAILABLE
        to: RENTED
        trigger: "system (Rental activate cascade)"
        actor: system
        preconditions: ["Box.status == AVAILABLE"]
        side_effects: []
      - from: RENTED
        to: DELINQUENT
        trigger: "system (Rental -> DELINQUENT cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELINQUENT
        to: RENTED
        trigger: "system (Rental cure cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELINQUENT
        to: DRILL_PENDING
        trigger: "system (DrillingOrder schedule)"
        actor: system
        preconditions: ["A DrillingOrder for this box is SCHEDULED"]
        side_effects: []
      - from: DRILL_PENDING
        to: DRILLED
        trigger: "system (DrillingOrder complete cascade)  [cascade hop 1]"
        actor: system
        preconditions: []
        side_effects: ["Triggers Rental -> ABANDONED  [cascade hop 2]"]
      - from: DRILLED
        to: AVAILABLE
        trigger: "POST /vault/boxes/{id}/return-to-service"
        actor: VaultAdmin
        preconditions: ["Box.status == DRILLED", "No active Rental references this box"]
        side_effects: []
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /vault/boxes/{id}/decommission"
        actor: VaultAdmin
        preconditions: ["Box.status == AVAILABLE (else ERR_BOX_NOT_AVAILABLE)"]
        side_effects: []

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOID, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "system (payment clears fully covering the invoice)"
        actor: system
        preconditions: ["amount_paid_cents >= total_cents"]
        side_effects: ["status = PAID"]
      - from: OPEN
        to: VOID
        trigger: "POST /vault/invoices/{id}/void"
        actor: VaultAdmin
        preconditions: ["Invoice.status == OPEN", "amount_paid_cents == 0 (else ERR_INVOICE_HAS_PAYMENTS)"]
        side_effects: ["status = VOID; rental.balance_due_cents recomputed"]
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /vault/invoices/{id}/write-off"
        actor: VaultAdmin
        preconditions: ["Invoice.status == OPEN"]
        side_effects: ["status = WRITTEN_OFF; rental.balance_due_cents recomputed"]

  - entity: Payment
    initial_state: INITIATED
    terminal_states: [FAILED, REVERSED]
    note: "Branching with compensation: CLEARED -> REVERSED restores the ledger (compensating invariant)."
    transitions:
      - from: INITIATED
        to: CLEARED
        trigger: "POST /vault/payments/{id}/clear"
        actor: BillingClerk | VaultAdmin
        preconditions: ["Payment.status == INITIATED"]
        side_effects:
          - "applied_cents allocated to target/oldest OPEN invoice(s); invoice.amount_paid_cents increased"
          - "Fully-covered invoices -> PAID"
          - "rental.balance_due_cents decreased by applied_cents"
          - "If balance_due_cents == 0 and rental in PAST_DUE/DELINQUENT: rental cure cascade"
      - from: INITIATED
        to: FAILED
        trigger: "POST /vault/payments/{id}/fail"
        actor: BillingClerk | VaultAdmin
        preconditions: ["Payment.status == INITIATED"]
        side_effects: ["status = FAILED"]
      - from: CLEARED
        to: REVERSED
        trigger: "POST /vault/payments/{id}/reverse"
        actor: VaultAdmin
        preconditions: ["Payment.status == CLEARED"]
        side_effects:
          - "applied_cents removed from invoices; PAID invoices revert to OPEN"
          - "rental.balance_due_cents increased back by applied_cents (compensating invariant: net receivable restored)"

  - entity: AccessGrant
    initial_state: PENDING
    terminal_states: [REVOKED, EXERCISED]
    note: "Cyclic: SUSPENDED <-> ACTIVE."
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /vault/access-grants/{id}/activate"
        actor: ComplianceOfficer | VaultAdmin
        preconditions:
          - "Rental.status IN {ACTIVE, PAST_DUE, DELINQUENT} (else ERR_INVALID_STATE)"
          - "If grant_type == BENEFICIARY: death_certificate_ref provided (else ERR_DEATH_CERTIFICATE_REQUIRED)"
        side_effects:
          - "status = ACTIVE"
          - "If BENEFICIARY: set death_certificate_ref; Renter.is_deceased = true"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vault/access-grants/{id}/suspend"
        actor: VaultAdmin | ComplianceOfficer
        preconditions: ["AccessGrant.status == ACTIVE"]
        side_effects: ["status = SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vault/access-grants/{id}/resume"
        actor: VaultAdmin | ComplianceOfficer
        preconditions: ["AccessGrant.status == SUSPENDED"]
        side_effects: ["status = ACTIVE"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /vault/access-grants/{id}/revoke"
        actor: Renter | VaultAdmin
        preconditions: ["AccessGrant.status IN {ACTIVE, SUSPENDED, PENDING}"]
        side_effects: ["status = REVOKED"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /vault/access-grants/{id}/revoke"
        actor: Renter | VaultAdmin
        preconditions: []
        side_effects: ["status = REVOKED"]

  - entity: AccessAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    note: "Branching: BOOKED forks to CHECKED_IN (->COMPLETED), CANCELLED, or NO_SHOW with divergent side effects."
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /vault/access-appointments/{id}/check-in"
        actor: VaultOfficer
        preconditions:
          - "No ComplianceCase with severity HOLD open for the renter (else ERR_COMPLIANCE_HOLD)  [priority: safety before state]"
          - "Rental.status IN {ACTIVE, PAST_DUE} (else ERR_RENTAL_NOT_ACCESSIBLE)  [cross-entity: AccessAppointment depends on Rental]"
        side_effects: ["status = CHECKED_IN"]
        note: "The [scheduled_start, scheduled_end) window is enforced at booking (scheduled_start >= now); check-in itself is not clock-gated."
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /vault/access-appointments/{id}/complete"
        actor: VaultOfficer
        preconditions: ["AccessAppointment.status == CHECKED_IN"]
        side_effects: ["status = COMPLETED"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /vault/access-appointments/{id}/cancel"
        actor: Renter | VaultOfficer
        preconditions: ["AccessAppointment.status == BOOKED"]
        side_effects: ["status = CANCELLED (frees the box time window)"]
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /vault/access-appointments/{id}/no-show"
        actor: VaultOfficer
        preconditions: ["AccessAppointment.status == BOOKED", "clock.now >= scheduled_end"]
        side_effects: ["status = NO_SHOW"]

  - entity: InventoryItem
    initial_state: DECLARED
    terminal_states: [RELEASED]
    transitions:
      - from: DECLARED
        to: APPRAISED
        trigger: "POST /vault/inventory-items/{id}/appraise"
        actor: VaultOfficer | ComplianceOfficer
        preconditions: ["InventoryItem.status == DECLARED"]
        side_effects: ["appraised_value_cents set (appraised variant of valuation)"]
      - from: APPRAISED
        to: INSURED
        trigger: "POST /vault/inventory-items/{id}/insure"
        actor: BillingClerk | VaultAdmin
        preconditions: ["InventoryItem.status == APPRAISED"]
        side_effects: ["status = INSURED"]
      - from: DECLARED
        to: RELEASED
        trigger: "system (Rental close/abandon cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPRAISED
        to: RELEASED
        trigger: "system (Rental close/abandon cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INSURED
        to: RELEASED
        trigger: "system (Rental close/abandon cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DrillingOrder
    initial_state: REQUESTED
    terminal_states: [DRILLED, CANCELLED]
    note: "Branching fork-join with segregation of duties (approver != requester) and a completion cascade."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /vault/drilling-orders/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != requested_by_ref (else ERR_SEGREGATION_OF_DUTIES)"
          - "DrillingOrder.status == REQUESTED"
        side_effects: ["status = APPROVED; approved_by_ref = X-User-ID"]
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /vault/drilling-orders/{id}/schedule"
        actor: VaultAdmin
        preconditions: ["DrillingOrder.status == APPROVED"]
        side_effects: ["status = SCHEDULED; scheduled_at set; Box.status: DELINQUENT -> DRILL_PENDING"]
      - from: SCHEDULED
        to: DRILLED
        trigger: "POST /vault/drilling-orders/{id}/complete  [cascade origin: depth-4]"
        actor: VaultAdmin
        preconditions: ["DrillingOrder.status == SCHEDULED"]
        side_effects:
          - "status = DRILLED; drilled_at set  [cascade hop 1]"
          - "Proceeds waterfall computed (proceeds_to_arrears/drilling/admin/escrow)"
          - "Box.status: DRILL_PENDING -> DRILLED  [cascade hop 2]"
          - "Rental (DELINQUENT) -> ABANDONED  [cascade hop 3]"
          - "All ACTIVE/SUSPENDED AccessGrants -> REVOKED  [cascade hop 4]"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /vault/drilling-orders/{id}/cancel"
        actor: VaultAdmin | ComplianceOfficer
        preconditions: []
        side_effects: ["status = CANCELLED (no box/rental change)"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /vault/drilling-orders/{id}/cancel"
        actor: VaultAdmin | ComplianceOfficer
        preconditions: []
        side_effects: ["status = CANCELLED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vault/drilling-orders/{id}/cancel"
        actor: VaultAdmin | ComplianceOfficer
        preconditions: []
        side_effects: ["status = CANCELLED; Box.status: DRILL_PENDING -> DELINQUENT (restore)"]

  - entity: ComplianceCase
    initial_state: OPEN
    terminal_states: [CLEARED, CLOSED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /vault/compliance-cases/{id}/escalate"
        actor: ComplianceOfficer
        preconditions: ["ComplianceCase.status == OPEN"]
        side_effects: ["status = ESCALATED"]
      - from: OPEN
        to: CLEARED
        trigger: "POST /vault/compliance-cases/{id}/clear"
        actor: ComplianceOfficer
        preconditions: ["ComplianceCase.status IN {OPEN, ESCALATED}"]
        side_effects:
          - "status = CLEARED; resolved_on set"
          - "If no other HOLD ComplianceCase open for renter: Renter.standing = GOOD"
      - from: ESCALATED
        to: CLEARED
        trigger: "POST /vault/compliance-cases/{id}/clear"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "status = CLEARED; resolved_on set"
          - "If no other HOLD ComplianceCase open for renter: Renter.standing = GOOD"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: rental-plan-adjust-stale
    parent_entity: Rental
    write_endpoint: "POST /vault/rentals/{id}/adjust-plan"
    occ_field: "expected_rental_version"
    description: |
      Adjusting a rental's plan/autopay against a Rental whose version has
      advanced since the client last observed it is rejected. A prior
      adjustment (or a cascaded billing/cure mutation) already bumped the
      version, so the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_charge_rounding
    trigger: "Rental activate (first invoice) and POST /vault/invoices manual issue"
    algorithm: aggregation
    formula: |
      base_rent_cents = annual_rate_cents scaled to the period.
        For a full-term first invoice covering plan_term_months == 12: base_rent_cents = annual_rate_cents.
      insurance_rider_cents =
        round_half_up(rental.declared_contents_value_cents * INSURANCE_RIDER_ANNUAL_RATE_BP / 10000)
        if rental.insurance_rider_enabled else 0
      precious_metal_surcharge_cents =
        SUM over InventoryItem where category == PRECIOUS_METAL and status != RELEASED of
          round_half_up(item.declared_value_cents * PRECIOUS_METAL_SURCHARGE_ANNUAL_RATE_BP / 10000)
        # ROUNDING ORDER IS PINNED: round each component (rider, and each item surcharge) to whole
        # cents FIRST, then sum. Do NOT sum the raw products and round once.
      total_cents = base_rent_cents + insurance_rider_cents + precious_metal_surcharge_cents + late_fee_cents
    input_set: "Rider from rental.declared_contents_value_cents; surcharge from non-RELEASED PRECIOUS_METAL items on the rental."
    constants:
      INSURANCE_RIDER_ANNUAL_RATE_BP: 150            # 1.50% of declared contents value per year
      PRECIOUS_METAL_SURCHARGE_ANNUAL_RATE_BP: 50    # 0.50% of item declared value per year
    precision: "whole cents, round_half_up, per-component then sum"

  - name: late_fee_escalation
    trigger: "POST /vault/_billing/run_cycle over OPEN past-due invoices"
    algorithm: tiered_pricing
    formula: |
      days_past_due = floor(clock.now_date - invoice.due_date, in whole days)
      if days_past_due <= 0: rate = 0
      elif days_past_due <= 30: rate = LATE_TIER1_RATE       # 0.05
      elif days_past_due <= 60: rate = LATE_TIER2_RATE       # 0.10
      else:                     rate = LATE_TIER3_RATE       # 0.15
      size_multiplier = SIZE_MULTIPLIER[box_type.size_class]  # SMALL 1.00, MEDIUM 1.25, LARGE 1.50, JUMBO 2.00
      outstanding = invoice.total_cents - invoice.amount_paid_cents
      raw = outstanding * rate * size_multiplier
      late_fee_cents = 0 if rate == 0 else clamp(round_half_up(raw), MIN_LATE_FEE_CENTS, MAX_LATE_FEE_CENTS)
      # three inputs interact non-linearly: days_past_due tier, outstanding balance, size multiplier,
      # then a min/max clamp.
    input_set: "Per OPEN invoice whose due_date has passed."
    constants:
      INVOICE_DUE_DAYS: 30                                   # due_date = issued_on + 30 days
      LATE_TIER1_RATE: 0.05
      LATE_TIER2_RATE: 0.10
      LATE_TIER3_RATE: 0.15
      SIZE_MULTIPLIER: { SMALL: 1.00, MEDIUM: 1.25, LARGE: 1.50, JUMBO: 2.00 }
      MIN_LATE_FEE_CENTS: 2500
      MAX_LATE_FEE_CENTS: 25000
    precision: "whole cents, round_half_up before clamp"

  - name: surrender_refund
    trigger: "request-surrender (provisional) and close (final)"
    algorithm: forward_looking
    formula: |
      monthly_rate_cents = round_half_up(annual_rate_cents / 12)
      days_elapsed = floor(clock.now_date - start_date, whole days)
    input_set: "One Rental; unpaid late fees deducted from the final variant only."
    constants:
      DAYS_PER_MONTH_APPROX: 30
      DAYS_PER_YEAR: 365
    variants:
      - name: provisional
        when: "at surrender request (POST /vault/rentals/{id}/request-surrender)"
        difference: |
          months_elapsed_ceil = ceil(days_elapsed / DAYS_PER_MONTH_APPROX)
          provisional_refund_cents = max(0, (plan_term_months - months_elapsed_ceil)) * monthly_rate_cents
      - name: final
        when: "at close (POST /vault/rentals/{id}/close)"
        difference: |
          unused_days = max(0, DAYS_PER_YEAR - days_elapsed)   # full-term (12mo) rentals only
          gross = round_half_up(annual_rate_cents * unused_days / DAYS_PER_YEAR)
          final_refund_cents = max(0, gross - outstanding_late_fee_cents)

  - name: metal_valuation
    trigger: "declared_basis at declaration/surcharge; appraised_basis at appraise/insure"
    algorithm: weighted_scoring
    formula: |
      declared_basis_cents = item.declared_value_cents
      appraised_basis_cents = round_half_up(item.weight_grams * item.purity * spot_price_per_gram_cents)
    input_set: "One PRECIOUS_METAL InventoryItem; spot_price_per_gram_cents supplied at appraisal."
    variants:
      - name: declared_basis
        when: "storage surcharge (invoice_charge_rounding) and routine reporting"
        difference: "uses item.declared_value_cents verbatim"
      - name: appraised_basis
        when: "appraisal and insurance coverage cap (insure step)"
        difference: "uses weight * purity * spot; independent of declared value"
    precision: "whole cents, round_half_up"

  - name: proceeds_waterfall
    trigger: "POST /vault/drilling-orders/{id}/complete"
    algorithm: waterfall_allocation
    formula: |
      remaining = proceeds_cents
      arrears = rental.balance_due_cents (outstanding rent + accrued late fees at completion)
      proceeds_to_arrears_cents  = min(remaining, arrears);             remaining -= proceeds_to_arrears_cents
      proceeds_to_drilling_cents = min(remaining, drilling_fee_cents);  remaining -= proceeds_to_drilling_cents
      proceeds_to_admin_cents    = min(remaining, ADMIN_FEE_CENTS);     remaining -= proceeds_to_admin_cents
      proceeds_to_escrow_cents   = remaining
      # invariant: arrears+drilling+admin+escrow buckets sum to proceeds_cents exactly.
    input_set: "One DrillingOrder at completion; buckets filled in fixed priority order."
    constants:
      ADMIN_FEE_CENTS: 5000
    precision: "whole cents, no rounding (integer allocation)"

  - name: rental_balance_due
    trigger: "invoice issue, payment clear/reverse, invoice void/write-off"
    algorithm: aggregation
    formula: |
      balance_due_cents =
        SUM(Invoice.total_cents where Invoice.rental_id == rental.id AND status == OPEN)
        - SUM(Payment.applied_cents where Payment.rental_id == rental.id AND status == CLEARED)
      # OPEN invoices only; VOID/WRITTEN_OFF/PAID excluded from the first sum.
      # PAID invoices are fully offset so they net to zero and are excluded to avoid double counting.
    input_set: "OPEN invoices minus CLEARED payments' applied amounts for the rental."
    precision: "whole cents"

  - name: dual_control_check
    trigger: "POST /vault/access-events"
    algorithm: threshold
    formula: |
      valid = (dual_control_officer_ref != primary_accessor_ref)
              AND (witness_count >= REQUIRED_WITNESSES)
      if not valid: reject with ERR_DUAL_CONTROL_REQUIRED
      # boundary: witness_count == REQUIRED_WITNESSES (2) passes; witness_count == 1 fails.
    input_set: "One AccessEvent at logging time."
    constants:
      REQUIRED_WITNESSES: 2
    precision: "integer count"

  - name: branch_room_occupancy
    trigger: "POST /vault/access-appointments (booking) room-capacity check"
    algorithm: aggregation
    formula: |
      For a candidate window [scheduled_start, scheduled_end) at a branch, count existing
      appointments A with status IN {BOOKED, CHECKED_IN} at the same branch_id whose
      buffered window [A.scheduled_start - CLEANUP_BUFFER_MINUTES, A.scheduled_end + CLEANUP_BUFFER_MINUTES)
      intersects the candidate window. If (count + 1) > branch.viewing_room_capacity -> reject.
    input_set: "Appointments at the branch in BOOKED/CHECKED_IN; buffered aggregate-capacity semantics."
    constants:
      CLEANUP_BUFFER_MINUTES: 30
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint; segregation-of-duties (approver != requester) on drilling approve"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Referenced resources exist (path ids and body FKs), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric constraints (amount>0, purity in (0,1], required PRECIOUS_METAL fields)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all mutating endpoints

  - priority: 5
    category: business_safety
    check: "Compliance/KYC gates: renter under a HOLD ComplianceCase or FROZEN standing blocks activation and access; KYC must be VERIFIED to activate; dual-control officer must differ from primary accessor and witness_count must meet REQUIRED_WITNESSES"
    error_id: "ERR_COMPLIANCE_HOLD / ERR_KYC_NOT_VERIFIED / ERR_DUAL_CONTROL_REQUIRED"
    http_status: 409
    applies_to: "rental activate, appointment check-in, access-event logging"

  - priority: 6
    category: state
    check: "Target resource in a valid state for the transition (and cross-entity state, e.g. Box AVAILABLE to activate, Rental accessible to check in)"
    error_id: "ERR_INVALID_STATE / ERR_BOX_NOT_AVAILABLE / ERR_RENTAL_NOT_ACCESSIBLE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_temporal
    check: "Appointment window sane and future: scheduled_end > scheduled_start and scheduled_start >= clock.now"
    error_id: ERR_APPOINTMENT_IN_PAST
    http_status: 409
    applies_to: "appointment booking"

  - priority: 8
    category: business_constraint
    check: "Appointment must not overlap another BOOKED/CHECKED_IN appointment on the same box (half-open [start,end)); branch room capacity (buffered aggregate) not exceeded"
    error_id: "ERR_APPOINTMENT_OVERLAP / ERR_ROOM_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "appointment booking"

  - priority: 9
    category: business_referential
    check: "Grant/appointment FK consistency: grant_id (if given) must belong to the same rental; BENEFICIARY grants need a death certificate at activation"
    error_id: "ERR_GRANT_RENTAL_MISMATCH / ERR_DEATH_CERTIFICATE_REQUIRED"
    http_status: 409
    applies_to: "appointment booking, grant activate"

  - priority: 10
    category: business_fiscal
    check: "Ledger gates: cannot close a rental with balance_due_cents > 0; payment amount must be > 0; drilling only when eligible (DELINQUENT and past abandonment window for ABANDONMENT/DELINQUENCY reasons)"
    error_id: "ERR_OUTSTANDING_BALANCE / ERR_DRILL_NOT_ELIGIBLE"
    http_status: 409
    applies_to: "rental close, payment create, drilling request"

  - priority: 11
    category: business_constraint
    check: "Optimistic concurrency: expected_rental_version must equal current Rental.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "rental adjust-plan"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Branch ---
  - { method: POST, path: "/vault/branches", description: "Create a branch", roles: [VaultAdmin], code: 201, input: [name, code, viewing_room_capacity], output: Branch, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/vault/branches/{id}", description: "Get a branch", roles: [Any], code: 200, input: [], output: Branch, side_effects: [] }
  - { method: GET, path: "/vault/branches", description: "List branches", roles: [Any], code: 200, input: ["status?"], output: "Branch[]", side_effects: [] }

  # --- BoxType ---
  - { method: POST, path: "/vault/box-types", description: "Create a box size type", roles: [VaultAdmin], code: 201, input: [size_class, annual_rate_cents, height_mm, width_mm, depth_mm], output: BoxType, side_effects: [] }
  - { method: GET, path: "/vault/box-types/{id}", description: "Get a box type", roles: [Any], code: 200, input: [], output: BoxType, side_effects: [] }
  - { method: GET, path: "/vault/box-types", description: "List box types", roles: [Any], code: 200, input: ["size_class?"], output: "BoxType[]", side_effects: [] }

  # --- Box ---
  - { method: POST, path: "/vault/boxes", description: "Create a physical box", roles: [VaultAdmin], code: 201, input: [branch_id, box_type_id, box_number], output: Box, side_effects: ["status=AVAILABLE"] }
  - { method: GET, path: "/vault/boxes/{id}", description: "Get a box", roles: [Any], code: 200, input: [], output: Box, side_effects: [] }
  - { method: GET, path: "/vault/boxes", description: "List/filter boxes", roles: [Any], code: 200, input: ["branch_id?", "box_type_id?", "status?"], output: "Box[]", side_effects: [] }
  - { method: POST, path: "/vault/boxes/{id}/decommission", description: "Take an AVAILABLE box out of service", roles: [VaultAdmin], code: 200, input: [], output: Box, side_effects: ["status -> OUT_OF_SERVICE"] }
  - { method: POST, path: "/vault/boxes/{id}/return-to-service", description: "Return a DRILLED box to AVAILABLE", roles: [VaultAdmin], code: 200, input: [], output: Box, side_effects: ["status -> AVAILABLE"] }

  # --- Renter ---
  - { method: POST, path: "/vault/renters", description: "Register a renter", roles: [VaultAdmin, BillingClerk], code: 201, input: [full_name, email, gov_id_ref, date_of_birth], output: Renter, side_effects: ["kyc_status=PENDING, standing=GOOD"] }
  - { method: GET, path: "/vault/renters/{id}", description: "Get a renter", roles: [Any], code: 200, input: [], output: Renter, side_effects: [] }
  - { method: GET, path: "/vault/renters", description: "List/filter renters", roles: [Any], code: 200, input: ["kyc_status?", "standing?"], output: "Renter[]", side_effects: [] }
  - { method: POST, path: "/vault/renters/{id}/verify-kyc", description: "Record KYC decision", roles: [ComplianceOfficer], code: 200, input: ["decision?"], output: Renter, side_effects: ["kyc_status -> VERIFIED (or REJECTED)"] }

  # --- Rental ---
  - { method: POST, path: "/vault/rentals", description: "Create a rental (PENDING)", roles: [VaultAdmin, BillingClerk], code: 201, input: [box_id, renter_id, "plan_term_months?", "autopay_enabled?", "autopay_source_ref?", "insurance_rider_enabled?", "declared_contents_value_cents?"], output: Rental, side_effects: ["status=PENDING, annual_rate_cents snapshotted from box_type"] }
  - { method: GET, path: "/vault/rentals/{id}", description: "Get a rental", roles: [Any], code: 200, input: [], output: Rental, side_effects: [] }
  - { method: GET, path: "/vault/rentals", description: "List/filter rentals", roles: [Any], code: 200, input: ["box_id?", "renter_id?", "status?"], output: "Rental[]", side_effects: [] }
  - { method: POST, path: "/vault/rentals/{id}/activate", description: "Activate a rental", roles: [VaultAdmin, BillingClerk], code: 200, input: [], output: Rental, side_effects: ["status->ACTIVE", "Box->RENTED", "first Invoice issued", "balance_due recomputed"] }
  - { method: POST, path: "/vault/rentals/{id}/adjust-plan", description: "Adjust plan/autopay (OCC-guarded)", roles: [VaultAdmin], code: 200, input: ["plan_term_months?", "autopay_enabled?", "autopay_source_ref?", expected_rental_version], output: Rental, side_effects: ["fields updated", "increments Rental.version by 1"] }
  - { method: POST, path: "/vault/rentals/{id}/request-surrender", description: "Request surrender", roles: [Renter, VaultAdmin], code: 200, input: [], output: Rental, side_effects: ["status->SURRENDER_PENDING", "provisional_refund_cents computed"] }
  - { method: POST, path: "/vault/rentals/{id}/close", description: "Close a surrendered rental", roles: [VaultAdmin], code: 200, input: [], output: Rental, side_effects: ["status->CLOSED", "final_refund_cents computed", "Box->AVAILABLE cascade", "grants REVOKED", "inventory RELEASED"] }

  # --- Invoice ---
  - { method: POST, path: "/vault/invoices", description: "Manually issue an invoice for a rental period", roles: [BillingClerk, VaultAdmin], code: 201, input: [rental_id, period_start, period_end], output: Invoice, side_effects: ["status=OPEN", "charges computed (invoice_charge_rounding)", "balance_due recomputed"] }
  - { method: GET, path: "/vault/invoices/{id}", description: "Get an invoice", roles: [Any], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/vault/invoices", description: "List/filter invoices", roles: [Any], code: 200, input: ["rental_id?", "status?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/vault/invoices/{id}/void", description: "Void an unpaid invoice", roles: [VaultAdmin], code: 200, input: [], output: Invoice, side_effects: ["status->VOID", "balance_due recomputed"] }
  - { method: POST, path: "/vault/invoices/{id}/write-off", description: "Write off an invoice", roles: [VaultAdmin], code: 200, input: [], output: Invoice, side_effects: ["status->WRITTEN_OFF", "balance_due recomputed"] }

  # --- Payment ---
  - { method: POST, path: "/vault/payments", description: "Create a payment", roles: [BillingClerk, Renter], code: 201, input: [rental_id, "invoice_id?", amount_cents, method], output: Payment, side_effects: ["status=INITIATED"] }
  - { method: GET, path: "/vault/payments/{id}", description: "Get a payment", roles: [Any], code: 200, input: [], output: Payment, side_effects: [] }
  - { method: GET, path: "/vault/payments", description: "List/filter payments", roles: [Any], code: 200, input: ["rental_id?", "invoice_id?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/vault/payments/{id}/clear", description: "Clear a payment (apply to invoices)", roles: [BillingClerk, VaultAdmin], code: 200, input: [], output: Payment, side_effects: ["status->CLEARED", "applied to invoices", "invoices->PAID", "balance_due decreased", "rental cure cascade"] }
  - { method: POST, path: "/vault/payments/{id}/fail", description: "Mark a payment failed", roles: [BillingClerk, VaultAdmin], code: 200, input: [], output: Payment, side_effects: ["status->FAILED"] }
  - { method: POST, path: "/vault/payments/{id}/reverse", description: "Reverse a cleared payment", roles: [VaultAdmin], code: 200, input: [], output: Payment, side_effects: ["status->REVERSED", "applied removed", "PAID invoices->OPEN", "balance_due restored"] }

  # --- AccessGrant ---
  - { method: POST, path: "/vault/access-grants", description: "Create an access grant", roles: [Renter, VaultAdmin], code: 201, input: [rental_id, grant_type, grantee_name, "grantee_renter_id?", "grantee_gov_id_ref?", "dual_control_required?"], output: AccessGrant, side_effects: ["status=PENDING", "requires_death_certificate computed"] }
  - { method: GET, path: "/vault/access-grants/{id}", description: "Get an access grant", roles: [Any], code: 200, input: [], output: AccessGrant, side_effects: [] }
  - { method: GET, path: "/vault/access-grants", description: "List/filter access grants", roles: [Any], code: 200, input: ["rental_id?", "grantee_renter_id?", "status?"], output: "AccessGrant[]", side_effects: [] }
  - { method: POST, path: "/vault/access-grants/{id}/activate", description: "Activate a grant", roles: [ComplianceOfficer, VaultAdmin], code: 200, input: ["death_certificate_ref?"], output: AccessGrant, side_effects: ["status->ACTIVE", "BENEFICIARY: set death_certificate_ref, Renter.is_deceased=true"] }
  - { method: POST, path: "/vault/access-grants/{id}/suspend", description: "Suspend an active grant", roles: [VaultAdmin, ComplianceOfficer], code: 200, input: [], output: AccessGrant, side_effects: ["status->SUSPENDED"] }
  - { method: POST, path: "/vault/access-grants/{id}/resume", description: "Resume a suspended grant", roles: [VaultAdmin, ComplianceOfficer], code: 200, input: [], output: AccessGrant, side_effects: ["status->ACTIVE"] }
  - { method: POST, path: "/vault/access-grants/{id}/revoke", description: "Revoke a grant", roles: [Renter, VaultAdmin], code: 200, input: [], output: AccessGrant, side_effects: ["status->REVOKED"] }

  # --- AccessAppointment ---
  - { method: POST, path: "/vault/access-appointments", description: "Book a vault access appointment", roles: [Renter, VaultOfficer], code: 201, input: [box_id, rental_id, scheduled_start, scheduled_end, "grant_id?"], output: AccessAppointment, side_effects: ["status=BOOKED", "branch_id denormalized", "overlap + room-capacity + temporal checks"] }
  - { method: GET, path: "/vault/access-appointments/{id}", description: "Get an appointment", roles: [Any], code: 200, input: [], output: AccessAppointment, side_effects: [] }
  - { method: GET, path: "/vault/access-appointments", description: "List/filter appointments", roles: [Any], code: 200, input: ["box_id?", "rental_id?", "branch_id?", "grant_id?", "status?"], output: "AccessAppointment[]", side_effects: [] }
  - { method: POST, path: "/vault/access-appointments/{id}/check-in", description: "Check in an appointment", roles: [VaultOfficer], code: 200, input: [], output: AccessAppointment, side_effects: ["status->CHECKED_IN"] }
  - { method: POST, path: "/vault/access-appointments/{id}/complete", description: "Complete an appointment", roles: [VaultOfficer], code: 200, input: [], output: AccessAppointment, side_effects: ["status->COMPLETED"] }
  - { method: POST, path: "/vault/access-appointments/{id}/cancel", description: "Cancel a booked appointment", roles: [Renter, VaultOfficer], code: 200, input: [], output: AccessAppointment, side_effects: ["status->CANCELLED"] }
  - { method: POST, path: "/vault/access-appointments/{id}/no-show", description: "Mark a no-show", roles: [VaultOfficer], code: 200, input: [], output: AccessAppointment, side_effects: ["status->NO_SHOW"] }

  # --- AccessEvent ---
  - { method: POST, path: "/vault/access-events", description: "Log a dual-control access event", roles: [VaultOfficer], code: 201, input: [appointment_id, box_id, rental_id, event_type, primary_accessor_ref, dual_control_officer_ref, witness_count], output: AccessEvent, side_effects: ["append-only log; occurred_at from clock; dual-control checks"] }
  - { method: GET, path: "/vault/access-events/{id}", description: "Get an access event", roles: [Any], code: 200, input: [], output: AccessEvent, side_effects: [] }
  - { method: GET, path: "/vault/access-events", description: "List/filter access events", roles: [Any], code: 200, input: ["appointment_id?", "box_id?", "rental_id?"], output: "AccessEvent[]", side_effects: [] }

  # --- InventoryItem ---
  - { method: POST, path: "/vault/inventory-items", description: "Declare a stored inventory item", roles: [Renter, VaultOfficer], code: 201, input: [rental_id, description, category, declared_value_cents, "metal_type?", "weight_grams?", "purity?"], output: InventoryItem, side_effects: ["status=DECLARED"] }
  - { method: GET, path: "/vault/inventory-items/{id}", description: "Get an inventory item", roles: [Any], code: 200, input: [], output: InventoryItem, side_effects: [] }
  - { method: GET, path: "/vault/inventory-items", description: "List/filter inventory items", roles: [Any], code: 200, input: ["rental_id?", "status?"], output: "InventoryItem[]", side_effects: [] }
  - { method: POST, path: "/vault/inventory-items/{id}/appraise", description: "Appraise an item", roles: [VaultOfficer, ComplianceOfficer], code: 200, input: ["appraised_value_cents?", "spot_price_per_gram_cents?"], output: InventoryItem, side_effects: ["status->APPRAISED", "appraised_value_cents set (metal_valuation appraised_basis)"] }
  - { method: POST, path: "/vault/inventory-items/{id}/insure", description: "Mark an appraised item insured", roles: [BillingClerk, VaultAdmin], code: 200, input: [], output: InventoryItem, side_effects: ["status->INSURED"] }

  # --- DrillingOrder ---
  - { method: POST, path: "/vault/drilling-orders", description: "Request a drilling/abandonment order", roles: [VaultAdmin], code: 201, input: [box_id, rental_id, reason, "drilling_fee_cents?"], output: DrillingOrder, side_effects: ["status=REQUESTED", "requested_by_ref = X-User-ID"] }
  - { method: GET, path: "/vault/drilling-orders/{id}", description: "Get a drilling order", roles: [Any], code: 200, input: [], output: DrillingOrder, side_effects: [] }
  - { method: GET, path: "/vault/drilling-orders", description: "List/filter drilling orders", roles: [Any], code: 200, input: ["box_id?", "rental_id?", "status?"], output: "DrillingOrder[]", side_effects: [] }
  - { method: POST, path: "/vault/drilling-orders/{id}/approve", description: "Approve a drilling order (SoD)", roles: [ComplianceOfficer], code: 200, input: [], output: DrillingOrder, side_effects: ["status->APPROVED", "approved_by_ref set (must differ from requester)"] }
  - { method: POST, path: "/vault/drilling-orders/{id}/schedule", description: "Schedule drilling", roles: [VaultAdmin], code: 200, input: [scheduled_at], output: DrillingOrder, side_effects: ["status->SCHEDULED", "Box->DRILL_PENDING"] }
  - { method: POST, path: "/vault/drilling-orders/{id}/complete", description: "Complete drilling (cascade + waterfall)", roles: [VaultAdmin], code: 200, input: ["proceeds_cents?"], output: DrillingOrder, side_effects: ["status->DRILLED", "proceeds waterfall", "Box->DRILLED", "Rental->ABANDONED", "grants REVOKED"] }
  - { method: POST, path: "/vault/drilling-orders/{id}/cancel", description: "Cancel a drilling order", roles: [VaultAdmin, ComplianceOfficer], code: 200, input: [], output: DrillingOrder, side_effects: ["status->CANCELLED", "restore Box if was DRILL_PENDING"] }

  # --- ComplianceCase ---
  - { method: POST, path: "/vault/compliance-cases", description: "Open a compliance case", roles: [ComplianceOfficer], code: 201, input: [renter_id, case_type, "rental_id?", "severity?"], output: ComplianceCase, side_effects: ["status=OPEN", "if severity=HOLD: Renter.standing=FROZEN"] }
  - { method: GET, path: "/vault/compliance-cases/{id}", description: "Get a compliance case", roles: [Any], code: 200, input: [], output: ComplianceCase, side_effects: [] }
  - { method: GET, path: "/vault/compliance-cases", description: "List/filter compliance cases", roles: [Any], code: 200, input: ["renter_id?", "rental_id?", "status?"], output: "ComplianceCase[]", side_effects: [] }
  - { method: POST, path: "/vault/compliance-cases/{id}/escalate", description: "Escalate a compliance case", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceCase, side_effects: ["status->ESCALATED"] }
  - { method: POST, path: "/vault/compliance-cases/{id}/clear", description: "Clear a compliance case", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceCase, side_effects: ["status->CLEARED", "if no other HOLD open: Renter.standing=GOOD"] }

  # --- System / ops ---
  - { method: POST, path: "/vault/_clock/set_current_utc", description: "Set the server logical clock. Server startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time.", roles: [VaultAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock set to to_iso8601"] }
  - { method: POST, path: "/vault/_billing/run_cycle", description: "Run the billing cycle: accrue late fees on past-due OPEN invoices and escalate Rental/Box to PAST_DUE/DELINQUENT per the logical clock", roles: [VaultAdmin], code: 200, input: [], output: "{ issued_invoice_ids: array, escalated_rental_ids: array }", side_effects: ["late_fee_escalation applied", "Rental PAST_DUE/DELINQUENT transitions", "Box DELINQUENT cascade"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Drilling approver X-User-ID equals the requester (SoD violation)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing/invalid field, bad enum, amount<=0, purity out of (0,1], missing PRECIOUS_METAL fields" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_BOX_NOT_AVAILABLE, http: 409, condition: "Box is not AVAILABLE when required (activate / decommission)" }
  - { id: ERR_RENTAL_NOT_ACCESSIBLE, http: 409, condition: "Rental not in an accessible state (ACTIVE/PAST_DUE) for check-in" }
  - { id: ERR_KYC_NOT_VERIFIED, http: 409, condition: "Renter KYC not VERIFIED at rental activation" }
  - { id: ERR_COMPLIANCE_HOLD, http: 409, condition: "Renter has an open HOLD compliance case / FROZEN standing blocking the operation" }
  - { id: ERR_DUAL_CONTROL_REQUIRED, http: 409, condition: "Access event fails dual control: officer equals accessor or witness_count < REQUIRED_WITNESSES" }
  - { id: ERR_APPOINTMENT_IN_PAST, http: 409, condition: "Appointment window is not in the future or end<=start" }
  - { id: ERR_APPOINTMENT_OVERLAP, http: 409, condition: "Appointment overlaps another BOOKED/CHECKED_IN appointment on the same box" }
  - { id: ERR_ROOM_CAPACITY_EXCEEDED, http: 409, condition: "Concurrent buffered appointments at branch would exceed viewing_room_capacity" }
  - { id: ERR_APPOINTMENT_ACTIVE, http: 409, condition: "Cannot close a rental with an active (BOOKED/CHECKED_IN) appointment" }
  - { id: ERR_GRANT_RENTAL_MISMATCH, http: 409, condition: "grant_id does not belong to the appointment's rental" }
  - { id: ERR_DEATH_CERTIFICATE_REQUIRED, http: 409, condition: "BENEFICIARY grant activation without a death certificate" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 409, condition: "Cannot close a rental while balance_due_cents > 0" }
  - { id: ERR_DRILL_NOT_ELIGIBLE, http: 409, condition: "Drilling requested for ABANDONMENT/DELINQUENCY while box/rental not eligible (not DELINQUENT / abandonment window not reached)" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "Cannot void an invoice that has applied payments" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_rental_version does not match current Rental.version" }
  - { id: ERR_VALIDATION, http: 400, condition: "Query/pagination parameter out of range (limit/offset)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VaultAdmin
    description: "Operations superuser: branches, box types, boxes, rentals lifecycle, invoices, payments, drilling, clock, billing"
    identity: opaque
    exclusive_operations:
      - "POST /vault/branches"
      - "POST /vault/box-types"
      - "POST /vault/boxes"
      - "POST /vault/boxes/{id}/decommission"
      - "POST /vault/boxes/{id}/return-to-service"
      - "POST /vault/rentals/{id}/adjust-plan"
      - "POST /vault/rentals/{id}/close"
      - "POST /vault/invoices/{id}/void"
      - "POST /vault/invoices/{id}/write-off"
      - "POST /vault/payments/{id}/reverse"
      - "POST /vault/drilling-orders"
      - "POST /vault/drilling-orders/{id}/schedule"
      - "POST /vault/drilling-orders/{id}/complete"
      - "POST /vault/_clock/set_current_utc"
      - "POST /vault/_billing/run_cycle"
    shared_operations:
      - "POST /vault/renters (with BillingClerk)"
      - "POST /vault/rentals (with BillingClerk)"
      - "POST /vault/rentals/{id}/activate (with BillingClerk)"
      - "POST /vault/rentals/{id}/request-surrender (with Renter)"
      - "POST /vault/invoices (with BillingClerk)"
      - "POST /vault/payments/{id}/clear (with BillingClerk)"
      - "POST /vault/payments/{id}/fail (with BillingClerk)"
      - "POST /vault/access-grants (with Renter)"
      - "POST /vault/access-grants/{id}/activate (with ComplianceOfficer)"
      - "POST /vault/access-grants/{id}/suspend|resume (with ComplianceOfficer)"
      - "POST /vault/access-grants/{id}/revoke (with Renter)"
      - "POST /vault/inventory-items/{id}/insure (with BillingClerk)"
      - "POST /vault/drilling-orders/{id}/cancel (with ComplianceOfficer)"

  - name: BillingClerk
    description: "Billing operations: register renters, create/activate rentals, issue invoices, take and clear payments"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /vault/renters (with VaultAdmin)"
      - "POST /vault/rentals (with VaultAdmin)"
      - "POST /vault/rentals/{id}/activate (with VaultAdmin)"
      - "POST /vault/invoices (with VaultAdmin)"
      - "POST /vault/payments (with Renter)"
      - "POST /vault/payments/{id}/clear (with VaultAdmin)"
      - "POST /vault/payments/{id}/fail (with VaultAdmin)"
      - "POST /vault/inventory-items/{id}/insure (with VaultAdmin)"

  - name: VaultOfficer
    description: "Front-line vault floor: appointments, dual-control access logging, inventory intake and appraisal"
    identity: opaque
    exclusive_operations:
      - "POST /vault/access-appointments/{id}/check-in"
      - "POST /vault/access-appointments/{id}/complete"
      - "POST /vault/access-appointments/{id}/no-show"
      - "POST /vault/access-events"
    shared_operations:
      - "POST /vault/access-appointments (with Renter)"
      - "POST /vault/access-appointments/{id}/cancel (with Renter)"
      - "POST /vault/inventory-items (with Renter)"
      - "POST /vault/inventory-items/{id}/appraise (with ComplianceOfficer)"

  - name: ComplianceOfficer
    description: "Compliance: KYC decisions, compliance cases, grant activation, drilling approval (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /vault/renters/{id}/verify-kyc"
      - "POST /vault/compliance-cases"
      - "POST /vault/compliance-cases/{id}/escalate"
      - "POST /vault/compliance-cases/{id}/clear"
      - "POST /vault/drilling-orders/{id}/approve"
    shared_operations:
      - "POST /vault/access-grants/{id}/activate (with VaultAdmin)"
      - "POST /vault/access-grants/{id}/suspend|resume (with VaultAdmin)"
      - "POST /vault/inventory-items/{id}/appraise (with VaultOfficer)"
      - "POST /vault/drilling-orders/{id}/cancel (with VaultAdmin)"

  - name: Renter
    description: "Box renter acting on their own rentals: book/cancel appointments, pay, manage grants, declare inventory, request surrender"
    identity: "entity_backed:Renter"
    exclusive_operations: []
    shared_operations:
      - "POST /vault/rentals/{id}/request-surrender (with VaultAdmin)"
      - "POST /vault/payments (with BillingClerk)"
      - "POST /vault/access-grants (with VaultAdmin)"
      - "POST /vault/access-grants/{id}/revoke (with VaultAdmin)"
      - "POST /vault/access-appointments (with VaultOfficer)"
      - "POST /vault/access-appointments/{id}/cancel (with VaultOfficer)"
      - "POST /vault/inventory-items (with VaultOfficer)"

  - name: Any
    description: "Any authenticated role may perform read (GET) operations"
    identity: opaque
    shared_operations:
      - "GET /vault/** — all read endpoints"
