          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "a CERTIFIED tract and a PROSPECT MineralInterest with net_mineral_acres 40.0000"
            - "a Unit with unit_gross_acres 1280.0000 owned by op-user-001"
