          rationale: "The named §1.8 instance already proves the ordering of that cascade — the park hold, then the forced cancellations, then the probation floor derived from the resulting forced_cancellation_count, then the capital re-score that reads the floored compliance status — which is exactly the ordering-sensitivity claim for this layer."
