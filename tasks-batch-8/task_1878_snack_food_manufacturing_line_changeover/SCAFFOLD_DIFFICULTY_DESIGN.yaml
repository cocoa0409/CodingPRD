          (SCHEDULED/RUNNING/HELD/COMPLETED) moves under operator control while
          quality (PENDING/QHOLD/PASSED) only moves via compliance evaluation at
          completion and later disposition — a hold-release cycle leaves quality
          PENDING untouched, and a QHOLD disposition leaves execution COMPLETED
          untouched.
        test_recipe:
