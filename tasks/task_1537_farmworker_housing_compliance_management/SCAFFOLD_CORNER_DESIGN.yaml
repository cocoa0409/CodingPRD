  # ===========================================================================
  - section: endpoints
    instances:
      - name: availability_computed_read_fields
        claim_type: computed_read
        grounds: [entities.HousingUnit.fields.current_occupancy]
        distinguishing_aspect: "GET /housing-units/{id}/availability derives available_beds = max_occupancy - current_occupancy (4 - 2 = 2) plus exclusion and certification flags after an activation."
        test_recipe:
          setup: ["site OPEN; unit max_occupancy 4 CERTIFIED; household ELIGIBLE with 2 members; tenancy ACTIVE"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
