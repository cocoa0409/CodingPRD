scaffold_corner_design:
  # -----------------------------------------------------------------
  # Entities
  # -----------------------------------------------------------------
  - section: entities
    instances:
      - name: create_gardener_returns_all_default_fields
        claim_type: Creation
        grounds: [entities.Gardener.fields.standing, entities.Gardener.fields.tenure_seasons]
        distinguishing_aspect: "POST /gardeners returns 201 with server-defaulted standing GOOD, tenure_seasons 0, strike_count 0, balance_owed_cents 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /gardeners"
              payload: { full_name: "New Gardener", email: "new@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
          assert:
            - "response.http_status == 201"
            - "Gardener.${g_id}.standing == GOOD"
            - "Gardener.${g_id}.tenure_seasons == 0"
            - "Gardener.${g_id}.balance_owed_cents == 0"

      - name: gardener_missing_required_email_returns_validation
        claim_type: Required Fields
        grounds: [entities.Gardener.fields.email, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /gardeners without email is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /gardeners"
              payload: { full_name: "No Email" }
              as: GardenManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.http_status == 422"

      - name: gardener_duplicate_email_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.Gardener.fields.email, "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "A second gardener with an already-registered email is rejected with ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["one gardener already registered with email dup@example.com"]
          setup_api_calls:
            - call: "POST /gardeners"
              payload: { full_name: "First", email: "dup@example.com" }
              as: GardenManager
          trigger:
            - call: "POST /gardeners"
              payload: { full_name: "Second", email: "dup@example.com" }
              as: GardenManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: plot_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Plot, "errors[ERR_PLOT_NOT_FOUND]"]
        distinguishing_aspect: "GET /plots/{unknown-uuid} returns ERR_PLOT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /plots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GardenManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_PLOT_NOT_FOUND"
            - "response.http_status == 404"

      - name: garden_system_fields_generated_on_create
        claim_type: System Fields
        grounds: [entities.Garden.fields.total_plots, entities.Garden.fields.available_plot_count]
        distinguishing_aspect: "POST /gardens mints id and version=1, and initializes total_plots=0, available_plot_count=0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /gardens"
              payload: { name: "Fresh Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id", v: "$.data.version" }
          assert:
            - "Garden.${garden_id}.version == 1"
            - "Garden.${garden_id}.total_plots == 0"
            - "Garden.${garden_id}.available_plot_count == 0"

      - name: garden_total_plots_derived_after_plot_creates
        claim_type: Computed Fields
        grounds: [entities.Garden.fields.total_plots, entities.Plot.fields.garden_id]
        distinguishing_aspect: "Creating two plots drives Garden.total_plots to 2 and available_plot_count to 2 (both AVAILABLE)."
        test_recipe:
          setup: ["garden with two AVAILABLE plots"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "Count Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "P-1", size: "SMALL" }
              as: GardenManager
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "P-2", size: "LARGE" }
              as: GardenManager
          trigger:
            - call: "GET /gardens/${garden_id}"
              payload: {}
              as: GardenManager
          assert:
            - "Garden.${garden_id}.total_plots == 2"
            - "Garden.${garden_id}.available_plot_count == 2"

  # -----------------------------------------------------------------
  # State machines
  # -----------------------------------------------------------------
  - section: state_machines
    instances:
      - name: accept_from_waitlisted_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Application.OFFERED_to_ACCEPTED, "errors[ERR_OFFER_NOT_PENDING]"]
        distinguishing_aspect: "Accepting a WAITLISTED (never OFFERED) application returns ERR_OFFER_NOT_PENDING (409); no assignment is created."
        test_recipe:
          setup: ["gardener with a WAITLISTED application"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "SM Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /gardeners"
              payload: { full_name: "Wai List", email: "wai@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /applications"
              payload: { gardener_id: "${g_id}", garden_id: "${garden_id}", requested_size: "SMALL" }
              as: Gardener
              as_user_id: "${g_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/accept"
              payload: {}
              as: Gardener
              as_user_id: "${g_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_OFFER_NOT_PENDING"

      - name: warn_from_warned_returns_compliance_not_open
        claim_type: invalid_transition
        grounds: [state_machines.ComplianceCase.OPEN_to_WARNED, "errors[ERR_COMPLIANCE_NOT_OPEN]"]
        distinguishing_aspect: "Issuing warn on an already-WARNED case returns ERR_COMPLIANCE_NOT_OPEN (409)."
        test_recipe:
          setup: ["a WARNED compliance case"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "CC Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "C-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Cara Warn", email: "cara@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /compliance-cases"
              payload: { assignment_id: "${asg_id}", violation_type: "NEGLECT" }
              as: GardenManager
              captures: { cc_id: "$.data.id" }
            - call: "POST /compliance-cases/${cc_id}/warn"
              payload: {}
              as: GardenManager
          trigger:
            - call: "POST /compliance-cases/${cc_id}/warn"
              payload: {}
              as: GardenManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_COMPLIANCE_NOT_OPEN"

      - name: resolve_after_deadline_returns_cure_expired
        claim_type: guarded_transition
        grounds: [state_machines.ComplianceCase.WARNED_to_CURED, "errors[ERR_CURE_PERIOD_EXPIRED]"]
        distinguishing_aspect: "Resolving a WARNED case after cure_deadline (clock 2026-03-30 > deadline 2026-03-29) returns ERR_CURE_PERIOD_EXPIRED (409)."
        test_recipe:
          setup: ["case WARNED at 2026-03-15 (deadline 2026-03-29); clock advanced to 2026-03-30"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Cure Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "C-2", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Cure Late", email: "curelate@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /compliance-cases"
              payload: { assignment_id: "${asg_id}", violation_type: "NEGLECT" }
              as: GardenManager
              captures: { cc_id: "$.data.id" }
            - call: "POST /compliance-cases/${cc_id}/warn"
              payload: {}
              as: GardenManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-30T00:00:00Z" }
              as: GardenManager
          trigger:
            - call: "POST /compliance-cases/${cc_id}/resolve"
              payload: {}
              as: GardenManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_CURE_PERIOD_EXPIRED"

      - name: escalate_before_deadline_returns_cure_active
        claim_type: guarded_transition
        grounds: [state_machines.ComplianceCase.WARNED_to_ESCALATED, "errors[ERR_CURE_PERIOD_ACTIVE]"]
        distinguishing_aspect: "Escalating a WARNED case while clock (2026-03-20) is still within the cure window (deadline 2026-03-29) returns ERR_CURE_PERIOD_ACTIVE (409)."
        test_recipe:
          setup: ["case WARNED at 2026-03-15 (deadline 2026-03-29); clock at 2026-03-20"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Active Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "C-3", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Es Cal", email: "escal@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /compliance-cases"
              payload: { assignment_id: "${asg_id}", violation_type: "NEGLECT" }
              as: GardenManager
              captures: { cc_id: "$.data.id" }
            - call: "POST /compliance-cases/${cc_id}/warn"
              payload: {}
              as: GardenManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: GardenManager
          trigger:
            - call: "POST /compliance-cases/${cc_id}/escalate"
              payload: {}
              as: GardenManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_CURE_PERIOD_ACTIVE"

      - name: decline_offer_releases_plot
        claim_type: Valid Transition
        grounds: [state_machines.Application.OFFERED_to_DECLINED, state_machines.Plot.RESERVED_to_AVAILABLE]
        distinguishing_aspect: "Declining an OFFERED application flips the application to DECLINED and returns the plot to AVAILABLE."
        test_recipe:
          setup: ["gardener with an OFFERED application on a MEDIUM plot"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Decline Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "D-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id" }
            - call: "POST /gardeners"
              payload: { full_name: "Deb Line", email: "deb@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /applications"
              payload: { gardener_id: "${g_id}", garden_id: "${garden_id}", requested_size: "MEDIUM" }
              as: Gardener
              as_user_id: "${g_id}"
              captures: { app_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/offer"
              payload: {}
              as: GardenManager
          trigger:
            - call: "POST /applications/${app_id}/decline"
              payload: {}
              as: Gardener
              as_user_id: "${g_id}"
          assert:
            - "Application.${app_id}.status == DECLINED"
            - "Plot.${plot_id}.status == AVAILABLE"

      - name: expire_offers_sweep_moves_offer_to_expired
        claim_type: Side Effect Execution
        grounds: [state_machines.Application.OFFERED_to_EXPIRED, entities.Application.fields.offer_expires_at]
        distinguishing_aspect: "After the offer window lapses (offer at 2026-03-10, window 7d, clock 2026-03-20), expire-offers flips the application to EXPIRED and frees the plot."
        test_recipe:
          setup: ["OFFERED application whose offer_expires_at (2026-03-17) is before the current clock 2026-03-20"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Expire Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "E-1", size: "SMALL" }
              as: GardenManager
              captures: { plot_id: "$.data.id" }
            - call: "POST /gardeners"
              payload: { full_name: "Ex Pyre", email: "ex@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /applications"
              payload: { gardener_id: "${g_id}", garden_id: "${garden_id}", requested_size: "SMALL" }
              as: Gardener
              as_user_id: "${g_id}"
              captures: { app_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/offer"
              payload: {}
              as: GardenManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: GardenManager
          trigger:
            - call: "POST /gardens/${garden_id}/expire-offers"
              payload: {}
              as: GardenManager
          assert:
            - "Application.${app_id}.status == EXPIRED"
            - "Plot.${plot_id}.status == AVAILABLE"

      - name: settle_twice_returns_assignment_not_active
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Assignment.ACTIVE_to_ENDED, "errors[ERR_ASSIGNMENT_NOT_ACTIVE]"]
        distinguishing_aspect: "Settling an already-ENDED assignment returns ERR_ASSIGNMENT_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["an ENDED assignment (settled once)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Twice Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "T-1", size: "SMALL" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Twy Ce", email: "twy@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /assignments/${asg_id}/settle"
              payload: {}
              as: GardenManager
          trigger:
            - call: "POST /assignments/${asg_id}/settle"
              payload: {}
              as: GardenManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_ASSIGNMENT_NOT_ACTIVE"

  # -----------------------------------------------------------------
  # Calculations
  # -----------------------------------------------------------------
  - section: calculations
    instances:
      - name: tool_late_return_one_hour_fine
        claim_type: Correct Result
        grounds: [calculations.tool_late_fine, state_machines.ToolLoan.CHECKED_OUT_to_RETURNED_LATE]
        distinguishing_aspect: "Returning one hour past due (12:00 due, 13:00 returned) ceils to 1 hour and yields late_fine_cents 200 with status RETURNED_LATE."
        test_recipe:
          setup: ["ACTIVE gardener with a tool checked out 08:00->12:00; returns at 13:00"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Fine Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "F-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Lo Late", email: "lolate@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /tools"
              payload: { garden_id: "${garden_id}", name: "Spade 1", category: "HAND", cleaning_buffer_hours: 4 }
              as: GardenManager
              captures: { tool_id: "$.data.id" }
            - call: "POST /tool-loans"
              payload: { tool_id: "${tool_id}", gardener_id: "${g_id}", checked_out_at: "2026-03-15T08:00:00Z", due_at: "2026-03-15T12:00:00Z" }
              as: Gardener
              as_user_id: "${g_id}"
              captures: { loan_id: "$.data.id" }
          trigger:
            - call: "POST /tool-loans/${loan_id}/return"
              payload: { returned_at: "2026-03-15T13:00:00Z" }
              as: Gardener
              as_user_id: "${g_id}"
          assert:
            - "ToolLoan.${loan_id}.late_fine_cents == 200"
            - "ToolLoan.${loan_id}.status == RETURNED_LATE"

      - name: offer_empty_waitlist_returns_no_eligible
        claim_type: Correct Result
        grounds: [calculations.renewal_priority_score, "errors[ERR_NO_ELIGIBLE_APPLICANT]"]
        distinguishing_aspect: "Offering an AVAILABLE plot with no WAITLISTED application of that size returns ERR_NO_ELIGIBLE_APPLICANT (409) — the empty-candidate-set fallback."
        test_recipe:
          setup: ["AVAILABLE MEDIUM plot, no applications"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "Empty Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "Q-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id" }
          trigger:
            - call: "POST /plots/${plot_id}/offer"
              payload: {}
              as: GardenManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_NO_ELIGIBLE_APPLICANT"

      - name: water_overage_rounding_order_delta
        claim_type: Precision
        grounds: [calculations.water_overage_charge]
        excluded_because:
          difficulty_instance: combinatorial_formula / water_overage_rounding_order
          rationale: "Per-period rounding (12 not 11) is asserted by the named §1.8 instance."

  # -----------------------------------------------------------------
  # Validations
  # -----------------------------------------------------------------
  - section: validations
    instances:
      - name: pay_wrong_amount_returns_amount_mismatch
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "Paying 5000 against a MEDIUM assignment owing 6000 returns ERR_AMOUNT_MISMATCH (422)."
        test_recipe:
          setup: ["MEDIUM assignment owing provisional 6000, unpaid"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "Pay Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "PY-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Pay Er", email: "payer@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
          trigger:
            - call: "POST /assignments/${asg_id}/pay"
              payload: { amount_cents: 5000 }
              as: Treasurer
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_AMOUNT_MISMATCH"

      - name: duplicate_application_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_APPLICATION]"]
        distinguishing_aspect: "A second WAITLISTED application for the same (gardener, garden, size) returns ERR_DUPLICATE_APPLICATION (409)."
        test_recipe:
          setup: ["gardener already WAITLISTED for a MEDIUM plot in the garden"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "Dup Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /gardeners"
              payload: { full_name: "Dup App", email: "dupapp@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /applications"
              payload: { gardener_id: "${g_id}", garden_id: "${garden_id}", requested_size: "MEDIUM" }
              as: Gardener
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /applications"
              payload: { gardener_id: "${g_id}", garden_id: "${garden_id}", requested_size: "MEDIUM" }
              as: Gardener
              as_user_id: "${g_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_APPLICATION"

      - name: duplicate_water_period_returns_validation
        claim_type: Violation → Error
        grounds: ["validations[priority=4]", entities.WaterReading.fields.period_index]
        distinguishing_aspect: "A second WaterReading for the same (assignment_id, period_index) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["assignment with a period-1 water reading already recorded"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "Water Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "W-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Wat Er", email: "water@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 1, gallons_used: 100, recorded_on: "2026-04-01T00:00:00Z" }
              as: Gardener
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 1, gallons_used: 120, recorded_on: "2026-04-15T00:00:00Z" }
              as: Gardener
              as_user_id: "${g_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

  # -----------------------------------------------------------------
  # Endpoints
  # -----------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_plots_pagination_envelope
        claim_type: Standard CRUD
        grounds: [endpoints, entities.Plot.fields.garden_id]
        distinguishing_aspect: "GET /plots?garden_id&limit=1 returns a paginated array with total_count 2 and has_more true."
        test_recipe:
          setup: ["garden with two plots"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "Page Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "PG-1", size: "SMALL" }
              as: GardenManager
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "PG-2", size: "SMALL" }
              as: GardenManager
          trigger:
            - call: "GET /plots"
              payload: { garden_id: "${garden_id}", limit: 1, offset: 0 }
              as: GardenManager
          assert:
            - "response.meta pagination total_count == 2"
            - "response has_more == true"

      - name: reverse_reach_assignments_by_gardener
        claim_type: Cross-reference link
        grounds: [entities.Assignment.fields.gardener_id, endpoints]
        distinguishing_aspect: "GET /assignments?gardener_id returns the gardener's assignment array (FK reverse-reachability for Assignment.gardener_id)."
        test_recipe:
          setup: ["gardener with one assignment"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "Rev Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "RV-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Rev Erse", email: "rev@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
          trigger:
            - call: "GET /assignments"
              payload: { gardener_id: "${g_id}" }
              as: GardenManager
          assert:
            - "response.data is an array containing an Assignment with id == ${asg_id}"

      - name: reverse_reach_tools_by_garden_subresource
        claim_type: Computed read
        grounds: [entities.Tool.fields.garden_id, endpoints]
        distinguishing_aspect: "GET /gardens/{id}/tools returns the garden's tool array (FK reverse-reachability for Tool.garden_id)."
        test_recipe:
          setup: ["garden with one tool"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "Shed Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /tools"
              payload: { garden_id: "${garden_id}", name: "Rake 1", category: "HAND" }
              as: GardenManager
              captures: { tool_id: "$.data.id" }
          trigger:
            - call: "GET /gardens/${garden_id}/tools"
              payload: {}
              as: GardenManager
          assert:
            - "response.data is an array containing a Tool with id == ${tool_id}"

  # -----------------------------------------------------------------
  # Errors
  # -----------------------------------------------------------------
  - section: errors
    instances:
      - name: error_renewal_blocked_by_compliance_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_RENEWAL_BLOCKED_BY_COMPLIANCE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / renewal_blocked_by_open_compliance_case
          rationale: "Triggered as the failure path of the named §1.8 instance."

      - name: error_tool_time_conflict_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_TOOL_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / tool_loan_buffer_overlap_rejected
          rationale: "Triggered as the failure path of the named §1.8 instance."

  # -----------------------------------------------------------------
  # RBAC
  # -----------------------------------------------------------------
  - section: rbac
    instances:
      - name: gardener_cannot_create_plot_returns_unauthorized
        claim_type: exclusive_op_denied
        grounds: [roles.GardenManager, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Gardener calling POST /plots (a GardenManager-exclusive op) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["a garden exists"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "RBAC Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /gardeners"
              payload: { full_name: "Role Tester", email: "role@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
          trigger:
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "X-1", size: "SMALL" }
              as: Gardener
              as_user_id: "${g_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "response.http_status == 403"

      - name: manager_cannot_waive_fee_returns_unauthorized
        claim_type: segregation_of_duties
        grounds: [roles.Treasurer, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A GardenManager calling POST /assignments/{id}/waive-fee (a Treasurer-exclusive op) is denied with ERR_UNAUTHORIZED (403) — enforcing segregation of duties."
        test_recipe:
          setup: ["a MEDIUM assignment with an unpaid fee"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "SoD Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "SD-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Sod Duty", email: "sod@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
          trigger:
            - call: "POST /assignments/${asg_id}/waive-fee"
              payload: {}
              as: GardenManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

  # -----------------------------------------------------------------
  # Cross-cutting complexity layers
  # -----------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: occ_stale_plot_version_on_assign_returns_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assign-stale-plot]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A client that observed plot version 1, then had the plot go through offer+decline (version now 3, still AVAILABLE), and assigns with expected_plot_version 1 is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["MEDIUM plot at version 1 observed by the caller; an offer then decline advances plot.version to 3 while leaving it AVAILABLE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "OCC Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "O-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Occ Wan", email: "occ@example.com" }
              as: GardenManager
              captures: { ga_id: "$.data.id" }
            - call: "POST /gardeners"
              payload: { full_name: "Occ Two", email: "occ2@example.com" }
              as: GardenManager
              captures: { gb_id: "$.data.id" }
            - call: "POST /applications"
              payload: { gardener_id: "${ga_id}", garden_id: "${garden_id}", requested_size: "MEDIUM" }
              as: Gardener
              as_user_id: "${ga_id}"
              captures: { app_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/offer"
              payload: {}
              as: GardenManager
            - call: "POST /applications/${app_id}/decline"
              payload: {}
              as: Gardener
              as_user_id: "${ga_id}"
          trigger:
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${gb_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.http_status == 412"

      - name: derived_balance_owed_after_assignment
        claim_type: derived_field_reconciliation
        grounds: [entities.Gardener.fields.balance_owed_cents, entities.Assignment.fields.provisional_fee_cents]
        distinguishing_aspect: "Assigning a MEDIUM plot debits the gardener's balance_owed_cents by the provisional fee (6000)."
        test_recipe:
          setup: ["gardener freshly assigned a MEDIUM plot"]
          setup_api_calls:
            - call: "POST /gardens"
              payload: { name: "Ledger Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "LG-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Led Ger", email: "ledger@example.com" }
              as: GardenManager
              captures: { g_id: "$.data.id" }
          trigger:
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${g_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
          assert:
            - "Gardener.${g_id}.balance_owed_cents == 6000"
            - "Assignment.${asg_id}.provisional_fee_cents == 6000"

  # -----------------------------------------------------------------
