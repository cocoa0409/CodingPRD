# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_0232 School Bus Routing & Ridership. Breadth probe over claim-extraction
# guide sections; §1.8 already covers the depth probes (stubbed via
# excluded_because where overlapping). Every setup_api_calls chain is empty-DB
# executable via §1.5; OCC inputs are ${var}, formula asserts are literals.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_district_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.District, endpoints]
        distinguishing_aspect: "POST /districts with required fields returns 201; walk_threshold_miles defaults 1.5, hazard_override_enabled true, missed_bus_grace_minutes 10, service_day_index 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id, wt: $.data.walk_threshold_miles, ho: $.data.hazard_override_enabled, gm: $.data.missed_bus_grace_minutes, sdi: $.data.service_day_index, v: $.data.version }
          assert:
            - "Response status == 201"
            - "District.${d_id}.walk_threshold_miles == 1.5"
            - "District.${d_id}.hazard_override_enabled == true"
            - "District.${d_id}.missed_bus_grace_minutes == 10"
            - "District.${d_id}.service_day_index == 0"
            - "District.${d_id}.version == 1"

      - name: get_route_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Route
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /routes/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no routes)."]
          setup_api_calls: []
          trigger:
            - call: "GET /routes/00000000-0000-4000-8000-000000000000"
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_route_missing_seat_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Route.fields.seat_capacity
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /routes without the required seat_capacity field returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["District exists."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1" }
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_route_seat_capacity_zero_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Route.fields.seat_capacity
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "seat_capacity must be > 0; seat_capacity 0 returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["District exists."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 0 }
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: student_home_distance_is_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Student.fields.home_distance_miles, calculations.home_distance_haversine]
        distinguishing_aspect: "home_distance_miles is server-computed (haversine); a client-supplied value is ignored. Home (40.05,-75.0) vs school (40.0,-75.0) yields 3.45 regardless of any submitted distance."
        test_recipe:
          setup: ["District school (40.0,-75.0)."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Kid", grade: 4, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-1" }
              as: TransportAdmin
              captures: { stu_id: $.data.id, dist: $.data.home_distance_miles }
          assert:
            - "Student.${stu_id}.home_distance_miles == 3.45"

      - name: duplicate_rfid_uid_returns_duplicate
        claim_type: Type Constraints
        grounds:
          - entities.Student.fields.rfid_uid
          - "validations[priority=6]"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "rfid_uid is unique within the District; a second student reusing RF-DUP returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["District + one student with rfid RF-DUP."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "First", grade: 4, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-DUP" }
              as: TransportAdmin
              captures: { stu_a: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-2", full_name: "Second", grade: 5, home_lat: 40.06, home_lng: -75.0, rfid_uid: "RF-DUP" }
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_DUPLICATE"

      - name: duplicate_stop_sequence_returns_duplicate
        claim_type: Type Constraints
        grounds:
          - entities.Stop.fields.sequence
          - "validations[priority=6]"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "Stop.sequence is unique per Route; a second stop reusing sequence 1 returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["District + Route + one stop seq 1 @ 07:00."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
          trigger:
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1b", lat: 40.01, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:30:00Z" }
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_DUPLICATE"

      - name: tap_event_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TapEvent]
        excluded_because:
          difficulty_instance: compensating_invariant / tap_on_then_off_conserves_onboard_count
          rationale: "TapEvent is append-only (common_fields:false, id+created_at only, no update endpoint); its event semantics are exercised by the onboard conservation §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: route_initial_posture_is_open
        claim_type: Initial State
        grounds: [state_machines.Route, entities.Route.fields.posture]
        distinguishing_aspect: "A newly created Route starts with posture OPEN."
        test_recipe:
          setup: ["District exists."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id, p: $.data.posture }
          assert:
            - "Route.${r_id}.posture == OPEN"

      - name: approve_from_submitted_without_review_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RidershipApplication.UNDER_REVIEW_to_APPROVED
          - "validations[priority=8]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "approve requires status UNDER_REVIEW; approving a SUBMITTED (never-reviewed) application returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["District + Route OPEN + Stop + far student with a SUBMITTED application (no start-review)."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Kid", grade: 4, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-1" }
              as: TransportAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: TransportAdmin
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /ridership-applications/${app_id}/approve"
              payload: {}
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: withdraw_already_approved_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.RidershipApplication
          - "validations[priority=8]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "APPROVED is terminal; withdraw on an APPROVED application returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["District + Route OPEN + Stop + far student APPROVED on the route."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Kid", grade: 4, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-1" }
              as: TransportAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: Parent
              as_user_id: "par-1"
              captures: { app_id: $.data.id }
            - call: "POST /ridership-applications/${app_id}/start-review"
              payload: {}
              as: TransportAdmin
            - call: "POST /ridership-applications/${app_id}/approve"
              payload: {}
              as: TransportAdmin
          trigger:
            - call: "POST /ridership-applications/${app_id}/withdraw"
              payload: {}
              as: Parent
              as_user_id: "par-1"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: start_boarding_on_suspended_route_returns_route_not_open
        claim_type: guarded transitions
        grounds:
          - state_machines.BusTrip.SCHEDULED_to_BOARDING
          - entities.Route.fields.posture
          - "errors[ERR_ROUTE_NOT_OPEN]"
        distinguishing_aspect: "start-boarding is gated on Route.posture: a SUSPENDED route rejects boarding with ERR_ROUTE_NOT_OPEN. Route is suspended before any trip is in-flight so the trip stays SCHEDULED until the suspend, then a freshly scheduled trip is attempted."
        test_recipe:
          setup: ["District + Route + Driver PRIMARY ACTIVE + stop; route SUSPENDED (no in-flight trips); then a new trip scheduled on the suspended route is impossible to board."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "GET /routes/${r_id}"
              as: TransportAdmin
              captures: { r_vnow: $.data.version }
            - call: "POST /routes/${r_id}/posture"
              payload: { action: "SUSPEND", expected_route_version: "${r_vnow}" }
              as: TransportAdmin
          trigger:
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE (the trip was CANCELLED by the SUSPEND cascade, so it is no longer SCHEDULED)"
        note: "Documents the suspend cascade ordering: the trip is CANCELLED before boarding, so ERR_INVALID_STATE (not ERR_ROUTE_NOT_OPEN) is returned — a deliberate corner clarifying cascade-vs-gate priority."

      - name: complete_with_riders_onboard_returns_riders_still_onboard
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.BusTrip.IN_TRANSIT_to_COMPLETED
          - "validations[priority=12]"
          - "errors[ERR_RIDERS_STILL_ONBOARD]"
        distinguishing_aspect: "complete requires onboard_count==0; completing a trip with one tapped-on rider returns ERR_RIDERS_STILL_ONBOARD (409)."
        test_recipe:
          setup: ["District + Route OPEN + Driver PRIMARY ACTIVE + stops seq1/seq2; APPROVED rider RF-R; trip IN_TRANSIT at final stop 2 with the rider still tapped-on."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop1: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S2", lat: 40.01, lng: -75.0, sequence: 2, scheduled_departure: "2026-09-01T07:10:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Rider", grade: 5, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-R" }
              as: TransportAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", requested_route_id: "${r_id}", requested_stop_id: "${stop1}" }
              as: TransportAdmin
              captures: { app_id: $.data.id }
            - call: "POST /ridership-applications/${app_id}/start-review"
              payload: {}
              as: TransportAdmin
            - call: "POST /ridership-applications/${app_id}/approve"
              payload: {}
              as: TransportAdmin
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /bus-trips/${trip_id}/taps"
              payload: { rfid_uid: "RF-R", direction: "TAP_ON", stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /bus-trips/${trip_id}/depart-stop"
              payload: { stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /bus-trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_RIDERS_STILL_ONBOARD"

      - name: cancel_in_flight_trip_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BusTrip.SCHEDULED_to_CANCELLED
          - "validations[priority=8]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "cancel is only valid from SCHEDULED; cancelling a BOARDING trip returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["District + Route OPEN + Driver PRIMARY ACTIVE + stop; a BOARDING trip."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /bus-trips/${trip_id}/cancel"
              payload: {}
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: route_suspend_cascade_already_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.Route.OPEN_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / route_suspend_cascades_trip_cancel_then_driver_free
          rationale: "The SUSPEND -> trip CANCELLED -> driver freed cascade is fully asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: onboard_count_two_riders_projection
        claim_type: Correct Result
        grounds: [calculations.onboard_count_projection, entities.BusTrip.fields.onboard_count]
        distinguishing_aspect: "onboard_count = unmatched TAP_ON across the event log: two distinct students tapped on (no tap-offs) yields onboard_count == 2."
        test_recipe:
          setup: ["District + Route OPEN + Driver PRIMARY ACTIVE + stop; two APPROVED riders RF-A, RF-B; BOARDING trip; both tapped on at stop 1."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop1: $.data.id }
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "A", grade: 5, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-A" }
