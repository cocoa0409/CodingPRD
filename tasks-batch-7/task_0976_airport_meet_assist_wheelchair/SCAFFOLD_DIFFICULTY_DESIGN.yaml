  - rule_id: resource_temporal_overlap
    instances:
      - name: agent_assignment_half_open_adjacency_no_conflict
        grounds:
          - calculations.agent_shift_overlap
          - validations[priority=9]
          - errors[ERR_TEMPORAL_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics: an existing assignment [09:00, 10:00) and a new candidate
          leg with scheduled_pickup_utc = 10:00 do NOT conflict (adjacency allowed). Tests the
          >= / > distinction on the temporal edge — different from the wheelchair overlap in the
          next instance.
        test_recipe:
          setup:
            - "Airport BWI; Agent G with shift [08:00, 20:00]"
            - "Segment S1 ARRIVAL at 09:00 → leg L1 scheduled_pickup 08:45 (meet_buffer=15), MEET_ARRIVAL (45 min) → occupies [08:45, 09:30)"
            - "Segment S2 ARRIVAL at 10:15 → leg L2 scheduled_pickup 10:00 → occupies [10:00, 10:45)"
            - "Dispatch L1 to G. Now dispatch L2 — L2's window starts at 10:00 which is > L1's end 09:30, no overlap. The TRUE half-open adjacency test: change S2 to scheduled 10:45 → pickup 10:30. L2 occupies [10:30, 11:15) — still disjoint. To force exact adjacency: choose S2 such that L2.start == L1.end (09:30). MEET_ARRIVAL pickup = scheduled - 15min. scheduled = 09:45 → pickup 09:30 == L1.end 09:30. Half-open: NO conflict."
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: PlatformAdmin
