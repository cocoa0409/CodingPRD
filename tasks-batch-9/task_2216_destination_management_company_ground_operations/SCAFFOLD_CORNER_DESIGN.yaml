            - "${e_low} == ERR_MARKUP_PCT_OUT_OF_BAND"
            - "the third trigger call returns HTTP 201"
            - "Program.${ok_id}.markup_pct == 0.05"
            - "GET /dmc/programs?limit=10&offset=0 returns total_count == 1"

