            - call: "POST /petitions"
              payload: { annexation_case_id: "${case_r6}", petition_type: "OWNER_MAJORITY", circulation_days: 30 }
              as: MunicipalPlanner
              as_user_id: "${muni_r6}"
              captures: { pet_r6: $.data.id }
          trigger:
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_r6}", parcel_id: "${parcel_r6a}", property_owner_id: "${ow_r6a}", ownership_share_pct: 100.00 }
              as: PropertyOwner
              as_user_id: "${ow_r6a}"
              captures: { cons_r6a: $.data.id, r6_value_a: $.data.qualified_value_cents }
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_r6}", parcel_id: "${parcel_r6b}", property_owner_id: "${ow_r6b}", ownership_share_pct: 100.00 }
