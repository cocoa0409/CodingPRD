# =============================================================================
# §1.9 Scaffold Corner Design — task_1514 nuclear medicine
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# All chains replay from empty-DB against SCAFFOLD.yaml endpoints only.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_isotope_product_computes_decay_constant
        claim_type: computed_fields
        grounds: [entities.IsotopeProduct.fields.decay_constant_per_minute]
        distinguishing_aspect: "decay_constant_per_minute is server-computed as ln(2)/110 = 0.006301 (6dp); client cannot set it; version starts at 1"
        test_recipe:
          setup: ["empty DB; clock default"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
          trigger:
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id, dc: $.data.decay_constant_per_minute, v: $.data.version } }
          assert:
            - "IsotopeProduct.${iso}.decay_constant_per_minute == 0.006301"
            - "IsotopeProduct.${iso}.version == 1 and created_at is server-stamped"

      - name: create_isotope_product_missing_required_half_life
        claim_type: required_fields
        grounds: [entities.IsotopeProduct.fields.half_life_minutes, "errors[ERR_VALIDATION]", "validations[priority=27]"]
        distinguishing_aspect: "Omitting required half_life_minutes yields 400 ERR_VALIDATION and persists nothing"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "NoHL", spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: get_nonexistent_order_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but unknown dose-order id yields 404 ERR_NOT_FOUND"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /nuclear-medicine/dose-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DepartmentAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: patient_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count + has_more per the fixed envelope"
        test_recipe:
          setup: ["two patients registered"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { p1: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P Two", weight_kg: 80 }, as: NuclearMedicineTechnologist, captures: { p2: $.data.id } }
          trigger:
            - { call: "GET /nuclear-medicine/patients?limit=1&offset=0", as: DepartmentAdmin }
          assert:
            - "response data array length == 1, total_count == 2, has_more == true"
            - "GET /nuclear-medicine/patients?limit=1&offset=1 returns the second patient and has_more == false"

      - name: administration_record_is_append_only
        claim_type: immutability
        grounds: [entities.DoseAdministration]
        distinguishing_aspect: "DoseAdministration (common_fields: false) exposes id + created_at only — no version/updated_at, and no update endpoint exists in §1.5"
        test_recipe:
          setup:
            - "Base F-18 fixture; vial calibrated 220.000 at 08:30; clock 10:20"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vial: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/calibrate", payload: { measured_activity_mbq: 220 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:20:00Z" }, as: DepartmentAdmin }
          trigger:
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/administer", payload: {}, as: NuclearMedicineTechnologist, as_user_id: "tech-2", captures: { adm: $.data.id } }
          assert:
            - "DoseAdministration.${adm} response contains id and created_at but no version and no updated_at key"

  - section: state_machines
    instances:
      - name: order_created_in_ordered_initial_state_with_computed_expiry
        claim_type: initial_state
        grounds: [state_machines.DoseOrder, entities.DoseOrder.fields.expires_at]
        distinguishing_aspect: "New order starts ORDERED and expires_at == administration_scheduled_at + 2 half-lives (10:20 + 220 min = 14:00)"
        test_recipe:
          setup: ["F-18 + license + AU + patient; clock 08:30"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
          trigger:
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id, st: $.data.status, exp: $.data.expires_at } }
          assert:
            - "DoseOrder.${ord}.status == ORDERED"
            - "DoseOrder.${ord}.expires_at == 2026-08-01T14:00:00Z"
            - "DoseOrder.${ord}.authorized_user_id == ${au} (system-set from X-User-ID)"

      - name: cancel_already_cancelled_order_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DoseOrder.ORDERED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second cancel on a CANCELLED order is rejected; no side effects re-fire"
        test_recipe:
          setup: ["F-18 + license + AU + patient; order ORDERED"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-orders/${ord}/cancel", payload: { reason: "patient refused" }, as: AuthorizedUser, as_user_id: "${au}", captures: { st: $.data.status } }
          trigger:
            - { call: "POST /nuclear-medicine/dose-orders/${ord}/cancel", payload: { reason: "again" }, as: AuthorizedUser, as_user_id: "${au}", captures: { err: $.data.error_id } }
          assert:
            - "First cancel returned status == CANCELLED"
            - "Second cancel rejected with error_id == ERR_INVALID_STATE (terminal lockdown)"

      - name: double_administer_rejected_invalid_state
        claim_type: idempotency
        grounds: [state_machines.DoseVial.CALIBRATED_to_ADMINISTERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating administer on an already-ADMINISTERED vial fails with ERR_INVALID_STATE; exactly one DoseAdministration exists"
        test_recipe:
          setup: ["Base F-18 fixture; vial calibrated 220.000 at 08:30; clock 10:20; first administration done"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vial: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/calibrate", payload: { measured_activity_mbq: 220 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:20:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/administer", payload: {}, as: NuclearMedicineTechnologist, as_user_id: "tech-2", captures: { adm: $.data.id } }
          trigger:
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/administer", payload: {}, as: NuclearMedicineTechnologist, as_user_id: "tech-3", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (vial already ADMINISTERED)"
            - "GET /nuclear-medicine/dose-administrations?vial_id=${vial} returns exactly 1 row"

      - name: receive_failed_delivery_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.IsotopeDelivery.SCHEDULED_to_FAILED, state_machines.IsotopeDelivery.SCHEDULED_to_RECEIVED]
        distinguishing_aspect: "FAILED is terminal: receive after mark-failed is rejected"
        test_recipe:
          setup: ["F-18 + license; delivery SCHEDULED then marked failed"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/mark-failed", payload: { reason: "generator outage at supplier" }, as: Radiopharmacist, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist, captures: { err: $.data.error_id } }
          assert:
            - "mark-failed returned status == FAILED"
            - "receive rejected with error_id == ERR_INVALID_STATE"

      - name: appointment_completes_on_administration_bubble_up
        claim_type: side_effect_execution
        grounds: [state_machines.ProcedureAppointment.BOOKED_to_COMPLETED, state_machines.DoseOrder.DOSE_PREPARED_to_ADMINISTERED]
        distinguishing_aspect: "Bubble-up: an administration at 10:20 inside the booking [10:00, 10:30) completes the appointment and the order"
        test_recipe:
          setup: ["Base F-18 fixture; appointment 10:00-10:30 BOOKED; clock 10:20"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-1", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { room: $.data.id } }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vial: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/calibrate", payload: { measured_activity_mbq: 220 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/procedure-appointments", payload: { order_id: "${ord}", room_id: "${room}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T10:30:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { appt: $.data.id } }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:20:00Z" }, as: DepartmentAdmin }
          trigger:
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/administer", payload: {}, as: NuclearMedicineTechnologist, as_user_id: "tech-2" }
            - { call: "GET /nuclear-medicine/procedure-appointments/${appt}", as: DepartmentAdmin, captures: { apptst: $.data.status } }
            - { call: "GET /nuclear-medicine/dose-orders/${ord}", as: DepartmentAdmin, captures: { ordst: $.data.status } }
          assert:
            - "ProcedureAppointment.${appt}.status == COMPLETED (10:20 inside [10:00, 10:30))"
            - "DoseOrder.${ord}.status == ADMINISTERED"

      - name: license_suspend_requires_active_state
        claim_type: invalid_transition
        grounds: [state_machines.RadiopharmacyLicense.ACTIVE_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Suspending an already-SUSPENDED license is rejected; cascade does not re-fire"
        test_recipe:
          setup: ["license L-100 ACTIVE then suspended"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses/${lic}/suspend", payload: {}, as: DepartmentAdmin }
          trigger:
            - { call: "POST /nuclear-medicine/licenses/${lic}/suspend", payload: {}, as: DepartmentAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: spill_advance_cannot_skip_contained
        claim_type: invalid_transition
        grounds: [state_machines.SpillIncident]
        distinguishing_aspect: "REPORTED -> DECONTAMINATED directly is not a declared transition and is rejected"
        test_recipe:
          setup: ["MINOR spill reported in a room"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-9", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { room: $.data.id } }
            - { call: "POST /nuclear-medicine/spill-incidents", payload: { room_id: "${room}", isotope_product_id: "${iso}", estimated_activity_mbq: 10, occurred_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, as_user_id: "rp-9", captures: { spill: $.data.id } }
          trigger:
