              captures: { g0_label: "$.data[0].size_label", g2_label: "$.data[2].size_label", g0_units: "$.data[0].allocated_units" }
          assert:
            - "the baseline stored four cells with ${first_last_label} == XL and ${first_first_units} == 69"
            - "the replacing PUT returns exactly 3 cells: ${n0_label} == S, ${n0_raw} == 828000 and ${n0_units} == 83 (round_half_up(6 * 40 * 11500 * 3000 / 100000000 * 10000) = 828000 ten-thousandths, then round_half_up(828000 / 10000) = 83)"
            - "${n1_units} == 110 for M at 4000 bps (raw 1104000) and ${n2_units} == 83 for L at 3000 bps; 83 + 110 + 83 == 276 == target_units, so delta is 0 and no remainder pass runs"
            - "S and L keep their labels but NOT their numbers: 69 -> 83 each, which proves the surviving rows were recomputed rather than carried over"
            - "GET /otb/option-plans/${op_id}/size-curve-cells returns total_count 3 with ${g0_label} == S, ${g2_label} == L and ${g0_units} == 83: the XL row from the baseline set is gone, not orphaned"
            - "the sum of allocated_units is invariant across the replacement at 276, because target_units depends only on depth_units_per_option and the StoreCluster and never on pct_bps"

