              captures: { feedH3_id: $.data.id, feedH3_status0: $.data.status, feedH3_v0: $.data.version }
          trigger:
            - call: "POST /hie/data-feeds/${feedH3_id}/quality-samples"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-15T00:00:00Z", messages_received: 2000, messages_rejected: 100, required_fields_missing_count: 20, duplicate_count: 10, timeliness_p95_seconds: 200 }
              as: HieAdmin
              captures: { sampH3_1: $.data.id, sampH3_1_rate: $.data.reject_rate }
            - call: "GET /hie/data-feeds/${feedH3_id}"
              payload: {}
              as: HieAdmin
              captures: { feedH3_status1: $.data.status, feedH3_reason1: $.data.status_reason, feedH3_rate1: $.data.latest_reject_rate, feedH3_v1: $.data.version }
            - call: "POST /hie/data-feeds/${feedH3_id}/quality-samples"
              payload: { period_start: "2026-06-15T00:00:00Z", period_end: "2026-07-01T00:00:00Z", messages_received: 2000, messages_rejected: 101, required_fields_missing_count: 20, duplicate_count: 10, timeliness_p95_seconds: 200 }
              as: HieAdmin
              captures: { sampH3_2: $.data.id, sampH3_2_rate: $.data.reject_rate }
            - call: "GET /hie/data-feeds/${feedH3_id}"
              payload: {}
              as: HieAdmin
              captures: { feedH3_status2: $.data.status, feedH3_reason2: $.data.status_reason, feedH3_rate2: $.data.latest_reject_rate, feedH3_v2: $.data.version }
            - call: "POST /hie/data-feeds/${feedH3_id}/quality-samples"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-15T00:00:00Z", messages_received: 2000, messages_rejected: 100, required_fields_missing_count: 20, duplicate_count: 10, timeliness_p95_seconds: 200 }
              as: HieAdmin
              captures: { sampH3_3: $.data.id, sampH3_3_rate: $.data.reject_rate }
