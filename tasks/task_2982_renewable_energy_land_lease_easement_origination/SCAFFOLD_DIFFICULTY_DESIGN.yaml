              as_user_id: "tc-user-02"
          assert:
            - "${score_clean} == 82.15 (FIELD_VERIFIED with zero open BLOCKING items matches DESKTOP exactly)"
            - "${ti_a_status0} == OPEN and ${ti_b_status0} == BLOCKED at creation"
            - "${count_two} == 2 and ${score_two_open} == 67.15 before the trigger"
            - "hop 1: TitleCurativeItem.${ti_a_id}.status == CLEARED, cleared_by_user_id == tc-user-02, cleared_at == 2026-08-01T00:00:00Z"
            - "hop 2: TitleCurativeItem.${ti_b_id}.status == OPEN (successor released by the predecessor clearing)"
            - "hop 3: Parcel.${p_at_id}.blocking_curative_open_count == 1"
            - "hop 4: Parcel.${p_at_id}.screening_score == 75.90 and screening_tier == STANDARD"
            - "Parcel.${p_at_id}.curative_cost_cents == 450000 (only the CLEARED item's cost is capitalised; B's 275000 is not)"
            - "Parcel.${p_at_id}.status == SCREENING and Landowner.${l1_id}.status == PROSPECT — the chain stops because one BLOCKING item remains open"
            - "Parcel.${p_at_id}.buildable_acres == 100.00 (the curative chain never touches acreage)"
            - "Parcel.${p_at_id}.waived_blocking_count == 0"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: expired_option_beats_payment_hold_on_exercise
        pair:
          higher: { priority: 22, category: state, error_id: ERR_OPTION_EXPIRED, http: 422 }
          lower: { priority: 41, category: business_fiscal, error_id: ERR_LANDOWNER_PAYMENT_HOLD, http: 422 }
        grounds:
          - validations[priority=22]
          - validations[priority=41]
          - errors.ERR_OPTION_EXPIRED
          - errors.ERR_LANDOWNER_PAYMENT_HOLD
        distinguishing_aspect: |
          Category pair state (22) versus business_fiscal (41), both landing on
          POST /option-agreements/{optionId}/exercise. Two independent objections
          are live at the same instant: the option's own clock has run out and the
          landowner is under a payment hold. The instrument-staleness rule sits
          above the fiscal ladder deliberately, so the caller learns the option is
          dead rather than that the money is frozen. Note that the clock advance
          also drives the option to EXPIRED, which would satisfy the generic
          from-state rule at priority 23 — rule 22 outranks that too.
        test_recipe:
          setup:
            - "One Landowner 'Caprock Ranch Holdings LLC' with payment_hold false at registration, three 48453 SetbackRule rows and the 125.00-acre Parcel with buildable_acres 100.00 in QUALIFIED."
            - "One OptionAgreement with option_term_days 30, sent, accepted and executed by pm-user-01 at the default clock 2026-08-01T00:00:00Z, so option_expiry_at is 2026-08-31T00:00:00Z."
            - "The landowner then put under a payment hold via PATCH, so payment_hold is true."
            - "The clock advanced to 2026-09-01T00:00:00Z, which is strictly after option_expiry_at, so both objections are live."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Caprock Ranch Holdings LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "land@caprock.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l1_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.06, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "OCCUPIED_DWELLING", setback_feet: 500, encumbrance_rate_per_acre: 0.10, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PUBLIC_ROAD", setback_feet: 100, encumbrance_rate_per_acre: 0.04, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-1188-004", county_fips: "48453", landowner_id: "${l1_id}", gross_acres: 125.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_at_id: "$.data.id" }
            - call: "GET /land-origination/parcels/${p_at_id}"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_at_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_at_id}", landowner_id: "${l1_id}", expected_parcel_version: "${p_at_v}", option_term_days: 30, option_fee_per_acre_cents: 2500, extension_count_allowed: 2, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { opt_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${opt_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${opt_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l1_id}"
            - call: "POST /land-origination/option-agreements/${opt_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
              captures: { opt_expiry: "$.data.option_expiry_at" }
            - call: "PATCH /land-origination/landowners/${l1_id}"
              payload: { payment_hold: true }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { hold_flag: "$.data.payment_hold" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { expired_count: "$.data.expired_option_count" }
          trigger:
            - call: "POST /land-origination/option-agreements/${opt_id}/exercise"
              payload: { exercise_notice_reference: "NOL-2982-0004" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { conflict_error: "$.data.error_id" }
          assert:
            - "${opt_expiry} == 2026-08-31T00:00:00Z and ${hold_flag} == true and ${expired_count} == 1"
            - "the trigger returns HTTP 422 with ${conflict_error} == ERR_OPTION_EXPIRED (priority 22)"
            - "${conflict_error} != ERR_LANDOWNER_PAYMENT_HOLD (priority 41 is shadowed)"
            - "${conflict_error} != ERR_INVALID_STATE (priority 23 is shadowed even though the option is now EXPIRED)"
            - "no LeaseAgreement row exists for OptionAgreement ${opt_id}"
            - "OptionAgreement.${opt_id}.status == EXPIRED and exercised_at is null"

      - name: title_blocking_beats_corridor_station_conflict
        pair:
          higher: { priority: 26, category: business_safety, error_id: ERR_TITLE_CURATIVE_BLOCKING, http: 422 }
          lower: { priority: 38, category: business_temporal, error_id: ERR_CORRIDOR_STATION_CONFLICT, http: 409 }
        grounds:
          - validations[priority=26]
          - validations[priority=38]
          - errors.ERR_TITLE_CURATIVE_BLOCKING
          - errors.ERR_CORRIDOR_STATION_CONFLICT
        distinguishing_aspect: |
          A different category pair on a different endpoint: business_safety (26)
          versus business_temporal (38) on POST /crossing-agreements, and the two
          errors even carry different HTTP statuses (422 versus 409), so the
          shadowing is visible in the status line as well as the body. The
          requested crossing simultaneously sits on a parcel with an open
          BLOCKING title defect and overlaps an existing crossing in both station
          space and time; title safety outranks the scheduling objection.
        test_recipe:
          setup:
            - "One Landowner 'Caprock Ranch Holdings LLC' and three 48453 SetbackRule rows (rates 0.06, 0.10, 0.04)."
            - "Parcel P_clean of 125.00 gross acres in county 48453 with no curative items, so blocking_curative_open_count is 0."
            - "Parcel P_blocked of 90.00 gross acres in county 48453 (raw_setback_acres 18.00, buildable_acres 72.00) carrying one OPEN BLOCKING TAX_LIEN curative item, so blocking_curative_open_count is 1."
            - "One Corridor 'Bluestem 345kV Collector' with total_length_m 5000 and buffer_m 50."
            - "One CrossingAgreement X1 on P_clean occupying stations 1000-1500 over the window 2026-09-01T00:00:00Z to 2026-10-01T00:00:00Z, in PROPOSED."
