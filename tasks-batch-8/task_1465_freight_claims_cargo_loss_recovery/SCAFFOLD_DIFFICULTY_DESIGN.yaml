      - name: claim_create_requires_shipment_delivered_and_carrier_active
        grounds:
          - validations[priority=14]
          - errors[ERR_SHIPMENT_NOT_DELIVERED]
          - state_machines.Carrier
        distinguishing_aspect: |
          Pair: Claim -> Shipment (and Carrier). Creating a Claim requires
          shipment.status == DELIVERED AND carrier.status == ACTIVE AND
          lane.status == ACTIVE. Different pair from SubrogationCase->Claim.
        test_recipe:
