              as_user_id: "registry-1"
              captures: { prod_b_id: $.data.id }
            - call: "GET /producers/${prod_a_id}"
              as: RegistryAdministrator
              as_user_id: "registry-1"
            - call: "GET /producers/${prod_b_id}"
              as: ProgramAdministrator
          assert:
            - "trigger call 1 responds 201 with data.legal_name == \"Bluegrass Farms LLC\", data.county_code == \"OH-041\", data.version == 1"
            - "trigger call 2 responds 201 with data.id != ${prod_a_id} and data.version == 1"
            - "trigger call 3 responds 200 with data.id == ${prod_a_id}, data.contact_email == \"ops@bluegrass.example\" and data.created_at == 2026-06-15T00:00:00Z"
            - "trigger call 4 responds 200 with data.id == ${prod_b_id} and data.legal_name == \"Riverbend Acres LLC\""
            - "both read-backs carry version 1 (no producer write path exists after creation)"

      - name: derive_and_finalize_limits_are_action_endpoints_with_empty_bodies
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /permits/{permit_id}/derive-limits]
          - endpoints[POST /permits/{permit_id}/finalize-limits]
        distinguishing_aspect: "Both endpoints take no input at all: every derived value comes from the permit's own row and its allocation, and each call advances exactly one limit_status step."
        excluded_because:
          difficulty_instance: permit_dual_axis_limit_transition_moves_compliance_axis_backwards
          rationale: "That §1.8 instance calls both action endpoints with empty bodies and asserts the DRAFT_LIMITS -> INTERIM_LIMITS -> FINAL_LIMITS progression along with every field each call writes."

      - name: allocation_run_read_returns_the_computed_allocations_array
        claim_type: computed_read
        grounds:
          - endpoints[GET /allocation-runs/{allocation_run_id}]
          - entities.AllocationRun.fields.allocations
        distinguishing_aspect: "The read-back must reproduce the per-source allocation array in its declared order (POINT rows first, each group by existing_load_lbs_yr DESC) with the same rounded values the write returned."
        excluded_because:
          difficulty_instance: allocation_pool_round_then_sum_not_sum_then_round
          rationale: "That §1.8 instance reads the run back and asserts the ordered allocations array element by element against the pinned per-source values."

      - name: credit_transaction_creation_links_a_batch_to_a_permit
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /credit-transactions]
          - entities.CreditTransaction.fields.credit_batch_id
          - entities.CreditTransaction.fields.permit_id
        distinguishing_aspect: "One write links two aggregates and derives its geography from both ends: the batch supplies the generating reach, the permit supplies the receiving reach."
        excluded_because:
          difficulty_instance: credit_delivery_proposed_vs_settled_variant_divergence
          rationale: "That §1.8 instance creates the link and asserts both foreign keys plus the delivery_ratio and path_reach_count derived from the two reaches."

      - name: batch_listing_is_a_conditional_action
        claim_type: conditional_action
        grounds:
          - endpoints[POST /credit-batches/{credit_batch_id}/list]
          - validations[priority=12]
          - validations[priority=20]
        distinguishing_aspect: "Listing is permitted only when the batch is ISSUED with available_lbs > 0.00, its project is CERTIFIED and its watershed is ACTIVE — three conditions on three different rows."
        excluded_because:
          difficulty_instance: batch_listing_blocked_while_generating_project_sits_in_pending_reverification
          rationale: "That §1.8 instance exercises the conditional gate from both sides on the same batch: refused while the project is in PENDING_REVERIFICATION, accepted once it is CERTIFIED again."

      - name: allocation_run_is_the_only_multi_row_write_and_is_all_or_nothing
        claim_type: bulk_action
        grounds:
          - endpoints[POST /tmdl-assessments/{tmdl_assessment_id}/allocation-runs]
          - validations[priority=27]
        distinguishing_aspect: "The allocation run is the single endpoint that writes many rows at once, and it has no partial-success mode: a rejected run leaves every SourceAssessment and the Watershed roll-ups untouched."
        excluded_because:
          difficulty_instance: allocable_load_exactly_zero_accepted_but_one_cent_negative_rejected
          rationale: "That §1.8 instance shows the rejected run writing nothing at all — no AllocationRun row, no per-source allocations and no change to the watershed totals — while the accepted zero-allocable run writes every row."

      - name: rescinding_a_run_reverses_every_side_effect_it_wrote
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /allocation-runs/{allocation_run_id}/rescind]
          - state_machines.AllocationRun.ACTIVE_to_RESCINDED
        distinguishing_aspect: "Rescission is the inverse action of the run: it nulls every allocated_load_lbs_yr and allocation_run_id it wrote and unwinds the watershed roll-ups and reserve pool."
        excluded_because:
          difficulty_instance: load_conservation_restored_by_rescinding_an_allocation_run_but_refused_once_a_permit_relies_on_it
          rationale: "That §1.8 instance rescinds a run and asserts the nulled source allocations, the restored watershed totals and the refusal once a permit has derived limits from it."

  - section: errors
    instances:
      # Coverage roster for the §1.6 catalog. Each error is triggered by at least one
      # instance in this file or in SCAFFOLD_DIFFICULTY_DESIGN.yaml:
      #   ERR_UNAUTHENTICATED                -> request_with_blank_auth_headers_is_unauthenticated
      #   ERR_FORBIDDEN_ROLE                 -> exclusive_operations_are_refused_to_every_other_role
      #   ERR_NOT_RESOURCE_OWNER             -> annual_report_by_a_different_permittee_is_rejected_as_not_resource_owner,
      #                                         practice_project_registered_for_another_producer_is_rejected
      #   ERR_*_NOT_FOUND (11 codes)         -> unknown_ids_across_every_entity_return_their_own_not_found_error,
      #                                         watershed_get_with_unknown_uuid_returns_watershed_not_found,
      #                                         source_assessment_with_unknown_parent_assessment_returns_not_found
      #   ERR_INVALID_REQUEST                -> unknown_body_field_and_out_of_range_pagination_are_rejected,
      #                                         tmdl_assessment_missing_required_loading_capacity_is_rejected,
      #                                         reach_class_outside_the_declared_enum_is_rejected
      #   ERR_DUPLICATE_CODE                 -> duplicate_watershed_code_is_rejected_while_reach_code_uniqueness_stays_watershed_scoped
      #   ERR_WATERSHED_MISMATCH             -> source_assessment_pointing_at_another_watersheds_reach_is_rejected
      #   ERR_STALE_BATCH_VERSION            -> credit_transaction_proposals_are_rejected_for_year_delivery_balance_gap_and_version_faults
      #   ERR_STALE_TMDL_VERSION             -> stale_expected_tmdl_version_on_an_allocation_run_is_rejected
      #   ERR_INVALID_STATE                  -> withdrawn_tmdl_assessment_rejects_any_further_status_change,
      #                                         revision_target_from_draft_is_rejected_as_invalid_state
      #   ERR_TRADING_SUSPENDED              -> §1.8 trading_suspended_outranks_credit_insufficient_on_transaction_proposal
      #   ERR_BASELINE_NOT_MET               -> baseline_pass_on_a_project_that_fails_the_baseline_is_rejected
      #   ERR_SEGREGATION_OF_DUTIES          -> implementation_event_by_the_baseline_verifier_is_rejected
      #   ERR_PRACTICE_PERIOD_OVERLAP        -> §1.8 practice_period_half_open_adjacency_accepted_and_revoked_project_frees_the_tract
      #   ERR_REVIEW_WINDOW_CONFLICT         -> §1.8 adaptive_review_windows_require_one_clear_day_and_adjacency_is_rejected
      #   ERR_REPORTING_YEAR_MISMATCH        -> credit_transaction_proposals_are_rejected_for_year_delivery_balance_gap_and_version_faults
      #   ERR_ZONE_NOT_ELIGIBLE              -> credit_transaction_to_an_upstream_permit_is_rejected_as_zone_not_eligible
      #   ERR_TMDL_NOT_APPROVED              -> §1.8 permit_finalization_gated_on_tmdl_approval_then_tightened_limit_flips_compliance
      #   ERR_PROJECT_NOT_CERTIFIED          -> §1.8 batch_listing_blocked_while_generating_project_sits_in_pending_reverification
      #   ERR_WLA_NOT_ALLOCATED              -> derive_limits_before_any_allocation_run_is_rejected
      #   ERR_LIMITS_NOT_DERIVED             -> derive_limits_before_any_allocation_run_is_rejected
      #   ERR_ALLOCATION_RUN_IN_USE          -> rescinding_an_allocation_run_relied_on_by_a_derived_permit_is_rejected
      #   ERR_BATCH_HAS_OPEN_TRANSACTIONS    -> retiring_a_batch_with_an_open_proposed_transaction_is_rejected
      #   ERR_NO_INCLUDED_SOURCES            -> allocation_run_with_only_excluded_sources_is_rejected
      #   ERR_SOURCE_NOT_POINT               -> permit_on_a_nonpoint_source_assessment_is_rejected
      #   ERR_ALLOCABLE_LOAD_NEGATIVE        -> §1.8 allocable_load_exactly_zero_accepted_but_one_cent_negative_rejected
      #   ERR_CREDIT_INSUFFICIENT            -> credit_transaction_proposals_are_rejected_for_year_delivery_balance_gap_and_version_faults
      #   ERR_NO_COMPLIANCE_GAP              -> credit_transaction_proposals_are_rejected_for_year_delivery_balance_gap_and_version_faults
      #   ERR_DELIVERY_BELOW_MINIMUM         -> credit_transaction_proposals_are_rejected_for_year_delivery_balance_gap_and_version_faults
      - name: unknown_ids_across_every_entity_return_their_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - validations[priority=3]
          - errors[ERR_REACH_NOT_FOUND]
          - errors[ERR_SOURCE_ASSESSMENT_NOT_FOUND]
          - errors[ERR_ALLOCATION_RUN_NOT_FOUND]
          - errors[ERR_PERMIT_NOT_FOUND]
          - errors[ERR_PRODUCER_NOT_FOUND]
          - errors[ERR_PRACTICE_PROJECT_NOT_FOUND]
          - errors[ERR_CREDIT_BATCH_NOT_FOUND]
          - errors[ERR_CREDIT_TRANSACTION_NOT_FOUND]
          - errors[ERR_ADAPTIVE_REVIEW_NOT_FOUND]
          - errors[ERR_MONITORING_SAMPLE_NOT_FOUND]
        distinguishing_aspect: "Each entity has its own 404 code rather than a shared generic one, so a well-formed but unknown UUID on each single-resource read must name that entity's own error id."
        test_recipe:
          setup:
            - "Empty database; the ids below are well-formed version-4 UUIDs that match no row."
          setup_api_calls: []
          trigger:
            - call: "GET /reaches/00000000-0000-4000-8000-000000000001"
              as: TmdlAnalyst
              captures: { err_reach: $.data.error_id }
            - call: "GET /source-assessments/00000000-0000-4000-8000-000000000002"
              as: TmdlAnalyst
              captures: { err_source: $.data.error_id }
            - call: "GET /allocation-runs/00000000-0000-4000-8000-000000000003"
              as: TmdlAnalyst
              captures: { err_run: $.data.error_id }
            - call: "GET /permits/00000000-0000-4000-8000-000000000004"
              as: PermitWriter
              captures: { err_permit: $.data.error_id }
            - call: "GET /producers/00000000-0000-4000-8000-000000000005"
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { err_producer: $.data.error_id }
            - call: "GET /practice-projects/00000000-0000-4000-8000-000000000006"
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { err_project: $.data.error_id }
            - call: "GET /credit-batches/00000000-0000-4000-8000-000000000007"
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { err_batch: $.data.error_id }
            - call: "GET /credit-transactions/00000000-0000-4000-8000-000000000008"
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { err_txn: $.data.error_id }
            - call: "GET /adaptive-reviews/00000000-0000-4000-8000-000000000009"
              as: ProgramAdministrator
              captures: { err_review: $.data.error_id }
            - call: "GET /tmdl-assessments/00000000-0000-4000-8000-00000000000a"
              as: TmdlAnalyst
              captures: { err_tmdl: $.data.error_id }
            - call: "GET /monitoring-samples/00000000-0000-4000-8000-00000000000b"
              as: TmdlAnalyst
              captures: { err_sample: $.data.error_id }
          assert:
            - "every trigger call responds 404 with response_type == \"error\""
            - "trigger call 1 data.error_id == \"ERR_REACH_NOT_FOUND\""
            - "trigger call 2 data.error_id == \"ERR_SOURCE_ASSESSMENT_NOT_FOUND\""
            - "trigger call 3 data.error_id == \"ERR_ALLOCATION_RUN_NOT_FOUND\""
            - "trigger call 4 data.error_id == \"ERR_PERMIT_NOT_FOUND\""
            - "trigger call 5 data.error_id == \"ERR_PRODUCER_NOT_FOUND\""
            - "trigger call 6 data.error_id == \"ERR_PRACTICE_PROJECT_NOT_FOUND\""
            - "trigger call 7 data.error_id == \"ERR_CREDIT_BATCH_NOT_FOUND\""
            - "trigger call 8 data.error_id == \"ERR_CREDIT_TRANSACTION_NOT_FOUND\""
            - "trigger call 9 data.error_id == \"ERR_ADAPTIVE_REVIEW_NOT_FOUND\""
            - "trigger call 10 data.error_id == \"ERR_TMDL_ASSESSMENT_NOT_FOUND\""
            - "trigger call 11 data.error_id == \"ERR_MONITORING_SAMPLE_NOT_FOUND\""
            - "every error response carries data.message as a non-empty string"

      - name: error_envelope_carries_the_error_id_and_message_with_request_metadata
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_WATERSHED_NOT_FOUND]
        distinguishing_aspect: "Failures use the same envelope as successes: response_type \"error\", a data object holding error_id and message, and the meta block with api_request_id and api_request_timestamp — the error_id is never nested any deeper and never replaced by an HTTP-only signal."
        test_recipe:
          setup:
            - "Empty database, so both a shape failure and a lookup failure are reachable without fixtures."
          setup_api_calls: []
          trigger:
            - call: "POST /watersheds"
              payload: { name: "No Codes Watershed", state_code: "OH", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1"] }
              as: ProgramAdministrator
              captures: { err_shape: $.data.error_id, msg_shape: $.data.message }
            - call: "GET /watersheds/00000000-0000-4000-8000-0000000000ff"
              as: ProgramAdministrator
              captures: { err_missing: $.data.error_id, msg_missing: $.data.message }
          assert:
            - "trigger call 1 responds 422 with response_type == \"error\" and data.error_id == \"ERR_INVALID_REQUEST\" (watershed_code omitted)"
            - "trigger call 1 data.message is a non-empty string and the response has no field outside {response_type, data, meta}"
            - "trigger call 2 responds 404 with response_type == \"error\" and data.error_id == \"ERR_WATERSHED_NOT_FOUND\""
            - "both responses carry meta.api_request_id and meta.api_request_timestamp"
            - "neither response carries a pagination meta block"

  - section: rbac
    instances:
      - name: exclusive_operations_are_refused_to_every_other_role
        claim_type: role_denial
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles
        distinguishing_aspect: "Priority 2 runs before every existence check, so a denied role gets 403 ERR_FORBIDDEN_ROLE even when the path id does not exist at all — the five exclusive operation families are each probed with a plausible but unauthorised role."
        test_recipe:
          setup:
            - "No rows are required: the role check precedes the priority 3 existence check."
          setup_api_calls: []
          trigger:
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1"] }
              as: TmdlAnalyst
              captures: { err_1: $.data.error_id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "00000000-0000-4000-8000-000000000001", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: ProgramAdministrator
              captures: { err_2: $.data.error_id }
            - call: "POST /permits/00000000-0000-4000-8000-000000000002/derive-limits"
              payload: {}
              as: ProgramAdministrator
              captures: { err_3: $.data.error_id }
            - call: "POST /verification-events"
              payload: { practice_project_id: "00000000-0000-4000-8000-000000000003", event_type: "BASELINE", outcome: "PASS", narrative: "Registry staff attempting a field inspection." }
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { err_4: $.data.error_id }
            - call: "POST /credit-batches/00000000-0000-4000-8000-000000000004/list"
              payload: {}
              as: ProgramAdministrator
              captures: { err_5: $.data.error_id }
            - call: "POST /permits/00000000-0000-4000-8000-000000000002/annual-report"
              payload: { reported_annual_load_lbs: 25000.00, reporting_period_year: 2026 }
              as: PermitWriter
              as_user_id: "permit-writer-1"
              captures: { err_6: $.data.error_id }
            - call: "POST /watersheds/00000000-0000-4000-8000-000000000001/adaptive-reviews"
              payload: { review_label: "AR-1", period_start_date: "2026-01-01", period_end_date: "2026-06-30" }
              as: TmdlAnalyst
              captures: { err_7: $.data.error_id }
          assert:
            - "every trigger call responds 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "no call returns 404 even though every referenced id is unknown (priority 2 precedes priority 3)"
            - "trigger call 6 returns 403 ERR_FORBIDDEN_ROLE rather than the 403 ERR_NOT_RESOURCE_OWNER of priority 5: the role gate fires first"

      - name: shared_operations_succeed_for_each_of_their_authorised_roles
        claim_type: role_permissions
        grounds:
          - roles.ProgramAdministrator.shared_operations
          - roles.TmdlAnalyst.shared_operations
          - roles.RegistryAdministrator.shared_operations
        distinguishing_aspect: "Shared writes are genuinely shared: reaches accept both ProgramAdministrator and TmdlAnalyst, producers accept both ProgramAdministrator and RegistryAdministrator, and the logical clock accepts all seven roles."
        test_recipe:
          setup:
            - "Watershed SCR exists as the parent for the shared reach writes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_A", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: ProgramAdministrator
              captures: { r_a_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_B", trading_zone_code: "Z1", reach_class: "HEADWATER", delivery_factor: 0.8000, downstream_reach_id: "${r_a_id}" }
              as: TmdlAnalyst
              captures: { r_b_id: $.data.id }
            - call: "POST /monitoring-samples"
              payload: { reach_id: "${r_a_id}", sample_datetime: "2026-04-01T12:00:00Z", measured_conc_mg_l: 0.0500, flow_cfs: 1000 }
              as: ProgramAdministrator
              captures: { ms_pa_id: $.data.id }
            - call: "POST /monitoring-samples"
              payload: { reach_id: "${r_a_id}", sample_datetime: "2026-04-02T12:00:00Z", measured_conc_mg_l: 0.0250, flow_cfs: 100 }
              as: TmdlAnalyst
              captures: { ms_ta_id: $.data.id }
            - call: "POST /producers"
              payload: { legal_name: "Bluegrass Farms LLC", county_code: "OH-041", contact_email: "ops@bluegrass.example" }
              as: ProgramAdministrator
              captures: { prod_pa_id: $.data.id }
            - call: "POST /producers"
              payload: { legal_name: "Riverbend Acres LLC", county_code: "OH-049", contact_email: "ops@riverbend.example" }
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { prod_ra_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-16T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_pa_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-17T00:00:00Z" }
              as: PracticeVerifier
              as_user_id: "verifier-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-18T00:00:00Z" }
              as: Permittee
              as_user_id: "user-permittee-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-19T00:00:00Z" }
              as: PermitWriter
              as_user_id: "permit-writer-1"
          assert:
            - "trigger calls 1 and 2 both respond 201; GET /reaches?watershed_id=${w_id} returns meta.total_count == 2"
            - "trigger call 3 responds 201 with data.computed_load_lbs_yr == 98422.25"
            - "trigger call 4 responds 201 with data.computed_load_lbs_yr == 4921.11"
            - "trigger calls 5 and 6 both respond 201 with distinct ids"
            - "trigger calls 7 through 10 each respond 200 with data.current_utc equal to the value sent (the clock is shared by all seven roles)"
            - "the final clock value is 2026-06-19T00:00:00Z"

      - name: read_scopes_are_partitioned_and_out_of_scope_reads_are_forbidden
        claim_type: role_denial
        grounds:
          - roles.TmdlAnalyst.shared_operations
          - roles.Producer.shared_operations
          - roles.PermitWriter.shared_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "GET access is not uniform: the analyst is walled out of the credit registry, the producer and verifier are walled out of permits and transactions, and the permit writer is walled out of the practice-project side — each denial is 403, not an empty list."
        test_recipe:
          setup:
            - "No rows are required: the role check precedes existence and returns before any data is read."
          setup_api_calls: []
          trigger:
            - call: "GET /credit-batches"
              as: TmdlAnalyst
              captures: { err_1: $.data.error_id }
            - call: "GET /credit-transactions"
              as: TmdlAnalyst
              captures: { err_2: $.data.error_id }
            - call: "GET /permits"
              as: Producer
              as_user_id: "00000000-0000-4000-8000-0000000000c1"
              captures: { err_3: $.data.error_id }
            - call: "GET /credit-transactions"
              as: PracticeVerifier
              as_user_id: "verifier-1"
              captures: { err_4: $.data.error_id }
            - call: "GET /practice-projects"
              as: PermitWriter
              as_user_id: "permit-writer-1"
              captures: { err_5: $.data.error_id }
            - call: "GET /verification-events"
              as: PermitWriter
              as_user_id: "permit-writer-1"
              captures: { err_6: $.data.error_id }
          assert:
            - "every trigger call responds 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "no call responds 200 with an empty data array (the denial is a role failure, not a filtered read)"

  - section: cross_cutting_layers
    instances:
      - name: stale_expected_tmdl_version_on_an_allocation_run_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-run-create-stale-tmdl]
          - validations[priority=10]
          - errors[ERR_STALE_TMDL_VERSION]
        distinguishing_aspect: "The first run bumps TmdlAssessment.version, so replaying the version captured at creation is refused 412 ERR_STALE_TMDL_VERSION; re-reading the parent and resending its current version succeeds, and the refused call leaves the version untouched."
        test_recipe:
          setup:
            - "Watershed SCR with a compliance-point reach R_OUT."
            - "TMDL-P-2026 is DRAFT with one INVENTORIED POINT source; its version at creation was captured before any run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_id: $.data.id, t_ver1: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_out_id}", source_name: "Village WWTP", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_p_id: $.data.id }
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-1", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver1}" }
              as: TmdlAnalyst
              captures: { run_1_id: $.data.id }
          trigger:
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-2", method: "CONTROLLABILITY_WEIGHTED", expected_tmdl_assessment_version: "${t_ver1}" }
              as: TmdlAnalyst
              captures: { err_stale: $.data.error_id }
            - call: "GET /tmdl-assessments/${t_id}"
              as: TmdlAnalyst
              captures: { t_ver2: $.data.version }
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-2", method: "CONTROLLABILITY_WEIGHTED", expected_tmdl_assessment_version: "${t_ver2}" }
              as: TmdlAnalyst
              captures: { run_2_id: $.data.id }
          assert:
            - "trigger call 1 responds 412 with data.error_id == \"ERR_STALE_TMDL_VERSION\""
            - "after trigger call 1, GET /allocation-runs?tmdl_assessment_id=${t_id} returns meta.total_count == 1 and GET /allocation-runs/${run_1_id} returns data.status == \"ACTIVE\""
            - "trigger call 2 returns ${t_ver2} strictly greater than ${t_ver1} (the accepted first run bumped the parent version; the refused call did not)"
            - "trigger call 3 responds 201 with data.status == \"ACTIVE\" and data.variant == \"PROVISIONAL\""
            - "after trigger call 3, GET /allocation-runs/${run_1_id} returns data.status == \"SUPERSEDED\""
            - "GET /source-assessments/${sa_p_id} returns data.allocation_run_id == ${run_2_id}"

      - name: credit_batch_version_advances_on_every_registry_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[credit-transaction-create-stale-batch]
          - entities.CreditBatch.fields.version
        distinguishing_aspect: "The OCC field guarded by expected_credit_batch_version moves on every registry write to the batch — certification, listing and retirement each bump it by exactly one — which is what makes a version captured one step earlier stale."
        test_recipe:
          setup:
            - "Watershed SCR is ACTIVE via APPROVED TMDL-P-2026 (reserve pool 2400.00 from the PRO_RATA run)."
            - "PracticeProject PP-A on tract T-101 (reach R_UP) is IMPLEMENTED with verified_acres 80.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_mid_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_UP", trading_zone_code: "Z1", reach_class: "HEADWATER", delivery_factor: 0.8000, downstream_reach_id: "${r_mid_id}" }
              as: TmdlAnalyst
              captures: { r_up_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_id: $.data.id, t_ver1: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_mid_id}", source_name: "City WWTP", source_type: "POINT", existing_load_lbs_yr: 20000.00, controllability_index: 0.8000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Cropland", source_type: "NONPOINT", existing_load_lbs_yr: 30000.00, controllability_index: 0.4000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-1", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver1}" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "PUBLIC_COMMENT" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "APPROVED" }
              as: ProgramAdministrator
            - call: "POST /producers"
              payload: { legal_name: "Bluegrass Farms LLC", county_code: "OH-041", contact_email: "ops@bluegrass.example" }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /practice-projects"
              payload: { producer_id: "${prod_id}", reach_id: "${r_up_id}", tract_code: "T-101", practice_type: "COVER_CROP", enrolled_acres: 100.00, baseline_met: true, pre_load_lbs_yr: 950.50, post_load_lbs_yr: 300.00, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", vintage_year: 2026 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pp_a_id: $.data.id }
            - call: "POST /verification-events"
              payload: { practice_project_id: "${pp_a_id}", event_type: "BASELINE", outcome: "PASS", narrative: "Baseline soil sampling complete on tract T-101." }
              as: PracticeVerifier
              as_user_id: "verifier-1"
            - call: "POST /verification-events"
              payload: { practice_project_id: "${pp_a_id}", event_type: "IMPLEMENTATION", outcome: "PASS", narrative: "Cover crop stand confirmed on 80 acres.", verified_acres: 80.00 }
              as: PracticeVerifier
              as_user_id: "verifier-2"
          trigger:
            - call: "POST /practice-projects/${pp_a_id}/certify"
              payload: {}
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { batch_a_id: $.data.id, batch_ver_issue: $.data.version }
            - call: "POST /credit-batches/${batch_a_id}/list"
              payload: {}
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { batch_ver_list: $.data.version }
            - call: "POST /credit-batches/${batch_a_id}/retire"
              payload: { retire_lbs: 20.00, reason: "Reserve-pool contribution." }
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { batch_ver_retire: $.data.version }
            - call: "GET /credit-batches/${batch_a_id}"
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { batch_ver_read: $.data.version }
          assert:
            - "trigger call 1 responds 201 with ${batch_ver_issue} == 1"
            - "trigger call 2 responds 200 with ${batch_ver_list} == 2 and data.status == \"LISTED\""
            - "trigger call 3 responds 200 with ${batch_ver_retire} == 3, data.available_lbs == 500.00 and data.retired_lbs == 20.00"
            - "trigger call 4 returns ${batch_ver_read} == 3 (the read does not bump the version)"
            - "GET /watersheds/${w_id} returns data.reserve_pool_lbs == 2420.00"

      - name: adaptive_hold_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - endpoints[POST /adaptive-reviews/{adaptive_review_id}/finalize]
        distinguishing_aspect: "One finalize call must traverse four levels of dependents in a fixed order, and every level's post-cascade numbers have to be asserted, not just the top-level status."
        excluded_because:
          difficulty_instance: adaptive_review_off_track_cascade_watershed_to_transaction_to_batch_and_permit
          rationale: "That §1.8 instance pins the whole four-level chain from a single OFF_TRACK finalization, including the voided transaction count, the released batch balances and the restored permit gap."

      - name: reverification_cascade_ordering_is_sensitive_to_dependent_state
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.PracticeProject.PENDING_REVERIFICATION_to_REVOKED
        distinguishing_aspect: "The second cascade root runs in the opposite direction — project first, then batch, then transactions, then permits — and skipping the intermediate batch invalidation would leave the permit ledger overstated."
        excluded_because:
          difficulty_instance: reverification_fail_cascade_project_to_batch_to_transaction_to_permit_violation
          rationale: "That §1.8 instance asserts each hop of the reverification cascade in order, ending at the permit's restored gap and raised enforcement_flag."

      - name: both_delivery_variants_produce_their_own_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.credit_transaction_delivery.variants
        distinguishing_aspect: "The proposed variant ignores verified_ratio while the settled variant applies it, so the same transaction carries two different delivered quantities across its life."
        excluded_because:
          difficulty_instance: credit_delivery_proposed_vs_settled_variant_divergence
          rationale: "That §1.8 instance pins proposed_delivered_lbs 202.50 against settled_delivered_lbs 151.88 on one transaction and asserts the delta applied to the permit."

      - name: reduction_percentage_tier_boundaries_are_tested_from_both_sides
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.permit_effluent_limit_derivation.constants
        distinguishing_aspect: "The 20.0 and 50.0 percent tier thresholds are cumulative-rate boundaries, so each must be probed on both sides to prove the comparison is not off by one tier."
        excluded_because:
          difficulty_instance: permit_limit_tier_relief_pinned_evaluation_order_across_three_tiers
          rationale: "That §1.8 instance lands one permit in each tier at reductions 8.80, 27.04 and 90.88 and asserts the relief fraction and schedule length each threshold selects."

      - name: interim_target_threshold_decides_the_watershed_verdict
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.watershed_response_evaluation
          - entities.Watershed.fields.interim_target_pct
        distinguishing_aspect: "achieved_reduction_pct is compared against the watershed's own interim_target_pct, so the same observed load can be ON_TRACK in one watershed and OFF_TRACK in another."
        excluded_because:
          difficulty_instance: adaptive_review_off_track_cascade_watershed_to_transaction_to_batch_and_permit
          rationale: "That §1.8 instance evaluates a review at achieved 19.89 against the 25.00 interim target and asserts the OFF_TRACK verdict that trips the cascade."

  - section: consistency_model
    instances:
      - name: allocation_run_write_is_immediately_visible_in_every_dependent_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.wasteload_allocation_run
          - entities.Watershed.fields.allocated_wla_total_lbs_yr
        distinguishing_aspect: "The allocation run touches four row families in one request, and under an immediate consistency model the run response, the source assessments, the parent assessment roll-ups and the watershed totals must all agree the moment the call returns — no re-read delay, no lagging denormalised field."
        test_recipe:
          setup:
            - "Watershed SCR with reaches R_OUT, R_MID and R_UP and TMDL-P-2026 in DRAFT carrying four INVENTORIED sources."
          setup_api_calls:
