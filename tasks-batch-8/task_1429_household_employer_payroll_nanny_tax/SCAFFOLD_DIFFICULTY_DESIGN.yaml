  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: timesheet_reject_resubmit_cycle
        grounds:
          - state_machines.Timesheet.SUBMITTED_to_DRAFT
          - state_machines.Timesheet.DRAFT_to_SUBMITTED
          - state_machines.Timesheet.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Cycle on the Timesheet entity: SUBMITTED -> DRAFT (reject) ->
          SUBMITTED -> APPROVED; a reject attempted from APPROVED is rejected
          with ERR_INVALID_STATE, proving the loop is closed after approval.
        test_recipe:
          setup:
            - "Employer AA (only NEW_HIRE registration needed), worker EMPLOYEE ACTIVE with agreement (3000/h, guarantee 2400)"
            - "Timesheet 2026-02-02..2026-02-09 (one entry: 2026-02-02, 480 minutes) in DRAFT"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam T", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Tim Taylor", ssn: "123456789", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-02-02", period_end: "2026-02-09", entries: [ { work_date: "2026-02-02", worked_minutes: 480 } ] }, as: Worker, as_user_id: "${w_id}", captures: { ts_id: "$.data.id" } }
            - { call: "POST /household-payroll/timesheets/${ts_id}/submit", as: Worker, as_user_id: "${w_id}" }
          trigger:
            - { call: "POST /household-payroll/timesheets/${ts_id}/reject", as: HouseholdClient, as_user_id: "${e_id}", captures: { st_after_reject: "$.data.status" } }
            - { call: "POST /household-payroll/timesheets/${ts_id}/submit", as: Worker, as_user_id: "${w_id}", captures: { st_after_resubmit: "$.data.status" } }
            - { call: "POST /household-payroll/timesheets/${ts_id}/approve", as: HouseholdClient, as_user_id: "${e_id}", captures: { st_after_approve: "$.data.status" } }
            - { call: "POST /household-payroll/timesheets/${ts_id}/reject", as: HouseholdClient, as_user_id: "${e_id}", captures: { err_reject_approved: "$.data.error_id" } }
          assert:
            - "Timesheet status after reject == DRAFT (cycle back)"
            - "Timesheet status after re-submit == SUBMITTED"
            - "Timesheet status after approve == APPROVED and worker.ytd_approved_minutes == 480"
            - "Reject from APPROVED fails with ERR_INVALID_STATE"
      - name: quarterly_filing_reject_reprepare_cycle
        grounds:
          - state_machines.QuarterlyFiling.SUBMITTED_to_REJECTED
          - state_machines.QuarterlyFiling.REJECTED_to_PREPARED
          - state_machines.QuarterlyFiling.PREPARED_to_SUBMITTED
        distinguishing_aspect: |
          Cycle on the QuarterlyFiling entity (different entity from the
          timesheet instance): PREPARED -> SUBMITTED -> REJECTED -> PREPARED
          -> SUBMITTED -> ACCEPTED, with amounts deterministically recomputed
          on the second prepare and prepared_by re-stamped.
        test_recipe:
          setup:
            - "Employer AA exists (no workers needed); logical clock default 2026-08-01 is past Q1 2026 close"
            - "QuarterlyFiling for (2026, Q1) created (OPEN)"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Q", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /household-payroll/employers/${e_id}/quarterly-filings", payload: { tax_year: 2026, quarter: 1 }, as: PayrollAdmin, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "POST /household-payroll/quarterly-filings/${f_id}/prepare", as: PayrollAdmin, as_user_id: "admin-1", captures: { st1: "$.data.status", futa1: "$.data.futa_due_cents", prep1: "$.data.prepared_by_user_id" } }
            - { call: "POST /household-payroll/quarterly-filings/${f_id}/submit", as: ComplianceOfficer, as_user_id: "officer-1", captures: { st2: "$.data.status" } }
            - { call: "POST /household-payroll/quarterly-filings/${f_id}/reject", as: ComplianceOfficer, as_user_id: "officer-1", captures: { st3: "$.data.status" } }
            - { call: "POST /household-payroll/quarterly-filings/${f_id}/prepare", as: PayrollAdmin, as_user_id: "admin-2", captures: { st4: "$.data.status", futa2: "$.data.futa_due_cents", prep2: "$.data.prepared_by_user_id" } }
            - { call: "POST /household-payroll/quarterly-filings/${f_id}/submit", as: ComplianceOfficer, as_user_id: "officer-1", captures: { st5: "$.data.status" } }
            - { call: "POST /household-payroll/quarterly-filings/${f_id}/accept", as: ComplianceOfficer, as_user_id: "officer-1", captures: { st6: "$.data.status" } }
          assert:
            - "status sequence == PREPARED, SUBMITTED, REJECTED, PREPARED, SUBMITTED, ACCEPTED"
            - "QuarterlyFiling.futa_due_cents == 0 on both prepares (ledger unchanged; deterministic recompute)"
            - "QuarterlyFiling.prepared_by_user_id == admin-1 after first prepare and == admin-2 after re-prepare"
            - "QuarterlyFiling.total_cash_wages_cents == 0 and futa_applies == false"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: timesheet_approval_cascade_stales_payrun
        grounds:
          - state_machines.Timesheet.SUBMITTED_to_APPROVED
          - entities.PayRun.fields.recalc_status
          - entities.Paycheck.fields.basis_stale
          - errors[ERR_PAYRUN_STALE]
        distinguishing_aspect: |
          Depth-4 chain triggered by timesheet APPROVAL: timesheet ->
          DomesticWorker YTD/leave fields mutate -> containing PayRun flips
          recalc_status STALE -> its CALCULATED paychecks flip basis_stale;
          the stale pay run then refuses finalize with ERR_PAYRUN_STALE.
        test_recipe:
          setup:
            - "Employer AA, worker ACTIVE (3000/h, guarantee 2400), pay run 2026-01-05..2026-01-12 CALCULATED with a GUARANTEE_FALLBACK paycheck (no timesheet yet)"
            - "Timesheet for the same period (5 x 540) created and SUBMITTED after the calculation"
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam S", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", prior_year_schedule_h_cents: 0 }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Sara Sitters", ssn: "123456789", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/employers/${e_id}/pay-runs", payload: { period_start: "2026-01-05", period_end: "2026-01-12", pay_date: "2026-01-12" }, as: PayrollAdmin, captures: { pr_id: "$.data.id" } }
            - { call: "POST /household-payroll/pay-runs/${pr_id}/calculate", as: PayrollAdmin }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-01-05", period_end: "2026-01-12", entries: [ { work_date: "2026-01-05", worked_minutes: 540 }, { work_date: "2026-01-06", worked_minutes: 540 }, { work_date: "2026-01-07", worked_minutes: 540 }, { work_date: "2026-01-08", worked_minutes: 540 }, { work_date: "2026-01-09", worked_minutes: 540 } ] }, as: Worker, as_user_id: "${w_id}", captures: { ts_id: "$.data.id" } }
            - { call: "POST /household-payroll/timesheets/${ts_id}/submit", as: Worker, as_user_id: "${w_id}" }
          trigger:
            - { call: "POST /household-payroll/timesheets/${ts_id}/approve", as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "GET /household-payroll/workers/${w_id}", as: PayrollAdmin, captures: { w_ytd: "$.data.ytd_approved_minutes", w_leave: "$.data.accrued_leave_minutes" } }
            - { call: "GET /household-payroll/pay-runs/${pr_id}", as: PayrollAdmin, captures: { pr_recalc: "$.data.recalc_status" } }
            - { call: "GET /household-payroll/pay-runs/${pr_id}/paychecks", as: PayrollAdmin, captures: { pc_stale: "$.data[0].basis_stale", pc_basis: "$.data[0].basis" } }
            - { call: "POST /household-payroll/pay-runs/${pr_id}/finalize", as: PayrollAdmin, captures: { err_fin: "$.data.error_id" } }
          assert:
            - "DomesticWorker.${w_id}.ytd_approved_minutes == 2700 (link 1: approval mutated the worker)"
            - "DomesticWorker.${w_id}.accrued_leave_minutes == 90 (floor(2700/30))"
            - "PayRun.${pr_id}.recalc_status == STALE (link 2: worker mutation staled the CALCULATED run)"
            - "Paycheck.basis_stale == true and basis == GUARANTEE_FALLBACK (link 3: stale flag propagated to member paycheck)"
