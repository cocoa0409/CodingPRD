scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: service_hour_calc_actual_vs_fixed_on_application
        grounds:
          - calculations.service_hour_calc
          - entities.Application.fields.credited_hours
          - entities.Activity.fields.hour_rule_type
          - entities.Activity.fields.fixed_hour_value
        distinguishing_aspect: |
          Two valid hour-credit interpretations operate on the Application entity domain:
          ACTUAL_DURATION reads (check_out_at - check_in_at) and credits the elapsed time,
          while FIXED_VALUE reads Activity.fixed_hour_value and ignores actual duration entirely;
          a 30-minute attendance produces 0.50 hours under one branch and the full configured
          fixed value under the other.
        test_recipe:
          setup:
            - "create two Activities: A1 hour_rule_type=ACTUAL_DURATION, A2 hour_rule_type=FIXED_VALUE with fixed_hour_value=3.50; both EASY difficulty"
            - "approve and run both; each has one APPROVED Volunteer (verified, no sensitive clearance needed)"
            - "advance clock so each Activity is RUNNING"
            - "for each Application: check-in at activity start_at, check-out 30 minutes after start_at"
          trigger:
            - "POST /applications/{a1_app}/check-in then POST /applications/{a1_app}/check-out"
            - "POST /applications/{a2_app}/check-in then POST /applications/{a2_app}/check-out"
          assert:
            - "Application(A1).credited_hours == 0.50"
            - "Application(A2).credited_hours == 3.50"
            - "Application(A1).adjusted_hours == 0.50 AND Application(A2).adjusted_hours == 3.50"

      - name: point_earn_calc_completion_vs_adjustment_on_volunteer_balance
        grounds:
          - calculations.point_earn_calc
          - state_machines.HourAdjustment.PENDING_to_APPROVED
          - entities.Volunteer.fields.points_balance
        distinguishing_aspect: |
          The point_earn_calc operates on the Volunteer entity domain (points_balance) with two
          divergent algorithms: the completion_award variant adds the FULL freshly-computed points
          to Volunteer.points_balance, while the adjustment_recompute variant adds only the DELTA
          between new and old points_awarded — applying the full new points on the second path
          would double-count.
        test_recipe:
          setup:
            - "Volunteer V (verified); Activity A: ACTUAL_DURATION, MEDIUM difficulty, ActivityRole label=LEAD"
            - "approve activity, clock to RUNNING; Volunteer applies, gets approved with role LEAD"
            - "check-in at start_at (10:00), check-out at start_at + 2 hours (12:00) → adjusted_hours=2.00, points_awarded=36, Volunteer.points_balance=36"
            - "Organizer files HourAdjustment with delta_hours=+0.50, reason 'extra cleanup'"
          trigger:
            - "POST /hour-adjustments/{id}/approve"
          assert:
            - "Application.adjusted_hours == 2.50"
            - "Application.points_awarded == 45"
            - "Volunteer.points_balance == 45"
            - "Volunteer.total_service_hours == 2.50"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: point_earn_calc_three_factor_with_pinned_rounding_order
        grounds:
          - calculations.point_earn_calc
          - entities.Activity.fields.difficulty
          - entities.ActivityRole.fields.role_label
          - entities.Application.fields.adjusted_hours
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. point_earn_calc fixes the order
          'round base to 2 decimals, then multiply by difficulty_multiplier, then by role_multiplier,
          then floor to integer'. Reordering (e.g., floor-then-multiply, or round-after-multiply)
          produces a different integer; the scaffold pins the canonical order so a 1.13-hour LEAD/MEDIUM
          attendance evaluates to 11.30 → 11.30*1.50*1.20=20.34 → floor 20, not 21.
        test_recipe:
          setup:
            - "Volunteer V (verified); Activity A: ACTUAL_DURATION, MEDIUM, ActivityRole label=LEAD"
            - "approve, clock to RUNNING; Volunteer approved with role LEAD"
            - "check-in at start_at (10:00); check-out at end_at-30min where Activity end_at=start_at+2h (so check_out=11:30); end_at-15min=11:45 so 11:30 triggers early_departure_marker"
            - "raw_hours = (11:30 - 10:00) = 1.50; with early-dep penalty: 1.50 * 0.75 = 1.125; round_half_up to 2dec = 1.13"
          trigger:
            - "POST /applications/{id}/check-out"
          assert:
            - "Application.adjusted_hours == 1.13"
            - "Application.early_departure_marker == true"
            - "Application.points_awarded == 20"
            - "Volunteer.points_balance == 20"

      - name: time_conflict_three_input_overlap_check
        grounds:
          - validations[priority=12]
          - state_machines.Application.APPLIED_to_APPROVED
          - calculations.haversine_distance_km
        distinguishing_aspect: |
          Mode (a) — non-linear interaction across ≥3 inputs. The approval check combines
          (i) Volunteer's set of non-terminal Applications, (ii) interval-overlap against the
          target Activity's [start_at, end_at] using closed-closed semantics where touching
          endpoints DO collide, and (iii) the position-quota strict-less-than check. The conjunction
          produces different outcomes than any single input alone: a volunteer with no clashes but
          a full quota is rejected for ERR_QUOTA_EXCEEDED, while an unfilled quota with an exact
          touching endpoint is rejected for ERR_TIME_CONFLICT — the two error_ids appear at
          different priorities (17 vs 12) so order matters.
        test_recipe:
          setup:
            - "Volunteer V verified; Activity A1 [12:00-14:00] APPROVED & COMPLETED earlier; Activity A2 [14:00-16:00] in RECRUITING"
            - "V already has APPROVED Application on A1 (still in COMPLETED state at test time) — but use a still-running case: A1 just transitioned to RUNNING and V is CHECKED_IN"
            - "V applies to A2; quota is 5, currently filled_positions=0"
          trigger:
            - "POST /applications/{a2_app}/approve as Organizer of A2"
          assert:
            - "response error_id == ERR_TIME_CONFLICT"
            - "Application(A2).status == APPLIED (unchanged)"
            - "Activity(A2).filled_positions == 0"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: activity_rejected_to_draft_revision_cycle
        grounds:
          - state_machines.Activity.UNDER_REVIEW_to_REJECTED
          - state_machines.Activity.REJECTED_to_DRAFT
          - state_machines.Activity.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          Activity exhibits a CYCLIC shape: DRAFT → UNDER_REVIEW → REJECTED → DRAFT → UNDER_REVIEW → PUBLISHED.
          The same row revisits DRAFT after rejection (not a new row), and version increments on each
          revolution; this is structurally distinct from a linear pipeline. The cycle entity is Activity.
        test_recipe:
          setup:
            - "Organizer O creates Activity A in DRAFT (version=1)"
            - "submit → UNDER_REVIEW (version=2); SkillAdmin rejects → REJECTED (version=3)"
          trigger:
            - "POST /activities/{id}/revise as Organizer O"
            - "POST /activities/{id}/submit"
            - "POST /activities/{id}/approve as SkillAdmin"
          assert:
            - "Activity.status == PUBLISHED"
            - "Activity.version == 6"
            - "Activity.id unchanged across the cycle"

      - name: volunteerskill_approved_to_under_review_revision_loop
        grounds:
          - state_machines.VolunteerSkill.APPROVED_to_UNDER_REVIEW
          - state_machines.VolunteerSkill.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          VolunteerSkill exhibits a CYCLE on a different entity from Activity:
          APPROVED → UNDER_REVIEW → APPROVED. The /resubmit transition reverses the
          terminal-looking APPROVED state back into UNDER_REVIEW when the volunteer
          updates their certificate_url, breaking the linear assumption.
        test_recipe:
          setup:
            - "Volunteer V verified; Skill S with requires_certificate=true"
            - "V declares S with cert URL u1, submits, SkillAdmin approves → APPROVED"
          trigger:
            - "POST /volunteer-skills/{id}/resubmit with certificate_url=u2"
            - "POST /volunteer-skills/{id}/approve as SkillAdmin"
          assert:
            - "VolunteerSkill.review_status == APPROVED"
            - "VolunteerSkill.certificate_url == 'u2'"
            - "VolunteerSkill.version >= 4"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: checkout_to_hour_calc_to_points_to_volunteer_balance
        grounds:
          - state_machines.Application.CHECKED_IN_to_COMPLETED
          - calculations.service_hour_calc
          - calculations.point_earn_calc
          - entities.Volunteer.fields.total_service_hours
          - entities.Volunteer.fields.points_balance
          - entities.Volunteer.fields.total_completed_activities
        distinguishing_aspect: |
          Depth-4 cascade triggered by /check-out: (1) Application transitions CHECKED_IN→COMPLETED;
          (2) THAT transition triggers service_hour_calc to populate Application.adjusted_hours;
          (3) THAT updated adjusted_hours triggers point_earn_calc to populate Application.points_awarded;
          (4) THAT new points_awarded triggers Volunteer.points_balance and total_service_hours updates.
          Each link is caused by the previous link's result, not by the original /check-out call.
        test_recipe:
          setup:
            - "Volunteer V verified, points_balance=0, total_service_hours=0, total_completed_activities=0"
            - "Activity A: ACTUAL_DURATION, MEDIUM, ActivityRole=LEAD; approved, RUNNING"
            - "V approved on A with role LEAD; check-in at start_at (10:00)"
          trigger:
            - "POST /applications/{id}/check-out at start_at + 2 hours (12:00)"
          assert:
            - "Application.status == COMPLETED"
            - "Application.credited_hours == 2.00 AND Application.adjusted_hours == 2.00"
            - "Application.points_awarded == 36"
            - "Volunteer.total_service_hours == 2.00"
            - "Volunteer.points_balance == 36"
            - "Volunteer.total_completed_activities == 1"

      - name: hour_adjust_approve_to_application_to_volunteer_to_certificate_eligibility
        grounds:
          - state_machines.HourAdjustment.PENDING_to_APPROVED
          - calculations.point_earn_calc
          - calculations.certificate_eligibility_check
          - entities.Volunteer.fields.total_service_hours
          - entities.Volunteer.fields.points_balance
        distinguishing_aspect: |
          Depth-3 cascade originating from a DIFFERENT trigger (HourAdjustment approval, not check-out):
          (1) HourAdjustment PENDING→APPROVED writes Application.adjusted_hours;
          (2) THAT new adjusted_hours triggers point_earn_calc to recompute Application.points_awarded;
          (3) THAT delta in points_awarded propagates to Volunteer.points_balance, AND the new
          total_service_hours can flip CertificateTemplate eligibility from NOT_ELIGIBLE to ELIGIBLE
          on the next /certificates POST.
        test_recipe:
          setup:
            - "Volunteer V verified, has 1 COMPLETED Application with adjusted_hours=2.00, points_awarded=36 (MEDIUM, LEAD)"
            - "Volunteer.total_service_hours=2.00, points_balance=36, total_completed_activities=1"
            - "CertificateTemplate T: min_hours=2.50, min_completed_activities=1"
            - "Organizer files HourAdjustment with delta=+0.50 on the Application"
          trigger:
            - "POST /hour-adjustments/{id}/approve as SkillAdmin"
            - "POST /certificates with {template_id: T.id, volunteer_id: V.id} as SkillAdmin"
          assert:
            - "Application.adjusted_hours == 2.50 AND Application.points_awarded == 45"
            - "Volunteer.total_service_hours == 2.50 AND Volunteer.points_balance == 45"
            - "Certificate created with status==ISSUED, hours_at_issuance==2.50"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_check_in_proof_vs_activity_state
        grounds:
          - validations[priority=7]
          - validations[priority=22]
        distinguishing_aspect: |
          Pair (state) vs (business_safety/business_constraint). When a Volunteer attempts /check-in
          on an Application whose Activity is still RECRUITING (not RUNNING) AND submits no site_code
          and no GPS, the scaffold pins state-precondition (priority 7, ERR_INVALID_STATE) BEFORE
          check-in proof (priority 22, ERR_CHECK_IN_PROOF_FAILED). The dual-failure scenario must
          return ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Volunteer V verified; Activity A approved but clock has NOT advanced to start_at; A.status==RECRUITING"
            - "V approved on A with no role"
          trigger:
            - "POST /applications/{id}/check-in with no site_code, no check_in_lat/lng (both proofs would fail)"
          assert:
            - "response.status_code == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: business_safety_vs_business_temporal_identity_vs_recruitment_window
        grounds:
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair (business_safety) vs (business_temporal). When an UNVERIFIED Volunteer applies to
          an Activity whose recruitment window is CLOSED (status not RECRUITING), priorities pin
          identity-not-verified (priority 8, ERR_IDENTITY_NOT_VERIFIED) BEFORE recruitment-closed
          (priority 11, ERR_RECRUITMENT_CLOSED). This is a different category pair from the first
          instance (state vs business_safety).
        test_recipe:
          setup:
            - "Volunteer V with identity_verification_status==PENDING"
            - "Activity A approved but clock has advanced past recruit_close_at; A.status==RECRUITING (still) but recruit window closed at clock"
          trigger:
            - "POST /applications with {activity_id: A.id} as Volunteer V"
          assert:
            - "response.status_code == 403"
            - "response.error_id == ERR_IDENTITY_NOT_VERIFIED"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: certificate_min_hours_inclusive_boundary_on_certificates_endpoint
        grounds:
          - calculations.certificate_eligibility_check
          - validations[priority=20]
          - entities.CertificateTemplate.fields.min_hours
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /certificates: the predicate is
          Volunteer.total_service_hours >= CertificateTemplate.min_hours (INCLUSIVE >=, not strict >).
          A volunteer with exactly the threshold hours MUST be eligible; one 0.01 hours below MUST be rejected.
        test_recipe:
          setup:
            - "Volunteer V1 with total_service_hours=2.50, total_completed_activities=1"
            - "Volunteer V2 with total_service_hours=2.49, total_completed_activities=1"
            - "CertificateTemplate T with min_hours=2.50, min_completed_activities=1"
          trigger:
            - "POST /certificates with {template_id: T.id, volunteer_id: V1.id} as SkillAdmin"
            - "POST /certificates with {template_id: T.id, volunteer_id: V2.id} as SkillAdmin"
          assert:
            - "first response: 201 with Certificate.status == ISSUED"
            - "second response: 422 with error_id == ERR_NOT_ELIGIBLE"

      - name: position_quota_strict_less_than_on_application_approve
        grounds:
          - validations[priority=17]
          - state_machines.Application.APPLIED_to_APPROVED
          - entities.Activity.fields.filled_positions
          - entities.Activity.fields.position_quota
        distinguishing_aspect: |
          Boundary on a DIFFERENT metric (filled_positions vs position_quota) reached through a
          DIFFERENT endpoint (POST /applications/{id}/approve). The check is STRICT less-than:
          filled_positions < position_quota. With quota==2 and filled_positions==2, the next
          approval rejects; with filled_positions==1, it succeeds and brings filled_positions to 2.
        test_recipe:
          setup:
            - "Activity A position_quota=2, RECRUITING; two volunteers V1 and V2 already APPROVED so filled_positions=2"
            - "Volunteer V3 (verified, skills match) APPLIED on A"
          trigger:
            - "POST /applications/{v3_app}/approve as Organizer of A"
          assert:
            - "response.status_code == 409"
            - "response.error_id == ERR_QUOTA_EXCEEDED"
            - "Activity.filled_positions == 2 (unchanged)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_check_in_requires_activity_running
        grounds:
          - state_machines.Application.APPROVED_to_CHECKED_IN
          - entities.Activity.fields.status
        distinguishing_aspect: |
          Application→Activity dependency: Application can only transition APPROVED→CHECKED_IN
          when its parent Activity.status == RUNNING. Same Application in same APPROVED state
          rejects when Activity is still RECRUITING (not yet started) or already COMPLETED.
        test_recipe:
          setup:
            - "Volunteer V verified, APPROVED on Activity A with role"
            - "A.status == RECRUITING (clock has NOT advanced to start_at)"
          trigger:
            - "POST /applications/{id}/check-in with site_code matching"
          assert:
            - "response.status_code == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: redemption_fulfill_requires_pointmallitem_active_and_balance_check
        grounds:
          - state_machines.RedemptionOrder.PENDING_to_FULFILLED
          - entities.PointMallItem.fields.status
          - entities.Volunteer.fields.points_balance
        distinguishing_aspect: |
          Different entity pair (RedemptionOrder→PointMallItem and RedemptionOrder→Volunteer):
          fulfillment requires PointMallItem.status == ACTIVE AND Volunteer.points_balance is re-checked
          at fulfillment time (not just at order creation). An ARCHIVED item with stock and points
          available rejects with ERR_INVALID_STATE; an ACTIVE item with balance shortfall rejects with
          ERR_INSUFFICIENT_POINTS.
        test_recipe:
          setup:
            - "PointMallItem I (point_cost=10, stock=5) created ACTIVE"
            - "Volunteer V (points_balance=20) creates RedemptionOrder R for I quantity=1 (total_points=10) → PENDING"
            - "SkillAdmin archives I → I.status==ARCHIVED"
          trigger:
            - "POST /redemption-orders/{R.id}/fulfill as SkillAdmin"
          assert:
            - "response.status_code == 409"
            - "response.error_id == ERR_INVALID_STATE"
            - "Volunteer.points_balance == 20 (unchanged)"
            - "PointMallItem.stock == 5 (unchanged)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: application_volunteer_time_window_closed_closed_overlap
        grounds:
          - validations[priority=12]
          - concurrency_rules[time-conflict]
          - state_machines.Application.APPLIED_to_APPROVED
        distinguishing_aspect: |
          Resource = Volunteer's calendar of non-terminal Applications. Interval semantics =
          CLOSED-CLOSED — touching endpoints (Activity B.start_at == Activity A.end_at) DO conflict.
          A volunteer COMPLETED on Activity A [10:00-12:00] who is then asked to be APPROVED on
          Activity B [12:00-14:00] is rejected with ERR_TIME_CONFLICT because the touching boundary
          counts as overlap.
        test_recipe:
          setup:
            - "Volunteer V verified"
            - "Activity A [start=2026-06-01T10:00Z, end=2026-06-01T12:00Z], V already COMPLETED on A"
            - "Activity B [start=2026-06-01T12:00Z, end=2026-06-01T14:00Z], RECRUITING; V applied → APPLIED"
          trigger:
            - "POST /applications/{vb_app}/approve as Organizer of B"
          assert:
            - "response.status_code == 409"
            - "response.error_id == ERR_TIME_CONFLICT"

      - name: activity_recruitment_window_half_open_at_application_create
        grounds:
          - validations[priority=11]
          - entities.Activity.fields.recruit_open_at
          - entities.Activity.fields.recruit_close_at
        distinguishing_aspect: |
          Resource = Activity's recruitment window. DIFFERENT interval semantics from instance 1:
          HALF-OPEN [recruit_open_at, recruit_close_at) — at exactly recruit_close_at the window is
          CLOSED. A volunteer applying at clock == recruit_close_at gets ERR_RECRUITMENT_CLOSED;
          one applying at clock == recruit_close_at - 1 second succeeds. This is a different resource
          (Activity, not Volunteer) with different boundary semantics (half-open vs closed-closed).
        test_recipe:
          setup:
            - "Activity A: recruit_open_at=2026-06-01T08:00Z, recruit_close_at=2026-06-01T09:00Z, start_at=2026-06-01T10:00Z, RECRUITING"
            - "Volunteer V verified, skills match"
            - "advance clock to exactly 2026-06-01T09:00Z"
          trigger:
            - "POST /applications with {activity_id: A.id} as Volunteer V"
          assert:
            - "response.status_code == 409"
            - "response.error_id == ERR_RECRUITMENT_CLOSED"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: application_withdraw_restores_filled_positions
        grounds:
          - state_machines.Application.APPLIED_to_APPROVED
          - state_machines.Application.APPROVED_to_WITHDRAWN
          - entities.Activity.fields.filled_positions
        distinguishing_aspect: |
          Conserved quantity = Activity.filled_positions (an integer position count). The forward
          action is APPLIED→APPROVED (+1 to filled_positions); its compensating action is
          APPROVED→WITHDRAWN while Activity is RECRUITING (-1 to filled_positions). The invariant
          is: for any sequence of approve/withdraw on a single Activity, after the cycle completes
          Activity.filled_positions == (count of currently-APPROVED|CHECKED_IN|ON_LEAVE|COMPLETED Applications).
          Formally: filled_positions_before == filled_positions_after when the same Application
          is approved-then-withdrawn.
        test_recipe:
          setup:
            - "Activity A position_quota=5, RECRUITING, filled_positions=0"
            - "Volunteer V verified, applied to A (status==APPLIED)"
          trigger:
            - "POST /applications/{id}/approve as Organizer of A"
            - "POST /applications/{id}/withdraw as Volunteer V"
          assert:
            - "Activity.filled_positions == 0"
            - "Application.status == WITHDRAWN"

      - name: hour_adjust_approve_then_compensating_adjust_restores_balances
        grounds:
          - state_machines.HourAdjustment.PENDING_to_APPROVED
          - calculations.point_earn_calc
          - entities.Volunteer.fields.total_service_hours
          - entities.Volunteer.fields.points_balance
        distinguishing_aspect: |
          Different conserved quantities — Volunteer.total_service_hours (decimal hours) AND
          Volunteer.points_balance (integer points). Forward action: approve HourAdjustment with
          delta=+0.50 (hours +0.50, points +9 with MEDIUM/LEAD). Compensating action: approve a
          second HourAdjustment with delta=-0.50 on the same Application. Invariant:
          Volunteer.total_service_hours and Volunteer.points_balance return to their pre-adjustment
          values exactly. This is a different conserved-quantity TYPE (hours+points) from the
          integer-position-count invariant in instance 1.
        test_recipe:
          setup:
            - "Volunteer V verified, has 1 COMPLETED Application (MEDIUM, LEAD) with adjusted_hours=2.00, points_awarded=36"
            - "Volunteer.total_service_hours=2.00, points_balance=36"
          trigger:
            - "Organizer files HourAdjustment HA1 with delta=+0.50; SkillAdmin approves HA1"
            - "Organizer files HourAdjustment HA2 with delta=-0.50; SkillAdmin approves HA2"
          assert:
            - "Application.adjusted_hours == 2.00"
            - "Application.points_awarded == 36"
            - "Volunteer.total_service_hours == 2.00"
            - "Volunteer.points_balance == 36"
