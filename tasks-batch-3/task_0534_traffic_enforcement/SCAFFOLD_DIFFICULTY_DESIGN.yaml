  - rule_id: compensating_invariant
    instances:
      - name: void_conserves_zero_owed_and_no_collection
        grounds:
          - state_machines.Citation.CITED_to_VOID
          - calculations.amount_owed_total
          - entities.Citation.fields.adjudicated_amount_cents
        distinguishing_aspect: |
          Conserved quantity #1 = total collectable owed on the citation. Forward=issue notice (assessed 12500 owed),
          compensating=void → adjudicated_amount_cents:=0 so amount_owed_total==0; the citation contributes nothing
          collectable after its full forward+compensate cycle.
        test_recipe:
          setup:
            - "RED_LIGHT citation CITED (owed 12500), no payment; then voided."
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30, repeat_offender_window_days: 365, repeat_offender_surcharge_pct: 0.5 }
              as: SystemAdmin
