# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1281_public_pension_system_administration
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: purchase_cost_flat_vs_actuarial_same_inputs
        grounds:
          - calculations.service_purchase_cost
          - entities.ServicePurchase.fields.flat_cost_cents
          - entities.ServicePurchase.fields.actuarial_cost_cents
        distinguishing_aspect: |
          Two valid pricing rules produce different quoted costs for identical
          salary and years_purchased on the ServicePurchase domain: a member
          hired within 5 years of the quote date gets FLAT (1,200,000) while a
          member with identical salary/years hired earlier gets ACTUARIAL
          (4,200,000). Companion instance benefit_estimate_provisional_vs_final
          lives on the RetirementApplication/Benefit domain.
        test_recipe:
          setup:
            - "Fund exists; Employer E exists"
            - "Member A: hire_date 2024-06-01 (inside 5-year flat window at clock 2026-08-01), DOB 1980-01-01, one ACCEPTED line FY2023 salary 6,000,000"
            - "Member B: hire_date 2010-01-01 (outside flat window), DOB 1980-01-01, one ACCEPTED line FY2023 salary 6,000,000"
            - "Both members request MILITARY purchase of 2.0 years, period 2005-01-01..2006-12-31 (no credited overlap), both quoted"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Employees Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "Dept of Transport", employer_code: "DOT" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            # Member A (flat window) + credited FY2023 salary 6,000,000
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Flat Winifred", date_of_birth: "1980-01-01", hire_date: "2024-06-01" }
              as: MemberServicesAnalyst
              captures: { m_flat: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep_a: $.data.id }
            - call: "POST /contribution-reports/${rep_a}/lines"
              payload: { member_id: "${m_flat}", fiscal_year: 2023, period_salary_cents: 6000000, contribution_amount_cents: 480000, service_months: 12 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { la: $.data.id }
            - { call: "POST /contribution-reports/${rep_a}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep_a}/lines/${la}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep_a}/finalize", payload: {}, as: MemberServicesAnalyst }
            # Member B (actuarial) + identical FY2023 salary
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Actuarial Alice", date_of_birth: "1980-01-01", hire_date: "2010-01-01" }
              as: MemberServicesAnalyst
              captures: { m_act: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2024-01-01", period_end: "2025-01-01", declared_total_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep_b: $.data.id }
            - call: "POST /contribution-reports/${rep_b}/lines"
              payload: { member_id: "${m_act}", fiscal_year: 2024, period_salary_cents: 6000000, contribution_amount_cents: 480000, service_months: 12 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { lb: $.data.id }
            - { call: "POST /contribution-reports/${rep_b}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep_b}/lines/${lb}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep_b}/finalize", payload: {}, as: MemberServicesAnalyst }
            # Purchases + quotes
            - call: "POST /members/${m_flat}/service-purchases"
              payload: { purchase_type: "MILITARY", service_period_start: "2005-01-01", service_period_end: "2006-12-31", years_purchased: 2.0 }
              as: Member
              as_user_id: "${m_flat}"
              captures: { p_flat: $.data.id }
            - call: "POST /members/${m_act}/service-purchases"
              payload: { purchase_type: "MILITARY", service_period_start: "2005-01-01", service_period_end: "2006-12-31", years_purchased: 2.0 }
              as: Member
              as_user_id: "${m_act}"
              captures: { p_act: $.data.id }
            - { call: "POST /service-purchases/${p_flat}/quote", payload: {}, as: MemberServicesAnalyst }
            - call: "POST /service-purchases/${p_act}/quote"
              payload: {}
              as: MemberServicesAnalyst
              captures: { act_quoted: $.data.quoted_cost_cents }
          trigger:
            - call: "GET /service-purchases/${p_flat}"
              payload: {}
              as: MemberServicesAnalyst
              captures: { flat_quoted: $.data.quoted_cost_cents }
          assert:
            - "ServicePurchase.${p_flat}.flat_cost_cents == 1200000 (0.10 * 6000000 * 2)"
            - "ServicePurchase.${p_flat}.actuarial_cost_cents == 4200000 (6000000 * 2 * 0.35, age 46 -> 14 years to 60)"
            - "ServicePurchase.${p_flat}.cost_variant == FLAT and quoted_cost_cents == 1200000"
            - "ServicePurchase.${p_act}.cost_variant == ACTUARIAL and quoted_cost_cents == 4200000"
            - "Both purchases expose BOTH variant costs with identical salary/years inputs, and quoted costs differ (1200000 != 4200000)"

      - name: benefit_estimate_provisional_vs_final
        grounds:
          - calculations.benefit_estimate
          - calculations.final_average_salary
          - entities.RetirementApplication.fields.provisional_monthly_cents
        distinguishing_aspect: |
          Same member data, two valid input-set rules on the RetirementApplication
          estimate domain: PROVISIONAL includes the FY2024 PENDING line (FAS
          6,000,000, service 7.0, monthly 59,500) while FINAL counts ACCEPTED
          lines only (FAS 5,500,000, service 6.0, monthly 46,750). Companion
          instance lives on the ServicePurchase domain.
        test_recipe:
          setup:
            - "Fund, Employer E, Member hired 2016-01-01 DOB 1966-01-01"
            - "Report R1 (2018-01-01..2024-01-01) with 6 ACCEPTED lines FY2018-2023, salaries 3,500,000/4,000,000/4,500,000/5,000,000/5,500,000/6,000,000, RECONCILED"
            - "Report R2 (2024-01-01..2025-01-01) with one FY2024 line salary 6,500,000, SUBMITTED, line left PENDING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "Municipal Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Water", employer_code: "CW" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Estimate Erin", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2018-01-01", period_end: "2024-01-01", declared_total_cents: 2280000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2018, period_salary_cents: 3500000, contribution_amount_cents: 280000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l18: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2019, period_salary_cents: 4000000, contribution_amount_cents: 320000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l19: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2020, period_salary_cents: 4500000, contribution_amount_cents: 360000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l20: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2021, period_salary_cents: 5000000, contribution_amount_cents: 400000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l21: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2022, period_salary_cents: 5500000, contribution_amount_cents: 440000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l22: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 6000000, contribution_amount_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l23: $.data.id }
            - { call: "POST /contribution-reports/${rep1}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines/${l18}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${l19}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${l20}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${l21}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${l22}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${l23}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/finalize", payload: {}, as: MemberServicesAnalyst }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2024-01-01", period_end: "2025-01-01", declared_total_cents: 520000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep2: $.data.id }
            - call: "POST /contribution-reports/${rep2}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2024, period_salary_cents: 6500000, contribution_amount_cents: 520000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
            - { call: "POST /contribution-reports/${rep2}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
          trigger:
            - call: "GET /members/${mem_id}/benefit-estimate"
              payload: { variant: "FINAL" }
              as: MemberServicesAnalyst
              captures: { final_monthly: $.data.monthly_single_life_cents, final_fas: $.data.fas_cents }
            - call: "GET /members/${mem_id}/benefit-estimate"
              payload: { variant: "PROVISIONAL" }
              as: MemberServicesAnalyst
              captures: { prov_monthly: $.data.monthly_single_life_cents, prov_fas: $.data.fas_cents }
          assert:
            - "FINAL: fas_cents == 5500000 (avg of FY2021-2023), service_years == 6.0, multiplier == 0.017, monthly_single_life_cents == 46750"
            - "PROVISIONAL: fas_cents == 6000000 (avg of FY2022-2024 incl. PENDING), service_years == 7.0, monthly_single_life_cents == 59500"
            - "Same member, same instant: the two variants differ by exactly 12750 cents monthly (59500 - 46750)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: monthly_benefit_tiered_multiplier_and_conditional_option_factor
        grounds:
          - calculations.benefit_estimate
          - entities.RetirementApplication.fields.option_election
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs and non-linear interaction — a
          4-branch service-tier multiplier (0.017/0.020/0.022/0.025) combined
          with an option factor that itself branches on beneficiary age
          difference (JOINT_50 0.95/0.90, JOINT_100 0.90/0.82). Companion
          instance installment_rounding_remainder_on_last_payment is mode (b).
        test_recipe:
          setup:
            - "Fund, Employer, Member hired 2016-01-01 DOB 1966-01-01, six ACCEPTED lines FY2018-2023 (salaries 3.5M/4M/4.5M/5M/5.5M/6M), report RECONCILED: FAS 5,500,000, service 6.0"
            - "Three applications sequenced on the same member (each earlier one cancelled before the next is created): SINGLE_LIFE, then JOINT_50 with beneficiary DOB 1970-01-01 (age_diff 4), then JOINT_100 with beneficiary DOB 1950-01-01 (age_diff 16)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "Parks Dept", employer_code: "PARKS" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Tiered Terry", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2018-01-01", period_end: "2024-01-01", declared_total_cents: 2280000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2018, period_salary_cents: 3500000, contribution_amount_cents: 280000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l18: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2019, period_salary_cents: 4000000, contribution_amount_cents: 320000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l19: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2020, period_salary_cents: 4500000, contribution_amount_cents: 360000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l20: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2021, period_salary_cents: 5000000, contribution_amount_cents: 400000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l21: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2022, period_salary_cents: 5500000, contribution_amount_cents: 440000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l22: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 6000000, contribution_amount_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l23: $.data.id }
            - { call: "POST /contribution-reports/${rep1}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines/${l18}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${l19}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${l20}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${l21}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${l22}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/lines/${l23}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/finalize", payload: {}, as: MemberServicesAnalyst }
          trigger:
            - call: "POST /members/${mem_id}/retirement-applications"
              payload: { option_election: "SINGLE_LIFE" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { app_single: $.data.id }
            - { call: "POST /retirement-applications/${app_single}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /retirement-applications/${app_single}/cancel", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - call: "POST /members/${mem_id}/retirement-applications"
              payload: { option_election: "JOINT_50", beneficiary_name: "Pat Partner", beneficiary_date_of_birth: "1970-01-01" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { app_j50: $.data.id }
            - { call: "POST /retirement-applications/${app_j50}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /retirement-applications/${app_j50}/cancel", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - call: "POST /members/${mem_id}/retirement-applications"
              payload: { option_election: "JOINT_100", beneficiary_name: "Old Olympia", beneficiary_date_of_birth: "1950-01-01" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { app_j100: $.data.id }
            - { call: "POST /retirement-applications/${app_j100}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
          assert:
            - "RetirementApplication.${app_single}.provisional_monthly_cents == 46750 (5500000*0.017*6/12, factor 1.00)"
            - "RetirementApplication.${app_j50}.provisional_monthly_cents == 44413 (46750 * 0.95 = 44412.5 -> round_half_up)"
            - "RetirementApplication.${app_j100}.provisional_monthly_cents == 38335 (46750 * 0.82, age_diff 16 > 10)"
            - "Identical FAS/service inputs; only the tier-conditional option factor differs across the three applications"

      - name: installment_rounding_remainder_on_last_payment
        grounds:
          - calculations.installment_schedule
          - entities.PurchasePayment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-installment for the first N-1 payments with the remainder
          on the last: 1,000,001 cents over 12 installments yields 11 x 83,333
          then a final 83,338 (not 12 x 83,333 with a lost cent). Companion
          instance monthly_benefit_tiered_multiplier_and_conditional_option_factor
          is mode (a).
        test_recipe:
          setup:
            - "Fund, Employer, Member hired 2024-06-01 (FLAT window), DOB 1980-01-01, one ACCEPTED FY2023 line salary 5,000,005 (contribution 400000.40 -> declared 400000; contribution mismatch tolerated at review)"
            - "Purchase of 2.0 years quoted FLAT: round_half_up(0.10 * 5000005 * 2) = 1,000,001"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "Library Board", employer_code: "LIB" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Remainder Rita", date_of_birth: "1980-01-01", hire_date: "2024-06-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 400000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 5000005, contribution_amount_cents: 400000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l1: $.data.id }
            - { call: "POST /contribution-reports/${rep1}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines/${l1}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/finalize", payload: {}, as: MemberServicesAnalyst }
            - call: "POST /members/${mem_id}/service-purchases"
              payload: { purchase_type: "MILITARY", service_period_start: "2005-01-01", service_period_end: "2006-12-31", years_purchased: 2.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { pur_id: $.data.id }
            - { call: "POST /service-purchases/${pur_id}/quote", payload: {}, as: MemberServicesAnalyst }
          trigger:
            - call: "POST /service-purchases/${pur_id}/accept"
              payload: { installment_count: 12 }
              as: Member
              as_user_id: "${mem_id}"
            - call: "GET /service-purchases/${pur_id}/payments"
              payload: {}
              as: MemberServicesAnalyst
              captures: { p1_amount: "$.data[0].amount_cents", p12_amount: "$.data[11].amount_cents" }
          assert:
            - "ServicePurchase.${pur_id}.quoted_cost_cents == 1000001 and status == PLAN_ACTIVE"
            - "Exactly 12 PurchasePayments exist; payments[1..11] (sequence_number 1-11) each have amount_cents == 83333"
            - "payments[12] (sequence_number 12) has amount_cents == 83338 (= 1000001 - 11*83333); the remainder lands on the LAST payment"
            - "sum(amount_cents over all 12 payments) == 1000001 == quoted_cost_cents"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: retirement_review_return_cycle
        grounds:
          - state_machines.RetirementApplication.RETURNED_FOR_CORRECTION_to_UNDER_REVIEW
          - state_machines.RetirementApplication.SUBMITTED_to_RETURNED_FOR_CORRECTION
        distinguishing_aspect: |
          RetirementApplication is cyclic: SUBMITTED -> RETURNED_FOR_CORRECTION
          -> UNDER_REVIEW -> APPROVED, and the RETURN loop can repeat. Companion
          instance disability_deny_appeal_reopen_cycle is a cycle on
          DisabilityApplication (different entity).
        test_recipe:
          setup:
            - "Vested member (6.0 years, FAS 5,500,000, DOB 1966-01-01, hired 2016-01-01), report RECONCILED, application created and SUBMITTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
