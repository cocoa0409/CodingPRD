              captures: { avl_v1: $.data.version }
          trigger:
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "CL20-2", received_qty: 5, unit_cost_cents: 10, received_at: "2026-01-03T00:00:00.000Z", expected_avl_entry_version: "${avl_v1} - 1" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response.data.error_id == ERR_STALE_AVL_VERSION"

      - name: derived_available_qty_reconciled_after_receive
        claim_type: derived_field_reconciliation
        grounds: ["entities.Part.fields.available_qty", "entities.InventoryLot.fields.remaining_qty"]
        distinguishing_aspect: "After receiving a lot of qty 25, Part.available_qty reconciles to 25 (no reservations); reading the part reflects the lot's remaining_qty."
        test_recipe:
          setup: ["A part with an APPROVED AvlEntry; no lots yet."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "C-DER", description: "res", package_type: "0402", standard_cost_cents: 10, is_rohs_required: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "CV21", cage_code: "QQQ34" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "P21", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
          trigger:
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "CL21", received_qty: 25, unit_cost_cents: 10, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "GET /parts/${part_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { avail: $.data.available_qty }
          assert:
            - "Part.${part_id}.available_qty == 25"
            - "Part.${part_id}.total_on_hand_qty == 25"

      - name: rate_threshold_rework_mid_tier_boundary
        claim_type: rate_threshold_triggers
        grounds: ["calculations.rework_material_cost", "entities.ReworkOrder.fields.added_material_cost_cents"]
        distinguishing_aspect: "Rework base exactly 5000 (qty 25 @ 200) takes the LOW tier flat surcharge 1500 (boundary <= 5000 inclusive) -> added 6500; base 5001 would take MID_RATE 0.20."
        test_recipe:
          setup: ["A FAILED unit; a replacement part lot priced so a rework of qty 25 @ 200 yields base exactly 5000."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "C-TIER", description: "ic", package_type: "QFN", standard_cost_cents: 200, is_rohs_required: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "CV22", cage_code: "RRR56" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "P22", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "CL22", received_qty: 100, unit_cost_cents: 200, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "CB22", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["U1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /line-programs"
              payload: { bom_id: "${bom_id}", line_code: "LINE-A", feeder_slot_count: 4, program_checksum: "CK22" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { prog_id: $.data.id }
            - call: "POST /line-programs/${prog_id}/verify"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 1 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/setup"
              payload: { line_program_id: "${prog_id}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/test-result"
              payload: { result: "FAIL", defect_code: "OPEN" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /rework-orders"
              payload: { unit_id: "${unit_id}", defect_code: "OPEN" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { rwo_id: $.data.id }
          trigger:
            - call: "POST /rework-orders/${rwo_id}/close"
              payload: { replacement_part_id: "${part_id}", replacement_qty: 25, acting_user_id: "pp-1" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { add: $.data.added_material_cost_cents }
          assert:
            - "ReworkOrder.${rwo_id}.added_material_cost_cents == 6500"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_kit_reservation_visible_in_response
        claim_type: immediate
        grounds: ["state_machines.WorkOrder.PLANNED_to_KITTED", "entities.WorkOrder.fields.kit_shortage_count"]
        excluded_because:
          difficulty_instance: boundary_precision_check / kit_zero_shortage_empty_short_set_succeeds
          rationale: "Immediate visibility of the kit reservation (status KITTED, kit_shortage_count 0 in the same response) is asserted by that §1.8 instance."

      - name: immediate_cancel_release_visible
        claim_type: immediate
        grounds: ["state_machines.WorkOrder.KITTED_to_CANCELLED", "entities.Part.fields.available_qty"]
        excluded_because:
          difficulty_instance: compensating_invariant / kit_then_cancel_conserves_part_available_qty
          rationale: "Immediate visibility of released reservations on Part.available_qty after cancel is asserted by that §1.8 instance."
