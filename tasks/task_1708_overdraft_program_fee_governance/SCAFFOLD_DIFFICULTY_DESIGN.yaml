# =============================================================================
# Task 1708 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 19 instances across the nine Difficulty Rules of SKILL.md §0.5.
# Every chain starts from empty DB. Business dates 2026-08-03..2026-08-07 are
# Mon..Fri (valid batch dates). Startup logical clock default: 2026-08-01T00:00:00Z.
# Standard program config unless an instance overrides it:
#   fee 3500, daily cap 10500, count cap 3, de_minimis 500, sustained threshold 5,
#   sustained fee 3000, charge-off grace 10, notice window 30, steering 6 per 90,
#   offer expiry 30, disclosure "D1".
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: posting_order_high_to_low_vs_chronological_fee_count
        grounds:
          - calculations.posting_order_and_fee_assessment
          - entities.OverdraftProgram.fields.posting_order_policy
          - entities.PostingBatch.fields.fees_assessed_count
        distinguishing_aspect: |
          Identical authorized item set on identical starting balances yields 2 fees
          (7000 cents) under HIGH_TO_LOW but 1 fee (3500 cents) under CHRONOLOGICAL,
          while the items-only ledger (-2500) is identical — divergence lives in the
          AccountTransaction/PostingBatch fee domain, not in any report metric.
        test_recipe:
          setup:
            - "Program H (HIGH_TO_LOW) and program C (CHRONOLOGICAL), otherwise standard config"
            - "Each program has one opted-in account with ledger 10000 (credit posted in sealed 2026-08-03 batch)"
            - "Each account has four DEBIT_ONE_TIME items authorized 2026-08-04 at 09:00/09:01/09:02/09:03 with amounts 1500, 2000, 3000, 6000; batch 2026-08-04 OPEN in both programs"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-H", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: HIGH_TO_LOW, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progH: "$.data.id" } }
            - { call: "POST /v1/programs", payload: { name: "OD-C", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progC: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progH}", holder_name: "Holder H" }, as: Teller, captures: { acctH: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progC}", holder_name: "Holder C" }, as: Teller, captures: { acctC: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctH}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctH}" }
            - { call: "POST /v1/accounts/${acctC}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctC}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progH}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bH1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctH}", type: CREDIT_DEPOSIT, amount_cents: 10000 }, as: AccountHolder, as_user_id: "${acctH}" }
            - { call: "POST /v1/batches/${bH1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progC}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bC1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctC}", type: CREDIT_DEPOSIT, amount_cents: 10000 }, as: AccountHolder, as_user_id: "${acctC}" }
            - { call: "POST /v1/batches/${bC1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progH}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bH2: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${progC}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bC2: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctH}", type: DEBIT_ONE_TIME, amount_cents: 1500 }, as: AccountHolder, as_user_id: "${acctH}" }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctC}", type: DEBIT_ONE_TIME, amount_cents: 1500 }, as: AccountHolder, as_user_id: "${acctC}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctH}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acctH}" }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctC}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acctC}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:02:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctH}", type: DEBIT_ONE_TIME, amount_cents: 3000 }, as: AccountHolder, as_user_id: "${acctH}" }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctC}", type: DEBIT_ONE_TIME, amount_cents: 3000 }, as: AccountHolder, as_user_id: "${acctC}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:03:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctH}", type: DEBIT_ONE_TIME, amount_cents: 6000 }, as: AccountHolder, as_user_id: "${acctH}" }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctC}", type: DEBIT_ONE_TIME, amount_cents: 6000 }, as: AccountHolder, as_user_id: "${acctC}" }
          trigger:
            - { call: "POST /v1/batches/${bH2}/seal", payload: {}, as: OperationsClerk, captures: { h_count: "$.data.fees_assessed_count", h_cents: "$.data.fees_assessed_cents" } }
            - { call: "POST /v1/batches/${bC2}/seal", payload: {}, as: OperationsClerk, captures: { c_count: "$.data.fees_assessed_count", c_cents: "$.data.fees_assessed_cents" } }
            - { call: "GET /v1/accounts/${acctH}", as: ProgramAdmin, captures: { h_ledger: "$.data.ledger_balance_cents" } }
            - { call: "GET /v1/accounts/${acctC}", as: ProgramAdmin, captures: { c_ledger: "$.data.ledger_balance_cents" } }
          assert:
            - "h_count == 2 AND h_cents == 7000  (HIGH_TO_LOW: 6000->4000, 3000->1000, 2000->-1000 fee, 1500->-2500 fee)"
            - "c_count == 1 AND c_cents == 3500  (CHRONOLOGICAL: 1500->8500, 2000->6500, 3000->3500, 6000->-2500 fee)"
            - "h_ledger == -2500 AND c_ledger == -2500  (items-only ledger identical; posting order changes fee count only)"

      - name: report_revenue_provisional_vs_final_basis
        grounds:
          - calculations.report_revenue_metrics
          - entities.RegulatoryReport.fields.revenue_provisional_cents
          - entities.RegulatoryReport.fields.revenue_final_cents
        distinguishing_aspect: |
          Same period fee data yields revenue_provisional_cents == 7000 (accrual:
          includes the ASSESSED fee from the sealed-but-unsettled 2026-08-05 batch)
          but revenue_final_cents == 3500 (settled basis excludes it) — divergence
          lives in the RegulatoryReport compliance domain, not in transaction posting.
        test_recipe:
          setup:
            - "Program (CHRONOLOGICAL, standard config), one opted-in account"
            - "Batch 2026-08-03: credit 10000, sealed and settled (ledger 10000)"
            - "Batch 2026-08-04: one-time debit 12000, sealed and settled -> 1 POSTED fee 3500, ledger -5500, day count 1"
            - "Batch 2026-08-05: one-time debit 1000, SEALED only -> 1 ASSESSED fee 3500"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-R", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progR: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progR}", holder_name: "Holder R" }, as: Teller, captures: { acctR: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctR}/opt-in-election", payload: { channel: ONLINE, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctR}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progR}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bR1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctR}", type: CREDIT_DEPOSIT, amount_cents: 10000 }, as: AccountHolder, as_user_id: "${acctR}" }
            - { call: "POST /v1/batches/${bR1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bR1}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progR}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bR2: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctR}", type: DEBIT_ONE_TIME, amount_cents: 12000 }, as: AccountHolder, as_user_id: "${acctR}" }
            - { call: "POST /v1/batches/${bR2}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bR2}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progR}", business_date: "2026-08-05" }, as: OperationsClerk, captures: { bR3: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctR}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acctR}" }
            - { call: "POST /v1/batches/${bR3}/seal", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/reports", payload: { program_id: "${progR}", period_start: "2026-08-03", period_end: "2026-08-05" }, as: ComplianceOfficer, captures: { repR: "$.data.id" } }
            - { call: "POST /v1/reports/${repR}/finalize", payload: {}, as: ComplianceOfficer, as_user_id: "co-1", captures: { prov: "$.data.revenue_provisional_cents", fin: "$.data.revenue_final_cents", ratio: "$.data.waiver_ratio_bps", avg: "$.data.avg_fees_per_overdrafter_centi", flag: "$.data.scrutiny_flag" } }
          assert:
            - "prov == 7000  (POSTED 3500 + ASSESSED 3500, accrual basis)"
            - "fin == 3500   (settled basis excludes the ASSESSED fee)"
            - "ratio == 0 AND avg == 100 AND flag == false"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (three different modes: a, b, c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_assessment_cap_de_minimis_interplay
        grounds:
          - calculations.posting_order_and_fee_assessment
          - entities.OverdraftProgram.fields.daily_fee_cap_cents
          - entities.OverdraftProgram.fields.de_minimis_threshold_cents
        distinguishing_aspect: |
          Mode (a): fee decision non-linearly combines de_minimis magnitude,
          count cap, and cents cap with exact-fit (<=) admission — the third fee
          lands the daily total exactly on 10500 (allowed), the fourth is blocked
          by cents cap despite count cap headroom (3 < 5), and the first debit
          escapes via de minimis (magnitude 100 not > 500).
        test_recipe:
          setup:
            - "Program CHRONOLOGICAL, fee 3500, daily cap 10500, count cap 5, de_minimis 500, sustained threshold 5, sustained fee 3000, grace 10, disclosure D1"
            - "Opted-in account funded to ledger 500 (credit in sealed 2026-08-03 batch)"
            - "Batch 2026-08-04 OPEN; six DEBIT_ONE_TIME authorized at 09:00..09:05 with amounts 600, 3000, 2000, 1500, 900, 500"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-A", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 5, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progA: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progA}", holder_name: "Holder A" }, as: Teller, captures: { acctA: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctA}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctA}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progA}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bA1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctA}", type: CREDIT_DEPOSIT, amount_cents: 500 }, as: AccountHolder, as_user_id: "${acctA}" }
            - { call: "POST /v1/batches/${bA1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progA}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bA2: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctA}", type: DEBIT_ONE_TIME, amount_cents: 600 }, as: AccountHolder, as_user_id: "${acctA}", captures: { d1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctA}", type: DEBIT_ONE_TIME, amount_cents: 3000 }, as: AccountHolder, as_user_id: "${acctA}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:02:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctA}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acctA}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:03:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctA}", type: DEBIT_ONE_TIME, amount_cents: 1500 }, as: AccountHolder, as_user_id: "${acctA}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:04:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctA}", type: DEBIT_ONE_TIME, amount_cents: 900 }, as: AccountHolder, as_user_id: "${acctA}", captures: { d5: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:05:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctA}", type: DEBIT_ONE_TIME, amount_cents: 500 }, as: AccountHolder, as_user_id: "${acctA}" }
          trigger:
            - { call: "POST /v1/batches/${bA2}/seal", payload: {}, as: OperationsClerk, captures: { a_count: "$.data.fees_assessed_count", a_cents: "$.data.fees_assessed_cents" } }
            - { call: "GET /v1/accounts/${acctA}", as: ProgramAdmin, captures: { a_ledger_seal: "$.data.ledger_balance_cents" } }
            - { call: "POST /v1/batches/${bA2}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/accounts/${acctA}", as: ProgramAdmin, captures: { a_ledger_settle: "$.data.ledger_balance_cents", a_days: "$.data.consecutive_negative_business_days", a_status: "$.data.status" } }
          assert:
            - "a_count == 3 AND a_cents == 10500  (600->-100 de minimis skip; 3000->-3100 fee; 2000->-5100 fee; 1500->-6600 fee exact-fit 10500<=10500; 900 and 500 blocked by cents cap)"
            - "a_ledger_seal == -8000  (items only: 500-600-3000-2000-1500-900-500)"
            - "a_ledger_settle == -18500  (-8000 - 10500 fees at settle)"
            - "GET /v1/fees?transaction_id=${d1} returns an empty array (de minimis item carries no fee)"
            - "GET /v1/fees?transaction_id=${d5} returns an empty array (cap-blocked item carries no fee)"
            - "a_days == 1 AND a_status == ACTIVE"

      - name: waiver_percent_rounding_per_item_then_sum
        grounds:
          - calculations.waiver_allocation
          - entities.WaiverRequestItem.fields.waived_cents
          - entities.FeeWaiverRequest.fields.computed_total_cents
        distinguishing_aspect: |
          Mode (b): PERCENT_BPS waiver rounds per item then sums — 50% of 3625 is
          1812.5 -> 1813 and 50% of 2451 is 1225.5 -> 1226, total 3039; the
          forbidden sum-then-round order would give round(6076*0.5)=3038.
        test_recipe:
          setup:
            - "Program with fee 3625, sustained fee 2451, sustained threshold 1, de_minimis 100, generous caps (100000/10), grace 10, steering threshold 99, disclosure D1"
            - "Opted-in account: batch 2026-08-03 credit 100 sealed+settled (ledger 100)"
            - "Batch 2026-08-04: debit 1000 -> seal (OVERDRAFT fee 3625 ASSESSED) -> settle (fee POSTED, ledger -4525, day count 1 >= 1 -> RESTRICTED, SUSTAINED fee 2451 born POSTED, ledger -6976, SUSTAINED_OD offer auto-created)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-B", fee_amount_cents: 3625, daily_fee_cap_cents: 100000, max_daily_fees_count: 10, de_minimis_threshold_cents: 100, sustained_overdraft_days_threshold: 1, sustained_overdraft_fee_cents: 2451, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 99, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progB: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progB}", holder_name: "Holder B" }, as: Teller, captures: { acctB: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctB}/opt-in-election", payload: { channel: PHONE, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctB}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progB}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bB1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctB}", type: CREDIT_DEPOSIT, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acctB}" }
            - { call: "POST /v1/batches/${bB1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bB1}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progB}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bB2: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctB}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acctB}" }
            - { call: "POST /v1/batches/${bB2}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bB2}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acctB}&fee_type=OVERDRAFT", as: ProgramAdmin, captures: { f1: "$.data[0].id" } }
            - { call: "GET /v1/fees?account_id=${acctB}&fee_type=SUSTAINED", as: ProgramAdmin, captures: { f2: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acctB}", fee_ids: ["${f1}", "${f2}"], kind: PERCENT_BPS, percent_bps: 5000, reason_code: GOODWILL }, as: Supervisor, as_user_id: "sup-9", captures: { wrB: "$.data.id", wrB_status: "$.data.status", wrB_total: "$.data.computed_total_cents" } }
            - { call: "GET /v1/waiver-items?fee_id=${f1}", as: ProgramAdmin, captures: { w1: "$.data[0].waived_cents" } }
            - { call: "GET /v1/waiver-items?fee_id=${f2}", as: ProgramAdmin, captures: { w2: "$.data[0].waived_cents" } }
            - { call: "GET /v1/fees/${f1}", as: ProgramAdmin, captures: { f1_out: "$.data.outstanding_cents", f1_status: "$.data.status" } }
            - { call: "GET /v1/fees/${f2}", as: ProgramAdmin, captures: { f2_out: "$.data.outstanding_cents", f2_status: "$.data.status" } }
            - { call: "GET /v1/accounts/${acctB}", as: ProgramAdmin, captures: { b_ledger: "$.data.ledger_balance_cents", b_waived: "$.data.lifetime_fees_waived_cents" } }
          assert:
            - "wrB_status == APPLIED  (computed_total 3039 <= TELLER_CAP 5000 and creator is staff -> auto band)"
            - "wrB_total == 3039  (per-item round_half_up then sum: 1813 + 1226; sum-then-round would give 3038)"
            - "w1 == 1813 AND w2 == 1226"
            - "f1_out == 1812 AND f1_status == POSTED  (partial waiver leaves fee POSTED)"
            - "f2_out == 1225 AND f2_status == POSTED"
            - "b_ledger == -3937  (-6976 + 3039 credited) AND b_waived == 3039"

      - name: same_batch_fees_never_enter_working_balance
        grounds:
          - calculations.working_vs_ledger_balance_ordering
          - entities.DepositAccount.fields.ledger_balance_cents
        distinguishing_aspect: |
          Mode (c): the pinned evaluation order (items first, fees excluded from
          same-batch working balance, fees debit ledger only at settle) is
          observable mid-flight: after seal the ledger reads -700, not -7700.
        test_recipe:
          setup:
            - "Program CHRONOLOGICAL, fee 3500, de_minimis 500, generous caps (100000/10), sustained threshold 5, disclosure D1"
            - "Opted-in account with ledger 0 (no funding batch); batch 2026-08-03 OPEN"
            - "Two DEBIT_ONE_TIME: 600 at 09:00 (-> -600, magnitude 600 > 500, fee 3500), 100 at 09:01 (-> -700, fee 3500)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-C2", fee_amount_cents: 3500, daily_fee_cap_cents: 100000, max_daily_fees_count: 10, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progC2: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progC2}", holder_name: "Holder C2" }, as: Teller, captures: { acctC2: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctC2}/opt-in-election", payload: { channel: MAIL, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctC2}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progC2}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bC2: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctC2}", type: DEBIT_ONE_TIME, amount_cents: 600 }, as: AccountHolder, as_user_id: "${acctC2}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctC2}", type: DEBIT_ONE_TIME, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acctC2}" }
          trigger:
            - { call: "POST /v1/batches/${bC2}/seal", payload: {}, as: OperationsClerk, captures: { c2_count: "$.data.fees_assessed_count", c2_cents: "$.data.fees_assessed_cents" } }
            - { call: "GET /v1/accounts/${acctC2}", as: ProgramAdmin, captures: { c2_ledger_seal: "$.data.ledger_balance_cents" } }
            - { call: "POST /v1/batches/${bC2}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/accounts/${acctC2}", as: ProgramAdmin, captures: { c2_ledger_settle: "$.data.ledger_balance_cents", c2_days: "$.data.consecutive_negative_business_days" } }
            - { call: "GET /v1/fees?account_id=${acctC2}", as: ProgramAdmin, captures: { c2_fee1_posted: "$.data[0].posted_date" } }
          assert:
            - "c2_count == 2 AND c2_cents == 7000"
            - "c2_ledger_seal == -700  (proves same-batch fees never entered the balance at seal)"
            - "c2_ledger_settle == -7700  (fees debit only at settle)"
            - "c2_days == 1 AND c2_fee1_posted == '2026-08-03'"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: opt_in_election_revoke_reinstate_cycle
        grounds:
          - state_machines.OptInElection.OPTED_IN_to_REVOKED
          - state_machines.OptInElection.REVOKED_to_OPTED_IN
          - entities.OptInElection.fields.last_changed_at
        distinguishing_aspect: |
          OptInElection is a pure cycle: OPTED_IN -> REVOKED -> OPTED_IN -> REVOKED
          on the SAME record (version 1 -> 2 -> 3 -> 4); the final REVOKED state is
          behaviorally live — a would-be overdraft one-time debit is RETURNED_NSF.
        test_recipe:
          setup:
            - "Program (standard config, disclosure D1), account with ledger 0"
            - "Election created OPTED_IN (version 1)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-E", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progE: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progE}", holder_name: "Holder E" }, as: Teller, captures: { acctE: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctE}/opt-in-election", payload: { channel: ONLINE, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctE}", captures: { elE: "$.data.id", el_v1: "$.data.version" } }
            - { call: "POST /v1/batches", payload: { program_id: "${progE}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bE1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctE}", type: DEBIT_ONE_TIME, amount_cents: 500 }, as: AccountHolder, as_user_id: "${acctE}", captures: { txnE: "$.data.id" } }
          trigger:
            - { call: "POST /v1/opt-in-elections/${elE}/revoke", payload: {}, as: AccountHolder, as_user_id: "${acctE}", captures: { s1: "$.data.status", v2: "$.data.version" } }
            - { call: "POST /v1/opt-in-elections/${elE}/reinstate", payload: { disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctE}", captures: { s2: "$.data.status", v3: "$.data.version" } }
            - { call: "POST /v1/opt-in-elections/${elE}/revoke", payload: {}, as: AccountHolder, as_user_id: "${acctE}", captures: { s3: "$.data.status", v4: "$.data.version" } }
            - { call: "POST /v1/batches/${bE1}/seal", payload: {}, as: OperationsClerk, captures: { e_fees: "$.data.fees_assessed_count", e_returned: "$.data.items_returned_count" } }
            - { call: "GET /v1/transactions/${txnE}", as: ProgramAdmin, captures: { e_txn_status: "$.data.status" } }
          assert:
            - "s1 == REVOKED AND v2 == 2"
            - "s2 == OPTED_IN AND v3 == 3"
            - "s3 == REVOKED AND v4 == 4  (cycle executed twice on one record)"
            - "e_txn_status == RETURNED_NSF AND e_fees == 0 AND e_returned == 1  (500 overdraw from 0 with no opt-in: returned, balance unchanged at 0)"

      - name: waiver_request_deny_appeal_cycle
        grounds:
          - state_machines.FeeWaiverRequest.PENDING_SUPERVISOR_to_DENIED
          - state_machines.FeeWaiverRequest.DENIED_to_PENDING_MANAGER
          - state_machines.FeeWaiverRequest.DENIED_to_PENDING_COMPLIANCE
          - state_machines.FeeWaiverRequest.PENDING_COMPLIANCE_to_APPLIED
        distinguishing_aspect: |
          FeeWaiverRequest combines branching entry (band routing) with a
          deny->appeal->higher-band cycle: SUPERVISOR denial appeals to MANAGER,
          MANAGER denial appeals to COMPLIANCE, which finally APPLIES — a
          different entity and a different non-linear shape than OptInElection's
          pure cycle.
        test_recipe:
          setup:
            - "Program CHRONOLOGICAL, fee 3500, de_minimis 500, sustained threshold 5, generous caps, disclosure D1"
            - "Opted-in account: batch 2026-08-03 credit 100 sealed+settled; batch 2026-08-04 debits 2000 (09:00) and 500 (09:01) sealed+settled -> two POSTED fees F1/F2 of 3500 each, ledger -9400"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-W", fee_amount_cents: 3500, daily_fee_cap_cents: 100000, max_daily_fees_count: 10, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progW: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progW}", holder_name: "Holder W" }, as: Teller, captures: { acctW: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctW}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctW}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progW}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bW1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctW}", type: CREDIT_DEPOSIT, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acctW}" }
            - { call: "POST /v1/batches/${bW1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bW1}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progW}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bW2: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctW}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acctW}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctW}", type: DEBIT_ONE_TIME, amount_cents: 500 }, as: AccountHolder, as_user_id: "${acctW}" }
            - { call: "POST /v1/batches/${bW2}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bW2}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acctW}", as: ProgramAdmin, captures: { f1: "$.data[0].id", f2: "$.data[1].id" } }
          trigger:
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acctW}", fee_ids: ["${f1}", "${f2}"], kind: FULL, reason_code: HARDSHIP }, as: Teller, as_user_id: "teller-1", captures: { wrW: "$.data.id", st1: "$.data.status", tot1: "$.data.computed_total_cents" } }
            - { call: "POST /v1/fee-waiver-requests/${wrW}/deny", payload: {}, as: Supervisor, as_user_id: "sup-1", captures: { st2: "$.data.status", band2: "$.data.denied_band" } }
            - { call: "POST /v1/fee-waiver-requests/${wrW}/appeal", payload: {}, as: Teller, as_user_id: "teller-1", captures: { st3: "$.data.status" } }
            - { call: "POST /v1/fee-waiver-requests/${wrW}/deny", payload: {}, as: Manager, as_user_id: "mgr-1", captures: { st4: "$.data.status", band4: "$.data.denied_band" } }
            - { call: "POST /v1/fee-waiver-requests/${wrW}/appeal", payload: {}, as: Teller, as_user_id: "teller-1", captures: { st5: "$.data.status" } }
            - { call: "POST /v1/fee-waiver-requests/${wrW}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1", captures: { st6: "$.data.status" } }
            - { call: "GET /v1/accounts/${acctW}", as: ProgramAdmin, captures: { w_ledger: "$.data.ledger_balance_cents", w_waived: "$.data.lifetime_fees_waived_cents" } }
            - { call: "GET /v1/fees/${f1}", as: ProgramAdmin, captures: { f1_status: "$.data.status" } }
            - { call: "GET /v1/fees/${f2}", as: ProgramAdmin, captures: { f2_status: "$.data.status" } }
          assert:
            - "st1 == PENDING_SUPERVISOR AND tot1 == 7000  (5000 < 7000 <= 20000 band)"
            - "st2 == DENIED AND band2 == SUPERVISOR"
            - "st3 == PENDING_MANAGER  (appeal from SUPERVISOR denial)"
            - "st4 == DENIED AND band4 == MANAGER"
            - "st5 == PENDING_COMPLIANCE  (appeal from MANAGER denial)"
            - "st6 == APPLIED AND w_ledger == -2400 AND w_waived == 7000  (-9400 + 7000 credited)"
            - "f1_status == WAIVED AND f2_status == WAIVED  (FULL covers outstanding -> WAIVED)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 4 and 3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_cascade_restrict_to_offer
        grounds:
          - state_machines.PostingBatch.SEALED_to_SETTLED
          - state_machines.DepositAccount.ACTIVE_to_RESTRICTED
          - calculations.sustained_overdraft_day_count
          - entities.EducationOffer.fields.trigger_reason
        distinguishing_aspect: |
          Depth-4 chain triggered by settle: fees ASSESSED->POSTED debit the
          ledger (link 1); negative ledger increments the day counter (link 2);
          counter reaching threshold flips the account RESTRICTED and assesses a
          SUSTAINED fee (link 3); the restriction auto-creates a SUSTAINED_OD
          EducationOffer (link 4). Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Program: fee 3500, cap 10500, count 3, de_minimis 500, sustained threshold 3, sustained fee 3000, grace 4, steering 6/90, expiry 30, disclosure D1"
            - "Opted-in account: batch 2026-08-03 credit 1000 sealed+settled (ledger 1000)"
            - "Batch 2026-08-04: debit 5000 sealed+settled -> OVERDRAFT fee 3500 POSTED, ledger -7500, day count 1, ACTIVE"
            - "Batch 2026-08-05: empty, sealed+settled -> day count 2, ACTIVE"
            - "Batch 2026-08-06: empty, SEALED, not yet settled"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-S", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 3, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 4, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progS: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progS}", holder_name: "Holder S" }, as: Teller, captures: { acctS: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctS}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctS}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progS}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bS1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctS}", type: CREDIT_DEPOSIT, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acctS}" }
            - { call: "POST /v1/batches/${bS1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bS1}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progS}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bS2: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctS}", type: DEBIT_ONE_TIME, amount_cents: 5000 }, as: AccountHolder, as_user_id: "${acctS}" }
            - { call: "POST /v1/batches/${bS2}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bS2}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progS}", business_date: "2026-08-05" }, as: OperationsClerk, captures: { bS3: "$.data.id" } }
            - { call: "POST /v1/batches/${bS3}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bS3}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progS}", business_date: "2026-08-06" }, as: OperationsClerk, captures: { bS4: "$.data.id" } }
            - { call: "POST /v1/batches/${bS4}/seal", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/batches/${bS4}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/accounts/${acctS}", as: ProgramAdmin, captures: { s_status: "$.data.status", s_days: "$.data.consecutive_negative_business_days", s_rdays: "$.data.restricted_business_days", s_ledger: "$.data.ledger_balance_cents", s_assessed: "$.data.lifetime_fees_assessed_cents" } }
            - { call: "GET /v1/education-offers?account_id=${acctS}", as: ProgramAdmin, captures: { s_offer_type: "$.data[0].offer_type", s_offer_reason: "$.data[0].trigger_reason", s_offer_status: "$.data[0].status" } }
            - { call: "GET /v1/fees?account_id=${acctS}&fee_type=SUSTAINED", as: ProgramAdmin, captures: { s_sus_amt: "$.data[0].amount_cents", s_sus_status: "$.data[0].status", s_sus_posted: "$.data[0].posted_date" } }
          assert:
            - "s_status == RESTRICTED AND s_days == 3 AND s_rdays == 0"
            - "s_ledger == -10500  (-7500 - 3000 sustained fee, debited immediately)"
            - "s_assessed == 6500  (3500 OVERDRAFT + 3000 SUSTAINED)"
            - "s_sus_amt == 3000 AND s_sus_status == POSTED AND s_sus_posted == '2026-08-06'"
            - "s_offer_type == OVERDRAFT_LINE_OF_CREDIT AND s_offer_reason == SUSTAINED_OD AND s_offer_status == OFFERED"

      - name: reversal_cascade_voids_fee_restores_ledger
        grounds:
          - state_machines.AccountTransaction.POSTED_to_REVERSED
          - state_machines.OverdraftFee.ASSESSED_to_VOIDED
          - entities.DepositAccount.fields.lifetime_fees_waived_cents
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (reverse, not settle): reversal
          credits the ledger by the item amount (link 1); the fee linked to the
          reversed item is VOIDED (link 2); the void bumps
          lifetime_fees_waived_cents and account version (link 3).
        test_recipe:
          setup:
            - "Program standard config (CHRONOLOGICAL, disclosure D1)"
            - "Opted-in account: batch 2026-08-03 credit 10000 sealed+settled (ledger 10000)"
            - "Batch 2026-08-04: debit 12000 -> seal: item POSTED, working -2000, OVERDRAFT fee 3500 ASSESSED; batch stays SEALED"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-V", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progV: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progV}", holder_name: "Holder V" }, as: Teller, captures: { acctV: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctV}/opt-in-election", payload: { channel: ONLINE, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctV}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progV}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bV1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctV}", type: CREDIT_DEPOSIT, amount_cents: 10000 }, as: AccountHolder, as_user_id: "${acctV}" }
            - { call: "POST /v1/batches/${bV1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bV1}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progV}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bV2: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctV}", type: DEBIT_ONE_TIME, amount_cents: 12000 }, as: AccountHolder, as_user_id: "${acctV}", captures: { txnV: "$.data.id" } }
            - { call: "POST /v1/batches/${bV2}/seal", payload: {}, as: OperationsClerk, captures: { v_count: "$.data.fees_assessed_count" } }
            - { call: "GET /v1/fees?batch_id=${bV2}", as: ProgramAdmin, captures: { feeV: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/transactions/${txnV}/reverse", payload: {}, as: OperationsClerk, captures: { v_txn_status: "$.data.status" } }
            - { call: "GET /v1/fees/${feeV}", as: ProgramAdmin, captures: { v_fee_status: "$.data.status" } }
            - { call: "GET /v1/accounts/${acctV}", as: ProgramAdmin, captures: { v_ledger: "$.data.ledger_balance_cents", v_assessed: "$.data.lifetime_fees_assessed_cents", v_waived: "$.data.lifetime_fees_waived_cents" } }
            - { call: "GET /v1/batches/${bV2}", as: ProgramAdmin, captures: { v_batch_count: "$.data.fees_assessed_count" } }
          assert:
            - "v_txn_status == REVERSED"
            - "v_fee_status == VOIDED  (fee was ASSESSED, batch still SEALED)"
            - "v_ledger == 10000  (-2000 + 12000 credit-back)"
            - "v_assessed == 3500 AND v_waived == 3500  (void counted as waived)"
            - "v_batch_count == 1  (batch seal counters are historical and unchanged)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: waiver_create_state_error_beats_fiscal_error
        grounds:
          - "validations[priority=7]"
          - "validations[priority=12]"
          - "errors[ERR_FEE_NOT_WAIVABLE]"
          - "errors[ERR_WAIVER_AMOUNT_INVALID]"
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the request lists an
          already-WAIVED fee (state, priority 7) AND a FIXED_AMOUNT exceeding the
          listed outstanding (fiscal, priority 12) — the state error
          ERR_FEE_NOT_WAIVABLE must win.
        test_recipe:
          setup:
            - "Program standard config (CHRONOLOGICAL, generous caps 100000/10, disclosure D1)"
            - "Opted-in account: batch 2026-08-03 credit 100 sealed+settled; batch 2026-08-04 debit 2000 sealed+settled -> fee F1 3500 POSTED, ledger -5400"
            - "F1 fully waived via staff FULL request (3500 <= teller cap -> auto APPLIED); F1 now WAIVED, ledger -1900"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-P1", fee_amount_cents: 3500, daily_fee_cap_cents: 100000, max_daily_fees_count: 10, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progP1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progP1}", holder_name: "Holder P1" }, as: Teller, captures: { acctP1: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctP1}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctP1}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progP1}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bP1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctP1}", type: CREDIT_DEPOSIT, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acctP1}" }
            - { call: "POST /v1/batches/${bP1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bP1}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progP1}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bP2: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctP1}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acctP1}" }
            - { call: "POST /v1/batches/${bP2}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bP2}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acctP1}", as: ProgramAdmin, captures: { fP1: "$.data[0].id" } }
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acctP1}", fee_ids: ["${fP1}"], kind: FULL, reason_code: BANK_ERROR }, as: Teller, as_user_id: "teller-2" }
          trigger:
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acctP1}", fee_ids: ["${fP1}"], kind: FIXED_AMOUNT, amount_cents: 999999, reason_code: GOODWILL }, as: Teller, as_user_id: "teller-2", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_FEE_NOT_WAIVABLE  (state, priority 7, beats fiscal ERR_WAIVER_AMOUNT_INVALID at priority 12)"
            - "GET /v1/fees/${fP1}.status remains WAIVED and no new WaiverRequestItem rows exist for ${fP1} beyond the first request"

      - name: notice_activate_suspended_program_beats_window_error
        grounds:
          - "validations[priority=8]"
          - "validations[priority=9]"
          - "errors[ERR_PROGRAM_SUSPENDED]"
          - "errors[ERR_NOTICE_WINDOW_NOT_ELAPSED]"
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: activating a notice
          on a SUSPENDED program (safety, priority 8) before its effective_at
          (temporal, priority 9) must return ERR_PROGRAM_SUSPENDED — a different
          category pair than state-vs-fiscal.
        test_recipe:
          setup:
            - "Program standard config; notice N on FEE_AMOUNT -> '3600' created (program version now 2)"
            - "Clock 2026-08-03T09:00:00Z; N issued -> sent_at 2026-08-03T09:00:00Z, effective_at 2026-09-02T09:00:00Z"
            - "Program suspended (version 3); clock still 2026-08-03 (window not elapsed)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-P2", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: HIGH_TO_LOW, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progP2: "$.data.id", pv1: "$.data.version" } }
            - { call: "POST /v1/notices", payload: { program_id: "${progP2}", parameter: FEE_AMOUNT, new_value: "3600", expected_program_version: "${pv1}" }, as: ProgramAdmin, captures: { nP2: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/notices/${nP2}/issue", payload: {}, as: ProgramAdmin, captures: { n_eff: "$.data.effective_at" } }
            - { call: "POST /v1/programs/${progP2}/suspend", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/notices/${nP2}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co-9", captures: { err_id: "$.data.error_id" } }
            - { call: "GET /v1/notices/${nP2}", as: ProgramAdmin, captures: { n_status: "$.data.status" } }
            - { call: "GET /v1/programs/${progP2}", as: ProgramAdmin, captures: { p_fee: "$.data.fee_amount_cents" } }
          assert:
            - "err_id == ERR_PROGRAM_SUSPENDED  (safety, priority 8, beats temporal ERR_NOTICE_WINDOW_NOT_ELAPSED at priority 9)"
            - "n_eff == '2026-09-02T09:00:00Z'  (sent_at 2026-08-03T09:00:00Z + 30 days)"
            - "n_status == ISSUED AND p_fee == 3500  (activation did not apply)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: de_minimis_exact_threshold_boundary
        grounds:
          - calculations.posting_order_and_fee_assessment
          - entities.OverdraftProgram.fields.de_minimis_threshold_cents
        distinguishing_aspect: |
          Metric: cent-level balance magnitude, via the seal endpoint. Post-item
          working balance of exactly -500 (magnitude == threshold) yields NO fee;
          one more cent (-501, magnitude strictly greater) yields a 3500 fee.
        test_recipe:
          setup:
            - "Program CHRONOLOGICAL, fee 3500, de_minimis 500, generous caps (100000/10), sustained threshold 5, disclosure D1"
            - "Opted-in account funded to ledger 10000 (sealed 2026-08-03 batch)"
            - "Batch 2026-08-04 OPEN; debit 10500 at 09:00 (-> exactly -500), debit 1 at 09:01 (-> -501)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-D", fee_amount_cents: 3500, daily_fee_cap_cents: 100000, max_daily_fees_count: 10, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progD: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progD}", holder_name: "Holder D" }, as: Teller, captures: { acctD: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctD}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctD}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progD}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bD1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctD}", type: CREDIT_DEPOSIT, amount_cents: 10000 }, as: AccountHolder, as_user_id: "${acctD}" }
            - { call: "POST /v1/batches/${bD1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progD}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bD2: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctD}", type: DEBIT_ONE_TIME, amount_cents: 10500 }, as: AccountHolder, as_user_id: "${acctD}", captures: { dBig: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctD}", type: DEBIT_ONE_TIME, amount_cents: 1 }, as: AccountHolder, as_user_id: "${acctD}", captures: { dTiny: "$.data.id" } }
          trigger:
            - { call: "POST /v1/batches/${bD2}/seal", payload: {}, as: OperationsClerk, captures: { d_count: "$.data.fees_assessed_count", d_cents: "$.data.fees_assessed_cents" } }
            - { call: "GET /v1/accounts/${acctD}", as: ProgramAdmin, captures: { d_ledger: "$.data.ledger_balance_cents" } }
          assert:
            - "d_count == 1 AND d_cents == 3500  (only the 1-cent item that pushed magnitude to 501 is charged)"
            - "GET /v1/fees?transaction_id=${dBig} returns an empty array  (exact -500 is NOT > threshold)"
            - "GET /v1/fees?transaction_id=${dTiny} returns exactly one fee of 3500"
            - "d_ledger == -501"

      - name: sustained_day_count_exact_threshold_boundary
        grounds:
          - calculations.sustained_overdraft_day_count
          - entities.DepositAccount.fields.consecutive_negative_business_days
        distinguishing_aspect: |
          Metric: integer consecutive-day count, via the settle endpoint (not
          seal). After the 2nd settle with count == 2 (< 3) the account stays
          ACTIVE; the 3rd settle reaches count == 3 (>= threshold) and flips it
          RESTRICTED with a SUSTAINED fee.
        test_recipe:
          setup:
            - "Program: fee 3500, de_minimis 500, sustained threshold 3, sustained fee 3000, grace 4, steering 6/90, disclosure D1"
            - "Opted-in account: batch 2026-08-03 debit 2000 from 0 sealed+settled -> fee 3500 POSTED, ledger -5500, day count 1"
            - "Batch 2026-08-04: empty, sealed+settled -> day count 2"
            - "Batch 2026-08-05: empty, SEALED only"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-T", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 3, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 4, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progT: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progT}", holder_name: "Holder T" }, as: Teller, captures: { acctT: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctT}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctT}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progT}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bT1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctT}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acctT}" }
            - { call: "POST /v1/batches/${bT1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bT1}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progT}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bT2: "$.data.id" } }
            - { call: "POST /v1/batches/${bT2}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bT2}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/accounts/${acctT}", as: ProgramAdmin, captures: { t_status2: "$.data.status", t_days2: "$.data.consecutive_negative_business_days" } }
            - { call: "POST /v1/batches", payload: { program_id: "${progT}", business_date: "2026-08-05" }, as: OperationsClerk, captures: { bT3: "$.data.id" } }
            - { call: "POST /v1/batches/${bT3}/seal", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/batches/${bT3}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/accounts/${acctT}", as: ProgramAdmin, captures: { t_status3: "$.data.status", t_days3: "$.data.consecutive_negative_business_days", t_ledger3: "$.data.ledger_balance_cents" } }
            - { call: "GET /v1/fees?account_id=${acctT}&fee_type=SUSTAINED", as: ProgramAdmin, captures: { t_sus: "$.data[0].amount_cents", t_sus_posted: "$.data[0].posted_date" } }
          assert:
            - "t_status2 == ACTIVE AND t_days2 == 2  (count 2 < threshold 3: no restriction yet)"
            - "t_status3 == RESTRICTED AND t_days3 == 3  (count 3 >= 3: exact crossing restricts)"
            - "t_sus == 3000 AND t_sus_posted == '2026-08-05' AND t_ledger3 == -8500  (-5500 - 3000)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: onetime_debit_outcome_depends_on_election_state
        grounds:
          - state_machines.AccountTransaction.AUTHORIZED_to_POSTED
          - state_machines.AccountTransaction.AUTHORIZED_to_RETURNED_NSF
          - state_machines.OptInElection.OPTED_IN_to_REVOKED
        distinguishing_aspect: |
          Entity pair AccountTransaction x OptInElection: the SAME debit (1000,
          would overdraw) posts with a fee while the election is OPTED_IN, is
          RETURNED_NSF with no fee and no balance change while REVOKED, and posts
          again after reinstatement.
        test_recipe:
          setup:
            - "Program: fee 3500, de_minimis 500, sustained threshold 5 (no interference), generous caps, disclosure D1"
            - "Account with election OPTED_IN; batch 2026-08-03: debit 2000 from 0 sealed+settled -> fee 3500, ledger -5500, day count 1"
            - "Election revoked; batch 2026-08-04 OPEN with debit 1000 authorized"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-X", fee_amount_cents: 3500, daily_fee_cap_cents: 100000, max_daily_fees_count: 10, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progX: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progX}", holder_name: "Holder X" }, as: Teller, captures: { acctX: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctX}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctX}", captures: { elX: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${progX}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bX1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctX}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acctX}" }
            - { call: "POST /v1/batches/${bX1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bX1}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/opt-in-elections/${elX}/revoke", payload: {}, as: AccountHolder, as_user_id: "${acctX}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progX}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bX2: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctX}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acctX}", captures: { txnX2: "$.data.id" } }
          trigger:
            - { call: "POST /v1/batches/${bX2}/seal", payload: {}, as: OperationsClerk, captures: { x2_returned: "$.data.items_returned_count", x2_fees: "$.data.fees_assessed_count" } }
            - { call: "GET /v1/transactions/${txnX2}", as: ProgramAdmin, captures: { x2_status: "$.data.status" } }
            - { call: "POST /v1/batches/${bX2}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/accounts/${acctX}", as: ProgramAdmin, captures: { x_ledger_mid: "$.data.ledger_balance_cents" } }
            - { call: "POST /v1/opt-in-elections/${elX}/reinstate", payload: { disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctX}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progX}", business_date: "2026-08-05" }, as: OperationsClerk, captures: { bX3: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctX}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acctX}", captures: { txnX3: "$.data.id" } }
            - { call: "POST /v1/batches/${bX3}/seal", payload: {}, as: OperationsClerk, captures: { x3_fees: "$.data.fees_assessed_count" } }
            - { call: "GET /v1/transactions/${txnX3}", as: ProgramAdmin, captures: { x3_status: "$.data.status" } }
          assert:
            - "x2_status == RETURNED_NSF AND x2_returned == 1 AND x2_fees == 0  (REVOKED election: one-time debit not payable into overdraft)"
            - "x_ledger_mid == -5500  (returned item never touched the balance)"
            - "x3_status == POSTED AND x3_fees == 1  (reinstated election: same-sized debit posts and is charged 3500)"

      - name: account_close_blocked_by_pending_waiver
        grounds:
          - state_machines.DepositAccount.ACTIVE_to_CLOSED_VOLUNTARY
          - state_machines.FeeWaiverRequest
          - "errors[ERR_OPEN_ITEMS_BLOCK_CLOSE]"
        distinguishing_aspect: |
          Entity pair DepositAccount x FeeWaiverRequest: close is rejected while a
          waiver request on the account is PENDING_SUPERVISOR, and succeeds (with
          identical non-negative balance) only after that request is denied.
        test_recipe:
          setup:
            - "Program standard config (CHRONOLOGICAL, threshold 5, disclosure D1)"
            - "Opted-in account: batch 2026-08-03 credit 100 sealed; batch 2026-08-04 debit 2000 sealed+settled -> fee F1 3500 POSTED, ledger -5400"
            - "Batch 2026-08-05: credit 10000 sealed+settled -> ledger 4600, day count reset to 0, status ACTIVE"
            - "Waiver request (FULL on F1, computed 3500) created by the AccountHolder -> always routes PENDING_SUPERVISOR"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-K", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progK: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progK}", holder_name: "Holder K" }, as: Teller, captures: { acctK: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctK}/opt-in-election", payload: { channel: ONLINE, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctK}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progK}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bK1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctK}", type: CREDIT_DEPOSIT, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acctK}" }
            - { call: "POST /v1/batches/${bK1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progK}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bK2: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctK}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acctK}" }
            - { call: "POST /v1/batches/${bK2}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bK2}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progK}", business_date: "2026-08-05" }, as: OperationsClerk, captures: { bK3: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctK}", type: CREDIT_DEPOSIT, amount_cents: 10000 }, as: AccountHolder, as_user_id: "${acctK}" }
            - { call: "POST /v1/batches/${bK3}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bK3}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acctK}", as: ProgramAdmin, captures: { fK: "$.data[0].id" } }
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acctK}", fee_ids: ["${fK}"], kind: FULL, reason_code: FIRST_TIME }, as: AccountHolder, as_user_id: "${acctK}", captures: { wrK: "$.data.id", wrK_status: "$.data.status" } }
          trigger:
            - { call: "POST /v1/accounts/${acctK}/close", payload: {}, as: Teller, captures: { close_err: "$.data.error_id" } }
            - { call: "POST /v1/fee-waiver-requests/${wrK}/deny", payload: {}, as: Supervisor, as_user_id: "sup-1" }
            - { call: "POST /v1/accounts/${acctK}/close", payload: {}, as: Teller, captures: { close_status: "$.data.status" } }
          assert:
            - "wrK_status == PENDING_SUPERVISOR  (AccountHolder-created requests never auto-approve, even under teller cap)"
            - "close_err == ERR_OPEN_ITEMS_BLOCK_CLOSE  (balance 4600 >= 0, so the only blocker is the pending request)"
            - "close_status == CLOSED_VOLUNTARY  (after denial removed the open item)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: notice_windows_half_open_adjacency
        grounds:
          - state_machines.ProgramChangeNotice.DRAFT_to_ISSUED
          - "errors[ERR_NOTICE_WINDOW_OVERLAP]"
          - entities.ProgramChangeNotice.fields.effective_at
        distinguishing_aspect: |
          Interval semantics: half-open [sent_at, effective_at) on
          ProgramChangeNotice. Issuing a second FEE_AMOUNT notice one second
          before the first window's end collides; issuing it exactly at
          effective_at is allowed (touching endpoints do not overlap).
        test_recipe:
          setup:
            - "Program standard config (notice_window_days 30, disclosure D1)"
            - "Notice N1 (FEE_AMOUNT -> '3600') created; clock set to 2026-08-03T09:00:00Z; N1 issued: window [2026-08-03T09:00:00Z, 2026-09-02T09:00:00Z)"
            - "Notice N2 (FEE_AMOUNT -> '3700') created (program version now 3)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-N", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: HIGH_TO_LOW, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progN: "$.data.id", nv1: "$.data.version" } }
            - { call: "POST /v1/notices", payload: { program_id: "${progN}", parameter: FEE_AMOUNT, new_value: "3600", expected_program_version: "${nv1}" }, as: ProgramAdmin, captures: { n1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/notices/${n1}/issue", payload: {}, as: ProgramAdmin, captures: { n1_eff: "$.data.effective_at" } }
            - { call: "GET /v1/programs/${progN}", as: ProgramAdmin, captures: { nv2: "$.data.version" } }
            - { call: "POST /v1/notices", payload: { program_id: "${progN}", parameter: FEE_AMOUNT, new_value: "3700", expected_program_version: "${nv2}" }, as: ProgramAdmin, captures: { n2: "$.data.id" } }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T08:59:59Z" }, as: ProgramAdmin }
            - { call: "POST /v1/notices/${n2}/issue", payload: {}, as: ProgramAdmin, captures: { err_overlap: "$.data.error_id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/notices/${n2}/issue", payload: {}, as: ProgramAdmin, captures: { n2_status: "$.data.status", n2_sent: "$.data.sent_at", n2_eff: "$.data.effective_at" } }
          assert:
            - "n1_eff == '2026-09-02T09:00:00Z'  (2026-08-03T09:00:00Z + 30 days)"
            - "err_overlap == ERR_NOTICE_WINDOW_OVERLAP  (one second inside the half-open window)"
            - "n2_status == ISSUED AND n2_sent == '2026-09-02T09:00:00Z' AND n2_eff == '2026-10-02T09:00:00Z'  (exact adjacency allowed)"

      - name: report_periods_closed_interval_tiling
        grounds:
          - state_machines.RegulatoryReport
          - "errors[ERR_REPORT_PERIOD_OVERLAP]"
          - "errors[ERR_REPORT_PERIOD_GAP]"
        distinguishing_aspect: |
          Interval semantics: CLOSED intervals that must tile exactly — overlap is
          rejected, and (unlike notice windows) a GAP is also rejected: the next
          period must start exactly one day after the previous period_end. A
          different geometry (exact tiling vs buffered half-open) on a different
          resource (RegulatoryReport vs ProgramChangeNotice).
        test_recipe:
          setup:
            - "Program standard config; no reports yet"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-G", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progG: "$.data.id" } }
            - { call: "POST /v1/reports", payload: { program_id: "${progG}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: ProgramAdmin, captures: { r1: "$.data.id", r1_status: "$.data.status" } }
          trigger:
            - { call: "POST /v1/reports", payload: { program_id: "${progG}", period_start: "2026-08-15", period_end: "2026-09-15" }, as: ComplianceOfficer, captures: { err_ov: "$.data.error_id" } }
            - { call: "POST /v1/reports", payload: { program_id: "${progG}", period_start: "2026-09-02", period_end: "2026-09-30" }, as: ComplianceOfficer, captures: { err_gap: "$.data.error_id" } }
            - { call: "POST /v1/reports", payload: { program_id: "${progG}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: ComplianceOfficer, captures: { r4_status: "$.data.status", r4: "$.data.id" } }
            - { call: "POST /v1/reports", payload: { program_id: "${progG}", period_start: "2026-10-01", period_end: "2026-10-31" }, as: ComplianceOfficer, captures: { r5_status: "$.data.status" } }
          assert:
            - "r1_status == OPEN  (first report: gap rule exempt)"
            - "err_ov == ERR_REPORT_PERIOD_OVERLAP  (start 2026-08-15 inside [2026-08-01, 2026-08-31]; overlap checked before gap)"
            - "err_gap == ERR_REPORT_PERIOD_GAP  (2026-09-02 is not 2026-08-31 + 1 day)"
            - "r4_status == OPEN AND r5_status == OPEN  (exact day-after adjacency tiles correctly)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_assess_then_waive_conserves_net_position
        grounds:
          - calculations.waiver_allocation
          - entities.DepositAccount.fields.lifetime_fees_assessed_cents
          - entities.DepositAccount.fields.lifetime_fees_waived_cents
          - state_machines.OverdraftFee.POSTED_to_WAIVED
        distinguishing_aspect: |
          Conserved quantity: ledger_balance_cents + lifetime_fees_assessed_cents
          - lifetime_fees_waived_cents. The assess (settle) then FULL waive pair
          leaves it at -1000 at both observations — identical to a world where
          the fee never existed.
        test_recipe:
          setup:
            - "Program standard config (CHRONOLOGICAL, disclosure D1)"
            - "Opted-in account: batch 2026-08-03 credit 10000 sealed+settled (ledger 10000)"
            - "Batch 2026-08-04: debits 4000 (09:00) and 7000 (09:01), sealed -> working -1000, fee F1 3500 ASSESSED"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-I1", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progI1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progI1}", holder_name: "Holder I1" }, as: Teller, captures: { acctI1: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctI1}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctI1}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progI1}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bI1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctI1}", type: CREDIT_DEPOSIT, amount_cents: 10000 }, as: AccountHolder, as_user_id: "${acctI1}" }
            - { call: "POST /v1/batches/${bI1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bI1}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progI1}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bI2: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctI1}", type: DEBIT_ONE_TIME, amount_cents: 4000 }, as: AccountHolder, as_user_id: "${acctI1}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctI1}", type: DEBIT_ONE_TIME, amount_cents: 7000 }, as: AccountHolder, as_user_id: "${acctI1}" }
            - { call: "POST /v1/batches/${bI2}/seal", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acctI1}", as: ProgramAdmin, captures: { fI1: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/batches/${bI2}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/accounts/${acctI1}", as: ProgramAdmin, captures: { i1_ledger_post: "$.data.ledger_balance_cents", i1_assessed_post: "$.data.lifetime_fees_assessed_cents", i1_waived_post: "$.data.lifetime_fees_waived_cents" } }
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acctI1}", fee_ids: ["${fI1}"], kind: FULL, reason_code: BANK_ERROR }, as: Teller, as_user_id: "teller-3", captures: { wrI1_status: "$.data.status" } }
            - { call: "GET /v1/accounts/${acctI1}", as: ProgramAdmin, captures: { i1_ledger_wv: "$.data.ledger_balance_cents", i1_assessed_wv: "$.data.lifetime_fees_assessed_cents", i1_waived_wv: "$.data.lifetime_fees_waived_cents" } }
            - { call: "GET /v1/fees/${fI1}", as: ProgramAdmin, captures: { fI1_status: "$.data.status" } }
          assert:
            - "i1_ledger_post == -4500 AND i1_assessed_post == 3500 AND i1_waived_post == 0  (invariant: -4500 + 3500 - 0 == -1000)"
            - "wrI1_status == APPLIED  (staff-created, 3500 <= teller cap -> auto band)"
            - "i1_ledger_wv == -1000 AND i1_assessed_wv == 3500 AND i1_waived_wv == 3500  (invariant: -1000 + 3500 - 3500 == -1000, unchanged by the assess+waive pair)"
            - "fI1_status == WAIVED"

      - name: chargeoff_recovery_conserves_principal
        grounds:
          - state_machines.DepositAccount.RESTRICTED_to_CLOSED_CHARGEOFF
          - entities.DepositAccount.fields.charge_off_original_cents
          - entities.DepositAccount.fields.charged_off_cents
          - entities.DepositAccount.fields.recovered_cents
        distinguishing_aspect: |
          Conserved quantity: charge-off principal (charged_off_cents +
          recovered_cents == charge_off_original_cents == 11500) — a different
          conserved quantity than the fee-revenue ledger of the sibling
          instance. Two recovery credits (4000, then exactly the remaining 7500)
          drive charged_off to 0 without violating the invariant.
        test_recipe:
          setup:
            - "Program: fee 3500, de_minimis 500, sustained threshold 1, sustained fee 3000, grace 2, steering 99/90, disclosure D1"
            - "Opted-in account: batch 2026-08-03 debit 5000 from 0 sealed+settled -> fee 3500 POSTED, ledger -8500, day count 1 >= 1 -> RESTRICTED, SUSTAINED fee 3000, ledger -11500, SUSTAINED_OD offer OFFERED"
            - "Batch 2026-08-04 empty sealed+settled -> restricted_business_days 1"
            - "Batch 2026-08-05 empty sealed+settled -> restricted_business_days 2 >= 2 -> CLOSED_CHARGEOFF (charged_off 11500, ledger 0, offer EXPIRED)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-I2", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 1, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 2, notice_window_days: 30, steering_fee_count_threshold: 99, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { progI2: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${progI2}", holder_name: "Holder I2" }, as: Teller, captures: { acctI2: "$.data.id" } }
            - { call: "POST /v1/accounts/${acctI2}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acctI2}" }
            - { call: "POST /v1/batches", payload: { program_id: "${progI2}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { bI21: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctI2}", type: DEBIT_ONE_TIME, amount_cents: 5000 }, as: AccountHolder, as_user_id: "${acctI2}" }
            - { call: "POST /v1/batches/${bI21}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bI21}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progI2}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { bI22: "$.data.id" } }
            - { call: "POST /v1/batches/${bI22}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bI22}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${progI2}", business_date: "2026-08-05" }, as: OperationsClerk, captures: { bI23: "$.data.id" } }
            - { call: "POST /v1/batches/${bI23}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${bI23}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/accounts/${acctI2}", as: ProgramAdmin, captures: { i2_status: "$.data.status", i2_co: "$.data.charged_off_cents", i2_orig: "$.data.charge_off_original_cents", i2_ledger: "$.data.ledger_balance_cents" } }
          trigger:
            - { call: "POST /v1/transactions", payload: { account_id: "${acctI2}", type: CREDIT_DEPOSIT, amount_cents: 4000 }, as: AccountHolder, as_user_id: "${acctI2}", captures: { rec1_status: "$.data.status", rec1_batch: "$.data.batch_id", rec1_posted: "$.data.posted_date" } }
            - { call: "GET /v1/accounts/${acctI2}", as: ProgramAdmin, captures: { co1: "$.data.charged_off_cents", rec1: "$.data.recovered_cents" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acctI2}", type: CREDIT_DEPOSIT, amount_cents: 7500 }, as: AccountHolder, as_user_id: "${acctI2}", captures: { rec2_status: "$.data.status" } }
            - { call: "GET /v1/accounts/${acctI2}", as: ProgramAdmin, captures: { co2: "$.data.charged_off_cents", rec2: "$.data.recovered_cents", orig2: "$.data.charge_off_original_cents" } }
            - { call: "GET /v1/education-offers?account_id=${acctI2}", as: ProgramAdmin, captures: { i2_offer_status: "$.data[0].status" } }
          assert:
            - "i2_status == CLOSED_CHARGEOFF AND i2_co == 11500 AND i2_orig == 11500 AND i2_ledger == 0  (8500 fees+debit + 3000 sustained)"
            - "rec1_status == POSTED AND rec1_batch == null AND rec1_posted == '2026-08-01'  (immediate recovery post at default clock, no batch)"
            - "co1 == 7500 AND rec1 == 4000 AND 7500 + 4000 == 11500"
            - "rec2_status == POSTED AND co2 == 0 AND rec2 == 11500 AND orig2 == 11500  (0 + 11500 == 11500: principal conserved)"
            - "i2_offer_status == EXPIRED  (charge-off cascade retired the OFFERED offer)"
