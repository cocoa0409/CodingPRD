            - { call: "POST /ih/pump-calibrations/${c2}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${c3}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/sampling-plans/${plan}/complete-field", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
