# =============================================================================
# task_2102 — §1.9 Scaffold Corner Design (breadth coverage index)
# Sections and claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: payer_creation_returns_201_with_declared_fields_and_common_fields
        claim_type: creation
        grounds: ["entities.Payer", "endpoints.POST_/payers"]
        distinguishing_aspect: "A POST /payers with name, payer_code and payer_type returns 201 and a Payer carrying id, created_at, updated_at, version == 1 plus the declared business fields."
        test_recipe:
          setup: ["Empty database; the logical clock has never been set, so it reads the 2026-08-01T00:00:00Z startup default."]
          setup_api_calls:
            - call: "GET /payers"
              payload: {}
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          trigger:
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL", take_back_allowed: false, refund_remit_days: 45 }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Payer.${payer_id}.name == Meridian Commercial"
            - "Payer.${payer_id}.payer_code == COM"
            - "Payer.${payer_id}.payer_type == COMMERCIAL"
            - "Payer.${payer_id}.take_back_allowed == false"
            - "Payer.${payer_id}.refund_remit_days == 45"
            - "Payer.${payer_id}.version == 1"
            - "the response envelope has meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: payer_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds: ["entities.Payer.fields.take_back_allowed", "entities.Payer.fields.refund_remit_days"]
        distinguishing_aspect: "Omitting take_back_allowed and refund_remit_days yields the declared defaults true and 30 rather than null."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "GET /payers"
              payload: {}
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          trigger:
            - call: "POST /payers"
              payload: { name: "Medicare Region A", payer_code: "MCR", payer_type: "MEDICARE" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_id: "$.data.id" }
          assert:
            - "Payer.${payer_id}.take_back_allowed == true"
            - "Payer.${payer_id}.refund_remit_days == 30"

      - name: payer_get_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PAYER_NOT_FOUND]", "endpoints.GET_/payers/{payerId}"]
        distinguishing_aspect: "A GET on a well-formed but unstored payer id returns 404 ERR_PAYER_NOT_FOUND with the error envelope, not an empty 200."
        test_recipe:
          setup: ["One stored payer so the collection is non-empty."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          trigger:
            - call: "GET /payers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_PAYER_NOT_FOUND"
            - "response_type == error"

      - name: patient_account_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]", "endpoints.POST_/patient-accounts"]
        distinguishing_aspect: "Omitting the required primary_payer_id from POST /patient-accounts returns 400 ERR_INVALID_REQUEST and stores nothing."
        test_recipe:
          setup: ["One stored COMMERCIAL payer."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          trigger:
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-X1", mrn: "MRN-X1", patient_name: "No Payer", guarantor_state_code: "CA", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /patient-accounts returns total_count == 0"

      - name: patient_account_invalid_enum_guarantor_state_rejected
        claim_type: type_constraints
        grounds: ["entities.PatientAccount.fields.guarantor_state_code", "validations[priority=6]"]
        distinguishing_aspect: "guarantor_state_code accepts only CA, TX, NY or FL; the value ZZ returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One stored COMMERCIAL payer."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
          trigger:
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-X2", mrn: "MRN-X2", patient_name: "Bad State", guarantor_state_code: "ZZ", primary_payer_id: "${payer_com_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: patient_account_transaction_against_unknown_account_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.AccountTransaction.fields.account_id", "errors[ERR_ACCOUNT_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Posting a transaction under an unstored account id returns 404 ERR_ACCOUNT_NOT_FOUND before any body validation runs."
        test_recipe:
          setup: ["Empty database apart from the default clock."]
          setup_api_calls:
            - call: "GET /patient-accounts"
              payload: {}
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          trigger:
            - call: "POST /patient-accounts/00000000-0000-4000-8000-000000000000/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 1000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_ACCOUNT_NOT_FOUND"

      - name: account_transaction_is_append_only_with_no_version_field
        claim_type: immutability
        grounds: ["entities.AccountTransaction", "entities.AccountTransaction.fields.is_reversed"]
        distinguishing_aspect: "AccountTransaction is declared common_fields false, so a stored row exposes id and created_at but no version and no updated_at, and the only way to undo it is a REVERSAL row."
        test_recipe:
          setup: ["A COMMERCIAL payer and account IM1 with a single +10000 CHARGE posted while the clock reads its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-IM1", mrn: "MRN-IM1", patient_name: "Ida Munn", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_im1_id: "$.data.id" }
            - call: "POST /patient-accounts/${acct_im1_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 10000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { txn_im1_id: "$.data.id" }
          trigger:
            - call: "GET /account-transactions/${txn_im1_id}"
              payload: {}
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
          assert:
            - "the response data has no version key and no updated_at key"
            - "AccountTransaction.${txn_im1_id}.posted_at == 2026-08-01T00:00:00.000Z"
            - "AccountTransaction.${txn_im1_id}.effective_at == 2026-08-01T00:00:00.000Z"
            - "AccountTransaction.${txn_im1_id}.is_reversed == false"
            - "AccountTransaction.${txn_im1_id}.reversal_of_transaction_id is null"
            - "PatientAccount.${acct_im1_id}.balance_cents == 10000"
            - "PatientAccount.${acct_im1_id}.last_activity_at == 2026-08-01T00:00:00.000Z"

      - name: refund_request_system_fields_ignore_client_input_and_stamp_from_headers
        claim_type: system_fields
        grounds: ["entities.RefundRequest.fields.prepared_by_user_id", "entities.RefundRequest.fields.approval_state", "entities.RefundRequest.fields.approved_amount_cents"]
        distinguishing_aspect: "prepared_by_user_id is taken from X-User-ID, approval_state starts DRAFT, disbursement_state starts NOT_SCHEDULED and approved_amount_cents starts 0 — none of them are client inputs."
        test_recipe:
          setup: ["A COMMERCIAL payer and account SF1 with a 12000-cent PATIENT-attributed credit identified 2026-08-15 and status ATTRIBUTED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-SF1", mrn: "MRN-SF1", patient_name: "Sofia Frey", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "OUTPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_sf1_id: "$.data.id" }
            - call: "POST /patient-accounts/${acct_sf1_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 50000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_sf1_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -62000, source: "PATIENT" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /credit-balances/identify-sweep"
              payload: { account_ids: ["${acct_sf1_id}"] }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { cb_sf1_id: "$.data.credit_balance_ids[0]" }
            - call: "POST /credit-balances/${cb_sf1_id}/start-review"
              payload: {}
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /credit-balances/${cb_sf1_id}/attribute"
              payload: { attribution_method: "PROPORTIONAL" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { cb_sf1_v: "$.data.version" }
          trigger:
            - call: "POST /refund-requests"
              payload: { credit_balance_id: "${cb_sf1_id}", requested_amount_cents: 12000, payee_type: "PATIENT", payee_name: "Sofia Frey", payee_address_line: "10 Reed", payee_state_code: "CA", expected_credit_balance_version: "${cb_sf1_v}" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-9"
              captures: { rr_sf1_id: "$.data.id" }
          assert:
            - "RefundRequest.${rr_sf1_id}.prepared_by_user_id == ca-analyst-9"
            - "RefundRequest.${rr_sf1_id}.approval_state == DRAFT"
            - "RefundRequest.${rr_sf1_id}.disbursement_state == NOT_SCHEDULED"
            - "RefundRequest.${rr_sf1_id}.approved_amount_cents == 0"
            - "RefundRequest.${rr_sf1_id}.approvals_received == 0"
            - "RefundRequest.${rr_sf1_id}.revision_count == 0"
            - "CreditBalance.${cb_sf1_id}.status == REFUND_PENDING"

      - name: patient_account_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints.GET_/patient-accounts", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /patient-accounts?limit=2&offset=0 over three stored accounts returns 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup: ["A COMMERCIAL payer and three accounts PG1, PG2, PG3 created in that order."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-PG1", mrn: "MRN-PG1", patient_name: "Pat One", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-PG2", mrn: "MRN-PG2", patient_name: "Pat Two", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-PG3", mrn: "MRN-PG3", patient_name: "Pat Three", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          trigger:
            - call: "GET /patient-accounts"
              payload: { limit: 2, offset: 0 }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "GET /patient-accounts"
              payload: { limit: 2, offset: 2 }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
          assert:
            - "the first list returns 2 items with total_count == 3 and has_more == true"
            - "the second list returns 1 item with total_count == 3 and has_more == false"
            - "response_type == array on both calls"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: credit_balance_initial_state_is_identified_with_null_attribution
        claim_type: initial_state
        grounds: ["state_machines.CreditBalance", "entities.CreditBalance.fields.status", "calculations.credit_balance_identification_sweep"]
        distinguishing_aspect: "A swept CreditBalance starts in IDENTIFIED with attribution_method null, attribution null, both portions 0, refunded_cents 0, offset_cents 0 and outstanding_cents equal to credit_amount_cents."
        test_recipe:
          setup: ["A COMMERCIAL payer and account IN1 charged +50000 on 2026-08-01 and paid -62000 by the PATIENT on 2026-08-05."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-IN1", mrn: "MRN-IN1", patient_name: "Ines Nagy", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_in1_id: "$.data.id" }
            - call: "POST /patient-accounts/${acct_in1_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 50000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_in1_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -62000, source: "PATIENT" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          trigger:
            - call: "POST /credit-balances/identify-sweep"
              payload: { account_ids: ["${acct_in1_id}"] }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { cb_in1_id: "$.data.credit_balance_ids[0]" }
          assert:
            - "the sweep response has identified_count == 1 and skipped_account_count == 0"
            - "CreditBalance.${cb_in1_id}.status == IDENTIFIED"
            - "CreditBalance.${cb_in1_id}.credit_amount_cents == 12000"
            - "CreditBalance.${cb_in1_id}.identified_at == 2026-08-15T00:00:00.000Z"
            - "CreditBalance.${cb_in1_id}.attribution_method is null"
            - "CreditBalance.${cb_in1_id}.attribution is null"
            - "CreditBalance.${cb_in1_id}.patient_portion_cents == 0 and CreditBalance.${cb_in1_id}.payer_portion_cents == 0"
            - "CreditBalance.${cb_in1_id}.outstanding_cents == 12000"
            - "CreditBalance.${cb_in1_id}.aging_bucket == D0_30"
            - "PatientAccount.${acct_in1_id}.credit_balance_cents == 12000"

      - name: identify_sweep_skips_account_that_already_carries_an_open_credit_balance
        claim_type: precondition_enforcement
        grounds: ["calculations.credit_balance_identification_sweep"]
        distinguishing_aspect: "Re-running the sweep on the same account returns identified_count 0 and skipped_account_count 1, and no second CreditBalance row is created even though balance_cents is still -12000."
        test_recipe:
          setup: ["Account SK1 with a 12000-cent CreditBalance already identified on 2026-08-15 in status IDENTIFIED; the account's balance_cents is still -12000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-SK1", mrn: "MRN-SK1", patient_name: "Sky Kerr", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_sk1_id: "$.data.id" }
            - call: "POST /patient-accounts/${acct_sk1_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 50000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_sk1_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -62000, source: "PATIENT" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /credit-balances/identify-sweep"
              payload: { account_ids: ["${acct_sk1_id}"] }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
          trigger:
            - call: "POST /credit-balances/identify-sweep"
              payload: { account_ids: ["${acct_sk1_id}"] }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
          assert:
            - "the second sweep returns identified_count == 0 and skipped_account_count == 1"
            - "GET /credit-balances?account_id=${acct_sk1_id} returns total_count == 1"
            - "PatientAccount.${acct_sk1_id}.credit_balance_cents == 12000"

      - name: start_review_from_attributed_state_is_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.CreditBalance.IDENTIFIED_to_UNDER_REVIEW", "validations[priority=8]", "errors[ERR_CREDIT_BALANCE_INVALID_STATE]"]
        distinguishing_aspect: "start-review is only legal from IDENTIFIED; calling it on an ATTRIBUTED credit balance returns 409 ERR_CREDIT_BALANCE_INVALID_STATE and leaves status and version untouched."
        test_recipe:
          setup: ["Account IV2 with a 12000-cent credit identified 2026-08-15 and already attributed PROPORTIONAL, so its status is ATTRIBUTED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-IV2", mrn: "MRN-IV2", patient_name: "Ivy Vance", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_iv2_id: "$.data.id" }
            - call: "POST /patient-accounts/${acct_iv2_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 50000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_iv2_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -62000, source: "PATIENT" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
