              payload: { agreement_id: "${ag_id}", product_id: "${p_id}", week_start_date: "2026-09-07", reserved_lbs: 6000 }
              as: CoManufacturer
              as_user_id: "${cm_id}"
            - call: "POST /snack-mfg/co-man-slots"
              payload: { agreement_id: "${ag_id}", product_id: "${p_id}", week_start_date: "2026-09-07", reserved_lbs: 4000 }
              as: CoManufacturer
              as_user_id: "${cm_id}"
          trigger:
            - call: "POST /snack-mfg/co-man-slots"
              payload: { agreement_id: "${ag_id}", product_id: "${p_id}", week_start_date: "2026-09-07", reserved_lbs: 3000 }
              as: CoManufacturer
              as_user_id: "${cm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with 422 and error_id == ERR_CAPACITY_EXCEEDED"
            - "error_id != ERR_BUDGET_EXCEEDED even though budget_used 500000 + 150000 = 650000 > 600000: constraint outranks fiscal"

      - name: state_beats_fiscal_on_dispatch
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_MARGIN_BELOW_FLOOR]
        distinguishing_aspect: |
          Pair state (p6) vs business_fiscal (p10): a dispatch attempted from
          DRAFT on a shipment whose run's per-case margin (2830) is also below
          the product floor (5000) must surface ERR_INVALID_STATE, never
          ERR_MARGIN_BELOW_FLOOR.
        test_recipe:
          setup:
            - "product min_margin_cents_per_case 5000; run completed at default clock with margin_actual 28296 over 10 accepted cases (per-case 2830 < 5000: fiscal floor breached)"
            - "run disposition PASS; shipment created, planned WAREHOUSE, then replanned back to DRAFT"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 5000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T02:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.0, lbs_fried_since_last_check: 100, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/production-runs/${run_id}/complete"
              payload: { lbs_produced: 100, cases_produced: 10, rejected_cases: 0, seasoning_actual_pct: 4.0 }
              as: LineOperator
            - call: "POST /snack-mfg/production-runs/${run_id}/quality-disposition"
              payload: { disposition: PASS }
              as: QualityTechnician
            - call: "POST /snack-mfg/shipments"
              payload: { run_id: "${run_id}", cases: 1, requested_route: WAREHOUSE, transit_days: 1 }
              as: RoutePlanner
              captures: { sh_id: $.data.id }
            - call: "POST /snack-mfg/shipments/${sh_id}/plan"
              as: RoutePlanner
            - call: "POST /snack-mfg/shipments/${sh_id}/replan"
              as: RoutePlanner
          trigger:
            - call: "POST /snack-mfg/shipments/${sh_id}/dispatch"
              as: RoutePlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with 409 and error_id == ERR_INVALID_STATE (status DRAFT is not a dispatch from-state)"
            - "error_id != ERR_MARGIN_BELOW_FLOOR even though per-case margin 2830 < floor 5000: state outranks fiscal"
            - "Shipment.${sh_id}.status == DRAFT (unchanged)"

  - rule_id: boundary_precision_check
    instances:
      - name: tpm_threshold_27_inclusive_boundary
        grounds:
          - calculations.tpm_degradation
          - state_machines.FryerOil.ACTIVE_to_QUALITY_HOLD
          - errors[ERR_OIL_QUALITY_HOLD]
        distinguishing_aspect: |
          Metric tpm_pct, endpoint POST /snack-mfg/weight-checks: the hold fires
          at the stored value of exactly 27.0 (inclusive >=) — 26.99 leaves the
          oil ACTIVE and the run RUNNING, and the next +0.01 crossing to exactly
          27.0 flips both.
        test_recipe:
          setup:
            - "run started; checks of 5000 and 5000 lbs bring stored tpm to 20.5"
            - "third check of 3245 lbs: 20.5 + 6.49 = 26.99 -> still ACTIVE (observed via GET)"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T16:00:00Z", lbs_planned: 20000, cases_planned: 1000, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.1, lbs_fried_since_last_check: 5000, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.1, lbs_fried_since_last_check: 5000, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.1, lbs_fried_since_last_check: 3245, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "GET /snack-mfg/fryer-oils"
              as: PlantManager
              captures: { oil_id: "$.data[0].id", tpm_pre: "$.data[0].tpm_pct", state_pre: "$.data[0].state" }
          trigger:
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.1, lbs_fried_since_last_check: 5, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "GET /snack-mfg/fryer-oils/${oil_id}"
              as: PlantManager
            - call: "GET /snack-mfg/production-runs/${run_id}"
              as: PlantManager
          assert:
            - "setup GET observed tpm_pct == 26.99 and state == ACTIVE (below the inclusive threshold)"
            - "after the 5-lb check: FryerOil.${oil_id}.tpm_pct == 27.0 exactly and state == QUALITY_HOLD"
            - "ProductionRun.${run_id}.execution_status == HELD (the inclusive >= 27.0 boundary fired the cascade)"

      - name: freshness_cutoff_inclusive_vs_exclusive
        grounds:
          - calculations.freshness_window
          - errors[ERR_ROUTE_INELIGIBLE]
          - errors[ERR_FRESHNESS_INSUFFICIENT]
        distinguishing_aspect: |
          Metric freshness days, endpoints plan/dispatch: WAREHOUSE receipt
          remaining of exactly 10 is INELIGIBLE (exclusive >10) while DSD
          remaining of exactly 4 is ELIGIBLE and dispatchable (inclusive >=4);
          one day later (remaining 3) AUTO finds neither route and fails.
        test_recipe:
          setup:
            - "run completed at the default clock 2026-08-01T00:00:00Z; product shelf_life_days 30; quality PASSED; 10 accepted cases"
            - "s1 (WAREHOUSE, transit 0), s2 (DSD), s3 (AUTO, transit default 2) created with 1 case each"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T02:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.0, lbs_fried_since_last_check: 100, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/production-runs/${run_id}/complete"
              payload: { lbs_produced: 100, cases_produced: 10, rejected_cases: 0, seasoning_actual_pct: 4.0 }
              as: LineOperator
            - call: "POST /snack-mfg/production-runs/${run_id}/quality-disposition"
              payload: { disposition: PASS }
              as: QualityTechnician
            - call: "POST /snack-mfg/shipments"
              payload: { run_id: "${run_id}", cases: 1, requested_route: WAREHOUSE, transit_days: 0 }
              as: RoutePlanner
              captures: { s1_id: $.data.id }
            - call: "POST /snack-mfg/shipments"
              payload: { run_id: "${run_id}", cases: 1, requested_route: DSD }
              as: RoutePlanner
              captures: { s2_id: $.data.id }
            - call: "POST /snack-mfg/shipments"
              payload: { run_id: "${run_id}", cases: 1, requested_route: AUTO }
              as: RoutePlanner
              captures: { s3_id: $.data.id }
          trigger:
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/shipments/${s1_id}/plan"
              as: RoutePlanner
              captures: { err1: $.data.error_id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-27T00:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/shipments/${s2_id}/plan"
              as: RoutePlanner
            - call: "POST /snack-mfg/shipments/${s2_id}/dispatch"
              as: RoutePlanner
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-28T00:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/shipments/${s3_id}/plan"
              as: RoutePlanner
              captures: { err3: $.data.error_id }
          assert:
            - "s1 plan at remaining 10 with transit 0 fails 422 ERR_ROUTE_INELIGIBLE (receipt remaining exactly 10 is not > 10)"
            - "s2 at remaining exactly 4 plans DSD_PLANNED and dispatches to DISPATCHED (inclusive >= 4 at both plan and dispatch re-check)"
            - "s3 (AUTO) at remaining 3 fails 422 ERR_FRESHNESS_INSUFFICIENT (3 < 4 and 3-2 = 1 not > 10)"

      - name: coman_capacity_exact_fit_inclusive
        grounds:
          - calculations.coman_capacity_allocation
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric reserved_lbs, endpoint POST /snack-mfg/co-man-slots: a booking
          that brings the ISO-week aggregate to EXACTLY weekly_capacity_lbs
          (6000 + 4000 == 10000) is accepted (inclusive <=), while the very next
          1-lb booking is rejected — aggregate-capacity semantics, not geometric
          exclusion.
        test_recipe:
          setup:
            - "agreement ACTIVE: capacity 10000 lbs/week, rate 50, budget 1000000 (fiscal confound removed)"
            - "slot of 6000 lbs booked for ISO week starting Monday 2026-09-07"
