  # ===================================================================
  # RULE 4 — Transitive cascades (depth >= 3 and depth >= 2, different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:

      - name: retread_completion_ledger_cascade_depth_five
        grounds:
          - endpoints.POST_/retread-jobs/{job_id}/complete
          - state_machines.Casing.IN_RETREAD_to_RETREADED
          - calculations.casing_credit_accrual
          - calculations.casing_credit_balance
          - calculations.cross_location_invoice_rollup
          - entities.CrossLocationInvoice.fields.credit_applied_cents
        distinguishing_aspect: |
          DEPTH 5 chain triggered by retread completion. Hop 1 completes the job and mints a
          TireAsset; hop 2 fires BECAUSE hop 1 completed the job (casing RETREADED,
          retread_count += 1); hop 3 fires BECAUSE hop 2 changed retread_count (ADJUSTMENT
          ledger entry of +160); hop 4 fires BECAUSE hop 3 posted a ledger row (fleet balance
          1600 -> 1760); hop 5 fires BECAUSE hop 4 moved the balance (the OPEN invoice
          re-prices its credit and total). Nothing but the single completion call was issued.
        test_recipe:
          setup:
            - "fleet with an ACTIVE agreement whose casing_credit_rate_cents is 4000 and tier_discount_pct 0.125"
            - "one COMPLETED NORMAL call worth 12820 cents inside the August billing period"
            - "one casing graded C at retread_count 0, so the provisional accrual is 1600 cents"
            - "a job on that casing SCHEDULED and IN_PRODUCTION, not yet completed"
            - "an OPEN cross-location invoice created BEFORE the completion, so hop 5 has a live target"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Cascade Plant", location_code: "CSC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-1001", scrap_permit_expires_on: "2027-12-31", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
