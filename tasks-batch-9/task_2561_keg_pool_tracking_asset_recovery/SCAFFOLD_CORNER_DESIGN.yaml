            - "the first SETTLE returns HTTP 422 ERR_SETTLEMENT_AMOUNT_MISMATCH with chargeback_status still ISSUED, settled_amount_cents still null and an unchanged assessment version"
            - "the second SETTLE returns HTTP 200 with chargeback_status == SETTLED and settled_amount_cents == 14036"
            - "Brewer.${b1_id}.chargeback_balance_cents is still 14036 after the settlement and status is still PROBATION: SETTLE moves no money out of the ledger sum"

