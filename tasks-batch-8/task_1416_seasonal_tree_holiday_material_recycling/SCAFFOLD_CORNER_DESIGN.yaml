              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 2, size_class: "MEDIUM", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b1: $.data.id }
            - call: "POST /contamination-tickets"
              payload: { program_id: "${pid}", booking_id: "${b1}", category: "DECORATIONS" }
              as: SiteSupervisor
              as_user_id: sup_1
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /contamination-tickets/${t1}/adjudicate"
              payload: { verdict: "UPHELD" }
              as: ProgramAdmin
              as_user_id: admin_1
            - call: "GET /bookings/${b1}"
              as: ProgramAdmin
            - call: "GET /households/${h1}"
              as: ProgramAdmin
            - call: "GET /programs/${pid}"
              as: ProgramAdmin
          assert:
            - "Immediately: CurbsideBooking.${b1}.status == REJECTED_CONTAMINATED"
            - "Immediately: Household.${h1}.strike_count == 1, curbside_eligible == true (1 < 2)"
            - "Immediately: Program.${pid}.open_ticket_count == 0 and posture == NORMAL"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: barred_household_booking_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_HOUSEHOLD_BARRED]"
        excluded_because:
          difficulty_instance: adjudication_bar_cascade
          rationale: "Asserted as the final trigger of the §1.8 transitive-cascade instance (new booking by barred household -> ERR_HOUSEHOLD_BARRED)."

      - name: intake_window_boundary_covered
        claim_type: boundary_edge
        grounds:
          - "errors[ERR_OUTSIDE_COLLECTION_WINDOW]"
        excluded_because:
          difficulty_instance: intake_at_window_end_inclusive
          rationale: "Window-end inclusive/exclusive boundary is the §1.8 boundary-precision instance."

      - name: route_capacity_boundary_covered
        claim_type: boundary_edge
        grounds:
          - "errors[ERR_ROUTE_CAPACITY_EXCEEDED]"
        excluded_because:
          difficulty_instance: route_capacity_exact_fit
          rationale: "Exact-fit vs one-over boundary is the §1.8 boundary-precision instance."

      - name: appeal_deadline_boundary_covered
        claim_type: boundary_edge
        grounds:
          - "errors[ERR_APPEAL_WINDOW_EXPIRED]"
        excluded_because:
          difficulty_instance: appeal_deadline_exact_72h
          rationale: "72h inclusive deadline boundary is the §1.8 boundary-precision instance."

      - name: claim_requires_open_event_covered
        claim_type: guarded_transition
        grounds:
          - "errors[ERR_EVENT_NOT_OPEN]"
        excluded_because:
          difficulty_instance: claim_requires_event_open
          rationale: "Claim creation gated on event lifecycle is the §1.8 cross-entity-state instance."

      - name: zone_suspended_blocks_booking_covered
        claim_type: guarded_transition
        grounds:
          - "errors[ERR_ZONE_SUSPENDED]"
        excluded_because:
          difficulty_instance: booking_requires_zone_active
          rationale: "Zone suspension gating bookings is the §1.8 cross-entity-state instance."

      - name: shift_overlap_and_run_buffer_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SHIFT_OVERLAP]"
          - "errors[ERR_RUN_OVERLAP]"
        excluded_because:
          difficulty_instance: volunteer_shift_adjacency_half_open
          rationale: "Both overlap interval semantics are exercised by the two §1.8 resource-temporal-overlap instances."

      - name: zone_mismatch_and_capacity_priority_covered
        claim_type: priority_ordering
        grounds:
          - "errors[ERR_ZONE_MISMATCH]"
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: booking_referential_before_fiscal
          rationale: "Both priority-conflict pairs are exercised by the two §1.8 priority-pair instances."
