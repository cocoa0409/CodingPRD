            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${vR}", inspection_id: "${iR}", expected_vehicle_version: "${vR_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-R" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-R" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-R" }, { doc_type: "RECONDITIONING_INVOICE", reference: "RI-R" }] }
