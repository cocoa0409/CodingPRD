          - errors[ERR_DEPENDENT_STATE_INVALID]
          - entities.Dispense.fields.protocol_item_id
        distinguishing_aspect: |
          Entity pair Dispense -> Protocol: the dispense endpoint's validity depends on the
          state of a different entity, the owning Protocol. The identical request fails with
          ERR_DEPENDENT_STATE_INVALID while the protocol is ISSUED and succeeds unchanged
          once it is ACTIVE.
        test_recipe:
          setup:
            - "An OR patient with four attested sections, a stocked product lot"
            - "A protocol in status ISSUED with one item — issued but deliberately not yet activated"
          setup_api_calls:
            - call: "POST /practitioners"
