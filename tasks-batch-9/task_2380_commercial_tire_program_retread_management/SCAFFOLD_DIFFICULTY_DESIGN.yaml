            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31", expected_fleet_account_version: "${fleet_v}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /cross-location-invoices/${inv_id}/submit"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /cross-location-invoices/${inv_id}/dispute"
              payload: { dispute_reason: "Rate table disagreement" }
              as: BillingClerk
          assert:
            - "before the trigger the ledger holds exactly two rows for this fleet: ACCRUAL +10500 and APPLICATION -6334, and FleetAccount.${fleet_id}.casing_credit_balance_cents == 4166"
            - "after the trigger a third row exists — REVERSAL +6334 with source_entity_type CROSS_LOCATION_INVOICE and source_entity_id ${inv_id}"
            - "SUM(CasingCreditEntry.amount_cents) for the fleet == 10500, exactly the pre-submit value: zero drift"
            - "FleetAccount.${fleet_id}.casing_credit_balance_cents == 10500 and equals that sum"
            - "the APPLICATION row still exists unchanged with amount_cents == -6334 — compensation is additive, never destructive"
            - "CrossLocationInvoice.${inv_id}.credit_applied_cents == 0 and total_cents == 25339 == net_before_credit_cents, while subtotal_cents 28960 and discount_cents 3621 are untouched"
            - "both RoadServiceCall rows are back to billing_status UNBILLED with cross_location_invoice_id == null, so the 28960 of work is fully re-invoiceable and nothing was double-counted"

      - name: retread_cancel_restores_line_booked_minutes
        grounds:
          - calculations.retread_slot_feasibility
          - entities.RetreadLine.fields.booked_minutes
          - state_machines.RetreadJob.SCHEDULED_to_CANCELLED
          - state_machines.Casing.RETREAD_QUEUED_to_INSPECTED
        distinguishing_aspect: |
          CONSERVED QUANTITY: RetreadLine.booked_minutes — a capacity counter, not a money
          ledger. Scheduling reserves 270 minutes (240 slot + 30 cooldown) and cancelling
          returns the counter to exactly 0, with the casing walked back from RETREAD_QUEUED to
          INSPECTED. The proof of zero drift is that the byte-identical slot can be re-booked
          afterwards and lands on 270 again, so no phantom reservation survived.
        test_recipe:
          setup:
            - "one line with cure_cooldown_minutes 30 and no jobs, booked_minutes 0"
            - "one casing collected and graded A"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Rollback Plant", location_code: "RBK", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-3030", scrap_permit_expires_on: "2027-12-31", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Cedar Line Haul", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
