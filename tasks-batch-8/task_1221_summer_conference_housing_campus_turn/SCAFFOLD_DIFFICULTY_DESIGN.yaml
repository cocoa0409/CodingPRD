      - name: key_issue_return_pool_conservation
        grounds:
          - entities.Building.fields.available_key_count
          - state_machines.KeyCredential.ISSUED_to_RETURNED
          - state_machines.KeyCredential.ACTIVATED_to_LOST
          - calculations.key_late_fee
        distinguishing_aspect: |
          Conserved quantity: physical KEY pool (different quantity than bed
          inventory) — available_key_count + outstanding + lost == key_pool_size (3).
          Issue (forward) paired with return (compensating) restores the pool
          exactly; the LOST path provably does NOT compensate (pool shrinks by 1).
