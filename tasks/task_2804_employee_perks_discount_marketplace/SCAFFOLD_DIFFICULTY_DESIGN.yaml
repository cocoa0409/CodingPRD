            - "${slot2_status} == RESERVED and ${slot2_fee} == 136800: two intersecting FEATURED runs are within the capacity of 2"
            - "${third_error} == ERR_SLOT_CAPACITY_CONFLICT with HTTP 409, not ERR_SLOT_COOLDOWN_CONFLICT, because capacity is priority 83 and the cooldown is priority 84 even though both are violated"
            - "${slot2_released_status} == RELEASED, which frees its capacity contribution"
            - "${retry_error} == ERR_SLOT_COOLDOWN_CONFLICT with HTTP 409: the identical request now clears capacity but the gap of 0 days from Bistro Uno's own earlier run is still under 7 days"
            - "PlacementSlot.${slot1_id}.status == RESERVED throughout"

      - name: half_open_exclusivity_windows_collide_on_overlap_but_admit_a_touching_successor
        grounds:
          - validations[priority=76]
          - errors[ERR_EXCLUSIVITY_OVERLAP]
          - state_machines.PartnerAgreement.ACCEPTED_to_ACTIVE
          - entities.PartnerAgreement.fields.exclusivity_granted
          - entities.PartnerAgreement.fields.exclusivity_window_start
          - validations[priority=94]
        distinguishing_aspect: |
          A different resource entity and the opposite interval convention from the placement
          instance: the contended resource is category exclusivity on one (category,
          region_code) lane and its windows are HALF-OPEN [start, end), so an agreement whose
          window starts exactly when the incumbent's ends is granted exclusivity while an
          agreement whose window merely overlaps is refused with ERR_EXCLUSIVITY_OVERLAP and
          stays in ACCEPTED.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. Three merchants each negotiate their own DINING/CA agreement with exclusivity_requested true and an explicit exclusivity window on the standing round."
