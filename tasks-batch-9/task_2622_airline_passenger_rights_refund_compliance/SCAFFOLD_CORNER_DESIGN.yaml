# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2622_airline_passenger_rights_refund_compliance
#
# Walks references/claim-extraction-guide.md section by section against this
# scaffold's §1.1–§1.7 surface. Every instance's setup_api_calls chain drives an
# empty DB into the instance's precondition using only §1.5 endpoints; every
# ${var} is bound by an earlier captures:. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as excluded_because stubs.
#
# Logical clock: the runtime starts at 2026-08-01T00:00:00Z; instances that need
# another instant call POST /_clock/set_current_utc.

scaffold_corner_design:

  # ==========================================================================
  # 1. ENTITIES  (claim-extraction-guide "From Table 1 (Entities)")
  # ==========================================================================
  - section: entities
    instances:

      - name: policy_profile_creation_returns_every_declared_field
        claim_type: creation
        grounds: ["entities.PolicyProfile", "endpoints.POST /compliance/policy-profiles"]
        distinguishing_aspect: "A POST carrying all fourteen input fields returns 201 with each one echoed and the two computed counters at 0; PolicyProfile.version is 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ", domestic_significant_delay_minutes: 120, international_significant_delay_minutes: 300, credit_card_refund_deadline_days: 5, other_method_refund_deadline_days: 14, bag_delay_threshold_hours_domestic: 6, bag_delay_threshold_hours_international: 24, tarmac_deplane_deadline_minutes_domestic: 150, tarmac_deplane_deadline_minutes_international: 210, complaint_ack_deadline_days: 15, complaint_answer_deadline_days_general: 45, complaint_answer_deadline_days_disability: 20, travel_credit_default_permitted: true, travel_credit_election_bonus_pct: 0.25 }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present per §1.0"
            - "PolicyProfile.${pol_id}.carrier_code == ZQ"
            - "PolicyProfile.${pol_id}.domestic_significant_delay_minutes == 120"
            - "PolicyProfile.${pol_id}.tarmac_deplane_deadline_minutes_international == 210"
            - "PolicyProfile.${pol_id}.travel_credit_election_bonus_pct == 0.25"
            - "PolicyProfile.${pol_id}.report_count == 0"
            - "PolicyProfile.${pol_id}.open_violation_count == 0"
            - "PolicyProfile.${pol_id}.version == 1"

      - name: policy_profile_defaults_applied_when_every_optional_field_omitted
        claim_type: defaults
        grounds: ["entities.PolicyProfile.fields.domestic_significant_delay_minutes", "entities.PolicyProfile.fields.travel_credit_election_bonus_pct"]
        distinguishing_aspect: "POSTing only carrier_code materialises the thirteen declared defaults verbatim — 180/360 delay minutes, 7/20 refund days, 12/30 bag hours, 180/240 tarmac minutes, 30/60/30 complaint days, travel_credit_default_permitted false, bonus 0.10."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
          assert:
            - "PolicyProfile.${pol_id}.domestic_significant_delay_minutes == 180"
            - "PolicyProfile.${pol_id}.international_significant_delay_minutes == 360"
            - "PolicyProfile.${pol_id}.credit_card_refund_deadline_days == 7"
            - "PolicyProfile.${pol_id}.other_method_refund_deadline_days == 20"
            - "PolicyProfile.${pol_id}.bag_delay_threshold_hours_domestic == 12"
            - "PolicyProfile.${pol_id}.bag_delay_threshold_hours_international == 30"
            - "PolicyProfile.${pol_id}.tarmac_deplane_deadline_minutes_domestic == 180"
            - "PolicyProfile.${pol_id}.tarmac_deplane_deadline_minutes_international == 240"
            - "PolicyProfile.${pol_id}.complaint_ack_deadline_days == 30"
            - "PolicyProfile.${pol_id}.complaint_answer_deadline_days_general == 60"
            - "PolicyProfile.${pol_id}.complaint_answer_deadline_days_disability == 30"
            - "PolicyProfile.${pol_id}.travel_credit_default_permitted == false"
            - "PolicyProfile.${pol_id}.travel_credit_election_bonus_pct == 0.1"

      - name: passenger_default_requires_disability_assistance_is_false
        claim_type: defaults
        grounds: ["entities.Passenger.fields.requires_disability_assistance", "entities.Passenger.fields.travel_credit_balance_cents"]
        distinguishing_aspect: "Omitting requires_disability_assistance yields false, and both computed passenger counters start at 0 — a new passenger holds no travel credit and no open complaints."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
          assert:
            - "Passenger.${pax_id}.requires_disability_assistance == false"
            - "Passenger.${pax_id}.travel_credit_balance_cents == 0"
            - "Passenger.${pax_id}.open_complaint_count == 0"
            - "Passenger.${pax_id}.version == 1"

      - name: passenger_retrieval_returns_stored_row
        claim_type: retrieval
        grounds: ["endpoints.GET /compliance/passengers/{id}", "entities.Passenger"]
        distinguishing_aspect: "GET /compliance/passengers/{id} echoes the exact email and full_name persisted by the create call, with the same id."
        test_recipe:
          setup: ["One Passenger exists."]
          setup_api_calls:
            - call: "POST /compliance/passengers"
              payload: { email: "dana@example.com", full_name: "Dana Okoye", requires_disability_assistance: true }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
          trigger:
            - call: "GET /compliance/passengers/${pax_id}"
              payload: {}
              as: RegulatorAuditor
              as_user_id: "auditor_1"
          assert:
            - "HTTP 200 with response_type == object"
            - "Passenger.${pax_id}.email == dana@example.com"
            - "Passenger.${pax_id}.full_name == Dana Okoye"
            - "Passenger.${pax_id}.requires_disability_assistance == true"

      - name: booking_listing_paginated_reports_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints.GET /compliance/bookings", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three bookings stored, limit=2 offset=0 returns exactly 2 rows with total_count == 3 and has_more == true; offset=2 returns 1 row with has_more == false."
        test_recipe:
          setup: ["One PolicyProfile, one Passenger and three Bookings."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "AAA111", total_fare_cents: 10000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk1_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "BBB222", total_fare_cents: 20000, payment_method: "CASH_OR_CHECK" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk2_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "CCC333", total_fare_cents: 30000, payment_method: "MILES" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk3_id: "$.data.id" }
          trigger:
            - call: "GET /compliance/bookings"
              payload: { passenger_id: "${pax_id}", limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "officer_1"
            - call: "GET /compliance/bookings"
              payload: { passenger_id: "${pax_id}", limit: 2, offset: 2 }
              as: ComplianceOfficer
              as_user_id: "officer_1"
          assert:
            - "First response: response_type == array, len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second response: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "The three ids returned across both pages are exactly {${bk1_id}, ${bk2_id}, ${bk3_id}} with no repetition"

      - name: booking_not_found_returns_booking_specific_404
        claim_type: not_found
        grounds: ["validations[priority 10]", "errors[ERR_BOOKING_NOT_FOUND]"]
        distinguishing_aspect: "GET /compliance/bookings/{id} with an id that no row carries returns ERR_BOOKING_NOT_FOUND (404) — the Booking-specific code, not a generic not-found."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /compliance/bookings/bk_missing_0001"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with response_type == error"
            - "data.error_id == ERR_BOOKING_NOT_FOUND"

      - name: passenger_not_found_returns_passenger_specific_404
        claim_type: not_found
        grounds: ["validations[priority 10]", "errors[ERR_PASSENGER_NOT_FOUND]"]
        distinguishing_aspect: "The same missing-id shape on GET /compliance/passengers/{id} returns ERR_PASSENGER_NOT_FOUND, proving priority 10 resolves the error code per entity rather than emitting one shared code."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /compliance/passengers/pax_missing_0001"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_PASSENGER_NOT_FOUND"

      - name: booking_creation_missing_record_locator_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority 20]", "endpoints.POST /compliance/bookings", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "record_locator has source input and no default; omitting it returns ERR_INVALID_REQUEST (400) and no Booking row is written."
        test_recipe:
          setup: ["One PolicyProfile and one Passenger exist."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", total_fare_cents: 10000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /compliance/bookings with passenger_id = ${pax_id} returns total_count == 0"

      - name: booking_computed_ledger_fields_seeded_at_creation
        claim_type: computed_fields
        grounds: ["entities.Booking.fields.collected_total_cents", "entities.Booking.fields.disruption_posture", "endpoints.POST /compliance/bookings"]
        distinguishing_aspect: "A brand-new Booking has collected_total_cents == total_fare_cents (no ancillaries or bags yet), total_refund_obligated_cents == 0, earliest_refund_deadline_utc == null, itinerary_scope == DOMESTIC, disruption_posture == NORMAL and all four counters at 0/false."
        test_recipe:
          setup: ["One PolicyProfile and one Passenger exist."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 90000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
          assert:
            - "Booking.${bk_id}.collected_total_cents == 90000"
            - "Booking.${bk_id}.total_refund_obligated_cents == 0"
            - "Booking.${bk_id}.earliest_refund_deadline_utc == null"
            - "Booking.${bk_id}.itinerary_scope == DOMESTIC"
            - "Booking.${bk_id}.disruption_posture == NORMAL"
            - "Booking.${bk_id}.segment_count == 0"
            - "Booking.${bk_id}.unused_segment_count == 0"
            - "Booking.${bk_id}.travel_commenced == false"
            - "Booking.${bk_id}.suppressed_obligation_count == 0"
            - "Booking.${bk_id}.version == 1"

      - name: flight_segment_system_fields_minted_at_creation
        claim_type: system_fields
        grounds: ["entities.FlightSegment", "endpoints.POST /compliance/bookings/{id}/flight-segments"]
        distinguishing_aspect: "The server mints id, created_at, updated_at and version == 1 on a FlightSegment the client never supplied them for, and the row's computed status/disruption fields start at SCHEDULED/NONE/0/false."
        test_recipe:
          setup: ["One Booking exists with no segments."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 90000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
          assert:
            - "FlightSegment.${seg1_id}.id is a non-empty server-minted string the request never carried"
            - "FlightSegment.${seg1_id}.created_at is set and FlightSegment.${seg1_id}.version == 1"
            - "FlightSegment.${seg1_id}.status == SCHEDULED"
            - "FlightSegment.${seg1_id}.disruption_type == NONE"
            - "FlightSegment.${seg1_id}.delay_minutes == 0"
            - "FlightSegment.${seg1_id}.is_significant_delay == false"
            - "FlightSegment.${seg1_id}.cumulative_tarmac_minutes == 0"
            - "Booking.${bk_id}.segment_count == 1 and Booking.${bk_id}.unused_segment_count == 1 and Booking.${bk_id}.version == 2"

      - name: policy_profile_computed_report_count_in_payload_rejected
        claim_type: computed_fields
        grounds: ["validations[priority 20]", "entities.PolicyProfile.fields.report_count"]
        distinguishing_aspect: "report_count has source computed and is absent from the endpoint's input list, so supplying it is an unknown field — ERR_INVALID_REQUEST (400), not a silently ignored value."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ", report_count: 7 }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "No PolicyProfile row is created"

      - name: booking_payment_method_outside_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Booking.fields.payment_method", "validations[priority 20]"]
        distinguishing_aspect: "payment_method = VOUCHER is outside the declared enum {CREDIT_CARD, CASH_OR_CHECK, TRAVEL_CREDIT, MILES} and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One PolicyProfile and one Passenger exist."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 90000, payment_method: "VOUCHER" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: policy_profile_carrier_code_wrong_length_rejected
        claim_type: type_constraints
        grounds: ["entities.PolicyProfile.fields.carrier_code", "validations[priority 20]"]
        distinguishing_aspect: "carrier_code must be exactly 2 uppercase alphanumerics; the 3-character value ZQX returns ERR_INVALID_REQUEST (400) rather than being truncated."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQX" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: checked_bag_tag_number_wrong_length_rejected
        claim_type: type_constraints
        grounds: ["entities.CheckedBag.fields.tag_number", "validations[priority 20]"]
        distinguishing_aspect: "tag_number must be exactly 10 characters; a 6-character tag returns ERR_INVALID_REQUEST (400) and no CheckedBag is written, so Booking.collected_total_cents stays at the fare."
        test_recipe:
          setup: ["One Booking with total_fare_cents = 50000 exists."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/checked-bags"
              payload: { booking_id: "${bk_id}", tag_number: "BAG001", fee_cents: 4500, checked_at_utc: "2026-08-10T13:00:00Z", scheduled_delivery_utc: "2026-08-10T21:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "Booking.${bk_id}.collected_total_cents == 50000"

      - name: flight_segment_sequence_index_zero_rejected
        claim_type: type_constraints
        grounds: ["entities.FlightSegment.fields.sequence_index", "validations[priority 20]"]
        distinguishing_aspect: "sequence_index must be >= 1; sequence_index = 0 returns ERR_INVALID_REQUEST (400) and Booking.segment_count remains 0."
        test_recipe:
          setup: ["One Booking exists with no segments."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 0, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "Booking.${bk_id}.segment_count == 0 and Booking.${bk_id}.version == 1"

      - name: checked_bag_creation_starts_in_transit_and_raises_collected_total
        claim_type: creation
        grounds: ["entities.CheckedBag", "endpoints.POST /compliance/checked-bags", "calculations.booking_ledger_recompute"]
        distinguishing_aspect: "A new CheckedBag is IN_TRANSIT with delivery_delay_hours == 0 and fee_refund_obligated == false, and its fee immediately raises Booking.collected_total_cents from 50000 to 54500."
        test_recipe:
          setup: ["One Booking with total_fare_cents = 50000 and no bags."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/checked-bags"
