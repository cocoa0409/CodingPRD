          - validations[priority=12]
          - errors[ERR_JOB_NOT_SCHEDULED]
          - errors[ERR_RESIN_LOT_NOT_RELEASED]
          - state_machines.ResinLot.RELEASED_to_HOLD
        distinguishing_aspect: |
          The pair here is category `state` (priority 9) against category `business_safety`
          (priority 12): a second start on an already RUNNING job whose staged lot has since
          gone on HOLD violates both, and the response must be ERR_JOB_NOT_SCHEDULED (409),
          never ERR_RESIN_LOT_NOT_RELEASED (422).
        test_recipe:
          setup:
            - "Mold M-1 PPAP_APPROVED on press P-150; ResinLot L-77 staged; job SCHEDULED then STARTED so run_status is RUNNING."
            - "The staged lot has since been moved RELEASED -> HOLD, so the material safety gate would also fail."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
