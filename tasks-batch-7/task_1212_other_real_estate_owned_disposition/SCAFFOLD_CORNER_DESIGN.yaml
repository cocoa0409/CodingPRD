          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/write-downs", payload: { property_id: "${p_id}", amount: 5000.00, reason: "MARKET_DECLINE" }, as: CreditOfficer, as_user_id: "co-1", captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /api/write-downs/${w_id}/approve", payload: {}, as: PropertyManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (HTTP 403); write-down remains PROPOSED"

      - name: compliance_officer_cannot_create_property_forbidden
        claim_type: role_exclusive_denial
        grounds: [roles.OREOAdmin, roles.ComplianceOfficer, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Property intake is exclusive to OREOAdmin; ComplianceOfficer (extensions, charge-offs) cannot create properties."
