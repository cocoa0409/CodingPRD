  - method: POST
    path: "/fleet/roadside-cases/{caseId}/cancel"
    description: "Cancel an undispatched case (OPEN or TEAM_ASSIGNED to CANCELLED)"
    roles: [FleetOperations]
    code: 200
    input: []
    output: RoadsideCase
    side_effects:
      - "status=CANCELLED"
      - "the assigned team returns to AVAILABLE when it has no other RESPONSE_DISPATCHED case"

