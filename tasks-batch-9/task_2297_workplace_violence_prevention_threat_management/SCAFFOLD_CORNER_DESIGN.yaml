              as_user_id: "${hr_id}"
              captures: { still_id: $.data.id }
            - call: "POST /_ops/daily-run"
              payload: {}
              as: ProgramAdmin
          assert:
            - "The clock call returns HTTP 200 with $.data.current_utc == \"2026-08-21T00:00:00Z\""
            - "The read immediately after the clock call still shows TrainingAssignment.${ta1_id}.status == ASSIGNED - the clock call mutated no row"
            - "Employee.${w1_id}.training_current is still false and Employee.${w1_id}.version is unchanged by the clock call"
            - "The ops run returns HTTP 200 with $.data.training_expired_count == 1"
            - "TrainingAssignment.${ta1_id}.status == EXPIRED after the ops run"
            - "The ops run returns drills_missed_count 0, protective_activated_count 0, protective_expired_count 0, actions_overdue_count 0, log_retention_expired_count 0, plans_review_due_count 0 and plans_rescored_count 0"
      - name: daily_run_step_order_rescores_a_newly_review_due_plan_against_the_restricted_threshold
