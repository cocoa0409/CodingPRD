            - "points_awarded -1 also returns 422 ERR_RUBRIC_POINTS_OUT_OF_RANGE; 0 and 4 are both accepted"
            - "the same call with points_awarded 3 and the foreign outcome ${ocx_id} returns 422 ERR_OUTCOME_NOT_IN_COURSE"
            - "scoring ${oc1_id} with 3 points returns 201 with points_possible == 4, score_ratio_bp == 7500 and outcome_met == true against mastery_threshold_bp 7000"
