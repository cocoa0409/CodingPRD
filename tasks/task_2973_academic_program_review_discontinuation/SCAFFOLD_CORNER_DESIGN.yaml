          rationale: "The named §1.8 instance asserts the whole bubble-up: last open student COMPLETED -> open_student_count 0 -> plan COMPLETED -> program DISCONTINUED and CATALOG_WITHDRAWN -> retained appointment back to ASSIGNED with a full waterfall re-derivation."

