  - rule_id: cross_entity_state_dependency
    instances:
      - name: work_order_create_blocked_when_property_conveyed
        grounds:
          - state_machines.Property.ACTIVE_to_CONVEYED
          - entities.WorkOrder.fields.property_id
          - errors[ERR_PROPERTY_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair WorkOrder -> Property: work-order creation requires the
          referenced Property in status ACTIVE; after convey the same create
          fails with ERR_PROPERTY_NOT_ACTIVE even though all body fields are valid.
        test_recipe:
          setup:
            - "Property P conveyed to investor (no open work orders); FHA/GRASS_CUT allowable present"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer N", code: "SVCN" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "GRASS_CUT", max_per_occurrence_cents: 3000, max_occurrences_per_calendar_year: 20, aggregate_cap_cents_per_property_year: 60000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "91 Alder St", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 4700, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/properties/${p}/convey", payload: {}, as: Servicer, as_user_id: "${sv}" }
          trigger:
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "GRASS_CUT", due_date: "2026-08-20" }, as: Servicer, as_user_id: "${sv}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PROPERTY_NOT_ACTIVE — valid body, wrong property lifecycle state"

      - name: bid_submit_blocked_after_competing_approval
        grounds:
          - state_machines.Bid.DRAFT_to_SUBMITTED
          - state_machines.DamageReport.BID_REQUESTED_to_REPAIR_IN_PROGRESS
          - entities.Bid.fields.damage_report_id
          - errors[ERR_DAMAGE_NOT_ACCEPTING_BIDS]
        distinguishing_aspect: |
          Entity pair Bid -> DamageReport (different pair from the
          WorkOrder -> Property instance): once a competing bid's approval moved
          the damage report to REPAIR_IN_PROGRESS, a still-DRAFT bid can no
          longer be submitted — ERR_DAMAGE_NOT_ACCEPTING_BIDS.
        test_recipe:
          setup:
            - "Damage report in BID_REQUESTED with bid1 (crew1) DRAFT and bid2 (crew2) DRAFT; FHA/DAMAGE_REPAIR allowable present"
            - "bid1 submitted and approved -> report REPAIR_IN_PROGRESS; bid2 remains DRAFT (cascade rejects only SUBMITTED/COUNTERED bids)"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer O", code: "SVCO" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 14", crew_code: "CR14" }, as: VendorAdmin, captures: { cr1: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 15", crew_code: "CR15" }, as: VendorAdmin, captures: { cr2: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "DAMAGE_REPAIR", max_per_occurrence_cents: 250000, max_occurrences_per_calendar_year: 5, aggregate_cap_cents_per_property_year: 900000, requires_bid_over_cents: 99999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "101 Hickory Dr", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 6400, heating_system: "FORCED_AIR", fixture_count: 6 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/damage-reports", payload: { property_id: "${p}", damage_type: "STORM", severity: "MODERATE", is_interior: false, description: "roof shingles torn" }, as: FieldCrew, as_user_id: "${cr1}", captures: { dr: $.data.id } }
            - { call: "POST /preservation/damage-reports/${dr}/triage", payload: {}, as: VendorAdmin }
            - { call: "POST /preservation/damage-reports/${dr}/request-bids", payload: {}, as: VendorAdmin, captures: { dr_v: $.data.version } }
            - { call: "POST /preservation/damage-reports/${dr}/bids", payload: { amount_cents: 80000, expected_damage_report_version: "${dr_v}" }, as: FieldCrew, as_user_id: "${cr1}", captures: { b1: $.data.id } }
            - { call: "POST /preservation/damage-reports/${dr}/bids", payload: { amount_cents: 75000, expected_damage_report_version: "${dr_v} + 1" }, as: FieldCrew, as_user_id: "${cr2}", captures: { b2: $.data.id } }
            - { call: "POST /preservation/bids/${b1}/submit", payload: {}, as: FieldCrew, as_user_id: "${cr1}" }
            - { call: "POST /preservation/bids/${b1}/approve", payload: {}, as: Servicer, as_user_id: "${sv}" }
          trigger:
            - { call: "POST /preservation/bids/${b2}/submit", payload: {}, as: FieldCrew, as_user_id: "${cr2}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DAMAGE_NOT_ACCEPTING_BIDS — report left BID_REQUESTED when bid1 was approved"
            - "Bid.${b2}.status remains DRAFT"

  - rule_id: resource_temporal_overlap
    instances:
      - name: registration_half_open_adjacency
        grounds:
          - calculations.registration_overlap
          - state_machines.MunicipalRegistration.PENDING_to_ACTIVE
          - errors[ERR_REGISTRATION_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on MunicipalRegistration: [2026-07-01,
          2027-01-01) adjacent to ACTIVE [2026-01-01, 2026-07-01) is allowed
          (touching endpoints do not overlap), while [2026-06-30, 2026-12-01)
          collides by one day and is rejected.
        test_recipe:
          setup:
            - "Property P; registration r1 ACTIVE for [2026-01-01, 2026-07-01) in municipality COL"
            - "r2 PENDING [2026-07-01, 2027-01-01); r3 PENDING [2026-06-30, 2026-12-01)"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer P", code: "SVCP" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "111 Elmwood Ave", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 4900, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/registrations", payload: { property_id: "${p}", municipality_code: "COL", registration_number: "REG-1", fee_cents: 25000, valid_from: "2026-01-01", valid_to: "2026-07-01" }, as: VendorAdmin, captures: { r1: $.data.id } }
            - { call: "POST /preservation/registrations/${r1}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /preservation/registrations", payload: { property_id: "${p}", municipality_code: "COL", registration_number: "REG-2", fee_cents: 25000, valid_from: "2026-07-01", valid_to: "2027-01-01" }, as: VendorAdmin, captures: { r2: $.data.id } }
            - { call: "POST /preservation/registrations", payload: { property_id: "${p}", municipality_code: "COL", registration_number: "REG-3", fee_cents: 25000, valid_from: "2026-06-30", valid_to: "2026-12-01" }, as: VendorAdmin, captures: { r3: $.data.id } }
          trigger:
            - { call: "POST /preservation/registrations/${r2}/activate", payload: {}, as: VendorAdmin, captures: { r2_status: $.data.status } }
            - { call: "POST /preservation/registrations/${r3}/activate", payload: {}, as: VendorAdmin, captures: { r3_err: $.data.error_id } }
          assert:
            - "r2_status == ACTIVE — adjacency at 2026-07-01 is not an overlap (half-open windows)"
            - "r3_err == ERR_REGISTRATION_OVERLAP — one-day collision with r1's window"

      - name: crew_day_aggregate_capacity
        grounds:
          - calculations.crew_day_capacity
          - entities.Crew.fields.daily_capacity_jobs
          - state_machines.WorkOrder.ISSUED_to_ASSIGNED
          - errors[ERR_CREW_DAY_CAPACITY]
        distinguishing_aspect: |
          Aggregate-capacity semantics on Crew (different resource and different
          interval treatment from the registration half-open windows): the
          calendar date is a bucket, the count of ASSIGNED/IN_PROGRESS orders is
          capped at daily_capacity_jobs (2), and the boundary rejects at count
          >= capacity with no slot geometry.
        test_recipe:
          setup:
            - "Crew with daily_capacity_jobs 2; three INSPECTION work orders wo1/wo2/wo3 on property P, all targeted at 2026-08-05"
            - "wo1 and wo2 assigned (bucket full)"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer Q", code: "SVCQ" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 16", crew_code: "CR16", daily_capacity_jobs: 2 }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "INSPECTION", max_per_occurrence_cents: 5000, max_occurrences_per_calendar_year: 30, aggregate_cap_cents_per_property_year: 100000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "121 Juniper Rd", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5100, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "INSPECTION", due_date: "2026-08-12" }, as: Servicer, as_user_id: "${sv}", captures: { wo1: $.data.id, wo1_v: $.data.version } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "INSPECTION", due_date: "2026-08-12" }, as: Servicer, as_user_id: "${sv}", captures: { wo2: $.data.id } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "INSPECTION", due_date: "2026-08-12" }, as: Servicer, as_user_id: "${sv}", captures: { wo3: $.data.id } }
            - { call: "POST /preservation/work-orders/${wo1}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-05" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo2}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-05" }, as: Dispatcher }
          trigger:
            - { call: "POST /preservation/work-orders/${wo3}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-05" }, as: Dispatcher, captures: { err_full: $.data.error_id } }
            - { call: "POST /preservation/work-orders/${wo1}/reassign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-06", expected_work_order_version: "${wo1_v} + 1" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo3}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-05" }, as: Dispatcher, captures: { wo3_status: $.data.status } }
          assert:
            - "err_full == ERR_CREW_DAY_CAPACITY — count 2 >= capacity 2 on 2026-08-05"
            - "After wo1 moves to 2026-08-06 the bucket has room: wo3_status == ASSIGNED"

  - rule_id: compensating_invariant
    instances:
      - name: invoice_approve_void_ytd_invariant
        grounds:
          - calculations.ytd_rollup
          - state_machines.Invoice.SUBMITTED_to_APPROVED
          - state_machines.Invoice.APPROVED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity is fiscal cents: Property.ytd_investor_approved_cents
          must equal the sum of approved_amount_cents over invoices in
          APPROVED/PARTIALLY_APPROVED/PAID; an approve (+50000) paired with its
          compensating void (-50000) returns ytd to exactly its prior value 0.
        test_recipe:
          setup:
            - "Property P, ytd 0; completed BOARD_UP work order with invoice i1 carrying one 50000-cent line"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer R", code: "SVCR" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 17", crew_code: "CR17" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "BOARD_UP", max_per_occurrence_cents: 100000, max_occurrences_per_calendar_year: 5, aggregate_cap_cents_per_property_year: 500000, requires_bid_over_cents: 99999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "131 Magnolia St", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5600, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "BOARD_UP", due_date: "2026-08-10" }, as: Servicer, as_user_id: "${sv}", captures: { wo: $.data.id } }
            - { call: "POST /preservation/work-orders/${wo}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-02" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo}/start", payload: {}, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "BEFORE", taken_at: "2026-08-02T09:00:00Z", content_hash: "r1b" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "AFTER", taken_at: "2026-08-02T10:00:00Z", content_hash: "r1a1" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "AFTER", taken_at: "2026-08-02T10:05:00Z", content_hash: "r1a2" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/submit", payload: { submitted_cost_cents: 50000 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/approve", payload: {}, as: QualityReviewer }
            - { call: "POST /preservation/work-orders/${wo}/complete", payload: {}, as: QualityReviewer }
            - { call: "GET /preservation/invoices?work_order_id=${wo}", as: VendorAdmin, captures: { inv: $.data.0.id } }
            - { call: "POST /preservation/invoices/${inv}/lines", payload: { item_code: "BOARD_UP", quantity: 1, unit_price_cents: 50000 }, as: VendorAdmin }
            - { call: "POST /preservation/invoices/${inv}/submit", payload: {}, as: VendorAdmin }
            - { call: "GET /preservation/properties/${p}", as: VendorAdmin, captures: { ytd_pre: $.data.ytd_investor_approved_cents } }
          trigger:
            - { call: "POST /preservation/invoices/${inv}/approve", payload: {}, as: Servicer, as_user_id: "${sv}", captures: { appr: $.data.approved_amount_cents } }
            - { call: "GET /preservation/properties/${p}", as: VendorAdmin, captures: { ytd_mid: $.data.ytd_investor_approved_cents } }
            - { call: "POST /preservation/invoices/${inv}/void", payload: { reason: "duplicate submission" }, as: Servicer, as_user_id: "${sv}" }
            - { call: "GET /preservation/properties/${p}", as: VendorAdmin, captures: { ytd_post: $.data.ytd_investor_approved_cents } }
          assert:
            - "ytd_pre == 0"
            - "appr == 50000 and ytd_mid == 50000 — approve adds exactly approved_amount_cents"
            - "ytd_post == 0 == ytd_pre — approve+void conserves ytd_investor_approved_cents; no drift"

      - name: recurring_generation_cancel_budget_invariant
        grounds:
          - calculations.recurring_generation
          - state_machines.WorkOrder.ISSUED_to_CANCELLED
          - entities.RecurringServicePlan.fields.generated_this_season
        distinguishing_aspect: |
          Conserved quantity is a season occurrence budget (count, not cents):
          generating a work order consumes one unit and cancelling that generated
          order restores exactly one unit, so generate -> cancel -> generate
          yields a fresh order and generated_this_season ends at 1, never 2.
        test_recipe:
          setup:
            - "ACTIVE grass-cut plan (season 08-01..08-31, interval_days 1, max_per_season 2); clock 2026-08-01"
            - "First sweep generates g1 (budget 1 consumed)"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer S", code: "SVCS" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "GRASS_CUT", max_per_occurrence_cents: 3000, max_occurrences_per_calendar_year: 20, aggregate_cap_cents_per_property_year: 60000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "141 Dogwood Ln", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/recurring-plans", payload: { property_id: "${p}", service_type: "GRASS_CUT", season_start_md: "08-01", season_end_md: "08-31", interval_days: 1, max_per_season: 2 }, as: VendorAdmin, captures: { plan: $.data.id } }
            - { call: "POST /preservation/ops/run-daily-sweep", payload: {}, as: VendorAdmin, captures: { g1: "$.data.generated_work_order_ids[0]" } }
            - { call: "GET /preservation/recurring-plans/${plan}", as: VendorAdmin, captures: { gen_mid: $.data.generated_this_season } }
          trigger:
            - { call: "POST /preservation/work-orders/${g1}/cancel", payload: { reason: "servicer stop" }, as: Servicer, as_user_id: "${sv}" }
            - { call: "GET /preservation/recurring-plans/${plan}", as: VendorAdmin, captures: { gen_after_cancel: $.data.generated_this_season } }
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/ops/run-daily-sweep", payload: {}, as: VendorAdmin, captures: { g2: "$.data.generated_work_order_ids[0]" } }
            - { call: "GET /preservation/recurring-plans/${plan}", as: VendorAdmin, captures: { gen_final: $.data.generated_this_season } }
          assert:
            - "gen_mid == 1 — generation consumed one season unit"
            - "gen_after_cancel == 0 — cancellation compensated exactly one unit"
            - "g2 is non-null — restored budget allowed regeneration on the next interval day"
            - "gen_final == 1 — budget accounting conserved: generated(1) + cancelled-compensation(1) + regenerated(1) nets to 1"
