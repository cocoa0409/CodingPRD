        as_user_id: proca1
        captures:
          po5: $.data.id
          po5_v: $.data.version
      - call: POST /v1/organizations/${org5}/purchase-orders/${po5}/approve
        payload:
          expected_purchase_order_version: ${po5_v}
        as: SecurityAdmin
        as_user_id: seca1
      - call: POST /v1/organizations/${org5}/purchase-orders/${po5}/ship
        payload: {}
        as: LogisticsCoordinator
        as_user_id: logc1
      - call: POST /v1/organizations/${org5}/purchase-orders/${po5}/receive
        payload: {}
        as: LogisticsCoordinator
        as_user_id: logc1
      - call: POST /v1/organizations/${org5}/purchase-orders/${po5}/keys
        payload:
          keys:
          - serial_number: G-001
            firmware_version: 5.4.3
        as: LogisticsCoordinator
        as_user_id: logc1
        captures:
          k5: $.data[0].id
      - call: POST /v1/organizations/${org5}/employees
        payload:
          employee_ref: E-G1
          location: HQ
          directory_user_id: u-g1
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          acct5: $.data.identity_account_id
      trigger:
      - call: POST /v1/organizations/${org5}/security-keys/${k5}/attest
        payload: {}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          att5: $.data.attestation_status
          hw5a: $.data.hardware_status
      - call: POST /v1/organizations/${org5}/security-keys/${k5}/assign
        payload:
          identity_account_id: ${acct5}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          hw5b: $.data.hardware_status
          att5b: $.data.attestation_status
      - call: POST /v1/organizations/${org5}/security-keys/${k5}/mark-distributed
        payload: {}
        as: LogisticsCoordinator
        as_user_id: logc1
        captures:
          hw5c: $.data.hardware_status
          att5c: $.data.attestation_status
      - call: POST /v1/organizations/${org5}/security-keys/${k5}/revoke
        payload: {}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          hw5d: $.data.hardware_status
          att5d: $.data.attestation_status
      assert:
      - hw5a == PRE_REGISTERED and att5 == VERIFIED (attestation dimension moved alone)
      - hw5b == ASSIGNED and att5b == VERIFIED
      - hw5c == DISTRIBUTED and att5c == VERIFIED
      - hw5d == REVOKED and att5d == VERIFIED (hardware revoke leaves attestation untouched)
- rule_id: transitive_cascade
  instances:
  - name: quarantine_cascades_order_key_enrollment_account
    grounds:
    - state_machines.PurchaseOrder.RECEIVED_to_QUARANTINED
    - state_machines.SecurityKey
    - state_machines.EnrollmentCeremony
    - calculations.backup_key_compliance
    distinguishing_aspect: 'Depth-4 chain from ONE trigger (quarantine): order RECEIVED ->

      QUARANTINED mutates keys (each -> REVOKED); each key revocation

      itself triggers its binding ceremony -> REVOKED; that ceremony

      revocation triggers account counter recomputation; the recomputation

      triggers account ENROLLED -> LOCKED when the count reaches 0. Every

      link is caused by the previous link, not by the quarantine directly.

      '
    test_recipe:
      setup:
      - ORG6 (STANDARD/STANDARD, idp [FIDO2], minimum 2)
      - KeyModel M-H; employee + account ACCT6; RECEIVED order PO6 with one VERIFIED DISTRIBUTED key K6 and one ACTIVE enrollment EN6
