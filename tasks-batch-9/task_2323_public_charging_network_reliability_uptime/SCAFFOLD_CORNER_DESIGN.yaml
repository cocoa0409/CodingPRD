          setup:
            - "Logical clock at 2026-08-01T00:00:00Z (default)."
            - "HostSite HS-1 with committed_service_capacity_kw 800.00 and TWENTY_FOUR_SEVEN access, so no access-window push applies."
            - "Station ST-1, power_class DCFC_350, two CERTIFIED 350 kW ports DS-1 and DS-2, commissioned and OPERATIONAL."
