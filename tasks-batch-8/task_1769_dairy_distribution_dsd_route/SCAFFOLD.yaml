# =============================================================================
# PRD Benchmark Scaffold: Dairy Distribution & DSD Route
# =============================================================================

scenario: |
  Dairy Distribution & DSD Route (Prairie Farms DSD route): route order & standing par by store, code-date rotation & pull policy, returns/credit for out-of-code, refrigerated truck temperature log, milk price formula & pass-through, backhaul & crate/case return, store-door merchandising labor, route sale & territory ownership

domain_name: dairy-dsd-route
api_prefix: /dairy

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine          # regulated milk pass-through pricing, tiered surcharges, dual provisional/final variants
  secondary_archetype: compliance_audit      # cold-chain temperature log, code-date pull policy, adjudication trail
  complexity_layers:
    - dual_variant_calculation               # provisional vs final milk price; ORIGINAL vs CURRENT return credit basis
    - cascading_side_effects                 # QA breach cascade (5 levels); store deactivation cascade (3 levels)
    - optimistic_concurrency                 # OCC on Store.version / PricingPeriod.version
    - rate_threshold_triggers                # cumulative excursion minutes + instantaneous critical-temp spike
  entity_topology: flat                      # peer entities linked by FK references; sub-resource paths are conveniences only
  state_machine_shape: cyclic                # Route ACTIVE<->SUSPENDED, Store ACTIVE<->INACTIVE, Return REJECTED<->DISPUTED, Listing LISTED<->OFFER_PENDING; plus parallel dims on RouteOrder and branching on TruckTrip
  relationship_patterns:
    - one_to_many                            # Route->Store, Trip->Order, Order->Invoice, Return->CreditMemo
    - cross_aggregate                        # Return references Order/Store/Trip; CreditMemo references Return/Store/Invoice
    - self_referential                       # PriceAnnouncement.supersedes_announcement_id
  role_model: segregation_of_duties          # driver submits / owner approves; seller vs buyer vs TerritoryManager; owner-only crate adjustments
  consistency_model: immediate               # all mutations and derived-field recomputes visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Distributor business name" }
      - { name: license_number, type: string, source: input, description: "State dairy distributor license; unique across distributors (violation -> ERR_INVALID_REQUEST)" }
      - { name: credit_terms_days, type: integer, source: input, default: 7, description: "Days a store may carry an open invoice" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; current owner; rewritten only by listing approve-transfer" }
      - { name: route_code, type: string, source: input, description: "Unique route code (violation -> ERR_INVALID_REQUEST)" }
      - { name: name, type: string, source: input, description: "Route name" }
      - { name: service_weekdays, type: array, source: input, description: "Array of weekday codes MON..SUN the route runs" }
      - { name: credit_price_basis, type: enum, source: input, default: "ORIGINAL", description: "ORIGINAL | CURRENT; selects return-credit unit price basis (dual-variant selector)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | RETIRED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; employer" }
      - { name: name, type: string, source: input, description: "Driver name" }
      - { name: cdl_class, type: enum, source: input, description: "A | B" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id; route serving this store" }
      - { name: store_code, type: string, source: input, description: "Unique store code (violation -> ERR_INVALID_REQUEST)" }
      - { name: name, type: string, source: input, description: "Store name" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Max open AR + estimated new order subtotal allowed (reject only when strictly greater)" }
      - { name: pull_window_days, type: integer, source: input, default: 4, description: "Pull-policy window: product with 0 <= days_to_expiry <= pull_window_days must be pulled" }
      - { name: crate_deposit_cents, type: integer, source: input, default: 400, description: "Deposit liability per outstanding crate" }
      - { name: merchandising_rate_cents_per_min, type: integer, source: input, default: 0, description: "Store-billed rate for billable merchandising minutes" }
      - { name: free_merchandising_minutes, type: integer, source: input, default: 15, description: "Per-visit free merchandising allowance before billing" }
      - { name: dock_open_min, type: integer, source: input, default: 480, description: "Default dock window open, minutes from midnight local (08:00)" }
      - { name: dock_close_min, type: integer, source: input, default: 720, description: "Default dock window close, minutes from midnight (12:00)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE; initial ACTIVE" }
      - { name: crate_balance, type: integer, source: computed, default: 0, description: "= SUM(DROP.crate_count) - SUM(PICKUP.crate_count) + SUM(ADJUSTMENT.signed_crate_count); may not go negative" }
      - { name: open_ar_cents, type: integer, source: computed, default: 0, description: "= SUM(amount_due_cents) over this store's Invoices with status OPEN" }
      - { name: deposit_liability_cents, type: integer, source: computed, default: 0, description: "= crate_balance * crate_deposit_cents" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique SKU (violation -> ERR_INVALID_REQUEST)" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: units_per_case, type: integer, source: input, description: "Sellable units per case; case count per line = ceil(quantity_units / units_per_case)" }
      - { name: weight_lbs_per_unit, type: number, source: input, default: 8.6, description: "Pounds per unit; converts $/cwt to per-unit (1 gallon milk = 8.6 lb)" }
      - { name: shelf_life_days, type: integer, source: input, description: "Days from pack to code date" }
      - { name: regulated, type: boolean, source: input, description: "true => price from milk pass-through formula; false => flat list_price_cents" }
      - { name: list_price_cents, type: number, source: input, default: 0, description: "Flat per-unit price when regulated=false" }
      - { name: margin_cents_per_unit, type: number, source: input, default: 0, description: "Distributor margin added after fuel surcharge when regulated=true" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED; initial ACTIVE" }

  - name: StandingPar
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id (path store)" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: par_mon, type: integer, source: input, default: 0, description: "Monday par in units" }
      - { name: par_tue, type: integer, source: input, default: 0, description: "Tuesday par" }
      - { name: par_wed, type: integer, source: input, default: 0, description: "Wednesday par" }
      - { name: par_thu, type: integer, source: input, default: 0, description: "Thursday par" }
      - { name: par_fri, type: integer, source: input, default: 0, description: "Friday par" }
      - { name: par_sat, type: integer, source: input, default: 0, description: "Saturday par" }
      - { name: par_sun, type: integer, source: input, default: 0, description: "Sunday par" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED; at most one ACTIVE par per (store_id, product_id); a new POST supersedes the prior ACTIVE par" }

  - name: PricingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: month, type: string, source: input, description: "YYYY-MM; unique (violation -> ERR_INVALID_REQUEST)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; initial OPEN; close requires a FINAL announcement to exist" }
      - { name: current_provisional_id, type: string, source: computed, description: "id of the ACTIVE PROVISIONAL PriceAnnouncement, or null" }
      - { name: current_final_id, type: string, source: computed, description: "id of the ACTIVE FINAL PriceAnnouncement, or null" }

  - name: PriceAnnouncement
    parent: null
    common_fields: true
    fields:
      - { name: pricing_period_id, type: string, source: system, description: "FK -> PricingPeriod.id (path period)" }
      - { name: kind, type: enum, source: input, description: "PROVISIONAL | FINAL" }
      - { name: class_i_base_cents_per_cwt, type: integer, source: input, description: "Announced Class I base price per hundredweight" }
      - { name: processor_assessment_cents_per_cwt, type: integer, source: input, description: "Processor assessment per cwt" }
      - { name: hauling_cents_per_cwt, type: integer, source: input, description: "Hauling charge per cwt" }
      - { name: diesel_index_cents, type: integer, source: input, description: "Diesel price index in cents/gallon; selects fuel surcharge tier" }
      - { name: supersedes_announcement_id, type: string, source: system, description: "FK -> PriceAnnouncement.id; the prior ACTIVE announcement of same kind in this period, or null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED" }

  - name: TruckTrip
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; must belong to route's owning distributor" }
      - { name: service_date, type: string, source: input, description: "YYYY-MM-DD the route is run" }
      - { name: truck_plate, type: string, source: input, description: "Refrigerated truck plate" }
      - { name: case_capacity, type: integer, source: input, description: "Truck capacity in cases" }
      - { name: planned_depart_at, type: datetime, source: input, description: "Planned departure (UTC)" }
      - { name: planned_return_at, type: datetime, source: input, description: "Planned return (UTC); must be > planned_depart_at" }
      - { name: status, type: enum, source: system, description: "PLANNED | DEPARTED | COMPLETED | QA_REVIEW | BREACH_CONFIRMED | RECONCILED | CANCELLED" }
      - { name: excursion_minutes, type: number, source: computed, default: 0, description: "Cumulative minutes BOX zone readings stayed > 40.0F (step function, 2 decimals)" }
      - { name: cold_chain_breach, type: boolean, source: computed, default: false, description: "true when excursion_minutes >= 45.0 or any single BOX reading > 50.0F" }
      - { name: loaded_cases, type: integer, source: computed, default: 0, description: "Reserved case load = SUM over CONFIRMED orders of their case counts" }
      - { name: delivered_cases, type: integer, source: computed, default: 0, description: "SUM over DELIVERED orders of their delivered case counts" }

  - name: TemperatureReading
    parent: null
    common_fields: false
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> TruckTrip.id (path trip)" }
      - { name: recorded_at, type: datetime, source: input, description: "UTC timestamp; must be strictly greater than the previous reading's recorded_at on this trip and <= current clock" }
      - { name: temp_tenths_f, type: integer, source: input, description: "Temperature in tenths of a degree F (385 = 38.5F)" }
      - { name: zone, type: enum, source: input, description: "CAB | BOX; only BOX feeds excursion math" }

  - name: RouteOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: trip_id, type: string, source: input, description: "FK -> TruckTrip.id; must serve the store's route on service_date" }
      - { name: service_date, type: string, source: system, description: "Copied from trip.service_date" }
      - { name: source, type: enum, source: system, description: "PAR_GENERATED | MANUAL" }
      - { name: lines, type: array, source: input, description: "Array of {product_id, quantity_units}; at confirm each line gains cases=ceil(quantity_units/units_per_case); at deliver each line gains delivered_units, scanned_code_date, unit_price_cents, line_amount_cents, cold_chain_flag" }
      - { name: delivery_window_start, type: datetime, source: input, description: "Dock appointment start (UTC)" }
      - { name: delivery_window_end, type: datetime, source: input, description: "Dock appointment end (UTC); must be > start" }
      - { name: fulfillment_status, type: enum, source: system, description: "PLANNED | CONFIRMED | DELIVERED | CANCELLED (independent axis)" }
      - { name: payment_status, type: enum, source: system, description: "UNINVOICED | INVOICED | PARTIALLY_PAID | PAID (derived axis, mirrors its Invoice)" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "SUM of line_amount_cents (per-line rounding pinned by invoice_line_rounding)" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> RouteOrder.id (1:1; created at delivery)" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id (copied from order)" }
      - { name: invoice_month, type: string, source: system, description: "YYYY-MM of service_date; selects PricingPeriod" }
      - { name: pricing_basis, type: enum, source: system, description: "FINAL if that period has an ACTIVE FINAL announcement at delivery, else PROVISIONAL" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Per-line rounded then summed (see invoice_line_rounding)" }
      - { name: discount_cents, type: integer, source: computed, description: "Volume discount; tier keyed on PRE-DISCOUNT subtotal (see invoice_volume_discount)" }
      - { name: total_cents, type: integer, source: computed, description: "= subtotal_cents - discount_cents" }
      - { name: credits_applied_cents, type: integer, source: computed, default: 0, description: "Credit memo applications against this invoice" }
      - { name: payments_applied_cents, type: integer, source: computed, default: 0, description: "Payments recorded against this invoice" }
      - { name: amount_due_cents, type: integer, source: computed, description: "= total_cents - credits_applied_cents - payments_applied_cents" }
      - { name: true_up_delta_cents, type: integer, source: computed, default: 0, description: "Reprice delta applied when a FINAL announcement supersedes provisional pricing on this OPEN invoice" }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED | VOID; auto-SETTLED when amount_due_cents reaches 0" }

  - name: Return
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> RouteOrder.id (originating delivery)" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id (copied from order; must match any caller-supplied store context)" }
      - { name: pickup_trip_id, type: string, source: input, description: "FK -> TruckTrip.id; trip physically collecting the product (backhaul leg)" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must appear among the order's delivered lines" }
      - { name: quantity_units, type: integer, source: input, description: "Units being returned" }
      - { name: reason_code, type: enum, source: input, description: "OUT_OF_CODE | PULL_POLICY | DAMAGED; COLD_CHAIN is system-created only" }
      - { name: scanned_code_date, type: string, source: input, description: "Code date scanned off the product (YYYY-MM-DD)" }
      - { name: days_to_expiry_at_scan, type: integer, source: computed, description: "= scanned_code_date - current clock date, in days (negative = out of code)" }
      - { name: credit_pct, type: number, source: computed, description: "OUT_OF_CODE 1.0 | PULL_POLICY 1.0 | DAMAGED 0.5 | COLD_CHAIN 1.0" }
      - { name: unit_credit_cents, type: number, source: computed, description: "Basis unit price per route.credit_price_basis (see return_credit_amount)" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "= round_half_up(quantity_units * unit_credit_cents * credit_pct)" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | APPROVED | CREDITED | REJECTED | DISPUTED; initial UNDER_REVIEW" }

  - name: CreditMemo
    parent: null
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> Return.id (source return)" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id (copied from return)" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; invoice this memo is currently applied to, or null" }
      - { name: amount_cents, type: integer, source: system, description: "= source return's credit_amount_cents" }
      - { name: applied_cents, type: integer, source: computed, default: 0, description: "Amount currently applied to invoices" }
      - { name: remaining_cents, type: integer, source: computed, description: "= amount_cents - applied_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_APPLIED | APPLIED | VOID" }

  - name: CrateTransaction
    parent: null
    common_fields: false
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id (path store)" }
      - { name: kind, type: enum, source: input, description: "PICKUP | ADJUSTMENT (DROP is system-created at delivery only)" }
      - { name: crate_count, type: integer, source: input, description: "Positive for PICKUP; signed non-zero for ADJUSTMENT (negative reduces balance)" }
      - { name: service_date, type: string, source: system, description: "Current clock date" }
      - { name: note, type: string, source: input, description: "Free-text note" }

  - name: MerchandisingSession
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> TruckTrip.id (path trip)" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; must be on the trip's route" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id (copied from trip)" }
      - { name: check_in_at, type: datetime, source: system, description: "Server clock at creation" }
      - { name: check_out_at, type: datetime, source: system, description: "Server clock at close" }
      - { name: minutes, type: integer, source: computed, description: "= ceil((check_out_at - check_in_at)/60s); must be > 0" }
      - { name: billable_minutes, type: integer, source: computed, description: "= max(0, minutes - store.free_merchandising_minutes)" }
      - { name: labor_charge_cents, type: integer, source: computed, description: "= billable_minutes * store.merchandising_rate_cents_per_min" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: RouteSaleListing
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id; must be owned by seller and not already on a non-terminal listing" }
      - { name: seller_distributor_id, type: string, source: system, description: "FK -> Distributor.id (== X-User-ID at creation)" }
      - { name: asking_price_cents, type: integer, source: input, description: "Asking price" }
      - { name: trailing_weeks, type: integer, source: input, default: 12, description: "Valuation window length in weeks" }
      - { name: territory_value_cents, type: integer, source: computed, description: "= TERRITORY_MULTIPLIER * average weekly net sales over trailing window (see territory_valuation)" }
      - { name: buyer_distributor_id, type: string, source: system, description: "FK -> Distributor.id; set by submit-offer, cleared by reject-offer; null otherwise" }
      - { name: offer_price_cents, type: integer, source: system, description: "Set by submit-offer; cleared by reject-offer" }
      - { name: status, type: enum, source: system, description: "DRAFT | LISTED | OFFER_PENDING | UNDER_CONTRACT | CLOSED | WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Route
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /dairy/routes/{id}/activate"
        actor: TerritoryManager
        preconditions:
          - "Route in DRAFT or SUSPENDED (else ERR_ROUTE_NOT_ACTIVE)"
          - "Route has at least one Store with status ACTIVE (ERR_ROUTE_NOT_ACTIVE)"
        side_effects: ["status -> ACTIVE"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dairy/routes/{id}/activate"
        actor: TerritoryManager
        preconditions:
          - "Route in DRAFT or SUSPENDED (else ERR_ROUTE_NOT_ACTIVE)"
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dairy/routes/{id}/suspend"
        actor: TerritoryManager
        preconditions:
          - "Route in ACTIVE (else ERR_ROUTE_NOT_ACTIVE)"
        side_effects:
          - "status -> SUSPENDED; blocks order confirm and generate-orders (ERR_ROUTE_NOT_ACTIVE)"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /dairy/routes/{id}/retire"
        actor: TerritoryManager
        preconditions:
          - "Route in ACTIVE or SUSPENDED (else ERR_ROUTE_NOT_ACTIVE)"
          - "No RouteOrder on this route in PLANNED or CONFIRMED (ERR_ROUTE_HAS_OPEN_ORDERS)"
          - "No RouteSaleListing for this route in DRAFT, LISTED, OFFER_PENDING, or UNDER_CONTRACT (ERR_ROUTE_HAS_OPEN_ORDERS)"
        side_effects:
          - "status -> RETIRED"
          - "Cascade: every Store on this route with status ACTIVE -> INACTIVE"
          - "Cascade (depth 2): every RouteOrder on those stores in PLANNED -> CANCELLED (order trip loaded_cases recomputed; none can exist given precondition, so no CONFIRMED orders are touched)"
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /dairy/routes/{id}/retire"
        actor: TerritoryManager
        preconditions:
          - "Route in ACTIVE or SUSPENDED (else ERR_ROUTE_NOT_ACTIVE)"
          - "No RouteOrder on this route in PLANNED or CONFIRMED (ERR_ROUTE_HAS_OPEN_ORDERS)"
          - "No open RouteSaleListing (ERR_ROUTE_HAS_OPEN_ORDERS)"
        side_effects:
          - "Same cascade as ACTIVE -> RETIRED"

  - entity: Store
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /dairy/stores/{id}/deactivate"
        actor: DistributorOwner
        preconditions:
          - "Store in ACTIVE (else ERR_STORE_NOT_ACTIVE)"
          - "No RouteOrder for this store in CONFIRMED (ERR_STORE_HAS_CONFIRMED_ORDERS)"
        side_effects:
          - "status -> INACTIVE"
          - "Cascade (depth 2): every RouteOrder for this store in PLANNED -> CANCELLED"
          - "Cascade (depth 3): each cancelled order releases its reserved cases; its trip's loaded_cases recomputed (sum over remaining CONFIRMED orders)"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /dairy/stores/{id}/reactivate"
        actor: DistributorOwner
        preconditions:
          - "Store in INACTIVE (else ERR_STORE_NOT_ACTIVE)"
          - "Store's Route in ACTIVE (ERR_ROUTE_NOT_ACTIVE)"
        side_effects: ["status -> ACTIVE"]

  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /dairy/products/{id}/discontinue"
        actor: TerritoryManager
        preconditions:
          - "Product in ACTIVE (else ERR_PRODUCT_DISCONTINUED)"
        side_effects:
          - "status -> DISCONTINUED; excluded from future generate-orders lines and rejected in new manual order lines (ERR_PRODUCT_DISCONTINUED)"

  - entity: PricingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /dairy/pricing-periods/{id}/close"
        actor: MarketAdministrator
        preconditions:
          - "Period in OPEN (else ERR_PERIOD_CLOSED)"
          - "An ACTIVE FINAL PriceAnnouncement exists for this period (ERR_PERIOD_CLOSED)"
        side_effects: ["status -> CLOSED; no further announcements accepted"]

  - entity: PriceAnnouncement
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (when a new announcement of the same kind is published in the same period)"
        actor: system
        preconditions: []
        side_effects:
          - "New announcement's supersedes_announcement_id set to this announcement's id"
          - "Period current_provisional_id / current_final_id repointed to the new announcement"

  - entity: TruckTrip
    initial_state: PLANNED
    terminal_states: [RECONCILED, BREACH_CONFIRMED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DEPARTED
        trigger: "POST /dairy/trips/{id}/depart"
        actor: RouteDriver
        preconditions:
          - "Trip in PLANNED (ERR_TRIP_NOT_PLANNED)"
          - "Caller is the trip's driver (ERR_OWNERSHIP_MISMATCH)"
          - "At least one TemperatureReading with zone=BOX and temp_tenths_f <= 400 recorded while trip was PLANNED (pre-cool check; ERR_COLD_CHAIN_PRECOOL_REQUIRED)"
          - "No RouteOrder on this trip in PLANNED (every order must be CONFIRMED or CANCELLED) (ERR_ORDER_NOT_CONFIRMABLE)"
        side_effects: ["status -> DEPARTED"]
      - from: DEPARTED
        to: COMPLETED
        trigger: "POST /dairy/trips/{id}/complete"
        actor: RouteDriver
        preconditions:
          - "Trip in DEPARTED (ERR_TRIP_NOT_DEPARTED)"
          - "Caller is the trip's driver (ERR_OWNERSHIP_MISMATCH)"
          - "Every RouteOrder on this trip in DELIVERED (ERR_ORDER_NOT_DELIVERABLE)"
        side_effects:
          - "status -> COMPLETED"
          - "Final excursion_minutes computed: any trailing above-threshold BOX reading accrues until completion timestamp (current clock)"
          - "cold_chain_breach recomputed (>= 45.0 cumulative or any single BOX reading > 500 tenths)"
      - from: COMPLETED
        to: RECONCILED
        trigger: "POST /dairy/trips/{id}/reconcile"
        actor: DistributorOwner
        preconditions:
          - "Trip in COMPLETED (ERR_TRIP_NOT_COMPLETED)"
          - "cold_chain_breach == false (else must go through QA_REVIEW; ERR_TRIP_NOT_COMPLETED)"
        side_effects: ["status -> RECONCILED"]
      - from: COMPLETED
        to: QA_REVIEW
        trigger: "POST /dairy/trips/{id}/qa-review"
        actor: QualityInspector
        preconditions:
          - "Trip in COMPLETED (ERR_TRIP_NOT_COMPLETED)"
          - "cold_chain_breach == true (ERR_TRIP_NOT_COMPLETED)"
        side_effects: ["status -> QA_REVIEW"]
      - from: QA_REVIEW
        to: RECONCILED
        trigger: "POST /dairy/trips/{id}/adjudicate with verdict=CLEAR"
        actor: QualityInspector
        preconditions:
          - "Trip in QA_REVIEW (ERR_TRIP_NOT_IN_QA_REVIEW)"
          - "payload verdict in {CLEAR, CONFIRM_BREACH} (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> RECONCILED; cold_chain_breach reset to false; no order/return cascade fires"
      - from: QA_REVIEW
        to: BREACH_CONFIRMED
        trigger: "POST /dairy/trips/{id}/adjudicate with verdict=CONFIRM_BREACH"
        actor: QualityInspector
        preconditions:
          - "Trip in QA_REVIEW (ERR_TRIP_NOT_IN_QA_REVIEW)"
          - "payload verdict in {CLEAR, CONFIRM_BREACH} (ERR_INVALID_REQUEST)"
        side_effects:
          - "Cascade hop 1: every RouteOrder on this trip with fulfillment_status == DELIVERED has every line's cold_chain_flag set true"
          - "Cascade hop 2: for each flagged (order, line), system creates a Return with reason_code=COLD_CHAIN, quantity_units=line.delivered_units, scanned_code_date=line.scanned_code_date, credit_pct=1.0, status immediately APPROVED (system actor)"
          - "Cascade hop 3: each APPROVED return creates a CreditMemo (amount = credit_amount_cents, status ISSUED)"
          - "Cascade hop 4: each memo auto-applies to its own order's Invoice (still OPEN by construction): invoice.credits_applied_cents += amount, amount_due_cents recomputed; invoice -> SETTLED if amount_due_cents == 0; memo ISSUED -> PARTIALLY_APPLIED or APPLIED"
          - "Cascade hop 5: each affected order's payment_status re-derived from its invoice (INVOICED -> PARTIALLY_PAID or PAID)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /dairy/trips/{id}/cancel"
        actor: DistributorOwner
        preconditions:
          - "Trip in PLANNED (ERR_TRIP_NOT_PLANNED)"
          - "No RouteOrder on this trip in CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED"
          - "Cascade: every RouteOrder on this trip in PLANNED -> CANCELLED"

  - entity: RouteOrder
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    note: "Parallel dimensions: fulfillment_status (PLANNED/CONFIRMED/DELIVERED/CANCELLED) evolves by driver/owner actions; payment_status (UNINVOICED/INVOICED/PARTIALLY_PAID/PAID) is derived from the 1:1 Invoice and changes independently after delivery."
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /dairy/orders/{id}/confirm"
        actor: DistributorOwner
        preconditions:
          - "Order in PLANNED (ERR_ORDER_NOT_CONFIRMABLE)"
          - "Store.status == ACTIVE (ERR_STORE_NOT_ACTIVE)"
          - "Store's Route.status == ACTIVE (ERR_ROUTE_NOT_ACTIVE)"
          - "Trip.status == PLANNED (ERR_TRIP_NOT_PLANNED)"
          - "Dock window: no other order for same store + service_date in CONFIRMED or DELIVERED whose [start,end] is within DOCK_BUFFER_MINUTES=15 of this window on either side (ERR_DOCK_WINDOW_CONFLICT)"
          - "Capacity re-validation: trip.loaded_cases (all PLANNED/CONFIRMED reservations including this order's) <= trip.case_capacity (ERR_TRIP_CAPACITY_EXCEEDED)"
          - "Credit: store.open_ar_cents + estimated subtotal at current prices <= store.credit_limit_cents (reject only when strictly greater; ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "fulfillment_status -> CONFIRMED (cases already reserved at creation)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /dairy/orders/{id}/cancel"
        actor: DistributorOwner
        preconditions:
          - "Order in PLANNED or CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "fulfillment_status -> CANCELLED"
          - "If was CONFIRMED: trip.loaded_cases -= order cases"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /dairy/orders/{id}/cancel"
        actor: DistributorOwner
        preconditions:
          - "Order in PLANNED or CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "fulfillment_status -> CANCELLED; trip.loaded_cases -= order cases"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /dairy/orders/{id}/deliver"
        actor: RouteDriver
        preconditions:
          - "Order in CONFIRMED (ERR_ORDER_NOT_DELIVERABLE)"
          - "Trip.status == DEPARTED (ERR_TRIP_NOT_DEPARTED)"
          - "Caller is the trip's driver (ERR_OWNERSHIP_MISMATCH)"
          - "payload delivered_lines covers every ordered line exactly once, 0 <= delivered_units <= quantity_units (ERR_DELIVERY_QTY_EXCEEDS_ORDER)"
          - "Every delivered line's scanned_code_date >= service_date (no out-of-code delivery; ERR_OUT_OF_CODE_DELIVERY)"
        side_effects:
          - "fulfillment_status -> DELIVERED; lines gain delivered_units, scanned_code_date, unit_price_cents, line_amount_cents (per invoice_line_rounding), cold_chain_flag=false"
          - "trip.loaded_cases -= ordered cases; trip.delivered_cases += delivered cases (ceil per line over delivered_units)"
          - "Create Invoice (1:1) for the order: pricing_basis from PricingPeriod of invoice_month; subtotal/discount/total per invoice_volume_discount; status OPEN; order.payment_status -> INVOICED"
          - "Create CrateTransaction kind=DROP crate_count=delivered cases (system); store.crate_balance += delivered cases; store.deposit_liability_cents recomputed"
          - "store.open_ar_cents recomputed"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "system (when payments/credits/true-up drive amount_due_cents to exactly 0)"
        actor: system
        preconditions: []
        side_effects: ["order.payment_status -> PAID"]
      - from: OPEN
        to: VOID
        trigger: "POST /dairy/invoices/{id}/void"
        actor: TerritoryManager
        preconditions:
          - "Invoice in OPEN (ERR_INVOICE_NOT_VOIDABLE)"
          - "payments_applied_cents == 0 AND credits_applied_cents == 0 (ERR_INVOICE_NOT_VOIDABLE)"
        side_effects:
          - "status -> VOID; order.payment_status -> UNINVOICED; store.open_ar_cents recomputed"

  - entity: Return
    initial_state: UNDER_REVIEW
    terminal_states: [CREDITED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /dairy/returns/{id}/approve"
        actor: DistributorOwner
        preconditions:
          - "Return in UNDER_REVIEW or DISPUTED (ERR_RETURN_NOT_REVIEWABLE)"
          - "Caller owns the store's route's distributor (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "status -> APPROVED, then immediately system transitions APPROVED -> CREDITED"
      - from: DISPUTED
        to: APPROVED
        trigger: "POST /dairy/returns/{id}/approve"
        actor: DistributorOwner
        preconditions:
          - "Return in UNDER_REVIEW or DISPUTED (ERR_RETURN_NOT_REVIEWABLE)"
        side_effects: ["status -> APPROVED then CREDITED (same as above)"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /dairy/returns/{id}/reject"
        actor: DistributorOwner
        preconditions:
          - "Return in UNDER_REVIEW or DISPUTED (ERR_RETURN_NOT_REVIEWABLE)"
        side_effects: ["status -> REJECTED; no credit memo created"]
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /dairy/returns/{id}/reject"
        actor: DistributorOwner
        preconditions:
          - "Return in UNDER_REVIEW or DISPUTED (ERR_RETURN_NOT_REVIEWABLE)"
        side_effects: ["status -> REJECTED"]
      - from: REJECTED
        to: DISPUTED
        trigger: "POST /dairy/returns/{id}/dispute"
        actor: StoreReceiver
        preconditions:
          - "Return in REJECTED (ERR_RETURN_NOT_DISPUTABLE)"
          - "Caller's store == return.store_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["status -> DISPUTED (cycle back into review)"]
      - from: APPROVED
        to: CREDITED
        trigger: "system (immediately upon approval)"
        actor: system
        preconditions: []
        side_effects:
          - "Create CreditMemo (amount_cents = credit_amount_cents, status ISSUED)"
          - "Auto-apply memo: target = return's own order invoice if still OPEN, else the store's oldest OPEN invoice (invoice.created_at ASC, tie-break invoice.created_at then exact match impossible); application = min(remaining_cents, invoice.amount_due_cents)"
          - "Invoice credits_applied_cents/amount_due_cents recomputed; invoice -> SETTLED at 0; order.payment_status re-derived; store.open_ar_cents recomputed"

  - entity: CreditMemo
    initial_state: ISSUED
    terminal_states: [APPLIED, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_APPLIED
        trigger: "system auto-apply or POST /dairy/credit-memos/{id}/apply"
        actor: system | DistributorOwner
        preconditions:
          - "Memo in ISSUED or PARTIALLY_APPLIED (ERR_CREDIT_MEMO_NOT_APPLICABLE)"
          - "Target invoice exists, belongs to memo's store, and is OPEN (ERR_INVOICE_NOT_OPEN)"
        side_effects:
          - "applied = min(memo.remaining_cents, invoice.amount_due_cents); memo.applied_cents += applied; memo.invoice_id = invoice.id"
          - "invoice.credits_applied_cents += applied; amount_due recomputed; invoice -> SETTLED at 0; order.payment_status re-derived"
      - from: PARTIALLY_APPLIED
        to: APPLIED
        trigger: "system auto-apply or POST /dairy/credit-memos/{id}/apply (remaining reaches 0)"
        actor: system | DistributorOwner
        preconditions:
          - "Memo in ISSUED or PARTIALLY_APPLIED (ERR_CREDIT_MEMO_NOT_APPLICABLE)"
        side_effects: ["Same accounting as above"]
      - from: ISSUED
        to: APPLIED
        trigger: "system auto-apply or POST /dairy/credit-memos/{id}/apply (full amount covers in one shot)"
        actor: system | DistributorOwner
        preconditions:
          - "Memo in ISSUED or PARTIALLY_APPLIED (ERR_CREDIT_MEMO_NOT_APPLICABLE)"
        side_effects: ["Same accounting as above"]
      - from: ISSUED
        to: VOID
        trigger: "POST /dairy/credit-memos/{id}/void"
        actor: TerritoryManager
        preconditions:
          - "Memo in ISSUED or PARTIALLY_APPLIED (ERR_CREDIT_MEMO_NOT_VOIDABLE)"
        side_effects:
          - "Compensation: every application of this memo is reversed per affected invoice (credits_applied_cents reduced by the amount applied to that invoice, amount_due_cents increased accordingly; a SETTLED invoice reopens to OPEN); affected orders' payment_status re-derived"
          - "status -> VOID; store.open_ar_cents recomputed"
      - from: PARTIALLY_APPLIED
        to: VOID
        trigger: "POST /dairy/credit-memos/{id}/void"
        actor: TerritoryManager
        preconditions:
          - "Memo in ISSUED or PARTIALLY_APPLIED (ERR_CREDIT_MEMO_NOT_VOIDABLE)"
        side_effects: ["Same compensation as above"]

  - entity: MerchandisingSession
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /dairy/merchandising-sessions/{id}/close"
        actor: RouteDriver
        preconditions:
          - "Session in OPEN (ERR_SESSION_NOT_OPEN)"
          - "Caller is the session's driver (ERR_OWNERSHIP_MISMATCH)"
          - "Current clock > check_in_at (ERR_INVALID_REQUEST)"
        side_effects:
          - "check_out_at = current clock; minutes, billable_minutes, labor_charge_cents computed"

  - entity: RouteSaleListing
    initial_state: DRAFT
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /dairy/route-sale-listings/{id}/publish"
        actor: DistributorOwner
        preconditions:
          - "Listing in DRAFT (ERR_LISTING_NOT_ACTIONABLE)"
          - "Caller is seller_distributor_id (ERR_OWNERSHIP_MISMATCH)"
          - "Route.status == ACTIVE (ERR_ROUTE_NOT_ACTIVE)"
        side_effects: ["status -> LISTED; territory_value_cents computed at this moment"]
      - from: LISTED
        to: OFFER_PENDING
        trigger: "POST /dairy/route-sale-listings/{id}/submit-offer"
        actor: DistributorOwner
        preconditions:
          - "Listing in LISTED (ERR_LISTING_NOT_OPEN_FOR_OFFER)"
          - "buyer_distributor_id == caller's X-User-ID (ERR_OWNERSHIP_MISMATCH)"
          - "buyer != seller (ERR_SELF_DEALING)"
          - "Route.status == ACTIVE (ERR_ROUTE_NOT_ACTIVE)"
        side_effects: ["status -> OFFER_PENDING; buyer_distributor_id and offer_price_cents recorded"]
      - from: OFFER_PENDING
        to: UNDER_CONTRACT
        trigger: "POST /dairy/route-sale-listings/{id}/accept-offer"
        actor: DistributorOwner
        preconditions:
          - "Listing in OFFER_PENDING (ERR_LISTING_NOT_ACTIONABLE)"
          - "Caller is seller_distributor_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["status -> UNDER_CONTRACT"]
      - from: OFFER_PENDING
        to: LISTED
        trigger: "POST /dairy/route-sale-listings/{id}/reject-offer"
        actor: DistributorOwner
        preconditions:
          - "Listing in OFFER_PENDING (ERR_LISTING_NOT_ACTIONABLE)"
          - "Caller is seller_distributor_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["status -> LISTED; buyer_distributor_id and offer_price_cents cleared (cycle)"]
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /dairy/route-sale-listings/{id}/withdraw"
        actor: DistributorOwner
        preconditions:
          - "Listing in LISTED or OFFER_PENDING (ERR_LISTING_NOT_ACTIONABLE)"
          - "Caller is seller_distributor_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["status -> WITHDRAWN; buyer fields cleared"]
      - from: OFFER_PENDING
        to: WITHDRAWN
        trigger: "POST /dairy/route-sale-listings/{id}/withdraw"
        actor: DistributorOwner
        preconditions:
          - "Listing in LISTED or OFFER_PENDING (ERR_LISTING_NOT_ACTIONABLE)"
        side_effects: ["status -> WITHDRAWN; buyer fields cleared"]
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: "POST /dairy/route-sale-listings/{id}/approve-transfer"
        actor: TerritoryManager
        preconditions:
          - "Listing in UNDER_CONTRACT (ERR_LISTING_NOT_UNDER_CONTRACT)"
          - "No RouteOrder on the route in PLANNED or CONFIRMED (ERR_ROUTE_HAS_OPEN_ORDERS)"
        side_effects:
          - "status -> CLOSED"
          - "route.distributor_id <- buyer_distributor_id; route.version incremented; route.updated_at refreshed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: par-upsert-stale-store
    parent_entity: Store
    write_endpoint: "POST /dairy/stores/{id}/standing-pars"
    occ_field: expected_store_version
    description: |
      Creating a StandingPar for a (store, product) pair legitimately supersedes
      the prior ACTIVE par. A client whose request carries an
      expected_store_version older than the store's current version is acting on
      a stale view of the store's par set (another writer may have just
      superseded pars) and is rejected with ERR_STALE_STORE_VERSION.
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412
  - rule_id: store-config-patch-stale
    parent_entity: Store
    write_endpoint: "PATCH /dairy/stores/{id}"
    occ_field: expected_store_version
    description: |
      Config updates to pull_window_days / credit_limit_cents /
      crate_deposit_cents / merchandising rates are lost-update prone: a PATCH
      carrying an expected_store_version older than the store's current version
      is rejected with ERR_STALE_STORE_VERSION because the client's basis for
      the new config is stale.
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412
  - rule_id: announcement-publish-stale-period
    parent_entity: PricingPeriod
    write_endpoint: "POST /dairy/pricing-periods/{id}/announcements"
    occ_field: expected_pricing_period_version
    description: |
      Publishing an announcement of a kind legitimately supersedes the prior
      ACTIVE announcement of that kind. A request whose
      expected_pricing_period_version is older than the period's current
      version is rejected with ERR_STALE_PRICING_PERIOD_VERSION because another
      writer may have just published (and repriced invoices on FINAL).
    error_id: ERR_STALE_PRICING_PERIOD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: regulated_milk_unit_price
    trigger: "At order delivery, per delivered line whose product.regulated == true (price snapshot is taken at that moment and stored on the line as unit_price_cents)"
    algorithm: tiered_pricing
    formula: |
      1. announcement = PricingPeriod(order.invoice_month): use ACTIVE FINAL if
         one exists at delivery time, else ACTIVE PROVISIONAL; if neither
         exists -> ERR_PRICING_PERIOD_NOT_FOUND at delivery time.
      2. milk_cost_cents = (class_i_base_cents_per_cwt
                          + processor_assessment_cents_per_cwt
                          + hauling_cents_per_cwt) * weight_lbs_per_unit / 100
         (keep full precision; do NOT round here)
      3. fuel surcharge rate f(diesel_index_cents):
           < 300   -> 0.000
           [300,400) -> 0.015   (300 exactly IS surcharged)
           [400,500) -> 0.030   (400 exactly -> 0.030)
           >= 500  -> 0.045
      4. unit_price_cents = round_half_up_3dp(
             milk_cost_cents * (1 + f) + product.margin_cents_per_unit)
      Non-regulated products: unit_price_cents = product.list_price_cents.
    input_set: "Delivered lines of DELIVERED-transitioning orders; regulated products only for the pass-through branch"
    constants:
      CWT_LBS: 100
      FUEL_TIER_1_MIN: 300
      FUEL_TIER_1_RATE: 0.015
      FUEL_TIER_2_MIN: 400
      FUEL_TIER_2_RATE: 0.030
      FUEL_TIER_3_MIN: 500
      FUEL_TIER_3_RATE: 0.045
    precision: "unit_price_cents to 3 decimal places, round_half_up; intermediate milk_cost_cents unrounded"
    variants:
      - name: PROVISIONAL
        when: "Pricing period has no ACTIVE FINAL announcement at delivery time"
        difference: "Uses ACTIVE PROVISIONAL announcement; invoice.pricing_basis = PROVISIONAL; subject to true-up repricing when FINAL is published"
      - name: FINAL
        when: "An ACTIVE FINAL announcement exists at delivery time"
        difference: "Uses FINAL announcement; invoice.pricing_basis = FINAL; never repriced"

  - name: invoice_line_rounding
    trigger: "At order delivery (invoice creation) and at FINAL-publish true-up repricing"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (mode b):
      1. Per line: line_amount_cents = round_half_up_to_integer_cents(
           delivered_units * unit_price_cents)
      2. subtotal_cents = SUM(line_amount_cents) over all lines
      Summing raw products first and rounding once at the invoice level is
      FORBIDDEN (it produces different cents).
    input_set: "All lines of the delivering order (a line with delivered_units=0 contributes 0)"
    constants: {}
    precision: "integer cents per line, round_half_up; subtotal is an exact integer sum"

  - name: invoice_volume_discount
    trigger: "At invoice creation (delivery) and at true-up repricing"
    algorithm: threshold
    formula: |
      CIRCULAR-LOOKING DEPENDENCE, PINNED (mode c): the discount tier is keyed
      on the PRE-DISCOUNT subtotal_cents, never on the post-discount total
      (which would make total = subtotal - discount depend on itself).
      rate(subtotal_cents):
        < 200000          -> 0.000
        [200000, 500000)  -> 0.015   (200000 exactly -> 0.015)
        >= 500000         -> 0.025   (500000 exactly -> 0.025)
      discount_cents = round_half_up_to_integer_cents(subtotal_cents * rate)
      total_cents = subtotal_cents - discount_cents
      Note: with rate 0.025 a subtotal of exactly 500000 yields total 487500,
      which is BELOW the 500000 tier floor - the 2.5% rate still applies
      because the tier was selected pre-discount.
    input_set: "The invoice being created/repriced"
    constants:
      DISCOUNT_TIER_1_MIN: 200000
      DISCOUNT_TIER_1_RATE: 0.015
      DISCOUNT_TIER_2_MIN: 500000
      DISCOUNT_TIER_2_RATE: 0.025
    precision: "integer cents, round_half_up on the discount; total is exact"

  - name: invoice_true_up
    trigger: "When a FINAL PriceAnnouncement is published (POST announcements with kind=FINAL)"
    algorithm: constraint_propagation
    formula: |
      For every Invoice with invoice_month == period.month AND
      pricing_basis == PROVISIONAL AND status == OPEN, in invoice.created_at
      ASC order:
        1. Recompute each line's unit_price_cents with the FINAL announcement
           (regulated_milk_unit_price), line_amount_cents per
           invoice_line_rounding, subtotal/discount/total per
           invoice_volume_discount.
        2. true_up_delta_cents = new_total_cents - old_total_cents (may be 0)
        3. amount_due_cents = new_total_cents - credits_applied_cents
           - payments_applied_cents
        4. If amount_due_cents == 0 -> invoice SETTLED, order.payment_status
           -> PAID.
        5. pricing_basis -> FINAL (invoice is now final-priced).
      Invoices already SETTLED or VOID are NOT repriced (no retroactive
      reopening).
    input_set: "OPEN invoices with pricing_basis=PROVISIONAL in the period; SETTLED/VOID excluded"
    constants: {}
    precision: "integer cents as per invoice_line_rounding / invoice_volume_discount"

  - name: return_credit_amount
    trigger: "At Return creation (manual) or system creation (cold-chain cascade)"
    algorithm: tiered_pricing
    formula: |
      1. days_to_expiry_at_scan = scanned_code_date - current_clock_date (days)
      2. Eligibility by reason_code (else ERR_RETURN_NOT_ELIGIBLE):
           OUT_OF_CODE : days_to_expiry_at_scan < 0
           PULL_POLICY : 0 <= days_to_expiry_at_scan <= store.pull_window_days
                         (both bounds INCLUSIVE)
           DAMAGED     : any days_to_expiry_at_scan
           COLD_CHAIN  : system-created only; manual attempts rejected with
                         ERR_RETURN_NOT_ELIGIBLE
      3. credit_pct: OUT_OF_CODE 1.0 | PULL_POLICY 1.0 | DAMAGED 0.5 |
         COLD_CHAIN 1.0
      4. unit_credit_cents by route.credit_price_basis:
           ORIGINAL -> the delivered line's unit_price_cents
           CURRENT  -> price of the product as of the scan date
                       (regulated: announcement of the scan month;
                       non-regulated: list_price_cents)
      5. credit_amount_cents = round_half_up_to_integer_cents(
           quantity_units * unit_credit_cents * credit_pct)
    input_set: "The return's (order, product) pair; the order's delivered line for ORIGINAL basis"
    constants:
      CREDIT_PCT_FULL: 1.0
      CREDIT_PCT_DAMAGED: 0.5
    precision: "integer cents, round_half_up on the final product only"
    variants:
      - name: ORIGINAL
        when: "route.credit_price_basis == ORIGINAL"
        difference: "Credits at the price the store actually paid on the original delivery"
      - name: CURRENT
        when: "route.credit_price_basis == CURRENT"
        difference: "Credits at the price in effect on the scan date; diverges from ORIGINAL whenever the price changed between delivery and scan"

  - name: temperature_excursion
    trigger: "On each TemperatureReading creation, and once more at trip completion (trailing interval)"
    algorithm: aggregation
    formula: |
      Consider only readings with zone == BOX, sorted by recorded_at ASC
      (tie-break: created_at ASC; recorded_at is validated strictly
      increasing so ties cannot occur).
      Step-function accrual (left-closed intervals): a reading r_i with
      temp_tenths_f > 400 accrues (r_{i+1}.recorded_at - r_i.recorded_at)
      toward excursion_minutes; the final reading, if > 400, accrues until
      the trip's completion timestamp (clock at POST complete).
      excursion_minutes rounded to 2 decimals round_half_up.
      cold_chain_breach = (excursion_minutes >= 45.0)   -- boundary INCLUSIVE
                        OR (any single BOX reading temp_tenths_f > 500)
      Two independent triggers: cumulative (rate) and instantaneous spike.
    input_set: "BOX-zone TemperatureReadings of the trip; CAB readings excluded"
    constants:
      EXCURSION_THRESHOLD_TENTHS_F: 400
      CRITICAL_SPIKE_TENTHS_F: 500
      BREACH_THRESHOLD_MINUTES: 45.0
    precision: "excursion_minutes 2 decimal places, round_half_up"

  - name: crate_ledger
    trigger: "At order delivery (auto DROP), at POST crate-transactions (PICKUP, ADJUSTMENT)"
    algorithm: aggregation
    formula: |
      store.crate_balance = SUM(DROP.crate_count) - SUM(PICKUP.crate_count)
                            + SUM(ADJUSTMENT.crate_count signed)
      store.deposit_liability_cents = crate_balance * crate_deposit_cents
      PICKUP with crate_count > current crate_balance is rejected
      (ERR_INSUFFICIENT_CRATE_BALANCE); PICKUP == balance is allowed
      (balance may reach exactly 0). ADJUSTMENT may be negative but may not
      drive the balance below 0 (same error).
      INVARIANT (compensating): for any store and any interval, balance_end
      == balance_start + dropped - picked_up + adjustments; a DROP of n
      followed by a PICKUP of n leaves the balance unchanged.
    input_set: "All CrateTransactions of the store (no status filter; events are immutable)"
    constants: {}
    precision: "integer crates and cents; no rounding"

  - name: driver_weekly_settlement
    trigger: "On read: GET /dairy/drivers/{id}/weekly-settlement?week_start=YYYY-MM-DD"
    algorithm: weighted_scoring
    formula: |
      Week window: [week_start 00:00Z, week_start + 7 days 00:00Z), matched on
      service_date / check_in date.
      1. gross_sales_cents = SUM(line_amount_cents) over lines of DELIVERED
         orders on trips driven by this driver with service_date in window
      2. credits_cents = SUM(credit_amount_cents) over Returns with status in
         {APPROVED, CREDITED} whose order's service_date is in the window AND
         whose order's trip driver == this driver (as-of read time;
         later-approved returns change historical settlements)
      3. net_sales_cents = gross_sales_cents - credits_cents
      4. commission rate tier keyed on net_sales_cents (NOT on any
         post-commission figure):
           < 500000            -> 0.22
           [500000, 1200000]   -> 0.24   (500000 exactly -> 0.24)
           > 1200000           -> 0.26
      5. commission_cents = round_half_up_to_integer_cents(
           net_sales_cents * rate)
      6. labor_minutes = SUM(minutes) over CLOSED MerchandisingSessions of
         this driver with check_in date in window
      7. driver_labor_cents = labor_minutes * DRIVER_PER_MIN_CENTS
      8. settlement_cents = commission_cents + driver_labor_cents
      EVALUATION ORDER IS PINNED as written; the tier never sees commission or
      labor (which would make commission depend on itself).
    input_set: "DELIVERED orders (CANCELLED/PLANNED/CONFIRMED excluded); Returns {APPROVED, CREDITED}; CLOSED sessions (OPEN excluded)"
    constants:
      DRIVER_PER_MIN_CENTS: 50
      COMMISSION_TIER_1_MIN: 500000
      COMMISSION_TIER_1_RATE: 0.24
      COMMISSION_TIER_2_MIN: 1200000
      COMMISSION_TIER_2_RATE: 0.26
      COMMISSION_BASE_RATE: 0.22
    precision: "integer cents, round_half_up on commission only"

  - name: territory_valuation
    trigger: "At listing publish (POST .../publish); snapshot stored as territory_value_cents"
    algorithm: aggregation
    formula: |
      Window: service_date d satisfies (clock_date - 7*trailing_weeks) < d
      <= clock_date (lower bound EXCLUSIVE, upper bound INCLUSIVE).
      window_net_sales_cents = SUM(line_amount_cents over DELIVERED orders on
        this route in window) - SUM(credit_amount_cents over Returns with
        status in {APPROVED, CREDITED} whose order is on this route with
        service_date in window)
      avg_weekly_cents = round_half_up_to_integer_cents(
        window_net_sales_cents / trailing_weeks)
      territory_value_cents = TERRITORY_MULTIPLIER * avg_weekly_cents
    input_set: "DELIVERED orders on the route in window; Returns {APPROVED, CREDITED}; orders/returns outside window excluded"
    constants:
      TERRITORY_MULTIPLIER: 10
    precision: "integer cents, round_half_up on the weekly average"

  - name: standing_par_generation
    trigger: "POST /dairy/trips/{id}/generate-orders"
    algorithm: constraint_propagation
    formula: |
      Preconditions: trip PLANNED; trip's route ACTIVE (ERR_ROUTE_NOT_ACTIVE).
      For each Store on trip.route with status ACTIVE, in store.created_at
      ASC order:
        lines = for each StandingPar with status ACTIVE for the store where
          par quantity for service_date's weekday > 0 AND product.status ==
          ACTIVE: {product_id, quantity_units = par value}
        If no such lines: skip store (recorded in skipped_store_ids).
        If the store already has a RouteOrder on this trip in any
        fulfillment_status except CANCELLED: skip (idempotent re-run).
        If trip.loaded_cases + generated cases would exceed trip.case_capacity:
        skip the store (recorded in skipped_store_ids).
        Else create RouteOrder source=PAR_GENERATED, fulfillment PLANNED,
        payment UNINVOICED, delivery window = service_date +
        [store.dock_open_min, store.dock_close_min]; trip.loaded_cases +=
        generated cases.
      DISCONTINUED products silently excluded from generated lines.
    input_set: "ACTIVE stores on route; ACTIVE pars; ACTIVE products"
    constants: {}
    precision: "integer units"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller's role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: DistributorOwner must own the target resource's route/distributor chain (store.route.distributor_id == X-User-ID; trip.route.distributor_id; listing.seller_distributor_id; return's store route owner); RouteDriver must be the trip's driver (trip.driver_id == X-User-ID) for depart/complete/readings/deliver/return-create/crate-pickup/merch; StoreReceiver must match the resource's store_id (invoice.store_id, return.store_id)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "all state-changing endpoints with an entity-backed role"
  - priority: 4
    category: existence
    check: "Path and body-referenced resources exist, validated left-to-right through the path then body"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Request body well-formed: required fields present, enum values in-domain, numeric ranges valid (quantity_units > 0, delivery_window_end > start, planned_return_at > planned_depart_at, crate_count non-zero), uniqueness of route_code/sku/license_number/store_code/month. Note: pinned AFTER existence, BEFORE state checks."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
    note: "Priority order is 1 auth-header, 2 role, 3 ownership, 4 existence, 5 input-format, 6 state, 7 safety, 8 temporal, 9 constraint, 10 referential, 11 fiscal. A dual-failure request returns the error from the lowest priority number."
  - priority: 6
    category: state
    check: "Target resource in the required state for the operation (per state machines): ERR_ROUTE_NOT_ACTIVE, ERR_STORE_NOT_ACTIVE, ERR_TRIP_NOT_PLANNED, ERR_TRIP_NOT_DEPARTED, ERR_TRIP_NOT_COMPLETED, ERR_TRIP_NOT_IN_QA_REVIEW, ERR_ORDER_NOT_CONFIRMABLE, ERR_ORDER_NOT_CANCELLABLE, ERR_ORDER_NOT_DELIVERABLE, ERR_RETURN_NOT_REVIEWABLE, ERR_RETURN_NOT_DISPUTABLE, ERR_LISTING_NOT_OPEN_FOR_OFFER, ERR_LISTING_NOT_ACTIONABLE, ERR_LISTING_NOT_UNDER_CONTRACT, ERR_SESSION_NOT_OPEN, ERR_PERIOD_CLOSED, ERR_INVOICE_NOT_OPEN, ERR_INVOICE_NOT_VOIDABLE, ERR_CREDIT_MEMO_NOT_APPLICABLE, ERR_CREDIT_MEMO_NOT_VOIDABLE, ERR_READINGS_NOT_ACCEPTED"
    note: "Within a single state-machine transition, preconditions evaluate in the order they are listed in section 1.2; the first failing precondition's error_id is returned."
    error_id: "ERR_*_NOT_* (state family)"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Cold-chain and code safety: depart requires a PLANNED-state BOX reading <= 400 tenths (ERR_COLD_CHAIN_PRECOOL_REQUIRED); delivered lines must have scanned_code_date >= service_date (ERR_OUT_OF_CODE_DELIVERY); DISCONTINUED products rejected in manual order lines (ERR_PRODUCT_DISCONTINUED)"
    error_id: "ERR_COLD_CHAIN_PRECOOL_REQUIRED | ERR_OUT_OF_CODE_DELIVERY | ERR_PRODUCT_DISCONTINUED"
    http_status: 409
    applies_to: "POST /dairy/trips/{id}/depart, POST /dairy/orders/{id}/deliver, POST /dairy/orders"
    note: "ERR_OUT_OF_CODE_DELIVERY and ERR_PRODUCT_DISCONTINUED return 422; ERR_COLD_CHAIN_PRECOOL_REQUIRED returns 409"
  - priority: 8
    category: business_temporal
    check: "Interval rules: dock appointment buffer at confirm (ERR_DOCK_WINDOW_CONFLICT); driver trip window overlap half-open (ERR_TRIP_WINDOW_CONFLICT); temperature readings strictly increasing recorded_at and <= clock (ERR_READING_OUT_OF_ORDER)"
    error_id: "ERR_DOCK_WINDOW_CONFLICT | ERR_TRIP_WINDOW_CONFLICT | ERR_READING_OUT_OF_ORDER"
    http_status: 409
    applies_to: "POST /dairy/orders/{id}/confirm, POST /dairy/trips, POST /dairy/trips/{id}/temperature-readings"
  - priority: 9
    category: business_constraint
    check: "Capacity and structural limits: trip case capacity at confirm (ERR_TRIP_CAPACITY_EXCEEDED); crate PICKUP/ADJUSTMENT may not drive crate_balance negative (ERR_INSUFFICIENT_CRATE_BALANCE); listing submit-offer buyer != seller (ERR_SELF_DEALING); driver may hold at most one OPEN merchandising session (ERR_SESSION_CONFLICT); delivery quantity may not exceed ordered (ERR_DELIVERY_QTY_EXCEEDS_ORDER, 422)"
    error_id: "ERR_TRIP_CAPACITY_EXCEEDED | ERR_INSUFFICIENT_CRATE_BALANCE | ERR_SELF_DEALING | ERR_SESSION_CONFLICT | ERR_DELIVERY_QTY_EXCEEDS_ORDER"
    http_status: 409
    applies_to: "confirm, crate-transactions, submit-offer, merchandising-sessions create, deliver"
  - priority: 10
    category: business_referential
    check: "Cross-references must be coherent: return.product_id must appear among the order's DELIVERED lines with sufficient remaining unreturned units (ERR_RETURN_PRODUCT_NOT_DELIVERED); return's order must belong to the store context supplied (ERR_RETURN_STORE_MISMATCH); return eligibility window per reason_code (ERR_RETURN_NOT_ELIGIBLE, 422)"
    error_id: "ERR_RETURN_PRODUCT_NOT_DELIVERED | ERR_RETURN_STORE_MISMATCH | ERR_RETURN_NOT_ELIGIBLE"
    http_status: 422
    applies_to: "POST /dairy/returns"
  - priority: 11
    category: business_fiscal
    check: "Money limits LAST: confirm credit check store.open_ar_cents + estimated subtotal > credit_limit_cents (strictly greater rejects; equality passes) -> ERR_CREDIT_LIMIT_EXCEEDED; payment amount_cents > invoice.amount_due_cents -> ERR_PAYMENT_EXCEEDS_DUE"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_PAYMENT_EXCEEDS_DUE"
    http_status: 402
    applies_to: "POST /dairy/orders/{id}/confirm, POST /dairy/invoices/{id}/payments"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing, or role not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not in endpoint's roles list" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller does not own / is not assigned to the target resource chain" }
  # --- input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid fields, bad enum, bad range, uniqueness violation (route_code, sku, license_number, store_code, pricing month)" }
  # --- existence ---
  - { id: ERR_DISTRIBUTOR_NOT_FOUND, http: 404, condition: "Distributor id not found" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Route id not found" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "Driver id not found" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "Store id not found" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id not found" }
  - { id: ERR_PAR_NOT_FOUND, http: 404, condition: "StandingPar id not found" }
  - { id: ERR_PRICING_PERIOD_NOT_FOUND, http: 404, condition: "PricingPeriod id not found, or no announcement exists for a delivery's month" }
  - { id: ERR_ANNOUNCEMENT_NOT_FOUND, http: 404, condition: "PriceAnnouncement id not found" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "TruckTrip id not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "RouteOrder id not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id not found" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "Return id not found" }
  - { id: ERR_CREDIT_MEMO_NOT_FOUND, http: 404, condition: "CreditMemo id not found" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "RouteSaleListing id not found" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "MerchandisingSession id not found" }
  # --- OCC ---
  - { id: ERR_STALE_STORE_VERSION, http: 412, condition: "expected_store_version != store.version on standing-par upsert or store PATCH" }
  - { id: ERR_STALE_PRICING_PERIOD_VERSION, http: 412, condition: "expected_pricing_period_version != period.version on announcement publish" }
  # --- state ---
  - { id: ERR_ROUTE_NOT_ACTIVE, http: 409, condition: "Route not in required state (activate from non-DRAFT/SUSPENDED, or route not ACTIVE for confirm/generate/publish/submit-offer/store-reactivate)" }
  - { id: ERR_STORE_NOT_ACTIVE, http: 409, condition: "Store not ACTIVE for confirm, or deactivate/reactivate from wrong state" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 409, condition: "Product DISCONTINUED referenced in manual order line, or discontinue of already-discontinued product" }
  - { id: ERR_PERIOD_CLOSED, http: 409, condition: "Announcement publish or close on a CLOSED period; close without FINAL announcement" }
  - { id: ERR_TRIP_NOT_PLANNED, http: 409, condition: "depart/cancel/generate-orders/confirm-onto-trip requires trip PLANNED" }
  - { id: ERR_TRIP_NOT_DEPARTED, http: 409, condition: "complete/deliver requires trip DEPARTED" }
  - { id: ERR_TRIP_NOT_COMPLETED, http: 409, condition: "reconcile/qa-review requires trip COMPLETED (reconcile additionally requires cold_chain_breach == false; qa-review requires true)" }
  - { id: ERR_TRIP_NOT_IN_QA_REVIEW, http: 409, condition: "adjudicate requires trip QA_REVIEW" }
  - { id: ERR_READINGS_NOT_ACCEPTED, http: 409, condition: "Temperature reading submitted while trip not in PLANNED or DEPARTED" }
  - { id: ERR_ORDER_NOT_CONFIRMABLE, http: 409, condition: "confirm requires order PLANNED; also used when PLANNED orders block trip depart" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires order PLANNED or CONFIRMED; trip cancel requires no CONFIRMED orders" }
  - { id: ERR_ORDER_NOT_DELIVERABLE, http: 409, condition: "deliver requires order CONFIRMED; trip complete requires all orders DELIVERED" }
  - { id: ERR_RETURN_NOT_REVIEWABLE, http: 409, condition: "approve/reject requires return UNDER_REVIEW or DISPUTED" }
  - { id: ERR_RETURN_NOT_DISPUTABLE, http: 409, condition: "dispute requires return REJECTED" }
  - { id: ERR_LISTING_NOT_OPEN_FOR_OFFER, http: 409, condition: "submit-offer requires listing LISTED" }
  - { id: ERR_LISTING_NOT_ACTIONABLE, http: 409, condition: "publish/accept-offer/reject-offer/withdraw from a state where the action is not defined" }
  - { id: ERR_LISTING_NOT_UNDER_CONTRACT, http: 409, condition: "approve-transfer requires listing UNDER_CONTRACT" }
  - { id: ERR_SESSION_NOT_OPEN, http: 409, condition: "close requires session OPEN" }
  - { id: ERR_INVOICE_NOT_OPEN, http: 409, condition: "payment or credit application requires invoice OPEN" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 409, condition: "void requires invoice OPEN with payments_applied_cents == 0 and credits_applied_cents == 0" }
  - { id: ERR_CREDIT_MEMO_NOT_APPLICABLE, http: 409, condition: "apply requires memo ISSUED or PARTIALLY_APPLIED" }
  - { id: ERR_CREDIT_MEMO_NOT_VOIDABLE, http: 409, condition: "void requires memo ISSUED or PARTIALLY_APPLIED" }
  # --- business safety ---
  - { id: ERR_COLD_CHAIN_PRECOOL_REQUIRED, http: 409, condition: "depart without a PLANNED-state BOX reading <= 40.0F" }
  - { id: ERR_OUT_OF_CODE_DELIVERY, http: 422, condition: "A delivered line's scanned_code_date < service_date" }
  # --- business temporal ---
  - { id: ERR_DOCK_WINDOW_CONFLICT, http: 409, condition: "Confirmed/delivered order exists at same store+service_date whose window is within 15 minutes on either side of the new window" }
  - { id: ERR_TRIP_WINDOW_CONFLICT, http: 409, condition: "Driver already assigned a non-CANCELLED trip whose [planned_depart_at, planned_return_at) overlaps the new trip (half-open: back-to-back allowed)" }
  - { id: ERR_READING_OUT_OF_ORDER, http: 409, condition: "recorded_at not strictly greater than previous reading on the trip, or recorded_at > current clock" }
  # --- business constraint ---
  - { id: ERR_TRIP_CAPACITY_EXCEEDED, http: 409, condition: "trip.loaded_cases + order cases > trip.case_capacity at confirm" }
  - { id: ERR_INSUFFICIENT_CRATE_BALANCE, http: 409, condition: "PICKUP/negative ADJUSTMENT would drive crate_balance below 0" }
  - { id: ERR_SELF_DEALING, http: 422, condition: "submit-offer where buyer_distributor_id == seller_distributor_id" }
  - { id: ERR_SESSION_CONFLICT, http: 409, condition: "Driver already has an OPEN merchandising session" }
  - { id: ERR_DELIVERY_QTY_EXCEEDS_ORDER, http: 422, condition: "delivered_units > quantity_units on a delivered line, or a line missing/duplicated" }
  # --- business referential ---
  - { id: ERR_RETURN_PRODUCT_NOT_DELIVERED, http: 422, condition: "product not among the order's delivered lines, or cumulative returned units exceed delivered" }
  - { id: ERR_RETURN_STORE_MISMATCH, http: 422, condition: "Caller-supplied store context does not match the order's store" }
  - { id: ERR_RETURN_NOT_ELIGIBLE, http: 422, condition: "reason_code's code-date window not met (OUT_OF_CODE needs days<0; PULL_POLICY needs 0<=days<=pull_window_days; COLD_CHAIN is system-only)" }
  # --- business fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "store.open_ar_cents + estimated order subtotal strictly greater than credit_limit_cents at confirm" }
  - { id: ERR_PAYMENT_EXCEEDS_DUE, http: 402, condition: "payment amount_cents > invoice.amount_due_cents" }
  # --- cross-entity gates ---
  - { id: ERR_ROUTE_HAS_OPEN_ORDERS, http: 409, condition: "retire / approve-transfer while route has orders in PLANNED or CONFIRMED, or retire with an open listing" }
  - { id: ERR_STORE_HAS_CONFIRMED_ORDERS, http: 409, condition: "deactivate while store has orders in CONFIRMED" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving, declared per §1.5 priority ladder rung 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical server clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [TerritoryManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["All subsequent system timestamps (check_in/out, service_date defaults, reading acceptance) use this clock"]

  # --- Distributor ---
  - method: POST
    path: "/dairy/distributors"
    description: "Register a distributor"
    roles: [TerritoryManager]
    code: 201
    input: [name, license_number, "credit_terms_days?"]
    output: Distributor
    side_effects: []
  - method: GET
    path: "/dairy/distributors/{id}"
    description: "Get a distributor"
    roles: [Any]
    code: 200
    input: []
    output: Distributor
    side_effects: []

  # --- Route ---
  - method: POST
    path: "/dairy/routes"
    description: "Create a route in DRAFT"
    roles: [TerritoryManager]
    code: 201
    input: [distributor_id, route_code, name, service_weekdays, "credit_price_basis?"]
    output: Route
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/dairy/routes/{id}"
    description: "Get a route"
    roles: [Any]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: GET
    path: "/dairy/distributors/{id}/routes"
    description: "List routes owned by a distributor (FK reverse reachability for Route.distributor_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Route[]"
    side_effects: []
  - method: POST
    path: "/dairy/routes/{id}/activate"
    description: "Activate a DRAFT or SUSPENDED route"
    roles: [TerritoryManager]
    code: 200
    input: []
    output: Route
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/dairy/routes/{id}/suspend"
    description: "Suspend an ACTIVE route"
    roles: [TerritoryManager]
    code: 200
    input: []
    output: Route
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/dairy/routes/{id}/retire"
    description: "Retire a route (cascades stores -> INACTIVE, PLANNED orders -> CANCELLED)"
    roles: [TerritoryManager]
    code: 200
    input: []
    output: Route
    side_effects: ["status -> RETIRED; store/order cascade per Route state machine"]

  # --- Driver ---
  - method: POST
    path: "/dairy/drivers"
    description: "Hire a driver for a distributor (distributor_id must equal caller X-User-ID)"
    roles: [DistributorOwner]
    code: 201
    input: [distributor_id, name, cdl_class]
    output: Driver
    side_effects: []
  - method: GET
    path: "/dairy/drivers/{id}"
    description: "Get a driver"
    roles: [Any]
    code: 200
    input: []
    output: Driver
    side_effects: []
  - method: GET
    path: "/dairy/distributors/{id}/drivers"
    description: "List drivers of a distributor (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Driver[]"
    side_effects: []
  - method: GET
    path: "/dairy/drivers/{id}/weekly-settlement"
    description: "Computed read: driver weekly settlement per driver_weekly_settlement"
    roles: [DistributorOwner, RouteDriver]
    code: 200
    input: [week_start]
    output: "{ gross_sales_cents: integer, credits_cents: integer, net_sales_cents: integer, commission_rate: number, commission_cents: integer, labor_minutes: integer, driver_labor_cents: integer, settlement_cents: integer }"
    side_effects: []

  # --- Store ---
  - method: POST
    path: "/dairy/stores"
    description: "Onboard a store onto a route owned by the caller"
    roles: [DistributorOwner]
    code: 201
    input: [route_id, store_code, name, "credit_limit_cents?", "pull_window_days?", "crate_deposit_cents?", "merchandising_rate_cents_per_min?", "free_merchandising_minutes?", "dock_open_min?", "dock_close_min?"]
    output: Store
    side_effects: ["status = ACTIVE; crate_balance/open_ar_cents/deposit_liability_cents = 0"]
  - method: GET
    path: "/dairy/stores/{id}"
    description: "Get a store"
    roles: [Any]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: GET
    path: "/dairy/routes/{id}/stores"
    description: "List stores on a route (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Store[]"
    side_effects: []
  - method: PATCH
    path: "/dairy/stores/{id}"
    description: "Update store config; OCC-guarded (concurrency rule store-config-patch-stale)"
    roles: [DistributorOwner]
    code: 200
    input: [expected_store_version, "credit_limit_cents?", "pull_window_days?", "crate_deposit_cents?", "merchandising_rate_cents_per_min?", "free_merchandising_minutes?", "dock_open_min?", "dock_close_min?"]
    output: Store
    side_effects: ["increments Store.version by 1"]
  - method: POST
    path: "/dairy/stores/{id}/deactivate"
    description: "Deactivate store; cancels its PLANNED orders and releases trip capacity"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: Store
    side_effects: ["status -> INACTIVE; PLANNED orders -> CANCELLED; affected trips' loaded_cases recomputed"]
  - method: POST
    path: "/dairy/stores/{id}/reactivate"
    description: "Reactivate an INACTIVE store (route must be ACTIVE)"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: Store
    side_effects: ["status -> ACTIVE"]

  # --- Product ---
  - method: POST
    path: "/dairy/products"
    description: "Create a product"
    roles: [TerritoryManager]
    code: 201
    input: [sku, name, units_per_case, shelf_life_days, regulated, "weight_lbs_per_unit?", "list_price_cents?", "margin_cents_per_unit?"]
    output: Product
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/dairy/products/{id}"
    description: "Get a product"
    roles: [Any]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/dairy/products/{id}/discontinue"
    description: "Discontinue a product"
    roles: [TerritoryManager]
    code: 200
    input: []
    output: Product
    side_effects: ["status -> DISCONTINUED"]

  # --- StandingPar ---
  - method: POST
    path: "/dairy/stores/{id}/standing-pars"
    description: "Upsert the standing par for (store, product); supersedes any prior ACTIVE par; OCC-guarded (rule par-upsert-stale-store)"
    roles: [DistributorOwner]
    code: 201
    input: [product_id, expected_store_version, "par_mon?", "par_tue?", "par_wed?", "par_thu?", "par_fri?", "par_sat?", "par_sun?"]
    output: StandingPar
    side_effects: ["prior ACTIVE par for (store, product) -> SUPERSEDED; increments Store.version by 1"]
  - method: GET
    path: "/dairy/stores/{id}/standing-pars"
    description: "List pars of a store (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "StandingPar[]"
    side_effects: []
  - method: GET
    path: "/dairy/products/{id}/standing-pars"
    description: "List pars referencing a product (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "StandingPar[]"
    side_effects: []

  - method: GET
    path: "/dairy/standing-pars/{id}"
    description: "Get a single standing par (e.g., to observe SUPERSEDED status after an upsert)"
    roles: [Any]
    code: 200
    input: []
    output: StandingPar
    side_effects: []

  # --- PricingPeriod / PriceAnnouncement ---
  - method: POST
    path: "/dairy/pricing-periods"
    description: "Create a monthly pricing period (month unique)"
    roles: [MarketAdministrator]
    code: 201
    input: [month]
    output: PricingPeriod
    side_effects: ["status = OPEN"]
  - method: GET
    path: "/dairy/pricing-periods/{id}"
    description: "Get a pricing period"
    roles: [Any]
    code: 200
    input: []
    output: PricingPeriod
    side_effects: []
  - method: POST
    path: "/dairy/pricing-periods/{id}/close"
    description: "Close a period (requires an ACTIVE FINAL announcement)"
    roles: [MarketAdministrator]
    code: 200
    input: []
    output: PricingPeriod
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/dairy/pricing-periods/{id}/announcements"
    description: "Publish a PROVISIONAL or FINAL announcement; supersedes prior ACTIVE of same kind; OCC-guarded (rule announcement-publish-stale-period); FINAL triggers invoice_true_up repricing"
    roles: [MarketAdministrator]
    code: 201
    input: [kind, class_i_base_cents_per_cwt, processor_assessment_cents_per_cwt, hauling_cents_per_cwt, diesel_index_cents, expected_pricing_period_version]
    output: PriceAnnouncement
    side_effects:
      - "increments PricingPeriod.version by 1"
      - "prior ACTIVE announcement of same kind -> SUPERSEDED; period current_*_id repointed"
      - "if kind == FINAL: invoice_true_up reprices OPEN PROVISIONAL-basis invoices of the month"
  - method: GET
    path: "/dairy/pricing-periods/{id}/announcements"
    description: "List announcements of a period (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "PriceAnnouncement[]"
    side_effects: []
  - method: GET
    path: "/dairy/price-announcements/{id}"
    description: "Get a single announcement"
    roles: [Any]
    code: 200
    input: []
    output: PriceAnnouncement
    side_effects: []
  - method: GET
    path: "/dairy/price-announcements"
    description: "List announcements filtered by period or supersession link (FK reverse reachability for pricing_period_id and supersedes_announcement_id)"
    roles: [Any]
    code: 200
    input: ["pricing_period_id?", "supersedes_announcement_id?", "limit?", "offset?"]
    output: "PriceAnnouncement[]"
    side_effects: []

  # --- TruckTrip ---
  - method: POST
    path: "/dairy/trips"
    description: "Plan a trip; rejects on driver window overlap (half-open) per ERR_TRIP_WINDOW_CONFLICT"
    roles: [DistributorOwner]
    code: 201
    input: [route_id, driver_id, service_date, truck_plate, case_capacity, planned_depart_at, planned_return_at]
    output: TruckTrip
    side_effects: ["status = PLANNED"]
  - method: GET
    path: "/dairy/trips/{id}"
    description: "Get a trip"
    roles: [Any]
    code: 200
    input: []
    output: TruckTrip
    side_effects: []
  - method: GET
    path: "/dairy/trips"
    description: "List trips filtered by route and/or driver (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["route_id?", "driver_id?", "service_date?", "limit?", "offset?"]
    output: "TruckTrip[]"
    side_effects: []
  - method: POST
    path: "/dairy/trips/{id}/depart"
    description: "Depart (requires pre-cool BOX reading <= 40.0F and no PLANNED orders)"
    roles: [RouteDriver]
    code: 200
    input: []
    output: TruckTrip
    side_effects: ["status -> DEPARTED"]
  - method: POST
    path: "/dairy/trips/{id}/complete"
    description: "Complete (requires all orders DELIVERED); finalizes excursion_minutes and cold_chain_breach"
    roles: [RouteDriver]
    code: 200
    input: []
    output: TruckTrip
    side_effects: ["status -> COMPLETED; excursion/breach finalized"]
  - method: POST
    path: "/dairy/trips/{id}/cancel"
    description: "Cancel a PLANNED trip with no CONFIRMED orders; its PLANNED orders are cancelled"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: TruckTrip
    side_effects: ["status -> CANCELLED; PLANNED orders -> CANCELLED"]
  - method: POST
    path: "/dairy/trips/{id}/qa-review"
    description: "Open QA review on a COMPLETED trip with cold_chain_breach == true"
    roles: [QualityInspector]
    code: 200
    input: []
    output: TruckTrip
    side_effects: ["status -> QA_REVIEW"]
  - method: POST
    path: "/dairy/trips/{id}/adjudicate"
    description: "Adjudicate a QA review: verdict CLEAR -> RECONCILED; CONFIRM_BREACH -> five-level cascade (order lines flagged -> system returns -> credit memos -> invoice application -> payment_status re-derived)"
    roles: [QualityInspector]
    code: 200
    input: [verdict]
    output: TruckTrip
    side_effects: ["status -> RECONCILED or BREACH_CONFIRMED; breach cascade per TruckTrip state machine"]
  - method: POST
    path: "/dairy/trips/{id}/reconcile"
    description: "Reconcile a COMPLETED trip with no breach"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: TruckTrip
    side_effects: ["status -> RECONCILED"]

  # --- TemperatureReading ---
  - method: POST
    path: "/dairy/trips/{id}/temperature-readings"
    description: "Append a temperature reading (trip must be PLANNED or DEPARTED; strictly increasing recorded_at; <= clock)"
    roles: [RouteDriver]
    code: 201
    input: [recorded_at, temp_tenths_f, zone]
    output: TemperatureReading
    side_effects: ["excursion_minutes and cold_chain_breach recomputed on the trip"]
  - method: GET
    path: "/dairy/trips/{id}/temperature-readings"
    description: "List readings of a trip, recorded_at ASC (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["zone?", "limit?", "offset?"]
    output: "TemperatureReading[]"
    side_effects: []

  # --- RouteOrder ---
  - method: POST
    path: "/dairy/orders"
    description: "Create a manual order (source=MANUAL) in PLANNED; store must be ACTIVE, trip PLANNED and serving the store's route; lines must have distinct product_id values (ERR_INVALID_REQUEST); case reservation happens at creation"
    roles: [DistributorOwner]
    code: 201
    input: [store_id, trip_id, lines, delivery_window_start, delivery_window_end]
    output: RouteOrder
    side_effects: ["fulfillment_status = PLANNED; payment_status = UNINVOICED; per line cases = ceil(quantity_units / units_per_case); trip.loaded_cases += total cases (reservation only — capacity is enforced at confirm, never at creation)"]
  - method: POST
    path: "/dairy/trips/{id}/generate-orders"
    description: "Generate PAR_GENERATED orders from ACTIVE standing pars (see standing_par_generation); idempotent per store"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: { created_count: integer, created_order_ids: array, skipped_store_ids: array }
    side_effects: ["Creates PLANNED orders; DISCONTINUED products excluded from lines"]
  - method: GET
    path: "/dairy/orders/{id}"
    description: "Get an order"
    roles: [Any]
    code: 200
    input: []
    output: RouteOrder
    side_effects: []
  - method: GET
    path: "/dairy/orders"
    description: "List orders filtered by store/trip (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["store_id?", "trip_id?", "fulfillment_status?", "limit?", "offset?"]
    output: "RouteOrder[]"
    side_effects: []
  - method: POST
    path: "/dairy/orders/{id}/confirm"
    description: "Confirm an order: dock-buffer check, capacity re-validation, credit check (priority: temporal > constraint > fiscal)"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: RouteOrder
    side_effects: ["fulfillment_status -> CONFIRMED; line cases computed; trip.loaded_cases increased"]
  - method: POST
    path: "/dairy/orders/{id}/cancel"
    description: "Cancel a PLANNED or CONFIRMED order; releases reserved cases"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: RouteOrder
    side_effects: ["fulfillment_status -> CANCELLED; trip.loaded_cases decreased if was CONFIRMED"]
  - method: POST
    path: "/dairy/orders/{id}/deliver"
    description: "Deliver a CONFIRMED order (trip DEPARTED, caller is trip driver); snapshots prices, creates Invoice and crate DROP"
    roles: [RouteDriver]
    code: 200
    input: [delivered_lines]
    output: RouteOrder
    side_effects: ["fulfillment_status -> DELIVERED; invoice created (payment_status -> INVOICED); crate DROP; store.crate_balance/open_ar_cents recomputed; trip load fields updated"]

  # --- Invoice ---
  - method: GET
    path: "/dairy/invoices/{id}"
    description: "Get an invoice"
    roles: [Any]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/dairy/invoices"
    description: "List invoices filtered by order/store (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["order_id?", "store_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: POST
    path: "/dairy/invoices/{id}/payments"
    description: "Record a payment from the store (amount must be > 0 and <= amount_due_cents)"
    roles: [StoreReceiver]
    code: 201
    input: [amount_cents]
    output: Invoice
    side_effects: ["payments_applied_cents += amount; amount_due recomputed; SETTLED at 0; order.payment_status re-derived; store.open_ar_cents recomputed"]
  - method: POST
    path: "/dairy/invoices/{id}/void"
    description: "Void an OPEN invoice with no payments and no credits"
    roles: [TerritoryManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VOID; order.payment_status -> UNINVOICED; store.open_ar_cents recomputed"]

  # --- Return ---
  - method: POST
    path: "/dairy/returns"
    description: "Submit a return scan (order must be DELIVERED; eligibility window per reason_code; caller must be the order trip's driver)"
    roles: [RouteDriver]
    code: 201
    input: [order_id, store_id, pickup_trip_id, product_id, quantity_units, reason_code, scanned_code_date]
    output: Return
    side_effects: ["status = UNDER_REVIEW; days_to_expiry_at_scan, credit_pct, unit_credit_cents, credit_amount_cents computed"]
  - method: GET
    path: "/dairy/returns/{id}"
    description: "Get a return"
    roles: [Any]
    code: 200
    input: []
    output: Return
    side_effects: []
  - method: GET
    path: "/dairy/returns"
    description: "List returns filtered by order/store/pickup trip (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["order_id?", "store_id?", "pickup_trip_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "Return[]"
    side_effects: []
  - method: POST
    path: "/dairy/returns/{id}/approve"
    description: "Approve a return UNDER_REVIEW or DISPUTED (owner); system immediately credits it"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: Return
    side_effects: ["status UNDER_REVIEW/DISPUTED -> APPROVED -> CREDITED; CreditMemo created and auto-applied"]
  - method: POST
    path: "/dairy/returns/{id}/reject"
    description: "Reject a return UNDER_REVIEW or DISPUTED (owner)"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: Return
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/dairy/returns/{id}/dispute"
    description: "Dispute a REJECTED return (store receiver of that store)"
    roles: [StoreReceiver]
    code: 200
    input: []
    output: Return
    side_effects: ["status REJECTED -> DISPUTED"]

  # --- CreditMemo ---
  - method: GET
    path: "/dairy/credit-memos/{id}"
    description: "Get a credit memo"
    roles: [Any]
    code: 200
    input: []
    output: CreditMemo
    side_effects: []
  - method: GET
    path: "/dairy/credit-memos"
    description: "List credit memos filtered by return/store/invoice (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["return_id?", "store_id?", "invoice_id?", "status?", "limit?", "offset?"]
    output: "CreditMemo[]"
    side_effects: []
  - method: POST
    path: "/dairy/credit-memos/{id}/apply"
    description: "Apply a memo's remaining balance to a chosen OPEN invoice of the same store (min(remaining, amount_due))"
    roles: [DistributorOwner]
    code: 200
    input: [invoice_id]
    output: CreditMemo
    side_effects: ["memo applied_cents/status updated; invoice credits_applied_cents/amount_due recomputed; order.payment_status re-derived"]
  - method: POST
    path: "/dairy/credit-memos/{id}/void"
    description: "Void an ISSUED/PARTIALLY_APPLIED memo; compensates its invoice application (restores amount_due)"
    roles: [TerritoryManager]
    code: 200
    input: []
    output: CreditMemo
    side_effects: ["status -> VOID; applied amount returned to invoice amount_due; invoice may reopen SETTLED -> OPEN"]

  # --- CrateTransaction ---
  - method: POST
    path: "/dairy/stores/{id}/crate-transactions"
    description: "Record a backhaul crate PICKUP (RouteDriver of any trip serving the store's route... caller must be a driver of the store's route owner) or an ADJUSTMENT (DistributorOwner only); kind=DROP is rejected as system-only (ERR_INVALID_REQUEST)"
    roles: [RouteDriver, DistributorOwner]
    code: 201
    input: [kind, crate_count, "note?"]
    output: CrateTransaction
    side_effects: ["store.crate_balance updated; deposit_liability_cents recomputed; Store.version incremented"]
  - method: GET
    path: "/dairy/stores/{id}/crate-transactions"
    description: "List crate transactions of a store (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "CrateTransaction[]"
    side_effects: []

  # --- MerchandisingSession ---
  - method: POST
    path: "/dairy/trips/{id}/merchandising-sessions"
    description: "Check in a store-door merchandising session (caller is trip driver; at most one OPEN session per driver; store must be on trip's route)"
    roles: [RouteDriver]
    code: 201
    input: [store_id]
    output: MerchandisingSession
    side_effects: ["status = OPEN; check_in_at = current clock"]
  - method: POST
    path: "/dairy/merchandising-sessions/{id}/close"
    description: "Close an OPEN session; computes minutes/billable_minutes/labor_charge_cents"
    roles: [RouteDriver]
    code: 200
    input: []
    output: MerchandisingSession
    side_effects: ["status -> CLOSED; check_out_at = current clock; labor fields computed"]
  - method: GET
    path: "/dairy/merchandising-sessions/{id}"
    description: "Get a session"
    roles: [Any]
    code: 200
    input: []
    output: MerchandisingSession
    side_effects: []
  - method: GET
    path: "/dairy/merchandising-sessions"
    description: "List sessions filtered by trip/store/driver (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["trip_id?", "store_id?", "driver_id?", "status?", "limit?", "offset?"]
    output: "MerchandisingSession[]"
    side_effects: []

  # --- RouteSaleListing ---
  - method: POST
    path: "/dairy/route-sale-listings"
    description: "Create a sale listing (DRAFT) for an ACTIVE route owned by the caller; no other non-terminal listing for the route (ERR_INVALID_REQUEST)"
    roles: [DistributorOwner]
    code: 201
    input: [route_id, asking_price_cents, "trailing_weeks?"]
    output: RouteSaleListing
    side_effects: ["status = DRAFT; seller_distributor_id = X-User-ID"]
  - method: GET
    path: "/dairy/route-sale-listings/{id}"
    description: "Get a listing"
    roles: [Any]
    code: 200
    input: []
    output: RouteSaleListing
    side_effects: []
  - method: GET
    path: "/dairy/route-sale-listings"
    description: "List listings filtered by route/seller (FK reverse reachability)"
    roles: [Any]
    code: 200
    input: ["route_id?", "seller_distributor_id?", "buyer_distributor_id?", "status?", "limit?", "offset?"]
    output: "RouteSaleListing[]"
    side_effects: []
  - method: POST
    path: "/dairy/route-sale-listings/{id}/publish"
    description: "Publish a DRAFT listing; snapshots territory_value_cents"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: RouteSaleListing
    side_effects: ["status -> LISTED; territory_value_cents computed"]
  - method: POST
    path: "/dairy/route-sale-listings/{id}/submit-offer"
    description: "Submit an offer as a buyer distributor (buyer != seller); listing LISTED -> OFFER_PENDING"
    roles: [DistributorOwner]
    code: 200
    input: [buyer_distributor_id, offer_price_cents]
    output: RouteSaleListing
    side_effects: ["status -> OFFER_PENDING; buyer_distributor_id, offer_price_cents recorded"]
  - method: POST
    path: "/dairy/route-sale-listings/{id}/accept-offer"
    description: "Seller accepts the pending offer"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: RouteSaleListing
    side_effects: ["status -> UNDER_CONTRACT"]
  - method: POST
    path: "/dairy/route-sale-listings/{id}/reject-offer"
    description: "Seller rejects the pending offer; listing cycles back to LISTED with buyer fields cleared"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: RouteSaleListing
    side_effects: ["status -> LISTED; buyer fields cleared"]
  - method: POST
    path: "/dairy/route-sale-listings/{id}/withdraw"
    description: "Seller withdraws a LISTED or OFFER_PENDING listing"
    roles: [DistributorOwner]
    code: 200
    input: []
    output: RouteSaleListing
    side_effects: ["status -> WITHDRAWN; buyer fields cleared"]
  - method: POST
    path: "/dairy/route-sale-listings/{id}/approve-transfer"
    description: "Territory manager closes an UNDER_CONTRACT listing; route ownership transfers to buyer"
    roles: [TerritoryManager]
    code: 200
    input: []
    output: RouteSaleListing
    side_effects: ["status -> CLOSED; route.distributor_id <- buyer; route.version incremented"]

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TerritoryManager
    description: "Dairy company staff: registers distributors, administers routes/products, approves territory transfers, voids invoices/credit memos, drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /dairy/distributors"
      - "POST /dairy/routes and /activate /suspend /retire"
      - "POST /dairy/products and /discontinue"
      - "POST /dairy/invoices/{id}/void"
      - "POST /dairy/credit-memos/{id}/void"
      - "POST /dairy/route-sale-listings/{id}/approve-transfer"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: MarketAdministrator
    description: "Publishes regulated milk price announcements and manages pricing periods"
    identity: opaque
    exclusive_operations:
      - "POST /dairy/pricing-periods and /close"
      - "POST /dairy/pricing-periods/{id}/announcements"
    shared_operations: ["All GET endpoints"]
  - name: DistributorOwner
    description: "Owner-operator: owns routes, hires drivers, onboards stores, manages pars, plans trips, confirms/cancels orders, approves/rejects returns, applies credits, adjusts crates, sells/buys routes"
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /dairy/drivers"
      - "POST /dairy/stores, PATCH /dairy/stores/{id}, /deactivate, /reactivate"
      - "POST /dairy/stores/{id}/standing-pars"
      - "POST /dairy/trips, /cancel, /reconcile"
      - "POST /dairy/trips/{id}/generate-orders"
      - "POST /dairy/orders, /confirm, /cancel"
      - "POST /dairy/returns/{id}/approve and /reject"
      - "POST /dairy/credit-memos/{id}/apply"
      - "POST /dairy/stores/{id}/crate-transactions with kind=ADJUSTMENT"
      - "POST /dairy/route-sale-listings, /publish, /submit-offer, /accept-offer, /reject-offer, /withdraw"
    shared_operations: ["All GET endpoints", "GET /dairy/drivers/{id}/weekly-settlement"]
  - name: RouteDriver
    description: "Route driver: departs/completes trips, logs temperatures, delivers orders, submits returns, picks up crates, performs merchandising"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /dairy/trips/{id}/depart and /complete"
      - "POST /dairy/trips/{id}/temperature-readings"
      - "POST /dairy/orders/{id}/deliver"
      - "POST /dairy/returns"
      - "POST /dairy/stores/{id}/crate-transactions with kind=PICKUP"
      - "POST /dairy/trips/{id}/merchandising-sessions and /merchandising-sessions/{id}/close"
    shared_operations: ["All GET endpoints", "GET /dairy/drivers/{id}/weekly-settlement (self only)"]
  - name: StoreReceiver
    description: "Store-side receiver: pays invoices, disputes rejected returns"
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /dairy/invoices/{id}/payments"
      - "POST /dairy/returns/{id}/dispute"
    shared_operations: ["All GET endpoints"]
  - name: QualityInspector
    description: "Cold-chain QA: reviews breached trips and adjudicates (segregated from the driver who logged the readings)"
    identity: opaque
    exclusive_operations:
      - "POST /dairy/trips/{id}/qa-review"
      - "POST /dairy/trips/{id}/adjudicate"
    shared_operations: ["All GET endpoints"]
  - name: Any
    description: "Every authenticated role may read"
    identity: opaque
    shared_operations: ["All GET endpoints"]
