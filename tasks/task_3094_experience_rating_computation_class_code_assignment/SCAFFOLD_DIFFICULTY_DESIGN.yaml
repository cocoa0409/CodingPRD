              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_p1: $.data.id }
            - call: "POST /unit-stat-reports"
              payload: { policy_id: "${policy_p1}", payroll_lines: [{ class_code: "3632", payroll_dollars: 2000000 } ], claim_lines: [{ claim_number: "C1", claim_type: "INDEMNITY", incurred_cents: 1600000, paid_cents: 1600000, claim_status: "CLOSED", state_code: "TX" }, { claim_number: "C2", claim_type: "INDEMNITY", incurred_cents: 2400000, paid_cents: 2400000, claim_status: "CLOSED", state_code: "TX" } ] }
              as: CarrierDataReporter
