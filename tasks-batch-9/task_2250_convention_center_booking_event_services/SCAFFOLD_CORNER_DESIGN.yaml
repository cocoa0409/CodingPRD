          Two orders differing by a single unit straddle the first tier edge. At 100
          units the whole quantity prices at UTIL_TIER1_CENTS 1200 for a base of 120000;
          at 101 units only the extra unit moves to UTIL_TIER2_CENTS 900, giving 120900.
