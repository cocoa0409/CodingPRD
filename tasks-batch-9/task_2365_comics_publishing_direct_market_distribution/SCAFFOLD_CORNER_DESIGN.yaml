    grounds: [state_machines.Title.GREENLIT_to_CANCELLED, state_machines.Issue.UNSOLICITED_to_CANCELLED,
      state_machines.ProductionStage.IN_PROGRESS_to_CANCELLED]
    excluded_because: {difficulty_instance: title_cancellation_cascades_to_issue_to_invoiced_order_to_retailer_credit,
      rationale: 'That §1.8 instance drives the whole fan-out (assignments TERMINATED, issues CANCELLED,
        stages and PLANNED runs CANCELLED, orders CANCELLED, retailer ledgers recomputed) and asserts
        each hop, including that SHIPPED orders are left untouched.'}
