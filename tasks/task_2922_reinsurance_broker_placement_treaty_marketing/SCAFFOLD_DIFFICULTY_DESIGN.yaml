            - call: "POST /quotes/${q_a}/firm-order"
              payload: { accepted_line_pct: 60.0000, expected_layer_version: "${lv1}" }
              as: BrokerPlacementLead
              captures: { sl_a: $.data.id }
            - call: "GET /layers/${layer_id}"
              payload: {}
              as: BrokerPlacementLead
              captures: { lv2: $.data.version, layer_status_before: $.data.status, written_before: $.data.written_line_total_pct }
          trigger:
            - call: "POST /quotes/${q_b}/firm-order"
              payload: { accepted_line_pct: 50.0000, expected_layer_version: "${lv2}" }
              as: BrokerPlacementLead
              captures: { sl_b: $.data.id }
          assert:
            - "${layer_status_before} == PARTIALLY_PLACED and ${written_before} == 60.0000"
            - "SigningLine.${sl_b}.status == PROVISIONAL  # link 1"
            - "SigningLine.${sl_b}.written_line_pct == 50.0000 and SigningLine.${sl_b}.signed_line_pct == null"
            - "SigningLine.${sl_b}.committed_capacity_minor == 500000000"
