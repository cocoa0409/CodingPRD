scenario: "930. Passport & Visa Expediting Service: order & service level, document review & completeness, embassy/agency courier & appointment, status tracking & rush, government-fee vs service-fee, photo & form prep, rejection/RFE handling, delivery"
domain_name: "passport-visa-expediting"
api_prefix: "/expediting"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    Three axes evolve independently on Order (workflow_status x payment_status x
    custody_holder) and a fourth derived axis (feasibility_status) is recomputed
    from the calculation layer. Money is split into two NON-FUNGIBLE streams --
    GOVERNMENT (pass-through, never discounted, non-refundable once tendered) and
    SERVICE (discountable, refundable on a stage-keyed sliding schedule). The
    physical passport book is a single-token resource whose holder is conserved
    (exactly one open CustodyEvent per Order at all times). Density comes from the
    interlock: the agency-custody write gate pre-empts most lower validation rungs,
    the AgencyForm revision cascade regresses five entity hops, and the SLA clock is
    a partition over RUNNING/PAUSED segments rather than a wall-clock difference.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Global constants. Every ALL_CAPS constant referenced anywhere in this scaffold
# is declared here with a concrete value. Calculation-local `constants:` blocks
# repeat the subset each formula uses; the values are identical.
# ---------------------------------------------------------------------------
global_constants:

  # --- logical clock -------------------------------------------------------
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # --- business calendar ---------------------------------------------------
  BUSINESS_WEEK_DAYS: "MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY"
  BUSINESS_DAY_START_HOUR_UTC: 9
  BUSINESS_DAY_END_HOUR_UTC: 17
  BUSINESS_DAY_MINUTES: 480

  # --- service level tiers -------------------------------------------------
  STANDARD_SURCHARGE_PCT: 0.00
  EXPEDITED_SURCHARGE_PCT: 0.35
  RUSH_SURCHARGE_PCT: 0.80
  STANDARD_CUTOFF_HOUR_UTC: 21
  EXPEDITED_CUTOFF_HOUR_UTC: 18
  RUSH_CUTOFF_HOUR_UTC: 15
  STANDARD_TURNAROUND_BUSINESS_DAYS: 15
  EXPEDITED_TURNAROUND_BUSINESS_DAYS: 8
  RUSH_TURNAROUND_BUSINESS_DAYS: 3
  TIER_UPGRADE_ADMIN_FEE_CENTS: 2500

  # --- order money ---------------------------------------------------------
  ORDER_HANDLING_FEE_CENTS: 3000
  MULTI_APPLICANT_MIN_COUNT: 3
  MULTI_APPLICANT_DISCOUNT_PCT: 0.10
  MULTI_APPLICANT_WAIVER_FLOOR_CENTS: 20000
  MAX_DISCOUNT_PCT: 0.25
  SPLIT_ADMIN_FEE_CENTS: 1500

  # --- refund sliding schedule (keyed to Order.furthest_stage_reached) ------
  REFUND_PCT_DRAFT: 1.00
  REFUND_PCT_QUOTED: 1.00
  REFUND_PCT_INTAKE: 0.75
  REFUND_PCT_READY_FOR_SUBMISSION: 0.50
  REFUND_PCT_SUBMITTED: 0.25
  REFUND_PCT_AT_AGENCY: 0.15

  # --- document / photo / form prep ---------------------------------------
  PASSPORT_VALIDITY_MONTHS_BEYOND_RETURN: 6
  SUPPORTING_DOC_VALIDITY_DAYS: 90
  DOCUMENT_RESUBMISSION_CAP: 2
  PHOTO_VALIDITY_DAYS: 180
  PHOTO_RETAKE_CAP: 3
  PHOTO_MIN_HEAD_HEIGHT_RATIO: 0.50
  PHOTO_MAX_HEAD_HEIGHT_RATIO: 0.69
  PHOTO_MIN_RESOLUTION_PX: 600
  MINOR_AGE_THRESHOLD_YEARS: 16

  # --- consulate appointments ---------------------------------------------
  APPOINTMENT_LEAD_TIME_HOURS: 48
  APPOINTMENT_RESCHEDULE_CAP: 2
  NO_SHOW_REBOOK_CAP: 2

  # --- courier / custody ---------------------------------------------------
  COURIER_LEG_BUSINESS_DAYS: 1
  COURIER_REDISPATCH_CAP: 2

  # --- agency RFE / decision ----------------------------------------------
  RFE_RESPONSE_BUSINESS_DAYS: 10
  RFE_ROUND_CAP: 2

  # --- feasibility / delivery ---------------------------------------------
  TRAVEL_DATE_BUFFER_DAYS: 5
  DELIVERY_BUSINESS_DAYS: 2
  DELIVERY_ATTEMPT_CAP: 3
  DELIVERY_ESCALATION_THRESHOLD_DAYS: 7
  DELIVERY_ESCALATION_FEE_CENTS: 4500

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:

  - name: ServiceCatalogItem
    parent: null
    common_fields: true
    description: "Configuration row keyed by (nationality_code, destination_country, visa_type). Supplies the government fee, its basis, the base service fee, the agency form code and the turnaround override."
    fields:
      - name: nationality_code
        type: string
        source: input
        description: "ISO-3166 alpha-2 country of the applicant's citizenship this catalog row serves."
        constraints: "exactly 2 uppercase letters"
      - name: destination_country
        type: string
        source: input
        description: "ISO-3166 alpha-2 destination country this catalog row serves."
        constraints: "exactly 2 uppercase letters"
      - name: visa_type
        type: enum
        source: input
        description: "Product this catalog row prices."
        constraints: "one of TOURIST, BUSINESS, STUDENT, PASSPORT_RENEWAL, PASSPORT_FIRST_TIME"
      - name: government_fee_cents
        type: integer
        source: input
        description: "Pass-through consular/agency fee in cents. Never discounted."
        constraints: ">= 0"
      - name: government_fee_basis
        type: enum
        source: input
        description: "Whether the government fee is charged once per order or once per applicant."
        constraints: "one of PER_APPLICANT, PER_ORDER"
      - name: base_service_fee_cents
        type: integer
        source: input
        description: "Service fee in cents charged per applicant before tier surcharge and discount."
        constraints: ">= 0"
      - name: agency_turnaround_override_days
        type: integer
        source: input
        description: "When non-null, replaces the tier default business-day turnaround for this product."
        default: null
        constraints: "null or >= 1"
      - name: form_code
        type: string
        source: input
        description: "AgencyForm.form_code every applicant on an order of this product must have PREPARED."
      - name: requires_appointment
        type: boolean
        source: input
        description: "When true, every applicant must hold an ATTENDED Appointment before the order can be submitted."
        default: false

  - name: DocumentRequirement
    parent: ServiceCatalogItem
    common_fields: false
    description: "One required-or-optional document line under a catalog item. The applicant's derived requirement set is the subset of these rows whose age gate the applicant satisfies."
    fields:
      - name: catalog_item_id
        type: string
        source: input
        description: "FK -> ServiceCatalogItem.id; the product this requirement belongs to."
      - name: doc_type
        type: enum
        source: input
        description: "Document class this line requires."
        constraints: "one of PASSPORT_BOOK, PROOF_OF_TRAVEL, INVITATION_LETTER, BANK_STATEMENT, VACCINATION_CERT, EMPLOYMENT_LETTER, PARENTAL_CONSENT"
      - name: is_required
        type: boolean
        source: input
        description: "When true this document gates order submission; when false it never gates."
      - name: validity_rule
        type: enum
        source: input
        description: "Which validity window the reviewer must evaluate on acceptance."
        constraints: "one of NONE, EXPIRES_AFTER_ISSUE_DAYS, VALID_BEYOND_RETURN_MONTHS"
      - name: validity_param
        type: integer
        source: input
        description: "Numeric parameter for validity_rule; days for EXPIRES_AFTER_ISSUE_DAYS, months for VALID_BEYOND_RETURN_MONTHS, ignored for NONE."
        default: null
        constraints: "null when validity_rule == NONE, else >= 1"
      - name: applies_max_age_years
        type: integer
        source: input
        description: "Requirement applies only to applicants whose computed age_years is strictly less than this value. Omitting the field on a PARENTAL_CONSENT line stores MINOR_AGE_THRESHOLD_YEARS (16); omitting it on any other doc_type stores null, meaning the line applies at every age."
        default: null
        constraints: "null, or >= 1"

  - name: AgencyForm
    parent: null
    common_fields: true
    description: "A revision of a government form. Publishing a higher revision of the same form_code supersedes the prior ACTIVE revision and starts the depth-5 staleness cascade."
    fields:
      - name: form_code
        type: string
        source: input
        description: "Stable form identifier, e.g. DS-11. Revisions share the form_code."
      - name: revision
        type: integer
        source: input
        description: "Monotonic revision number within a form_code."
        constraints: ">= 1"
      - name: required_field_count
        type: integer
        source: input
        description: "Number of fields a PreparedForm must have filled for this revision to be accepted."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Publication state of this revision."
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, SUPERSEDED"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant at which this revision became ACTIVE; null while DRAFT."
        default: null

  - name: Consulate
    parent: null
    common_fields: true
    description: "A destination country's mission with an exclusive residence-region jurisdiction and a closure calendar."
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the mission."
      - name: destination_country
        type: string
        source: input
        description: "ISO-3166 alpha-2 country this mission represents."
        constraints: "exactly 2 uppercase letters"
      - name: jurisdiction_region_codes
        type: array
        source: input
        description: "Residence region codes this mission serves. Region codes are globally exclusive across consulates of the same destination_country."
        constraints: "non-empty array of strings"
      - name: closure_dates
        type: array
        source: system
        description: "Calendar dates (YYYY-MM-DD) on which this mission is closed. Blocks slot booking and courier dispatch."
        default: []

  - name: AppointmentSlot
    parent: Consulate
    common_fields: true
    description: "A bookable interview window at a consulate with hard per-slot capacity."
    fields:
      - name: consulate_id
        type: string
        source: input
        description: "FK -> Consulate.id; the mission owning this slot."
      - name: starts_at
        type: datetime
        source: input
        description: "Logical-clock instant the slot begins."
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of Appointments in booking_status BOOKED this slot may hold."
        constraints: ">= 1"
      - name: booked_count
        type: integer
        source: computed
        description: "Count of Appointments on this slot whose booking_status is in the set {BOOKED, ATTENDED}."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "OPEN while booked_count < capacity; FULL when booked_count == capacity; CLOSED when starts_at falls on a closure_date of the owning consulate."
        default: OPEN
        constraints: "one of OPEN, FULL, CLOSED"

  - name: Order
    parent: null
    common_fields: true
    description: "The expediting engagement. Carries three independent state axes (workflow_status x payment_status x custody_holder), a derived feasibility_status, and the two-stream money ledger roll-up."
    fields:
      - name: catalog_item_id
        type: string
        source: input
        description: "FK -> ServiceCatalogItem.id; pins the product, its fees, its form_code and its requirement set."
      - name: consulate_id
        type: string
        source: input
        description: "FK -> Consulate.id; the mission that will process this order. Required when the catalog item has requires_appointment == true, otherwise optional."
        default: null
      - name: parent_order_id
        type: string
        source: system
        description: "FK -> Order.id; set on a child order produced by a split, null on a root order."
        default: null
      - name: service_level
        type: enum
        source: input
        description: "Tier governing surcharge, agency turnaround assumption and same-day submission cutoff hour."
        default: STANDARD
        constraints: "one of STANDARD, EXPEDITED, RUSH"
      - name: travel_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the traveller departs. Anchors feasibility and delivery escalation."
      - name: return_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the traveller returns. Anchors the passport validity window."
        constraints: "must be >= travel_date"
      - name: delivery_region_code
        type: string
        source: input
        description: "Region code the finished passport is shipped to."
      - name: workflow_status
        type: enum
        source: system
        description: "Primary lifecycle axis."
        default: DRAFT
        constraints: "one of DRAFT, QUOTED, INTAKE, READY_FOR_SUBMISSION, SUBMITTED, AT_AGENCY, RFE_PENDING, APPROVED, REJECTED, DELIVERING, COMPLETED, CANCELLED, ABANDONED"
      - name: payment_status
        type: enum
        source: system
        description: "Money axis, evolving independently of workflow_status."
        default: UNPAID
        constraints: "one of UNPAID, PARTIALLY_COLLECTED, COLLECTED, REFUND_PENDING, PARTIALLY_REFUNDED, REFUNDED"
      - name: custody_holder
        type: enum
        source: system
        description: "Who physically holds the passport book right now. Exactly one holder at any instant."
        default: APPLICANT
        constraints: "one of APPLICANT, SERVICE, COURIER, AGENCY"
      - name: feasibility_status
        type: enum
        source: computed
        description: "Derived from projected_completion_date against travel_date minus TRAVEL_DATE_BUFFER_DAYS."
        default: UNKNOWN
        constraints: "one of UNKNOWN, FEASIBLE, INFEASIBLE, ACKNOWLEDGED_INFEASIBLE"
      - name: furthest_stage_reached
        type: enum
        source: system
        description: "Monotonic high-water mark over workflow_status; never decreases even when workflow_status regresses. Keys the service-fee refund schedule."
        default: DRAFT
        constraints: "one of DRAFT, QUOTED, INTAKE, READY_FOR_SUBMISSION, SUBMITTED, AT_AGENCY"
      - name: applicant_count
        type: integer
        source: computed
        description: "Count of Applicants under this order whose readiness_status is in the set {PENDING, COMPLETE}."
        default: 0
      - name: government_fee_quoted_cents
        type: integer
        source: computed
        description: "GOVERNMENT-stream quote total; see calculation government_fee_total."
        default: 0
      - name: service_fee_quoted_cents
        type: integer
        source: computed
        description: "SERVICE-stream quote total after tier surcharge, discount, handling fee and waiver; see calculation service_fee_total."
        default: 0
      - name: total_quoted_cents
        type: integer
        source: computed
        description: "government_fee_quoted_cents + service_fee_quoted_cents."
        default: 0
      - name: discount_pct_applied
        type: number
        source: computed
        description: "Discount fraction actually applied to the SERVICE stream on the most recent quote."
        default: 0
      - name: handling_fee_waived
        type: boolean
        source: computed
        description: "True when the multi-applicant handling-fee waiver was granted on the most recent quote."
        default: false
      - name: collected_government_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents over rows of this order with stream == GOVERNMENT and kind == COLLECTION, minus GOVERNMENT TRANSFER_OUT rows, plus GOVERNMENT TRANSFER_IN rows."
        default: 0
      - name: collected_service_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents over rows of this order with stream == SERVICE and kind == COLLECTION, minus SERVICE TRANSFER_OUT rows, plus SERVICE TRANSFER_IN rows."
        default: 0
      - name: collected_cents
        type: integer
        source: computed
        description: "collected_government_cents + collected_service_cents."
        default: 0
      - name: government_tendered_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents over rows of this order with stream == GOVERNMENT and kind == TENDER."
        default: 0
      - name: service_earned_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents over rows of this order with stream == SERVICE and kind == EARN."
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents over rows of this order with kind == REFUND."
        default: 0
      - name: refund_scheduled_cents
        type: integer
        source: computed
        description: "Refund amount adjudicated but not yet disbursed. Non-zero only while payment_status == REFUND_PENDING; disbursed (and reset to 0) when the AGENCY -> SERVICE return leg reaches DELIVERED."
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: "Held customer money not yet released to the agency, recognised as service revenue, or refunded. Maintained incrementally: every COLLECTION and TRANSFER_IN adds to it; every TENDER, EARN, REFUND and TRANSFER_OUT subtracts from it. The money conservation invariant asserts it equals collected_cents - government_tendered_cents - service_earned_cents - refunded_cents."
        default: 0
      - name: quoted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CaseManager who produced the most recent quote. Segregation-of-duties input for submission."
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CaseManager who submitted the order."
        default: null
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who acknowledged an INFEASIBLE projection."
        default: null
      - name: quoted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent quote."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the order left READY_FOR_SUBMISSION."
        default: null
      - name: tendered_at
        type: datetime
        source: system
        description: "Logical-clock instant the passport was tendered to the agency."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant the agency decision was recorded."
        default: null
      - name: effective_submission_date
        type: string
        source: computed
        description: "Calendar date (YYYY-MM-DD) the agency treats as the submission date, after applying the tier cutoff hour and the business calendar."
        default: null
      - name: projected_completion_date
        type: string
        source: computed
        description: "Calendar date (YYYY-MM-DD) the finished passport is projected to reach the delivery address."
        default: null
      - name: rfe_round_count
        type: integer
        source: computed
        description: "Count of RFE rows under this order in any rfe_status. Capped by RFE_ROUND_CAP."
        default: 0

  - name: Applicant
    parent: Order
    common_fields: true
    description: "One traveller on an order. Owns documents, a photo, a prepared form and an appointment. Its readiness_status is the aggregate gate the order reads."
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; the order currently carrying this applicant. Rewritten by a split."
      - name: full_name
        type: string
        source: input
        description: "Legal name as printed on the passport."
      - name: date_of_birth
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) of birth. Feeds age_years."
      - name: nationality_code
        type: string
        source: input
        description: "ISO-3166 alpha-2 citizenship. Must equal the order's catalog item nationality_code."
        constraints: "exactly 2 uppercase letters"
      - name: residence_region_code
        type: string
        source: input
        description: "Region code of residence. Must fall inside the order consulate's jurisdiction_region_codes to book an appointment."
      - name: readiness_status
        type: enum
        source: computed
        description: "COMPLETE when every derived required document is ACCEPTED, the photo is PASSED, the prepared form is PREPARED or SIGNED on the ACTIVE revision, and (when the product requires it) an ATTENDED appointment exists."
        default: PENDING
        constraints: "one of PENDING, COMPLETE, WITHDRAWN"
      - name: age_years
        type: integer
        source: computed
        description: "Whole years from date_of_birth to the owning Order.travel_date, floored."
        default: 0
      - name: required_doc_count
        type: integer
        source: computed
        description: "Size of the derived required-document set; see calculation required_document_set."
        default: 0
      - name: accepted_doc_count
        type: integer
        source: computed
        description: "Count of this applicant's ApplicantDocument rows whose doc_type is in the derived required set and whose review_status == ACCEPTED."
        default: 0

  - name: ApplicantDocument
    parent: Applicant
    common_fields: true
    description: "One document slot on an applicant. Created in MISSING for every DocumentRequirement of the product when the applicant is created; walks MISSING -> RECEIVED -> ACCEPTED|REJECTED with a capped resubmission loop."
    fields:
      - name: applicant_id
        type: string
        source: system
        description: "FK -> Applicant.id; the applicant this document slot belongs to."
      - name: doc_type
        type: enum
        source: system
        description: "Document class, copied from the DocumentRequirement row that generated this slot."
        constraints: "one of PASSPORT_BOOK, PROOF_OF_TRAVEL, INVITATION_LETTER, BANK_STATEMENT, VACCINATION_CERT, EMPLOYMENT_LETTER, PARENTAL_CONSENT"
      - name: is_required
        type: boolean
        source: system
        description: "Copied from DocumentRequirement.is_required at slot creation. Only true slots gate submission."
        default: false
      - name: validity_rule
        type: enum
        source: system
        description: "Copied from DocumentRequirement.validity_rule at slot creation."
        constraints: "one of NONE, EXPIRES_AFTER_ISSUE_DAYS, VALID_BEYOND_RETURN_MONTHS"
      - name: validity_param
        type: integer
        source: system
        description: "Copied from DocumentRequirement.validity_param at slot creation."
        default: null
      - name: review_status
        type: enum
        source: system
        description: "Per-document axis."
        default: MISSING
        constraints: "one of MISSING, RECEIVED, ACCEPTED, REJECTED"
      - name: issue_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the document was issued. Null while MISSING."
        default: null
      - name: expiry_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the document expires. Null while MISSING or when the document does not carry one."
        default: null
      - name: resubmission_count
        type: integer
        source: computed
        description: "Number of times this slot has re-entered RECEIVED from REJECTED. Capped by DOCUMENT_RESUBMISSION_CAP."
        default: 0
      - name: rejection_reason
        type: string
        source: system
        description: "Free-text reason recorded by the reviewer on the most recent REJECTED decision. Cleared to null when the slot re-enters RECEIVED."
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CaseManager who recorded the most recent review decision."
        default: null

  - name: PhotoAsset
    parent: Applicant
    common_fields: true
    description: "A passport photo submission with a capped retake loop and a compliance check on three named criteria."
    fields:
      - name: applicant_id
        type: string
        source: system
        description: "FK -> Applicant.id; the applicant this photo belongs to."
      - name: taken_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the photo was taken. Feeds the PHOTO_VALIDITY_DAYS window."
      - name: head_height_ratio
        type: number
        source: input
        description: "Head height as a fraction of image height."
        constraints: "0 < value < 1"
      - name: background_code
        type: enum
        source: input
        description: "Background colour classification."
        constraints: "one of WHITE, OFF_WHITE, COLORED"
      - name: resolution_px
        type: integer
        source: input
        description: "Shorter-edge pixel count."
        constraints: ">= 1"
      - name: compliance_status
        type: enum
        source: system
        description: "Per-photo axis."
        default: PENDING
        constraints: "one of PENDING, PASSED, FAILED, EXPIRED, SUPERSEDED"
      - name: retake_count
        type: integer
        source: computed
        description: "Number of retakes chained off this photo lineage. Capped by PHOTO_RETAKE_CAP."
        default: 0
      - name: failure_reasons
        type: array
        source: system
        description: "Named criteria that failed on the most recent compliance check, drawn from HEAD_HEIGHT, BACKGROUND, RESOLUTION."
        default: []

  - name: PreparedForm
    parent: Applicant
    common_fields: true
    description: "An applicant's filled agency form pinned to one AgencyForm revision. Goes STALE when a higher revision of the same form_code is published, and VOID when a newer preparation supersedes it."
    fields:
      - name: applicant_id
        type: string
        source: system
        description: "FK -> Applicant.id; the applicant this preparation belongs to."
      - name: agency_form_id
        type: string
        source: input
        description: "FK -> AgencyForm.id; the exact revision this preparation was filled against."
      - name: form_code
        type: string
        source: computed
        description: "Copied from the referenced AgencyForm.form_code."
      - name: revision_used
        type: integer
        source: computed
        description: "Copied from the referenced AgencyForm.revision."
      - name: filled_field_count
        type: integer
        source: input
        description: "Number of fields filled. Must be >= the referenced revision's required_field_count."
        constraints: ">= 0"
      - name: prep_status
        type: enum
        source: system
        description: "Per-form axis."
        default: PREPARED
        constraints: "one of PREPARED, SIGNED, STALE, VOID"
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant the preparation was signed."
        default: null
      - name: signed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the signer."
        default: null

  - name: Appointment
    parent: null
    common_fields: true
    description: "An applicant's consulate interview booking against one slot, with a capped reschedule loop and a no-show branch that consumes a rebook attempt."
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the traveller who must appear."
      - name: slot_id
        type: string
        source: input
        description: "FK -> AppointmentSlot.id; the slot currently held."
      - name: booking_status
        type: enum
        source: system
        description: "Per-appointment axis."
        default: BOOKED
        constraints: "one of BOOKED, ATTENDED, NO_SHOW, CANCELLED"
      - name: reschedule_count
        type: integer
        source: computed
        description: "Number of times this booking has moved to a different slot. Capped by APPOINTMENT_RESCHEDULE_CAP."
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: "Number of NO_SHOW outcomes recorded on this booking lineage. Capped by NO_SHOW_REBOOK_CAP."
        default: 0
      - name: booked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent booking or reschedule."

  - name: CourierLeg
    parent: Order
    common_fields: true
    description: "One ordered physical hop of the passport book. Legs execute strictly in leg_index order; a failed leg may be re-dispatched up to COURIER_REDISPATCH_CAP times."
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; the order whose passport this leg moves."
      - name: leg_index
        type: integer
        source: input
        description: "1-based position in the ordered hop sequence for this order."
        constraints: ">= 1"
      - name: from_holder
        type: enum
        source: input
        description: "Custody holder the book leaves."
        constraints: "one of APPLICANT, SERVICE, AGENCY"
      - name: to_holder
        type: enum
        source: input
        description: "Custody holder the book arrives at."
        constraints: "one of SERVICE, AGENCY, APPLICANT"
      - name: scheduled_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the leg is scheduled to be dispatched."
      - name: leg_status
        type: enum
        source: system
        description: "Per-leg axis."
        default: CREATED
        constraints: "one of CREATED, DISPATCHED, DELIVERED, FAILED, CANCELLED"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of dispatch attempts on this leg. The first dispatch sets it to 1; each re-dispatch after a FAILED increments it. Capped by 1 + COURIER_REDISPATCH_CAP."
        default: 0

  - name: CustodyEvent
    parent: Order
    common_fields: false
    description: "Append-only chain-of-custody record. Exactly one row per order has released_at == null at any instant."
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; the order whose passport is held."
      - name: holder_type
        type: enum
        source: system
        description: "Who holds the book for this interval."
        constraints: "one of APPLICANT, SERVICE, COURIER, AGENCY"
      - name: leg_index
        type: integer
        source: system
        description: "CourierLeg.leg_index when holder_type == COURIER, else null."
        default: null
      - name: acquired_at
        type: datetime
        source: system
        description: "Logical-clock instant this holder took the book."
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant this holder released the book; null for the single open row."
        default: null
      - name: reason
        type: string
        source: system
        description: "Named cause of the handover, drawn from ORDER_CREATED, LEG_DISPATCHED, LEG_DELIVERED, LEG_FAILED_RETURN, DECISION_RETURNED, SHIPMENT_DELIVERED, SHIPMENT_PICKED_UP."

  - name: RFE
    parent: Order
    common_fields: true
    description: "A request for evidence issued by the agency. Pauses the SLA clock while OPEN, carries a business-day deadline, and may be re-opened once when the response is judged INSUFFICIENT."
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; the order under evidence request."
      - name: round_index
        type: integer
        source: computed
        description: "1-based ordinal of this RFE among the order's RFE rows, ordered by created_at ASC."
      - name: requested_doc_type
        type: enum
        source: input
        description: "Document class the agency wants re-supplied."
        constraints: "one of PASSPORT_BOOK, PROOF_OF_TRAVEL, INVITATION_LETTER, BANK_STATEMENT, VACCINATION_CERT, EMPLOYMENT_LETTER, PARENTAL_CONSENT"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the RFE was issued or re-opened."
      - name: deadline_at
        type: datetime
        source: computed
        description: "issued_at advanced by RFE_RESPONSE_BUSINESS_DAYS business days on the order consulate's calendar, at BUSINESS_DAY_END_HOUR_UTC."
      - name: rfe_status
        type: enum
        source: system
        description: "Per-RFE axis."
        default: OPEN
        constraints: "one of OPEN, RESPONDED, CLEARED, INSUFFICIENT, EXPIRED"
      - name: responded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent response."
        default: null
      - name: response_count
        type: integer
        source: computed
        description: "Number of responses recorded against this RFE row."
        default: 0

  - name: LedgerEntry
    parent: Order
    common_fields: false
    description: "Append-only money row. The stream field makes GOVERNMENT and SERVICE money non-fungible; no entry may move value between streams."
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; the order this money belongs to."
      - name: stream
        type: enum
        source: system
        description: "Which non-fungible money stream this row belongs to."
        constraints: "one of GOVERNMENT, SERVICE"
      - name: kind
        type: enum
        source: system
        description: "Movement class. COLLECTION brings customer money in; TENDER hands GOVERNMENT money to the agency; EARN recognises SERVICE money; REFUND returns money to the customer; TRANSFER_OUT and TRANSFER_IN move held money between a parent order and its split child."
        constraints: "one of COLLECTION, TENDER, EARN, REFUND, TRANSFER_OUT, TRANSFER_IN"
      - name: amount_cents
        type: integer
        source: input
        description: "Positive magnitude of the movement in cents."
        constraints: ">= 1"
      - name: reason
        type: string
        source: system
        description: "Named cause, drawn from CUSTOMER_PAYMENT, AGENCY_TENDER, SERVICE_RECOGNITION, CANCELLATION_REFUND, REJECTION_REFUND, SPLIT_PARTITION."
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the row was written."

  - name: Shipment
    parent: Order
    common_fields: true
    description: "Return delivery of the finished passport with a capped signature-required attempt loop that falls back to hold-for-pickup."
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; the order being delivered."
      - name: method
        type: enum
        source: input
        description: "Carrier service level."
        constraints: "one of GROUND, OVERNIGHT, COURIER_SAME_DAY"
      - name: address_region_code
        type: string
        source: input
        description: "Region code the parcel is addressed to. May be changed while the order is under the agency-custody write gate."
      - name: signature_required
        type: boolean
        source: input
        description: "When true a failed attempt does not deliver; when false the first attempt always delivers."
        default: true
      - name: delivery_status
        type: enum
        source: system
        description: "Per-shipment axis."
        default: CREATED
        constraints: "one of CREATED, OUT_FOR_DELIVERY, DELIVERED, HELD_FOR_PICKUP, PICKED_UP"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of delivery attempts recorded. Capped by DELIVERY_ATTEMPT_CAP."
        default: 0
      - name: escalation_fee_cents
        type: integer
        source: computed
        description: "SERVICE-stream surcharge added to the order's quoted total when the method was escalated because the travel date was within DELIVERY_ESCALATION_THRESHOLD_DAYS."
        default: 0

  - name: SlaSegment
    parent: Order
    common_fields: false
    description: "Append-only partition of the agency SLA clock into RUNNING and PAUSED intervals. Segments tile [submitted_at, decided_at] with no gaps and no overlaps."
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; the order whose clock this segment partitions."
      - name: segment_kind
        type: enum
        source: system
        description: "Whether the SLA clock advances during this interval."
        constraints: "one of RUNNING, PAUSED"
      - name: cause
        type: enum
        source: system
        description: "Transition that opened this segment."
        constraints: "one of SUBMISSION, RFE_ISSUED, RFE_RESPONDED, DECISION"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant this segment opened."
      - name: ended_at
        type: datetime
        source: system
        description: "Logical-clock instant this segment closed; null for the single open segment."
        default: null
      - name: business_minutes
        type: integer
        source: computed
        description: "Business minutes inside this segment on the order consulate's calendar; null while the segment is open."
        default: null

# ===========================================================================
# 1.2 State Machine Table  (14 axes; 13 non-linear)
# ===========================================================================
state_machines:

  # ---- axis 1 of 4 on Order --------------------------------------------
  - entity: Order
    axis: workflow_status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, ABANDONED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /expediting/orders/{id}/quote"
        actor: CaseManager
        preconditions:
          - "at least one Applicant under the order has readiness_status in the set {PENDING, COMPLETE}"
        side_effects:
          - "run calculation government_fee_total; write Order.government_fee_quoted_cents"
          - "run calculation service_fee_total; write Order.service_fee_quoted_cents, Order.discount_pct_applied, Order.handling_fee_waived"
          - "Order.total_quoted_cents := government_fee_quoted_cents + service_fee_quoted_cents"
          - "Order.quoted_by_user_id := X-User-ID; Order.quoted_at := logical clock now"
          - "Order.furthest_stage_reached := QUOTED"
          - "run calculation projected_completion_date and feasibility_status; write both fields"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /expediting/orders/{id}/quote (re-quote)"
        actor: CaseManager
        preconditions:
          - "at least one Applicant under the order has readiness_status in the set {PENDING, COMPLETE}"
        side_effects:
          - "same side effects as DRAFT_to_QUOTED; every quoted money field is overwritten"
        note: "Self-loop; re-quoting before acceptance is unlimited and always overwrites."
      - from: QUOTED
        to: INTAKE
        trigger: "POST /expediting/orders/{id}/accept-quote"
        actor: CaseManager | Traveler
        preconditions:
          - "Order.payment_status == COLLECTED"
          - "Order.total_quoted_cents > 0"
        side_effects:
          - "Order.furthest_stage_reached := INTAKE"
          - "recompute every Applicant.readiness_status under the order"
      - from: INTAKE
        to: READY_FOR_SUBMISSION
        trigger: "system: last qualifying readiness mutation (document review, photo check, form prep or sign, appointment outcome, courier leg completion)"
        actor: system
        preconditions:
          - "every Applicant under the order with readiness_status in the set {PENDING, COMPLETE} is COMPLETE"
          - "Order.custody_holder == SERVICE"
        side_effects:
          - "Order.furthest_stage_reached := READY_FOR_SUBMISSION"
          - "run calculation projected_completion_date and feasibility_status; write both fields"
      - from: READY_FOR_SUBMISSION
        to: INTAKE
        trigger: "system: any applicant regresses to PENDING, or custody_holder leaves SERVICE"
        actor: system
        preconditions:
          - "at least one Applicant under the order has readiness_status == PENDING, or Order.custody_holder != SERVICE"
        side_effects:
          - "Order.furthest_stage_reached is NOT lowered"
          - "every CourierLeg of this order in leg_status CREATED is set to CANCELLED"
          - "Order.feasibility_status := UNKNOWN"
        note: "Hop 4 of the AgencyForm revision cascade lands here."
      - from: INTAKE
        to: INTAKE
        trigger: "POST /expediting/orders/{id}/split"
        actor: CaseManager
        preconditions:
          - "every Applicant named in the request has readiness_status == COMPLETE and order_id == this order"
          - "at least one Applicant remains on the parent after the move"
        side_effects:
          - "create the child Order in workflow_status INTAKE with furthest_stage_reached INTAKE and parent_order_id set"
          - "re-parent the named Applicants and their documents, photos, prepared forms and appointments"
          - "run calculation split_money_partition on both orders"
          - "re-derive payment_status on both orders and re-evaluate both readiness gates"
      - from: READY_FOR_SUBMISSION
        to: READY_FOR_SUBMISSION
        trigger: "POST /expediting/orders/{id}/split (every remaining applicant is still COMPLETE)"
        actor: CaseManager
        preconditions:
          - "every Applicant named in the request has readiness_status == COMPLETE and order_id == this order"
          - "every Applicant remaining on the parent has readiness_status == COMPLETE"
        side_effects:
          - "same side effects as INTAKE_to_INTAKE; the parent keeps READY_FOR_SUBMISSION"
      - from: READY_FOR_SUBMISSION
        to: SUBMITTED
        trigger: "POST /expediting/orders/{id}/submit"
        actor: CaseManager
        preconditions:
          - "Order.custody_holder == SERVICE"
          - "Order.feasibility_status in the set {FEASIBLE, ACKNOWLEDGED_INFEASIBLE}"
          - "Order.outstanding_cents >= Order.service_fee_quoted_cents + Order.government_fee_quoted_cents"
          - "X-User-ID != Order.quoted_by_user_id"
          - "when Order.service_level == RUSH, the logical clock hour is strictly before RUSH_CUTOFF_HOUR_UTC"
        side_effects:
          - "Order.submitted_at := logical clock now; Order.submitted_by_user_id := X-User-ID"
          - "run calculation effective_submission_date; write Order.effective_submission_date"
          - "append LedgerEntry (stream SERVICE, kind EARN, amount Order.service_fee_quoted_cents, reason SERVICE_RECOGNITION)"
          - "append SlaSegment (segment_kind RUNNING, cause SUBMISSION, started_at now, ended_at null)"
          - "Order.furthest_stage_reached := SUBMITTED"
      - from: SUBMITTED
        to: AT_AGENCY
        trigger: "POST /expediting/orders/{id}/tender"
        actor: AgencyLiaison
        preconditions:
          - "Order.custody_holder == AGENCY"
          - "Order.tendered_at is null"
        side_effects:
          - "Order.tendered_at := logical clock now"
          - "append LedgerEntry (stream GOVERNMENT, kind TENDER, amount Order.government_fee_quoted_cents, reason AGENCY_TENDER)"
          - "Order.furthest_stage_reached := AT_AGENCY"
      - from: AT_AGENCY
        to: RFE_PENDING
        trigger: "POST /expediting/orders/{id}/rfes"
        actor: AgencyLiaison
        preconditions:
          - "Order.rfe_round_count < RFE_ROUND_CAP"
        side_effects:
          - "create RFE (rfe_status OPEN, round_index := rfe_round_count + 1, deadline_at from calculation rfe_deadline)"
          - "close the open SlaSegment: ended_at := now, business_minutes computed"
          - "append SlaSegment (segment_kind PAUSED, cause RFE_ISSUED, started_at now, ended_at null)"
      - from: RFE_PENDING
        to: AT_AGENCY
        trigger: "POST /expediting/rfes/{id}/adjudicate with outcome CLEARED"
        actor: AgencyLiaison
        preconditions:
          - "the RFE has rfe_status == RESPONDED"
        side_effects:
          - "RFE.rfe_status := CLEARED"
          - "close the open PAUSED SlaSegment: ended_at := now, business_minutes computed"
          - "append SlaSegment (segment_kind RUNNING, cause RFE_RESPONDED, started_at now, ended_at null)"
      - from: RFE_PENDING
        to: ABANDONED
        trigger: "POST /expediting/rfes/{id}/adjudicate with outcome INSUFFICIENT or EXPIRED"
        actor: AgencyLiaison
        preconditions:
          - "outcome == EXPIRED requires the logical clock to be strictly after RFE.deadline_at"
          - "outcome == INSUFFICIENT requires RFE.response_count >= RFE_ROUND_CAP"
        side_effects:
          - "RFE.rfe_status := EXPIRED or INSUFFICIENT to match the outcome"
          - "close the open PAUSED SlaSegment: ended_at := now, business_minutes computed"
          - "Order.decided_at := logical clock now"
          - "run calculation refund_adjudication in variant post_tender; write Order.refund_scheduled_cents and set Order.payment_status := REFUND_PENDING"
          - "create CourierLeg for the AGENCY -> SERVICE return hop in leg_status CREATED, leg_index one above the highest existing leg, scheduled_date equal to the calendar date of the logical clock now"
      - from: AT_AGENCY
        to: APPROVED
        trigger: "POST /expediting/orders/{id}/agency-decision with decision APPROVED"
        actor: AgencyLiaison
        preconditions:
          - "no RFE of this order has rfe_status == OPEN or RESPONDED"
        side_effects:
          - "Order.decided_at := logical clock now"
          - "close the open SlaSegment: ended_at := now, business_minutes computed"
          - "append SlaSegment (segment_kind RUNNING, cause DECISION, started_at now, ended_at now, business_minutes 0)"
          - "create CourierLeg for the AGENCY -> SERVICE return hop in leg_status CREATED, leg_index one above the highest existing leg, scheduled_date equal to the calendar date of the logical clock now"
      - from: AT_AGENCY
        to: REJECTED
        trigger: "POST /expediting/orders/{id}/agency-decision with decision REJECTED"
        actor: AgencyLiaison
        preconditions:
          - "no RFE of this order has rfe_status == OPEN or RESPONDED"
        side_effects:
          - "Order.decided_at := logical clock now"
          - "close the open SlaSegment: ended_at := now, business_minutes computed"
          - "run calculation refund_adjudication in variant post_tender; write Order.refund_scheduled_cents and set Order.payment_status := REFUND_PENDING"
          - "create CourierLeg for the AGENCY -> SERVICE return hop in leg_status CREATED, leg_index one above the highest existing leg, scheduled_date equal to the calendar date of the logical clock now"
          - "HOP 1: every Applicant under this order with readiness_status in the set {PENDING, COMPLETE} is set to WITHDRAWN"
          - "HOP 2: because those applicants are WITHDRAWN, every Appointment of theirs with booking_status == BOOKED is set to CANCELLED"
          - "HOP 3: because those appointments were cancelled, each referenced AppointmentSlot.booked_count is decremented and its status is re-derived (FULL -> OPEN when booked_count < capacity)"
        note: "Depth-4 transitive cascade: Order -> Applicant -> Appointment -> AppointmentSlot. Each hop is caused by the preceding hop, not by the original request."
      - from: APPROVED
        to: DELIVERING
        trigger: "POST /expediting/orders/{id}/shipments"
        actor: CourierOps
        preconditions:
          - "Order.custody_holder == SERVICE"
        side_effects:
          - "create Shipment in delivery_status CREATED"
          - "run calculation delivery_escalation; when it fires, write Shipment.escalation_fee_cents and raise Order.service_fee_quoted_cents and Order.total_quoted_cents by DELIVERY_ESCALATION_FEE_CENTS"
      - from: REJECTED
        to: DELIVERING
        trigger: "POST /expediting/orders/{id}/shipments"
        actor: CourierOps
        preconditions:
          - "Order.custody_holder == SERVICE"
        side_effects:
          - "create Shipment in delivery_status CREATED"
          - "run calculation delivery_escalation; when it fires, write Shipment.escalation_fee_cents and raise Order.service_fee_quoted_cents and Order.total_quoted_cents by DELIVERY_ESCALATION_FEE_CENTS"
      - from: DELIVERING
        to: COMPLETED
        trigger: "system: the order's Shipment reaches delivery_status DELIVERED or PICKED_UP"
        actor: system
        preconditions:
          - "Order.custody_holder == APPLICANT"
        side_effects:
          - "Order.payment_status := REFUNDED when refunded_cents == collected_cents, else unchanged"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /expediting/orders/{id}/cancel"
        actor: CaseManager | Traveler
        preconditions:
          - "Order.custody_holder != AGENCY"
        side_effects:
          - "run calculation refund_adjudication in variant pre_tender; append REFUND LedgerEntry rows"
          - "every Applicant under the order is set to readiness_status WITHDRAWN"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /expediting/orders/{id}/cancel"
        actor: CaseManager | Traveler
        preconditions:
          - "Order.custody_holder != AGENCY"
        side_effects:
          - "run calculation refund_adjudication in variant pre_tender; append REFUND LedgerEntry rows"
          - "every Applicant under the order is set to readiness_status WITHDRAWN"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /expediting/orders/{id}/cancel"
        actor: CaseManager | Traveler
        preconditions:
          - "Order.custody_holder != AGENCY"
        side_effects:
          - "run calculation refund_adjudication in variant pre_tender; append REFUND LedgerEntry rows"
          - "every Applicant under the order is set to readiness_status WITHDRAWN"
          - "every CourierLeg of this order in leg_status CREATED or DISPATCHED is set to CANCELLED"
      - from: READY_FOR_SUBMISSION
        to: CANCELLED
        trigger: "POST /expediting/orders/{id}/cancel"
        actor: CaseManager | Traveler
        preconditions:
          - "Order.custody_holder != AGENCY"
        side_effects:
          - "run calculation refund_adjudication in variant pre_tender; append REFUND LedgerEntry rows"
          - "every Applicant under the order is set to readiness_status WITHDRAWN"
          - "every CourierLeg of this order in leg_status CREATED or DISPATCHED is set to CANCELLED"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /expediting/orders/{id}/cancel"
        actor: CaseManager
        preconditions:
          - "Order.custody_holder != AGENCY"
        side_effects:
          - "run calculation refund_adjudication in variant pre_tender; append REFUND LedgerEntry rows"
          - "close the open SlaSegment: ended_at := now, business_minutes computed"
      - from: AT_AGENCY
        to: CANCELLED
        trigger: "POST /expediting/orders/{id}/cancel (cancellation-with-restrictions; on the agency-custody gate exclusion list)"
        actor: CaseManager
        preconditions:
          - "the request carries acknowledge_government_fee_forfeit == true"
        side_effects:
          - "run calculation refund_adjudication in variant post_tender; write Order.refund_scheduled_cents and set Order.payment_status := REFUND_PENDING"
          - "close the open SlaSegment: ended_at := now, business_minutes computed"
          - "create CourierLeg for the AGENCY -> SERVICE return hop in leg_status CREATED, leg_index one above the highest existing leg, scheduled_date equal to the calendar date of the logical clock now"

  # ---- axis 2 of 4 on Order --------------------------------------------
  - entity: Order
    axis: payment_status
    shape: parallel
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PARTIALLY_COLLECTED
        trigger: "POST /expediting/orders/{id}/payments"
        actor: CaseManager | Traveler
        preconditions:
          - "Order.total_quoted_cents > 0"
          - "collected_cents after this payment is strictly less than Order.total_quoted_cents"
        side_effects:
          - "append LedgerEntry (stream SERVICE, kind COLLECTION, reason CUSTOMER_PAYMENT)"
          - "recompute Order.collected_cents and Order.outstanding_cents"
      - from: PARTIALLY_COLLECTED
        to: PARTIALLY_COLLECTED
        trigger: "POST /expediting/orders/{id}/payments (further part payment)"
        actor: CaseManager | Traveler
        preconditions:
          - "collected_cents after this payment is strictly less than Order.total_quoted_cents"
        side_effects:
          - "append LedgerEntry (stream SERVICE, kind COLLECTION, reason CUSTOMER_PAYMENT)"
          - "recompute Order.collected_cents and Order.outstanding_cents"
      - from: PARTIALLY_COLLECTED
        to: COLLECTED
        trigger: "POST /expediting/orders/{id}/payments (final part payment)"
        actor: CaseManager | Traveler
        preconditions:
          - "collected_cents after this payment is >= Order.total_quoted_cents"
        side_effects:
          - "append LedgerEntry (stream SERVICE, kind COLLECTION, reason CUSTOMER_PAYMENT)"
          - "recompute Order.collected_cents and Order.outstanding_cents"
      - from: UNPAID
        to: COLLECTED
        trigger: "POST /expediting/orders/{id}/payments (single full payment)"
        actor: CaseManager | Traveler
        preconditions:
          - "Order.total_quoted_cents > 0"
          - "collected_cents after this payment is >= Order.total_quoted_cents"
        side_effects:
          - "append LedgerEntry (stream SERVICE, kind COLLECTION, reason CUSTOMER_PAYMENT)"
          - "recompute Order.collected_cents and Order.outstanding_cents"
      - from: COLLECTED
        to: PARTIALLY_COLLECTED
        trigger: "system: POST /expediting/orders/{id}/service-level raises total_quoted_cents above collected_cents"
        actor: system
        preconditions:
          - "Order.collected_cents is strictly less than the new Order.total_quoted_cents"
        side_effects:
          - "no LedgerEntry is written; only the derived payment_status changes"
        note: "The money axis can regress while workflow_status is untouched — an in-flight tier upgrade re-opens a balance."
      - from: COLLECTED
        to: REFUND_PENDING
        trigger: "system: refund_adjudication runs in variant post_tender (agency REJECTED decision, cancellation-with-restrictions, or RFE abandonment)"
        actor: system
        preconditions:
          - "the computed refund amount is strictly greater than 0"
          - "Order.custody_holder == AGENCY at the moment of adjudication"
        side_effects:
          - "Order.refund_scheduled_cents := computed refund amount; no LedgerEntry is written yet"
      - from: REFUND_PENDING
        to: PARTIALLY_REFUNDED
        trigger: "system: the AGENCY -> SERVICE return CourierLeg reaches leg_status DELIVERED"
        actor: system
        preconditions:
          - "Order.refund_scheduled_cents > 0"
        side_effects:
          - "append LedgerEntry (stream SERVICE, kind REFUND, amount Order.refund_scheduled_cents, reason REJECTION_REFUND)"
          - "Order.refund_scheduled_cents := 0; recompute Order.refunded_cents and Order.outstanding_cents"
        note: "A post-tender refund is ALWAYS strictly smaller than collected_cents (the tendered government fee is never returned and REFUND_PCT_AT_AGENCY is 0.15), so this axis can never reach REFUNDED from REFUND_PENDING; the fully-refunded terminal is only reachable through the pre-tender path."
      - from: COLLECTED
        to: PARTIALLY_REFUNDED
        trigger: "system: refund_adjudication runs in variant pre_tender (cancellation before the government fee was tendered) and the refund is smaller than collected_cents"
        actor: system
        preconditions:
          - "Order.custody_holder != AGENCY"
          - "0 < computed refund amount < Order.collected_cents"
        side_effects:
          - "append LedgerEntry rows (kind REFUND, reason CANCELLATION_REFUND) split per stream"
          - "recompute Order.refunded_cents and Order.outstanding_cents"
      - from: COLLECTED
        to: REFUNDED
        trigger: "system: refund_adjudication runs in variant pre_tender and the refund equals collected_cents"
        actor: system
        preconditions:
          - "Order.custody_holder != AGENCY"
          - "computed refund amount == Order.collected_cents"
        side_effects:
          - "append LedgerEntry rows (kind REFUND, reason CANCELLATION_REFUND) split per stream"
          - "recompute Order.refunded_cents and Order.outstanding_cents"
      - from: PARTIALLY_COLLECTED
        to: PARTIALLY_COLLECTED
        trigger: "system: split money partition on POST /expediting/orders/{id}/split"
        actor: system
        preconditions:
          - "the order is the split parent and retains at least one Applicant"
        side_effects:
          - "append LedgerEntry (kind TRANSFER_OUT, reason SPLIT_PARTITION) on the parent and a matching TRANSFER_IN on the child"
          - "recompute collected_cents and outstanding_cents on both orders"
        note: "The parallel money axis can advance while workflow_status is unchanged; the two axes never gate each other except at QUOTED_to_INTAKE."

  # ---- axis 3 of 4 on Order --------------------------------------------
  - entity: Order
    axis: custody_holder
    shape: cyclic
    initial_state: APPLICANT
    terminal_states: []
    transitions:
      - from: APPLICANT
        to: COURIER
        trigger: "POST /expediting/courier-legs/{id}/dispatch on the leg whose from_holder == APPLICANT"
        actor: CourierOps
        preconditions:
          - "Order.custody_holder == leg.from_holder"
          - "leg.leg_index is the lowest leg_index among this order's legs in leg_status CREATED"
          - "leg.scheduled_date is not in the order consulate's closure_dates and is a business day"
        side_effects:
          - "close the open CustodyEvent (released_at := now)"
          - "append CustodyEvent (holder_type COURIER, leg_index := leg.leg_index, reason LEG_DISPATCHED)"
          - "CourierLeg.attempt_count += 1"
      - from: COURIER
        to: SERVICE
        trigger: "POST /expediting/courier-legs/{id}/complete with outcome DELIVERED where leg.to_holder == SERVICE"
        actor: CourierOps
        preconditions:
          - "leg.leg_status == DISPATCHED"
        side_effects:
          - "close the open CustodyEvent (released_at := now)"
          - "append CustodyEvent (holder_type SERVICE, leg_index null, reason LEG_DELIVERED)"
          - "recompute every Applicant.readiness_status and the order's workflow_status gate"
      - from: SERVICE
        to: COURIER
        trigger: "POST /expediting/courier-legs/{id}/dispatch on the leg whose from_holder == SERVICE"
        actor: CourierOps
        preconditions:
          - "Order.custody_holder == SERVICE"
          - "Order.workflow_status == SUBMITTED"
          - "leg.scheduled_date is not in the order consulate's closure_dates and is a business day"
        side_effects:
          - "close the open CustodyEvent (released_at := now)"
          - "append CustodyEvent (holder_type COURIER, leg_index := leg.leg_index, reason LEG_DISPATCHED)"
          - "CourierLeg.attempt_count += 1"
      - from: COURIER
        to: AGENCY
        trigger: "POST /expediting/courier-legs/{id}/complete with outcome DELIVERED where leg.to_holder == AGENCY"
        actor: CourierOps
        preconditions:
          - "leg.leg_status == DISPATCHED"
        side_effects:
          - "close the open CustodyEvent (released_at := now)"
          - "append CustodyEvent (holder_type AGENCY, leg_index null, reason LEG_DELIVERED)"
          - "the agency-custody write gate becomes active for this order"
      - from: AGENCY
        to: COURIER
        trigger: "POST /expediting/courier-legs/{id}/dispatch on the return leg whose from_holder == AGENCY"
        actor: CourierOps
        preconditions:
          - "Order.workflow_status is in the set {APPROVED, REJECTED, CANCELLED, ABANDONED}"
        side_effects:
          - "close the open CustodyEvent (released_at := now)"
          - "append CustodyEvent (holder_type COURIER, leg_index := leg.leg_index, reason DECISION_RETURNED)"
          - "the agency-custody write gate becomes inactive for this order"
      - from: COURIER
        to: APPLICANT
        trigger: "system: the order's Shipment reaches delivery_status DELIVERED or PICKED_UP"
        actor: system
        preconditions:
          - "Order.custody_holder == COURIER and the open CustodyEvent has leg_index null"
        side_effects:
          - "close the open CustodyEvent (released_at := now)"
          - "append CustodyEvent (holder_type APPLICANT, leg_index null, reason SHIPMENT_DELIVERED or SHIPMENT_PICKED_UP)"
      - from: SERVICE
        to: COURIER
        trigger: "POST /expediting/orders/{id}/shipments then POST /expediting/shipments/{id}/delivery-attempt"
        actor: CourierOps
        preconditions:
          - "Order.workflow_status == DELIVERING"
        side_effects:
          - "close the open CustodyEvent (released_at := now)"
          - "append CustodyEvent (holder_type COURIER, leg_index null, reason LEG_DISPATCHED)"
        note: "Return-delivery hop; the shipment carrier is a COURIER holder with no leg_index."

  # ---- axis 4 of 4 on Order --------------------------------------------
  - entity: Order
    axis: feasibility_status
    shape: cyclic
    initial_state: UNKNOWN
    terminal_states: []
    transitions:
      - from: UNKNOWN
        to: FEASIBLE
        trigger: "system: calculation projected_completion_date runs on quote, readiness completion, tier change, or travel-date change"
        actor: system
        preconditions:
          - "projected_completion_date <= travel_date minus TRAVEL_DATE_BUFFER_DAYS calendar days"
        side_effects:
          - "Order.acknowledged_by_user_id := null"
      - from: UNKNOWN
        to: INFEASIBLE
        trigger: "system: calculation projected_completion_date runs on quote, readiness completion, tier change, or travel-date change"
        actor: system
        preconditions:
          - "projected_completion_date > travel_date minus TRAVEL_DATE_BUFFER_DAYS calendar days"
        side_effects:
          - "Order.acknowledged_by_user_id := null"
      - from: FEASIBLE
        to: INFEASIBLE
        trigger: "system: recomputation after PATCH /expediting/orders/{id}/travel-dates or a tier downgrade of the effective turnaround"
        actor: system
        preconditions:
          - "projected_completion_date > travel_date minus TRAVEL_DATE_BUFFER_DAYS calendar days"
        side_effects: []
      - from: INFEASIBLE
        to: FEASIBLE
        trigger: "system: recomputation after POST /expediting/orders/{id}/service-level upgrade or a later travel_date"
        actor: system
        preconditions:
          - "projected_completion_date <= travel_date minus TRAVEL_DATE_BUFFER_DAYS calendar days"
        side_effects:
          - "Order.acknowledged_by_user_id := null"
      - from: INFEASIBLE
        to: ACKNOWLEDGED_INFEASIBLE
        trigger: "POST /expediting/orders/{id}/feasibility-acknowledgment"
        actor: ComplianceOfficer
        preconditions:
          - "Order.feasibility_status == INFEASIBLE"
          - "Order.workflow_status is in the set {INTAKE, READY_FOR_SUBMISSION}"
        side_effects:
          - "Order.acknowledged_by_user_id := X-User-ID"
      - from: ACKNOWLEDGED_INFEASIBLE
        to: INFEASIBLE
        trigger: "system: recomputation after PATCH /expediting/orders/{id}/travel-dates changes travel_date or return_date"
        actor: system
        preconditions:
          - "projected_completion_date > travel_date minus TRAVEL_DATE_BUFFER_DAYS calendar days"
        side_effects:
          - "Order.acknowledged_by_user_id := null"
        note: "An acknowledgment is pinned to the projection it was granted against; changing the dates revokes it."
      - from: ACKNOWLEDGED_INFEASIBLE
        to: FEASIBLE
        trigger: "system: recomputation after POST /expediting/orders/{id}/service-level upgrade"
        actor: system
        preconditions:
          - "projected_completion_date <= travel_date minus TRAVEL_DATE_BUFFER_DAYS calendar days"
        side_effects:
          - "Order.acknowledged_by_user_id := null"

  # ---- axis 5: Applicant readiness (compound over children) ---------------
  - entity: Applicant
    axis: readiness_status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING
        to: COMPLETE
        trigger: "system: recomputation after any document review, photo compliance check, form preparation or signature, or appointment outcome"
        actor: system
        preconditions:
          - "every ApplicantDocument of this applicant with is_required == true has review_status == ACCEPTED"
          - "exactly one PhotoAsset of this applicant has compliance_status == PASSED"
          - "exactly one PreparedForm of this applicant has prep_status in the set {PREPARED, SIGNED} and revision_used equal to the revision of the ACTIVE AgencyForm carrying the product's form_code"
          - "when the order's ServiceCatalogItem.requires_appointment == true, an Appointment of this applicant has booking_status == ATTENDED"
        side_effects:
          - "recompute Applicant.accepted_doc_count"
          - "bubble up: re-evaluate the owning Order's INTAKE_to_READY_FOR_SUBMISSION gate"
      - from: COMPLETE
        to: PENDING
        trigger: "system: any of the four readiness conditions stops holding (form goes STALE, an ACCEPTED document is invalidated, the photo EXPIRES, the appointment records NO_SHOW)"
        actor: system
        preconditions:
          - "at least one readiness condition of PENDING_to_COMPLETE no longer holds"
        side_effects:
          - "bubble up: re-evaluate the owning Order's READY_FOR_SUBMISSION_to_INTAKE regression"
        note: "Hop 3 of the AgencyForm revision cascade lands here."
      - from: PENDING
        to: WITHDRAWN
        trigger: "system: the owning Order is CANCELLED or REJECTED"
        actor: system
        preconditions:
          - "the owning Order.workflow_status is in the set {CANCELLED, REJECTED}"
        side_effects:
          - "every Appointment of this applicant with booking_status == BOOKED is set to CANCELLED"
      - from: COMPLETE
        to: WITHDRAWN
        trigger: "system: the owning Order is CANCELLED or REJECTED"
        actor: system
        preconditions:
          - "the owning Order.workflow_status is in the set {CANCELLED, REJECTED}"
        side_effects:
          - "every Appointment of this applicant with booking_status == BOOKED is set to CANCELLED"
        note: "Hop 1 of the depth-4 rejection cascade."

  # ---- axis 6: per-document review ----------------------------------------
  - entity: ApplicantDocument
    axis: review_status
    shape: cyclic
    initial_state: MISSING
    terminal_states: []
    transitions:
      - from: MISSING
        to: RECEIVED
        trigger: "POST /expediting/applicants/{id}/documents"
        actor: CaseManager | Traveler
        preconditions:
          - "a slot for the submitted doc_type exists on this applicant"
          - "Order.custody_holder != AGENCY"
        side_effects:
          - "write issue_date and expiry_date from the request"
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /expediting/documents/{id}/review with decision ACCEPT"
        actor: CaseManager
        preconditions:
          - "calculation document_validity_check returns VALID for this slot against the owning Order.travel_date and Order.return_date"
        side_effects:
          - "ApplicantDocument.reviewed_by_user_id := X-User-ID; rejection_reason := null"
          - "recompute Applicant.accepted_doc_count and Applicant.readiness_status"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /expediting/documents/{id}/review with decision REJECT"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "ApplicantDocument.rejection_reason := the request reason; reviewed_by_user_id := X-User-ID"
          - "recompute Applicant.readiness_status"
      - from: REJECTED
        to: RECEIVED
        trigger: "POST /expediting/documents/{id}/resubmit"
        actor: CaseManager | Traveler
        preconditions:
          - "ApplicantDocument.resubmission_count < DOCUMENT_RESUBMISSION_CAP"
          - "Order.custody_holder != AGENCY"
        side_effects:
          - "ApplicantDocument.resubmission_count += 1; rejection_reason := null"
          - "overwrite issue_date and expiry_date from the request"
      - from: ACCEPTED
        to: RECEIVED
        trigger: "system: PATCH /expediting/orders/{id}/travel-dates changes travel_date or return_date"
        actor: system
        preconditions:
          - "ApplicantDocument.validity_rule != NONE"
        side_effects:
          - "resubmission_count is NOT incremented; the slot must be re-reviewed against the new dates"
          - "recompute Applicant.accepted_doc_count and Applicant.readiness_status"
        note: "Invalidation cycle: acceptance is pinned to the dates it was judged against."

  # ---- axis 7: photo compliance -------------------------------------------
  - entity: PhotoAsset
    axis: compliance_status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /expediting/photos/{id}/compliance-check"
        actor: CaseManager
        preconditions:
          - "calculation photo_compliance returns an empty failure list"
          - "taken_on advanced by PHOTO_VALIDITY_DAYS calendar days is >= the owning Order.travel_date"
        side_effects:
          - "PhotoAsset.failure_reasons := []"
          - "recompute Applicant.readiness_status"
      - from: PENDING
        to: FAILED
        trigger: "POST /expediting/photos/{id}/compliance-check"
        actor: CaseManager
        preconditions:
          - "calculation photo_compliance returns a non-empty failure list"
        side_effects:
          - "PhotoAsset.failure_reasons := the named failing criteria"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /expediting/photos/{id}/compliance-check"
        actor: CaseManager
        preconditions:
          - "calculation photo_compliance returns an empty failure list"
          - "taken_on advanced by PHOTO_VALIDITY_DAYS calendar days is strictly before the owning Order.travel_date"
        side_effects:
          - "PhotoAsset.failure_reasons := []"
        note: "An otherwise-compliant photo that will be stale on the travel date is EXPIRED, not FAILED — the two outcomes carry different retake accounting."
      - from: PASSED
        to: EXPIRED
        trigger: "system: PATCH /expediting/orders/{id}/travel-dates pushes travel_date beyond taken_on plus PHOTO_VALIDITY_DAYS"
        actor: system
        preconditions:
          - "taken_on advanced by PHOTO_VALIDITY_DAYS calendar days is strictly before the new Order.travel_date"
        side_effects:
          - "recompute Applicant.readiness_status"
      - from: FAILED
        to: SUPERSEDED
        trigger: "POST /expediting/photos/{id}/retake"
        actor: CaseManager | Traveler
        preconditions:
          - "PhotoAsset.retake_count < PHOTO_RETAKE_CAP"
          - "Order.custody_holder != AGENCY"
        side_effects:
          - "create a new PhotoAsset in compliance_status PENDING with retake_count := this photo's retake_count + 1"
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "POST /expediting/photos/{id}/retake"
        actor: CaseManager | Traveler
        preconditions:
          - "PhotoAsset.retake_count < PHOTO_RETAKE_CAP"
          - "Order.custody_holder != AGENCY"
        side_effects:
          - "create a new PhotoAsset in compliance_status PENDING with retake_count := this photo's retake_count + 1"
          - "recompute Applicant.readiness_status"

  # ---- axis 8: form preparation -------------------------------------------
  - entity: PreparedForm
    axis: prep_status
    shape: cyclic
    initial_state: PREPARED
    terminal_states: [VOID]
    transitions:
      - from: PREPARED
        to: SIGNED
        trigger: "POST /expediting/prepared-forms/{id}/sign"
        actor: CaseManager | Traveler
        preconditions:
          - "the referenced AgencyForm.status == ACTIVE"
          - "Order.custody_holder != AGENCY"
        side_effects:
          - "PreparedForm.signed_at := logical clock now; signed_by_user_id := X-User-ID"
      - from: PREPARED
        to: STALE
        trigger: "system: POST /expediting/agency-forms/{id}/publish supersedes the revision this preparation was filled against"
        actor: system
        preconditions:
          - "the referenced AgencyForm.status transitioned to SUPERSEDED"
        side_effects:
          - "recompute Applicant.readiness_status"
        note: "Hop 2 of the AgencyForm revision cascade."
      - from: SIGNED
        to: STALE
        trigger: "system: POST /expediting/agency-forms/{id}/publish supersedes the revision this preparation was filled against"
        actor: system
        preconditions:
          - "the referenced AgencyForm.status transitioned to SUPERSEDED"
        side_effects:
          - "PreparedForm.signed_at := null; signed_by_user_id := null (the signature is voided with the revision)"
          - "recompute Applicant.readiness_status"
      - from: STALE
        to: VOID
        trigger: "POST /expediting/applicants/{id}/prepared-forms (a newer preparation supersedes this one)"
        actor: CaseManager
        preconditions:
          - "the new preparation carries the same form_code"
        side_effects:
          - "the new PreparedForm is created in prep_status PREPARED against the ACTIVE revision"
      - from: PREPARED
        to: VOID
        trigger: "POST /expediting/applicants/{id}/prepared-forms (a newer preparation supersedes this one)"
        actor: CaseManager
        preconditions:
          - "the new preparation carries the same form_code"
        side_effects:
          - "the new PreparedForm is created in prep_status PREPARED against the ACTIVE revision"
        note: "CREATE-with-supersede — the OCC-guarded write in concurrency_rules[prepared-form-create-stale-applicant]."

  # ---- axis 9: agency form publication (the only linear axis) -------------
  - entity: AgencyForm
    axis: status
    shape: linear
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /expediting/agency-forms/{id}/publish"
        actor: PlatformAdmin
        preconditions:
          - "no other AgencyForm with the same form_code and a strictly higher revision has status == ACTIVE"
        side_effects:
          - "AgencyForm.published_at := logical clock now"
          - "HOP 1: the prior AgencyForm with the same form_code and status == ACTIVE is set to SUPERSEDED"
          - "HOP 2: because that revision is SUPERSEDED, every PreparedForm whose agency_form_id points at it and whose prep_status is in the set {PREPARED, SIGNED} is set to STALE"
          - "HOP 3: because those preparations are STALE, every owning Applicant with readiness_status == COMPLETE is set to PENDING"
          - "HOP 4: because those applicants regressed, every owning Order with workflow_status == READY_FOR_SUBMISSION is set to INTAKE and feasibility_status := UNKNOWN"
          - "HOP 5: because those orders regressed, every CourierLeg of those orders in leg_status CREATED is set to CANCELLED"
        note: "Depth-5 transitive cascade: AgencyForm -> PreparedForm -> Applicant -> Order -> CourierLeg."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a higher revision of the same form_code is published"
        actor: system
        preconditions:
          - "a sibling AgencyForm with the same form_code and a strictly higher revision transitioned DRAFT -> ACTIVE"
        side_effects:
          - "every PreparedForm on this revision in prep_status PREPARED or SIGNED is set to STALE"

  # ---- axis 10: appointment booking ---------------------------------------
  - entity: Appointment
    axis: booking_status
    shape: cyclic
    initial_state: BOOKED
    terminal_states: [ATTENDED, CANCELLED]
    transitions:
      - from: BOOKED
        to: BOOKED
        trigger: "POST /expediting/appointments/{id}/reschedule"
        actor: CaseManager
        preconditions:
          - "Appointment.reschedule_count < APPOINTMENT_RESCHEDULE_CAP"
          - "the target AppointmentSlot belongs to the order's consulate and its status == OPEN"
          - "the target slot starts_at is at least APPOINTMENT_LEAD_TIME_HOURS after the logical clock"
        side_effects:
          - "decrement booked_count on the released AppointmentSlot and re-derive its status"
          - "increment booked_count on the target AppointmentSlot and re-derive its status"
          - "Appointment.reschedule_count += 1; slot_id := target slot; booked_at := logical clock now"
      - from: BOOKED
        to: ATTENDED
        trigger: "POST /expediting/appointments/{id}/outcome with outcome ATTENDED"
        actor: AgencyLiaison
        preconditions:
          - "the logical clock is at or after the slot's starts_at"
        side_effects:
          - "recompute Applicant.readiness_status"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /expediting/appointments/{id}/outcome with outcome NO_SHOW"
        actor: AgencyLiaison
        preconditions:
          - "the logical clock is at or after the slot's starts_at"
        side_effects:
          - "Appointment.no_show_count += 1"
          - "decrement booked_count on the AppointmentSlot and re-derive its status"
          - "recompute Applicant.readiness_status"
      - from: NO_SHOW
        to: BOOKED
        trigger: "POST /expediting/appointments/{id}/reschedule (rebook after a no-show)"
        actor: CaseManager
        preconditions:
          - "Appointment.no_show_count < NO_SHOW_REBOOK_CAP"
          - "the target AppointmentSlot belongs to the order's consulate and its status == OPEN"
          - "the target slot starts_at is at least APPOINTMENT_LEAD_TIME_HOURS after the logical clock"
        side_effects:
          - "increment booked_count on the target AppointmentSlot and re-derive its status"
          - "slot_id := target slot; booked_at := logical clock now; reschedule_count is NOT incremented"
        note: "A no-show rebook consumes a no_show attempt, not a reschedule attempt — the two caps are independent."
      - from: BOOKED
        to: CANCELLED
        trigger: "system: the applicant is set to readiness_status WITHDRAWN"
        actor: system
        preconditions:
          - "Applicant.readiness_status == WITHDRAWN"
        side_effects:
          - "decrement booked_count on the AppointmentSlot and re-derive its status"
        note: "Hop 2 of the depth-4 rejection cascade."

  # ---- axis 11: slot capacity ---------------------------------------------
  - entity: AppointmentSlot
    axis: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system: booked_count reaches capacity after POST /expediting/appointments or a reschedule into this slot"
        actor: system
        preconditions:
          - "booked_count == capacity"
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system: booked_count drops below capacity after an appointment is CANCELLED, NO_SHOW, or rescheduled away"
        actor: system
        preconditions:
          - "booked_count < capacity"
        side_effects: []
        note: "Hop 3 of the depth-4 rejection cascade."
      - from: OPEN
        to: CLOSED
        trigger: "POST /expediting/consulates/{id}/closures adding a date equal to this slot's calendar date"
        actor: PlatformAdmin
        preconditions:
          - "the added closure date equals the calendar date of starts_at"
        side_effects:
          - "no further bookings or reschedules may target this slot"
      - from: FULL
        to: CLOSED
        trigger: "POST /expediting/consulates/{id}/closures adding a date equal to this slot's calendar date"
        actor: PlatformAdmin
        preconditions:
          - "the added closure date equals the calendar date of starts_at"
        side_effects:
          - "existing Appointments on this slot keep booking_status BOOKED and must be rescheduled"

  # ---- axis 12: courier leg ------------------------------------------------
  - entity: CourierLeg
    axis: leg_status
    shape: cyclic
    initial_state: CREATED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: CREATED
        to: DISPATCHED
        trigger: "POST /expediting/courier-legs/{id}/dispatch"
        actor: CourierOps
        preconditions:
          - "Order.custody_holder == CourierLeg.from_holder"
          - "leg_index is the lowest leg_index among this order's legs whose leg_status is CREATED or FAILED"
          - "scheduled_date is a business day and is not in the order consulate's closure_dates"
        side_effects:
          - "attempt_count += 1"
          - "custody handover: close the open CustodyEvent and append one with holder_type COURIER and leg_index := leg_index; reason is DECISION_RETURNED when from_holder == AGENCY and LEG_DISPATCHED otherwise"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /expediting/courier-legs/{id}/complete with outcome DELIVERED"
        actor: CourierOps
        preconditions: []
        side_effects:
          - "custody handover: close the open CustodyEvent and append one with holder_type := to_holder, reason LEG_DELIVERED"
          - "when to_holder == SERVICE and Order.payment_status == REFUND_PENDING, disburse the scheduled refund"
          - "recompute the owning Order's readiness gate"
      - from: DISPATCHED
        to: FAILED
        trigger: "POST /expediting/courier-legs/{id}/complete with outcome FAILED"
        actor: CourierOps
        preconditions: []
        side_effects:
          - "custody reverts: close the open CustodyEvent and append one with holder_type := from_holder, reason LEG_FAILED_RETURN"
      - from: FAILED
        to: DISPATCHED
        trigger: "POST /expediting/courier-legs/{id}/dispatch (re-dispatch)"
        actor: CourierOps
        preconditions:
          - "attempt_count < 1 + COURIER_REDISPATCH_CAP"
          - "Order.custody_holder == CourierLeg.from_holder"
          - "scheduled_date is a business day and is not in the order consulate's closure_dates"
        side_effects:
          - "attempt_count += 1"
          - "custody handover: close the open CustodyEvent and append one with holder_type COURIER and leg_index := leg_index"
      - from: CREATED
        to: CANCELLED
        trigger: "system: the owning Order regresses READY_FOR_SUBMISSION -> INTAKE, or is CANCELLED"
        actor: system
        preconditions:
          - "leg_status == CREATED"
        side_effects: []
        note: "Hop 5 of the AgencyForm revision cascade."
      - from: FAILED
        to: CANCELLED
        trigger: "system: the owning Order is CANCELLED"
        actor: system
        preconditions:
          - "Order.workflow_status == CANCELLED"
        side_effects: []

  # ---- axis 13: RFE loop ---------------------------------------------------
  - entity: RFE
    axis: rfe_status
    shape: cyclic
    initial_state: OPEN
    terminal_states: [CLEARED, INSUFFICIENT, EXPIRED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /expediting/rfes/{id}/respond"
        actor: CaseManager | Traveler
        preconditions:
          - "the logical clock is at or before RFE.deadline_at"
        side_effects:
          - "RFE.responded_at := logical clock now; response_count += 1"
      - from: RESPONDED
        to: CLEARED
        trigger: "POST /expediting/rfes/{id}/adjudicate with outcome CLEARED"
        actor: AgencyLiaison
        preconditions: []
        side_effects:
          - "the owning Order returns RFE_PENDING -> AT_AGENCY and the SLA clock resumes"
      - from: RESPONDED
        to: OPEN
        trigger: "POST /expediting/rfes/{id}/adjudicate with outcome INSUFFICIENT"
        actor: AgencyLiaison
        preconditions:
          - "RFE.response_count < RFE_ROUND_CAP"
        side_effects:
          - "RFE.issued_at := logical clock now; deadline_at recomputed by calculation rfe_deadline"
          - "the owning Order stays in RFE_PENDING and the SLA clock stays PAUSED"
        note: "Capped retry loop inside a single RFE row."
      - from: RESPONDED
        to: INSUFFICIENT
        trigger: "POST /expediting/rfes/{id}/adjudicate with outcome INSUFFICIENT"
        actor: AgencyLiaison
        preconditions:
          - "RFE.response_count >= RFE_ROUND_CAP"
        side_effects:
          - "the owning Order is set to ABANDONED"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /expediting/rfes/{id}/adjudicate with outcome EXPIRED"
        actor: AgencyLiaison
        preconditions:
          - "the logical clock is strictly after RFE.deadline_at"
        side_effects:
          - "the owning Order is set to ABANDONED"

  # ---- axis 14: return delivery -------------------------------------------
  - entity: Shipment
    axis: delivery_status
    shape: cyclic
    initial_state: CREATED
    terminal_states: [DELIVERED, PICKED_UP]
    transitions:
      - from: CREATED
        to: OUT_FOR_DELIVERY
        trigger: "POST /expediting/shipments/{id}/delivery-attempt with outcome FAILED"
        actor: CourierOps
        preconditions:
          - "Order.custody_holder == SERVICE"
        side_effects:
          - "attempt_count := 1"
          - "custody handover: close the open CustodyEvent and append one with holder_type COURIER, leg_index null, reason LEG_DISPATCHED"
      - from: CREATED
        to: DELIVERED
        trigger: "POST /expediting/shipments/{id}/delivery-attempt with outcome DELIVERED"
        actor: CourierOps
        preconditions:
          - "Order.custody_holder == SERVICE"
          - "Shipment.signature_required == false, or the request carries signature_captured == true"
        side_effects:
          - "attempt_count := 1"
          - "custody handover: close the open CustodyEvent and append one with holder_type APPLICANT, leg_index null, reason SHIPMENT_DELIVERED"
          - "the owning Order transitions DELIVERING -> COMPLETED"
      - from: OUT_FOR_DELIVERY
        to: OUT_FOR_DELIVERY
        trigger: "POST /expediting/shipments/{id}/delivery-attempt with outcome FAILED"
        actor: CourierOps
        preconditions:
          - "attempt_count after the increment is strictly less than DELIVERY_ATTEMPT_CAP"
        side_effects:
          - "attempt_count += 1"
      - from: OUT_FOR_DELIVERY
        to: HELD_FOR_PICKUP
        trigger: "POST /expediting/shipments/{id}/delivery-attempt with outcome FAILED on the capped attempt"
        actor: CourierOps
        preconditions:
          - "attempt_count after the increment equals DELIVERY_ATTEMPT_CAP"
        side_effects:
          - "attempt_count += 1"
          - "no further delivery attempts are accepted on this shipment"
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /expediting/shipments/{id}/delivery-attempt with outcome DELIVERED"
        actor: CourierOps
        preconditions:
          - "Shipment.signature_required == false, or the request carries signature_captured == true"
        side_effects:
          - "attempt_count += 1"
          - "custody handover: close the open CustodyEvent and append one with holder_type APPLICANT, reason SHIPMENT_DELIVERED"
          - "the owning Order transitions DELIVERING -> COMPLETED"
      - from: HELD_FOR_PICKUP
        to: PICKED_UP
        trigger: "POST /expediting/shipments/{id}/pickup"
        actor: CourierOps
        preconditions:
          - "Shipment.delivery_status == HELD_FOR_PICKUP"
        side_effects:
          - "custody handover: close the open CustodyEvent and append one with holder_type APPLICANT, reason SHIPMENT_PICKED_UP"
          - "the owning Order transitions DELIVERING -> COMPLETED"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: prepared-form-create-stale-applicant
    parent_entity: Applicant
    write_endpoint: "POST /expediting/applicants/{id}/prepared-forms"
    occ_field: "expected_applicant_version"
    description: |
      Preparing a form for an applicant whose version has advanced since the
      client last observed it is rejected. A new preparation legitimately
      supersedes the applicant's prior preparation for the same form_code
      (setting it to VOID), so a writer holding a stale view of the applicant
      would silently discard a preparation it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appointment-book-stale-slot
    parent_entity: AppointmentSlot
    write_endpoint: "POST /expediting/appointments"
    occ_field: "expected_slot_version"
    description: |
      Booking an appointment against an AppointmentSlot whose version has
      advanced since the client last read it is rejected. Capacity, status and
      booked_count all move with the slot's version, so a booking placed from a
      stale view could consume the last seat the client believed was free.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: service-level-change-stale-order
    parent_entity: Order
    write_endpoint: "POST /expediting/orders/{id}/service-level"
    occ_field: "expected_order_version"
    description: |
      Changing the service level of an order whose version has advanced since
      the client last read it is rejected. A tier change legitimately supersedes
      the prior tier and prices as a delta against the currently quoted amounts,
      so pricing a delta from a stale view of the order would charge the wrong
      difference.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table  (21 calculations; 7 dual-variant)
# ===========================================================================
calculations:

  - name: business_day_arithmetic
    trigger: "helper invoked by every date-advancing calculation in this table"
    algorithm: projection
    formula: |
      is_business_day(D, consulate):
        return weekday(D) in BUSINESS_WEEK_DAYS
               and (consulate is null or D not in consulate.closure_dates)

      advance_business_days(D, n, consulate):
        cur = D
        while not is_business_day(cur, consulate):
          cur = cur + 1 calendar day
        repeat n times:
          cur = cur + 1 calendar day
          while not is_business_day(cur, consulate):
            cur = cur + 1 calendar day
        return cur

      business_minutes_between(T1, T2, consulate):
        total = 0
        for each calendar date D from date(T1) to date(T2) inclusive:
          if not is_business_day(D, consulate): continue
          window_start = D at BUSINESS_DAY_START_HOUR_UTC:00:00Z
          window_end   = D at BUSINESS_DAY_END_HOUR_UTC:00:00Z
          lo = max(T1, window_start); hi = min(T2, window_end)
          if hi > lo: total = total + whole minutes between lo and hi
        return total
    input_set: "The consulate is Order.consulate_id when set, else null (weekday test only)."
    constants:
      BUSINESS_WEEK_DAYS: "MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY"
      BUSINESS_DAY_START_HOUR_UTC: 9
      BUSINESS_DAY_END_HOUR_UTC: 17
    precision: "whole calendar days; whole minutes, truncated toward zero"

  - name: applicant_age_years
    trigger: "POST /expediting/orders/{id}/applicants"
    algorithm: threshold
    formula: |
      age_years = whole years from Applicant.date_of_birth to Order.travel_date,
                  floored (the birthday must have occurred on or before travel_date
                  for that year to count)
    input_set: "Evaluated ONCE at applicant creation against the owning Order.travel_date as it stands at that instant. It is NOT recomputed when travel_date later changes."
    constants:
      MINOR_AGE_THRESHOLD_YEARS: 16
    precision: "integer years"

  - name: required_document_set
    trigger: "POST /expediting/orders/{id}/applicants; read by GET /expediting/applicants/{id}/required-documents"
    algorithm: constraint_propagation
    formula: |
      candidates = DocumentRequirement rows with catalog_item_id == Order.catalog_item_id
      applies(row) = (row.applies_max_age_years is null)
                     or (Applicant.age_years < row.applies_max_age_years)
      derived_set  = { row in candidates : applies(row) }
      required_set = { row in derived_set : row.is_required == true }
      required_doc_count = size(required_set)

      At applicant creation one ApplicantDocument slot is created per row in
      derived_set, in review_status MISSING, copying doc_type, is_required,
      validity_rule and validity_param. Optional rows produce slots too, but
      those slots never gate submission.
    input_set: "derived_set is pinned at applicant creation and is NOT re-derived when travel_date, age_years or the catalog's requirement rows change afterwards."
    constants: {}
    precision: "exact set membership"

  - name: government_fee_total
    trigger: "POST /expediting/orders/{id}/quote"
    algorithm: aggregation
    formula: |
      catalog = the order's ServiceCatalogItem
      n = Order.applicant_count (Applicants with readiness_status in {PENDING, COMPLETE})
      if catalog.government_fee_basis == PER_ORDER:
          government_fee_quoted_cents = catalog.government_fee_cents
      else:
          government_fee_quoted_cents = catalog.government_fee_cents * n
      The GOVERNMENT stream is never touched by any discount, tier surcharge,
      handling fee or waiver.
    input_set: "Applicants with readiness_status WITHDRAWN are excluded from n."
    constants: {}
    precision: "whole cents"
    variants:
      - name: per_order
        when: "catalog.government_fee_basis == PER_ORDER"
        difference: "The consular fee is a single per-file charge; adding applicants does not change it."
      - name: per_applicant
        when: "catalog.government_fee_basis == PER_APPLICANT"
        difference: "The consular fee scales linearly with applicant_count; the same catalog fee yields an n-fold larger government total."

  - name: per_applicant_service_line
    trigger: "invoked by service_fee_total and by tier_change_pricing"
    algorithm: tiered_pricing
    formula: |
      tier_pct = STANDARD_SURCHARGE_PCT  when Order.service_level == STANDARD
               = EXPEDITED_SURCHARGE_PCT when Order.service_level == EXPEDITED
               = RUSH_SURCHARGE_PCT      when Order.service_level == RUSH

      line_raw    = catalog.base_service_fee_cents * (1 + tier_pct)
      line_net    = line_raw * (1 - discount_pct_applied)
      line_cents  = round_half_up(line_net)            # ROUND PER LINE ...
      service_subtotal_cents = sum of line_cents over the counted applicants   # ... THEN SUM
    input_set: "One line per Applicant with readiness_status in {PENDING, COMPLETE}."
    constants:
      STANDARD_SURCHARGE_PCT: 0.00
      EXPEDITED_SURCHARGE_PCT: 0.35
      RUSH_SURCHARGE_PCT: 0.80
    precision: "each line rounded to whole cents with round_half_up BEFORE summation; summing first and rounding once is explicitly NOT the pinned order"

  - name: service_fee_total
    trigger: "POST /expediting/orders/{id}/quote"
    algorithm: waterfall_allocation
    formula: |
      # The evaluation order below is pinned. The waiver test reads the
      # POST-discount subtotal, and the discount is chosen before the subtotal
      # exists, so the three steps must run in exactly this sequence.
      Step 1  auto_pct = MULTI_APPLICANT_DISCOUNT_PCT
                         when Order.applicant_count >= MULTI_APPLICANT_MIN_COUNT
                         else 0.00
      Step 2  discount_pct_applied = min(auto_pct + promo_discount_pct, MAX_DISCOUNT_PCT)
              (promo_discount_pct is the request field, default 0.00)
      Step 3  service_subtotal_cents = per_applicant_service_line(discount_pct_applied)
      Step 4  handling_fee_waived =
                 (Order.applicant_count >= MULTI_APPLICANT_MIN_COUNT)
                 and (service_subtotal_cents >= MULTI_APPLICANT_WAIVER_FLOOR_CENTS)
      Step 5  handling_component = 0 when handling_fee_waived else ORDER_HANDLING_FEE_CENTS
      Step 6  service_fee_quoted_cents = service_subtotal_cents + handling_component
      Step 7  total_quoted_cents = government_fee_quoted_cents + service_fee_quoted_cents
    input_set: "Applicants with readiness_status WITHDRAWN are excluded from applicant_count."
    constants:
      MULTI_APPLICANT_MIN_COUNT: 3
      MULTI_APPLICANT_DISCOUNT_PCT: 0.10
      MULTI_APPLICANT_WAIVER_FLOOR_CENTS: 20000
      MAX_DISCOUNT_PCT: 0.25
      ORDER_HANDLING_FEE_CENTS: 3000
    precision: "whole cents, round_half_up"
    note: |
      Deliberate trap: a larger discount can produce a LARGER total. A discount
      that drags service_subtotal_cents below MULTI_APPLICANT_WAIVER_FLOOR_CENTS
      forfeits the ORDER_HANDLING_FEE_CENTS waiver, and the forfeited waiver can
      exceed the discount saved.

  - name: payment_stream_allocation
    trigger: "POST /expediting/orders/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      gov_remaining = max(Order.government_fee_quoted_cents
                          - Order.collected_government_cents, 0)
      if stream_override is omitted:
          gov_part = min(amount_cents, gov_remaining)
          svc_part = amount_cents - gov_part
      elif stream_override == GOVERNMENT:
          gov_part = amount_cents; svc_part = 0
      else:                     # stream_override == SERVICE
          gov_part = 0;          svc_part = amount_cents

      A LedgerEntry (kind COLLECTION) is appended for each strictly positive
      part, on its own stream. Order.outstanding_cents increases by
      amount_cents.
    input_set: "Only LedgerEntry rows of this order participate; no cross-order money movement occurs here."
    constants: {}
    precision: "whole cents"
    note: "The GOVERNMENT bucket fills first. stream_override is the only way to over-fill it, and doing so is rejected by the ERR_STREAM_ALLOCATION_INVALID rung."

  - name: tier_change_pricing
    trigger: "POST /expediting/orders/{id}/service-level"
    algorithm: tiered_pricing
    formula: |
      The requested tier must be strictly higher than the current tier in the
      order STANDARD < EXPEDITED < RUSH.
    input_set: "The order's counted applicants at the moment of the change."
    constants:
      TIER_UPGRADE_ADMIN_FEE_CENTS: 2500
    precision: "whole cents, round_half_up"
    variants:
      - name: pre_intake_requote
        when: "Order.workflow_status is in the set {DRAFT, QUOTED}"
        difference: |
          The whole quote is recomputed from scratch at the new tier:
          government_fee_total and service_fee_total both re-run, discount and
          waiver are re-evaluated, and NO admin fee is charged. The previously
          quoted numbers are discarded, not adjusted.
      - name: in_flight_delta
        when: "Order.workflow_status is in the set {INTAKE, READY_FOR_SUBMISSION}"
        difference: |
          Only the difference is priced:
            new_subtotal   = per_applicant_service_line at the NEW tier_pct,
                             reusing the order's recorded discount_pct_applied
            old_subtotal   = Order.service_fee_quoted_cents
                             - (0 if Order.handling_fee_waived else ORDER_HANDLING_FEE_CENTS)
            delta_cents    = new_subtotal - old_subtotal + TIER_UPGRADE_ADMIN_FEE_CENTS
            Order.service_fee_quoted_cents += delta_cents
            Order.total_quoted_cents = government_fee_quoted_cents + service_fee_quoted_cents
          handling_fee_waived and discount_pct_applied are FROZEN at their
          accepted-quote values and are NOT re-evaluated. The GOVERNMENT stream
          is untouched. payment_status is re-derived afterwards and may regress
          from COLLECTED to PARTIALLY_COLLECTED.

  - name: refund_adjudication
    trigger: "POST /expediting/orders/{id}/cancel; POST /expediting/orders/{id}/agency-decision with decision REJECTED; POST /expediting/rfes/{id}/adjudicate with outcome INSUFFICIENT or EXPIRED at the cap"
    algorithm: threshold
    formula: |
      stage_pct = REFUND_PCT_DRAFT                when furthest_stage_reached == DRAFT
                = REFUND_PCT_QUOTED               when furthest_stage_reached == QUOTED
                = REFUND_PCT_INTAKE               when furthest_stage_reached == INTAKE
                = REFUND_PCT_READY_FOR_SUBMISSION when furthest_stage_reached == READY_FOR_SUBMISSION
                = REFUND_PCT_SUBMITTED            when furthest_stage_reached == SUBMITTED
                = REFUND_PCT_AT_AGENCY            when furthest_stage_reached == AT_AGENCY

      service_refund_cents = round_half_up(Order.collected_service_cents * stage_pct)
      total_refund_cents   = service_refund_cents + government_refund_cents

      # How a disbursed refund is funded (pinned waterfall, applied per stream):
      refund_draw(amount):
        from_outstanding = min(amount, Order.outstanding_cents)
        Order.outstanding_cents     -= from_outstanding
        remainder                    = amount - from_outstanding
        Order.service_earned_cents  -= remainder     # de-recognises revenue already earned
        Order.refunded_cents        += amount
      The GOVERNMENT stream is never drawn from government_tendered_cents;
      once tendered it is unreachable, which is exactly why the post_tender
      variant returns zero for it.
    input_set: "Only this order's own collections; a split child's collections are never refunded by the parent."
    constants:
      REFUND_PCT_DRAFT: 1.00
      REFUND_PCT_QUOTED: 1.00
      REFUND_PCT_INTAKE: 0.75
      REFUND_PCT_READY_FOR_SUBMISSION: 0.50
      REFUND_PCT_SUBMITTED: 0.25
      REFUND_PCT_AT_AGENCY: 0.15
    precision: "whole cents, round_half_up"
    variants:
      - name: pre_tender
        when: "Order.government_tendered_cents == 0"
        difference: |
          government_refund_cents = Order.collected_government_cents — the
          pass-through money never reached the agency, so all of it comes back.
          REFUND LedgerEntry rows are written immediately (one per stream with a
          strictly positive amount) and payment_status moves straight to
          PARTIALLY_REFUNDED or REFUNDED.
      - name: post_tender
        when: "Order.government_tendered_cents > 0"
        difference: |
          government_refund_cents = 0 — the pass-through money is already with
          the agency and is never returned. No REFUND row is written yet:
          Order.refund_scheduled_cents is set and payment_status becomes
          REFUND_PENDING; the rows are appended only when the AGENCY -> SERVICE
          return CourierLeg reaches DELIVERED.

  - name: effective_submission_date
    trigger: "POST /expediting/orders/{id}/submit; also evaluated hypothetically by projected_completion_date"
    algorithm: threshold
    formula: |
      cutoff_hour = STANDARD_CUTOFF_HOUR_UTC  when Order.service_level == STANDARD
                  = EXPEDITED_CUTOFF_HOUR_UTC when Order.service_level == EXPEDITED
                  = RUSH_CUTOFF_HOUR_UTC      when Order.service_level == RUSH

      now = logical clock; D = calendar date of now
      if is_business_day(D, consulate) and hour(now) < cutoff_hour:
          effective_submission_date = D
      else:
          effective_submission_date = advance_business_days(D, 1, consulate)
    input_set: "consulate = the order's Consulate when consulate_id is set, else null."
    constants:
      STANDARD_CUTOFF_HOUR_UTC: 21
      EXPEDITED_CUTOFF_HOUR_UTC: 18
      RUSH_CUTOFF_HOUR_UTC: 15
    precision: "whole calendar dates"
    note: "Strict `<` on the cutoff: submitting AT the cutoff hour rolls to the next business day."

  - name: agency_turnaround_days
    trigger: "invoked by projected_completion_date"
    algorithm: threshold
    formula: |
      see variants
    input_set: "The order's ServiceCatalogItem and Order.service_level."
    constants:
      STANDARD_TURNAROUND_BUSINESS_DAYS: 15
      EXPEDITED_TURNAROUND_BUSINESS_DAYS: 8
      RUSH_TURNAROUND_BUSINESS_DAYS: 3
    precision: "integer business days"
    variants:
      - name: catalog_override
        when: "catalog.agency_turnaround_override_days is not null"
        difference: "The product's own turnaround replaces the tier constant entirely; upgrading the tier then buys NO turnaround improvement, only a surcharge and a tighter cutoff."
      - name: tier_default
        when: "catalog.agency_turnaround_override_days is null"
        difference: "The tier constant applies: 15 / 8 / 3 business days for STANDARD / EXPEDITED / RUSH."

  - name: projected_completion_date
    trigger: "POST /expediting/orders/{id}/quote; INTAKE_to_READY_FOR_SUBMISSION; POST /expediting/orders/{id}/service-level; PATCH /expediting/orders/{id}/travel-dates; GET /expediting/orders/{id}/feasibility"
    algorithm: forward_looking
    formula: |
      see variants; both write Order.projected_completion_date
    input_set: "consulate = the order's Consulate when consulate_id is set, else null; closure_dates participate in every advance."
    constants:
      COURIER_LEG_BUSINESS_DAYS: 1
      DELIVERY_BUSINESS_DAYS: 2
      BUSINESS_DAY_MINUTES: 480
    precision: "whole calendar dates"
    variants:
      - name: tier_nominal
        when: "Order.submitted_at is null"
        difference: |
          base = effective_submission_date computed as if the order were
                 submitted at the current logical clock
          d1   = advance_business_days(base, COURIER_LEG_BUSINESS_DAYS, consulate)   # SERVICE -> AGENCY
          d2   = advance_business_days(d1, agency_turnaround_days, consulate)
          d3   = advance_business_days(d2, COURIER_LEG_BUSINESS_DAYS, consulate)     # AGENCY -> SERVICE
          projected_completion_date = advance_business_days(d3, DELIVERY_BUSINESS_DAYS, consulate)
      - name: observed_actual
        when: "Order.submitted_at is not null"
        difference: |
          The outbound leg is already spent and the agency has already consumed
          part of its turnaround, so the projection restarts from today and
          credits elapsed running SLA time:
          base      = calendar date of the logical clock now, advanced to the
                      next business day when today is not one
          consumed  = floor(sla_elapsed_business_minutes[clock_stop] / BUSINESS_DAY_MINUTES)
          remaining = max(agency_turnaround_days - consumed, 0)
          d2   = advance_business_days(base, remaining, consulate)
          d3   = advance_business_days(d2, COURIER_LEG_BUSINESS_DAYS, consulate)
          projected_completion_date = advance_business_days(d3, DELIVERY_BUSINESS_DAYS, consulate)

  - name: feasibility_evaluation
    trigger: "runs immediately after every projected_completion_date evaluation"
    algorithm: threshold
    formula: |
      deadline_date = Order.travel_date minus TRAVEL_DATE_BUFFER_DAYS calendar days
      feasibility_status = FEASIBLE  when projected_completion_date <= deadline_date
                         = INFEASIBLE when projected_completion_date >  deadline_date
      An existing ACKNOWLEDGED_INFEASIBLE is revoked to INFEASIBLE or FEASIBLE
      by this evaluation whenever it re-runs.
    input_set: "Calendar days, not business days — the buffer is a wall-calendar cushion."
    constants:
      TRAVEL_DATE_BUFFER_DAYS: 5
    precision: "whole calendar dates"
    note: "Boundary is inclusive: landing exactly on travel_date - 5 is FEASIBLE."

  - name: document_validity_check
    trigger: "POST /expediting/documents/{id}/review with decision ACCEPT"
    algorithm: threshold
    formula: |
      when validity_rule == NONE: result = VALID (no dates are consulted)
      otherwise see variants
    input_set: "The owning Order's travel_date and return_date as they stand at review time — never the logical clock."
    constants:
      PASSPORT_VALIDITY_MONTHS_BEYOND_RETURN: 6
      SUPPORTING_DOC_VALIDITY_DAYS: 90
    precision: "whole calendar dates; month addition clamps to the last day of a shorter target month"
    variants:
      - name: return_date_anchored
        when: "validity_rule == VALID_BEYOND_RETURN_MONTHS"
        difference: |
          required_min_expiry = Order.return_date plus validity_param calendar
                                months (clamping to the last day of a shorter
                                target month)
          result = VALID when ApplicantDocument.expiry_date >= required_min_expiry
          When the DocumentRequirement omitted validity_param, it defaults to
          PASSPORT_VALIDITY_MONTHS_BEYOND_RETURN.
      - name: issue_date_anchored
        when: "validity_rule == EXPIRES_AFTER_ISSUE_DAYS"
        difference: |
          doc_expiry = ApplicantDocument.issue_date plus validity_param calendar days
          result = VALID when doc_expiry >= Order.travel_date
          When the DocumentRequirement omitted validity_param, it defaults to
          SUPPORTING_DOC_VALIDITY_DAYS. This variant anchors on the DEPARTURE
          date while the sibling variant anchors on the RETURN date — the same
          document dates can pass one rule and fail the other.

  - name: photo_compliance
    trigger: "POST /expediting/photos/{id}/compliance-check"
    algorithm: weighted_scoring
    formula: |
      failures = []
      if not (PHOTO_MIN_HEAD_HEIGHT_RATIO <= head_height_ratio <= PHOTO_MAX_HEAD_HEIGHT_RATIO):
          failures.append("HEAD_HEIGHT")
      if background_code == COLORED:
          failures.append("BACKGROUND")
      if resolution_px < PHOTO_MIN_RESOLUTION_PX:
          failures.append("RESOLUTION")
      # failures are appended in exactly this order: HEAD_HEIGHT, BACKGROUND, RESOLUTION
      compliance_status = FAILED when failures is non-empty
                        = EXPIRED when failures is empty and
                          taken_on + PHOTO_VALIDITY_DAYS calendar days < Order.travel_date
                        = PASSED otherwise
    input_set: "The photo's own three criteria plus the owning Order.travel_date."
    constants:
      PHOTO_MIN_HEAD_HEIGHT_RATIO: 0.50
      PHOTO_MAX_HEAD_HEIGHT_RATIO: 0.69
      PHOTO_MIN_RESOLUTION_PX: 600
      PHOTO_VALIDITY_DAYS: 180
    precision: "ratio compared to 2 decimal places; both head-height bounds are INCLUSIVE; resolution bound is inclusive at PHOTO_MIN_RESOLUTION_PX"

  - name: rfe_deadline
    trigger: "POST /expediting/orders/{id}/rfes; RFE RESPONDED_to_OPEN re-issue"
    algorithm: projection
    formula: |
      deadline_date = advance_business_days(calendar date of RFE.issued_at,
                                            RFE_RESPONSE_BUSINESS_DAYS, consulate)
      deadline_at   = deadline_date at BUSINESS_DAY_END_HOUR_UTC:00:00Z
    input_set: "consulate = the order's Consulate when consulate_id is set, else null."
    constants:
      RFE_RESPONSE_BUSINESS_DAYS: 10
      BUSINESS_DAY_END_HOUR_UTC: 17
    precision: "instant to the second, always at 17:00:00Z"

  - name: sla_elapsed_business_minutes
    trigger: "GET /expediting/orders/{id}/summary; invoked by projected_completion_date variant observed_actual"
    algorithm: aggregation
    formula: |
      see variants; both partition the interval that starts at Order.submitted_at
      and ends at Order.decided_at when set, else at the logical clock now
    input_set: "SlaSegment rows of this order ordered by started_at ASC; the segments tile the interval with no gaps and no overlaps."
    constants:
      BUSINESS_DAY_MINUTES: 480
    precision: "whole minutes"
    variants:
      - name: clock_stop
        when: "always available; this is the contractual SLA figure"
        difference: |
          sum of business_minutes over SlaSegment rows with segment_kind ==
          RUNNING, plus, for the single open RUNNING segment when one exists,
          business_minutes_between(started_at, now, consulate). PAUSED segments
          contribute ZERO — an open RFE stops the clock.
      - name: gross_elapsed
        when: "reported alongside clock_stop for transparency"
        difference: |
          business_minutes_between(Order.submitted_at, end_instant, consulate)
          computed in one shot, ignoring segment kinds entirely. Whenever any
          PAUSED segment carries positive business_minutes, gross_elapsed is
          strictly larger than clock_stop, and the difference equals the sum of
          business_minutes over the PAUSED segments.

  - name: delivery_escalation
    trigger: "POST /expediting/orders/{id}/shipments"
    algorithm: threshold
    formula: |
      days_to_travel = Order.travel_date minus the calendar date of the logical
                       clock now, in whole calendar days
      if requested method == GROUND and days_to_travel <= DELIVERY_ESCALATION_THRESHOLD_DAYS:
          Shipment.method = OVERNIGHT
          Shipment.escalation_fee_cents = DELIVERY_ESCALATION_FEE_CENTS
          Order.service_fee_quoted_cents += DELIVERY_ESCALATION_FEE_CENTS
          Order.total_quoted_cents = Order.government_fee_quoted_cents
                                   + Order.service_fee_quoted_cents
          re-derive Order.payment_status against the new total
      else:
          Shipment.method = the requested method
          Shipment.escalation_fee_cents = 0
      No LedgerEntry is written: the surcharge is a NEW CHARGE on the SERVICE
      stream, not a recognition of money already collected, so the money
      conservation identity is untouched and only the quoted total moves.
    input_set: "Only GROUND is escalated; OVERNIGHT and COURIER_SAME_DAY requests are honoured as requested and never carry a fee."
    constants:
      DELIVERY_ESCALATION_THRESHOLD_DAYS: 7
      DELIVERY_ESCALATION_FEE_CENTS: 4500
    precision: "whole cents; the threshold comparison is inclusive (exactly 7 days escalates)"

  - name: split_money_partition
    trigger: "POST /expediting/orders/{id}/split"
    algorithm: waterfall_allocation
    formula: |
      moved_count = number of applicant_ids in the request
      parent_count_before = Order.applicant_count before the move
      gov_transfer_cents = round_half_up(parent.collected_government_cents
                                         * moved_count / parent_count_before)
      svc_transfer_cents = round_half_up(parent.collected_service_cents
                                         * moved_count / parent_count_before)
      transfer_cents = gov_transfer_cents + svc_transfer_cents

      On the parent: LedgerEntry (stream GOVERNMENT, kind TRANSFER_OUT,
      amount gov_transfer_cents) and (stream SERVICE, kind TRANSFER_OUT,
      amount svc_transfer_cents), each written only when strictly positive.
      On the child: the mirror TRANSFER_IN rows with identical amounts.
      The parent is additionally charged
      admin_fee_cents = min(SPLIT_ADMIN_FEE_CENTS, parent.outstanding_cents
                            after the transfer)
      as a SERVICE EARN row with reason SPLIT_PARTITION, which moves money out
      of outstanding_cents into service_earned_cents without changing
      collected_cents.

      Finally BOTH orders re-run government_fee_total and service_fee_total
      against their own applicant sets with promo_discount_pct = 0.00 (a promo
      never survives a split), overwriting government_fee_quoted_cents,
      service_fee_quoted_cents, total_quoted_cents, discount_pct_applied and
      handling_fee_waived on each. Neither order's furthest_stage_reached moves.
    input_set: "Only Applicants with readiness_status == COMPLETE may be moved; parent_count_before is measured before any applicant is re-parented."
    constants:
      SPLIT_ADMIN_FEE_CENTS: 1500
    precision: "whole cents, round_half_up; the two streams are rounded independently and never netted against each other"

  - name: money_conservation_invariant
    trigger: "asserted after every LedgerEntry write; surfaced by GET /expediting/orders/{id}/summary"
    algorithm: aggregation
    formula: |
      collected_cents == government_tendered_cents
                       + service_earned_cents
                       + refunded_cents
                       + outstanding_cents
      and, per stream:
      collected_government_cents >= government_tendered_cents
      collected_government_cents <= government_fee_quoted_cents
    input_set: "All LedgerEntry rows of this order, whatever their kind; TRANSFER_OUT reduces and TRANSFER_IN increases the collected totals of their own stream."
    constants: {}
    precision: "exact integer cents; no tolerance"
    note: "The per-stream ceiling is the breakable half — the optional stream_override field on POST payments is the only way to push collected_government_cents past government_fee_quoted_cents, and that attempt is rejected."

  - name: custody_exclusivity_invariant
    trigger: "asserted after every CustodyEvent write; surfaced by GET /expediting/orders/{id}/custody-events"
    algorithm: aggregation
    formula: |
      count of CustodyEvent rows of this order with released_at == null  ==  1
      and that single open row's holder_type == Order.custody_holder
      and no two CustodyEvent rows of this order have overlapping
      [acquired_at, released_at) intervals
    input_set: "Every CustodyEvent row of the order, ordered by acquired_at ASC."
    constants: {}
    precision: "exact cardinality; no tolerance"

  - name: sla_partition_invariant
    trigger: "asserted after every SlaSegment write; surfaced by GET /expediting/orders/{id}/sla-segments"
    algorithm: interval_merge
    formula: |
      Let S1..Sk be the order's SlaSegment rows ordered by started_at ASC.
      S1.started_at == Order.submitted_at
      for i in 1..k-1: S(i).ended_at == S(i+1).started_at        # no gaps, no overlaps
      Sk.ended_at == Order.decided_at when decided_at is set, else null (open)
      sum of business_minutes over ALL closed segments
          == business_minutes_between(Order.submitted_at, Order.decided_at, consulate)
      sum of business_minutes over RUNNING segments
          == sla_elapsed_business_minutes[clock_stop]
    input_set: "Only SlaSegment rows of this order."
    constants: {}
    precision: "exact whole minutes; the RUNNING and PAUSED parts partition the total exactly"

# ===========================================================================
# 1.4 Validation Rules Table — the 38-rung priority ladder
# Checks run strictly in ascending priority; the FIRST failing rung decides the
# response. Rung 8 (the agency-custody write gate) deliberately pre-empts
# rungs 9-38 for every endpoint it covers.
# ===========================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role declared in section 1.7; X-User-ID is present whenever the role is CaseManager, Traveler, ComplianceOfficer, AgencyLiaison or CourierOps."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the called endpoint's roles list in section 1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "An {id} segment naming an Order resolves to a stored Order."
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "every path under /expediting/orders/{id}"

  - priority: 4
    category: existence
    check: "Every other referenced resource resolves, validated left-to-right in the path then left-to-right over body foreign keys: Applicant, ServiceCatalogItem, Consulate, AgencyForm, AppointmentSlot, ApplicantDocument, PhotoAsset, PreparedForm, Appointment, CourierLeg, RFE, Shipment. This rung also owns the case where POST /expediting/applicants/{id}/documents names a doc_type for which the applicant has no slot."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a resource id in the path or body"

  - priority: 5
    category: auth
    check: "When the acting role is Traveler, some Applicant whose id equals X-User-ID belongs to the order the request targets (directly, or through the applicant, document, photo, prepared form, appointment, RFE or shipment named in the path)."
    error_id: ERR_NOT_ORDER_MEMBER
    http_status: 403
    applies_to: "every endpoint whose roles list includes Traveler"

  - priority: 6
    category: business_constraint
    check: "Every required body field is present with the declared type; numbers respect their declared bounds; pagination limit is within 1..100 and offset is >= 0; return_date is >= travel_date; date and datetime fields parse as ISO-8601."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 7
    category: business_constraint
    check: "Every enum-typed request field carries a declared member. This rung owns EXACTLY these fields and no others: Order.service_level, ServiceCatalogItem.visa_type, ServiceCatalogItem.government_fee_basis, DocumentRequirement.doc_type, DocumentRequirement.validity_rule, ApplicantDocument.doc_type on submission, PhotoAsset.background_code, CourierLeg.from_holder, CourierLeg.to_holder, Shipment.method, RFE.requested_doc_type, the decision field on document review, the outcome field on courier-leg completion, appointment outcome, RFE adjudication and agency decision, and the stream_override field on payments. No other field routes here; every other malformed value routes to ERR_VALIDATION."
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all endpoints accepting one of the enumerated fields"

  - priority: 8
    category: business_safety
    check: "The agency-custody write gate. While Order.custody_holder == AGENCY every order-mutating endpoint is refused EXCEPT this exhaustive exclusion list: every GET; POST /expediting/orders/{id}/tender; POST /expediting/orders/{id}/rfes; POST /expediting/rfes/{id}/respond; POST /expediting/rfes/{id}/adjudicate; POST /expediting/orders/{id}/agency-decision; PATCH /expediting/shipments/{id}/address; POST /expediting/orders/{id}/cancel; POST /expediting/courier-legs/{id}/dispatch; POST /expediting/courier-legs/{id}/complete; POST /expediting/_clock/set_current_utc."
    error_id: ERR_AGENCY_CUSTODY_LOCK
    http_status: 409
    applies_to: "every mutating endpoint that touches an Order or any of its descendants and is not on the exclusion list"

  - priority: 9
    category: state
    check: "The targeted Order is not in a terminal workflow_status (COMPLETED, CANCELLED, ABANDONED)."
    error_id: ERR_ORDER_TERMINAL
    http_status: 409
    applies_to: "every mutating endpoint that touches an Order or any of its descendants"

  - priority: 10
    category: state
    check: "The target resource is in a state from which the requested transition is declared in section 1.2. This rung does NOT own four cases, which lower rungs own instead: (i) AppointmentSlot status on POST /expediting/appointments, owned by rungs 16 and 19; (ii) POST /expediting/orders/{id}/submit from workflow_status INTAKE, owned by rung 34 (INTAKE and READY_FOR_SUBMISSION are both accepted from-states for this rung); (iii) POST /expediting/shipments/{id}/delivery-attempt on a shipment in HELD_FOR_PICKUP, owned by rung 26; (iv) workflow gating on POST /expediting/orders/{id}/service-level, owned by rung 30."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 11
    category: business_constraint
    check: "The supplied expected_<parent>_version equals the current version of the OCC parent named in section 1.2.1 (Applicant for prepared-form creation, AppointmentSlot for appointment booking, Order for service-level change)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /expediting/applicants/{id}/prepared-forms; POST /expediting/appointments; POST /expediting/orders/{id}/service-level"

  - priority: 12
    category: business_safety
    check: "The X-User-ID submitting the order differs from Order.quoted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /expediting/orders/{id}/submit"

  - priority: 13
    category: business_referential
    check: "Applicant.nationality_code equals the nationality_code of the order's ServiceCatalogItem."
    error_id: ERR_NATIONALITY_MISMATCH
    http_status: 422
    applies_to: "POST /expediting/orders/{id}/applicants"

  - priority: 14
    category: business_safety
    check: "The passport is where the operation requires it to be: CourierLeg.from_holder equals Order.custody_holder on dispatch; Order.custody_holder == SERVICE on shipment creation and on the first delivery attempt; Order.custody_holder == AGENCY on tender."
    error_id: ERR_CUSTODY_MISMATCH
    http_status: 409
    applies_to: "POST /expediting/courier-legs/{id}/dispatch; POST /expediting/orders/{id}/shipments; POST /expediting/shipments/{id}/delivery-attempt; POST /expediting/orders/{id}/tender"

  - priority: 15
    category: business_constraint
    check: "The dispatched CourierLeg carries the lowest leg_index among the order's legs whose leg_status is CREATED or FAILED."
    error_id: ERR_LEG_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /expediting/courier-legs/{id}/dispatch"

  - priority: 16
    category: business_temporal
    check: "The date the operation lands on is a business day and is not in the consulate's closure_dates: CourierLeg.scheduled_date on dispatch, and the calendar date of AppointmentSlot.starts_at on booking or reschedule (equivalently, the slot's status is not CLOSED)."
    error_id: ERR_EMBASSY_CLOSED
    http_status: 409
    applies_to: "POST /expediting/courier-legs/{id}/dispatch; POST /expediting/appointments; POST /expediting/appointments/{id}/reschedule"

  - priority: 17
    category: business_referential
    check: "The applicant's residence_region_code appears in the target slot's Consulate.jurisdiction_region_codes, and that consulate is the order's consulate_id."
    error_id: ERR_OUT_OF_JURISDICTION
    http_status: 422
    applies_to: "POST /expediting/appointments; POST /expediting/appointments/{id}/reschedule"

  - priority: 18
    category: business_temporal
    check: "The target slot's starts_at is at least APPOINTMENT_LEAD_TIME_HOURS (48) after the logical clock. Exactly 48 hours passes."
    error_id: ERR_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /expediting/appointments; POST /expediting/appointments/{id}/reschedule"

  - priority: 19
    category: business_constraint
    check: "The target AppointmentSlot has booked_count strictly less than capacity (equivalently, status == OPEN)."
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /expediting/appointments; POST /expediting/appointments/{id}/reschedule"

  - priority: 20
    category: business_constraint
    check: "Reschedule caps: from booking_status BOOKED, reschedule_count < APPOINTMENT_RESCHEDULE_CAP (2); from booking_status NO_SHOW, no_show_count < NO_SHOW_REBOOK_CAP (2). The two counters are independent and a no-show rebook consumes only the second."
    error_id: ERR_RESCHEDULE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /expediting/appointments/{id}/reschedule"

  - priority: 21
    category: business_constraint
    check: "ApplicantDocument.resubmission_count < DOCUMENT_RESUBMISSION_CAP (2)."
    error_id: ERR_RESUBMISSION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /expediting/documents/{id}/resubmit"

  - priority: 22
    category: business_temporal
    check: "Calculation document_validity_check returns VALID for the slot against the owning Order's travel_date and return_date."
    error_id: ERR_DOCUMENT_VALIDITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /expediting/documents/{id}/review with decision ACCEPT"

  - priority: 23
    category: business_constraint
    check: "PhotoAsset.retake_count < PHOTO_RETAKE_CAP (3)."
    error_id: ERR_PHOTO_RETAKE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /expediting/photos/{id}/retake"

  - priority: 24
    category: business_referential
    check: "The AgencyForm named by agency_form_id has status == ACTIVE and its form_code equals the order's ServiceCatalogItem.form_code."
    error_id: ERR_FORM_REVISION_STALE
    http_status: 409
    applies_to: "POST /expediting/applicants/{id}/prepared-forms"

  - priority: 25
    category: business_constraint
    check: "CourierLeg.attempt_count < 1 + COURIER_REDISPATCH_CAP (that is, fewer than 3 dispatch attempts so far)."
    error_id: ERR_COURIER_ATTEMPT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /expediting/courier-legs/{id}/dispatch"

  - priority: 26
    category: business_constraint
    check: "Shipment.attempt_count < DELIVERY_ATTEMPT_CAP (3) and the shipment is not already HELD_FOR_PICKUP."
    error_id: ERR_DELIVERY_ATTEMPT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /expediting/shipments/{id}/delivery-attempt"

  - priority: 27
    category: business_constraint
    check: "Order.rfe_round_count < RFE_ROUND_CAP (2)."
    error_id: ERR_RFE_ROUND_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /expediting/orders/{id}/rfes"

  - priority: 28
    category: business_temporal
    check: "The logical clock is at or before RFE.deadline_at. Exactly equal passes."
    error_id: ERR_RFE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /expediting/rfes/{id}/respond"

  - priority: 29
    category: business_constraint
    check: "The requested service_level is strictly higher than the current one in the order STANDARD < EXPEDITED < RUSH."
    error_id: ERR_TIER_NOT_AN_UPGRADE
    http_status: 422
    applies_to: "POST /expediting/orders/{id}/service-level"

  - priority: 30
    category: state
    check: "Order.workflow_status is in the set {DRAFT, QUOTED, INTAKE, READY_FOR_SUBMISSION} — a tier change is closed from SUBMITTED onward."
    error_id: ERR_UPGRADE_STAGE_CLOSED
    http_status: 409
    applies_to: "POST /expediting/orders/{id}/service-level"

  - priority: 31
    category: business_fiscal
    check: "After applying stream_override, collected_government_cents must not exceed Order.government_fee_quoted_cents. Without the override the waterfall in calculation payment_stream_allocation makes this unreachable; the override is the only way to violate it."
    error_id: ERR_STREAM_ALLOCATION_INVALID
    http_status: 422
    applies_to: "POST /expediting/orders/{id}/payments"

  - priority: 32
    category: business_constraint
    check: "Every Applicant named in applicant_ids belongs to this order and has readiness_status == COMPLETE, and at least one Applicant remains on the parent."
    error_id: ERR_APPLICANT_NOT_READY
    http_status: 409
    applies_to: "POST /expediting/orders/{id}/split"

  - priority: 33
    category: business_fiscal
    check: "When transfer_cents_override is supplied it equals the transfer_cents computed by calculation split_money_partition."
    error_id: ERR_SPLIT_PARTITION_MISMATCH
    http_status: 422
    applies_to: "POST /expediting/orders/{id}/split"

  - priority: 34
    category: business_constraint
    check: "Every Applicant of the order with readiness_status in {PENDING, COMPLETE} is COMPLETE — equivalently every required ApplicantDocument is ACCEPTED, the photo is PASSED, the prepared form sits on the ACTIVE revision, and any required appointment is ATTENDED."
    error_id: ERR_REQUIRED_DOCUMENTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /expediting/orders/{id}/submit"

  - priority: 35
    category: business_temporal
    check: "When Order.service_level == RUSH, the logical clock hour is strictly before RUSH_CUTOFF_HOUR_UTC (15) and the current date is a business day."
    error_id: ERR_RUSH_CUTOFF_MISSED
    http_status: 409
    applies_to: "POST /expediting/orders/{id}/submit"

  - priority: 36
    category: business_safety
    check: "Order.feasibility_status is FEASIBLE or ACKNOWLEDGED_INFEASIBLE. A bare INFEASIBLE order cannot be submitted without a ComplianceOfficer acknowledgment."
    error_id: ERR_TRAVEL_DATE_INFEASIBLE
    http_status: 409
    applies_to: "POST /expediting/orders/{id}/submit"

  - priority: 37
    category: business_fiscal
    check: "Order.outstanding_cents is >= Order.total_quoted_cents — the customer money on hand covers the current quote, including any in-flight tier-upgrade delta."
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /expediting/orders/{id}/submit"

  - priority: 38
    category: business_fiscal
    check: "Cancelling while Order.custody_holder == AGENCY requires acknowledge_government_fee_forfeit == true, because the tendered government fee is never returned."
    error_id: ERR_GOVERNMENT_FEE_FORFEIT_UNACKNOWLEDGED
    http_status: 422
    applies_to: "POST /expediting/orders/{id}/cancel"

# ===========================================================================
# 1.5 API Endpoint Table  (72 endpoints)
# ===========================================================================
endpoints:

  # ---------------- configuration -----------------------------------------
  - method: POST
    path: "/expediting/catalog-items"
    description: "Create a product row for a (nationality, destination, visa type) triple."
    roles: [PlatformAdmin]
    code: 201
    input: ["nationality_code", "destination_country", "visa_type", "government_fee_cents", "government_fee_basis", "base_service_fee_cents", "form_code", "agency_turnaround_override_days?", "requires_appointment?"]
    output: ServiceCatalogItem
    side_effects: []

  - method: GET
    path: "/expediting/catalog-items"
    description: "List catalog items with optional filters."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: ["nationality_code?", "destination_country?", "visa_type?", "limit?", "offset?"]
    output: ServiceCatalogItem[]
    side_effects: []

  - method: GET
    path: "/expediting/catalog-items/{id}"
    description: "Read one catalog item."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: []
    output: ServiceCatalogItem
    side_effects: []

  - method: POST
    path: "/expediting/catalog-items/{id}/document-requirements"
    description: "Add a required-or-optional document line to a product."
    roles: [PlatformAdmin]
    code: 201
    input: ["doc_type", "is_required", "validity_rule", "validity_param?", "applies_max_age_years?"]
    output: DocumentRequirement
    side_effects:
      - "when validity_param is omitted it defaults to PASSPORT_VALIDITY_MONTHS_BEYOND_RETURN for VALID_BEYOND_RETURN_MONTHS and to SUPPORTING_DOC_VALIDITY_DAYS for EXPIRES_AFTER_ISSUE_DAYS"
      - "when applies_max_age_years is omitted it defaults to MINOR_AGE_THRESHOLD_YEARS for doc_type PARENTAL_CONSENT and to null for every other doc_type"

  - method: GET
    path: "/expediting/catalog-items/{id}/document-requirements"
    description: "List the requirement lines of a product."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: ["limit?", "offset?"]
    output: DocumentRequirement[]
    side_effects: []

  - method: POST
    path: "/expediting/agency-forms"
    description: "Register a new revision of a government form in DRAFT."
    roles: [PlatformAdmin]
    code: 201
    input: [form_code, revision, required_field_count]
    output: AgencyForm
    side_effects: []

  - method: GET
    path: "/expediting/agency-forms"
    description: "List form revisions."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: ["form_code?", "status?", "limit?", "offset?"]
    output: AgencyForm[]
    side_effects: []

  - method: GET
    path: "/expediting/agency-forms/{id}"
    description: "Read one form revision."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: []
    output: AgencyForm
    side_effects: []

  - method: POST
    path: "/expediting/agency-forms/{id}/publish"
    description: "Publish a DRAFT revision. Root of the depth-5 staleness cascade."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AgencyForm
    side_effects:
      - "sets published_at and status ACTIVE"
      - "HOP 1: the prior ACTIVE revision of the same form_code becomes SUPERSEDED"
      - "HOP 2: its PreparedForms in PREPARED or SIGNED become STALE (signatures voided)"
      - "HOP 3: their Applicants regress COMPLETE -> PENDING"
      - "HOP 4: those Applicants' Orders regress READY_FOR_SUBMISSION -> INTAKE and feasibility_status -> UNKNOWN"
      - "HOP 5: those Orders' CourierLegs in CREATED become CANCELLED"

  - method: GET
    path: "/expediting/agency-forms/{id}/prepared-forms"
    description: "List every preparation filled against this exact form revision."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: ["prep_status?", "limit?", "offset?"]
    output: PreparedForm[]
    side_effects: []

  - method: POST
    path: "/expediting/consulates"
    description: "Create a mission with an exclusive residence-region jurisdiction."
    roles: [PlatformAdmin]
    code: 201
    input: [name, destination_country, jurisdiction_region_codes]
    output: Consulate
    side_effects: []

  - method: GET
    path: "/expediting/consulates"
    description: "List missions."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: ["destination_country?", "limit?", "offset?"]
    output: Consulate[]
    side_effects: []

  - method: GET
    path: "/expediting/consulates/{id}"
    description: "Read one mission including its closure calendar."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: []
    output: Consulate
    side_effects: []

  - method: POST
    path: "/expediting/consulates/{id}/closures"
    description: "Add a calendar date to the mission's closure list."
    roles: [PlatformAdmin]
    code: 200
    input: [closure_date]
    output: Consulate
    side_effects:
      - "every AppointmentSlot of this consulate whose starts_at falls on the added date moves to status CLOSED"

  - method: POST
    path: "/expediting/consulates/{id}/slots"
    description: "Publish a bookable interview slot."
    roles: [PlatformAdmin]
    code: 201
    input: [starts_at, capacity]
    output: AppointmentSlot
    side_effects: []

  - method: GET
    path: "/expediting/consulates/{id}/slots"
    description: "List a mission's slots."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AppointmentSlot[]
    side_effects: []

  - method: GET
    path: "/expediting/slots/{id}"
    description: "Read one slot including booked_count and version."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: []

  # ---------------- orders --------------------------------------------------
  - method: POST
    path: "/expediting/orders"
    description: "Open an order against a catalog item."
    roles: [CaseManager]
    code: 201
    input: ["catalog_item_id", "travel_date", "return_date", "delivery_region_code", "service_level?", "consulate_id?"]
    output: Order
    side_effects:
      - "append the first CustodyEvent (holder_type APPLICANT, reason ORDER_CREATED); Order.custody_holder := APPLICANT"

  - method: GET
    path: "/expediting/orders"
    description: "List orders with filters; also the reverse-reachability read for catalog_item_id, consulate_id and parent_order_id."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: ["workflow_status?", "catalog_item_id?", "consulate_id?", "parent_order_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/expediting/orders/{id}"
    description: "Read one order including all four state axes and the money roll-up."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/expediting/orders/{id}/applicants"
    description: "Add a traveller to the order and materialise their document slots."
    roles: [CaseManager]
    code: 201
    input: [full_name, date_of_birth, nationality_code, residence_region_code]
    output: Applicant
    side_effects:
      - "run calculation applicant_age_years and pin Applicant.age_years"
      - "run calculation required_document_set and create one ApplicantDocument slot in MISSING per derived requirement row"
      - "recompute Order.applicant_count"

  - method: GET
    path: "/expediting/orders/{id}/applicants"
    description: "List the travellers on an order."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: ["readiness_status?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []

  - method: GET
    path: "/expediting/applicants/{id}"
    description: "Read one traveller including readiness_status, age_years and version."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: POST
    path: "/expediting/orders/{id}/quote"
    description: "Price the order across both money streams."
    roles: [CaseManager]
    code: 200
    input: ["promo_discount_pct?"]
    output: Order
    side_effects:
      - "run calculations government_fee_total, per_applicant_service_line and service_fee_total"
      - "write government_fee_quoted_cents, service_fee_quoted_cents, total_quoted_cents, discount_pct_applied, handling_fee_waived"
      - "set quoted_by_user_id and quoted_at; furthest_stage_reached := QUOTED"
      - "run calculations projected_completion_date and feasibility_evaluation"

  - method: POST
    path: "/expediting/orders/{id}/accept-quote"
    description: "Accept the quote and move the order into intake."
    roles: [CaseManager, Traveler]
    code: 200
    input: []
    output: Order
    side_effects:
      - "workflow_status QUOTED -> INTAKE; furthest_stage_reached := INTAKE"
      - "recompute every Applicant.readiness_status"

  - method: POST
    path: "/expediting/orders/{id}/payments"
    description: "Record a customer payment; the government bucket fills first unless stream_override says otherwise."
    roles: [CaseManager, Traveler]
    code: 201
    input: ["amount_cents", "stream_override?"]
    output: LedgerEntry
    side_effects:
      - "run calculation payment_stream_allocation; append one COLLECTION LedgerEntry per strictly positive stream part"
      - "increase Order.outstanding_cents by amount_cents and re-derive payment_status"
    note: "The response returns the SERVICE-stream COLLECTION row when one was written, otherwise the GOVERNMENT-stream row."

  - method: GET
    path: "/expediting/orders/{id}/ledger-entries"
    description: "List the order's money rows."
    roles: [PlatformAdmin, CaseManager, ComplianceOfficer, Traveler]
    code: 200
    input: ["stream?", "kind?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: POST
    path: "/expediting/orders/{id}/service-level"
    description: "Raise the service level. Prices as a full re-quote before intake and as a delta once in flight."
    roles: [CaseManager]
    code: 200
    input: [service_level, expected_order_version]
    output: Order
    side_effects:
      - "run calculation tier_change_pricing in the variant selected by workflow_status"
      - "increments Order.version by 1"
      - "re-derive payment_status (may regress COLLECTED -> PARTIALLY_COLLECTED)"
      - "run calculations projected_completion_date and feasibility_evaluation"

  - method: PATCH
    path: "/expediting/orders/{id}/travel-dates"
    description: "Change the travel and return dates; invalidates date-anchored acceptances."
    roles: [CaseManager, Traveler]
    code: 200
    input: [travel_date, return_date]
    output: Order
    side_effects:
      - "every ApplicantDocument in ACCEPTED with validity_rule != NONE returns to RECEIVED without incrementing resubmission_count"
      - "every PhotoAsset in PASSED whose taken_on plus PHOTO_VALIDITY_DAYS is before the new travel_date becomes EXPIRED"
      - "recompute Applicant.readiness_status and the Order readiness gate"
      - "run calculations projected_completion_date and feasibility_evaluation; any acknowledgment is revoked"

  - method: GET
    path: "/expediting/orders/{id}/feasibility"
    description: "Computed read of the completion projection and its verdict."
    roles: [PlatformAdmin, CaseManager, ComplianceOfficer, Traveler]
    code: 200
    input: []
    output: { effective_submission_date: string, agency_turnaround_days: integer, projected_completion_date: string, deadline_date: string, feasibility_status: string, variant_used: string }
    side_effects: []

  - method: POST
    path: "/expediting/orders/{id}/feasibility-acknowledgment"
    description: "Privileged acknowledgment that lets an INFEASIBLE order proceed."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "feasibility_status INFEASIBLE -> ACKNOWLEDGED_INFEASIBLE; acknowledged_by_user_id := X-User-ID"

  - method: POST
    path: "/expediting/orders/{id}/submit"
    description: "Submit the order to the agency pipeline."
    roles: [CaseManager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "run calculation effective_submission_date"
      - "append LedgerEntry (stream SERVICE, kind EARN, reason SERVICE_RECOGNITION) for service_fee_quoted_cents and reduce outstanding_cents by the same amount"
      - "append the first SlaSegment (RUNNING, cause SUBMISSION)"
      - "set submitted_at, submitted_by_user_id; furthest_stage_reached := SUBMITTED"

  - method: POST
    path: "/expediting/orders/{id}/split"
    description: "Move ready applicants into a new child order and partition the money."
    roles: [CaseManager]
    code: 201
    input: ["applicant_ids", "transfer_cents_override?"]
    output: Order
    side_effects:
      - "create a child Order with parent_order_id set and the same catalog_item_id, consulate_id, service_level, travel_date, return_date and delivery_region_code, in workflow_status INTAKE with furthest_stage_reached INTAKE"
      - "initialise the child's custody_holder to the parent's custody_holder and append the child's first CustodyEvent with that holder_type and reason ORDER_CREATED"
      - "re-parent every named Applicant (and with them their documents, photos, prepared forms and appointments) to the child order"
      - "run calculation split_money_partition; append TRANSFER_OUT rows on the parent and mirror TRANSFER_IN rows on the child"
      - "charge SPLIT_ADMIN_FEE_CENTS on the parent as a SERVICE EARN row with reason SPLIT_PARTITION"
      - "recompute applicant_count, collected_*, outstanding_cents and payment_status on both orders"

  - method: POST
    path: "/expediting/orders/{id}/cancel"
    description: "Cancel the order. Permitted while the passport is in agency custody only with an explicit forfeit acknowledgment."
    roles: [CaseManager, Traveler]
    code: 200
    input: ["acknowledge_government_fee_forfeit?"]
    output: Order
    side_effects:
      - "run calculation refund_adjudication in the variant selected by government_tendered_cents"
      - "every Applicant moves to WITHDRAWN and their BOOKED Appointments to CANCELLED, releasing slot capacity"
      - "every CourierLeg in CREATED or FAILED moves to CANCELLED"

  - method: GET
    path: "/expediting/orders/{id}/summary"
    description: "Computed read of the money conservation identity, the custody cardinality and both SLA variants."
    roles: [PlatformAdmin, CaseManager, ComplianceOfficer, Traveler]
    code: 200
    input: []
    output: { collected_cents: integer, government_tendered_cents: integer, service_earned_cents: integer, refunded_cents: integer, refund_scheduled_cents: integer, outstanding_cents: integer, conservation_ok: boolean, open_custody_count: integer, open_custody_holder: string, sla_running_business_minutes: integer, sla_paused_business_minutes: integer, sla_gross_business_minutes: integer }
    side_effects: []

  - method: POST
    path: "/expediting/orders/{id}/tender"
    description: "Agency acknowledges receipt; the pass-through fee is handed over."
    roles: [AgencyLiaison]
    code: 200
    input: []
    output: Order
    side_effects:
      - "workflow_status SUBMITTED -> AT_AGENCY; tendered_at := now; furthest_stage_reached := AT_AGENCY"
      - "append LedgerEntry (stream GOVERNMENT, kind TENDER, reason AGENCY_TENDER) for government_fee_quoted_cents and reduce outstanding_cents by the same amount"

  # ---------------- documents ------------------------------------------------
  - method: POST
    path: "/expediting/applicants/{id}/documents"
    description: "Submit a document into its MISSING slot."
    roles: [CaseManager, Traveler]
    code: 200
    input: [doc_type, issue_date, "expiry_date?"]
    output: ApplicantDocument
    side_effects:
      - "the matching slot moves MISSING -> RECEIVED and stores issue_date and expiry_date"

  - method: GET
    path: "/expediting/applicants/{id}/documents"
    description: "List a traveller's document slots."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: ["review_status?", "limit?", "offset?"]
    output: ApplicantDocument[]
    side_effects: []

  - method: GET
    path: "/expediting/documents/{id}"
    description: "Read one document slot."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: []
    output: ApplicantDocument
    side_effects: []

  - method: POST
    path: "/expediting/documents/{id}/review"
    description: "Accept or reject a received document."
    roles: [CaseManager]
    code: 200
    input: [decision, "rejection_reason?"]
    output: ApplicantDocument
    side_effects:
      - "on ACCEPT run calculation document_validity_check in the variant selected by validity_rule"
      - "recompute Applicant.accepted_doc_count and Applicant.readiness_status"
      - "may bubble the owning Order INTAKE -> READY_FOR_SUBMISSION"

  - method: POST
    path: "/expediting/documents/{id}/resubmit"
    description: "Re-supply a rejected document."
    roles: [CaseManager, Traveler]
    code: 200
    input: [issue_date, "expiry_date?"]
    output: ApplicantDocument
    side_effects:
      - "review_status REJECTED -> RECEIVED; resubmission_count += 1; rejection_reason := null"

  - method: GET
    path: "/expediting/applicants/{id}/required-documents"
    description: "Computed read of the derived requirement set and how much of it is satisfied."
    roles: [PlatformAdmin, CaseManager, ComplianceOfficer, Traveler]
    code: 200
    input: []
    output: { required_doc_types: string, optional_doc_types: string, required_doc_count: integer, accepted_doc_count: integer, satisfied: boolean }
    side_effects: []

  # ---------------- photo -----------------------------------------------------
  - method: POST
    path: "/expediting/applicants/{id}/photos"
    description: "Upload a passport photo for compliance checking."
    roles: [CaseManager, Traveler]
    code: 201
    input: [taken_on, head_height_ratio, background_code, resolution_px]
    output: PhotoAsset
    side_effects: []

  - method: GET
    path: "/expediting/applicants/{id}/photos"
    description: "List a traveller's photo submissions."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: ["compliance_status?", "limit?", "offset?"]
    output: PhotoAsset[]
    side_effects: []

  - method: POST
    path: "/expediting/photos/{id}/compliance-check"
    description: "Run the three named criteria plus the travel-date staleness test."
    roles: [CaseManager]
    code: 200
    input: []
    output: PhotoAsset
    side_effects:
      - "run calculation photo_compliance; write compliance_status and failure_reasons"
      - "recompute Applicant.readiness_status"

  - method: POST
    path: "/expediting/photos/{id}/retake"
    description: "Supersede a FAILED or EXPIRED photo with a fresh one."
    roles: [CaseManager, Traveler]
    code: 201
    input: [taken_on, head_height_ratio, background_code, resolution_px]
    output: PhotoAsset
    side_effects:
      - "the source photo moves to SUPERSEDED"
      - "a new PhotoAsset is created in PENDING with retake_count := source.retake_count + 1"

  # ---------------- prepared forms --------------------------------------------
  - method: POST
    path: "/expediting/applicants/{id}/prepared-forms"
    description: "Prepare the product's agency form against its ACTIVE revision. CREATE-with-supersede, OCC-guarded on the applicant."
    roles: [CaseManager]
    code: 201
    input: [agency_form_id, filled_field_count, expected_applicant_version]
    output: PreparedForm
    side_effects:
      - "any prior PreparedForm of this applicant with the same form_code moves to VOID"
      - "increments Applicant.version by 1"
      - "recompute Applicant.readiness_status"

  - method: GET
    path: "/expediting/applicants/{id}/prepared-forms"
    description: "List a traveller's form preparations."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: ["prep_status?", "limit?", "offset?"]
    output: PreparedForm[]
    side_effects: []

  - method: POST
    path: "/expediting/prepared-forms/{id}/sign"
    description: "Sign a prepared form."
    roles: [CaseManager, Traveler]
    code: 200
    input: []
    output: PreparedForm
    side_effects:
      - "prep_status PREPARED -> SIGNED; signed_at := now; signed_by_user_id := X-User-ID"

  # ---------------- appointments ----------------------------------------------
  - method: POST
    path: "/expediting/appointments"
    description: "Book a consulate interview. OCC-guarded on the slot."
    roles: [CaseManager]
    code: 201
    input: [applicant_id, slot_id, expected_slot_version]
    output: Appointment
    side_effects:
      - "increment AppointmentSlot.booked_count and re-derive its status; increments AppointmentSlot.version by 1"
      - "booked_at := logical clock now"

  - method: GET
    path: "/expediting/appointments"
    description: "List appointments; also the reverse-reachability read for applicant_id and slot_id."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: ["applicant_id?", "slot_id?", "booking_status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: GET
    path: "/expediting/appointments/{id}"
    description: "Read one appointment."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/expediting/appointments/{id}/reschedule"
    description: "Move a booking to another slot, or rebook after a no-show."
    roles: [CaseManager]
    code: 200
    input: [slot_id]
    output: Appointment
    side_effects:
      - "release capacity on the old slot when the booking was BOOKED; take capacity on the new slot"
      - "from BOOKED: reschedule_count += 1; from NO_SHOW: booking_status returns to BOOKED and reschedule_count is untouched"

  - method: POST
    path: "/expediting/appointments/{id}/outcome"
    description: "Record whether the traveller appeared."
    roles: [AgencyLiaison]
    code: 200
    input: [outcome]
    output: Appointment
    side_effects:
      - "on NO_SHOW: no_show_count += 1 and slot capacity is released"
      - "recompute Applicant.readiness_status"

  # ---------------- courier and custody ---------------------------------------
  - method: POST
    path: "/expediting/orders/{id}/courier-legs"
    description: "Create an ordered physical hop for the passport book."
    roles: [CourierOps]
    code: 201
    input: [leg_index, from_holder, to_holder, scheduled_date]
    output: CourierLeg
    side_effects: []

  - method: GET
    path: "/expediting/orders/{id}/courier-legs"
    description: "List an order's hops in leg_index order."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: ["leg_status?", "limit?", "offset?"]
    output: CourierLeg[]
    side_effects: []

  - method: POST
    path: "/expediting/courier-legs/{id}/dispatch"
    description: "Hand the book to the courier for this hop."
    roles: [CourierOps]
    code: 200
    input: []
    output: CourierLeg
    side_effects:
      - "attempt_count += 1; leg_status -> DISPATCHED"
      - "close the open CustodyEvent and append a COURIER one carrying leg_index; Order.custody_holder := COURIER"

  - method: POST
    path: "/expediting/courier-legs/{id}/complete"
    description: "Close the hop as delivered or failed."
    roles: [CourierOps]
    code: 200
    input: [outcome]
    output: CourierLeg
    side_effects:
      - "on DELIVERED custody moves to to_holder; on FAILED custody reverts to from_holder"
      - "on DELIVERED into SERVICE while payment_status == REFUND_PENDING, append the scheduled REFUND LedgerEntry rows and clear refund_scheduled_cents"
      - "re-evaluate the owning Order's readiness gate"

  - method: GET
    path: "/expediting/orders/{id}/custody-events"
    description: "Read the append-only chain of custody; exactly one row has released_at null."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: ["limit?", "offset?"]
    output: CustodyEvent[]
    side_effects: []

  # ---------------- RFE and decision -------------------------------------------
  - method: POST
    path: "/expediting/orders/{id}/rfes"
    description: "Agency issues a request for evidence; pauses the SLA clock."
    roles: [AgencyLiaison]
    code: 201
    input: [requested_doc_type]
    output: RFE
    side_effects:
      - "workflow_status AT_AGENCY -> RFE_PENDING"
      - "run calculation rfe_deadline; write deadline_at"
      - "close the open RUNNING SlaSegment and append a PAUSED one with cause RFE_ISSUED"

  - method: GET
    path: "/expediting/orders/{id}/rfes"
    description: "List an order's evidence requests."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: ["rfe_status?", "limit?", "offset?"]
    output: RFE[]
    side_effects: []

  - method: POST
    path: "/expediting/rfes/{id}/respond"
    description: "Respond to an open evidence request before its deadline."
    roles: [CaseManager, Traveler]
    code: 200
    input: []
    output: RFE
    side_effects:
      - "rfe_status OPEN -> RESPONDED; responded_at := now; response_count += 1"

  - method: POST
    path: "/expediting/rfes/{id}/adjudicate"
    description: "Agency judges the response, re-opens it, or lets it expire."
    roles: [AgencyLiaison]
    code: 200
    input: [outcome]
    output: RFE
    side_effects:
      - "CLEARED resumes the SLA clock and returns the order to AT_AGENCY"
      - "INSUFFICIENT below the cap re-opens the RFE with a fresh deadline and leaves the clock PAUSED"
      - "INSUFFICIENT at the cap, or EXPIRED past the deadline, abandons the order and schedules the post-tender refund"

  - method: POST
    path: "/expediting/orders/{id}/agency-decision"
    description: "Agency approves or rejects the application."
    roles: [AgencyLiaison]
    code: 200
    input: [decision]
    output: Order
    side_effects:
      - "closes the SLA clock and sets decided_at"
      - "creates the AGENCY -> SERVICE return CourierLeg with leg_index one above the highest existing leg and scheduled_date equal to the calendar date of the logical clock at decision time"
      - "on REJECTED runs refund_adjudication (post_tender) and cascades Applicant -> Appointment -> AppointmentSlot"

  # ---------------- shipment ----------------------------------------------------
  - method: POST
    path: "/expediting/orders/{id}/shipments"
    description: "Create the return delivery; escalates GROUND to OVERNIGHT close to the travel date."
    roles: [CourierOps]
    code: 201
    input: [method, address_region_code, "signature_required?"]
    output: Shipment
    side_effects:
      - "workflow_status APPROVED or REJECTED -> DELIVERING"
      - "run calculation delivery_escalation; on escalation write escalation_fee_cents and raise the order's service_fee_quoted_cents and total_quoted_cents by DELIVERY_ESCALATION_FEE_CENTS, re-deriving payment_status"

  - method: GET
    path: "/expediting/orders/{id}/shipments"
    description: "List an order's shipments."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: ["limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/expediting/shipments/{id}"
    description: "Read one shipment."
    roles: [PlatformAdmin, CaseManager, CourierOps, AgencyLiaison, ComplianceOfficer, Traveler]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/expediting/shipments/{id}/delivery-attempt"
    description: "Record a delivery attempt; the capped failure falls back to hold-for-pickup."
    roles: [CourierOps]
    code: 200
    input: [outcome, "signature_captured?"]
    output: Shipment
    side_effects:
      - "attempt_count += 1"
      - "on DELIVERED custody moves to APPLICANT and the order COMPLETES"
      - "on the DELIVERY_ATTEMPT_CAP-th FAILED attempt the shipment moves to HELD_FOR_PICKUP"

  - method: PATCH
    path: "/expediting/shipments/{id}/address"
    description: "Change the delivery region. Explicitly allowed while the passport is in agency custody."
    roles: [CaseManager, Traveler]
    code: 200
    input: [address_region_code]
    output: Shipment
    side_effects: []

  - method: POST
    path: "/expediting/shipments/{id}/pickup"
    description: "Record collection of a held shipment."
    roles: [CourierOps]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "delivery_status HELD_FOR_PICKUP -> PICKED_UP; custody moves to APPLICANT; the order COMPLETES"

  # ---------------- SLA and clock ------------------------------------------------
  - method: GET
    path: "/expediting/orders/{id}/sla-segments"
    description: "Read the RUNNING/PAUSED partition of the agency clock in started_at order."
    roles: [PlatformAdmin, CaseManager, ComplianceOfficer, Traveler]
    code: 200
    input: ["limit?", "offset?"]
    output: SlaSegment[]
    side_effects: []

  - method: POST
    path: "/expediting/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call the clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "every subsequent deadline, cutoff, lead-time and validity evaluation reads this instant"

# ===========================================================================
# 1.6 Error Code Catalog  (38 codes, one per ladder rung)
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role is missing or names no declared role, or X-User-ID is missing for a role that requires it."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "An {id} segment naming an Order resolves to nothing."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Any other referenced resource resolves to nothing, including a document submission naming a doc_type the applicant has no slot for."
  - id: ERR_NOT_ORDER_MEMBER
    http: 403
    condition: "A Traveler acts on an order that carries no Applicant whose id equals X-User-ID."
  - id: ERR_VALIDATION
    http: 400
    condition: "A required body field is missing or mistyped, a numeric bound is broken, pagination is out of range, return_date precedes travel_date, a date fails ISO-8601 parsing, or signature_captured is absent on a DELIVERED attempt for a signature-required shipment."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "One of the enumerated request fields listed at ladder rung 7 carries a value outside its declared member set."
  - id: ERR_AGENCY_CUSTODY_LOCK
    http: 409
    condition: "An order-mutating endpoint outside the rung-8 exclusion list is called while Order.custody_holder == AGENCY."
  - id: ERR_ORDER_TERMINAL
    http: 409
    condition: "A mutating endpoint targets an Order whose workflow_status is COMPLETED, CANCELLED or ABANDONED."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_<parent>_version does not match the OCC parent's current version."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID submitting the order equals Order.quoted_by_user_id."
  - id: ERR_NATIONALITY_MISMATCH
    http: 422
    condition: "An applicant's nationality_code differs from the order's catalog item nationality_code."
  - id: ERR_CUSTODY_MISMATCH
    http: 409
    condition: "The passport is not with the holder the operation requires."
  - id: ERR_LEG_SEQUENCE_VIOLATION
    http: 409
    condition: "A courier leg is dispatched out of leg_index order."
  - id: ERR_EMBASSY_CLOSED
    http: 409
    condition: "The operation lands on a non-business day or a consulate closure date."
  - id: ERR_OUT_OF_JURISDICTION
    http: 422
    condition: "The applicant's residence_region_code is outside the target slot's consulate jurisdiction, or the slot's consulate is not the order's consulate."
  - id: ERR_LEAD_TIME_VIOLATION
    http: 422
    condition: "The target slot starts less than APPOINTMENT_LEAD_TIME_HOURS after the logical clock."
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "The target slot already has booked_count == capacity."
  - id: ERR_RESCHEDULE_CAP_EXCEEDED
    http: 409
    condition: "APPOINTMENT_RESCHEDULE_CAP is reached on a BOOKED reschedule, or NO_SHOW_REBOOK_CAP is reached on a no-show rebook."
  - id: ERR_RESUBMISSION_CAP_EXCEEDED
    http: 409
    condition: "DOCUMENT_RESUBMISSION_CAP is reached on a document slot."
  - id: ERR_DOCUMENT_VALIDITY_INSUFFICIENT
    http: 422
    condition: "A document accepted on review fails its validity window against travel_date or return_date."
  - id: ERR_PHOTO_RETAKE_CAP_EXCEEDED
    http: 409
    condition: "PHOTO_RETAKE_CAP is reached on a photo lineage."
  - id: ERR_FORM_REVISION_STALE
    http: 409
    condition: "A preparation names an AgencyForm that is not ACTIVE, or whose form_code is not the product's form_code."
  - id: ERR_COURIER_ATTEMPT_CAP_EXCEEDED
    http: 409
    condition: "A courier leg has already used 1 + COURIER_REDISPATCH_CAP dispatch attempts."
  - id: ERR_DELIVERY_ATTEMPT_CAP_EXCEEDED
    http: 409
    condition: "A shipment has already used DELIVERY_ATTEMPT_CAP attempts, or is already HELD_FOR_PICKUP."
  - id: ERR_RFE_ROUND_CAP_EXCEEDED
    http: 409
    condition: "An order already carries RFE_ROUND_CAP evidence requests."
  - id: ERR_RFE_DEADLINE_PASSED
    http: 409
    condition: "A response is submitted after RFE.deadline_at."
  - id: ERR_TIER_NOT_AN_UPGRADE
    http: 422
    condition: "The requested service_level is not strictly higher than the current one."
  - id: ERR_UPGRADE_STAGE_CLOSED
    http: 409
    condition: "A tier change is requested at or after workflow_status SUBMITTED."
  - id: ERR_STREAM_ALLOCATION_INVALID
    http: 422
    condition: "A stream_override would push collected_government_cents above government_fee_quoted_cents."
  - id: ERR_APPLICANT_NOT_READY
    http: 409
    condition: "A split names an applicant that is not COMPLETE, does not belong to the order, or would leave the parent with no applicants."
  - id: ERR_SPLIT_PARTITION_MISMATCH
    http: 422
    condition: "transfer_cents_override differs from the computed split transfer."
  - id: ERR_REQUIRED_DOCUMENTS_INCOMPLETE
    http: 409
    condition: "Submission is attempted while some applicant is still PENDING."
  - id: ERR_RUSH_CUTOFF_MISSED
    http: 409
    condition: "A RUSH order is submitted at or after RUSH_CUTOFF_HOUR_UTC, or on a non-business day."
  - id: ERR_TRAVEL_DATE_INFEASIBLE
    http: 409
    condition: "Submission is attempted while feasibility_status is INFEASIBLE and no ComplianceOfficer acknowledgment stands."
  - id: ERR_BALANCE_OUTSTANDING
    http: 402
    condition: "Order.outstanding_cents is below Order.total_quoted_cents at submission."
  - id: ERR_GOVERNMENT_FEE_FORFEIT_UNACKNOWLEDGED
    http: 422
    condition: "Cancellation while the passport is in agency custody omits acknowledge_government_fee_forfeit == true."

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: PlatformAdmin
    description: "Configures products, requirement lines, agency form revisions, consulates, closure calendars and slots; drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /expediting/catalog-items"
      - "POST /expediting/catalog-items/{id}/document-requirements"
      - "POST /expediting/agency-forms"
      - "POST /expediting/agency-forms/{id}/publish"
      - "POST /expediting/consulates"
      - "POST /expediting/consulates/{id}/closures"
      - "POST /expediting/consulates/{id}/slots"
      - "POST /expediting/_clock/set_current_utc"
    shared_operations:
      - "GET /expediting/catalog-items and /expediting/catalog-items/{id}"
      - "GET /expediting/catalog-items/{id}/document-requirements"
      - "GET /expediting/agency-forms, /expediting/agency-forms/{id} and /expediting/agency-forms/{id}/prepared-forms"
      - "GET /expediting/consulates, /expediting/consulates/{id}, /expediting/consulates/{id}/slots and /expediting/slots/{id}"
      - "every order, applicant, document, photo, prepared-form, appointment, courier-leg, custody-event, RFE, shipment, ledger, summary and sla-segment GET"

  - name: CaseManager
    description: "Runs the order: opens it, adds travellers, quotes, collects money, reviews documents, prepares forms, books appointments, submits and splits."
    identity: "opaque"
    exclusive_operations:
      - "POST /expediting/orders"
      - "POST /expediting/orders/{id}/applicants"
      - "POST /expediting/orders/{id}/quote"
      - "POST /expediting/orders/{id}/service-level"
      - "POST /expediting/orders/{id}/submit"
      - "POST /expediting/orders/{id}/split"
      - "POST /expediting/documents/{id}/review"
      - "POST /expediting/photos/{id}/compliance-check"
      - "POST /expediting/applicants/{id}/prepared-forms"
      - "POST /expediting/appointments"
      - "POST /expediting/appointments/{id}/reschedule"
    shared_operations:
      - "POST /expediting/orders/{id}/accept-quote, /payments and /cancel (with Traveler)"
      - "PATCH /expediting/orders/{id}/travel-dates (with Traveler)"
      - "POST /expediting/applicants/{id}/documents, /expediting/documents/{id}/resubmit (with Traveler)"
      - "POST /expediting/applicants/{id}/photos, /expediting/photos/{id}/retake (with Traveler)"
      - "POST /expediting/prepared-forms/{id}/sign (with Traveler)"
      - "POST /expediting/rfes/{id}/respond (with Traveler)"
      - "PATCH /expediting/shipments/{id}/address (with Traveler)"
      - "every configuration and order-side GET"
    note: "Segregation of duties: the X-User-ID that produced the standing quote may not submit the same order."

  - name: CourierOps
    description: "Owns the physical movement of the passport book and the return delivery."
    identity: "opaque"
    exclusive_operations:
      - "POST /expediting/orders/{id}/courier-legs"
      - "POST /expediting/courier-legs/{id}/dispatch"
      - "POST /expediting/courier-legs/{id}/complete"
      - "POST /expediting/orders/{id}/shipments"
      - "POST /expediting/shipments/{id}/delivery-attempt"
      - "POST /expediting/shipments/{id}/pickup"
    shared_operations:
      - "every order, applicant, document, photo, prepared-form, appointment, courier-leg, custody-event, RFE and shipment GET"

  - name: AgencyLiaison
    description: "Stands in for the consular agency: receives the file, records interview outcomes, issues and adjudicates evidence requests, returns the decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /expediting/orders/{id}/tender"
      - "POST /expediting/orders/{id}/rfes"
      - "POST /expediting/rfes/{id}/adjudicate"
      - "POST /expediting/orders/{id}/agency-decision"
      - "POST /expediting/appointments/{id}/outcome"
    shared_operations:
      - "every order, applicant, document, photo, prepared-form, appointment, courier-leg, custody-event, RFE and shipment GET"

  - name: ComplianceOfficer
    description: "Holds the privileged acknowledgment that lets an INFEASIBLE order proceed, and audits the money and SLA reads."
    identity: "opaque"
    exclusive_operations:
      - "POST /expediting/orders/{id}/feasibility-acknowledgment"
    shared_operations:
      - "GET /expediting/orders, /expediting/orders/{id}, /expediting/orders/{id}/feasibility, /summary, /ledger-entries and /sla-segments"
      - "every applicant, document, photo, prepared-form, appointment, courier-leg, custody-event, RFE and shipment GET"

  - name: Traveler
    description: "The applicant acting for themselves. X-User-ID is the id of an Applicant row; the order they act on must carry that applicant."
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations:
      - "POST /expediting/orders/{id}/accept-quote, /payments and /cancel (with CaseManager)"
      - "PATCH /expediting/orders/{id}/travel-dates (with CaseManager)"
      - "POST /expediting/applicants/{id}/documents and /expediting/documents/{id}/resubmit (with CaseManager)"
      - "POST /expediting/applicants/{id}/photos and /expediting/photos/{id}/retake (with CaseManager)"
      - "POST /expediting/prepared-forms/{id}/sign (with CaseManager)"
      - "POST /expediting/rfes/{id}/respond (with CaseManager)"
      - "PATCH /expediting/shipments/{id}/address (with CaseManager)"
      - "every read of their own order and its descendants"
