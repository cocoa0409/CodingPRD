            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "PERSONNEL_COMPETENCY", severity: "CONDITION_LEVEL", description: "No competency records on file", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_id: $.data.id }
            - call: "POST /poct/inspections/${insp_id}/issue"
              payload: { issued_on: "2026-09-01" }
