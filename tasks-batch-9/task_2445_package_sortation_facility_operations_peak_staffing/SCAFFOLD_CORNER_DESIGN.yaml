          assert:
            - "all six calls return HTTP 200 with response_type == object"
            - "all six bodies are byte-identical apart from meta.api_request_id and meta.api_request_timestamp"
            - "each body reports code == SC1, ops_posture == OPEN, flex_pool_available == 20 and flex_pool_reserved == 0"

  # ===================================================================
  # 8. Cross-Cutting Complexity Layers
  # ===================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_chute_version_refused_then_current_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.chute-assignment-create-stale-chute
          - validations.19_ERR_STALE_CHUTE_VERSION
          - endpoints.POST_/sortation/chute-assignments
        distinguishing_aspect: "The chute is the OCC parent for assignment creation: a version captured before another lane was mapped is stale by exactly one, returns 412, and the re-read version then succeeds - and the failed attempt itself does not advance the version."
        test_recipe:
          setup:
            - "Center SC1 with chute C1 (max_concurrent_destinations 2) and lanes L-WEST and L-EAST"
            - "The caller captures C1's version at create time, then a competing request maps L-WEST onto C1, bumping that version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200, max_concurrent_destinations: 2 }
              as: FacilityAdmin
              captures: { chute_id: $.data.id, chute_v_stale: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane_w_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-EAST", region: "EAST", service_class: "GROUND", forecast_hourly_volume: 2000 }
              as: FacilityAdmin
              captures: { lane_e_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute_id}", destination_lane_id: "${lane_w_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v_stale}" }
              as: SortSupervisor
          trigger:
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute_id}", destination_lane_id: "${lane_e_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v_stale}" }
              as: SortSupervisor
            - call: "GET /sortation/sort-chutes/${chute_id}"
              payload: {}
              as: SortSupervisor
              captures: { chute_v_fresh: $.data.version }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute_id}", destination_lane_id: "${lane_e_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v_fresh}" }
              as: SortSupervisor
              captures: { ca_e_id: $.data.id }
          assert:
            - "the stale-version create returns HTTP 412 with data.error_id == ERR_STALE_CHUTE_VERSION"
            - "SortChute.${chute_id}.version after the refused call is still ${chute_v_fresh} == ${chute_v_stale} + 1, so the failure consumed nothing"
            - "the retry with the re-read version returns HTTP 201 and bumps SortChute.${chute_id}.version to ${chute_v_fresh} + 1"
            - "DestinationLane.${lane_e_id}.assigned_capacity_pph == 1200 and DestinationLane.${lane_w_id}.assigned_capacity_pph == 1200"

      - name: stale_center_version_refused_at_approve_and_at_close
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.shift-plan-approve-stale-center
          - concurrency_rules.shift-plan-close-stale-center
          - validations.20_ERR_STALE_CENTER_VERSION
        distinguishing_aspect: "Both center-parented OCC rules are exercised on one plan: the version read before an automation PATCH is stale at approve, and the version read before the approve is stale at close, because approve itself bumps the center."
        test_recipe:
          setup:
            - "Center SC1 (automation 70, flex_pool_total 20) with one chute and a SUBMITTED plan for 2026-08-03 (forecast_volume 4000, core 4, budget 100000)"
            - "The center version is captured, then an automation PATCH bumps it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T05:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers/${center_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 4000, planned_core_headcount: 4, planned_seasonal_headcount: 0, labor_budget_cents: 100000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v_stale: $.data.version }
            - call: "PATCH /sortation/sort-centers/${center_id}"
              payload: { automation_utilization_pct: 71 }
              as: FacilityAdmin
          trigger:
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v_stale}" }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v_approve: $.data.version }
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v_approve}" }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "POST /sortation/shift-plans/${plan_id}/close"
              payload: { expected_center_version: "${center_v_approve}" }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v_close: $.data.version }
            - call: "POST /sortation/shift-plans/${plan_id}/close"
              payload: { expected_center_version: "${center_v_close}" }
              as: OpsManager
              as_user_id: "u_ops_1"
          assert:
            - "the first approve returns HTTP 412 with data.error_id == ERR_STALE_CENTER_VERSION and the plan stays SUBMITTED"
            - "the approve with ${center_v_approve} returns HTTP 200 with data.status == APPROVED and flex_draw_count == 0"
            - "the close reusing ${center_v_approve} returns HTTP 412 with data.error_id == ERR_STALE_CENTER_VERSION, because the successful approve bumped the center to ${center_v_close} == ${center_v_approve} + 1"
            - "the close with ${center_v_close} returns HTTP 200 with data.status == CLOSED and data.actual_labor_cents == 0"
            - "SortCenter.${center_id}.flex_pool_available == 20 and flex_pool_reserved == 0 at the end"

      - name: third_concurrent_jam_hold_freezes_the_center
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.ops_posture_derivation
          - state_machines.SortCenter.RESTRICTED_to_FROZEN
          - entities.SortCenter.fields.open_jam_count
        distinguishing_aspect: "JAM_FREEZE_THRESHOLD is a cumulative count over concurrently held trailers: two simultaneous jams leave the center merely RESTRICTED, the third flips it to FROZEN, and resuming one resets it to RESTRICTED."
        test_recipe:
          setup:
            - "Center SC1 (automation 70) with three inbound doors IN-1..IN-3, three chutes C1..C3 and no destination lanes, so lane pressure can never contribute to the posture"
            - "Three appointments (one per door, manifest 1000 each) each driven to UNLOADING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door1_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-2", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door2_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-3", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door3_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C2", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute2_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C3", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute3_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door1_id}", trailer_code: "T-1", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 1000 }
              as: InboundCoordinator
              captures: { appt1_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt1_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt1_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door2_id}", trailer_code: "T-2", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 1000 }
              as: InboundCoordinator
              captures: { appt2_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt2_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt2_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door3_id}", trailer_code: "T-3", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 1000 }
              as: InboundCoordinator
              captures: { appt3_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt3_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt3_id}/start-unload"
              payload: {}
              as: InboundCoordinator
          trigger:
            - call: "POST /sortation/trailer-appointments/${appt1_id}/jam-hold"
              payload: { chute_id: "${chute1_id}", jam_reason: "BELT_JAM" }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments/${appt2_id}/jam-hold"
              payload: { chute_id: "${chute2_id}", jam_reason: "BELT_JAM" }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments/${appt3_id}/jam-hold"
              payload: { chute_id: "${chute3_id}", jam_reason: "CHUTE_FULL" }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments/${appt3_id}/resume-unload"
              payload: { chute_id: "${chute3_id}" }
              as: SortSupervisor
          assert:
            - "after the first jam-hold SortCenter.${center_id}.open_jam_count == 1 and ops_posture == RESTRICTED"
            - "after the second jam-hold open_jam_count == 2 and ops_posture is STILL RESTRICTED (threshold minus one)"
            - "after the third jam-hold open_jam_count == 3 and ops_posture == FROZEN"
            - "after the resume open_jam_count == 2 and ops_posture is back to RESTRICTED - the threshold resets downward"
            - "each posture change stamps last_posture_change_at == 2026-08-03T06:00:00Z and bumps SortCenter.${center_id}.version"
            - "SortChute.${chute3_id}.status is ACTIVE again with jam_hold_count == 1"

      - name: dispose_and_relabel_reconcile_center_derived_counters
        claim_type: derived_field_reconciliation
        grounds:
          - endpoints.POST_/sortation/package-exceptions/{id}/resolve
          - calculations.package_conservation_invariant
          - entities.SortCenter.fields.disposed_package_count
        distinguishing_aspect: "The two non-reroute resolutions send packages to different derived buckets from the same exception hold: DISPOSE moves 50 into disposed_package_count permanently, RELABEL returns 30 to work-in-process, and the ledger reconciles after each write."
        test_recipe:
          setup:
            - "Center SC1 with inbound door IN-1 and 500 packages inducted into work-in-process (no lanes involved, so both exceptions debit wip directly)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-A", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", priority_class: "STANDARD", manifest_package_count: 500 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
          trigger:
            - call: "POST /sortation/package-exceptions"
              payload: { sort_center_id: "${center_id}", exception_type: "DAMAGED", package_count: 50, trailer_appointment_id: "${appt_id}" }
              as: InboundCoordinator
              captures: { exc_dispose_id: $.data.id }
            - call: "POST /sortation/package-exceptions/${exc_dispose_id}/resolve"
              payload: { resolution: "DISPOSE" }
              as: SortSupervisor
            - call: "POST /sortation/package-exceptions"
              payload: { sort_center_id: "${center_id}", exception_type: "UNLABELED", package_count: 30, trailer_appointment_id: "${appt_id}" }
              as: InboundCoordinator
              captures: { exc_relabel_id: $.data.id }
            - call: "POST /sortation/package-exceptions/${exc_relabel_id}/resolve"
              payload: { resolution: "RELABEL" }
              as: SortSupervisor
          assert:
            - "after the DAMAGED create: wip_package_count == 450, exception_hold_count == 50, and 500 == 450 + 50 + 0 + 0"
            - "after the DISPOSE resolve: exception_hold_count == 0, disposed_package_count == 50, wip stays 450, and 500 == 450 + 0 + 50 + 0"
            - "after the UNLABELED create: wip_package_count == 420, exception_hold_count == 30, and 500 == 420 + 30 + 50 + 0"
            - "after the RELABEL resolve: exception_hold_count == 0 and wip_package_count == 450 again, with disposed_package_count still 50 and 500 == 450 + 0 + 50 + 0"
            - "missort_corrected_count stays 0 throughout, because neither resolution was a REROUTE"
            - "SortCenter.${center_id}.version increments on each of the four writes and ops_posture stays OPEN"

      - name: corner_layer_cascading_side_effects_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / jam_hold_depth4_cascade_to_center_posture
          rationale: "The end-to-end four-level chain with per-level observables and ordering sensitivity is that instance."

      - name: corner_layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / shift_plan_cost_per_package_provisional_vs_final
          rationale: "Both variants and the delta on switch are asserted there; the attrition pair covers the second dual-variant calculation."

  # ===================================================================
  # 9. Consistency Model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: mutation_response_already_reflects_every_derived_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/sortation/outbound-loads/{id}/scan-packages
          - calculations.package_conservation_invariant
        distinguishing_aspect: "consistency_model is immediate, so a single scan request must already return the recomputed cube figures in its own body, and follow-up reads of the center, the lane and the plan agree with it without any second write or delay."
        test_recipe:
          setup:
            - "Center SC1 with chute C1, lane L-WEST assigned to C1, doors IN-1 and OUT-1, 500 packages inducted and an APPROVED plan whose window contains the clock (2026-08-03 06:00-14:00, forecast_volume 4000, core 4, budget 100000)"
            - "An outbound load on L-WEST with trailer_cube_cuft 1000, still in STAGING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "OUT-1", kind: "OUTBOUND" }
              as: FacilityAdmin
              captures: { door_out_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
