            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v_thawed}" }
              as: PoolOperator
              as_user_id: "op-1"
          assert:
            - "after the nine QUARANTINED imports: KegPool.${p1_id}.kegs_total == 10, kegs_available == 1, kegs_servicing == 9, available_pct == 10.00 and posture == RESTRICTED (10.00 >= freeze_threshold_pct 10 and < restrict_threshold_pct 25)"
            - "fa1_v_restricted == 2 == fa1_v: nine cascade recomputes that all re-derived float_posture TIGHT and pending_replenishment_kegs 1 wrote nothing, so the agreement version never moved"
            - "the tenth import takes available_pct to 100 * 1 / 11 == 9.09 (round_half_up, 2 dp), which is below 10, so posture == FROZEN"
            - "that single import cascaded four rows deep: FloatAgreement.${fa1_id}.float_posture == SUSPENDED with pending_replenishment_kegs == 0 and fa1_v_frozen == 3"
            - "the allocate then returns HTTP 409 with error_id == ERR_POOL_FROZEN, not ERR_FLOAT_SUSPENDED: both are true, and priority 13 outranks priority 15"
            - "the allocate wrote nothing: IssuanceOrder.${o1_id}.status is still REQUESTED and the agreement is still at version 3"
            - "the three IN_FLOAT imports reverse the chain: kegs_total == 14, kegs_available == 4, available_pct == 28.57 (100 * 4 / 14 round_half_up) and posture == OPEN"
            - "fa1_v_thawed == 4: exactly ONE of those three imports changed the agreement (the eleventh keg, which restored float_posture TIGHT and pending_replenishment_kegs 1); the twelfth and thirteenth changed nothing on it"
            - "the second allocate returns HTTP 200 with status == ALLOCATED and allocated_keg_count == 1"
            - "the successful allocate immediately re-tightens the pool: kegs_available == 3, kegs_circulating == 1, available_pct == 21.43 (100 * 3 / 14) and posture == RESTRICTED, so the very next order of more than restricted_max_kegs_per_order (2) would be refused with ERR_POOL_RESTRICTED"

      - name: an_uphold_cascades_from_keg_to_money_to_status_to_every_agreement
        claim_type: cascading_side_effects
        excluded_because:
