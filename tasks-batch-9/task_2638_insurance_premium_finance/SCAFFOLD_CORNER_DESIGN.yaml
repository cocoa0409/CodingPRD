          replaces the provisional one, quote_basis flips, six Installment rows appear in SCHEDULED,
          principal_balance_cents and unpaid_finance_charge_cents open at the quote, activated_at is
          stamped from the LOGICAL clock (not wall time), and version bumps exactly once. The probe is
