              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${k_id}", text: "s", is_deviation: false } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { ver1_id: $.data.id, c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v2: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "COUNTERPARTY", clauses: [ { clause_template_id: "${k_id}", text: "redline", is_deviation: true } ], expected_contract_version: "${c_v2}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { ver2_id: $.data.id }
            - call: "GET /contracts/${contract_id}/versions"
              payload: { status: "SUPERSEDED" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { superseded_total: $.data.0.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { cur: $.data.current_version_id }
          assert:
            - "Exactly one ContractVersion (v2=${ver2_id}) has status != SUPERSEDED; v1 (${ver1_id}) is SUPERSEDED"
            - "Contract.${contract_id}.current_version_id == ${ver2_id} (the single non-superseded version)"

      - name: renewal_preserves_contiguous_term_no_gap
        grounds:
          - state_machines.Contract.ACTIVE_to_ACTIVE
          - calculations.expiry_projection
          - entities.Contract.fields.effective_date
          - entities.Contract.fields.expiry_date
        distinguishing_aspect: |
          CONSERVED QUANTITY 2 (term contiguity, a DIFFERENT quantity than version count): each
          renewal sets new_effective_date == prior expiry_date exactly, so total covered duration =
          (renewal_cycle_index + 1) * term_months with zero gap and zero overlap — the renew forward
          action plus its date-rollover compensation leave the timeline gap-free.
        test_recipe:
          setup:
            - "ACTIVE auto_renew contract (effective 2026-06-01, expiry 2027-06-01) with a DUE renewal alert at clock 2027-05-02."
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "INV2Org", risk_appetite_threshold: 200, auto_renew_lead_days: 30 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0, is_mandatory: false }
              as: ClauseLibrarian
              captures: { k_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${k_id}"], default_term_months: 12, auto_renew_default: true }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "INV2", term_months: 12, auto_renew: true }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${k_id}", text: "s", is_deviation: false } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v2: $.data.version }
            - call: "GET /contracts/${contract_id}/approval-workflows"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { wf_id: $.data.0.id }
            - call: "POST /approval-workflows/${wf_id}/steps"
              payload: { approval_workflow_id: "${wf_id}", decision: "APPROVE" }
              as: ContractApprover
              as_user_id: "appr-1"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v3: $.data.version }
            - call: "POST /contracts/${contract_id}/send-for-signature"
              payload: { expected_contract_version: "${c_v3}", signers: [ { signer_party: "INTERNAL", signer_name: "Us" }, { signer_party: "COUNTERPARTY", signer_name: "Them" } ] }
              as: ContractManager
              as_user_id: "mgr-1"
            - call: "GET /contracts/${contract_id}/signature-requests"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { sig0_id: $.data.0.id, sig1_id: $.data.1.id }
            - call: "POST /signature-requests/${sig0_id}/sign"
              payload: {}
              as: Signer
              as_user_id: "signer-int"
            - call: "POST /signature-requests/${sig1_id}/sign"
              payload: {}
              as: Signer
              as_user_id: "signer-cp"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v_active: $.data.version, expiry_before: $.data.expiry_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /contracts/${contract_id}/renew"
              payload: { expected_contract_version: "${c_v_active}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { new_effective: $.data.effective_date, new_expiry: $.data.expiry_date }
          assert:
            - "Contract.${contract_id}.effective_date == '2027-06-01T00:00:00.000Z' (== prior expiry_date, no gap)"
            - "Contract.${contract_id}.expiry_date == '2028-06-01T00:00:00.000Z' (contiguous 12-month roll)"
