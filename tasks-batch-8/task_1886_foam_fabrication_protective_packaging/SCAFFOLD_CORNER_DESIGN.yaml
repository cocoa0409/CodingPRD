            - { call: "POST /api/release-orders", payload: { inventory_program_id: "${prog}", qty: 50, requested_ship_date: "2026-08-11T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { rel2: $.data.id } }
          trigger:
            - { call: "POST /api/inventory-programs/${prog}/suspend", payload: {}, as: SalesEngineer, captures: { prog_status: $.data.status, reserved: $.data.reserved_qty } }
            - { call: "GET /api/release-orders/${rel1}", as: PlantManager, captures: { rel1_status: $.data.status } }
            - { call: "GET /api/release-orders/${rel2}", as: PlantManager, captures: { rel2_status: $.data.status } }
            - { call: "POST /api/inventory-programs/${prog}/resume", payload: {}, as: SalesEngineer, captures: { prog_after: $.data.status } }
          assert:
