      - name: individually_lawful_milestones_collectively_breach_the_debt_commitment
        claim_type: aggregate_validation
        grounds:
          - validations[priority=68]
          - errors[ERR_COMMITMENT_EXCEEDED]
          - calculations.drawdown_split
          - endpoints[POST /ppp/drawdown-milestones/{id}/approve]
        distinguishing_aspect: |
          The first milestone certifies 400000000 and is lawful to the last cent: the split
          puts 100000000 in equity (exactly equity_committed_cents) and 300000000 in debt
          (exactly senior_debt_committed_cents). A second milestone certifying just 1 cent
          has an empty equity bucket, so the whole cent lands in debt and pushes
          senior_debt_drawn_cents to 300000001. The rule is aggregate: nothing about the
          second request is wrong in isolation, and the error must be raised at approve,
          before any drawn total moves.
        test_recipe:
          setup:
            - "A concession with total_project_cost 400000000 == senior_debt_committed 300000000 + equity_committed 100000000 (so creation itself passes the priority-68 ceiling)."
            - "M1 requested and certified at 400000000, then DISBURSED: equity_drawn 100000000, senior_debt_drawn 300000000, cumulative_drawn_pct 1.0000, status CONSTRUCTION, reserve seeded 8000000."
            - "M2 requested for 1 cent against the refreshed concession version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v1: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Whole Works", requested_amount_cents: 400000000, expected_concession_version: "${csn_v1}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 400000000 }
              as: IndependentCertifier
              captures: { m1_equity: $.data.equity_portion_cents, m1_debt: $.data.debt_portion_cents }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "GET /ppp/concessions/${csn_id}"
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v2: $.data.version, drawn_pct: $.data.cumulative_drawn_pct }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M2 Final Cent", requested_amount_cents: 1, expected_concession_version: "${csn_v2}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /ppp/drawdown-milestones/${m2_id}/approve"
              payload: { certified_cost_cents: 1 }
              as: IndependentCertifier
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err} == \"ERR_COMMITMENT_EXCEEDED\""
            - "${m1_equity} == 100000000 and ${m1_debt} == 300000000 — the first milestone sat exactly on both ceilings"
            - "${drawn_pct} == 1.0000"
            - "DrawdownMilestone.${m2_id}.status == \"REQUESTED\" and equity_portion_cents == null and debt_portion_cents == null"
            - "Concession.${csn_id}.equity_drawn_cents == 100000000 and senior_debt_drawn_cents == 300000000"
            - "Concession.${csn_id}.status == \"CONSTRUCTION\" and lifecycle_reserve_balance_cents == 8000000"
            - "Concession.${csn_id}.version == ${csn_v2} — the refused approval bumped nothing"

