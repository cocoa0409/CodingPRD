scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: benefit_waterfall_cap_binds_vs_pool_binds
        grounds:
          - calculations.benefit_waterfall
          - calculations.patient_due
          - entities.FittingOrder.fields.allowance_applied_cents
          - state_machines.FittingOrder.TRIAL_to_PURCHASED
        distinguishing_aspect: |
          The benefit_waterfall on AllowanceBenefit produces different allowance_applied_cents
          for identical device gross (600000) depending on whether the per-device cap binds first
          (applied=250000, fresh pool) or the depleted pool binds first (applied=100000, consumed=400000) —
          this is the allowance-pool entity domain.
        test_recipe:
          setup:
            - "Clock at 2026-03-01. Patient with an ACTIVE AllowanceBenefit total=500000, per_device_cap=250000, coinsurance=0.20, period_end 2026-12-31."
            - "DeviceModel list_price=300000, min_severity=MODERATE, restock=20000, warranty_months=24, firmware 4.2.0."
            - "FINALIZED evaluation ptag=60 (SEVERE candidate). A binaural (ear_count=2) order in TRIAL."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Cap Binds", date_of_birth: "1960-05-05" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-CAP-1", name: "CapModel", list_price_cents: 300000, restock_fee_cents: 20000, min_severity: "MODERATE", firmware_version: "4.2.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/allowance-benefits"
              payload: { patient_id: "${pat_id}", plan_name: "Gold-2026", total_allowance_cents: 500000, per_device_cap_cents: 250000, coinsurance_pct: 0.20, period_end: "2026-12-31" }
              as: BillingClerk
              captures: { ben_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 60 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 2, allowance_benefit_id: "${ben_id}" }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
          trigger:
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
              captures: { applied: $.data.allowance_applied_cents, due: $.data.patient_due_cents }
          assert:
            - "FittingOrder.${order_id}.gross_price_cents == 600000"
            - "FittingOrder.${order_id}.allowance_applied_cents == 250000"
            - "FittingOrder.${order_id}.patient_due_cents == 420000"

      - name: warranty_settlement_defect_vs_loss
        grounds:
          - calculations.warranty_settlement
          - entities.WarrantyClaim.fields.deductible_cents
          - entities.WarrantyClaim.fields.clinic_cost_cents
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          warranty_settlement on WarrantyClaim (a different entity domain than allowance) yields
          deductible=0/clinic_cost=150000 for DEFECT but deductible=40000/clinic_cost=60000 for a
          LOSS of identical assessed_value=100000 — the patient-vs-clinic split diverges by claim_type.
        test_recipe:
          setup:
            - "A WARRANTY_ACTIVE order exists (clock advanced past trial window, activate-warranty done)."
            - "Two SUBMITTED warranty claims on that order: one DEFECT assessed 150000, one LOSS assessed 100000."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Warranty Pt", date_of_birth: "1955-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-WAR-1", name: "WarModel", list_price_cents: 200000, restock_fee_cents: 15000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/orders/${order_id}/activate-warranty"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/orders/${order_id}/warranty-claims"
              payload: { claim_type: "DEFECT", incident_date: "2026-04-15", assessed_value_cents: 150000 }
              as: BillingClerk
              captures: { claim_defect_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/warranty-claims"
              payload: { claim_type: "LOSS", incident_date: "2026-04-20", assessed_value_cents: 100000 }
              as: BillingClerk
              captures: { claim_loss_id: $.data.id }
          trigger:
            - call: "POST /clinic/warranty-claims/${claim_defect_id}/approve"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/warranty-claims/${claim_loss_id}/approve"
              payload: {}
              as: BillingClerk
          assert:
            - "WarrantyClaim.${claim_defect_id}.deductible_cents == 0"
            - "WarrantyClaim.${claim_defect_id}.clinic_cost_cents == 150000"
            - "WarrantyClaim.${claim_loss_id}.deductible_cents == 40000"
            - "WarrantyClaim.${claim_loss_id}.clinic_cost_cents == 60000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes {(a),(b),(c)}
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: benefit_waterfall_mode_a_nested_min
        grounds:
          - calculations.benefit_waterfall
          - entities.AllowanceBenefit.fields.per_device_cap_cents
          - entities.AllowanceBenefit.fields.total_allowance_cents
          - entities.AllowanceBenefit.fields.consumed_allowance_cents
        distinguishing_aspect: |
          MODE (a): allowance_applied = min(min(gross, per_device_cap), total - consumed) — three
          inputs in nested min with state-dependent consumed; pool depletion makes the inner term
          bind (applied=100000 not the cap 250000).
        test_recipe:
          setup:
            - "Clock 2026-03-01. Patient with ACTIVE benefit total=500000, per_device_cap=250000, coinsurance=0.20, period_end 2026-12-31, already consumed 400000 by a prior PURCHASED order."
            - "A binaural order on a 300000 model in TRIAL referencing the same benefit."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Pool Binds", date_of_birth: "1958-02-02" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-POOL-1", name: "PoolModel", list_price_cents: 300000, restock_fee_cents: 20000, min_severity: "MODERATE", firmware_version: "4.2.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/allowance-benefits"
              payload: { patient_id: "${pat_id}", plan_name: "Gold-2026", total_allowance_cents: 500000, per_device_cap_cents: 250000, coinsurance_pct: 0.20, period_end: "2026-12-31" }
              as: BillingClerk
              captures: { ben_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 60 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1, allowance_benefit_id: "${ben_id}" }
              as: Audiologist
              captures: { prior_order_id: $.data.id }
            - call: "POST /clinic/orders/${prior_order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${prior_order_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 2, allowance_benefit_id: "${ben_id}" }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
          trigger:
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
              captures: { applied: $.data.allowance_applied_cents }
          assert:
            - "FittingOrder.${prior_order_id}.allowance_applied_cents == 250000"
            - "FittingOrder.${order_id}.gross_price_cents == 600000"
            - "FittingOrder.${order_id}.allowance_applied_cents == 100000"

      - name: patient_due_mode_b_single_rounding_on_post_allowance
        grounds:
          - calculations.patient_due
          - calculations.benefit_waterfall
          - entities.FittingOrder.fields.patient_due_cents
          - entities.AllowanceBenefit.fields.coinsurance_pct
        distinguishing_aspect: |
          MODE (b): nested rounding order is pinned — coinsurance is rounded ONCE on the
          post-allowance remainder (round_half_up(33333*0.15)=5000), not by rounding intermediate
          per-component values; post=33333, coin=5000, due=38333.
        test_recipe:
          setup:
            - "Clock 2026-03-01. Patient with ACTIVE benefit total=500000, per_device_cap=166667, coinsurance=0.15, period_end 2026-12-31, consumed=0."
            - "Monaural order on a 200000 model in TRIAL; gross=200000, allowance capped at 166667, post-allowance=33333."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Round Pt", date_of_birth: "1959-03-03" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-RND-1", name: "RoundModel", list_price_cents: 200000, restock_fee_cents: 10000, min_severity: "MILD", firmware_version: "2.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/allowance-benefits"
              payload: { patient_id: "${pat_id}", plan_name: "Silver-2026", total_allowance_cents: 500000, per_device_cap_cents: 166667, coinsurance_pct: 0.15, period_end: "2026-12-31" }
              as: BillingClerk
              captures: { ben_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 35 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1, allowance_benefit_id: "${ben_id}" }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
          trigger:
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
              captures: { due: $.data.patient_due_cents }
          assert:
            - "FittingOrder.${order_id}.allowance_applied_cents == 166667"
            - "FittingOrder.${order_id}.patient_due_cents == 38333"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: warranty_claim_deny_appeal_approve_cycle
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_DENIED
          - state_machines.WarrantyClaim.DENIED_to_APPEALED
          - state_machines.WarrantyClaim.APPEALED_to_APPROVED
        distinguishing_aspect: |
          WarrantyClaim is cyclic: SUBMITTED->DENIED->APPEALED->APPROVED revisits the APPROVE leg
          after a reject loop — a cycle on the WarrantyClaim entity (distinct from FittingOrder branch).
        test_recipe:
          setup:
            - "A WARRANTY_ACTIVE order with a SUBMITTED DEFECT claim assessed 80000."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Appeal Pt", date_of_birth: "1950-06-06" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-APL-1", name: "AppealModel", list_price_cents: 150000, restock_fee_cents: 10000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 35 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/orders/${order_id}/activate-warranty"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/orders/${order_id}/warranty-claims"
              payload: { claim_type: "DEFECT", incident_date: "2026-04-10", assessed_value_cents: 80000 }
              as: BillingClerk
              captures: { claim_id: $.data.id }
            - call: "POST /clinic/warranty-claims/${claim_id}/deny"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /clinic/warranty-claims/${claim_id}/appeal"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinic/warranty-claims/${claim_id}/approve"
              payload: {}
              as: BillingClerk
              captures: { st: $.data.status }
          assert:
            - "WarrantyClaim.${claim_id}.status == APPROVED"
            - "WarrantyClaim.${claim_id}.deductible_cents == 0"
            - "WarrantyClaim.${claim_id}.clinic_cost_cents == 80000"

      - name: fitting_order_trial_branch_purchase_vs_return
        grounds:
          - state_machines.FittingOrder.TRIAL_to_PURCHASED
          - state_machines.FittingOrder.TRIAL_to_RETURNED
          - entities.FittingOrder.fields.refund_cents
        distinguishing_aspect: |
          FittingOrder branches from TRIAL into PURCHASED (posts gross+allowance ledger) vs RETURNED
          (posts a refund/restock-fee ledger) with divergent side-effect sets — branching on a
          different entity than WarrantyClaim's cycle.
        test_recipe:
          setup:
            - "Clock 2026-03-01. Two monaural self-pay orders (model 300000, restock 15000) each in TRIAL for the same patient."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Branch Pt", date_of_birth: "1957-07-07" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-BR-1", name: "BranchModel", list_price_cents: 300000, restock_fee_cents: 15000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 50 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_buy_id: $.data.id }
            - call: "POST /clinic/orders/${order_buy_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_ret_id: $.data.id }
            - call: "POST /clinic/orders/${order_ret_id}/start-trial"
              payload: {}
              as: Audiologist
          trigger:
            - call: "POST /clinic/orders/${order_buy_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/orders/${order_ret_id}/return"
              payload: {}
              as: BillingClerk
          assert:
            - "FittingOrder.${order_buy_id}.status == PURCHASED"
            - "FittingOrder.${order_buy_id}.patient_due_cents == 300000"
            - "FittingOrder.${order_ret_id}.status == RETURNED"
            - "FittingOrder.${order_ret_id}.refund_cents == -15000"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_releases_allowance_reactivates_benefit_depth3
        grounds:
          - state_machines.FittingOrder.PURCHASED_to_RETURNED
          - entities.AllowanceBenefit.fields.consumed_allowance_cents
          - entities.AllowanceBenefit.fields.status
        distinguishing_aspect: |
          Depth-3 chain from RETURN: (1) order.status -> RETURNED, (2) that drop triggers recompute of
          AllowanceBenefit.consumed_allowance_cents, (3) the lowered consumed (< total) flips the benefit
          status EXHAUSTED -> ACTIVE. Each hop is caused by the previous, not by the return directly.
        test_recipe:
          setup:
            - "Clock 2026-03-01. Patient with benefit total=400000, per_device_cap=400000, coinsurance=0, period_end 2026-12-31."
            - "A monaural 400000 order PURCHASED with allowance, exhausting the benefit (consumed=400000 -> EXHAUSTED)."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Release Pt", date_of_birth: "1956-08-08" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-REL-1", name: "ReleaseModel", list_price_cents: 400000, restock_fee_cents: 20000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/allowance-benefits"
              payload: { patient_id: "${pat_id}", plan_name: "Exh-2026", total_allowance_cents: 400000, per_device_cap_cents: 400000, coinsurance_pct: 0, period_end: "2026-12-31" }
              as: BillingClerk
              captures: { ben_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 35 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1, allowance_benefit_id: "${ben_id}" }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /clinic/orders/${order_id}/return"
              payload: {}
              as: BillingClerk
            - call: "GET /clinic/allowance-benefits/${ben_id}"
              payload: {}
              as: BillingClerk
              captures: { consumed: $.data.consumed_allowance_cents, ben_status: $.data.status }
          assert:
            - "FittingOrder.${order_id}.status == RETURNED"
            - "AllowanceBenefit.${ben_id}.consumed_allowance_cents == 0"
            - "AllowanceBenefit.${ben_id}.status == ACTIVE"

      - name: ship_cycle_bubbles_subscription_totals_depth2
        grounds:
          - state_machines.SupplyCycle.SCHEDULED_to_SHIPPED
          - entities.SupplySubscription.fields.cycles_fulfilled
          - entities.SupplySubscription.fields.lifetime_billed_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (SHIP cycle): (1) cycle.status -> SHIPPED with billed_cents,
          (2) that bubbles up to recompute SupplySubscription.cycles_fulfilled and lifetime_billed_cents.
        test_recipe:
          setup:
            - "Clock 2026-03-01. A PURCHASED order, an ACTIVE subscription unit_price=5000 cadence=30, first cycle SCHEDULED due 2026-03-31."
            - "Clock advanced to 2026-04-01 so cycle 1 is due."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Supply Pt", date_of_birth: "1954-09-09" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
