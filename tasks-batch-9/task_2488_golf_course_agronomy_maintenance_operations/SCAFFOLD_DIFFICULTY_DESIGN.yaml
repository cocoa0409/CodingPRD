          assert:
            - "at creation MaintenanceWindow.${win_id}.status == SCHEDULED and deferral_count == 0 and crew_hours == 4.00 and version == 1"
            - "after the first HEAVY_RAIN: MaintenanceWindow.${win_id}.status == DEFERRED, deferral_count == 1, version == 2"
            - "after the first HEAVY_RAIN: Course.${course_id}.play_posture == CART_PATH_ONLY and frost_delay_minutes == 0"
            - "WeatherEvent.${rain1_id}.deferred_window_count == 1"
            - "after the reschedule: MaintenanceWindow.${win_id}.status == SCHEDULED, window_start == 2026-08-02T05:00:00Z, crew_hours == 4.00, deferral_count still 1, version == 3"
            - "after the second HEAVY_RAIN: MaintenanceWindow.${win_id}.status == DEFERRED, deferral_count == 2, version == 4"
            - "WeatherEvent.${rain2_id}.deferred_window_count == 1"
            - "the second reschedule -> 409 ERR_DEFERRAL_LIMIT_REACHED and MaintenanceWindow.${win_id} is unchanged at status DEFERRED, deferral_count 2, version 4"

      - name: play_event_readiness_dimension_recovers_from_failed
        grounds:
          - state_machines.PlayEvent.PENDING_to_FAILED
          - state_machines.PlayEvent.FAILED_to_CERTIFIED
          - calculations.tournament_readiness_index
          - entities.PlayEvent.fields.readiness_status
          - entities.TurfArea.fields.current_moisture_pct
        distinguishing_aspect: |
          PlayEvent is the third entity and the third shape: a re-enterable
          non-terminal failure. FAILED is not terminal, the same endpoint is
          the trigger for both the failing and the recovering edge, and the
          recovery is driven by new readings rather than by any request field,
