              as: BrokerPlacementLead
              captures: { ms_e: $.data.id }
            - call: "POST /market-submissions/${ms_a}/quotes"
              payload: { offered_line_pct: 60.0000, quoted_rate_pct: 8.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
