      - name: invalid_state_beats_duplicate_priority_rank_on_reinstate
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.KitchenLease.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Reinstating a lease that is ACTIVE (not SUSPENDED) while another ACTIVE lease shares its
          priority_rank returns ERR_INVALID_STATE (priority 5, state), not ERR_DUPLICATE_PRIORITY_RANK
          (priority 6, business_constraint) — a state vs business_constraint pair distinct from
          instance 1's referential vs fiscal pair.
        test_recipe:
