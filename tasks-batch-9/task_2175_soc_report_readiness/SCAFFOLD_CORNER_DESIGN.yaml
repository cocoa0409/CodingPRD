        claim_type: violation_to_error
        grounds: ["validations[priority=40]", "errors[ERR_SUBSERVICE_NOT_INCLUSIVE]", "roles.SubserviceContact"]
        distinguishing_aspect: "SubserviceContact is entity_backed:SubserviceOrganization, so X-User-ID must be the id of an INCLUSIVE organization; a contact whose organization is CARVE_OUT is rejected with 403 ERR_SUBSERVICE_NOT_INCLUSIVE, and so is an X-User-ID matching no organization at all."
        test_recipe:
          setup:
            - "Engagement in SCOPING with SubserviceOrganization HostCo still in its default CARVE_OUT method."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Contact Check", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
