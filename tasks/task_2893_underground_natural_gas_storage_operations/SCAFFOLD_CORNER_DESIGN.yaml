            - "GET /storage-contracts/${c1}/imbalance-ledger-entries as s1 returns total_count == 1 (one DAILY_IMBALANCE row from the ticket confirm), so the refusal to s2 hid a real row rather than an empty collection"

      - name: shipper_list_reads_are_narrowed_to_the_owner_and_a_filter_cannot_widen_them
        claim_type: peer_roles
        grounds:
          - segregation_of_duties_rules
          - validations.priority_6_ERR_CONTRACT_NOT_OWNED
          - response_envelope.pagination_fields
          - response_envelope.list_ordering
        distinguishing_aspect: |
          Ownership on LIST endpoints is a silent narrowing, not a 403 — and the narrowing has to be
          applied BEFORE total_count is computed and before limit/offset, otherwise a shipper can infer
          the size of its competitors' books from an inflated total_count. The sharp corner is the
          explicit filter: SOUTHLINE passing shipper_id=NORTHLINE must receive an empty list with
          total_count 0, not NORTHLINE's rows and not a 403, because the filter intersects the
          narrowing instead of replacing it. The same coordinator read returns all four contracts.
