              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /filings/${f_comp_id}/pay-fee"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/accept"
              payload: {}
              as: Clerk
            - call: "POST /cases/${case_id}/open"
              payload: {}
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "POST /judgments"
              payload: { case_id: "${case_id}", judgment_type: "TRIAL", prevailing_party_id: "${p_pl_id}", principal_cents: 0, interest_rate_bps: 0, expected_case_version: "${case_v}" }
              as: Judge
              captures: { j_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Clerk
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /appeals"
              payload: { case_id: "${case_id}", judgment_id: "${j_id}", appellant_party_id: "${p_df_id}", filed_on: "2026-04-10T00:00:00.000Z", expected_case_version: "${case_v2}" }
              as: Attorney
