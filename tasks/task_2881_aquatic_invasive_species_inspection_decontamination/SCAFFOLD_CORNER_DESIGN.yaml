# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Probe)
# Task 2881 - Aquatic Invasive Species Inspection & Decontamination
#
# Walked from references/claim-extraction-guide.md row by row against
# SCAFFOLD.yaml SS1.1-1.7. Every `section:` and `claim_type:` value comes from
# that guide; no category was invented. Every corner already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml is emitted as an `excluded_because:` stub that
# cites the covering instance by its exact §1.8 `name`.
#
# §1.5 audit outcome: every corner below is reachable from an empty database by
# composing declared endpoints, and no new /_<name> test-driving endpoint was
# needed beyond the pre-existing POST /_clock/set_current_utc. The walk did
# force ONE general business endpoint at ladder step 2 - PATCH
# /water-bodies/{id} - because ERR_WATER_BODY_CYCLE was otherwise unreachable
# once a row existed; it is declared in §1.5, added to ProgramAdmin's
# exclusive_operations in §1.7, and validations 6, 8 and 10 were widened to
# cover it. Four further SCAFFOLD.yaml ambiguities the walk surfaced were fixed
# there rather than papered over here: (1) the PLANNED -> OPEN transition now
# names ERR_INVALID_STATION_STATE for the no-hours-row precondition,
# (2) ERR_DECON_NOT_TREATED is now scoped to {ORDERED, RETREAT_REQUIRED} so it
# can never collide with ERR_DECON_ALREADY_TERMINAL on the same call,
# (3) validation 32 now measures presented-seal age to the record's arrived_at,
# the same basis reciprocity_seal_decision pins, instead of to the current
# logical time, and (4) §1.2 now declares the EXPIRED -> ACTIVE transition that
# POST /inspectors/{id}/status already claimed in its §1.5 side effects, so the
# administrative renewal path is no longer an undeclared transition.
#
# Recurring setup skeleton (referred to as "the standard station" below):
#   clock 2026-08-01T00:00:00Z -> POST /water-bodies -> POST /inspection-stations
#   -> POST /inspection-stations/{id}/hours [2026-07-01T00:00:00Z,
#   2026-10-01T00:00:00Z) -> POST /inspection-stations/{id}/status OPEN
#   -> insp_a (8 passed hours -> LEVEL_1 / ACTIVE)
#   -> insp_b (decon_endorsement true, 40 passed hours -> DECON_CERTIFIED)
#   -> insp_c (40 passed hours, no endorsement -> LEVEL_2)
#   -> POST /watercraft (capture version) -> clock 2026-08-05T09:00:00Z
#   -> POST /inspection-records -> POST /inspection-records/{id}/screening
# Every numeric literal in an `assert:` was computed by executing the pinned
# §1.3 formula against its declared constants.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: creation_water_body_persists_inputs_and_zero_counters
        claim_type: creation
        grounds:
          - entities.WaterBody
          - endpoints.POST_/water-bodies
          - response_envelope.success
        distinguishing_aspect: "POST /water-bodies with every declared input returns 201 with data.name, state_code, water_body_class, risk_tier and infestation_status echoed exactly, and both computed counters at 0 - creation never invents a detection."
        test_recipe:
          setup:
            - "Empty database, logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "data.name == Flathead Lake, data.state_code == MT, data.water_body_class == LAKE, data.risk_tier == HIGH, data.infestation_status == CLEAN"
            - "data.detection_count == 0 and data.live_detection_count == 0"
            - "data.downstream_of_water_body_id == null"
            - "data carries id, created_at, updated_at and version (common_fields true)"
            - "meta.api_request_id and meta.api_request_timestamp are present and response_type == object"

      - name: retrieval_station_returns_stored_inventory_and_derived_fields
        claim_type: retrieval
        grounds:
          - entities.InspectionStation
          - endpoints.GET_/inspection-stations/{id}
        distinguishing_aspect: "GET /inspection-stations/{id} returns the same seal-inventory and ledger values the create response reported: seal_stock_count seeded from seal_stock_initial_count only once status leaves PLANNED, and every fee counter still 0."
        test_recipe:
          setup:
            - "Standard station 'Polson Access' with seal_stock_initial_count 3, decon_bay_count 2, hot_water_capable true, moved PLANNED -> OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 2, hot_water_capable: true, seal_stock_initial_count: 3 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
          trigger:
            - call: "GET /inspection-stations/${st_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the trigger returns 200"
            - "data.status == OPEN and data.station_type == WATERBODY_ACCESS and data.water_body_id == ${wb_id}"
            - "data.corridor_route_code == null"
            - "data.seal_stock_initial_count == 3 and data.seal_stock_count == 3"
            - "data.seals_in_circulation_count == 0 and data.seals_retired_count == 0"
            - "data.certified_inspector_count == 0 and data.decon_service_available == false"
            - "data.collected_fees_cents == 0, data.refunded_fees_cents == 0, data.campaign_allocated_cents == 0"

      - name: listing_water_bodies_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/water-bodies
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three water bodies stored, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true; limit 2 offset 2 returns 1 row with total_count 3 and has_more false."
        test_recipe:
          setup:
            - "Three water bodies created in a fixed order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_1: $.data.id }
            - call: "POST /water-bodies"
              payload: { name: "Hauser Reservoir", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "MODERATE" }
              as: ProgramAdmin
              captures: { wb_2: $.data.id }
            - call: "POST /water-bodies"
              payload: { name: "Jefferson River", state_code: "MT", water_body_class: "RIVER", risk_tier: "LOW" }
              as: ProgramAdmin
              captures: { wb_3: $.data.id }
          trigger:
            - call: "GET /water-bodies"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
          assert:
            - "the trigger returns 200 with response_type == array and exactly 2 elements in data"
            - "total_count == 3 and has_more == true"
            - "GET /water-bodies with limit 2 and offset 2 returns 1 element, total_count 3 and has_more false"
            - "GET /water-bodies with risk_tier LOW returns exactly the row ${wb_3}, total_count 1, has_more false"

      - name: not_found_water_body_retrieval_returns_err_water_body_not_found
        claim_type: not_found
        grounds:
          - validations.priority_7
          - errors.ERR_WATER_BODY_NOT_FOUND
          - endpoints.GET_/water-bodies/{id}
        distinguishing_aspect: "A syntactically valid but unknown water-body id in the path returns 404 ERR_WATER_BODY_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database except the clock pin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /water-bodies/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 404 with error_id ERR_WATER_BODY_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: not_found_watercraft_retrieval_returns_err_watercraft_not_found
        claim_type: not_found
        grounds:
          - validations.priority_7
          - errors.ERR_WATERCRAFT_NOT_FOUND
          - endpoints.GET_/watercraft/{id}
        distinguishing_aspect: "Same shape on a different entity: an unknown vessel id returns ERR_WATERCRAFT_NOT_FOUND (404), proving the 404 code is entity-specific rather than one generic not-found."
        test_recipe:
          setup:
            - "One registered vessel exists, so the store is non-empty and the miss is genuinely a lookup miss."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /watercraft"
              payload: { registration_number: "MT-1001", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 18 }
              as: ProgramAdmin
              captures: { wc_id: $.data.id }
          trigger:
            - call: "GET /watercraft/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 404 with error_id ERR_WATERCRAFT_NOT_FOUND"
            - "GET /watercraft/${wc_id} still returns 200, so only the unknown id fails"

      - name: required_fields_watercraft_creation_without_hull_length_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_6
          - errors.ERR_INVALID_REQUEST
          - entities.Watercraft.fields.hull_length_ft
        distinguishing_aspect: "hull_length_ft has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST; the omission is not silently defaulted to 0."
        test_recipe:
          setup:
            - "Empty registry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /watercraft"
              payload: { registration_number: "MT-1002", home_state_code: "MT", vessel_type: "OPEN_HULL" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 400 with error_id ERR_INVALID_REQUEST"
            - "no Watercraft row with registration_number MT-1002 exists afterwards"
            - "control: the identical payload plus hull_length_ft 18 returns 201"

      - name: defaults_station_optional_fields_default_when_omitted
        claim_type: defaults
        grounds:
          - entities.InspectionStation.fields.mandatory_inspection
          - entities.InspectionStation.fields.decon_bay_count
          - entities.InspectionStation.fields.hot_water_capable
          - entities.InspectionStation.fields.seal_stock_initial_count
          - entities.WaterBody.fields.risk_tier
          - endpoints.POST_/inspection-stations
        distinguishing_aspect: "Omitting every optional station input yields mandatory_inspection false, decon_bay_count 0, hot_water_capable false, seal_stock_initial_count 0 and status PLANNED; omitting risk_tier and infestation_status on a water body yields MODERATE and CLEAN."
        test_recipe:
          setup:
            - "A water body created with only its three required inputs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Canyon Ferry", state_code: "MT", water_body_class: "RESERVOIR" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id, wb_tier: $.data.risk_tier }
          trigger:
            - call: "POST /inspection-stations"
              payload: { name: "Canyon Ferry Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}" }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
          assert:
            - "the water body created in setup has risk_tier == MODERATE and infestation_status == CLEAN"
            - "the trigger returns 201 with data.mandatory_inspection == false"
            - "data.decon_bay_count == 0, data.hot_water_capable == false, data.seal_stock_initial_count == 0"
            - "data.status == PLANNED and data.corridor_route_code == null"
            - "data.seal_stock_count == 0 and data.decon_service_available == false"

      - name: computed_fields_record_scores_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.InspectionRecord.fields.risk_score
          - entities.InspectionRecord.fields.risk_band
          - entities.InspectionRecord.fields.total_fee_cents
          - endpoints.POST_/inspection-records
          - validations.priority_6
        distinguishing_aspect: "POST /inspection-records carrying risk_score 99, risk_band EXTREME and total_fee_cents 1 returns 201 with risk_score 0, risk_band LOW and total_fee_cents 0 - unknown and computed keys are ignored, never honored and never rejected."
        test_recipe:
          setup:
            - "Standard station OPEN, inspector insp_a ACTIVE LEVEL_1, vessel MT-1001, clock 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 2, hot_water_capable: true, seal_stock_initial_count: 3 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-1001", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 18 }
              as: ProgramAdmin
              captures: { wc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_id}", arrived_at: "2026-08-05T09:00:00Z", risk_score: 99, risk_band: "EXTREME", total_fee_cents: 1, inspector_id: "someone-else" }
              as: Inspector
              as_user_id: "${insp_a}"
          assert:
            - "the trigger returns 201 (the unknown/computed keys are ignored, not rejected)"
            - "data.risk_score == 0 and data.advisory_risk_score == 0 and data.risk_band == LOW"
            - "data.total_fee_cents == 0, data.inspection_fee_cents == 0, data.decon_fee_cents == 0, data.surcharge_cents == 0"
            - "data.inspector_id == ${insp_a}, taken from X-User-ID and not from the body"
            - "data.inspection_status == INITIATED and data.enforcement_status == NONE"

      - name: system_fields_watercraft_identity_and_version_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Watercraft
          - endpoints.POST_/watercraft
          - response_envelope.success
        distinguishing_aspect: "A client-supplied id, created_at, updated_at and version on POST /watercraft are ignored: the returned id differs from the supplied one and the row is retrievable only under the server-minted id."
        test_recipe:
          setup:
            - "Empty registry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /watercraft"
              payload: { registration_number: "MT-1003", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 20, id: "00000000-0000-4000-8000-000000000009", version: 77, created_at: "1999-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { wc_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "data.id != 00000000-0000-4000-8000-000000000009"
            - "data.version is the row's initial version, not 77"
            - "data.created_at is the logical clock instant 2026-08-01T00:00:00Z, not 1999-01-01T00:00:00Z"
            - "GET /watercraft/00000000-0000-4000-8000-000000000009 returns 404 ERR_WATERCRAFT_NOT_FOUND while GET /watercraft/${wc_id} returns 200"

      - name: type_constraints_bad_enum_and_out_of_range_number_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_6
          - errors.ERR_INVALID_REQUEST
          - entities.Watercraft.fields.vessel_type
          - entities.Watercraft.fields.hull_length_ft
        distinguishing_aspect: "vessel_type SAILBOAT (not in the declared enum) and hull_length_ft 0 (violating > 0) each return 400 ERR_INVALID_REQUEST on their own, so the check is per-field and not merely a required-field presence test."
        test_recipe:
          setup:
            - "Empty registry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /watercraft"
              payload: { registration_number: "MT-1004", home_state_code: "MT", vessel_type: "SAILBOAT", hull_length_ft: 18 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 400 with error_id ERR_INVALID_REQUEST"
            - "control: vessel_type OPEN_HULL with hull_length_ft 0 also returns 400 ERR_INVALID_REQUEST"
            - "control: vessel_type OPEN_HULL with hull_length_ft 18 returns 201"
            - "no Watercraft row with registration_number MT-1004 exists after the two rejections"

      - name: type_constraints_hours_window_ordering_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_6
          - errors.ERR_INVALID_REQUEST
          - entities.StationHours.fields.closes_at
          - endpoints.POST_/inspection-stations/{id}/hours
        distinguishing_aspect: "closes_at strictly greater than opens_at is a declared field constraint, so an inverted window is a 400 ERR_INVALID_REQUEST from priority 6 - not the 409 ERR_HOURS_WINDOW_OVERLAP that a same-station collision would raise."
        test_recipe:
          setup:
            - "A PLANNED station with no hours rows yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}" }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 400 with error_id ERR_INVALID_REQUEST"
            - "control: opens_at == closes_at == 2026-07-01T00:00:00Z also returns 400 ERR_INVALID_REQUEST (the constraint is strict)"
            - "GET /inspection-stations/${st_id}/hours returns an empty array with total_count 0"

      - name: immutability_training_record_exposes_no_version_and_no_update_path
        claim_type: immutability
        grounds:
          - entities.TrainingRecord
          - endpoints.POST_/inspectors/{id}/training-records
          - endpoints.GET_/inspectors/{id}/training-records
        distinguishing_aspect: "TrainingRecord is declared common_fields false: its create and list responses carry no version field, and §1.5 declares no PUT/PATCH/DELETE for it, so a logged module can only be superseded by logging another module."
        test_recipe:
          setup:
            - "Standard station with inspector insp_a enrolled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}" }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
          trigger:
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true, completed_at: "2026-07-15T12:00:00Z" }
              as: TrainingOfficer
              captures: { tr_id: $.data.id }
          assert:
            - "the trigger returns 201 with data.hours == 8, data.passed == true, data.completed_at == 2026-07-15T12:00:00Z"
            - "the response data has no version key"
            - "GET /inspectors/${insp_a}/training-records returns exactly one element, also without a version key"
            - "Inspector.${insp_a}.training_hours_total == 8.00 and certification_level == LEVEL_1 (the derived read path is the only way the row is mutated downstream)"

      - name: parent_relationships_training_record_for_unknown_inspector_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_7
          - errors.ERR_INSPECTOR_NOT_FOUND
          - entities.TrainingRecord.parent
          - endpoints.POST_/inspectors/{id}/training-records
        distinguishing_aspect: "TrainingRecord declares parent Inspector and is addressed only under /inspectors/{id}/training-records, so an unknown parent id in the path is a 404 ERR_INSPECTOR_NOT_FOUND before any body validation runs - an orphan training row is unrepresentable."
        test_recipe:
          setup:
            - "One real inspector exists so the failure is a genuine parent miss."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
