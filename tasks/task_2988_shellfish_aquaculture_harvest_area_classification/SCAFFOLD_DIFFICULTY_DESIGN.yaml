              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-17T09:00:00Z", fecal_coliform_mpn: 5, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-18T09:00:00Z", fecal_coliform_mpn: 5, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
