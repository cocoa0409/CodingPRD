            - "At 2026-10-31: closed_final_escalation_ids contains ${esc}"
            - "EngineeringEscalation.${esc}.status == CLOSED_FINAL"

      - name: stale_authorized_rma_auto_cancelled_after_30_days
        claim_type: valid_transition
        grounds: [state_machines.ServiceRMA.AUTHORIZED_to_CANCELLED]
        distinguishing_aspect: "run_daily_close auto-cancels an AUTHORIZED RMA whose authorized_at is older than 30 calendar days; exactly 30 days old is not yet stale."
        test_recipe:
