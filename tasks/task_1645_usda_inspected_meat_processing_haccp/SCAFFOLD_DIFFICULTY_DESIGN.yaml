  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: ccp_critical_limit_inclusive_boundary
        grounds:
          - entities.CriticalControlPoint.fields.critical_limit_max_f
          - entities.CCPObservation.fields.within_limit
          - calculations.plant_compliance_score
        distinguishing_aspect: |
          Metric: temperature in deg F at the CCP critical limit. The limit is
          INCLUSIVE: 40.0 == max passes, 40.1 violates and spawns a Deviation. The
          second rule-6 instance sits on a different metric (recovery percentage) and a
          different endpoint (recall complete).
        test_recipe:
          setup:
            - "Plant with EFFECTIVE plan (CCP max 40.0), inspector ON_PREMISE, OPEN day on 2026-08-01"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-K", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager, captures: { ccp_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
          trigger:
            - { call: "POST /ccps/${ccp_id}/observations", payload: { observed_value_f: 40.0 }, as: QATech, as_user_id: "qa-tech-1", captures: { wl_ok: $.data.within_limit, dev_ok: $.data.deviation_id } }
            - { call: "POST /ccps/${ccp_id}/observations", payload: { observed_value_f: 40.1 }, as: QATech, as_user_id: "qa-tech-1", captures: { wl_bad: $.data.within_limit, dev_bad: $.data.deviation_id } }
            - { call: "GET /deviations?ccp_id=${ccp_id}", as: QAManager, captures: { dev0_sev: "$.data[0].severity", dev0_status: "$.data[0].status" } }
          assert:
            - "observation at exactly 40.0: within_limit == true and deviation_id == null (inclusive <= boundary)"
            - "observation at 40.1: within_limit == false and deviation_id != null (Deviation spawned)"
            - "GET /deviations?ccp_id=${ccp_id} returns exactly 1 row: severity == MAJOR, status == OPEN (only the 40.1 reading deviated)"

      - name: recall_recovery_threshold_99_5_boundary
        grounds:
          - calculations.recall_recovery
          - entities.RecallExercise.fields.recovery_pct
