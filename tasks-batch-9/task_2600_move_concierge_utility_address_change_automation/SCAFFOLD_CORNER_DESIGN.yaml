  - section: errors
    instances:

      - name: error_shape_missing_auth_header_or_unknown_role_returns_401_unauthenticated
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_UNAUTHENTICATED]"
          - response_envelope.error_shape
          - roles
        distinguishing_aspect: |
          The one error that must be decided before any routing or lookup work: it fires for a
          missing header, for a header naming a role outside the declared eight, and for a path id
          that does not exist, proving the auth gate outranks the 404 lookup rather than being
          checked after it.
        test_recipe:
          setup:
            - "One stored move, so a 404 and a 401 can be told apart on the same path."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
          trigger:
            - call: "GET /moves/${mv_id}"
              payload: {}
              as: NO_HEADERS_AT_ALL
              captures: { e1: $.data.error_id }
            - call: "GET /moves/${mv_id}"
              payload: {}
              as: ROLE_HEADER_ONLY_NO_USER_ID
              captures: { e2: $.data.error_id }
            - call: "GET /moves/${mv_id}"
              payload: {}
              as: RelocationAuditor
              captures: { e3: $.data.error_id }
            - call: "GET /moves/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RelocationAuditor
              captures: { e4: $.data.error_id }
            - call: "POST /moves/${mv_id}/provider-mapping"
              payload: { utility_types: ["ELECTRIC"] }
              as: RelocationAuditor
              captures: { e5: $.data.error_id }
          assert:
            - "trigger call 1 (no X-User-Role and no X-User-ID) returns HTTP 401 with ${e1} == ERR_UNAUTHENTICATED"
            - "trigger call 2 (X-User-Role present, X-User-ID absent) returns HTTP 401 with ${e2} == ERR_UNAUTHENTICATED"
            - "trigger call 3 (X-User-Role: RelocationAuditor, a role outside the declared eight) returns HTTP 401 with ${e3} == ERR_UNAUTHENTICATED"
            - "trigger call 4 pairs the unknown role with a nonexistent move id and still returns HTTP 401 with ${e4} == ERR_UNAUTHENTICATED, not 404: authentication is decided before the lookup"
            - "trigger call 5 returns HTTP 401 with ${e5} == ERR_UNAUTHENTICATED rather than 403 ERR_FORBIDDEN_ROLE: an unrecognised role is unauthenticated, never merely unauthorized"
            - "every one of these error envelopes carries data.error_id and data.message plus meta.api_request_id, and none of them creates a UtilityOrder"

      - name: error_code_specificity_six_unknown_path_ids_return_six_distinct_not_found_codes
        claim_type: error_code_specificity
        grounds:
          - "errors[ERR_RESIDENT_NOT_FOUND]"
          - "errors[ERR_VERIFICATION_NOT_FOUND]"
          - "errors[ERR_HANDOFF_NOT_FOUND]"
          - "errors[ERR_FILING_NOT_FOUND]"
          - "errors[ERR_PLACEMENT_NOT_FOUND]"
          - "errors[ERR_CONSENT_NOT_FOUND]"
        distinguishing_aspect: |
          Six sibling 404s that a single generic NOT_FOUND would collapse: the catalog names one per
          entity, so the same syntactically valid but unknown uuid must produce a different error_id
          on each of the six paths. Nothing else in the suite pins the per-entity code, and the
          uniform id makes any shared not-found helper that forgets to specialise visible.
        test_recipe:
          setup:
            - "An empty database; no ids are created, so every path id below is unknown."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /residents/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { e_res: $.data.error_id }
            - call: "GET /identity-verifications/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { e_idv: $.data.error_id }
            - call: "GET /credit-check-handoffs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { e_hoff: $.data.error_id }
            - call: "GET /address-change-filings/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { e_fil: $.data.error_id }
            - call: "GET /referral-placements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { e_pl: $.data.error_id }
            - call: "GET /consent-records/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { e_cs: $.data.error_id }
          assert:
            - "all six calls return HTTP 404"
            - "${e_res} == ERR_RESIDENT_NOT_FOUND and ${e_idv} == ERR_VERIFICATION_NOT_FOUND"
            - "${e_hoff} == ERR_HANDOFF_NOT_FOUND and ${e_fil} == ERR_FILING_NOT_FOUND"
            - "${e_pl} == ERR_PLACEMENT_NOT_FOUND and ${e_cs} == ERR_CONSENT_NOT_FOUND"
            - "the six error_id values are pairwise distinct, so no shared not-found helper flattens them into one code"
            - "each response carries a data.message naming the entity kind and no data payload fields beyond error_id and message"

      - name: error_reuse_one_code_covers_three_placement_operations_and_is_state_only
        claim_type: error_precedence
        grounds:
          - "errors[ERR_PLACEMENT_NOT_CONVERTIBLE]"
          - state_machines.ReferralPlacement.ACCEPTED_to_CONVERTED
          - "endpoints[POST /referral-placements/{id}/conversions]"
          - "endpoints[POST /referral-placements/{id}/settlement]"
        distinguishing_aspect: |
          One error id deliberately shared by three different operations on one entity, and the
          proof that it is a state complaint and nothing else: the conversion refused from PLACED
          succeeds byte-for-byte once acceptance has run, with the same amount, the same actor and
          the same payload. Settling before conversion raises the same code, so the suite must not
          bind this id to a single endpoint.
        test_recipe:
          setup:
            - "A PLACED insurance placement on a verified move, not yet accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
