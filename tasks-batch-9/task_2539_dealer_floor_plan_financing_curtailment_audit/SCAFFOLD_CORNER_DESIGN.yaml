      - name: the_mso_requirement_applies_only_to_new_inventory
        claim_type: conditional_validation
        grounds:
          - validations[priority=80]
          - errors.ERR_MSO_REQUIRED_FOR_NEW_UNIT
          - entities.InventoryUnit.fields.title_document_type
        distinguishing_aspect: "The document rule is conditional on inventory_class: a NEW unit presented with a TITLE is rejected 422 ERR_MSO_REQUIRED_FOR_NEW_UNIT, while the byte-identical request with inventory_class USED is accepted, because only new inventory needs a manufacturer statement of origin."
        test_recipe:
