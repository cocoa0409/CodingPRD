              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B15", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
          trigger:
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B15", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }
              as: CodeOfficer
              captures: { err: "$.data.error_id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B15", scheduled_start: "2026-03-02T11:00:00Z", scheduled_end: "2026-03-02T13:00:00Z" }
              as: CodeOfficer
              captures: { adj_id: "$.data.id" }
          assert:
            - "overlapping 10:00-12:00 attempt -> response.status 409, error_id == ERR_INSPECTOR_DOUBLE_BOOKED"
            - "adjacent 11:00-13:00 attempt -> Inspection.${adj_id}.status == SCHEDULED"

      - name: abatement_property_buffer_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_ABATEMENT_WINDOW_CONFLICT]
          - entities.AbatementOrder.fields.scheduled_start
        distinguishing_aspect: |
          Resource = Property, closed interval plus a 24h buffer: a second abatement window starting
          only 18h after the first ends (non-overlapping but inside the buffer) is rejected —
          stricter than the inspector's half-open adjacency rule.
        test_recipe:
          setup:
            - "Standard ABF-01 cure 5 base 20000. OWNER/VACANT property; violation escalated at 2026-03-06; abatement order 1 window 2026-03-10T08:00-16:00."
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "ABF-01", category: "SANITATION", description: "hazmat", severity_weight: 7, cure_period_days: 5, base_fine_cents: 20000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner P", party_type: "OWNER", email: "p@x.com", contact_phone: "555-0115", mailing_address: "16 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-OV2", street_address: "20 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B16", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["ABF-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/properties/${prop_id}/abatement-orders"
              payload: { scheduled_start: "2026-03-10T08:00:00Z", scheduled_end: "2026-03-10T16:00:00Z", estimated_cost_cents: 40000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /registry/properties/${prop_id}/abatement-orders"
              payload: { scheduled_start: "2026-03-11T10:00:00Z", scheduled_end: "2026-03-11T14:00:00Z", estimated_cost_cents: 30000 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "error_id == ERR_ABATEMENT_WINDOW_CONFLICT"

  # =====================================================================
  # Rule 9 — compensating-action invariants over different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fine_ledger_net_zero
        grounds:
          - state_machines.Fine.ASSESSED_to_PAID
          - calculations.property_outstanding_balance
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = a fine's net contribution to Property.outstanding_balance_cents:
          FINE_ASSESSED(+20000) + FINE_ACCRUAL(+25000) + FINE_PAYMENT(-45000) == 0, so after paying
          the fine the balance returns to the registration fee 10000 with zero drift.
        test_recipe:
          setup:
            - "Standard INV-01 base 20000, cure 5. OWNER/VACANT property (fee 10000). Violation escalated+fined at 2026-03-11 (balance 30000)."
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "INV-01", category: "SECURING", description: "board up", severity_weight: 5, cure_period_days: 5, base_fine_cents: 20000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner Q", party_type: "OWNER", email: "q@x.com", contact_phone: "555-0116", mailing_address: "17 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-INV1", street_address: "21 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B17", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["INV-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${viol_id}/fines"
              payload: {}
              as: CodeOfficer
              captures: { fine_id: "$.data.id" }
          trigger:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/fines/${fine_id}/transition"
              payload: { action: "PAY" }
              as: Registrant
              as_user_id: "${reg_id}"
            - call: "GET /registry/properties/${prop_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Fine.${fine_id}.status == PAID"
            - "Fine.${fine_id}.finalized_amount_cents == 45000"
            - "Property.${prop_id}.outstanding_balance_cents == 10000"

      - name: lien_principal_pool_conservation
        grounds:
          - state_machines.Fine.ASSESSED_to_LIENED
          - state_machines.Lien.RECORDED_to_SATISFIED
          - calculations.property_lien_balance
          - entities.Property.fields.lien_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Property.lien_balance_cents (sum of RECORDED-lien principals):
          record-lien adds principal 30000, paying the lien removes it, returning lien_balance to 0 —
          a different conserved quantity than the fine's outstanding-balance ledger net.
        test_recipe:
          setup:
            - "Standard INV-02 base 30000, cure 5. OWNER/VACANT property; violation escalated+fined at 2026-03-06; fine recorded as a Lien (principal 30000)."
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "INV-02", category: "STRUCTURAL", description: "collapse risk", severity_weight: 9, cure_period_days: 5, base_fine_cents: 30000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner R", party_type: "OWNER", email: "r@x.com", contact_phone: "555-0117", mailing_address: "18 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-INV2", street_address: "22 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "B18", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["INV-02"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${viol_id}/fines"
              payload: {}
              as: CodeOfficer
              captures: { fine_id: "$.data.id" }
            - call: "POST /registry/fines/${fine_id}/record-lien"
              payload: {}
              as: ProgramAdmin
            - call: "GET /registry/liens?source_fine_id=${fine_id}"
              payload: {}
              as: ProgramAdmin
              captures: { lien_id: "$.data[0].id" }
          trigger:
            - call: "GET /registry/properties/${prop_id}"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registry/liens/${lien_id}/pay"
              payload: {}
              as: Registrant
              as_user_id: "${reg_id}"
            - call: "GET /registry/properties/${prop_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "after record-lien (first GET) Property.${prop_id}.lien_balance_cents == 30000"
            - "Lien.${lien_id}.status == SATISFIED after pay"
            - "after lien pay (second GET) Property.${prop_id}.lien_balance_cents == 0"
