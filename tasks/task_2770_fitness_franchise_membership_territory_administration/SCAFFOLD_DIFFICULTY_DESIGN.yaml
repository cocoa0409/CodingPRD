  - rule_id: cross_entity_state_dependency
    instances:
      - name: transfer_approval_gated_on_receiving_club_compliance_state
        entity_pair: [TransferRequest, Club]
        grounds:
          - state_machines.TransferRequest.REQUESTED_to_APPROVED
          - state_machines.Club.OPEN_to_SUSPENDED
          - state_machines.Club.SUSPENDED_to_OPEN
          - validations[priority=10]
          - calculations.transfer_fee
          - errors[ERR_CLUB_NOT_OPERATIONAL]
        distinguishing_aspect: |
          The TransferRequest REQUESTED -> APPROVED edge is legal on the request's own dimension - the
          request is REQUESTED, the caller is the receiving club, the agreement is CURRENT - yet it is
          refused because a DIFFERENT entity, the receiving Club, drifted to SUSPENDED / NON_COMPLIANT
          after the request was filed. The gate is re-evaluated at decision time, not captured at
          creation time: the identical decide call succeeds the moment the club is restored to
          OPEN / WATCH by a remediation waiver, and only then is transfer_fee_cents pinned. An
          implementation that snapshots the destination club's posture when the request is created
          approves the transfer into a non-compliant facility.
        test_recipe:
          setup:
            - "Franchisee f1 owns OPEN club c1 in CA; franchisee f2 owns OPEN club c2 in CA, on a distant territory so no encroachment arises."
            - "One PUBLISHED CORE12 template at 4500 cents and one member at c1 with an ACTIVE, CURRENT agreement whose effective_monthly_dues_cents is 4500 (no promotion, no corporate account, no multi-club access)."
            - "c1 filed a cross-franchise transfer request to c2 while c2 was still OPEN and COMPLIANT; the request stands REQUESTED with transfer_fee_cents null."
