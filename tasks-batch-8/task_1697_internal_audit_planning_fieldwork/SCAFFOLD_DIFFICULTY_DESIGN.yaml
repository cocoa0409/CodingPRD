  - rule_id: resource_temporal_overlap
    instances:
      - name: auditor_assignment_half_open_overlap
        grounds:
          - errors[ERR_ASSIGNMENT_OVERLAP]
          - entities.EngagementAssignment.fields.start_date
          - validations[priority=9]
        distinguishing_aspect: |
          Resource = Auditor, interval semantics = half-open [start, end):
          [02-01, 03-01) vs [02-15, 03-15) collides (02-01 < 03-15 and
          02-15 < 03-01), while the touching window [03-01, 04-01) is allowed
          because end == start does not intersect under half-open semantics.
        test_recipe:
          setup:
            - "Two engagements (different entities to keep the cooling rule out of scope) in PLANNED; staff1 holds an ACTIVE assignment on eng1 covering [2026-02-01, 2026-03-01)"
          setup_api_calls:
