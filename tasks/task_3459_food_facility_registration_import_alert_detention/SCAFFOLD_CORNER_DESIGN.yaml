              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OWNERSHIP_VIOLATION (http 403)"
            - "PriorNotice.${pn_id}.status remains CONFIRMED (no supersession happened)"

      - name: entry_reviewer_cannot_release_detained_entry_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - endpoints.POST_/registry/entries/{id}/release
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Role-by-state release gate: the release endpoint accepts EntryReviewer for PENDING entries but a DETAINED entry may be released only by a ComplianceOfficer — an EntryReviewer gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Default clock; facility, importer, entry auto-detained by a FIRM alert."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Guadalajara Agave", facility_kind: "FOREIGN", country_code: "MX", ufi: "UFI-MX-2304" }
