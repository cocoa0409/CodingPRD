              as: PlantManager
          assert:
            - "HTTP 422 and data.error_id == ERR_WINDOW_ORDER_INVALID"
            - "Furnace.${f}.campaign_count == 0 and version == 1"
            - "the same body with window_end_at 2026-08-11T00:00:01Z returns 201 with status PLANNED"
            - "after that success Furnace.${f}.campaign_count == 1 and version == 2"

