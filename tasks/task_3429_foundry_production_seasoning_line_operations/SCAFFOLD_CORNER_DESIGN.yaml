              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
