      - name: finding_evidence_mass_conserved_across_link_add_and_delete
        grounds:
          - calculations.evidence_strength
          - calculations.theme_evidence_weight
          - entities.Finding.fields.admissible_link_count
          - entities.EvidenceLink.fields.contribution
        distinguishing_aspect: |
          A different conserved quantity: the finding's weighted evidence mass, the sum of per-link
          contributions. Deleting the link that was just added must return evidence_strength to the exact
          value it held before, which is only true if the strength is recomputed from the surviving links
          rather than adjusted by subtracting the departing link's rounded contribution - the subtractive
          shortcut lands on 0.64 while the correct recomputation lands back on 0.65.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "BEHAVIORAL_LONGITUDINAL request approved, so approved_method == DIARY_STUDY with METHOD_MULT 1.10"
            - "Three consented participants completed; participant 1 has both a RECORDING and a TRANSCRIPT artifact, participants 2 and 3 have one RECORDING each; fielding then closed so the study sits in ANALYSIS"
            - "DRAFT finding with three links: OBSERVED_BEHAVIOR (0.94), SELF_REPORT (0.55) and DIRECT_QUOTE (1.10), a mass of 2.59"
