  # ===========================================================================
  # Section: complexity_layers
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_installment_create_stale_pool_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[installment-create-stale-pool]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Installment create carries expected_pool_version: with the captured current version it succeeds (pool.version bumps); replaying the same captured version on a second create fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["campaign with pool open-accrual 700000; pool version captured after open-accrual"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "GET /api/campaigns/${camp_id}/pools", as: POOL_ACCOUNTANT, captures: { pool_id: "$.data[0].id" } }
            - { call: "POST /api/pools/${pool_id}/open-accrual", payload: { estimated_pool_value_cents: 700000 }, as: POOL_ACCOUNTANT, captures: { pool_v: $.data.version } }
          trigger:
            - { call: "POST /api/pools/${pool_id}/installments", payload: { pct_of_estimated: 25, expected_pool_version: "${pool_v}" }, as: POOL_ACCOUNTANT, captures: { inst_id: $.data.id, inst_target: $.data.target_amount_cents } }
            - { call: "POST /api/pools/${pool_id}/installments", payload: { pct_of_estimated: 25, expected_pool_version: "${pool_v}" }, as: POOL_ACCOUNTANT, captures: { err: $.data.error_id } }
          assert:
            - "first create succeeds: inst_target == 175000 (25% of 700000)"
            - "err == ERR_STALE_VERSION (412) — the captured version went stale when the first create bumped PaymentPool.version"

