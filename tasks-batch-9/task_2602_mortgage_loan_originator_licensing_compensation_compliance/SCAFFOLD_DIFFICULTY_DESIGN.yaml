  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stale_license_version_outranks_sponsorship_period_overlap
        grounds:
          - validations[priority=10]
          - validations[priority=29]
          - concurrency_rules[sponsorship-create-stale-license]
        distinguishing_aspect: |
          Categories `state` (priority 10) versus `business_temporal` (priority 29). One request
          violates both: it carries the licence version captured before S1 existed AND a
          back-dated effective_at that lands before S1's own effective_at. The OCC check runs
          first, so the response must be ERR_STALE_LICENSE_VERSION (412) and never
          ERR_SPONSORSHIP_PERIOD_OVERLAP (409). The control call proves the temporal rule really
          was violated too.
        test_recipe:
          setup:
            - "Originator NMLS 1100009 with a PENDING CA licence; lic_v0 is captured from the
               creation response, before any sponsorship exists."
            - "Sponsorship S1 for INST-ALPHA effective 2026-08-01T00:00:00Z, created with lic_v0,
               which bumps the licence version and makes lic_v0 stale."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100009", legal_name: "Rhea Okafor", hire_date: "2024-11-01T00:00:00Z", employment_status: "EMPLOYED" }
