# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
#
# Breadth probe: every testable claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already cover. Sections and
# claim_type values are taken from references/claim-extraction-guide.md.
# The logical clock starts at 2026-08-01T00:00:00Z; every monetary literal below
# was computed by executing the pinned §1.3 formulas.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: insured_creation_initializes_capacity_fields
        claim_type: creation
        grounds:
          - endpoints[POST /dno/insureds]
          - entities.Insured.fields.available_side_c_capacity_usd
          - entities.Insured.fields.capacity_posture
          - response_envelope.success
        distinguishing_aspect: |
          Creation is not a bare insert: the endpoint's side effect seeds the whole capacity ledger
          (aggregate 0, available == entity_capacity_cap_usd, posture OPEN, open_policy_count 0) and
          control_status defaults to INDEPENDENT even though the enum has three members. A handler
          that leaves the computed capacity fields at their declared 0 default fails here.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
          assert:
            - "the response is 201 with response_type == \"object\", a meta block carrying api_request_id and api_request_timestamp, and data.id populated"
            - "data.legal_name == \"Vantiq Bio Inc\", data.sector_code == \"BIOTECH\", data.exchange_listing == \"LISTED\", data.market_cap_usd == 1800000000, data.fiscal_year_end == \"12-31\", data.entity_capacity_cap_usd == 25000000"
            - "data.control_status == \"INDEPENDENT\" and data.change_of_control_date == null — both were omitted from the payload"
            - "data.aggregate_bound_side_c_usd == 0, data.available_side_c_capacity_usd == 25000000, data.capacity_posture == \"OPEN\", data.open_policy_count == 0"
            - "data.version == 1 and data.created_at == data.updated_at == \"2026-08-01T00:00:00Z\""
      - name: get_submission_after_score_returns_stored_band_and_counters
        claim_type: retrieval
        grounds:
          - endpoints[GET /dno/submissions/{id}]
          - entities.Submission.fields.risk_band
          - entities.Submission.fields.scored_at
        distinguishing_aspect: |
          The scoring result must be persisted on the Submission, not recomputed per read: a GET
          issued by a role that never scored returns the identical risk_score, band, variant and
          scored_at instant, and no version bump happens on a read.
        test_recipe:
          setup:
            - "One Vantiq Bio Inc insured with one 2025 disclosure package and one securities class action, and one submission scored under the INDICATIVE variant at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
          trigger:
            - call: "GET /dno/submissions/${sub_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the response is 200 with data.id == ${sub_id}, data.insured_id == ${insured_id} and data.status == \"SCORED\""
            - "data.risk_score == 85.80, data.risk_band == \"ELEVATED\", data.score_variant == \"INDICATIVE\", data.litigation_units == 20.00, data.disclosure_packages_considered == 1"
            - "data.scored_at == \"2026-08-01T00:00:00Z\" and data.expires_at == \"2026-10-30T00:00:00Z\""
            - "data.version == 2 (create then one scoring write) and a second identical GET returns version 2 again — reads never bump the version"
      - name: submission_defaults_erp_days_and_ninety_day_expiry
        claim_type: defaults
        grounds:
          - entities.Submission.fields.erp_days
          - entities.Submission.fields.expires_at
          - endpoints[POST /dno/submissions]
        distinguishing_aspect: |
          erp_days is the only optional field on submission intake and its default 90 is load-bearing
          downstream (it becomes the policy ERP and the circumstance-report reporting window), while
          expires_at is derived from created_at rather than supplied. Omitting erp_days must not
          produce null or 0.
        test_recipe:
          setup:
            - "One Vantiq Bio Inc insured; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
          trigger:
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z" }
              as: Underwriter
          assert:
            - "the response is 201 with data.erp_days == 90 — the declared default, not null and not 0"
            - "data.status == \"DRAFT\", data.risk_score == null, data.risk_band == null, data.score_variant == null, data.scored_at == null, data.litigation_units == 0, data.disclosure_packages_considered == 0"
            - "data.expires_at == \"2026-10-30T00:00:00Z\" == created_at 2026-08-01T00:00:00Z plus 90 days"
            - "data.version == 1"
      - name: litigation_event_weight_units_written_by_scoring_run
        claim_type: computed_fields
        grounds:
          - entities.LitigationEvent.fields.weight_units
          - entities.DisclosurePackage.fields.financial_subscore
          - entities.DisclosurePackage.fields.governance_subscore
          - calculations.governance_risk_assessment
        distinguishing_aspect: |
          weight_units and the two disclosure subscores are computed fields written by the scoring
          run, not at creation: they read 0 immediately after POST and are back-filled only for the
          events the variant's input set consumes. The INDICATIVE variant consumes securities and
          regulatory matters only, so a recent MERGER_OBJECTION stays at 0.00 — proving the write is
          filtered rather than applied to every sibling row.
        test_recipe:
          setup:
            - "One Vantiq Bio Inc insured (BIOTECH, sector multiplier 1.30) with one 2025 disclosure package filed 2026-03-01."
            - "Two litigation events: a SECURITIES_CLASS_ACTION filed 2024-06-15 (777 days before the clock, inside the 1095-day full-recency window) and a MERGER_OBJECTION filed 2025-01-10."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "MERGER_OBJECTION", filed_date: "2025-01-10T00:00:00Z", resolved_date: "2025-06-01T00:00:00Z", indemnity_paid_usd: 0, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
            - call: "GET /dno/insureds/${insured_id}/litigation-events"
              payload: { limit: 10, offset: 0 }
              as: Underwriter
            - call: "GET /dno/insureds/${insured_id}/disclosure-packages"
              payload: { limit: 10, offset: 0 }
              as: Underwriter
          assert:
            - "immediately after each POST /dno/insureds/${insured_id}/litigation-events the created row reads weight_units == 0"
            - "trigger call 1 returns 200 with data.risk_score == 85.80 == round((24.00 + 22.00 + 20.00) x 1.30, 2), data.risk_band == \"ELEVATED\", data.litigation_units == 20.00"
            - "trigger call 2 shows the SECURITIES_CLASS_ACTION row with weight_units == 20.00 and the MERGER_OBJECTION row with weight_units == 0.00 — the INDICATIVE input set never touched it"
            - "trigger call 3 shows the 2025 package with financial_subscore == 24.00 (18 restatement + 6 for one material weakness) and governance_subscore == 22.00 (14 independence + 8 combined chair)"
            - "total_count == 2 on trigger call 2 and total_count == 1 on trigger call 3"
      - name: policy_bind_assigns_system_fields_from_quote
        claim_type: system_fields
        grounds:
          - endpoints[POST /dno/quotes/{id}/accept]
          - entities.Policy.fields.policy_number
          - entities.Policy.fields.premium_due_date
          - entities.CoveragePart.fields.limit_usd
        distinguishing_aspect: |
          The bind endpoint takes an empty body, so every Policy field is system- or computed-sourced:
          the policy number is the monotonic DO-NNNNNN counter, the period/retro/ERP terms come from
          the Submission, the limits and retention from the accepted Quote, and premium_due_date is
          the bind instant plus 30 days. The three coverage parts are seeded with asymmetric
          retentions (0 on Side A, the policy retention on Side B and Side C).
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
            - "One ELEVATED Vantiq Bio Inc submission quoted at 10,000,000 limit / 250,000 retention / 5,000,000 Side C, with the mandatory CONDUCT exclusion agreed at premium_impact_pct 0.00."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
              captures: { sub_v: "$.data.version" }
            - call: "POST /dno/submissions/${sub_id}/quotes"
              payload: { expected_submission_version: "${sub_v}", offered_limit_usd: 10000000, offered_retention_usd: 250000, offered_side_c_sublimit_usd: 5000000, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
              captures: { quote_id: "$.data.id" }
            - call: "GET /dno/quotes/${quote_id}/exclusion-terms"
              payload: {}
              as: Underwriter
              captures: { conduct_term_id: "$.data[0].id" }
            - call: "POST /dno/exclusion-terms/${conduct_term_id}/resolve"
              payload: { resolution: "AGREE" }
              as: RiskManager
              as_user_id: "${insured_id}"
          trigger:
            - call: "POST /dno/quotes/${quote_id}/accept"
              payload: {}
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { policy_id: "$.data.id" }
            - call: "GET /dno/policies/${policy_id}/coverage-parts"
              payload: { limit: 10, offset: 0 }
              as: Underwriter
          assert:
            - "trigger call 1 returns 201 with data.policy_number == \"DO-000001\" — the first bind of the counter, zero-padded to six digits"
            - "data.submission_id == ${sub_id}, data.insured_id == ${insured_id}, data.quote_id == ${quote_id}: all three links are system-sourced from the accept path, not from the empty body"
            - "data.period_start == \"2026-09-01T00:00:00Z\", data.period_end == \"2027-09-01T00:00:00Z\", data.retroactive_date == \"2024-01-01T00:00:00Z\", data.erp_days == 90 — copied from the submission"
            - "data.shared_aggregate_limit_usd == 10000000, data.retention_usd == 250000, data.aggregate_remaining_usd == 10000000, data.total_eroded_usd == 0, data.program_target_limit_usd == 20000000"
            - "data.gross_premium_usd == 236468.57 (the quote's gross, unchanged because the only AGREED term carries premium_impact_pct 0.00) and data.premium_due_date == \"2026-08-31T00:00:00Z\" == the bind instant plus 30 days"
            - "data.coverage_status == \"INCEPTED\", data.premium_status == \"INVOICED\", data.tower_sealed == false, data.tower_posture == \"INCOMPLETE\", data.placed_limit_usd == 0, data.open_claim_count == 0, data.return_premium_usd == 0, data.runoff_premium_usd == 0, data.cancelled_reason == null, data.version == 1"
            - "trigger call 2 returns total_count == 3: SIDE_A limit_usd 10000000 with retention_usd 0, SIDE_B limit_usd 10000000 with retention_usd 250000, SIDE_C limit_usd 5000000 with retention_usd 250000, each ACTIVE with eroded_usd 0 and remaining_limit_usd equal to its limit"
      - name: unknown_policy_id_returns_policy_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_POLICY_NOT_FOUND]
          - validations[priority=3]
          - endpoints[GET /dno/policies/{id}]
        distinguishing_aspect: |
          Path-resource existence is priority 3, above every body and state check, and each resource
          reports its own not-found code. The database is non-empty (one insured exists) so the 404 is
          about the specific missing Policy rather than an empty table, and the same unknown id on a
          claim-scoped path must answer ERR_CLAIM_NOT_FOUND rather than the policy code.
        test_recipe:
          setup:
            - "One Vantiq Bio Inc insured exists; no Policy and no Claim has ever been created."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
          trigger:
            - call: "GET /dno/policies/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
            - call: "GET /dno/claims/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
          assert:
            - "trigger call 1 returns 404 with response_type == \"error\" and data.error_id == \"ERR_POLICY_NOT_FOUND\""
            - "trigger call 2 returns 404 with data.error_id == \"ERR_CLAIM_NOT_FOUND\" — the same unknown id resolves against the path's own resource type"
            - "both responses carry the meta block and no data fields other than error_id and message"
      - name: layer_listing_filters_by_policy_with_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /dno/layers]
          - response_envelope.pagination_fields
          - entities.Layer.fields.policy_id
        distinguishing_aspect: |
          The filtered-list form is the reverse-reachability route for Layer.policy_id, so the filter
          and the pagination envelope have to compose: limit 1 over a two-layer tower reports
          total_count 2 with has_more true, and the second page reports has_more false. total_count
          counts the filtered set, not the table.
        test_recipe:
          setup:
            - "One bound Vantiq Bio Inc policy (10,000,000 limit, program target 20,000,000) carrying two layers: a primary band 0 / 10,000,000 at participation 1.00 and an excess band 10,000,000 / 10,000,000 at participation 1.00, both FOLLOWING_FORM."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
              captures: { sub_v: "$.data.version" }
            - call: "POST /dno/submissions/${sub_id}/quotes"
              payload: { expected_submission_version: "${sub_v}", offered_limit_usd: 10000000, offered_retention_usd: 250000, offered_side_c_sublimit_usd: 5000000, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
              captures: { quote_id: "$.data.id" }
            - call: "GET /dno/quotes/${quote_id}/exclusion-terms"
              payload: {}
              as: Underwriter
              captures: { conduct_term_id: "$.data[0].id" }
            - call: "POST /dno/exclusion-terms/${conduct_term_id}/resolve"
              payload: { resolution: "AGREE" }
              as: RiskManager
              as_user_id: "${insured_id}"
            - call: "POST /dno/quotes/${quote_id}/accept"
              payload: {}
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /dno/policies/${policy_id}/layers"
              payload: { carrier_name: "Meridian Primary", attachment_point_usd: 0, limit_usd: 10000000, participation_pct: 1.00, form_type: "FOLLOWING_FORM" }
              as: Underwriter
              captures: { primary_layer_id: "$.data.id" }
            - call: "POST /dno/policies/${policy_id}/layers"
              payload: { carrier_name: "Northgate Excess", attachment_point_usd: 10000000, limit_usd: 10000000, participation_pct: 1.00, form_type: "FOLLOWING_FORM", underlying_layer_id: "${primary_layer_id}" }
              as: Underwriter
          trigger:
            - call: "GET /dno/layers"
              payload: { policy_id: "${policy_id}", limit: 1, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /dno/layers"
              payload: { policy_id: "${policy_id}", limit: 1, offset: 1 }
              as: ComplianceOfficer
            - call: "GET /dno/layers"
              payload: { policy_id: "${policy_id}", status: "EXHAUSTED", limit: 10, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "trigger call 1 returns 200 with response_type == \"array\", total_count == 2, limit == 1, offset == 0, has_more == true and exactly one element, whose policy_id == ${policy_id}"
            - "trigger call 2 returns total_count == 2, offset == 1, has_more == false and exactly one element, and the two pages together contain both layer ids exactly once"
            - "trigger call 3 returns total_count == 0, has_more == false and an empty data array — both layers are ATTACHED, so the status filter narrows the set rather than being ignored"
            - "GET /dno/layers/${primary_layer_id} returns is_primary == true while the excess layer returns is_primary == false and underlying_layer_id == ${primary_layer_id}"
      - name: litigation_event_carries_no_version_and_no_update_path
        claim_type: immutability
        grounds:
          - entities.LitigationEvent.common_fields
          - endpoints[POST /dno/insureds/{id}/litigation-events]
          - endpoints[GET /dno/insureds/{id}/litigation-events]
        distinguishing_aspect: |
          LitigationEvent is the scaffold's only common_fields:false entity: it is an append-only
          historical record with no version field, no update endpoint and no delete endpoint, so a
          correction is expressed by appending another event. Any implementation that exposes a PATCH
          or stamps a version on it contradicts the declaration.
        test_recipe:
          setup:
            - "One Vantiq Bio Inc insured with no litigation history yet."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
          trigger:
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "REGULATORY_ENFORCEMENT", filed_date: "2026-02-02T00:00:00Z" }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "REGULATORY_ENFORCEMENT", filed_date: "2026-02-02T00:00:00Z", resolved_date: "2026-06-30T00:00:00Z", indemnity_paid_usd: 750000, outcome: "SETTLED" }
              as: Underwriter
            - call: "GET /dno/insureds/${insured_id}/litigation-events"
              payload: { limit: 10, offset: 0 }
              as: Underwriter
          assert:
            - "trigger call 1 returns 201 with data.case_type == \"REGULATORY_ENFORCEMENT\", data.resolved_date == null, data.indemnity_paid_usd == 0, data.outcome == null and data.weight_units == 0 — the three optional fields fall back to their declared defaults"
            - "neither trigger response carries a version field (LitigationEvent declares common_fields false), and §1.5 declares no PATCH and no DELETE route for litigation events"
            - "trigger call 3 returns total_count == 2: the correcting record is an additional row, so the original unresolved event is still readable"
            - "the insured itself is untouched by both appends: GET /dno/insureds/${insured_id} still reads version == 1"
      - name: disclosure_package_under_unknown_insured_returns_insured_not_found
        claim_type: parent_relationships
        grounds:
          - errors[ERR_INSURED_NOT_FOUND]
          - validations[priority=3]
          - endpoints[POST /dno/insureds/{id}/disclosure-packages]
        distinguishing_aspect: |
          A child of a nested route cannot outlive its parent check: the parent id is resolved at
          priority 3, before the body is validated at priority 15, so a payload that is also missing
          a required field still answers ERR_INSURED_NOT_FOUND.
        test_recipe:
          setup:
            - "One Vantiq Bio Inc insured exists, so the disclosure-package table is reachable but the requested parent is not."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
          trigger:
            - call: "POST /dno/insureds/00000000-0000-0000-0000-00000000dead/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: false, material_weakness_count: 0, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 0.4 }
              as: Underwriter
          assert:
            - "the response is 404 with data.error_id == \"ERR_INSURED_NOT_FOUND\", even though the body also omits independent_director_ratio and the four governance flags that priority 15 would reject"
            - "GET /dno/insureds/${insured_id}/disclosure-packages still returns total_count == 0 — the rejected call persisted nothing"
      - name: submission_range_constraints_reject_before_business_rules
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_PERIOD_INVALID]
          - errors[ERR_PROGRAM_TARGET_BELOW_LIMIT]
          - validations[priority=16]
          - validations[priority=17]
        distinguishing_aspect: |
          Three distinct rejection layers on the same intake surface: an undeclared enum member is
          priority 15's ERR_INVALID_REQUEST, the period ordering is priority 16's own code, and the
          program-target comparison is priority 17's — cross-field comparisons are NOT folded into
          ERR_INVALID_REQUEST, and 16 outranks 17 when both are broken.
        test_recipe:
          setup:
            - "One Vantiq Bio Inc insured; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
          trigger:
