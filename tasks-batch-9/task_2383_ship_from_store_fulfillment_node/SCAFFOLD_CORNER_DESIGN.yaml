            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 20, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-B301", customer_ref: "C-331", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id", o1_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
              captures: { err_nolines: "$.data.error_id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v2: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v2}" }
              as: NetworkPlanner
              captures: { run2: "$.data.id" }
          assert:
            - "${err_nolines} == ERR_NO_ROUTABLE_LINES with HTTP 409"
            - "the refused run persisted nothing: GET /routing-runs?order_id=${o1} reports total_count 1 after the whole recipe, counting only the successful run ${run2}"
            - "CustomerOrder.${o1}.version is still 1 immediately after the refusal, so the refused call did not bump the OCC parent"
            - "the second call returns HTTP 201 with RoutingRun.${run2}.status == COMMITTED, selected_store_count 1, projected_cost_cents 1416"
            - "CustomerOrder.${o1}.routing_status == ROUTED and unassigned_units == 0"

      - name: clock_regression_and_an_inverted_pickup_window_are_both_refused
        claim_type: temporal_validation
        grounds:
          - validations.priority_35
          - validations.priority_33
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - errors.ERR_INVALID_WINDOW
        distinguishing_aspect: "Two independent temporal shape rules: the logical clock refuses to move backwards (09:00 -> 08:59 is 422 ERR_CLOCK_NOT_MONOTONIC) while an equal start and end instant is refused as 422 ERR_INVALID_WINDOW because window_end_utc must be STRICTLY after window_start_utc."
        test_recipe:
          setup:
            - "Clock 09:00; node S1 registered with no pickups."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
          trigger:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:59:00Z" }
              as: NetworkPlanner
              captures: { err_clock: "$.data.error_id" }
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "ACME", window_start_utc: "2026-08-03T10:00:00Z", window_end_utc: "2026-08-03T10:00:00Z", parcel_capacity: 2 }
              as: CarrierCoordinator
              captures: { err_window: "$.data.error_id" }
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "ACME", window_start_utc: "2026-08-03T10:00:00Z", window_end_utc: "2026-08-03T10:00:01Z", parcel_capacity: 2 }
              as: CarrierCoordinator
              captures: { pk_ok: "$.data.id" }
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
          assert:
            - "${err_clock} == ERR_CLOCK_NOT_MONOTONIC with HTTP 422"
            - "${err_window} == ERR_INVALID_WINDOW with HTTP 422 and no CarrierPickup row is written"
            - "a one-second window is accepted: CarrierPickup.${pk_ok}.status == SCHEDULED, proving the rule is strict inequality and not a minimum duration"
            - "re-setting the clock to the value it already holds (09:00 -> 09:00) returns HTTP 200, since the rule is to_iso8601 >= current"

      - name: hazmat_routing_requires_a_certified_node
        claim_type: conditional_validation
        grounds:
          - calculations.routing_node_selection_waterfall
          - entities.Store.fields.hazmat_certified
          - entities.Sku.fields.hazmat_flag
        distinguishing_aspect: "Filter clause 7 applies only when a remaining SKU carries hazmat_flag true: with only the non-certified S1 in the network the candidate is recorded ineligible with ineligible_reason HAZMAT_NOT_CERTIFIED and the run ends NO_ELIGIBLE_NODE, while the identical demand commits to the hazmat-certified S2 for 1599 cents once that node exists."
        test_recipe:
          setup:
            - "Clock 09:00; node S1-DOWNTOWN with hazmat_certified false holds SKU-H (hazmat_flag true) 20 on hand / 2 safety; order O1 has one line SKU-H x2 to destination zone 4 GROUND."
            - "After the first refused run, node S2-HARBOR with hazmat_certified true is registered and stocked with the same SKU-H at 20 / 2."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-H", unit_weight_grams: 1200, unit_price_cents: 6900, package_class: "LARGE", hazmat_flag: true }
              as: NetworkPlanner
              captures: { sku_h: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_h}", on_hand_units: 20, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-B401", customer_ref: "C-341", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_h}", quantity: 2, unit_price_cents: 6900 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
              captures: { run1: "$.data.id" }
            - call: "GET /fulfillment-network/routing-candidates"
              payload: { routing_run_id: "${run1}" }
              as: NetworkPlanner
              captures: { cand1: "$.data[0].id" }
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S2-HARBOR", region_code: "EAST", origin_zone: 5, daily_unit_capacity: 60, staffed_labor_minutes: 300, labor_standard_minutes_per_order: 15, pick_labor_minutes_per_unit: 4, labor_rate_cents_per_minute: 38, cutoff_utc_minutes: 1080, hazmat_certified: true }
              as: NetworkPlanner
              captures: { s2: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s2}", sku_id: "${sku_h}", on_hand_units: 20, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v2: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v2}" }
              as: NetworkPlanner
              captures: { run2: "$.data.id" }
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}", store_id: "${s2}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
          assert:
            - "run 1: RoutingRun.${run1}.status == NO_ELIGIBLE_NODE, candidate_count 1, selected_store_count 0, planned_split_count 0, unfulfillable_units 2"
            - "RoutingCandidate.${cand1}: eligible false, ineligible_reason HAZMAT_NOT_CERTIFIED, routing_score null, rank null, selected false"
            - "after run 1 CustomerOrder.${o1}.routing_status == UNROUTABLE and exactly 1 CustomerNotification exists with notification_type UNROUTABLE and units_affected 2"
            - "OrderLine open_units stays 2 after run 1 and dc_fallback_units stays 0: an empty-pool exit never hands units to the DC"
            - "run 2: candidate_count 2 (S1 still ineligible HAZMAT_NOT_CERTIFIED, S2 eligible), selected_store_count 1, status COMMITTED"
            - "FulfillmentAssignment.${a1}.store_id == ${s2} with assigned_units 2, derived_package_type LARGE_BOX and provisional_cost_cents 1599 (23 reserved minutes * 38 = 874 labour + 220 packaging + 505 freight)"
            - "CustomerOrder.${o1}.provisional_cost_cents == 1695 (pre-fee 1599, fee 96) and cost_index_bps == 8110"
            - "Store.${s2}.eligibility_score == 46.91 after the commit reserves 2 units and 23 minutes"

      - name: unknown_assignment_id_is_reported_before_the_store_scope_check
        claim_type: cascading_validation
        grounds:
          - validations.priority_4
          - validations.priority_6
          - errors.ERR_ASSIGNMENT_NOT_FOUND
        distinguishing_aspect: "The scope check at priority 6 cannot run until the row it compares against is loaded, so an accept on an unknown assignment id by a StoreAssociate returns 404 ERR_ASSIGNMENT_NOT_FOUND, not 403 ERR_STORE_SCOPE_VIOLATION."
        test_recipe:
          setup:
            - "Clock 09:00; two nodes S1 and S3 exist; no assignment exists at all, so no row could match the acting associate's node."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S3-SUBURB", region_code: "WEST", origin_zone: 2, daily_unit_capacity: 200, staffed_labor_minutes: 600, labor_standard_minutes_per_order: 10, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 20, cutoff_utc_minutes: 960, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s3: "$.data.id" }
          trigger:
            - call: "POST /fulfillment-network/assignments/00000000-0000-4000-8000-000000000021/accept"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s1}"
              captures: { err_asg_nf: "$.data.error_id" }
            - call: "POST /fulfillment-network/assignments/00000000-0000-4000-8000-000000000021/pick"
              payload: { picked_units: 1, line_picks: [{ assignment_line_id: "00000000-0000-4000-8000-000000000022", units_picked: 1 }] }
              as: StoreAssociate
              as_user_id: "${s3}"
              captures: { err_asg_nf2: "$.data.error_id" }
          assert:
            - "${err_asg_nf} == ERR_ASSIGNMENT_NOT_FOUND with HTTP 404, not ERR_STORE_SCOPE_VIOLATION"
            - "${err_asg_nf2} == ERR_ASSIGNMENT_NOT_FOUND with HTTP 404: the path id is resolved before the body FK ERR_ASSIGNMENT_LINE_NOT_FOUND at priority 5 and before the scope check at priority 6"
            - "Store.${s1} and Store.${s3} are unchanged at version 1 with reserved_labor_minutes 0.00"

      - name: state_error_versus_resource_error_priority_pair
        claim_type: priority_conflict
        grounds:
          - validations.priority_10
          - validations.priority_42
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assignment_state_error_outranks_packaging_depletion_on_repack
          rationale: "The priority-conflict pattern - violating a low-priority resource rule and a high-priority state rule in one call and expecting the state error - is the whole point of the four priority_pair_validation_conflict instances in §1.8, which pair 10 vs 42, 32 vs 41, 10 vs 47 and 6 vs 10."
      - name: collective_labor_load_exceeds_the_concurrency_cap
        claim_type: aggregate_validation
        grounds:
          - validations.priority_40
          - calculations.concurrent_pick_labor_load
        excluded_because:
          difficulty_instance: boundary_precision_check / accept_allowed_at_concurrent_labor_exactly_equal_to_the_cap
          rationale: "The aggregate-validation pattern - each accept individually within capacity while the collective overlapping pick labour exceeds floor(staffed_labor_minutes * 0.5) - is the boundary_precision_check instance of that name in §1.8, which accepts exactly at the cap and refuses one minute beyond it with ERR_LABOR_WINDOW_OVERSUBSCRIBED."

  - section: endpoints
    instances:
      - name: patching_a_node_rescores_it_and_bumps_its_version
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH /fulfillment-network/stores/{store_id}
          - calculations.store_eligibility_score
        distinguishing_aspect: "The update leg of the node CRUD set is partial and re-derives: patching only daily_unit_capacity 120 -> 200, cutoff 1020 -> 1080 and hazmat_certified false -> true lifts eligibility_score from 72.00 to 88.00, bumps version to 2 and leaves every unpatched field untouched."
        test_recipe:
          setup:
            - "Clock 09:00; node S1 registered at capacity 120, staffed 480, cutoff 1020, hazmat false, eligibility_score 72.00."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
          trigger:
            - call: "PATCH /fulfillment-network/stores/${s1}"
              payload: { daily_unit_capacity: 200, cutoff_utc_minutes: 1080, hazmat_certified: true }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/stores/${s1}"
              payload: {}
              as: NetworkPlanner
          assert:
            - "HTTP 200; Store.${s1}.daily_unit_capacity == 200, cutoff_utc_minutes == 1080, hazmat_certified == true"
            - "the unpatched fields are unchanged: store_code S1-DOWNTOWN, region_code WEST, origin_zone 4, staffed_labor_minutes 480, labor_standard_minutes_per_order 12, pick_labor_minutes_per_unit 3, labor_rate_cents_per_minute 42"
            - "Store.${s1}.eligibility_score == 88.00 (capacity 40 * min(1, 200/200) = 40.0000, labour 30.0000, cold-start performance 18.0000) with eligibility_score_basis still COLD_START"
            - "Store.${s1}.version == 2 and node_status still ELIGIBLE"
            - "§1.5 declares no DELETE route for stores: a node leaves the network through the ops-run deactivation cascade, never through a delete"

      - name: restocking_packaging_clears_the_reorder_flag
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /fulfillment-network/packaging-supplies/{supply_id}/restock
          - entities.PackagingSupply.fields.reorder_flag
        distinguishing_aspect: "restock is an action endpoint with an arithmetic side effect rather than a state transition: adding 20 units to a supply sitting at 1 with reorder_point 5 raises on_hand to 21, flips reorder_flag from true to false and bumps the version, without touching lifetime_consumed_units."
        test_recipe:
          setup:
            - "Clock 09:00; node S1; a MEDIUM_BOX PackagingSupply row created with on_hand 1 and reorder_point 5, so reorder_flag started true."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/packaging-supplies"
              payload: { store_id: "${s1}", package_type: "MEDIUM_BOX", on_hand_units: 1, reorder_point_units: 5 }
              as: NetworkPlanner
              captures: { pg1: "$.data.id" }
          trigger:
            - call: "POST /fulfillment-network/packaging-supplies/${pg1}/restock"
              payload: { added_units: 20 }
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "GET /fulfillment-network/packaging-supplies"
              payload: { store_id: "${s1}", reorder_flag: false }
              as: NetworkPlanner
          assert:
            - "at creation PackagingSupply.${pg1}.reorder_flag == true (1 <= 5) with lifetime_consumed_units 0 and version 1"
            - "HTTP 200 after restock; on_hand_units == 21, reorder_flag == false, lifetime_consumed_units still 0, version == 2"
            - "GET /packaging-supplies?store_id=${s1}&reorder_flag=false returns exactly 1 row with total_count 1"
            - "the owning StoreAssociate may restock its own node, since X-User-ID equals the row's store_id"

      - name: the_ops_run_closes_every_open_window_in_store_creation_order
        claim_type: bulk_action
        grounds:
          - endpoints.POST /fulfillment-network/performance-windows/close
          - calculations.node_performance_metrics
        distinguishing_aspect: "The close endpoint is a network-wide bulk action with no per-item failure mode: with three nodes and zero assignments it closes all three epoch-1 windows in ascending store.created_at order, treats each empty window as inert (fill_rate 1.0000, node_action NONE, consecutive_breach_windows unchanged at 0) and opens three epoch-2 windows in the same request."
        test_recipe:
          setup:
            - "Clock 09:00; three nodes registered in this order: S1-DOWNTOWN, S3-SUBURB, S2-HARBOR. No SKU, no inventory, no order, so every epoch-1 window is empty."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S3-SUBURB", region_code: "WEST", origin_zone: 2, daily_unit_capacity: 200, staffed_labor_minutes: 600, labor_standard_minutes_per_order: 10, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 20, cutoff_utc_minutes: 960, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s3: "$.data.id" }
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S2-HARBOR", region_code: "EAST", origin_zone: 5, daily_unit_capacity: 60, staffed_labor_minutes: 300, labor_standard_minutes_per_order: 15, pick_labor_minutes_per_unit: 4, labor_rate_cents_per_minute: 38, cutoff_utc_minutes: 1080, hazmat_certified: true }
              as: NetworkPlanner
              captures: { s2: "$.data.id" }
          trigger:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T18:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/performance-windows/close"
              payload: {}
              as: NetworkPlanner
            - call: "GET /fulfillment-network/performance-windows"
              payload: { status: "OPEN" }
              as: NetworkPlanner
          assert:
            - "HTTP 200 with exactly 3 rows, ordered ${s1}, ${s3}, ${s2} by ascending store.created_at (never by store id)"
            - "each closed window: status CLOSED, epoch 1, closed_at_utc 2026-08-03T18:00:00Z, assignments_created 0, units_promised 0, units_shipped 0"
            - "each closed window: fill_rate 1.0000, avg_cycle_time_minutes 0.00, cancellation_rate 0.0000, breach_flags [], breached false, node_action NONE, cost_index_bps 0"
            - "no node changed posture: all three stay ELIGIBLE with consecutive_breach_windows 0 and deactivated_at_epoch null"
            - "review_score is written for every node: ${s1} 84.00, ${s3} 100.00, ${s2} 60.75 (empty-window performance ratio 1.0 -> 30.0000)"
            - "eligibility_score matches those same values with eligibility_score_basis TRAILING_WINDOW after step 7"
            - "GET /performance-windows?status=OPEN returns exactly 3 rows, all at epoch 2"

      - name: pickups_are_created_through_the_nested_store_path
