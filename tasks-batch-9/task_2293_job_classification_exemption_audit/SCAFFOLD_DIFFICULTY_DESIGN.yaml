# =============================================================================
# task_2293 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 Difficulty Rules, each with >= 2 differentiated instances.
# Every numeric literal in an `assert:` was computed against the §1.3 formulas
# and their `constants:`. Logical clock is pinned to 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: back_wage_full_rate_versus_half_time_diverge_on_identical_case
        grounds:
          - calculations.back_wage_exposure
          - entities.BackWageEstimate.fields.method
          - entities.BackWageEstimate.fields.total_exposure_cents
          - entities.StateRule.fields.back_wage_lookback_weeks_override
          - concurrency_rules[estimate-create-stale-case]
        distinguishing_aspect: |
          Money domain: the two variants of back_wage_exposure divide the same weekly salary
          by two different hour bases (40 versus validated_weekly_hours) and apply two
          different premiums (1.5 versus 0.5), so the identical ReclassificationCase yields
          total_exposure_cents 22274928 under FULL_RATE and 6060912 under HALF_TIME.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "StateRule CA: min_weekly_salary_cents 132000, QUANTITATIVE_50PCT, ABC, liquidated_damages_multiplier 1.0, reclass_notice_days 7, back_wage_lookback_weeks_override 156."
            - "AuditProject with lookback_policy WILLFUL_3Y (policy weeks 156) in FIELDWORK."
            - "Position: annual_salary_cents 5500000 (weekly_salary_cents 105769), incumbent_count 2, work_state_code CA, avg_weekly_hours 47."
            - "Both interviews ATTESTED (manager 46.0 pct / 45 hrs, incumbent 52.0 pct / 49 hrs), so duties_validation_status is CORROBORATED, primary_duty_pct 49.6 and validated_weekly_hours 49 (weekly_ot_hours 9)."
            - "One ReclassificationCase open on the Position with no estimate yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_annual_cents: 0, computer_exemption_recognized: true, outside_sales_recognized: true, hce_shortcut_recognized: false, liquidated_damages_multiplier: 1.0, reclass_notice_days: 7, back_wage_lookback_weeks_override: 156 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "WILLFUL_3Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Shift Supervisor", job_code: "SS-100", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 2, avg_weekly_hours: 47, requires_advanced_degree: false, works_primarily_offsite: false }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_id: $.data.id }
            - call: "POST /duty-statements"
              payload: { position_id: "${pos_id}", duty_code: "D-EX", description: "Directs the shift and assigns crew", claimed_time_pct: 45, is_exempt_duty: true, discretion_level: "INDEPENDENT_JUDGMENT" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /duty-statements"
              payload: { position_id: "${pos_id}", duty_code: "D-NX", description: "Works the line alongside the crew", claimed_time_pct: 55, is_exempt_duty: false, discretion_level: "ROUTINE" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews"
              payload: { position_id: "${pos_id}", respondent_type: "MANAGER", respondent_ref: "MGR-1", interviewer_user_id: "int-1", scheduled_start_at: "2026-09-10T14:00:00Z", scheduled_end_at: "2026-09-10T15:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
              captures: { iv_mgr_id: $.data.id }
            - call: "POST /interviews/${iv_mgr_id}/complete"
              payload: { reported_exempt_duty_pct: 46.0, reported_weekly_hours: 45, supervises_headcount: 3, has_hire_fire_influence: true }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews/${iv_mgr_id}/attest"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews"
              payload: { position_id: "${pos_id}", respondent_type: "INCUMBENT", respondent_ref: "INC-1", interviewer_user_id: "int-1", scheduled_start_at: "2026-09-11T14:00:00Z", scheduled_end_at: "2026-09-11T15:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
              captures: { iv_inc_id: $.data.id }
            - call: "POST /interviews/${iv_inc_id}/complete"
              payload: { reported_exempt_duty_pct: 52.0, reported_weekly_hours: 49, supervises_headcount: 2, has_hire_fire_influence: true }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews/${iv_inc_id}/attest"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /reclassification-cases"
              payload: { position_id: "${pos_id}", effective_date: "2026-10-01", effective_end_date: "2026-10-31", conversion_method: "COST_NEUTRAL_WITH_OT" }
              as: CompensationManager
              as_user_id: "cm-1"
              captures: { case_id: $.data.id, case_v1: $.data.version }
          trigger:
            - call: "POST /back-wage-estimates"
              payload: { reclassification_case_id: "${case_id}", method: "FULL_RATE", expected_reclassification_case_version: "${case_v1}" }
              as: CompensationManager
              as_user_id: "cm-1"
              captures: { est_full_id: $.data.id }
            - call: "GET /reclassification-cases/${case_id}"
              payload: {}
              as: CompensationManager
              as_user_id: "cm-1"
              captures: { case_v2: $.data.version }
            - call: "POST /back-wage-estimates"
              payload: { reclassification_case_id: "${case_id}", method: "HALF_TIME", expected_reclassification_case_version: "${case_v2}" }
              as: CompensationManager
              as_user_id: "cm-1"
              captures: { est_half_id: $.data.id }
          assert:
            - "BackWageEstimate.${est_full_id}.lookback_weeks == 156"
            - "BackWageEstimate.${est_full_id}.weekly_ot_hours == 9"
            - "BackWageEstimate.${est_full_id}.week_ot_cents == 35697"
            - "BackWageEstimate.${est_full_id}.gross_exposure_cents == 11137464"
            - "BackWageEstimate.${est_full_id}.liquidated_damages_cents == 11137464"
            - "BackWageEstimate.${est_full_id}.total_exposure_cents == 22274928"
            - "BackWageEstimate.${est_full_id}.status == SUPERSEDED"
            - "BackWageEstimate.${est_half_id}.week_ot_cents == 9713"
            - "BackWageEstimate.${est_half_id}.gross_exposure_cents == 3030456"
            - "BackWageEstimate.${est_half_id}.total_exposure_cents == 6060912"
            - "BackWageEstimate.${est_half_id}.status == ACTIVE"
            - "ReclassificationCase.${case_id}.exposure_cents == 6060912"
            - "AuditProject.${proj_id}.total_back_wage_exposure_cents == 0"

      - name: job_family_risk_screening_premium_is_the_only_delta_versus_evidence_weighted
        grounds:
          - calculations.job_family_risk_score
          - entities.JobFamily.fields.risk_variant
          - entities.JobFamily.fields.risk_score
          - entities.Position.fields.duties_validation_status
          - state_machines.Interview.ATTESTED_to_VOIDED
        distinguishing_aspect: |
          Different entity domain from the money instance: this is the JobFamily risk index,
          not a currency amount. The Position is built so that its primary_duty_pct (49.6) and
          validated_weekly_hours (49) are numerically identical whether duties are CORROBORATED
          or PENDING, so voiding one interview moves risk_score from 58 to exactly 70 — a delta
          of precisely SCREENING_UNCERTAINTY_PREMIUM and nothing else.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; StateRule CA as above."
            - "AuditProject in FIELDWORK with one JobFamily 'Field Engineering'."
            - "One Position: annual_salary_cents 8000000 (weekly 153846, above 1.15x the 132000 CA floor so salary_risk 0), incumbent_count 3, avg_weekly_hours 49, DutyStatements 49.6 exempt + 50.4 non-exempt so self_reported_exempt_pct is 49.6."
            - "Both interviews ATTESTED reporting 46.0 and 52.0 pct and 49 hours each, so duties_validation_status is CORROBORATED, primary_duty_pct 49.6 and validated_weekly_hours 49."
            - "JobFamily is therefore EVIDENCE_WEIGHTED with risk_score 58 and risk_tier HIGH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, liquidated_damages_multiplier: 1.0, reclass_notice_days: 7, back_wage_lookback_weeks_override: 156 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Field Engineering", code: "FLD-ENG" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Systems Engineer", job_code: "SE-200", current_fls_status: "EXEMPT", claimed_exemption_test: "PROFESSIONAL", annual_salary_cents: 8000000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 3, avg_weekly_hours: 49, requires_advanced_degree: true, works_primarily_offsite: false }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_id: $.data.id }
            - call: "POST /duty-statements"
              payload: { position_id: "${pos_id}", duty_code: "E-EX", description: "Designs and reviews system architecture", claimed_time_pct: 49.6, is_exempt_duty: true, discretion_level: "INDEPENDENT_JUDGMENT" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /duty-statements"
              payload: { position_id: "${pos_id}", duty_code: "E-NX", description: "Executes scripted test runs", claimed_time_pct: 50.4, is_exempt_duty: false, discretion_level: "ROUTINE" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews"
              payload: { position_id: "${pos_id}", respondent_type: "MANAGER", respondent_ref: "MGR-E", interviewer_user_id: "int-2", scheduled_start_at: "2026-09-14T09:00:00Z", scheduled_end_at: "2026-09-14T10:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
              captures: { iv_mgr_id: $.data.id }
            - call: "POST /interviews/${iv_mgr_id}/complete"
              payload: { reported_exempt_duty_pct: 46.0, reported_weekly_hours: 49, supervises_headcount: 0, has_hire_fire_influence: false }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews/${iv_mgr_id}/attest"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews"
              payload: { position_id: "${pos_id}", respondent_type: "INCUMBENT", respondent_ref: "INC-E", interviewer_user_id: "int-2", scheduled_start_at: "2026-09-15T09:00:00Z", scheduled_end_at: "2026-09-15T10:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
              captures: { iv_inc_id: $.data.id }
            - call: "POST /interviews/${iv_inc_id}/complete"
              payload: { reported_exempt_duty_pct: 52.0, reported_weekly_hours: 49, supervises_headcount: 0, has_hire_fire_influence: false }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews/${iv_inc_id}/attest"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "GET /job-families/${fam_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
          trigger:
            - call: "POST /interviews/${iv_inc_id}/void"
              payload: { void_reason: "Incumbent account withdrawn pending re-interview" }
              as: ClassificationReviewer
              as_user_id: "cr-1"
            - call: "GET /job-families/${fam_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "Before the void: JobFamily.${fam_id}.risk_variant == EVIDENCE_WEIGHTED"
            - "Before the void: JobFamily.${fam_id}.risk_score == 58 and risk_tier == HIGH"
            - "After the void: JobFamily.${fam_id}.risk_variant == SCREENING"
            - "After the void: JobFamily.${fam_id}.risk_score == 70 and risk_tier == HIGH"
            - "Position.${pos_id}.duties_validation_status == PENDING"
            - "Position.${pos_id}.primary_duty_pct == 49.6 (unchanged across the void)"
            - "Position.${pos_id}.validated_weekly_hours == 49 (unchanged across the void)"
            - "JobFamily.${fam_id}.family_headcount == 3 (unchanged across the void)"
            - "70 - 58 == 12 == SCREENING_UNCERTAINTY_PREMIUM"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: exemption_same_position_evaluated_twice_federal_pass_state_fail
        grounds:
          - calculations.exemption_test_evaluation
          - entities.ExemptionAnalysis.fields.federal_pass
          - entities.ExemptionAnalysis.fields.state_pass
          - entities.ExemptionAnalysis.fields.salary_threshold_source
          - state_machines.ExemptionAnalysis.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a) — the same base quantity is fed through the identical formula twice against
          two different thresholds: salary_ok() and duties_ok() are each evaluated once at the
          federal floor and once at the resolved California floor. federal_pass is true while
          state_pass is false for one and the same Position, and the conjunction drives
          outcome to NONEXEMPT even though nothing federal is violated.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; StateRule CA with min_weekly_salary_cents 132000 and duties_test_variant QUANTITATIVE_50PCT."
            - "AuditProject in FIELDWORK, one JobFamily."
            - "Position: PROFESSIONAL, requires_advanced_degree true, annual_salary_cents 5000000 (weekly_salary_cents 96153 — above the 84400 federal floor, below the 132000 CA floor), incumbent_count 1, avg_weekly_hours 42."
            - "Both interviews ATTESTED at 80.0 pct and 42 hours, so primary_duty_pct is 80.0 and duties clear both the 50.0 federal and the 50.0 CA duty floor."
            - "One DRAFT ExemptionAnalysis on applied_test PROFESSIONAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, liquidated_damages_multiplier: 1.0, reclass_notice_days: 7, back_wage_lookback_weeks_override: 156 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Professional Staff", code: "PROF" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Staff Actuary", job_code: "ACT-300", current_fls_status: "EXEMPT", claimed_exemption_test: "PROFESSIONAL", annual_salary_cents: 5000000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 1, avg_weekly_hours: 42, requires_advanced_degree: true, works_primarily_offsite: false }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_id: $.data.id }
            - call: "POST /duty-statements"
              payload: { position_id: "${pos_id}", duty_code: "A-EX", description: "Builds and signs off reserve models", claimed_time_pct: 80, is_exempt_duty: true, discretion_level: "INDEPENDENT_JUDGMENT" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /duty-statements"
              payload: { position_id: "${pos_id}", duty_code: "A-NX", description: "Compiles routine data extracts", claimed_time_pct: 20, is_exempt_duty: false, discretion_level: "ROUTINE" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews"
              payload: { position_id: "${pos_id}", respondent_type: "MANAGER", respondent_ref: "MGR-A", interviewer_user_id: "int-3", scheduled_start_at: "2026-09-16T09:00:00Z", scheduled_end_at: "2026-09-16T10:00:00Z" }
              as: ComplianceAnalyst
