              payload: { order_line_id: "${line_id}", qty: 1 }
              as: WholesaleRep
              captures: { refund: $.data.refund_cents }
          assert:
            - "CoreReturn refund_cents == 5400"
            - "OrderLine.${line_id}.cores_outstanding == 1 (set at ship for rebuildable line)"

      - name: calc_order_rollup_excludes_cancelled_line
        claim_type: Input Set Filtering
        grounds: [calculations.order_rollup, entities.SalesOrder.fields.merchandise_subtotal_cents]
        distinguishing_aspect: "Order rollup sums only non-CANCELLED lines; a fully-cancelled order has merchandise_subtotal_cents 0."
