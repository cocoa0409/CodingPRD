              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/vehicles"
              payload: { unit_label: "OWNED-31", ownership: "OWNED", per_conveyance_limit_cents: 5000000, approval_expires_on: "2026-12-31" }
              as: Underwriter
              captures: { veh: $.data.id }
            - call: "POST /inland-marine/vehicles/${veh}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T2_URBAN", destination_territory_code: "T3_INLAND", departure_at: "2026-08-05T08:00:00Z", arrival_at: "2026-08-05T12:00:00Z", declared_value_cents: 4000000 }
              as: Underwriter
              captures: { shp_1: $.data.id }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T3_INLAND", destination_territory_code: "T2_URBAN", departure_at: "2026-08-05T20:00:00Z", arrival_at: "2026-08-05T23:00:00Z", declared_value_cents: 1500000 }
              as: Underwriter
              captures: { err: $.data.error_id }
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T3_INLAND", destination_territory_code: "T2_URBAN", departure_at: "2026-08-06T02:00:00Z", arrival_at: "2026-08-06T06:00:00Z", declared_value_cents: 1500000 }
              as: Underwriter
