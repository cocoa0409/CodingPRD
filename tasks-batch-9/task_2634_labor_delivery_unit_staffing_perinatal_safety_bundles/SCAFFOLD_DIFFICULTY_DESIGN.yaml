              captures: { deficit_before: $.data.coverage_deficit_units, buffer_before: $.data.turnover_buffer_minutes }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-24T09:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /bundle-activations
