            - call: "GET /signal-ops/timing-plans/${tp1_id}/pedestrian-checks"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { total: $.total_count, phase: "$.data[0].phase_number", speed: "$.data[0].walking_speed_fps", req_clear: "$.data[0].required_ped_clear_sec", prov_clear: "$.data[0].provided_ped_clear_sec", req_walk: "$.data[0].required_walk_sec", prov_walk: "$.data[0].provided_walk_sec", req_phase: "$.data[0].required_phase_length_sec", prov_phase: "$.data[0].provided_phase_length_sec", res: "$.data[0].result", reason: "$.data[0].failure_reason", chk_v: "$.data[0].version" }
