      - name: withdrawn_student_blocks_new_screening
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=17]
          - errors[ERR_STUDENT_NOT_ENROLLED]
          - entities.Student.fields.enrollment_status
        distinguishing_aspect: "Validity depends on the Student row, not the Screening payload: POST /health-office/screenings for a student whose enrollment_status is WITHDRAWN returns 409 ERR_STUDENT_NOT_ENROLLED, while the same payload succeeds for an ENROLLED sibling at the same building."
        test_recipe:
          setup:
            - "School ARBOR55 with one RN and two students: one moved to WITHDRAWN via PATCH and one still ENROLLED."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Arbor Elementary", building_code: "ARB55", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Abe Ferris", grade_level: 3, date_of_birth: "2017-01-31T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_out_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Ada Ferris", grade_level: 3, date_of_birth: "2017-01-31T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_in_id: $.data.id }
            - call: "PATCH /health-office/students/${stu_out_id}"
              payload: { enrollment_status: "WITHDRAWN" }
              as: DistrictHealthAdmin
              captures: { enroll_out: $.data.enrollment_status }
          trigger:
            - call: "POST /health-office/screenings"
              payload: { student_id: "${stu_out_id}", school_id: "${sch_id}", screening_type: "HEARING", scheduled_for: "2026-08-10T10:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { err: $.data.error_id }
            - call: "POST /health-office/screenings"
              payload: { student_id: "${stu_in_id}", school_id: "${sch_id}", screening_type: "HEARING", scheduled_for: "2026-08-10T10:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { scr_ok_id: $.data.id }
          assert:
