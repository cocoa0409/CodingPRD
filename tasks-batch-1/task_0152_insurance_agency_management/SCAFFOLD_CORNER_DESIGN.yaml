  # =================================================================
  # RBAC
  # =================================================================
  - section: rbac
    instances:
      - name: producer_cannot_create_carrier
        claim_type: exclusive_op_denied
        grounds:
          - "roles"
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "A Producer calling POST /carriers (AgencyAdmin-exclusive) returns ERR_UNAUTHORIZED 403."
        test_recipe:
          setup: ["a producer exists to act as the caller"]
          setup_api_calls:
            - call: "POST /producers"
              payload: { full_name: "Prod RB", npn: "NPN-RB1", default_split_pct: 1.0 }
