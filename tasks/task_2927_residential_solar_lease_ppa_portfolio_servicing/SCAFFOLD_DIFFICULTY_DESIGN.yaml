  - rule_id: non_linear_state_machine
    instances:

      - name: transfer_case_fork_assumption_vs_prepayment_from_same_creation_endpoint
        grounds:
          - state_machines.TransferCase.INITIATED_to_CREDIT_REVIEW
          - state_machines.TransferCase.CREDIT_APPROVED_to_TITLE_CLEARED
          - state_machines.TransferCase.INITIATED_to_TITLE_CLEARED
          - state_machines.SolarAgreement.TRANSFER_PENDING_to_ACTIVE
          - state_machines.SolarAgreement.TRANSFER_PENDING_to_PREPAID_CLOSED
          - validations[priority=12]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          One creation endpoint forks TransferCase into two different initial states:
          transfer_type ASSUMPTION lands in CREDIT_REVIEW and MUST pass through
          run-credit-review before clear-title, while PREPAYMENT stays in INITIATED
          and reaches TITLE_CLEARED directly — so run-credit-review on the PREPAYMENT
          case is an invalid transition, and the two branches rejoin at close with
          divergent agreement outcomes (ACTIVE with a new homeowner vs PREPAID_CLOSED).
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-08-20T00:00:00Z before the two closes, because TITLE_CLEARED -> CLOSED requires the clock date to be on or after closing_date 2026-08-20."
            - "Two ACTIVE PPA agreements with identical terms held by seller homeowner HO_SELL; a third Homeowner HO_BUY exists with fico_score 760, dti_ratio 0.05, monthly_income_cents 3000000."
            - "No UccFiling exists for either agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
