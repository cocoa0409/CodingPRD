        claim_type: Aggregate validation
        grounds: ["calculations.capacity_commit_availability", "errors[ERR_CAPACITY_COMMIT_EXCEEDED]", "validations[priority=22]"]
        distinguishing_aspect: "A 1440-minute window offers floor(1440 * 8500 / 10000) = 1224 sellable minutes; an existing OPEN 1000-minute commitment leaves 224, so a 225-minute request is refused with 422 while a 224-minute request is accepted."
