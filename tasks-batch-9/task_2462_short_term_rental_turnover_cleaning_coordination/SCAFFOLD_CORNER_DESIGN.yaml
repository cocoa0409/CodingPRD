              captures: { ok_k_status: "$.data.status" }
          assert:
            - "${a1_cleaner} == ${ca}"
            - "${e1} == ERR_NOT_ASSIGNMENT_OWNER (403) - ownership precedes the OFFERED-state check"
            - "${e2} == ERR_NOT_ASSIGNMENT_OWNER (403) - a peer cannot decline work either"
            - "${ok_status} == ACCEPTED for the rightful cleaner"
            - "${e3} == ERR_NOT_ASSIGNMENT_OWNER (403) - the indirect form: no assignment id appears in the start URL"
            - "${ok_t_status} == IN_PROGRESS for the rightful cleaner"
            - "${e4} == ERR_NOT_ASSIGNMENT_OWNER (403) - submitting someone else's checklist row is refused"
            - "${ok_k_status} == SUBMITTED for the rightful cleaner"

      - name: corner_rbac_segregation_of_duties_bans_participating_identities_not_a_whole_role
        claim_type: Segregation of duties
        grounds:
          - validations[priority=14]
          - complexity_profile.role_model
          - endpoints["POST /quality-audits"].side_effects
        distinguishing_aspect: |
          role_model is segregation_of_duties, and the rule is keyed on X-User-ID rather than on the
          role: the set of banned auditors is discovered from this turnover's HISTORY - the identity
          that made the offer plus EVERY identity that reviewed one of its checklist rows - so
          splitting the four reviews between two coordinator identities burns both of them, while a
          fourth identity that never touched T1 samples successfully even though it is an ordinary
          coordinator id wearing the auditor role. The ban is also per-turnover, not global.
        test_recipe:
          setup:
