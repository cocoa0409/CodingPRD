            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_ia}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-12T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
