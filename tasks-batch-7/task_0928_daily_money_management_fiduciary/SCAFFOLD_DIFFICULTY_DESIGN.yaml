scaffold_difficulty_design:

  # =======================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: payment_settlement_projected_vs_effective_diverge
        grounds:
          - calculations.payment_settlement_schedule
          - entities.Payment.fields.projected_settlement_date
          - entities.Payment.fields.effective_settlement_date
          - state_machines.Payment.settlement_status.SCHEDULED_to_IN_FLIGHT
        distinguishing_aspect: |
          The dual variant lives on the Payment entity domain (a settlement
          date), not on any money aggregate - the same payment row carries two
          different ISO dates because the projected variant is fixed at the
          creation instant and the effective variant is recomputed at the
          release instant against the same cut-off and business-day rules.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z, a Monday, before the 16:00:00 cut-off"
            - "one IN_FORCE surety bond covering 2026-01-01 through 2026-12-31 with 100000000 cents of coverage"
            - "one ACTIVE client with RETAINS_CAPACITY, one ACTIVE FULL_AGENCY authorization, one CHECKING account with 5000000 cents opening balance"
            - "one ACTIVE RECURRING_BILLER payee and one UTILITIES budget line for 2026-06 allocated 300000 cents"
            - "one ACH payment of 80000 cents, auto-approved because it is below the second-approval threshold, still SCHEDULED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { bond_id: $.data.id }
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-9001" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-2026-11", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_id: $.data.id }
            - call: "POST /dmm/authorizations/${auth_id}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "City Power", payee_type: "RECURRING_BILLER", remittance_reference: "ACC-77" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_id: $.data.id }
            - call: "POST /dmm/budget-categories"
              payload: { client_id: "${cl_id}", category_name: "UTILITIES", budget_month: "2026-06", allocation_cents: 300000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cat_id: $.data.id }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v: $.data.version }
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_id}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 80000, channel: "ACH", expected_account_version: "${acct_v}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { pay_id: $.data.id, proj_date: $.data.projected_settlement_date }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T16:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/payments/${pay_id}/release"
              payload: {}
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { eff_date: $.data.effective_settlement_date }
          assert:
            - "Payment.${pay_id}.projected_settlement_date == 2026-06-03"
            - "Payment.${pay_id}.effective_settlement_date == 2026-06-08"
            - "Payment.${pay_id}.settlement_status == IN_FLIGHT"
            - "Payment.${pay_id}.approval_status == APPROVED"
            - "Payment.${pay_id}.service_fee_cents == 500"
            - "Payment.${pay_id}.total_charge_cents == 80500"

      - name: budget_variance_full_vs_period_to_date_diverge
        grounds:
          - calculations.budget_variance
          - entities.BudgetCategory.fields.variance_full_cents
          - entities.BudgetCategory.fields.variance_ptd_cents
          - entities.BudgetCategory.fields.variance_direction
        distinguishing_aspect: |
          This dual variant lives on the BudgetCategory entity domain - a
          different subject from the Payment settlement date - and the two
          variants disagree because one uses the whole month's allocation
          against COMMITTED money while the other uses a prorated allocation
          against SETTLED money only.
        test_recipe:
          setup:
            - "logical clock at 2026-06-10T09:00:00Z, the 10th of a 30-day month"
            - "one IN_FORCE bond, one ACTIVE client, one ACTIVE FULL_AGENCY authorization, one account with 5000000 cents"
            - "one UTILITIES budget line for 2026-06 allocated 300000 cents with no override"
            - "one ACH payment of 80000 cents on that line, SCHEDULED and therefore committed but not settled"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-9002" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-2026-12", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_id: $.data.id }
            - call: "POST /dmm/authorizations/${auth_id}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "City Power", payee_type: "RECURRING_BILLER", remittance_reference: "ACC-77" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_id: $.data.id }
            - call: "POST /dmm/budget-categories"
              payload: { client_id: "${cl_id}", category_name: "UTILITIES", budget_month: "2026-06", allocation_cents: 300000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cat_id: $.data.id }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_id}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 80000, channel: "ACH", expected_account_version: "${acct_v}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { pay_id: $.data.id }
            - call: "GET /dmm/budget-categories/${cat_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
          assert:
            - "Payment.${pay_id}.projected_settlement_date == 2026-06-12"
            - "BudgetCategory.${cat_id}.committed_cents == 80000"
            - "BudgetCategory.${cat_id}.settled_cents == 0"
            - "BudgetCategory.${cat_id}.remaining_cents == 220000"
            - "BudgetCategory.${cat_id}.variance_full_cents == 220000"
            - "BudgetCategory.${cat_id}.variance_ptd_cents == 100000"
            - "BudgetCategory.${cat_id}.variance_direction == UNDER"

      - name: fraud_intake_band_vs_review_band_fall_a_step
        grounds:
          - calculations.fraud_risk_band
          - entities.FraudAlert.fields.intake_risk_band
          - entities.FraudAlert.fields.review_risk_band
          - entities.Payee.fields.settled_payment_count
          - state_machines.FraudAlert.NEW_to_ACKNOWLEDGED
        distinguishing_aspect: |
          The third dual variant lives on the FraudAlert entity domain - a risk
          band, not money and not a date - and diverges because the novelty
          term reads Payee.settled_payment_count at two different instants,
          dropping the alert from HIGH at intake to MEDIUM at review.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z"
            - "one IN_FORCE bond, one ACTIVE client, one ACTIVE FULL_AGENCY authorization, one account with 5000000 cents"
            - "one UTILITIES budget line for 2026-06 allocated 400000 cents"
            - "payment A of 120000 cents by CHECK to a payee that has never been paid, so its settled_payment_count is 0"
            - "one NEW fraud alert on payment A whose intake band was scored while settled_payment_count was still 0"
            - "payment B of 30000 cents by BILLER_DIRECT to the SAME payee, released and settled, lifting settled_payment_count to 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-9003" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-2026-13", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_id: $.data.id }
            - call: "POST /dmm/authorizations/${auth_id}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "Sunrise Home Care", payee_type: "RECURRING_BILLER", remittance_reference: "SHC-12" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_id: $.data.id }
            - call: "POST /dmm/budget-categories"
              payload: { client_id: "${cl_id}", category_name: "UTILITIES", budget_month: "2026-06", allocation_cents: 400000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cat_id: $.data.id }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v1: $.data.version }
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_id}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 120000, channel: "CHECK", expected_account_version: "${acct_v1}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { pay_a: $.data.id }
            - call: "POST /dmm/fraud-alerts"
              payload: { account_id: "${acct_id}", payment_id: "${pay_a}", reason_code: "UNRECOGNIZED_PAYEE", detail: "Client does not recognise this care agency." }
              as: ComplianceOfficer
              as_user_id: "u-comp"
              captures: { alert_id: $.data.id, intake_band: $.data.intake_risk_band }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v2: $.data.version }
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_id}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 30000, channel: "BILLER_DIRECT", expected_account_version: "${acct_v2}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { pay_b: $.data.id }
            - call: "POST /dmm/payments/${pay_b}/release"
              payload: {}
              as: BillPaySpecialist
              as_user_id: "u-spec"
            - call: "POST /dmm/payments/${pay_b}/settlement-event"
              payload: { event: "SETTLE" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
          trigger:
            - call: "POST /dmm/fraud-alerts/${alert_id}/disposition"
              payload: { action: "ACKNOWLEDGE", disposition_note: "Reviewed with the client by phone." }
              as: ComplianceOfficer
              as_user_id: "u-comp"
          assert:
            - "FraudAlert.${alert_id}.intake_risk_score == 90"
            - "FraudAlert.${alert_id}.intake_risk_band == HIGH"
            - "FraudAlert.${alert_id}.review_risk_score == 70"
            - "FraudAlert.${alert_id}.review_risk_band == MEDIUM"
            - "FraudAlert.${alert_id}.ack_due_at == 2026-06-01T13:00:00.000Z"
            - "FraudAlert.${alert_id}.status == ACKNOWLEDGED"
            - "Payee.${payee_id}.settled_payment_count == 1"

  # =======================================================================
  # Rule 2 — combinatorial formulas across different modes (a), (b), (c)
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: settlement_cutoff_weekend_and_channel_interact_mode_a
        grounds:
          - calculations.payment_settlement_schedule
          - entities.Payment.fields.channel
          - entities.Payment.fields.projected_settlement_date
        distinguishing_aspect: |
          Mode (a) - three inputs (the evaluation instant's time-of-day, the
          weekday of the resulting base date, and the channel's lead-day count)
          interact non-linearly through a cut-off test, a forward-only weekend
          roll, and a business-day advance that itself skips weekends, so a
          single second of clock difference moves the answer by three calendar
          days.
        test_recipe:
          setup:
            - "logical clock at 2026-06-05T16:00:00Z - a Friday, exactly ON the inclusive 16:00:00 cut-off"
            - "one IN_FORCE bond, one ACTIVE client, one ACTIVE FULL_AGENCY authorization, one account with 5000000 cents"
            - "one ACTIVE RECURRING_BILLER payee and a UTILITIES budget line for 2026-06 allocated 300000 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T16:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-9004" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-2026-14", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_id: $.data.id }
            - call: "POST /dmm/authorizations/${auth_id}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "City Power", payee_type: "RECURRING_BILLER", remittance_reference: "ACC-77" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_id: $.data.id }
            - call: "POST /dmm/budget-categories"
              payload: { client_id: "${cl_id}", category_name: "UTILITIES", budget_month: "2026-06", allocation_cents: 300000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cat_id: $.data.id }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_id}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 40000, channel: "CHECK", expected_account_version: "${acct_v}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { pay_id: $.data.id }
          assert:
            - "Payment.${pay_id}.projected_settlement_date == 2026-06-15"
            - "Payment.${pay_id}.service_fee_cents == 250"
            - "Payment.${pay_id}.total_charge_cents == 40250"
            - "Payment.${pay_id}.approval_status == APPROVED"

      - name: benefit_net_resources_round_per_item_then_sum_mode_b
        grounds:
          - calculations.benefit_countable_resources
          - entities.BenefitApplication.fields.resource_items
          - entities.BenefitApplication.fields.countable_resources_gross_cents
          - entities.BenefitApplication.fields.countable_resources_net_cents
        distinguishing_aspect: |
          Mode (b) - the rounding ORDER is the whole difference. Two odd-valued
          LIFE_INSURANCE items each produce a .5 cent half, so rounding each
          item half-up and then summing yields 205390 while summing the raw
          products and rounding once yields 205389. The scaffold pins per-item
          rounding, so the correct answer is 205390.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z"
            - "one ACTIVE client with an ACTIVE FULL_AGENCY authorization"
            - "a MEDICAID application asserting 120000 cents of monthly income and seven resource items"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-9005" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-2026-15", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_id: $.data.id }
            - call: "POST /dmm/authorizations/${auth_id}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
          trigger:
            - call: "POST /dmm/benefit-applications"
              payload:
                client_id: "${cl_id}"
                authorization_id: "${auth_id}"
                program: "MEDICAID"
                asserted_monthly_income_cents: 120000
                resource_items:
                  - { item_type: "CASH", value_cents: 50000 }
                  - { item_type: "RETIREMENT", value_cents: 100000 }
                  - { item_type: "BURIAL_FUND", value_cents: 200000 }
                  - { item_type: "VEHICLE", value_cents: 900000 }
                  - { item_type: "HOME", value_cents: 15000000 }
                  - { item_type: "LIFE_INSURANCE", value_cents: 33333 }
