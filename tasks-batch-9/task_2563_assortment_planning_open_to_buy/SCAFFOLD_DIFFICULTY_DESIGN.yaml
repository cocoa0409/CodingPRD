          A different triggering transition (ReceiptCommitment COMMITTED -> CANCELLED, not
          CategoryPlan approve) driving CASCADE-A four links deep, and its last link is CONDITIONAL
          on child data rather than unconditional: link 1 zeroes the commitment's open cost, link 2
          moves that money from otb_committed_cents to otb_open_cents on the month, link 3 re-derives
          the plan posture from the month's new open balance, and link 4 fires only because link 3
          crossed out of FROZEN - and even then it restores only DEFERRED items whose lifecycle_stage
