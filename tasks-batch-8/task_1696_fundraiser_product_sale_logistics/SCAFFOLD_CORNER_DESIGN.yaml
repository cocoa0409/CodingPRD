  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: unauthenticated_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]"]
        distinguishing_aspect: "No auth headers on a GET with an unknown id returns 401 ERR_UNAUTHENTICATED, not 404 — auth outranks existence."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /fundraiser/campaigns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
          assert:
            - "no X-User-Role/X-User-ID headers sent"
            - "HTTP status == 401 and error_id == ERR_UNAUTHENTICATED"

      - name: open_campaign_wrong_role_forbidden
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "A Treasurer opening a campaign — even one that does not exist — gets 403 ERR_UNAUTHORIZED_ROLE before any 404 is evaluated."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /fundraiser/campaigns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/open"
              payload: {}
              as: Treasurer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHORIZED_ROLE and HTTP status == 403 (role check beats path existence)"

      - name: seller_create_schema_beats_body_fk_existence
