      - name: supervisor_cannot_create_clearance_air_test
        claim_type: conditional_action
        grounds:
          - "roles[IndustrialHygienist]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
          - "entities.AirTest.fields.phase"
        distinguishing_aspect: "Conditional authorization by phase: the same create endpoint allows a Supervisor for BASELINE/DAILY but rejects phase == CLEARANCE with ERR_UNAUTHORIZED_ROLE (403) — clearance testing is reserved to the independent hygienist."
