              as_user_id: "${reg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_REGISTRAR_NOT_ACTIVE (priority 8 referential), NOT ERR_REGISTRAR_CREDIT_HOLD (priority 10 fiscal)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: renew_at_exact_grace_deadline_allowed_one_second_later_rejected
        grounds:
          - calculations.lifecycle_invoice
          - errors.ERR_GRACE_WINDOW_CLOSED
          - state_machines.Domain.ACTIVE_to_ACTIVE
        distinguishing_aspect: "Numeric-instant boundary on the renewal grace window via POST /domains/{id}/renew: renewal AT exactly grace_deadline (expires_on + 45 days) is allowed (<= semantics); one second after is rejected with ERR_GRACE_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z, schedule effective, ACTIVE registrar, non-premium domain 1y (expires 2027-01-15T00:00:00Z, grace_deadline 2027-03-01T00:00:00Z)."
