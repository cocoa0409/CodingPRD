              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_a: "$.data.id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "WATERWORKS", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-05-01", final_maturity_date: "2054-05-01", original_par_amount_cents: 60000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_b: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_b}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_b: "$.data.id", und_b_v: "$.data.version" }
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_b}", agent_name: "Keystone Filing Agents", effective_date: "2026-07-20", expiration_date: "2027-06-30", retainer_cents: 250000, expected_undertaking_version: "${und_b_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_b: "$.data.id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_a}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-07-28" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { notice_a: "$.data.id" }
            - call: "POST /disclosure/material-event-notices/${notice_a}/determine"
              payload: { determination: "MATERIAL", determination_note: "Successor trustee appointed." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { notice_a_status: "$.data.status" }
            - call: "GET /disclosure/bond-issues/${issue_a}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { issue_a_v: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_a}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${notice_a}", expected_issue_version: "${issue_a_v}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { filing_a: "$.data.id" }
          trigger:
            - call: "POST /disclosure/filings/${filing_a}/submit"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_role_submit: "$.data.error_id" }
            - call: "POST /disclosure/filings/${filing_a}/confirm"
              payload: { repository_receipt_id: "EMMA-RCPT-90001" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_role_confirm: "$.data.error_id" }
            - call: "POST /disclosure/filings/${filing_a}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_b}"
              captures: { e_arm_a: "$.data.error_id" }
            - call: "POST /disclosure/filings/${filing_a}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_a}"
              captures: { sub_status: "$.data.status", sub_eng: "$.data.submitting_engagement_id", sub_attempts: "$.data.submission_attempt_count" }
            - call: "POST /disclosure/filings/${filing_a}/confirm"
              payload: { repository_receipt_id: "EMMA-RCPT-90002" }
              as: DisseminationAgent
              as_user_id: "${eng_b}"
              captures: { e_arm_b: "$.data.error_id" }
