  - method: POST
    path: "/franchise/compliance-audits/{id}/complete"
    description: "Complete an IN_PROGRESS audit with a finding"
    roles: [BrandAuditor]
    code: 200
    input: [finding]
    output: ComplianceAudit
    side_effects: ["ComplianceAudit IN_PROGRESS -> COMPLETED", "on FAIL: create DefaultCase BRAND_STANDARDS OPEN"]
  - method: POST
    path: "/franchise/compliance-audits/{id}/cancel"
    description: "Cancel a SCHEDULED audit"
    roles: [BrandAuditor]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["ComplianceAudit SCHEDULED -> CANCELLED"]
  - method: GET
    path: "/franchise/agreements/{id}/deidentification-tasks"
    description: "Reverse-reachability: list de-identification tasks of an agreement"
    roles: [FranchisorOps, FranchiseeAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DeidentificationTask[]"
    side_effects: []
  - method: POST
    path: "/franchise/deidentification-tasks/{id}/complete"
    description: "Franchisee marks a task complete (own brokerage only)"
    roles: [FranchiseeAdmin]
    code: 200
    input: []
    output: DeidentificationTask
    side_effects: ["DeidentificationTask PENDING -> COMPLETED"]
  - method: POST
    path: "/franchise/deidentification-tasks/{id}/verify"
    description: "Franchisor verifies a completed task; last verify closes the agreement"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: DeidentificationTask
    side_effects: ["DeidentificationTask COMPLETED -> VERIFIED", "possibly Agreement DEIDENTIFYING -> CLOSED and Brokerage FRANCHISED -> TERMINATED"]
  - method: POST
    path: "/franchise/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). The server's startup default is exactly 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time. Forward-only."
    roles: [FranchisorOps]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["expire ACTIVE agreements whose term_end < new date (ACTIVE -> EXPIRED sweep)"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or unrecognized X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "role not permitted for this endpoint per RBAC"
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "entity-backed caller does not own the target resource's brokerage scope"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target entity is not in a state from which the requested transition exists"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_agreement_version does not match current agreement version"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "payload shape / enum / range violation"
  - id: ERR_TERRITORY_CONFLICT
    http: 409
    condition: "brand already granted in this market by a live agreement"
  - id: ERR_INVALID_TERM
    http: 422
    condition: "term_end not after term_start, or renewal term_start before prior term_end"
  - id: ERR_COUNCIL_INELIGIBLE_MEMBER
    http: 422
    condition: "council member brokerage fails council_seat_eligibility"
  - id: ERR_DUPLICATE_REPORT
    http: 409
    condition: "report already exists for (agreement_id, period_month)"
  - id: ERR_DUPLICATE_PERIOD
    http: 409
    condition: "royalty period already exists for (agreement_id, period_month)"
  - id: ERR_GCI_REPORT_MISSING
    http: 422
    condition: "assessment requested for a month with no GCI report"
  - id: ERR_INSUFFICIENT_FUND_BALANCE
    http: 422
    condition: "proposal amount exceeds brand ad fund balance at execute"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "voting brokerage already voted on this proposal"
  - id: ERR_NOT_COUNCIL_MEMBER
    http: 403
    condition: "voting brokerage is not a seated council member"
  - id: ERR_WAIVE_REQUIRES_ZERO_DUE
    http: 422
    condition: "waive attempted on a period with royalty_due_cents > 0"
  - id: ERR_TERMINATION_REQUIRES_ESCALATED_DEFAULT
    http: 422
    condition: "terminate attempted with no ESCALATED default case"
  - id: ERR_SUSPENSION_REQUIRES_OPEN_DEFAULT
    http: 422
    condition: "suspend attempted with open_cure_count == 0"
  - id: ERR_CONVERSION_INCOMPLETE
    http: 422
    condition: "activate attempted without a ready conversion plan"
  - id: ERR_MILESTONE_INVALID
    http: 422
    condition: "milestone sequence out of range or already done"
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "logical clock set backwards"
  - id: ERR_AGREEMENT_NOT_LIVE
    http: 409
    condition: "report or assessment attempted while agreement is not ACTIVE or SUSPENDED"
  - id: ERR_DUPLICATE_LICENSE
    http: 409
    condition: "agent license_no already registered under this brokerage"
  - id: ERR_BROKERAGE_TERMINATED
    http: 409
    condition: "agent create or reactivate attempted under a TERMINATED brokerage"
  - id: ERR_BRAND_OR_BROKERAGE_INACTIVE
    http: 409
    condition: "agreement create against a RETIRED brand or TERMINATED brokerage"
  - id: ERR_RENEWAL_TARGET_INVALID
    http: 422
    condition: "renewed_from_id missing, wrong brokerage, or wrong brand"
  - id: ERR_VOTER_IN_DEFAULT
    http: 403
    condition: "voting brokerage has an ESCALATED default on the proposal's brand (segregation of duties)"
  - id: ERR_DEIDENTIFICATION_INCOMPLETE
    http: 422
    condition: "agreement close blocked: not all five task categories present and verified"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FranchisorOps
    description: "Franchisor operations staff; administers brands, markets, agreements, billing, defaults, terminations, councils, proposals, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /franchise/brands"
      - "POST /franchise/markets"
      - "POST /franchise/brokerages"
      - "POST /franchise/agreements"
      - "POST /franchise/agreements/{id}/amend"
      - "POST /franchise/agreements/{id}/activate"
      - "POST /franchise/agreements/{id}/suspend"
      - "POST /franchise/agreements/{id}/terminate"
      - "POST /franchise/agreements/{id}/royalty-periods"
      - "POST /franchise/royalty-periods/{id}/settle"
      - "POST /franchise/royalty-periods/{id}/waive"
      - "POST /franchise/agreements/{id}/default-cases"
      - "POST /franchise/default-cases/{id}/start-cure"
      - "POST /franchise/default-cases/{id}/escalate"
      - "POST /franchise/default-cases/{id}/resolve"
      - "POST /franchise/advisory-councils"
      - "POST /franchise/advisory-councils/{id}/replace-member"
      - "POST /franchise/ad-fund-proposals"
      - "POST /franchise/ad-fund-proposals/{id}/submit"
      - "POST /franchise/ad-fund-proposals/{id}/execute"
      - "POST /franchise/deidentification-tasks/{id}/verify"
      - "POST /franchise/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints per §1.5 roles lists"
      - "POST /franchise/agreements/{id}/agent-count-reports (shared with FranchiseeAdmin)"
      - "POST /franchise/agreements/{id}/gci-reports (shared with FranchiseeAdmin)"
      - "POST /franchise/agreements/{id}/conversion-plans"
      - "POST /franchise/conversion-plans/{id}/milestones/complete (shared with FranchiseeAdmin)"
      - "POST /franchise/agreements/{id}/compliance-audits (shared with BrandAuditor)"
  - name: FranchiseeAdmin
    description: "Admin of a franchisee brokerage; identity equals the brokerage id; files reports, votes on councils, completes de-identification tasks, manages own agents"
    identity: "entity_backed:Brokerage"
    exclusive_operations:
      - "POST /franchise/agents/{id}/deactivate"
      - "POST /franchise/agents/{id}/reactivate"
      - "POST /franchise/ad-fund-proposals/{id}/votes"
      - "POST /franchise/deidentification-tasks/{id}/complete"
    shared_operations:
      - "GET endpoints per §1.5 roles lists"
      - "POST /franchise/brokerages/{id}/agents (shared with FranchisorOps)"
      - "POST /franchise/agreements/{id}/agent-count-reports"
      - "POST /franchise/agreements/{id}/gci-reports"
      - "POST /franchise/conversion-plans/{id}/milestones/complete"
  - name: BrandAuditor
    description: "Compliance auditor; schedules and runs brand-standards audits"
    identity: "opaque"
    exclusive_operations:
      - "POST /franchise/compliance-audits/{id}/start"
      - "POST /franchise/compliance-audits/{id}/complete"
      - "POST /franchise/compliance-audits/{id}/cancel"
    shared_operations:
      - "GET endpoints per §1.5 roles lists"
      - "POST /franchise/agreements/{id}/compliance-audits (shared with FranchisorOps)"
