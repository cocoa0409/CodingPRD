      - name: coaching_hours_cap_inclusive_and_admin_fee_band_strict_less_than
        grounds:
          - calculations.coaching_allocation_cost
          - validations[priority=57]
          - entities.CoachingAllocation.fields.allocated_hours
          - entities.CoachingAllocation.fields.admin_fee_cents
          - entities.CoachingAllocation.fields.total_cost_cents
          - entities.Provider.fields.current_tier
        distinguishing_aspect: |
          Boundary metrics 3 and 4 on POST /providers/{provider_id}/coaching-allocations, a
          third endpoint and two metrics unrelated to reliability or weighted_total:
          allocated_hours 40.0 exactly equals COACHING_HOURS_CAP[1] and is accepted while
          40.1 is rejected with ERR_COACHING_HOURS_CAP_EXCEEDED, and the ADMIN_FEE_RATE
          breakpoint is strict < so base_hours_cost_cents 50000 takes 0.09 (fee 4500,
          total 54500) while 49999 takes 0.12 (fee 6000, total 55999).
        test_recipe:
          setup:
            - "Clock left at 2026-08-01T00:00:00Z."
            - "One ENROLLED provider with current_tier null, so effective_tier == 1, COACHING_HOURS_CAP[1] == 40.0 and TIER_SPEND_CAP_CENTS[1] == 900000."
            - "No grant exists; every allocation is funded from STATE, so spend_cap_cents == min(900000, STATE_BASE_CAP_CENTS 500000) == 500000 and never binds for these three requests."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateAdministrator
            - call: "POST /providers"
              payload: { legal_name: "Fee Band Edge Center", license_number: "LIC-2207-J", county_code: "ADA", region_code: "URBAN", licensed_capacity: 35, active_staff_fte: 5.0, weekly_onsite_cap_hours: 10 }
              as: StateAdministrator
              captures: { p9_id: $.data.id }
            - call: "POST /providers/${p9_id}/enrollment-decisions"
              payload: { decision: "APPROVE" }
              as: StateAdministrator
          trigger:
            - call: "POST /providers/${p9_id}/coaching-allocations"
              payload: { coach_user_id: "coach-21", funding_source: "STATE", period_start: "2026-08-03", period_end: "2026-11-30", allocated_hours: 40.0, hourly_rate_cents: 1250 }
              as: StateAdministrator
              captures: { a9_at_cap: $.data.id, a9_cap_base: $.data.base_hours_cost_cents, a9_cap_fee: $.data.admin_fee_cents, a9_cap_total: $.data.total_cost_cents, a9_cap_limit: $.data.spend_cap_cents }
            - call: "POST /providers/${p9_id}/coaching-allocations"
              payload: { coach_user_id: "coach-21", funding_source: "STATE", period_start: "2026-08-03", period_end: "2026-11-30", allocated_hours: 40.1, hourly_rate_cents: 1250 }
              as: StateAdministrator
            - call: "POST /providers/${p9_id}/coaching-allocations"
              payload: { coach_user_id: "coach-22", funding_source: "STATE", period_start: "2026-08-03", period_end: "2026-11-30", allocated_hours: 1.0, hourly_rate_cents: 49999 }
              as: StateAdministrator
              captures: { a9_below: $.data.id, a9_below_base: $.data.base_hours_cost_cents, a9_below_fee: $.data.admin_fee_cents, a9_below_total: $.data.total_cost_cents }
          assert:
            - "Provider.${p9_id}.current_tier == null"
            - "${a9_cap_base} == 50000"
            - "${a9_cap_fee} == 4500"
            - "${a9_cap_total} == 54500"
            - "${a9_cap_limit} == 500000"
            - "CoachingAllocation.${a9_at_cap}.allocated_hours == 40.0"
            - "CoachingAllocation.${a9_at_cap}.status == PROPOSED"
            - "trigger call 2 responds 422 with error_id ERR_COACHING_HOURS_CAP_EXCEEDED"
            - "${a9_below_base} == 49999"
            - "${a9_below_fee} == 6000"
            - "${a9_below_total} == 55999"
            - "CoachingAllocation.${a9_below}.admin_fee_cents == 6000"
            - "CoachingAllocation.${a9_at_cap}.admin_fee_cents == 4500"
