# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3124_charity_specialty_pediatric_hospital_admission_without_family
#
# Breadth probe: every testable claim §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by §1.8 appear as excluded_because stubs with no test_recipe.
#
# Shared fixture notes:
#   - Clock default 2026-09-01T00:00:00Z; most instances set it explicitly.
#   - Standard accepted-application chain: hospital (cap 5) -> program
#     (ORTHOPEDIC 0..215 non-staged) -> source RS1 (US) -> application
#     (DOB 2020-01-01) -> open-review -> vote 2 -> vote 1 -> decide ACCEPT.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: hospital_create_returns_all_declared_fields_and_defaults
        claim_type: Creation
        grounds:
          - entities.SpecialtyHospital
          - endpoints.POST_/charity-care/hospitals
        distinguishing_aspect: "A hospital created with the seven required inputs returns 201 with status OPEN, admissions_ytd 0, version 1, and server-minted id/created_at/updated_at — status and admissions_ytd are never client-settable."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Empty database."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
          assert:
            - "response status 201 and response_type object"
            - "SpecialtyHospital.${h1}.status == OPEN and admissions_ytd == 0 and version == 1"
            - "id, created_at, updated_at are non-null; created_at == 2026-09-01T00:00:00.000Z (logical clock)"

      - name: program_get_round_trips_stored_configuration
        claim_type: Retrieval
        grounds:
          - entities.SpecialtyProgram
          - endpoints.GET_/charity-care/programs/{programId}
        distinguishing_aspect: "Every program configuration field (category, accepts_international, min/max age months, staged_care_required, hospital_id) round-trips through GET exactly as posted."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 exists."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "SPINAL_CORD", accepts_international: true, min_age_months: 12, max_age_months: 216, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /charity-care/programs/${p1}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-1"
          assert:
            - "SpecialtyProgram.${p1}.category == SPINAL_CORD and accepts_international == true"
            - "SpecialtyProgram.${p1}.min_age_months == 12 and max_age_months == 216"
            - "SpecialtyProgram.${p1}.staged_care_required == false and status == ACTIVE"
            - "SpecialtyProgram.${p1}.hospital_id == ${h1}"

      - name: applications_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/charity-care/applications
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three applications on file, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; status filter narrows the set without changing envelope shape."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 (cap 5), program P1 (ORTHOPEDIC 0..215), source RS1. Three applications submitted (all SUBMITTED)."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid A", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid B", patient_date_of_birth: "2019-06-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid C", patient_date_of_birth: "2021-03-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
          trigger:
            - call: "GET /charity-care/applications"
              payload: { limit: 2, offset: 0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
          assert:
            - "response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /charity-care/applications?limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET /charity-care/applications?status=SUBMITTED returns 3 rows"
            - "GET /charity-care/applications?status=ACCEPTED returns 0 rows"
            - "GET /charity-care/applications with no query params uses limit 10 offset 0 defaults"

      - name: application_get_unknown_id_returns_application_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/charity-care/applications/{applicationId}
          - errors.ERR_APPLICATION_NOT_FOUND
        distinguishing_aspect: "A well-formed but unallocated application id produces the entity-specific 404 ERR_APPLICATION_NOT_FOUND, not a generic 404 and not a 400."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Empty database."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "GET /charity-care/applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 and err == ERR_APPLICATION_NOT_FOUND"
            - "response_type is error and data carries error_id and message"

      - name: application_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.PatientApplication.fields.condition_category
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "condition_category is a required input with no default: omitting it entirely is a 400 ERR_INVALID_REQUEST, NOT the 422 ERR_CONDITION_OUT_OF_SCOPE that an in-range-but-mismatched value would produce."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1, program P1 (ORTHOPEDIC 0..215), source RS1 exist."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
          trigger:
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Missing", patient_date_of_birth: "2020-01-01T00:00:00Z", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 and err == ERR_INVALID_REQUEST"
            - "err != ERR_CONDITION_OUT_OF_SCOPE"
            - "GET /charity-care/applications returns 0 rows"

      - name: application_create_omitting_family_ability_defaults_declined
        claim_type: Defaults
        grounds:
          - entities.PatientApplication.fields.family_ability_to_pay
        distinguishing_aspect: "family_ability_to_pay defaults to DECLINED_TO_STATE when omitted; the value is stored for statistics only and the application still reaches SUBMITTED with review_round 1."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1, program P1 (ORTHOPEDIC 0..215), source RS1 exist."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
          trigger:
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Default", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id }
          assert:
            - "PatientApplication.${a1}.family_ability_to_pay == DECLINED_TO_STATE"
            - "PatientApplication.${a1}.status == SUBMITTED and review_round == 1"

      - name: application_computed_age_and_international_flags
        claim_type: Computed Fields
        grounds:
          - entities.PatientApplication.fields.age_at_submission_months
          - entities.PatientApplication.fields.is_international
        distinguishing_aspect: "age_at_submission_months (floor of whole months from DOB to the logical clock) and is_international (referral source country != US) are computed at creation: DOB 2020-01-15 at clock 2026-09-01 gives 79 months (not 80), and a MX referral source flips is_international true."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1, program P1 (ORTHOPEDIC 0..215, accepts_international true), sources RS-US (US) and RS-MX (MX)."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: true, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. US", contact_email: "us@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs_us: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "INTERNATIONAL_PARTNER", display_name: "Partner MX", contact_email: "mx@example.org", country_code: "MX" }
              as: NetworkAdmin
              captures: { rs_mx: $.data.id }
          trigger:
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid US", patient_date_of_birth: "2020-01-15T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs_us}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a_us: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid MX", patient_date_of_birth: "2020-01-15T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs_mx}", program_id: "${p1}", home_latitude: 19.4, home_longitude: -99.1 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a_mx: $.data.id }
          assert:
            - "PatientApplication.${a_us}.age_at_submission_months == 79   # 2020-01-15 -> 2026-09-01 is 79 whole months (day 15 not reached)"
            - "PatientApplication.${a_us}.is_international == false"
            - "PatientApplication.${a_mx}.age_at_submission_months == 79"
            - "PatientApplication.${a_mx}.is_international == true"

      - name: application_create_client_supplied_system_fields_are_ignored_input
        claim_type: System Fields
        grounds:
          - entities.PatientApplication.fields.status
          - entities.PatientApplication.fields.review_round
        distinguishing_aspect: "status and review_round are source: system; a client sending status ACCEPTED and version 99 in the create body gets a SUBMITTED application with review_round 1 and version 1 — supplied system fields are ignored, not rejected."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1, program P1 (ORTHOPEDIC 0..215), source RS1 exist."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
          trigger:
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Sneaky", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0, status: "ACCEPTED", version: 99, review_round: 7 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id }
          assert:
            - "response status 201"
            - "PatientApplication.${a1}.status == SUBMITTED and review_round == 1 and version == 1"

      - name: program_create_out_of_enum_category_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.SpecialtyProgram.fields.category
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "category is a closed 5-member enum; a value like CARDIOLOGY is rejected 400 ERR_INVALID_REQUEST and no program row is persisted."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 exists."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "CARDIOLOGY", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 and err == ERR_INVALID_REQUEST"
            - "GET /charity-care/hospitals/${h1}/programs returns 0 rows"

      - name: application_create_body_fks_checked_in_declared_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - endpoints.POST_/charity-care/applications
          - errors.ERR_REFERRAL_SOURCE_NOT_FOUND
          - errors.ERR_PROGRAM_NOT_FOUND
        distinguishing_aspect: "The hybrid topology puts referral_source_id and program_id in the body; priority 4 checks them in declared input order — with BOTH unknown the answer is ERR_REFERRAL_SOURCE_NOT_FOUND; with only program_id unknown it is ERR_PROGRAM_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Source RS1 exists; no program exists."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
          trigger:
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid X", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "00000000-0000-4000-8000-000000000001", program_id: "00000000-0000-4000-8000-000000000002", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { err_both: $.data.error_id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Y", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "00000000-0000-4000-8000-000000000002", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { err_prog: $.data.error_id }
          assert:
            - "first request returns 404 and err_both == ERR_REFERRAL_SOURCE_NOT_FOUND"
            - "err_both != ERR_PROGRAM_NOT_FOUND"
            - "second request returns 404 and err_prog == ERR_PROGRAM_NOT_FOUND"

      - name: application_review_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.ApplicationReview
        distinguishing_aspect: "ApplicationReview is common_fields: false — it has id and created_at but no version/updated_at, and no update or delete endpoint exists in §1.5; the review log is append-only."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1, program P1 (ORTHOPEDIC 0..215), source RS1; application A1 submitted and opened."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Log", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id }
            - call: "POST /charity-care/applications/${a1}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
          trigger:
            - call: "GET /charity-care/applications/${a1}/reviews"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
          assert:
            - "the reviews list returns exactly 1 row with action == OPEN_ROUND and round_number == 1"
            - "the row carries id and created_at and carries NO version field"
            - "the row's reviewer_user_id == \"rcm-1\""

  # ===========================================================================
  - section: state_machines
    instances:

      - name: application_initial_state_is_submitted
        claim_type: initial_state
        grounds:
          - state_machines.PatientApplication
        distinguishing_aspect: "A freshly created application is SUBMITTED with review_round 1 — never PENDING_REVIEW (that requires the explicit open-review action)."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1, program P1 (ORTHOPEDIC 0..215), source RS1 exist."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
