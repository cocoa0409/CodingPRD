      - name: support_pass_reentry_returns_to_checked_in_and_advances_reentry_count_to_one
        claim_type: Valid Transition
        grounds:
          - state_machines.SupportPersonPass.CHECKED_OUT_to_CHECKED_IN
          - entities.SupportPersonPass.fields.reentry_count
          - entities.SupportPersonPass.fields.checked_in_at
          - entities.SupportPersonPass.fields.checked_out_at
          - entities.SupportPersonPass.fields.valid_until
          - endpoints[POST /support-person-passes/{passId}/check-in]
          - validations[priority=8.1]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The cyclic CHECKED_OUT -> CHECKED_IN edge is NOT a plain repeat of the ISSUED -> CHECKED_IN
          edge: it is the only entry that increments reentry_count, which is what the priority-8.1
          REENTRY_LIMIT (3) bound counts. So after one lap reentry_count must be exactly 1 — not 0
          (as it stayed on the first, ISSUED-sourced check-in) and not 2. checked_out_at must be
          cleared back to null, checked_in_at must be re-stamped to the NEW clock instant 06:30, and
          valid_until must stay pinned at the original issuance + 24h: re-entry does not renew a pass.
        test_recipe:
          setup: |
            Identical fixture to the double-check-out instance, taken to the same state: a PARTNER
            pass on an ANTEPARTUM encounter, checked in at 06:00 and checked out at 06:00, with the
            clock then moved to 06:30. clock_now 06:30 is still strictly before valid_until
            2026-08-02T06:00:00Z, no cesarean event is mobilized, and the room holds zero checked-in
            passes, so the check-in clears 11.6 and the inclusive priority-15 occupancy test.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
