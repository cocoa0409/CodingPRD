      - name: battery_health_unknown_vehicle_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.POST_/evfleet/vehicles/{id}/battery-health
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Existence is validated on the path id before any telematics state check: unknown vehicle id on a battery report is 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock set; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /evfleet/vehicles/11111111-2222-3333-4444-555555555555/battery-health"
              payload: { measured_soh_pct: 90.0, measured_at: "2026-09-02T00:00:00Z" }
              as: TelematicsIngestion
