  - rule_id: compensating_invariant
    instances:
      - name: claim_dispute_restores_patient_deductible_ledger
        grounds:
          - state_machines.BillingClaim.FINALIZED_to_DISPUTED
          - entities.Patient.fields.deductible_applied_cents
          - entities.Patient.fields.oop_applied_cents
          - state_machines.BillingClaim.DISPUTED_to_REPRICED
        distinguishing_aspect: |
          The compensated quantity is a pair of money ledgers on Patient, and the compensation is
          exact: finalize commits 150000 deductible and 167740 out-of-pocket cents, dispute subtracts
          exactly those two numbers while leaving every money field on the claim untouched, and a
          subsequent reprice against unchanged booking and pathology state must reproduce the identical
          167740 - proving no drift entered the ledgers during the round trip.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "Plan P1 (deductible 150000, diagnostic coinsurance 0.20, out-of-pocket max 400000, DIAGNOSTIC_CONVERTED carveout, anesthesia unbundled)"
            - "Patient with both ledgers at 0"
            - "MAC block on 2026-09-15 with coverage, one 45-minute booking, exam completed with 2 polyps and 2 specimens, report finalized"
            - "So the claim is REPRICED at allowed 238700 with deductible_applied 150000 and patient_responsibility 167740"
