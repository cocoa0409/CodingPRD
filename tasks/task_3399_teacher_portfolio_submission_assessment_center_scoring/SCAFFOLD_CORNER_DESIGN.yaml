        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE with IN_PROGRESS CKA submission; booking at 2027-01-20T14:00; center capacity 5."]
          setup_api_calls:
            - *c_clk
