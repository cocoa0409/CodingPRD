  # ---------------- Program of study authoring and approval ----------
  - method: POST
    path: "/cte/programs-of-study"
    description: "Create a program of study in DRAFT with clna_phase NOT_STARTED."
    roles: [CteDirector]
    code: 201
    input: [cip_code, title, cluster, labor_market_data_asof]
    output: ProgramOfStudy
    side_effects: ["sets authored_by_user_id to X-User-ID", "sets approval_status DRAFT and clna_phase NOT_STARTED", "sets version 1", "initialises alignment_index null and all three credit totals 0"]

  - method: PATCH
    path: "/cte/programs-of-study/{id}"
    description: "Amend the descriptive attributes of a program of study while it is not STATE_APPROVED."
    roles: [CteDirector]
    code: 200
    input: ["title?", "cluster?", "labor_market_data_asof?"]
    output: ProgramOfStudy
    side_effects: ["increments version by 1"]

  - method: POST
    path: "/cte/programs-of-study/{id}/sequence-courses"
    description: "Add a course to the secondary-to-postsecondary sequence."
    roles: [CteDirector]
    code: 201
    input: [code, title, segment, position, credit_hours, "articulated_credit_hours?", "articulation_verified?", "prerequisite_course_id?", "status?"]
    output: SequenceCourse
    side_effects: ["computes depth_from_root by walking prerequisite_course_id", "recomputes ProgramOfStudy.secondary_credit_total, postsecondary_credit_total, articulated_credit_total, alignment_index and alignment_index_variant", "increments ProgramOfStudy.version by 1"]

  - method: PATCH
    path: "/cte/sequence-courses/{id}"
    description: "Revise a sequence course's credits, articulation flag, prerequisite or status."
    roles: [CteDirector]
    code: 200
    input: ["status?", "credit_hours?", "articulated_credit_hours?", "articulation_verified?", "prerequisite_course_id?", "position?"]
    output: SequenceCourse
    side_effects: ["recomputes depth_from_root for this course and every transitive dependent", "recomputes the parent ProgramOfStudy credit totals, alignment_index and alignment_index_variant", "increments version by 1 on the course and on the parent ProgramOfStudy"]

  - method: POST
    path: "/cte/programs-of-study/{id}/credentials"
    description: "Add an industry-recognized credential to the program's approved credential list."
    roles: [CteDirector]
    code: 201
    input: [code, title, tier, "exam_required?"]
    output: Credential
    side_effects: ["sets counts_toward_indicator true when tier is NATIONAL or STATE_RECOGNIZED, false when tier is LOCAL", "increments ProgramOfStudy.version by 1"]

  - method: POST
    path: "/cte/programs-of-study/{id}/clna-advance"
    description: "Advance the comprehensive local needs assessment one phase along NOT_STARTED -> DATA_COLLECTION -> STAKEHOLDER_CONSULTATION -> GAP_ANALYSIS -> CERTIFIED, or re-open a CERTIFIED/EXPIRED assessment by advancing to DATA_COLLECTION."
    roles: [CteDirector, StateComplianceReviewer]
    code: 200
    input: [to_phase, "evidence_url?"]
    output: ProgramOfStudy
    side_effects: ["on to_phase CERTIFIED sets clna_certified_on to the current_utc date, clna_expires_on to that date plus 730 days, clna_certified_by_user_id to X-User-ID", "on to_phase DATA_COLLECTION from CERTIFIED or EXPIRED clears clna_certified_on, clna_expires_on and clna_certified_by_user_id", "increments version by 1"]

  - method: POST
    path: "/cte/programs-of-study/{id}/submit"
    description: "Submit a DRAFT or CHANGES_REQUESTED program of study for advisory-committee review."
    roles: [CteDirector]
    code: 200
    input: [narrative_url]
    output: ProgramOfStudy
    side_effects: ["approval_status DRAFT|CHANGES_REQUESTED -> SUBMITTED", "increments approval_round by 1", "clears open_finding_codes", "increments version by 1"]

  - method: POST
    path: "/cte/programs-of-study/{id}/request-changes"
    description: "Return a COMMITTEE_REVIEW program to the district with compliance findings."
    roles: [StateComplianceReviewer]
    code: 200
    input: [finding_codes, "note?"]
    output: ProgramOfStudy
    side_effects: ["approval_status COMMITTEE_REVIEW -> CHANGES_REQUESTED", "replaces open_finding_codes with finding_codes", "increments version by 1"]

  - method: POST
    path: "/cte/programs-of-study/{id}/state-approve"
    description: "Grant state approval to a COMMITTEE_REVIEW program of study, unlocking federal expenditure certification."
    roles: [StateComplianceReviewer]
    code: 200
    input: ["approval_note?"]
    output: ProgramOfStudy
    side_effects: ["approval_status COMMITTEE_REVIEW -> STATE_APPROVED", "sets federal_reporting_eligible true", "pins alignment_index_variant to FEDERAL_CERTIFIED and recomputes alignment_index under that variant", "increments version by 1"]

  - method: POST
    path: "/cte/programs-of-study/{id}/students"
    description: "Enroll a student in a program of study as a PARTICIPANT."
    roles: [SchoolRegistrar]
    code: 201
    input: [state_student_id, cohort_year, "special_population_codes?"]
    output: Student
    side_effects: ["sets cte_credits_earned 0 and concentrator_status PARTICIPANT", "recomputes PerformanceIndicator.denominator_count for every indicator on this program with a matching cohort_year"]

  - method: POST
    path: "/cte/students/{id}/credit-postings"
    description: "Post a signed credit delta earned by a student in one sequence course; a negative delta reverses an earlier posting."
    roles: [SchoolRegistrar]
    code: 200
    input: [sequence_course_id, credit_delta, posted_on]
    output: Student
    side_effects: ["adds credit_delta to cte_credits_earned", "re-runs calculations.concentrator_cohort_classification, which may move concentrator_status between PARTICIPANT and CONCENTRATOR in either direction", "recomputes denominator_count, small_cohort_flag, preliminary_actual_pct and preliminary_status_projection on every matching PerformanceIndicator", "increments version by 1"]

  - method: POST
    path: "/cte/students/{id}/exit"
    description: "Record a student's exit from the program with a federal exit reason."
    roles: [SchoolRegistrar]
    code: 200
    input: [exited_on, exit_reason]
    output: Student
    side_effects: ["sets exited_on and exit_reason", "recomputes numerator_count on every matching PerformanceIndicator", "increments version by 1"]

  - method: POST
    path: "/cte/students/{id}/credential-attainments"
    description: "Record an immutable credential attainment for a student."
    roles: [SchoolRegistrar, CteDirector]
    code: 201
    input: [credential_id, attained_on, "exam_score?", verification_status]
    output: CredentialAttainment
    side_effects: ["sets counted_for_indicator true only when verification_status is VERIFIED and the Credential has counts_toward_indicator true", "recomputes Credential.verified_attainment_count and Student.verified_qualifying_attainment_count", "recomputes numerator_count and preliminary_actual_pct on every matching PerformanceIndicator"]

  # ---------------- Advisory committee and meeting documentation ------
  - method: POST
    path: "/cte/programs-of-study/{id}/advisory-committees"
    description: "Charter an advisory committee for a program of study. Guarded by optimistic concurrency on the parent program's version."
    roles: [CteDirector]
    code: 201
    input: [name, quorum_min_members, employer_seat_min, expected_program_of_study_version]
    output: AdvisoryCommittee
    side_effects: ["increments ProgramOfStudy.version by 1", "sets status FORMING, active_member_count 0, employer_member_count 0, chair_member_id null"]

  - method: POST
    path: "/cte/advisory-committees/{id}/members"
    description: "Seat a member in a named committee seat for a fixed term."
    roles: [CteDirector]
    code: 201
    input: [full_name, sector, seat_code, term_start_on, term_end_on, "is_chair?"]
    output: CommitteeMember
    side_effects: ["recomputes AdvisoryCommittee.active_member_count and employer_member_count over members with status ACTIVE", "sets AdvisoryCommittee.chair_member_id to this member's id when is_chair is true", "flips AdvisoryCommittee.status FORMING -> ACTIVE the moment active_member_count >= quorum_min_members AND employer_member_count >= employer_seat_min AND chair_member_id is non-null", "increments AdvisoryCommittee.version by 1"]

  - method: POST
    path: "/cte/advisory-committees/{id}/meetings"
    description: "Schedule a committee meeting with a declared agenda kind. Only the seated chair of that committee may schedule."
    roles: [CommitteeChair]
    code: 201
    input: [agenda_kind, scheduled_for]
    output: CommitteeMeeting
    side_effects: ["sets minutes_status SCHEDULED", "increments AdvisoryCommittee.version by 1"]

  - method: POST
    path: "/cte/committee-meetings/{id}/minutes"
    description: "File or amend the minutes of a meeting, recording attendance and the endorsement vote. Only the seated chair of the owning committee may file."
    roles: [CommitteeChair]
    code: 200
    input: [held_at, attendee_member_ids, vote_yes, vote_no, minutes_url, "amendment_reason?"]
    output: CommitteeMeeting
    side_effects: ["runs calculations.committee_quorum_evaluation to set eligible_attendee_count, employer_attendee_count and quorum_met", "sets endorsement_passed true only when quorum_met is true and vote_yes > vote_no", "minutes_status SCHEDULED -> FINALIZED when amendment_reason is null, FINALIZED -> AMENDED when it is non-null", "when agenda_kind is POS_ENDORSEMENT and endorsement_passed becomes true, drives the parent ProgramOfStudy SUBMITTED -> COMMITTEE_REVIEW and increments its version by 1", "increments version by 1"]

  # ---------------- Federal grant, budgeting and allowable use -------
  - method: POST
    path: "/cte/grant-awards"
    description: "Record a federal grant award with its obligation window."
    roles: [GrantFiscalOfficer]
    code: 201
    input: [fiscal_year, allocation_cents, obligation_window_start, obligation_window_end]
    output: GrantAward
    side_effects: ["sets status OPEN", "sets admin_cap_cents to round_half_up(allocation_cents * 0.05)", "sets direct_obligated_cents 0, indirect_pool_cents 0, obligated_cents 0, admin_obligated_cents 0, remaining_cents = allocation_cents, indirect_rate to the tier for a direct total of 0 (0.0812)"]

  - method: POST
    path: "/cte/grant-awards/{id}/expenditures"
    description: "Request an equipment, consumable, administration, professional-development or entertainment charge against a grant award. Guarded by optimistic concurrency on the grant's version."
    roles: [CteDirector]
    code: 201
    input: [pos_id, category, description, unit_cost_cents, quantity, service_period_start, service_period_end, "asset_tag?", expected_grant_award_version]
    output: Expenditure
    side_effects: ["increments GrantAward.version by 1", "sets requested_by_user_id to X-User-ID", "sets status REQUESTED, gross_cents = unit_cost_cents * quantity, federal_share_pct per calculations.expenditure_federal_share, approved_cents null until certification"]

  - method: POST
    path: "/cte/expenditures/{id}/certify-allowability"
    description: "Certify or disallow a requested expenditure under the federal allowable-use rules. The certifier may not be the requester."
    roles: [GrantFiscalOfficer]
    code: 200
    input: [decision, "finding_code?"]
    output: Expenditure
    side_effects: ["on CERTIFY sets approved_cents per calculations.expenditure_federal_share and certified_by_user_id to X-User-ID, and status REQUESTED -> CERTIFIED", "on DISALLOW sets finding_code and status REQUESTED -> DISALLOWED with approved_cents left null", "re-runs calculations.grant_obligation_rollup from scratch over the grant's countable expenditures, rewriting direct_obligated_cents, indirect_rate, indirect_pool_cents, obligated_cents, admin_obligated_cents and remaining_cents", "increments Expenditure.version and GrantAward.version by 1"]

  - method: POST
    path: "/cte/expenditures/{id}/obligate"
    description: "Record the purchase order that obligates a certified expenditure."
    roles: [GrantFiscalOfficer]
    code: 200
    input: [obligation_reference]
    output: Expenditure
    side_effects: ["status CERTIFIED -> OBLIGATED", "sets obligation_reference", "increments version by 1"]

  - method: POST
    path: "/cte/expenditures/{id}/void"
    description: "Void a certified or obligated expenditure, releasing its federal share back to the award."
    roles: [GrantFiscalOfficer]
    code: 200
    input: [void_reason]
    output: Expenditure
    side_effects: ["status CERTIFIED|OBLIGATED -> VOIDED", "sets approved_cents to null", "re-runs calculations.grant_obligation_rollup from scratch, restoring remaining_cents exactly to its pre-certification value", "increments Expenditure.version and GrantAward.version by 1"]

  # ---------------- Teacher certification pathways -------------------
  - method: POST
    path: "/cte/programs-of-study/{id}/educators"
    description: "Assign an educator to a program of study on a declared certification route."
    roles: [CteDirector]
    code: 201
    input: [full_name, certification_route, claimed_industry_hours, credential_expires_on]
    output: Educator
    side_effects: ["sets status PROVISIONAL and verified_industry_hours 0", "increments ProgramOfStudy.version by 1"]

  - method: POST
    path: "/cte/educators/{id}/verify-industry-hours"
    description: "Verify a tranche of documented industry experience hours toward the educator's certification route."
    roles: [StateComplianceReviewer]
    code: 200
    input: [verified_hours, verification_source]
    output: Educator
    side_effects: ["adds verified_hours to verified_industry_hours", "status PROVISIONAL -> ELIGIBLE once verified_industry_hours >= 4000 for route INDUSTRY_EXPERIENCE, >= 2000 for route ALTERNATIVE, and >= 0 for route TRADITIONAL; otherwise the row stays PROVISIONAL", "lazy PROVISIONAL|ELIGIBLE -> LAPSED when current_utc date > credential_expires_on", "increments version by 1"]

  # ---------------- Performance indicators and negotiation -----------
  - method: POST
    path: "/cte/programs-of-study/{id}/performance-indicators"
    description: "Open a federal performance indicator for a reporting year at its baseline level."
    roles: [StateComplianceReviewer]
    code: 201
    input: [indicator_code, reporting_year, baseline_pct, cohort_year]
    output: PerformanceIndicator
    side_effects: ["sets status PROPOSED, negotiation_round 0, negotiated_level_pct null, consecutive_miss_count 0", "computes denominator_count, numerator_count, small_cohort_flag, preliminary_actual_pct and preliminary_status_projection over the existing student population for the given cohort_year"]

  - method: POST
    path: "/cte/performance-indicators/{id}/negotiation-offers"
    description: "Table a negotiated-level offer. The two negotiating parties must alternate; the same user or role may not table two consecutive offers. Once the indicator is ARBITRATED the negotiation budget is spent and this call is refused with ERR_NEGOTIATION_ROUNDS_EXHAUSTED."
    roles: [CteDirector, StateComplianceReviewer]
    code: 200
    input: [offered_level_pct, "rationale?"]
    output: PerformanceIndicator
    side_effects: ["increments negotiation_round by 1", "sets last_offer_pct, last_offer_by_user_id and last_offer_by_role", "status PROPOSED -> NEGOTIATING, or NEGOTIATING -> NEGOTIATING, or NEGOTIATING -> ARBITRATED when negotiation_round is already 4, in which case the offered level is discarded and negotiated_level_pct is set to baseline_pct with met_threshold_pct = round_half_up(baseline_pct * 0.90, 2)", "increments version by 1"]

  - method: POST
    path: "/cte/performance-indicators/{id}/accept-level"
    description: "Accept the standing offer as the negotiated level. The accepter may not be the party that tabled the offer. Once the indicator is ARBITRATED this call is refused with ERR_NEGOTIATION_ROUNDS_EXHAUSTED."
    roles: [CteDirector, StateComplianceReviewer]
    code: 200
    input: ["acceptance_note?"]
    output: PerformanceIndicator
    side_effects: ["sets negotiated_level_pct to last_offer_pct and met_threshold_pct to round_half_up(negotiated_level_pct * 0.90, 2)", "status NEGOTIATING -> AGREED", "increments version by 1"]

  - method: POST
    path: "/cte/performance-indicators/{id}/close-reporting-year"
    description: "Close the reporting year: freeze the final actual, score it against the negotiated level, and cascade any sanction."
    roles: [StateComplianceReviewer]
    code: 200
    input: [closed_on]
    output: PerformanceIndicator
    side_effects: ["runs calculations.performance_indicator_actual under variant FINAL_SMALL_COHORT_ADJUSTED to set actual_pct", "sets closed_on", "status -> NOT_SCORED when denominator_count == 0, -> MET when actual_pct >= met_threshold_pct, else -> NOT_MET", "cascade link 1: increments consecutive_miss_count on a miss, resets it to 0 on MET, leaves it unchanged on NOT_SCORED", "cascade link 2: NOT_MET -> IMPROVEMENT_REQUIRED when consecutive_miss_count reaches 2", "cascade link 3: drives the parent ProgramOfStudy STATE_APPROVED -> SUSPENDED", "cascade link 4: moves every REQUESTED Expenditure on that program to BLOCKED", "increments version by 1 on every entity it touches"]

  - method: POST
    path: "/cte/performance-indicators/{id}/improvement-plans"
    description: "Draft a local improvement plan for an indicator that requires one."
    roles: [CteDirector]
    code: 201
    input: [milestones, "funding_expenditure_id?"]
    output: ImprovementPlan
    side_effects: ["sets status DRAFT, revision_round 0, milestone_count to the length of milestones"]

  - method: POST
    path: "/cte/improvement-plans/{id}/submit"
    description: "Submit a draft or returned improvement plan to the state for review."
    roles: [CteDirector]
    code: 200
    input: ["submission_note?"]
    output: ImprovementPlan
    side_effects: ["status DRAFT|RETURNED -> SUBMITTED", "sets submitted_at to current_utc", "increments version by 1"]

  - method: POST
    path: "/cte/improvement-plans/{id}/return"
    description: "Return a submitted improvement plan for revision, or reject it finally once the revision budget is spent."
    roles: [StateComplianceReviewer]
    code: 200
    input: [return_reason]
    output: ImprovementPlan
    side_effects: ["appends return_reason to return_reasons", "increments revision_round by 1", "status SUBMITTED -> RETURNED while the incremented revision_round is strictly below 3, or SUBMITTED -> REJECTED_FINAL when the incremented revision_round equals 3", "on REJECTED_FINAL drives the parent PerformanceIndicator IMPROVEMENT_REQUIRED -> SANCTIONED", "increments version by 1"]

  - method: POST
    path: "/cte/improvement-plans/{id}/accept"
    description: "Accept a submitted improvement plan, lifting the sanction cascade off the program of study."
    roles: [StateComplianceReviewer]
    code: 200
    input: ["acceptance_note?"]
    output: ImprovementPlan
    side_effects: ["status SUBMITTED -> ACCEPTED and sets accepted_at to current_utc", "cascade link 2: parent PerformanceIndicator IMPROVEMENT_REQUIRED -> MONITORING with consecutive_miss_count reset to 0", "cascade link 3: that program's ProgramOfStudy SUSPENDED -> CHANGES_REQUESTED", "cascade link 4: every BLOCKED Expenditure on that program returns to REQUESTED", "increments version by 1 on every entity it touches"]

  # ---------------- Test-driving endpoint ----------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every date and window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [CteDirector, StateComplianceReviewer, GrantFiscalOfficer, CommitteeChair, SchoolRegistrar]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["subsequent requests evaluate every temporal rule against the new current_utc; no stored entity is mutated by this call"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:

  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the five declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the called endpoint, or a CommitteeChair caller's X-User-ID is not the ACTIVE chair CommitteeMember of the target committee."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID already performed the incompatible earlier step: authored the program being CLNA-certified, requested the expenditure being certified, or tabled the standing negotiation offer being answered."

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, out-of-range number, malformed date/datetime, duplicate special_population_codes, or an interval whose end precedes its start."

  # ---- existence ----
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No ProgramOfStudy matches the {id} path segment or the pos_id in the body."
  - id: ERR_COURSE_NOT_FOUND
    http: 404
    condition: "No SequenceCourse matches the {id} path segment, the prerequisite_course_id, or the sequence_course_id in the body."
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "No Credential matches the {id} path segment or the credential_id in the body."
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "No Student matches the {id} path segment."
  - id: ERR_ATTAINMENT_NOT_FOUND
    http: 404
    condition: "No CredentialAttainment matches the {id} path segment."
  - id: ERR_COMMITTEE_NOT_FOUND
    http: 404
    condition: "No AdvisoryCommittee matches the {id} path segment."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "No CommitteeMember matches the {id} path segment."
  - id: ERR_MEETING_NOT_FOUND
    http: 404
    condition: "No CommitteeMeeting matches the {id} path segment."
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "No GrantAward matches the {id} path segment."
  - id: ERR_EXPENDITURE_NOT_FOUND
    http: 404
    condition: "No Expenditure matches the {id} path segment or the funding_expenditure_id in the body."
  - id: ERR_INDICATOR_NOT_FOUND
    http: 404
    condition: "No PerformanceIndicator matches the {id} path segment."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No ImprovementPlan matches the {id} path segment."
  - id: ERR_EDUCATOR_NOT_FOUND
    http: 404
    condition: "No Educator matches the {id} path segment."

  # ---- optimistic concurrency ----
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_of_study_version does not equal the target ProgramOfStudy.version."
  - id: ERR_STALE_GRANT_VERSION
    http: 412
    condition: "expected_grant_award_version does not equal the target GrantAward.version."

  # ---- state machine ----
  - id: ERR_INVALID_APPROVAL_TRANSITION
    http: 409
    condition: "The requested approval_status transition is not declared from the program's current approval_status."
  - id: ERR_INVALID_CLNA_PHASE_TRANSITION
    http: 409
    condition: "to_phase is not the declared successor of the program's current clna_phase (only CERTIFIED and EXPIRED may jump back to DATA_COLLECTION)."
  - id: ERR_INVALID_EXPENDITURE_STATE
    http: 409
    condition: "Certification, obligation or voiding attempted from an expenditure status that does not declare that transition, including any write against a DISALLOWED or VOIDED row."
  - id: ERR_INVALID_INDICATOR_STATE
    http: 409
    condition: "Offer, acceptance or year-close attempted from an indicator status that does not declare that transition, including any write against MET, NOT_SCORED or SANCTIONED."
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "Submit, return or accept attempted from a plan status that does not declare that transition, including any write against ACCEPTED or REJECTED_FINAL."
  - id: ERR_INVALID_MEETING_STATE
    http: 409
    condition: "Minutes filed against a meeting whose minutes_status is already AMENDED, or an amendment filed against a SCHEDULED meeting."
  - id: ERR_INVALID_EDUCATOR_STATE
    http: 409
    condition: "Industry-hour verification attempted against an Educator whose status is already LAPSED."

  # ---- cross-entity and compliance gates ----
  - id: ERR_POS_NOT_APPROVED
    http: 422
    condition: "The expenditure's ProgramOfStudy is not STATE_APPROVED."
  - id: ERR_CLNA_NOT_CERTIFIED
    http: 422
    condition: "The governing program's clna_phase is not in {CERTIFIED, EXPIRED} — its comprehensive local needs assessment has never been certified."
  - id: ERR_CLNA_EXPIRED
    http: 422
    condition: "The governing program's certified needs assessment lapsed: current_utc date is past clna_expires_on (clna_certified_on + 730 days)."
  - id: ERR_GRANT_WINDOW_CLOSED
    http: 422
    condition: "current_utc date falls outside the grant's inclusive [obligation_window_start, obligation_window_end]."
  - id: ERR_LABOR_MARKET_DATA_STALE
    http: 422
    condition: "labor_market_data_asof is more than 730 days before current_utc when leaving DATA_COLLECTION."
  - id: ERR_UNALLOWABLE_USE
    http: 422
    condition: "Certification attempted on an ENTERTAINMENT expenditure, which federal rules never allow."
  - id: ERR_CAPITAL_REVIEW_REQUIRED
    http: 422
    condition: "Certification attempted on an EQUIPMENT expenditure with unit_cost_cents >= 500000 without a finalized, quorate EQUIPMENT_REVIEW meeting held within the last 365 days."
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "eligible_attendee_count is below the committee's quorum_min_members."
  - id: ERR_EMPLOYER_SEAT_SHORTFALL
    http: 422
    condition: "employer_attendee_count is below employer_seat_min, or employers hold strictly less than half of eligible attendance."
  - id: ERR_VOTE_COUNT_EXCEEDS_ATTENDANCE
    http: 422
    condition: "vote_yes + vote_no exceeds eligible_attendee_count."
  - id: ERR_PREREQUISITE_INVALID
    http: 422
    condition: "The named prerequisite belongs to another program, is the course itself, is a POSTSECONDARY course named by a SECONDARY course, or sits at a position that is not strictly earlier."
  - id: ERR_PREREQUISITE_CYCLE
    http: 422
    condition: "Following prerequisite_course_id from the written course revisits a course already on the walk."
  - id: ERR_SEQUENCE_INCOMPLETE
    http: 422
    condition: "Submit attempted without at least one ACTIVE SECONDARY course and at least one ACTIVE POSTSECONDARY course."
  - id: ERR_CREDENTIAL_LIST_EMPTY
    http: 422
    condition: "Submit attempted with no Credential on the program's approved list."
  - id: ERR_NO_ELIGIBLE_INSTRUCTOR
    http: 422
    condition: "Submit attempted with no Educator on the program in status ELIGIBLE after the lazy lapse re-evaluation."
  - id: ERR_CLNA_STAKEHOLDER_EVIDENCE_MISSING
    http: 422
    condition: "Advance to GAP_ANALYSIS attempted with fewer than 2 finalized, quorate CLNA_STAKEHOLDER meetings on file."
  - id: ERR_COMMITTEE_ENDORSEMENT_MISSING
    http: 422
    condition: "State approval attempted without a finalized POS_ENDORSEMENT meeting whose endorsement_passed is true."
  - id: ERR_ALIGNMENT_INDEX_BELOW_FLOOR
    http: 422
    condition: "State approval attempted while the FEDERAL_CERTIFIED alignment index is strictly below 0.7500."
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 422
    condition: "A negotiation-offers or accept-level call is made against a PerformanceIndicator that is already ARBITRATED, so the four-round negotiation budget is spent and the arbitrated level is binding; also returned when accept-level is attempted with last_offer_pct null."
  - id: ERR_MILESTONES_INSUFFICIENT
    http: 422
    condition: "Improvement-plan submission attempted with fewer than 3 milestones."
  - id: ERR_PLAN_FUNDING_INVALID
    http: 422
    condition: "The plan's funding_expenditure_id points at an expenditure that is not CERTIFIED or OBLIGATED, or that is charged to a different program."
  - id: ERR_INDUSTRY_HOURS_EXCEED_CLAIM
    http: 422
    condition: "verified_hours is below 1, or the running verified_industry_hours would exceed claimed_industry_hours."
  - id: ERR_CREDENTIAL_PROGRAM_MISMATCH
    http: 422
    condition: "The credential being attained belongs to a different program than the student."
  - id: ERR_EXAM_SCORE_REQUIRED
    http: 422
    condition: "exam_score omitted for a credential whose exam_required is true."
  - id: ERR_CREDIT_POSTING_BLOCKED
    http: 422
    condition: "Credit posting or exit attempted while the student's program is SUSPENDED."
  - id: ERR_COURSE_NOT_ACTIVE
    http: 422
    condition: "The credit posting names a course that belongs to another program or whose status is not ACTIVE."
  - id: ERR_CREDIT_BALANCE_NEGATIVE
    http: 422
    condition: "The signed credit_delta would drive cte_credits_earned below zero."
  - id: ERR_ADMIN_CAP_EXCEEDED
    http: 422
    condition: "Certifying this ADMINISTRATION charge would push admin_obligated_cents past admin_cap_cents (5% of the allocation)."
  - id: ERR_GRANT_FUNDS_EXCEEDED
    http: 422
    condition: "Certifying this charge would drive the recomputed remaining_cents below zero."

  # ---- overlap and uniqueness ----
  - id: ERR_SEAT_TERM_OVERLAP
    http: 409
    condition: "The new seat term overlaps an ACTIVE incumbent's half-open [term_start_on, term_end_on) on the same seat_code."
  - id: ERR_ASSET_PERIOD_OVERLAP
    http: 409
    condition: "The new tagged-asset service period falls within 14 days of a live expenditure's period for the same asset_tag on the same award."
  - id: ERR_DUPLICATE_ATTAINMENT
    http: 409
    condition: "A CredentialAttainment already exists for this (student_id, credential_id) pair."
  - id: ERR_CIP_CODE_DUPLICATE
    http: 409
    condition: "Another ProgramOfStudy already uses this cip_code."
  - id: ERR_COURSE_CODE_DUPLICATE
    http: 409
    condition: "Another SequenceCourse on the same program already uses this code."
  - id: ERR_CREDENTIAL_CODE_DUPLICATE
    http: 409
    condition: "Another Credential on the same program already uses this code."
  - id: ERR_STUDENT_ID_DUPLICATE
    http: 409
    condition: "Another Student on the same program already uses this state_student_id."
  - id: ERR_FISCAL_YEAR_DUPLICATE
    http: 409
    condition: "Another GrantAward already exists for this fiscal_year."
  - id: ERR_INDICATOR_DUPLICATE
    http: 409
    condition: "Another PerformanceIndicator already exists for this (pos_id, indicator_code, reporting_year)."
  - id: ERR_CHAIR_ALREADY_SEATED
    http: 409
    condition: "is_chair true while the committee already has an ACTIVE member with is_chair true."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:

  - name: CteDirector
    description: "District career and technical education director: authors programs of study, builds the course sequence and credential list, charters advisory committees, requests grant expenditures, hires educators and drafts improvement plans."
    identity: "opaque"
    exclusive_operations:
      - "POST /cte/programs-of-study"
      - "PATCH /cte/programs-of-study/{id}"
      - "POST /cte/programs-of-study/{id}/sequence-courses"
      - "PATCH /cte/sequence-courses/{id}"
      - "POST /cte/programs-of-study/{id}/credentials"
      - "POST /cte/programs-of-study/{id}/submit"
      - "POST /cte/programs-of-study/{id}/advisory-committees"
      - "POST /cte/advisory-committees/{id}/members"
      - "POST /cte/grant-awards/{id}/expenditures"
      - "POST /cte/programs-of-study/{id}/educators"
      - "POST /cte/performance-indicators/{id}/improvement-plans"
      - "POST /cte/improvement-plans/{id}/submit"
    shared_operations:
      - "POST /cte/programs-of-study/{id}/clna-advance"
      - "POST /cte/students/{id}/credential-attainments"
      - "POST /cte/performance-indicators/{id}/negotiation-offers"
      - "POST /cte/performance-indicators/{id}/accept-level"
      - "POST /_clock/set_current_utc"
      - "every GET in §1.5 except the student roster and educator roster, which it also reads"

  - name: StateComplianceReviewer
    description: "State CTE compliance reviewer: certifies needs assessments, returns findings, grants state approval, verifies industry-experience hours, opens indicators, negotiates levels, closes reporting years and rules on improvement plans."
    identity: "opaque"
    exclusive_operations:
      - "POST /cte/programs-of-study/{id}/request-changes"
      - "POST /cte/programs-of-study/{id}/state-approve"
      - "POST /cte/educators/{id}/verify-industry-hours"
      - "POST /cte/programs-of-study/{id}/performance-indicators"
      - "POST /cte/performance-indicators/{id}/close-reporting-year"
      - "POST /cte/improvement-plans/{id}/return"
      - "POST /cte/improvement-plans/{id}/accept"
    shared_operations:
      - "POST /cte/programs-of-study/{id}/clna-advance"
      - "POST /cte/performance-indicators/{id}/negotiation-offers"
      - "POST /cte/performance-indicators/{id}/accept-level"
      - "POST /_clock/set_current_utc"
      - "every GET in §1.5"

  - name: GrantFiscalOfficer
    description: "Federal grant fiscal officer: records awards, certifies allowable use, obligates and voids expenditures. Never authors programs and never requests the charges it certifies."
    identity: "opaque"
    exclusive_operations:
      - "POST /cte/grant-awards"
      - "POST /cte/expenditures/{id}/certify-allowability"
      - "POST /cte/expenditures/{id}/obligate"
      - "POST /cte/expenditures/{id}/void"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET in §1.5 except the student roster, student detail, credential-attainment reads and educator reads"

  - name: CommitteeChair
    description: "Seated chair of one advisory committee: schedules that committee's meetings and files or amends its minutes. X-User-ID is the chair's own CommitteeMember id."
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /cte/advisory-committees/{id}/meetings"
      - "POST /cte/committee-meetings/{id}/minutes"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "the program, sequence, credential, committee, member, meeting, grant, expenditure, indicator and plan GETs in §1.5"

  - name: SchoolRegistrar
    description: "High-school registrar: enrolls students, posts and reverses course credits, records exits and files credential attainments."
    identity: "opaque"
    exclusive_operations:
      - "POST /cte/programs-of-study/{id}/students"
      - "POST /cte/students/{id}/credit-postings"
      - "POST /cte/students/{id}/exit"
    shared_operations:
      - "POST /cte/students/{id}/credential-attainments"
      - "POST /_clock/set_current_utc"
      - "the program, sequence, credential, student and credential-attainment GETs in §1.5"
