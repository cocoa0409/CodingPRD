            - call: "POST /rail/train-plans/${p1}/activate"
              payload: { expected_train_plan_version: "${p1_v}" }
              as: NetworkPlanner
            - call: "POST /rail/train-plans/${p2}/activate"
              payload: { expected_train_plan_version: "${p2_v}" }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 3 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "LP-UP0001", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { l1: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "LP-UP0002", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { l2: $.data.id }
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p1}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${l1}", car_count_planned: 5, crew_hours_estimated: 6 }
              as: TerminalSuperintendent
              captures: { d1: $.data.id }
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p2}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${l2}", car_count_planned: 5, crew_hours_estimated: 6 }
              as: TerminalSuperintendent
              captures: { d2: $.data.id }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/train-departures/${d2}/finalize"
