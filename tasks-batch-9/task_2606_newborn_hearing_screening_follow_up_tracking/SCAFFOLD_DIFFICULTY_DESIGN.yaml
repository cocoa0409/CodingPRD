          assert:
            - "GET /facilities/${bh_id}/performance returns cohort_screened_rate == 1.0000, encounter_screened_rate == 1.0000, followup_resolution_rate == null, report_timeliness_rate == 1.0"
            - "Facility.${bh_id}.performance_score == null AND Facility.${bh_id}.encounter_basis_performance_score == null — not 0.00, and not 70.00 from re-normalising over the two non-empty weights"
            - "Facility.${bh_id}.last_closed_period_label is non-null and Facility.${bh_id}.reporting_compliance_status == COMPLIANT (a null score never moves posture)"
            - "FacilityReport.${rep_id}.assessed_penalty_points == 0 and Facility.${bh_id}.penalty_points_balance == 0"
            - "ReportingPeriod.${per_id}.status == CLOSED with facilities_assessed_count == 1 and episodes_escalated_count == 0 and episodes_lost_count == 0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: suspended_birth_facility_blocks_screening_encounter_probation_allows_it
        grounds:
          - validations.priority_14_ERR_FACILITY_SUSPENDED
          - calculations.reporting_penalty_assessment
          - entities.Facility.fields.reporting_compliance_status
          - endpoints.POST_facilities_id_penalty_adjustments
          - endpoints.POST_screening_encounters
        distinguishing_aspect: |
          Entity pair (Facility -> ScreeningEncounter): whether a screen may be recorded at all
          depends on a state field of a DIFFERENT entity — the facility's posture. At balance 18
          the facility is SUSPENDED and the identical encounter is refused; remitting one point
          drops it to 17 / PROBATION and the very same request succeeds, so the dependency is
          tested in both polarities with the posture threshold as the only moving part.
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1 and infant U born 2026-08-02T00:00:00Z (registration is never blocked by posture)."
            - "A manual penalty adjustment of +18 points pushes BH1 to penalty_points_balance 18, i.e. SUSPENDED (>= 18)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-02T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-U", guardian_contact_phone: "5551101" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { u_id: "$.data.id" }
            - call: "POST /facilities/${bh_id}/penalty-adjustments"
              payload: { points_delta: 18, reason: "suspension for chronic non-reporting" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /screening-encounters"
              payload: { infant_id: "${u_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-02T05:00:00Z", left_ear_result: "REFER", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /facilities/${bh_id}/penalty-adjustments"
              payload: { points_delta: -1, reason: "one point remitted on appeal" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /screening-encounters"
              payload: { infant_id: "${u_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-02T05:00:00Z", left_ear_result: "REFER", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { enc_id: "$.data.id" }
          assert:
            - "First attempt: HTTP 409 with data.error_id == ERR_FACILITY_SUSPENDED while Facility.${bh_id}.penalty_points_balance == 18 and reporting_compliance_status == SUSPENDED"
            - "First attempt left no trace: Infant.${u_id}.screening_status is still NOT_SCREENED and GET /screening-encounters?infant_id=${u_id} returns total_count 0"
            - "After the -1 remit: Facility.${bh_id}.penalty_points_balance == 17 and reporting_compliance_status == PROBATION"
            - "Second attempt: HTTP 201 with ScreeningEncounter.${enc_id}.overall_result == REFER and before_discharge == true"
            - "Infant.${u_id}.screening_status == REFERRED and a RESCREEN FollowUpEpisode now exists in PENDING_SCHEDULING"

      - name: infant_screening_status_gates_diagnostic_submit_both_polarities
        grounds:
          - validations.priority_24_ERR_INFANT_NOT_REFERRED
          - state_machines.DiagnosticEvaluation.DRAFT_to_PENDING_ATTESTATION
          - entities.Infant.fields.screening_status
          - endpoints.POST_diagnostic_evaluations_id_submit
        distinguishing_aspect: |
          A DIFFERENT entity pair (Infant -> DiagnosticEvaluation): the evaluation's own status is
          a perfectly valid DRAFT, but the submit is gated on the infant's screening_status. With
          consent GRANTED (so no higher-priority safety rule masks it) the same submit is refused
          while the infant is NOT_SCREENED and accepted the moment a REFER screen moves the
          infant to REFERRED — the evaluation row itself never changes in between.
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with audiologist A1."
            - "Infant W2 born 2026-08-02T00:00:00Z with guardian_consent_status GRANTED and no screen yet, so screening_status is NOT_SCREENED."
            - "A DIAGNOSTIC episode is opened for W2 and a DRAFT evaluation is created against it."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-02T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-W2", guardian_contact_phone: "5551201", guardian_consent_status: "GRANTED" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { w2_id: "$.data.id" }
            - call: "GET /infants/${w2_id}"
              payload: {}
              as: ProgramAdmin
              captures: { w2_ver: "$.data.version" }
            - call: "POST /follow-up-episodes"
              payload: { infant_id: "${w2_id}", episode_type: "DIAGNOSTIC", expected_infant_version: "${w2_ver}" }
              as: ProgramAdmin
              captures: { ep_w2_id: "$.data.id" }
            - call: "POST /diagnostic-evaluations"
              payload: { infant_id: "${w2_id}", episode_id: "${ep_w2_id}", facility_id: "${ac_id}", performed_by_provider_id: "${a1_id}", evaluation_datetime: "2026-08-02T06:00:00Z", method: "DIAGNOSTIC_ABR" }
              as: Audiologist
              as_user_id: "${a1_id}"
              captures: { ev_w2_id: "$.data.id" }
          trigger:
            - call: "POST /diagnostic-evaluations/${ev_w2_id}/submit"
              payload: { left_ear_threshold_db: 40, right_ear_threshold_db: 15, outcome: "UNILATERAL_LOSS" }
              as: Audiologist
              as_user_id: "${a1_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${w2_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-02T05:00:00Z", left_ear_result: "REFER", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /diagnostic-evaluations/${ev_w2_id}/submit"
              payload: { left_ear_threshold_db: 40, right_ear_threshold_db: 15, outcome: "UNILATERAL_LOSS" }
              as: Audiologist
              as_user_id: "${a1_id}"
          assert:
            - "First submit: HTTP 409 with data.error_id == ERR_INFANT_NOT_REFERRED, and DiagnosticEvaluation.${ev_w2_id}.status is still DRAFT with outcome == null"
            - "After the REFER screen: Infant.${w2_id}.screening_status == REFERRED and no second episode was created because the DIAGNOSTIC episode ${ep_w2_id} is already active"
            - "Second submit (byte-identical body): HTTP 200, DiagnosticEvaluation.${ev_w2_id}.status == PENDING_ATTESTATION with outcome == UNILATERAL_LOSS and left_ear_threshold_db == 40"
            - "Infant.${w2_id}.screening_status == DIAGNOSTIC_IN_PROGRESS after the successful submit"

  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_clinic_slot_half_open_overlap_rejects_but_touching_slots_allowed
        grounds:
          - validations.priority_32_ERR_SLOT_OVERLAP
          - endpoints.POST_clinic_slots
          - entities.ClinicSlot.fields.starts_at
          - entities.ClinicSlot.fields.ends_at
          - errors.ERR_SLOT_OVERLAP
        distinguishing_aspect: |
          Resource entity 1 = ClinicSlot, interval semantics = HALF-OPEN INTERSECTION on one
          provider's calendar. [09:30, 10:30) intersects [09:00, 10:00) and is rejected;
          [10:00, 11:00) merely touches the end instant and is accepted; the same rejected window
          is accepted for a different provider, proving the exclusivity is per-provider and not
          per-facility.
        test_recipe:
          setup:
            - "AC1 (AUDIOLOGY_CLINIC, R1) with audiologists A1 and A2, both credential ACTIVE."
            - "A1 already owns one RESCREEN slot [2026-08-10T09:00:00Z, 2026-08-10T10:00:00Z)."
            - "Clock left at the default 2026-08-01T00:00:00Z so every slot is in the future."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A2", region_code: "R1" }
              as: ProgramAdmin
              captures: { a2_id: "$.data.id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a1_id}", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z", slot_type: "RESCREEN", total_capacity: 2 }
              as: FacilityAdmin
              as_user_id: "${ac_id}"
              captures: { base_slot_id: "$.data.id" }
          trigger:
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a1_id}", starts_at: "2026-08-10T09:30:00Z", ends_at: "2026-08-10T10:30:00Z", slot_type: "RESCREEN", total_capacity: 1 }
              as: FacilityAdmin
              as_user_id: "${ac_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a1_id}", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z", slot_type: "RESCREEN", total_capacity: 1 }
              as: FacilityAdmin
              as_user_id: "${ac_id}"
              captures: { touch_slot_id: "$.data.id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a2_id}", starts_at: "2026-08-10T09:30:00Z", ends_at: "2026-08-10T10:30:00Z", slot_type: "RESCREEN", total_capacity: 1 }
              as: FacilityAdmin
              as_user_id: "${ac_id}"
              captures: { other_slot_id: "$.data.id" }
          assert:
            - "Overlapping window for A1: HTTP 409 with data.error_id == ERR_SLOT_OVERLAP (09:30 < 10:00 AND 09:00 < 10:30)"
            - "Touching window for A1: HTTP 201, ClinicSlot.${touch_slot_id}.starts_at == 2026-08-10T10:00:00Z and status == OPEN — equality on the shared instant is not an overlap"
            - "Same rejected window for A2: HTTP 201, ClinicSlot.${other_slot_id}.provider_id == ${a2_id} — exclusivity is scoped to one provider"
            - "GET /clinic-slots?provider_id=${a1_id} returns total_count 2 (the original slot and the touching slot only)"

      - name: family_burden_buffer_rejects_11_hours_apart_but_allows_exactly_24_hours
        grounds:
          - validations.priority_33_ERR_FAMILY_BURDEN_BUFFER
          - endpoints.POST_rescreen_appointments
          - state_machines.RescreenAppointment.BOOKED_to_ATTENDED
          - state_machines.FollowUpEpisode.ESCALATED_DIAGNOSTIC_to_SUPERSEDED
          - errors.ERR_FAMILY_BURDEN_BUFFER
        distinguishing_aspect: |
          A DIFFERENT resource — the family's own calendar, keyed on the Infant across all its
          appointments — and DIFFERENT interval semantics: a point-to-point 24-hour buffer
          between slot start instants rather than an interval intersection. Two slots that do not
          overlap at all (09:00-10:00 and 20:00-21:00 on the same day) are still rejected because
          they are 11 hours apart, while a slot exactly 86400 seconds later is accepted. The live
          appointment being compared against is ATTENDED, not BOOKED.
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with audiologists A1 and A2."
            - "Infant W born 2026-08-02T00:00:00Z; birth screen REFERs, creating a RESCREEN episode."
            - "That episode is booked into A1's RESCREEN slot at 2026-09-10T09:00:00Z, and a rescreen encounter recorded against the appointment REFERs again — so the appointment is ATTENDED and the episode is ESCALATED_DIAGNOSTIC."
            - "A DIAGNOSTIC episode then supersedes it, leaving the infant with one ATTENDED appointment on the 09:00 slot and one bookable episode."
            - "Two DIAGNOSTIC slots exist on A2: 2026-09-10T20:00:00Z (11 h after the attended slot) and 2026-09-11T09:00:00Z (exactly 24 h after)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A2", region_code: "R1" }
              as: ProgramAdmin
              captures: { a2_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-02T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-W", guardian_contact_phone: "5551301" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { w_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${w_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-02T05:00:00Z", left_ear_result: "REFER", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "GET /follow-up-episodes"
              payload: { infant_id: "${w_id}", status: "PENDING_SCHEDULING" }
              as: ProgramAdmin
              captures: { ep_w1_id: "$.data[0].id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a1_id}", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T10:00:00Z", slot_type: "RESCREEN", total_capacity: 1 }
              as: ProgramAdmin
              captures: { slot_w1_id: "$.data.id" }
            - call: "POST /rescreen-appointments"
