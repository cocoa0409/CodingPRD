scenario: |
  1837. Medical Staff Office & Privileging (hospital medical staff office): initial appointment application & primary source verification, privilege delineation by specialty criteria, FPPE/OPPE data collection & evaluation, reappointment cycle every two years & expirables tracking, temporary/emergency privileges & disaster credentialing, adverse action & fair hearing plan, NPDB query & reporting, committee agenda & board approval

domain_name: medical-staff-privileging
api_prefix: /mso

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MedicalStaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Practitioner legal full name" }
      - { name: npdb_subject_id, type: string, source: input, description: "Practitioner's NPDB subject identifier used on queries/reports" }
      - { name: primary_specialty_code, type: string, source: input, description: "Specialty code used to resolve SpecialtyCriteria (e.g. CARD, SURG, EMED)" }
      - { name: membership_status, type: enum, source: system, default: APPLICANT, description: "APPLICANT | ACTIVE | SUSPENDED | TERMINATED | LAPSED — independent axis 1 of parallel state dimensions", constraints: "enum values {APPLICANT, ACTIVE, SUSPENDED, TERMINATED, LAPSED}" }
      - { name: privilege_posture, type: enum, source: system, default: NONE, description: "NONE | FULL | PARTIAL | EMERGENCY_ONLY — derived axis 2 of parallel state dimensions; recomputed from PrivilegeGrant + ExpirableCredential state", constraints: "enum values {NONE, FULL, PARTIAL, EMERGENCY_ONLY}" }
      - { name: current_term_start, type: datetime, source: system, description: "ISO8601 UTC start of the current 2-year appointment term; set on first board ratification, reset on each reappointment ratification" }
      - { name: current_term_end, type: datetime, source: system, description: "= current_term_start + TERM_YEARS years, recomputed by reappointment_term calculation" }
      - { name: active_privilege_line_count, type: integer, source: computed, default: 0, description: "= count of PrivilegeGrant rows for this member with grant_status == ACTIVE; maintained by grant/suspend/reinstate side effects" }
      - { name: credential_expiry_risk_score, type: number, source: computed, default: 0, description: "Computed by credential_expiry_risk_window calculation; drives auto-suspension when >= RISK_SUSPEND_THRESHOLD" }
      - { name: sod_exclusion_tags, type: array, source: system, default: [], description: "Array of case_id strings naming AdverseActionCase ids this member is excluded from hearing-panel duty for (because they proposed or are the subject)" }

  - name: SpecialtyCriteria
    parent: null
    common_fields: true
    fields:
      - { name: specialty_code, type: string, source: input, description: "Unique specialty key; tenant-scoped uniqueness per hospital instance" , constraints: "unique across all SpecialtyCriteria rows"}
      - { name: privilege_line, type: string, source: input, description: "Named privilege line within the specialty (e.g. CARD-CATH, SURG-GENERAL)" }
      - { name: min_training_months, type: integer, source: input, description: "Minimum accredited training months required for the line" }
      - { name: min_case_volume_24mo, type: integer, source: input, description: "Minimum documented cases in the trailing 24 months" }
      - { name: required_board_cert, type: boolean, source: input, description: "Whether an unexpired board-certification ExpirableCredential of credential_kind BOARD_CERT is mandatory" }
      - { name: fppe_case_count, type: integer, source: input, description: "Number of proctored FPPE cases required before the line flips from PROVISIONAL to CONFIRMED" }
      - { name: volume_tier_table, type: array, source: input, description: "Array of {tier_name, min_cases, score_multiplier} rows, ascending min_cases; used by privilege_delineation_satisfaction tier selection" }

  - name: AppointmentApplication
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> MedicalStaffMember.id; the applicant" }
      - { name: application_kind, type: enum, source: input, description: "INITIAL | REAPPOINTMENT", constraints: "enum values {INITIAL, REAPPOINTMENT}" }
      - { name: application_status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | PSV_IN_PROGRESS | PSV_COMPLETE | COMMITTEE_REVIEW | BOARD_REVIEW | APPROVED | DENIED | WITHDRAWN | EXPIRED", constraints: "enum values {DRAFT, SUBMITTED, PSV_IN_PROGRESS, PSV_COMPLETE, COMMITTEE_REVIEW, BOARD_REVIEW, APPROVED, DENIED, WITHDRAWN, EXPIRED}" }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped at SUBMIT transition; reappointment window checks measure against this" }
      - { name: verification_complete_count, type: integer, source: computed, default: 0, description: "= count of VerificationItem rows for this application with item_status == VERIFIED" }
      - { name: verification_required_count, type: integer, source: computed, default: 0, description: "= count of VerificationItem rows for this application with item_status != WAIVED" }
      - { name: supersedes_application_id, type: string, source: input, description: "FK -> AppointmentApplication.id; self-referential — a REAPPOINTMENT application may supersede a still-pending earlier application of the same member", constraints: "nullable; must reference application of same member" }
      - { name: decision_reason, type: string, source: input, description: "Free-text reason captured on DENIED transition", constraints: "nullable; required on deny" }

  - name: VerificationItem
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> AppointmentApplication.id; parent application" }
      - { name: item_kind, type: enum, source: input, description: "MEDICAL_SCHOOL | RESIDENCY | BOARD_CERT | STATE_LICENSE | DEA | MALPRACTICE_HISTORY | WORK_HISTORY | NPDB_QUERY | REFERENCES", constraints: "enum values {MEDICAL_SCHOOL, RESIDENCY, BOARD_CERT, STATE_LICENSE, DEA, MALPRACTICE_HISTORY, WORK_HISTORY, NPDB_QUERY, REFERENCES}" }
      - { name: item_status, type: enum, source: system, default: PENDING, description: "PENDING | REQUESTED | RECEIVED | VERIFIED | DISCREPANCY | WAIVED", constraints: "enum values {PENDING, REQUESTED, RECEIVED, VERIFIED, DISCREPANCY, WAIVED}" }
      - { name: requested_at, type: datetime, source: system, description: "Server-stamped at REQUEST transition" }
      - { name: verified_at, type: datetime, source: system, description: "Server-stamped at VERIFY transition; null until verified", constraints: "nullable" }
      - { name: discrepancy_note, type: string, source: input, description: "Required on FLAG_DISCREPANCY transition", constraints: "nullable; min length 10 when present" }
      - { name: waiver_justification, type: string, source: input, description: "Required on WAIVE transition", constraints: "nullable; min length 20 when present" }
      - { name: is_primary_source, type: boolean, source: input, description: "True when the item must be verified directly with the issuing source; primary-source items cannot be waived except by policy override" }

  - name: PrivilegeDelineation
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> AppointmentApplication.id; delineation request rides on an application" }
      - { name: privilege_line, type: string, source: input, description: "Requested privilege line; must match a SpecialtyCriteria.privilege_line for the member's primary_specialty_code" }
      - { name: documented_training_months, type: integer, source: input, description: "Applicant-attested accredited training months" }
      - { name: documented_cases_24mo, type: integer, source: input, description: "Applicant-attested case volume in trailing 24 months" }
      - { name: delineation_status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | CRITERIA_MET | CRITERIA_UNMET | GRANTED | DENIED", constraints: "enum values {REQUESTED, CRITERIA_MET, CRITERIA_UNMET, GRANTED, DENIED}" }
      - { name: satisfaction_tier, type: string, source: computed, description: "Tier name selected by privilege_delineation_satisfaction; null until evaluation", constraints: "nullable" }
      - { name: satisfaction_score, type: number, source: computed, description: "Numeric score from privilege_delineation_satisfaction; null until evaluation", constraints: "nullable" }

  - name: PrivilegeGrant
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> MedicalStaffMember.id; grant holder" }
      - { name: delineation_id, type: string, source: input, description: "FK -> PrivilegeDelineation.id; the evaluated delineation this grant satisfies" }
      - { name: privilege_line, type: string, source: system, description: "Copied from PrivilegeDelineation.privilege_line at grant time" }
      - { name: grant_status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | ACTIVE | SUSPENDED | EXPIRED | REVOKED | RELINQUISHED", constraints: "enum values {PROVISIONAL, ACTIVE, SUSPENDED, EXPIRED, REVOKED, RELINQUISHED}" }
      - { name: effective_from, type: datetime, source: input, description: "Start of grant interval (inclusive lower bound)" }
      - { name: effective_until, type: datetime, source: input, description: "End of grant interval (exclusive upper bound — half-open [from, until) semantics); must equal member.current_term_end at creation for non-temporary grants", }
      - { name: fppe_cases_completed, type: integer, source: system, default: 0, description: "Count of FPPE-passed PerformanceMetric rows linked to this grant; grant flips PROVISIONAL->ACTIVE when this reaches the criteria fppe_case_count" }
      - { name: suspension_reason, type: string, source: system, description: "Set when grant is auto-suspended by expirable-credential cascade; null otherwise", constraints: "nullable" }

  - name: PerformanceReview
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> MedicalStaffMember.id; review subject" }
      - { name: privilege_grant_id, type: string, source: input, description: "FK -> PrivilegeGrant.id; the grant under review" }
      - { name: review_kind, type: enum, source: input, description: "FPPE | OPPE", constraints: "enum values {FPPE, OPPE}" }
      - { name: review_status, type: enum, source: system, default: COLLECTING, description: "COLLECTING | EVALUATION | PROVISIONAL_RESULT | FINAL_RESULT | CLOSED", constraints: "enum values {COLLECTING, EVALUATION, PROVISIONAL_RESULT, FINAL_RESULT, CLOSED}" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the review measurement window" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the review measurement window (half-open)" }
      - { name: provisional_composite_score, type: number, source: computed, description: "fppe_composite_score under provisional variant; null until evaluation", constraints: "nullable" }
      - { name: final_composite_score, type: number, source: computed, description: "fppe_composite_score under final variant; null until finalize", constraints: "nullable" }
      - { name: metric_count, type: integer, source: computed, default: 0, description: "= count of PerformanceMetric rows for this review with metric_status == ACTIVE" }
      - { name: retracted_metric_count, type: integer, source: computed, default: 0, description: "= count of PerformanceMetric rows for this review with metric_status == RETRACTED" }
      - { name: outcome, type: enum, source: system, description: "SATISFACTORY | MARGINAL | UNSATISFACTORY — derived from final_composite_score by oppe_outcome_threshold; null until FINAL_RESULT", constraints: "nullable; enum values {SATISFACTORY, MARGINAL, UNSATISFACTORY}" }

  - name: PerformanceMetric
    parent: null
    common_fields: true
    fields:
      - { name: review_id, type: string, source: input, description: "FK -> PerformanceReview.id; parent review" }
      - { name: metric_domain, type: enum, source: input, description: "CLINICAL_QUALITY | PATIENT_SAFETY | DOCUMENTATION | CITIZENSHIP | UTILIZATION", constraints: "enum values {CLINICAL_QUALITY, PATIENT_SAFETY, DOCUMENTATION, CITIZENSHIP, UTILIZATION}" }
      - { name: raw_value, type: number, source: input, description: "Raw measured value for the domain (e.g. complication count, timeliness %)" }
      - { name: normalized_value, type: number, source: computed, description: "= raw_value mapped through domain normalization table; 0.00-100.00, 2dp round_half_up" }
      - { name: domain_weight, type: number, source: input, description: "Weight of this domain in the composite; all ACTIVE metrics of a review must sum to exactly 1.000 at finalize" }
      - { name: collected_at, type: datetime, source: input, description: "When the data point was measured; must fall inside review [period_start, period_end)" }
      - { name: metric_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETRACTED", constraints: "enum values {ACTIVE, RETRACTED}" }
      - { name: passed_fppe_case, type: boolean, source: input, default: false, description: "True when this metric records a passed proctored FPPE case; drives PrivilegeGrant.fppe_cases_completed" }

  - name: ExpirableCredential
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> MedicalStaffMember.id; credential holder" }
      - { name: credential_kind, type: enum, source: input, description: "STATE_LICENSE | DEA | BOARD_CERT | MALPRACTICE_INSURANCE | ACLS", constraints: "enum values {STATE_LICENSE, DEA, BOARD_CERT, MALPRACTICE_INSURANCE, ACLS}" }
      - { name: credential_number, type: string, source: input, description: "Issuer-assigned identifier" }
      - { name: issued_on, type: datetime, source: input, description: "Issue date" }
      - { name: expires_on, type: datetime, source: input, description: "Expiry instant; credential is lapsed when clock >= expires_on" }
      - { name: credential_status, type: enum, source: system, default: CURRENT, description: "CURRENT | LAPSED | RENEWED | REVOKED", constraints: "enum values {CURRENT, LAPSED, RENEWED, REVOKED}" }
      - { name: supersedes_credential_id, type: string, source: input, description: "FK -> ExpirableCredential.id; self-referential renewal chain", constraints: "nullable" }

  - name: TemporaryPrivilege
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> MedicalStaffMember.id; recipient" }
      - { name: sponsor_member_id, type: string, source: input, description: "FK -> MedicalStaffMember.id; sponsoring ACTIVE member with membership_status == ACTIVE" }
      - { name: temp_kind, type: enum, source: input, description: "TEMPORARY | EMERGENCY | DISASTER", constraints: "enum values {TEMPORARY, EMERGENCY, DISASTER}" }
      - { name: privilege_line, type: string, source: input, description: "Line exercised under the temporary grant" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive lower bound (closed-interval semantics for temp privileges)" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive upper bound (closed interval); EMERGENCY max 24h, DISASTER max 72h, TEMPORARY max 120 days" }
      - { name: temp_status, type: enum, source: system, default: PENDING_SPONSOR, description: "PENDING_SPONSOR | ACTIVE | EXPIRED | TERMINATED_EARLY", constraints: "enum values {PENDING_SPONSOR, ACTIVE, EXPIRED, TERMINATED_EARLY}" }
      - { name: disaster_declaration_ref, type: string, source: input, description: "External disaster declaration reference; required when temp_kind == DISASTER", constraints: "nullable unless DISASTER" }

  - name: AdverseActionCase
    parent: null
    common_fields: true
    fields:
      - { name: subject_member_id, type: string, source: input, description: "FK -> MedicalStaffMember.id; the member under review" }
      - { name: proposed_by_member_id, type: string, source: input, description: "FK -> MedicalStaffMember.id; the DepartmentChief's member record (SoD: proposer is barred from this case's HearingPanel)" }
      - { name: case_kind, type: enum, source: input, description: "SUSPENSION | REVOCATION | DENIAL_OF_REAPPOINTMENT | RESTRICTION", constraints: "enum values {SUSPENSION, REVOCATION, DENIAL_OF_REAPPOINTMENT, RESTRICTION}" }
      - { name: case_status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | MEC_ENDORSED | HEARING_REQUESTED | HEARING_HELD | REMANDED | FINAL_ADVERSE | FINAL_NO_ACTION | WITHDRAWN", constraints: "enum values {PROPOSED, MEC_ENDORSED, HEARING_REQUESTED, HEARING_HELD, REMANDED, FINAL_ADVERSE, FINAL_NO_ACTION, WITHDRAWN}" }
      - { name: proposed_at, type: datetime, source: system, description: "Server-stamped at creation" }
      - { name: hearing_request_deadline, type: datetime, source: system, description: "= proposed_at + HEARING_REQUEST_WINDOW_DAYS days; subject must request hearing by this instant" }
      - { name: hearing_requested_at, type: datetime, source: system, description: "Server-stamped when subject requests hearing; null if waived", constraints: "nullable" }
      - { name: npdb_reportable, type: boolean, source: computed, default: false, description: "True when case_kind in {SUSPENSION, REVOCATION, DENIAL_OF_REAPPOINTMENT} and case reaches FINAL_ADVERSE; RESTRICTION cases are reportable only when restriction_days > 30" }
      - { name: restriction_days, type: integer, source: input, default: 0, description: "Length of privilege restriction when case_kind == RESTRICTION; drives NPDB reportability threshold" }
      - { name: linked_review_id, type: string, source: input, description: "FK -> PerformanceReview.id; OPPE review that evidenced the case", constraints: "nullable" }

  - name: HearingPanel
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> AdverseActionCase.id; the case being heard" }
      - { name: panel_member_id, type: string, source: input, description: "FK -> MedicalStaffMember.id; panelist" }
      - { name: panel_role, type: enum, source: input, description: "CHAIR | MEMBER", constraints: "enum values {CHAIR, MEMBER}" }
      - { name: panel_status, type: enum, source: system, default: SEATED, description: "SEATED | RECUSED | DISQUALIFIED", constraints: "enum values {SEATED, RECUSED, DISQUALIFIED}" }
      - { name: seated_at, type: datetime, source: system, description: "Server-stamped at seating" }

  - name: NpdbReport
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> MedicalStaffMember.id; report subject" }
      - { name: case_id, type: string, source: input, description: "FK -> AdverseActionCase.id; source case for adverse reports; null for querystub", constraints: "nullable" }
      - { name: report_kind, type: enum, source: input, description: "QUERY_INITIAL | QUERY_REAPPOINTMENT | REPORT_ADVERSE_ACTION | REPORT_CORRECTION | REPORT_VOID", constraints: "enum values {QUERY_INITIAL, QUERY_REAPPOINTMENT, REPORT_ADVERSE_ACTION, REPORT_CORRECTION, REPORT_VOID}" }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped submission instant" }
      - { name: submission_deadline, type: datetime, source: system, description: "= triggering event instant + NPDB_REPORT_WINDOW_DAYS days for REPORT_ADVERSE_ACTION; REPORT_CORRECTION/REPORT_VOID inherit the deadline of the report they correct/void; null for QUERY_* kinds", constraints: "nullable" }
      - { name: report_status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | ACKNOWLEDGED | LATE | VOIDED", constraints: "enum values {SUBMITTED, ACKNOWLEDGED, LATE, VOIDED}" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "True when submitted_at > submission_deadline (strictly greater; equal is on-time)" }

  - name: CommitteeAgendaItem
    parent: null
    common_fields: true
    fields:
      - { name: item_kind, type: enum, source: input, description: "APPLICATION_APPROVAL | PRIVILEGE_GRANT | ADVERSE_ACTION | POLICY_CHANGE", constraints: "enum values {APPLICATION_APPROVAL, PRIVILEGE_GRANT, ADVERSE_ACTION, POLICY_CHANGE}" }
      - { name: ref_application_id, type: string, source: input, description: "FK -> AppointmentApplication.id; present when item_kind == APPLICATION_APPROVAL", constraints: "nullable" }
      - { name: ref_delineation_id, type: string, source: input, description: "FK -> PrivilegeDelineation.id; present when item_kind == PRIVILEGE_GRANT", constraints: "nullable" }
      - { name: ref_case_id, type: string, source: input, description: "FK -> AdverseActionCase.id; present when item_kind == ADVERSE_ACTION", constraints: "nullable" }
      - { name: committee_status, type: enum, source: system, default: AGENDA, description: "AGENDA | COMMITTEE_APPROVED | COMMITTEE_REJECTED | MEC_ENDORSED | BOARD_RATIFIED | BOARD_DECLINED | DEFERRED", constraints: "enum values {AGENDA, COMMITTEE_APPROVED, COMMITTEE_REJECTED, MEC_ENDORSED, BOARD_RATIFIED, BOARD_DECLINED, DEFERRED}" }
      - { name: committee_votes_for, type: integer, source: system, default: 0, description: "Count of FOR votes at committee level" }
      - { name: committee_votes_against, type: integer, source: system, default: 0, description: "Count of AGAINST votes at committee level" }
      - { name: quorum_required, type: integer, source: computed, description: "= hearing_quorum_determination output for ADVERSE_ACTION items; COMMITTEE_QUORUM constant otherwise" }
      - { name: mec_voter_ids, type: array, source: system, default: [], description: "Array of X-User-ID strings who voted at MEC endorsement; SoD: these ids are barred from casting the board ratification vote on the same item" }
      - { name: board_voter_id, type: string, source: system, description: "X-User-ID of the BoardMember who ratified/declined; null until board action", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AppointmentApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mso/applications/{id}/submit"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Application in DRAFT (ERR_APPLICATION_NOT_IN_DRAFT)"
          - "At least one VerificationItem exists for the application (ERR_NO_VERIFICATION_ITEMS)"
          - "For INITIAL: no other application for the same member in {SUBMITTED, PSV_IN_PROGRESS, PSV_COMPLETE, COMMITTEE_REVIEW, BOARD_REVIEW} unless supersedes_application_id names it (ERR_PENDING_APPLICATION_EXISTS)"
          - "For REAPPOINTMENT: clock must be inside [member.current_term_end - REAPPOINTMENT_WINDOW_DAYS, member.current_term_end) (ERR_OUTSIDE_REAPPOINTMENT_WINDOW)"
        side_effects:
          - "submitted_at = clock now"
          - "Application.status -> SUBMITTED; all PENDING VerificationItems auto-transition to REQUESTED (requested_at = now)"
          - "Application.version += 1; member.version += 1 (supersede marker)"
      - from: SUBMITTED
        to: PSV_IN_PROGRESS
        trigger: "system (automatic when first VerificationItem for the application reaches RECEIVED)"
        actor: system
        preconditions: []
        side_effects: ["verification counts recomputed"]
      - from: PSV_IN_PROGRESS
        to: PSV_COMPLETE
        trigger: "system (automatic when verification_complete_count == verification_required_count AND no VerificationItem in {PENDING, REQUESTED, RECEIVED, DISCREPANCY})"
        actor: system
        preconditions: []
        side_effects: ["Member notified implicitly via agenda item creation"]
      - from: PSV_COMPLETE
        to: COMMITTEE_REVIEW
        trigger: "POST /mso/applications/{id}/advance-to-committee"
        actor: CredentialsCommitteeChair
        preconditions:
          - "Application in PSV_COMPLETE (ERR_PSV_NOT_COMPLETE)"
          - "Every PrivilegeDelineation on the application has delineation_status in {CRITERIA_MET, CRITERIA_UNMET} (ERR_DELINEATIONS_UNEVALUATED)"
        side_effects: ["CommitteeAgendaItem (APPLICATION_APPROVAL) auto-created in AGENDA if none exists for this application"]
      - from: COMMITTEE_REVIEW
        to: BOARD_REVIEW
        trigger: "system (automatic when linked CommitteeAgendaItem reaches MEC_ENDORSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOARD_REVIEW
        to: APPROVED
        trigger: "system (automatic when linked CommitteeAgendaItem reaches BOARD_RATIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Member.membership_status -> ACTIVE (from APPLICANT) on INITIAL; on REAPPOINTMENT member.current_term_start = clock now, current_term_end recomputed by reappointment_term"
          - "Member.version += 1"
          - "Cascade: every PrivilegeDelineation on the application with CRITERIA_MET -> GRANTED and spawns PrivilegeGrant (PROVISIONAL) — this grant creation itself triggers PrivilegeGrant initial side effects (member.active_privilege_line_count += 1, member.privilege_posture recompute)"
      - from: BOARD_REVIEW
        to: DENIED
        trigger: "system (automatic when linked CommitteeAgendaItem reaches BOARD_DECLINED)"
        actor: system
        preconditions: []
        side_effects:
          - "decision_reason copied from agenda item"
          - "For INITIAL: member.membership_status stays APPLICANT"
          - "For REAPPOINTMENT: member.membership_status -> LAPSED at current_term_end if still BOARD_REVIEW; an AdverseActionCase (DENIAL_OF_REAPPOINTMENT) is auto-created referencing the member — which itself schedules hearing_request_deadline"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /mso/applications/{id}/withdraw"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Application in {DRAFT, SUBMITTED, PSV_IN_PROGRESS} (ERR_APPLICATION_NOT_WITHDRAWABLE)"
        side_effects: ["Open VerificationItems -> WAIVED with waiver_justification = 'application withdrawn'"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /mso/applications/{id}/withdraw"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Application in {DRAFT, SUBMITTED, PSV_IN_PROGRESS} (ERR_APPLICATION_NOT_WITHDRAWABLE)"
        side_effects: ["Open VerificationItems -> WAIVED with waiver_justification = 'application withdrawn'"]
      - from: PSV_IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /mso/applications/{id}/withdraw"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Application in {DRAFT, SUBMITTED, PSV_IN_PROGRESS} (ERR_APPLICATION_NOT_WITHDRAWABLE)"
        side_effects: ["Open VerificationItems -> WAIVED with waiver_justification = 'application withdrawn'"]
      - from: BOARD_REVIEW
        to: EXPIRED
        trigger: "system (automatic when clock passes member.current_term_end for a REAPPOINTMENT application still in BOARD_REVIEW)"
        actor: system
        preconditions: []
        side_effects: ["Member.membership_status -> LAPSED", "Member.privilege_posture recomputed (all ACTIVE grants -> EXPIRED at term end)"]

  - entity: VerificationItem
    initial_state: PENDING
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: PENDING
        to: REQUESTED
        trigger: "system (automatic on application submit)"
        actor: system
        preconditions: []
        side_effects: ["requested_at = now"]
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /mso/verification-items/{id}/mark-received"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Item in REQUESTED (ERR_VERIFICATION_NOT_REQUESTED)"
        side_effects: ["If application in SUBMITTED: application -> PSV_IN_PROGRESS"]
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /mso/verification-items/{id}/verify"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Item in RECEIVED (ERR_VERIFICATION_NOT_RECEIVED)"
          - "If item_kind == NPDB_QUERY: an NpdbReport of report_kind QUERY_INITIAL (INITIAL application) or QUERY_REAPPOINTMENT (REAPPOINTMENT application) with report_status in {SUBMITTED, ACKNOWLEDGED} must exist for the member (ERR_NPDB_QUERY_MISSING)"
        side_effects:
          - "verified_at = now"
          - "application.verification_complete_count += 1"
          - "If verification_complete_count == verification_required_count and no open items: application -> PSV_COMPLETE"
      - from: RECEIVED
        to: DISCREPANCY
        trigger: "POST /mso/verification-items/{id}/flag-discrepancy"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Item in RECEIVED (ERR_VERIFICATION_NOT_RECEIVED)"
          - "discrepancy_note present, length >= 10 (ERR_INVALID_REQUEST)"
        side_effects: ["Application blocked from PSV_COMPLETE while any DISCREPANCY exists"]
      - from: DISCREPANCY
        to: RECEIVED
        trigger: "POST /mso/verification-items/{id}/mark-received"
        actor: MedicalStaffCoordinator
        preconditions: ["Item in DISCREPANCY"]
        side_effects: []
        note: "Re-receipt after clarification — cycle RECEIVED<->DISCREPANCY allowed"
      - from: REQUESTED
        to: WAIVED
        trigger: "POST /mso/verification-items/{id}/waive"
        actor: CredentialsCommitteeChair
        preconditions:
          - "Item in {REQUESTED, RECEIVED} (ERR_VERIFICATION_NOT_WAIVABLE)"
          - "waiver_justification present, length >= 20 (ERR_INVALID_REQUEST)"
          - "If is_primary_source == true and item_kind == NPDB_QUERY: waiver forbidden (ERR_PRIMARY_SOURCE_NOT_WAIVABLE)"
        side_effects: ["verification_required_count recomputed (waived excluded)"]
      - from: RECEIVED
        to: WAIVED
        trigger: "POST /mso/verification-items/{id}/waive"
        actor: CredentialsCommitteeChair
        preconditions:
          - "Item in {REQUESTED, RECEIVED} (ERR_VERIFICATION_NOT_WAIVABLE)"
          - "waiver_justification present, length >= 20 (ERR_INVALID_REQUEST)"
          - "If is_primary_source == true and item_kind == NPDB_QUERY: waiver forbidden (ERR_PRIMARY_SOURCE_NOT_WAIVABLE)"
        side_effects: ["verification_required_count recomputed (waived excluded)"]

  - entity: PrivilegeDelineation
    initial_state: REQUESTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: REQUESTED
        to: CRITERIA_MET
        trigger: "POST /mso/delineations/{id}/evaluate"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Delineation in REQUESTED (ERR_DELINEATION_NOT_EVALUABLE)"
          - "Parent application in {SUBMITTED, PSV_IN_PROGRESS, PSV_COMPLETE} (ERR_APPLICATION_NOT_IN_REVIEW)"
        side_effects: ["satisfaction_tier and satisfaction_score computed by privilege_delineation_satisfaction"]
      - from: REQUESTED
        to: CRITERIA_UNMET
        trigger: "POST /mso/delineations/{id}/evaluate"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Delineation in REQUESTED (ERR_DELINEATION_NOT_EVALUABLE)"
        side_effects: ["satisfaction_tier and satisfaction_score computed; tier UNMET pinned when any mandatory criterion fails"]
      - from: CRITERIA_MET
        to: GRANTED
        trigger: "system (automatic on parent application APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["PrivilegeGrant created (PROVISIONAL, effective_until = member.current_term_end)"]
      - from: CRITERIA_UNMET
        to: DENIED
        trigger: "system (automatic on parent application APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PrivilegeGrant
    initial_state: PROVISIONAL
    terminal_states: [EXPIRED, REVOKED, RELINQUISHED]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "system (automatic when fppe_cases_completed >= SpecialtyCriteria.fppe_case_count for the grant's privilege_line)"
        actor: system
        preconditions: []
        side_effects: ["member.active_privilege_line_count recomputed", "member.privilege_posture recomputed"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when any mandatory ExpirableCredential lapses — cascade from credential_expiry_risk_window)"
        actor: system
        preconditions: []
        side_effects:
          - "suspension_reason = lapsed credential_kind"
          - "member.active_privilege_line_count -= 1"
          - "member.privilege_posture recomputed; if all lines suspended, posture -> NONE or EMERGENCY_ONLY"
          - "Cascade: each PerformanceReview on this grant in {COLLECTING, EVALUATION} -> stays but metrics blocked; open CommitteeAgendaItem PRIVILEGE_GRANT rows referencing the delineation -> DEFERRED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic when the lapsed credential is renewed — ExpirableCredential RENEWED with supersedes_credential_id chain)"
        actor: system
        preconditions: []
        side_effects: ["suspension_reason = null", "member.active_privilege_line_count += 1", "privilege_posture recomputed"]
      - from: ACTIVE
        to: REVOKED
        trigger: "system (automatic when AdverseActionCase for the member reaches FINAL_ADVERSE with case_kind == REVOCATION)"
        actor: system
        preconditions: []
        side_effects: ["member.active_privilege_line_count recomputed", "NpdbReport REPORT_ADVERSE_ACTION spawned with submission_deadline = now + 30d"]
      - from: PROVISIONAL
        to: RELINQUISHED
        trigger: "POST /mso/privilege-grants/{id}/relinquish"
        actor: Practitioner
        preconditions:
          - "Grant in {PROVISIONAL, ACTIVE} (ERR_GRANT_NOT_RELINQUISHABLE)"
          - "Acting Practitioner is the grant holder (ERR_NOT_GRANT_HOLDER)"
        side_effects: ["member.active_privilege_line_count recomputed", "privilege_posture recomputed"]
      - from: ACTIVE
        to: RELINQUISHED
        trigger: "POST /mso/privilege-grants/{id}/relinquish"
        actor: Practitioner
        preconditions:
          - "Grant in {PROVISIONAL, ACTIVE} (ERR_GRANT_NOT_RELINQUISHABLE)"
          - "Acting Practitioner is the grant holder (ERR_NOT_GRANT_HOLDER)"
        side_effects: ["member.active_privilege_line_count recomputed", "privilege_posture recomputed"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when clock >= effective_until)"
        actor: system
        preconditions: []
        side_effects: ["member.active_privilege_line_count recomputed", "privilege_posture recomputed"]

  - entity: PerformanceReview
    initial_state: COLLECTING
    terminal_states: [CLOSED]
    transitions:
      - from: COLLECTING
        to: EVALUATION
        trigger: "POST /mso/performance-reviews/{id}/close-collection"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Review in COLLECTING (ERR_REVIEW_NOT_COLLECTING)"
          - "metric_count > 0 (ERR_NO_METRICS)"
        side_effects: []
      - from: EVALUATION
        to: PROVISIONAL_RESULT
        trigger: "POST /mso/performance-reviews/{id}/compute-provisional"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Review in EVALUATION (ERR_REVIEW_NOT_EVALUABLE)"
        side_effects: ["provisional_composite_score computed by fppe_composite_score (provisional variant)"]
      - from: PROVISIONAL_RESULT
        to: FINAL_RESULT
        trigger: "POST /mso/performance-reviews/{id}/finalize"
        actor: CredentialsCommitteeChair
        preconditions:
          - "Review in PROVISIONAL_RESULT (ERR_REVIEW_NOT_PROVISIONAL)"
          - "sum of domain_weight over ACTIVE metrics == 1.000 exactly (ERR_WEIGHT_SUM_INVALID)"
        side_effects:
          - "final_composite_score computed by fppe_composite_score (final variant — includes metrics collected at exactly period_end boundary under final rules)"
          - "outcome derived by oppe_outcome_threshold"
          - "If outcome == UNSATISFACTORY and review_kind == OPPE: AdverseActionCase (RESTRICTION) auto-proposed referencing this review — cascade link 1"
          - "If review_kind == FPPE and outcome in {SATISFACTORY, MARGINAL}: each passed_fppe_case metric increments grant.fppe_cases_completed — possible PROVISIONAL->ACTIVE grant flip"
      - from: FINAL_RESULT
        to: CLOSED
        trigger: "POST /mso/performance-reviews/{id}/close"
        actor: CredentialsCommitteeChair
        preconditions: ["Review in FINAL_RESULT"]
        side_effects: []

  - entity: ExpirableCredential
    initial_state: CURRENT
    terminal_states: [RENEWED, REVOKED]
    transitions:
      - from: CURRENT
        to: LAPSED
        trigger: "system (automatic when clock >= expires_on)"
        actor: system
        preconditions: []
        side_effects:
          - "member.credential_expiry_risk_score recomputed"
          - "If credential_kind in {STATE_LICENSE, BOARD_CERT, MALPRACTICE_INSURANCE}: every ACTIVE PrivilegeGrant for the member whose SpecialtyCriteria requires that kind -> SUSPENDED (cascade link 2)"
          - "Member.privilege_posture recomputed (cascade link 3)"
      - from: LAPSED
        to: RENEWED
        trigger: "POST /mso/expirable-credentials/{id}/renew"
        actor: MedicalStaffCoordinator
        preconditions:
          - "Credential in LAPSED (ERR_CREDENTIAL_NOT_LAPSED)"
          - "new expires_on > clock now (ERR_CREDENTIAL_EXPIRY_PAST)"
        side_effects:
          - "New ExpirableCredential row created (CURRENT) with supersedes_credential_id = this id; this row -> RENEWED"
          - "Every PrivilegeGrant SUSPENDED with suspension_reason == this credential_kind -> ACTIVE (reinstatement cascade)"
          - "member.credential_expiry_risk_score recomputed"
      - from: CURRENT
        to: REVOKED
        trigger: "POST /mso/expirable-credentials/{id}/revoke"
        actor: CredentialsCommitteeChair
        preconditions: ["Credential in CURRENT (ERR_CREDENTIAL_NOT_CURRENT)"]
        side_effects: ["Same cascade as LAPSED"]

  - entity: TemporaryPrivilege
    initial_state: PENDING_SPONSOR
    terminal_states: [EXPIRED, TERMINATED_EARLY]
    transitions:
      - from: PENDING_SPONSOR
        to: ACTIVE
        trigger: "POST /mso/temporary-privileges/{id}/activate"
        actor: CredentialsCommitteeChair
        preconditions:
          - "Temp in PENDING_SPONSOR (ERR_TEMP_NOT_PENDING)"
          - "sponsor_member_id member has membership_status == ACTIVE and privilege_posture == FULL (ERR_SPONSOR_NOT_QUALIFIED)"
          - "Recipient member membership_status in {APPLICANT, ACTIVE} (ERR_MEMBER_NOT_ELIGIBLE)"
          - "Window length within kind cap: EMERGENCY <= 24h, DISASTER <= 72h, TEMPORARY <= 120 days (ERR_TEMP_WINDOW_TOO_LONG)"
          - "No other TemporaryPrivilege for the same member with temp_status == ACTIVE whose [window_start, window_end] closed interval intersects, counting a 1-day adjacency buffer on both ends (ERR_TEMP_OVERLAP)"
          - "For DISASTER: disaster_declaration_ref present (ERR_DISASTER_REF_REQUIRED)"
        side_effects: ["member.privilege_posture recomputed — if member posture was NONE, posture -> EMERGENCY_ONLY"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when clock > window_end)"
        actor: system
        preconditions: []
        side_effects: ["member.privilege_posture recomputed"]
      - from: ACTIVE
        to: TERMINATED_EARLY
        trigger: "POST /mso/temporary-privileges/{id}/terminate"
        actor: CredentialsCommitteeChair
        preconditions: ["Temp in ACTIVE (ERR_TEMP_NOT_ACTIVE)"]
        side_effects: ["member.privilege_posture recomputed"]

  - entity: AdverseActionCase
    initial_state: PROPOSED
    terminal_states: [FINAL_ADVERSE, FINAL_NO_ACTION, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: MEC_ENDORSED
        trigger: "POST /mso/adverse-action-cases/{id}/endorse"
        actor: MedicalExecutiveCommitteeChair
        preconditions:
          - "Case in PROPOSED (ERR_CASE_NOT_PROPOSED)"
          - "Subject member membership_status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
        side_effects: []
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /mso/adverse-action-cases/{id}/withdraw"
        actor: DepartmentChief
        preconditions:
          - "Case in {PROPOSED, MEC_ENDORSED} (ERR_CASE_NOT_WITHDRAWABLE)"
          - "Acting DepartmentChief's member record == proposed_by_member_id (ERR_NOT_CASE_PROPOSER)"
        side_effects: []
      - from: MEC_ENDORSED
        to: WITHDRAWN
        trigger: "POST /mso/adverse-action-cases/{id}/withdraw"
        actor: DepartmentChief
        preconditions:
          - "Case in {PROPOSED, MEC_ENDORSED} (ERR_CASE_NOT_WITHDRAWABLE)"
          - "Acting DepartmentChief's member record == proposed_by_member_id (ERR_NOT_CASE_PROPOSER)"
        side_effects: []
      - from: MEC_ENDORSED
        to: HEARING_REQUESTED
        trigger: "POST /mso/adverse-action-cases/{id}/request-hearing"
        actor: Practitioner
        preconditions:
          - "Case in MEC_ENDORSED (ERR_CASE_NOT_ENDORSED)"
          - "Acting Practitioner is subject_member_id (ERR_NOT_CASE_SUBJECT)"
          - "clock <= hearing_request_deadline (ERR_HEARING_REQUEST_LATE)"
        side_effects:
          - "hearing_requested_at = now"
          - "subject.sod_exclusion_tags += [case.id]; proposer.sod_exclusion_tags += [case.id] (SoD cascade)"
      - from: MEC_ENDORSED
        to: FINAL_ADVERSE
        trigger: "system (automatic when clock passes hearing_request_deadline with no hearing requested — waiver by silence)"
        actor: system
        preconditions: []
        side_effects: ["Same as FINAL_ADVERSE side effects below"]
      - from: HEARING_REQUESTED
        to: HEARING_HELD
        trigger: "POST /mso/adverse-action-cases/{id}/hold-hearing"
        actor: HearingOfficer
        preconditions:
          - "Case in HEARING_REQUESTED (ERR_CASE_NOT_IN_HEARING)"
          - "Seated HearingPanel for the case satisfies hearing_quorum_determination (ERR_HEARING_QUORUM_UNMET)"
        side_effects: []
      - from: HEARING_HELD
        to: FINAL_ADVERSE
        trigger: "POST /mso/adverse-action-cases/{id}/decide"
        actor: HearingOfficer
        preconditions: ["Case in HEARING_HELD (ERR_CASE_NOT_HEARD)", "decision == UPHELD (ERR_INVALID_REQUEST)"]
        side_effects:
          - "NpdbReport REPORT_ADVERSE_ACTION spawned if npdb_reportable (submission_deadline = now + NPDB_REPORT_WINDOW_DAYS)"
          - "Member.membership_status -> SUSPENDED (case_kind SUSPENSION) or TERMINATED (REVOCATION or DENIAL_OF_REAPPOINTMENT)"
          - "For REVOCATION: all ACTIVE/PROVISIONAL PrivilegeGrants -> REVOKED (cascade), privilege_posture -> NONE"
          - "CommitteeAgendaItem (ADVERSE_ACTION) for the case -> COMMITTEE_APPROVED if still AGENDA"
      - from: HEARING_HELD
        to: FINAL_NO_ACTION
        trigger: "POST /mso/adverse-action-cases/{id}/decide"
        actor: HearingOfficer
        preconditions: ["Case in HEARING_HELD", "decision == OVERTURNED (ERR_INVALID_REQUEST)"]
        side_effects: ["No NPDB report; member unchanged"]
      - from: HEARING_HELD
        to: REMANDED
        trigger: "POST /mso/adverse-action-cases/{id}/decide"
        actor: HearingOfficer
        preconditions: ["Case in HEARING_HELD", "decision == REMAND (ERR_INVALID_REQUEST)"]
        side_effects: ["Hearing deadline extended: hearing_request_deadline = now + HEARING_REQUEST_WINDOW_DAYS"]
      - from: REMANDED
        to: HEARING_REQUESTED
        trigger: "POST /mso/adverse-action-cases/{id}/request-hearing"
        actor: Practitioner
        preconditions:
          - "Case in REMANDED (ERR_CASE_NOT_ENDORSED)"
          - "clock <= hearing_request_deadline (ERR_HEARING_REQUEST_LATE)"
        side_effects: ["hearing_requested_at = now"]
        note: "Cyclic loop HEARING_HELD -> REMANDED -> HEARING_REQUESTED -> HEARING_HELD permitted; each remand extends the deadline"

  - entity: HearingPanel
    initial_state: SEATED
    terminal_states: [RECUSED, DISQUALIFIED]
    transitions:
      - from: "(creation)"
        to: SEATED
        trigger: "POST /mso/hearing-panels"
        actor: HearingOfficer
        preconditions:
          - "panel_member.sod_exclusion_tags must NOT contain case_id (ERR_PANELIST_SOD_EXCLUDED)"
          - "Referenced case must be in {MEC_ENDORSED, HEARING_REQUESTED, REMANDED, HEARING_HELD} (ERR_INVALID_STATE)"
        side_effects: ["total_ever_seated for the case += 1; quorum_required recomputed"]
      - from: SEATED
        to: RECUSED
        trigger: "POST /mso/hearing-panels/{id}/recuse"
        actor: HearingOfficer
        preconditions: ["Panelist in SEATED (ERR_PANELIST_NOT_SEATED)"]
        side_effects: ["Quorum re-evaluated for the case"]
      - from: SEATED
        to: DISQUALIFIED
        trigger: "system (automatic when panelist.member.sod_exclusion_tags contains case_id — e.g. panelist later becomes proposer of a related case)"
        actor: system
        preconditions: []
        side_effects: ["Quorum re-evaluated"]

  - entity: NpdbReport
    initial_state: SUBMITTED
    terminal_states: [ACKNOWLEDGED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /mso/npdb-reports/{id}/acknowledge"
        actor: MedicalStaffCoordinator
        preconditions: ["Report in {SUBMITTED, LATE} (ERR_NPDB_NOT_ACKNOWLEDGEABLE)"]
        side_effects: []
      - from: SUBMITTED
        to: LATE
        trigger: "system (automatic at creation when submitted_at > submission_deadline)"
        actor: system
        preconditions: []
        side_effects: ["is_late = true"]
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /mso/npdb-reports/{id}/void"
        actor: CredentialsCommitteeChair
        preconditions:
          - "Report in {SUBMITTED, LATE} (ERR_NPDB_NOT_VOIDABLE)"
          - "A replacement NpdbReport of report_kind REPORT_CORRECTION for the same case_id must be created in the same request batch (ERR_CORRECTION_REQUIRED)"
        side_effects: []
      - from: LATE
        to: ACKNOWLEDGED
        trigger: "POST /mso/npdb-reports/{id}/acknowledge"
        actor: MedicalStaffCoordinator
        preconditions: ["Report in {SUBMITTED, LATE}"]
        side_effects: []
      - from: LATE
        to: VOIDED
        trigger: "POST /mso/npdb-reports/{id}/void"
        actor: CredentialsCommitteeChair
        preconditions: ["Report in {SUBMITTED, LATE}", "REPORT_CORRECTION replacement required (ERR_CORRECTION_REQUIRED)"]
        side_effects: []

  - entity: CommitteeAgendaItem
    initial_state: AGENDA
    terminal_states: [BOARD_RATIFIED, BOARD_DECLINED]
    transitions:
      - from: AGENDA
        to: COMMITTEE_APPROVED
        trigger: "POST /mso/agenda-items/{id}/committee-vote"
        actor: CredentialsCommitteeChair
        preconditions:
          - "Item in AGENDA or DEFERRED (ERR_ITEM_NOT_VOTABLE)"
          - "committee_votes_for >= quorum_required after applying this vote batch (ERR_COMMITTEE_QUORUM_UNMET)"
          - "For ADVERSE_ACTION items: referenced case in {HEARING_HELD, MEC_ENDORSED} (ERR_CASE_NOT_READY_FOR_COMMITTEE)"
        side_effects: []
      - from: AGENDA
        to: COMMITTEE_REJECTED
        trigger: "POST /mso/agenda-items/{id}/committee-vote"
        actor: CredentialsCommitteeChair
        preconditions:
          - "Item in AGENDA or DEFERRED (ERR_ITEM_NOT_VOTABLE)"
          - "committee_votes_against >= quorum_required after applying this vote batch"
        side_effects: ["For APPLICATION_APPROVAL: linked application stays in COMMITTEE_REVIEW (re-agendable)"]
      - from: AGENDA
        to: DEFERRED
        trigger: "POST /mso/agenda-items/{id}/defer"
        actor: CredentialsCommitteeChair
        preconditions: ["Item in AGENDA (ERR_ITEM_NOT_DEFERRABLE)"]
        side_effects: []
      - from: DEFERRED
        to: AGENDA
        trigger: "POST /mso/agenda-items/{id}/reagenda"
        actor: CredentialsCommitteeChair
        preconditions: ["Item in DEFERRED (ERR_ITEM_NOT_REAGENDABLE)"]
        side_effects: []
        note: "Cycle AGENDA<->DEFERRED allowed"
      - from: COMMITTEE_APPROVED
        to: MEC_ENDORSED
        trigger: "POST /mso/agenda-items/{id}/mec-endorse"
        actor: MedicalExecutiveCommitteeChair
        preconditions:
          - "Item in COMMITTEE_APPROVED (ERR_ITEM_NOT_COMMITTEE_APPROVED)"
          - "voter_id recorded into mec_voter_ids; a voter_id already in mec_voter_ids cannot vote twice (ERR_DUPLICATE_MEC_VOTE)"
        side_effects:
          - "mec_voter_ids += [voter_id]"
          - "For APPLICATION_APPROVAL: linked application -> BOARD_REVIEW"
      - from: MEC_ENDORSED
        to: BOARD_RATIFIED
        trigger: "POST /mso/agenda-items/{id}/board-ratify"
        actor: BoardMember
        preconditions:
          - "Item in MEC_ENDORSED (ERR_ITEM_NOT_MEC_ENDORSED)"
          - "Acting BoardMember X-User-ID NOT IN mec_voter_ids (ERR_SOD_BOARD_CONFLICT)"
        side_effects:
          - "board_voter_id = X-User-ID"
          - "For APPLICATION_APPROVAL: application -> APPROVED (cascade into member term + grants)"
          - "For PRIVILEGE_GRANT: delineation -> GRANTED; PrivilegeGrant created"
          - "For ADVERSE_ACTION: case decided per hearing outcome"
      - from: MEC_ENDORSED
        to: BOARD_DECLINED
        trigger: "POST /mso/agenda-items/{id}/board-decline"
        actor: BoardMember
        preconditions:
          - "Item in MEC_ENDORSED (ERR_ITEM_NOT_MEC_ENDORSED)"
          - "Acting BoardMember X-User-ID NOT IN mec_voter_ids (ERR_SOD_BOARD_CONFLICT)"
        side_effects:
          - "board_voter_id = X-User-ID"
          - "For APPLICATION_APPROVAL: application -> DENIED (cascade incl. auto AdverseActionCase for REAPPOINTMENT)"

  - entity: MedicalStaffMember
    initial_state: "membership_status=APPLICANT, privilege_posture=NONE"
    terminal_states: ["membership_status in {TERMINATED, LAPSED}"]
    transitions:
      - from: "membership_status=APPLICANT"
        to: "membership_status=ACTIVE"
        trigger: "system (automatic on INITIAL application APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["privilege_posture recomputed from grants"]
      - from: "membership_status=ACTIVE"
        to: "membership_status=SUSPENDED"
        trigger: "system (automatic on AdverseActionCase FINAL_ADVERSE with case_kind == SUSPENSION)"
        actor: system
        preconditions: []
        side_effects: ["privilege_posture -> NONE; all ACTIVE grants -> SUSPENDED"]
      - from: "membership_status=SUSPENDED"
        to: "membership_status=ACTIVE"
        trigger: "POST /mso/members/{id}/reinstate"
        actor: MedicalExecutiveCommitteeChair
        preconditions:
          - "Member in SUSPENDED (ERR_MEMBER_NOT_SUSPENDED)"
          - "No AdverseActionCase for member in {PROPOSED, MEC_ENDORSED, HEARING_REQUESTED, HEARING_HELD, REMANDED} (ERR_OPEN_CASE_EXISTS)"
        side_effects: ["privilege_posture recomputed"]
      - from: "membership_status=ACTIVE"
        to: "membership_status=TERMINATED"
        trigger: "system (automatic on FINAL_ADVERSE with case_kind in {REVOCATION, DENIAL_OF_REAPPOINTMENT})"
        actor: system
        preconditions: []
        side_effects: ["all grants -> REVOKED/EXPIRED; posture -> NONE"]
      - from: "membership_status=ACTIVE"
        to: "membership_status=LAPSED"
        trigger: "system (automatic when clock passes current_term_end with no APPROVED reappointment)"
        actor: system
        preconditions: []
        side_effects: ["all ACTIVE grants -> EXPIRED; posture -> NONE"]
    note: "Parallel dimensions: privilege_posture (NONE/FULL/PARTIAL/EMERGENCY_ONLY) evolves independently of membership_status via grant/credential/temp-privilege recomputes"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: application-supersede-stale-member
    parent_entity: MedicalStaffMember
    write_endpoint: "POST /mso/applications"
    occ_field: "expected_member_version"
    description: |
      Creating an AppointmentApplication against a MedicalStaffMember whose
      version has advanced since the client last observed it is rejected.
      Captures the case where another writer has just submitted a superseding
      application (which legitimately replaces the prior pending one) or the
      member's term has been ratified forward, making the current writer's view
      of the member stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: delineation-create-stale-application
    parent_entity: AppointmentApplication
    write_endpoint: "POST /mso/delineations"
    occ_field: "expected_application_version"
    description: |
      Creating a PrivilegeDelineation against an AppointmentApplication whose
      version has advanced since the client last observed it is rejected — the
      application may have been advanced to COMMITTEE_REVIEW or withdrawn by
      another writer, making a new delineation request target a stale snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: privilege_delineation_satisfaction
    trigger: "POST /mso/delineations/{id}/evaluate"
    algorithm: threshold
    formula: |
      inputs: SpecialtyCriteria C (matched on member.primary_specialty_code + delineation.privilege_line),
              delineation D, member's ExpirableCredentials
      1. mandatory_ok = (D.documented_training_months >= C.min_training_months)
                        AND (NOT C.required_board_cert OR exists member ExpirableCredential
                             with credential_kind == BOARD_CERT AND credential_status == CURRENT
                             AND expires_on > clock now)
      2. volume_ok = D.documented_cases_24mo >= C.min_case_volume_24mo
      3. tier selection: walk C.volume_tier_table ascending by min_cases;
         selected_tier = last tier whose min_cases <= D.documented_cases_24mo;
         if no tier qualifies (cases below first tier min), tier = UNMET.
      4. base_score = selected_tier.score_multiplier * min(D.documented_cases_24mo, 1000)
      5. training_bonus = min(D.documented_training_months - C.min_training_months, 24) * 0.5
         (floored at 0 — nested min/max)
      6. satisfaction_score = round_half_up(base_score + training_bonus, 2)
      7. delineation -> CRITERIA_MET iff mandatory_ok AND volume_ok AND tier != UNMET;
         else CRITERIA_UNMET with satisfaction_tier = "UNMET"
    input_set: "SpecialtyCriteria row matching (member.primary_specialty_code, delineation.privilege_line); member's ExpirableCredentials with credential_status == CURRENT"
    constants:
      TRAINING_BONUS_CAP_MONTHS: 24
      TRAINING_BONUS_PER_MONTH: 0.5
      CASE_SCORE_CAP: 1000
    precision: "2 decimal places, round_half_up"

  - name: fppe_composite_score
    trigger: "compute-provisional (provisional variant) and finalize (final variant) on PerformanceReview"
    algorithm: weighted_scoring
    formula: |
      1. For each PerformanceMetric with metric_status == ACTIVE:
         normalized_value = round_half_up(domain_normalization(raw_value, metric_domain), 2)
         — normalization table: CLINICAL_QUALITY: 100 - raw*5; PATIENT_SAFETY: 100 - raw*8;
         DOCUMENTATION: raw; CITIZENSHIP: raw; UTILIZATION: 100 - |raw - 85| * 2
         (clamp to [0.00, 100.00] AFTER rounding)
      2. domain_score[d] = round_half_up(avg of normalized_value over ACTIVE metrics in domain d, 2)
         — ROUND PER DOMAIN FIRST (pinned rounding order: per-domain round, then weighted sum)
      3. composite = round_half_up( sum over domains d of domain_score[d] * domain_weight[d], 2 )
         where domain_weight[d] = the metric's domain_weight for that domain (all metrics in
         the same domain must carry equal weight; validation enforces)
    input_set: "PerformanceMetric rows of the review; ACTIVE only for final; provisional variant includes metrics with collected_at == period_end (boundary-inclusive), final variant EXCLUDES collected_at == period_end (half-open) — pinned divergence"
    precision: "2 decimal places, round_half_up; per-domain rounding strictly before weighted aggregation"
    variants:
      - name: provisional
        when: "compute-provisional on EVALUATION review"
        difference: "Includes metrics whose collected_at == period_end exactly (boundary-inclusive upper bound); retracted metrics excluded"
      - name: final
        when: "finalize on PROVISIONAL_RESULT review"
        difference: "Excludes metrics whose collected_at == period_end exactly (strict half-open [period_start, period_end)); identical inputs minus boundary metrics — same data can yield a different composite"

  - name: oppe_outcome_threshold
    trigger: "finalize on PerformanceReview (after fppe_composite_score final)"
    algorithm: threshold
    formula: |
      final_composite_score >= 70.00 -> SATISFACTORY
      50.00 <= final_composite_score < 70.00 -> MARGINAL
      final_composite_score < 50.00 -> UNSATISFACTORY
      Boundary: 70.00 exactly is SATISFACTORY (>=, not >); 49.995 rounds to 50.00 first (2dp half-up), then compares.
    input_set: "the finalized review's final_composite_score"
    constants:
      SATISFACTORY_MIN: 70.00
      MARGINAL_MIN: 50.00

  - name: credential_expiry_risk_window
    trigger: "clock advance (/_clock/set_current_utc), credential create/renew/revoke/lapse"
    algorithm: forward_looking
    formula: |
      For member M, over ExpirableCredentials with credential_status == CURRENT:
      risk = 0
      for each credential c:
        days_to_expiry = floor((c.expires_on - now) / 86400)
        if days_to_expiry < 0: contribution = 100   # already lapsed (should have transitioned)
        elif days_to_expiry <= 30: contribution = 50
        elif days_to_expiry <= 90: contribution = 25
        else: contribution = 0
        if c.credential_kind in {STATE_LICENSE, MALPRACTICE_INSURANCE}: contribution *= 1.5
        risk += contribution
      credential_expiry_risk_score = round_half_up(risk, 2)
      if risk_score >= RISK_SUSPEND_THRESHOLD (75.00): flag member for auto-suspension cascade
    input_set: "member's ExpirableCredentials with credential_status == CURRENT"
    constants:
      RISK_SUSPEND_THRESHOLD: 75.00
      WINDOW_30D_PTS: 50
      WINDOW_90D_PTS: 25
      CRITICAL_KIND_MULTIPLIER: 1.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: chronological
        when: "retroactive audit report GET /mso/members/{id}/credential-risk?as_of=<ts>"
        difference: "Computes risk as of a past timestamp using only credentials whose issued_on <= as_of, and measures days_to_expiry from as_of — same credentials can yield different scores under the two variants"

  - name: hearing_quorum_determination
    trigger: "hold-hearing on AdverseActionCase; committee-vote on ADVERSE_ACTION agenda items"
    algorithm: aggregation
    formula: |
      1. total_ever_seated = count of ALL HearingPanel rows for the case regardless of
         panel_status (SEATED + RECUSED + DISQUALIFIED) — the denominator is therefore
         independent of the current eligible pool, breaking the circular "quorum depends
         on seated, seated depends on quorum" dependency: evaluation order is pinned as
         denominator first (from row history), eligibility second.
      2. quorum_required = max(3, ceil(total_ever_seated * 0.5))
      3. eligible_panel = HearingPanel rows for the case with panel_status == SEATED
         AND panel_member.sod_exclusion_tags does NOT contain case.id
      4. quorum met iff count(eligible_panel) >= quorum_required
    input_set: "HearingPanel rows for the case; MedicalStaffMember rows for panelists"
    constants:
      MIN_HEARING_QUORUM: 3
      QUORUM_RATIO: 0.5
      COMMITTEE_QUORUM: 3
    note: "COMMITTEE_QUORUM is the fixed quorum_required for non-ADVERSE_ACTION CommitteeAgendaItem rows (APPLICATION_APPROVAL, PRIVILEGE_GRANT, POLICY_CHANGE)"

  - name: reappointment_term
    trigger: "REAPPOINTMENT application APPROVED"
    algorithm: chronological
    formula: |
      current_term_start = ratification instant (clock now)
      current_term_end = current_term_start + TERM_YEARS years (calendar arithmetic, UTC)
      Reappointment window = [current_term_end - REAPPOINTMENT_WINDOW_DAYS days, current_term_end)
      — half-open: submitting exactly at (current_term_end - 180 days) is INSIDE;
      submitting exactly at current_term_end is OUTSIDE (too late).
    input_set: "member record"
    constants:
      TERM_YEARS: 2
      REAPPOINTMENT_WINDOW_DAYS: 180

  - name: npdb_report_deadline
    trigger: "AdverseActionCase -> FINAL_ADVERSE"
    algorithm: chronological
    formula: |
      submission_deadline = final_adverse_instant + NPDB_REPORT_WINDOW_DAYS days
      is_late = submitted_at > submission_deadline   # strictly greater; equal is on-time
    input_set: "the NpdbReport row and its source case"
    constants:
      NPDB_REPORT_WINDOW_DAYS: 30

  - name: temp_privilege_overlap
    trigger: "activate on TemporaryPrivilege"
    algorithm: interval_merge
    formula: |
      For candidate window [s1, e1] (closed, both ends inclusive) and each existing
      ACTIVE TemporaryPrivilege for the same member with window [s2, e2]:
      buffered_existing = [s2 - 1 day, e2 + 1 day]
      conflict iff s1 <= buffered_existing.end AND buffered_existing.start <= e1
      — closed-interval intersection with 1-day buffer on the EXISTING window only.
      Adjacency exactly 1 day apart (s1 == e2 + 1) IS a conflict (inside buffer);
      2 days apart (s1 == e2 + 2) is NOT.
      This differs from PrivilegeGrant half-open [from, until) semantics where
      adjacency (from == until) is permitted.
    input_set: "member's TemporaryPrivilege rows with temp_status == ACTIVE"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body FK ids exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "OCC expected_*_version matches current parent version (when endpoint requires it)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mso/applications, POST /mso/delineations"
  - priority: 5
    category: state
    check: "Target entity in a from-state listed for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 6
    category: business_safety
    check: "Segregation-of-duties: board voter not in mec_voter_ids; hearing panelist not SoD-excluded; case withdrawer is proposer; relinquisher is grant holder"
    error_id: ERR_SOD_BOARD_CONFLICT
    http_status: 403
    applies_to: "board-ratify, board-decline, hearing-panels create, case withdraw, grant relinquish"
  - priority: 7
    category: business_safety
    check: "Safety gates: primary-source NPDB item not waivable; sponsor qualified; subject is case subject for hearing request"
    error_id: ERR_PRIMARY_SOURCE_NOT_WAIVABLE
    http_status: 403
    applies_to: "waive, temp activate, request-hearing"
  - priority: 8
    category: business_temporal
    check: "Temporal windows: reappointment window (ERR_OUTSIDE_REAPPOINTMENT_WINDOW), hearing request deadline (ERR_HEARING_REQUEST_LATE), temp window caps (ERR_TEMP_WINDOW_TOO_LONG), temp overlap with buffer (ERR_TEMP_OVERLAP), metric collected_at inside review [period_start, period_end) (ERR_METRIC_OUTSIDE_WINDOW)"
    error_id: ERR_OUTSIDE_REAPPOINTMENT_WINDOW
    http_status: 409
    applies_to: "submit, request-hearing, temp activate, grant create, metric create"
  - priority: 9
    category: business_constraint
    check: "Structural constraints: verification items exist before submit (ERR_NO_VERIFICATION_ITEMS); delineations evaluated before committee (ERR_DELINEATIONS_UNEVALUATED); weight sum == 1.000 at finalize (ERR_WEIGHT_SUM_INVALID); same-domain metrics carry equal domain_weight (ERR_METRIC_WEIGHT_DOMAIN_MISMATCH); quorum satisfied (ERR_COMMITTEE_QUORUM_UNMET / ERR_HEARING_QUORUM_UNMET); no duplicate MEC vote (ERR_DUPLICATE_MEC_VOTE)"
    error_id: ERR_NO_VERIFICATION_ITEMS
    http_status: 409
    applies_to: "submit, advance-to-committee, finalize, metric create, hold-hearing, committee-vote, mec-endorse"
  - priority: 10
    category: business_referential
    check: "Cross-references coherent: delineation.privilege_line exists in SpecialtyCriteria for member's specialty (ERR_PRIVILEGE_LINE_UNKNOWN); supersedes_application_id belongs to same member (ERR_PRIVILEGE_LINE_UNKNOWN); sponsor_member_id != member_id (ERR_SELF_SPONSOR); agenda item_kind consistent with populated ref_* field (ERR_AGENDA_REF_MISMATCH)"
    error_id: ERR_PRIVILEGE_LINE_UNKNOWN
    http_status: 422
    applies_to: "delineation create, application create, temp create, agenda-items create"
  - priority: 11
    category: business_constraint
    check: "Input shape: required fields, enum membership, string min-lengths, datetime ordering (start < end); REPORT_* NPDB kinds require case_id (ERR_NPDB_CASE_REQUIRED)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/mso/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (fixed startup default; never falls back to wall-clock)."
    roles: [MedicalStaffCoordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["credential_expiry_risk_window recomputed for all members; lapse/expire cascades fired for credentials, grants, temp privileges, terms, hearing deadlines"]

  # --- Specialty criteria ---
  - method: POST
    path: "/mso/specialty-criteria"
    description: "Create specialty criteria"
    roles: [MedicalStaffCoordinator]
    code: 201
    input: [specialty_code, privilege_line, min_training_months, min_case_volume_24mo, required_board_cert, fppe_case_count, volume_tier_table]
    output: SpecialtyCriteria
    side_effects: []

  - method: GET
    path: "/mso/specialty-criteria"
    description: "List specialty criteria"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["specialty_code?", "privilege_line?", "limit?", "offset?"]
    output: "SpecialtyCriteria[]"
    side_effects: []

  - method: GET
    path: "/mso/specialty-criteria/{id}"
    description: "Get one specialty criteria"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: SpecialtyCriteria
    side_effects: []

  # --- Members ---
  - method: POST
    path: "/mso/members"
    description: "Create a medical staff member record (applicant)"
    roles: [MedicalStaffCoordinator]
    code: 201
    input: [full_name, npdb_subject_id, primary_specialty_code]
    output: MedicalStaffMember
    side_effects: ["membership_status = APPLICANT, privilege_posture = NONE"]

  - method: GET
    path: "/mso/members"
    description: "List members"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["membership_status?", "privilege_posture?", "limit?", "offset?"]
    output: "MedicalStaffMember[]"
    side_effects: []

  - method: GET
    path: "/mso/members/{id}"
    description: "Get one member"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: MedicalStaffMember
    side_effects: []

  - method: POST
    path: "/mso/members/{id}/reinstate"
    description: "Reinstate a SUSPENDED member to ACTIVE"
    roles: [MedicalExecutiveCommitteeChair]
    code: 200
    input: []
    output: MedicalStaffMember
    side_effects: ["membership_status -> ACTIVE; privilege_posture recomputed; member.version += 1"]

  - method: GET
    path: "/mso/members/{id}/credential-risk"
    description: "Computed read: credential expiry risk, optionally as-of a past timestamp (chronological variant)"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair]
    code: 200
    input: ["as_of?"]
    output: "{ risk_score: number, variant: string }"
    side_effects: []

  # --- Applications ---
  - method: POST
    path: "/mso/applications"
    description: "Create an application (INITIAL or REAPPOINTMENT); OCC on member.version"
    roles: [MedicalStaffCoordinator]
    code: 201
    input: [member_id, application_kind, expected_member_version, "supersedes_application_id?"]
    output: AppointmentApplication
    side_effects: ["increments MedicalStaffMember.version by 1"]

  - method: GET
    path: "/mso/applications"
    description: "List applications"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["member_id?", "application_status?", "application_kind?", "supersedes_application_id?", "limit?", "offset?"]
    output: "AppointmentApplication[]"
    side_effects: []

  - method: GET
    path: "/mso/applications/{id}"
    description: "Get one application"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: AppointmentApplication
    side_effects: []

  - method: POST
    path: "/mso/applications/{id}/submit"
    description: "Submit an application (DRAFT -> SUBMITTED)"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: []
    output: AppointmentApplication
    side_effects: ["submitted_at set; verification items auto-REQUESTED; member.version += 1"]

  - method: POST
    path: "/mso/applications/{id}/advance-to-committee"
    description: "Advance PSV_COMPLETE application to COMMITTEE_REVIEW"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: []
    output: AppointmentApplication
    side_effects: ["CommitteeAgendaItem auto-created if absent"]

  - method: POST
    path: "/mso/applications/{id}/withdraw"
    description: "Withdraw an application"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: []
    output: AppointmentApplication
    side_effects: ["open verification items WAIVED"]

  # --- Verification items ---
  - method: POST
    path: "/mso/verification-items"
    description: "Attach a verification item to an application"
    roles: [MedicalStaffCoordinator]
    code: 201
    input: [application_id, item_kind, is_primary_source]
    output: VerificationItem
    side_effects: ["application.verification_required_count recomputed"]

  - method: GET
    path: "/mso/verification-items"
    description: "List verification items (filtered by application)"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["application_id?", "item_status?", "limit?", "offset?"]
    output: "VerificationItem[]"
    side_effects: []

  - method: GET
    path: "/mso/verification-items/{id}"
    description: "Get one verification item"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: VerificationItem
    side_effects: []

  - method: POST
    path: "/mso/verification-items/{id}/mark-received"
    description: "Mark item RECEIVED (or re-receive from DISCREPANCY)"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: []
    output: VerificationItem
    side_effects: ["application may flip SUBMITTED -> PSV_IN_PROGRESS"]

  - method: POST
    path: "/mso/verification-items/{id}/verify"
    description: "Verify a RECEIVED item"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: []
    output: VerificationItem
    side_effects: ["verified_at set; counts recomputed; application may flip to PSV_COMPLETE"]

  - method: POST
    path: "/mso/verification-items/{id}/flag-discrepancy"
    description: "Flag a discrepancy on a RECEIVED item"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: [discrepancy_note]
    output: VerificationItem
    side_effects: []

  - method: POST
    path: "/mso/verification-items/{id}/waive"
    description: "Waive an item (CredentialsCommitteeChair)"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: [waiver_justification]
    output: VerificationItem
    side_effects: ["verification_required_count recomputed"]

  # --- Delineations ---
  - method: POST
    path: "/mso/delineations"
    description: "Request a privilege delineation on an application; OCC on application.version"
    roles: [MedicalStaffCoordinator]
    code: 201
    input: [application_id, privilege_line, documented_training_months, documented_cases_24mo, expected_application_version]
    output: PrivilegeDelineation
    side_effects: ["increments AppointmentApplication.version by 1"]

  - method: GET
    path: "/mso/delineations"
    description: "List delineations"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["application_id?", "delineation_status?", "limit?", "offset?"]
    output: "PrivilegeDelineation[]"
    side_effects: []

  - method: GET
    path: "/mso/delineations/{id}"
    description: "Get one delineation"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: PrivilegeDelineation
    side_effects: []

  - method: POST
    path: "/mso/delineations/{id}/evaluate"
    description: "Evaluate a delineation against specialty criteria"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: []
    output: PrivilegeDelineation
    side_effects: ["satisfaction_tier/score computed; status -> CRITERIA_MET or CRITERIA_UNMET"]

  # --- Privilege grants ---
  - method: GET
    path: "/mso/privilege-grants"
    description: "List privilege grants"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["member_id?", "delineation_id?", "grant_status?", "limit?", "offset?"]
    output: "PrivilegeGrant[]"
    side_effects: []

  - method: GET
    path: "/mso/privilege-grants/{id}"
    description: "Get one grant"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: PrivilegeGrant
    side_effects: []

  - method: POST
    path: "/mso/privilege-grants/{id}/relinquish"
    description: "Holder relinquishes a grant"
    roles: [Practitioner]
    code: 200
    input: []
    output: PrivilegeGrant
    side_effects: ["grant -> RELINQUISHED; member counts and posture recomputed"]

  # --- Performance reviews & metrics ---
  - method: POST
    path: "/mso/performance-reviews"
    description: "Open an FPPE or OPPE review"
    roles: [MedicalStaffCoordinator]
    code: 201
    input: [member_id, privilege_grant_id, review_kind, period_start, period_end]
    output: PerformanceReview
    side_effects: ["status = COLLECTING"]

  - method: GET
    path: "/mso/performance-reviews"
    description: "List reviews"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["member_id?", "privilege_grant_id?", "review_status?", "review_kind?", "limit?", "offset?"]
    output: "PerformanceReview[]"
    side_effects: []

  - method: GET
    path: "/mso/performance-reviews/{id}"
    description: "Get one review"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: PerformanceReview
    side_effects: []

  - method: POST
    path: "/mso/performance-reviews/{id}/close-collection"
    description: "COLLECTING -> EVALUATION"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: []
    output: PerformanceReview
    side_effects: []

  - method: POST
    path: "/mso/performance-reviews/{id}/compute-provisional"
    description: "EVALUATION -> PROVISIONAL_RESULT (provisional variant)"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: []
    output: PerformanceReview
    side_effects: ["provisional_composite_score computed"]

  - method: POST
    path: "/mso/performance-reviews/{id}/finalize"
    description: "PROVISIONAL_RESULT -> FINAL_RESULT (final variant, outcome derived)"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: []
    output: PerformanceReview
    side_effects: ["final_composite_score computed; outcome set; possible AdverseActionCase auto-proposal; fppe_cases_completed propagation"]

  - method: POST
    path: "/mso/performance-reviews/{id}/close"
    description: "FINAL_RESULT -> CLOSED"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: []
    output: PerformanceReview
    side_effects: []

  - method: POST
    path: "/mso/performance-metrics"
    description: "Attach a metric to a review"
    roles: [MedicalStaffCoordinator]
    code: 201
    input: [review_id, metric_domain, raw_value, domain_weight, collected_at, "passed_fppe_case?"]
    output: PerformanceMetric
    side_effects: ["review.metric_count recomputed; normalized_value computed"]

  - method: GET
    path: "/mso/performance-metrics"
    description: "List metrics"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["review_id?", "metric_status?", "limit?", "offset?"]
    output: "PerformanceMetric[]"
    side_effects: []

  - method: GET
    path: "/mso/performance-metrics/{id}"
    description: "Get one performance metric"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: PerformanceMetric
    side_effects: []

  - method: POST
    path: "/mso/performance-metrics/{id}/retract"
    description: "Retract a metric"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: []
    output: PerformanceMetric
    side_effects: ["metric_status -> RETRACTED; review.metric_count/retracted_metric_count recomputed"]

  # --- Expirable credentials ---
  - method: POST
    path: "/mso/expirable-credentials"
    description: "Register an expirable credential"
    roles: [MedicalStaffCoordinator]
    code: 201
    input: [member_id, credential_kind, credential_number, issued_on, expires_on, "supersedes_credential_id?"]
    output: ExpirableCredential
    side_effects: ["credential_expiry_risk_window recomputed"]

  - method: GET
    path: "/mso/expirable-credentials"
    description: "List credentials"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["member_id?", "credential_kind?", "credential_status?", "supersedes_credential_id?", "limit?", "offset?"]
    output: "ExpirableCredential[]"
    side_effects: []

  - method: GET
    path: "/mso/expirable-credentials/{id}"
    description: "Get one credential"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: ExpirableCredential
    side_effects: []

  - method: POST
    path: "/mso/expirable-credentials/{id}/renew"
    description: "Renew a LAPSED credential (creates successor row)"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: [credential_number, issued_on, expires_on]
    output: ExpirableCredential
    side_effects: ["old -> RENEWED; new CURRENT row created; suspended grants reinstated; risk recomputed"]

  - method: POST
    path: "/mso/expirable-credentials/{id}/revoke"
    description: "Revoke a CURRENT credential"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: []
    output: ExpirableCredential
    side_effects: ["-> REVOKED; grant suspension cascade"]

  # --- Temporary privileges ---
  - method: POST
    path: "/mso/temporary-privileges"
    description: "Request a temporary/emergency/disaster privilege"
    roles: [MedicalStaffCoordinator]
    code: 201
    input: [member_id, sponsor_member_id, temp_kind, privilege_line, window_start, window_end, "disaster_declaration_ref?"]
    output: TemporaryPrivilege
    side_effects: []

  - method: GET
    path: "/mso/temporary-privileges"
    description: "List temporary privileges"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["member_id?", "sponsor_member_id?", "temp_status?", "temp_kind?", "limit?", "offset?"]
    output: "TemporaryPrivilege[]"
    side_effects: []

  - method: GET
    path: "/mso/temporary-privileges/{id}"
    description: "Get one temporary privilege"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: TemporaryPrivilege
    side_effects: []

  - method: POST
    path: "/mso/temporary-privileges/{id}/activate"
    description: "Activate a pending temporary privilege"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: []
    output: TemporaryPrivilege
    side_effects: ["temp -> ACTIVE; posture recompute"]

  - method: POST
    path: "/mso/temporary-privileges/{id}/terminate"
    description: "Terminate an active temporary privilege early"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: []
    output: TemporaryPrivilege
    side_effects: ["temp -> TERMINATED_EARLY; posture recompute"]

  # --- Adverse action cases & hearings ---
  - method: POST
    path: "/mso/adverse-action-cases"
    description: "Propose an adverse action case"
    roles: [DepartmentChief]
    code: 201
    input: [subject_member_id, proposed_by_member_id, case_kind, "restriction_days?", "linked_review_id?"]
    output: AdverseActionCase
    side_effects: ["hearing_request_deadline = now + HEARING_REQUEST_WINDOW_DAYS"]

  - method: GET
    path: "/mso/adverse-action-cases"
    description: "List cases"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["subject_member_id?", "case_status?", "proposed_by_member_id?", "linked_review_id?", "limit?", "offset?"]
    output: "AdverseActionCase[]"
    side_effects: []

  - method: GET
    path: "/mso/adverse-action-cases/{id}"
    description: "Get one case"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: AdverseActionCase
    side_effects: []

  - method: POST
    path: "/mso/adverse-action-cases/{id}/endorse"
    description: "MEC endorses a proposed case"
    roles: [MedicalExecutiveCommitteeChair]
    code: 200
    input: []
    output: AdverseActionCase
    side_effects: []

  - method: POST
    path: "/mso/adverse-action-cases/{id}/withdraw"
    description: "Proposer withdraws the case"
    roles: [DepartmentChief]
    code: 200
    input: []
    output: AdverseActionCase
    side_effects: []

  - method: POST
    path: "/mso/adverse-action-cases/{id}/request-hearing"
    description: "Subject requests a fair hearing"
    roles: [Practitioner]
    code: 200
    input: []
    output: AdverseActionCase
    side_effects: ["hearing_requested_at set; SoD exclusion tags updated"]

  - method: POST
    path: "/mso/adverse-action-cases/{id}/hold-hearing"
    description: "Convene the hearing (quorum check)"
    roles: [HearingOfficer]
    code: 200
    input: []
    output: AdverseActionCase
    side_effects: []

  - method: POST
    path: "/mso/adverse-action-cases/{id}/decide"
    description: "Hearing decision: UPHELD | OVERTURNED | REMAND"
    roles: [HearingOfficer]
    code: 200
    input: [decision]
    output: AdverseActionCase
    side_effects: ["branch per decision: FINAL_ADVERSE (NPDB + member cascade) | FINAL_NO_ACTION | REMANDED (deadline extension)"]

  - method: POST
    path: "/mso/hearing-panels"
    description: "Seat a hearing panelist"
    roles: [HearingOfficer]
    code: 201
    input: [case_id, panel_member_id, panel_role]
    output: HearingPanel
    side_effects: ["SoD exclusion validated; total_ever_seated for the case incremented; quorum_required recomputed per hearing_quorum_determination"]

  - method: GET
    path: "/mso/hearing-panels"
    description: "List hearing panel seats"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["case_id?", "panel_member_id?", "panel_status?", "limit?", "offset?"]
    output: "HearingPanel[]"
    side_effects: []

  - method: GET
    path: "/mso/hearing-panels/{id}"
    description: "Get one hearing panel seat"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: HearingPanel
    side_effects: []

  - method: POST
    path: "/mso/hearing-panels/{id}/recuse"
    description: "Recuse a seated panelist"
    roles: [HearingOfficer]
    code: 200
    input: []
    output: HearingPanel
    side_effects: ["panel_status -> RECUSED; quorum re-evaluated"]

  # --- NPDB ---
  - method: POST
    path: "/mso/npdb-reports"
    description: "File an NPDB query or report"
    roles: [MedicalStaffCoordinator]
    code: 201
    input: [member_id, report_kind, "case_id?"]
    output: NpdbReport
    side_effects: ["is_late computed against submission_deadline when applicable"]

  - method: GET
    path: "/mso/npdb-reports"
    description: "List NPDB reports"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["member_id?", "case_id?", "report_kind?", "report_status?", "limit?", "offset?"]
    output: "NpdbReport[]"
    side_effects: []

  - method: GET
    path: "/mso/npdb-reports/{id}"
    description: "Get one NPDB report"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: NpdbReport
    side_effects: []

  - method: POST
    path: "/mso/npdb-reports/{id}/acknowledge"
    description: "Acknowledge a submitted report"
    roles: [MedicalStaffCoordinator]
    code: 200
    input: []
    output: NpdbReport
    side_effects: []

  - method: POST
    path: "/mso/npdb-reports/{id}/void"
    description: "Void a report; requires replacement REPORT_CORRECTION id in body"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: [correction_report_id]
    output: NpdbReport
    side_effects: ["report -> VOIDED"]

  # --- Committee agenda ---
  - method: POST
    path: "/mso/agenda-items"
    description: "Create an agenda item (also auto-created by application advance)"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair]
    code: 201
    input: [item_kind, "ref_application_id?", "ref_delineation_id?", "ref_case_id?"]
    output: CommitteeAgendaItem
    side_effects: ["quorum_required computed"]

  - method: GET
    path: "/mso/agenda-items"
    description: "List agenda items"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: ["item_kind?", "committee_status?", "ref_application_id?", "ref_delineation_id?", "ref_case_id?", "limit?", "offset?"]
    output: "CommitteeAgendaItem[]"
    side_effects: []

  - method: GET
    path: "/mso/agenda-items/{id}"
    description: "Get one agenda item"
    roles: [MedicalStaffCoordinator, CredentialsCommitteeChair, MedicalExecutiveCommitteeChair, BoardMember, DepartmentChief, Practitioner, HearingOfficer]
    code: 200
    input: []
    output: CommitteeAgendaItem
    side_effects: []

  - method: POST
    path: "/mso/agenda-items/{id}/committee-vote"
    description: "Record committee vote batch"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: [votes_for, votes_against]
    output: CommitteeAgendaItem
    side_effects: ["vote counts incremented; status -> COMMITTEE_APPROVED or COMMITTEE_REJECTED on quorum"]

  - method: POST
    path: "/mso/agenda-items/{id}/defer"
    description: "Defer an agenda item"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: []
    output: CommitteeAgendaItem
    side_effects: []

  - method: POST
    path: "/mso/agenda-items/{id}/reagenda"
    description: "Return a deferred item to the agenda"
    roles: [CredentialsCommitteeChair]
    code: 200
    input: []
    output: CommitteeAgendaItem
    side_effects: []

  - method: POST
    path: "/mso/agenda-items/{id}/mec-endorse"
    description: "MEC endorses a committee-approved item"
    roles: [MedicalExecutiveCommitteeChair]
    code: 200
    input: [voter_id]
    output: CommitteeAgendaItem
    side_effects: ["voter_id appended to mec_voter_ids; linked application -> BOARD_REVIEW"]

  - method: POST
    path: "/mso/agenda-items/{id}/board-ratify"
    description: "Board ratifies an MEC-endorsed item"
    roles: [BoardMember]
    code: 200
    input: []
    output: CommitteeAgendaItem
    side_effects: ["application APPROVED cascade / grant creation / case finalization per item_kind"]

  - method: POST
    path: "/mso/agenda-items/{id}/board-decline"
    description: "Board declines an MEC-endorsed item"
    roles: [BoardMember]
    code: 200
    input: []
    output: CommitteeAgendaItem
    side_effects: ["application DENIED cascade (auto adverse case for reappointment)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, min-length violation, or start >= end datetime ordering" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a from-state valid for the requested transition" }

  - { id: ERR_APPLICATION_NOT_IN_DRAFT, http: 409, condition: "Submit attempted on non-DRAFT application" }
  - { id: ERR_NO_VERIFICATION_ITEMS, http: 409, condition: "Submit attempted with zero verification items" }
  - { id: ERR_PENDING_APPLICATION_EXISTS, http: 409, condition: "Another in-flight application exists for the member and no supersedes_application_id given" }
  - { id: ERR_OUTSIDE_REAPPOINTMENT_WINDOW, http: 409, condition: "Reappointment submitted outside [term_end - 180d, term_end)" }
  - { id: ERR_PSV_NOT_COMPLETE, http: 409, condition: "Advance-to-committee attempted before PSV_COMPLETE" }
  - { id: ERR_DELINEATIONS_UNEVALUATED, http: 409, condition: "Advance-to-committee with delineations still REQUESTED" }
  - { id: ERR_APPLICATION_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw attempted from COMMITTEE_REVIEW or later" }
  - { id: ERR_APPLICATION_NOT_IN_REVIEW, http: 409, condition: "Delineation evaluation attempted while application not in review states" }

  - { id: ERR_VERIFICATION_NOT_REQUESTED, http: 409, condition: "mark-received on item not in {REQUESTED, DISCREPANCY}" }
  - { id: ERR_VERIFICATION_NOT_RECEIVED, http: 409, condition: "verify/flag-discrepancy on item not RECEIVED" }
  - { id: ERR_VERIFICATION_NOT_WAIVABLE, http: 409, condition: "waive on item not in {REQUESTED, RECEIVED}" }
  - { id: ERR_PRIMARY_SOURCE_NOT_WAIVABLE, http: 403, condition: "Attempt to waive a primary-source NPDB_QUERY item" }
  - { id: ERR_NPDB_QUERY_MISSING, http: 409, condition: "Verifying NPDB_QUERY item without a filed query report for the member" }

  - { id: ERR_DELINEATION_NOT_EVALUABLE, http: 409, condition: "evaluate on non-REQUESTED delineation" }
  - { id: ERR_PRIVILEGE_LINE_UNKNOWN, http: 422, condition: "privilege_line not defined in SpecialtyCriteria for member's primary_specialty_code" }
  - { id: ERR_GRANT_NOT_RELINQUISHABLE, http: 409, condition: "relinquish on grant not in {PROVISIONAL, ACTIVE}" }
  - { id: ERR_NOT_GRANT_HOLDER, http: 403, condition: "Practitioner acting on another member's grant" }

  - { id: ERR_REVIEW_NOT_COLLECTING, http: 409, condition: "close-collection on non-COLLECTING review" }
  - { id: ERR_NO_METRICS, http: 409, condition: "close-collection with zero ACTIVE metrics" }
  - { id: ERR_REVIEW_NOT_EVALUABLE, http: 409, condition: "compute-provisional on non-EVALUATION review" }
  - { id: ERR_REVIEW_NOT_PROVISIONAL, http: 409, condition: "finalize on non-PROVISIONAL_RESULT review" }
  - { id: ERR_WEIGHT_SUM_INVALID, http: 409, condition: "finalize with ACTIVE metric weights summing != 1.000" }
  - { id: ERR_METRIC_OUTSIDE_WINDOW, http: 409, condition: "metric collected_at outside review [period_start, period_end)" }
  - { id: ERR_METRIC_WEIGHT_DOMAIN_MISMATCH, http: 409, condition: "metrics in same domain carry different domain_weight values" }

  - { id: ERR_CREDENTIAL_NOT_LAPSED, http: 409, condition: "renew on non-LAPSED credential" }
  - { id: ERR_CREDENTIAL_NOT_CURRENT, http: 409, condition: "revoke on non-CURRENT credential" }
  - { id: ERR_CREDENTIAL_EXPIRY_PAST, http: 400, condition: "renew with expires_on <= clock now" }

  - { id: ERR_TEMP_NOT_PENDING, http: 409, condition: "activate on non-PENDING_SPONSOR temp privilege" }
  - { id: ERR_TEMP_NOT_ACTIVE, http: 409, condition: "terminate on non-ACTIVE temp privilege" }
  - { id: ERR_SPONSOR_NOT_QUALIFIED, http: 403, condition: "Sponsor lacks membership_status == ACTIVE and privilege_posture == FULL" }
  - { id: ERR_MEMBER_NOT_ELIGIBLE, http: 409, condition: "Recipient membership_status not in {APPLICANT, ACTIVE}" }
  - { id: ERR_TEMP_WINDOW_TOO_LONG, http: 409, condition: "Window exceeds kind cap (24h/72h/120d)" }
  - { id: ERR_TEMP_OVERLAP, http: 409, condition: "Closed-interval overlap with buffered existing ACTIVE temp privilege" }
  - { id: ERR_DISASTER_REF_REQUIRED, http: 400, condition: "DISASTER temp privilege without disaster_declaration_ref" }
  - { id: ERR_SELF_SPONSOR, http: 422, condition: "sponsor_member_id == member_id" }

  - { id: ERR_CASE_NOT_PROPOSED, http: 409, condition: "endorse on non-PROPOSED case" }
  - { id: ERR_CASE_NOT_ENDORSED, http: 409, condition: "request-hearing on case not in {MEC_ENDORSED, REMANDED}" }
  - { id: ERR_CASE_NOT_IN_HEARING, http: 409, condition: "hold-hearing on non-HEARING_REQUESTED case" }
  - { id: ERR_CASE_NOT_HEARD, http: 409, condition: "decide on non-HEARING_HELD case" }
  - { id: ERR_CASE_NOT_WITHDRAWABLE, http: 409, condition: "withdraw on case beyond MEC_ENDORSED" }
  - { id: ERR_NOT_CASE_PROPOSER, http: 403, condition: "withdraw by someone other than proposed_by_member_id" }
  - { id: ERR_NOT_CASE_SUBJECT, http: 403, condition: "request-hearing by someone other than subject_member_id" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "endorse on case whose subject is not ACTIVE" }
  - { id: ERR_HEARING_REQUEST_LATE, http: 409, condition: "hearing requested after hearing_request_deadline" }
  - { id: ERR_HEARING_QUORUM_UNMET, http: 409, condition: "hold-hearing without quorum of eligible seated panelists" }
  - { id: ERR_PANELIST_NOT_SEATED, http: 409, condition: "recuse on non-SEATED panelist" }
  - { id: ERR_PANELIST_SOD_EXCLUDED, http: 403, condition: "Seating a panelist whose sod_exclusion_tags contain the case_id" }
  - { id: ERR_OPEN_CASE_EXISTS, http: 409, condition: "reinstate while an adverse case is open for the member" }
  - { id: ERR_MEMBER_NOT_SUSPENDED, http: 409, condition: "reinstate on non-SUSPENDED member" }

  - { id: ERR_NPDB_NOT_ACKNOWLEDGEABLE, http: 409, condition: "acknowledge on report not in {SUBMITTED, LATE}" }
  - { id: ERR_NPDB_NOT_VOIDABLE, http: 409, condition: "void on report not in {SUBMITTED, LATE}" }
  - { id: ERR_CORRECTION_REQUIRED, http: 409, condition: "void without replacement REPORT_CORRECTION" }
  - { id: ERR_NPDB_CASE_REQUIRED, http: 400, condition: "REPORT_* kinds require case_id" }

  - { id: ERR_ITEM_NOT_VOTABLE, http: 409, condition: "committee-vote on item not in {AGENDA, DEFERRED}" }
  - { id: ERR_COMMITTEE_QUORUM_UNMET, http: 409, condition: "vote batch does not reach quorum_required" }
  - { id: ERR_CASE_NOT_READY_FOR_COMMITTEE, http: 409, condition: "ADVERSE_ACTION item voted while case not in {HEARING_HELD, MEC_ENDORSED}" }
  - { id: ERR_ITEM_NOT_DEFERRABLE, http: 409, condition: "defer on non-AGENDA item" }
  - { id: ERR_ITEM_NOT_REAGENDABLE, http: 409, condition: "reagenda on non-DEFERRED item" }
  - { id: ERR_ITEM_NOT_COMMITTEE_APPROVED, http: 409, condition: "mec-endorse on non-COMMITTEE_APPROVED item" }
  - { id: ERR_DUPLICATE_MEC_VOTE, http: 409, condition: "voter_id already present in mec_voter_ids" }
  - { id: ERR_ITEM_NOT_MEC_ENDORSED, http: 409, condition: "board action on non-MEC_ENDORSED item" }
  - { id: ERR_SOD_BOARD_CONFLICT, http: 403, condition: "Board voter appears in mec_voter_ids for the same item" }
  - { id: ERR_AGENDA_REF_MISMATCH, http: 422, condition: "item_kind inconsistent with which ref_* fields are populated" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MedicalStaffCoordinator
    description: "Medical staff office operations staff; runs applications, verifications, delineations, metrics, credentials, NPDB filings, clock"
    identity: opaque
    exclusive_operations:
      - "POST /mso/_clock/set_current_utc"
      - "POST /mso/specialty-criteria"
      - "POST /mso/members"
      - "POST /mso/applications"
      - "POST /mso/applications/{id}/submit"
      - "POST /mso/applications/{id}/withdraw"
      - "POST /mso/verification-items"
      - "POST /mso/verification-items/{id}/mark-received"
      - "POST /mso/verification-items/{id}/verify"
      - "POST /mso/verification-items/{id}/flag-discrepancy"
      - "POST /mso/delineations"
      - "POST /mso/delineations/{id}/evaluate"
      - "POST /mso/performance-reviews"
      - "POST /mso/performance-reviews/{id}/close-collection"
      - "POST /mso/performance-reviews/{id}/compute-provisional"
      - "POST /mso/performance-metrics"
      - "POST /mso/performance-metrics/{id}/retract"
      - "POST /mso/expirable-credentials"
      - "POST /mso/expirable-credentials/{id}/renew"
      - "POST /mso/temporary-privileges"
      - "POST /mso/npdb-reports"
      - "POST /mso/npdb-reports/{id}/acknowledge"
    shared_operations:
      - "POST /mso/agenda-items (shared with CredentialsCommitteeChair)"
      - "GET endpoints (shared with all roles)"

  - name: CredentialsCommitteeChair
    description: "Chair of the credentials committee; waivers, committee votes, temp privilege activation, finalizes reviews"
    identity: opaque
    exclusive_operations:
      - "POST /mso/applications/{id}/advance-to-committee"
      - "POST /mso/verification-items/{id}/waive"
      - "POST /mso/performance-reviews/{id}/finalize"
      - "POST /mso/performance-reviews/{id}/close"
      - "POST /mso/expirable-credentials/{id}/revoke"
      - "POST /mso/temporary-privileges/{id}/activate"
      - "POST /mso/temporary-privileges/{id}/terminate"
      - "POST /mso/npdb-reports/{id}/void"
      - "POST /mso/agenda-items/{id}/committee-vote"
      - "POST /mso/agenda-items/{id}/defer"
      - "POST /mso/agenda-items/{id}/reagenda"
    shared_operations:
      - "POST /mso/agenda-items (shared with MedicalStaffCoordinator)"
      - "GET endpoints (shared with all roles)"

  - name: MedicalExecutiveCommitteeChair
    description: "MEC chair; endorses adverse cases and committee-approved items; reinstates suspended members"
    identity: opaque
    exclusive_operations:
      - "POST /mso/members/{id}/reinstate"
      - "POST /mso/adverse-action-cases/{id}/endorse"
      - "POST /mso/agenda-items/{id}/mec-endorse"
    shared_operations:
      - "GET endpoints (shared with all roles)"

  - name: BoardMember
    description: "Hospital governing board member; final ratification authority. SoD: may not ratify an item whose mec_voter_ids contains their X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /mso/agenda-items/{id}/board-ratify"
      - "POST /mso/agenda-items/{id}/board-decline"
    shared_operations:
      - "GET endpoints (shared with all roles)"

  - name: DepartmentChief
    description: "Clinical department chief; proposes and may withdraw adverse action cases. Entity-backed by their own MedicalStaffMember record"
    identity: "entity_backed:MedicalStaffMember"
    exclusive_operations:
      - "POST /mso/adverse-action-cases"
      - "POST /mso/adverse-action-cases/{id}/withdraw"
    shared_operations:
      - "GET endpoints (shared with all roles)"

  - name: Practitioner
    description: "Medical staff member as an applicant/practitioner; requests hearings, relinquishes own grants"
    identity: "entity_backed:MedicalStaffMember"
    exclusive_operations:
      - "POST /mso/adverse-action-cases/{id}/request-hearing"
      - "POST /mso/privilege-grants/{id}/relinquish"
    shared_operations:
      - "GET endpoints (shared with all roles)"

  - name: HearingOfficer
    description: "Presiding officer of fair hearings; seats panels, convenes hearings, renders decisions, recusals"
    identity: opaque
    exclusive_operations:
      - "POST /mso/hearing-panels"
      - "POST /mso/hearing-panels/{id}/recuse"
      - "POST /mso/adverse-action-cases/{id}/hold-hearing"
      - "POST /mso/adverse-action-cases/{id}/decide"
