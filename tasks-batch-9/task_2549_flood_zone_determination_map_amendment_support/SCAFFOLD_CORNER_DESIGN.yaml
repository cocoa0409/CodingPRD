            - "the same appeal-period body sent as ProviderAnalyst, ProviderReviewer, Lender or Borrower returns 403 with data.error_id == ERR_FORBIDDEN_ROLE and leaves revision_status at PRELIMINARY"
            - "POST /flood-zone/map-panels, POST .../appeal-decision and POST .../effective return 403 ERR_FORBIDDEN_ROLE for every one of those four roles as well - the agency's exclusive_operations list is closed"
            - "GET /flood-zone/map-panels/${p2_id} as Lender returns 200 with revision_status == APPEAL_OPEN: reads of the map are shared with all five roles even though writes are not"
            - "AgencyOfficer itself is refused the provider's exclusive writes: POST /flood-zone/determinations and POST /flood-zone/properties as AgencyOfficer return 403 ERR_FORBIDDEN_ROLE, so the exclusivity is symmetric rather than hierarchical"

