            - call: "POST /home-oxygen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: BranchManager
              captures: { expired_count: $.data.expired_cmn_count }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_i}", form_type: "RECERTIFICATION", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 6, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_c: $.data.id, score_c: $.data.documentation_score }
            - call: "POST /home-oxygen/cmns/${cmn_c}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_c}/sign"
              payload: {}
