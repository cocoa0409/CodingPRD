  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: field_posture_outranks_booking_window_conflict_on_create
        grounds:
          - validations[priority=51]
          - validations[priority=62]
          - errors[ERR_FIELD_NOT_PLAYABLE]
          - errors[ERR_BOOKING_WINDOW_CONFLICT]
          - state_machines.Field.OPEN_to_CLOSED_ADMIN
        distinguishing_aspect: |
          Category pair business_safety (priority 51) versus business_temporal (priority 62):
          the request violates both rules at once, and the 422 ERR_FIELD_NOT_PLAYABLE must be
          returned rather than the 409 ERR_BOOKING_WINDOW_CONFLICT. The conflict is genuinely
          live because an administrative closure deliberately leaves existing bookings
          SCHEDULED.
        test_recipe:
          setup:
            - "One NATURAL_GRASS field installed 2018-04-15, expected_life_years 12, area 80000, sanctioned_level STATE, warranty_expires_on 2026-04-15."
            - "One SCHEDULED UsageBooking for PRACTICE 2026-08-05T19:00:00Z to 2026-08-05T21:00:00Z, 30 participants (never confirmed)."
            - "An administrative closure placed on the field with reason_code IRRIGATION_MAIN_BREAK, so play_status is CLOSED_ADMIN while the booking is still SCHEDULED and therefore still occupies its window."
            - "Field.open_mandatory_remediation_count is 0, so the closure order itself is permitted."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Priya Raman", roles: ["FieldOperationsCoordinator"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ops: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Main 1", surface_type: "NATURAL_GRASS", installed_on_date: "2018-04-15", expected_life_years: 12, area_sq_ft: 80000, sanctioned_level: "STATE", warranty_expires_on: "2026-04-15" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_ng: $.data.id }
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_ng}", requested_by_staff_member_id: "${s_ops}", activity_type: "PRACTICE", window_start_utc: "2026-08-05T19:00:00Z", window_end_utc: "2026-08-05T21:00:00Z", expected_participant_count: 30 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { b1: $.data.id }
            - call: "POST /turf/fields/${f_ng}/closure-order"
              payload: { action: "CLOSE_ADMIN", reason_code: "IRRIGATION_MAIN_BREAK" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
          trigger:
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_ng}", requested_by_staff_member_id: "${s_ops}", activity_type: "PRACTICE", window_start_utc: "2026-08-05T20:00:00Z", window_end_utc: "2026-08-05T22:00:00Z", expected_participant_count: 30 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
          assert:
            - "response status == 422 and response.data.error_id == \"ERR_FIELD_NOT_PLAYABLE\""
            - "response.data.error_id != \"ERR_BOOKING_WINDOW_CONFLICT\" even though the requested window 20:00-22:00 overlaps the SCHEDULED booking 19:00-21:00 well inside the 30-minute changeover buffer"
            - "Field.${f_ng}.play_status == \"CLOSED_ADMIN\" and Field.${f_ng}.admin_closure_reason_code == \"IRRIGATION_MAIN_BREAK\""
            - "UsageBooking.${b1}.status == \"SCHEDULED\" - the administrative closure did not cancel it, which is why the temporal conflict is real rather than hypothetical"
            - "no new UsageBooking row was created; GET /turf/usage-bookings with field_id ${f_ng} returns exactly one item"

      - name: plan_state_check_outranks_budget_insufficiency_on_decide
        grounds:
          - validations[priority=44]
          - validations[priority=69]
          - errors[ERR_PLAN_NOT_SUBMITTED]
          - errors[ERR_BUDGET_INSUFFICIENT]
        distinguishing_aspect: |
          A different category pair from the posture instance: state (priority 44) versus
          business_fiscal (priority 69). The plan is still DRAFT and simultaneously costs
          5243000 against an available balance of only 1000000, and the 409
          ERR_PLAN_NOT_SUBMITTED must win over the 422 ERR_BUDGET_INSUFFICIENT.
        test_recipe:
          setup:
            - "One SYNTHETIC_TURF field installed 2016-06-01, expected_life_years 10, area 70000, infill_depth_mm 34.0, warranty_expires_on 2024-06-01."
            - "One OPEN CapitalBudget for fiscal_year 2027 with total_authorized_amount_cents 1000000: lock_threshold_amount_cents 900000, committed 0, available 1000000, status OPEN."
            - "One ReplacementPlan on that field, area 70000, target SYNTHETIC_TURF, basis CONDITION_RISK, plan_funding_amount_cents 5243000, left in funding_status DRAFT (never submitted, so submitted_by_staff_member_id is null and the segregation-of-duties check at priority 15 cannot fire)."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Marcus Hale", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_dir2: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
            - call: "POST /turf/capital-budgets"
              payload: { fiscal_year: 2027, total_authorized_amount_cents: 1000000 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { bud: $.data.id }
            - call: "GET /turf/fields/${f_sy}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy_ver: $.data.version }
            - call: "POST /turf/replacement-plans"
              payload: { field_id: "${f_sy}", capital_budget_id: "${bud}", target_surface_type: "SYNTHETIC_TURF", area_sq_ft: 70000, priority_basis: "CONDITION_RISK", planned_install_year: 2028, expected_field_version: "${f_sy_ver}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /turf/replacement-plans/${p1}/decide"
              payload: { decision: "APPROVE", decided_by_staff_member_id: "${s_dir2}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir2}"
          assert:
            - "response status == 409 and response.data.error_id == \"ERR_PLAN_NOT_SUBMITTED\""
            - "response.data.error_id != \"ERR_BUDGET_INSUFFICIENT\" even though 5243000 exceeds CapitalBudget.${bud}.available_amount_cents 1000000"
            - "ReplacementPlan.${p1}.funding_status == \"DRAFT\" and ReplacementPlan.${p1}.decided_by_staff_member_id is null"
            - "CapitalBudget.${bud}.committed_amount_cents == 0, CapitalBudget.${bud}.available_amount_cents == 1000000, CapitalBudget.${bud}.status == \"OPEN\""

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: gmax_mean_exactly_at_mandatory_limit_is_advisory_not_fail
        grounds:
          - calculations.impact_attenuation_result
          - calculations.field_play_status
          - entities.SafetyAssessment.fields.gmax_mean_value
          - entities.RemediationOrder.fields.severity
          - endpoints[POST /turf/safety-assessments]
        distinguishing_aspect: |
          Metric: the g-max decimal mean at GMAX_MANDATORY_LIMIT 200.0, exercised on
          POST /turf/safety-assessments. Three readings 199.9 / 200.0 / 200.1 average to
          exactly 200.0, and because the mandatory comparison is `<=` the result is ADVISORY,
          not FAIL - so the field goes RESTRICTED rather than CLOSED_UNSAFE. A 0.1 shift in
          any single reading (readings 200.0 / 200.1 / 200.2, mean 200.1) flips it to FAIL.
        test_recipe:
          setup:
            - "Logical clock left at its default 2026-08-01T00:00:00Z."
            - "One NATURAL_GRASS field installed 2025-08-01, expected_life_years 12, area 60000, warranty_expires_on 2030-08-01, sanctioned_level LOCAL: age_years 1.00, warranty_status ACTIVE, cumulative_wear_units 0.00, play_status OPEN, no assessments recorded."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Ines Vargas", roles: ["SafetyInspector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ins: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
          trigger:
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_new}", inspector_staff_member_id: "${s_ins}", assessment_type: "IMPACT_ATTENUATION", assessed_at_utc: "2026-08-01T00:00:00Z", gmax_readings: [199.9, 200.0, 200.1] }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { a_bnd: $.data.id, a_bnd_mean: $.data.gmax_mean_value, a_bnd_result: $.data.result }
            - call: "GET /turf/remediation-orders"
              payload: { field_id: "${f_new}" }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { ord1: "$.data[0].id", ord1_sev: "$.data[0].severity" }
          assert:
            - "SafetyAssessment.${a_bnd}.gmax_mean_value == 200.0"
            - "SafetyAssessment.${a_bnd}.result == \"ADVISORY\" and SafetyAssessment.${a_bnd}.result != \"FAIL\""
            - "RemediationOrder.${ord1}.severity == \"ADVISORY\" and RemediationOrder.${ord1}.status == \"OPEN\""
            - "Field.${f_new}.open_advisory_remediation_count == 1 and Field.${f_new}.open_mandatory_remediation_count == 0"
            - "Field.${f_new}.play_status == \"RESTRICTED\" and not \"CLOSED_UNSAFE\""
            - "Field.${f_new}.latest_gmax_mean_value == 200.0"
            - "Field.${f_new}.condition_index_agronomic == 68.33 (wear_component 100.00 * 0.50 + age_component 91.67 * 0.20 + safety_component 0.00 * 0.30)"
            - "a second field given readings 200.0 / 200.1 / 200.2 yields gmax_mean_value 200.1, result \"FAIL\" and play_status \"CLOSED_UNSAFE\" - the 0.1 step on the far side of the limit"

      - name: budget_locks_when_commitment_exactly_equals_lock_threshold
        grounds:
          - calculations.capital_budget_commitment
          - entities.CapitalBudget.fields.lock_threshold_amount_cents
          - state_machines.CapitalBudget.OPEN_to_LOCKED
          - endpoints[POST /turf/replacement-plans/{id}/decide]
        distinguishing_aspect: |
          A different metric on a different endpoint from the g-max instance: an integer-cent
          commitment ratio at BUDGET_LOCK_TRIGGER_RATIO 0.90, exercised on
          POST /turf/replacement-plans/{id}/decide. Two budgets differing by a single cent
          (5825556 vs 5825557) give thresholds 5243000 and 5243001; the identical 5243000
          commitment locks the first (`>=` at exact equality) and leaves the second OPEN.
        test_recipe:
          setup:
            - "Logical clock left at its default 2026-08-01T00:00:00Z."
            - "Two SYNTHETIC_TURF fields, both installed 2016-06-01, expected_life_years 10, area 70000, infill_depth_mm 34.0, warranty_expires_on 2024-06-01 (distinct names), each with condition_index_agronomic 65.00 and CONDITION_RISK score 36.00."
            - "Budget A: fiscal_year 2027, total_authorized_amount_cents 5825556, so lock_threshold_amount_cents is 5243000 exactly (ceil of 5825556 * 0.90 = 5243000.4)."
            - "Budget B: fiscal_year 2028, total_authorized_amount_cents 5825557, so lock_threshold_amount_cents is 5243001 (ceil of 5243001.3)."
            - "Plan A on field A against budget A and plan B on field B against budget B, both area 70000 / target SYNTHETIC_TURF / basis CONDITION_RISK, so both cost exactly 5243000; both SUBMITTED by Dana Reyes."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Marcus Hale", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_dir2: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_a: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 2", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_b: $.data.id }
            - call: "POST /turf/capital-budgets"
              payload: { fiscal_year: 2027, total_authorized_amount_cents: 5825556 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { bud_a: $.data.id, thr_a: $.data.lock_threshold_amount_cents }
            - call: "POST /turf/capital-budgets"
              payload: { fiscal_year: 2028, total_authorized_amount_cents: 5825557 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { bud_b: $.data.id, thr_b: $.data.lock_threshold_amount_cents }
            - call: "GET /turf/fields/${f_a}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_a_ver: $.data.version }
            - call: "POST /turf/replacement-plans"
              payload: { field_id: "${f_a}", capital_budget_id: "${bud_a}", target_surface_type: "SYNTHETIC_TURF", area_sq_ft: 70000, priority_basis: "CONDITION_RISK", planned_install_year: 2028, expected_field_version: "${f_a_ver}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { p_a: $.data.id }
            - call: "GET /turf/fields/${f_b}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_b_ver: $.data.version }
            - call: "POST /turf/replacement-plans"
              payload: { field_id: "${f_b}", capital_budget_id: "${bud_b}", target_surface_type: "SYNTHETIC_TURF", area_sq_ft: 70000, priority_basis: "CONDITION_RISK", planned_install_year: 2029, expected_field_version: "${f_b_ver}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { p_b: $.data.id }
            - call: "POST /turf/replacement-plans/${p_a}/submit"
              payload: { submitted_by_staff_member_id: "${s_dir}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/replacement-plans/${p_b}/submit"
              payload: { submitted_by_staff_member_id: "${s_dir}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
          trigger:
            - call: "POST /turf/replacement-plans/${p_a}/decide"
              payload: { decision: "APPROVE", decided_by_staff_member_id: "${s_dir2}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir2}"
            - call: "POST /turf/replacement-plans/${p_b}/decide"
              payload: { decision: "APPROVE", decided_by_staff_member_id: "${s_dir2}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir2}"
          assert:
            - "CapitalBudget.${bud_a}.lock_threshold_amount_cents == 5243000 and CapitalBudget.${bud_b}.lock_threshold_amount_cents == 5243001"
            - "ReplacementPlan.${p_a}.plan_funding_amount_cents == 5243000 and ReplacementPlan.${p_b}.plan_funding_amount_cents == 5243000"
            - "CapitalBudget.${bud_a}.committed_amount_cents == 5243000 and CapitalBudget.${bud_a}.status == \"LOCKED\" - committed == threshold triggers the lock because the comparison is `>=`"
            - "CapitalBudget.${bud_b}.committed_amount_cents == 5243000 and CapitalBudget.${bud_b}.status == \"OPEN\" - one cent of authorisation below the lock"
            - "CapitalBudget.${bud_a}.available_amount_cents == 582556 and CapitalBudget.${bud_b}.available_amount_cents == 582557"
            - "both plans reach funding_status \"APPROVED\" - the lock is a side effect of the approval, not a bar to it"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: packet_create_requires_governing_assessment_still_recorded
        grounds:
          - validations[priority=57]
          - errors[ERR_GOVERNING_ASSESSMENT_NOT_CURRENT]
          - state_machines.SafetyAssessment.RECORDED_to_VOIDED
          - entities.CertificationPacket.fields.governing_assessment_id
        distinguishing_aspect: |
          Entity pair CertificationPacket -> SafetyAssessment: whether a packet may be created
          depends entirely on the *other* entity's status field. The field itself is OPEN,
          the officer is authorised and the OCC version is fresh; only the assessment's move
          from RECORDED to VOIDED blocks the write.
        test_recipe:
          setup:
            - "Logical clock left at its default 2026-08-01T00:00:00Z."
            - "One NATURAL_GRASS field installed 2025-08-01, expected_life_years 12, area 60000, warranty_expires_on 2030-08-01, sanctioned_level LOCAL."
            - "One IMPACT_ATTENUATION assessment with three readings of 120.0, so result is PASS and no remediation order is opened; the field stays OPEN."
            - "That assessment is then VOIDED with void_reason CALIBRATION_DEFECT, which clears Field.latest_gmax_mean_value."
            - "The Field version is re-read after the void so the packet create carries a fresh expected_field_version and cannot fail on ERR_STALE_FIELD_VERSION at priority 33."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Ines Vargas", roles: ["SafetyInspector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ins: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Cyril Okafor", roles: ["CertificationOfficer"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_cert: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_new}", inspector_staff_member_id: "${s_ins}", assessment_type: "IMPACT_ATTENUATION", assessed_at_utc: "2026-08-01T00:00:00Z", gmax_readings: [120.0, 120.0, 120.0] }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { a_pass: $.data.id, a_pass_result: $.data.result }
            - call: "POST /turf/safety-assessments/${a_pass}/void"
              payload: { void_reason: "CALIBRATION_DEFECT" }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { a_pass_status: $.data.status }
            - call: "GET /turf/fields/${f_new}"
              payload: {}
              as: CertificationOfficer
              as_user_id: "${s_cert}"
              captures: { f_new_ver: $.data.version }
          trigger:
            - call: "POST /turf/certification-packets"
              payload: { field_id: "${f_new}", governing_assessment_id: "${a_pass}", competition_season_label: "2026-FALL", expected_field_version: "${f_new_ver}" }
              as: CertificationOfficer
              as_user_id: "${s_cert}"
          assert:
            - "response status == 422 and response.data.error_id == \"ERR_GOVERNING_ASSESSMENT_NOT_CURRENT\""
            - "SafetyAssessment.${a_pass}.status == \"VOIDED\" and SafetyAssessment.${a_pass}.void_reason == \"CALIBRATION_DEFECT\""
            - "SafetyAssessment.${a_pass}.result == \"PASS\" - the assessment's own result is still passing, so the refusal is purely about its status"
            - "Field.${f_new}.latest_gmax_mean_value is null and Field.${f_new}.condition_index_agronomic == 83.33"
            - "Field.${f_new}.play_status == \"OPEN\" and Field.${f_new}.open_certification_packet_count == 0 - no packet row was created"
            - "response.data.error_id != \"ERR_STALE_FIELD_VERSION\" - the OCC token was refreshed after the void"

      - name: tournament_confirmation_requires_field_certification_status
        grounds:
          - validations[priority=59]
          - errors[ERR_FIELD_NOT_CERTIFIED]
          - calculations.field_certification_status
          - state_machines.UsageBooking.SCHEDULED_to_CONFIRMED
        distinguishing_aspect: |
          A different entity pair from the packet/assessment dependency: UsageBooking -> Field
          certification axis. Creation succeeds and only *confirmation* consults the other
          entity, so the dependency is positioned mid-lifecycle; and the blocking field is
          Field.certification_status, an axis wholly independent of the play_status posture
          that the same booking flow also checks.
        test_recipe:
          setup:
            - "Logical clock left at its default 2026-08-01T00:00:00Z."
            - "One SYNTHETIC_TURF field installed 2016-06-01, expected_life_years 10, area 70000, infill_depth_mm 34.0, warranty_expires_on 2024-06-01, sanctioned_level REGIONAL: play_status OPEN, certification_status NOT_CERTIFIED, certified_until_utc null."
            - "One SCHEDULED UsageBooking for TOURNAMENT 2026-08-05T09:00:00Z to 2026-08-05T17:00:00Z, 500 participants - the creation itself is allowed because the field posture is OPEN and TOURNAMENT is in the OPEN allowed-activity set."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Priya Raman", roles: ["FieldOperationsCoordinator"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ops: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_sy}", requested_by_staff_member_id: "${s_ops}", activity_type: "TOURNAMENT", window_start_utc: "2026-08-05T09:00:00Z", window_end_utc: "2026-08-05T17:00:00Z", expected_participant_count: 500 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { b_tour: $.data.id, b_tour_status: $.data.status }
          trigger:
            - call: "POST /turf/usage-bookings/${b_tour}/confirm"
              payload: {}
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
          assert:
            - "the setup creation returned 201 with UsageBooking.${b_tour}.status == \"SCHEDULED\" - the dependency is not checked at creation"
            - "response status == 422 and response.data.error_id == \"ERR_FIELD_NOT_CERTIFIED\""
            - "UsageBooking.${b_tour}.status is still \"SCHEDULED\" and UsageBooking.${b_tour}.confirmed_at_utc is null"
            - "Field.${f_sy}.certification_status == \"NOT_CERTIFIED\" and Field.${f_sy}.certified_until_utc is null"
            - "Field.${f_sy}.play_status == \"OPEN\" - the refusal is on the certification axis, not the posture axis, so error_id != \"ERR_FIELD_NOT_PLAYABLE\""
            - "the same confirm call on an otherwise identical PRACTICE booking returns 200, confirming the rule is scoped to sanctioned competition activities"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: booking_changeover_buffer_rejects_zero_gap_and_accepts_thirty_minutes
        grounds:
          - validations[priority=62]
          - errors[ERR_BOOKING_WINDOW_CONFLICT]
          - entities.UsageBooking.fields.window_start_utc
          - endpoints[POST /turf/usage-bookings]
        distinguishing_aspect: |
          Resource: the Field. Interval semantics: half-open [start, end) widened by
          CHANGEOVER_BUFFER_MINUTES 30 on BOTH sides, so exact adjacency (21:00 against a
          19:00-21:00 booking) is a conflict and only a full 30-minute gap (21:30) clears it.
          Capacity is one - a single overlapping peer is fatal.
        test_recipe:
          setup:
            - "Logical clock left at its default 2026-08-01T00:00:00Z."
            - "One NATURAL_GRASS field installed 2025-08-01, expected_life_years 12, area 60000, warranty_expires_on 2030-08-01, sanctioned_level LOCAL, play_status OPEN."
            - "One SCHEDULED UsageBooking for PRACTICE 2026-08-05T19:00:00Z to 2026-08-05T21:00:00Z, 30 participants, so its buffered exclusion window is 18:30-21:30."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Priya Raman", roles: ["FieldOperationsCoordinator"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ops: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_new}", requested_by_staff_member_id: "${s_ops}", activity_type: "PRACTICE", window_start_utc: "2026-08-05T19:00:00Z", window_end_utc: "2026-08-05T21:00:00Z", expected_participant_count: 30 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { b_first: $.data.id }
          trigger:
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_new}", requested_by_staff_member_id: "${s_ops}", activity_type: "PRACTICE", window_start_utc: "2026-08-05T21:00:00Z", window_end_utc: "2026-08-05T23:00:00Z", expected_participant_count: 30 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_new}", requested_by_staff_member_id: "${s_ops}", activity_type: "PRACTICE", window_start_utc: "2026-08-05T21:30:00Z", window_end_utc: "2026-08-05T23:30:00Z", expected_participant_count: 30 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { b_ok: $.data.id }
          assert:
            - "the 21:00-23:00 request returns 409 with response.data.error_id == \"ERR_BOOKING_WINDOW_CONFLICT\" - exact end-to-start adjacency is a conflict once the 30-minute buffer is applied"
            - "the 21:30-23:30 request returns 201 and UsageBooking.${b_ok}.status == \"SCHEDULED\" - a gap of exactly CHANGEOVER_BUFFER_MINUTES clears the guard"
            - "UsageBooking.${b_first}.status == \"SCHEDULED\" and is untouched by either attempt"
            - "GET /turf/usage-bookings with field_id ${f_new} returns exactly two items"
            - "a request for 2026-08-05T17:30:00Z-2026-08-05T18:30:00Z also returns 201, showing the buffer applies symmetrically before the existing window rather than only after it"

      - name: staff_task_capacity_counts_closed_interval_overlaps_at_two
        grounds:
          - validations[priority=63]
          - errors[ERR_STAFF_TASK_CAPACITY_EXCEEDED]
          - entities.MaintenanceTask.fields.assigned_staff_member_id
          - endpoints[POST /turf/maintenance-tasks]
        distinguishing_aspect: |
          A different resource (StaffMember, not Field) with deliberately different interval
          semantics: CLOSED intervals, so touching endpoints DO count as overlap, and an
          aggregate capacity of MAX_CONCURRENT_STAFF_TASKS 2 rather than 1 - the third
          simultaneous task is the one refused, and a window that touches only one existing
          task at a single instant is still accepted.
        test_recipe:
          setup:
            - "Logical clock left at its default 2026-08-01T00:00:00Z."
            - "One NATURAL_GRASS field installed 2025-08-01, expected_life_years 12, area 60000, warranty_expires_on 2030-08-01, sanctioned_level LOCAL, play_status OPEN (natural-grass task types are permitted on it)."
            - "One TurfAgronomist, Tobias Lund, assigned two SCHEDULED tasks on 2026-08-10: AERATION 08:00-10:00 and OVERSEEDING 10:00-12:00. Under closed-interval semantics these two already touch at 10:00, so the agronomist is at capacity 2 for the single instant 10:00."
            - "No UsageBooking exists on the field, so the task-versus-booking guard at priority 64 cannot fire."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Tobias Lund", roles: ["TurfAgronomist"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_agr: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_new}", assigned_staff_member_id: "${s_agr}", task_type: "AERATION", scheduled_start_utc: "2026-08-10T08:00:00Z", scheduled_end_utc: "2026-08-10T10:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t1: $.data.id }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_new}", assigned_staff_member_id: "${s_agr}", task_type: "OVERSEEDING", scheduled_start_utc: "2026-08-10T10:00:00Z", scheduled_end_utc: "2026-08-10T12:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_new}", assigned_staff_member_id: "${s_agr}", task_type: "IRRIGATION", scheduled_start_utc: "2026-08-10T09:00:00Z", scheduled_end_utc: "2026-08-10T11:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_new}", assigned_staff_member_id: "${s_agr}", task_type: "IRRIGATION", scheduled_start_utc: "2026-08-10T12:00:00Z", scheduled_end_utc: "2026-08-10T13:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t4: $.data.id }
          assert:
            - "the 09:00-11:00 request returns 409 with response.data.error_id == \"ERR_STAFF_TASK_CAPACITY_EXCEEDED\" - it overlaps both existing tasks, so the concurrent count would be 3"
            - "the 12:00-13:00 request returns 201 and MaintenanceTask.${t4}.status == \"SCHEDULED\" - it touches only OVERSEEDING at the single instant 12:00, giving a concurrent count of 2, which is permitted"
            - "MaintenanceTask.${t1}.status == \"SCHEDULED\" and MaintenanceTask.${t2}.status == \"SCHEDULED\" - the two pre-existing touching tasks are themselves legal at capacity 2"
            - "GET /turf/maintenance-tasks with assigned_staff_member_id ${s_agr} returns exactly three items"
            - "the same 09:00-11:00 IRRIGATION window assigned to a second TurfAgronomist returns 201, proving the capacity is per-staff-member and not per-field"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: rain_out_relief_entry_restores_cumulative_wear_units_exactly
        grounds:
          - calculations.field_cumulative_wear_units
          - calculations.wear_load_units
          - calculations.field_rest_debt_hours
          - state_machines.UsageBooking.CONFIRMED_to_RAINED_OUT
          - entities.UsageLedgerEntry.fields.wear_units_delta
          - entities.UsageLedgerEntry.fields.running_balance_after
        distinguishing_aspect: |
          Conserved quantity: Field.cumulative_wear_units, defined as the sum of every
          UsageLedgerEntry.wear_units_delta. A rain-out does NOT delete the PLAY_WEAR entry -
          it appends an equal and opposite RAIN_OUT_RELIEF entry of -3.65, so the ledger
          retains both hops and the running balance returns to exactly 0.00. The rest
          obligation is deliberately NOT compensated, proving the reversal is scoped to a
          single quantity.
        test_recipe:
          setup:
            - "One NATURAL_GRASS field installed 2025-08-01, expected_life_years 12, area 60000, warranty_expires_on 2030-08-01, sanctioned_level LOCAL: cumulative_wear_units 0.00, rest_debt_hours 0.00, usage_hours_ytd 0.00, play_status OPEN."
            - "One UsageBooking for GAME 2026-08-02T19:00:00Z to 2026-08-02T20:30:00Z, 40 participants, CONFIRMED at the default clock 2026-08-01T00:00:00Z."
            - "Clock advanced to exactly the booking's window_end_utc 2026-08-02T20:30:00Z so the close-out is permitted."
            - "Close-out with outcome RAINED_OUT, actual_duration_hours 1.50, actual_participant_count 40, weather_condition WET: 40 participants is exactly CROWD_FREE_ALLOWANCE, so crowd_factor is 1.00 and wear is 1.50 * 1.50 * 1.00 * 1.20 * 1.35 = 3.645 -> 3.65."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Priya Raman", roles: ["FieldOperationsCoordinator"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ops: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_new}", requested_by_staff_member_id: "${s_ops}", activity_type: "GAME", window_start_utc: "2026-08-02T19:00:00Z", window_end_utc: "2026-08-02T20:30:00Z", expected_participant_count: 40 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { b1: $.data.id }
            - call: "POST /turf/usage-bookings/${b1}/confirm"
              payload: {}
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T20:30:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
          trigger:
            - call: "POST /turf/usage-bookings/${b1}/close-out"
              payload: { outcome: "RAINED_OUT", actual_duration_hours: 1.50, actual_participant_count: 40, weather_condition: "WET" }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { wear: $.data.wear_load_units, rest: $.data.rest_requirement_hours }
            - call: "GET /turf/usage-ledger-entries"
              payload: { booking_id: "${b1}" }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { led1_type: "$.data[0].entry_type", led1_delta: "$.data[0].wear_units_delta", led2_type: "$.data[1].entry_type", led2_delta: "$.data[1].wear_units_delta" }
          assert:
            - "UsageBooking.${b1}.status == \"RAINED_OUT\", UsageBooking.${b1}.wear_load_units == 3.65, UsageBooking.${b1}.rest_requirement_hours == 3.83"
            - "GET /turf/usage-ledger-entries with booking_id ${b1} returns exactly two items ordered by effective_at_utc ASC then created_at ASC"
            - "$.data[0].entry_type == \"PLAY_WEAR\", $.data[0].wear_units_delta == 3.65, $.data[0].running_balance_after == 3.65, $.data[0].rest_requirement_hours == 3.83, $.data[0].rest_window_end_utc == \"2026-08-03T00:19:48Z\""
            - "$.data[1].entry_type == \"RAIN_OUT_RELIEF\", $.data[1].wear_units_delta == -3.65, $.data[1].running_balance_after == 0.00, $.data[1].rest_credit_hours == 0.00"
            - "Field.${f_new}.cumulative_wear_units == 0.00 - exactly the pre-booking value, with no rounding drift"
            - "the PLAY_WEAR entry is retained rather than deleted, so the sum of wear_units_delta over both entries equals Field.${f_new}.cumulative_wear_units"
            - "Field.${f_new}.rest_debt_hours == 3.83 and Field.${f_new}.play_status == \"RESTRICTED\" - the rest obligation is deliberately NOT compensated"
            - "Field.${f_new}.usage_hours_ytd == 1.50 - hours booked are likewise not reversed"

      - name: plan_rescission_releases_committed_capital_and_unlocks_budget
        grounds:
          - calculations.capital_budget_commitment
          - state_machines.ReplacementPlan.APPROVED_to_RESCINDED
          - state_machines.CapitalBudget.LOCKED_to_OPEN
          - state_machines.ReplacementPlan.DEFERRED_to_DRAFT
          - entities.CapitalBudget.fields.available_amount_cents
        distinguishing_aspect: |
          A different conserved quantity from the wear ledger: integer capital cents, where
          the invariant is committed + available == total_authorized at every instant.
          Rescission must not merely subtract - it must also undo the two derived
          consequences of the original approval (the budget lock and the sibling deferral),
          reverting disposal_status to NOT_APPLICABLE without leaving a single cent of drift.
        test_recipe:
          setup:
            - "Exactly the end state of plan_approval_cascades_budget_commitment_lock_to_sibling_deferral: CapitalBudget with total_authorized_amount_cents 5825556, lock_threshold_amount_cents 5243000, committed 5243000, available 582556, status LOCKED."
            - "Plan P1 on the SYNTHETIC_TURF field APPROVED for 5243000 with disposal_status PENDING."
            - "Sibling plan P2 on the NATURAL_GRASS field in funding_status DEFERRED for 1452000."
            - "Two FacilitiesDirectors exist; Marcus Hale made the approval and also issues the rescission."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Marcus Hale", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_dir2: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/capital-budgets"
              payload: { fiscal_year: 2027, total_authorized_amount_cents: 5825556 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { bud: $.data.id }
            - call: "GET /turf/fields/${f_sy}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy_ver: $.data.version }
            - call: "POST /turf/replacement-plans"
              payload: { field_id: "${f_sy}", capital_budget_id: "${bud}", target_surface_type: "SYNTHETIC_TURF", area_sq_ft: 70000, priority_basis: "CONDITION_RISK", planned_install_year: 2028, expected_field_version: "${f_sy_ver}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { p1: $.data.id }
            - call: "GET /turf/fields/${f_new}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new_ver: $.data.version }
            - call: "POST /turf/replacement-plans"
              payload: { field_id: "${f_new}", capital_budget_id: "${bud}", target_surface_type: "NATURAL_GRASS", area_sq_ft: 60000, priority_basis: "REMAINING_LIFE", planned_install_year: 2029, expected_field_version: "${f_new_ver}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { p2: $.data.id }
            - call: "POST /turf/replacement-plans/${p1}/submit"
              payload: { submitted_by_staff_member_id: "${s_dir}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/replacement-plans/${p1}/decide"
              payload: { decision: "APPROVE", decided_by_staff_member_id: "${s_dir2}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir2}"
          trigger:
            - call: "POST /turf/replacement-plans/${p1}/decide"
              payload: { decision: "RESCIND", decided_by_staff_member_id: "${s_dir2}", decision_notes: "Capital deferred to the following biennium." }
              as: FacilitiesDirector
              as_user_id: "${s_dir2}"
          assert:
