        payload: {}
        as: VendorOpsAnalyst
        as_user_id: ops-certifier-early
        captures:
          err: $.data.error_id
      assert:
      - the response status is 409
      - the response error_id == ERR_VENDOR_INVALID_STATE
      - the response error_id != ERR_INTEGRATION_INCOMPLETE (state outranks the referential check)
      - Vendor.${vey_id}.onboarding_status == DRAFT
      - Vendor.${vey_id}.certified_by_user_id is null
      - Vendor.${vey_id}.version == 1
