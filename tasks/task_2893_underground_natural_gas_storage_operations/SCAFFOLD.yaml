# =============================================================================
# PRD Benchmark Scaffold — Task 2893: Underground Natural Gas Storage Operations
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2893. Underground Natural Gas Storage Operations (gas storage field operator): reservoir management with inventory verification, working gas and cushion gas accounting and deliverability curves, injection and withdrawal scheduling across the season with customer contract nominations, wellbore integrity management with mechanical integrity testing, monitoring and remediation programs, compressor station operation with horsepower allocation and fuel consumption, storage service contracts across firm and interruptible with capacity, injection and withdrawal rights, balancing, imbalance penalties and cash-out provisions with shippers, emergency response plans with leak detection and evacuation coordination, regulatory reporting on inventory and integrity program status

domain_name: "underground-gas-storage-operations"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys carried in request bodies. Every
  # business resource is addressed at the top level (/wells/{id},
  # /nominations/{id}); nesting appears only on the three read-only
  # reverse-reachability sub-resource lists.

  state_machine_shape: cyclic
  # Nomination cycles CURTAILED -> SUBMITTED -> CURTAILED (bounded revision
  # rounds); StorageContract cycles ACTIVE -> SUSPENDED -> ACTIVE via cash-out
  # and cash-out reversal; Well carries two independent state dimensions
  # (operational_state x integrity_state) on one row.

  relationship_patterns:
    - one_to_many          # StorageField -> Well, CompressorUnit, RegulatoryReport
    - self_referential     # Nomination.superseded_by_nomination_id -> Nomination.id
    - cross_aggregate      # GasMovementTicket bridges Nomination and Well aggregates
    - polymorphic          # ImbalanceLedgerEntry.entry_type discriminates four origins

  role_model: segregation_of_duties
  # Two SoD constraints: the engineer who recorded an MIT failure may not
  # verify the RemediationProgram it triggered; the officer who prepared a
  # RegulatoryReport may not submit it.

  consistency_model: immediate

  difficulty_level: "beyond_expert"
  # 13 entities / 48 endpoints / 62 error codes / 8 calculations (4 with
  # variants) / 10 state machines. The endpoint count exceeds the Expert band
  # because §1.5's FK reverse-reachability duty forces one read channel per
  # foreign key (16 FKs); the business action surface itself is 22 endpoints.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
  list_ordering: "every list and sub-resource-list endpoint returns its rows ordered by created_at ASC; limit/offset are applied after that ordering, and total_count counts the rows matching the filters before limit/offset. id is never a sort key."

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
# =============================== Global Constants ===============================
# Constants referenced by §1.2 preconditions, §1.4 checks and §1.6 conditions that
# are not owned by any single §1.3 calculation. Calculation-local constants stay in
# their own `constants:` block.
global_constants:
  MIT_INTERVAL_DAYS: 365            # Well.mit_due_at = last_mit_passed_at + this
  MIT_BUFFER_HOURS: 12              # clearance padded on BOTH sides of a SCHEDULED MIT window
  REMEDIATION_DUE_DAYS: 45          # RemediationProgram.due_at = opened_at + this
  NOMINATION_CUTOFF_HOUR_UTC: 13    # cutoff instant is (gas_day - 1 day) at this UTC hour
  TICKET_OVERRUN_PCT: 5             # metered volume may exceed the confirmed schedule by this much
  MAX_REVISION_ROUNDS: 2            # CURTAILED -> SUBMITTED re-submissions allowed per nomination
  MIN_EVACUATION_RADIUS_M: 1        # smallest orderable evacuation radius
  MAX_EVACUATION_RADIUS_M: 8000     # largest orderable evacuation radius

# =============================== Curtailment Sweep ===============================
# Two named sweeps are referenced from §1.2 side effects, §1.5 side effects and §1.3.
# Both are fully deterministic: eligibility filter, ordering, tie-break and the
# empty-candidate-set fallback are pinned here and nowhere else.
curtailment_sweep:
  phase_A:
    fires_when: "StorageField.field_posture moves to RESTRICTED or FROZEN (well shut-in, MIT FAIL, emergency RESPONDING/EVACUATION_ORDERED), or a Shipper's credit is suspended by a cash-out"
    candidate_set: |
      Nomination N such that
        N.status == CONFIRMED
        AND N.contract.storage_field_id == the field being re-postured
           (for the credit-suspension variant: N.contract.shipper_id == the suspended shipper)
        AND N.gas_day >= the UTC calendar date of the current logical clock
        AND no GasMovementTicket on N has status == CONFIRMED
        AND (posture == RESTRICTED  -> N.contract.service_class == INTERRUPTIBLE)
        AND (posture == FROZEN      -> any service_class)
    action: "confirmed_volume_dth = 0; curtailed_volume_dth = nominated_volume_dth; status = CURTAILED; one CURTAILMENT_CREDIT ImbalanceLedgerEntry with gas_day = N.gas_day, volume_dth = -(prior confirmed_volume_dth), amount_usd = 0.00; the contract's scheduled_* recomputed and version incremented by 1"
    order: "ascending by (gas_day, created_at); created_at is unique per row so no further tie-break is needed"
    empty_candidate_set: "nothing happens — no ledger entries, no version bumps, no error"
  phase_B:
    fires_when: "max_withdrawal_rate_dth_per_day or max_injection_rate_dth_per_day falls (well shut-in, MIT FAIL, compressor fuel burn, confirmed ticket that moves inventory into a lower curve band) while future gas days already carry CONFIRMED volume"
    candidate_set: |
      For each (gas_day, direction) with gas_day >= the UTC calendar date of the current
      logical clock where sum(confirmed_volume_dth of CONFIRMED nominations on that field,
      gas day and direction) > the new field rate for that direction:
        Nomination N on that gas_day and direction such that
          N.status == CONFIRMED
          AND N.contract.service_class == INTERRUPTIBLE
          AND no GasMovementTicket on N has status == CONFIRMED
    action: "each selected nomination is curtailed in full (confirmed_volume_dth = 0) — never partially — with the same CURTAILMENT_CREDIT ledger entry as phase A"
    order: "descending by created_at (most recently created curtailed first), then ascending by contract.contract_code; curtail one nomination at a time and STOP as soon as the gas day's remaining CONFIRMED total is <= the new rate"
    empty_candidate_set: "when only FIRM volume remains and the day still exceeds the new rate, the sweep stops with the day oversubscribed — FIRM rights are never curtailed by phase B; no error is raised"

entities:

  - name: StorageField
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable reservoir name"
      - name: field_code
        type: string
        source: input
        description: "Operator's field identifier"
        constraints: "globally unique, 3-12 chars"
      - name: season
        type: enum
        source: input
        description: "Current seasonal posture of the reservoir: INJECTION | WITHDRAWAL"
        default: INJECTION
      - name: total_capacity_dth
        type: number
        source: input
        description: "Total reservoir capacity in dekatherms"
        constraints: "> 0"
      - name: cushion_gas_dth
        type: number
        source: input
        description: "Base (cushion) gas that must never be withdrawn"
        constraints: "> 0 and < total_capacity_dth"
      - name: max_working_gas_dth
        type: number
        source: computed
        description: "total_capacity_dth - cushion_gas_dth; the ceiling on working gas"
      - name: working_gas_inventory_dth
        type: number
        source: computed
        description: "Current working gas held in the reservoir, 3 decimal places; initialized from opening_working_gas_dth"
      - name: opening_working_gas_dth
        type: number
        source: input
        description: "Working gas present at field registration"
        default: 0
        constraints: ">= 0 and <= max_working_gas_dth"
      - name: fuel_gas_used_dth
        type: number
        source: computed
        description: "Cumulative compressor fuel burned out of working gas, 2 decimal places"
        default: 0
      - name: retained_fuel_pool_dth
        type: number
        source: computed
        description: "Cumulative fuel retention withheld from shippers on confirmed tickets, 3 decimal places"
        default: 0
      - name: inventory_pct
        type: number
        source: computed
        description: "working_gas_inventory_dth / max_working_gas_dth * 100, 2 decimal places"
      - name: base_pressure_psig
        type: integer
        source: input
        description: "Wellhead pressure at zero working gas"
        constraints: "> 0"
      - name: pressure_span_psig
        type: integer
        source: input
        description: "Pressure rise from zero to full working gas"
        constraints: "> 0"
      - name: max_pressure_psig
        type: integer
        source: input
        description: "Regulatory maximum operating pressure"
        constraints: ">= base_pressure_psig + pressure_span_psig"
      - name: current_pressure_psig
        type: integer
        source: computed
        description: "base_pressure_psig + inventory fraction * pressure_span_psig, rounded to integer"
      - name: deliverability_curve
        type: array
        source: input
        description: "Ascending array of objects { inventory_pct, withdrawal_dth_per_day, injection_dth_per_day } defining the field's deliverability envelope"
        constraints: "2-10 points; first point inventory_pct == 0; last point inventory_pct == 100; strictly ascending inventory_pct"
      - name: deliverability_method
        type: enum
        source: input
        description: "Which variant of deliverability_rates is applied: CURVE_INTERPOLATED | TIER_FLOOR"
        default: CURVE_INTERPOLATED
      - name: deliverability_tier
        type: enum
        source: computed
        description: "Inventory band label: TIER_1 (<25%) | TIER_2 (25-<50%) | TIER_3 (50-<75%) | TIER_4 (>=75%)"
      - name: max_withdrawal_rate_dth_per_day
        type: integer
        source: computed
        description: "Field withdrawal deliverability after curve evaluation and in-service well capping"
      - name: max_injection_rate_dth_per_day
        type: integer
        source: computed
        description: "Field injection deliverability after curve evaluation and in-service well capping"
      - name: wells_in_service_count
        type: integer
        source: computed
        description: "Count of Wells on this field with operational_state == IN_SERVICE and well_type == INJECTION_WITHDRAWAL"
      - name: field_posture
        type: enum
        source: computed
        description: "Derived gate over all child operations: OPEN | RESTRICTED | FROZEN"

  - name: Well
    parent: null
    common_fields: true
    fields:
      - name: storage_field_id
        type: string
        source: input
        description: "FK -> StorageField.id; the reservoir this wellbore penetrates"
      - name: well_name
        type: string
        source: input
        description: "API well identifier"
      - name: well_type
        type: enum
        source: input
        description: "INJECTION_WITHDRAWAL (moves gas) | OBSERVATION (monitoring only)"
      - name: rated_rate_dth_per_day
        type: integer
        source: input
        description: "Mechanical rate limit of this wellbore"
        constraints: ">= 0"
      - name: casing_pressure_psig
        type: integer
        source: input
        description: "Last recorded casing annulus pressure"
        default: 0
      - name: last_mit_passed_at
        type: datetime
        source: input
        description: "Instant of the last passed mechanical integrity test"
      - name: mit_due_at
        type: datetime
        source: computed
        description: "last_mit_passed_at + MIT_INTERVAL_DAYS"
      - name: operational_state
        type: enum
        source: computed
        description: "IN_SERVICE | SHUT_IN | PLUGGED; seeded from the create call's initial_operational_state"
        default: IN_SERVICE
      - name: integrity_state
        type: enum
        source: computed
        description: "MIT_CURRENT | MIT_DUE | MIT_FAILED | REMEDIATED; second, independent state dimension"
        default: MIT_CURRENT
      - name: shut_in_reason
        type: enum
        source: computed
        description: "Why the well left service: MIT_FAILURE | EMERGENCY | OPERATOR_REQUEST | null"
      - name: service_change_count
        type: integer
        source: computed
        description: "Number of operational_state transitions applied to this well"
        default: 0

  - name: MechanicalIntegrityTest
    parent: null
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the wellbore under test"
      - name: test_type
        type: enum
        source: input
        description: "PRESSURE_TEST | TEMPERATURE_LOG | NOISE_LOG"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Half-open occupation window start on the wellbore"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Half-open occupation window end on the wellbore"
        constraints: "> scheduled_start_at"
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED | PASSED | FAILED"
        default: SCHEDULED
      - name: outcome
        type: enum
        source: computed
        description: "PASS | FAIL | INCONCLUSIVE | null while SCHEDULED"
      - name: result_pressure_psig
        type: integer
        source: computed
        description: "Pressure observed when the result was recorded; null while SCHEDULED"
      - name: recorded_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the IntegrityEngineer who recorded the result; anchors the remediation SoD rule"
      - name: recorded_at
        type: datetime
        source: computed
        description: "Logical clock instant the result was recorded; null while SCHEDULED"

  - name: RemediationProgram
    parent: null
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; wellbore under remediation"
      - name: triggering_mit_id
        type: string
        source: input
        description: "FK -> MechanicalIntegrityTest.id; the failed test that opened this program"
      - name: status
        type: enum
        source: computed
        description: "OPEN | COMPLETED | ESCALATED"
        default: OPEN
      - name: opened_at
        type: datetime
        source: computed
        description: "Logical clock instant the triggering MIT failed"
      - name: due_at
        type: datetime
        source: computed
        description: "opened_at + REMEDIATION_DUE_DAYS"
      - name: verification_notes
        type: string
        source: computed
        description: "Independent verifier's closing notes; null while OPEN"
      - name: completed_by_user_id
        type: string
        source: computed
        description: "X-User-ID that closed the program; null while OPEN"
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical clock instant of completion; null while OPEN"

  - name: CompressorUnit
    parent: null
    common_fields: true
    fields:
      - name: storage_field_id
        type: string
        source: input
        description: "FK -> StorageField.id; the station serving this reservoir"
      - name: unit_code
        type: string
        source: input
        description: "Station-local unit identifier"
        constraints: "unique within storage_field_id"
      - name: rated_horsepower
        type: integer
        source: input
        description: "Nameplate horsepower of the unit"
        constraints: "> 0"
      - name: derate_factor
        type: number
        source: input
        description: "Fractional derate applied to allocated horsepower, 2 decimal places"
        default: 0.00
        constraints: ">= 0.00 and <= 0.50"
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE | COMMITTED | OUT_OF_SERVICE"
        default: AVAILABLE
      - name: lifetime_fuel_dth
        type: number
        source: computed
        description: "Cumulative fuel burned across completed runs, 2 decimal places"
        default: 0
      - name: scheduled_run_count
        type: integer
        source: computed
        description: "Number of CompressorRuns on this unit with status == SCHEDULED"
        default: 0

  - name: CompressorRun
    parent: null
    common_fields: true
    fields:
      - name: compressor_unit_id
        type: string
        source: input
        description: "FK -> CompressorUnit.id; the unit reserved for this run"
      - name: window_start_at
        type: datetime
        source: input
        description: "Half-open horsepower occupation window start"
      - name: window_end_at
        type: datetime
        source: input
        description: "Half-open horsepower occupation window end"
        constraints: "> window_start_at"
      - name: allocated_horsepower
        type: integer
        source: input
        description: "Horsepower reserved on the unit for this window"
        constraints: "> 0"
      - name: mode
        type: enum
        source: input
        description: "INJECTION | WITHDRAWAL; selects the fuel mode multiplier"
      - name: duration_hours
        type: number
        source: computed
        description: "(window_end_at - window_start_at) in hours, 4 decimal places"
      - name: effective_horsepower
        type: number
        source: computed
        description: "allocated_horsepower * (1 - unit.derate_factor), 2 decimal places"
      - name: utilization_ratio
        type: number
        source: computed
        description: "effective_horsepower / unit.rated_horsepower, 6 decimal places"
      - name: utilization_band
        type: enum
        source: computed
        description: "LOW (<0.50) | MID (0.50-<0.85) | HIGH (>=0.85)"
      - name: fuel_consumed_dth
        type: number
        source: computed
        description: "Fuel burned on completion, 2 decimal places; null while SCHEDULED"
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED | COMPLETED | CANCELLED"
        default: SCHEDULED

  - name: Shipper
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered name of the storage customer"
      - name: duns_number
        type: string
        source: input
        description: "Nine-digit DUNS identifier"
        constraints: "globally unique, exactly 9 digits"
      - name: penalty_threshold_usd
        type: number
        source: input
        description: "Outstanding cash-out exposure at or above which credit is suspended, 2 decimal places"
        constraints: "> 0"
      - name: outstanding_penalty_usd
        type: number
        source: computed
        description: "Sum of amount_usd over this shipper's CASH_OUT and CASH_OUT_REVERSAL ledger entries, 2 decimal places"
        default: 0.00
      - name: credit_status
        type: enum
        source: computed
        description: "GOOD | SUSPENDED"
        default: GOOD

  - name: StorageContract
    parent: null
    common_fields: true
    fields:
      - name: shipper_id
        type: string
        source: input
        description: "FK -> Shipper.id; the storage customer holding this service agreement"
      - name: storage_field_id
        type: string
        source: input
        description: "FK -> StorageField.id; the reservoir the service is written against"
      - name: contract_code
        type: string
        source: input
        description: "Tariff contract identifier"
        constraints: "globally unique"
      - name: service_class
        type: enum
        source: input
        description: "FIRM (unconditional rights) | INTERRUPTIBLE (share-capped, curtailable)"
      - name: max_storage_quantity_dth
        type: number
        source: input
        description: "Maximum inventory the shipper may hold (MSQ)"
        constraints: "> 0"
      - name: max_daily_injection_dth
        type: number
        source: input
        description: "Maximum daily injection right"
        constraints: "> 0"
      - name: max_daily_withdrawal_dth
        type: number
        source: input
        description: "Maximum daily withdrawal right"
        constraints: "> 0"
      - name: term_start_date
        type: string
        source: input
        description: "First gas day the contract may be nominated, YYYY-MM-DD"
      - name: term_end_date
        type: string
        source: input
        description: "Last gas day the contract may be nominated, YYYY-MM-DD"
        constraints: ">= term_start_date"
      - name: commodity_rate_usd_per_dth
        type: number
        source: input
        description: "Commodity charge per dekatherm moved, 4 decimal places"
        constraints: "> 0"
      - name: index_price_usd_per_dth
        type: number
        source: input
        description: "Index gas price used for fuel charges and cash-out, 4 decimal places"
        constraints: "> 0"
      - name: cash_out_method
        type: enum
        source: input
        description: "MONTHLY_AGGREGATE (net the period, then price once) | DAILY_RATCHET (price each gas day, then sum)"
      - name: status
        type: enum
        source: computed
        description: "DRAFT | ACTIVE | SUSPENDED"
        default: DRAFT
      - name: inventory_balance_dth
        type: number
        source: computed
        description: "Shipper's gas held in the field, 3 decimal places; net of fuel retention"
        default: 0.000
      - name: scheduled_injection_dth
        type: number
        source: computed
        description: "Sum of confirmed_volume_dth over this contract's Nominations with status in (CONFIRMED, CURTAILED) and direction == INJECTION; a partially curtailed nomination still holds the volume it was allocated, and a fully swept one contributes 0"
        default: 0
      - name: scheduled_withdrawal_dth
        type: number
        source: computed
        description: "Sum of confirmed_volume_dth over this contract's Nominations with status in (CONFIRMED, CURTAILED) and direction == WITHDRAWAL; a partially curtailed nomination still holds the volume it was allocated, and a fully swept one contributes 0"
        default: 0
      - name: imbalance_dth
        type: number
        source: computed
        description: "Unsettled signed imbalance, 3 decimal places; sum of DAILY_IMBALANCE ledger volume since cash_out_through_date"
        default: 0.000
      - name: cash_out_amount_usd
        type: number
        source: computed
        description: "Amount assessed by the most recent unreversed cash-out, 2 decimal places"
        default: 0.00
      - name: cash_out_through_date
        type: string
        source: computed
        description: "Last gas day covered by a settled cash-out, YYYY-MM-DD; null before first cash-out"
      - name: activated_at
        type: datetime
        source: computed
        description: "Logical clock instant of activation; null while DRAFT"

  - name: Nomination
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> StorageContract.id; the service agreement being nominated against"
      - name: gas_day
        type: string
        source: input
        description: "Gas day being scheduled, YYYY-MM-DD"
      - name: direction
        type: enum
        source: input
        description: "INJECTION | WITHDRAWAL"
      - name: nominated_volume_dth
        type: integer
        source: input
        description: "Volume the shipper asks for on this gas day"
        constraints: "> 0"
      - name: confirmed_volume_dth
        type: integer
        source: computed
        description: "Volume the operator confirmed after the allocation waterfall"
        default: 0
      - name: curtailed_volume_dth
        type: integer
        source: computed
        description: "nominated_volume_dth - confirmed_volume_dth"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "DRAFT | SUBMITTED | CONFIRMED | CURTAILED | REJECTED | SUPERSEDED"
        default: DRAFT
      - name: revision_round
        type: integer
        source: computed
        description: "Number of times this nomination has been re-submitted after curtailment"
        default: 0
      - name: superseded_by_nomination_id
        type: string
        source: computed
        description: "FK -> Nomination.id; the later nomination that displaced this one; null unless status == SUPERSEDED"
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical clock instant of the most recent submission; null while DRAFT"
      - name: confirmed_at
        type: datetime
        source: computed
        description: "Logical clock instant of the most recent confirmation; null before first confirm"

  - name: GasMovementTicket
    parent: null
    common_fields: true
    fields:
      - name: nomination_id
        type: string
        source: input
        description: "FK -> Nomination.id; the confirmed schedule this ticket actualises"
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the wellbore the gas physically moved through"
      - name: actual_volume_dth
        type: integer
        source: input
        description: "Metered volume at the wellhead"
        constraints: "> 0"
      - name: fuel_retention_dth
        type: number
        source: computed
        description: "actual_volume_dth * FUEL_RETENTION_PCT / 100, 3 decimal places"
      - name: net_volume_dth
        type: number
        source: computed
        description: "Volume credited to (injection) or debited from (withdrawal) the contract balance, 3 decimal places"
      - name: commodity_charge_usd
        type: number
        source: computed
        description: "actual_volume_dth * contract.commodity_rate_usd_per_dth, 2 decimal places"
      - name: volume_discount_usd
        type: number
        source: computed
        description: "Tiered discount off the commodity charge, 2 decimal places"
      - name: fuel_charge_usd
        type: number
        source: computed
        description: "fuel_retention_dth * contract.index_price_usd_per_dth, 2 decimal places"
      - name: total_charge_usd
        type: number
        source: computed
        description: "commodity_charge_usd - volume_discount_usd + fuel_charge_usd, 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: "PENDING | CONFIRMED | REVERSED"
        default: PENDING
      - name: reversal_reason
        type: string
        source: computed
        description: "Operator's reason for reversal; null unless status == REVERSED"
      - name: confirmed_at
        type: datetime
        source: computed
        description: "Logical clock instant of confirmation; null while PENDING"

  - name: ImbalanceLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: system
        description: "FK -> StorageContract.id; the contract whose balancing position this entry records"
      - name: entry_type
        type: enum
        source: system
        description: "DAILY_IMBALANCE | CURTAILMENT_CREDIT | CASH_OUT | CASH_OUT_REVERSAL"
      - name: gas_day
        type: string
        source: system
        description: "Gas day the entry pertains to, YYYY-MM-DD; null for period-level CASH_OUT and CASH_OUT_REVERSAL entries"
      - name: volume_dth
        type: number
        source: system
        description: "Signed volume, 3 decimal places; positive = shipper delivered more than scheduled"
      - name: amount_usd
        type: number
        source: system
        description: "Signed money, 2 decimal places; only CASH_OUT and CASH_OUT_REVERSAL carry a non-zero value"
      - name: origin_note
        type: string
        source: system
        description: "Free-text provenance label, e.g. 'ticket confirm 2026-08-05' — not a foreign key"

  - name: EmergencyEvent
    parent: null
    common_fields: true
    fields:
      - name: storage_field_id
        type: string
        source: input
        description: "FK -> StorageField.id; the reservoir affected"
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the implicated wellbore; null for field-wide events"
      - name: event_type
        type: enum
        source: input
        description: "LEAK | OVERPRESSURE | WELLHEAD_FAILURE | THIRD_PARTY_DAMAGE"
      - name: severity
        type: enum
        source: input
        description: "MINOR | SERIOUS | CRITICAL"
      - name: detected_at
        type: datetime
        source: input
        description: "Instant leak detection or monitoring flagged the event"
      - name: status
        type: enum
        source: computed
        description: "DETECTED | RESPONDING | EVACUATION_ORDERED | CONTAINED | CLOSED"
        default: DETECTED
      - name: evacuation_radius_m
        type: integer
        source: computed
        description: "Ordered evacuation radius in metres; 0 until EVACUATION_ORDERED"
        default: 0
      - name: responder_notes
        type: string
        source: computed
        description: "Latest responder narrative; null until first advance"
      - name: contained_at
        type: datetime
        source: computed
        description: "Logical clock instant of containment; null before CONTAINED"
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical clock instant of closure; null before CLOSED"

  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - name: storage_field_id
        type: string
        source: input
        description: "FK -> StorageField.id; the reservoir being reported"
      - name: report_type
        type: enum
        source: input
        description: "INVENTORY_VERIFICATION | INTEGRITY_PROGRAM_STATUS"
      - name: period_start_date
        type: string
        source: input
        description: "First gas day of the reporting period, YYYY-MM-DD"
      - name: period_end_date
        type: string
        source: input
        description: "Last gas day of the reporting period, YYYY-MM-DD"
        constraints: ">= period_start_date"
      - name: measured_inventory_dth
        type: number
        source: input
        description: "Independently measured working gas volume"
        constraints: "> 0"
      - name: book_inventory_dth
        type: number
        source: computed
        description: "Snapshot of StorageField.working_gas_inventory_dth at preparation, 3 decimal places"
      - name: variance_dth
        type: number
        source: computed
        description: "measured_inventory_dth - book_inventory_dth, 3 decimal places"
      - name: variance_pct
        type: number
        source: computed
        description: "abs(variance_dth) / book_inventory_dth * 100, 4 decimal places"
      - name: open_finding_count
        type: integer
        source: computed
        description: "Count of RemediationPrograms on this field's wells with status in (OPEN, ESCALATED) at preparation"
      - name: status
        type: enum
        source: computed
        description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED"
        default: DRAFT
      - name: prepared_by_user_id
        type: string
        source: computed
        description: "X-User-ID that created the report; anchors the report submission SoD rule"
      - name: submitted_by_user_id
        type: string
        source: computed
        description: "X-User-ID that submitted the report; null while DRAFT"
      - name: agency_outcome
        type: enum
        source: computed
        description: "ACCEPTED | REJECTED | null before the agency responds"
      - name: agency_response_note
        type: string
        source: computed
        description: "Agency's returned narrative; null before response"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- StorageField.field_posture: derived posture that gates every child op ---
  - entity: StorageField
    initial_state: FROZEN
    terminal_states: []
    note: |
      field_posture is a DERIVED posture, recomputed (in this order) after every
      mutation that touches the field's wells, emergency events, inventory or
      pressure:
        1. FROZEN     if wells_in_service_count == 0
                      OR any EmergencyEvent on this field has status in
                         (RESPONDING, EVACUATION_ORDERED)
        2. RESTRICTED if any Well on this field has integrity_state == MIT_FAILED
                      OR current_pressure_psig > POSTURE_PRESSURE_PCT/100 * max_pressure_psig
        3. OPEN       otherwise
      A newly created field has zero wells, so it starts FROZEN.
    transitions:
      - from: FROZEN
        to: OPEN
        trigger: "POST /wells (first IN_SERVICE injection/withdrawal well registered) or POST /wells/{id}/service-change back to IN_SERVICE"
        actor: system
        preconditions:
          - "wells_in_service_count becomes >= 1"
          - "no Well on the field has integrity_state == MIT_FAILED"
          - "no EmergencyEvent on the field has status in (RESPONDING, EVACUATION_ORDERED)"
          - "current_pressure_psig <= POSTURE_PRESSURE_PCT/100 * max_pressure_psig"
        side_effects:
          - "deliverability_rates recomputed; max_withdrawal_rate_dth_per_day and max_injection_rate_dth_per_day updated"
          - "wells_in_service_count updated"
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /mechanical-integrity-tests/{id}/record-result with outcome FAIL, or a confirmed injection ticket that pushes current_pressure_psig above the posture pressure ceiling"
        actor: system
        preconditions:
          - "wells_in_service_count >= 1"
        side_effects:
          - "curtailment sweep phase A runs in its RESTRICTED form: every CONFIRMED Nomination on an INTERRUPTIBLE contract of this field, with gas_day >= today and no CONFIRMED GasMovementTicket, is CURTAILED to confirmed_volume_dth = 0"
          - "a CURTAILMENT_CREDIT ImbalanceLedgerEntry is appended per curtailed nomination"
          - "each affected StorageContract.scheduled_injection_dth / scheduled_withdrawal_dth reduced; version incremented by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /remediation-programs/{id}/complete (last MIT_FAILED well cleared) or a confirmed withdrawal ticket that brings pressure back under the ceiling"
        actor: system
        preconditions:
          - "no Well on the field has integrity_state == MIT_FAILED"
          - "current_pressure_psig <= POSTURE_PRESSURE_PCT/100 * max_pressure_psig"
        side_effects:
          - "deliverability_rates recomputed"
      - from: OPEN
        to: FROZEN
        trigger: "POST /wells/{id}/service-change taking the last in-service well out, or POST /emergency-events/{id}/advance to RESPONDING"
        actor: system
        preconditions: []
        side_effects:
          - "max_withdrawal_rate_dth_per_day and max_injection_rate_dth_per_day become 0 when wells_in_service_count == 0"
          - "curtailment sweep phase A runs in its FROZEN form: every CONFIRMED Nomination on this field (FIRM and INTERRUPTIBLE alike), with gas_day >= today and no CONFIRMED GasMovementTicket, is CURTAILED to confirmed_volume_dth = 0"
          - "a CURTAILMENT_CREDIT ImbalanceLedgerEntry is appended per curtailed nomination"
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /emergency-events/{id}/advance to RESPONDING, or the last in-service well is shut in"
        actor: system
        preconditions: []
        side_effects:
          - "curtailment sweep phase A applied to FIRM and INTERRUPTIBLE nominations alike"
      - from: FROZEN
        to: RESTRICTED
        trigger: "POST /emergency-events/{id}/advance to CONTAINED while a Well on the field is still MIT_FAILED"
        actor: system
        preconditions:
          - "wells_in_service_count >= 1"
          - "no EmergencyEvent on the field has status in (RESPONDING, EVACUATION_ORDERED)"
        side_effects:
          - "deliverability_rates recomputed"

  # --- Well: TWO independent state dimensions on one row (parallel shape) ---
  - entity: Well
    initial_state: IN_SERVICE
    terminal_states: [PLUGGED]
    note: |
      Well carries two orthogonal dimensions that advance independently:
      operational_state (IN_SERVICE | SHUT_IN | PLUGGED) driven by
      POST /wells/{id}/service-change, and integrity_state (MIT_CURRENT |
      MIT_DUE | MIT_FAILED | REMEDIATED) driven by MIT results and
      remediation closure. The transitions below list operational_state
      first, then the integrity_state dimension. Both dimensions are
      preconditions on other entities' transitions: a ticket needs
      operational_state == IN_SERVICE AND integrity_state != MIT_FAILED.
    transitions:
      - from: IN_SERVICE
        to: SHUT_IN
        trigger: "POST /wells/{id}/service-change with to_operational_state SHUT_IN"
        actor: FieldOperator
        preconditions:
          - "well.operational_state == IN_SERVICE"
          - "no GasMovementTicket on this well has status == PENDING"
        side_effects:
          - "shut_in_reason = OPERATOR_REQUEST; service_change_count incremented"
          - "StorageField.wells_in_service_count decremented; deliverability_rates and field_posture recomputed"
          - "curtailment sweep phase B: for each future gas day whose CONFIRMED nominations exceed the new field rate, INTERRUPTIBLE nominations are CURTAILED (most recently created first by created_at, descending) until the day fits"
      - from: SHUT_IN
        to: IN_SERVICE
        trigger: "POST /wells/{id}/service-change with to_operational_state IN_SERVICE"
        actor: FieldOperator
        preconditions:
          - "well.operational_state == SHUT_IN"
          - "well.integrity_state != MIT_FAILED"
          - "no RemediationProgram on this well has status in (OPEN, ESCALATED)"
        side_effects:
          - "shut_in_reason = null; service_change_count incremented"
          - "StorageField.wells_in_service_count incremented; deliverability_rates and field_posture recomputed"
      - from: SHUT_IN
        to: PLUGGED
        trigger: "POST /wells/{id}/service-change with to_operational_state PLUGGED"
        actor: FieldOperator
        preconditions:
          - "well.operational_state == SHUT_IN"
          - "no MechanicalIntegrityTest on this well has status == SCHEDULED"
        side_effects:
          - "service_change_count incremented; well becomes terminal and can never re-enter service"
          - "field_posture recomputed"
      - from: MIT_CURRENT
        to: MIT_FAILED
        trigger: "POST /mechanical-integrity-tests/{id}/record-result with outcome FAIL"
        actor: IntegrityEngineer
        preconditions:
          - "the MIT references this well and has status == SCHEDULED"
        side_effects:
          - "operational_state forced to SHUT_IN with shut_in_reason = MIT_FAILURE (does not increment service_change_count)"
          - "a RemediationProgram is created with status OPEN, well_id = this well, triggering_mit_id = the failed MIT"
          - "StorageField.wells_in_service_count decremented; field_posture recomputed to RESTRICTED or FROZEN"
      - from: MIT_FAILED
        to: REMEDIATED
        trigger: "POST /remediation-programs/{id}/complete"
        actor: IntegrityEngineer
        preconditions:
          - "the RemediationProgram references this well and has status == OPEN"
          - "the completing X-User-ID differs from triggering MIT.recorded_by_user_id"
        side_effects:
          - "shut_in_reason cleared to null; operational_state stays SHUT_IN until an explicit service-change"
          - "field_posture recomputed"
      - from: MIT_DUE
        to: MIT_CURRENT
        trigger: "POST /mechanical-integrity-tests/{id}/record-result with outcome PASS"
        actor: IntegrityEngineer
        preconditions:
          - "the MIT references this well and has status == SCHEDULED"
        side_effects:
          - "last_mit_passed_at = MIT.recorded_at; mit_due_at recomputed as last_mit_passed_at + MIT_INTERVAL_DAYS"
          - "casing_pressure_psig = MIT.result_pressure_psig"
      - from: MIT_CURRENT
        to: MIT_CURRENT
        trigger: "POST /mechanical-integrity-tests/{id}/record-result with outcome INCONCLUSIVE"
        actor: IntegrityEngineer
        preconditions:
          - "the MIT references this well and has status == SCHEDULED"
        side_effects:
          - "MIT.status = FAILED with outcome INCONCLUSIVE; NO RemediationProgram is created and the well is not shut in"
        note: "INCONCLUSIVE closes the test without touching either well dimension — the deliberate non-cascade branch."

  # --- MechanicalIntegrityTest ---
  - entity: MechanicalIntegrityTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /mechanical-integrity-tests/{id}/record-result with outcome PASS"
        actor: IntegrityEngineer
        preconditions:
          - "current logical clock >= scheduled_end_at"
          - "result_pressure_psig <= well.storage_field.max_pressure_psig"
        side_effects:
          - "outcome = PASS; recorded_by_user_id = X-User-ID; recorded_at = current clock"
          - "Well.integrity_state = MIT_CURRENT; Well.last_mit_passed_at and mit_due_at refreshed"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /mechanical-integrity-tests/{id}/record-result with outcome FAIL or INCONCLUSIVE"
        actor: IntegrityEngineer
        preconditions:
          - "current logical clock >= scheduled_end_at"
        side_effects:
          - "outcome = FAIL or INCONCLUSIVE; recorded_by_user_id = X-User-ID; recorded_at = current clock"
          - "on FAIL only: Well.integrity_state = MIT_FAILED, Well shut in, RemediationProgram opened, field posture recomputed, interruptible curtailment sweep phase A runs"

  # --- RemediationProgram ---
  - entity: RemediationProgram
    initial_state: OPEN
    terminal_states: [COMPLETED, ESCALATED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /remediation-programs/{id}/complete"
        actor: IntegrityEngineer
        preconditions:
          - "program.status == OPEN"
          - "X-User-ID != triggering MechanicalIntegrityTest.recorded_by_user_id (segregation of duties)"
          - "no EmergencyEvent on the program's well has status in (RESPONDING, EVACUATION_ORDERED)"
        side_effects:
          - "completed_by_user_id = X-User-ID; completed_at = current clock; verification_notes stored"
          - "Well.integrity_state = REMEDIATED; Well.shut_in_reason = null"
          - "StorageField.field_posture recomputed (may leave RESTRICTED)"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /emergency-events/{id}/advance to EVACUATION_ORDERED on the same StorageField"
        actor: system
        preconditions:
          - "program.status == OPEN"
          - "the program's well is on the emergency event's storage_field_id"
        side_effects:
          - "program becomes terminal; further completion attempts are rejected with ERR_INVALID_REMEDIATION_STATE"
          - "Well.integrity_state stays MIT_FAILED"

  # --- CompressorRun ---
  - entity: CompressorRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /compressor-runs/{id}/complete"
        actor: FieldOperator
        preconditions:
          - "run.status == SCHEDULED"
          - "current logical clock >= window_end_at"
          - "unit.status != OUT_OF_SERVICE"
        side_effects:
          - "fuel_consumed_dth computed by compressor_fuel_burn and stamped"
          - "CompressorUnit.lifetime_fuel_dth increased by fuel_consumed_dth; scheduled_run_count decremented; status returns to AVAILABLE when scheduled_run_count reaches 0"
          - "StorageField.fuel_gas_used_dth increased and working_gas_inventory_dth reduced by fuel_consumed_dth"
          - "StorageField deliverability_rates, inventory_pct, current_pressure_psig, deliverability_tier and field_posture recomputed"
          - "curtailment sweep phase B applied to any future gas day whose CONFIRMED volume now exceeds the reduced field rate"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /emergency-events/{id}/advance to EVACUATION_ORDERED on the run's StorageField"
        actor: system
        preconditions:
          - "run.status == SCHEDULED"
        side_effects:
          - "fuel_consumed_dth stays null; no fuel is drawn from the field"
          - "CompressorUnit.scheduled_run_count decremented and CompressorUnit.status = OUT_OF_SERVICE"

  # --- StorageContract: cyclic ACTIVE <-> SUSPENDED via cash-out / reversal ---
  - entity: StorageContract
    initial_state: DRAFT
    terminal_states: []
    note: "ACTIVE -> SUSPENDED -> ACTIVE is a genuine cycle: a cash-out that breaches the shipper's credit threshold suspends every contract of that shipper, and reversing the cash-out restores them."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /storage-contracts/{id}/activate"
        actor: SchedulingCoordinator
        preconditions:
          - "contract.status == DRAFT"
          - "shipper.credit_status == GOOD"
          - "storage_field.field_posture != FROZEN"
        side_effects:
          - "activated_at = current clock; the contract becomes nominatable"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /storage-contracts/{id}/cash-out on any contract of the same shipper whose assessment pushes Shipper.outstanding_penalty_usd >= Shipper.penalty_threshold_usd"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "every DRAFT or SUBMITTED Nomination on this contract becomes REJECTED"
          - "every CONFIRMED Nomination on this contract with gas_day >= current UTC date and no CONFIRMED GasMovementTicket becomes CURTAILED with confirmed_volume_dth = 0"
          - "a CURTAILMENT_CREDIT ImbalanceLedgerEntry is appended per curtailed nomination"
          - "scheduled_injection_dth and scheduled_withdrawal_dth recomputed; version incremented by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /storage-contracts/{id}/cash-out-reversal on the cashed-out contract, bringing Shipper.outstanding_penalty_usd back below the threshold"
        actor: system
        preconditions:
          - "contract.status == SUSPENDED"
          - "Shipper.credit_status becomes GOOD"
        side_effects:
          - "the contract is nominatable again; already-curtailed nominations are NOT restored (only the money quantity is conserved, not the schedule)"

  # --- Nomination: cyclic revision loop CURTAILED -> SUBMITTED -> CURTAILED ---
  - entity: Nomination
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    note: "The CURTAILED -> SUBMITTED -> CURTAILED loop is bounded by MAX_REVISION_ROUNDS; the third re-submission is rejected with ERR_NOMINATION_REVISION_LIMIT."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /nominations/{id}/submit"
        actor: Shipper
        preconditions:
          - "nomination.status == DRAFT"
          - "current logical clock < nomination cutoff for gas_day (gas_day - 1 day at NOMINATION_CUTOFF_HOUR_UTC)"
          - "contract.status == ACTIVE"
          - "if nominated_volume_dth is supplied it must be <= the stored nominated_volume_dth"
        side_effects:
          - "submitted_at = current clock; nominated_volume_dth lowered when a revised volume is supplied"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /nominations/{id}/confirm"
        actor: SchedulingCoordinator
        preconditions:
          - "nomination.status == SUBMITTED"
          - "storage_field.field_posture != FROZEN"
          - "field_posture != RESTRICTED when contract.service_class == INTERRUPTIBLE"
          - "the nomination_confirm_waterfall yields confirmed_volume_dth == nominated_volume_dth"
        side_effects:
          - "confirmed_volume_dth = nominated_volume_dth; curtailed_volume_dth = 0; confirmed_at = current clock"
          - "contract.scheduled_injection_dth or scheduled_withdrawal_dth increased by confirmed_volume_dth; contract.version incremented by 1"
      - from: SUBMITTED
        to: CURTAILED
        trigger: "POST /nominations/{id}/confirm"
        actor: SchedulingCoordinator
        preconditions:
          - "nomination.status == SUBMITTED"
          - "the nomination_confirm_waterfall yields confirmed_volume_dth < nominated_volume_dth"
        side_effects:
          - "curtailed_volume_dth = nominated_volume_dth - confirmed_volume_dth; confirmed_at = current clock"
          - "contract.scheduled_* increased by confirmed_volume_dth only; contract.version incremented by 1"
          - "a CURTAILMENT_CREDIT ImbalanceLedgerEntry with volume_dth = -curtailed_volume_dth and amount_usd = 0.00 is appended"
      - from: CURTAILED
        to: SUBMITTED
        trigger: "POST /nominations/{id}/submit (revision round)"
        actor: Shipper
        preconditions:
          - "nomination.status == CURTAILED"
          - "revision_round < MAX_REVISION_ROUNDS"
          - "current logical clock < nomination cutoff for gas_day"
          - "no CONFIRMED GasMovementTicket exists against this nomination"
        side_effects:
          - "revision_round incremented by 1; submitted_at refreshed"
          - "contract.scheduled_* reduced by the previously confirmed volume; confirmed_volume_dth and curtailed_volume_dth reset to 0"
      - from: CONFIRMED
        to: CURTAILED
        trigger: "curtailment sweep phase A or B (posture change, deliverability drop, or shipper credit suspension)"
        actor: system
        preconditions:
          - "gas_day >= current UTC date"
          - "no CONFIRMED GasMovementTicket exists against this nomination"
        side_effects:
          - "confirmed_volume_dth = 0; curtailed_volume_dth = nominated_volume_dth"
          - "contract.scheduled_* reduced; CURTAILMENT_CREDIT ledger entry appended; contract.version incremented by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "shipper credit suspension sweep during POST /storage-contracts/{id}/cash-out"
        actor: system
        preconditions:
          - "contract.status becomes SUSPENDED"
        side_effects:
          - "terminal; the shipper must file a fresh nomination after credit is restored"
      - from: DRAFT
        to: REJECTED
        trigger: "shipper credit suspension sweep during POST /storage-contracts/{id}/cash-out"
        actor: system
        preconditions:
          - "contract.status becomes SUSPENDED"
        side_effects:
          - "terminal"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /nominations for the same contract_id, gas_day and direction"
        actor: Shipper
        preconditions:
          - "an existing non-terminal Nomination matches contract_id + gas_day + direction"
          - "the new create carries a non-stale expected_contract_version"
        side_effects:
          - "superseded_by_nomination_id = the new nomination's id; terminal"
          - "contract.version incremented by 1 by the create"
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "POST /nominations for the same contract_id, gas_day and direction"
        actor: Shipper
        preconditions:
          - "no CONFIRMED GasMovementTicket exists against the prior nomination"
          - "the new create carries a non-stale expected_contract_version"
        side_effects:
          - "superseded_by_nomination_id set; contract.scheduled_* reduced by the superseded confirmed_volume_dth"

  # --- GasMovementTicket ---
  - entity: GasMovementTicket
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /gas-movement-tickets/{id}/confirm"
        actor: FieldOperator
        preconditions:
          - "ticket.status == PENDING"
          - "well.operational_state == IN_SERVICE and well.integrity_state != MIT_FAILED"
          - "storage_field.field_posture != FROZEN"
          - "on WITHDRAWAL: actual_volume_dth <= storage_field.working_gas_inventory_dth (cushion gas floor)"
          - "on WITHDRAWAL: actual_volume_dth + fuel_retention_dth <= contract.inventory_balance_dth"
          - "on INJECTION: storage_field.working_gas_inventory_dth + net_volume_dth <= max_working_gas_dth"
          - "expected_storage_field_version matches StorageField.version"
        side_effects:
          - "ticket charges computed by ticket_charge_breakdown and stamped; confirmed_at = current clock"
          - "StorageField.working_gas_inventory_dth moved by actual_volume_dth (signed by direction); retained_fuel_pool_dth increased by fuel_retention_dth"
          - "StorageField.inventory_pct, current_pressure_psig, deliverability_tier, deliverability rates and field_posture recomputed; version incremented by 1"
          - "contract.inventory_balance_dth moved by net_volume_dth; contract.imbalance_dth increased by (actual_volume_dth - nomination.confirmed_volume_dth)"
          - "a DAILY_IMBALANCE ImbalanceLedgerEntry is appended with the signed daily delta"
          - "curtailment sweep phase B applied when a rate fell"
      - from: CONFIRMED
        to: REVERSED
        trigger: "POST /gas-movement-tickets/{id}/reverse"
        actor: FieldOperator
        preconditions:
          - "ticket.status == CONFIRMED"
          - "no RegulatoryReport covering this ticket's gas_day has status in (SUBMITTED, ACCEPTED)"
        side_effects:
          - "every field/contract quantity moved by the confirm is moved back by the exact same magnitude (gas_volume_conservation invariant)"
          - "a DAILY_IMBALANCE ImbalanceLedgerEntry with the negated volume_dth is appended"
          - "StorageField.version incremented by 1; deliverability and posture recomputed"

  # --- EmergencyEvent ---
  - entity: EmergencyEvent
    initial_state: DETECTED
    terminal_states: [CLOSED]
    transitions:
      - from: DETECTED
        to: RESPONDING
        trigger: "POST /emergency-events/{id}/advance with to_status RESPONDING"
        actor: FieldOperator
        preconditions:
          - "event.status == DETECTED"
        side_effects:
          - "responder_notes stored; StorageField.field_posture forced to FROZEN"
          - "curtailment sweep phase A applied to FIRM and INTERRUPTIBLE nominations alike"
      - from: RESPONDING
        to: EVACUATION_ORDERED
        trigger: "POST /emergency-events/{id}/advance with to_status EVACUATION_ORDERED"
        actor: FieldOperator
        preconditions:
          - "event.status == RESPONDING"
          - "event.severity in (SERIOUS, CRITICAL)"
          - "evacuation_radius_m supplied and >= MIN_EVACUATION_RADIUS_M"
        side_effects:
          - "evacuation_radius_m stored"
          - "every OPEN RemediationProgram on this field's wells becomes ESCALATED"
          - "every CompressorUnit on this field becomes OUT_OF_SERVICE and its SCHEDULED CompressorRuns become CANCELLED"
      - from: RESPONDING
        to: CONTAINED
        trigger: "POST /emergency-events/{id}/advance with to_status CONTAINED"
        actor: FieldOperator
        preconditions:
          - "event.status == RESPONDING"
        side_effects:
          - "contained_at = current clock; StorageField.field_posture recomputed (leaves FROZEN unless another gate holds)"
      - from: EVACUATION_ORDERED
        to: CONTAINED
        trigger: "POST /emergency-events/{id}/advance with to_status CONTAINED"
        actor: FieldOperator
        preconditions:
          - "event.status == EVACUATION_ORDERED"
        side_effects:
          - "contained_at = current clock; StorageField.field_posture recomputed"
      - from: CONTAINED
        to: CLOSED
        trigger: "POST /emergency-events/{id}/advance with to_status CLOSED"
        actor: ComplianceOfficer
        preconditions:
          - "event.status == CONTAINED"
          - "no RemediationProgram on this field's wells has status == ESCALATED"
        side_effects:
          - "closed_at = current clock; terminal"

  # --- RegulatoryReport ---
  - entity: RegulatoryReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /regulatory-reports/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == DRAFT"
          - "X-User-ID != report.prepared_by_user_id (segregation of duties)"
          - "variance_pct <= MAX_REPORT_VARIANCE_PCT"
          - "on report_type INTEGRITY_PROGRAM_STATUS: open_finding_count == 0"
        side_effects:
          - "submitted_by_user_id = X-User-ID; the covered gas days are locked against ticket reversal"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /regulatory-reports/{id}/record-agency-response with agency_outcome ACCEPTED"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "agency_outcome = ACCEPTED; terminal; the covered gas days stay locked permanently"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /regulatory-reports/{id}/record-agency-response with agency_outcome REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "agency_outcome = REJECTED; agency_response_note stored; the covered gas days are unlocked"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /regulatory-reports/{id}/submit (re-submission after agency rejection)"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == REJECTED"
          - "X-User-ID != report.prepared_by_user_id"
          - "variance_pct <= MAX_REPORT_VARIANCE_PCT"
        side_effects:
          - "submitted_by_user_id refreshed; covered gas days re-locked"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: nomination-create-stale-contract
    parent_entity: StorageContract
    write_endpoint: "POST /nominations"
    occ_field: "expected_contract_version"
    description: |
      Creating a Nomination against a StorageContract whose version has
      advanced since the client last observed it is rejected. Under the
      tariff a new nomination for the same contract, gas day and direction
      legitimately supersedes the prior one, so the write cannot be resolved
      by a state precondition: a writer holding a stale view of the contract
      would silently displace a schedule it never saw.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: ticket-confirm-stale-field
    parent_entity: StorageField
    write_endpoint: "POST /gas-movement-tickets/{id}/confirm"
    occ_field: "expected_storage_field_version"
    description: |
      Confirming a GasMovementTicket against a StorageField whose version has
      advanced since the client last observed it is rejected. Confirmation
      moves working gas against a deliverability envelope and a cushion-gas
      floor read from the field, and a confirmation computed from a stale
      inventory view would legitimately succeed on its own terms while
      breaching the envelope the field now holds.
    error_id: ERR_STALE_FIELD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: deliverability_rates
    trigger: "On StorageField create, and after every mutation that changes working_gas_inventory_dth or the set of in-service wells (ticket confirm/reverse, compressor run completion, well service-change, MIT failure)"
    algorithm: interval_merge
    input_set: "The field's deliverability_curve points, plus Wells on the field with well_type == INJECTION_WITHDRAWAL and operational_state == IN_SERVICE (OBSERVATION wells and SHUT_IN/PLUGGED wells contribute nothing)"
    formula: |
      max_working_gas_dth = total_capacity_dth - cushion_gas_dth
      inventory_pct = round_half_up(working_gas_inventory_dth / max_working_gas_dth * 100, 2)
      current_pressure_psig =
          round_half_up(base_pressure_psig
                        + (working_gas_inventory_dth / max_working_gas_dth) * pressure_span_psig, 0)
      deliverability_tier =
          TIER_1 if inventory_pct <  TIER_2_FLOOR_PCT else
          TIER_2 if inventory_pct <  TIER_3_FLOOR_PCT else
          TIER_3 if inventory_pct <  TIER_4_FLOOR_PCT else TIER_4

      well_capacity = sum(w.rated_rate_dth_per_day
                          for w in wells
                          if w.well_type == INJECTION_WITHDRAWAL
                          and w.operational_state == IN_SERVICE)
      wells_in_service_count = count(those wells)

      # variant-selected curve evaluation (see `variants:` below)
      (curve_withdrawal, curve_injection) = evaluate_curve(deliverability_curve, inventory_pct)

      max_withdrawal_rate_dth_per_day = min(curve_withdrawal, well_capacity)
      max_injection_rate_dth_per_day  = min(curve_injection,  well_capacity)
      # With zero in-service wells both rates are exactly 0 and field_posture is FROZEN.
    constants:
      TIER_2_FLOOR_PCT: 25
      TIER_3_FLOOR_PCT: 50
      TIER_4_FLOOR_PCT: 75
    precision: "inventory_pct 2 decimal places round_half_up; rates and current_pressure_psig integer round_half_up"
    variants:
      - name: CURVE_INTERPOLATED
        when: "storage_field.deliverability_method == CURVE_INTERPOLATED"
        difference: |
          Linear interpolation between the two curve points bracketing inventory_pct:
            lo = last point with point.inventory_pct <= inventory_pct
            hi = first point with point.inventory_pct >= inventory_pct
            frac = (inventory_pct - lo.inventory_pct) / (hi.inventory_pct - lo.inventory_pct)
            rate = round_half_up(lo.rate + (hi.rate - lo.rate) * frac, 0)
          (when lo == hi, rate = lo.rate)
      - name: TIER_FLOOR
        when: "storage_field.deliverability_method == TIER_FLOOR"
        difference: |
          No interpolation: the rate is taken from the highest curve point whose
          inventory_pct is <= the field's inventory_pct (step function, floor
          semantics). rate = lo.rate exactly.
          For the same field state this is strictly more conservative on
          withdrawal and strictly more generous on injection than
          CURVE_INTERPOLATED, so the two methods return different integers for
          byte-identical input.

  - name: field_posture_derivation
    trigger: "Immediately after deliverability_rates, on every recompute"
    algorithm: constraint_propagation
    input_set: "wells_in_service_count and current_pressure_psig from this field; Wells on the field with integrity_state == MIT_FAILED; EmergencyEvents on the field with status in (RESPONDING, EVACUATION_ORDERED)"
    formula: |
      # evaluated top-down; the FIRST matching clause wins
      if wells_in_service_count == 0: FROZEN
      elif exists EmergencyEvent(field) with status in (RESPONDING, EVACUATION_ORDERED): FROZEN
      elif exists Well(field) with integrity_state == MIT_FAILED: RESTRICTED
      elif current_pressure_psig > round_half_up(max_pressure_psig * POSTURE_PRESSURE_PCT / 100, 0): RESTRICTED
      else: OPEN
    constants:
      POSTURE_PRESSURE_PCT: 95
    precision: "integer comparison; the pressure ceiling is rounded to integer psig before the strict > comparison"

  - name: compressor_fuel_burn
    trigger: "POST /compressor-runs/{id}/complete"
    algorithm: tiered_pricing
    input_set: "The single CompressorRun being completed and its CompressorUnit; runs in status CANCELLED never burn fuel"
    formula: |
      duration_hours       = round_half_up((window_end_at - window_start_at) in hours, 4)
      effective_horsepower = round_half_up(allocated_horsepower * (1 - unit.derate_factor), 2)
      utilization_ratio    = round_half_up(effective_horsepower / unit.rated_horsepower, 6)
      utilization_band     = LOW  if utilization_ratio <  UTIL_MID_FLOOR
                             else MID if utilization_ratio < UTIL_HIGH_FLOOR
                             else HIGH
      band_rate            = FUEL_RATE_LOW | FUEL_RATE_MID | FUEL_RATE_HIGH  (by band)
      mode_multiplier      = FUEL_MODE_INJECTION if mode == INJECTION else FUEL_MODE_WITHDRAWAL
      raw_fuel             = effective_horsepower * duration_hours * band_rate * mode_multiplier
      fuel_consumed_dth    = round_half_up(
                               max(MIN_FUEL_PER_RUN_DTH, min(raw_fuel, MAX_FUEL_PER_RUN_DTH)), 2)
      # Note the non-monotonic band table: HIGH's rate (0.0105) sits ABOVE MID's
      # (0.0092), so crossing utilization 0.85 makes fuel jump upward even though
      # effective_horsepower barely moved.
    constants:
      UTIL_MID_FLOOR: 0.50
      UTIL_HIGH_FLOOR: 0.85
      FUEL_RATE_LOW: 0.0110
      FUEL_RATE_MID: 0.0092
      FUEL_RATE_HIGH: 0.0105
      FUEL_MODE_INJECTION: 1.00
      FUEL_MODE_WITHDRAWAL: 0.85
      MIN_FUEL_PER_RUN_DTH: 25.00
      MAX_FUEL_PER_RUN_DTH: 5000.00
    precision: "2 decimal places, round_half_up; utilization_ratio 6 decimal places; band comparisons use the 6-dp rounded ratio"

  - name: ticket_charge_breakdown
    trigger: "POST /gas-movement-tickets/{id}/confirm"
    algorithm: tiered_pricing
    input_set: "The single GasMovementTicket being confirmed, its Nomination and that nomination's StorageContract"
    formula: |
      # PINNED EVALUATION ORDER — the discount tier looks circular because it
      # reads a "charge", but it is keyed on commodity_charge_usd ONLY, never on
      # total_charge_usd. Steps run strictly 1..6.
      1. fuel_retention_dth   = round_half_up(actual_volume_dth * FUEL_RETENTION_PCT / 100, 3)
      2. net_volume_dth       = round_half_up(actual_volume_dth - fuel_retention_dth, 3)   # INJECTION
                              = round_half_up(actual_volume_dth + fuel_retention_dth, 3)   # WITHDRAWAL
      3. commodity_charge_usd = round_half_up(actual_volume_dth * contract.commodity_rate_usd_per_dth, 2)
      4. discount_pct         = 0 if commodity_charge_usd <  DISCOUNT_TIER_1_USD
                                else 2 if commodity_charge_usd < DISCOUNT_TIER_2_USD
                                else 5
         volume_discount_usd  = round_half_up(commodity_charge_usd * discount_pct / 100, 2)
      5. fuel_charge_usd      = round_half_up(fuel_retention_dth * contract.index_price_usd_per_dth, 2)
      6. total_charge_usd     = round_half_up(commodity_charge_usd
                                              - volume_discount_usd
                                              + fuel_charge_usd, 2)
      # An implementation that keys step 4 on (commodity_charge_usd + fuel_charge_usd)
      # produces a different total for the same inputs; step 4 MUST precede step 5
      # in tier selection even though it is arithmetically computed after nothing.
    constants:
      FUEL_RETENTION_PCT: 1.20
      DISCOUNT_TIER_1_USD: 5000
      DISCOUNT_TIER_2_USD: 20000
      DISCOUNT_TIER_1_PCT: 2
      DISCOUNT_TIER_2_PCT: 5
    precision: "money 2 decimal places round_half_up; volumes 3 decimal places round_half_up"

  - name: nomination_confirm_waterfall
    trigger: "POST /nominations/{id}/confirm"
    algorithm: waterfall_allocation
    input_set: "The nomination under confirmation, its StorageContract, the contract's StorageField, and all OTHER Nominations on that field with the same gas_day and direction whose status is CONFIRMED or CURTAILED (a partially curtailed nomination still occupies the volume it holds; a fully swept one contributes 0). The nomination being confirmed is always excluded from the already-scheduled sums"
    formula: |
      field_cap = storage_field.max_injection_rate_dth_per_day  if direction == INJECTION
                  else storage_field.max_withdrawal_rate_dth_per_day

      # bucket 1 — the contract's own rights
      daily_right   = contract.max_daily_injection_dth if direction == INJECTION
                      else contract.max_daily_withdrawal_dth
      inventory_room = (contract.max_storage_quantity_dth - contract.inventory_balance_dth)
                       if direction == INJECTION
                       else contract.inventory_balance_dth
      contract_cap  = floor(min(nominated_volume_dth, daily_right, inventory_room))

      # bucket 2 — the field's remaining room for this gas day and direction
      firm_scheduled = sum(confirmed_volume_dth of OTHER nominations in status CONFIRMED or CURTAILED on this
                           field / gas_day / direction whose contract.service_class == FIRM)
      intr_scheduled = sum(confirmed_volume_dth of OTHER nominations in status CONFIRMED or CURTAILED on this
                           field / gas_day / direction whose contract.service_class == INTERRUPTIBLE)

      if contract.service_class == FIRM:
          headroom = field_cap - firm_scheduled - intr_scheduled
      else:
          headroom = min(field_cap - firm_scheduled - intr_scheduled,
                         floor(field_cap * INTERRUPTIBLE_SHARE_PCT / 100) - intr_scheduled)

      confirmed_volume_dth = max(0, min(contract_cap, headroom))
      curtailed_volume_dth = nominated_volume_dth - confirmed_volume_dth
      # confirmed_volume_dth == 0 means the nomination is fully curtailed; a
      # GasMovementTicket can then never be created against it.
    constants:
      INTERRUPTIBLE_SHARE_PCT: 30
    precision: "integer dekatherms; floor() on the interruptible share, floor() on the contract bucket, no rounding up anywhere"

  - name: imbalance_cash_out
    trigger: "POST /storage-contracts/{id}/cash-out"
    algorithm: chronological
    input_set: "DAILY_IMBALANCE ImbalanceLedgerEntries on the contract whose gas_day falls in [period_start_date, period_end_date] and is strictly after contract.cash_out_through_date; the scheduled volume for a gas day is the sum of confirmed_volume_dth over that gas day's non-SUPERSEDED Nominations on the contract"
    formula: |
      # variant-selected; see `variants:` below. Both variants share:
      tolerance(sched)   = round_half_up(sched * IMBALANCE_TOLERANCE_PCT / 100, 3)
      multiplier(pct)    = PENALTY_MULT_T1 if pct <= PENALTY_BAND_1_PCT
                           else PENALTY_MULT_T2 if pct <= PENALTY_BAND_2_PCT
                           else PENALTY_MULT_T3
      # and both end with:
      contract.cash_out_amount_usd  = amount
      contract.cash_out_through_date = period_end_date
      contract.imbalance_dth        = 0.000
      one CASH_OUT ImbalanceLedgerEntry with gas_day = null, amount_usd = amount
      Shipper.outstanding_penalty_usd += amount   (then credit re-evaluated)
    constants:
      IMBALANCE_TOLERANCE_PCT: 2
      PENALTY_BAND_1_PCT: 5
      PENALTY_BAND_2_PCT: 10
      PENALTY_MULT_T1: 1.00
      PENALTY_MULT_T2: 1.25
      PENALTY_MULT_T3: 1.50
    precision: "money 2 decimal places round_half_up; billable volume 3 decimal places; percentage 4 decimal places"
    variants:
      - name: MONTHLY_AGGREGATE
        when: "contract.cash_out_method == MONTHLY_AGGREGATE"
        difference: |
          Net the whole period FIRST, then price ONCE:
            sched_total = sum(scheduled volume over the period's gas days)
            net_imb     = sum(signed imbalance over the period's gas days)
            billable    = max(0, abs(net_imb) - tolerance(sched_total))
            pct         = round_half_up(billable / sched_total * 100, 4)
            amount      = round_half_up(billable * index_price * multiplier(pct), 2)
          Offsetting days cancel out, and a single period-level tolerance and a
          single multiplier apply.
      - name: DAILY_RATCHET
        when: "contract.cash_out_method == DAILY_RATCHET"
        difference: |
          Price EACH gas day independently, ROUND EACH DAY to 2 dp, THEN sum:
            for each gas day d in the period:
              billable_d = max(0, abs(imb_d) - tolerance(sched_d))
              pct_d      = round_half_up(billable_d / sched_d * 100, 4)
              amount_d   = round_half_up(billable_d * index_price * multiplier(pct_d), 2)
            amount = round_half_up(sum(amount_d), 2)
          THE ROUNDING ORDER IS PINNED: round per gas day, then sum. Summing the
          unrounded per-day products and rounding once at the end is FORBIDDEN and
          yields a different total in cents. Offsetting days do NOT cancel (each
          day's absolute deviation is billed), and each day gets its own tolerance
          and its own multiplier band.

  - name: contract_position_reconciliation
    trigger: "After every ticket confirm/reverse, nomination confirm/curtail/supersede, cash-out and cash-out reversal"
    algorithm: aggregation
    input_set: "All ImbalanceLedgerEntries of the contract, and all non-terminal Nominations of the contract"
    formula: |
      contract.scheduled_injection_dth  = sum(n.confirmed_volume_dth for n in nominations
                                              if n.status in (CONFIRMED, CURTAILED) and n.direction == INJECTION)
      contract.scheduled_withdrawal_dth = sum(n.confirmed_volume_dth for n in nominations
                                              if n.status in (CONFIRMED, CURTAILED) and n.direction == WITHDRAWAL)
      contract.imbalance_dth = round_half_up(
          sum(e.volume_dth for e in ledger
              if e.entry_type == DAILY_IMBALANCE
              and (contract.cash_out_through_date is null or e.gas_day > contract.cash_out_through_date)), 3)
      shipper.outstanding_penalty_usd = round_half_up(
          sum(e.amount_usd for e in ALL ledger entries of ALL contracts of this shipper
              if e.entry_type in (CASH_OUT, CASH_OUT_REVERSAL)), 2)
      shipper.credit_status = SUSPENDED
          if shipper.outstanding_penalty_usd >= shipper.penalty_threshold_usd else GOOD
      # gas_volume_conservation (global invariant, must hold after every mutation):
      #   field.working_gas_inventory_dth
      #     == field.opening_working_gas_dth
      #      + sum(contract.inventory_balance_dth for contracts on the field)
      #      + field.retained_fuel_pool_dth
      #      - field.fuel_gas_used_dth
    constants: {}
    precision: "volumes 3 decimal places round_half_up; money 2 decimal places round_half_up; the credit threshold comparison is >= (at-threshold suspends)"

  - name: report_variance
    trigger: "POST /regulatory-reports (preparation snapshot) and re-evaluated on POST /regulatory-reports/{id}/submit"
    algorithm: threshold
    input_set: "The StorageField's working_gas_inventory_dth at preparation time, and RemediationPrograms on the field's wells with status in (OPEN, ESCALATED)"
    formula: |
      book_inventory_dth = round_half_up(storage_field.working_gas_inventory_dth, 3)
      variance_dth       = round_half_up(measured_inventory_dth - book_inventory_dth, 3)
      variance_pct       = round_half_up(abs(variance_dth) / book_inventory_dth * 100, 4)
      open_finding_count = count(RemediationProgram on this field's wells
                                 with status in (OPEN, ESCALATED))
      # submission gate (boundary is inclusive):
      #   variance_pct <= MAX_REPORT_VARIANCE_PCT  -> may submit
      #   variance_pct >  MAX_REPORT_VARIANCE_PCT  -> ERR_REPORT_VARIANCE_EXCEEDED
    constants:
      MAX_REPORT_VARIANCE_PCT: 0.5000
    precision: "variance_pct 4 decimal places round_half_up, compared with <= after rounding"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST violated rule determines the returned error_id)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's `roles:` in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: state
    check: "Request body conforms to the endpoint's `input:` schema: required fields present, types correct, enum members valid, numeric ranges honoured (volumes > 0, derate_factor in [0.00,0.50], deliverability_curve ascending with endpoints at 0 and 100, scheduled_end_at > scheduled_start_at, window_end_at > window_start_at, term_end_date >= term_start_date, dates in YYYY-MM-DD, instants ISO-8601 UTC), and pagination params within the §1.0 bounds. On POST /nominations/{id}/submit a supplied nominated_volume_dth must be > 0 and <= the stored nominated_volume_dth — a re-submission may only lower the request, never raise it"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every id appearing in the request PATH resolves to an existing resource, validated left-to-right. The resource type determines the code: StorageField -> ERR_STORAGE_FIELD_NOT_FOUND, Well -> ERR_WELL_NOT_FOUND, MechanicalIntegrityTest -> ERR_MIT_NOT_FOUND, RemediationProgram -> ERR_REMEDIATION_PROGRAM_NOT_FOUND, CompressorUnit -> ERR_COMPRESSOR_UNIT_NOT_FOUND, CompressorRun -> ERR_COMPRESSOR_RUN_NOT_FOUND, Shipper -> ERR_SHIPPER_NOT_FOUND, StorageContract -> ERR_CONTRACT_NOT_FOUND, Nomination -> ERR_NOMINATION_NOT_FOUND, GasMovementTicket -> ERR_TICKET_NOT_FOUND, EmergencyEvent -> ERR_EMERGENCY_EVENT_NOT_FOUND, RegulatoryReport -> ERR_REPORT_NOT_FOUND"
    error_id: ERR_STORAGE_FIELD_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a path id"
    description: "error_id names one representative member of the 404 family fully enumerated in `check:`; every member is catalogued in §1.6."

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request BODY resolves to an existing resource, validated in the order the fields appear in the endpoint's `input:`. Same per-type code mapping as priority 4 (e.g. Nomination.contract_id -> ERR_CONTRACT_NOT_FOUND, GasMovementTicket.well_id -> ERR_WELL_NOT_FOUND, EmergencyEvent.well_id -> ERR_WELL_NOT_FOUND when supplied non-null). Two FKs are additionally scoped, and a resource outside the scope is reported as if it did not exist: on POST /gas-movement-tickets the well_id must resolve to a Well whose storage_field_id equals the nomination's contract.storage_field_id (otherwise ERR_WELL_NOT_FOUND), and on POST /emergency-events a supplied well_id must resolve to a Well on the supplied storage_field_id (otherwise ERR_WELL_NOT_FOUND)"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "POST /wells, POST /mechanical-integrity-tests, POST /compressor-units, POST /compressor-runs, POST /storage-contracts, POST /nominations, POST /gas-movement-tickets, POST /emergency-events, POST /regulatory-reports"
    description: "error_id names one representative member of the same 404 family."

  - priority: 6
    category: business_referential
    check: "When X-User-Role == Shipper, X-User-ID must equal the shipper_id of the StorageContract the request touches (directly, via the Nomination named in the path, or via the Nomination of the GasMovementTicket named in the path). The single-resource reads are gated the same way as the writes; the Shipper-visible LIST endpoints (GET /storage-contracts, GET /nominations, GET /gas-movement-tickets) never raise this error and instead return only the rows whose owning contract.shipper_id equals X-User-ID, with total_count counting those rows only"
    error_id: ERR_CONTRACT_NOT_OWNED
    http_status: 403
    applies_to: "POST /nominations, POST /nominations/{id}/submit, GET /nominations/{id}, GET /storage-contracts/{id}, GET /storage-contracts/{id}/imbalance-ledger-entries, GET /gas-movement-tickets/{id}"

  - priority: 7
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2. Per-entity codes: Nomination -> ERR_INVALID_NOMINATION_STATE, GasMovementTicket -> ERR_INVALID_TICKET_STATE, StorageContract -> ERR_INVALID_CONTRACT_STATE, MechanicalIntegrityTest -> ERR_INVALID_MIT_STATE, RemediationProgram -> ERR_INVALID_REMEDIATION_STATE, CompressorRun -> ERR_INVALID_RUN_STATE, EmergencyEvent -> ERR_INVALID_EMERGENCY_STATE, RegulatoryReport -> ERR_INVALID_REPORT_STATE, Well -> ERR_INVALID_WELL_STATE. A Well carries two state dimensions, so `state` for POST /wells/{id}/service-change means the pair plus the guards §1.2 declares on the edge: to IN_SERVICE is declared only from operational_state == SHUT_IN with integrity_state != MIT_FAILED and no RemediationProgram on the well in status OPEN or ESCALATED; to SHUT_IN only from IN_SERVICE with no GasMovementTicket on the well in status PENDING; to PLUGGED only from SHUT_IN with no MechanicalIntegrityTest on the well in status SCHEDULED — every other combination is ERR_INVALID_WELL_STATE. Likewise POST /compressor-runs/{id}/complete requires run.status == SCHEDULED AND the run's CompressorUnit not in status OUT_OF_SERVICE, both reported as ERR_INVALID_RUN_STATE"
    error_id: ERR_INVALID_TICKET_STATE
    http_status: 409
    applies_to: "all action endpoints"
    description: "error_id names one representative member of the 409 state family fully enumerated in `check:`."

  - priority: 8
    category: state
    check: "The supplied OCC field matches the parent's current version: expected_contract_version == StorageContract.version on POST /nominations (ERR_STALE_CONTRACT_VERSION); expected_storage_field_version == StorageField.version on POST /gas-movement-tickets/{id}/confirm (ERR_STALE_FIELD_VERSION)"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /nominations, POST /gas-movement-tickets/{id}/confirm"

  - priority: 9
    category: business_safety
    check: "StorageField.field_posture != FROZEN for any operation that schedules or moves gas on that field"
    error_id: ERR_FIELD_FROZEN
    http_status: 422
    applies_to: "POST /nominations/{id}/confirm, POST /gas-movement-tickets/{id}/confirm, POST /storage-contracts/{id}/activate, POST /compressor-runs"

  - priority: 10
    category: business_safety
    check: "When StorageField.field_posture == RESTRICTED, a Nomination on an INTERRUPTIBLE contract may not be confirmed (FIRM contracts are unaffected)"
    error_id: ERR_INTERRUPTIBLE_RESTRICTED
    http_status: 422
    applies_to: "POST /nominations/{id}/confirm"

  - priority: 11
    category: business_safety
    check: "The GasMovementTicket's Well has integrity_state != MIT_FAILED and no RemediationProgram on that well is in status OPEN or ESCALATED. Wellbore integrity is checked BEFORE availability (priority 12) because a MIT failure always shuts the well in as a side effect, so the two conditions are co-violated on every failed well and only this order makes both errors observable"
    error_id: ERR_WELL_INTEGRITY_FAILED
    http_status: 422
    applies_to: "POST /gas-movement-tickets, POST /gas-movement-tickets/{id}/confirm"

  - priority: 12
    category: business_safety
    check: "The GasMovementTicket's Well has operational_state == IN_SERVICE and well_type == INJECTION_WITHDRAWAL"
    error_id: ERR_WELL_NOT_IN_SERVICE
    http_status: 422
    applies_to: "POST /gas-movement-tickets, POST /gas-movement-tickets/{id}/confirm"

  - priority: 13
    category: business_safety
    check: "On a WITHDRAWAL ticket confirm, actual_volume_dth <= StorageField.working_gas_inventory_dth — withdrawing beyond the working gas would encroach on cushion gas. The boundary is inclusive: an actual_volume_dth exactly equal to working_gas_inventory_dth is permitted and leaves working gas at exactly 0.000"
    error_id: ERR_CUSHION_GAS_BREACH
    http_status: 422
    applies_to: "POST /gas-movement-tickets/{id}/confirm"

  - priority: 14
    category: business_safety
    check: "On an INJECTION ticket confirm, StorageField.working_gas_inventory_dth + net_volume_dth <= StorageField.max_working_gas_dth"
    error_id: ERR_WORKING_GAS_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /gas-movement-tickets/{id}/confirm"

  - priority: 15
    category: business_safety
    check: "The current_pressure_psig that would result from an INJECTION ticket confirm is <= StorageField.max_pressure_psig; and a recorded MIT result_pressure_psig is <= StorageField.max_pressure_psig"
    error_id: ERR_FIELD_PRESSURE_LIMIT
    http_status: 422
    applies_to: "POST /gas-movement-tickets/{id}/confirm, POST /mechanical-integrity-tests/{id}/record-result"

  - priority: 16
    category: business_safety
    check: "Advancing an EmergencyEvent to EVACUATION_ORDERED requires severity in (SERIOUS, CRITICAL) and MIN_EVACUATION_RADIUS_M <= evacuation_radius_m <= MAX_EVACUATION_RADIUS_M"
    error_id: ERR_EVACUATION_RADIUS_INVALID
    http_status: 422
    applies_to: "POST /emergency-events/{id}/advance"

  - priority: 17
    category: business_temporal
    check: "Nomination.gas_day is within [contract.term_start_date, contract.term_end_date] inclusive"
    error_id: ERR_GAS_DAY_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /nominations"

  - priority: 18
    category: business_temporal
    check: "The current logical clock is strictly before the nomination cutoff for gas_day, defined as (gas_day - 1 day) at NOMINATION_CUTOFF_HOUR_UTC:00:00Z"
    error_id: ERR_NOMINATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /nominations, POST /nominations/{id}/submit"

  - priority: 19
    category: business_temporal
    check: "A Nomination on an INTERRUPTIBLE contract must have direction == StorageField.season; FIRM contracts may nominate against the season"
    error_id: ERR_SEASON_DIRECTION_MISMATCH
    http_status: 422
    applies_to: "POST /nominations"

  - priority: 20
    category: business_temporal
    check: "MechanicalIntegrityTest.scheduled_start_at is >= the current logical clock at creation"
    error_id: ERR_MIT_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /mechanical-integrity-tests"

  - priority: 21
    category: business_temporal
    check: "The current logical clock is >= MechanicalIntegrityTest.scheduled_end_at before a result may be recorded"
    error_id: ERR_MIT_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /mechanical-integrity-tests/{id}/record-result"

  - priority: 22
    category: business_temporal
    check: "CompressorRun.window_start_at is >= the current logical clock at creation"
    error_id: ERR_RUN_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /compressor-runs"

  - priority: 23
    category: business_temporal
    check: "The current logical clock is >= CompressorRun.window_end_at before the run may be completed"
    error_id: ERR_RUN_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /compressor-runs/{id}/complete"

  - priority: 24
    category: business_constraint
    check: "No other MechanicalIntegrityTest with status == SCHEDULED on the same Well occupies an overlapping window once each existing window is padded by MIT_BUFFER_HOURS on BOTH sides. Formally, reject when new.scheduled_start_at < existing.scheduled_end_at + MIT_BUFFER_HOURS AND existing.scheduled_start_at < new.scheduled_end_at + MIT_BUFFER_HOURS. Windows are half-open, so back-to-back windows separated by exactly MIT_BUFFER_HOURS are accepted"
    error_id: ERR_MIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /mechanical-integrity-tests"

  - priority: 25
    category: business_constraint
    check: "For every instant covered by the new CompressorRun's half-open window, the sum of allocated_horsepower over SCHEDULED and COMPLETED runs on the same CompressorUnit that cover that instant, plus the new allocation, is <= unit.rated_horsepower. Adjacency is free: a run starting exactly at another's window_end_at never overlaps, and a sum exactly equal to rated_horsepower is accepted"
    error_id: ERR_HORSEPOWER_OVERSUBSCRIBED
    http_status: 409
    applies_to: "POST /compressor-runs"

  - priority: 26
    category: business_constraint
    check: "Segregation of duties: on POST /remediation-programs/{id}/complete, X-User-ID must differ from the triggering MechanicalIntegrityTest.recorded_by_user_id (ERR_SOD_REMEDIATION_SELF_VERIFICATION); on POST /regulatory-reports/{id}/submit, X-User-ID must differ from RegulatoryReport.prepared_by_user_id (also ERR_SOD_REMEDIATION_SELF_VERIFICATION)"
    error_id: ERR_SOD_REMEDIATION_SELF_VERIFICATION
    http_status: 403
    applies_to: "POST /remediation-programs/{id}/complete, POST /regulatory-reports/{id}/submit"

  - priority: 27
    category: business_constraint
    check: "Uniqueness: StorageField.field_code globally (ERR_DUPLICATE_FIELD_CODE); Shipper.duns_number globally (ERR_DUPLICATE_DUNS); StorageContract.contract_code globally (ERR_DUPLICATE_CONTRACT_CODE); CompressorUnit.unit_code within storage_field_id (ERR_DUPLICATE_UNIT_CODE); at most one non-REJECTED RegulatoryReport per (storage_field_id, report_type, period_start_date, period_end_date) (ERR_DUPLICATE_REPORT_PERIOD)"
    error_id: ERR_DUPLICATE_FIELD_CODE
    http_status: 409
    applies_to: "POST /storage-fields, POST /shippers, POST /storage-contracts, POST /compressor-units, POST /regulatory-reports"

  - priority: 28
    category: business_constraint
    check: "A GasMovementTicket may only be created against a Nomination with status == CONFIRMED and confirmed_volume_dth > 0 (any other nomination status, or a CONFIRMED nomination whose confirmed_volume_dth == 0, is ERR_INVALID_NOMINATION_STATE), and at most one non-REVERSED ticket may exist per Nomination (a second live ticket is ERR_TICKET_ALREADY_EXISTS; once the first ticket is REVERSED a replacement may be opened). The nomination-status clause is evaluated before the duplicate-ticket clause"
    error_id: ERR_TICKET_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /gas-movement-tickets"

  - priority: 29
    category: business_constraint
    check: "GasMovementTicket.actual_volume_dth <= round_half_up(nomination.confirmed_volume_dth * (100 + TICKET_OVERRUN_PCT) / 100, 0), i.e. the metered volume may exceed the confirmed schedule by at most TICKET_OVERRUN_PCT percent"
    error_id: ERR_TICKET_OVERRUN_EXCEEDED
    http_status: 422
    applies_to: "POST /gas-movement-tickets"

  - priority: 30
    category: business_constraint
    check: "Re-submitting a CURTAILED Nomination requires revision_round < MAX_REVISION_ROUNDS"
    error_id: ERR_NOMINATION_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /nominations/{id}/submit"

  - priority: 31
    category: business_constraint
    check: "A GasMovementTicket may not be reversed while a RegulatoryReport on the same StorageField with status in (SUBMITTED, ACCEPTED) covers the ticket's nomination gas_day"
    error_id: ERR_REPORTING_PERIOD_LOCKED
    http_status: 409
    applies_to: "POST /gas-movement-tickets/{id}/reverse"

  - priority: 32
    category: business_constraint
    check: "A RemediationProgram in status OPEN may not be completed while an EmergencyEvent on its well's StorageField has status in (RESPONDING, EVACUATION_ORDERED). A program already in ESCALATED can never be completed at all, and that attempt is reported under priority 7 as ERR_INVALID_REMEDIATION_STATE"
    error_id: ERR_REMEDIATION_ESCALATED
    http_status: 409
    applies_to: "POST /remediation-programs/{id}/complete"

  - priority: 33
    category: business_fiscal
    check: "Nomination.nominated_volume_dth <= contract.max_daily_injection_dth (INJECTION) or contract.max_daily_withdrawal_dth (WITHDRAWAL), and on INJECTION nominated_volume_dth <= (contract.max_storage_quantity_dth - contract.inventory_balance_dth)"
    error_id: ERR_CONTRACT_RIGHTS_EXCEEDED
    http_status: 422
    applies_to: "POST /nominations"

  - priority: 34
    category: business_fiscal
    check: "On a WITHDRAWAL ticket confirm, actual_volume_dth + fuel_retention_dth <= contract.inventory_balance_dth"
    error_id: ERR_CONTRACT_INVENTORY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /gas-movement-tickets/{id}/confirm"

  - priority: 35
    category: business_fiscal
    check: "The Shipper behind the touched contract has credit_status == GOOD"
    error_id: ERR_SHIPPER_CREDIT_SUSPENDED
    http_status: 402
    applies_to: "POST /storage-contracts/{id}/activate, POST /nominations, POST /nominations/{id}/submit, POST /nominations/{id}/confirm"

  - priority: 36
    category: business_fiscal
    check: "cash-out period_start_date must be strictly after contract.cash_out_through_date when that date is set"
    error_id: ERR_CASH_OUT_PERIOD_SETTLED
    http_status: 409
    applies_to: "POST /storage-contracts/{id}/cash-out"

  - priority: 37
    category: business_fiscal
    check: "A cash-out requires at least one DAILY_IMBALANCE ledger entry in the period; a cash-out-reversal requires an unreversed CASH_OUT entry to exist"
    error_id: ERR_NOTHING_TO_CASH_OUT
    http_status: 422
    applies_to: "POST /storage-contracts/{id}/cash-out, POST /storage-contracts/{id}/cash-out-reversal"

  - priority: 38
    category: business_referential
    check: "RegulatoryReport.variance_pct <= MAX_REPORT_VARIANCE_PCT (0.5000), evaluated on the 4-decimal rounded value"
    error_id: ERR_REPORT_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /regulatory-reports/{id}/submit"

  - priority: 39
    category: business_referential
    check: "A RegulatoryReport with report_type == INTEGRITY_PROGRAM_STATUS may only be submitted when open_finding_count == 0"
    error_id: ERR_OPEN_INTEGRITY_FINDINGS
    http_status: 422
    applies_to: "POST /regulatory-reports/{id}/submit"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix is "/", so every path below is absolute)
# =============================================================================
endpoints:

  # ---------------- StorageField ----------------
  - method: POST
    path: "/storage-fields"
    description: "Register an underground storage reservoir with its deliverability curve"
    roles: [FieldOperator]
    code: 201
    input: [name, field_code, total_capacity_dth, cushion_gas_dth, base_pressure_psig, pressure_span_psig, max_pressure_psig, deliverability_curve, "season?", "opening_working_gas_dth?", "deliverability_method?"]
    output: StorageField
    side_effects:
      - "max_working_gas_dth = total_capacity_dth - cushion_gas_dth"
      - "working_gas_inventory_dth = opening_working_gas_dth; retained_fuel_pool_dth = 0; fuel_gas_used_dth = 0"
      - "deliverability_rates computes inventory_pct, current_pressure_psig, deliverability_tier and both max rates (0 while no wells exist)"
      - "field_posture_derivation yields FROZEN because wells_in_service_count == 0"

  - method: GET
    path: "/storage-fields/{id}"
    description: "Read one storage field including its derived posture and deliverability"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer, Shipper]
    code: 200
    input: []
    output: StorageField
    side_effects: []

  - method: POST
    path: "/storage-fields/{id}/season"
    description: "Flip the reservoir's seasonal posture between INJECTION and WITHDRAWAL"
    roles: [FieldOperator]
    code: 200
    input: [season]
    output: StorageField
    side_effects:
      - "season updated"
      - "curtailment sweep: every CONFIRMED Nomination on an INTERRUPTIBLE contract of this field whose direction != the new season, whose gas_day >= the current UTC date, and which has no CONFIRMED GasMovementTicket, becomes CURTAILED with confirmed_volume_dth = 0"
      - "a CURTAILMENT_CREDIT ImbalanceLedgerEntry is appended per curtailed nomination; each affected contract's scheduled_* recomputed and version incremented by 1"

  - method: GET
    path: "/storage-fields/{id}/regulatory-reports"
    description: "List the regulatory reports filed for this storage field"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: ["report_type?", "status?", "limit?", "offset?"]
    output: "RegulatoryReport[]"
    side_effects: []

  # ---------------- Well ----------------
  - method: POST
    path: "/wells"
    description: "Register a wellbore on a storage field"
    roles: [FieldOperator]
    code: 201
    input: [storage_field_id, well_name, well_type, rated_rate_dth_per_day, last_mit_passed_at, "casing_pressure_psig?", "initial_operational_state?"]
    output: Well
    side_effects:
      - "operational_state = initial_operational_state (default IN_SERVICE); service_change_count = 0"
      - "mit_due_at = last_mit_passed_at + MIT_INTERVAL_DAYS; integrity_state = MIT_DUE when mit_due_at <= the current logical clock, else MIT_CURRENT"
      - "StorageField.wells_in_service_count, deliverability rates and field_posture recomputed"

  - method: GET
    path: "/wells/{id}"
    description: "Read one wellbore with both of its state dimensions"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer, Shipper]
    code: 200
    input: []
    output: Well
    side_effects: []

  - method: GET
    path: "/wells"
    description: "List wellbores, optionally scoped to one storage field or state"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer, Shipper]
    code: 200
    input: ["storage_field_id?", "operational_state?", "integrity_state?", "limit?", "offset?"]
    output: "Well[]"
    side_effects: []

  - method: POST
    path: "/wells/{id}/service-change"
    description: "Move a wellbore between IN_SERVICE, SHUT_IN and PLUGGED"
    roles: [FieldOperator]
    code: 200
    input: [to_operational_state, "reason?"]
    output: Well
    side_effects:
      - "operational_state updated; shut_in_reason set to OPERATOR_REQUEST on shut-in and cleared on return to service; service_change_count incremented"
      - "StorageField.wells_in_service_count, deliverability rates, inventory_pct-derived tier and field_posture recomputed"
      - "curtailment sweep phase B for every future gas day whose CONFIRMED volume now exceeds the reduced field rate; phase A when the field becomes FROZEN"

  # ---------------- MechanicalIntegrityTest ----------------
  - method: POST
    path: "/mechanical-integrity-tests"
    description: "Schedule a mechanical integrity test window on a wellbore"
    roles: [IntegrityEngineer]
    code: 201
    input: [well_id, test_type, scheduled_start_at, scheduled_end_at]
    output: MechanicalIntegrityTest
    side_effects:
      - "status = SCHEDULED; outcome, result_pressure_psig, recorded_by_user_id and recorded_at stay null"
      - "the wellbore's SCHEDULED test windows are checked for overlap after MIT_BUFFER_HOURS padding on both sides"

  - method: GET
    path: "/mechanical-integrity-tests/{id}"
    description: "Read one mechanical integrity test"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: MechanicalIntegrityTest
    side_effects: []

  - method: GET
    path: "/mechanical-integrity-tests"
    description: "List mechanical integrity tests, optionally scoped to one wellbore"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: ["well_id?", "status?", "limit?", "offset?"]
    output: "MechanicalIntegrityTest[]"
    side_effects: []

  - method: POST
    path: "/mechanical-integrity-tests/{id}/record-result"
    description: "Record the outcome of an elapsed mechanical integrity test window"
    roles: [IntegrityEngineer]
    code: 200
    input: [outcome, result_pressure_psig]
    output: MechanicalIntegrityTest
    side_effects:
      - "status = PASSED on PASS, FAILED on FAIL or INCONCLUSIVE; recorded_by_user_id = X-User-ID; recorded_at = current clock"
      - "on PASS: Well.integrity_state = MIT_CURRENT, Well.last_mit_passed_at = recorded_at, mit_due_at recomputed, casing_pressure_psig = result_pressure_psig"
      - "on FAIL: Well.integrity_state = MIT_FAILED, Well.operational_state = SHUT_IN with shut_in_reason MIT_FAILURE, a RemediationProgram is created OPEN, StorageField posture and rates recomputed, curtailment sweep phase A runs"
      - "on INCONCLUSIVE: neither Well dimension changes and no RemediationProgram is created"

  # ---------------- RemediationProgram ----------------
  - method: GET
    path: "/remediation-programs/{id}"
    description: "Read one remediation program"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: RemediationProgram
    side_effects: []

  - method: GET
    path: "/remediation-programs"
    description: "List remediation programs, optionally scoped to a wellbore or the failed test that opened them"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: ["well_id?", "triggering_mit_id?", "status?", "limit?", "offset?"]
    output: "RemediationProgram[]"
    side_effects: []

  - method: POST
    path: "/remediation-programs/{id}/complete"
    description: "Close a remediation program after independent verification"
    roles: [IntegrityEngineer]
    code: 200
    input: [verification_notes]
    output: RemediationProgram
    side_effects:
      - "status = COMPLETED; completed_by_user_id = X-User-ID; completed_at = current clock; verification_notes stored"
      - "Well.integrity_state = REMEDIATED; Well.shut_in_reason = null"
      - "StorageField.field_posture recomputed"

  # ---------------- CompressorUnit / CompressorRun ----------------
  - method: POST
    path: "/compressor-units"
    description: "Register a compressor unit at the station serving a storage field"
    roles: [FieldOperator]
    code: 201
    input: [storage_field_id, unit_code, rated_horsepower, "derate_factor?"]
    output: CompressorUnit
    side_effects:
      - "status = AVAILABLE; lifetime_fuel_dth = 0; scheduled_run_count = 0"

  - method: GET
    path: "/compressor-units/{id}"
    description: "Read one compressor unit"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: CompressorUnit
    side_effects: []

  - method: GET
    path: "/compressor-units"
    description: "List compressor units, optionally scoped to one storage field"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: ["storage_field_id?", "status?", "limit?", "offset?"]
    output: "CompressorUnit[]"
    side_effects: []

  - method: GET
    path: "/compressor-units/{id}/runs"
    description: "List the horsepower allocation runs booked on this compressor unit"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CompressorRun[]"
    side_effects: []

  - method: POST
    path: "/compressor-runs"
    description: "Book a horsepower allocation window on a compressor unit"
    roles: [FieldOperator]
    code: 201
    input: [compressor_unit_id, window_start_at, window_end_at, allocated_horsepower, mode]
    output: CompressorRun
    side_effects:
      - "status = SCHEDULED; fuel_consumed_dth stays null"
      - "duration_hours, effective_horsepower, utilization_ratio and utilization_band computed and stamped at booking"
      - "CompressorUnit.scheduled_run_count incremented; CompressorUnit.status = COMMITTED"

  - method: POST
    path: "/compressor-runs/{id}/complete"
    description: "Close out an elapsed compressor run and burn its fuel out of working gas"
    roles: [FieldOperator]
    code: 200
    input: []
    output: CompressorRun
    side_effects:
      - "fuel_consumed_dth computed by compressor_fuel_burn; status = COMPLETED"
      - "CompressorUnit.lifetime_fuel_dth increased; scheduled_run_count decremented; status back to AVAILABLE at zero"
      - "StorageField.fuel_gas_used_dth increased and working_gas_inventory_dth reduced by fuel_consumed_dth; rates, tier, pressure and posture recomputed; version incremented by 1"
      - "curtailment sweep phase B applied to future gas days that no longer fit the reduced rate"

  # ---------------- Shipper ----------------
  - method: POST
    path: "/shippers"
    description: "Register a storage customer"
    roles: [SchedulingCoordinator]
    code: 201
    input: [legal_name, duns_number, penalty_threshold_usd]
    output: Shipper
    side_effects:
      - "outstanding_penalty_usd = 0.00; credit_status = GOOD"

  - method: GET
    path: "/shippers/{id}"
    description: "Read one storage customer including credit posture"
    roles: [SchedulingCoordinator, ComplianceOfficer, FieldOperator, Shipper]
    code: 200
    input: []
    output: Shipper
    side_effects: []

  # ---------------- StorageContract ----------------
  - method: POST
    path: "/storage-contracts"
    description: "Draft a firm or interruptible storage service contract"
    roles: [SchedulingCoordinator]
    code: 201
    input: [shipper_id, storage_field_id, contract_code, service_class, max_storage_quantity_dth, max_daily_injection_dth, max_daily_withdrawal_dth, term_start_date, term_end_date, commodity_rate_usd_per_dth, index_price_usd_per_dth, cash_out_method]
    output: StorageContract
    side_effects:
      - "status = DRAFT; inventory_balance_dth = 0.000; imbalance_dth = 0.000; cash_out_amount_usd = 0.00; cash_out_through_date = null; scheduled_injection_dth = 0; scheduled_withdrawal_dth = 0"

  - method: GET
    path: "/storage-contracts/{id}"
    description: "Read one storage service contract with its balancing position"
    roles: [SchedulingCoordinator, ComplianceOfficer, FieldOperator, Shipper]
    code: 200
    input: []
    output: StorageContract
    side_effects: []

  - method: GET
    path: "/storage-contracts"
    description: "List storage service contracts, optionally scoped to a shipper or a field"
    roles: [SchedulingCoordinator, ComplianceOfficer, FieldOperator, Shipper]
    code: 200
    input: ["shipper_id?", "storage_field_id?", "status?", "service_class?", "limit?", "offset?"]
    output: "StorageContract[]"
    side_effects: []

  - method: POST
    path: "/storage-contracts/{id}/activate"
    description: "Make a drafted contract nominatable"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: StorageContract
    side_effects:
      - "status = ACTIVE; activated_at = current clock"

  - method: POST
    path: "/storage-contracts/{id}/cash-out"
    description: "Settle the contract's accumulated imbalance for a period under its cash-out method"
    roles: [SchedulingCoordinator]
    code: 200
    input: [period_start_date, period_end_date]
    output: StorageContract
    side_effects:
      - "imbalance_cash_out computes the assessment under the contract's MONTHLY_AGGREGATE or DAILY_RATCHET variant"
      - "cash_out_amount_usd and cash_out_through_date stamped; imbalance_dth reset to 0.000"
      - "one CASH_OUT ImbalanceLedgerEntry appended with gas_day = null"
      - "Shipper.outstanding_penalty_usd recomputed; credit_status = SUSPENDED when it reaches penalty_threshold_usd"
      - "on suspension: every ACTIVE contract of that shipper becomes SUSPENDED, its DRAFT/SUBMITTED nominations become REJECTED, and its future CONFIRMED nominations without a CONFIRMED ticket become CURTAILED with CURTAILMENT_CREDIT ledger entries"

  - method: POST
    path: "/storage-contracts/{id}/cash-out-reversal"
    description: "Reverse the most recent unreversed cash-out on this contract"
    roles: [SchedulingCoordinator]
    code: 200
    input: [reason]
    output: StorageContract
    side_effects:
      - "one CASH_OUT_REVERSAL ImbalanceLedgerEntry appended with amount_usd = the negated cash-out amount"
      - "cash_out_amount_usd = 0.00; cash_out_through_date restored to its prior value; imbalance_dth recomputed"
      - "Shipper.outstanding_penalty_usd recomputed to exactly the pre-cash-out figure; credit_status re-evaluated"
      - "on credit restoration: every SUSPENDED contract of that shipper returns to ACTIVE; curtailed and rejected nominations are NOT restored"

  - method: GET
    path: "/storage-contracts/{id}/imbalance-ledger-entries"
    description: "List the append-only balancing ledger for this contract"
    roles: [SchedulingCoordinator, ComplianceOfficer, FieldOperator, Shipper]
    code: 200
    input: ["entry_type?", "gas_day?", "limit?", "offset?"]
    output: "ImbalanceLedgerEntry[]"
    side_effects: []

  # ---------------- Nomination ----------------
  - method: POST
    path: "/nominations"
    description: "File a nomination for one gas day against a storage service contract; supersedes any prior non-terminal nomination for the same contract, gas day and direction"
    roles: [Shipper]
    code: 201
    input: [contract_id, gas_day, direction, nominated_volume_dth, expected_contract_version]
    output: Nomination
    side_effects:
      - "status = DRAFT; confirmed_volume_dth = 0; curtailed_volume_dth = 0; revision_round = 0"
      - "any existing non-terminal Nomination on the same contract_id + gas_day + direction becomes SUPERSEDED with superseded_by_nomination_id = the new id, and its confirmed volume is removed from contract.scheduled_*"
      - "increments StorageContract.version by 1"

  - method: GET
    path: "/nominations/{id}"
    description: "Read one nomination"
    roles: [FieldOperator, SchedulingCoordinator, ComplianceOfficer, Shipper]
    code: 200
    input: []
    output: Nomination
    side_effects: []

  - method: GET
    path: "/nominations"
    description: "List nominations, optionally scoped to a contract, a gas day, a status, or the nomination that superseded them"
    roles: [FieldOperator, SchedulingCoordinator, ComplianceOfficer, Shipper]
    code: 200
    input: ["contract_id?", "gas_day?", "direction?", "status?", "superseded_by_nomination_id?", "limit?", "offset?"]
    output: "Nomination[]"
    side_effects: []

  - method: POST
    path: "/nominations/{id}/submit"
    description: "Submit a drafted nomination, or re-submit a curtailed one for another allocation round, optionally lowering the requested volume"
    roles: [Shipper]
    code: 200
    input: ["nominated_volume_dth?"]
    output: Nomination
    side_effects:
      - "status = SUBMITTED; submitted_at = current clock"
      - "on re-submission from CURTAILED: revision_round incremented by 1; confirmed_volume_dth and curtailed_volume_dth reset to 0; contract.scheduled_* reduced by the previously confirmed volume"
      - "nominated_volume_dth lowered when supplied"

  - method: POST
    path: "/nominations/{id}/confirm"
    description: "Run the allocation waterfall and confirm or curtail a submitted nomination"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Nomination
    side_effects:
      - "nomination_confirm_waterfall sets confirmed_volume_dth and curtailed_volume_dth; confirmed_at = current clock"
      - "status = CONFIRMED when nothing was curtailed, CURTAILED otherwise"
      - "on curtailment: a CURTAILMENT_CREDIT ImbalanceLedgerEntry with volume_dth = -curtailed_volume_dth and amount_usd = 0.00 is appended"
      - "contract.scheduled_injection_dth or scheduled_withdrawal_dth recomputed; StorageContract.version incremented by 1"

  # ---------------- GasMovementTicket ----------------
  - method: POST
    path: "/gas-movement-tickets"
    description: "Open a metered gas movement ticket against a confirmed nomination and a wellbore"
    roles: [FieldOperator]
    code: 201
    input: [nomination_id, well_id, actual_volume_dth]
    output: GasMovementTicket
    side_effects:
      - "status = PENDING; all charge and volume fields stay null until confirmation"
      - "the wellbore's readiness and the TICKET_OVERRUN_PCT cap against nomination.confirmed_volume_dth are enforced at creation"

  - method: GET
    path: "/gas-movement-tickets/{id}"
    description: "Read one gas movement ticket with its charge breakdown"
    roles: [FieldOperator, SchedulingCoordinator, ComplianceOfficer, Shipper]
    code: 200
    input: []
    output: GasMovementTicket
    side_effects: []

  - method: GET
    path: "/gas-movement-tickets"
    description: "List gas movement tickets, optionally scoped to a nomination or a wellbore"
    roles: [FieldOperator, SchedulingCoordinator, ComplianceOfficer, Shipper]
    code: 200
    input: ["nomination_id?", "well_id?", "status?", "limit?", "offset?"]
    output: "GasMovementTicket[]"
    side_effects: []

  - method: POST
    path: "/gas-movement-tickets/{id}/confirm"
    description: "Confirm a metered movement, moving working gas and posting the shipper's charges"
    roles: [FieldOperator]
    code: 200
    input: [expected_storage_field_version]
    output: GasMovementTicket
    side_effects:
      - "ticket_charge_breakdown computes fuel_retention_dth, net_volume_dth, commodity_charge_usd, volume_discount_usd, fuel_charge_usd and total_charge_usd; status = CONFIRMED; confirmed_at = current clock"
      - "StorageField.working_gas_inventory_dth moved by actual_volume_dth signed by direction; retained_fuel_pool_dth increased by fuel_retention_dth"
      - "StorageField inventory_pct, current_pressure_psig, deliverability_tier, both max rates and field_posture recomputed; increments StorageField.version by 1"
      - "StorageContract.inventory_balance_dth moved by net_volume_dth; imbalance_dth increased by (actual_volume_dth - nomination.confirmed_volume_dth)"
      - "a DAILY_IMBALANCE ImbalanceLedgerEntry is appended for the nomination's gas_day"
      - "curtailment sweep phase B applied when a deliverability rate fell"

  - method: POST
    path: "/gas-movement-tickets/{id}/reverse"
    description: "Reverse a confirmed movement, undoing every quantity it moved"
    roles: [FieldOperator]
    code: 200
    input: [reversal_reason]
    output: GasMovementTicket
    side_effects:
      - "status = REVERSED; reversal_reason stored"
      - "every StorageField and StorageContract quantity moved by the confirm is moved back by the identical magnitude, satisfying gas_volume_conservation"
      - "a DAILY_IMBALANCE ImbalanceLedgerEntry with the negated volume_dth is appended"
      - "StorageField rates, tier, pressure and posture recomputed; increments StorageField.version by 1"

  # ---------------- EmergencyEvent ----------------
  - method: POST
    path: "/emergency-events"
    description: "Open an emergency response record from leak detection or monitoring"
    roles: [FieldOperator, ComplianceOfficer]
    code: 201
    input: [storage_field_id, event_type, severity, detected_at, "well_id?"]
    output: EmergencyEvent
    side_effects:
      - "status = DETECTED; evacuation_radius_m = 0; responder_notes = null"

  - method: GET
    path: "/emergency-events/{id}"
    description: "Read one emergency event"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: EmergencyEvent
    side_effects: []

  - method: GET
    path: "/emergency-events"
    description: "List emergency events, optionally scoped to a field or a wellbore"
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: ["storage_field_id?", "well_id?", "status?", "severity?", "limit?", "offset?"]
    output: "EmergencyEvent[]"
    side_effects: []

  - method: POST
    path: "/emergency-events/{id}/advance"
    description: "Advance an emergency event along its response plan"
    roles: [FieldOperator, ComplianceOfficer]
    code: 200
    input: [to_status, "responder_notes?", "evacuation_radius_m?"]
    output: EmergencyEvent
    side_effects:
      - "status = to_status; responder_notes stored when supplied; contained_at / closed_at stamped at CONTAINED / CLOSED"
      - "on RESPONDING: StorageField.field_posture forced to FROZEN and curtailment sweep phase A curtails FIRM and INTERRUPTIBLE nominations alike"
      - "on EVACUATION_ORDERED: evacuation_radius_m stored, every OPEN RemediationProgram on the field's wells becomes ESCALATED, every CompressorUnit on the field becomes OUT_OF_SERVICE and its SCHEDULED runs become CANCELLED"
      - "on CONTAINED and CLOSED: StorageField.field_posture recomputed"

  # ---------------- RegulatoryReport ----------------
  - method: POST
    path: "/regulatory-reports"
    description: "Prepare an inventory-verification or integrity-program report for a period"
    roles: [ComplianceOfficer]
    code: 201
    input: [storage_field_id, report_type, period_start_date, period_end_date, measured_inventory_dth]
    output: RegulatoryReport
    side_effects:
      - "report_variance snapshots book_inventory_dth and computes variance_dth, variance_pct and open_finding_count"
      - "status = DRAFT; prepared_by_user_id = X-User-ID; submitted_by_user_id, agency_outcome and agency_response_note stay null"

  - method: POST
    path: "/regulatory-reports/{id}/submit"
    description: "Submit a prepared report to the agency; requires a second officer"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects:
      - "status = SUBMITTED; submitted_by_user_id = X-User-ID"
      - "the covered gas days become locked against GasMovementTicket reversal"

  - method: POST
    path: "/regulatory-reports/{id}/record-agency-response"
    description: "Record the agency's disposition of a submitted report"
    roles: [ComplianceOfficer]
    code: 200
    input: [agency_outcome, "agency_response_note?"]
    output: RegulatoryReport
    side_effects:
      - "status = ACCEPTED or REJECTED; agency_outcome and agency_response_note stored"
      - "on REJECTED the covered gas days are unlocked and the report may be submitted again"

  # ---------------- Test-driving endpoint ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, cutoff, MIT window, compressor window and gas-day comparison in this scaffold is evaluated against this logical clock."
    roles: [FieldOperator, IntegrityEngineer, SchedulingCoordinator, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "the logical clock jumps to to_iso8601; no entity state is mutated and no sweep runs"

# =============================== §1.6 Error Code Catalog ===============================
errors:
  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the five declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"

  # ---- schema ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required input field, wrong JSON type, unparseable ISO-8601 instant or gas_day, negative volume or horsepower, enum value outside the declared set, or period_end_date earlier than period_start_date"

  # ---- not-found family (priority 4 path ids and priority 5 body foreign keys) ----
  - id: ERR_STORAGE_FIELD_NOT_FOUND
    http: 404
    condition: "storage_field_id in the path or body does not resolve to a StorageField"
  - id: ERR_WELL_NOT_FOUND
    http: 404
    condition: "well_id in the path or body does not resolve to a Well, or resolves to a Well outside the scope the endpoint requires — on POST /gas-movement-tickets a Well whose storage_field_id differs from the nomination's contract.storage_field_id, and on POST /emergency-events a Well whose storage_field_id differs from the supplied storage_field_id"
  - id: ERR_MIT_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to a MechanicalIntegrityTest"
  - id: ERR_REMEDIATION_PROGRAM_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to a RemediationProgram"
  - id: ERR_COMPRESSOR_UNIT_NOT_FOUND
    http: 404
    condition: "compressor_unit_id in the path or body does not resolve to a CompressorUnit"
  - id: ERR_COMPRESSOR_RUN_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to a CompressorRun"
  - id: ERR_SHIPPER_NOT_FOUND
    http: 404
    condition: "shipper_id in the path or body does not resolve to a Shipper"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract_id in the path or body does not resolve to a StorageContract"
  - id: ERR_NOMINATION_NOT_FOUND
    http: 404
    condition: "nomination_id in the path or body does not resolve to a Nomination"
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to a GasMovementTicket"
  - id: ERR_EMERGENCY_EVENT_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to an EmergencyEvent"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to a RegulatoryReport"

  # ---- ownership ----
  - id: ERR_CONTRACT_NOT_OWNED
    http: 403
    condition: "A Shipper reads or writes a StorageContract, Nomination, GasMovementTicket or imbalance ledger by id whose owning contract.shipper_id differs from X-User-ID; the Shipper-visible list endpoints filter to the shipper's own rows instead of raising this"

  # ---- state ----
  - id: ERR_INVALID_TICKET_STATE
    http: 409
    condition: "The GasMovementTicket's current status is not a declared `from:` state for the requested transition, including repeat invocations of an already-applied action and any action on a terminal state"
  - id: ERR_INVALID_NOMINATION_STATE
    http: 409
    condition: "Same state gate as ERR_INVALID_TICKET_STATE, raised on a Nomination (submit, confirm, or ticket creation against a nomination that is not CONFIRMED)"
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "Same state gate as ERR_INVALID_TICKET_STATE, raised on a StorageContract (activate, cash-out or cash-out-reversal from a status that does not declare the transition)"
  - id: ERR_INVALID_MIT_STATE
    http: 409
    condition: "Same state gate as ERR_INVALID_TICKET_STATE, raised on a MechanicalIntegrityTest (recording a result on a test that is already PASSED or FAILED)"
  - id: ERR_INVALID_REMEDIATION_STATE
    http: 409
    condition: "Same state gate as ERR_INVALID_TICKET_STATE, raised on a RemediationProgram (completing a program already in COMPLETED or ESCALATED)"
  - id: ERR_INVALID_RUN_STATE
    http: 409
    condition: "Same state gate as ERR_INVALID_TICKET_STATE, raised on a CompressorRun (completing a run already COMPLETED or CANCELLED, or completing a SCHEDULED run whose CompressorUnit is OUT_OF_SERVICE)"
  - id: ERR_INVALID_EMERGENCY_STATE
    http: 409
    condition: "Same state gate as ERR_INVALID_TICKET_STATE, raised on an EmergencyEvent (an advance whose to_status is not reachable from the event's current status)"
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "Same state gate as ERR_INVALID_TICKET_STATE, raised on a RegulatoryReport (submitting a SUBMITTED or ACCEPTED report, or recording an agency response on a DRAFT report)"
  - id: ERR_INVALID_WELL_STATE
    http: 409
    condition: "Same state gate as ERR_INVALID_TICKET_STATE, raised on a Well (a service-change whose to_operational_state is not reachable, or whose transition preconditions on pending tickets, integrity state or open remediation are violated)"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the StorageContract's current version"
  - id: ERR_STALE_FIELD_VERSION
    http: 412
    condition: "expected_storage_field_version does not equal the StorageField's current version"

  # ---- business_safety ----
  - id: ERR_FIELD_FROZEN
    http: 422
    condition: "StorageField.field_posture is FROZEN, so no nomination confirmation, ticket confirmation, contract activation or compressor run scheduling is permitted on that field"
  - id: ERR_INTERRUPTIBLE_RESTRICTED
    http: 422
    condition: "StorageField.field_posture is RESTRICTED and the nomination's contract.service_class is INTERRUPTIBLE"
  - id: ERR_WELL_NOT_IN_SERVICE
    http: 422
    condition: "The Well's operational_state is not IN_SERVICE"
  - id: ERR_WELL_INTEGRITY_FAILED
    http: 422
    condition: "The Well's integrity_state is MIT_FAILED"
  - id: ERR_CUSHION_GAS_BREACH
    http: 422
    condition: "Confirming a WITHDRAWAL ticket would drive StorageField.working_gas_inventory_dth below zero, i.e. would consume cushion gas"
  - id: ERR_WORKING_GAS_CAPACITY_EXCEEDED
    http: 422
    condition: "Confirming an INJECTION ticket would drive StorageField.working_gas_inventory_dth above (total_capacity_dth - cushion_gas_dth)"
  - id: ERR_FIELD_PRESSURE_LIMIT
    http: 422
    condition: "The recomputed current_pressure_psig would exceed StorageField.max_pressure_psig, or an MIT result records a test pressure above that limit"
  - id: ERR_EVACUATION_RADIUS_INVALID
    http: 422
    condition: "An advance to EVACUATION_ORDERED omits evacuation_radius_m, supplies a value below MIN_EVACUATION_RADIUS_M (1), supplies a value above MAX_EVACUATION_RADIUS_M (8000), or is attempted on an event whose severity is MINOR"

  # ---- business_temporal ----
  - id: ERR_GAS_DAY_OUTSIDE_TERM
    http: 422
    condition: "The nomination's gas_day falls outside [contract.term_start_date, contract.term_end_date]"
  - id: ERR_NOMINATION_WINDOW_CLOSED
    http: 422
    condition: "The logical clock is at or past the nomination cutoff for the requested gas_day, i.e. 13:00Z on the day before gas_day"
  - id: ERR_SEASON_DIRECTION_MISMATCH
    http: 422
    condition: "A Nomination on an INTERRUPTIBLE contract has direction INJECTION while StorageField.season is WITHDRAWAL, or WITHDRAWAL while season is INJECTION; FIRM contracts may nominate against the season"
  - id: ERR_MIT_WINDOW_IN_PAST
    http: 422
    condition: "A mechanical integrity test window starts at or before the logical clock, or window_end is not strictly after window_start"
  - id: ERR_MIT_WINDOW_NOT_ELAPSED
    http: 409
    condition: "A result is recorded before the logical clock has reached the test's window_end"
  - id: ERR_RUN_WINDOW_IN_PAST
    http: 422
    condition: "A compressor run window starts at or before the logical clock, or window_end is not strictly after window_start"
  - id: ERR_RUN_WINDOW_NOT_ELAPSED
    http: 409
    condition: "A compressor run is completed before the logical clock has reached its window_end"

  # ---- business_constraint ----
  - id: ERR_MIT_WINDOW_CONFLICT
    http: 409
    condition: "The requested test window comes within MIT_BUFFER_HOURS (12) of another SCHEDULED MechanicalIntegrityTest on the same Well"
  - id: ERR_HORSEPOWER_OVERSUBSCRIBED
    http: 409
    condition: "The sum of allocated_horsepower across SCHEDULED and RUNNING CompressorRun rows overlapping the requested half-open window would exceed CompressorUnit.rated_horsepower"
  - id: ERR_SOD_REMEDIATION_SELF_VERIFICATION
    http: 403
    condition: "X-User-ID equals the user who opened the RemediationProgram and now attempts to complete it, or equals the RegulatoryReport's prepared_by_user_id and now attempts to submit it"
  - id: ERR_DUPLICATE_FIELD_CODE
    http: 409
    condition: "StorageField.field_code already exists (the uniqueness key is global)"
  - id: ERR_DUPLICATE_DUNS
    http: 409
    condition: "Shipper.duns_number already exists (the uniqueness key is global)"
  - id: ERR_DUPLICATE_CONTRACT_CODE
    http: 409
    condition: "StorageContract.contract_code already exists (the uniqueness key is global)"
  - id: ERR_DUPLICATE_UNIT_CODE
    http: 409
    condition: "CompressorUnit.unit_code already exists within the same storage_field_id"
  - id: ERR_DUPLICATE_REPORT_PERIOD
    http: 409
    condition: "A non-REJECTED RegulatoryReport already exists for the same (storage_field_id, report_type, period_start_date, period_end_date)"
  - id: ERR_TICKET_ALREADY_EXISTS
    http: 409
    condition: "A PENDING or CONFIRMED GasMovementTicket already exists for the nomination"
  - id: ERR_TICKET_OVERRUN_EXCEEDED
    http: 422
    condition: "actual_volume_dth exceeds round_half_up(nomination.confirmed_volume_dth * (100 + TICKET_OVERRUN_PCT) / 100, 0), i.e. overruns the confirmed schedule by more than TICKET_OVERRUN_PCT (5) percent"
  - id: ERR_NOMINATION_REVISION_LIMIT
    http: 422
    condition: "A curtailed nomination is re-submitted when revision_round has already reached MAX_REVISION_ROUNDS (2)"
  - id: ERR_REPORTING_PERIOD_LOCKED
    http: 409
    condition: "The ticket's gas_day is covered by a SUBMITTED or ACCEPTED RegulatoryReport on the same StorageField, so the movement can no longer be reversed"
  - id: ERR_REMEDIATION_ESCALATED
    http: 409
    condition: "Completion of an OPEN RemediationProgram is attempted while an EmergencyEvent on the program's StorageField has status in (RESPONDING, EVACUATION_ORDERED); completion of an already ESCALATED program returns ERR_INVALID_REMEDIATION_STATE instead"

  # ---- business_fiscal ----
  - id: ERR_CONTRACT_RIGHTS_EXCEEDED
    http: 422
    condition: "nominated_volume_dth exceeds the contract's max_daily_injection_dth or max_daily_withdrawal_dth for the requested direction"
  - id: ERR_CONTRACT_INVENTORY_INSUFFICIENT
    http: 422
    condition: "Confirming the movement would drive StorageContract.inventory_balance_dth below zero or above max_storage_quantity_dth"
  - id: ERR_SHIPPER_CREDIT_SUSPENDED
    http: 402
    condition: "Shipper.credit_status is SUSPENDED, blocking contract activation and every nomination step for that shipper"
  - id: ERR_CASH_OUT_PERIOD_SETTLED
    http: 409
    condition: "A CASH_OUT ledger entry already exists for the contract covering any gas day in the requested period and has not been reversed"
  - id: ERR_NOTHING_TO_CASH_OUT
    http: 422
    condition: "The requested cash-out period yields a billable imbalance of zero, or a reversal is requested when no CASH_OUT entry exists for the period"

  # ---- business_referential ----
  - id: ERR_REPORT_VARIANCE_EXCEEDED
    http: 422
    condition: "variance_pct exceeds MAX_REPORT_VARIANCE_PCT (0.5000) at submission; the comparison is made after rounding to 4 decimal places and the boundary is inclusive"
  - id: ERR_OPEN_INTEGRITY_FINDINGS
    http: 422
    condition: "An INTEGRITY_PROGRAM_STATUS report is submitted while open_finding_count is greater than zero"

# =============================== §1.7 RBAC Matrix ===============================
