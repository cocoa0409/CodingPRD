              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_r_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 12.50, survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
