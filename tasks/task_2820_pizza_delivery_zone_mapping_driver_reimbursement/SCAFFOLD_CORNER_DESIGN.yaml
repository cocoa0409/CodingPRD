          rationale: "That §1.8 instance asserts every hop of the GRANT cascade — address override, both held orders leaving ZONE_HELD with their own zone_hold_minutes accruals, and the store's unassigned count re-derivation."

      - name: first_clear_mvr_check_moves_the_applicant_to_pending_checks
        claim_type: valid_transition
        grounds:
          - state_machines.Driver.APPLICANT_to_PENDING_CHECKS
          - entities.Driver.fields.mvr_points_latest
          - entities.MvrCheck.fields.result
        distinguishing_aspect: "A CLEAR check with 0 points moves the driver APPLICANT -> PENDING_CHECKS, re-derives mvr_points_latest to 0 and bumps Driver.version by exactly 1, while insurance_status stays NONE so the driver is not yet qualifiable."
        test_recipe:
          setup:
            - "A store with one APPLICANT driver and no checks on file."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
