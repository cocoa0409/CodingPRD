              as: SchedulingCoordinator
              captures: { adult_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Minor Milo", date_of_birth: "2016-03-15T00:00:00Z", asa_class: 1, airway_class: 1, weight_kg: 35 }
              as: SchedulingCoordinator
