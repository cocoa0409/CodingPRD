  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_issue_rma_requires_registration_active_and_proof_validated
        grounds:
          - state_machines.Claim.INTAKE_to_RMA_ISSUED
          - state_machines.Registration.REGISTERED_to_ACTIVE
          - entities.Registration.fields.proof_status
        distinguishing_aspect: |
          A Claim transition (INTAKE -> RMA_ISSUED) is blocked while its parent Registration is still
          REGISTERED with proof_status UNVERIFIED — the Claim depends on the Registration's state
          (entity pair Claim<-Registration); rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Clock 2024-01-15. ELECTRONICS product, BASE tier cap 20000."
            - "Owner O1 has a REGISTERED registration (proof submitted but NOT yet validated, so still REGISTERED)."
            - "A MANUFACTURING claim is filed against it in INTAKE."
            - "NOTE: a claim can be filed in INTAKE on a REGISTERED registration; issue-rma is what requires ACTIVE+VALIDATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "ELX-12", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1m@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-REGD", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /claims"
              payload: { registration_id: "${reg_id}", defect_category: "MANUFACTURING", reported_date: "2024-02-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/issue-rma"
              payload: {}
              as: ClaimsProcessor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == INTAKE"

      - name: extension_cancel_requires_registration_not_terminal
        grounds:
          - state_machines.ExtendedWarranty.ACTIVE_to_CANCELLED
          - state_machines.Registration.ACTIVE_to_VOIDED
          - entities.Registration.fields.status
        distinguishing_aspect: |
          An ExtendedWarranty transition (ACTIVE -> CANCELLED) is blocked once its parent Registration
          is VOIDED — the ExtendedWarranty depends on the Registration's state (entity pair
          ExtendedWarranty<-Registration, distinct from the Claim<-Registration pair); ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Clock 2024-01-15. ELECTRONICS product. BASE cap 20000, GOLD tier extension 24 price 12000 cap 40000."
            - "Owner O1 ACTIVE validated registration with a GOLD extension; admin then VOIDs the registration (extension auto-CANCELLED is the void cascade)."
            - "To isolate the cross-entity guard, use a registration that is VOIDED while the extension was created on a SECOND still-active registration is NOT the point — here the extension shares the voided registration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "ELX-13", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "GOLD", extension_months: 24, price_cents: 12000, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
              captures: { gold_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1n@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-VOID", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_id}", coverage_tier_id: "${gold_id}", amount_paid_cents: 12000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { ew_id: $.data.id }
            - call: "POST /registrations/${reg_id}/void"
              payload: {}
              as: WarrantyAdmin
          trigger:
            - call: "POST /extended-warranties/${ew_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${o1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: extended_warranty_coverage_interval_overlap_half_open
        grounds:
          - validations[priority=14]
          - entities.ExtendedWarranty.fields.effective_date
          - state_machines.ExtendedWarranty.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Half-open interval semantics: a second ACTIVE extension whose coverage interval
          [effective, effective+extension_months) overlaps the first's is rejected with
          ERR_COVERAGE_OVERLAP; an exactly-adjacent purchase (start == prior end) would be allowed.
          Resource entity: ExtendedWarranty coverage timeline.
        test_recipe:
          setup:
            - "Clock 2024-01-15. ELECTRONICS product. BASE cap 20000. Two 12-month tiers SILVER and GOLD (each extension_months 12, price 6000, cap 40000)."
            - "Owner O1 ACTIVE validated registration. SILVER purchased at 2024-01-15 covers [2024-01-15, 2025-01-15)."
            - "Clock advanced to 2024-07-15; GOLD purchase would cover [2024-07-15, 2025-07-15), overlapping the SILVER interval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "ELX-14", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
