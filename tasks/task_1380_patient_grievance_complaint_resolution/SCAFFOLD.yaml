  - method: GET
    path: "/api/escalations"
    description: "List escalations"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "case_id?", "status?", "filed_by_id?", "adjudicated_by_id?", "escalation_type?"]
    output: "QualityRiskEscalation[]"
    side_effects: []
  - method: GET
    path: "/api/escalations/{id}"
    description: "Get an escalation"
