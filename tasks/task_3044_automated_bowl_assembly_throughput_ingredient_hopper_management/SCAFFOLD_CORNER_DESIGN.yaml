      - name: queue_estimate_excludes_equal_timestamp_order
        claim_type: boundary_edge
        grounds: ["calculations.queue_time"]
        distinguishing_aspect: "Queue estimate counts only orders with STRICTLY earlier queue_entered_at: an order queued at the same instant contributes 0 to a same-timestamp sibling's estimate; the earlier-created one sees 0 ahead, the later sees 45."
