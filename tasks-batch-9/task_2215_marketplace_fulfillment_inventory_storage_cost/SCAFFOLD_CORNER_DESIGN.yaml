          - errors[ERR_STALE_SELLER_VERSION]
          - endpoints[POST /fulfillment/inbound-shipment-plans]
        distinguishing_aspect: "The seller version is bumped by an accepted plan creation, so replaying the same expected_seller_account_version fails with 412 and — critically — the failure does not itself bump the version, letting the identical body succeed after one refetch."
