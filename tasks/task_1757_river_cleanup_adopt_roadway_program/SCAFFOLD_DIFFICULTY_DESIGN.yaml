  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_event_create
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - errors[ERR_HAZARD_UNRESOLVED]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: the request violates both
          ERR_AGREEMENT_NOT_ACTIVE (agreement SUSPENDED, priority 6) and
          ERR_HAZARD_UNRESOLVED (open hazard on the segment, priority 7); the
          state error must win.
        test_recipe:
          setup:
            - "Approved agreement, then suspended by coordinator; unresolved hazard REPORTED on the segment"
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/agreements/${ag}/suspend", payload: { reason: "audit" }, as: ProgramCoordinator }
            - { call: "POST /program/hazards", payload: { segment_id: "${s}", hazard_type: "CHEMICAL_CONTAINER", description: "rusted drum", location_note: "MP 5.1 north bank" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_AGREEMENT_NOT_ACTIVE (state priority 6 beats business_safety priority 7; NOT ERR_HAZARD_UNRESOLVED)"

      - name: temporal_beats_constraint_on_event_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_EVENT_TOO_SOON]
          - errors[ERR_EVENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_constraint (different
          pair from the other instance): the request is both inside the 14-day
          lead minimum (13 days out) and collides with an existing event's
          day-slot; ERR_EVENT_TOO_SOON (priority 8) must win over
          ERR_EVENT_WINDOW_OVERLAP (priority 9).
        test_recipe:
          setup:
            - "Approved agreement with event e_a SCHEDULED for 2026-09-10; clock advanced to 2026-08-28"
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-28T09:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 5 }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_TOO_SOON (2026-09-10 is 13 days out < 14-day lead; temporal priority 8 beats the day-slot overlap constraint at priority 9)"

