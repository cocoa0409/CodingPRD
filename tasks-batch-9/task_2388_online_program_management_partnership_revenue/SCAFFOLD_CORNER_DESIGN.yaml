            - "Partnership.${ps_id}.collected_tuition_cents == 0"

      - name: wind_down_cascade_reaches_four_levels_of_dependents
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: wind_down_chains_partnership_to_program_to_leads_and_courses_to_counselor_inactive
          rationale: "The deepest cascade chain is walked end to end by the named §1.8 instance."

      - name: recognition_variant_switch_applies_the_delta_to_the_ledger
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: recognition_variant_switch_restates_september_settlement
          rationale: "The variant switch and its ledger delta are the subject of the named §1.8 instance."

