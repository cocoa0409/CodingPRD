  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_stress_dscr_exception_auto_created
        claim_type: violation_to_error
        grounds: [calculations.dscr_computation, entities.PolicyException.fields.rule_code]
        excluded_because:
          difficulty_instance: dscr_standard_vs_stress_same_statement_diverge
          rationale: "STRESS_DSCR_MINIMUM auto-creation at dscr_stress 0.7010 < 1.0000 (and the absence of DSCR_MINIMUM at 1.2982) is asserted in the named §1.8 instance."

      - name: error_reg_o_liquidation_exception_raised
        claim_type: violation_to_error
        grounds: [calculations.eligible_collateral_value, entities.Borrower.fields.is_reg_o_insider]
        excluded_because:
          difficulty_instance: collateral_lending_vs_liquidation_basis_insider
          rationale: "The Reg O liquidation-basis COLLATERAL_COVERAGE_MIN (HIGH) creation at 1.3841 > 0.8000 is asserted in the named §1.8 instance."

      - name: error_commitment_not_accepted_without_letter
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMMITMENT_NOT_ACCEPTED]", "validations[priority=8]"]
        excluded_because:
          difficulty_instance: participation_state_error_beats_fiscal_error
          rationale: "ERR_COMMITMENT_NOT_ACCEPTED (no letter at all) is the asserted winner of the §1.8 priority-pair instance."

      - name: error_unresolved_high_exception_blocks_release
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNRESOLVED_POLICY_EXCEPTION]", "validations[priority=12]"]
        excluded_because:
          difficulty_instance: release_safety_error_beats_checklist_error
          rationale: "The OPEN-HIGH-exception release block (403) is the first asserted failure of the named §1.8 instance."

      - name: error_checklist_incomplete_at_release
        claim_type: violation_to_error
        grounds: ["errors[ERR_CHECKLIST_INCOMPLETE]", "validations[priority=25]"]
        excluded_because:
          difficulty_instance: release_safety_error_beats_checklist_error
          rationale: "The CLOSING_CONDITION gate at funding release (409) is the second asserted failure of the named §1.8 instance."

      - name: error_appraiser_window_conflict_on_adjacency
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPRAISER_WINDOW_CONFLICT]", "validations[priority=19]"]
        excluded_because:
          difficulty_instance: appraiser_closed_interval_adjacency_conflict
          rationale: "Closed-interval adjacency conflict (end == start) is the asserted trigger of the named §1.8 instance."

      - name: error_session_conflict_on_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMMITTEE_SESSION_CONFLICT]", "validations[priority=20]"]
        excluded_because:
          difficulty_instance: committee_session_half_open_back_to_back_allowed
          rationale: "The interior-overlap 409 and both back-to-back admissions are asserted in the named §1.8 instance."

      - name: error_session_not_open_after_window
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMMITTEE_SESSION_NOT_OPEN]", "validations[priority=28]"]
        excluded_because:
          difficulty_instance: vote_blocked_by_session_window_state
          rationale: "Vote rejection after the session adjourns is the asserted trigger of the named §1.8 instance."

      - name: error_borrower_not_active_blocks_application
        claim_type: violation_to_error
        grounds: ["errors[ERR_BORROWER_NOT_ACTIVE]", "validations[priority=13]"]
        excluded_because:
          difficulty_instance: application_creation_blocked_by_borrower_status
          rationale: "Application creation against an EXITED borrower is the asserted trigger of the named §1.8 instance."

