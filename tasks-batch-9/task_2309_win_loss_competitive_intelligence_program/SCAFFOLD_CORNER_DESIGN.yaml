  # ---------------------------------------------------------------------------
  # SECTION: consistency_model (guide "From Consistency Model"; declared model: immediate)
  # Every derived field must be correct in the SAME response that caused it to change — no
  # read-your-writes lag and no deferred recompute. The triage endpoint is the sharpest test
  # because its own declared ordering requires the re-score to land BEFORE the band gate is
  # evaluated, so a deferred recompute changes the outcome and not merely the timing.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:

      - name: triage_response_already_carries_the_rescored_impact_and_band
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /product-gaps/{gap_id}/triage
          - calculations.product_gap_impact_score
          - state_machines.ProductGap.NEW_to_ACCEPTED
        distinguishing_aspect: "The gap starts with one ratified deal (300000.00 -> impact 36.40, band P2). The triage call adds a second deal's PRODUCT_GAP verbatim in the SAME request, so the response body itself must already read linked_deal_count 2, affected_acr_usd 500000.00, impact_score 62.40 and band P1 — and the ACCEPT must be judged against the NEW band. Nothing may be left for a later read to fix: an implementation that recomputes on the next GET returns a stale 36.40/P2 body, and one that gates on the pre-triage band would mis-handle any evidence addition that crosses the P3 line."
