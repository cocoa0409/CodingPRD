            - "ir1_rate == 10000"
            - "ir1_countable == 114000"
            - "ir2_rate == 8000"
            - "ir2_countable == 40000"
            - "ir1_status1 == VERIFIED"
            - "ir1_by == bom-1"
            - "the second decision on the VERIFIED record returns HTTP 409"
            - "ir1_err == ERR_INCOME_RECORD_STATE_INVALID"
            - "ir2_status1 == REJECTED"
            - "the second decision on the REJECTED record returns HTTP 409"
            - "ir2_err == ERR_INCOME_RECORD_STATE_INVALID"
            - "ir_total == 2"
            - "ir_verified_total == 1"
            - "ir_verified_id == ${ir1_id}"
            - "ir_verified_by == bom-1"

      - name: err_transaction_already_reversed_outranks_segregation_of_duties
