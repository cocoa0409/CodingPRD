            - *k_played
            - *k_grade
            - *k_post_grade
            - *k_appeal
          trigger:
            - call: "GET /play-grades/${pg_id}"
              payload: {}
              as: GradingSupervisor
              captures: { sod_grader: $.data.graded_by_user_id }
            - call: "POST /grade-appeals/${ap_id}/start-review"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { sod_err_review: $.data.error_id }
            - call: "POST /grade-appeals/${ap_id}/start-review"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-review-2"
              captures: { sod_status_review: $.data.status }
            - call: "POST /grade-appeals/${ap_id}/decide"
              payload: { outcome: "UPHELD", decision_note: "self-review attempt" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { sod_err_decide: $.data.error_id }
            - call: "POST /grade-appeals/${ap_id}/decide"
              payload: { outcome: "UPHELD", decision_note: "the call stands on tape" }
              as: GradingSupervisor
              as_user_id: "sup-review-2"
              captures: { sod_status_decided: $.data.status, sod_decider: $.data.decided_by_user_id }
            - call: "GET /play-grades/${pg_id}"
              payload: {}
