scaffold_difficulty_design:

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 1 — Dual-variant calculations across different entity domains
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: dual_variant_calc
    instances:
      - name: escrow_projection_provisional_vs_finalized
        grounds:
          - calculations.escrow_annual_projection
          - state_machines.EscrowAnalysis.PROVISIONAL_to_FINALIZED
          - entities.EscrowAnalysis.fields.new_monthly_escrow_cents
          - entities.Loan.fields.monthly_escrow_payment_cents
        distinguishing_aspect: |
          The same `escrow_annual_projection` calculation produces a PROVISIONAL value at
          POST /escrow-analyses (never writes Loan.monthly_escrow_payment_cents) and a
          re-computed FINALIZED value at /finalize commit that DOES write it. If a
          Disbursement is added between PROVISIONAL and /finalize, the two outputs diverge.
          Entity domain: EscrowAnalysis (computation snapshot).
        test_recipe:
          setup:
            - "Create Borrower B."
            - "POST /loans for B with original_principal=20000000, original_appraised=25000000, rate=625, term=360, pmi_monthly_cents=0 (PMI inactive)."
            - "POST /loans/{L}/disbursements: type=PROPERTY_TAX, scheduled_date=now+90d, amount_cents=480000."
          trigger:
            - "POST /loans/{L}/escrow-analyses analysis_date=now, starting_balance_cents=0 → A1 (PROVISIONAL)."
            - "Inspect A1.new_monthly_escrow_cents."
            - "POST /loans/{L}/disbursements: type=HAZARD_INSURANCE, scheduled_date=now+180d, amount_cents=120000."
            - "POST /loans/{L}/escrow-analyses/{A1}/finalize."
          assert:
            - "A1.new_monthly_escrow_cents AT PROVISIONAL == 80000  (= ceil((480000 + max(0, ceil(480000/12)*2 - 0))/12) = ceil((480000+80000)/12))."
            - "After /finalize: A1.new_monthly_escrow_cents == 100000 (recomputed including the new HAZARD_INSURANCE; = ceil((600000 + 100000)/12))."
            - "After /finalize: Loan.monthly_escrow_payment_cents == 100000."
            - "Loan.monthly_escrow_payment_cents was NOT mutated by the PROVISIONAL creation (= 0 before /finalize)."

      - name: payment_waterfall_standard_vs_reinstatement
        grounds:
          - calculations.payment_waterfall_allocation
          - calculations.payment_waterfall_allocation.variants[0].name
          - calculations.payment_waterfall_allocation.variants[1].name
          - state_machines.Payment.None_to_POSTED
          - state_machines.ForeclosureCase.NOI_ISSUED_to_CLOSED_REINSTATED
          - entities.Payment.fields.allocation_principal_cents
          - entities.Payment.fields.allocation_late_fee_cents
        distinguishing_aspect: |
          A $612,576 payment on a delinquent loan WITHOUT an open ForeclosureCase posts
          via `standard_waterfall` (late_fee → interest → principal → escrow → suspense)
          and leaves the loan still delinquent on later installments. The SAME amount on
          a loan WITH an open ForeclosureCase whose reinstatement_quote_cents == 612576
          posts via `foreclosure_reinstatement_waterfall` (adds foreclosure_costs_cents
          FIRST in the order, settles all arrears at once, and closes the case).
          Entity domain: Payment (allocation algorithm), distinct from EscrowAnalysis above.
        test_recipe:
          setup:
            - "Create two loans L1, L2 each: P=20000000, rate=625, term=360, scheduled_payment_cents=123144 (computed)."
            - "Advance clock so each is 120 days delinquent (4 past-due installments, late_fees=20000 cents)."
            - "On L2 only: POST /foreclosure-cases for L2 with foreclosure_costs_cents=100000 → reinstatement_quote_cents=612576."
          trigger:
            - "POST /loans/{L1}/payments amount_cents=612576."
            - "POST /foreclosure-cases/{F2}/reinstate payment_amount_cents=612576."
          assert:
            - "L1.posture == DELINQUENT or CURRENT but L1 ForeclosureCase does not exist; allocation order on Payment(L1) is late_fee → interest → principal → escrow → suspense; suspense may be > 0."
            - "F2.status == CLOSED_REINSTATED."
            - "L2.posture == REINSTATED."
            - "Payment(L2).allocation_late_fee_cents + allocation_principal_cents + allocation_interest_cents + allocation_escrow_cents + allocation_suspense_cents == 612576 - 100000 (the 100000 cents go to foreclosure_costs_cents settlement, NOT to the per-installment allocations)."
            - "L2.delinquency_days == 0 after the reinstatement payment; L1.delinquency_days > 0."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 2 — Combinatorial formulas across different modes
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: combinatorial_formula
    instances:
      - name: hamp_three_input_tiered_modification
        grounds:
          - calculations.hamp_modified_payment
          - state_machines.MediationCase.OPEN_to_OFFER_EXTENDED
          - entities.MediationCase.fields.offered_new_rate_bps
          - entities.MediationCase.fields.offered_term_extension_months
          - entities.MediationCase.fields.offered_principal_forbearance_cents
          - entities.MediationCase.fields.target_payment_cents
        distinguishing_aspect: |
          Mode (a): a formula with ≥3 inputs and non-linear interaction. `hamp_modified_payment`
          combines three offer inputs (rate_bps, term_extension, principal_forbearance) in a
          non-linear amortization formula whose output is gated by TWO further conditional
          branches (ERR_HAMP_NOT_A_REDUCTION, ERR_HAMP_AFFORDABILITY_FLOOR). The output is
          NOT a monotone function of any single input held with the others fixed because the
          floor check can flip an arithmetically-lower target into an error.
        test_recipe:
          setup:
            - "Borrower B with hardship_attested_at set."
            - "Loan L: P=20000000, rate=625, term=360, scheduled_payment_cents=123144."
            - "Advance clock 120d → posture=DEFAULT."
            - "POST /foreclosure-cases for L → F. POST /foreclosure-cases/{F}/mediation-cases → M."
            - "POST /mediation-cases/{M}/open."
          trigger:
            - "POST /mediation-cases/{M}/extend-offer with offered_new_rate_bps=400, offered_term_extension_months=60, offered_principal_forbearance_cents=1000000."
          assert:
            - "M.target_payment_cents == 84128 (computed: P_rem=19000000, r=400/120000, n=420; ceil(19000000 * r * (1+r)^420 / ((1+r)^420 - 1)) == 84128)."
            - "M.status == OFFER_EXTENDED."
            - "Holding rate=400 and forbearance=1000000 fixed, an offer with term_extension=0 (n=348) would compute to a HIGHER target (> 84128) — proving non-linear interaction across the three inputs."

      - name: escrow_nested_rounding_order_pinned
        grounds:
          - calculations.escrow_annual_projection
          - entities.EscrowAnalysis.fields.required_cushion_cents
          - entities.EscrowAnalysis.fields.new_monthly_escrow_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. The formula pins TWO independent
          `ceil()` operations: one inside required_cushion (ceil(projected/12)*2) and one
          inside new_monthly_escrow (ceil((projected+shortage)/12)). Computing
          (ceil(projected/12)*2) vs (ceil(projected*2/12)) gives different results for
          projected=696000 → 116000 vs 116000 (equal here), but for projected=695999 →
          116000 vs 115999. The scaffold pins "ceil first, then ×2", and pins the SAME
          rounding into new_monthly_escrow's denominator before adding shortage.
        test_recipe:
          setup:
            - "Loan L: P=20000000, rate=625, term=360, pmi_monthly_cents=8000 (PMI active)."
            - "POST 4 Disbursements type=PROPERTY_TAX, each 120000 cents, scheduled_date=now+90,180,270,360d → 480000 total."
            - "POST 1 Disbursement type=HAZARD_INSURANCE, 120000 cents, scheduled_date=now+200d."
            - "POST /loans/{L}/escrow-analyses analysis_date=now, starting_balance_cents=0 → A1."
            - "POST /loans/{L}/escrow-analyses/{A1}/finalize."
          trigger:
            - "GET /loans/{L}/escrow-analyses/{A1}."
          assert:
            - "A1.projected_disbursements_cents == 696000  (480000 + 120000 + 8000*12)."
            - "A1.required_cushion_cents == 116000  (= ceil(696000/12) * 2 = 58000 * 2; NOT ceil(696000*2/12) which is also 116000 here, but the formula commits to 'ceil first, then ×2')."
            - "A1.shortage_cents == 116000."
            - "A1.new_monthly_escrow_cents == 67667  (= ceil((696000 + 116000) / 12) = ceil(67666.67))."

      - name: payment_waterfall_evaluation_order_pinned
        grounds:
          - calculations.payment_waterfall_allocation
          - entities.Payment.fields.allocation_late_fee_cents
          - entities.Payment.fields.allocation_interest_cents
          - entities.Payment.fields.allocation_principal_cents
          - entities.Payment.fields.allocation_escrow_cents
          - entities.Payment.fields.allocation_suspense_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency whose evaluation order must be explicit.
          Late fees on the loan accrue with delinquency_days; delinquency_days is reset by
          payment posting which advances next_due_date; but the late_fees DUE at the moment
          of allocation are read BEFORE allocation (per the formula's step 1). The scaffold
          pins the order: read late_fee_due as snapshot at request commit, then allocate;
          do not re-evaluate late_fee_due after partial principal application within the
          same request. Without this pinning, a partial payment could circularly reduce its
          own late-fee charge.
        test_recipe:
          setup:
            - "Loan L: scheduled_payment_cents=123144, escrow=0, posture=CURRENT."
            - "Advance clock so delinquency_days==35 (one full late-fee period; late_fees=5000)."
          trigger:
            - "POST /loans/{L}/payments amount_cents=30000."
          assert:
            - "Payment.allocation_late_fee_cents == 5000."
            - "Payment.allocation_interest_cents == 25000  (remaining 25000 ≤ interest_due 104166)."
            - "Payment.allocation_principal_cents == 0."
            - "Payment.allocation_escrow_cents == 0."
            - "Payment.allocation_suspense_cents == 0."
            - "Loan.next_due_date UNCHANGED (installment not fully satisfied)."
            - "delinquency_days is recomputed AFTER allocation but the late_fee snapshot used in this Payment is the 5000 read at the START of the request, not a re-derived value."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 3 — Non-linear state-machine shape on different entities
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: non_linear_state_machine
    instances:
      - name: mediation_cyclic_extend_reject_revise
        grounds:
          - state_machines.MediationCase
          - state_machines.MediationCase.OFFER_EXTENDED_to_OFFER_REJECTED
          - state_machines.MediationCase.OFFER_REJECTED_to_OFFER_EXTENDED
        distinguishing_aspect: |
          MediationCase exhibits a cyclic shape: OFFER_EXTENDED → OFFER_REJECTED →
          OFFER_EXTENDED (revised). This is a true revision loop, not a linear pipeline:
          the same record may pass through OFFER_EXTENDED multiple times with different
          target_payment_cents, until either OFFER_ACCEPTED (forward) or FAILED
          (rejection_reason==BORROWER_REFUSED). Entity: MediationCase.
        test_recipe:
          setup:
            - "Create B (with hardship), L (defaulted), F (foreclosure case), M (mediation in OPEN)."
          trigger:
            - "POST /mediation-cases/{M}/extend-offer #1 (new_rate=400, term_ext=60, forb=1000000) → target=84128, status=OFFER_EXTENDED."
            - "POST /mediation-cases/{M}/reject-offer rejection_reason=DTI_TOO_HIGH → OFFER_REJECTED."
            - "POST /mediation-cases/{M}/extend-offer #2 (new_rate=300, term_ext=60, forb=1500000) → new target, status=OFFER_EXTENDED again."
          assert:
            - "M.status traverses OPEN → OFFER_EXTENDED → OFFER_REJECTED → OFFER_EXTENDED (visiting OFFER_EXTENDED twice with different target_payment_cents)."
            - "M.target_payment_cents after #2 < M.target_payment_cents after #1 (lower rate + larger forbearance → lower target)."

      - name: forbearance_branching_completed_or_breached
        grounds:
          - state_machines.ForbearancePlan
          - state_machines.ForbearancePlan.ACTIVE_to_COMPLETED
          - state_machines.ForbearancePlan.ACTIVE_to_BREACHED
        distinguishing_aspect: |
          ForbearancePlan branches at end_date: from ACTIVE it can transition to COMPLETED
          (DEFERRAL path, or cure_balance_cents settled) OR BREACHED (cure_balance_cents > 0
          and now ≥ end_date + 30d). The two branches have DIVERGENT side-effect sets on
          Loan: COMPLETED → Loan.posture := CURRENT (and DEFERRAL adds total_paused_cents to
          principal_balance_cents), while BREACHED → Loan.posture := DEFAULT. Entity:
          ForbearancePlan (different entity from MediationCase above).
        test_recipe:
          setup:
            - "Create B with hardship; L (CURRENT)."
            - "POST /loans/{L}/forbearance-plans months=3, repayment_method=DEFERRAL → FP1 ACTIVE."
            - "Clone scenario: L', FP' (months=3, repayment_method=LUMP_SUM)."
          trigger:
            - "Advance clock 95 days, then POST /_sweep/run."
          assert:
            - "FP1.status == COMPLETED (DEFERRAL path; cure_balance_cents == 0 at end_date)."
            - "L.posture == CURRENT after sweep."
            - "L.principal_balance_cents has increased by FP1.total_paused_cents."
            - "FP'.status == BREACHED (LUMP_SUM unpaid 30 days past end_date)."
            - "L'.posture == DEFAULT after sweep."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 4 — Transitive cascade chains from different triggers
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: transitive_cascade
    instances:
      - name: payment_to_loan_posture_to_pmi_eligibility   # depth ≥ 3
        grounds:
          - state_machines.Payment.None_to_POSTED
          - state_machines.Loan.DELINQUENT_to_CURRENT
          - state_machines.PmiRemovalRequest.PENDING_to_APPROVED
          - calculations.payment_waterfall_allocation
          - calculations.pmi_ltv_evaluation
        distinguishing_aspect: |
          Depth-3 chain originating at POST /payments: (A) payment posting allocates and
          advances next_due_date (mutates Loan.principal_balance_cents, next_due_date,
          delinquency_days) → (B) the mutation on Loan triggers posture recomputation
          DELINQUENT→CURRENT (mutates Loan.posture) → (C) Loan.posture==CURRENT is itself
          a precondition that flips a previously-blocked PmiRemovalRequest from "blocked
          by ERR_PMI_HISTORY_INSUFFICIENT(LOAN_NOT_CURRENT)" to approvable. Each hop is
          caused by the previous hop's mutation, not by the original POST.
        test_recipe:
          setup:
            - "Loan L: P=19500000, original_appraised=25000000, rate=625, term=360, pmi_monthly_cents=8000, pmi_status=ACTIVE; no late history."
            - "Advance clock so delinquency_days==15 (posture==DELINQUENT)."
            - "POST /loans/{L}/pmi-removal-requests trigger=BORROWER_REQUEST, current_appraised_value_cents=25000000 → PR PENDING."
            - "Verify: POST /loans/{L}/pmi-removal-requests/{PR}/approve fails with ERR_PMI_HISTORY_INSUFFICIENT (LOAN_NOT_CURRENT)."
          trigger:
            - "POST /loans/{L}/payments amount_cents = (whatever satisfies the one missed installment exactly, e.g. 123144 + late_fees)."
            - "POST /loans/{L}/pmi-removal-requests/{PR}/approve."
          assert:
            - "Hop 1: Payment.status == POSTED; Loan.next_due_date advanced by exactly one month."
            - "Hop 2 (caused by hop 1): Loan.posture transitioned DELINQUENT → CURRENT (Loan.updated_at refreshed by the cascade, not by the request body)."
            - "Hop 3 (caused by hop 2): /approve now succeeds; PR.decision == APPROVED; Loan.pmi_status == REMOVED; Loan.pmi_monthly_cents == 0."

      - name: escrow_finalize_to_disbursement_to_loan_pmi_drop   # depth ≥ 2
        grounds:
          - state_machines.EscrowAnalysis.PROVISIONAL_to_FINALIZED
          - calculations.escrow_annual_projection
          - state_machines.Disbursement.SCHEDULED_to_PAID
          - entities.Loan.fields.monthly_escrow_payment_cents
        distinguishing_aspect: |
          Different originating trigger: POST /escrow-analyses/{id}/finalize. Depth-2
          chain: (A) /finalize sets Loan.monthly_escrow_payment_cents := new value AND
          creates a SURPLUS_REFUND Disbursement when surplus > 5000 → (B) that NEW
          Disbursement, when its scheduled_date arrives via /_clock/advance, transitions
          SCHEDULED→PAID and debits Loan.escrow_balance_cents. The PAID transition is
          caused by the disbursement created in hop (A), not by the original /finalize.
        test_recipe:
          setup:
            - "Loan L; starting_balance_cents will be set to 1000000 (= $10000)."
            - "POST /loans/{L}/disbursements: type=PROPERTY_TAX, scheduled_date=now+90d, amount=120000."
            - "Manually credit escrow to starting_balance_cents=1000000 via posting a payment with that escrow allocation, OR (preferred) POST /loans/{L}/escrow-analyses with starting_balance_cents=1000000 if it matches Loan.escrow_balance_cents — the scenario assumes Loan.escrow_balance_cents has reached 1000000 via prior payments."
            - "POST /loans/{L}/escrow-analyses analysis_date=now, starting_balance_cents=1000000 → A1 PROVISIONAL."
          trigger:
            - "POST /loans/{L}/escrow-analyses/{A1}/finalize."
            - "POST /_clock/advance days=31."
          assert:
            - "Hop 1: A1.surplus_cents > 5000 (projected=120000, required_cushion=20000; 1000000 - (20000+120000) = 860000); a Disbursement D_refund was created with type=SURPLUS_REFUND, amount_cents == A1.surplus_cents, status==SCHEDULED, scheduled_date == finalize_at + 30d."
            - "Hop 2 (caused by hop 1): After /_clock/advance, D_refund.status == PAID; Loan.escrow_balance_cents decremented by A1.surplus_cents."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_file_foreclosure
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair: state (priority 8) vs business_safety (priority 10). On
          POST /foreclosure-cases/{id}/file when the case is NOT in NOI_ISSUED (e.g.,
          already FILED) AND noi_sent_at is < 30 days old, BOTH checks would fail.
          Priority dictates ERR_INVALID_STATE wins over ERR_NOI_WINDOW_NOT_ELAPSED.
        test_recipe:
          setup:
            - "Create L (DEFAULT), F (NOI_ISSUED with noi_sent_at=now-5d)."
            - "Advance clock 30 days, then POST /foreclosure-cases/{F}/file → F.status == FILED."
            - "Advance clock backwards is not allowed; instead create a fresh F2 with noi_sent_at=now-5d that was already pushed to FILED via /file after a clock-forward then clock-back is not supported. Use scenario: F was filed legitimately, now in FILED."
          trigger:
            - "POST /foreclosure-cases/{F}/file (again) → BOTH conditions fail: F.status != NOI_ISSUED (state check at priority 8), AND if hypothetically interpreted on noi_sent_at, the safety check at priority 10."
          assert:
            - "Response error_id == ERR_INVALID_STATE (priority 8 wins over priority 10)."
            - "http_status == 409."

      - name: business_referential_vs_business_safety_on_mediation_request
        grounds:
          - validations[priority=12]
          - validations[priority=16]
        distinguishing_aspect: |
          Error-category pair: business_referential (priority 16, ERR_MEDIATION_ALREADY_OPEN)
          vs business_safety (priority 12, ERR_MEDIATION_WINDOW_CLOSED). Different pair
          from the previous instance. POST /foreclosure-cases/{F}/mediation-cases when
          the case already has an active MediationCase AND now - noi_sent_at > 30d. Lower
          priority number wins: ERR_MEDIATION_WINDOW_CLOSED (12) beats
          ERR_MEDIATION_ALREADY_OPEN (16).
        test_recipe:
          setup:
            - "Create B (with hardship), L (DEFAULT), F (NOI_ISSUED, noi_sent_at=now)."
            - "POST /foreclosure-cases/{F}/mediation-cases → M1 (REQUESTED)."
            - "POST /mediation-cases/{M1}/open → OPEN (still active)."
            - "Advance clock 31 days (NOI window now CLOSED)."
          trigger:
            - "POST /foreclosure-cases/{F}/mediation-cases (second request) → BOTH conditions fail."
          assert:
            - "Response error_id == ERR_MEDIATION_WINDOW_CLOSED (priority 12 wins)."
            - "http_status == 422."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: boundary_precision_check
    instances:
      - name: pmi_ltv_threshold_exactly_8000_bps
        grounds:
          - calculations.pmi_ltv_evaluation
          - validations[priority=17]
        distinguishing_aspect: |
          Numeric threshold metric: evaluated_ltv_bps. The eligibility check is
          `evaluated_ltv_bps <= 8000` for BORROWER_REQUEST (inclusive `<=`). At exactly
          8000 (80.00%) the request is APPROVED; at 8001 the request is DENIED with
          ERR_PMI_LTV_TOO_HIGH. Endpoint: POST /pmi-removal-requests/{id}/approve.
        test_recipe:
          setup:
            - "Loan L1: original_appraised=25000000, principal_balance after payoff arrangements = 20000000, pmi_status=ACTIVE, posture==CURRENT, no late history."
            - "Loan L2: identical but principal_balance = 20002500 → LTV = floor(20002500*10000/25000000) = floor(8001) = 8001."
            - "POST /loans/{L1}/pmi-removal-requests trigger=BORROWER_REQUEST current_appraised_value_cents=25000000 → PR1."
            - "POST /loans/{L2}/pmi-removal-requests trigger=BORROWER_REQUEST current_appraised_value_cents=25000000 → PR2."
          trigger:
            - "POST /loans/{L1}/pmi-removal-requests/{PR1}/approve."
            - "POST /loans/{L2}/pmi-removal-requests/{PR2}/approve."
          assert:
            - "PR1.evaluated_ltv_bps == 8000 → /approve succeeds: PR1.decision == APPROVED, L1.pmi_status == REMOVED."
            - "PR2.evaluated_ltv_bps == 8001 → /approve fails with error_id == ERR_PMI_LTV_TOO_HIGH, http_status 422; PR2.decision remains PENDING."

      - name: forbearance_breach_exactly_30_days_after_end_date
        grounds:
          - state_machines.ForbearancePlan.ACTIVE_to_BREACHED
          - calculations.forbearance_cure_balance
          - entities.ForbearancePlan.fields.status
        distinguishing_aspect: |
          Empty-collection / temporal-boundary metric distinct from PMI: zero remaining
          grace at exactly 30 days past end_date. The check is `now() - end_date >= 30`
          (inclusive `>=`). At 29 days, ACTIVE remains; at exactly 30 days, transitions
          to BREACHED. Reached through a different endpoint (POST /_clock/advance + sweep)
          on a different entity (ForbearancePlan).
        test_recipe:
          setup:
            - "Two cloned scenarios A and B: each with Loan, ForbearancePlan repayment_method=LUMP_SUM, months=3, end_date=now+90d, cure_balance_cents will be > 0 at end_date."
          trigger:
            - "(A) Advance clock 90 + 29 = 119 days, run /_sweep/run."
            - "(B) Advance clock 90 + 30 = 120 days, run /_sweep/run."
          assert:
            - "ForbearancePlan(A).status == ACTIVE  (29 days < 30 grace; no breach yet)."
            - "Loan(A).posture == FORBEARANCE."
            - "ForbearancePlan(B).status == BREACHED  (exactly 30 days hits the inclusive boundary)."
            - "Loan(B).posture == DEFAULT after sweep."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: cross_entity_state_dependency
    instances:
      - name: loan_posture_depends_on_forbearance_plan_status
        grounds:
          - state_machines.Loan.DELINQUENT_to_FORBEARANCE
          - state_machines.Loan.FORBEARANCE_to_DEFAULT
          - state_machines.ForbearancePlan
          - entities.ForbearancePlan.fields.status
          - entities.Loan.fields.posture
        distinguishing_aspect: |
          Entity pair: Loan ↔ ForbearancePlan. Loan's valid posture transitions depend on
          ForbearancePlan.status: Loan can transition CURRENT/DELINQUENT → FORBEARANCE
          only if no other ACTIVE plan exists; can transition FORBEARANCE → CURRENT only
          when the plan is COMPLETED; transitions FORBEARANCE → DEFAULT only when the
          plan is BREACHED. Likewise CURRENT → DELINQUENT requires no ACTIVE plan.
        test_recipe:
          setup:
            - "Create B with hardship, L1 (CURRENT, delinquency_days==0)."
            - "POST /loans/{L1}/forbearance-plans → FP1 ACTIVE. L1.posture := FORBEARANCE."
            - "Create L2 (CURRENT)."
          trigger:
            - "Attempt POST /loans/{L1}/forbearance-plans again (second plan) → expect ERR_FORBEARANCE_PLAN_EXISTS."
            - "Advance clock so L2.delinquency_days == 5; POST /_sweep/run."
            - "Advance clock so L1's plan reaches end_date+30d with cure_balance > 0; POST /_sweep/run."
          assert:
            - "Second plan on L1 rejected with ERR_FORBEARANCE_PLAN_EXISTS (Loan transition gated by sibling ForbearancePlan.status==ACTIVE)."
            - "L2.posture transitions CURRENT → DELINQUENT (no ACTIVE plan exists on L2)."
            - "L1 transitions FORBEARANCE → DEFAULT (caused by FP1.status flipping to BREACHED, not by clock alone)."

      - name: foreclosure_status_depends_on_mediation_status
        grounds:
          - state_machines.ForeclosureCase.NOI_ISSUED_to_FILED
          - state_machines.ForeclosureCase.MEDIATION_OPEN_to_FILED
          - state_machines.ForeclosureCase.MEDIATION_OPEN_to_CLOSED_MODIFIED
          - state_machines.MediationCase
          - entities.MediationCase.fields.status
        distinguishing_aspect: |
          Different entity pair: ForeclosureCase ↔ MediationCase. ForeclosureCase's valid
          transitions depend on MediationCase.status: cannot transition NOI_ISSUED → FILED
          if an OPEN/REQUESTED MediationCase exists; transitions MEDIATION_OPEN → FILED
          (cascade) only when MediationCase becomes FAILED or OFFER_REJECTED;
          MEDIATION_OPEN → CLOSED_MODIFIED only when MediationCase becomes COMPLETED.
        test_recipe:
          setup:
            - "B (hardship), L (DEFAULT), F (NOI_ISSUED, noi_sent_at=now)."
            - "POST /foreclosure-cases/{F}/mediation-cases → M REQUESTED. POST /mediation-cases/{M}/open → OPEN."
            - "Advance clock 31 days."
          trigger:
            - "POST /foreclosure-cases/{F}/file → expect ERR_INVALID_STATE OR a precondition rejection because MediationCase is OPEN (active)."
            - "POST /mediation-cases/{M}/extend-offer → POST /accept-offer → POST /complete."
          assert:
            - "First /file attempt fails: error_id == ERR_INVALID_STATE (state precondition: no active MediationCase allowed for NOI_ISSUED → FILED)."
            - "After M.status == COMPLETED, the cascade auto-transitions F.status to CLOSED_MODIFIED (NOT FILED), demonstrating ForeclosureCase's transition is determined by MediationCase's terminal state."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: resource_temporal_overlap
    instances:
      - name: forbearance_plan_overlap_strict_exclusion
        grounds:
          - validations[priority=14]
          - state_machines.ForbearancePlan
          - entities.ForbearancePlan.fields.start_date
          - entities.ForbearancePlan.fields.end_date
        distinguishing_aspect: |
          Resource: Loan (occupied by at most one ACTIVE ForbearancePlan). Interval semantics:
          STRICT EXCLUSION — at-most-one ACTIVE plan regardless of the requested interval's
          start/end. Even a NON-overlapping future interval is rejected as long as the
          existing plan is ACTIVE. This is "set-membership exclusion" geometry, not
          adjacency arithmetic.
        test_recipe:
          setup:
            - "B (hardship), L1 (CURRENT). POST /loans/{L1}/forbearance-plans start_date=now, months=3 → FP1 ACTIVE."
          trigger:
            - "POST /loans/{L1}/forbearance-plans start_date=now+180d, months=3 (non-overlapping interval, FP1.end_date is now+90d)."
          assert:
            - "Second plan rejected with error_id == ERR_FORBEARANCE_PLAN_EXISTS, http_status == 409 — even though [now+180d, now+270d) does NOT overlap with [now, now+90d)."
            - "Cancel FP1 (POST /loans/{L1}/forbearance-plans/{FP1}/cancel), then re-issue the second plan → succeeds (membership exclusion lifted)."

      - name: foreclosure_auction_buffer_with_reinstatement_cutoff
        grounds:
          - validations[priority=11]
          - validations[priority=23]
          - state_machines.ForeclosureCase.FILED_to_AUCTION_SCHEDULED
          - state_machines.ForeclosureCase.AUCTION_SCHEDULED_to_CLOSED_REINSTATED
          - entities.ForeclosureCase.fields.auction_date
        distinguishing_aspect: |
          Resource: ForeclosureCase.auction_date (a single scheduled point). Different
          interval semantics from the forbearance instance: ADJACENCY-WITH-BUFFER.
          auction_date must be `>= now() + 30d` at scheduling (forward buffer); and
          reinstatement is rejected within `auction_date - 5d` (backward buffer). The
          conflict tests aggregate-capacity-style geometry on a point: two buffers
          (30d forward, 5d backward) carve out forbidden zones around auction_date.
          A reinstatement request inside the 5-day backward buffer collides with the
          auction "interval" even though no other entity occupies that exact moment.
        test_recipe:
          setup:
            - "B (hardship), L (DEFAULT), F (FILED) with filed_at = now - 60d so /schedule-auction is allowed."
          trigger:
            - "POST /foreclosure-cases/{F}/schedule-auction with auction_date=now+25d → expect ERR_AUCTION_NOTICE_VIOLATION (forward buffer < 30d)."
            - "POST /foreclosure-cases/{F}/schedule-auction with auction_date=now+30d → succeeds; F.status=AUCTION_SCHEDULED."
            - "Advance clock to now+26d (now = auction_date - 4d, inside backward buffer)."
            - "POST /foreclosure-cases/{F}/reinstate payment_amount_cents=(quote)."
          assert:
            - "Forward-buffer attempt: error_id == ERR_AUCTION_NOTICE_VIOLATION, http_status 422."
            - "Successful schedule: F.auction_date == now+30d (the strict-equal boundary is INCLUSIVE)."
            - "Reinstatement inside the 5-day cutoff: error_id == ERR_REINSTATEMENT_CUTOFF, http_status 422."
            - "At now = auction_date - 5d exactly, reinstatement still allowed (cutoff is `now < auction_date - 5d` so `==` permits)."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: compensating_invariant
    instances:
      - name: payment_reversal_principal_conservation
        grounds:
          - state_machines.Payment.None_to_POSTED
          - state_machines.Payment.POSTED_to_REVERSED
          - entities.Loan.fields.principal_balance_cents
          - entities.Payment.fields.allocation_principal_cents
        distinguishing_aspect: |
          Conserved quantity: Loan.principal_balance_cents + Σ_{p in POSTED Payments on L}
          p.allocation_principal_cents == Loan.original_principal_cents (in the absence of
          modifications). POST /payments and POST /payments/{id}/reverse are compensating:
          post debits principal_balance by X and credits Payment.allocation_principal_cents
          by X; reverse credits principal_balance back by X and effectively removes the
          payment from the POSTED set. Invariant must hold to the cent at both ends.
        test_recipe:
          setup:
            - "Loan L: original_principal_cents=20000000, scheduled_payment=123144, posture=CURRENT."
            - "Snapshot: Loan.principal_balance_cents == 20000000; sum of allocation_principal_cents over POSTED Payments == 0; INVARIANT holds."
          trigger:
            - "POST /loans/{L}/payments amount_cents=123144 → P1 POSTED; P1.allocation_principal_cents == 18978; Loan.principal_balance_cents == 19981022."
            - "POST /loans/{L}/payments/{P1}/reverse → P1.status=REVERSED."
          assert:
            - "After /reverse: Loan.principal_balance_cents == 20000000 (restored to original)."
            - "P1.status == REVERSED; P1.allocation_principal_cents preserved (audit trail) but EXCLUDED from sum over POSTED."
            - "INVARIANT: Loan.principal_balance_cents + Σ_{p in POSTED} p.allocation_principal_cents == 20000000 holds (both terms recompute to 20000000 + 0)."

      - name: disbursement_failed_retry_escrow_conservation
        grounds:
          - state_machines.Disbursement.SCHEDULED_to_FAILED
          - state_machines.Disbursement.FAILED_to_PAID
          - entities.Loan.fields.escrow_balance_cents
          - entities.Disbursement.fields.amount_cents
          - entities.Disbursement.fields.status
        distinguishing_aspect: |
          Different conserved quantity from principal: Loan.escrow_balance_cents +
          Σ_{d in PAID Disbursements on L} d.amount_cents == Σ_{p in POSTED Payments on L}
          p.allocation_escrow_cents (in the absence of SURPLUS_REFUND). A FAILED→PAID
          retry must conserve this invariant: at FAILED, escrow_balance was not debited;
          at PAID via retry, escrow_balance is debited by amount_cents and the disbursement
          enters the PAID set. The forward+compensating pair (SCHEDULED→FAILED, then
          FAILED→PAID via retry once funds suffice) must leave the named invariant
          satisfied with zero drift.
        test_recipe:
          setup:
            - "Loan L; via repeated payments, Loan.escrow_balance_cents == 100000 (one payment with escrow allocation 100000)."
            - "POST /loans/{L}/disbursements type=PROPERTY_TAX, scheduled_date=now+30d, amount_cents=150000 → D SCHEDULED."
            - "Snapshot: escrow_balance_cents=100000; Σ PAID disbursement amounts=0; Σ POSTED Payment.allocation_escrow_cents=100000. INVARIANT: 100000 + 0 == 100000 ✓."
          trigger:
            - "Advance clock 31 days, POST /_sweep/run → D.status=FAILED (escrow_balance_cents=100000 < 150000)."
            - "Post a payment with allocation_escrow_cents==60000 so escrow_balance_cents=160000 (≥150000)."
            - "POST /loans/{L}/disbursements/{D}/retry."
          assert:
            - "After FAILED: escrow_balance_cents == 100000 (no debit), D.status=FAILED, D.failure_reason=INSUFFICIENT_ESCROW. INVARIANT: 100000 + 0 == 100000 ✓."
            - "After payment + retry: escrow_balance_cents == 160000 - 150000 == 10000; D.status=PAID; Σ PAID amounts == 150000; Σ POSTED Payment.allocation_escrow_cents == 100000 + 60000 == 160000. INVARIANT: 10000 + 150000 == 160000 ✓."
            - "The forward (SCHEDULED→FAILED→PAID) chain leaves zero drift in the named conserved quantity."
