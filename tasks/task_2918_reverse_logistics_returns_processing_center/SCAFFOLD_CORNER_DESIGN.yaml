              as_user_id: "u_admin"
              captures: { err_wo: $.data.error_id }
            - call: "GET /disposition-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_do: $.data.error_id }
            - call: "GET /fraud-checks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_fc: $.data.error_id }
            - call: "GET /refund-releases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_rr: $.data.error_id }
            - call: "GET /pricing-feedback/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_pf: $.data.error_id }
            - call: "GET /shrink-ledger-entries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_sl: $.data.error_id }
          assert:
            - "Every call returns HTTP 404 with response_type == error"
            - "err_wo == ERR_WORK_ORDER_NOT_FOUND, err_do == ERR_DISPOSITION_ORDER_NOT_FOUND, err_fc == ERR_FRAUD_CHECK_NOT_FOUND"
            - "err_rr == ERR_REFUND_RELEASE_NOT_FOUND, err_pf == ERR_PRICING_FEEDBACK_NOT_FOUND, err_sl == ERR_SHRINK_LEDGER_ENTRY_NOT_FOUND"
            - "GET /shrink-ledger-entries?client_id=${c_id} returns HTTP 200 with total_count == 0, so a missing single row and an empty collection are reported differently"

      - name: corner_err_client_suspended_is_triggerable
        claim_type: Error triggerability
        grounds:
          - errors.ERR_CLIENT_SUSPENDED
          - validations[priority 19 ERR_CLIENT_SUSPENDED]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / receipt_creation_blocked_by_suspended_client"
          rationale: "That §1.8 instance suspends the client and asserts HTTP 409 ERR_CLIENT_SUSPENDED on POST /receipts, which is the triggerability claim for this id."

      - name: corner_err_line_invalid_financial_state_is_triggerable
        claim_type: Error triggerability
        grounds:
          - errors.ERR_LINE_INVALID_FINANCIAL_STATE
          - validations[priority 24 ERR_LINE_INVALID_FINANCIAL_STATE]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / release_refund_state_error_beats_temporal_hold_error"
          rationale: "That §1.8 instance attempts a release from HOLD_PENDING_DISPOSITION and asserts ERR_LINE_INVALID_FINANCIAL_STATE, so the id is already triggered there."

      - name: corner_err_channel_paused_is_triggerable
        claim_type: Error triggerability
        grounds:
          - errors.ERR_CHANNEL_PAUSED
          - validations[priority 27 ERR_CHANNEL_PAUSED]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / disposition_order_execution_blocked_by_paused_channel"
          rationale: "That §1.8 instance pauses the channel after the order is APPROVED and asserts ERR_CHANNEL_PAUSED on execute."

      - name: corner_err_recall_disposition_locked_is_triggerable
        claim_type: Error triggerability
        grounds:
          - errors.ERR_RECALL_DISPOSITION_LOCKED
          - validations[priority 30 ERR_RECALL_DISPOSITION_LOCKED]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / recall_safety_lock_beats_channel_grade_constraint"
          rationale: "That §1.8 instance asserts ERR_RECALL_DISPOSITION_LOCKED as the winner over the later channel checks, which triggers the id."

      - name: corner_err_segregation_of_duties_is_triggerable
        claim_type: Error triggerability
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations[priority 36 ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / segregation_of_duties_beats_refund_hold_window"
          rationale: "That §1.8 instance has the grader attempt the refund release and asserts ERR_SEGREGATION_OF_DUTIES."

      - name: corner_err_rework_limit_exceeded_is_triggerable
        claim_type: Error triggerability
        grounds:
          - errors.ERR_REWORK_LIMIT_EXCEEDED
          - validations[priority 45 ERR_REWORK_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / refurb_work_order_rework_cycle_terminates_at_two"
          rationale: "That §1.8 instance drives rework_cycles to the cap of 2 and asserts ERR_REWORK_LIMIT_EXCEEDED on the third start-test."

      - name: corner_err_qa_self_inspection_is_triggerable
        claim_type: Error triggerability
        grounds:
          - errors.ERR_QA_SELF_INSPECTION
          - validations[priority 37 ERR_QA_SELF_INSPECTION]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / refurb_work_order_rework_cycle_terminates_at_two"
          rationale: "That §1.8 instance has the opening technician try to record their own test result and asserts ERR_QA_SELF_INSPECTION."

      - name: corner_err_bay_window_conflict_is_triggerable
        claim_type: Error triggerability
        grounds:
          - errors.ERR_BAY_WINDOW_CONFLICT
          - validations[priority 55 ERR_BAY_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / quarantine_bay_half_open_windows_admit_touching_ends"
          rationale: "That §1.8 instance asserts ERR_BAY_WINDOW_CONFLICT for the genuinely overlapping quarantine window while admitting the touching one."

      - name: corner_err_channel_window_capacity_exceeded_is_triggerable
        claim_type: Error triggerability
        grounds:
          - errors.ERR_CHANNEL_WINDOW_CAPACITY_EXCEEDED
          - validations[priority 57 ERR_CHANNEL_WINDOW_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / channel_lot_windows_closed_endpoints_overlap_and_capacity_counts_the_new_order"
          rationale: "That §1.8 instance saturates concurrent_lot_capacity with the new order counted against it and asserts ERR_CHANNEL_WINDOW_CAPACITY_EXCEEDED."

      - name: corner_err_refund_exceeds_exposure_cap_is_triggerable
        claim_type: Error triggerability
        grounds:
          - errors.ERR_REFUND_EXCEEDS_EXPOSURE_CAP
          - validations[priority 61 ERR_REFUND_EXCEEDS_EXPOSURE_CAP]
        excluded_because:
          difficulty_instance: "boundary_precision_check / refund_exposure_cap_exact_equality_allowed_one_cent_over_rejected"
          rationale: "That §1.8 instance releases exactly to the cap and then one cent past it, asserting ERR_REFUND_EXCEEDS_EXPOSURE_CAP on the second release."

  # =================================================================== #
  # SECTION 7 — rbac                                                    #
  # =================================================================== #
  - section: rbac
    instances:
      - name: corner_rbac_blank_or_unknown_identity_headers_are_unauthenticated
        claim_type: Authentication
        grounds:
          - validations[priority 1 ERR_UNAUTHENTICATED]
          - validations[priority 2 ERR_ROLE_NOT_PERMITTED]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
          - roles.CenterAdmin
        distinguishing_aspect: "An empty X-User-ID and an X-User-Role outside the seven declared names both fail at priority 1 with 401 ERR_UNAUTHENTICATED, whereas a real role simply not listed on the endpoint fails one rung later with 403 ERR_ROLE_NOT_PERMITTED — the two statuses are never interchangeable."
        test_recipe:
          setup:
            - "One Client exists so that every probe targets a resolvable resource and the failure can only come from the identity headers."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Rbac One", client_code: "RB1", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", liquidation_floor_pct: 0.3, fraud_tolerance_cents: 100000000, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /clients/${c_id}"
              payload: {}
              as: CenterAdmin
              as_user_id: ""
              captures: { err_blank_id: $.data.error_id }
            - call: "GET /clients/${c_id}"
              payload: {}
              as: "NotARole"
              as_user_id: "u_admin"
              captures: { err_unknown_role: $.data.error_id }
            - call: "GET /clients"
              payload: {}
              as: ClientRep
              as_user_id: "${c_id}"
              captures: { err_not_permitted: $.data.error_id }
          assert:
            - "err_blank_id == ERR_UNAUTHENTICATED with HTTP 401 — an empty X-User-ID is a missing header, not an unknown user"
            - "err_unknown_role == ERR_UNAUTHENTICATED with HTTP 401, because NotARole is not one of the seven declared roles and so never reaches the endpoint's roles list"
            - "err_not_permitted == ERR_ROLE_NOT_PERMITTED with HTTP 403 — ClientRep is a declared role, so it authenticates and is then refused the CenterAdmin-exclusive collection read"
            - "GET /clients/${c_id} as CenterAdmin with X-User-ID u_admin returns HTTP 200, proving the resource itself was always reachable"

      - name: corner_rbac_receiving_clerk_cannot_grade_a_line
        claim_type: Forbidden operations
        grounds:
          - validations[priority 2 ERR_ROLE_NOT_PERMITTED]
          - roles.GradingInspector.exclusive_operations
          - roles.ReceivingClerk
          - endpoints[POST /return-lines/{return_line_id}/grade]
        distinguishing_aspect: "The clerk who scanned the line is refused the grade call with 403 ERR_ROLE_NOT_PERMITTED even though the line is in the only state where grading is legal, and the identical call by a GradingInspector then succeeds."
        test_recipe:
          setup:
            - "Client RB2, a non-hazardous 20000-cent 1200-gram SKU, an issued RMA and one scanned unit line sitting in RECEIVED_UNGRADED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /clients"
              payload: { name: "Rbac Two", client_code: "RB2", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", liquidation_floor_pct: 0.3, fraud_tolerance_cents: 100000000, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-RB2", customer_reference: "CUST-RB2", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_line_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-RB2", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rma_line_id}", quantity: 1, reason_code: "DEFECTIVE" }
