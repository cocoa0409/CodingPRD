      - name: reconcile_delta_cap_boundary
        claim_type: boundary
        grounds: [state_machines.DebrisTicket.RECEIVED_to_RECONCILED, "errors[ERR_RECONCILE_DELTA_EXCEEDED]"]
        distinguishing_aspect: "Reconcile delta exactly 2.0 tons is allowed (<= cap); 2.5 tons exceeds the cap and is rejected with ERR_RECONCILE_DELTA_EXCEEDED; counters adjust by the accepted delta."
        test_recipe:
          setup:
            - "Project DEMOLITION_ACTIVE (release chain); ticket gross 10.0 RECEIVED with diverted 4.0; second ticket gross 8.0 RECEIVED with diverted 3.0."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Delta", address: "46 Pine St", lot_area_sqft: 30000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
