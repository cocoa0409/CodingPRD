  - rule_id: priority_pair_validation_conflict
    instances:
      - name: tap_state_failure_beats_emissions_safety
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.MeltBatch.CERTIFIED_to_TAPPED
        distinguishing_aspect: |
          Error-category pair state vs business_safety: the batch is already
          TAPPED (state check fails — tap requires CERTIFIED) AND the
          AIR_EMISSIONS permit is in BREACH (safety check fails). The
          higher-priority state error ERR_INVALID_STATE_TRANSITION (priority 6)
          must win over ERR_EMISSIONS_PERMIT_BREACH (priority 10). The batch is
          TAPPED, so the breach cascade does not hold it — both failures are
          genuinely evaluable at trigger time.
        test_recipe:
          setup:
            - "Product P, order O (planned 10) released; AIR permit limit 100.0"
            - "Melt B charged, certified, tapped 2010 lbs (state TAPPED)"
            - "Two over-limit readings (120.0, 130.0) push the permit to BREACH; B is TAPPED so it is not held and O is not frozen"
