scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: red_flag_score_provisional_vs_triage_adjusted
        grounds:
          - calculations.red_flag_score
          - calculations.red_flag_score.variants.provisional_at_intake
          - calculations.red_flag_score.variants.triage_adjusted
        distinguishing_aspect: |
          Referral-domain dual variant: provisional_at_intake uses raw CODE_WEIGHT
          constants, while triage_adjusted accepts a modifier_overrides map that
          replaces weights for the recompute — same red_flag_codes input produces
          a different suspicion_score and score_band.
        test_recipe:
          setup:
            - "Adjuster A1 registered"
            - "Claim C1 (state=CA, claimed_amount_cents=10000000) registered by A1 — under HIGH_VALUE_CLAIM_CENTS so no multiplier"
            - "Referral R1 created with red_flag_codes=[STAGED_ACCIDENT_PATTERN, UNWITNESSED_LOSS] — provisional score = 25+12 = 37, band MEDIUM (no combination bonus, only 2 codes)"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "Adj One", email: "adj1@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj1_id: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "POL-001", state_code: "CA", adjuster_id: "${adj1_id}", claimed_amount_cents: 10000000 }
              as: Adjuster
              as_user_id: "${adj1_id}"
              captures: { claim1_id: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${claim1_id}", submitted_by_role: "ADJUSTER", red_flag_codes: ["STAGED_ACCIDENT_PATTERN", "UNWITNESSED_LOSS"], narrative: "Suspicious" }
              as: Adjuster
              as_user_id: "${adj1_id}"
              captures: { ref1_id: $.data.id, ref1_score_initial: $.data.suspicion_score, ref1_band_initial: $.data.score_band }
          trigger:
            - call: "POST /siu/referrals/${ref1_id}/triage"
              payload: { modifier_overrides: { UNWITNESSED_LOSS: 25 } }
              as: SIUManager
              captures: { ref1_score_after: $.data.suspicion_score, ref1_band_after: $.data.score_band }
          assert:
            - "RedFlagReferral.${ref1_id} initial suspicion_score == 37"
            - "RedFlagReferral.${ref1_id} initial score_band == MEDIUM"
            - "After triage override UNWITNESSED_LOSS→25: suspicion_score == 50"
            - "After triage override: score_band == HIGH"
            - "provisional 37 != triage_adjusted 50"

      - name: substantiated_fraud_provisional_running_vs_final_sealed
        grounds:
          - calculations.substantiated_fraud_total
          - calculations.substantiated_fraud_total.variants.provisional_at_admit
          - calculations.substantiated_fraud_total.variants.final_at_close
        distinguishing_aspect: |
          Case-domain dual variant: provisional_at_admit adds evidence amounts to
          a running total on each ADMITTED transition, while final_at_close locks
          the ledger target and subtracts any subsequently SEALED evidence from
          the total — identical evidence list yields different
          substantiated_fraud_cents pre- vs post-seal.
        test_recipe:
          setup:
            - "Adjuster A1, Claim C1 (CA, 100000000 cents), Investigator I1 certified in CA with capacity 5, Manager"
            - "Referral R1 accepted (opens case); case K1 opened and assigned to I1"
            - "Evidence E1 (SUBSTANTIVE, 20000000) admitted → substantiated=20000000"
            - "Evidence E2 (SUBSTANTIVE, 15000000) admitted → substantiated=35000000"
            - "Case submitted for decision and closed SUBSTANTIATED by manager M2 (different from investigator)"
            - "Ledger L1 auto-created with target 35000000"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "Adj One", email: "adj1@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj1_id: $.data.id }
            - call: "POST /siu/investigators"
              payload: { full_name: "Inv One", email: "inv1@x.com", badge_number: "B001", state_certifications: ["CA"], max_active_cases: 5 }
              as: SIUManager
              captures: { inv1_id: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "POL-002", state_code: "CA", adjuster_id: "${adj1_id}", claimed_amount_cents: 100000000 }
              as: Adjuster
              as_user_id: "${adj1_id}"
              captures: { claim1_id: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${claim1_id}", submitted_by_role: "ADJUSTER", red_flag_codes: ["PRIOR_FRAUD_CONVICTION"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj1_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /siu/referrals/${ref1_id}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${ref1_id}/accept"
              payload: {}
              as: SIUManager
              captures: { case1_id: $.data.id, case1_v_open: $.data.version }
            - call: "POST /siu/cases/${case1_id}/open"
              payload: {}
              as: SIUManager
              captures: { case1_v: $.data.version }
            - call: "POST /siu/cases/${case1_id}/assignments"
              payload: { investigator_id: "${inv1_id}", expected_case_version: "${case1_v}" }
              as: SIUManager
              captures: { case1_v2: $.data.version }
            - call: "POST /siu/cases/${case1_id}/evidence"
              payload: { evidence_type: "RECORDS", collected_at: "2026-08-10T00:00:00Z", custodian: "Inv One", materiality: "SUBSTANTIVE", fraud_amount_cents: 20000000 }
              as: SIUInvestigator
              as_user_id: "${inv1_id}"
              captures: { ev1_id: $.data.id }
            - call: "POST /siu/cases/${case1_id}/evidence/${ev1_id}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv1_id}"
            - call: "POST /siu/cases/${case1_id}/evidence/${ev1_id}/admit"
              payload: { expected_case_version: "${case1_v2}" }
              as: SIUManager
              captures: { case1_v3: $.data.version }
            - call: "POST /siu/cases/${case1_id}/evidence"
              payload: { evidence_type: "SURVEILLANCE", collected_at: "2026-08-11T00:00:00Z", custodian: "Inv One", materiality: "SUBSTANTIVE", fraud_amount_cents: 15000000 }
              as: SIUInvestigator
              as_user_id: "${inv1_id}"
              captures: { ev2_id: $.data.id }
            - call: "POST /siu/cases/${case1_id}/evidence/${ev2_id}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv1_id}"
            - call: "POST /siu/cases/${case1_id}/evidence/${ev2_id}/admit"
              payload: { expected_case_version: "${case1_v3}" }
              as: SIUManager
              captures: { case1_v4: $.data.version }
            - call: "POST /siu/cases/${case1_id}/submit-for-decision"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv1_id}"
            - call: "POST /siu/cases/${case1_id}/close"
              payload: { closed_reason: "SUBSTANTIATED" }
              as: SIUManager
          trigger:
            - call: "POST /siu/cases/${case1_id}/evidence/${ev1_id}/seal"
              payload: {}
              as: SIUManager
            - call: "GET /siu/cases/${case1_id}"
              payload: {}
              as: SIUManager
              captures: { case1_final_substantiated: $.data.substantiated_fraud_cents }
          assert:
            - "Pre-seal substantiated_fraud_cents was 35000000 (provisional_at_admit running total)"
            - "After seal of E1: substantiated_fraud_cents == 15000000 (final_at_close excludes SEALED SUBSTANTIVE)"
            - "RestitutionLedger target_amount_cents remains 35000000 (locked at close, not recomputed on seal)"

  # =========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes a/b/c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: provider_pattern_score_mode_a_multi_input_tiered
        grounds:
          - calculations.provider_pattern_score
        distinguishing_aspect: |
          Mode (a) combinatorial: nested conditional branches (>=3 linked cases,
          >=2 distinct states, distinct evidence-type diversity) combined with a
          min-cap at MAX_SCORE. Five inputs (case_count, distinct_states,
          distinct_evidence_types, RING_SIZE_THRESHOLD, ESCALATION_THRESHOLD)
          interact non-linearly.
        test_recipe:
          setup:
            - "3 substantiated cases for CA claims each linked to provider_npi=NPI-X"
            - "Evidence types across the 3 cases: RECORDS, SURVEILLANCE (2 distinct types)"
            - "Single state (CA) — no multi-state bonus"
            - "Expected pattern_score = 3*12 + 20 (ring bonus at threshold==3) + 0 + 2*4 = 64"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "Adj A", email: "adja@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj_a: $.data.id }
            - call: "POST /siu/investigators"
              payload: { full_name: "Inv P", email: "invp@x.com", badge_number: "BP01", state_certifications: ["CA"], max_active_cases: 10 }
              as: SIUManager
              captures: { inv_p: $.data.id }
            - call: "POST /siu/provider-patterns"
              payload: { provider_npi: "NPI-X", provider_name: "ProvX", ring_signature: "SIG-X" }
              as: SIUManager
              captures: { pat1_id: $.data.id }
            # --- Case 1 ---
            - call: "POST /siu/claims"
              payload: { policy_number: "P1", state_code: "CA", adjuster_id: "${adj_a}", claimed_amount_cents: 100000000 }
              as: Adjuster
              as_user_id: "${adj_a}"
              captures: { c1: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c1}", submitted_by_role: "ADJUSTER", red_flag_codes: ["PRIOR_FRAUD_CONVICTION"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj_a}"
              captures: { r1: $.data.id }
            - call: "POST /siu/referrals/${r1}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r1}/accept"
              payload: {}
              as: SIUManager
              captures: { k1: $.data.id }
            - call: "POST /siu/cases/${k1}/open"
              payload: {}
              as: SIUManager
              captures: { k1_v: $.data.version }
            - call: "POST /siu/cases/${k1}/assignments"
              payload: { investigator_id: "${inv_p}", expected_case_version: "${k1_v}" }
              as: SIUManager
              captures: { k1_v2: $.data.version }
            - call: "POST /siu/cases/${k1}/evidence"
              payload: { evidence_type: "RECORDS", collected_at: "2026-08-10T00:00:00Z", custodian: "I", materiality: "SUBSTANTIVE", fraud_amount_cents: 1000000 }
              as: SIUInvestigator
              as_user_id: "${inv_p}"
              captures: { e1: $.data.id }
            - call: "POST /siu/cases/${k1}/evidence/${e1}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv_p}"
            - call: "POST /siu/cases/${k1}/evidence/${e1}/admit"
              payload: { expected_case_version: "${k1_v2}" }
              as: SIUManager
            - call: "POST /siu/cases/${k1}/submit-for-decision"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv_p}"
            - call: "POST /siu/cases/${k1}/close"
              payload: { closed_reason: "SUBSTANTIATED" }
              as: SIUManager
            # --- Case 2 ---
            - call: "POST /siu/claims"
              payload: { policy_number: "P2", state_code: "CA", adjuster_id: "${adj_a}", claimed_amount_cents: 100000000 }
              as: Adjuster
              as_user_id: "${adj_a}"
              captures: { c2: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c2}", submitted_by_role: "ADJUSTER", red_flag_codes: ["PRIOR_FRAUD_CONVICTION"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj_a}"
              captures: { r2: $.data.id }
            - call: "POST /siu/referrals/${r2}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r2}/accept"
              payload: {}
              as: SIUManager
              captures: { k2: $.data.id }
            - call: "POST /siu/cases/${k2}/open"
              payload: {}
              as: SIUManager
              captures: { k2_v: $.data.version }
            - call: "POST /siu/cases/${k2}/assignments"
              payload: { investigator_id: "${inv_p}", expected_case_version: "${k2_v}" }
              as: SIUManager
              captures: { k2_v2: $.data.version }
            - call: "POST /siu/cases/${k2}/evidence"
              payload: { evidence_type: "SURVEILLANCE", collected_at: "2026-08-10T00:00:00Z", custodian: "I", materiality: "SUBSTANTIVE", fraud_amount_cents: 1000000 }
              as: SIUInvestigator
              as_user_id: "${inv_p}"
              captures: { e2: $.data.id }
            - call: "POST /siu/cases/${k2}/evidence/${e2}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv_p}"
            - call: "POST /siu/cases/${k2}/evidence/${e2}/admit"
              payload: { expected_case_version: "${k2_v2}" }
              as: SIUManager
            - call: "POST /siu/cases/${k2}/submit-for-decision"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv_p}"
            - call: "POST /siu/cases/${k2}/close"
              payload: { closed_reason: "SUBSTANTIATED" }
              as: SIUManager
            # --- Case 3 ---
            - call: "POST /siu/claims"
              payload: { policy_number: "P3", state_code: "CA", adjuster_id: "${adj_a}", claimed_amount_cents: 100000000 }
              as: Adjuster
              as_user_id: "${adj_a}"
              captures: { c3: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c3}", submitted_by_role: "ADJUSTER", red_flag_codes: ["PRIOR_FRAUD_CONVICTION"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj_a}"
              captures: { r3: $.data.id }
            - call: "POST /siu/referrals/${r3}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r3}/accept"
              payload: {}
              as: SIUManager
              captures: { k3: $.data.id }
            - call: "POST /siu/cases/${k3}/open"
              payload: {}
              as: SIUManager
              captures: { k3_v: $.data.version }
            - call: "POST /siu/cases/${k3}/assignments"
              payload: { investigator_id: "${inv_p}", expected_case_version: "${k3_v}" }
              as: SIUManager
              captures: { k3_v2: $.data.version }
            - call: "POST /siu/cases/${k3}/evidence"
              payload: { evidence_type: "RECORDS", collected_at: "2026-08-10T00:00:00Z", custodian: "I", materiality: "SUBSTANTIVE", fraud_amount_cents: 1000000 }
              as: SIUInvestigator
              as_user_id: "${inv_p}"
              captures: { e3: $.data.id }
            - call: "POST /siu/cases/${k3}/evidence/${e3}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv_p}"
            - call: "POST /siu/cases/${k3}/evidence/${e3}/admit"
              payload: { expected_case_version: "${k3_v2}" }
              as: SIUManager
            - call: "POST /siu/cases/${k3}/submit-for-decision"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv_p}"
            - call: "POST /siu/cases/${k3}/close"
              payload: { closed_reason: "SUBSTANTIATED" }
              as: SIUManager
          trigger:
            - call: "GET /siu/provider-patterns/${pat1_id}"
              payload: {}
              as: SIUManager
              captures: { pat1_score: $.data.pattern_score }
          assert:
            - "ProviderPattern.${pat1_id}.pattern_score == 64"
            - "ProviderPattern.${pat1_id}.linked_case_ids contains 3 entries"
            - "Score 64 >= ESCALATION_THRESHOLD 60 → pattern is escalation-eligible"

      - name: red_flag_score_mode_c_evaluation_order_pinned
        grounds:
          - calculations.red_flag_score
        distinguishing_aspect: |
          Mode (c) evaluation-order pin: the formula applies COMBINATION_BONUS
          BEFORE the HIGH_VALUE_MULTIPLIER, so the multiplier amplifies the
          bonus. Pinning this order matters: (sum+bonus)*mult differs from
          sum*mult+bonus. The scaffold's pinned order yields 59 for
          STAGED(25)+PHANTOM(22)=47, no bonus (only 2 codes), then *1.25 → 58.75
          → round_half_up → 59. If the bonus were applied AFTER the multiplier
          the result would still be 59 here, but with 3 codes
          (PRIOR(35)+STAGED(25)+INFLATED(20)=80, +bonus 15 = 95, *1.25 =
          118.75 → 119) the alternative order yields 115 (80*1.25+15).
        test_recipe:
          setup:
            - "Adjuster, claim with claimed_amount_cents=50000000 (>= HIGH_VALUE_CLAIM_CENTS 25000000)"
            - "Referral with 3 codes: PRIOR_FRAUD_CONVICTION, STAGED_ACCIDENT_PATTERN, INFLATED_BILLING"
            - "Sum=80, +COMBINATION_BONUS=15 → 95, *1.25 = 118.75 → round_half_up = 119"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "Adj C", email: "adjc@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj_c: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "POL-HV", state_code: "CA", adjuster_id: "${adj_c}", claimed_amount_cents: 50000000 }
              as: Adjuster
              as_user_id: "${adj_c}"
              captures: { claim_hv: $.data.id }
          trigger:
            - call: "POST /siu/referrals"
              payload: { claim_id: "${claim_hv}", submitted_by_role: "ADJUSTER", red_flag_codes: ["PRIOR_FRAUD_CONVICTION", "STAGED_ACCIDENT_PATTERN", "INFLATED_BILLING"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj_c}"
              captures: { ref_hv_score: $.data.suspicion_score, ref_hv_band: $.data.score_band }
          assert:
            - "RedFlagReferral.suspicion_score == 119"
            - "RedFlagReferral.score_band == CRITICAL"
            - "Proves order: bonus applied before multiplier (80+15)*1.25=118.75→119, not 80*1.25+15=115"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: evidence_cyclic_review_loop
        grounds:
          - state_machines.Evidence.transitions
        distinguishing_aspect: |
          Evidence state machine contains a cycle: UNDER_REVIEW → LOGGED via
          return-for-more-work. Each cycle re-enters UNDER_REVIEW via
          submit-review; loop count unbounded.
        test_recipe:
          setup:
            - "Case in UNDER_INVESTIGATION with investigator I1 assigned"
            - "Evidence E1 logged by I1"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/investigators"
              payload: { full_name: "I", email: "i@x.com", badge_number: "BX", state_certifications: ["CA"], max_active_cases: 5 }
              as: SIUManager
              captures: { inv: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P1", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 5000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["UNWITNESSED_LOSS"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r: $.data.id }
            - call: "POST /siu/referrals/${r}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r}/accept"
              payload: {}
              as: SIUManager
              captures: { k: $.data.id }
            - call: "POST /siu/cases/${k}/open"
              payload: {}
              as: SIUManager
              captures: { k_v: $.data.version }
            - call: "POST /siu/cases/${k}/assignments"
              payload: { investigator_id: "${inv}", expected_case_version: "${k_v}" }
              as: SIUManager
            - call: "POST /siu/cases/${k}/evidence"
              payload: { evidence_type: "STATEMENT", collected_at: "2026-08-10T00:00:00Z", custodian: "I", materiality: "SUPPORTING", fraud_amount_cents: 0 }
              as: SIUInvestigator
              as_user_id: "${inv}"
              captures: { e1: $.data.id }
            - call: "POST /siu/cases/${k}/evidence/${e1}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv}"
          trigger:
            - call: "POST /siu/cases/${k}/evidence/${e1}/return-for-more-work"
              payload: { note: "need clearer chain of custody" }
              as: SIUManager
              captures: { ev_state_1: $.data.status }
            - call: "POST /siu/cases/${k}/evidence/${e1}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv}"
              captures: { ev_state_2: $.data.status }
            - call: "POST /siu/cases/${k}/evidence/${e1}/return-for-more-work"
              payload: { note: "still not right" }
              as: SIUManager
              captures: { ev_state_3: $.data.status }
          assert:
            - "After first return: status == LOGGED"
            - "After second submit: status == UNDER_REVIEW"
            - "After second return: status == LOGGED"
            - "Cyclic loop completes 2 full cycles without terminal lock-in"

      - name: assignment_branching_reassign_vs_terminate
        grounds:
          - state_machines.Assignment.transitions
          - state_machines.SIUCase.transitions.UNDER_INVESTIGATION_to_OPEN
        distinguishing_aspect: |
          Assignment state machine is branching with divergent side effects:
          ACTIVE → REASSIGNED keeps case UNDER_INVESTIGATION and bumps new
          investigator's count, while ACTIVE → TERMINATED demotes the case to
          OPEN and nulls assigned_investigator_id — same from-state, fork with
          different parent side-effect sets.
        test_recipe:
          setup:
            - "Case K in UNDER_INVESTIGATION, assigned to I1 (count=1)"
            - "I2 also available (count=0)"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/investigators"
              payload: { full_name: "I1", email: "i1@x.com", badge_number: "B1", state_certifications: ["CA"], max_active_cases: 5 }
              as: SIUManager
              captures: { inv1: $.data.id }
            - call: "POST /siu/investigators"
              payload: { full_name: "I2", email: "i2@x.com", badge_number: "B2", state_certifications: ["CA"], max_active_cases: 5 }
              as: SIUManager
              captures: { inv2: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 5000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["UNWITNESSED_LOSS"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r: $.data.id }
