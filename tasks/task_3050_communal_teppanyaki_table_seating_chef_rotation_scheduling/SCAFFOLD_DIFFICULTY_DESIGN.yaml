              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_l}/events"
              payload: { event_type: "FINISH" }
              as: Chef
          trigger:
            - call: "POST /service-floor/reservations/${res_k}/close"
              payload: { expected_reservation_version: "${res_k_v}", credit_to_apply_cents: 0 }
              as: Host
            - call: "GET /service-floor/ledger-entries"
              payload: { venue_id: "${venue_id}", reservation_id: "${res_k}", entry_kind: "TABLE_MINIMUM_TRUEUP" }
              as: Host
              captures: { trueup_k: "$.data[0].amount_cents" }
            - call: "POST /service-floor/reservations/${res_l}/close"
              payload: { expected_reservation_version: "${res_l_v}", credit_to_apply_cents: 0 }
              as: Host
            - call: "GET /service-floor/ledger-entries"
              payload: { venue_id: "${venue_id}", reservation_id: "${res_l}", entry_kind: "TABLE_MINIMUM_TRUEUP" }
              as: Host
              captures: { trueup_l: "$.data[0].amount_cents" }
          assert:
            - "the T2 booking bills final_bill_cents == 6400 against a minimum of 8000, a shortfall of exactly 1000"
            - "1000 is INCLUSIVE at the band-1 edge: band_cents == 0.50 * 1000 == 500 and trueup_k == 500"
            - "the boundary must not fall through to band 2: 0.60 * 1000 == 600 would ceiling to 600, which is 100 higher"
            - "a T4 booking of 13000 against a minimum of 14000 has a shortfall of 1000 as well and also yields 500 — the band edge is a property of the shortfall, not of the tier"
            - "moving the shortfall to 1001 flips to band 2: band_cents == 0.60 * 1001 == 600.60 and trueup_l would be ceil(600.60/25)*25 == 625"
            - "trueup_k == 500 and is strictly less than the 625 the next cent of shortfall produces"

      - name: hold_count_boundary_third_hold_allowed_fourth_refused
        grounds:
          - calculations.settlement
          - entities.Reservation.fields.hold_count
          - validations[priority=9]
          - errors.ERR_HOLD_LIMIT_EXCEEDED
        distinguishing_aspect: "A count boundary on a different metric and a different endpoint from the money boundary — the hold episode counter. hold_count == 3 is still under the cap HOLD_MAX_COUNT == 3 in the sense that the third hold is granted, while the fourth returns ERR_HOLD_LIMIT_EXCEEDED; and the counter is per booking, so a second booking may still hold three times."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers and three tables, two chefs, a GOLD party holding one booking."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_gold_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_n: $.data.id }
            - call: "POST /service-floor/reservations/${res_n}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "POST /service-floor/reservations/${res_n}/holds"
              payload: { expected_table_version: "${t2_v}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:25:00Z" }
              as: PlatformAdmin
            - call: "POST /service-floor/reservations/${res_n}/holds"
              payload: { expected_table_version: "${t3_v}", table_id: "${table3_id}" }
              as: Host
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:50:00Z" }
              as: PlatformAdmin
            - call: "POST /service-floor/reservations/${res_n}/holds"
              payload: { expected_table_version: "${t2_v}", table_id: "${table2_id}" }
              as: Host
              captures: { holds_after_third: $.data.hold_count }
            - call: "POST /service-floor/reservations/${res_n}/holds"
              payload: { expected_table_version: "${t3_v}", table_id: "${table3_id}" }
              as: Host
              captures: { err_hold_cap: $.data.error_id }
          assert:
            - "the third hold is granted: holds_after_third == 3 and the response status is 200"
            - "the counter is inclusive at the cap — 3 holds are permitted and only the fourth is refused"
            - "the fourth hold returns 409 with err_hold_cap == ERR_HOLD_LIMIT_EXCEEDED"
            - "err_hold_cap != ERR_HOLD_WINDOW_CLOSED and err_hold_cap != ERR_MAINTENANCE_CONFLICT"
            - "the cap is per booking, not per party: a second booking for the same party may still take three fresh holds"
            - "Reservation.${res_n}.hold_count stays 3 and no fourth table is reserved"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
