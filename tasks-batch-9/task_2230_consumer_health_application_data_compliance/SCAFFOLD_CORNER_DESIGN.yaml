  - section: calculations
    instances:
      - name: correct_result_chd_classification_two_hop_inference_chain
        claim_type: correct_result
        grounds: ["calculations.chd_classification", "entities.DataElement.fields.inference_depth", "entities.DataElement.fields.chd_classification"]
        distinguishing_aspect: "A NON_HEALTH element two derivation hops below a DIAGNOSIS root is CHD_BY_INFERENCE with inference_depth 2, because the per-element rule reads the already-classified parent rather than the element's own signal kind."
        test_recipe:
          setup: ["logical clock at 2026-08-01T00:00:00Z", "one AppProduct"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
              captures: { root_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_risk", display_name: "Apnea risk score", source_kind: "DERIVED_INFERENCE", health_signal_kind: "NON_HEALTH", derived_from_element_id: "${root_id}" }
              as: DataSteward
              captures: { mid_id: $.data.id }
          trigger:
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_segment", display_name: "Apnea marketing segment", source_kind: "DERIVED_INFERENCE", health_signal_kind: "NON_HEALTH", derived_from_element_id: "${mid_id}" }
              as: DataSteward
              captures: { leaf_id: $.data.id }
          assert:
            - "http_status == 201"
            - "DataElement.${root_id}.inference_depth == 0"
            - "DataElement.${root_id}.chd_classification == CHD"
            - "DataElement.${mid_id}.inference_depth == 1"
            - "DataElement.${mid_id}.chd_classification == CHD_BY_INFERENCE"
            - "DataElement.${leaf_id}.inference_depth == 2"
            - "DataElement.${leaf_id}.chd_classification == CHD_BY_INFERENCE"
            - "AppProduct.${prod_id}.active_element_count == 3"
            - "AppProduct.${prod_id}.regulated_element_count == 3"

      - name: input_set_filtering_retired_element_leaves_counts_but_keeps_classification
        claim_type: input_set_filtering
        grounds: ["calculations.chd_classification.input_set", "entities.AppProduct.fields.regulated_element_count"]
        distinguishing_aspect: "chd_classification runs over DataElement rows of every status, but only status == ACTIVE rows feed active_element_count and regulated_element_count, so retiring the leaf drops both counters by one while the leaf keeps chd_classification CHD_BY_INFERENCE."
        test_recipe:
          setup: ["logical clock at 2026-08-01T00:00:00Z", "one AppProduct with a DIAGNOSIS root and one derived child, both ACTIVE"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
              captures: { root_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_risk", display_name: "Apnea risk score", source_kind: "DERIVED_INFERENCE", health_signal_kind: "NON_HEALTH", derived_from_element_id: "${root_id}" }
              as: DataSteward
              captures: { child_id: $.data.id }
          trigger:
            - call: "POST /health-data/data-elements/${child_id}/retire"
              payload: { retired_reason: "Inference model decommissioned" }
              as: DataSteward
          assert:
            - "DataElement.${child_id}.status == RETIRED"
            - "DataElement.${child_id}.chd_classification == CHD_BY_INFERENCE"
            - "DataElement.${child_id}.inference_depth == 1"
            - "AppProduct.${prod_id}.active_element_count == 1"
            - "AppProduct.${prod_id}.regulated_element_count == 1"

      - name: constants_applied_consumer_count_exactly_at_small_business_max_uses_standard_deadline
        claim_type: constants_applied
        grounds: ["calculations.applicability_determination.constants.SMALL_BUSINESS_CONSUMER_MAX", "calculations.applicability_determination.constants.STANDARD_DEADLINE", "entities.AppProduct.fields.small_business_flag"]
        distinguishing_aspect: "small_business_flag uses strict <, so consumer_count exactly 100000 is NOT a small business and the product inherits STANDARD_DEADLINE 2026-03-31 rather than SMALL_BUSINESS_DEADLINE 2026-06-30."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AppProduct with consumer_count exactly 100000 and annual_revenue_cents 2400000000, holding one ACTIVE DIAGNOSIS element"
            - "one SUBMITTED ApplicabilityAssessment claiming NOT_COVERED"
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 100000, annual_revenue_cents: 2400000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
            - call: "POST /health-data/applicability-assessments"
              payload: { app_product_id: "${prod_id}", entity_status_claim: "NOT_COVERED", analyst_note: "Consumer wellness app, no covered transactions" }
              as: PrivacyOfficer
              captures: { asmt_id: $.data.id }
            - call: "POST /health-data/applicability-assessments/${asmt_id}/submit"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
          trigger:
            - call: "POST /health-data/applicability-assessments/${asmt_id}/approve"
              payload: {}
              as: ComplianceApprover
              as_user_id: "ca-1"
          assert:
            - "ApplicabilityAssessment.${asmt_id}.state == APPROVED"
            - "AppProduct.${prod_id}.small_business_flag == false"
            - "AppProduct.${prod_id}.applicability_status == CHD_REGULATED"
            - "AppProduct.${prod_id}.regulated_scope == FULL"
            - "AppProduct.${prod_id}.compliance_deadline_date == 2026-03-31"

      - name: precision_residual_risk_single_rounding_step
        claim_type: precision
        grounds: ["calculations.residual_risk_score.precision"]
        excluded_because:
          difficulty_instance: residual_risk_rounding_order_pinned_to_weight_then_sum_then_round
          rationale: "The named §1.8 instance pins the one-rounding-step contract by contrasting 36.48 against the 36.49 that per-domain rounding produces."

      - name: threshold_residual_risk_tier_boundary_at_exactly_forty
        claim_type: threshold
        grounds: ["calculations.residual_risk_score.constants.TIER_HIGH_MIN", "entities.SecurityRiskAssessment.fields.risk_tier"]
        distinguishing_aspect: "The MODERATE/HIGH cut is >= 40, so a score of exactly 40.00 is HIGH while 39.72 is MODERATE; the two assessments differ only in their control scores and gap count."
        test_recipe:
          setup: ["logical clock at 2026-08-01T00:00:00Z", "one AppProduct with no assessments yet"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/security-risk-assessments"
              payload: { app_product_id: "${prod_id}", assessment_label: "Just below the cut", admin_control_score: 66, technical_control_score: 71, physical_control_score: 58, vendor_oversight_score: 63, documented_gap_count: 5, remediation_plan_present: false }
              as: SecurityEngineer
              captures: { sra_low_id: $.data.id }
          trigger:
            - call: "POST /health-data/security-risk-assessments"
              payload: { app_product_id: "${prod_id}", assessment_label: "Exactly at the cut", admin_control_score: 60, technical_control_score: 60, physical_control_score: 60, vendor_oversight_score: 60, documented_gap_count: 0, remediation_plan_present: false }
              as: SecurityEngineer
              captures: { sra_at_id: $.data.id }
          assert:
            - "http_status == 201"
            - "SecurityRiskAssessment.${sra_low_id}.residual_risk_score == 39.72"
            - "SecurityRiskAssessment.${sra_low_id}.risk_tier == MODERATE"
            - "SecurityRiskAssessment.${sra_at_id}.residual_risk_score == 40.00"
