              as: Scheduler
              captures: { s4_id: $.data.id, s4_v: $.data.version }
            - call: "POST /shifts/${s4_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${s4_v}" }
              as: Scheduler
            - call: "POST /shifts/${s4_id}/actions"
