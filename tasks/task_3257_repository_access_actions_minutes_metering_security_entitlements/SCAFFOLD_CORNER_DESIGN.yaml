          - "errors[ERR_RUNNER_IN_USE]"
        distinguishing_aspect: "DELETE on an ACTIVE runner referenced by a RUNNING run is rejected with ERR_RUNNER_IN_USE; after the run completes, removal succeeds."
        test_recipe:
          setup: ["Enterprise + TEAM Organization + Repository + ACTIVE runner + RUNNING self-hosted run on that runner"]
          setup_api_calls:
