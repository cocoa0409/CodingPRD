  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: role_denial_sweep_exclusive_operations
        claim_type: rbac_denial
        grounds: ["roles", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Each role is refused another role's exclusive operation with ERR_FORBIDDEN_ROLE (403): Participant cannot create plans; BenefitsAdministrator cannot determine cases; ComplianceOfficer cannot enroll participants; TrustOfficer cannot post crediting runs; PlanSponsor cannot drive the test clock."
        test_recipe:
          setup: ["ACTIVE plan (version captured); participant with an EVIDENCE_SUBMITTED case"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan RB", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
