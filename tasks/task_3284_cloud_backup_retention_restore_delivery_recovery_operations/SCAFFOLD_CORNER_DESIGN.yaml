            - call: "POST /backup-provider/backup-groups/${grp_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: false, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/allowance.bin", version_number: 1, operation: "CREATE", size_bytes: 2147483648, content_hash: "sha256-allow-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { acct_v_b1: $.data.version }
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}", subject_agent_id: "${agt_id}", restore_point_in_utc: "2026-09-03T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 1.0, restore_transaction_count: 0, expected_account_version: "${acct_v_b1}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { rr_b1_id: $.data.id }
            - call: "POST /backup-provider/restore-requests/${rr_b1_id}/validate"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /backup-provider/restore-requests/${rr_b1_id}/begin"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { b1_egress: $.data.egress_gb }
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { acct_v_b2: $.data.version }
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}", subject_agent_id: "${agt_id}", restore_point_in_utc: "2026-09-03T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 1.01, restore_transaction_count: 0, expected_account_version: "${acct_v_b2}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { rr_b2_id: $.data.id }
            - call: "POST /backup-provider/restore-requests/${rr_b2_id}/validate"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /backup-provider/restore-requests/${rr_b2_id}/begin"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { b2_egress: $.data.egress_gb }
          assert:
            - "${b1_egress} == 0.0 (the 1.0 GB request consumed the allowance exactly)"
            - "${b2_egress} == 0.01 (one hundredth of a GB over the allowance is billable)"
            - "RestoreRequest.${rr_b1_id}.egress_fee_cents == 0"
            - "RestoreRequest.${rr_b2_id}.egress_fee_cents == 1"

      - name: backup_group_derived_fields_reconcile_after_each_change
        claim_type: Derived Field Reconciliation
        grounds:
          - state_machines.Agent.PENDING_AUTH_to_ACTIVE
          - state_machines.BackupSet.ACTIVE_to_ACTIVE
          - calculations.group_transaction_share
          - entities.BackupGroup.fields.expected_daily_transactions
        distinguishing_aspect: "The group's derived counters track its agents and their changes: agent_count rises to 2 on activation, then a file change on one agent's set advances that agent's last_change_sequence without touching the group's agent_count."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. PERSONAL account with two agents, the first activated with an ACTIVE set."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/rec.bin", version_number: 1, operation: "CREATE", size_bytes: 1073741824, content_hash: "sha256-rec-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "POST /backup-provider/agents"
              payload: { account_id: "${acct_id}", group_id: "${grp_id}", hostname: "nw-laptop-02", os_type: "WINDOWS", license_type: "PERSONAL", throttle_month: 202609 }
              as: BackupOperator
              captures: { agt2_id: $.data.id }
            - call: "POST /backup-provider/agents/${agt2_id}/activate"
              payload: {}
              as: BackupOperator
              captures: { grp_count_two: $.data.status }
          trigger:
            - call: "GET /backup-provider/backup-groups/${grp_id}"
              payload: {}
              as: SystemOperator
              captures: { gc_value: $.data.agent_count, edt_value: $.data.expected_daily_transactions }
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/rec.bin", version_number: 2, operation: "MODIFY", size_bytes: 2147483648, content_hash: "sha256-rec-v2", event_utc: "2026-09-02T03:00:00Z" }
              as: BackupOperator
            - call: "GET /backup-provider/backup-groups/${grp_id}"
              payload: {}
              as: SystemOperator
              captures: { gc_after: $.data.agent_count }
          assert:
            - "${gc_value} == 2"
            - "${edt_value} == 48 (two STANDARD agents at 24 increments a day each)"
            - "${gc_after} == 2 (the file change did not alter the agent count)"
            - "Agent.${agt_id}.last_change_sequence == 2 and Agent.${agt2_id}.last_change_sequence == 0"
            - "BackupGroup.${grp_id}.member_transaction_share == 1.0"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: file_version_create_response_already_reflects_recomputed_set_totals
        claim_type: Immediate Consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/backup-provider/backup-sets/{id}/file-versions
          - entities.BackupSet.fields.storage_gb
          - entities.Account.fields.usage_gb
        distinguishing_aspect: "The write response itself carries the recomputed derived aggregates with no read-after-write lag: the creating endpoint returns the FileVersion, and a GET issued immediately after reports storage_gb and usage_gb already reflecting the new byte count."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. PERSONAL account with an ACTIVE set holding a 10 GB file."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/imm.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-imm-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
          trigger:
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/imm.bin", version_number: 2, operation: "MODIFY", size_bytes: 32212254720, content_hash: "sha256-imm-v2", event_utc: "2026-09-02T04:00:00Z" }
              as: BackupOperator
              captures: { imm_fv_id: $.data.id }
            - call: "GET /backup-provider/backup-sets/${set_id}"
              payload: {}
              as: BackupOperator
              captures: { imm_storage: $.data.storage_gb }
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: SystemOperator
              captures: { imm_usage: $.data.usage_gb }
          assert:
            - "the create returns 201 with FileVersion.${imm_fv_id}.version_number == 2"
            - "${imm_storage} == 30.0"
            - "${imm_usage} == 30.0"
            - "Account.${acct_id}.peak_usage_gb == 30.0 (already reflecting the new high-water mark)"
