      - POST /supplier-contracts/${c1_id}/execute as ContractApprover ca-01, and inspect the response
        body of that call alone.
      - 'Immediately afterwards, with no delay and no repeated read: GET /supplier-contracts/${c1_id},
        GET /programs/${p_id}, GET /destinations/${d1_id}, GET /destinations/${d2_id}, GET /qualifiers/${qa_id},
        GET /qualifiers/${qb_id}, GET /deposit-milestones?contract_id=${c1_id} and GET /supplier-contracts/${c1_id}/exposure-projection.'
      - Repeat every one of those reads a second time.
      assert:
      - The execute response body itself already shows status "EXECUTED", executed_by_user_id "ca-01",
        executed_at "2026-08-01T00:00:00Z", room_nights_blocked 60, room_nights_confirmed 0, room_nights_available
        60 and attrition_posture "AT_RISK" — the caller does not have to read the row back to learn the
        outcome.
