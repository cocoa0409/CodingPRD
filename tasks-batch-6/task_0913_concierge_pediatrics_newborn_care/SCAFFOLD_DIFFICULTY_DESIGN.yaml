  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: panel_capacity_exact_equality_reached_only_after_slot_weight_ages_down
        grounds:
          - calculations.panel_weighted_occupancy
          - validations[priority=34]
          - errors[ERR_PANEL_CAPACITY_EXCEEDED]
          - entities.Membership.fields.slot_weight
          - entities.Physician.fields.available_panel_weight
        distinguishing_aspect: |
          Numeric threshold boundary on POST /peds/memberships. The identical
          enrollment is rejected at weighted_occupancy 4.0 + 1.0 = 5.0 against a
          cap of 4.5 and accepted one month later at 3.5 + 1.0 = 4.5, i.e. at
          exact equality, because a child born 2025-07-01 crosses age_days 365
          on 2026-07-01 and its weight drops from 2.0 to 1.5. The comparison is
          "<=", so 4.5 <= 4.5 passes.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
            - "One PLUS plan and one physician with panel_slot_cap 4.5"
            - "Child X born 2025-07-01 (age 335, weight 2.0) and child Y born 2026-04-01 (age 61, weight 2.0) both enrolled, so weighted_occupancy is 4.0 and available_panel_weight is 0.5"
            - "Child Z born 2022-01-01 (age 1612, weight 1.0) registered in a third family but not yet enrolled"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
              payload: { tier: "PLUS", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
              as: PracticeAdmin
              captures: { plus_plan_id: "$.data.id" }
            - call: "POST /peds/physicians"
              payload: { full_name: "Dr Ada Reyes", panel_slot_cap: 4.5, licensed_state_codes: ["CA"] }
              as: PracticeAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Xu", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { f1_id: "$.data.id", f1_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${f1_id}", first_name: "Xia", date_of_birth: "2025-07-01" }
              as: PracticeAdmin
              captures: { child_x: "$.data.id" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_x}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${f1_v0}" }
              as: PracticeAdmin
              captures: { mem_x: "$.data.id", mem_x_w0: "$.data.slot_weight" }
            - call: "POST /peds/families"
              payload: { household_name: "Yates", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { f2_id: "$.data.id", f2_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${f2_id}", first_name: "Yara", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_y: "$.data.id" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_y}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${f2_v0}" }
              as: PracticeAdmin
              captures: { mem_y: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Zeller", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { f3_id: "$.data.id" }
            - call: "POST /peds/children"
              payload: { family_id: "${f3_id}", first_name: "Zane", date_of_birth: "2022-01-01" }
              as: PracticeAdmin
              captures: { child_z: "$.data.id" }
            - call: "GET /peds/families/${f3_id}"
              payload: {}
              as: PracticeAdmin
              captures: { f3_v0: "$.data.version" }
            - call: "GET /peds/physicians/${doc_id}/panel"
              payload: {}
              as: PracticeAdmin
              captures: { occ_june: "$.data.weighted_occupancy" }
          trigger:
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_z}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${f3_v0}" }
              as: PracticeAdmin
              captures: { err_id: "$.data.error_id" }
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "GET /peds/physicians/${doc_id}/panel"
              payload: {}
              as: PracticeAdmin
              captures: { occ_july: "$.data.weighted_occupancy" }
            - call: "GET /peds/families/${f3_id}"
              payload: {}
              as: PracticeAdmin
              captures: { f3_v1: "$.data.version" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_z}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-07-01", expected_family_version: "${f3_v1}" }
