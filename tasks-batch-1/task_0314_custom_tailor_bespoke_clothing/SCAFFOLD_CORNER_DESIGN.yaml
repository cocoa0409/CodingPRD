            - call: "POST /fabrics"
              payload: { name: "Wool AI", price_per_meter_cents: 8000, bolt_meters_initial: 50 }
              as: ShopManager
              captures: { f_id: $.data.id }
            - call: "POST /tailors"
              payload: { display_name: "Master AI", skill_tier: "MASTER" }
              as: ShopManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitting-rooms"
              payload: { room_name: "R AI", cleanup_buffer_minutes: 0 }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", measurement_profile_id: "${mp_id}", garment_type: "SUIT", base_labor_cents: 40000, fabric_meters_required: 7.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/option-lines"
              payload: { fabric_id: "${f_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/option-lines"
              payload: { fabric_id: "${f_id}", option_code: "CONTRAST_LINING" }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { o_v_conf: $.data.version }
            - call: "POST /orders/${o_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 48750 }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/fittings"
              payload: { tailor_id: "${tm_id}", room_id: "${ro_id}", milestone: "BASTED", start_at: "2026-07-15T09:00:00.000Z", end_at: "2026-07-15T10:00:00.000Z", expected_order_version: "${o_v_conf}" }
              as: FittingSpecialist
              captures: { fb: $.data.id, o_v_b: $.data.version }
            - call: "POST /orders/${o_id}/fittings/${fb}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o_id}/fittings"
              payload: { tailor_id: "${tm_id}", room_id: "${ro_id}", milestone: "FORWARD", start_at: "2026-07-16T09:00:00.000Z", end_at: "2026-07-16T10:00:00.000Z", expected_order_version: "${o_v_b}" }
              as: FittingSpecialist
              captures: { ff: $.data.id, o_v_f: $.data.version }
            - call: "POST /orders/${o_id}/fittings/${ff}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o_id}/fittings"
              payload: { tailor_id: "${tm_id}", room_id: "${ro_id}", milestone: "FINAL", start_at: "2026-07-17T09:00:00.000Z", end_at: "2026-07-17T10:00:00.000Z", expected_order_version: "${o_v_f}" }
              as: FittingSpecialist
              captures: { fn: $.data.id }
            - call: "POST /orders/${o_id}/fittings/${fn}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o_id}/alterations"
              payload: { description: "take in waist", billable_cents: 0 }
              as: FittingSpecialist
              captures: { t_id: $.data.id }
            - call: "POST /orders/${o_id}/alterations/${t_id}/void"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /orders/${o_id}/alterations/${t_id}/complete"
              payload: {}
              as: FittingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ALTERATION_INVALID_STATE"

      - name: remake_cycle_loops_back_to_in_fitting
        claim_type: Valid Transition
        grounds:
          - state_machines.GarmentOrder.REMAKE_to_IN_FITTING
        excluded_because:
          difficulty_instance: non_linear_state_machine / nonlinear_order_remake_cycle_in_fitting_to_remake_to_in_fitting
          rationale: "The REMAKE->IN_FITTING loop transition is asserted as the trigger outcome of the named §1.8 instance."

      - name: final_pass_bubbles_order_to_ready
        claim_type: Bubble up
        grounds:
          - state_machines.Fitting.SCHEDULED_to_PASSED
          - state_machines.GarmentOrder.IN_FITTING_to_READY
        distinguishing_aspect: "Recording PASS on a FINAL fitting bubbles the parent order IN_FITTING -> READY."
        test_recipe:
          setup: ["Order at SCHEDULED FINAL fitting (BASTED+FORWARD already PASSED), deposit paid."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bub Up", email: "bub.bu@x.com" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool BU", price_per_meter_cents: 8000, bolt_meters_initial: 50 }
