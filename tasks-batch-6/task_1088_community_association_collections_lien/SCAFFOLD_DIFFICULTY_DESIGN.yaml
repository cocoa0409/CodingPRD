  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ce_lien_requires_notice_sent
        grounds:
          - validations[priority=9]
          - state_machines.Notice.DRAFT_to_SENT
          - errors[ERR_DEMAND_NOTICE_REQUIRED]
        distinguishing_aspect: "Entity pair Lien<-Notice: recording a lien (Account DELINQUENT->LIEN) is gated on a Notice being SENT; with the INTENT_TO_LIEN notice still DRAFT the lien is refused ERR_DEMAND_NOTICE_REQUIRED and the account stays DELINQUENT."
        test_recipe:
          setup:
            - "Account DELINQUENT, balance 200000. INTENT_TO_LIEN notice created but left DRAFT (never sent). Clock 2026-05-01."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Vine HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "6", owner_name: "Ivy Lund" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 200000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "INTENT_TO_LIEN" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /collections/liens"
              payload: { account_id: "${acct_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_DEMAND_NOTICE_REQUIRED"
            - "GET /collections/accounts/${acct_id} data.status == DELINQUENT"
            - "GET /collections/liens?account_id=${acct_id} returns empty array (no lien recorded)"

      - name: ce_referral_requires_lien_recorded
        grounds:
          - validations[priority=9]
          - state_machines.Lien.RECORDED_to_RELEASED
          - errors[ERR_LIEN_REQUIRED]
        distinguishing_aspect: "A different entity pair ForeclosureReferral<-Lien: a referral requires the referenced Lien to be RECORDED; when the lien has been RELEASED the create is refused ERR_LIEN_REQUIRED, distinct from the Lien<-Notice dependency."
        test_recipe:
          setup:
            - "Account with a lien recorded (officer-1) then RELEASED. Attempt a foreclosure referral (officer-2) referencing the RELEASED lien."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
