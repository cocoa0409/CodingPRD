                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-27T10:00:00Z"
                    consent_signals: []
                  - external_id: "SE2"
                    email_raw: "se2@example.com"
                    phone_raw: "+1 (555) 270-0002"
                    loyalty_number: "LY00002702"
                    first_name: "Ben"
                    last_name: "Bravo"
                    postal_code: "20002"
                    address_line: null
                    event_timestamp: "2026-07-27T11:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
          trigger:
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
          assert:
            - "the response status is 200"
            - "IngestBatch.${batch_id}.status == PROMOTED and promoted_at == 2026-08-01T00:00:00Z"
            - "IngestBatch.${batch_id}.new_profile_count == 2, matched_deterministic_count == 0, matched_probabilistic_count == 0"
            - "SourceSystem.${src_id}.status == ACTIVE"
            - "GET /cdp/profiles with origin_batch_id == ${batch_id} returns total_count 2"
            - "both profiles have resolution_status RESOLVED, privacy_status NORMAL, source_record_count 1 and lifetime_value_cents 0"
            - "the first profile has contributing_source_system_codes == [SM_SIDE] and primary_source_system_id == ${src_id}"

      - name: requeue_on_validated_batch_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.IngestBatch.QUARANTINED_to_RECEIVED
          - validations[priority=21]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "requeue is declared only from QUARANTINED, so calling it on a VALIDATED batch is 409 ERR_INVALID_STATE and retry_round stays 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem and one VALIDATED batch of one fully valid record."
          setup_api_calls:
