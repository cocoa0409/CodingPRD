  # ------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved
  # quantities.  A forward action paired with its compensating action
  # must leave a named global quantity numerically unchanged.  Two
  # instances on two different conserved quantities, on two different
  # entity scopes.  Invariant A: Festival.outstanding_tickets_total
  # (the global ticket-issuance-minus-refunded count across the
  # festival's TicketTypes) is conserved across the apply-then-revert
  # of an ITEM_CANCEL ScheduleChange that has not yet been ACKed by the
  # external ticketing system — the revert clears the provisional-
  # refund bucket without affecting the integer issued and refunded
  # counters, so the outstanding-count is identical before and after
  # the apply/revert cycle, even though the transient state between
  # the apply and the revert has a non-zero provisional bucket.
  # Invariant B: SponsorTier.tier_remaining_quota (contracted_units −
  # Σ delivered_units across the tier's allocations) is conserved
  # across the deliver-then-void-delivery cycle on a single
  # ExposureAllocation — the void appends a FulfilmentLog row whose
  # event_type is either VOIDED (the manual operator call) or
  # PROGRAM_VOIDED (the ProgramItem-cancel cascade B variant) whose
  # `units` value exactly offsets the prior DELIVERED row's units, so
  # the allocation's delivered_units net-counter returns to its pre-
  # deliver value and the tier's remaining_quota returns to
  # contracted_units − (the pre-deliver delivered-total).  Two
  # different conserved quantities (an integer ticket-outstanding
  # count and an integer-units quota remainder on a per-sponsor
  # contract), two different entity scopes (Festival-level aggregate
  # vs SponsorTier-level aggregate), and two different forward-vs-
  # compensating action pairs (apply-vs-revert on a ScheduleChange vs
  # deliver-vs-void on an ExposureAllocation).  The rule-9 two-
  # invariants-on-different-quantities minimum is met cleanly.
  # ------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: outstanding_tickets_total_conserved_across_schedulechange_apply_revert
        grounds:
          - calculations.festival_outstanding_tickets_total
          - calculations.provisional_refund_amount
          - state_machines.ScheduleChange.PROPOSED_to_APPLIED
          - state_machines.ScheduleChange.APPLIED_to_REVERTED
          - entities.Festival.fields.outstanding_tickets_total
          - entities.TicketType.fields.issued_count
          - entities.TicketType.fields.refunded_count
          - entities.TicketType.fields.provisional_refund_cents_outstanding
          - entities.ScheduleChange.fields.provisional_refund_cents_total
          - entities.ScheduleChange.fields.final_refund_cents_total
          - entities.ScheduleChange.fields.status
          - endpoints.POST_/festivals/{fid}/ticket-types/{ticketTypeId}/issue
          - endpoints.POST_/festivals/{fid}/schedule-changes
          - endpoints.POST_/festivals/{fid}/schedule-changes/{changeId}/apply
          - endpoints.POST_/festivals/{fid}/schedule-changes/{changeId}/revert
          - errors.ERR_CHANGE_ALREADY_ACKED
          - global_constants.IDEMPOTENCY_WINDOW_SECONDS
        distinguishing_aspect: |
          The conserved quantity is the integer Festival.outstanding_
          tickets_total, defined in §1.3 `festival_outstanding_
          tickets_total` as the festival-wide sum of (issued_count
          minus refunded_count) over all TicketTypes.  The forward
          action is POST /festivals/{fid}/schedule-changes/{scid}/apply
          on a ScheduleChange of kind ITEM_CANCEL — which fires the
          provisional-refund computation, bulging the per-TicketType
          provisional_refund_cents_outstanding columns and stamping the
          schedule-change's provisional_refund_cents_total field, but
          notably does NOT touch the integer issued_count or
          refunded_count counters on the TicketTypes (those move only
          on the external-ticketing-system /_events/refund-confirmed
          ACK).  The compensating action is POST /schedule-changes/
          {scid}/revert, allowed only while no sync_envelope has yet
          flipped to ACKNOWLEDGED (the rule of ERR_CHANGE_ALREADY_ACKED
          at the §1.6 catalog), which atomically zeroes the per-
          TicketType provisional buckets that were bulged at apply
          time and flips every sync_envelopes element from QUEUED to
          CANCELLED.  Since the issued and refunded counters were
          untouched by the apply and are untouched by the revert
          (because no external ACK happened in the apply→revert
          window), Festival.outstanding_tickets_total is numerically
          identical before the apply and after the revert.  The
          transient state between the apply and the revert exhibits a
          non-zero provisional-bucket value, which the test observes
          and asserts as the 'apply did real work' falsifiable evidence
          alongside the 'revert restored the global invariant' main
          assertion.  This invariant lives on the Festival-level
          aggregate quantity (an integer ticket count) and is
          structurally distinct from invariant B's per-SponsorTier
          quota-remainder integer-units quantity.
        test_recipe:
          setup:
            - "POST /festivals — three-day Festival 'F' (so festival_day_count == 3 and the provisional refund's pro-rata denominator is 3).  POST /open-scheduling.  POST one Stage 'Main' with zone_capacity=100 and equipment_kits=[].  POST one OPENER artist 'A_tic' with empty external_commitments.  POST one DRAFT-then-PUBLISHED ProgramVersion v1 containing one CONFIRMED ProgramItem 'P_tied' for A_tic on Main inside the festival window.  Festival.status flips to PUBLISHED on the publish of v1, Festival.current_program_version_id = v1.id."
            - "POST /festivals/{fid}/ticket-types — three ticket types in different price brackets, each tied to P_tied: TT_single (ticket_class='SINGLE_DAY', tied=[P_tied.id], zone_name='Z1', unit_price_cents=6000); TT_full (ticket_class='FULL_FESTIVAL', tied=[P_tied.id], zone_name='Z1', unit_price_cents=18000); TT_vip (ticket_class='VIP', tied=[P_tied.id], zone_name='ZVIP', unit_price_cents=50000).  Note all three are tied to the same single program item P_tied, but they sit in two different zone names — the zone-capacity rule of rule 6 instance B does not interact here because TT_vip is in a different zone group than TT_single and TT_full, and the zone capacities of Stage Main and any VIP-zone-tied stage (we'll add a 'BackstageMezz' stage if needed; for simplicity assume the VIP zone shares Main's zone_capacity=100 because Main is also tied to TT_vip's tied_program_item_ids' stage list, and the §1.3 ticket_zone_capacity_check's 'max(stage.zone_capacity for stage in zone_stages)' picks the Main stage's 100).  Actually the zone_name discriminator partitions the zone groups: 'Z1' is the zone for TT_single and TT_full (cumulative count over both types capped at zone_capacity), and 'ZVIP' is its own zone group with TT_vip alone (cumulative cap also at zone_capacity since the tied stage is the same Main stage).  Two zone groups, each independently capped, neither hitting the cap in this test because the issuance counts will be small."
            - "POST /festivals/{fid}/ticket-types/{TT_single.id}/issue with body {count: 7, idempotency_key: 'iss-single-7'} — TT_single.issued_count = 7.  POST /ticket-types/{TT_full.id}/issue with body {count: 3, idempotency_key: 'iss-full-3'} — TT_full.issued_count = 3.  POST /ticket-types/{TT_vip.id}/issue with body {count: 2, idempotency_key: 'iss-vip-2'} — TT_vip.issued_count = 2.  Festival.outstanding_tickets_total computes from §1.3 festival_outstanding_tickets_total as Σ (issued − refunded) over the three types = (7 − 0) + (3 − 0) + (2 − 0) = 12.  This is the pre-cycle baseline value of the conserved quantity.  AuditEntry rows for each issue."
            - "Pre-cycle GET on Festival.outstanding_tickets_total: 12.  Pre-cycle per-TicketType provisional_refund_cents_outstanding columns are all zero — no pending refunds.  Pre-cycle ScheduleChange table is empty (no changes proposed yet).  This is the rule-9-A invariant's pre-action snapshot.  The full quintuple (Festival.outstanding_tickets_total, TT_single.provisional_refund_cents_outstanding, TT_full.provisional_refund_cents_outstanding, TT_vip.provisional_refund_cents_outstanding, ScheduleChange.provisional_refund_cents_total) at this baseline is (12, 0, 0, 0, no-rows).  The test will compare this tuple's first component (the conserved quantity) before and after the apply→revert cycle, and observe the bulge in the other components in the apply-but-not-yet-reverted intermediate state."
          trigger:
            - "POST /festivals/{fid}/schedule-changes with body {change_kind: 'ITEM_CANCEL', target_program_item_id: P_tied.id, payload: {reason: 'compensating-invariant test'}, idempotency_key: 'sc-cancel-test'} — a PROPOSED ScheduleChange row C_inv with status PROPOSED, four QUEUED sync_envelopes are NOT yet created at the propose step (the §1.2 ScheduleChange.PROPOSED-to-APPLIED transition's side-effect list is what seeds the envelopes, so propose-only is the no-cascade preamble step).  Actually re-reading the §1.2 wording on the PROPOSED initial state's create-side-effect: 'PROPOSED upon POST.  Branching fork: PROPOSED → APPLIED on apply (the cascade fires), or PROPOSED → REJECTED on explicit reject.'  So at propose time the row exists in PROPOSED with no envelopes and no provisional cents.  An AuditEntry of event_category='SCHEDULE_CHANGE' is appended for the propose step."
            - "POST /festivals/{fid}/schedule-changes/{C_inv.id}/apply — the forward action.  Per §1.2 the apply's side-effects include: the target ProgramItem P_tied flips CONFIRMED → CANCELLED (link 1 of the depth-3 cascade A — the rule-4 trigger fires here, but for rule-9 instance A's purpose we focus on the ticketing-side bulge); the provisional_refund_amount formula in §1.3 fires per the trigger 'ScheduleChange.apply when change_kind == ITEM_CANCEL'.  For each TicketType in the tied set, the formula computes per_ticket_cents = round_half_up(unit_price_cents × cancelled_days / festival_day_count), summed across the type's outstanding tickets, and increments TT.provisional_refund_cents_outstanding by that per-type total.  cancelled_days is 1 per the formula's note 'the cancelled item occupies one day in the per-day taxonomy of the scenario; multi-day cancellations are not in scope', festival_day_count is 3, so per-ticket cents are: TT_single = round_half_up(6000 × 1 / 3) = round_half_up(2000) = 2000 cents per ticket; TT_full = round_half_up(18000 × 1 / 3) = 6000 cents per ticket; TT_vip = round_half_up(50000 × 1 / 3) = round_half_up(16666.6667) = 16667 cents per ticket (half-up of the third decimal's .67 lands on the next integer for the standard banker's-half-up convention — actually the §1.3 formula's wording is 'half-up' not 'banker's', so the rule is the standard 'round half away from zero', and 50000/3 = 16666.666... has a fractional part of 0.666... which is greater than 0.5 so it rounds up to 16667.  The integer-cents result is 16667).  Per-type provisional totals = outstanding-count × per-ticket-cents: TT_single = 7 × 2000 = 14000 cents; TT_full = 3 × 6000 = 18000 cents; TT_vip = 2 × 16667 = 33334 cents.  ScheduleChange.provisional_refund_cents_total = 14000 + 18000 + 33334 = 65334 cents.  The per-TicketType provisional_refund_cents_outstanding columns now hold the matching per-type totals: (TT_single: 14000, TT_full: 18000, TT_vip: 33334).  The four sync_envelopes are seeded QUEUED with targets {'ticketing','im','broadcasting','sponsor'}.  The ScheduleChange's applied_at is stamped.  The cascade A side-effects on the sound-check subsystem are no-ops here because P_tied has no associated sound-check slots (the test setup deliberately omitted them to keep the rule-9-A test focused on the ticketing-side bulge), and the cascade B side-effects on the exposure-allocation subsystem are no-ops because there are no ExposureAllocations tied to P_tied either.  Auditentry chain.  Crucially, the integer counters TT.issued_count and TT.refunded_count are *not* touched by the apply — issued and refunded only move on /_events/refund-confirmed.  So Festival.outstanding_tickets_total = Σ (issued − refunded) is unchanged at 12.  This is the transient intermediate state's most important observation: the global conserved quantity has not moved, but the ScheduleChange and the per-TicketType provisional buckets have all bulged."
            - "Intermediate snapshot: GET /festivals/{fid} returns Festival.outstanding_tickets_total still == 12, GET on each TicketType returns issued_count unchanged (7, 3, 2) and refunded_count unchanged (0, 0, 0), but provisional_refund_cents_outstanding non-zero (14000, 18000, 33334).  GET /festivals/{fid}/schedule-changes/{C_inv.id} returns status=='APPLIED', applied_at non-null, provisional_refund_cents_total == 65334, final_refund_cents_total == null (no external ACK yet), sync_envelopes is a four-element array with targets in the canonical order and all four in status QUEUED with queued_at stamps and payload_hash strings populated.  An AuditEntry of event_category=='SCHEDULE_CHANGE' with payload_summary mentioning the provisional total 65334 cents is appended.  The transient bulge in the provisional bucket is the 'apply did real work' falsifiable side, the unchanged Festival.outstanding_tickets_total is the 'global invariant is preserved through the transient state' main observation.  The test does NOT advance the wall clock and does NOT POST a /_events/refund-confirmed or any /_events/sync-ack — those would flip the conserved quantity (refunded_count would tick up, outstanding_total would drop) and would also flip the change's status toward SYNCED.  Holding the change in the APPLIED-without-ACK state is the precondition for the revert path (the §1.4 priority-9-or-the-state-gate ERR_CHANGE_ALREADY_ACKED would fire on revert if any envelope had ACKed)."
            - "POST /festivals/{fid}/schedule-changes/{C_inv.id}/revert — the compensating action.  The precondition is 'no sync_envelopes element has reached ACKNOWLEDGED yet'.  All four envelopes are QUEUED, so the precondition passes.  Per the §1.2 ScheduleChange APPLIED→REVERTED transition's side-effect set: 'the target item's status is restored to the from_state recorded in the apply's AuditEntry' (P_tied is restored from CANCELLED back to CONFIRMED), 'TicketType.provisional_refund_cents_outstanding rows that were incremented at apply are decremented back to zero' (the three provisional buckets reset to (0, 0, 0)), 'all four sync_envelopes elements that were QUEUED transition to status=CANCELLED' (the four-element array is now all CANCELLED), 'no real refund is ever issued because the ticketing-system ACK never arrived' (the integer issued_count and refunded_count are still untouched).  An AuditEntry of event_category=='SCHEDULE_CHANGE' with payload_summary 'reverted' is appended.  The ScheduleChange.status flips APPLIED → REVERTED.  The change's provisional_refund_cents_total field retains its 65334 cents value (the column is monotone, only zeroed by the per-TicketType decrement that targets the TicketType-side provisional column, not the ScheduleChange-side total — actually the §1.2 wording says 'the per-TicketType provisional_refund_cents_outstanding rows...are decremented back to zero', which is the TicketType-side bucket; the ScheduleChange's own provisional_refund_cents_total field is the snapshot of the apply moment's computation and stays at 65334 as a historical record of what the apply attempted.  The final_refund_cents_total stays null.  This split — TicketType-side bucket cleared, ScheduleChange-side historical-total preserved — is a subtle implementation detail that the test asserts by reading both columns separately at the post-revert state.  The TicketType column going to zero is the 'pending refunds are dropped' contract, the ScheduleChange column's preserved 65334 is the 'audit record of the apply's intent' contract."
            - "Post-cycle snapshot: GET /festivals/{fid} returns Festival.outstanding_tickets_total == 12 (the conserved quantity is identical to the pre-cycle value).  GET on each TicketType returns issued_count == (7, 3, 2) and refunded_count == (0, 0, 0) (unchanged from baseline) and provisional_refund_cents_outstanding == (0, 0, 0) (the bulge has been retracted).  GET on the change returns status='REVERTED', applied_at non-null (the apply happened), revert_at-equivalent non-null (the spec doesn't pin a 'reverted_at' field on the ScheduleChange entity; the post-revert state is observable through the status enum and the sync_envelopes' CANCELLED state alongside the AuditEntry stream's revert entry's created_at), provisional_refund_cents_total == 65334 (the historical apply-time figure, preserved), final_refund_cents_total still null (no external ACK happened), sync_envelopes array's four elements all in status 'CANCELLED' with their queued_at preserved and a fresh cancelled_at-equivalent.  The §1.2 wording mentions a status enum extension {QUEUED, ACKNOWLEDGED, FAILED, CANCELLED} where CANCELLED is the revert-path-specific value, and the test asserts the four envelopes are exactly that value.  P_tied.status is back to 'CONFIRMED' (the target item's state restoration, per the revert's side-effect set).  An AuditEntry of event_category='SCHEDULE_CHANGE' with the 'reverted' marker in payload_summary is the closing entry of the cycle.  The rule-9-A invariant's central assertion is that Festival.outstanding_tickets_total before the cycle (12) equals Festival.outstanding_tickets_total after the cycle (12), with the transient apply-state's snapshot showing the provisional bucket bulged to (14000, 18000, 33334) cents and the post-revert state showing the bucket back to (0, 0, 0)."
            - "Negative-control: the revert-precondition's 'no ACK has happened' clause is testable as a separate sub-case.  Re-do the apply on a fresh ScheduleChange C_inv_2 with the same tied program-item (which is back in CONFIRMED state after the previous revert restored it), then issue a single /_events/sync-ack on say the 'broadcasting' target with succeeded=true (no refund-confirmed on the ticketing target, so no integer counter movement, but the broadcasting envelope flips ACKNOWLEDGED).  Now POST /revert on C_inv_2 — expected response: 409 ERR_CHANGE_ALREADY_ACKED.  The change stays in status 'APPLIED' with one ACKed envelope and three QUEUED.  This negative case nails the precondition's 'at least one envelope has ACKed' rejection contract — once any external system has observed the change, the in-flight inverse-without-an-external-counter-action is no longer the right compensating mechanism.  The two outcomes — revert-while-fully-QUEUED succeeds, revert-after-any-ACK fails with the named error — together establish the precondition's discrete-on-the-ACK-count threshold (the boundary is 'count of ACKed envelopes == 0' is OK, count ≥ 1 is rejected).  This boundary is on the integer-count-of-ACKed-envelopes metric, which is yet another instance of the boundary-precision rule (rule 6's metric of an integer-count threshold) but the test's emphasis here is on the rule-9 invariant rather than the boundary precision, so the negative-control is the supporting evidence for the apply→revert window's atomicity contract."
            - "External-ticketing-confirmed-after-revert noise sub-case (which is the contract's exception to the conservation): after the revert succeeds on C_inv_1, if a stale /_events/refund-confirmed payload arrives referencing the now-REVERTED change, the §1.4 priority-5-state-gate on the schedule-change row's status fires with ERR_CHANGE_NOT_APPLIED (or the §1.6 catalog's ERR_SYNC_ENVELOPE_NOT_QUEUED for the per-envelope precondition, since the four envelopes are all in CANCELLED status now, the §1.2.1 'ack-vs-revert race' precondition wording uses ERR_SYNC_ENVELOPE_NOT_QUEUED for the envelope-not-in-QUEUED-status loser, http 409).  The stale ACK is rejected, the integer counters do not move, the conserved quantity Festival.outstanding_tickets_total remains 12.  This is the rule's robustness against the external system's eventual-consistency window — a late ACK arriving after the operator-reverted-the-change cannot bypass the local cancellation and the conserved quantity is unaffected.  Test asserts the late-ACK rejection's error_id and the unchanged outstanding-total."
          assert:
            - "Pre-apply baseline: Festival.outstanding_tickets_total == 12.  Per-TicketType (issued_count, refunded_count, provisional_refund_cents_outstanding) triplets are (7, 0, 0), (3, 0, 0), (2, 0, 0) for TT_single, TT_full, TT_vip respectively.  The ScheduleChange table contains the PROPOSED C_inv with no envelopes seeded (the propose step alone does not seed the four-element sync_envelopes array; the apply does, per the §1.2 state-machine wording on the PROPOSED→APPLIED transition's side-effect list).  An AuditEntry exists for the create of C_inv with event_category=='SCHEDULE_CHANGE' and from_state=null/to_state='PROPOSED'-equivalent meta."
            - "Post-apply intermediate state (the transient bulge): Festival.outstanding_tickets_total UNCHANGED at 12.  Per-TicketType issued_count and refunded_count UNCHANGED at (7,0), (3,0), (2,0).  Per-TicketType provisional_refund_cents_outstanding bulged to (14000, 18000, 33334) cents — the worked-example arithmetic from §1.3 provisional_refund_amount with cancelled_days=1 and festival_day_count=3.  C_inv.status='APPLIED', C_inv.provisional_refund_cents_total == 65334 (= 14000+18000+33334), C_inv.final_refund_cents_total == null, C_inv.applied_at is a non-null ISO timestamp, C_inv.sync_envelopes is a four-element array all in status 'QUEUED' with the four targets {'ticketing','im','broadcasting','sponsor'} in their canonical order (the order the apply seeds them in, which the §1.2 wording does not pin but the implementation typically alphabetises or uses the order from the §1.1 ScheduleChange.sync_envelopes field's description).  P_tied.status == 'CANCELLED' (the cascade A's link 1 effect on the target program item).  An AuditEntry of event_category='SCHEDULE_CHANGE' with payload_summary mentioning '65334' (the cents total) and 'apply' is appended.  The conserved-quantity invariant in the intermediate state is the equality Festival.outstanding_tickets_total_post_apply == Festival.outstanding_tickets_total_pre_apply == 12 — the apply moved provisional cents but did not move integer counters, so the global invariant holds *during* the transient as well, not just at the post-revert endpoint.  This is the 'transient still satisfies the invariant' observation; the bulge is in a sibling column that the invariant does not reference.  The bulge in the provisional column is the evidence that the apply did real bookkeeping work — without it, an implementation could trivially satisfy the invariant by no-op'ing the apply.  The test asserts both the unchanged invariant *and* the non-zero provisional bulge in the same intermediate snapshot."
            - "Post-revert final state (the conservation): Festival.outstanding_tickets_total == 12 — IDENTICAL to the pre-apply value, the rule-9-A invariant's main assertion.  Per-TicketType issued_count and refunded_count UNCHANGED at (7,0), (3,0), (2,0).  Per-TicketType provisional_refund_cents_outstanding back to ZERO across all three types (0, 0, 0) — the bulge has been retracted.  C_inv.status == 'REVERTED', C_inv.provisional_refund_cents_total is preserved at 65334 cents (the historical apply-time computation is kept in the audit-trail role; the column is monotone in the sense that the revert doesn't zero it on the ScheduleChange row, only on the per-TicketType bucket).  C_inv.final_refund_cents_total is still null (no external ACK happened).  C_inv.applied_at is preserved (the apply moment is the historical mark).  C_inv.sync_envelopes' four elements are all in status 'CANCELLED' (the revert-path-specific status extension of the QUEUED|ACKNOWLEDGED|FAILED|CANCELLED enum), with their queued_at timestamps preserved and the implementation may stamp a cancelled_at timestamp on each (the §1.1 wording on the sync_envelopes element shape lists 'queued_at, acked_at, payload_hash' but the revert-cancellation timestamp is implementation-implementation-implicit; the test asserts the status field's transition without nailing the exact name of the cancellation timestamp field).  P_tied.status is back to 'CONFIRMED' (the from_state recorded at the apply's audit entry is the restore target, per the §1.2 REVERTED-transition wording 'the target item's status is restored to the from_state recorded in the apply's AuditEntry').  An AuditEntry of event_category='SCHEDULE_CHANGE' with payload_summary containing the substring 'reverted' is the closing entry."
            - "Conservation equality (the rule-9-A central assertion): the integer Festival.outstanding_tickets_total has the value 12 at three snapshots — pre-apply, intermediate (between apply and revert), and post-revert.  The three readings are bit-identical.  The transient state's bulge in the per-TicketType provisional buckets (14000, 18000, 33334 cents at the intermediate snapshot, the worked-example literal that the §1.3 provisional_refund_amount formula's pinned arithmetic produces for the (unit_price_cents, outstanding_count, cancelled_days, festival_day_count) = ((6000, 7), (18000, 3), (50000, 2), 1, 3) inputs across the three ticket types) is the falsifiable evidence that the apply did real work — without the bulge a no-op-apply would trivially satisfy the conservation, the bulge demonstrates the apply changed sibling state without disturbing the conserved-quantity column.  The post-revert zeroing of the provisional buckets is the revert's cleanup, mirroring the apply's set-up, and the equality issued_count − refunded_count is preserved throughout because neither end of the cycle touched those columns (the external /_events/refund-confirmed is the only path that moves them, and it didn't fire in this test)."
            - "Negative-control on the revert precondition (the boundary on ACKed-envelope-count): the variant where one envelope is ACKed before the revert call returns http 409 with error_id == 'ERR_CHANGE_ALREADY_ACKED'.  The change stays in APPLIED status with the one ACKed envelope and three QUEUED envelopes, and the provisional buckets remain bulged.  The integer counters are still unchanged because the single ACK on a non-ticketing target ('broadcasting' in the negative-control setup) does not pump issued_count or refunded_count — those move only on the /_events/refund-confirmed path on the ticketing target.  So the conserved Festival.outstanding_tickets_total is STILL 12 in this stuck-in-APPLIED-with-one-ACK state, but the revert path is closed, the implementation's operator-recovery is to either let the remaining ACKs come in naturally (advancing the change to SYNCED) or to issue a separate inverse ScheduleChange of kind ITEM_CANCEL's-inverse (re-instating-the-item, which the scaffold's change_kind enum doesn't natively encode and would require an out-of-band procedure).  This control demonstrates the revert-only-while-fully-QUEUED contract is a discrete boundary on the ACKed-envelope-count integer metric, and the conserved quantity is robust to either side of the boundary because no integer-counter-moving event fires in either scenario."
            - "Stale-late-ACK rejection: a /_events/refund-confirmed targeting the now-REVERTED C_inv_1 returns http 409 with error_id in the family {'ERR_SYNC_ENVELOPE_NOT_QUEUED', 'ERR_CHANGE_NOT_APPLIED'} (the §1.6 catalog has both, the §1.2.1 concurrency-rules' 'ack-vs-revert race' loser-error wording references ERR_SYNC_ENVELOPE_NOT_QUEUED for the envelope-status-not-QUEUED case, and the §1.4 state-gate priority-5 framework's ERR_CHANGE_NOT_APPLIED is the change-status-not-APPLIED check).  The four envelopes are all in CANCELLED status, the change is in REVERTED status, so both checks have grounds to fire and the implementation's check-order picks one — the test asserts the error_id is *one of* the two acceptable ids via an `in` predicate.  Integer counters do not move on this rejected ACK.  Festival.outstanding_tickets_total remains 12.  The conservation holds across the entire flow including the late-ACK noise.  This is the eventual-consistency robustness aspect of the invariant — the local store's compensation must be untouched by stale external echoes."
            - "Cross-instance disambiguation from rule-9 instance B: the conserved quantity here is the festival-wide ticket-outstanding count (an integer aggregated across TicketType rows in a single Festival), and the forward/compensating actions are the ScheduleChange.apply and ScheduleChange.revert on a single change row.  Instance B's conserved quantity is the per-sponsor-tier quota remainder (an integer aggregated across ExposureAllocation rows under a single SponsorTier), and the forward/compensating actions are ExposureAllocation.deliver and ExposureAllocation.void-delivery on a single allocation row.  Two different conserved quantities (a count vs a quota-remainder), two different aggregation scopes (festival-wide vs single-sponsor-tier-wide), two different forward-and-compensating-action pairs (ScheduleChange apply/revert vs ExposureAllocation deliver/void).  The §0.5 rule-9 wording 'different types of conserved quantities' is the differentiation the two instances honour."

      - name: sponsor_tier_remaining_quota_conserved_across_deliver_void_round_trip
        grounds:
          - calculations.sponsor_tier_remaining_quota_invariant
          - state_machines.ExposureAllocation.PLANNED_to_DELIVERED
          - state_machines.ExposureAllocation.DELIVERED_to_VOIDED
          - state_machines.ExposureAllocation.DELIVERED_self_loop
          - entities.SponsorTier.fields.contracted_units
          - entities.SponsorTier.fields.tier_remaining_quota
          - entities.ExposureAllocation.fields.delivered_units
          - entities.ExposureAllocation.fields.actual_units
          - entities.FulfilmentLog.fields.event_type
          - entities.FulfilmentLog.fields.units
          - endpoints.POST_/festivals/{fid}/sponsor-tiers
          - endpoints.POST_/festivals/{fid}/sponsor-tiers/{tierId}/exposure-allocations
          - endpoints.POST_/festivals/{fid}/sponsor-allocation-sweep
          - endpoints.POST_/festivals/{fid}/exposure-allocations/{allocationId}/deliver
          - endpoints.POST_/festivals/{fid}/exposure-allocations/{allocationId}/void-delivery
          - endpoints.GET_/festivals/{fid}/sponsor-tiers/{tierId}
          - endpoints.GET_/festivals/{fid}/exposure-allocations/{allocationId}
        distinguishing_aspect: |
          The conserved quantity is SponsorTier.tier_remaining_quota,
          defined in §1.3 `sponsor_tier_remaining_quota_invariant` as
          contracted_units minus Σ ExposureAllocation.delivered_units
          for the tier's allocations.  The delivered_units on each
          allocation is itself the net of (DELIVERED FulfilmentLog
          units) − (VOIDED FulfilmentLog units) − (PROGRAM_VOIDED
          FulfilmentLog units), the §1.1 wording of FulfilmentLog and
          the §1.3 actual_exposure_fulfilment_pct formula's `tier_
          delivered = Σ_a a.delivered_units` clause make the
          accumulator explicit.  The forward action is POST /exposure-
          allocations/{aid}/deliver with a non-zero units payload (a
          successful delivery appends a DELIVERED FulfilmentLog row of
          the given units and atomically bumps the allocation's
          delivered_units net counter by that amount, dropping the
          tier's remaining_quota by the same amount).  The compensating
          action is POST /exposure-allocations/{aid}/void-delivery with
          a body whose `units` defaults to the allocation's current
          delivered_units (the §1.5 endpoint description says 'units?
          defaults to current delivered_units so the inverse balances
          cleanly per rule 9 instance B'), which appends a VOIDED
          FulfilmentLog row of that magnitude.  The cascade-variant
          PROGRAM_VOIDED (when the void arises from a ProgramItem-
          cancel cascade rather than a manual operator call) has the
          same effect on the net-delivered-units counter — the units
          field on the PROGRAM_VOIDED log row is the allocation's
          pre-cascade delivered_units, so the net returns to zero
          after the cascade fires, and the tier's remaining_quota
          returns to contracted_units − 0 = contracted_units.  Two
          variants of the void (manual VOIDED and cascade PROGRAM_
          VOIDED) both honour the invariant.  Distinct from instance
          A's ScheduleChange.apply/revert pair on the ticketing-
          outstanding-count quantity — different entity, different
          quantity, different action pair.
        test_recipe:
          setup:
            - "Standard Festival 'F' in PUBLISHED, one Stage 'Main' with zone_capacity=100 and equipment_kits=[], one DRAFT-then-PUBLISHED ProgramVersion v1 containing one CONFIRMED OPENER-tier ProgramItem 'P_perf' for an artist 'A_perf' on Main inside the festival window.  Note: for the ExposureAllocation.deliver precondition (the §1.2 ExposureAllocation.PLANNED→DELIVERED transition's wording 'Tied ProgramItem.status == PERFORMED for allocations with non-null program_item_id'), we need P_perf to be in PERFORMED status by the time the deliver call fires.  The clock-advance dance: publish v1 (Festival flips SCHEDULING → PUBLISHED), POST /_clock/advance to cross Festival.start_time (Festival flips PUBLISHED → LIVE), POST /announce on P_perf (status CONFIRMED → ANNOUNCED, a TICKET_NOTIFY ScheduleChange is auto-emitted with four QUEUED sync envelopes which we'll ignore for this test since they live on the rule-9-A axis, not the rule-9-B axis), POST /_clock/advance to cross P_perf.start_time (status ANNOUNCED → ON_STAGE auto-transition), and POST /_clock/advance to cross P_perf.end_time (status ON_STAGE → PERFORMED auto-transition).  Now P_perf.status == 'PERFORMED' and the deliver precondition for an allocation tied to P_perf is satisfied.  Festival.status is still LIVE (the test does not advance past Festival.end_time + grace, so the festival hasn't closed yet)."
            - "POST /festivals/{fid}/exposure-catalog with body {catalog: {stage_name: 100, screen_time: 100, artist_mention: 100, branded_zone: 100}} — generous catalog pools so the waterfall does not trim the sponsor's requested units."
            - "POST /festivals/{fid}/sponsor-tiers — one TITLE-code sponsor tier 'Apex' with priority_rank=1, sponsor_external_id='apex-001', sponsor_display_name='Apex Corp', contracted_units=10 (the conserved quantity's denominator-equivalent), contract_kinds_allowed=['stage_name','screen_time','artist_mention','branded_zone'] (all four kinds permitted, no referential-rule interference)."
