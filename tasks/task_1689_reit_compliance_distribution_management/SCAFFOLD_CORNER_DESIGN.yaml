            - "RB: trs_concentration_pct == 20.0001, trs_test_passed == false, status == BREACHED"

      - name: distribution_requirement_90_percent_and_floor
        claim_type: correct_result
        grounds: [calculations.calc_distribution_requirement]
        distinguishing_aspect: "required = 90% of (taxable income - net capital gain): (900000-100000) -> 720000; and the floor: taxable income below net capital gain (100000 vs 200000) pins required_amount_cents to 0."
        test_recipe:
          setup: ["Reit R1 ACTIVE; two DRAFT requirements: 2026 (ti 900000, ncg 100000) and 2027 (ti 100000, ncg 200000)"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "C3 REIT", ticker: "C3RE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
