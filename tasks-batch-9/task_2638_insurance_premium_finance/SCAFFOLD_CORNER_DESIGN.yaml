              as_user_id: "${cv_agent_az}"
            - call: "POST /agreements/${cv_agr_az}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { cv_az_act: "$.data.status", cv_az_top: "$.data.total_of_payments_cents" }
            - call: "POST /state-rate-rules/${cv_tx}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { cv_tx_lic: "$.data.id", cv_tx_lic_eff: "$.data.is_effective" }
            - call: "POST /agreements"
              payload: { insured_id: "${cv_insured}", producer_agent_id: "${cv_agent_tx}", state_rule_id: "${cv_tx}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { cv_agr_tx: "$.data.id", cv_agr_tx_status: "$.data.status" }
            - call: "POST /state-rate-rules/${cv_az}/licenses"
              payload: { license_number: "PFC-AZ-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { cv_az_lic: "$.data.id" }
