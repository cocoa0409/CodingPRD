          setup:
            - "Cycle, team T-A, employee E-1001 with no classification (required_days 5, multiplier 1.5) and a FINALIZED 2026-W37 week carrying no signals at all: shortfall 5 and pressure round_half_up(5 * 1.5 + 1, 2) == 8.50."
