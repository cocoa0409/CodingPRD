            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v2}" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { err_dup: $.data.error_id }
            - call: "POST /enrollments/${first_enr_id}/cancellation"
