      - name: attraction_posture_frozen_outranks_restricted
        claim_type: correct_result
        grounds:
          - calculations.attraction_posture
          - entities.Store.fields.attraction_posture
          - errors[ERR_POSTURE_FROZEN]
          - errors[ERR_POSTURE_RESTRICTED]
        distinguishing_aspect: |
          The posture predicate is an ordered if-chain evaluated on the same
          committed dwell minutes, so an identical 120-minute commit against a
          100-minute budget reads FROZEN while the same commit against a
          140-minute budget reads RESTRICTED, and the two stores raise two
          different error ids.
        test_recipe:
          setup: ["two stores with capacities 100 and 140, each with an open aquarium of capacity 40 and dwell_cost_minutes 30, and one member"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Tight Cove", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 100, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_tight_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Roomy Cove", state_code: "MO", dealer_license_no: "MO-DLR-4418", dwell_capacity_minutes: 140, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_roomy_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
