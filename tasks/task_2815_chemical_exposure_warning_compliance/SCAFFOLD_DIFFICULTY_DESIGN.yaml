  - rule_id: priority_pair_validation_conflict
    instances:

      - name: finalize_from_draft_reports_illegal_transition_over_missing_peer_review
        grounds:
          - validations[priority=40]
          - validations[priority=55]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_PEER_REVIEW_REQUIRED]
          - state_machines.ExposureAssessment.SUBMITTED_to_FINAL
