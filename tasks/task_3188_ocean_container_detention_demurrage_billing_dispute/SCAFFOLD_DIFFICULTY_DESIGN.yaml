              as: TerminalOperator
              captures: { cntr_k0: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_k0}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_k0}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
              captures: { k0_dem: $.data.demurrage_amount_cents, k0_days: $.data.demurrage_billable_days }
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000136", equipment_type: "DRY40", customer_account_id: "${acct_k}", service_contract_id: "${ctr_k5}", terminal_id: "${term_oak}", discharge_ts: "2026-09-07T12:00:00Z", available_ts: "2026-09-08T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_k5: $.data.id }
