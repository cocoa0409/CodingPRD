    grounds:
    - state_machines.Gauge.IN_SERVICE_to_GRR_FAILED
    - state_machines.Gauge.GRR_FAILED_to_RETIRED
    - state_machines.Gauge.CALIBRATION_DUE_to_IN_SERVICE
    distinguishing_aspect: |
      The gauge cycle branches on the posted grr_pct: 18.0 lands in GRR_FAILED, a follow-up 7.5 returns it to IN_SERVICE, and a final 42.0 retires it permanently, with calibration_count reaching 3.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; gauge MIC-207 is IN_SERVICE with grr_pct 6.2.
      setup_api_calls:
