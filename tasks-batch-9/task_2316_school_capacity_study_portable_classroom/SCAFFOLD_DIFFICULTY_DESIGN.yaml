  - rule_id: priority_pair_validation_conflict
    instances:

      - name: site_school_mismatch_outranks_pad_too_small
        grounds:
          validations: [20, 30]
          entities: [PlacementRequest, PlacementSite, CapacityStudy, PortableUnit]
          endpoints: ["POST /facilities/placement-requests"]
        higher_priority: { priority: 20, category: business_referential, error_id: ERR_SITE_SCHOOL_MISMATCH }
        lower_priority: { priority: 30, category: business_constraint, error_id: ERR_PAD_TOO_SMALL }
        distinguishing_aspect: >
          The request names a pad that belongs to a different campus than the study
          and that pad is also 8 ft too short for the assigned single-wide. Both
          conditions hold on the same call and the two errors carry the same 422
          status, so the response is only distinguishable by error_id. Referential
          integrity is checked first, so the answer is ERR_SITE_SCHOOL_MISMATCH.
          The control calls prove each rule fires on its own: pointing at the same
          undersized pad on the correct campus yields ERR_PAD_TOO_SMALL, and
          pointing at a correctly sized pad on the wrong campus still yields
          ERR_SITE_SCHOOL_MISMATCH.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-01T00:00:00Z" }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/class-size-policies"
            payload: { grade_band: "G7_8", effective_school_year: "2027-28", max_class_size: 28, min_area_sqft_per_seat: 30, lab_area_premium_sqft: 20 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { policy_id: id }
          - call: "POST /facilities/schools"
            payload: { name: "Alder Middle", grade_configuration: "MIDDLE_68", site_acreage: 8.0, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1, consecutive_reliance_years: 0 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { study_school_id: id, study_school_version: version }
          - call: "POST /facilities/schools"
            payload: { name: "Birch Middle", grade_configuration: "MIDDLE_68", site_acreage: 8.0, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1, consecutive_reliance_years: 0 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { other_school_id: id }
          - call: "POST /facilities/rooms"
            payload: { school_id: "${study_school_id}", room_number: "R101", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${study_school_id}", room_number: "R102", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
            as: DistrictAdmin
            as_user_id: "admin-1"
