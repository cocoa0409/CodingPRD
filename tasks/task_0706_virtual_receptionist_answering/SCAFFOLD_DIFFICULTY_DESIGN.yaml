          setup:
            - "PER_MINUTE plan included_minutes=0, tier2_threshold=100, R1=100, hard_cap_overage_cents=300."
            - "Account on that plan; PUBLISHED 24h script; AVAILABLE EN receptionist; OPEN slot capacity 1 buffer 0 with one CONFIRMED appointment."
