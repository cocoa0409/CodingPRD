            - "verify-repair by fs-2 succeeds; Leak.${leak_rb3}.status == VERIFIED_REPAIR"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_dma_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[water-balance-submit-stale-dma]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a balance with expected_dma_version captured before another successful create (which bumped DMA.version) returns ERR_STALE_VERSION (412); re-reading the DMA and retrying with the fresh version succeeds."
        test_recipe:
          setup: ["DMA created; client captured version v0; a first balance create succeeds (version advances)"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-OCC1", name: "OCC One", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_occ1: $.data.id, dma_occ1_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_occ1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_occ1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_occ1: $.data.id }
          trigger:
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_occ1}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", system_input_volume_m3: 900000, billed_authorized_m3: 700000, unbilled_authorized_m3: 30000, unauthorized_consumption_m3: 12000, metering_inaccuracy_m3: 20000, expected_dma_version: "${dma_occ1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { err_occ1: $.data.error_id }
            - call: "GET /nrw/dmas/${dma_occ1}"
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { dma_occ1_v2: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_occ1}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", system_input_volume_m3: 900000, billed_authorized_m3: 700000, unbilled_authorized_m3: 30000, unauthorized_consumption_m3: 12000, metering_inaccuracy_m3: 20000, expected_dma_version: "${dma_occ1_v2}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_occ1b: $.data.id }
          assert:
            - "stale-version create: error_id == ERR_STALE_VERSION (412)"
            - "DistrictMeteredArea.${dma_occ1}.version advanced by exactly 1 per successful create (observed fresh version > captured v0)"
            - "retry with fresh version succeeds: ${wbp_occ1b} created"

      - name: occ_stale_report_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[benchmark-submit-stale-report]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Submitting a BenchmarkReport with a stale expected_report_version (captured before a prior mutation bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["DMA with FINALIZED balance; report DRAFT whose version was captured, then a return-free mutation advanced it — simulated by capturing version, then submitting once (success), returning, and re-submitting with the ORIGINAL captured version"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-OCC2", name: "OCC Two", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_occ2: $.data.id, dma_occ2_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_occ2}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_occ2_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_occ2: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_occ2}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/water-balance-periods/${wbp_occ2}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
            - call: "POST /nrw/benchmark-reports"
              payload: { reporting_year: 2026, reporting_period_start: "2026-01-01T00:00:00Z", reporting_period_end: "2026-12-31T00:00:00Z", dma_ids: ["${dma_occ2}"] }
              as: RegulatorLiaison
              captures: { br_occ2: $.data.id, br_occ2_v: $.data.version }
            - call: "POST /nrw/benchmark-reports/${br_occ2}/submit"
              payload: { expected_report_version: "${br_occ2_v}" }
              as: RegulatorLiaison
            - call: "POST /nrw/benchmark-reports/${br_occ2}/return"
              payload: {}
              as: RegulatorLiaison
          trigger:
            - call: "POST /nrw/benchmark-reports/${br_occ2}/submit"
              payload: { expected_report_version: "${br_occ2_v}" }
              as: RegulatorLiaison
              captures: { err_occ2: $.data.error_id }
            - call: "GET /nrw/benchmark-reports/${br_occ2}"
              as: RegulatorLiaison
              captures: { br_occ2_v2: $.data.version }
            - call: "POST /nrw/benchmark-reports/${br_occ2}/submit"
              payload: { expected_report_version: "${br_occ2_v2}" }
              as: RegulatorLiaison
          assert:
            - "re-submit with original captured version: error_id == ERR_STALE_VERSION"
            - "re-submit with freshly-read version succeeds; status == SUBMITTED"

      - name: age_based_replacement_on_clock_advance
        claim_type: rate_threshold_triggers
        grounds: [calculations.meter_replacement_due, "endpoints[POST /nrw/_clock/set_current_utc]"]
        distinguishing_aspect: "AGE_BASED meter installed 2010-01-01 crosses AGE_LIMIT_YEARS 15 when the logical clock advances past 2025-01-01; clock advance flips replacement_due and status to FLAGGED_FOR_REPLACEMENT."
        test_recipe:
          setup: ["AGE_BASED meter installed 2010-01-01; logical clock at default 2026-08-01 (already past the 15-year mark)"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-AGE", name: "Age Lane", connection_count: 600, mains_length_km: 15.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
              captures: { dma_age: $.data.id }
            - call: "POST /nrw/customer-meters"
              payload: { dma_id: "${dma_age}", serial_number: "SN-AGE", size_mm: 15, installed_at: "2010-01-01T00:00:00Z", replacement_policy: "AGE_BASED" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_age: $.data.id }
          trigger:
            - call: "POST /nrw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramDirector
            - call: "GET /nrw/customer-meters/${m_age}"
              as: MeterTechnician
              as_user_id: "mt-1"
          assert:
            - "CustomerMeter.${m_age}.replacement_due == true"
            - "CustomerMeter.${m_age}.status == FLAGGED_FOR_REPLACEMENT"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_of_derived_fields
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.DistrictMeteredArea.fields.latest_nrw_pct]
        distinguishing_aspect: "Derived fields are visible in the same request's response: finalize response already carries the AUDITED nrw_pct and computed ili; DMA read immediately after shows latest_nrw_pct updated."
        test_recipe:
          setup: ["SUBMITTED balance exists"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-IMM", name: "Immediate", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_imm: $.data.id, dma_imm_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_imm}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_imm_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_imm: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_imm}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
          trigger:
            - call: "POST /nrw/water-balance-periods/${wbp_imm}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
              captures: { fin_pct: $.data.nrw_pct, fin_ili: $.data.ili }
            - call: "GET /nrw/dmas/${dma_imm}"
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { dma_latest: $.data.latest_nrw_pct }
          assert:
            - "finalize response data.nrw_pct == 27.5 and data.ili == 24.39 (immediate, no re-read needed)"
            - "DistrictMeteredArea.${dma_imm}.latest_nrw_pct == 27.5 immediately after"

