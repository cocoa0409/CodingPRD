              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /bond-offerings/official-statements/${os_id}/request-revision"
              payload: { revision_reason: "Pension liability disclosure is inadequate." }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "GET /bond-offerings/official-statements/${os_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /bond-offerings/rating-engagements/${eng_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /bond-offerings/rating-engagements/${eng_id}/presentations"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "before the trigger Deal.${deal_id}.disclosure_clearance == CLEARED and OfficialStatement.${os_id}.mandatory_sections_approved == true"
            - "the request-revision call returns 200"
            - "hop 1: OfficialStatement.${os_id}.status == REVISION_REQUESTED and OfficialStatement.${os_id}.draft_round == 2 and OfficialStatement.${os_id}.revision_reason == 'Pension liability disclosure is inadequate.'"
            - "hop 2: OfficialStatementSection.${s_rf_id}.review_status == NEEDS_REVISION and OfficialStatementSection.${s_rf_id}.approved_by_user_id == null"
            - "hop 2 is scoped: OfficialStatementSection.${s_tm_id}.review_status == APPROVED, OfficialStatementSection.${s_cd_id}.review_status == APPROVED and OfficialStatementSection.${s_uw_id}.review_status == APPROVED"
            - "hop 3: OfficialStatement.${os_id}.mandatory_sections_approved == false"
            - "hop 4: Deal.${deal_id}.disclosure_clearance == BLOCKED"
            - "hop 5: RatingPresentation.${pres_id}.status == CANCELLED and RatingPresentation.${pres_id}.cancellation_reason == 'DISCLOSURE_BLOCKED'"
            - "hop 5: RatingEngagement.${eng_id}.status == INFO_REQUESTED, RatingEngagement.${eng_id}.info_request_count == 1 and RatingEngagement.${eng_id}.latest_information_request == 'DISCLOSURE_BLOCKED_PENDING_OS_REVISION'"

      - name: enhancement_withdrawal_four_hop_cascade
