# =============================================================================
# Scaffold: Multifamily Package & Parcel Room (Expert)
# =============================================================================

scenario: "Multifamily Package & Parcel Room: carrier delivery & scan/log, resident notification & pickup code, oversize & cold/perishable, overflow & aging/return, staff-managed vs smart-locker, retail-return dropoff, reporting, PMS integration"

domain_name: multifamily-package-parcel-room
api_prefix: /parcelroom

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic          # Package: branching + revert (HELD) + cyclic re-notify
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties    # + peer_roles + entity_backed identities
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property/community display name" }
      - { name: timezone, type: string, source: input, default: "UTC", description: "IANA timezone label (informational)" }
      - { name: overflow_threshold_pct, type: number, source: input, default: 0.85, description: "Locker utilization at/above which posture becomes RESTRICTED (0<pct<=1)" }
      - { name: aging_days_standard, type: integer, source: input, default: 10, description: "Days an AMBIENT package may await pickup before aging return sweep" }
      - { name: aging_days_perishable, type: integer, source: input, default: 2, description: "Days a COLD/PERISHABLE package may await pickup before aging return sweep" }
      - { name: perishable_hold_hours, type: integer, source: input, default: 48, description: "Hours after intake a PERISHABLE package is safe before cold-chain forfeiture" }
      - { name: holding_fee_grace_days, type: integer, source: input, default: 3, description: "Free days before holding fee accrues" }
      - { name: holding_fee_daily_cents, type: integer, source: input, default: 150, description: "Base holding fee per chargeable day, in cents" }
      - { name: perishable_fee_multiplier, type: number, source: input, default: 2, description: "Daily-fee multiplier applied to COLD/PERISHABLE packages" }
      - { name: oversize_surcharge_cents, type: integer, source: input, default: 500, description: "One-time surcharge added to fee when size_class == OVERSIZE" }
      - { name: holding_fee_cap_cents, type: integer, source: input, default: 5000, description: "Maximum gross holding fee per package, in cents" }
      - { name: return_staging_capacity, type: integer, source: input, default: 25, description: "Max concurrently-staged retail returns awaiting carrier pickup" }
      - { name: occupancy_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived from locker utilization; persisted, refreshed on any locker occupancy change" }
      - { name: occupied_locker_count, type: integer, source: computed, description: "Count of Lockers under this Property with status == OCCUPIED" }
      - { name: in_service_locker_count, type: integer, source: computed, description: "Count of Lockers under this Property with status != OUT_OF_SERVICE" }
      - { name: uncollected_fee_cents, type: integer, source: computed, description: "Sum of StorageCharge.amount_cents for HOLDING_FEE charges with status == OUTSTANDING across this Property's packages (fee ledger)" }
      - { name: return_staging_count, type: integer, source: computed, description: "Count of RetailReturn under this Property with status in {DROPPED_OFF, AWAITING_CARRIER}" }

  - name: LockerBank
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: label, type: string, source: input, description: "Bank label, e.g., 'A'" }
      - { name: storage_class, type: enum, source: input, description: "AMBIENT | REFRIGERATED — physical class of every locker created under this bank" }
      - { name: nominal_locker_count, type: integer, source: computed, description: "Count of all Lockers under this bank regardless of status" }
      - { name: available_locker_count, type: integer, source: computed, description: "Count of Lockers under this bank with status == AVAILABLE" }

  - name: Locker
    parent: LockerBank
    common_fields: true
    fields:
      - { name: locker_bank_id, type: string, source: input, description: "FK -> LockerBank.id" }
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE | OVERSIZE — max package size this compartment fits" }
      - { name: storage_class, type: enum, source: input, description: "AMBIENT | REFRIGERATED (defaults to owning bank.storage_class when omitted)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OCCUPIED | OUT_OF_SERVICE" }
      - { name: current_package_id, type: string, source: system, default: null, description: "Package currently occupying this compartment (null when not OCCUPIED); mirror of Package.locker_id, not an FK owner" }

  - name: Shelf
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: zone, type: string, source: input, description: "Staff-managed shelf zone label" }
      - { name: storage_class, type: enum, source: input, description: "AMBIENT | REFRIGERATED" }
      - { name: capacity, type: integer, source: input, constraints: "must be > 0", description: "Max packages this shelf may hold concurrently (aggregate capacity)" }
      - { name: occupied_count, type: integer, source: computed, description: "Count of Packages with shelf_id == this shelf and status == AWAITING_PICKUP" }

  - name: Resident
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: unit_number, type: string, source: input, description: "Unit/apartment number" }
      - { name: full_name, type: string, source: input, description: "Resident full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, default: null, description: "Optional contact phone" }
      - { name: notify_channel, type: enum, source: input, default: "EMAIL", description: "EMAIL | SMS | PUSH — channel used for pickup notifications" }
      - { name: loyalty_discount_pct, type: number, source: input, default: 0.0, description: "Per-charge discount fraction applied to each settled holding-fee charge (0<=pct<1)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | HOLD | MOVED_OUT" }

  - name: Carrier
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: name, type: string, source: input, description: "Carrier display name, e.g., UPS" }
      - { name: scac, type: string, source: input, description: "Standard carrier alpha code (unique per property)" }
      - { name: allows_smart_locker_delivery, type: boolean, source: input, default: true, description: "Whether this carrier may deliver directly into smart lockers" }

  - name: Package
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; the recipient resident" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; delivering carrier" }
      - { name: locker_id, type: string, source: system, default: null, description: "FK -> Locker.id; smart-locker compartment assigned at notify (null when shelf/none)" }
      - { name: shelf_id, type: string, source: system, default: null, description: "FK -> Shelf.id; staff-managed shelf assigned at notify (null when locker/none)" }
      - { name: tracking_number, type: string, source: input, description: "Carrier tracking number; unique per Property across non-terminal packages" }
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE | OVERSIZE" }
      - { name: storage_type, type: enum, source: input, description: "AMBIENT | COLD | PERISHABLE" }
      - { name: is_oversize, type: boolean, source: computed, description: "True iff size_class == OVERSIZE" }
      - { name: storage_mode, type: enum, source: system, default: "NONE", description: "NONE | LOCKER | SHELF — where the package is physically stored after notify" }
      - { name: pickup_code, type: string, source: system, default: null, description: "Six-character one-time pickup code minted at first notify" }
      - { name: status, type: enum, source: system, description: "LOGGED | AWAITING_PICKUP | HELD | PICKED_UP | RETURN_INITIATED | RETURNED | DISPOSED" }
      - { name: intake_at, type: datetime, source: system, description: "Logical-clock instant the package was scanned/logged" }
      - { name: notified_at, type: datetime, source: system, default: null, description: "Logical-clock instant of first notification" }
      - { name: cold_chain_deadline_at, type: datetime, source: computed, default: null, description: "intake_at + perishable_hold_hours for PERISHABLE packages; null otherwise" }
      - { name: aging_deadline_at, type: datetime, source: computed, description: "intake_at + (aging_days_perishable if COLD/PERISHABLE else aging_days_standard) days" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Provisional holding fee accrued as of the current logical clock (variant: provisional)" }
      - { name: final_fee_cents, type: integer, source: system, default: null, description: "Settled gross holding fee pinned at pickup or return-initiate (variant: final); null while unsettled" }
      - { name: notify_count, type: integer, source: system, default: 0, description: "Number of notifications sent (initial + reminders)" }
      - { name: return_initiated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the actor who moved the package to RETURN_INITIATED (SoD anchor)" }

  - name: Notification
    parent: Package
    common_fields: false
    fields:
      - { name: package_id, type: string, source: system, description: "FK -> Package.id" }
      - { name: channel, type: enum, source: system, description: "EMAIL | SMS | PUSH (snapshot of resident.notify_channel at send time)" }
      - { name: kind, type: enum, source: system, description: "INITIAL | REMINDER | MOVE_OUT_HOLD | RETURN_NOTICE | DISPOSED_NOTICE" }
      - { name: pickup_code, type: string, source: system, default: null, description: "Pickup code included in the message (null for non-pickup kinds)" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock instant the notification was emitted" }

  - name: RetailReturn
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; dropping-off resident" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier that will collect the return" }
      - { name: tracking_number, type: string, source: input, description: "Outbound return label tracking number" }
      - { name: status, type: enum, source: system, description: "DROPPED_OFF | AWAITING_CARRIER | REJECTED | PICKED_UP" }
      - { name: dropped_off_at, type: datetime, source: system, description: "Logical-clock instant of dropoff" }
      - { name: reject_reason, type: string, source: system, default: null, description: "Reason recorded when a return is rejected" }

  - name: StorageCharge
    parent: Package
    common_fields: true
    fields:
      - { name: package_id, type: string, source: system, description: "FK -> Package.id" }
      - { name: charge_type, type: enum, source: system, description: "HOLDING_FEE (the only charge type currently minted, at pickup or return-initiate)" }
      - { name: amount_cents, type: integer, source: system, description: "Net amount owed after per-charge loyalty discount, in cents" }
      - { name: status, type: enum, source: system, description: "OUTSTANDING | COLLECTED | WAIVED" }
      - { name: basis, type: string, source: system, description: "Human-readable basis, e.g., '5 chargeable days x 150 + 0 oversize'" }
      - { name: settled_at, type: datetime, source: system, default: null, description: "Logical-clock instant the charge left OUTSTANDING" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Package
    initial_state: LOGGED
    terminal_states: [PICKED_UP, RETURNED, DISPOSED]
    transitions:
      - from: LOGGED
        to: AWAITING_PICKUP
        trigger: "POST /parcelroom/packages/{id}/notify"
        actor: ConciergeStaff
        preconditions:
          - "Resident.status == ACTIVE (else ERR_RESIDENT_NOT_ACTIVE)"
          - "Property.occupancy_posture != FROZEN when target is a locker (else ERR_STORAGE_FROZEN)"
          - "Property.occupancy_posture != RESTRICTED for AMBIENT locker assignment (else ERR_STORAGE_RESTRICTED)"
          - "Chosen/auto locker AVAILABLE and size_class fits and storage_class matches (else ERR_LOCKER_UNAVAILABLE / ERR_LOCKER_SIZE_MISMATCH)"
          - "Chosen/auto shelf occupied_count < capacity and storage_class matches (else ERR_SHELF_FULL / ERR_LOCKER_SIZE_MISMATCH)"
        side_effects:
          - "Mint pickup_code on first notify; set notified_at; increment notify_count"
          - "Assign locker_id (status AVAILABLE->OCCUPIED, current_package_id set) OR shelf_id; set storage_mode LOCKER|SHELF"
          - "Recompute LockerBank.available_locker_count and Property.occupied_locker_count/in_service_locker_count"
          - "Recompute Property.occupancy_posture (may transition OPEN->RESTRICTED->FROZEN); persist and bump Property.version"
          - "Create Notification(kind=INITIAL, channel=resident.notify_channel, pickup_code)"
      - from: AWAITING_PICKUP
        to: AWAITING_PICKUP
        trigger: "POST /parcelroom/packages/{id}/notify (reminder)"
        actor: ConciergeStaff
        preconditions:
          - "Resident.status == ACTIVE"
        side_effects:
          - "Increment notify_count; set notified_at"
          - "Create Notification(kind=REMINDER, pickup_code reused)"
        note: "Cyclic self-transition: reminders reuse the original pickup_code and do not reassign storage."
      - from: AWAITING_PICKUP
        to: PICKED_UP
        trigger: "POST /parcelroom/packages/{id}/pickup"
        actor: Resident | ConciergeStaff
        preconditions:
          - "Package not past cold_chain_deadline_at for PERISHABLE (else ERR_COLD_CHAIN_EXPIRED)"
          - "Supplied pickup_code equals Package.pickup_code (else ERR_INVALID_PICKUP_CODE)"
        side_effects:
          - "Compute final_fee_cents (final variant); set picked_up_at"
          - "Create StorageCharge(HOLDING_FEE, status=COLLECTED, amount=net after loyalty discount) when final_fee_cents > 0"
          - "Release locker (OCCUPIED->AVAILABLE, current_package_id=null) or decrement shelf occupied_count; storage_mode=NONE"
          - "Recompute LockerBank/Property locker counts; recompute Property.occupancy_posture; bump Property.version"
      - from: AWAITING_PICKUP
        to: HELD
        trigger: "system (cascade from Resident MOVED_OUT/HOLD via POST /parcelroom/residents/{id}/pms-sync)"
        actor: system
        preconditions: []
        side_effects:
          - "Create Notification(kind=MOVE_OUT_HOLD)"
        note: "Storage assignment retained while HELD; not released."
      - from: HELD
        to: AWAITING_PICKUP
        trigger: "system (cascade from Resident RELEASE_HOLD via POST /parcelroom/residents/{id}/pms-sync)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWAITING_PICKUP
        to: RETURN_INITIATED
        trigger: "POST /parcelroom/packages/{id}/return-initiate OR system (aging sweep when now >= aging_deadline_at)"
        actor: ConciergeStaff | PropertyManager | system
        preconditions:
          - "Package storage_type not blocking; must be AWAITING_PICKUP"
        side_effects:
          - "Pin final_fee_cents (final variant as-of now)"
          - "Create StorageCharge(HOLDING_FEE, status=OUTSTANDING, amount=net) when final_fee_cents > 0; increase Property.uncollected_fee_cents"
          - "Release locker/shelf; recompute counts and posture; bump Property.version"
          - "Set return_initiated_by_user_id = X-User-ID; Create Notification(kind=RETURN_NOTICE)"
      - from: RETURN_INITIATED
        to: RETURNED
        trigger: "POST /parcelroom/packages/{id}/return-complete"
        actor: ConciergeStaff | Carrier
        preconditions:
          - "X-User-ID != return_initiated_by_user_id (dual-control SoD; else ERR_SOD_VIOLATION)"
        side_effects: []
      - from: AWAITING_PICKUP
        to: DISPOSED
        trigger: "system (aging sweep when PERISHABLE and now > cold_chain_deadline_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Release locker/shelf; recompute counts and posture; bump Property.version"
          - "Create Notification(kind=DISPOSED_NOTICE)"

  - entity: RetailReturn
    initial_state: DROPPED_OFF
    terminal_states: [REJECTED, PICKED_UP]
    transitions:
      - from: DROPPED_OFF
        to: AWAITING_CARRIER
        trigger: "POST /parcelroom/retail-returns/{id}/verify-label"
        actor: ConciergeStaff
        preconditions: []
        side_effects: []
      - from: DROPPED_OFF
        to: REJECTED
        trigger: "POST /parcelroom/retail-returns/{id}/reject"
        actor: ConciergeStaff
        preconditions: []
        side_effects:
          - "Set reject_reason; decrement Property.return_staging_count"
      - from: AWAITING_CARRIER
        to: PICKED_UP
        trigger: "POST /parcelroom/retail-returns/{id}/carrier-pickup"
        actor: Carrier
        preconditions:
          - "X-User-ID == RetailReturn.carrier_id (else ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "Decrement Property.return_staging_count"

  - entity: Locker
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system (cascade from Package notify locker assignment)"
        actor: system
        preconditions:
          - "Locker.status == AVAILABLE (single-occupancy; else ERR_LOCKER_UNAVAILABLE)"
        side_effects:
          - "current_package_id = assigned package; recompute owning bank/property counts"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system (cascade from Package pickup/return-initiate/dispose)"
        actor: system
        preconditions: []
        side_effects:
          - "current_package_id = null; recompute owning bank/property counts"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /parcelroom/lockers/{id}/out-of-service"
        actor: PropertyManager
        preconditions:
          - "Locker.status == AVAILABLE (cannot take an OCCUPIED locker out of service; else ERR_LOCKER_UNAVAILABLE)"
        side_effects:
          - "Recompute Property.in_service_locker_count and occupancy_posture; bump Property.version"

  - entity: Resident
    initial_state: ACTIVE
    terminal_states: [MOVED_OUT]
    transitions:
      - from: ACTIVE
        to: HOLD
        trigger: "POST /parcelroom/residents/{id}/pms-sync (event_type=PLACE_HOLD)"
        actor: PmsIntegration
        preconditions: []
        side_effects:
          - "Cascade: each AWAITING_PICKUP Package of this resident -> HELD"
      - from: HOLD
        to: ACTIVE
        trigger: "POST /parcelroom/residents/{id}/pms-sync (event_type=RELEASE_HOLD)"
        actor: PmsIntegration
        preconditions: []
        side_effects:
          - "Cascade: each HELD Package of this resident -> AWAITING_PICKUP"
      - from: ACTIVE
        to: MOVED_OUT
        trigger: "POST /parcelroom/residents/{id}/pms-sync (event_type=MOVE_OUT)"
        actor: PmsIntegration
        preconditions: []
        side_effects:
          - "Cascade: each AWAITING_PICKUP Package of this resident -> HELD (which creates Notification MOVE_OUT_HOLD)"
          - "Waive: each OUTSTANDING HOLDING_FEE StorageCharge of this resident's packages -> WAIVED; decrease Property.uncollected_fee_cents by the waived sum"
      - from: HOLD
        to: MOVED_OUT
        trigger: "POST /parcelroom/residents/{id}/pms-sync (event_type=MOVE_OUT)"
        actor: PmsIntegration
        preconditions: []
        side_effects:
          - "Waive OUTSTANDING HOLDING_FEE charges -> WAIVED; decrease Property.uncollected_fee_cents by the waived sum"

  - entity: Property
    initial_state: OPEN
    terminal_states: []
    note: "occupancy_posture is a derived/persisted field; transitions are auto-computed on any locker occupancy or in-service change (see calculation property_occupancy_posture)."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (recompute when utilization >= overflow_threshold_pct and < 1.0)"
        actor: system
        preconditions: []
        side_effects: ["persist occupancy_posture; bump Property.version"]
      - from: RESTRICTED
        to: FROZEN
        trigger: "system (recompute when utilization >= 1.0)"
        actor: system
        preconditions: []
        side_effects: ["persist occupancy_posture; bump Property.version"]
      - from: FROZEN
        to: RESTRICTED
        trigger: "system (recompute when utilization drops below 1.0)"
        actor: system
        preconditions: []
        side_effects: ["persist occupancy_posture; bump Property.version"]
      - from: RESTRICTED
        to: OPEN
        trigger: "system (recompute when utilization < overflow_threshold_pct)"
        actor: system
        preconditions: []
        side_effects: ["persist occupancy_posture; bump Property.version"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: property-policy-stale-version
    parent_entity: Property
    write_endpoint: "PATCH /parcelroom/properties/{id}/policy"
    occ_field: "expected_property_version"
    description: |
      Updating a Property's fee/aging/overflow policy against a Property whose
      version has advanced since the client last observed it is rejected. Locker
      occupancy cascades (notify/pickup/return) silently bump Property.version,
      so a policy write carrying a stale expected_property_version is refused to
      prevent a lost update over the previously-read configuration.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_locker_capacity
    trigger: "notify auto-assignment; aging sweep; GET report"
    algorithm: aggregation
    formula: |
      For a LockerBank and a requested (size_class, storage_class):
        nominal  = count(Locker in bank WHERE size_class fits request AND storage_class matches)
                   # counts every compartment regardless of status
        effective = count(Locker in bank WHERE status == AVAILABLE
                          AND size_class fits request AND storage_class matches)
      A locker "fits" a package when locker.size_class rank >= package.size_class rank
      (SMALL<MEDIUM<LARGE<OVERSIZE). Auto-assignment uses `effective`; capacity
      reporting exposes both.
    input_set: "Lockers under one bank; nominal ignores status, effective requires AVAILABLE"
    constants: {}
    precision: "integer counts"
    variants:
      - name: nominal
        when: "capacity planning / reporting"
        difference: "includes OCCUPIED and OUT_OF_SERVICE compartments"
      - name: effective
        when: "live assignment at notify"
        difference: "only AVAILABLE compartments; diverges from nominal whenever any compartment is OCCUPIED or OUT_OF_SERVICE"

  - name: property_occupancy_posture
    trigger: "any locker occupancy change (notify/pickup/return/dispose) or out-of-service"
    algorithm: threshold
    formula: |
      in_service = count(Locker under property WHERE status != OUT_OF_SERVICE)
      occupied   = count(Locker under property WHERE status == OCCUPIED)
      utilization = 1.0 if in_service == 0 else (occupied / in_service)
      posture = FROZEN     if utilization >= 1.0
                RESTRICTED if utilization >= overflow_threshold_pct and utilization < 1.0
                OPEN       otherwise
    input_set: "all Lockers under the Property"
    constants:
      OVERFLOW_THRESHOLD_PCT: "Property.overflow_threshold_pct (default 0.85)"
    precision: "utilization compared with >= at boundaries (0.85 -> RESTRICTED)"

  - name: holding_fee
    trigger: "GET package (provisional); pickup and return-initiate (final)"
    algorithm: tiered_pricing
    formula: |
      end = now (provisional) | picked_up_at (final pickup) | now (final at return-initiate)
      elapsed_days = floor((end - intake_at) / 24h)
      chargeable_days = max(0, elapsed_days - holding_fee_grace_days)
      daily = holding_fee_daily_cents * (perishable_fee_multiplier if storage_type in {COLD, PERISHABLE} else 1)
      # round EACH day's fee to whole cents, THEN sum across chargeable_days
      gross = sum over d in [1..chargeable_days] of round_half_up(daily)
      gross += oversize_surcharge_cents if is_oversize
      gross = min(gross, holding_fee_cap_cents)
    input_set: "single Package; grace/daily/multiplier/cap from Property policy"
    constants:
      HOLDING_FEE_DAILY_CENTS: "Property.holding_fee_daily_cents (default 150)"
      HOLDING_FEE_GRACE_DAYS: "Property.holding_fee_grace_days (default 3)"
      PERISHABLE_FEE_MULTIPLIER: "Property.perishable_fee_multiplier (default 2)"
      OVERSIZE_SURCHARGE_CENTS: "Property.oversize_surcharge_cents (default 500)"
      HOLDING_FEE_CAP_CENTS: "Property.holding_fee_cap_cents (default 5000)"
    precision: "cents, round_half_up per day before summation"
    variants:
      - name: provisional
        when: "package still AWAITING_PICKUP; exposed as provisional_fee_cents"
        difference: "end = current logical clock; grows as time passes"
      - name: final
        when: "pickup or return-initiate; pinned into final_fee_cents"
        difference: "end frozen at picked_up_at (pickup) or now (return-initiate); never re-grows"

  - name: charge_net_settlement
    trigger: "StorageCharge creation at pickup or return-initiate"
    algorithm: aggregation
    formula: |
      For the gross holding fee of a package:
        net = round_half_up(gross_fee_cents * (1 - resident.loyalty_discount_pct))
      When multiple packages settle in one operation (batch pickup is NOT supported,
      but aging sweep settles many), the discount is applied and rounded PER CHARGE,
      then the resulting net amounts are summed into Property.uncollected_fee_cents.
      Pinned order: round-per-charge THEN sum (never sum-then-discount-then-round).
    input_set: "per Package gross fee and its resident.loyalty_discount_pct"
    constants: {}
    precision: "cents, round_half_up per charge before summation"

  - name: cold_chain_deadline
    trigger: "intake (compute); aging sweep and pickup (enforce)"
    algorithm: interval_merge
    formula: |
      cold_chain_deadline_at = intake_at + perishable_hold_hours (PERISHABLE only)
      A pickup at exactly cold_chain_deadline_at is still safe (half-open window
      [intake_at, deadline_at]); a pickup or sweep observation strictly AFTER the
      deadline forfeits the package (DISPOSED / ERR_COLD_CHAIN_EXPIRED).
    input_set: "single PERISHABLE Package"
    constants:
      PERISHABLE_HOLD_HOURS: "Property.perishable_hold_hours (default 48)"
    precision: "instant comparison; strictly-after triggers forfeiture"

  - name: aging_return_selection
    trigger: "POST /parcelroom/properties/{id}/aging-sweep"
    algorithm: chronological
    formula: |
      candidate set = Packages under property WHERE status == AWAITING_PICKUP
        AND now >= aging_deadline_at
        where aging_deadline_at = intake_at + (aging_days_perishable if storage_type in {COLD,PERISHABLE} else aging_days_standard) days
      Process candidates ordered by intake_at ASC, tie-break created_at ASC.
      PERISHABLE packages already strictly past cold_chain_deadline_at -> DISPOSED first;
      all remaining candidates -> RETURN_INITIATED (system actor; return_initiated_by_user_id = 'SYSTEM').
    input_set: "AWAITING_PICKUP packages under the Property"
    constants:
      AGING_DAYS_STANDARD: "Property.aging_days_standard (default 10)"
      AGING_DAYS_PERISHABLE: "Property.aging_days_perishable (default 2)"
    precision: "now >= aging_deadline_at (boundary inclusive)"

  - name: shelf_available_capacity
    trigger: "notify shelf assignment"
    algorithm: aggregation
    formula: |
      occupied_count = count(Package WHERE shelf_id == shelf AND status == AWAITING_PICKUP)
      available = shelf.capacity - occupied_count
      Assignment requires available >= 1 (aggregate capacity), i.e. occupied_count < capacity.
    input_set: "Packages currently occupying a shelf"
    constants: {}
    precision: "integer; reject when occupied_count == capacity"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint; entity_backed roles must own the target (Resident picks up own package; Carrier acts as own carrier_id)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: "ERR_PROPERTY_NOT_FOUND / ERR_LOCKER_BANK_NOT_FOUND / ERR_LOCKER_NOT_FOUND / ERR_SHELF_NOT_FOUND / ERR_RESIDENT_NOT_FOUND / ERR_CARRIER_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_RETAIL_RETURN_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: state
    check: "Target resource in a state where the transition/operation is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 5
    category: business_safety
    check: "Dual-control: return-complete actor differs from return_initiated_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /parcelroom/packages/{id}/return-complete"

  - priority: 6
    category: business_referential
    check: "For notify, the recipient Resident.status must be ACTIVE"
    error_id: ERR_RESIDENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /parcelroom/packages/{id}/notify"

  - priority: 7
    category: business_temporal
    check: "For pickup of a PERISHABLE package, current clock must not be strictly after cold_chain_deadline_at"
    error_id: ERR_COLD_CHAIN_EXPIRED
    http_status: 409
    applies_to: "POST /parcelroom/packages/{id}/pickup"

  - priority: 8
    category: business_safety
    check: "Property.occupancy_posture gates locker assignment: FROZEN blocks all locker assignment; RESTRICTED blocks AMBIENT locker assignment"
    error_id: "ERR_STORAGE_FROZEN / ERR_STORAGE_RESTRICTED"
    http_status: 409
    applies_to: "POST /parcelroom/packages/{id}/notify (locker target)"

  - priority: 9
    category: business_constraint
    check: "Storage compatibility: locker must be AVAILABLE, size must fit, storage_class must match; shelf must have free aggregate capacity and matching storage_class"
    error_id: "ERR_LOCKER_UNAVAILABLE / ERR_LOCKER_SIZE_MISMATCH / ERR_SHELF_FULL / ERR_NO_STORAGE_AVAILABLE"
    http_status: 409
    applies_to: "POST /parcelroom/packages/{id}/notify"

  - priority: 10
    category: business_constraint
    check: "Supplied pickup_code equals Package.pickup_code"
    error_id: ERR_INVALID_PICKUP_CODE
    http_status: 403
    applies_to: "POST /parcelroom/packages/{id}/pickup"

  - priority: 11
    category: business_constraint
    check: "Retail-return dropoff blocked when Property.return_staging_count == return_staging_capacity (aggregate staging capacity)"
    error_id: ERR_STAGING_FULL
    http_status: 409
    applies_to: "POST /parcelroom/retail-returns"

  - priority: 12
    category: business_constraint
    check: "tracking_number unique per Property across non-terminal packages"
    error_id: ERR_DUPLICATE_TRACKING
    http_status: 409
    applies_to: "POST /parcelroom/packages"

  - priority: 13
    category: business_constraint
    check: "Optimistic concurrency: expected_property_version equals current Property.version on policy update"
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
    applies_to: "PATCH /parcelroom/properties/{id}/policy"

  - priority: 14
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric fields non-negative, shelf.capacity > 0, 0<=loyalty_discount_pct<1, 0<overflow_threshold_pct<=1"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all write endpoints

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Property ----
  - method: POST
    path: "/parcelroom/properties"
    description: "Create a Property with fee/aging/overflow policy"
    roles: [PropertyManager]
    code: 201
    input: [name, "timezone?", "overflow_threshold_pct?", "aging_days_standard?", "aging_days_perishable?", "perishable_hold_hours?", "holding_fee_grace_days?", "holding_fee_daily_cents?", "perishable_fee_multiplier?", "oversize_surcharge_cents?", "holding_fee_cap_cents?", "return_staging_capacity?"]
    output: Property
    side_effects: ["occupancy_posture=OPEN; all computed counts=0; version=1"]

  - method: GET
    path: "/parcelroom/properties/{id}"
    description: "Get a Property (includes computed occupancy and ledger fields)"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: PATCH
    path: "/parcelroom/properties/{id}/policy"
    description: "Update Property policy under optimistic concurrency"
    roles: [PropertyManager]
    code: 200
    input: [expected_property_version, "overflow_threshold_pct?", "aging_days_standard?", "aging_days_perishable?", "perishable_hold_hours?", "holding_fee_grace_days?", "holding_fee_daily_cents?", "perishable_fee_multiplier?", "oversize_surcharge_cents?", "holding_fee_cap_cents?", "return_staging_capacity?"]
    output: Property
    side_effects: ["Apply provided policy fields", "increments Property.version by 1", "recompute occupancy_posture with new threshold"]

  - method: GET
    path: "/parcelroom/properties/{id}/report"
    description: "Operational report: locker utilization, aging buckets, uncollected fees, staging usage"
    roles: [PropertyManager, ConciergeStaff]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: POST
    path: "/parcelroom/properties/{id}/aging-sweep"
    description: "Run aging + cold-chain + overflow batch (system-actor transitions)"
    roles: [PropertyManager, ConciergeStaff]
    code: 200
    input: []
    output: Property
    side_effects:
      - "PERISHABLE packages strictly past cold_chain_deadline_at -> DISPOSED"
      - "AWAITING packages with now >= aging_deadline_at -> RETURN_INITIATED (return_initiated_by_user_id='SYSTEM')"
      - "Pin final_fee_cents and create OUTSTANDING HOLDING_FEE charges; increase uncollected_fee_cents"
      - "Release storage; recompute posture; bump Property.version"

  - method: GET
    path: "/parcelroom/properties/{id}/locker-banks"
    description: "List LockerBanks under a Property"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: ["limit?", "offset?"]
    output: "LockerBank[]"
    side_effects: []

  - method: GET
    path: "/parcelroom/properties/{id}/shelves"
    description: "List Shelves under a Property"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: ["limit?", "offset?"]
    output: "Shelf[]"
    side_effects: []

  - method: GET
    path: "/parcelroom/properties/{id}/residents"
    description: "List Residents under a Property"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: ["limit?", "offset?"]
    output: "Resident[]"
    side_effects: []

  - method: GET
    path: "/parcelroom/properties/{id}/carriers"
    description: "List Carriers under a Property"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: ["limit?", "offset?"]
    output: "Carrier[]"
    side_effects: []

  # ---- LockerBank ----
  - method: POST
    path: "/parcelroom/locker-banks"
    description: "Create a LockerBank"
    roles: [PropertyManager]
    code: 201
    input: [property_id, label, storage_class]
    output: LockerBank
    side_effects: ["nominal/available counts = 0"]

  - method: GET
    path: "/parcelroom/locker-banks/{id}"
    description: "Get a LockerBank"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: []
    output: LockerBank
    side_effects: []

  - method: GET
    path: "/parcelroom/locker-banks/{id}/lockers"
    description: "List Lockers under a LockerBank"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: ["limit?", "offset?"]
    output: "Locker[]"
    side_effects: []

  # ---- Locker ----
  - method: POST
    path: "/parcelroom/lockers"
    description: "Create a Locker compartment"
    roles: [PropertyManager]
    code: 201
    input: [locker_bank_id, size_class, "storage_class?"]
    output: Locker
    side_effects: ["status=AVAILABLE; recompute bank/property counts and posture; bump Property.version"]

  - method: GET
    path: "/parcelroom/lockers/{id}"
    description: "Get a Locker"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: []
    output: Locker
    side_effects: []

  - method: POST
    path: "/parcelroom/lockers/{id}/out-of-service"
    description: "Take an AVAILABLE Locker out of service"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Locker
    side_effects: ["status AVAILABLE->OUT_OF_SERVICE; recompute in_service count and posture; bump Property.version"]

  # ---- Shelf ----
  - method: POST
    path: "/parcelroom/shelves"
    description: "Create a staff-managed Shelf"
    roles: [PropertyManager]
    code: 201
    input: [property_id, zone, storage_class, capacity]
    output: Shelf
    side_effects: ["occupied_count=0"]

  - method: GET
    path: "/parcelroom/shelves/{id}"
    description: "Get a Shelf"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: []
    output: Shelf
    side_effects: []

  # ---- Resident ----
  - method: POST
    path: "/parcelroom/residents"
    description: "Register a Resident (manually or via PMS import)"
    roles: [PropertyManager, PmsIntegration]
    code: 201
    input: [property_id, unit_number, full_name, email, "phone?", "notify_channel?", "loyalty_discount_pct?"]
    output: Resident
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/parcelroom/residents/{id}"
    description: "Get a Resident"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: []
    output: Resident
    side_effects: []

  - method: POST
    path: "/parcelroom/residents/{id}/pms-sync"
    description: "Apply a PMS roster lifecycle event (MOVE_OUT / PLACE_HOLD / RELEASE_HOLD)"
    roles: [PmsIntegration]
    code: 200
    input: [event_type]
    output: Resident
    side_effects:
      - "PLACE_HOLD: ACTIVE->HOLD; cascade AWAITING packages -> HELD"
      - "RELEASE_HOLD: HOLD->ACTIVE; cascade HELD packages -> AWAITING_PICKUP"
      - "MOVE_OUT: ->MOVED_OUT; cascade AWAITING packages -> HELD (+MOVE_OUT_HOLD notification); waive OUTSTANDING holding-fee charges; decrease Property.uncollected_fee_cents"

  # ---- Carrier ----
  - method: POST
    path: "/parcelroom/carriers"
    description: "Register a Carrier at a Property"
    roles: [PropertyManager]
    code: 201
    input: [property_id, name, scac, "allows_smart_locker_delivery?"]
    output: Carrier
    side_effects: []

  - method: GET
    path: "/parcelroom/carriers/{id}"
    description: "Get a Carrier"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  # ---- Package ----
  - method: POST
    path: "/parcelroom/packages"
    description: "Scan/log an inbound package at delivery"
    roles: [Carrier, ConciergeStaff]
    code: 201
    input: [property_id, resident_id, carrier_id, tracking_number, size_class, storage_type]
    output: Package
    side_effects: ["status=LOGGED; intake_at=clock; compute is_oversize, aging_deadline_at, cold_chain_deadline_at"]

  - method: GET
    path: "/parcelroom/packages/{id}"
    description: "Get a Package (includes provisional_fee_cents)"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: []
    output: Package
    side_effects: []

  - method: GET
    path: "/parcelroom/packages"
    description: "List/filter Packages"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: ["property_id?", "resident_id?", "carrier_id?", "locker_id?", "shelf_id?", "status?", "limit?", "offset?"]
    output: "Package[]"
    side_effects: []

  - method: POST
    path: "/parcelroom/packages/{id}/notify"
    description: "Notify resident, assign storage, issue pickup code (initial or reminder)"
    roles: [ConciergeStaff]
    code: 200
    input: ["storage_target?", "locker_id?", "shelf_id?"]
    output: Package
    side_effects:
      - "LOGGED->AWAITING_PICKUP (initial) or AWAITING_PICKUP->AWAITING_PICKUP (reminder)"
      - "Assign locker/shelf; recompute posture; bump Property.version; create Notification"

  - method: POST
    path: "/parcelroom/packages/{id}/pickup"
    description: "Resident (or staff on their behalf) picks up with pickup code"
    roles: [Resident, ConciergeStaff]
    code: 200
    input: [pickup_code]
    output: Package
    side_effects:
      - "AWAITING_PICKUP->PICKED_UP; pin final_fee_cents; create COLLECTED HOLDING_FEE charge if fee>0"
      - "Release storage; recompute posture; bump Property.version"

  - method: POST
    path: "/parcelroom/packages/{id}/return-initiate"
    description: "Manually evict an awaiting package to return (overflow/aging)"
    roles: [ConciergeStaff, PropertyManager]
    code: 200
    input: []
    output: Package
    side_effects:
      - "AWAITING_PICKUP->RETURN_INITIATED; set return_initiated_by_user_id=X-User-ID"
      - "Pin final_fee_cents; create OUTSTANDING HOLDING_FEE charge if fee>0; increase uncollected_fee_cents"
      - "Release storage; recompute posture; bump Property.version; create RETURN_NOTICE notification"

  - method: POST
    path: "/parcelroom/packages/{id}/return-complete"
    description: "Confirm the returned package was handed to the carrier (dual-control)"
    roles: [ConciergeStaff, Carrier]
    code: 200
    input: []
    output: Package
    side_effects: ["RETURN_INITIATED->RETURNED (requires actor != return_initiated_by_user_id)"]

  - method: GET
    path: "/parcelroom/packages/{id}/notifications"
    description: "List Notifications emitted for a Package"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: ["limit?", "offset?"]
    output: "Notification[]"
    side_effects: []

  - method: GET
    path: "/parcelroom/packages/{id}/charges"
    description: "List StorageCharges for a Package"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: ["limit?", "offset?"]
    output: "StorageCharge[]"
    side_effects: []

  # ---- RetailReturn ----
  - method: POST
    path: "/parcelroom/retail-returns"
    description: "Resident drops off an outbound retail return for carrier pickup"
    roles: [Resident]
    code: 201
    input: [property_id, resident_id, carrier_id, tracking_number]
    output: RetailReturn
    side_effects: ["status=DROPPED_OFF; dropped_off_at=clock; increment Property.return_staging_count"]

  - method: GET
    path: "/parcelroom/retail-returns/{id}"
    description: "Get a RetailReturn"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: []
    output: RetailReturn
    side_effects: []

  - method: GET
    path: "/parcelroom/retail-returns"
    description: "List/filter RetailReturns"
    roles: [PropertyManager, ConciergeStaff, Resident, Carrier, PmsIntegration]
    code: 200
    input: ["property_id?", "resident_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: "RetailReturn[]"
    side_effects: []

  - method: POST
    path: "/parcelroom/retail-returns/{id}/verify-label"
    description: "Staff verifies the return label"
    roles: [ConciergeStaff]
    code: 200
    input: []
    output: RetailReturn
    side_effects: ["DROPPED_OFF->AWAITING_CARRIER"]

  - method: POST
    path: "/parcelroom/retail-returns/{id}/reject"
    description: "Staff rejects a bad-label return"
    roles: [ConciergeStaff]
    code: 200
    input: ["reject_reason?"]
    output: RetailReturn
    side_effects: ["DROPPED_OFF->REJECTED; decrement Property.return_staging_count"]

  - method: POST
    path: "/parcelroom/retail-returns/{id}/carrier-pickup"
    description: "Carrier collects the staged return"
    roles: [Carrier]
    code: 200
    input: []
    output: RetailReturn
    side_effects: ["AWAITING_CARRIER->PICKED_UP; decrement Property.return_staging_count"]

  # ---- Test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; the clock never falls back to real wall-clock time."
    roles: [PropertyManager, PmsIntegration]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for endpoint, or entity-backed actor is not the owner (wrong Resident/Carrier id)" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property id does not exist" }
  - { id: ERR_LOCKER_BANK_NOT_FOUND, http: 404, condition: "LockerBank id does not exist" }
  - { id: ERR_LOCKER_NOT_FOUND, http: 404, condition: "Locker id does not exist" }
  - { id: ERR_SHELF_NOT_FOUND, http: 404, condition: "Shelf id does not exist" }
  - { id: ERR_RESIDENT_NOT_FOUND, http: 404, condition: "Resident id does not exist" }
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "Carrier id does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "Package id does not exist" }
  - { id: ERR_RETAIL_RETURN_NOT_FOUND, http: 404, condition: "RetailReturn id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, invalid enum, negative amount, capacity<=0, out-of-range pct" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state permitting the transition/operation" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "return-complete actor equals return_initiated_by_user_id (dual-control breach)" }
  - { id: ERR_RESIDENT_NOT_ACTIVE, http: 409, condition: "notify attempted for a resident whose status != ACTIVE" }
  - { id: ERR_COLD_CHAIN_EXPIRED, http: 409, condition: "pickup of a PERISHABLE package strictly after cold_chain_deadline_at" }
  - { id: ERR_STORAGE_FROZEN, http: 409, condition: "locker assignment while Property.occupancy_posture == FROZEN" }
  - { id: ERR_STORAGE_RESTRICTED, http: 409, condition: "AMBIENT locker assignment while Property.occupancy_posture == RESTRICTED" }
  - { id: ERR_LOCKER_UNAVAILABLE, http: 409, condition: "target locker not AVAILABLE (OCCUPIED/OUT_OF_SERVICE), or out-of-service attempted on OCCUPIED locker" }
  - { id: ERR_LOCKER_SIZE_MISMATCH, http: 409, condition: "locker size too small for package, or storage_class mismatch (locker or shelf)" }
  - { id: ERR_SHELF_FULL, http: 409, condition: "shelf occupied_count == capacity" }
  - { id: ERR_NO_STORAGE_AVAILABLE, http: 409, condition: "auto-assign found no eligible locker or shelf" }
  - { id: ERR_INVALID_PICKUP_CODE, http: 403, condition: "supplied pickup_code does not match Package.pickup_code" }
  - { id: ERR_STAGING_FULL, http: 409, condition: "retail-return dropoff while return_staging_count == return_staging_capacity" }
  - { id: ERR_DUPLICATE_TRACKING, http: 409, condition: "tracking_number already used by a non-terminal package in the Property" }
  - { id: ERR_STALE_PROPERTY_VERSION, http: 412, condition: "expected_property_version != current Property.version on policy update" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PropertyManager
    description: "Property operator/superuser: configures property, policy, banks, lockers, shelves, carriers, residents; runs reports and aging sweeps; manual return eviction."
    identity: "opaque"
    exclusive_operations:
      - "POST /parcelroom/properties"
      - "PATCH /parcelroom/properties/{id}/policy"
      - "GET /parcelroom/properties/{id}/report"
      - "POST /parcelroom/locker-banks"
      - "POST /parcelroom/lockers"
      - "POST /parcelroom/lockers/{id}/out-of-service"
      - "POST /parcelroom/shelves"
      - "POST /parcelroom/carriers"
    shared_operations:
      - "POST /parcelroom/properties/{id}/aging-sweep (with ConciergeStaff)"
      - "POST /parcelroom/residents (with PmsIntegration)"
      - "POST /parcelroom/packages/{id}/return-initiate (with ConciergeStaff)"
      - "POST /_clock/set_current_utc (with PmsIntegration)"
      - "GET reads (all roles)"

  - name: ConciergeStaff
    description: "Front-desk staff: scans/logs packages, notifies residents, assigns storage, hands out packages, evicts overflow/aged packages, verifies/rejects retail returns."
    identity: "opaque"
    exclusive_operations:
      - "POST /parcelroom/packages/{id}/notify"
      - "POST /parcelroom/retail-returns/{id}/verify-label"
      - "POST /parcelroom/retail-returns/{id}/reject"
    shared_operations:
      - "POST /parcelroom/packages (with Carrier)"
      - "POST /parcelroom/packages/{id}/pickup (with Resident)"
      - "POST /parcelroom/packages/{id}/return-initiate (with PropertyManager)"
      - "POST /parcelroom/packages/{id}/return-complete (with Carrier)"
      - "POST /parcelroom/properties/{id}/aging-sweep (with PropertyManager)"

  - name: Resident
    description: "Building resident: receives notifications, picks up own packages with pickup code, drops off retail returns."
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /parcelroom/retail-returns (X-User-ID == resident_id)"
    shared_operations:
      - "POST /parcelroom/packages/{id}/pickup (own package: X-User-ID == package.resident_id; shared with ConciergeStaff)"

  - name: Carrier
    description: "Delivery carrier: scans in inbound packages, collects staged retail returns, may confirm returns to sender."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /parcelroom/retail-returns/{id}/carrier-pickup (X-User-ID == retail_return.carrier_id)"
    shared_operations:
      - "POST /parcelroom/packages (X-User-ID == carrier_id; shared with ConciergeStaff)"
      - "POST /parcelroom/packages/{id}/return-complete (with ConciergeStaff)"

  - name: PmsIntegration
    description: "Property-management-system connector: imports residents and applies roster lifecycle events (move-out, holds); operates the logical clock in test."
    identity: "opaque"
    exclusive_operations:
      - "POST /parcelroom/residents/{id}/pms-sync"
    shared_operations:
      - "POST /parcelroom/residents (with PropertyManager)"
      - "POST /_clock/set_current_utc (with PropertyManager)"
