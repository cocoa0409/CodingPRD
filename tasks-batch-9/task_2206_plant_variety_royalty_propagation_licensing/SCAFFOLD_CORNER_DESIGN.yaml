      - name: protection_posture_projection_ladder_and_lexicographic_jurisdictions
        claim_type: projection
        grounds:
          - calculations.variety_protection_posture
          - entities.Variety.fields.protected_jurisdictions
          - state_machines[ProtectionFiling.status]
        distinguishing_aspect: "The posture is re-projected from the full filing set on every filing transition, and the ladder is pinned: with one GRANTED (US), one MAINTENANCE_DUE (CA), one ABANDONED (MX) and one LAPSED (AU) filing the posture is PROTECTED and protected_jurisdictions is [CA, US] - lexicographic, NOT creation order, and MAINTENANCE_DUE still counts as in force. Lapsing both in-force filings drops the posture straight to LAPSED_PROTECTION, skipping PENDING, because ABANDONED contributes to no branch."
        test_recipe:
          setup:
            - "One Variety with four filings: US (granted), CA (granted then schedule-annuity so it sits MAINTENANCE_DUE), MX (abandoned from FILED), AU (granted then voluntarily lapsed)."
            - "Creation order is US, CA, MX, AU - deliberately not lexicographic, so an implementation echoing insertion order fails the ordering assertion."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Gallant Bramble", species: "Rubus idaeus", breeder_code: "GL", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
