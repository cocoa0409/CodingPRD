# =============================================================================
# task_2919 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every literal in `assert:` was computed against the §1.3 formulas and their
# constants (round_half_up throughout, integer cents for money).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: effectiveness_provisional_vs_certified_on_same_period
        grounds:
          - calculations.mitigation_effectiveness_score
          - entities.EffectivenessReport.fields.variant
          - entities.EffectivenessReport.fields.effectiveness_score
          - state_machines.EffectivenessReport.GENERATED_to_SUPERSEDED
        distinguishing_aspect: |
          On one provider's compliance domain (attestations, tracebacks, notices) the
          PROVISIONAL variant scores 0.8000 and the CERTIFIED variant scores 0.5000
          from byte-identical stored data, because pending tracebacks and open
          notices stay in the numerator only under PROVISIONAL.
        test_recipe:
          setup:
            - "Provider with an ACTIVE certificate and an ACCEPTED mitigation plan (auth_posture FULL_ATTESTATION)"
            - "One BUSINESS_REGISTRY_VERIFIED, origination-ENABLED customer owning +12025550111 from 2026-08-01T00:00:00Z"
            - "Two signed calls inside 2026-08: one level A (owned number) and one level B (unowned calling number)"
            - "Two traceback requests inside 2026-08: one RESPONDED on time, one received 2026-08-31T12:00:00Z and still RECEIVED with deadline 2026-09-01T12:00:00Z"
            - "Two illegal-traffic notices inside 2026-08: one mitigated to ALL_TRAFFIC_BLOCKED, one notified 2026-08-31T12:00:00Z and still NOTIFIED with deadline 2026-09-02T12:00:00Z"
            - "Logical clock parked at exactly 2026-09-01T00:00:00Z so the period [2026-08-01, 2026-09-01) has just elapsed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Acme Voice LLC", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/certificates"
              payload: { provider_id: "${prov_id}", spc_token: "SPC-0001", public_key_fingerprint: "fp-0001", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }
              as: PolicyAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /rmd/certificates/${cert_id}/issue"
              payload: {}
              as: PolicyAdministrator
            - call: "POST /rmd/certificates/${cert_id}/activate"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v0: $.data.version }
            - call: "POST /rmd/mitigation-plans"
              payload: { provider_id: "${prov_id}", prevention_practices: ["KYC_ONBOARDING", "TRACEBACK_COOPERATION", "TRAFFIC_PATTERN_MONITORING"], expected_provider_version: "${prov_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /rmd/mitigation-plans/${plan_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /rmd/mitigation-plans/${plan_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Regulator
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Nimbus Dialer Inc", contact_email: "ops@nimbus.example", kyc_evidence_level: "BUSINESS_REGISTRY_VERIFIED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025550111", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { asg1_id: $.data.id }
            - call: "POST /rmd/call-attestations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025550111", called_number: "+12025550999", origination_time: "2026-08-02T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { att_a_id: $.data.id }
            - call: "POST /rmd/call-attestations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025550222", called_number: "+12025550999", origination_time: "2026-08-03T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { att_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/traceback-requests"
              payload: { provider_id: "${prov_id}", calling_number: "+12025550111", called_number: "+12025550999", origination_time: "2026-08-02T00:00:00Z" }
              as: Regulator
              captures: { tb1_id: $.data.id }
            - call: "POST /rmd/traceback-requests/${tb1_id}/respond"
              payload: { identified_customer_id: "${cust_id}", produced_attestation_id: "${att_a_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/illegal-traffic-notices"
              payload: { provider_id: "${prov_id}", calling_number: "+12025550111", description: "High-volume prerecorded voice campaign" }
              as: Regulator
              captures: { not1_id: $.data.id }
            - call: "POST /rmd/illegal-traffic-notices/${not1_id}/investigate"
              payload: { customer_id: "${cust_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /rmd/illegal-traffic-notices/${not1_id}/mitigate"
              payload: { mitigation_action: "TRAFFIC_BLOCKED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T12:00:00Z" }
              as: Regulator
            - call: "POST /rmd/traceback-requests"
              payload: { provider_id: "${prov_id}", calling_number: "+12025550111", called_number: "+12025550999", origination_time: "2026-08-02T00:00:00Z" }
              as: Regulator
              captures: { tb2_id: $.data.id }
            - call: "POST /rmd/illegal-traffic-notices"
              payload: { provider_id: "${prov_id}", calling_number: "+12025550333", description: "Neighbour-spoofing complaints from two carriers" }
              as: Regulator
              captures: { not2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Regulator
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v1: $.data.version }
          trigger:
            - call: "POST /rmd/effectiveness-reports"
              payload: { provider_id: "${prov_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", variant: "PROVISIONAL", expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { rep_prov_id: $.data.id }
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v2: $.data.version }
            - call: "POST /rmd/effectiveness-reports"
              payload: { provider_id: "${prov_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", variant: "CERTIFIED", expected_provider_version: "${prov_v2}" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { rep_cert_id: $.data.id }
          assert:
            - "EffectivenessReport.${rep_prov_id}.signed_call_count == 2"
            - "EffectivenessReport.${rep_prov_id}.attestation_a_count == 1"
            - "EffectivenessReport.${rep_prov_id}.attestation_component == 0.5000"
            - "EffectivenessReport.${rep_prov_id}.traceback_component == 1.0000"
            - "EffectivenessReport.${rep_prov_id}.notice_component == 1.0000"
            - "EffectivenessReport.${rep_prov_id}.effectiveness_score == 0.8000"
            - "EffectivenessReport.${rep_prov_id}.data_sufficiency == SUFFICIENT"
            - "EffectivenessReport.${rep_cert_id}.traceback_component == 0.5000"
            - "EffectivenessReport.${rep_cert_id}.notice_component == 0.5000"
            - "EffectivenessReport.${rep_cert_id}.attestation_component == 0.5000"
            - "EffectivenessReport.${rep_cert_id}.effectiveness_score == 0.5000"
            - "EffectivenessReport.${rep_prov_id}.state == SUPERSEDED"
            - "EffectivenessReport.${rep_cert_id}.state == GENERATED"
            - "EffectivenessReport.${rep_cert_id}.traceback_total_count == 2 and EffectivenessReport.${rep_cert_id}.traceback_on_time_count == 1"

      - name: forfeiture_per_violation_vs_continuing_daily_on_same_body
        grounds:
          - calculations.forfeiture_assessment
          - entities.EnforcementAction.fields.assessment_basis
          - entities.EnforcementAction.fields.total_forfeiture_cents
          - entities.Provider.fields.outstanding_forfeiture_cents
        distinguishing_aspect: |
          On the money domain of EnforcementAction the identical request body
          (violation_count 3, violation_days 10, score_band HIGH) yields
          total_forfeiture_cents 2250000 under PER_VIOLATION and 1875000 under
          CONTINUING_DAILY — a different conserved quantity and a different entity
          from the effectiveness-score variant pair.
        test_recipe:
          setup:
            - "Provider with an ACTIVE certificate and an ACCEPTED plan"
