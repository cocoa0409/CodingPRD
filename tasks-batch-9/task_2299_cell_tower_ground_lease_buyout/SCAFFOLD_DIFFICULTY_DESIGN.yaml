  - rule_id: transitive_cascade
    instances:
      - name: rofr_exercise_cascades_deal_capital_portfolio_posture_and_sibling_deal
        grounds:
          - state_machines.RofrNotice.SERVED_to_EXERCISED
          - state_machines.Deal.DILIGENCE_to_ROFR_LOST
          - state_machines.Deal.RESERVED_to_RELEASED
          - calculations.portfolio_capital_ledger
          - state_machines.Deal.CAPITAL_HOLD_to_OUTREACH
        distinguishing_aspect: |
          Five-link chain seeded by a tower company decision: the ROFR EXERCISE flips the notice to
          EXERCISED, which forces deal A's stage to ROFR_LOST, which releases deal A's reserved capital,
          which drops the portfolio's utilization from exactly 9000 bps to 0 and its posture from FROZEN
          to OPEN, which in turn unfreezes sibling deal B from CAPITAL_HOLD back to OUTREACH. Each link
          is the sole cause of the next; no link fires without its predecessor.
        test_recipe:
          setup:
            - "A portfolio with exactly 40600000 cents of capital, so a single 36540000 cent commitment lands utilization at exactly 9000 bps and posture FROZEN."
            - "A tower company with rofr_required true and rofr_window_days 30, holding two tower sites."
            - "Deal A on stream A is in DILIGENCE with capital_state RESERVED, rofr_state PENDING, and a RofrNotice SERVED with window 2026-08-01 to 2026-08-31."
            - "Deal B on stream B was already in OUTREACH when deal A reserved capital, so the freeze cascaded it to CAPITAL_HOLD."
            - "Logical clock at the default 2026-08-01T00:00:00Z, inside the notice window."
