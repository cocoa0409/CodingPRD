          - state_machines.Tolerance.ESTABLISHED_to_REVOKED
          - state_machines.LabelAmendment.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Depth-3 chain from one trigger (issue-order): the order cancels the product
          (hop 1); the product's cancellation revokes its tolerances (hop 2); the
          tolerance revocation auto-rejects only the pending NEW_USE amendment whose
          payload commodity matches the revoked tolerance (hop 3) — a pending
          METHOD_CHANGE amendment on the same product stays SUBMITTED, proving hop 3
          is caused by hop 2, not by a product-level fan-out.
