  - id: ERR_PRESENCE_NOT_CONFIRMED
    http: 409
    condition: "Completing an event presence whose state is not CONFIRMED."
  - id: ERR_EVENT_WINDOW_OPEN
    http: 409
    condition: "Completing an event presence before the logical clock passes end_at."
  - id: ERR_PRESENCE_ALREADY_TERMINAL
    http: 409
    condition: "Cancelling an event presence whose state is COMPLETED or CANCELLED."

roles:
  - name: BrandProgramLead
    description: "Owns the employer-brand program - funding pools, job families, channels, career-site content and the persona approval decision."
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "PATCH /programs/{programId}"
      - "POST /job-families"
      - "POST /channels"
      - "POST /candidate-personas/{personaId}/review"
      - "POST /job-postings"
      - "POST /job-postings/{postingId}/optimize"
      - "POST /job-postings/{postingId}/publish"
      - "POST /job-postings/{postingId}/archive"
    shared_operations:
      - "All GET reads of programs, job families, channels, personas, signals, postings, flights, applications, touchpoints, members, campaigns, sends, reviews, presences and ledger entries"
  - name: PersonaResearcher
    description: "Runs candidate persona development and channel-preference research; drafts personas and retires stale ones."
    identity: opaque
    exclusive_operations:
      - "POST /candidate-personas"
      - "POST /channel-preference-signals"
      - "POST /candidate-personas/{personaId}/submit"
      - "POST /candidate-personas/{personaId}/retire"
    shared_operations:
      - "GET reads of programs, job families, channels, personas, signals, postings and flights"
  - name: ComplianceReviewer
    description: "Independent reviewer for advertising accuracy, equal-opportunity statements and legal sign-off on employer-review responses."
    identity: opaque
    exclusive_operations:
      - "POST /job-postings/{postingId}/compliance-review"
      - "POST /employer-reviews/{reviewId}/legal-review"
    shared_operations:
      - "GET reads of programs, job families, channels, personas, signals, postings, flights, applications, touchpoints and reviews"
  - name: MediaBuyer
    description: "Allocates paid media across job boards, social and programmatic, records delivered spend, and coordinates event and campus brand presence."
    identity: opaque
    exclusive_operations:
      - "POST /media-flights"
      - "POST /media-flights/{flightId}/activate"
      - "POST /media-flights/{flightId}/resume"
      - "POST /media-flights/{flightId}/spend"
      - "POST /media-flights/{flightId}/complete"
      - "POST /media-flights/{flightId}/cancel"
      - "POST /event-presences"
      - "POST /event-presences/{presenceId}/confirm"
      - "POST /event-presences/{presenceId}/complete"
      - "POST /event-presences/{presenceId}/cancel"
    shared_operations:
      - "POST /touchpoints (with RecruitingOps)"
      - "GET reads of programs, job families, channels, personas, signals, postings, flights, applications, touchpoints, reviews, presences and ledger entries"
  - name: CommunityManager
    description: "Runs talent-community nurture campaigns with consent and frequency management, and owns employer-review monitoring, triage and response drafting."
    identity: opaque
    exclusive_operations:
      - "POST /nurture-campaigns"
      - "POST /nurture-campaigns/{campaignId}/schedule"
      - "POST /nurture-campaigns/{campaignId}/dispatch"
      - "POST /nurture-campaigns/{campaignId}/cancel"
      - "POST /employer-reviews/{reviewId}/triage"
      - "POST /employer-reviews/{reviewId}/draft-response"
      - "POST /employer-reviews/{reviewId}/submit-legal"
      - "POST /employer-reviews/{reviewId}/close"
    shared_operations:
      - "POST /talent-community-members (with Anonymous)"
      - "POST /talent-community-members/{memberId}/consent-change (with Candidate)"
      - "POST /employer-reviews (with RecruitingOps)"
      - "GET reads of programs, job families, channels, personas, signals, postings, flights, members, campaigns, sends, reviews and presences"
  - name: RecruitingOps
    description: "Operates the application funnel - screening, qualification decisions and attribution ingestion - and owns the logical clock used by deadline rules."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /applications/{applicationId}/screen"
      - "POST /applications/{applicationId}/decide"
    shared_operations:
      - "POST /touchpoints (with MediaBuyer)"
      - "POST /employer-reviews (with CommunityManager)"
      - "GET reads of programs, job families, channels, personas, signals, postings, flights, applications, touchpoints, members, campaigns, sends, reviews, presences and ledger entries"
  - name: Candidate
    description: "A person who joined the talent community; X-User-ID is the id of their own TalentCommunityMember row, which bounds every consent action to that row."
    identity: "entity_backed:TalentCommunityMember"
    exclusive_operations: []
    shared_operations:
      - "POST /applications (with Anonymous)"
      - "POST /applications/{applicationId}/submit (with Anonymous)"
      - "POST /talent-community-members/{memberId}/confirm-consent (with Anonymous)"
      - "POST /talent-community-members/{memberId}/consent-change (with CommunityManager; only on the member whose id equals the acting X-User-ID)"
      - "GET /talent-community-members/{memberId}"
  - name: Anonymous
    description: "Unauthenticated career-site visitor - can browse published postings, start and submit applications, join the talent community and confirm the double opt-in with a token."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /applications (with Candidate)"
      - "POST /applications/{applicationId}/submit (with Candidate)"
