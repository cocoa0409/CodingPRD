  - rule_id: non_linear_state_machine
    instances:

      - name: lease_cycles_active_suspended_active_via_insurance_replacement
        grounds:
          - state_machines.LeaseAgreement[ACTIVE -> SUSPENDED]
          - state_machines.LeaseAgreement[SUSPENDED -> ACTIVE]
          - state_machines.InsuranceCertificate[ACTIVE -> REVOKED]
          - entities.LeaseAgreement.fields.suspension_reason
          - endpoints[POST /wetlease/insurance-certificates]
          - endpoints[POST /wetlease/insurance-certificates/{certificateId}/revoke]
        distinguishing_aspect: |
          Cycle, not a forward chain: the lease revisits ACTIVE after SUSPENDED, and the
          revisit is driven by creating a replacement certificate rather than by any lease
          endpoint. suspension_reason must be INSURANCE_LAPSED while suspended and back to
          null after reactivation, and the leg cancelled during suspension must NOT be
          resurrected - a naive "undo the suspension" implementation would restore it.
