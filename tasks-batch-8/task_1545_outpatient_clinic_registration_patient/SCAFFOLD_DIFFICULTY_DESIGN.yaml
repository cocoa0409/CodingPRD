              captures: { est0_status: "$.data[0].status" }
            - call: "GET /patient-access/appointments/${a_id}"
              as: FinancialCounselor
              captures: { gate_post: $.data.registration_gate, est_resp: $.data.estimated_patient_responsibility_cents }
          assert:
            - "gate_pre == CLEAR_WITH_PAYMENT"
            - "est0_status == SUPERSEDED"
            - "est_resp == 0"
            - "gate_post == CLEAR"

      - name: checkin_referral_consume_then_exhaust
        grounds:
          - state_machines.Appointment.READY_to_ARRIVED
          - state_machines.Referral.OPEN_to_EXHAUSTED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (check-in, not policy
          termination): appointment check-in (A) -> matched
          Referral.visits_consumed increments (B, caused by A) -> when the
          increment reaches visits_authorized the Referral itself flips
          OPEN -> EXHAUSTED (C, caused by B's increment).
        test_recipe:
          setup:
            - "Registered patient with HMO policy and an OPEN referral (visits_authorized=1, visits_consumed=0) matched to a READY ESTABLISHED appointment; gate CLEAR with no deposit"
