  - rule_id: boundary_precision_check
    instances:
    - name: risk_tier_boundary_score_exactly_fifty
      grounds:
      - calculations.composite_threat_score
      - calculations.risk_tier
      - calculations.required_staff_matrix
      - calculations.supervisor_span_requirement
      - calculations.minimum_staffing_cost_floor
      distinguishing_aspect: 'TIER_T3_MIN is 50 and the comparison is inclusive-at-the-bottom, so a composite_threat_score of exactly 50.00 must land in T3 while 49.99 stays in T2. Three expected attendances apart (3000 vs 2997 at a 9000-capacity venue) the two assessments differ by one hundredth of a point and yet by six line guards, one supervisor and 43200 cents of staffing floor — an off-by-one boundary that a > comparison silently gets wrong.

        '
      test_recipe:
        setup:
        - logical clock at 2026-09-01T00:00:00Z
        - Venue with gross_capacity 9000 and door_count 1
        - two SecurityEvents at that venue, one with expected_attendance 3000 and one with 2997, both with vip_present true and alcohol_served false
        - a DRAFT RiskAssessment on each event with threat ELEVATED, protest POSSIBLE, crowd_profile FAMILY, ingress_door_count 1, layout_complexity_score 3, history_incident_rate 0
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload:
            to_iso8601: '2026-09-01T00:00:00Z'
          as: SystemOperator
        - call: POST /event-security/venues
