              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /work-packages"
              payload: { project_id: "${proj}", trade_division: "03-CONCRETE", budget_amount: 500000.00, self_perform_intent: true }
              as: ConstructionManager
              captures: { wp: $.data.id, wpv0: $.data.version }
          trigger:
            - call: "POST /work-packages/${wp}/transparency"
              payload: { target_status: "DISCLOSED", disclosure_note: "auditor cannot publish what it must certify" }
              as: IndependentAuditor
              captures: { e1: $.data.error_id }
            - call: "POST /work-packages/${wp}/transparency"
              payload: { target_status: "DISCLOSED", disclosure_note: "crew rates, burdens and equipment rates published to the owner" }
              as: ProcurementOfficer
            - call: "POST /work-packages/${wp}/transparency"
              payload: { target_status: "AUDITED" }
              as: ProcurementOfficer
              captures: { e3: $.data.error_id }
            - call: "POST /work-packages/${wp}/transparency"
              payload: { target_status: "AUDITED" }
              as: IndependentAuditor
          assert:
            - "trigger call 1 returns 403 with data.error_id == ERR_UNAUTHORIZED even though IndependentAuditor IS in the endpoint's roles list: DISCLOSED is the ProcurementOfficer's step"
            - "after trigger call 1 WorkPackage.${wp}.transparency_status is still SEALED and version == ${wpv0}"
            - "trigger call 2 returns 200 with transparency_status == DISCLOSED and procurement_status still BUDGETED: the disclosure axis moves alone"
            - "trigger call 3 returns 403 with data.error_id == ERR_UNAUTHORIZED, NOT ERR_PACKAGE_STATE_INVALID: DISCLOSED -> AUDITED is a legal step, it is simply not this role's step, and the priority-21 gate answers before the priority-64 state gate"
            - "trigger call 4 returns 200 with transparency_status == AUDITED"

