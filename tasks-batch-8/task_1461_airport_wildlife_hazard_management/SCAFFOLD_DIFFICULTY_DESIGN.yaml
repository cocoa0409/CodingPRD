              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/dispersal-activities/${d1_id}/close"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            # D2: take 2, review only (would total exactly 5)
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-16T10:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 3, animals_taken_lethal: 2, take_permit_id: "${tp_id}" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
