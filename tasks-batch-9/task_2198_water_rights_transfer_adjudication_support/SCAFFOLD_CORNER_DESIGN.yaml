          trigger:
            - {call: "GET /water-rights/00000000-0000-0000-0000-0000000000aa", as: WaterRightsAnalyst, captures: {e1: "$.data.error_id"}}
            - {call: "GET /claimants/00000000-0000-0000-0000-0000000000bb", as: WaterRightsAnalyst, captures: {e2: "$.data.error_id"}}
