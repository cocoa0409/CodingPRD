  - name: area_rolling_absorption_peak_exceeds_annual_cap
    grounds:
    - calculations.area_rolling_absorption
    - validations[priority=69]
    - errors[ERR_AREA_ABSORPTION_EXCEEDED]
    - entities.PlanningArea.fields.annual_absorption_cap_units
    - entities.HousingDevelopment.fields.buildout_months
    - endpoints[POST /redistricting/planning-areas/{id}/housing-developments]
    distinguishing_aspect: 'COMPLETELY DIFFERENT interval semantics from the regime buffer: here every development occupies a half-open delivery window, units accrue uniformly per 30-day month, and the constraint is an AGGREGATE CAPACITY PEAK over a sliding 12-month probe rather than a pairwise disjointness test. Two individually-legal developments (60.00 and 89.83 against a cap of 90) are accepted; a third that is tiny on its own (40 units) is rejected because it lifts the peak to 129.83; and a fourth whose window merely TOUCHES an existing window contributes exactly 0 to that probe and is accepted - the opposite of the regime rule, where touching is fatal.'
    test_recipe:
      setup:
      - The Riverbend study is DATA_LOCKED and area A-03 has annual_absorption_cap_units 90 and no housing developments yet.
      - The clock reads 2026-09-01T00:00:00Z, so every first_occupancy_date below is in the future.
      - 'The arithmetic uses DAYS_PER_MONTH 30 and ROLLING_ABSORPTION_WINDOW_MONTHS 12, so a 12-month buildout spans exactly 360 days: ''Sable Ridge'' occupies [2027-01-01, 2027-12-27) and ''Sable Ridge II'' occupies [2027-07-01, 2028-06-25).'
      - Because the entitlement pipeline is empty for A-03, no projection run is affected in a way that could pre-empt the absorption rule.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: DistrictPlanner
        as_user_id: planner-1
