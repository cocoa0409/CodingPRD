            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 0.10 }, as: LabAnalyst, as_user_id: "lab-1" }
          trigger:
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-1", captures: { err: $.data.error_id } }
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2", captures: { st: $.data.status, cb: $.data.confirmed_by_user_id } }
          assert:
            - "confirm by recorder lab-1: error_id == ERR_SEGREGATION_OF_DUTIES (403)"
            - "confirm by lab-2 succeeds: status == CONFIRMED, confirmed_by_user_id == lab-2"

      - name: officer_cannot_resolve_own_case
        claim_type: segregation_of_duties
        grounds: ["state_machines.EnforcementCase.OPENED_to_DISMISSED", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The case opener (eo-1) cannot resolve it (403 ERR_SEGREGATION_OF_DUTIES); a second officer (eo-2) resolves to DISMISSED with no sanction and no penalty points."
        test_recipe:
          setup: ["brand with DRAFT product; case C1 opened by eo-1"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /enforcement-cases", payload: { product_id: "${p1}", source: "CONSUMER_COMPLAINT", description: "d" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /enforcement-cases/${c1}/resolve", payload: { outcome: "DISMISSED" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { err: $.data.error_id } }
            - { call: "POST /enforcement-cases/${c1}/resolve", payload: { outcome: "DISMISSED" }, as: EnforcementOfficer, as_user_id: "eo-2", captures: { st: $.data.status, pp: $.data.penalty_points } }
          assert:
            - "resolve by opener: error_id == ERR_SEGREGATION_OF_DUTIES (403)"
            - "resolve by eo-2: status == DISMISSED and penalty_points == 0"

      - name: auditor_not_assigned_cannot_submit_report
        claim_type: rbac_exclusive_denied
        grounds: ["roles.Auditor", "errors[ERR_NOT_ASSIGNED_AUDITOR]"]
        distinguishing_aspect: "Assignment-scoped authorization: an Auditor whose id differs from the audit's auditor_id gets 403 ERR_NOT_ASSIGNED_AUDITOR on submit-report."
        test_recipe:
          setup: ["audit A1 assigned to aud-1"]
          setup_api_calls:
