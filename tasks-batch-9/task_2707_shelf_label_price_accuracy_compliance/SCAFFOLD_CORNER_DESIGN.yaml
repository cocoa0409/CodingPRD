              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_def}/scan-lines"
              payload: { item_upc: "00000000002002", shelf_price_cents: 1000, register_price_cents: 900 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_def}/scan-lines"
              payload: { item_upc: "00000000002003", shelf_price_cents: 500, register_price_cents: 500 }
