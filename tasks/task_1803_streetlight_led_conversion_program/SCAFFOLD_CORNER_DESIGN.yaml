  - name: calc_ticket_duplicate_selector
    claim_type: correct_result
    grounds:
    - calculations.ticket_duplicate_selector
    - entities.OutageTicket.fields.duplicate_of_ticket_id
    distinguishing_aspect: 'Selector determinism: while t1 is OPEN, t2 auto-links DUPLICATE -> t1 (earliest created candidate); while t1 is RESOLVED (still a candidate) t3 also links to t1 — never to the
      DUPLICATE t2; once t1 is VERIFIED (excluded) the candidate set is empty and t4 is created OPEN.'
    test_recipe:
      setup:
      - ACTIVE program, RESIDENTIAL district, crew; utility pole 90W; ticket t1 OPEN
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: P
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
