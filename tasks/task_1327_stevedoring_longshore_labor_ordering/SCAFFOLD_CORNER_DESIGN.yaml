        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispatch-batch-stale-gang-order]
          - errors[ERR_STALE_GANG_ORDER_VERSION]
        distinguishing_aspect: "The first batch bumps GangOrder.version from 1 to 2; a second batch replaying expected_gang_order_version 1 is rejected 412 even though the gang state would otherwise permit a top-up batch."
        test_recipe:
          setup: ["Gang G headcount 2; three HOLDMANs; first batch already ran (version now 2, W1+W2 OFFERED)"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Occ1", voyage_number: "X-601", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
