        grounds: [validations.priority_28, errors.ERR_INVALID_RUNTIME_WINDOW]
        distinguishing_aspect: "Priority 28 is a compound temporal-plus-physical guard: window_end must be strictly after window_start AND static_pressure_delta_pa must be strictly positive, and both violations surface the same error_id."
        test_recipe:
          setup:
            - "A property with one unit exists; the unit needs no particular status because runtime ingestion is not property-state gated."
          setup_api_calls:
