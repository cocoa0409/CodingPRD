            - { call: "POST /vbs/families", payload: { household_name: "Baker", primary_contact_name: "Sam Baker", email: "baker@example.com", phone: "555-0102" }, as: Anonymous, captures: { fam2: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam1}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam1}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam2}", first_name: "Kid", last_name: "B", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam2}", captures: { kb: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam1}", captures: { reg_a: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kb}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam2}", captures: { reg_b: $.data.id } }
          trigger:
            - { call: "POST /vbs/families/${fam1}/archive", payload: {}, as: RegistrationCoordinator, captures: { f_status: $.data.status } }
            - { call: "GET /vbs/registrations/${reg_a}", payload: {}, as: RegistrationCoordinator, captures: { a_status: $.data.status, a_reason: $.data.cancellation_reason } }
            - { call: "GET /vbs/registrations/${reg_b}", payload: {}, as: RegistrationCoordinator, captures: { b_status: $.data.status, b_exp: $.data.offer_expires_at } }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { k_enr: $.data.enrolled_count, k_off: $.data.offered_count, k_status: $.data.status } }
          assert:
            - "${f_status} == ARCHIVED"
            - "${a_status} == CANCELLED and ${a_reason} == ADMIN  (hop 2: archive cancels the enrollee)"
            - "${b_status} == OFFERED and ${b_exp} == 2026-08-03T00:00:00Z  (hop 3: promotion fired by hop 2's freed seat)"
            - "${k_enr} == 0 and ${k_off} == 1 and ${k_status} == ACCEPTING"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict across DIFFERENT category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkin_safety_beats_state
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_ACCOMMODATION_NOT_APPROVED]
