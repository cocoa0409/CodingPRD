scaffold_difficulty_design:
  # =========================================================================
  # Rule 1: dual_variant_calc — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: nutrient_compliance_standard_vs_borderline_infant
        grounds:
          - calculations.nutrient_compliance_check
          - calculations.nutrient_compliance_check.variants.standard
          - calculations.nutrient_compliance_check.variants.borderline_infant
        distinguishing_aspect: |
          Same measured nutrient value (protein at 1.80 per 100kcal) passes under the
          standard variant for a TODDLER-12-36M profile (min=1.80) but fails under the
          borderline_infant variant for an INF-0-6M profile (effective_min = 1.80*1.02 = 1.8360).
          The variants operate on ProductionBatch nutrient_results, producing different
          pass/fail outcomes for identical measured data depending on which NutrientProfile
          the formula references.
        test_recipe:
          setup:
            - "Two NutrientProfiles exist: NP-INFANT (profile_code INF-0-6M, status APPROVED) and NP-TODDLER (profile_code TODDLER-12-36M, status APPROVED). Both have a protein spec with min=1.80, max=3.50, target=2.50."
            - "Two Formulas exist: F-INFANT referencing NP-INFANT (status ACTIVE, process_type DRY_BLEND) and F-TODDLER referencing NP-TODDLER (status ACTIVE, process_type DRY_BLEND)."
            - "A QUALIFIED Supplier exists, an Ingredient exists, and an IngredientLot (QC_PASSED, sufficient quantity) exists."
            - "A ProcessValidation (DRY_BLEND_HOMOGENEITY, PASSED, valid_until in future) exists for both formulas."
            - "An APPROVED LabelSubmission exists for both formulas."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs:
                  - nutrient_code: "PROTEIN"
                    unit: "g"
                    min_per_100kcal: 1.80
                    max_per_100kcal: 3.50
                    target_per_100kcal: 2.50
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_infant_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${np_infant_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np_infant_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "TODDLER-12-36M"
                nutrient_specs:
                  - nutrient_code: "PROTEIN"
                    unit: "g"
                    min_per_100kcal: 1.80
                    max_per_100kcal: 3.50
                    target_per_100kcal: 2.50
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_toddler_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${np_toddler_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np_toddler_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "WPC-80"
                ingredient_name: "Whey Protein Concentrate 80%"
                category: "DAIRY_BASE"
                pathogen_risk_class: "HIGH_RISK"
                storage_condition: "REFRIGERATED"
              as: QA_MANAGER
              captures: { ing_protein_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "PALM-OLEIN"
                ingredient_name: "Palm Olein Oil"
                category: "VEGETABLE_OIL"
                pathogen_risk_class: "MEDIUM_RISK"
                storage_condition: "AMBIENT"
              as: QA_MANAGER
              captures: { ing_fat_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload:
                supplier_code: "SUP-DAIRY-01"
                legal_name: "Premium Dairy Ingredients Ltd"
                ingredient_categories: ["DAIRY_BASE", "VEGETABLE_OIL"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { supplier_id: $.data.id }
            - call: "POST /api/v1/suppliers/${supplier_id}/audits"
              payload:
                audit_type: "INITIAL"
                audit_date: "2026-07-01T00:00:00Z"
                auditor_name: "Jane Auditor"
                score: 92.50
                findings: []
              as: QUALITY_ANALYST
            - call: "POST /api/v1/ingredient-lots"
              payload:
                ingredient_id: "${ing_protein_id}"
                supplier_id: "${supplier_id}"
                lot_number: "LOT-WPC-001"
                quantity_kg: 500.000
                received_date: "2026-07-15T00:00:00Z"
                expiry_date: "2027-07-15T00:00:00Z"
              as: SUPPLY_CHAIN_PLANNER
              captures: { lot_protein_id: $.data.id }
            - call: "POST /api/v1/ingredient-lots/${lot_protein_id}/qc-pass"
              payload: {}
              as: QUALITY_ANALYST
            - call: "POST /api/v1/ingredient-lots"
              payload:
                ingredient_id: "${ing_fat_id}"
                supplier_id: "${supplier_id}"
                lot_number: "LOT-FAT-001"
                quantity_kg: 300.000
                received_date: "2026-07-15T00:00:00Z"
                expiry_date: "2027-07-15T00:00:00Z"
              as: SUPPLY_CHAIN_PLANNER
              captures: { lot_fat_id: $.data.id }
            - call: "POST /api/v1/ingredient-lots/${lot_fat_id}/qc-pass"
              payload: {}
              as: QUALITY_ANALYST
            - call: "POST /api/v1/formulas"
              payload:
                formula_code: "IF-START-1"
                product_name: "InfStart Stage 1"
                nutrient_profile_id: "${np_infant_id}"
                ingredients:
                  - ingredient_id: "${ing_protein_id}"
                    percentage_by_weight: 60.000
                    is_critical: true
                  - ingredient_id: "${ing_fat_id}"
                    percentage_by_weight: 40.000
                    is_critical: false
                process_type: "DRY_BLEND"
              as: REGULATORY_AFFAIRS
              captures: { f_infant_id: $.data.id }
            - call: "POST /api/v1/formulas"
              payload:
                formula_code: "IF-TODDLER-3"
                product_name: "ToddlerGrow Stage 3"
                nutrient_profile_id: "${np_toddler_id}"
                ingredients:
                  - ingredient_id: "${ing_protein_id}"
                    percentage_by_weight: 60.000
                    is_critical: true
                  - ingredient_id: "${ing_fat_id}"
                    percentage_by_weight: 40.000
                    is_critical: false
                process_type: "DRY_BLEND"
              as: REGULATORY_AFFAIRS
              captures: { f_toddler_id: $.data.id }
            - call: "POST /api/v1/formulas/${f_infant_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/formulas/${f_toddler_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/process-validations"
              payload:
                formula_id: "${f_infant_id}"
                validation_type: "DRY_BLEND_HOMOGENEITY"
                protocol_version: "PV-2026-001"
                validation_validity_days: 365
              as: QA_MANAGER
              captures: { pv_infant_id: $.data.id }
            - call: "POST /api/v1/process-validations"
              payload:
                formula_id: "${f_toddler_id}"
                validation_type: "DRY_BLEND_HOMOGENEITY"
                protocol_version: "PV-2026-002"
                validation_validity_days: 365
              as: QA_MANAGER
              captures: { pv_toddler_id: $.data.id }
            - call: "POST /api/v1/process-validations/${pv_infant_id}/start"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/process-validations/${pv_infant_id}/complete"
              payload:
                test_results:
                  - test_name: "homogeneity_cv"
                    measured_value: 3.2
                    acceptance_criteria: "<= 5.0"
                    pass: true
              as: QUALITY_ANALYST
            - call: "POST /api/v1/process-validations/${pv_toddler_id}/start"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/process-validations/${pv_toddler_id}/complete"
              payload:
                test_results:
                  - test_name: "homogeneity_cv"
                    measured_value: 3.2
                    acceptance_criteria: "<= 5.0"
                    pass: true
              as: QUALITY_ANALYST
            - call: "POST /api/v1/formulas/${f_infant_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/formulas/${f_toddler_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions"
              payload:
                formula_id: "${f_infant_id}"
                submission_type: "NEW_PRODUCT_REGISTRATION"
                label_text: "InfStart Stage 1 - Complete infant nutrition for 0-6 months"
                claims: ["Supports brain development"]
              as: REGULATORY_AFFAIRS
              captures: { ls_infant_id: $.data.id }
            - call: "POST /api/v1/label-submissions"
              payload:
                formula_id: "${f_toddler_id}"
                submission_type: "NEW_PRODUCT_REGISTRATION"
                label_text: "ToddlerGrow Stage 3 - Toddler nutrition for 12-36 months"
                claims: ["Supports growth"]
              as: REGULATORY_AFFAIRS
              captures: { ls_toddler_id: $.data.id }
            - call: "POST /api/v1/label-submissions/${ls_infant_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/label-submissions/${ls_toddler_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/label-submissions/${ls_infant_id}/assign-reviewer"
              payload: { reviewer_id: "usr_qa_mgr_01" }
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions/${ls_toddler_id}/assign-reviewer"
              payload: { reviewer_id: "usr_qa_mgr_01" }
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions/${ls_infant_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions/${ls_toddler_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/formulas/${f_infant_id}/activate"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/formulas/${f_toddler_id}/activate"
              payload: {}
              as: QA_MANAGER
            - call: "GET /api/v1/formulas/${f_infant_id}"
              as: QA_MANAGER
              captures: { f_infant_ver: $.data.version }
            - call: "GET /api/v1/formulas/${f_toddler_id}"
              as: QA_MANAGER
              captures: { f_toddler_ver: $.data.version }
            - call: "POST /api/v1/production-batches"
              payload:
                formula_id: "${f_infant_id}"
                batch_size_kg: 100.000
                production_date: "2026-08-01T00:00:00Z"
                expected_formula_version: "${f_infant_ver}"
              as: PRODUCTION_SUPERVISOR
              captures: { batch_infant_id: $.data.id }
            - call: "POST /api/v1/production-batches"
              payload:
                formula_id: "${f_toddler_id}"
                batch_size_kg: 100.000
                production_date: "2026-08-01T00:00:00Z"
                expected_formula_version: "${f_toddler_ver}"
              as: PRODUCTION_SUPERVISOR
              captures: { batch_toddler_id: $.data.id }
            - call: "POST /api/v1/production-batches/${batch_infant_id}/start-production"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/production-batches/${batch_toddler_id}/start-production"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/production-batches/${batch_infant_id}/complete-blending"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/production-batches/${batch_toddler_id}/complete-blending"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/production-batches/${batch_infant_id}/complete-processing"
              payload: { actual_yield_kg: 98.500 }
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/production-batches/${batch_toddler_id}/complete-processing"
              payload: { actual_yield_kg: 98.500 }
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/production-batches/${batch_infant_id}/submit-for-testing"
              payload: {}
              as: QUALITY_ANALYST
            - call: "POST /api/v1/production-batches/${batch_toddler_id}/submit-for-testing"
              payload: {}
              as: QUALITY_ANALYST
          trigger:
            - call: "POST /api/v1/production-batches/${batch_infant_id}/submit-test-results"
              payload:
                nutrient_results:
                  - nutrient_code: "PROTEIN"
                    measured_per_100kcal: 1.80
                pathogen_results:
                  - pathogen_code: "CRONOBACTER"
                    detected: false
                    cfu_per_g: 0
              as: QUALITY_ANALYST
              captures: { batch_infant_result: $.data }
            - call: "POST /api/v1/production-batches/${batch_toddler_id}/submit-test-results"
              payload:
                nutrient_results:
                  - nutrient_code: "PROTEIN"
                    measured_per_100kcal: 1.80
                pathogen_results:
                  - pathogen_code: "CRONOBACTER"
                    detected: false
                    cfu_per_g: 0
              as: QUALITY_ANALYST
              captures: { batch_toddler_result: $.data }
          assert:
            - "ProductionBatch.${batch_infant_id}.nutrient_results[0].pass == false (borderline_infant variant: 1.80 < 1.80*1.02 = 1.8360)"
            - "ProductionBatch.${batch_toddler_id}.nutrient_results[0].pass == true (standard variant: 1.80 >= 1.80)"
            - "ProductionBatch.${batch_infant_id}.status == POSITIVE_RELEASE_HOLD"
            - "ProductionBatch.${batch_toddler_id}.status == POSITIVE_RELEASE_HOLD"

      - name: allocation_pro_rata_provisional_vs_final
        grounds:
          - calculations.allocation_pro_rata
          - calculations.allocation_pro_rata.variants.provisional
          - calculations.allocation_pro_rata.variants.final
        distinguishing_aspect: |
          The provisional variant allocates based on all PENDING entries at activation time;
          the final variant reallocates only among still-PENDING entries after one entry
          is cancelled post-activation. With 3 entries requesting 100, 200, 300 kg and
          300 kg available, provisional gives ~50/100/150 kg; if the first entry is removed,
          final gives ~100/200 kg to the remaining two, producing different allocations
          for the remaining entries.
        test_recipe:
          setup:
            - "An ACTIVE Formula F1 exists with all prerequisites met."
            - "A QUALIFIED Supplier with QC_PASSED IngredientLots exists."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-6-12M"
                nutrient_specs:
                  - nutrient_code: "IRON"
                    unit: "mg"
                    min_per_100kcal: 1.00
                    max_per_100kcal: 2.00
                    target_per_100kcal: 1.50
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${np_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "LACTOSE-FG"
                ingredient_name: "Lactose Food Grade"
                category: "CARBOHYDRATE"
                pathogen_risk_class: "LOW_RISK"
                storage_condition: "AMBIENT"
              as: QA_MANAGER
              captures: { ing_id: $.data.id }
            - call: "POST /api/v1/formulas"
              payload:
                formula_code: "IF-FOLLOW-2"
                product_name: "FollowOn Stage 2"
                nutrient_profile_id: "${np_id}"
                ingredients:
                  - ingredient_id: "${ing_id}"
                    percentage_by_weight: 100.000
                    is_critical: true
                process_type: "DRY_BLEND"
              as: REGULATORY_AFFAIRS
              captures: { f_id: $.data.id }
            - call: "POST /api/v1/formulas/${f_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/process-validations"
              payload:
                formula_id: "${f_id}"
                validation_type: "DRY_BLEND_HOMOGENEITY"
                protocol_version: "PV-2026-003"
                validation_validity_days: 365
              as: QA_MANAGER
              captures: { pv_id: $.data.id }
            - call: "POST /api/v1/process-validations/${pv_id}/start"
              payload: {}
              as: PRODUCTION_SUPERVISOR
            - call: "POST /api/v1/process-validations/${pv_id}/complete"
              payload:
                test_results:
                  - test_name: "homogeneity_cv"
                    measured_value: 4.0
                    acceptance_criteria: "<= 5.0"
                    pass: true
              as: QUALITY_ANALYST
            - call: "POST /api/v1/formulas/${f_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions"
              payload:
                formula_id: "${f_id}"
                submission_type: "NEW_PRODUCT_REGISTRATION"
                label_text: "FollowOn Stage 2 - For 6-12 months"
              as: REGULATORY_AFFAIRS
              captures: { ls_id: $.data.id }
            - call: "POST /api/v1/label-submissions/${ls_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/label-submissions/${ls_id}/assign-reviewer"
              payload: { reviewer_id: "usr_qa_mgr_01" }
              as: QA_MANAGER
            - call: "POST /api/v1/label-submissions/${ls_id}/approve"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/formulas/${f_id}/activate"
              payload: {}
              as: QA_MANAGER
            - call: "POST /api/v1/allocation-plans"
              payload:
                formula_id: "${f_id}"
                total_available_kg: 300.000
                allocation_method: "PRO_RATA"
              as: SUPPLY_CHAIN_PLANNER
              captures: { plan_id: $.data.id, plan_ver: $.data.version }
            - call: "POST /api/v1/allocation-plans/${plan_id}/entries"
              payload:
                customer_code: "CUST-A"
                customer_name: "Retailer Alpha"
                requested_kg: 100.000
              as: SUPPLY_CHAIN_PLANNER
              captures: { entry_a_id: $.data.id }
            - call: "POST /api/v1/allocation-plans/${plan_id}/entries"
              payload:
                customer_code: "CUST-B"
                customer_name: "Retailer Beta"
                requested_kg: 200.000
              as: SUPPLY_CHAIN_PLANNER
              captures: { entry_b_id: $.data.id }
            - call: "POST /api/v1/allocation-plans/${plan_id}/entries"
              payload:
                customer_code: "CUST-C"
                customer_name: "Retailer Gamma"
                requested_kg: 300.000
              as: SUPPLY_CHAIN_PLANNER
              captures: { entry_c_id: $.data.id }
            - call: "GET /api/v1/allocation-plans/${plan_id}"
              as: SUPPLY_CHAIN_PLANNER
              captures: { plan_ver_after_entries: $.data.version }
          trigger:
            - call: "POST /api/v1/allocation-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_ver_after_entries}" }
              as: SUPPLY_CHAIN_PLANNER
              captures: { activated_plan: $.data }
            - call: "GET /api/v1/allocation-entries/${entry_a_id}"
              as: SUPPLY_CHAIN_PLANNER
              captures: { entry_a: $.data }
            - call: "GET /api/v1/allocation-entries/${entry_b_id}"
              as: SUPPLY_CHAIN_PLANNER
              captures: { entry_b: $.data }
            - call: "GET /api/v1/allocation-entries/${entry_c_id}"
              as: SUPPLY_CHAIN_PLANNER
              captures: { entry_c: $.data }
          assert:
            - "AllocationEntry.${entry_a_id}.allocated_kg == 50.000 (pro-rata: 100/600 * 300 = 50.000)"
            - "AllocationEntry.${entry_b_id}.allocated_kg == 100.000 (pro-rata: 200/600 * 300 = 100.000)"
            - "AllocationEntry.${entry_c_id}.allocated_kg == 150.000 (pro-rata: 300/600 * 300 = 150.000)"
            - "AllocationPlan.${plan_id}.status == ACTIVE"

  # =========================================================================
  # Rule 2: combinatorial_formula — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pro_rata_allocation_remainder_distribution
        grounds:
          - calculations.allocation_pro_rata
        distinguishing_aspect: |
          Mode (b) nested rounding: pro-rata allocation truncates each entry to 3 decimal
          places via floor, then distributes the remainder in 0.001 increments in
          created_at ASC order. The truncation-vs-round choice and the remainder order
          produce different results than a naive round-each approach. E.g., 100 kg
          across 3 equal entries yields 33.333/33.333/33.334 with the remainder
          going to the first-created entry.
        test_recipe:
          setup:
            - "An ACTIVE Formula F2 exists with all prerequisites met (same setup chain as allocation_pro_rata_provisional_vs_final)."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "CEREAL-6M"
                nutrient_specs:
                  - nutrient_code: "IRON"
                    unit: "mg"
                    min_per_100kcal: 1.00
                    max_per_100kcal: 2.00
                    target_per_100kcal: 1.50
                regulation_ref: "EU 2016/127"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np2_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${np2_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np2_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "RICE-FLOUR"
                ingredient_name: "Rice Flour Organic"
                category: "CARBOHYDRATE"
                pathogen_risk_class: "LOW_RISK"
                storage_condition: "AMBIENT"
              as: QA_MANAGER
