        grounds: ["validations[priority=29]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]", "calculations.buyer_exposure"]
        distinguishing_aspect: "Credit check is inclusive: exposure 0 + invoice 48500 == limit 48500 passes; the second identical submit (97000 > 48500) fails."
