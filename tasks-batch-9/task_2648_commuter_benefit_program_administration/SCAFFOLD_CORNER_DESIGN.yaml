        claim_type: Correct Result
        grounds:
          - calculations.election_pretax_exclusion_split
          - entities.Employer.fields.pretax_ratio_cap_pct
          - entities.Employer.fields.spill_policy
        distinguishing_aspect: "Known inputs where the THIRD-of-four ceiling wins: with pretax_ratio_cap_pct 80 and a lone 10000-cent pre-tax election, group headroom (30000) and the category cap (30000) are both slack, so ratio_cap_cents = floor(10000 * 80 / 100) = 8000 decides, leaving posttax_spill_cents 2000 under the default SPILL_TO_POSTTAX policy while total_amount_cents stays at the requested 10000."
        test_recipe:
          setup:
            - "Employer 'Ratio Cap Co' is ACTIVE in US-TX-AUS with pretax_ratio_cap_pct 80, spill_policy SPILL_TO_POSTTAX (default), transit_group_limit_cents 30000 and an ACTIVE TRANSIT_PASS category with monthly_exclusion_limit_cents 30000."
            - "One employee holds a BenefitAccount at version 1 and the 2026-08 window is OPEN."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Ratio Cap Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000, pretax_ratio_cap_pct: 80 }
              as: ProgramAdmin
