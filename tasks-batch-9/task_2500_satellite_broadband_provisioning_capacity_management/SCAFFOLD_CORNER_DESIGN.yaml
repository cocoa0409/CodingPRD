  - section: cross_cutting_layers
    instances:

      - name: stale_service_cell_version_at_activation_rejected_then_a_fresh_read_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.activation-stale-service-cell
          - validations[priority=7]
          - 'errors[ERR_STALE_SERVICE_CELL_VERSION]'
          - 'endpoints["POST /satellite-broadband/subscriptions"]'
        distinguishing_aspect: "The activation that the stale token blocks is otherwise legal — the cell still has a free slot — so only OCC can reject it; the identical body with the re-read version then succeeds, proving the 412 is a token check and not a capacity check."
        test_recipe:
          setup:
            - "ACTIVE + COORDINATED licence, beam BEAM-01 (1000 Mbps), cell CELL-001 (max 2), plan PLAN-P1-200."
            - "Subscriber sub1 has a RESERVED order and an INSTALLED terminal; ${cell_v1} is the cell version read at that point."
            - "A second order for sub2 is then placed on the same cell, advancing ServiceCell.version past ${cell_v1} while leaving one free slot."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
