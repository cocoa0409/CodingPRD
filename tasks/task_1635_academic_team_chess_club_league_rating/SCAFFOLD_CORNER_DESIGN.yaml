            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "S-B", min_rating: 0, max_rating: 2900, allow_provisional: true, max_entries: 10 }, as: FederationAdmin, captures: { s2: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "S-C", min_rating: 0, max_rating: 2900, allow_provisional: true, max_entries: 10 }, as: FederationAdmin, captures: { s3: $.data.id } }
