# =============================================================================
# 1.8 Scaffold Difficulty Design — task_2301 Pension Risk Transfer & Annuity Buyout
# =============================================================================
# Nine Difficulty Rules from SKILL.md 0.5, each with >= 2 differentiated
# instances. Every literal in an `assert:` line below was computed by executing
# the corresponding calculations[].formula against its constants. The logical
# clock starts at 2026-08-01T00:00:00Z by default (see the /_clock endpoint in
# 1.5) and every instance that depends on time moves it explicitly.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: strategy_dual_basis_projected_cost_diverges
        grounds:
          - calculations.strategy_projected_settlement_cost
          - calculations.participant_accounting_liability
          - calculations.participant_settlement_liability
          - state_machines.DeRiskingStrategy.DRAFT_to_UNDER_EVALUATION
          - entities.DeRiskingStrategy.fields.projected_basis_gap_cents
        distinguishing_aspect: |
          One submission computes the SAME participant population twice and stores
          two different totals: the ACCOUNTING_BASIS variant uses factor 118000 and
          suppresses the expense load entirely, while the SETTLEMENT_BASIS variant
          uses factor 126250 AND adds a 350 bp expense load, so
          projected_settlement_cost_cents exceeds projected_accounting_cost_cents by
          exactly 8057372 cents on identical inputs.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one PensionPlan with total_liability_cents 100000000 and plan_assets_cents 92000000"
            - "three RETIREE_IN_PAY participants with stated monthly benefits 250001, 180003 and 99999 cents, all IN_PLAN and none DECEASED_CONFIRMED, all with audited_monthly_benefit_cents still null so the stated amounts drive the projection"
            - "one DRAFT DeRiskingStrategy of strategy_type ANNUITY_BUYOUT, whose cohort map admits exactly the RETIREE_IN_PAY population"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Meridian Industrial Group", plan_name: "Meridian Salaried Retirement Plan", plan_ein: "471203955", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 510 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "P-0001", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 250001, final_average_monthly_earnings_cents: 500000, credited_service_months: 400, date_of_birth: "1955-03-14" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "P-0002", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 180003, final_average_monthly_earnings_cents: 360000, credited_service_months: 400, date_of_birth: "1954-07-02" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p2_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "P-0003", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 99999, final_average_monthly_earnings_cents: 200000, credited_service_months: 400, date_of_birth: "1958-11-20" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p3_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/strategies"
              payload: { strategy_name: "Retiree Buyout Phase 1", strategy_type: "ANNUITY_BUYOUT" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { strategy_id: $.data.id }
          trigger:
            - call: "POST /prt/strategies/${strategy_id}/submission"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
              captures: { submitted_status: $.data.strategy_status }
          assert:
            - "DeRiskingStrategy.${strategy_id}.strategy_status == UNDER_EVALUATION"
            - "DeRiskingStrategy.${strategy_id}.in_scope_participant_count == 3"
            - "DeRiskingStrategy.${strategy_id}.projected_accounting_cost_cents == 75048425"
            - "DeRiskingStrategy.${strategy_id}.projected_settlement_cost_cents == 83105797"
            - "DeRiskingStrategy.${strategy_id}.projected_basis_gap_cents == 8057372"
            - "DeRiskingStrategy.${strategy_id}.projected_settlement_cost_cents != DeRiskingStrategy.${strategy_id}.projected_accounting_cost_cents"
            - "ParticipantRecord.${p1_id}.accounting_liability_cents == 35400142 and ParticipantRecord.${p1_id}.settlement_liability_cents == 37875152"
            - "ParticipantRecord.${p2_id}.accounting_liability_cents == 25488425 and ParticipantRecord.${p2_id}.settlement_liability_cents == 27270455"
            - "ParticipantRecord.${p3_id}.accounting_liability_cents == 14159858 and ParticipantRecord.${p3_id}.settlement_liability_cents == 15149849"

      - name: insurer_selection_basis_flips_winner
        grounds:
          - calculations.insurer_safest_available_score
          - state_machines.BuyoutTranche.QUOTING_to_INSURER_SELECTED
          - entities.BuyoutTranche.fields.selection_basis
          - entities.BuyoutTranche.fields.selection_score_bp
          - entities.AnnuityQuote.fields.composite_score_bp
        distinguishing_aspect: |
          Two tranches of one plan receive premium/rating/capital-identical quote
          sets from the same three carriers; SAFETY_WEIGHTED (55/25/20) makes the
          AAA carrier win at 8535 bp while PRICE_WEIGHTED (25/15/60) makes the
          AA_PLUS carrier win at 8570 bp — the variant, not the data, decides, and
          the cheapest carrier (AA_MINUS at 11800000) wins under neither basis.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one PensionPlan authorized for BUYOUT_ONLY settlement via an APPROVED ANNUITY_BUYOUT strategy"
            - "one engaged IndependentExpert holding an AFFIRMATIVE safest-available opinion"
            - "three registered insurers: Aurora AA_PLUS / 4200 bp capital, Beacon AA_MINUS / 3800 bp, Cardinal AAA / 5100 bp, each with 200000000 cents of capacity"
            - "two BuyoutTranche rows in QUOTING, each holding exactly one CLEAN RETIREE_IN_PAY participant with a PASSED_CLOSED audit"
            - "each tranche holds three SUBMITTED quotes at premiums 12500000 (Aurora), 11800000 (Beacon) and 13400000 (Cardinal), all with quote_valid_days 60 so none is expired"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Meridian Industrial Group", plan_name: "Meridian Salaried Retirement Plan", plan_ein: "471203955", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 510 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "P-0001", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 250000, final_average_monthly_earnings_cents: 500000, credited_service_months: 400, date_of_birth: "1955-03-14" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
            - call: "POST /prt/participants/${p1_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "12 Elm Street", confirmed_postal_code: "60614" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/participants/${p1_id}/mortality-checks"
              payload: { match_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_v_after_mortality: $.data.version }
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v_after_mortality}" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { a1_id: $.data.id }
            - call: "POST /prt/benefit-audits/${a1_id}/resolution"
              payload: { resolution: "ACCEPT_AS_IS" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "P-0002", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 250000, final_average_monthly_earnings_cents: 500000, credited_service_months: 400, date_of_birth: "1956-01-09" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p2_id: $.data.id }
            - call: "POST /prt/participants/${p2_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "44 Oak Avenue", confirmed_postal_code: "60615" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/participants/${p2_id}/mortality-checks"
              payload: { match_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p2_v_after_mortality: $.data.version }
            - call: "POST /prt/participants/${p2_id}/benefit-audits"
              payload: { expected_participant_version: "${p2_v_after_mortality}" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { a2_id: $.data.id }
            - call: "POST /prt/benefit-audits/${a2_id}/resolution"
              payload: { resolution: "ACCEPT_AS_IS" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/plans/${plan_id}/strategies"
              payload: { strategy_name: "Retiree Buyout Phase 1", strategy_type: "ANNUITY_BUYOUT" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { strategy_id: $.data.id }
            - call: "POST /prt/strategies/${strategy_id}/submission"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/strategies/${strategy_id}/decision"
              payload: { decision: "APPROVE", decision_rationale: "Basis gap acceptable against the committee's de-risking mandate." }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "POST /prt/plans/${plan_id}/settlement-amendment"
              payload: { amendment_action: "ADOPT", amendment_scope: "BUYOUT_ONLY", amendment_effective_date: "2026-09-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans/${plan_id}/independent-experts"
              payload: { expert_firm_name: "Ardsley Fiduciary Advisors", engagement_scope: "SAFEST_AVAILABLE_ANNUITY_REVIEW", conflict_disclosed: false }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { expert_id: $.data.id }
            - call: "POST /prt/independent-experts/${expert_id}/independence-review"
              payload: { review_decision: "ENGAGE" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "POST /prt/independent-experts/${expert_id}/opinion"
              payload: { safest_available_opinion: "AFFIRMATIVE" }
              as: IndependentExpertUser
              as_user_id: "${expert_id}"
            - call: "POST /prt/insurers"
              payload: { insurer_name: "Aurora Life & Annuity", rating_grade: "AA_PLUS", capital_ratio_bp: 4200, capacity_cents: 200000000 }
              as: Regulator
              as_user_id: "regulator-01"
              captures: { ins_a_id: $.data.id }
            - call: "POST /prt/insurers"
              payload: { insurer_name: "Beacon National Life", rating_grade: "AA_MINUS", capital_ratio_bp: 3800, capacity_cents: 200000000 }
              as: Regulator
              as_user_id: "regulator-01"
              captures: { ins_b_id: $.data.id }
            - call: "POST /prt/insurers"
              payload: { insurer_name: "Cardinal Assurance", rating_grade: "AAA", capital_ratio_bp: 5100, capacity_cents: 200000000 }
              as: Regulator
              as_user_id: "regulator-01"
              captures: { ins_c_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/tranches"
              payload: { tranche_name: "Retiree Tranche Safety", target_cohort: "RETIREE_IN_PAY" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { t1_id: $.data.id }
            - call: "POST /prt/tranches/${t1_id}/participant-assignments"
              payload: { participant_id: "${p1_id}" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/tranches/${t1_id}/quoting"
              payload: {}
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "POST /prt/tranches/${t1_id}/quotes"
              payload: { insurer_id: "${ins_a_id}" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { q1a_id: $.data.id }
            - call: "POST /prt/tranches/${t1_id}/quotes"
              payload: { insurer_id: "${ins_b_id}" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { q1b_id: $.data.id }
            - call: "POST /prt/tranches/${t1_id}/quotes"
              payload: { insurer_id: "${ins_c_id}" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { q1c_id: $.data.id }
            - call: "POST /prt/quotes/${q1a_id}/submission"
              payload: { submission_decision: "SUBMIT", premium_cents: 12500000, lock_days: 90, quote_valid_days: 60 }
              as: InsurerRep
              as_user_id: "${ins_a_id}"
            - call: "POST /prt/quotes/${q1b_id}/submission"
              payload: { submission_decision: "SUBMIT", premium_cents: 11800000, lock_days: 90, quote_valid_days: 60 }
              as: InsurerRep
              as_user_id: "${ins_b_id}"
            - call: "POST /prt/quotes/${q1c_id}/submission"
              payload: { submission_decision: "SUBMIT", premium_cents: 13400000, lock_days: 90, quote_valid_days: 60 }
              as: InsurerRep
              as_user_id: "${ins_c_id}"
            - call: "POST /prt/plans/${plan_id}/tranches"
              payload: { tranche_name: "Retiree Tranche Price", target_cohort: "RETIREE_IN_PAY" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { t2_id: $.data.id }
            - call: "POST /prt/tranches/${t2_id}/participant-assignments"
              payload: { participant_id: "${p2_id}" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/tranches/${t2_id}/quoting"
              payload: {}
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "POST /prt/tranches/${t2_id}/quotes"
              payload: { insurer_id: "${ins_a_id}" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { q2a_id: $.data.id }
            - call: "POST /prt/tranches/${t2_id}/quotes"
              payload: { insurer_id: "${ins_b_id}" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { q2b_id: $.data.id }
            - call: "POST /prt/tranches/${t2_id}/quotes"
              payload: { insurer_id: "${ins_c_id}" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { q2c_id: $.data.id }
            - call: "POST /prt/quotes/${q2a_id}/submission"
              payload: { submission_decision: "SUBMIT", premium_cents: 12500000, lock_days: 90, quote_valid_days: 60 }
              as: InsurerRep
              as_user_id: "${ins_a_id}"
            - call: "POST /prt/quotes/${q2b_id}/submission"
              payload: { submission_decision: "SUBMIT", premium_cents: 11800000, lock_days: 90, quote_valid_days: 60 }
              as: InsurerRep
              as_user_id: "${ins_b_id}"
            - call: "POST /prt/quotes/${q2c_id}/submission"
              payload: { submission_decision: "SUBMIT", premium_cents: 13400000, lock_days: 90, quote_valid_days: 60 }
              as: InsurerRep
              as_user_id: "${ins_c_id}"
          trigger:
            - call: "POST /prt/tranches/${t1_id}/insurer-selection"
              payload: { selection_basis: "SAFETY_WEIGHTED" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { t1_winner: $.data.selected_insurer_id, t1_score: $.data.selection_score_bp }
            - call: "POST /prt/tranches/${t2_id}/insurer-selection"
              payload: { selection_basis: "PRICE_WEIGHTED" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { t2_winner: $.data.selected_insurer_id, t2_score: $.data.selection_score_bp }
          assert:
            - "BuyoutTranche.${t1_id}.selected_insurer_id == ${ins_c_id}"
            - "BuyoutTranche.${t1_id}.selected_quote_id == ${q1c_id}"
            - "BuyoutTranche.${t1_id}.selection_score_bp == 8535"
            - "BuyoutTranche.${t2_id}.selected_insurer_id == ${ins_a_id}"
            - "BuyoutTranche.${t2_id}.selected_quote_id == ${q2a_id}"
            - "BuyoutTranche.${t2_id}.selection_score_bp == 8570"
            - "BuyoutTranche.${t1_id}.selected_insurer_id != BuyoutTranche.${t2_id}.selected_insurer_id"
            - "AnnuityQuote.${q1a_id}.composite_score_bp == 7990 and AnnuityQuote.${q1b_id}.composite_score_bp == 7240 and AnnuityQuote.${q1c_id}.composite_score_bp == 8535"
            - "AnnuityQuote.${q2a_id}.composite_score_bp == 8570 and AnnuityQuote.${q2b_id}.composite_score_bp == 8520 and AnnuityQuote.${q2c_id}.composite_score_bp == 8545"
            - "AnnuityQuote.${q1c_id}.quote_status == SHORTLISTED and AnnuityQuote.${q1a_id}.quote_status == DECLINED and AnnuityQuote.${q1b_id}.quote_status == DECLINED"
            - "AnnuityQuote.${q2a_id}.quote_status == SHORTLISTED and AnnuityQuote.${q2b_id}.quote_status == DECLINED and AnnuityQuote.${q2c_id}.quote_status == DECLINED"
            - "Beacon (${ins_b_id}) offers the lowest premium 11800000 yet is selected by neither basis"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: per_participant_rounding_order_pinned
        grounds:
          - calculations.strategy_projected_settlement_cost
          - calculations.participant_settlement_liability
          - state_machines.DeRiskingStrategy.DRAFT_to_UNDER_EVALUATION
        distinguishing_aspect: |
          The SETTLEMENT_BASIS factor 126250 makes participant P-0001's exact
          product land on 37875151.5 — a true half — so rounding each participant
          BEFORE summing yields base 80295456 and a total of 83105797, whereas
          summing the exact products and rounding once yields base 80295455 and a
          total of 83105796; the one-cent difference falsifies any implementation
          that rounds at the wrong step.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one PensionPlan and three RETIREE_IN_PAY participants with stated monthly benefits 250001, 180003 and 99999 cents"
            - "one DRAFT DeRiskingStrategy of strategy_type ANNUITY_BUYOUT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Halstead Forge Company", plan_name: "Halstead Hourly Pension Plan", plan_ein: "382770164", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 495 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "H-0001", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 250001, final_average_monthly_earnings_cents: 500000, credited_service_months: 400, date_of_birth: "1955-03-14" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "H-0002", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 180003, final_average_monthly_earnings_cents: 360000, credited_service_months: 400, date_of_birth: "1954-07-02" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p2_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "H-0003", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 99999, final_average_monthly_earnings_cents: 200000, credited_service_months: 400, date_of_birth: "1958-11-20" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p3_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/strategies"
              payload: { strategy_name: "Rounding Order Probe", strategy_type: "ANNUITY_BUYOUT" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { strategy_id: $.data.id }
          trigger:
            - call: "POST /prt/strategies/${strategy_id}/submission"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
          assert:
            - "ParticipantRecord.${p1_id}.settlement_liability_cents == 37875152"
            - "ParticipantRecord.${p2_id}.settlement_liability_cents == 27270455"
            - "ParticipantRecord.${p3_id}.settlement_liability_cents == 15149849"
            - "37875152 + 27270455 + 15149849 == 80295456, so DeRiskingStrategy.${strategy_id}.projected_settlement_cost_cents == 83105797"
            - "DeRiskingStrategy.${strategy_id}.projected_settlement_cost_cents != 83105796 (the sum-then-round result)"

      - name: lump_sum_fee_tier_keyed_on_pre_fee_amount
        grounds:
          - calculations.lump_sum_present_value
          - state_machines.ParticipantElection.NOTICE_SENT_to_ELECTED_LUMP_SUM
          - entities.ParticipantElection.fields.admin_fee_bp
          - entities.ParticipantElection.fields.net_lump_sum_cents
        distinguishing_aspect: |
          The fee ladder is non-monotonic (0 bp / 75 bp / 40 bp) and the tier input
          is the PRE-fee raw_pv_cents: a participant at raw_pv 12006000 must be
          charged 40 bp = 48024 cents, netting 11957976, whereas keying the tier off
          the post-fee net amount would place 11957976 back in the 75 bp band and
          charge 90045, netting 11915955 — a 42021-cent divergence produced by the
          choice of which operand feeds the tier lookup.
        test_recipe:
          setup:
            - "logical clock moved to 2026-09-01T00:00:00Z so the window can open with 60 days of notice"
            - "one PensionPlan authorized for LUMP_SUM_ONLY settlement via an APPROVED LUMP_SUM_WINDOW strategy"
