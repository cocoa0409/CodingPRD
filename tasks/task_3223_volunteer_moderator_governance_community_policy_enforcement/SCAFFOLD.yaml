# =============================================================================
# PRD Benchmark Scaffold — Volunteer Moderator Governance & Community Policy
# Enforcement (Reddit)
#
# §1.0 Response Envelope / §1.1 Entities / §1.2 State Machines (+§1.2.1)
# §1.3 Calculations / §1.4 Validations / §1.5 Endpoints / §1.6 Errors / §1.7 RBAC
#
# §1.8 lives ONLY in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.9 lives ONLY in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Volunteer Moderator Governance & Community Policy Enforcement (Reddit): community
  creation with volunteer moderators setting local rules within sitewide policy,
  moderator tooling for removal, ban, and automated rule enforcement with audit logs,
  escalation path when local rules conflict with sitewide policy and administrator
  intervention, moderator team succession, inactivity removal and top-moderator
  disputes, content policy enforcement across reports, automated detection and appeals
  with account sanctions, brigading and vote manipulation detection across communities,
  community quarantine and restriction states with reinstatement conditions, protest
  events where communities restrict access and platform response.

domain_name: volunteer-moderation-governance
api_prefix: "/api"

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: posture-driven gating
  complexity_layers:
    - version-pinning on approval
    - contagion / risk propagation
    - pagination with filtering
    - cascading side effects
  entity_topology: graph
  state_machine_shape: compound
  relationship_patterns: [one_to_many, many_to_many, self_referential, polymorphic, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 14
  state_machine_count: 9
  endpoint_count: 75
  error_code_count: 32
  role_count: 6
  calculation_count: 14
  validation_count: 20
  concurrency_rule_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Community
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Community display name; unique among communities whose state is not CLOSED" }
      - { name: description, type: string, source: input, description: "Short community description" }
      - { name: is_over_18, type: boolean, source: input, default: false, description: "Declared content maturity of the community; a hard sitewide-policy flag, immutable after creation" }
      - { name: state, type: enum, source: system, description: "ACTIVE | PROTEST_RESTRICTED | RESTRICTED | INSTITUTION_NEGOTIATION | QUARANTINED | ARCHIVED" }
      - { name: enforcement_tier, type: integer, source: computed, description: "1 | 2 | 3 ladder over applying_sanction_count; 1 when <=1, 2 when ==2, 3 when >=3" }
      - { name: health_index, type: number, source: computed, description: "community_health_index; 100.00 minus penalties, clamped to [0.00, 100.00], 2 dp round_half_up" }
      - { name: open_report_weight, type: number, source: computed, description: "Sum of effective_open_report_weight over OPEN ContentReports" }
      - { name: inactive_moderator_count, type: integer, source: computed, description: "Count of ACTIVE Moderators whose inactivity anchor is >= 90 days before the logical clock" }
      - { name: active_top_moderator_count, type: integer, source: computed, description: "Count of ACTIVE Moderators with is_top_moderator true" }
      - { name: active_moderator_count, type: integer, source: computed, description: "Count of Moderators with status ACTIVE" }
      - { name: active_rule_count, type: integer, source: computed, description: "Count of CommunityRules in ACTIVE status" }
      - { name: applying_sanction_count, type: integer, source: computed, description: "Count of ACTIVE AccountSanction rows whose community_id is this community" }
      - { name: quarantine_approval_count, type: integer, source: system, default: 0, description: "Lifetime count of distinct administrator quarantine approvals recorded on this community; never decremented" }
      - { name: quarantine_reinstatement_count, type: integer, source: system, default: 0, description: "Lifetime count of successful quarantine reinstatements; never decremented" }
      - { name: restricted_since_utc, type: datetime, source: system, description: "Timestamp the community last entered RESTRICTED, INSTITUTION_NEGOTIATION, PROTEST_RESTRICTED or QUARANTINED; null while ACTIVE" }
      - { name: protest_exemption_until_utc, type: datetime, source: system, description: "End of the administrator protest moratorium; null when no moratorium is active" }

  - name: CommunityRule
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; owner community" }
      - { name: rule_code, type: string, source: input, description: "Stable local rule code; unique within the community among ACTIVE rules" }
      - { name: rule_text, type: string, source: input, description: "Human-readable local rule text" }
      - { name: rule_band, type: integer, source: input, description: "Permitted-content band the local rule applies to: 1 = all ages, 2 = mature, 3 = adult-only" }
      - { name: is_sitewide_floor, type: boolean, source: input, default: false, description: "True when this rule restates a sitewide policy floor and may not be lowered by local moderators" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: Moderator
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; owner community" }
      - { name: moderator_account_id, type: string, source: input, description: "Account id of the volunteer moderator" }
      - { name: display_name, type: string, source: input, description: "Per-community moderator flair name" }
      - { name: moderator_role, type: enum, source: input, description: "TOP_MODERATOR | REGULAR_MODERATOR" }
      - { name: is_top_moderator, type: boolean, source: computed, description: "Derived: true only when moderator_role is TOP_MODERATOR AND status is ACTIVE AND this row carries the lowest top_rank among ACTIVE top-moderator rows" }
      - { name: top_rank, type: integer, source: system, description: "Monotone local rank assigned at appointment; ascending rank wins top-moderator disputes" }
      - { name: last_moderation_action_at_utc, type: datetime, source: system, description: "Timestamp of the moderator's most recent recorded moderation action, refreshed by recording a content decision, authoring or amending a rule, approving a protest or recording a brigade cluster; null when the moderator has never acted" }
      - { name: inactivity_basis_utc, type: datetime, source: system, description: "Read-only projection of moderator_inactivity_expiry anchor(A); null while the moderator is not ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED_FOR_INACTIVITY | RESIGNED | DEMOTED" }
      - { name: moderator_version, type: integer, source: system, description: "Optimistic concurrency version of this moderator row" }
      - { name: promoted_at_utc, type: datetime, source: system, description: "Logical clock at which this row most recently became an ACTIVE top moderator; null otherwise" }
      - { name: removal_reason_code, type: enum, source: system, description: "INACTIVITY | RESIGNATION | TOP_DISPUTE_LOSS | ADMIN_ARCHIVAL; null while ACTIVE" }

  - name: TeamSuccession
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; owner community" }
      - { name: state, type: enum, source: system, description: "PENDING_HANDOVER | DISCUSSION | HANDOVER_BLOCKED | COMPLETED" }
      - { name: initiated_at_utc, type: datetime, source: system, description: "Timestamp the succession opened" }
      - { name: previous_state, type: enum, source: system, description: "TeamSuccession state occupied immediately before the current one; source of the revert target" }
      - { name: discussion_round_count, type: integer, source: system, default: 0, description: "Number of recorded discussion rounds" }
      - { name: handover_deadline_utc, type: datetime, source: system, description: "initiated_at_utc + 30 days; premium-handover negotiation deadline" }
      - { name: blocked_by_moderator_id, type: string, source: system, description: "Plain identifier of the Moderator whose dispute raised the block; not a foreign-key declaration" }
      - { name: completion_reason, type: enum, source: system, description: "HANDOVER_ACCEPTED | ALL_MODERATORS_INACTIVE | PREVENTED_BY_DISPUTE; null until terminal" }

  - name: Post
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; owner community" }
      - { name: author_account_id, type: string, source: input, description: "FK -> Account.id; the posting account" }
      - { name: title, type: string, source: input, description: "Post title" }
      - { name: body, type: string, source: input, description: "Post body" }
      - { name: post_type, type: enum, source: input, description: "TEXT | LINK | IMAGE | CROSSPOST" }
      - { name: is_over_18, type: boolean, source: input, default: false, description: "Author assertion that the post is adult content" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | REMOVED | LOCKED" }
      - { name: removal_count, type: integer, source: system, default: 0, description: "Number of distinct moderator removals recorded against this post" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: handle, type: string, source: input, description: "Globally unique account handle" }
      - { name: home_community_id, type: string, source: input, description: "Plain identifier of the community the account registered from; not a foreign-key declaration" }
      - { name: account_state, type: enum, source: system, description: "HONORED | WARNED | MUTED | BANNED" }
      - { name: karma_points, type: integer, source: computed, description: "100 minus 3 per distinct community in which the account holds a MUTE_ISSUED or BAN_ISSUED sanction; floor 50, reset to 100 when no such sanction is ACTIVE" }
      - { name: account_sanction_index, type: number, source: computed, description: "SEE §1.3 account_sanction_index; dual-variant value used by community posture gates" }

  - name: ContentReport
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; owner community" }
      - { name: content_source_type, type: enum, source: input, description: "POST | COMMENT | ACCOUNT; which surface the report targets" }
      - { name: content_source_id, type: string, source: input, description: "Polymorphic identifier of the reported content; resolves against Post when content_source_type is POST. Not a single-parent foreign-key declaration." }
      - { name: reporter_account_id, type: string, source: input, description: "Opaque identifier of the reporting account. Not a foreign-key declaration: reports may be filed by anonymous or automated reporters that are not persisted entities." }
      - { name: report_reason_code, type: enum, source: input, description: "SPAM | HARASSMENT | HATE_SPEECH | VIOLENCE | MINOR_SAFETY | BRIGADING | VOTE_MANIPULATION | IMPERSONATION" }
      - { name: resolution_tier, type: integer, source: input, description: "Report weight tier 1 | 2 | 3; tier 3 is a sitewide policy floor" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | RESOLVED_LOCKED | DISMISSED" }
      - { name: detection_backlog_item_id, type: string, source: system, description: "Plain identifier of the handling backlog item; not a foreign-key declaration" }

  - name: AutoDetectionBacklogItem
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; owner community" }
      - { name: source_type, type: enum, source: input, description: "POST | COMMENT | ACCOUNT" }
      - { name: source_id, type: string, source: input, description: "Polymorphic identifier of the detected content. Not a single-parent foreign-key declaration." }
      - { name: subject_account_id, type: string, source: input, description: "FK -> Account.id; the account the detection implicates" }
      - { name: signal_severity_band, type: integer, source: input, description: "Detector severity 1..5" }
      - { name: detection_confidence, type: number, source: input, description: "Detector confidence in [0.0, 1.0]" }
      - { name: overlap_ratio, type: number, source: input, description: "Detector-reported overlap ratio in [0.0, 1.0]" }
      - { name: published_at_utc, type: datetime, source: input, description: "Publication timestamp of the detected content; the cooling-off clock anchor" }
      - { name: status, type: enum, source: system, description: "OPEN | CONSUMED | DISMISSED" }

  - name: ContentDecision
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; owner community" }
      - { name: auto_detection_backlog_item_id, type: string, source: input, description: "Plain identifier of the consumed backlog item; not a foreign-key declaration" }
      - { name: decision_outcome, type: enum, source: input, description: "KEEP | REMOVE | LOCK | REPORT_REJECTED | WARNING_ISSUED | MUTE_ISSUED | BAN_ISSUED" }
      - { name: decision_confidence, type: number, source: input, description: "Moderator confidence the decision matches the sitewide policy read, in [0.0, 1.0]" }
      - { name: dissection_band, type: integer, source: input, description: "Edits to the detected content since detection, 0..5. Bands 0..2 are correctable; bands 3..5 are material edits and are never self-reviewable." }
      - { name: precedent_approval_count, type: integer, source: input, description: "Distinct existing approvals of this exact decision signature for this account" }
      - { name: community_health_index_override_present, type: boolean, source: input, default: false, description: "True when the decision carries a current-community health-index override" }
      - { name: overlap_ratio, type: number, source: computed, description: "Snapshot of the consumed backlog item's overlap_ratio" }
      - { name: is_account_wide, type: boolean, source: system, description: "True when the decision was recorded through the account-wide route rather than the community route; drives AccountSanction.account_wide_enforcement_counted" }
      - { name: effective_enforcement_tier, type: integer, source: computed, description: "SEE §1.3 effective_enforcement_tier; 1..5" }
      - { name: community_safety_override, type: boolean, source: computed, description: "True when effective_enforcement_tier is 5 AND community_health_index_override_present is false" }
      - { name: requires_cross_power_approval, type: boolean, source: computed, description: "True when effective_enforcement_tier is 5 AND precedent_approval_count < 3" }
      - { name: status, type: enum, source: system, description: "RECORDED | AUDITED | REVISED | SETTLED" }
      - { name: audit_log_ref, type: string, source: system, description: "Tamper-evident audit reference; minted by the server, distinct from the entity id" }

  - name: AccountSanction
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; the community whose decision issued the sanction" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; the sanctioned account" }
      - { name: decision_id, type: string, source: system, description: "Plain identifier of the issuing ContentDecision; not a foreign-key declaration" }
      - { name: decision_outcome, type: enum, source: system, description: "WARNING_ISSUED | MUTE_ISSUED | BAN_ISSUED (copy of the issuing decision outcome)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED" }
      - { name: account_wide_enforcement_counted, type: boolean, source: system, description: "Copied from the issuing ContentDecision.is_account_wide: true for a decision recorded through the account-wide administration route, false for a community-route decision" }
      - { name: award_points, type: integer, source: computed, description: "sanction_award_points evaluated with this row already recorded in the registry; 150 / 250 / 250 / 400 as the account registry grows" }
      - { name: sanction_date_utc, type: datetime, source: system, description: "Timestamp the sanction took effect (logical clock at creation)" }
      - { name: sanitized_on_utc, type: datetime, source: system, description: "Timestamp the sanction was lifted by an appeal; null while ACTIVE" }

  - name: BrigadingCluster
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; owner community" }
      - { name: internal_link_count, type: integer, source: input, description: "Cross-posts/links inside the same community" }
      - { name: external_link_count, type: integer, source: input, description: "Cross-posts/links into other communities" }
      - { name: participant_count, type: integer, source: input, description: "Distinct accounts participating in the cluster" }
      - { name: legitimate_participant_count, type: integer, source: input, description: "Distinct participants that also participate outside the production window" }
      - { name: overlap_ratio, type: number, source: computed, description: "SEE §1.3 brigading_overlap_ratio" }
      - { name: signal_severity_band, type: integer, source: computed, description: "SEE §1.3 brigading_signal_severity_band; 1..5" }
      - { name: evidence_complete, type: boolean, source: computed, description: "True when overlap_ratio >= 0.30" }
      - { name: escalation_severity, type: integer, source: computed, description: "brigade_escalation_severity recorded by the most recent escalation of this cluster; null while the cluster is DETECTED" }
      - { name: status, type: enum, source: system, description: "DETECTED | ESCALATED | DISMISSED" }
      - { name: detected_at_utc, type: datetime, source: system, description: "Logical clock at detection" }

  - name: Appeal
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; owner community" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the appealing account" }
      - { name: sanction_id, type: string, source: input, description: "Plain identifier of the appealed AccountSanction; not a foreign-key declaration" }
      - { name: ground_code, type: enum, source: input, description: "ANALYSIS_ERROR | MODERATOR_MISCONDUCT" }
      - { name: new_evidence_url, type: string, source: input, description: "Link to evidence not present at decision time; null when none supplied" }
      - { name: sanction_misapplication_present, type: boolean, source: input, default: false, description: "Moderator assertion that the sitewide policy read itself was misapplied" }
      - { name: state, type: enum, source: system, description: "FILED | SUBMITTED | UNDER_WATCH | GRANTED | DENIED" }
      - { name: decision_reason_code, type: enum, source: system, description: "ANALYSIS_ERROR_CONFIRMED | MISCONDUCT_CONFIRMED | MISAPPLICATION_CONFIRMED | NO_NEW_EVIDENCE; null until terminal" }
      - { name: filed_at_utc, type: datetime, source: system, description: "Logical clock at filing" }
      - { name: submitted_at_utc, type: datetime, source: system, description: "Logical clock at submission; null while FILED" }
      - { name: deadline_utc, type: datetime, source: system, description: "submitted_at_utc + 30 days; the decider's deadline; null while FILED" }
      - { name: last_referred_at_utc, type: datetime, source: system, description: "Logical clock of the most recent referral into UNDER_WATCH; null when never referred" }
      - { name: referral_count, type: integer, source: system, default: 0, description: "Number of times the appeal has entered UNDER_WATCH" }

  - name: ProtestEvent
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; owner community" }
      - { name: requested_access_mode, type: enum, source: input, description: "READ_ONLY | RESTRICTED | PRIVATE" }
      - { name: status, type: enum, source: system, description: "REQUESTED | COORDINATED | ENDED" }
      - { name: quorum_approval_count, type: integer, source: system, default: 0, description: "Distinct moderators recorded approving the protest" }
      - { name: required_quorum_count, type: integer, source: computed, description: "max(2, ceil(active_moderator_count / 2))" }
      - { name: distinct_power_count, type: integer, source: computed, description: "SEE §1.3 protest_distinct_power_count; max modular width, measured over the distinct communities each approving account moderates" }
      - { name: conflicting_cross_power_account_ids, type: array, source: input, description: "Account ids that also moderate a community whose state is PROTEST_RESTRICTED, RESTRICTED, INSTITUTION_NEGOTIATION or QUARANTINED" }
      - { name: started_at_utc, type: datetime, source: system, description: "Logical clock at coordination; null while REQUESTED" }
      - { name: ended_at_utc, type: datetime, source: system, description: "Logical clock at ending; null until ENDED" }
      - { name: exemption_granted_until_utc, type: datetime, source: system, description: "Copy of Community.protest_exemption_until_utc at coordination; null when no moratorium was active" }

  - name: ProtestApproval
    parent: ProtestEvent
    common_fields: false
    fields:
      - { name: protest_id, type: string, source: system, description: "FK -> ProtestEvent.id; the protest being approved" }
      - { name: moderator_id, type: string, source: input, description: "FK -> Moderator.id; the approving moderator row" }
      - { name: approving_account_id, type: string, source: input, description: "Opaque identifier of the account behind the approving moderator row. Not a foreign-key declaration: the approval is recorded against the moderator row, and the account id is carried for cross-power counting only." }
      - { name: approved_on_utc, type: datetime, source: system, description: "Logical clock at approval" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- (1) Community: 6 states, compound + posture-driven + a self-loop -------
  - entity: Community
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "system (self-loop; fires on every ContentDecision recorded in this community and on every logical-clock advance, and changes no state field)"
        actor: system
        preconditions: []
        side_effects:
          - "community_health_index recomputed"
          - "enforcement_tier recomputed"
          - "no state field is written; the self-loop exists so the recompute hook is bound to a declared transition"

      - from: ACTIVE
        to: PROTEST_RESTRICTED
        trigger: POST /api/communities/{id}/protests/{protestId}/coordinate
        actor: Moderator
        preconditions:
          - "ProtestEvent.status == REQUESTED (ERR_INVALID_STATE)"
          - "ProtestEvent.requested_access_mode in {READ_ONLY, RESTRICTED} (ERR_PRIVATE_PROTEST_FORBIDDEN)"
          - "ProtestEvent.distinct_power_count >= 2 (ERR_CROSS_POWER_QUORUM_NOT_MET)"
        side_effects:
          - "ProtestEvent.status -> COORDINATED"
          - "ProtestEvent.started_at_utc = logical clock"
          - "ProtestEvent.exemption_granted_until_utc = Community.protest_exemption_until_utc"
          - "Community.restricted_since_utc = logical clock"

      - from: PROTEST_RESTRICTED
        to: PROTEST_RESTRICTED
        trigger: POST /api/community-administration/policy-advisories
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Community.protest_exemption_until_utc = logical clock + 7 days"
          - "every ProtestEvent of the community with status COORDINATED copies the new exemption into exemption_granted_until_utc"
        note: "Administrator posture response while a protest continues; the community stays PROTEST_RESTRICTED."

      - from: PROTEST_RESTRICTED
        to: ACTIVE
        trigger: POST /api/communities/{id}/protests/{protestId}/end
        actor: Moderator
        preconditions:
          - "ProtestEvent.status == COORDINATED (ERR_INVALID_STATE)"
        side_effects:
          - "ProtestEvent.status -> ENDED"
          - "ProtestEvent.ended_at_utc = logical clock"
          - "Community.restricted_since_utc = null"

      - from: ACTIVE
        to: RESTRICTED
        trigger: "system (automatic when an account-wide sanction recomputes account_sanction_index >= 2 for the decision's subject community)"
        actor: system
        preconditions:
          - "the recomputed account_sanction_index (pinned variant) >= 0.60"
        side_effects:
          - "Community.restricted_since_utc = logical clock"
          - "Community.health_index recomputed"

      - from: RESTRICTED
        to: INSTITUTION_NEGOTIATION
        trigger: "system (automatic in the same request that moved the community into RESTRICTED, when the negotiation gate is also met)"
        actor: system
        preconditions:
          - "the recomputed account_sanction_index (pinned variant) >= 0.80"
        side_effects:
          - "Community.restricted_since_utc is preserved (the instant the community first left ACTIVE)"

      - from: RESTRICTED
        to: INSTITUTION_NEGOTIATION
        trigger: POST /api/community-administration/institution-negotiations
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Community.restricted_since_utc is preserved"

      - from: RESTRICTED
        to: QUARANTINED
        trigger: "system (automatic when the community_health_index recompute lands at or below 40.00)"
        actor: system
        preconditions:
          - "Community.health_index <= 40.00"
        side_effects:
          - "Community.restricted_since_utc is preserved (the instant the community first left ACTIVE)"
          - "moderator_inactivity_expiry re-anchors on restricted_since_utc for this community"
          - "inactive_moderator_count recomputed"

      - from: INSTITUTION_NEGOTIATION
        to: QUARANTINED
        trigger: "system (automatic once 30 days have passed inside INSTITUTION_NEGOTIATION with no administrator regulation cadence and health_index <= 40.00)"
        actor: system
        preconditions:
          - "Community.health_index <= 40.00"
          - "logical clock >= Community.restricted_since_utc + 30 days"
          - "no POST /api/community-administration/regulation-cadences has been recorded for this community since it entered INSTITUTION_NEGOTIATION"
        side_effects:
          - "Community.restricted_since_utc is preserved"
          - "moderator_inactivity_expiry re-anchors on restricted_since_utc for this community"
          - "inactive_moderator_count recomputed"

      - from: QUARANTINED
        to: RESTRICTED
        trigger: POST /api/communities/{id}/reinstatement-requests
        actor: Moderator
        preconditions:
          - "Community.health_index >= 70.00 (ERR_REINSTATEMENT_CONDITIONS_UNMET)"
          - "Community.inactive_moderator_count == 0 (ERR_REINSTATEMENT_CONDITIONS_UNMET)"
          - "Community.active_top_moderator_count >= 1 (ERR_REINSTATEMENT_CONDITIONS_UNMET)"
          - "(logical clock - Community.restricted_since_utc) >= 90 days (ERR_REINSTATEMENT_CONDITIONS_UNMET)"
          - "no OPEN ContentReport in the community carries resolution_tier 3 (ERR_REINSTATEMENT_CONDITIONS_UNMET)"
        side_effects:
          - "Community.quarantine_reinstatement_count += 1"
          - "Community.health_index recomputed"
          - "Community.restricted_since_utc = logical clock"

      - from: RESTRICTED
        to: ACTIVE
        trigger: POST /api/communities/{id}/reinstatement-requests
        actor: Moderator
        preconditions:
          - "Community.health_index >= 70.00 (ERR_REINSTATEMENT_CONDITIONS_UNMET)"
          - "Community.inactive_moderator_count == 0 (ERR_REINSTATEMENT_CONDITIONS_UNMET)"
          - "Community.active_top_moderator_count >= 1 (ERR_REINSTATEMENT_CONDITIONS_UNMET)"
          - "no OPEN ContentReport in the community carries resolution_tier 3 (ERR_REINSTATEMENT_CONDITIONS_UNMET)"
        side_effects:
          - "Community.restricted_since_utc = null"
          - "moderator_inactivity_expiry re-anchors on last_moderation_action_at_utc or created_at"
          - "Community.health_index recomputed"

      - from: QUARANTINED
        to: ARCHIVED
        trigger: POST /api/community-administration/archivals
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "every ACTIVE Moderator of the community -> status RESIGNED with removal_reason_code ADMIN_ARCHIVAL"
          - "every TeamSuccession of the community not in COMPLETED -> state COMPLETED with completion_reason ALL_MODERATORS_INACTIVE"
          - "every Post of the community -> status LOCKED"
          - "every ProtestEvent of the community in REQUESTED or COORDINATED -> status ENDED"

  # --- (2) TeamSuccession: 4 states with a revert cycle -----------------------
  - entity: TeamSuccession
    initial_state: PENDING_HANDOVER
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING_HANDOVER
        to: DISCUSSION
        trigger: POST /api/communities/{id}/successions/{successionId}/discussions
        actor: Moderator
        preconditions: []
        side_effects:
          - "previous_state = PENDING_HANDOVER"
          - "discussion_round_count += 1"

      - from: DISCUSSION
        to: DISCUSSION
        trigger: POST /api/communities/{id}/successions/{successionId}/discussions
        actor: Moderator
        preconditions: []
        side_effects:
          - "previous_state = DISCUSSION"
          - "discussion_round_count += 1"

      - from: DISCUSSION
        to: HANDOVER_BLOCKED
        trigger: POST /api/communities/{id}/successions/{successionId}/disputes
        actor: Moderator
        preconditions:
          - "TeamSuccession.status == DISCUSSION (ERR_INVALID_STATE)"
          - "the disputing moderator is a distinct account from the one recorded on the most recent discussion round of this succession (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "previous_state = DISCUSSION"
          - "blocked_by_moderator_id = the disputing Moderator id"

      - from: HANDOVER_BLOCKED
        to: PENDING_HANDOVER
        trigger: POST /api/communities/{id}/successions/{successionId}/prevent
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "previous_state = HANDOVER_BLOCKED"
          - "blocked_by_moderator_id = null"
          - "discussion_round_count reset to 0"

      - from: PENDING_HANDOVER
        to: COMPLETED
        trigger: "system (automatic once handover_deadline_utc has passed and the handover gate holds)"
        actor: system
        preconditions:
          - "logical clock >= handover_deadline_utc"
          - "Community.active_top_moderator_count >= 1"
          - "Community.inactive_moderator_count == 0"
        side_effects:
          - "previous_state = PENDING_HANDOVER"
          - "completion_reason = HANDOVER_ACCEPTED"

      - from: DISCUSSION
        to: COMPLETED
        trigger: "system (automatic once handover_deadline_utc has passed with no ACTIVE moderators left)"
        actor: system
        preconditions:
          - "logical clock >= handover_deadline_utc"
          - "Community.active_top_moderator_count == 0"
          - "every Moderator of the community has status off ACTIVE"
        side_effects:
          - "previous_state = DISCUSSION"
          - "completion_reason = ALL_MODERATORS_INACTIVE"

      - from: HANDOVER_BLOCKED
        to: COMPLETED
        trigger: "system (automatic once handover_deadline_utc has passed with the block unresolved)"
        actor: system
        preconditions:
          - "logical clock >= handover_deadline_utc"
        side_effects:
          - "previous_state = HANDOVER_BLOCKED"
          - "completion_reason = PREVENTED_BY_DISPUTE"

  # --- (3) Moderator: 4 states, reopening cycle --------------------------------
  - entity: Moderator
    initial_state: ACTIVE
    terminal_states: [RESIGNED]
    transitions:
      - from: ACTIVE
        to: REMOVED_FOR_INACTIVITY
        trigger: POST /api/communities/{id}/moderators/{moderatorId}/remove
        actor: Moderator
        preconditions:
          - "Moderator.status == ACTIVE (ERR_INVALID_STATE)"
          - "is_top_moderator is false unless the community has a TeamSuccession in COMPLETED (ERR_TOP_MODERATOR_REMOVAL_FORBIDDEN)"
          - "at least one other ACTIVE Moderator remains in the community after the removal (ERR_FINAL_MODERATOR_REMOVAL)"
          - "(logical clock - inactivity_basis_utc) >= 90 days (ERR_INACTIVITY_REMOVAL_NOT_JUSTIFIED)"
          - "expected_moderator_version equals Moderator.moderator_version (ERR_STALE_VERSION)"
        side_effects:
          - "Community.inactive_moderator_count recomputed"
          - "Community.active_top_moderator_count recomputed"
          - "Community.active_moderator_count recomputed"
          - "Community ACTIVE_to_ACTIVE self-loop recompute fires"

      - from: ACTIVE
        to: DEMOTED
        trigger: POST /api/communities/{id}/moderators/{moderatorId}/demote
        actor: Moderator
        preconditions:
          - "the acting moderator is a distinct account from the target moderator (ERR_SEGREGATION_OF_DUTIES)"
          - "Moderator.moderator_role == TOP_MODERATOR (ERR_INVALID_STATE)"
          - "expected_moderator_version equals Moderator.moderator_version (ERR_STALE_VERSION)"
        side_effects:
          - "moderator_role = REGULAR_MODERATOR"
          - "is_top_moderator recomputed to false"
          - "Community.active_top_moderator_count recomputed"

      - from: DEMOTED
        to: ACTIVE
        trigger: POST /api/communities/{id}/moderators/{moderatorId}/reinstate
        actor: Moderator
        preconditions:
          - "Community.active_top_moderator_count >= 1 (ERR_PENDING_HANDOVER)"
          - "expected_moderator_version equals Moderator.moderator_version (ERR_STALE_VERSION)"
        side_effects:
          - "moderator_role = REGULAR_MODERATOR"
          - "Community.inactive_moderator_count recomputed"

      - from: ACTIVE
        to: RESIGNED
        trigger: POST /api/communities/{id}/moderators/{moderatorId}/resign
        actor: Moderator
        preconditions:
          - "expected_moderator_version equals Moderator.moderator_version (ERR_STALE_VERSION)"
        side_effects:
          - "removal_reason_code = RESIGNATION"
          - "Community.active_top_moderator_count recomputed"
          - "Community.active_moderator_count recomputed"
          - "Community.inactive_moderator_count recomputed"

  # --- (4) ContentReport: resolve/reopen cycle ---------------------------------
  - entity: ContentReport
    initial_state: OPEN
    terminal_states: [RESOLVED_LOCKED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /api/communities/{id}/content-decisions (system sub-effect when the decision consumes the report's backlog item)"
        actor: system
        preconditions: []
        side_effects:
          - "Community.open_report_weight recomputed"
          - "Community.health_index recomputed"

      - from: RESOLVED
        to: RESOLVED_LOCKED
        trigger: "system (automatic when the resolving decision's decision_outcome is LOCK)"
        actor: system
        preconditions: []
        side_effects:
          - "the report can no longer be moved back to OPEN by any transition"

      - from: RESOLVED
        to: OPEN
        trigger: "system (automatic when the resolving decision's decision_outcome is REPORT_REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Community.open_report_weight recomputed"
          - "Community.health_index recomputed"

      - from: OPEN
        to: DISMISSED
        trigger: "system (automatic when the report is dismissed as a duplicate during a decision sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Community.open_report_weight recomputed"

  # --- (5) ContentDecision: audit chain with a revision cycle ------------------
  - entity: ContentDecision
    initial_state: RECORDED
    terminal_states: [SETTLED]
    transitions:
      - from: RECORDED
        to: AUDITED
        trigger: POST /api/community-administration/decision-audits
        actor: PlatformAdmin
        preconditions:
          - "ContentDecision.requires_cross_power_approval is true (ERR_INVALID_STATE)"
        side_effects:
          - "audit_log_ref gains an administrator audit entry"
          - "Community ACTIVE_to_ACTIVE self-loop recompute fires"

      - from: AUDITED
        to: REVISED
        trigger: POST /api/community-administration/decision-revisions
        actor: PlatformAdmin
        preconditions:
          - "ContentDecision.status == AUDITED (ERR_INVALID_STATE)"
        side_effects:
          - "the issuing AccountSanction, if any, -> status LIFTED with sanitized_on_utc = logical clock"
          - "Account.karma_points recomputed"
          - "Account.account_sanction_index recomputed"
          - "every ContentReport that this decision moved out of OPEN returns to status=OPEN, except a report already in the terminal RESOLVED_LOCKED state"
          - "Community.open_report_weight, Community.health_index and Community.applying_sanction_count recomputed"
          - "Community ACTIVE_to_ACTIVE self-loop recompute fires"

      - from: REVISED
        to: AUDITED
        trigger: POST /api/community-administration/decision-reaudits
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "audit_log_ref gains a second administrator audit entry"

      - from: RECORDED
        to: SETTLED
        trigger: "system (automatic when the decision's effective_enforcement_tier <= 3)"
        actor: system
        preconditions: []
        side_effects:
          - "audit_log_ref is sealed"

      - from: AUDITED
        to: SETTLED
        trigger: "system (automatic when the administrator audit leaves the decision unreversed)"
        actor: system
        preconditions: []
        side_effects:
          - "audit_log_ref is sealed"

  # --- (6) AccountSanction: sanction/reinstatement cycle -----------------------
  - entity: AccountSanction
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: POST /api/accounts/{id}/appeals/{appealId}/decide
        actor: PlatformAdmin
        preconditions:
          - "Appeal.state == SUBMITTED (ERR_INVALID_STATE)"
          - "logical clock < Appeal.deadline_utc (ERR_PRECEDENT_EXPIRED)"
          - "Appeal has evidence_movement (new_evidence_url non-null or sanction_misapplication_present true) (ERR_NO_NEW_EVIDENCE)"
        side_effects:
          - "Appeal.state -> GRANTED"
          - "sanitized_on_utc = logical clock"
          - "Account.karma_points recomputed"
          - "Account.account_sanction_index recomputed"
          - "Community.applying_sanction_count recomputed for the issuing community"
          - "the issuing community's (Community.ACTIVE, Community.ACTIVE) self-loop recompute fires"

      - from: LIFTED
        to: ACTIVE
        trigger: POST /api/community-administration/sanction-reinstatements
        actor: PlatformAdmin
        preconditions:
          - "AccountSanction.status == LIFTED (ERR_INVALID_STATE)"
          - "the issuing community's state is ACTIVE or RESTRICTED (ERR_ACTIVE_SANCTION_CONFLICT)"
        side_effects:
          - "sanitized_on_utc = null"
          - "Account.karma_points recomputed"
          - "Account.account_sanction_index recomputed"

  # --- (7) BrigadingCluster: escalation with a recovery revert -----------------
  - entity: BrigadingCluster
    initial_state: DETECTED
    terminal_states: []
    transitions:
      - from: DETECTED
        to: ESCALATED
        trigger: POST /api/community-administration/brigade-escalations
        actor: PlatformAdmin
        preconditions:
          - "cluster.evidence_complete is true (ERR_BRIGADE_EVIDENCE_INCOMPLETE)"
          - "cluster.signal_severity_band >= 3 (ERR_BRIGADE_SEVERITY_TOO_LOW)"
        side_effects:
          - "brigade_penalty_points computed over all ESCALATED clusters"
          - "Community.health_index recomputed"
          - "Community ACTIVE_to_ACTIVE self-loop recompute fires"

      - from: ESCALATED
        to: DETECTED
        trigger: POST /api/community-administration/brigade-revivals
        actor: PlatformAdmin
        preconditions:
          - "at least 7 days have passed since cluster.detected_at_utc (ERR_COOLING_OFF_ACTIVE)"
        side_effects:
          - "Community.health_index recomputed"

      - from: DETECTED
        to: DISMISSED
        trigger: POST /api/communities/{id}/brigade-clusters/{clusterId}/dismiss
        actor: Moderator
        preconditions:
          - "cluster.evidence_complete is false (ERR_INVALID_STATE)"
        side_effects:
          - "Community.health_index recomputed"

  # --- (8) Appeal: negotiation loop with a cooling-off barrier -----------------
  - entity: Appeal
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: SUBMITTED
        trigger: POST /api/accounts/{id}/appeals/{appealId}/submit
        actor: Account
        preconditions:
          - "Appeal.account_id == the X-User-ID of the acting account (ERR_FORBIDDEN_ROLE)"
          - "the appealed AccountSanction exists and is ACTIVE (ERR_INVALID_STATE)"
          - "logical clock < Appeal.filed_at_utc + 7 days (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects:
          - "submitted_at_utc = logical clock"
          - "deadline_utc = submitted_at_utc + 30 days"

      - from: SUBMITTED
        to: UNDER_WATCH
        trigger: POST /api/community-administration/appeal-referrals
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "last_referred_at_utc = logical clock"
          - "referral_count += 1"

      - from: UNDER_WATCH
        to: SUBMITTED
        trigger: POST /api/community-administration/appeal-referrals
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "last_referred_at_utc = logical clock"
          - "referral_count += 1"

      - from: SUBMITTED
        to: GRANTED
        trigger: POST /api/accounts/{id}/appeals/{appealId}/decide
        actor: PlatformAdmin
        preconditions:
          - "Appeal.state == SUBMITTED (ERR_INVALID_STATE)"
          - "the appealed AccountSanction still has status ACTIVE (ERR_INVALID_STATE)"
          - "logical clock < Appeal.deadline_utc (ERR_PRECEDENT_EXPIRED)"
          - "Appeal has evidence_movement (ERR_NO_NEW_EVIDENCE)"
        side_effects:
          - "decision_reason_code resolved from ground_code and sanction_misapplication_present"
          - "the appealed AccountSanction -> LIFTED via the AccountSanction ACTIVE_to_LIFTED transition"

      - from: SUBMITTED
        to: DENIED
        trigger: POST /api/accounts/{id}/appeals/{appealId}/decide
        actor: PlatformAdmin
        preconditions:
          - "logical clock < Appeal.deadline_utc (ERR_PRECEDENT_EXPIRED)"
        side_effects:
          - "decision_reason_code = NO_NEW_EVIDENCE"

      - from: UNDER_WATCH
        to: GRANTED
        trigger: "system (automatic when the watchdog deadline lapses with no evidence movement)"
        actor: system
        preconditions:
          - "logical clock >= last_referred_at_utc + 30 days"
          - "referral_count >= 2"
        side_effects:
          - "the appealed AccountSanction -> LIFTED via the AccountSanction ACTIVE_to_LIFTED transition"
          - "Community.health_index recomputed"

  # --- (9) ProtestEvent: coordination with an abort revert ---------------------
  - entity: ProtestEvent
    initial_state: REQUESTED
    terminal_states: [ENDED]
    transitions:
      - from: REQUESTED
        to: COORDINATED
        trigger: POST /api/communities/{id}/protests/{protestId}/coordinate
        actor: Moderator
        preconditions:
          - "ProtestEvent.quorum_approval_count >= ProtestEvent.required_quorum_count (ERR_QUORUM_NOT_MET)"
          - "ProtestEvent.distinct_power_count >= 2 (ERR_CROSS_POWER_QUORUM_NOT_MET)"
          - "the community is ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "the Community ACTIVE_to_PROTEST_RESTRICTED transition fires"
          - "started_at_utc = logical clock"

      - from: COORDINATED
        to: ENDED
        trigger: POST /api/communities/{id}/protests/{protestId}/end
        actor: Moderator
        preconditions:
          - "the community is PROTEST_RESTRICTED (ERR_INVALID_STATE)"
        side_effects:
          - "the Community PROTEST_RESTRICTED_to_ACTIVE transition fires"
          - "ended_at_utc = logical clock"

      - from: REQUESTED
        to: ENDED
        trigger: POST /api/communities/{id}/protests/{protestId}/end
        actor: Moderator
        preconditions: []
        side_effects:
          - "ended_at_utc = logical clock"
          - "Community.restricted_since_utc is unchanged because the community never left ACTIVE"

# =============================================================================
# §1.2.1 Concurrency Rules
#
# Filter applied to every candidate: "If the second request is sent strictly
# after the first fully completes, can it be rejected because it observes a state
# field the first request changed?" — Yes reduces to a state precondition and is
# NOT listed here. Only CREATE-with-supersede races, whose second request would
# legitimately succeed under the product semantics, survive.
# =============================================================================
concurrency_rules:

  - rule_id: protest-create-stale-community
    parent_entity: Community
    write_endpoint: "POST /api/communities/{id}/protests"
    occ_field: "expected_community_version"
    description: |
      Creating a ProtestEvent against a Community whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just created or ended a protest (which legitimately supersedes the
      prior access-mode intent) and the current writer's view of the community is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: succession-create-stale-community
    parent_entity: Community
    write_endpoint: "POST /api/communities/{id}/successions"
    occ_field: "expected_community_version"
    description: |
      Opening a TeamSuccession against a Community whose version has advanced since
      the client last observed it is rejected. Succession rows are create-with-
      supersede: a later succession legitimately supersedes the prior handover
      intent, so the second create is not a state-precondition failure and is
      resolved by the community version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rule-create-stale-community
    parent_entity: Community
    write_endpoint: "POST /api/communities/{id}/rules"
    occ_field: "expected_community_version"
    description: |
      A local CommunityRule created against a stale Community version is rejected.
      A newly authored rule legitimately supersedes the rule set the writer was
      reasoning about, so the second create would otherwise succeed on semantics
      alone and the version check is the only deterministic rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: moderator-add-stale-community
    parent_entity: Community
    write_endpoint: "POST /api/communities/{id}/moderators"
    occ_field: "expected_community_version"
    description: |
      Appointing a Moderator against a stale Community version is rejected. Team
      appointments are create-with-supersede because the appointment changes the
      top_rank ladder the previous writer observed, so the stale write is resolved
      by the community version check rather than by a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- double-variant family B, instance 1 (community domain) ----------------
  - name: community_health_index
    trigger: "any change to the OPEN ContentReport set, BrigadingCluster severity, or ACTIVE Moderator set; also recomputed by the Community ACTIVE_to_ACTIVE self-loop"
    algorithm: aggregation
    input_set: |
      Reports: every ContentReport with status == OPEN (RESOLVED, RESOLVED_LOCKED and
      DISMISSED are excluded). Clusters: every BrigadingCluster with status == ESCALATED
      (DETECTED and DISMISSED are excluded). Inactivity: every Moderator with
      status == ACTIVE.
    formula: |
      # PRE-BAND READING — the scaffold pins this as the correct order.
      STEP 1 (per report, rounded individually):
        tier_weight(tier 1) = 1.0 ; tier_weight(tier 2) = 1.5 ; tier_weight(tier 3) = 2.0
        effective_open_report_weight = round_half_up(tier_weight / 3, 2)
        open_report_weight = sum of effective_open_report_weight over OPEN reports
      STEP 2:
        brigade_penalty = sum over ESCALATED clusters of
                          round_half_up(overlap_ratio * signal_severity_band, 2)
        inactivity_penalty = 2.5 * inactive_moderator_count
      STEP 3:
        health_index = round_half_up(100 - open_report_weight
                                         - brigade_penalty
                                         - inactivity_penalty, 2), clamped to [0.00, 100.00]
    precision: "2 decimal places, round_half_up, applied at STEP 1 per report and again at STEP 3"
    variants:
      - name: rounded_per_report
        when: "pinned reading — every community without exception"
        difference: "the tier weight is divided by 3 and rounded to 2 dp separately for each OPEN report before summing"
      - name: unrounded_then_summed
        when: "superseded reading, no longer used"
        difference: |
          the raw tier weights are summed first and the division by 3 is applied
          once to the sum. Three tier-1 OPEN reports therefore yield 99.00 instead of
          the pinned 99.01, because the superseded reading computes
          100 - round_half_up(3 * 1.0 / 3, 2) = 99.00 while the pinned reading computes
          100 - 3 * round_half_up(1.0 / 3, 2) = 100 - 3 * 0.33 = 99.01.

  # ---- double-variant family B, instance 2 (account domain) ------------------
  - name: account_sanction_index
    trigger: "POST /api/community-administration/account-sanctions (account-wide route) and every sanction create, lift or reinstatement"
    algorithm: aggregation
    input_set: |
      Denominator: every AccountSanction row whose account_id is the subject, whatever
      its status. Numerator: every AccountSanction row whose account_id is the subject,
      whose status == ACTIVE, and which satisfies EITHER of:
        (i)  account_wide_enforcement_counted == true, OR
        (ii) account_wide_enforcement_counted == false
             AND (logical clock - sanction_date_utc) >= 30 days.
      A row with status == ACTIVE, account_wide_enforcement_counted == false and a
      sanction_date_utc less than 30 days before the logical clock is EXCLUDED from
      the numerator. A LIFTED row is excluded from the numerator but stays in the
      denominator. Numerator and denominator are therefore OBSERVABLE ratio fields.
    formula: |
      numerator   = count of qualifying ACTIVE rows as defined in input_set
      denominator = count of all AccountSanction rows for the account
      account_sanction_index = numerator / denominator
      # displayed to 2 dp round_half_up; the community posture gate in §1.2 compares
      # the UNROUNDED ratio against the thresholds 2 and 3.
    precision: "2 decimal places, round_half_up (display); threshold comparisons use the unrounded ratio"
    variants:
      - name: status_and_age_or
        when: "pinned reading, used by the community posture gate in §1.2"
        difference: "an ACTIVE row that is not counted account-wide still counts once it is 30 days old; the predicate is (counted account-wide) OR (old enough)"
      - name: counted_flag_only
        when: "superseded reading, no longer used"
        difference: |
          a row qualifies only when account_wide_enforcement_counted is true and the
          30-day age path is ignored. On the three-row fixture in §1.8 the pinned
          reading yields 2/3 = 0.67 and the superseded reading yields 1/3 = 0.33,
          straddling the >= 0.60 gate that moves a community into RESTRICTED.

  # ---- community enforcement ladder -----------------------------------------
  - name: enforcement_tier
    trigger: "recomputed with community_health_index on the Community self-loop and on every sanction create, lift or reinstatement"
    algorithm: threshold
    input_set: "the community's applying_sanction_count = number of ACTIVE AccountSanction rows whose community_id is this community"
    formula: |
      if applying_sanction_count <= 1: enforcement_tier = 1
      elif applying_sanction_count == 2: enforcement_tier = 2
      else: enforcement_tier = 3
    constants:
      TIER_2_AT: 2
      TIER_3_AT: 3
    precision: "integer"

  # ---- contagion terminal: cluster -> community health ----------------------
  - name: brigade_penalty_points
    trigger: "POST /api/community-administration/brigade-escalations"
    algorithm: weighted_scoring
    input_set: "every BrigadingCluster of the community whose status is ESCALATED"
    formula: |
      per_cluster_penalty = min(signal_severity_band * (1 + floor(overlap_ratio * 10)), 30)
      brigade_penalty_points = sum of per_cluster_penalty over ESCALATED clusters
      # the floor(overlap_ratio * 10) step makes the stored 2-dp overlap_ratio
      # load-bearing: an overlap of 0.90 contributes 9 and 0.80 contributes 8.
    constants:
      PER_CLUSTER_CAP: 30
    precision: "integer"
    variants:
      - name: instant_cap
        when: "pinned reading — a severity-5 cluster at overlap 1.00 contributes exactly 30"
        difference: "the per-cluster cap alone sets the ceiling; four same-community clusters of severity 5, 5, 5, 1 reach exactly 100 points"
      - name: cross_community_multiplier
        when: "superseded reading, no longer used — applied on top when the cluster's external_link_count >= 10"
        difference: |
          the summed per-cluster penalty is multiplied by 1.5 and floored, so the
          same 100-point sum becomes 150 and the health index floors at 0.00 instead
          of the pinned 0.00 only at the 140-point threshold.

  # ---- combinatorial (a): nested conditional over decision fields -----------
  - name: effective_enforcement_tier
    trigger: "POST /api/communities/{id}/content-decisions and POST /api/community-administration/account-sanctions"
    algorithm: constraint_propagation
    input_set: "the ContentDecision being recorded, plus the recording moderator's declared decision_confidence"
    formula: |
      # EVALUATION ORDER IS PINNED. Step 1: select the outcome base.
      outcome_base: KEEP = 0, REPORT_REJECTED = 0, WARNING_ISSUED = 1,
                    REMOVE = 2, LOCK = 3, MUTE_ISSUED = 4, BAN_ISSUED = 5
      # Step 2: the dissection band is ALWAYS added, whatever its value.
      base = outcome_base + dissection_band
      # Step 3: an evidence-confidence credit applies only on the material-edit path.
      if dissection_band >= 3:
          confidence_credit = 1 if decision_confidence >= 0.60 else 0
      else:
          confidence_credit = 0
      tier = min(5, base - confidence_credit)
      # Step 4: prevalence only ever lowers the tier, never raises it.
      if tier == 5 and precedent_approval_count >= 3:
          tier = 4
      effective_enforcement_tier        = tier
      requires_cross_power_approval     = (tier == 5 and precedent_approval_count < 3)
      community_safety_override         = (tier == 5 and community_health_index_override_present == false)
    constants:
      TIER_CAP: 5
      MATERIAL_EDIT_BAND_FLOOR: 3
      CONFIDENCE_CREDIT_MIN: 0.60
      PRECEDENT_APPROVAL_MIN: 3
    precision: "integer"
    variants:
      - name: dissection_weighted
        when: "pinned reading"
        difference: |
          dissection_band is added to every outcome base, so LOCK at band 1 lands on
          tier 4 while the same LOCK at band 3 lands on tier 5 — the exact boundary
          between cross-power reviewable and not.
      - name: band_ignored_for_low_bands
        when: "superseded reading, no longer used"
        difference: |
          the band is added only when dissection_band >= 3, so LOCK at band 1 lands
          on tier 3 rather than the pinned tier 4 and incorrectly escapes cross-power
          approval; the two readings differ on every low-band decision.

  # ---- combinatorial (a): ceiling / half / max interaction ------------------
  - name: protest_quorum_requirement
    trigger: "POST /api/communities/{id}/protests and recomputed on every moderator add, remove, demote or resign"
    algorithm: threshold
    input_set: "the number of Moderators of the community with status == ACTIVE"
    formula: |
      half_quorum = ceil(active_moderator_count / 2)
      required_quorum_count = max(2, half_quorum)
      # integer arithmetic: 2 moderators -> 2, 3 -> 2, 4 -> 2, 5 -> 3
      # the max(2, ...) arm is what stops a 1-moderator community needing only 1 approval
    constants:
      MIN_QUORUM: 2
    precision: "integer"
    variants:
      - name: ceiling_half
        when: "pinned reading"
        difference: "an odd-moderator community requires the ceiling of half, so 3 moderators require 2 and 5 require 3 but 4 still requires only 2"
      - name: floors_half
        when: "superseded reading, no longer used"
        difference: |
          floor(active_moderator_count / 2) replaces the ceiling before the max(2, ...)
          guard, so a 5-moderator community requires 2 approvals rather than 3; the two
          readings differ exactly on the odd counts 5 and above and collapse 4 to 2 in both.

  # ---- dual-variant family A, instance 1 (post domain) ----------------------
  - name: content_legitimacy_score
    trigger: "POST /api/communities/{id}/automated-detection-backlog-items"
    algorithm: weighted_scoring
    input_set: |
      report_count = number of ContentReports on the detected content whose status == OPEN.
      age_days = floor of the days between the detected content's published_at_utc and the
      logical clock. auto_flag = (source_type != ACCOUNT).
    formula: |
      # RECORD-THEN-RECOMPUTE: the server records a legitimate_score of 50 with the
      # account shown as WARNED, then recomputes the score against the community now
      # carrying this piece as an OPEN-report source. report_count therefore includes the
      # report created for this very detection.
      # PINNED EVALUATION ORDER: the penalty band comes from report_count FIRST, then the
      # score, then the final band is reported from the score.
      band_pre    = HIGH if report_count == 0 else (MID if report_count <= 3 else LOW)
      age_weight  = 1.0 if age_days >= 365 else 1.5
      type_weight = 1.0 if auto_flag is false else 1.5
      band_weight = {HIGH: 1.0, MID: 1.5, LOW: 2.0}[band_pre]
      penalty     = min(40, floor(report_count * band_weight * age_weight * type_weight))
      base        = 70 if age_days >= 30 else 50
      legitimacy_score = max(0, base - penalty)
      band_final  = LOW if legitimacy_score < 30 else (MID if legitimacy_score < 60 else HIGH)
    constants:
      PENALTY_CAP: 40
      LOW_SCORE_CEILING: 30
      MID_SCORE_CEILING: 60
    precision: "integer floor at the penalty step; the scenario pins the input overlap_ratio to 2 dp before this rule runs"
    variants:
      - name: band_before_penalty
        when: "pinned reading"
        difference: |
          band_pre is derived from report_count and then used as band_weight. With
          report_count 2, age_days 62, source_type POST: band_pre = MID, so
          penalty = min(40, floor(2 * 1.5 * 1.5 * 1.5)) = 6 and
          legitimacy_score = 70 - 6 = 64.
      - name: band_after_penalty
        when: "superseded reading, no longer used"
        difference: |
          band_weight is taken from the final band of a first-pass score computed with
          band_weight = 1.0, and the penalty is then applied again with that band. With
          report_count 2, age_days 62 and source_type POST: the first pass gives
          70 - floor(2 * 1.0 * 1.5 * 1.5) = 66, whose final band is HIGH, so the second
          pass also gives 70 - floor(2 * 1.0 * 1.5 * 1.5) = 66 — two points above the
          pinned score of 64, where the pinned reading used band_pre MID with
          band_weight 1.5 to reach 70 - min(40, floor(2 * 1.5 * 1.5 * 1.5)) = 70 - 6 = 64.

  # ---- dual-variant family A, instance 2 (account domain) -------------------
  - name: sanction_award_points
    trigger: "POST /api/community-administration/account-sanctions"
    algorithm: tiered_pricing
    input_set: "the sanctioned account's public sanction registry: every AccountSanction row of that account, whatever its status"
    formula: |
      # EVALUATION ORDER IS STATED EXPLICITLY because the formula looks circular: the
      # tier depends on the registry and the registry is exactly what this write mutates.
      # Resolution: the registry is read as it stands BEFORE the new row is inserted.
      # RECORD-THEN-RECOMPUTE: the registry is read with the newly applied sanction
      # already recorded, so a first offence already counts itself in registry_size_pre.
      armor_points = 30 if (the account has any LIFTED row with
                            account_wide_enforcement_counted == true) else 0
      premature_discount_eligible = (the account has any ACTIVE row whose
                                     sanction_date_utc is less than 30 days before the
                                     logical clock)
      if armor_points != 0 and premature_discount_eligible: refund = min(150, 30 + 120)
      else:                                                refund = 0
      registry_size_pre = number of existing rows for the account
      tier = TIER_1 if registry_size_pre == 0 else (TIER_2 if registry_size_pre <= 2 else TIER_3)
      tier_base = {TIER_1: 150, TIER_2: 250, TIER_3: 400}[tier]
      sanction_award_points = tier_base - refund
    constants:
      ARMOR_POINTS: 30
      REFUND_ADDEND: 120
      REFUND_CAP: 150
    precision: "integer"
    variants:
      - name: expectation_driven_base
        when: "pinned reading — the tier is selected from the registry with the newly applied sanction already recorded"
        difference: |
          an account whose first ever sanction is a BAN_ISSUED lands on TIER_1 and
          scores exactly 150; a second sanction on the same account lands on TIER_2 and
          scores exactly 250; a fourth scores exactly 400.
      - name: armor_driven_rebate
        when: "superseded reading, no longer used"
        difference: |
          refund is subtracted from tier_base first and the discounted value then
          re-selects the tier, so the rebate compounds. With registry_size_pre 3,
          armor_points 30 and premature_discount_eligible true the pinned reading gives
          400 - 150 = 250 while the superseded reading gives 250 - 150 = 100 — the two
          readings differ by 150 and land on opposite sides of any zero floor.

  # ---- power-breadth counting ----------------------------------------------
  - name: protest_distinct_power_count
    trigger: "POST /api/communities/{id}/protests/{protestId}/approvals, recomputed from the whole approval set on every approval"
    algorithm: aggregation
    input_set: "every ProtestApproval of the protest, whatever the approval order"
    formula: |
      For each approving account A present in the approval set:
        power(A) = number of DISTINCT communities the account moderates, derived from every
                   Moderator row whose moderator_account_id == A
        positions(A) = the ascending ranks of those distinct community_id values inside the
                       community_id-sorted set of all communities the account moderates
        linear_span(A)  = max(positions(A)) - min(positions(A))
        wrap_span(A)    = power(A) - linear_span(A)
        width(A)        = 1 + min(linear_span(A), wrap_span(A))
      distinct_power_count = max over approving accounts of width(A), or 0 when the
                             approval set is empty.
      # The span is computed on the circle of length power(A): a two-row account whose two
      # rows sit in the same community has power 1, and {ranks 1, 2, 3} of a 4-community
      # account has width 2, not 3.
      # NO tie-break on created_at exists by construction: the value is a function of the
      # whole approval set present, so the evaluation order cannot change it. This is the
      # deliberate contrast with moderator_inactivity_expiry below.
    precision: "integer"

  # ---- cluster geometry -----------------------------------------------------
  - name: brigading_overlap_ratio
    trigger: "POST /api/communities/{id}/brigade-clusters"
    algorithm: aggregation
    input_set: "the created BrigadingCluster's participant counts"
    formula: |
      overlap_ratio = round_half_up(max(1 - legitimate_participant_count / participant_count, 0), 2)
      # participant_count must be >= 1 (ERR_INVALID_REQUEST otherwise)
    precision: "2 decimal places, round_half_up"

  - name: brigading_signal_severity_band
    trigger: "POST /api/communities/{id}/brigade-clusters"
    algorithm: threshold
    input_set: "the created BrigadingCluster's link counts, participant_count and overlap_ratio"
    formula: |
      link_breadth = internal_link_count + external_link_count
      severity = 1
      if link_breadth >= 5:  severity = 2
      if link_breadth >= 10: severity = 3
      if link_breadth >= 20: severity = 4
      if participant_count >= 50: severity = severity + 1
      if overlap_ratio >= 0.60:   severity = severity + 1
      signal_severity_band = min(5, severity)
    constants:
      LINK_BREADTH_STEPS: [5, 10, 20]
      PARTICIPANT_ESCALATOR: 50
      OVERLAP_ESCALATOR: 0.60
      BAND_CAP: 5
    precision: "integer"

  - name: brigade_escalation_severity
    trigger: "POST /api/community-administration/brigade-escalations (returned severity payload)"
    algorithm: threshold
    input_set: "the cluster's signal_severity_band B, its overlap_ratio R and the community health index H"
    formula: |
      severity = min(5, floor(B * (1 + R)) + (1 if H >= 60 else 0))
      # a B of 2 with R of 0.40 and H of 60 therefore yields floor(2 * 1.40) + 1 = 3
    constants:
      HEALTH_ESCALATOR: 60
    precision: "integer"
    variants:
      - name: health_escalated
        when: "pinned reading"
        difference: "the health escalator adds 1 whenever the community health index is at or above 60.00, evaluated after the escalation's own health recompute"
      - name: count_only
        when: "superseded reading, no longer used"
        difference: "the health escalator is dropped, so the same B of 2 with R of 0.40 yields 2 rather than the pinned 3"

  # ---- double-variant family B, instance 3 (moderator domain) ---------------
  - name: moderator_inactivity_expiry
    trigger: "recomputed for every Moderator on the Community ACTIVE_to_ACTIVE self-loop recompute"
    algorithm: chronological
    input_set: |
      anchor(M) = M.last_moderation_action_at_utc when it is non-null,
                  otherwise (the Community.restricted_since_utc of M's community when it is
                  non-null, otherwise M.created_at).
    formula: |
      inactive(M) = (logical clock - anchor(M)) >= 90 days
      ORDER SENSITIVITY IS PINNED: when several moderators cross the 90-day line at the same
      logical clock the individual expiry order is ascending anchor(M), and on an exact
      anchor tie the fallback is ascending created_at. The Account or Moderator identifier
      is NEVER used, not even as a final tie-break.
      CONTRAST: protest_distinct_power_count above is deliberately order-free while this rule
      is deliberately order-sensitive; the pair exercises both halves of aggregate-selection
      precision.
    constants:
      INACTIVITY_WINDOW_DAYS: 90
    precision: "integer day count"
    variants:
      - name: dormant_window
        when: "pinned reading"
        difference: |
          a moderator with last_moderation_action_at_utc 91 days before the clock and no
          restricted_since_utc re-anchor is counted inactive, while the same moderator at
          89 days is not.
      - name: eligible_window
        when: "superseded reading, no longer used"
        difference: |
          a non-null restricted_since_utc always replaces the moderator's own anchor, so a
          moderator whose own last action is 10 days old but whose community has been
          RESTRICTED for 100 days would be counted inactive under the pinned reading
          (anchor = restricted_since_utc, 100 days) and under the superseded reading equally,
          but the readings diverge whenever the community returns to ACTIVE, where the pinned
          reading drops the expired community anchor and the superseded reading keeps it.

  # ---- per-report weight (double-variant family C, instance 3) ---------------
  - name: open_report_weight
    trigger: "ContentReport create, and every ContentDecision that resolves, locks, rejects or dismisses a report"
    algorithm: aggregation
    input_set: "every ContentReport of the community with status == OPEN"
    formula: |
      effective_open_report_weight(report) =
        round_half_up((1.0 if resolution_tier == 1
                       else 1.5 if resolution_tier == 2
                       else 2.0) / 3, 2)
      open_report_weight = sum of effective_open_report_weight over OPEN reports
    precision: "2 decimal places, round_half_up, applied per report before summing"
    variants:
      - name: per_report_rounded
        when: "pinned reading"
        difference: |
          three OPEN tier-1 reports produce 0.99 because each contributes
          round_half_up(1.0 / 3, 2) = 0.33.
      - name: summed_then_rounded
        when: "superseded reading, no longer used"
        difference: |
          the raw weights are summed and rounded once, so the same three OPEN tier-1
          reports produce round_half_up(3 * 1.0 / 3, 2) = 1.00 — one hundredth above the
          pinned value, which is exactly the gap that decides whether a community sitting
          on the 99.00 health line stays above it.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to a role declared in §1.7; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation by §1.7; for entity_backed roles the acting identity must own or moderate the target resource"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: business_safety
    check: |
      segregation of duties on the succession dispute route only: the account that
      authored the most recent discussion round of a TeamSuccession may not open the next
      dispute on that same succession. Evaluated BEFORE the existence check for the
      succession id, so a self-dispute against an unknown succession still reports the
      misconduct rather than a 404. The demote route carries a state check first and its
      self-demotion refusal is evaluated after it.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/communities/{id}/successions/{successionId}/disputes"

  - priority: 4
    category: existence
    check: "the community named by the first path id exists (ERR_COMMUNITY_NOT_FOUND); the nested resource named by the trailing path id exists inside that community (ERR_NOT_FOUND); on the nested succession and moderation routes the leading community id is existence-checked first even when the trailing id is not owned by it"
    error_id: "ERR_COMMUNITY_NOT_FOUND / ERR_NOT_FOUND"
    http_status: 404
    applies_to: "all /communities/{communityId}/... endpoints"

  - priority: 5
    category: business_fiscal
    check: |
      optimistic concurrency: the supplied expected_community_version or
      expected_moderator_version equals the persisted version BEFORE any state
      precondition is evaluated. Checked ahead of priority 6 so a stale writer pointed at
      an already-terminal resource still sees the stale-version rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/communities/{id}/rules, /moderators, /protests, /successions, and every moderator mutation endpoint"

  - priority: 6
    category: state
    check: "the target resource is in a state that admits the requested operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 7
    category: business_referential
    check: "every referenced identifier that must resolve does so: the consumed backlog item exists and is OPEN (ERR_NOT_FOUND), the appealed sanction exists and is ACTIVE (ERR_INVALID_STATE)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/communities/{id}/content-decisions, POST /api/accounts/{id}/appeals, POST /api/accounts/{id}/appeals/{appealId}/submit"

  - priority: 8
    category: business_constraint
    check: |
      quorum arithmetic: an approval may not be recorded twice by the same account
      (ERR_QUORUM_NOT_MET); coordinate requires quorum_approval_count >=
      required_quorum_count AND distinct_power_count >= 2 (ERR_CROSS_POWER_QUORUM_NOT_MET).
    error_id: "ERR_QUORUM_NOT_MET / ERR_CROSS_POWER_QUORUM_NOT_MET"
    http_status: 409
    applies_to: "POST /api/communities/{id}/protests/{protestId}/approvals, POST /api/communities/{id}/protests/{protestId}/coordinate"

  - priority: 9
    category: business_constraint
    check: "the protest access mode must be READ_ONLY or RESTRICTED"
    error_id: ERR_PRIVATE_PROTEST_FORBIDDEN
    http_status: 409
    applies_to: "POST /api/communities/{id}/protests"

  - priority: 10
    category: business_safety
    check: "a top moderator may not be removed for inactivity while a handover is outstanding"
    error_id: ERR_TOP_MODERATOR_REMOVAL_FORBIDDEN
    http_status: 409
    applies_to: "POST /api/communities/{id}/moderators/{moderatorId}/remove"

  - priority: 11
    category: business_constraint
    check: "at least one other ACTIVE moderator must remain after a removal"
    error_id: ERR_FINAL_MODERATOR_REMOVAL
    http_status: 409
    applies_to: "POST /api/communities/{id}/moderators/{moderatorId}/remove"

  - priority: 12
    category: business_temporal
    check: "the moderator's inactivity anchor must be at least 90 days before the logical clock"
    error_id: ERR_INACTIVITY_REMOVAL_NOT_JUSTIFIED
    http_status: 409
    applies_to: "POST /api/communities/{id}/moderators/{moderatorId}/remove"

  - priority: 13
    category: business_temporal
    check: "an appeal may only be submitted inside the 7-day filing window; an appeal may only be decided strictly before its 30-day deadline"
    error_id: "ERR_APPEAL_WINDOW_CLOSED / ERR_PRECEDENT_EXPIRED"
    http_status: 409
    applies_to: "POST /api/accounts/{id}/appeals/{appealId}/submit, POST /api/accounts/{id}/appeals/{appealId}/decide"

  - priority: 14
    category: business_referential
    check: "a grant of an appeal requires either new evidence or a recorded misapplication of the sitewide policy read"
    error_id: ERR_NO_NEW_EVIDENCE
    http_status: 422
    applies_to: "POST /api/accounts/{id}/appeals/{appealId}/decide"

  - priority: 15
    category: business_constraint
    check: "a reinstatement request must satisfy every quarantine or restriction exit condition in a single evaluation"
    error_id: ERR_REINSTATEMENT_CONDITIONS_UNMET
    http_status: 409
    applies_to: "POST /api/communities/{id}/reinstatement-requests"

  - priority: 16
    category: business_constraint
    check: |
      brigade evidence gate: escalation requires evidence_complete
      (ERR_BRIGADE_EVIDENCE_INCOMPLETE) then signal_severity_band >= 3
      (ERR_BRIGADE_SEVERITY_TOO_LOW); a revival requires 7 days since detection
      (ERR_COOLING_OFF_ACTIVE)
    error_id: "ERR_BRIGADE_EVIDENCE_INCOMPLETE / ERR_BRIGADE_SEVERITY_TOO_LOW / ERR_COOLING_OFF_ACTIVE"
    http_status: 409
    applies_to: "POST /api/community-administration/brigade-escalations, POST /api/community-administration/brigade-revivals"

  - priority: 17
    category: business_constraint
    check: "a sanction reinstatement targets a sanction that is already ACTIVE, or targets a sanction whose issuing community is QUARANTINED"
    error_id: ERR_ACTIVE_SANCTION_CONFLICT
    http_status: 409
    applies_to: "POST /api/community-administration/account-sanctions, POST /api/community-administration/sanction-reinstatements"

  - priority: 18
    category: business_constraint
    check: "a community name is unique among communities whose state is not CLOSED"
    error_id: ERR_DUPLICATE_COMMUNITY_NAME
    http_status: 409
    applies_to: "POST /communities"

  - priority: 19
    category: business_constraint
    check: "a rule_code is unique among the community's ACTIVE CommunityRules; a rule with is_sitewide_floor true may not declare a rule_band below the sitewide floor band"
    error_id: "ERR_DUPLICATE_RULE_CODE / ERR_RULE_CONFLICT"
    http_status: 409
    applies_to: "POST /api/communities/{id}/rules, POST /api/communities/{id}/escalations"

  - priority: 20
    category: business_constraint
    check: "a local CommunityRule whose rule_band is higher than the sitewide floor for the community's declared maturity is the escalation trigger, not a rejection"
    error_id: ERR_RULE_CONFLICT
    http_status: 409
    applies_to: "POST /api/communities/{id}/escalations"

# =============================================================================
# §1.5 API Endpoint Table
#
# Path templates use the literal `{id}` placeholder for the owning parent
# segment, which is the form §1.5's FK reverse-reachability rule sanctions.
# =============================================================================
endpoints:

  # --- platform core -------------------------------------------------------
  - method: POST
    path: "/api/communities"
    description: "Create a community. The creating account becomes its first ACTIVE top moderator."
    roles: [Account, Moderator, PlatformAdmin]
    code: 201
    input: ["name", "description", "is_over_18?", "founding_moderator_account_id?"]
    output: Community
    side_effects:
      - "state=ACTIVE, enforcement_tier=1, health_index=100.00, active_moderator_count=1"
      - "active_top_moderator_count=1, inactive_moderator_count=0, active_rule_count=0"
      - "applying_sanction_count=0, quarantine_approval_count=0, quarantine_reinstatement_count=0"
      - "restricted_since_utc=null, protest_exemption_until_utc=null"
      - "a Moderator row is synthesized for founding_moderator_account_id, or for the acting account when the field is omitted, with moderator_role=TOP_MODERATOR, status=ACTIVE, top_rank=1, moderator_version=1"
      - "Community.version=1 on creation, and created_at and updated_at are server-stamped"

  - method: GET
    path: "/api/communities"
    description: "List communities with filtering and pagination"
    roles: [Account, Moderator, PlatformAdmin, Anonymous, ContentReviewer, SuccessionAuditor]
    code: 200
    input: ["state?", "enforcement_tier?", "limit?", "offset?"]
    output: Community[]
    side_effects: []

  - method: GET
    path: "/api/communities/{id}"
    description: "Get a community with all computed posture fields"
    roles: [Account, Moderator, PlatformAdmin, Anonymous, ContentReviewer, SuccessionAuditor]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. The server's startup default time is exactly 2026-09-01T00:00:00Z; before any call to this endpoint the logical clock reads that value and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: datetime }"
    side_effects:
      - "every inactivity window, cooling-off window, filing window and deadline in the scaffold is evaluated against this clock"

  # --- community rules -----------------------------------------------------
  - method: POST
    path: "/api/communities/{id}/rules"
    description: "Author a local community rule inside sitewide policy"
    roles: [Moderator, PlatformAdmin]
    code: 201
    input: ["rule_code", "rule_text", "rule_band", "is_sitewide_floor?", "expected_community_version"]
    output: CommunityRule
    side_effects:
      - "status=ACTIVE"
      - "when the acting X-User-Role is Moderator, the acting moderator row's last_moderation_action_at_utc = logical clock"
      - "Community.active_rule_count recomputed"
