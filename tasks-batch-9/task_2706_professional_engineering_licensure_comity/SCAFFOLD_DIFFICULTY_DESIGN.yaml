      - name: seat_turnover_buffer_boundary_44_then_45_minutes
        grounds:
          - calculations.exam_seat_interval_conflict
          - validations[priority=20]
          - validations[priority=19]
          - calculations.test_center_seat_ledger
          - errors.ERR_SEAT_WINDOW_CONFLICT
        distinguishing_aspect: |
          TURNOVER_BUFFER_MINUTES (45) is probed at 44 and at 45 minutes after an existing window closes,
          which discriminates the correct trailing-buffer, half-open comparison from the three common
          mistakes: no buffer at all (both attempts would succeed), a buffer applied to both ends (both
          would fail), and a closed-interval comparison (the 45-minute attempt would fail because the
          buffered end 16:45 would count as occupied). Both candidate windows are exactly 480 minutes, so
          the priority-19 length check never masks the interval verdict.
