          trigger:
            - call: "POST /operating-authorities/${auth70_id}/activate"
              payload: {}
              as: CarrierRep
              as_user_id: "${c70_id}"
              captures: { activate_as_carrier_error: $.data.error_id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c70_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX"] }
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { apply_as_officer_error: $.data.error_id }
            - call: "POST /carriers"
              payload: { legal_name: "Unauthorized Enrolment LLC", domicile_state: "TX", self_reported_vehicle_count: 5, self_reported_driver_count: 5, self_reported_oos_rate_pct: 1.0 }
              as: CarrierRep
