            - "${dup_error} == ERR_DUPLICATE_REQUEST (the unchanged-value resubmit is refused)"
            - "the first resubmit returned error_id == ERR_DUPLICATE_REQUEST and the row stayed REJECTED at that point"
            - "BackupGroup.${grp_p_id}.group_retention_days == 45 (no rejection path ever mutates retention)"

  # ===========================================================================
  - rule_id: transitive_cascade
