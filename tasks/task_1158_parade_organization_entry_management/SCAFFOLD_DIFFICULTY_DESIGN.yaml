scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: judging_provisional_vs_final_trimmed_mean
        grounds:
          - calculations.judging_score
          - entities.EntryApplication.fields.provisional_score
          - entities.EntryApplication.fields.final_score
        distinguishing_aspect: |
          Dual-variant aggregation on the JUDGING domain (EntryApplication scores): the
          provisional variant is a plain mean over SUBMITTED+FINALIZED sheets, the final
          variant is a trimmed mean over FINALIZED sheets only; for the same three sheets
          (70, 80, 81) they yield 77.00 vs 80.00 — different numbers from identical data.
        test_recipe:
          setup:
            - "One parade; one APPROVED BAND entry (no float needed); three judges each with a sheet totaling 70, 80, 81; all three sheets SUBMITTED then FINALIZED"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "July Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "City Band", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "BAND" }, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/score-sheets", payload: { creativity: 20, craftsmanship: 20, theme: 15, crowd_appeal: 15 }, as: Judge, as_user_id: "judge_1", captures: { sh1: $.data.id } }
            - { call: "POST /entries/${en_id}/score-sheets", payload: { creativity: 20, craftsmanship: 20, theme: 20, crowd_appeal: 20 }, as: Judge, as_user_id: "judge_2", captures: { sh2: $.data.id } }
            - { call: "POST /entries/${en_id}/score-sheets", payload: { creativity: 21, craftsmanship: 20, theme: 20, crowd_appeal: 20 }, as: Judge, as_user_id: "judge_3", captures: { sh3: $.data.id } }
            - { call: "POST /score-sheets/${sh1}/submit", payload: {}, as: Judge, as_user_id: "judge_1" }
            - { call: "POST /score-sheets/${sh2}/submit", payload: {}, as: Judge, as_user_id: "judge_2" }
            - { call: "POST /score-sheets/${sh3}/submit", payload: {}, as: Judge, as_user_id: "judge_3" }
            - { call: "GET /entries/${en_id}", payload: {}, as: CommitteeAdmin, captures: { prov_seen: $.data.provisional_score } }
          trigger:
            - { call: "POST /score-sheets/${sh1}/finalize", payload: {}, as: CommitteeAdmin }
            - { call: "POST /score-sheets/${sh2}/finalize", payload: {}, as: CommitteeAdmin }
            - { call: "POST /score-sheets/${sh3}/finalize", payload: {}, as: CommitteeAdmin }
            - { call: "GET /entries/${en_id}", payload: {}, as: CommitteeAdmin, captures: { final_seen: $.data.final_score, prov_after: $.data.provisional_score } }
          assert:
            - "provisional_score before any finalize == 77.00 (plain mean of 70, 80, 81)"
            - "final_score after all three finalized == 80.00 (trimmed mean drops 70 and 81)"
            - "provisional_score after finalize == 77.00 still (FINALIZED sheets stay in the provisional set) — proving the two variants diverge on identical data"

      - name: permit_fee_provisional_flat_vs_final_agency_table
        grounds:
          - calculations.permit_filing_fee
          - entities.PermitApplication.fields.provisional_fee_cents
          - entities.PermitApplication.fields.final_fee_cents
        distinguishing_aspect: |
          Dual-variant pricing on the PERMIT domain (different entity domain from the
          judging instance): the provisional variant prices the filing flat at
          75000 + 5000*4 = 95000 cents, the final variant prices it per agency table
          at 90000 cents (no expedite) — the two sanctioned algorithms disagree.
        test_recipe:
          setup:
            - "One parade with one route segment and one staging area, advanced to PERMIT_PENDING; one permit with four PENDING endorsements; logical clock at default 2026-05-01T00:00:00Z (not expedited: parade_date 2026-07-04 is more than 14 days out)"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Fee Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/route-segments", payload: { order_index: 1, name: "Main St", length_meters: 800, emergency_lane_width_m: 3.5, segment_window_start: "2026-07-04T10:00:00Z", segment_window_end: "2026-07-04T12:00:00Z" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/staging-areas", payload: { name: "Lot A", capacity: 3, open_time: "2026-07-04T07:00:00Z", close_time: "2026-07-04T10:00:00Z" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/permit", payload: {}, as: CommitteeAdmin, captures: { pm_id: $.data.id, pm_prov: $.data.provisional_fee_cents, pm_v: $.data.version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "POLICE", expected_permit_version: "${pm_v}" }, as: CommitteeAdmin, captures: { pv1: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "FIRE", expected_permit_version: "${pv1}" }, as: CommitteeAdmin, captures: { pv2: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "TRANSIT", expected_permit_version: "${pv2}" }, as: CommitteeAdmin, captures: { pv3: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "SANITATION", expected_permit_version: "${pv3}" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/submit-permit", payload: {}, as: CommitteeAdmin }
          trigger:
            - { call: "POST /permits/${pm_id}/submit", payload: {}, as: CommitteeAdmin, captures: { pm_final: $.data.final_fee_cents } }
          assert:
            - "provisional_fee_cents at creation == 95000 (flat 75000 + 5000 x 4 agencies)"
            - "final_fee_cents after submit == 90000 (30000+25000+20000+15000, no expedite surcharge)"
            - "final_fee_cents != provisional_fee_cents — the two variants price the same filing differently"

  - rule_id: combinatorial_formula
    instances:
      - name: entry_fee_tiered_with_late_surcharge_branch
        grounds:
          - calculations.entry_fee
          - entities.EntryApplication.fields.fee_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula: fee = category base + three-tier participant
          ladder + conditional 25% late surcharge — >= 3 inputs (category, participants,
          submission instant) with tiered-rate selection and a state-conditional branch.
          WALKING_GROUP with 200 participants filed late yields 75000 cents.
        test_recipe:
          setup:
            - "One parade with entry_deadline 2026-06-20T23:59:59Z; logical clock moved to 2026-06-18T00:00:00Z (inside the 7-day late window)"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Late Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-18T00:00:00Z" }, as: CommitteeAdmin }
          trigger:
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Big Walkers", requested_category: "WALKING_GROUP", estimated_participants: 200 }, as: Entrant, as_user_id: "entrant_9", captures: { fee_seen: $.data.fee_cents } }
          assert:
            - "fee_cents == 75000 — base 15000 + tier1 50x300=15000 + tier2 150x200=30000 = 60000 subtotal, plus round_half_up(0.25 x 60000) = 15000 late surcharge"
            - "EntryApplication.status == SUBMITTED and fee computed from requested_category (assigned_category still null)"

      - name: script_seconds_per_item_round_then_sum
        grounds:
          - calculations.announcer_script_timing
          - entities.AnnouncerScriptItem.fields.duration_seconds
          - entities.SponsorPackage.fields.allocated_seconds
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-item-then-sum. Two
          SPONSOR_READ items of 0.759 minutes yield 46 s each and a 92 s total;
          sum-then-round would give 91 s — the pinned order is observable.
        test_recipe:
          setup:
            - "One parade; one ACTIVE GOLD sponsor; two APPROVED SPONSOR_READ items of 0.759 minutes each referencing that sponsor"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Script Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/sponsors", payload: { sponsor_name: "Acme Corp", tier: "GOLD", contribution_cents: 500000 }, as: CommitteeAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/activate", payload: {}, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/script-items", payload: { item_type: "SPONSOR_READ", sequence_index: 1, duration_minutes: 0.759, sponsor_id: "${sp_id}" }, as: CommitteeAdmin, captures: { it1: $.data.id, it1_secs: $.data.duration_seconds } }
            - { call: "POST /parades/${p_id}/script-items", payload: { item_type: "SPONSOR_READ", sequence_index: 2, duration_minutes: 0.759, sponsor_id: "${sp_id}" }, as: CommitteeAdmin, captures: { it2: $.data.id, it2_secs: $.data.duration_seconds } }
            - { call: "POST /script-items/${it1}/approve", payload: {}, as: CommitteeAdmin }
            - { call: "POST /script-items/${it2}/approve", payload: {}, as: CommitteeAdmin }
          trigger:
            - { call: "GET /sponsors/${sp_id}", payload: {}, as: CommitteeAdmin, captures: { alloc: $.data.allocated_seconds } }
            - { call: "GET /parades/${p_id}", payload: {}, as: CommitteeAdmin, captures: { parade_secs: $.data.sponsor_seconds_allocated } }
          assert:
            - "each item's duration_seconds == 46 (round_half_up(0.759 x 60 = 45.54))"
            - "SponsorPackage.allocated_seconds == 92 — per-item rounding then sum (sum-then-round would give 91)"
            - "ParadeEvent.sponsor_seconds_allocated == 92"

  - rule_id: non_linear_state_machine
    instances:
      - name: entry_revision_loop_cycle
        grounds:
          - state_machines.EntryApplication.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.EntryApplication.REVISION_REQUESTED_to_SUBMITTED
          - entities.EntryApplication.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on EntryApplication: UNDER_REVIEW -> REVISION_REQUESTED ->
          SUBMITTED -> UNDER_REVIEW runs as a true loop; two full cycles leave
          revision_count == 2 and status back in UNDER_REVIEW.
        test_recipe:
          setup:
            - "One parade; one FLOAT entry with 120 participants (fee 79000 at create)"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Loop Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Loop Floats", requested_category: "FLOAT", estimated_participants: 120 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
          trigger:
            - { call: "POST /entries/${en_id}/request-revision", payload: { revision_notes: "Fix insurance docs" }, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/resubmit", payload: { estimated_participants: 130 }, as: Entrant, as_user_id: "entrant_1", captures: { fee_mid: $.data.fee_cents } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/request-revision", payload: { revision_notes: "Update participant count proof" }, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/resubmit", payload: {}, as: Entrant, as_user_id: "entrant_1" }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin, captures: { st: $.data.status, rc: $.data.revision_count } }
          assert:
            - "after two full revision cycles EntryApplication.status == UNDER_REVIEW again (cycle closed)"
            - "revision_count == 2"
            - "fee_cents after first resubmit == 81000 (FLOAT base 50000 + 50x300 + 80x200 for 130 participants, no late surcharge at default clock)"

      - name: score_sheet_reopen_cycle
        grounds:
          - state_machines.JudgingScoreSheet.SUBMITTED_to_DRAFT
          - state_machines.JudgingScoreSheet.DRAFT_to_SUBMITTED
          - calculations.judging_score
        distinguishing_aspect: |
          Cyclic machine on a DIFFERENT entity (JudgingScoreSheet): SUBMITTED -> DRAFT
          -> SUBMITTED; reopening removes the sheet from the provisional aggregation
          (score goes null) and resubmission restores it — the loop mutates a
          cross-entity computed field each way.
        test_recipe:
          setup:
            - "One parade; one APPROVED BAND entry; one judge sheet with total 80"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Sheet Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Sheet Band", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_2", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "BAND" }, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/score-sheets", payload: { creativity: 20, craftsmanship: 20, theme: 20, crowd_appeal: 20 }, as: Judge, as_user_id: "judge_1", captures: { sh1: $.data.id } }
            - { call: "POST /score-sheets/${sh1}/submit", payload: {}, as: Judge, as_user_id: "judge_1" }
          trigger:
            - { call: "POST /score-sheets/${sh1}/reopen", payload: {}, as: Judge, as_user_id: "judge_1", captures: { st_reopen: $.data.status } }
            - { call: "GET /entries/${en_id}", payload: {}, as: CommitteeAdmin, captures: { prov_reopen: $.data.provisional_score } }
            - { call: "POST /score-sheets/${sh1}/submit", payload: {}, as: Judge, as_user_id: "judge_1", captures: { st_resub: $.data.status } }
            - { call: "GET /entries/${en_id}", payload: {}, as: CommitteeAdmin, captures: { prov_resub: $.data.provisional_score } }
          assert:
            - "sheet status after reopen == DRAFT (cycle back along SUBMITTED -> DRAFT)"
            - "provisional_score while reopened == null (no SUBMITTED or FINALIZED sheets remain)"
            - "sheet status after resubmit == SUBMITTED and provisional_score == 80.00"

  - rule_id: transitive_cascade
    instances:
      - name: permit_revoke_freezes_event_pulls_lineup_cancels_scripts
        grounds:
          - state_machines.PermitApplication.GRANTED_to_REVOKED
          - state_machines.LineupAssignment.CONFIRMED_to_PULLED
          - state_machines.AnnouncerScriptItem.APPROVED_to_CANCELLED
          - entities.ParadeEvent.fields.posture
          - entities.StagingArea.fields.reserved_slots
        distinguishing_aspect: |
          Cascade of depth 4 originating at POST /permits/{id}/revoke: permit REVOKED
          forces parade posture FROZEN (hop 2); the posture flip pulls the CONFIRMED
          lineup assignment (hop 3); the pull releases the staging slot and cancels the
          entry's APPROVED ENTRY_INTRO script item (hop 4). Each hop is caused by the
          previous mutation, not by the revoke directly.
        test_recipe:
          setup:
            - "Full pipeline: parade OPERATIONAL (permit GRANTED, dispersal APPROVED); one FLOAT entry approved with a CERTIFIED float and fee paid; one CONFIRMED lineup assignment in a capacity-3 staging area; one APPROVED ENTRY_INTRO script item for the entry"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Revoke Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/route-segments", payload: { order_index: 1, name: "Main St", length_meters: 800, emergency_lane_width_m: 3.5, segment_window_start: "2026-07-04T10:00:00Z", segment_window_end: "2026-07-04T12:00:00Z" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/staging-areas", payload: { name: "Lot A", capacity: 3, open_time: "2026-07-04T07:00:00Z", close_time: "2026-07-04T10:00:00Z" }, as: CommitteeAdmin, captures: { sa_id: $.data.id } }
            - { call: "POST /parades/${p_id}/dispersal-plan", payload: { emergency_lane_width_m: 3.5, dispersal_corridors: ["Oak Ave", "Pine Ave"] }, as: CommitteeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /dispersal-plans/${dp_id}/submit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /dispersal-plans/${dp_id}/approve", payload: {}, as: AgencyReviewer }
            - { call: "POST /parades/${p_id}/permit", payload: {}, as: CommitteeAdmin, captures: { pm_id: $.data.id, pm_v: $.data.version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "POLICE", expected_permit_version: "${pm_v}" }, as: CommitteeAdmin, captures: { e1: $.data.id, pv1: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "FIRE", expected_permit_version: "${pv1}" }, as: CommitteeAdmin, captures: { e2: $.data.id, pv2: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "TRANSIT", expected_permit_version: "${pv2}" }, as: CommitteeAdmin, captures: { e3: $.data.id, pv3: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "SANITATION", expected_permit_version: "${pv3}" }, as: CommitteeAdmin, captures: { e4: $.data.id } }
            - { call: "POST /parades/${p_id}/submit-permit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /permits/${pm_id}/submit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /endorsements/${e1}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /endorsements/${e2}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /endorsements/${e3}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /endorsements/${e4}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /permits/${pm_id}/grant", payload: {}, as: AgencyReviewer }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Revoke Floats", requested_category: "FLOAT", estimated_participants: 120 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "FLOAT" }, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/floats", payload: { length_m: 12, width_m: 3, height_m: 4, weight_kg: 8000, vehicle_class: "SELF_PROPELLED", fuel_type: "DIESEL" }, as: Entrant, as_user_id: "entrant_1", captures: { fl_id: $.data.id } }
            - { call: "POST /floats/${fl_id}/inspections", payload: { scheduled_at: "2026-06-25T09:00:00Z" }, as: SafetyInspector, as_user_id: "insp_1", captures: { ins_id: $.data.id } }
            - { call: "POST /inspections/${ins_id}/pass", payload: { checklist_score: 85 }, as: SafetyInspector, as_user_id: "insp_1" }
            - { call: "POST /entries/${en_id}/pay-fee", payload: {}, as: Entrant, as_user_id: "entrant_1" }
            - { call: "POST /parades/${p_id}/lineup-assignments", payload: { entry_id: "${en_id}", staging_area_id: "${sa_id}", position_number: 1, arrive_at: "2026-07-04T07:30:00Z", depart_at: "2026-07-04T08:00:00Z" }, as: CommitteeAdmin, captures: { la_id: $.data.id } }
            - { call: "POST /lineup-assignments/${la_id}/confirm", payload: {}, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/script-items", payload: { item_type: "ENTRY_INTRO", sequence_index: 1, duration_minutes: 1.0, entry_id: "${en_id}" }, as: CommitteeAdmin, captures: { si_id: $.data.id } }
            - { call: "POST /script-items/${si_id}/approve", payload: {}, as: CommitteeAdmin }
          trigger:
            - { call: "POST /permits/${pm_id}/revoke", payload: {}, as: AgencyReviewer }
            - { call: "GET /parades/${p_id}", payload: {}, as: CommitteeAdmin, captures: { posture_after: $.data.posture } }
            - { call: "GET /lineup-assignments/${la_id}", payload: {}, as: CommitteeAdmin, captures: { la_after: $.data.status } }
            - { call: "GET /staging-areas/${sa_id}", payload: {}, as: CommitteeAdmin, captures: { slots_after: $.data.reserved_slots } }
            - { call: "GET /script-items/${si_id}", payload: {}, as: CommitteeAdmin, captures: { si_after: $.data.status } }
          assert:
            - "PermitApplication.status == REVOKED (hop 1)"
            - "ParadeEvent.posture == FROZEN (hop 2 — caused by the permit mutation)"
            - "LineupAssignment.status == PULLED (hop 3 — caused by the posture flip, not by the revoke directly)"
            - "StagingArea.reserved_slots == 0 (hop 4 — caused by the pull)"
            - "AnnouncerScriptItem.status == CANCELLED (hop 4 — caused by the pull)"

      - name: inspection_fail_suspends_entry_pulls_assignment
        grounds:
          - state_machines.SafetyInspection.SCHEDULED_to_FAILED
          - state_machines.Float.CERTIFIED_to_FAILED
          - state_machines.EntryApplication.APPROVED_to_SUSPENDED
          - state_machines.LineupAssignment.CONFIRMED_to_PULLED
        distinguishing_aspect: |
          Cascade of depth 4 originating from a DIFFERENT trigger than the permit
          cascade: POST /inspections/{id}/fail flips the float to FAILED (hop 1);
          the float failure suspends the entry (hop 2); the suspension pulls the
          CONFIRMED lineup assignment (hop 3); the pull releases the staging slot and
          cancels the ENTRY_INTRO script item (hop 4).
        test_recipe:
          setup:
            - "Full pipeline: parade OPERATIONAL; FLOAT entry approved with float CERTIFIED by inspector insp_1 and fee paid; one CONFIRMED assignment; one APPROVED ENTRY_INTRO item; a spot re-inspection of the certified float scheduled by a DIFFERENT inspector insp_2 (segregation of duties)"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Inspect Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/route-segments", payload: { order_index: 1, name: "Main St", length_meters: 800, emergency_lane_width_m: 3.5, segment_window_start: "2026-07-04T10:00:00Z", segment_window_end: "2026-07-04T12:00:00Z" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/staging-areas", payload: { name: "Lot B", capacity: 3, open_time: "2026-07-04T07:00:00Z", close_time: "2026-07-04T10:00:00Z" }, as: CommitteeAdmin, captures: { sa_id: $.data.id } }
            - { call: "POST /parades/${p_id}/dispersal-plan", payload: { emergency_lane_width_m: 3.5, dispersal_corridors: ["Oak Ave"] }, as: CommitteeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /dispersal-plans/${dp_id}/submit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /dispersal-plans/${dp_id}/approve", payload: {}, as: AgencyReviewer }
