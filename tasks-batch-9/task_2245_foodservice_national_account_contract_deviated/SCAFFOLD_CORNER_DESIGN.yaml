              payload: { contract_id: "${ct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
              captures: { aug_id: $.data.id }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${chkn_id}", distribution_center_id: "${dc_id}", quantity_cases: 100 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { line_id: $.data.id, line_total: $.data.invoice_total_cents }
            - call: "POST /nac/order-lines/${line_id}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /nac/rebate-periods/${aug_id}/close"
              payload: {}
              as: RebateAccountant
              as_user_id: "acct-1"
              captures: { c_pct: $.data.compliance_pct, c_rebate: $.data.operator_rebate_cents, c_mfg: $.data.manufacturer_funded_cents, c_closed_at: $.data.closed_at }
            - call: "GET /nac/contracts/${ct_id}"
              payload: {}
              as: RebateAccountant
              captures: { ct_payable: $.data.rebate_payable_cents, ct_posture: $.data.compliance_posture }
            - call: "GET /nac/manufacturers/${mfg_id}"
              payload: {}
              as: RebateAccountant
              captures: { mfg_payable: $.data.rebate_funding_payable_cents }
          assert:
            - "${line_total} == 500000 in the create response itself, with no follow-up read needed"
            - "${c_pct} == 100.00, ${c_rebate} == 20000, ${c_mfg} == 12000 and ${c_closed_at} == 2026-09-01T00:00:00Z, all present in the close response"
            - "${ct_payable} == 20000 and ${ct_posture} == OPEN on the very next read"
            - "${mfg_payable} == 12000 on the very next read"
            - "no field is stale or eventually consistent: GET /nac/rebate-periods/${aug_id} immediately afterwards returns the identical numbers"
