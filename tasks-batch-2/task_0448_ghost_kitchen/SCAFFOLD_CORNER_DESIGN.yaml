scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_stall_returns_defaults
        claim_type: Creation
        grounds: [entities.Stall, endpoints]
        distinguishing_aspect: "POST /stalls with all required fields returns 201, status==OPEN, equipment_count==0, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stalls"
              payload: { name: "Corner S", timezone: "UTC", open_minute_of_day: 480, close_minute_of_day: 1320 }
              as: PlatformOps
              captures: { sid: $.data.id }
          assert:
            - "response.status == 201"
            - "Stall.${sid}.status == OPEN"
            - "Stall.${sid}.equipment_count == 0"
            - "Stall.${sid}.version == 1"

      - name: get_stall_not_found
        claim_type: Not Found
        grounds: [entities.Stall, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /stalls/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /stalls/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_brand_missing_commission_rejected
        claim_type: Required Fields
        grounds: [entities.VirtualBrand.fields.commission_rate_bps, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /brands omitting commission_rate_bps returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /brands"
              payload: { name: "NoRate", owner_email: "x@x.com" }
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_brand_commission_out_of_range_rejected
        claim_type: Type Constraints
        grounds: [entities.VirtualBrand.fields.commission_rate_bps, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "commission_rate_bps 6000 (> 5000 max) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /brands"
              payload: { name: "HiRate", owner_email: "x@x.com", commission_rate_bps: 6000 }
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_stall_open_ge_close_rejected
        claim_type: Type Constraints
        grounds: [entities.Stall.fields.open_minute_of_day, entities.Stall.fields.close_minute_of_day, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "open_minute_of_day 600 with close_minute_of_day 600 (not < ) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stalls"
              payload: { name: "BadHours", timezone: "UTC", open_minute_of_day: 600, close_minute_of_day: 600 }
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: brand_status_and_availability_are_system_on_create
        claim_type: System Fields
        grounds: [entities.VirtualBrand.fields.status, entities.VirtualBrand.fields.availability]
        distinguishing_aspect: "POST /brands with attempted status/availability in body is ignored; created brand is ONBOARDING/PAUSED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /brands"
              payload: { name: "Ignore", owner_email: "x@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { bid: $.data.id }
          assert:
            - "VirtualBrand.${bid}.status == ONBOARDING"
            - "VirtualBrand.${bid}.availability == PAUSED"
            - "VirtualBrand.${bid}.ledger_balance_cents == 0"

      - name: recipe_component_immutable_no_version
        claim_type: Immutability
        grounds: [entities.RecipeComponent]
        distinguishing_aspect: "RecipeComponent is common_fields:false: created with id+created_at only, no version field and no update endpoint."
        test_recipe:
          setup: ["Brand BR ONBOARDING with one menu item M."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "BR", owner_email: "br@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { br_id: $.data.id }
            - call: "POST /menu-items"
              payload: { brand_id: "${br_id}", name: "M", price_cents: 500, prep_minutes: 5, required_equipment_type: "OVEN" }
              as: BrandOwner
              as_user_id: "${br_id}"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /menu-items/${m_id}/recipe-components"
              payload: { ingredient_name: "flour", quantity_grams: 50 }
              as: BrandOwner
              as_user_id: "${br_id}"
              captures: { rc_id: $.data.id }
          assert:
            - "response.status == 201"
            - "RecipeComponent.${rc_id}.quantity_grams == 50"

      - name: create_lease_unknown_stall_not_found
        claim_type: Parent Relationships
        grounds: [entities.KitchenLease.fields.stall_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /leases with stall_id referencing a non-existent stall returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Brand BX exists; stall_id is bogus."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "BX", owner_email: "bx@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { bx_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { stall_id: "00000000-0000-0000-0000-000000000000", brand_id: "${bx_id}", monthly_fee_cents: 1000, priority_rank: 1 }
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_stalls_pagination_envelope
        claim_type: Listing
        grounds: [entities.Stall, endpoints]
        distinguishing_aspect: "GET /stalls?limit=1&offset=0 returns array data with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["Two stalls created."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "P1", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
            - call: "POST /stalls"
              payload: { name: "P2", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
          trigger:
            - call: "GET /stalls"
              payload: { limit: 1, offset: 0 }
              as: PlatformOps
          assert:
            - "response.response_type == array"
            - "response.total_count == 2"
            - "response.has_more == true"

      - name: equipment_count_derived_after_create
        claim_type: Computed Fields
        grounds: [entities.Stall.fields.equipment_count]
        distinguishing_aspect: "Adding one Equipment to a stall makes Stall.equipment_count == 1 (derived, input ignored)."
        test_recipe:
          setup: ["Stall SE created."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SE", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { se_id: $.data.id }
          trigger:
            - call: "POST /equipment"
              payload: { stall_id: "${se_id}", equipment_type: "OVEN" }
              as: StallOperator
              as_user_id: "${se_id}"
          assert:
            - "Stall.${se_id}.equipment_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: close_already_closed_stall_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Stall.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a stall already CLOSED returns ERR_INVALID_STATE (409); no version change."
        test_recipe:
          setup: ["Stall SC closed once."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SC", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { sc_id: $.data.id }
            - call: "POST /stalls/${sc_id}/close"
              payload: {}
              as: StallOperator
              as_user_id: "${sc_id}"
          trigger:
            - call: "POST /stalls/${sc_id}/close"
              payload: {}
              as: StallOperator
              as_user_id: "${sc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: activate_already_active_lease_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.KitchenLease.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a lease twice: the second activate (already ACTIVE) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Lease LI ACTIVE."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SLI", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { sli_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "BLI", owner_email: "bli@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { bli_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${sli_id}", brand_id: "${bli_id}", monthly_fee_cents: 1000, priority_rank: 1 }
              as: PlatformOps
              captures: { li_id: $.data.id }
            - call: "POST /leases/${li_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${sli_id}"
          trigger:
            - call: "POST /leases/${li_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${sli_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminated_lease_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.KitchenLease.ACTIVE_to_TERMINATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A TERMINATED lease rejects suspend with ERR_INVALID_STATE (409) — terminal state has no outgoing transitions."
        test_recipe:
          setup: ["Lease LT ACTIVE then TERMINATED."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SLT", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { slt_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "BLT", owner_email: "blt@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { blt_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${slt_id}", brand_id: "${blt_id}", monthly_fee_cents: 1000, priority_rank: 1 }
              as: PlatformOps
              captures: { lt_id: $.data.id }
            - call: "POST /leases/${lt_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${slt_id}"
            - call: "POST /leases/${lt_id}/terminate"
              payload: {}
              as: StallOperator
              as_user_id: "${slt_id}"
          trigger:
            - call: "POST /leases/${lt_id}/suspend"
              payload: {}
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: brand_availability_parallel_to_status
        claim_type: parallel
        grounds: [state_machines.VirtualBrand.PAUSED_to_LISTED, state_machines.VirtualBrand.LISTED_to_PAUSED]
        distinguishing_aspect: "Toggling availability LISTED then PAUSED leaves status==ACTIVE unchanged — independent parallel dimensions."
        test_recipe:
          setup: ["Brand BP ACTIVE (via lease)."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SBP", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { sbp_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "BP", owner_email: "bp@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { bp_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${sbp_id}", brand_id: "${bp_id}", monthly_fee_cents: 1000, priority_rank: 1 }
              as: PlatformOps
              captures: { lbp_id: $.data.id }
            - call: "POST /leases/${lbp_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${sbp_id}"
            - call: "POST /brands/${bp_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${bp_id}"
          trigger:
            - call: "POST /brands/${bp_id}/pause"
              payload: {}
              as: BrandOwner
              as_user_id: "${bp_id}"
          assert:
            - "VirtualBrand.${bp_id}.availability == PAUSED"
            - "VirtualBrand.${bp_id}.status == ACTIVE"

      - name: list_brand_while_onboarding_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.VirtualBrand.PAUSED_to_LISTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /brands/{id}/list on an ONBOARDING brand (status != ACTIVE) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Brand BO ONBOARDING (no active lease)."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "BO", owner_email: "bo@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { bo_id: $.data.id }
          trigger:
            - call: "POST /brands/${bo_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${bo_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: deactivate_brand_blocked_by_routed_order
        claim_type: guarded transitions
        grounds: [state_machines.VirtualBrand.ACTIVE_to_DEACTIVATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Deactivating a brand that has a ROUTED order returns ERR_INVALID_STATE (409) — precondition forbids in-flight orders."
        test_recipe:
          setup: ["Brand BD ACTIVE+LISTED with Wings; Stall SD with FRYER+chicken; clock set; order ROUTED."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SD", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { sd_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "BD", owner_email: "bd@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { bd_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${sd_id}", brand_id: "${bd_id}", monthly_fee_cents: 1000, priority_rank: 1 }
              as: PlatformOps
              captures: { ld_id: $.data.id }
            - call: "POST /leases/${ld_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${sd_id}"
            - call: "POST /brands/${bd_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${bd_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${bd_id}", name: "Wings", price_cents: 1000, prep_minutes: 8, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${bd_id}"
              captures: { wd_id: $.data.id }
            - call: "POST /menu-items/${wd_id}/recipe-components"
              payload: { ingredient_name: "chicken", quantity_grams: 100 }
              as: BrandOwner
              as_user_id: "${bd_id}"
            - call: "POST /equipment"
              payload: { stall_id: "${sd_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${sd_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${sd_id}", ingredient_name: "chicken", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 4, grams_received: 1000 }
              as: StallOperator
              as_user_id: "${sd_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /orders"
              payload: { brand_id: "${bd_id}", aggregator: "DOORDASH", external_ref: "DD-D", line_items: [ { menu_item_id: "${wd_id}", qty: 1 } ] }
              as: AggregatorGateway
              captures: { od_id: $.data.id }
            - call: "POST /orders/${od_id}/route"
              payload: {}
              as: PlatformOps
          trigger:
            - call: "POST /brands/${bd_id}/deactivate"
              payload: {}
              as: BrandOwner
              as_user_id: "${bd_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "VirtualBrand.${bd_id}.status == ACTIVE"

      - name: retire_equipment_blocked_by_held_booking
        claim_type: Precondition Enforcement
        grounds: [state_machines.Equipment.AVAILABLE_to_RETIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Retiring equipment with a HELD booking returns ERR_INVALID_STATE (409); equipment_count unchanged."
        test_recipe:
          setup: ["Stall SR with one FRYER carrying a HELD maintenance booking."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SR", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { sr_id: $.data.id }
            - call: "POST /equipment"
              payload: { stall_id: "${sr_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${sr_id}"
              captures: { er_id: $.data.id }
            - call: "POST /equipment-bookings"
              payload: { equipment_id: "${er_id}", start_minute: 100, end_minute: 150 }
              as: StallOperator
              as_user_id: "${sr_id}"
          trigger:
            - call: "POST /equipment/${er_id}/retire"
              payload: {}
              as: StallOperator
              as_user_id: "${sr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Stall.${sr_id}.equipment_count == 1"

      - name: retire_equipment_decrements_count
        claim_type: Side Effect Execution
        grounds: [state_machines.Equipment.AVAILABLE_to_RETIRED, entities.Stall.fields.equipment_count]
        distinguishing_aspect: "Retiring an idle AVAILABLE unit moves it to RETIRED and decrements Stall.equipment_count from 1 to 0."
        test_recipe:
          setup: ["Stall SQ with one idle FRYER (equipment_count==1)."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SQ", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { sq_id: $.data.id }
            - call: "POST /equipment"
              payload: { stall_id: "${sq_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${sq_id}"
              captures: { eq_id: $.data.id }
          trigger:
            - call: "POST /equipment/${eq_id}/retire"
              payload: {}
              as: StallOperator
              as_user_id: "${sq_id}"
          assert:
            - "Equipment.${eq_id}.status == RETIRED"
            - "Stall.${sq_id}.equipment_count == 0"

      - name: order_initial_state_ingested
        claim_type: Initial State
        grounds: [state_machines.AggregatorOrder, entities.AggregatorOrder.fields.status]
        distinguishing_aspect: "A freshly ingested order has status==INGESTED, routed_stall_id==null, booking_id==null."
        test_recipe:
          setup: ["Brand BI ONBOARDING with a priced item (gross snapshot)."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "BI", owner_email: "bi@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { bi_id: $.data.id }
            - call: "POST /menu-items"
              payload: { brand_id: "${bi_id}", name: "Soda", price_cents: 300, prep_minutes: 1, required_equipment_type: "PREP_STATION" }
              as: BrandOwner
              as_user_id: "${bi_id}"
              captures: { soda_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { brand_id: "${bi_id}", aggregator: "DOORDASH", external_ref: "DD-I", line_items: [ { menu_item_id: "${soda_id}", qty: 2 } ] }
              as: AggregatorGateway
              captures: { oi_id: $.data.id }
          assert:
            - "AggregatorOrder.${oi_id}.status == INGESTED"
            - "AggregatorOrder.${oi_id}.routed_stall_id == null"
            - "AggregatorOrder.${oi_id}.gross_revenue_cents == 600"

      - name: fulfill_releases_booking_and_credits_ledger
        claim_type: Side Effect Execution
        grounds: [state_machines.AggregatorOrder.PREPARING_to_FULFILLED, calculations.brand_ledger_balance, state_machines.EquipmentBooking.HELD_to_RELEASED]
        distinguishing_aspect: "Fulfilling an order releases its EquipmentBooking (HELD->RELEASED) and credits the brand ledger by net payout."
        test_recipe:
          setup: ["Brand BF ACTIVE+LISTED commission 1500, Wings price 1000 chicken 100g; Stall SF FRYER chicken lot 1000g@4; clock set; order routed+preparing."]
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "SF", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { sf_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "BF", owner_email: "bf@x.com", commission_rate_bps: 1500 }
              as: PlatformOps
              captures: { bf_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${sf_id}", brand_id: "${bf_id}", monthly_fee_cents: 1000, priority_rank: 1 }
              as: PlatformOps
              captures: { lf_id: $.data.id }
            - call: "POST /leases/${lf_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${sf_id}"
            - call: "POST /brands/${bf_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${bf_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${bf_id}", name: "Wings", price_cents: 1000, prep_minutes: 8, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${bf_id}"
              captures: { wf_id: $.data.id }
            - call: "POST /menu-items/${wf_id}/recipe-components"
              payload: { ingredient_name: "chicken", quantity_grams: 100 }
              as: BrandOwner
              as_user_id: "${bf_id}"
            - call: "POST /equipment"
              payload: { stall_id: "${sf_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${sf_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${sf_id}", ingredient_name: "chicken", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 4, grams_received: 1000 }
              as: StallOperator
              as_user_id: "${sf_id}"
