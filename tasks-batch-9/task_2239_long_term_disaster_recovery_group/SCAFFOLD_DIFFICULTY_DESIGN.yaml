            - call: POST /case-presentations
              payload: { case_id: "${c4}", session_id: "${t4}", assessment_id: "${a4}", prepared_by_user_id: "u_cm_1", narrative: "Total loss rebuild, uninsured." }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { p4: "$.data.id", pv4: "$.data.version" }
            - call: POST /case-presentations/{id}/present
              payload: {}
