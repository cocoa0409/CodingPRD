              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-OLDPUMP", oem_code: "WHIRLPOOL", description: "Obsolete drain pump", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200, lifecycle_status: "OBSOLETE" }
              as: PricingAdmin
              captures: { part_obs_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-2005" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_obs_id}", quantity: 1, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_id: $.data.id }
            - call: "GET /substitute-requests?order_line_id=${line_id}"
              payload: {}
              as: WarrantyAdmin
              captures: { sr_id: "$.data[0].id" }
          trigger:
            - call: "POST /substitute-requests/${sr_id}/withdraw"
              payload: { withdrawal_reason: "servicer sourced the part elsewhere" }
              as: Servicer
              as_user_id: "${acct_s_id}"
          assert:
            - "response.status == 200"
            - "SubstituteRequest.${sr_id}.request_status == WITHDRAWN"
            - "SubstituteRequest.${sr_id}.source == CHAIN_TERMINAL_OBSOLETE"
            - "OrderLine.${line_id}.line_status == BACKORDERED"
            - "OrderLine.${line_id}.resolved_part_id == ${part_obs_id}"
            - "OrderLine.${line_id}.supersession_hops == 0"
            - "PartOrder.${order_id}.subtotal_cents == 0"
            - "PartOrder.${order_id}.fulfillment_status == DRAFT"

      - name: warranty_claim_resubmission_cycle_is_bounded
        claim_type: cyclic
        grounds:
          - state_machines.WarrantyClaim.transitions.OEM_INFO_REQUESTED_to_SUBMITTED
          - errors[ERR_RESUBMISSION_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / warranty_claim_info_requested_resubmit_cycle_bounded_at_two
          rationale: "That §1.8 instance walks SUBMITTED -> INFO_REQUESTED -> SUBMITTED twice and asserts the third resubmission is refused, which is exactly this cycle claim."

      - name: part_order_carries_two_independent_state_dimensions
        claim_type: parallel
        grounds:
          - state_machines.PartOrder.initial_state
          - entities.PartOrder.fields.settlement_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / part_order_settlement_and_fulfillment_dimensions_advance_independently
          rationale: "That §1.8 instance drives a PREPAY order to settlement PAID while fulfillment is still DRAFT, asserting the dimensions advance independently."

      - name: allocated_order_is_held_when_its_account_goes_on_credit_hold
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PartOrder.transitions.ALLOCATED_to_HELD
          - state_machines.ServicerAccount.transitions.ACTIVE_to_CREDIT_HOLD
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / allocation_blocked_while_owning_servicer_account_is_on_credit_hold
          rationale: "That §1.8 instance asserts the CREDIT_HOLD gate on allocation together with the released reservations."

      - name: price_file_rollback_reverses_the_publish_cascade
        claim_type: compensation
        grounds:
          - state_machines.PriceFile.transitions.PUBLISHED_to_ROLLED_BACK
          - state_machines.SubstituteRequest.transitions.PENDING_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / catalog_list_price_sum_is_restored_by_a_price_file_rollback
          rationale: "That §1.8 instance asserts the catalog price sum returns to 140999 after rollback, which is the compensation claim for this transition."

