      - name: order_submit_with_zero_lines_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORDER_EMPTY]"]
        distinguishing_aspect: "Order with zero lines submitted by onboarded customer -> ERR_ORDER_EMPTY"
        test_recipe:
          setup: ["onboarded customer, DRAFT order with no lines"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/exemption_reasons"
              payload: { code: "RES", description: "R", tax_engine_code: "R", requires_certificate: true, allowed_form_types: ["RESALE"] }
              as: TenantAdmin
            - call: "POST /tenants/${tid}/customers"
              payload: { external_ref: "C1", legal_name: "C", primary_ship_to_state: "CA", exemption_reason_code: "RES" }
