              payload: { application_id: "${app_y}", fund_type: "MERIT", expected_application_version: "${app_y_v}" }
              as: FinancialAidOfficer
              captures: { amt_y: $.data.amount_cents }
          assert:
            - "Offer for X (score exactly 90.00) amount_cents == 1750000 (0.35 tier, >= boundary inclusive)"
            - "Offer for Y (score 89.99) amount_cents == 1000000 (0.20 tier)"
            - "${amt_x} != ${amt_y} — a 0.01 score difference crosses the tier"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: decision_pending_gated_by_committee_quorum
        grounds:
          - state_machines.Application.COMMITTEE_REVIEW_to_DECISION_PENDING
          - entities.Application.fields.submitted_read_count
          - errors[ERR_REVIEW_QUORUM_NOT_MET]
        distinguishing_aspect: |
          Entity pair Application -> CommitteeReview: the
          COMMITTEE_REVIEW -> DECISION_PENDING transition is gated on the count
          of the application's OWN CommitteeReview children in SUBMITTED
          (>= REVIEW_QUORUM 2). With exactly 1 submitted read the transition
          fails; at exactly 2 it succeeds.
        test_recipe:
          setup:
            - "Cycle OPEN; one application in COMMITTEE_REVIEW with one SUBMITTED read"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "SOC", capacity_seats: 5, target_enrollment: 3, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Q One", email: "q1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 84, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r1_id}/submit", payload: { score_academic: 84, score_fit: 84, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
          trigger:
            - call: "POST /enrollment/applications/${app_id}/transition"
              payload: { to_status: "DECISION_PENDING" }
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r2_id}/submit", payload: { score_academic: 84, score_fit: 84, recommendation: "DENY" }, as: ApplicationReader, as_user_id: "reader-2" }
            - call: "POST /enrollment/applications/${app_id}/transition"
              payload: { to_status: "DECISION_PENDING" }
              as: AdmissionsOfficer
              captures: { status_after: $.data.status }
          assert:
            - "First DECISION_PENDING attempt fails with ERR_REVIEW_QUORUM_NOT_MET (submitted_read_count == 1 < 2)"
            - "After the second read submits: submitted_read_count == 2 and the retry succeeds — Application.status == DECISION_PENDING"

      - name: cycle_release_gated_by_unresolved_applications
        grounds:
          - state_machines.AdmissionCycle.REVIEW_CLOSED_to_DECISIONS_RELEASED
          - errors[ERR_UNRESOLVED_APPLICATIONS]
        distinguishing_aspect: |
          Entity pair AdmissionCycle -> Application (a different pair than
          Application -> CommitteeReview): the cycle may not advance
          REVIEW_CLOSED -> DECISIONS_RELEASED while any of ITS applications
          remains IN_REVIEW/COMMITTEE_REVIEW/DECISION_PENDING; withdrawing the
          blocker unblocks the advance.
        test_recipe:
          setup:
            - "Cycle OPEN -> REVIEW_CLOSED at clock 2026-11-01; one application sitting IN_REVIEW"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "ANT", capacity_seats: 5, target_enrollment: 3, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "U One", email: "u1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 73, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "REVIEW_CLOSED" }, as: EnrollmentManager }
          trigger:
            - call: "POST /enrollment/cycles/${c_id}/advance"
              payload: { to_status: "DECISIONS_RELEASED" }
              as: EnrollmentManager
              captures: { err: $.data.error_id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "WITHDRAWN" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/cycles/${c_id}/advance"
              payload: { to_status: "DECISIONS_RELEASED" }
              as: EnrollmentManager
              captures: { cycle_status: $.data.status }
          assert:
            - "First advance fails with ERR_UNRESOLVED_APPLICATIONS (409) while the application is IN_REVIEW"
            - "After the application is WITHDRAWN, the advance succeeds — cycle status == DECISIONS_RELEASED"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: reviewer_window_half_open_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_REVIEWER_WINDOW_OVERLAP]
          - entities.CommitteeReview.fields.window_start_at
        distinguishing_aspect: |
          Pure half-open interval overlap on the reader resource: windows
          [08-10, 08-20) and [08-20, 08-25) for the same reader_id are ADJACENT
          and accepted; window [08-19, 08-22) overlaps both and is rejected.
          Only ASSIGNED reviews participate.
        test_recipe:
          setup:
            - "Cycle OPEN; three applications app1/app2 in IN_REVIEW (app3 created later)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
