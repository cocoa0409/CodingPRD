    side_effects: ["warehouse_id and agency_id copied from the order; per-class pallet counts summed from the order's lines", "CommodityOrder APPROVED -> SCHEDULED", "increments CommodityOrder.version by 1"]

  - method: GET
    path: "/efap/delivery-appointments"
    description: "Lists appointments, filterable by order, warehouse, agency and status."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: ["order_id?", "warehouse_id?", "agency_id?", "status?", "limit?", "offset?"]
    output: DeliveryAppointment[]
    side_effects: []

  - method: GET
    path: "/efap/delivery-appointments/{appointment_id}"
    description: "Reads one appointment, including its per-class pallet load and delivered_pounds."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: []

  - method: POST
    path: "/efap/delivery-appointments/{appointment_id}/confirm-delivery"
    description: "Confirms delivery at or after the window start, debiting the reserved lots and driving the order, entitlement and cycle cascade."
    roles: [StateWarehouseOperator]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: ["reserved lots: cases_on_hand and cases_committed decreased, cases_shipped_to_date increased, DEPLETED at zero", "cascade: order -> DELIVERED, AgencyAllocation.cases_delivered / cases_remaining / status, AllocationCycle.draw_posture", "Agency.agency_cases_on_hand and delivered_cases_ytd increased", "increments DeliveryAppointment.version by 1"]

  - method: POST
    path: "/efap/delivery-appointments/{appointment_id}/cancel"
    description: "Cancels a SCHEDULED or BLOCKED appointment, releasing the dock window and both pallet ceilings; a SCHEDULED order returns to APPROVED while a HELD order stays HELD."
    roles: [StateAdmin]
    code: 200
    input: [cancel_reason]
    output: DeliveryAppointment
    side_effects: ["CommodityOrder SCHEDULED -> APPROVED (commitments retained)", "increments DeliveryAppointment.version by 1"]

