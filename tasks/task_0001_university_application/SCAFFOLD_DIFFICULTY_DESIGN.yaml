          - entities.School.fields.ea_deadline_iso
          - entities.School.fields.rd_deadline_iso
          - errors[ERR_SCHOOL_DEADLINE_ORDER]
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN, strict ordering. ed_deadline_iso must be
          STRICTLY less than ea_deadline_iso (zero-width touching at the same instant is
          rejected). Resource = School (deadline triplet on the School entity).
        test_recipe:
          setup:
            - "Submit POST /schools with ed_deadline_iso == ea_deadline_iso (zero-width touch)"
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /schools"
              payload: { name: "OVL-1", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-01T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == 'ERR_SCHOOL_DEADLINE_ORDER' (ed and ea touch at the same instant — strict half-open ordering rejects zero-width overlap)"
            - "No School row is created (POST failed before persistence)"

      - name: yield_cooldown_closed_lower_bound_buffer
        grounds:
          - validations[priority=19]
          - entities.AdmissionCycle.fields.cooldown_ms
          - entities.AdmissionCycle.fields.last_yield_run_at
          - errors[ERR_YIELD_COOLDOWN_ACTIVE]
        distinguishing_aspect: |
          Interval semantics = CLOSED LOWER BOUND with a 24h (86_400_000 ms) buffer. A run
          is permitted when server_clock - last_yield_run_at >= cooldown_ms (>=, not >),
          so the boundary instant is ALLOWED; one millisecond earlier is rejected. Resource
          = AdmissionCycle. Different interval geometry (buffer/cooldown vs strict ordering)
          and different entity (AdmissionCycle vs School) from instance 1.
        test_recipe:
          setup:
            - "School with target_class_size=2, cooldown_ms=86_400_000"
            - "Two Applicants — one is ED-admitted and waitlist-promoted via a successful yield run that establishes last_yield_run_at"
