  - rule_id: compensating_invariant
    instances:
    - name: finalize_then_void_conserves_open_action_count_and_standing
      grounds:
      - state_machines.AuditVisit.SUBMITTED_to_FINALIZED
      - state_machines.AuditVisit.FINALIZED_to_VOIDED
      - state_machines.CorrectiveAction.ASSIGNED_to_VOIDED
      - entities.Location.fields.open_corrective_action_count
      - calculations.location_standing_score
      - entities.Auditor.fields.finalized_visit_count
      distinguishing_aspect: |
        Conserved quantities: Location.open_corrective_action_count (which must always equal the number
        of CorrectiveActions of that location in a non-terminal status) and Auditor.finalized_visit_count
        (which must always equal the number of FINALIZED visits). Finalize creates three actions and one
        finalized visit; the compensating void must retire exactly those three and give back exactly one,
        returning standing_score to its 0.00 no-visits value. An implementation that decrements blindly,
        or that forgets the counter while cascading the rows, drifts.
      test_recipe:
        setup:
        - Brand SKWR, PUBLISHED rubric, CERTIFIED auditor Dana Reyes, no health inspection on file
        - Visit V1 SUBMITTED with FS-1 27/30 (CRITICAL violation), BS-1 12/15 and FC-1 10/12 (STANDARD violations), FS-2 20/20, BS-2 15/15, FC-2 8/8
        - Before the trigger the location has open_corrective_action_count 0, standing_score 0.00, latest_grade null, and the auditor has finalized_visit_count 0
        - Logical clock at 2026-08-05T13:00:00Z
