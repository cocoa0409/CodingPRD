        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[coverage-line-add-stale-policy]", "errors[ERR_STALE_POLICY_VERSION]"]
        distinguishing_aspect: "Two sequential coverage-line adds: the first bumps Policy.version; the second still carrying the pre-first version (expressed as ${v1}-1) is rejected ERR_STALE_POLICY_VERSION (412)."
        test_recipe:
          setup: ["A QUOTED policy at version v0; one coverage line added (version advances to v1)."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "occ1@x.com", full_name: "OCC One", mailing_address: "31 St" }
              as: Underwriter
              captures: { ph: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph}", insured_address: "62 St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000 }
              as: Underwriter
              captures: { pol: $.data.id, v0: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${v0}" }
              as: Underwriter
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${v1} - 1" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_POLICY_VERSION"

      - name: occ_correct_version_on_scheduled_item_add_succeeds_then_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[scheduled-item-add-stale-policy]", entities.Policy.fields.version]
        distinguishing_aspect: "A scheduled-item add carrying the policy's current version succeeds (201) and increments Policy.version by exactly 1 (the happy path of the scheduled-item OCC rule)."
        test_recipe:
          setup: ["A QUOTED policy at a known version v0 with no scheduled items yet."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "occ2@x.com", full_name: "OCC Two", mailing_address: "31b St" }
              as: Underwriter
              captures: { ph: $.data.id }
