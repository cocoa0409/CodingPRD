# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3471_free_admission_museum_complex_visitor_flow_collection
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Claims already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Clock default 2026-09-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: museum_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Museum
          - endpoints.POST_/campus/museums
        distinguishing_aspect: "A museum created with the six required inputs returns 201 with closed_dates == [], version == 1, and server-minted id/created_at/updated_at; quota fields round-trip verbatim."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campus/museums"
              payload: { museum_code: "NMAAHC", display_name: "National Museum of African American History and Culture", requires_timed_pass: true, quarter_hour_pass_quota: 4, daily_pass_quota: 40, screening_rate_per_quarter_hour: 8 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
          assert:
            - "response status 201 and response_type object"
            - "Museum.${mus_id}.closed_dates == [] and version == 1"
            - "Museum.${mus_id}.quarter_hour_pass_quota == 4 and daily_pass_quota == 40 and screening_rate_per_quarter_hour == 8"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: member_expires_on_computed_and_lapse_boundary
        claim_type: Computed Fields
        grounds:
          - entities.Member.fields.expires_on
          - entities.Member.fields.member_status
          - calculations.member_status_calc
        distinguishing_aspect: "expires_on is computed as join date plus term months (never client-supplied); member_status is ACTIVE on expires_on itself and LAPSED one day later — the boundary is inclusive."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/members"
              payload: { full_name: "Charter Member", email: "charter@example.org", membership_term_months: 12 }
              as: Public
              as_user_id: "signup-1"
              captures: { mem_id: $.data.id }
          trigger:
            - call: "GET /campus/members/${mem_id}"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { exp_on: $.data.expires_on, status_join: $.data.member_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /campus/members/${mem_id}"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { status_on_expiry: $.data.member_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /campus/members/${mem_id}"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { status_after: $.data.member_status }
          assert:
            - "exp_on == \"2027-09-01\" (2026-09-01 + 12 calendar months)"
            - "status_join == ACTIVE and status_on_expiry == ACTIVE (inclusive boundary)"
            - "status_after == LAPSED"

      - name: ticket_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/campus/tickets/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Reading a ticket id that does not exist returns 404 ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /campus/tickets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: VisitorServices
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 with error_id == ERR_NOT_FOUND"
            - "response_type == error and data.message is present"

      - name: school_reservation_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/campus/school-reservations
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required headcount field fails fast with 400 ERR_INVALID_REQUEST before any capacity or docent evaluation runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One museum with one SCHEDULED program (MON, capacity 30, ratio 10, max 40, BASIC)."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/museums"
              payload: { museum_code: "NMAH", display_name: "American History", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Tour", gallery_code: "G2", day_of_week: "MON", start_minute: 600, end_minute: 660, student_capacity: 30, docent_ratio: 10, max_group_size: 40, required_docent_certification: "BASIC" }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /campus/school-reservations"
              payload: { museum_id: "${mus_id}", program_id: "${prog_id}", school_name: "No Count School", visit_date: "2026-09-07" }
              as: Public
              as_user_id: "teacher-x"
              captures: { err: $.data.error_id }
            - call: "GET /campus/school-reservations"
              payload: { program_id: "${prog_id}" }
              as: ProgramCoordinator
          assert:
            - "response status 400 with error_id == ERR_INVALID_REQUEST (headcount missing)"
            - "the follow-up GET /campus/school-reservations?program_id=... returns total_count 0 (no row created)"

      - name: clock_default_is_startup_default
        claim_type: Defaults
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - entities.Member.fields.expires_on
        distinguishing_aspect: "With no set_current_utc call at all, the logical clock reads the startup default 2026-09-01T00:00:00Z — a member created with term 1 expires 2026-10-01, proving the default (not wall-clock) drove the computation."
        test_recipe:
          setup:
            - "Empty database; the logical clock has never been set this run."
          setup_api_calls:
            - call: "POST /campus/members"
              payload: { full_name: "Default Clock Member", email: "default@example.org", membership_term_months: 1 }
              as: Public
              as_user_id: "signup-2"
              captures: { mem_id: $.data.id, exp_on: $.data.expires_on }
          trigger:
            - call: "GET /campus/members/${mem_id}"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "exp_on == \"2026-10-01\" (default clock 2026-09-01 + 1 month)"
            - "Member.${mem_id}.member_status == ACTIVE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pass_cancel_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.TimedEntryPass.RESERVED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is terminal for the pass: a second cancel of the same pass fails ERR_INVALID_STATE and the first cancellation's quota release is not double-applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Timed museum (quotas 5/20, rate 4); one RESERVED pass for 2026-09-20 slot 2 created by 'visitor-d'."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/museums"
              payload: { museum_code: "NMNH", display_name: "Natural History", requires_timed_pass: true, quarter_hour_pass_quota: 5, daily_pass_quota: 20, screening_rate_per_quarter_hour: 4 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Day Tripper", visit_date: "2026-09-20", entry_quarter_hour: 2 }
              as: Public
              as_user_id: "visitor-d"
              captures: { pass_id: $.data.id }
            - call: "POST /campus/timed-entry-passes/${pass_id}/cancel"
              payload: {}
              as: Public
              as_user_id: "visitor-d"
          trigger:
            - call: "POST /campus/timed-entry-passes/${pass_id}/cancel"
              payload: {}
              as: Public
              as_user_id: "visitor-d"
              captures: { err: $.data.error_id }
          assert:
            - "second cancel is rejected with error_id == ERR_INVALID_STATE (http 409)"
            - "TimedEntryPass.${pass_id}.status remains CANCELLED and version increments only once across the two calls"

      - name: review_terminal_states_lock_down
        claim_type: terminal_lockdown
        grounds:
          - state_machines.CollectionReview.SUBMITTED_to_REJECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A REJECTED review is locked: both submit and decide against it fail ERR_INVALID_STATE, and its version stops advancing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. TRUST fund; ACQUISITION review (est 1000) submitted by 'cur-5' and REJECTED by 'chair-5'."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-RJ", fund_type: "TRUST", appropriation_cents: 1000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/collection-reviews"
              payload: { review_kind: "ACQUISITION", fund_id: "${fund_id}", proposed_object_title: "Daguerreotype Camera", estimated_cost_cents: 1000 }
              as: Curator
              as_user_id: "cur-5"
              captures: { rev_id: $.data.id }
            - call: "POST /campus/collection-reviews/${rev_id}/submit"
              payload: {}
              as: Curator
              as_user_id: "cur-5"
              captures: { rev_v: $.data.version }
            - call: "POST /campus/collection-reviews/${rev_id}/decide"
              payload: { outcome: "REJECTED", expected_review_version: "${rev_v}" }
              as: CommitteeChair
              as_user_id: "chair-5"
              captures: { rev_v_final: $.data.version }
          trigger:
            - call: "POST /campus/collection-reviews/${rev_id}/submit"
              payload: {}
              as: Curator
              as_user_id: "cur-5"
              captures: { err1: $.data.error_id }
            - call: "POST /campus/collection-reviews/${rev_id}/decide"
              payload: { outcome: "APPROVED", expected_review_version: "${rev_v_final}" }
              as: CommitteeChair
              as_user_id: "chair-5"
              captures: { err2: $.data.error_id }
          assert:
            - "re-submit of a REJECTED review fails with err1 == ERR_INVALID_STATE"
            - "re-decide of a REJECTED review fails with err2 == ERR_INVALID_STATE"
            - "CollectionReview.${rev_id}.status remains REJECTED"

      - name: program_cancel_conditional_cascade_and_terminal
        claim_type: conditional_cascade
        grounds:
          - state_machines.EducationProgram.SCHEDULED_to_CANCELLED
          - state_machines.DocentAssignment.ASSIGNED_to_RELEASED
          - state_machines.SchoolGroupReservation.WAITLISTED_to_CANCELLED
          - errors[ERR_PROGRAM_NOT_SCHEDULED]
        distinguishing_aspect: "Program cancel cancels CONFIRMED/WAITLISTED reservations and releases only ASSIGNED docent assignments — the CONFIRMED assignment is deliberately untouched; afterwards, new reservations against the CANCELLED program fail ERR_PROGRAM_NOT_SCHEDULED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Museum; program MON 600-660 gallery G3 capacity 30 ratio 5 max 40 BASIC."
            - "Two BASIC docents assigned for 2026-10-05; only docent 1 confirmed (so a headcount-10 group needing ceil(10/5)=2 docents lands WAITLISTED)."
            - "One WAITLISTED reservation for 2026-10-05."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/museums"
              payload: { museum_code: "NASM", display_name: "Air and Space", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Rockets Lab", gallery_code: "G3", day_of_week: "MON", start_minute: 600, end_minute: 660, student_capacity: 30, docent_ratio: 5, max_group_size: 40, required_docent_certification: "BASIC" }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /campus/docents"
              payload: { full_name: "Docent A", certification_level: "BASIC" }
              as: ProgramCoordinator
              captures: { doc_a: $.data.id }
            - call: "POST /campus/docents"
              payload: { full_name: "Docent B", certification_level: "BASIC" }
              as: ProgramCoordinator
              captures: { doc_b: $.data.id }
            - call: "POST /campus/education-programs/${prog_id}/docent-assignments"
              payload: { docent_id: "${doc_a}", service_date: "2026-10-05" }
              as: ProgramCoordinator
              captures: { asg_a: $.data.id }
            - call: "POST /campus/education-programs/${prog_id}/docent-assignments"
              payload: { docent_id: "${doc_b}", service_date: "2026-10-05" }
              as: ProgramCoordinator
              captures: { asg_b: $.data.id }
            - call: "POST /campus/docent-assignments/${asg_a}/confirm"
              payload: {}
              as: Docent
              as_user_id: "${doc_a}"
            - call: "POST /campus/school-reservations"
              payload: { museum_id: "${mus_id}", program_id: "${prog_id}", school_name: "Rockets School", headcount: 10, visit_date: "2026-10-05" }
              as: Public
              as_user_id: "teacher-r"
              captures: { res_id: $.data.id, res_status: $.data.status }
          trigger:
            - call: "POST /campus/education-programs/${prog_id}/cancel"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /campus/school-reservations"
              payload: { museum_id: "${mus_id}", program_id: "${prog_id}", school_name: "Late School", headcount: 5, visit_date: "2026-10-12" }
              as: Public
              as_user_id: "teacher-l"
              captures: { err: $.data.error_id }
          assert:
            - "res_status == WAITLISTED at creation (1 confirmed docent < 2 required)"
            - "after program cancel: EducationProgram.${prog_id}.status == CANCELLED"
            - "DocentAssignment.${asg_a}.status remains CONFIRMED (conditional cascade skips CONFIRMED)"
            - "DocentAssignment.${asg_b}.status == RELEASED"
            - "SchoolGroupReservation.${res_id}.status == CANCELLED"
            - "reservation against the cancelled program fails with err == ERR_PROGRAM_NOT_SCHEDULED"

      - name: condition_report_supersede_on_refiling
        claim_type: side_effect_execution
        grounds:
          - state_machines.ConditionReport.DISPUTED_to_SUPERSEDED
          - state_machines.ConditionReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: "Filing a fresh OUTBOUND report for the same loan supersedes the prior DISPUTED one (SUPERSEDED is written by the create, not by a decide), and only the new SUBMITTED report can then be decided."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Object; loan AGREED (declared 50000000, INSURANCE, no courier, [2026-10-01, 2026-12-01)). OUTBOUND report r1 filed and DISPUTED."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0010", title: "Apollo Suit Glove", declared_value_cents: 50000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Kennedy Space Center", loan_start_date: "2026-10-01", loan_end_date: "2026-12-01", declared_value_cents: 50000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/accept"
              payload: { expected_loan_version: "${loan_v}" }
              as: BorrowerRep
            - call: "POST /campus/loan-agreements/${loan_id}/condition-reports"
              payload: { report_kind: "OUTBOUND", condition_summary: "Possible seam wear.", damage_noted: true }
              as: BorrowerRep
              captures: { r1: $.data.id }
            - call: "POST /campus/condition-reports/${r1}/decide"
              payload: { outcome: "DISPUTED" }
              as: LoansOfficer
          trigger:
            - call: "POST /campus/loan-agreements/${loan_id}/condition-reports"
              payload: { report_kind: "OUTBOUND", condition_summary: "Re-inspection: seam intact.", damage_noted: false }
              as: LoansOfficer
              captures: { r2: $.data.id }
            - call: "POST /campus/condition-reports/${r1}/decide"
              payload: { outcome: "ACCEPTED" }
              as: LoansOfficer
              captures: { err_r1: $.data.error_id }
            - call: "POST /campus/condition-reports/${r2}/decide"
              payload: { outcome: "ACCEPTED" }
              as: LoansOfficer
          assert:
            - "ConditionReport.${r1}.status == SUPERSEDED immediately after r2's creation (no decide involved)"
            - "deciding superseded r1 fails with err_r1 == ERR_INVALID_STATE"
            - "ConditionReport.${r2}.status == ACCEPTED after its decide"

      - name: object_under_conservation_blocks_loans_until_released
        claim_type: guarded_transition
        grounds:
          - state_machines.CollectionObject.OUT_ON_LOAN_to_UNDER_CONSERVATION
          - state_machines.CollectionObject.UNDER_CONSERVATION_to_IN_COLLECTION
          - errors[ERR_OBJECT_NOT_IN_COLLECTION]
        distinguishing_aspect: "A RETURN report accepted with damage_noted true routes the object to UNDER_CONSERVATION (not IN_COLLECTION); loan creation is blocked there and unblocked only by release-conservation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Object with a full loan cycle: AGREED -> OUTBOUND accepted -> ACTIVE."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0011", title: "Greensboro Lunch Counter Stool", declared_value_cents: 50000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "DuSable Museum", loan_start_date: "2026-10-01", loan_end_date: "2026-12-01", declared_value_cents: 50000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/accept"
              payload: { expected_loan_version: "${loan_v}" }
              as: BorrowerRep
            - call: "POST /campus/loan-agreements/${loan_id}/condition-reports"
              payload: { report_kind: "OUTBOUND", condition_summary: "Good.", damage_noted: false }
              as: LoansOfficer
              captures: { cr_out: $.data.id }
            - call: "POST /campus/condition-reports/${cr_out}/decide"
              payload: { outcome: "ACCEPTED" }
              as: LoansOfficer
            - call: "POST /campus/loan-agreements/${loan_id}/activate"
              payload: {}
              as: LoansOfficer
            - call: "POST /campus/loan-agreements/${loan_id}/condition-reports"
              payload: { report_kind: "RETURN", condition_summary: "New scratch on base.", damage_noted: true }
              as: BorrowerRep
              captures: { cr_ret: $.data.id }
            - call: "POST /campus/condition-reports/${cr_ret}/decide"
              payload: { outcome: "ACCEPTED" }
              as: LoansOfficer
            - call: "POST /campus/loan-agreements/${loan_id}/close"
              payload: {}
              as: LoansOfficer
          trigger:
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Another Museum", loan_start_date: "2027-01-05", loan_end_date: "2027-03-01", declared_value_cents: 50000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { err: $.data.error_id }
            - call: "POST /campus/collection-objects/${obj_id}/release-conservation"
              payload: {}
              as: Registrar
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Another Museum", loan_start_date: "2027-01-05", loan_end_date: "2027-03-01", declared_value_cents: 50000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan2: $.data.id }
          assert:
            - "after close with damage_noted true: CollectionObject.${obj_id}.status == UNDER_CONSERVATION"
            - "loan create while UNDER_CONSERVATION fails with err == ERR_OBJECT_NOT_IN_COLLECTION"
            - "after release-conservation the object is IN_COLLECTION and the retried create returns 201 with LoanAgreement.${loan2}.status == PROPOSED"

      - name: exhibition_close_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.SpecialExhibition.ON_SALE_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Only ON_SALE exhibitions can close; closing a DRAFT exhibition fails ERR_INVALID_STATE and no ticket cascade runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. TRUST fund; museum; exhibition still DRAFT."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-DR", fund_type: "TRUST", appropriation_cents: 1000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/museums"
              payload: { museum_code: "NPG", display_name: "Portrait Gallery", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/exhibitions"
              payload: { title: "Draft Show", fee_cents: 500, daily_ticket_quota: 10, member_presale_opens_at: "2026-09-05T00:00:00Z", public_sale_opens_at: "2026-09-10T00:00:00Z", revenue_fund_id: "${fund_id}" }
              as: ExhibitionManager
              captures: { exh_id: $.data.id }
          trigger:
            - call: "POST /campus/exhibitions/${exh_id}/close"
              payload: {}
              as: ExhibitionManager
              captures: { err: $.data.error_id }
          assert:
            - "close of a DRAFT exhibition fails with err == ERR_INVALID_STATE"
            - "SpecialExhibition.${exh_id}.status remains DRAFT and FundAccount.${fund_id}.receipts_cents == 0"
  # ===========================================================================
  - section: calculations
    instances:
      - name: member_discount_rounding_half_up
        claim_type: precision
        grounds:
          - calculations.member_unit_price_cents
        distinguishing_aspect: "Member price is round_half_up(fee * 0.80) per ticket: fee 2499 yields 1999 (not 2000) and a non-member pays the full 2499 — the rounding constant and its direction are observable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z (public window open)."
            - "TRUST fund; museum; exhibition fee 2499, quota 10, ON_SALE; one ACTIVE member (term 12, joined 2026-09-01)."
          setup_api_calls:
            - *c_clock
