          - calculations.governing_influent_profile_selection
          - entities.Project.fields.governing_influent_profile_id
        distinguishing_aspect: |
          The REJECT branch of qa-decision runs the audit side effects but deliberately skips the
          governing-profile re-derivation: qa_status becomes REJECTED with qa_decided_by_user_id
          qa-1 and version 2, while Project.governing_influent_profile_id stays null and the project
