            - "BallotLot.${lot1} is untouched: custody_state ISSUED, precinct_id ${pr}, issued_quantity 3000 - hop 3 was driven by the unit, which distinguishes this cascade from the contest-withdrawal cascade that drives the same field from the lot side."

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pp_session_state_beats_window_temporal
        grounds:
          - validations.la-session-state-permits-operation
          - validations.session-started-inside-window
          - state_machines.LATestSession
          - endpoints["POST /la-test-sessions/{id}/start"]
        distinguishing_aspect: |
          Two rules of DIFFERENT priority are violated by one call: la-session-state-permits-operation
          (category state, priority 70) and session-started-inside-window (category business_temporal,
          priority 100). The scaffold's ladder says the lower number wins, so the response must be
          ERR_SESSION_STATE_INVALID (409) and never ERR_OUTSIDE_TEST_WINDOW - and the control call in
          the same recipe, where only the temporal rule is violated, returns ERR_OUTSIDE_TEST_WINDOW,
          which proves the first result was priority ordering rather than the temporal rule simply
          not firing.
        test_recipe:
          setup:
            - "An election in STYLES_LOCKED with locked style S-100, precinct P-001, lot L-001 issued to P-001."
            - "TAB-001 programmed by user-tech-1, deck DECK-A built, session SESS-1 scheduled 2026-09-01T14:00Z to 18:00Z with two observers, already STARTED at 2026-09-01T14:00:00Z by user-tech-2 (so SESS-1 is IN_PROGRESS)."
            - "A second unit TAB-002 programmed by user-tech-1, deck DECK-C, and session SESS-C scheduled 2026-09-04T14:00Z to 18:00Z with two observers, still SCHEDULED."
