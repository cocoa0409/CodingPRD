              captures: { err_sup: $.data.error_id }
            - call: "POST /body-art/sterilization-records"
              payload: { establishment_id: "${est_a_id}", device_serial: "AC-20", cycle_completed_at: "2026-06-01T00:00:00Z", spore_test_result: "PASS" }
