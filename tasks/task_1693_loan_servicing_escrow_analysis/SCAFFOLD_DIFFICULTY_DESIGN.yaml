# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Loan Servicing Escrow Analysis — 9 rules x 2 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: analysis_projection_prospective_vs_ledger_actual
        grounds:
          - calculations.trial_balance_projection
          - entities.EscrowAnalysisCycle.fields.method
          - entities.EscrowAnalysisCycle.fields.start_balance_cents
        distinguishing_aspect: |
          Same account, same ledger, same projection window: PROSPECTIVE opens from the posted
          balance_cents (84000, includes a forward-effective deposit) while LEDGER_ACTUAL replays
          only entries with effective_date < projection_start_date (60000) — the two variants of
          one calculation on the escrow-analysis entity domain yield different shortage_cents
          (36000 vs 60000).
        test_recipe:
          setup:
            - "Payee verified; loan LN-DV-1 ACTIVE with escrow account ACTIVE"
            - "Line items: PROPERTY_TAX 240000/yr in 2 installments first due 2026-12-15; HAZARD_INSURANCE 120000/yr in 1 installment first due 2027-03-01"
            - "Deposits: 60000 effective 2026-08-10 (posted); 24000 effective 2026-09-20 (forward-effective, posted before compute)"
            - "Account balance_cents == 84000 at compute time"
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-DV-1", borrower_name: "Dana Voss", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "HAZARD_INSURANCE", expected_annual_amount_cents: 120000, installments_per_year: 1, first_due_date: "2027-03-01" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/deposits", payload: { amount_cents: 60000, effective_date: "2026-08-10" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/deposits", payload: { amount_cents: 24000, effective_date: "2026-09-20" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "GET /servicing/escrow-accounts/${acct_id}", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_v: $.data.version } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2027, projection_start_date: "2026-09-01", method: "PROSPECTIVE", expected_escrow_account_version: "${acct_v}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { ana1_id: $.data.id } }
            - { call: "POST /servicing/analyses/${ana1_id}/compute", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/analyses/${ana1_id}/void", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "GET /servicing/escrow-accounts/${acct_id}", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_v2: $.data.version } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2027, projection_start_date: "2026-09-01", method: "LEDGER_ACTUAL", expected_escrow_account_version: "${acct_v2}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { ana2_id: $.data.id } }
          trigger:
            - { call: "POST /servicing/analyses/${ana2_id}/compute", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
          assert:
            - "EscrowAnalysisCycle.${ana1_id}.start_balance_cents == 84000"
            - "EscrowAnalysisCycle.${ana1_id}.lowest_projected_balance_cents == 24000"
            - "EscrowAnalysisCycle.${ana1_id}.shortage_cents == 36000"
            - "EscrowAnalysisCycle.${ana1_id}.projected_annual_disbursements_cents == 360000"
            - "EscrowAnalysisCycle.${ana2_id}.start_balance_cents == 60000"
            - "EscrowAnalysisCycle.${ana2_id}.lowest_projected_balance_cents == 0"
            - "EscrowAnalysisCycle.${ana2_id}.shortage_cents == 60000"
            - "EscrowAnalysisCycle.${ana1_id}.shortage_cents != EscrowAnalysisCycle.${ana2_id}.shortage_cents"

      - name: tax_penalty_simple_vs_compound_accrual
        grounds:
          - calculations.tax_penalty_accrual
          - entities.TaxMonitoringRecord.fields.penalty_method
          - entities.TaxMonitoringRecord.fields.accrued_penalty_cents
        distinguishing_aspect: |
          Two tax records with identical amount_due_cents (300000), due_date (2026-08-01), grace (0)
          and rate (150 bps) accrue to different penalties at the same sweep date: SIMPLE multiplies
          once (13500) while COMPOUND rounds per month inside the loop (13704) — a dual-variant
          calculation on the TaxMonitoringRecord domain, distinct from the escrow-analysis domain.
        test_recipe:
          setup:
            - "Loan LN-PEN-1 ACTIVE, escrow_required = false (no escrow account needed)"
            - "Tax record R1: parcel P-1 year 2026 seq 1, due 2026-08-01, grace 0, 150 bps, SIMPLE"
            - "Tax record R2: identical amounts/dates, seq 2, COMPOUND"
          setup_api_calls:
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-PEN-1", borrower_name: "Penny Lope", principal_balance_cents: 25000000, monthly_pi_cents: 150000, closing_date: "2026-07-01", escrow_required: false }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/loans/${loan_id}/tax-monitoring-records", payload: { parcel_number: "P-1", tax_year: 2026, installment_sequence: 1, amount_due_cents: 300000, due_date: "2026-08-01", grace_period_days: 0, monthly_penalty_rate_bps: 150, penalty_method: "SIMPLE" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { r1_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/tax-monitoring-records", payload: { parcel_number: "P-1", tax_year: 2026, installment_sequence: 2, amount_due_cents: 300000, due_date: "2026-08-01", grace_period_days: 0, monthly_penalty_rate_bps: 150, penalty_method: "COMPOUND" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { r2_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
          assert:
            - "TaxMonitoringRecord.${r1_id}.status == PENALTY_ACCRUING"
            - "TaxMonitoringRecord.${r1_id}.accrued_penalty_cents == 13500"
            - "TaxMonitoringRecord.${r2_id}.status == PENALTY_ACCRUING"
            - "TaxMonitoringRecord.${r2_id}.accrued_penalty_cents == 13704"
            - "TaxMonitoringRecord.${r1_id}.accrued_penalty_cents != TaxMonitoringRecord.${r2_id}.accrued_penalty_cents"

  - rule_id: combinatorial_formula
    instances:
      - name: monthly_payment_per_line_rounding_order
        grounds:
          - calculations.monthly_escrow_payment
          - calculations.initial_cushion_and_payment
          - entities.EscrowAnalysisCycle.fields.base_monthly_escrow_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-item-then-sum. Three line items
          of 100001 cents/yr produce base 24999 (3 x 8333); the forbidden sum-then-round order would
          give 25000. Same pinned order applies at account activation and at analysis compute.
        test_recipe:
          setup:
            - "Payee verified; loan LN-RND-1 ACTIVE with escrow account"
            - "Three line items (PROPERTY_TAX, HAZARD_INSURANCE, FLOOD_INSURANCE), each 100001 cents/yr, 1 installment, first due 2027-01-15"
            - "Analysis 2027 with projection_start 2026-09-01, PROSPECTIVE"
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "INSURANCE_CARRIER", legal_name: "RoundTrip Mutual", remit_to_address: "9 Actuary Way", ach_routing_mask: "****9876" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-RND-1", borrower_name: "Rhea Nunn", principal_balance_cents: 20000000, monthly_pi_cents: 120000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 100001, installments_per_year: 1, first_due_date: "2027-01-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "HAZARD_INSURANCE", expected_annual_amount_cents: 100001, installments_per_year: 1, first_due_date: "2027-01-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "FLOOD_INSURANCE", expected_annual_amount_cents: 100001, installments_per_year: 1, first_due_date: "2027-01-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { act_monthly: $.data.monthly_escrow_cents } }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "GET /servicing/escrow-accounts/${acct_id}", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_v: $.data.version } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2027, projection_start_date: "2026-09-01", method: "PROSPECTIVE", expected_escrow_account_version: "${acct_v}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { ana_id: $.data.id } }
          trigger:
            - { call: "POST /servicing/analyses/${ana_id}/compute", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
          assert:
            - "EscrowAnalysisCycle.${ana_id}.base_monthly_escrow_cents == 24999"
            - "EscrowAnalysisCycle.${ana_id}.base_monthly_escrow_cents != 25000"
            - "EscrowAnalysisCycle.${ana_id}.cushion_target_cents == 50001"
            - "EscrowAccount.${acct_id}.monthly_escrow_cents == 24999 (same pinned order at activation)"

      - name: shortage_projection_pinned_evaluation_order
        grounds:
          - calculations.trial_balance_projection
          - calculations.shortage_deficiency_surplus
          - calculations.monthly_escrow_payment
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the new payment depends on the shortage, the shortage
          depends on the projection lowest point, and the projection would change if the new payment
          were fed back in. The pinned order (project ALL 12 months with the OLD payment 30000, then
          derive) yields lowest 0 / shortage 60000 / new payment 35000; the forbidden feedback order
          would yield lowest 50000 / shortage 10000.
        test_recipe:
          setup:
            - "Payee verified; loan LN-CIRC-1 ACTIVE with escrow account ACTIVE; monthly_escrow_cents 30000"
            - "Line items: PROPERTY_TAX 240000/yr x2 installments first due 2026-12-15; HAZARD_INSURANCE 120000/yr x1 first due 2027-03-01"
            - "Deposit 60000 effective 2026-08-10; analysis 2027 projection_start 2026-09-01 PROSPECTIVE"
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-CIRC-1", borrower_name: "Cy Rcle", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "HAZARD_INSURANCE", expected_annual_amount_cents: 120000, installments_per_year: 1, first_due_date: "2027-03-01" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/deposits", payload: { amount_cents: 60000, effective_date: "2026-08-10" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "GET /servicing/escrow-accounts/${acct_id}", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_v: $.data.version } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2027, projection_start_date: "2026-09-01", method: "PROSPECTIVE", expected_escrow_account_version: "${acct_v}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { ana_id: $.data.id } }
          trigger:
            - { call: "POST /servicing/analyses/${ana_id}/compute", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
          assert:
            - "EscrowAnalysisCycle.${ana_id}.projected_annual_disbursements_cents == 360000"
            - "EscrowAnalysisCycle.${ana_id}.cushion_target_cents == 60000"
            - "EscrowAnalysisCycle.${ana_id}.lowest_projected_balance_cents == 0"
            - "EscrowAnalysisCycle.${ana_id}.shortage_cents == 60000"
            - "EscrowAnalysisCycle.${ana_id}.deficiency_cents == 0"
            - "EscrowAnalysisCycle.${ana_id}.spread_monthly_cents == 5000"
            - "EscrowAnalysisCycle.${ana_id}.spread_first_month_cents == 5000"
            - "EscrowAnalysisCycle.${ana_id}.new_monthly_escrow_cents == 35000"

  - rule_id: non_linear_state_machine
    instances:
      - name: escrow_account_parallel_status_dimensions
        grounds:
          - state_machines.EscrowAccount
          - state_machines.EscrowAccount.hold_status.NONE_to_COMPLIANCE_HOLD
          - entities.EscrowAccount.fields.account_status
          - entities.EscrowAccount.fields.hold_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: account_status (ACTIVE->SUSPENDED->ACTIVE) moves
          while hold_status stays COMPLIANCE_HOLD, and the hold alone gates disbursement release with
          ERR_ACCOUNT_ON_HOLD even though the disbursement itself is SCHEDULED and the account ACTIVE.
        test_recipe:
          setup:
            - "Payee verified; loan LN-PAR-1 ACTIVE; escrow account ACTIVE; balance 100000"
            - "Disbursement 30000 scheduled (release date 2026-08-10) by dp_1"
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-PAR-1", borrower_name: "Pam Allel", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { li_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/deposits", payload: { amount_cents: 100000, effective_date: "2026-08-05" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/disbursements", payload: { line_item_id: "${li_id}", payee_id: "${pay_id}", amount_cents: 30000, due_date: "2026-08-20", scheduled_release_date: "2026-08-10" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { disb_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/hold", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/suspend", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/reinstate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
            - { call: "POST /servicing/disbursements/${disb_id}/release", payload: {}, as: DisbursementProcessor, as_user_id: "dp_2", captures: { err: $.data.error_id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/release-hold", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/disbursements/${disb_id}/release", payload: {}, as: DisbursementProcessor, as_user_id: "dp_2" }
          assert:
            - "First release attempt: err == ERR_ACCOUNT_ON_HOLD"
            - "Disbursement.${disb_id}.status == SCHEDULED after the rejected release (hold does not block the row itself)"
            - "EscrowAccount.${acct_id}.account_status == ACTIVE and hold_status == COMPLIANCE_HOLD after suspend+reinstate under hold (dimensions independent)"
            - "Second release succeeds: Disbursement.${disb_id}.status == RELEASED"
            - "EscrowAccount.${acct_id}.balance_cents == 70000"

      - name: insurance_policy_lapse_reinstatement_cycle
        grounds:
          - state_machines.InsurancePolicy
          - entities.InsurancePolicy.fields.status
        distinguishing_aspect: |
          Cyclic shape: ACTIVE -> LAPSED -> NOTICE_1_SENT -> NOTICE_2_SENT -> ACTIVE (reinstate) is
          traversable repeatedly — the policy lapses a SECOND time after reinstatement when the new
          coverage expires. Distinct non-linear shape (cycle) on a different entity than the
          EscrowAccount parallel dimensions.
        test_recipe:
          setup:
            - "Loan LN-CYC-1 ACTIVE (escrow_required false)"
            - "Policy POL-1 HAZARD coverage [2026-01-01, 2027-01-01), premium 120000, ACTIVE"
          setup_api_calls:
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-CYC-1", borrower_name: "Cy Clist", principal_balance_cents: 22000000, monthly_pi_cents: 140000, closing_date: "2026-01-01", escrow_required: false }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/loans/${loan_id}/insurance-policies", payload: { policy_type: "HAZARD", carrier_name: "Carrier A", policy_number: "POL-1", coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", annual_premium_cents: 120000 }, as: InsuranceSpecialist, as_user_id: "is_1", captures: { pol_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-02T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/insurance-policies/${pol_id}/send-first-notice", payload: {}, as: InsuranceSpecialist, as_user_id: "is_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-05T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/insurance-policies/${pol_id}/send-reminder-notice", payload: {}, as: InsuranceSpecialist, as_user_id: "is_1" }
          trigger:
            - { call: "POST /servicing/insurance-policies/${pol_id}/reinstate", payload: { new_coverage_start_date: "2027-02-05", new_coverage_end_date: "2028-02-05", new_annual_premium_cents: 126000 }, as: Borrower, as_user_id: "${loan_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-02-06T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
          assert:
            - "After reinstate: InsurancePolicy.${pol_id}.status == ACTIVE (cycle closes to the initial state)"
