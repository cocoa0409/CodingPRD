              captures: { o4_after: $.data.installation_readiness }
          assert:
            - "both start-analysis calls set structural_verdict, but the value is irrelevant: both determinations return determined_cause == INSTALLATION_DEFECT because branch 3b keys on failure_mode == ANCHOR_PULLOUT alone"
