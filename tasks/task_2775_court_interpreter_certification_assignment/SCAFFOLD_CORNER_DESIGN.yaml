        distinguishing_aspect: "The busy set is filtered to service_status {PROPOSED, CONFIRMED, CHECKED_IN}: a DECLINED assignment overlapping the new window does not block it, while the PROPOSED one created immediately afterwards does — same interpreter, same courthouse, overlapping windows, opposite outcomes."
