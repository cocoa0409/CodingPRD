              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_STATE_TRANSITION'  # agreement is DRAFT, blocks go_live"

      - name: exception_decide_requires_pending_and_decider_not_raiser
        grounds:
          - state_machines.ExceptionItem.PENDING_to_DECIDED
          - state_machines.RemittanceItem
        distinguishing_aspect: |
          Pair = (ExceptionItem, RemittanceItem) AND (ExceptionItem, X-User-ID).
          ExceptionItem.decide requires the parent RemittanceItem to be in
          ON_EXCEPTION (cross-entity state) AND requires decider != the
          LockboxOperator who raised the exception (segregation). Distinct entity
          pair from (LockboxSite, ServiceAgreement) above.
