      - name: nlsm_campaign_parallel_delivery_billing_dimensions
        grounds:
          - state_machines.Campaign.SCHEDULED_to_DELIVERING
          - state_machines.Campaign.UNBILLED_to_ACCRUING
          - state_machines.Campaign.ACCRUING_to_PENDING_INVOICE
          - state_machines.Campaign.PENDING_INVOICE_to_INVOICED
          - state_machines.Campaign.INVOICED_to_DISPUTED
          - state_machines.Campaign.DISPUTED_to_INVOICED
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_ISSUED
          - state_machines.MeasurementDispute.SUBMITTED_to_WITHDRAWN
          - entities.Campaign.fields.delivery_status
          - entities.Campaign.fields.billing_status
          - entities.Campaign.fields.offsite_variance_pct
          - calculations.offsite_spend_reconciliation
          - calculations.invoice_settlement_waterfall
          - calculations.budget_plan_available
          - validations[priority=79]
          - concurrency_rules[dispute-create-stale-invoice]
        distinguishing_aspect: |
          Campaign carries TWO independent state dimensions on one row — delivery_status and billing_status — and this recipe drives billing all the way around the cycle UNBILLED -> ACCRUING -> PENDING_INVOICE -> INVOICED -> DISPUTED -> INVOICED while delivery_status never leaves DELIVERING, because ACCRUING -> PENDING_INVOICE is reached through the offsite-reconciliation trigger rather than through completion and /_ops/run-daily-checkpoint is never called; an implementation that treats the two dimensions as one linear lifecycle would have to move delivery_status to COMPLETED to bill the campaign.
        test_recipe:
          setup:
            - "Advertiser PARCO is ACTIVE and MANAGED with managed_service_fee_pct == 0.05."
            - "One ACTIVE BudgetPlan for 2026-Q3 (committed_total_cents 40000000, trade_fund_share_cents 0) and one OPEN TradeFundAccount for 2026-Q3 with accrued_cents == 0."
            - "One ONSITE_ONLY campaign with flight [2026-08-01T00:00:00Z, 2026-08-11T00:00:00Z) is activated to delivery_status == DELIVERING, which drives billing_status UNBILLED -> ACCRUING."
            - "Its single SERVING CPC line item wins one auction on an ONSITE slot with floor_cpc_cents == 1250 and records one CLICK, so the auction settles at 1250."
            - "The clock is advanced to 2026-09-01T00:00:00Z but POST /_ops/run-daily-checkpoint is NEVER called and POST /rmn/campaigns/{id}/complete is NEVER called, so delivery_status remains DELIVERING even though clock_now is past flight_end_at."
            - "A DRAFT Invoice for billing_period_code 2026-08 exists, referencing the same budget plan and the 2026-Q3 trade fund account."
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Parallel Co Retail Media LLC", brand_code: "PARCO", service_model: "MANAGED", credit_limit_cents: 100000000, account_manager_user_id: "am-7", managed_service_fee_pct: 0.05 }
              as: NetworkAdmin
              as_user_id: "adm-1"
              captures: { adv_id: $.data.id }
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 3 }
              as: AccountManager
              as_user_id: "am-7"
            - call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE", decision_note: "KYC cleared" }
              as: CreditAnalyst
              as_user_id: "ca-3"
              captures: { adv_v_active: $.data.version }
