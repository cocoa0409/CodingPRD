            - call: "GET /lab-results/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ComplianceOfficer
              captures: { e_lab_result: "$.data.error_id" }
            - call: "GET /compliance-determinations/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ComplianceOfficer
              captures: { e_determination: "$.data.error_id" }
            - call: "GET /public-notifications/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ComplianceOfficer
              captures: { e_notification: "$.data.error_id" }
            - call: "GET /treatment-evaluations/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ComplianceOfficer
              captures: { e_evaluation: "$.data.error_id" }
            - call: "GET /pilot-tests/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ComplianceOfficer
              captures: { e_pilot: "$.data.error_id" }
            - call: "GET /residuals-manifests/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ComplianceOfficer
              captures: { e_manifest: "$.data.error_id" }
            - call: "GET /capital-projects/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: ComplianceOfficer
              captures: { e_project: "$.data.error_id" }
            - call: "GET /funding-applications/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: ComplianceOfficer
              captures: { e_application: "$.data.error_id" }
            - call: "GET /cost-recovery-claims/00000000-0000-4000-8000-000000000013"
              payload: {}
              as: ComplianceOfficer
              captures: { e_claim: "$.data.error_id" }
          assert:
            - "All thirteen reads return HTTP 404"
            - "error_id values are, in order, ERR_CONTAMINANT_NOT_FOUND, ERR_LABORATORY_NOT_FOUND, ERR_ENTRY_POINT_NOT_FOUND, ERR_SAMPLE_NOT_FOUND, ERR_LAB_RESULT_NOT_FOUND, ERR_DETERMINATION_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND, ERR_EVALUATION_NOT_FOUND, ERR_PILOT_NOT_FOUND, ERR_MANIFEST_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_CLAIM_NOT_FOUND"
            - "No two of the thirteen responses carry the same error_id"
            - "Each response body carries a non-empty message field"

      - name: re_registering_a_code_certification_id_or_label_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_CONTAMINANT_CODE]
          - errors[ERR_DUPLICATE_CERTIFICATION_ID]
          - errors[ERR_DUPLICATE_ENTRY_POINT_LABEL]
          - validations[priority=103]
          - validations[priority=104]
          - validations[priority=105]
        distinguishing_aspect: "Three independent uniqueness registers are probed in one pass with values that differ from the incumbent in every field except the unique one, so an implementation that keys uniqueness on the whole row instead of the single declared column admits all three."
        test_recipe:
          setup:
            - "Contaminant PFOA, laboratory certification CERT-001 and entry point label EPTDS-01 are already registered."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
          trigger:
