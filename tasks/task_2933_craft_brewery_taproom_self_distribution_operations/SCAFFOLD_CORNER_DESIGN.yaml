              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-9", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
