          trigger:
            - call: "GET /op/stores"
              payload: { limit: 10, offset: 0 }
              as: Anonymous
              captures: { eid: $.data.error_id }
          assert:
            - "the response status is 401 and ${eid} == \"ERR_UNAUTHENTICATED\""
            - "the response is not 403, so the priority-1 auth rule fired first"
            - "no store data is returned in the error envelope"

