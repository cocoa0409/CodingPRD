  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 instances, different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_pay_blocked_by_open_case
        grounds:
          - state_machines.Claim.transitions.PENDING_to_PAID
        distinguishing_aspect: |
          Pair (Claim → SIUCase): Claim.pay precondition checks SIUCase has no
          non-terminal case for this claim. A claim in PENDING with a linked
          non-terminal SIUCase is blocked from pay.
        test_recipe:
          setup:
            - "Claim C in UNDER_SIU_REVIEW (case K accepted but not closed)"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 5000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["UNWITNESSED_LOSS"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r: $.data.id }
            - call: "POST /siu/referrals/${r}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r}/accept"
              payload: {}
