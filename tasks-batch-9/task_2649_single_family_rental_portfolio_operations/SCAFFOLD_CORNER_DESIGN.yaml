          setup:
            - "Market ATL and PIPELINE Home H1 exist with a CRITICAL HOA obligation OB whose resolution has already been submitted by co-1, so posture is FROZEN."
            - "Prospects P1 (verified income 560000, credit B, fraud 1093) and P4 (verified income 800000, credit A, fraud 360) each hold a SUBMITTED application on H1."
