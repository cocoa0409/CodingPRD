          - rbac.UnderwritingManager.exclusive_operations
          - validations[priority=20]
        distinguishing_aspect: "Quote/bind/activate are Underwriter-exclusive and cancel is UnderwritingManager-exclusive, so an UnderwritingManager quoting and an Underwriter cancelling both return 403 ERR_ROLE_NOT_PERMITTED on the very same policy - there is no hierarchical override in either direction."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One T2_URBAN policy 2026-08-01..2027-08-01, minimum premium 100000, no items (so the written premium is the 100000 floor throughout)."
            - "HEADER MANIPULATION: trigger[0] must be issued with X-User-Role: UnderwritingManager, trigger[4] with X-User-Role: Underwriter, trigger[5] with X-User-Role: ClaimsAdjuster."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Split Authority Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
          trigger:
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/cancel"
              payload: { cancellation_reason: "INSURED_REQUEST", cancel_effective_date: "2026-11-01" }
              as: UnderwritingManager
            - call: "POST /inland-marine/policies/${pol}/cancel"
              payload: { cancellation_reason: "INSURED_REQUEST", cancel_effective_date: "2026-11-01" }
              as: UnderwritingManager
            - call: "POST /inland-marine/policies/${pol}/cancel"
              payload: { cancellation_reason: "INSURED_REQUEST", cancel_effective_date: "2026-11-01" }
              as: UnderwritingManager
              as_user_id: "mgr-1"
          assert:
            - "trigger[0] (X-User-Role UnderwritingManager) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED; Policy.${pol}.status is still DRAFT"
            - "trigger[1] HTTP status == 200; status DRAFT -> QUOTED, written_premium_cents == 100000, minimum_premium_applied via policy_written_premium"
            - "trigger[2] HTTP status == 200; status == BOUND, premium_balance_cents == 100000"
            - "trigger[3] HTTP status == 200; status == IN_FORCE"
            - "trigger[4] (X-User-Role Underwriter) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED; status is still IN_FORCE and no CANCELLATION_RETURN entry exists"
            - "trigger[5] (X-User-Role ClaimsAdjuster) HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED"
            - "trigger[6] (UnderwritingManager mgr-1) HTTP status == 200; status == CANCELLED and CoveragePart.${cp}.status == VOID"
            - "after trigger[6]: exactly one CANCELLATION_RETURN row exists with amount_cents == -67316 (pro-rata unearned 74795 on 273 of 365 remaining days, short-rated at 9000 bp for INSURED_REQUEST), and Policy.${pol}.premium_balance_cents == 32684 == 100000 - 67316"
            - "the manager can cancel but never quote, and the underwriter can quote but never cancel: neither role subsumes the other"

      - name: corner_claim_settlement_segregation_of_duties
