            - { call: "GET /charter/trip-requests/${trip_fk}/passengers", payload: {}, as: OpsAdmin }
          assert:
            - "total_count == 2 and the returned ids are exactly {${pax_fk1}, ${pax_fk2}}"
            - "Both rows have tsa_status == PENDING (initial state)"

      - name: response_envelope_object_shape
        claim_type: retrieval
        grounds: [response_envelope]
        distinguishing_aspect: "Single-object GET carries meta.api_request_id, response_type == 'object', and data holding the entity."
        test_recipe:
          setup: ["one trip"]
          setup_api_calls:
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust EV", customer_email: "ev@x.com", requested_category: "TURBOPROP", origin_icao: "KLAX", destination_icao: "KLAS", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_ev: $.data.id } }
          trigger:
            - { call: "GET /charter/trip-requests/${trip_ev}", payload: {}, as: OpsAdmin }
          assert:
            - "meta.api_request_id is a non-empty string and meta.api_request_timestamp is ISO8601"
            - "response_type == 'object' and data.id == ${trip_ev}"

      - name: quote_leg_delete_non_draft_rejected
        claim_type: conditional_action
        grounds: [entities.QuoteLeg, "errors[ERR_TRIP_NOT_QUOTE_DRAFT]"]
        distinguishing_aspect: "DELETE leg also enforces the QUOTE_DRAFT gate; deleting from a QUOTED trip fails."
        test_recipe:
          setup: ["trip leg REV 60 QUOTED"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust QD", customer_email: "qd@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_qd: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_qd}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent, captures: { leg_qd: $.data.id } }
            - { call: "POST /charter/trip-requests/${trip_qd}/quote", payload: {}, as: SalesAgent }
          trigger:
            - { call: "DELETE /charter/quote-legs/${leg_qd}", payload: {}, as: SalesAgent, captures: { err_qd: $.data.error_id } }
          assert: ["HTTP 409 with error_id == ERR_TRIP_NOT_QUOTE_DRAFT"]

      - name: assignment_create_supersedes_prior_tentative
        claim_type: conditional_action
        grounds: ["concurrency_rules[assignment-create-stale-trip-version]", state_machines.AircraftAssignment]
        distinguishing_aspect: "Creating a new assignment on a trip with an existing TENTATIVE assignment releases the prior one (compose-check of the supersede rule with a fresh version)."
        test_recipe:
          setup: ["owner + two aircraft; trip leg REV 60 BOOKED 67500; first assignment TENTATIVE"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner SP", contact_email: "sp@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_sp: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_sp}", tail_number: "N700SP", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_sp1: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_sp}", tail_number: "N701SP", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_sp2: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust SP", customer_email: "sp2@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_sp: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_sp}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_sp}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_sp}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_sp_v1: $.data.version } }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_sp}", aircraft_id: "${ac_sp1}", expected_trip_request_version: "${trip_sp_v1}" }, as: DispatchManager, captures: { asg_sp1: $.data.id } }
            - { call: "GET /charter/trip-requests/${trip_sp}", payload: {}, as: DispatchManager, captures: { trip_sp_v2: $.data.version } }
          trigger:
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_sp}", aircraft_id: "${ac_sp2}", expected_trip_request_version: "${trip_sp_v2}" }, as: DispatchManager, captures: { asg_sp2: $.data.id } }
            - { call: "GET /charter/aircraft-assignments/${asg_sp1}", payload: {}, as: DispatchManager, captures: { asg_sp1_st: $.data.status } }
          assert:
            - "Second create returns 201 with status TENTATIVE"
            - "First assignment ${asg_sp1}.status == RELEASED (superseded)"

  # ============================================================ errors
  - section: errors
    instances:
      - name: weather_cancel_without_advisory_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ACTIVE_WEATHER_ADVISORY]", calculations.cancellation_refund]
        distinguishing_aspect: "WEATHER cancel without any covering advisory on origin/destination at departure_at is rejected; no refund is created."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; trip dep 2026-08-04T00:00:00Z, leg REV 480, QUOTED 2052000, BOOKED 513000; no advisories exist"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust WN", customer_email: "wn@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-04T00:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_wn: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_wn}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 480, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_wn}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_wn}/book", payload: { deposit_cents: 513000 }, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_wn}/cancel", payload: { reason: "WEATHER" }, as: SalesAgent, captures: { err_wn: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_NO_ACTIVE_WEATHER_ADVISORY"
            - "TripRequest.${trip_wn}.status remains BOOKED and no REFUND payment exists"

      - name: duplicate_permit_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_PERMIT]", entities.OverflightPermit]
        distinguishing_aspect: "Second permit with same trip+country_code+permit_type while the first is REQUESTED is rejected; the duplicate set excludes EXPIRED/DENIED rows."
        test_recipe:
          setup: ["trip QUOTED international; permit MX/LANDING already REQUESTED"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust DU", customer_email: "du@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "MMCZ", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: true }, as: SalesAgent, captures: { trip_du: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_du}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "MMCZ", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_du}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/overflight-permits", payload: { trip_request_id: "${trip_du}", country_code: "MX", permit_type: "LANDING", required: true }, as: SalesAgent }
          trigger:
            - { call: "POST /charter/overflight-permits", payload: { trip_request_id: "${trip_du}", country_code: "MX", permit_type: "LANDING", required: true }, as: SalesAgent, captures: { err_du: $.data.error_id } }
          assert: ["HTTP 422 with error_id == ERR_DUPLICATE_PERMIT"]

