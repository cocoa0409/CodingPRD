          setup:
            - "Contract C1 ACTIVE with block B-12 enrolled; plan P1 APPROVED; crew CR1 ACTIVE with HARVEST capability."
            - "B-12 carries a CLUSTER_COUNT estimate -> governing_estimate_tons 91.47, so the HARVEST_TOLERANCE ceiling never binds here."
            - "WineryDeliveryWindow DW2 [2026-09-15T06:00:00Z, 2026-09-15T18:00:00Z] with capacity_tons 18.00, committed_tons 0.00, window_posture OPEN."
