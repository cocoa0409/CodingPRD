# =============================================================================
# SCAFFOLD_CORNER_DESIGN — GC Bid Management & Prequalification (§1.9)
# Breadth coverage: every §1.1-§1.7 testable claim not already probed by §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: bid_package_creation_defaults_and_pagination
        claim_type: defaults
        grounds: [entities.BidPackage.fields.bid_bond_required_pct, entities.BidPackage.fields.status, "endpoints[GET /bid-packages]"]
        distinguishing_aspect: "Omitting bid_bond_required_pct applies the 0.05 default; new package starts DRAFT with zero counters; list endpoint honors limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /bid-packages"
              payload: { name: "Pkg One", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg1: $.data.id }
            - call: "POST /bid-packages"
              payload: { name: "Pkg Two", trade_code: "033000", bid_due_at: "2026-08-12T14:00:00Z", bid_bond_required_pct: 0.10 }
              as: LeadEstimator
              captures: { pkg2: $.data.id }
          trigger:
            - call: "GET /bid-packages"
              payload: { limit: 1, offset: 0 }
              as: LeadEstimator
          assert:
            - "BidPackage.${pkg1}.bid_bond_required_pct == 0.05 (default applied), status == DRAFT, issued_addendum_count == 0, submitted_bid_count == 0"
            - "BidPackage.${pkg2}.bid_bond_required_pct == 0.10 (explicit input honored)"
            - "List response: 1 row, total_count == 2, has_more == true"

      - name: resource_not_found_family_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_BID_PACKAGE_NOT_FOUND]", "errors[ERR_SUBCONTRACTOR_NOT_FOUND]", "errors[ERR_PREQUAL_APPLICATION_NOT_FOUND]", "errors[ERR_INVITATION_NOT_FOUND]", "errors[ERR_ADDENDUM_NOT_FOUND]", "errors[ERR_BID_NOT_FOUND]", "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "Each top-level collection's single-resource GET with a non-existent UUID returns 404 with that resource's domain error id; leveling adjustments and award recommendations share ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /bid-packages/00000000-0000-0000-0000-0000000000aa"
              as: LeadEstimator
              captures: { e1: $.data.error_id }
            - call: "GET /subcontractors/00000000-0000-0000-0000-0000000000aa"
              as: LeadEstimator
              captures: { e2: $.data.error_id }
            - call: "GET /prequal-applications/00000000-0000-0000-0000-0000000000aa"
              as: LeadEstimator
              captures: { e3: $.data.error_id }
            - call: "GET /invitations/00000000-0000-0000-0000-0000000000aa"
              as: LeadEstimator
              captures: { e4: $.data.error_id }
            - call: "GET /addendums/00000000-0000-0000-0000-0000000000aa"
              as: LeadEstimator
              captures: { e5: $.data.error_id }
            - call: "GET /bids/00000000-0000-0000-0000-0000000000aa"
              as: LeadEstimator
              captures: { e6: $.data.error_id }
            - call: "GET /award-recommendations/00000000-0000-0000-0000-0000000000aa"
              as: LeadEstimator
              captures: { e7: $.data.error_id }
          assert:
            - "e1 == ERR_BID_PACKAGE_NOT_FOUND (404)"
            - "e2 == ERR_SUBCONTRACTOR_NOT_FOUND (404)"
            - "e3 == ERR_PREQUAL_APPLICATION_NOT_FOUND (404)"
            - "e4 == ERR_INVITATION_NOT_FOUND (404)"
            - "e5 == ERR_ADDENDUM_NOT_FOUND (404)"
            - "e6 == ERR_BID_NOT_FOUND (404)"
            - "e7 == ERR_RESOURCE_NOT_FOUND (404)"

      - name: subcontractor_required_fields_and_duplicate_license
        claim_type: required_fields
        grounds: [entities.Subcontractor.fields.license_number, "errors[ERR_INVALID_REQUEST]", "errors[ERR_DUPLICATE_LICENSE_NUMBER]"]
        distinguishing_aspect: "Registration without license_number fails schema validation (400); a second registration reusing the same license_number fails uniqueness (409)."
        test_recipe:
          setup: ["One subcontractor registered with license LIC-D-001"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "First LLC", contact_email: "f@x.com", license_number: "LIC-D-001" }
              as: Anonymous
              captures: { sub_1: $.data.id }
          trigger:
            - call: "POST /subcontractors"
              payload: { legal_name: "No License LLC", contact_email: "nl@x.com" }
              as: Anonymous
              captures: { e_missing: $.data.error_id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Copycat LLC", contact_email: "cc@x.com", license_number: "LIC-D-001" }
              as: Anonymous
              captures: { e_dup: $.data.error_id }
          assert:
            - "Missing license_number: HTTP 400, e_missing == ERR_INVALID_REQUEST"
            - "Duplicate license_number: HTTP 409, e_dup == ERR_DUPLICATE_LICENSE_NUMBER"

      - name: enum_and_readonly_and_exactly_one_payload_rejection
        claim_type: type_constraints
        grounds: ["validations[priority=10]", entities.LevelingAdjustment.fields.resolved_amount_cents]
        distinguishing_aspect: "Invalid enum (intent MAYBE) -> 400; computed field resolved_amount_cents supplied by client -> 400; both amount_cents and pct_of_base supplied -> 400 (exactly-one-of rule)."
        test_recipe:
          setup:
            - "Sub prequalified + invited (SENT); package PUBLISHED; bid SUBMITTED; package then BIDDING_CLOSED (so leveling state gate passes and schema errors surface)"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Enum LLC", contact_email: "e@x.com", license_number: "LIC-E-001" }
              as: Anonymous
              captures: { sub_e: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_e}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_e}"
              captures: { app_e: $.data.id }
            - call: "POST /prequal-applications/${app_e}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Enum Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_e}" }
              as: LeadEstimator
              captures: { inv_e: $.data.id }
            - call: "POST /invitations/${inv_e}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_e}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_e}"
              captures: { bid_e: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/close-bidding"
              as: LeadEstimator
          trigger:
            - call: "POST /invitations/${inv_e}/respond"
              payload: { intent: "MAYBE" }
              as: Subcontractor
              as_user_id: "${sub_e}"
              captures: { e_enum: $.data.error_id }
            - call: "POST /leveling-adjustments"
              payload: { bid_id: "${bid_e}", description: "client smuggles computed field", treatment: "GC_ALLOWANCE", amount_cents: 1000, resolved_amount_cents: 1 }
              as: LeadEstimator
              captures: { e_ro: $.data.error_id }
            - call: "POST /leveling-adjustments"
              payload: { bid_id: "${bid_e}", description: "both amount kinds", treatment: "GC_ALLOWANCE", amount_cents: 1000, pct_of_base: 0.05 }
              as: LeadEstimator
              captures: { e_both: $.data.error_id }
          assert:
            - "e_enum == ERR_INVALID_REQUEST (400; intent must be BIDDING | DECLINED)"
            - "e_ro == ERR_INVALID_REQUEST (400; resolved_amount_cents is computed and rejected on input)"
            - "e_both == ERR_INVALID_REQUEST (400; exactly one of amount_cents / pct_of_base)"

      - name: fk_body_reference_integrity
        claim_type: parent_relationships
        grounds: ["validations[priority=3]", entities.Invitation.fields.bid_package_id, entities.Bid.fields.bid_package_id, entities.AwardRecommendation.fields.bid_package_id]
        distinguishing_aspect: "Body-carried foreign keys are validated for existence in input order: invitation to a ghost package -> ERR_BID_PACKAGE_NOT_FOUND; invitation of a ghost subcontractor -> ERR_SUBCONTRACTOR_NOT_FOUND; bid to a ghost package -> ERR_BID_PACKAGE_NOT_FOUND; recommendation naming a ghost package -> ERR_BID_PACKAGE_NOT_FOUND."
        test_recipe:
          setup: ["One real subcontractor; one real package (for version capture)"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "FK LLC", contact_email: "fk@x.com", license_number: "LIC-F-001" }
              as: Anonymous
              captures: { sub_f: $.data.id }
            - call: "POST /bid-packages"
              payload: { name: "Real Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id, pkg_v: $.data.version }
          trigger:
            - call: "POST /invitations"
              payload: { bid_package_id: "00000000-0000-0000-0000-0000000000aa", subcontractor_id: "${sub_f}" }
              as: LeadEstimator
              captures: { e1: $.data.error_id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "00000000-0000-0000-0000-0000000000bb" }
              as: LeadEstimator
              captures: { e2: $.data.error_id }
            - call: "POST /bids"
              payload: { bid_package_id: "00000000-0000-0000-0000-0000000000aa", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_f}"
              captures: { e3: $.data.error_id }
            - call: "POST /award-recommendations"
              payload: { bid_package_id: "00000000-0000-0000-0000-0000000000aa", recommended_bid_id: "00000000-0000-0000-0000-0000000000cc", rationale: "ghost", expected_bid_package_version: "${pkg_v}" }
              as: LeadEstimator
              captures: { e4: $.data.error_id }
          assert:
            - "e1 == ERR_BID_PACKAGE_NOT_FOUND (404; body FK validated before uniqueness)"
            - "e2 == ERR_SUBCONTRACTOR_NOT_FOUND (404)"
            - "e3 == ERR_BID_PACKAGE_NOT_FOUND (404; existence precedes prequal/bond checks)"
            - "e4 == ERR_BID_PACKAGE_NOT_FOUND (404; existence precedes OCC version evaluation)"

      - name: bid_revision_immutability_shape
        claim_type: immutability
        grounds: [entities.BidRevision]
        distinguishing_aspect: "BidRevision (common_fields: false) rows carry id and created_at but no updated_at/version; the initial submission is sequence 1 with is_last_minute false when far from the deadline."
        test_recipe:
          setup: ["Package PUBLISHED due 2026-08-10T14:00:00Z; sub prequalified + BIDDING; one bid submitted at default clock (9+ days before due)"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Immutable LLC", contact_email: "im@x.com", license_number: "LIC-I-001" }
              as: Anonymous
              captures: { sub_i: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_i}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_i}"
              captures: { app_i: $.data.id }
            - call: "POST /prequal-applications/${app_i}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Immutable Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_i}" }
              as: LeadEstimator
              captures: { inv_i: $.data.id }
            - call: "POST /invitations/${inv_i}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_i}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_i}"
              captures: { bid_i: $.data.id }
          trigger:
            - call: "GET /bids/${bid_i}/revisions"
              as: LeadEstimator
          assert:
            - "Exactly 1 row: sequence == 1, amount_cents == 1000000, is_last_minute == false, note == null"
            - "Row exposes id and created_at; it carries no updated_at and no version fields (append-only audit shape)"

  - section: state_machines
    instances:
      - name: invitation_initial_state_and_repeat_bidding_rejected
        claim_type: initial_state
        grounds: [state_machines.Invitation, "errors[ERR_INVITATION_INVALID_STATE]"]
        distinguishing_aspect: "New invitations start SENT; after BIDDING, a second respond with intent=BIDDING matches no transition and is rejected."
        test_recipe:
          setup: ["Package DRAFT; sub invited"]
          setup_api_calls:
            - call: "POST /bid-packages"
              payload: { name: "Invite Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Invited LLC", contact_email: "in@x.com", license_number: "LIC-I-002" }
              as: Anonymous
              captures: { sub_i: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_i}" }
              as: LeadEstimator
              captures: { inv_i: $.data.id, inv_status: $.data.status }
          trigger:
            - call: "POST /invitations/${inv_i}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_i}"
            - call: "POST /invitations/${inv_i}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_i}"
              captures: { err: $.data.error_id }
          assert:
            - "inv_status == SENT at creation (initial state)"
            - "First respond: 200, status BIDDING, responded_at set"
            - "Second respond BIDDING: HTTP 409, err == ERR_INVITATION_INVALID_STATE (no BIDDING->BIDDING transition)"

      - name: invitation_decline_waives_acks_reconsider_recreates
        claim_type: side_effect_execution
        grounds: [state_machines.Invitation.BIDDING_to_DECLINED, state_machines.Invitation.DECLINED_to_BIDDING, state_machines.AddendumAcknowledgment.PENDING_to_WAIVED]
        distinguishing_aspect: "Cyclic invitation machine with audit-preserving side effects: decline waives the PENDING acknowledgment; reconsider while PUBLISHED creates a fresh PENDING row while the WAIVED row is retained."
        test_recipe:
          setup: ["Package PUBLISHED; sub BIDDING; Addendum 1 issued (one PENDING acknowledgment exists for the sub)"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Waffle LLC", contact_email: "w@x.com", license_number: "LIC-W-002" }
              as: Anonymous
              captures: { sub_w: $.data.id }
            - call: "POST /bid-packages"
              payload: { name: "Waffle Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_w}" }
              as: LeadEstimator
              captures: { inv_w: $.data.id }
            - call: "POST /invitations/${inv_w}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_w}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /addendums"
              payload: { bid_package_id: "${pkg}", summary: "Addendum 1" }
              as: LeadEstimator
              captures: { add1: $.data.id }
          trigger:
            - call: "POST /invitations/${inv_w}/respond"
              payload: { intent: "DECLINED" }
              as: Subcontractor
              as_user_id: "${sub_w}"
            - call: "POST /invitations/${inv_w}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_w}"
          assert:
            - "After DECLINED: GET /addendums/${add1}/acknowledgments shows 1 row, status WAIVED, waived_reason == 'bidder declined'"
            - "After reconsider BIDDING: 2 rows — the retained WAIVED row plus a new PENDING row"
            - "Invitation.${inv_w}.status == BIDDING (cycle completed)"

      - name: invitation_reconsider_when_closed_returns_409
        claim_type: precondition_enforcement
        grounds: [state_machines.Invitation.DECLINED_to_BIDDING, "errors[ERR_PACKAGE_NOT_ACCEPTING_BIDS]"]
        distinguishing_aspect: "The DECLINED -> BIDDING reconsider is gated on the package being PUBLISHED; after close-bidding it fails with ERR_PACKAGE_NOT_ACCEPTING_BIDS."
        test_recipe:
          setup: ["Package PUBLISHED then BIDDING_CLOSED; invitation DECLINED"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Late LLC", contact_email: "l@x.com", license_number: "LIC-L-002" }
              as: Anonymous
              captures: { sub_l: $.data.id }
            - call: "POST /bid-packages"
              payload: { name: "Closed Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_l}" }
              as: LeadEstimator
              captures: { inv_l: $.data.id }
            - call: "POST /invitations/${inv_l}/respond"
              payload: { intent: "DECLINED" }
              as: Subcontractor
              as_user_id: "${sub_l}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/close-bidding"
              as: LeadEstimator
          trigger:
            - call: "POST /invitations/${inv_l}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_l}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, err == ERR_PACKAGE_NOT_ACCEPTING_BIDS; Invitation.${inv_l}.status remains DECLINED"

      - name: awarded_package_terminal_lockdown_and_feedback_resend
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BidPackage, state_machines.BidderFeedback, "errors[ERR_PACKAGE_INVALID_STATE]", "errors[ERR_INVALID_RESOURCE_STATE]", "errors[ERR_LEVELING_LOCKED]"]
        distinguishing_aspect: "From terminal AWARDED no package transitions are possible (publish -> 409); leveling stays locked; a SENT feedback cannot be re-sent."
        test_recipe:
          setup:
            - "Full pipeline: package AWARDED with loser bid X (feedback DRAFT exists) and winner bid Y"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "X Lock LLC", contact_email: "xl@x.com", license_number: "LIC-X-2001" }
              as: Anonymous
              captures: { sub_x: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Y Lock LLC", contact_email: "yl@x.com", license_number: "LIC-Y-2001" }
              as: Anonymous
              captures: { sub_y: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_x}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_x}"
              captures: { app_x: $.data.id }
            - call: "POST /prequal-applications/${app_x}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_y}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_y}"
              captures: { app_y: $.data.id }
            - call: "POST /prequal-applications/${app_y}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Lock Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_x}" }
              as: LeadEstimator
              captures: { inv_x: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_y}" }
              as: LeadEstimator
              captures: { inv_y: $.data.id }
            - call: "POST /invitations/${inv_x}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_x}"
            - call: "POST /invitations/${inv_y}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_y}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_x}"
              captures: { bid_x: $.data.id }
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1100000, bond_amount_cents: 55000 }
              as: Subcontractor
              as_user_id: "${sub_y}"
              captures: { bid_y: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/close-bidding"
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/tabulate"
              as: LeadEstimator
            - call: "GET /bid-packages/${pkg}"
              as: LeadEstimator
              captures: { pkg_v: $.data.version }
            - call: "POST /award-recommendations"
              payload: { bid_package_id: "${pkg}", recommended_bid_id: "${bid_y}", rationale: "low", expected_bid_package_version: "${pkg_v}" }
              as: LeadEstimator
              as_user_id: "le-100"
              captures: { rec: $.data.id }
            - call: "POST /award-recommendations/${rec}/submit"
              as: LeadEstimator
              as_user_id: "le-100"
            - call: "POST /award-recommendations/${rec}/decide"
              payload: { decision: "APPROVED" }
              as: ChiefEstimator
              as_user_id: "ce-900"
