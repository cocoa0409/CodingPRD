          assert:
            - "the compensating row exists rather than an edit: ReserveTransaction.${txn_rev}.origin == REVERSAL, signed_amount_cents == 10000000, reverses_transaction_id == ${txn_wd}"
            - "the original row is untouched: ReserveTransaction.${txn_wd}.signed_amount_cents == -10000000 still"
            - "INVARIANT — ReserveFund.${fund}.balance_cents == 71958137 == 50000000 + (21958137 - 10000000 + 10000000), exactly the pre-withdrawal balance"
