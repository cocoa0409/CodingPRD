# =============================================================================
# task_0437_pallet_pooling — SCAFFOLD (§1.0–§1.7)
# Pallet Pooling & Returnable Asset (CHEP style)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  437. Pallet Pooling & Returnable Asset (CHEP style): asset issuance & transfer
  (chain of custody), per-location balance/equity, hire/rental & daily charge,
  loss & audit reconciliation, exchange vs voucher, collection & repair, demand
  forecasting, invoice/credit

domain_name: pallet-pooling

api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation        # finite asset pool tracked as per-location balance + equity obligation
  secondary_archetype: ledger_reconciliation # hire charge: forward-looking accrual vs chronological event-replay actual
  complexity_layers:
    - optimistic_concurrency        # OCC on Location.version (hire open / voucher redeem supersede equity)
    - cascading_side_effects        # audit finalize -> asset LOST -> equity debit -> invoice loss line
    - dual_variant_calculation      # provisional accrual vs finalized hire charge; replacement-cost vs net-book-value loss
    - derived_field_reconciliation  # Location physical_balance / equity_balance recomputed from movements + hires + losses

  entity_topology: flat             # peer entities linked by FK; no deep URL nesting
  state_machine_shape: parallel     # Hire carries (lifecycle_status x settlement_status); Asset condition is cyclic
  relationship_patterns:
    - one_to_many                   # Account -> Location, Account -> Hire, Invoice -> InvoiceLine
    - many_to_many                  # HireAsset junction (Hire <-> Asset), TransferOrder lines (Asset set)
    - cross_aggregate               # Hire references Location + AssetType; Voucher references two Accounts
  role_model: peer_roles            # PoolOperator vs Participant own different resource types; PoolAdmin override
  consistency_model: immediate      # all balance/equity/charge mutations atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ----- Configuration -------------------------------------------------------
  - name: PoolPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Pooling program name (e.g., 'CHEP Blue B1208A')" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO currency code for all monetary fields" }
      - { name: equity_warn_threshold, type: integer, source: input, default: 200, description: "Per-location net equity owed at or above which the location is flagged SHORT in equity_status" }
      - { name: voucher_expiry_days, type: integer, source: input, default: 90, description: "Days from voucher issue (logical clock) after which an OUTSTANDING voucher auto-expires on audit finalize sweep" }
      - { name: audit_min_interval_days, type: integer, source: input, default: 28, description: "Minimum days between the end of one finalized audit window and the start of the next for the same Location (closed-interval adjacency buffer)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED; only one ACTIVE PoolPolicy may exist", constraints: "ACTIVE, RETIRED" }

  - name: AssetType
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique asset type code (e.g., 'PALLET_STD'); unique across all AssetType rows regardless of status" }
      - { name: name, type: string, source: input, description: "Human label" }
      - { name: base_daily_rate_cents, type: integer, source: input, description: "Base per-asset per-day hire rate before tiered volume discount", constraints: ">= 0" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Full replacement cost charged on declared loss (replacement-cost loss basis)", constraints: ">= 0" }
      - { name: useful_life_days, type: integer, source: input, default: 1825, description: "Straight-line depreciation horizon used by the net-book-value loss basis", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DISCONTINUED; DISCONTINUED blocks new Asset creation", constraints: "ACTIVE, DISCONTINUED" }

  # ----- Participants & sites ------------------------------------------------
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Participant legal name" }
      - { name: role_type, type: enum, source: input, description: "Supply-chain role of the participant", constraints: "MANUFACTURER, DISTRIBUTOR, RETAILER" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum unbilled+outstanding charge exposure permitted before new hires are blocked", constraints: ">= 0" }
      - { name: outstanding_charge_cents, type: integer, source: computed, default: 0, description: "Sum of provisional accrued hire charge across OPEN hires plus unpaid finalized invoice balances for this account" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | CLOSED", constraints: "ACTIVE, SUSPENDED, CLOSED" }

  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning participant of this site" }
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: physical_balance, type: integer, source: computed, default: 0, description: "Count of Assets whose current_location_id == this Location and condition NOT IN {LOST}; recomputed on every movement/hire/audit side effect" }
      - { name: equity_balance, type: integer, source: computed, default: 0, description: "Net assets this location is accountable to return to the pool: issued-in minus returned-out minus voucher-transferred-out plus declared losses; may be negative (location is owed)" }
      - { name: equity_status, type: enum, source: computed, default: "BALANCED", description: "SHORT if equity_balance >= PoolPolicy.equity_warn_threshold; SURPLUS if equity_balance < 0; else BALANCED", constraints: "BALANCED, SHORT, SURPLUS" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED; CLOSED requires equity_balance==0 and physical_balance==0", constraints: "OPEN, CLOSED" }

  # ----- Pooled asset --------------------------------------------------------
  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: asset_type_id, type: string, source: input, description: "FK -> AssetType.id" }
      - { name: serial, type: string, source: input, description: "Unique serial within asset_type_id" }
      - { name: in_service_at, type: datetime, source: input, description: "Date asset entered the pool; depreciation clock origin for net-book-value loss basis" }
      - { name: current_location_id, type: string, source: computed, default: null, description: "FK -> Location.id; null when IN_TRANSIT or LOST" }
      - { name: current_hire_id, type: string, source: computed, default: null, description: "FK -> Hire.id; the OPEN hire occupying this asset, null when off-hire" }
      - { name: condition, type: enum, source: system, default: "AVAILABLE", description: "Lifecycle/condition state machine (cyclic)", constraints: "AVAILABLE, ON_HIRE, IN_TRANSIT, DAMAGED, IN_REPAIR, LOST" }

  # ----- Movement / chain of custody -----------------------------------------
  - name: TransferOrder
    parent: null
    common_fields: true
    fields:
      - { name: from_location_id, type: string, source: input, description: "FK -> Location.id; origin site (chain-of-custody source)" }
      - { name: to_location_id, type: string, source: input, description: "FK -> Location.id; destination site" }
      - { name: kind, type: enum, source: input, description: "ISSUANCE (operator stock -> participant, creates equity at destination), RETURN (participant -> operator stock, reduces equity at origin), TRANSFER (participant -> participant, equity follows assets)", constraints: "ISSUANCE, RETURN, TRANSFER" }
      - { name: asset_ids, type: array, source: input, description: "Ordered list of Asset.id moved by this order; the chain-of-custody manifest" }
      - { name: quantity, type: integer, source: computed, description: "len(asset_ids); the manifest size" }
      - { name: dispatched_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of DISPATCH" }
      - { name: received_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of RECEIVE" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> DISPATCHED -> RECEIVED | CANCELLED", constraints: "DRAFT, DISPATCHED, RECEIVED, CANCELLED" }

  # ----- Hire / rental -------------------------------------------------------
  - name: Hire
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the hiring participant billed for daily charge" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; site the hired assets sit at while ON_HIRE" }
      - { name: asset_type_id, type: string, source: input, description: "FK -> AssetType.id; all assets on this hire share one type" }
      - { name: asset_ids, type: array, source: input, description: "Asset.id set placed ON_HIRE by this hire; all must be AVAILABLE and of asset_type_id" }
      - { name: on_hire_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the hire opened (ACTIVE); accrual start" }
      - { name: off_hire_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the hire closed; accrual end (exclusive)" }
      - { name: expected_location_version, type: integer, source: input, description: "OCC: Location.version the client last observed; gates create against stale per-location equity" }
      - { name: accrued_charge_cents, type: integer, source: computed, default: 0, description: "Provisional forward-looking accrual = whole days from on_hire_at to current clock x effective tiered rate; recomputed on read-trigger and on close" }
      - { name: final_charge_cents, type: integer, source: computed, default: null, description: "Chronological event-replay actual charge pinned at CLOSE; null while OPEN" }
      - { name: lifecycle_status, type: enum, source: system, default: "OPEN", description: "Parallel dimension A: OPEN -> CLOSED | VOIDED", constraints: "OPEN, CLOSED, VOIDED" }
      - { name: settlement_status, type: enum, source: system, default: "UNBILLED", description: "Parallel dimension B: UNBILLED -> INVOICED -> SETTLED; evolves independently of lifecycle_status", constraints: "UNBILLED, INVOICED, SETTLED" }

  # ----- Audit & loss reconciliation -----------------------------------------
  - name: AuditReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; site being counted" }
      - { name: window_start, type: datetime, source: input, description: "Closed-interval start of the count window" }
      - { name: window_end, type: datetime, source: input, description: "Closed-interval end of the count window; must be >= window_start" }
      - { name: counted_physical, type: integer, source: input, description: "Physically counted asset quantity at the location (may be 0)", constraints: ">= 0" }
      - { name: loss_basis, type: enum, source: input, default: "REPLACEMENT", description: "Valuation basis for declared shortfall: REPLACEMENT (full cost) or NET_BOOK (straight-line depreciated)", constraints: "REPLACEMENT, NET_BOOK" }
      - { name: declared_loss_qty, type: integer, source: computed, default: 0, description: "max(0, expected_equity_at_finalize - counted_physical); set at FINALIZE" }
      - { name: declared_loss_cents, type: integer, source: computed, default: 0, description: "Monetary value of declared_loss_qty under loss_basis; set at FINALIZE" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> FINALIZED | VOIDED", constraints: "DRAFT, FINALIZED, VOIDED" }

  # ----- Exchange vs voucher -------------------------------------------------
  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - { name: from_location_id, type: string, source: input, description: "FK -> Location.id; location surrendering equity obligation (issued in lieu of physical exchange)" }
      - { name: to_account_id, type: string, source: input, description: "FK -> Account.id; account assuming the equity obligation on redemption" }
      - { name: asset_type_id, type: string, source: input, description: "FK -> AssetType.id" }
      - { name: quantity, type: integer, source: input, description: "Asset-equivalent equity units carried by this voucher", constraints: ">= 1" }
      - { name: issued_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of issue; expiry clock origin" }
      - { name: redeem_location_id, type: string, source: input, default: null, description: "FK -> Location.id; destination location set at REDEEM where equity lands" }
      - { name: expected_from_location_version, type: integer, source: input, description: "OCC: from_location.version the client last observed; gates issue against stale equity" }
      - { name: status, type: enum, source: system, default: "OUTSTANDING", description: "OUTSTANDING -> REDEEMED | EXPIRED | CANCELLED", constraints: "OUTSTANDING, REDEEMED, EXPIRED, CANCELLED" }

  # ----- Collection & repair -------------------------------------------------
  - name: CollectionRequest
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; site to collect idle/damaged assets from" }
      - { name: asset_ids, type: array, source: input, description: "Asset.id set to collect; each must be at location_id and condition IN {AVAILABLE, DAMAGED}" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED -> COLLECTED -> CLOSED | CANCELLED", constraints: "REQUESTED, COLLECTED, CLOSED, CANCELLED" }

  - name: RepairJob
    parent: null
    common_fields: true
    fields:
      - { name: collection_request_id, type: string, source: input, description: "FK -> CollectionRequest.id; source collection that fed damaged assets" }
      - { name: asset_ids, type: array, source: input, description: "Asset.id set under repair; each must be DAMAGED at job creation" }
      - { name: repair_cost_cents, type: integer, source: input, description: "Total repair cost recorded at completion", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> COMPLETED | SCRAPPED", constraints: "OPEN, COMPLETED, SCRAPPED" }

  # ----- Billing -------------------------------------------------------------
  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; billed participant" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum over InvoiceLine.amount_cents of kind != CREDIT" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "Sum over InvoiceLine.amount_cents of kind == CREDIT (stored as positive magnitude)" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "subtotal_cents - credit_cents; the net payable, floored at 0" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Amount recorded against this invoice via record_payment" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> ISSUED -> PAID | VOID", constraints: "DRAFT, ISSUED, PAID, VOID" }

  - name: InvoiceLine
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; parent invoice" }
      - { name: kind, type: enum, source: input, description: "HIRE (finalized hire charge), LOSS (declared-loss charge), REPAIR (repair recovery), CREDIT (voucher/early-return credit, magnitude stored positive)", constraints: "HIRE, LOSS, REPAIR, CREDIT" }
      - { name: source_hire_id, type: string, source: input, default: null, description: "FK -> Hire.id; populated when kind==HIRE" }
      - { name: source_audit_id, type: string, source: input, default: null, description: "FK -> AuditReconciliation.id; populated when kind==LOSS" }
      - { name: source_voucher_id, type: string, source: input, default: null, description: "FK -> Voucher.id; populated when kind==CREDIT and credit originates from a voucher" }
      - { name: amount_cents, type: integer, source: input, description: "Per-line amount (positive magnitude); rounding pinned per-line then summed at invoice level", constraints: ">= 0" }

  # ----- Demand forecasting --------------------------------------------------
  - name: DemandForecast
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; site the forecast targets" }
      - { name: asset_type_id, type: string, source: input, description: "FK -> AssetType.id" }
      - { name: horizon_days, type: integer, source: input, description: "Forward horizon over which projected demand is computed", constraints: ">= 1" }
      - { name: projected_demand, type: integer, source: computed, default: 0, description: "Weighted blend of recent issuance velocity and open-hire run-rate, scaled to horizon_days; see calculation forecast_projected_demand" }
      - { name: recommended_reposition, type: integer, source: computed, default: 0, description: "max(0, projected_demand - physical_balance_at_compute); assets to reposition into the location" }
      - { name: status, type: enum, source: system, default: "COMPUTED", description: "COMPUTED (single-shot computed read snapshot)", constraints: "COMPUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{accountId}/suspend"
        actor: PoolAdmin
        preconditions: []
        side_effects:
          - "No new Hire may open while SUSPENDED (cross-entity precondition on Hire open)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/reactivate"
        actor: PoolAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{accountId}/close"
        actor: PoolAdmin
        preconditions:
          - "No Hire for this account in lifecycle_status==OPEN (else ERR_ACCOUNT_HAS_OPEN_HIRE)"
          - "outstanding_charge_cents == 0 (else ERR_ACCOUNT_NOT_SETTLED)"
        side_effects: []

  - entity: Asset
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_HIRE
        trigger: "POST /hires (asset listed in asset_ids)"
        actor: Participant | PoolOperator
        preconditions:
          - "Asset.condition == AVAILABLE (else ERR_ASSET_NOT_AVAILABLE)"
          - "Asset.current_location_id == Hire.location_id (else ERR_ASSET_WRONG_LOCATION)"
        side_effects:
          - "current_hire_id = new Hire.id"
      - from: ON_HIRE
        to: AVAILABLE
        trigger: "POST /hires/{hireId}/close"
        actor: Participant | PoolOperator
        preconditions: []
        side_effects:
          - "current_hire_id = null"
      - from: AVAILABLE
        to: IN_TRANSIT
        trigger: "POST /transfer-orders/{transferOrderId}/dispatch (asset in manifest)"
        actor: PoolOperator | Participant
        preconditions:
          - "Asset.condition == AVAILABLE (else ERR_ASSET_NOT_AVAILABLE)"
        side_effects:
          - "current_location_id = null (in transit)"
      - from: IN_TRANSIT
        to: AVAILABLE
        trigger: "POST /transfer-orders/{transferOrderId}/receive (asset in manifest)"
        actor: PoolOperator | Participant
        preconditions: []
        side_effects:
          - "current_location_id = TransferOrder.to_location_id"
      - from: ON_HIRE
        to: DAMAGED
        trigger: "POST /assets/{assetId}/report-damage"
        actor: Participant | PoolOperator
        preconditions: []
        side_effects:
          - "If on an OPEN hire: asset is removed from hire occupancy, current_hire_id=null"
      - from: AVAILABLE
        to: DAMAGED
        trigger: "POST /assets/{assetId}/report-damage"
        actor: Participant | PoolOperator
        preconditions: []
        side_effects: []
      - from: DAMAGED
        to: IN_REPAIR
        trigger: "POST /repair-jobs (asset in asset_ids)"
        actor: PoolOperator
        preconditions:
          - "Asset.condition == DAMAGED (else ERR_ASSET_NOT_DAMAGED)"
        side_effects: []
      - from: IN_REPAIR
        to: AVAILABLE
        trigger: "POST /repair-jobs/{repairJobId}/complete"
        actor: PoolOperator
        preconditions: []
        side_effects:
          - "Asset returns to repair depot Location (CollectionRequest origin location)"
      - from: IN_REPAIR
        to: LOST
        trigger: "POST /repair-jobs/{repairJobId}/scrap"
        actor: PoolOperator
        preconditions: []
        side_effects:
          - "Asset removed from physical_balance permanently"
      - from: AVAILABLE
        to: LOST
        trigger: "POST /audit-reconciliations/{auditId}/finalize (shortfall assets selected oldest-in_service first)"
        actor: PoolOperator | PoolAdmin
        preconditions: []
        note: "System-selected loss victims: among AVAILABLE assets at the location, ordered by in_service_at ASC then created_at ASC, mark declared_loss_qty of them LOST."

  - entity: TransferOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /transfer-orders/{transferOrderId}/dispatch"
        actor: PoolOperator | Participant
        preconditions:
          - "from_location.status == OPEN (else ERR_LOCATION_CLOSED)"
          - "Every asset in asset_ids has condition==AVAILABLE and current_location_id==from_location_id (else ERR_ASSET_NOT_AVAILABLE / ERR_ASSET_WRONG_LOCATION)"
        side_effects:
          - "Each manifest Asset -> IN_TRANSIT, current_location_id=null (depth-1: assets leave origin)"
          - "from_location.physical_balance decremented by quantity (recompute)"
          - "dispatched_at = current clock"
      - from: DISPATCHED
        to: RECEIVED
        trigger: "POST /transfer-orders/{transferOrderId}/receive"
        actor: PoolOperator | Participant
        preconditions:
          - "to_location.status == OPEN (else ERR_LOCATION_CLOSED)"
        side_effects:
          - "Each manifest Asset -> AVAILABLE, current_location_id=to_location_id"
          - "to_location.physical_balance incremented by quantity (recompute)"
          - "ISSUANCE: to_location.equity_balance += quantity (destination owes pool)"
          - "RETURN: from_location.equity_balance -= quantity (origin relieved)"
          - "TRANSFER: from_location.equity_balance -= quantity AND to_location.equity_balance += quantity (equity follows assets)"
          - "received_at = current clock"
          - "Recompute equity_status on every touched Location"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /transfer-orders/{transferOrderId}/cancel"
        actor: PoolOperator | Participant
        preconditions: []
        side_effects: []

  - entity: Hire
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    note: "Parallel dimensions: lifecycle_status {OPEN,CLOSED,VOIDED} evolves via close/void; settlement_status {UNBILLED,INVOICED,SETTLED} evolves independently via invoice issue / payment. A CLOSED hire is UNBILLED until invoiced; an OPEN hire can never be INVOICED."
    transitions:
      # --- lifecycle dimension ---
      - from: OPEN
        to: CLOSED
        trigger: "POST /hires/{hireId}/close"
        actor: Participant | PoolOperator
        preconditions:
          - "lifecycle_status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "off_hire_at = current clock"
          - "final_charge_cents pinned via chronological event-replay (hire_final_charge calculation)"
          - "Each asset in asset_ids still ON_HIRE -> AVAILABLE, current_hire_id=null (depth-1)"
          - "location.physical_balance unaffected (assets already at location); equity unaffected"
          - "Recompute Account.outstanding_charge_cents (drop provisional accrual, this hire now contributes finalized unpaid)"
      - from: OPEN
        to: VOIDED
        trigger: "POST /hires/{hireId}/void"
        actor: PoolAdmin
        preconditions:
          - "settlement_status == UNBILLED (else ERR_HIRE_ALREADY_INVOICED)"
        side_effects:
          - "Each asset in asset_ids ON_HIRE -> AVAILABLE, current_hire_id=null"
          - "accrued_charge_cents = 0; final_charge_cents = 0 (compensating: charge reversed)"
          - "Recompute Account.outstanding_charge_cents"
      # --- settlement dimension (independent) ---
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /invoices/{invoiceId}/issue (a HIRE line references this hire)"
        actor: PoolOperator | PoolAdmin
        preconditions:
          - "Hire.lifecycle_status == CLOSED (else ERR_HIRE_NOT_CLOSED)"
        side_effects:
          - "settlement_status = INVOICED"
        note: "settlement transition; lifecycle_status stays CLOSED"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /invoices/{invoiceId}/record-payment (invoice reaches PAID and includes this hire's HIRE line)"
        actor: PoolOperator | PoolAdmin
        preconditions: []
        side_effects:
          - "settlement_status = SETTLED"
        note: "settlement transition; lifecycle_status stays CLOSED"

  - entity: AuditReconciliation
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /audit-reconciliations/{auditId}/finalize"
        actor: PoolOperator | PoolAdmin
        preconditions:
          - "location.status == OPEN (else ERR_LOCATION_CLOSED)"
          - "No other FINALIZED AuditReconciliation on this location whose [window_start, window_end] overlaps or sits within audit_min_interval_days of this window (else ERR_AUDIT_WINDOW_OVERLAP)"
        side_effects:
          - "declared_loss_qty = max(0, location.equity_balance - counted_physical) (depth-1 input snapshot)"
          - "declared_loss_cents computed under loss_basis (audit_loss_valuation calculation)"
          - "Mark declared_loss_qty Assets at location LOST (oldest in_service_at first) -> each Asset.condition=LOST, current_location_id=null (depth-2 cascade onto Asset)"
          - "location.equity_balance unchanged by loss declaration (loss converts owed-equity into a billable charge, not a relief): equity stays, physical_balance drops (depth-2 onto Location)"
          - "Auto-expire OUTSTANDING Vouchers from this location whose issued_at + voucher_expiry_days <= window_end -> Voucher.status=EXPIRED (parallel sweep)"
          - "Recompute location.physical_balance and equity_status (depth-2 onto Location)"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /audit-reconciliations/{auditId}/void"
        actor: PoolAdmin
        preconditions: []
        side_effects: []

  - entity: Voucher
    initial_state: OUTSTANDING
    terminal_states: [REDEEMED, EXPIRED, CANCELLED]
    transitions:
      - from: OUTSTANDING
        to: REDEEMED
        trigger: "POST /vouchers/{voucherId}/redeem"
        actor: PoolOperator | Participant
        preconditions:
          - "to_account_id Account.status == ACTIVE (else ERR_ACCOUNT_NOT_ACTIVE)"
          - "redeem_location_id belongs to to_account_id and status==OPEN (else ERR_LOCATION_CLOSED / ERR_VOUCHER_REDEEM_LOCATION_INVALID)"
          - "issued_at + voucher_expiry_days > current clock (else ERR_VOUCHER_EXPIRED)"
        side_effects:
          - "redeem_location.equity_balance += quantity (redeemer assumes obligation) (depth-1)"
          - "Recompute redeem_location.equity_status"
        note: "Compensating pair with issue: total system equity conserved across issue->redeem (issue debited from_location by quantity; redeem credits redeem_location by quantity)."
      - from: OUTSTANDING
        to: EXPIRED
        trigger: "system (audit finalize sweep when issued_at + voucher_expiry_days <= window_end)"
        actor: system
        preconditions: []
        side_effects:
          - "from_location.equity_balance += quantity (obligation snaps back to issuer; equity restored) (compensating restore)"
          - "Recompute from_location.equity_status"
      - from: OUTSTANDING
        to: CANCELLED
        trigger: "POST /vouchers/{voucherId}/cancel"
        actor: PoolAdmin
        preconditions: []
        side_effects:
          - "from_location.equity_balance += quantity (obligation returns to issuer)"
          - "Recompute from_location.equity_status"

  - entity: CollectionRequest
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: COLLECTED
        trigger: "POST /collection-requests/{collectionRequestId}/collect"
        actor: PoolOperator
        preconditions:
          - "Every asset in asset_ids has current_location_id == location_id (else ERR_ASSET_WRONG_LOCATION)"
        side_effects:
          - "Each AVAILABLE/DAMAGED asset -> current_location_id=null, IN_TRANSIT if AVAILABLE else stays DAMAGED with location cleared"
          - "location.physical_balance decremented (recompute)"
      - from: COLLECTED
        to: CLOSED
        trigger: "POST /collection-requests/{collectionRequestId}/close"
        actor: PoolOperator
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /collection-requests/{collectionRequestId}/cancel"
        actor: PoolOperator
        preconditions: []
        side_effects: []

  - entity: RepairJob
    initial_state: OPEN
    terminal_states: [COMPLETED, SCRAPPED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /repair-jobs/{repairJobId}/complete"
        actor: PoolOperator
        preconditions: []
        side_effects:
          - "Each asset IN_REPAIR -> AVAILABLE at the CollectionRequest origin location; location.physical_balance incremented (recompute)"
      - from: OPEN
        to: SCRAPPED
        trigger: "POST /repair-jobs/{repairJobId}/scrap"
        actor: PoolOperator
        preconditions: []
        side_effects:
          - "Each asset IN_REPAIR -> LOST (permanent removal)"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{invoiceId}/issue"
        actor: PoolOperator | PoolAdmin
        preconditions:
          - "Invoice has >= 1 InvoiceLine (else ERR_INVOICE_EMPTY)"
          - "Every HIRE line's source Hire is lifecycle_status==CLOSED (else ERR_HIRE_NOT_CLOSED)"
        side_effects:
          - "subtotal_cents, credit_cents, total_cents pinned via invoice_total calculation (per-line rounding then sum)"
          - "Each referenced Hire settlement_status UNBILLED -> INVOICED (depth-1 cross-entity)"
          - "Recompute Account.outstanding_charge_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{invoiceId}/record-payment (cumulative paid_cents >= total_cents)"
        actor: PoolOperator | PoolAdmin
        preconditions:
          - "amount in request > 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "paid_cents += amount; when paid_cents >= total_cents -> PAID"
          - "Each referenced Hire settlement_status INVOICED -> SETTLED (depth-1 cross-entity)"
          - "Recompute Account.outstanding_charge_cents"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{invoiceId}/void"
        actor: PoolAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version — true CREATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: hire-open-stale-location
    parent_entity: Location
    write_endpoint: "POST /hires"
    occ_field: "expected_location_version"
    description: |
      Opening a Hire against a Location whose version has advanced since the
      client last observed it is rejected. A hire legitimately supersedes the
      location's prior equity/occupancy view (another writer may have just
      opened a hire, dispatched a transfer, or finalized an audit on the same
      location), so the current writer's snapshot is stale and the open must
      carry the version it last saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: voucher-issue-stale-location
    parent_entity: Location
    write_endpoint: "POST /vouchers"
    occ_field: "expected_from_location_version"
    description: |
      Issuing a Voucher that surrenders equity from a Location whose version has
      advanced since the client last observed it is rejected. The voucher debits
      from_location equity and therefore supersedes the prior equity view; a
      stale version means another equity-mutating write already landed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hire_accrued_charge
    trigger: "GET /hires/{hireId} read; recomputed on POST /accounts/{accountId} read of outstanding; while Hire OPEN"
    algorithm: forward_looking
    formula: |
      # Provisional, forward-looking estimate while OPEN.
      days = floor((current_clock - on_hire_at) / 1 day)   # whole elapsed days, min 0
      n = len(asset_ids still ON_HIRE on this hire)
      effective_rate = tiered_daily_rate(n, base_daily_rate_cents)   # see hire_final_charge constants
      accrued_charge_cents = days * n * effective_rate
    input_set: "Single Hire in lifecycle_status==OPEN; counts only assets still ON_HIRE (damage removes an asset from the count from the damage instant — but provisional accrual uses CURRENT count, not historical)."
    constants:
      DAY_SECONDS: 86400
    precision: "integer cents; floor on day count; floor on rate multiplication"
    variants:
      - name: provisional_accrual
        when: "Hire lifecycle_status == OPEN"
        difference: "Uses current clock as end and CURRENT on-hire asset count; ignores mid-hire damage history — a forward-looking estimate that can differ from the chronological final."

  - name: hire_final_charge
    trigger: "POST /hires/{hireId}/close (pins final_charge_cents)"
    algorithm: chronological
    formula: |
      # Chronological event replay between on_hire_at (inclusive) and off_hire_at (exclusive).
      # Each asset accrues per-day at the tiered rate keyed on the asset COUNT active that day.
      # Replay damage events: a damaged asset stops accruing from its damage day (exclusive).
      total = 0
      for each whole day D in [on_hire_at, off_hire_at):
          active_n = count of asset_ids still ON_HIRE (not yet damaged) on day D
          rate = tiered_daily_rate(active_n, base_daily_rate_cents)
          total += active_n * rate
      final_charge_cents = total
      # tiered_daily_rate(n, base):
      #   if n >= TIER2_QTY:  rate = floor(base * TIER2_FACTOR)   # deepest discount
      #   elif n >= TIER1_QTY: rate = floor(base * TIER1_FACTOR)
      #   else:                rate = base
      # Per-day charge is floored AFTER multiplying active_n * rate is NOT done; rate is floored once, then * active_n.
    input_set: "Single Hire; chronological replay of its asset_ids damage timeline; days half-open [on_hire_at, off_hire_at)."
    constants:
      TIER1_QTY: 10
      TIER1_FACTOR: 0.90
      TIER2_QTY: 50
      TIER2_FACTOR: 0.80
      DAY_SECONDS: 86400
    precision: "integer cents; tiered rate floored once per tier; day count is whole half-open days"
    variants:
      - name: finalized_replay
        when: "Hire lifecycle_status transitions OPEN -> CLOSED"
        difference: "Chronological replay respects each asset's damage day, so a hire where assets were damaged mid-term yields a SMALLER total than the provisional accrual that used the surviving count for the whole span."

  - name: audit_loss_valuation
    trigger: "POST /audit-reconciliations/{auditId}/finalize (pins declared_loss_cents)"
    algorithm: aggregation
    formula: |
      declared_loss_qty = max(0, location.equity_balance - counted_physical)
      victims = AVAILABLE assets at location ordered by in_service_at ASC, created_at ASC, take declared_loss_qty
      if loss_basis == REPLACEMENT:
          declared_loss_cents = declared_loss_qty * asset_type.replacement_cost_cents
      elif loss_basis == NET_BOOK:
          # straight-line depreciation per victim, summed (NOT averaged)
          declared_loss_cents = 0
          for victim in victims:
              age_days = floor((window_end - victim.in_service_at) / 1 day)
              remaining = max(0, useful_life_days - age_days)
              nbv = floor(replacement_cost_cents * remaining / useful_life_days)
              declared_loss_cents += nbv
    input_set: "AVAILABLE assets at the audited location; expected_equity = location.equity_balance at finalize; tie-break in_service_at ASC then created_at ASC."
    constants:
      DAY_SECONDS: 86400
    precision: "integer cents; per-victim NBV floored then summed (per-line rounding then sum)"
    variants:
      - name: replacement_basis
        when: "loss_basis == REPLACEMENT"
        difference: "Full replacement_cost_cents per lost asset; ignores age."
      - name: net_book_basis
        when: "loss_basis == NET_BOOK"
        difference: "Per-victim straight-line depreciated value summed; an older asset values lower, so identical shortfall qty yields a different (smaller) declared_loss_cents than REPLACEMENT."

  - name: invoice_total
    trigger: "POST /invoices/{invoiceId}/issue (pins subtotal/credit/total)"
    algorithm: aggregation
    formula: |
      # Rounding order PINNED: each InvoiceLine.amount_cents is already an integer
      # (rounded per-line at line creation); the invoice SUMS the per-line integers.
      # subtotal sums non-CREDIT lines; credit sums CREDIT lines (positive magnitude).
      subtotal_cents = sum(line.amount_cents for line where kind in {HIRE, LOSS, REPAIR})
      credit_cents   = sum(line.amount_cents for line where kind == CREDIT)
      total_cents    = max(0, subtotal_cents - credit_cents)
    input_set: "All InvoiceLine children of the invoice at issue time."
    constants: {}
    precision: "integer cents; per-line rounding already applied, invoice sums integers (round-per-line-then-sum, NOT sum-then-round)"
    variants:
      - name: per_line_then_sum
        when: "always"
        difference: "Pins per-line-rounded integers then sums; a sum-then-round interpretation over fractional pre-rounded values would diverge by up to (n_lines-1) cents."

  - name: forecast_projected_demand
    trigger: "POST /demand-forecasts (computed read snapshot)"
    algorithm: weighted_scoring
    formula: |
      # Blend two signals over the lookback, scale to horizon.
      issuance_velocity = (sum of quantity over RECEIVED ISSUANCE TransferOrders to this location
                           in last LOOKBACK_DAYS) / LOOKBACK_DAYS         # per-day, float
      open_hire_runrate = (count of Assets currently ON_HIRE at this location
                           for this asset_type)                            # snapshot level
      blended_per_day = ISSUANCE_WEIGHT * issuance_velocity
                        + HIRE_WEIGHT * (open_hire_runrate / LOOKBACK_DAYS)
      projected_demand = ceil(blended_per_day * horizon_days)
      recommended_reposition = max(0, projected_demand - location.physical_balance)
    input_set: "RECEIVED ISSUANCE transfer orders to the location in [current_clock - LOOKBACK_DAYS, current_clock]; ON_HIRE assets at the location of asset_type."
    constants:
      LOOKBACK_DAYS: 30
      ISSUANCE_WEIGHT: 0.70
      HIRE_WEIGHT: 0.30
    precision: "ceil to whole assets after weighting; weights sum to 1.0"
    variants:
      - name: blended_forecast
        when: "always"
        difference: "Single blended algorithm (not a dual-variant calc); weights are fixed constants."

  - name: account_outstanding_charge
    trigger: "recompute on hire open/close/void, invoice issue/payment/void"
    algorithm: aggregation
    formula: |
      outstanding_charge_cents =
          sum(hire.accrued_charge_cents for hire where account_id==A and lifecycle_status==OPEN)
        + sum(invoice.total_cents - invoice.paid_cents
              for invoice where account_id==A and status==ISSUED)
    input_set: "OPEN hires (provisional accrual) + ISSUED-unpaid invoices for the account."
    constants: {}
    precision: "integer cents"
    variants:
      - name: exposure_aggregate
        when: "always"
        difference: "Mixes provisional (OPEN hire accrual) and finalized (ISSUED invoice balance) exposure into one credit-limit gate input."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path and body resource ids exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, types valid, enums in range, quantity/amount >= declared minimum. asset_ids MUST be non-empty for POST /hires, POST /collection-requests, POST /repair-jobs; POST /transfer-orders permits an empty asset_ids (zero-asset administrative move)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches current parent Location.version (hire open, voucher issue)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hires, POST /vouchers"
  - priority: 6
    category: state
    check: "Target resource in a state where the transition/operation is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_referential
    check: "Cross-entity state preconditions: hiring Account must be ACTIVE; transfer dispatch assets must be AVAILABLE at origin; voucher redeem Account must be ACTIVE; collection assets must be at location"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /hires, POST /vouchers/{voucherId}/redeem"
  - priority: 8
    category: business_referential
    check: "Asset eligibility for movement/hire: condition and location match operation requirements"
    error_id: ERR_ASSET_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /hires, POST /transfer-orders/{transferOrderId}/dispatch, POST /repair-jobs"
  - priority: 9
    category: business_constraint
    check: "Asset is at the location the operation requires (hire location, transfer origin, collection location)"
    error_id: ERR_ASSET_WRONG_LOCATION
    http_status: 409
    applies_to: "POST /hires, POST /transfer-orders/{transferOrderId}/dispatch, POST /collection-requests/{collectionRequestId}/collect"
  - priority: 10
    category: business_temporal
    check: "Audit window must not overlap, and must respect audit_min_interval_days adjacency buffer against, any FINALIZED window for the same location"
    error_id: ERR_AUDIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /audit-reconciliations/{auditId}/finalize"
  - priority: 11
    category: business_temporal
    check: "Voucher must not be past expiry (issued_at + voucher_expiry_days) at redeem"
    error_id: ERR_VOUCHER_EXPIRED
    http_status: 409
    applies_to: "POST /vouchers/{voucherId}/redeem"
  - priority: 12
    category: business_fiscal
    check: "Opening a hire must not push exposure strictly above credit_limit_cents. Exposure = Account.outstanding_charge_cents (pre-open) + day-1 reservation, where day-1 reservation = 1 * len(asset_ids) * tiered_daily_rate(len(asset_ids), base_daily_rate_cents). Rejected only when exposure > credit_limit_cents; exposure == credit_limit_cents is ALLOWED."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /hires"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock. All accrual/expiry/window/forecast rules read this clock."
    roles: [PoolAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # ---- PoolPolicy ----
  - method: POST
    path: "/pool-policies"
    description: "Create the pooling program policy (only one ACTIVE allowed)"
    roles: [PoolAdmin]
    code: 201
    input: [name, "currency?", "equity_warn_threshold?", "voucher_expiry_days?", "audit_min_interval_days?"]
    output: PoolPolicy
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/pool-policies/{poolPolicyId}"
    description: "Get a pool policy"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: PoolPolicy
    side_effects: []

  # ---- AssetType ----
  - method: POST
    path: "/asset-types"
    description: "Create an asset type"
    roles: [PoolAdmin]
    code: 201
    input: [code, name, base_daily_rate_cents, replacement_cost_cents, "useful_life_days?"]
    output: AssetType
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/asset-types/{assetTypeId}"
    description: "Get an asset type"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: AssetType
    side_effects: []
  - method: POST
    path: "/asset-types/{assetTypeId}/discontinue"
    description: "Discontinue an asset type (blocks new Asset creation)"
    roles: [PoolAdmin]
    code: 200
    input: []
    output: AssetType
    side_effects: ["status=DISCONTINUED"]

  # ---- Account ----
  - method: POST
    path: "/accounts"
    description: "Create a participant account"
    roles: [PoolAdmin]
    code: 201
    input: [legal_name, role_type, credit_limit_cents]
    output: Account
    side_effects: ["status=ACTIVE, outstanding_charge_cents=0"]
  - method: GET
    path: "/accounts/{accountId}"
    description: "Get an account (outstanding_charge_cents recomputed on read)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: Account
    side_effects: ["recompute outstanding_charge_cents"]
  - method: POST
    path: "/accounts/{accountId}/suspend"
    description: "Suspend an account"
    roles: [PoolAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["status=SUSPENDED"]
  - method: POST
    path: "/accounts/{accountId}/reactivate"
    description: "Reactivate a suspended account"
    roles: [PoolAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["status=ACTIVE"]
  - method: POST
    path: "/accounts/{accountId}/close"
    description: "Close an account"
    roles: [PoolAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["status=CLOSED if no OPEN hire and outstanding_charge_cents==0"]

  # ---- Location ----
  - method: POST
    path: "/locations"
    description: "Create a location under an account"
    roles: [PoolAdmin, PoolOperator]
    code: 201
    input: [account_id, name]
    output: Location
    side_effects: ["status=OPEN, balances=0"]
  - method: GET
    path: "/locations/{locationId}"
    description: "Get a location (balances/equity_status recomputed on read)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: Location
    side_effects: ["recompute physical_balance, equity_status"]
  - method: GET
    path: "/locations"
    description: "List locations, filterable by account_id (reverse-reachability for Location.account_id)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["account_id?"]
    output: "Location[]"
    side_effects: []
  - method: POST
    path: "/locations/{locationId}/close"
    description: "Close a location (requires zero balances)"
    roles: [PoolAdmin, PoolOperator]
    code: 200
    input: []
    output: Location
    side_effects: ["status=CLOSED if physical_balance==0 and equity_balance==0 (else ERR_INVALID_STATE)"]

  # ---- Asset ----
  - method: POST
    path: "/assets"
    description: "Mint a pooled asset (initially AVAILABLE at a location)"
    roles: [PoolAdmin, PoolOperator]
    code: 201
    input: [asset_type_id, serial, in_service_at, current_location_id]
    output: Asset
    side_effects: ["condition=AVAILABLE; current_location_id set; location.physical_balance incremented (recompute)"]
  - method: GET
    path: "/assets/{assetId}"
    description: "Get an asset"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: GET
    path: "/assets"
    description: "List assets, filterable by asset_type_id, current_location_id, current_hire_id, condition (reverse-reachability for Asset FKs)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["asset_type_id?", "current_location_id?", "current_hire_id?", "condition?"]
    output: "Asset[]"
    side_effects: []
  - method: POST
    path: "/assets/{assetId}/report-damage"
    description: "Report an asset as DAMAGED"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: Asset
    side_effects: ["condition=DAMAGED; if on OPEN hire, removed from hire occupancy"]

  # ---- TransferOrder ----
  - method: POST
    path: "/transfer-orders"
    description: "Create a transfer order manifest (DRAFT)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 201
    input: [from_location_id, to_location_id, kind, asset_ids]
    output: TransferOrder
    side_effects: ["status=DRAFT; quantity=len(asset_ids)"]
  - method: GET
    path: "/transfer-orders/{transferOrderId}"
    description: "Get a transfer order"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: TransferOrder
    side_effects: []
  - method: GET
    path: "/transfer-orders"
    description: "List transfer orders, filterable by from_location_id, to_location_id, status (reverse-reachability for TransferOrder location FKs)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["from_location_id?", "to_location_id?", "status?"]
    output: "TransferOrder[]"
    side_effects: []
  - method: POST
    path: "/transfer-orders/{transferOrderId}/dispatch"
    description: "Dispatch a transfer order (assets -> IN_TRANSIT)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: TransferOrder
    side_effects: ["status=DISPATCHED; manifest assets IN_TRANSIT; origin physical_balance decremented; dispatched_at set"]
  - method: POST
    path: "/transfer-orders/{transferOrderId}/receive"
    description: "Receive a transfer order (assets -> AVAILABLE at destination; equity moves per kind)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: TransferOrder
    side_effects: ["status=RECEIVED; assets AVAILABLE at destination; equity moves per kind; received_at set; equity_status recomputed"]
  - method: POST
    path: "/transfer-orders/{transferOrderId}/cancel"
    description: "Cancel a DRAFT transfer order"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: TransferOrder
    side_effects: ["status=CANCELLED"]

  # ---- Hire ----
  - method: POST
    path: "/hires"
    description: "Open a hire (assets -> ON_HIRE). Requires expected_location_version (OCC on Location)."
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 201
    input: [account_id, location_id, asset_type_id, asset_ids, expected_location_version]
    output: Hire
    side_effects: ["lifecycle_status=OPEN, settlement_status=UNBILLED; on_hire_at=current clock; assets ON_HIRE; increments Location.version by 1; recompute Account.outstanding_charge_cents"]
  - method: GET
    path: "/hires/{hireId}"
    description: "Get a hire (accrued_charge_cents recomputed on read while OPEN)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: Hire
    side_effects: ["recompute accrued_charge_cents if OPEN"]
  - method: GET
    path: "/hires"
    description: "List hires, filterable by account_id, location_id, asset_type_id, lifecycle_status, settlement_status (reverse-reachability for Hire FKs)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["account_id?", "location_id?", "asset_type_id?", "lifecycle_status?", "settlement_status?"]
    output: "Hire[]"
    side_effects: []
  - method: POST
    path: "/hires/{hireId}/close"
    description: "Close a hire (pins final_charge_cents; assets -> AVAILABLE)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: Hire
    side_effects: ["lifecycle_status=CLOSED; off_hire_at set; final_charge_cents pinned; assets AVAILABLE; recompute Account.outstanding_charge_cents"]
  - method: POST
    path: "/hires/{hireId}/void"
    description: "Void an UNBILLED open hire (compensating: charge reversed)"
    roles: [PoolAdmin]
    code: 200
    input: []
    output: Hire
    side_effects: ["lifecycle_status=VOIDED; accrued/final charge zeroed; assets AVAILABLE; recompute Account.outstanding_charge_cents"]

  # ---- AuditReconciliation ----
  - method: POST
    path: "/audit-reconciliations"
    description: "Create a draft audit reconciliation for a location"
    roles: [PoolAdmin, PoolOperator]
    code: 201
    input: [location_id, window_start, window_end, counted_physical, "loss_basis?"]
    output: AuditReconciliation
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/audit-reconciliations/{auditId}"
    description: "Get an audit reconciliation"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: AuditReconciliation
    side_effects: []
  - method: GET
    path: "/audit-reconciliations"
    description: "List audit reconciliations, filterable by location_id, status (reverse-reachability for AuditReconciliation.location_id)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["location_id?", "status?"]
    output: "AuditReconciliation[]"
    side_effects: []
  - method: POST
    path: "/audit-reconciliations/{auditId}/finalize"
    description: "Finalize an audit: declare loss, mark assets LOST, expire stale vouchers"
    roles: [PoolAdmin, PoolOperator]
    code: 200
    input: []
    output: AuditReconciliation
    side_effects: ["status=FINALIZED; declared_loss_qty/cents pinned; assets LOST; vouchers auto-expired; location balances recomputed"]
  - method: POST
    path: "/audit-reconciliations/{auditId}/void"
    description: "Void a draft audit reconciliation"
    roles: [PoolAdmin]
    code: 200
    input: []
    output: AuditReconciliation
    side_effects: ["status=VOIDED"]

  # ---- Voucher ----
  - method: POST
    path: "/vouchers"
    description: "Issue a voucher in lieu of physical exchange (debits from_location equity). Requires expected_from_location_version (OCC)."
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 201
    input: [from_location_id, to_account_id, asset_type_id, quantity, expected_from_location_version]
    output: Voucher
    side_effects: ["status=OUTSTANDING; issued_at=current clock; from_location.equity_balance -= quantity; increments Location.version by 1; recompute equity_status"]
  - method: GET
    path: "/vouchers/{voucherId}"
    description: "Get a voucher"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: Voucher
    side_effects: []
  - method: GET
    path: "/vouchers"
    description: "List vouchers, filterable by from_location_id, to_account_id, asset_type_id, redeem_location_id, status (reverse-reachability for Voucher FKs)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["from_location_id?", "to_account_id?", "asset_type_id?", "redeem_location_id?", "status?"]
    output: "Voucher[]"
    side_effects: []
  - method: POST
    path: "/vouchers/{voucherId}/redeem"
    description: "Redeem a voucher (credits redeem_location equity to the redeemer)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: [redeem_location_id]
    output: Voucher
    side_effects: ["status=REDEEMED; redeem_location.equity_balance += quantity; recompute equity_status"]
  - method: POST
    path: "/vouchers/{voucherId}/cancel"
    description: "Cancel an outstanding voucher (obligation snaps back to issuer)"
    roles: [PoolAdmin]
    code: 200
    input: []
    output: Voucher
    side_effects: ["status=CANCELLED; from_location.equity_balance += quantity; recompute equity_status"]

  # ---- CollectionRequest ----
  - method: POST
    path: "/collection-requests"
    description: "Request collection of idle/damaged assets from a location"
    roles: [PoolAdmin, PoolOperator]
    code: 201
    input: [location_id, asset_ids]
    output: CollectionRequest
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/collection-requests/{collectionRequestId}"
    description: "Get a collection request"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: CollectionRequest
    side_effects: []
  - method: GET
    path: "/collection-requests"
    description: "List collection requests, filterable by location_id, status (reverse-reachability for CollectionRequest.location_id)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["location_id?", "status?"]
    output: "CollectionRequest[]"
    side_effects: []
  - method: POST
    path: "/collection-requests/{collectionRequestId}/collect"
    description: "Mark a collection request COLLECTED (assets leave the location)"
    roles: [PoolAdmin, PoolOperator]
    code: 200
    input: []
    output: CollectionRequest
    side_effects: ["status=COLLECTED; assets leave location; physical_balance decremented"]
  - method: POST
    path: "/collection-requests/{collectionRequestId}/close"
    description: "Close a collected request"
    roles: [PoolAdmin, PoolOperator]
    code: 200
    input: []
    output: CollectionRequest
    side_effects: ["status=CLOSED"]
  - method: POST
    path: "/collection-requests/{collectionRequestId}/cancel"
    description: "Cancel a requested collection"
    roles: [PoolAdmin, PoolOperator]
    code: 200
    input: []
    output: CollectionRequest
    side_effects: ["status=CANCELLED"]

  # ---- RepairJob ----
  - method: POST
    path: "/repair-jobs"
    description: "Open a repair job over DAMAGED assets fed by a collection request"
    roles: [PoolAdmin, PoolOperator]
    code: 201
    input: [collection_request_id, asset_ids, repair_cost_cents]
    output: RepairJob
    side_effects: ["status=OPEN; assets DAMAGED -> IN_REPAIR"]
  - method: GET
    path: "/repair-jobs/{repairJobId}"
    description: "Get a repair job"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: RepairJob
    side_effects: []
  - method: GET
    path: "/repair-jobs"
    description: "List repair jobs, filterable by collection_request_id, status (reverse-reachability for RepairJob.collection_request_id)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["collection_request_id?", "status?"]
    output: "RepairJob[]"
    side_effects: []
  - method: POST
    path: "/repair-jobs/{repairJobId}/complete"
    description: "Complete repair (assets IN_REPAIR -> AVAILABLE at depot location)"
    roles: [PoolAdmin, PoolOperator]
    code: 200
    input: []
    output: RepairJob
    side_effects: ["status=COMPLETED; assets AVAILABLE at depot; physical_balance incremented"]
  - method: POST
    path: "/repair-jobs/{repairJobId}/scrap"
    description: "Scrap repair (assets IN_REPAIR -> LOST)"
    roles: [PoolAdmin, PoolOperator]
    code: 200
    input: []
    output: RepairJob
    side_effects: ["status=SCRAPPED; assets LOST"]

  # ---- Invoice ----
  - method: POST
    path: "/invoices"
    description: "Create a draft invoice for an account"
    roles: [PoolAdmin, PoolOperator]
    code: 201
    input: [account_id]
    output: Invoice
    side_effects: ["status=DRAFT, totals=0"]
  - method: GET
    path: "/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices, filterable by account_id, status (reverse-reachability for Invoice.account_id)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["account_id?", "status?"]
    output: "Invoice[]"
    side_effects: []
  - method: POST
    path: "/invoices/{invoiceId}/lines"
    description: "Add a line to a draft invoice (amount pre-rounded per-line integer cents)"
    roles: [PoolAdmin, PoolOperator]
    code: 201
    input: [kind, amount_cents, "source_hire_id?", "source_audit_id?", "source_voucher_id?"]
    output: InvoiceLine
    side_effects: ["InvoiceLine created under invoice"]
  - method: GET
    path: "/invoices/{invoiceId}/lines"
    description: "List lines of an invoice (sub-resource reverse-reachability for InvoiceLine.invoice_id)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: "InvoiceLine[]"
    side_effects: []
  - method: GET
    path: "/invoice-lines/{invoiceLineId}"
    description: "Get a single invoice line"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []
  - method: GET
    path: "/invoice-lines"
    description: "List invoice lines, filterable by invoice_id, source_hire_id, source_audit_id, source_voucher_id (filtered-list reverse-reachability for InvoiceLine source FKs)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["invoice_id?", "source_hire_id?", "source_audit_id?", "source_voucher_id?"]
    output: "InvoiceLine[]"
    side_effects: []
  - method: POST
    path: "/invoices/{invoiceId}/issue"
    description: "Issue an invoice (pins totals; referenced hires -> INVOICED)"
    roles: [PoolAdmin, PoolOperator]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=ISSUED; totals pinned; referenced hires settlement_status=INVOICED; recompute Account.outstanding_charge_cents"]
  - method: POST
    path: "/invoices/{invoiceId}/record-payment"
    description: "Record a payment against an issued invoice"
    roles: [PoolAdmin, PoolOperator]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["paid_cents += amount; if fully paid status=PAID and referenced hires settlement_status=SETTLED; recompute Account.outstanding_charge_cents"]
  - method: POST
    path: "/invoices/{invoiceId}/void"
    description: "Void a draft invoice"
    roles: [PoolAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=VOID"]

  # ---- DemandForecast ----
  - method: POST
    path: "/demand-forecasts"
    description: "Compute a demand-forecast snapshot for a location + asset type"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 201
    input: [location_id, asset_type_id, horizon_days]
    output: DemandForecast
    side_effects: ["status=COMPUTED; projected_demand and recommended_reposition computed"]
  - method: GET
    path: "/demand-forecasts/{demandForecastId}"
    description: "Get a demand-forecast snapshot"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: []
    output: DemandForecast
    side_effects: []
  - method: GET
    path: "/demand-forecasts"
    description: "List demand-forecast snapshots, filterable by location_id, asset_type_id (reverse-reachability for DemandForecast FKs)"
    roles: [PoolAdmin, PoolOperator, Participant]
    code: 200
    input: ["location_id?", "asset_type_id?"]
    output: "DemandForecast[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced path or body resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, out-of-range enum, non-positive quantity/amount, empty asset_ids where required" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match current Location.version on hire open or voucher issue" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition/operation" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Hiring or voucher-redeeming account is not ACTIVE (SUSPENDED/CLOSED)" }
  - { id: ERR_ACCOUNT_HAS_OPEN_HIRE, http: 409, condition: "Cannot close account with a hire in lifecycle_status==OPEN" }
  - { id: ERR_ACCOUNT_NOT_SETTLED, http: 409, condition: "Cannot close account with outstanding_charge_cents != 0" }
  - { id: ERR_ASSET_NOT_AVAILABLE, http: 409, condition: "Asset condition is not AVAILABLE where the operation requires AVAILABLE (hire/dispatch)" }
  - { id: ERR_ASSET_NOT_DAMAGED, http: 409, condition: "Asset condition is not DAMAGED where a repair job requires DAMAGED" }
  - { id: ERR_ASSET_WRONG_LOCATION, http: 409, condition: "Asset is not at the location the operation requires" }
  - { id: ERR_LOCATION_CLOSED, http: 409, condition: "Operation targets a CLOSED location" }
  - { id: ERR_AUDIT_WINDOW_OVERLAP, http: 409, condition: "Audit window overlaps or violates audit_min_interval_days buffer against a FINALIZED window for the location" }
  - { id: ERR_VOUCHER_EXPIRED, http: 409, condition: "Voucher redeemed after issued_at + voucher_expiry_days" }
  - { id: ERR_VOUCHER_REDEEM_LOCATION_INVALID, http: 409, condition: "redeem_location_id does not belong to to_account_id" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "Opening the hire would push account exposure strictly above credit_limit_cents" }
  - { id: ERR_HIRE_NOT_CLOSED, http: 409, condition: "Invoicing a HIRE line whose source hire is not lifecycle_status==CLOSED" }
  - { id: ERR_HIRE_ALREADY_INVOICED, http: 409, condition: "Voiding a hire whose settlement_status is not UNBILLED" }
  - { id: ERR_INVOICE_EMPTY, http: 409, condition: "Issuing an invoice with zero lines" }
  - { id: ERR_ASSET_TYPE_DISCONTINUED, http: 409, condition: "Minting an Asset of a DISCONTINUED asset type" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Duplicate unique key: AssetType.code, Asset.serial within type, or a second ACTIVE PoolPolicy" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PoolAdmin
    description: "Pooling-operator superuser: program/policy setup, asset-type and account lifecycle, voids, overrides; superset of PoolOperator."
    identity: "opaque"
    exclusive_operations:
      - "POST /pool-policies — create policy"
      - "POST /asset-types — create asset type"
      - "POST /asset-types/{id}/discontinue — discontinue asset type"
      - "POST /accounts — create account"
      - "POST /accounts/{id}/suspend — suspend account"
      - "POST /accounts/{id}/reactivate — reactivate account"
      - "POST /accounts/{id}/close — close account"
      - "POST /hires/{id}/void — void hire"
      - "POST /audit-reconciliations/{id}/void — void audit"
      - "POST /vouchers/{id}/cancel — cancel voucher"
      - "POST /invoices/{id}/void — void invoice"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /locations, POST /assets (with PoolOperator)"
      - "POST /transfer-orders + dispatch/receive/cancel (with PoolOperator, Participant)"
      - "POST /hires + close (with PoolOperator, Participant)"
      - "POST /audit-reconciliations + finalize (with PoolOperator)"
      - "POST /vouchers + redeem (with PoolOperator, Participant)"
      - "POST /collection-requests + collect/close/cancel (with PoolOperator)"
      - "POST /repair-jobs + complete/scrap (with PoolOperator)"
      - "POST /invoices + lines/issue/record-payment (with PoolOperator)"
      - "POST /demand-forecasts (with PoolOperator, Participant)"
      - "all GET reads"

  - name: PoolOperator
    description: "Pooling-operator staff: day-to-day logistics, hires, audits, vouchers, collections, repairs, billing; cannot void/suspend/close or set clock."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /locations, POST /assets (with PoolAdmin)"
      - "POST /transfer-orders + dispatch/receive/cancel (with PoolAdmin, Participant)"
      - "POST /hires + close (with PoolAdmin, Participant)"
      - "POST /audit-reconciliations + finalize (with PoolAdmin)"
      - "POST /vouchers + redeem (with PoolAdmin, Participant)"
      - "POST /collection-requests + collect/close/cancel (with PoolAdmin)"
      - "POST /repair-jobs + complete/scrap (with PoolAdmin)"
      - "POST /invoices + lines/issue/record-payment (with PoolAdmin)"
      - "POST /demand-forecasts (with PoolAdmin, Participant)"
      - "all GET reads"

  - name: Participant
    description: "Supply-chain participant (manufacturer/distributor/retailer): opens/closes hires, dispatches/receives transfers, issues/redeems vouchers, reports damage, runs forecasts. Cannot mint assets, audit, collect, repair, or bill."
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations:
      - "POST /transfer-orders + dispatch/receive/cancel (with PoolAdmin, PoolOperator)"
      - "POST /hires + close (with PoolAdmin, PoolOperator)"
      - "POST /vouchers + redeem (with PoolAdmin, PoolOperator)"
      - "POST /assets/{id}/report-damage (with PoolAdmin, PoolOperator)"
      - "POST /demand-forecasts (with PoolAdmin, PoolOperator)"
      - "all GET reads"
