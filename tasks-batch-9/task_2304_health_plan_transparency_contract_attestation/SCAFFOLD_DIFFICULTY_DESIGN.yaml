              payload: { plan_year_id: "${py}", reference_year: 2027 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { sub: "$.data.id" }
            - call: "POST /compliance/vendor-data-packages"
              payload: { rx_submission_id: "${sub}", vendor_id: "${v_tpa}", data_section: "D2_SPENDING", expected_record_count: 1200 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { pkg: "$.data.id" }
            - call: "GET /compliance/contracts/${c_tpa}"
              payload: {}
              as: PlanSponsorAdmin
              captures: { c_v: "$.data.version" }
            - call: "POST /compliance/contract-amendments"
              payload: { contract_id: "${c_tpa}", amendment_type: "DATA_RIGHTS", proposed_terms_summary: "Vendor grants the plan sponsor irrevocable rights to Rx and medical claim extracts.", data_rights_granted: true, expires_at: "2029-01-01T00:00:00Z", expected_contract_version: "${c_v}" }
              as: PlanSponsorAdmin
