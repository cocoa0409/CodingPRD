  # --- TransferRequest -------------------------------------------------------
  - method: POST
    path: /rewards/transfer-requests
    purpose: |
      Submit a points transfer to a partner program. Carries the OCC guard from §1.2.1 because
      any earlier debit, clawback or posture cascade bumps the account version the client read.
    roles: [Cardholder]
    input: [account_id, partner_agreement_id, points_out, expected_account_version]
    output: TransferRequest
    side_effects:
      - "attaches bonus_event_id when a RUNNING event on the agreement covers the submission instant"
      - "appends a TRANSFER_DEBIT PointsLedgerEntry of -points_out and raises points_pending_redemption by points_out"
      - "increments Account.version by 1"
  - method: GET
    path: /rewards/transfer-requests/{id}
    purpose: Read one transfer request including the ratio actually applied and the units credited.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst, Cardholder]
    input: []
    output: TransferRequest
    side_effects: []
  - method: GET
    path: /rewards/transfer-requests
    purpose: List transfer requests, filterable by account, agreement, promotion and lifecycle.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst, Cardholder]
    input: ["account_id?", "partner_agreement_id?", "bonus_event_id?", "status?", "hold_reason?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []
  - method: POST
    path: /rewards/transfer-requests/{id}/hold
    purpose: Place a fraud hold on a submitted or queued transfer.
    roles: [FraudAnalyst]
    input: [hold_reason]
    output: TransferRequest
    side_effects:
      - "sets status HELD, hold_reason and held_by_user_id from X-User-ID; clears scheduled_post_at"
      - "increments Account.transfer_hold_count by 1 and re-runs the posture calculation"
      - "increments TransferRequest.version by 1 and Account.version by 1"
  - method: POST
    path: /rewards/transfer-requests/{id}/release
    purpose: Release a held transfer back into screening; the releaser may not be the operator who held it.
    roles: [ProgramApprover]
    input: []
    output: TransferRequest
    side_effects:
      - "sets status SUBMITTED and released_by_user_id; leaves hold_reason and transfer_hold_count standing as history"
      - "increments TransferRequest.version by 1"
  - method: POST
    path: /rewards/transfer-requests/{id}/clear-screening
    purpose: Clear screening and queue the transfer for posting after the agreement's latency.
    roles: [FraudAnalyst]
    input: []
    output: TransferRequest
    side_effects: ["sets status QUEUED, screening_cleared_at and scheduled_post_at; increments version by 1"]
  - method: POST
    path: /rewards/transfer-requests/{id}/reject
    purpose: Reject a held transfer and return its points.
    roles: [FraudAnalyst]
    input: [resolution_reason]
    output: TransferRequest
    side_effects:
      - "appends a TRANSFER_REVERSAL PointsLedgerEntry of +points_out"
      - "lowers points_pending_redemption by points_out, restoring points_balance + points_pending_redemption to its pre-submission value"
      - "increments TransferRequest.version by 1 and Account.version by 1"
  - method: POST
    path: /rewards/transfer-requests/{id}/reverse
    purpose: Reverse a completed transfer inside the agreement's reversal window.
    roles: [ProgramAdmin]
    input: [resolution_reason]
    output: TransferRequest
    side_effects:
      - "appends a TRANSFER_REVERSAL PointsLedgerEntry of +points_out"
      - "zeroes base_units, bonus_units and partner_units_credited; sets reversed_at"
      - "increments TransferRequest.version by 1 and Account.version by 1"

  # --- FraudCase -------------------------------------------------------------
  - method: POST
    path: /rewards/fraud-cases
    purpose: Open an account-takeover or points-drain investigation and score it on signals alone.
    roles: [FraudAnalyst]
    input: [account_id, case_type, signals, device_fingerprint_changed]
    output: FraudCase
    side_effects:
      - "computes instant_score per the instant variant of calculations.ato_risk_score and sets risk_score to it"
      - "stores opened_by_user_id from X-User-ID"
      - "re-runs calculations.account_fraud_posture, which may move the account straight to LOCKED"
  - method: GET
    path: /rewards/fraud-cases/{id}
    purpose: Read one case including both score variants.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst]
    input: []
    output: FraudCase
    side_effects: []
  - method: GET
    path: /rewards/fraud-cases
    purpose: List investigations, filterable by account, family and lifecycle.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst]
    input: ["account_id?", "case_type?", "status?", "limit?", "offset?"]
    output: FraudCase[]
    side_effects: []
  - method: POST
    path: /rewards/fraud-cases/{id}/review
    purpose: Take the case under review and re-score it with the 30-day transfer velocity term.
    roles: [FraudAnalyst]
    input: []
    output: FraudCase
    side_effects:
      - "computes review_score per the review variant of calculations.ato_risk_score and sets risk_score to it"
      - "sets reviewed_at; re-runs the posture calculation, which may cascade into transfer rejections and entitlement suspensions"
  - method: POST
    path: /rewards/fraud-cases/{id}/confirm
    purpose: Confirm fraud; the confirming approver may not be the analyst who opened the case.
    roles: [ProgramApprover]
    input: [resolution_note]
    output: FraudCase
    side_effects:
      - "HOP 1: sets status CONFIRMED, resolution_note and resolved_by_user_id"
      - "HOP 2: pins Account.fraud_posture at LOCKED"
      - "HOP 3: rejects every SUBMITTED, QUEUED or HELD TransferRequest of the account with resolution_reason POSTURE_LOCKED"
      - "HOP 4: each rejection appends a TRANSFER_REVERSAL PointsLedgerEntry and lowers points_pending_redemption"
      - "suspends every ACTIVE BenefitEntitlement of the account with suspension_reason POSTURE_LOCKED"
  - method: POST
    path: /rewards/fraud-cases/{id}/clear
    purpose: Clear the case; the clearing approver may not be the analyst who opened it.
    roles: [ProgramApprover]
    input: [resolution_note]
    output: FraudCase
    side_effects:
      - "sets status CLEARED, resolution_note and resolved_by_user_id"
      - "re-runs the posture calculation, dropping the account to CLEAR or to WATCH when transfer_hold_count >= 2"
      - "reinstates the SUSPENDED BenefitEntitlement rows the recovered posture no longer suppresses; already-REJECTED transfers stay rejected"

  # --- BenefitEntitlement ----------------------------------------------------
  - method: POST
    path: /rewards/benefit-entitlements
    purpose: Grant a cardholder benefit with an annual consumption allowance.
    roles: [ProgramAdmin]
    input: [account_id, benefit_type, annual_allowance, expires_at, "requires_portal_booking?"]
    output: BenefitEntitlement
    side_effects: ["creates the entitlement ACTIVE with used_count 0 and remaining_allowance == annual_allowance"]
  - method: GET
    path: /rewards/benefit-entitlements/{id}
    purpose: Read one entitlement including its remaining allowance.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst, Cardholder]
    input: []
    output: BenefitEntitlement
    side_effects: []
  - method: GET
    path: /rewards/benefit-entitlements
    purpose: List entitlements, filterable by account, benefit and lifecycle.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst, Cardholder]
    input: ["account_id?", "benefit_type?", "status?", "limit?", "offset?"]
    output: BenefitEntitlement[]
    side_effects: []
  - method: POST
    path: /rewards/benefit-entitlements/{id}/consume
    purpose: Consume one unit of a benefit, optionally citing the ticketed booking it attaches to.
    roles: [Cardholder]
    input: ["redemption_order_id?"]
    output: BenefitEntitlement
    side_effects:
      - "increments used_count by 1 and lowers remaining_allowance by 1"
      - "sets last_consumed_at to the logical clock instant; increments version by 1"

  # --- ProgramChangeNotice ---------------------------------------------------
  - method: POST
    path: /rewards/change-notices
    purpose: Draft a program change notice, optionally superseding an earlier one.
    roles: [ProgramAdmin]
    input: [notice_code, change_type, effective_at, grandfather_window_days, cohort_enrolled_before, "target_agreement_id?", "new_ratio_points_out?", "new_ratio_partner_units_in?", "supersedes_notice_id?"]
    output: ProgramChangeNotice
    side_effects: ["creates the notice in DRAFT and stores drafted_by_user_id from X-User-ID"]
  - method: GET
    path: /rewards/change-notices/{id}
    purpose: Read one notice including its replacement ratio and grandfathering terms.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst, Cardholder]
    input: []
    output: ProgramChangeNotice
    side_effects: []
  - method: GET
    path: /rewards/change-notices
    purpose: List notices, filterable by lifecycle, target agreement and the notice each one supersedes.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst, Cardholder]
    input: ["status?", "change_type?", "target_agreement_id?", "supersedes_notice_id?", "limit?", "offset?"]
    output: ProgramChangeNotice[]
    side_effects: []
  - method: POST
    path: /rewards/change-notices/{id}/submit
    purpose: Submit a drafted notice for approval.
    roles: [ProgramAdmin]
    input: []
    output: ProgramChangeNotice
    side_effects: ["sets status PENDING_APPROVAL; increments version by 1"]
  - method: POST
    path: /rewards/change-notices/{id}/revise
    purpose: Send a pending notice back to drafting.
    roles: [ProgramApprover]
    input: []
    output: ProgramChangeNotice
    side_effects: ["sets status DRAFT; increments version by 1"]
  - method: POST
    path: /rewards/change-notices/{id}/announce
    purpose: Announce an approved notice to cardholders; the announcer may not be the drafter.
    roles: [ProgramApprover]
    input: []
    output: ProgramChangeNotice
    side_effects:
      - "sets status ANNOUNCED, announced_at and approved_by_user_id; increments version by 1"
      - "withdraws the ANNOUNCED notice named by supersedes_notice_id with withdrawn_reason SUPERSEDED"
  - method: POST
    path: /rewards/change-notices/{id}/withdraw
    purpose: Withdraw an announced notice before it takes effect.
    roles: [ProgramAdmin]
    input: [withdrawn_reason]
    output: ProgramChangeNotice
    side_effects: ["sets status WITHDRAWN and withdrawn_reason; increments version by 1"]

  # --- LiabilitySnapshot (immutable) -----------------------------------------
  - method: POST
    path: /rewards/liability-snapshots
    purpose: Value the outstanding points liability at a cut-off instant under one cost method.
    roles: [ProgramAdmin]
    input: [as_of, method]
    output: LiabilitySnapshot
    side_effects:
      - "computes every field per calculations.points_liability_and_breakage in its pinned seven-step order"
      - "stores generated_by_user_id from X-User-ID; the row is immutable once written"
  - method: GET
    path: /rewards/liability-snapshots/{id}
    purpose: Read one liability snapshot.
    roles: [ProgramAdmin, ProgramApprover]
    input: []
    output: LiabilitySnapshot
    side_effects: []
  - method: GET
    path: /rewards/liability-snapshots
    purpose: List liability snapshots by method.
    roles: [ProgramAdmin, ProgramApprover]
    input: ["method?", "limit?", "offset?"]
    output: LiabilitySnapshot[]
    side_effects: []

# =============================================================================
# 1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    when: X-User-Role or X-User-ID is absent or empty.
    message_template: "Both X-User-Role and X-User-ID are required."
  - error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    when: X-User-Role names a role outside the five declared in 1.7.
    message_template: "Unknown role '{role}'."
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    when: The acting role is not listed on the endpoint.
    message_template: "Role '{role}' may not call {method} {path}."
  - error_id: ERR_ACCOUNT_OWNERSHIP_REQUIRED
    http_status: 403
    when: A Cardholder addresses an account, order, transfer or entitlement that is not their own.
    message_template: "Cardholder '{user_id}' may only act on their own account."
  - error_id: ERR_AGENCY_SCOPE_VIOLATION
    http_status: 403
    when: An AgencySupplier writes an offer or ticket that belongs to a different agency.
    message_template: "Agency '{user_id}' may not act on inventory of agency '{agency_partner_id}'."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    when: The acting X-User-ID is the same operator recorded on the opposing half of a draft/approve or hold/release pair.
    message_template: "Operator '{user_id}' may not perform both halves of this control."
  - error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    when: An id in the path or body names no row.
    message_template: "{resource_type} '{id}' not found."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    when: The body fails schema, enum, type, range or non-empty-array validation.
    message_template: "Invalid request: {detail}."
  - error_id: ERR_INVALID_PAGINATION
    http_status: 400
    when: limit is outside [1, 100] or offset is negative.
    message_template: "Invalid pagination: {detail}."
  - error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
    when: expected_offer_version does not match the offer's current version.
    message_template: "Offer version {expected} is stale; current version is {actual}."
  - error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    when: expected_account_version does not match the account's current version.
    message_template: "Account version {expected} is stale; current version is {actual}."
  - error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    when: The addressed row's current state is not a declared from-state for the requested transition.
    message_template: "Cannot {trigger} from state '{current_state}'."
  - error_id: ERR_ACCOUNT_CLOSED
    http_status: 409
    when: The owning account is CLOSED.
    message_template: "Account '{account_id}' is closed."
  - error_id: ERR_ACCOUNT_POSTURE_LOCKED
    http_status: 409
    when: The owning account's fraud_posture is LOCKED.
    message_template: "Account '{account_id}' is locked by fraud controls."
  - error_id: ERR_OFFER_NOT_BOOKABLE
    http_status: 409
    when: The offer's status is not OPEN.
    message_template: "Offer '{offer_id}' is '{status}' and not bookable."
  - error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    when: The referenced partner agreement is not ACTIVE.
    message_template: "Partner agreement '{agreement_id}' is '{status}'."
  - error_id: ERR_AGENCY_SUSPENDED
    http_status: 409
    when: The agency behind the offer is SUSPENDED.
    message_template: "Agency '{agency_partner_id}' is suspended."
  - error_id: ERR_BENEFIT_NOT_CONSUMABLE
    http_status: 409
    when: The entitlement is SUSPENDED or EXPIRED.
    message_template: "Benefit '{entitlement_id}' is '{status}' and cannot be consumed."
  - error_id: ERR_OFFER_HAS_COMMITTED_SEATS
    http_status: 409
    when: An offer with seats_committed greater than zero is withdrawn.
    message_template: "Offer '{offer_id}' still has {seats_committed} committed seat(s)."
  - error_id: ERR_ACCOUNT_HAS_IN_FLIGHT_POINTS
    http_status: 409
    when: An account with in-flight transfers or unresolved quotes is closed.
    message_template: "Account '{account_id}' still has points in flight."
  - error_id: ERR_AGREEMENT_HAS_IN_FLIGHT_TRANSFERS
    http_status: 409
    when: An agreement with SUBMITTED, QUEUED or HELD transfers is terminated.
    message_template: "Partner agreement '{agreement_id}' still has transfers in flight."
  - error_id: ERR_OFFER_OUT_OF_PARITY
    http_status: 409
    when: The offer's parity_status is OUT_OF_PARITY at booking or confirmation.
    message_template: "Offer '{offer_id}' is out of parity with the agency public channel."
  - error_id: ERR_AVAILABILITY_PARITY_BREACH
    http_status: 422
    when: portal_seats exceeds agency_public_seats in a create or resync payload.
    message_template: "Portal seats {portal_seats} exceed agency public seats {agency_public_seats}."
  - error_id: ERR_ROTATION_WINDOW_OVERLAP
    http_status: 409
    when: A new rotation's half-open window intersects a live rotation on the same category.
    message_template: "Rotation window overlaps rotation '{rotation_id}' on this category."
  - error_id: ERR_BONUS_EVENT_WINDOW_CONFLICT
    http_status: 409
    when: A new promotion's closed window falls inside the 24-hour buffer around a live promotion on the same agreement.
    message_template: "Promotional window conflicts with event '{event_id}' inside the 24-hour buffer."
  - error_id: ERR_TRANSFER_REVERSAL_WINDOW_EXPIRED
    http_status: 409
    when: The clock has passed completed_at plus the agreement's reversal_window_hours.
    message_template: "Reversal window for transfer '{transfer_id}' closed at {deadline}."
  - error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    when: effective_at is less than MIN_NOTICE_DAYS after the announcement instant.
    message_template: "Notice period is shorter than the required {min_notice_days} days."
  - error_id: ERR_SNAPSHOT_AS_OF_IN_FUTURE
    http_status: 422
    when: as_of is after the logical clock instant.
    message_template: "Snapshot as_of {as_of} is in the future."
  - error_id: ERR_CHANNEL_REQUIRES_OFFER
    http_status: 422
    when: A PORTAL_BOOKING order is created on the flat create endpoint instead of the offer's book endpoint.
    message_template: "Channel '{channel}' must be created through an inventory offer."
  - error_id: ERR_BENEFIT_REQUIRES_TICKETED_BOOKING
    http_status: 409
    when: A requires_portal_booking entitlement is consumed without a TICKETED portal order.
    message_template: "Benefit '{entitlement_id}' requires a ticketed portal booking."
  - error_id: ERR_ORDER_ACCOUNT_MISMATCH
    http_status: 422
    when: The cited redemption order belongs to a different account than the entitlement.
    message_template: "Order '{order_id}' does not belong to account '{account_id}'."
  - error_id: ERR_DUPLICATE_CATEGORY_MAPPING
    http_status: 409
    when: A second fallback category is created or an mcc_code is mapped twice.
    message_template: "Merchant category mapping conflict: {detail}."
  - error_id: ERR_DUPLICATE_PROGRAM_CODE
    http_status: 409
    when: A code that must be unique (partner_program_code among live agreements, rotation_code, event_code, notice_code) is reused.
    message_template: "Code '{code}' is already in use."
  - error_id: ERR_NOTICE_TARGET_REQUIRED
    http_status: 422
    when: A TRANSFER_RATIO_CHANGE notice is submitted without a target agreement and a replacement ratio.
    message_template: "A TRANSFER_RATIO_CHANGE notice requires a target agreement and a replacement ratio."
  - error_id: ERR_BELOW_MIN_TRANSFER
    http_status: 422
    when: points_out is below the agreement's min_transfer_points.
    message_template: "points_out {points_out} is below the minimum {min_transfer_points}."
  - error_id: ERR_TRANSFER_INCREMENT_INVALID
    http_status: 422
    when: points_out is not an exact multiple of the agreement's transfer_increment_points.
    message_template: "points_out {points_out} is not a multiple of {transfer_increment_points}."
  - error_id: ERR_SEAT_UNAVAILABLE
    http_status: 409
    when: Every portal seat on the offer is already committed.
    message_template: "No portal seats remain on offer '{offer_id}'."
  - error_id: ERR_STATEMENT_CREDIT_BELOW_MINIMUM
    http_status: 422
    when: A statement credit is requested below STATEMENT_CREDIT_MIN_POINTS.
    message_template: "Statement credit requires at least {min_points} points."
  - error_id: ERR_INSUFFICIENT_POINTS
    http_status: 402
    when: The requested burn exceeds calculations.available_points_for_redemption.
    message_template: "Account '{account_id}' has {available} available points; {requested} requested."
  - error_id: ERR_BENEFIT_ALLOWANCE_EXHAUSTED
    http_status: 409
    when: remaining_allowance is 0 on the addressed entitlement.
    message_template: "Benefit '{entitlement_id}' has no remaining allowance."
  - error_id: ERR_SETTLEMENT_AMOUNT_INVALID
    http_status: 422
    when: invoice_amount_cents is negative or the adjustment drives issuer_cost_final_cents below zero.
    message_template: "Settlement amounts are invalid: {detail}."

# =============================================================================
# 1.7 RBAC Table
# =============================================================================
roles:
  - role: Cardholder
    identity: "entity_backed:Account"
    # X-User-ID is the Account.id. Every cardholder-scoped write is checked against it.
    exclusive_operations:
      - "POST /rewards/inventory-offers/{id}/book"
      - "POST /rewards/redemption-orders"
      - "POST /rewards/redemption-orders/{id}/confirm"
      - "POST /rewards/redemption-orders/{id}/cancel"
      - "POST /rewards/transfer-requests"
      - "POST /rewards/benefit-entitlements/{id}/consume"
    shared_operations:
      - "GET /rewards/accounts/{id} (own account only)"
      - "GET /rewards/redemption-orders, GET /rewards/redemption-orders/{id}"
      - "GET /rewards/transfer-requests, GET /rewards/transfer-requests/{id}"
      - "GET /rewards/benefit-entitlements, GET /rewards/benefit-entitlements/{id}"
      - "GET /rewards/inventory-offers, GET /rewards/inventory-offers/{id}"
      - "GET /rewards/merchant-categories, GET /rewards/rotations, GET /rewards/transactions"
      - "GET /rewards/partner-agreements, GET /rewards/bonus-events, GET /rewards/change-notices"
      - "GET /rewards/points-ledger-entries, GET /rewards/_clock"
    denied:
      - "every POST that is not in the exclusive list, including POST /rewards/accounts and POST /rewards/ops-runs"
      - "GET /rewards/accounts (the unfiltered account list)"
      - "GET /rewards/fraud-cases and GET /rewards/liability-snapshots"

  - role: AgencySupplier
    identity: "entity_backed:TravelAgencyPartner"
    # X-User-ID is the TravelAgencyPartner.id. Inventory and ticketing writes are scoped to it.
    exclusive_operations:
      - "POST /rewards/inventory-offers"
      - "POST /rewards/inventory-offers/{id}/resync"
      - "POST /rewards/inventory-offers/{id}/withdraw"
      - "POST /rewards/redemption-orders/{id}/ticket"
      - "POST /rewards/redemption-orders/{id}/refund"
    shared_operations:
      - "GET /rewards/agency-partners, GET /rewards/agency-partners/{id}"
      - "GET /rewards/inventory-offers, GET /rewards/inventory-offers/{id}"
      - "GET /rewards/redemption-orders, GET /rewards/redemption-orders/{id}"
      - "GET /rewards/_clock"
    denied:
      - "POST /rewards/inventory-offers/{id}/suspend and .../reinstate (program-side controls)"
      - "POST /rewards/redemption-orders/{id}/settle"
      - "every account, transfer, fraud, notice and liability operation"

  - role: ProgramAdmin
    identity: opaque
    # X-User-ID is an opaque operator id, stored on drafts and holds for the SoD comparison.
    exclusive_operations:
      - "POST /rewards/_clock/set_current_utc"
      - "POST /rewards/ops-runs"
      - "POST /rewards/accounts"
      - "POST /rewards/accounts/{id}/close"
      - "POST /rewards/merchant-categories"
      - "POST /rewards/rotations"
      - "POST /rewards/rotations/{id}/publish"
      - "POST /rewards/transactions"
      - "POST /rewards/transactions/{id}/reverse"
      - "POST /rewards/agency-partners"
      - "POST /rewards/agency-partners/{id}/suspend"
      - "POST /rewards/inventory-offers/{id}/suspend"
      - "POST /rewards/inventory-offers/{id}/reinstate"
      - "POST /rewards/redemption-orders/{id}/settle"
      - "POST /rewards/partner-agreements"
      - "POST /rewards/partner-agreements/{id}/submit"
      - "POST /rewards/partner-agreements/{id}/suspend"
      - "POST /rewards/bonus-events"
      - "POST /rewards/bonus-events/{id}/cancel"
      - "POST /rewards/transfer-requests/{id}/reverse"
      - "POST /rewards/benefit-entitlements"
      - "POST /rewards/change-notices"
      - "POST /rewards/change-notices/{id}/submit"
      - "POST /rewards/change-notices/{id}/withdraw"
      - "POST /rewards/liability-snapshots"
    shared_operations:
      - "every GET in 1.5"
    denied:
      - "POST /rewards/partner-agreements/{id}/approve, .../revise, .../reinstate, .../terminate"
      - "POST /rewards/change-notices/{id}/announce and .../revise"
      - "POST /rewards/fraud-cases and every fraud-case transition"
      - "POST /rewards/transfer-requests and every screening transition"
      - "POST /rewards/inventory-offers and the agency ticketing endpoints"

  - role: ProgramApprover
    identity: opaque
    # The second half of every two-operator control; must differ from the ProgramAdmin id on the row.
    exclusive_operations:
      - "POST /rewards/partner-agreements/{id}/approve"
      - "POST /rewards/partner-agreements/{id}/revise"
      - "POST /rewards/partner-agreements/{id}/reinstate"
      - "POST /rewards/partner-agreements/{id}/terminate"
      - "POST /rewards/change-notices/{id}/announce"
      - "POST /rewards/change-notices/{id}/revise"
      - "POST /rewards/fraud-cases/{id}/confirm"
      - "POST /rewards/fraud-cases/{id}/clear"
      - "POST /rewards/transfer-requests/{id}/release"
    shared_operations:
      - "every GET in 1.5"
    denied:
      - "POST /rewards/partner-agreements/{id}/submit and .../suspend"
      - "POST /rewards/change-notices and .../submit"
      - "POST /rewards/fraud-cases and .../review"
      - "POST /rewards/transfer-requests/{id}/hold, .../clear-screening, .../reject"
      - "POST /rewards/ops-runs and POST /rewards/_clock/set_current_utc"

  - role: FraudAnalyst
    identity: opaque
    # Owns screening and case opening; never resolves a case it opened.
    exclusive_operations:
      - "POST /rewards/fraud-cases"
      - "POST /rewards/fraud-cases/{id}/review"
      - "POST /rewards/transfer-requests/{id}/hold"
      - "POST /rewards/transfer-requests/{id}/clear-screening"
      - "POST /rewards/transfer-requests/{id}/reject"
    shared_operations:
      - "GET /rewards/accounts, GET /rewards/accounts/{id}"
      - "GET /rewards/fraud-cases, GET /rewards/fraud-cases/{id}"
      - "GET /rewards/transfer-requests, GET /rewards/transfer-requests/{id}"
      - "GET /rewards/redemption-orders, GET /rewards/points-ledger-entries"
      - "GET /rewards/transactions, GET /rewards/benefit-entitlements"
      - "GET /rewards/merchant-categories, GET /rewards/rotations"
      - "GET /rewards/partner-agreements, GET /rewards/bonus-events, GET /rewards/change-notices"
      - "GET /rewards/_clock"
    denied:
      - "POST /rewards/fraud-cases/{id}/confirm and .../clear (the approver's half)"
      - "POST /rewards/transfer-requests/{id}/release (the approver's half)"
      - "every program configuration and settlement endpoint"
      - "GET /rewards/liability-snapshots and GET /rewards/agency-partners"
