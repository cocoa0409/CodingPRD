              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-ZERO", product_name: "Zero Window Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 4000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bpa}", noticing_party_name: "Same Day Advocates", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-08-01T00:00:00Z", served_at: "2026-08-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { notice_1: $.data.id }
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "ESCALATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /notices/${notice_1}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_1: $.data.version }
          trigger:
            - call: "POST /notices/${notice_1}/settlements"
              payload: { requested_attorney_fees_cents: 300000, expected_notice_version: "${nv_1}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /notices/${notice_1}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_2: $.data.version }
            - call: "POST /notices/${notice_1}/settlements"
              payload: { requested_attorney_fees_cents: 300000, expected_notice_version: "${nv_2}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
