  # --- funding advances -----------------------------------------------------
  - method: POST
    path: "/floorplan/units/{id}/funding-advances"
    description: "Dealer requests funding on an invoice for a REGISTERED unit. No money moves and no rate is fixed yet."
    roles: [DealerPrincipal]
    code: 201
    input: [requested_amount_cents, dealer_invoice_reference]
    output: FundingAdvance
    side_effects: ["FundingAdvance.status initialised to REQUESTED", "unit_id and credit_line_id copied from the unit", "InventoryUnit REGISTERED -> PENDING_FUNDING", "Increments InventoryUnit.version by 1", "FundingAdvance.version = 1"]

  - method: POST
    path: "/floorplan/funding-advances/{id}/fund"
    description: "Disburses against the invoice under title and MSO control. Guarded by optimistic concurrency on the credit line: expected_credit_line_version must equal the line's current version."
    roles: [CreditOfficer]
    code: 200
    input: [expected_credit_line_version, disbursement_reference]
    output: FundingAdvance
    side_effects: ["Runs calculations.unit_advance_amount, writing approved_advance_amount_cents, effective_advance_rate_bps, rate_adjustment_codes and invoice_age_days_at_funding", "FundingAdvance REQUESTED -> FUNDED with funded_at and funded_by_user_id", "InventoryUnit PENDING_FUNDING -> FLOORED with advance_amount_cents and outstanding_principal_cents set to the approved advance, floored_at set, and funded_by_user_id copied", "Materialises one SCHEDULED CurtailmentObligation per non-zero CurtailmentTier of the line and inventory class, with due_date = floored_at + tier.age_days_from days and projected_principal_cents from the FORWARD_PROJECTED variant of calculations.curtailment_requirement", "Re-runs calculations.credit_line_availability", "Increments CreditLine.version by 1", "Increments InventoryUnit.version by 1", "Increments FundingAdvance.version by 1"]

  - method: POST
    path: "/floorplan/funding-advances/{id}/reject"
    description: "Declines a requested advance and returns the unit to REGISTERED so it can be re-requested."
    roles: [CreditOfficer]
    code: 200
    input: [reason_code]
    output: FundingAdvance
    side_effects: ["FundingAdvance REQUESTED -> REJECTED with reason_code recorded", "InventoryUnit PENDING_FUNDING -> REGISTERED", "No money moves and no obligation is created", "Increments InventoryUnit.version by 1", "Increments FundingAdvance.version by 1"]

  - method: POST
    path: "/floorplan/funding-advances/{id}/reverse"
    description: "Compensating transaction for a funding booked in error. Only available inside ADVANCE_REVERSAL_WINDOW_DAYS and only while nothing has been paid or observed against the unit. Guarded by optimistic concurrency on the credit line."
    roles: [CreditOfficer]
    code: 200
    input: [expected_credit_line_version, reason_code]
    output: FundingAdvance
    side_effects: ["FundingAdvance FUNDED -> REVERSED with reason_code recorded", "InventoryUnit FLOORED -> REGISTERED with advance_amount_cents and outstanding_principal_cents reset to 0 and floored_at cleared to null", "Every SCHEDULED CurtailmentObligation of the unit transitions to CANCELLED", "Re-runs calculations.credit_line_availability, restoring available_credit_cents to its pre-funding value exactly", "Increments CreditLine.version by 1", "Increments InventoryUnit.version by 1", "Increments FundingAdvance.version by 1"]

  - method: GET
    path: "/floorplan/funding-advances/{id}"
    description: "Reads one advance including the effective rate and the adjustment codes that produced it."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, DealerPrincipal, SystemOperator]
    code: 200
    input: []
    output: FundingAdvance
    side_effects: []

  - method: GET
    path: "/floorplan/funding-advances"
    description: "Lists advances. Reverse-reachability channel for FundingAdvance.unit_id and FundingAdvance.credit_line_id."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, DealerPrincipal, SystemOperator]
    code: 200
    input: ["unit_id?", "credit_line_id?", "status?", "limit?", "offset?"]
    output: FundingAdvance[]
    side_effects: []

  # --- curtailment obligations and the curtailment run ----------------------
  - method: GET
    path: "/floorplan/curtailment-obligations/{id}"
    description: "Reads one obligation, showing the FORWARD_PROJECTED figure frozen at funding beside the ASSESSED_ACTUAL figure written when it went due."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, DealerPrincipal, SystemOperator]
    code: 200
    input: []
    output: CurtailmentObligation
    side_effects: []

  - method: GET
    path: "/floorplan/curtailment-obligations"
    description: "Lists obligations. Reverse-reachability channel for CurtailmentObligation.unit_id, CurtailmentObligation.dealer_id and CurtailmentObligation.supersedes_obligation_id."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, DealerPrincipal, SystemOperator]
    code: 200
    input: ["unit_id?", "dealer_id?", "supersedes_obligation_id?", "status?", "due_before?", "limit?", "offset?"]
    output: CurtailmentObligation[]
    side_effects: []

  - method: POST
    path: "/floorplan/curtailment-runs"
    description: "Ops checkpoint. Walks the portfolio at the logical clock (or at as_of_date when supplied), maturing SCHEDULED obligations to DUE, expiring stale exception requests, and marking unpaid DUE obligations DELINQUENT with a late fee. Dealers are processed in created_at ASC order, units by floored_at ASC then created_at ASC, obligations by due_date ASC then created_at ASC."
    roles: [SystemOperator]
    code: 200
    input: ["dealer_id?", "as_of_date?"]
    output: "{ run_completed_at: string, dealer_ids_processed: string[], obligations_marked_due_count: integer, obligations_marked_delinquent_count: integer, total_required_paydown_cents: integer, units_flagged_delinquent_count: integer, exceptions_expired_count: integer }"
    side_effects: ["Every SCHEDULED obligation whose due_date <= the run date transitions to DUE, writing required_principal_cents from the ASSESSED_ACTUAL variant of calculations.curtailment_requirement and became_due_at", "Every PENDING AgingExceptionRequest whose obligation's due_date has passed transitions to EXPIRED", "Every DUE obligation past due_date + CreditLine.curtailment_grace_days with principal_paid_cents < required_principal_cents transitions to DELINQUENT, writing late_fee_cents and total_amount_due_cents from calculations.delinquency_assessment and became_delinquent_at", "Each unit owning a newly DELINQUENT obligation transitions FLOORED -> DELINQUENT_CURTAILMENT", "Dealer.delinquent_unit_count recomputed, then calculations.dealer_risk_rating re-run, rewriting Dealer.risk_score, risk_rating, audit_frequency_days and next_audit_due_at", "total_required_paydown_cents computed by calculations.curtailment_run_dealer_total with per-unit rounding before summation", "Increments the version of every mutated obligation, unit and dealer by 1"]

  # --- aging exceptions -----------------------------------------------------
  - method: POST
    path: "/floorplan/curtailment-obligations/{id}/aging-exceptions"
    description: "Dealer asks for more time on an open curtailment obligation. Requesting does not pause delinquency: an untouched request expires when the curtailment run passes the due date."
    roles: [DealerPrincipal]
    code: 201
    input: [requested_extension_days, justification_code]
    output: AgingExceptionRequest
    side_effects: ["AgingExceptionRequest.status initialised to PENDING with requested_by_user_id from X-User-ID", "The obligation is NOT altered and remains DUE or DELINQUENT", "AgingExceptionRequest.version = 1"]

  - method: GET
    path: "/floorplan/curtailment-obligations/{id}/aging-exceptions"
    description: "Lists exception requests filed against one obligation, created_at ASC. Reverse-reachability channel for AgingExceptionRequest.obligation_id."
    roles: [CreditOfficer, CreditRiskManager, DealerPrincipal, SystemOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AgingExceptionRequest[]
    side_effects: []

  - method: POST
    path: "/floorplan/aging-exceptions/{id}/decision"
    description: "Approves or denies an aging exception. decision is one of {APPROVE, DENY}; reason_code is one of {RELIEF_GRANTED, INSUFFICIENT_JUSTIFICATION, EXPOSURE_TOO_HIGH, DOCUMENTATION_MISSING}. Segregation of duties: the deciding X-User-ID must differ from the unit's funded_by_user_id. Approval supersedes the original obligation with a new one dated later."
    roles: [CreditRiskManager]
    code: 200
    input: [decision, "decided_extension_days?", reason_code]
    output: AgingExceptionRequest
    side_effects: ["AgingExceptionRequest PENDING -> APPROVED or PENDING -> DENIED with decided_by_user_id, decided_at and reason_code", "On APPROVED: the original obligation transitions to SUPERSEDED and a new SCHEDULED CurtailmentObligation is created with supersedes_obligation_id pointing at it, due_date = original due_date + decided_extension_days days, extension_days_applied set, required_principal_cents reset to 0 and late_fee_cents reset to 0", "On APPROVED: replacement_obligation_id written onto the request, InventoryUnit.aging_exception_count incremented by 1 and curtailment_extension_days_total increased by decided_extension_days", "On APPROVED for a DELINQUENT original: the unit transitions DELINQUENT_CURTAILMENT -> FLOORED when it owns no other DELINQUENT obligation, Dealer.delinquent_unit_count is recomputed and calculations.dealer_risk_rating re-runs", "On DENIED: nothing but the request changes", "Increments AgingExceptionRequest.version by 1"]

  # --- floor plan audits ----------------------------------------------------
  - method: POST
    path: "/floorplan/audits"
    description: "Schedules a physical inventory audit. ANNOUNCED audits need AUDIT_NOTICE_DAYS notice; UNANNOUNCED audits need none but must sit at least MIN_UNANNOUNCED_GAP_DAYS after the last reconciled window and may span at most three days. Windows are CLOSED intervals and may not touch."
    roles: [AuditManager]
    code: 201
    input: [dealer_id, audit_type, window_start_date, window_end_date]
    output: FloorPlanAudit
    side_effects: ["FloorPlanAudit.status initialised to SCHEDULED with all counters at 0, sot_exposure_cents 0 and observer_user_ids an empty list", "FloorPlanAudit.version = 1"]

  - method: POST
    path: "/floorplan/audits/{id}/start"
    description: "Opens the count. Freezes the scope: every unit of the dealer currently FLOORED or DELINQUENT_CURTAILMENT is in scope for this audit and no later funding joins it."
    roles: [FieldAuditor]
    code: 200
    input: []
    output: FloorPlanAudit
    side_effects: ["FloorPlanAudit SCHEDULED -> IN_PROGRESS with started_at from the logical clock", "units_in_scope_count frozen to the count of the dealer's units in FLOORED or DELINQUENT_CURTAILMENT at this instant, and units_unobserved_count initialised to the same number", "Dealer.audit_in_progress set to true", "Increments FloorPlanAudit.version by 1", "Increments Dealer.version by 1"]

  - method: POST
    path: "/floorplan/audits/{id}/observations"
    description: "Records one immutable physical-count observation with title verification. Classification and the out-of-trust flag are computed and frozen on the row; no incident is created yet."
    roles: [FieldAuditor]
    code: 201
    input: [unit_id, observed_condition, title_verified, "odometer_miles?", "sale_contract_reference?"]
    output: UnitAuditObservation
    side_effects: ["Runs calculations.observation_classification, writing classification, is_out_of_trust and unit_outstanding_principal_cents_at_observation", "observed_by_user_id set from X-User-ID and appended to FloorPlanAudit.observer_user_ids when not already present", "FloorPlanAudit.units_verified_count incremented when classification is VERIFIED, otherwise units_exception_count incremented; units_unobserved_count decremented by 1 in both cases", "Immutable row with no version field; the unit itself is not mutated here", "Increments FloorPlanAudit.version by 1"]

  - method: GET
    path: "/floorplan/audits/{id}/observations"
    description: "Lists the observations of one audit, created_at ASC. Reverse-reachability channel for UnitAuditObservation.audit_id; remains readable after the audit is aborted."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, FieldAuditor, DealerPrincipal, SystemOperator]
    code: 200
    input: ["classification?", "is_out_of_trust?", "limit?", "offset?"]
    output: UnitAuditObservation[]
    side_effects: []

  - method: POST
    path: "/floorplan/audits/{id}/reconcile"
    description: "Signs off the count and fires the sold-out-of-trust cascade. Segregation of duties: the reconciling X-User-ID must not appear in observer_user_ids."
    roles: [AuditManager]
    code: 200
    input: ["notes?"]
    output: FloorPlanAudit
    side_effects: ["Runs calculations.audit_sot_exposure, writing sot_exposure_cents", "FloorPlanAudit IN_PROGRESS -> RECONCILED_CLEAN when units_exception_count == 0, otherwise IN_PROGRESS -> RECONCILED_EXCEPTIONS, with reconciled_at and reconciled_by_user_id", "One OPEN OutOfTrustIncident created per is_out_of_trust observation in created_at ASC order, with exposure_cents from the live unit principal and cure_deadline_at = reconciled_at + SOT_CURE_DAYS days", "Each unit behind such an observation transitions FLOORED or DELINQUENT_CURTAILMENT -> SOT_OPEN and becomes eligibility_status INELIGIBLE_SOLD_OUT_OF_TRUST with ineligibility_reason_code SOLD_OUT_OF_TRUST; DAMAGE_EXCEPTION and WHOLESALE_EXCEPTION units become INELIGIBLE_DAMAGE or INELIGIBLE_WHOLESALE without leaving their funding_status", "Dealer.open_sot_incident_count and open_sot_exposure_cents recomputed, then calculations.dealer_risk_rating re-run, rewriting risk_score, risk_rating, audit_frequency_days and next_audit_due_at anchored on reconciled_at", "Re-runs calculations.credit_line_availability", "CreditLine ACTIVE -> SUSPENDED with suspension_reason_code SOT_EXPOSURE_THRESHOLD when Dealer.open_sot_exposure_cents >= SOT_SUSPENSION_EXPOSURE_CENTS, which also transitions the Dealer ACTIVE -> SUSPENDED and transitions every REQUESTED FundingAdvance of the line to VOIDED, returning each of those units PENDING_FUNDING -> REGISTERED", "Dealer.audit_in_progress set to false", "Increments the version of the audit, the dealer, the credit line and every mutated unit and advance by 1"]

  - method: POST
    path: "/floorplan/audits/{id}/abort"
    description: "Abandons an in-progress count without drawing conclusions. Observations already recorded stay readable, and the audit's window is freed for rescheduling."
    roles: [AuditManager]
    code: 200
    input: [abort_reason_code]
    output: FloorPlanAudit
    side_effects: ["FloorPlanAudit IN_PROGRESS -> ABORTED with abort_reason_code recorded", "No incident is created, no unit changes status, and the observation counters are left exactly as the observations left them", "Dealer.audit_in_progress set to false", "Increments FloorPlanAudit.version by 1", "Increments Dealer.version by 1"]

  - method: GET
    path: "/floorplan/audits/{id}"
    description: "Reads one audit including the frozen scope count, the three observation buckets and the reconciled out-of-trust exposure."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, FieldAuditor, DealerPrincipal, SystemOperator]
    code: 200
    input: []
    output: FloorPlanAudit
    side_effects: []

  - method: GET
    path: "/floorplan/audits"
    description: "Lists audits. Reverse-reachability channel for FloorPlanAudit.dealer_id."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, FieldAuditor, DealerPrincipal, SystemOperator]
    code: 200
    input: ["dealer_id?", "status?", "audit_type?", "limit?", "offset?"]
    output: FloorPlanAudit[]
    side_effects: []

  # --- out-of-trust incidents ----------------------------------------------
  - method: GET
    path: "/floorplan/out-of-trust-incidents/{id}"
    description: "Reads one out-of-trust incident with its exposure and cure deadline."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, DealerPrincipal, SystemOperator]
    code: 200
    input: []
    output: OutOfTrustIncident
    side_effects: []

  - method: GET
    path: "/floorplan/out-of-trust-incidents"
    description: "Lists incidents. Reverse-reachability channel for OutOfTrustIncident.dealer_id, unit_id, audit_id and observation_id, and the only discovery channel for incidents created by the reconcile cascade."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, DealerPrincipal, SystemOperator]
    code: 200
    input: ["dealer_id?", "unit_id?", "audit_id?", "observation_id?", "status?", "limit?", "offset?"]
    output: OutOfTrustIncident[]
    side_effects: []

  # --- remittances ----------------------------------------------------------
  - method: POST
    path: "/floorplan/remittances"
    description: "Dealer remits funds. Allocation follows the waterfall in calculations.remittance_waterfall_allocation and depends on intent. Guarded by optimistic concurrency on the dealer: expected_dealer_version must equal the dealer's current version."
    roles: [DealerPrincipal]
    code: 201
    input: [dealer_id, intent, amount_cents, payment_reference, expected_dealer_version, "target_unit_id?", "target_obligation_id?"]
    output: PaymentRemittance
    side_effects: ["Runs calculations.remittance_waterfall_allocation, writing applied_principal_cents, applied_fee_cents, applied_sot_cure_cents, unapplied_cents and allocation_breakdown", "PaymentRemittance created in RECEIVED then immediately transitioned to APPLIED when unapplied_cents == 0, otherwise to PARTIALLY_APPLIED, with applied_at set", "Every touched obligation's principal_paid_cents and fee_paid_cents increased, and each fully satisfied obligation transitions DUE -> PAID or DELINQUENT -> PAID", "Each touched unit's principal_paid_cents increased and outstanding_principal_cents decreased; a unit reaching outstanding_principal_cents == 0 with every obligation PAID or CANCELLED transitions to PAID_OFF", "A unit leaving DELINQUENT_CURTAILMENT because its last DELINQUENT obligation was paid transitions back to FLOORED", "A fully cured incident transitions OPEN -> CURED and its unit transitions SOT_OPEN -> FLOORED", "Dealer.unapplied_credit_cents increased by unapplied_cents, delinquent_unit_count and open_sot_incident_count recomputed, then calculations.dealer_risk_rating re-run", "Re-runs calculations.credit_line_availability", "Increments Dealer.version by 1, plus the version of every mutated unit and obligation"]

  - method: GET
    path: "/floorplan/remittances/{id}"
    description: "Reads one remittance with its full allocation breakdown."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, DealerPrincipal, SystemOperator]
    code: 200
    input: []
    output: PaymentRemittance
    side_effects: []

  - method: GET
    path: "/floorplan/remittances"
    description: "Lists remittances. Reverse-reachability channel for PaymentRemittance.dealer_id, target_unit_id and target_obligation_id."
    roles: [CreditOfficer, CreditRiskManager, AuditManager, DealerPrincipal, SystemOperator]
    code: 200
    input: ["dealer_id?", "target_unit_id?", "target_obligation_id?", "status?", "intent?", "limit?", "offset?"]
    output: PaymentRemittance[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication and authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of DealerPrincipal, CreditOfficer, CreditRiskManager, FieldAuditor, AuditManager, SystemOperator"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is valid but is not listed in the target endpoint's roles"
  - id: ERR_DEALER_SCOPE_VIOLATION
    http: 403
    condition: "A DealerPrincipal acts on a resource whose dealer_id differs from its X-User-ID"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, negative or zero amount where positive is required, bps above 10000, malformed ISO-8601 date, or limit/offset outside 1..200 / >= 0"

  # --- existence ------------------------------------------------------------
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "No Dealer with the given id or dealer_id"
  - id: ERR_CREDIT_LINE_NOT_FOUND
    http: 404
    condition: "No CreditLine with the given id or credit_line_id"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "No InventoryUnit with the given id, unit_id or target_unit_id"
  - id: ERR_ADVANCE_NOT_FOUND
    http: 404
    condition: "No FundingAdvance with the given id"
  - id: ERR_OBLIGATION_NOT_FOUND
    http: 404
    condition: "No CurtailmentObligation with the given id or target_obligation_id"
  - id: ERR_EXCEPTION_NOT_FOUND
    http: 404
    condition: "No AgingExceptionRequest with the given id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "No FloorPlanAudit with the given id"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "No OutOfTrustIncident with the given id"
  - id: ERR_REMEDY_NOT_FOUND
    http: 404
    condition: "No RemedyAction with the given id"
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "No PaymentRemittance with the given id"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_CREDIT_LINE_VERSION
    http: 412
    condition: "expected_credit_line_version does not equal the CreditLine's current version on POST /floorplan/funding-advances/{id}/fund or .../reverse"
  - id: ERR_STALE_DEALER_VERSION
    http: 412
    condition: "expected_dealer_version does not equal the Dealer's current version on POST /floorplan/remittances"

  # --- state preconditions --------------------------------------------------
  - id: ERR_ADVANCE_NOT_PENDING
    http: 409
    condition: "Funding or rejecting an advance that is not REQUESTED, or reversing an advance that is not FUNDED"
  - id: ERR_CREDIT_LINE_NOT_ACTIVE
    http: 409
    condition: "The governing CreditLine is not ACTIVE where ACTIVE is required, is not PENDING on activate, or is not SUSPENDED on reinstate"
  - id: ERR_DEALER_NOT_ACTIVE
    http: 409
    condition: "The Dealer is PROSPECT, SUSPENDED, DEFAULTED or TERMINATED where ACTIVE is required"
  - id: ERR_UNIT_NOT_FLOORED
    http: 409
    condition: "The InventoryUnit's funding_status is not one of the states the operation permits (REGISTERED for an advance request, PENDING_FUNDING for funding, FLOORED or DELINQUENT_CURTAILMENT for observation, ineligibility and remittance targeting)"
  - id: ERR_INVALID_TITLE_TRANSITION
    http: 409
    condition: "new_custody_status is not a legal successor of the unit's current title_custody_status, including any attempt to leave the terminal RELEASED_FOR_SALE"
  - id: ERR_AUDIT_NOT_IN_PROGRESS
    http: 409
    condition: "Starting an audit that is not SCHEDULED, or observing / reconciling / aborting an audit that is not IN_PROGRESS"
  - id: ERR_AUDIT_WINDOW_NOT_OPEN
    http: 409
    condition: "The logical clock is outside [window_start_date, window_end_date] when starting the audit"
  - id: ERR_AUDIT_NO_OBSERVATIONS
    http: 409
    condition: "Reconciling an audit with units_in_scope_count > 0 and zero observations recorded"
  - id: ERR_EXCEPTION_NOT_PENDING
    http: 409
    condition: "Deciding an AgingExceptionRequest that is already APPROVED, DENIED or EXPIRED"
  - id: ERR_OBLIGATION_NOT_OPEN
    http: 409
    condition: "Filing an aging exception against an obligation that is not DUE or DELINQUENT"
  - id: ERR_REMEDY_NOT_ISSUED
    http: 409
    condition: "Executing a RemedyAction that is already EXECUTED"

  # --- uniqueness, intervals and temporal constraints -----------------------
  - id: ERR_DUPLICATE_VIN
    http: 409
    condition: "Another non-REPOSSESSED InventoryUnit of the same dealer already carries this vin"
  - id: ERR_DUPLICATE_OBSERVATION
    http: 409
    condition: "This audit already has an observation for this unit_id"
  - id: ERR_AUDIT_WINDOW_OVERLAP
    http: 409
    condition: "The new audit's closed window intersects the closed window of another SCHEDULED, IN_PROGRESS or reconciled audit of the same dealer; touching endpoints count as an intersection"
  - id: ERR_TIER_INTERVAL_OVERLAP
    http: 409
    condition: "The new tier's half-open [age_days_from, age_days_to) interval intersects an existing tier of the same credit line and inventory class, or a second unbounded tier is added for that pair"
  - id: ERR_TIER_INTERVAL_INVALID
    http: 422
    condition: "age_days_to is not null and not strictly greater than age_days_from, or cumulative_paydown_bps is not strictly greater than that of every earlier tier of the same line and class"
  - id: ERR_AUDIT_NOTICE_TOO_SHORT
    http: 422
    condition: "An ANNOUNCED audit's window_start_date is fewer than AUDIT_NOTICE_DAYS (7) days after the logical clock date"
  - id: ERR_AUDIT_GAP_TOO_SHORT
    http: 422
    condition: "An UNANNOUNCED audit's window_start_date is fewer than MIN_UNANNOUNCED_GAP_DAYS (14) days after the window_end_date of the dealer's most recent reconciled audit"
  - id: ERR_UNANNOUNCED_WINDOW_INVALID
    http: 422
    condition: "window_end_date precedes window_start_date, or an UNANNOUNCED window spans more than three days"
  - id: ERR_INVOICE_TOO_OLD_TO_FLOOR
    http: 422
    condition: "invoice_date is more than MAX_FLOOR_AGE_DAYS (90) days before the logical clock at funding time"
  - id: ERR_ADVANCE_REVERSAL_WINDOW_CLOSED
    http: 422
    condition: "The advance was funded more than ADVANCE_REVERSAL_WINDOW_DAYS (5) days ago, or the unit has already received a payment or been observed on an audit"

  # --- title, MSO and collateral control -----------------------------------
  - id: ERR_MSO_REQUIRED_FOR_NEW_UNIT
    http: 422
    condition: "inventory_class is NEW without title_document_type MSO, or inventory_class is USED without title_document_type TITLE"
  - id: ERR_TITLE_NOT_LENDER_HELD
    http: 422
    condition: "Funding a unit whose title_custody_status is not LENDER_HELD"
  - id: ERR_TITLE_RELEASE_BLOCKED
    http: 422
    condition: "Releasing title on a unit that still carries outstanding principal, an unpaid obligation or an OPEN out-of-trust incident"
  - id: ERR_UNIT_INELIGIBLE
    http: 422
    condition: "Requesting or funding an advance on a unit whose eligibility_status is INELIGIBLE"

  # --- segregation of duties and compliance --------------------------------
  - id: ERR_SOD_EXCEPTION_APPROVER
    http: 403
    condition: "The X-User-ID deciding an aging exception equals the unit's funded_by_user_id"
  - id: ERR_SOD_AUDIT_RECONCILER
    http: 403
    condition: "The X-User-ID reconciling an audit appears in that audit's observer_user_ids"
  - id: ERR_SOD_REMEDY_EXECUTOR
    http: 403
    condition: "The X-User-ID executing a RemedyAction equals its issued_by_user_id"
  - id: ERR_REMEDY_NOT_JUSTIFIED
    http: 422
    condition: "The dealer's record does not support the requested action_type: no incident or breach for LINE_SUSPENSION, no SOT_OPEN unit for INVENTORY_REPOSSESSION, risk_rating better than C for DEMAND_LETTER, or a non-DEFAULTED dealer for TERMINATION"
  - id: ERR_REINSTATEMENT_CRITERIA_NOT_MET
    http: 422
    condition: "Reinstating a suspended line while an OPEN out-of-trust incident remains, or while the latest covenant test's dscr_dealer_adjusted is below REINSTATEMENT_MIN_DSCR_DEALER_ADJUSTED (1.4000), or with no covenant test on file"

  # --- exceptions and referential consistency ------------------------------
  - id: ERR_EXTENSION_EXCEEDS_MAX
    http: 422
    condition: "requested_extension_days outside 1..MAX_EXTENSION_DAYS_PER_REQUEST (45), decided_extension_days above requested_extension_days, or the unit's curtailment_extension_days_total would exceed MAX_EXTENSION_DAYS_PER_UNIT (60)"
  - id: ERR_EXCEPTION_LIMIT_REACHED
    http: 422
    condition: "The unit already has MAX_APPROVED_EXCEPTIONS_PER_UNIT (2) approved aging exceptions"
  - id: ERR_UNIT_HAS_OPEN_SOT
    http: 409
    condition: "Approving an aging exception on a unit that has an OPEN OutOfTrustIncident"
  - id: ERR_UNIT_NOT_IN_AUDIT_SCOPE
    http: 422
    condition: "The observed unit belongs to a different dealer, or was not in the audit's frozen scope at start time"
  - id: ERR_NO_CURTAILMENT_SCHEDULE
    http: 422
    condition: "Funding a unit whose credit line has no CurtailmentTier with cumulative_paydown_bps > 0 for the unit's inventory_class"
  - id: ERR_REMITTANCE_INTENT_TARGET_MISMATCH
    http: 422
    condition: "The remittance intent and the supplied targets disagree, or a supplied target belongs to another dealer"
  - id: ERR_NO_ALLOCATABLE_OBLIGATION
    http: 422
    condition: "A CURTAILMENT remittance finds no DUE or DELINQUENT obligation after the target filters are applied"
  - id: ERR_REMITTANCE_BELOW_PAYOFF
    http: 422
    condition: "A UNIT_PAYOFF remittance is smaller than the unit's outstanding principal plus its unpaid late fees"

  # --- fiscal capacity ------------------------------------------------------
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "The computed advance exceeds CreditLine.available_credit_cents"
  - id: ERR_CLASS_SUBLIMIT_EXCEEDED
    http: 422
    condition: "The computed advance would push class_outstanding_cents_used or class_outstanding_cents_demonstrator past the corresponding class sublimit"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: DealerPrincipal
    description: "The borrowing dealer. Registers inventory, requests funding on invoices, files aging exception requests and remits funds. Sees only its own portfolio."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /floorplan/units"
      - "POST /floorplan/units/{id}/funding-advances"
      - "POST /floorplan/curtailment-obligations/{id}/aging-exceptions"
      - "POST /floorplan/remittances"
    shared_operations:
      - "GET /floorplan/dealers/{id}"
      - "GET /floorplan/credit-lines, GET /floorplan/credit-lines/{id}, GET /floorplan/credit-lines/{id}/curtailment-tiers"
      - "GET /floorplan/units, GET /floorplan/units/{id}, GET /floorplan/units/{id}/curtailment-schedule, GET /floorplan/units/{id}/audit-observations"
      - "GET /floorplan/funding-advances, GET /floorplan/funding-advances/{id}"
      - "GET /floorplan/curtailment-obligations, GET /floorplan/curtailment-obligations/{id}, GET /floorplan/curtailment-obligations/{id}/aging-exceptions"
      - "GET /floorplan/audits, GET /floorplan/audits/{id}, GET /floorplan/audits/{id}/observations"
      - "GET /floorplan/out-of-trust-incidents, GET /floorplan/out-of-trust-incidents/{id}"
      - "GET /floorplan/remittances, GET /floorplan/remittances/{id}"
      - "GET /floorplan/dealers/{id}/covenant-tests"
    scope_note: "X-User-ID equals the Dealer.id. Every read and write is filtered to that dealer; touching another dealer's resource yields ERR_DEALER_SCOPE_VIOLATION (403) even on a GET."

  - name: CreditOfficer
    description: "Front-office lender operator. Onboards dealers, establishes and activates credit lines, configures curtailment ladders, controls title and MSO custody, funds, rejects and reverses advances, and classifies ineligible units."
    identity: "opaque"
    exclusive_operations:
      - "POST /floorplan/dealers"
      - "POST /floorplan/credit-lines"
      - "POST /floorplan/credit-lines/{id}/activate"
      - "POST /floorplan/credit-lines/{id}/curtailment-tiers"
      - "POST /floorplan/units/{id}/title-custody"
      - "POST /floorplan/funding-advances/{id}/fund"
      - "POST /floorplan/funding-advances/{id}/reject"
      - "POST /floorplan/funding-advances/{id}/reverse"
    shared_operations:
      - "POST /floorplan/units/{id}/ineligibility (shared with AuditManager)"
      - "every GET under /floorplan except none"
    scope_note: "X-User-ID is an operator identifier. It is recorded on InventoryUnit.funded_by_user_id and FundingAdvance.funded_by_user_id and is the left-hand side of the aging-exception segregation-of-duties check."

  - name: CreditRiskManager
    description: "Risk and workout operator. Files covenant tests, decides aging exceptions, reinstates suspended lines, and issues and executes default remedies."
    identity: "opaque"
    exclusive_operations:
      - "POST /floorplan/dealers/{id}/covenant-tests"
      - "POST /floorplan/aging-exceptions/{id}/decision"
      - "POST /floorplan/credit-lines/{id}/reinstate"
      - "POST /floorplan/dealers/{id}/remedy-actions"
      - "POST /floorplan/remedy-actions/{id}/execute"
    shared_operations:
      - "every GET under /floorplan"
    scope_note: "X-User-ID is an operator identifier recorded on CovenantTest.submitted_by_user_id, AgingExceptionRequest.decided_by_user_id, RemedyAction.issued_by_user_id and RemedyAction.executed_by_user_id. The issuer and executor of one remedy must be different identifiers; test fixtures use u-crm-1 to issue and u-crm-2 to execute."

  - name: FieldAuditor
    description: "Performs the physical count. Starts a scheduled audit and records immutable per-unit observations with title verification. Cannot sign off on the audit it counted."
    identity: "opaque"
    exclusive_operations:
      - "POST /floorplan/audits/{id}/start"
      - "POST /floorplan/audits/{id}/observations"
    shared_operations:
      - "GET /floorplan/dealers/{id}"
      - "GET /floorplan/units, GET /floorplan/units/{id}, GET /floorplan/units/{id}/audit-observations"
      - "GET /floorplan/audits, GET /floorplan/audits/{id}, GET /floorplan/audits/{id}/observations"
    scope_note: "X-User-ID is an operator identifier appended to FloorPlanAudit.observer_user_ids and written to UnitAuditObservation.observed_by_user_id. Test fixtures use u-fa-1 to observe."

  - name: AuditManager
    description: "Owns the audit programme. Schedules announced and unannounced counts, reconciles completed counts, aborts abandoned ones, and may classify ineligible units."
    identity: "opaque"
    exclusive_operations:
      - "POST /floorplan/audits"
      - "POST /floorplan/audits/{id}/reconcile"
      - "POST /floorplan/audits/{id}/abort"
    shared_operations:
      - "POST /floorplan/units/{id}/ineligibility (shared with CreditOfficer)"
      - "every GET under /floorplan except GET /floorplan/dealers/{id}/covenant-tests"
    scope_note: "X-User-ID is an operator identifier written to FloorPlanAudit.reconciled_by_user_id. It must not appear in the same audit's observer_user_ids; test fixtures use u-am-1 to schedule and reconcile while u-fa-1 observes."

  - name: SystemOperator
    description: "Batch and platform operator. Advances the logical clock and drives the nightly curtailment run. Never makes a credit or audit decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /floorplan/curtailment-runs"
    shared_operations:
      - "every GET under /floorplan"
    scope_note: "X-User-ID is an operator identifier and is never stored on a business entity; test fixtures use u-sys-1."

role_model_notes:
  pattern: "segregation_of_duties layered over peer_roles"
  separations:
    - "Funding versus forbearance: the CreditOfficer identifier that funded a unit (InventoryUnit.funded_by_user_id) may never decide an aging exception on that unit (ERR_SOD_EXCEPTION_APPROVER)."
    - "Counting versus signing off: a FieldAuditor identifier in FloorPlanAudit.observer_user_ids may never reconcile that audit (ERR_SOD_AUDIT_RECONCILER). Because the roles differ as well, the check only bites when the same X-User-ID is reused across both roles."
    - "Issuing versus executing a remedy: RemedyAction.issued_by_user_id may never equal the executing X-User-ID (ERR_SOD_REMEDY_EXECUTOR), even though both operators hold CreditRiskManager."
  no_hierarchical_override: "No role is a superset of another. A CreditOfficer cannot reconcile an audit and an AuditManager cannot fund an advance; both attempts yield ERR_UNAUTHORIZED (403)."
