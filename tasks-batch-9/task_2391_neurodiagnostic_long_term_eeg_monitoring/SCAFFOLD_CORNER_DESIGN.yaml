scaffold_corner_design:
  - section: entities
    instances:
      - name: create_monitoring_unit_returns_full_entity
        claim_type: Creation
        grounds:
          - entities.MonitoringUnit
          - endpoints.POST_/neurodiagnostics/units
        distinguishing_aspect: "POST /neurodiagnostics/units with name, bed_count and storage_quota_gb returns 201 and a body carrying every declared MonitoringUnit field, with all seven computed fields seeded (storage_used_gb 0, storage_pressure_pct 0, posture OPEN, beds_available 0, active_study_count 0, coverage_capacity 0, late_response_count 0, retention_sweep_index 0)."
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU Corner Unit", bed_count: 3, storage_quota_gb: 400.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
          assert:
            - "HTTP status 201"
            - "response_type == 'object'"
            - "MonitoringUnit.${unit_id}.name == 'EMU Corner Unit'"
            - "MonitoringUnit.${unit_id}.bed_count == 3"
            - "MonitoringUnit.${unit_id}.storage_quota_gb == 400.00"
            - "MonitoringUnit.${unit_id}.storage_used_gb == 0"
            - "MonitoringUnit.${unit_id}.storage_pressure_pct == 0"
            - "MonitoringUnit.${unit_id}.posture == OPEN"
            - "MonitoringUnit.${unit_id}.beds_available == 0"
            - "MonitoringUnit.${unit_id}.active_study_count == 0"
            - "MonitoringUnit.${unit_id}.coverage_capacity == 0"
            - "MonitoringUnit.${unit_id}.late_response_count == 0"
            - "MonitoringUnit.${unit_id}.retention_sweep_index == 0"
            - "MonitoringUnit.${unit_id}.version == 1"
            - "MonitoringUnit.${unit_id}.id is a non-empty string and created_at == 2026-08-01T00:00:00Z"

      - name: get_monitoring_unit_returns_stored_entity_with_derived_bed_count
        claim_type: Retrieval
        grounds:
          - entities.MonitoringUnit.fields.beds_available
          - endpoints.GET_/neurodiagnostics/units/{id}
        distinguishing_aspect: "GET /neurodiagnostics/units/{id} returns the stored unit and re-derives beds_available from the two Bed rows actually created (2), not from the declared bed_count (3)."
        test_recipe:
          setup:
            - "One unit 'EMU Corner Unit' with bed_count 3 and storage_quota_gb 400.00, with exactly two Bed rows created."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU Corner Unit", bed_count: 3, storage_quota_gb: 400.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-1" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-2" }
              as: UnitCoordinator
          trigger:
            - call: "GET /neurodiagnostics/units/${unit_id}"
              payload: {}
              as: Epileptologist
          assert:
            - "HTTP status 200"
            - "MonitoringUnit.${unit_id}.name == 'EMU Corner Unit'"
            - "MonitoringUnit.${unit_id}.bed_count == 3"
            - "MonitoringUnit.${unit_id}.beds_available == 2"
            - "MonitoringUnit.${unit_id}.storage_used_gb == 0"
            - "MonitoringUnit.${unit_id}.storage_pressure_pct == 0"
            - "MonitoringUnit.${unit_id}.posture == OPEN"

      - name: list_admissions_paginated_with_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/neurodiagnostics/admissions
          - response_envelope.pagination_fields
          - complexity_profile.complexity_layers.pagination_with_filtering
        distinguishing_aspect: "GET /neurodiagnostics/admissions?patient_id=A&limit=1&offset=0 returns total_count 2 with has_more true and exactly one row, while the same endpoint filtered by authorization_state AUTH_PENDING returns total_count 3 — filter and pagination compose without either overriding the other."
        test_recipe:
          setup:
            - "One unit; patient A with an APPROVED 6-day INPATIENT authorization carrying two SCHEDULED admissions; patient B with an APPROVED 3-day INPATIENT authorization carrying one SCHEDULED admission."
            - "No admission is admitted, so all three sit in clinical_state SCHEDULED x authorization_state AUTH_PENDING."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU Corner Unit", bed_count: 2, storage_quota_gb: 400.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-C-03A", display_name: "Corner A", risk_tier: "LOW" }
              as: UnitCoordinator
              captures: { patient_a: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-C-03B", display_name: "Corner B", risk_tier: "MODERATE" }
              as: UnitCoordinator
              captures: { patient_b: $.data.id }
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_a}", requested_setting: "INPATIENT_VEEG", requested_days: 6 }
              as: UnitCoordinator
              captures: { auth_a: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_a}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_a}/payer-decision"
              payload: { outcome: "APPROVE", authorized_days: 6, authorized_setting: "INPATIENT_VEEG", payer_note: "6 days" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_b}", requested_setting: "INPATIENT_VEEG", requested_days: 3 }
              as: UnitCoordinator
              captures: { auth_b: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_b}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_b}/payer-decision"
              payload: { outcome: "APPROVE", authorized_days: 3, authorized_setting: "INPATIENT_VEEG", payer_note: "3 days" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_a}", authorization_id: "${auth_a}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-02T00:00:00Z", target_event_count: 2, planned_days: 2 }
              as: UnitCoordinator
              captures: { adm_a1: $.data.id }
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_a}", authorization_id: "${auth_a}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-06T00:00:00Z", target_event_count: 2, planned_days: 2 }
              as: UnitCoordinator
              captures: { adm_a2: $.data.id }
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_b}", authorization_id: "${auth_b}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-03T00:00:00Z", target_event_count: 1, planned_days: 1 }
              as: UnitCoordinator
              captures: { adm_b1: $.data.id }
          trigger:
            - call: "GET /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_a}", limit: 1, offset: 0 }
              as: UnitCoordinator
            - call: "GET /neurodiagnostics/admissions"
              payload: { authorization_state: "AUTH_PENDING", limit: 10, offset: 0 }
              as: UnitCoordinator
          assert:
            - "first trigger call: HTTP status 200 and response_type == 'array'"
            - "first trigger call: total_count == 2"
            - "first trigger call: has_more == true"
            - "first trigger call: limit == 1 and offset == 0"
            - "first trigger call: data length == 1 and data[0].patient_id == ${patient_a}"
            - "second trigger call: total_count == 3"
            - "second trigger call: has_more == false"
            - "second trigger call: data length == 3 and every row has authorization_state == AUTH_PENDING and clinical_state == SCHEDULED"

      - name: get_patient_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_PATIENT_NOT_FOUND
          - validations.priority_4
        distinguishing_aspect: "GET /neurodiagnostics/patients/{unknown} returns ERR_PATIENT_NOT_FOUND with HTTP 404 and the error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database except one unrelated patient, proving the 404 is about the requested id and not about an empty table."
          setup_api_calls:
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-C-04", display_name: "Corner Four", risk_tier: "LOW" }
              as: UnitCoordinator
          trigger:
            - call: "GET /neurodiagnostics/patients/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: UnitCoordinator
          assert:
            - "HTTP status 404"
            - "response_type == 'error'"
            - "error_id == ERR_PATIENT_NOT_FOUND"

      - name: create_authorization_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.AuthorizationRequest.fields.requested_days
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /neurodiagnostics/authorizations without requested_days (source: input, no default) returns ERR_INVALID_REQUEST 400 and creates no AuthorizationRequest row."
        test_recipe:
          setup:
            - "One registered patient with no authorizations."
          setup_api_calls:
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-C-05", display_name: "Corner Five", risk_tier: "LOW" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_id}", requested_setting: "INPATIENT_VEEG" }
              as: UnitCoordinator
            - call: "GET /neurodiagnostics/patients/${patient_id}/authorizations"
              payload: { limit: 10, offset: 0 }
              as: UnitCoordinator
          assert:
            - "first trigger call: HTTP status 400"
            - "first trigger call: error_id == ERR_INVALID_REQUEST"
            - "second trigger call: total_count == 0"

      - name: patient_risk_tier_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Patient.fields.risk_tier
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /neurodiagnostics/patients with risk_tier 'EXTREME' (outside LOW | MODERATE | HIGH) returns ERR_INVALID_REQUEST 400; a second call with channel-style numeric violation is not needed because the enum membership check is the declared constraint."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-C-09", display_name: "Corner Nine", risk_tier: "EXTREME" }
              as: UnitCoordinator
          assert:
            - "HTTP status 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "response_type == 'error'"

      - name: create_study_below_minimum_channel_count_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Study.fields.channel_count
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /neurodiagnostics/studies with channel_count 4 violates the declared numeric range (>= 8) and returns ERR_INVALID_REQUEST 400 — the numeric-range half of the type-constraint claim, distinct from the enum half."
        test_recipe:
          setup:
            - "Unit, bed, patient with an APPROVED 5-day INPATIENT authorization, admission admitted at 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU Corner Unit", bed_count: 1, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-1" }
              as: UnitCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-C-09B", display_name: "Corner Nine B", risk_tier: "MODERATE" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_id}", requested_setting: "INPATIENT_VEEG", requested_days: 5 }
              as: UnitCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
              payload: { outcome: "APPROVE", authorized_days: 5, authorized_setting: "INPATIENT_VEEG", payer_note: "ok" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-02T00:00:00Z", target_event_count: 2, planned_days: 2 }
              as: UnitCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/admissions/${adm_id}/admit"
              payload: { bed_id: "${bed_id}" }
              as: UnitCoordinator
          trigger:
            - call: "POST /neurodiagnostics/studies"
              payload: { admission_id: "${adm_id}", channel_count: 4, modality: "INPATIENT_VEEG" }
              as: Technologist
            - call: "GET /neurodiagnostics/studies"
              payload: { admission_id: "${adm_id}", limit: 10, offset: 0 }
              as: Technologist
          assert:
            - "first trigger call: HTTP status 400"
            - "first trigger call: error_id == ERR_INVALID_REQUEST"
            - "second trigger call: total_count == 0"

      - name: marking_duration_seconds_default_applied
        claim_type: Defaults
        grounds:
          - entities.EventMarking.fields.duration_seconds
          - endpoints.POST_/neurodiagnostics/markings
        distinguishing_aspect: "POST /neurodiagnostics/markings omitting duration_seconds stores the declared default 60, and the frozen weight is 1.000 because taper_step_at_onset is 0 (below TAPER_DISCOUNT_MIN_STEP 2)."
        test_recipe:
          setup:
            - "Unit (quota 500.00), bed, patient MODERATE with an APPROVED 5-day INPATIENT authorization."
            - "Admission admitted at 2026-08-02T00:00:00Z with target_event_count 4; active shift 2026-08-02T00:00:00Z..2026-08-10T00:00:00Z with max_concurrent_studies 2."
            - "One 32-channel INPATIENT_VEEG study started at 2026-08-02T00:00:00Z and paused at 2026-08-02T02:00:00Z, leaving one closed segment [00:00, 02:00)."
            - "No TaperPlan exists, so taper_step_at_onset reads 0."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU Corner Unit", bed_count: 1, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-1" }
              as: UnitCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-C-06", display_name: "Corner Six", risk_tier: "MODERATE" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_id}", requested_setting: "INPATIENT_VEEG", requested_days: 5 }
              as: UnitCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
              payload: { outcome: "APPROVE", authorized_days: 5, authorized_setting: "INPATIENT_VEEG", payer_note: "ok" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-02T00:00:00Z", target_event_count: 4, planned_days: 2 }
              as: UnitCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/admissions/${adm_id}/admit"
              payload: { bed_id: "${bed_id}" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/technologist-shifts"
              payload: { unit_id: "${unit_id}", technologist_user_id: "tech-1", starts_at: "2026-08-02T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", max_concurrent_studies: 2 }
              as: UnitCoordinator
              captures: { shift_id: $.data.id }
            - call: "POST /neurodiagnostics/technologist-shifts/${shift_id}/activate"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/studies"
              payload: { admission_id: "${adm_id}", channel_count: 32, modality: "INPATIENT_VEEG" }
              as: Technologist
              captures: { study_id: $.data.id }
            - call: "POST /neurodiagnostics/studies/${study_id}/start"
              payload: { shift_id: "${shift_id}" }
              as: Technologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T02:00:00Z" }
              as: Technologist
            - call: "POST /neurodiagnostics/studies/${study_id}/pause"
              payload: { reason: "SEGMENT_BREAK" }
              as: Technologist
          trigger:
            - call: "POST /neurodiagnostics/markings"
              payload: { study_id: "${study_id}", onset_at: "2026-08-02T01:00:00Z", event_class: "CLINICAL_SEIZURE" }
              as: Epileptologist
              captures: { marking_id: $.data.id }
          assert:
            - "HTTP status 201"
            - "EventMarking.${marking_id}.duration_seconds == 60"
            - "EventMarking.${marking_id}.status == PROPOSED"
            - "EventMarking.${marking_id}.taper_step_at_onset == 0"
            - "EventMarking.${marking_id}.weight == 1.000"
            - "EventMarking.${marking_id}.alert_id == NULL"
            - "Admission.${adm_id}.weighted_event_count == 0 (a PROPOSED marking banks no capture credit)"

      - name: study_stored_gb_computed_field_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Study.fields.stored_gb
          - entities.Study.fields.acquired_minutes
          - calculations.study_storage_gb
        distinguishing_aspect: "POST /neurodiagnostics/studies carrying stored_gb 999.99 and acquired_minutes 5000 in the body creates the study with stored_gb 0 and acquired_minutes 0 — computed fields are derived from closed segments only and client-supplied values are ignored."
        test_recipe:
          setup:
            - "Unit, bed, patient MODERATE with an APPROVED 5-day INPATIENT authorization, admission admitted at 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU Corner Unit", bed_count: 1, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-1" }
              as: UnitCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-C-07", display_name: "Corner Seven", risk_tier: "MODERATE" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_id}", requested_setting: "INPATIENT_VEEG", requested_days: 5 }
              as: UnitCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
              payload: { outcome: "APPROVE", authorized_days: 5, authorized_setting: "INPATIENT_VEEG", payer_note: "ok" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-02T00:00:00Z", target_event_count: 4, planned_days: 2 }
              as: UnitCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/admissions/${adm_id}/admit"
              payload: { bed_id: "${bed_id}" }
              as: UnitCoordinator
          trigger:
            - call: "POST /neurodiagnostics/studies"
              payload: { admission_id: "${adm_id}", channel_count: 32, modality: "INPATIENT_VEEG", stored_gb: 999.99, acquired_minutes: 5000, data_state: "ARCHIVED" }
              as: Technologist
              captures: { study_id: $.data.id }
          assert:
            - "HTTP status 201"
            - "Study.${study_id}.stored_gb == 0"
            - "Study.${study_id}.acquired_minutes == 0"
            - "Study.${study_id}.closed_segment_count == 0"
            - "Study.${study_id}.data_state == ONLINE"
            - "Study.${study_id}.channel_count == 32 and modality == INPATIENT_VEEG"
            - "MonitoringUnit.${unit_id}.storage_used_gb == 0 and storage_pressure_pct == 0"

      - name: intervention_system_fields_generated_and_input_ignored
        claim_type: System Fields
        grounds:
          - entities.SafetyIntervention.fields.nurse_user_id
          - entities.SafetyIntervention.fields.recorded_at
          - endpoints.POST_/neurodiagnostics/alerts/{id}/interventions
        distinguishing_aspect: "POST /neurodiagnostics/alerts/{id}/interventions issued by X-User-ID 'nurse-7' at logical clock 2026-08-02T00:14:00Z stamps nurse_user_id 'nurse-7' and recorded_at 2026-08-02T00:14:00Z, ignoring the nurse_user_id 'spoofed-nurse' and recorded_at 2020-01-01T00:00:00Z supplied in the body."
        test_recipe:
          setup:
            - "Unit (quota 500.00), bed, patient MODERATE with an APPROVED 5-day INPATIENT authorization; admission admitted at 2026-08-02T00:00:00Z; active shift with max_concurrent_studies 2."
            - "32-channel INPATIENT_VEEG study ACQUIRING; alert raised at 2026-08-02T00:10:00Z (hour 0 is a NIGHT_HOURS_UTC hour, so response_deadline_minutes = max(2, min(15, 6 + 0 + 0 + 1)) = 7)."
            - "Logical clock advanced to 2026-08-02T00:14:00Z before the intervention, giving latency_minutes 4."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU Corner Unit", bed_count: 1, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/beds"
              payload: { unit_id: "${unit_id}", label: "EMU-1" }
              as: UnitCoordinator
              captures: { bed_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-C-08", display_name: "Corner Eight", risk_tier: "MODERATE" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations"
              payload: { patient_id: "${patient_id}", requested_setting: "INPATIENT_VEEG", requested_days: 5 }
              as: UnitCoordinator
              captures: { auth_id: $.data.id }
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
              payload: { outcome: "APPROVE", authorized_days: 5, authorized_setting: "INPATIENT_VEEG", payer_note: "ok" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/admissions"
