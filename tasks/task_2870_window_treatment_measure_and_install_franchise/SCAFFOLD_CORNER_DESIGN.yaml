        distinguishing_aspect: "The second /return is refused by the CHECKOUT's status (ERR_CHECKOUT_NOT_OPEN), not by the kit's - the kit is legitimately AVAILABLE again by then, so an implementation that gates on the kit would wrongly accept the replay and double-count loan_count."
