# =============================================================================
# PRD Benchmark Seed Tables — task_3097
# Domain: Clearing, Netting and Settlement Participant Operations (DTCC)
# =============================================================================

scenario: |
  Clearing, Netting and Settlement Participant Operations (DTCC): participant
  membership with financial standards and clearing fund deposit requirements,
  trade submission and comparison with locked-in and matched trade processing,
  multilateral netting reducing settlement obligations to a single net position
  per security, settlement obligation funding, delivery versus payment and fail
  management with mark-to-market, clearing fund sizing based on participant risk
  and volatility, book-entry securities custody with position servicing across
  corporate events, participant default management with liquidation and loss
  allocation, settlement cycle timeline compression and affirmation deadlines

domain_name: clearing-netting-settlement
api_prefix: /clearing

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Multi-party negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - selector_policy
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: saga

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the clearing member" }
      - { name: lei, type: string, source: input, description: "Legal Entity Identifier; unique across participants; immutable after creation" }
      - { name: participant_class, type: enum, source: input, description: "BANK | BROKER_DEALER | CUSTODIAN_BANK | INSURANCE_CARRIER" }
      - { name: membership_status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | DEFAULTED | EXPELLED" }
      - { name: net_capital_cents, type: integer, source: input, description: "Net capital at the most recent financial-standard review" }
      - { name: required_min_net_capital_cents, type: integer, source: computed, description: "Read-only; §1.3 financial_standard_minimum; recomputed on every financial-review mutation" }
      - { name: financial_standard_status, type: enum, source: computed, description: "PASS | FAIL; derived from net_capital_cents vs required_min_net_capital_cents at the most recent review" }
      - { name: is_defaulted, type: boolean, source: system, default: false, description: "True once a default determination has been applied; never cleared except by a served liquidation" }
      - { name: requires_segregated_custody, type: boolean, source: input, default: false, description: "When true the participant must hold at least one segregated custody account before activation" }
      - { name: last_financial_review_at, type: datetime, source: system, description: "ISO 8601 UTC with three fractional digits; stamped by every financial-standard review" }

  - name: ClearingMemberDeposit
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; owning clearing member" }
      - { name: posted_amount_cents, type: integer, source: computed, description: "Read-only; §1.3 deposit_posted_balance over non-RELEASED deposits" }
      - { name: status, type: enum, source: system, description: "PENDING | SATISFIED | DEFICIENT_GRACE | DEFICIENT_DEFAULT" }

  - name: DepositTransaction
    parent: ClearingMemberDeposit
    common_fields: false
    fields:
      - { name: deposit_id, type: string, source: system, description: "FK -> ClearingMemberDeposit.id; parent deposit pool" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; posting member identified from the X-User-ID header" }
      - { name: amount_cents, type: integer, source: input, description: "Signed posting amount; positive posts collateral, negative releases collateral; must be non-zero" }
      - { name: txn_type, type: enum, source: system, description: "POST | RELEASE; derived from the sign of amount_cents" }
      - { name: reason_code, type: string, source: input, description: "Operator-supplied reason; required when amount_cents is negative" }

  - name: TradeSubmission
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; submitting clearing member identified from the X-User-ID header" }
      - { name: counterparty_participant_id, type: string, source: input, description: "FK -> Participant.id; contra clearing member; must differ from participant_id" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id; instrument being cleared" }
      - { name: side, type: enum, source: input, description: "BUY | SELL" }
      - { name: quantity, type: integer, source: input, description: "Shares or units; must be > 0" }
      - { name: trade_price_cents, type: integer, source: input, description: "Execution price per unit in cents; must be > 0" }
      - { name: trade_date, type: datetime, source: input, description: "Execution timestamp in ISO 8601 UTC, compared lexicographically against the trade-entry deadline" }
      - { name: lock_status, type: enum, source: computed, description: "Parallel dimension 1: OPEN | LOCKED_IN | DISPUTED | CANCELLED" }
      - { name: match_status, type: enum, source: computed, description: "Parallel dimension 2: UNMATCHED | MATCHED | ALLEGED | UNRESOLVED" }
      - { name: affirmation_status, type: enum, source: computed, description: "Parallel dimension 3: UNCONFIRMED | AFFIRMED | UNCONFIRMED_BREACH; placeholder-valued from submission until the affirmation deadline is resolved for this trade's settlement_date" }
      - { name: allegations_received, type: integer, source: computed, default: 0, description: "Read-only count of non-CANCELLED contra TradeSubmission rows whose (counterparty, security, side, quantity, trade_date) tuple equals this row's" }

  - name: Security
    parent: null
    common_fields: true
    fields:
      - { name: ticker, type: string, source: input, description: "Trading symbol; unique across securities; immutable" }
      - { name: cusip, type: string, source: input, description: "CUSIP identifier; unique across securities; immutable" }
      - { name: currency, type: string, source: input, default: "USD", description: "Settlement currency" }
      - { name: prev_settlement_price_cents, type: integer, source: input, description: "Prior settlement price per unit in cents; benchmark for the daily mark-to-market" }
      - { name: current_volatility_bps, type: integer, source: input, default: 0, description: "Annualised volatility in basis points; configurable input to the risk multiplier tier selection" }

  - name: CustodyAccount
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; owning clearing member" }
      - { name: account_number, type: string, source: input, description: "Book-entry account number" }
      - { name: account_type, type: enum, source: input, description: "SEGREGATED | HOUSE | PLEDGED" }
      - { name: status, type: enum, source: system, description: "OPEN | PLEDGED | FROZEN" }
      - { name: positions, type: array, source: computed, description: "Read-only nested array of position records: security_id, settled_quantity (long positive, short negative), and last_corporate_action_applied_id" }

  - name: SettlementWindow
    parent: Security
    common_fields: true
    fields:
      - { name: security_id, type: string, source: system, description: "FK -> Security.id; instrument being settled" }
      - { name: settlement_date, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD; unique per (security_id, settlement_date) among non-CLOSED windows" }
      - { name: trade_entry_deadline, type: datetime, source: input, description: "ISO 8601 UTC cut-off; trades on this security with trade_date later than this instant cannot be locked in" }
      - { name: affirmation_deadline, type: datetime, source: input, description: "ISO 8601 UTC cut-off for participant affirmation; must be strictly after trade_entry_deadline" }
      - { name: status, type: enum, source: system, description: "OPEN | NETTED | SETTLED | CLOSED; CLOSED once the cycle is closed or no admitted member remains" }

  - name: NetPosition
    parent: SettlementWindow
    common_fields: true
    fields:
      - { name: window_id, type: string, source: system, description: "FK -> SettlementWindow.id; the settlement cycle being netted" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; member whose obligations were netted" }
      - { name: security_id, type: string, source: system, description: "FK -> Security.id; copy of the window's security" }
      - { name: net_quantity, type: integer, source: computed, description: "Read-only single net quantity; positive = net long (receive), negative = net short (deliver), 0 = flat" }
      - { name: cash_delta_cents, type: integer, source: computed, description: "Read-only cash leg of the delivery-versus-payment; positive = receive cash, negative = pay cash" }
      - { name: settlement_obligation_cents, type: integer, source: computed, description: "Read-only = max(cash_delta_cents, 0); funding is not required against net receipts" }
      - { name: dvp_status, type: enum, source: computed, description: "FUNDED | DELIVERED | RECEIVED | FAILED" }
      - { name: funded_amount_cents, type: integer, source: computed, default: 0, description: "Read-only cumulative funding posted against this obligation; saturates at settlement_obligation_cents" }
      - { name: failed_at, type: datetime, source: system, description: "ISO 8601 UTC; stamped exactly once when dvp_status enters FAILED" }
      - { name: failed_at_price_cents, type: integer, source: system, description: "Read-only basis of the fail mark; stamped once at the moment the row enters FAILED, taken from security.prev_settlement_price_cents at that instant" }
      - { name: mark_to_market_cents, type: integer, source: computed, default: 0, description: "Read-only daily mark on the failed quantity; recomputed by the mark-to-market sweep" }

  - name: CorporateAction
    parent: Security
    common_fields: true
    fields:
      - { name: security_id, type: string, source: system, description: "FK -> Security.id; affected instrument" }
      - { name: action_type, type: enum, source: input, description: "SPLIT | REVERSE_SPLIT | CASH_DIVIDEND" }
      - { name: ratio_numerator, type: integer, source: input, default: 1, description: "Split ratio numerator; ignored for CASH_DIVIDEND" }
      - { name: ratio_denominator, type: integer, source: input, default: 1, description: "Split ratio denominator; must be > 0; ignored for CASH_DIVIDEND" }
      - { name: cash_rate_cents_per_unit, type: integer, source: input, default: 0, description: "Cash dividend per unit; ignored for SPLIT / REVERSE_SPLIT" }
      - { name: effective_date, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD on which the entitlement attaches" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED | APPLIED | REVERSED" }
      - { name: applied_at, type: datetime, source: system, description: "ISO 8601 UTC; stamped when the action is applied" }

  - name: ClearingFund
    parent: Security
    common_fields: true
    fields:
      - { name: security_id, type: string, source: system, description: "FK -> Security.id; the clearing fund is scoped to one instrument" }
      - { name: status, type: enum, source: system, description: "OPEN | RECOMPUTED" }
      - { name: fund_balance_cents, type: integer, source: computed, description: "Read-only aggregate of non-RELEASED fund contributions" }
      - { name: total_component_cents, type: integer, source: computed, description: "Read-only sum of the latest component for every participant in the participant_class filter" }
      - { name: last_computed_at, type: datetime, source: system, description: "ISO 8601 UTC; stamped by every sizing computation" }
      - { name: participant_class, type: enum, source: input, description: "BANK | BROKER_DEALER | CUSTODIAN_BANK | INSURANCE_CARRIER; only participants of this class are sized, and only they are debited on allocation" }
      - { name: experiences_deficit, type: boolean, source: computed, default: false, description: "Read-only; true when component_balance_cents of any sized participant's latest component is strictly negative after an allocation" }

  - name: FundComponent
    parent: ClearingFund
    common_fields: true
    fields:
      - { name: clearing_fund_id, type: string, source: system, description: "FK -> ClearingFund.id; parent fund" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; sized member (audit link)" }
      - { name: component_amount_cents, type: integer, source: computed, description: "Read-only INITIAL-FORM component; frozen at the amount first emitted for (fund, participant, generation) and never rewritten afterwards" }
      - { name: component_balance_cents, type: integer, source: computed, description: "Read-only INITIAL-FORM balance; initial component amount plus every loss allocation minus every release posted against it" }
      - { name: generation, type: integer, source: system, default: 1, description: "Monotone sizing generation; incremented for every participant of the fund's class on each recompute, never renumbered" }
      - { name: status, type: enum, source: system, description: "ASSESSED | COLLECTED | RELEASED" }

  - name: DefaultProceeding
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; the defaulting clearing member" }
      - { name: reason_code, type: input, description: "Operator-supplied reason for the default determination" }
      - { name: status, type: enum, source: system, description: "DECLARED | LIQUIDATING | LIQUIDATED | ALLOCATED" }
      - { name: liquidation_proceeds_cents, type: integer, source: computed, default: 0, description: "Read-only net cash raised by the auction; may be negative when the auction nets to a cost" }
      - { name: deficit_amount_cents, type: integer, source: computed, description: "Read-only = max(defaulter_resources_cents - liquidation_proceeds_cents, 0); the residual loss that the clearing fund must absorb. The released fund components are not netted against it." }
      - { name: defaulter_resources_cents, type: integer, source: computed, default: 0, description: "Read-only = the defaulter's posted deposit balance saturating at its outstanding non-FAILED settlement obligations; the resources consumed before the fund is asked to absorb anything" }
      - { name: allocated_total_cents, type: integer, source: computed, default: 0, description: "Read-only sum of all loss allocation transaction amounts; equals deficit_amount_cents once fully allocated" }

  - name: LossAllocationTransaction
    parent: DefaultProceeding
    common_fields: false
    fields:
      - { name: default_proceeding_id, type: string, source: system, description: "FK -> DefaultProceeding.id; parent proceeding" }
      - { name: fund_component_id, type: string, source: system, description: "FK -> FundComponent.id; the debited component row" }
      - { name: amount_cents, type: integer, source: computed, description: "Read-only signed amount; negative debits the component, positive is a remainder returned to the largest-balance component" }
      - { name: posted_at, type: datetime, source: system, description: "ISO 8601 UTC; stamped when the allocation remainder is returned" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: Participant
    initial_state: PENDING
    terminal_states: [EXPELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /clearing/participants/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "participant.membership_status == PENDING (ERR_INVALID_STATE)"
          - "participant.financial_standard_status == PASS (ERR_FINANCIAL_STANDARD_NOT_MET)"
          - "if participant.requires_segregated_custody == true, the participant has at least one CustodyAccount with account_type == SEGREGATED (ERR_SEGREGATED_CUSTODY_REQUIRED)"
        side_effects:
          - "Recompute Participant.required_min_net_capital_cents via §1.3 financial_standard_minimum"
          - "Recompute Participant.financial_standard_status"
          - "Stamp Participant.last_financial_review_at with the logical clock"
          - "Recompute ClearingMemberDeposit.status for the participant's deposit row via §1.3 deposit_posted_balance and ERR_INSUFFICIENT_DEPOSIT"
          - "Set Participant.membership_status = ACTIVE; bump Participant.version"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clearing/participants/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "participant.membership_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Set Participant.membership_status = SUSPENDED"
          - "Set ClearingMemberDeposit.status = DEFICIENT_DEFAULT for the participant's deposit row"
          - "For every TradeSubmission row with participant_id == participant.id and lock_status in {OPEN, LOCKED_IN}, set lock_status = CANCELLED and match_status = UNRESOLVED"
          - "For every other non-CANCELLED TradeSubmission row whose counterparty_participant_id == participant.id and lock_status == LOCKED_IN, set match_status = ALLEGED"
          - "For every NetPosition row with participant_id == participant.id and dvp_status != FAILED: set dvp_status = FAILED, stamp failed_at with the logical clock, stamp failed_at_price_cents from security.prev_settlement_price_cents, then recompute mark_to_market_cents via §1.3 fail_mark_to_market"
          - "Bump Participant.version"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clearing/participants/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "participant.membership_status == SUSPENDED (ERR_INVALID_STATE)"
          - "participant.financial_standard_status == PASS (ERR_FINANCIAL_STANDARD_NOT_MET)"
        side_effects:
          - "Recompute Participant.required_min_net_capital_cents via §1.3 financial_standard_minimum"
          - "Recompute Participant.financial_standard_status"
          - "Set Participant.membership_status = ACTIVE"
          - "For every ClearingFund with participant_class == participant.participant_class, recompute total_component_cents via §1.3 clearing_fund_scaling_and_cap"
          - "Bump Participant.version"

      - from: SUSPENDED
        to: DEFAULTED
        trigger: "POST /clearing/default-proceedings"
        actor: RiskOfficer
        preconditions:
          - "participant.membership_status == SUSPENDED (ERR_INVALID_STATE)"
          - "participant.financial_standard_status == FAIL (ERR_FINANCIAL_STANDARD_NOT_MET)"
        side_effects:
          - "Set Participant.membership_status = DEFAULTED and Participant.is_defaulted = true"
          - "Create a DefaultProceeding row with status DECLARED"
          - "Set ClearingMemberDeposit.status = DEFICIENT_DEFAULT for the participant's deposit row"
          - "Bump Participant.version"

      - from: DEFAULTED
        to: EXPELLED
        trigger: "POST /clearing/default-proceedings/{id}/liquidate"
        actor: RiskOfficer
        preconditions:
          - "participant.membership_status == DEFAULTED (ERR_INVALID_STATE)"
          - "the DefaultProceeding row with id == the path id has status LIQUIDATING (ERR_INVALID_STATE)"
        side_effects:
          - "Compute DefaultProceeding.liquidation_proceeds_cents via §1.3 default_liquidation_and_loss"
          - "Compute DefaultProceeding.deficit_amount_cents via §1.3 default_liquidation_and_loss"
          - "For every FundComponent with participant_id == defaulting participant, set status = RELEASED"
          - "Set DefaultProceeding.status = LIQUIDATED"
          - "Recompute every involved ClearingFund.fund_balance_cents and total_component_cents"
          - "Set Participant.membership_status = EXPELLED"
          - "For every SettlementWindow whose remaining non-CLOSED rows include a NetPosition of this participant, transition that SettlementWindow per its own machine"
          - "Bump Participant.version"

      - from: DEFAULTED
        to: EXPELLED
        trigger: "POST /clearing/default-proceedings/{id}/allocate-loss"
        actor: RiskOfficer
        preconditions:
          - "participant.membership_status == DEFAULTED (ERR_INVALID_STATE)"
          - "the DefaultProceeding row with id == the path id has status LIQUIDATED (ERR_INVALID_STATE)"
          - "the DefaultProceeding row's deficit_amount_cents > 0 (ERR_NO_ALLOCATABLE_DEFICIT)"
        side_effects:
          - "Debit every non-RELEASED FundComponent row of the affected funds via §1.3 loss_allocation_waterfall, pro rata to the CURRENT component_balance_cents"
          - "Create one LossAllocationTransaction per debited component with the signed amount"
          - "Return the rounding remainder to the largest-balance component as a positive LossAllocationTransaction per §1.3 loss_allocation_remainder_repair"
          - "Set each debited FundComponent.status = ASSESSED (or RELEASED when its balance reaches 0)"
          - "Recompute ClearingFund.fund_balance_cents, ClearingFund.total_component_cents and ClearingFund.experiences_deficit"
          - "Set DefaultProceeding.allocated_total_cents = deficit_amount_cents and DefaultProceeding.status = ALLOCATED"
          - "Set Participant.membership_status = EXPELLED"
          - "Bump Participant.version"

  # ---------------------------------------------------------------------------
  - entity: TradeSubmission
    initial_state: OPEN
    terminal_states: [CANCELLED]
    note: "Two parallel state dimensions on one row: lock_status (OPEN | LOCKED_IN | DISPUTED | CANCELLED) and match_status (UNMATCHED | MATCHED | ALLEGED | UNRESOLVED). They evolve independently: a trade may be LOCKED_IN while still UNMATCHED, or MATCHED while still OPEN. affirmation_status is a third dimension that is placeholder-valued until the deadline sweep."
    transitions:
      - from: OPEN
        to: LOCKED_IN
        trigger: "POST /clearing/trade-submissions/{id}/lock-in"
        actor: ClearingMember
        preconditions:
          - "trade.lock_status == OPEN (ERR_INVALID_STATE)"
          - "the SettlementWindow for (trade.security_id, trade.settlement_date) exists and has status OPEN (ERR_WINDOW_NOT_FOUND)"
          - "trade.trade_date is strictly before that window's trade_entry_deadline, compared as ISO 8601 strings (ERR_TRADE_ENTRY_DEADLINE_PASSED)"
          - "the submitting participant has membership_status == ACTIVE (ERR_PARTICIPANT_NOT_ACTIVE)"
          - "when the counterparty participant's membership_status is not ACTIVE, the trade's match_status becomes ALLEGED instead of MATCHED; the lock-in itself still succeeds"
        side_effects:
          - "Set trade.lock_status = LOCKED_IN"
          - "Set trade.match_status = MATCHED when the counterparty is ACTIVE and any non-CANCELLED contra TradeSubmission exists with (counterparty_participant_id == trade.participant_id, participant_id == trade.counterparty_participant_id, security_id == trade.security_id, side opposite to trade.side, quantity == trade.quantity, trade_date == trade.trade_date)"
          - "Set trade.match_status = ALLEGED when the counterparty is not ACTIVE and such a contra exists; leave match_status = UNMATCHED when no contra exists"
          - "Recompute trade.allegations_received as the count of non-CANCELLED contra rows matching that same tuple"
          - "When match_status becomes MATCHED, also set lock_status = LOCKED_IN on every one of those contra rows even if the contras are still OPEN, and recompute each contra's allegations_received"
          - "Bump TradeSubmission.version"

      - from: OPEN
        to: DISPUTED
        trigger: "POST /clearing/trade-submissions/{id}/dispute"
        actor: ClearingMember
        preconditions:
          - "trade.lock_status == OPEN (ERR_INVALID_STATE)"
          - "trade.match_status == MATCHED (ERR_NOT_MATCHED)"
        side_effects:
          - "Set trade.lock_status = DISPUTED"
          - "Set trade.match_status = UNRESOLVED"
          - "Recompute trade.allegations_received"
          - "Set match_status = UNRESOLVED on every non-CANCELLED contra row matching the trade's tuple"
          - "Bump TradeSubmission.version"

      - from: DISPUTED
        to: LOCKED_IN
        trigger: "POST /clearing/trade-submissions/{id}/resolve-dispute"
        actor: PlatformAdmin
        preconditions:
          - "trade.lock_status == DISPUTED (ERR_INVALID_STATE)"
          - "the SettlementWindow for (trade.security_id, trade.settlement_date) exists and is OPEN (ERR_WINDOW_NOT_FOUND)"
          - "the path id belongs to the lower of the two (participant_id, counterparty_participant_id) values of the disputed pair, so resolution has exactly one legal entry point (ERR_DISPUTE_RESOLUTION_NOT_OWNER)"
        side_effects:
          - "Set trade.lock_status = LOCKED_IN and trade.match_status = MATCHED"
          - "Set lock_status = LOCKED_IN and match_status = MATCHED on every non-CANCELLED contra row of the disputed tuple"
          - "Recompute allegations_received on every row of the tuple"
          - "Bump TradeSubmission.version"

      - from: LOCKED_IN
        to: OPEN
        trigger: "POST /clearing/trade-submissions/{id}/unmatch"
        actor: PlatformAdmin
        preconditions:
          - "trade.lock_status == LOCKED_IN (ERR_INVALID_STATE)"
          - "the SettlementWindow for (trade.security_id, trade.settlement_date) has status OPEN (ERR_WINDOW_ALREADY_NETTED)"
        side_effects:
          - "Set trade.lock_status = OPEN and trade.match_status = UNMATCHED"
          - "Set lock_status = OPEN and match_status = UNMATCHED on every non-CANCELLED contra row of the tuple"
          - "Recompute allegations_received on every row of the tuple"
          - "Bump TradeSubmission.version"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /clearing/trade-submissions/{id}/cancel"
        actor: ClearingMember
        preconditions:
          - "trade.lock_status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "Set trade.lock_status = CANCELLED and trade.match_status = UNRESOLVED"
          - "Recompute allegations_received on every non-CANCELLED row that matched this trade's tuple"
          - "Bump TradeSubmission.version"

      - from: LOCKED_IN
        to: CANCELLED
        trigger: "POST /clearing/trade-submissions/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "trade.lock_status == LOCKED_IN (ERR_INVALID_STATE)"
          - "the SettlementWindow for (trade.security_id, trade.settlement_date) has status OPEN (ERR_WINDOW_ALREADY_NETTED)"
        side_effects:
          - "Set trade.lock_status = CANCELLED and trade.match_status = UNRESOLVED"
          - "Set lock_status = OPEN and match_status = UNMATCHED on every non-CANCELLED contra row of the tuple not already cancelled"
          - "Recompute allegations_received on every row of the tuple"
          - "Bump TradeSubmission.version"

      - from: DISPUTED
        to: CANCELLED
        trigger: "POST /clearing/trade-submissions/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "trade.lock_status == DISPUTED (ERR_INVALID_STATE)"
          - "the SettlementWindow for (trade.security_id, trade.settlement_date) has status OPEN (ERR_WINDOW_ALREADY_NETTED)"
        side_effects:
          - "Set trade.lock_status = CANCELLED and trade.match_status = UNRESOLVED"
          - "Set lock_status = LOCKED_IN and match_status = MATCHED on every non-CANCELLED contra row of the tuple"
          - "Recompute allegations_received on every row of the tuple"
          - "Bump TradeSubmission.version"

  # ---------------------------------------------------------------------------
  - entity: SettlementWindow
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /clearing/settlement-windows/{id}/run-cycle"
        actor: PlatformAdmin
        note: "Self-loop / cyclic shape: the cycle may be run repeatedly while the window stays OPEN, refreshing the net positions each time. Re-running is only possible while the window is OPEN, which is why the transition leaves the window OPEN."
        preconditions:
          - "window.status == OPEN (ERR_INVALID_STATE)"
          - "window.affirmation_deadline is strictly after window.trade_entry_deadline (ERR_AFFIRMATION_DEADLINE_ORDER)"
        side_effects:
          - "Resolve affirmation for the window's settlement_date: every TradeSubmission whose security_id == window.security_id and whose settlement_date == window.settlement_date has affirmation_status set to AFFIRMED when it was UNCONFIRMED, and to UNCONFIRMED_BREACH when it was UNCONFIRMED_BREACH; rows already AFFIRMED are unchanged"
          - "Compute §1.3 multilateral_netting for every ACTIVE participant that has at least one LOCKED_IN or MATCHED trade on (window.security_id, window.settlement_date)"
          - "Create or replace one NetPosition row per such participant with net_quantity, cash_delta_cents and settlement_obligation_cents"
          - "Recompute every NetPosition.settlement_obligation_cents for the window"
          - "For every participant whose settlement_obligation_cents > 0, recompute ClearingMemberDeposit.status via ERR_INSUFFICIENT_DEPOSIT"
          - "Bump SettlementWindow.version"

      - from: OPEN
        to: NETTED
        trigger: "POST /clearing/settlement-windows/{id}/net"
        actor: PlatformAdmin
        preconditions:
          - "window.status == OPEN (ERR_INVALID_STATE)"
          - "window.affirmation_deadline is strictly after window.trade_entry_deadline (ERR_AFFIRMATION_DEADLINE_ORDER)"
          - "the window is open at the current logical clock; opening is refused when the logical clock is exactly at or after window.affirmation_deadline (ERR_AFFIRMATION_DEADLINE_PASSED)"
        side_effects:
          - "Resolve affirmation for the window's settlement_date: every TradeSubmission whose security_id == window.security_id and whose settlement_date == window.settlement_date has affirmation_status set to AFFIRMED when it was UNCONFIRMED, and to UNCONFIRMED_BREACH when it was UNCONFIRMED_BREACH; rows already AFFIRMED are unchanged"
          - "Compute §1.3 multilateral_netting for every ACTIVE participant that has at least one LOCKED_IN or MATCHED trade on (window.security_id, window.settlement_date)"
          - "Create or replace one NetPosition row per such participant with net_quantity, cash_delta_cents and settlement_obligation_cents"
          - "For every participant whose settlement_obligation_cents > 0, recompute ClearingMemberDeposit.status via ERR_INSUFFICIENT_DEPOSIT"
          - "Set SettlementWindow.status = NETTED and bump SettlementWindow.version"

      - from: NETTED
        to: SETTLED
        trigger: "POST /clearing/settlement-windows/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "window.status == NETTED (ERR_INVALID_STATE)"
          - "the window has at least one NetPosition row (ERR_EMPTY_NET_POSITION_SET)"
          - "every NetPosition row of the window has funded_amount_cents >= settlement_obligation_cents (ERR_OBLIGATION_UNDERFUNDED)"
          - "no NetPosition row of the window has dvp_status == FAILED whose participant has membership_status == ACTIVE at the current logical clock (ERR_WINDOW_HAS_ACTIVE_FAILS)"
        side_effects:
          - "Set NetPosition.dvp_status = RECEIVED for every row with net_quantity > 0 and DELIVERED for every row with net_quantity < 0; rows with net_quantity == 0 keep their dvp_status"
          - "Servicing passes for all rows: apply §1.3 custody_position_servicing for every applied CorporateAction on the window's security whose effective_date is on or before the window's settlement_date"
          - "Servicing passes for all rows: recompute every NetPosition.mark_to_market_cents via §1.3 fail_mark_to_market for rows already FAILED"
          - "Set SettlementWindow.status = SETTLED and bump SettlementWindow.version"

      - from: NETTED
        to: CLOSED
        trigger: "POST /clearing/settlement-windows/{id}/close-cycle"
        actor: PlatformAdmin
        preconditions:
          - "window.status == NETTED (ERR_INVALID_STATE)"
        side_effects:
          - "Set SettlementWindow.status = CLOSED and bump SettlementWindow.version"

      - from: SETTLED
        to: CLOSED
        trigger: "POST /clearing/settlement-windows/{id}/close-cycle"
        actor: PlatformAdmin
        preconditions:
          - "window.status == SETTLED (ERR_INVALID_STATE)"
        side_effects:
          - "Set SettlementWindow.status = CLOSED and bump SettlementWindow.version"

      - from: OPEN
        to: CLOSED
        trigger: "system event: no participant with membership_status == ACTIVE remains"
        actor: system
        preconditions:
          - "no Participant exists with membership_status == ACTIVE (ERR_NOT_ALL_PARTICIPANTS_ACTIVE)"
        side_effects:
          - "Set SettlementWindow.status = CLOSED"
          - "Recompute every NetPosition.mark_to_market_cents of the window via §1.3 fail_mark_to_market"
          - "Bump SettlementWindow.version"

  # ---------------------------------------------------------------------------
  - entity: ClearingFund
    initial_state: OPEN
    terminal_states: [RECOMPUTED]
    transitions:
      - from: OPEN
        to: RECOMPUTED
        trigger: "POST /clearing/clearing-funds/{id}/recompute"
        actor: RiskOfficer
        preconditions:
          - "fund.status == OPEN (ERR_INVALID_STATE)"
          - "the fund is already RECOMPUTED (a second recompute without an intervening new NetPosition on the fund's security) is refused (ERR_FUND_ALREADY_RECOMPUTED)"
        side_effects:
          - "Compute §1.3 clearing_fund_scaling_and_cap for every participant with membership_status == ACTIVE and participant_class == fund.participant_class"
          - "Create one FundComponent row per such participant with generation = 1 and status = ASSESSED; component rows of earlier generations are left untouched"
          - "Recompute ClearingFund.total_component_cents and ClearingFund.fund_balance_cents"
          - "Stamp ClearingFund.last_computed_at with the logical clock"
          - "Set ClearingFund.status = RECOMPUTED and bump ClearingFund.version"

      - from: RECOMPUTED
        to: OPEN
        trigger: "system event: a NetPosition row is created or replaced on the fund's security after last_computed_at"
        actor: system
        note: "Cyclic shape: a fresh net position re-opens the sizing cycle so the next recompute legitimately re-sizes the fund with a new generation."
        preconditions:
          - "at least one NetPosition whose security_id == fund.security_id was created or replaced strictly after fund.last_computed_at"
        side_effects:
          - "Set ClearingFund.status = OPEN"
          - "Bump ClearingFund.version"

  # ---------------------------------------------------------------------------
  - entity: CorporateAction
    initial_state: ANNOUNCED
    terminal_states: [REVERSED]
    transitions:
      - from: ANNOUNCED
        to: APPLIED
        trigger: "POST /clearing/corporate-actions/{id}/apply"
        actor: PlatformAdmin
        preconditions:
          - "action.status == ANNOUNCED (ERR_INVALID_STATE)"
          - "action.effective_date is on or before the settlement_date of the NetPosition rows it services (ERR_ACTION_NOT_EFFECTIVE)"
          - "for CASH_DIVIDEND, no NetPosition row on any window of the security has net_quantity < 0 (ERR_SHORT_POSITION_ADJUSTMENT)"
          - "for SPLIT and REVERSE_SPLIT, every NetPosition row on every window of the security has net_quantity >= 0 (ERR_SHORT_POSITION_ADJUSTMENT)"
        side_effects:
          - "Apply §1.3 custody_position_servicing to every CustodyAccount of every participant that holds a settled_quantity in the security"
          - "Apply §1.3 custody_position_servicing to every NetPosition row whose security_id == action.security_id and whose window settlement_date is on or after action.effective_date"
          - "Stamp action.applied_at with the logical clock"
          - "Set CorporateAction.status = APPLIED and bump CorporateAction.version"

      - from: APPLIED
        to: REVERSED
        trigger: "POST /clearing/corporate-actions/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "action.status == APPLIED (ERR_INVALID_STATE)"
        side_effects:
          - "Reverse §1.3 custody_position_servicing on every affected CustodyAccount position: restore the pre-application quantity and the prior last_corporate_action_applied_id"
          - "Reverse §1.3 custody_position_servicing on every affected NetPosition row and recompute cash_delta_cents via §1.3 multilateral_netting"
          - "Set CorporateAction.status = REVERSED and bump CorporateAction.version"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: netposition-create-stale-window
    parent_entity: SettlementWindow
    write_endpoint: "POST /clearing/settlement-windows/{id}/run-cycle"
    occ_field: "expected_window_version"
    description: |
      Running the netting cycle against a SettlementWindow whose version has
      advanced since the client last observed it is rejected. Another writer
      may have legitimately re-run the cycle, which replaces the window's net
      position rows under §1.3 multilateral_netting, so the current writer's view
      of the window is stale and its intended netting result is no longer the
      one the window currently holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: fundcomponent-create-stale-fund
    parent_entity: ClearingFund
    write_endpoint: "POST /clearing/clearing-funds/{id}/recompute"
    occ_field: "expected_fund_version"
    description: |
      Re-sizing a ClearingFund whose version has advanced since the client last
      observed it is rejected. Another writer may have legitimately recomputed
      the fund, which creates a new FundComponent generation under §1.3
      clearing_fund_scaling_and_cap and supersedes the prior sizing, so the
      current writer's view of the fund is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: multilateral_netting
    trigger: "POST /clearing/settlement-windows/{id}/net, POST /clearing/settlement-windows/{id}/run-cycle, and any close of a settlement cycle whose security service window has already applied corporate actions"
    algorithm: aggregation
    formula: |
      # Inclusion set, pinned exactly.
      #   T = { t : t.lock_status == LOCKED_IN
      #             AND t.security_id == window.security_id
      #             AND t.settlement_date == window.settlement_date
      #             AND t.participant_id == participant.id
      #             AND t.match_status IN {MATCHED, UNRESOLVED} }        # settles
      #   Suspended rows (t.match_status == ALLEGED) are excluded from T on both legs but retained for comparison.
      # Cumulative trade-term accumulators, visited in trade_date ASC, tie-break created_at ASC:
      #   signed_qty        += (t.side == BUY ? +t.quantity : -t.quantity)
      #   signed_gross_cents += (t.side == BUY ? +t.quantity * t.trade_price_cents
      #                                        : -t.quantity * t.trade_price_cents)
      # Per-trade mark for the NET position's mark-to-market seed:
      #   net_position.mark_to_market_cents seed = signed_gross_cents - signed_qty * security.prev_settlement_price_cents
      # Rounding order PINNED: every trade's gross is an exact integer product; the sum is taken before any
      # rounding, and no division occurs in this calculation, so no per-trade rounding step exists.
      net_quantity        = signed_qty
      cash_delta_cents    = signed_gross_cents
      settlement_obligation_cents = max(cash_delta_cents, 0)
      return { net_quantity, cash_delta_cents, settlement_obligation_cents }
    input_set: "LOCKED_IN trades only (OPEN, DISPUTED, CANCELLED excluded); trade_date within the window's settlement_date; match_status MATCHED or UNRESOLVED included, ALLEGED excluded; trade_date ASC then created_at ASC"
    constants:
      SIGN_BUY: 1
      SIGN_SELL: -1
    precision: "integer cents; no fractional step; round_half_up never applied"
    variants:
      - name: net_position_convention
        when: "the clearing house reports a single net position per participant per security (the settled convention)"
        difference: "opposite-side trades combine into net_quantity and cash_delta_cents is the signed sum of trade grosses; settlement_obligation_cents = max(cash_delta_cents, 0)"
      - name: gross_position_convention
        when: "the clearing house reports the receive and deliver legs separately (the reporting convention)"
        difference: "gross_receive_quantity = sum of BUY quantities and gross_deliver_quantity = sum of SELL quantities; identical trades yield net_quantity == gross_receive_quantity - gross_deliver_quantity but settlement_obligation_cents is instead reported as gross_deliver_quantity * trade_price_cents, which diverges from the net convention whenever any BUY exists"

  - name: fail_mark_to_market
    trigger: "Daily mark-to-market sweep: POST /clearing/net-positions/{id}/fund (mark_to_market_only), and the system services on SettlementWindow settle and on participant suspension"
    algorithm: forward_looking
    formula: |
      # Inclusion set, pinned exactly.
      #   F = { t : t.lock_status == LOCKED_IN
      #             AND t.security_id == np.security_id
      #             AND t.participant_id == np.participant_id
      #             AND t.match_status IN {MATCHED, UNRESOLVED} }        # settlement fails mark on these
      #   Suspended rows (t.match_status == ALLEGED) are excluded from F.
      # Quantity legs are aggregated with the same direction convention as multilateral_netting,
      # visited in trade_date ASC, tie-break created_at ASC.
      signed_failed_qty = SUM over t in F of (t.side == BUY ? +t.quantity : -t.quantity)
      price_move_cents  = security.prev_settlement_price_cents - np.failed_at_price_cents
      mark_to_market_cents = round_half_up( signed_failed_qty * price_move_cents / 1, 0 )
      # PINNED order: the signed quantity sum is formed first, then multiplied once by the price move,
      # then rounded once. "round each trade's mark, then sum" is explicitly NOT the algorithm.
      return { mark_to_market_cents }
    input_set: "LOCKED_IN trades of the participant on the security, match_status MATCHED or UNRESOLVED; ALLEGED and non-LOCKED_IN rows excluded; trade_date ASC then created_at ASC"
    constants:
      MARK_BASELINE_FIELD: "failed_at_price_cents"
    precision: "integer cents, round_half_up, applied exactly once after the quantity aggregation"
    variants:
      - name: forward_settlement_mark
        when: "the house marks the fail forward to the current settlement price (the risk convention)"
        difference: "price_move_cents = prev_settlement_price_cents - failed_at_price_cents, so a price fall makes a net-long fail report a negative mark"
      - name: prior_day_mark
        when: "the house marks the fail at the fail-date price with no price move (the reconciliation convention)"
        difference: "mark_to_market_cents == 0 for every fail regardless of quantity, so identical trades produce 0 instead of signed_failed_qty * price_move_cents"

  - name: clearing_fund_scaling_and_cap
    trigger: "POST /clearing/clearing-funds/{id}/recompute, and recompute of total_component_cents on participant suspension, reinstatement, activation or liquidation"
    algorithm: threshold
    formula: |
      # Multiple inputs with nested min/max and a state branch.
      open_risk_cents = SUM over F of (t.side == BUY ? +t.quantity * t.trade_price_cents
                                                     : -t.quantity * t.trade_price_cents)
        where F = { t : t.lock_status == LOCKED_IN
                      AND t.match_status IN {MATCHED, UNRESOLVED}
                      AND t.participant_id == participant.id
                      AND t.security_id == fund.security_id }
      open_risk_cents = abs(open_risk_cents)
      if participant.financial_standard_status == FAIL:
          net_capital_floor_cents = participant.required_min_net_capital_cents
      else:
          net_capital_floor_cents = 0
      volatility_multiplier_bps = 15000 if security.current_volatility_bps > 2500 else 10000
      # PINNED rounding order: the single division is rounded once, immediately after the multiply and
      # before either clamp. The MIN_COMPONENT clamp is applied before the MAX_COMPONENT clamp, and the
      # net-capital floor is applied last. "Clamp then round", "round the multiplier first", and
      # "apply MAX before MIN" are all explicitly NOT the algorithm and yield different cents.
      stacked_cents = round_half_up( open_risk_cents * volatility_multiplier_bps / 10000, 0 )
      stacked_cents = max( 250000,  min(stacked_cents, 50000000) )    # MIN_COMPONENT then MAX_COMPONENT
      component_amount_cents = max( stacked_cents, net_capital_floor_cents )
      return { component_amount_cents, stacked_cents, net_capital_floor_cents }
    input_set: "ACTIVE participants of fund.participant_class; open risk counted over LOCKED_IN trades with match_status MATCHED or UNRESOLVED on the fund's security only"
    constants:
      VOLATILITY_ELEVATED_BPS: 2500
      MULTIPLIER_ELEVATED_BPS: 15000
      MULTIPLIER_BASE_BPS: 10000
      MIN_COMPONENT_CENTS: 250000
      MAX_COMPONENT_CENTS: 50000000
    precision: "integer cents, round_half_up, applied at each named rounding site in the order shown"
    variants:
      - name: tiered_stacked_cap
        when: "the house applies the volatility multiplier tier first, then the min/max clamps (the sizing convention)"
        difference: "component_amount_cents = max( min( max( round(open_risk * multiplier / 10000), 250000 ), 50000000 ), net_capital_floor ), so a small open risk is lifted to 250000 and a large one is truncated at 50000000"
      - name: uncapped_marginal
        when: "the house applies the multiplier with no MIN_COMPONENT or MAX_COMPONENT clamp (the stress convention)"
        difference: "component_amount_cents = max( round(open_risk * multiplier / 10000), net_capital_floor ), so an open risk yielding 150000 stays 150000 rather than being lifted to 250000, and an open risk yielding 150000000 stays 150000000 rather than being truncated to 50000000"

  - name: loss_allocation_waterfall
    trigger: "POST /clearing/default-proceedings/{id}/allocate-loss"
    algorithm: waterfall_allocation
    formula: |
      deficit = default_proceeding.deficit_amount_cents
      L = the affected participants: every participant other than the defaulting participant that holds
          a non-RELEASED FundComponent row on any ClearingFund whose participant_class equals the
          defaulting participant's participant_class.
      Ordering of L is PINNED and uses no random property; the traversal tie-break is
          the latest component's created_at ASC, then the participant's legal_name ASC, and when both
          agree the participant_id is never consulted. A participant with no non-RELEASED component
          is excluded from L entirely, so the candidate set can never be empty while W > 0.
      W = SUM over p in L of latest_component(p).component_balance_cents
      if W <= 0: raise ERR_CLEARING_FUND_DEFICIT
      # Pro rata over the CURRENT balances, rounded per participant with round_half_up.
      # There is NO running clamp: the rounded debits may overshoot or undershoot the deficit by a
      # few cents, and that drift is repaired afterwards by loss_allocation_remainder_repair.
      for p in L in the pinned order:
          debit(p) = -round_half_up( deficit * latest_component(p).component_balance_cents / W, 0 )
      return { debits }
    input_set: "non-RELEASED FundComponent rows of the defaulting participant's class, excluding the defaulting participant; balances read AFTER the defaulter's own components were released"
    constants:
      WATERFALL_ORDER: "latest component created_at ASC, then participant legal_name ASC"
      ROUNDING_MODE: "round_half_up, applied once per participant; never applied to the deficit or to W"
    precision: "integer cents, round_half_up per participant; the per-participant rounding is deliberately NOT followed by a clamp, so the debited total may differ from the deficit by up to (count(L) - 1) cents until the repair runs"
    variants:
      - name: pro_rata_current_balance
        when: "each surviving member is debited in proportion to its current component balance (the standard convention)"
        difference: "debit(p) = round_half_up( deficit * latest_component(p).component_balance_cents / W, 0 ), so a member with a zero balance is debited nothing"
      - name: pro_rata_initial_assessment
        when: "each surviving member is debited in proportion to its INITIAL-FORM component amount rather than its current balance (the legacy convention)"
        difference: "debit(p) = round_half_up( deficit * latest_component(p).component_amount_cents / SUM(component_amount_cents), 0 ), so identical current balances still produce different debits whenever earlier releases left the balances different from the frozen initial amounts"

  - name: loss_allocation_remainder_repair
    trigger: "POST /clearing/default-proceedings/{id}/allocate-loss, immediately after loss_allocation_waterfall"
    algorithm: aggregation
    formula: |
      debited_total_cents = SUM over the debits produced by loss_allocation_waterfall   # signed, negative
      correction_cents = (-deficit) - debited_total_cents
      # correction_cents is the compensating term the pairing step posts. It is NEGATIVE when the rounded
      # debits undershot the deficit, and POSITIVE when they overshot. After the correction:
      #     SUM(LossAllocationTransaction.amount_cents) == -deficit        (exact)
      #     SUM over affected components of (delta component_balance_cents) == -deficit   (exact)
      # The correction is posted on the single component with the largest post-debit balance.
      # Tie-break when two components share the largest post-debit balance — pinned, no random property:
      #   the owning participant's legal_name ASC, then the component's created_at ASC.
      target = argmax over affected components of post_debit_component_balance_cents,
               tie-break the owning participant's legal_name ASC, then created_at ASC
      debit(target) = debit(target) + correction_cents
      return { correction_cents, target }
    input_set: "the debit set produced by loss_allocation_waterfall in the same request, before it is written"
    constants:
      REMAINDER_TARGET_RULE: "largest post-debit balance; tie-break owning participant legal_name ASC then created_at ASC"
    precision: "integer cents; correction_cents is exact by construction (deficit and every debit are integers, so no further rounding site exists)"
    variants:
      - name: remainder_repair_paired
        when: "the house returns the apportionment remainder to the largest-balance member so the debited total nets to zero (the servicing convention)"
        difference: "SUM of all LossAllocationTransaction.amount_cents for the proceeding == 0, and SUM of component deltas == -deficit"
      - name: remainder_dropped
        when: "the house truncates every debit and leaves the remainder unallocated (the legacy convention)"
        difference: "SUM of all LossAllocationTransaction.amount_cents for the proceeding == -remainder (strictly negative when any division was inexact), so the proceeding never fully covers the deficit"

  - name: default_liquidation_and_loss
    trigger: "POST /clearing/default-proceedings/{id}/liquidate, and POST /clearing/default-proceedings/{id}/allocate-loss"
    algorithm: aggregation
    formula: |
      # Silent-auction proceeds manager: the house runs a Vickrey (second-price) silent auction.
      # Sealed bids are posted by ClearingMembers; each sealed bid reserves the bidder's latest
      # FundComponent at min(bid_price_cents, current component_balance_cents) for as long as it is
      # the standing high bid, releasing the previous reservation.
      # On liquidation:
      bid_count = COUNT of non-withdrawn sealed bids for the proceeding
      sorted_bids = those bids ordered by bid_price_cents DESC, then the quantity at that price
                    contributes to the winner; tie-break on equal bid_price_cents is the bid's
                    placed_at ASC, then the bidder's participant legal_name ASC. The tie-break is
                    PINNED and uses no random property.
      if bid_count == 0:
          liquidation_proceeds_cents = 0
      elif bid_count == 1:
          liquidation_proceeds_cents = sorted_bids[0].bid_price_cents * sorted_bids[0].quantity
      else:
          # the settlement price is the second-highest DISTINCT bid price, and the winning quantity
          # is the total quantity bid at or above that settlement price
          high = sorted_bids[0]
          uniform_price_cents = sorted_bids[1].bid_price_cents       # Vickrey: the second-highest bid
          winning_quantity = high.quantity                            # the single high bidder's quantity
          liquidation_proceeds_cents = uniform_price_cents * winning_quantity
      # Defaulter resources consumed in order: the defaulter's released components are already returned
      # to the defaulter's estate, so the loss the fund absorbs is
      defaulter_resources_cents = the defaulting participant's posted deposit balance, saturating at
                                  the sum of settlement_obligation_cents over ALL of that participant's
                                  net positions regardless of dvp_status, so a failed row still creates
                                  resources for the defaulter's estate
      loss_after_defaulter_resources_cents = defaulter_resources_cents - liquidation_proceeds_cents
      deficit_amount_cents = max(loss_after_defaulter_resources_cents, 0)
      return { liquidation_proceeds_cents, defaulter_resources_cents, loss_after_defaulter_resources_cents, deficit_amount_cents }
    input_set: "non-withdrawn sealed bids for the proceeding; defaulter_resources_cents read over non-RELEASED DepositTransaction rows only"
    constants:
      PROCEEDS_RULE: "Vickrey second-price uniform settlement; zero bids yields zero proceeds; rounding order is term-by-term integer products, never a rounded ratio"
      LOSS_RULE: "the loss the clearing fund absorbs is defaulter_resources_cents - liquidation_proceeds_cents, floored at zero; the released fund components are NOT a separate netting term, so the compensating identity at allocate-loss is SUM(loss allocation amounts) == -deficit exactly"
    precision: "integer cents; no fractional step"
    variants:
      - name: vickrey_second_price
        when: "the house settles the auction at the second-highest sealed bid (the standard auction format)"
        difference: "proceeds = second_highest_bid_price_cents * winner_quantity, so a single bidder settles at its own price and any second bidder strictly below the high bid reduces the proceeds below the high bid price"
      - name: first_price
        when: "the house settles the auction at the highest sealed bid (the legacy format)"
        difference: "proceeds = highest_bid_price_cents * winner_quantity, strictly greater than the Vickrey result whenever a second bid exists below the high bid"

  - name: financial_standard_minimum
    trigger: "POST /clearing/participants/{id}/financial-review, and on activate / reinstate"
    algorithm: tiered_pricing
    formula: |
      # Tiered minimum net capital by participant_class, with a marginal-rate upper tier:
      base_cents = TIER_BASE[participant.participant_class]
      if base_cents >= 500000000:            # boundary is inclusive: the GREATER_OF tier applies AT the boundary
          minimum_cents = base_cents
      else:
          minimum_cents = 500000000
      required_min_net_capital_cents = minimum_cents
      return { required_min_net_capital_cents }
    input_set: "any participant (PENDING, ACTIVE, SUSPENDED, DEFAULTED or EXPELLED) — the review is an operator action, not gated on state"
    constants:
      TIER_BASE:
        BANK: 1500000000
        BROKER_DEALER: 250000000
        CUSTODIAN_BANK: 750000000
        INSURANCE_CARRIER: 1000000000
      GREATER_OF_TIER_CENTS: 500000000
    precision: "integer cents; no rounding site"
    variants:
      - name: greater_of_tier
        when: "the house applies the greater of the class base and the flat floor (the current rule)"
        difference: "required_min_net_capital_cents = max(TIER_BASE[class], 500000000), so a BROKER_DEALER is held to 500000000 rather than its 250000000 base"
      - name: class_base_only
        when: "the house applies the class base with no flat floor (the legacy rule)"
        difference: "required_min_net_capital_cents = TIER_BASE[class], so a BROKER_DEALER passes at 250000000 instead of failing until 500000000"

  - name: deposit_posted_balance
    trigger: "every DepositTransaction posting, and on activate / suspend of the owning participant"
    algorithm: aggregation
    formula: |
      # Inclusion set, pinned exactly.
      #   D = { d : d.deposit_id == deposit.id AND d.amount_cents != 0 }
      # every DepositTransaction row is append-only and immutable; txn_type is derived from the sign of amount_cents.
      posted_amount_cents = SUM over d in D of d.amount_cents
      # status is derived in the same pass, comparing against the participant's obligations:
      #   obligations = SUM over np in {np : np.participant_id == deposit.participant_id
      #                                      AND np.dvp_status != FAILED}
      #                      of np.settlement_obligation_cents
      if obligations == 0 or posted_amount_cents >= obligations:
          status = SATISFIED
      else:
          status = DEFICIENT_GRACE        # the cycle-close sweep and the netting run assign this value
      return { posted_amount_cents, obligations, status }
    input_set: "all DepositTransaction rows of the deposit, including negative RELEASE rows; zero-amount rows cannot exist (validation rejects them)"
    constants:
      GRACE_TRIGGER: "a window that reaches CLOSED while posted_amount_cents < obligations"
    precision: "integer cents; the balance is a strict integer sum, no rounding site"
    variants:
      - name: strict_cover
        when: "the house treats a deposit as sufficient only at or above the full obligation (the current rule)"
        difference: "status == SATISFIED requires posted_amount_cents >= obligations, so a balance exactly equal to obligations is SATISFIED"
      - name: buffered_cover
        when: "the house requires the full obligation plus a buffer (the legacy rule)"
        difference: "status == SATISFIED requires posted_amount_cents >= obligations + 100000, so a balance exactly equal to obligations is DEFICIENT_GRACE"

  - name: custody_position_servicing
    trigger: "POST /clearing/corporate-actions/{id}/apply, POST /clearing/corporate-actions/{id}/reverse, and on settle of a settlement cycle"
    algorithm: constraint_propagation
    formula: |
      # Applied to each target position (a CustodyAccount position or a NetPosition row) in turn.
      # Targets are visited in created_at ASC order; tie-break is the owning participant's legal_name ASC.
      # No random property participates in the servicing order.
      # The per-share entitlement is formed FIRST on the quantity leg and truncated to an integer
      # before any cash leg is computed:
      if action.action_type == SPLIT:
          adjustment_quantity = trunc_toward_zero( target.settled_quantity * action.ratio_numerator / action.ratio_denominator )
          cash_adjustment_cents = 0
          new_settled_quantity = target.settled_quantity + adjustment_quantity
      elif action.action_type == REVERSE_SPLIT:
          adjustment_quantity = -trunc_toward_zero( target.settled_quantity * (action.ratio_numerator - action.ratio_denominator) / action.ratio_numerator )
          cash_adjustment_cents = 0
          new_settled_quantity = target.settled_quantity + adjustment_quantity
      elif action.action_type == CASH_DIVIDEND:
          # the cash leg is keyed on the ALREADY-ADJUSTED quantity, not on the pre-action quantity
          adjustment_quantity = 0
          new_settled_quantity = target.settled_quantity
          cash_adjustment_cents = new_settled_quantity * action.cash_rate_cents_per_unit
      target.last_corporate_action_applied_id = action.id
      return { adjustment_quantity, cash_adjustment_cents, new_settled_quantity }
    input_set: "every CustodyAccount position in the security, and every NetPosition row whose window settlement_date is on or after action.effective_date"
    constants:
      TRUNC_MODE: "toward zero"
      TARGET_ORDER: "created_at ASC, then owning participant legal_name ASC"
    precision: "quantity is an integer truncated toward zero; cash is an exact integer product"
    variants:
      - name: proportional_entitlement
        when: "the house truncates the fractional entitlement per position (the standard rule)"
        difference: "adjustment_quantity = trunc_toward_zero(qty * num / den), so a 3-for-2 SPLIT on 1 unit yields 1 bonus unit, not 2"
      - name: fractional_carry
        when: "the house carries the fractional entitlement forward to the next action (the smoothed rule)"
        difference: "adjustment_quantity = round_half_up(qty * num / den), so a 3-for-2 SPLIT on 1 unit yields 2 bonus units and a 3-for-2 SPLIT on 3 units yields 5 rather than 4"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per the §1.7 matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every resource identified in the path exists, validated left-to-right in path order; a body-referenced participant id that does not resolve returns ERR_PARTICIPANT_NOT_FOUND and a body-referenced security id that does not resolve returns ERR_SECURITY_NOT_FOUND"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "the target resource is in the state the transition requires"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "the submitting participant is not DEFAULTED, EXPELLED or SUSPENDED; only membership_status == ACTIVE may submit, lock in, affirm or fund"
    error_id: ERR_PARTICIPANT_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /clearing/trade-submissions", "POST /clearing/trade-submissions/{id}/lock-in", "POST /clearing/trade-submissions/{id}/dispute", "POST /clearing/net-positions/{id}/fund", "POST /clearing/settlement-windows/{id}/affirm"]

  - priority: 6
    category: business_safety
    check: "a participant whose financial_standard_status == FAIL cannot be activated or reinstated, and cannot be the submitting participant of a trade submission"
    error_id: ERR_FINANCIAL_STANDARD_NOT_MET
    http_status: 409
    applies_to: ["POST /clearing/participants/{id}/activate", "POST /clearing/participants/{id}/reinstate", "POST /clearing/trade-submissions"]

  - priority: 7
    category: business_safety
    check: "when participant.requires_segregated_custody == true, the participant must hold at least one CustodyAccount with account_type == SEGREGATED before activation"
    error_id: ERR_SEGREGATED_CUSTODY_REQUIRED
    http_status: 409
    applies_to: ["POST /clearing/participants/{id}/activate"]

  - priority: 8
    category: business_safety
    check: "the submitting participant must not submit a trade whose counterparty_participant_id equals its own participant_id; self-trades are refused"
    error_id: ERR_SELF_TRADE_FORBIDDEN
    http_status: 409
    applies_to: ["POST /clearing/trade-submissions"]

  - priority: 9
    category: business_constraint
    check: "the trade's trade_date must be strictly before the trade_entry_deadline of the OPEN SettlementWindow for (security_id, settlement_date) at lock-in"
    error_id: ERR_TRADE_ENTRY_DEADLINE_PASSED
    http_status: 409
    applies_to: ["POST /clearing/trade-submissions/{id}/lock-in"]

  - priority: 10
    category: business_temporal
    check: "the opening of a settlement cycle is refused when the logical clock is at or after window.affirmation_deadline"
    error_id: ERR_AFFIRMATION_DEADLINE_PASSED
    http_status: 409
    applies_to: ["POST /clearing/settlement-windows/{id}/net"]

  - priority: 11
    category: business_temporal
    check: "window.affirmation_deadline must be strictly after window.trade_entry_deadline at window creation"
    error_id: ERR_AFFIRMATION_DEADLINE_ORDER
    http_status: 422
    applies_to: ["POST /clearing/settlement-windows"]

  - priority: 12
    category: business_temporal
    check: "a corporate action's effective_date must be on or before the settlement_date of every window it may service, and a cash dividend cannot be applied while any net position on the security is net short"
    error_id: ERR_ACTION_NOT_EFFECTIVE
    http_status: 409
    applies_to: ["POST /clearing/corporate-actions/{id}/apply"]

  - priority: 13
    category: business_referential
    check: "the dispute-resolution path id must belong to the lower of the two (participant_id, counterparty_participant_id) values of the disputed pair; otherwise the resolution has two entry points and is refused"
    error_id: ERR_DISPUTE_RESOLUTION_NOT_OWNER
    http_status: 403
    applies_to: ["POST /clearing/trade-submissions/{id}/resolve-dispute"]

  - priority: 14
    category: business_constraint
    check: "a trade may be disputed only while match_status == MATCHED, and an LOCKED_IN trade may be reverted only while its settlement window is still OPEN"
    error_id: ERR_NOT_MATCHED
    http_status: 409
    applies_to: ["POST /clearing/trade-submissions/{id}/dispute", "POST /clearing/trade-submissions/{id}/unmatch"]

  - priority: 15
    category: business_constraint
    check: "a netting or settlement operation requires an OPEN / NETTED window whose security and settlement_date yield at least one net position row"
    error_id: ERR_EMPTY_NET_POSITION_SET
    http_status: 409
    applies_to: ["POST /clearing/settlement-windows/{id}/settle"]

  - priority: 16
    category: business_constraint
    check: "every net position row of a window must have funded_amount_cents >= settlement_obligation_cents before the window may settle"
    error_id: ERR_OBLIGATION_UNDERFUNDED
    http_status: 409
    applies_to: ["POST /clearing/settlement-windows/{id}/settle"]

  - priority: 17
    category: business_constraint
    check: "a settlement window cannot settle while any of its net positions is FAILED for a participant whose membership_status == ACTIVE"
    error_id: ERR_WINDOW_HAS_ACTIVE_FAILS
    http_status: 409
    applies_to: ["POST /clearing/settlement-windows/{id}/settle"]

  - priority: 18
    category: business_fiscal
    check: "a funding posting may not push net_position.funded_amount_cents above net_position.settlement_obligation_cents"
    error_id: ERR_FUNDING_EXCEEDS_OBLIGATION
    http_status: 409
    applies_to: ["POST /clearing/net-positions/{id}/fund"]

  - priority: 19
    category: business_fiscal
    check: "a funding posting of zero, and a deposit posting of zero, are refused; the destination must have settlement_obligation_cents > 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: ["POST /clearing/net-positions/{id}/fund", "POST /clearing/deposits/{id}/postings"]

  - priority: 20
    category: business_fiscal
    check: "a deposit release must carry a non-empty reason_code and may not drive posted_amount_cents below zero"
    error_id: ERR_DEPOSIT_RELEASE_INVALID
    http_status: 409
    applies_to: ["POST /clearing/deposits/{id}/postings"]

  - priority: 21
    category: business_constraint
    check: "a clearing fund may be sized only once per generation; a second recompute without an intervening new net position on the fund's security is refused"
    error_id: ERR_FUND_ALREADY_RECOMPUTED
    http_status: 409
    applies_to: ["POST /clearing/clearing-funds/{id}/recompute"]

  - priority: 22
    category: business_constraint
    check: "loss allocation requires a liquidation that leaves a positive deficit_amount_cents"
    error_id: ERR_NO_ALLOCATABLE_DEFICIT
    http_status: 409
    applies_to: ["POST /clearing/default-proceedings/{id}/allocate-loss"]

  - priority: 23
    category: business_constraint
    check: "at lock-in the designated settlement window for the trade's (security_id, settlement_date) must already exist and be OPEN; a counterparty that is not ACTIVE does not reject the lock-in but sets the trade's match_status to ALLEGED"
    error_id: ERR_WINDOW_NOT_FOUND
    http_status: 409
    applies_to: ["POST /clearing/trade-submissions/{id}/lock-in"]

  - priority: 24
    category: business_constraint
    check: "expected_window_version / expected_fund_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /clearing/settlement-windows/{id}/run-cycle", "POST /clearing/clearing-funds/{id}/recompute"]

  - priority: 25
    category: business_constraint
    check: "every required input field must be present and of the declared type; unknown fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"

  - priority: 26
    category: business_constraint
    check: "an update must not supply a field that is immutable after creation"
    error_id: ERR_IMMUTABLE_FIELD
    http_status: 422
    applies_to: ["PUT /clearing/participants/{id}", "PUT /clearing/securities/{id}", "PUT /clearing/settlement-windows/{id}"]

  - priority: 27
    category: business_temporal
    check: "a settlement-window timeline update must not leave affirmation_deadline at or before trade_entry_deadline, and must not tighten trade_entry_deadline once trade entry has closed"
    error_id: ERR_WINDOW_DEADLINE_REGRESSION
    http_status: 422
    applies_to: ["PUT /clearing/settlement-windows/{id}"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- operational / test-driving endpoints ---------------------------------
  - method: POST
    path: "/clearing/_clock/set_current_utc"
    description: "Set the logical clock used by every deadline, effective-date and grace evaluation. The server's startup default is 2026-09-01T00:00:00Z; before any call to this endpoint the logical clock reads exactly that instant and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Every subsequent deadline comparison, effective_date comparison and grace evaluation uses the new instant"]

  # --- participants ----------------------------------------------------------
  - method: POST
    path: "/clearing/participants"
    description: "Register a new clearing member; the participant starts in PENDING."
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "lei", "participant_class", "net_capital_cents", "requires_segregated_custody?"]
    output: Participant
    side_effects: ["Create a ClearingMemberDeposit row with status PENDING", "Recompute Participant.required_min_net_capital_cents via §1.3 financial_standard_minimum", "Recompute Participant.financial_standard_status"]

  - method: GET
    path: "/clearing/participants"
    description: "List participants with filtering and pagination."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["membership_status?", "participant_class?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: GET
    path: "/clearing/participants/{id}"
    description: "Read one participant, including the computed financial-standard and deposit-derived fields."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: POST
    path: "/clearing/participants/{id}/financial-review"
    description: "Re-run the financial-standard review after a capital change; recomputes required_min_net_capital_cents, financial_standard_status and last_financial_review_at."
    roles: [RiskOfficer]
    code: 200
    input: [net_capital_cents]
    output: Participant
    side_effects: ["Recompute Participant.required_min_net_capital_cents via §1.3 financial_standard_minimum", "Recompute Participant.financial_standard_status", "Stamp Participant.last_financial_review_at", "Recompute ClearingMemberDeposit.status for the participant's deposit row via ERR_INSUFFICIENT_DEPOSIT", "Bump Participant.version"]

  - method: PUT
    path: "/clearing/participants/{id}"
    description: "Update the mutable business terms of a participant: legal_name and requires_segregated_custody. Supplying an immutable identity or system-stamped field such as lei is refused with ERR_IMMUTABLE_FIELD."
    roles: [PlatformAdmin]
    code: 200
    input: ["legal_name?", "requires_segregated_custody?"]
    output: Participant
    side_effects: ["Recompute ClearingMemberDeposit.status for the participant's deposit row via ERR_INSUFFICIENT_DEPOSIT", "Bump Participant.version"]

  - method: POST
    path: "/clearing/participants/{id}/activate"
    description: "Admit a PENDING participant to clearing membership."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["PENDING -> ACTIVE per §1.2; deposit status recompute; cascades to ClearingFund.total_component_cents"]

  - method: POST
    path: "/clearing/participants/{id}/suspend"
    description: "Suspend an ACTIVE participant; cancels its open trades, fails its net positions and recomputes its funds' totals."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["ACTIVE -> SUSPENDED per §1.2; cancel the participant's own non-terminal trades, fail its net positions, alert locked-in non-cancelled contras"]

  - method: POST
    path: "/clearing/participants/{id}/reinstate"
    description: "Return a SUSPENDED participant to ACTIVE after a passing financial review."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["SUSPENDED -> ACTIVE per §1.2; cascade to ClearingFund.total_component_cents"]

  # --- deposits --------------------------------------------------------------
  - method: GET
    path: "/clearing/participants/{id}/deposits"
    description: "List the clearing-member deposit pools belonging to a participant."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: ClearingMemberDeposit[]
    side_effects: []

  - method: POST
    path: "/clearing/deposits/{id}/postings"
    description: "Post or release collateral on a clearing-member deposit pool."
    roles: [ClearingMember]
    code: 201
    input: ["amount_cents", "reason_code?"]
    output: DepositTransaction
    side_effects: ["Recompute ClearingMemberDeposit.posted_amount_cents via §1.3 deposit_posted_balance", "Recompute ClearingMemberDeposit.status", "When the deposit is the defaulter's, recompute DefaultProceeding.defaulter_resources_cents"]

  - method: GET
    path: "/clearing/deposits"
    description: "List clearing-member deposit pools with filtering and pagination."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["participant_id?", "limit?", "offset?"]
    output: ClearingMemberDeposit[]
    side_effects: []

  - method: GET
    path: "/clearing/deposits/{id}"
    description: "Read one clearing-member deposit pool, including its computed posted balance, obligations and covered status."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: ClearingMemberDeposit
    side_effects: []

  - method: GET
    path: "/clearing/participants/{id}/deposit-postings"
    description: "List every deposit posting recorded against a participant across all of its deposit pools."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["limit?", "offset?"]
    output: DepositTransaction[]
    side_effects: []

  - method: POST
    path: "/clearing/securities/{id}/allocate-fund-cost"
    description: "Allocate a realized fund loss onto a book-entry security position held by the acting participant; debits the participant's deposit pool and recomputes the pool's covered status."
    roles: [PlatformAdmin]
    code: 200
    input: [participant_id, amount_cents, reason_code]
    output: DepositTransaction
    side_effects: ["Recompute ClearingMemberDeposit.posted_amount_cents via §1.3 deposit_posted_balance", "Recompute ClearingMemberDeposit.status", "Bump Participant.version"]

  - method: GET
    path: "/clearing/deposits/{id}/postings"
    description: "List the append-only posting ledger of a deposit pool."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["limit?", "offset?"]
    output: DepositTransaction[]
    side_effects: []

  # --- securities ------------------------------------------------------------
  - method: POST
    path: "/clearing/securities"
    description: "Register a book-entry security eligible for clearing."
    roles: [PlatformAdmin]
    code: 201
    input: ["ticker", "cusip", "currency?", "prev_settlement_price_cents", "current_volatility_bps?"]
    output: Security
    side_effects: []

  - method: GET
    path: "/clearing/securities"
    description: "List securities with pagination."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["limit?", "offset?"]
    output: Security[]
    side_effects: []

  - method: GET
    path: "/clearing/securities/{id}"
    description: "Read one security, including prev_settlement_price_cents and current_volatility_bps."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: Security
    side_effects: []

  - method: PUT
    path: "/clearing/securities/{id}"
    description: "Update the mutable market terms of a security: prev_settlement_price_cents and current_volatility_bps. Supplying an immutable identity field (ticker, cusip, currency) is refused with ERR_IMMUTABLE_FIELD."
    roles: [PlatformAdmin]
    code: 200
    input: ["prev_settlement_price_cents?", "current_volatility_bps?"]
    output: Security
    side_effects: ["Bump Security.version"]

  # --- custody ---------------------------------------------------------------
  - method: POST
    path: "/clearing/participants/{id}/custody-accounts"
    description: "Open a book-entry custody account for a participant."
    roles: [PlatformAdmin]
    code: 201
    input: [account_number, account_type]
    output: CustodyAccount
    side_effects: ["Create the account with an empty positions array"]

  - method: GET
    path: "/clearing/participants/{id}/custody-accounts"
    description: "List a participant's custody accounts and their serviced positions."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: CustodyAccount[]
    side_effects: []

  # --- settlement windows ----------------------------------------------------
  - method: POST
    path: "/clearing/settlement-windows"
    description: "Open a settlement window (a settlement cycle) for a security and settlement date, with its trade-entry and affirmation deadlines."
    roles: [PlatformAdmin]
    code: 201
    input: [security_id, settlement_date, trade_entry_deadline, affirmation_deadline]
    output: SettlementWindow
    side_effects: []

  - method: PUT
    path: "/clearing/settlement-windows/{id}"
    description: "Update the timeline of an OPEN settlement window: trade_entry_deadline and affirmation_deadline. Supplying an immutable scoping field (security_id, settlement_date) is refused with ERR_IMMUTABLE_FIELD, and a change that leaves affirmation_deadline at or before trade_entry_deadline is refused with ERR_WINDOW_DEADLINE_REGRESSION."
    roles: [PlatformAdmin]
    code: 200
    input: ["trade_entry_deadline?", "affirmation_deadline?"]
    output: SettlementWindow
    side_effects: ["Bump SettlementWindow.version"]

  - method: GET
    path: "/clearing/settlement-windows"
    description: "List settlement windows with filtering and pagination."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["security_id?", "status?", "limit?", "offset?"]
    output: SettlementWindow[]
    side_effects: []

  - method: GET
    path: "/clearing/settlement-windows/{id}"
    description: "Read one settlement window with its deadlines and status."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: SettlementWindow
    side_effects: []

  - method: POST
    path: "/clearing/settlement-windows/{id}/net"
    description: "Close trade entry and open netting: resolves affirmation, computes multilateral net positions and sets the window to NETTED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SettlementWindow
    side_effects: ["Resolve affirmation_status for the settlement date", "Compute §1.3 multilateral_netting; create or replace NetPosition rows", "Recompute ClearingMemberDeposit.status per participant", "OPEN -> NETTED per §1.2"]

  - method: POST
    path: "/clearing/settlement-windows/{id}/run-cycle"
    description: "Re-run the netting cycle while the window is still OPEN, refreshing the net positions. Requires optimistic concurrency on the window version."
    roles: [PlatformAdmin]
    code: 200
    input: [expected_window_version]
    output: SettlementWindow
    side_effects: ["Compute §1.3 multilateral_netting; create or replace NetPosition rows", "Set ClearingFund.status = OPEN for every fund on the window's security", "Increments SettlementWindow.version by 1"]

  - method: POST
    path: "/clearing/settlement-windows/{id}/settle"
    description: "Perform delivery versus payment on a NETTED window: marks rows RECEIVED / DELIVERED and runs the corporate-action servicing pass."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SettlementWindow
    side_effects: ["Mark NetPosition.dvp_status per the sign of net_quantity", "Apply §1.3 custody_position_servicing for effective corporate actions", "Recompute §1.3 fail_mark_to_market for failed rows", "NETTED -> SETTLED per §1.2"]

  - method: POST
    path: "/clearing/settlement-windows/{id}/close-cycle"
    description: "Close a settlement cycle from NETTED or SETTLED and move any under-funded participant into the grace state."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SettlementWindow
    side_effects: ["Set ClearingMemberDeposit.status = DEFICIENT_GRACE for participants whose posted_amount_cents < obligations", "Set SettlementWindow.status = CLOSED per §1.2"]

  - method: POST
    path: "/clearing/settlement-windows/{id}/affirm"
    description: "Participant self-service affirmation of its trades before the affirmation deadline."
    roles: [ClearingMember]
    code: 200
    input: []
    output: SettlementWindow
    side_effects: ["Set affirmation_status = AFFIRMED on every UNCONFIRMED trade of the acting participant on the window's (security, settlement_date)", "Bump SettlementWindow.version"]

  # --- trades ----------------------------------------------------------------
  - method: POST
    path: "/clearing/trade-submissions"
    description: "Submit a trade for clearing by the acting participant; the trade starts OPEN and the AFFIRMED / LOCKED_IN side-effect chain fires."
    roles: [ClearingMember]
    code: 201
    input: [counterparty_participant_id, security_id, side, quantity, trade_price_cents, trade_date]
    output: TradeSubmission
    side_effects: ["Set match_status = MATCHED when a contra row matches the tuple", "Set lock_status = LOCKED_IN on matched contras", "Bump TradeSubmission.version"]

  - method: GET
    path: "/clearing/trade-submissions"
    description: "List trade submissions with filtering, including by participant and by lock/match status."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["participant_id?", "counterparty_participant_id?", "security_id?", "lock_status?", "match_status?", "limit?", "offset?"]
    output: TradeSubmission[]
    side_effects: []

  - method: GET
    path: "/clearing/trade-submissions/{id}"
    description: "Read one trade submission with both parallel state dimensions, affirmation status and allegations_received."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: TradeSubmission
    side_effects: []

  - method: POST
    path: "/clearing/trade-submissions/{id}/lock-in"
    description: "Lock a trade in, matching it against any contra and cascading the lock to the contra row."
    roles: [ClearingMember]
    code: 200
    input: []
    output: TradeSubmission
    side_effects: ["OPEN -> LOCKED_IN per §1.2", "Match and cascade lock to contra rows", "Recompute allegations_received"]

  - method: POST
    path: "/clearing/trade-submissions/{id}/dispute"
    description: "Dispute a matched trade; suspends the pair from netting."
    roles: [ClearingMember]
    code: 200
    input: []
    output: TradeSubmission
    side_effects: ["OPEN -> DISPUTED per §1.2", "Set both dimensions on the whole pair", "Recompute allegations_received"]

  - method: POST
    path: "/clearing/trade-submissions/{id}/resolve-dispute"
    description: "Resolve a disputed pair using the lower participant id as the single legal entry point."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TradeSubmission
    side_effects: ["DISPUTED -> LOCKED_IN per §1.2", "Restore MATCHED on the whole pair", "Recompute allegations_received"]

  - method: POST
    path: "/clearing/trade-submissions/{id}/unmatch"
    description: "Revert a locked-in trade to OPEN while its window is still OPEN."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TradeSubmission
    side_effects: ["LOCKED_IN -> OPEN per §1.2", "Set both dimensions on the whole pair", "Recompute allegations_received"]

  - method: POST
    path: "/clearing/trade-submissions/{id}/cancel"
    description: "Cancel a trade before its window is netted; the pair's matching is cleared."
    roles: [ClearingMember, PlatformAdmin]
    code: 200
    input: []
    output: TradeSubmission
    side_effects: ["-> CANCELLED per §1.2", "Recompute allegations_received on every row of the tuple"]

  # --- net positions ---------------------------------------------------------
  - method: GET
    path: "/clearing/net-positions"
    description: "List net positions with filtering by window, participant, security or delivery-versus-payment status."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["window_id?", "participant_id?", "security_id?", "dvp_status?", "limit?", "offset?"]
    output: NetPosition[]
    side_effects: []

  - method: GET
    path: "/clearing/net-positions/{id}"
    description: "Read one net position, including its funding state and mark-to-market."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: NetPosition
    side_effects: []

  - method: GET
    path: "/clearing/participants/{id}/net-positions"
    description: "List the settlement obligations of one participant across windows."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: NetPosition[]
    side_effects: []

  - method: POST
    path: "/clearing/net-positions/{id}/fund"
    description: "Fund a settlement obligation; when mark_to_market_only is true the call performs only the daily mark-to-market recomputation."
    roles: [ClearingMember]
    code: 200
    input: ["amount_cents", "mark_to_market_only?"]
    output: NetPosition
    side_effects: ["Increment NetPosition.funded_amount_cents", "Recompute §1.3 fail_mark_to_market when mark_to_market_only is true", "When funded_amount_cents reaches settlement_obligation_cents, set ClearingMemberDeposit.status via §1.3 deposit_posted_balance"]

  # --- corporate actions -----------------------------------------------------
  - method: POST
    path: "/clearing/corporate-actions"
    description: "Announce a corporate action on a security."
    roles: [PlatformAdmin]
    code: 201
    input: ["security_id", "action_type", "ratio_numerator?", "ratio_denominator?", "cash_rate_cents_per_unit?", "effective_date"]
    output: CorporateAction
    side_effects: []

  - method: GET
    path: "/clearing/corporate-actions"
    description: "List corporate actions with filtering and pagination."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["security_id?", "status?", "limit?", "offset?"]
    output: CorporateAction[]
    side_effects: []

  - method: GET
    path: "/clearing/securities/{id}/corporate-actions"
    description: "List the corporate actions announced on a security."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: CorporateAction[]
    side_effects: []

  - method: POST
    path: "/clearing/corporate-actions/{id}/apply"
    description: "Apply a corporate action, servicing custody accounts and net positions in created_at order."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CorporateAction
    side_effects: ["Apply §1.3 custody_position_servicing to custody positions and net positions", "Stamp applied_at", "ANNOUNCED -> APPLIED per §1.2"]

  - method: POST
    path: "/clearing/corporate-actions/{id}/reverse"
    description: "Reverse an applied corporate action, restoring pre-application quantities and cash legs."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CorporateAction
    side_effects: ["Reverse §1.3 custody_position_servicing", "Recompute NetPosition.cash_delta_cents via §1.3 multilateral_netting", "APPLIED -> REVERSED per §1.2"]

  # --- clearing funds --------------------------------------------------------
  - method: POST
    path: "/clearing/clearing-funds"
    description: "Stand up a clearing fund scoped to one security and one participant class."
    roles: [RiskOfficer]
    code: 201
    input: [security_id, participant_class]
    output: ClearingFund
    side_effects: []

  - method: GET
    path: "/clearing/clearing-funds"
    description: "List clearing funds with filtering and pagination."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["security_id?", "status?", "limit?", "offset?"]
    output: ClearingFund[]
    side_effects: []

  - method: GET
    path: "/clearing/securities/{id}/clearing-funds"
    description: "List the clearing funds scoped to a security."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: ClearingFund[]
    side_effects: []

  - method: POST
    path: "/clearing/clearing-funds/{id}/recompute"
    description: "Size or re-size the clearing fund in a new generation. Requires optimistic concurrency on the fund version."
    roles: [RiskOfficer]
    code: 200
    input: [expected_fund_version]
    output: ClearingFund
    side_effects: ["Compute §1.3 clearing_fund_scaling_and_cap per participant", "Create a new FundComponent generation", "Recompute ClearingFund.total_component_cents and fund_balance_cents", "Increments ClearingFund.version by 1"]

  - method: GET
    path: "/clearing/clearing-funds/{id}"
    description: "Read one clearing fund, including its balance, total component and whether any sized participant is in deficit."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: ClearingFund
    side_effects: []

  - method: GET
    path: "/clearing/clearing-funds/{id}/components"
    description: "List the fund component rows, one per sized participant per generation."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["generation?", "limit?", "offset?"]
    output: FundComponent[]
    side_effects: []

  - method: GET
    path: "/clearing/fund-components"
    description: "List fund component rows across every fund, filterable by the parent fund."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: ["clearing_fund_id?", "participant_id?", "status?", "limit?", "offset?"]
    output: FundComponent[]
    side_effects: []

  - method: GET
    path: "/clearing/fund-components/{id}"
    description: "Read one fund component row, including its frozen INITIAL-FORM amount and its current balance."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: FundComponent
    side_effects: []

  - method: GET
    path: "/clearing/fund-components/{id}/loss-allocations"
    description: "List the loss allocation transactions that debited or restored one fund component row."
    roles: [PlatformAdmin, RiskOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: LossAllocationTransaction[]
    side_effects: []

  - method: GET
    path: "/clearing/participants/{id}/fund-components"
    description: "List a participant's fund component rows across every fund."
    roles: [PlatformAdmin, RiskOfficer, ClearingMember]
    code: 200
    input: []
    output: FundComponent[]
    side_effects: []

  # --- default proceedings ---------------------------------------------------
  - method: POST
    path: "/clearing/default-proceedings"
    description: "Declare a suspended participant in default; opens a default proceeding."
    roles: [RiskOfficer]
    code: 201
    input: [participant_id, reason_code]
    output: DefaultProceeding
    side_effects: ["SUSPENDED -> DEFAULTED per §1.2", "Create the proceeding in DECLARED", "Set ClearingMemberDeposit.status = DEFICIENT_DEFAULT", "Set Participant.is_defaulted = true"]

  - method: GET
    path: "/clearing/default-proceedings"
    description: "List default proceedings with filtering and pagination."
    roles: [PlatformAdmin, RiskOfficer]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: DefaultProceeding[]
    side_effects: []

  - method: PUT
    path: "/clearing/default-proceedings/{id}"
    description: "Advance the default proceeding one step: move a DECLARED proceeding to LIQUIDATING so the sealed-bid auction may be run. Refused with ERR_INVALID_STATE once the proceeding has left DECLARED."
    roles: [RiskOfficer]
    code: 200
    input: ["reason_code?"]
    output: DefaultProceeding
    side_effects: ["Set DefaultProceeding.status = LIQUIDATING", "Bump DefaultProceeding.version"]

  - method: GET
    path: "/clearing/participants/{id}/default-proceedings"
    description: "List the default proceedings opened against a participant."
    roles: [PlatformAdmin, RiskOfficer]
    code: 200
    input: []
    output: DefaultProceeding[]
    side_effects: []

  - method: GET
    path: "/clearing/default-proceedings/{id}"
    description: "Read one default proceeding with its auction, liquidation and loss-allocation figures."
    roles: [PlatformAdmin, RiskOfficer]
    code: 200
    input: []
    output: DefaultProceeding
    side_effects: []

  - method: POST
    path: "/clearing/default-proceedings/{id}/bids"
    description: "Place a sealed bid for the defaulting participant's book; reserves the bidder's fund component while it stands as the high bid."
    roles: [ClearingMember]
    code: 201
    input: [bid_price_cents, quantity, placed_at, fund_component_id]
    output: DefaultProceeding
    side_effects: ["Record the sealed bid", "Release the previous high bidder's reserved FundComponent", "Reserve the new high bidder's FundComponent at min(bid_price_cents, component_balance_cents)"]

  - method: POST
    path: "/clearing/default-proceedings/{id}/liquidate"
    description: "Liquidate the defaulting participant's book via the sealed-bid auction and compute the residual deficit. Refused with ERR_PROCEEDING_NOT_LIQUIDATING unless the proceeding is in LIQUIDATING."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: DefaultProceeding
    side_effects: ["Compute §1.3 default_liquidation_and_loss", "Release the defaulter's FundComponent rows", "LIQUIDATING -> LIQUIDATED per §1.2"]

  - method: POST
    path: "/clearing/default-proceedings/{id}/allocate-loss"
    description: "Allocate the residual deficit across the surviving members' fund components and expel the defaulter."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: DefaultProceeding
    side_effects: ["Debit components via §1.3 loss_allocation_waterfall", "Write LossAllocationTransaction rows", "Pair the remainder via §1.3 loss_allocation_remainder_repair", "LIQUIDATED -> ALLOCATED per §1.2"]

  - method: GET
    path: "/clearing/default-proceedings/{id}/loss-allocations"
    description: "List the loss allocation transactions written for a default proceeding, including the paired remainder entry."
    roles: [PlatformAdmin, RiskOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: LossAllocationTransaction[]
    side_effects: []

  - method: GET
    path: "/clearing/loss-allocations"
    description: "List loss allocation transactions across all proceedings, filterable by parent proceeding or by debited component."
    roles: [PlatformAdmin, RiskOfficer]
    code: 200
    input: ["default_proceeding_id?", "fund_component_id?", "limit?", "offset?"]
    output: LossAllocationTransaction[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header absent or not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the acting role is not permitted for this operation per §1.7" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "a resource named in the path does not exist, validated left-to-right" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "a referenced participant id (counterparty or path id) does not exist" }
  - { id: ERR_SECURITY_NOT_FOUND, http: 404, condition: "a referenced security id does not exist" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "no OPEN settlement window exists for the trade's (security_id, settlement_date)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in the state the requested transition requires" }
  - { id: ERR_PARTICIPANT_NOT_ACTIVE, http: 409, condition: "the acting participant is SUSPENDED, DEFAULTED or EXPELLED, or the referenced participant is not ACTIVE where ACTIVE is required" }
  - { id: ERR_FINANCIAL_STANDARD_NOT_MET, http: 409, condition: "participant.financial_standard_status == FAIL at an operation that requires PASS" }
  - { id: ERR_SEGREGATED_CUSTODY_REQUIRED, http: 409, condition: "requires_segregated_custody is true but the participant holds no SEGREGATED custody account" }
  - { id: ERR_SELF_TRADE_FORBIDDEN, http: 409, condition: "counterparty_participant_id equals the submitting participant_id" }
  - { id: ERR_NOT_MATCHED, http: 409, condition: "the trade's match_status is not MATCHED, so it cannot be disputed or reverted under that rule" }
  - { id: ERR_SHORT_POSITION_ADJUSTMENT, http: 409, condition: "a corporate action would service an account or net position holding a short quantity under a rule that forbids it" }
  - { id: ERR_TRADE_ENTRY_DEADLINE_PASSED, http: 409, condition: "trade.trade_date is at or after the window's trade_entry_deadline" }
  - { id: ERR_AFFIRMATION_DEADLINE_PASSED, http: 409, condition: "the logical clock is at or after the window's affirmation_deadline when the cycle is opened" }
  - { id: ERR_AFFIRMATION_DEADLINE_ORDER, http: 422, condition: "affirmation_deadline is not strictly after trade_entry_deadline" }
  - { id: ERR_ACTION_NOT_EFFECTIVE, http: 409, condition: "the corporate action's effective_date is after the settlement_date of a window it would service" }
  - { id: ERR_WINDOW_ALREADY_NETTED, http: 409, condition: "a trade mutation is attempted after its settlement window left OPEN" }
  - { id: ERR_WINDOW_HAS_ACTIVE_FAILS, http: 409, condition: "a window with a FAILED net position of an ACTIVE participant is asked to settle" }
  - { id: ERR_EMPTY_NET_POSITION_SET, http: 409, condition: "a settlement operation targets a window with zero net position rows" }
  - { id: ERR_OBLIGATION_UNDERFUNDED, http: 409, condition: "a net position with funded_amount_cents < settlement_obligation_cents blocks settlement" }
  - { id: ERR_FUNDING_EXCEEDS_OBLIGATION, http: 409, condition: "a funding posting would push funded_amount_cents above settlement_obligation_cents" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "a funding, posting or bid amount is zero or violates its sign rule" }
  - { id: ERR_INSUFFICIENT_DEPOSIT, http: 409, condition: "posted_amount_cents is below the participant's outstanding non-FAILED settlement obligations" }
  - { id: ERR_DEPOSIT_RELEASE_INVALID, http: 409, condition: "a negative posting lacks a reason_code or would drive posted_amount_cents below zero" }
  - { id: ERR_FUND_ALREADY_RECOMPUTED, http: 409, condition: "a clearing fund is recomputed twice with no intervening new net position on its security" }
  - { id: ERR_CLEARING_FUND_DEFICIT, http: 409, condition: "a clearing fund's component balances are exhausted so a loss allocation cannot be covered" }
  - { id: ERR_NO_ALLOCATABLE_DEFICIT, http: 409, condition: "a loss allocation is requested on a proceeding whose deficit_amount_cents is not positive" }
  - { id: ERR_PROCEEDING_NOT_LIQUIDATING, http: 409, condition: "a proceeding is advanced for liquidation while its status is not DECLARED, or the auction is run while its status is not LIQUIDATING" }
  - { id: ERR_DISPUTE_RESOLUTION_NOT_OWNER, http: 403, condition: "the dispute-resolution path id is not the lower participant id of the disputed pair" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_window_version or expected_fund_version does not equal the parent's current version" }
  - { id: ERR_IMMUTABLE_FIELD, http: 422, condition: "an update supplies a field that is immutable after creation (Participant.lei, Security.ticker / cusip / currency, SettlementWindow.security_id / settlement_date)" }
  - { id: ERR_WINDOW_DEADLINE_REGRESSION, http: 422, condition: "a settlement-window timeline update would set affirmation_deadline at or before trade_entry_deadline, or tighten trade_entry_deadline after trade entry has closed" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "a required input field is missing, mistyped, or an unknown field is supplied" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Clearing-house operations operator: participant lifecycle, securities and windows, netting and settlement cycles, corporate actions and dispute resolution. Holds no clearing-member economic role, so it never posts collateral or bids in an auction."
    identity: opaque
    exclusive_operations:
      - "POST /clearing/participants"
      - "POST /clearing/participants/{id}/activate"
      - "POST /clearing/participants/{id}/suspend"
      - "POST /clearing/participants/{id}/reinstate"
      - "POST /clearing/securities"
      - "POST /clearing/participants/{id}/custody-accounts"
      - "POST /clearing/settlement-windows"
      - "POST /clearing/settlement-windows/{id}/net"
      - "POST /clearing/settlement-windows/{id}/run-cycle"
      - "POST /clearing/settlement-windows/{id}/settle"
      - "POST /clearing/settlement-windows/{id}/close-cycle"
      - "POST /clearing/corporate-actions"
      - "POST /clearing/corporate-actions/{id}/apply"
      - "POST /clearing/corporate-actions/{id}/reverse"
      - "POST /clearing/trade-submissions/{id}/resolve-dispute"
      - "POST /clearing/trade-submissions/{id}/unmatch"
      - "POST /clearing/_clock/set_current_utc"
    shared_operations:
      - "GET /clearing/participants"
      - "GET /clearing/participants/{id}"
      - "GET /clearing/securities"
      - "GET /clearing/settlement-windows"
      - "GET /clearing/trade-submissions"
      - "GET /clearing/net-positions"
      - "GET /clearing/corporate-actions"
      - "GET /clearing/clearing-funds"
      - "POST /clearing/trade-submissions/{id}/cancel"

  - name: ClearingMember
    description: "A clearing member firm acting as itself; the X-User-ID equals the id of the Participant instance it acts as."
    identity: entity_backed:Participant
    exclusive_operations:
      - "POST /clearing/trade-submissions"
      - "POST /clearing/trade-submissions/{id}/lock-in"
      - "POST /clearing/trade-submissions/{id}/dispute"
      - "POST /clearing/deposits/{id}/postings"
      - "POST /clearing/net-positions/{id}/fund"
      - "POST /clearing/settlement-windows/{id}/affirm"
      - "POST /clearing/default-proceedings/{id}/bids"
    shared_operations:
      - "POST /clearing/trade-submissions/{id}/cancel"
      - "GET /clearing/participants/{id}"
      - "GET /clearing/trade-submissions"
      - "GET /clearing/net-positions"
      - "GET /clearing/clearing-funds"

  - name: RiskOfficer
    description: "Clearing-risk operator: financial-standard reviews, clearing-fund sizing and the default-management workflow. Segregated from PlatformAdmin so that the operator who admits a member is not the operator who sizes its fund."
    identity: opaque
    exclusive_operations:
      - "POST /clearing/participants/{id}/financial-review"
      - "POST /clearing/clearing-funds"
      - "POST /clearing/clearing-funds/{id}/recompute"
      - "POST /clearing/default-proceedings"
      - "POST /clearing/default-proceedings/{id}/liquidate"
      - "POST /clearing/default-proceedings/{id}/allocate-loss"
    shared_operations:
      - "GET /clearing/participants"
      - "GET /clearing/participants/{id}"
      - "GET /clearing/clearing-funds"
      - "GET /clearing/settlement-windows"
      - "GET /clearing/net-positions"
      - "GET /clearing/default-proceedings"