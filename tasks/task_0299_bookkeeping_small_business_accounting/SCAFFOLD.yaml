# =============================================================================
# Scaffold: Bookkeeping & Small-Business Accounting (task_0299) — Expert band
# =============================================================================

scenario: |
  299. Bookkeeping & Small-Business Accounting: chart of accounts, bank-feed
  transaction categorization, invoice/bill entry, reconciliation, sales-tax
  tracking, monthly-close checklist, financial-statement generation, 1099 prep

domain_name: bookkeeping-small-business-accounting
api_prefix: /ledger

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  # flat: peer entities under a shared /ledger prefix, linked by FK fields in the
  # body (company_id, account_id, period_id, ...). No nested URL ownership chain;
  # every collection is /ledger/<segment>.
  state_machine_shape: parallel
  # Invoice carries two independent axes (delivery_status x payment_status);
  # BankFeedTransaction and AccountingPeriod add cyclic loops. Pipelines elsewhere.
  relationship_patterns:
    - one_to_many        # Company -> Account/Period/Invoice/Bill/...
    - self_referential   # Account.parent_account_id -> Account.id (sub-accounts)
    - cross_aggregate    # JournalLine references Account; BankFeedTransaction references JournalEntry
  role_model: segregation_of_duties
  # Maker-checker: the user who drafts a JournalEntry cannot post it. Reopen and
  # void-posted are reserved to Owner. Auditor is read-only.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Company
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered business name" }
      - { name: base_currency, type: string, source: input, default: "USD", description: "ISO currency code; all cents fields are in this currency" }
      - { name: accounting_basis, type: enum, source: input, default: "ACCRUAL", description: "ACCRUAL | CASH; selects the 1099 total variant and revenue recognition basis", constraints: "one of {ACCRUAL, CASH}" }
      - { name: current_period_id, type: string, source: system, default: null, description: "FK -> AccountingPeriod.id; the single period currently OPEN for posting (null until first period opened); advanced by close+open" }
      - { name: retained_earnings_account_id, type: string, source: input, description: "FK -> Account.id; the EQUITY account that absorbs net income on period close" }
      - { name: retained_earnings_cents, type: integer, source: computed, default: 0, description: "Derived: posted_balance of the retained-earnings account after all closing entries; recomputed on every close cascade" }
      - { name: trial_balance_status, type: enum, source: computed, default: "BALANCED", description: "BALANCED when total posted debit cents == total posted credit cents across all accounts, else OUT_OF_BALANCE", constraints: "one of {BALANCED, OUT_OF_BALANCE}" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: parent_account_id, type: string, source: input, required: false, default: null, description: "FK -> Account.id; self-referential parent for sub-accounts (null = top-level). Must share account_type with parent." }
      - { name: code, type: string, source: input, description: "Chart-of-accounts code, unique per company among non-ARCHIVED accounts" }
      - { name: name, type: string, source: input, description: "Account display name" }
      - { name: account_type, type: enum, source: input, description: "ASSET | LIABILITY | EQUITY | REVENUE | EXPENSE; fixes the normal balance side", constraints: "one of {ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE}" }
      - { name: is_cash, type: boolean, source: input, default: false, description: "True for accounts that back a BankAccount (must be ASSET)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED", constraints: "one of {ACTIVE, ARCHIVED}" }
      - { name: posted_balance_cents, type: integer, source: computed, default: 0, description: "Signed posted balance from POSTED JournalLine rows only (debit-positive for ASSET/EXPENSE, credit-positive for LIABILITY/EQUITY/REVENUE); recomputed on every posting and reversal cascade" }

  - name: AccountingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: period_label, type: string, source: input, description: "e.g. 2026-01; informational" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive period start (ISO 8601 UTC); must equal prior closed period's end_date (contiguous, no gaps)" }
      - { name: end_date, type: datetime, source: input, description: "Exclusive period end (ISO 8601 UTC); half-open interval [start_date, end_date)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSING | CLOSED", constraints: "one of {OPEN, CLOSING, CLOSED}" }
      - { name: close_checklist, type: array, source: system, description: "Array of { item: enum(BANK_RECONCILED, AR_REVIEWED, AP_REVIEWED, SALES_TAX_REVIEWED), done: boolean }; all four seeded done=false on open" }
      - { name: closing_journal_entry_id, type: string, source: system, required: false, default: null, description: "FK -> JournalEntry.id; the closing entry posted when this period moved to CLOSED" }

  - name: JournalEntry
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: period_id, type: string, source: input, description: "FK -> AccountingPeriod.id; the period this entry posts into (must be OPEN at post time)" }
      - { name: entry_date, type: datetime, source: input, description: "ISO 8601 UTC; must fall within [period.start_date, period.end_date)" }
      - { name: memo, type: string, source: input, required: false, default: "", description: "Free-text description" }
      - { name: source, type: enum, source: system, default: "MANUAL", description: "MANUAL | BANK_FEED | CLOSING | REVERSAL", constraints: "one of {MANUAL, BANK_FEED, CLOSING, REVERSAL}" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the drafter; used for maker-checker segregation of duties on post" }
      - { name: reverses_journal_entry_id, type: string, source: system, required: false, default: null, description: "FK -> JournalEntry.id; set on REVERSAL entries to the entry they reverse" }
      - { name: total_debit_cents, type: integer, source: computed, default: 0, description: "Sum of line debit_cents" }
      - { name: total_credit_cents, type: integer, source: computed, default: 0, description: "Sum of line credit_cents" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | POSTED | VOIDED", constraints: "one of {DRAFT, POSTED, VOIDED}" }

  - name: JournalLine
    parent: null
    common_fields: false
    fields:
      - { name: journal_entry_id, type: string, source: input, description: "FK -> JournalEntry.id" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; must be ACTIVE and belong to the same company" }
      - { name: debit_cents, type: integer, source: input, default: 0, description: "Debit amount in cents (>= 0); exactly one of debit_cents/credit_cents must be > 0" }
      - { name: credit_cents, type: integer, source: input, default: 0, description: "Credit amount in cents (>= 0); exactly one of debit_cents/credit_cents must be > 0" }
      - { name: line_memo, type: string, source: input, required: false, default: "", description: "Per-line description" }

  - name: BankAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: gl_account_id, type: string, source: input, description: "FK -> Account.id; the cash GL account (is_cash=true) this bank account posts to" }
      - { name: nickname, type: string, source: input, description: "Display name" }
      - { name: last_reconciled_statement_balance_cents, type: integer, source: system, default: 0, description: "Statement ending balance of the most recently RECONCILED reconciliation (0 until first reconciliation)" }
      - { name: last_reconciled_through, type: datetime, source: system, required: false, default: null, description: "statement_end_date of the most recent RECONCILED reconciliation" }

  - name: BankFeedTransaction
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: bank_account_id, type: string, source: input, description: "FK -> BankAccount.id" }
      - { name: posted_date, type: datetime, source: input, description: "Date the bank posted the line (ISO 8601 UTC)" }
      - { name: amount_cents, type: integer, source: input, description: "Signed bank amount: positive = deposit into the account, negative = withdrawal" }
      - { name: bank_description, type: string, source: input, description: "Raw memo from the bank feed" }
      - { name: counter_account_id, type: string, source: input, required: false, default: null, description: "FK -> Account.id; the non-cash account chosen during categorization" }
      - { name: journal_entry_id, type: string, source: system, required: false, default: null, description: "FK -> JournalEntry.id; the entry created when this transaction was categorized" }
      - { name: cleared, type: boolean, source: system, default: false, description: "True once a RECONCILED reconciliation includes this transaction" }
      - { name: status, type: enum, source: system, default: "UNMATCHED", description: "UNMATCHED | CATEGORIZED | EXCLUDED", constraints: "one of {UNMATCHED, CATEGORIZED, EXCLUDED}" }

  - name: Reconciliation
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: bank_account_id, type: string, source: input, description: "FK -> BankAccount.id" }
      - { name: statement_start_date, type: datetime, source: input, description: "Statement period start (inclusive, ISO 8601 UTC)" }
      - { name: statement_end_date, type: datetime, source: input, description: "Statement period end (exclusive); must equal bank_account.last_reconciled_through if set (contiguous)" }
      - { name: statement_opening_balance_cents, type: integer, source: input, description: "Opening cleared balance per the statement; must equal bank_account.last_reconciled_statement_balance_cents" }
      - { name: statement_ending_balance_cents, type: integer, source: input, description: "Closing balance per the statement" }
      - { name: included_transaction_ids, type: array, source: input, description: "Array of BankFeedTransaction.id selected as cleared on this statement; all must be CATEGORIZED, same bank_account, not yet cleared" }
      - { name: difference_cents, type: integer, source: computed, default: 0, description: "statement_ending - (statement_opening + sum of signed amount_cents over included transactions); must be 0 to finalize" }
      - { name: status, type: enum, source: system, default: "IN_PROGRESS", description: "IN_PROGRESS | RECONCILED | ABANDONED", constraints: "one of {IN_PROGRESS, RECONCILED, ABANDONED}" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: display_name, type: string, source: input, description: "Customer name" }
      - { name: tax_jurisdiction, type: string, source: input, description: "Jurisdiction code used to select the applicable TaxRate (e.g. CA, NY)" }
      - { name: ar_account_id, type: string, source: input, description: "FK -> Account.id; the ASSET (accounts-receivable) account invoices debit" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: revenue_account_id, type: string, source: input, description: "FK -> Account.id; the REVENUE account credited" }
      - { name: tax_liability_account_id, type: string, source: input, description: "FK -> Account.id; the LIABILITY account that holds collected sales tax" }
      - { name: issue_date, type: datetime, source: input, description: "Invoice date (ISO 8601 UTC)" }
      - { name: lines, type: array, source: input, description: "Array of { description, quantity, unit_price_cents, taxable: boolean }; at least one line required to SEND" }
      - { name: applied_tax_rate_bps, type: integer, source: system, default: 0, description: "Tax rate in basis points captured from the TaxRate effective on issue_date for the customer's jurisdiction (0 if none)" }
      - { name: taxable_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of quantity*unit_price_cents over taxable lines" }
      - { name: nontaxable_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum over non-taxable lines" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Volume discount keyed on taxable_subtotal tier; applied before tax (see calc invoice_total_breakdown)" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Sales tax computed per-line round-half-up then summed, on the discounted taxable base" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "discounted_taxable + nontaxable + tax" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of CLEARED InvoicePayment amounts applied to this invoice" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "total_cents - amount_paid_cents (only meaningful once SENT)" }
      - { name: delivery_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SENT | VOID (delivery axis)", constraints: "one of {DRAFT, SENT, VOID}" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | PARTIALLY_PAID | PAID (payment axis, independent of delivery_status)", constraints: "one of {UNPAID, PARTIALLY_PAID, PAID}" }

  - name: InvoicePayment
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; invoice must be SENT" }
      - { name: deposit_bank_account_id, type: string, source: input, description: "FK -> BankAccount.id; cash account that receives the payment" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents (> 0); must not exceed the invoice balance_due_cents" }
      - { name: status, type: enum, source: system, default: "CLEARED", description: "CLEARED | REVERSED", constraints: "one of {CLEARED, REVERSED}" }
      - { name: journal_entry_id, type: string, source: system, description: "FK -> JournalEntry.id; the posted receipt entry (debit cash, credit AR)" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: display_name, type: string, source: input, description: "Vendor name" }
      - { name: is_1099_eligible, type: boolean, source: input, default: false, description: "Whether vendor payments count toward 1099-NEC reporting" }
      - { name: ap_account_id, type: string, source: input, description: "FK -> Account.id; the LIABILITY (accounts-payable) account bills credit" }
      - { name: ytd_1099_total_cents, type: integer, source: computed, default: 0, description: "Derived 1099 total for the company's tax year under the company's accounting_basis (cash vs accrual variant); recomputed on bill post and bill payment" }

  - name: Bill
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: expense_account_id, type: string, source: input, description: "FK -> Account.id; the EXPENSE account debited" }
      - { name: bill_date, type: datetime, source: input, description: "Vendor invoice date (ISO 8601 UTC)" }
      - { name: lines, type: array, source: input, description: "Array of { description, amount_cents, use_taxable: boolean }; use_taxable lines accrue use tax per line" }
      - { name: applied_tax_rate_bps, type: integer, source: system, default: 0, description: "Use-tax rate (basis points) captured from the vendor's company default jurisdiction TaxRate effective on bill_date" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of line amount_cents" }
      - { name: use_tax_cents, type: integer, source: computed, default: 0, description: "Use tax computed per-line round-half-up then summed over use_taxable lines" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "subtotal + use_tax" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of bill payments recorded against this bill" }
      - { name: paid_in_tax_year, type: integer, source: system, default: 0, description: "Sum of bill payment amounts whose payment entry_date falls in the company tax year (drives the CASH-basis 1099 variant)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | APPROVED | PARTIALLY_PAID | PAID | VOID", constraints: "one of {DRAFT, APPROVED, PARTIALLY_PAID, PAID, VOID}" }

  - name: TaxRate
    parent: null
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: jurisdiction, type: string, source: input, description: "Jurisdiction code (matches Customer.tax_jurisdiction)" }
      - { name: rate_bps, type: integer, source: input, description: "Rate in basis points (e.g. 875 = 8.75%); >= 0" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start (ISO 8601 UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end; rate applies on [effective_from, effective_to). Must not overlap another TaxRate for the same jurisdiction in this company." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AccountingPeriod
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSING
        trigger: "POST /ledger/accounting-periods/{id}/begin-close"
        actor: Accountant
        preconditions:
          - "All four close_checklist items are done=true (else ERR_CHECKLIST_INCOMPLETE)"
          - "No DRAFT JournalEntry exists with period_id == this period (else ERR_OPEN_DRAFT_ENTRIES)"
          - "No Reconciliation with status IN_PROGRESS on any bank account of this company (else ERR_RECONCILIATION_IN_PROGRESS)"
        side_effects:
          - "status -> CLOSING"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /ledger/accounting-periods/{id}/post-close"
        actor: Accountant
        preconditions:
          - "Company.trial_balance_status == BALANCED (else ERR_TRIAL_BALANCE_OUT_OF_BALANCE)"
        side_effects:
          - "CASCADE A hop1: create a CLOSING JournalEntry that debits each REVENUE account by its posted_balance and credits each EXPENSE account by its posted_balance, with the net to retained_earnings_account_id; post it; set closing_journal_entry_id"
          - "CASCADE A hop2 (caused by the closing entry posting): each REVENUE/EXPENSE Account.posted_balance_cents recomputed to 0 and retained_earnings Account.posted_balance_cents recomputed"
          - "CASCADE A hop3 (caused by the retained-earnings account mutation): Company.retained_earnings_cents recomputed from that account's new posted_balance"
          - "status -> CLOSED"
      - from: CLOSED
        to: OPEN
        trigger: "POST /ledger/accounting-periods/{id}/reopen"
        actor: Owner
        preconditions:
          - "This is the most recently closed period of the company (Company.current_period_id refers to a later period or none; reopening a non-latest closed period -> ERR_NOT_LATEST_CLOSED_PERIOD)"
        side_effects:
          - "Void the closing JournalEntry via its reversal path (creates a REVERSAL entry; recomputes affected Account.posted_balance_cents and Company.retained_earnings_cents)"
          - "closing_journal_entry_id -> null"
          - "status -> OPEN"
        note: "Cyclic: CLOSED can return to OPEN (reopen for late adjustments)."

  - entity: JournalEntry
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /ledger/journal-entries/{id}/post"
        actor: Accountant | Owner
        preconditions:
          - "total_debit_cents == total_credit_cents AND total_debit_cents > 0 (else ERR_ENTRY_NOT_BALANCED)"
          - "Has at least two JournalLine rows (else ERR_ENTRY_NOT_BALANCED)"
          - "X-User-ID != created_by_user_id — maker cannot post own entry (else ERR_SEGREGATION_OF_DUTIES)"
          - "period_id refers to a period in status OPEN (else ERR_PERIOD_NOT_OPEN)"
          - "Every referenced Account.status == ACTIVE (else ERR_ACCOUNT_ARCHIVED)"
        side_effects:
          - "status -> POSTED"
          - "Each referenced Account.posted_balance_cents recomputed (debit/credit applied per the account's normal side)"
          - "Company.trial_balance_status recomputed"
      - from: POSTED
        to: VOIDED
        trigger: "POST /ledger/journal-entries/{id}/void"
        actor: Owner
        preconditions:
          - "period_id refers to a period in status OPEN (CLOSED period -> ERR_PERIOD_CLOSED)"
          - "Entry source != CLOSING (closing entries are voided only via period reopen -> ERR_CLOSING_ENTRY_PROTECTED)"
        side_effects:
          - "CASCADE B hop1: create a REVERSAL JournalEntry (source=REVERSAL, reverses_journal_entry_id set) with debit/credit of every line swapped, status POSTED immediately"
          - "CASCADE B hop2 (caused by the reversal posting): each referenced Account.posted_balance_cents recomputed and Company.trial_balance_status recomputed"
          - "status -> VOIDED"
        note: "Compensation: original + reversal leave total posted debits minus total posted credits unchanged (trial-balance invariant)."

  - entity: BankFeedTransaction
    initial_state: UNMATCHED
    terminal_states: [EXCLUDED]
    transitions:
      - from: UNMATCHED
        to: CATEGORIZED
        trigger: "POST /ledger/bank-feed-transactions/{id}/categorize"
        actor: Bookkeeper | Accountant
        preconditions:
          - "counter_account_id refers to an existing ACTIVE Account in the same company (else ERR_ACCOUNT_ARCHIVED or ERR_ACCOUNT_NOT_FOUND)"
          - "counter_account_id account_type != EQUITY and is not the bank's own gl_account_id (else ERR_INVALID_CATEGORIZATION_ACCOUNT)"
          - "Company.current_period_id is set and its period is OPEN and posted_date falls within that period (else ERR_PERIOD_NOT_OPEN)"
        side_effects:
          - "Create a BANK_FEED JournalEntry (2 lines) posted immediately: deposit (amount>0) debits bank gl_account credits counter_account; withdrawal debits counter_account credits bank gl_account"
          - "journal_entry_id set; counter_account_id stored; affected Account.posted_balance_cents and Company.trial_balance_status recomputed"
          - "status -> CATEGORIZED"
      - from: CATEGORIZED
        to: UNMATCHED
        trigger: "POST /ledger/bank-feed-transactions/{id}/recategorize"
        actor: Bookkeeper | Accountant
        preconditions:
          - "cleared == false — a cleared (reconciled) transaction cannot be recategorized (else ERR_TRANSACTION_CLEARED)"
        side_effects:
          - "Void the linked BANK_FEED JournalEntry (reversal cascade recomputes balances)"
          - "journal_entry_id -> null; counter_account_id -> null"
          - "status -> UNMATCHED"
        note: "Cyclic: a transaction may bounce between UNMATCHED and CATEGORIZED until reconciled."
      - from: UNMATCHED
        to: EXCLUDED
        trigger: "POST /ledger/bank-feed-transactions/{id}/exclude"
        actor: Bookkeeper | Accountant
        preconditions: []
        side_effects:
          - "status -> EXCLUDED"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /ledger/invoices/{id}/send"
        actor: Bookkeeper | Accountant
        preconditions:
          - "lines is non-empty (at least one line; else ERR_INVOICE_EMPTY)"
          - "Company.current_period_id is set and OPEN and issue_date within it (else ERR_PERIOD_NOT_OPEN)"
        side_effects:
          - "Capture applied_tax_rate_bps from the TaxRate effective on issue_date for the customer's jurisdiction"
          - "Compute taxable_subtotal/nontaxable_subtotal/discount/tax/total via calc invoice_total_breakdown"
          - "Post a MANUAL-source JournalEntry: debit AR (total), credit revenue (discounted taxable + nontaxable), credit tax-liability (tax)"
          - "delivery_status -> SENT (payment_status stays UNPAID)"
      - from: SENT
        to: VOID
        trigger: "POST /ledger/invoices/{id}/void"
        actor: Accountant | Owner
        preconditions:
          - "payment_status == UNPAID — an invoice with any CLEARED payment cannot be voided (else ERR_INVOICE_HAS_PAYMENTS)"
          - "issue_date period is OPEN (else ERR_PERIOD_CLOSED)"
        side_effects:
          - "Void the invoice's posting JournalEntry (reversal cascade)"
          - "delivery_status -> VOID"

  - entity: InvoicePayment
    initial_state: CLEARED
    terminal_states: [REVERSED]
    transitions:
      - from: CLEARED
        to: REVERSED
        trigger: "POST /ledger/invoice-payments/{id}/reverse"
        actor: Accountant | Owner
        preconditions:
          - "The invoice's issue_date period is OPEN (else ERR_PERIOD_CLOSED)"
        side_effects:
          - "Void the receipt JournalEntry (reversal cascade)"
          - "Invoice.amount_paid_cents and balance_due_cents recomputed; Invoice.payment_status re-derived (PAID/PARTIALLY_PAID/UNPAID)"
          - "status -> REVERSED"
        note: "Compensation: applying then reversing leaves invoice.amount_paid + invoice.balance_due == invoice.total invariant intact."

  - entity: Bill
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /ledger/bills/{id}/approve"
        actor: Accountant | Owner
        preconditions:
          - "lines non-empty (else ERR_BILL_EMPTY); no maker-checker constraint applies to bills"
          - "Company.current_period_id OPEN and bill_date within it (else ERR_PERIOD_NOT_OPEN)"
        side_effects:
          - "Compute subtotal/use_tax/total via calc bill_use_tax_total"
          - "Post a MANUAL JournalEntry: debit expense (subtotal + use_tax), credit AP (total)"
          - "Recompute Vendor.ytd_1099_total_cents (accrual variant adds the bill total when basis=ACCRUAL)"
          - "status -> APPROVED"
      - from: APPROVED
        to: PARTIALLY_PAID
        trigger: "POST /ledger/bills/{id}/record-payment"
        actor: Accountant | Owner
        preconditions:
          - "Payment amount_cents > 0 and amount_paid_cents + amount_cents < total_cents (a payment that fully settles goes straight to PAID; else ERR_BILL_OVERPAY if it would exceed total)"
          - "pay_from_bank_account_id is a valid BankAccount of this company"
          - "Company.current_period_id OPEN and payment date within it (else ERR_PERIOD_NOT_OPEN)"
        side_effects:
          - "Post a MANUAL JournalEntry: debit AP, credit bank gl_account"
          - "amount_paid_cents and paid_in_tax_year recomputed; Vendor.ytd_1099_total_cents recomputed (cash variant adds the payment when basis=CASH)"
          - "status -> PARTIALLY_PAID"
      - from: APPROVED
        to: PAID
        trigger: "POST /ledger/bills/{id}/record-payment"
        actor: Accountant | Owner
        preconditions:
          - "amount_paid_cents + amount_cents == total_cents exactly (else stays PARTIALLY_PAID or ERR_BILL_OVERPAY)"
          - "Company.current_period_id OPEN and payment date within it"
        side_effects:
          - "Post the AP-settling JournalEntry; amount_paid/paid_in_tax_year/Vendor 1099 recomputed"
          - "status -> PAID"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /ledger/bills/{id}/record-payment"
        actor: Accountant | Owner
        preconditions:
          - "amount_paid_cents + amount_cents == total_cents exactly (else ERR_BILL_OVERPAY if exceeds; stays PARTIALLY_PAID if less)"
        side_effects:
          - "Post the AP-settling JournalEntry; balances and Vendor 1099 recomputed"
          - "status -> PAID"
      - from: DRAFT
        to: VOID
        trigger: "POST /ledger/bills/{id}/void"
        actor: Accountant | Owner
        preconditions:
          - "status == DRAFT (an APPROVED/paid bill cannot be voided; else ERR_INVALID_STATE)"
        side_effects:
          - "status -> VOID"

  - entity: Reconciliation
    initial_state: IN_PROGRESS
    terminal_states: [RECONCILED, ABANDONED]
    transitions:
      - from: IN_PROGRESS
        to: RECONCILED
        trigger: "POST /ledger/reconciliations/{id}/finalize"
        actor: Accountant | Owner
        preconditions:
          - "difference_cents == 0 exactly (else ERR_RECONCILIATION_UNBALANCED)"
          - "Every included transaction is still CATEGORIZED and not cleared (else ERR_TRANSACTION_NOT_CATEGORIZED)"
          - "expected_bank_account_version matches BankAccount.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Each included BankFeedTransaction.cleared -> true"
          - "BankAccount.last_reconciled_statement_balance_cents = statement_ending_balance_cents; last_reconciled_through = statement_end_date; BankAccount.version += 1"
          - "status -> RECONCILED"
      - from: IN_PROGRESS
        to: ABANDONED
        trigger: "POST /ledger/reconciliations/{id}/abandon"
        actor: Accountant | Owner
        preconditions: []
        side_effects:
          - "status -> ABANDONED (no transactions cleared)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: period-open-stale-company
    parent_entity: Company
    write_endpoint: "POST /ledger/accounting-periods"
    occ_field: "expected_company_version"
    description: |
      Opening a new AccountingPeriod advances the Company's current_period_id
      and bumps Company.version. A create that carries a company version older
      than the Company's current version is rejected: the client's view of which
      period is current is stale because another open already advanced it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reconciliation-finalize-stale-bank
    parent_entity: BankAccount
    write_endpoint: "POST /ledger/reconciliations/{id}/finalize"
    occ_field: "expected_bank_account_version"
    description: |
      Finalizing a Reconciliation advances the BankAccount's
      last_reconciled_statement_balance_cents and bumps BankAccount.version.
      A finalize carrying a bank-account version older than the current one is
      rejected because another reconciliation already advanced the bank
      account's reconciled state, making this client's opening-balance view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: account_balance
    trigger: "GET /ledger/accounts/{id}/balance and on every JournalEntry post/void recompute of posted_balance_cents"
    algorithm: chronological
    formula: |
      POSTED variant (default; what posted_balance_cents stores):
        sum over JournalLine rows whose JournalEntry.status == POSTED and account_id == this:
          natural_amount = (debit_cents - credit_cents)
          if account_type in {ASSET, EXPENSE}:  signed = natural_amount
          else (LIABILITY, EQUITY, REVENUE):     signed = -natural_amount
        posted_balance_cents = sum(signed)
      PROJECTED variant (forward_looking; only via ?include_drafts=true):
        identical sum but over JournalLine rows whose JournalEntry.status in {POSTED, DRAFT}
        (draft entries projected as if they were posted).
    input_set: "POSTED-only for the stored field; POSTED+DRAFT for the projected what-if read"
    precision: "integer cents, no rounding"
    variants:
      - name: posted
        when: "GET /ledger/accounts/{id}/balance without include_drafts, and the stored posted_balance_cents field"
        difference: "Includes only POSTED JournalEntry lines"
      - name: projected
        when: "GET /ledger/accounts/{id}/balance?include_drafts=true"
        difference: "Adds DRAFT JournalEntry lines as if posted; diverges from posted whenever a draft touches this account"

  - name: vendor_1099_total
    trigger: "Bill approve and Bill record-payment; GET /ledger/vendors/{id}/1099"
    algorithm: aggregation
    formula: |
      tax_year = [Company tax-year start, end) derived from the OPEN period chain (calendar year of the company's current period start_date)
      ACCRUAL variant (Company.accounting_basis == ACCRUAL):
        ytd_1099_total_cents = sum of Bill.total_cents over Bills where vendor_id == this,
          vendor.is_1099_eligible == true, bill.status != VOID, and bill_date in tax_year
      CASH variant (Company.accounting_basis == CASH):
        ytd_1099_total_cents = sum of Bill.paid_in_tax_year over Bills where vendor_id == this and
          vendor.is_1099_eligible == true (only amounts actually paid within the tax year count)
      If vendor.is_1099_eligible == false: total is 0.
    input_set: "Bills of the vendor, filtered by status != VOID and tax year; the variant selects accrual (bill_date) vs cash (payment date)"
    precision: "integer cents"
    variants:
      - name: accrual
        when: "Company.accounting_basis == ACCRUAL"
        difference: "Counts bill totals by bill_date regardless of payment"
      - name: cash
        when: "Company.accounting_basis == CASH"
        difference: "Counts only amounts paid within the tax year; an approved-but-unpaid bill contributes 0"

  - name: bill_use_tax_total
    trigger: "Bill approve"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum over lines of line.amount_cents
      For each line with use_taxable == true:
        line_tax = round_half_up(line.amount_cents * applied_tax_rate_bps / 10000)   # PER-LINE rounding
      use_tax_cents = sum of per-line line_tax            # ROUND PER LINE, THEN SUM (pinned order)
      total_cents = subtotal_cents + use_tax_cents
    input_set: "All lines of the bill; use_taxable lines only contribute to use tax"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "round_half_up per line to whole cents, then integer sum"

  - name: invoice_total_breakdown
    trigger: "Invoice send"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (mode-c circular-looking dependency: total -> tax -> discount -> subtotal tier):
      taxable_subtotal_cents    = sum(quantity*unit_price_cents over taxable lines)
      nontaxable_subtotal_cents = sum(quantity*unit_price_cents over non-taxable lines)
      # 1) discount tier is keyed on taxable_subtotal_cents:
      if taxable_subtotal_cents >= 1000000: discount_pct = 0.10      # >= $10,000 -> 10%
      elif taxable_subtotal_cents >= 500000: discount_pct = 0.05     # >= $5,000  -> 5%
      else: discount_pct = 0.00
      discount_cents = round_half_up(taxable_subtotal_cents * discount_pct)
      # 2) tax is computed on the DISCOUNTED taxable base, per-line round then sum:
      discounted_taxable = taxable_subtotal_cents - discount_cents
      For each taxable line: line_share = round_half_up(line_amount * applied_tax_rate_bps/10000 * (discounted_taxable / taxable_subtotal_cents))
      tax_cents = sum of per-line line_share     # PER-LINE rounding then sum
      # 3) total last:
      total_cents = discounted_taxable + nontaxable_subtotal_cents + tax_cents
    input_set: "Invoice lines partitioned by taxable flag; applied_tax_rate_bps captured at send"
    constants:
      TIER1_THRESHOLD_CENTS: 500000   # $5,000 -> 5%
      TIER2_THRESHOLD_CENTS: 1000000  # $10,000 -> 10%
      TIER1_PCT: 0.05
      TIER2_PCT: 0.10
      BPS_DENOMINATOR: 10000
    precision: "round_half_up to whole cents at each pinned step; integer cents thereafter"

  - name: reconciliation_difference
    trigger: "Reconciliation create and finalize precheck"
    algorithm: aggregation
    formula: |
      cleared_movement = sum of signed amount_cents over included_transaction_ids
      expected_ending = statement_opening_balance_cents + cleared_movement
      difference_cents = statement_ending_balance_cents - expected_ending
      finalize requires difference_cents == 0 EXACTLY (no tolerance)
    input_set: "BankFeedTransactions whose id is in included_transaction_ids (must be CATEGORIZED, same bank account, not cleared)"
    precision: "integer cents, exact"

  - name: invoice_balance_and_payment_status
    trigger: "InvoicePayment create/reverse"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum of amount_cents over InvoicePayment rows with status == CLEARED for this invoice
      balance_due_cents = total_cents - amount_paid_cents
      payment_status:
        if amount_paid_cents == 0: UNPAID
        elif amount_paid_cents < total_cents: PARTIALLY_PAID
        else (amount_paid_cents == total_cents): PAID
      Invariant: amount_paid_cents + balance_due_cents == total_cents at all times.
    input_set: "CLEARED InvoicePayment rows for the invoice"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and FK-referenced resources exist (validated left-to-right); account_id on a journal line that does not exist"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing an account_id"
  - priority: 4
    category: existence
    check: "Other referenced resources exist (company, period, invoice, bill, vendor, customer, bank account, reconciliation, transaction)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_constraint
    check: "Segregation of duties: the X-User-ID posting a JournalEntry must differ from created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ledger/journal-entries/{id}/post"
  - priority: 7
    category: business_referential
    check: "Referenced Account on a journal line / categorization / posting must be ACTIVE (ARCHIVED checked first, before the categorization-type rule)"
    error_id: ERR_ACCOUNT_ARCHIVED
    http_status: 409
    applies_to: "journal-entry post, categorize"
  - priority: 8
    category: business_referential
    check: "Categorization target account (when ACTIVE) must not be the bank's own cash gl_account and must not be account_type EQUITY"
    error_id: ERR_INVALID_CATEGORIZATION_ACCOUNT
    http_status: 409
    applies_to: "POST /ledger/bank-feed-transactions/{id}/categorize"
  - priority: 9
    category: business_temporal
    check: "Sub-account must share account_type with parent_account_id; TaxRate effective window must not overlap an existing rate for the jurisdiction; AccountingPeriod start_date must be contiguous with the prior period end_date"
    error_id: "ERR_ACCOUNT_TYPE_MISMATCH / ERR_TAX_RATE_OVERLAP / ERR_PERIOD_NOT_CONTIGUOUS"
    http_status: 409
    applies_to: "account create, tax-rate create, period create"
  - priority: 10
    category: business_fiscal
    check: "Posting period must be OPEN; categorization/send/approve/payment require Company.current_period_id OPEN and the entity date within it"
    error_id: ERR_PERIOD_NOT_OPEN
    http_status: 409
    applies_to: "journal-entry post, categorize, invoice send, bill approve/record-payment"
  - priority: 11
    category: business_fiscal
    check: "Void/reverse against a CLOSED period is rejected (only Owner reopen unlocks)"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "journal-entry void, invoice void, invoice-payment reverse"
  - priority: 12
    category: business_constraint
    check: "A JournalEntry posts only when total_debit_cents == total_credit_cents, totals > 0, and at least two lines"
    error_id: ERR_ENTRY_NOT_BALANCED
    http_status: 422
    applies_to: "POST /ledger/journal-entries/{id}/post"
  - priority: 13
    category: business_constraint
    check: "Each JournalLine has exactly one of debit_cents/credit_cents > 0, both >= 0"
    error_id: ERR_INVALID_LINE
    http_status: 422
    applies_to: "POST /ledger/journal-lines"
  - priority: 14
    category: business_constraint
    check: "Invoice must have at least one line to SEND"
    error_id: ERR_INVOICE_EMPTY
    http_status: 422
    applies_to: "POST /ledger/invoices/{id}/send"
  - priority: 15
    category: business_constraint
    check: "Bill must have at least one line to APPROVE"
    error_id: ERR_BILL_EMPTY
    http_status: 422
    applies_to: "POST /ledger/bills/{id}/approve"
  - priority: 16
    category: business_fiscal
    check: "InvoicePayment must not exceed invoice balance_due_cents; bill payment must not exceed remaining total"
    error_id: "ERR_PAYMENT_EXCEEDS_BALANCE / ERR_BILL_OVERPAY"
    http_status: 409
    applies_to: "invoice-payments create, bill record-payment"
  - priority: 17
    category: business_constraint
    check: "Cannot void an invoice that has any CLEARED payment"
    error_id: ERR_INVOICE_HAS_PAYMENTS
    http_status: 409
    applies_to: "POST /ledger/invoices/{id}/void"
  - priority: 18
    category: business_constraint
    check: "Reconciliation difference must be exactly 0 to finalize; included transactions must remain CATEGORIZED and uncleared"
    error_id: "ERR_RECONCILIATION_UNBALANCED / ERR_TRANSACTION_NOT_CATEGORIZED"
    http_status: 409
    applies_to: "POST /ledger/reconciliations/{id}/finalize"
  - priority: 19
    category: business_constraint
    check: "Period begin-close requires all checklist items done, no DRAFT entries, no IN_PROGRESS reconciliation; post-close requires trial balance BALANCED; reopen requires latest-closed"
    error_id: "ERR_CHECKLIST_INCOMPLETE / ERR_OPEN_DRAFT_ENTRIES / ERR_RECONCILIATION_IN_PROGRESS / ERR_TRIAL_BALANCE_OUT_OF_BALANCE / ERR_NOT_LATEST_CLOSED_PERIOD"
    http_status: 409
    applies_to: "accounting-period begin-close/post-close/reopen"
  - priority: 20
    category: business_constraint
    check: "Recategorizing a cleared (reconciled) transaction is rejected; protected CLOSING entries cannot be directly voided"
    error_id: "ERR_TRANSACTION_CLEARED / ERR_CLOSING_ENTRY_PROTECTED"
    http_status: 409
    applies_to: "bank-feed-transaction recategorize, journal-entry void"
  - priority: 21
    category: business_constraint
    check: "Account code unique per company among non-ARCHIVED accounts"
    error_id: ERR_DUPLICATE_ACCOUNT_CODE
    http_status: 409
    applies_to: "POST /ledger/accounts"
  - priority: 22
    category: concurrency
    check: "OCC: expected_company_version / expected_bank_account_version must match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "accounting-periods create, reconciliations finalize"

# =============================================================================
# §1.5 API Endpoint Table  (flat topology; all collections under /ledger)
# =============================================================================
endpoints:
  # --- Company ---
  - method: POST
    path: "/ledger/companies"
    description: "Create a Company"
    roles: [Owner]
    code: 201
    input: [legal_name, "base_currency?", "accounting_basis?", "retained_earnings_account_id?"]
    output: Company
    side_effects: ["version=1, retained_earnings_cents=0, trial_balance_status=BALANCED, current_period_id=null"]
  - method: GET
    path: "/ledger/companies/{companyId}"
    description: "Get a Company"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: Company
    side_effects: []
  - method: GET
    path: "/ledger/companies"
    description: "List Companies (filter by current period or retained-earnings account)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["current_period_id?", "retained_earnings_account_id?"]
    output: "Company[]"
    side_effects: []
  - method: PATCH
    path: "/ledger/companies/{companyId}"
    description: "Set company config (retained_earnings_account_id, accounting_basis) after the equity account exists"
    roles: [Owner]
    code: 200
    input: ["retained_earnings_account_id?", "accounting_basis?", expected_company_version]
    output: Company
    side_effects: ["increments Company.version by 1"]

  # --- Account ---
  - method: POST
    path: "/ledger/accounts"
    description: "Create an Account (chart of accounts; self-referential parent for sub-accounts)"
    roles: [Owner, Accountant]
    code: 201
    input: [company_id, code, name, account_type, "parent_account_id?", "is_cash?"]
    output: Account
    side_effects: ["status=ACTIVE, posted_balance_cents=0; ERR_INVALID_REQUEST on missing/malformed required field; ERR_DUPLICATE_ACCOUNT_CODE / ERR_ACCOUNT_TYPE_MISMATCH"]
  - method: GET
    path: "/ledger/accounts/{accountId}"
    description: "Get an Account"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/ledger/accounts"
    description: "List Accounts (filter by company / parent / type / status)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "parent_account_id?", "account_type?", "status?"]
    output: "Account[]"
    side_effects: []
  - method: GET
    path: "/ledger/accounts/{accountId}/balance"
    description: "Get computed account balance (posted, or projected with include_drafts)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["include_drafts?"]
    output: "{ account_id: string, posted_balance_cents: integer, projected_balance_cents: integer }"
    side_effects: []
  - method: POST
    path: "/ledger/accounts/{accountId}/archive"
    description: "Archive an Account (status -> ARCHIVED)"
    roles: [Owner, Accountant]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> ARCHIVED; ERR_INVALID_STATE if already ARCHIVED"]

  # --- AccountingPeriod ---
  - method: POST
    path: "/ledger/accounting-periods"
    description: "Open a new AccountingPeriod (OCC on company version; sets Company.current_period_id)"
    roles: [Owner, Accountant]
    code: 201
    input: [company_id, period_label, start_date, end_date, expected_company_version]
    output: AccountingPeriod
    side_effects: ["status=OPEN; close_checklist seeded all done=false; Company.current_period_id=this; increments Company.version by 1; ERR_PERIOD_NOT_CONTIGUOUS / ERR_STALE_VERSION"]
  - method: GET
    path: "/ledger/accounting-periods/{periodId}"
    description: "Get an AccountingPeriod"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects: []
  - method: GET
    path: "/ledger/accounting-periods"
    description: "List AccountingPeriods (filter by company / status / closing entry)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "status?", "closing_journal_entry_id?"]
    output: "AccountingPeriod[]"
    side_effects: []
  - method: POST
    path: "/ledger/accounting-periods/{periodId}/checklist"
    description: "Mark a close-checklist item done"
    roles: [Owner, Accountant, Bookkeeper]
    code: 200
    input: [item, done]
    output: AccountingPeriod
    side_effects: ["sets the named checklist item's done flag"]
  - method: POST
    path: "/ledger/accounting-periods/{periodId}/begin-close"
    description: "Move period OPEN -> CLOSING"
    roles: [Accountant]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects: ["status -> CLOSING; ERR_CHECKLIST_INCOMPLETE / ERR_OPEN_DRAFT_ENTRIES / ERR_RECONCILIATION_IN_PROGRESS"]
  - method: POST
    path: "/ledger/accounting-periods/{periodId}/post-close"
    description: "Move period CLOSING -> CLOSED, posting the closing entry (CASCADE A)"
    roles: [Accountant]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects: ["closing JournalEntry created+posted; REVENUE/EXPENSE balances zeroed; Company.retained_earnings_cents recomputed; status -> CLOSED; ERR_TRIAL_BALANCE_OUT_OF_BALANCE"]
  - method: POST
    path: "/ledger/accounting-periods/{periodId}/reopen"
    description: "Owner reopens the most recently CLOSED period (CLOSED -> OPEN)"
    roles: [Owner]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects: ["closing entry reversed; balances/retained_earnings recomputed; status -> OPEN; ERR_NOT_LATEST_CLOSED_PERIOD"]

  # --- JournalEntry / JournalLine ---
  - method: POST
    path: "/ledger/journal-entries"
    description: "Create a DRAFT JournalEntry"
    roles: [Owner, Accountant, Bookkeeper]
    code: 201
    input: [company_id, period_id, entry_date, "memo?"]
    output: JournalEntry
    side_effects: ["status=DRAFT, source=MANUAL, created_by_user_id=X-User-ID, totals=0"]
  - method: GET
    path: "/ledger/journal-entries/{entryId}"
    description: "Get a JournalEntry"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: JournalEntry
    side_effects: []
  - method: GET
    path: "/ledger/journal-entries"
    description: "List JournalEntries (filter by company / period / status / reverses)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "period_id?", "status?", "reverses_journal_entry_id?"]
    output: "JournalEntry[]"
    side_effects: []
  - method: POST
    path: "/ledger/journal-lines"
    description: "Add a JournalLine to a DRAFT entry"
    roles: [Owner, Accountant, Bookkeeper]
    code: 201
    input: [journal_entry_id, account_id, "debit_cents?", "credit_cents?", "line_memo?"]
    output: JournalLine
    side_effects: ["recompute parent total_debit_cents/total_credit_cents; ERR_INVALID_LINE; ERR_INVALID_STATE if entry not DRAFT"]
  - method: GET
    path: "/ledger/journal-lines/{lineId}"
    description: "Get a JournalLine"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: JournalLine
    side_effects: []
  - method: GET
    path: "/ledger/journal-lines"
    description: "List JournalLines (filter by journal entry or account)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["journal_entry_id?", "account_id?"]
    output: "JournalLine[]"
    side_effects: []
  - method: POST
    path: "/ledger/journal-entries/{entryId}/post"
    description: "Post a DRAFT JournalEntry (maker-checker; balance + open-period checks)"
    roles: [Accountant, Owner]
    code: 200
    input: []
    output: JournalEntry
    side_effects: ["status -> POSTED; Account.posted_balance_cents recomputed; Company.trial_balance_status recomputed; ERR_ENTRY_NOT_BALANCED / ERR_SEGREGATION_OF_DUTIES / ERR_PERIOD_NOT_OPEN / ERR_ACCOUNT_ARCHIVED"]
  - method: POST
    path: "/ledger/journal-entries/{entryId}/void"
    description: "Void a POSTED JournalEntry (CASCADE B reversal)"
    roles: [Owner]
    code: 200
    input: []
    output: JournalEntry
    side_effects: ["REVERSAL entry created+posted; Account balances + trial_balance recomputed; status -> VOIDED; ERR_PERIOD_CLOSED / ERR_CLOSING_ENTRY_PROTECTED"]

  # --- BankAccount ---
  - method: POST
    path: "/ledger/bank-accounts"
    description: "Create a BankAccount linked to a cash GL account"
    roles: [Owner, Accountant]
    code: 201
    input: [company_id, gl_account_id, nickname]
    output: BankAccount
    side_effects: ["last_reconciled_statement_balance_cents=0, last_reconciled_through=null, version=1; ERR_INVALID_CATEGORIZATION_ACCOUNT if gl account not is_cash/ASSET"]
  - method: GET
    path: "/ledger/bank-accounts/{bankAccountId}"
    description: "Get a BankAccount"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: BankAccount
    side_effects: []
  - method: GET
    path: "/ledger/bank-accounts"
    description: "List BankAccounts (filter by company / gl account)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "gl_account_id?"]
    output: "BankAccount[]"
    side_effects: []

  # --- BankFeedTransaction ---
  - method: POST
    path: "/ledger/bank-feed-transactions"
    description: "Import a bank-feed transaction (status UNMATCHED)"
    roles: [Owner, Accountant, Bookkeeper]
    code: 201
    input: [company_id, bank_account_id, posted_date, amount_cents, bank_description]
    output: BankFeedTransaction
    side_effects: ["status=UNMATCHED, cleared=false"]
  - method: GET
    path: "/ledger/bank-feed-transactions/{transactionId}"
    description: "Get a BankFeedTransaction"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: BankFeedTransaction
    side_effects: []
  - method: GET
    path: "/ledger/bank-feed-transactions"
    description: "List BankFeedTransactions (filter by company / bank account / counter account / journal entry / status)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "bank_account_id?", "counter_account_id?", "journal_entry_id?", "status?"]
    output: "BankFeedTransaction[]"
    side_effects: []
  - method: POST
    path: "/ledger/bank-feed-transactions/{transactionId}/categorize"
    description: "Categorize a transaction -> CATEGORIZED, creating a posted BANK_FEED entry"
    roles: [Bookkeeper, Accountant]
    code: 200
    input: [counter_account_id]
    output: BankFeedTransaction
    side_effects: ["BANK_FEED JournalEntry created+posted; journal_entry_id set; status -> CATEGORIZED; ERR_INVALID_CATEGORIZATION_ACCOUNT / ERR_ACCOUNT_ARCHIVED / ERR_PERIOD_NOT_OPEN"]
  - method: POST
    path: "/ledger/bank-feed-transactions/{transactionId}/recategorize"
    description: "Recategorize a CATEGORIZED transaction back to UNMATCHED (voids its entry)"
    roles: [Bookkeeper, Accountant]
    code: 200
    input: []
    output: BankFeedTransaction
    side_effects: ["linked entry voided; status -> UNMATCHED; ERR_TRANSACTION_CLEARED"]
  - method: POST
    path: "/ledger/bank-feed-transactions/{transactionId}/exclude"
    description: "Exclude an UNMATCHED transaction (status -> EXCLUDED)"
    roles: [Bookkeeper, Accountant]
    code: 200
    input: []
    output: BankFeedTransaction
    side_effects: ["status -> EXCLUDED"]

  # --- Reconciliation ---
  - method: POST
    path: "/ledger/reconciliations"
    description: "Start a Reconciliation (computes difference_cents)"
    roles: [Accountant, Owner]
    code: 201
    input: [company_id, bank_account_id, statement_start_date, statement_end_date, statement_opening_balance_cents, statement_ending_balance_cents, included_transaction_ids]
    output: Reconciliation
    side_effects: ["status=IN_PROGRESS; difference_cents computed; ERR_TRANSACTION_NOT_CATEGORIZED if any included txn not CATEGORIZED"]
  - method: GET
    path: "/ledger/reconciliations/{reconciliationId}"
    description: "Get a Reconciliation"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: Reconciliation
    side_effects: []
  - method: GET
    path: "/ledger/reconciliations"
    description: "List Reconciliations (filter by company / bank account / status)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "bank_account_id?", "status?"]
    output: "Reconciliation[]"
    side_effects: []
  - method: POST
    path: "/ledger/reconciliations/{reconciliationId}/finalize"
    description: "Finalize a balanced Reconciliation (OCC on bank account version)"
    roles: [Accountant, Owner]
    code: 200
    input: [expected_bank_account_version]
    output: Reconciliation
    side_effects: ["included transactions cleared=true; BankAccount.last_reconciled_* updated; BankAccount.version += 1; status -> RECONCILED; ERR_RECONCILIATION_UNBALANCED / ERR_TRANSACTION_NOT_CATEGORIZED / ERR_STALE_VERSION"]
  - method: POST
    path: "/ledger/reconciliations/{reconciliationId}/abandon"
    description: "Abandon an in-progress Reconciliation"
    roles: [Accountant, Owner]
    code: 200
    input: []
    output: Reconciliation
    side_effects: ["status -> ABANDONED"]

  # --- Customer / Invoice / InvoicePayment ---
  - method: POST
    path: "/ledger/customers"
    description: "Create a Customer"
    roles: [Owner, Accountant, Bookkeeper]
    code: 201
    input: [company_id, display_name, tax_jurisdiction, ar_account_id]
    output: Customer
    side_effects: []
  - method: GET
    path: "/ledger/customers/{customerId}"
    description: "Get a Customer"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/ledger/customers"
    description: "List Customers (filter by company / ar account)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "ar_account_id?"]
    output: "Customer[]"
    side_effects: []
  - method: POST
    path: "/ledger/invoices"
    description: "Create a DRAFT Invoice"
    roles: [Owner, Accountant, Bookkeeper]
    code: 201
    input: [company_id, customer_id, revenue_account_id, tax_liability_account_id, issue_date, lines]
    output: Invoice
    side_effects: ["delivery_status=DRAFT, payment_status=UNPAID, computed fields=0"]
  - method: GET
    path: "/ledger/invoices/{invoiceId}"
    description: "Get an Invoice"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/ledger/invoices"
    description: "List Invoices (filter by company / customer / revenue account / tax-liability account / status)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "customer_id?", "revenue_account_id?", "tax_liability_account_id?", "delivery_status?", "payment_status?"]
    output: "Invoice[]"
    side_effects: []
  - method: POST
    path: "/ledger/invoices/{invoiceId}/send"
    description: "Send a DRAFT Invoice (computes totals, posts AR entry)"
    roles: [Bookkeeper, Accountant]
    code: 200
    input: []
    output: Invoice
    side_effects: ["totals computed via invoice_total_breakdown; AR posting entry; delivery_status -> SENT; ERR_INVOICE_EMPTY / ERR_PERIOD_NOT_OPEN"]
  - method: POST
    path: "/ledger/invoices/{invoiceId}/void"
    description: "Void a SENT unpaid Invoice"
    roles: [Accountant, Owner]
    code: 200
    input: []
    output: Invoice
    side_effects: ["posting entry reversed; delivery_status -> VOID; ERR_INVOICE_HAS_PAYMENTS / ERR_PERIOD_CLOSED"]
  - method: POST
    path: "/ledger/invoice-payments"
    description: "Record a payment against a SENT Invoice (posts receipt entry)"
    roles: [Bookkeeper, Accountant]
    code: 201
    input: [company_id, invoice_id, deposit_bank_account_id, amount_cents]
    output: InvoicePayment
    side_effects: ["receipt JournalEntry posted; Invoice.amount_paid/balance/payment_status recomputed; status=CLEARED; ERR_PAYMENT_EXCEEDS_BALANCE / ERR_INVALID_STATE if invoice not SENT"]
  - method: GET
    path: "/ledger/invoice-payments/{paymentId}"
    description: "Get an InvoicePayment"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: InvoicePayment
    side_effects: []
  - method: GET
    path: "/ledger/invoice-payments"
    description: "List InvoicePayments (filter by company / invoice / deposit bank account / journal entry)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "invoice_id?", "deposit_bank_account_id?", "journal_entry_id?"]
    output: "InvoicePayment[]"
    side_effects: []
  - method: POST
    path: "/ledger/invoice-payments/{paymentId}/reverse"
    description: "Reverse a CLEARED InvoicePayment (compensation)"
    roles: [Accountant, Owner]
    code: 200
    input: []
    output: InvoicePayment
    side_effects: ["receipt entry reversed; Invoice balances/payment_status recomputed; status -> REVERSED; ERR_PERIOD_CLOSED"]

  # --- Vendor / Bill ---
  - method: POST
    path: "/ledger/vendors"
    description: "Create a Vendor"
    roles: [Owner, Accountant, Bookkeeper]
    code: 201
    input: [company_id, display_name, ap_account_id, "is_1099_eligible?"]
    output: Vendor
    side_effects: ["ytd_1099_total_cents=0"]
  - method: GET
    path: "/ledger/vendors/{vendorId}"
    description: "Get a Vendor"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: GET
    path: "/ledger/vendors"
    description: "List Vendors (filter by company / ap account)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "ap_account_id?"]
    output: "Vendor[]"
    side_effects: []
  - method: GET
    path: "/ledger/vendors/{vendorId}/1099"
    description: "Get the vendor 1099 total (cash vs accrual variant per company basis)"
    roles: [Owner, Accountant, Auditor]
    code: 200
    input: []
    output: "{ vendor_id: string, basis: string, ytd_1099_total_cents: integer, is_1099_eligible: boolean }"
    side_effects: []
  - method: POST
    path: "/ledger/bills"
    description: "Create a DRAFT Bill"
    roles: [Owner, Accountant, Bookkeeper]
    code: 201
    input: [company_id, vendor_id, expense_account_id, bill_date, lines]
    output: Bill
    side_effects: ["status=DRAFT; computed fields=0"]
  - method: GET
    path: "/ledger/bills/{billId}"
    description: "Get a Bill"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: Bill
    side_effects: []
  - method: GET
    path: "/ledger/bills"
    description: "List Bills (filter by company / vendor / expense account / status)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "vendor_id?", "expense_account_id?", "status?"]
    output: "Bill[]"
    side_effects: []
  - method: POST
    path: "/ledger/bills/{billId}/approve"
    description: "Approve a DRAFT Bill (computes use tax, posts AP entry, recomputes accrual 1099)"
    roles: [Accountant, Owner]
    code: 200
    input: []
    output: Bill
    side_effects: ["use_tax/total via bill_use_tax_total; AP posting entry; Vendor 1099 (accrual) recomputed; status -> APPROVED; ERR_BILL_EMPTY / ERR_PERIOD_NOT_OPEN"]
  - method: POST
    path: "/ledger/bills/{billId}/record-payment"
    description: "Record a payment against an APPROVED/PARTIALLY_PAID Bill"
    roles: [Accountant, Owner]
    code: 200
    input: [pay_from_bank_account_id, amount_cents, payment_date]
    output: Bill
    side_effects: ["AP-settling entry posted; amount_paid/paid_in_tax_year recomputed; Vendor 1099 (cash) recomputed; status -> PARTIALLY_PAID or PAID; ERR_BILL_OVERPAY / ERR_PERIOD_NOT_OPEN"]
  - method: POST
    path: "/ledger/bills/{billId}/void"
    description: "Void a DRAFT Bill"
    roles: [Accountant, Owner]
    code: 200
    input: []
    output: Bill
    side_effects: ["status -> VOID; ERR_INVALID_STATE if not DRAFT"]

  # --- TaxRate ---
  - method: POST
    path: "/ledger/tax-rates"
    description: "Create a TaxRate effective window (no overlap per jurisdiction)"
    roles: [Owner, Accountant]
    code: 201
    input: [company_id, jurisdiction, rate_bps, effective_from, effective_to]
    output: TaxRate
    side_effects: ["ERR_TAX_RATE_OVERLAP if window overlaps an existing rate for the jurisdiction"]
  - method: GET
    path: "/ledger/tax-rates/{taxRateId}"
    description: "Get a TaxRate"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: []
    output: TaxRate
    side_effects: []
  - method: GET
    path: "/ledger/tax-rates"
    description: "List TaxRates (filter by company / jurisdiction)"
    roles: [Owner, Accountant, Bookkeeper, Auditor]
    code: 200
    input: ["company_id?", "jurisdiction?"]
    output: "TaxRate[]"
    side_effects: []

  # --- Financial statements (computed read) ---
  - method: GET
    path: "/ledger/companies/{companyId}/financial-statements"
    description: "Generate trial balance / P&L / balance sheet from POSTED entries"
    roles: [Owner, Accountant, Auditor]
    code: 200
    input: ["as_of_period_id?"]
    output: "{ trial_balance_status: string, total_revenue_cents: integer, total_expense_cents: integer, net_income_cents: integer, total_assets_cents: integer, total_liabilities_cents: integer, total_equity_cents: integer }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or X-User-Role not a known role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller's role is not permitted for this endpoint" }
  # --- Not found ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource (company, period, invoice, bill, vendor, customer, bank account, reconciliation, transaction, journal entry) does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "A referenced account_id does not exist" }
  # --- Request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or non-integer cents value" }
  - { id: ERR_INVALID_LINE, http: 422, condition: "A JournalLine does not have exactly one of debit_cents/credit_cents > 0, or a value is negative" }
  - { id: ERR_ENTRY_NOT_BALANCED, http: 422, condition: "JournalEntry post attempted with debits != credits, zero total, or fewer than two lines" }
  - { id: ERR_INVOICE_EMPTY, http: 422, condition: "Invoice send attempted with no lines" }
  - { id: ERR_BILL_EMPTY, http: 422, condition: "Bill approve attempted with no lines" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  # --- Segregation / RBAC business ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The X-User-ID posting a journal entry equals its created_by_user_id (maker cannot post own entry)" }
  # --- Referential / categorization ---
  - { id: ERR_INVALID_CATEGORIZATION_ACCOUNT, http: 409, condition: "Categorization target account is EQUITY, the bank's own cash account, or the bank gl account is not a cash ASSET" }
  - { id: ERR_ACCOUNT_ARCHIVED, http: 409, condition: "A referenced account is ARCHIVED" }
  - { id: ERR_ACCOUNT_TYPE_MISMATCH, http: 409, condition: "A sub-account's account_type differs from its parent_account_id's type" }
  - { id: ERR_DUPLICATE_ACCOUNT_CODE, http: 409, condition: "Account code already used by a non-ARCHIVED account in the company" }
  # --- Fiscal / period ---
  - { id: ERR_PERIOD_NOT_OPEN, http: 409, condition: "Operation requires the relevant period OPEN but it is CLOSING/CLOSED or not the current period, or the entity date falls outside it" }
  - { id: ERR_PERIOD_CLOSED, http: 409, condition: "Void/reverse against a CLOSED period" }
  - { id: ERR_PERIOD_NOT_CONTIGUOUS, http: 409, condition: "New period start_date does not equal the prior closed period's end_date" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 409, condition: "begin-close attempted with one or more close_checklist items not done" }
  - { id: ERR_OPEN_DRAFT_ENTRIES, http: 409, condition: "begin-close attempted while DRAFT journal entries exist in the period" }
  - { id: ERR_RECONCILIATION_IN_PROGRESS, http: 409, condition: "begin-close attempted while an IN_PROGRESS reconciliation exists for the company" }
  - { id: ERR_TRIAL_BALANCE_OUT_OF_BALANCE, http: 409, condition: "post-close attempted while Company.trial_balance_status is OUT_OF_BALANCE" }
  - { id: ERR_NOT_LATEST_CLOSED_PERIOD, http: 409, condition: "reopen attempted on a period that is not the most recently closed one" }
  - { id: ERR_CLOSING_ENTRY_PROTECTED, http: 409, condition: "Direct void attempted on a CLOSING-source journal entry (use period reopen)" }
  # --- Payments ---
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 409, condition: "InvoicePayment amount exceeds the invoice balance_due_cents" }
  - { id: ERR_BILL_OVERPAY, http: 409, condition: "Bill payment would push amount_paid_cents above total_cents" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "Void attempted on an invoice that has a CLEARED payment" }
  # --- Reconciliation ---
  - { id: ERR_RECONCILIATION_UNBALANCED, http: 409, condition: "finalize attempted while difference_cents != 0" }
  - { id: ERR_TRANSACTION_NOT_CATEGORIZED, http: 409, condition: "An included reconciliation transaction is not CATEGORIZED or is already cleared" }
  - { id: ERR_TRANSACTION_CLEARED, http: 409, condition: "recategorize attempted on a transaction already cleared by a reconciliation" }
  # --- Tax rates ---
  - { id: ERR_TAX_RATE_OVERLAP, http: 409, condition: "A new TaxRate window overlaps an existing rate for the same jurisdiction" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_company_version / expected_bank_account_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Owner
    description: "Business owner / superuser. Creates the company, configures it, reopens closed periods, voids posted entries, and can do everything Accountant and Bookkeeper can."
    identity: opaque
    exclusive_operations:
      - "POST /ledger/companies — Create company"
      - "PATCH /ledger/companies/{id} — Configure company"
      - "POST /ledger/accounting-periods/{id}/reopen — Reopen a closed period"
      - "POST /ledger/journal-entries/{id}/void — Void a posted entry"
    shared_operations:
      - "Account create/archive, period open/checklist, journal entry create/line/post, bank accounts, reconciliations, invoices, bills, vendors, customers, tax rates, all reads"
  - name: Accountant
    description: "Posts journal entries, approves bills, runs the monthly close (begin-close/post-close), reconciles bank accounts, voids invoices, reverses payments. Cannot post an entry they drafted (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /ledger/accounting-periods/{id}/begin-close — Begin period close"
      - "POST /ledger/accounting-periods/{id}/post-close — Post period close"
    shared_operations:
      - "Account create/archive, period open/checklist, journal entry create/line/post, categorize, reconciliation finalize, invoice send/void, invoice-payment create/reverse, bill approve/record-payment, tax rate create, all reads"
  - name: Bookkeeper
    description: "Day-to-day data entry: drafts journal entries and lines, categorizes bank-feed transactions, drafts and sends invoices, records invoice payments, drafts bills. Cannot post journal entries, approve bills, run close, or reconcile."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "Journal entry create/line, bank-feed transaction import/categorize/recategorize/exclude, invoice create/send, invoice-payment create, customer/vendor/bill create, period checklist, all reads"
  - name: Auditor
    description: "Read-only access to all resources, financial statements, and 1099 totals. Cannot mutate anything."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (companies, accounts, balances, periods, journal entries/lines, bank accounts/transactions, reconciliations, invoices, payments, vendors/1099, bills, tax rates, financial statements)"
