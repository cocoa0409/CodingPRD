            - { call: "POST /care-network/referrals/${rf2_id}/start-service", payload: {}, as: OrgAdmin, as_user_id: "${r_id}" }
            - { call: "POST /care-network/referrals/${rf2_id}/confirm-outcome", payload: { outcome_code: "DELIVERED", delivered_units: 200 }, as: OrgAdmin, as_user_id: "${r_id}" }
            - call: "POST /care-network/claims"
              payload: { referral_id: "${rf1_id}", funder_org_id: "${f_id}", claimed_units: 200 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { cl1_id: $.data.id }
            - { call: "POST /care-network/claims/${cl1_id}/review", payload: {}, as: FunderAdmin, as_user_id: "${f_id}#rev1" }
            - call: "GET /care-network/claims/${cl1_id}"
              payload: {}
              as: FunderAdmin
              as_user_id: "${f_id}"
              captures: { cl1_v: $.data.version }
            - call: "POST /care-network/claims/${cl1_id}/approve"
              payload: { expected_claim_version: "${cl1_v}" }
              as: FunderAdmin
              as_user_id: "${f_id}#rev2"
            - call: "POST /care-network/claims"
              payload: { referral_id: "${rf2_id}", funder_org_id: "${f_id}", claimed_units: 200 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { cl2_id: $.data.id }
            - { call: "POST /care-network/claims/${cl2_id}/review", payload: {}, as: FunderAdmin, as_user_id: "${f_id}#rev1" }
          trigger:
            - call: "GET /care-network/claims/${cl2_id}"
              payload: {}
              as: FunderAdmin
              as_user_id: "${f_id}"
              captures: { cl2_v: $.data.version }
            - call: "POST /care-network/claims/${cl2_id}/approve"
              payload: { expected_claim_version: "${cl2_v}" }
              as: FunderAdmin
              as_user_id: "${f_id}#rev2"
          assert:
            - "PaymentClaim.${cl1_id}.approved_amount_cents == 20000"
            - "PaymentClaim.${cl2_id}.approved_amount_cents == 5000 (clamped to remaining cap 25000 - 20000; self-exclusion from paid_this_month is what yields 5000, not 0)"
            - "Organization.${r_id}.payable_balance_cents == 25000"

      - name: eligibility_multi_input_income_boundary
        grounds:
          - calculations.eligibility_evaluation
          - validations[priority=12]
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — age
          window (inclusive bounds), zip whitelist, gender match, and a strict
          income cap compose conjunctively; flipping any single input flips
          the result. Client with income exactly AT the cap (strict <) fails
          while an identical client one cent below passes — the same referral
