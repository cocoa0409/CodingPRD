  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_table_version_on_appointment_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appointment-create-stale-table]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Booking appointment A advances Table.version; a second booking still carrying the pre-A expected_table_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A table observed at version V; one appointment booked against it (version advances to V+1); a second booking carries the stale V."]
          setup_api_calls:
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "TOC", license_number: "LMT-992001", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t1: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "TOC2", license_number: "LMT-992002", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t2: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "ROC-A", room: "ROC" }
