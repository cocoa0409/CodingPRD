              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_h_id: $.data.id }
          trigger:
            - call: "GET /ej/screening-areas/${area_h_id}"
              payload: {}
              as: "AuditorGeneral"
              as_user_id: "audit-1"
              captures: { err_unknown_role: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "${err_unknown_role} == ERR_UNKNOWN_ROLE"

