              payload: {}
              as: EnforcementPlanner
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 10 }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /inspectors"
              payload: { badge_number: "B-100", display_name: "Inspector One", certification_expiry: "2027-01-01T00:00:00Z", status: "ACTIVE" }
              as: EnforcementPlanner
              captures: { i1: $.data.id }
            - call: "POST /riders"
              payload: { rider_ref: "R-100", display_name: "Rider One", demographic_band: "BAND_A", residence_geo_tract: "T-001", fare_assistance_enrolled: false }
              as: EnforcementPlanner
              captures: { r1: $.data.id }
