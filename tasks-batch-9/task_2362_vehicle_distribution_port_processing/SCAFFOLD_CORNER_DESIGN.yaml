# =============================================================================
# task_2362 — §1.9 Scaffold Corner Design (breadth probe)
#
# Walked row-by-row from references/claim-extraction-guide.md against §1.1–§1.7 of
# SCAFFOLD.yaml (domain vehicle-distribution-port-processing, api_prefix /vpc).
# Corners already exercised end-to-end by a §1.8 instance carry an `excluded_because`
# stub naming that instance instead of a duplicate test_recipe.
# Logical clock default for every recipe: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # =========================================================== 1. Entities
  - section: entities
    instances:
      - name: corner_processing_center_creation_returns_defaults_and_zeroed_computed_fields
        claim_type: Creation
        grounds:
          - entities.ProcessingCenter
          - endpoints.POST_/vpc/processing-centers
          - entities.ProcessingCenter.fields.yard_posture
        distinguishing_aspect: "POST /vpc/processing-centers with every required input returns 201, echoes the inputs verbatim and materialises yard_occupied_slots 0, yard_free_slots 50, yard_posture OPEN and all three ledger fields at 0."
        test_recipe:
          setup:
            - "Empty database; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
          trigger:
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id, posture: $.data.yard_posture, free: $.data.yard_free_slots }
          assert:
            - "HTTP 201 and ${center_id} is a server-minted id"
            - "ProcessingCenter.${center_id}.port_code == USNPT and yard_capacity_slots == 50 and daily_storage_rate_cents == 1450"
            - "ProcessingCenter.${center_id}.labor_rate_cents_per_hour == 9000 and fuel_surcharge_pct == 0.0925 and free_storage_days == 5"
            - "${posture} == OPEN and ${free} == 50 and ProcessingCenter.${center_id}.yard_occupied_slots == 0"
            - "ProcessingCenter.${center_id}.provisional_storage_accrued_cents == 0, realized_storage_revenue_cents == 0, repair_spend_cents == 0"
            - "Response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: corner_vehicle_retrieval_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/vpc/vehicles/{vehicleId}
          - entities.Vehicle.fields.yard_in_at
        distinguishing_aspect: "GET /vpc/vehicles/{vehicleId} returns the same vin, model_line, processing_status DISCHARGED and yard_in_at 2026-08-02T00:00:00Z that the discharge call stamped."
        setup_note: "Read-back of a row created through the discharge endpoint."
        test_recipe:
          setup:
            - "One center, one berth, one vessel DISCHARGING, one unit discharged at 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000101", model_line: "LX500" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
          trigger:
            - call: "GET /vpc/vehicles/${veh_id}"
              payload: {}
              as: PortOperationsPlanner
              captures: { vin_read: $.data.vin, status_read: $.data.processing_status, in_at: $.data.yard_in_at }
          assert:
            - "HTTP 200 and ${vin_read} == 1VWSA7A3XFC000101"
            - "${status_read} == DISCHARGED and ${in_at} == 2026-08-02T00:00:00Z"
            - "Vehicle.${veh_id}.processing_center_id == ${center_id} and vessel_id == ${vessel_id} (both system-derived from the path)"
            - "Vehicle.${veh_id}.yard_presence == IN_YARD and version == 1"

      - name: corner_vehicle_listing_paginates_and_filters_by_processing_status
        claim_type: Listing
        grounds:
          - endpoints.GET_/vpc/vehicles
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /vpc/vehicles with processing_status=DISCHARGED, limit=2, offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "One vessel DISCHARGING with three units discharged, all in processing_status DISCHARGED."
            - "A fourth unit is surveyed so it sits in SURVEYED and must be excluded by the filter."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000102", model_line: "LX500" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000103", model_line: "LX500" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000104", model_line: "TX300" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000105", model_line: "EV900" }
              as: PortOperationsPlanner
              captures: { veh_surveyed: $.data.id }
            - call: "POST /vpc/vehicles/${veh_surveyed}/damage-surveys"
              payload: { line_items: [{ damage_zone: "INTERIOR", severity_points: 20, repair_estimate_cents: 0 }] }
              as: DamageSurveyor
              captures: { survey_id: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_id}/submit"
              payload: {}
              as: DamageSurveyor
          trigger:
            - call: "GET /vpc/vehicles"
              payload: { processing_status: "DISCHARGED", limit: 2, offset: 0 }
              as: PortOperationsPlanner
            - call: "GET /vpc/vehicles"
              payload: { processing_status: "DISCHARGED", limit: 2, offset: 2 }
              as: PortOperationsPlanner
            - call: "GET /vpc/vehicles"
              payload: { model_line: "EV900" }
              as: PortOperationsPlanner
          assert:
            - "First page: response_type == array, data length == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: data length == 1, total_count == 3, has_more == false, offset == 2"
            - "The surveyed EV900 unit ${veh_surveyed} appears in neither DISCHARGED page"
            - "model_line=EV900 filter returns exactly 1 row whose id == ${veh_surveyed} and total_count == 1"
            - "Default pagination when limit/offset are omitted: limit 10, offset 0"

      - name: corner_unknown_vehicle_id_returns_vehicle_not_found
        claim_type: Not Found
        grounds:
          - validations.priority_3
          - errors.ERR_VEHICLE_NOT_FOUND
          - endpoints.GET_/vpc/vehicles/{vehicleId}
        distinguishing_aspect: "GET /vpc/vehicles/{vehicleId} for a syntactically valid but unknown UUID returns ERR_VEHICLE_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "Empty database except for one center (so the route is otherwise operable)."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
          trigger:
            - call: "GET /vpc/vehicles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PortOperationsPlanner
              captures: { nf_error: $.data.error_id }
          assert:
            - "${nf_error} == ERR_VEHICLE_NOT_FOUND with HTTP 404 and response_type == error"
            - "data.message is a non-empty string and no data.id is present"

      - name: corner_missing_required_field_on_vessel_create_is_rejected
        claim_type: Required Fields
        grounds:
          - validations.priority_5
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/vpc/vessels
        distinguishing_aspect: "POST /vpc/vessels omitting declared_unit_count — an input field with no default — returns ERR_INVALID_REQUEST 400 and creates no Vessel row."
        test_recipe:
          setup:
            - "One center and one berth exist."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
          trigger:
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z" }
              as: PortOperationsPlanner
              captures: { missing_required_error: $.data.error_id }
          assert:
            - "${missing_required_error} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /vpc/vessels?processing_center_id=${center_id} returns total_count == 0"

      - name: corner_omitted_optional_inputs_take_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.ProcessingCenter.fields.free_storage_days
          - entities.Berth.fields.turnaround_buffer_minutes
          - entities.TruckCarrier.fields.status
        distinguishing_aspect: "Omitting free_storage_days yields 5, omitting turnaround_buffer_minutes yields 120 and omitting status yields ACTIVE — the three declared defaults in §1.1."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
          trigger:
            - call: "POST /vpc/processing-centers"
              payload: { name: "Default VPC", port_code: "USDFT", yard_capacity_slots: 20, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id, free_days: $.data.free_storage_days }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1" }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id, buffer: $.data.turnaround_buffer_minutes }
            - call: "POST /vpc/truck-carriers"
              payload: { carrier_code: "TC-DEF", name: "Default Transport", served_route_zones: ["A"], linehaul_rate_cents_per_mile: 400, slot_capacity: 2, concurrent_load_capacity: 1 }
              as: DistributionManager
              captures: { carrier_id: $.data.id, carrier_status: $.data.status }
          assert:
            - "${free_days} == 5"
            - "${buffer} == 120"
            - "${carrier_status} == ACTIVE"
            - "TruckCarrier.${carrier_id}.committed_slots == 0 and available_slots == 2"

      - name: corner_computed_fields_are_server_owned_and_client_values_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Vehicle.fields.severity_index
          - entities.Vehicle.fields.claim_mandatory
          - entities.DamageSurvey.fields.line_count
          - entities.DamageSurvey.fields.claimed_amount_cents
        distinguishing_aspect: "A newly discharged unit reports severity_index 0 and claim_mandatory false regardless of any client-supplied value, and the survey's line_count 1, severity_index 20 and claimed_amount_cents 15000 are derived from line_items alone."
        test_recipe:
          setup:
            - "One vessel DISCHARGING with a single unit discharged."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000106", model_line: "LX500" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id, sev_at_discharge: $.data.severity_index, mandatory_at_discharge: $.data.claim_mandatory }
          trigger:
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "INTERIOR", severity_points: 20, repair_estimate_cents: 15000 }] }
              as: DamageSurveyor
              captures: { survey_id: $.data.id, lines: $.data.line_count, sev: $.data.severity_index, claimable: $.data.claimed_amount_cents }
          assert:
            - "${sev_at_discharge} == 0 and ${mandatory_at_discharge} == false"
            - "${lines} == 1 and ${sev} == 20 (round_half_up(20 x 1.0) + 5 x 0)"
            - "${claimable} == 15000 (min(15000, 80000))"
            - "Vehicle.${veh_id}.severity_index == 0 while the survey is still DRAFT — the unit's copy is written only at submit"
            - "DamageSurvey.${survey_id}.status == DRAFT"

      - name: corner_system_fields_are_generated_and_never_client_supplied
        claim_type: System Fields
        grounds:
          - entities.Vehicle.fields.processing_center_id
          - entities.Vehicle.fields.yard_presence
          - entities.Vehicle.fields.processing_status
          - entities.DamageSurvey.fields.surveyed_by_user_id
        distinguishing_aspect: "The discharge call accepts only vin, model_line and pio_program_code; processing_center_id, vessel_id, yard_in_at, yard_presence IN_YARD and processing_status DISCHARGED are stamped by the server, and surveyed_by_user_id is taken from X-User-ID, not the body."
        test_recipe:
          setup:
            - "One vessel DISCHARGING under a known center."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000107", model_line: "TX300" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id, presence: $.data.yard_presence, status: $.data.processing_status, created: $.data.created_at }
          trigger:
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "INTERIOR", severity_points: 20, repair_estimate_cents: 0 }] }
              as: DamageSurveyor
              as_user_id: "u-ds-1"
              captures: { survey_id: $.data.id, surveyor: $.data.surveyed_by_user_id }
          assert:
            - "${presence} == IN_YARD, ${status} == DISCHARGED and ${created} == 2026-08-02T00:00:00Z (the logical clock, not wall time)"
            - "Vehicle.${veh_id}.processing_center_id == ${center_id} and vessel_id == ${vessel_id}"
            - "${surveyor} == u-ds-1 — taken from the X-User-ID header"
            - "DamageSurvey.${survey_id}.vehicle_id == ${veh_id} — derived from the path, not the body"
            - "Vehicle.${veh_id}.version == 1 and updated_at == created_at immediately after discharge"

      - name: corner_type_constraints_reject_bad_enum_short_vin_and_inverted_interval
        claim_type: Type Constraints
        grounds:
          - validations.priority_5
          - entities.Vehicle.fields.model_line
          - entities.Vehicle.fields.vin
          - entities.Vessel.fields.berth_window_end
          - entities.Dealer.fields.route_zone
        distinguishing_aspect: "Four independent schema violations each return ERR_INVALID_REQUEST 400: model_line SX999 outside the enum, a 16-character VIN, berth_window_end equal to berth_window_start, and route_zone D outside {A,B,C}."
        test_recipe:
          setup:
            - "One center, one berth and one vessel DISCHARGING."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
          trigger:
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000108", model_line: "SX999" }
              as: PortOperationsPlanner
              captures: { bad_enum_error: $.data.error_id }
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC00010", model_line: "LX500" }
              as: PortOperationsPlanner
              captures: { short_vin_error: $.data.error_id }
            - call: "POST /vpc/vessels"
