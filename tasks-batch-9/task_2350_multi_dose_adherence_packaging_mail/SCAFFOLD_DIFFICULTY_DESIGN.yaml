  - rule_id: boundary_precision_check
    instances:

      - name: refill_too_soon_threshold_exact_boundary_on_adjudicate
        grounds:
          - calculations.refill_pct_used
          - entities.InsurancePlan.fields.refill_too_soon_threshold_pct
          - entities.CycleLine.fields.refill_pct_used
          - validations.priority_44
          - endpoints.POST_/pharmacy/fill-cycles/{id}/adjudicate
        distinguishing_aspect: |
          Metric: refill_pct_used, an INTEGER percentage floor-divided from elapsed days,
          probed at 74 / 75 / 76 against an inclusive threshold of 75. Endpoint under test:
          POST /pharmacy/fill-cycles/{id}/adjudicate. A strict > comparison, or rounding
          instead of flooring, flips only the 75 case.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "a plan with refill_too_soon_threshold_pct 75"
            - "three patients A, B, C, each synchronized BRIDGE_TO_START on anchor day 15 with one identical Metformin ER [MORNING] prescription whose last_dispensed_days_supply is 100"
            - "A last_dispensed_date 2026-06-02 -> elapsed 74 days -> floor(100*74/100) = 74 (threshold - 1)"
            - "B last_dispensed_date 2026-06-01 -> elapsed 75 days -> floor(100*75/100) = 75 (exactly the threshold)"
            - "C last_dispensed_date 2026-05-31 -> elapsed 76 days -> floor(100*76/100) = 76 (threshold + 1)"
            - "each patient has a DRAFT cycle 2026-08-15 .. 2026-09-12 with day_supply_days 28"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, max_day_supply_days: 90, vacation_overrides_per_year: 1, coinsurance_pct: 20, allows_payer_vacation_override: true }
