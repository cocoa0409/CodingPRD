# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: refill_charge_provisional_vs_final
        grounds:
          - calculations.refill_self_pay_charge
          - entities.RefillOrder.fields.provisional_charge_cents
          - entities.RefillOrder.fields.final_charge_cents
          - state_machines.RefillOrder.PENDING_REVIEW_to_DISPENSED
        distinguishing_aspect: |
          Same RefillOrder, two variants: provisional uses requested_quantity_units=8 (=> 30000),
          final uses dispensed_quantity_units=10 (=> 36750); the two differ by 6750. Domain: RefillOrder cost.
        test_recipe:
          setup:
            - "PLUS plan (refill_discount_pct=0.25); patient with ACTIVE/CURRENT membership; ISSUED prescription (unit_price_cents=5000, is_controlled=true, refills_authorized=3); baseline REVIEWED panel within window."
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr A", npi: "1000000001", dea_number: "AA1111111" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/pharmacists", payload: { full_name: "Ph B", license_number: "PH-1" }, as: ClinicAdmin, captures: { pharmacist_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Pat One", date_of_birth: "1980-01-01", sex: "MALE", email: "p1@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_id}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", baseline_panel_id: "${panel_id}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/prescriptions", payload: { plan_id: "${plan_id}", patient_id: "${patient_id}", drug_name: "Testosterone Cypionate", unit_price_cents: 5000, quantity_per_fill: 8, refills_authorized: 3, is_controlled: true }, as: Clinician, as_user_id: "${clinician_id}", captures: { rx_id: "$.data.id", rx_v: "$.data.version" } }
          trigger:
            - { call: "POST /clinic/refill-orders", payload: { prescription_id: "${rx_id}", membership_id: "${membership_id}", patient_id: "${patient_id}", requested_quantity_units: 8, expected_prescription_version: "${rx_v}" }, as: ClinicAdmin, captures: { refill_id: "$.data.id", prov: "$.data.provisional_charge_cents" } }
            - { call: "POST /clinic/refill-orders/${refill_id}/dispense", payload: { dispensed_quantity_units: 10 }, as: Pharmacist, as_user_id: "${pharmacist_id}", captures: { fin: "$.data.final_charge_cents" } }
          assert:
            - "RefillOrder ${refill_id}.provisional_charge_cents == 30000"
            - "RefillOrder ${refill_id}.final_charge_cents == 36750"
            - "RefillOrder ${refill_id}.provisional_charge_cents != RefillOrder ${refill_id}.final_charge_cents"

      - name: patient_risk_provisional_vs_comprehensive
        grounds:
          - calculations.patient_monitoring_risk
          - endpoints["GET /clinic/patients/{id}/monitoring-summary"]
          - entities.LabPanel.fields.hematocrit_pct
        distinguishing_aspect: |
          Same patient, two variants on the SAME risk metric but different entity domain (Patient vs RefillOrder above):
          provisional = latest panel risk (70); comprehensive = mean over window (63); the two diverge by 7.
        test_recipe:
          setup:
            - "Patient with two REVIEWED panels within the 90-day window: older(hct=52,psa=3.5,t=280 -> 56), latest(hct=55,psa=4.2,t=350 -> 70)."
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr A", npi: "1000000002", dea_number: "AA2222222" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Two", date_of_birth: "1979-02-02", sex: "MALE", email: "p2@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "MONITORING" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_a: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_a}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_a}/result", payload: { total_testosterone_ng_dl: 280, psa_ng_ml: 3.5, hematocrit_pct: 52.0, drawn_at: "2026-04-10T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_a}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "MONITORING" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_b: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_b}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_b}/result", payload: { total_testosterone_ng_dl: 350, psa_ng_ml: 4.2, hematocrit_pct: 55.0, drawn_at: "2026-04-25T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_b}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
          trigger:
            - { call: "GET /clinic/patients/${patient_id}/monitoring-summary", payload: {}, as: Clinician, as_user_id: "${clinician_id}", captures: { prov: "$.data.provisional_risk_score", comp: "$.data.comprehensive_risk_score" } }
          assert:
            - "provisional_risk_score == 70"
            - "comprehensive_risk_score == 63"
            - "reviewed_panels_in_window == 2"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: refill_tiered_cost_with_caps_mode_a
        grounds:
          - calculations.refill_self_pay_charge
          - entities.RefillOrder.fields.final_charge_cents
          - state_machines.RefillOrder.PENDING_REVIEW_to_DISPENSED
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — marginal quantity tiers (t1/t2/t3),
          conditional controlled-substance surcharge, and min/max caps; dispensed 10 units => final 36750.
        test_recipe:
          setup:
            - "ISSUED prescription (unit_price_cents=5000, is_controlled=true) on PLUS plan (discount 0.25); refill dispensed at 10 units."
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr A", npi: "1000000003", dea_number: "AA3333333" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/pharmacists", payload: { full_name: "Ph B", license_number: "PH-3" }, as: ClinicAdmin, captures: { pharmacist_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Three", date_of_birth: "1981-03-03", sex: "MALE", email: "p3@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_id}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", baseline_panel_id: "${panel_id}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/prescriptions", payload: { plan_id: "${plan_id}", patient_id: "${patient_id}", drug_name: "Testosterone Cypionate", unit_price_cents: 5000, quantity_per_fill: 8, refills_authorized: 3, is_controlled: true }, as: Clinician, as_user_id: "${clinician_id}", captures: { rx_id: "$.data.id", rx_v: "$.data.version" } }
            - { call: "POST /clinic/refill-orders", payload: { prescription_id: "${rx_id}", membership_id: "${membership_id}", patient_id: "${patient_id}", requested_quantity_units: 8, expected_prescription_version: "${rx_v}" }, as: ClinicAdmin, captures: { refill_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/refill-orders/${refill_id}/dispense", payload: { dispensed_quantity_units: 10 }, as: Pharmacist, as_user_id: "${pharmacist_id}", captures: { fin: "$.data.final_charge_cents" } }
          assert:
            - "RefillOrder ${refill_id}.final_charge_cents == 36750"

      - name: change_plan_per_line_rounding_mode_b
        grounds:
          - calculations.change_plan_proration
          - entities.Membership.fields.last_change_charge_cents
          - endpoints["POST /clinic/memberships/{id}/change-plan"]
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — each proration line rounded INDEPENDENTLY
          (old-plan credit over cycle_days=30, new-plan charge over cycle_days=28) THEN subtracted:
          round(9999*13/30)=4333, round(14999*13/28)=6964, net=2631.
        test_recipe:
          setup:
            - "Membership created at default clock (anchor 2026-05-01) on PLUS(monthly_fee=9999,cycle_days=30). Clock advanced to 2026-05-18 (13 days remaining). Change to ELITE(monthly_fee=14999,cycle_days=28)."
          setup_api_calls:
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Four", date_of_birth: "1982-04-04", sex: "MALE", email: "p4@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9999, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { old_plan_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "ELITE", monthly_fee_cents: 14999, cycle_days: 28, included_refills_per_cycle: 8, included_lab_draw_credits: 8, refill_discount_pct: 0.35, titration_visit_fee_cents: 3000 }, as: ClinicAdmin, captures: { new_plan_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${old_plan_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/_clock/set_current_utc", payload: { to_iso8601: "2026-05-18T00:00:00Z" }, as: ClinicAdmin }
          trigger:
            - { call: "POST /clinic/memberships/${membership_id}/change-plan", payload: { new_plan_id: "${new_plan_id}" }, as: ClinicAdmin, captures: { net: "$.data.last_change_charge_cents" } }
          assert:
            - "Membership ${membership_id}.last_change_charge_cents == 2631"
            - "Membership ${membership_id}.plan_id == ${new_plan_id}"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: treatment_plan_titration_cycle
        grounds:
          - state_machines.TreatmentPlan.ACTIVE_to_TITRATION_PENDING
          - state_machines.TreatmentPlan.TITRATION_PENDING_to_ACTIVE
          - entities.TreatmentPlan.fields.round_index
        distinguishing_aspect: |
          TreatmentPlan cycles ACTIVE -> TITRATION_PENDING -> ACTIVE; after confirm the plan is ACTIVE again
          with current_dose_mg=120 and round_index=1 — a genuine cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE plan (starting_dose 100); latest REVIEWED panel is safe (hct 45)."
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr A", npi: "1000000005", dea_number: "AA5555555" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Five", date_of_birth: "1983-05-05", sex: "MALE", email: "p5@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "CORE", monthly_fee_cents: 5000, cycle_days: 30, included_refills_per_cycle: 2, included_lab_draw_credits: 2, refill_discount_pct: 0.10, titration_visit_fee_cents: 5000 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_id}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", baseline_panel_id: "${panel_id}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_v: "$.data.version" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/titrations", payload: { proposed_dose_mg: 120, expected_plan_version: "${plan_v}" }, as: Clinician, as_user_id: "${clinician_id}", captures: { titration_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/treatment-plans/${plan_id}/titrations/${titration_id}/confirm", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
          assert:
            - "TreatmentPlan ${plan_id}.status == ACTIVE"
            - "TreatmentPlan ${plan_id}.current_dose_mg == 120"
            - "TreatmentPlan ${plan_id}.round_index == 1"
            - "DoseTitration ${titration_id}.status == CONFIRMED"

      - name: membership_parallel_dimensions_independent
        grounds:
          - state_machines.Membership.TRIAL_to_ACTIVE
          - state_machines.Membership.CURRENT_to_DELINQUENT
          - entities.Membership.fields.subscription_status
          - entities.Membership.fields.payment_status
        distinguishing_aspect: |
          Membership carries two parallel state axes on one row (different entity than TreatmentPlan above):
          subscription_status stays ACTIVE while payment_status moves CURRENT -> DELINQUENT independently.
        test_recipe:
          setup:
            - "Membership activated (subscription ACTIVE, payment CURRENT)."
          setup_api_calls:
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Six", date_of_birth: "1984-06-06", sex: "MALE", email: "p6@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "CORE", monthly_fee_cents: 5000, cycle_days: 30, included_refills_per_cycle: 2, included_lab_draw_credits: 2, refill_discount_pct: 0.10, titration_visit_fee_cents: 5000 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
          trigger:
            - { call: "POST /clinic/memberships/${membership_id}/record-payment", payload: { outcome: "FAILED" }, as: ClinicAdmin, captures: { sub: "$.data.subscription_status", pay: "$.data.payment_status" } }
          assert:
            - "Membership ${membership_id}.subscription_status == ACTIVE"
            - "Membership ${membership_id}.payment_status == DELINQUENT"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: severe_adverse_event_depth3_cascade
        grounds:
          - state_machines.AdverseEvent.REPORTED_to_SEVERE_ESCALATED
          - state_machines.TreatmentPlan.ACTIVE_to_SUSPENDED
          - state_machines.ControlledSubstancePrescription.ISSUED_to_REVOKED
          - state_machines.RefillOrder.PENDING_REVIEW_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (adverse-event triage SEVERE): AdverseEvent SEVERE_ESCALATED
          -> plan SUSPENDED -> prescription REVOKED -> pending refill CANCELLED, each link caused by the previous.
        test_recipe:
          setup:
            - "ACTIVE plan (owned by clinician1); ISSUED prescription; one PENDING_REVIEW refill; a second clinician exists to triage."
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr One", npi: "1000000007", dea_number: "AA7777777" }, as: ClinicAdmin, captures: { clinician1_id: "$.data.id" } }
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr Two", npi: "1000000008", dea_number: "AA8888888" }, as: ClinicAdmin, captures: { clinician2_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Seven", date_of_birth: "1985-07-07", sex: "MALE", email: "p7@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician1_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician1_id}", captures: { panel_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_id}/draw", payload: {}, as: Clinician, as_user_id: "${clinician1_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician1_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/review", payload: {}, as: Clinician, as_user_id: "${clinician1_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician1_id}", baseline_panel_id: "${panel_id}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician1_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician1_id}" }
            - { call: "POST /clinic/prescriptions", payload: { plan_id: "${plan_id}", patient_id: "${patient_id}", drug_name: "Testosterone Cypionate", unit_price_cents: 5000, quantity_per_fill: 8, refills_authorized: 3, is_controlled: true }, as: Clinician, as_user_id: "${clinician1_id}", captures: { rx_id: "$.data.id", rx_v: "$.data.version" } }
            - { call: "POST /clinic/refill-orders", payload: { prescription_id: "${rx_id}", membership_id: "${membership_id}", patient_id: "${patient_id}", requested_quantity_units: 8, expected_prescription_version: "${rx_v}" }, as: ClinicAdmin, captures: { refill_id: "$.data.id" } }
            - { call: "POST /clinic/adverse-events", payload: { patient_id: "${patient_id}", plan_id: "${plan_id}", description: "chest pain" }, as: Patient, as_user_id: "${patient_id}", captures: { ae_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/adverse-events/${ae_id}/triage", payload: { severity: "SEVERE" }, as: Clinician, as_user_id: "${clinician2_id}" }
          assert:
            - "AdverseEvent ${ae_id}.status == SEVERE_ESCALATED"
            - "TreatmentPlan ${plan_id}.status == SUSPENDED"
            - "ControlledSubstancePrescription ${rx_id}.status == REVOKED"
