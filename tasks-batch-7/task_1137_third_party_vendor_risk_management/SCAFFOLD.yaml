  # --- Test-driving endpoints (priority ladder rung 3 — last resort) ---
  - method: POST
    path: "/tprm/_clock/set_current_utc"
    description: "Advance the logical clock used by all time-dependent rules (cycle OVERDUE promotion, contract EXPIRED promotion, deadline computation, time-window inclusion). Server boots at 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time before this endpoint is first called. Setting the clock triggers all system-driven promotions whose thresholds are crossed by the new time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ new_current_utc: string }"
    side_effects:
      - "all MonitoringCycle with status IN {SCHEDULED, IN_PROGRESS} AND due_at < new_current_utc -> OVERDUE"
      - "all Contract with status == EXECUTED AND expiry_date <= new_current_utc AND engagement.lifecycle_status != ACTIVE -> EXPIRED"
      - "vendor.tier_posture recompute where OVERDUE promotion occurred"

  - method: GET
    path: "/tprm/_clock/current_utc"
    description: "Read the logical clock."
    roles: [PlatformAdmin, RiskOfficer, ComplianceDirector, VendorRelationshipManager, InternalAuditor, BusinessUnitOwner]
    code: 200
    input: []
    output: "{ current_utc: string }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,          http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers." }
  - { id: ERR_UNAUTHORIZED,             http: 403, condition: "Role not permitted for this endpoint per §1.5 roles list." }
  - { id: ERR_NOT_FOUND,                http: 404, condition: "Path-templated resource id does not resolve." }
  - { id: ERR_INVALID_REQUEST,          http: 400, condition: "Required input missing or wrong type/enum." }
  - { id: ERR_INVALID_STATE,            http: 409, condition: "Generic from-state violation when no more specific state error applies." }

  - { id: ERR_VENDOR_NOT_ONBOARDING,    http: 409, condition: "POST /vendors/{id}/activate when vendor.status != ONBOARDING." }
  - { id: ERR_VENDOR_NOT_ACTIVE,        http: 409, condition: "Vendor state precondition for suspend/exit/monitoring-begin failed." }
  - { id: ERR_VENDOR_NOT_SUSPENDED,     http: 409, condition: "POST /vendors/{id}/reinstate when vendor.status != SUSPENDED." }
  - { id: ERR_NO_ACTIVE_ENGAGEMENT,     http: 422, condition: "Vendor activation requires at least one ACTIVE engagement." }
  - { id: ERR_OPEN_SEV1_INCIDENT,       http: 422, condition: "Vendor activation blocked by an OPEN/REOPENED SEV_1 incident." }
  - { id: ERR_ENGAGEMENTS_NOT_EXITED,   http: 422, condition: "Vendor exit requires all engagements EXITED or TERMINATED_FOR_CAUSE." }
  - { id: ERR_OPEN_INCIDENTS_REMAIN,    http: 422, condition: "Vendor exit / engagement finalize-exit blocked by open incidents." }
  - { id: ERR_BLOCKING_INCIDENTS_OPEN,  http: 422, condition: "Initiate-exit blocked by OPEN/REOPENED SEV_1 or SEV_2 incident." }

  - { id: ERR_ENGAGEMENT_NOT_DRAFT,     http: 409, condition: "DD package creation requires engagement.lifecycle_status == DRAFT." }
  - { id: ERR_DD_NOT_APPROVED,          http: 409, condition: "Contract creation requires engagement.lifecycle_status == DD_APPROVED." }
  - { id: ERR_ENGAGEMENT_NOT_ACTIVE,    http: 409, condition: "Action requires engagement.lifecycle_status == ACTIVE." }
  - { id: ERR_ENGAGEMENT_NOT_EXITING,   http: 409, condition: "POST /engagements/{id}/finalize-exit when lifecycle_status != EXITING." }
  - { id: ERR_NO_SEV1_INCIDENT,         http: 422, condition: "Terminate-for-cause requires at least one OPEN/REOPENED SEV_1 incident." }
  - { id: ERR_EXIT_READINESS_TOO_LOW,   http: 422, condition: "exit_readiness_score < 80.00 at finalize-exit." }

  - { id: ERR_DD_NOT_DRAFT,             http: 409, condition: "DD submit requires status == DRAFT." }
  - { id: ERR_DD_NOT_SUBMITTED,         http: 409, condition: "DD begin-review requires status == SUBMITTED." }
  - { id: ERR_DD_NOT_UNDER_REVIEW,      http: 409, condition: "DD approve/reject requires status == UNDER_REVIEW." }
  - { id: ERR_DD_NOT_REJECTED,          http: 409, condition: "DD resubmit requires status == REJECTED." }
  - { id: ERR_DD_OUTCOME_FAIL,          http: 422, condition: "DD approval blocked: dd_outcome == FAIL." }
  - { id: ERR_DD_REVIEW_ROUND_EXHAUSTED, http: 422, condition: "DD resubmit blocked: review_round >= 3." }

  - { id: ERR_CONTRACT_NOT_DRAFT,       http: 409, condition: "Contract execute requires status == DRAFT." }
  - { id: ERR_CONTRACT_CLAUSES_INCOMPLETE, http: 422, condition: "Missing SLA / right-to-audit / exit-plan clause per tier at execute." }
  - { id: ERR_MISSING_SLA_TERMS,        http: 422, condition: "SLA terms required on all contracts at execute." }
  - { id: ERR_MISSING_AUDIT_CLAUSE,     http: 422, condition: "Right-to-audit clause required for TIER_1/TIER_2 at execute." }
  - { id: ERR_MISSING_EXIT_PLAN,        http: 422, condition: "Exit-plan section required for TIER_1 at execute." }
  - { id: ERR_FOURTH_PARTY_PENDING,     http: 422, condition: "At least one FourthParty is PENDING at contract execute." }

  - { id: ERR_FP_NOT_PENDING,           http: 409, condition: "Fourth-party acknowledge/reject requires acknowledgement_status == PENDING." }
  - { id: ERR_FP_PII_TIER_TOO_LOW,      http: 422, condition: "REGULATED_PII access requires TIER_1 or TIER_2 vendor." }
  - { id: ERR_FP_PARENT_INVALID,        http: 422, condition: "parent_fourth_party_id missing, on different engagement, or forms a cycle." }

  - { id: ERR_CYCLE_NOT_SCHEDULED,      http: 409, condition: "Cycle begin/waive requires status == SCHEDULED." }
  - { id: ERR_CYCLE_NOT_IN_PROGRESS,    http: 409, condition: "Cycle complete requires status == IN_PROGRESS." }
  - { id: ERR_WAIVE_TIER_FORBIDDEN,     http: 422, condition: "Waive allowed only for TIER_4_LOW vendors." }

  - { id: ERR_INCIDENT_NOT_OPEN,        http: 409, condition: "Triage requires status == OPEN." }
  - { id: ERR_INCIDENT_NOT_TRIAGED,     http: 409, condition: "Plan creation requires incident.status == TRIAGED." }
  - { id: ERR_INCIDENT_NOT_CLOSED,      http: 409, condition: "Reopen requires status == CLOSED." }
  - { id: ERR_REOPEN_LIMIT_REACHED,     http: 422, condition: "Incident reopen_count >= 2." }
  - { id: ERR_PLAN_NOT_DRAFT,           http: 409, condition: "Plan submit requires status == DRAFT." }
  - { id: ERR_PLAN_NOT_SUBMITTED,       http: 409, condition: "Plan approve/reject requires status == SUBMITTED." }
  - { id: ERR_PLAN_NOT_IN_EXECUTION,    http: 409, condition: "Submit-verification requires plan.status == IN_EXECUTION." }
  - { id: ERR_PLAN_NOT_VERIFICATION_SUBMITTED, http: 409, condition: "Verify requires plan.status == VERIFICATION_SUBMITTED." }
  - { id: ERR_EVIDENCE_REQUIRED,        http: 422, condition: "Submit-verification requires non-empty verification_evidence_uri." }

  - { id: ERR_SOD_VIOLATION,            http: 403, condition: "Generic segregation-of-duties violation (parent category)." }
  - { id: ERR_SOD_DD_SELF_APPROVE,      http: 403, condition: "RiskOfficer approving own submitted DD package." }
  - { id: ERR_SOD_INCIDENT_SELF_REMEDIATE, http: 403, condition: "Plan creator is the incident reporter." }
  - { id: ERR_SOD_PLAN_SELF_APPROVE,    http: 403, condition: "Plan approver is plan owner or incident reporter." }
  - { id: ERR_SOD_VERIFY_NOT_REPORTER,  http: 403, condition: "Verifier is not the original incident reporter." }
  - { id: ERR_SOD_REOPEN_NOT_REPORTER,  http: 403, condition: "Reopener is not the original incident reporter." }
  - { id: ERR_SOD_AUDITOR_IS_CREATOR,   http: 403, condition: "Auditor initiated audit on engagement they themselves created." }

  - { id: ERR_ASSESSMENT_NOT_COMPUTING, http: 409, condition: "Publish requires assessment.status == COMPUTING." }
  - { id: ERR_AUDIT_FINDINGS_UNRESOLVED, http: 422, condition: "Audit close blocked: auto-raised incidents not all CLOSED." }
  - { id: ERR_AUDIT_NOT_INITIATED,      http: 409, condition: "Begin-fieldwork requires audit.status == INITIATED." }
  - { id: ERR_AUDIT_NOT_FIELDWORK,      http: 409, condition: "Issue-findings requires audit.status == FIELDWORK." }
  - { id: ERR_AUDIT_NOT_FINDINGS_ISSUED, http: 409, condition: "Close requires audit.status == FINDINGS_ISSUED." }
  - { id: ERR_AUDIT_NO_RIGHT_TO_AUDIT,  http: 422, condition: "Cannot initiate audit: contract lacks right-to-audit clause." }

  - { id: ERR_BCP_NOT_SCHEDULED,        http: 409, condition: "BCP begin/cancel requires status == SCHEDULED." }
  - { id: ERR_BCP_NOT_IN_PROGRESS,      http: 409, condition: "BCP submit-result requires status == IN_PROGRESS." }
  - { id: ERR_REPORT_NOT_DRAFT,         http: 409, condition: "Publish requires report.status == DRAFT." }

  - { id: ERR_TEMPORAL_ORDER,           http: 422, condition: "Temporal ordering violation (effective >= expiry, start >= end, past scheduled_for, committed_completion > remediation_due_at)." }
  - { id: ERR_CYCLE_WINDOW_OVERLAP,     http: 422, condition: "A new MonitoringCycle would overlap an existing non-WAIVED cycle window on the same vendor." }
  - { id: ERR_AUDIT_ALREADY_ACTIVE,     http: 422, condition: "An AuditExercise on this engagement is already in INITIATED, FIELDWORK, or FINDINGS_ISSUED." }
  - { id: ERR_REPORT_WINDOW_OVERLAP,    http: 422, condition: "New BoardReport window overlaps an existing PUBLISHED BoardReport's half-open window." }
  - { id: ERR_DUPLICATE_KEY,            http: 409, condition: "legal_name / engagement_code / contract_reference uniqueness violated." }
  - { id: ERR_STALE_VERSION,            http: 412, condition: "OCC expected_*_version mismatch." }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: VendorRelationshipManager
    description: "Onboards vendors, drafts engagements and contracts, declares fourth parties, drafts DD packages. Cannot approve own submissions."
    identity: opaque
    exclusive_operations:
      - "POST /tprm/vendors"
      - "POST /tprm/vendors/{id}/engagements"
      - "POST /tprm/engagements/{id}/due-diligence-packages"
      - "POST /tprm/due-diligence-packages/{id}/submit"
      - "POST /tprm/due-diligence-packages/{id}/resubmit"
      - "POST /tprm/engagements/{id}/contracts"
      - "POST /tprm/engagements/{id}/fourth-parties"
      - "POST /tprm/engagements/{id}/initiate-exit"
    shared_operations:
      - "GET reads on vendors/engagements/packages/contracts/fourth-parties/incidents/cycles/bcp-tests"

  - name: RiskOfficer
    description: "Approves DD packages, executes contracts, acknowledges fourth parties, triages incidents, owns remediation plans, performs tier changes."
    identity: opaque
    exclusive_operations:
      - "POST /tprm/vendors/{id}/activate"
      - "POST /tprm/vendors/{id}/suspend"
      - "POST /tprm/vendors/{id}/reinstate"
      - "POST /tprm/vendors/{id}/exit"
      - "POST /tprm/vendors/{id}/tier-change"
      - "POST /tprm/due-diligence-packages/{id}/begin-review"
      - "POST /tprm/due-diligence-packages/{id}/approve"
      - "POST /tprm/due-diligence-packages/{id}/reject"
      - "POST /tprm/contracts/{id}/execute"
      - "POST /tprm/engagements/{id}/finalize-exit"
      - "POST /tprm/engagements/{id}/terminate-for-cause"
      - "POST /tprm/fourth-parties/{id}/acknowledge"
      - "POST /tprm/fourth-parties/{id}/reject"
      - "POST /tprm/incidents/{id}/triage"
      - "POST /tprm/incidents/{id}/remediation-plans"
      - "POST /tprm/remediation-plans/{id}/submit"
      - "POST /tprm/remediation-plans/{id}/approve"
      - "POST /tprm/remediation-plans/{id}/reject"
      - "POST /tprm/remediation-plans/{id}/submit-verification"
      - "POST /tprm/monitoring-cycles/{id}/begin"
      - "POST /tprm/monitoring-cycles/{id}/complete"
      - "POST /tprm/engagements/{id}/bcp-tests"
      - "POST /tprm/bcp-tests/{id}/begin"
      - "POST /tprm/bcp-tests/{id}/submit-result"
      - "POST /tprm/bcp-tests/{id}/cancel"
    shared_operations:
      - "GET reads across all TPRM resources"

  - name: BusinessUnitOwner
    description: "Files incidents on engagements their unit uses; verifies remediation plans (only on incidents they themselves reported); reopens incidents they reported."
    identity: opaque
    exclusive_operations:
      - "POST /tprm/engagements/{id}/incidents"
      - "POST /tprm/incidents/{id}/reopen"
      - "POST /tprm/remediation-plans/{id}/verify"
    shared_operations:
      - "GET reads on vendors/engagements/incidents/remediation-plans"

  - name: InternalAuditor
    description: "Exercises the contractual right-to-audit on engagements. Operates outside day-to-day vendor ops; cannot initiate audits on engagements they created (SoD — though in practice auditors never create engagements)."
    identity: opaque
    exclusive_operations:
      - "POST /tprm/engagements/{id}/audits"
      - "POST /tprm/audits/{id}/begin-fieldwork"
      - "POST /tprm/audits/{id}/findings"
      - "POST /tprm/audits/{id}/issue-findings"
      - "POST /tprm/audits/{id}/close"
    shared_operations:
      - "GET reads on all TPRM resources (audit trail access)"

  - name: ComplianceDirector
    description: "Publishes concentration assessments and board reports. Waives monitoring cycles (only for TIER_4_LOW). Cannot approve DD packages or remediation plans."
    identity: opaque
    exclusive_operations:
      - "POST /tprm/concentration-assessments"
      - "POST /tprm/concentration-assessments/{id}/publish"
      - "POST /tprm/board-reports"
      - "POST /tprm/board-reports/{id}/publish"
      - "POST /tprm/monitoring-cycles/{id}/waive"
    shared_operations:
      - "GET reads on all TPRM resources"

  - name: PlatformAdmin
    description: "Operational superuser for test-driving endpoints only (logical clock). Holds no day-to-day vendor-management permissions."
    identity: opaque
    exclusive_operations:
      - "POST /tprm/_clock/set_current_utc"
    shared_operations:
      - "GET /tprm/_clock/current_utc"
