          - validations.priority_51
          - errors[ERR_DUPLICATE_SELF_REFERENCE]
          - errors[ERR_DUPLICATE_CHAIN_NOT_ALLOWED]
          - state_machines.Finding.REPORTED_to_DUPLICATE
        distinguishing_aspect: "The two duplicate guards are independent: pointing a finding at itself is ERR_DUPLICATE_SELF_REFERENCE, pointing a third finding at an already-DUPLICATE row is ERR_DUPLICATE_CHAIN_NOT_ALLOWED, and the legitimate middle call succeeds — so chains are one level deep at most."
