              payload: {}
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${brand_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
          trigger:
