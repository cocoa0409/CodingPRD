          - state_machines.Mine
        distinguishing_aspect: "A POV notice against a mine whose pov_status is NONE fails ERR_POV_NOTICE_REQUIRES_POTENTIAL before the score is even consulted — the notice endpoint's state gate is separate from its threshold gate."
        test_recipe:
