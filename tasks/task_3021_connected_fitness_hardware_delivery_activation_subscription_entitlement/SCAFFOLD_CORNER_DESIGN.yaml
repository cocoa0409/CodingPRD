            - *c_uv_owner
            - *c_d_create
            - *c_o_create
            - *c_a_create
            - *c_a_sched
            - *c_k_deliver
            - *c_a_start
            - *c_a_complete
            - *c_d_get
            - *c_d_link
            - *c_m_get
            - *c_m_act
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v_term: $.data.version }
            - call: "POST /fitness/memberships/${m_id}/cancel"
              payload: { expected_membership_version: "${m_v_term}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
            - call: "POST /fitness/_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fitness/_run_ops"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/service-orders"
              payload: { device_id: "${d_id}", reported_fault_code: "NO_POWER", diagnosis_note: "POST /_run_ops decommissioned this unit" }
              as: ServiceTechnician
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /fitness/service-orders/${so_id}/schedule"
              payload: { scheduled_start_at: "2027-03-05T09:00:00Z", scheduled_end_at: "2027-03-05T11:00:00Z" }
              as: ServiceTechnician
              captures: { err_decom: $.data.error_id }
          assert:
            - "Device.${d_id}.activation_status == DECOMMISSIONED after the sweep"
            - "the schedule attempt returns 409 ERR_DISPATCH_DEVICE_NOT_OPERATIONAL (captured as ${err_decom})"
            - "ServiceOrder.${so_id}.status stays DISPATCHED and ServiceOrder.${so_id}.safety_functions_maintained == true"
            - "the dispatch itself was accepted, so the operational gate sits on scheduling rather than on intake"

