            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv_w}", rate_class_id: "${rc}", payment_terms: "NET_30", sponsorship_disclosure_text: "PAID FOR BY Whitlock For Governor; AUTHORIZED BY Whitlock For Governor", disclosure_duration_seconds: 5, election_id: "${el}", agency_placed: false }
              as: AdvertiserAgent
