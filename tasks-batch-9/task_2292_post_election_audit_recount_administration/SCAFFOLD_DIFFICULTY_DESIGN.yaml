          assert:
            - "${scope_below} == 1000 and ${dep_below} == 100000"
            - "${scope_at} == 1250 and ${dep_at} == 100000"
            - "${dep_below} == ${dep_at}"
            - "${scope_full} == 2250 and ${dep_full} == 106250"
            - "Recount.${rc_full_id}.status == REQUESTED and Recount.${rc_full_id}.deposit_status == PENDING"
            - "Recount.${rc_below_id}.status == WITHDRAWN and Recount.${rc_below_id}.deposit_status == PENDING and Recount.${rc_below_id}.refund_variant == NONE"
            - "Recount.${rc_below_id}.admin_retained_cents == 0 and Recount.${rc_below_id}.refunded_cents == 0"
            - "Contest.${c3_id}.margin_pct == 4.8889 and Contest.${c3_id}.open_recount_count == 1"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_seed_requires_canvassed_contest
        grounds:
          - state_machines.Audit.PLANNED_to_SEEDED
          - state_machines.Contest.PENDING_CANVASS_to_CANVASSED
          - validations[priority=15]
          - errors[ERR_CONTEST_NOT_CANVASSED]
          - calculations.audit_sample_size
        distinguishing_aspect: |
          Entity pair Audit <- Contest: the Audit PLANNED -> SEEDED transition is gated on the state of a different
          entity, the parent Contest, and the identical seed call flips from ERR_CONTEST_NOT_CANVASSED to success the
          moment the Contest reaches CANVASSED - nothing about the Audit itself changed.
        test_recipe:
          setup:
            - "Election ST-01 exists with contest C1 (ALVAREZ / BRENNAN, ballots_cast 6000) still PENDING_CANVASS."
            - "Six 1000-ballot batches B-001..B-006 are already in custody for C1, each machine-tabulated 525/475."
            - "Audit A1 RISK_LIMITING alpha 0.05 is PLANNED on C1; with no canvassed margin its planned_sample_size cannot be derived yet."
            - "Clock is 2026-11-05T09:00:00Z throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
