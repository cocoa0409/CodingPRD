            - "http status == 422"

      - name: rd_submit_review_no_qualified_qre_rejected
        claim_type: Violation → Error
        grounds: ["errors[ERR_NO_QUALIFIED_QRE]", state_machines.Study.ENGINEERING_to_IN_REVIEW]
        distinguishing_aspect: "submit-review on an RD_CREDIT study in ENGINEERING with zero QUALIFIED QRE lines returns ERR_NO_QUALIFIED_QRE."
        test_recipe:
          setup: ["RD_CREDIT study ENGINEERING with a DRAFT (not qualified) QRE line only"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "NQ Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "E", email: "e8@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "RD_CREDIT", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, credit_method: "ASC" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "WAGES", gross_amount_cents: 5000000, qualified_percent: 0.80 }, as: Engineer, as_user_id: "${eng}", captures: { q: "$.data.id" } }
          trigger:
