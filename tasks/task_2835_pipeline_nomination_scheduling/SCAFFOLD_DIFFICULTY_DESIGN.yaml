  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cycle_state_beats_tender_minimum_on_nomination
        grounds:
          - validations[priority=40]
          - validations[priority=62]
          - errors[ERR_CYCLE_NOT_OPEN]
          - errors[ERR_TENDER_MINIMUM_NOT_MET]
          - state_machines.NominationCycle.OPEN_to_CLOSED
        distinguishing_aspect: |
          The pair is state (priority 40, ERR_CYCLE_NOT_OPEN, 409) against business_constraint
          (priority 62, ERR_TENDER_MINIMUM_NOT_MET, 422): a single call violates both, and the
          lower-priority-number state check must be the one reported, so the response is 409
          ERR_CYCLE_NOT_OPEN and never the 422.
        test_recipe:
          setup:
            - "Segment HOU-NAS with min_tender_bbl 6000 and an EFFECTIVE ULSD tariff whose tender_minimum_bbl is 6000."
            - "Cycle 2026-09 exists and has already been closed by the scheduler, so its status is CLOSED."
            - "ALPHA is an ACTIVE shipper that has submitted nothing, so the close was a no-op over an empty nomination set."
            - "The logical clock is 2026-08-05T00:00:00Z, still inside the nomination window, so the window check cannot fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
