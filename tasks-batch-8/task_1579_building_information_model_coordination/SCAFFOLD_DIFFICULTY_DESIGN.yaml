# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 difficulty rules x >= 2 instances. Every test_recipe replays from empty-DB
# using only endpoints declared in SCAFFOLD.yaml section 1.5.
# Logical clock default: 2026-08-01T00:00:00Z (see POST /api/_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: clash_cost_provisional_vs_actual_diverge
        grounds:
          - calculations.clash_provisional_cost
          - calculations.clash_actual_cost
          - entities.ClashIssue.fields.provisional_cost_cents
          - entities.ClashIssue.fields.actual_cost_cents
        distinguishing_aspect: |
          Entity domain ClashIssue: the SAME clash carries two cost values computed by two
          valid algorithms — forward-looking severity-based estimate at assign
          (40 base hours x 1.5 spans multiplier x 12000 cents/h = 720000) versus
          chronological actual-hours final at verify (21.5 h x 12000 = 258000) —
          and both remain observable and unequal on the verified clash.
        test_recipe:
          setup:
            - "Project P with TradePartner P1 (STRUCTURAL, REVIT, rate 12000 cents/h, budget 100.0 h)"
            - "TradeModel M1 ACCEPTED; FederatedModel F1 FROZEN with member M1; run R1 RUNNING"
            - "Clash C1 imported with overlap_mm 75.0 (CRITICAL), spans_disciplines true"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "DV1" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/federated-models/${f1}/clash-runs", payload: { tolerance_mm: 5.0 }, as: BIMCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "STR-1/MEP-1", overlap_mm: 75.0, spans_disciplines: true }, as: BIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/clash-issues/${c1}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c1}/resolve", payload: { actual_labor_hours: 21.5 }, as: TradeModelAuthor, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/clash-issues/${c1}/verify", payload: { re_inspection_overlap_mm: 2.0 }, as: BIMCoordinator, as_user_id: "coord-2", captures: { v_status: $.data.status, v_prov: $.data.provisional_cost_cents, v_act: $.data.actual_cost_cents } }
          assert:
            - "ClashIssue.${c1}.status == VERIFIED"
            - "ClashIssue.${c1}.provisional_cost_cents == 720000  (40 x 1.5 x 12000, forward-looking variant)"
            - "ClashIssue.${c1}.actual_cost_cents == 258000  (21.5 x 12000, chronological actual variant)"
            - "provisional_cost_cents != actual_cost_cents on the same clash"
            - "TradePartner.${p1}.consumed_resolution_hours == 21.5"

      - name: model_score_submission_vs_audit_diverge
        grounds:
          - calculations.model_submission_score
          - calculations.model_audit_score
          - entities.TradeModel.fields.submission_score
          - entities.TradeModel.fields.audit_score
        distinguishing_aspect: |
          Entity domain TradeModel (different from ClashIssue): identical element counters
          yield submission_score 86.7 (element-count-weighted, at submit) versus
          audit_score 88.0 (criticality-weighted 0.5/0.3/0.2, at accept); the variants are
          produced at different lifecycle moments and disagree.
        test_recipe:
          setup:
            - "Project P with TradePartner P1 (STRUCTURAL, REVIT, rate 12000, budget 100.0)"
            - "Model M with ls 10/10, envelope 10/6, finish 10/10"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "DV2" }, as: VDCManager, captures: { pid: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 6, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}", captures: { sub_score: $.data.submission_score } }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator, captures: { aud_score: $.data.audit_score } }
          assert:
            - "TradeModel.${m1}.submission_score == 86.7  (100 x 26/30, round_half_up 1dp)"
            - "TradeModel.${m1}.audit_score == 88.0  (100 x (0.5x1.0 + 0.3x0.6 + 0.2x1.0))"
            - "TradeModel.${m1}.submission_score != TradeModel.${m1}.audit_score"
            - "TradeModel.${m1}.status == ACCEPTED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cri_multi_factor_threshold_blend
        grounds:
          - calculations.coordination_readiness_index
          - calculations.project_posture
          - entities.Project.fields.coordination_readiness_index
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: CRI combines open CRITICAL
          (-25), open MAJOR (-10), unassigned MINOR (-5, status-conditional inclusion),
          and overdue commitments (-15, clock-conditional inclusion) under a max(0, ...)
          floor, then drives a threshold gate (< 60 -> COORDINATION_HOLD). The pinned
          fixture exercises all four input classes at once: 100 - 25 - 10 - 5 - 15 = 45.
        test_recipe:
          setup:
            - "Project P, partner P1, model M1 ACCEPTED, F1 FROZEN, run R1 RUNNING"
            - "C1 CRITICAL open+assigned, C2 MAJOR open+unassigned, C3 MINOR open+unassigned(NEW)"
            - "One COMMITTED commitment on C1 due 2026-08-11T00:00:00Z; logical clock advanced to 2026-08-12T00:00:00Z making it overdue (no sweep run)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CF1" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/federated-models/${f1}/clash-runs", payload: { tolerance_mm: 5.0 }, as: BIMCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "STR-1/MEP-1", overlap_mm: 75.0, spans_disciplines: true }, as: BIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "STR-2/MEP-2", overlap_mm: 30.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c2: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "STR-3/MEP-3", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c3: $.data.id } }
            - { call: "POST /api/clash-issues/${c1}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "RM-A", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator, captures: { mtg: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:30:00Z" }, as: VDCManager }
            - { call: "POST /api/coordination-meetings/${mtg}/start", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c1}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator, captures: { k1: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: VDCManager }
            - { call: "GET /api/projects/${pid}", payload: {}, as: VDCManager, captures: { cri: $.data.coordination_readiness_index, posture: $.data.coordination_posture, oc: $.data.open_critical_count, om: $.data.open_major_count, um: $.data.unassigned_minor_count, od: $.data.overdue_commitment_count } }
          assert:
            - "Project.${pid}.open_critical_count == 1"
            - "Project.${pid}.open_major_count == 1"
            - "Project.${pid}.unassigned_minor_count == 1"
            - "Project.${pid}.overdue_commitment_count == 1"
            - "Project.${pid}.coordination_readiness_index == 45  (100 - 25 - 10 - 5 - 15)"
            - "Project.${pid}.coordination_posture == COORDINATION_HOLD  (45 < 60)"
            - "ResolutionCommitment.${k1}.status == COMMITTED  (no sweep has run)"

      - name: takeoff_net_per_element_rounding_order
        grounds:
          - calculations.quantity_extraction_total
          - entities.QuantityTakeoff.fields.total_quantity
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: NET extraction rounds each
          element to 3 decimals BEFORE summing (0.124 + 0.124 = 0.248), whereas the
          rejected sum-then-round order would yield 0.247; the GROSS variant on the same
          elements yields 0.247. The scaffold pins per-element-then-sum for NET.
        test_recipe:
          setup:
            - "Project P, partner P1, model M1 ACCEPTED, federated model F1 FROZEN"
            - "Two elements each gross_qty 0.1235, deduction_qty 0.0"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CF2" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "GET /api/projects/${pid}", payload: {}, as: VDCManager, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /api/projects/${pid}/quantity-takeoffs", payload: { federated_model_id: "${f1}", extraction_mode: NET, elements: [ { element_ref: "E1", gross_qty: 0.1235, deduction_qty: 0.0 }, { element_ref: "E2", gross_qty: 0.1235, deduction_qty: 0.0 } ], expected_project_version: "${pv2}" }, as: BIMCoordinator, captures: { t_net: $.data.id, net_total: $.data.total_quantity } }
            - { call: "GET /api/projects/${pid}", payload: {}, as: VDCManager, captures: { pv3: $.data.version } }
            - { call: "POST /api/projects/${pid}/quantity-takeoffs", payload: { federated_model_id: "${f1}", extraction_mode: GROSS, elements: [ { element_ref: "E1", gross_qty: 0.1235, deduction_qty: 0.0 }, { element_ref: "E2", gross_qty: 0.1235, deduction_qty: 0.0 } ], expected_project_version: "${pv3}" }, as: BIMCoordinator, captures: { t_gross: $.data.id, gross_total: $.data.total_quantity } }
          assert:
            - "QuantityTakeoff.${t_net}.total_quantity == 0.248  (round_half_up(0.1235,3)=0.124 per element, then sum)"
            - "QuantityTakeoff.${t_gross}.total_quantity == 0.247  (single final rounding of 0.2470)"
            - "QuantityTakeoff.${t_net}.total_quantity != QuantityTakeoff.${t_gross}.total_quantity"
            - "both takeoffs status == EXTRACTED (different extraction_mode -> different supersede key)"

      - name: reliability_pre_event_tier_evaluation_order
        grounds:
          - calculations.trade_partner_reliability
          - entities.TradePartner.fields.reliability_score
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: penalty is
          keyed on a tier that is keyed on the score being mutated. The scaffold pins
          tier_of(score_before): six breaches walk 100 -> 95 -> 90 -> 85 -> 80 -> 75 -> 65
          (tier A penalty 5 while score_before >= 80, tier B penalty 10 below). The rejected
          post-event interpretation would land on 70 or 60 at the 80-point boundary instead.
        test_recipe:
          setup:
            - "Project P, partner P1; run R1 RUNNING with six MINOR clashes all ASSIGNED to P1"
            - "Meeting IN_SESSION with six COMMITTED commitments (one per clash), all due 2026-08-11T00:00:00Z"
            - "Logical clock advanced to 2026-08-12T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CF3" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/federated-models/${f1}/clash-runs", payload: { tolerance_mm: 5.0 }, as: BIMCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "E/A", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "E/B", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c2: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "E/C", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c3: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "E/D", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c4: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "E/E", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c5: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "E/F", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c6: $.data.id } }
            - { call: "POST /api/clash-issues/${c1}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c2}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c3}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c4}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c5}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c6}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "RM-A", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator, captures: { mtg: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:30:00Z" }, as: VDCManager }
            - { call: "POST /api/coordination-meetings/${mtg}/start", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c1}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c2}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c3}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c4}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c5}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c6}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: VDCManager }
          trigger:
            - { call: "POST /api/projects/${pid}/run-coordination-sweep", payload: {}, as: VDCManager }
            - { call: "GET /api/projects/${pid}/trade-partners", payload: {}, as: VDCManager, captures: { score: "$.data[0].reliability_score", breaches: "$.data[0].breach_count", pstatus: "$.data[0].status" } }
          assert:
            - "TradePartner.${p1}.reliability_score == 65  (95, 90, 85, 80, 75, 65 — tier read from pre-event score each time)"
            - "TradePartner.${p1}.breach_count == 6"
            - "TradePartner.${p1}.status == ACTIVE  (65 >= PROBATION_THRESHOLD 40)"
            - "all six commitments status == BREACHED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: clash_issue_verified_reopened_cycle
        grounds:
          - state_machines.ClashIssue.VERIFIED_to_REOPENED
          - state_machines.ClashIssue.REOPENED_to_ASSIGNED
          - state_machines.ClashIssue.RESOLVED_to_VERIFIED
          - entities.ClashIssue.fields.cycle_count
        distinguishing_aspect: |
          Cyclic machine on ClashIssue: VERIFIED -> REOPENED -> ASSIGNED -> RESOLVED ->
          VERIFIED completes a full loop (cycle_count == 1), and the second passing verify
          overwrites actual_cost_cents (24000 = 2.0 h x 12000) that the first verify set
          (48000 = 4.0 h x 12000).
        test_recipe:
          setup:
            - "Project P, partner P1 (rate 12000, budget 100.0), M1 ACCEPTED, F1 FROZEN, R1 RUNNING"
            - "C1 imported (overlap 30.0 -> MAJOR), assigned to P1 by coord-1, resolved with 4.0 h, verified by coord-2"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "NL1" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
