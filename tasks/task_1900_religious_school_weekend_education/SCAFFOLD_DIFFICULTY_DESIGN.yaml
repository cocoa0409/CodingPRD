            - { call: "POST /school/families", payload: { family_name: "Fam B", primary_email: "b@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_id: $.data.id } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "Bee", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu: $.data.id } }
