scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: allowance_consumption_provisional_vs_final_on_tiproject
        grounds:
          - calculations.allowance_consumption
          - entities.TIProject.fields.allowance_consumed_cents
          - entities.TIProject.fields.provisional_allowance_consumed_cents
        distinguishing_aspect: |
          Entity domain = TIProject monetary ledger: the provisional variant counts
          SUBMITTED draws at requested_amount_cents while the final variant counts
          only APPROVED/PAID draws at approved_amount_cents, so one identical project
          state yields provisional 22000000 vs final 10000000.
        test_recipe:
          setup:
            - "Project in CONSTRUCTION with allowance_total_cents=50000000, base_contract_cents=40000000, one ACTIVE engagement"
            - "Draw 1 APPROVED at 10000000 (retainage 1000000 withheld); draw 2 SUBMITTED at requested 12000000, not yet reviewed"
            - "Clock pinned at 2026-08-15T00:00:00Z so period_end 2026-08-14 is in the past"
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "Tower A", address: "1 Main St", max_concurrent_construction_projects: 2 }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "500", floor: 5, rentable_sqft: 8000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "Tenant Co", contact_email: "ops@tenant.example", tax_id: "T-100" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-09-01T00:00:00Z", lease_term_months: 60, abatement_basis: "CALENDAR" }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "Suite 500 Build-Out", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "Full floor TI", allowance_offer_cents: 50000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl_id: $.data.id }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_id}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/execute"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/begin-plan-review"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/plan-submissions"
              payload: { drawing_set_ref: "DS-001" }
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/plan-submissions/${sub_id}/start-review"
              as: LandlordPM
            - call: "POST /api/plan-submissions/${sub_id}/approve"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/begin-pre-construction"
              as: LandlordPM
            - call: "POST /api/contractors"
              payload: { company_name: "BuildCo", license_number: "LIC-1", insurance_expiry_date: "2027-01-01T00:00:00Z" }
              as: LandlordPM
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contractors/${ctr_id}/qualify"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/contractor-engagements"
              payload: { contractor_id: "${ctr_id}", scope_note: "GC" }
              as: LandlordPM
              captures: { eng_id: $.data.id }
            - call: "POST /api/contractor-engagements/${eng_id}/acknowledge-rules"
              as: ContractorRep
              as_user_id: "${ctr_id}"
            - call: "POST /api/contractor-engagements/${eng_id}/approve"
              as: LandlordPM
            - call: "POST /api/contractor-engagements/${eng_id}/activate"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/start-construction"
              payload: { construction_start_date: "2026-08-03T00:00:00Z", construction_end_date: "2026-09-04T00:00:00Z" }
              as: LandlordPM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/ti-projects/${proj_id}"
              as: LandlordPM
              captures: { proj_v1: $.data.version }
            - call: "POST /api/ti-projects/${proj_id}/disbursement-requests"
              payload: { period_end_date: "2026-08-14T00:00:00Z", requested_amount_cents: 10000000, expected_ti_project_version: "${proj_v1}" }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { draw1_id: $.data.id }
            - call: "POST /api/disbursement-requests/${draw1_id}/submit"
              as: ContractorRep
              as_user_id: "${ctr_id}"
            - call: "POST /api/disbursement-requests/${draw1_id}/lien-waivers"
              payload: { contractor_id: "${ctr_id}", waiver_type: "UNCONDITIONAL_PROGRESS", amount_cents: 10000000 }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { lw1_id: $.data.id }
            - call: "POST /api/lien-waivers/${lw1_id}/verify"
              as: LandlordPM
            - call: "POST /api/disbursement-requests/${draw1_id}/approve"
              payload: { approved_amount_cents: 10000000 }
              as: LandlordApprover
              as_user_id: "approver-1"
            - call: "GET /api/ti-projects/${proj_id}"
              as: LandlordPM
              captures: { proj_v2: $.data.version }
            - call: "POST /api/ti-projects/${proj_id}/disbursement-requests"
              payload: { period_end_date: "2026-08-14T00:00:00Z", requested_amount_cents: 12000000, expected_ti_project_version: "${proj_v2}" }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { draw2_id: $.data.id }
            - call: "POST /api/disbursement-requests/${draw2_id}/submit"
              as: ContractorRep
              as_user_id: "${ctr_id}"
          trigger:
            - call: "GET /api/ti-projects/${proj_id}"
              as: LandlordPM
              captures: { consumed_final: $.data.allowance_consumed_cents, consumed_prov: $.data.provisional_allowance_consumed_cents, remaining: $.data.allowance_remaining_cents }
          assert:
            - "TIProject.${proj_id}.allowance_consumed_cents == 10000000 (final variant counts APPROVED draw1 only)"
            - "TIProject.${proj_id}.provisional_allowance_consumed_cents == 22000000 (provisional adds SUBMITTED draw2 requested 12000000)"
            - "TIProject.${proj_id}.allowance_remaining_cents == 40000000"
            - "DisbursementRequest.${draw1_id}.retainage_held_cents == 1000000"
            - "DisbursementRequest.${draw1_id}.net_payment_cents == 9000000"

      - name: rent_abatement_calendar_vs_business_on_lease
        grounds:
          - calculations.rent_abatement
          - entities.Lease.fields.rent_abatement_credit_cents
          - entities.Lease.fields.abatement_basis
        distinguishing_aspect: |
          Entity domain = Lease fiscal terms (different domain from the TIProject
          ledger in the sibling instance): identical delay interval 2026-09-01 ->
          2026-09-11 yields a CALENDAR-basis credit of 1000000 cents vs a
          BUSINESS-basis credit of 800000 cents, because the BUSINESS variant
          excludes the 2026-09-05/06 weekend.
        test_recipe:
          setup:
            - "Two separate projects (A: CALENDAR lease, B: BUSINESS lease), both driven to PUNCH with all punch items VERIFIED (none created), identical rent 36500000/yr, scheduled RCD 2026-09-01"
            - "Occupancy certificates issued with issued_on=2026-09-11 and delay_responsibility=LANDLORD"
            - "daily_rent = round_half_up(36500000/365) = 100000; CALENDAR delay = 10 days; BUSINESS delay = 8 days"
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "Tower B", address: "2 Main St", max_concurrent_construction_projects: 5 }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "600", floor: 6, rentable_sqft: 6000 }
              as: LandlordPM
              captures: { space_a: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "700", floor: 7, rentable_sqft: 6000 }
              as: LandlordPM
              captures: { space_b: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "Tenant Cal", contact_email: "cal@tenant.example", tax_id: "T-CAL" }
              as: LandlordPM
              captures: { tenant_a: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "Tenant Biz", contact_email: "biz@tenant.example", tax_id: "T-BIZ" }
              as: LandlordPM
              captures: { tenant_b: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_a}", tenant_id: "${tenant_a}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-09-01T00:00:00Z", lease_term_months: 60, abatement_basis: "CALENDAR" }
              as: LandlordPM
              captures: { lease_a: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_b}", tenant_id: "${tenant_b}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-09-01T00:00:00Z", lease_term_months: 60, abatement_basis: "BUSINESS" }
              as: LandlordPM
              captures: { lease_b: $.data.id }
            - call: "POST /api/leases/${lease_a}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_b}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_a}/ti-projects"
              payload: { project_name: "Suite 600 TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_a: $.data.id }
            - call: "POST /api/leases/${lease_b}/ti-projects"
              payload: { project_name: "Suite 700 TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_b: $.data.id }
            - call: "POST /api/ti-projects/${proj_a}/work-letters"
              payload: { scope_description: "TI A", allowance_offer_cents: 50000000, work_delineation: "LANDLORD" }
              as: LandlordPM
              captures: { wl_a: $.data.id }
            - call: "POST /api/work-letters/${wl_a}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_a}/accept"
              as: TenantRep
              as_user_id: "${tenant_a}"
            - call: "POST /api/work-letters/${wl_a}/execute"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_a}/begin-plan-review"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_a}/plan-submissions"
              payload: { drawing_set_ref: "DS-A" }
              as: TenantRep
              as_user_id: "${tenant_a}"
              captures: { sub_a: $.data.id }
            - call: "POST /api/plan-submissions/${sub_a}/start-review"
              as: LandlordPM
            - call: "POST /api/plan-submissions/${sub_a}/approve"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_a}/begin-pre-construction"
              as: LandlordPM
            - call: "POST /api/contractors"
              payload: { company_name: "BuildCo", license_number: "LIC-9", insurance_expiry_date: "2027-01-01T00:00:00Z" }
              as: LandlordPM
              captures: { ctr_a: $.data.id }
            - call: "POST /api/contractors/${ctr_a}/qualify"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_a}/contractor-engagements"
              payload: { contractor_id: "${ctr_a}", scope_note: "GC" }
              as: LandlordPM
              captures: { eng_a: $.data.id }
            - call: "POST /api/contractor-engagements/${eng_a}/acknowledge-rules"
              as: ContractorRep
              as_user_id: "${ctr_a}"
            - call: "POST /api/contractor-engagements/${eng_a}/approve"
              as: LandlordPM
            - call: "POST /api/contractor-engagements/${eng_a}/activate"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_a}/start-construction"
              payload: { construction_start_date: "2026-08-03T00:00:00Z", construction_end_date: "2026-09-04T00:00:00Z" }
              as: LandlordPM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ti-projects/${proj_a}/begin-punch"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_b}/work-letters"
              payload: { scope_description: "TI B", allowance_offer_cents: 50000000, work_delineation: "TENANT" }
              as: LandlordPM
              captures: { wl_b: $.data.id }
            - call: "POST /api/work-letters/${wl_b}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_b}/accept"
              as: TenantRep
              as_user_id: "${tenant_b}"
            - call: "POST /api/work-letters/${wl_b}/execute"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_b}/begin-plan-review"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_b}/plan-submissions"
              payload: { drawing_set_ref: "DS-B" }
              as: TenantRep
              as_user_id: "${tenant_b}"
              captures: { sub_b: $.data.id }
            - call: "POST /api/plan-submissions/${sub_b}/start-review"
              as: LandlordPM
            - call: "POST /api/plan-submissions/${sub_b}/approve"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_b}/begin-pre-construction"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_b}/contractor-engagements"
              payload: { contractor_id: "${ctr_a}", scope_note: "GC" }
              as: LandlordPM
              captures: { eng_b: $.data.id }
            - call: "POST /api/contractor-engagements/${eng_b}/acknowledge-rules"
              as: ContractorRep
              as_user_id: "${ctr_a}"
            - call: "POST /api/contractor-engagements/${eng_b}/approve"
              as: LandlordPM
            - call: "POST /api/contractor-engagements/${eng_b}/activate"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_b}/start-construction"
              payload: { construction_start_date: "2026-08-03T00:00:00Z", construction_end_date: "2026-09-04T00:00:00Z" }
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_b}/begin-punch"
              as: LandlordPM
          trigger:
            - call: "POST /api/ti-projects/${proj_a}/issue-occupancy-certificate"
              payload: { occupancy_certificate_ref: "CO-A-1", issued_on: "2026-09-11T00:00:00Z", delay_responsibility: "LANDLORD" }
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_b}/issue-occupancy-certificate"
              payload: { occupancy_certificate_ref: "CO-B-1", issued_on: "2026-09-11T00:00:00Z", delay_responsibility: "LANDLORD" }
              as: LandlordPM
          assert:
            - "Lease.${lease_a}.rent_abatement_credit_cents == 1000000 (CALENDAR: 10 days x 100000)"
            - "Lease.${lease_b}.rent_abatement_credit_cents == 800000 (BUSINESS: 8 days x 100000; 2026-09-05/06 weekend excluded)"
            - "Lease.${lease_a}.actual_rent_commencement_date == 2026-09-11T00:00:00Z"
            - "Lease.${lease_b}.actual_rent_commencement_date == 2026-09-11T00:00:00Z"
            - "TIProject.${proj_a}.status == CLOSEOUT"
            - "TIProject.${proj_b}.status == CLOSEOUT"

  # =====================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: retainage_tiered_threshold_boundary
        grounds:
          - calculations.disbursement_retainage
          - entities.DisbursementRequest.fields.retainage_held_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (approved_amount, cum_before, allowance_total,
          is_final_draw) with tiered-rate selection and a conditional final-draw
          branch; the 50% tier boundary uses cum_before >= threshold, so the third
          draw (cum_before exactly 25000000 == 0.50 x 50000000) prices at 5%, not 10%.
        test_recipe:
          setup:
            - "Project in CONSTRUCTION, allowance 50000000, base 40000000, one ACTIVE engagement, clock 2026-08-15"
            - "Draws approved in order: 10000000 (retainage 1000000 @10%), 15000000 (retainage 1500000 @10%); cumulative approved now exactly 25000000 == 50% threshold"
            - "Third draw of 10000000 submitted with verified waiver"
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "Tower C", address: "3 Main St", max_concurrent_construction_projects: 2 }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "200", floor: 2, rentable_sqft: 9000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
