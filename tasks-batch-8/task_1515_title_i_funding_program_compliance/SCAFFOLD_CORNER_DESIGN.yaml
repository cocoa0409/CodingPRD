          trigger:
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${shi}" }, as: FederalProgramsDirector, captures: { hi_e: "$.data[0].eligibility_flag", hi_m: "$.data[0].program_model" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${slo}" }, as: FederalProgramsDirector, captures: { lo_e: "$.data[0].eligibility_flag" } }
          assert:
            - "S_HI: poverty_pct_bp == 7600, eligibility_flag == MUST_SERVE, program_model == SCHOOLWIDE"
            - "S_LO: poverty_pct_bp == 7400, eligibility_flag == ELIGIBLE"

      - name: elected_below_threshold_school_125pct_weight
        claim_type: correct_result
        grounds:
          - calculations.school_allocation_waterfall
          - entities.SchoolAllocation.fields.serve_elected
        distinguishing_aspect: "A BELOW_THRESHOLD school (30/100 = 3000 bp) elected via serve_below_threshold_school_ids receives the 125 weight (not the 100 a 3500-3999 bp school would get), yielding per_pupil 60000 and allocation 1800000 against the 7200000 of the 10000-bp school."
        test_recipe:
          setup: ["grant total 10000000; schools SA 100/100 (10000 bp) and SB 30/100 (3000 bp, BELOW_THRESHOLD)"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Elect High", nces_id: "100637", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { sa: "$.data.id" } }
            - { call: "POST /title-i/schools", payload: { name: "Elect Low", nces_id: "100638", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { sb: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2107, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${sa}", low_income_student_count: 100, total_student_count: 100 }, { school_id: "${sb}", low_income_student_count: 30, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
          trigger:
            - { call: "POST /title-i/grants/${g}/finalize-allocations", payload: { serve_below_threshold_school_ids: ["${sb}"] }, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${sa}" }, as: FederalProgramsDirector, captures: { aa: "$.data[0].allocation_amount_cents", pa: "$.data[0].per_pupil_cents" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${sb}" }, as: FederalProgramsDirector, captures: { ab: "$.data[0].allocation_amount_cents", pb: "$.data[0].per_pupil_cents", el: "$.data[0].serve_elected" } }
          assert:
            - "SB: serve_elected == true, served == true, per_pupil_cents == 60000, allocation_amount_cents == 1800000 (weight 125 despite 3000 bp)"
            - "SA: per_pupil_cents == 72000, allocation_amount_cents == 7200000 (weight 150)"
            - "sum 9000000 == school_pool (10000000 - 500000 homeless - 500000 PD - 0 PE - 0 equitable)"
