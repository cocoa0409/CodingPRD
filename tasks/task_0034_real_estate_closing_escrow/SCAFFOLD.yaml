scenario: |
  Real Estate Closing & Third-Party Escrow: Earnest Money, Title search, Title Insurance,
  CC&R, Closing Disclosure 3-day rule, Wire Fraud protection, 1031 exchange.

domain_name: real-estate-closing-escrow
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 ENTITIES
# =============================================================================
entities:
  - name: PurchaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, increments by 1 per mutation", default: 1 }
      - { name: buyer_name, type: string, source: input, description: "Buyer legal name" }
      - { name: seller_name, type: string, source: input, description: "Seller legal name" }
      - { name: property_address, type: string, source: input, description: "Subject property address" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Contract price in USD cents", constraints: ">= 100000 and <= 1000000000000" }
      - { name: earnest_money_required_cents, type: integer, source: input, description: "Required earnest money deposit in cents" }
      - { name: scheduled_closing_date, type: datetime, source: input, description: "Target closing UTC instant (date semantic, time fixed 00:00:00Z)" }
      - { name: exchange_account_id, type: string, source: input, description: "FK -> ExchangeAccount.id; nullable; when set, settlement proceeds route via 1031 intermediary instead of seller", default: null }
      - { name: status, type: enum, source: computed, description: "Agreement lifecycle status", constraints: "DRAFT|ACTIVE|UNDER_CONTRACT|CLEARED_TO_CLOSE|CLOSED|TERMINATED", default: "DRAFT" }
      - { name: earnest_money_received_cents, type: integer, source: computed, description: "Sum of CONFIRMED EarnestMoneyDeposit.amount_cents for this agreement", default: 0 }
      - { name: terminated_reason, type: string, source: computed, description: "Reason recorded on termination", default: null }

  - name: EscrowAccount
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version", default: 1 }
      - { name: agreement_id, type: string, source: input, description: "FK -> PurchaseAgreement.id; exactly one EscrowAccount per agreement" }
      - { name: escrow_officer_id, type: string, source: input, description: "FK -> User.id; the EscrowOfficer instance assigned" }
      - { name: balance_cents, type: integer, source: computed, description: "Sum CONFIRMED EarnestMoneyDeposit.amount_cents minus sum DISBURSED Disbursement.amount_cents for this account", default: 0 }
      - { name: status, type: enum, source: computed, description: "Escrow lifecycle", constraints: "OPEN|FUNDED|DISBURSED|CLOSED", default: "OPEN" }

  - name: EarnestMoneyDeposit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version", default: 1 }
      - { name: escrow_account_id, type: string, source: input, description: "FK -> EscrowAccount.id" }
      - { name: amount_cents, type: integer, source: input, description: "Deposited amount in cents", constraints: "> 0" }
      - { name: depositor_role, type: enum, source: input, description: "Who deposited", constraints: "BUYER|BUYERS_AGENT" }
      - { name: confirmation_reference, type: string, source: input, description: "Bank confirmation number provided on confirm" }
      - { name: status, type: enum, source: computed, description: "Deposit lifecycle", constraints: "PENDING|CONFIRMED|REFUNDED|FORFEITED", default: "PENDING" }

  - name: TitleSearch
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version", default: 1 }
      - { name: agreement_id, type: string, source: input, description: "FK -> PurchaseAgreement.id" }
      - { name: defects, type: array, source: input, description: "Array of {kind:string, severity:enum(MINOR|MATERIAL), description:string} reported on completion; default empty array means clean title" }
      - { name: status, type: enum, source: computed, description: "Search workflow", constraints: "ORDERED|COMPLETED|RESOLVED", default: "ORDERED" }
      - { name: has_material_defect, type: boolean, source: computed, description: "True when any element of defects has severity=MATERIAL and status != RESOLVED", default: false }

  - name: TitleInsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version", default: 1 }
      - { name: title_search_id, type: string, source: input, description: "FK -> TitleSearch.id; policy attaches to one search" }
      - { name: coverage_amount_cents, type: integer, source: computed, description: "Equal to PurchaseAgreement.purchase_price_cents at policy issuance" }
      - { name: premium_cents, type: integer, source: computed, description: "Tiered_pricing output by §1.3 title_insurance_premium" }
      - { name: status, type: enum, source: computed, description: "Policy lifecycle", constraints: "PENDING|ISSUED|VOIDED", default: "PENDING" }

  - name: CCRReview
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC; CC&R review log entries are immutable" }
      - { name: agreement_id, type: string, source: input, description: "FK -> PurchaseAgreement.id" }
      - { name: hoa_name, type: string, source: input, description: "Association name; null if no HOA" }
      - { name: restrictions_summary, type: string, source: input, description: "Free-text summary of CC&R restrictions reviewed" }
      - { name: buyer_acknowledged, type: boolean, source: input, description: "True if buyer explicitly accepts the restrictions" }

  - name: ClosingDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version", default: 1 }
      - { name: agreement_id, type: string, source: input, description: "FK -> PurchaseAgreement.id" }
      - { name: issued_at, type: datetime, source: system, description: "UTC instant the CD entered DELIVERED" }
      - { name: cd_apr_bps, type: integer, source: input, description: "Annual percentage rate, basis points" }
      - { name: cd_total_loan_amount_cents, type: integer, source: input, description: "Loan amount stated on the disclosure" }
      - { name: cd_monthly_payment_cents, type: integer, source: input, description: "Stated monthly payment" }
      - { name: cd_product_type, type: enum, source: input, description: "Loan product variant", constraints: "FIXED|ARM|IO|BALLOON" }
      - { name: cd_prepayment_penalty, type: boolean, source: input, description: "Whether a prepayment penalty applies" }
      - { name: status, type: enum, source: computed, description: "CD workflow", constraints: "DRAFT|DELIVERED|REISSUED|ACKNOWLEDGED|EXPIRED", default: "DRAFT" }
      - { name: earliest_consummation_at, type: datetime, source: computed, description: "issued_at + 72 hours; closing cannot proceed before this instant (3-business-day rule simplified to 72 hours of clock time)" }
      - { name: acknowledged_at, type: datetime, source: computed, description: "When buyer acknowledged; null until ACKNOWLEDGED", default: null }

  - name: WireInstruction
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version", default: 1 }
      - { name: agreement_id, type: string, source: input, description: "FK -> PurchaseAgreement.id" }
      - { name: party, type: enum, source: input, description: "Who these wire instructions belong to", constraints: "BUYER|SELLER|LENDER|EXCHANGE_ACCOMMODATOR" }
      - { name: beneficiary_bank_name, type: string, source: input, description: "Recipient bank" }
      - { name: beneficiary_account_last4, type: string, source: input, description: "Last four digits of recipient account number" }
      - { name: routing_number, type: string, source: input, description: "Nine-digit ABA routing" }
      - { name: voice_callback_completed, type: boolean, source: computed, description: "True after a CALLBACK_VERIFY action on this instruction", default: false }
      - { name: callback_verified_at, type: datetime, source: computed, description: "Instant of successful callback", default: null }
      - { name: callback_verifier_id, type: string, source: computed, description: "X-User-ID of the EscrowOfficer who recorded the callback", default: null }
      - { name: status, type: enum, source: computed, description: "Instruction lifecycle", constraints: "PROVIDED|VERIFIED|LOCKED|REJECTED", default: "PROVIDED" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC; serves as deterministic chronological order key for waterfall_allocation" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version", default: 1 }
      - { name: escrow_account_id, type: string, source: input, description: "FK -> EscrowAccount.id" }
      - { name: wire_instruction_id, type: string, source: input, description: "FK -> WireInstruction.id; receiver of the funds" }
      - { name: purpose, type: enum, source: input, description: "Why funds move", constraints: "SELLER_PROCEEDS|LENDER_PAYOFF|TITLE_PREMIUM|EXCHANGE_FUNDS|EARNEST_REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Amount to disburse in cents", constraints: "> 0" }
      - { name: status, type: enum, source: computed, description: "Disbursement lifecycle", constraints: "QUEUED|DISBURSED|REVERSED", default: "QUEUED" }

  - name: ExchangeAccount
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: version, type: integer, source: system, description: "OCC version", default: 1 }
      - { name: taxpayer_name, type: string, source: input, description: "Name of the 1031 taxpayer (the seller in this benchmark)" }
      - { name: qualified_intermediary_name, type: string, source: input, description: "QI institution holding exchange funds" }
      - { name: relinquished_closing_date, type: datetime, source: input, description: "UTC instant the relinquished property closed; clock-tied" }
      - { name: identification_deadline, type: datetime, source: computed, description: "relinquished_closing_date + 45 days; replacement property must be identified by this instant" }
      - { name: exchange_deadline, type: datetime, source: computed, description: "relinquished_closing_date + 180 days; replacement purchase must close by this instant" }
      - { name: replacement_property_identified, type: boolean, source: input, description: "True after IDENTIFY action; false on creation", default: false }
      - { name: identified_at, type: datetime, source: computed, description: "Instant IDENTIFY action was recorded", default: null }
      - { name: status, type: enum, source: computed, description: "1031 exchange lifecycle", constraints: "OPEN|IDENTIFIED|COMPLETED|FAILED", default: "OPEN" }

  - name: User
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; X-User-ID for entity-backed roles maps to this" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: role, type: enum, source: input, description: "Persisted role assignment", constraints: "EscrowOfficer|TitleAgent|ComplianceOfficer" }
      - { name: full_name, type: string, source: input, description: "User legal name" }

# =============================================================================
# §1.2 STATE MACHINES
# =============================================================================
state_machines:
  - entity: PurchaseAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /agreements/{id}/activate"
        actor: EscrowOfficer
        preconditions:
          - "buyer_name, seller_name, property_address, purchase_price_cents, earnest_money_required_cents, scheduled_closing_date are all non-null"
        side_effects:
          - "auto-create one EscrowAccount with agreement_id={id}, escrow_officer_id=acting user, status=OPEN"
          - "PurchaseAgreement.version increments by 1"

      - from: ACTIVE
        to: UNDER_CONTRACT
        trigger: "system-event: EarnestMoneyDeposit confirm raises sum CONFIRMED amount_cents >= PurchaseAgreement.earnest_money_required_cents"
        actor: system
        preconditions:
          - "PurchaseAgreement.earnest_money_received_cents >= PurchaseAgreement.earnest_money_required_cents (computed at end of the confirm transition)"
        side_effects:
          - "EscrowAccount.status flips OPEN -> FUNDED"
          - "EscrowAccount.version increments by 1"
          - "PurchaseAgreement.version increments by 1"

      - from: UNDER_CONTRACT
        to: CLEARED_TO_CLOSE
        trigger: "POST /agreements/{id}/clear-to-close"
        actor: ComplianceOfficer
        preconditions:
          - "exactly one TitleSearch exists for this agreement with status=RESOLVED and has_material_defect=false"
          - "exactly one TitleInsurancePolicy exists with status=ISSUED whose title_search_id resolves back to this agreement"
          - "exactly one CCRReview exists with buyer_acknowledged=true"
          - "exactly one ClosingDisclosure exists with status=ACKNOWLEDGED"
          - "current UTC clock >= ClosingDisclosure.earliest_consummation_at"
          - "every WireInstruction with agreement_id={id} has status=LOCKED"
        side_effects:
          - "PurchaseAgreement.version increments by 1"

      - from: CLEARED_TO_CLOSE
        to: CLOSED
        trigger: "POST /agreements/{id}/close"
        actor: EscrowOfficer
        preconditions:
          - "EscrowAccount.balance_cents >= sum of all QUEUED Disbursement.amount_cents for this escrow"
          - "if PurchaseAgreement.exchange_account_id is non-null: ExchangeAccount.status IN {OPEN, IDENTIFIED} and current UTC clock <= ExchangeAccount.exchange_deadline"
        side_effects:
          - "every QUEUED Disbursement for this escrow flips to DISBURSED in created_at ASC order via waterfall_allocation (§1.3 disbursement_waterfall); each disbursed Disbursement.version increments by 1"
          - "EscrowAccount.status flips FUNDED -> DISBURSED, then DISBURSED -> CLOSED in the same transaction; EscrowAccount.version increments by 2"
          - "if exchange_account_id non-null: ExchangeAccount.status flips IDENTIFIED -> COMPLETED; ExchangeAccount.version increments by 1"
          - "PurchaseAgreement.version increments by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /agreements/{id}/terminate"
        actor: EscrowOfficer
        preconditions:
          - "PurchaseAgreement.status == ACTIVE (not yet UNDER_CONTRACT)"
          - "terminated_reason in request body is non-empty"
        side_effects:
          - "every PENDING EarnestMoneyDeposit on this agreement's escrow flips to REFUNDED (compensating action)"
          - "EscrowAccount.status flips OPEN -> CLOSED"
          - "EscrowAccount.version increments by 1"
          - "PurchaseAgreement.terminated_reason set; PurchaseAgreement.version increments by 1"

      - from: UNDER_CONTRACT
        to: TERMINATED
        trigger: "POST /agreements/{id}/terminate"
        actor: EscrowOfficer
        preconditions:
          - "PurchaseAgreement.status == UNDER_CONTRACT"
          - "TitleSearch with this agreement_id has has_material_defect=true (terminating because of unresolved material defect)"
          - "terminated_reason in request body is non-empty"
        side_effects:
          - "every CONFIRMED EarnestMoneyDeposit on this agreement's escrow flips to REFUNDED (buyer protection)"
          - "EscrowAccount.status flips FUNDED -> CLOSED"
          - "EscrowAccount.version increments by 1"
          - "PurchaseAgreement.terminated_reason set; PurchaseAgreement.version increments by 1"

  - entity: TitleSearch
    initial_state: ORDERED
    terminal_states: [RESOLVED]
    transitions:
      - from: ORDERED
        to: COMPLETED
        trigger: "POST /title-searches/{id}/complete"
        actor: TitleAgent
        preconditions:
          - "agreement.status IN {ACTIVE, UNDER_CONTRACT}"
        side_effects:
          - "defects array stored from request body"
          - "has_material_defect recomputed: true iff any defect with severity=MATERIAL exists"
          - "TitleSearch.version increments by 1"

      - from: COMPLETED
        to: RESOLVED
        trigger: "POST /title-searches/{id}/resolve"
        actor: TitleAgent
        preconditions:
          - "has_material_defect is true OR has_material_defect is false (resolution is required to advance even on clean title)"
          - "if has_material_defect is true, request body must include resolution_notes (non-empty)"
        side_effects:
          - "if has_material_defect was true at entry, each defect with severity=MATERIAL is rewritten with severity=MINOR (resolution downgrade); has_material_defect recomputed accordingly"
          - "TitleSearch.version increments by 1"
        note: "RESOLVED is terminal; subsequent retitle requires a new TitleSearch"

  - entity: ClosingDisclosure
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED, EXPIRED]
    transitions:
      - from: DRAFT
        to: DELIVERED
        trigger: "POST /closing-disclosures/{id}/deliver"
        actor: EscrowOfficer
        preconditions:
          - "agreement.status == UNDER_CONTRACT"
        side_effects:
          - "issued_at stamped with current UTC clock"
          - "earliest_consummation_at = issued_at + 72 hours (recomputed)"
          - "ClosingDisclosure.version increments by 1"

      - from: DELIVERED
        to: REISSUED
        trigger: "POST /closing-disclosures/{id}/reissue"
        actor: EscrowOfficer
        preconditions:
          - "request body specifies a material change: either cd_apr_bps differs by >= 12 bps from current, OR cd_product_type changes, OR cd_prepayment_penalty changes from false to true (these are the only three triggers for re-clocking under §1.3 cd_reissue_clock_reset)"
        side_effects:
          - "fields set per request body"
          - "issued_at re-stamped to current UTC clock"
          - "earliest_consummation_at = new issued_at + 72 hours"
          - "ClosingDisclosure.version increments by 1"
        note: "REISSUED is treated identically to DELIVERED for acknowledgement; the rename exists to surface the re-clock in audit trail"

      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /closing-disclosures/{id}/acknowledge"
        actor: EscrowOfficer
        preconditions:
          - "current UTC clock >= earliest_consummation_at (acknowledgement may occur on or after the 72-hour mark; before is rejected with ERR_CD_THREE_DAY_NOT_ELAPSED)"
        side_effects:
          - "acknowledged_at = current UTC clock"
          - "ClosingDisclosure.version increments by 1"

      - from: REISSUED
        to: ACKNOWLEDGED
        trigger: "POST /closing-disclosures/{id}/acknowledge"
        actor: EscrowOfficer
        preconditions:
          - "current UTC clock >= earliest_consummation_at (uses the re-stamped earliest_consummation_at, which restarts the 72-hour clock from reissue)"
        side_effects:
          - "acknowledged_at = current UTC clock"
          - "ClosingDisclosure.version increments by 1"

  - entity: WireInstruction
    initial_state: PROVIDED
    terminal_states: [LOCKED, REJECTED]
    transitions:
      - from: PROVIDED
        to: VERIFIED
        trigger: "POST /wire-instructions/{id}/callback-verify"
        actor: EscrowOfficer
        preconditions:
          - "request body verifier_id is non-empty and equals the acting X-User-ID (segregation-of-duties anchor)"
          - "request body voice_callback_reference is non-empty"
        side_effects:
          - "voice_callback_completed = true"
          - "callback_verified_at = current UTC clock"
          - "callback_verifier_id = acting X-User-ID"
          - "WireInstruction.version increments by 1"

      - from: VERIFIED
        to: LOCKED
        trigger: "POST /wire-instructions/{id}/lock"
        actor: ComplianceOfficer
        preconditions:
          - "acting X-User-ID != callback_verifier_id (segregation of duties: the verifier cannot lock their own callback)"
        side_effects:
          - "WireInstruction.version increments by 1"

      - from: PROVIDED
        to: REJECTED
        trigger: "POST /wire-instructions/{id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "WireInstruction.version increments by 1"

      - from: VERIFIED
        to: REJECTED
        trigger: "POST /wire-instructions/{id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "voice_callback_completed reset to false; callback_verified_at and callback_verifier_id cleared (compensating action so reverification by a different officer is forced if a replacement instruction is later submitted under the same id — which is not allowed; rejection is terminal for this id)"
          - "WireInstruction.version increments by 1"

  - entity: ExchangeAccount
    initial_state: OPEN
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: OPEN
        to: IDENTIFIED
        trigger: "POST /exchange-accounts/{id}/identify"
        actor: EscrowOfficer
        preconditions:
          - "current UTC clock <= identification_deadline (relinquished_closing_date + 45 days)"
          - "request body replacement_property_address is non-empty"
        side_effects:
          - "replacement_property_identified = true"
          - "identified_at = current UTC clock"
          - "ExchangeAccount.version increments by 1"

      - from: OPEN
        to: FAILED
        trigger: "system-event: current UTC clock > identification_deadline and replacement_property_identified is false"
        actor: system
        preconditions:
          - "current UTC clock > identification_deadline"
          - "replacement_property_identified is false"
        side_effects:
          - "ExchangeAccount.version increments by 1"
        note: "Evaluated synchronously on any read or related write that observes the deadline; tested via POST /_clock/advance + a subsequent inspecting action"

      - from: IDENTIFIED
        to: FAILED
        trigger: "system-event: current UTC clock > exchange_deadline"
        actor: system
        preconditions:
          - "current UTC clock > exchange_deadline"
        side_effects:
          - "ExchangeAccount.version increments by 1"

      - from: IDENTIFIED
        to: COMPLETED
        trigger: "system-event: corresponding PurchaseAgreement transitions to CLOSED"
        actor: system
        preconditions:
          - "PurchaseAgreement.status moves to CLOSED inside the same transaction"
          - "current UTC clock <= exchange_deadline"
        side_effects:
          - "ExchangeAccount.version increments by 1"

# =============================================================================
# §1.2.1 CONCURRENCY RULES
# =============================================================================
concurrency_rules:
  - rule_id: cd-reissue-stale-agreement
    parent_entity: PurchaseAgreement
    write_endpoint: "POST /closing-disclosures"
    occ_field: "expected_agreement_version"
    description: |
      Creating a new ClosingDisclosure against a PurchaseAgreement whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another officer has just attached a CD (which legitimately
      starts the agreement's 72-hour clock and is permitted to supersede earlier
      drafts under §1.3 cd_reissue_clock_reset) and the current writer's view of
      the agreement is therefore stale.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: title-policy-issue-stale-search
    parent_entity: TitleSearch
    write_endpoint: "POST /title-insurance-policies"
    occ_field: "expected_title_search_version"
    description: |
      Issuing a TitleInsurancePolicy against a TitleSearch whose version has
      advanced since the client last observed it is rejected. This captures
      the case where the search has been re-completed (defects rewritten)
      between the client's read and write, so the policy would otherwise
      attach to a stale defect snapshot. OCC on TitleSearch.version makes
      the race deterministic via two strictly sequential requests.
    error_id: ERR_STALE_TITLE_SEARCH_VERSION
    http_status: 412

# =============================================================================
# §1.3 CALCULATIONS
# =============================================================================
calculations:
  - name: title_insurance_premium
    trigger: "computed at POST /title-insurance-policies (the issuance endpoint); persisted on TitleInsurancePolicy.premium_cents"
    algorithm: tiered_pricing
    formula: |
      let P = PurchaseAgreement.purchase_price_cents
      tiers:
        tier_1: 0 .. 100_000_00         rate = 0.00450  per dollar
        tier_2: 100_000_01 .. 500_000_00 rate = 0.00400  per dollar
        tier_3: 500_000_01 .. 1_000_000_00 rate = 0.00350  per dollar
        tier_4: 1_000_000_01 .. +inf    rate = 0.00300  per dollar

      # Marginal allocation: amount in each tier multiplied by that tier's rate,
      # converted from cents-to-dollars only at the formula boundary.

      premium_dollars =
        (min(P, 100_000_00) / 100) * 0.00450
        + (max(min(P, 500_000_00) - 100_000_00, 0) / 100) * 0.00400
        + (max(min(P, 1_000_000_00) - 500_000_00, 0) / 100) * 0.00350
        + (max(P - 1_000_000_00, 0) / 100) * 0.00300

      # Per-line rounding pinned: each tier slice is rounded to whole cents
      # using ROUND_HALF_UP, then the four slices are summed. (This produces
      # different cents than 'sum then round once' on certain prices —
      # the per-tier order is the canonical one in §0.5 Rule 2 mode (b).)

      premium_cents = sum_per_tier( round_half_up(slice_dollars * 100) )

    input_set: "Exactly one PurchaseAgreement at the time POST /title-insurance-policies is invoked. coverage_amount_cents = purchase_price_cents."
    constants:
      TIER1_BREAK_CENTS: 10000000
      TIER2_BREAK_CENTS: 50000000
      TIER3_BREAK_CENTS: 100000000
      TIER1_RATE: 0.00450
      TIER2_RATE: 0.00400
      TIER3_RATE: 0.00350
      TIER4_RATE: 0.00300
    precision: "Per-tier slice: ROUND_HALF_UP to whole cents; then sum slices. NO secondary rounding on the sum."
    variants:
      - name: standard
        when: "default at issuance"
        difference: "the formula above as written"
      - name: lender_concurrent
        when: "if PurchaseAgreement has any WireInstruction with party=LENDER in any non-REJECTED state at time of issuance"
        difference: "applies a 0.15 (15%) reduction to the final premium_cents (lender-concurrent simultaneous-issue discount); reduction applied AFTER the per-tier sum, using ROUND_HALF_UP to whole cents on the final premium_cents value"

  - name: disbursement_waterfall
    trigger: "computed and applied during the POST /agreements/{id}/close transition (CLEARED_TO_CLOSE -> CLOSED)"
    algorithm: waterfall_allocation
    formula: |
      # Source pool: EscrowAccount.balance_cents at the start of the close
      # transaction.
      # Buckets: every QUEUED Disbursement whose escrow_account_id matches,
      # processed in created_at ASC order (deterministic chronological order key;
      # id is forbidden as decision input per §1.3 hard rule).
      # Tie-break when two disbursements share the same created_at down to
      # millisecond: lexicographic order on Disbursement.purpose enum value
      # (EARNEST_REFUND < EXCHANGE_FUNDS < LENDER_PAYOFF < SELLER_PROCEEDS < TITLE_PREMIUM).
      #
      # Allocation:
      #   remaining = EscrowAccount.balance_cents
      #   for each bucket in created_at ASC, tie-broken as above:
      #     if remaining >= bucket.amount_cents:
      #       bucket.status = DISBURSED
      #       remaining -= bucket.amount_cents
      #     else:
      #       fail the whole close with ERR_INSUFFICIENT_ESCROW_FUNDS
      #       (no partial disbursement; transaction aborts)
      #
      # Post-condition (compensating-invariant, §0.5 Rule 9):
      #   sum(QUEUED Disbursement.amount_cents at entry)
      #     == sum(DISBURSED Disbursement.amount_cents at exit)
      #   AND EscrowAccount.balance_cents at exit
      #     == EscrowAccount.balance_cents at entry
      #        - sum(DISBURSED Disbursement.amount_cents at exit)
    input_set: "All QUEUED Disbursement rows whose escrow_account_id == EscrowAccount.id at the moment the close transition begins."
    constants: {}
    precision: "Integer cents throughout; no rounding inside the waterfall."
    variants:
      - name: standard
        when: "exchange_account_id on the agreement is null"
        difference: "no special routing"
      - name: exchange_routed
        when: "exchange_account_id on the agreement is non-null"
        difference: "Any Disbursement with purpose=SELLER_PROCEEDS is rejected at queue-time (validated by §1.4 priority 17). For 1031 routing, sellers' funds must be queued as purpose=EXCHANGE_FUNDS instead. Waterfall arithmetic is otherwise identical."

  - name: earnest_refund_split
    trigger: "computed during PurchaseAgreement TERMINATED transition (both ACTIVE->TERMINATED and UNDER_CONTRACT->TERMINATED)"
    algorithm: chronological
    formula: |
      # Refund target = each EarnestMoneyDeposit row that flips status
      # (PENDING -> REFUNDED for ACTIVE->TERMINATED;
      #  CONFIRMED -> REFUNDED for UNDER_CONTRACT->TERMINATED).
      #
      # Processing order: created_at ASC. Tie-break: id is FORBIDDEN
      # (see §1.3 hard rule); use depositor_role lexicographic
      # (BUYER < BUYERS_AGENT) as tie-break.
      #
      # Side-effect: emit one Disbursement per flipped EarnestMoneyDeposit:
      #   purpose = EARNEST_REFUND
      #   amount_cents = the deposit's amount_cents
      #   wire_instruction_id = the WireInstruction with party=BUYER, status=LOCKED
      #     for this agreement; if none exists in LOCKED, fail the terminate
      #     with ERR_BUYER_WIRE_NOT_LOCKED (validated by §1.4 priority 12).
      #
      # Compensating-invariant (§0.5 Rule 9 instance):
      #   sum(EarnestMoneyDeposit.amount_cents flipped to REFUNDED in this transition)
      #     == sum(Disbursement.amount_cents emitted by this transition with purpose=EARNEST_REFUND)
      # Per-deposit, not aggregated: one Disbursement row per deposit, with
      # amount_cents copied exactly. No rounding (integer cents).
    input_set: "EarnestMoneyDeposit rows on this agreement's escrow whose status is PENDING (ACTIVE->TERMINATED) or CONFIRMED (UNDER_CONTRACT->TERMINATED)."
    constants: {}
    precision: "Integer cents; no rounding."

  - name: cd_reissue_clock_reset
    trigger: "evaluated on POST /closing-disclosures/{id}/reissue (DELIVERED -> REISSUED)"
    algorithm: threshold
    formula: |
      # Inputs: current ClosingDisclosure record vs. request body fields.
      # Material-change predicate (any-of):
      #   |req.cd_apr_bps - current.cd_apr_bps| >= 12
      #   req.cd_product_type != current.cd_product_type
      #   req.cd_prepayment_penalty == true AND current.cd_prepayment_penalty == false
      #
      # If material-change is TRUE: transition succeeds, issued_at is re-stamped
      # to current UTC clock, earliest_consummation_at = new issued_at + 72h.
      # If material-change is FALSE: ERR_CD_REISSUE_NOT_MATERIAL.
      #
      # Boundary precision: |delta| == 12 bps is treated as MATERIAL (>= not >).
      # |delta| == 11 bps is NOT material. Tested exactly on these two values.
    input_set: "The single ClosingDisclosure addressed by the path, joined with the request body."
    constants:
      APR_REISSUE_BPS_THRESHOLD: 12
      CD_WAIT_PERIOD_HOURS: 72
    precision: "Integer bps throughout; hours measured as whole-hour clock arithmetic from the clock-set endpoint's UTC instant."

# =============================================================================
# §1.4 VALIDATIONS (ordered by priority)
# =============================================================================
validations:
  # Authentication / Authorization / Existence (1–4)
  - { priority: 1, category: auth, check: "X-User-Role header present and is one of the roles enumerated in §1.7", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is permitted for the called endpoint per §1.7", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every path-templated id resolves to an existing row, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Every FK in the request body resolves to an existing row of the target type", error_id: ERR_FK_NOT_FOUND, http_status: 404, applies_to: "all endpoints with FK fields in input" }

  # State preconditions (5–8)
  - { priority: 5, category: state, check: "The addressed entity is in the from-state listed in §1.2 for the called transition; transitions from terminal states are rejected", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 6, category: state, check: "OCC: when an endpoint's input includes an expected_<parent>_version field, request value must equal current parent.version", error_id: ERR_STALE_AGREEMENT_VERSION, http_status: 412, applies_to: "POST /closing-disclosures (uses expected_agreement_version)" }
  - { priority: 6, category: state, check: "OCC: title-policy issuance requires expected_title_search_version to equal current TitleSearch.version", error_id: ERR_STALE_TITLE_SEARCH_VERSION, http_status: 412, applies_to: "POST /title-insurance-policies" }
  - { priority: 7, category: state, check: "Closing acknowledgement: current clock must be >= ClosingDisclosure.earliest_consummation_at on POST /closing-disclosures/{id}/acknowledge", error_id: ERR_CD_THREE_DAY_NOT_ELAPSED, http_status: 409, applies_to: "POST /closing-disclosures/{id}/acknowledge" }
  - { priority: 8, category: state, check: "Wire lock: acting X-User-ID on POST /wire-instructions/{id}/lock must differ from WireInstruction.callback_verifier_id", error_id: ERR_WIRE_SOD_VIOLATION, http_status: 409, applies_to: "POST /wire-instructions/{id}/lock" }

  # Business safety / compliance (9–12) — wire-fraud and buyer-protection rules outrank fiscal/referential
  - { priority: 9, category: business_safety, check: "POST /disbursements: wire_instruction_id must reference a WireInstruction whose status == LOCKED", error_id: ERR_WIRE_NOT_LOCKED, http_status: 409, applies_to: "POST /disbursements" }
  - { priority: 10, category: business_safety, check: "POST /closing-disclosures/{id}/reissue request body must produce a material change per §1.3 cd_reissue_clock_reset", error_id: ERR_CD_REISSUE_NOT_MATERIAL, http_status: 422, applies_to: "POST /closing-disclosures/{id}/reissue" }
  - { priority: 11, category: business_safety, check: "POST /agreements/{id}/clear-to-close: every WireInstruction with this agreement_id must be in status LOCKED", error_id: ERR_WIRE_NOT_LOCKED, http_status: 409, applies_to: "POST /agreements/{id}/clear-to-close" }
  - { priority: 12, category: business_safety, check: "On PurchaseAgreement terminate, the BUYER WireInstruction for this agreement must be in status=LOCKED so the earnest-refund Disbursement can route to a verified destination", error_id: ERR_BUYER_WIRE_NOT_LOCKED, http_status: 409, applies_to: "POST /agreements/{id}/terminate" }

  # Business referential (13–15)
  - { priority: 13, category: business_referential, check: "POST /title-insurance-policies: referenced TitleSearch must have has_material_defect=false and status IN {RESOLVED} (only resolved searches can be insured)", error_id: ERR_TITLE_NOT_INSURABLE, http_status: 409, applies_to: "POST /title-insurance-policies" }
  - { priority: 14, category: business_referential, check: "POST /agreements/{id}/clear-to-close: ClosingDisclosure with this agreement_id must be in status=ACKNOWLEDGED", error_id: ERR_CD_NOT_ACKNOWLEDGED, http_status: 409, applies_to: "POST /agreements/{id}/clear-to-close" }
  - { priority: 15, category: business_referential, check: "POST /agreements/{id}/clear-to-close: CCRReview with this agreement_id must exist with buyer_acknowledged=true", error_id: ERR_CCR_NOT_ACKNOWLEDGED, http_status: 409, applies_to: "POST /agreements/{id}/clear-to-close" }

  # Business temporal (16)
  - { priority: 16, category: business_temporal, check: "POST /exchange-accounts/{id}/identify: current UTC clock must be <= identification_deadline (relinquished_closing_date + 45 days). On-the-day (equality) is allowed; strictly greater is rejected.", error_id: ERR_EXCHANGE_ID_DEADLINE_PASSED, http_status: 409, applies_to: "POST /exchange-accounts/{id}/identify" }

  # Business constraint (17–19)
  - { priority: 17, category: business_constraint, check: "POST /disbursements with purpose=SELLER_PROCEEDS is rejected when the linked PurchaseAgreement.exchange_account_id is non-null (must use purpose=EXCHANGE_FUNDS instead under 1031 routing)", error_id: ERR_EXCHANGE_ROUTING_REQUIRED, http_status: 422, applies_to: "POST /disbursements" }
  - { priority: 18, category: business_constraint, check: "POST /earnest-money-deposits: amount_cents must be > 0", error_id: ERR_INVALID_AMOUNT, http_status: 422, applies_to: "POST /earnest-money-deposits" }
  - { priority: 19, category: business_constraint, check: "POST /purchase-agreements: purchase_price_cents in [100000, 1000000000000]", error_id: ERR_PRICE_OUT_OF_RANGE, http_status: 422, applies_to: "POST /purchase-agreements" }

  # Business fiscal (20)
  - { priority: 20, category: business_fiscal, check: "POST /agreements/{id}/close: EscrowAccount.balance_cents must be >= sum of QUEUED Disbursement.amount_cents for this escrow (waterfall would otherwise underflow)", error_id: ERR_INSUFFICIENT_ESCROW_FUNDS, http_status: 409, applies_to: "POST /agreements/{id}/close" }

  # Catch-all (21)
  - { priority: 21, category: business_constraint, check: "Request body shape — required fields present, types match, enum values within declared set", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: "all" }

# =============================================================================
# §1.5 ENDPOINTS
# =============================================================================
endpoints:
  # --- PurchaseAgreement ---
  - { method: POST, path: "/purchase-agreements", description: "Create a new purchase agreement in DRAFT", roles: [EscrowOfficer], code: 201,
      input: [buyer_name, seller_name, property_address, purchase_price_cents, earnest_money_required_cents, scheduled_closing_date, "exchange_account_id?"],
      output: PurchaseAgreement,
      side_effects: ["PurchaseAgreement created with status=DRAFT, version=1"] }
  - { method: GET,  path: "/purchase-agreements/{id}", description: "Fetch a purchase agreement", roles: [EscrowOfficer, TitleAgent, ComplianceOfficer], code: 200,
      input: [], output: PurchaseAgreement, side_effects: [] }
  - { method: GET,  path: "/purchase-agreements", description: "List purchase agreements, paginated and filterable", roles: [EscrowOfficer, TitleAgent, ComplianceOfficer], code: 200,
      input: ["limit?", "offset?", "status?", "exchange_account_id?"], output: "PurchaseAgreement[]", side_effects: [] }
  - { method: POST, path: "/purchase-agreements/{id}/activate", description: "DRAFT -> ACTIVE; auto-creates EscrowAccount", roles: [EscrowOfficer], code: 200,
      input: [], output: PurchaseAgreement,
      side_effects: ["EscrowAccount created (status=OPEN)", "increments PurchaseAgreement.version by 1"] }
  - { method: POST, path: "/purchase-agreements/{id}/clear-to-close", description: "UNDER_CONTRACT -> CLEARED_TO_CLOSE", roles: [ComplianceOfficer], code: 200,
      input: [], output: PurchaseAgreement,
      side_effects: ["increments PurchaseAgreement.version by 1"] }
  - { method: POST, path: "/purchase-agreements/{id}/close", description: "CLEARED_TO_CLOSE -> CLOSED; runs disbursement_waterfall", roles: [EscrowOfficer], code: 200,
      input: [], output: PurchaseAgreement,
      side_effects: [
        "every QUEUED Disbursement flips to DISBURSED in created_at ASC (waterfall)",
        "EscrowAccount.status: FUNDED -> DISBURSED -> CLOSED",
        "if exchange_account_id non-null: ExchangeAccount.status IDENTIFIED -> COMPLETED",
        "increments PurchaseAgreement.version by 1"
      ] }
  - { method: POST, path: "/purchase-agreements/{id}/terminate", description: "ACTIVE or UNDER_CONTRACT -> TERMINATED; refunds earnest money via Disbursements", roles: [EscrowOfficer], code: 200,
      input: [terminated_reason], output: PurchaseAgreement,
      side_effects: [
        "PENDING (or CONFIRMED, depending on from-state) EarnestMoneyDeposit -> REFUNDED",
        "one Disbursement per refunded deposit (purpose=EARNEST_REFUND, routed to BUYER LOCKED WireInstruction)",
        "EscrowAccount.status -> CLOSED; increments EscrowAccount.version by 1",
        "increments PurchaseAgreement.version by 1"
      ] }

  # --- EscrowAccount ---
  - { method: GET,  path: "/escrow-accounts/{id}", description: "Fetch an escrow account", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: [], output: EscrowAccount, side_effects: [] }
  - { method: GET,  path: "/escrow-accounts", description: "List escrow accounts, filterable by agreement_id", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: ["limit?", "offset?", "agreement_id?", "escrow_officer_id?", "status?"], output: "EscrowAccount[]", side_effects: [] }

  # --- EarnestMoneyDeposit ---
  - { method: POST, path: "/earnest-money-deposits", description: "Create a PENDING earnest money deposit on an escrow account", roles: [EscrowOfficer], code: 201,
      input: [escrow_account_id, amount_cents, depositor_role], output: EarnestMoneyDeposit,
      side_effects: ["EarnestMoneyDeposit created status=PENDING, version=1"] }
  - { method: POST, path: "/earnest-money-deposits/{id}/confirm", description: "PENDING -> CONFIRMED; may bubble agreement ACTIVE -> UNDER_CONTRACT", roles: [EscrowOfficer], code: 200,
      input: [confirmation_reference], output: EarnestMoneyDeposit,
      side_effects: [
        "EarnestMoneyDeposit.version increments by 1",
        "PurchaseAgreement.earnest_money_received_cents recomputed",
        "if recomputed value >= earnest_money_required_cents AND agreement.status == ACTIVE: agreement -> UNDER_CONTRACT, EscrowAccount.status -> FUNDED"
      ] }
  - { method: GET,  path: "/earnest-money-deposits", description: "List/filter deposits", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: ["limit?", "offset?", "escrow_account_id?", "status?"], output: "EarnestMoneyDeposit[]", side_effects: [] }
  - { method: GET,  path: "/earnest-money-deposits/{id}", description: "Fetch a deposit", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: [], output: EarnestMoneyDeposit, side_effects: [] }

  # --- TitleSearch ---
  - { method: POST, path: "/title-searches", description: "Order a title search (status=ORDERED)", roles: [TitleAgent], code: 201,
      input: [agreement_id], output: TitleSearch,
      side_effects: ["TitleSearch created status=ORDERED, version=1"] }
  - { method: POST, path: "/title-searches/{id}/complete", description: "ORDERED -> COMPLETED; records defects", roles: [TitleAgent], code: 200,
      input: [defects], output: TitleSearch,
      side_effects: ["TitleSearch.defects set", "has_material_defect recomputed", "TitleSearch.version increments by 1"] }
  - { method: POST, path: "/title-searches/{id}/resolve", description: "COMPLETED -> RESOLVED; downgrades material defects", roles: [TitleAgent], code: 200,
      input: ["resolution_notes?"], output: TitleSearch,
      side_effects: ["MATERIAL defects rewritten to MINOR", "has_material_defect recomputed", "TitleSearch.version increments by 1"] }
  - { method: GET,  path: "/title-searches", description: "List title searches, filterable by agreement_id", roles: [TitleAgent, EscrowOfficer, ComplianceOfficer], code: 200,
      input: ["limit?", "offset?", "agreement_id?", "status?"], output: "TitleSearch[]", side_effects: [] }
  - { method: GET,  path: "/title-searches/{id}", description: "Fetch a title search", roles: [TitleAgent, EscrowOfficer, ComplianceOfficer], code: 200,
      input: [], output: TitleSearch, side_effects: [] }

  # --- TitleInsurancePolicy ---
  - { method: POST, path: "/title-insurance-policies", description: "Issue title insurance against a resolved title search (OCC-gated on TitleSearch.version)", roles: [TitleAgent], code: 201,
      input: [title_search_id, expected_title_search_version], output: TitleInsurancePolicy,
      side_effects: [
        "TitleInsurancePolicy created status=ISSUED, version=1",
        "premium_cents computed via §1.3 title_insurance_premium (variant standard or lender_concurrent)",
        "coverage_amount_cents := PurchaseAgreement.purchase_price_cents",
        "increments TitleSearch.version by 1 (OCC-pinned writes always bump the parent)"
      ] }
  - { method: GET,  path: "/title-insurance-policies/{id}", description: "Fetch a title insurance policy", roles: [TitleAgent, EscrowOfficer, ComplianceOfficer], code: 200,
      input: [], output: TitleInsurancePolicy, side_effects: [] }
  - { method: GET,  path: "/title-insurance-policies", description: "List title insurance policies, filterable by title_search_id", roles: [TitleAgent, EscrowOfficer, ComplianceOfficer], code: 200,
      input: ["limit?", "offset?", "title_search_id?", "status?"], output: "TitleInsurancePolicy[]", side_effects: [] }

  # --- CCRReview ---
  - { method: POST, path: "/ccr-reviews", description: "Record a CC&R review (append-only)", roles: [ComplianceOfficer], code: 201,
      input: [agreement_id, hoa_name, restrictions_summary, buyer_acknowledged], output: CCRReview,
      side_effects: ["CCRReview row appended; immutable"] }
  - { method: GET,  path: "/ccr-reviews", description: "List CC&R reviews, filterable by agreement_id", roles: [ComplianceOfficer, EscrowOfficer], code: 200,
      input: ["limit?", "offset?", "agreement_id?"], output: "CCRReview[]", side_effects: [] }
  - { method: GET,  path: "/ccr-reviews/{id}", description: "Fetch a CC&R review", roles: [ComplianceOfficer, EscrowOfficer], code: 200,
      input: [], output: CCRReview, side_effects: [] }

  # --- ClosingDisclosure ---
  - { method: POST, path: "/closing-disclosures", description: "Create a CD in DRAFT (OCC-gated on PurchaseAgreement.version)", roles: [EscrowOfficer], code: 201,
      input: [agreement_id, expected_agreement_version, cd_apr_bps, cd_total_loan_amount_cents, cd_monthly_payment_cents, cd_product_type, cd_prepayment_penalty],
      output: ClosingDisclosure,
      side_effects: [
        "ClosingDisclosure created status=DRAFT, version=1",
        "increments PurchaseAgreement.version by 1 (OCC-pinned write bumps parent)"
      ] }
  - { method: POST, path: "/closing-disclosures/{id}/deliver", description: "DRAFT -> DELIVERED; stamps issued_at and earliest_consummation_at", roles: [EscrowOfficer], code: 200,
      input: [], output: ClosingDisclosure,
      side_effects: ["issued_at stamped", "earliest_consummation_at = issued_at + 72h", "ClosingDisclosure.version increments by 1"] }
  - { method: POST, path: "/closing-disclosures/{id}/reissue", description: "DELIVERED -> REISSUED on material change; restarts 72h clock", roles: [EscrowOfficer], code: 200,
      input: ["cd_apr_bps?", "cd_product_type?", "cd_prepayment_penalty?"], output: ClosingDisclosure,
      side_effects: ["fields updated", "issued_at re-stamped", "earliest_consummation_at recomputed", "ClosingDisclosure.version increments by 1"] }
  - { method: POST, path: "/closing-disclosures/{id}/acknowledge", description: "DELIVERED or REISSUED -> ACKNOWLEDGED; gated by 72h", roles: [EscrowOfficer], code: 200,
      input: [], output: ClosingDisclosure,
      side_effects: ["acknowledged_at stamped", "ClosingDisclosure.version increments by 1"] }
  - { method: GET,  path: "/closing-disclosures/{id}", description: "Fetch a closing disclosure", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: [], output: ClosingDisclosure, side_effects: [] }
  - { method: GET,  path: "/closing-disclosures", description: "List closing disclosures, filterable by agreement_id", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: ["limit?", "offset?", "agreement_id?", "status?"], output: "ClosingDisclosure[]", side_effects: [] }

  # --- WireInstruction ---
  - { method: POST, path: "/wire-instructions", description: "Submit wire instructions for a party (status=PROVIDED)", roles: [EscrowOfficer], code: 201,
      input: [agreement_id, party, beneficiary_bank_name, beneficiary_account_last4, routing_number], output: WireInstruction,
      side_effects: ["WireInstruction created status=PROVIDED, version=1"] }
  - { method: POST, path: "/wire-instructions/{id}/callback-verify", description: "PROVIDED -> VERIFIED via voice callback", roles: [EscrowOfficer], code: 200,
      input: [verifier_id, voice_callback_reference], output: WireInstruction,
      side_effects: ["voice_callback_completed=true", "callback_verified_at and callback_verifier_id set", "WireInstruction.version increments by 1"] }
  - { method: POST, path: "/wire-instructions/{id}/lock", description: "VERIFIED -> LOCKED by a different officer (segregation of duties)", roles: [ComplianceOfficer], code: 200,
      input: [], output: WireInstruction,
      side_effects: ["WireInstruction.version increments by 1"] }
  - { method: POST, path: "/wire-instructions/{id}/reject", description: "PROVIDED or VERIFIED -> REJECTED", roles: [ComplianceOfficer], code: 200,
      input: [], output: WireInstruction,
      side_effects: ["callback flags cleared if from VERIFIED", "WireInstruction.version increments by 1"] }
  - { method: GET,  path: "/wire-instructions/{id}", description: "Fetch a wire instruction", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: [], output: WireInstruction, side_effects: [] }
  - { method: GET,  path: "/wire-instructions", description: "List wire instructions, filterable by agreement_id and party", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: ["limit?", "offset?", "agreement_id?", "party?", "status?"], output: "WireInstruction[]", side_effects: [] }

  # --- Disbursement ---
  - { method: POST, path: "/disbursements", description: "Queue a disbursement against an escrow account", roles: [EscrowOfficer], code: 201,
      input: [escrow_account_id, wire_instruction_id, purpose, amount_cents], output: Disbursement,
      side_effects: ["Disbursement created status=QUEUED, version=1"] }
  - { method: GET,  path: "/disbursements", description: "List disbursements, filterable by escrow_account_id and wire_instruction_id", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: ["limit?", "offset?", "escrow_account_id?", "wire_instruction_id?", "status?"], output: "Disbursement[]", side_effects: [] }
  - { method: GET,  path: "/disbursements/{id}", description: "Fetch a disbursement", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: [], output: Disbursement, side_effects: [] }

  # --- ExchangeAccount ---
  - { method: POST, path: "/exchange-accounts", description: "Open a 1031 exchange account", roles: [EscrowOfficer], code: 201,
      input: [taxpayer_name, qualified_intermediary_name, relinquished_closing_date], output: ExchangeAccount,
      side_effects: ["ExchangeAccount created status=OPEN, version=1", "identification_deadline = relinquished_closing_date + 45d", "exchange_deadline = relinquished_closing_date + 180d"] }
  - { method: POST, path: "/exchange-accounts/{id}/identify", description: "OPEN -> IDENTIFIED (replacement property)", roles: [EscrowOfficer], code: 200,
      input: [replacement_property_address], output: ExchangeAccount,
      side_effects: ["replacement_property_identified=true", "identified_at stamped", "ExchangeAccount.version increments by 1"] }
  - { method: GET,  path: "/exchange-accounts/{id}", description: "Fetch an exchange account (read may trigger deadline-driven FAILED transition synchronously)", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: [], output: ExchangeAccount, side_effects: ["if deadlines elapsed and conditions met, ExchangeAccount.status flips to FAILED before return"] }
  - { method: GET,  path: "/exchange-accounts", description: "List exchange accounts", roles: [EscrowOfficer, ComplianceOfficer], code: 200,
      input: ["limit?", "offset?", "status?"], output: "ExchangeAccount[]", side_effects: [] }

  # --- User (entity-backed identity for EscrowOfficer/TitleAgent/ComplianceOfficer) ---
  - { method: POST, path: "/users", description: "Register a user with a role; X-User-ID for entity-backed roles maps to User.id", roles: [ComplianceOfficer], code: 201,
      input: [full_name, role], output: User,
      side_effects: ["User created"] }
  - { method: GET,  path: "/users/{id}", description: "Fetch a user", roles: [EscrowOfficer, TitleAgent, ComplianceOfficer], code: 200,
      input: [], output: User, side_effects: [] }
  - { method: GET,  path: "/users", description: "List users, filterable by role", roles: [ComplianceOfficer], code: 200,
      input: ["limit?", "offset?", "role?"], output: "User[]", side_effects: [] }

  # --- Test-driving endpoints (under /_<name>; declared first-class for the scaffold) ---
  - { method: POST, path: "/_clock/set", description: "Set the server's mock UTC clock to an explicit ISO8601 instant (whole-second precision)", roles: [ComplianceOfficer], code: 200,
      input: [to_iso8601], output: null,
      side_effects: ["mock UTC clock set"] }
  - { method: POST, path: "/_clock/advance", description: "Advance the server's mock UTC clock by a duration (seconds)", roles: [ComplianceOfficer], code: 200,
      input: [seconds], output: null,
      side_effects: ["mock UTC clock advanced; subsequent reads observe the new clock"] }

# =============================================================================
# §1.6 ERRORS
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,          http: 401, condition: "X-User-Role missing or not a known role" }
  - { id: ERR_FORBIDDEN,                http: 403, condition: "X-User-Role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND,                http: 404, condition: "Path id does not resolve" }
  - { id: ERR_FK_NOT_FOUND,             http: 404, condition: "FK in request body does not resolve" }
  - { id: ERR_INVALID_STATE,            http: 409, condition: "Entity not in required from-state for the called transition" }
  - { id: ERR_STALE_AGREEMENT_VERSION,  http: 412, condition: "expected_agreement_version != PurchaseAgreement.version" }
  - { id: ERR_STALE_TITLE_SEARCH_VERSION, http: 412, condition: "expected_title_search_version != TitleSearch.version" }
  - { id: ERR_CD_THREE_DAY_NOT_ELAPSED, http: 409, condition: "Acknowledge attempted before earliest_consummation_at" }
  - { id: ERR_CD_REISSUE_NOT_MATERIAL,  http: 422, condition: "Reissue body produces no material change per §1.3 cd_reissue_clock_reset" }
  - { id: ERR_WIRE_SOD_VIOLATION,       http: 409, condition: "Lock attempted by the same X-User-ID that performed the callback" }
  - { id: ERR_WIRE_NOT_LOCKED,          http: 409, condition: "An operation requires WireInstruction.status=LOCKED but it is not" }
  - { id: ERR_BUYER_WIRE_NOT_LOCKED,    http: 409, condition: "Terminate requires the BUYER WireInstruction to be LOCKED so refund can route" }
  - { id: ERR_TITLE_NOT_INSURABLE,      http: 409, condition: "TitleSearch is not RESOLVED with has_material_defect=false" }
  - { id: ERR_CD_NOT_ACKNOWLEDGED,      http: 409, condition: "clear-to-close attempted while CD is not ACKNOWLEDGED" }
  - { id: ERR_CCR_NOT_ACKNOWLEDGED,     http: 409, condition: "clear-to-close attempted while CCRReview.buyer_acknowledged is false or no review exists" }
  - { id: ERR_EXCHANGE_ID_DEADLINE_PASSED, http: 409, condition: "identify attempted after identification_deadline" }
  - { id: ERR_EXCHANGE_ROUTING_REQUIRED, http: 422, condition: "Disbursement purpose=SELLER_PROCEEDS while agreement.exchange_account_id is non-null" }
  - { id: ERR_INVALID_AMOUNT,           http: 422, condition: "amount_cents <= 0" }
  - { id: ERR_PRICE_OUT_OF_RANGE,       http: 422, condition: "purchase_price_cents outside [100000, 1000000000000]" }
  - { id: ERR_INSUFFICIENT_ESCROW_FUNDS, http: 409, condition: "EscrowAccount.balance_cents < sum of QUEUED Disbursement.amount_cents at close" }
  - { id: ERR_INVALID_REQUEST,          http: 422, condition: "Request body shape invalid (missing required, wrong type, unknown enum)" }

# =============================================================================
# §1.7 RBAC
# =============================================================================
roles:
  - name: EscrowOfficer
    description: "Third-party neutral officer who runs the closing: opens escrow, takes deposits, drives CD, executes the close, queues and disburses funds."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /purchase-agreements"
      - "POST /purchase-agreements/{id}/activate"
      - "POST /purchase-agreements/{id}/close"
      - "POST /purchase-agreements/{id}/terminate"
      - "POST /earnest-money-deposits"
      - "POST /earnest-money-deposits/{id}/confirm"
      - "POST /closing-disclosures"
      - "POST /closing-disclosures/{id}/deliver"
      - "POST /closing-disclosures/{id}/reissue"
      - "POST /closing-disclosures/{id}/acknowledge"
      - "POST /wire-instructions"
      - "POST /wire-instructions/{id}/callback-verify"
      - "POST /disbursements"
      - "POST /exchange-accounts"
      - "POST /exchange-accounts/{id}/identify"
    shared_operations:
      - "GET on PurchaseAgreement, EscrowAccount, EarnestMoneyDeposit, TitleSearch, TitleInsurancePolicy, CCRReview, ClosingDisclosure, WireInstruction, Disbursement, ExchangeAccount, User"

  - name: TitleAgent
    description: "Title company agent who runs the title search and issues title insurance."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /title-searches"
      - "POST /title-searches/{id}/complete"
      - "POST /title-searches/{id}/resolve"
      - "POST /title-insurance-policies"
    shared_operations:
      - "GET on PurchaseAgreement, TitleSearch, TitleInsurancePolicy, User"

  - name: ComplianceOfficer
    description: "Compliance role: records CC&R review, locks wire instructions (different person than the verifier — segregation of duties), and issues clear-to-close."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /ccr-reviews"
      - "POST /wire-instructions/{id}/lock"
      - "POST /wire-instructions/{id}/reject"
      - "POST /purchase-agreements/{id}/clear-to-close"
      - "POST /users"
      - "POST /_clock/set"
      - "POST /_clock/advance"
    shared_operations:
      - "GET on PurchaseAgreement, EscrowAccount, EarnestMoneyDeposit, TitleSearch, TitleInsurancePolicy, CCRReview, ClosingDisclosure, WireInstruction, Disbursement, ExchangeAccount, User"
