          - endpoints[POST /customers/{id}/verify]
        distinguishing_aspect: |
          The identical request body is illegal in one state and legal in
          another: TX prohibits credit inquiries, so supplying credit_score
          fails at priority 9 before any score is computed, while MN permits it
          and the same body verifies with score 95 — proving credit_score is
          inert in the score itself. The gate keys off the CUSTOMER's state_code
          (no store or agreement is involved in verification).
        test_recipe:
          setup:
            - "a TX rule with credit_inquiry_prohibited true and an MN rule with credit_inquiry_prohibited false"
