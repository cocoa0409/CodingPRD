            - "err_stale_version == \"ERR_POLICY_NOT_ACTIVE\" as well, NOT ERR_STALE_POLICY_VERSION: priority 12 is evaluated before priority 13"
            - "the dispute keeps status \"OPEN\" with credit_insurance_policy_id unset, and ExportOrder.settlement_status stays \"DISHONORED\" — no partial claim linkage is written"

  - section: rbac
    instances:
      - name: corner_absent_or_blank_headers_outrank_every_body_defect_missing_auth_headers
        claim_type: auth_header_enforcement
        grounds:
          - validations.priority_1
          - errors[ERR_MISSING_AUTH_HEADERS]
          - rbac.role_model_notes
        distinguishing_aspect: "Priority 1 requires both X-User-Role and X-User-ID to be present AND non-empty, so a blank-but-present header is as fatal as a missing one; each probe also carries a second, unrelated defect (bogus foreign key, invalid enum, malformed timestamp) that must stay invisible because priority 1 short-circuits everything."
        test_recipe:
          setup:
            - "no rows are created; every probe must be rejected before any lookup"
          setup_api_calls: []
          trigger:
            - call: "POST /export-orders"
              as: ""
              as_user_id: ""
              payload: { buyer_id: "11111111-0000-4000-8000-0000000000a1", incoterm: "FOB_PLUS", incoterm_named_place: "Nowhere", origin_country_code: "US", destination_country_code: "DE", destination_zone: "ZONE_9", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              captures: { err_both_absent: "$.data.error_id" }
            - call: "GET /letters-of-credit"
              as: "ExportOpsCoordinator"
              as_user_id: ""
              payload: { limit: 10, offset: 0 }
              captures: { err_blank_user_id: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              as: ""
              as_user_id: "u_admin_pat"
              payload: { current_utc: "the day after tomorrow" }
              captures: { err_blank_role: "$.data.error_id" }
          assert:
            - "err_both_absent == \"ERR_MISSING_AUTH_HEADERS\" with HTTP 401 — not ERR_VALIDATION for incoterm \"FOB_PLUS\" and not ERR_BUYER_NOT_FOUND"
            - "err_blank_user_id == \"ERR_MISSING_AUTH_HEADERS\" with HTTP 401: a present-but-empty X-User-ID is treated as absent"
            - "err_blank_role == \"ERR_MISSING_AUTH_HEADERS\" with HTTP 401 — not ERR_VALIDATION for the unparseable current_utc"
            - "the logical clock still reports 2026-08-01T00:00:00Z on the next authenticated read, and no ExportOrder row exists"
      - name: corner_unrecognised_role_string_is_rejected_before_path_resolution_invalid_role
        claim_type: role_permission_matrix
        grounds:
          - validations.priority_2
          - errors[ERR_UNKNOWN_ROLE]
          - rbac.ExportOpsCoordinator
        distinguishing_aspect: "Priority 2 admits exactly the six literal role names from §1.7, so a plausible-but-undeclared role and a case-shifted spelling of a real role both fail identically — and they fail at 401 before the priority-5 path lookup that would otherwise have produced a 404 for the fabricated path id."
        test_recipe:
          setup:
            - "no rows are created; the path ids in these probes are deliberately non-existent"
          setup_api_calls: []
          trigger:
            - call: "GET /letters-of-credit/11111111-0000-4000-8000-0000000000b1"
              as: "TradeFinanceWizard"
              as_user_id: "u_ghost_gary"
              payload: {}
              captures: { err_invented_role: "$.data.error_id" }
            - call: "GET /export-orders"
              as: "exportopscoordinator"
              as_user_id: "u_ops_alice"
              payload: { limit: 10, offset: 0 }
              captures: { err_lowercase_role: "$.data.error_id" }
            - call: "GET /dispute-cases"
              as: "Buyer"
              as_user_id: "u_ops_alice"
              payload: { limit: 10, offset: 0 }
              captures: { err_abbreviated_role: "$.data.error_id" }
          assert:
            - "err_invented_role == \"ERR_UNKNOWN_ROLE\" with HTTP 401 — NOT ERR_LC_NOT_FOUND, proving priority 2 precedes priority 5"
            - "err_lowercase_role == \"ERR_UNKNOWN_ROLE\": role matching is exact and case-sensitive against the six §1.7 names"
            - "err_abbreviated_role == \"ERR_UNKNOWN_ROLE\": \"Buyer\" is not the declared name \"ForeignBuyer\""
            - "no probe returns 403 — an unknown role can never reach the priority-3 endpoint roles list"
      - name: corner_role_gate_fires_before_path_and_body_existence_forbidden
        claim_type: role_permission_matrix
        grounds:
          - validations.priority_3
          - validations.priority_4
          - errors[ERR_ROLE_NOT_PERMITTED]
          - rbac.TradeComplianceOfficer
          - rbac.FinanceCollectionsOfficer
        distinguishing_aspect: "Priority 3 sits above every existence check, so a permitted-role failure must mask a bogus body foreign key (priority 6), a bogus path id (priority 5) and even the ForeignBuyer identity resolution (priority 4) — the last case matters because ForeignBuyer is entity-backed and its identity lookup would otherwise be the visible failure."
        test_recipe:
          setup:
            - "no rows are created; every id below is fabricated"
          setup_api_calls: []
          trigger:
            - call: "POST /trade-documents"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { export_order_id: "11111111-0000-4000-8000-0000000000c1", doc_type: "COMMERCIAL_INVOICE" }
              captures: { err_compliance_writes_doc: "$.data.error_id" }
            - call: "POST /document-presentations/11111111-0000-4000-8000-0000000000c2/examine"
              as: FinanceCollectionsOfficer
              as_user_id: "u_fin_frank"
              payload: { findings: [] }
              captures: { err_finance_examines: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              captures: { err_reviewer_drives_clock: "$.data.error_id" }
            - call: "GET /export-orders/11111111-0000-4000-8000-0000000000c3"
              as: ForeignBuyer
              as_user_id: "11111111-0000-4000-8000-0000000000c4"
              payload: {}
              captures: { err_buyer_reads_item: "$.data.error_id" }
          assert:
            - "err_compliance_writes_doc == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403, NOT ERR_ORDER_NOT_FOUND — priority 3 precedes priority 6"
            - "err_finance_examines == \"ERR_ROLE_NOT_PERMITTED\", NOT ERR_PRESENTATION_NOT_FOUND — priority 3 precedes priority 5"
            - "err_reviewer_drives_clock == \"ERR_ROLE_NOT_PERMITTED\" and the logical clock is unmoved: POST /_clock/set_current_utc is PlatformAdmin-exclusive"
            - "err_buyer_reads_item == \"ERR_ROLE_NOT_PERMITTED\", NOT ERR_BUYER_IDENTITY_NOT_FOUND — GET /export-orders/{export_order_id} omits ForeignBuyer from its roles list even though the collection form includes it, so priority 3 fires before priority 4"
      - name: corner_buyer_identity_must_resolve_to_a_buyer_row_before_scope_forbidden
        claim_type: entity_backed_identity
        grounds:
          - validations.priority_4
          - validations.priority_7
          - errors[ERR_BUYER_IDENTITY_NOT_FOUND]
          - rbac.ForeignBuyer
        distinguishing_aspect: "ForeignBuyer's identity is entity_backed, so X-User-ID must be the primary key of a live ForeignBuyer row; an unknown UUID and a UUID that belongs to a different entity family (the ExportOrder's own id) both fail at priority 4 with 403, ahead of the priority-6 body lookup and the priority-7 ownership comparison. The same header value that fails everywhere succeeds once it is the real buyer id."
        test_recipe:
          setup:
            - "one buyer with one order, so a correctly identified buyer has exactly one visible order"
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Rotterdam Bulk Handling BV", country_code: "NL", credit_rating: "A", sanctions_tier: "NONE", restricted_party_flag: false }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { buyer_id: "${buyer_id}", incoterm: "CIF", incoterm_named_place: "Rotterdam", origin_country_code: "US", destination_country_code: "NL", destination_zone: "ZONE_2", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "GET /export-orders"
              as: ForeignBuyer
              as_user_id: "11111111-0000-4000-8000-0000000000d1"
              payload: { limit: 10, offset: 0 }
              captures: { err_unknown_uuid: "$.data.error_id" }
            - call: "GET /dispute-cases"
              as: ForeignBuyer
              as_user_id: "${order_id}"
              payload: { limit: 10, offset: 0 }
              captures: { err_wrong_entity_family: "$.data.error_id" }
            - call: "POST /dispute-cases"
              as: ForeignBuyer
              as_user_id: "11111111-0000-4000-8000-0000000000d1"
              payload: { export_order_id: "11111111-0000-4000-8000-0000000000d2", dispute_type: "QUALITY", claimed_amount_usd: 100.00 }
              captures: { err_identity_before_body: "$.data.error_id" }
            - call: "GET /export-orders"
              as: ForeignBuyer
              as_user_id: "${buyer_id}"
              payload: { limit: 10, offset: 0 }
              captures: { visible_total: "$.data[0].id" }
          assert:
            - "err_unknown_uuid == \"ERR_BUYER_IDENTITY_NOT_FOUND\" with HTTP 403, NOT ERR_BUYER_SCOPE_VIOLATION"
            - "err_wrong_entity_family == \"ERR_BUYER_IDENTITY_NOT_FOUND\": the ExportOrder id is a real UUID but not a ForeignBuyer primary key"
            - "err_identity_before_body == \"ERR_BUYER_IDENTITY_NOT_FOUND\", NOT ERR_ORDER_NOT_FOUND — priority 4 precedes priority 6"
            - "the final read returns HTTP 200 with total_count == 1 and visible_total == the created order id, confirming the identical header value is authoritative once it names a real buyer"
      - name: corner_one_buyer_cannot_reach_another_buyers_finding_or_order_forbidden
        claim_type: peer_role_isolation
        grounds:
          - validations.priority_7
          - errors[ERR_BUYER_SCOPE_VIOLATION]
          - rbac.ForeignBuyer
          - endpoints.POST /discrepancy-findings/{finding_id}/waiver
        distinguishing_aspect: "Priority 7 resolves ownership by walking the target resource back to its ExportOrder.buyer_id, which for a DiscrepancyFinding means finding to LetterOfCredit to ExportOrder — two hops. The intruding buyer is a real ForeignBuyer row, so priority 4 passes and only the scope comparison can reject; the same buyer's collection reads silently narrow instead of erroring."
        test_recipe:
          setup:
            - "buyer A owns order A with a credit under review carrying one MINOR TERMS finding"
            - "buyer B is a live ForeignBuyer row with its own unrelated order"
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Alexandria Textiles SAE", country_code: "EG", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              captures: { buyer_a: "$.data.id" }
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Casablanca Fibre SARL", country_code: "MA", credit_rating: "BB", sanctions_tier: "NONE", restricted_party_flag: false }
              captures: { buyer_b: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { buyer_id: "${buyer_a}", incoterm: "FOB", incoterm_named_place: "Port of Savannah", origin_country_code: "US", destination_country_code: "EG", destination_zone: "ZONE_3", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              captures: { order_a: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { buyer_id: "${buyer_b}", incoterm: "FOB", incoterm_named_place: "Port of Savannah", origin_country_code: "US", destination_country_code: "MA", destination_zone: "ZONE_3", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              captures: { order_b: "$.data.id" }
            - call: "POST /export-orders/${order_a}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { line_no: 1, goods_description: "cotton yarn", hs_code: "520512", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, net_weight_kg: 1000.000, gross_weight_kg: 1200.000, package_count: 10 }
              captures: { line_a: "$.data.id" }
            - call: "POST /letters-of-credit"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { export_order_id: "${order_a}", lc_number: "LC-CORNER-8001", issuing_bank_swift: "NBEGEGCX", amount_usd: 25000.00, tolerance_pct: 5.00, availability: "SIGHT", usance_days: 0, expiry_date: "2026-12-31T00:00:00Z", latest_shipment_date: "2026-09-20T00:00:00Z", presentation_period_days: 21, required_document_types: ["COMMERCIAL_INVOICE"] }
              captures: { lc_a: "$.data.id", lc_a_v: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_a}/reviews"
