            - "LicenseApplication.${app_rn}.fee_balance_cents == 0 and LicenseApplication.${app_pt}.fee_balance_cents == 0"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: permit_revocation_restores_fee_balance_cents_exactly
        grounds:
          - state_machines.TemporaryPermit.ACTIVE_to_REVOKED
          - calculations.application_fee_balance
          - entities.FeeLedgerEntry.fields.amount_cents
          - entities.TemporaryPermit.fields.expires_at
        distinguishing_aspect: |
          Revocation compensates rather than mutates: the original PERMIT_FEE row is left untouched and a
          PERMIT_FEE_REVERSAL of exactly its negation is appended, so fee_balance_cents returns to the
          pre-issuance 0 and the whole append-only ledger sums to 0 across five rows. A mutate-in-place
          or delete-the-row implementation reaches the same balance with the wrong ledger, and a
          rounding-based reversal leaves a residue.
        test_recipe:
          setup:
            - "Profession RN with permit_fee_cents 6000; non-military TX applicant with no disciplinary history."
            - "ENDORSEMENT application submitted (gross 48000, statutory_waiver_pct 0.00) and paid in full, so fee_balance_cents is 0 before issuance."
            - "A CredentialEvaluation exists so the application is UNDER_REVIEW."
            - "One ACTIVE permit effective 2026-08-01 with expires_at 2026-10-30, whose PERMIT_FEE of 6000 leaves fee_balance_cents 6000."
            - "Logical clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof_rn: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Greta Lund", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-70111", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cred: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap}", profession_id: "${prof_rn}", primary_credential_id: "${cred}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
            - call: "POST /licensure/applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap}"
            - call: "POST /licensure/applications/${app}/payments"
              payload: { amount_cents: 48000 }
              as: Applicant
              as_user_id: "${ap}"
            - call: "POST /licensure/credential-evaluations"
              payload: { application_id: "${app}", credential_id: "${cred}" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { ev: $.data.id }
            - call: "GET /licensure/applications/${app}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { app_v0: $.data.version }
            - call: "POST /licensure/temporary-permits"
              payload: { application_id: "${app}", effective_at: "2026-08-01T00:00:00Z", expected_application_version: "${app_v0}" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { permit: $.data.id }
          trigger:
            - call: "POST /licensure/temporary-permits/${permit}/revoke"
              payload: { reason_code: "APPLICANT_WITHDREW" }
              as: BoardDeputy
              as_user_id: "dep_1"
          assert:
            - "TemporaryPermit.${permit}.status == REVOKED and revocation_reason_code == APPLICANT_WITHDREW"
            - "TemporaryPermit.${permit}.revoked_at == 2026-08-01T00:00:00Z and expires_at == 2026-08-01T00:00:00Z (pulled back from 2026-10-30T00:00:00Z)"
            - "LicenseApplication.${app}.fee_balance_cents == 0, exactly the pre-issuance value"
            - "GET /licensure/applications/${app}/fee-ledger-entries returns exactly 5 entries in created_at ASC: [0] ASSESSMENT +48000, [1] WAIVER_CREDIT 0, [2] PAYMENT -48000, [3] PERMIT_FEE +6000, [4] PERMIT_FEE_REVERSAL -6000"
            - "The PERMIT_FEE entry at index 3 still has amount_cents == 6000 (it was not mutated or removed)"
            - "The sum of amount_cents over all 5 entries == 0"
            - "LicenseApplication.${app}.status == UNDER_REVIEW (revocation does not change the application state)"

      - name: credit_award_revocation_conserves_requirement_hours_total
        grounds:
          - state_machines.CreditAward.AWARDED_to_REVOKED
          - calculations.military_credit_hours
          - entities.LicenseApplication.fields.requirement_hours_satisfied
          - entities.LicenseApplication.fields.requirement_hours_remaining
          - entities.MilitaryTrainingRecord.fields.documented_hours
        distinguishing_aspect: |
          The invariant requirement_hours_satisfied + requirement_hours_remaining == 240.0 must hold at
          every observation, and revoking the second award must return both fields to their exact
          one-award values (99.8 / 140.2) rather than to a recomputed approximation. The per-record
          rounding is what makes the drift visible: 133 h and 137 h of MOS_TRAINING round to 99.8 and
          102.8 for a total of 202.6, whereas rounding the 202.5 sum once yields 202.5 and a 0.1-hour
          residue that survives the revocation.
        test_recipe:
          setup:
            - "Profession RN with requirement_hours_total 240.0."
            - "Applicant with military_status VETERAN, so the ENDORSEMENT submission takes statutory_waiver_pct 0.50 on a 48000 gross and leaves fee_balance_cents 24000."
            - "Two verified MOS_TRAINING records with documented_hours 133 and 137 (CONVERSION_FACTOR 0.75)."
            - "The application is SUBMITTED and both CreditAwards are AWARDED, so requirement_hours_satisfied reads 202.6 and requirement_hours_remaining 37.4 immediately after setup_api_calls; a sum-then-round implementation shows 202.5 / 37.5 here."
            - "Logical clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof_rn: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Sana Qureshi", state_code: "TX", residency_months: 24, military_status: "VETERAN" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-70121", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cred: $.data.id }
            - call: "POST /licensure/applicants/${ap}/military-training-records"
              payload: { category: "MOS_TRAINING", documented_hours: 133, source_document: "JST-RN-133", verified: true }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { tr1: $.data.id }
            - call: "POST /licensure/applicants/${ap}/military-training-records"
              payload: { category: "MOS_TRAINING", documented_hours: 137, source_document: "JST-RN-137", verified: true }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { tr2: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap}", profession_id: "${prof_rn}", primary_credential_id: "${cred}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
            - call: "POST /licensure/applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap}"
            - call: "POST /licensure/credit-awards"
              payload: { application_id: "${app}", training_record_id: "${tr1}" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { aw1: $.data.id }
            - call: "POST /licensure/credit-awards"
              payload: { application_id: "${app}", training_record_id: "${tr2}" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { aw2: $.data.id }
          trigger:
            - call: "POST /licensure/credit-awards/${aw2}/revoke"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "anl_1"
          assert:
            - "CreditAward.${aw1}.awarded_hours == 99.8 and CreditAward.${aw2}.awarded_hours == 102.8"
            - "Immediately after setup_api_calls (before the trigger) LicenseApplication.${app}.requirement_hours_satisfied == 202.6 and requirement_hours_remaining == 37.4, NOT 202.5 / 37.5"
            - "CreditAward.${aw2}.status == REVOKED and revoked_at == 2026-08-01T00:00:00Z"
            - "CreditAward.${aw1}.status == AWARDED and awarded_hours == 99.8 (untouched by the revocation)"
            - "After the trigger LicenseApplication.${app}.requirement_hours_satisfied == 99.8 and requirement_hours_remaining == 140.2"
            - "requirement_hours_satisfied + requirement_hours_remaining == 240.0 both before and after the trigger"
            - "MilitaryTrainingRecord.${tr2}.documented_hours == 137 and verified == true (the record itself is not altered)"
            - "LicenseApplication.${app}.fee_balance_cents == 24000, unchanged by the revocation"
