            - "After submit-underwriting the application carries silent_second_amount_cents == 1950000 and status == UNDERWRITING"
            - "Program read while the application is UNDERWRITING: subsidy_committed_cents == 0 and subsidy_available_cents == 5000000 — a structured but unapproved silent second is outside the input set"
            - "Approval: HTTP 200 and status == APPROVED — it does NOT auto-continue to CLEARED_TO_CLOSE, because partnership_readiness is NOT_READY"
            - "Program read after approval: subsidy_committed_cents == 1950000, subsidy_disbursed_cents == 0, subsidy_available_cents == 3050000"
            - "program_posture is still OPEN, since 3050000 is greater than 0 and the program is not SUSPENDED"
            - "The invariant holds at all three observations: 5000000 == subsidy_available_cents + subsidy_committed_cents + subsidy_disbursed_cents"

