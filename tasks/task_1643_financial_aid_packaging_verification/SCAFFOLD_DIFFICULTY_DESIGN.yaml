  # =====================================================================
  # Rule 4 — transitive_cascade from different triggers, depths >=3 and >=2.
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: package_decline_pool_release_exhaustion_reversal_cascade
        grounds:
          - state_machines.AwardPackage.NOTIFIED_to_DECLINED
          - state_machines.FundType.EXHAUSTED_to_ACTIVE
          - entities.FundType.fields.pool_reserved_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by student decline: (1) AwardPackage
          NOTIFIED->DECLINED flips each OFFERED AwardLine to DECLINED; (2) each
          line flip releases offered_cents from FundType.pool_reserved_cents;
          (3) the pool drop below budget fires FundType EXHAUSTED->ACTIVE; link
          2 is caused by link 1's line mutation, and link 3 is caused by link
          2's pool_reserved_cents mutation — not by the decline directly.
        test_recipe:
          setup:
            - "AidYear OPEN; SEOG fund ACTIVE with pool_budget 350000, cap 200000, rank 1 (only fund besides PELL rank 0? — use SEOG only, pool 350000)"
            - "Student A packaged: SEOG offer 200000 (reserved 200000). Student B packaged: SEOG offer 150000 (pool headroom exhausted: min(200000, 350000-200000)=150000, reserved 350000 -> fund EXHAUSTED)"
            - "Both packages NOTIFIED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
