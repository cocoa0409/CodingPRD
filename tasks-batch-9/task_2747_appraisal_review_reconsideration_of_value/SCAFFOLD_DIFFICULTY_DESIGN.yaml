        grounds:
          - state_machines.Appraisal.VALUE_CONTESTED_to_VALUE_REVISED
          - state_machines.LoanFile.SUSPENDED_to_CONDITIONALLY_APPROVED
          - state_machines.LoanFile.VALUE_CONTESTED_to_VALUE_REVISED
          - calculations.ltv_and_decision_impact
          - entities.ValueRevision.fields.delta_cents
          - entities.Appraisal.fields.current_value_cents
          - entities.LoanFile.fields.effective_value_cents
          - entities.LoanFile.fields.decision_impact
          - validations[priority=40]
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /rov-requests/{id}/appraiser-response: the new ValueRevision
          row causes Appraisal.current_value_cents to move, which causes LoanFile.effective_value_cents
          and ltv_bps to be recomputed, which causes decision_impact to leave DENIAL_RECOMMENDED, which
