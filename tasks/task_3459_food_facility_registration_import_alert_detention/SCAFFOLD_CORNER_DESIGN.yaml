        distinguishing_aspect: "A prior notice filed while the facility was REGISTERED stays CONFIRMED, but entry creation after the biennial expiry sweep flips the facility to EXPIRED fails 422 ERR_REGISTRATION_NOT_ACTIVE — the gate evaluates facility state at entry-creation time."
