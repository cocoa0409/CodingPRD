        distinguishing_aspect: "Depth-3 cascade originating at Invoice settlement: hop1 Invoice computes final_fee & Settlement, hop2 that mutation recomputes Client.reserve_balance_cents/funded_advance_outstanding_cents, hop3 the Client balance change appends LedgerEntry REBATE_PAID/RESERVE_RELEASED rows with reserve_balance_after snapshots. Each hop is caused by the prior hop."
