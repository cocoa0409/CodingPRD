      - claim_type: Temporal validation
        name: notice_rolling_window_and_activation_timing_enforced
        grounds:
          - validations[priority=20]
          - validations[priority=22]
          - validations[priority=5]
          - state_machines.PriceChangeNotice.PENDING_to_ACKNOWLEDGED
          - state_machines.PriceChangeNotice.ACKNOWLEDGED_to_EFFECTIVE
          - state_machines.PriceChangeNotice.PENDING_to_WITHDRAWN
          - errors.ERR_NOTICE_WINDOW_CONFLICT
          - errors.ERR_NOTICE_NOT_YET_EFFECTIVE
          - errors.ERR_NOTICE_INVALID_STATE
        distinguishing_aspect: |
          The 30-day rolling slot is per product and is released by withdrawal: a second
          P-A notice 25 days from the first is refused, the identical date on P-B is
          accepted, and after withdrawing the P-B notice another one two days later is
          accepted; activation before effective_at fails with ERR_NOTICE_NOT_YET_EFFECTIVE
          while activation from PENDING fails with ERR_NOTICE_INVALID_STATE.
        test_recipe:
          setup:
            - "An ACTIVE contract with a PROTEIN tier covering both products; notice_period_days is the 30-day default."
            - "Products P-A and P-B, both PROTEIN with last_cost 4000 and not market indexed."
            - "One PENDING notice N1 on P-A: cost_basis LAST_COST, effective_at 2026-09-15, proposed_cost_cents 4400."
            - "The clock stays at 2026-08-01T00:00:00Z until the activation attempts."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
