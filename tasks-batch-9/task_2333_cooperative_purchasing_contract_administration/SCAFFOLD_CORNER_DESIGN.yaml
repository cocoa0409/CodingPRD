      - name: state_law_rules_are_immutable_configuration_with_no_version_and_no_write_surface
        claim_type: Immutability
        grounds:
          - entities.StateLawRule
          - endpoints.GET_/coop/state-law-rules/{id}
          - validations.priority_57
          - errors.ERR_DUPLICATE_STATE_LAW_RULE
        distinguishing_aspect: >-
          StateLawRule declares common_fields: False, so its read body carries no version field and SS1.5 exposes no update or delete route for it; the only way a state row could change is a second create, and that is refused with ERR_DUPLICATE_STATE_LAW_RULE.
        test_recipe:
          setup:
            - "A StateLawRule row exists for TX with min_notice_days 14."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "TX", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 14, requires_lead_agency_in_state: false, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { rule_tx_id: $.data.id }
          trigger:
            - call: "GET /coop/state-law-rules/${rule_tx_id}"
              payload: {}
              as: MemberAuditor
              as_user_id: "aud-member-01"
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "TX", piggyback_doctrine: "RECIPROCITY_LIBERAL", min_notice_days: 30, requires_lead_agency_in_state: true, allows_nonprofit_participation: false, max_contract_term_months: 36, requires_local_solicitation_waiver: true, reciprocity_state_codes: ["OK"] }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
              captures: { e_dup: $.data.error_id }
          assert:
            - "the read body contains no version field, because StateLawRule declares common_fields False"
            - "the read body contains no updated_at-driven optimistic-concurrency surface"
            - "SS1.5 declares no PUT, PATCH or DELETE route under /coop/state-law-rules/{id}"
            - "the second create returns error_id == ERR_DUPLICATE_STATE_LAW_RULE with http_status == 409"
            - "StateLawRule.${rule_tx_id}.min_notice_days == 14 is unchanged by the refused create"
            - "StateLawRule.${rule_tx_id}.piggyback_doctrine == STATUTORY_STRICT"
