              as: ScholarshipCoordinator
              captures: { s_id: $.data.id, v_1: $.data.version, created: $.data.created_at, updated_1: $.data.updated_at }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "PATCH /api/students/${s_id}"
              payload: { tags: ["VETERAN"] }
              as: ScholarshipCoordinator
              captures: { v_2: $.data.version, updated_2: $.data.updated_at, created_2: $.data.created_at }
          assert:
            - "v_1 == 1 and updated_1 == created == '2026-08-01T00:00:00Z'"
            - "v_2 == 2 and updated_2 == '2026-08-03T00:00:00Z' while created_2 == created (created_at is immutable)"

  - section: consistency_model
    instances:
      - name: immediate_consistency_on_action_response
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model", "state_machines.Award"]
        distinguishing_aspect: "Immediate consistency: the accept call's own response already shows offer_status ACCEPTED, funding_status ENCUMBERED, and accepted_at == the logical clock — no re-read or settling delay required."
        test_recipe:
          setup: ["OFFERED award 500000 at default clock"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Imm Ed", email: "im@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Im Donor", contact_email: "im@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Im Fund", committed_cents: 5000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Im Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "NEED", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 1, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_id}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/submit"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles"
              payload: { program_id: "${p_id}", label: "IMC", starts_on: "2026-09-16", ends_on: "2026-10-15", quorum_count: 1, selection_quota: 1 }
              as: ScholarshipCoordinator
              captures: { c_id: $.data.id }
            - call: "POST /api/review-cycles/${c_id}/open-scoring"
              as: ScholarshipCoordinator
            - call: "POST /api/review-scores"
              payload: { cycle_id: "${c_id}", application_id: "${app_id}", academic_score: 90, essay_score: 90, need_score: 90 }
              as: CommitteeReviewer
              as_user_id: "rev_1"
              captures: { sc_id: $.data.id }
            - call: "POST /api/review-scores/${sc_id}/submit"
              as: CommitteeReviewer
              as_user_id: "rev_1"
            - call: "POST /api/review-cycles/${c_id}/open-deliberation"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles/${c_id}/finalize"
              as: ScholarshipCoordinator
            - call: "POST /api/awards"
              payload: { application_id: "${app_id}", student_id: "${s_id}", amount_cents: 500000 }
              as: ScholarshipCoordinator
              captures: { aw_id: $.data.id }
          trigger:
            - call: "POST /api/awards/${aw_id}/accept"
              as: Student
              as_user_id: "${s_id}"
              captures: { offer: $.data.offer_status, funding: $.data.funding_status, acc_at: $.data.accepted_at }
          assert:
            - "The accept response itself carries offer == ACCEPTED, funding == ENCUMBERED, acc_at == '2026-08-01T00:00:00Z' (both parallel dimensions updated in the same response)"

