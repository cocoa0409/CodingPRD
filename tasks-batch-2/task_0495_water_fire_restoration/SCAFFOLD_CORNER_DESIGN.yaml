        grounds:
          - validations[priority=9]
          - errors[ERR_EQUIPMENT_NOT_AVAILABLE]
        distinguishing_aspect: "Placing a unit whose chamber belongs to a different job (chamber/job mismatch) returns ERR_EQUIPMENT_NOT_AVAILABLE (409)."
        test_recipe:
          setup: ["Two WATER jobs J1, J2; chamber C2 on J2; an AVAILABLE air mover; placement attempted with job_id=J1 but chamber_id=C2."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC20", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "T", certification: "ASD" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-C20", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "J1", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { j1: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "J2", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { j2: $.data.id }
            - call: "POST /restoration/jobs/${j1}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${j2}", room_label: "C2", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /restoration/placements"
              payload: { job_id: "${j1}", chamber_id: "${c2}", equipment_unit_id: "${am}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_EQUIPMENT_NOT_AVAILABLE"

