              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "ORDINARY", eligible_amount: 100000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_ordinary: $.data.error_id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 100000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SECTION_1231_YEAR_END", pass_through_year_end: "2026-12-31T00:00:00Z" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_basis: $.data.error_id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "SECTION_1231_NET", eligible_amount: 100000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SECTION_1231_YEAR_END", pass_through_year_end: "2026-12-31T00:00:00Z" }
              as: Investor
