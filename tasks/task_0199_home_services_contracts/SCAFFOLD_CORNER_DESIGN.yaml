  - section: rbac
    instances:
      - name: dispatcher_cannot_activate_membership_unauthorized
        claim_type: Exclusive op denial
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Dispatcher calling POST /memberships/{id}/activate (ContractAdmin-exclusive) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A PENDING_ACTIVATION membership"]
          setup_api_calls:
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
