            - "${after_staffing} == UNDERSTAFFED — the slot's derived coverage is restated from the assignment table"
            - "${v_commit} == 0 and ${v_hours} == 0"
            - "PlaybackSlot.${slot_id}.status is still SCHEDULED — releasing crew does not cancel the booking"

