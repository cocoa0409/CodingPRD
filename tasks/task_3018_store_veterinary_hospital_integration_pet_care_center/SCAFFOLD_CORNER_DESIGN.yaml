          - response_envelope.pagination_fields
          - endpoints.GET_/stores
        distinguishing_aspect: "The pagination contract holds on the same collection endpoint the curb denies: an unauthenticated list call fails with the auth error while an authenticated call returns the four pagination fields with has_more computed against total_count."
        test_recipe:
