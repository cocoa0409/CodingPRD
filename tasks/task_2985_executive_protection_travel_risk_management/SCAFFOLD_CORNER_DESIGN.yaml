      - name: pagination_arguments_outside_their_declared_bounds_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_PAGINATION
          - validations.priority_4
          - endpoints.GET_/exec-protection/trips
        distinguishing_aspect: |
          The pagination rule sits at priority 4, above every referential and business rule, so it
          must fire on a list read that would otherwise have returned an empty page. Both edges of
          the declared 1..100 window are legal and only the values just outside it are rejected,
          which separates a bounds check from an off-by-one on the same check.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one manager staff row. No trips exist, so every accepted read returns an empty page"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
          trigger:
            - call: "GET /exec-protection/trips"
              payload: { limit: 0 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { e1: $.data.error_id }
            - call: "GET /exec-protection/trips"
              payload: { limit: 101 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { e2: $.data.error_id }
            - call: "GET /exec-protection/trips"
              payload: { offset: -1 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { e3: $.data.error_id }
            - call: "GET /exec-protection/trips"
              payload: { limit: 1, offset: 0 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
            - call: "GET /exec-protection/trips"
              payload: { limit: 100 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
          assert:
            - "limit 0 returns HTTP 400 with ${e1} == ERR_INVALID_PAGINATION"
            - "limit 101 returns HTTP 400 with ${e2} == ERR_INVALID_PAGINATION"
            - "offset -1 returns HTTP 400 with ${e3} == ERR_INVALID_PAGINATION"
            - "limit 1 with offset 0 returns HTTP 200 and limit 100 returns HTTP 200: both bounds of 1..100 are inclusive"
            - "each accepted read carries the declared list envelope with total_count == 0 and has_more == false"

