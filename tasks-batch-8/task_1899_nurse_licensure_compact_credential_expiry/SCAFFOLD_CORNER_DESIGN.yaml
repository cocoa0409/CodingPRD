            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-IP2", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2026-08-10" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /credentialing/_ops/expiry-sweep", payload: {}, as: SystemOperator, as_user_id: "ops-1", captures: { s1: "$.data.licenses_expired" } }
            - { call: "POST /credentialing/_ops/expiry-sweep", payload: {}, as: SystemOperator, as_user_id: "ops-1", captures: { s2: "$.data.licenses_expired", s2c: "$.data.certifications_expired", s2k: "$.data.completions_lapsed", s2p: "$.data.postures_changed", s2s: "$.data.shifts_auto_cancelled", s2v: "$.data.packets_voided", s2e: "$.data.privilege_evaluations_appended" } }
          assert:
            - "First sweep: licenses_expired == 1 (license EXPIRED)"
            - "Second sweep: licenses_expired == 0, certifications_expired == 0, completions_lapsed == 0, postures_changed == 0, shifts_auto_cancelled == 0, packets_voided == 0, privilege_evaluations_appended == 0"

  # ===========================================================================
  - section: errors
