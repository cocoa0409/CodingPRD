            - call: "GET /agents/${a2}/portfolio-summary"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m105}/activate"
              payload: {}
              as: IsoAdmin
            - call: "GET /agents/${a1}/portfolio-summary"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m102}/attrite"
              payload: { attrition_date: "2026-07-25" }
              as: IsoAdmin
            - call: "GET /agents/${a1}/portfolio-summary"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m101}/reactivate"
              payload: { reactivation_date: "2026-07-28" }
              as: IsoAdmin
            - call: "POST /merchants/${m102}/reactivate"
              payload: { reactivation_date: "2026-07-28" }
              as: IsoAdmin
            - call: "GET /agents/${a1}/portfolio-summary"
              payload: {}
              as: IsoAdmin
          assert:
            - "after one attrition each: A1 reports portfolio_attrition_bps 2500 with residual_hold true (1 of 4 non-PENDING), while A2 reports 2000 with residual_hold false (1 of 5) — the comparison is >= and 2500 is inside it"
            - "A1's portfolio_merchant_count is 5 at that point but the bps denominator is 4 — the PENDING MID-A105 is excluded from BOTH numerator and denominator, and A1's active_merchant_count is 3 with attrited_merchant_count 1"
            - "activating MID-A105 changes nothing about the attrition itself yet recomputes the ratio to 1 of 5 == 2000 bps and clears residual_hold to false"
            - "attriting MID-A102 gives 2 of 5 == 4000 bps and sets residual_hold true again — the trigger is re-evaluated, not latched"
            - "reactivating both attrited merchants gives 0 of 5 == 0 bps with residual_hold false, active_merchant_count 5 and attrited_merchant_count 0 — the reset is complete"
            - "no rounding is needed at any step here: 10000*1/4 == 2500 and 10000*1/5 == 2000 are exact, so an implementation that truncates instead of round_half_up still must produce these values"

      - name: layer_cascading_side_effects_end_to_end_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / batch_post_cascade_four_links_to_agent_kpi
          rationale: "That §1.8 instance verifies the full four-link chain (line -> MerchantProfitability -> ResidualAllocation -> AgentStatement -> Agent KPI) from a single post with literal values at every link, which is exactly the end-to-end claim for this layer."

      - name: layer_cascading_side_effects_ordering_sensitivity
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: combinatorial_formula / statement_issue_order_trueup_feeds_recoupment_tier
          rationale: "That §1.8 instance shows the cascade's ordering sensitivity directly: the true-up must be folded into gross_after_trueup_cents before the advance tier is selected, and reversing the order changes the recouped amount."

      - name: layer_dual_variant_both_variants_diverge
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.residual_normalization.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / normalize_variant_divergence_net_vs_gross
          rationale: "That §1.8 instance runs identical residual lines through NET_REVENUE_SPLIT and GROSS_REVENUE_SPLIT programs and asserts both results plus the delta, covering the divergence claim for this layer."

      - name: layer_dual_variant_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.advance_recoupment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / advance_recoupment_variant_divergence_percent_vs_straight_line
          rationale: "That §1.8 instance funds the same principal under PERCENT_OF_RESIDUAL and STRAIGHT_LINE_AMORTIZATION and asserts both recoupment amounts and the resulting outstanding_cents delta, which is the variant-switch claim."

  - section: consistency_model
    instances:

      - name: post_cascade_is_immediately_visible_everywhere
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model (immediate)
          - endpoints[POST /residual-batches/{id}/post].side_effects
        distinguishing_aspect: "consistency_model is `immediate`, so there is no lag anywhere: the post response itself already carries the batch's rolled-up totals, and the very next reads of profitability, allocations, statements and the agent KPI block return final values with no intervening write, no re-read loop and no recompute endpoint. Every derived field is computed transactionally with the post, not on a later read of the parent."
        test_recipe:
          setup: ["CORNER-BASE: program P1 (NET_REVENUE_SPLIT, buy rate 45 bps + 6 cents, assessments 13 bps, NO_MINIMUM), agent A1 (split 0.50, vesting_start 2024-01-15 -> vested_pct 50 at the default clock), merchant M1 ACTIVE with equipment_lease_monthly_cents 1000, and one normalized 2026-07 line."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 1000, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:im-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 20000, assessments_cents: 1300, gross_income_cents: 40000 }
              as: ResidualAnalyst
              captures: { l1: $.data.id }
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
          trigger:
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /merchant-profitability"
              payload: { residual_batch_id: "${b1}" }
              as: ResidualController
            - call: "GET /residual-allocations"
              payload: { period_month: "2026-07" }
              as: ResidualController
            - call: "GET /agent-statements"
              payload: { agent_id: "${a1}", period_month: "2026-07" }
              as: ResidualController
              captures: { st: "$.data[0].id" }
            - call: "GET /agents/${a1}/portfolio-summary"
              payload: {}
              as: ResidualController
            - call: "GET /residual-batches/${b1}"
              payload: {}
              as: ResidualController
          assert:
            - "the post RESPONSE BODY itself already carries state POSTED, posted_at 2026-08-01T00:00:00Z, line_count 1, gross_volume_cents 1000000, total_normalized_net_revenue_cents 13600 and iso_retained_cents 6300 — no follow-up read is needed to see them"
            - "the immediately following GET /merchant-profitability?residual_batch_id=${b1} returns exactly one row with normalized_net_revenue_cents 13600, chargeback_cost_cents 0, agent_chargeable_chargeback_cents 0, equipment_cost_cents 1000, profit_cents 12600, agent_basis_cents 12600, allocated_total_cents 6300 and iso_retained_cents 6300"
            - "GET /residual-allocations?period_month=2026-07 returns total_count 1 with allocation_type DIRECT_SPLIT, tier_level 0, applied_pct 0.50, basis_cents 12600, gross_allocation_cents 6300, vesting_withheld_cents 0 and statement_id ${st}"
            - "GET /agent-statements?agent_id=${a1}&period_month=2026-07 returns exactly one DRAFT statement with direct_residual_cents 6300, override_residual_cents 0, minimum_true_up_cents 0, gross_after_trueup_cents 6300, advance_recoupment_cents 0, adjustment_cents 0, opening_deficit_cents 0 and net_payable_cents 6300"
            - "GET /agents/${a1}/portfolio-summary already reports trailing_residual_cents 6300 with portfolio_merchant_count 1, active_merchant_count 1, portfolio_attrition_bps 0, residual_hold false and vested_pct 50 — the KPI at the end of the four-link chain is current in the same instant"
            - "re-reading GET /residual-batches/${b1} returns byte-identical totals to the post response — nothing settles or drifts after the fact"
