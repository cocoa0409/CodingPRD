      # --- Errors already exercised end-to-end by SCAFFOLD_DIFFICULTY_DESIGN.yaml -----
      - name: curfew_violation_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CURFEW_VIOLATION
          - validations.priority_30
        distinguishing_aspect: "ERR_CURFEW_VIOLATION is raised on send and on reschedule when load_out_end_utc passes the edition curfew instant, and it outranks the stage-slot conflict it coincides with."
        excluded_because:
          difficulty_instance: curfew_safety_outranks_stage_slot_conflict
          rationale: "That §1.8 instance already triggers ERR_CURFEW_VIOLATION at the exact curfew instant, one minute past it, and in the presence of a simultaneous stage-slot overlap, which is strictly more than a triggerability probe would establish."

      - name: talent_budget_exceeded_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TALENT_BUDGET_EXCEEDED
          - validations.priority_46
        distinguishing_aspect: "ERR_TALENT_BUDGET_EXCEEDED is raised on send, revise and accept when the recomputed committed guarantee total would pass the edition cap."
        excluded_because:
          difficulty_instance: talent_budget_cap_exact_equality_then_one_cent_over
          rationale: "That §1.8 instance triggers the code from the exact-equality boundary and one cent beyond it on the same fixture, which subsumes a triggerability probe."

      - name: negotiation_round_limit_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NEGOTIATION_ROUND_LIMIT
          - validations.priority_38
        distinguishing_aspect: "ERR_NEGOTIATION_ROUND_LIMIT is raised on the counter or revise that would become the fourth negotiation round."
        excluded_because:
          difficulty_instance: offer_negotiation_cycle_exhausts_round_cap
          rationale: "That §1.8 instance walks the counter/revise cycle to exhaustion and captures the 409 on the fourth round, so a separate probe would duplicate it exactly."

      - name: day_slot_capacity_exceeded_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DAY_SLOT_CAPACITY_EXCEEDED
          - validations.priority_42
        distinguishing_aspect: "ERR_DAY_SLOT_CAPACITY_EXCEEDED is raised when the per-day hold count across every stage of the edition would pass max_shows_per_day."
        excluded_because:
          difficulty_instance: edition_day_aggregate_capacity_across_stages
          rationale: "That §1.8 instance already fills the day across two stages and captures the 409 on the third send while proving each show was individually schedulable."

      - name: stage_slot_conflict_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STAGE_SLOT_CONFLICT
          - validations.priority_39
        distinguishing_aspect: "ERR_STAGE_SLOT_CONFLICT is raised on send and reschedule when two occupations on one stage overlap once the changeover buffer is added to each side."
        excluded_because:
          difficulty_instance: stage_buffered_minute_overlap_gap_exactly_at_buffer
          rationale: "That §1.8 instance triggers the code at one minute inside the buffer and admits the gap of exactly changeover_buffer_minutes, covering the code and its boundary together."

      - name: radius_clause_conflict_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RADIUS_CLAUSE_CONFLICT
          - validations.priority_40
        distinguishing_aspect: "ERR_RADIUS_CLAUSE_CONFLICT is raised when a live unwaived offer for the same artist holds a date inside the asymmetric radius window."
        excluded_because:
          difficulty_instance: artist_radius_closed_asymmetric_day_window
          rationale: "That §1.8 instance triggers the code on both asymmetric edges and one day outside each, which is strictly stronger than a triggerability probe; the waiver escape is separately covered by the §1.9 validations instance radius_waiver_granted_disarms_the_radius_clause."

      - name: genre_adjacency_conflict_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_GENRE_ADJACENCY_CONFLICT
          - validations.priority_41
        distinguishing_aspect: "ERR_GENRE_ADJACENCY_CONFLICT is raised when a same-genre show sits within GENRE_GAP_DAYS of the candidate date on the same stage."
        excluded_because:
          difficulty_instance: genre_adjacency_constraint_outranks_talent_budget
          rationale: "That §1.8 instance triggers the code on the previous, same and next day and proves it pre-empts the budget check, so a bare probe adds nothing."

