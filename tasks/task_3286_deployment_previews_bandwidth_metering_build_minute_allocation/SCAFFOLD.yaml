  - method: GET
    path: "/v1/env-vars/{id}"
    description: "Get env var; secret value masked to null"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: []
    output: EnvironmentVariable
    side_effects: []

  - method: PATCH
    path: "/v1/env-vars/{id}"
    description: "Update env var value/scopes"
    roles: [TeamOwner, Developer]
    code: 200
    input: ["value?", "scopes?", "is_secret?"]
    output: EnvironmentVariable
    side_effects: ["Scope overlap re-validated; increments EnvironmentVariable.version by 1"]

  - method: DELETE
    path: "/v1/env-vars/{id}"
    description: "Delete env var"
    roles: [TeamOwner, Developer]
    code: 204
    input: []
    output: null
    side_effects: []

  # --- Domains ---
  - method: POST
    path: "/v1/projects/{id}/domains"
    description: "Assign a domain to a project"
    roles: [TeamOwner, Developer]
