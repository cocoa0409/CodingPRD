    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: ["wind_farm_id?", "state?", "limit?", "offset?"]
    output: WeatherWindow[]
    side_effects: []
  - method: POST
    path: "/wind-ops/weather-windows/{id}/confirm"
    description: "Confirm a forecast window so it may be reserved by a work order or counted as a crane standby day."
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: WeatherWindow
    side_effects:
      - "moves state from FORECAST to CONFIRMED"
      - "makes the window eligible as a crane standby day when its forecast_wind_speed_ms exceeds a mobilization's max_lift_wind_speed_ms"

  - method: POST
    path: "/wind-ops/work-orders"
    description: "Raise a maintenance work order against a turbine. A FAULT_DISPATCH order must name a fault_event_id in state DISPATCH_REQUIRED; a BLADE_REPAIR order must name a blade_damage_id in state PRIORITIZED; a SCHEDULED_SERVICE order is gated by the scheduled_service_due calculation; a MAJOR_COMPONENT order may name a parent_work_order_id."
    roles: [MaintenancePlanner, ReliabilityEngineer]
    code: 201
    input: [turbine_id, work_type, required_certification, estimated_hours, "fault_event_id?", "blade_damage_id?", "parent_work_order_id?"]
    output: WorkOrder
    side_effects:
      - "sets state to DRAFT, revision_round to 0, priority_score to 0 and labor_cost_cents to 0"
      - "moves the named FaultEvent from DISPATCH_REQUIRED to DISPATCHED when work_type is FAULT_DISPATCH"
      - "rejected with ERR_SERVICE_NOT_DUE when work_type is SCHEDULED_SERVICE and the turbine's operating_hours is below service_due_operating_hours minus PRE_SERVICE_WINDOW_HOURS"
  - method: GET
    path: "/wind-ops/work-orders/{id}"
    description: "Read one work order including its priority score and labour cost."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/wind-ops/work-orders"
    description: "List work orders filtered by any of their foreign keys or by state. Reverse-reachability channel for WorkOrder.turbine_id, WorkOrder.fault_event_id, WorkOrder.blade_damage_id, WorkOrder.parent_work_order_id, WorkOrder.crew_id and WorkOrder.weather_window_id."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: ["turbine_id?", "fault_event_id?", "blade_damage_id?", "parent_work_order_id?", "crew_id?", "weather_window_id?", "state?", "work_type?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/wind-ops/work-orders/{id}/submit"
    description: "Submit a DRAFT or REVISION_REQUESTED work order for planning. Records the submitting user for segregation of duties and scores the order."
    roles: [MaintenancePlanner, ReliabilityEngineer]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "moves state to SUBMITTED"
      - "sets submitted_by_user_id to the acting X-User-ID, overwriting any previous value on a resubmission"
      - "computes priority_score per the work_order_priority_score calculation"
  - method: POST
    path: "/wind-ops/work-orders/{id}/request-revision"
    description: "Send a SUBMITTED or SCHEDULED work order back for revision. Bounded by MAX_REVISION_ROUNDS."
    roles: [ReliabilityEngineer]
    code: 200
    input: [revision_note]
    output: WorkOrder
    side_effects:
      - "moves state to REVISION_REQUESTED and increments revision_round by 1"
      - "rejected with ERR_REVISION_LIMIT_EXCEEDED when revision_round is already MAX_REVISION_ROUNDS"
      - "when the order was SCHEDULED: decrements the WeatherWindow's active_work_order_count by 1 without changing the window's state, sets crew_id, weather_window_id, planned_start_utc and planned_end_utc to null, and returns the crew to AVAILABLE when it holds no other SCHEDULED or IN_PROGRESS order"
      - "when the order was SCHEDULED and work_type is BLADE_REPAIR: returns the linked BladeDamage from REPAIR_SCHEDULED to PRIORITIZED"
  - method: POST
    path: "/wind-ops/work-orders/{id}/schedule"
    description: "Assign a crew and a CONFIRMED weather window to a SUBMITTED work order. Enforces certification, crew wind limit, farm match, window containment, crew occupancy and daily capacity."
    roles: [MaintenancePlanner]
    code: 200
    input: [crew_id, weather_window_id, planned_start_utc, planned_end_utc]
    output: WorkOrder
    side_effects:
      - "moves state to SCHEDULED and stores crew_id, weather_window_id, planned_start_utc and planned_end_utc"
      - "increments the WeatherWindow's active_work_order_count by 1 and LEAVES it CONFIRMED, so several crews may be scheduled into one confirmed window; overlapping crews are policed by ERR_CREW_WINDOW_CONFLICT and ERR_CREW_CAPACITY_EXCEEDED instead"
      - "sets Crew.status to ON_SHIFT"
      - "moves the linked BladeDamage from PRIORITIZED to REPAIR_SCHEDULED when work_type is BLADE_REPAIR"
  - method: POST
    path: "/wind-ops/work-orders/{id}/start"
    description: "Start a SCHEDULED work order on site. Takes the turbine down on the availability dimension according to work_type."
    roles: [CrewLead, ReliabilityEngineer]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "moves state to IN_PROGRESS"
      - "FAULT_DISPATCH moves Turbine.availability_state from FAULTED to DOWN_DISPATCH; SCHEDULED_SERVICE and BLADE_REPAIR move ONLINE to DOWN_SERVICE; MAJOR_COMPONENT moves ONLINE to DOWN_MAJOR"
      - "leaves Turbine.curtailment_state untouched"
      - "moves the named WeatherWindow from CONFIRMED to CONSUMED when this is the first order to start in it, so the window stops backing new schedules; active_work_order_count is not changed by starting"
      - "sets the assigned Crew.status to ON_SHIFT"
      - "rejected with ERR_TURBINE_FORCE_STOPPED when Turbine.curtailment_state is FORCED_STOP"
  - method: POST
    path: "/wind-ops/work-orders/{id}/complete"
    description: "Complete an IN_PROGRESS work order. This is the deepest cascade in the domain: labour cost, turbine recovery, fault closure, downtime admission, availability projection, priority re-scoring, crew release, window expiry and farm ledger posting."
    roles: [ReliabilityEngineer, CrewLead]
    code: 200
    input: [actual_hours]
    output: WorkOrder
    side_effects:
      - "hop 1: moves state to COMPLETED and sets labor_cost_cents to round_half_up(actual_hours * Crew.hourly_rate_cents)"
      - "hop 2: returns Turbine.availability_state from DOWN_DISPATCH, DOWN_SERVICE or DOWN_MAJOR to ONLINE, leaving curtailment_state untouched; a SCHEDULED_SERVICE completion also sets last_service_operating_hours to the current operating_hours and recomputes service_due_operating_hours, service_due_flag and service_interval_breached"
      - "hop 3: on a FAULT_DISPATCH order moves the linked FaultEvent from DISPATCHED through CLEARED to CLOSED in one transaction, sets cleared_at to the logical clock, and computes downtime_hours and lost_energy_kwh"
      - "hop 4: adds downtime_hours to Turbine.counted_downtime_hours_period when contractual_exclusion_pinned is false, and adds lost_energy_kwh to Turbine.cumulative_lost_energy_kwh regardless"
      - "hop 5: recomputes projected_shortfall_pct and at_risk_flag on every ACTIVE ServiceAgreement of the farm using the LIVE_PROJECTION variant"
      - "hop 6: re-scores priority_score on every other WorkOrder of the farm's turbines in state SUBMITTED, REVISION_REQUESTED or SCHEDULED, so an at_risk_flag flip is observable on orders never touched by this request"
      - "adds labor_cost_cents to WindFarm.maintenance_spend_cents and to WindFarm.opex_accrued_cents"
      - "decrements the WeatherWindow's active_work_order_count by 1 and moves it CONSUMED -> EXPIRED when the count reaches 0, and returns Crew.status to AVAILABLE when it holds no other SCHEDULED or IN_PROGRESS order"
      - "on a MAJOR_COMPONENT order moves every linked ComponentReplacement from EXECUTED to CLOSED"
      - "on a BLADE_REPAIR order moves the linked BladeDamage from REPAIR_SCHEDULED to REPAIRED"
  - method: POST
    path: "/wind-ops/work-orders/{id}/cancel"
    description: "Cancel a SUBMITTED or SCHEDULED work order, unwinding every reservation it holds."
    roles: [MaintenancePlanner, SiteAdmin]
    code: 200
    input: [cancellation_reason]
    output: WorkOrder
    side_effects:
      - "moves state to CANCELLED"
      - "decrements the WeatherWindow's active_work_order_count by 1, leaving its state unchanged"
      - "returns Crew.status to AVAILABLE when it holds no other SCHEDULED or IN_PROGRESS order"
      - "cancels every ComponentReplacement of this order in state PLANNED or CRANE_RESERVED, restoring SparePart quantities per the conserved-quantity invariant"
      - "returns the linked FaultEvent from DISPATCHED to DISPATCH_REQUIRED and the linked BladeDamage from REPAIR_SCHEDULED to PRIORITIZED"

  - method: POST
    path: "/wind-ops/crane-mobilizations"
    description: "Request a crawler or assist crane onto a farm for a mobilization window. A farm holds one crane slot, padded by CRANE_BUFFER_HOURS on both sides."
    roles: [MaintenancePlanner]
    code: 201
    input: [wind_farm_id, crane_class, mobilization_start_utc, demobilization_end_utc, day_rate_cents, mobilization_fee_cents, max_lift_wind_speed_ms]
    output: CraneMobilization
    side_effects:
      - "sets state to REQUESTED, reserved_replacement_count to 0 and every cost field to 0"
      - "rejected with ERR_CRANE_BUFFER_CONFLICT when the buffered interval collides with a REQUESTED or MOBILIZED mobilization on the same farm"
  - method: GET
    path: "/wind-ops/crane-mobilizations/{id}"
    description: "Read one crane mobilization including its lift days, standby days and tiered cost breakdown."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: []
    output: CraneMobilization
    side_effects: []
  - method: GET
    path: "/wind-ops/crane-mobilizations"
    description: "List crane mobilizations filtered by farm or state. Reverse-reachability channel for CraneMobilization.wind_farm_id."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: ["wind_farm_id?", "state?", "crane_class?", "limit?", "offset?"]
    output: CraneMobilization[]
    side_effects: []
  - method: POST
    path: "/wind-ops/crane-mobilizations/{id}/demobilize"
    description: "Demobilize a MOBILIZED crane, releasing the farm's crane slot."
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: CraneMobilization
    side_effects:
      - "moves state to DEMOBILIZED and frees the farm's crane slot for a new buffered mobilization"
      - "leaves total_crane_cost_cents and every per-replacement allocated_crane_cost_cents unchanged"

  - method: POST
    path: "/wind-ops/spare-parts"
    description: "Register a long-lead major component in the spare parts strategy with its reorder point and lead time."
    roles: [SiteAdmin]
    code: 201
    input: [component_type, part_number, quantity_on_hand, lead_time_days, reorder_point, unit_cost_cents, uptower_repairable]
    output: SparePart
    side_effects:
      - "sets quantity_reserved and quantity_consumed to 0 and total_units_accounted to quantity_on_hand"
      - "derives status: OUT_OF_STOCK when quantity_on_hand is 0, BELOW_REORDER_POINT when quantity_on_hand is above 0 but below reorder_point, otherwise IN_STOCK"
      - "sets procurement_flag true when status is not IN_STOCK"
  - method: GET
    path: "/wind-ops/spare-parts/{id}"
    description: "Read one spare part including the conserved total_units_accounted figure."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: []
    output: SparePart
    side_effects: []
  - method: GET
    path: "/wind-ops/spare-parts"
    description: "List spare parts filtered by component type or stock status."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: ["component_type?", "status?", "limit?", "offset?"]
    output: SparePart[]
    side_effects: []
  - method: POST
    path: "/wind-ops/spare-parts/{id}/receipts"
    description: "Book a goods receipt against a spare part, raising on-hand stock and re-deriving the reorder status."
    roles: [SiteAdmin]
    code: 200
    input: [quantity_received]
    output: SparePart
    side_effects:
      - "adds quantity_received to quantity_on_hand and to total_units_accounted"
      - "re-derives status and procurement_flag from the new quantity_on_hand against reorder_point"

  - method: POST
    path: "/wind-ops/component-replacements"
    description: "Plan a major component replacement under a MAJOR_COMPONENT work order, reserving one unit of the named spare part."
    roles: [MaintenancePlanner]
    code: 201
    input: [work_order_id, spare_part_id, component_type, estimated_lift_hours, uptower_labor_hours]
    output: ComponentReplacement
    side_effects:
      - "sets state to PLANNED, execution_path to null and allocated_crane_cost_cents to 0"
      - "moves one unit from SparePart.quantity_on_hand to SparePart.quantity_reserved, leaving total_units_accounted unchanged"
      - "re-derives SparePart.status and procurement_flag from the reduced quantity_on_hand"
      - "rejected with ERR_SPARE_PART_TYPE_MISMATCH when the part's component_type differs, and with ERR_SPARE_PART_UNAVAILABLE when quantity_on_hand is 0"
  - method: GET
    path: "/wind-ops/component-replacements/{id}"
    description: "Read one component replacement including its execution path and allocated crane cost."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: []
    output: ComponentReplacement
    side_effects: []
  - method: GET
    path: "/wind-ops/component-replacements"
    description: "List component replacements filtered by work order, spare part or crane mobilization. Reverse-reachability channel for ComponentReplacement.work_order_id, ComponentReplacement.spare_part_id and ComponentReplacement.crane_mobilization_id."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: ["work_order_id?", "spare_part_id?", "crane_mobilization_id?", "state?", "limit?", "offset?"]
    output: ComponentReplacement[]
    side_effects: []
  - method: POST
    path: "/wind-ops/component-replacements/{id}/reserve-crane"
    description: "Take the crane-lift branch: bind the replacement to a REQUESTED or MOBILIZED crane mobilization and reprice the whole mobilization under the crane_cost_and_allocation calculation."
    roles: [MaintenancePlanner]
    code: 200
    input: [crane_mobilization_id]
    output: ComponentReplacement
    side_effects:
      - "moves state to CRANE_RESERVED, sets execution_path to CRANE_LIFT and stores crane_mobilization_id"
      - "moves the CraneMobilization from REQUESTED to MOBILIZED and increments reserved_replacement_count by 1"
      - "recomputes lift_days, standby_days, billable_days, subtotal_cents, volume_credit_cents and total_crane_cost_cents on the mobilization"
      - "re-runs the waterfall so every reserved replacement's allocated_crane_cost_cents is refreshed, with the rounding remainder going to the earliest created_at"
      - "gated by workable days: the recomputed lift_days must not exceed the mobilization window's workable-day count, else ERR_LIFT_WIND_LIMIT_EXCEEDED"
      - "rejected with ERR_LIFT_WIND_LIMIT_EXCEEDED before ERR_CRANE_FARM_MISMATCH when both hold"
  - method: POST
    path: "/wind-ops/component-replacements/{id}/plan-uptower"
    description: "Take the uptower branch: repair in place with no crane. Only permitted when the reserved spare part is uptower_repairable."
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: ComponentReplacement
    side_effects:
      - "moves state to UPTOWER_READY and sets execution_path to UPTOWER_REPAIR"
      - "leaves crane_mobilization_id null and allocated_crane_cost_cents at 0"
      - "rejected with ERR_UPTOWER_NOT_PERMITTED when the reserved SparePart has uptower_repairable false"
  - method: POST
    path: "/wind-ops/component-replacements/{id}/execute"
    description: "Execute the replacement from either branch. The two branches rejoin here with divergent side-effect sets."
    roles: [CrewLead, ReliabilityEngineer]
    code: 200
    input: []
    output: ComponentReplacement
    side_effects:
      - "moves state to EXECUTED; rejected with ERR_WORK_ORDER_INVALID_STATE when the parent MAJOR_COMPONENT work order is not IN_PROGRESS"
      - "moves one unit from SparePart.quantity_reserved to SparePart.quantity_consumed, leaving total_units_accounted unchanged"
      - "CRANE_LIFT branch: adds allocated_crane_cost_cents to WindFarm.maintenance_spend_cents and to WindFarm.opex_accrued_cents"
      - "UPTOWER_REPAIR branch: adds round_half_up(uptower_labor_hours * UPTOWER_LABOR_RATE_CENTS_PER_HOUR) to WindFarm.maintenance_spend_cents and to WindFarm.opex_accrued_cents, leaves allocated_crane_cost_cents at 0 and posts no crane cost at all"
  - method: POST
    path: "/wind-ops/component-replacements/{id}/cancel"
    description: "Cancel a PLANNED or CRANE_RESERVED replacement, restoring stock and unwinding the crane reservation and the parent work order's schedule."
    roles: [MaintenancePlanner]
    code: 200
    input: [cancellation_reason]
    output: ComponentReplacement
    side_effects:
      - "hop 1: moves state to CANCELLED, sets allocated_crane_cost_cents to 0 and clears execution_path"
      - "hop 2: returns one unit from SparePart.quantity_reserved to SparePart.quantity_on_hand, leaving total_units_accounted unchanged, and re-derives status and procurement_flag"
      - "hop 3: decrements the CraneMobilization's reserved_replacement_count; when it reaches 0 the mobilization moves MOBILIZED -> CANCELLED and total_crane_cost_cents is rewritten to round_half_up(mobilization_fee_cents * CRANE_CANCELLATION_PCT / 100); otherwise the mobilization is repriced and the waterfall re-run over the survivors"
      - "hop 4: when the parent WorkOrder is SCHEDULED it returns to REVISION_REQUESTED with revision_round incremented, decrements its WeatherWindow's active_work_order_count by 1 without changing the window's state, and returns its Crew to AVAILABLE when it holds no other SCHEDULED or IN_PROGRESS order; when the parent is in any other state hop 4 is a no-op"

  - method: POST
    path: "/wind-ops/turbines/{id}/blade-damages"
    description: "Record a blade inspection finding from a drone, rope-access or ground-optical inspection. The severity score, priority band and repair due window are computed here."
    roles: [ReliabilityEngineer, CrewLead]
    code: 201
    input: [inspection_method, blade_position, inspected_at, damage_category, damage_type, chord_position_pct, damage_length_mm, exposed_area_cm2]
    output: BladeDamage
    side_effects:
      - "sets state to OPEN and recorded_by_user_id to the acting X-User-ID"
      - "computes severity_score, repair_priority_band and repair_due_days per the blade_damage_severity_score calculation"
  - method: GET
    path: "/wind-ops/blade-damages/{id}"
    description: "Read one blade damage finding including its severity score and priority band."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: []
    output: BladeDamage
    side_effects: []
  - method: GET
    path: "/wind-ops/blade-damages"
    description: "List blade damage findings filtered by turbine, band or state. Reverse-reachability channel for BladeDamage.turbine_id."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: ["turbine_id?", "repair_priority_band?", "state?", "inspection_method?", "limit?", "offset?"]
    output: BladeDamage[]
    side_effects: []
  - method: POST
    path: "/wind-ops/blade-damages/{id}/prioritize"
    description: "Accept a finding into the repair programme. Segregation of duties: the acting user must not be the inspector who recorded it."
    roles: [ReliabilityEngineer, CrewLead]
    code: 200
    input: []
    output: BladeDamage
    side_effects:
      - "moves state from OPEN to PRIORITIZED"
      - "rejected with ERR_SEGREGATION_OF_DUTIES when the acting X-User-ID equals recorded_by_user_id"
  - method: POST
    path: "/wind-ops/blade-damages/{id}/waive"
    description: "Waive a low-consequence finding without repair. Only permitted for MEDIUM and LOW bands."
    roles: [ReliabilityEngineer]
    code: 200
    input: [waiver_rationale]
    output: BladeDamage
    side_effects:
      - "moves state from OPEN to WAIVED and stores waiver_rationale"
      - "rejected with ERR_INVALID_STATE when repair_priority_band is CRITICAL or HIGH"

  - method: POST
    path: "/wind-ops/service-agreements"
    description: "Open an availability guarantee for a farm over a measurement period, on either a time-based or an energy-based basis."
    roles: [CommercialManager]
    code: 201
    input: [wind_farm_id, guaranteed_availability_pct, availability_basis, lda_rate_cents_per_pct_point, lda_cap_cents, period_start_utc, period_end_utc]
    output: ServiceAgreement
    side_effects:
      - "sets state to ACTIVE, at_risk_flag to false and projected_shortfall_pct, time_based_availability_pct, energy_based_availability_pct and assessed_lda_cents to 0"
  - method: GET
    path: "/wind-ops/service-agreements/{id}"
    description: "Read one service agreement including both availability figures, the projected shortfall and the assessed liquidated damages. Commercially restricted."
    roles: [SiteAdmin, CommercialManager, ReliabilityEngineer]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: []
  - method: GET
    path: "/wind-ops/service-agreements"
    description: "List service agreements filtered by farm or state. Reverse-reachability channel for ServiceAgreement.wind_farm_id. Commercially restricted."
    roles: [SiteAdmin, CommercialManager, ReliabilityEngineer]
    code: 200
    input: ["wind_farm_id?", "state?", "availability_basis?", "limit?", "offset?"]
    output: ServiceAgreement[]
    side_effects: []
  - method: POST
    path: "/wind-ops/service-agreements/{id}/settle"
    description: "Close the measurement period and assess liquidated damages. Runs both availability variants and applies the one named by availability_basis."
    roles: [CommercialManager]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects:
      - "moves state from ACTIVE to IN_SETTLEMENT"
      - "computes time_based_availability_pct and energy_based_availability_pct from clipped interval rows and turbine telemetry"
      - "computes assessed_lda_cents from the basis figure, capped at lda_cap_cents"
      - "freezes the farm's telemetry: subsequent POST /wind-ops/turbines/{id}/scada-sync on the farm is rejected with ERR_AGREEMENT_IN_SETTLEMENT until the agreement is finalized"
      - "rejected with ERR_NO_TURBINES_IN_SERVICE when the farm has no turbine outside DECOMMISSIONED"
  - method: POST
    path: "/wind-ops/service-agreements/{id}/finalize"
    description: "Finalize a settled period, releasing the telemetry freeze."
    roles: [CommercialManager]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects:
      - "moves state from IN_SETTLEMENT to SETTLED and clears at_risk_flag"
      - "releases the farm's telemetry freeze so scada-sync is accepted again"
      - "leaves assessed_lda_cents, time_based_availability_pct and energy_based_availability_pct frozen at their settled values"

  - method: POST
    path: "/wind-ops/turbines/{id}/curtailment-orders"
    description: "Issue a curtailment instruction against a turbine for grid, noise, icing or wildlife reasons. Optimistically concurrency-controlled on the turbine's version because the stack limit is evaluated against the turbine's live ACTIVE count."
    roles: [ControlRoomOperator]
    code: 201
    input: [reason, start_utc, end_utc, power_limit_kw, deemed_kwh_per_hour, expected_turbine_version]
    output: CurtailmentOrder
    side_effects:
      - "sets state to PENDING and curtailed_hours and lost_energy_kwh to 0"
      - "derives compensable as true when reason is GRID and false for NOISE, ICING and WILDLIFE"
      - "increments Turbine.version by 1"
      - "rejected with ERR_STALE_TURBINE_VERSION when expected_turbine_version differs from the turbine's current version"
  - method: GET
    path: "/wind-ops/curtailment-orders/{id}"
    description: "Read one curtailment order including its compensability and accrued lost energy."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: []
    output: CurtailmentOrder
    side_effects: []
  - method: GET
    path: "/wind-ops/curtailment-orders"
    description: "List curtailment orders filtered by turbine, reason or state. Reverse-reachability channel for CurtailmentOrder.turbine_id."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: ["turbine_id?", "reason?", "state?", "compensable?", "limit?", "offset?"]
    output: CurtailmentOrder[]
    side_effects: []
  - method: POST
    path: "/wind-ops/curtailment-orders/{id}/activate"
    description: "Bring a PENDING curtailment order into force. At most MAX_ACTIVE_CURTAILMENTS orders may be active on one turbine, and the most restrictive power limit wins."
    roles: [ControlRoomOperator]
    code: 200
    input: []
    output: CurtailmentOrder
    side_effects:
      - "moves state from PENDING to ACTIVE and increments Turbine.active_curtailment_count by 1"
      - "sets Turbine.curtailment_state to FORCED_STOP when power_limit_kw is 0, otherwise to CURTAILED; a turbine already FORCED_STOP stays FORCED_STOP"
      - "sets Turbine.effective_power_limit_kw to the minimum power_limit_kw across all ACTIVE orders on the turbine"
      - "leaves Turbine.availability_state untouched"
      - "rejected with ERR_CURTAILMENT_STACK_LIMIT when the turbine already holds MAX_ACTIVE_CURTAILMENTS active orders"
  - method: POST
    path: "/wind-ops/curtailment-orders/{id}/release"
    description: "Release an ACTIVE curtailment order, accruing its curtailed hours and lost energy."
    roles: [ControlRoomOperator]
    code: 200
    input: [released_at]
    output: CurtailmentOrder
    side_effects:
      - "moves state to RELEASED, sets curtailed_hours to (released_at - start_utc) / 3600 and lost_energy_kwh to round_half_up(curtailed_hours * deemed_kwh_per_hour, 2)"
      - "decrements Turbine.active_curtailment_count by 1 and recomputes effective_power_limit_kw as the minimum across the remaining ACTIVE orders, or TurbineModel.rated_power_kw when none remain"
      - "sets Turbine.curtailment_state to UNCONSTRAINED when no ACTIVE order remains, to FORCED_STOP when any remaining ACTIVE order has power_limit_kw 0, otherwise to CURTAILED"
      - "adds curtailed_hours to Turbine.counted_downtime_hours_period when compensable is false, and adds nothing when it is true"
      - "recomputes projected_shortfall_pct and at_risk_flag on every ACTIVE ServiceAgreement of the farm, then re-scores priority_score on every WorkOrder of the farm's turbines in state SUBMITTED, REVISION_REQUESTED or SCHEDULED"

  - method: POST
    path: "/wind-ops/farms/{id}/landowner-settlements"
    description: "Draft a landowner royalty settlement for one parcel over a period, on a metered-only or deemed-inclusive royalty basis. Optimistically concurrency-controlled on the farm's version because the settlement consumes landowner_budget_cap_cents headroom."
    roles: [CommercialManager]
    code: 201
    input: [parcel_code, royalty_basis, period_start_utc, period_end_utc, royalty_pct, minimum_payment_cents, energy_price_cents_per_kwh, road_damage_assessment_cents, expected_wind_farm_version]
    output: LandownerSettlement
    side_effects:
      - "sets state to DRAFT and computes metered_kwh, deemed_kwh, royalty_cents, payment_cents, road_levy_cents and community_levy_cents per the landowner_royalty_settlement calculation"
      - "increments WindFarm.version by 1"
      - "posts nothing to the farm ledger yet; a DRAFT settlement is not part of opex_accrued_cents"
      - "rejected with ERR_STALE_FARM_VERSION when expected_wind_farm_version differs from the farm's current version"
  - method: GET
    path: "/wind-ops/landowner-settlements/{id}"
    description: "Read one landowner settlement including its royalty and levy breakdown. Commercially restricted."
    roles: [SiteAdmin, CommercialManager, ReliabilityEngineer]
    code: 200
    input: []
    output: LandownerSettlement
    side_effects: []
  - method: GET
    path: "/wind-ops/landowner-settlements"
    description: "List landowner settlements filtered by farm, parcel or state. Reverse-reachability channel for LandownerSettlement.wind_farm_id. Commercially restricted."
    roles: [SiteAdmin, CommercialManager, ReliabilityEngineer]
    code: 200
    input: ["wind_farm_id?", "parcel_code?", "state?", "royalty_basis?", "limit?", "offset?"]
    output: LandownerSettlement[]
    side_effects: []
  - method: POST
    path: "/wind-ops/landowner-settlements/{id}/approve"
    description: "Approve a DRAFT settlement, posting the royalty, the road levy, the road damage assessment and the community levy into the farm's four ledger buckets."
    roles: [CommercialManager]
    code: 200
    input: []
    output: LandownerSettlement
    side_effects:
      - "moves state from DRAFT to APPROVED"
      - "adds payment_cents to WindFarm.landowner_payable_cents"
      - "adds road_levy_cents + road_damage_assessment_cents to WindFarm.road_maintenance_reserve_cents"
      - "adds community_levy_cents to WindFarm.community_fund_balance_cents"
      - "adds the same total to WindFarm.opex_accrued_cents, preserving the invariant opex_accrued_cents == landowner_payable_cents + road_maintenance_reserve_cents + community_fund_balance_cents + maintenance_spend_cents"
  - method: POST
    path: "/wind-ops/landowner-settlements/{id}/void"
    description: "Void an APPROVED settlement, reversing every ledger posting it made with no drift."
    roles: [CommercialManager]
    code: 200
    input: [void_reason]
    output: LandownerSettlement
    side_effects:
      - "moves state from APPROVED to VOID and stores void_reason"
      - "subtracts payment_cents from WindFarm.landowner_payable_cents, road_levy_cents + road_damage_assessment_cents from road_maintenance_reserve_cents, community_levy_cents from community_fund_balance_cents and the same total from opex_accrued_cents"
      - "leaves the settlement's own computed amounts intact for audit; the invariant holds exactly after the reversal"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals WorkOrder.submitted_by_user_id on complete, or equals BladeDamage.recorded_by_user_id on prioritize"
  - id: ERR_CREW_NOT_ASSIGNED
    http: 403
    condition: "the acting role is CrewLead but the acting X-User-ID is not the work order's crew_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, undeclared enum member, out-of-range number, malformed timestamp, or an interval whose end bound is not strictly after its start bound"
  - id: ERR_FARM_NOT_FOUND
    http: 404
    condition: "the {id} in a /wind-ops/farms/{id} path does not resolve to a WindFarm"
  - id: ERR_TURBINE_NOT_FOUND
    http: 404
    condition: "the {id} in a /wind-ops/turbines/{id} path does not resolve to a Turbine"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "the {id} in a /wind-ops/work-orders/{id} path does not resolve to a WorkOrder"
  - id: ERR_FAULT_EVENT_NOT_FOUND
    http: 404
    condition: "the {id} in a /wind-ops/fault-events/{id} path does not resolve to a FaultEvent"
  - id: ERR_PATH_RESOURCE_NOT_FOUND
    http: 404
    condition: "the {id} in any other single-resource path does not resolve to a row of that collection"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "a foreign-key identifier supplied in a request body does not resolve to an existing row"
  - id: ERR_STALE_FARM_VERSION
    http: 412
    condition: "expected_wind_farm_version differs from the WindFarm's current version on landowner settlement creation"
  - id: ERR_STALE_TURBINE_VERSION
    http: 412
    condition: "expected_turbine_version differs from the Turbine's current version on curtailment order creation"
  - id: ERR_WORK_ORDER_INVALID_STATE
    http: 409
    condition: "the requested work order transition is not declared from the order's current state"
  - id: ERR_FAULT_EVENT_INVALID_STATE
    http: 409
    condition: "the requested fault event transition is not declared from the event's current triage_state"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the current state of a crane mobilization, component replacement, weather window, curtailment order, service agreement, blade damage or landowner settlement"
  - id: ERR_TURBINE_DECOMMISSIONED
    http: 409
    condition: "the referenced turbine is in availability_state DECOMMISSIONED"
  - id: ERR_WEATHER_WINDOW_NOT_CONFIRMED
    http: 409
    condition: "the weather window named on a schedule request is in state FORECAST, CONSUMED or EXPIRED rather than CONFIRMED"
  - id: ERR_TURBINE_FORCE_STOPPED
    http: 409
    condition: "a remote reset or a work-order start is attempted while the turbine's curtailment_state is FORCED_STOP"
  - id: ERR_AGREEMENT_IN_SETTLEMENT
    http: 409
    condition: "telemetry or settlement creation is attempted on a farm while one of its service agreements is in state IN_SETTLEMENT"
  - id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http: 409
    condition: "the new landowner settlement's half-open period overlaps a non-VOID settlement for the same farm and parcel_code"
  - id: ERR_WEATHER_WINDOW_OVERLAP
    http: 409
    condition: "the new weather window's half-open interval overlaps a FORECAST or CONFIRMED window on the same farm"
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "the proposed planned interval overlaps another SCHEDULED or IN_PROGRESS work order assigned to the same crew"
  - id: ERR_CRANE_BUFFER_CONFLICT
    http: 409
    condition: "the new crane mobilization's interval, padded by CRANE_BUFFER_HOURS on both sides, collides with the padded interval of a REQUESTED or MOBILIZED mobilization on the same farm"
  - id: ERR_CURTAILMENT_STACK_LIMIT
    http: 409
    condition: "activating the order would leave the turbine with more than MAX_ACTIVE_CURTAILMENTS orders in state ACTIVE"
  - id: ERR_LIFT_WIND_LIMIT_EXCEEDED
    http: 422
    condition: "the recomputed lift_days for the mobilization exceeds the number of workable days in its window, workable meaning no CONFIRMED weather window covering that date forecasts wind above max_lift_wind_speed_ms"
  - id: ERR_CREW_WIND_LIMIT_EXCEEDED
    http: 422
    condition: "the assigned crew's max_work_wind_speed_ms is below the weather window's forecast_wind_speed_ms"
  - id: ERR_CREW_CERTIFICATION_MISSING
    http: 422
    condition: "the assigned crew's certifications do not contain the work order's required_certification"
  - id: ERR_WORK_ORDER_OUTSIDE_WINDOW
    http: 422
    condition: "the proposed planned interval is not fully contained inside the named weather window"
  - id: ERR_CREW_FARM_MISMATCH
    http: 422
    condition: "the assigned crew belongs to a different farm than the work order's turbine"
  - id: ERR_CRANE_FARM_MISMATCH
    http: 422
    condition: "the named crane mobilization belongs to a different farm than the replacement's turbine"
  - id: ERR_SPARE_PART_TYPE_MISMATCH
    http: 422
    condition: "the named spare part's component_type differs from the replacement's component_type"
  - id: ERR_UPTOWER_NOT_PERMITTED
    http: 422
    condition: "an uptower execution path is planned against a spare part whose uptower_repairable is false"
  - id: ERR_RESET_NOT_PERMITTED
    http: 422
    condition: "a triage disposition of REMOTE_RESET or a remote reset is attempted on a fault event whose severity_class_pinned is ADVISORY or LOCKOUT, or whose requires_dispatch_pinned is true"
  - id: ERR_RESET_QUOTA_EXHAUSTED
    http: 422
    condition: "reset_attempt_count has already reached max_remote_resets_pinned inside the current rolling 24 hour window"
  - id: ERR_CREW_CAPACITY_EXCEEDED
    http: 422
    condition: "the crew's committed estimated_hours for the target UTC calendar date plus this order's estimated_hours exceeds daily_hours_capacity"
  - id: ERR_SPARE_PART_UNAVAILABLE
    http: 422
    condition: "the named spare part has quantity_on_hand 0 so no unit can be reserved"
  - id: ERR_MINIMUM_PAYMENT_ABOVE_CAP
    http: 422
    condition: "minimum_payment_cents exceeds the farm's remaining landowner budget headroom"
  - id: ERR_SERVICE_NOT_DUE
    http: 422
    condition: "a SCHEDULED_SERVICE work order is raised while the turbine's operating_hours is below service_due_operating_hours minus PRE_SERVICE_WINDOW_HOURS"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 422
    condition: "a revision is requested on a work order whose revision_round has already reached MAX_REVISION_ROUNDS"
  - id: ERR_NO_TURBINES_IN_SERVICE
    http: 422
    condition: "an availability settlement is attempted on a farm with no turbine outside DECOMMISSIONED, so the denominator would be zero"

roles:
  - name: SiteAdmin
    description: "Wind farm operator's site administrator: registers farms, turbine models, turbines, crews, fault code rules and spare parts, books goods receipts, decommissions turbines and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /wind-ops/farms"
      - "POST /wind-ops/turbine-models"
      - "POST /wind-ops/farms/{id}/turbines"
      - "POST /wind-ops/fault-code-rules"
      - "PATCH /wind-ops/fault-code-rules/{id}"
      - "POST /wind-ops/crews"
      - "POST /wind-ops/spare-parts"
      - "POST /wind-ops/spare-parts/{id}/receipts"
      - "POST /wind-ops/turbines/{id}/decommission"
      - "POST /wind-ops/_clock/set_current_utc"
    shared_operations:
      - "POST /wind-ops/work-orders/{id}/cancel (shared with MaintenancePlanner)"
      - "every GET endpoint, including the commercially restricted service-agreement and landowner-settlement reads"
  - name: ControlRoomOperator
    description: "Supervisory control room operator: posts SCADA telemetry, raises and triages fault codes, attempts remote resets and issues curtailment instructions."
    identity: "opaque"
    exclusive_operations:
      - "POST /wind-ops/turbines/{id}/scada-sync"
      - "POST /wind-ops/turbines/{id}/fault-events"
      - "POST /wind-ops/fault-events/{id}/triage"
      - "POST /wind-ops/fault-events/{id}/remote-reset"
      - "POST /wind-ops/turbines/{id}/curtailment-orders"
      - "POST /wind-ops/curtailment-orders/{id}/activate"
      - "POST /wind-ops/curtailment-orders/{id}/release"
    shared_operations:
      - "every GET endpoint except the commercially restricted service-agreement and landowner-settlement reads"
  - name: MaintenancePlanner
    description: "Maintenance planner: records and confirms weather windows, raises and schedules work orders, requests cranes and plans major component replacements."
    identity: "opaque"
    exclusive_operations:
      - "POST /wind-ops/weather-windows"
      - "POST /wind-ops/weather-windows/{id}/confirm"
      - "POST /wind-ops/work-orders/{id}/schedule"
      - "POST /wind-ops/crane-mobilizations"
      - "POST /wind-ops/crane-mobilizations/{id}/demobilize"
      - "POST /wind-ops/component-replacements"
      - "POST /wind-ops/component-replacements/{id}/reserve-crane"
      - "POST /wind-ops/component-replacements/{id}/plan-uptower"
      - "POST /wind-ops/component-replacements/{id}/cancel"
    shared_operations:
      - "POST /wind-ops/work-orders (shared with ReliabilityEngineer)"
      - "POST /wind-ops/work-orders/{id}/submit (shared with ReliabilityEngineer)"
      - "POST /wind-ops/work-orders/{id}/cancel (shared with SiteAdmin)"
      - "every GET endpoint except the commercially restricted service-agreement and landowner-settlement reads"
  - name: ReliabilityEngineer
    description: "Reliability engineer: owns the blade inspection programme, closes fault events, requests work order revisions and signs off completions. Cannot sign off a work order it submitted itself."
    identity: "opaque"
    exclusive_operations:
      - "POST /wind-ops/fault-events/{id}/close"
      - "POST /wind-ops/work-orders/{id}/request-revision"
      - "POST /wind-ops/blade-damages/{id}/waive"
    shared_operations:
      - "POST /wind-ops/work-orders (shared with MaintenancePlanner)"
      - "POST /wind-ops/work-orders/{id}/submit (shared with MaintenancePlanner)"
      - "POST /wind-ops/work-orders/{id}/start (shared with CrewLead)"
      - "POST /wind-ops/work-orders/{id}/complete (shared with CrewLead)"
      - "POST /wind-ops/turbines/{id}/blade-damages (shared with CrewLead)"
      - "POST /wind-ops/blade-damages/{id}/prioritize (shared with CrewLead)"
      - "POST /wind-ops/component-replacements/{id}/execute (shared with CrewLead)"
      - "every GET endpoint, including the commercially restricted service-agreement and landowner-settlement reads"
  - name: CrewLead
    description: "Technician crew lead acting as a persisted Crew. X-User-ID is the acting Crew.id, so ownership checks compare it against WorkOrder.crew_id."
    identity: "entity_backed:Crew"
    exclusive_operations: []
    shared_operations:
      - "POST /wind-ops/work-orders/{id}/start (shared with ReliabilityEngineer; only for a work order whose crew_id is the acting Crew)"
      - "POST /wind-ops/work-orders/{id}/complete (shared with ReliabilityEngineer; only for a work order whose crew_id is the acting Crew)"
      - "POST /wind-ops/turbines/{id}/blade-damages (shared with ReliabilityEngineer)"
      - "POST /wind-ops/blade-damages/{id}/prioritize (shared with ReliabilityEngineer)"
      - "POST /wind-ops/component-replacements/{id}/execute (shared with ReliabilityEngineer)"
      - "every GET endpoint except the commercially restricted service-agreement and landowner-settlement reads"
  - name: CommercialManager
    description: "Commercial manager: owns service agreements, availability settlement and liquidated damages, and the landowner, road and community payment programme."
    identity: "opaque"
    exclusive_operations:
      - "POST /wind-ops/service-agreements"
      - "POST /wind-ops/service-agreements/{id}/settle"
      - "POST /wind-ops/service-agreements/{id}/finalize"
      - "POST /wind-ops/farms/{id}/landowner-settlements"
      - "POST /wind-ops/landowner-settlements/{id}/approve"
      - "POST /wind-ops/landowner-settlements/{id}/void"
    shared_operations:
      - "every GET endpoint, including the commercially restricted service-agreement and landowner-settlement reads"
