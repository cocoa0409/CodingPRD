            - "One COMPLIANT US/USD acquirer; MccDefinition 5411; a STANDARD rate program."
            - "One RateProgramVersion for quarter 2026Q4 effective 2026-10-01 to 2027-01-01 with implementation_deadline 2026-09-30T00:00:00Z, PUBLISHED at 2026-09-01T12:00:00Z."
