          The programme-active gate is checked on POST /applications, so the very same body is
          refused 409 ERR_PROGRAM_NOT_ACTIVE while the programme is DRAFT and accepted 201
          immediately after activation, with no other input changed — the refusal is a state
          check, not a shape check.
