              captures: { submit_err: $.data.error_id }
          assert:
            - "Audit close-fail cascaded to ProviderSite: status == SUSPENDED_ORDERING"
            - "${site_status} == SUSPENDED_ORDERING"
            - "Cascade continues one more hop: order submission now blocked by site state, not by audit directly"
            - "${submit_err} == ERR_SITE_SUSPENDED_ORDERING"

  # -------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — 2 instances on different pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_lot_expired_on_quarantined_unit
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_STORAGE_UNIT_QUARANTINED]
        distinguishing_aspect: |
          Error-category pair (state) vs (business_safety): a dose
          administration request hitting a Lot that is BOTH non-AVAILABLE
          (state violation, priority 7: lot EXPIRED via clock advance) AND
          past its expiration (business_safety, priority 8:
          administration_date > expires_on) must return the state error
          ERR_LOT_NOT_AVAILABLE because priority 7 precedes priority 8.
        test_recipe:
          setup:
            - "Site S; unit U; product P; lot L (PRIVATE 5 doses, expires_on=2026-08-03)"
            - "Logical clock advanced to 2026-08-04 -> lot auto-EXPIRED (current_date > expires_on, quantity>0)"
            - "Patient pat (COMMERCIAL, so PRIVATE_ONLY screening) and screening on 2026-08-05"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-501" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "L-OLD", stock_type: "PRIVATE", quantity_on_hand: 5, expires_on: "2026-08-03" }
              as: VaccineManager
              captures: { lot_old: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites/${site_s}/patients"
              payload: { full_name: "Pat Adult-Insured", date_of_birth: "2020-01-15", insurance_category: "COMMERCIAL" }
              as: VaccineManager
              captures: { pat: $.data.id }
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-05", insurance_category_at_visit: "COMMERCIAL" }
              as: VaccineManager
              captures: { scr: $.data.id }
          trigger:
            - call: "POST /provider-sites/${site_s}/dose-administrations"
              payload: { patient_id: "${pat}", eligibility_screening_id: "${scr}", lot_id: "${lot_old}", administration_date: "2026-08-05" }
              as: VaccineManager
              captures: { err: $.data.error_id }
          assert:
            - "Lot auto-transitioned to EXPIRED when the clock crossed 2026-08-03 (state violation, priority 7) AND administration_date 2026-08-05 > expires_on 2026-08-03 (priority 8). The state-class error wins by priority order."
            - "${err} == ERR_LOT_NOT_AVAILABLE"

      - name: business_safety_vs_business_fiscal_allocation_over_receipt
        grounds:
          - validations[priority=6]
          - validations[priority=16]
          - errors[ERR_STORAGE_UNIT_QUARANTINED]
          - errors[ERR_OVER_RECEIPT]
        distinguishing_aspect: |
          Error-category pair (business_safety) vs (business_fiscal): an
          AllocationReceipt posting to a QUARANTINED storage unit that would
          ALSO exceed the line's approved_doses must return
          ERR_STORAGE_UNIT_QUARANTINED (priority 6, safety) before
          ERR_OVER_RECEIPT (priority 16, fiscal).
        test_recipe:
          setup:
            - "Site S; unit U; product P; order O approved for 5 doses; line L approved 5"
            - "Lot L1 (PRIVATE 2 doses) sitting in U"
            - "Excursion opened on U (unit is_quarantined=true)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-502" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "L1", stock_type: "PRIVATE", quantity_on_hand: 2, expires_on: "2027-06-30" }
              as: VaccineManager
            - call: "POST /provider-sites/${site_s}/vaccine-orders"
              payload: { expected_vfc_doses: 5 }
              as: VaccineManager
              captures: { ord: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/lines"
              payload: { vaccine_product_id: "${prod_p}", requested_doses: 5 }
              as: VaccineManager
              captures: { ord_line: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { site_v: $.data.version }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/approve"
              payload: { approved_vfc_doses: 5, expected_provider_site_version: "${site_v}" }
              as: StateProgramOfficer
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-01T10:00:00Z", temperature_c: 12.0 }
              as: VaccineManager
          trigger:
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/allocation-receipts"
              payload: { order_line_id: "${ord_line}", storage_unit_id: "${unit_u}", lot_number: "L2", expires_on: "2027-06-30", quantity_doses: 10 }
              as: VaccineManager
              captures: { err: $.data.error_id }
          assert:
            - "Both ERR_STORAGE_UNIT_QUARANTINED (safety, p6) and ERR_OVER_RECEIPT (fiscal, p16) apply; safety wins"
            - "${err} == ERR_STORAGE_UNIT_QUARANTINED"

  # -------------------------------------------------------------------------
  # Rule 6: boundary_precision_check — 2 instances on different metrics/endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: temperature_boundary_at_exactly_max_is_in_range
        grounds:
          - entities.TemperatureReading.fields.is_out_of_range
          - calculations.excursion_peak_temperature
        distinguishing_aspect: |
          Boundary metric: temperature reading (numeric). is_out_of_range uses
          strict inequality on both ends: temperature_c > max_temp_c OR
          temperature_c < min_temp_c. A reading of exactly max_temp_c (8.0)
          is IN range (no excursion opens); a reading of exactly 8.1 opens
          one. Endpoint: POST /storage-units/{id}/temperature-readings.
        test_recipe:
          setup:
            - "Site S; unit U min=2.0 max=8.0; lot L (PRIVATE 3 doses)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
