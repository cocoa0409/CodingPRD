              captures: { sku: $.data.id, sku_v1: $.data.version }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
              captures: { sku_v2: $.data.version }
          trigger:
            - call: "POST /api/skus/${sku}/clearance"
              payload: { pct: 0.20, expected_sku_version: "${sku_v1}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_STALE_SKU_VERSION'"

      - name: stale_order_version_on_reserve
        claim_type: error_id_triggerable
        grounds:
          - concurrency_rules[reserve-order-stale-order]
          - errors[ERR_STALE_ORDER_VERSION]
        distinguishing_aspect: "Client captures order.version v1, then another writer cancels+recreates or edits, bumping version. Reserve with v1 → 412."
        test_recipe:
          setup:
            - "Clock 2026-06-15. Customer + SKU. Order created (version 1)."
            - "Author strategy for a deterministic bump: cancel then create; but Order.cancel bumps version so we simply cancel and expect reserve-with-old-version to fail."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "ss@ex.com", full_name: "SS" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-S", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 1 }] }
              as: StoreClerk
              captures: { ord: $.data.id, ord_v: $.data.version }
            - call: "POST /api/orders/${ord}/cancel"
              payload: {}
              as: StoreClerk
              captures: { ord_v_after_cancel: $.data.version }
          trigger:
            - call: "POST /api/orders/${ord}/reserve"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_STALE_ORDER_VERSION'"

      - name: delivery_slot_conflict
        claim_type: error_id_triggerable
        grounds: ["errors[ERR_DELIVERY_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / delivery_slot_half_open_adjacent_permits"
          rationale: "The delivery-slot conflict boundary is exercised by the temporal-overlap instance."

  # =====================================================================
  # SECTION: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: customer_cannot_create_sku
        claim_type: role_denial
        grounds:
          - roles[Customer]
          - endpoints[POST /skus]
          - errors[ERR_FORBIDDEN]
          - validations[priority=3]
        distinguishing_aspect: "Customer role is not in POST /skus roles list; returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup:
            - "Customer exists."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "cust1@ex.com", full_name: "Cust One" }
              as: StoreClerk
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /api/skus"
              payload: { sku_code: "FORBIDDEN-01", category: "DECOR", unit_price_cents: 100 }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_FORBIDDEN'"

      - name: delivery_driver_cannot_reserve_order
        claim_type: role_denial
        grounds:
          - roles[DeliveryDriver]
          - endpoints[POST /orders/{id}/reserve]
        distinguishing_aspect: "DeliveryDriver's exclusive operation is `deliver`; reserve rejects."
        test_recipe:
          setup:
            - "Order in DRAFT state."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "cust2@ex.com", full_name: "Cust Two" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-DD", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 1 }] }
              as: StoreClerk
              captures: { ord: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /api/orders/${ord}/reserve"
              payload: { expected_order_version: "${ord_v}" }
              as: DeliveryDriver
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_FORBIDDEN'"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: unauthenticated
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Request missing X-User-Role header returns ERR_UNAUTHENTICATED."
        test_recipe:
          setup:
            - "Clock default."
          setup_api_calls: []
          trigger:
            - call: "POST /api/skus"
              payload: { sku_code: "MISS-01", category: "DECOR", unit_price_cents: 100 }
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNAUTHENTICATED'"

      - name: unknown_role_returns_unknown_role
        claim_type: unknown_role
        grounds:
          - validations[priority=2]
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: "Request with X-User-Role='Hacker' returns ERR_UNKNOWN_ROLE."
        test_recipe:
          setup:
            - "Clock default."
          setup_api_calls: []
          trigger:
            - call: "POST /api/skus"
              payload: { sku_code: "MISS-02", category: "DECOR", unit_price_cents: 100 }
              as: Hacker
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNKNOWN_ROLE'"

  # =====================================================================
  # SECTION: complexity_layers (cross-cutting)
  # =====================================================================
  - section: complexity_layers
    instances:
      - name: derived_reserved_qty_reconciles_after_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
          - entities.Sku.fields.reserved_qty
          - calculations.sku_reservation_balance
        distinguishing_aspect: "After Order reserve then cancel, Sku.reserved_qty returns to pre-reserve value (0), consistent with source-of-truth aggregate."
        test_recipe:
          setup:
            - "Clock 2026-06-15. Customer + SKU on_hand=10. Order DRAFT with 1 line qty=4."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "tt@ex.com", full_name: "TT" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-T", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 10 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 4 }] }
              as: StoreClerk
              captures: { ord: $.data.id, ord_v: $.data.version }
            - call: "POST /api/orders/${ord}/reserve"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreClerk
            - call: "GET /api/skus/${sku}"
              payload: {}
              as: StoreClerk
              captures: { reserved_after_reserve: $.data.reserved_qty }
          trigger:
            - call: "POST /api/orders/${ord}/cancel"
              payload: {}
              as: StoreClerk
            - call: "GET /api/skus/${sku}"
              payload: {}
              as: StoreClerk
              captures: { reserved_after_cancel: $.data.reserved_qty }
          assert:
            - "reserved_after_reserve == 4"
            - "reserved_after_cancel == 0"

      - name: scheduled_action_pickup_deadline_computed_at_reserve
        claim_type: scheduled_deferred_actions
        grounds:
          - complexity_profile.complexity_layers.scheduled_deferred_actions
          - entities.Order.fields.pickup_deadline
          - state_machines.Order.DRAFT_to_RESERVED
        distinguishing_aspect: "BOPIS Order with pickup_window_end 2026-06-15T18:00Z gets pickup_deadline 2026-06-17T18:00Z (48h grace)."
        test_recipe:
          setup:
            - "Clock 2026-06-15."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "uu@ex.com", full_name: "UU" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-U", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "BOPIS", lines: [{ sku_id: "${sku}", qty: 1 }], pickup_window_start: "2026-06-15T14:00:00Z", pickup_window_end: "2026-06-15T18:00:00Z" }
              as: StoreClerk
              captures: { ord: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /api/orders/${ord}/reserve"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreClerk
              captures: { deadline: $.data.pickup_deadline }
          assert:
            - "deadline == '2026-06-17T18:00:00.000Z'"

      - name: cascade_order_return_reconciles_sku_and_credit
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers.cascading_side_effects]
        excluded_because:
          difficulty_instance: "transitive_cascade / order_pickup_rental_pickup_return_credit_chain"
          rationale: "Multi-step cascade (Order pickup → RentalContract → Sku/Customer) exercised by the rule-4 depth-3 instance."

  # =====================================================================
  # SECTION: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: reserve_response_reflects_immediate_grand_total_recompute
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.order_grand_total
          - entities.Order.fields.grand_total_cents
        distinguishing_aspect: "Order.reserve response body already contains recomputed subtotal/helium/delivery/grand_total — no second GET needed."
        test_recipe:
          setup:
            - "Clock 2026-06-15. Customer + SKU on_hand=10, unit_price=500. Order DRAFT with 3 units."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "vv@ex.com", full_name: "VV" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-V", category: "DECOR", unit_price_cents: 500 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 10 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 3 }] }
              as: StoreClerk
              captures: { ord: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /api/orders/${ord}/reserve"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreClerk
              captures: { total: $.data.grand_total_cents, subtotal: $.data.subtotal_cents }
          assert:
            - "subtotal == 1500"
            - "total == 1500"
