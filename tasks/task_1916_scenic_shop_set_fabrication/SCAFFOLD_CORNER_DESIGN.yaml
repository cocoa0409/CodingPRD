# =============================================================================
# Task 1916 — Scenic Shop & Set Fabrication — SCAFFOLD_CORNER_DESIGN.yaml
# §1.9 Coverage Index for Non-Difficulty Tests (breadth probe).
# Section / claim_type vocabulary follows references/claim-extraction-guide.md.
# Shared fixture literals are identical to §1.8 (standard shop: rate 8000c/h,
# overhead 1000bp, margin 2000bp, overtime 15000bp, 100h/wk x 4wk horizon,
# 2 bays, 6 trucks).
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_shop_returns_201_with_computed_defaults
        claim_type: creation
        grounds:
          - entities.Shop
          - 'endpoints["POST /scenic/shops"]'
        distinguishing_aspect: "POST with all required fields returns 201; computed/system fields are initialized (posture OPEN, committed 0, epoch 0, version 1) without any client input for them."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /scenic/shops/${shop_id}"
              payload: {}
              as: ShopAdmin
          assert:
            - "Shop.${shop_id}.posture == OPEN and committed_crew_hours == 0 and capacity_ratio_bp == 0"
            - "Shop.${shop_id}.epoch_index == 0 and inventory_value_cents == 0 and version == 1"
            - "Shop.${shop_id}.id is a UUID without any type prefix and created_at has three fractional digits"

      - name: create_bid_missing_required_pricing_variant_returns_400
        claim_type: required_fields
        grounds:
          - entities.Bid.fields.pricing_variant
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "Omitting required field pricing_variant on bid create fails with ERR_VALIDATION (400); the bid is not persisted."
        test_recipe:
          setup: ["shop, client, package exist"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with ERR_VALIDATION (HTTP 400)   # pricing_variant missing"
            - "GET /scenic/bids?client_id=${cl_id} returns total_count 0"

      - name: create_stock_item_invalid_enum_returns_400
        claim_type: type_constraints
        grounds:
          - entities.StockItem.fields.condition_grade
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "condition_grade 'D' is outside the declared enum {A, B, C} and is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["shop exists"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /scenic/stock-items"
              payload: { shop_id: "${shop_id}", material_code: "LUMBER_4X8", condition_grade: "D", quantity_on_hand: 10, replacement_cost_cents: 5000 }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with ERR_VALIDATION (HTTP 400)"

      - name: bid_create_extra_price_field_rejected
        claim_type: computed_fields
        grounds:
          - entities.Bid.fields.price_cents
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "price_cents is computed; a client-supplied price_cents on bid create is an unknown input field and the whole request is rejected with ERR_VALIDATION (400) rather than silently honored."
        test_recipe:
          setup: ["shop, client, package exist"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100, price_cents: 1 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with ERR_VALIDATION (HTTP 400)   # computed field smuggled as input"

      - name: get_nonexistent_bid_returns_not_found
        claim_type: not_found
        grounds:
          - 'errors[ERR_NOT_FOUND]'
          - 'endpoints["GET /scenic/bids/{bidId}"]'
        distinguishing_aspect: "GET with a well-formed UUID that does not exist returns 404 ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["shop exists (any resource tree)"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
          trigger:
            - call: "GET /scenic/bids/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with ERR_NOT_FOUND (HTTP 404) and response_type == 'error'"

      - name: list_clients_pagination_window_and_flags
        claim_type: listing
        grounds:
          - response_envelope
          - 'endpoints["GET /scenic/clients"]'
        distinguishing_aspect: "limit/offset windowing over 3 clients: page 1 (limit 2, offset 0) returns 2 rows with total_count 3 and has_more true; page 2 (limit 2, offset 2) returns 1 row with has_more false."
        test_recipe:
          setup: ["shop with 3 clients"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Alpha Productions", contact_email: "a@x.example", credit_limit_cents: 1000000 }
              as: ShopAdmin
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Bravo Productions", contact_email: "b@x.example", credit_limit_cents: 1000000 }
              as: ShopAdmin
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Charlie Productions", contact_email: "c@x.example", credit_limit_cents: 1000000 }
              as: ShopAdmin
          trigger:
            - call: "GET /scenic/clients?shop_id=${shop_id}&limit=2&offset=0"
              payload: {}
              as: Estimator
            - call: "GET /scenic/clients?shop_id=${shop_id}&limit=2&offset=2"
              payload: {}
              as: Estimator
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"

      - name: takeoff_line_with_nonexistent_takeoff_returns_404
        claim_type: parent_relationships
        grounds:
          - entities.TakeoffLine.fields.takeoff_id
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "A takeoff line whose takeoff_id does not exist fails existence validation (priority 3) with ERR_NOT_FOUND (404) even though the payload shape and OCC version are well-formed."
        test_recipe:
          setup: ["shop, client, package, and a REAL takeoff (its version is captured to satisfy OCC); the trigger then targets a bogus takeoff id"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/takeoffs"
              payload: { design_package_id: "${pkg_id}", labor_hours_est: 10 }
              as: Estimator
              captures: { to_v: $.data.version }
          trigger:
            - call: "POST /scenic/takeoff-lines"
              payload: { takeoff_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", expected_takeoff_version: "${to_v}", material_code: "LUMBER_4X8", quantity: 5, source: "PURCHASE", unit_cost_cents: 5000 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with ERR_NOT_FOUND (HTTP 404)"

      - name: takeoff_created_with_defaults_and_pinned_revision
        claim_type: defaults
        grounds:
          - entities.Takeoff.fields.pinned_package_revision
          - entities.Takeoff.fields.materials_subtotal_cents
        distinguishing_aspect: "Takeoff creation stamps pinned_package_revision from the package (1), initializes materials_subtotal_cents 0 and status DRAFT, and records estimator_user_id from X-User-ID."
        test_recipe:
          setup: ["shop, client, package (revision 1) exist"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "POST /scenic/takeoffs"
              payload: { design_package_id: "${pkg_id}", labor_hours_est: 40 }
              as: Estimator
              as_user_id: "est_1"
              captures: { to_id: $.data.id }
          assert:
            - "Takeoff.${to_id}.status == DRAFT and materials_subtotal_cents == 0"
            - "Takeoff.${to_id}.pinned_package_revision == 1 and estimator_user_id == 'est_1'"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: bid_submit_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Bid.DRAFT_to_SUBMITTED
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "The submit trigger exists only from DRAFT; a second submit on the now-SUBMITTED bid fails with ERR_INVALID_STATE and no side effects refire (valid_until unchanged)."
        test_recipe:
          setup: ["shop, client, package; ROM bid in DRAFT"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100 }
              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
              captures: { vu: $.data.valid_until }
          trigger:
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "second submit fails with ERR_INVALID_STATE (HTTP 409)"
            - "Bid.${bid_id}.valid_until still == ${vu} (no refire) and status == SUBMITTED"

      - name: accept_rejected_bid_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Bid.SUBMITTED_to_REJECTED
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "REJECTED is terminal: accept on a rejected bid fails with ERR_INVALID_STATE; no Production is created."
        test_recipe:
          setup: ["shop, client, package; ROM bid SUBMITTED then REJECTED by the client"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100 }
              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/reject"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /scenic/bids/${bid_id}/accept"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "accept fails with ERR_INVALID_STATE (HTTP 409)   # terminal lockdown"
            - "Bid.${bid_id}.status == REJECTED and production_id is null"

      - name: withdraw_countered_bid_is_valid_and_terminal
        claim_type: valid_transition
        grounds:
          - state_machines.Bid.COUNTERED_to_WITHDRAWN
        distinguishing_aspect: "Estimator may walk away from a negotiation: COUNTERED -> WITHDRAWN succeeds; any further client action (counter) then fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["shop, client, package; bid SUBMITTED then COUNTERED"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100 }
              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/counter"
              payload: { counter_price_cents: 700000 }
              as: ClientPM
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /scenic/bids/${bid_id}/withdraw"
              payload: {}
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/counter"
              payload: { counter_price_cents: 800000 }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "withdraw succeeds: Bid.${bid_id}.status == WITHDRAWN"
            - "counter after withdraw fails with ERR_INVALID_STATE (HTTP 409)"

      - name: complete_build_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Production
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "complete-build exists only from IN_BUILD; calling it on a SCHEDULED production fails with ERR_INVALID_STATE even though all business gates (reviews, samples, buffer) happen to be satisfiable."
        test_recipe:
          setup: ["production SCHEDULED (bid accepted); no reviews, no samples"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100 }
              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/accept"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { prod_id: $.data.production_id }
          trigger:
            - call: "POST /scenic/productions/${prod_id}/complete-build"
              payload: {}
              as: ShopForeman
              captures: { err: $.data.error_id }
          assert:
            - "fails with ERR_INVALID_STATE (HTTP 409); Production.${prod_id}.status == SCHEDULED"

      - name: transport_confirm_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.TransportPlan.PLANNED_to_CONFIRMED
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Confirm is only valid from PLANNED; a second confirm on the CONFIRMED plan fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["production SCHEDULED; transport plan PLANNED"]
          setup_api_calls:
            - call: "POST /scenic/shops"
