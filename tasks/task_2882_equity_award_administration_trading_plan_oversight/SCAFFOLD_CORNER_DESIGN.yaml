            - "both reads return HTTP 200; the summary reports gross_burn_rate_bps == 0 and available_reserve_shares == 1000000"
            - "all three writes return HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "only one EquityPlan row exists, no Grant row exists and no TradingWindow row exists"

      - name: compliance_officer_exclusively_administers_trading_windows
        claim_type: exclusive_operations
        grounds:
          - roles.ComplianceOfficer
          - roles.PlanAdministrator
          - endpoints[POST /trading-windows]
          - endpoints[POST /trading-windows/{id}/status]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          Window creation and the OPEN/SUSPEND/RESUME/CLOSE lifecycle belong to
          ComplianceOfficer alone: a PlanAdministrator - the role that may otherwise write
          almost everything, including the plan itself - is refused on both endpoints with
          ERR_ROLE_NOT_PERMITTED while compliance-1 succeeds on the identical payloads.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; one ACTIVE plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Delta Three", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-03-31T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_create: $.data.error_id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-03-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w_id: $.data.id }
            - call: "POST /trading-windows/${w_id}/status"
              payload: { action: "OPEN" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_status: $.data.error_id }
            - call: "POST /trading-windows/${w_id}/status"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - "the PlanAdministrator creation returns HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED and no window row is created"
            - "the ComplianceOfficer creation returns HTTP 201 with status SCHEDULED and approved_shares_cumulative == 0"
            - "the PlanAdministrator status call returns HTTP 403 with ERR_ROLE_NOT_PERMITTED and the window is still SCHEDULED"
            - "the ComplianceOfficer status call returns HTTP 200 with status == OPEN"

      - name: delegated_officer_cannot_use_the_board_approval_path
        claim_type: delegated_authority
        grounds:
          - validations[priority=10]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - state_machines.Grant.PENDING_APPROVAL_to_APPROVED
          - roles.DelegatedOfficer
          - roles.BoardMember
        distinguishing_aspect: |
          POST /grants/{id}/approve carries two branches with different declared actors, so the
          role must match the branch the body selects: a DelegatedOfficer sending
          approval_path BOARD and a BoardMember sending approval_path DELEGATED are both
          refused with ERR_ROLE_NOT_PERMITTED (403) before any fiscal check, while the
          DelegatedOfficer sending DELEGATED with its own authority_id succeeds.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan; ApprovalAuthority to officer-1 effective 2026-01-01..2026-12-31 with per_grant_share_cap 5000 and aggregate_share_cap 10000."
            - "One PENDING_APPROVAL NSO grant of 1000 shares."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
