          setup:
            - "logical clock at 2026-01-05T00:00:00Z"
            - "one operating site with one commissioned monitor, the network's only site"
            - "an APPROVED 2026 network assessment"
            - "a SUBMITTED SEASONAL_SUSPENSION site-change request citing that assessment"
