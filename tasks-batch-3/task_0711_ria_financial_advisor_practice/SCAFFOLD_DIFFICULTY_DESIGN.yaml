      - name: goal_on_track_at_exactly_100pct
        grounds:
          - calculations.goal_funding_projection
          - entities.Goal.fields.funded_ratio_bps
          - entities.Goal.fields.on_track
        distinguishing_aspect: |
          On POST /goals, a DRAFT-plan goal (ACTUAL variant) with current_amount_cents exactly equal to
          target_amount_cents reads funded_ratio_bps==10000 and on_track==true (>= 100% boundary). Metric =
          goal funded ratio via the goals endpoint, distinct from the drift bps boundary above.
