      - name: ownership_scoping_refuses_a_rival_developer_and_a_non_occupant_resident
        claim_type: exclusive_operation
        grounds:
          - validations.priority_7
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          Developer and Resident are role names shared by many principals, so authorisation is a
          per-row check against Project.developer_user_id and the unit's occupant_household_id
          rather than a role-list membership test. Its position at priority 7 is observable in both
          directions: it fires BEFORE the priority-9 project-state check, so a rival developer
          electing a path on an already-elected project gets ERR_NOT_RESOURCE_OWNER and not
          ERR_INVALID_PROJECT_STATE, yet it fires AFTER the priority-5/6 existence checks, so a
          rival developer naming a non-existent project still gets a 404.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (R-2, 20 units, dev-1) screened SUBJECT, ONSITE elected, agreement recorded, with OWNERSHIP 2br unit NO-101 restricted at 32500000 and occupant H1 (size 3, 6000000) certified at rent 0."
            - "Household H2 (size 2, 5000000) exists and occupies nothing."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Owner Only", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
