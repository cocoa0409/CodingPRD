          trigger:
            - { call: "POST /disagreement-records/${dis}/resolve", payload: { resolution_method: "DIRECTOR_OVERRIDE", rationale: "Director sets a figure above both filed estimates.", resolved_amount_cents: 1300000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "setup: GET /disagreement-records with round_id ${rnd} returns total_count == 1; DisagreementRecord.${dis}.variance_bps == 160, exec_amount_cents == 1258956684, leg_amount_cents == 1238956684"
            - "trigger: HTTP 422 and ${err} == ERR_OVERRIDE_OUT_OF_RANGE"
            - "DisagreementRecord.${dis}.status == OPEN, resolution_method == null, resolved_amount_cents == null"
            - "ConsensusRound.${rnd}.open_disagreement_count == 1"

      - name: midpoint_resolution_carrying_amount_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority 52 ERR_RESOLUTION_AMOUNT_NOT_ALLOWED]
          - endpoints[POST /disagreement-records/{id}/resolve]
        distinguishing_aspect: |
          resolved_amount_cents is conditionally forbidden: it is required by DIRECTOR_OVERRIDE and
          rejected for MIDPOINT / EXEC_VALUE / LEG_VALUE, so MIDPOINT plus an amount — even the
          arithmetically correct midpoint 1248956684 — returns ERR_RESOLUTION_AMOUNT_NOT_ALLOWED 422,
          while the identical call without the field resolves the record and derives the same figure.
        test_recipe:
          setup:
            - "The PIT-only variant of the DISPUTE fixture: one ACTIVE source, its PRORATED policy adjustment, and a legislative judgmental adjustment of -20000000, so the single OPEN DisagreementRecord carries exec 1258956684 / leg 1238956684 / variance 160 bps and the round is DISPUTED."
          setup_api_calls:
