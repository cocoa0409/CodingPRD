          setup: "Reference graph with ${pl1_id} ARMED (7 items, two of them ORD-2026-0001 commercials). No item has aired."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_mco
            - *op_qc
            - *op_pd
            - *tx1
            - *mux1
