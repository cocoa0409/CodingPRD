          Depth-3 cascade from claim settlement: accept_settlement (Claim) creates a
          replacement OrderLine (hop 1); the new line recomputes the order's
          promised_date (hop 2); the advanced promise demotes every CONFIRMED
          InstallEvent scheduled before it to TENTATIVE (hop 3). Each hop is caused
          by the previous hop, not by the original trigger; different trigger than
          the punch-verify cascade.
