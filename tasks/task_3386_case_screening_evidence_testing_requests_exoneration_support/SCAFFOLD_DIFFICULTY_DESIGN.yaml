            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_INVESTIGATION" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /evidence-items"
              payload: { case_id: "${case_id}", description: "Hat", evidence_type: "CLOTHING", custodian_type: "POLICE_PROPERTY", initial_sample_ng: 20 }
              as: EvidenceAnalyst
              captures: { item_id: $.data.id }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "START_SEARCH" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "MARK_LOCATED" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "CONFIRM_CUSTODY" }, as: EvidenceAnalyst }
            - call: "POST /testing-authorizations"
              payload: { case_id: "${case_id}", evidence_item_id: "${item_id}", kind: "AGREEMENT", terms: "STR" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { ta_id: $.data.id }
            - { call: "POST /testing-authorizations/${ta_id}/advance", payload: { event: "PROPOSE" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /testing-authorizations/${ta_id}/advance", payload: { event: "SIGN" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_TESTING" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /lab-analyses"
              payload: { evidence_item_id: "${item_id}", authorization_id: "${ta_id}", lab_name: "LabPrime", test_type: "DNA_STR", required_sample_ng: 5, scheduled_start: "2026-10-01T09:00:00Z", scheduled_end: "2026-10-05T17:00:00Z" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { lab_id: $.data.id }
            - { call: "POST /lab-analyses/${lab_id}/advance", payload: { event: "SHIP_SAMPLE" }, as: EvidenceAnalyst }
            - { call: "POST /lab-analyses/${lab_id}/advance", payload: { event: "RECORD_RESULT", outcome: "EXCLUSIONARY", actual_consumed_ng: 5, profile_obtained: true }, as: EvidenceAnalyst }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_LITIGATION" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /legal-petitions"
              payload: { case_id: "${case_id}", petition_type: "HABEAS_CORPUS", court_name: "US District Court", claim_basis: "PROCEDURAL" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { pet_id: $.data.id }
            - { call: "POST /legal-petitions/${pet_id}/advance", payload: { event: "FILE" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /legal-petitions/${pet_id}/advance", payload: { event: "RECORD_DECISION", decision: "GRANTED", vacates_conviction: true }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /reentry-providers"
              payload: { name: "SecondChance Staffing", service_type: "EMPLOYMENT", total_capacity: 1 }
              as: ClientServicesAdvocate
              captures: { prov_id: $.data.id, slots0: $.data.slots_in_use }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-02T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /reentry-referrals"
              payload: { case_id: "${case_id}", provider_id: "${prov_id}", service_start: "2027-03-01T00:00:00Z", service_end: "2027-03-10T00:00:00Z" }
              as: ClientServicesAdvocate
              captures: { ref1: $.data.id }
            - { call: "POST /reentry-referrals/${ref1}/advance", payload: { event: "ACTIVATE" }, as: ClientServicesAdvocate }
            - call: "GET /reentry-providers/${prov_id}"
              as: ClientServicesAdvocate
              captures: { slots_active: $.data.slots_in_use }
            - { call: "POST /reentry-referrals/${ref1}/advance", payload: { event: "COMPLETE" }, as: ClientServicesAdvocate }
            - call: "GET /reentry-providers/${prov_id}"
              as: ClientServicesAdvocate
              captures: { slots_done: $.data.slots_in_use }
            - call: "POST /reentry-referrals"
              payload: { case_id: "${case_id}", provider_id: "${prov_id}", service_start: "2027-03-05T00:00:00Z", service_end: "2027-03-15T00:00:00Z" }
              as: ClientServicesAdvocate
              captures: { ref2: $.data.id }
            - { call: "POST /reentry-referrals/${ref2}/advance", payload: { event: "CANCEL" }, as: ClientServicesAdvocate }
            - call: "GET /reentry-providers/${prov_id}"
              as: ClientServicesAdvocate
              captures: { slots_final: $.data.slots_in_use, total: $.data.total_capacity }
          assert:
            - "create R1: slots_in_use 0 -> 1 (forward action occupies the slot)"
            - "ACTIVATE leaves slots_in_use == 1 (PENDING already occupied it — the count tracks live referrals, not window phase)"
            - "COMPLETE releases: slots_in_use == 0 — create+complete conserve the pool"
            - "create R2 then CANCEL: slots_in_use returns to 0 — create+cancel conserve the pool"
            - "total_capacity == 1 throughout (pool size is invariant; only occupancy moves)"
            - "invariant restated: slots_in_use == count of the provider's referrals in {PENDING, ACTIVE} at every read"
