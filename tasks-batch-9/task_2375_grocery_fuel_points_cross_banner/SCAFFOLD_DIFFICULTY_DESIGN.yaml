              captures: { bpe_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bpe_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cpe_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bpe_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cpe_sep_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bpe_id}", site_number: "G-016", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g16_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bpe_id}", site_number: "P-003", site_type: "PARTNER_STATION", partner_code: "PTR-003", per_gallon_cap_cents: 30, max_gallons_per_redemption: 20 }
              as: ProgramAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${bpe_id}", alt_id: "5550000016", card_number: "4000000000000016", full_name: "Pat Period" }
              as: ProgramAdmin
              captures: { m16_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m16_id}", site_id: "${g16_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g16_id}"
              captures: { t16_id: $.data.id }
            - call: "POST /purchase-transactions/${t16_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g16_id}"
            - call: "GET /members/${m16_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${p3_id}"
              captures: { mv16: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${m16_id}", site_id: "${p3_id}", alt_id_presented: "5550000016", points_committed: 300, expected_member_version: "${mv16}" }
              as: PumpTerminal
              as_user_id: "${p3_id}"
              captures: { r16_id: $.data.id }
            - call: "POST /fuel-redemptions/${r16_id}/complete"
              payload: { gallons_dispensed: 12.345 }
              as: PumpTerminal
              as_user_id: "${p3_id}"
            - call: "GET /sites/${p3_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${p3_id}"
              captures: { sv16a: $.data.version }
            - call: "POST /settlement-batches"
              payload: { site_id: "${p3_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", expected_site_version: "${sv16a}" }
              as: SettlementClerk
              as_user_id: "${p3_id}"
              captures: { sba_id: $.data.id }
            - call: "POST /settlement-batches/${sba_id}/submit"
              payload: {}
              as: SettlementClerk
              as_user_id: "${p3_id}"
          trigger:
            - call: "GET /sites/${p3_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${p3_id}"
              captures: { sv16b: $.data.version }
            - call: "POST /settlement-batches"
              payload: { site_id: "${p3_id}", period_start: "2026-08-15T00:00:00Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${sv16b}" }
              as: SettlementClerk
              as_user_id: "${p3_id}"
              captures: { err_id6: $.data.error_id }
            - call: "GET /sites/${p3_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${p3_id}"
              captures: { sv16c: $.data.version }
            - call: "POST /settlement-batches"
              payload: { site_id: "${p3_id}", period_start: "2026-08-15T00:00:00.001Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${sv16c}" }
              as: SettlementClerk
              as_user_id: "${p3_id}"
              captures: { sbb_id: $.data.id }
            - call: "GET /sites/${p3_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${p3_id}"
              captures: { sv16d: $.data.version }
            - call: "POST /settlement-batches"
              payload: { site_id: "${p3_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T23:59:59.999Z", expected_site_version: "${sv16d}" }
              as: SettlementClerk
              as_user_id: "${p3_id}"
              captures: { err_id7: $.data.error_id }
          assert:
            - "the touching-period create returned HTTP 409 and ${err_id6} == \"ERR_BATCH_PERIOD_OVERLAP\""
            - "the one-millisecond-later create returned HTTP 201 and SettlementBatch.${sbb_id}.status == \"DRAFT\""
            - "the September create returned HTTP 409 and ${err_id7} == \"ERR_OPEN_BATCH_LIMIT\""
            - "SettlementBatch.${sba_id}.status == \"SUBMITTED\""
            - "GET /settlement-batches?site_id=${p3_id} returns meta total_count == 2"

  # =========================================================================
  # Rule 9 — compensating_invariant (different invariants)
  #   * member ledger sum == available_points after a redemption void
  #   * partner unbatched pool restored exactly after a batch rejection
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: redemption_void_restores_member_ledger_sum_without_deleting_history
        grounds:
          - state_machines.FuelRedemption.AUTHORIZED_NOT_APPLICABLE_to_VOIDED_NOT_APPLICABLE
          - calculations.member_balance_projection
          - entities.PointLedgerEntry.fields.points_delta
          - entities.Member.fields.available_points
        distinguishing_aspect: |
          The invariant is Member.available_points == the sum of that member's
          PointLedgerEntry.points_delta rows, and the compensation must restore it
          by APPENDING a REDEMPTION_RELEASE row rather than deleting the
          REDEMPTION row: the balance returns to 500 with exactly three immutable
          ledger rows and Member.version at 4. This invariant is the member-side
          points ledger, distinct from the partner-side cash pool.
        test_recipe:
          setup:
            - "Banner B_INV on defaults; cycles 2026-08 (OPEN) and 2026-09 exist; clock at 2026-08-05T10:00:00Z."
            - "Grocery site G17; owned fuel center F17; Member M17 created fresh (version 1)."
            - "One POSTED basket worth 500 points (version 2), then one AUTHORIZED redemption committing 400 points (version 3), leaving available_points 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "INV", name: "Invariant Banner" }
              as: ProgramAdmin
              captures: { biv_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${biv_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { civ_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${biv_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { civ_sep_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${biv_id}", site_number: "G-017", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g17_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${biv_id}", site_number: "F-017", site_type: "OWNED_FUEL_CENTER" }
              as: ProgramAdmin
              captures: { f17_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${biv_id}", alt_id: "5550000017", card_number: "4000000000000017", full_name: "Quinn Invariant" }
              as: ProgramAdmin
              captures: { m17_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m17_id}", site_id: "${g17_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 50000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g17_id}"
              captures: { t17_id: $.data.id }
            - call: "POST /purchase-transactions/${t17_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g17_id}"
            - call: "GET /members/${m17_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${f17_id}"
              captures: { mv17: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${m17_id}", site_id: "${f17_id}", alt_id_presented: "5550000017", points_committed: 400, expected_member_version: "${mv17}" }
              as: PumpTerminal
              as_user_id: "${f17_id}"
              captures: { r17_id: $.data.id }
          trigger:
            - call: "POST /fuel-redemptions/${r17_id}/void"
              payload: {}
              as: PumpTerminal
              as_user_id: "${f17_id}"
              captures: { void_status: $.data.authorization_status }
          assert:
            - "${void_status} == \"VOIDED\""
            - "Member.${m17_id}.available_points == 500"
            - "Member.${m17_id}.lifetime_points == 500"
            - "Member.${m17_id}.version == 4 (compensation is a new write, not a rollback of version 3)"
            - "GET /point-ledger-entries?member_id=${m17_id} returns meta total_count == 3"
            - "the three points_delta values are 500, -400 and 400 and they sum to 500, exactly Member.available_points"
            - "GET /point-ledger-entries?member_id=${m17_id}&entry_type=REDEMPTION returns meta total_count == 1 and data[0].points_delta == -400 (the original debit row is preserved, not deleted)"
            - "GET /point-ledger-entries?member_id=${m17_id}&entry_type=REDEMPTION_RELEASE returns meta total_count == 1, data[0].points_delta == 400 and data[0].source_kind == \"FUEL_REDEMPTION\""

      - name: batch_rejection_restores_partner_unbatched_pool_to_the_exact_cent
        grounds:
          - state_machines.SettlementBatch.SUBMITTED_to_REJECTED
          - entities.Site.fields.unbatched_gallons
          - entities.Site.fields.unbatched_discount_cents
          - calculations.settlement_batch_reimbursement
        distinguishing_aspect: |
          The invariant is the partner's unbatched pool: submission drains
          12.345 gallons and 370 cents out of it, and rejection must put back
          exactly those figures to the third decimal and the cent while zeroing
          the batch's computed money fields and leaving Site.settlement_balance_cents
          at 0 because nothing was ever approved. This is the partner-side cash
          pool, a different invariant from the member points ledger.
        test_recipe:
          setup:
            - "Banner B_POOL on defaults; cycles 2026-08 (OPEN) and 2026-09 exist; clock at 2026-08-05T10:00:00Z."
            - "Grocery site G18; partner station P4 with partner_code, per_gallon_cap_cents 30 and max_gallons_per_redemption 20."
            - "Member M18 with 300 accrued points and one DISPENSED redemption at P4 of 12.345 gallons for 370 cents of discount, so P4.unbatched_gallons is 12.345, P4.unbatched_discount_cents is 370 and P4.settlement_balance_cents is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "POOL", name: "Pool Banner" }
              as: ProgramAdmin
              captures: { bpo_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bpo_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cpo_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bpo_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cpo_sep_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bpo_id}", site_number: "G-018", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g18_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bpo_id}", site_number: "P-004", site_type: "PARTNER_STATION", partner_code: "PTR-004", per_gallon_cap_cents: 30, max_gallons_per_redemption: 20 }
              as: ProgramAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${bpo_id}", alt_id: "5550000018", card_number: "4000000000000018", full_name: "Rae Pool" }
              as: ProgramAdmin
              captures: { m18_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m18_id}", site_id: "${g18_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g18_id}"
              captures: { t18_id: $.data.id }
            - call: "POST /purchase-transactions/${t18_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g18_id}"
            - call: "GET /members/${m18_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${p4_id}"
              captures: { mv18: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${m18_id}", site_id: "${p4_id}", alt_id_presented: "5550000018", points_committed: 300, expected_member_version: "${mv18}" }
              as: PumpTerminal
              as_user_id: "${p4_id}"
              captures: { r18_id: $.data.id }
            - call: "POST /fuel-redemptions/${r18_id}/complete"
              payload: { gallons_dispensed: 12.345 }
              as: PumpTerminal
              as_user_id: "${p4_id}"
              captures: { r18_discount: $.data.discount_amount_cents }
            - call: "GET /sites/${p4_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${p4_id}"
              captures: { sv18: $.data.version, pool_gallons_before: $.data.unbatched_gallons, pool_cents_before: $.data.unbatched_discount_cents }
            - call: "POST /settlement-batches"
              payload: { site_id: "${p4_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${sv18}" }
              as: SettlementClerk
              as_user_id: "${p4_id}"
              captures: { sb18_id: $.data.id }
            - call: "POST /settlement-batches/${sb18_id}/submit"
              payload: {}
              as: SettlementClerk
              as_user_id: "${p4_id}"
              captures: { sb18_reimb: $.data.reimbursement_cents }
          trigger:
            - call: "POST /settlement-batches/${sb18_id}/reject"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { sb18_status_after: $.data.status, sb18_reimb_after: $.data.reimbursement_cents }
          assert:
            - "${r18_discount} == 370"
            - "${pool_gallons_before} == 12.345 and ${pool_cents_before} == 370"
            - "${sb18_reimb} == 310 (12.345 gallons is the LOW tier: 370 x 0.85 = 314.5 -> 315, fee 315 x 0.015 = 4.725 -> 5, net 310)"
            - "${sb18_status_after} == \"REJECTED\""
            - "${sb18_reimb_after} == 0"
            - "SettlementBatch.${sb18_id}.gallons_total == 0.000 and SettlementBatch.${sb18_id}.gross_discount_cents == 0 and SettlementBatch.${sb18_id}.tier_rate_pct == 0 and SettlementBatch.${sb18_id}.admin_fee_cents == 0"
            - "Site.${p4_id}.unbatched_gallons == 12.345 and Site.${p4_id}.unbatched_discount_cents == 370"
            - "Site.${p4_id}.settlement_balance_cents == 0"
            - "FuelRedemption.${r18_id}.settlement_status == \"PENDING\" and FuelRedemption.${r18_id}.settlement_batch_id == null"
            - "FuelRedemption.${r18_id}.authorization_status == \"DISPENSED\""
