              as: LogisticsCoordinator
            - call: "POST /api/shipments"
              payload: { lane_id: "${k_lane_bc}", bushels: 5000, departure_date: "2026-09-12T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { k_ship_bc2: $.data.id }
          assert:
            - "the 09-12 departure first fails 409 ERR_BARGE_SCHEDULE_OVERLAP (inside [09-10, 09-15))"
            - "after cancelling shipment 1, the identical 09-12 departure books 201 — cancellation freed the interval"
            - "Elevator.${k_elev_id}.stored_bushels == 15000 after the rebook (cancel restored 5000, rebook drew 5000)"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shapes
        claim_type: Standard CRUD
        grounds: [response_envelope, endpoints.POST_/api/farmers, "endpoints.GET_/api/origination-contracts/{id}"]
        distinguishing_aspect: "The fixed envelope is honored on both paths: success carries meta.api_request_id + meta.api_request_timestamp + response_type object + data; failure carries response_type error + data.error_id + data.message."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /api/farmers"
              payload: { legal_name: "Env Check", county: "Knox" }
              as: PlatformAdmin
              captures: { k_env_farm: $.data.id }
            - call: "GET /api/origination-contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OriginationMerchandiser
              captures: { k_env_err: $.data.error_id }
          assert:
            - "create response: 201, response_type == object, meta.api_request_id and meta.api_request_timestamp non-null, data.id == ${k_env_farm}"
            - "error response: 404, response_type == error, data.error_id == ERR_CONTRACT_NOT_FOUND and data.message non-empty"

      - name: shipment_freight_cost_and_arrival_computed
        claim_type: Computed read
        grounds: [entities.Shipment.fields.freight_cost_cents, entities.Shipment.fields.arrival_date]
        distinguishing_aspect: "Booking computes freight_cost_cents == 2000 bu x 12 cents == 24000 and arrival_date == departure 2026-09-10 + 2 transit days == 2026-09-12T00:00:00Z, both purely server-side."
        test_recipe:
          setup: ["Elevator holding 5000 bu; TRUCK lane freight 12, transit 2."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - *k_plant
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "CASH", quantity_bushels: 5000, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { k_ctr_sh: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${k_ctr_sh}", gross_bushels: 5000, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { k_tkt_sh: $.data.id }
            - call: "POST /api/delivery-tickets/${k_tkt_sh}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "POST /api/freight-lanes"
              payload: { origin_elevator_id: "${k_elev_id}", destination_plant_id: "${k_plant_id}", mode: "TRUCK", freight_cents_per_bushel: 12, transit_days: 2, daily_capacity_bushels: 50000 }
              as: LogisticsCoordinator
              captures: { k_lane_sh: $.data.id }
          trigger:
            - call: "POST /api/shipments"
              payload: { lane_id: "${k_lane_sh}", bushels: 2000, departure_date: "2026-09-10T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { k_ship_sh: $.data.id }
          assert:
            - "Shipment.${k_ship_sh}.freight_cost_cents == 24000"
            - "Shipment.${k_ship_sh}.arrival_date == 2026-09-12T00:00:00Z"
            - "Shipment.${k_ship_sh}.status == BOOKED with draws covering exactly 2000 bushels"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_elevator_at_capacity_on_gate_and_apply
        claim_type: violation_to_error
        grounds: [errors.ERR_ELEVATOR_AT_CAPACITY]
        excluded_because:
          difficulty_instance: ticket_apply_cascades_through_position_to_elevator_gate
          rationale: "Asserted as the terminal rejection of the apply cascade and again as the exact-fill boundary in elevator_capacity_exact_fill_then_gate."
      - name: error_plant_capacity_exceeded_on_second_same_day_run
        claim_type: violation_to_error
        grounds: [errors.ERR_PLANT_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: plant_daily_aggregate_capacity
          rationale: "Asserted as the failure path of the named Rule 8 instance."
      - name: error_barge_schedule_overlap_on_overlapping_departure
        claim_type: violation_to_error
        grounds: [errors.ERR_BARGE_SCHEDULE_OVERLAP]
        excluded_because:
          difficulty_instance: barge_lane_half_open_interval_overlap
          rationale: "Asserted as the failure path of the named Rule 8 instance."
      - name: error_contract_not_pricable_on_settled_contract
        claim_type: violation_to_error
        grounds: [errors.ERR_CONTRACT_NOT_PRICABLE]
        excluded_because:
          difficulty_instance: state_beats_constraint_on_settled_contract_election
          rationale: "Asserted as the winning error of the named Rule 5 priority conflict."
      - name: error_run_date_in_past_on_past_schedule
        claim_type: violation_to_error
        grounds: [errors.ERR_RUN_DATE_IN_PAST]
        excluded_because:
          difficulty_instance: temporal_beats_fiscal_on_past_dated_negative_margin_schedule
          rationale: "Asserted as the winning error of the named Rule 5 priority conflict."
      - name: error_program_closed_on_contract_create
        claim_type: violation_to_error
        grounds: [errors.ERR_PROGRAM_CLOSED]
        excluded_because:
          difficulty_instance: contract_create_requires_program_active
          rationale: "Asserted as the failure path of the named Rule 7 instance."
      - name: error_plant_not_active_on_run_schedule
        claim_type: violation_to_error
        grounds: [errors.ERR_PLANT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: run_schedule_requires_plant_active
          rationale: "Asserted as the failure path of the named Rule 7 instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: farmer_cannot_read_others_contract
        claim_type: RBAC denial
        grounds: [roles.Farmer, "endpoints.GET_/api/origination-contracts/{id}", errors.ERR_FORBIDDEN]
        distinguishing_aspect: "Farmer is entity_backed:Farmer — a Farmer caller whose X-User-ID names a DIFFERENT farmer than the contract's farmer_id is denied 403 ERR_FORBIDDEN even though the role itself is allowed on the endpoint."
        test_recipe:
          setup: ["Two farmers A and B; a CASH contract belonging to farmer A."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - call: "POST /api/farmers"
              payload: { legal_name: "B. Neighbor", county: "Knox" }
              as: PlatformAdmin
              captures: { k_farm_b: $.data.id }
            - *k_ctr_cash
          trigger:
            - call: "GET /api/origination-contracts/${k_ctr_cash_id}"
              payload: {}
              as: Farmer
              as_user_id: "${k_farm_b}"
              captures: { k_err21: $.data.error_id }
          assert:
            - "response 403 with error_id ERR_FORBIDDEN (ownership check: ${k_farm_b} != contract farmer ${k_farm_id})"

      - name: farmer_can_price_own_contract
        claim_type: RBAC allowance
        grounds: [roles.Farmer, "endpoints.POST_/api/origination-contracts/{id}/pricing-elections"]
        distinguishing_aspect: "The same ownership rule passes when X-User-ID == farmer_id: the farmer prices its own DEFERRED contract 200."
        test_recipe:
          setup: ["Farmer; DEFERRED contract 500 bu for that farmer, futures 2026-12 quoted 1100."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1100, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "DEFERRED", quantity_bushels: 500, futures_month: "2026-12", pricing_deadline: "2026-12-15T00:00:00Z", storage_rate_cents_per_bushel_day: 1 }
              as: OriginationMerchandiser
              captures: { k_ctr_own: $.data.id, k_ctr_own_v: $.data.version }
          trigger:
            - call: "POST /api/origination-contracts/${k_ctr_own}/pricing-elections"
              payload: { bushels: 200, expected_contract_version: "${k_ctr_own_v}" }
              as: Farmer
              as_user_id: "${k_farm_id}"
          assert:
            - "response 200: pricing_status == PARTIALLY_PRICED with priced_bushels == 200"
            - "the election unit_price_cents == 1100 (farmer self-service pricing at the as-of futures quote)"

      - name: buyer_cannot_read_others_sales_contract
        claim_type: RBAC denial
        grounds: [roles.CommercialBuyer, "endpoints.GET_/api/product-sales-contracts/{id}", errors.ERR_FORBIDDEN]
        distinguishing_aspect: "CommercialBuyer is entity_backed:Buyer — reading a sales contract whose buyer_id differs from X-User-ID is denied 403."
        test_recipe:
          setup: ["Two buyers; a SOY_OIL contract belonging to buyer 1."]
          setup_api_calls:
            - *k_clock
            - *k_plant
            - *k_buyer
            - call: "POST /api/buyers"
              payload: { company_name: "Rival Feeds Inc" }
              as: PlatformAdmin
              captures: { k_buyer_b: $.data.id }
            - call: "POST /api/product-sales-contracts"
              payload: { buyer_id: "${k_buyer_id}", plant_id: "${k_plant_id}", product: "SOY_OIL", quantity_lbs: 1000, price_cents_per_lb: 20, delivery_window_start: "2026-09-15T00:00:00Z", delivery_window_end: "2026-09-30T00:00:00Z", max_ffa_pct: 0.5 }
              as: ProductMerchandiser
              captures: { k_sale_r: $.data.id }
          trigger:
            - call: "GET /api/product-sales-contracts/${k_sale_r}"
              payload: {}
              as: CommercialBuyer
              as_user_id: "${k_buyer_b}"
              captures: { k_err22: $.data.error_id }
          assert:
            - "response 403 with error_id ERR_FORBIDDEN (${k_buyer_b} != contract buyer ${k_buyer_id})"

      - name: scheduler_cannot_confirm_hedge
        claim_type: RBAC denial
        grounds: [roles.RiskManager, "endpoints.POST_/api/board-crush-positions/{id}/confirm", errors.ERR_FORBIDDEN]
        distinguishing_aspect: "Hedge confirm is RiskManager-exclusive: a PlantScheduler caller is denied 403 regardless of user id — the role gate fires before the segregation-of-duties check."
        test_recipe:
          setup: ["Quotes on file; one ENTERED position."]
          setup_api_calls:
            - *k_clock
            - *k_qb
            - *k_qo
            - *k_qm
            - call: "POST /api/board-crush-positions"
              payload: { futures_month: "2026-11", bean_lots_long: 1, oil_lots_short: 1, meal_lots_short: 1, expiry_date: "2026-11-13T00:00:00Z" }
              as: CrushTrader
              as_user_id: "trader-77"
              captures: { k_pos_r: $.data.id }
          trigger:
            - call: "POST /api/board-crush-positions/${k_pos_r}/confirm"
              payload: {}
              as: PlantScheduler
              as_user_id: "sched-1"
              captures: { k_err23: $.data.error_id }
          assert:
            - "response 403 with error_id ERR_FORBIDDEN (role not in the endpoint's roles)"
            - "BoardCrushPosition.${k_pos_r}.status remains ENTERED"

      - name: merchandiser_cannot_set_clock
        claim_type: RBAC denial
        grounds: [roles.PlatformAdmin, "endpoints.POST_/api/_clock/set_current_utc", errors.ERR_FORBIDDEN]
        distinguishing_aspect: "The logical clock is PlatformAdmin-exclusive; any other role is denied 403 ERR_FORBIDDEN and the clock does not move."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: OriginationMerchandiser
              captures: { k_err24: $.data.error_id }
          assert:
            - "response 403 with error_id ERR_FORBIDDEN"
            - "a subsequent PlatformAdmin clock read-path (carry assessment quotes) still behaves as of 2026-09-01"

      - name: sod_same_user_cannot_confirm_own_entry
        claim_type: RBAC denial
        grounds: [roles.RiskManager, errors.ERR_SEGREGATION_OF_DUTIES, entities.BoardCrushPosition.fields.entered_by_user_id]
        distinguishing_aspect: "Segregation of duties: a RiskManager whose X-User-ID equals the entering trader's id is rejected 403 ERR_SEGREGATION_OF_DUTIES; the same endpoint with a different RiskManager user succeeds — the rule keys on user identity, not role."
        test_recipe:
          setup: ["Quotes on file; position ENTERED by trader-77."]
          setup_api_calls:
            - *k_clock
            - *k_qb
            - *k_qo
            - *k_qm
            - call: "POST /api/board-crush-positions"
              payload: { futures_month: "2026-11", bean_lots_long: 1, oil_lots_short: 1, meal_lots_short: 1, expiry_date: "2026-11-13T00:00:00Z" }
              as: CrushTrader
              as_user_id: "trader-77"
              captures: { k_pos_s: $.data.id }
          trigger:
            - call: "POST /api/board-crush-positions/${k_pos_s}/confirm"
              payload: {}
              as: RiskManager
              as_user_id: "trader-77"
              captures: { k_err25: $.data.error_id }
            - call: "POST /api/board-crush-positions/${k_pos_s}/confirm"
              payload: {}
              as: RiskManager
              as_user_id: "rm-9"
          assert:
            - "confirm as trader-77 fails 403 ERR_SEGREGATION_OF_DUTIES (same person entered and confirmed)"
            - "confirm as rm-9 succeeds 200: status CONFIRMED, confirmed_by_user_id == \"rm-9\""

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_contract_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-pricing-stale-version]", errors.ERR_STALE_CONTRACT_VERSION]
        distinguishing_aspect: "OCC on OriginationContract.version: a first election carrying the observed version succeeds and bumps it; a second strictly-sequential election replaying the SAME captured version is rejected 412 ERR_STALE_CONTRACT_VERSION — the stale write is refused even though every other rule would pass."
        test_recipe:
          setup: ["DEFERRED contract 1000 bu (deadline 2026-12-15), futures 2026-12 quoted 1100; captured version at creation."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1100, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "DEFERRED", quantity_bushels: 1000, futures_month: "2026-12", pricing_deadline: "2026-12-15T00:00:00Z", storage_rate_cents_per_bushel_day: 1 }
              as: OriginationMerchandiser
              captures: { k_ctr_o_id: $.data.id, k_ctr_o_v: $.data.version }
            - call: "POST /api/origination-contracts/${k_ctr_o_id}/pricing-elections"
              payload: { bushels: 100, expected_contract_version: "${k_ctr_o_v}" }
              as: OriginationMerchandiser
          trigger:
            - call: "POST /api/origination-contracts/${k_ctr_o_id}/pricing-elections"
              payload: { bushels: 100, expected_contract_version: "${k_ctr_o_v}" }
              as: OriginationMerchandiser
              captures: { k_err26: $.data.error_id }
          assert:
            - "the first election (fresh version) succeeds and bumps contract.version"
            - "the second election (same captured version) fails 412 ERR_STALE_CONTRACT_VERSION"
            - "priced_bushels == 100 (only the first election landed)"

      - name: occ_stale_run_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[run-schedule-stale-version]", errors.ERR_STALE_RUN_VERSION]
        distinguishing_aspect: "OCC on CrushRun.version: after a schedule and a revert (two version bumps), replaying the originally captured version on a fresh schedule call is rejected 412 ERR_STALE_RUN_VERSION."
        test_recipe:
          setup: ["ACTIVE plant, quotes 1200/55/17; run created (version captured), then scheduled, then reverted to PLANNED."]
          setup_api_calls:
            - *k_clock
            - *k_plant
            - *k_qb
            - *k_qo
            - *k_qm
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${k_plant_id}", run_date: "2026-09-10T00:00:00Z", planned_bushels: 1000, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { k_run_o_id: $.data.id, k_run_o_v: $.data.version }
            - call: "POST /api/crush-runs/${k_run_o_id}/schedule"
              payload: { expected_run_version: "${k_run_o_v}" }
              as: PlantScheduler
            - call: "POST /api/crush-runs/${k_run_o_id}/transitions"
              payload: { to_status: "PLANNED" }
              as: PlantScheduler
          trigger:
            - call: "POST /api/crush-runs/${k_run_o_id}/schedule"
              payload: { expected_run_version: "${k_run_o_v}" }
              as: PlantScheduler
              captures: { k_err27: $.data.error_id }
          assert:
            - "the replayed schedule fails 412 ERR_STALE_RUN_VERSION (version advanced by the schedule+revert cycle)"
            - "CrushRun.${k_run_o_id}.status remains PLANNED"

      - name: elevator_gate_threshold_flip_at_capacity
        claim_type: rate_threshold_triggers
        grounds: [entities.Elevator.fields.receiving_open]
        excluded_because:
          difficulty_instance: elevator_capacity_exact_fill_then_gate
          rationale: "The gate flip at exactly capacity is asserted step-by-step in the named Rule 6 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_apply_visible_on_next_read
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, "endpoints.POST_/api/delivery-tickets/{id}/apply"]
        distinguishing_aspect: "Immediate consistency: the very next GET after an apply (no wait, no polling) shows the contract's delivered_bushels, fulfillment_status, and updated_at all advanced — the mutation is complete inside the apply request."
        test_recipe:
          setup: ["CASH contract 100 bu; clean 50-bu ticket created."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - *k_ctr_cash
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${k_ctr_cash_id}", gross_bushels: 50, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { k_tkt_ic: $.data.id }
          trigger:
            - call: "POST /api/delivery-tickets/${k_tkt_ic}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/origination-contracts/${k_ctr_cash_id}"
              payload: {}
              as: OriginationMerchandiser
          assert:
            - "the apply response itself carries the ticket with status APPLIED and net_bushels == 50 (in-request visibility)"
            - "the immediately following GET shows OriginationContract.${k_ctr_cash_id}.delivered_bushels == 50 and fulfillment_status == DELIVERING"
            - "the contract's updated_at advanced past its creation timestamp and version incremented"
