          trigger:
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${l1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-31T00:00:00Z"}, as: Veterinarian, captures: {e1: "$.data.error_id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "EGG_LOT", subject_id: "${f1}", test_code: "SHELL_SURFACE_TVC", collected_at: "2026-07-31T00:00:00Z"}, as: Veterinarian, captures: {e2: "$.data.error_id"}}
