  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (two DIFFERENT metrics AND endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: participant_count_exactly_100_audit_threshold
        grounds:
          - calculations.participant_count_determination
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Metric = eligible headcount, endpoint = recompute_participant_count:
          exactly 100 participants crosses the audit threshold (>= is
          boundary-inclusive -> Schedule H), while 99 stays a small plan
          (Schedule I) — tested without the 80-120 election in play.
        test_recipe:
          setup:
            - "Two engagements (plans 012/013), prior_year_schedule_type NONE_FIRST_YEAR, no election; 100 vs 99 ACTIVE eligible participants"
