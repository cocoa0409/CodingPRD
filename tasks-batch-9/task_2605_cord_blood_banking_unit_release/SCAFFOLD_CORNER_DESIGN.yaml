          rationale: "That §1.8 instance computes PRE_CRYO and POST_THAW on identical inputs, asserts the exact delta and shows the release gate reading only the POST_THAW value; the storage-fee and settlement variants are covered by storage_fee_variant_prorated_termination_vs_anniversary_accrual and disposition_settlement_tier_keyed_on_pre_fee_subtotal_mode_c."

