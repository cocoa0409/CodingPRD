          trigger:
            - call: "GET /library/affiliates"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "status 401 and data.error_id == \"ERR_UNAUTHENTICATED\" (headers omitted at runtime)"

  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_exclusive_operation_denials
        claim_type: Violation → Error
        grounds:
          - roles.AdvisoryCommitteeMember
          - roles.PlatformAdmin
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Each exclusive operation denies other roles with 403: committee member cannot register children, coordinator cannot approve agreements, publisher cannot set the clock, MailOps cannot confirm print orders."
        test_recipe:
          setup: ["Bootstrap core; affiliate A operative; one agreement pending decision... (agreement created, then a second created for the deny test) — concretely: affiliate A with approved agreement; title; APPROVED selection with SUBMITTED order."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - *t_inf
            - *s_inf_o
            - *s_inf_o_ok
            - *p_inf_o
          trigger:
            - call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Role Test", family_name: "Test", birth_date: "2026-03-01T00:00:00Z", mailing_address: { line1: "1 R St", city: "Nashville", region: "TN", postal_code: "37201", country: "US" } }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { e1: $.data.error_id }
            - call: "GET /library/affiliates/${aff_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { aff_a_v_now: $.data.version }
            - call: "POST /library/affiliates/${aff_a_id}/agreements"
              payload: { effective_from: "2028-01-01T00:00:00Z", effective_to: "2029-01-01T00:00:00Z", local_fundraising_commitment_cents: 100, expected_affiliate_version: "${aff_a_v_now}" }
              as: PlatformAdmin
              captures: { agr_deny: $.data.id }
            - call: "POST /library/agreements/${agr_deny}/approve"
              payload: {}
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PublisherOps
              captures: { e3: $.data.error_id }
            - call: "POST /library/print-orders/${po_inf_o}/confirm"
              payload: {}
              as: MailOps
              captures: { e4: $.data.error_id }
          assert:
            - "e1 == ERR_FORBIDDEN (AdvisoryCommitteeMember cannot POST /library/children)"
            - "e2 == ERR_FORBIDDEN (AffiliateCoordinator cannot approve agreements)"
            - "e3 == ERR_FORBIDDEN (PublisherOps cannot set the clock)"
            - "e4 == ERR_FORBIDDEN (MailOps cannot confirm print orders)"

      - name: coordinator_cannot_register_into_other_affiliate
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - roles.AffiliateCoordinator
        distinguishing_aspect: "Entity-backed identity: a coordinator whose X-User-ID is affiliate B's id cannot register a child naming affiliate A — 403 even though the role is correct and the affiliate exists."
        test_recipe:
          setup: ["Bootstrap core: affiliate A operative; affiliate B (prefixes [371]) also created (agreement irrelevant to the denial)."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - &aff_b
              call: "POST /library/affiliates"
              payload: { name: "Memphis Shelby Books", state_program_id: "${prog_id}", postal_prefixes: ["371"], contact_email: "coord@msb.org" }
              as: PlatformAdmin
              captures: { aff_b_id: $.data.id, aff_b_v: $.data.version }
          trigger:
            - call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Cross Town", family_name: "Town", birth_date: "2026-03-01T00:00:00Z", mailing_address: { line1: "1 X St", city: "Nashville", region: "TN", postal_code: "37201", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 403 and data.error_id == \"ERR_FORBIDDEN\""
            - "Affiliate.${aff_a_id}.enrolled_count remains 0"

      - name: officer_cannot_approve_cross_program_agreement
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - roles.StateProgramOfficer
        distinguishing_aspect: "A StateProgramOfficer's X-User-ID is the program's id: approving an agreement whose affiliate belongs to a DIFFERENT program is 403, even though the same officer can approve their own program's agreements."
        test_recipe:
          setup: ["Program TN (officer) and program GA; affiliate under GA with a pending agreement."]
          setup_api_calls:
            - *c_sep
            - *prog
            - call: "POST /library/state-programs"
              payload: { state_code: "GA", name: "GA Books Across", funding_share_bp: 5000, max_state_share_per_book_cents: 300 }
              as: PlatformAdmin
              captures: { prog_ga: $.data.id }
            - call: "POST /library/affiliates"
              payload: { name: "Atlanta Early Books", state_program_id: "${prog_ga}", postal_prefixes: ["303"], contact_email: "coord@aeb.org" }
              as: PlatformAdmin
              captures: { aff_ga: $.data.id, aff_ga_v: $.data.version }
            - call: "POST /library/affiliates/${aff_ga}/agreements"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", local_fundraising_commitment_cents: 2000000, expected_affiliate_version: "${aff_ga_v}" }
              as: AffiliateCoordinator
              as_user_id: "${aff_ga}"
              captures: { agr_ga: $.data.id }
          trigger:
            - call: "POST /library/agreements/${agr_ga}/approve"
              payload: {}
              as: StateProgramOfficer
              as_user_id: "${prog_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 403 and data.error_id == \"ERR_FORBIDDEN\""
            - "AffiliateAgreement.${agr_ga}.status remains PENDING_APPROVAL and decided_by is null"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: agreement_create_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-create-stale-affiliate]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC: after the first agreement create bumps affiliate.version 1 -> 2, a second create still carrying expected_affiliate_version 1 fails 412 ERR_STALE_VERSION; re-reading the affiliate and resending with 2 succeeds."
        test_recipe:
          setup: ["Clock set; program; affiliate (version 1 captured); one agreement already created (version now 2)."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
          trigger:
            - call: "POST /library/affiliates/${aff_a_id}/agreements"
              payload: { effective_from: "2028-01-01T00:00:00Z", effective_to: "2029-01-01T00:00:00Z", local_fundraising_commitment_cents: 6000000, expected_affiliate_version: "${aff_a_v}" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { err: $.data.error_id }
            - call: "GET /library/affiliates/${aff_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { aff_a_v2: $.data.version }
            - call: "POST /library/affiliates/${aff_a_id}/agreements"
              payload: { effective_from: "2028-01-01T00:00:00Z", effective_to: "2029-01-01T00:00:00Z", local_fundraising_commitment_cents: 6000000, expected_affiliate_version: "${aff_a_v2}" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { agr_ok2: $.data.id }
          assert:
            - "first trigger returns 412 with data.error_id == \"ERR_STALE_VERSION\" (expected_affiliate_version 1 is stale)"
            - "re-read shows Affiliate.${aff_a_id}.version == 2"
            - "retry with the fresh version returns 201 and AffiliateAgreement.${agr_ok2}.status == PENDING_APPROVAL"
            - "Affiliate.${aff_a_id}.version == 3 after the successful create"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: return_threshold_cascades_unenroll_and_recount
          rationale: "Depth-3 return cascade and the transfer cascade are asserted hop-by-hop in §1.8."

      - name: rate_threshold_trigger_covered
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.enrolled_count_reconciliation
        excluded_because:
          difficulty_instance: return_threshold_cascades_unenroll_and_recount
          rationale: "RETURN_AUTO_UNENROLL_THRESHOLD == 2 is exercised at 1 (hold) and exactly 2 (auto-unenroll)."

      - name: derived_field_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.stock_on_hand_reconciliation
          - calculations.enrolled_count_reconciliation
        excluded_because:
          difficulty_instance: transfer_conserves_global_enrollment_count
          rationale: "enrolled_count is asserted before/after transfer on both affiliates; stock_on_hand is asserted in manifest_response_reflects_items_and_stock_debit."

