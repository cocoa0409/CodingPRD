          - errors[ERR_DISPUTE_WINDOW_CLOSED]
          - validations[priority=17]
          - validations[priority=28]
        distinguishing_aspect: "DISPUTE fails twice for different reasons: while the bag is still DROPPED the priority-17 from-state check refuses it, and once counted the priority-28 window check refuses it at exactly dropped_at plus 72 hours because the window is half-open."
