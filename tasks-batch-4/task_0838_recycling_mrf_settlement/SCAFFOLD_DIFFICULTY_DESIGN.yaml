# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Recycling MRF & Commodity Settlement — Expert
# 9 Difficulty Rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_contamination_provisional_vs_final_on_load
        grounds:
          - calculations.contamination_adjustment
          - entities.InboundLoad.fields.provisional_adjustment_cents
          - entities.InboundLoad.fields.final_adjustment_cents
          - state_machines.InboundLoad.AUDITED_to_CLOSED
        distinguishing_aspect: |
          On InboundLoad: provisional adjustment uses the sampled contamination % at
          audit, final adjustment uses the residual-derived actual % at close; identical
          load yields +6000 provisional but -9000 final.
        test_recipe:
          setup:
            - "Municipality (share 0.60); SortLine; InboundLoad net_tons=20 (gross 22, tare 2); audited sampled_contamination_pct=4.0 -> provisional_adjustment_cents=+6000."
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.60 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 22, tare_tons: 2 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 4.0, audited_composition: [ { commodity: "OCC", pct: 98 } ] }
              as: ScaleOperator
              captures: { prov_adj: $.data.provisional_adjustment_cents }
          trigger:
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 3.0 }
              as: SortManager
              captures: { fin_adj: $.data.final_adjustment_cents }
          assert:
            - "InboundLoad.${load_id}.provisional_adjustment_cents == 6000"
            - "InboundLoad.${load_id}.final_adjustment_cents == -9000"
            - "provisional_adjustment_cents != final_adjustment_cents"

      - name: dual_bale_value_provisional_vs_final
        grounds:
          - calculations.bale_valuation
          - entities.Bale.fields.provisional_value_cents
          - entities.Bale.fields.final_value_cents
          - state_machines.Bale.SHIPPED_to_SETTLED
        distinguishing_aspect: |
          On Bale: provisional value uses the index snapshot at baling (8000 -> 76000),
          final value uses the settle-time index (9000) minus freight share (5000) ->
          80500; different entity domain from the contamination dual-variant.
        test_recipe:
          setup:
            - "Two OCC index windows: 8000 for [03-01,03-15), 9000 for [03-16,04-01), both PUBLISHED. Clock 2026-03-10. Load closed; bale net_tons=10, moisture 5, grade A (provisional 76000) assigned to a single-bale shipment freight 5000, shipped. Clock advanced to 2026-03-20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: CommodityTrader
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.60 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/mills"
              payload: { name: "Mill 1", commodity_focus: "OCC", freight_rate_cents_per_ton: 1000 }
              as: CommodityTrader
              captures: { mill_id: $.data.id }
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 8000, effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-03-15T00:00:00Z" }
              as: CommodityTrader
              captures: { idx1_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx1_id}/publish"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 9000, effective_start: "2026-03-16T00:00:00Z", effective_end: "2026-04-01T00:00:00Z" }
              as: CommodityTrader
              captures: { idx2_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx2_id}/publish"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 22, tare_tons: 2 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 4.0, audited_composition: [ { commodity: "OCC", pct: 98 } ] }
              as: ScaleOperator
            - call: "POST /mrf/bales"
              payload: { source_load_id: "${load_id}", commodity: "OCC", net_tons: 10, moisture_pct: 5, quality_grade: "A" }
              as: SortManager
              captures: { bale_id: $.data.id, prov_val: $.data.provisional_value_cents }
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 2.0 }
              as: SortManager
            - call: "POST /mrf/mill-shipments"
              payload: { mill_id: "${mill_id}", commodity: "OCC", freight_cost_cents: 5000 }
              as: CommodityTrader
              captures: { ship_id: $.data.id }
            - call: "POST /mrf/mill-shipments/${ship_id}/bales"
              payload: { bale_id: "${bale_id}" }
              as: CommodityTrader
            - call: "POST /mrf/mill-shipments/${ship_id}/ship"
              payload: {}
              as: CommodityTrader
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: CommodityTrader
          trigger:
            - call: "POST /mrf/mill-shipments/${ship_id}/settle"
              payload: {}
              as: CommodityTrader
          assert:
            - "Bale.${bale_id}.provisional_value_cents == 76000"
            - "Bale.${bale_id}.final_value_cents == 80500"
            - "provisional_value_cents != final_value_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bale_value_multi_input_grade_moisture_nonlinear
        grounds:
          - calculations.bale_valuation
          - entities.Bale.fields.provisional_value_cents
          - entities.Bale.fields.quality_grade
          - entities.Bale.fields.moisture_pct
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — effective_tons = net*(1-moisture/100),
          then tiered grade multiplier (C=0.75), then round; net 10, moisture 20, grade C, index
          8000 -> 48000.
        test_recipe:
          setup:
            - "PUBLISHED OCC index 8000 covering clock 2026-03-10; audited load; bale net 10 moisture 20 grade C."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: SortManager
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 8000, effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-04-01T00:00:00Z" }
              as: CommodityTrader
              captures: { idx_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx_id}/publish"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 30, tare_tons: 0 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 3.0, audited_composition: [ { commodity: "OCC", pct: 99 } ] }
              as: ScaleOperator
          trigger:
            - call: "POST /mrf/bales"
              payload: { source_load_id: "${load_id}", commodity: "OCC", net_tons: 10, moisture_pct: 20, quality_grade: "C" }
              as: SortManager
              captures: { bale_id: $.data.id }
          assert:
            - "Bale.${bale_id}.provisional_value_cents == 48000"

      - name: shipment_settlement_round_per_bale_then_sum
        grounds:
          - calculations.mill_shipment_settlement
          - calculations.bale_valuation
          - entities.MillShipment.fields.gross_settlement_cents
          - state_machines.MillShipment.SHIPPED_to_SETTLED
        distinguishing_aspect: |
          Mode (b): rounding order is pinned to round-per-bale-then-sum. Two grade-B bales
          (real value 7204.5 each at index 8005) round to 7205 each -> 14410, whereas
          sum-then-round would give 14409.
        test_recipe:
          setup:
            - "PUBLISHED OCC index 8005 covering [03-01,04-01). Clock 2026-03-10. Load (net 5) closed; two bales net 1, moisture 0, grade B assigned to shipment freight 0, shipped."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: CommodityTrader
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/mills"
              payload: { name: "Mill 1", commodity_focus: "OCC", freight_rate_cents_per_ton: 0 }
              as: CommodityTrader
              captures: { mill_id: $.data.id }
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 8005, effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-04-01T00:00:00Z" }
              as: CommodityTrader
              captures: { idx_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx_id}/publish"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 5, tare_tons: 0 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 3.0, audited_composition: [ { commodity: "OCC", pct: 99 } ] }
              as: ScaleOperator
            - call: "POST /mrf/bales"
              payload: { source_load_id: "${load_id}", commodity: "OCC", net_tons: 1, moisture_pct: 0, quality_grade: "B" }
              as: SortManager
              captures: { bale1_id: $.data.id }
            - call: "POST /mrf/bales"
              payload: { source_load_id: "${load_id}", commodity: "OCC", net_tons: 1, moisture_pct: 0, quality_grade: "B" }
              as: SortManager
              captures: { bale2_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 0 }
              as: SortManager
            - call: "POST /mrf/mill-shipments"
              payload: { mill_id: "${mill_id}", commodity: "OCC", freight_cost_cents: 0 }
              as: CommodityTrader
              captures: { ship_id: $.data.id }
            - call: "POST /mrf/mill-shipments/${ship_id}/bales"
              payload: { bale_id: "${bale1_id}" }
              as: CommodityTrader
            - call: "POST /mrf/mill-shipments/${ship_id}/bales"
              payload: { bale_id: "${bale2_id}" }
              as: CommodityTrader
            - call: "POST /mrf/mill-shipments/${ship_id}/ship"
              payload: {}
              as: CommodityTrader
          trigger:
            - call: "POST /mrf/mill-shipments/${ship_id}/settle"
              payload: {}
              as: CommodityTrader
              captures: { gross: $.data.gross_settlement_cents }
          assert:
            - "Bale.${bale1_id}.final_value_cents == 7205"
            - "Bale.${bale2_id}.final_value_cents == 7205"
            - "MillShipment.${ship_id}.gross_settlement_cents == 14410"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: inbound_load_reaudit_cycle
        grounds:
          - state_machines.InboundLoad.AUDITED_to_PENDING_REAUDIT
          - state_machines.InboundLoad.PENDING_REAUDIT_to_AUDITED
          - entities.InboundLoad.fields.provisional_adjustment_cents
        distinguishing_aspect: |
          InboundLoad is cyclic: AUDITED -> PENDING_REAUDIT -> AUDITED. Re-auditing with a
          new sampled % overwrites provisional_adjustment_cents (6000 -> 0), proving the loop
          re-runs the calculation rather than being a one-way pipeline.
        test_recipe:
          setup:
            - "Load audited with sampled 4.0 (provisional +6000), then sent back for re-audit (PENDING_REAUDIT)."
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 22, tare_tons: 2 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 4.0, audited_composition: [ { commodity: "OCC", pct: 98 } ] }
              as: ScaleOperator
            - call: "POST /mrf/inbound-loads/${load_id}/request-reaudit"
              payload: { reason: "sampling error" }
              as: SortManager
          trigger:
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 8.0, audited_composition: [ { commodity: "OCC", pct: 92 } ] }
              as: ScaleOperator
              captures: { st: $.data.status, prov: $.data.provisional_adjustment_cents }
          assert:
            - "InboundLoad.${load_id}.status == AUDITED"
            - "InboundLoad.${load_id}.provisional_adjustment_cents == 0"

      - name: mill_shipment_dispute_resettle_cycle
        grounds:
          - state_machines.MillShipment.SETTLED_to_DISPUTED
          - state_machines.MillShipment.DISPUTED_to_SETTLED
          - state_machines.Bale.SETTLED_to_SHIPPED
        distinguishing_aspect: |
          MillShipment is cyclic on a different entity: SHIPPED -> SETTLED -> DISPUTED ->
          SETTLED (re-settle). After dispute-then-settle the shipment returns to SETTLED and
          its bale is SETTLED again.
        test_recipe:
          setup:
            - "Single-bale OCC shipment settled once (bale SETTLED), then disputed (bale back to SHIPPED, shipment DISPUTED). PUBLISHED OCC index 8000 covers clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: CommodityTrader
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.60 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/mills"
              payload: { name: "Mill 1", commodity_focus: "OCC", freight_rate_cents_per_ton: 0 }
              as: CommodityTrader
              captures: { mill_id: $.data.id }
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 8000, effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-04-01T00:00:00Z" }
              as: CommodityTrader
              captures: { idx_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx_id}/publish"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 12, tare_tons: 2 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 3.0, audited_composition: [ { commodity: "OCC", pct: 99 } ] }
              as: ScaleOperator
            - call: "POST /mrf/bales"
              payload: { source_load_id: "${load_id}", commodity: "OCC", net_tons: 10, moisture_pct: 0, quality_grade: "A" }
              as: SortManager
              captures: { bale_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 0 }
              as: SortManager
            - call: "POST /mrf/mill-shipments"
              payload: { mill_id: "${mill_id}", commodity: "OCC", freight_cost_cents: 0 }
              as: CommodityTrader
              captures: { ship_id: $.data.id }
            - call: "POST /mrf/mill-shipments/${ship_id}/bales"
              payload: { bale_id: "${bale_id}" }
              as: CommodityTrader
            - call: "POST /mrf/mill-shipments/${ship_id}/ship"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/mill-shipments/${ship_id}/settle"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/mill-shipments/${ship_id}/dispute"
              payload: { reason: "weight dispute" }
              as: CommodityTrader
          trigger:
            - call: "POST /mrf/mill-shipments/${ship_id}/settle"
              payload: {}
              as: CommodityTrader
              captures: { st: $.data.status }
          assert:
            - "MillShipment.${ship_id}.status == SETTLED"
            - "Bale.${bale_id}.status == SETTLED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_cascade_bale_to_posting_to_municipality_balance
        grounds:
          - state_machines.MillShipment.SHIPPED_to_SETTLED
          - state_machines.Bale.SHIPPED_to_SETTLED
          - calculations.municipal_revenue_share
          - entities.RevenueSharePosting.fields.amount_cents
          - entities.Municipality.fields.balance_cents
        distinguishing_aspect: |
          Depth-3 chain from settle: (1) settle mutates Bale.final_value_cents=80500 and status;
          (2) that bale settlement creates a REVENUE_SHARE RevenueSharePosting of 48300;
          (3) the posting updates Municipality.revenue_share_accrued_cents and balance_cents to 48300.
        test_recipe:
          setup:
            - "Two OCC index windows (8000 then 9000). Clock 03-10. Load closed (final adj 0), single bale net10 moisture5 grade A assigned to shipment freight 5000, shipped. Clock 03-20. Municipality share 0.60, balance 0 pre-settle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: CommodityTrader
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.60 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/mills"
              payload: { name: "Mill 1", commodity_focus: "OCC", freight_rate_cents_per_ton: 1000 }
              as: CommodityTrader
              captures: { mill_id: $.data.id }
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 8000, effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-03-15T00:00:00Z" }
              as: CommodityTrader
              captures: { idx1_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx1_id}/publish"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 9000, effective_start: "2026-03-16T00:00:00Z", effective_end: "2026-04-01T00:00:00Z" }
              as: CommodityTrader
              captures: { idx2_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx2_id}/publish"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 22, tare_tons: 2 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 4.0, audited_composition: [ { commodity: "OCC", pct: 98 } ] }
              as: ScaleOperator
            - call: "POST /mrf/bales"
              payload: { source_load_id: "${load_id}", commodity: "OCC", net_tons: 10, moisture_pct: 5, quality_grade: "A" }
              as: SortManager
              captures: { bale_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 2.0 }
              as: SortManager
            - call: "POST /mrf/mill-shipments"
              payload: { mill_id: "${mill_id}", commodity: "OCC", freight_cost_cents: 5000 }
              as: CommodityTrader
              captures: { ship_id: $.data.id }
            - call: "POST /mrf/mill-shipments/${ship_id}/bales"
              payload: { bale_id: "${bale_id}" }
              as: CommodityTrader
            - call: "POST /mrf/mill-shipments/${ship_id}/ship"
              payload: {}
              as: CommodityTrader
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: CommodityTrader
          trigger:
            - call: "POST /mrf/mill-shipments/${ship_id}/settle"
              payload: {}
              as: CommodityTrader
          assert:
            - "Bale.${bale_id}.final_value_cents == 80500"
            - "Municipality.${m_id}.revenue_share_accrued_cents == 48300"
            - "Municipality.${m_id}.balance_cents == 48300"
            - "GET /mrf/revenue-postings?municipality_id=${m_id} contains one REVENUE_SHARE posting with amount_cents == 48300"

      - name: close_cascade_final_adjustment_to_municipality_ledger
        grounds:
          - state_machines.InboundLoad.AUDITED_to_CLOSED
          - calculations.contamination_adjustment
          - entities.RevenueSharePosting.fields.posting_type
          - entities.Municipality.fields.lifetime_penalty_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (close): (1) close computes InboundLoad.final_adjustment_cents=-9000;
          (2) that adjustment creates a PENALTY posting and updates Municipality.lifetime_penalty_cents=9000 and balance_cents=-9000.
        test_recipe:
          setup:
            - "Municipality share 0.50; load net_tons=20 audited (sampled 4.0)."
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City B", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 22, tare_tons: 2 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 4.0, audited_composition: [ { commodity: "OCC", pct: 98 } ] }
              as: ScaleOperator
          trigger:
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 3.0 }
              as: SortManager
          assert:
            - "InboundLoad.${load_id}.final_adjustment_cents == -9000"
            - "Municipality.${m_id}.lifetime_penalty_cents == 9000"
            - "Municipality.${m_id}.balance_cents == -9000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_state_beats_no_published_index
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_SHIPMENT_NOT_SHIPPED]
          - errors[ERR_NO_PUBLISHED_INDEX]
        distinguishing_aspect: |
          Pair {state, business_referential}: a BUILDING shipment (state fail, pri 5) with no
          PUBLISHED index for its commodity (referential fail, pri 6) is settled; the state error
          ERR_SHIPMENT_NOT_SHIPPED wins.
        test_recipe:
          setup:
            - "MillShipment in BUILDING; no CommodityIndex exists for OCC."
          setup_api_calls:
            - call: "POST /mrf/mills"
              payload: { name: "Mill 1", commodity_focus: "OCC", freight_rate_cents_per_ton: 0 }
              as: CommodityTrader
              captures: { mill_id: $.data.id }
            - call: "POST /mrf/mill-shipments"
              payload: { mill_id: "${mill_id}", commodity: "OCC", freight_cost_cents: 0 }
              as: CommodityTrader
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /mrf/mill-shipments/${ship_id}/settle"
              payload: {}
              as: CommodityTrader
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHIPMENT_NOT_SHIPPED"
            - "http_status == 409"

      - name: bale_create_commodity_safety_beats_tonnage_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_COMMODITY_NOT_IN_LOAD]
          - errors[ERR_BALE_TONS_EXCEED_REMAINING]
        distinguishing_aspect: |
          Pair {business_safety, business_constraint}: a bale whose commodity is absent from the
          load composition (safety fail, pri 7) AND whose net_tons exceed the load's remaining
          tonnage (constraint fail, pri 9); safety error ERR_COMMODITY_NOT_IN_LOAD wins.
        test_recipe:
          setup:
            - "Load net_tons=5, audited with composition [{OCC,96}] only (no PET)."
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 5, tare_tons: 0 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 3.0, audited_composition: [ { commodity: "OCC", pct: 96 } ] }
