        distinguishing_aspect: "Five distinct X-User-ID rules on five endpoints, four of which demand a different actor and one of which demands the same actor: the vial verifier, the payer decider, the study interpreter and the refund settler must all differ from the recorded predecessor, while the reprocessing completion must be filed by the very tech who opened the run. Each rejection is immediately followed by the compliant call succeeding, so the failure cannot be a role or state problem."
