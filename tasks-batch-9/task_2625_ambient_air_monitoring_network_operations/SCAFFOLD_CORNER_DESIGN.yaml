  - section: errors
    instances:
      - name: every_error_response_uses_the_declared_error_envelope
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_POLLUTANT_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Both a 404 and a 400 come back with response_type error, a meta block and a data object holding exactly error_id and message - never a bare string and never a partially built entity."
        test_recipe:
          setup:
            - "an empty system with the clock set"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "GET /pollutants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramManager
              captures: { nf_error: "$.data.error_id", nf_message: "$.data.message" }
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "NOT_A_FORM", primary_standard_value: 9.0 }
              as: NetworkAdmin
              captures: { bad_error: "$.data.error_id" }
          assert:
            - "the GET returns HTTP 404 with response_type == error and ${nf_error} == ERR_POLLUTANT_NOT_FOUND"
            - "${nf_message} is a non-empty string and meta.api_request_id is present on the error response"
            - "the POST returns HTTP 400 with ${bad_error} == ERR_INVALID_REQUEST"
            - "the error data object exposes only error_id and message - no id, no partially created Pollutant"

