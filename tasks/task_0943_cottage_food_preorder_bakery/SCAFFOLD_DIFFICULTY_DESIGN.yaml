          a line added at 2026-05-06T11:59:59Z succeeds while the identical line at
          exactly 2026-05-06T12:00:00Z is rejected, because CUTOFF_BOUNDARY_SEMANTICS
          makes the comparison now < order_cutoff_at strictly.
