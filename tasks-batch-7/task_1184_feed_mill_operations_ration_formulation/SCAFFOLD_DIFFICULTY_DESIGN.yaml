      - name: contract_exhaustion_cascades_formula_recompute_quote_stale
        grounds:
          - state_machines.Contract.OPEN_to_EXHAUSTED
          - calculations.weighment_pricing
          - calculations.formula_provisional_cost
          - entities.CustomerOrder.fields.quote_stale
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (weighment recording): the weighment consumes the
          contract's last ton (hop 1: consumed_tons 7.140, remaining 0); that mutation flips the
          contract OPEN -> EXHAUSTED (hop 2); the status flip shrinks the pricing selector pool and
          recomputes Formula.provisional_cost_cents_per_ton 35900 -> 36600 (hop 3); the still-QUOTED
          second order's derived quote_stale flips true (hop 4, observable) and its confirm fails.
