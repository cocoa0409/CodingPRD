  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: reschedule_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pickup-reschedule-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on PickupRequest.version: after a successful reschedule bumps version 1->2, a second reschedule replaying expected_pickup_version 1 -> 412 ERR_STALE_VERSION (two strictly sequential requests)."
        test_recipe:
          setup:
            - "Zone Z; resident R; pickup P created (version 1)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone XL1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Ann A", email: "ann@x.com", address: "54 Ivy St" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 2 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id, p_v1: $.data.version }
          trigger:
            - call: "POST /pickup-requests/${id}/reschedule"
              payload: { window_start: "2026-05-11T10:00:00Z", window_end: "2026-05-11T12:00:00Z", expected_pickup_version: "${id}" }
              as: Resident
              as_user_id: "${id}"
              captures: { p_v2: $.data.version, p_rc: $.data.reschedule_count }
            - call: "POST /pickup-requests/${id}/reschedule"
              payload: { window_start: "2026-05-12T10:00:00Z", window_end: "2026-05-12T12:00:00Z", expected_pickup_version: "${id}" }
              as: Resident
              as_user_id: "${id}"
              captures: { err: $.data.error_id }
          assert:
            - "first reschedule succeeds: version ${id} == 2, reschedule_count ${id} == 1"
            - "second reschedule with stale version 1: 412 ${id} == ERR_STALE_VERSION"
            - "pickup window remains 2026-05-11, reschedule_count still 1"

      - name: charity_split_update_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[zone-split-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ServiceZone.version: split update A (expected version 1) succeeds and bumps to 2; update B replaying expected version 1 -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Zone Z (version 1); charity CH1"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone XL2" }
              as: ZoneOperator
              captures: { z_id: $.data.id, z_v1: $.data.version }
            - call: "POST /charities"
              payload: { name: "ClothesAid" }
              as: ZoneOperator
              captures: { ch1: $.data.id }
          trigger:
            - call: "PUT /service-zones/${id}/charity-split"
              payload: { charity_splits: [{ charity_id: "${id}", pct: 50 }], expected_zone_version: "${id}" }
              as: ZoneOperator
              captures: { z_v2: $.data.version }
            - call: "PUT /service-zones/${id}/charity-split"
              payload: { charity_splits: [{ charity_id: "${id}", pct: 25 }], expected_zone_version: "${id}" }
              as: ZoneOperator
              captures: { err: $.data.error_id }
          assert:
            - "first update: zone version ${id} == 2"
            - "second update with stale version 1: 412 ${id} == ERR_STALE_VERSION; splits remain [{CH1, 50}]"

      - name: fund_topup_derived_available_reconciles
        claim_type: derived_field_reconciliation
        grounds: [calculations.sponsor_fund_ledger, entities.SponsorFund.fields.available_cents]
        distinguishing_aspect: "Derived ledger fields reconcile on mutation: after a 5000-cent topup on a 100000 fund, funded_total 105000 and available 105000 with held and paid still 0."
        test_recipe:
          setup:
            - "Zone Z with ACTIVE fund F (initial 100000)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone XL3" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /sponsor-funds"
              payload: { zone_id: "${id}", sponsor_name: "EcoCorp", initial_cents: 100000 }
              as: ZoneOperator
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /sponsor-funds/${id}/topups"
              payload: { amount_cents: 5000 }
              as: SponsorManager
              as_user_id: "${id}"
              captures: { f_total: $.data.funded_total_cents, f_avail: $.data.available_cents, f_held: $.data.held_cents }
          assert:
            - "funded_total_cents ${id} == 105000, available ${id} == 105000, held ${id} == 0, paid == 0"
            - "invariant: 0 + 0 + 105000 == 105000"

      - name: adjudication_cascade_layer_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.WeightTicket.CERTIFIED_to_QUARANTINED]
        excluded_because:
          difficulty_instance: severe_adjudication_ticket_credit_fund_cascade
          rationale: "Three-level cascade (ticket -> credit -> fund) plus partner quarantine asserted there."

      - name: fill_threshold_layer_stub
        claim_type: rate_threshold_triggers
        grounds: [calculations.dropbox_fill_posture]
        excluded_because:
          difficulty_instance: dropbox_fill_threshold_85_inclusive
          rationale: "Threshold trigger at exactly 85.0 asserted there."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_visibility
        grounds: [complexity_profile, entities.PickupRequest.fields.est_weight_kg]
        distinguishing_aspect: "Immediate consistency: the POST /pickup-requests response already carries computed est_weight_kg and status; a GET issued right after returns identical values (no eventual lag)."
        test_recipe:
          setup:
            - "Zone Z; resident R"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone CM1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Bo B", email: "bo@x.com", address: "55 Larch St" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 7 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id, p_est_c: $.data.est_weight_kg, p_st_c: $.data.status }
            - call: "GET /pickup-requests/${id}"
              as: ZoneOperator
              captures: { p_est_g: $.data.est_weight_kg, p_st_g: $.data.status }
          assert:
            - "create response: est ${id} == 28.0, status ${id} == SCHEDULED"
            - "immediate GET agrees: ${id} == 28.0, ${id} == SCHEDULED"
