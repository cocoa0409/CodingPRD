  - section: complexity_layers
    instances:

      - name: stale_expected_cycle_version_on_board_action_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[slot-approve-stale-cycle]
          - errors[ERR_STALE_CYCLE_VERSION]
        distinguishing_aspect: |
          A board action one version behind is rejected with 412
          ERR_STALE_CYCLE_VERSION and leaves the slot PROPOSED, the cycle version
          unchanged and committed_cents 0. The accepted action then increments
          FellowshipCycle.version by exactly 1, so replaying the same body is
          rejected with 412 again rather than with ERR_SLOT_STATE_INVALID — P60
          outranks P65, which is what proves the version check runs before the
          state check.
        test_recipe:
          setup:
            - "CornerMain slate submitted with one PROPOSED slot, cycle in BOARD_REVIEW, its version captured"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - *n_rev2
            - *n_srev2
            - *n_rev3
            - *n_srev3
            - *n_closeround
            - *n_board
            - *n_getpan
            - *n_slate
            - *n_getslot
            - *n_getcyc
          trigger:
            - { call: "POST /grants/recommendation-slots/${slot}/board-action", payload: { action: APPROVE, expected_cycle_version: "${cyc_v} - 1" }, as: CouncilBoardMember, as_user_id: "board-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/recommendation-slots/${slot}/board-action", payload: { action: APPROVE, expected_cycle_version: "${cyc_v}" }, as: CouncilBoardMember, as_user_id: "board-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/recommendation-slots/${slot}/board-action", payload: { action: APPROVE, expected_cycle_version: "${cyc_v}" }, as: CouncilBoardMember, as_user_id: "board-1" }
          assert:
            - "The stale action returns 412 ERR_STALE_CYCLE_VERSION"
            - "The first cycle read shows the version unchanged, funded_total_cents 0 and committed_cents 0; the slot is still \"PROPOSED\""
            - "The correct action returns 200 with status \"BOARD_APPROVED\" and awarded_amount_cents 1500000"
            - "The second cycle read shows version incremented by exactly 1 and committed_cents 1627500"
            - "Replaying the accepted body returns 412 ERR_STALE_CYCLE_VERSION — not ERR_SLOT_STATE_INVALID — because the P60 version check precedes the P65 state check"

      - name: stale_expected_panel_version_on_slate_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[slate-submit-stale-panel]
          - errors[ERR_STALE_PANEL_VERSION]
        distinguishing_aspect: |
          The chair's slate carrying a version one behind is rejected with 412 and
