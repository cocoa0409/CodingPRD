          Once the certification waterfall has parked the balance on the cap, the posture rule at
          priority 25 closes the fund to further deposits ahead of the fiscal ceiling at priority 55:
          a 1-cent manual deposit returns ERR_FUND_AT_CAP 409, not ERR_DEPOSIT_EXCEEDS_CAP 422.
