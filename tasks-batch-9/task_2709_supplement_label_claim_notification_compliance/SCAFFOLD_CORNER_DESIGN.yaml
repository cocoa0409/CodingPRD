  - section: endpoints
    instances:
      - name: corner_product_patch_updates_only_supplied_fields
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /supplement-compliance/products/{id}]
          - entities.Product
        distinguishing_aspect: "A partial update must touch only the supplied field, bump version by exactly one, and leave every derived counter and the posture untouched."
        test_recipe:
          setup:
            - "One DRAFT product with brand_name NutraCore and net_quantity_g 120."
          setup_api_calls:
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Magnesium Glycinate", net_quantity_g: 120, servings_per_container: 60 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
          trigger:
            - call: "PATCH /supplement-compliance/products/${prod_id}"
              payload: { brand_name: "NutraCore Labs" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { v: $.data.version }
          assert:
            - "HTTP 200 with data.brand_name == NutraCore Labs and data.version == 2"
            - "data.product_name == Magnesium Glycinate, data.net_quantity_g == 120 and data.servings_per_container == 60 are unchanged"
            - "data.lifecycle_status == DRAFT, data.label_posture == OPEN and data.compliance_risk_index == 10"
      - name: corner_risk_profile_read_matches_the_stored_counters
        claim_type: computed_read
        grounds:
          - endpoints[GET /supplement-compliance/products/{id}/risk-profile]
          - calculations.product_compliance_risk_index
        distinguishing_aspect: "The computed read must agree with the index maintained by the triage transition — one serious event gives base 30, which lands exactly on the middle tier and adds the 5-point surcharge."
        test_recipe:
          setup:
            - "One DRAFT product with exactly one TRIAGED_SERIOUS adverse event report."
          setup_api_calls:
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Sleep Support", net_quantity_g: 90, servings_per_container: 45 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports"
              payload: { product_id: "${prod_id}", reporter_type: "HEALTHCARE_PROVIDER", received_date: "2026-07-30", narrative: "Overnight admission for tachycardia.", outcome_codes: ["HOSPITALIZATION"] }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { aer_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports/${aer_id}/triage"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
          trigger:
            - call: "GET /supplement-compliance/products/${prod_id}/risk-profile"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u_aud_01"
              captures: { idx: $.data.compliance_risk_index }
          assert:
            - "HTTP 200 with data.compliance_risk_index == 35 (base 10 + 20 == 30, which is at the tier boundary, plus the 5-point surcharge)"
            - "data.serious_ae_count == 1, data.nonserious_ae_count == 0, data.late_notification_count == 0, data.rejected_coa_count == 0"
            - "data.label_posture == OPEN (35 is below the RESTRICTED threshold of 70) and requires_label_revision == false"
      - name: corner_product_ingredient_link_requires_both_referenced_rows
        claim_type: cross_reference_link
