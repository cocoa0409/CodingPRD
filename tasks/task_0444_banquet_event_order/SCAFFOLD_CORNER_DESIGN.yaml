        claim_type: Correct Result
        grounds:
          - calculations.block_night_occupancy
          - entities.RoomBlockLink.fields.check_out_date
        distinguishing_aspect: "Link A reserves 7 over [2029-01-01,2029-01-03); a second link reserving 7 over [2029-01-03,2029-01-05) shares no occupied night (check_out_date exclusive) and is admitted on a 10-room block."
