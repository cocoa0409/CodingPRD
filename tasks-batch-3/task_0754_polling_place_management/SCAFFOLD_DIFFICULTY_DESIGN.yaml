scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: shift_pay_scheduled_vs_actual_diverge
        grounds:
          - calculations.shift_pay
          - entities.Shift.fields.scheduled_pay_cents
          - entities.Shift.fields.gross_pay_cents
          - state_machines.Shift.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: "On the PollWorker payroll domain: a shift scheduled 06:00-17:00 (11h) but worked 06:00-15:30 (9.5h) yields scheduled_pay_cents=22813 yet gross_pay_cents=18706 — the two variants of shift_pay differ by 4107 cents on the same shift."
        test_recipe:
          setup:
            - "Election VOTING_OPEN; place OPEN with certified worker on an ACTIVE assignment; shift scheduled 2026-11-03T06:00Z..17:00Z (11h); worker checks in at 06:00 and out at 15:30 (9.5h worked)."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "Precinct 1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 5, station_capacity: 5 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_type: "SCANNER", serial_number: "SN-1" }
              as: ElectionAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /equipment/${eq_id}/deploy"
              payload: { polling_place_id: "${pp_id}" }
              as: ElectionAdmin
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "DISPATCH" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE", polling_place_id: "${pp_id}" }
              as: CustodyOfficer
            - call: "POST /poll-workers"
              payload: { full_name: "Jane Poll", email: "jane@x.com" }
              as: ElectionAdmin
              captures: { w_id: $.data.id }
            - call: "POST /poll-workers/${w_id}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w_id}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a_id: $.data.id }
            - call: "POST /assignments/${a_id}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /shifts"
              payload: { assignment_id: "${a_id}", scheduled_start: "2026-11-03T06:00:00Z", scheduled_end: "2026-11-03T17:00:00Z" }
              as: PrecinctCaptain
              captures: { s_id: $.data.id, sched_pay: $.data.scheduled_pay_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T06:00:00Z" }
              as: ElectionAdmin
            - call: "POST /shifts/${s_id}/check-in"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T15:30:00Z" }
              as: ElectionAdmin
          trigger:
            - call: "POST /shifts/${s_id}/check-out"
              payload: {}
              as: PrecinctCaptain
              captures: { gross: $.data.gross_pay_cents }
          assert:
            - "Shift.${s_id}.scheduled_hours == 11.0"
            - "Shift.${s_id}.scheduled_pay_cents == 22813"
            - "Shift.${s_id}.actual_hours == 9.5"
            - "Shift.${s_id}.gross_pay_cents == 18706"
            - "Shift.${s_id}.scheduled_pay_cents - Shift.${s_id}.gross_pay_cents == 4107"

      - name: reconciliation_machine_vs_reconciled_diverge
        grounds:
          - calculations.reconciliation
          - entities.PollingPlace.fields.reconciliation_discrepancy
          - entities.PollingPlace.fields.provisional_accepted_count
          - state_machines.PollingPlace.CLOSED_to_RECONCILED
        distinguishing_aspect: "On the ballot-accounting domain: with scanner_tally=95, 3 accepted provisionals, and 100 e-pollbook check-ins, the machine_only tally is 95 while the reconciled tally is 98 — the two reconciliation variants differ by provisional_accepted_count=3 and yield reconciliation_discrepancy=-2 (MISMATCH)."
        test_recipe:
          setup:
            - "Place OPEN; 5 provisional ballots cast, 3 adjudicated ACCEPT and 2 REJECT (provisional_accepted_count=3); place then CLOSED; reconcile with scanner_tally=95, epollbook_checkins=100."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "Precinct 1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 5, station_capacity: 5 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_type: "SCANNER", serial_number: "SN-1" }
              as: ElectionAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /equipment/${eq_id}/deploy"
              payload: { polling_place_id: "${pp_id}" }
              as: ElectionAdmin
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "DISPATCH" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE", polling_place_id: "${pp_id}" }
              as: CustodyOfficer
            - call: "POST /poll-workers"
              payload: { full_name: "Jane Poll", email: "jane@x.com" }
              as: ElectionAdmin
              captures: { w_id: $.data.id }
            - call: "POST /poll-workers/${w_id}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w_id}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a_id: $.data.id }
            - call: "POST /assignments/${a_id}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /provisional-ballots"
              payload: { polling_place_id: "${pp_id}", voter_name: "V1", reason: "NO_ID" }
              as: PrecinctCaptain
              captures: { pb1: $.data.id }
            - call: "POST /provisional-ballots"
              payload: { polling_place_id: "${pp_id}", voter_name: "V2", reason: "NO_ID" }
              as: PrecinctCaptain
              captures: { pb2: $.data.id }
            - call: "POST /provisional-ballots"
              payload: { polling_place_id: "${pp_id}", voter_name: "V3", reason: "NO_ID" }
              as: PrecinctCaptain
              captures: { pb3: $.data.id }
            - call: "POST /provisional-ballots"
              payload: { polling_place_id: "${pp_id}", voter_name: "V4", reason: "NOT_IN_BOOK" }
              as: PrecinctCaptain
              captures: { pb4: $.data.id }
            - call: "POST /provisional-ballots"
              payload: { polling_place_id: "${pp_id}", voter_name: "V5", reason: "NOT_IN_BOOK" }
              as: PrecinctCaptain
              captures: { pb5: $.data.id }
            - call: "POST /provisional-ballots/${pb1}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: PrecinctCaptain
            - call: "POST /provisional-ballots/${pb2}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: PrecinctCaptain
            - call: "POST /provisional-ballots/${pb3}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: PrecinctCaptain
            - call: "POST /provisional-ballots/${pb4}/adjudicate"
              payload: { decision: "REJECT" }
              as: PrecinctCaptain
            - call: "POST /provisional-ballots/${pb5}/adjudicate"
              payload: { decision: "REJECT" }
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/close"
              payload: {}
              as: PrecinctCaptain
              captures: { ppv: $.data.version }
          trigger:
            - call: "POST /polling-places/${pp_id}/reconcile"
              payload: { scanner_tally: 95, epollbook_checkins: 100, spoiled_count: 0, expected_polling_place_version: "${ppv}" }
              as: PrecinctCaptain
          assert:
            - "PollingPlace.${pp_id}.provisional_accepted_count == 3"
            - "PollingPlace.${pp_id}.scanner_tally == 95"
            - "PollingPlace.${pp_id}.reconciliation_discrepancy == -2"
            - "PollingPlace.${pp_id}.reconciliation_status == MISMATCH"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: shift_pay_nonlinear_tiered_overtime_mode_a
        grounds:
          - calculations.shift_pay
          - entities.Shift.fields.gross_pay_cents
          - entities.Shift.fields.is_lead
        distinguishing_aspect: "Mode (a) nonlinear: gross_pay depends on ≥3 inputs (actual_hours, is_lead rate selection, OT tier split via min/max at 8.0h) — a lead working 9.5h yields regular_pay=19600 + overtime_pay=5513 = 25113, not a linear hours*rate product."
        test_recipe:
          setup:
            - "Place OPEN; certified LEAD worker (is_lead=true) on ACTIVE assignment; shift worked 06:00..15:30 (9.5h) at LEAD_HOURLY_CENTS=2450."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "Precinct 1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 5, station_capacity: 5 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_type: "SCANNER", serial_number: "SN-1" }
              as: ElectionAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /equipment/${eq_id}/deploy"
              payload: { polling_place_id: "${pp_id}" }
              as: ElectionAdmin
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "DISPATCH" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE", polling_place_id: "${pp_id}" }
              as: CustodyOfficer
            - call: "POST /poll-workers"
              payload: { full_name: "Lead Poll", email: "lead@x.com" }
              as: ElectionAdmin
              captures: { w_id: $.data.id }
            - call: "POST /poll-workers/${w_id}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w_id}", polling_place_id: "${pp_id}", is_lead: true }
              as: PrecinctCaptain
              captures: { a_id: $.data.id }
            - call: "POST /assignments/${a_id}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /shifts"
              payload: { assignment_id: "${a_id}", scheduled_start: "2026-11-03T06:00:00Z", scheduled_end: "2026-11-03T16:00:00Z" }
              as: PrecinctCaptain
              captures: { s_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T06:00:00Z" }
              as: ElectionAdmin
            - call: "POST /shifts/${s_id}/check-in"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T15:30:00Z" }
              as: ElectionAdmin
          trigger:
            - call: "POST /shifts/${s_id}/check-out"
              payload: {}
              as: PrecinctCaptain
          assert:
            - "Shift.${s_id}.is_lead == true"
            - "Shift.${s_id}.actual_hours == 9.5"
            - "Shift.${s_id}.gross_pay_cents == 25113"

      - name: place_payroll_round_per_shift_then_sum_mode_b
        grounds:
          - calculations.place_payroll_summary
          - calculations.shift_pay
          - entities.PollingPlace.fields.total_payroll_cents
        distinguishing_aspect: "Mode (b) rounding order: two 0.5h shifts each round to 913 cents (912.5 half-up), so total_payroll_cents=1826; summing raw pay first (0.5*1825+0.5*1825=1825) then rounding would give 1825 — the pinned round-per-shift-then-sum order is observable as 1826."
        test_recipe:
          setup:
            - "Place OPEN (station_capacity=2); two certified workers each on an ACTIVE assignment; each works a 0.5h shift 06:00..06:30; both checked out."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "Precinct 1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 5, station_capacity: 2 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_type: "SCANNER", serial_number: "SN-1" }
              as: ElectionAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /equipment/${eq_id}/deploy"
              payload: { polling_place_id: "${pp_id}" }
              as: ElectionAdmin
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "DISPATCH" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE", polling_place_id: "${pp_id}" }
              as: CustodyOfficer
            - call: "POST /poll-workers"
              payload: { full_name: "W A", email: "a@x.com" }
              as: ElectionAdmin
              captures: { wa: $.data.id }
            - call: "POST /poll-workers/${wa}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /poll-workers"
              payload: { full_name: "W B", email: "b@x.com" }
              as: ElectionAdmin
              captures: { wb: $.data.id }
            - call: "POST /poll-workers/${wb}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${wa}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { aa: $.data.id }
            - call: "POST /assignments/${aa}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /assignments"
              payload: { poll_worker_id: "${wb}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { ab: $.data.id }
            - call: "POST /assignments/${ab}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /shifts"
              payload: { assignment_id: "${aa}", scheduled_start: "2026-11-03T06:00:00Z", scheduled_end: "2026-11-03T06:30:00Z" }
              as: PrecinctCaptain
              captures: { sa: $.data.id }
            - call: "POST /shifts"
              payload: { assignment_id: "${ab}", scheduled_start: "2026-11-03T06:00:00Z", scheduled_end: "2026-11-03T06:30:00Z" }
              as: PrecinctCaptain
              captures: { sb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T06:00:00Z" }
              as: ElectionAdmin
            - call: "POST /shifts/${sa}/check-in"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /shifts/${sb}/check-in"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T06:30:00Z" }
              as: ElectionAdmin
            - call: "POST /shifts/${sa}/check-out"
              payload: {}
              as: PrecinctCaptain
          trigger:
            - call: "POST /shifts/${sb}/check-out"
              payload: {}
              as: PrecinctCaptain
          assert:
            - "Shift.${sa}.gross_pay_cents == 913"
            - "Shift.${sb}.gross_pay_cents == 913"
            - "PollingPlace.${pp_id}.total_payroll_cents == 1826"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: provisional_ballot_branching_accept_vs_reject
        grounds:
          - state_machines.ProvisionalBallot.CAST_to_ACCEPTED
          - state_machines.ProvisionalBallot.CAST_to_REJECTED
          - entities.PollingPlace.fields.provisional_accepted_count
        distinguishing_aspect: "ProvisionalBallot forks CAST -> {ACCEPTED, REJECTED} with divergent side-effects: ACCEPT increments provisional_accepted_count, REJECT leaves it unchanged — same start state, two outcomes, different effects."
        test_recipe:
          setup:
            - "Place OPEN; two provisional ballots cast; one adjudicated ACCEPT, one REJECT."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
