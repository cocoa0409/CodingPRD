              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h2: "$.data[0].id" }
            - call: "POST /eoir/continuance-requests"
              payload: { case_id: "${case_id}", hearing_id: "${h2}", reason_code: "EVIDENCE_GATHERING" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { c2: $.data.id }
            - call: "POST /eoir/continuance-requests/${c2}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/hearings"
              payload: { case_id: "${case_id}", status: "SCHEDULED" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h3: "$.data[0].id" }
            - call: "POST /eoir/continuance-requests"
              payload: { case_id: "${case_id}", hearing_id: "${h3}", reason_code: "EVIDENCE_GATHERING" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { c3: $.data.id }
            - call: "POST /eoir/continuance-requests/${c3}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/hearings"
              payload: { case_id: "${case_id}", status: "SCHEDULED" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h4: "$.data[0].id" }
            - call: "POST /eoir/continuance-requests"
