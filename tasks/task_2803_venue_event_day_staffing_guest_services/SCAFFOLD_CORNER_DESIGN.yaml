# SCAFFOLD_CORNER_DESIGN.yaml - task 2803 Venue Event-Day Staffing & Guest Services
# Breadth probe for SKILL.md §1.9. Sections and claim_type values come exclusively from
# references/claim-extraction-guide.md; nothing here is invented and nothing here adds behaviour.
#
# Conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * The logical clock starts at 2026-08-01T00:00:00Z; every recipe sets it explicitly first.
#   * Every mutating call carries X-User-Role and X-User-ID (§1.4 priority 1). `as_user_id:` is
#     written out only where identity is load-bearing (StaffMember ownership §1.4 priority 7,
#     refund segregation of duties §1.4 priority 8, audit-field assertions).
#   * Money is integer cents. Every numeric literal in an `assert:` line was computed by executing
#     the relevant §1.3 formula with its declared constants, not estimated.
#   * `expected_event_version` is always a ${var} captured from an earlier Event-returning response.
#   * The absent-row id literal used by not-found probes is
#     "00000000-0000-0000-0000-0000000000ff", which no endpoint ever mints.
#   * Corners already asserted by a §1.8 instance are emitted as `excluded_because:` stubs and
#     carry no test_recipe.

scaffold_corner_design:

  # ===================================================================================
  # 1. From Table 1 (Entities) - §1.1 surface: 13 entities, one of them common_fields: false
  # ===================================================================================
  - section: entities
    instances:

      - name: event_creation_returns_tier_and_ledger_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /events]
          - entities.Event.fields.attendance_tier
          - entities.Event.fields.refund_budget_remaining_cents
          - entities.Event.fields.status
          - calculations.event_attendance_tier
        distinguishing_aspect: >-
          POST /events with every required field returns 201 and the response already carries the
          computed attendance_tier TIER_2 (expected_attendance 12000 sits exactly on TIER_2_FLOOR),
          the opened ledger refund_budget_remaining_cents 60000, gratuity_allocated_cents 0,
          status FORECAST and version 1 - no second read is needed to see them.
        test_recipe:
          setup:
            - "Empty DB, clock at 2026-09-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: GuestExperienceDirector
          trigger:
            - call: "POST /events"
              payload: { name: "Home Opener", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 12000, refund_budget_total_cents: 60000, gratuity_pool_cents: 40000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response_type == 'object' and meta.api_request_id and meta.api_request_timestamp are present"
            - "Event.${ev_id}.attendance_tier == TIER_2"
            - "Event.${ev_id}.status == FORECAST"
            - "Event.${ev_id}.version == 1"
            - "Event.${ev_id}.refund_budget_total_cents == 60000"
            - "Event.${ev_id}.refund_approved_total_cents == 0"
            - "Event.${ev_id}.refund_budget_remaining_cents == 60000"
            - "Event.${ev_id}.gratuity_pool_cents == 40000 and gratuity_allocated_cents == 0"
            - "Event.${ev_id}.historical_actual_attendance is null (optional input omitted)"
            - "Event.${ev_id}.id, created_at and updated_at are all non-null"

      - name: event_retrieval_returns_stored_values_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /events/{id}]
          - entities.Event.fields.expected_attendance
          - entities.Event.fields.attendance_tier
        distinguishing_aspect: >-
          GET /events/{id} is a pure read: every field returned by the creating POST comes back
          byte-identical (expected_attendance 25000, attendance_tier TIER_3, version 1) and
          updated_at is unchanged by the read.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z; one Event with expected_attendance 25000 (TIER_3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: GuestExperienceDirector
            - call: "POST /events"
              payload: { name: "Rivalry Night", event_date: "2026-09-19T00:00:00Z", doors_open_at: "2026-09-19T17:00:00Z", doors_close_at: "2026-09-19T23:00:00Z", expected_attendance: 25000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_updated: $.data.updated_at }
          trigger:
            - call: "GET /events/${ev_id}"
              as: StaffingCoordinator
          assert:
            - "HTTP status is 200 and response_type == 'object'"
            - "Event.${ev_id}.name == 'Rivalry Night'"
            - "Event.${ev_id}.expected_attendance == 25000"
            - "Event.${ev_id}.attendance_tier == TIER_3"
            - "Event.${ev_id}.refund_budget_total_cents == 100000 (declared default) and refund_budget_remaining_cents == 100000"
            - "Event.${ev_id}.gratuity_pool_cents == 0 (declared default)"
            - "Event.${ev_id}.version == 1 and updated_at == ${ev_updated} - the read mutates nothing"

      - name: staff_member_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /staff-members]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          GET /staff-members returns the array envelope with limit/offset/total_count/has_more:
          three members with seniority_date 2020/2021/2022 come back in seniority_date ASC order,
          limit=2 offset=0 yields exactly 2 rows with total_count 3 and has_more true, offset=2
          yields 1 row with has_more false, and a bare call applies the declared defaults
          limit 10 / offset 0.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z; three ACTIVE StaffMembers created oldest-seniority first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staff-members"
              payload: { full_name: "Ada Usher", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ben Taker", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2021-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m2: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Cleo Rep", employment_type: "CONTRACTED", seniority_date: "2022-01-01T00:00:00Z", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              captures: { m3: $.data.id }
          trigger:
            - call: "GET /staff-members?limit=2&offset=0"
              as: StaffingCoordinator
            - call: "GET /staff-members?limit=2&offset=2"
              as: StaffingCoordinator
            - call: "GET /staff-members"
              as: StaffingCoordinator
            - call: "GET /staff-members?employment_type=CONTRACTED"
              as: StaffingCoordinator
          assert:
            - "first call: response_type == 'array', len(data) == 2, data[0].id == ${m1}, data[1].id == ${m2}"
            - "first call: limit == 2, offset == 0, total_count == 3, has_more == true"
            - "second call: len(data) == 1, data[0].id == ${m3}, offset == 2, total_count == 3, has_more == false"
            - "third call: limit == 10 and offset == 0 (declared pagination_defaults), len(data) == 3, has_more == false"
            - "fourth call: total_count == 1 and data[0].id == ${m3} - the filter is applied before pagination"

      - name: guest_issue_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /guest-issues/{id}]
          - errors[ERR_GUEST_ISSUE_NOT_FOUND]
          - validations[priority 5]
        distinguishing_aspect: >-
          A well-formed id that no row carries resolves at §1.4 priority 5 to
          ERR_GUEST_ISSUE_NOT_FOUND with HTTP 404 and the error envelope
          (response_type == 'error'), not to an empty 200 body.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z; no GuestIssue exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: GuestServicesSupervisor
          trigger:
            - call: "GET /guest-issues/00000000-0000-0000-0000-0000000000ff"
              as: GuestServicesSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response_type == 'error' and data.error_id == 'ERR_GUEST_ISSUE_NOT_FOUND'"
            - "data.message is a non-empty string"
            - "GET /guest-issues (list) still returns total_count == 0"

      - name: position_type_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /position-types]
          - errors[ERR_VALIDATION_FAILED]
          - validations[priority 3]
          - entities.PositionType.fields.min_headcount
        distinguishing_aspect: >-
          min_headcount and required_certifications are `source: input` with no declared default,
          so omitting either is ERR_VALIDATION_FAILED at §1.4 priority 3 and no PositionType row
          is created; the optional flags is_tip_eligible / is_contracted_position are not part of
          that requirement set.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z; no PositionType exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
          trigger:
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, required_certifications: ["EVACUATION_PROCEDURES"] }
              as: StaffingCoordinator
              captures: { err_a: $.data.error_id }
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, min_headcount: 4 }
              as: StaffingCoordinator
              captures: { err_b: $.data.error_id }
          assert:
            - "first call: HTTP 422 and data.error_id == 'ERR_VALIDATION_FAILED' (min_headcount missing)"
            - "second call: HTTP 422 and data.error_id == 'ERR_VALIDATION_FAILED' (required_certifications missing)"
            - "GET /position-types returns total_count == 0 - neither rejected request persisted a row"

      - name: staff_member_omitted_optionals_get_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /staff-members]
          - entities.StaffMember.fields.in_backfill_pool
          - entities.StaffMember.fields.reliability_score
          - entities.StaffMember.fields.season_reliability_score
          - entities.StaffMember.fields.no_show_strikes
          - entities.StaffMember.fields.completed_assignment_count
          - entities.StaffMember.fields.status
        distinguishing_aspect: >-
          Omitting the only optional input (in_backfill_pool) yields the declared default true -
          not false - while status defaults to ACTIVE, both reliability variants to 100,
          no_show_strikes and completed_assignment_count to 0 and last_status_reason to null;
          passing in_backfill_pool false explicitly must be honoured, proving the default is a
          default and not a hard-coded constant.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z; no StaffMember exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
          trigger:
            - call: "POST /staff-members"
              payload: { full_name: "Dee Default", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2023-05-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m_def: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Eli Explicit", employment_type: "CONTRACTED", seniority_date: "2023-06-01T00:00:00Z", hourly_rate_cents: 2400, in_backfill_pool: false }
              as: StaffingCoordinator
              captures: { m_exp: $.data.id }
          assert:
            - "StaffMember.${m_def}.in_backfill_pool == true"
            - "StaffMember.${m_def}.status == ACTIVE"
            - "StaffMember.${m_def}.reliability_score == 100 and season_reliability_score == 100"
            - "StaffMember.${m_def}.no_show_strikes == 0 and completed_assignment_count == 0"
            - "StaffMember.${m_def}.last_status_reason is null"
            - "StaffMember.${m_exp}.in_backfill_pool == false"
            - "GET /staff-members?in_backfill_pool=true returns total_count == 1 and data[0].id == ${m_def}"

      - name: position_slot_computed_headcount_input_ignored
        claim_type: computed_fields
        grounds:
          - endpoints[POST /position-slots]
          - calculations.position_slot_required_headcount
          - entities.PositionSlot.fields.ratio_derived_headcount
          - entities.PositionSlot.fields.required_headcount
          - entities.PositionSlot.fields.shift_minutes
          - entities.PositionSlot.fields.filled_headcount
        distinguishing_aspect: >-
          ratio_derived_headcount, required_headcount, shift_minutes and slot_labor_cost_cents are
          all `source: computed`: a client that smuggles required_headcount 99 and shift_minutes 10
          into the body gets the server's own numbers (basis 6000 -> TIER_1 x1.00, ratio 0.8 ->
          raw 4.8000 -> ceil 5 -> max(5, min_headcount 3) = 5; 245 shift minutes; 40833 cents),
          and the declared input field required_headcount_override 2 does replace required_headcount
          while leaving ratio_derived_headcount at 5.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One Event with expected_attendance 6000 (TIER_1, multiplier 1.00)."
            - "One TICKET_TAKER PositionType: 2000 cents/h, attendance_ratio_per_1000 0.8, min_headcount 3, no certifications."
            - "One DRAFT FORECAST_BASED StaffingPlan, so basis_attendance is 6000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Computed Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount: 99, shift_minutes: 10 }
              as: StaffingCoordinator
              captures: { slot_a: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z200", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_b: $.data.id }
          assert:
            - "PositionSlot.${slot_a}.ratio_derived_headcount == 5 and required_headcount == 5 (the body's 99 is discarded)"
            - "PositionSlot.${slot_a}.shift_minutes == 245 (the body's 10 is discarded)"
            - "PositionSlot.${slot_a}.slot_labor_cost_cents == 40833"
            - "PositionSlot.${slot_a}.filled_headcount == 0 and status == OPEN"
            - "PositionSlot.${slot_b}.ratio_derived_headcount == 5 and required_headcount == 2"
            - "PositionSlot.${slot_b}.slot_labor_cost_cents == 16333"
            - "StaffingPlan.${plan_id}.total_required_headcount == 7, base_labor_cost_cents == 57166, accessibility_surcharge_cents == 0 (7 < 60) and projected_labor_cost_cents == 57166"

      - name: guest_issue_system_fields_stamped_by_server_input_ignored
        claim_type: system_fields
        grounds:
          - endpoints[POST /guest-issues]
          - entities.GuestIssue.fields.reported_by_user_id
          - entities.GuestIssue.fields.status
          - entities.GuestIssue.fields.refund_status
          - entities.GuestIssue.fields.severity
          - calculations.guest_issue_sla
        distinguishing_aspect: >-
          reported_by_user_id comes from the X-User-ID header and not from the body, status is
          forced to OPEN, refund_status to NONE and refund_requested_cents to 0, while the computed
          SLA block is stamped from the logical clock: a MEDIUM SEAT_RELOCATION issue filed at
          2026-09-12T18:00:00Z carries sla_minutes 45 and sla_deadline 2026-09-12T18:45:00Z with
          sla_breached false.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:00:00Z."
            - "One Event (any status) to hang the issue on."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "System Fields Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "SEAT_RELOCATION", severity: "MEDIUM", description: "Obstructed view in 114", seat_reference: "114-R-8", status: "RESOLVED", reported_by_user_id: "spoofed-user" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { gi_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "GuestIssue.${gi_id}.reported_by_user_id == 'sup-1' (X-User-ID, not the body's 'spoofed-user')"
            - "GuestIssue.${gi_id}.status == OPEN (the body's RESOLVED is discarded)"
            - "GuestIssue.${gi_id}.severity == MEDIUM and sla_minutes == 45"
            - "GuestIssue.${gi_id}.sla_clock_started_at == '2026-09-12T18:00:00Z' and sla_deadline == '2026-09-12T18:45:00Z'"
            - "GuestIssue.${gi_id}.sla_breached == false"
            - "GuestIssue.${gi_id}.refund_status == NONE, refund_requested_cents == 0, refund_approved_cents == 0"
            - "GuestIssue.${gi_id}.assigned_staff_member_id, escalated_from_issue_id, resolved_at, resolution_type, relocation_zone_code and refund_requested_by_user_id are all null"
            - "GuestIssue.${gi_id}.reopen_count == 0 and version == 1"

      - name: accessibility_enum_and_range_constraints_rejected
        claim_type: type_constraints
        grounds:
          - errors[ERR_VALIDATION_FAILED]
          - errors[ERR_INVALID_TIME_WINDOW]
          - validations[priority 3]
          - validations[priority 4]
          - entities.AccessibilityResource.fields.resource_type
          - entities.AccessibilityResource.fields.unit_count
          - entities.AccessibilityRequest.fields.units_requested
          - entities.SatisfactionResponse.fields.score
        distinguishing_aspect: >-
          Enum closure and numeric ranges are enforced separately from window ordering: an unknown
          resource_type, units_requested 0 and a satisfaction score of 6 are all
          ERR_VALIDATION_FAILED at priority 3, while window_end == window_start is
          ERR_INVALID_TIME_WINDOW at priority 4 - a different error id for a syntactically valid
          but temporally empty interval.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:00:00Z; one Event and one AccessibilityResource with unit_count 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Type Constraint Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /accessibility-resources"
              payload: { event_id: "${ev_id}", resource_type: "WHEELCHAIR_ESCORT", zone_code: "Z100", unit_count: 3 }
              as: GuestServicesSupervisor
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /accessibility-resources"
              payload: { event_id: "${ev_id}", resource_type: "SERVICE_ANIMAL_RELIEF", zone_code: "Z100", unit_count: 2 }
              as: GuestServicesSupervisor
              captures: { err_enum: $.data.error_id }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_id}", guest_reference: "G-1", window_start: "2026-09-12T19:00:00Z", window_end: "2026-09-12T20:00:00Z", units_requested: 0 }
              as: GuestServicesSupervisor
              captures: { err_range: $.data.error_id }
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z100", score: 6 }
              as: GuestServicesSupervisor
              captures: { err_score: $.data.error_id }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_id}", guest_reference: "G-2", window_start: "2026-09-12T19:00:00Z", window_end: "2026-09-12T19:00:00Z", units_requested: 1 }
              as: GuestServicesSupervisor
              captures: { err_window: $.data.error_id }
          assert:
            - "first call: HTTP 422 and data.error_id == 'ERR_VALIDATION_FAILED' (resource_type not in the declared enum)"
            - "second call: HTTP 422 and data.error_id == 'ERR_VALIDATION_FAILED' (units_requested < 1)"
            - "third call: HTTP 422 and data.error_id == 'ERR_VALIDATION_FAILED' (score outside 1..5)"
            - "fourth call: HTTP 422 and data.error_id == 'ERR_INVALID_TIME_WINDOW' (window_end <= window_start)"
            - "AccessibilityResource.${res_id}.peak_committed_units == 0 and GET /accessibility-requests?resource_id=${res_id} returns total_count == 0"

      - name: satisfaction_response_has_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.SatisfactionResponse
          - endpoints[POST /satisfaction-responses]
          - endpoints[GET /events/{id}/satisfaction-responses]
          - calculations.event_satisfaction_summary
        distinguishing_aspect: >-
          SatisfactionResponse is the scaffold's only `common_fields: false` entity: its create
          response carries no version, no id, no created_at and no updated_at, §1.5 declares no
          PATCH / PUT / DELETE for it, and the summary aggregation therefore counts every row that
          was ever posted - two rows in the same zone both survive and the average is 4.50.
        test_recipe:
          setup:
            - "Clock at 2026-09-13T09:00:00Z; one Event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T09:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Immutability Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z100", score: 5, comment: "Great ushers" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z100", score: 4 }
              as: GuestExperienceDirector
              as_user_id: "dir-1"
            - call: "GET /events/${ev_id}/satisfaction-responses"
              as: GuestServicesSupervisor
          assert:
            - "both POSTs return 201"
            - "each POST response data object contains exactly the keys event_id, zone_code, score, comment, submitted_by_user_id - no id, created_at, updated_at or version"
            - "first row submitted_by_user_id == 'sup-1'; second row submitted_by_user_id == 'dir-1' and comment is null"
            - "the listing returns total_count == 2 and neither row carries a version field"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint whose path is /satisfaction-responses or /satisfaction-responses/{id}"
            - "GET /events/${ev_id}/satisfaction-summary reports response_count == 2 and average_score == 4.50"

      - name: child_creation_with_unknown_parent_fk_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority 6]
          - errors[ERR_EVENT_NOT_FOUND]
          - errors[ERR_STAFF_MEMBER_NOT_FOUND]
          - errors[ERR_POSITION_TYPE_NOT_FOUND]
          - endpoints[POST /staffing-plans]
          - endpoints[POST /certifications]
          - endpoints[POST /position-slots]
        distinguishing_aspect: >-
          Body foreign keys are resolved at §1.4 priority 6 and each names its own entity's 404:
          POST /staffing-plans with an unknown event_id gives ERR_EVENT_NOT_FOUND, POST
          /certifications with an unknown staff_member_id gives ERR_STAFF_MEMBER_NOT_FOUND, and
          POST /position-slots with a valid plan_id but unknown position_type_id gives
          ERR_POSITION_TYPE_NOT_FOUND - never a generic validation error and never a partial row.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z; one Event and one DRAFT plan exist, so the valid-FK arm of each call is genuinely valid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "FK Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /staffing-plans"
              payload: { event_id: "00000000-0000-0000-0000-0000000000ff", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { err_ev: $.data.error_id }
            - call: "POST /certifications"
              payload: { staff_member_id: "00000000-0000-0000-0000-0000000000ff", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { err_sm: $.data.error_id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "00000000-0000-0000-0000-0000000000ff", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z" }
              as: StaffingCoordinator
              captures: { err_pt: $.data.error_id }
          assert:
            - "first call: HTTP 404 and data.error_id == 'ERR_EVENT_NOT_FOUND'"
            - "second call: HTTP 404 and data.error_id == 'ERR_STAFF_MEMBER_NOT_FOUND'"
            - "third call: HTTP 404 and data.error_id == 'ERR_POSITION_TYPE_NOT_FOUND'"
            - "GET /staffing-plans?event_id=${ev_id} still returns total_count == 1"
            - "GET /position-slots?plan_id=${plan_id} returns total_count == 0"
            - "StaffingPlan.${plan_id}.total_required_headcount == 0 and projected_labor_cost_cents == 0"

      - name: flat_topology_slot_cross_reference_integrity
        claim_type: parent_relationships
        grounds:
          - complexity_profile.entity_topology
          - endpoints[GET /position-slots]
          - endpoints[GET /staffing-plans]
          - entities.PositionSlot.fields.plan_id
          - entities.PositionSlot.fields.position_type_id
        distinguishing_aspect: >-
          The topology is `flat`, so a PositionSlot's two independent foreign keys must both be
          honoured by the filtered reverse reads: with two plans on one event and two PositionTypes,
          GET /position-slots?plan_id= partitions the four slots 2/2 by plan and
          GET /position-slots?position_type_id= partitions the same four slots 2/2 by type, and the
          two filters combined select exactly one slot.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z; one Event with expected_attendance 6000."
            - "Two PositionTypes (TICKET_TAKER, ELEVATOR_OPERATOR) and two DRAFT FORECAST_BASED plans."
            - "Four slots: each plan gets one slot of each PositionType."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Topology Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt: $.data.id }
            - call: "POST /position-types"
              payload: { code: "ELEVATOR_OPERATOR", display_name: "Elevator Operator", base_hourly_rate_cents: 2600, attendance_ratio_per_1000: 0.2, min_headcount: 2, required_certifications: ["ELEVATOR_OPERATION"] }
              as: StaffingCoordinator
              captures: { pt_eo: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_1: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_2: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_1}", position_type_id: "${pt_tt}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_1t: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_1}", position_type_id: "${pt_eo}", zone_code: "Z110", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_1e: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_2}", position_type_id: "${pt_tt}", zone_code: "Z200", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_2t: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_2}", position_type_id: "${pt_eo}", zone_code: "Z210", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_2e: $.data.id }
          trigger:
            - call: "GET /position-slots?plan_id=${plan_1}"
              as: StaffingCoordinator
            - call: "GET /position-slots?position_type_id=${pt_eo}"
              as: StaffingCoordinator
            - call: "GET /position-slots?plan_id=${plan_2}&position_type_id=${pt_tt}"
              as: StaffingCoordinator
            - call: "GET /staffing-plans?event_id=${ev_id}"
              as: StaffingCoordinator
          assert:
            - "first call: total_count == 2 and the ids are exactly {${slot_1t}, ${slot_1e}}"
            - "second call: total_count == 2 and the ids are exactly {${slot_1e}, ${slot_2e}}"
            - "third call: total_count == 1 and data[0].id == ${slot_2t}"
            - "fourth call: total_count == 2 and the ids are exactly {${plan_1}, ${plan_2}} with revision_number 1 and 2"
            - "StaffingPlan.${plan_1}.total_required_headcount == 2 and StaffingPlan.${plan_2}.total_required_headcount == 2"

      - name: position_slot_labor_cost_computed_field
        claim_type: computed_fields
        grounds:
          - calculations.staffing_plan_projected_labor_cost
          - entities.PositionSlot.fields.slot_labor_cost_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / plan_cost_round_per_slot_then_sum
          rationale: "The per-slot rounding then plan-level summation of slot_labor_cost_cents is the whole subject of that §1.8 instance."

  # ===================================================================================
  # 2. From Table 2 (State Machines) - §1.2 surface: 10 machines, shape `cyclic`,
  #    cascade-down / cross-entity / ledger-sync / compensation side-effect patterns
  # ===================================================================================
  - section: state_machines
    instances:

      - name: every_created_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Event.initial_state
          - state_machines.StaffingPlan.initial_state
          - state_machines.PositionSlot.initial_state
          - state_machines.StaffMember.initial_state
          - state_machines.ShiftBid.initial_state
          - state_machines.StaffAssignment.initial_state
          - state_machines.GuestIssue.initial_state
          - state_machines.AccessibilityResource.initial_state
          - state_machines.AccessibilityRequest.initial_state
        distinguishing_aspect: >-
          Every client-creatable entity's creation response already sits in its §1.2 initial_state -
          Event FORECAST, StaffingPlan DRAFT, PositionSlot OPEN, StaffMember ACTIVE, ShiftBid
          SUBMITTED, StaffAssignment SCHEDULED on the attendance dimension and PENDING on the payout
          dimension, GuestIssue OPEN, AccessibilityResource AVAILABLE, AccessibilityRequest
          REQUESTED - and none of them can be steered elsewhere at creation time.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One Event with expected_attendance 6000, one TICKET_TAKER PositionType requiring no certification."
            - "One DRAFT plan activated so the event reaches PLANNED and bidding is permitted."
            - "Two slots on that plan (slot_a is left untouched so its OPEN status is observable)."
            - "Two ACTIVE StaffMembers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { name: "Initial State Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version, ev_status_at_create: $.data.status }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id, plan_status_at_create: $.data.status }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_a: $.data.id, slot_a_status: $.data.status }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z200", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_b: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ada Usher", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id, m1_status: $.data.status }
            - call: "POST /staff-members"
              payload: { full_name: "Ben Taker", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2021-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m2: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /shift-bids"
              payload: { staff_member_id: "${m1}", position_slot_id: "${slot_b}" }
              as: StaffMember
              as_user_id: "${m1}"
              captures: { bid_1: $.data.id, bid_1_status: $.data.status }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_b}", staff_member_id: "${m2}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id, asg_1_att: $.data.attendance_status, asg_1_pay: $.data.payout_status }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "KIOSK", category: "LOST_FOUND", severity: "LOW", description: "Umbrella left in 214" }
              as: GuestServicesSupervisor
              captures: { gi_1: $.data.id, gi_1_status: $.data.status }
            - call: "POST /accessibility-resources"
              payload: { event_id: "${ev_id}", resource_type: "ASSISTIVE_LISTENING_UNIT", zone_code: "Z100", unit_count: 3 }
              as: GuestServicesSupervisor
              captures: { res_1: $.data.id, res_1_status: $.data.status }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_1}", guest_reference: "G-1", window_start: "2026-09-12T19:00:00Z", window_end: "2026-09-12T20:00:00Z", units_requested: 1 }
              as: GuestServicesSupervisor
              captures: { ar_1: $.data.id, ar_1_status: $.data.status }
          assert:
            - "${ev_status_at_create} == 'FORECAST'"
            - "${plan_status_at_create} == 'DRAFT' and StaffingPlan.${plan_id}.revision_number == 1"
            - "${slot_a_status} == 'OPEN' and PositionSlot.${slot_a}.filled_headcount == 0 and PositionSlot.${slot_a}.status is still OPEN at the end of the chain"
            - "${m1_status} == 'ACTIVE'"
            - "${bid_1_status} == 'SUBMITTED' and ShiftBid.${bid_1}.rank_score is null and decision_reason is null"
            - "${asg_1_att} == 'SCHEDULED' and ${asg_1_pay} == 'PENDING'"
            - "StaffAssignment.${asg_1}.source == MANUAL, shift_bid_id is null, check_in_at is null, worked_minutes == 0"
            - "${gi_1_status} == 'OPEN' and GuestIssue.${gi_1}.refund_status == NONE"
            - "${res_1_status} == 'AVAILABLE' and AccessibilityResource.${res_1}.peak_committed_units == 0"
            - "${ar_1_status} == 'REQUESTED' and AccessibilityRequest.${ar_1}.confirmed_at is null"
            - "GET /backfill-requests returns total_count == 0 - BackfillRequest has no client create path, its OPEN initial state is only reachable through a NO_SHOW cascade"

      - name: plan_activation_promotes_event_and_stamps_activated_at
        claim_type: valid_transition
        grounds:
          - state_machines.StaffingPlan.DRAFT_to_ACTIVE
          - state_machines.Event.FORECAST_to_PLANNED
          - endpoints[POST /staffing-plans/{id}/activate]
          - calculations.staffing_plan_projected_labor_cost
          - concurrency_rules[plan-activate-stale-event]
        distinguishing_aspect: >-
          One activate call fires two declared transitions at once: StaffingPlan DRAFT -> ACTIVE
          with activated_at stamped at the logical clock and the four aggregates recomputed
          (total_required_headcount 2, base_labor_cost_cents 16333, surcharge 0, projected 16333),
          and Event FORECAST -> PLANNED with version incremented from 1 to 2.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One FORECAST Event with expected_attendance 6000; one TICKET_TAKER PositionType (2000 cents/h, ratio 0.8, min 3)."
            - "One DRAFT FORECAST_BASED plan carrying one slot with required_headcount_override 2 over a 245-minute window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Activation Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
          assert:
            - "HTTP status is 200"
            - "StaffingPlan.${plan_id}.status == ACTIVE"
            - "StaffingPlan.${plan_id}.activated_at == '2026-09-01T09:00:00Z'"
            - "StaffingPlan.${plan_id}.basis_attendance == 6000 and basis_attendance_tier == TIER_1"
            - "StaffingPlan.${plan_id}.total_required_headcount == 2"
            - "StaffingPlan.${plan_id}.base_labor_cost_cents == 16333"
            - "StaffingPlan.${plan_id}.accessibility_surcharge_cents == 0 and projected_labor_cost_cents == 16333"
            - "PositionSlot.${slot_id}.slot_labor_cost_cents == 16333 and status == OPEN"
            - "Event.${ev_id}.status == PLANNED"
            - "Event.${ev_id}.version == 2 (exactly one increment)"

      - name: event_close_releases_scheduled_assignments_and_voids_payout
        claim_type: side_effect_execution
        grounds:
          - state_machines.Event.IN_PROGRESS_to_CLOSED
          - state_machines.StaffAssignment.SCHEDULED_to_RELEASED
          - endpoints[POST /events/{id}/lifecycle]
          - endpoints[GET /events/{id}/staffing-model-recommendation]
          - calculations.staffing_model_recommendation
        distinguishing_aspect: >-
          Closing the event executes every declared side effect of IN_PROGRESS -> CLOSED in the same
          request: both SCHEDULED assignments become RELEASED with payout_status VOIDED and
          total_payout_cents 0, the slot's filled_headcount falls 2 -> 0 and its status re-derives to
          OPEN, no BackfillRequest is opened, neither member's reliability_score moves off 100, and
          the previously refused recommendation read now answers 200 with fill_rate_bp 0 and
          direction INCREASE (0.8 x 1.10 = 0.88).
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:00:00Z."
            - "One Event (expected_attendance 6000) driven to IN_PROGRESS, its single plan LOCKED."
            - "One TICKET_TAKER slot with required_headcount_override 2, filled by two MANUAL assignments, both still SCHEDULED (nobody checked in)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Close Cascade Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T19:00:00Z", shift_end: "2026-09-12T23:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ada Usher", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ben Taker", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2021-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m2: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m2}" }
              as: StaffingCoordinator
              captures: { asg_2: $.data.id }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "GET /events/${ev_id}/staffing-model-recommendation"
              as: StaffingCoordinator
              captures: { err_before_close: $.data.error_id }
          trigger:
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "CLOSED" }
              as: GuestExperienceDirector
            - call: "GET /events/${ev_id}/staffing-model-recommendation"
              as: StaffingCoordinator
          assert:
            - "${err_before_close} == 'ERR_EVENT_STATE_INVALID' - the recommendation read is refused while the event is IN_PROGRESS"
