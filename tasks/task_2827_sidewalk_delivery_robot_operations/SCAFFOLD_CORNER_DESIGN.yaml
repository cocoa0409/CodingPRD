              payload: { zone_id: "11111111-1111-4111-8111-111111111111", segment_code: "SZ", segment_type: "WALKWAY", length_m: 100.0, measured_clearance_cm: 120.0, surface_grade_pct: 2.0 }
              as: PlatformAdmin
            - call: "POST /robots"
              payload: { zone_id: "11111111-1111-4111-8111-111111111111", asset_tag: "RBT-777", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 900 }
              as: PlatformAdmin
            - call: "POST /merchants"
              payload: { zone_id: "11111111-1111-4111-8111-111111111111", name: "Ghost Cafe" }
              as: PlatformAdmin
            - call: "POST /depot-bays"
              payload: { zone_id: "11111111-1111-4111-8111-111111111111", bay_code: "BX", bay_type: "CHARGE" }
              as: PlatformAdmin
          assert:
            - "the segment create returns 404 with error_id ERR_ZONE_NOT_FOUND"
            - "the robot create returns 404 with error_id ERR_ZONE_NOT_FOUND and not 422 ERR_ORDINANCE_SPEED_EXCEEDED"
            - "the merchant create returns 404 with error_id ERR_ZONE_NOT_FOUND"
            - "the bay create returns 404 with error_id ERR_ZONE_NOT_FOUND"
            - "GET /sidewalk-segments reports total_count == 0, GET /robots reports total_count == 0, GET /merchants reports total_count == 0 and GET /depot-bays reports total_count == 0"
