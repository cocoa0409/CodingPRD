              captures: { e_panel: $.data.error_id }
            - call: "GET /flood-zone/properties/99999999-9999-4999-8999-999999999999"
              as: ProviderAnalyst
              captures: { e_property: $.data.error_id }
            - call: "GET /flood-zone/structures/99999999-9999-4999-8999-999999999999"
              as: ProviderAnalyst
              captures: { e_structure: $.data.error_id }
            - call: "GET /flood-zone/loan-folios/99999999-9999-4999-8999-999999999999"
              as: ProviderAnalyst
              captures: { e_folio: $.data.error_id }
            - call: "GET /flood-zone/determinations/99999999-9999-4999-8999-999999999999"
              as: ProviderAnalyst
              captures: { e_determination: $.data.error_id }
            - call: "GET /flood-zone/disputes/99999999-9999-4999-8999-999999999999"
              as: ProviderAnalyst
              captures: { e_dispute: $.data.error_id }
            - call: "GET /flood-zone/elevation-certificates/99999999-9999-4999-8999-999999999999"
              as: ProviderAnalyst
              captures: { e_certificate: $.data.error_id }
            - call: "GET /flood-zone/map-amendment-requests/99999999-9999-4999-8999-999999999999"
              as: ProviderAnalyst
              captures: { e_amendment: $.data.error_id }
            - call: "GET /flood-zone/compliance-notices/99999999-9999-4999-8999-999999999999"
              as: ProviderAnalyst
              captures: { e_notice: $.data.error_id }
            - call: "GET /flood-zone/lenders"
              as: ProviderAnalyst
            - call: "GET /flood-zone/map-panels"
              payload: { community_id: "99999999-9999-4999-8999-999999999999" }
              as: ProviderAnalyst
            - call: "GET /flood-zone/loan-folios"
              payload: { lender_id: "99999999-9999-4999-8999-999999999999" }
              as: ProviderAnalyst
            - call: "GET /flood-zone/disputes"
              payload: { determination_id: "99999999-9999-4999-8999-999999999999" }
              as: ProviderAnalyst
            - call: "GET /flood-zone/elevation-certificates"
              payload: { structure_id: "99999999-9999-4999-8999-999999999999" }
              as: ProviderAnalyst
            - call: "GET /flood-zone/map-amendment-requests"
              payload: { determination_id: "99999999-9999-4999-8999-999999999999" }
              as: ProviderAnalyst
            - call: "GET /flood-zone/compliance-notices"
              payload: { loan_folio_id: "99999999-9999-4999-8999-999999999999" }
