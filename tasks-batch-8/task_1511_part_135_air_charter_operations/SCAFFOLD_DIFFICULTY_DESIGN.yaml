          setup:
            - "Clock 2026-08-01T00:00:00Z; one PIC crew qualified LIGHT_JET"
            - "Trip A dep 2026-08-10T10:00:00Z, leg REV 240 -> duty interval [09:30, 14:30], VETTED"
            - "Trip B dep 2026-08-11T01:00:00Z, leg REV 60 -> duty interval [00:30, 02:30]; gap from A is exactly 600 minutes"
          setup_api_calls:
            - { call: "POST /charter/crew-members", payload: { name: "Pic R", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_r: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
