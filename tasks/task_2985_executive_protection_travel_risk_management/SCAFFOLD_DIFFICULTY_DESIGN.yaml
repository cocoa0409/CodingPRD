  - rule_id: transitive_cascade
    instances:

      - name: vendor_suspension_cascades_five_hops_to_check_in_interval
        grounds:
          - endpoints.POST_/exec-protection/vendors/{id}/suspend
          - state_machines.VendorEngagement.ACTIVE_to_CANCELLED
          - calculations.advance_requirement_set
          - calculations.check_in_schedule
          - calculations.commitment_ledgers
          - entities.TripLeg.fields.completed_advance_items
          - entities.Trip.fields.check_in_interval_hours
          - entities.Executive.fields.open_degraded_trip_count
        distinguishing_aspect: |
          Depth 5, triggered by a Vendor write. Each hop is caused by the previous one and
          by nothing else in the request: suspending the vendor (hop 1) is what cancels its
          ACTIVE engagement (hop 2); the cancellation of a LOCAL_LIAISON engagement is what
          strips LOCAL_LIAISON from the leg's completed_advance_items (hop 3); losing that
          item is what flips advance_complete false and drops the trip READY -> DEGRADED
          (hop 4); and being DEGRADED is what re-selects check_in_interval_hours from
          DEGRADED_CHECK_IN_INTERVAL_HOURS and bumps the executive's open_degraded_trip_count
          (hop 5). The request touches no Trip, TripLeg, Executive or CheckIn identifier.
