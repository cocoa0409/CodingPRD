              as: ClaimsAdjuster
          assert:
            - "${firm_h_open_before} == 1"
            - "CounselAssignment.${asg_h}.assignment_status == DECLINED"
            - "CounselAssignment.${asg_h}.decline_reason == positional conflict with an existing client"
            - "CounselAssignment.${asg_h}.candidate_pool_size == 1"
            - "DefenseCounselFirm.${firm_h}.open_assignment_count == 0"
            - "DefenseCounselFirm.${firm_h}.panel_status == ACTIVE"
            - "Claim.${clm_a}.counsel_reassignment_required == true"
            - "Claim.${clm_a}.excluded_counsel_firm_ids contains ${firm_h}"
            - "Claim.${clm_a}.claim_status == INVESTIGATION"

      - name: flat_cancellation_unwinds_the_premium_ledger_and_voids_dependent_coverage
        grounds:
          - state_machines.PolicyTerm.IN_FORCE_to_CANCELLED_FLAT
          - calculations.pro_rata_return_premium
          - entities.Policy.fields.written_premium_net_total
          - entities.PolicyTerm.fields.aggregate_limit_remaining
          - entities.Claim.fields.denial_reason
        distinguishing_aspect: |
          A flat cancellation must return the entire 19285.00 net premium so that
          Policy.written_premium_net_total falls back to exactly 0.00, surrender the aggregate limit
          to 0.00, and reverse the coverage the term granted by denying its claim with TERM_VOIDED -
          leaving no residue of the issuance anywhere.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured, CREDENTIALED through 2028-01-01."
            - "CLAIMS_MADE policy, one term 2026-08-01 -> 2027-08-01 issued into IN_FORCE at premium_net 19285.00, so written_premium_net_total reads 19285.00 and aggregate_limit_remaining 3000000.00."
            - "One claim reported 2026-09-01 resolves to that term and is moved to COVERED, then INVESTIGATION."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              captures: { term_a1: $.data.id }
            - call: "POST /mpl/policy-terms/${term_a1}/issuance"
              payload: {}
              as: UnderwritingOfficer
            - call: "GET /mpl/policies/${pol_a}"
              payload: {}
              as: UnderwritingOfficer
              captures: { written_before: $.data.written_premium_net_total }
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-05", report_date: "2026-09-01", venue_code: "COOK_IL", allegation_category: "OBSTETRIC_INJURY", demand_amount: 800000.00 }
              as: ClaimsAdjuster
              captures: { clm_a: $.data.id }
            - call: "POST /mpl/claims/${clm_a}/coverage-decision"
              payload: { coverage_status: "COVERED" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /mpl/policy-terms/${term_a1}/cancellation"
              payload: { cancel_type: "FLAT", cancel_effective_date: "2026-08-01" }
              as: UnderwritingOfficer
          assert:
            - "${written_before} == 19285.00"
            - "PolicyTerm.${term_a1}.status == CANCELLED_FLAT"
            - "PolicyTerm.${term_a1}.cancel_effective_date == 2026-08-01"
            - "PolicyTerm.${term_a1}.premium_net == 19285.00"
            - "PolicyTerm.${term_a1}.return_premium == 19285.00"
            - "PolicyTerm.${term_a1}.aggregate_limit_remaining == 0.00"
            - "Policy.${pol_a}.written_premium_net_total == 0.00"
            - "Policy.${pol_a}.status == CANCELLED"
            - "Policy.${pol_a}.current_term_id == null"
            - "Claim.${clm_a}.coverage_status == DENIED"
            - "Claim.${clm_a}.denial_reason == TERM_VOIDED"
            - "Claim.${clm_a}.claim_status == INVESTIGATION"
