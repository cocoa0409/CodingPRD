      - name: repeating_a_trigger_after_it_succeeded_is_rejected_without_double_side_effects
        claim_type: Idempotency
        grounds:
          - "state_machines.Offer.DRAFT_to_SUBMITTED"
          - "state_machines.VendorInvoice.SUBMITTED_to_VERIFIED"
          - "state_machines.Show[dimension=sales_status].SELLING_to_PAUSED"
          - "validations[priority=17]"
        distinguishing_aspect: |
          Replay safety without an idempotency-key layer: the second identical POST must be refused by
          the state machine, and — the part an implementation can silently get wrong — it must leave no
          partial trace. So submit-twice is checked against offer.round_index (still 1) and expires_at
          (unchanged, not pushed 72 more hours by the replay), and verify-twice is checked against
          verified_by_user_id, which must still name the FIRST verifier even though the replay came
          from a different user.
