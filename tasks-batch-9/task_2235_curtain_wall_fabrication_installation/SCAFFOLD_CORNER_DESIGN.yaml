# §1.9 Scaffold Corner Design (Breadth Coverage Index) - task_2235 curtain wall fabrication & installation
# 9 sections, 71 instances (54 full recipes, 17 excluded_because stubs deferring to §1.8).
scaffold_corner_design:
- section: entities
  instances:
  - name: create_facade_package_returns_every_declared_field
    claim_type: creation
    grounds:
    - entities.FacadePackage
    - endpoints[POST /facade-packages]
    - calculations.engineering_posture
    distinguishing_aspect: A package created with all eight required inputs returns 201 with every §1.1 field present, the
      system defaults applied (state DESIGN_ASSIST, system_type UNDECIDED, engineering_posture OPEN) and every computed
      aggregate at zero.
    test_recipe:
      setup:
      - empty database with the logical clock at 2026-08-03T08:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      trigger:
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      assert:
      - HTTP 201 and response_type object with meta.api_request_id present
      - FacadePackage.${pkg}.name == Tower A Facade, floor_count == 20, total_area_sqm == 9000.0, contract_value_cents ==
        1450000000
      - FacadePackage.${pkg}.unit_rate_cents_per_sqm == 148733, base_labor_rate_cents_per_hour == 9800, design_temp_delta_c
        == 60.0
      - FacadePackage.${pkg}.weather_tightness_deadline_date == 2026-12-15 and system_type == UNDECIDED
      - FacadePackage.${pkg}.state == DESIGN_ASSIST, engineering_posture == OPEN, mockup_qualified == false
      - FacadePackage.${pkg}.planned_shop_hours == 0, planned_field_crew_size == 0, certified_area_sqm == 0, earned_value_certified_cents
        == 0, retention_held_cents == 0, weather_tight_zone_count == 0
      - FacadePackage.${pkg}.id, created_at, updated_at and version == 1 are present
  - name: get_installation_zone_by_id_returns_the_stored_row
    claim_type: retrieval
    grounds:
    - entities.InstallationZone
    - endpoints[GET /installation-zones/{id}]
    - calculations.thermal_movement_allowance_mm
    - calculations.zone_deflection_limit_mm
    distinguishing_aspect: GET /installation-zones/{id} returns exactly the row the POST created, including the two fields
      computed at creation (thermal_movement_allowance_mm 7.34 and deflection_limit_mm 13.33) and the null-valued cost fields.
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; package decided UNITIZED with design_temp_delta_c 60.0
      - 'one zone: floor 5, NORTH, area 412.37, height 24.0, span 3200, SLOTTED, designed_joint 22.0, 36 panels, budget
        320.0'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      - call: POST /facade-packages/${pkg}/system-decision
        payload:
          system_type: UNITIZED
        as: CWProjectManager
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 5
          elevation_label: NORTH
          area_sqm: 412.37
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          z1: $.data.id
      trigger:
      - call: GET /installation-zones/${z1}
        payload: {}
        as: FieldSuperintendent
      assert:
      - HTTP 200 with InstallationZone.${z1}.package_id == ${pkg} and floor_number == 5 and elevation_label == NORTH
      - InstallationZone.${z1}.area_sqm == 412.37, height_m == 24.0, span_mm == 3200, anchor_type == SLOTTED, designed_joint_mm
        == 22.0
      - InstallationZone.${z1}.install_status == PLANNED and weather_status == NOT_TIGHT
      - InstallationZone.${z1}.thermal_movement_allowance_mm == 7.34 and deflection_limit_mm == 13.33
      - InstallationZone.${z1}.provisional_labor_cost_cents == null, final_labor_cost_cents == null, certified_line_cents
        == null
      - InstallationZone.${z1}.consumed_crew_hours == 0 and remaining_crew_hours == 320.0
  - name: list_panel_lots_paginates_and_filters_by_zone
    claim_type: listing
    grounds:
    - endpoints[GET /panel-lots]
    - response_envelope.pagination_fields
    - entities.PanelLot
    distinguishing_aspect: 'GET /panel-lots honours limit/offset together with the zone_id filter: three lots across two
      zones yield total_count 3 unfiltered, total_count 2 for the two-lot zone, and has_more true only when limit truncates
      the filtered set.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; qualified package with an APPROVED submittal and 240 lites received
      - zone 1 gets a 36-panel lot from release 1 and an 18-panel lot from release 2; zone 2 gets a 30-panel lot from release
        3
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      - call: POST /facade-packages/${pkg}/system-decision
        payload:
          system_type: UNITIZED
        as: CWProjectManager
      - call: POST /test-labs
        payload:
          name: Chamber Labs NE
          chamber_capacity: 2
          accreditation_ref: AAMA-CL-01
        as: CWProjectManager
        captures:
          lab: $.data.id
      - call: POST /mockup-tests
        payload:
          package_id: ${pkg}
          test_lab_id: ${lab}
          window_start: '2026-08-05T06:00:00Z'
          window_end: '2026-08-05T20:00:00Z'
          chambers_required: 1
        as: CWProjectManager
        captures:
          mock: $.data.id
      - call: POST /mockup-tests/${mock}/record-result
        payload:
          water_penetration_observed: false
          air_infiltration_cfm: 0.04
          structural_deflection_mm: 15.0
        as: QCInspector
        as_user_id: u-qc-1
      - call: POST /shop-drawing-submittals
        payload:
          package_id: ${pkg}
          submittal_type: SHOP_DRAWING
          title: Typical unitized panel set
          drawing_set_ref: SD-001
          delegated_design_scope: true
        as: CWDetailer
        captures:
          sub: $.data.id
      - call: POST /shop-drawing-submittals/${sub}/seal
        payload:
          seal_license_no: PE-44821
        as: DelegatedEngineer
        as_user_id: u-eng-1
      - call: POST /shop-drawing-submittals/${sub}/start-review
        payload: {}
        as: ArchitectOfRecord
        as_user_id: u-aor-1
      - call: POST /shop-drawing-submittals/${sub}/review
        payload:
          decision: APPROVED
        as: ArchitectOfRecord
        as_user_id: u-aor-1
      - call: POST /glass-orders
        payload:
          package_id: ${pkg}
          supplier_name: Vitro Flat Glass
          coating_code: LOWE-366
          quoted_lead_time_days: 90
          ordered_lites: 240
        as: GlazingProcurement
        captures:
          go: $.data.id
      - call: POST /glass-orders/${go}/start-production
        payload: {}
        as: GlazingProcurement
      - call: POST /glass-orders/${go}/receive
        payload:
          received_lites: 240
        as: GlazingProcurement
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 5
          elevation_label: NORTH
          area_sqm: 412.37
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          z1: $.data.id
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 6
          elevation_label: NORTH
          area_sqm: 388.63
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 30
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          z2: $.data.id
      - call: GET /facade-packages/${pkg}
        payload: {}
        as: CWProjectManager
        captures:
          pkg_v1: $.data.version
      - call: POST /fabrication-releases
        payload:
          package_id: ${pkg}
          submittal_id: ${sub}
          glass_order_id: ${go}
          zone_ids:
          - ${z1}
          panels_per_zone: 36
          lites_per_panel: 2
          expected_package_version: ${pkg_v1}
        as: CWProjectManager
        captures:
          rel1: $.data.id
      - call: GET /facade-packages/${pkg}
        payload: {}
        as: CWProjectManager
        captures:
          pkg_v2: $.data.version
      - call: POST /fabrication-releases
        payload:
          package_id: ${pkg}
          submittal_id: ${sub}
          glass_order_id: ${go}
          zone_ids:
          - ${z1}
          panels_per_zone: 18
          lites_per_panel: 2
          expected_package_version: ${pkg_v2}
        as: CWProjectManager
        captures:
          rel2: $.data.id
      - call: GET /facade-packages/${pkg}
        payload: {}
        as: CWProjectManager
        captures:
          pkg_v3: $.data.version
      - call: POST /fabrication-releases
        payload:
          package_id: ${pkg}
          submittal_id: ${sub}
          glass_order_id: ${go}
          zone_ids:
          - ${z2}
          panels_per_zone: 30
          lites_per_panel: 2
          expected_package_version: ${pkg_v3}
        as: CWProjectManager
        captures:
          rel3: $.data.id
      trigger:
      - call: GET /panel-lots
        payload:
          zone_id: ${z1}
          limit: 1
          offset: 0
        as: FieldSuperintendent
        captures:
          first_lot: $.data[0].id
      assert:
      - the filtered call returns response_type array with exactly 1 row, total_count == 2 and has_more == true
      - GET /panel-lots with zone_id ${z1} and limit 10 returns 2 rows with has_more == false
      - GET /panel-lots with no filter returns total_count == 3
      - GET /panel-lots with zone_id ${z1} and offset 2 returns 0 rows with has_more == false and total_count still 2
      - every returned lot has zone_id == ${z1} and fabrication_status BATCHED
      - PanelLot.${first_lot}.lite_count == 72 (the 36-panel lot of release 1 comes first in creation order)
  - name: missing_ids_across_entity_families_return_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_PACKAGE_NOT_FOUND]
    - errors[ERR_ZONE_NOT_FOUND]
    - errors[ERR_GLASS_ORDER_NOT_FOUND]
    - errors[ERR_SUBMITTAL_NOT_FOUND]
    - errors[ERR_LOT_NOT_FOUND]
    - errors[ERR_SURVEY_NOT_FOUND]
    - errors[ERR_TEST_NOT_FOUND]
    - errors[ERR_DEFECT_NOT_FOUND]
    - errors[ERR_HOIST_NOT_FOUND]
    - errors[ERR_RESOURCE_NOT_FOUND]
    - validations[priority=40]
    distinguishing_aspect: 'Each existence family maps to its own error_id at HTTP 404 rather than to a generic not-found:
      the same fabricated UUID produces ERR_PACKAGE_NOT_FOUND, ERR_ZONE_NOT_FOUND, ERR_GLASS_ORDER_NOT_FOUND, ERR_SUBMITTAL_NOT_FOUND,
      ERR_LOT_NOT_FOUND, ERR_SURVEY_NOT_FOUND, ERR_TEST_NOT_FOUND, ERR_DEFECT_NOT_FOUND, ERR_HOIST_NOT_FOUND or ERR_RESOURCE_NOT_FOUND
      depending on which reference is dangling.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; one package exists so that only the addressed reference is dangling
      - the UUID 11111111-2222-4333-8444-555555555555 belongs to no row of any table
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      - call: POST /facade-packages/${pkg}/system-decision
        payload:
          system_type: UNITIZED
        as: CWProjectManager
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 5
          elevation_label: NORTH
          area_sqm: 412.37
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          z1: $.data.id
      trigger:
      - call: GET /facade-packages/11111111-2222-4333-8444-555555555555
        payload: {}
        as: CWProjectManager
        captures:
          e_pkg: $.data.error_id
      - call: GET /installation-zones/11111111-2222-4333-8444-555555555555
        payload: {}
        as: FieldSuperintendent
        captures:
          e_zone: $.data.error_id
      - call: GET /glass-orders/11111111-2222-4333-8444-555555555555
        payload: {}
        as: GlazingProcurement
        captures:
          e_go: $.data.error_id
      - call: GET /shop-drawing-submittals/11111111-2222-4333-8444-555555555555
        payload: {}
        as: CWDetailer
        captures:
          e_sub: $.data.error_id
      - call: POST /panel-lots/11111111-2222-4333-8444-555555555555/advance-fabrication
        payload:
          to_status: GLAZED
        as: FieldSuperintendent
        captures:
          e_lot: $.data.error_id
      - call: POST /embed-surveys/11111111-2222-4333-8444-555555555555/confirm-pour
        payload:
          poured_at: '2026-08-06T12:00:00Z'
        as: StructuralContractor
        captures:
          e_survey: $.data.error_id
      - call: POST /field-tests/11111111-2222-4333-8444-555555555555/record-result
        payload:
          water_penetration_observed: false
        as: QCInspector
        as_user_id: u-qc-2
        captures:
          e_test: $.data.error_id
      - call: POST /defect-items/11111111-2222-4333-8444-555555555555/waive
        payload:
          waiver_ref: W-1
        as: ArchitectOfRecord
        captures:
          e_defect: $.data.error_id
      - call: POST /installation-zones/${z1}/hang-panels
        payload:
          hoist_reservation_id: 11111111-2222-4333-8444-555555555555
        as: FieldSuperintendent
        captures:
          e_hoist: $.data.error_id
      - call: POST /installation-zones/${z1}/crew-days/11111111-2222-4333-8444-555555555555/void
        payload:
          void_reason: wrong day
        as: FieldSuperintendent
        captures:
          e_resource: $.data.error_id
      assert:
      - the package read returns ERR_PACKAGE_NOT_FOUND with HTTP 404
      - the zone read returns ERR_ZONE_NOT_FOUND, the glass-order read ERR_GLASS_ORDER_NOT_FOUND and the submittal read
        ERR_SUBMITTAL_NOT_FOUND, all HTTP 404
      - the panel-lot action returns ERR_LOT_NOT_FOUND and the embed-survey action ERR_SURVEY_NOT_FOUND
      - the field-test action returns ERR_TEST_NOT_FOUND and the defect action ERR_DEFECT_NOT_FOUND
      - hang-panels with an unknown hoist_reservation_id returns ERR_HOIST_NOT_FOUND, not ERR_ZONE_SEQUENCE_VIOLATION -
        existence outranks state at priority 48 versus 64
      - voiding an unknown crew day returns ERR_RESOURCE_NOT_FOUND
      - every error body carries response_type error with data.error_id and data.message and no row was created or mutated
  - name: zone_create_missing_required_field_returns_invalid_request
    claim_type: required_fields
    grounds:
    - validations[priority=25]
    - errors[ERR_INVALID_REQUEST]
    - endpoints[POST /installation-zones]
    distinguishing_aspect: 'Every §1.5 input field of POST /installation-zones without a default is required: omitting span_mm
      returns ERR_INVALID_REQUEST at HTTP 400 and no zone row is created, while the complete payload succeeds.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; one package decided UNITIZED
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      - call: POST /facade-packages/${pkg}/system-decision
        payload:
          system_type: UNITIZED
        as: CWProjectManager
      trigger:
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 5
          elevation_label: NORTH
          area_sqm: 412.37
          height_m: 24.0
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          e_missing: $.data.error_id
      assert:
      - the response is ERR_INVALID_REQUEST with HTTP 400 and names the absent span_mm field in data.message
      - GET /installation-zones filtered by package_id ${pkg} returns total_count == 0
      - the same payload with span_mm 3200 added returns 201
      - omitting designed_joint_mm, area_sqm, height_m, anchor_type, planned_panel_count or budget_crew_hours each returns
        ERR_INVALID_REQUEST as well
      - FacadePackage.${pkg}.version is unchanged by the rejected call
