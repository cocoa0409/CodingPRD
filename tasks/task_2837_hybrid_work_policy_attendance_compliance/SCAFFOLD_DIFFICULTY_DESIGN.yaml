          assert:
            - "Before the trigger EligibilityClassification.${cls1_id}.state == PENDING_MANAGER and Employee.${e1_id}.current_eligibility_class == ONSITE_REQUIRED (the documented fallback)"
            - "Call 1 returns HTTP 409 with error id ERR_NO_APPROVED_CLASSIFICATION - a submitted-but-undecided classification does not count"
            - "Call 2 returns HTTP 409 with error id ERR_CLASS_NOT_REMOTE_ELIGIBLE - the classification IS approved, so the failure is a different rule at the same band"
            - "Call 3 returns HTTP 201 with status SUBMITTED, tax_review_status == PENDING, security_review_status == PENDING and preliminary_risk_score == 14 (US_TX 6 + INTERNAL 8)"
            - "Call 4 flips the blocking state: EligibilityClassification.${cls1_id}.state == APPROVED and Employee.${e1_id}.current_eligibility_class == FULLY_REMOTE"
            - "Call 5 is the byte-identical repeat of call 1 and now returns HTTP 201 - only the other aggregate's state changed"
            - "GET /remote-location-requests?employee_id=${e2_id} returns 0 rows, confirming call 2 created nothing"

      - name: cycle_lock_freezes_space_and_blocks_every_child_write
        grounds:
          - state_machines.PolicyCycle.OPEN_to_LOCKED
          - validations[priority=44, ERR_CYCLE_LOCKED]
          - entities.Neighborhood.fields.allocation_state
          - state_machines.AttendanceWeek.FINALIZED_to_LOCKED
        blocking_entity: PolicyCycle
        blocking_states: [LOCKED]
        distinguishing_aspect: |
          One posture write in the governance aggregate reaches down into two
          unrelated aggregates - every Neighborhood becomes FROZEN and every
          FINALIZED AttendanceWeek becomes LOCKED - and thereafter the band-44 gate
          outranks each child's own lifecycle rule: a RESERVED allocation whose
          commit would otherwise be perfectly legal answers ERR_CYCLE_LOCKED rather
          than any capacity or lifecycle error.
        test_recipe:
          setup:
            - "One OPEN cycle, team T1-CORE, ACTIVE employee E-1001, Neighborhood N-A1 (30 seats, 4 buffer, desks 1..30) with one RESERVED SeatAllocation of 5 seats over [2026-W37, 2026-W41), one FINALIZED AttendanceWeek for 2026-W37 and one OPEN AttendanceWeek for 2026-W38."
