            - "Remittance.${rem_id}.member_event_ids excludes the WITHHOLD event of ${ord_c}"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: payroll_run_period_adjacency_half_open
        grounds:
          - validations[priority=5]
          - errors[ERR_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Semantics = half-open period adjacency on the PayrollRun resource:
          a new run whose period_start equals the previous run's period_end+1
          day is legal (touching but non-overlapping), while a start equal to
          the previous period_end (one-day overlap) is rejected — the boundary
          sits exactly at [start, end] inclusive vs the next allowed day.
        test_recipe:
          setup:
            - "Employer with one VOIDED-safe OPEN run covering 2026-08-01..2026-08-15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "16-1616161", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15", expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { run_1: $.data.id }
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v2: $.data.version }
          trigger:
            # overlapping start (equals prior period_end) -> reject
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-15", period_end: "2026-08-31", pay_date: "2026-08-31", expected_employer_version: "${emp_v2}" }
              as: payroll_specialist
              captures: { err: $.data.error_id }
            # legal adjacency (start = prior end + 1 day) -> accept
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-16", period_end: "2026-08-31", pay_date: "2026-08-31", expected_employer_version: "${emp_v2}" }
              as: payroll_specialist
              captures: { run_2: $.data.id }
          assert:
            - "first trigger response error_id == ERR_PERIOD_OVERLAP"
            - "second trigger succeeds: PayrollRun.${run_2}.status == OPEN"

      - name: retroactive_effective_date_window_intersection
        grounds:
          - calculations.withholding_waterfall
          - entities.GarnishmentOrder.fields.effective_date
        distinguishing_aspect: |
          Semantics = interval-intersection proration on the GarnishmentOrder
          resource (different entity and different interval math from run
          adjacency): an order effective exactly on period_start intersects the
          full 15-day window (factor 1, award 10001), while the same order
          effective 2026-08-06 intersects only 10 days (award 6667) — the
          boundary between full and prorated sits at effective_date ==
          period_start.
        test_recipe:
          setup:
            - "Two CA employees on one employer, identical statements (DE 120000, pool 72874)"
            - "Order on employee 1 effective 2026-08-01 (full window); order on employee 2 effective 2026-08-06 (10/15)"
            - "Both FIXED 10001 CHILD_SUPPORT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
