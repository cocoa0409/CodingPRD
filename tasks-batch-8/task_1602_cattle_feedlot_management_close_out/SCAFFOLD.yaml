# =============================================================================
# Cattle Feedlot Management & Close-Out — benchmark seed tables (v1)
# Texas Panhandle feedyard: custom feeding, pen/ration/health operations,
# cost-of-gain accounting, grid close-out, hedging, death loss & insurance.
# =============================================================================

scenario: |
  Cattle Feedlot Management & Close-Out (Texas Panhandle feedyard): pen assignment & lot commingling rules, ration formulation & feed call by bunk score, health processing & treatment record with withdrawal, cost-of-gain accounting & yardage, close-out with carcass data & grid pricing, ownership (custom feeding) & billing, hedging & risk transfer per lot, death loss & insurance claim

domain_name: cattle-feedlot-closeout
api_prefix: /feedlot

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat           # peer resources under /feedlot, linked by FKs in bodies
  state_machine_shape: cyclic     # Lot OPEN<->MARKETED loop; InsuranceClaim appeal loop
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties   # claim decide vs claim pay must be different users
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: owner_name, type: string, source: input, description: "Cattle owner (custom-feeding customer) display name" }
      - { name: billing_email, type: string, source: input, description: "Billing contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE; toggled via PATCH" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of unpaid invoice remainders minus direct credits; never below 0" }

  - name: Pen
    parent: null
    common_fields: true
    fields:
      - { name: pen_code, type: string, source: input, description: "Yard-unique pen code (e.g. 'B-12'); uniqueness enforced" }
      - { name: capacity_head, type: integer, source: input, description: "Maximum head the pen can hold; > 0" }
      - { name: status, type: enum, source: system, description: "EMPTY | OCCUPIED | MAINTENANCE; initial EMPTY; EMPTY<->OCCUPIED automatic from occupancy, EMPTY<->MAINTENANCE via PATCH" }
      - { name: current_occupancy_head, type: integer, source: computed, default: 0, description: "Sum of head_count over this pen's ACTIVE PenAssignments" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; custom-feeding owner of the cattle" }
      - { name: lot_number, type: string, source: input, description: "Yard-unique lot identifier (e.g. 'L-100'); uniqueness enforced" }
      - { name: sex_class, type: enum, source: input, description: "STEER | HEIFER" }
      - { name: head_count_in, type: integer, source: input, description: "Head received at arrival; > 0" }
      - { name: in_weight_total_lbs, type: integer, source: input, description: "Total pay weight received, lbs; > 0" }
      - { name: purchase_cost_cents, type: integer, source: input, description: "Total cattle cost (in-cost) for the lot; >= 0" }
      - { name: arrival_date, type: string, source: input, description: "Arrival calendar date, YYYY-MM-DD" }
      - { name: commingle_allowed, type: boolean, source: input, default: false, description: "Whether this lot may share a pen with other lots" }
      - { name: status, type: enum, source: system, description: "OPEN | MARKETED | SHIPPED | CLOSED_OUT | SETTLED; initial OPEN" }
      - { name: head_count_current, type: integer, source: computed, description: "= head_count_in - total_deaths - head_shipped" }
      - { name: head_shipped, type: integer, source: system, default: 0, description: "Head shipped at ship time" }
      - { name: total_deaths, type: integer, source: computed, default: 0, description: "Sum of head_count over non-VOID DeathLoss records" }
      - { name: out_weight_total_lbs, type: integer, source: system, description: "Pay weight at ship; null until SHIPPED" }
      - { name: total_feed_cost_cents, type: integer, source: computed, default: 0, description: "Accumulated pro-rata feed cost from FeedCalls" }
      - { name: total_health_cost_cents, type: integer, source: computed, default: 0, description: "Accumulated treatment costs from HealthEvents" }
      - { name: total_death_loss_cents, type: integer, source: computed, default: 0, description: "Accumulated death loss value absorbed into the lot cost pool" }
      - { name: total_hedge_pnl_cents, type: integer, source: computed, default: 0, description: "Realized hedge P&L (may be negative)" }
      - { name: insurance_credit_pending_cents, type: integer, source: computed, default: 0, description: "PAID claim recoveries not yet consumed by an invoice" }
      - { name: withdrawal_clear_date, type: string, source: computed, description: "max(withdrawal_end_date) over the lot's HealthEvents; null when none" }
      - { name: provisional_cog_cents_per_cwt, type: number, source: computed, description: "Forward-looking cost-of-gain projection (see calculations.cost_of_gain); null when projected gain <= 0" }

  - name: Ration
    parent: null
    common_fields: true
    fields:
      - { name: ration_name, type: string, source: input, description: "Ration name (e.g. 'Starter-1')" }
      - { name: step_level, type: integer, source: input, description: "Step-up program level; >= 1; lots must progress one step at a time" }
      - { name: cost_per_ton_cents, type: integer, source: input, description: "As-fed cost per ton, cents; > 0" }

  - name: PenAssignment
    parent: null
    common_fields: true
    fields:
      - { name: pen_id, type: string, source: input, description: "FK -> Pen.id; pen occupied" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot occupying the pen" }
      - { name: head_count, type: integer, source: input, description: "Head placed in the pen under this assignment; > 0; decremented by death-loss allocation, restored on void" }
      - { name: start_date, type: string, source: input, description: "First occupied calendar date (inclusive), YYYY-MM-DD; >= lot.arrival_date" }
      - { name: end_date, type: string, source: system, description: "Last-day-exclusive end of occupation; null while ACTIVE; set on manual end or ship (an assignment reduced to 0 head by death allocation stays ACTIVE until then)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED; initial ACTIVE" }

  - name: RationAssignment
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot on the ration" }
      - { name: ration_id, type: string, source: input, description: "FK -> Ration.id; ration fed during the window" }
      - { name: start_date, type: string, source: input, description: "Window start (inclusive), YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Window end (exclusive), YYYY-MM-DD; must be > start_date; overwritten to ship_date if the lot ships first" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED; initial ACTIVE; CLOSED at ship or when the logical clock reaches end_date" }

  - name: FeedCall
    parent: null
    common_fields: false   # immutable event record: id + created_at only
    fields:
      - { name: pen_id, type: string, source: input, description: "FK -> Pen.id; pen being fed" }
      - { name: call_date, type: string, source: input, description: "Feeding date, YYYY-MM-DD; must be strictly after the pen's latest existing FeedCall date" }
      - { name: bunk_score, type: integer, source: input, description: "Previous-day bunk reading 0|1|2|3; required iff the pen has a prior FeedCall" }
      - { name: base_qty_lbs_per_head, type: number, source: input, description: "First-call baseline lbs/head; required iff the pen has NO prior FeedCall, forbidden otherwise" }
      - { name: ration_id, type: string, source: system, description: "FK -> Ration.id; derived: the common ACTIVE ration of the lots in the pen" }
      - { name: qty_lbs_per_head, type: number, source: computed, description: "Computed per-head quantity per calculations.feed_call_quantity" }
      - { name: total_qty_lbs, type: integer, source: computed, description: "round_half_up(qty_lbs_per_head x pen occupancy)" }
      - { name: total_cost_cents, type: integer, source: computed, description: "round_half_up(total_qty_lbs / 2000 x ration.cost_per_ton_cents)" }

  - name: HealthEvent
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; treated lot" }
      - { name: treatment_date, type: string, source: input, description: "Treatment date, YYYY-MM-DD; within [lot.arrival_date, current date]" }
      - { name: drug_product, type: string, source: input, description: "Drug product name" }
      - { name: withdrawal_days, type: integer, source: input, description: "Label withdrawal period in days; >= 0" }
      - { name: head_treated, type: integer, source: input, description: "Head treated; 1..head_count_current" }
      - { name: treatment_cost_cents, type: integer, source: input, description: "Total treatment charge passed through to the lot; >= 0" }
      - { name: withdrawal_end_date, type: string, source: computed, description: "= treatment_date + withdrawal_days days; cattle may ship on/after this date" }
      - { name: status, type: enum, source: system, description: "WITHDRAWAL_ACTIVE | CLEARED; initial WITHDRAWAL_ACTIVE; CLEARED by clock advance once current date >= withdrawal_end_date" }

  - name: DeathLoss
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot suffering the loss" }
      - { name: loss_date, type: string, source: input, description: "Date of death, YYYY-MM-DD; within [lot.arrival_date, current date]" }
      - { name: head_count, type: integer, source: input, description: "Dead head; 1..head_count_current" }
      - { name: cause, type: string, source: input, description: "Cause code (free text, e.g. 'RESPIRATORY')" }
      - { name: insured, type: boolean, source: input, description: "Whether the loss is covered by mortality insurance" }
      - { name: loss_value_cents, type: integer, source: computed, description: "Per calculations.death_loss_value at loss_date" }
      - { name: allocations, type: array, source: system, description: "List of {assignment_id, head_count} recording which ACTIVE PenAssignments absorbed the dead head (oldest-created first, waterfall)" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED; initial RECORDED" }

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - { name: death_loss_id, type: string, source: input, description: "FK -> DeathLoss.id; the insured loss; at most one claim per loss" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed; > 0 and <= death loss loss_value_cents" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Approved amount; set at decide(APPROVE), defaults to claimed_amount_cents; null until decided" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | APPROVED | DENIED | PAID; initial UNDER_REVIEW" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals filed; max 1" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the adjuster who most recently decided the claim; segregation-of-duties anchor" }

  - name: HedgePosition
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; hedged lot" }
      - { name: contract_month, type: string, source: input, description: "Futures contract month 'YYYY-MM'; position EXPIREDs when the clock reaches the first day of that month" }
      - { name: side, type: enum, source: input, default: "SHORT", description: "SHORT | LONG; feedlot hedge is normally SHORT" }
      - { name: quantity_contracts, type: integer, source: input, description: "Contracts entered; >= 1" }
      - { name: entry_price_cents_per_cwt, type: integer, source: input, description: "Entry futures price, cents per cwt; > 0" }
      - { name: exit_price_cents_per_cwt, type: integer, source: system, description: "Exit price at offset; null while OPEN" }
      - { name: realized_pnl_cents, type: integer, source: computed, description: "Per calculations.hedge_pnl; null while OPEN" }
      - { name: status, type: enum, source: system, description: "OPEN | OFFSET | EXPIRED; initial OPEN" }

  - name: CloseOut
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot being closed out" }
      - { name: pricing_basis, type: enum, source: input, description: "PER_CARCASS | LOT_AVERAGE; grid formula variant pinned at creation" }
      - { name: grid_base_price_cents_per_cwt, type: integer, source: input, description: "Grid base price, cents per cwt; > 0" }
      - { name: carcass_records, type: array, source: system, description: "Array of {hot_carcass_weight_lbs, quality_grade (PRIME|CHOICE|SELECT|STANDARD), yield_grade (1|2|3|4|5)} supplied at confirm; null until then" }
      - { name: total_grid_value_cents, type: number, source: computed, description: "Carcass grid proceeds per calculations.grid_value; null until CONFIRMED" }
      - { name: total_cost_cents, type: integer, source: computed, description: "Full lot cost pool at confirm; null until CONFIRMED" }
      - { name: final_cog_cents_per_cwt, type: number, source: computed, description: "Final cost of gain per calculations.cost_of_gain(final); null until CONFIRMED" }
      - { name: hedge_pnl_cents, type: integer, source: computed, description: "Snapshot of lot.total_hedge_pnl_cents at confirm; null until CONFIRMED" }
      - { name: net_result_cents, type: number, source: computed, description: "= total_grid_value_cents + hedge_pnl_cents - total_cost_cents; null until CONFIRMED" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | SUPERSEDED; initial DRAFT; a prior CONFIRMED close-out for the lot becomes SUPERSEDED when a newer one confirms" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; billed lot" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; billed owner (copied from lot)" }
      - { name: feed_cents, type: integer, source: computed, description: "Feed charges line" }
      - { name: yardage_cents, type: integer, source: computed, description: "Yardage line = yardage_head_days x 45" }
      - { name: yardage_head_days, type: integer, source: computed, description: "Head-days per calculations.yardage_head_days" }
      - { name: health_cents, type: integer, source: computed, description: "Health pass-through line" }
      - { name: death_loss_cents, type: integer, source: computed, description: "Death-loss charge line" }
      - { name: insurance_credit_cents, type: integer, source: computed, description: "PAID claim recoveries netted into this invoice" }
      - { name: total_cents, type: integer, source: computed, description: "= feed + yardage + health + death_loss - insurance_credit (pinned order, see calculations.invoice_total)" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Cumulative payments applied" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | VOID; initial OPEN; PAID when amount_paid_cents == total_cents" }
      - { name: void_reason, type: string, source: input, description: "Optional reason recorded on void" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Owner
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /feedlot/owners/{ownerId} with status=SUSPENDED"
        actor: FeedyardManager
        preconditions:
          - "Owner currently ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments Owner.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /feedlot/owners/{ownerId} with status=ACTIVE"
        actor: FeedyardManager
        preconditions:
          - "Owner currently SUSPENDED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments Owner.version by 1"

  - entity: Pen
    initial_state: EMPTY
    terminal_states: []
    transitions:
      - from: EMPTY
        to: OCCUPIED
        trigger: "system (first ACTIVE PenAssignment raises current_occupancy_head above 0)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Pen.version by 1"
      - from: OCCUPIED
        to: EMPTY
        trigger: "system (current_occupancy_head falls to 0 via assignment end, ship, death-loss allocation, or death-loss void compensation)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Pen.version by 1"
      - from: EMPTY
        to: MAINTENANCE
        trigger: "PATCH /feedlot/pens/{penId} with status=MAINTENANCE"
        actor: FeedyardManager
        preconditions:
          - "Pen currently EMPTY; an OCCUPIED pen cannot enter maintenance (ERR_PEN_OCCUPIED)"
        side_effects:
          - "increments Pen.version by 1"
      - from: MAINTENANCE
        to: EMPTY
        trigger: "PATCH /feedlot/pens/{penId} with status=EMPTY"
        actor: FeedyardManager
        preconditions:
          - "Pen currently MAINTENANCE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments Pen.version by 1"

  - entity: Lot
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: MARKETED
        trigger: "POST /feedlot/lots/{lotId}/market"
        actor: FeedyardManager
        preconditions:
          - "Lot is OPEN (ERR_LOT_NOT_OPEN)"
          - "head_count_current >= 1 (ERR_LOT_HAS_NO_HEAD)"
        side_effects:
          - "increments Lot.version by 1"
      - from: MARKETED
        to: OPEN
        trigger: "POST /feedlot/lots/{lotId}/fail-sale (sale fell through)"
        actor: FeedyardManager
        preconditions:
          - "Lot is MARKETED (ERR_LOT_NOT_MARKETED)"
        side_effects:
          - "increments Lot.version by 1; hedges, assignments, and cost accumulators are untouched (cycle back to OPEN)"
      - from: MARKETED
        to: SHIPPED
        trigger: "POST /feedlot/lots/{lotId}/ship"
        actor: FeedyardManager
        preconditions:
          - "Lot is MARKETED (ERR_LOT_NOT_MARKETED)"
          - "lot.arrival_date <= ship_date <= current logical date (ERR_INVALID_REQUEST)"
          - "withdrawal cleared: every HealthEvent of the lot has withdrawal_end_date <= ship_date (ERR_WITHDRAWAL_NOT_CLEARED)"
        side_effects:
          - "head_shipped := head_count_current; out_weight_total_lbs := input"
          - "All ACTIVE PenAssignments of the lot -> ENDED with end_date = ship_date (link 1)"
          - "Each assignment ending reduces its Pen.current_occupancy_head; a pen reaching 0 transitions OCCUPIED -> EMPTY (link 2)"
          - "All ACTIVE RationAssignments of the lot -> CLOSED with end_date = ship_date"
          - "Recompute provisional_cog_cents_per_cwt; increments Lot.version by 1"
      - from: SHIPPED
        to: CLOSED_OUT
        trigger: "system (a CloseOut for the lot confirms)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Lot.version by 1"
      - from: CLOSED_OUT
        to: SETTLED
        trigger: "system (the lot's OPEN Invoice becomes PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Lot.version by 1"

  - entity: PenAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /feedlot/assignments/{assignmentId}/end"
        actor: FeedyardManager
        preconditions:
          - "Assignment is ACTIVE (ERR_ASSIGNMENT_ALREADY_ENDED)"
          - "end_date >= start_date (ERR_INVALID_DATE_RANGE); end_date == start_date allowed (zero-day occupation)"
        side_effects:
          - "end_date set; Pen.current_occupancy_head recomputed (pen -> EMPTY if 0); increments PenAssignment.version by 1"
      - from: ACTIVE
        to: ENDED
        trigger: "system (lot ships; end_date = ship_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Pen.current_occupancy_head recomputed (pen -> EMPTY if 0)"

  - entity: RationAssignment
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "system (lot ships: end_date := ship_date; or clock advance reaches end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "increments RationAssignment.version by 1"

  - entity: HealthEvent
    initial_state: WITHDRAWAL_ACTIVE
    terminal_states: [CLEARED]
    transitions:
      - from: WITHDRAWAL_ACTIVE
        to: CLEARED
        trigger: "system (POST /_clock/set_current_utc advances the logical clock to a date >= withdrawal_end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "increments HealthEvent.version by 1"

  - entity: DeathLoss
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /feedlot/death-losses/{deathLossId}/void"
        actor: CattleHealthTech
        preconditions:
          - "Loss is RECORDED (ERR_INVALID_STATE_TRANSITION)"
          - "No InsuranceClaim references this loss (ERR_VOID_BLOCKED_BY_CLAIMS)"
        side_effects:
          - "Compensation: restore each allocations[] entry's head_count to its PenAssignment; Pen.current_occupancy_head recomputed (EMPTY -> OCCUPIED when a pen regains head)"
          - "Lot.head_count_current += head_count; Lot.total_deaths -= head_count; Lot.total_death_loss_cents -= loss_value_cents; provisional COG recomputed"
          - "increments DeathLoss.version by 1 and Lot.version by 1"

  - entity: InsuranceClaim
    initial_state: UNDER_REVIEW
    terminal_states: [PAID]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /feedlot/insurance-claims/{claimId}/decide with decision=APPROVE"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is UNDER_REVIEW (ERR_CLAIM_INVALID_STATE)"
          - "approved_amount_cents, if supplied, in 1..claimed_amount_cents (ERR_INVALID_REQUEST); defaults to claimed_amount_cents"
        side_effects:
          - "approved_amount_cents set; decided_by_user_id := X-User-ID; increments InsuranceClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /feedlot/insurance-claims/{claimId}/decide with decision=DENY"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is UNDER_REVIEW (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "decided_by_user_id := X-User-ID; increments InsuranceClaim.version by 1"
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /feedlot/insurance-claims/{claimId}/appeal"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is DENIED (ERR_CLAIM_INVALID_STATE)"
          - "appeal_count < 1 (ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "appeal_count += 1; claim returns to UNDER_REVIEW (appeal cycle)"
      - from: APPROVED
        to: PAID
        trigger: "POST /feedlot/insurance-claims/{claimId}/pay"
        actor: "ClaimsTreasurer or ClaimsAdjuster"
        preconditions:
          - "Segregation of duties: X-User-ID != decided_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "Claim is APPROVED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "If the lot has an OPEN Invoice at pay time: Owner.outstanding_balance_cents -= min(approved_amount_cents, balance) directly"
          - "Otherwise: Lot.insurance_credit_pending_cents += approved_amount_cents (consumed at the next invoice generation)"

  - entity: HedgePosition
    initial_state: OPEN
    terminal_states: [OFFSET, EXPIRED]
    transitions:
      - from: OPEN
        to: OFFSET
        trigger: "POST /feedlot/hedges/{hedgeId}/offset"
        actor: RiskManager
        preconditions:
          - "Hedge is OPEN (ERR_HEDGE_NOT_OPEN)"
          - "offset_date <= current logical date (ERR_INVALID_REQUEST)"
        side_effects:
          - "exit_price set; realized_pnl_cents computed per calculations.hedge_pnl"
          - "Lot.total_hedge_pnl_cents += realized_pnl_cents; increments Lot.version by 1"
      - from: OPEN
        to: EXPIRED
        trigger: "system (clock advance reaches contract_month-01)"
        actor: system
        preconditions: []
        side_effects:
          - "Settles at entry price: exit_price := entry_price, realized_pnl_cents := 0; Lot P&L unchanged"

  - entity: CloseOut
    initial_state: DRAFT
    terminal_states: [CONFIRMED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /feedlot/close-outs/{closeOutId}/confirm"
        actor: RiskManager
        preconditions:
          - "CloseOut is DRAFT (ERR_CLOSE_OUT_NOT_DRAFT)"
          - "Lot is SHIPPED or CLOSED_OUT (ERR_LOT_NOT_CLOSABLE)"
          - "Every HedgePosition of the lot is OFFSET or EXPIRED (ERR_ACTIVE_HEDGES_EXIST)"
          - "len(carcass_records) == lot.head_shipped (ERR_CARCASS_COUNT_MISMATCH)"
        side_effects:
          - "carcass_records stored; total_grid_value_cents per calculations.grid_value variant pinned by pricing_basis"
          - "total_cost_cents, final_cog_cents_per_cwt (final variant), hedge_pnl_cents, net_result_cents computed"
          - "Cascade link 1: any prior CONFIRMED CloseOut for the lot -> SUPERSEDED, and its OPEN Invoice -> VOID (compensating Owner balance reversal)"
          - "Cascade link 2: Lot -> CLOSED_OUT"
          - "Cascade link 3: a new Invoice (OPEN) is generated per calculations.invoice_total, consuming Lot.insurance_credit_pending_cents"
          - "Cascade link 4: Owner.outstanding_balance_cents += invoice.total_cents"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /feedlot/invoices/{invoiceId}/payments (cumulative)"
        actor: BillingClerk
        preconditions:
          - "Invoice is OPEN (ERR_INVOICE_NOT_OPEN)"
          - "amount_cents > 0 (ERR_INVALID_REQUEST)"
          - "amount_paid_cents + amount_cents <= total_cents (ERR_OVERPAYMENT); exact equality allowed and pays the invoice"
        side_effects:
          - "amount_paid_cents += amount_cents; Owner.outstanding_balance_cents -= amount_cents"
          - "When amount_paid_cents == total_cents: Invoice -> PAID and the billed Lot -> SETTLED (bubble-up)"
      - from: OPEN
        to: VOID
        trigger: "POST /feedlot/invoices/{invoiceId}/void, or system (its CloseOut is superseded)"
        actor: "BillingClerk or system"
        preconditions:
          - "Invoice is OPEN (ERR_INVOICE_NOT_OPEN); a PAID invoice can never be voided"
        side_effects:
          - "Compensation: Owner.outstanding_balance_cents -= (total_cents - amount_paid_cents)"
          - "Lot remains CLOSED_OUT; the lot does not revert"

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: closeout-create-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /feedlot/close-outs"
    occ_field: expected_lot_version
    description: |
      Creating a CloseOut against a Lot whose version has advanced since the
      client last observed it is rejected. Creating a new CloseOut legitimately
      supersedes the lot's prior CONFIRMED close-out, so a writer holding a
      stale Lot version (e.g., observed before another writer's death-loss or
      hedge mutation) must be rejected with a stale-version error.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: hedge-create-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /feedlot/hedges"
    occ_field: expected_lot_version
    description: |
      Creating a HedgePosition against a Lot whose version has advanced since
      the client last observed it is rejected. Hedge sizing depends on
      head_count_current, which death losses change; a writer whose view of the
      Lot predates the latest mutation must be rejected with a stale-version
      error rather than hedge against an outdated head count.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: feed_call_quantity
    trigger: "POST /feedlot/feed-calls"
    algorithm: threshold
    formula: |
      prev_qty = qty_lbs_per_head of the pen's latest prior FeedCall
                 (order by call_date DESC, tie-break created_at DESC).
      First call for the pen: base_qty_lbs_per_head input is REQUIRED and used
      as qty_raw (no bunk adjustment). Later calls: bunk_score input is
      REQUIRED and qty_raw = prev_qty + BUNK_DELTA[bunk_score].
      qty_lbs_per_head = round_half_up(min(max(qty_raw, MIN_QTY), MAX_QTY), 0.1)
      total_qty_lbs   = round_half_up(qty_lbs_per_head x pen.current_occupancy_head, 1)
      total_cost_cents = round_half_up(total_qty_lbs / 2000 x ration.cost_per_ton_cents, 1)
      ration_id is derived as the common ACTIVE RationAssignment's ration of the
      lot(s) in the pen (commingled lots are required to share one ration).
    input_set: "FeedCalls of the same pen (any date); the pen's ACTIVE PenAssignments"
    constants:
      BUNK_DELTA_0: 0.75
      BUNK_DELTA_1: 0.25
      BUNK_DELTA_2: 0.0
      BUNK_DELTA_3: -0.75
      MIN_QTY: 8.0
      MAX_QTY: 30.0
    precision: "per-head 0.1 lb round_half_up; totals whole units round_half_up"

  - name: feed_cost_allocation
    trigger: "POST /feedlot/feed-calls (after feed_call_quantity computes total_cost_cents)"
    algorithm: waterfall_allocation
    formula: |
      Distribute the FeedCall's total_cost_cents across the pen's ACTIVE
      PenAssignments proportional to assignment.head_count, processing
      assignments in created_at ASC order (tie-break never needed: created_at
      is unique at millisecond precision).
      share_i = round_half_up(total_cost_cents x head_i / total_head, 1) for
      every assignment EXCEPT the last in order; the last assignment receives
      the residual total_cost_cents - sum(prior shares).
      Pinned rounding order: round each non-final share to whole cents first,
      then assign the residual — rounding every share independently can drift
      from the total and is forbidden.
      Each assignment's lot.total_feed_cost_cents += its share.
    input_set: "ACTIVE PenAssignments of the pen at call time"
    precision: "whole cents, round_half_up, residual to latest-created assignment"

  - name: yardage_head_days
    trigger: "invoice generation (final) and provisional cost-of-gain (to-date variant)"
    algorithm: chronological
    formula: |
      head_days for a lot over [from_date, to_date):
        For each PenAssignment of the lot (processed by start_date ASC,
        created_at ASC tie-break), collect boundary dates:
        start_date, each non-VOID DeathLoss loss_date allocated to it,
        min(end_date, to_date) (end_date null -> to_date).
        Segment [d_i, d_{i+1}) contributes head_i x days(d_i, d_{i+1}) where
        head_i is the assignment head_count after applying all death
        allocations with loss_date <= d_i (a death reduces the count for
        dates >= loss_date, not on earlier dates).
      yardage_cents = head_days x YARDAGE_RATE.
      Final variant: [lot.arrival_date, ship_date). Provisional variant:
      [lot.arrival_date, current logical date).
    input_set: "All PenAssignments of the lot; all non-VOID DeathLoss of the lot"
    constants:
      YARDAGE_RATE: 45    # cents per head-day
    precision: "whole cents"

  - name: death_loss_value
    trigger: "POST /feedlot/death-losses"
    algorithm: aggregation
    formula: |
      in_cost_per_head = round_half_up(lot.purchase_cost_cents / lot.head_count_in, 1)
      accrued_basis = lot.total_feed_cost_cents
                    + yardage accrued over [arrival_date, loss_date)   # calc yardage_head_days provisional-to-loss-date
                    + lot.total_health_cost_cents
      accrued_per_head = round_half_up(accrued_basis / head_count_current_before_this_loss, 1)
      loss_value_cents = head_count x (in_cost_per_head + accrued_per_head)
      The death charge depends only on costs accrued BEFORE the loss date;
      later costs never reprice an earlier loss (chronological pinning).
    input_set: "The lot's cost accumulators as of loss_date; head_count_current before applying this loss"
    precision: "whole cents, round_half_up"

  - name: cost_of_gain
    trigger: "provisional: on every cost/head-affecting mutation and on clock advance (stored on Lot.provisional_cog_cents_per_cwt); final: at CloseOut confirm (stored on CloseOut.final_cog_cents_per_cwt)"
    algorithm: forward_looking
    formula: |
      shared: total_cost_cents = lot.purchase_cost_cents + lot.total_feed_cost_cents
              + yardage_cents (per yardage_head_days variant below)
              + lot.total_health_cost_cents + lot.total_death_loss_cents
      cog = round_half_up(total_cost_cents / gain_cwt, 0.01)
    input_set: "Lot cost accumulators"
    constants:
      ADG_LBS_PER_HEAD_DAY: 3.4
    precision: "0.01 cents per cwt, round_half_up"
    variants:
      - name: provisional
        when: "lot on feed (stored on Lot.provisional_cog_cents_per_cwt)"
        difference: "yardage over [arrival_date, current date); gain_lbs = head_count_current x days_on_feed x ADG_LBS_PER_HEAD_DAY where days_on_feed = current date - arrival_date in whole days; null when gain_lbs <= 0"
      - name: final
        when: "CloseOut confirm"
        difference: "yardage over [arrival_date, ship_date); gain_cwt = (out_weight_total_lbs - in_weight_total_lbs x head_shipped / head_count_in) / 100 (actual pay weights, dead-head in-weight excluded)"

  - name: grid_value
    trigger: "POST /feedlot/close-outs/{closeOutId}/confirm"
    algorithm: tiered_pricing
    formula: |
      price_adjustment(quality_grade, yield_grade) = QP[quality_grade] + YD[yield_grade]
      total_grid_value_cents per the pricing_basis variant pinned on the CloseOut.
    input_set: "The CloseOut's carcass_records (all of them; count == lot.head_shipped)"
    constants:
      QP_PRIME: 1200
      QP_CHOICE: 0
      QP_SELECT: -1800
      QP_STANDARD: -3500
      YD_1: 400
      YD_2: 200
      YD_3: 0
      YD_4: -2000
      YD_5: -3500
    precision: "cents (0.01), round_half_up; variant-specific rounding order pinned below"
    variants:
      - name: PER_CARCASS
        when: "CloseOut.pricing_basis == PER_CARCASS"
        difference: "per record: value = round_half_up(hot_carcass_weight_lbs / 100 x (grid_base + QP + YD), 0.01); total = sum of the per-record rounded values. Pinned order: round each carcass line to cents FIRST, then sum."
      - name: LOT_AVERAGE
        when: "CloseOut.pricing_basis == LOT_AVERAGE"
        difference: "avg_qp = round_half_up(sum(QP x hcw) / sum(hcw), 0.01); avg_yd likewise; avg_price = grid_base + avg_qp + avg_yd; total = round_half_up(sum(hcw) / 100 x avg_price, 0.01). Single rounding at the end over lot-average adjustments."

  - name: withdrawal_clear_date
    trigger: "HealthEvent create; ship precondition evaluation"
    algorithm: aggregation
    formula: |
      per event: withdrawal_end_date = treatment_date + withdrawal_days (calendar days)
      lot.withdrawal_clear_date = max(withdrawal_end_date) over all HealthEvents
      of the lot; null when the lot has no HealthEvents.
      Ship gate: ship allowed iff ship_date >= withdrawal_clear_date
      (half-open hold: shipping ON the clear date is allowed).
    input_set: "All HealthEvents of the lot (any status)"
    precision: "whole days"

  - name: hedge_coverage
    trigger: "POST /feedlot/hedges"
    algorithm: threshold
    formula: |
      marketable_cwt = round_half_up(
          lot.head_count_current x lot.in_weight_total_lbs x 3 / (lot.head_count_in x 200), 1)
      # i.e. current head x average in-weight x OUT_WEIGHT_FACTOR, expressed in cwt
      open_cwt_after = CONTRACT_CWT x (sum of quantity_contracts over the lot's
                       OPEN HedgePositions + the new position's quantity_contracts)
      require open_cwt_after <= marketable_cwt   # equality allowed; above -> ERR_HEDGE_OVER_COVERED
    input_set: "The lot's OPEN HedgePositions plus the candidate position"
    constants:
      CONTRACT_CWT: 400        # 40,000 lb live-cattle contract
      OUT_WEIGHT_FACTOR: 1.5   # projected out-weight = average in-weight x 1.5
    precision: "whole cwt, round_half_up"

  - name: invoice_total
    trigger: "CloseOut confirm (invoice generation)"
    algorithm: aggregation
    formula: |
      Pinned evaluation order (breaks the apparent feed<->death<->recovery loop):
        (1) feed_cents   = lot.total_feed_cost_cents at confirm
        (2) yardage      = yardage_head_days final variant [arrival_date, ship_date)
        (3) health_cents = lot.total_health_cost_cents at confirm
        (4) death_loss_cents = lot.total_death_loss_cents
            (each loss was priced at its own loss_date from (1)-(3) accruals
             through that date only — never from the invoice total)
        (5) insurance_credit_cents = min(lot.insurance_credit_pending_cents,
                                         (1)+(2)+(3)+(4))
            then lot.insurance_credit_pending_cents -= insurance_credit_cents
        total_cents = (1) + (2) + (3) + (4) - (5)
      Recoveries are only netted here if the claim reached PAID before confirm;
      claims paid afterwards credit Owner.outstanding_balance_cents directly.
    input_set: "One SHIPPED/CLOSED_OUT lot and its PAID-uninvoiced claims"
    precision: "whole cents"

  - name: hedge_pnl
    trigger: "HedgePosition offset or expiry"
    algorithm: aggregation
    formula: |
      SHORT: realized_pnl_cents = (entry_price - exit_price) x CONTRACT_CWT x quantity_contracts
      LONG:  realized_pnl_cents = (exit_price - entry_price) x CONTRACT_CWT x quantity_contracts
      EXPIRED positions settle at entry price: realized_pnl_cents = 0.
      Lot.total_hedge_pnl_cents accumulates each offset position's pnl.
    input_set: "The single HedgePosition being settled"
    constants:
      CONTRACT_CWT: 400
    precision: "whole cents"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role named by X-User-Role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Request body shape: required fields present, enum members valid, integer/number ranges respected (head counts > 0, quantities > 0, dates well-formed YYYY-MM-DD), and date-valued inputs not in the future relative to the logical clock where a rule pins them (ship_date, loss_date, treatment_date, offset_date)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 4
    category: existence
    check: "Resource ids in the path (left-to-right) and FK ids in the body must exist"
    error_id: "ERR_OWNER_NOT_FOUND | ERR_PEN_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_RATION_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_DEATH_LOSS_NOT_FOUND | ERR_INSURANCE_CLAIM_NOT_FOUND | ERR_HEDGE_NOT_FOUND | ERR_CLOSE_OUT_NOT_FOUND | ERR_INVOICE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 5
    category: state
    check: "OCC: expected_lot_version in the body must equal the Lot's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /feedlot/hedges, POST /feedlot/close-outs"

  - priority: 6
    category: auth
    check: "Segregation of duties: the paying user's X-User-ID must differ from the claim's decided_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /feedlot/insurance-claims/{claimId}/pay"

  - priority: 7
    category: state
    check: "Target and guarding entity states: owner ACTIVE for lot create (ERR_OWNER_SUSPENDED); pen not MAINTENANCE for assignment create (ERR_PEN_IN_MAINTENANCE); pen EMPTY for maintenance start (ERR_PEN_OCCUPIED); pen OCCUPIED for a feed call (ERR_PEN_NOT_OCCUPIED); lot OPEN for assignment/ration-assignment/health-event/death-loss/hedge creation (ERR_LOT_NOT_OPEN); lot MARKETED for ship and fail-sale (ERR_LOT_NOT_MARKETED); lot head_count_current >= 1 for market (ERR_LOT_HAS_NO_HEAD); lot SHIPPED|CLOSED_OUT for close-out create (ERR_LOT_NOT_CLOSABLE); close-out DRAFT for confirm (ERR_CLOSE_OUT_NOT_DRAFT); all lot hedges OFFSET|EXPIRED for confirm (ERR_ACTIVE_HEDGES_EXIST); claim in the required from-state for decide/appeal/pay (ERR_CLAIM_INVALID_STATE); hedge OPEN for offset (ERR_HEDGE_NOT_OPEN); assignment ACTIVE for end (ERR_ASSIGNMENT_ALREADY_ENDED); invoice OPEN for payments/void (ERR_INVOICE_NOT_OPEN); death loss RECORDED for void/claim create; PATCH bodies naming the current state (ERR_INVALID_STATE_TRANSITION)"
    error_id: "ERR_OWNER_SUSPENDED | ERR_PEN_IN_MAINTENANCE | ERR_PEN_OCCUPIED | ERR_PEN_NOT_OCCUPIED | ERR_LOT_NOT_OPEN | ERR_LOT_NOT_MARKETED | ERR_LOT_HAS_NO_HEAD | ERR_LOT_NOT_CLOSABLE | ERR_CLOSE_OUT_NOT_DRAFT | ERR_ACTIVE_HEDGES_EXIST | ERR_CLAIM_INVALID_STATE | ERR_HEDGE_NOT_OPEN | ERR_ASSIGNMENT_ALREADY_ENDED | ERR_INVOICE_NOT_OPEN | ERR_INVALID_STATE_TRANSITION"
    http_status: 409
    applies_to: "state transition and guarded creation endpoints"

  - priority: 8
    category: business_safety
    check: "Withdrawal cleared: every HealthEvent of the lot has withdrawal_end_date <= ship_date"
    error_id: ERR_WITHDRAWAL_NOT_CLEARED
    http_status: 409
    applies_to: "POST /feedlot/lots/{lotId}/ship"

  - priority: 9
    category: business_referential
    check: "Commingle compatibility for a pen-sharing assignment: same sex_class, commingle_allowed == true on BOTH lots, and identical ACTIVE ration_id across the lots sharing the pen (ERR_COMMINGLE_RULE_VIOLATION); step-up rule: the new ration's step_level must equal the lot's latest RationAssignment step_level + 1, and the first assignment must be step_level 1 (ERR_STEP_UP_VIOLATION); death-loss void must not be referenced by any InsuranceClaim (ERR_VOID_BLOCKED_BY_CLAIMS)"
    error_id: "ERR_COMMINGLE_RULE_VIOLATION | ERR_STEP_UP_VIOLATION | ERR_VOID_BLOCKED_BY_CLAIMS"
    http_status: 409
    applies_to: "POST /feedlot/assignments, POST /feedlot/ration-assignments, POST /feedlot/death-losses/{deathLossId}/void"

  - priority: 10
    category: business_temporal
    check: "Interval rules: summed head over overlapping compatible assignments <= pen.capacity_head at every day (ERR_PEN_CAPACITY_EXCEEDED); a lot's ration windows [start_date, end_date) must be pairwise disjoint — zero-gap adjacency allowed (ERR_RATION_WINDOW_OVERLAP); date ordering (end > start for ration windows; end >= start for pen assignments; start >= lot.arrival_date) (ERR_INVALID_DATE_RANGE); a new FeedCall's call_date must be strictly after the pen's latest FeedCall date (ERR_FEED_CALL_DATE_NOT_AFTER_PREVIOUS)"
    error_id: "ERR_PEN_CAPACITY_EXCEEDED | ERR_RATION_WINDOW_OVERLAP | ERR_INVALID_DATE_RANGE | ERR_FEED_CALL_DATE_NOT_AFTER_PREVIOUS"
    http_status: "409 for ERR_PEN_CAPACITY_EXCEEDED, ERR_RATION_WINDOW_OVERLAP, ERR_FEED_CALL_DATE_NOT_AFTER_PREVIOUS; 400 for ERR_INVALID_DATE_RANGE"
    applies_to: "POST /feedlot/assignments, POST /feedlot/ration-assignments, POST /feedlot/assignments/{assignmentId}/end, POST /feedlot/feed-calls"

  - priority: 11
    category: business_constraint
    check: "Aggregate/uniqueness constraints: lot's total ACTIVE assigned head + new head <= head_count_current (ERR_OVER_ASSIGNMENT); pen_code unique (ERR_DUPLICATE_PEN_CODE); lot_number unique (ERR_DUPLICATE_LOT_NUMBER); at most one InsuranceClaim per DeathLoss (ERR_CLAIM_ALREADY_EXISTS); claim only on an insured loss (ERR_DEATH_LOSS_NOT_INSURED); carcass_records count == lot.head_shipped at confirm (ERR_CARCASS_COUNT_MISMATCH); appeal_count < 1 (ERR_APPEAL_LIMIT_REACHED)"
    error_id: "ERR_OVER_ASSIGNMENT | ERR_DUPLICATE_PEN_CODE | ERR_DUPLICATE_LOT_NUMBER | ERR_CLAIM_ALREADY_EXISTS | ERR_DEATH_LOSS_NOT_INSURED | ERR_CARCASS_COUNT_MISMATCH | ERR_APPEAL_LIMIT_REACHED"
    http_status: 409
    applies_to: "creation and confirm endpoints"

  - priority: 12
    category: business_fiscal
    check: "Money limits: hedge coverage open_cwt_after <= marketable_cwt (ERR_HEDGE_OVER_COVERED); claimed_amount_cents <= loss_value_cents (ERR_CLAIM_EXCEEDS_LOSS_VALUE); cumulative payments must not exceed invoice total (ERR_OVERPAYMENT)"
    error_id: "ERR_HEDGE_OVER_COVERED | ERR_CLAIM_EXCEEDS_LOSS_VALUE | ERR_OVERPAYMENT"
    http_status: 422
    applies_to: "POST /feedlot/hedges, POST /feedlot/insurance-claims, POST /feedlot/invoices/{invoiceId}/payments"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Owner ---
  - method: POST
    path: "/feedlot/owners"
    description: "Create a cattle owner (custom-feeding customer)"
    roles: [FeedyardManager]
    code: 201
    input: [owner_name, billing_email]
    output: Owner
    side_effects: ["status=ACTIVE, outstanding_balance_cents=0"]
  - method: GET
    path: "/feedlot/owners"
    description: "List owners (created_at ASC)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Owner[]"
    side_effects: []
  - method: GET
    path: "/feedlot/owners/{ownerId}"
    description: "Get one owner"
    roles: [Any]
    code: 200
    input: []
    output: Owner
    side_effects: []
  - method: PATCH
    path: "/feedlot/owners/{ownerId}"
    description: "Suspend or reactivate an owner (status SUSPENDED|ACTIVE)"
    roles: [FeedyardManager]
    code: 200
    input: [status]
    output: Owner
    side_effects: ["Owner state transition per state_machines.Owner; increments Owner.version by 1"]
  - method: GET
    path: "/feedlot/owners/{id}/lots"
    description: "List lots owned by an owner (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "Lot[]"
    side_effects: []
  - method: GET
    path: "/feedlot/owners/{id}/invoices"
    description: "List invoices billed to an owner (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "Invoice[]"
    side_effects: []

  # --- Pen ---
  - method: POST
    path: "/feedlot/pens"
    description: "Create a pen"
    roles: [FeedyardManager]
    code: 201
    input: [pen_code, capacity_head]
    output: Pen
    side_effects: ["status=EMPTY, current_occupancy_head=0"]
  - method: GET
    path: "/feedlot/pens"
    description: "List pens (created_at ASC)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Pen[]"
    side_effects: []
  - method: GET
    path: "/feedlot/pens/{penId}"
    description: "Get one pen"
    roles: [Any]
    code: 200
    input: []
    output: Pen
    side_effects: []
  - method: PATCH
    path: "/feedlot/pens/{penId}"
    description: "Enter/exit maintenance (status MAINTENANCE|EMPTY)"
    roles: [FeedyardManager]
    code: 200
    input: [status]
    output: Pen
    side_effects: ["Pen state transition per state_machines.Pen; increments Pen.version by 1"]
  - method: GET
    path: "/feedlot/pens/{id}/assignments"
    description: "List pen assignments for a pen (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "PenAssignment[]"
    side_effects: []
  - method: GET
    path: "/feedlot/pens/{id}/feed-calls"
    description: "List feed calls for a pen (call_date ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "FeedCall[]"
    side_effects: []

  # --- Lot ---
  - method: POST
    path: "/feedlot/lots"
    description: "Receive a lot of cattle"
    roles: [FeedyardManager]
    code: 201
    input: [owner_id, lot_number, sex_class, head_count_in, in_weight_total_lbs, purchase_cost_cents, arrival_date, "commingle_allowed?"]
    output: Lot
    side_effects: ["status=OPEN; head_count_current=head_count_in; all cost accumulators 0; provisional COG null until first clock day passes"]
  - method: GET
    path: "/feedlot/lots/{lotId}"
    description: "Get one lot (includes all computed accumulators and provisional_cog_cents_per_cwt)"
    roles: [Any]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: POST
    path: "/feedlot/lots/{lotId}/market"
    description: "Mark a lot as sold/marketed"
    roles: [FeedyardManager]
    code: 200
    input: []
    output: Lot
    side_effects: ["OPEN -> MARKETED; increments Lot.version by 1"]
  - method: POST
    path: "/feedlot/lots/{lotId}/fail-sale"
    description: "Sale fell through; return lot to feeding"
    roles: [FeedyardManager]
    code: 200
    input: []
    output: Lot
    side_effects: ["MARKETED -> OPEN; increments Lot.version by 1"]
  - method: POST
    path: "/feedlot/lots/{lotId}/ship"
    description: "Ship a marketed lot to the packer"
    roles: [FeedyardManager]
    code: 200
    input: [ship_date, out_weight_total_lbs]
    output: Lot
    side_effects:
      - "MARKETED -> SHIPPED; head_shipped=head_count_current; out_weight_total_lbs stored"
      - "ACTIVE PenAssignments -> ENDED at ship_date; pen occupancies recomputed (pens may flip to EMPTY)"
      - "ACTIVE RationAssignments -> CLOSED at ship_date"
      - "increments Lot.version by 1"
  - method: GET
    path: "/feedlot/lots/{id}/assignments"
    description: "List pen assignments for a lot (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "PenAssignment[]"
    side_effects: []
  - method: GET
    path: "/feedlot/lots/{id}/ration-assignments"
    description: "List ration assignments for a lot (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "RationAssignment[]"
    side_effects: []
  - method: GET
    path: "/feedlot/lots/{id}/health-events"
    description: "List health events for a lot (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "HealthEvent[]"
    side_effects: []
  - method: GET
    path: "/feedlot/lots/{id}/death-losses"
    description: "List death losses for a lot (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "DeathLoss[]"
    side_effects: []
  - method: GET
    path: "/feedlot/lots/{id}/hedges"
    description: "List hedge positions for a lot (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "HedgePosition[]"
    side_effects: []
  - method: GET
    path: "/feedlot/lots/{id}/close-outs"
    description: "List close-outs for a lot (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "CloseOut[]"
    side_effects: []
  - method: GET
    path: "/feedlot/lots/{id}/invoices"
    description: "List invoices for a lot (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "Invoice[]"
    side_effects: []

  # --- Ration ---
  - method: POST
    path: "/feedlot/rations"
    description: "Formulate a ration"
    roles: [FeedManager]
    code: 201
    input: [ration_name, step_level, cost_per_ton_cents]
    output: Ration
    side_effects: []
  - method: GET
    path: "/feedlot/rations"
    description: "List rations (created_at ASC)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Ration[]"
    side_effects: []
  - method: GET
    path: "/feedlot/rations/{rationId}"
    description: "Get one ration"
    roles: [Any]
    code: 200
    input: []
    output: Ration
    side_effects: []
  - method: GET
    path: "/feedlot/rations/{id}/ration-assignments"
    description: "List ration assignments using a ration (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "RationAssignment[]"
    side_effects: []
  - method: GET
    path: "/feedlot/rations/{id}/feed-calls"
    description: "List feed calls that used a ration (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "FeedCall[]"
    side_effects: []

  # --- PenAssignment ---
  - method: POST
    path: "/feedlot/assignments"
    description: "Place head of a lot into a pen"
    roles: [FeedyardManager]
    code: 201
    input: [pen_id, lot_id, head_count, start_date]
    output: PenAssignment
    side_effects:
      - "PenAssignment ACTIVE; Pen.current_occupancy_head += head_count; pen EMPTY -> OCCUPIED"
      - "increments Pen.version by 1"
  - method: POST
    path: "/feedlot/assignments/{assignmentId}/end"
    description: "End an active pen assignment (cattle move out)"
    roles: [FeedyardManager]
    code: 200
    input: [end_date]
    output: PenAssignment
    side_effects: ["ACTIVE -> ENDED; Pen.current_occupancy_head recomputed (pen may flip to EMPTY); increments PenAssignment.version by 1"]

  # --- RationAssignment ---
  - method: POST
    path: "/feedlot/ration-assignments"
    description: "Put a lot on a ration for an explicit half-open window [start_date, end_date)"
    roles: [FeedManager]
    code: 201
    input: [lot_id, ration_id, start_date, end_date]
    output: RationAssignment
    side_effects: ["RationAssignment ACTIVE; step-up and window-overlap rules enforced"]

  # --- FeedCall ---
  - method: POST
    path: "/feedlot/feed-calls"
    description: "Post a daily feed call for a pen; quantity computed from bunk score"
    roles: [FeedManager]
    code: 201
    input: [pen_id, call_date, "bunk_score?", "base_qty_lbs_per_head?"]
    output: FeedCall
    side_effects:
      - "qty_lbs_per_head/total_qty_lbs/total_cost_cents computed per calculations.feed_call_quantity"
      - "feed_cost_allocation distributes total_cost_cents to the lots' total_feed_cost_cents (bumps each affected Lot.version by 1)"

  # --- HealthEvent ---
  - method: POST
    path: "/feedlot/health-events"
    description: "Record a treatment with withdrawal period"
    roles: [CattleHealthTech]
    code: 201
    input: [lot_id, treatment_date, drug_product, withdrawal_days, head_treated, treatment_cost_cents]
    output: HealthEvent
    side_effects:
      - "withdrawal_end_date computed; status WITHDRAWAL_ACTIVE"
      - "Lot.total_health_cost_cents += treatment_cost_cents; withdrawal_clear_date recomputed; provisional COG recomputed; increments Lot.version by 1"

  # --- DeathLoss ---
  - method: POST
    path: "/feedlot/death-losses"
    description: "Record dead cattle against a lot"
    roles: [CattleHealthTech]
    code: 201
    input: [lot_id, loss_date, head_count, cause, insured]
    output: DeathLoss
    side_effects:
      - "loss_value_cents computed per calculations.death_loss_value; allocations[] recorded oldest-assignment-first (created_at ASC waterfall)"
      - "Cascade link 1: Lot.head_count_current -= head_count; total_deaths += head_count; total_death_loss_cents += loss_value_cents; provisional COG recomputed"
      - "Cascade link 2: each allocated PenAssignment.head_count reduced (mutation of the assignment)"
      - "Cascade link 3: each affected Pen.current_occupancy_head recomputed; a pen reaching 0 flips OCCUPIED -> EMPTY"
      - "increments Lot.version by 1"
  - method: GET
    path: "/feedlot/death-losses/{deathLossId}"
    description: "Get one death loss"
    roles: [Any]
    code: 200
    input: []
    output: DeathLoss
    side_effects: []
  - method: POST
    path: "/feedlot/death-losses/{deathLossId}/void"
    description: "Void a recorded death loss (compensating action)"
    roles: [CattleHealthTech]
    code: 200
    input: []
    output: DeathLoss
    side_effects: ["RECORDED -> VOIDED; head counts, costs, assignment allocations, and pen occupancies restored per state_machines.DeathLoss"]
  - method: GET
    path: "/feedlot/death-losses/{id}/insurance-claims"
    description: "List insurance claims against a death loss (created_at ASC)"
    roles: [Any]
    code: 200
    input: []
    output: "InsuranceClaim[]"
    side_effects: []

  # --- InsuranceClaim ---
  - method: POST
    path: "/feedlot/insurance-claims"
    description: "File a mortality claim against an insured death loss"
    roles: [CattleHealthTech]
    code: 201
    input: [death_loss_id, claimed_amount_cents]
    output: InsuranceClaim
    side_effects: ["status=UNDER_REVIEW, appeal_count=0"]
  - method: POST
    path: "/feedlot/insurance-claims/{claimId}/decide"
    description: "Adjuster decision: APPROVE (optional approved_amount_cents, defaults to claimed) or DENY"
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, "approved_amount_cents?"]
    output: InsuranceClaim
    side_effects: ["UNDER_REVIEW -> APPROVED|DENIED; decided_by_user_id := X-User-ID; increments InsuranceClaim.version by 1"]
  - method: POST
    path: "/feedlot/insurance-claims/{claimId}/appeal"
    description: "Appeal a denied claim (at most once)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["DENIED -> UNDER_REVIEW; appeal_count += 1"]
  - method: POST
    path: "/feedlot/insurance-claims/{claimId}/pay"
    description: "Pay an approved claim (payer must differ from the deciding adjuster)"
    roles: [ClaimsTreasurer, ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["APPROVED -> PAID; recovery credit applied per state_machines.InsuranceClaim (lot pending credit, or direct owner-balance credit when an OPEN invoice exists)"]

  # --- HedgePosition ---
  - method: POST
    path: "/feedlot/hedges"
    description: "Enter a futures hedge for a lot (OCC-guarded on the lot)"
    roles: [RiskManager]
    code: 201
    input: [lot_id, contract_month, "side?", quantity_contracts, entry_price_cents_per_cwt, expected_lot_version]
    output: HedgePosition
    side_effects: ["status=OPEN; hedge_coverage enforced; increments Lot.version by 1"]
  - method: POST
    path: "/feedlot/hedges/{hedgeId}/offset"
    description: "Offset (close) an open hedge and realize P&L"
    roles: [RiskManager]
    code: 200
    input: [exit_price_cents_per_cwt, offset_date]
    output: HedgePosition
    side_effects: ["OPEN -> OFFSET; realized_pnl_cents computed; Lot.total_hedge_pnl_cents += pnl; increments Lot.version by 1"]

  # --- CloseOut ---
  - method: POST
    path: "/feedlot/close-outs"
    description: "Open a close-out for a shipped lot (OCC-guarded; confirming a newer close-out supersedes the prior CONFIRMED one)"
    roles: [RiskManager]
    code: 201
    input: [lot_id, pricing_basis, grid_base_price_cents_per_cwt, expected_lot_version]
    output: CloseOut
    side_effects: ["status=DRAFT; increments Lot.version by 1"]
  - method: POST
    path: "/feedlot/close-outs/{closeOutId}/confirm"
    description: "Confirm with carcass data; computes grid value, final costs; generates the owner invoice"
    roles: [RiskManager]
    code: 200
    input: [carcass_records]
    output: CloseOut
    side_effects:
      - "DRAFT -> CONFIRMED; grid_value per pinned pricing_basis; cost_of_gain final variant"
      - "prior CONFIRMED close-out -> SUPERSEDED with its OPEN invoice -> VOID (balance compensated)"
      - "Lot -> CLOSED_OUT; new OPEN Invoice generated per calculations.invoice_total; Owner.outstanding_balance_cents += total_cents"
      - "increments CloseOut.version by 1 and Lot.version by 1"

  # --- Invoice ---
  - method: POST
    path: "/feedlot/invoices/{invoiceId}/payments"
    description: "Apply a payment to an open invoice"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents, payment_date]
    output: Invoice
    side_effects: ["amount_paid_cents += amount_cents; Owner.outstanding_balance_cents -= amount_cents; at exact total: Invoice -> PAID and Lot -> SETTLED"]
  - method: POST
    path: "/feedlot/invoices/{invoiceId}/void"
    description: "Void an open invoice (compensating action)"
    roles: [BillingClerk]
    code: 200
    input: ["reason?"]
    output: Invoice
    side_effects: ["OPEN -> VOID; Owner.outstanding_balance_cents -= (total_cents - amount_paid_cents)"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO-8601). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock clears due health withdrawals, closes ration assignments whose end_date is reached, and expires hedge positions whose contract month has begun."
    roles: [FeedyardManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "HealthEvents with withdrawal_end_date <= new date: WITHDRAWAL_ACTIVE -> CLEARED"
      - "RationAssignments with end_date <= new date: ACTIVE -> CLOSED"
      - "HedgePositions with contract_month-01 <= new date: OPEN -> EXPIRED (pnl 0)"
      - "Lot.provisional_cog_cents_per_cwt recomputed for non-terminal lots"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Claim payer's X-User-ID equals the claim's decided_by_user_id" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, out-of-range quantity, malformed date, or future-dated input where pinned (ship_date, loss_date, treatment_date, offset_date)" }
  # --- existence ---
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "Owner id does not exist" }
  - { id: ERR_PEN_NOT_FOUND, http: 404, condition: "Pen id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "Lot id does not exist" }
  - { id: ERR_RATION_NOT_FOUND, http: 404, condition: "Ration id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "PenAssignment id does not exist" }
  - { id: ERR_DEATH_LOSS_NOT_FOUND, http: 404, condition: "DeathLoss id does not exist" }
  - { id: ERR_INSURANCE_CLAIM_NOT_FOUND, http: 404, condition: "InsuranceClaim id does not exist" }
  - { id: ERR_HEDGE_NOT_FOUND, http: 404, condition: "HedgePosition id does not exist" }
  - { id: ERR_CLOSE_OUT_NOT_FOUND, http: 404, condition: "CloseOut id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lot_version does not match the Lot's current version" }
  # --- state ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "PATCH names the entity's current status, or death-loss void/claim-create on a VOIDED loss" }
  - { id: ERR_OWNER_SUSPENDED, http: 409, condition: "New lots cannot be received for a SUSPENDED owner" }
  - { id: ERR_PEN_IN_MAINTENANCE, http: 409, condition: "Assignment into a pen in MAINTENANCE" }
  - { id: ERR_PEN_OCCUPIED, http: 409, condition: "Maintenance start on an OCCUPIED pen" }
  - { id: ERR_PEN_NOT_OCCUPIED, http: 409, condition: "Feed call for a pen with no ACTIVE assignments" }
  - { id: ERR_LOT_NOT_OPEN, http: 409, condition: "Operation requires lot status OPEN (assignments, ration assignments, health events, death losses, hedges, market)" }
  - { id: ERR_LOT_NOT_MARKETED, http: 409, condition: "Ship or fail-sale requires lot status MARKETED" }
  - { id: ERR_LOT_HAS_NO_HEAD, http: 409, condition: "Market requires head_count_current >= 1" }
  - { id: ERR_LOT_NOT_CLOSABLE, http: 409, condition: "Close-out create/confirm requires lot status SHIPPED or CLOSED_OUT" }
  - { id: ERR_CLOSE_OUT_NOT_DRAFT, http: 409, condition: "Confirm requires close-out status DRAFT" }
  - { id: ERR_ACTIVE_HEDGES_EXIST, http: 409, condition: "Confirm blocked while any lot hedge is OPEN" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "decide requires UNDER_REVIEW; appeal requires DENIED; pay requires APPROVED" }
  - { id: ERR_HEDGE_NOT_OPEN, http: 409, condition: "Offset requires hedge status OPEN" }
  - { id: ERR_ASSIGNMENT_ALREADY_ENDED, http: 409, condition: "End requires assignment status ACTIVE" }
  - { id: ERR_INVOICE_NOT_OPEN, http: 409, condition: "Payments and void require invoice status OPEN" }
  # --- business safety ---
  - { id: ERR_WITHDRAWAL_NOT_CLEARED, http: 409, condition: "ship_date precedes the lot's withdrawal_clear_date" }
  # --- business referential ---
  - { id: ERR_COMMINGLE_RULE_VIOLATION, http: 409, condition: "Pen-sharing lots differ in sex_class, either has commingle_allowed=false, or active rations differ" }
  - { id: ERR_STEP_UP_VIOLATION, http: 409, condition: "Ration step_level is not the lot's next step (first must be 1)" }
  - { id: ERR_VOID_BLOCKED_BY_CLAIMS, http: 409, condition: "Death-loss void while an InsuranceClaim references the loss" }
  # --- business temporal ---
  - { id: ERR_PEN_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping compatible assignments would exceed pen.capacity_head on some day" }
  - { id: ERR_RATION_WINDOW_OVERLAP, http: 409, condition: "New ration window overlaps an existing window of the lot (zero-gap adjacency allowed)" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "end <= start (ration windows), end < start (pen assignments), or start before lot.arrival_date" }
  - { id: ERR_FEED_CALL_DATE_NOT_AFTER_PREVIOUS, http: 409, condition: "call_date not strictly after the pen's latest feed call date" }
  # --- business constraint ---
  - { id: ERR_OVER_ASSIGNMENT, http: 409, condition: "Lot's total ACTIVE assigned head plus new head exceeds head_count_current" }
  - { id: ERR_DUPLICATE_PEN_CODE, http: 409, condition: "pen_code already in use" }
  - { id: ERR_DUPLICATE_LOT_NUMBER, http: 409, condition: "lot_number already in use" }
  - { id: ERR_CLAIM_ALREADY_EXISTS, http: 409, condition: "An InsuranceClaim already exists for the death loss" }
  - { id: ERR_DEATH_LOSS_NOT_INSURED, http: 409, condition: "Claim filed against a loss with insured=false" }
  - { id: ERR_CARCASS_COUNT_MISMATCH, http: 409, condition: "carcass_records count differs from lot.head_shipped" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "appeal_count already 1; a denied claim may be appealed at most once" }
  # --- business fiscal ---
  - { id: ERR_HEDGE_OVER_COVERED, http: 422, condition: "open_cwt_after would exceed marketable_cwt (equality allowed)" }
  - { id: ERR_CLAIM_EXCEEDS_LOSS_VALUE, http: 422, condition: "claimed_amount_cents exceeds the loss's loss_value_cents" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "amount_paid_cents + amount_cents would exceed invoice total_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FeedyardManager
    description: "Yard manager: owners, pens, lot reception/marketing/shipping, pen moves, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /feedlot/owners"
      - "PATCH /feedlot/owners/{ownerId}"
      - "POST /feedlot/pens"
      - "PATCH /feedlot/pens/{penId}"
      - "POST /feedlot/lots"
      - "POST /feedlot/lots/{lotId}/market"
      - "POST /feedlot/lots/{lotId}/fail-sale"
      - "POST /feedlot/lots/{lotId}/ship"
      - "POST /feedlot/assignments"
      - "POST /feedlot/assignments/{assignmentId}/end"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]

  - name: FeedManager
    description: "Nutritionist/feed truck dispatcher: rations, ration windows, daily feed calls"
    identity: opaque
    exclusive_operations:
      - "POST /feedlot/rations"
      - "POST /feedlot/ration-assignments"
      - "POST /feedlot/feed-calls"
    shared_operations: ["All GET endpoints"]

  - name: CattleHealthTech
    description: "Cattle health crew: treatments, death losses, mortality claim filing"
    identity: opaque
    exclusive_operations:
      - "POST /feedlot/health-events"
      - "POST /feedlot/death-losses"
      - "POST /feedlot/death-losses/{deathLossId}/void"
      - "POST /feedlot/insurance-claims"
    shared_operations: ["All GET endpoints"]

  - name: RiskManager
    description: "Risk desk: hedges and close-outs"
    identity: opaque
    exclusive_operations:
      - "POST /feedlot/hedges"
      - "POST /feedlot/hedges/{hedgeId}/offset"
      - "POST /feedlot/close-outs"
      - "POST /feedlot/close-outs/{closeOutId}/confirm"
    shared_operations: ["All GET endpoints"]

  - name: ClaimsAdjuster
    description: "Claims adjuster: decide and appeal-review mortality claims; may pay claims they did not decide"
    identity: opaque
    exclusive_operations:
      - "POST /feedlot/insurance-claims/{claimId}/decide"
      - "POST /feedlot/insurance-claims/{claimId}/appeal"
    shared_operations:
      - "All GET endpoints"
      - "POST /feedlot/insurance-claims/{claimId}/pay (shared with ClaimsTreasurer; segregation-of-duties applies)"

  - name: ClaimsTreasurer
    description: "Claims treasury: pays approved claims; may not pay a claim they decided (they never decide)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
      - "POST /feedlot/insurance-claims/{claimId}/pay (shared with ClaimsAdjuster; segregation-of-duties applies)"

  - name: BillingClerk
    description: "Front-office billing: applies invoice payments and voids open invoices"
    identity: opaque
    exclusive_operations:
      - "POST /feedlot/invoices/{invoiceId}/payments"
      - "POST /feedlot/invoices/{invoiceId}/void"
    shared_operations: ["All GET endpoints"]

  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints"]
