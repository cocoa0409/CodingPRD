            - "the third submit returns 200, PPAPSubmission.${ppap_id}.status == SUBMITTED and fai_sample_shots == 30"

      - name: press_qualification_failed_trial_can_be_rescheduled_and_pass
        claim_type: Idempotency
        grounds: ["state_machines.PressQualification.RUN_AT_RATE_SCHEDULED_to_FAILED", "state_machines.PressQualification.FAILED_to_RUN_AT_RATE_SCHEDULED", "state_machines.PressQualification.RUN_AT_RATE_SCHEDULED_to_QUALIFIED", "entities.PressQualification.fields.attempt_count", "calculations.run_at_rate_verdict"]
        distinguishing_aspect: "The FAILED -> RUN_AT_RATE_SCHEDULED loop is real: a second trial on the same junction row can pass, attempt_count reaches 2, and recording a verdict on a row that is not RUN_AT_RATE_SCHEDULED returns 409 ERR_RUN_AT_RATE_NOT_SCHEDULED."
        test_recipe:
          setup: ["Mold M-1 and press P-150; a qualification row exists and its first trial recorded 300 against a 400 parts/hour target, so it is FAILED with attempt_count 1."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000 }, as: PlantAdmin, captures: { mold_id: $.data.id } }
            - { call: "POST /press-qualifications", payload: { mold_id: "${mold_id}", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { pq_id: $.data.id } }
            - { call: "POST /press-qualifications/${pq_id}/schedule-run-at-rate", payload: { scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T12:00:00Z", target_parts_per_hour: 400 }, as: ProcessEngineer }
            - { call: "POST /press-qualifications/${pq_id}/record-run-at-rate", payload: { actual_parts_per_hour: 300 }, as: QualityEngineer }
          trigger:
            - { call: "POST /press-qualifications/${pq_id}/record-run-at-rate", payload: { actual_parts_per_hour: 400 }, as: QualityEngineer, captures: { err_id: $.data.error_id } }
            - { call: "POST /press-qualifications/${pq_id}/schedule-run-at-rate", payload: { scheduled_start: "2026-09-03T08:00:00Z", scheduled_end: "2026-09-03T12:00:00Z", target_parts_per_hour: 400 }, as: ProcessEngineer }
            - { call: "POST /press-qualifications/${pq_id}/record-run-at-rate", payload: { actual_parts_per_hour: 360 }, as: QualityEngineer }
          assert:
            - "the repeated record call on the FAILED row returns status 409 and ${err_id} == ERR_RUN_AT_RATE_NOT_SCHEDULED"
            - "after the reschedule PressQualification.${pq_id}.status == RUN_AT_RATE_SCHEDULED and actual_parts_per_hour == null"
            - "after the second trial PressQualification.${pq_id}.status == QUALIFIED because 360 * 10000 / 400 == 9000 which is exactly RUN_AT_RATE_MIN_BP"
            - "PressQualification.${pq_id}.attempt_count == 2"

      - name: quote_acceptance_supersedes_sibling_quotes_on_the_same_mold
        claim_type: Side Effect Execution
