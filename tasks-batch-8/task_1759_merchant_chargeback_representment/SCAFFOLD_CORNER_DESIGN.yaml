      - name: representment_already_open_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - "errors[ERR_REPRESENTMENT_ALREADY_OPEN]"
        distinguishing_aspect: "One open packet per case: with a packet ASSEMBLED, a second create (with a FRESH chargeback version, so OCC passes) fails ERR_REPRESENTMENT_ALREADY_OPEN — the constraint error, not the OCC error."
        test_recipe:
          setup: ["notified chargeback with an ASSEMBLED packet"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
