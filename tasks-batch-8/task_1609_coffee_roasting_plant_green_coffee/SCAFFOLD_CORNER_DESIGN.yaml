  # ===========================================================================
  # Section: endpoints — CRUD pattern coverage
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_counterparties_pagination
        claim_type: listing_pagination
        grounds:
          - 'endpoints."GET /roastery/counterparties'
          - "response_envelope"
        distinguishing_aspect: "GET /roastery/counterparties respects limit/offset and returns meta { api_request_id, api_request_timestamp } plus pagination fields limit, offset, total_count, has_more."
        test_recipe:
          setup: ["Three counterparties created."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "P1", legal_name: "P1 Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000 }
              as: Trader
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "P2", legal_name: "P2 Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000 }
              as: Trader
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "P3", legal_name: "P3 Co", counterparty_kind: "CUSTOMER", credit_limit_usd: 1000 }
              as: Trader
          trigger:
            - call: "GET /roastery/counterparties"
              payload: { limit: 2, offset: 0 }
              as: Trader
              captures: { pg_total: $.data }
          assert:
            - "Envelope has meta.api_request_id and meta.api_request_timestamp"
            - "Pagination fields limit=2, offset=0, total_count=3, has_more=true"

      - name: response_envelope_error_shape
        claim_type: response_envelope
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Error responses carry response_type=error and data.{error_id, message}."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /roastery/counterparties/00000000-0000-0000-0000-000000000000"
              as: Trader
              captures: { env_err: $.data.error_id, env_msg: $.data.message }
          assert:
            - "env_err == ERR_NOT_FOUND"
            - "env_msg is a non-empty string"

  # ===========================================================================
  # Section: errors — every error code triggerable
  # ===========================================================================
  - section: errors
    instances:
      - name: err_stale_version_triggerable
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STALE_VERSION"
        distinguishing_aspect: "Already exercised via §1.8 stale_version_precedes_credit_limit."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_version_precedes_credit_limit
          rationale: "Asserted as the primary outcome of the named §1.8 instance."

      - name: err_invalid_state_triggerable
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INVALID_STATE"
        distinguishing_aspect: "Already exercised via §1.9 shipment_cancel_from_received_returns_invalid_state and others."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / roast_start_blocked_by_stale_recipe_version
          rationale: "ERR_INVALID_STATE is asserted in §1.9 shipment_cancel_from_received_returns_invalid_state as well as §1.8 cross_entity_state_dependency."

  # ===========================================================================
  # Section: roles — RBAC denial
  # ===========================================================================
  - section: roles
    instances:
      - name: trader_cannot_approve_own_hedge_via_role
        claim_type: role_exclusive_denied
        grounds:
          - "roles.Trader"
          - "roles.RiskManager"
          - 'endpoints."POST /roastery/futures-hedges/{hedge_id}/approve'
        distinguishing_aspect: "POST /roastery/futures-hedges/{id}/approve is RiskManager-exclusive; Trader is denied at RBAC (priority 3) before business checks."
        test_recipe:
