              as_user_id: "${w1}"
            - call: "POST /mkt/hits/${hB}/assignments"
              payload: { worker_id: "${w2}" }
              as: Worker
              as_user_id: "${w2}"
          assert:
            - "hop 1-3: GET /mkt/worker-qualifications?worker_id=${w1} returns exactly one row with qualification_type_id == ${qt1}, source == CASCADE and score == 70"
            - "the grant exists because approval recomputed approval_rate_pct to 100 >= auto_assign_threshold_pct 80"
            - "W2, whose rate cascade never ran, is refused HIT B and no grant row exists for ${w2}"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_second_publish
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
          - errors.ERR_INSUFFICIENT_FUNDS
        distinguishing_aspect: "A second publish on an already-PUBLISHED HIT whose prepaid balance is now zero returns the state error (409 ERR_INVALID_STATE), not the fiscal error (402 ERR_INSUFFICIENT_FUNDS)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Requester deposits exactly 125c; a 1-slot 100c HIT needs 125c, so publishing succeeds and drains the balance to 0."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Priority A" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 125 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Priority A", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          trigger:
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id is NOT ERR_INSUFFICIENT_FUNDS even though prepaid_balance_cents is 0"

      - name: safety_beats_temporal_on_expired_submit_by_suspended_worker
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_WORKER_SUSPENDED
          - errors.ERR_ASSIGNMENT_EXPIRED
        distinguishing_aspect: "A suspended worker submitting an assignment that is also past its time limit returns the safety error (409 ERR_WORKER_SUSPENDED), not the temporal error (409 ERR_ASSIGNMENT_EXPIRED)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Worker W1 accepts a 1-slot 100c HIT with a 10-minute time limit; admin then suspends W1; clock advances to T0+20min so the limit has elapsed too."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Priority B" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Priority B", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 10 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Priority B", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/workers/${w1}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_WORKER_SUSPENDED"
            - "error_id is NOT ERR_ASSIGNMENT_EXPIRED even though the 10-minute limit elapsed at T0+10min"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
