              captures: { mid_valid: $.data.verified_valid_count, mid_voided: $.data.voided_signature_count, mid_status: $.data.status }
            - call: "POST /petitions/${pet_id}/cure-periods"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_floor: $.data.error_id }
            - call: "POST /signature-batches/${b1_id}/reinstate"
              payload: { invalidation_reason: "jurat cured on the record" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { re_status: $.data.status }
            - call: "GET /petitions/${pet_id}"
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { post_valid: $.data.verified_valid_count, post_voided: $.data.voided_signature_count }
            - call: "POST /petitions/${pet_id}/cure-periods"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { cp_id: $.data.id, cp_short: $.data.shortfall_at_open, cp_rate: $.data.assumed_validity_rate_bps, cp_target: $.data.cure_target_raw_signatures }
          assert:
            - "${r1_det} == FULL_CHECK_REQUIRED with ${r1_proj} == 4, and ${r2_det} == INSUFFICIENT with ${r2_rate} == 10000"
            - "${pre_valid} == 4 and ${pre_status} == CURE_PERIOD - the face-value count sits exactly on the floor 4 == 5 * 8000 / 10000, so the tally treated the petition as cure-eligible"
            - "${inv_status} == INVALIDATED; ${mid_valid} == 2, ${mid_voided} == 2 and ${mid_status} == CURE_PERIOD - voiding b1's two lines drops the ledger below the floor without moving the petition"
            - "${e_floor} == ERR_CURE_NOT_ELIGIBLE (409), not ERR_INVALID_PETITION_STATE and not ERR_CURE_LIMIT_REACHED - the petition is still CURE_PERIOD and cure_period_count is 0"
            - "${re_status} == AFFIDAVIT_VERIFIED, ${post_valid} == 4 and ${post_voided} == 0 - reinstatement restores both lines to VALID"
            - "${cp_id} is created, ${cp_short} == 1 == max(0, 5 - 4), ${cp_rate} == 10000 (the FULL_CHECK round's rate), ${cp_target} == 1 and Petition.${pet_id}.cure_period_count == 1 - the identical call now succeeds"

      - name: priority_conflict_role_denial_outranks_missing_petition
        claim_type: priority_conflict
        grounds:
          - validations[priority 3]
          - validations[priority 5]
        excluded_because:
          difficulty_instance: role_denial_outranks_missing_petition_on_clearance
          rationale: |
            §1.8 already fires a single request that violates the role list at priority 3 and
            names a non-existent petition at priority 5, asserting ERR_UNAUTHORIZED rather
            than ERR_PETITION_NOT_FOUND, and then flips one violation at a time to show each
            code in isolation. Nothing about the priority-3-over-5 pair is left to probe.

      - name: priority_conflict_open_round_outranks_empty_pool
        claim_type: priority_conflict
        grounds:
          - validations[priority 10]
          - validations[priority 15]
        excluded_because:
          difficulty_instance: open_round_state_outranks_empty_pool_quota
          rationale: |
            §1.8 constructs a petition whose eligible pool is empty while a round is already
            OPEN and asserts ERR_ROUND_ALREADY_OPEN, then closes the round to expose
            ERR_EMPTY_ELIGIBLE_POOL from the same request shape. Both codes and the ordering
            are covered.

      - name: priority_conflict_registration_gate_outranks_assignment_linkage
        claim_type: priority_conflict
        grounds:
          - validations[priority 12]
          - validations[priority 13]
        excluded_because:
          difficulty_instance: circulator_registration_gate_outranks_missing_assignment
          rationale: |
            §1.8 files a batch for a circulator that is both unregistered and unassigned and
            asserts ERR_CIRCULATOR_NOT_REGISTERED, then registers the circulator so the same
            call surfaces ERR_NO_ACTIVE_ASSIGNMENT. The 12-before-13 pair is fully pinned.

      - name: temporal_cure_period_half_open_adjacency
        claim_type: temporal_validation
        grounds:
          - validations[priority 14]
          - errors[ERR_CURE_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: cure_period_half_open_adjacency_allowed_on_petition
          rationale: |
            §1.8 opens a second cure period one millisecond before the first period's
            deadline_at (refused with ERR_CURE_PERIOD_OVERLAP) and again exactly at it
            (accepted), which is the whole content of the half-open rule.

      - name: temporal_assignment_buffer_closed_interval
        claim_type: temporal_validation
        grounds:
          - validations[priority 14]
          - errors[ERR_ASSIGNMENT_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: assignment_closed_interval_buffer_on_circulator
          rationale: |
            §1.8 probes ASSIGNMENT_BUFFER_DAYS on both sides of an existing interval at the
            exact boundary day and one day inside it, and confirms a TERMINATED interval is
            invisible to the check. No untested edge of the buffer rule remains.

      - name: temporal_signed_on_window_endpoints
        claim_type: boundary_condition
        grounds:
          - validations[priority 14]
          - errors[ERR_SIGNED_OUTSIDE_WINDOW]
        excluded_because:
          difficulty_instance: signed_on_closed_window_endpoint_boundary
          rationale: |
            §1.8 files lines at cleared_at exactly, at circulation_deadline exactly, and one
            millisecond outside each end, establishing the closed interval; the supplemental
            half-open variant is covered by the cure-period instances above.

      - name: cross_entity_determination_blocked_by_open_referral
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 15]
          - errors[ERR_FRAUD_REFERRAL_OPEN]
        excluded_because:
          difficulty_instance: determination_blocked_by_open_fraud_referral
          rationale: |
            §1.8 blocks a determination on a petition carrying an OPENED referral, then
            adjudicates the referral UNSUBSTANTIATED and reruns the identical determination
            to success, which covers both the violation and the satisfaction.

      - name: cross_entity_round_creation_requires_filed_petition
        claim_type: cross_entity_state_dependency
        grounds:
          - validations[priority 10]
          - errors[ERR_INVALID_PETITION_STATE]
        excluded_because:
          difficulty_instance: round_creation_blocked_by_petition_not_yet_filed
          rationale: |
            §1.8 walks round creation against a CLEARED petition and then against the same
            petition after file-signatures, so the state dependency in both directions is
            already asserted.

      - name: cross_entity_batch_creation_requires_active_assignment
        claim_type: cross_entity_state_dependency
        grounds:
          - validations[priority 13]
          - errors[ERR_NO_ACTIVE_ASSIGNMENT]
        excluded_because:
          difficulty_instance: batch_creation_blocked_by_terminated_assignment
          rationale: |
            §1.8 terminates an assignment and shows that batch creation for the same
            circulator and county then fails, while a fresh ACTIVE assignment restores it.

  # ---------------------------------------------------------------------------
  # Section 5 of 9: endpoints. Guide claim types: standard_crud, action_endpoint,
  # computed_read, conditional_action, cross_reference_link. The computed reads
  # (verification-invoice, distribution-report) and the void conditional action
  # are already exercised by §1.8, so they appear here as stubs.
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: logical_clock_stamps_creates_and_mutating_action_endpoints
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - endpoints[PUT /voter-records/{voter_record_id}/registration-status]
          - endpoints[PUT /circulators/{circulator_id}/paid-disclosure]
          - entities[VoterRecord]
          - entities[Circulator]
          - consistency_model
        distinguishing_aspect: |
          Every server-side instant in this API comes from the injected logical clock, never
          from the wall clock, and the two PUT action endpoints are the cheapest place to pin
          that: created_at is frozen at the clock value in force at creation, updated_at
          tracks the clock value in force at each later mutation, and version increments once
          per accepted write. The clock is set to a value with non-zero milliseconds so an
          implementation that truncates to whole seconds is caught, and the response body of
          the action endpoint is compared with a follow-up GET so the write is proven durable
          rather than only echoed.
        test_recipe:
          setup:
            - "No domain state is required beyond one County, one VoterRecord and one paid Circulator."
            - "The clock is set to 2026-05-01T12:34:56.789Z before any create."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T12:34:56.789Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /counties"
              payload: { county_code: "ALPHA", name: "Alpha County", registered_voter_count: 20 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { alpha_id: $.data.id, alpha_created: $.data.created_at, alpha_updated: $.data.updated_at }
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA1", full_name: "Ada Adams", signature_on_file_hash: "H-VA1", registration_date: "2020-01-01T00:00:00Z", registration_status: "ACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { v1_id: $.data.id, v1_created: $.data.created_at, v1_updated: $.data.updated_at, v1_version: $.data.version }
            - call: "POST /circulators"
              payload: { full_name: "Cora Carter", residency_state_code: "CA", is_paid: true, employer_name: "Signature Co" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id, c1_created: $.data.created_at, c1_version: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-02T03:04:05.006Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "PUT /voter-records/${v1_id}/registration-status"
              payload: { registration_status: "INACTIVE" }
              as: CountyClerk
              as_user_id: "${alpha_id}"
              captures: { v1_status2: $.data.registration_status, v1_created2: $.data.created_at, v1_updated2: $.data.updated_at, v1_version2: $.data.version }
            - call: "GET /voter-records/${v1_id}"
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { v1_status3: $.data.registration_status, v1_updated3: $.data.updated_at, v1_version3: $.data.version }
            - call: "PUT /circulators/${c1_id}/paid-disclosure"
              payload: { disclosure_document_id: "DISC-1", employer_name: "Signature Co LLC" }
              as: CirculatorAgent
              as_user_id: "${c1_id}"
              captures: { c1_disc: $.data.disclosure_document_id, c1_on_file: $.data.paid_disclosure_on_file, c1_employer: $.data.employer_name, c1_updated2: $.data.updated_at, c1_version2: $.data.version }
            - call: "GET /circulators/${c1_id}"
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c1_disc2: $.data.disclosure_document_id, c1_created2: $.data.created_at }
          assert:
            - "${alpha_created} == ${alpha_updated} == 2026-05-01T12:34:56.789Z - milliseconds are preserved, not truncated"
            - "${v1_created} == ${v1_updated} == 2026-05-01T12:34:56.789Z and ${c1_created} == 2026-05-01T12:34:56.789Z"
            - "${v1_status2} == INACTIVE, ${v1_created2} == ${v1_created} (unchanged), ${v1_updated2} == 2026-05-02T03:04:05.006Z and ${v1_version2} == ${v1_version} + 1"
            - "${v1_status3} == ${v1_status2}, ${v1_updated3} == ${v1_updated2} and ${v1_version3} == ${v1_version2} - the follow-up GET agrees with the action response"
            - "${c1_disc} == DISC-1, ${c1_on_file} == true, ${c1_employer} == Signature Co LLC, ${c1_updated2} == 2026-05-02T03:04:05.006Z and ${c1_version2} == ${c1_version} + 1"
            - "${c1_disc2} == DISC-1 and ${c1_created2} == ${c1_created} - the disclosure survives the read and creation time never moves"

      - name: list_endpoints_filter_by_every_declared_reference
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /signature-batches]
          - endpoints[GET /signature-records]
          - endpoints[GET /circulation-assignments]
          - endpoints[GET /verification-rounds]
          - endpoints[GET /petitions]
          - entities[SignatureBatch]
          - entities[SignatureRecord]
        distinguishing_aspect: |
          There are no nested collection routes in this API: children are reached by filtering
          a flat list on a declared foreign key, so a filter that silently ignores its
          argument would leak one petition's batches into another's audit. Two petitions with
          interleaved children are built and each list is queried by the parent key, by a
          status enum, and by a boolean, so the filters are shown to be conjunctive rather
          than a single-key special case. The in_sample filter is checked before any round
          exists, so it must return an empty array rather than every line.
        test_recipe:
          setup:
            - "Standard SOS-L, county ALPHA with ACTIVE voter VA1, two petitions P1 and P2 cleared 2026-08-01, circulator c1 REGISTERED with an assignment on each petition (intervals separated by more than ASSIGNMENT_BUFFER_DAYS)."
            - "P1 holds batch b1 with two lines; P2 holds batch b2 with one line. b1 is affidavit-verified, b2 is left RECEIVED."
            - "No verification round has been created yet, so no line has in_sample true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-L", gubernatorial_vote_total: 100, signature_pct_bps: 100, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /counties"
              payload: { county_code: "ALPHA", name: "Alpha County", registered_voter_count: 20 }
