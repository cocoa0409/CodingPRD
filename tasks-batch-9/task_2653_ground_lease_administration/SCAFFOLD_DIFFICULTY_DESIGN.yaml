              payload: {}
              as: MortgageeAgent
              as_user_id: "${m1_id}"
              captures: { v_clear: $.data.version }
            - call: "POST /portfolio/estoppel-certificates"
              payload: { lease_id: "${lease_id}", requested_by_mortgage_id: "${m1_id}", expected_lease_version: "${v_clear}" }
