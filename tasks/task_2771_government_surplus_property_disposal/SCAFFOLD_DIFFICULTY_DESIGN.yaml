          The request cycles SUBMITTED -> INFO_REQUESTED -> SUBMITTED twice, so the same pair of states
          is visited three times in one row's life; resubmission_count is the only monotone witness of
          the loop. tier_at_submission stays frozen at STATE_AGENCY even after the parent cycle advances
