      - name: statement_line_is_immutable_and_has_no_write_surface
        claim_type: immutability
        grounds:
          - entities.StatementLine.common_fields
          - endpoints.GET_/royalties/statement-lines
          - endpoints.GET_/royalties/statement-lines/{id}
        distinguishing_aspect: |
          StatementLine is declared with common_fields false, which is a structural claim about the
          whole API surface: every one of its 15 fields has source system, the only two endpoints
          that mention statement-lines are reads, and the row exposes NO version and NO updated_at —
          so an OCC-style edit of a royalty line is impossible by construction. A correction is
          expressed as a NEW ADJUSTMENT line pointing at the old one through adjustment_of_line_id,
          never as a mutation.
        test_recipe:
          setup:
            - "Any issued statement carrying at least one line (the single-line fixture is sufficient)."
          setup_api_calls: []
          trigger:
            - call: "GET /royalties/statement-lines"
              payload: {}
              as: RoyaltyAdmin
              captures: { rows: "$.data" }
          assert:
            - "The §1.5 endpoint table contains exactly two statement-line entries, GET /royalties/statement-lines and GET /royalties/statement-lines/{id}; there is no POST, PATCH, PUT or DELETE on either path, so no request can alter a line once written."
            - "A returned line exposes id plus the 15 declared system fields; it exposes NO version field and NO updated_at field, unlike every common_fields entity in this domain."
            - "Every field is server-derived: no statement-line value is ever accepted from a client body anywhere in the API."
            - "adjustment_of_line_id is the only sanctioned way to revise a line — a later ADJUSTMENT line references the original, which itself stays byte-identical."

  - section: state_machines
    instances:
      - name: usage_batch_seal_and_match_are_not_repeatable
        claim_type: idempotency
        grounds:
          - state_machines.UsageBatch.OPEN_to_SEALED
          - state_machines.UsageBatch.SEALED_to_MATCHED
          - validations.priority_8
          - errors.ERR_INVALID_USAGE_BATCH_STATE
        distinguishing_aspect: |
          Each of the three batch write operations is legal in exactly one status: a second seal, a
          line appended after sealing, and a second match all fail with
          ERR_INVALID_USAGE_BATCH_STATE, and the failed match must not re-run the matcher (the
          counters stay exactly where the first match left them).
        test_recipe:
          setup:
            - "One OPEN period, one RECORDING work, one OPEN batch carrying a single 300000-play line whose reported_isrc matches the work exactly."
          setup_api_calls:
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { w1: "$.data.id" }
            - call: "POST /royalties/usage-batches"
              payload: { period_id: "${per}", source_label: "UK client feed" }
              as: RightsOpsAnalyst
              captures: { ub: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_isrc: "GBABC2600001", reported_title: "Midnight Ledger", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 300000 }
              as: RightsOpsAnalyst
              captures: { u1: "$.data.id", ms0: "$.data.match_status" }
          trigger:
            - call: "POST /royalties/usage-batches/${ub}/seal"
              payload: {}
              as: RightsOpsAnalyst
              captures: { s1: "$.data.status" }
            - name: second_seal_rejected
              call: "POST /royalties/usage-batches/${ub}/seal"
              payload: {}
              as: RightsOpsAnalyst
              captures: { err: "$.data.error_id" }
            - name: line_append_after_seal_rejected
              call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_isrc: "GBABC2600001", reported_title: "Midnight Ledger", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 1 }
              as: RightsOpsAnalyst
              captures: { err2: "$.data.error_id" }
            - call: "POST /royalties/usage-batches/${ub}/match"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-fuzzy-1"
              captures: { s2: "$.data.status", mp: "$.data.matched_play_count" }
            - name: second_match_rejected
              call: "POST /royalties/usage-batches/${ub}/match"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-fuzzy-1"
              captures: { err3: "$.data.error_id" }
            - call: "GET /royalties/usage-batches/${ub}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { s3: "$.data.status", lc: "$.data.line_count", tp: "$.data.total_play_count", mp2: "$.data.matched_play_count" }
          assert:
            - "First seal: status OPEN -> SEALED, HTTP 200."
            - "Second seal: HTTP 409 with error_id ERR_INVALID_USAGE_BATCH_STATE; status still SEALED."
            - "Line append after sealing: HTTP 409 with error_id ERR_INVALID_USAGE_BATCH_STATE; line_count stays 1 and total_play_count stays 300000."
            - "First match: status SEALED -> MATCHED with matched_play_count 300000 and unmatched_play_count 0."
            - "Second match: HTTP 409 with error_id ERR_INVALID_USAGE_BATCH_STATE; final status MATCHED, line_count 1, total_play_count 300000, matched_play_count 300000."

      - name: registration_is_created_in_submitted_with_derived_payee
        claim_type: initial_state
        grounds:
          - state_machines.RightsRegistration.initial_state
          - entities.RightsRegistration.fields.payee_holder_id
          - entities.RightsRegistration.fields.evidence_round
        distinguishing_aspect: |
          A new registration lands in SUBMITTED — not UNDER_REVIEW — with evidence_round 0,
          reviewed_by_user_id null, disputing_holder_id null, supersede_overlapping false by
          default, and payee_holder_id already derived (claimant for DIRECT), and the review
          transition is the only way out of SUBMITTED.
        test_recipe:
          setup:
            - "One LABEL holder and one RECORDING work with its version captured."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
