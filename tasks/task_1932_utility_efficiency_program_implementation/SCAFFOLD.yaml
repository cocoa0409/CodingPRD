scenario: |
  1932. Utility Efficiency Program Implementation & Contractor Network (CLEAResult style implementer): contractor recruitment & quality assurance scoring, project pipeline & lead distribution, work-order/direct-install scheduling, incentive payment to contractor vs customer, quality inspection failure & remediation, training & certification requirement, customer complaint handling, program cost-effectiveness reporting

domain_name: utility-efficiency-program
api_prefix: /efficiency

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique program code (e.g. RES-HVAC-2026)" }
      - { name: name, type: string, source: input, description: "Human-readable program name" }
      - { name: sector, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL | INDUSTRIAL" }
      - { name: budget_cents, type: integer, source: input, description: "Total program incentive budget in cents" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of incentive_amount_cents across Projects in states APPROVED, SCHEDULED, INSTALLED, INSPECTING, COMPLETED for this program" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of IncentivePayment.amount_cents in state PAID for this program" }
      - { name: avoided_kwh_target, type: integer, source: input, description: "Annual kWh savings target" }
      - { name: avoided_kwh_actual, type: integer, source: computed, default: 0, description: "Sum of estimated_annual_kwh_savings across Projects in state COMPLETED for this program" }
      - { name: trc_threshold, type: number, source: input, description: "Total Resource Cost ratio threshold — cost-effectiveness flag raised when trc_ratio < threshold" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Business legal name" }
      - { name: license_number, type: string, source: input, description: "State contractor license number" }
      - { name: sector, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL | INDUSTRIAL" }
      - { name: service_zip_codes, type: array, source: input, description: "List of ZIP codes the contractor serves" }
      - { name: qa_score_bps, type: integer, source: computed, default: 10000, description: "Quality-assurance score in basis points (0–10000); recomputed from rolling window of scored inspections" }
      - { name: qa_window_size, type: integer, source: system, default: 10, description: "Rolling window size (inspections) used for qa_score_bps" }
      - { name: active_certification_count, type: integer, source: computed, default: 0, description: "Count of Certifications in state ACTIVE linked to this contractor" }
      - { name: on_time_installs, type: integer, source: computed, default: 0, description: "Count of WorkOrders in state COMPLETED with completed_on <= scheduled_on" }
      - { name: late_installs, type: integer, source: computed, default: 0, description: "Count of WorkOrders in state COMPLETED with completed_on > scheduled_on" }
      - { name: complaint_count_90d, type: integer, source: computed, default: 0, description: "Count of Complaints created within last 90 days for this contractor (clock-driven)" }
      - { name: status, type: enum, source: system, description: "APPLIED | APPROVED | SUSPENDED | TERMINATED" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: measure_type, type: enum, source: input, description: "HVAC | INSULATION | LIGHTING | WATER_HEATING | SOLAR" }
      - { name: issued_on, type: datetime, source: input, description: "Date certification issued" }
      - { name: expires_on, type: datetime, source: input, description: "Date certification expires" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Customer email" }
      - { name: service_zip, type: string, source: input, description: "Service ZIP code" }
      - { name: sector, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL | INDUSTRIAL" }
      - { name: utility_account_id, type: string, source: input, description: "Utility account identifier" }

  - name: Lead
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: measure_type, type: enum, source: input, description: "HVAC | INSULATION | LIGHTING | WATER_HEATING | SOLAR" }
      - { name: estimated_annual_kwh_savings, type: integer, source: input, description: "Estimated annual kWh savings for the proposed measure" }
      - { name: source_channel, type: enum, source: input, description: "WEB | CALL_CENTER | FIELD_AUDIT | REFERRAL | UTILITY_REFERRAL" }
      - { name: assigned_contractor_id, type: string, source: system, description: "FK -> Contractor.id; null until distributed; set by distribute action" }
      - { name: distribution_decision, type: object, source: system, description: "Recorded selector output: candidate_count, ranking_key, tie_break_used" }
      - { name: status, type: enum, source: system, description: "NEW | OFFERED | ACCEPTED | EXPIRED | WITHDRAWN" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: measure_type, type: enum, source: input, description: "HVAC | INSULATION | LIGHTING | WATER_HEATING | SOLAR" }
      - { name: measure_cost_cents, type: integer, source: input, description: "Total installed cost of measure in cents" }
      - { name: estimated_annual_kwh_savings, type: integer, source: input, description: "Estimated annual kWh savings" }
      - { name: incentive_recipient, type: enum, source: input, description: "CONTRACTOR | CUSTOMER — who receives the incentive payment" }
      - { name: incentive_amount_cents, type: integer, source: computed, description: "Computed from program rate table × savings; see calc project_incentive_amount" }
      - { name: incentive_amount_provisional_cents, type: integer, source: computed, description: "Provisional variant computed at approval time using estimate-based inputs" }
      - { name: approval_snapshot_contractor_qa_bps, type: integer, source: system, description: "QA score snapshot frozen at approval time for downstream reporting" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | SCHEDULED | INSTALLED | INSPECTING | REMEDIATION | COMPLETED | CANCELLED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: scheduled_on, type: datetime, source: input, description: "Scheduled install date (UTC midnight of day)" }
      - { name: duration_hours, type: integer, source: input, description: "Planned duration in hours" }
      - { name: direct_install, type: boolean, source: input, default: false, description: "True when implementer field crew performs direct install (no scheduling against contractor calendar)" }
      - { name: assigned_inspector_id, type: string, source: system, description: "Inspector id (FK-style reference); populated when WorkOrder transitions to INSTALLED" }
      - { name: completed_on, type: datetime, source: system, description: "Actual completion datetime; null until completion" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector name" }
      - { name: license_number, type: string, source: input, description: "Inspector license number" }
      - { name: excluded_contractor_ids, type: array, source: input, default: [], description: "Contractor ids this inspector is forbidden from inspecting (segregation-of-duties conflicts)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id" }
      - { name: scheduled_on, type: datetime, source: input, description: "Scheduled inspection date" }
      - { name: outcome, type: enum, source: system, description: "PENDING | PASS | FAIL" }
      - { name: score_bps, type: integer, source: system, description: "QA score contribution in basis points (0–10000); recorded on outcome=PASS or FAIL" }
      - { name: failure_reasons, type: array, source: input, default: [], description: "List of failure-reason codes when outcome=FAIL" }
      - { name: remediation_required_by, type: datetime, source: system, description: "Deadline for contractor remediation (set on FAIL)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RECORDED | VOID" }

  - name: IncentivePayment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: payee_role, type: enum, source: input, description: "CONTRACTOR | CUSTOMER" }
      - { name: payee_id, type: string, source: input, description: "Polymorphic FK — contractor_id when payee_role=CONTRACTOR, customer_id when payee_role=CUSTOMER" }
      - { name: amount_cents, type: integer, source: computed, description: "Final incentive amount; see calc incentive_final_amount" }
      - { name: amount_provisional_cents, type: integer, source: computed, description: "Provisional amount issued at Project.APPROVED time" }
      - { name: reconciliation_delta_cents, type: integer, source: computed, default: 0, description: "Difference final - provisional, posted at Project.COMPLETED" }
      - { name: status, type: enum, source: system, description: "DRAFT | AUTHORIZED | PAID | RECONCILED | VOID" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; may be null for general-service complaints" }
      - { name: category, type: enum, source: input, description: "WORKMANSHIP | SCHEDULING | BILLING | CONDUCT | OTHER" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | RESOLVED | ESCALATED" }

  - name: CostEffectivenessReport
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end (exclusive)" }
      - { name: total_incentive_paid_cents, type: integer, source: computed, description: "Sum of IncentivePayment.amount_cents in state PAID or RECONCILED for projects of this program within period" }
      - { name: total_admin_cost_cents, type: integer, source: input, description: "Administrative overhead allocated to this program for the period" }
      - { name: total_avoided_kwh, type: integer, source: computed, description: "Sum of estimated_annual_kwh_savings across projects COMPLETED in period" }
      - { name: trc_ratio, type: number, source: computed, description: "Total Resource Cost ratio = (NPV avoided-cost benefit) / (incentive + admin + customer incremental cost)" }
      - { name: trc_flag, type: enum, source: computed, description: "PASS | MARGINAL | FAIL — derived from trc_ratio vs program.trc_threshold" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINAL" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /efficiency/programs/{program_id}/activate"
        actor: ProgramManager
        preconditions:
          - "budget_cents > 0"
          - "trc_threshold is set"
        side_effects:
          - "Program is eligible for Lead creation and Project approval"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /efficiency/programs/{program_id}/suspend"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Blocks new Lead creation and new Project approval for this program"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /efficiency/programs/{program_id}/activate"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /efficiency/programs/{program_id}/close"
        actor: ProgramManager
        preconditions:
          - "No Project in states PROPOSED, APPROVED, SCHEDULED, INSTALLED, INSPECTING, REMEDIATION for this program"
        side_effects:
          - "Freezes budget metrics"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /efficiency/programs/{program_id}/close"
        actor: ProgramManager
        preconditions:
          - "No Project in states PROPOSED, APPROVED, SCHEDULED, INSTALLED, INSPECTING, REMEDIATION for this program"
        side_effects: []

  - entity: Contractor
    initial_state: APPLIED
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /efficiency/contractors/{contractor_id}/approve"
        actor: ProgramManager
        preconditions:
          - "Contractor has at least one ACTIVE Certification"
        side_effects:
          - "Contractor eligible to receive Lead distribution"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /efficiency/contractors/{contractor_id}/suspend"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Contractor excluded from future Lead distribution"
          - "Cascade: any Lead in state OFFERED assigned to this contractor transitions to EXPIRED (auto)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /efficiency/contractors/{contractor_id}/reinstate"
        actor: ProgramManager
        preconditions:
          - "Contractor has at least one ACTIVE Certification"
        side_effects: []
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /efficiency/contractors/{contractor_id}/terminate"
        actor: ProgramManager
        preconditions:
          - "No WorkOrder in states SCHEDULED or IN_PROGRESS for this contractor"
        side_effects:
          - "Cascade: any Lead in state NEW or OFFERED assigned to this contractor transitions to WITHDRAWN"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /efficiency/contractors/{contractor_id}/terminate"
        actor: ProgramManager
        preconditions:
          - "No WorkOrder in states SCHEDULED or IN_PROGRESS for this contractor"
        side_effects:
          - "Cascade: any Lead in state NEW or OFFERED assigned to this contractor transitions to WITHDRAWN"

  - entity: Certification
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when _clock reaches expires_on; swept by POST /efficiency/_clock/set_current_utc)"
        actor: system
        preconditions: []
        side_effects:
          - "Decrements Contractor.active_certification_count by 1"
          - "If Contractor.active_certification_count reaches 0 AND Contractor.status == APPROVED: auto-transition Contractor to SUSPENDED"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /efficiency/certifications/{certification_id}/revoke"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Decrements Contractor.active_certification_count by 1"
          - "If Contractor.active_certification_count reaches 0 AND Contractor.status == APPROVED: auto-transition Contractor to SUSPENDED"

  - entity: Lead
    initial_state: NEW
    terminal_states: [EXPIRED, WITHDRAWN]
    transitions:
      - from: NEW
        to: OFFERED
        trigger: "POST /efficiency/leads/{lead_id}/distribute"
        actor: ProgramManager
        preconditions:
          - "Program.status == ACTIVE"
          - "At least one Contractor eligible per selector: status==APPROVED, sector matches, service_zip_codes contains Lead.customer.service_zip, has ACTIVE Certification for Lead.measure_type"
        side_effects:
          - "Sets Lead.assigned_contractor_id via selector ranking (highest qa_score_bps; tie-break: lowest complaint_count_90d; then earliest Contractor.created_at)"
          - "Records distribution_decision with candidate_count, ranking_key, tie_break_used"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /efficiency/leads/{lead_id}/accept"
        actor: Contractor
        preconditions:
          - "Acting contractor id == Lead.assigned_contractor_id"
          - "Contractor.status == APPROVED"
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "system (auto on Contractor suspension via cascade, or POST /efficiency/leads/{lead_id}/expire)"
        actor: system
        preconditions: []
        side_effects:
          - "Clears Lead.assigned_contractor_id"
      - from: NEW
        to: WITHDRAWN
        trigger: "POST /efficiency/leads/{lead_id}/withdraw"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /efficiency/leads/{lead_id}/withdraw"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Clears Lead.assigned_contractor_id"

  - entity: Project
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /efficiency/projects/{project_id}/approve"
        actor: ProgramManager
        preconditions:
          - "Lead.status == ACCEPTED"
          - "Program.status == ACTIVE"
          - "Contractor.status == APPROVED"
          - "Contractor has ACTIVE Certification for Project.measure_type"
          - "Program.committed_cents + provisional incentive_amount_cents <= Program.budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "Computes Project.incentive_amount_provisional_cents via calc project_incentive_amount (PROVISIONAL variant)"
          - "Sets Project.incentive_amount_cents = Project.incentive_amount_provisional_cents"
          - "Snapshots Project.approval_snapshot_contractor_qa_bps = Contractor.qa_score_bps"
          - "Increments Program.committed_cents by incentive_amount_cents"
          - "Increments Program.version by 1"
          - "Creates IncentivePayment in state DRAFT with payee_role = Project.incentive_recipient, amount_provisional_cents = Project.incentive_amount_provisional_cents"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /efficiency/projects/{project_id}/work_orders (first WorkOrder creation)"
        actor: Contractor
        preconditions:
          - "Acting contractor id == Project.contractor_id"
        side_effects:
          - "Creates WorkOrder with status SCHEDULED (when direct_install=false) or DRAFT (when direct_install=true awaiting crew assignment)"
      - from: SCHEDULED
        to: INSTALLED
        trigger: "POST /efficiency/work_orders/{work_order_id}/complete (transitions WorkOrder to COMPLETED; Project auto-advances)"
        actor: Contractor
        preconditions:
          - "Acting contractor id == WorkOrder.contractor_id"
        side_effects:
          - "Sets WorkOrder.completed_on to current clock"
          - "Recomputes Contractor.on_time_installs / late_installs"
          - "Project transitions to INSTALLED"
          - "System selects an Inspector for the INSTALLED WorkOrder: filter Inspector.status==ACTIVE AND WorkOrder.contractor_id NOT IN Inspector.excluded_contractor_ids; rank by earliest Inspector.created_at; assign to WorkOrder.assigned_inspector_id; raise ERR_NO_INSPECTOR_AVAILABLE if no candidate"
      - from: INSTALLED
        to: INSPECTING
        trigger: "POST /efficiency/inspections (creates Inspection for the project; Project auto-advances)"
        actor: Inspector
        preconditions:
          - "Project has at least one WorkOrder in state COMPLETED"
          - "Acting inspector id == WorkOrder.assigned_inspector_id"
        side_effects:
          - "Creates Inspection with status SCHEDULED, outcome PENDING"
      - from: INSPECTING
        to: COMPLETED
        trigger: "POST /efficiency/inspections/{inspection_id}/record with outcome=PASS"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "Acting inspector id == Inspection.inspector_id"
        side_effects:
          - "Sets Inspection.outcome=PASS, score_bps per payload, status=RECORDED"
          - "Recomputes Contractor.qa_score_bps via rolling window over last qa_window_size recorded inspections"
          - "Project transitions to COMPLETED"
          - "Finalizes IncentivePayment: calc incentive_final_amount (FINAL variant); sets amount_cents; computes reconciliation_delta_cents = amount_cents - amount_provisional_cents; transitions payment DRAFT -> AUTHORIZED"
          - "Increments Program.avoided_kwh_actual by Project.estimated_annual_kwh_savings"
      - from: INSPECTING
        to: REMEDIATION
        trigger: "POST /efficiency/inspections/{inspection_id}/record with outcome=FAIL"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "Acting inspector id == Inspection.inspector_id"
          - "failure_reasons must be non-empty when outcome=FAIL"
        side_effects:
          - "Sets Inspection.outcome=FAIL, score_bps per payload, status=RECORDED"
          - "Sets Inspection.remediation_required_by = current_clock + REMEDIATION_WINDOW_DAYS"
          - "Recomputes Contractor.qa_score_bps via rolling window (including this FAIL)"
          - "Project transitions to REMEDIATION"
          - "If Contractor.qa_score_bps < QA_SUSPENSION_THRESHOLD_BPS: auto-transition Contractor to SUSPENDED (with Lead cascade)"
      - from: REMEDIATION
        to: INSPECTING
        trigger: "POST /efficiency/inspections (re-inspection after remediation work; Project auto-returns to INSPECTING)"
        actor: Inspector
        preconditions:
          - "Acting inspector id == WorkOrder.assigned_inspector_id"
          - "Current clock <= Inspection.remediation_required_by (from the most recent RECORDED FAIL inspection)"
        side_effects:
          - "Creates new Inspection with status SCHEDULED, outcome PENDING"
      - from: REMEDIATION
        to: CANCELLED
        trigger: "POST /efficiency/projects/{project_id}/cancel"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Voids IncentivePayment (status DRAFT or AUTHORIZED -> VOID)"
          - "Decrements Program.committed_cents by Project.incentive_amount_cents"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /efficiency/projects/{project_id}/cancel"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /efficiency/projects/{project_id}/cancel"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Voids IncentivePayment (status DRAFT -> VOID)"
          - "Decrements Program.committed_cents by Project.incentive_amount_cents"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /efficiency/projects/{project_id}/cancel"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Cascades WorkOrder cancellation (any SCHEDULED/DRAFT WorkOrder -> CANCELLED)"
          - "Voids IncentivePayment (status DRAFT -> VOID)"
          - "Decrements Program.committed_cents by Project.incentive_amount_cents"

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /efficiency/work_orders/{work_order_id}/schedule"
        actor: Contractor
        preconditions:
          - "Acting contractor id == WorkOrder.contractor_id"
          - "No temporal overlap with existing SCHEDULED/IN_PROGRESS WorkOrders for same contractor on the same date (per contractor_calendar_overlap rule)"
        side_effects: []
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /efficiency/work_orders/{work_order_id}/start"
        actor: Contractor
        preconditions:
          - "Acting contractor id == WorkOrder.contractor_id"
          - "Current clock date == scheduled_on date (no early starts)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /efficiency/work_orders/{work_order_id}/complete"
        actor: Contractor
        preconditions:
          - "Acting contractor id == WorkOrder.contractor_id"
        side_effects:
          - "Sets completed_on to current clock"
          - "Recomputes Contractor.on_time_installs / late_installs"
          - "Triggers Project transition SCHEDULED -> INSTALLED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /efficiency/work_orders/{work_order_id}/cancel"
        actor: Contractor
        preconditions:
          - "Acting contractor id == WorkOrder.contractor_id"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /efficiency/work_orders/{work_order_id}/cancel"
        actor: Contractor
        preconditions:
          - "Acting contractor id == WorkOrder.contractor_id"
        side_effects: []

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [RECORDED, VOID]
    transitions:
      - from: SCHEDULED
        to: RECORDED
        trigger: "POST /efficiency/inspections/{inspection_id}/record"
        actor: Inspector
        preconditions:
          - "Acting inspector id == Inspection.inspector_id"
          - "outcome is PASS or FAIL"
          - "score_bps in [0, 10000]"
          - "failure_reasons non-empty iff outcome == FAIL"
        side_effects:
          - "Triggers Project transition (see Project state machine)"
          - "Recomputes Contractor.qa_score_bps"
      - from: SCHEDULED
        to: VOID
        trigger: "POST /efficiency/inspections/{inspection_id}/void"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Does NOT trigger Project state change"

  - entity: IncentivePayment
    initial_state: DRAFT
    terminal_states: [RECONCILED, VOID]
    transitions:
      - from: DRAFT
        to: AUTHORIZED
        trigger: "system (auto on Project COMPLETED transition)"
        actor: system
        preconditions: []
        side_effects:
          - "Finalizes amount_cents via calc incentive_final_amount (FINAL variant)"
          - "Sets reconciliation_delta_cents = amount_cents - amount_provisional_cents"
      - from: AUTHORIZED
        to: PAID
        trigger: "POST /efficiency/incentive_payments/{payment_id}/disburse"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Increments Program.paid_cents by amount_provisional_cents (pay the provisional up front)"
      - from: PAID
        to: RECONCILED
        trigger: "POST /efficiency/incentive_payments/{payment_id}/reconcile"
        actor: ProgramManager
        preconditions:
          - "reconciliation_delta_cents != 0"
        side_effects:
          - "If delta > 0: increments Program.paid_cents by delta (top-up payment to reach final amount)"
          - "If delta < 0: decrements Program.paid_cents by |delta| (clawback to reach final amount)"
      - from: DRAFT
        to: VOID
        trigger: "system (auto on Project cancel) OR POST /efficiency/incentive_payments/{payment_id}/void"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: VOID
        trigger: "POST /efficiency/incentive_payments/{payment_id}/void"
        actor: ProgramManager
        preconditions: []
        side_effects: []

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /efficiency/complaints/{complaint_id}/start_review"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: RESOLVED
        trigger: "POST /efficiency/complaints/{complaint_id}/resolve"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Recomputes Contractor.complaint_count_90d (decrements once complaint is older than 90 days from created_at)"
      - from: IN_REVIEW
        to: ESCALATED
        trigger: "POST /efficiency/complaints/{complaint_id}/escalate"
        actor: ProgramManager
        preconditions:
          - "Complaint.severity is HIGH or CRITICAL"
        side_effects:
          - "If Contractor has 3+ ESCALATED complaints: auto-transition Contractor to SUSPENDED"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /efficiency/complaints/{complaint_id}/resolve"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: OPEN
        to: ESCALATED
        trigger: "POST /efficiency/complaints/{complaint_id}/escalate"
        actor: ProgramManager
        preconditions:
          - "Complaint.severity is HIGH or CRITICAL"
        side_effects:
          - "If Contractor has 3+ ESCALATED complaints: auto-transition Contractor to SUSPENDED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: project-approve-stale-program
    parent_entity: Program
    write_endpoint: "POST /efficiency/projects/{project_id}/approve"
    occ_field: "expected_program_version"
    description: |
      Approving a Project against a Program whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another approval has just committed budget against the same program,
      so the current writer's committed_cents view is stale and the budget
      check would be evaluated against a stale baseline.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: lead-distribute-stale-lead
    parent_entity: Lead
    write_endpoint: "POST /efficiency/leads/{lead_id}/distribute"
    occ_field: "expected_lead_version"
    description: |
      Distributing a Lead whose version has advanced since the client last
      observed it is rejected. This captures the case where a prior
      distribute action already assigned the lead to a contractor; the
      second writer's view of assigned_contractor_id is stale.
    error_id: ERR_STALE_LEAD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: project_incentive_amount
    trigger: "Runs at Project approve (PROVISIONAL variant) and again at Project COMPLETED (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      # Two-tier marginal incentive rate keyed on estimated_annual_kwh_savings.
      # Tier 1: first TIER1_KWH kWh at TIER1_RATE_PER_KWH_CENTS cents/kWh
      # Tier 2: kWh above TIER1_KWH at TIER2_RATE_PER_KWH_CENTS cents/kWh
      # Cap: result is clamped to INCENTIVE_CAP_CENTS.
      # PROVISIONAL variant uses estimated_annual_kwh_savings from Project at approval time.
      # FINAL variant uses estimated_annual_kwh_savings adjusted by measure_cost_cents factor
      # when measure_cost_cents exceeds MEASURE_COST_BASELINE_CENTS (penalize cost overruns):
      #   adjusted_savings = estimated_annual_kwh_savings * min(1.0, MEASURE_COST_BASELINE_CENTS / measure_cost_cents)
      # Round per variant:
      #   PROVISIONAL: floor to whole cents
      #   FINAL: round_half_up to whole cents
      inputs:
        savings_kwh = Project.estimated_annual_kwh_savings
        cost_cents = Project.measure_cost_cents
      if variant == FINAL and cost_cents > MEASURE_COST_BASELINE_CENTS:
        savings_kwh = savings_kwh * (MEASURE_COST_BASELINE_CENTS / cost_cents)
      tier1_kwh = min(savings_kwh, TIER1_KWH)
      tier2_kwh = max(0, savings_kwh - TIER1_KWH)
      raw_cents = tier1_kwh * TIER1_RATE_PER_KWH_CENTS + tier2_kwh * TIER2_RATE_PER_KWH_CENTS
      capped = min(raw_cents, INCENTIVE_CAP_CENTS)
      if variant == PROVISIONAL:
        return floor(capped)
      else:
        return round_half_up(capped)
    input_set: "Single Project in the approving/completing transition"
    constants:
      TIER1_KWH: 2000
      TIER1_RATE_PER_KWH_CENTS: 25
      TIER2_RATE_PER_KWH_CENTS: 12
      INCENTIVE_CAP_CENTS: 80000
      MEASURE_COST_BASELINE_CENTS: 500000
    precision: "whole cents; PROVISIONAL floor, FINAL round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Project transitions PROPOSED -> APPROVED"
        difference: "Uses raw estimated_annual_kwh_savings, no cost-overrun adjustment, floor rounding; result stored in Project.incentive_amount_provisional_cents"
      - name: FINAL
        when: "Project transitions INSPECTING -> COMPLETED"
        difference: "Applies cost-overrun adjustment to savings, round_half_up; result stored in IncentivePayment.amount_cents and Project.incentive_amount_cents"

  - name: incentive_final_amount
    trigger: "On Project COMPLETED transition; writes IncentivePayment.amount_cents and reconciliation_delta_cents"
    algorithm: aggregation
    formula: |
      final_cents = project_incentive_amount(PROJECT, variant=FINAL)
      reconciliation_delta_cents = final_cents - IncentivePayment.amount_provisional_cents
      amount_cents = final_cents
    input_set: "Project being completed + its IncentivePayment in state DRAFT"
    constants: {}
    precision: "whole cents, round_half_up for the underlying FINAL incentive"

  - name: contractor_qa_score
    trigger: "On Inspection RECORDED (PASS or FAIL) for a project of this contractor"
    algorithm: weighted_scoring
    formula: |
      # Rolling-window weighted average over the contractor's last W recorded inspections.
      # Weight is 1 for all inspections in window; window is the W most recent by recorded_at.
      # If fewer than W inspections recorded, use all recorded inspections.
      # Score is the arithmetic mean of score_bps, rounded half-up to integer bps.
      window = last W inspections for contractor where status==RECORDED, ordered by recorded_at DESC
      qa_score_bps = round_half_up( sum(inspection.score_bps for inspection in window) / len(window) )
    input_set: "Inspections for this contractor with status==RECORDED, regardless of outcome (both PASS and FAIL contribute their score_bps)"
    constants:
      W: 10
      QA_SUSPENSION_THRESHOLD_BPS: 5000
    precision: "integer basis points, round_half_up"

  - name: trc_cost_effectiveness
    trigger: "On POST /efficiency/reports (creating a CostEffectivenessReport in state DRAFT) and on POST /efficiency/reports/{id}/finalize"
    algorithm: threshold
    formula: |
      # Total Resource Cost test:
      #   numerator   = NPV avoided-cost benefit over MEASURE_LIFE_YEARS years, discounted at DISCOUNT_RATE
      #   denominator = total_incentive_paid_cents + total_admin_cost_cents + customer_incremental_cost_cents
      # where customer_incremental_cost_cents = sum over completed projects in period of
      #   max(0, measure_cost_cents - incentive_amount_cents)
      # Benefit is computed from avoided kWh priced at AVOIDED_COST_PER_KWH_CENTS, levelized over
      # MEASURE_LIFE_YEARS with end-of-year discounting:
      #   benefit_cents = sum over t=1..MEASURE_LIFE_YEARS of
      #     total_avoided_kwh * AVOIDED_COST_PER_KWH_CENTS / (1 + DISCOUNT_RATE)^t
      # Then trc_ratio = benefit_cents / denominator_cents (denominator must be > 0)
      # Precision: benefit_cents computed at 4 decimal places; trc_ratio rounded to 4 decimal places.
      # trc_flag = PASS   if trc_ratio >= program.trc_threshold
      #            MARGINAL if program.trc_threshold - 0.10 <= trc_ratio < program.trc_threshold
      #            FAIL    if trc_ratio < program.trc_threshold - 0.10
      pass
    input_set: "Projects of this program in state COMPLETED whose updated_at falls within [period_start, period_end); IncentivePayments for those projects in states PAID or RECONCILED"
    constants:
      MEASURE_LIFE_YEARS: 12
      DISCOUNT_RATE: 0.04
      AVOIDED_COST_PER_KWH_CENTS: 11
    precision: "trc_ratio to 4 decimal places, round_half_up; benefit_cents intermediate at 4 decimals"

  - name: lead_distribution_selector
    trigger: "On POST /efficiency/leads/{lead_id}/distribute"
    algorithm: constraint_propagation
    formula: |
      # Eligibility filter:
      #   Contractor.status == APPROVED
      #   Contractor.sector == Lead.program.sector
      #   Lead.customer.service_zip IN Contractor.service_zip_codes
      #   exists Certification for (contractor, Lead.measure_type) with status == ACTIVE
      # Ranking expression (descending priority):
      #   1. qa_score_bps DESC
      #   2. complaint_count_90d ASC
      #   3. Contractor.created_at ASC  (earliest-registered wins ties)
      # If candidate set is empty: raise ERR_NO_ELIGIBLE_CONTRACTOR.
      # Records distribution_decision object with candidate_count, ranking_key, tie_break_used.
      pass
    input_set: "All Contractors"
    constants: {}
    precision: "n/a (selector)"

  - name: contractor_calendar_overlap
    trigger: "On POST /efficiency/work_orders/{id}/schedule and on POST /efficiency/projects/{id}/work_orders (when direct_install=false)"
    algorithm: interval_merge
    formula: |
      # Two WorkOrders for the same contractor on the same calendar date conflict when their
      # [scheduled_on, scheduled_on + duration_hours) intervals overlap, treating intervals as
      # half-open [start, end). Adjacent intervals (one ends exactly when another starts) do NOT
      # conflict.
      # When direct_install == true, the WorkOrder is scheduled against the implementer's field
      # crew, not the contractor's calendar; no overlap check is applied against other contractor
      # WorkOrders.
      pass
    input_set: "WorkOrders for same contractor with status in {SCHEDULED, IN_PROGRESS}, direct_install == false"
    constants: {}
    precision: "half-open interval [start, end)"

  - name: complaint_recency_window
    trigger: "On every Complaint create / resolve / escalate, and on every read of Contractor"
    algorithm: decay_function
    formula: |
      # complaint_count_90d counts Complaints for this contractor where:
      #   status IN {OPEN, IN_REVIEW, ESCALATED}
      #   AND created_at >= (current_clock - 90 days)
      # RESOLVED complaints drop out of the count immediately upon resolution.
      # Expiry: as current_clock advances, complaints age out of the 90-day window.
      pass
    input_set: "Complaints for contractor in non-terminal states within rolling 90-day window"
    constants:
      WINDOW_DAYS: 90
    precision: "n/a (count)"

# =============================================================================
# §1.4 Validation Rules Table (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is authorized for the endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-referenced resource exists (program, contractor, lead, project, work_order, inspection, payment, complaint, report)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys exist (customer_id, contractor_id, program_id, lead_id, project_id, work_order_id, inspector_id, payee_id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC expected_*_version matches parent's current version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /efficiency/projects/{project_id}/approve"

  - priority: 6
    category: state
    check: "OCC expected_lead_version matches lead's current version"
    error_id: ERR_STALE_LEAD_VERSION
    http_status: 412
    applies_to: "POST /efficiency/leads/{lead_id}/distribute"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: acting Inspector must NOT have the WorkOrder's contractor_id in their excluded_contractor_ids list (applies both at inspection-create and at inspection-record)"
    error_id: ERR_INSPECTOR_CONFLICT
    http_status: 422
    applies_to: "POST /efficiency/inspections, POST /efficiency/inspections/{id}/record, POST /efficiency/work_orders/{id}/complete"

  - priority: 8
    category: business_safety
    check: "Contractor has at least one ACTIVE Certification for the project/lead measure_type"
    error_id: ERR_CERTIFICATION_MISSING
    http_status: 422
    applies_to: "POST /efficiency/contractors/{id}/approve, POST /efficiency/contractors/{id}/reinstate, POST /efficiency/leads/{id}/distribute, POST /efficiency/projects/{id}/approve"

  - priority: 9
    category: business_safety
    check: "Program must be ACTIVE for lead creation, lead distribution, and project approval"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /efficiency/leads, POST /efficiency/leads/{id}/distribute, POST /efficiency/projects/{id}/approve"

  - priority: 10
    category: business_referential
    check: "Acting entity-backed user matches the resource owner (Contractor acting on own WorkOrder / Lead; Inspector acting on own Inspection)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /efficiency/leads/{id}/accept, POST /efficiency/work_orders/{id}/start, POST /efficiency/work_orders/{id}/complete, POST /efficiency/work_orders/{id}/cancel, POST /efficiency/inspections/{id}/record"

  - priority: 11
    category: business_constraint
    check: "WorkOrder schedule does not overlap with another SCHEDULED/IN_PROGRESS WorkOrder for the same contractor on the same date (half-open intervals; adjacency allowed)"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 422
    applies_to: "POST /efficiency/projects/{id}/work_orders, POST /efficiency/work_orders/{id}/schedule"

  - priority: 12
    category: business_constraint
    check: "Eligible-contractor selector returned at least one candidate"
    error_id: ERR_NO_ELIGIBLE_CONTRACTOR
    http_status: 422
    applies_to: "POST /efficiency/leads/{id}/distribute"

  - priority: 13
    category: business_constraint
    check: "Inspector available who is not excluded from the WorkOrder's contractor"
    error_id: ERR_NO_INSPECTOR_AVAILABLE
    http_status: 422
    applies_to: "POST /efficiency/work_orders/{id}/complete"

  - priority: 14
    category: business_temporal
    check: "WorkOrder start: current clock date == scheduled_on date (no early starts)"
    error_id: ERR_START_TOO_EARLY
    http_status: 422
    applies_to: "POST /efficiency/work_orders/{id}/start"

  - priority: 15
    category: business_temporal
    check: "Re-inspection request must occur on or before the prior FAIL inspection's remediation_required_by"
    error_id: ERR_REMEDIATION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /efficiency/inspections (when project is in REMEDIATION)"

  - priority: 16
    category: business_temporal
    check: "Complaint escalate requires severity in {HIGH, CRITICAL}"
    error_id: ERR_SEVERITY_TOO_LOW
    http_status: 422
    applies_to: "POST /efficiency/complaints/{id}/escalate"

  - priority: 17
    category: business_fiscal
    check: "Project approval: Program.committed_cents + provisional incentive_amount_cents <= Program.budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /efficiency/projects/{id}/approve"

  - priority: 18
    category: business_fiscal
    check: "IncentivePayment reconcile: reconciliation_delta_cents != 0"
    error_id: ERR_NOTHING_TO_RECONCILE
    http_status: 422
    applies_to: "POST /efficiency/incentive_payments/{id}/reconcile"

  - priority: 19
    category: business_constraint
    check: "Inspection record payload: outcome is PASS or FAIL; score_bps in [0, 10000]; failure_reasons non-empty iff outcome==FAIL"
    error_id: ERR_INVALID_INSPECTION_PAYLOAD
    http_status: 400
    applies_to: "POST /efficiency/inspections/{id}/record"

  - priority: 20
    category: business_constraint
    check: "Program close: no Project in non-terminal states for this program"
    error_id: ERR_PROGRAM_HAS_OPEN_PROJECTS
    http_status: 422
    applies_to: "POST /efficiency/programs/{id}/close"

  - priority: 21
    category: business_constraint
    check: "Contractor terminate: no WorkOrder in SCHEDULED or IN_PROGRESS for this contractor"
    error_id: ERR_CONTRACTOR_BUSY
    http_status: 422
    applies_to: "POST /efficiency/contractors/{id}/terminate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/efficiency/_clock/set_current_utc"
    description: "Advance the server's logical clock to the given UTC ISO-8601 timestamp. Server starts at default 2026-08-01T00:00:00Z before any set call; never falls back to wall-clock. Side effect: sweep Certifications whose expires_on <= new clock, transitioning them ACTIVE -> EXPIRED."
    roles: [ProgramManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: "string", certifications_expired: "integer" }
    side_effects:
      - "Certification sweep (ACTIVE -> EXPIRED for those with expires_on <= to_iso8601)"
      - "Cascaded Contractor suspension when active_certification_count drops to 0"

  # --- Programs ---
  - method: POST
    path: "/efficiency/programs"
    description: "Create a Program in DRAFT"
    roles: [ProgramManager]
    code: 201
    input: [code, name, sector, budget_cents, avoided_kwh_target, trc_threshold]
    output: Program
    side_effects: []

  - method: GET
    path: "/efficiency/programs"
    description: "List programs with pagination"
    roles: [ProgramManager, Contractor, Inspector, Customer]
    code: 200
    input: ["limit?", "offset?", "status?", "sector?"]
    output: "Program[]"
    side_effects: []

  - method: GET
    path: "/efficiency/programs/{program_id}"
    description: "Get one program"
    roles: [ProgramManager, Contractor, Inspector, Customer]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: POST
    path: "/efficiency/programs/{program_id}/activate"
    description: "Activate or reinstate a program"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Program
    side_effects: ["Program DRAFT -> ACTIVE or SUSPENDED -> ACTIVE"]

  - method: POST
    path: "/efficiency/programs/{program_id}/suspend"
    description: "Suspend a program"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Program
    side_effects: ["Program ACTIVE -> SUSPENDED"]

  - method: POST
    path: "/efficiency/programs/{program_id}/close"
    description: "Close a program (no open projects)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Program
    side_effects: ["Program ACTIVE|SUSPENDED -> CLOSED"]

  # --- Contractors ---
  - method: POST
    path: "/efficiency/contractors"
    description: "Register a contractor (state APPLIED)"
    roles: [ProgramManager]
    code: 201
    input: [legal_name, license_number, sector, service_zip_codes]
    output: Contractor
    side_effects: []

  - method: GET
    path: "/efficiency/contractors"
    description: "List contractors"
    roles: [ProgramManager, Inspector]
    code: 200
    input: ["limit?", "offset?", "status?", "sector?"]
    output: "Contractor[]"
    side_effects: []

  - method: GET
    path: "/efficiency/contractors/{contractor_id}"
    description: "Get one contractor (recomputes complaint_count_90d against current clock)"
    roles: [ProgramManager, Contractor, Inspector]
    code: 200
    input: []
    output: Contractor
    side_effects: ["Refresh complaint_count_90d"]

  - method: POST
    path: "/efficiency/contractors/{contractor_id}/approve"
    description: "Approve contractor (requires at least one ACTIVE certification)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Contractor
    side_effects: ["Contractor APPLIED -> APPROVED"]

  - method: POST
    path: "/efficiency/contractors/{contractor_id}/suspend"
    description: "Suspend contractor (cascades OFFERED leads to EXPIRED)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Contractor
    side_effects: ["Contractor APPROVED -> SUSPENDED", "Cascade OFFERED Leads -> EXPIRED"]

  - method: POST
    path: "/efficiency/contractors/{contractor_id}/reinstate"
    description: "Reinstate suspended contractor (requires ACTIVE certification)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Contractor
    side_effects: ["Contractor SUSPENDED -> APPROVED"]

  - method: POST
    path: "/efficiency/contractors/{contractor_id}/terminate"
    description: "Terminate contractor (no SCHEDULED/IN_PROGRESS WorkOrders)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Contractor
    side_effects: ["Contractor APPROVED|SUSPENDED -> TERMINATED", "Cascade NEW/OFFERED Leads -> WITHDRAWN"]

  # --- Certifications ---
  - method: POST
    path: "/efficiency/certifications"
    description: "Issue a certification to a contractor"
    roles: [ProgramManager]
    code: 201
    input: [contractor_id, measure_type, issued_on, expires_on]
    output: Certification
    side_effects: ["Increment Contractor.active_certification_count"]

  - method: GET
    path: "/efficiency/certifications"
    description: "List certifications"
    roles: [ProgramManager, Contractor, Inspector]
    code: 200
    input: ["limit?", "offset?", "contractor_id?", "measure_type?", "status?"]
    output: "Certification[]"
    side_effects: []

  - method: GET
    path: "/efficiency/certifications/{certification_id}"
    description: "Get one certification"
    roles: [ProgramManager, Contractor, Inspector]
    code: 200
    input: []
    output: Certification
    side_effects: []

  - method: POST
    path: "/efficiency/certifications/{certification_id}/revoke"
    description: "Revoke a certification (may cascade contractor suspension)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Certification
    side_effects: ["Certification ACTIVE -> REVOKED", "Decrement Contractor.active_certification_count", "Conditional cascade: Contractor APPROVED -> SUSPENDED when count reaches 0"]

  # --- Customers ---
  - method: POST
    path: "/efficiency/customers"
    description: "Register a customer"
    roles: [ProgramManager]
    code: 201
    input: [full_name, email, service_zip, sector, utility_account_id]
    output: Customer
    side_effects: []

  - method: GET
    path: "/efficiency/customers"
    description: "List customers"
    roles: [ProgramManager, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/efficiency/customers/{customer_id}"
    description: "Get one customer"
    roles: [ProgramManager, Contractor, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Leads ---
  - method: POST
    path: "/efficiency/leads"
    description: "Create a lead for a customer + program"
    roles: [ProgramManager]
    code: 201
    input: [customer_id, program_id, measure_type, estimated_annual_kwh_savings, source_channel]
    output: Lead
    side_effects: ["Lead created in NEW"]

  - method: GET
    path: "/efficiency/leads"
    description: "List leads"
    roles: [ProgramManager, Contractor]
    code: 200
    input: ["limit?", "offset?", "status?", "program_id?", "contractor_id?", "customer_id?", "assigned_contractor_id?"]
    output: "Lead[]"
    side_effects: []

  - method: GET
    path: "/efficiency/leads/{lead_id}"
    description: "Get one lead"
    roles: [ProgramManager, Contractor]
    code: 200
    input: []
    output: Lead
    side_effects: []

  - method: POST
    path: "/efficiency/leads/{lead_id}/distribute"
    description: "Run selector and assign lead to best contractor (OCC-guarded)"
    roles: [ProgramManager]
    code: 200
    input: [expected_lead_version]
    output: Lead
    side_effects: ["Lead NEW -> OFFERED", "Sets assigned_contractor_id, distribution_decision", "Increments Lead.version by 1"]

  - method: POST
    path: "/efficiency/leads/{lead_id}/accept"
    description: "Contractor accepts the offered lead"
    roles: [Contractor]
    code: 200
    input: []
    output: Lead
    side_effects: ["Lead OFFERED -> ACCEPTED"]

  - method: POST
    path: "/efficiency/leads/{lead_id}/expire"
    description: "Manually expire an OFFERED lead"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Lead
    side_effects: ["Lead OFFERED -> EXPIRED", "Clears assigned_contractor_id"]

  - method: POST
    path: "/efficiency/leads/{lead_id}/withdraw"
    description: "Withdraw a lead"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Lead
    side_effects: ["Lead NEW|OFFERED -> WITHDRAWN", "Clears assigned_contractor_id"]

  # --- Projects ---
  - method: POST
    path: "/efficiency/projects"
    description: "Create a project from an ACCEPTED lead"
    roles: [ProgramManager, Contractor]
    code: 201
    input: [lead_id, customer_id, contractor_id, program_id, measure_type, measure_cost_cents, estimated_annual_kwh_savings, incentive_recipient]
    output: Project
    side_effects: ["Project created in PROPOSED"]

  - method: GET
    path: "/efficiency/projects"
    description: "List projects"
    roles: [ProgramManager, Contractor, Customer]
    code: 200
    input: ["limit?", "offset?", "status?", "program_id?", "contractor_id?", "customer_id?", "lead_id?"]
    output: "Project[]"
    side_effects: []

  - method: GET
    path: "/efficiency/projects/{project_id}"
    description: "Get one project"
    roles: [ProgramManager, Contractor, Customer, Inspector]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/efficiency/projects/{project_id}/approve"
    description: "Approve project (computes provisional incentive; OCC on Program.version)"
    roles: [ProgramManager]
    code: 200
    input: [expected_program_version]
    output: Project
    side_effects:
      - "Project PROPOSED -> APPROVED"
      - "Compute incentive_amount_provisional_cents (PROVISIONAL variant)"
      - "Snapshot approval_snapshot_contractor_qa_bps"
      - "Program.committed_cents += incentive_amount_cents; Program.version += 1"
      - "Create IncentivePayment in DRAFT"

  - method: POST
    path: "/efficiency/projects/{project_id}/cancel"
    description: "Cancel project (cascades)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Project -> CANCELLED", "Cascade WorkOrder cancellation", "Void IncentivePayment if DRAFT or AUTHORIZED", "Decrement Program.committed_cents"]

  - method: POST
    path: "/efficiency/projects/{project_id}/work_orders"
    description: "Create a work order for an APPROVED project"
    roles: [Contractor]
    code: 201
    input: [contractor_id, scheduled_on, duration_hours, "direct_install?"]
    output: WorkOrder
    side_effects: ["Project APPROVED -> SCHEDULED", "WorkOrder created in SCHEDULED (direct_install=false) or DRAFT (direct_install=true)", "Validates contractor calendar overlap (skipped when direct_install=true)"]

  # --- Work Orders ---
  - method: GET
    path: "/efficiency/work_orders"
    description: "List work orders"
    roles: [ProgramManager, Contractor, Inspector]
    code: 200
    input: ["limit?", "offset?", "project_id?", "contractor_id?", "status?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: GET
    path: "/efficiency/work_orders/{work_order_id}"
    description: "Get one work order"
    roles: [ProgramManager, Contractor, Inspector]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/efficiency/work_orders/{work_order_id}/schedule"
    description: "Move DRAFT work order to SCHEDULED"
    roles: [Contractor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder DRAFT -> SCHEDULED"]

  - method: POST
    path: "/efficiency/work_orders/{work_order_id}/start"
    description: "Start work (requires current clock on scheduled date)"
    roles: [Contractor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder SCHEDULED -> IN_PROGRESS"]

  - method: POST
    path: "/efficiency/work_orders/{work_order_id}/complete"
    description: "Complete work order (auto-advances project; assigns inspector)"
    roles: [Contractor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder IN_PROGRESS -> COMPLETED", "Set completed_on", "Project SCHEDULED -> INSTALLED", "Select and assign Inspector"]

  - method: POST
    path: "/efficiency/work_orders/{work_order_id}/cancel"
    description: "Cancel a work order"
    roles: [Contractor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["WorkOrder DRAFT|SCHEDULED -> CANCELLED"]

  # --- Inspectors ---
  - method: POST
    path: "/efficiency/inspectors"
    description: "Register an inspector"
    roles: [ProgramManager]
    code: 201
    input: [full_name, license_number, "excluded_contractor_ids?"]
    output: Inspector
    side_effects: []

  - method: GET
    path: "/efficiency/inspectors"
    description: "List inspectors"
    roles: [ProgramManager, Inspector]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Inspector[]"
    side_effects: []

  - method: GET
    path: "/efficiency/inspectors/{inspector_id}"
    description: "Get one inspector"
    roles: [ProgramManager, Inspector]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  # --- Inspections ---
  - method: POST
    path: "/efficiency/inspections"
    description: "Schedule an inspection for a project (INSTALLED -> INSPECTING, or REMEDIATION -> INSPECTING re-inspection)"
    roles: [Inspector]
    code: 201
    input: [work_order_id, project_id, inspector_id, scheduled_on]
    output: Inspection
    side_effects: ["Project INSTALLED|REMEDIATION -> INSPECTING"]

  - method: GET
    path: "/efficiency/inspections"
    description: "List inspections"
    roles: [ProgramManager, Contractor, Inspector]
    code: 200
    input: ["limit?", "offset?", "project_id?", "work_order_id?", "inspector_id?", "outcome?", "status?"]
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/efficiency/inspections/{inspection_id}"
    description: "Get one inspection"
    roles: [ProgramManager, Contractor, Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: POST
    path: "/efficiency/inspections/{inspection_id}/record"
    description: "Record inspection outcome (PASS or FAIL)"
    roles: [Inspector]
    code: 200
    input: [outcome, score_bps, "failure_reasons?"]
    output: Inspection
    side_effects: ["Inspection SCHEDULED -> RECORDED", "Recompute Contractor.qa_score_bps", "On PASS: Project -> COMPLETED, finalize IncentivePayment DRAFT -> AUTHORIZED", "On FAIL: Project -> REMEDIATION, set remediation_required_by; if qa_score_bps < threshold cascade Contractor -> SUSPENDED"]

  - method: POST
    path: "/efficiency/inspections/{inspection_id}/void"
    description: "Void an inspection (no project state change)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Inspection
    side_effects: ["Inspection SCHEDULED -> VOID"]

  # --- Incentive Payments ---
  - method: GET
    path: "/efficiency/incentive_payments"
    description: "List incentive payments"
    roles: [ProgramManager, Contractor, Customer]
    code: 200
    input: ["limit?", "offset?", "project_id?", "payee_role?", "payee_id?", "status?"]
    output: "IncentivePayment[]"
    side_effects: []

  - method: GET
    path: "/efficiency/incentive_payments/{payment_id}"
    description: "Get one incentive payment"
    roles: [ProgramManager, Contractor, Customer]
    code: 200
    input: []
    output: IncentivePayment
    side_effects: []

  - method: POST
    path: "/efficiency/incentive_payments/{payment_id}/disburse"
    description: "Disburse an AUTHORIZED payment"
    roles: [ProgramManager]
    code: 200
    input: []
    output: IncentivePayment
    side_effects: ["IncentivePayment AUTHORIZED -> PAID", "Program.paid_cents += amount_cents"]

  - method: POST
    path: "/efficiency/incentive_payments/{payment_id}/reconcile"
    description: "Reconcile a PAID payment against its reconciliation_delta_cents"
    roles: [ProgramManager]
    code: 200
    input: []
    output: IncentivePayment
    side_effects: ["IncentivePayment PAID -> RECONCILED", "Adjust Program.paid_cents by delta"]

  - method: POST
    path: "/efficiency/incentive_payments/{payment_id}/void"
    description: "Void a DRAFT or AUTHORIZED payment"
    roles: [ProgramManager]
    code: 200
    input: []
    output: IncentivePayment
    side_effects: ["IncentivePayment DRAFT|AUTHORIZED -> VOID"]

  # --- Complaints ---
  - method: POST
    path: "/efficiency/complaints"
    description: "File a complaint"
    roles: [Customer, ProgramManager]
    code: 201
    input: [customer_id, contractor_id, "project_id?", category, severity, description]
    output: Complaint
    side_effects: ["Refresh Contractor.complaint_count_90d"]

  - method: GET
    path: "/efficiency/complaints"
    description: "List complaints"
    roles: [ProgramManager, Contractor, Customer]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "contractor_id?", "project_id?", "status?", "severity?"]
    output: "Complaint[]"
    side_effects: []

  - method: GET
    path: "/efficiency/complaints/{complaint_id}"
    description: "Get one complaint"
    roles: [ProgramManager, Contractor, Customer]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/efficiency/complaints/{complaint_id}/start_review"
    description: "Start review"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Complaint
    side_effects: ["Complaint OPEN -> IN_REVIEW"]

  - method: POST
    path: "/efficiency/complaints/{complaint_id}/resolve"
    description: "Resolve a complaint"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Complaint
    side_effects: ["Complaint IN_REVIEW|ESCALATED -> RESOLVED", "Refresh Contractor.complaint_count_90d"]

  - method: POST
    path: "/efficiency/complaints/{complaint_id}/escalate"
    description: "Escalate a HIGH/CRITICAL complaint"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Complaint
    side_effects: ["Complaint OPEN|IN_REVIEW -> ESCALATED", "If 3+ ESCALATED complaints for contractor: cascade Contractor -> SUSPENDED"]

  # --- Cost Effectiveness Reports ---
  - method: POST
    path: "/efficiency/reports"
    description: "Generate a cost-effectiveness report for a program + period"
    roles: [ProgramManager]
    code: 201
    input: [program_id, period_start, period_end, total_admin_cost_cents]
    output: CostEffectivenessReport
    side_effects: ["Compute total_incentive_paid_cents, total_avoided_kwh, trc_ratio, trc_flag"]

  - method: GET
    path: "/efficiency/reports"
    description: "List reports"
    roles: [ProgramManager]
    code: 200
    input: ["limit?", "offset?", "program_id?", "status?"]
    output: "CostEffectivenessReport[]"
    side_effects: []

  - method: GET
    path: "/efficiency/reports/{report_id}"
    description: "Get one report"
    roles: [ProgramManager]
    code: 200
    input: []
    output: CostEffectivenessReport
    side_effects: []

  - method: POST
    path: "/efficiency/reports/{report_id}/finalize"
    description: "Finalize a DRAFT report (locks computed fields)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: CostEffectivenessReport
    side_effects: ["CostEffectivenessReport DRAFT -> FINAL"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or empty X-User-Role / X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not authorized for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 404, condition: "Body-referenced FK does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state allowing the requested transition" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version does not match current Program.version" }
  - { id: ERR_STALE_LEAD_VERSION, http: 412, condition: "expected_lead_version does not match current Lead.version" }
  - { id: ERR_INSPECTOR_CONFLICT, http: 422, condition: "Assigned inspector has the work order's contractor in excluded_contractor_ids" }
  - { id: ERR_CERTIFICATION_MISSING, http: 422, condition: "Contractor lacks an ACTIVE certification for the required measure_type" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 422, condition: "Program is not in ACTIVE state for the requested operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting entity-backed user does not match the resource owner" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 422, condition: "WorkOrder overlaps another SCHEDULED/IN_PROGRESS WorkOrder for same contractor on same date" }
  - { id: ERR_NO_ELIGIBLE_CONTRACTOR, http: 422, condition: "No contractor satisfies the lead-distribution eligibility filter" }
  - { id: ERR_NO_INSPECTOR_AVAILABLE, http: 422, condition: "No active inspector available who is not excluded from this contractor" }
  - { id: ERR_START_TOO_EARLY, http: 422, condition: "Current clock date precedes scheduled_on date" }
  - { id: ERR_REMEDIATION_WINDOW_EXPIRED, http: 422, condition: "Re-inspection requested after remediation_required_by" }
  - { id: ERR_SEVERITY_TOO_LOW, http: 422, condition: "Escalate requires severity HIGH or CRITICAL" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Program.committed_cents + provisional incentive would exceed budget_cents" }
  - { id: ERR_NOTHING_TO_RECONCILE, http: 422, condition: "reconciliation_delta_cents is zero; nothing to reconcile" }
  - { id: ERR_INVALID_INSPECTION_PAYLOAD, http: 400, condition: "outcome/score_bps/failure_reasons violate inspection record constraints" }
  - { id: ERR_PROGRAM_HAS_OPEN_PROJECTS, http: 422, condition: "Program close requested while non-terminal projects exist" }
  - { id: ERR_CONTRACTOR_BUSY, http: 422, condition: "Contractor terminate requested while SCHEDULED/IN_PROGRESS work orders exist" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramManager
    description: "Program implementer operations staff; manages programs, contractors, leads, projects, payments, complaints, reports"
    identity: opaque
    exclusive_operations:
      - "POST /efficiency/_clock/set_current_utc"
      - "POST /efficiency/programs (and activate/suspend/close)"
      - "POST /efficiency/contractors (and approve/suspend/reinstate/terminate)"
      - "POST /efficiency/certifications (and revoke)"
      - "POST /efficiency/customers"
      - "POST /efficiency/leads (and distribute/expire/withdraw)"
      - "POST /efficiency/projects/{id}/approve"
      - "POST /efficiency/projects/{id}/cancel"
      - "POST /efficiency/inspectors"
      - "POST /efficiency/inspections/{id}/void"
      - "POST /efficiency/incentive_payments/{id}/disburse|reconcile|void"
      - "POST /efficiency/complaints/{id}/start_review|resolve|escalate"
      - "POST /efficiency/reports (and finalize)"
    shared_operations:
      - "GET endpoints across all resources"
      - "POST /efficiency/complaints (shared with Customer)"
      - "POST /efficiency/projects (shared with Contractor)"

  - name: Contractor
    description: "Trade ally firm performing installations"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /efficiency/leads/{id}/accept"
      - "POST /efficiency/projects/{id}/work_orders"
      - "POST /efficiency/work_orders/{id}/schedule|start|complete|cancel"
    shared_operations:
      - "GET endpoints for own contractor record, own leads, own projects, own work orders, inspections, payments, complaints, certifications"
      - "POST /efficiency/projects (shared with ProgramManager)"

  - name: Inspector
    description: "Independent quality inspector"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /efficiency/inspections"
      - "POST /efficiency/inspections/{id}/record"
    shared_operations:
      - "GET endpoints for inspections, inspectors, work orders, contractors, certifications, programs"

  - name: Customer
    description: "Utility customer receiving efficiency services"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints for own customer record, own projects, own payments, own complaints, programs"
      - "POST /efficiency/complaints (shared with ProgramManager)"
