              payload: {}
              as: RegistrarOperator
          trigger:
            - call: "POST /registrar/clearinghouse-batches"
              payload:
                report_period_start: "2026-08-01T00:00:00Z"
                report_period_end: "2026-09-01T00:00:00Z"
              as: RegistrarOperator
              captures: { cnt: $.data.order_count }
          assert:
            - "cnt == 1 (only the in-window order swept)"

      - name: rush_multiplier_constant_applied
        claim_type: constants_applied
        grounds: [calculations.fee_quote_provisional, entities.FeeSchedule.fields.rush_multiplier_bp]
        distinguishing_aspect: "rush_multiplier_bp is in basis points over a 10000 denominator; 15000 bp = 1.5x. Verified by the quoted fee matching the expected product exactly."
        test_recipe:
          setup:
            - "FeeSchedule with rush_multiplier_bp=15000, rush_flat_cents=0"
            - "Rush-qualified order with subtotal 2000 (2 copies x 1000)"
          setup_api_calls:
