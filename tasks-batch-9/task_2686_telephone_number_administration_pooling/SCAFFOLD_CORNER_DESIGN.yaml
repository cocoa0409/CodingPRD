      - name: duplicate_block_label_on_a_second_block_create
        claim_type: Violation → Error
        grounds: ["errors[ERR_DUPLICATE_BLOCK_LABEL]", "validations[priority=25]", "entities.NumberBlock.fields.block_label"]
        distinguishing_aspect: "Uniqueness is on the composed label - npa_code plus nxx_code plus thousands_digit - not on the row's own inputs, so a second 614-555-0 is refused even when it is filed against a different rate center under the same NPA."
