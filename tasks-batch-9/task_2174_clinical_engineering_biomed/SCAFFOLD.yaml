# =============================================================================
# Clinical Engineering & Biomedical Equipment Management — benchmark seed tables
# Difficulty band: BEYOND EXPERT (see complexity_profile.difficulty_band)
# =============================================================================

scenario: |
  2174. Clinical Engineering & Biomedical Equipment Management (hospital clinical
  engineering): equipment inventory & risk classification, preventive maintenance
  scheduling & completion rate compliance, work order intake & repair turnaround,
  recall/hazard alert matching to inventory, equipment loaner pool & rental during
  downtime, capital replacement planning by age/condition, vendor service contract
  vs in-house cost, network-connected device security coordination.

domain_name: clinical-engineering-biomed
api_prefix: /clinical-engineering

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at /clinical-engineering/<collection>/{id};
  # relationships are expressed exclusively through FK body fields and filtered
  # list endpoints. No nested ownership URLs.

  state_machine_shape: parallel
  # Device carries TWO independent state dimensions (operational_state x
  # security_state) on one row; WorkOrder is cyclic (verify FAIL -> IN_REPAIR,
  # parts-hold <-> resume); RecallNotice is branching fork-join (PUBLISHED ->
  # {MANDATORY_REMOVAL | MONITORING} -> CLOSED) with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Facility -> Department -> Device -> PMTask/WorkOrder
    - cross_aggregate      # ServiceContract (Vendor x DeviceModel) reaches into WorkOrder costing
    - polymorphic_free     # no polymorphic FKs; every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The technician who performs a repair may not verify it; peer roles otherwise
  # own disjoint resource types (SecurityOfficer owns findings + the device
  # security dimension, CEManager owns money/fiscal closure, DeptSteward owns
  # intake for its own department, VendorRep owns vendor-side repair completion).

  consistency_model: immediate

  difficulty_band: beyond_expert
  # Deliberately above the Expert band of SKILL.md 0.4: 12 entities, 52 endpoints,
  # 38 error codes, 8 calculations, 7 state machines. The extra surface is NOT
  # padding: every endpoint above the Expert ceiling is either a state-machine
  # action that a difficulty/corner instance drives, or an FK reverse-reachability
  # GET mandated by 1.5.

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Hospital / campus display name" }
      - { name: facility_code, type: string, source: input, description: "Short campus code", constraints: "unique across all Facility rows; 1-16 chars" }
      - { name: pm_compliance_target_pct, type: number, source: input, description: "Regulatory PM completion-rate target in percent, 2 decimals", constraints: "0.00 <= value <= 100.00" }
      - { name: ce_posture, type: enum, source: system, default: NORMAL, description: "Clinical-engineering operating posture gating child operations", constraints: "NORMAL | HEIGHTENED | LOCKDOWN" }
      - { name: pm_compliance_pct_strict, type: number, source: computed, default: 0.00, description: "Regulatory-denominator PM completion rate; recomputed only by POST /facilities/{id}/pm-audit" }
      - { name: pm_compliance_pct_operational, type: number, source: computed, default: 100.00, description: "Operational-denominator PM completion rate; recomputed only by POST /facilities/{id}/pm-audit" }
      - { name: pm_audit_index, type: integer, source: system, default: 0, description: "Monotonic counter of completed pm-audit runs" }
      - { name: open_class_i_recall_count, type: integer, source: computed, default: 0, description: "Count of RecallNotice rows with hazard_class == CLASS_I and status == MANDATORY_REMOVAL" }
      - { name: departments_on_hold_count, type: integer, source: computed, default: 0, description: "Count of Department rows under this facility with budget_state == ON_HOLD" }

  - name: Department
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning campus" }
      - { name: name, type: string, source: input, description: "Clinical department name" }
      - { name: cost_center_code, type: string, source: input, description: "Finance cost-center code" }
      - { name: downtime_budget_cents, type: integer, source: input, description: "Annual equipment-downtime budget ceiling in cents", constraints: "> 0" }
      - { name: downtime_spend_cents, type: integer, source: computed, default: 0, description: "Cumulative debits posted by POST /work-orders/{id}/close" }
      - { name: budget_state, type: enum, source: computed, default: OPEN, description: "Derived from downtime_spend_cents vs downtime_budget_cents", constraints: "OPEN | WARNING | ON_HOLD" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Service vendor legal name" }
      - { name: vendor_code, type: string, source: input, description: "Short vendor code" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Vendor list labor rate per hour in cents", constraints: ">= 0" }
      - { name: travel_flat_cents, type: integer, source: input, description: "Flat trip charge in cents added once per vendor repair", constraints: ">= 0" }
      - { name: security_attestation_on_file, type: boolean, source: input, default: false, description: "Whether the vendor has a current medical-device security attestation" }
      - { name: is_approved, type: boolean, source: input, default: true, description: "Whether the vendor is on the approved service list" }

  - name: DeviceModel
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer, type: string, source: input, description: "Manufacturer name" }
      - { name: model_number, type: string, source: input, description: "Manufacturer model number" }
      - { name: device_family, type: string, source: input, description: "Equipment family label, e.g. INFUSION_PUMP" }
      - { name: is_network_connected, type: boolean, source: input, default: false, description: "True when units of this model attach to the hospital network" }
      - { name: expected_life_years, type: integer, source: input, description: "Manufacturer expected useful life in whole years", constraints: "> 0" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Current like-for-like replacement cost in cents", constraints: "> 0" }

  - name: Device
    parent: Department
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; campus the unit is installed at" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; owning clinical department, also the cost centre charged at close" }
      - { name: device_model_id, type: string, source: input, description: "FK -> DeviceModel.id; catalogue model this unit instantiates" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial number" }
      - { name: lot_number, type: string, source: input, default: null, description: "Manufacturing lot, used for MODEL_AND_LOT recall matching" }
      - { name: acquisition_date, type: string, source: input, description: "Date placed in service, YYYY-MM-DD" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "Capitalised acquisition cost in cents", constraints: ">= 0" }
      - { name: function_code, type: integer, source: input, description: "Clinical-function weight of the equipment", constraints: "integer 1..10" }
      - { name: physical_risk_code, type: integer, source: input, description: "Physical-risk weight of a failure", constraints: "integer 1..5" }
      - { name: maintenance_requirement_code, type: integer, source: input, description: "Maintenance-burden weight", constraints: "integer 1..5" }
      - { name: condition_score, type: integer, source: input, default: 1, description: "Physical condition, 1 = as-new, 5 = end of life", constraints: "integer 1..5" }
      - { name: utilization_hours, type: integer, source: input, default: 0, description: "Cumulative run hours" }
      - { name: is_loaner_pool, type: boolean, source: input, default: false, description: "True when this unit is held in the loaner pool" }
      - { name: risk_score, type: integer, source: computed, default: 0, description: "Aggregate risk score, see calculations.device_risk_classification" }
      - { name: risk_class, type: enum, source: computed, default: LOW, description: "Risk band derived from risk_score", constraints: "CRITICAL | HIGH | MEDIUM | LOW" }
      - { name: pm_interval_days, type: integer, source: computed, default: 365, description: "PM cadence in days implied by risk_class" }
      - { name: operational_state, type: enum, source: system, default: IN_SERVICE, description: "Availability dimension of the device state machine", constraints: "IN_SERVICE | DOWN | ON_LOAN | RETIRED" }
      - { name: security_state, type: enum, source: system, default: UNASSESSED, description: "Cyber dimension of the device state machine, evolves independently of operational_state", constraints: "UNASSESSED | ASSESSED_OK | VULNERABLE | QUARANTINED | REMEDIATED" }
      - { name: recall_hold, type: boolean, source: system, default: false, description: "True while at least one RecallMatch on this device has disposition == PENDING" }
      - { name: lifetime_maintenance_cost_cents, type: integer, source: computed, default: 0, description: "Sum of final_cost_cents over WorkOrder rows on this device with status == CLOSED" }
      - { name: replacement_priority_score, type: number, source: computed, default: 0.00, description: "Capital replacement ranking score, 2 decimals, see calculations.replacement_priority_score" }
      - { name: plan_rank, type: integer, source: computed, default: 0, description: "1-based rank in the most recent replacement-plan read; 0 before any read" }
      - { name: plan_funded, type: boolean, source: computed, default: false, description: "Whether the most recent replacement-plan read with a fiscal budget funded this unit" }

  - name: PMTask
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; unit the PM is scheduled against" }
      - { name: window_start, type: datetime, source: input, description: "Current PM window opening instant, ISO 8601 UTC" }
      - { name: window_end, type: datetime, source: input, description: "Current PM window closing instant, ISO 8601 UTC", constraints: "must be strictly after window_start" }
      - { name: due_at, type: datetime, source: computed, description: "Current due instant; equals window_end and is rewritten by every defer" }
      - { name: original_due_at, type: datetime, source: computed, description: "window_end captured at creation; never rewritten, drives the compliance window" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "PM lifecycle state", constraints: "SCHEDULED | DEFERRED | COMPLETED | MISSED" }
      - { name: deferral_count, type: integer, source: system, default: 0, description: "Number of accepted defers; hard cap 2" }
      - { name: result, type: enum, source: system, default: null, description: "Outcome recorded at completion", constraints: "PASS | FAIL | PASS_WITH_DEFECT | null" }
      - { name: labor_minutes, type: integer, source: system, default: 0, description: "Technician minutes recorded on the complete call" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical clock instant of completion" }
      - { name: completed_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the completing BiomedTech; NOT a foreign key" }
      - { name: on_time, type: boolean, source: computed, default: false, description: "True when status == COMPLETED and completed_at <= original_due_at" }

  - name: WorkOrder
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; unit under repair" }
      - { name: vendor_id, type: string, source: system, default: null, description: "FK -> Vendor.id; set by assign when service_mode == VENDOR" }
      - { name: service_contract_id, type: string, source: system, default: null, description: "FK -> ServiceContract.id; contract selected at close, null when no contract covered the repair" }
      - { name: origin_security_finding_id, type: string, source: input, default: null, description: "FK -> SecurityFinding.id; set when the work order is opened to remediate a security finding" }
      - { name: reported_severity, type: enum, source: input, description: "Clinical severity reported at intake", constraints: "PATIENT_HARM | CLINICAL_IMPACT | ROUTINE" }
      - { name: problem_summary, type: string, source: input, description: "Free-text problem description" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock instant of intake" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "Repair lifecycle state", constraints: "INTAKE | IN_REPAIR | AWAITING_PARTS | REPAIR_COMPLETE | VERIFIED | CLOSED | CANCELLED" }
      - { name: priority, type: enum, source: computed, default: P3, description: "Response priority", constraints: "P1 | P2 | P3" }
      - { name: sla_hours, type: integer, source: computed, default: 72, description: "Active-repair hour allowance implied by priority" }
      - { name: service_mode, type: enum, source: system, default: null, description: "Who performs the repair", constraints: "IN_HOUSE | VENDOR | null" }
      - { name: assigned_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID recorded by assign; NOT a foreign key" }
      - { name: repaired_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the most recent complete-repair caller; NOT a foreign key" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the verifying caller; NOT a foreign key" }
      - { name: repair_started_at, type: datetime, source: system, default: null, description: "Clock instant of the first assign; pins the shift multiplier for the whole work order" }
      - { name: repair_completed_at, type: datetime, source: system, default: null, description: "Clock instant of the most recent complete-repair" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Clock instant of close or cancel" }
      - { name: active_repair_seconds, type: integer, source: computed, default: 0, description: "Accumulated seconds spent in IN_REPAIR only; AWAITING_PARTS spans are excluded" }
      - { name: active_repair_hours, type: number, source: computed, default: 0.00, description: "round_half_up(active_repair_seconds / 3600, 2)" }
      - { name: turnaround_hours, type: number, source: computed, default: 0.00, description: "round_half_up((closed_at - reported_at) / 3600, 2), wall-clock" }
      - { name: sla_met, type: boolean, source: computed, default: false, description: "True when active_repair_hours <= sla_hours at close" }
      - { name: labor_minutes, type: integer, source: system, default: 0, description: "Cumulative technician minutes across every complete-repair call" }
      - { name: parts_cost_cents, type: integer, source: system, default: 0, description: "Cumulative parts spend across every complete-repair call" }
      - { name: shift_multiplier_applied, type: number, source: computed, default: 1.0, description: "1.5 when repair_started_at UTC hour < 7 or >= 19, else 1.0" }
      - { name: estimated_cost_cents, type: integer, source: computed, default: 0, description: "Provisional list-rate cost computed at complete-repair" }
      - { name: final_cost_cents, type: integer, source: computed, default: 0, description: "Contract-adjusted cost computed at close" }
      - { name: department_charge_cents, type: integer, source: computed, default: 0, description: "Amount actually posted to Department.downtime_spend_cents at close" }
      - { name: verify_fail_count, type: integer, source: system, default: 0, description: "Number of verify calls that returned the order to IN_REPAIR" }
      - { name: loaner_status, type: enum, source: system, default: NONE, description: "Loaner coverage state of the downed unit", constraints: "NONE | COVERED | UNCOVERED" }

  - name: LoanerAssignment
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the repair this loaner covers" }
      - { name: loaner_device_id, type: string, source: input, default: null, description: "FK -> Device.id; the pool unit lent out. Null for source == RENTAL" }
      - { name: source, type: enum, source: input, description: "Where the substitute unit comes from", constraints: "POOL | RENTAL" }
      - { name: start_at, type: datetime, source: input, description: "Occupation interval start, ISO 8601 UTC" }
      - { name: end_at, type: datetime, source: input, description: "Planned occupation interval end, ISO 8601 UTC", constraints: "must be strictly after start_at" }
      - { name: returned_at, type: datetime, source: system, default: null, description: "Clock instant of return; null while DEPLOYED" }
      - { name: status, type: enum, source: system, default: DEPLOYED, description: "Loaner lifecycle state", constraints: "DEPLOYED | RETURNED | CANCELLED" }
      - { name: billable_days, type: integer, source: computed, default: 0, description: "ceil((returned_at - start_at) / 86400 s), minimum 1, computed at return; stays 0 for CANCELLED" }
      - { name: rental_cost_cents, type: integer, source: computed, default: 0, description: "Per-day-rounded rental total; always 0 for source == POOL and for CANCELLED rows" }

  - name: RecallNotice
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; campus whose inventory is scanned" }
      - { name: device_model_id, type: string, source: input, description: "FK -> DeviceModel.id; model named by the hazard alert" }
      - { name: source_reference, type: string, source: input, description: "Issuing authority reference, e.g. FDA-2026-1188" }
      - { name: hazard_class, type: enum, source: input, description: "Hazard severity band", constraints: "CLASS_I | CLASS_II | CLASS_III" }
      - { name: affected_lot_numbers, type: array, source: input, default: [], description: "Lot numbers named by the alert; empty array means the whole model is affected" }
      - { name: response_due_at, type: datetime, source: input, description: "Regulatory response deadline, ISO 8601 UTC" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Clock instant of publish" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Recall lifecycle state", constraints: "DRAFT | PUBLISHED | MANDATORY_REMOVAL | MONITORING | CLOSED" }
      - { name: matched_device_count, type: integer, source: computed, default: 0, description: "Number of RecallMatch rows created by publish" }
      - { name: pending_match_count, type: integer, source: computed, default: 0, description: "Number of RecallMatch rows on this notice with disposition == PENDING" }

  - name: RecallMatch
    parent: RecallNotice
    common_fields: true
    fields:
      - { name: recall_notice_id, type: string, source: system, description: "FK -> RecallNotice.id; the notice that produced this match" }
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; the matched inventory unit" }
      - { name: match_basis, type: enum, source: computed, description: "How the unit matched", constraints: "MODEL_ONLY | MODEL_AND_LOT" }
      - { name: disposition, type: enum, source: system, default: PENDING, description: "Per-unit recall disposition", constraints: "PENDING | REMOVED | REMEDIATED | EXEMPTED" }
      - { name: disposed_at, type: datetime, source: system, default: null, description: "Clock instant the disposition was recorded" }
      - { name: disposed_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the disposing caller; NOT a foreign key" }

  - name: ServiceContract
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; contracted service provider" }
      - { name: device_model_id, type: string, source: input, description: "FK -> DeviceModel.id; covered model" }
      - { name: coverage_start, type: datetime, source: input, description: "Coverage interval start, ISO 8601 UTC, INCLUSIVE" }
      - { name: coverage_end, type: datetime, source: input, description: "Coverage interval end, ISO 8601 UTC, INCLUSIVE", constraints: "must be strictly after coverage_start" }
      - { name: annual_premium_cents, type: integer, source: input, description: "Annual contract premium in cents", constraints: ">= 0" }
      - { name: deductible_cents, type: integer, source: input, description: "Flat per-event charge that replaces list-rate cost when the contract covers a repair", constraints: ">= 0" }
      - { name: covered_event_cap, type: integer, source: input, description: "Maximum number of repairs the contract absorbs", constraints: ">= 1" }
      - { name: covered_events_used, type: integer, source: computed, default: 0, description: "Number of closed work orders that consumed contract coverage" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Contract state", constraints: "ACTIVE | EXHAUSTED" }

  - name: SecurityFinding
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; affected network-connected unit" }
      - { name: severity, type: enum, source: input, description: "Advisory severity", constraints: "CRITICAL | HIGH | MEDIUM | LOW" }
      - { name: advisory_reference, type: string, source: input, description: "Advisory / CVE reference string" }
      - { name: requires_downtime, type: boolean, source: input, default: false, description: "Whether remediation needs the unit taken out of service" }
      - { name: discovered_at, type: datetime, source: system, description: "Clock instant the finding was filed" }
      - { name: remediation_due_at, type: datetime, source: computed, description: "discovered_at + REMEDIATION_SLA_DAYS[severity]" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Finding lifecycle state", constraints: "OPEN | REMEDIATION_SCHEDULED | MITIGATED | ACCEPTED_RISK" }
      - { name: resolution_note, type: string, source: system, default: null, description: "Free text recorded at resolve" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Clock instant of resolve" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Device — dimension 1 of 2 (availability). Evolves INDEPENDENTLY of
  # security_state; the two dimensions live on the same row.
  # ---------------------------------------------------------------------------
  - entity: Device
    dimension: operational_state
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: DOWN
        trigger: "POST /clinical-engineering/work-orders (intake on this device)"
        actor: DeptSteward | BiomedTech | CEManager | SecurityOfficer
        preconditions:
          - "device.operational_state != RETIRED"
        side_effects:
          - "WorkOrder created in INTAKE with priority and sla_hours from calculations.work_order_priority"
          - "device.updated_at refreshed, device.version incremented by 1"
        note: "Intake is also accepted from ON_LOAN and from DOWN (a second concurrent fault); the resulting operational_state is DOWN in every case."

      - from: ON_LOAN
        to: DOWN
        trigger: "POST /clinical-engineering/work-orders (intake on a unit currently lent out)"
        actor: DeptSteward | BiomedTech | CEManager | SecurityOfficer
        preconditions: ["device.operational_state != RETIRED"]
        side_effects: ["WorkOrder created in INTAKE", "device.version incremented by 1"]

      - from: IN_SERVICE
        to: ON_LOAN
        trigger: "POST /clinical-engineering/loaner-assignments with source == POOL selecting this unit"
        actor: CEManager | BiomedTech | DeptSteward
        preconditions:
          - "device.is_loaner_pool == true"
          - "device.recall_hold == false"
          - "device.security_state NOT IN {VULNERABLE, QUARANTINED}"
          - "if device_model.is_network_connected == true then device.security_state IN {ASSESSED_OK, REMEDIATED}"
          - "no LoanerAssignment on this device with status IN {DEPLOYED, RETURNED} whose occupancy interval overlaps the requested one (see validations priority 13)"
        side_effects:
          - "LoanerAssignment created in DEPLOYED"
          - "work_order.loaner_status set to COVERED"
          - "increments WorkOrder.version by 1 (OCC parent)"

      - from: ON_LOAN
        to: IN_SERVICE
        trigger: "POST /clinical-engineering/loaner-assignments/{id}/return"
        actor: CEManager | BiomedTech | DeptSteward
        preconditions: ["loaner_assignment.status == DEPLOYED"]
        side_effects:
          - "loaner_assignment.returned_at set to the logical clock"
          - "loaner_assignment.billable_days and rental_cost_cents computed (calculations.loaner_rental_cost)"
          - "loaner_assignment.status set to RETURNED"

      - from: DOWN
        to: IN_SERVICE
        trigger: "POST /clinical-engineering/work-orders/{id}/close or POST /clinical-engineering/work-orders/{id}/cancel"
        actor: CEManager | DeptSteward
        preconditions:
          - "no other WorkOrder on this device with status IN {INTAKE, IN_REPAIR, AWAITING_PARTS, REPAIR_COMPLETE, VERIFIED}"
          - "device.recall_hold == false"
          - "device.security_state != QUARANTINED"
        note: "Conditional cascade — when any of the three preconditions fails the unit stays DOWN and only the WorkOrder moves to its terminal state."
        side_effects: ["device.updated_at refreshed"]

      - from: DOWN
        to: IN_SERVICE
        trigger: "POST /clinical-engineering/security-findings/{id}/resolve with resolution == MITIGATED"
        actor: SecurityOfficer | CEManager
        preconditions:
          - "device.security_state == QUARANTINED"
          - "no WorkOrder on this device with status IN {INTAKE, IN_REPAIR, AWAITING_PARTS, REPAIR_COMPLETE, VERIFIED}"
        side_effects:
          - "device.security_state QUARANTINED -> REMEDIATED"
          - "security_finding.status -> MITIGATED"

      - from: ON_LOAN
        to: DOWN
        trigger: "system: this unit is matched by a published CLASS_I RecallNotice, or is quarantined"
        actor: system
        preconditions: ["device.operational_state IN {IN_SERVICE, ON_LOAN}"]
        side_effects:
          - "CASCADE LINK 3 of transitive_cascade.recall_class_i: every LoanerAssignment with loaner_device_id == this device and status == DEPLOYED transitions DEPLOYED -> CANCELLED with rental_cost_cents = 0 and billable_days = 0"

      - from: IN_SERVICE
        to: DOWN
        trigger: "system: CLASS_I recall match, CRITICAL SecurityFinding creation, or security_state -> QUARANTINED"
        actor: system
        preconditions: ["device.operational_state IN {IN_SERVICE, ON_LOAN}"]
        side_effects: ["device.version incremented by 1"]

      - from: DOWN
        to: RETIRED
        trigger: "POST /clinical-engineering/recall-matches/{id}/disposition with disposition == REMOVED"
        actor: CEManager | BiomedTech
        preconditions: ["recall_match.disposition == PENDING"]
        side_effects:
          - "recall_match.disposition -> REMOVED, disposed_at set"
          - "recall_notice.pending_match_count decremented by 1"
          - "device is excluded from every future recall scan, loaner candidate set and replacement plan"

      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /clinical-engineering/recall-matches/{id}/disposition with disposition == REMOVED"
        actor: CEManager | BiomedTech
        preconditions: ["recall_match.disposition == PENDING"]
        side_effects: ["recall_match.disposition -> REMOVED", "recall_notice.pending_match_count decremented by 1"]

  # ---------------------------------------------------------------------------
  # Device — dimension 2 of 2 (cyber). Cyclic; independent of operational_state.
  # ---------------------------------------------------------------------------
  - entity: Device
    dimension: security_state
    initial_state: UNASSESSED
    terminal_states: []
    transitions:
      - from: UNASSESSED
        to: ASSESSED_OK
        trigger: "POST /clinical-engineering/devices/{id}/security-state with to_state == ASSESSED_OK"
        actor: SecurityOfficer
        preconditions: ["no SecurityFinding on this device with status IN {OPEN, REMEDIATION_SCHEDULED}"]
        side_effects: ["operational_state is NOT touched"]

      - from: UNASSESSED
        to: VULNERABLE
        trigger: "POST /clinical-engineering/devices/{id}/security-state with to_state == VULNERABLE, or creation of a HIGH SecurityFinding"
        actor: SecurityOfficer
        preconditions: []
        side_effects: ["operational_state is NOT touched"]

      - from: ASSESSED_OK
        to: VULNERABLE
        trigger: "POST /clinical-engineering/devices/{id}/security-state with to_state == VULNERABLE, or creation of a HIGH SecurityFinding"
        actor: SecurityOfficer
        preconditions: []
        side_effects: ["device is removed from the loaner candidate set from this instant"]

      - from: VULNERABLE
        to: QUARANTINED
        trigger: "POST /clinical-engineering/devices/{id}/security-state with to_state == QUARANTINED, or creation of a CRITICAL SecurityFinding"
        actor: SecurityOfficer
        preconditions: []
        side_effects:
          - "operational_state IN_SERVICE|ON_LOAN -> DOWN"
          - "every DEPLOYED LoanerAssignment whose loaner_device_id is this device transitions to CANCELLED with rental_cost_cents = 0"
          - "each cancelled LoanerAssignment sets its WorkOrder.loaner_status = UNCOVERED and, when that WorkOrder.status IN {INTAKE, IN_REPAIR, AWAITING_PARTS}, WorkOrder.priority -> P1 and sla_hours -> 4"

      - from: VULNERABLE
        to: REMEDIATED
        trigger: "POST /clinical-engineering/devices/{id}/security-state with to_state == REMEDIATED"
        actor: SecurityOfficer
        preconditions: []
        side_effects: ["device re-enters the loaner candidate set"]

      - from: QUARANTINED
        to: REMEDIATED
        trigger: "POST /clinical-engineering/devices/{id}/security-state with to_state == REMEDIATED, or resolve of the quarantining SecurityFinding with resolution == MITIGATED"
        actor: SecurityOfficer | CEManager
        preconditions: []
        side_effects:
          - "operational_state DOWN -> IN_SERVICE when no non-terminal WorkOrder exists on the device and recall_hold == false"

      - from: REMEDIATED
        to: ASSESSED_OK
        trigger: "POST /clinical-engineering/devices/{id}/security-state with to_state == ASSESSED_OK"
        actor: SecurityOfficer
        preconditions: ["no SecurityFinding on this device with status IN {OPEN, REMEDIATION_SCHEDULED}"]
        side_effects: []
        note: "Closes the cyber cycle UNASSESSED -> ... -> REMEDIATED -> ASSESSED_OK -> VULNERABLE -> ..."

  # ---------------------------------------------------------------------------
  # WorkOrder — cyclic (parts-hold loop and verify-fail loop)
  # ---------------------------------------------------------------------------
  - entity: WorkOrder
    initial_state: INTAKE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: INTAKE
        to: IN_REPAIR
        trigger: "POST /clinical-engineering/work-orders/{id}/assign"
        actor: CEManager | BiomedTech
        preconditions:
          - "facility.ce_posture != LOCKDOWN"
          - "device.operational_state != RETIRED"
          - "when service_mode == VENDOR: vendor_id present, Vendor exists and vendor.is_approved == true"
        side_effects:
          - "repair_started_at set to the logical clock; shift_multiplier_applied pinned from its UTC hour"
          - "assigned_user_id set to X-User-ID; service_mode and vendor_id recorded"
          - "active-repair segment opened at the logical clock"
          - "increments WorkOrder.version by 1"

      - from: IN_REPAIR
        to: AWAITING_PARTS
        trigger: "POST /clinical-engineering/work-orders/{id}/parts-hold"
        actor: CEManager | BiomedTech
        preconditions: ["work_order.status == IN_REPAIR"]
        side_effects:
          - "open active-repair segment closed; active_repair_seconds += (clock - segment_start)"
          - "increments WorkOrder.version by 1"

      - from: AWAITING_PARTS
        to: IN_REPAIR
        trigger: "POST /clinical-engineering/work-orders/{id}/resume"
        actor: CEManager | BiomedTech
        preconditions: ["work_order.status == AWAITING_PARTS"]
        side_effects: ["new active-repair segment opened at the logical clock", "increments WorkOrder.version by 1"]
        note: "Cycle 1 — IN_REPAIR <-> AWAITING_PARTS may repeat any number of times."

      - from: IN_REPAIR
        to: REPAIR_COMPLETE
        trigger: "POST /clinical-engineering/work-orders/{id}/complete-repair"
        actor: BiomedTech | VendorRep
        preconditions:
          - "work_order.status == IN_REPAIR"
          - "when service_mode == VENDOR: X-User-Role == VendorRep implies X-User-ID == work_order.vendor_id"
        side_effects:
          - "labor_minutes and parts_cost_cents ACCUMULATE (+=) across repeated calls"
          - "open active-repair segment closed; active_repair_seconds accumulated"
          - "repaired_by_user_id set to X-User-ID; repair_completed_at set to the logical clock"
          - "estimated_cost_cents recomputed from the cumulative totals (calculations.work_order_service_cost, provisional variant)"
          - "increments WorkOrder.version by 1"

      - from: REPAIR_COMPLETE
        to: IN_REPAIR
        trigger: "POST /clinical-engineering/work-orders/{id}/verify with result == FAIL"
        actor: BiomedTech | CEManager
        preconditions:
          - "work_order.status == REPAIR_COMPLETE"
          - "X-User-ID != work_order.repaired_by_user_id (segregation of duties)"
        side_effects:
          - "verify_fail_count incremented by 1"
          - "new active-repair segment opened at the logical clock"
          - "shift_multiplier_applied is NOT recomputed — it stays pinned to the first assign"
          - "increments WorkOrder.version by 1"
        note: "Cycle 2 — a failed QA returns the order to IN_REPAIR."

      - from: REPAIR_COMPLETE
        to: VERIFIED
        trigger: "POST /clinical-engineering/work-orders/{id}/verify with result == PASS"
        actor: BiomedTech | CEManager
        preconditions:
          - "work_order.status == REPAIR_COMPLETE"
          - "X-User-ID != work_order.repaired_by_user_id (segregation of duties)"
        side_effects: ["verified_by_user_id set to X-User-ID", "increments WorkOrder.version by 1"]

      - from: VERIFIED
        to: CLOSED
        trigger: "POST /clinical-engineering/work-orders/{id}/close"
        actor: CEManager
        preconditions:
          - "work_order.status == VERIFIED"
          - "expected_department_version matches Department.version (OCC)"
          - "no LoanerAssignment on this work order with status == DEPLOYED"
        side_effects:
          - "service contract selected (calculations.contract_selection); final_cost_cents computed (calculations.work_order_service_cost, final variant)"
          - "when a contract covers the repair: service_contract_id set, contract.covered_events_used += 1, contract auto-transitions ACTIVE -> EXHAUSTED once covered_events_used == covered_event_cap"
          - "CASCADE LINK 1 of transitive_cascade.close_debit: department_charge_cents computed (calculations.department_downtime_debit) and added to Department.downtime_spend_cents; increments Department.version by 1"
          - "CASCADE LINK 2: the new Department.downtime_spend_cents re-derives Department.budget_state (OPEN | WARNING | ON_HOLD)"
          - "CASCADE LINK 3: a Department entering ON_HOLD increments Facility.departments_on_hold_count and, when that count moves 0 -> 1 and ce_posture == NORMAL, sets Facility.ce_posture = HEIGHTENED"
          - "device.lifetime_maintenance_cost_cents += final_cost_cents and device.replacement_priority_score recomputed"
          - "closed_at, turnaround_hours, active_repair_hours and sla_met computed"
          - "device.operational_state DOWN -> IN_SERVICE subject to the conditional-cascade preconditions above"

      - from: INTAKE
        to: CANCELLED
        trigger: "POST /clinical-engineering/work-orders/{id}/cancel"
        actor: CEManager | DeptSteward
        preconditions: ["work_order.status IN {INTAKE, IN_REPAIR, AWAITING_PARTS}"]
        side_effects:
          - "closed_at set; final_cost_cents and department_charge_cents stay 0"
          - "Department.downtime_spend_cents is NOT touched (compensating invariant)"
          - "every LoanerAssignment on this work order with status == DEPLOYED transitions to CANCELLED with billable_days = 0 and rental_cost_cents = 0, releasing its pool unit ON_LOAN -> IN_SERVICE"
          - "device.operational_state DOWN -> IN_SERVICE subject to the conditional-cascade preconditions"

      - from: IN_REPAIR
        to: CANCELLED
        trigger: "POST /clinical-engineering/work-orders/{id}/cancel"
        actor: CEManager | DeptSteward
        preconditions: ["work_order.status IN {INTAKE, IN_REPAIR, AWAITING_PARTS}"]
        side_effects: ["identical to the INTAKE -> CANCELLED side-effect set"]

      - from: AWAITING_PARTS
        to: CANCELLED
        trigger: "POST /clinical-engineering/work-orders/{id}/cancel"
        actor: CEManager | DeptSteward
        preconditions: ["work_order.status IN {INTAKE, IN_REPAIR, AWAITING_PARTS}"]
        side_effects: ["identical to the INTAKE -> CANCELLED side-effect set"]

  # ---------------------------------------------------------------------------
  # PMTask — cyclic through DEFERRED (self-loop, hard cap 2)
  # ---------------------------------------------------------------------------
  - entity: PMTask
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /clinical-engineering/pm-tasks/{id}/complete"
        actor: BiomedTech
        preconditions:
          - "pm_task.status IN {SCHEDULED, DEFERRED}"
          - "device.operational_state != RETIRED"
          - "device.security_state != QUARANTINED"
          - "window_start <= clock_now <= window_end"
        side_effects:
          - "completed_at, completed_by_user_id, result and labor_minutes recorded"
          - "on_time = (completed_at <= original_due_at)"
          - "result == FAIL: device.operational_state -> DOWN and a new WorkOrder is auto-created in INTAKE with reported_severity = CLINICAL_IMPACT and problem_summary = 'PM failure on <serial_number>'"
          - "result == PASS_WITH_DEFECT: device.condition_score = min(5, condition_score + 1) and device.replacement_priority_score recomputed"

      - from: DEFERRED
        to: COMPLETED
        trigger: "POST /clinical-engineering/pm-tasks/{id}/complete"
        actor: BiomedTech
        preconditions: ["identical to the SCHEDULED -> COMPLETED precondition set, evaluated against the current (deferred) window"]
        side_effects: ["identical to the SCHEDULED -> COMPLETED side-effect set"]

      - from: SCHEDULED
        to: DEFERRED
        trigger: "POST /clinical-engineering/pm-tasks/{id}/defer"
        actor: CEManager
        preconditions:
          - "pm_task.status IN {SCHEDULED, DEFERRED}"
          - "pm_task.deferral_count < 2"
          - "new_window_end strictly after new_window_start"
        side_effects:
          - "window_start / window_end / due_at rewritten to the new window"
          - "original_due_at is NOT rewritten"
          - "deferral_count incremented by 1"

      - from: DEFERRED
        to: DEFERRED
        trigger: "POST /clinical-engineering/pm-tasks/{id}/defer (second deferral)"
        actor: CEManager
        preconditions: ["pm_task.deferral_count < 2"]
        side_effects: ["deferral_count -> 2; a third defer is rejected with ERR_DEFERRAL_LIMIT_EXCEEDED"]
        note: "Self-loop — this is the PMTask cycle."

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /clinical-engineering/facilities/{id}/pm-audit (sweep)"
        actor: system
        preconditions: ["pm_task.due_at < clock_now", "device.facility_id == facility.id"]
        side_effects: ["counted in both compliance denominators"]

      - from: DEFERRED
        to: MISSED
        trigger: "POST /clinical-engineering/facilities/{id}/pm-audit (sweep)"
        actor: system
        preconditions: ["pm_task.due_at < clock_now"]
        side_effects: ["counted in both compliance denominators"]

      - from: SCHEDULED
        to: DEFERRED
        trigger: "system: the device is taken DOWN by a published CLASS_I recall match"
        actor: system
        preconditions: ["pm_task.status == SCHEDULED", "pm_task.deferral_count < 2"]
        side_effects: ["window_start/window_end/due_at shifted forward by 30 days; deferral_count incremented by 1"]

  # ---------------------------------------------------------------------------
  # RecallNotice — branching fork-join with divergent side-effect sets
  # ---------------------------------------------------------------------------
  - entity: RecallNotice
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /clinical-engineering/recall-notices/{id}/publish"
        actor: CEManager
        preconditions: ["recall_notice.status == DRAFT"]
        side_effects:
          - "published_at set to the logical clock"
          - "CASCADE LINK 1 of transitive_cascade.recall_class_i: the inventory scan (calculations.recall_match_scan) creates one RecallMatch per matched Device; matched_device_count and pending_match_count set"
          - "the notice immediately auto-transitions out of PUBLISHED on the same request"

      - from: PUBLISHED
        to: MANDATORY_REMOVAL
        trigger: "system: auto-branch taken when hazard_class == CLASS_I"
        actor: system
        preconditions: ["recall_notice.hazard_class == CLASS_I"]
        side_effects:
          - "every matched Device: recall_hold = true"
          - "CASCADE LINK 2: every matched Device with operational_state IN {IN_SERVICE, ON_LOAN} -> DOWN"
          - "every matched Device with a SCHEDULED PMTask and deferral_count < 2: that PMTask SCHEDULED -> DEFERRED, window shifted +30 days"
          - "Facility.open_class_i_recall_count incremented by 1"
          - "Facility.ce_posture NORMAL -> HEIGHTENED"

      - from: PUBLISHED
        to: MONITORING
        trigger: "system: auto-branch taken when hazard_class IN {CLASS_II, CLASS_III}"
        actor: system
        preconditions: ["recall_notice.hazard_class IN {CLASS_II, CLASS_III}"]
        side_effects:
          - "every matched Device: recall_hold = true"
          - "operational_state is NOT changed on any matched Device"
          - "Facility.open_class_i_recall_count is NOT changed and Facility.ce_posture is NOT changed"
        note: "Divergent branch — same trigger endpoint, disjoint side-effect set from the CLASS_I branch."

      - from: MANDATORY_REMOVAL
        to: CLOSED
        trigger: "POST /clinical-engineering/recall-notices/{id}/close"
        actor: CEManager
        preconditions: ["recall_notice.pending_match_count == 0"]
        side_effects: ["Facility.open_class_i_recall_count decremented by 1"]

      - from: MONITORING
        to: CLOSED
        trigger: "POST /clinical-engineering/recall-notices/{id}/close"
        actor: CEManager
        preconditions: ["recall_notice.pending_match_count == 0"]
        side_effects: ["join point — both branches converge on CLOSED"]

  # ---------------------------------------------------------------------------
  # LoanerAssignment
  # ---------------------------------------------------------------------------
  - entity: LoanerAssignment
    initial_state: DEPLOYED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: DEPLOYED
        to: RETURNED
        trigger: "POST /clinical-engineering/loaner-assignments/{id}/return"
        actor: CEManager | BiomedTech | DeptSteward
        preconditions: ["loaner_assignment.status == DEPLOYED"]
        side_effects:
          - "returned_at set; billable_days and rental_cost_cents computed (calculations.loaner_rental_cost)"
          - "source == POOL: loaner Device ON_LOAN -> IN_SERVICE (restores the pool available-unit count)"
          - "work_order.loaner_status stays COVERED"

      - from: DEPLOYED
        to: CANCELLED
        trigger: "system: the covered WorkOrder is cancelled, or the loaner Device is taken DOWN by recall or quarantine"
        actor: system
        preconditions: ["loaner_assignment.status == DEPLOYED"]
        side_effects:
          - "billable_days stays 0 and rental_cost_cents stays 0 — no money is conserved-quantity drift"
          - "source == POOL and the unit was released by a WorkOrder cancel: loaner Device ON_LOAN -> IN_SERVICE"
          - "CASCADE LINK 4 of transitive_cascade.recall_class_i: work_order.loaner_status -> UNCOVERED and, when work_order.status IN {INTAKE, IN_REPAIR, AWAITING_PARTS}, work_order.priority -> P1 and sla_hours -> 4"

  # ---------------------------------------------------------------------------
  # ServiceContract — auto-transition on cap exhaustion
  # ---------------------------------------------------------------------------
  - entity: ServiceContract
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: POST /clinical-engineering/work-orders/{id}/close consumed the last covered event"
        actor: system
        preconditions: ["covered_events_used + 1 == covered_event_cap"]
        side_effects: ["contract leaves the candidate set of calculations.contract_selection for every later close"]

  # ---------------------------------------------------------------------------
  # SecurityFinding
  # ---------------------------------------------------------------------------
  - entity: SecurityFinding
    initial_state: OPEN
    terminal_states: [MITIGATED, ACCEPTED_RISK]
    transitions:
      - from: OPEN
        to: REMEDIATION_SCHEDULED
        trigger: "POST /clinical-engineering/work-orders with origin_security_finding_id == this finding"
        actor: SecurityOfficer | BiomedTech | CEManager
        preconditions: ["security_finding.status == OPEN"]
        side_effects: ["the remediation WorkOrder is discoverable only via GET /clinical-engineering/work-orders?origin_security_finding_id="]

      - from: REMEDIATION_SCHEDULED
        to: MITIGATED
        trigger: "POST /clinical-engineering/work-orders/{id}/close on the remediation work order, or POST /clinical-engineering/security-findings/{id}/resolve with resolution == MITIGATED"
        actor: CEManager | SecurityOfficer
        preconditions: ["security_finding.status IN {OPEN, REMEDIATION_SCHEDULED}"]
        side_effects:
          - "resolved_at set"
          - "device.security_state QUARANTINED -> REMEDIATED when the device was quarantined by this finding"

      - from: OPEN
        to: MITIGATED
        trigger: "POST /clinical-engineering/security-findings/{id}/resolve with resolution == MITIGATED"
        actor: SecurityOfficer | CEManager
        preconditions: ["security_finding.status IN {OPEN, REMEDIATION_SCHEDULED}"]
        side_effects: ["device.security_state QUARANTINED -> REMEDIATED; operational_state DOWN -> IN_SERVICE when no non-terminal WorkOrder exists and recall_hold == false"]

      - from: OPEN
        to: ACCEPTED_RISK
        trigger: "POST /clinical-engineering/security-findings/{id}/resolve with resolution == ACCEPTED_RISK"
        actor: SecurityOfficer | CEManager
        preconditions: ["security_finding.status IN {OPEN, REMEDIATION_SCHEDULED}"]
        side_effects: ["device.security_state is NOT changed — an accepted risk leaves a quarantined unit quarantined"]

      - from: REMEDIATION_SCHEDULED
        to: ACCEPTED_RISK
        trigger: "POST /clinical-engineering/security-findings/{id}/resolve with resolution == ACCEPTED_RISK"
        actor: SecurityOfficer | CEManager
        preconditions: ["security_finding.status IN {OPEN, REMEDIATION_SCHEDULED}"]
        side_effects: ["device.security_state is NOT changed"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on a parent entity's `version` — the only
# sanctioned write-write conflict mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: loaner-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /clinical-engineering/loaner-assignments"
    occ_field: "expected_work_order_version"
    description: |
      Creating a LoanerAssignment against a WorkOrder whose version has advanced
      since the client last observed it is rejected. A second loaner legitimately
      supersedes the coverage recorded by the first, so the write is not blocked
      by any state precondition; the stale-version check is what makes the
      outcome deterministic.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

  - rule_id: close-stale-department
    parent_entity: Department
    write_endpoint: "POST /clinical-engineering/work-orders/{id}/close"
    occ_field: "expected_department_version"
    description: |
      Closing a WorkOrder debits the Department, and the overhead tier is keyed
      on the department's pre-debit spend. A close whose expected_department_version
      no longer matches Department.version was computed against a superseded
      spend figure and is rejected.
    error_id: ERR_STALE_DEPARTMENT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:

  - name: device_risk_classification
    trigger: "POST /clinical-engineering/devices (create) and PATCH /clinical-engineering/devices/{id} (whenever condition_score, utilization_hours or is_loaner_pool is supplied)"
    algorithm: weighted_scoring
    formula: |
      age_days   = (date(clock_now) - acquisition_date) in whole days
      age_years  = floor(age_days / 365)
      network_adder = 4 if device_model.is_network_connected else 0
      age_adder     = 3 if age_years >= 8 else (1 if age_years >= 5 else 0)
      risk_score = (function_code * FUNCTION_WEIGHT)
                 + (physical_risk_code * PHYSICAL_WEIGHT)
                 + (maintenance_requirement_code * MAINTENANCE_WEIGHT)
                 + network_adder + age_adder
      risk_class = CRITICAL if risk_score >= 34
                   HIGH     if risk_score >= 26
                   MEDIUM   if risk_score >= 16
                   LOW      otherwise
      pm_interval_days = PM_INTERVAL_DAYS[risk_class]
    input_set: "The single Device row plus its DeviceModel. risk_score is frozen at each write; a later clock change does NOT re-age an untouched device."
    constants:
      FUNCTION_WEIGHT: 2
      PHYSICAL_WEIGHT: 3
      MAINTENANCE_WEIGHT: 1
      NETWORK_ADDER: 4
      AGE_ADDER_5Y: 1
      AGE_ADDER_8Y: 3
      RISK_CRITICAL_MIN: 34
      RISK_HIGH_MIN: 26
      RISK_MEDIUM_MIN: 16
      PM_INTERVAL_DAYS: { CRITICAL: 90, HIGH: 180, MEDIUM: 270, LOW: 365 }
    precision: "risk_score is an exact integer; the band comparisons are inclusive lower bounds (>=), so risk_score 26 is HIGH and 25 is MEDIUM"

  - name: pm_compliance_rate
    trigger: "POST /clinical-engineering/facilities/{id}/pm-audit — the ONLY writer of pm_compliance_pct_strict and pm_compliance_pct_operational"
    algorithm: aggregation
    formula: |
      # Step 1 (sweep, runs first). Processing order: due_at ASC, then created_at ASC.
      for P in PMTask where P.device.facility_id == facility.id
                        and P.status IN {SCHEDULED, DEFERRED}
                        and P.due_at < clock_now:
          P.status = MISSED
      # Step 2 (measure). Compliance window is keyed on original_due_at, NOT due_at.
      W = { P : P.device.facility_id == facility.id and P.original_due_at <= clock_now }
      numerator = count(P in W where P.status == COMPLETED and P.completed_at <= P.original_due_at)
      strict_denominator      = count(P in W where P.status IN {COMPLETED, MISSED, DEFERRED})
      operational_denominator = count(P in W where P.status IN {COMPLETED, MISSED}
                                                or (P.status == DEFERRED and P.deferral_count >= 2))
      pm_compliance_pct_strict      = 0.00   if strict_denominator == 0
                                      else round_half_up(100 * numerator / strict_denominator, 2)
      pm_compliance_pct_operational = 100.00 if operational_denominator == 0
                                      else round_half_up(100 * numerator / operational_denominator, 2)
      # Step 3 (posture). Escalation requires a NON-EMPTY strict denominator.
      if strict_denominator > 0
         and pm_compliance_pct_strict < facility.pm_compliance_target_pct
         and facility.ce_posture == NORMAL:
             facility.ce_posture = HEIGHTENED
      # Step 4
      facility.pm_audit_index += 1
    input_set: "PMTask rows whose device belongs to this facility and whose original_due_at is at or before the logical clock. SCHEDULED tasks that survived the sweep are in neither denominator."
    constants:
      EMPTY_STRICT_VALUE: 0.00
      EMPTY_OPERATIONAL_VALUE: 100.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: strict_denominator
        when: "regulatory reporting — every deferral counts against the facility"
        difference: "denominator includes every DEFERRED task regardless of deferral_count; empty denominator reports 0.00"
      - name: operational_denominator
        when: "internal operations dashboard — a first, approved deferral is forgiven"
        difference: "denominator admits DEFERRED tasks only once deferral_count >= 2; empty denominator reports 100.00"

  - name: work_order_priority
    trigger: "POST /clinical-engineering/work-orders (intake); re-derived when a loaner cancellation escalates the order"
    algorithm: threshold
    formula: |
      priority = P1 if reported_severity == PATIENT_HARM or device.risk_class == CRITICAL
                 P2 if reported_severity == CLINICAL_IMPACT or device.risk_class == HIGH
                 P3 otherwise
      sla_hours = SLA_HOURS[priority]
      # Escalation override: when a covering LoanerAssignment is CANCELLED while the
      # work order is still in {INTAKE, IN_REPAIR, AWAITING_PARTS}, priority is set to
      # P1 and sla_hours to 4 regardless of the expression above.
    input_set: "The WorkOrder's reported_severity plus the frozen risk_class of its Device."
    constants:
      SLA_HOURS: { P1: 4, P2: 24, P3: 72 }
    precision: "integer hours"

  - name: work_order_service_cost
    trigger: "POST /clinical-engineering/work-orders/{id}/complete-repair computes the provisional variant; POST /clinical-engineering/work-orders/{id}/close computes the final variant"
    algorithm: tiered_pricing
    formula: |
      shift_multiplier = AFTER_HOURS_MULTIPLIER
                         if hour_utc(work_order.repair_started_at) < DAY_SHIFT_START_HOUR
                         or hour_utc(work_order.repair_started_at) >= DAY_SHIFT_END_HOUR
                         else 1.0
      # PINNED EVALUATION ORDER: build the numerator in full (minutes x rate x
      # multiplier), THEN divide by 60, THEN round_half_up ONCE. Dividing by 60
      # first and rounding the product is NOT the rule: for 95 minutes at
      # 18500 cents/hour with multiplier 1.5 the pinned order yields the exact
      # rational 2636250 / 60 = 43937.5, which rounds half-up to 43938.
      rate = IN_HOUSE_LABOR_RATE_CENTS_PER_HOUR if service_mode == IN_HOUSE
             else vendor.hourly_rate_cents
      labor_cents = round_half_up( (labor_minutes * rate * shift_multiplier) / 60 )
      if service_mode == IN_HOUSE:
          estimated_cost_cents = labor_cents + parts_cost_cents
      else:  # VENDOR
          estimated_cost_cents = labor_cents + parts_cost_cents + vendor.travel_flat_cents
      # FINAL variant, evaluated only at close, after contract_selection has run:
      if service_mode == VENDOR and a covering ServiceContract C was selected:
          final_cost_cents = C.deductible_cents
          C.covered_events_used += 1
      else:
          final_cost_cents = estimated_cost_cents   (recomputed identically from the cumulative totals)
    input_set: "The work order's CUMULATIVE labor_minutes and parts_cost_cents (they accumulate over repeated complete-repair calls), its pinned shift_multiplier_applied, and — for VENDOR mode — the vendor rate card."
    constants:
      IN_HOUSE_LABOR_RATE_CENTS_PER_HOUR: 9000
      AFTER_HOURS_MULTIPLIER: 1.5
      DAY_SHIFT_START_HOUR: 7
      DAY_SHIFT_END_HOUR: 19
    precision: "whole cents, round_half_up, applied once to the labor term after the divide-by-60; ties (exact .5) round UP"
    variants:
      - name: provisional_list_rate
        when: "complete-repair — no contract has been consulted yet"
        difference: "always the list-rate arithmetic; writes estimated_cost_cents"
      - name: final_contract_adjusted
        when: "close — a covering ServiceContract with remaining cap is selected"
        difference: "replaces the whole list-rate figure with the flat deductible_cents and consumes one covered event; writes final_cost_cents, which therefore differs from estimated_cost_cents for the same inputs"

  - name: contract_selection
    trigger: "POST /clinical-engineering/work-orders/{id}/close, before work_order_service_cost's final variant"
    algorithm: waterfall_allocation
    formula: |
      candidates = ServiceContract C where
          C.device_model_id == work_order.device.device_model_id
          and C.vendor_id == work_order.vendor_id
          and C.status == ACTIVE
          and C.coverage_start <= work_order.repair_started_at <= C.coverage_end
          and C.covered_events_used < C.covered_event_cap
      # ranking (all keys are entity fields; no random identifier participates)
      order by C.deductible_cents ASC, then C.coverage_end ASC, then C.created_at ASC
      selected = first candidate, or NONE when the candidate set is empty
      # empty-set fallback: NOT an error — final_cost_cents falls back to the list rate
      # and work_order.service_contract_id stays null.
    input_set: "ACTIVE contracts for the exact (vendor_id, device_model_id) pair whose INCLUSIVE coverage interval contains repair_started_at and whose cap is not yet consumed."
    constants: {}
    precision: "exact integer comparison on deductible_cents"

  - name: loaner_pool_selection
    trigger: "POST /clinical-engineering/loaner-assignments when source == POOL and loaner_device_id is OMITTED"
    algorithm: waterfall_allocation
    formula: |
      # (a) eligibility filter — explicit predicate over entity fields only
      candidates = Device D where
          D.facility_id       == work_order.device.facility_id
          and D.device_model_id == work_order.device.device_model_id
          and D.is_loaner_pool  == true
          and D.operational_state == IN_SERVICE
          and D.recall_hold       == false
          and D.security_state NOT IN {VULNERABLE, QUARANTINED}
          and (device_model.is_network_connected == false
               or D.security_state IN {ASSESSED_OK, REMEDIATED})
          and D.id != work_order.device_id
          and no LoanerAssignment L on D with L.status IN {DEPLOYED, RETURNED} whose
              HALF-OPEN occupancy interval [L.start_at, coalesce(L.returned_at, L.end_at))
              intersects the requested [start_at, end_at)
      # (b) ranking expression
      order by D.condition_score ASC, then D.utilization_hours ASC
      # (c) tie-break — created_at ASC is the final, exhaustive key. The random
      #     UUID id NEVER participates in this decision.
      then D.created_at ASC
      selected = first candidate
      # (d) empty-set fallback
      if candidates is empty: reject with ERR_NO_LOANER_AVAILABLE (409)
    input_set: "Pool units at the same facility on the same model as the downed unit, free of recall hold and cyber exclusion, and unoccupied across the requested half-open interval."
    constants: {}
    precision: "integer comparisons on condition_score and utilization_hours; created_at compared at millisecond resolution"

  - name: loaner_rental_cost
    trigger: "POST /clinical-engineering/loaner-assignments/{id}/return"
    algorithm: tiered_pricing
    formula: |
      elapsed_seconds = returned_at - start_at
      billable_days   = max(1, ceil(elapsed_seconds / 86400))
      if source == POOL:
          rental_cost_cents = 0            # the pool is free; only capacity is consumed
      else:                                 # source == RENTAL
          surcharge_pct = RENTAL_RISK_SURCHARGE_PCT[work_order.device.risk_class]
          total = 0
          for d in 1 .. billable_days:      # PINNED ORDER: round EACH day, THEN sum.
              day_rate = RENTAL_BASE_DAILY_CENTS * (1 + surcharge_pct)
              if d > LONG_TERM_DISCOUNT_AFTER_DAY:
                  day_rate = day_rate * (1 - RENTAL_LONG_TERM_DISCOUNT_PCT)
              total += round_half_up(day_rate)     # <-- rounding happens here, per day
          rental_cost_cents = total
      # Summing the exact per-day rationals and rounding once at the end is the WRONG
      # order and yields a different cent figure; the per-day order above is normative.
    input_set: "One LoanerAssignment; the surcharge band is read from the DOWNED unit (work_order.device.risk_class), never from the loaner unit."
    constants:
      RENTAL_BASE_DAILY_CENTS: 24333
      RENTAL_RISK_SURCHARGE_PCT: { CRITICAL: 0.25, HIGH: 0.15, MEDIUM: 0.05, LOW: 0.00 }
      RENTAL_LONG_TERM_DISCOUNT_PCT: 0.10
      LONG_TERM_DISCOUNT_AFTER_DAY: 7
    precision: "whole cents, round_half_up, applied once per billable day before summation"

  - name: department_downtime_debit
    trigger: "POST /clinical-engineering/work-orders/{id}/close"
    algorithm: constraint_propagation
    formula: |
      # THREE ORDERED STEPS. Do NOT iterate to a fixed point: the overhead tier is
      # keyed on the PRE-DEBIT spend, even though the debit itself changes that spend.
      step 1: pre_spend = department.downtime_spend_cents        # value BEFORE this close
      step 2: tier = "T0" if pre_spend * 100 <  department.downtime_budget_cents * TIER_T0_PCT
                     "T1" if pre_spend * 100 <  department.downtime_budget_cents * TIER_T1_PCT
                     "T2" otherwise
              overhead_pct = OVERHEAD_PCT[tier]
      step 3: loaner_total = sum of rental_cost_cents over LoanerAssignment rows with
                             work_order_id == this order and status == RETURNED
              department_charge_cents = round_half_up(final_cost_cents * (1 + overhead_pct)) + loaner_total
              department.downtime_spend_cents = pre_spend + department_charge_cents
      # budget_state is re-derived from the POST-debit spend:
      budget_state = ON_HOLD if downtime_spend_cents >= downtime_budget_cents
                     WARNING if downtime_spend_cents * 100 >= downtime_budget_cents * WARNING_PCT
                     OPEN    otherwise
    input_set: "The department's pre-debit downtime_spend_cents, this work order's final_cost_cents, and only the RETURNED loaner assignments on this work order (DEPLOYED ones block the close; CANCELLED ones contribute 0)."
    constants:
      TIER_T0_PCT: 50
      TIER_T1_PCT: 80
      WARNING_PCT: 80
      OVERHEAD_PCT: { T0: 0.00, T1: 0.05, T2: 0.12 }
    precision: "whole cents, round_half_up on the overhead-scaled repair cost only; the loaner total is added after rounding"

  - name: recall_match_scan
    trigger: "POST /clinical-engineering/recall-notices/{id}/publish"
    algorithm: aggregation
    formula: |
      candidates = Device D where D.facility_id == recall_notice.facility_id
                              and D.device_model_id == recall_notice.device_model_id
                              and D.operational_state != RETIRED
      if length(recall_notice.affected_lot_numbers) == 0:
          matched    = candidates                       # whole-model recall
          match_basis = MODEL_ONLY
      else:
          matched    = [ D in candidates where D.lot_number in recall_notice.affected_lot_numbers ]
          match_basis = MODEL_AND_LOT
      # RecallMatch rows are created in candidate order acquisition_date ASC, then created_at ASC.
      matched_device_count = count(matched)
      pending_match_count  = count(matched)
    input_set: "Non-retired devices at the notice's facility on the exact model. An EMPTY affected_lot_numbers array is a whole-model recall, not a match-nothing recall."
    constants: {}
    precision: "exact integer counts"

  - name: replacement_priority_score
    trigger: "POST /clinical-engineering/devices, PATCH /clinical-engineering/devices/{id}, POST /clinical-engineering/work-orders/{id}/close, POST /clinical-engineering/pm-tasks/{id}/complete with result == PASS_WITH_DEFECT, and every GET /clinical-engineering/facilities/{id}/replacement-plan read"
    algorithm: weighted_scoring
    formula: |
      age_years        = floor(((date(clock_now) - acquisition_date) in whole days) / 365)
      age_factor       = min(1.0, age_years / device_model.expected_life_years)
      condition_factor = (condition_score - 1) / 4
      burden_factor    = min(1.0, lifetime_maintenance_cost_cents / device_model.replacement_cost_cents)
      risk_weight      = RISK_WEIGHT[risk_class]
      replacement_priority_score = round_half_up(
            100 * ( W_AGE       * age_factor
                  + W_CONDITION * condition_factor
                  + W_BURDEN    * burden_factor
                  + W_RISK      * risk_weight ), 2)
    input_set: "One Device plus its DeviceModel plus its own persisted lifetime_maintenance_cost_cents (which is the sum of final_cost_cents over CLOSED work orders and is never recomputed from scratch here)."
    constants:
      W_AGE: 0.35
      W_CONDITION: 0.30
      W_BURDEN: 0.20
      W_RISK: 0.15
      RISK_WEIGHT: { CRITICAL: 1.0, HIGH: 0.75, MEDIUM: 0.5, LOW: 0.25 }
    precision: "2 decimal places, round_half_up (so an exact .625 third decimal rounds UP)"

  - name: replacement_plan_allocation
    trigger: "GET /clinical-engineering/facilities/{id}/replacement-plan"
    algorithm: waterfall_allocation
    formula: |
      ranked = Device D where D.facility_id == facility.id and D.operational_state != RETIRED
               order by D.replacement_priority_score DESC,
                        then D.acquisition_date ASC,
                        then D.created_at ASC
      for i, D in enumerate(ranked, start=1):
          D.plan_rank = i
      if fiscal_budget_cents was supplied:
          remaining = fiscal_budget_cents
          for D in ranked:                       # PINNED: SKIP-AND-CONTINUE, not stop-at-first-miss
              cost = D.device_model.replacement_cost_cents
              if cost <= remaining:              # PINNED: inclusive comparison
                  D.plan_funded = true
                  remaining -= cost
              else:
                  D.plan_funded = false
      else:
          every returned D keeps plan_funded = false
      # plan_rank and plan_funded are PERSISTED on the Device rows by this read.
    input_set: "Non-retired devices at the facility, scored by replacement_priority_score recomputed at read time against the current logical clock."
    constants: {}
    precision: "integer cents; ranks are 1-based integers"

  - name: work_order_turnaround
    trigger: "POST /clinical-engineering/work-orders/{id}/close"
    algorithm: interval_merge
    formula: |
      # active-repair segments are the [enter IN_REPAIR, leave IN_REPAIR) spans only;
      # AWAITING_PARTS spans are excluded, and a verify FAIL opens a NEW segment.
      active_repair_seconds = sum over segments of (segment_end - segment_start) in seconds
      # exact rational division, rounded once, in both lines below
      active_repair_hours   = round_half_up(active_repair_seconds / 3600, 2)
      turnaround_hours      = round_half_up(((closed_at - reported_at) in seconds) / 3600, 2)
      sla_met               = (active_repair_hours <= sla_hours)
    input_set: "Every closed IN_REPAIR segment on the order. Segments are summed in SECONDS and rounded once at the end; rounding each segment to hours first is the wrong order."
    constants: {}
    precision: "2 decimal places, round_half_up, applied once to the summed seconds"

  - name: security_remediation_due
    trigger: "POST /clinical-engineering/security-findings"
    algorithm: threshold
    formula: |
      remediation_due_at = discovered_at + REMEDIATION_SLA_DAYS[severity] days
      # creation side effects, keyed on the same severity band:
      #   CRITICAL -> device.security_state = QUARANTINED (from any state)
      #   HIGH     -> device.security_state = VULNERABLE (only from UNASSESSED or ASSESSED_OK)
      #   MEDIUM / LOW -> device.security_state unchanged
    input_set: "One SecurityFinding and its Device."
    constants:
      REMEDIATION_SLA_DAYS: { CRITICAL: 7, HIGH: 30, MEDIUM: 90, LOW: 180 }
    precision: "whole days added to the ISO 8601 UTC discovered_at instant"

# =============================================================================
# Table 1.4: Validation Rules Table (evaluated strictly in priority order;
# the FIRST failing rule decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles set in 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "entity_backed ownership — DeptSteward: X-User-ID equals the target Device's department_id (or the Department being read); VendorRep: X-User-ID equals the target WorkOrder's vendor_id (or the ServiceContract's vendor_id)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "all endpoints reachable by DeptSteward or VendorRep"

  - priority: 4
    category: existence
    check: "every resource named in the URL path exists, validated left to right"
    error_id: ERR_FACILITY_NOT_FOUND | ERR_DEPARTMENT_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_DEVICE_MODEL_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_PM_TASK_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_LOANER_ASSIGNMENT_NOT_FOUND | ERR_RECALL_NOTICE_NOT_FOUND | ERR_RECALL_MATCH_NOT_FOUND | ERR_SERVICE_CONTRACT_NOT_FOUND | ERR_SECURITY_FINDING_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: business_constraint
    check: "request body is well formed: every required field present, enums within their declared value set, integers within their declared range (function_code 1..10, physical_risk_code 1..5, maintenance_requirement_code 1..5, condition_score 1..5), window_end > window_start, end_at > start_at, coverage_end > coverage_start, limit within 1..100, offset >= 0; unknown body keys and client-supplied computed/system fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and every list endpoint that takes pagination parameters"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: ERR_FACILITY_NOT_FOUND | ERR_DEPARTMENT_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_DEVICE_MODEL_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_SECURITY_FINDING_NOT_FOUND
    http_status: 404
    applies_to: "POST /devices, POST /departments, POST /pm-tasks, POST /work-orders, POST /loaner-assignments, POST /recall-notices, POST /service-contracts, POST /security-findings"

  - priority: 7
    category: business_constraint
    check: "Facility.facility_code is unique across all facilities"
    error_id: ERR_DUPLICATE_FACILITY_CODE
    http_status: 409
    applies_to: "POST /clinical-engineering/facilities"

  - priority: 8
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (see 1.2.1)"
    error_id: ERR_STALE_WORK_ORDER_VERSION | ERR_STALE_DEPARTMENT_VERSION
    http_status: 412
    applies_to: "POST /clinical-engineering/loaner-assignments, POST /clinical-engineering/work-orders/{id}/close"

  - priority: 9
    category: state
    check: "the target resource is in a state from which this transition is declared in 1.2"
    error_id: ERR_INVALID_WORK_ORDER_STATE | ERR_INVALID_PM_TASK_STATE | ERR_INVALID_RECALL_STATE | ERR_INVALID_LOANER_STATE | ERR_INVALID_SECURITY_STATE | ERR_INVALID_RECALL_MATCH_STATE
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 10
    category: state
    check: "the Device addressed directly or through a child resource has operational_state != RETIRED"
    error_id: ERR_DEVICE_RETIRED
    http_status: 409
    applies_to: "POST /work-orders, POST /pm-tasks, POST /pm-tasks/{id}/complete, POST /loaner-assignments, PATCH /devices/{id}"

  - priority: 11
    category: business_safety
    check: "the Device under service is not quarantined; for loaner creation the named loaner unit's security_state is NOT IN {VULNERABLE, QUARANTINED}"
    error_id: ERR_DEVICE_QUARANTINED
    http_status: 422
    applies_to: "POST /pm-tasks/{id}/complete, POST /loaner-assignments, POST /work-orders/{id}/close"

  - priority: 12
    category: business_safety
    check: "a transition to security_state ASSESSED_OK requires that no SecurityFinding on the device has status IN {OPEN, REMEDIATION_SCHEDULED}"
    error_id: ERR_SECURITY_FINDING_OPEN
    http_status: 422
    applies_to: "POST /clinical-engineering/devices/{id}/security-state"

  - priority: 13
    category: business_safety
    check: "the Device's Facility has ce_posture != LOCKDOWN"
    error_id: ERR_FACILITY_LOCKDOWN
    http_status: 409
    applies_to: "POST /clinical-engineering/work-orders/{id}/assign"

  - priority: 14
    category: business_safety
    check: "the verifying X-User-ID differs from work_order.repaired_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /clinical-engineering/work-orders/{id}/verify"

  - priority: 15
    category: business_referential
    check: "when loaner_device_id is supplied: that Device has is_loaner_pool == true, the same facility_id as the downed unit and the same device_model_id; when source == RENTAL: loaner_device_id must be absent"
    error_id: ERR_LOANER_NOT_IN_POOL
    http_status: 422
    applies_to: "POST /clinical-engineering/loaner-assignments"

  - priority: 16
    category: business_referential
    check: "when the loaner unit's DeviceModel has is_network_connected == true, its security_state must be IN {ASSESSED_OK, REMEDIATED}"
    error_id: ERR_LOANER_SECURITY_INELIGIBLE
    http_status: 422
    applies_to: "POST /clinical-engineering/loaner-assignments"

  - priority: 17
    category: business_constraint
    check: "when loaner_device_id is supplied: that Device has operational_state == IN_SERVICE and recall_hold == false"
    error_id: ERR_LOANER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /clinical-engineering/loaner-assignments"

  - priority: 18
    category: business_temporal
    check: "the requested HALF-OPEN interval [start_at, end_at) does not overlap the occupancy interval [start_at, coalesce(returned_at, end_at)) of any LoanerAssignment on the same loaner Device with status IN {DEPLOYED, RETURNED}; touching endpoints do NOT overlap"
    error_id: ERR_LOANER_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /clinical-engineering/loaner-assignments"

  - priority: 19
    category: business_temporal
    check: "the requested CLOSED interval [coverage_start, coverage_end] does not intersect the closed coverage interval of any other ServiceContract with the same (vendor_id, device_model_id) and status == ACTIVE; touching endpoints DO overlap"
    error_id: ERR_CONTRACT_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /clinical-engineering/service-contracts"

  - priority: 20
    category: business_temporal
    check: "window_start <= clock_now <= window_end for the PM task's CURRENT window"
    error_id: ERR_PM_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /clinical-engineering/pm-tasks/{id}/complete"

  - priority: 21
    category: business_constraint
    check: "pm_task.deferral_count < 2"
    error_id: ERR_DEFERRAL_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /clinical-engineering/pm-tasks/{id}/defer"

  - priority: 22
    category: business_constraint
    check: "recall_notice.pending_match_count == 0"
    error_id: ERR_RECALL_MATCHES_PENDING
    http_status: 409
    applies_to: "POST /clinical-engineering/recall-notices/{id}/close"

  - priority: 23
    category: business_constraint
    check: "when source == POOL and loaner_device_id is omitted, the eligibility-filtered candidate set of calculations.loaner_pool_selection is non-empty"
    error_id: ERR_NO_LOANER_AVAILABLE
    http_status: 409
    applies_to: "POST /clinical-engineering/loaner-assignments"

  - priority: 24
    category: business_constraint
    check: "when service_mode == VENDOR the named Vendor has is_approved == true"
    error_id: ERR_VENDOR_NOT_APPROVED
    http_status: 422
    applies_to: "POST /clinical-engineering/work-orders/{id}/assign"

  - priority: 25
    category: business_constraint
    check: "no LoanerAssignment on this work order still has status == DEPLOYED"
    error_id: ERR_INVALID_LOANER_STATE
    http_status: 409
    applies_to: "POST /clinical-engineering/work-orders/{id}/close"

  - priority: 26
    category: business_fiscal
    check: "the Device's Department has budget_state != ON_HOLD"
    error_id: ERR_DEPARTMENT_BUDGET_ON_HOLD
    http_status: 402
    applies_to: "POST /clinical-engineering/work-orders, POST /clinical-engineering/loaner-assignments"

# =============================================================================
# Table 1.5: API Endpoint Table   (api_prefix /clinical-engineering, flat topology)
# =============================================================================
endpoints:

  # --------------------------- Facility ---------------------------
  - method: POST
    path: "/clinical-engineering/facilities"
    description: "Register a hospital campus under clinical-engineering management"
    roles: [CEManager]
    code: 201
    input: [name, facility_code, pm_compliance_target_pct]
    output: Facility
    side_effects:
      - "ce_posture initialized to NORMAL, pm_audit_index to 0"
      - "pm_compliance_pct_strict initialized to 0.00 and pm_compliance_pct_operational to 100.00"

  - method: GET
    path: "/clinical-engineering/facilities/{id}"
    description: "Read one facility including both PM compliance variants and the current posture"
    roles: [CEManager, BiomedTech, SecurityOfficer, DeptSteward, VendorRep]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/clinical-engineering/facilities/{id}/posture"
    description: "Set the clinical-engineering posture manually; LOCKDOWN is reachable only here"
    roles: [CEManager]
    code: 200
    input: [to_posture, "note?"]
    output: Facility
    side_effects: ["ce_posture set to to_posture (NORMAL | HEIGHTENED | LOCKDOWN)", "increments Facility.version by 1"]

  - method: POST
    path: "/clinical-engineering/facilities/{id}/pm-audit"
    description: "Run the PM compliance audit epoch: sweep overdue PM tasks to MISSED, recompute both compliance variants, escalate posture, advance pm_audit_index"
    roles: [CEManager]
    code: 200
    input: []
    output: Facility
    side_effects:
      - "PMTask SCHEDULED|DEFERRED with due_at < clock_now -> MISSED (order: due_at ASC, created_at ASC)"
      - "pm_compliance_pct_strict and pm_compliance_pct_operational recomputed (calculations.pm_compliance_rate)"
      - "ce_posture NORMAL -> HEIGHTENED when the strict denominator is non-empty and strict rate < pm_compliance_target_pct"
      - "pm_audit_index incremented by 1"

  - method: GET
    path: "/clinical-engineering/facilities/{id}/replacement-plan"
    description: "Capital replacement plan: non-retired devices ranked by replacement_priority_score DESC, acquisition_date ASC, created_at ASC. Supplying fiscal_budget_cents runs the skip-and-continue waterfall and persists plan_rank / plan_funded on every returned device."
    roles: [CEManager]
    code: 200
    input: ["fiscal_budget_cents?", "limit?", "offset?"]
    output: Device[]
    side_effects:
      - "replacement_priority_score recomputed for every returned device against the current logical clock"
      - "plan_rank and plan_funded persisted on every returned device (calculations.replacement_plan_allocation)"

  # --------------------------- Department ---------------------------
  - method: POST
    path: "/clinical-engineering/departments"
    description: "Create a clinical department with its downtime budget"
    roles: [CEManager]
    code: 201
    input: [facility_id, name, cost_center_code, downtime_budget_cents]
    output: Department
    side_effects: ["downtime_spend_cents initialized to 0 and budget_state to OPEN"]

  - method: GET
    path: "/clinical-engineering/departments/{id}"
    description: "Read one department, including the version needed for the close OCC check"
    roles: [CEManager, DeptSteward, BiomedTech]
    code: 200
    input: []
    output: Department
    side_effects: []

  - method: GET
    path: "/clinical-engineering/departments"
    description: "List departments, filterable by owning facility and budget state"
    roles: [CEManager, DeptSteward, BiomedTech]
    code: 200
    input: ["facility_id?", "budget_state?", "limit?", "offset?"]
    output: Department[]
    side_effects: []

  # --------------------------- Vendor ---------------------------
  - method: POST
    path: "/clinical-engineering/vendors"
    description: "Register a service vendor and its rate card"
    roles: [CEManager]
    code: 201
    input: [name, vendor_code, hourly_rate_cents, travel_flat_cents, "security_attestation_on_file?", "is_approved?"]
    output: Vendor
    side_effects: []

  - method: GET
    path: "/clinical-engineering/vendors/{id}"
    description: "Read one vendor"
    roles: [CEManager, BiomedTech, VendorRep]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  # --------------------------- DeviceModel ---------------------------
  - method: POST
    path: "/clinical-engineering/device-models"
    description: "Register a catalogue model, including whether its units attach to the hospital network"
    roles: [CEManager]
    code: 201
    input: [manufacturer, model_number, device_family, expected_life_years, replacement_cost_cents, "is_network_connected?"]
    output: DeviceModel
    side_effects: []

  - method: GET
    path: "/clinical-engineering/device-models/{id}"
    description: "Read one catalogue model"
    roles: [CEManager, BiomedTech, SecurityOfficer]
    code: 200
    input: []
    output: DeviceModel
    side_effects: []

  # --------------------------- Device ---------------------------
  - method: POST
    path: "/clinical-engineering/devices"
    description: "Add a unit to inventory; risk classification runs on creation"
    roles: [CEManager]
    code: 201
    input: [facility_id, department_id, device_model_id, serial_number, acquisition_date, acquisition_cost_cents, function_code, physical_risk_code, maintenance_requirement_code, "lot_number?", "condition_score?", "utilization_hours?", "is_loaner_pool?"]
    output: Device
    side_effects:
      - "risk_score, risk_class and pm_interval_days computed (calculations.device_risk_classification)"
      - "replacement_priority_score computed (calculations.replacement_priority_score)"
      - "operational_state initialized to IN_SERVICE and security_state to UNASSESSED"

  - method: GET
    path: "/clinical-engineering/devices/{id}"
    description: "Read one unit, including both state dimensions and the capital-planning fields"
    roles: [CEManager, BiomedTech, SecurityOfficer, DeptSteward]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: GET
    path: "/clinical-engineering/devices"
    description: "List inventory filtered by facility, department, model, either state dimension, risk band or loaner-pool membership"
    roles: [CEManager, BiomedTech, SecurityOfficer, DeptSteward]
    code: 200
    input: ["facility_id?", "department_id?", "device_model_id?", "operational_state?", "security_state?", "risk_class?", "is_loaner_pool?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: PATCH
    path: "/clinical-engineering/devices/{id}"
    description: "Update the mutable inventory attributes of a unit; every supplied field re-runs risk classification and the replacement score"
    roles: [CEManager, BiomedTech]
    code: 200
    input: ["condition_score?", "utilization_hours?", "is_loaner_pool?"]
    output: Device
    side_effects:
      - "risk_score, risk_class, pm_interval_days recomputed"
      - "replacement_priority_score recomputed"
      - "increments Device.version by 1"

  - method: POST
    path: "/clinical-engineering/devices/{id}/security-state"
    description: "Drive the cyber dimension of the device state machine; operational_state is only touched by the QUARANTINED and REMEDIATED transitions"
    roles: [SecurityOfficer]
    code: 200
    input: [to_state, "note?"]
    output: Device
    side_effects:
      - "-> QUARANTINED: operational_state IN_SERVICE|ON_LOAN -> DOWN; DEPLOYED loaner assignments on this unit -> CANCELLED; each cancelled assignment sets its WorkOrder.loaner_status = UNCOVERED and escalates a non-terminal order to P1/4"
      - "-> REMEDIATED: operational_state DOWN -> IN_SERVICE when no non-terminal WorkOrder exists on the unit and recall_hold == false"
      - "increments Device.version by 1"

  # --------------------------- PMTask ---------------------------
  - method: POST
    path: "/clinical-engineering/pm-tasks"
    description: "Schedule a preventive-maintenance task in a window; due_at and original_due_at are both set to window_end"
    roles: [CEManager, BiomedTech]
    code: 201
    input: [device_id, window_start, window_end]
    output: PMTask
    side_effects: ["status SCHEDULED, deferral_count 0, due_at = original_due_at = window_end"]

  - method: GET
    path: "/clinical-engineering/pm-tasks/{id}"
    description: "Read one PM task"
    roles: [CEManager, BiomedTech]
    code: 200
    input: []
    output: PMTask
    side_effects: []

  - method: GET
    path: "/clinical-engineering/pm-tasks"
    description: "List PM tasks filtered by device and status"
    roles: [CEManager, BiomedTech]
    code: 200
    input: ["device_id?", "status?", "limit?", "offset?"]
    output: PMTask[]
    side_effects: []

  - method: POST
    path: "/clinical-engineering/pm-tasks/{id}/complete"
    description: "Record PM completion inside the current window"
    roles: [BiomedTech]
    code: 200
    input: [result, labor_minutes]
    output: PMTask
    side_effects:
      - "completed_at, completed_by_user_id, result, labor_minutes recorded; on_time derived against original_due_at"
      - "result == FAIL: device -> DOWN and a follow-on WorkOrder is auto-created in INTAKE (discoverable only via GET /clinical-engineering/work-orders?device_id=)"
      - "result == PASS_WITH_DEFECT: device.condition_score = min(5, +1) and replacement_priority_score recomputed"

  - method: POST
    path: "/clinical-engineering/pm-tasks/{id}/defer"
    description: "Push a PM task to a later window; original_due_at is preserved so the compliance denominator still sees it"
    roles: [CEManager]
    code: 200
    input: [new_window_start, new_window_end, reason]
    output: PMTask
    side_effects: ["window_start / window_end / due_at rewritten", "deferral_count incremented by 1", "status -> DEFERRED"]

  # --------------------------- WorkOrder ---------------------------
  - method: POST
    path: "/clinical-engineering/work-orders"
    description: "Intake a corrective work order against a unit; the unit goes DOWN"
    roles: [DeptSteward, BiomedTech, CEManager, SecurityOfficer]
    code: 201
    input: [device_id, reported_severity, problem_summary, "origin_security_finding_id?"]
    output: WorkOrder
    side_effects:
      - "reported_at set to the logical clock; status INTAKE; priority and sla_hours computed"
      - "device.operational_state -> DOWN"
      - "origin_security_finding_id present: SecurityFinding OPEN -> REMEDIATION_SCHEDULED"

  - method: GET
    path: "/clinical-engineering/work-orders/{id}"
    description: "Read one work order including every cost and turnaround field"
    roles: [CEManager, BiomedTech, DeptSteward, VendorRep, SecurityOfficer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/clinical-engineering/work-orders"
    description: "List work orders filtered by device, vendor, selected contract, originating security finding, status or priority. This is the only discovery channel for cascade-created work orders."
    roles: [CEManager, BiomedTech, DeptSteward, VendorRep, SecurityOfficer]
    code: 200
    input: ["device_id?", "vendor_id?", "service_contract_id?", "origin_security_finding_id?", "status?", "priority?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/clinical-engineering/work-orders/{id}/assign"
    description: "Assign the order to in-house engineering or to a vendor and start the first active-repair segment"
    roles: [CEManager, BiomedTech]
    code: 200
    input: [service_mode, "vendor_id?"]
    output: WorkOrder
    side_effects:
      - "status INTAKE -> IN_REPAIR; repair_started_at set; shift_multiplier_applied pinned from its UTC hour"
      - "assigned_user_id = X-User-ID"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: "/clinical-engineering/work-orders/{id}/parts-hold"
    description: "Suspend the repair pending parts; the AWAITING_PARTS span is excluded from active repair time"
    roles: [CEManager, BiomedTech]
    code: 200
    input: ["note?"]
    output: WorkOrder
    side_effects: ["status IN_REPAIR -> AWAITING_PARTS", "active_repair_seconds accumulated", "increments WorkOrder.version by 1"]

  - method: POST
    path: "/clinical-engineering/work-orders/{id}/resume"
    description: "Resume a held repair and open a new active-repair segment"
    roles: [CEManager, BiomedTech]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status AWAITING_PARTS -> IN_REPAIR", "increments WorkOrder.version by 1"]

  - method: POST
    path: "/clinical-engineering/work-orders/{id}/complete-repair"
    description: "Record labour and parts for the current repair pass; values ACCUMULATE across repeated calls"
    roles: [BiomedTech, VendorRep]
    code: 200
    input: [labor_minutes, parts_cost_cents]
    output: WorkOrder
    side_effects:
      - "labor_minutes and parts_cost_cents accumulated; estimated_cost_cents recomputed (provisional variant)"
      - "repaired_by_user_id = X-User-ID; status IN_REPAIR -> REPAIR_COMPLETE"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: "/clinical-engineering/work-orders/{id}/verify"
    description: "Quality-verify the repair. The verifier may not be the technician who performed it."
    roles: [BiomedTech, CEManager]
    code: 200
    input: [result, "note?"]
    output: WorkOrder
    side_effects:
      - "result == PASS: status -> VERIFIED, verified_by_user_id = X-User-ID"
      - "result == FAIL: status -> IN_REPAIR, verify_fail_count incremented, a new active-repair segment opened, shift_multiplier_applied NOT recomputed"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: "/clinical-engineering/work-orders/{id}/close"
    description: "Close the order: select a service contract, compute the final cost, debit the department under the pre-debit overhead tier, and cascade the budget state to the facility posture"
    roles: [CEManager]
    code: 200
    input: [expected_department_version]
    output: WorkOrder
    side_effects:
      - "contract selected (calculations.contract_selection); final_cost_cents computed (final variant); contract.covered_events_used incremented and ACTIVE -> EXHAUSTED at the cap"
      - "department_charge_cents computed and added to Department.downtime_spend_cents; increments Department.version by 1"
      - "Department.budget_state re-derived; a 0 -> 1 move of Facility.departments_on_hold_count sets ce_posture NORMAL -> HEIGHTENED"
      - "device.lifetime_maintenance_cost_cents and replacement_priority_score updated; device DOWN -> IN_SERVICE when no other non-terminal order, no recall hold and not quarantined"
      - "turnaround_hours, active_repair_hours and sla_met computed"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: "/clinical-engineering/work-orders/{id}/cancel"
    description: "Cancel a non-terminal order; no money moves and every deployed loaner is released"
    roles: [CEManager, DeptSteward]
    code: 200
    input: [reason]
    output: WorkOrder
    side_effects:
      - "status -> CANCELLED; final_cost_cents and department_charge_cents stay 0; Department.downtime_spend_cents untouched"
      - "DEPLOYED LoanerAssignments -> CANCELLED with billable_days 0 and rental_cost_cents 0; pool units ON_LOAN -> IN_SERVICE"
      - "device DOWN -> IN_SERVICE subject to the conditional-cascade preconditions"
      - "increments WorkOrder.version by 1"

  # --------------------------- LoanerAssignment ---------------------------
  - method: POST
    path: "/clinical-engineering/loaner-assignments"
    description: "Cover a downed unit from the loaner pool or with an external rental. Omitting loaner_device_id with source == POOL asks the server to select from the pool by the pinned eligibility filter and ranking."
    roles: [CEManager, BiomedTech, DeptSteward]
    code: 201
    input: [work_order_id, source, start_at, end_at, expected_work_order_version, "loaner_device_id?"]
    output: LoanerAssignment
    side_effects:
      - "status DEPLOYED; work_order.loaner_status -> COVERED"
      - "source == POOL with loaner_device_id omitted: the unit is chosen by calculations.loaner_pool_selection (condition_score ASC, utilization_hours ASC, created_at ASC)"
      - "source == POOL: the selected Device IN_SERVICE -> ON_LOAN"
      - "increments WorkOrder.version by 1"

  - method: GET
    path: "/clinical-engineering/loaner-assignments/{id}"
    description: "Read one loaner assignment"
    roles: [CEManager, BiomedTech, DeptSteward]
    code: 200
    input: []
    output: LoanerAssignment
    side_effects: []

  - method: GET
    path: "/clinical-engineering/loaner-assignments"
    description: "List loaner assignments filtered by loaner unit, covered work order or status"
    roles: [CEManager, BiomedTech, DeptSteward]
    code: 200
    input: ["loaner_device_id?", "work_order_id?", "status?", "limit?", "offset?"]
    output: LoanerAssignment[]
    side_effects: []

  - method: POST
    path: "/clinical-engineering/loaner-assignments/{id}/return"
    description: "Return the loaner; billable_days and rental_cost_cents are computed here"
    roles: [CEManager, BiomedTech, DeptSteward]
    code: 200
    input: []
    output: LoanerAssignment
    side_effects:
      - "returned_at set; billable_days and rental_cost_cents computed (calculations.loaner_rental_cost)"
      - "source == POOL: loaner Device ON_LOAN -> IN_SERVICE, restoring the pool available-unit count"

  # --------------------------- RecallNotice ---------------------------
  - method: POST
    path: "/clinical-engineering/recall-notices"
    description: "File a recall / hazard alert against a catalogue model for one campus"
    roles: [CEManager]
    code: 201
    input: [facility_id, device_model_id, source_reference, hazard_class, response_due_at, "affected_lot_numbers?"]
    output: RecallNotice
    side_effects: ["status DRAFT; affected_lot_numbers defaults to the empty array (whole-model recall)"]

  - method: GET
    path: "/clinical-engineering/recall-notices/{id}"
    description: "Read one recall notice including its match counts"
    roles: [CEManager, BiomedTech]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []

  - method: GET
    path: "/clinical-engineering/recall-notices"
    description: "List recall notices filtered by facility, model or status"
    roles: [CEManager, BiomedTech]
    code: 200
    input: ["facility_id?", "device_model_id?", "status?", "limit?", "offset?"]
    output: RecallNotice[]
    side_effects: []

  - method: POST
    path: "/clinical-engineering/recall-notices/{id}/publish"
    description: "Publish the notice: scan inventory, create one RecallMatch per matched unit, then auto-branch on hazard_class"
    roles: [CEManager]
    code: 200
    input: []
    output: RecallNotice
    side_effects:
      - "RecallMatch rows created (calculations.recall_match_scan); matched_device_count and pending_match_count set"
      - "CLASS_I: status -> MANDATORY_REMOVAL, matched devices recall_hold=true and IN_SERVICE|ON_LOAN -> DOWN, their SCHEDULED PM tasks deferred +30 days, facility open_class_i_recall_count +1 and ce_posture NORMAL -> HEIGHTENED"
      - "CLASS_II | CLASS_III: status -> MONITORING, matched devices recall_hold=true only"

  - method: POST
    path: "/clinical-engineering/recall-notices/{id}/close"
    description: "Close a recall once every match has a terminal disposition"
    roles: [CEManager]
    code: 200
    input: []
    output: RecallNotice
    side_effects: ["status -> CLOSED", "CLASS_I: facility open_class_i_recall_count decremented by 1"]

  # --------------------------- RecallMatch ---------------------------
  - method: GET
    path: "/clinical-engineering/recall-matches/{id}"
    description: "Read one recall match"
    roles: [CEManager, BiomedTech]
    code: 200
    input: []
    output: RecallMatch
    side_effects: []

  - method: GET
    path: "/clinical-engineering/recall-matches"
    description: "List recall matches filtered by notice, device or disposition. Cascade-created matches are discoverable only here."
    roles: [CEManager, BiomedTech]
    code: 200
    input: ["recall_notice_id?", "device_id?", "disposition?", "limit?", "offset?"]
    output: RecallMatch[]
    side_effects: []

  - method: POST
    path: "/clinical-engineering/recall-matches/{id}/disposition"
    description: "Record the per-unit recall disposition"
    roles: [CEManager, BiomedTech]
    code: 200
    input: [disposition, "note?"]
    output: RecallMatch
    side_effects:
      - "REMOVED: device.operational_state -> RETIRED"
      - "REMEDIATED | EXEMPTED: device.recall_hold cleared when this was its last PENDING match; DOWN -> IN_SERVICE subject to the conditional cascade"
      - "recall_notice.pending_match_count decremented by 1"

  # --------------------------- ServiceContract ---------------------------
  - method: POST
    path: "/clinical-engineering/service-contracts"
    description: "Create a vendor service contract for one model with an inclusive coverage interval"
    roles: [CEManager]
    code: 201
    input: [vendor_id, device_model_id, coverage_start, coverage_end, annual_premium_cents, deductible_cents, covered_event_cap]
    output: ServiceContract
    side_effects: ["status ACTIVE, covered_events_used 0"]

  - method: GET
    path: "/clinical-engineering/service-contracts/{id}"
    description: "Read one service contract"
    roles: [CEManager, VendorRep]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/clinical-engineering/service-contracts"
    description: "List service contracts filtered by vendor, model or status"
    roles: [CEManager, VendorRep]
    code: 200
    input: ["vendor_id?", "device_model_id?", "status?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []

  # --------------------------- SecurityFinding ---------------------------
  - method: POST
    path: "/clinical-engineering/security-findings"
    description: "File a cyber advisory against a unit; CRITICAL quarantines it immediately"
    roles: [SecurityOfficer]
    code: 201
    input: [device_id, severity, advisory_reference, "requires_downtime?"]
    output: SecurityFinding
    side_effects:
      - "discovered_at set to the logical clock; remediation_due_at computed (calculations.security_remediation_due)"
      - "CRITICAL: device.security_state -> QUARANTINED with the full quarantine cascade"
      - "HIGH: device.security_state UNASSESSED|ASSESSED_OK -> VULNERABLE"

  - method: GET
    path: "/clinical-engineering/security-findings/{id}"
    description: "Read one security finding"
    roles: [SecurityOfficer, CEManager, BiomedTech]
    code: 200
    input: []
    output: SecurityFinding
    side_effects: []

  - method: GET
    path: "/clinical-engineering/security-findings"
    description: "List security findings filtered by device, status or severity"
    roles: [SecurityOfficer, CEManager, BiomedTech]
    code: 200
    input: ["device_id?", "status?", "severity?", "limit?", "offset?"]
    output: SecurityFinding[]
    side_effects: []

  - method: POST
    path: "/clinical-engineering/security-findings/{id}/resolve"
    description: "Close a finding as remediated or as an accepted risk"
    roles: [SecurityOfficer, CEManager]
    code: 200
    input: [resolution, "note?"]
    output: SecurityFinding
    side_effects:
      - "MITIGATED: status -> MITIGATED; a quarantined device moves QUARANTINED -> REMEDIATED and DOWN -> IN_SERVICE when nothing else holds it down"
      - "ACCEPTED_RISK: status -> ACCEPTED_RISK; device.security_state untouched"

  # --------------------------- Test-driving (logical clock) ---------------------------
  - method: POST
    path: "/clinical-engineering/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The clock defaults to 2026-08-01T00:00:00Z at server start and MUST NOT fall back to real wall-clock time before this endpoint is first called."
    roles: [CEManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["every later reported_at / completed_at / discovered_at / returned_at / closed_at reads from this clock"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED,            http: 401, condition: "X-User-Role or X-User-ID header missing or empty" }
  - { id: ERR_UNAUTHORIZED,               http: 403, condition: "The caller's role is not listed for the endpoint in 1.5" }
  - { id: ERR_OWNERSHIP_VIOLATION,        http: 403, condition: "A DeptSteward acts on a device outside its own department, or a VendorRep acts on a work order or contract that is not its own" }

  # --- existence ---
  - { id: ERR_FACILITY_NOT_FOUND,         http: 404, condition: "No Facility with the given id, in the path or in a body foreign key" }
  - { id: ERR_DEPARTMENT_NOT_FOUND,       http: 404, condition: "No Department with the given id" }
  - { id: ERR_VENDOR_NOT_FOUND,           http: 404, condition: "No Vendor with the given id" }
  - { id: ERR_DEVICE_MODEL_NOT_FOUND,     http: 404, condition: "No DeviceModel with the given id" }
  - { id: ERR_DEVICE_NOT_FOUND,           http: 404, condition: "No Device with the given id" }
  - { id: ERR_PM_TASK_NOT_FOUND,          http: 404, condition: "No PMTask with the given id" }
  - { id: ERR_WORK_ORDER_NOT_FOUND,       http: 404, condition: "No WorkOrder with the given id" }
  - { id: ERR_LOANER_ASSIGNMENT_NOT_FOUND, http: 404, condition: "No LoanerAssignment with the given id" }
  - { id: ERR_RECALL_NOTICE_NOT_FOUND,    http: 404, condition: "No RecallNotice with the given id" }
  - { id: ERR_RECALL_MATCH_NOT_FOUND,     http: 404, condition: "No RecallMatch with the given id" }
  - { id: ERR_SERVICE_CONTRACT_NOT_FOUND, http: 404, condition: "No ServiceContract with the given id" }
  - { id: ERR_SECURITY_FINDING_NOT_FOUND, http: 404, condition: "No SecurityFinding with the given id" }

  # --- request shape / uniqueness ---
  - { id: ERR_INVALID_REQUEST,            http: 400, condition: "Missing required field, unknown body key, client-supplied computed or system field, enum outside its declared set, integer outside its declared range, non-increasing interval, or pagination parameter outside limit 1..100 / offset >= 0" }
  - { id: ERR_DUPLICATE_FACILITY_CODE,    http: 409, condition: "A Facility with the same facility_code already exists" }

  # --- optimistic concurrency ---
  - { id: ERR_STALE_WORK_ORDER_VERSION,   http: 412, condition: "expected_work_order_version does not match the WorkOrder's current version on loaner creation" }
  - { id: ERR_STALE_DEPARTMENT_VERSION,   http: 412, condition: "expected_department_version does not match the Department's current version on work-order close" }

  # --- state ---
  - { id: ERR_INVALID_WORK_ORDER_STATE,   http: 409, condition: "The work order is not in a state from which the requested transition is declared, or is already terminal" }
  - { id: ERR_INVALID_PM_TASK_STATE,      http: 409, condition: "The PM task is COMPLETED or MISSED and can no longer be completed or deferred" }
  - { id: ERR_INVALID_RECALL_STATE,       http: 409, condition: "The recall notice is not DRAFT on publish, or not MANDATORY_REMOVAL/MONITORING on close" }
  - { id: ERR_INVALID_RECALL_MATCH_STATE, http: 409, condition: "The recall match already carries a terminal disposition" }
  - { id: ERR_INVALID_LOANER_STATE,       http: 409, condition: "The loaner assignment is not DEPLOYED on return, or a DEPLOYED assignment still blocks a work-order close" }
  - { id: ERR_INVALID_SECURITY_STATE,     http: 409, condition: "The requested security_state transition is not declared for the device's current security_state" }
  - { id: ERR_DEVICE_RETIRED,             http: 409, condition: "The addressed device has operational_state == RETIRED" }

  # --- safety / compliance ---
  - { id: ERR_DEVICE_QUARANTINED,         http: 422, condition: "The device under service is QUARANTINED, or a named loaner unit has security_state IN {VULNERABLE, QUARANTINED}" }
  - { id: ERR_SECURITY_FINDING_OPEN,      http: 422, condition: "A move to security_state ASSESSED_OK was attempted while a SecurityFinding on the device is OPEN or REMEDIATION_SCHEDULED" }
  - { id: ERR_FACILITY_LOCKDOWN,          http: 409, condition: "The device's facility has ce_posture == LOCKDOWN and the requested assignment is therefore blocked" }
  - { id: ERR_SEGREGATION_OF_DUTIES,      http: 403, condition: "The verifying X-User-ID equals work_order.repaired_by_user_id" }

  # --- loaner pool ---
  - { id: ERR_LOANER_NOT_IN_POOL,         http: 422, condition: "The named loaner unit is not is_loaner_pool, or is at a different facility or on a different model than the downed unit, or loaner_device_id was supplied with source == RENTAL" }
  - { id: ERR_LOANER_SECURITY_INELIGIBLE, http: 422, condition: "The loaner unit's model is network-connected and its security_state is not IN {ASSESSED_OK, REMEDIATED}" }
  - { id: ERR_LOANER_UNAVAILABLE,         http: 409, condition: "The named loaner unit is not IN_SERVICE, or carries recall_hold == true" }
  - { id: ERR_LOANER_INTERVAL_CONFLICT,   http: 409, condition: "The requested half-open occupancy interval overlaps an existing DEPLOYED or RETURNED assignment on the same loaner unit" }
  - { id: ERR_NO_LOANER_AVAILABLE,        http: 409, condition: "source == POOL with no loaner_device_id and the eligibility-filtered candidate set is empty" }

  # --- business constraints ---
  - { id: ERR_CONTRACT_COVERAGE_OVERLAP,  http: 409, condition: "An ACTIVE contract for the same vendor and model already covers a closed interval that intersects the requested one, endpoints included" }
  - { id: ERR_PM_OUTSIDE_WINDOW,          http: 422, condition: "PM completion attempted outside [window_start, window_end] of the task's current window" }
  - { id: ERR_DEFERRAL_LIMIT_EXCEEDED,    http: 422, condition: "A third defer was attempted on a PM task that already has deferral_count == 2" }
  - { id: ERR_RECALL_MATCHES_PENDING,     http: 409, condition: "Recall close attempted while pending_match_count > 0" }
  - { id: ERR_VENDOR_NOT_APPROVED,        http: 422, condition: "assign with service_mode == VENDOR named a vendor whose is_approved is false" }

  # --- fiscal ---
  - { id: ERR_DEPARTMENT_BUDGET_ON_HOLD,  http: 402, condition: "The device's department has budget_state == ON_HOLD and therefore may not open new work orders or loaner coverage" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: CEManager
    description: "Clinical-engineering manager. Owns inventory registration, money, capital planning, vendor contracts, recall governance and the facility posture."
    identity: "opaque"
    exclusive_operations:
      - "POST /clinical-engineering/facilities"
      - "POST /clinical-engineering/facilities/{id}/posture"
      - "POST /clinical-engineering/facilities/{id}/pm-audit"
      - "GET /clinical-engineering/facilities/{id}/replacement-plan"
      - "POST /clinical-engineering/departments"
      - "POST /clinical-engineering/vendors"
      - "POST /clinical-engineering/device-models"
      - "POST /clinical-engineering/devices"
      - "POST /clinical-engineering/pm-tasks/{id}/defer"
      - "POST /clinical-engineering/work-orders/{id}/close"
      - "POST /clinical-engineering/recall-notices"
      - "POST /clinical-engineering/recall-notices/{id}/publish"
      - "POST /clinical-engineering/recall-notices/{id}/close"
      - "POST /clinical-engineering/service-contracts"
      - "POST /clinical-engineering/_clock/set_current_utc"
    shared_operations:
      - "POST /clinical-engineering/pm-tasks (with BiomedTech)"
      - "POST /clinical-engineering/work-orders (with DeptSteward, BiomedTech, SecurityOfficer)"
      - "POST /clinical-engineering/work-orders/{id}/assign, /parts-hold, /resume (with BiomedTech)"
      - "POST /clinical-engineering/work-orders/{id}/verify (with BiomedTech)"
      - "POST /clinical-engineering/work-orders/{id}/cancel (with DeptSteward)"
      - "POST /clinical-engineering/loaner-assignments and /return (with BiomedTech, DeptSteward)"
      - "POST /clinical-engineering/recall-matches/{id}/disposition (with BiomedTech)"
      - "POST /clinical-engineering/security-findings/{id}/resolve (with SecurityOfficer)"
      - "PATCH /clinical-engineering/devices/{id} (with BiomedTech)"
      - "all read endpoints except the vendor-scoped contract reads"

  - name: BiomedTech
    description: "In-house biomedical equipment technician. Performs repairs and preventive maintenance. Segregation of duties: a technician may not verify a repair they performed."
    identity: "opaque"
    exclusive_operations:
      - "POST /clinical-engineering/pm-tasks/{id}/complete"
    shared_operations:
      - "POST /clinical-engineering/pm-tasks (with CEManager)"
      - "POST /clinical-engineering/work-orders (with DeptSteward, CEManager, SecurityOfficer)"
      - "POST /clinical-engineering/work-orders/{id}/assign, /parts-hold, /resume, /verify (with CEManager)"
      - "POST /clinical-engineering/work-orders/{id}/complete-repair (with VendorRep)"
      - "POST /clinical-engineering/loaner-assignments and /return (with CEManager, DeptSteward)"
      - "POST /clinical-engineering/recall-matches/{id}/disposition (with CEManager)"
      - "PATCH /clinical-engineering/devices/{id} (with CEManager)"
      - "read endpoints for facilities, departments, devices, models, vendors, pm-tasks, work-orders, loaners, recalls and security findings"

  - name: DeptSteward
    description: "Clinical department representative. Reports faults on its own department's equipment, may request loaner coverage and may cancel its own orders."
    identity: "entity_backed:Department"
    exclusive_operations: []
    shared_operations:
      - "POST /clinical-engineering/work-orders (only for devices whose department_id == X-User-ID)"
      - "POST /clinical-engineering/work-orders/{id}/cancel (with CEManager, only for its own department's devices)"
      - "POST /clinical-engineering/loaner-assignments and /return (with CEManager, BiomedTech)"
      - "GET /clinical-engineering/facilities/{id}, /departments, /departments/{id}, /devices, /devices/{id}, /work-orders, /work-orders/{id}, /loaner-assignments, /loaner-assignments/{id}"

  - name: SecurityOfficer
    description: "Medical-device security coordinator. Owns the cyber dimension of the device state machine and the security finding lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /clinical-engineering/devices/{id}/security-state"
      - "POST /clinical-engineering/security-findings"
    shared_operations:
      - "POST /clinical-engineering/security-findings/{id}/resolve (with CEManager)"
      - "POST /clinical-engineering/work-orders (remediation intake, with DeptSteward, BiomedTech, CEManager)"
      - "GET /clinical-engineering/facilities/{id}, /devices, /devices/{id}, /device-models/{id}, /work-orders, /work-orders/{id}, /security-findings, /security-findings/{id}"

  - name: VendorRep
    description: "External vendor service representative. May complete repairs only on work orders assigned to its own vendor record."
    identity: "entity_backed:Vendor"
    exclusive_operations: []
    shared_operations:
      - "POST /clinical-engineering/work-orders/{id}/complete-repair (with BiomedTech, only when work_order.vendor_id == X-User-ID)"
      - "GET /clinical-engineering/facilities/{id}, /vendors/{id}, /work-orders, /work-orders/{id}, /service-contracts, /service-contracts/{id}"
