# =============================================================================
# Timekeeping & FLSA Overtime — benchmark seed tables (SCAFFOLD.yaml)
# §1.0–§1.7. (Difficulty design §1.8 and corner design §1.9 live in sibling files.)
# =============================================================================

scenario: "97. Timekeeping & FLSA Overtime: exempt/non-exempt classification, state Meal/Rest break, Overtime (>40/week), Double Time (CA daily >12), shift detention, Time Edit audit, Tipped Wage"

domain_name: timekeeping-flsa-overtime
api_prefix: ""   # flat topology: each entity is a top-level collection (/employers, /employees, /shifts, ...) rather than nested under one resource path

complexity_profile:
  primary_archetype: pricing_engine          # wage computation under tiered/threshold OT rules
  secondary_archetype: compliance_audit       # FLSA/state rules, tamper-evident time-edit log, segregation of duties
  complexity_layers:
    - dual_variant_calculation                # CA daily-OT method vs FLSA weekly-OT method on same week
    - rate_threshold_triggers                 # >8/day, >12/day, >40/week, tip-credit floor
    - derived_field_reconciliation            # TimesheetWeek aggregates recompute from punches/breaks/tips
    - optimistic_concurrency                  # OCC on TimesheetWeek.version for approve / payroll-include races

  entity_topology: flat                        # peer entities linked by FK; no nested URL ownership chains
  state_machine_shape: branching               # timesheet approve/reject revert cycle; tip-pool & payroll forks
  relationship_patterns:
    - one_to_many                              # Employee 1:N TimePunch/TimesheetWeek; Worksite 1:N Shift
    - cross_aggregate                          # TimesheetWeek derives across TimePunch + BreakRecord + TipDeclaration
  role_model: segregation_of_duties            # the editor of a punch cannot approve its timesheet; supervisor vs payroll
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: workweek_start_dow, type: enum, source: input, default: "MON", description: "Day-of-week the 7-day FLSA workweek begins: MON|TUE|WED|THU|FRI|SAT|SUN" }
      - { name: federal_min_wage_cents, type: integer, source: input, default: 725, description: "Federal minimum wage in cents/hour used for tipped true-up" }
      - { name: federal_tipped_cash_wage_cents, type: integer, source: input, default: 213, description: "Federal tipped cash (direct) wage in cents/hour" }

  - name: WageRuleSet
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, constraints: "two-letter; unique per Employer", description: "US state the rule set governs" }
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: daily_ot_enabled, type: boolean, source: input, default: false, description: "If true, hours beyond daily_ot_threshold_hours pay 1.5x (CA-style)" }
      - { name: daily_ot_threshold_hours, type: number, source: input, default: 8, description: "Daily hours above which OT (1.5x) applies when daily_ot_enabled" }
      - { name: daily_dt_threshold_hours, type: number, source: input, default: 12, description: "Daily hours above which Double Time (2.0x) applies when daily_ot_enabled" }
      - { name: weekly_ot_threshold_hours, type: number, source: input, default: 40, description: "Weekly hours above which FLSA OT (1.5x) applies" }
      - { name: seventh_day_rule_enabled, type: boolean, source: input, default: false, description: "If true, 7th consecutive worked day in a workweek: first 8h at 1.5x, beyond 8h at 2.0x (CA-style)" }
      - { name: meal_break_premium_enabled, type: boolean, source: input, default: false, description: "If true, a missed meal break yields a 1x-regular-rate premium hour" }
      - { name: rest_break_premium_enabled, type: boolean, source: input, default: false, description: "If true, a missed rest break yields a 1x-regular-rate premium hour" }
      - { name: state_min_wage_cents, type: integer, source: input, default: 725, description: "State minimum wage in cents/hour (used for tipped true-up: max(state, federal))" }

  - name: Worksite
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: name, type: string, source: input, description: "Worksite name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state; selects the governing WageRuleSet by (employer_id, state_code)" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: home_worksite_id, type: string, source: input, description: "FK -> Worksite.id; default worksite for shifts/punches" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: classification, type: enum, source: input, constraints: "EXEMPT | NON_EXEMPT", description: "FLSA classification; EXEMPT employees never accrue OT/DT/break premiums" }
      - { name: base_rate_cents, type: integer, source: input, constraints: ">= 0", description: "Base hourly rate in cents (salary basis for EXEMPT is out of scope; rate still recorded)" }
      - { name: is_tipped, type: boolean, source: input, default: false, description: "Tipped employee subject to tip-credit true-up; only meaningful for NON_EXEMPT" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE — employees are created ACTIVE; no termination workflow is in scope, so ACTIVE is the only reachable value" }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: worksite_id, type: string, source: input, description: "FK -> Worksite.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled shift start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, constraints: "must be strictly after scheduled_start", description: "Scheduled shift end (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | CANCELLED" }
      - { name: detention_minutes, type: integer, source: computed, description: "max(0, actual clock-out minus scheduled_end), in whole minutes; 0 until the punch closes" }
      - { name: detention_flagged, type: boolean, source: computed, description: "True when detention_minutes > detention_grace_minutes (15) — unauthorized over-detention" }

  - name: TimePunch
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id" }
      - { name: clock_in, type: datetime, source: input, description: "Actual clock-in (ISO 8601 UTC)" }
      - { name: clock_out, type: datetime, source: system, constraints: "set on close; must be strictly after effective clock_in", description: "Actual clock-out (ISO 8601 UTC); null while OPEN" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | VOIDED" }
      - { name: worked_minutes, type: integer, source: computed, description: "Whole minutes between effective clock_in and clock_out after edits; 0 while OPEN" }
      - { name: workday_date, type: string, source: computed, description: "Calendar date (YYYY-MM-DD, UTC) of clock_in; the daily-OT bucket key" }
      - { name: edited, type: boolean, source: computed, description: "True once any TimeEdit has been applied to this punch" }

  - name: TimeEdit
    parent: null
    common_fields: false   # append-only audit record: id + created_at only, immutable
    fields:
      - { name: punch_id, type: string, source: input, description: "FK -> TimePunch.id" }
      - { name: editor_user_id, type: string, source: system, description: "X-User-ID of the Supervisor who applied the edit (audit identity)" }
      - { name: field, type: enum, source: input, constraints: "CLOCK_IN | CLOCK_OUT", description: "Which punch timestamp was changed" }
      - { name: old_value, type: datetime, source: system, description: "Prior value of the field (server-snapshotted)" }
      - { name: new_value, type: datetime, source: input, description: "New value for the field (ISO 8601 UTC)" }
      - { name: reason, type: string, source: input, constraints: "non-empty", description: "Mandatory justification for the edit (tamper-evident audit)" }

  - name: BreakRecord
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: kind, type: enum, source: input, constraints: "MEAL | REST", description: "Break category" }
      - { name: taken, type: boolean, source: input, description: "True if the break was taken; false records a missed break" }
      - { name: minutes, type: integer, source: input, default: 0, description: "Duration of the break taken, in minutes (0 when missed)" }
      - { name: premium_owed, type: boolean, source: computed, description: "True when taken=false AND the governing WageRuleSet has the matching premium enabled AND employee is NON_EXEMPT" }

  - name: TipDeclaration
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: workday_date, type: string, source: input, constraints: "YYYY-MM-DD", description: "Calendar workday the tips were earned" }
      - { name: declared_cents, type: integer, source: input, constraints: ">= 0", description: "Tips declared by the employee for the workday, in cents" }
      - { name: pool_id, type: string, source: input, default: null, description: "FK -> TipPool.id; null when the declaration is not contributed to a pool" }

  - name: TipPool
    parent: null
    common_fields: true
    fields:
      - { name: worksite_id, type: string, source: input, description: "FK -> Worksite.id" }
      - { name: workday_date, type: string, source: input, constraints: "YYYY-MM-DD", description: "Workday the pool covers" }
      - { name: status, type: enum, source: system, description: "OPEN | DISTRIBUTED | CANCELLED" }
      - { name: pooled_cents, type: integer, source: computed, description: "Sum of declared_cents over TipDeclarations whose pool_id == this pool" }
      - { name: distributed_cents, type: integer, source: computed, description: "Sum of allocations made on DISTRIBUTE; equals pooled_cents after distribution" }

  - name: TimesheetWeek
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: workweek_start, type: string, source: input, constraints: "YYYY-MM-DD; must equal an Employer workweek boundary", description: "Inclusive start date of the 7-day FLSA workweek" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | LOCKED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of Supervisor who submitted (segregation-of-duties subject)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of Supervisor who approved; must differ from any punch editor and from submitter" }
      - { name: regular_minutes, type: integer, source: computed, description: "Straight-time minutes after the dual-variant OT method resolves (see §1.3 weekly_overtime_resolution)" }
      - { name: ot_minutes, type: integer, source: computed, description: "Overtime (1.5x) minutes for the week after non-double-counting" }
      - { name: dt_minutes, type: integer, source: computed, description: "Double-time (2.0x) minutes for the week" }
      - { name: break_premium_hours, type: integer, source: computed, description: "Count of premium hours owed for missed meal/rest breaks across the week" }
      - { name: gross_wages_cents, type: integer, source: computed, description: "Total gross pay in cents (regular + OT + DT + break premium + tipped true-up)" }
      - { name: tip_true_up_cents, type: integer, source: computed, description: "Employer make-up amount when tip credit leaves earnings below minimum wage (0 for non-tipped)" }
      - { name: payroll_run_id, type: string, source: system, default: null, description: "FK -> PayrollRun.id; set when LOCKED into a run" }

  - name: PayrollRun
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: period_start, type: string, source: input, constraints: "YYYY-MM-DD", description: "Inclusive pay period start" }
      - { name: period_end, type: string, source: input, constraints: "YYYY-MM-DD; >= period_start", description: "Inclusive pay period end" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | CANCELLED" }
      - { name: total_gross_cents, type: integer, source: computed, description: "Sum of gross_wages_cents over LOCKED TimesheetWeeks in this run" }
      - { name: included_week_count, type: integer, source: computed, description: "Count of TimesheetWeeks LOCKED into this run" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Shift
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /shifts/{id}/punches (first punch opened)"
        actor: Employee
        preconditions:
          - "Shift.status == SCHEDULED"
          - "acting Employee.id == Shift.employee_id"
          - "no other OPEN TimePunch exists for this employee (ERR_PUNCH_ALREADY_OPEN)"
        side_effects:
          - "create TimePunch in OPEN with clock_in"
          - "Shift.status set to OPEN"
      - from: OPEN
        to: CLOSED
        trigger: "POST /punches/{id}/close"
        actor: Employee
        preconditions:
          - "TimePunch.status == OPEN"
          - "clock_out strictly after effective clock_in (ERR_NEGATIVE_DURATION)"
        side_effects:
          - "TimePunch.status set to CLOSED; clock_out stamped; worked_minutes computed"
          - "recompute Shift.detention_minutes = max(0, clock_out - scheduled_end) in minutes"
          - "set Shift.detention_flagged = (detention_minutes > 15)"
          - "Shift.status set to CLOSED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shifts/{id}/cancel"
        actor: Supervisor
        preconditions:
          - "Shift.status == SCHEDULED (no punch opened) (ERR_INVALID_STATE)"
        side_effects:
          - "Shift.status set to CANCELLED"

  - entity: TimePunch
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /punches/{id}/close"
        actor: Employee
        preconditions:
          - "TimePunch.status == OPEN"
          - "clock_out strictly after effective clock_in (ERR_NEGATIVE_DURATION)"
        side_effects:
          - "stamp clock_out; compute worked_minutes; set workday_date from clock_in"
        note: "Same physical transition as Shift OPEN->CLOSED; advances both rows."
      - from: CLOSED
        to: CLOSED
        trigger: "POST /punches/{id}/edits"
        actor: Supervisor
        preconditions:
          - "TimePunch.status == CLOSED"
          - "TimePunch's TimesheetWeek is not APPROVED or LOCKED (ERR_TIMESHEET_FROZEN)"
          - "reason non-empty (ERR_EDIT_REASON_REQUIRED)"
          - "resulting clock_out strictly after resulting clock_in (ERR_NEGATIVE_DURATION)"
        side_effects:
          - "append immutable TimeEdit (old_value snapshot, editor_user_id = X-User-ID)"
          - "apply new_value to the punch field; recompute worked_minutes; set edited=true"
          - "recompute owning Shift.detention_minutes and detention_flagged when CLOCK_OUT changed"
          - "if a TimesheetWeek covers workday_date in DRAFT/SUBMITTED/REJECTED, recompute its derived wage fields"
        note: "Self-loop: an edit keeps the punch CLOSED but appends one audit row and bumps version."
      - from: OPEN
        to: VOIDED
        trigger: "POST /punches/{id}/void"
        actor: Supervisor
        preconditions:
          - "TimePunch.status == OPEN"
        side_effects:
          - "TimePunch.status set to VOIDED; owning Shift reverts to SCHEDULED if it had no other punch"
      - from: CLOSED
        to: VOIDED
        trigger: "POST /punches/{id}/void"
        actor: Supervisor
        preconditions:
          - "TimePunch.status == CLOSED"
          - "TimePunch's TimesheetWeek is not APPROVED or LOCKED (ERR_TIMESHEET_FROZEN)"
        side_effects:
          - "TimePunch.status set to VOIDED; worked_minutes set to 0"
          - "recompute owning TimesheetWeek derived wage fields (cascade)"

  - entity: TimesheetWeek
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /timesheet-weeks/{id}/submit"
        actor: Supervisor
        preconditions:
          - "TimesheetWeek.status == DRAFT"
          - "no OPEN TimePunch exists for the employee inside the workweek (ERR_OPEN_PUNCH_IN_WEEK)"
        side_effects:
          - "recompute all derived wage fields from punches/breaks/tips"
          - "set submitted_by_user_id = X-User-ID"
          - "TimesheetWeek.status set to SUBMITTED; increments TimesheetWeek.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /timesheet-weeks/{id}/approve"
        actor: Supervisor
        preconditions:
          - "TimesheetWeek.status == SUBMITTED"
          - "expected_timesheet_week_version matches current version (ERR_STALE_VERSION)"
          - "X-User-ID differs from submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "X-User-ID is not the editor_user_id of any TimeEdit on a punch in this week (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "set approved_by_user_id = X-User-ID"
          - "TimesheetWeek.status set to APPROVED; increments TimesheetWeek.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /timesheet-weeks/{id}/reject"
        actor: Supervisor
        preconditions:
          - "TimesheetWeek.status == SUBMITTED"
          - "X-User-ID differs from submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "TimesheetWeek.status set to REJECTED; clears submitted_by_user_id; increments version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /timesheet-weeks/{id}/submit"
        actor: Supervisor
        preconditions:
          - "TimesheetWeek.status == REJECTED"
          - "no OPEN TimePunch exists for the employee inside the workweek (ERR_OPEN_PUNCH_IN_WEEK)"
        side_effects:
          - "recompute all derived wage fields"
          - "set submitted_by_user_id = X-User-ID; TimesheetWeek.status set to SUBMITTED; increments version by 1"
        note: "Revision loop: REJECTED -> SUBMITTED makes the machine cyclic."
      - from: APPROVED
        to: LOCKED
        trigger: "POST /payroll-runs/{id}/include (system, per included week)"
        actor: PayrollAdmin
        preconditions:
          - "TimesheetWeek.status == APPROVED"
          - "expected_timesheet_week_version matches current version (ERR_STALE_VERSION)"
          - "PayrollRun.status == OPEN and target run covers the week's workweek_start (ERR_WEEK_OUTSIDE_PERIOD)"
        side_effects:
          - "set payroll_run_id; TimesheetWeek.status set to LOCKED; increments version by 1"
          - "increment PayrollRun.included_week_count; add gross_wages_cents to PayrollRun.total_gross_cents"

  - entity: TipPool
    initial_state: OPEN
    terminal_states: [DISTRIBUTED, CANCELLED]
    transitions:
      - from: OPEN
        to: DISTRIBUTED
        trigger: "POST /tip-pools/{id}/distribute"
        actor: Supervisor
        preconditions:
          - "TipPool.status == OPEN"
          - "at least one TipDeclaration has pool_id == this pool (ERR_EMPTY_TIP_POOL)"
        side_effects:
          - "compute pooled_cents = sum of contributing declared_cents"
          - "allocate pooled_cents across contributing employees by worked_minutes share (waterfall, see §1.3 tip_pool_allocation)"
          - "set distributed_cents = pooled_cents; TipPool.status set to DISTRIBUTED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /tip-pools/{id}/cancel"
        actor: Supervisor
        preconditions:
          - "TipPool.status == OPEN"
        side_effects:
          - "TipPool.status set to CANCELLED; detach contributing declarations (pool_id set to null)"

  - entity: PayrollRun
    initial_state: OPEN
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /payroll-runs/{id}/finalize"
        actor: PayrollAdmin
        preconditions:
          - "PayrollRun.status == OPEN"
          - "at least one TimesheetWeek is LOCKED into this run (ERR_EMPTY_PAYROLL_RUN)"
        side_effects:
          - "PayrollRun.status set to FINALIZED (run becomes immutable)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /payroll-runs/{id}/cancel"
        actor: PayrollAdmin
        preconditions:
          - "PayrollRun.status == OPEN"
        side_effects:
          - "for each LOCKED TimesheetWeek: revert to APPROVED, clear payroll_run_id (cascade compensation)"
          - "reset total_gross_cents and included_week_count to 0; PayrollRun.status set to CANCELLED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: timesheet-approve-stale-version
    parent_entity: TimesheetWeek
    write_endpoint: "POST /timesheet-weeks/{id}/approve"
    occ_field: "expected_timesheet_week_version"
    description: |
      Approving a TimesheetWeek whose version has advanced since the client last
      observed it is rejected. This captures the case where a reject-then-resubmit
      revision loop (or a punch-edit cascade recompute) has bumped the week's
      version, so the approver's view of the sheet is stale and the approval would
      bless a different set of numbers than the one reviewed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: payroll-include-stale-week
    parent_entity: TimesheetWeek
    write_endpoint: "POST /payroll-runs/{id}/include"
    occ_field: "expected_timesheet_week_version"
    description: |
      Locking an APPROVED TimesheetWeek into a PayrollRun when the week's version
      has advanced since it was observed is rejected. A new approval cycle (after a
      late punch void) supersedes the prior gross, so a stale view must not be
      committed into payroll.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: daily_overtime_breakdown
    trigger: "TimesheetWeek recompute (on submit / resubmit, and on punch edit/void cascade)"
    algorithm: threshold
    formula: |
      For each workday_date in the workweek, sum worked_minutes over the employee's
      CLOSED, non-VOIDED TimePunches with that workday_date (call it D minutes;
      Dh = D / 60 hours). Using the worksite's WageRuleSet:
        if not daily_ot_enabled:
            day_regular_h = Dh; day_ot_h = 0; day_dt_h = 0
        else:
            day_regular_h = min(Dh, daily_ot_threshold_hours)          # default 8
            day_ot_h      = max(0, min(Dh, daily_dt_threshold_hours) - daily_ot_threshold_hours)  # 8..12
            day_dt_h      = max(0, Dh - daily_dt_threshold_hours)       # >12
        Seventh-day override: if seventh_day_rule_enabled AND this is the 7th
        consecutive worked calendar day within the workweek, then
            day_regular_h = 0; day_ot_h = min(Dh, 8); day_dt_h = max(0, Dh - 8).
      Daily totals are summed across the week into daily_regular_h, daily_ot_h, daily_dt_h.
    input_set: "CLOSED non-VOIDED TimePunches of the employee whose workday_date falls in [workweek_start, workweek_start+6]"
    constants:
      DAILY_OT_THRESHOLD_HOURS: 8
      DAILY_DT_THRESHOLD_HOURS: 12
      SEVENTH_DAY_FIRST_TIER_HOURS: 8
    precision: "minutes are integers; hours = minutes/60 exact; pay rounded only at gross_wages (round_half_up to whole cents)"

  - name: weekly_overtime_resolution
    trigger: "TimesheetWeek recompute (after daily_overtime_breakdown)"
    algorithm: threshold
    formula: |
      total_worked_h = sum of worked_minutes / 60 over the week's CLOSED non-VOIDED punches.
      straight_time_h = total_worked_h - daily_ot_h - daily_dt_h   (hours not already OT/DT by the daily rule)
      weekly_ot_extra_h = max(0, straight_time_h - weekly_ot_threshold_hours)   # default 40
      regular_h = straight_time_h - weekly_ot_extra_h
      ot_h  = daily_ot_h + weekly_ot_extra_h
      dt_h  = daily_dt_h
      regular_minutes/ot_minutes/dt_minutes = round each *60 to nearest integer minute.
    input_set: "same week punch set as daily_overtime_breakdown; consumes daily_ot_h/daily_dt_h from it"
    variants:
      - name: ca_daily_method
        when: "worksite WageRuleSet.daily_ot_enabled == true (e.g. CA)"
        difference: "daily_ot_h/daily_dt_h are non-zero, so weekly_ot_extra_h only captures non-daily-OT hours beyond 40 — daily and weekly OT are NOT double-counted; DT can be non-zero."
      - name: flsa_weekly_method
        when: "worksite WageRuleSet.daily_ot_enabled == false (e.g. TX)"
        difference: "daily_ot_h == daily_dt_h == 0, so ot_h = max(0, total_worked_h - 40) and dt_h = 0 — pure FLSA weekly overtime."

  - name: regular_rate_of_pay
    trigger: "TimesheetWeek recompute (before gross_wages)"
    algorithm: weighted_scoring
    formula: |
      Computes the FLSA "regular rate" used to value OT/DT premiums:
        straight_earnings_cents = base_rate_cents * total_worked_h          # straight-time on ALL hours
        nondiscretionary_bonus_cents = 0   (no bonus entity in scope; reserved at 0)
        regular_rate_cents_per_h = round_half_up((straight_earnings_cents + nondiscretionary_bonus_cents) / total_worked_h)
      OT premium is the HALF-TIME uplift (0.5x) because straight time is already paid on all hours;
      DT premium is the FULL extra (1.0x) on top of straight time.
    input_set: "the week's total_worked_h and the Employee.base_rate_cents"
    constants:
      OT_PREMIUM_MULTIPLIER: 0.5
      DT_PREMIUM_MULTIPLIER: 1.0
    precision: "regular_rate_cents_per_h rounded to whole cents, round_half_up, before premium multiplication"

  - name: gross_wages
    trigger: "TimesheetWeek recompute"
    algorithm: aggregation
    formula: |
      If Employee.classification == EXEMPT: regular_minutes=ot_minutes=dt_minutes=0,
        break_premium_hours=0, tip_true_up_cents=0, gross_wages_cents=0 (salaried; hourly pay out of scope).
      Else (NON_EXEMPT):
        straight_cents  = round_half_up(base_rate_cents * total_worked_h)
        ot_premium_cents = round_half_up(regular_rate_cents_per_h * OT_PREMIUM_MULTIPLIER * ot_minutes/60)
        dt_premium_cents = round_half_up(regular_rate_cents_per_h * DT_PREMIUM_MULTIPLIER * dt_minutes/60)
        break_premium_cents = break_premium_hours * base_rate_cents
        gross_wages_cents = straight_cents + ot_premium_cents + dt_premium_cents
                            + break_premium_cents + tip_true_up_cents
    input_set: "outputs of weekly_overtime_resolution, regular_rate_of_pay, break_premium_count, tip_true_up"
    precision: "each component rounded to whole cents round_half_up, then summed (round-then-sum order is PINNED)"
    variants:
      - name: hourly_nonexempt
        when: "classification == NON_EXEMPT"
        difference: "full wage stack computed"
      - name: exempt_zeroed
        when: "classification == EXEMPT"
        difference: "all hourly/premium fields forced to 0 — exempt employees never accrue OT/DT/break premiums"

  - name: break_premium_count
    trigger: "TimesheetWeek recompute"
    algorithm: aggregation
    formula: |
      Per workday_date in the week, per kind in {MEAL, REST}:
        owed = 1 if (exists a BreakRecord for that shift/day/kind with taken=false)
                    AND WageRuleSet.<kind>_break_premium_enabled
                    AND Employee.classification == NON_EXEMPT
               else 0
        (at most ONE premium per kind per day — multiple missed breaks of the same kind on
         one day still yield exactly 1 premium hour for that kind that day)
      break_premium_hours = sum of owed over all (workday, kind) pairs in the week.
    input_set: "BreakRecords linked via Shift to the employee, whose shift.scheduled_start date is in the workweek"
    constants:
      MAX_MEAL_PREMIUM_PER_DAY: 1
      MAX_REST_PREMIUM_PER_DAY: 1
    precision: "integer hours"

  - name: tip_true_up
    trigger: "TimesheetWeek recompute (only when Employee.is_tipped and NON_EXEMPT)"
    algorithm: threshold
    formula: |
      applicable_min_wage_cents = max(state_min_wage_cents, federal_min_wage_cents)
      tips_cents = sum of declared_cents over the employee's TipDeclarations whose workday_date is in the week
      direct_cash_cents = base_rate_cents * total_worked_h       # base_rate is the tipped cash wage for tipped employees
      required_cents = round_half_up(applicable_min_wage_cents * total_worked_h)
      earned_cents = direct_cash_cents + tips_cents
      tip_true_up_cents = max(0, required_cents - earned_cents)   # employer makes up the shortfall
    input_set: "Employee.base_rate_cents, the week's total_worked_h, TipDeclarations in the week, governing WageRuleSet + Employer"
    constants:
      FEDERAL_MIN_WAGE_CENTS_DEFAULT: 725
    precision: "round_half_up to whole cents; non-tipped or EXEMPT employees yield 0"

  - name: tip_pool_allocation
    trigger: "POST /tip-pools/{id}/distribute"
    algorithm: waterfall_allocation
    formula: |
      pooled_cents = sum of declared_cents over TipDeclarations with pool_id == this pool.
      For each contributing employee e, weight_e = sum of worked_minutes over e's CLOSED non-VOIDED
      punches whose workday_date == pool.workday_date.
      total_weight = sum of weight_e (must be > 0, else ERR_EMPTY_TIP_POOL).
      raw_e = pooled_cents * weight_e / total_weight
      floor_e = floor(raw_e) (whole cents).  remainder = pooled_cents - sum(floor_e).
      Distribute the `remainder` leftover cents one cent at a time to employees ordered by
      weight_e DESC, tie-break created_at ASC of the employee (never by id), until remainder is 0.
    input_set: "TipDeclarations contributed to the pool; each contributing employee's same-day worked_minutes"
    constants: {}
    precision: "integer cents; floor then waterfall remainder — order is PINNED (weight DESC, created_at ASC)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role header present and a known role", error_id: ERR_UNAUTHENTICATED,        http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "X-User-ID header present for entity_backed roles (Employee)", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all employee-acting endpoints" }
  - { priority: 3,  category: authz,                check: "role permitted for this operation per §1.7", error_id: ERR_FORBIDDEN,             http_status: 403, applies_to: "all" }
  - { priority: 4,  category: existence,            check: "path/body referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5,  category: existence,            check: "no WageRuleSet exists for (employer_id, worksite.state_code) governing this employee's work", error_id: ERR_NO_WAGE_RULESET, http_status: 422, applies_to: "timesheet submit, shift create" }
  - { priority: 6,  category: business_referential, check: "ownership: acting Employee.id == resource.employee_id where ownership required", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "punch open/close acting as Employee" }
  - { priority: 7,  category: state,                check: "target resource in a state that permits this transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 8,  category: state,                check: "TimePunch's owning TimesheetWeek is not APPROVED/LOCKED for edits/voids", error_id: ERR_TIMESHEET_FROZEN, http_status: 409, applies_to: "punch edit, punch void" }
  - { priority: 9,  category: state,                check: "no OPEN punch exists in the week on timesheet submit", error_id: ERR_OPEN_PUNCH_IN_WEEK, http_status: 409, applies_to: "timesheet submit" }
  - { priority: 10, category: business_safety,      check: "exempt-classification employees cannot be the subject of break-premium or OT claims (no-op, never an error path on its own)", error_id: ERR_EXEMPT_NOT_ELIGIBLE, http_status: 422, applies_to: "break record create for EXEMPT employee with taken=false flagged as premium" }
  - { priority: 11, category: business_constraint,  check: "TimeEdit reason must be non-empty", error_id: ERR_EDIT_REASON_REQUIRED, http_status: 422, applies_to: "punch edit" }
  - { priority: 12, category: business_constraint,  check: "resulting/observed punch duration must be strictly positive (clock_out > clock_in)", error_id: ERR_NEGATIVE_DURATION, http_status: 422, applies_to: "punch close, punch edit" }
  - { priority: 13, category: business_temporal,    check: "a new TimePunch's [clock_in, clock_out] interval must not overlap another non-VOIDED CLOSED punch for the same employee; intervals are treated as CLOSED on both ends, so a new clock_in exactly equal to a prior punch's clock_out DOES collide (a worker cannot be in two places at the instant of changeover)", error_id: ERR_PUNCH_OVERLAP, http_status: 409, applies_to: "shift punch open" }
  - { priority: 14, category: business_temporal,    check: "an employee may have at most one OPEN punch at a time", error_id: ERR_PUNCH_ALREADY_OPEN, http_status: 409, applies_to: "shift punch open" }
  - { priority: 15, category: business_temporal,    check: "Shift.scheduled_end strictly after scheduled_start", error_id: ERR_INVALID_SCHEDULE, http_status: 422, applies_to: "shift create" }
  - { priority: 16, category: business_temporal,    check: "a new Shift for the same employee must not overlap an existing non-CANCELLED shift; intervals are HALF-OPEN [start,end), so back-to-back shifts where one's end equals the next's start do NOT overlap", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "shift create" }
  - { priority: 17, category: business_constraint,  check: "tip pool distribute requires >=1 contributing declaration with positive total weight", error_id: ERR_EMPTY_TIP_POOL, http_status: 409, applies_to: "tip-pool distribute" }
  - { priority: 18, category: business_constraint,  check: "payroll finalize requires >=1 LOCKED week", error_id: ERR_EMPTY_PAYROLL_RUN, http_status: 409, applies_to: "payroll finalize" }
  - { priority: 19, category: business_constraint,  check: "included week's workweek_start within [period_start, period_end]", error_id: ERR_WEEK_OUTSIDE_PERIOD, http_status: 422, applies_to: "payroll include" }
  - { priority: 20, category: business_constraint,  check: "approver/rejecter X-User-ID must differ from submitter and from any punch editor in the week", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "timesheet approve, timesheet reject" }
  - { priority: 21, category: business_constraint,  check: "OCC: expected_timesheet_week_version equals current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "timesheet approve, payroll include" }
  - { priority: 22, category: business_constraint,  check: "request body field types/enums valid; required fields present", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: "all writes" }
  - { priority: 23, category: business_constraint,  check: "WageRuleSet.state_code unique per employer", error_id: ERR_DUPLICATE_RULESET, http_status: 409, applies_to: "wage-ruleset create" }
  - { priority: 24, category: business_constraint,  check: "numeric money/duration fields are non-negative (base_rate_cents, declared_cents, minutes >= 0)", error_id: ERR_VALIDATION, http_status: 422, applies_to: "employee create, tip-declaration create, break-record create" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Employer / configuration ----
  - { method: POST, path: "/employers", description: "Create employer", roles: [PayrollAdmin], code: 201, input: [legal_name, "workweek_start_dow?", "federal_min_wage_cents?", "federal_tipped_cash_wage_cents?"], output: Employer, side_effects: [] }
  - { method: GET,  path: "/employers/{id}", description: "Get employer", roles: [PayrollAdmin, Supervisor], code: 200, input: [], output: Employer, side_effects: [] }
  - { method: GET,  path: "/employers/{id}/wage-rulesets", description: "List an employer's wage rule sets (reverse-reachability for WageRuleSet.employer_id)", roles: [PayrollAdmin, Supervisor], code: 200, input: [], output: "WageRuleSet[]", side_effects: [] }
  - { method: POST, path: "/wage-rulesets", description: "Create a per-state wage rule set for an employer", roles: [PayrollAdmin], code: 201, input: [employer_id, state_code, "daily_ot_enabled?", "daily_ot_threshold_hours?", "daily_dt_threshold_hours?", "weekly_ot_threshold_hours?", "seventh_day_rule_enabled?", "meal_break_premium_enabled?", "rest_break_premium_enabled?", "state_min_wage_cents?"], output: WageRuleSet, side_effects: ["enforce (employer_id,state_code) uniqueness"] }
  - { method: POST, path: "/worksites", description: "Create worksite", roles: [PayrollAdmin], code: 201, input: [employer_id, name, state_code], output: Worksite, side_effects: [] }
  - { method: GET,  path: "/worksites", description: "List/filter worksites", roles: [PayrollAdmin, Supervisor], code: 200, input: ["employer_id?", "limit?", "offset?"], output: "Worksite[]", side_effects: [] }
  - { method: GET,  path: "/worksites/{id}", description: "Get worksite", roles: [PayrollAdmin, Supervisor], code: 200, input: [], output: Worksite, side_effects: [] }

  # ---- Employee ----
  - { method: POST, path: "/employees", description: "Create employee", roles: [PayrollAdmin], code: 201, input: [employer_id, home_worksite_id, full_name, classification, base_rate_cents, "is_tipped?"], output: Employee, side_effects: ["status initialized ACTIVE"] }
  - { method: GET,  path: "/employees", description: "List/filter employees", roles: [PayrollAdmin, Supervisor], code: 200, input: ["employer_id?", "home_worksite_id?", "limit?", "offset?"], output: "Employee[]", side_effects: [] }
  - { method: GET,  path: "/employees/{id}", description: "Get employee", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: [], output: Employee, side_effects: [] }

  # ---- Shift + punch ----
  - { method: POST, path: "/shifts", description: "Schedule a shift", roles: [Supervisor], code: 201, input: [employee_id, worksite_id, scheduled_start, scheduled_end], output: Shift, side_effects: ["status SCHEDULED"] }
  - { method: GET,  path: "/shifts", description: "List/filter shifts", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: ["employee_id?", "worksite_id?", "limit?", "offset?"], output: "Shift[]", side_effects: [] }
  - { method: GET,  path: "/shifts/{id}", description: "Get shift (with detention fields)", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: [], output: Shift, side_effects: [] }
  - { method: POST, path: "/shifts/{id}/cancel", description: "Cancel a SCHEDULED shift", roles: [Supervisor], code: 200, input: [], output: Shift, side_effects: ["status CANCELLED"] }
  - { method: POST, path: "/shifts/{id}/punches", description: "Open a time punch (clock in) for a shift", roles: [Employee], code: 201, input: [clock_in], output: TimePunch, side_effects: ["TimePunch OPEN created; Shift -> OPEN"] }
  - { method: GET,  path: "/shifts/{id}/punches", description: "List punches for a shift (reverse-reachability for TimePunch.shift_id)", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: [], output: "TimePunch[]", side_effects: [] }
  - { method: GET,  path: "/punches", description: "List/filter punches", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: ["employee_id?", "shift_id?", "workday_date?", "limit?", "offset?"], output: "TimePunch[]", side_effects: [] }
  - { method: GET,  path: "/punches/{id}", description: "Get punch", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: [], output: TimePunch, side_effects: [] }
  - { method: POST, path: "/punches/{id}/close", description: "Close a punch (clock out)", roles: [Employee], code: 200, input: [clock_out], output: TimePunch, side_effects: ["worked_minutes computed; Shift detention recomputed; Shift -> CLOSED"] }
  - { method: POST, path: "/punches/{id}/edits", description: "Apply an audited edit to a CLOSED punch", roles: [Supervisor], code: 201, input: [field, new_value, reason], output: TimeEdit, side_effects: ["append TimeEdit; recompute worked_minutes/detention; cascade timesheet recompute"] }
  - { method: GET,  path: "/punches/{id}/edits", description: "List the audit trail for a punch (reverse-reachability for TimeEdit.punch_id)", roles: [PayrollAdmin, Supervisor], code: 200, input: [], output: "TimeEdit[]", side_effects: [] }
  - { method: POST, path: "/punches/{id}/void", description: "Void a punch", roles: [Supervisor], code: 200, input: [], output: TimePunch, side_effects: ["status VOIDED; worked_minutes 0; cascade timesheet recompute"] }

  # ---- Break records ----
  - { method: POST, path: "/break-records", description: "Record a meal/rest break taken or missed", roles: [Supervisor, Employee], code: 201, input: [shift_id, employee_id, kind, taken, "minutes?"], output: BreakRecord, side_effects: ["compute premium_owed"] }
  - { method: GET,  path: "/break-records", description: "List/filter break records (reverse-reachability for BreakRecord.shift_id and .employee_id)", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: ["shift_id?", "employee_id?", "limit?", "offset?"], output: "BreakRecord[]", side_effects: [] }
  - { method: GET,  path: "/break-records/{id}", description: "Get a break record", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: [], output: BreakRecord, side_effects: [] }

  # ---- Tips ----
  - { method: POST, path: "/tip-declarations", description: "Declare workday tips", roles: [Supervisor, Employee], code: 201, input: [employee_id, workday_date, declared_cents, "pool_id?"], output: TipDeclaration, side_effects: ["recompute owning TipPool.pooled_cents when pool_id set"] }
  - { method: GET,  path: "/tip-declarations", description: "List/filter tip declarations (reverse-reachability for TipDeclaration.employee_id and .pool_id)", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: ["employee_id?", "pool_id?", "workday_date?", "limit?", "offset?"], output: "TipDeclaration[]", side_effects: [] }
  - { method: GET,  path: "/tip-declarations/{id}", description: "Get a tip declaration", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: [], output: TipDeclaration, side_effects: [] }
  - { method: POST, path: "/tip-pools", description: "Open a tip pool for a worksite/day", roles: [Supervisor], code: 201, input: [worksite_id, workday_date], output: TipPool, side_effects: ["status OPEN"] }
  - { method: GET,  path: "/tip-pools", description: "List/filter tip pools (reverse-reachability for TipPool.worksite_id)", roles: [PayrollAdmin, Supervisor], code: 200, input: ["worksite_id?", "workday_date?", "limit?", "offset?"], output: "TipPool[]", side_effects: [] }
  - { method: GET,  path: "/tip-pools/{id}", description: "Get tip pool", roles: [PayrollAdmin, Supervisor], code: 200, input: [], output: TipPool, side_effects: [] }
  - { method: POST, path: "/tip-pools/{id}/distribute", description: "Distribute pooled tips by worked-minutes share", roles: [Supervisor], code: 200, input: [], output: TipPool, side_effects: ["allocate pooled_cents; status DISTRIBUTED"] }
  - { method: POST, path: "/tip-pools/{id}/cancel", description: "Cancel a tip pool", roles: [Supervisor], code: 200, input: [], output: TipPool, side_effects: ["status CANCELLED; detach declarations"] }

  # ---- Timesheet week ----
  - { method: POST, path: "/timesheet-weeks", description: "Open a draft timesheet week for an employee", roles: [Supervisor], code: 201, input: [employee_id, workweek_start], output: TimesheetWeek, side_effects: ["status DRAFT"] }
  - { method: GET,  path: "/timesheet-weeks", description: "List/filter timesheet weeks (reverse-reachability for TimesheetWeek.employee_id and .payroll_run_id)", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: ["employee_id?", "payroll_run_id?", "status?", "limit?", "offset?"], output: "TimesheetWeek[]", side_effects: [] }
  - { method: GET,  path: "/timesheet-weeks/{id}", description: "Get a timesheet week with computed wage fields", roles: [PayrollAdmin, Supervisor, Employee], code: 200, input: [], output: TimesheetWeek, side_effects: [] }
  - { method: POST, path: "/timesheet-weeks/{id}/submit", description: "Submit (or resubmit) a timesheet week — recomputes all wage fields", roles: [Supervisor], code: 200, input: [], output: TimesheetWeek, side_effects: ["recompute wages; status SUBMITTED; version+1"] }
  - { method: POST, path: "/timesheet-weeks/{id}/approve", description: "Approve a submitted timesheet (segregation of duties + OCC)", roles: [Supervisor], code: 200, input: [expected_timesheet_week_version], output: TimesheetWeek, side_effects: ["status APPROVED; version+1"] }
  - { method: POST, path: "/timesheet-weeks/{id}/reject", description: "Reject a submitted timesheet back to the submitter", roles: [Supervisor], code: 200, input: [], output: TimesheetWeek, side_effects: ["status REJECTED; version+1"] }

  # ---- Payroll run ----
  - { method: POST, path: "/payroll-runs", description: "Open a payroll run for a pay period", roles: [PayrollAdmin], code: 201, input: [employer_id, period_start, period_end], output: PayrollRun, side_effects: ["status OPEN"] }
  - { method: GET,  path: "/payroll-runs", description: "List/filter payroll runs (reverse-reachability for PayrollRun.employer_id)", roles: [PayrollAdmin, Supervisor], code: 200, input: ["employer_id?", "status?", "limit?", "offset?"], output: "PayrollRun[]", side_effects: [] }
  - { method: GET,  path: "/payroll-runs/{id}", description: "Get payroll run with totals", roles: [PayrollAdmin, Supervisor], code: 200, input: [], output: PayrollRun, side_effects: [] }
  - { method: POST, path: "/payroll-runs/{id}/include", description: "Lock an APPROVED timesheet week into this run (OCC on the week)", roles: [PayrollAdmin], code: 200, input: [timesheet_week_id, expected_timesheet_week_version], output: PayrollRun, side_effects: ["week -> LOCKED; week.version+1; run totals incremented"] }
  - { method: POST, path: "/payroll-runs/{id}/finalize", description: "Finalize an open run", roles: [PayrollAdmin], code: 200, input: [], output: PayrollRun, side_effects: ["status FINALIZED"] }
  - { method: POST, path: "/payroll-runs/{id}/cancel", description: "Cancel an open run, reverting locked weeks", roles: [PayrollAdmin], code: 200, input: [], output: PayrollRun, side_effects: ["LOCKED weeks revert to APPROVED; totals reset; status CANCELLED"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,      http: 401, condition: "X-User-Role missing/unknown, or X-User-ID missing where required" }
  - { id: ERR_FORBIDDEN,            http: 403, condition: "role not permitted for the operation per §1.7" }
  - { id: ERR_NOT_RESOURCE_OWNER,   http: 403, condition: "acting Employee.id does not match the resource's employee_id where ownership is required" }
  - { id: ERR_NOT_FOUND,            http: 404, condition: "referenced resource does not exist" }
  - { id: ERR_NO_WAGE_RULESET,      http: 422, condition: "no WageRuleSet for (employer_id, worksite.state_code) governs the work being submitted/scheduled" }
  - { id: ERR_INVALID_STATE,        http: 409, condition: "transition not permitted from the resource's current state" }
  - { id: ERR_TIMESHEET_FROZEN,     http: 409, condition: "punch edit/void attempted while owning TimesheetWeek is APPROVED or LOCKED" }
  - { id: ERR_OPEN_PUNCH_IN_WEEK,   http: 409, condition: "timesheet submit while an OPEN punch exists in the workweek" }
  - { id: ERR_EXEMPT_NOT_ELIGIBLE,  http: 422, condition: "premium/OT claim subject is an EXEMPT employee" }
  - { id: ERR_EDIT_REASON_REQUIRED, http: 422, condition: "TimeEdit submitted with empty reason" }
  - { id: ERR_NEGATIVE_DURATION,    http: 422, condition: "clock_out not strictly after clock_in (on close or after an edit)" }
  - { id: ERR_PUNCH_OVERLAP,        http: 409, condition: "new punch interval overlaps an existing non-VOIDED punch for the same employee" }
  - { id: ERR_PUNCH_ALREADY_OPEN,   http: 409, condition: "employee already has an OPEN punch" }
  - { id: ERR_INVALID_SCHEDULE,     http: 422, condition: "shift scheduled_end not strictly after scheduled_start" }
  - { id: ERR_SHIFT_OVERLAP,        http: 409, condition: "new shift half-open interval [start,end) overlaps an existing non-CANCELLED shift for the same employee" }
  - { id: ERR_EMPTY_TIP_POOL,       http: 409, condition: "tip pool distribute with no contributing declaration or zero total weight" }
  - { id: ERR_EMPTY_PAYROLL_RUN,    http: 409, condition: "payroll finalize with no LOCKED week" }
  - { id: ERR_WEEK_OUTSIDE_PERIOD,  http: 422, condition: "included week's workweek_start outside [period_start, period_end]" }
  - { id: ERR_SEGREGATION_OF_DUTIES,http: 409, condition: "approver/rejecter equals submitter, or approver edited a punch in the week" }
  - { id: ERR_STALE_VERSION,        http: 412, condition: "expected_timesheet_week_version does not match current version (OCC)" }
  - { id: ERR_INVALID_REQUEST,      http: 422, condition: "missing required field, bad type, or invalid enum value" }
  - { id: ERR_DUPLICATE_RULESET,    http: 409, condition: "WageRuleSet with same (employer_id, state_code) already exists" }
  - { id: ERR_VALIDATION,           http: 422, condition: "request body fails a generic field-level constraint (e.g. negative cents)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PayrollAdmin
    description: "Operator who configures employers/rule sets/worksites/employees and runs payroll. Cannot punch or approve own work into existence."
    identity: "opaque"
    exclusive_operations:
      - "create/get employer, wage rule set, worksite, employee"
      - "open/get/list payroll run, include week, finalize run, cancel run"
    shared_operations:
      - "read worksites, employees, shifts, punches, timesheet weeks, tip pools"
  - name: Supervisor
    description: "Floor supervisor who schedules shifts, records breaks, edits punches, manages tip pools, and submits/approves/rejects timesheets (subject to segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "create/cancel shift; edit punch; void punch"
      - "open/distribute/cancel tip pool"
      - "open/submit/approve/reject timesheet week"
    shared_operations:
      - "record break records; declare tips; read most resources"
  - name: Employee
    description: "Worker who clocks in/out on their own shifts, records their own breaks, and declares their own tips."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "open a punch (clock in) on own shift; close own punch (clock out)"
    shared_operations:
      - "record own break records; declare own tips; read own shifts/punches/timesheets/employee record"
