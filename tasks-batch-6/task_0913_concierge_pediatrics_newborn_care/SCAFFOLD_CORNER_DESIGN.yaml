            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Rida", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_id}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${fam_v0}" }
              as: PracticeAdmin
              captures: { mem_id: "$.data.id" }
            - call: "GET /peds/invoices"
              payload: { family_id: "${fam_id}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /peds/invoices/${inv_id}/issue"
              payload: {}
              as: BillingSpecialist
            - call: "POST /peds/invoices/${inv_id}/pay"
              payload: { amount_paid_cents: 40000 }
              as: BillingSpecialist
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T20:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/encounters"
              payload: { membership_id: "${mem_id}", encounter_type: "SICK_VISIT", modality: "IN_PERSON", patient_state_code: "CA", started_at: "2026-06-15T10:00:00Z" }
              as: CareCoordinator
              captures: { enc_id: "$.data.id" }
          trigger:
            - call: "POST /peds/encounters/${enc_id}/submit-billing"
              payload: {}
              as: CareCoordinator
