# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Boat & Watercraft Dry-Stack Storage Marina — Expert
# Breadth probe across §1.1–§1.7 surface; §1.8 already covers the depth corners.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_marina_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Marina, entities.Marina.fields.forklift_service_minutes, entities.Marina.fields.forklift_buffer_minutes]
        distinguishing_aspect: "POST /marina/marinas with only name -> 201, forklift_service_minutes defaults to 30, forklift_buffer_minutes to 15, timezone to UTC, version == 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
          trigger:
            - call: "POST /marina/marinas"
              payload: { name: "Solo" }
              as: DockMaster
              captures: { mid: $.data.id, svc: $.data.forklift_service_minutes }
          assert:
            - "Marina.${mid}.forklift_service_minutes == 30"
            - "Marina.${mid}.forklift_buffer_minutes == 15"
            - "Marina.${mid}.version == 1"

      - name: get_vessel_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Vessel, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /marina/vessels/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no vessels)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
          trigger:
            - call: "GET /marina/vessels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_rack_missing_size_class_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Rack.fields.size_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /marina/racks omitting required size_class -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A marina exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /marina/racks"
              payload: { marina_id: "${mid}", bay_label: "X-1", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: vessel_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.Vessel.fields.location_status, entities.Vessel.fields.billing_status]
        distinguishing_aspect: "POST /marina/vessels ignores any client-supplied location_status/billing_status; server sets location_status=OFF_SITE, billing_status=UNBILLED regardless of input."
        test_recipe:
          setup: ["A marina and owner exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${mid}", full_name: "O", email: "o@x.com" }
              as: DockMaster
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /marina/vessels"
              payload: { marina_id: "${mid}", owner_id: "${oid}", name: "Fresh", loa_ft: 20.00, beam_ft: 8.00, dry_weight_lbs: 3000 }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { vid: $.data.id }
          assert:
            - "Vessel.${vid}.location_status == OFF_SITE"
            - "Vessel.${vid}.billing_status == UNBILLED"

      - name: owner_account_balance_computed_from_issued_invoices
        claim_type: Computed Fields
        grounds: [entities.BoatOwnerAccount.fields.account_balance_cents, calculations.compute_account_balance]
        distinguishing_aspect: "After issuing a SERVICE_ORDER invoice of 18000 (HAUL_OUT) and a 25000 (WINTERIZATION) invoice, GET /marina/owners/{id} reports account_balance_cents == 43000 (sum of ISSUED amounts)."
        test_recipe:
          setup: ["An owner with a vessel; two FULFILLED-or-ORDERED service orders invoiced as ISSUED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${mid}", full_name: "O", email: "o@x.com" }
              as: DockMaster
              captures: { oid: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${mid}", owner_id: "${oid}", name: "V", loa_ft: 20.00, beam_ft: 8.00, dry_weight_lbs: 3000 }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { vid: $.data.id }
            - call: "POST /marina/service-orders"
              payload: { vessel_id: "${vid}", service_kind: "HAUL_OUT" }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { so1: $.data.id }
            - call: "POST /marina/service-orders"
              payload: { vessel_id: "${vid}", service_kind: "WINTERIZATION" }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { so2: $.data.id }
            - call: "POST /marina/invoices"
              payload: { owner_id: "${oid}", source_kind: "SERVICE_ORDER", source_id: "${so1}" }
              as: BillingClerk
            - call: "POST /marina/invoices"
              payload: { owner_id: "${oid}", source_kind: "SERVICE_ORDER", source_id: "${so2}" }
              as: BillingClerk
          trigger:
            - call: "GET /marina/owners/${oid}"
              payload: {}
              as: BillingClerk
              captures: { bal: $.data.account_balance_cents }
          assert:
            - "BoatOwnerAccount.${oid}.account_balance_cents == 43000"

      - name: list_vessels_pagination_envelope
        claim_type: Listing
        grounds: [entities.Vessel, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /marina/vessels?limit=1 returns response_type array with total_count and has_more reflecting more than one vessel."
        test_recipe:
          setup: ["An owner with two vessels."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${mid}", full_name: "O", email: "o@x.com" }
              as: DockMaster
              captures: { oid: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${mid}", owner_id: "${oid}", name: "V1", loa_ft: 20.00, beam_ft: 8.00, dry_weight_lbs: 3000 }
              as: BoatOwner
              as_user_id: "${oid}"
            - call: "POST /marina/vessels"
              payload: { marina_id: "${mid}", owner_id: "${oid}", name: "V2", loa_ft: 21.00, beam_ft: 8.00, dry_weight_lbs: 3100 }
              as: BoatOwner
              as_user_id: "${oid}"
          trigger:
            - call: "GET /marina/vessels"
              payload: { owner_id: "${oid}", limit: 1, offset: 0 }
              as: BoatOwner
              as_user_id: "${oid}"
          assert:
            - "response total_count == 2 and has_more == true with limit 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminate_already_terminated_agreement_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.StorageAgreement.ACTIVE_to_TERMINATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A TERMINATED agreement is terminal; a second terminate -> ERR_INVALID_STATE (409), no side effects."
        test_recipe:
          setup: ["An ACTIVE agreement that is then terminated (TERMINATED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${mid}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rid: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${mid}", full_name: "O", email: "o@x.com" }
              as: DockMaster
              captures: { oid: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${mid}", owner_id: "${oid}", name: "V", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { vid: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vid}", carrier_name: "A", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { pid: $.data.id }
            - call: "POST /marina/insurance-policies/${pid}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vid}", rack_id: "${rid}" }
              as: DockMaster
              captures: { aid: $.data.id }
            - call: "GET /marina/racks/${rid}"
              payload: {}
              as: DockMaster
              captures: { rv: $.data.version }
            - call: "POST /marina/storage-agreements/${aid}/activate"
              payload: { expected_rack_version: "${rv}" }
              as: DockMaster
            - call: "POST /marina/storage-agreements/${aid}/terminate"
              payload: {}
              as: DockMaster
          trigger:
            - call: "POST /marina/storage-agreements/${aid}/terminate"
              payload: {}
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: winterize_pending_coi_agreement_invalid_from
        claim_type: Invalid Transitions
        grounds: [state_machines.StorageAgreement.ACTIVE_to_WINTERIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Winterize is only defined from ACTIVE; calling it on a PENDING_COI agreement -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PENDING_COI agreement (never activated)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${mid}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rid: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${mid}", full_name: "O", email: "o@x.com" }
              as: DockMaster
              captures: { oid: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${mid}", owner_id: "${oid}", name: "V", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { vid: $.data.id }
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vid}", rack_id: "${rid}" }
              as: DockMaster
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /marina/storage-agreements/${aid}/winterize"
              payload: {}
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: winterize_then_reactivate_seasonal_loop
        claim_type: cyclic
        grounds: [state_machines.StorageAgreement.ACTIVE_to_WINTERIZED, state_machines.StorageAgreement.WINTERIZED_to_ACTIVE, entities.Vessel.fields.billing_status]
        distinguishing_aspect: "Seasonal revert loop: ACTIVE -> WINTERIZED (billing_status WINTER_HOLD) -> ACTIVE (billing_status back to ACTIVE_STORAGE)."
        test_recipe:
          setup: ["An ACTIVE agreement, vessel RACKED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${mid}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rid: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${mid}", full_name: "O", email: "o@x.com" }
              as: DockMaster
              captures: { oid: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${mid}", owner_id: "${oid}", name: "V", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { vid: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vid}", carrier_name: "A", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { pid: $.data.id }
            - call: "POST /marina/insurance-policies/${pid}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vid}", rack_id: "${rid}" }
              as: DockMaster
              captures: { aid: $.data.id }
            - call: "GET /marina/racks/${rid}"
              payload: {}
              as: DockMaster
              captures: { rv: $.data.version }
            - call: "POST /marina/storage-agreements/${aid}/activate"
              payload: { expected_rack_version: "${rv}" }
              as: DockMaster
            - call: "POST /marina/storage-agreements/${aid}/winterize"
              payload: {}
              as: DockMaster
          trigger:
            - call: "POST /marina/storage-agreements/${aid}/reactivate"
              payload: {}
              as: DockMaster
              captures: { st: $.data.status }
          assert:
            - "StorageAgreement.${aid}.status == ACTIVE after reactivate"
            - "Vessel.${vid}.billing_status == ACTIVE_STORAGE after reactivate"

      - name: splash_before_slot_window_open_returns_slot_not_yet_open
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=14]", state_machines.LaunchRequest.SCHEDULED_to_SPLASHED, "errors[ERR_SLOT_NOT_YET_OPEN]"]
        distinguishing_aspect: "Splashing a SCHEDULED launch while logical clock (2026-04-01) is still before the slot window_start (2026-04-02T10:00) -> ERR_SLOT_NOT_YET_OPEN (409)."
        test_recipe:
          setup: ["A SCHEDULED launch with slot window_start 2026-04-02T10:00; clock left at 2026-04-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
            - call: "POST /marina/forklifts"
              payload: { marina_id: "${mid}", label: "FL-1", max_lift_weight_lbs: 15000 }
              as: DockMaster
            - call: "POST /marina/racks"
              payload: { marina_id: "${mid}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rid: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${mid}", full_name: "O", email: "o@x.com" }
              as: DockMaster
              captures: { oid: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${mid}", owner_id: "${oid}", name: "V", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { vid: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vid}", carrier_name: "A", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { pid: $.data.id }
            - call: "POST /marina/insurance-policies/${pid}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vid}", rack_id: "${rid}" }
              as: DockMaster
              captures: { aid: $.data.id }
            - call: "GET /marina/racks/${rid}"
              payload: {}
              as: DockMaster
              captures: { rv: $.data.version }
            - call: "POST /marina/storage-agreements/${aid}/activate"
              payload: { expected_rack_version: "${rv}" }
              as: DockMaster
            - call: "POST /marina/launch-requests"
              payload: { vessel_id: "${vid}", requested_window_start: "2026-04-02T10:00:00Z" }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { lid: $.data.id }
            - call: "POST /marina/launch-requests/${lid}/schedule"
              payload: {}
              as: DockMaster
          trigger:
            - call: "POST /marina/launch-requests/${lid}/splash"
              payload: {}
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SLOT_NOT_YET_OPEN"

      - name: waitlist_offer_lapse_releases_held_rack
        claim_type: Compensation
        grounds: [state_machines.WaitlistEntry.OFFERED_to_EXPIRED, entities.Rack.fields.status, "validations[priority=15]"]
        distinguishing_aspect: "An OFFERED entry held a rack OCCUPIED; after the offer expires and is lapsed, the held Rack returns to AVAILABLE and offered_rack_id clears — compensation with no drift."
        test_recipe:
          setup: ["A WAITING entry promoted to OFFERED holding an AVAILABLE rack; clock advanced past offer_expires_at."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${mid}", bay_label: "S-1", size_class: "SMALL", max_loa_ft: 22.00, max_beam_ft: 9.00, max_weight_lbs: 6000 }
              as: DockMaster
              captures: { rid: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${mid}", full_name: "O", email: "o@x.com" }
              as: DockMaster
              captures: { oid: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${mid}", owner_id: "${oid}", name: "V", loa_ft: 20.00, beam_ft: 8.00, dry_weight_lbs: 3000 }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { vid: $.data.id }
            - call: "POST /marina/waitlist"
              payload: { vessel_id: "${vid}", requested_size_class: "SMALL", deposit_paid: true }
              as: BoatOwner
              as_user_id: "${oid}"
              captures: { eid: $.data.id }
            - call: "POST /marina/waitlist/promote"
              payload: { marina_id: "${mid}", requested_size_class: "SMALL" }
              as: DockMaster
            - call: "GET /marina/waitlist/${eid}"
              payload: {}
              as: DockMaster
              captures: { exp: $.data.offer_expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BillingClerk
          trigger:
            - call: "POST /marina/waitlist/${eid}/lapse"
              payload: {}
              as: BillingClerk
          assert:
            - "WaitlistEntry.${eid}.status == EXPIRED"
            - "Rack.${rid}.status == AVAILABLE after lapse"

  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_bay_label_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "errors[ERR_DUPLICATE_BAY_LABEL]", entities.Rack.fields.bay_label]
        distinguishing_aspect: "Creating a second rack with bay_label 'M-1' in the same marina -> ERR_DUPLICATE_BAY_LABEL (409)."
        test_recipe:
          setup: ["A marina with one rack bay_label 'M-1'."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${mid}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
          trigger:
            - call: "POST /marina/racks"
              payload: { marina_id: "${mid}", bay_label: "M-1", size_class: "LARGE", max_loa_ft: 40.00, max_beam_ft: 14.00, max_weight_lbs: 12000 }
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_BAY_LABEL"

      - name: invoice_invalid_period_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=18]", "errors[ERR_INVALID_PERIOD]", entities.StorageInvoice.fields.variant]
        distinguishing_aspect: "A FINAL STORAGE_AGREEMENT invoice with period_end <= period_start -> ERR_INVALID_PERIOD (422)."
        test_recipe:
          setup: ["An ACTIVE agreement and its owner."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "M" }
              as: DockMaster
              captures: { mid: $.data.id }
            - call: "POST /marina/racks"
