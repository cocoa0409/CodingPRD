  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bedhold_overlap_half_open_touching_allowed
        grounds:
          - validations[priority=10]
          - state_machines.BedHold.OPEN_to_CLOSED
          - entities.BedHold.fields.leave_start_at
          - entities.BedHold.fields.expected_return_at
          - errors[ERR_BEDHOLD_OVERLAP]
        distinguishing_aspect: |
          BedHold uses HALF-OPEN [start, end) interval semantics: a second bed-hold whose
          window strictly overlaps an existing one is rejected ERR_BEDHOLD_OVERLAP, but a
          window that merely TOUCHES at the boundary (new.start == old.end) would be allowed.
          The conflicting case here (new.start before old.end) proves strict-overlap rejection.
        test_recipe:
          setup:
            - "PRIVATE admission ACTIVE; first bed-hold OPEN over 2026-02-05..2026-02-09, closed RETURNED so the admission is ACTIVE again, leaving a recorded window"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "BHO SNF", cms_certification_number: "CCN-BHO1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "BHO Res", medical_record_number: "MRN-BHO1", date_of_birth: "1953-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "PRIVATE", admit_at: "2026-02-01T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/bed-holds"
              payload: { leave_reason: "THERAPEUTIC", leave_start_at: "2026-02-05T00:00:00Z", expected_return_at: "2026-02-09T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { bh1_id: $.data.id }
            - call: "POST /snf/bed-holds/${bh1_id}/close"
              payload: { return_outcome: "RETURNED", actual_return_at: "2026-02-09T00:00:00Z" }
              as: AdmissionsCoordinator
          trigger:
            - call: "POST /snf/admissions/${adm_id}/bed-holds"
              payload: { leave_reason: "HOSPITAL", leave_start_at: "2026-02-07T00:00:00Z", expected_return_at: "2026-02-11T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == 'ERR_BEDHOLD_OVERLAP'"

      - name: assessment_window_conflict_inclusive_adjacent_collides
        grounds:
          - validations[priority=11]
          - state_machines.MdsAssessment.SCHEDULED_to_IN_PROGRESS
          - entities.MdsAssessment.fields.assessment_reference_date
          - errors[ERR_ASSESSMENT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          MdsAssessment uses INCLUSIVE-CLOSED aggregate-capacity window semantics (only one open
          assessment per type-window), DIFFERENT interval arithmetic from BedHold's half-open
          rule and on a different entity: starting a second ADMISSION_5DAY assessment whose ARD
          window overlaps an already-IN_PROGRESS same-type assessment is rejected
          ERR_ASSESSMENT_WINDOW_CONFLICT even at boundary adjacency.
        test_recipe:
          setup:
            - "Medicare admission ACTIVE with one ADMISSION_5DAY assessment already IN_PROGRESS, and a second SCHEDULED ADMISSION_5DAY assessment whose ARD window overlaps"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "AWC SNF", cms_certification_number: "CCN-AWC1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "AWC Res", medical_record_number: "MRN-AWC1", date_of_birth: "1954-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qs_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "MEDICARE_A", admit_at: "2026-02-01T00:00:00Z", qualifying_stay_id: "${qs_id}" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/assessments"
              payload: { assessment_type: "ADMISSION_5DAY", assessment_reference_date: "2026-02-05T00:00:00Z", pt_function_score: 7, slp_components_count: 1, nta_comorbidity_points: 10 }
              as: MdsCoordinator
              captures: { mds1_id: $.data.id }
            - call: "POST /snf/assessments/${mds1_id}/start"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/admissions/${adm_id}/assessments"
              payload: { assessment_type: "ADMISSION_5DAY", assessment_reference_date: "2026-02-06T00:00:00Z", pt_function_score: 9, slp_components_count: 2, nta_comorbidity_points: 8 }
              as: MdsCoordinator
              captures: { mds2_id: $.data.id }
          trigger:
            - call: "POST /snf/assessments/${mds2_id}/start"
              payload: {}
              as: MdsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == 'ERR_ASSESSMENT_WINDOW_CONFLICT'"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: occupied_bed_count_admit_then_discharge_conserved
        grounds:
          - state_machines.Admission.PENDING_to_ACTIVE
          - state_machines.Admission.DISCHARGE_PLANNED_to_DISCHARGED
          - entities.Facility.fields.occupied_bed_count
        distinguishing_aspect: |
          Conserved quantity Facility.occupied_bed_count: activate (+1) is compensated by
          discharge (-1). Invariant pinned as occupied_bed_count_after == occupied_bed_count_before
          (0 -> 1 -> 0); the forward admit and its compensating discharge leave the bed count
          exactly where it started, no drift.
        test_recipe:
          setup:
            - "PRIVATE admission activated (occupied 1) with an ACTIVE care plan and a SUBMITTED DISCHARGE assessment, moved to DISCHARGE_PLANNED, then discharged"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "OBC SNF", cms_certification_number: "CCN-OBC1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "OBC Res", medical_record_number: "MRN-OBC1", date_of_birth: "1955-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "PRIVATE", admit_at: "2026-02-01T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/care-plans"
              payload: { review_interval_days: 90 }
              as: Physician
              captures: { cp_id: $.data.id }
            - call: "POST /snf/care-plans/${cp_id}/goals"
              payload: { description: "Discharge readiness", target_date: "2026-02-15T00:00:00Z" }
              as: Physician
            - call: "POST /snf/care-plans/${cp_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /snf/admissions/${adm_id}/assessments"
              payload: { assessment_type: "DISCHARGE", assessment_reference_date: "2026-02-10T00:00:00Z", pt_function_score: 12, slp_components_count: 0, nta_comorbidity_points: 4 }
              as: MdsCoordinator
              captures: { mds_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/plan-discharge"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/assessments/${mds_id}/complete"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${mds_id}/submit"
              payload: {}
              as: MdsCoordinator
          trigger:
            - call: "POST /snf/admissions/${adm_id}/discharge"
              payload: { discharge_at: "2026-02-11T00:00:00Z" }
              as: AdmissionsCoordinator
            - call: "GET /snf/facilities/${fac_id}"
              payload: {}
              as: Administrator
              captures: { occ: $.data.occupied_bed_count }
          assert:
            - "Facility.${fac_id}.occupied_bed_count == 0"

      - name: covered_day_count_paid_bedhold_round_trip_conserved
        grounds:
          - state_machines.Resident.ADMITTED_to_ON_LEAVE
          - state_machines.BedHold.OPEN_to_CLOSED
          - calculations.bed_hold_days
          - entities.Admission.fields.covered_day_count
        distinguishing_aspect: |
          DIFFERENT conserved quantity Admission.covered_day_count: for a MEDICAID resident
          (paid_bedhold_cap 10), opening a 3-midnight bed-hold and closing it RETURNED leaves
          covered_day_count unchanged because all 3 leave days are PAID (paid_day_count 3,
          unpaid 0), so the close subtracts unpaid_day_count == 0. Pinned as
          covered_day_count_after == covered_day_count_before (both 0).
        test_recipe:
          setup:
            - "MEDICAID admission ACTIVE with covered_day_count 0; a 3-midnight bed-hold opened and closed RETURNED, all paid under the Medicaid cap"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "CDC SNF", cms_certification_number: "CCN-CDC1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "CDC Res", medical_record_number: "MRN-CDC1", date_of_birth: "1956-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "MEDICAID", admit_at: "2026-02-01T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/bed-holds"
              payload: { leave_reason: "HOSPITAL", leave_start_at: "2026-02-05T00:00:00Z", expected_return_at: "2026-02-08T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { bh_id: $.data.id }
          trigger:
            - call: "POST /snf/bed-holds/${bh_id}/close"
              payload: { return_outcome: "RETURNED", actual_return_at: "2026-02-08T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { ldc: $.data.leave_day_count, pdc: $.data.paid_day_count }
            - call: "GET /snf/admissions/${adm_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { cdc: $.data.covered_day_count }
          assert:
            - "BedHold.${bh_id}.leave_day_count == 3"
            - "BedHold.${bh_id}.paid_day_count == 3"
            - "Admission.${adm_id}.covered_day_count == 0"
