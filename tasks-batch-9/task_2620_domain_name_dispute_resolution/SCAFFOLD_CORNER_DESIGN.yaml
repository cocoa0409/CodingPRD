      - name: correction_is_admissible_on_the_deadline_instant_and_refused_one_second_later
        claim_type: violation_to_error
        grounds:
          - validations[priority=70].ERR_CORRECTION_PERIOD_EXPIRED
          - state_machines.Case.DEFICIENT_to_FILED
          - entities.DeficiencyNotice.fields.correction_deadline_at
        distinguishing_aspect: "The correction window is inclusive at its right endpoint: a correction filed at exactly correction_deadline_at cures the first notice, while a correction one second past the second notice's shorter two-day deadline is refused and leaves the notice OPEN for the sweep to expire."
