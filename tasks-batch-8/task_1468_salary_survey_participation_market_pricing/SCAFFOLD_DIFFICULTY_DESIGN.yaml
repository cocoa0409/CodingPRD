  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_adjustment_submit
        grounds:
          - validations[priority=6]
          - validations[priority=22]
          - errors[ERR_CYCLE_NOT_OPEN]
          - errors[ERR_INVALID_AMOUNT]
        distinguishing_aspect: |
          Pair: state (priority 6, ERR_CYCLE_NOT_OPEN) vs business_fiscal
          (priority 22, ERR_INVALID_AMOUNT). A submit request on a DRAFT
          adjustment whose parent cycle is LOCKED, where the proposed amount
          is also fiscally invalid (exceeds 15% of base), must surface the
          higher-priority state error.
        test_recipe:
          setup:
            - "Cycle created OPEN, then an adjustment drafted with proposed_amount_cents exceeding 15% of subject base (2000000 cents proposed vs 9000000 base → 22.2% > 15%)"
            - "Cycle then LOCKED (so submit will fail the state gate AND would also fail the fiscal gate)"
            - "Job has PUBLISHED composite so ERR_NO_PUBLISHED_COMPOSITE does not fire"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
