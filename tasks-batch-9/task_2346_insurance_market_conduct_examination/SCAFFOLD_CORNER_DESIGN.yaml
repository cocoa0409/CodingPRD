      - name: the_five_uniqueness_scopes_are_mutually_independent
        claim_type: violation_to_error
        grounds:
          - validations[priority 35 ERR_DUPLICATE_IDENTIFIER]
          - entities.Insurer.fields.naic_code
          - entities.ExamScopeArea.fields.area
          - entities.MultistateCollaboration
        distinguishing_aspect: |
          One error code covers five structurally different constraints: two global string uniqueness
          scopes, one per-parent enum uniqueness scope and one at-most-one-child scope. The per-parent
          scope is the discriminating one - the same CLAIMS value is a duplicate on its own examination
          and perfectly legal on a sibling examination - and the collaboration scope is a cardinality
          limit rather than a value collision, so it fires with no field in common.
