  - rule_id: boundary_precision_check
    instances:
      - name: cap_exemption_distance_threshold_is_inclusive
        grounds:
          - calculations.community_eligibility_assessment
          - calculations.community_eligibility_assessment.constants.CAP_EXEMPTION_DISTANCE_MILES
          - calculations.community_eligibility_assessment.constants.MIN_DISTANCE_FROM_HUB_MILES
          - entities.Community.fields.distance_band
        boundary_metric: "driving distance in miles from the nearest hub, at the 70.0 lower bound and the 210.0 cap-exemption bound"
        distinguishing_aspect: |
          The metric is a physical distance evaluated at determination time, and the two bounds have
          opposite inclusivity: 70.0 already qualifies (CAPPED) while 69.9 does not, and 210.0 already
          exempts (UNCAPPED, null cap) while 209.9 does not. No other boundary instance turns on a
          non-monetary continuous quantity or on a pair of bounds with mismatched inclusivity.
