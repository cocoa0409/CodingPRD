# =============================================================================
# SCAFFOLD: Wearable Membership Model, Hardware Inclusion & Data Access
# Task 3278 — membership-included hardware wearable platform (Whoop-like)
# =============================================================================

scenario: |
  Wearable Membership Model, Hardware Inclusion & Data Access (Whoop): membership subscription that includes the hardware with device replacement and upgrade eligibility during an active term, membership term commitments with early cancellation charges and pause options, physiological data collection with strain, recovery and sleep metrics computed from continuous sensing, algorithm updates that change historical metric interpretation with member communication, team and organizational accounts where a coach or employer sees member data with consent boundaries, research participation and de-identified data use with opt-in, hardware failure diagnosis and replacement logistics without interrupting data continuity, accessory and apparel commerce alongside membership

domain_name: wearable-membership
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  entity_count: 11
  state_machine_count: 9
  calculation_count: 9
  endpoint_count: 40
  error_code_count: 27
  role_count: 5

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Member email; unique across members" }
      - { name: full_name, type: string, source: input, description: "Member display name" }
      - { name: member_status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE; SUSPENDED while a term is PAST_DUE", default: ACTIVE }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Spendable credit; funded by early-resume proration credit; spent and refunded by merch orders; never negative", default: 0 }
      - { name: data_sharing_posture, type: enum, source: computed, description: "NORMAL | SUPPRESSED; SUPPRESSED when a published algorithm release with requires_member_ack=true changed any of the member's recomputed recovery_score values and the member has not acknowledged that release", default: NORMAL }
      - { name: algorithm_ack_release_id, type: string, source: system, description: "Release id of the latest acknowledged AlgorithmRelease; null until first acknowledgement", default: null }

  - name: MembershipTerm
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: plan_name, type: string, source: input, description: "Human label copied onto the term at creation" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly membership fee in cents" }
      - { name: commitment_months, type: integer, source: input, description: "Committed term length in whole calendar months" }
      - { name: hardware_tier, type: enum, source: input, description: "BAND_STD | BAND_PRO; BAND_PRO grants 10% merch member discount" }
      - { name: upgrade_eligibility_months, type: integer, source: input, description: "Full calendar months that must elapse since started_on (or last upgrade) before a hardware upgrade is allowed" }
      - { name: pause_days_per_term, type: integer, source: input, description: "Total pausable days budget for the whole term" }
      - { name: cancel_fee_policy, type: enum, source: input, description: "REMAINING_MONTHS | PAID_MONTHS_FLOOR; selects early-cancel fee variant" }
      - { name: early_cancel_fee_floor_cents, type: integer, source: input, description: "Minimum early-cancellation fee in cents" }
      - { name: term_status, type: enum, source: system, description: "ACTIVE | PAUSED | PAST_DUE | CANCELLED_EARLY | COMPLETED; initial ACTIVE", default: ACTIVE }
      - { name: started_on, type: string, source: system, description: "ISO date the term was created (logical clock)" }
      - { name: commitment_end_on, type: string, source: computed, description: "started_on plus commitment_months calendar months (ISO date)" }
      - { name: months_paid, type: integer, source: computed, description: "Count of successful record-payment calls on this term", default: 0 }
      - { name: pause_days_used, type: integer, source: computed, description: "Days consumed by OPEN or CLOSED pause windows (actual elapsed half-open days)", default: 0 }
      - { name: pause_windows, type: array, source: system, description: "List of {start_on, end_on, window_status: SCHEDULED|OPEN|CLOSED}; half-open [start_on, end_on)", default: [] }
      - { name: open_pause_end_on, type: string, source: system, description: "Scheduled end date of the currently OPEN pause window; null when not PAUSED", default: null }
      - { name: cancel_fee_charged_cents, type: integer, source: computed, description: "Fee charged on early cancellation; null until CANCELLED_EARLY", default: null }
      - { name: last_upgrade_on, type: string, source: system, description: "ISO date of most recent successful upgrade; null until first upgrade", default: null }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: term_id, type: string, source: input, description: "FK -> MembershipTerm.id; term the device was issued under" }
      - { name: serial_number, type: string, source: input, description: "Hardware serial; unique across devices" }
      - { name: hardware_tier, type: enum, source: input, description: "BAND_STD | BAND_PRO" }
      - { name: device_status, type: enum, source: system, description: "PROVISIONED | ACTIVE | SUSPECT_FAULT | RMA_INBOUND | RETIRED; initial PROVISIONED", default: PROVISIONED }
      - { name: activated_on, type: string, source: system, description: "ISO date of activation; null until ACTIVE", default: null }
      - { name: continuity_start_on, type: string, source: system, description: "First covered day (closed interval); set at activation", default: null }
      - { name: continuity_end_on, type: string, source: system, description: "Last covered day (closed interval); set at RETIRED; null means open-ended", default: null }
      - { name: diagnosis, type: enum, source: system, description: "CONFIRMED_FAILURE | NO_FAULT | USER_DAMAGE; set by replacement approve/reject", default: null }

  - name: DailyMetricSet
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; denormalized from the ingesting device" }
      - { name: day_on, type: string, source: input, description: "ISO date the metrics describe; unique per member" }
      - { name: avg_hr, type: number, source: input, description: "Average heart rate over the day" }
      - { name: hrv_ms, type: number, source: input, description: "Heart-rate variability in milliseconds" }
      - { name: resting_hr, type: number, source: input, description: "Resting heart rate" }
      - { name: sleep_minutes, type: integer, source: input, description: "Total sleep minutes" }
      - { name: algorithm_version, type: integer, source: system, description: "Algorithm version that produced current scores; 1 when no release is published" }
      - { name: strain_score, type: number, source: computed, description: "0..21 one decimal place; per metric_scores algorithm" }
      - { name: recovery_score, type: integer, source: computed, description: "0..100 integer; per metric_scores algorithm" }
      - { name: sleep_performance_pct, type: integer, source: computed, description: "0..100 integer; per metric_scores algorithm" }
      - { name: interpretation_status, type: enum, source: system, description: "CURRENT | STALE | RECOMPUTED; initial CURRENT", default: CURRENT }

  - name: AlgorithmRelease
    parent: null
    common_fields: true
    fields:
      - { name: version, type: integer, source: input, description: "Algorithm version number; unique; must be greater than any existing version" }
      - { name: requires_member_ack, type: boolean, source: input, description: "Whether members must acknowledge before data sharing resumes", default: true }
      - { name: release_notes, type: string, source: input, description: "Member-communication notes" }
      - { name: release_status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED; initial DRAFT", default: DRAFT }
      - { name: published_on, type: string, source: system, description: "ISO date published; null until PUBLISHED", default: null }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Team or organization name" }
      - { name: team_type, type: enum, source: input, description: "SPORTS | CORPORATE_WELLNESS" }
      - { name: coach_user_id, type: string, source: input, description: "Opaque X-User-ID of the owning Coach; stored for ownership checks" }

  - name: TeamMembership
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: membership_status, type: enum, source: system, description: "ACTIVE | REMOVED; created ACTIVE", default: ACTIVE }
      - { name: consent_scopes, type: array, source: system, description: "List of {scope: STRAIN|RECOVERY|SLEEP, status: GRANTED|REVOKED|EXPIRED, granted_on, expires_on}; one entry per scope at most; grant supersedes prior entry for same scope", default: [] }

  - name: ResearchStudy
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique study code" }
      - { name: title, type: string, source: input, description: "Study title" }
      - { name: min_paid_months, type: integer, source: input, description: "Minimum months_paid on the member's current term to enroll" }
      - { name: enrollment_window_start_on, type: string, source: input, description: "First enrollment date (inclusive)" }
      - { name: enrollment_window_end_on, type: string, source: input, description: "Last enrollment date (inclusive)" }
      - { name: study_status, type: enum, source: computed, description: "RECRUITING when enrollment_window_start_on <= today <= enrollment_window_end_on, else CLOSED" }

  - name: ResearchEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> ResearchStudy.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: enrollment_status, type: enum, source: system, description: "ENROLLED | WITHDRAWN; initial ENROLLED", default: ENROLLED }
      - { name: enrolled_on, type: string, source: system, description: "ISO date of enrollment (logical clock)" }
      - { name: member_seq, type: integer, source: system, description: "De-identified per-study sequence; assigned by enrollment created_at ASC starting at 1" }

  - name: ReplacementRequest
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; faulty device" }
      - { name: reason, type: enum, source: input, description: "HARDWARE_FAILURE | BATTERY_DRAIN | SENSOR_DRIFT" }
      - { name: request_status, type: enum, source: system, description: "OPEN | APPROVED | REJECTED | COMPLETED; initial OPEN", default: OPEN }
      - { name: diagnosis, type: enum, source: system, description: "CONFIRMED_FAILURE set on approve; NO_FAULT | USER_DAMAGE set on reject", default: null }
      - { name: replacement_device_id, type: string, source: system, description: "FK -> Device.id; replacement device created on approve; null until APPROVED", default: null }

  - name: MerchOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: lines, type: array, source: input, description: "List of {sku, category: BAND_ACCESSORY|APPAREL|RECOVERY_GEAR, unit_price_cents, qty}" }
      - { name: order_status, type: enum, source: system, description: "PAID | CANCELLED; created PAID (wallet debited at placement)", default: PAID }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of qty*unit_price_cents over lines" }
      - { name: member_discount_cents, type: integer, source: computed, description: "Tier discount per merch_order_pricing" }
      - { name: bundle_discount_cents, type: integer, source: computed, description: "Apparel bundle discount per merch_order_pricing" }
      - { name: discount_cents, type: integer, source: computed, description: "min(member+bundle, 30% cap) per merch_order_pricing" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    field: member_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade hop 2 of POST /terms/{id}/record-payment with outcome=FAILED: term went PAST_DUE)"
        actor: system
        preconditions:
          - "The member owns at least one term in PAST_DUE"
        side_effects:
          - "Blocks: new term creation, term upgrade, merch order placement, research enrollment, consent grants (all via state/business validations)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cascade hop of POST /terms/{id}/record-payment with outcome=SUCCEEDED that cleared the member's last PAST_DUE term)"
        actor: system
        preconditions:
          - "The member owns no term in PAST_DUE"
        side_effects: []

  - entity: MembershipTerm
    field: term_status
    initial_state: ACTIVE
    terminal_states: [CANCELLED_EARLY, COMPLETED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /terms/{id}/pause with start_on == today, or system when the logical clock enters a SCHEDULED pause window"
        actor: "Member or system"
        preconditions:
          - "term_status == ACTIVE"
          - "pause budget and half-open overlap checks pass (pause_budget_accounting)"
        side_effects:
          - "The window becomes OPEN; open_pause_end_on set to start_on + days"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /terms/{id}/resume (early), or system when the logical clock reaches open_pause_end_on (scheduled end)"
        actor: "Member or system"
        preconditions:
          - "term_status == PAUSED"
        side_effects:
          - "The OPEN window becomes CLOSED with end_on := today (early resume) or its scheduled end (system)"
          - "pause_days_used += (end_on - start_on) in days (half-open)"
          - "Early resume only: wallet proration credit per pause_proration_credit (unused days credited to Member.wallet_credit_cents)"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /terms/{id}/record-payment with outcome=FAILED (cascade hop 1)"
        actor: "Support, PlatformAdmin"
        preconditions:
          - "term_status == ACTIVE"
        side_effects:
          - "Cascade hop 2: owning Member.member_status -> SUSPENDED"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /terms/{id}/record-payment with outcome=SUCCEEDED"
        actor: "Support, PlatformAdmin"
        preconditions:
          - "term_status == PAST_DUE"
        side_effects:
          - "months_paid += 1"
          - "Cascade hop 2: if the member owns no other PAST_DUE term, Member.member_status -> ACTIVE"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /terms/{id}/record-payment with outcome=SUCCEEDED (regular monthly payment)"
        actor: "Support, PlatformAdmin"
        preconditions:
          - "term_status == ACTIVE"
        side_effects:
          - "months_paid += 1"
      - from: [ACTIVE, PAST_DUE]
        to: CANCELLED_EARLY
        trigger: "POST /terms/{id}/cancel"
        actor: "Member, Support"
        preconditions:
          - "months_paid < commitment_months (otherwise the term COMPLETED instead)"
        side_effects:
          - "cancel_fee_charged_cents := early_cancel_charge per the term's cancel_fee_policy"
          - "All devices with device_status in {PROVISIONED, ACTIVE, SUSPECT_FAULT} -> RETIRED with continuity_end_on := today (closed interval)"
          - "Owning Member.member_status -> ACTIVE if it was SUSPENDED only because of this term"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system when the logical clock reaches commitment_end_on"
        actor: system
        preconditions:
          - "today >= commitment_end_on"
          - "months_paid >= commitment_months"
        side_effects: []

  - entity: Device
    field: device_status
    initial_state: PROVISIONED
    terminal_states: [RETIRED]
    transitions:
      - from: PROVISIONED
        to: ACTIVE
        trigger: "POST /devices/{id}/activate"
        actor: Member
        preconditions:
          - "Owning Member.member_status == ACTIVE"
          - "If this device is a replacement (some ReplacementRequest has replacement_device_id == this device): the faulty device must be RETIRED; continuity_start_on := faulty.continuity_end_on + 1 day (may be earlier than today; data continuity backfills)"
          - "Otherwise continuity_start_on := today and no other device of the same member may have a closed continuity window covering today (continuity_window_overlap)"
        side_effects:
          - "activated_on := today; continuity_start_on set; continuity_end_on := null"
      - from: ACTIVE
        to: SUSPECT_FAULT
        trigger: "system (side effect of POST /devices/{id}/replacement-requests: opening a request marks the device faulty)"
        actor: system
        preconditions:
          - "device_status == ACTIVE"
        side_effects: []
      - from: SUSPECT_FAULT
        to: ACTIVE
        trigger: "system (side effect of POST /replacement-requests/{id}/decide with decision=REJECT and diagnosis=NO_FAULT)"
        actor: system
        preconditions:
          - "device_status == SUSPECT_FAULT"
        side_effects:
          - "diagnosis := NO_FAULT (compensating restore; device returns to service)"
      - from: SUSPECT_FAULT
        to: RMA_INBOUND
        trigger: "system (cascade hop 1 of POST /replacement-requests/{id}/decide with decision=APPROVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RMA_INBOUND
        to: RETIRED
        trigger: "system (POST /replacement-requests/{id}/receive-return)"
        actor: system
        preconditions: []
        side_effects:
          - "continuity_end_on := today (closed interval includes today)"
          - "Cascade hop 2: data continuity is now stitchable — the replacement device's activation will set continuity_start_on := this continuity_end_on + 1 day"
      - from: [PROVISIONED, ACTIVE, SUSPECT_FAULT]
        to: RETIRED
        trigger: "system (cascade of owning term CANCELLED_EARLY)"
        actor: system
        preconditions: []
        side_effects:
          - "continuity_end_on := today if the device was ACTIVE (closed interval)"

  - entity: DailyMetricSet
    field: interpretation_status
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: [CURRENT, RECOMPUTED]
        to: STALE
        trigger: "system (cascade hop 1 of POST /algorithm-releases/{id}/publish: every metric set with algorithm_version < published version)"
        actor: system
        preconditions: []
        side_effects:
          - "Immediately recomputed in the same publish sweep (chronological by day_on ASC, tie-break created_at ASC): scores recomputed under the new algorithm version"
      - from: STALE
        to: RECOMPUTED
        trigger: "system (same publish sweep, immediately after STALE)"
        actor: system
        preconditions: []
        side_effects:
          - "algorithm_version := published version; strain_score/recovery_score/sleep_performance_pct rewritten per metric_scores"
          - "Cascade hop 2: if release.requires_member_ack and any of the member's recovery_score values changed, owning Member.data_sharing_posture -> SUPPRESSED"
          - "Cascade hop 3: while a member is SUPPRESSED, that member's rows in every team dashboard show metrics hidden (consent_visibility_projection)"

  - entity: AlgorithmRelease
    field: release_status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /algorithm-releases/{id}/publish"
        actor: PlatformAdmin
        preconditions:
          - "release_status == DRAFT"
          - "version is strictly greater than every other release's version"
        side_effects:
          - "published_on := today"
          - "Any previously PUBLISHED release -> SUPERSEDED"
          - "Cascade hop 1: all DailyMetricSet with algorithm_version < version -> STALE then RECOMPUTED (see DailyMetricSet machine)"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (a higher-version release is published)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TeamMembership
    field: membership_status
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /team-memberships/{id}/remove"
        actor: "Coach (owning team) or Member (self)"
        preconditions:
          - "membership_status == ACTIVE"
        side_effects:
          - "All consent_scopes entries with status GRANTED -> REVOKED (consent dies with membership)"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /team-memberships/{id}/consents (grant/supersede or revoke a scope; OCC on expected_team_membership_version)"
        actor: Member
        preconditions:
          - "membership_status == ACTIVE"
          - "Acting member is the membership's member_id"
        side_effects:
          - "Grant: entry for scope set to {GRANTED, granted_on := today, expires_on}; supersedes any prior entry for the same scope"
          - "Revoke: entry for scope status -> REVOKED"
          - "increments TeamMembership.version by 1"

  - entity: ResearchEnrollment
    field: enrollment_status
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /research-enrollments/{id}/withdraw"
        actor: Member
        preconditions:
          - "enrollment_status == ENROLLED"
          - "Acting member is the enrollment's member_id"
        side_effects:
          - "The member's rows are excluded from the study contribution dataset (deidentified_contribution_set); member_seq is not reused"

  - entity: ReplacementRequest
    field: request_status
    initial_state: OPEN
    terminal_states: [REJECTED, COMPLETED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /replacement-requests/{id}/decide with decision=APPROVE"
        actor: Support
        preconditions:
          - "request_status == OPEN"
          - "Faulty Device.device_status == SUSPECT_FAULT"
          - "Faulty device's term_id has term_status in {ACTIVE, PAUSED, PAST_DUE}"
        side_effects:
          - "diagnosis := CONFIRMED_FAILURE"
          - "Cascade hop 1: faulty Device.device_status -> RMA_INBOUND"
          - "Cascade hop 1 (sibling): a new Device is created (PROVISIONED) for the same member_id and term_id with a server-minted serial; replacement_device_id set"
      - from: OPEN
        to: REJECTED
        trigger: "POST /replacement-requests/{id}/decide with decision=REJECT and diagnosis NO_FAULT | USER_DAMAGE"
        actor: Support
        preconditions:
          - "request_status == OPEN"
        side_effects:
          - "diagnosis := payload diagnosis"
          - "If diagnosis == NO_FAULT: faulty Device.device_status -> ACTIVE (compensating restore)"
          - "If diagnosis == USER_DAMAGE: faulty device remains SUSPECT_FAULT"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /replacement-requests/{id}/receive-return"
        actor: Support
        preconditions:
          - "request_status == APPROVED"
        side_effects:
          - "Cascade hop 2: faulty Device.device_status -> RETIRED with continuity_end_on := today (closed interval)"

  - entity: MerchOrder
    field: order_status
    initial_state: PAID
    terminal_states: [CANCELLED]
    transitions:
      - from: PAID
        to: CANCELLED
        trigger: "POST /merch-orders/{id}/cancel"
        actor: "Member (owner), Support"
        preconditions:
          - "order_status == PAID"
        side_effects:
          - "Compensating credit: Member.wallet_credit_cents += total_cents (wallet invariant: placement debit + cancel credit leaves wallet unchanged)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: term-upgrade-stale-version
    parent_entity: MembershipTerm
    write_endpoint: "POST /terms/{id}/upgrade"
    occ_field: expected_term_version
    description: |
      Upgrading hardware on a term whose version has advanced since the client
      last observed it is rejected. Upgrades are repeatable (each success resets
      the eligibility clock via last_upgrade_on), so a client carrying a stale
      view of the term must re-read before upgrading again.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: consent-grant-supersede-stale-version
    parent_entity: TeamMembership
    write_endpoint: "POST /team-memberships/{id}/consents"
    occ_field: expected_team_membership_version
    description: |
      Granting a consent scope supersedes any existing entry for that scope on
      the membership. A grant request carrying a membership version that has
      advanced since the client last observed it (e.g., another scope was
      granted, bumping the version) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: metric_scores
    trigger: "POST /devices/{id}/ingest (creation) and algorithm release publish sweep (recompute)"
    algorithm: weighted_scoring
    formula: |
      Baseline (algorithm_version 1, used when no AlgorithmRelease is PUBLISHED):
        strain_score           = round_half_up(min(21, avg_hr / 10.0), 1 decimal)
        recovery_score         = round_half_up(min(100, hrv_ms * 100.0 / (hrv_ms + resting_hr)), 0 decimals)
        sleep_performance_pct  = round_half_up(min(100, sleep_minutes * 100.0 / 480), 0 decimals)
      Published (algorithm_version >= 2, any published release):
        strain_score           = round_half_up(min(21, avg_hr / 9.0), 1 decimal)
        recovery_score         = round_half_up(min(100, (hrv_ms * 100.0 / (hrv_ms + resting_hr)) * 0.9 + 5), 0 decimals)
        sleep_performance_pct  = round_half_up(min(100, sleep_minutes * 100.0 / 450), 0 decimals)
    input_set: "The ingested day's avg_hr, hrv_ms, resting_hr, sleep_minutes"
    precision: "strain 1 decimal, recovery/sleep 0 decimals, round_half_up"
    variants:
      - name: baseline_v1
        when: "No AlgorithmRelease in PUBLISHED status exists at computation time"
        difference: "Denominators 10.0/480 and unscaled recovery formula"
      - name: published_v2plus
        when: "Any AlgorithmRelease is PUBLISHED at computation time (the published version number is stored, formula is the v2+ shape)"
        difference: "Denominators 9.0/450 and recovery scaled 0.9 then +5; identical inputs yield different scores from baseline_v1"

  - name: early_cancel_charge
    trigger: "POST /terms/{id}/cancel (transition to CANCELLED_EARLY)"
    algorithm: threshold
    formula: |
      months_remaining = commitment_months - months_paid
      if cancel_fee_policy == REMAINING_MONTHS:
        fee = max(early_cancel_fee_floor_cents, round_half_up(monthly_fee_cents * months_remaining * 0.50, 0))
      if cancel_fee_policy == PAID_MONTHS_FLOOR:
        fee = max(early_cancel_fee_floor_cents, round_half_up(monthly_fee_cents * months_paid * 0.25, 0))
      cancel_fee_charged_cents := fee
    input_set: "The term being cancelled"
    precision: "integer cents, round_half_up"
    variants:
      - name: remaining_months
        when: "cancel_fee_policy == REMAINING_MONTHS"
        difference: "Charges on months NOT yet paid (forward-looking)"
      - name: paid_months_floor
        when: "cancel_fee_policy == PAID_MONTHS_FLOOR"
        difference: "Charges on months already paid (chronological); identical term state yields a different fee"

  - name: merch_order_pricing
    trigger: "POST /members/{id}/merch-orders (placement)"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = sum over lines of (qty * unit_price_cents)
      member_pct = 10 if the member's current term (status in {ACTIVE, PAUSED}) has hardware_tier == BAND_PRO else 0
      member_discount_cents = round_half_up(subtotal_cents * member_pct / 100, 0)
      apparel_qty = sum of qty over lines with category == APPAREL
      apparel_subtotal_cents = sum of qty*unit_price_cents over lines with category == APPAREL
      bundle_discount_cents = round_half_up(apparel_subtotal_cents * 5 / 100, 0) if apparel_qty >= 3 else 0
      discount_cap_cents = round_half_up(subtotal_cents * 30 / 100, 0)
      discount_cents = min(member_discount_cents + bundle_discount_cents, discount_cap_cents)
      total_cents = subtotal_cents - discount_cents
    input_set: "Order lines plus the member's current term (status in {ACTIVE, PAUSED}); a member with no such term gets member_pct = 0"
    precision: "integer cents; each discount component rounded half-up to cents at computation, then summed, then capped (order pinned: per-component round, sum, cap)"

  - name: pause_proration_credit
    trigger: "POST /terms/{id}/resume (early resume only: today < scheduled open_pause_end_on)"
    algorithm: aggregation
    formula: |
      unused_days = (scheduled open_pause_end_on) - today, in whole days (half-open window)
      credit_cents = round_half_up(monthly_fee_cents * unused_days / 30, 0)
      Member.wallet_credit_cents += credit_cents
      The credit is computed per resumed window and rounded per window before being
      added to the wallet (pinned rounding order: per-window round, then add).
    input_set: "The OPEN pause window being closed early"
    constants:
      BILLING_CYCLE_DAYS: 30
    precision: "integer cents, round_half_up per window"

  - name: pause_budget_accounting
    trigger: "POST /terms/{id}/pause (schedule), system window open/close, POST /terms/{id}/resume"
    algorithm: threshold
    formula: |
      committed_days = sum over pause_windows with window_status in {SCHEDULED, OPEN} of their SCHEDULED length
                     + sum over CLOSED windows of their ACTUAL elapsed length (end_on - start_on)
      A new pause of D days is rejected with ERR_PAUSE_BUDGET_EXCEEDED iff committed_days + D > pause_days_per_term.
      Boundary: committed_days + D == pause_days_per_term is ALLOWED (strictly-greater rejects).
      pause_days_used (displayed) = sum over {OPEN: today - start_on, CLOSED: end_on - start_on}.
    input_set: "The term's pause_windows"
    precision: "whole days"

  - name: upgrade_eligibility
    trigger: "POST /terms/{id}/upgrade"
    algorithm: threshold
    formula: |
      anchor = last_upgrade_on if set else started_on
      months_elapsed = number of full calendar months between anchor and today
        (a month counts only once the same day-of-month has been reached or passed)
      Eligible iff months_elapsed >= upgrade_eligibility_months (inclusive boundary).
      On success: last_upgrade_on := today; a new PROVISIONED Device of hardware_tier
      BAND_PRO is created for the member under this term (returned in the response).
    input_set: "The term"
    precision: "whole calendar months"

  - name: continuity_window_overlap
    trigger: "POST /devices/{id}/activate (non-replacement path) and data_continuity assertions"
    algorithm: interval_merge
    formula: |
      Device continuity windows are CLOSED intervals [continuity_start_on, continuity_end_on or +inf).
      A non-replacement activation is rejected with ERR_CONTINUITY_WINDOW_OVERLAP iff another
      device of the same member has continuity_start_on <= today <= (continuity_end_on or +inf).
      Same-day adjacency IS an overlap (closed semantics): a new device cannot start on the
      retiring device's last covered day.
      Replacement path (pinned stitch): continuity_start_on(replacement) = continuity_end_on(faulty) + 1 day.
    input_set: "All devices of the member"
    precision: "whole days"

  - name: consent_visibility_projection
    trigger: "GET /teams/{id}/dashboard (read-time projection)"
    algorithm: projection
    formula: |
      For each TeamMembership of the team with membership_status == ACTIVE, emit one row
      {membership_id, member_id, suppressed, strain_score, recovery_score, sleep_performance_pct}:
        - If the member owns no MembershipTerm, or the member's latest term (by created_at ASC,
          latest last) has term_status in {CANCELLED_EARLY, COMPLETED}: omit the row entirely.
        - Else if the member's data_sharing_posture == SUPPRESSED: suppressed=true, all three
          metric fields null (consent is overridden by the suppression posture).
        - Else: suppressed=false; for each metric field include the member's latest metric
          value (by day_on DESC) iff that scope's consent entry exists with status GRANTED and
          (expires_on is null or expires_on >= today); otherwise the field is null.
      Rows are ordered by membership created_at ASC.
    input_set: "Team's ACTIVE memberships, members' terms, posture, consent_scopes, latest DailyMetricSet per member"

  - name: deidentified_contribution_set
    trigger: "GET /research-studies/{id}/contribution-dataset (read-time projection)"
    algorithm: projection
    formula: |
      Rows = for each ResearchEnrollment of the study with enrollment_status == ENROLLED,
        for each DailyMetricSet of that member with day_on >= enrolled_on:
          {member_seq, day_on, strain_score, recovery_score, sleep_performance_pct}
      WITHDRAWN enrollments contribute zero rows (withdrawal removes all prior contribution).
      member_seq is assigned per study by enrollment created_at ASC starting at 1 and is
      never reused after withdrawal.
      Rows ordered by member_seq ASC then day_on ASC. No member_id, email, or name appears.
    input_set: "Study enrollments and enrolled members' metric sets"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Actor's role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Member's X-User-ID equals the resource's owning member id; Coach's X-User-ID equals team.coach_user_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "member-scoped and team-scoped endpoints"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Request body well-formed; required fields present; enum values valid; quantities and dates parse"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /terms/{id}/upgrade, POST /team-memberships/{id}/consents"
  - priority: 7
    category: state
    check: "State-machine preconditions (current state allows the transition; includes ERR_MEMBER_SUSPENDED for member-gated actions)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all mutating endpoints"
  - priority: 8
    category: business_safety
    check: "Consent/suppression boundary: consent grant while member data_sharing_posture == SUPPRESSED is refused; dashboard honors suppression and scope consent"
    error_id: ERR_DATA_SHARING_SUPPRESSED
    http_status: 403
    applies_to: "POST /team-memberships/{id}/consents"
  - priority: 9
    category: business_temporal
    check: "Temporal windows: pause window half-open overlap; continuity window closed overlap; consent expires_on not in the past; enrollment window open"
    error_id: "ERR_PAUSE_WINDOW_OVERLAP | ERR_CONTINUITY_WINDOW_OVERLAP | ERR_GRANT_WINDOW_INVALID | ERR_ENROLLMENT_WINDOW_CLOSED"
    http_status: 409
    applies_to: "pause, activate, consents, enroll"
  - priority: 10
    category: business_constraint
    check: "Budgets, uniqueness, thresholds: pause budget, upgrade eligibility, serial uniqueness, one open term per member, one open replacement per device, duplicate metric day, duplicate membership, duplicate enrollment"
    error_id: "ERR_PAUSE_BUDGET_EXCEEDED | ERR_UPGRADE_NOT_ELIGIBLE | ERR_SERIAL_NUMBER_TAKEN | ERR_ACTIVE_TERM_EXISTS | ERR_DUPLICATE_METRIC_DAY | ERR_DUPLICATE_MEMBERSHIP | ERR_ALREADY_ENROLLED | ERR_REPLACEMENT_ALREADY_OPEN"
    http_status: 422
    applies_to: "pause, upgrade, devices, terms, ingest, memberships, enroll, replacement-requests"
  - priority: 11
    category: business_fiscal
    check: "Wallet covers merch total_cents at placement"
    error_id: ERR_INSUFFICIENT_WALLET_CREDIT
    http_status: 422
    applies_to: "POST /members/{id}/merch-orders"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints; path params are always {id})
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is exactly 2026-09-01T00:00:00Z; never falls back to wall-clock. Advancing the clock fires system transitions: scheduled pause windows open/close, consent entries EXPIRED when expires_on < today, terms COMPLETED at commitment_end_on, studies recomputed RECRUITING/CLOSED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Clock-driven state transitions per state machines"]

  - method: POST
    path: "/members"
    description: "Register a member"
    roles: [Anonymous]
    code: 201
    input: [email, full_name]
    output: Member
    side_effects: ["member_status=ACTIVE, wallet_credit_cents=0, data_sharing_posture=NORMAL"]

  - method: GET
    path: "/members/{id}"
    description: "Read a member (posture, wallet, status)"
    roles: [Member, Coach, Support, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{id}/acknowledge-algorithm"
    description: "Member acknowledges a published algorithm release; clears SUPPRESSED posture when acknowledging the latest PUBLISHED release"
    roles: [Member]
    code: 200
    input: [release_id]
    output: Member
    side_effects: ["algorithm_ack_release_id := release_id; data_sharing_posture -> NORMAL"]

  - method: GET
    path: "/members/{id}/terms"
    description: "List the member's terms"
    roles: [Member, Coach, Support, PlatformAdmin]
    code: 200
    input: []
    output: "MembershipTerm[]"
    side_effects: []

  - method: GET
    path: "/members/{id}/metric-sets"
    description: "List the member's daily metric sets"
    roles: [Member, Coach, Support, PlatformAdmin]
    code: 200
    input: ["day_on?", "algorithm_version?"]
    output: "DailyMetricSet[]"
    side_effects: []

  - method: GET
    path: "/members/{id}/merch-orders"
    description: "List the member's merch orders"
    roles: [Member, Support, PlatformAdmin]
    code: 200
    input: []
    output: "MerchOrder[]"
    side_effects: []

  - method: GET
    path: "/members/{id}/research-enrollments"
    description: "List the member's research enrollments"
    roles: [Member, Support, PlatformAdmin]
    code: 200
    input: []
    output: "ResearchEnrollment[]"
    side_effects: []

  - method: POST
    path: "/members/{id}/terms"
    description: "Start a membership term (hardware included). Rejected if the member already owns a term with term_status in {ACTIVE, PAUSED, PAST_DUE}"
    roles: [Member, PlatformAdmin]
    code: 201
    input: [plan_name, monthly_fee_cents, commitment_months, hardware_tier, upgrade_eligibility_months, pause_days_per_term, cancel_fee_policy, early_cancel_fee_floor_cents]
    output: MembershipTerm
    side_effects: ["term_status=ACTIVE, started_on := today, commitment_end_on computed, months_paid=0"]

  - method: POST
    path: "/members/{id}/merch-orders"
    description: "Place an accessory/apparel order; priced per merch_order_pricing and debited from wallet at placement (created PAID)"
    roles: [Member]
    code: 201
    input: [lines]
    output: MerchOrder
    side_effects: ["Member.wallet_credit_cents -= total_cents", "increments Member.version by 1"]

  - method: POST
    path: "/terms/{id}/pause"
    description: "Schedule a pause window {start_on, days}; half-open [start_on, start_on+days). start_on == today opens the pause immediately (ACTIVE -> PAUSED); start_on > today stores a SCHEDULED window. Overlap vs existing SCHEDULED/OPEN windows rejected; adjacency allowed"
    roles: [Member]
    code: 200
    input: [start_on, days]
    output: MembershipTerm
    side_effects: ["Window appended; possibly term_status -> PAUSED", "increments MembershipTerm.version by 1"]

  - method: POST
    path: "/terms/{id}/resume"
    description: "Resume early from an OPEN pause; closes the window at today (exclusive) and credits unused days to wallet per pause_proration_credit"
    roles: [Member]
    code: 200
    input: []
    output: MembershipTerm
    side_effects: ["term_status -> ACTIVE; window CLOSED; pause_days_used updated; Member.wallet_credit_cents += credit"]

  - method: POST
    path: "/terms/{id}/record-payment"
    description: "Record a billing outcome. FAILED: ACTIVE -> PAST_DUE and cascades Member -> SUSPENDED. SUCCEEDED on PAST_DUE: back to ACTIVE, months_paid += 1, member restored if no other PAST_DUE term. SUCCEEDED on ACTIVE: months_paid += 1"
    roles: [Support, PlatformAdmin]
    code: 200
    input: [outcome]
    output: MembershipTerm
    side_effects: ["Cascade per MembershipTerm and Member state machines"]

  - method: POST
    path: "/terms/{id}/cancel"
    description: "Early-cancel a term; computes cancel_fee_charged_cents per early_cancel_charge; retires non-retired devices"
    roles: [Member, Support]
    code: 200
    input: []
    output: MembershipTerm
    side_effects: ["term_status -> CANCELLED_EARLY; devices RETIRED; member reactivation cascade"]

  - method: POST
    path: "/terms/{id}/upgrade"
    description: "Upgrade hardware mid-term (OCC on expected_term_version). Eligible iff full months since started_on/last_upgrade_on >= upgrade_eligibility_months; creates a PROVISIONED BAND_PRO device"
    roles: [Member]
    code: 200
    input: [expected_term_version]
    output: MembershipTerm
    side_effects: ["last_upgrade_on := today; new Device created (PROVISIONED)", "increments MembershipTerm.version by 1"]

  - method: POST
    path: "/devices"
    description: "Provision a device for a member under a term (serial unique)"
    roles: [PlatformAdmin]
    code: 201
    input: [member_id, term_id, serial_number, hardware_tier]
    output: Device
    side_effects: ["device_status=PROVISIONED"]

  - method: GET
    path: "/devices/{id}"
    description: "Read a device"
    roles: [Member, Support, PlatformAdmin]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: GET
    path: "/devices"
    description: "List devices with optional filters"
    roles: [Member, Support, PlatformAdmin]
    code: 200
    input: ["member_id?", "term_id?"]
    output: "Device[]"
    side_effects: []

  - method: POST
    path: "/devices/{id}/activate"
    description: "Activate a provisioned device; sets continuity_start_on (closed interval); replacement devices stitch to faulty device's continuity_end_on + 1"
    roles: [Member]
    code: 200
    input: []
    output: Device
    side_effects: ["device_status -> ACTIVE; continuity window opened"]

  - method: POST
    path: "/devices/{id}/ingest"
    description: "Ingest one day's sensing aggregates from an ACTIVE device; creates the member's DailyMetricSet for day_on under the current algorithm version; day_on must be <= today and >= device continuity_start_on; duplicate (member, day_on) rejected"
    roles: [Member]
    code: 201
    input: [day_on, avg_hr, hrv_ms, resting_hr, sleep_minutes]
    output: DailyMetricSet
    side_effects: ["metric_scores computed under current algorithm version"]

  - method: POST
    path: "/devices/{id}/replacement-requests"
    description: "Open a replacement request: marks the device SUSPECT_FAULT (from ACTIVE) and creates the OPEN request; only one OPEN request per device"
    roles: [Member]
    code: 201
    input: [reason]
    output: ReplacementRequest
    side_effects: ["device_status -> SUSPECT_FAULT", "request_status=OPEN"]

  - method: GET
    path: "/devices/{id}/replacement-requests"
    description: "List replacement requests for a device"
    roles: [Member, Support, PlatformAdmin]
    code: 200
    input: []
    output: "ReplacementRequest[]"
    side_effects: []

  - method: POST
    path: "/replacement-requests/{id}/decide"
    description: "Support decides an OPEN request. decision=APPROVE: diagnosis CONFIRMED_FAILURE, faulty device -> RMA_INBOUND, replacement PROVISIONED device created. decision=REJECT with diagnosis NO_FAULT: device returns to ACTIVE; with USER_DAMAGE: device stays SUSPECT_FAULT"
    roles: [Support]
    code: 200
    input: [decision, "diagnosis?"]
    output: ReplacementRequest
    side_effects: ["Cascade per ReplacementRequest and Device state machines"]

  - method: POST
    path: "/replacement-requests/{id}/receive-return"
    description: "Confirm the faulty device arrived: faulty device -> RETIRED with continuity_end_on := today (closed interval)"
    roles: [Support]
    code: 200
    input: []
    output: ReplacementRequest
    side_effects: ["request_status -> COMPLETED; device continuity closed"]

  - method: POST
    path: "/algorithm-releases"
    description: "Create an algorithm release (DRAFT); version must exceed all existing versions"
    roles: [PlatformAdmin]
    code: 201
    input: [version, requires_member_ack, release_notes]
    output: AlgorithmRelease
    side_effects: []

  - method: POST
    path: "/algorithm-releases/{id}/publish"
    description: "Publish a release: supersedes the previously PUBLISHED release; recomputes all older-version DailyMetricSets (STALE -> RECOMPUTED); flips affected members to SUPPRESSED when requires_member_ack and any recovery_score changed"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AlgorithmRelease
    side_effects: ["3-hop cascade: metric sets recomputed -> member posture -> dashboard suppression"]

  - method: POST
    path: "/teams"
    description: "Create a team; coach_user_id must equal the caller's X-User-ID"
    roles: [Coach]
    code: 201
    input: [name, team_type, coach_user_id]
    output: Team
    side_effects: []

  - method: POST
    path: "/teams/{id}/memberships"
    description: "Coach adds a member to the team (created ACTIVE); duplicate ACTIVE membership for the same member rejected"
    roles: [Coach]
    code: 201
    input: [member_id]
    output: TeamMembership
    side_effects: []

  - method: GET
    path: "/teams/{id}/dashboard"
    description: "Coach dashboard: per-member rows projected per consent_visibility_projection (consent scopes, member term status, suppression posture)"
    roles: [Coach]
    code: 200
    input: []
    output: { rows: array }
    side_effects: []

  - method: GET
    path: "/team-memberships/{id}"
    description: "Read a membership including consent_scopes"
    roles: [Member, Coach, Support, PlatformAdmin]
    code: 200
    input: []
    output: TeamMembership
    side_effects: []

  - method: GET
    path: "/team-memberships"
    description: "List memberships with optional filters"
    roles: [Member, Coach, Support, PlatformAdmin]
    code: 200
    input: ["team_id?", "member_id?"]
    output: "TeamMembership[]"
    side_effects: []

  - method: POST
    path: "/team-memberships/{id}/consents"
    description: "Grant or revoke a consent scope (OCC on expected_team_membership_version). action=GRANT supersedes any existing entry for the scope; expires_on must be null or >= today; refused while the member is SUPPRESSED. action=REVOKE revokes a GRANTED entry"
    roles: [Member]
    code: 200
    input: [scope, action, expected_team_membership_version, "expires_on?"]
    output: TeamMembership
    side_effects: ["consent_scopes updated; increments TeamMembership.version by 1"]

  - method: POST
    path: "/team-memberships/{id}/remove"
    description: "Remove a member from a team; revokes all GRANTED consent entries"
    roles: [Coach, Member]
    code: 200
    input: []
    output: TeamMembership
    side_effects: ["membership_status -> REMOVED; consents REVOKED"]

  - method: POST
    path: "/research-studies"
    description: "Create a research study; study_status is computed from the enrollment window against the logical clock"
    roles: [PlatformAdmin]
    code: 201
    input: [code, title, min_paid_months, enrollment_window_start_on, enrollment_window_end_on]
    output: ResearchStudy
    side_effects: []

  - method: GET
    path: "/research-studies/{id}"
    description: "Read a study"
    roles: [Member, Support, PlatformAdmin]
    code: 200
    input: []
    output: ResearchStudy
    side_effects: []

  - method: POST
    path: "/research-studies/{id}/enroll"
    description: "Member opts into a study: requires study RECRUITING, member ACTIVE, member's current term months_paid >= min_paid_months, no existing ENROLLED enrollment for the member in the study"
    roles: [Member]
    code: 201
    input: [member_id]
    output: ResearchEnrollment
    side_effects: ["member_seq assigned per study by enrollment created_at ASC"]

  - method: GET
    path: "/research-studies/{id}/enrollments"
    description: "List a study's enrollments"
    roles: [Member, Support, PlatformAdmin]
    code: 200
    input: []
    output: "ResearchEnrollment[]"
    side_effects: []

  - method: GET
    path: "/research-studies/{id}/contribution-dataset"
    description: "De-identified contribution rows per deidentified_contribution_set"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { rows: array }
    side_effects: []

  - method: POST
    path: "/research-enrollments/{id}/withdraw"
    description: "Member withdraws; all contributed rows are excluded from the dataset; member_seq not reused"
    roles: [Member]
    code: 200
    input: []
    output: ResearchEnrollment
    side_effects: ["enrollment_status -> WITHDRAWN"]

  - method: POST
    path: "/merch-orders/{id}/cancel"
    description: "Cancel a PAID merch order; wallet credited exactly total_cents (compensating action)"
    roles: [Member, Support]
    code: 200
    input: []
    output: MerchOrder
    side_effects: ["Member.wallet_credit_cents += total_cents", "increments Member.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed actor does not own the target resource (member id mismatch, or coach does not own the team)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value, unparsable date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Current state does not allow the requested transition" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Member is SUSPENDED; action blocked (term create, upgrade, merch placement, enrollment)" }
  - { id: ERR_ACTIVE_TERM_EXISTS, http: 422, condition: "Member already owns a term in ACTIVE, PAUSED, or PAST_DUE" }
  - { id: ERR_NO_ACTIVE_TERM, http: 409, condition: "Action requires a term in ACTIVE, PAUSED, or PAST_DUE and none exists" }
  - { id: ERR_TERM_NOT_CANCELLABLE, http: 409, condition: "Term is PAUSED, CANCELLED_EARLY, or COMPLETED; cancel allowed only from ACTIVE or PAST_DUE" }
  - { id: ERR_PAUSE_BUDGET_EXCEEDED, http: 422, condition: "committed_days + requested days > pause_days_per_term (equality allowed)" }
  - { id: ERR_PAUSE_WINDOW_OVERLAP, http: 409, condition: "New half-open pause window overlaps an existing SCHEDULED or OPEN window (adjacency allowed)" }
  - { id: ERR_TERM_NOT_PAUSED, http: 409, condition: "resume called on a term that is not PAUSED" }
  - { id: ERR_UPGRADE_NOT_ELIGIBLE, http: 422, condition: "Full calendar months since started_on/last_upgrade_on < upgrade_eligibility_months" }
  - { id: ERR_DEVICE_NOT_ACTIVE, http: 409, condition: "Ingest or fault-report requires device_status ACTIVE; activation requires PROVISIONED" }
  - { id: ERR_DUPLICATE_METRIC_DAY, http: 409, condition: "A DailyMetricSet already exists for this member and day_on" }
  - { id: ERR_CONTINUITY_WINDOW_OVERLAP, http: 409, condition: "Another device of the member covers today under closed-interval continuity semantics" }
  - { id: ERR_REPLACEMENT_DEVICE_NOT_RETIRED, http: 409, condition: "Replacement device activation requires the faulty device to be RETIRED first" }
  - { id: ERR_REPLACEMENT_ALREADY_OPEN, http: 422, condition: "Device already has an OPEN replacement request" }
  - { id: ERR_DEVICE_NOT_FAULTY, http: 409, condition: "Replacement request requires device_status SUSPECT_FAULT" }
  - { id: ERR_DATA_SHARING_SUPPRESSED, http: 403, condition: "Member's data_sharing_posture is SUPPRESSED; new consent grants refused until the member acknowledges the latest algorithm release" }
  - { id: ERR_GRANT_WINDOW_INVALID, http: 400, condition: "Consent expires_on is in the past" }
  - { id: ERR_DUPLICATE_MEMBERSHIP, http: 409, condition: "Member already has an ACTIVE membership in this team" }
  - { id: ERR_ENROLLMENT_WINDOW_CLOSED, http: 422, condition: "Study is not RECRUITING today (outside enrollment window)" }
  - { id: ERR_ALREADY_ENROLLED, http: 409, condition: "Member already has an ENROLLED enrollment in this study" }
  - { id: ERR_INSUFFICIENT_WALLET_CREDIT, http: 422, condition: "wallet_credit_cents < merch order total_cents" }
  - { id: ERR_SERIAL_NUMBER_TAKEN, http: 409, condition: "Device serial_number already registered" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register"
    identity: opaque
    exclusive_operations:
      - "POST /members"
    shared_operations: []

  - name: Member
    description: "Subscribed end user; owns terms, devices, metric sets, enrollments, merch orders"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{id}/acknowledge-algorithm"
      - "POST /terms/{id}/pause, /resume, /upgrade"
      - "POST /devices/{id}/activate, /ingest"
      - "POST /devices/{id}/replacement-requests"
      - "POST /members/{id}/merch-orders"
      - "POST /team-memberships/{id}/consents"
      - "POST /research-enrollments/{id}/withdraw"
    shared_operations:
      - "GET /members/{id} and member sub-resource lists"
      - "GET /devices/{id}, GET /devices, GET /devices/{id}/replacement-requests"
      - "POST /members/{id}/terms (with PlatformAdmin)"
      - "POST /terms/{id}/cancel, POST /merch-orders/{id}/cancel (with Support)"
      - "POST /team-memberships/{id}/remove (with Coach)"
      - "GET /team-memberships/{id}, GET /team-memberships"
      - "POST /research-studies/{id}/enroll"
      - "GET /research-studies/{id}, GET /research-studies/{id}/enrollments"

  - name: Coach
    description: "Team/organization operator; owns teams via coach_user_id; views consent-bounded dashboards"
    identity: opaque
    exclusive_operations:
      - "POST /teams"
      - "POST /teams/{id}/memberships"
      - "GET /teams/{id}/dashboard"
    shared_operations:
      - "GET /members/{id}, GET /members/{id}/terms, GET /members/{id}/metric-sets"
      - "GET /team-memberships/{id}, GET /team-memberships"
      - "POST /team-memberships/{id}/remove (with Member)"

  - name: Support
    description: "Customer operations; diagnoses faults, runs replacement logistics, records payments"
    identity: opaque
    exclusive_operations:
      - "POST /replacement-requests/{id}/decide, /receive-return"
    shared_operations:
      - "POST /terms/{id}/record-payment (with PlatformAdmin)"
      - "POST /terms/{id}/cancel, POST /merch-orders/{id}/cancel (with Member)"
      - "All GET endpoints except GET /teams/{id}/dashboard"

  - name: PlatformAdmin
    description: "Platform operator; provisions devices, publishes algorithms, manages studies, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /devices"
      - "POST /algorithm-releases, POST /algorithm-releases/{id}/publish"
      - "POST /research-studies"
      - "GET /research-studies/{id}/contribution-dataset"
    shared_operations:
      - "POST /members/{id}/terms (with Member)"
      - "POST /terms/{id}/record-payment (with Support)"
      - "All GET endpoints except GET /teams/{id}/dashboard"
