# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or FK body reference does not resolve" }
  - { id: ERR_VALIDATION, http: 422, condition: "Required field missing, enum out of set, or numeric range violated (incl. charter_ownership_limit_pct outside (0, 50.0))" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violated: ticker, quarter label, one-report-per-quarter, snapshot date, taxable year" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition requested from a state that does not list it (e.g., lock a LOCKED report, pay a PENDING_APPROVAL dividend, void a PAID dividend)" }
  - { id: ERR_QUARTER_LOCKED, http: 409, condition: "Data mutation attempted against a LOCKED quarter or FINALIZED snapshot" }
  - { id: ERR_CROSS_REIT_REFERENCE, http: 422, condition: "Child body references parents belonging to different REITs (quarter vs reit, shareholder vs snapshot's reit, asset vs sale's reit)" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "period_end < period_start; record/payable date before declaration; snapshot_date not a half-year last day" }
  - { id: ERR_QUARTER_OVERLAP, http: 409, condition: "New quarter's closed interval intersects an existing quarter of the same reit (adjacency allowed, shared day rejected)" }
  - { id: ERR_REIT_SUSPENDED, http: 409, condition: "Dividend create/approve/declare or sale confirm while Reit.status == SUSPENDED" }
  - { id: ERR_FIVE_FIFTY_BLOCKED, http: 409, condition: "Dividend approve/declare while Reit.five_fifty_blocked == true" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempted both sides of a segregated pairing (approve/declare or submit/decide)" }
  - { id: ERR_REQUIREMENT_NOT_POSTED, http: 409, condition: "Dividend declare without a POSTED DistributionRequirement for (reit_id, taxable_year)" }
  - { id: ERR_DECLARATIONS_OPEN, http: 409, condition: "Requirement close while sibling dividends remain in non-terminal states" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_reit_version does not match current Reit.version on OCC-guarded creates" }
  - { id: ERR_SNAPSHOT_EMPTY, http: 422, condition: "Finalize requested on a snapshot with zero positions" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Public REIT compliance team officer; owns data entry, test locking, snapshot finalization, dividend execution, disclosure drafting/submission"
    identity: "opaque"
    exclusive_operations:
      - "POST /asset-test-reports, /asset-test-reports/{id}/lock"
      - "POST /income-test-reports, /income-test-reports/{id}/lock"
      - "POST /shareholder-snapshots/{id}/finalize"
      - "POST /dividend-declarations/{id}/declare, /pay, /void"
      - "POST /compliance-disclosures/{id}/submit"
      - "POST /asset-sales/{id}/analyze, /void"
    shared_operations:
      - "GET endpoints (all roles)"
      - "POST /_clock/set_current_utc (all roles)"
  - name: TaxDirector
    description: "Tax director; owns REIT registration, E&P adjustments, requirement close, sale confirmation, shareholder unfreeze"
    identity: "opaque"
    exclusive_operations:
      - "POST /reits"
      - "POST /ep-adjustments, /ep-adjustments/{id}/post"
      - "POST /distribution-requirements/{id}/close"
      - "POST /asset-sales/{id}/confirm"
      - "POST /shareholders/{id}/unfreeze"
    shared_operations:
      - "GET endpoints (all roles)"
      - "POST /_clock/set_current_utc (all roles)"
  - name: BoardDirector
    description: "Board director; approves dividends and disclosures; segregation of duties vs ComplianceOfficer"
    identity: "opaque"
    exclusive_operations:
      - "POST /dividend-declarations/{id}/approve"
      - "POST /compliance-disclosures/{id}/approve, /reject"
    shared_operations:
      - "GET endpoints (all roles)"
      - "POST /_clock/set_current_utc (all roles)"
