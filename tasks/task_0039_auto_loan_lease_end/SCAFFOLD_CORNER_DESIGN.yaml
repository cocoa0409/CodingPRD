# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of every other testable claim
# the §1.1-§1.7 surface declares beyond the nine Difficulty Rules.
# Same seven-point per-instance contract as §1.8; same canonical RateCard.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_computed_tier
        claim_type: Creation
        grounds: [entities.Customer.fields.fico_tier]
        distinguishing_aspect: "POST /customers with full_name/email/fico_score 760 against active card returns 201, fico_tier computed TIER_1 (fico>=740)."
        test_recipe:
          setup: ["Active RateCard 2026-Q2 exists."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Test One", email: "t1@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id, tier: $.data.fico_tier }
          assert:
            - "http status == 201"
            - "Customer.fico_tier == TIER_1"
            - "Customer.id and created_at and version present; version == 1"

      - name: fico_tier_tier4_below_lowest_breakpoint
        claim_type: Computed Fields
        grounds: [entities.Customer.fields.fico_tier, calculations.customer_fico_tier]
        distinguishing_aspect: "fico_score 600 (< tier_3_min_fico 620) computes fico_tier TIER_4."
        test_recipe:
          setup: ["Active RateCard 2026-Q2."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Low Score", email: "low@x.com", fico_score: 600 }
              as: FinanceManager
              captures: { tier: $.data.fico_tier }
          assert:
            - "Customer.fico_tier == TIER_4"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{random-uuid} for a non-existent id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB except no such customer id."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: create_customer_invalid_fico_returns_422
        claim_type: Type Constraints
        grounds: [entities.Customer.fields.fico_score, "validations[priority=5]"]
        distinguishing_aspect: "fico_score 900 (out of 300..850) rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Active RateCard present."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Bad Fico", email: "bad@x.com", fico_score: 900 }
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: create_customer_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Customer.fields.full_name, "validations[priority=5]"]
        distinguishing_aspect: "POST /customers omitting full_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Active RateCard present."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /customers"
              payload: { email: "noname@x.com", fico_score: 700 }
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: duplicate_email_returns_409
        claim_type: Type Constraints
        grounds: [entities.Customer.fields.email, "validations[priority=6]", "errors[ERR_DUPLICATE_RESOURCE]"]
        distinguishing_aspect: "Second POST /customers with an existing email returns ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["Active RateCard; customer dup@x.com already created."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "First", email: "dup@x.com", fico_score: 700 }
              as: FinanceManager
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Second", email: "dup@x.com", fico_score: 720 }
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_RESOURCE"
            - "http status == 409"

      - name: vehicle_defaults_status_available
        claim_type: Defaults
        grounds: [entities.Vehicle.fields.status]
        distinguishing_aspect: "POST /vehicles yields status AVAILABLE by default without the field in the request."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "VIN-DEF", make_model: "Acme", msrp_cents: 3000000, sale_price_cents: 2900000, residual_value_cents: 1700000 }
              as: FinanceManager
              captures: { vstat: $.data.status }
          assert:
            - "Vehicle.status == AVAILABLE"

      - name: payment_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment has common_fields:false — its create response carries id + created_at but no version field; there is no update endpoint."
        test_recipe:
          setup: ["Active RateCard; Customer TIER_1; Loan CURRENT monthly 46030."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Pay Imm", email: "payimm@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-PI", make_model: "Acme Sedan", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 500000, term_months: 60, gap_insurance: false }
              as: FinanceManager
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { pid: $.data.id }
          assert:
            - "Payment response has id and created_at; no version key"
            - "http status == 201"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: loan_initial_state_current
        claim_type: Initial State
        grounds: [entities.Loan.fields.status, state_machines.Loan]
        distinguishing_aspect: "Freshly originated Loan starts in CURRENT with payments_made_count 0 and principal_balance_cents == financed_principal_cents 2500000."
        test_recipe:
          setup: ["Active RateCard; Customer TIER_1; Vehicle."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Init Loan", email: "init@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-IN", make_model: "Acme Sedan", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 500000, term_months: 60, gap_insurance: false }
              as: FinanceManager
              captures: { st: $.data.status, bal: $.data.principal_balance_cents }
          assert:
            - "Loan.status == CURRENT"
            - "Loan.principal_balance_cents == 2500000"
            - "Loan.monthly_payment_cents == 46030"
            - "Loan.apr == 0.0399"

      - name: terminal_paid_off_rejects_further_payment
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Loan, entities.Loan.fields.status]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_fiscal_on_payment
          rationale: "The PAID_OFF terminal lockdown (payment rejected with ERR_LOAN_NOT_PAYABLE) is the asserted outcome of that §1.8 instance."

      - name: mature_on_already_maturing_returns_not_maturable
        claim_type: Invalid Transitions
        grounds: [state_machines.Lease.ACTIVE_to_MATURING, "errors[ERR_LEASE_NOT_MATURABLE]"]
        distinguishing_aspect: "Calling mature twice: second mature on a MATURING lease returns ERR_LEASE_NOT_MATURABLE (409)."
        test_recipe:
          setup: ["Active RateCard; Lease matured once (status MATURING)."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Mat Twice", email: "mat@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-MT", make_model: "Acme Wagon", msrp_cents: 3400000, sale_price_cents: 3200000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
            - call: "POST /leases"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 0, term_months: 36, annual_mileage_allowance: 12000, per_mile_overage_rate_cents: 22.5, disposition_fee_cents: 39500, purchase_option_fee_cents: 30000, gap_insurance: false }
              as: FinanceManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/mature"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /leases/${lease_id}/mature"
              payload: {}
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LEASE_NOT_MATURABLE"
            - "http status == 409"

      - name: rate_card_activate_deactivates_prior
        claim_type: Side Effect Execution
        grounds: [endpoints, entities.RateCard.fields.active]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rate_card_single_active_occupation
          rationale: "The activate-deactivates-prior side effect is asserted by that §1.8 instance."

      - name: payment_increments_count_and_reduces_balance
        claim_type: Side Effect Execution
        grounds: [state_machines.Loan.CURRENT_to_CURRENT, entities.Loan.fields.principal_balance_cents]
        distinguishing_aspect: "One scheduled payment moves payments_made_count 0->1 and principal_balance_cents 2500000 -> 2462283 (actuarial after 1 payment)."
        test_recipe:
          setup: ["Active RateCard; Customer TIER_1; Loan CURRENT financed 2500000 monthly 46030, no payments."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Pay One", email: "p1@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-P0", make_model: "Acme Sedan", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 500000, term_months: 60, gap_insurance: false }
              as: FinanceManager
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 46030, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { cnt: $.data.payments_made_count, bal: $.data.principal_balance_cents }
          assert:
            - "Loan.payments_made_count == 1"
            - "Loan.principal_balance_cents == 2462283"

  # ===========================================================================
  - section: calculations
    instances:
      - name: loan_monthly_tier3_apr_selected
        claim_type: Correct Result
        grounds: [calculations.loan_monthly_payment, entities.Loan.fields.apr]
        distinguishing_aspect: "Customer fico 650 (TIER_3) financed 2700000 n60 -> apr 0.0899, monthly_payment_cents 56034."
        test_recipe:
          setup: ["Active RateCard; Customer fico 650; Vehicle sale 3000000."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "T3 Borrower", email: "t3@x.com", fico_score: 650 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-T3", make_model: "Acme Sedan", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 300000, term_months: 60, gap_insurance: false }
              as: FinanceManager
              captures: { apr: $.data.apr, mp: $.data.monthly_payment_cents }
          assert:
            - "Loan.apr == 0.0899"
            - "Loan.monthly_payment_cents == 56034"
            - "Loan.financed_principal_cents == 2700000"

      - name: late_fee_percentage_exceeds_floor
        claim_type: Correct Result
        grounds: [calculations.loan_late_fee, entities.Payment.fields.late_fee_cents]
        distinguishing_aspect: "Curing a TIER_3 loan (monthly 56034): 5% = 2802 > floor 2500, so late_fee_cents == 2802 (percentage path, not the floor)."
        test_recipe:
          setup: ["Active RateCard; TIER_3 Loan monthly 56034, one missed payment (DELINQUENT)."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Late T3", email: "latet3@x.com", fico_score: 650 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-LT3", make_model: "Acme Sedan", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 300000, term_months: 60, gap_insurance: false }
              as: FinanceManager
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/miss-payment"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /loans/${loan_id}/payments"
              payload: { amount_cents: 56034, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { lf: $.data.late_fee_cents }
          assert:
            - "Payment.late_fee_cents == 2802"

      - name: lease_purchase_no_disposition_no_mileage
        claim_type: Variant Selection
        grounds: [calculations.lease_end_settlement, entities.LeaseEndSettlement.fields.purchase_amount_cents]
        excluded_because:
          difficulty_instance: dual_variant_calc / lease_end_return_vs_purchase_diverge
          rationale: "PURCHASE variant (residual+fee, no disposition/mileage) total 1880000 asserted there."

  # ===========================================================================
  - section: validations
    instances:
      - name: origination_without_active_rate_card_returns_409
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_NO_ACTIVE_RATE_CARD]"]
        distinguishing_aspect: "POST /loans when no RateCard has been activated returns ERR_NO_ACTIVE_RATE_CARD (409)."
        test_recipe:
          setup: ["A RateCard exists but is NOT activated; Customer and Vehicle exist."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "No Card", email: "nocard@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-NC", make_model: "Acme Sedan", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 500000, term_months: 60, gap_insurance: false }
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_ACTIVE_RATE_CARD"
            - "http status == 409"

      - name: scheduled_payment_wrong_amount_returns_mismatch
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_PAYMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "POST /loans/{id}/payments on a CURRENT loan with amount_cents != monthly_payment_cents 46030 returns ERR_PAYMENT_AMOUNT_MISMATCH (409)."
        test_recipe:
          setup: ["Active RateCard; Customer TIER_1; Loan CURRENT monthly 46030."]
          setup_api_calls:
            - call: "POST /rate-cards"
