        excluded_because:
          difficulty_instance: "transitive_cascade / cascade_a_substantiated_incident_to_payout_zeroing_depth_six"
          rationale: >
            The six-link chain from a substantiated incident through delisting, window cancellation,
            order voiding and pending-payout zeroing is asserted link by link there, together with the
            depth-four CASCADE-B chain in the sibling instance, including the ordering sensitivity of
            the capacity counter and the fact that terminal children are skipped.

      - name: both_calculation_variants_diverge_on_the_same_data
        claim_type: dual_variant_calculation
