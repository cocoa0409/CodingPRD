              as: InnovationLead
              captures: { bc_tb_id: $.data.id }
          trigger:
            - call: "POST /business-cases/${bc_tb_id}/forecast-lines"
              payload: { channel: "CLUB", store_count: 1000, base_velocity_units_per_store_week: 0.00, promo_weeks: 0, promo_lift_pct: 0.00, list_price_usd: 2.5000 }
              as: InnovationLead
          assert:
            - "BusinessCase.${bc_tb_id}.avg_list_price_usd == 2.5000"
            - "BusinessCase.${bc_tb_id}.annual_units == 2000000 and BusinessCase.${bc_tb_id}.gross_revenue_usd == 5000000.00"
            - "BusinessCase.${bc_tb_id}.trade_spend_rate_pct == 15.00"
            - "BusinessCase.${bc_tb_id}.trade_spend_usd == 750000.00 and BusinessCase.${bc_tb_id}.net_revenue_usd == 4000000.00"
            - "BusinessCase.${bc_tb_id}.trade_spend_rate_pct != 12.00, the rate a net-keyed tier lookup on 4000000.00 would have chosen"
            - "BusinessCase.${bc_tb_id}.net_revenue_usd != 4150000.00, the value a net-keyed lookup would have produced"
            - "BusinessCase.${bc_tb_id}.cogs_total_usd == 2100000.00 and BusinessCase.${bc_tb_id}.gross_margin_pct == 47.50"
            - "BusinessCase.${bc_tb_id}.npv_usd == 4504388.64 and BusinessCase.${bc_tb_id}.payback_months == 6"

  # ---------------------------------------------------------------- Rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: project_commercial_track_cycles_while_dev_track_holds
        grounds:
          - state_machines.InnovationProject.commercial_status
          - state_machines.InnovationProject.dev_status
          - complexity_profile.state_machine_shape
          - entities.InnovationProject.fields.authorized_acv_pct
        distinguishing_aspect: |
          Non-linearity on InnovationProject takes the form of two independent state dimensions
          plus a cycle inside one of them: commercial_status walks NOT_STARTED, SELL_IN_SCHEDULED,
          PRESENTED, SELL_IN_REJECTED, SELL_IN_SCHEDULED, PRESENTED, AUTHORIZED — returning to a
          state it already left — while dev_status never moves off PILOT_QUALIFIED.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-03T00:00:00Z."
            - "SNACK gate 2 with an empty checklist, quorum 1 and no veto functions."
            - "One SNACK LINE_EXTENSION project taken through gate 2 into dev_status PILOT_QUALIFIED."
            - "A GROCERY retailer and a SNACK reset window with max_presentations 2."
            - "A first presentation already rejected, so commercial_status sits at SELL_IN_REJECTED."
            - "A second presentation created and presented."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 999, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
