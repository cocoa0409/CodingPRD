# =============================================================================
# §1.8 Scaffold Difficulty Design — Avionics Shop & STC Installation
# Two instances per Difficulty Rule (§0.5); every chain replays against §1.5.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: weight_balance_incremental_vs_full_reweigh
        grounds:
          - calculations.weight_balance_recompute
          - entities.WeightBalanceRevision.fields.new_moment_lb_in
        distinguishing_aspect: |
          Same added lines and removal produce different new_moment_lb_in under the two
          method variants on WeightBalanceRevision (INCREMENTAL rounds each line moment to
          0.1 before summing; FULL_REWEIGH rounds the summed moment once) — entity domain
          is weight & balance, distinct from the labor-billing instance below.
        test_recipe:
          setup:
            - "Work order in TESTING with an approved zero-line design, one verified task; aircraft baseline 1800.0 lb @ arm 40.0 (moment 72000.0), CG envelope [35.0, 41.5]"
            - "Logical clock pinned at 2026-08-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "WB Owner", contact_email: "wb@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N100WB", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "wiring refresh", estimated_downtime_days: 10, quoted_labor_hours: 10, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z", warranty_term_months: 12, software_subscription_months: 6 }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "wiring only", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "HARNESS_FABRICATION", description: "harness", estimated_hours: 5.0 }, as: ShopManager, captures: { task_id: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${task_id}/start", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/complete", payload: { actual_hours: 5.0 }, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/verify", payload: {}, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-testing", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /avionics/weight-balance-revisions", payload: { work_order_id: "${wo_id}", method: "INCREMENTAL", added_items: [ { description: "GPS antenna", weight_lb: 6.26, arm_in: 14.43 }, { description: "AHRS", weight_lb: 3.74, arm_in: 20.44 } ], removed_weight_lb: 9.6, removed_arm_in: 30.0 }, as: ShopManager, captures: { wbr_inc_id: "$.data.id" } }
            - { call: "POST /avionics/weight-balance-revisions", payload: { work_order_id: "${wo_id}", method: "FULL_REWEIGH", added_items: [ { description: "GPS antenna", weight_lb: 6.26, arm_in: 14.43 }, { description: "AHRS", weight_lb: 3.74, arm_in: 20.44 } ], removed_weight_lb: 9.6, removed_arm_in: 30.0 }, as: ShopManager, captures: { wbr_full_id: "$.data.id" } }
          assert:
            - "WeightBalanceRevision.${wbr_inc_id}.new_moment_lb_in == 71878.7  (per-line rounded 90.3 + 76.4 = 166.7; 72000 + 166.7 - 288.0)"
            - "WeightBalanceRevision.${wbr_full_id}.new_moment_lb_in == 71878.8  (raw sum 166.7774 rounded once; 72000 + 166.7774 - 288.0 = 71878.7774 -> 71878.8)"
            - "WeightBalanceRevision.${wbr_inc_id}.new_empty_weight_lb == 1800.4"
            - "WeightBalanceRevision.${wbr_full_id}.new_empty_weight_lb == 1800.4"
            - "WeightBalanceRevision.${wbr_inc_id}.new_arm_in == 39.92 and WeightBalanceRevision.${wbr_full_id}.new_arm_in == 39.92"
            - "new_moment_lb_in differs between variants for identical inputs"

      - name: labor_quote_flat_vs_billed_tiered
        grounds:
          - calculations.labor_billing
          - entities.InstallTask.fields.billed_labor_cents
        distinguishing_aspect: |
          For an identical 10.0-hour INSTALLATION task the estimated variant (flat
          10.0 * 14500 = 145000 cents inside quoted_total_cents) differs from the actual
          variant (tiered overtime + kind multiplier = 199375 cents) — entity domain is
          labor billing on InstallTask/WorkOrder, distinct from weight & balance above.
        test_recipe:
          setup:
            - "Work order APPROVED->INSTALLATION with zero-line design; quoted_labor_hours = 10 so quoted_total_cents = 145000 (no equipment)"
            - "One INSTALLATION task estimated 10.0 h, completed with actual_hours 10.0 by tech-1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Lab Owner", contact_email: "lab@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N110LB", make_model: "Piper PA-32", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "panel labor", estimated_downtime_days: 10, quoted_labor_hours: 10, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "labor only", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager, captures: { quo_total: "$.data.quoted_total_cents" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "INSTALLATION", description: "install", estimated_hours: 10.0 }, as: ShopManager, captures: { task_id: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${task_id}/start", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/complete", payload: { actual_hours: 10.0 }, as: Technician, as_user_id: "tech-1" }
          trigger:
            - { call: "POST /avionics/install-tasks/${task_id}/verify", payload: {}, as: Inspector, as_user_id: "insp-1", captures: { billed: "$.data.billed_labor_cents" } }
          assert:
            - "WorkOrder.${wo_id}.quoted_total_cents == 145000  (flat estimate variant: 10.0 * 14500)"
            - "InstallTask.${task_id}.billed_labor_cents == 199375  (actual variant: (8 + 2*1.5) * 14500 * 1.25)"
            - "WorkOrder.${wo_id}.total_billed_labor_cents == 199375"
            - "billed actual (199375) != quoted flat estimate (145000) for identical 10.0 hours"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: labor_billing_overtime_and_kind_multiplier
        grounds:
          - calculations.labor_billing
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (actual_hours, task_kind multiplier, 8.0 h tier boundary)
          with nested min/max — two tasks with identical 12.0 actual hours bill 253750
          (INSTALLATION, x1.25) vs 203000 (HARNESS_FABRICATION, x1.0) because the kind
          multiplier compounds the tiered overtime term.
        test_recipe:
          setup:
            - "Work order in INSTALLATION (zero-line design approved); two tasks created, both completed with actual_hours 12.0 by tech-1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Tier Owner", contact_email: "tier@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N120TR", make_model: "Cirrus SR22", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "dual task", estimated_downtime_days: 10, quoted_labor_hours: 24, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "labor only", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "INSTALLATION", description: "install", estimated_hours: 12.0 }, as: ShopManager, captures: { t_inst: "$.data.id" } }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "HARNESS_FABRICATION", description: "harness", estimated_hours: 12.0 }, as: ShopManager, captures: { t_harn: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${t_inst}/start", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${t_inst}/complete", payload: { actual_hours: 12.0 }, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${t_harn}/start", payload: {}, as: Technician, as_user_id: "tech-2" }
            - { call: "POST /avionics/install-tasks/${t_harn}/complete", payload: { actual_hours: 12.0 }, as: Technician, as_user_id: "tech-2" }
          trigger:
            - { call: "POST /avionics/install-tasks/${t_inst}/verify", payload: {}, as: Inspector, as_user_id: "insp-1", captures: { billed_inst: "$.data.billed_labor_cents" } }
            - { call: "POST /avionics/install-tasks/${t_harn}/verify", payload: {}, as: Inspector, as_user_id: "insp-1", captures: { billed_harn: "$.data.billed_labor_cents" } }
          assert:
            - "InstallTask.${t_inst}.billed_labor_cents == 253750  ((min(12,8) + max(0,12-8)*1.5) * 14500 * 1.25 = 14 * 14500 * 1.25)"
            - "InstallTask.${t_harn}.billed_labor_cents == 203000  (14 * 14500 * 1.0)"
            - "WorkOrder.${wo_id}.total_billed_labor_cents == 456750"

      - name: weight_balance_per_line_round_vs_sum_round
        grounds:
          - calculations.weight_balance_recompute
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned per method and observable — line
          moments 90.3318 and 76.4456 sum to 166.7 when each line is rounded to 0.1 first
          (INCREMENTAL) but to 166.7774 -> 71878.8 total when the sum is rounded once
          (FULL_REWEIGH); a different mode than the tiered-formula instance above.
        test_recipe:
          setup:
            - "Work order in TESTING (zero-line design, one verified task); aircraft baseline 1800.0 @ 40.0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Round Owner", contact_email: "round@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N130RD", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "rounding probe", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "none", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "HARNESS_FABRICATION", description: "h", estimated_hours: 1.0 }, as: ShopManager, captures: { task_id: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${task_id}/start", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/complete", payload: { actual_hours: 1.0 }, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/verify", payload: {}, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-testing", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /avionics/weight-balance-revisions", payload: { work_order_id: "${wo_id}", method: "INCREMENTAL", added_items: [ { description: "A", weight_lb: 6.26, arm_in: 14.43 }, { description: "B", weight_lb: 3.74, arm_in: 20.44 } ], removed_weight_lb: 9.6, removed_arm_in: 30.0 }, as: ShopManager, captures: { wbr_inc_id: "$.data.id" } }
            - { call: "POST /avionics/weight-balance-revisions", payload: { work_order_id: "${wo_id}", method: "FULL_REWEIGH", added_items: [ { description: "A", weight_lb: 6.26, arm_in: 14.43 }, { description: "B", weight_lb: 3.74, arm_in: 20.44 } ], removed_weight_lb: 9.6, removed_arm_in: 30.0 }, as: ShopManager, captures: { wbr_full_id: "$.data.id" } }
          assert:
            - "WeightBalanceRevision.${wbr_inc_id}.new_moment_lb_in == 71878.7 (round-per-line-then-sum: 90.3 + 76.4 = 166.7)"
            - "WeightBalanceRevision.${wbr_full_id}.new_moment_lb_in == 71878.8 (sum-then-round-once: 166.7774 -> 71878.7774 -> 71878.8)"
            - "the two rounding orders diverge by exactly 0.1 lb-in on identical inputs"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: regulatory_faa_rejection_cycle
        grounds:
          - state_machines.RegulatoryPackage.FAA_SUBMITTED_to_DRAFT
          - state_machines.RegulatoryPackage.DRAFT_to_FAA_SUBMITTED
        distinguishing_aspect: |
          RegulatoryPackage cycles FAA_SUBMITTED -> DRAFT -> FAA_SUBMITTED on FAA
          rejection (entity RegulatoryPackage), unlike the TestEvent retest cycle below.
        test_recipe:
          setup:
            - "Work order APPROVED (zero-line design approved); FIELD_APPROVAL package created in DRAFT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "FAA Owner", contact_email: "faa@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N140FA", make_model: "Beech A36", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "field approval job", estimated_downtime_days: 10, quoted_labor_hours: 10, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "x", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/regulatory-packages", payload: { work_order_id: "${wo_id}", approval_path: "FIELD_APPROVAL" }, as: ShopManager, captures: { pkg_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/regulatory-packages/${pkg_id}/submit", payload: {}, as: ShopManager, captures: { faa_track_1: "$.data.faa_tracking_number" } }
            - { call: "POST /avionics/regulatory-packages/${pkg_id}/record-decision", payload: { decision: "REJECTED" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/regulatory-packages/${pkg_id}/submit", payload: {}, as: ShopManager, captures: { faa_track_2: "$.data.faa_tracking_number" } }
            - { call: "POST /avionics/regulatory-packages/${pkg_id}/record-decision", payload: { decision: "APPROVED" }, as: Inspector, as_user_id: "insp-1", captures: { final_status: "$.data.status" } }
          assert:
            - "after first submit: status == FAA_SUBMITTED and faa_tracking_number non-null"
            - "after REJECTED: status == DRAFT (cycle back)"
            - "after resubmit: status == FAA_SUBMITTED and faa_tracking_2 == faa_tracking_1 (tracking number retained)"
            - "final status == APPROVED"

      - name: test_event_retest_cycle
        grounds:
          - state_machines.TestEvent.FAILED_to_SCHEDULED
          - state_machines.TestEvent.SCHEDULED_to_FAILED
        distinguishing_aspect: |
          TestEvent cycles SCHEDULED -> FAILED -> SCHEDULED with attempt incrementing
          (entity TestEvent, GROUND kind so no rework cascade fires) — a different entity
          than the RegulatoryPackage cycle above.
        test_recipe:
          setup:
            - "Work order in TESTING (zero-line design, one verified task); one GROUND test scheduled"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Test Owner", contact_email: "t@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N150TE", make_model: "Cessna 172S", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "retest", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "x", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "HARNESS_FABRICATION", description: "h", estimated_hours: 2.0 }, as: ShopManager, captures: { task_id: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${task_id}/start", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/complete", payload: { actual_hours: 2.0 }, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/verify", payload: {}, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-testing", payload: {}, as: ShopManager }
            - { call: "POST /avionics/test-events", payload: { work_order_id: "${wo_id}", test_kind: "GROUND", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }, as: ShopManager, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/test-events/${g_id}/record-result", payload: { result: "FAIL" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/test-events/${g_id}/reschedule", payload: { scheduled_start: "2026-08-06T10:00:00Z", scheduled_end: "2026-08-06T11:00:00Z" }, as: ShopManager, captures: { att2: "$.data.attempt" } }
            - { call: "POST /avionics/test-events/${g_id}/record-result", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-1", captures: { final_st: "$.data.status" } }
          assert:
            - "after FAIL: status == FAILED, attempt == 1, result == FAIL"
            - "after reschedule: status == SCHEDULED, attempt == 2, result == NONE"
            - "after second PASS: status == PASSED with attempt == 2"
            - "WorkOrder.${wo_id}.status == TESTING throughout (GROUND FAIL triggers no rework cascade)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: flight_fail_rework_regresses_work_order
        grounds:
          - state_machines.TestEvent.SCHEDULED_to_FAILED
          - state_machines.InstallTask.VERIFIED_to_IN_PROGRESS
          - state_machines.WorkOrder.TESTING_to_INSTALLATION
          - calculations.derived_counts_and_totals
        distinguishing_aspect: |
          Depth-4 chain triggered by record-result FAIL on a FLIGHT test: TestEvent FAILED
          -> InstallTask VERIFIED->IN_PROGRESS with billed_labor_cents voided -> WorkOrder
          tasks_unverified_count/total_billed_labor_cents recomputed -> WorkOrder status
          regresses TESTING->INSTALLATION; each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "Work order in TESTING; one INSTALLATION task VERIFIED (actual 8.0 -> billed 145000); one GROUND test PASSED; one FLIGHT test SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Cascade Owner", contact_email: "c@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N160CC", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "cascade probe", estimated_downtime_days: 10, quoted_labor_hours: 8, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "x", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "INSTALLATION", description: "install", estimated_hours: 8.0 }, as: ShopManager, captures: { task_id: "$.data.id" } }
            - { call: "POST /avionics/install-tasks/${task_id}/start", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/complete", payload: { actual_hours: 8.0 }, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /avionics/install-tasks/${task_id}/verify", payload: {}, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-testing", payload: {}, as: ShopManager }
            - { call: "POST /avionics/test-events", payload: { work_order_id: "${wo_id}", test_kind: "GROUND", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }, as: ShopManager, captures: { g_id: "$.data.id" } }
            - { call: "POST /avionics/test-events/${g_id}/record-result", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/test-events", payload: { work_order_id: "${wo_id}", test_kind: "FLIGHT", scheduled_start: "2026-08-06T14:00:00Z", scheduled_end: "2026-08-06T15:30:00Z" }, as: ShopManager, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/test-events/${f_id}/record-result", payload: { result: "FAIL" }, as: Inspector, as_user_id: "insp-1" }
          assert:
            - "TestEvent.${f_id}.status == FAILED"
            - "InstallTask.${task_id}.status == IN_PROGRESS (rework revert)"
            - "InstallTask.${task_id}.billed_labor_cents == null (unbilled by revert)"
            - "WorkOrder.${wo_id}.tasks_unverified_count == 1"
            - "WorkOrder.${wo_id}.total_billed_labor_cents == 0"
            - "WorkOrder.${wo_id}.status == INSTALLATION (regressed from TESTING)"

      - name: design_approval_releases_procurement
        grounds:
          - state_machines.PanelDesign.SUBMITTED_to_APPROVED
          - state_machines.WorkOrder.PENDING_APPROVAL_to_PARTS_PENDING
          - calculations.derived_counts_and_totals
        distinguishing_aspect: |
          Chain triggered by customer decide APPROVE (different trigger than the test-fail
          cascade): PanelDesign -> APPROVED; that approval mutates WorkOrder PENDING_APPROVAL
          -> PARTS_PENDING; the WorkOrder mutation auto-creates one PLANNED EquipmentOrder
          per design line (DESIGN_RELEASE); each creation recomputes parts_pending_count
          (depth >= 3, single trigger).
        test_recipe:
          setup:
            - "Work order PENDING_APPROVAL with a SUBMITTED two-line design (GTN750XI lead 21, GFC500 lead 14)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Release Owner", contact_email: "r@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N170RL", make_model: "Cirrus SR22", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "full panel", estimated_downtime_days: 20, quoted_labor_hours: 40, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-30T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "two-screen panel", equipment_list: [ { part_number: "GTN750XI", description: "GPS Nav", quantity: 1, unit_price_cents: 1700000, weight_lb: 6.26, arm_in: 14.43, lead_time_days: 21 }, { part_number: "GFC500", description: "Autopilot", quantity: 1, unit_price_cents: 900000, weight_lb: 3.74, arm_in: 20.44, lead_time_days: 14 } ] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /avionics/equipment-orders", payload: { work_order_id: "${wo_id}" }, as: ShopManager, captures: { eo1: "$.data[0].id", eo2: "$.data[1].id" } }
          assert:
            - "PanelDesign.${pd_id}.status == APPROVED"
            - "WorkOrder.${wo_id}.status == PARTS_PENDING"
            - "WorkOrder.${wo_id}.parts_pending_count == 2"
            - "EquipmentOrder.${eo1}.part_number == GTN750XI and .source == DESIGN_RELEASE and .status == PLANNED and .lead_time_days == 21 and .source_design_revision == 1"
            - "EquipmentOrder.${eo2}.part_number == GFC500 and .source == DESIGN_RELEASE and .status == PLANNED and .lead_time_days == 14"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
