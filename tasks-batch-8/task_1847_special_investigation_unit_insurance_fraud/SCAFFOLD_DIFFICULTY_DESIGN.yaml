          assert:
            - "After clear: recovered=20000000, outstanding=15000000 (20000000+15000000=35000000=target)"
            - "After reverse: recovered=0, outstanding=35000000 (invariant restored: 0+35000000=35000000=target)"
            - "RestitutionLedger.status after reverse == OPEN"

      - name: investigator_caseload_conservation_across_terminate_and_reassign
        grounds:
          - state_machines.Assignment.transitions
