# =============================================================================
# §1.9 Scaffold Corner Design — task_1539_airport_rates_charges_airline_use
# Breadth coverage of testable claims NOT already covered by §1.8.
# Sections drawn from claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # =========================
  # Section: entities
  # =========================
  - section: entities
    instances:
      - name: fiscal_year_creation_applies_defaults
        claim_type: creation_defaults
        grounds:
          - entities.FiscalYear.fields.prior_year_surplus_cents
        distinguishing_aspect: "Omitting prior_year_surplus_cents on a COMPENSATORY year defaults it to 0; system fields id/created_at/updated_at/version are stamped."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_DFLT", methodology: "COMPENSATORY", airfield_opex_cents: 1000000, terminal_opex_cents: 500000, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000 }
              as: AirportFinance
              captures: { fy_dflt_id: $.data.id, fy_dflt_v: $.data.version }
          trigger:
            - call: "GET /airport/fiscal_years/{fy_dflt_id}"
              as: AirportFinance
          assert:
            - "FiscalYear.${fy_dflt_id}.prior_year_surplus_cents == 0 (default applied)"
            - "FiscalYear.${fy_dflt_id}.status == DRAFT"
            - "FiscalYear.${fy_dflt_id}.version == 1"
            - "FiscalYear.${fy_dflt_id}.id is a UUID with no type prefix"

      - name: airline_iata_code_format_and_uniqueness
        claim_type: type_constraint
        grounds:
          - entities.Airline.fields.iata_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "iata_code must match ^[A-Z]{2}$ and be unique; both violations surface ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One airline 'AA' already registered."]
          setup_api_calls:
            - call: "POST /airport/airlines"
              payload: { iata_code: "AA", legal_name: "Alpha Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
          trigger:
            - call: "POST /airport/airlines"
              payload: { iata_code: "aa1", legal_name: "Bad Code", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { err1: $.data.error_id }
            - call: "POST /airport/airlines"
              payload: { iata_code: "AA", legal_name: "Duplicate", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_REQUEST (format violation)"
            - "err2 == ERR_INVALID_REQUEST (uniqueness violation)"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /airport/fiscal_years/00000000-0000-0000-0000-000000000000"
              as: AirportFinance
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: fiscal_year_immutable_year_label
        claim_type: immutability
        grounds:
          - entities.FiscalYear.fields.year_label
        distinguishing_aspect: "year_label is unique + immutable after creation; no update endpoint accepts it."
        test_recipe:
          setup: ["One FiscalYear FY_IMM."]
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_IMM", methodology: "RESIDUAL", airfield_opex_cents: 1000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_imm_id: $.data.id }
          trigger:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_IMM", methodology: "COMPENSATORY", airfield_opex_cents: 2000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (duplicate year_label)"

      - name: consultation_comment_immutable_no_version
        claim_type: immutability
        grounds:
          - entities.ConsultationComment
        distinguishing_aspect: "ConsultationComment has common_fields:false; entity carries id + created_at only, no version, no update endpoint."
        test_recipe:
          setup: ["FY_CCM OPEN; RatesSetting RS_ccm published (CONSULTATION state)."]
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_CCM", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_ccm_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_ccm_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "CM", legal_name: "Commenter", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { cm_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_ccm_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_1: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_ccm_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_1}" }
              as: AirportFinance
              captures: { rs_ccm_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_ccm_id}/publish"
              payload: {}
              as: AirportFinance
          trigger:
            - call: "POST /airport/rates_settings/{rs_ccm_id}/comments"
              payload: { airline_id: "${cm_id}", body: "concern about landing fee" }
              as: SignatoryAirline
              as_user_id: "${cm_id}"
              captures: { cmt_id: $.data.id }
          assert:
            - "ConsultationComment.${cmt_id}.version is absent (common_fields: false)"
            - "ConsultationComment.${cmt_id}.created_at present"
            - "RatesSetting.${rs_ccm_id}.consultation_comment_count == 1"

      - name: activity_record_required_fields
        claim_type: required_fields
        grounds:
          - entities.ActivityRecord
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Missing airline_id / landed_weight_kg / activity_date / signature_status_at_activity surfaces ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["FY_REQ OPEN."]
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_REQ", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_req_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_req_id}/open"
              payload: {}
              as: AirportFinance
          trigger:
            - call: "POST /airport/fiscal_years/{fy_req_id}/activity_records"
              payload: { activity_date: "2026-09-10T00:00:00Z", landed_weight_kg: 1000, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (airline_id missing)"

      - name: list_endpoints_pagination_defaults
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "GET list endpoints honor pagination defaults limit=10, offset=0 and return total_count + has_more."
        test_recipe:
          setup: ["Three airlines registered."]
          setup_api_calls:
            - call: "POST /airport/airlines"
              payload: { iata_code: "L1", legal_name: "L1", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "L2", legal_name: "L2", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "L3", legal_name: "L3", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
          trigger:
            - call: "GET /airport/airlines"
              as: AirportFinance
          assert:
            - "response.meta present with api_request_id and api_request_timestamp"
            - "response.response_type == array"
            - "response.data is a list of length 3"
            - "response.meta.total_count == 3"
            - "response.meta.has_more == false"

  # =========================
  # Section: state_machines
  # =========================
  - section: state_machines
    instances:
      - name: fiscal_year_initial_state_draft
        claim_type: initial_state
        grounds:
          - state_machines.FiscalYear
        distinguishing_aspect: "New FiscalYear starts in DRAFT; OPEN transition required before any rate-setting or activity."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_INI", methodology: "RESIDUAL", airfield_opex_cents: 1000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_ini_id: $.data.id }
          trigger:
            - call: "GET /airport/fiscal_years/{fy_ini_id}"
              as: AirportFinance
          assert:
            - "FiscalYear.${fy_ini_id}.status == DRAFT"

      - name: rates_setting_invalid_from_terminal_superseded
        claim_type: invalid_transition
        grounds:
          - state_machines.RatesSetting
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Once SUPERSEDED, no further transitions are valid; calling adopt on SUPERSEDED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["FY_INV_TR OPEN; RS_old ADOPTED; RS_new published (superseding RS_old)."]
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_INV_TR", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_inv_tr_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_inv_tr_id}/open"
              payload: {}
              as: AirportFinance
            - call: "GET /airport/fiscal_years/${fy_inv_tr_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_2: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_inv_tr_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_2}" }
              as: AirportFinance
              captures: { rs_old_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_old_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_old_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "GET /airport/fiscal_years/${fy_inv_tr_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_3: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_inv_tr_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_3}" }
              as: AirportFinance
              captures: { rs_new_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_new_id}/publish"
              payload: {}
              as: AirportFinance
          trigger:
            - call: "POST /airport/rates_settings/{rs_old_id}/adopt"
              payload: {}
              as: AirportDirector
              captures: { err: $.data.error_id }
          assert:
            - "RatesSetting.${rs_old_id}.status == SUPERSEDED (set by publish of RS_new)"
            - "err == ERR_INVALID_STATE"

      - name: capital_project_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CapitalProject
          - errors[ERR_PROJECT_ALREADY_DECIDED]
        distinguishing_aspect: "Once APPROVED, further votes rejected with ERR_PROJECT_ALREADY_DECIDED."
        test_recipe:
          setup: ["FY_TL OPEN; signatory airlines TL1, TL2 with weights 600/400; CP auto-APPROVED after TL1 votes with threshold_pct=50."]
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_TL", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_tl_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_tl_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "T1", legal_name: "TL1", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { tl1_id: $.data.id }
            - call: "POST /airport/airlines"
              payload: { iata_code: "T2", legal_name: "TL2", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { tl2_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${tl1_id}", fiscal_year_id: "${fy_tl_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_tl1_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${tl2_id}", fiscal_year_id: "${fy_tl_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_tl2_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_tl_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_4: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_tl_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_4}" }
              as: AirportFinance
              captures: { rs_tl_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_tl_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_tl_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/airline_agreements/{ag_tl1_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${tl1_id}"
            - call: "POST /airport/airline_agreements/{ag_tl2_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${tl2_id}"
            - call: "POST /airport/fiscal_years/{fy_tl_id}/activity_records"
              payload: { airline_id: "${tl1_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 600, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_tl_id}/activity_records"
              payload: { airline_id: "${tl2_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 400, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_tl_id}/capital_projects"
              payload: { project_name: "Runway A", cost_center: "AIRFIELD", budget_cents: 1000000, mii_threshold_pct: 50 }
              as: AirportFinance
              captures: { cp_tl_id: $.data.id }
            - call: "POST /airport/capital_projects/{cp_tl_id}/open-voting"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/capital_projects/{cp_tl_id}/mii_votes"
              payload: { airline_id: "${tl1_id}", ballot: "APPROVE" }
              as: SignatoryAirline
              as_user_id: "${tl1_id}"
          trigger:
            - call: "POST /airport/capital_projects/{cp_tl_id}/mii_votes"
              payload: { airline_id: "${tl2_id}", ballot: "APPROVE" }
              as: SignatoryAirline
              as_user_id: "${tl2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "CapitalProject.${cp_tl_id}.status == APPROVED (TL1's 60% weight + 50% count met)"
            - "err == ERR_PROJECT_ALREADY_DECIDED"

      - name: duplicate_vote_rejected
        claim_type: invalid_transition
        grounds:
          - validations[priority=12]
          - errors[ERR_DUPLICATE_VOTE]
        distinguishing_aspect: "Same airline voting twice on the same project → ERR_DUPLICATE_VOTE."
        test_recipe:
          setup: ["FY_DP OPEN; signatory airline DP; CP in MII_VOTING; DP has already cast one APPROVE vote."]
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_DP", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_dp_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_dp_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "DP", legal_name: "DupAir", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { dp_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${dp_id}", fiscal_year_id: "${fy_dp_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_dp_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_dp_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_5: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_dp_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_5}" }
              as: AirportFinance
              captures: { rs_dp_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_dp_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_dp_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/airline_agreements/{ag_dp_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${dp_id}"
            - call: "POST /airport/fiscal_years/{fy_dp_id}/activity_records"
              payload: { airline_id: "${dp_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 100, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_dp_id}/capital_projects"
              payload: { project_name: "Apron", cost_center: "AIRFIELD", budget_cents: 1000, mii_threshold_pct: 75 }
              as: AirportFinance
              captures: { cp_dp_id: $.data.id }
            - call: "POST /airport/capital_projects/{cp_dp_id}/open-voting"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/capital_projects/{cp_dp_id}/mii_votes"
              payload: { airline_id: "${dp_id}", ballot: "APPROVE" }
              as: SignatoryAirline
              as_user_id: "${dp_id}"
          trigger:
            - call: "POST /airport/capital_projects/{cp_dp_id}/mii_votes"
              payload: { airline_id: "${dp_id}", ballot: "REJECT" }
              as: SignatoryAirline
              as_user_id: "${dp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_VOTE"

      - name: settle_compute_requires_activity
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=15]
          - errors[ERR_NO_ACTIVITY]
        distinguishing_aspect: "compute with zero ActivityRecords on the FY → ERR_NO_ACTIVITY."
        test_recipe:
          setup: ["FY_NA OPEN; RatesSetting adopted; no activity."]
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_NA", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_na_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_na_id}/open"
              payload: {}
              as: AirportFinance
            - call: "GET /airport/fiscal_years/${fy_na_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_6: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_na_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_6}" }
              as: AirportFinance
              captures: { rs_na_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_na_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_na_id}/adopt"
              payload: {}
              as: AirportDirector
          trigger:
            - call: "POST /airport/fiscal_years/{fy_na_id}/settlement/compute"
              payload: {}
              as: AirportFinance
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_ACTIVITY"

  # =========================
  # Section: calculations
  # =========================
  - section: calculations
    instances:
      - name: non_signatory_markup_125pct_applied
        claim_type: constants_applied
        grounds:
          - calculations.landing_fee_rate
          - calculations.landing_fee_charge
        distinguishing_aspect: "NON_SIGNATORY_MARKUP_PCT=125 honored: non-signatory rate = ceil(signatory*1.25)."
        test_recipe:
          setup: ["FY_MK RESIDUAL; signatory rate computed = 1000 cents/1000kg; non-signatory rate should be 1250."]
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
