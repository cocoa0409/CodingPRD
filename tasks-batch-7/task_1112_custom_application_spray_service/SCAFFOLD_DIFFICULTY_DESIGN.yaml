            - { call: "POST /api/prescriptions/${rx2}/approve", payload: { expected_field_version: "${f2_v}" }, as: Agronomist }
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE", "FUNGICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 50 }, as: Grower, as_user_id: "${c_id}", captures: { wo1: $.data.id } }
            - { call: "POST /api/work-orders/${wo1}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f2_id}", prescription_id: "${rx2}", acres_to_treat: 50 }, as: Grower, as_user_id: "${c_id}", captures: { wob: $.data.id } }
