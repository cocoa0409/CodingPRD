          - validations.priority_9_ERR_CROSS_DOMAIN_MERGE
          - validations.priority_14_ERR_MATCH_SCORE_BELOW_FLOOR
        excluded_because:
          difficulty_instance: cross_domain_merge_precedes_match_score_floor
          rationale: "The match-score floor check depends on a comparison the cross-domain check must reject first (two records from different domains have no comparable completeness basis); that ordering is the subject of the §1.8 priority_pair_validation_conflict instance."

  # =========================================================================
  - section: endpoints
    instances:
      - name: patch_quality_rule_threshold_updates_in_place
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/mdm/quality-rules/{rule_id}
          - entities.QualityRule.fields.threshold_pct
        distinguishing_aspect: "The PATCH is a partial update: supplying only threshold_pct must leave weight_points, dimension, severity and status untouched while bumping version, and the change must be visible to a following GET."
        test_recipe:
          setup:
            - "DRAFT-STEWARDED domain CUSTOMER with rule QR1 (40 pts, threshold 90.00, HIGH)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
