  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: monitoring_cycle_half_open_window_uniqueness
        grounds:
          - calculations.next_monitoring_due
          - validations[priority=16.5]
          - entities.MonitoringCycle.fields.due_at
        distinguishing_aspect: |
          Resource = Vendor (its monitoring schedule). Interval semantics =
          half-open cadence windows [anchor_at, anchor_at + cadence_days) —
          adjacent (gap=0) permitted, overlap rejected. Test: vendor activates
          at T0, cycle 1 covers [T0, T0+365d) for TIER_3. The system must not
          schedule a second SCHEDULED cycle while cycle 1 is still in
          {SCHEDULED, IN_PROGRESS}. Verify by listing cycles before and after
          activation: exactly 1 exists; complete cycle 1 and verify exactly 1
          new SCHEDULED cycle exists with anchor_at == previous.completed_at.
        test_recipe:
          setup:
            - "Vendor ACTIVE (TIER_3); cycle 1 SCHEDULED with due_at = activation_time + 365 days."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "Cycle Win Vendor", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
