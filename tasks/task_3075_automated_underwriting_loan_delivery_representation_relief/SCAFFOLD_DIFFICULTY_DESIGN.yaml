- rule_id: resource_temporal_overlap
  instances:
  - name: llpa_matrix_half_open_window_no_overlap
    grounds:
    - entities.LlpaMatrix.fields.effective_from
    - entities.LlpaMatrix.fields.effective_until
    - state_machines.LlpaMatrix.ACTIVE_to_SUPERSEDED
    - calculations.loan_price
    distinguishing_aspect: 'Interval semantics 1 (half-open grid windows on LlpaMatrix): [effective_from, effective_until) — a grid whose effective_from equals the prior grid''s effective_until is adjacent,
      not overlapping; at the exact boundary instant the newer grid owns pricing because only one grid is ever ACTIVE.'
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S, servicer V, agreement, pipeline P.
      - Grid M1 [2026-01-01, 2026-09-01) at 100 bps ACTIVE; loan L DRAFT counted at 396,000,000.
      setup_api_calls:
      - *id006
      - *id007
      - *id008
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-TO1
          borrower_name: To One
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
