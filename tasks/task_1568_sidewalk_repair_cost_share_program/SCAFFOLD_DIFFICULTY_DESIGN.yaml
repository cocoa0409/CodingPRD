      - name: application_review_payment_dims_independent
        grounds:
          - state_machines.CostShareApplication.APPROVED_to_OBLIGATED
          - state_machines.CostShareApplication.OBLIGATED_to_WITHDRAWN
          - entities.CostShareApplication.fields.review_status
          - entities.CostShareApplication.fields.payment_status
        distinguishing_aspect: |
          Entity: CostShareApplication — two state dimensions on one row evolve under different
          transitions: review_status (SUBMITTED -> APPROVED -> OBLIGATED -> WITHDRAWN) and
          payment_status (UNFUNDED -> RESERVED -> RELEASED); the review dimension moves without
          payment (APPROVE leaves UNFUNDED) and the payment dimension moves only at obligate.
        test_recipe:
          setup:
            - "cycle 10000000; owner/parcel/segment/defect; notice issued; application qty 100 created"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Hank Holly", mailing_address: "8 Holly St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-700", owner_id: "${owner_id}", street_address: "8 Holly St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-700-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id", r0: "$.data.review_status", p0: "$.data.payment_status" } }
          trigger:
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { r1: "$.data.review_status", p1: "$.data.payment_status" } }
            - { call: "POST /cost-share-applications/${app_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1", captures: { r2: "$.data.review_status", p2: "$.data.payment_status" } }
            - { call: "POST /cost-share-applications/${app_id}/withdraw", as: PropertyOwner, as_user_id: "${owner_id}", captures: { r3: "$.data.review_status", p3: "$.data.payment_status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: ProgramCoordinator, captures: { committed: "$.data.committed_cents" } }
          assert:
            - "r0 == SUBMITTED and p0 == UNFUNDED"
            - "r1 == APPROVED and p1 == UNFUNDED (review moved, payment untouched)"
            - "r2 == OBLIGATED and p2 == RESERVED"
            - "r3 == WITHDRAWN and p3 == RELEASED (compensation on the payment dimension only)"
            - "committed == 0 after the withdraw"

      - name: defect_forestry_loop_cycle
        grounds:
          - state_machines.Defect.OPEN_to_AWAITING_FORESTRY
          - state_machines.Defect.AWAITING_FORESTRY_to_OPEN
          - state_machines.ForestryReview.PENDING_to_CLEARED
        distinguishing_aspect: |
          Entity: Defect (different entity from RepairNotice and CostShareApplication) — a
          creation-triggered loop OPEN -> AWAITING_FORESTRY -> OPEN driven by the forestry
          review, with the review auto-created as a cascade side effect of defect creation.
        test_recipe:
          setup:
            - "owner/parcel/segment; a TREE_ROOT_UPHEAVAL defect with city_tree_involved true"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Ivy Ivy", mailing_address: "9 Ivy St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-800", owner_id: "${owner_id}", street_address: "9 Ivy St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-800-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
          trigger:
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "TREE_ROOT_UPHEAVAL", measured_offset_inches: 0.75, area_sqft: 20, city_tree_involved: true }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id", d_status: "$.data.status", d_sev: "$.data.severity_class" } }
            - { call: "GET /defects/${defect_id}/forestry-reviews", as: ForestryOfficer, captures: { review_id: "$.data[0].id", r_status: "$.data[0].status" } }
            - { call: "POST /forestry-reviews/${review_id}/decision", payload: { decision: "NO_CITY_CONFLICT" }, as: ForestryOfficer, as_user_id: "for-1", captures: { r_status2: "$.data.status" } }
            - { call: "GET /defects/${defect_id}", as: Inspector, captures: { d_status2: "$.data.status" } }
          assert:
            - "d_status == AWAITING_FORESTRY and d_sev == TRIP_HAZARD (offset 0.75 >= 0.50)"
            - "r_status == PENDING (review auto-created by defect creation cascade)"
            - "r_status2 == CLEARED (NO_CITY_CONFLICT clears immediately)"
            - "d_status2 == OPEN (loop closed: OPEN -> AWAITING_FORESTRY -> OPEN)"

  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_after_deadline_cascade
        grounds:
          - state_machines.RepairNotice.ISSUED_to_DELINQUENT
          - state_machines.CostShareApplication.OBLIGATED_to_CANCELLED
          - calculations.program_cap_reservation
          - entities.PropertyParcel.fields.delinquency_flag
        distinguishing_aspect: |
          Trigger: a single FAIL inspection after the deadline. Depth 3 chain where each link
          is caused by the previous one: notice ISSUED -> DELINQUENT (link 1) forces the
          OBLIGATED application -> CANCELLED with payment RESERVED -> RELEASED (link 2), whose
          release then debits ProgramCycle.committed_cents by 60000 (link 3); the parcel flag
          flips as a documented fan-out.
        test_recipe:
          setup:
            - "cycle 10000000; application qty 100 OBLIGATED (committed 60000); notice ISSUED with deadline 2026-09-15; clock advanced to 2026-09-20"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Jack Juniper", mailing_address: "10 Juniper St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-900", owner_id: "${owner_id}", street_address: "10 Juniper St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-900-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications/${app_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "FAIL", notes: "work not started" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /repair-notices/${notice_id}", as: ProgramCoordinator, captures: { n_status: "$.data.status" } }
            - { call: "GET /cost-share-applications/${app_id}", as: ProgramCoordinator, captures: { a_rev: "$.data.review_status", a_pay: "$.data.payment_status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: ProgramCoordinator, captures: { committed: "$.data.committed_cents", available: "$.data.available_cents" } }
            - { call: "GET /parcels/${parcel_id}", as: ProgramCoordinator, captures: { flag: "$.data.delinquency_flag" } }
          assert:
            - "n_status == DELINQUENT (link 1: FAIL past deadline)"
            - "a_rev == CANCELLED and a_pay == RELEASED (link 2: delinquency cancels the OBLIGATED application)"
            - "committed == 0 and available == 10000000 (link 3: reservation released to the cycle)"
            - "flag == true (parcel delinquency fan-out)"

      - name: batch_award_cascade
        grounds:
          - state_machines.BidBatch.SEALED_FOR_BIDDING_to_AWARDED
          - state_machines.Bid.SUBMITTED_to_AWARDED
          - state_machines.BatchWorkItem.POOLED_to_SCHEDULED
          - state_machines.RepairNotice.DELINQUENT_to_CITY_REPAIR_SCHEDULED
        distinguishing_aspect: |
          Trigger: POST /bid-batches/{id}/award (a different trigger from the inspection-FAIL
          instance). Depth 3: the award mutates the winning Bid -> AWARDED (link 1), which
          schedules each POOLED BatchWorkItem -> SCHEDULED (link 2), whose scheduling moves each
          referenced RepairNotice DELINQUENT -> CITY_REPAIR_SCHEDULED and its segments to
          REPAIR_IN_PROGRESS (link 3).
        test_recipe:
          setup:
            - "two parcels each with one defect and a notice; both notices DELINQUENT after sweep; one batch with two POOLED items, sealed; one contractor bid; clock past bid_deadline"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Kim Kat", mailing_address: "11 Kat St" }, as: ProgramCoordinator, captures: { owner1_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Lee Lark", mailing_address: "12 Lark St" }, as: ProgramCoordinator, captures: { owner2_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1001", owner_id: "${owner1_id}", street_address: "11 Kat St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel1_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1002", owner_id: "${owner2_id}", street_address: "12 Lark St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel2_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel1_id}", segment_code: "S-1001-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { seg1_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel2_id}", segment_code: "S-1002-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { seg2_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${seg1_id}", defect_type: "SPALLING", area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { def1_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${seg2_id}", defect_type: "SPALLING", area_sqft: 80 }, as: Inspector, as_user_id: "insp-1", captures: { def2_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel1_id}", defect_ids: ["${def1_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice1_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel2_id}", defect_ids: ["${def2_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice2_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice1_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /repair-notices/${notice2_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator, captures: { swept: "$.data.swept_notice_count" } }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-3", work_window_start: "2026-09-25", work_window_end: "2026-10-15", bid_deadline: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice1_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator, captures: { item1_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice2_id}", scope_sqft: 80, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator, captures: { item2_id: "$.data.id" } }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator, captures: { batch_v: "$.data.version" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor_id: "$.data.id" } }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1000, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor_id}", captures: { bid_id: "$.data.id", bid_eval: "$.data.evaluated_total_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-23T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /bid-batches/${batch_id}/award", as: ProgramCoordinator, captures: { b_status: "$.data.status", b_bid: "$.data.awarded_bid_id", b_total: "$.data.awarded_total_cents" } }
            - { call: "GET /bids/${bid_id}", as: ProgramCoordinator, captures: { bid_status: "$.data.status" } }
            - { call: "GET /batch-work-items/${item1_id}", as: ProgramCoordinator, captures: { i1_status: "$.data.status" } }
            - { call: "GET /batch-work-items/${item2_id}", as: ProgramCoordinator, captures: { i2_status: "$.data.status" } }
            - { call: "GET /repair-notices/${notice1_id}", as: ProgramCoordinator, captures: { n1_status: "$.data.status" } }
            - { call: "GET /repair-notices/${notice2_id}", as: ProgramCoordinator, captures: { n2_status: "$.data.status" } }
            - { call: "GET /segments/${seg1_id}", as: ProgramCoordinator, captures: { s1_status: "$.data.status" } }
          assert:
            - "b_status == AWARDED and b_bid == bid_id and b_total == 130000 (1000 x 130 sqft)"
            - "bid_status == AWARDED (link 1)"
            - "i1_status == SCHEDULED and i2_status == SCHEDULED (link 2)"
            - "n1_status == CITY_REPAIR_SCHEDULED and n2_status == CITY_REPAIR_SCHEDULED (link 3)"
            - "s1_status == REPAIR_IN_PROGRESS (segment fan-out of link 3)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_obligate
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_INVALID_APPLICATION_STATE]
          - errors[ERR_PROGRAM_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): the obligate request violates both the
          state precondition (application still SUBMITTED) and the fiscal cap (provisional
          60000 > appropriation 100); priority 5 must win, returning ERR_INVALID_APPLICATION_STATE
          with 409, never ERR_PROGRAM_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "cycle appropriation only 100; owner/parcel/defect; notice issued; application qty 100 created (provisional 60000) and left SUBMITTED"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 100 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Mia Maple", mailing_address: "13 Maple St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1100", owner_id: "${owner_id}", street_address: "13 Maple St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-1100-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "POST /cost-share-applications/${app_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_APPLICATION_STATE (state, priority 5) and NOT ERR_PROGRAM_CAP_EXCEEDED (fiscal, priority 11)"

      - name: temporal_beats_constraint_on_bid
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_BID_DEADLINE_PASSED]
          - errors[ERR_CONTRACTOR_SUSPENDED]
        distinguishing_aspect: |
          Error-category pair (business_temporal, business_constraint) — a different pair from
          (state, business_fiscal): the bid is submitted after bid_deadline AND by a suspended
          contractor; the temporal rule (priority 9) must fire ERR_BID_DEADLINE_PASSED, not the
          constraint rule's ERR_CONTRACTOR_SUSPENDED. The OCC version supplied is current, so
          priority 6 passes and cannot mask the outcome.
        test_recipe:
          setup:
            - "delinquent notice; batch sealed with one item (version captured after seal); contractor registered then suspended; clock advanced past bid_deadline"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Nora Nut", mailing_address: "14 Nut St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-1200", owner_id: "${owner_id}", street_address: "14 Nut St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-1200-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
