          - entities.ProductCategory.fields.closeout_rate_bps
          - entities.RoyaltyReport.fields.closeout_eligible_total_cents
        distinguishing_aspect: |
          Combination mode (a) — an extra CONDITIONAL BRANCH inside the formula: the
          closeout-eligible amount is capped at 1500 bps of gross AND the excess is
          re-rated at the regular tier rate rather than the 500 bps closeout rate.
          Three reports with identical gross 4000000 and closeout 1000000 / 600000 /
          400000 yield 370000 / 370000 / 380000: the royalty is FLAT once closeout
          exceeds the 600000 cap (the excess silently reverts to the regular basis)
