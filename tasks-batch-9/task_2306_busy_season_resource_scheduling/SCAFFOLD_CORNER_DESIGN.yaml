      - name: training_exception_day_admits_a_booking_that_fits_under_it
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=31]
          - validations[priority=32]
          - calculations.staff_daily_capacity
          - entities.AvailabilityException.fields.available_hours_per_day
        distinguishing_aspect: |
          A non-zero exception reduces capacity instead of blocking the date: a TRAINING
          window of 4.00 hours per day admits a booking whose daily_hours is 3.57 (25.00 / 7)
          and rejects the otherwise identical 30.00-hour booking at 4.29 — the pass side of
          the same pair of rules.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z; MERIDIAN client, partner P1, DOMESTIC senior S1 (base cap 40.00 -> effective 50.00, ordinary daily capacity 10.00)."
            - "S1 has a TRAINING exception 2026-08-03..2026-08-07 at 4.00 available hours per day; 2026-08-08 and 2026-08-09 keep the ordinary 10.00."
            - "Engagement E1 with phase PH1 FIELDWORK expecting 30.00 hours in 2026-08-03..2026-08-31."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
