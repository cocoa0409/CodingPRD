  - rule_id: cross_entity_state_dependency
    instances:
      - name: monitor_approval_requires_effective_method_designation
        grounds:
          - validations[priority=50]
          - state_machines.Monitor.PENDING_APPROVAL_to_APPROVED
          - entities.ReferenceMethod.fields.effective_from
          - entities.ReferenceMethod.fields.designation_status
          - errors[ERR_METHOD_NOT_DESIGNATED]
        distinguishing_aspect: |
          The Monitor -> ReferenceMethod pair: a Monitor cannot leave PENDING_APPROVAL while its method's effective_from is
          still in the future, and the very same call succeeds once the clock passes effective_from - no field on Monitor
          changed, only the state of the other entity. This entity pair differs from the SiteChangeRequest -> NetworkAssessment
          pair of the sibling instance.
        test_recipe:
          setup:
            - "logical clock at 2026-01-05T00:00:00Z"
            - "a reference method designated with effective_from 2027-01-01T00:00:00Z, i.e. not yet usable"
            - "one operating site with a PENDING_APPROVAL monitor bound to that method"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0119-002", designation_type: "FEM", effective_from: "2027-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_future_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
