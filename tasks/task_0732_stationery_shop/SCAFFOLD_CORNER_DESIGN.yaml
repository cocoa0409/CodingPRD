        claim_type: Cascading_Side_Effects
        grounds:
          - state_machines.Order.CART_to_DEPOSIT_PENDING
          - entities.PaperStock.fields.reserved_units
        distinguishing_aspect: "POST /orders/{id}/confirm bumps PaperStock.reserved_units by sum(LineItem.quantity)."
        excluded_because:
          difficulty_instance: compensating_invariant / paper_reserved_units_conservation_confirm_then_deliver
          rationale: "The paper-reserved invariant instance in §1.8 already asserts the forward reservation as an intermediate observation."

      - name: rush_threshold_precise_zero_days_returns_infeasible
        claim_type: Rate_Threshold
        grounds:
          - calculations.rush_surcharge_cents
          - validations[priority=8]
          - errors[ERR_RUSH_INFEASIBLE]
        distinguishing_aspect: "days_to_deadline=0 (same day) → ERR_RUSH_INFEASIBLE. Complements the 14-day boundary in §1.8 by testing the low edge."
        test_recipe:
