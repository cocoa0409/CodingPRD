        distinguishing_aspect: "Merging outage A into its own descendant B is rejected with ERR_MERGE_CYCLE (walking the parent chain detects the cycle)."
        test_recipe:
          setup: ["Event ACTIVE; outage A (root); outage B created with parent_outage_id = A"]
          setup_api_calls:
