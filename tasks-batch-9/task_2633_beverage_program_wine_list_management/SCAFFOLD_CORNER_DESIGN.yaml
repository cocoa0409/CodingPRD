          The window is half-open on occurred_at, so an entry stamped exactly at period_end is
          excluded: the same two closes reported over [10:00, 14:00) yield variance 0.00 from a single
          entry pair, and over [10:00, 14:00:01) yield variance 5.56 once the second close's
