  - name: support_request_per_line_rounding_beats_aggregate_rounding
    grounds:
    - calculations.support_request_award
    - calculations.support_request_settlement
    - entities.SupportRequest.fields.line_items
    - entities.SupportRequest.fields.requested_cents
    - concurrency_rules[support-request-create-stale-grant]
    distinguishing_aspect: 'Mode (b): nested rounding where the order matters — four TOOLS lines each rounded ROUND_HALF_UP
      at 0.85 sum to 13959, whereas rounding the aggregate (16420 * 0.85 == 13957.00) yields 13957, and the 2-cent
      gap then propagates through the admin-fee tier.'
    test_recipe:
      setup:
      - Logical clock at 2026-08-01T08:00:00.000Z.
      - Participant p1 registered (no release needed — support requests are stage-agnostic).
      - 'FunderGrant g1: authorized_cents 5000000, per_participant_cap_cents 60000, all six categories allowed.'
      - A four-line TOOLS request whose unit costs 4550 / 5550 / 3750 / 2570 each land on a half cent at rate 0.85.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants
        payload:
          full_name: Andre Colwell
          facility_name: Northgate Correctional
