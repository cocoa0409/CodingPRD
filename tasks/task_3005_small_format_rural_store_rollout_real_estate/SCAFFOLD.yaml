    side_effects: []
  - method: GET
    path: "/rollouts/opening-plans/{opid}"
    description: "Get an opening plan by id"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
