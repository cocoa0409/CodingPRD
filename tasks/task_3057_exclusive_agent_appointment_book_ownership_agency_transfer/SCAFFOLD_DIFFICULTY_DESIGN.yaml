          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
        captures:
          cali_v1: $.data.version
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cato Eight
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cato_id: $.data.id
      - call: POST /agency-network/agreements
        payload:
          agent_id: ${cato_id}
          agency_id: ${cali_id}
          agreement_type: EXCLUSIVE_AGENT
          commission_schedule:
            AUTO:
              new: 0.15
              renewal: 0.1
            HOME:
              new: 0.12
              renewal: 0.08
            LIFE:
              new: 0.25
              renewal: 0.15
        as: FieldManager
        captures:
          ag_id: $.data.id
      - call: POST /agency-network/staff
        payload:
          full_name: Sam Eight
          role_title: CSR
          allocation_units: 8
          sponsoring_agreement_id: ${ag_id}
          assignment_start_date: "2026-09-02T00:00:00Z"
          assignment_end_date: "2026-09-30T00:00:00Z"
        as: AgencyPrincipal
        as_user_id: ${cali_id}
        captures:
          sam_id: $.data.id
      - call: POST /agency-network/staff/${sam_id}/appoint
        payload: {}
        as: AgencyPrincipal
        as_user_id: ${cali_id}
      trigger:
      - call: POST /agency-network/staff
        payload:
          full_name: Tess Eight
          role_title: Producer
          allocation_units: 8
          sponsoring_agreement_id: ${ag_id}
          assignment_start_date: "2026-09-30T00:00:00Z"
