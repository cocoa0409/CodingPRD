            - { call: "POST /tennis/leagues/${lg}/open-registration", payload: {}, as: SectionAdmin }
            - { call: "POST /tennis/players", payload: { section_id: "${sec1}", full_name: "H1 Alvarez", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph1: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec1}", full_name: "H2 Boyd", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph2: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec1}", full_name: "A1 Garza", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa1: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec1}", full_name: "A2 Haruki", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa2: $.data.id } }
            - { call: "POST /tennis/players/${ph1}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
