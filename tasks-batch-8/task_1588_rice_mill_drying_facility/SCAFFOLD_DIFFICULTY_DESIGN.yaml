  - rule_id: boundary_precision_check
    instances:
      - name: moisture_exactly_base_zero_shrink
        grounds:
          - calculations.paddy_dry_weight
          - calculations.drying_charge
        distinguishing_aspect: |
          Metric: moisture percent, via POST /mill/lots/{id}/grade. Official
          moisture exactly 13.0 yields zero shrink, zero handling loss and zero
          drying charge (strict > gate), while 13.1 triggers the full 0.5%
          handling-loss cliff plus 0.1 point of tier-1 charge.
        test_recipe:
          setup:
            - "Season INTAKE_OPEN spot cap 2; grower; two SPOT lots net 363.00 cwt each"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 13.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { la: $.data.id }
            - call: "POST /mill/lots/${la}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
              captures: { dry_a: $.data.dry_weight_cwt, shrink_a: $.data.moisture_shrink_cwt, hand_a: $.data.handling_loss_cwt, chg_a: $.data.drying_charge_cents }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-11", moisture_pct_handheld: 13.1, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
