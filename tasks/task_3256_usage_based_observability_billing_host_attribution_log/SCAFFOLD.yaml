# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Payload schema violation — missing required field, wrong type, out-of-enum value" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource id (path or body FK) does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity in a state that does not admit the requested transition" }
  - { id: ERR_PERIOD_CLOSED, http: 409, condition: "Mutation attempted against a CLOSED or SETTLED BillingPeriod" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_ACCOUNT_DELINQUENT, http: 409, condition: "BillingAccount.standing != GOOD; blocks new commitments" }
  - { id: ERR_COMMITMENT_WINDOW_OVERLAP, http: 409, condition: "Commitment window overlaps another commitment for same account+meter (closed interval)" }
  - { id: ERR_TIER_WINDOW_OVERLAP, http: 409, condition: "RetentionTier effective window overlaps another tier's half-open window for the same account" }
  - { id: ERR_PLAN_LIMIT, http: 409, condition: "Plan tier cap on ACTIVE monitors reached" }
  - { id: ERR_TAG_POLICY_VIOLATION, http: 422, condition: "TagPolicy with enforcement BLOCK rejects the UsageRecord" }
  - { id: ERR_DUPLICATE_HOST_HOUR, http: 409, condition: "HostHourRecord for (period, hour_bucket_utc) already exists" }
  - { id: ERR_NO_ACTIVE_COMMITMENT, http: 409, condition: "Reindex requires an ACTIVE Commitment covering meter=LOG_INDEX" }
  - { id: ERR_OPEN_INCIDENTS_BLOCK_CLOSE, http: 409, condition: "BillingPeriod close attempted while CardinalityIncidents are still OPEN" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Top-level operator; manages plan tier configs and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /plan-tier-configs"
      - "POST /_clock/set_current_utc"
      - "POST /billing-accounts"
    shared_operations:
      - "GET /billing-accounts"
      - "GET /billing-accounts/{id}"
      - "GET /plan-tier-configs/{id}"

  - name: BillingAdmin
    description: "Billing operator for one account; manages periods, commitments, retention tiers, filters, incidents, invoices"
    identity: opaque
    exclusive_operations:
      - "POST /billing-accounts/{id}/billing-periods"
      - "POST /billing-accounts/{id}/billing-periods/{id}/close"
      - "POST /billing-accounts/{id}/billing-periods/{id}/settle"
      - "POST /billing-accounts/{id}/retention-tiers"
      - "POST /billing-accounts/{id}/exclusion-filters"
      - "POST /billing-accounts/{id}/commitments"
      - "POST /billing-accounts/{id}/commitments/{id}/activate"
      - "POST /billing-accounts/{id}/commitments/{id}/top-up"
      - "POST /billing-accounts/{id}/cardinality-incidents/{id}/triage"
      - "POST /billing-accounts/{id}/cardinality-incidents/{id}/remediate"
      - "POST /billing-accounts/{id}/cardinality-incidents/{id}/close"
      - "POST /billing-accounts/{id}/attribution-disputes/{id}/accept"
      - "POST /billing-accounts/{id}/attribution-disputes/{id}/reject"
      - "POST /billing-accounts/{id}/invoices/{id}/issue"
      - "POST /billing-accounts/{id}/invoices/{id}/pay"
      - "POST /billing-accounts/{id}/invoices/{id}/void"
      - "POST /billing-accounts/{id}/log-events/{id}/reindex"
      - "POST /billing-accounts/{id}/tag-policies"
      - "POST /billing-accounts/{id}/teams"
      - "POST /billing-accounts/{id}/monitors/{id}/delete"
    shared_operations:
      - "GET endpoints on billing-account sub-resources"
      - "POST /billing-accounts/{id}/monitors"
      - "POST /billing-accounts/{id}/monitors/{id}/mute"
      - "POST /billing-accounts/{id}/custom-metric-series"
      - "POST /billing-accounts/{id}/billing-periods/{id}/usage-records"

  - name: IngestionAgent
    description: "Machine-to-machine ingestion; writes host hours, log events, rollup snapshots, usage records"
    identity: opaque
    exclusive_operations:
      - "POST /billing-accounts/{id}/billing-periods/{id}/host-hour-records"
      - "POST /billing-accounts/{id}/billing-periods/{id}/log-events"
      - "POST /billing-accounts/{id}/custom-metric-series/{id}/rollup"
    shared_operations:
      - "POST /billing-accounts/{id}/billing-periods/{id}/usage-records"

  - name: TeamLead
    description: "Owns a team's chargeback and may open attribution disputes"
    identity: entity_backed:Team
    exclusive_operations:
      - "POST /billing-accounts/{id}/usage-records/{id}/disputes"
    shared_operations:
      - "GET endpoints on team-scoped resources"
      - "POST /billing-accounts/{id}/monitors"
      - "POST /billing-accounts/{id}/monitors/{id}/mute"
      - "POST /billing-accounts/{id}/custom-metric-series"

  - name: FinanceReader
    description: "Read-only auditor"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET endpoints across the account"
