            - call: "POST /cds/order-sets/${os_id}/items"
              payload: { orderable_code: "INSULIN-INF", display_name: "Insulin regular infusion 1 unit/mL", item_category: "MEDICATION", high_alert_medication: true, default_dose: "0.1 unit/kg/hr" }
              as: InformaticsBuilder
