              as: PlatformAdmin
              captures: { hz_id: "$.data.id" }
            - call: POST /delivery-zones
              payload: { state_policy_id: "${sp_id}", zone_code: "SF-01", state_code: "CA", service_mode: "DOOR_DELIVERY", postal_codes: ["94110"], max_cold_chain_minutes: 240 }
              as: PlatformAdmin
              captures: { dz_id: "$.data.id" }
          trigger:
            - call: POST /pickup-hubs
              payload: { delivery_zone_id: "${hz_id}", name: "Jack London Square Hub", address: "55 Water St, Oakland CA", slot_capacity_orders: 4, hub_window_start_at: "2026-08-08T15:00:00Z", hub_window_end_at: "2026-08-08T19:00:00Z" }
              as: PlatformAdmin
              captures: { hub_id: "$.data.id", hub_status: "$.data.status", hub_assigned: "$.data.assigned_order_count", hub_version: "$.data.version" }
            - call: GET /pickup-hubs/${hub_id}
              payload: {}
              as: Anonymous
              captures: { read_id: "$.data.id", read_capacity: "$.data.slot_capacity_orders", read_zone: "$.data.delivery_zone_id" }
            - call: GET /pickup-hubs
              payload: { delivery_zone_id: "${hz_id}", status: "OPEN", limit: 10, offset: 0 }
              as: Diner
              as_user_id: diner-1
              captures: { list_first: "$.data[0].id" }
