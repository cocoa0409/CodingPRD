          assert:
            - "hop 1: asa_st == CANCELLED and asb_st == CANCELLED"
            - "hop 2: ja_st == INTAKE and jb_st == INTAKE (re-offer pool empty; each job regression is caused by its assignment's cancellation)"
            - "se_active == 0"
            - "Subcontractor[${se}].status == SUSPENDED"

