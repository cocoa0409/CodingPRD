            - call: "POST /backup-care/providers"
              payload: { provider_name: "Beta Home Aides", owner_user_id: "u_pm_b", care_mode: "IN_HOME", market_code: "MKT-BOS", postal_code: "02112", daily_capacity_slots: 1, max_concurrent_assignments: 1, same_day_available: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { p2_id: $.data.id }
            - call: "POST /backup-care/providers/${p2_id}/credentials"
              payload: { credential_type: "LICENSE", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${p2_id}/credentials"
              payload: { credential_type: "BACKGROUND_CHECK", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
