            - "${err_self_approve} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 and CuttingTest.${t1_id}.status stays SUBMITTED — the MeatManager role header does not launder the identity"
            - "${appr_status} == APPROVED with ${appr_by} == mgr-01"
