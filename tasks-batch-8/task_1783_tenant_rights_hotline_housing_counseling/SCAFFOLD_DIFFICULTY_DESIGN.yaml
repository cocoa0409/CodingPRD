          - state_machines.Case.PENDING_FOLLOW_UP_to_ESCALATED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — missed follow-ups raise the
          score, the score sets the tier, the tier sets required follow-ups —
          broken by pinned evaluation order: missed penalty applies to the NEXT
          recompute, and existing follow-ups stay classified against
          required_count_at_schedule (2), never retroactively. Two misses take
          the VERIFIED case 65 -> 70 (CRITICAL at the inclusive boundary, first
          miss already auto-escalates) -> 75; required becomes 3 only for
          future scheduling. Different mode from (a) tiered branching and
          (b) rounding order.
