              payload: { lot_id: "${lb}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-09-01" }
              as: FeedManager
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${lc}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-09-01" }
              as: FeedManager
          trigger:
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${la}", head_count: 6, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/assignments"
