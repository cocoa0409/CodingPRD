  # ---------------------------------------------------------------------------
  # Rule 4: transitive_cascade — depth>=3 and depth>=2, different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: clock_advance_cascade_to_employee_restoration_deadline
        grounds:
          - state_machines.BenefitContinuationLedger.PENDING_to_DELINQUENT
          - state_machines.LeaveCase.job_restoration_protected
          - entities.Employee.fields.job_restoration_deadline
        distinguishing_aspect: |
          Depth-3 cascade from POST /_clock/set_current_utc:
          (hop 1) clock advance >30 days past period_end → BenefitContinuationLedger transitions PENDING→DELINQUENT (caused by clock side-effect);
          (hop 2) ledger transition to DELINQUENT triggers LeaveCase.job_restoration_protected = false (caused by hop 1, not by clock directly);
          (hop 3) LeaveCase.job_restoration_protected = false triggers re-derivation of Employee.job_restoration_deadline (cleared/nulled).
          Each hop is caused by the previous hop, not by the original trigger.
        test_recipe:
          setup:
            - "Employer with monthly_premium_total_cents=100000 and employer_premium_share_pct=0.50."
            - "Case approved → initial BenefitContinuationLedger row created (period 2026-06-01..2026-07-01)."
            - "Employee.job_restoration_deadline stamped after first interval recorded."
            - "No payment made; clock then advances past 2026-07-31 (period_end + 30 days)."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "Cas Co", state_code: "FED", employer_premium_share_pct: 0.50, monthly_premium_total_cents: 100000 }
              as: PlatformAdmin
              captures: { empCas_id: $.data.id }
            - call: "POST /leave/providers"
              payload: { license_id: "L-CAS-1", full_name: "Dr Cas", specialty: "internal" }
              as: PlatformAdmin
              captures: { provCas_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empCas_id}", email: "cas@x.com", full_name: "Cas", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { workerCas_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${workerCas_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-08-15T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseCas_id: $.data.id }
            - call: "POST /leave/cases/${caseCas_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { caseCas_v_post_elig: $.data.version }
            - call: "POST /leave/certifications"
              payload: { leave_case_id: "${caseCas_id}", provider_id: "${provCas_id}", expected_duration_weeks: 10, provider_attestation_signed_at: "2026-05-15T00:00:00.000Z" }
              as: HealthcareProvider
              captures: { certCas_id: $.data.id }
            - call: "POST /leave/certifications/${certCas_id}/receive"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/certifications/${certCas_id}/mark-complete"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/cases/${caseCas_id}/approve"
              payload: { expected_leave_case_version: "${caseCas_v_post_elig}" }
              as: HRAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseCas_id}", start_datetime: "2026-06-01T00:00:00.000Z", end_datetime: "2026-06-30T00:00:00.000Z", hours_taken: 160 }
              as: HRAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { delinq_response: $.data }
            - call: "GET /leave/cases/${caseCas_id}"
              payload: {}
              as: HRAdmin
              captures: { caseCas_after: $.data }
            - call: "GET /leave/employees/${workerCas_id}"
              payload: {}
              as: HRAdmin
              captures: { workerCas_after: $.data }
          assert:
            - "delinq_response.delinquent_ledger_ids has length 1 (the initial period 2026-06-01..2026-07-01 ledger is now DELINQUENT — hop 1)"
            - "caseCas_after.job_restoration_protected == false (hop 2 — caused by hop 1, not directly by clock)"
            - "workerCas_after.job_restoration_deadline == null (hop 3 — caused by hop 2)"

      - name: first_interval_cascade_to_employee_on_leave
        grounds:
          - state_machines.LeaveCase.APPROVED_to_ACTIVE
          - entities.Employee.fields.employment_status
          - entities.Employee.fields.job_restoration_deadline
        distinguishing_aspect: |
          Depth-2 cascade from POST /leave/intervals (the FIRST interval on
          an APPROVED case):
          (hop 1) LeaveCase APPROVED → ACTIVE (caused by interval creation);
          (hop 2) Employee.employment_status = ON_LEAVE and
                  Employee.job_restoration_deadline = requested_start_at + 84 days
                  (caused by hop 1, not by interval directly).
          Different triggering transition than instance 1 (intervals vs
          clock-advance), demonstrating a second cascade pattern.
        test_recipe:
          setup:
            - "Standard approved case as in instance 1; no interval yet."
            - "Employee.employment_status == ACTIVE; Employee.job_restoration_deadline == null."
            - "Clock at requested_start_at."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "First Co", state_code: "FED", employer_premium_share_pct: 0.50, monthly_premium_total_cents: 100000 }
              as: PlatformAdmin
              captures: { empF_id: $.data.id }
            - call: "POST /leave/providers"
              payload: { license_id: "L-F-1", full_name: "Dr F", specialty: "internal" }
              as: PlatformAdmin
              captures: { provF_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empF_id}", email: "f@x.com", full_name: "F", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { workerF_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${workerF_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-08-15T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseF_id: $.data.id }
            - call: "POST /leave/cases/${caseF_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { caseF_v_post_elig: $.data.version }
            - call: "POST /leave/certifications"
              payload: { leave_case_id: "${caseF_id}", provider_id: "${provF_id}", expected_duration_weeks: 10, provider_attestation_signed_at: "2026-05-15T00:00:00.000Z" }
              as: HealthcareProvider
              captures: { certF_id: $.data.id }
            - call: "POST /leave/certifications/${certF_id}/receive"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/certifications/${certF_id}/mark-complete"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/cases/${caseF_id}/approve"
              payload: { expected_leave_case_version: "${caseF_v_post_elig}" }
              as: HRAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseF_id}", start_datetime: "2026-06-01T00:00:00.000Z", end_datetime: "2026-06-08T00:00:00.000Z", hours_taken: 40 }
              as: HRAdmin
            - call: "GET /leave/cases/${caseF_id}"
              payload: {}
              as: HRAdmin
              captures: { caseF_after: $.data }
            - call: "GET /leave/employees/${workerF_id}"
              payload: {}
              as: HRAdmin
              captures: { workerF_after: $.data }
          assert:
            - "caseF_after.status == ACTIVE (hop 1)"
            - "workerF_after.employment_status == ON_LEAVE (hop 2, caused by hop 1)"
            - "workerF_after.job_restoration_deadline == 2026-08-24T00:00:00.000Z (requested_start_at + 84 days; hop 2, caused by hop 1)"

  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_approve
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CERTIFICATION_INCOMPLETE]
        distinguishing_aspect: |
          Pair: (state, business_safety). On approve, when the case is in
          ELIGIBILITY_PENDING (not yet CERTIFICATION_PENDING) AND the
          certification is incomplete, both rules trigger. Priority 5 (state,
          ERR_INVALID_STATE) wins over priority 7 (business_safety,
          ERR_CERTIFICATION_INCOMPLETE).
        test_recipe:
          setup:
            - "Case in ELIGIBILITY_PENDING (eligibility not yet evaluated)."
            - "No CertificationRecord exists (so certification is trivially incomplete)."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "P5 Co", state_code: "FED", employer_premium_share_pct: 0.50, monthly_premium_total_cents: 100000 }
              as: PlatformAdmin
              captures: { empP5_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empP5_id}", email: "p5@x.com", full_name: "P5", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { workerP5_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${workerP5_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-08-15T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseP5_id: $.data.id, caseP5_v: $.data.version }
          trigger:
            - call: "POST /leave/cases/${caseP5_id}/approve"
              payload: { expected_leave_case_version: "${caseP5_v}" }
              as: HRAdmin
              captures: { p5_err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "p5_err == ERR_INVALID_STATE (priority 5 wins over priority 7 ERR_CERTIFICATION_INCOMPLETE)"

      - name: state_vs_business_constraint_on_evaluate_eligibility_terminated
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_EMPLOYEE_TERMINATED]
          - errors[ERR_INELIGIBLE]
        distinguishing_aspect: |
          Pair: (state, business_constraint) — DIFFERENT pair from instance
          1's (state, business_safety). On evaluate-eligibility, when the
          Employee is TERMINATED AND would fail the 1250-hour threshold (1000
          hours), both rules trigger. Priority 6 (state, ERR_EMPLOYEE_TERMINATED)
          wins over priority 10 (business_constraint, ERR_INELIGIBLE).
        test_recipe:
          setup:
            - "Employee with 1000 hours (ineligible) AND status TERMINATED (we terminate them after the case is submitted, before evaluate)."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "P6 Co", state_code: "FED", employer_premium_share_pct: 0.50, monthly_premium_total_cents: 100000 }
              as: PlatformAdmin
              captures: { empP6_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empP6_id}", email: "p6@x.com", full_name: "P6", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 1000, home_state_code: "FED" }
              as: HRAdmin
              captures: { workerP6_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${workerP6_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-07-01T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseP6_id: $.data.id }
            - call: "POST /leave/employees/${workerP6_id}/terminate"
              payload: {}
              as: HRAdmin
          trigger:
            - call: "POST /leave/cases/${caseP6_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { p6_err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "p6_err == ERR_EMPLOYEE_TERMINATED (priority 6 wins over priority 10 ERR_INELIGIBLE)"

  # ---------------------------------------------------------------------------
  # Rule 6: boundary_precision_check — different metrics, different endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: hours_threshold_exactly_1250_passes_1249_fails
        grounds:
          - calculations.fmla_eligibility
          - validations[priority=10]
          - errors[ERR_INELIGIBLE]
        distinguishing_aspect: |
          Numeric threshold boundary on hours_worked_trailing_12mo: >= 1250
          passes, < 1250 fails. Tested on POST /leave/cases/{id}/evaluate-eligibility.
          Two employees differing only by 1 hour straddle the boundary.
        test_recipe:
          setup:
            - "Employee A with exactly 1250 hours_worked_trailing_12mo."
            - "Employee B with exactly 1249 hours_worked_trailing_12mo."
            - "Both have hire_date 2024-01-01 (well over 12 months at 2026-06-01)."
