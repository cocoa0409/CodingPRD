# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3066_retail_cash_reload_network_bank_as_service
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Every setup_api_calls / trigger entry is a structured call against a §1.5
# endpoint; every ${var} is bound by an earlier captures: on the same instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: bank_sponsor_create_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.BankSponsor
          - endpoints.POST_/v1/bank-sponsors
        distinguishing_aspect: "A bank sponsor created with only legal_name, charter_state_code, sponsorship_capacity_programs and regulator_exam_due_at comes back 201 with oversight_tier defaulted to TIER_2, version 1, and computed counters at zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Cedar Trust Bank", charter_state_code: "UT", sponsorship_capacity_programs: 10, regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "BankSponsor.${bank_id}.legal_name == \"Cedar Trust Bank\" and charter_state_code == \"UT\""
            - "BankSponsor.${bank_id}.oversight_tier == TIER_2 (the documented default, never client-supplied)"
            - "BankSponsor.${bank_id}.active_program_count == 0 and oversight_reviews_completed == 0"
            - "BankSponsor.${bank_id}.is_capacity_exhausted == false"
            - "BankSponsor.${bank_id}.version == 1 and created_at == updated_at == 2026-09-01T00:00:00Z"

      - name: program_get_round_trips_stored_configuration
        claim_type: Retrieval
        grounds:
          - entities.Program
          - endpoints.GET_/v1/programs/{id}
        distinguishing_aspect: "Every Program configuration field round-trips through GET unchanged, including the computed posture fields that were never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One bank sponsor on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Cedar Trust Bank", charter_state_code: "UT", sponsorship_capacity_programs: 10, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Harbor Reload Program", sponsor_bank_id: "${bank_id}", program_type: "OWN_BANK_PROGRAM", settlement_cycle: "WEEKLY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /v1/programs/${prog_id}"
              payload: {}
              as: BankSponsor
              as_user_id: "${bank_id}"
          assert:
            - "the response status is 200"
            - "Program.${prog_id}.name == \"Harbor Reload Program\" and program_type == OWN_BANK_PROGRAM"
            - "Program.${prog_id}.settlement_cycle == WEEKLY (the supplied value, not the DAILY default)"
            - "Program.${prog_id}.compliance_posture == OPEN and posture_score == 0.00"
            - "Program.${prog_id}.open_aml_alert_count == 0 and posture_breach_count == 0"
            - "Program.${prog_id}.is_oversight_overdue == false at 2026-09-01"

      - name: programs_list_paginates_and_filters_by_sponsor
        claim_type: Listing
        grounds:
          - endpoints.GET_/v1/programs
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three programs across two sponsors, a sponsor filter returns only that sponsor's two rows and limit=1 reports total_count 2 with has_more true, so total_count counts the filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two sponsors; three programs, two under the first sponsor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Cedar Trust Bank", charter_state_code: "UT", sponsorship_capacity_programs: 10, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_a: $.data.id }
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Granite National Bank", charter_state_code: "OH", sponsorship_capacity_programs: 5, oversight_tier: "TIER_2", regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_b: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Harbor One", sponsor_bank_id: "${bank_a}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/programs"
              payload: { name: "Harbor Two", sponsor_bank_id: "${bank_a}", program_type: "OWN_BANK_PROGRAM", settlement_cycle: "WEEKLY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/programs"
              payload: { name: "Granite One", sponsor_bank_id: "${bank_b}", program_type: "OWN_BANK_PROGRAM", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/programs"
              payload: { sponsor_bank_id: "${bank_a}", limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response returns exactly 1 program row and meta/response_type indicates an array"
            - "total_count == 2 (the whole filtered set, not the page)"
            - "has_more == true at offset 0 with limit 1"
            - "every returned row has sponsor_bank_id == ${bank_a}"
            - "the Granite One program of the other sponsor is absent from the page"

      - name: program_not_found_for_unknown_uuid
        claim_type: Not Found
        grounds:
          - errors[ERR_ENTITY_NOT_FOUND]
          - validations[priority=3]
          - endpoints.GET_/v1/programs/{id}
        distinguishing_aspect: "GET on a well-formed but unstored program id returns 404 with the envelope error_id ERR_ENTITY_NOT_FOUND, and the error body carries no program fields."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "error_id == ERR_ENTITY_NOT_FOUND (not ERR_INVALID_REQUEST)"
            - "no path resource was created or mutated by the failed read"

      - name: brand_partner_required_fields_enforced
        claim_type: Required Fields
        grounds:
          - entities.BrandPartner.fields.program_id
          - entities.BrandPartner.fields.services_scope
          - validations[priority=1]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required services_scope from the onboarding body is refused with ERR_INVALID_REQUEST, while omitting the optional card_issuance_enabled is accepted and defaulted to true."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One sponsor and one OPEN program on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Cedar Trust Bank", charter_state_code: "UT", sponsorship_capacity_programs: 10, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Harbor Reload Program", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "POST /v1/brand-partners"
              payload: { program_id: "${prog_id}", brand_name: "No Scope Brand", expected_program_version: "${prog_v}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /v1/brand-partners"
              payload: { program_id: "${prog_id}", brand_name: "Defaulted Brand", services_scope: ["LEDGERING"], ledgering_enabled: true, expected_program_version: "${prog_v}" }
              as: ComplianceOfficer
              captures: { brand_id: $.data.id }
          assert:
            - "the scope-less request returns error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "no BrandPartner row is created by the refused request"
            - "the second request succeeds with 201 and BrandPartner.${brand_id}.card_issuance_enabled == true from the documented default"
            - "BrandPartner.${brand_id}.compliance_oversight_enabled == false from its documented default"

      - name: brand_partner_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.BrandPartner.fields.partner_status
          - entities.BrandPartner.fields.onboarding_checklist_complete
          - endpoints.POST_/v1/brand-partners
        distinguishing_aspect: "A client that supplies partner_status ACTIVE in the onboarding body does not get it — the row is created PENDING_ONBOARDING and the status field is system-owned."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One sponsor and one OPEN program on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Cedar Trust Bank", charter_state_code: "UT", sponsorship_capacity_programs: 10, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Harbor Reload Program", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "POST /v1/brand-partners"
              payload: { program_id: "${prog_id}", brand_name: "Pushy Brand", services_scope: ["CARD_ISSUANCE", "LEDGERING", "COMPLIANCE_OVERSIGHT", "DISPUTE_HANDLING"], card_issuance_enabled: true, ledgering_enabled: true, compliance_oversight_enabled: true, expected_program_version: "${prog_v}" }
              as: ComplianceOfficer
              captures: { brand_id: $.data.id }
          assert:
            - "BrandPartner.${brand_id}.partner_status == PENDING_ONBOARDING (no ACTIVE value was accepted from the payload)"
            - "BrandPartner.${brand_id}.suspension_source == NONE"
            - "BrandPartner.${brand_id}.open_dispute_count == 0"
            - "BrandPartner.${brand_id}.onboarding_checklist_complete == true, because every service in the scope has its enabling flag true"

      - name: float_window_type_constraints_reject_bad_enum_and_zero_amount
        claim_type: Type Constraints
        grounds:
          - entities.FloatWindow.fields.float_amount_cents
          - entities.FloatWindow.fields.buffer_minutes
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A float window with float_amount_cents 0 is refused for violating the >= 1 constraint, and an unknown armored_carrier value is refused as an invalid enum rather than silently stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One sponsor, one program, one ACTIVE agreement, one OPEN location."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Cedar Trust Bank", charter_state_code: "UT", sponsorship_capacity_programs: 10, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Harbor Reload Program", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/retailer-agreements"
              payload: { program_id: "${prog_id}", retailer_name: "QuickMart", fee_split_retailer_pct: 0.35, per_transaction_limit_cents: 15000, daily_location_limit_cents: 3000000, settlement_period_hours: 24, reload_enabled: true }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /v1/retailer-agreements/${agr_id}/state"
              payload: { to_status: "ACTIVE" }
              as: ProgramManager
              as_user_id: "${prog_id}"
            - call: "POST /v1/reload-locations"
              payload: { retailer_agreement_id: "${agr_id}", location_code: "QM-001", state_code: "TX", register_count: 2 }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /v1/float-windows"
              payload: { reload_location_id: "${loc_id}", window_start_at: "2026-09-01T14:00:00Z", window_end_at: "2026-09-01T15:00:00Z", armored_carrier: "Loomis", float_amount_cents: 0, buffer_minutes: 120 }
              as: SettlementOperator
              captures: { err: $.data.error_id }
          assert:
            - "the zero-amount request returns error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "no FloatWindow row is created"
            - "the interval constraint float_amount_cents >= 1 is the violation, so the request never reaches the overlap rule"

      - name: bank_sponsor_capacity_counter_is_derived
        claim_type: Computed Fields
        grounds:
          - entities.BankSponsor.fields.active_program_count
          - entities.BankSponsor.fields.is_capacity_exhausted
          - endpoints.POST_/v1/programs
        distinguishing_aspect: "The sponsor's active_program_count is recomputed as programs are created, so a capacity of 2 on a sponsor carrying 2 programs reads is_capacity_exhausted true without any client-supplied flag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One sponsor with capacity 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Cedar Trust Bank", charter_state_code: "UT", sponsorship_capacity_programs: 2, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Harbor One", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/programs"
              payload: { name: "Harbor Two", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/bank-sponsors/${bank_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "BankSponsor.${bank_id}.active_program_count == 2"
            - "BankSponsor.${bank_id}.is_capacity_exhausted == true at exactly the capacity"
            - "BankSponsor.${bank_id}.oversight_reviews_completed == 0"
            - "the count is read from the sponsor, not from any client-supplied program list"

      - name: reload_location_requires_valid_parent_agreement
        claim_type: Parent Relationships
        grounds:
          - entities.ReloadLocation.fields.retailer_agreement_id
          - errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A reload location posted against an unstored retailer agreement id is refused with ERR_REFERENCED_RESOURCE_NOT_FOUND, so the FK is enforced at creation rather than dangling."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One sponsor and one program on file, no agreements."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Cedar Trust Bank", charter_state_code: "UT", sponsorship_capacity_programs: 10, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Harbor Reload Program", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /v1/reload-locations"
              payload: { retailer_agreement_id: "00000000-0000-4000-8000-000000000000", location_code: "QM-999", state_code: "TX", register_count: 1 }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_REFERENCED_RESOURCE_NOT_FOUND"
            - "no ReloadLocation row is created"
            - "the failure is a body-FK failure, distinct from a path-resource 404"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: brand_partner_onboarded_then_activated
        claim_type: Valid Transition
        grounds:
          - state_machines.BrandPartner.PENDING_ONBOARDING_to_ACTIVE
          - endpoints.POST_/v1/brand-partners/{id}/state
        distinguishing_aspect: "A fully scoped brand moves PENDING_ONBOARDING → ACTIVE with 200, its checklist reads complete, and the program stays OPEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One sponsor, one OPEN program, one brand with all four services and every enabling flag true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Cedar Trust Bank", charter_state_code: "UT", sponsorship_capacity_programs: 10, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Harbor Reload Program", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /v1/brand-partners"
              payload: { program_id: "${prog_id}", brand_name: "Sunrise Brand", services_scope: ["CARD_ISSUANCE", "LEDGERING", "COMPLIANCE_OVERSIGHT", "DISPUTE_HANDLING"], card_issuance_enabled: true, ledgering_enabled: true, compliance_oversight_enabled: true, expected_program_version: "${prog_v}" }
              as: ComplianceOfficer
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /v1/brand-partners/${brand_id}/state"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { resp_status: $.data.partner_status }
          assert:
            - "the response status is 200 and response_type is object"
            - "BrandPartner.${brand_id}.partner_status == ACTIVE (captured as ${resp_status})"
            - "BrandPartner.${brand_id}.onboarding_checklist_complete == true"
            - "Program.${prog_id}.compliance_posture == OPEN and posture_breach_count == 0"
            - "BrandPartner.${brand_id}.version == 2 (the activation mutated the row)"

      - name: agreement_termination_blocked_by_unsettled_accrual
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RetailerAgreement.SUSPENDED_to_TERMINATED
          - entities.RetailerAgreement.fields.accrual_pending_cents
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "With one funded load leaving accrual_pending_cents 85.99, terminating the suspended agreement is refused with ERR_INVALID_STATE; the precondition is a monetary residue, not a status flag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Program, brand, ACTIVE agreement (pct 0.35), location QM-001, REG_E account."
            - "One 3500-cent load created and funded, leaving accrual_pending_cents 85.99."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "Cedar Trust Bank", charter_state_code: "UT", sponsorship_capacity_programs: 10, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Harbor Reload Program", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /v1/brand-partners"
              payload: { program_id: "${prog_id}", brand_name: "Sunrise Brand", services_scope: ["CARD_ISSUANCE", "LEDGERING"], card_issuance_enabled: true, ledgering_enabled: true, compliance_oversight_enabled: false, expected_program_version: "${prog_v}" }
              as: ComplianceOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /v1/retailer-agreements"
              payload: { program_id: "${prog_id}", retailer_name: "QuickMart", fee_split_retailer_pct: 0.35, per_transaction_limit_cents: 15000, daily_location_limit_cents: 3000000, settlement_period_hours: 24, reload_enabled: true }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /v1/retailer-agreements/${agr_id}/state"
              payload: { to_status: "ACTIVE" }
              as: ProgramManager
              as_user_id: "${prog_id}"
            - call: "POST /v1/reload-locations"
              payload: { retailer_agreement_id: "${agr_id}", location_code: "QM-001", state_code: "TX", register_count: 2 }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /v1/card-accounts"
