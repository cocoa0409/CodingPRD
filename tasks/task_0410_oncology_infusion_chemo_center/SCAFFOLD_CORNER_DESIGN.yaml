  - section: state_machines
    instances:
      - name: toxicity_grade3_holds_cycle_excluded_stub
        claim_type: Side Effect Execution
        grounds:
          - state_machines.TreatmentCycle.ACTIVE_to_ON_HOLD
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_toxicity_grade3_holds_cycle_cancels_children
          rationale: "The grade>=3 auto-hold and its child-cancel cascade are the asserted forward effect of the named §1.8 depth-3 cascade instance."

      - name: same_nurse_verification_blocked_excluded_stub
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DrugOrder.PREPARED_to_VERIFIED
          - "errors[ERR_SAME_NURSE_VERIFICATION]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_conflict_certified_vs_same_nurse
          rationale: "Segregation-of-duties (same-nurse) rejection is exercised within the certified-vs-same-nurse priority-conflict §1.8 instance."
