              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V9801", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-10T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vyA: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vyA}/depart"
              as: VesselMaster
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V9802", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-03T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vyB: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:02Z" }
              as: PlatformAdmin
            - call: "POST /vessels/${v}/voyages/${vyB}/depart"
              as: VesselMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:03Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-22T00:00:04Z" }
              as: PlatformAdmin
            - call: "POST /vessels/${v}/voyages/${vyB}/inspections"
              payload: { inspection_kind: FLAG_STATE, sampled_at: "2026-10-20T00:00:00Z", sampled_by_role: FLAG_SURVEYOR, indicator_organism_concentration: 20.0, tss_mg_per_l: 10.0, findings: ["BWMS-14"] }
              as: FlagSurveyor
              as_user_id: "fs-rec-8"
              captures: { iB: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vyB}/inspections/${iB}/evaluate"
              as: FlagSurveyor
              as_user_id: "fs-eval-8"
