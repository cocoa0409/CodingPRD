  - method: POST
    path: "/clinics/{id}/suspend"
    description: "Suspend a clinic, terminating its contracts and freezing dependent plans"
    roles: [NetworkManager]
    code: 200
    input: []
    output: Clinic
    side_effects:
      - "clinic_status -> SUSPENDED (from CONTRACTED or PROBATION)"
      - "each ClinicContract of this clinic in ACTIVE or FROZEN -> TERMINATED"
      - "each TreatmentPlan whose clinic_id is this clinic and plan_status in CLINIC_SELECTED or AUTHORIZATION_PENDING -> PLANNING_REVISION with plan_blocked_reason CLINIC_NOT_CONTRACTED"
      - "each Preauthorization on those plans in SUBMITTED or CLINICAL_REVIEW -> DENIED with denial_reason_code CLINIC_NOT_CONTRACTED"
      - "version incremented"

  - method: POST
    path: "/clinics/{id}/terminate"
    description: "Terminate a suspended clinic permanently"
    roles: [NetworkManager]
    code: 200
    input: []
    output: Clinic
    side_effects: ["clinic_status -> TERMINATED (terminal); version incremented"]

  - method: POST
    path: "/clinics/{id}/quality-recompute"
    description: "Re-run the network quality recompute for a clinic without writing new outcome data; refreshes the derived rate fields and the clinic posture from the current workset"
    roles: [NetworkManager]
    code: 200
    input: []
    output: Clinic
    side_effects:
      - "live_birth_rate_bps, multiple_birth_rate_bps, composite_quality_bps recomputed from the current workset"
      - "clinic_status re-derived: CONTRACTED -> PROBATION on a quality breach, PROBATION -> CONTRACTED when the breach clears"
      - "A clinic whose current reading is eligible but whose latest ACTIVE contract window has already closed is demoted to SUSPENDED so the stale agreement stops gating selection"
      - "version incremented"

  - method: POST
    path: "/clinics/{id}/report-outcome"
    description: "Report a cycle outcome from the clinic side, pinning the observed cycle version"
    roles: [ClinicCoordinator]
    code: 201
    input: [treatment_cycle_id, live_birth, births_count, multiple_birth, gestational_weeks, expected_treatment_cycle_version]
    output: OutcomeRecord
    side_effects:
      - "TreatmentCycle.cycle_status -> OUTCOME_RECORDED; consumption_marker -> CONSUMED"
      - "Preauthorization.consumed_cycles and consumption_status recomputed; BundleEntitlement cycle counters recomputed"
      - "Member.completed_cycles and live_births_recorded recomputed"
      - "TreatmentPlan.cycles_completed recomputed; plan_status -> COMPLETED once planned_cycles is reached"
      - "Clinic.cycles_reported and the derived quality rates recomputed; the clinic posture may move CONTRACTED -> PROBATION or PROBATION -> CONTRACTED"
      - "TreatmentCycle.version incremented"

