            - "After the trigger, GET /sites/${site_id} returns diverted_weight_grams_settled == 1000 (the LINE allocation, not the 1200 g ticket weight) and diversion_rate_pct == 100.00."

      - name: baseline_period_rejection_loop_reruns_metrics_over_changed_source_data
        grounds: "§1.2 state_machines.BaselinePeriod transitions OPEN_to_SUBMITTED, SUBMITTED_to_OPEN (rejection_count += 1, metrics cleared) and SUBMITTED_to_CERTIFIED; §1.3 calculations.baseline_period_metrics."
