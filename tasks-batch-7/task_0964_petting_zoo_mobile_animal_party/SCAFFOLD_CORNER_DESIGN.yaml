            - { call: "POST /petting-zoo/venues", payload: { name: "Venue A", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${ca}", captures: { va: $.data.id } }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${va}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${ca}", captures: { bk: $.data.id } }
