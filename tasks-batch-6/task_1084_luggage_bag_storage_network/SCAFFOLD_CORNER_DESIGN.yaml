# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Luggage & Bag Storage Network — Expert. Breadth probe over §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: host_create_returns_full_host
        claim_type: Creation
        grounds: [entities.Host, endpoints]
        distinguishing_aspect: "POST /hosts with required fields -> 201; response carries display_name, status=ACTIVE, zeroed balances, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hosts"
              payload: { display_name: "Acme Storage", email: "a@x.com", platform_fee_bps: 1500, max_concurrent_bookings: 3 }
              as: PlatformAdmin
              captures: { host_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "HTTP 201; Host.${host_id}.status == ACTIVE"
            - "Host.${host_id}.payout_balance_cents == 0 and version == 1"

      - name: get_host_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Host, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /hosts/{unknown-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /hosts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: traveler_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Traveler, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /travelers without full_name -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /travelers"
              payload: { email: "nobody@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (HTTP 400)"

      - name: booking_bag_count_and_oversize_computed
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.bag_count, entities.Booking.fields.oversize_count, entities.Bag.fields.is_oversize]
        distinguishing_aspect: "bag_count and oversize_count are derived from bags[]; a dim 160 bag is is_oversize=true."
        test_recipe:
          setup: ["OPEN location; booking of 2 bags (one dim 100, one dim 160)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "NONE", per_bag_coverage_cents: 0, premium_cents_per_bag_day: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-12", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 }, { declared_value_cents: 1000, dimension_sum_cm: 160 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id, bc: $.data.bag_count, oc: $.data.oversize_count }
            - call: "GET /bookings/${bkg_id}/bags"
              payload: {}
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { b0_over: "$.data[0].is_oversize" }
          assert:
            - "Booking.${bkg_id}.bag_count == 2 and oversize_count == 1"

      - name: booking_unknown_location_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Booking.fields.location_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /bookings referencing a non-existent location_id -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A traveler and an insurance plan exist; no location with the supplied id."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "NONE", per_bag_coverage_cents: 0, premium_cents_per_bag_day: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { location_id: "00000000-0000-4000-8000-000000000000", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-12", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 } ] }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (HTTP 404) — existence is checked before OCC"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_after_dropoff_returns_cancel_not_allowed
        claim_type: invalid_transition
        grounds: [state_machines.Booking.RESERVED_to_CANCELLED, "errors[ERR_CANCEL_NOT_ALLOWED]"]
        distinguishing_aspect: "Cancelling a STORED booking (already dropped off) -> ERR_CANCEL_NOT_ALLOWED (409)."
        test_recipe:
          setup: ["A STORED booking (dropped off) at an OPEN location."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "NONE", per_bag_coverage_cents: 0, premium_cents_per_bag_day: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-12", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id }
            - call: "GET /bookings/${bkg_id}/bags"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
              captures: { bag0: "$.data[0].id" }
            - call: "POST /bookings/${bkg_id}/dropoff"
              payload: { seals: [ { bag_id: "${bag0}", seal_code: "K0", photo_url: "http://p/0" } ] }
              as: Host
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /bookings/${bkg_id}/cancel"
              payload: {}
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CANCEL_NOT_ALLOWED (HTTP 409)"

      - name: pickup_from_reserved_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Booking.STORED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Pickup on a RESERVED (not-yet-dropped) booking -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A RESERVED booking (never dropped off) at an OPEN location."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "NONE", per_bag_coverage_cents: 0, premium_cents_per_bag_day: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-12", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bkg_id}/pickup"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (HTTP 409)"

      - name: close_location_with_active_bookings_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.Location.OPEN_to_CLOSED, "errors[ERR_LOCATION_HAS_ACTIVE_BOOKINGS]"]
        distinguishing_aspect: "Closing a location that still has a RESERVED booking -> ERR_LOCATION_HAS_ACTIVE_BOOKINGS (409)."
        test_recipe:
          setup: ["OPEN location with one RESERVED booking."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "NONE", per_bag_coverage_cents: 0, premium_cents_per_bag_day: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-12", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id }
          trigger:
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "CLOSED" }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOCATION_HAS_ACTIVE_BOOKINGS (HTTP 409)"

      - name: extension_reject_leaves_booking_unchanged
        claim_type: side_effect_execution
        grounds: [state_machines.Extension.REQUESTED_to_REJECTED, entities.Booking.fields.check_out_date]
        distinguishing_aspect: "Rejecting an extension leaves the booking's check_out_date and estimate unchanged (divergent from the CONFIRM branch)."
        test_recipe:
          setup: ["A STORED booking (check_out 2026-06-13, estimate 7200) with a REQUESTED extension to 2026-06-16."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "PREMIUM", per_bag_coverage_cents: 50000, premium_cents_per_bag_day: 200 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-13", bags: [ { declared_value_cents: 20000, dimension_sum_cm: 100 }, { declared_value_cents: 20000, dimension_sum_cm: 100 }, { declared_value_cents: 20000, dimension_sum_cm: 160 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id }
            - call: "GET /bookings/${bkg_id}/bags"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
              captures: { bag0: "$.data[0].id", bag1: "$.data[1].id", bag2: "$.data[2].id" }
            - call: "POST /bookings/${bkg_id}/dropoff"
              payload: { seals: [ { bag_id: "${bag0}", seal_code: "K0", photo_url: "http://p/0" }, { bag_id: "${bag1}", seal_code: "K1", photo_url: "http://p/1" }, { bag_id: "${bag2}", seal_code: "K2", photo_url: "http://p/2" } ] }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${bkg_id}/extensions"
              payload: { new_check_out_date: "2026-06-16" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { ext_id: $.data.id }
          trigger:
            - call: "POST /extensions/${ext_id}/decide"
              payload: { decision: "REJECT" }
              as: Host
              as_user_id: "${host_id}"
              captures: { es: $.data.status }
            - call: "GET /bookings/${bkg_id}"
              payload: {}
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { co: $.data.check_out_date, est: $.data.estimated_total_cents }
          assert:
            - "Extension.${ext_id}.status == REJECTED"
            - "Booking.${bkg_id}.check_out_date == 2026-06-13 and estimated_total_cents == 7200 (unchanged)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: oversize_threshold_150_boundary
        claim_type: boundary_edge
        grounds: [calculations.booking_estimate, entities.Bag.fields.is_oversize]
        distinguishing_aspect: "dimension_sum_cm 149 -> standard; 150 -> oversize (>= threshold), so a 149+150 pair yields oversize_count 1."
        test_recipe:
          setup: ["OPEN location; booking of 2 bags at dim 149 and dim 150."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "NONE", per_bag_coverage_cents: 0, premium_cents_per_bag_day: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-11", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 149 }, { declared_value_cents: 1000, dimension_sum_cm: 150 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id, oc: $.data.oversize_count }
          assert:
            - "Booking.${bkg_id}.oversize_count == 1 (149 standard, 150 oversize)"

      - name: claim_award_capped_to_declared_value
        claim_type: correct_result
        grounds: [calculations.claim_award, "errors[ERR_COVERAGE_CAP_EXCEEDED]"]
        distinguishing_aspect: "approved_amount_cents of 20000 on a bag declared at 10000 (plan cap 50000) -> ERR_COVERAGE_CAP_EXCEEDED (422); cap = min(50000,10000,claimed)."
        test_recipe:
          setup: ["Completed 1-bag booking, bag declared 10000, PREMIUM plan cap 50000; claim claimed 9000, reviewed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "PREMIUM", per_bag_coverage_cents: 50000, premium_cents_per_bag_day: 200 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-11", bags: [ { declared_value_cents: 10000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id }
            - call: "GET /bookings/${bkg_id}/bags"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
              captures: { bag0: "$.data[0].id" }
            - call: "POST /bookings/${bkg_id}/dropoff"
              payload: { seals: [ { bag_id: "${bag0}", seal_code: "K0", photo_url: "http://p/0" } ] }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${bkg_id}/pickup"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${bkg_id}/claims"
              payload: { bag_id: "${bag0}", reason: "DAMAGE", description: "d", claimed_amount_cents: 9000 }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/review"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /claims/${claim_id}/decide"
              payload: { decision: "APPROVE", approved_amount_cents: 20000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COVERAGE_CAP_EXCEEDED (HTTP 422); 20000 > min(50000, 10000, 9000)"

      - name: host_avg_rating_running_average
        claim_type: correct_result
        grounds: [calculations.host_avg_rating, entities.Host.fields.avg_rating]
        distinguishing_aspect: "After one rating of 5 on a COMPLETED booking, host rating_count == 1 and avg_rating == 5.00."
        test_recipe:
          setup: ["A COMPLETED booking; traveler rates it 5."]
