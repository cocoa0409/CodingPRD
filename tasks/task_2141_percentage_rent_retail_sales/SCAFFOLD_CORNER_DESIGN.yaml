  # =========================================================================
  - section: endpoints
    instances:
      - name: clock_defaults_to_2026_08_01_before_any_set_call
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /_clock/set_current_utc"]
          - endpoints["GET /_clock"]
        distinguishing_aspect: "With no set_current_utc call ever made, GET /_clock reads exactly 2026-08-01T00:00:00.000Z and business writes do not advance it toward real wall-clock time."
        test_recipe:
          setup:
            - "Empty database; no clock call has been made."
          setup_api_calls:
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
          trigger:
            - call: "GET /_clock"
              payload: {}
              as: LeaseAdministrator
          assert:
            - "HTTP status is 200 and data.current_utc == \"2026-08-01T00:00:00.000Z\""

      - name: issue_draft_credit_charge_moves_billing_axis_and_ledger
        claim_type: Action endpoint
        grounds:
          - state_machines.PercentageRentCharge.DRAFT_to_ISSUED
          - calculations.annual_true_up
          - entities.ReportingLedgerEntry.fields.entry_type
        distinguishing_aspect: "Reconciling a PERIOD_STANDALONE year that billed 1,600,000 against an annual due of 0 creates a DRAFT CREDIT charge of -1,600,000; issuing it moves billing_status to ISSUED, drives cumulative_billed_cents to 0 and appends a CREDIT_ISSUED ledger entry."
