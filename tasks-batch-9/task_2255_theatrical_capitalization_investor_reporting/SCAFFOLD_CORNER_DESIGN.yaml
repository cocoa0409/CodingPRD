# Corner design (§1.9) - breadth coverage of every testable claim in §1.1-§1.7
# that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already assert.
# Sections follow references/claim-extraction-guide.md; claim_type values are its table rows.
scaffold_corner_design:
- section: entities
  instances:
  - name: theatre_creation_returns_all_declared_fields
    claim_type: creation
    grounds:
    - entities.Theatre
    - endpoints[POST /theatres]
    - response_envelope.success
    distinguishing_aspect: A create returns every declared Theatre field plus the four common fields; version starts at 1 and created_at == updated_at.
    test_recipe:
      setup:
      - Empty database; the logical clock sits at its default 2026-08-01T00:00:00Z.
      setup_api_calls: []
      trigger:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
          weekly_fixed_rent_cents: 8500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      - call: GET /theatres/${th}
        as: LeadProducer
        as_user_id: u-lp-1
      assert:
      - 'Call 1: HTTP 201 with response_type == "object"'
      - 'Call 1: meta.api_request_id and meta.api_request_timestamp are both present and non-empty'
      - 'Call 1: data.name == "Palace Theatre", data.seat_count == 1200, data.top_ticket_price_cents == 19900'
      - 'Call 1: data.changeover_buffer_days == 3, data.weekly_fixed_rent_cents == 8500000'
      - 'Call 1: data.id is a non-empty string, data.version == 1, data.created_at == data.updated_at'
      - 'Call 2: HTTP 200 and the read-back row is field-for-field identical to the create response, including data.version == 1'
  - name: production_retrieval_returns_stored_and_computed_fields
    claim_type: retrieval
    grounds:
    - entities.Production
    - endpoints[GET /productions/{id}]
    distinguishing_aspect: A freshly created Production reads back with every input field as supplied, every system field at its default and every computed rollup at zero.
    test_recipe:
      setup:
      - One Theatre and one Production exist; nothing else has happened.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
          weekly_fixed_rent_cents: 8500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Understudy
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
          pv: $.data.version
      trigger:
      - call: GET /productions/${pr}
        as: Comptroller
        as_user_id: u-ct-1
      assert:
      - HTTP 200 with response_type == "object"
      - data.title == "The Understudy", data.offering_entity_type == "LP", data.theatre_id == ${th}
      - data.capitalization_target_cents == 120000000, data.reserve_target_cents == 20000000
      - data.pre_recoupment_pool_pct == 0.35, data.post_recoupment_pool_pct == 0.4, data.subsidiary_rights_investor_share_pct == 0.4, data.closing_notice_min_days == 14
      - data.royalty_basis == "FIXED_GROSS", data.offering_status == "DRAFT", data.operating_status == "PRE_PRODUCTION", data.recoupment_status == "UNRECOUPED", data.budget_status == "DRAFT"
      - data.budget_total_cents == 0, data.budget_committed_cents == 0, data.capital_raised_cents == 0, data.released_capital_cents == 0, data.escrow_balance_cents == 0
      - data.recouped_amount_cents == 0, data.recoupment_pct == 0.0, data.deferred_royalty_cents == 0, data.distributed_total_cents == 0, data.distributable_cash_cents == 0
      - data.total_pool_points == 0, data.active_investor_count == 0, data.version == 1
  - name: productions_listing_paginates_and_filters
    claim_type: listing
    grounds:
    - entities.Production
    - endpoints[GET /productions]
    - response_envelope.pagination_fields
    distinguishing_aspect: 'Three productions in one theatre: limit/offset walk the page boundary and the offering_status filter is applied before pagination, not after.'
    test_recipe:
      setup:
      - One Theatre and three Productions in that theatre exist, all still offering_status DRAFT.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
          weekly_fixed_rent_cents: 8500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Understudy
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
          pv: $.data.version
      - call: POST /productions
        payload:
          title: Second House
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
          pv: $.data.version
      - call: POST /productions
        payload:
          title: Third House
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
          pv: $.data.version
      trigger:
      - call: GET /productions?theatre_id=${th}&limit=2&offset=0
        as: LeadProducer
        as_user_id: u-lp-1
      - call: GET /productions?theatre_id=${th}&limit=2&offset=2
        as: LeadProducer
        as_user_id: u-lp-1
      - call: GET /productions?offering_status=OFFERING
        as: LeadProducer
        as_user_id: u-lp-1
      assert:
      - 'First call: HTTP 200, response_type == "array", exactly 2 elements in data, total_count == 3, has_more == true, limit == 2, offset == 0'
      - 'Second call: exactly 1 element in data, total_count == 3, has_more == false, offset == 2'
      - 'Third call: 0 elements in data, total_count == 3 is NOT reported - total_count == 0 and has_more == false, because the filter is applied before the page window'
      - The union of the two pages contains three distinct data[N].id values and no duplicates
  - name: unknown_entity_ids_return_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_PRODUCTION_NOT_FOUND]
    - errors[ERR_WEEKLY_WRAP_NOT_FOUND]
    - errors[ERR_ROYALTY_ALLOCATION_NOT_FOUND]
    - errors[ERR_INVESTOR_ACCOUNT_NOT_FOUND]
    - validations[priority 3]
    distinguishing_aspect: A syntactically valid but unused id on four different read endpoints yields the entity-specific 404, never a generic one.
    test_recipe:
      setup:
      - One Theatre and one Production exist; the probed ids belong to no row.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
          weekly_fixed_rent_cents: 8500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Understudy
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
          pv: $.data.version
      trigger:
      - call: GET /productions/00000000-0000-0000-0000-0000000000ff
        as: Comptroller
        as_user_id: u-ct-1
        captures:
          e1: $.data.error_id
      - call: GET /weekly-wraps/00000000-0000-0000-0000-0000000000ff
        as: Comptroller
        as_user_id: u-ct-1
        captures:
          e2: $.data.error_id
      - call: GET /royalty-allocations/00000000-0000-0000-0000-0000000000ff
        as: Comptroller
        as_user_id: u-ct-1
        captures:
          e3: $.data.error_id
      - call: GET /investor-accounts/00000000-0000-0000-0000-0000000000ff
        as: Comptroller
        as_user_id: u-ct-1
        captures:
          e4: $.data.error_id
      assert:
      - 'Call 1: HTTP 404 with data.error_id == "ERR_PRODUCTION_NOT_FOUND"'
      - 'Call 2: HTTP 404 with data.error_id == "ERR_WEEKLY_WRAP_NOT_FOUND"'
      - 'Call 3: HTTP 404 with data.error_id == "ERR_ROYALTY_ALLOCATION_NOT_FOUND"'
      - 'Call 4: HTTP 404 with data.error_id == "ERR_INVESTOR_ACCOUNT_NOT_FOUND"'
      - Every response carries response_type == "error" and a non-empty data.message
  - name: missing_required_body_fields_rejected
    claim_type: required_fields
    grounds:
    - entities.BudgetLine.amount_cents
    - entities.Theatre.seat_count
    - validations[priority 4]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting a field whose source is input and which has no default is a 400 before any state or fiscal rule runs; nothing is persisted.
    test_recipe:
      setup:
      - One Theatre and one Production exist; the Production has no budget lines.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
          weekly_fixed_rent_cents: 8500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Understudy
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
          pv: $.data.version
      trigger:
      - call: POST /budget-lines
        payload:
          production_id: ${pr}
          component: PRODUCTION
          description: Scenery build
          expected_production_version: ${pv}
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          e1: $.data.error_id
      - call: POST /theatres
        payload:
          name: Second House
          top_ticket_price_cents: 19900
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          e2: $.data.error_id
      - call: GET /budget-lines?production_id=${pr}
        as: GeneralManager
        as_user_id: u-gm-1
      - call: GET /productions/${pr}
        as: GeneralManager
        as_user_id: u-gm-1
      assert:
      - 'Call 1: HTTP 400 with data.error_id == "ERR_INVALID_REQUEST" (amount_cents absent)'
      - 'Call 2: HTTP 400 with data.error_id == "ERR_INVALID_REQUEST" (seat_count absent)'
      - 'Call 3: total_count == 0 - the rejected line was not persisted'
      - 'Call 4: data.budget_total_cents == 0 and data.version == 1 - a rejected request increments no version'
  - name: optional_input_defaults_applied_when_omitted
    claim_type: defaults
    grounds:
    - entities.Theatre.changeover_buffer_days
    - entities.Theatre.weekly_fixed_rent_cents
    - entities.Production.pre_recoupment_pool_pct
    - entities.Production.closing_notice_min_days
    - entities.OperatingBudget.performances_per_week
    distinguishing_aspect: Every field carrying a declared default is filled from the scaffold default when omitted - 3 dark days, 0 rent, 0.35 / 0.4 pool percentages, 0.4 subsidiary share, 14 notice days,
      8 performances.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /theatres
        payload:
          name: Bare Theatre
          seat_count: 900
          top_ticket_price_cents: 15000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: Bare Production
          offering_entity_type: LLC
          capitalization_target_cents: 90000000
          reserve_target_cents: 10000000
          theatre_id: ${th}
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
      - call: POST /operating-budgets
        payload:
          production_id: ${pr}
          weekly_fixed_running_cost_cents: 20000000
          variable_cost_pct: 0.04
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          ob: $.data.id
      assert:
      - 'Call 1: data.changeover_buffer_days == 3 and data.weekly_fixed_rent_cents == 0'
      - 'Call 2: data.pre_recoupment_pool_pct == 0.35, data.post_recoupment_pool_pct == 0.4, data.subsidiary_rights_investor_share_pct == 0.4, data.closing_notice_min_days == 14'
      - 'Call 2: data.royalty_basis == "FIXED_GROSS", data.offering_status == "DRAFT", data.operating_status == "PRE_PRODUCTION", data.budget_status == "DRAFT"'
      - 'Call 3: data.performances_per_week == 8 and data.status == "DRAFT"'
  - name: weekly_wrap_computed_fields_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.WeeklyWrap.capacity_gross_cents
    - entities.WeeklyWrap.paid_capacity_pct
    - entities.WeeklyWrap.variable_cost_cents
    - entities.WeeklyWrap.adjusted_gross_cents
    - entities.WeeklyWrap.royalty_base_cents
    - calculations.wrap_settlement
    distinguishing_aspect: 'Client-supplied values for the five provisionally computed wrap fields are discarded and recomputed from Theatre / OperatingBudget: capacity 191040000, capacity pct 0.8542, variable
      3250000, adjusted 61750000, base 28250000.'
    test_recipe:
      setup:
      - A CAPITALIZED production is RUNNING at the Palace with an ACTIVE operating budget (32000000 fixed, 0.05 variable, 8 performances); the clock is 2026-09-07.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
          weekly_fixed_rent_cents: 8500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Understudy
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
          pv: $.data.version
      - call: POST /operating-budgets
        payload:
          production_id: ${pr}
          weekly_fixed_running_cost_cents: 32000000
          variable_cost_pct: 0.05
          performances_per_week: 8
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          ob: $.data.id
          obv: $.data.version
      - call: POST /operating-budgets/${ob}/activate
        payload: {}
        as: Comptroller
        as_user_id: u-ct-1
      - call: POST /productions/${pr}/open-offering
        payload: {}
        as: SyndicationCounsel
        as_user_id: u-sc-1
      - call: POST /offering-documents
        payload:
          production_id: ${pr}
          doc_type: LP_AGREEMENT
          offering_amount_cents: 120000000
          unit_price_cents: 120000000
          max_investors: 3
          effective_date: '2026-07-15'
          expiration_date: '2026-12-31'
        as: SyndicationCounsel
        as_user_id: u-sc-1
        captures:
          od: $.data.id
      - call: POST /offering-documents/${od}/make-effective
        payload: {}
        as: SyndicationCounsel
        as_user_id: u-sc-1
      - call: POST /investors
        payload:
          legal_name: Amelia Hart
          jurisdiction: NY
          contact_email: amelia.hart@example.com
        as: SyndicationCounsel
        as_user_id: u-sc-1
        captures:
          iv1: $.data.id
      - call: POST /investors/${iv1}/accredit
        payload:
          accreditation_status: ACCREDITED
        as: SyndicationCounsel
        as_user_id: u-sc-1
      - call: POST /subscriptions
        payload:
          offering_document_id: ${od}
          investor_id: ${iv1}
          units: 1
        as: Investor
        as_user_id: ${iv1}
        captures:
          sb1: $.data.id
      - call: POST /subscriptions/${sb1}/accept
        payload: {}
        as: SyndicationCounsel
        as_user_id: u-sc-1
      - call: POST /productions/${pr}/capitalize
        payload: {}
        as: Comptroller
        as_user_id: u-ct-1
      - call: POST /productions/${pr}/operating-status
        payload:
          to_status: REHEARSAL
        as: LeadProducer
        as_user_id: u-lp-1
      - call: POST /productions/${pr}/operating-status
        payload:
          to_status: PREVIEWS
        as: LeadProducer
        as_user_id: u-lp-1
      - call: POST /productions/${pr}/operating-status
        payload:
          to_status: RUNNING
        as: LeadProducer
        as_user_id: u-lp-1
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-07T00:00:00Z'
        as: GeneralManager
        as_user_id: u-gm-1
      trigger:
      - call: POST /weekly-wraps
        payload:
          production_id: ${pr}
          week_ending_date: '2026-09-06'
          performances: 8
          gross_receipts_cents: 65000000
          paid_attendance: 8200
          running_expenses_cents: 33500000
          capacity_gross_cents: 1
          paid_capacity_pct: 0.9999
          variable_cost_cents: 1
          adjusted_gross_cents: 1
          royalty_base_cents: 999999999
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          wr1: $.data.id
      assert:
      - HTTP 201; data.capacity_gross_cents == 191040000 (1200 * 19900 * 8), not the supplied 1
      - data.paid_capacity_pct == 0.8542 (8200 / 9600 = 0.85416... round_half_up 4), not the supplied 0.9999
      - data.variable_cost_cents == 3250000 (round_half_up(65000000 * 0.05)), data.adjusted_gross_cents == 61750000
      - data.royalty_base_cents == 28250000 (61750000 - 33500000), not the supplied 999999999
      - data.royalty_pool_cents is null, data.weekly_operating_profit_cents is null and data.royalty_basis_applied is null - step 4 onward runs only at certification
  - name: production_system_fields_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Production.offering_status
    - entities.Production.operating_status
    - entities.Production.royalty_basis
    - entities.Production.budget_status
    distinguishing_aspect: 'id, created_at, version and every system-source status field are server-owned: supplying them in the create body changes nothing.'
    test_recipe:
      setup:
      - One Theatre exists.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
          weekly_fixed_rent_cents: 8500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      trigger:
      - call: POST /productions
        payload:
          title: Forged Fields
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          id: forged-id
          version: 99
          created_at: '2020-01-01T00:00:00Z'
          offering_status: CAPITALIZED
          operating_status: RUNNING
          royalty_basis: POOL
          budget_status: APPROVED
          recouped_amount_cents: 500000000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
      assert:
      - HTTP 201; data.id != "forged-id" and data.version == 1
      - data.created_at is the current logical clock 2026-08-01T00:00:00Z, not 2020-01-01T00:00:00Z
      - data.offering_status == "DRAFT", data.operating_status == "PRE_PRODUCTION", data.royalty_basis == "FIXED_GROSS", data.budget_status == "DRAFT"
      - data.recouped_amount_cents == 0 and data.recoupment_status == "UNRECOUPED"
  - name: undeclared_enum_and_reversed_date_range_rejected
    claim_type: type_constraints
    grounds:
    - entities.TheatreEngagement.engagement_type
    - validations[priority 4]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: An enum member outside the declared set and an end_date earlier than start_date are both priority-4 rejections, ahead of the priority-13 occupation rule.
    test_recipe:
      setup:
      - One Theatre and one Production exist; the house has no engagements.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Palace Theatre
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
          weekly_fixed_rent_cents: 8500000
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Understudy
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 20000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          pr: $.data.id
          pv: $.data.version
      trigger:
      - call: POST /theatre-engagements
        payload:
          production_id: ${pr}
          theatre_id: ${th}
          engagement_type: TECHNICAL
          start_date: '2026-08-10'
          end_date: '2026-09-30'
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          e1: $.data.error_id
      - call: POST /theatre-engagements
        payload:
          production_id: ${pr}
          theatre_id: ${th}
          engagement_type: TECH
          start_date: '2026-09-30'
          end_date: '2026-08-10'
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          e2: $.data.error_id
      - call: GET /theatre-engagements?theatre_id=${th}
        as: GeneralManager
        as_user_id: u-gm-1
      assert:
      - 'Call 1: HTTP 400 with data.error_id == "ERR_INVALID_REQUEST" ("TECHNICAL" is not in {REHEARSAL, TECH, PERFORMANCE_RUN})'
