            - "The clock set by UtilityInspector takes effect: ${ds3_created} == 2026-08-01T06:00:00.000Z on the duct system created straight after it, so the clock endpoint really is shared with every role"
            - "${seen} == ${proj_id} with meta.total_count == 3: every GET is shared with all four roles, UtilityInspector included"
            - "Project.${proj_id}.version advanced once per accepted write across the four hold/release calls"

      - name: exclusive_operations_are_refused_to_every_other_role
        claim_type: cross_role_unauthorized
        grounds:
          - roles.QAVerifier.exclusive_operations
          - roles.FieldTechnician.exclusive_operations
          - roles.ProgramAdmin.exclusive_operations
          - roles.UtilityInspector.exclusive_operations
          - validations[priority=20]
        distinguishing_aspect: "Each of the four roles is aimed at another role's exclusive operation, and two of those calls are also invalid for a SECOND reason — one targets a test in the wrong state, the other an id that does not exist — so the 403 has to be returned ahead of both the 409 (priority 60) and the 404 (priority 40). A shared GET made by the same rejected caller then proves the refusal was scoped to the write."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; a SCHEDULED seal job on AHU-1 whose PRE test is already ACCEPTED"
