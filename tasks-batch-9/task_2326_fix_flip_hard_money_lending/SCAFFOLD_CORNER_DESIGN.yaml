        grounds:
          - validations[priority=12]
          - endpoints[POST /lending/borrowers/{id}/status]
          - endpoints[POST /lending/applications]
          - calculations.borrower_experience_score
          - errors[ERR_GUARANTEE_NOT_EXECUTED]
          - errors[ERR_ENTITY_TYPE_NOT_ELIGIBLE]
          - errors[ERR_BORROWER_NOT_ELIGIBLE]
        distinguishing_aspect: "One priority row splits into three codes chosen by which clause failed: no executed guarantee at approval is ERR_GUARANTEE_NOT_EXECUTED, a SOLE_PROP sponsor that is otherwise fully approved is ERR_ENTITY_TYPE_NOT_ELIGIBLE at application creation only, and both a TIER_D score and a non-APPROVED_SPONSOR status are ERR_BORROWER_NOT_ELIGIBLE - and executing the guarantee then approving turns the same refused application call into a 201."
