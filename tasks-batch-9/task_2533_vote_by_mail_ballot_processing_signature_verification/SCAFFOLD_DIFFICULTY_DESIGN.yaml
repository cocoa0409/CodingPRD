            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=POSTURE_CHANGED returns exactly 1 entry whose subject_entity == \"Election\" and ballot_content_disclosed == false"

      - name: address_failure_enrollment_suspension_voter_flag_chain
        grounds:
          - state_machines.AddressVerification.PENDING_to_FAILED
          - state_machines.BallotRequest.RECEIVED_to_ADDRESS_HOLD
          - state_machines.PermanentAbsenteeEnrollment.ACTIVE_to_SUSPENDED
          - entities.Voter.fields.permanent_absentee_active
          - entities.PermanentAbsenteeEnrollment.fields.consecutive_undeliverable_count
        distinguishing_aspect: |
          A second depth-3 chain from an entirely different trigger — POST /address-verifications/{id}/results
          with a NON_FORWARDABLE outcome. The verification failing causes the request to enter ADDRESS_HOLD
          (link 1); the request entering ADDRESS_HOLD with forwarding_class NON_FORWARDABLE is what
          increments the enrollment counter to the suspension threshold (link 2); the suspension itself is
          what clears Voter.permanent_absentee_active and appends the ENROLLMENT_SUSPENDED log row (link 3).
        test_recipe:
          setup:
            - "One election in posture PRE_MAIL; clock 2026-09-10T00:00:00Z"
            - "One voter with an ACTIVE permanent absentee enrollment (permanent_absentee_active == true, consecutive_undeliverable_count == 0)"
            - "One ballot request already in ADDRESS_HOLD after a MATCH_NON_FORWARDABLE result, leaving consecutive_undeliverable_count == 1 with the enrollment still ACTIVE (PAE_SUSPENSION_THRESHOLD is 2)"
          setup_api_calls:
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ElectionsAdmin
