      - name: same_agency_canvass_closed_windows_with_trailing_only_buffer
        grounds:
          - validations[priority=38]
          - errors.ERR_AREA_CANVASS_OVERLAP
          - endpoints[POST /neighborhood-safety/request-areas]
          - entities.RequestArea.fields.window_start_utc
          - entities.RequestArea.fields.window_end_utc
          - entities.RequestArea.fields.status
        distinguishing_aspect: |
          A different contended resource — a neighbourhood of ground belonging to one Agency,
          not one resident's camera — and deliberately the opposite interval semantics from the
          device rule: the windows are CLOSED, so an intersection consisting of a single instant
          is already a conflict, and the buffer is ASYMMETRIC (0 hours before the existing
          window's start, 24 hours after its end). Overlap therefore requires BOTH the closed
          300 m proximity disc and the buffered closed time intersection, and the test separates
          the two dimensions: one probe fails on time while sitting at exactly 300 m, one passes
          on distance at 301 m with an identical window, one passes by sitting one hour past the
          trailing buffer, and one passes immediately BEFORE the existing window, which only
          holds if the buffer really is trailing-only. Every accepted probe becomes a
          non-INVALIDATED area that participates in the next probe's check, so the rule must be
          evaluated against the whole live set rather than against the first area alone.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z; a single agency ONBOARDED; one officer with duty_role REQUESTER."
            - "Baseline RequestArea A at centre (0, 0) radius 500 with the closed footage window 2026-08-07T00:00:00Z..2026-08-08T06:00:00Z (30 hours), left in DRAFT. Its buffered occupancy is therefore 2026-08-07T00:00:00Z..2026-08-09T06:00:00Z."
            - "No devices are needed: the canvass rule is evaluated at creation, before any lock or eligibility computation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3, max_open_requests: 3, period_request_quota: 20, post_share_retention_days: 30, justification_min_chars: 80 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_req_id: "$.data.id" }
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-07T00:00:00Z", window_end_utc: "2026-08-08T06:00:00Z", area_label: "Baseline canvass" }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { areaA_id: "$.data.id", areaA_status: "$.data.status" }
          trigger:
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 200, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-08T12:00:00Z", window_end_utc: "2026-08-08T18:00:00Z", area_label: "P1 inside buffer at 200 m" }
              as: Officer
              as_user_id: "${off_req_id}"
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 300, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-08T12:00:00Z", window_end_utc: "2026-08-08T18:00:00Z", area_label: "P2 exactly 300 m" }
              as: Officer
              as_user_id: "${off_req_id}"
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 200, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-09T06:00:00Z", window_end_utc: "2026-08-09T12:00:00Z", area_label: "P3 touches buffered end" }
              as: Officer
              as_user_id: "${off_req_id}"
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 301, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-08T12:00:00Z", window_end_utc: "2026-08-08T18:00:00Z", area_label: "P4 just outside 300 m" }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { areaB_id: "$.data.id" }
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 100, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-06T12:00:00Z", window_end_utc: "2026-08-06T23:00:00Z", area_label: "P5 before the window" }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { areaC_id: "$.data.id" }
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 150, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-09T19:00:00Z", window_end_utc: "2026-08-10T01:00:00Z", area_label: "P6 one hour past the buffer" }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { areaD_id: "$.data.id" }
            - call: "GET /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", limit: 20, offset: 0 }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { area_total: "$.meta.total_count" }
          assert:
            - "${areaA_status} == DRAFT"
            - "P1 at (200, 0) over 2026-08-08T12:00:00Z..2026-08-08T18:00:00Z returns 409 with error_id ERR_AREA_CANVASS_OVERLAP: squared distance 40000 <= 90000 and the window lies inside A's buffered occupancy"
            - "P2 at (300, 0) over the same window returns 409 with error_id ERR_AREA_CANVASS_OVERLAP: squared distance is exactly 90000 and the proximity disc is closed"
            - "P3 at (200, 0) over 2026-08-09T06:00:00Z..2026-08-09T12:00:00Z returns 409 with error_id ERR_AREA_CANVASS_OVERLAP: the closed intersection with A's buffered occupancy is the single instant 2026-08-09T06:00:00Z"
            - "P4 at (301, 0) over 2026-08-08T12:00:00Z..2026-08-08T18:00:00Z returns 201: squared distance 90601 > 90000, so the identical window is irrelevant"
            - "P5 at (100, 0) over 2026-08-06T12:00:00Z..2026-08-06T23:00:00Z returns 201: it ends one hour before A's window starts and the buffer adds nothing ahead of window_start_utc"
            - "P6 at (150, 0) over 2026-08-09T19:00:00Z..2026-08-10T01:00:00Z returns 201: it starts one hour after A's buffered occupancy ends, and it also clears the buffered occupancy of P4 and P5"
            - "${area_total} == 4"
            - "RequestArea.${areaA_id}.status == DRAFT"
            - "RequestArea.${areaB_id}.center_x_m == 301"
            - "RequestArea.${areaC_id}.window_end_utc == 2026-08-06T23:00:00Z"
            - "RequestArea.${areaD_id}.window_start_utc == 2026-08-09T19:00:00Z"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: solicitation_cardinality_conserved_when_owner_revokes_a_share
        grounds:
          - state_machines.ConsentSolicitation.status.SHARED_to_WITHDRAWN
          - state_machines.ConsentSolicitation.status.SOLICITED_to_SHARED
          - state_machines.ConsentSolicitation.status.SOLICITED_to_DECLINED
          - state_machines.ConsentSolicitation.status.SOLICITED_to_EXPIRED
          - endpoints[POST /neighborhood-safety/shared-clips/{id}/purge]
          - entities.VideoRequest.fields.solicitation_count
          - entities.VideoRequest.fields.withdrawn_count
        distinguishing_aspect: |
          The conserved quantity is a CARDINALITY: solicitation_count must always equal
          pending_count + shared_count + declined_count + expired_count + withdrawn_count, and
          the total itself must never move. The compensating action is an owner revoking a share
          they already gave — the exact inverse of SOLICITED -> SHARED — so the implementation
          has to decrement shared_count and increment withdrawn_count in the same operation
          rather than simply subtracting one from shared_count (which would silently break the
          sum) or re-opening the solicitation as pending (which would break consent semantics).
          The bucket sum is checked after every single step, including one step that does not
          touch the buckets at all, and the final sweep proves the request settles in EXHAUSTED
          because the only share it ever had was compensated away.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z; agency ONBOARDED with min_device_threshold 3 and post_share_retention_days 30; officer with duty_role REQUESTER."
            - "Three residents R1, R2, R3 with one camera each at (0,10), (0,20), (0,30), retention_window_days 30, alert_radius_m 0."
            - "RequestArea (0,0) radius 500 over 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z LOCKED with eligible_device_count 3; the VideoRequest is justified and SUBMITTED, so solicitation_count is 3 and pending_count is 3."
