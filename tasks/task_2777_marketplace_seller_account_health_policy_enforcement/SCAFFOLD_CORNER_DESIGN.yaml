            - "GET /policy-rules succeeds with HTTP 200 for the Seller — the rulebook is shared with all four roles"
            - "metric snapshots: HTTP 200 for PolicyInvestigator, total_count 1"
            - "${e_snap_ar} == ERR_UNAUTHORIZED with HTTP 403 — the reviewer never sees the raw feed"
            - "notifications: HTTP 200 for AppealReviewer"
            - "${e_note_inv} == ERR_UNAUTHORIZED with HTTP 403 — the investigator never sees the seller's trail"

      - name: rbac_seller_reads_cannot_cross_the_ownership_boundary
        claim_type: shared_operations
        grounds:
          - "roles.Seller.shared_operations"
          - "validations[priority 50]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
        distinguishing_aspect: |
          Every seller-visible read is annotated "own rows only", so the same endpoint that returns 200
          for the owner must return 403 ERR_NOT_RESOURCE_OWNER for a peer — and the code must be the
          ownership code, not ERR_UNAUTHORIZED (the role IS permitted) and not a 404 (the row exists).
          The two sellers are built with disjoint identity signals so related-account detection cannot
          mint a link and disturb either posture.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Seller A (harbor-tools.example) and Seller B (delta-supply.example) share no tax id, bank token, address fingerprint or email domain, so no RelatedAccountLink is minted."
            - "Seller B owns one listing and one enforcement action (rule LA-RB7-1, WARNING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-RB7-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_rb7: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_a: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Delta Supply Co", email: "ops@delta-supply.example", tax_id_hash: "TAX-DS-0002", payout_bank_token: "BANK-DS-0002", address_fingerprint: "ADDR-DS-0002" }
              as: Anonymous
              captures: { s_b: $.data.id, b_flag: $.data.registration_risk_flag }
            - call: "POST /violations"
              payload: { seller_id: "${s_b}", policy_rule_id: "${rule_rb7}", reporter_type: "BUYER", evidence_reference: "EV-RB7-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v_b: $.data.id }
            - call: "POST /violations/${v_b}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v_b}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v_b}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a_b: $.data.id }
          trigger:
            - call: "GET /sellers/${s_b}"
              payload: {}
              as: Seller
              as_user_id: "${s_a}"
              captures: { e_row: $.data.error_id }
            - call: "GET /sellers/${s_b}/listings"
              payload: {}
              as: Seller
              as_user_id: "${s_a}"
              captures: { e_listings: $.data.error_id }
            - call: "GET /sellers/${s_b}/notifications"
              payload: {}
              as: Seller
              as_user_id: "${s_a}"
              captures: { e_notes: $.data.error_id }
            - call: "GET /enforcement-actions/${a_b}"
              payload: {}
              as: Seller
              as_user_id: "${s_a}"
              captures: { e_action: $.data.error_id }
            - call: "GET /enforcement-actions/${a_b}"
              payload: {}
              as: Seller
              as_user_id: "${s_b}"
              captures: { own_action_state: $.data.state }
          assert:
            - "${b_flag} == false and no RelatedAccountLink exists — the two identities are disjoint"
            - "the four cross-seller reads: HTTP 403 with ${e_row}, ${e_listings}, ${e_notes}, ${e_action} all ERR_NOT_RESOURCE_OWNER"
            - "none of them is ERR_UNAUTHORIZED (the Seller role IS granted these reads) and none is a 404"
            - "the owner's own read: HTTP 200 and ${own_action_state} == ISSUED"

      - name: rbac_appeal_reviewer_cannot_review_an_action_it_issued_itself
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority 60]"
          - "endpoints[POST /appeals/{id}/start-review].description"
          - "endpoints[POST /appeals/{id}/decide].side_effects"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: |
          Segregation is keyed on the HUMAN (X-User-ID), not on the role header, so the same person who
