          assert:
            - "${e_enum} == \"ERR_INVALID_REQUEST\" with HTTP 400 (SHEATH is not a member of {INSULATION, JACKET})"
            - "${e_range} == \"ERR_INVALID_REQUEST\" with HTTP 400 (filler_pct 45 breaks 0 <= filler_pct <= 40)"
            - "${e_interval} == \"ERR_INVALID_REQUEST\" with HTTP 400 (inspection_interval_days 20 breaks >= 30)"
            - "${e_limit} == \"ERR_INVALID_REQUEST\" with HTTP 400 (limit must sit inside 1..100)"
