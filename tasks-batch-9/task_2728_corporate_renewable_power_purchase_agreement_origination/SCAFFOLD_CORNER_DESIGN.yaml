      - name: attribute_conveyance_guards_allocation_then_registry_then_claim_year
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_CONFIRMED_ALLOCATION]
          - errors[ERR_REGISTRY_ACCOUNT_MISSING]
          - errors[ERR_CLAIM_YEAR_OUT_OF_WINDOW]
          - validations.priority_13_ERR_NO_CONFIRMED_ALLOCATION
          - validations.priority_15_ERR_REGISTRY_ACCOUNT_MISSING
          - validations.priority_16_ERR_CLAIM_YEAR_OUT_OF_WINDOW
          - endpoints.POST_/ppa/attribute-batches/{id}/transfer
          - endpoints.POST_/ppa/attribute-batches/{id}/retire
        distinguishing_aspect: |
          Three refused conveyances on ONE batch, each blocked by a different buyer-side
          defect while the batch itself never changes: a fully QUALIFIED buyer with a
          registry account but no allocation is refused at priority 13, and a fully
          QUALIFIED buyer WITH a confirmed allocation but no registry account is refused
          at priority 15 - qualification is not conveyance eligibility, and the two
          defects are independent. The claim-year window is then walked on both sides of
          a 2027-07 vintage: 2026 is too early and 2029 too late, yet both are inside the
          field's own declared 2026-2040 range, so neither collapses into
          ERR_INVALID_REQUEST. The successful retirement credits the recipient with the
          WHOLE 30 MWh even though allocation_breakdown records an 18/12 economic split.
        test_recipe:
          setup:
            - "An EFFECTIVE AGGREGATED 25.000 MW deal on an OPERATIONAL project, with two CONFIRMED allocations: anchor Northwind 15.000 MW (registry account present) and Cascadia 10.000 MW (registry_account_id omitted at creation)."
            - "A third QUALIFIED offtaker, Puget, which holds a registry account but has no allocation on this deal."
            - "The clock at 2027-08-01, one CALCULATED settlement period over 2027-07-01 to 2027-08-01 holding a single 30.0000 MWh uncurtailed interval, and one MINTED WREGIS batch of 30 MWh with vintage_month 2027-07."
