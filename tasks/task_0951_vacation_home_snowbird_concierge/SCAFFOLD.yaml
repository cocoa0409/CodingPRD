  - id: ERR_INVOICE_HAS_NO_LINES
    http: 409
    condition: "an invoice with no ACTIVE line is issued"
  - id: ERR_PAYMENT_AMOUNT_INVALID
    http: 409
    condition: "a payment amount is at or below 0, or the invoice is already PAID"
  - id: ERR_ENTITLEMENT_EXHAUSTED
    http: 409
