            - "GET /modules?reserved_service_contract_id=${sc} -> total_count == 2 returning ${sp1} and ${sp2}: the association is navigable from the module side"
            - "GET /service-contracts/${sc} -> contract_state is still PENDING and spare_required_count == 1 (ceil(16 * 1 * 200 / 10000) = 1): stocking spares does not activate a contract"

      - name: cabinet_read_exposes_every_derived_field_at_each_stage
        claim_type: computed_read
        grounds:
          - endpoints[GET /cabinets/{cabinet_id}]
          - calculations.cabinet_dead_pixel_ppm
          - calculations.cabinet_uniformity_score
        distinguishing_aspect: |
          The cabinet read is the report surface for four derived fields with four
          different lifecycles, and the interesting part is what they read BEFORE
          their trigger has happened: as_built_uniformity_score is null with a
          single installed module (MIN_MODULES_FOR_SCORE = 2), baseline_uniformity_score
          is null until the burn-in run reaches PASSED, and dead_pixel_ppm is a
          moving sum that gains the run's new_dead_pixel_count on completion — so
          the same cabinet reports 244.14 ppm with two clean modules and 488.28 ppm
          afterwards without any module changing. An implementation that computes
          the ppm only from modules never moves past 244.14.
        test_recipe:
          setup:
            - "An FP16-STD cabinet ${cab} (cabinet_pixel_count = 2 modules x 64 x 32 = 4096) with ${m1} (4900 nits, x 0.3130, y 0.3292, 1 dead pixel) and ${m2} (4950 nits, x 0.3128, y 0.3290, 0 dead pixels) calibrated but NOT yet installed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP16-STD", pixel_pitch_mm: 5.0, rated_brightness_nits: 5000, environmental_rating: "IP65_FULL", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 64, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 2, cabinet_weight_kg: 15.36, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 500.00, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
