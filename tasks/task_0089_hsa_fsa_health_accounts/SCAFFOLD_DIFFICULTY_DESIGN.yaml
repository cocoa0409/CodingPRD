              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "SELF_ONLY", elected_amount_cents: 437500 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 400000, source: "PAYROLL", posted_at: "2026-02-01T00:00:00Z", expected_account_version: "${acc_v1}" }
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { acc_v2: $.data.version }
          trigger:
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 37500, source: "INDIVIDUAL", posted_at: "2026-03-01T00:00:00Z", expected_account_version: "${acc_v2}" }
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { acc_v3: $.data.version }
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 1, source: "INDIVIDUAL", posted_at: "2026-04-01T00:00:00Z", expected_account_version: "${acc_v3}" }
              as: PlanAdmin
          assert:
            - "Contribution bringing prospective to exactly 437500 succeeds (201); Account.${acc_id}.contributed_cents == 437500"
            - "The next 1-cent contribution returns 422 ERR_CONTRIBUTION_CAP_EXCEEDED (437501 > 437500)"

      - name: dcfsa_zero_projected_basis_rejects_approve_on_adjudicate_endpoint
        grounds:
          - calculations.Reimbursable-Amount
          - state_machines.Claim.SUBMITTED_to_APPROVED
          - entities.Account.fields.contributed_cents
        distinguishing_aspect: |
          A DIFFERENT metric (zero-quantity edge, not a numeric threshold) on a DIFFERENT endpoint
          (POST /claims/{id}/adjudicate): a DCFSA with contributed_cents=0 yields projected_basis=0, so
          Reimbursable-Amount=0 and the APPROVE precondition reimbursable_amount_cents>0 fails — the
          zero-funds edge denies the claim.
        test_recipe:
          setup:
            - "Participant (SINGLE) owns an ACTIVE DCFSA, elected 500000, but contributed_cents=0 (no contributions posted)."
            - "A substantiated DEPENDENT_CARE claim for 30000 is SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
