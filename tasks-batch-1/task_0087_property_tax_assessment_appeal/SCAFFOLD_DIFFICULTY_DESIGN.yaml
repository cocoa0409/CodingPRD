  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: appeal_withdraw_restores_assessment_taxable_value
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_WITHDRAWN
          - state_machines.Assessment.UNDER_APPEAL_to_NOTICED
          - entities.Assessment.fields.final_taxable_value
        distinguishing_aspect: |
          Conserved quantity = Assessment.final_taxable_value. Filing an appeal (forward) then withdrawing it
          (compensating) MUST leave final_taxable_value == taxable_value (== assessed_value here, 100000),
          with appealed_value back to null — no drift on the assessment's billable value.
        test_recipe:
          setup:
            - "Assessment A NOTICED with taxable_value=100000 (no exemptions), an Appeal filed and accepted (UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Inv Owner", email: "inv@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-INV", situs_address: "15 Beech", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 100000, reassessment_event: "SALE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
              captures: { asmt_v1: $.data.version }
            - call: "POST /appeals"
              payload: { assessment_id: "${asmt_id}", filed_by_owner_id: "${owner_id}", requested_taxable_value: 80000, expected_assessment_version: "${asmt_v1}" }
              as: Taxpayer
              as_user_id: "${owner_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /appeals/${appeal_id}/accept"
              payload: {}
              as: HearingOfficer
              as_user_id: "ho-INV"
          trigger:
            - call: "POST /appeals/${appeal_id}/withdraw"
              payload: {}
              as: Taxpayer
              as_user_id: "${owner_id}"
          assert:
            - "Appeal.${appeal_id}.status == WITHDRAWN"
            - "Assessment.${asmt_id}.appealed_value == null"
            - "Assessment.${asmt_id}.final_taxable_value == 100000 (unchanged from taxable_value)"
            - "Assessment.${asmt_id}.status == NOTICED"

      - name: deferral_payment_then_overpay_reject_conserves_balance
        grounds:
          - calculations.deferral_payment_waterfall
          - validations[priority=19]
          - entities.DeferralAgreement.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = ledger identity outstanding_balance_cents == deferred_principal_cents +
          accrued_interest_cents - total_paid_cents. A valid 60000 payment followed by a rejected overpayment
          (210000 against a 150000 remaining balance) MUST leave the identity intact: balance stays 150000,
          total_paid stays 60000 — the rejected action contributes zero drift.
        test_recipe:
          setup:
            - "ACTIVE DeferralAgreement D, principal 200000 + accrued 10000 (outstanding 210000), then one valid 60000-cent payment applied (outstanding 150000)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Cons Owner", email: "cons@x.com", birth_date: "1950-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-CONS", situs_address: "16 Poplar", is_primary_residence: true }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 200000, reassessment_event: "SALE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${asmt_id}/issue-bill"
              payload: {}
              as: Assessor
              captures: { bill_id: $.data.id }
            - call: "POST /deferrals"
              payload: { parcel_id: "${parcel_id}", owner_id: "${owner_id}", annual_interest_rate: 0.05 }
              as: Assessor
              captures: { def_id: $.data.id }
            - call: "POST /deferrals/${def_id}/enroll-bill"
              payload: { tax_bill_id: "${bill_id}" }
              as: Assessor
            - call: "POST /deferrals/${def_id}/accrue-interest"
              payload: {}
              as: Assessor
              captures: { def_v2: $.data.version }
            - call: "POST /deferrals/${def_id}/payments"
              payload: { amount_cents: 60000, expected_deferral_version: "${def_v2}" }
              as: Assessor
              captures: { def_v3: $.data.version }
          trigger:
            - call: "POST /deferrals/${def_id}/payments"
              payload: { amount_cents: 210000, expected_deferral_version: "${def_v3}" }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "trigger payment rejected with ERR_PAYMENT_EXCEEDS_BALANCE (422)"
            - "DeferralAgreement.${def_id}.outstanding_balance_cents == 150000 (unchanged)"
            - "DeferralAgreement.${def_id}.total_paid_cents == 60000 (unchanged)"
