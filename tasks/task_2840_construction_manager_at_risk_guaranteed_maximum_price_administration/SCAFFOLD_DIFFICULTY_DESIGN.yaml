  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: draw_state_invalid_priority_69_outranks_contingency_insufficient_priority_121
        grounds:
          - validations.priority_69_ERR_DRAW_STATE_INVALID
          - validations.priority_121_ERR_CONTINGENCY_INSUFFICIENT
          - state_machines.ContingencyDraw.REQUESTED_to_DENIED
        distinguishing_aspect: |
          The same POST /contingency-draws/{id}/post request violates a state rule at priority
          69 and a fiscal rule at priority 121 - the draw was DENIED and its 45000.00 also
          exceeds the 40000.00 construction pot. An implementation that checks affordability
          before postability, or that returns whichever check it evaluates first, returns
          ERR_CONTINGENCY_INSUFFICIENT; the ordered table demands ERR_DRAW_STATE_INVALID with
          409, and the paired single-violation cases prove each rule is individually live.
        test_recipe:
          setup:
            - "one CmarProject 'Harborview Civic Center' with gmp_status EXECUTED, construction_contingency_remaining 40000.00, contingency_posture OPEN"
            - "one CONTINGENCY_USE_CONSTRUCTION ContingencyDraw of 45000.00 with requires_owner_approval false, moved to DENIED"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Civic Center", owner_org: "Harborview County", cm_fee_pct: 0.04, insurance_rate: 0.01, precon_fee_amount: 40000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 1000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /change-events"
              payload: { project_id: "${proj}", description: "unforeseen rock at the north footings", estimated_amount: 45000.00, origin: "FIELD_CONDITION" }
              as: ConstructionManager
              as_user_id: "cm-pm-1"
              captures: { ce: $.data.id }
            - call: "POST /change-events/${ce}/submit"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-pm-1"
            - call: "POST /change-events/${ce}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: OwnerRepresentative
              as_user_id: "owner-rep-1"
            - call: "POST /change-events/${ce}/classify"
              payload: { classification: "CONTINGENCY_USE_CONSTRUCTION", classification_note: "CM risk under the GMP" }
              as: OwnerRepresentative
              as_user_id: "owner-rep-1"
