            - "${removed_status} == REMOVED, then the GROUP_4 registration returns 201 with ${reg2_status} == REGISTERED, ${reg2_pos} == 1 and ${reg2_reg_at} == 2026-09-01T00:00:00.000Z"
      - name: cancelled_request_accepts_neither_a_referral_nor_a_second_cancel
