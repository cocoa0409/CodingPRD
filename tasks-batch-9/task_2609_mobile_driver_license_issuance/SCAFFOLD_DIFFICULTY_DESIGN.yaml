  - rule_id: transitive_cascade
    instances:

      - name: address_change_five_hop_cascade_aborts_open_presentation
        grounds: "endpoints[POST /mdl/holders/{id}/address-change].side_effects (the CASCADE block) and state_machines[UpdateOrder] transition from NONE to OPEN"
        distinguishing_aspect: "Depth 5, and every link is CAUSED by the previous one, not by the original request: address_version bump -> UpdateOrder OPEN -> one PENDING UpdateDelivery per live credential -> that delivery's existence drives its credential to UPDATE_PENDING -> UPDATE_PENDING aborts the credential's in-flight PresentationSession -> the abort appends a PresentationLogEntry and decrements Verifier.open_session_count. Removing the credential from the holder removes hops 3-5 entirely, which is what makes the chain transitive rather than five parallel writes."
