          setup:
            - "RESIDENT MEDICALLY_FRAGILE camp, census 200, hospital 45 km, staffed RN_ONSITE - required_health_staffing_level is PHYSICIAN_ONSITE, so the camp opens with a staffing gap"
            - "edition carries one ungated mandatory SUPERVISION standard and one OPERATIONS standard gated to DAY camps"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
