  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: invariant_overturn_restores_standing_enforcement_count
        grounds:
          - state_machines.EnforcementAction.transitions.DRAFT_to_ACTIVE
          - state_machines.EnforcementAction.transitions.ACTIVE_to_REVERTED
          - state_machines.Account.transitions.APPEAL_PENDING_to_ACTIVE
          - entities.Account.fields.standing_enforcement_count
        distinguishing_aspect: |
          The conserved quantity is a count of live enforcement actions: a forward
          deactivation increments it by one and the compensating overturn must return it to
          exactly its pre-deactivation value, with no drift from any intermediate cascade.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S4 and appeal_window_days 30."
            - "One ACTIVE driver account with a baseline standing_enforcement_count of 0 captured before any deactivation."
            - "One S4 PHYSICAL_ASSAULT incident held, fully evidenced and pending decision."
            - "A completed trip on the account after the enforcement effective instant, supplying the single rehabilitation credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", appeal_window_days: 30 }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Yusuf Demir", contact_email: "yusuf.demir@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
