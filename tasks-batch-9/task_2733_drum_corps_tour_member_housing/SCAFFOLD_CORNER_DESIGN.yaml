              payload: { volunteer_id: "${volunteer_id}", tour_stop_id: "${june_stop_id}", duty: "COOK", shift_start_at: "2027-06-19T09:00:00Z", shift_end_at: "2027-06-19T19:00:00Z" }
              as: TourManager
