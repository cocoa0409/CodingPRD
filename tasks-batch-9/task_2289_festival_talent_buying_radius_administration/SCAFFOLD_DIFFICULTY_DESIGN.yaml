      - name: installment_payment_blocked_by_breached_clause
        grounds:
          - validations[priority=40]
          - errors.ERR_RADIUS_BREACH_ACTIVE
          - state_machines.RadiusClause.BREACHED_to_WAIVED
          - endpoints["POST /festival-ops/payment-installments/{id}/mark-paid"]
        distinguishing_aspect: |
          A different entity pair (PaymentInstallment, RadiusClause) on a different endpoint. The
          installment is already RELEASED, so the CASCADE-3 SCHEDULED -> HELD hop cannot reach it
          and priority 30 has nothing to complain about — the only thing standing between it and
          PAID is a sibling entity's enforcement_status. Granting the waiver clears the same call
          with no change to the installment itself.
