    input: [zone_label, max_allowed_height_ft, prohibited_species, wire_zone_width_ft, border_zone_width_ft]
    output: VegetationZone
    side_effects: ["status=ACTIVE_MONITORING", "violation_count=0"]

  - method: GET
    path: "/easement-cases/{caseId}/vegetation-zones"
    description: "List vegetation zones"
    roles: [VegetationInspector, RightOfWayAgent, DepartmentDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "VegetationZone[]"
    side_effects: []

  - method: GET
    path: "/easement-cases/{caseId}/vegetation-zones/{zoneId}"
    description: "Get one zone"
    roles: [VegetationInspector, RightOfWayAgent, DepartmentDirector]
    code: 200
    input: []
    output: VegetationZone
