          assert:
            - "quoted_total_cents == 6000 (3h x 2000)"
            - "deposit_required_cents == 5000 (min(6000, max(5000, 1500)) — the min_deposit floor, not the percentage)"
      - name: tournament_flat_rate_threshold
        claim_type: correct_result
        grounds:
