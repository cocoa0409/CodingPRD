            - "${rx69_count} == 0   # the route arm of this rule is unreachable by construction: no DRAFT can ever exist on a referred visit"

      - name: corner_lone_physician_cannot_be_reassigned_away_and_state_beats_the_empty_pool
        claim_type: violation_to_error
        grounds:
          - calculations.reviewer_reassignment_selection
          - errors[ERR_NO_ELIGIBLE_REVIEWER]
          - errors[ERR_CHART_REVIEW_INVALID_STATE]
        distinguishing_aspect: "The candidate pool excludes the incumbent, so a state with exactly one ACTIVE physician yields ERR_NO_ELIGIBLE_REVIEWER (409) instead of a no-op reassignment. After attesting, the SAME reassign call switches to ERR_CHART_REVIEW_INVALID_STATE: the PENDING precondition is evaluated before the selection, so the state error masks the empty pool."
        test_recipe:
          setup:
            - "A CA StateRule (chart_review_sample_pct 40) and a SORE_THROAT protocol with requires_cosign false."
            - "Exactly one CA physician exists. One closed insured visit is sampled into a single PENDING ChartReview whose reviewer is that physician."
