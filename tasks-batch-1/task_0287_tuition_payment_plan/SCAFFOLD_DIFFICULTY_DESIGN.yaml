            - call: "POST /institutions/${inst_h}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${inst_h}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { term_h: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${inst_h}", external_ref: "S8", full_name: "Stu Eight", email: "s8@x.edu" }
              as: Registrar
              captures: { stu_8: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${inst_h}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500, late_fee_grace_days: 3 }
              as: Registrar
              captures: { tpl_h: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${stu_8}", term_id: "${term_h}", plan_template_id: "${tpl_h}" }
              as: Registrar
              captures: { enr_8: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${enr_8}", kind: "TUITION", amount_cents: 500000 }
              as: Registrar
            - call: "POST /institutions/aids"
              payload: { enrollment_id: "${enr_8}", source: "GRANT", amount_cents: 100000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_8}"
              as: Registrar
              captures: { enr8_v0: $.data.version }
            - call: "POST /institutions/enrollments/${enr_8}/activate"
              payload: { expected_enrollment_version: "${enr8_v0}" }
              as: Registrar
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${enr_8}", purpose: "DOWN_PAYMENT", amount_cents: 80000 }
              as: Bursar
              captures: { pay_d8: $.data.id }
            - call: "POST /institutions/payments/${pay_d8}/settle"
              as: Bursar
            - call: "POST /institutions/${inst_h}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-28T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/enrollments/${enr_8}/run-delinquency"
              as: Registrar
          trigger:
            - call: "GET /institutions/enrollments/${enr_8}"
              as: Registrar
              captures: { enr8_vw: $.data.version }
            - call: "POST /institutions/enrollments/${enr_8}/withdraw"
              payload: { effective_date: "2026-10-28T00:00:00.000Z", expected_enrollment_version: "${enr8_vw}" }
              as: Registrar
            - call: "GET /institutions/students/${stu_8}"
              as: Registrar
              captures: { s8_hold: $.data.has_active_hold }
          assert:
            - "Enrollment.${enr_8}.status == WITHDRAWN"
            - "Enrollment.${enr_8}.delinquent_installment_count == 0 (hop 1 effect)"
            - "Hold for enrollment ${enr_8} status == RELEASED (hop 2 effect)"
            - "Student.${stu_8}.has_active_hold == false (hop 3 effect)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hold_state_beats_fiscal_no_charges
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_STUDENT_ON_HOLD]
          - errors[ERR_NO_CHARGES_TO_FINANCE]
        distinguishing_aspect: |
          On activate, business_referential (priority 6, ERR_STUDENT_ON_HOLD)
          outranks business_constraint (priority 9, ERR_NO_CHARGES_TO_FINANCE):
          a held student with a zero-charge enrollment fails both, and the
          server returns ERR_STUDENT_ON_HOLD (the lower priority number wins).
        test_recipe:
          setup:
            - "Institution INST_I clock 2026-09-15; Term FALL2026; Student S9 carrying an ACTIVE Hold from a delinquent first enrollment; a SECOND enrollment for S9 created with NO charges."
