          - state_machines.Invoice.ISSUED_to_CREDITED
          - state_machines.Placement.ACTIVE_GUARANTEE_to_FALLEN_OFF
          - entities.Engagement.fields.billed_gross_cents
          - entities.Invoice.fields.credited_invoice_id
        distinguishing_aspect: |
          Conserved quantity #1 = MONEY (the engagement's billed fee ledger), pinned as
          `Engagement.billed_gross_cents == SUM(gross of RETAINER/PROGRESS/COMPLETION rows in
          {ISSUED,PAID,CREDITED}) - SUM(gross of CREDIT_NOTE rows in {ISSUED,PAID})`. The forward
          action (issue + pay the COMPLETION invoice) and its compensating action (fall-off mints the
          mirroring CREDIT_NOTE) must leave the ledger back at exactly retainer + progress =
