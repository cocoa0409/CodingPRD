            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v: $.data.version }
          trigger:
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v}" }
              as: OpsManager
              as_user_id: "u_ops_1"
          assert:
            - "the trigger returns ERR_LINE_HEADCOUNT_EXCEEDED with HTTP 422"
            - "the trigger does NOT return ERR_LABOR_BUDGET_EXCEEDED (402) even though 30 x 8.00 h x 2150 = 516000 exceeds labor_budget_cents 1000"
            - "ShiftPlan.${plan_id}.status stays SUBMITTED with planned_labor_cents == 0, flex_draw_count == 0, approved_by_user_id == null"
            - "SortCenter.${center_id}.flex_pool_available stays 20, flex_pool_reserved stays 0 and version is unchanged from ${center_v}"

