# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Powersports Dealer & Service — breadth probe over §1.1–§1.7 surface
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_unit_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - "entities.Unit.fields.vin"
          - "entities.Unit.fields.status"
          - "entities.Unit.fields.version"
        distinguishing_aspect: "POST /units with all required fields -> 201; status=IN_TRANSIT, version=1, server-minted id/created_at present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000200", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1500000, dealer_cost_cents: 1100000 }
              as: SalesManager
              captures: { uid: $.data.id }
          assert:
            - "response status == 201"
            - "Unit.${uid}.status == IN_TRANSIT"
            - "Unit.${uid}.version == 1"
            - "Unit.${uid}.acquisition_kind == NEW_FLOORED"

      - name: get_unit_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "errors[ERR_UNIT_NOT_FOUND]"
          - "entities.Unit.fields.id"
        distinguishing_aspect: "GET /units/{id} with a non-existent UUID -> ERR_UNIT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_UNIT_NOT_FOUND"

      - name: create_unit_missing_required_vin_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Unit.fields.vin"
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=4]"
        distinguishing_aspect: "POST /units omitting required vin -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1500000, dealer_cost_cents: 1100000 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_unit_bad_vin_length_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Unit.fields.vin"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "VIN not length 17 -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { vin: "SHORTVIN", category: "ATV", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_unit_invalid_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Unit.fields.category"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "category outside {MOTORCYCLE,ATV,UTV,PWC,SNOWMOBILE} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000201", category: "SPACESHIP", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_vin_returns_duplicate_resource
        claim_type: Type Constraints
        grounds:
          - "entities.Unit.fields.vin"
          - "errors[ERR_DUPLICATE_RESOURCE]"
          - "validations[priority=5]"
        distinguishing_aspect: "Second Unit with an existing VIN -> ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["One Unit with vin 1HD1KB4197Y000202 exists."]
          setup_api_calls:
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000202", category: "ATV", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000 }
              as: SalesManager
          trigger:
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000202", category: "UTV", model_year: 2024, msrp_cents: 1000000, dealer_cost_cents: 800000 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DUPLICATE_RESOURCE"

      - name: duplicate_part_sku_returns_duplicate_resource
        claim_type: Type Constraints
        grounds:
          - "entities.Part.fields.sku"
          - "errors[ERR_DUPLICATE_RESOURCE]"
          - "validations[priority=5]"
        distinguishing_aspect: "Second Part with an existing sku -> ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["One Part with sku OIL-FILT exists."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "OIL-FILT", description: "Oil filter", unit_price_cents: 1200, on_hand_qty: 5 }
              as: PartsClerk
          trigger:
            - call: "POST /parts"
              payload: { sku: "OIL-FILT", description: "Oil filter v2", unit_price_cents: 1300, on_hand_qty: 8 }
              as: PartsClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DUPLICATE_RESOURCE"

      - name: part_create_initializes_computed_inventory_fields
        claim_type: Computed Fields
        grounds:
          - "entities.Part.fields.available_qty"
          - "entities.Part.fields.reserved_qty"
          - "entities.Part.fields.consumed_qty"
        distinguishing_aspect: "POST /parts sets available_qty=on_hand_qty, reserved_qty=0, consumed_qty=0 regardless of client input for those fields."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { sku: "SPARK-01", description: "Spark plug", unit_price_cents: 800, on_hand_qty: 12 }
              as: PartsClerk
              captures: { pid: $.data.id }
          assert:
            - "Part.${pid}.available_qty == 12"
            - "Part.${pid}.reserved_qty == 0"
            - "Part.${pid}.consumed_qty == 0"

      - name: list_units_pagination_envelope
        claim_type: Listing
        grounds:
          - "entities.Unit.fields.id"
        distinguishing_aspect: "GET /units returns paginated array envelope with total_count and has_more fields."
        test_recipe:
          setup: ["Two Units exist."]
          setup_api_calls:
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000203", category: "ATV", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000 }
              as: SalesManager
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000204", category: "ATV", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000 }
              as: SalesManager
          trigger:
            - call: "GET /units"
              payload: {}
              as: SalesManager
          assert:
            - "response_type == array"
            - "meta.total_count >= 2"
            - "has_more is present in the response"

      - name: deal_doc_fee_default_applied_when_omitted
        claim_type: Defaults
        grounds:
          - "entities.Deal.fields.doc_fee_cents"
        distinguishing_aspect: "Omitting doc_fee_cents on POST /deals applies default 39900."
        test_recipe:
          setup: ["A Customer and IN_STOCK Unit exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Def Doc", email: "defdoc@x.com", phone: "555-0200" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000205", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1400000, dealer_cost_cents: 1000000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1400000, tax_rate_bps: 800 }
              as: SalesManager
              captures: { deal_id: $.data.id }
          assert:
            - "Deal.${deal_id}.doc_fee_cents == 39900"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: receive_already_in_stock_unit_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Unit.IN_TRANSIT_to_IN_STOCK"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /units/{id}/receive on a unit already IN_STOCK -> ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["A Unit has been received into IN_STOCK."]
          setup_api_calls:
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000210", category: "ATV", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000 }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Unit.${unit_id}.status == IN_STOCK"

      - name: approve_deal_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Deal.FINANCE_SUBMITTED_to_APPROVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /deals/{id}/approve while Deal is DRAFT (not FINANCE_SUBMITTED) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT Deal exists (never quoted)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Drf Deal", email: "drf@x.com", phone: "555-0201" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000211", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1400000, dealer_cost_cents: 1000000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1400000, tax_rate_bps: 800 }
              as: SalesManager
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Deal.${deal_id}.status == DRAFT"

      - name: deliver_terminal_deal_idempotency_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Deal.APPROVED_to_DELIVERED"
          - "entities.Deal.fields.status"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Second POST /deals/{id}/deliver on an already DELIVERED (terminal) deal -> ERR_INVALID_STATE (409); no duplicate cascade."
        test_recipe:
          setup: ["A cash deal has been delivered (DELIVERED, terminal)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Term Deal", email: "term@x.com", phone: "555-0202" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000212", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1400000, dealer_cost_cents: 1000000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1400000, tax_rate_bps: 800 }
              as: SalesManager
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/quote"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${deal_id}/submit-finance"
              payload: {}
              as: FinanceManager
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
            - call: "POST /deals/${deal_id}/deliver"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /deals/${deal_id}/deliver"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Deal.${deal_id}.status == DELIVERED"

      - name: ro_cancel_after_billed_returns_already_billed
        claim_type: invalid_transition
        grounds:
          - "state_machines.RepairOrder.OPEN_to_IN_PROGRESS"
          - "errors[ERR_RO_ALREADY_BILLED]"
          - "entities.RepairOrder.fields.billing_status"
        distinguishing_aspect: "POST /repair-orders/{id}/cancel after the RO has been INVOICED -> ERR_RO_ALREADY_BILLED (409); parts not released."
        test_recipe:
          setup: ["An RO with a 1.0h line is completed and invoiced (billing INVOICED, within authorization)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Bil RO", email: "bilro@x.com", phone: "555-0203" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000213", category: "ATV", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /technicians"
              payload: { name: "Tech Bil", hourly_cost_cents: 4000 }
              as: ServiceAdvisor
              captures: { tech_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", technician_id: "${tech_id}", appointment_start: "2026-06-08T09:00:00.000Z", appointment_end: "2026-06-08T11:00:00.000Z", is_warranty: false, authorized_amount_cents: 50000 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", operation_code: "OIL-2", flat_rate_hours: 1.0 }
              as: ServiceAdvisor
            - call: "POST /repair-orders/${ro_id}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /repair-orders/${ro_id}/complete"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /repair-orders/${ro_id}/invoice"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders/${ro_id}/cancel"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_RO_ALREADY_BILLED"
            - "RepairOrder.${ro_id}.work_status == WORK_COMPLETE"
            - "RepairOrder.${ro_id}.billing_status == INVOICED"

      - name: ro_invoice_requires_work_complete_guard
        claim_type: guarded_transition
        grounds:
          - "state_machines.RepairOrder.UNBILLED_to_INVOICED"
          - "errors[ERR_WORK_NOT_COMPLETE]"
        distinguishing_aspect: "Cross-dimension guard: invoice (billing) requires work_status==WORK_COMPLETE; invoicing an OPEN-work RO with lines -> ERR_WORK_NOT_COMPLETE (409)."
        test_recipe:
          setup: ["An RO with one line exists but is still OPEN (not started/completed)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Inc RO", email: "incro@x.com", phone: "555-0204" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000214", category: "ATV", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /technicians"
              payload: { name: "Tech Inc", hourly_cost_cents: 4000 }
              as: ServiceAdvisor
              captures: { tech_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", technician_id: "${tech_id}", appointment_start: "2026-06-09T09:00:00.000Z", appointment_end: "2026-06-09T11:00:00.000Z", is_warranty: false, authorized_amount_cents: 50000 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", operation_code: "OIL-3", flat_rate_hours: 1.0 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders/${ro_id}/invoice"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_WORK_NOT_COMPLETE"

      - name: ro_complete_consumes_reserved_parts_cascade
        claim_type: side_effect
        grounds:
          - "state_machines.RepairOrder.IN_PROGRESS_to_WORK_COMPLETE"
          - "state_machines.PartLine.RESERVED_to_CONSUMED"
          - "entities.Part.fields.consumed_qty"
        distinguishing_aspect: "On RO complete, a RESERVED PartLine becomes CONSUMED and the Part's reserved_qty decrements while consumed_qty increments (qty 4 -> consumed 4, reserved 0, available 6 on on_hand 10)."
        test_recipe:
          setup: ["An RO with a 1.0h line and a reserved PartLine (qty 4 of a 10-on-hand part) is started."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Con RO", email: "conro@x.com", phone: "555-0205" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000215", category: "ATV", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /technicians"
              payload: { name: "Tech Con", hourly_cost_cents: 4000 }
              as: ServiceAdvisor
              captures: { tech_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", technician_id: "${tech_id}", appointment_start: "2026-06-10T09:00:00.000Z", appointment_end: "2026-06-10T11:00:00.000Z", is_warranty: false, authorized_amount_cents: 90000 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", operation_code: "BRK-2", flat_rate_hours: 1.0 }
              as: ServiceAdvisor
            - call: "POST /parts"
              payload: { sku: "PAD-CON", description: "Pads", unit_price_cents: 4500, on_hand_qty: 10 }
              as: PartsClerk
              captures: { part_id: $.data.id, part_v: $.data.version }
            - call: "POST /part-lines"
              payload: { repair_order_id: "${ro_id}", part_id: "${part_id}", quantity: 4, expected_part_version: "${part_v}" }
              as: PartsClerk
              captures: { pl_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/start"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders/${ro_id}/complete"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "Part.${part_id}.consumed_qty == 4"
            - "Part.${part_id}.reserved_qty == 0"
            - "Part.${part_id}.available_qty == 6"
            - "RepairOrder.${ro_id}.parts_total_cents == 18000"

      - name: ro_cancel_voids_billing_dimension
        claim_type: side_effect
        grounds:
          - "state_machines.RepairOrder.UNBILLED_to_VOID"
          - "entities.RepairOrder.fields.billing_status"
        distinguishing_aspect: "Cancelling an OPEN RO drives billing_status UNBILLED -> VOID via the system transition (parallel-dimension side effect)."
        test_recipe:
          setup: ["An RO with one line is OPEN (UNBILLED)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Vd RO", email: "vdro@x.com", phone: "555-0206" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000216", category: "ATV", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /technicians"
              payload: { name: "Tech Vd", hourly_cost_cents: 4000 }
              as: ServiceAdvisor
              captures: { tech_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", technician_id: "${tech_id}", appointment_start: "2026-06-11T09:00:00.000Z", appointment_end: "2026-06-11T11:00:00.000Z", is_warranty: false, authorized_amount_cents: 50000 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", operation_code: "OIL-4", flat_rate_hours: 1.0 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders/${ro_id}/cancel"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "RepairOrder.${ro_id}.work_status == CANCELLED"
            - "RepairOrder.${ro_id}.billing_status == VOID"

      - name: storage_checkin_with_winterization_mints_prep_ro
        claim_type: side_effect
        grounds:
