            - "the second release returns HTTP 200 with ${st2} == AVAILABLE and ${rem2} == 0.350"

      - name: corner_booking_an_inactive_technician_is_refused_and_an_active_one_is_booked
        claim_type: Triggerability
        grounds:
          - errors.ERR_TECHNICIAN_INACTIVE
          - validations[22].ERR_TECHNICIAN_INACTIVE
          - endpoints.POST_service_visits
        distinguishing_aspect: |
          The refusal keys purely on Technician.status, which is settable at
          create time: the INACTIVE technician's booking returns
          ERR_TECHNICIAN_INACTIVE (409) while an identical booking naming the
          ACTIVE technician is created 201 in the very same slot, proving the
          rejection was not a route conflict.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE with an ACTIVE contract."
