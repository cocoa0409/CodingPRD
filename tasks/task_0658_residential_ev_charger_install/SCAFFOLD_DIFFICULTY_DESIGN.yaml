          With a 200A panel (capacity 48000 VA) and LOAD_STUDY max_measured 30720 (existing_demand 38400,
          spare 9600) scoping CHG40 (charger_required_va 9600), spare_capacity_va == charger_required_va
          exactly => charger_fits == true (>=, not >). Numeric threshold-crossing metric.
        test_recipe:
          setup:
            - "200A/240V property, LOAD_STUDY assessment with max_measured 30720, charger CHG40 (req 9600 VA)"
          setup_api_calls:
            - call: "POST /homeowners"
