errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing/empty
- id: ERR_INSUFFICIENT_PERMISSIONS
  http: 403
  condition: Role not permitted on this endpoint
- id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP
  http: 403
  condition: Entity-backed actor outside ownership scope (coach's club, proctor's own assignment, raiser-only withdraw)
- id: ERR_NOT_FOUND
  http: 404
  condition: Path id or body FK reference does not resolve
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_<parent>_version does not match the parent's current version
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing/unknown fields, type or enum violation, unordered date range, reason < 10 chars, zero amount_cents, round/board
    out of bounds, resolved_result presence violating outcome rules
- id: ERR_SEASON_INVALID_STATE
  http: 409
  condition: Season not in a from-state of the requested transition (incl. meet scheduling outside ACTIVE, bid accept outside
    ACTIVE|FINALIZING)
- id: ERR_CLUB_INVALID_STATE
  http: 409
  condition: Club not in a from-state for suspend/reinstate
- id: ERR_COACH_INVALID_STATE
  http: 409
  condition: Coach not in a from-state for deactivate/reactivate
- id: ERR_PLAYER_INVALID_STATE
  http: 409
  condition: Player not in a from-state for deactivate/reactivate/suspend
- id: ERR_MEMBERSHIP_NOT_PAYABLE
  http: 409
  condition: Membership not INVOICED on pay/waive
- id: ERR_MEMBERSHIP_NOT_REFUNDABLE
  http: 409
  condition: Membership not PAID on refund
- id: ERR_MEET_INVALID_STATE
  http: 409
  condition: Meet not in a from-state of the requested transition (incl. report/confirm while meet not IN_PROGRESS)
- id: ERR_PAIRING_INVALID_STATE
  http: 409
  condition: Pairing not in a from-state of the requested transition
- id: ERR_DISPUTE_INVALID_STATE
  http: 409
  condition: Dispute not in a from-state of the requested transition
- id: ERR_TOURNAMENT_INVALID_STATE
  http: 409
  condition: Tournament not in a from-state of the requested transition (incl. entries outside REGISTRATION_OPEN, check-in
    outside RUNNING)
- id: ERR_SECTION_INVALID_STATE
  http: 409
  condition: Section not in a from-state of the requested transition (incl. entries while LOCKED|CLOSED)
- id: ERR_ENTRY_INVALID_STATE
  http: 409
  condition: Entry not in a from-state of the requested transition
- id: ERR_ASSIGNMENT_INVALID_STATE
  http: 409
  condition: ProctorAssignment not in a from-state of the requested transition
- id: ERR_BID_INVALID_STATE
  http: 409
  condition: Bid not OFFERED on accept/decline
- id: ERR_CLUB_SUSPENDED
  http: 403
  condition: SUSPENDED club attempted roster/meet/entry/bid write
- id: ERR_PLAYER_SUSPENDED
  http: 403
  condition: SUSPENDED player used in pairing or entry
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: Ledger reversal requested by the same X-User-ID that posted the original
- id: ERR_SAME_CLUB_CONFIRMATION
  http: 403
  condition: Pairing confirmer belongs to the same club as the reporter
- id: ERR_MEMBERSHIP_REQUIRED
  http: 409
  condition: Player lacks a PAID|WAIVED membership for the season on pairing create or entry create
- id: ERR_PLAYER_CLUB_MISMATCH
  http: 409
  condition: white_player_id not in host club or black_player_id not in away club
- id: ERR_RATING_OUT_OF_BAND
  http: 409
  condition: Player rating outside section [min_rating, max_rating] inclusive band
- id: ERR_PROVISIONAL_NOT_ALLOWED
  http: 409
  condition: Provisional player entering a section with allow_provisional == false
- id: ERR_SECTION_FULL
  http: 409
  condition: section.current_entries == max_entries
- id: ERR_TOURNAMENT_CAPACITY_EXCEEDED
  http: 409
  condition: Total non-withdrawn entries across sections would exceed tournament.capacity
- id: ERR_DUPLICATE_ENTRY
  http: 409
  condition: Player already has a non-WITHDRAWN entry in the section
- id: ERR_DUPLICATE_MEMBERSHIP
  http: 409
  condition: Membership for (player_id, season_id) already exists
- id: ERR_DUPLICATE_STIPEND
  http: 409
  condition: TravelStipend for (season_id, club_id) already exists
- id: ERR_SAME_CLUB_MEET
  http: 409
  condition: host_club_id == away_club_id
- id: ERR_ALREADY_REVERSED
  http: 409
  condition: Ledger entry already reversed (reversed_by_id set) or reversal of a REVERSAL entry
- id: ERR_MEET_DATE_CONFLICT
  http: 409
  condition: Host or away club already occupies scheduled_date with a meet in SCHEDULED|PAIRINGS_PUBLISHED|IN_PROGRESS (whole-day
    occupation)
- id: ERR_PROCTOR_DOUBLE_BOOKED
  http: 409
  condition: 'Coach holds an ASSIGNED|CONFIRMED assignment whose event interval (meets: [date, date]; tournaments: [start_date,
    end_date]) expanded by 1 rest-day on each side intersects the new event''s interval'
- id: ERR_INSUFFICIENT_FUNDS
  http: 402
  condition: Charge would drive club account_balance_cents below zero
- id: ERR_INCOMPLETE_PAIRINGS
  http: 409
  condition: publish-pairings without full round x board coverage by SCHEDULED pairings
- id: ERR_NO_CONFIRMED_PROCTOR
  http: 409
  condition: meet/tournament start without a CONFIRMED proctor assignment
- id: ERR_UNCONFIRMED_PAIRINGS
  http: 409
  condition: meet complete with non-terminal pairings not CONFIRMED
- id: ERR_STANDINGS_NOT_FINAL
  http: 409
  condition: season complete without a StandingSnapshot set
- id: ERR_OPEN_DISPUTES_EXIST
  http: 409
  condition: season complete while OPEN|UNDER_REVIEW disputes exist on its meets
roles:
- name: FederationAdmin
  description: 'Federation operator: seasons, clubs, coaches, meet scheduling, disputes adjudication, bids, clock'
  identity: opaque
  exclusive_operations:
  - POST /api/seasons and all /api/seasons/{id}/* actions (activate, finalize, reopen, complete, standings/finalize, bids/generate)
  - POST /api/clubs; POST /api/clubs/{id}/suspend|reinstate
  - POST /api/coaches and coach deactivate/reactivate
  - POST /api/players/{id}/suspend
  - POST /api/memberships/{id}/waive
  - POST /api/meets/{id}/schedule|reschedule|cancel|publish-pairings|start|complete
  - POST /api/tournaments and all tournament actions
  - POST /api/tournaments/{id}/sections; section lock/unlock
  - POST /api/proctor-assignments; release; mark-no-show
  - POST /api/disputes/{id}/open-review|resolve
  - POST /api/_clock/set_current_utc
  shared_operations:
  - All GET endpoints
  - POST /api/players; POST /api/players/{id}/deactivate|reactivate (shared with ClubCoach)
  - POST /api/meets; POST /api/meets/{id}/pairings; POST /api/meets/{id}/postpone (shared with ClubCoach)
  - POST /api/memberships; POST /api/memberships/{id}/pay (shared)
  - POST /api/entries/{id}/check-in (shared with Proctor)
- name: ClubCoach
  description: 'Coach of a club: roster, memberships, meets, result reporting/confirmation, disputes, entries, bids'
  identity: entity_backed:Coach
  exclusive_operations:
  - POST /api/pairings/{id}/report-result|confirm|dispute
  - POST /api/sections/{id}/entries; POST /api/entries/{id}/withdraw
  - POST /api/qualification-bids/{id}/accept|decline
  - POST /api/disputes/{id}/withdraw
  shared_operations:
  - All GET endpoints
  - POST /api/players; deactivate|reactivate (own club only)
  - POST /api/memberships; pay (own club's players)
  - POST /api/meets (as host club); pairings; postpone
- name: Proctor
  description: 'Coach acting as event proctor: confirms own assignment, checks in entries'
  identity: entity_backed:Coach
  exclusive_operations:
  - POST /api/proctor-assignments/{id}/confirm (self only)
  shared_operations:
  - All GET endpoints
  - POST /api/entries/{id}/check-in (shared with FederationAdmin)
- name: Treasurer
  description: 'Federation treasurer: manual ledger adjustments, membership refunds, travel stipends'
  identity: opaque
  exclusive_operations:
  - POST /api/clubs/{clubId}/ledger-entries
  - POST /api/memberships/{id}/refund
  - POST /api/travel-stipends
  shared_operations:
  - All GET endpoints
  - POST /api/memberships/{id}/pay (shared)
- name: Auditor
  description: 'Federation auditor: reverses ledger entries posted by others (segregation of duties)'
  identity: opaque
  exclusive_operations:
  - POST /api/ledger-entries/{id}/reverse
  shared_operations:
  - All GET endpoints
