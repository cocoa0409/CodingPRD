              as: PropertyManager
              captures: { recon_id: $.data.id, recon_v0: $.data.version }
            - call: "POST /reconciliations/${recon_id}/submit"
              payload: {}
              as: PropertyManager
              as_user_id: "pm-001"
            - call: "POST /reconciliations/${recon_id}/return"
              payload: {}
              as: Accountant
              as_user_id: "acct-001"
            - call: "POST /reconciliations/${recon_id}/submit"
