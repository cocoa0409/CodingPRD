  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_approval_depends_on_merchant_status
        grounds:
          - state_machines.Application.SUBMITTED_to_DECLINED
          - entities.Merchant.fields.status
          - entities.Application.fields.decline_reason
        distinguishing_aspect: |
          Entity pair Application->Merchant: an application on a SUSPENDED merchant is
          DECLINED with decline_reason=MERCHANT_SUSPENDED regardless of borrower credit
          — Application's valid decision depends on Merchant.status.
        test_recipe:
          setup:
            - "Merchant M registered then SUSPENDED; Borrower BA limit 500000; App A SUBMITTED on M."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /merchants/${m_id}/suspend"
              as: Servicer
          trigger:
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "DECLINE" }
              as: Servicer
              captures: { st: $.data.status, reason: $.data.decline_reason }
          assert:
            - "Application.${app_a_id}.status == DECLINED"
            - "Application.${app_a_id}.decline_reason == MERCHANT_SUSPENDED"

      - name: loan_activation_depends_on_borrower_available_credit
        grounds:
          - state_machines.Application.APPROVED_to_ACTIVATED
          - entities.Borrower.fields.available_credit_cents
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair Loan(activation)->Borrower (DIFFERENT pair than Application->Merchant):
          after App A is APPROVED, a second concurrently-approved application consumes the
          borrower's remaining credit so that activating App A re-checks available_credit
          and fails ERR_INSUFFICIENT_CREDIT.
        test_recipe:
          setup:
            - "Merchant M ACTIVE; Borrower BC limit 50000."
            - "App C1 (cart 50000 PAY_IN_4 down 0) APPROVED + disclosure accepted (financed 50000)."
            - "App C2 (cart 50000 PAY_IN_4 down 0) APPROVED + disclosure accepted (financed 50000)."
            - "App C1 activated first -> Loan consumes the entire 50000 limit; Borrower available drops to 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BC", email: "bc@x.com", annual_income_cents: 2000000, soft_credit_score: 620 }
              as: Servicer
              captures: { bc_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${bc_id}", merchant_id: "${m_id}", cart_amount_cents: 50000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${bc_id}"
              captures: { app_c1_id: $.data.id }
            - call: "POST /applications/${app_c1_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_c1_id}", accepted: true }
              as: Borrower
              as_user_id: "${bc_id}"
            - call: "POST /applications"
              payload: { borrower_id: "${bc_id}", merchant_id: "${m_id}", cart_amount_cents: 50000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${bc_id}"
              captures: { app_c2_id: $.data.id }
            - call: "POST /applications/${app_c2_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_c2_id}", accepted: true }
              as: Borrower
              as_user_id: "${bc_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_c1_id}" }
              as: Borrower
              as_user_id: "${bc_id}"
              captures: { loan_c1_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { application_id: "${app_c2_id}" }
