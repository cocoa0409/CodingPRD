# =============================================================================
# SCAFFOLD — Federally Qualified Health Center Sliding Fee & Section 330 Compliance
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines ·
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations ·
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================
scenario: |
  Generate task harder than expert level!

  2426. Federally Qualified Health Center Sliding Fee & Section 330 Compliance (federally
  qualified health center): patient income and family size verification driving sliding fee
  discount tier, nominal fee policy and inability-to-pay protections, scope of project service
  and site listing with change-in-scope requests, board composition requirement of
  patient-majority governance, prospective payment system encounter rate billing and wraparound
  payments, quality measure and uniform data system annual reporting, sliding fee schedule
  annual review against federal poverty guidelines, operational site visit findings and
  corrective action plans

domain_name: fqhc-sliding-fee-section-330-compliance
api_prefix: ""          # flat topology — every collection is a top-level path (/health-centers, /patients, /encounters, ...)

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - rate_threshold_triggers          # FPG-percent tier breakpoints, 365-day review clock, board-majority threshold
    - dual_variant_calculation         # schedule-year vs intake-year FPG; provisional vs final patient charge
    - cascading_side_effects           # retroactive verification and finding escalation propagate 3+ hops
    - optimistic_concurrency           # OCC on Patient.version and HealthCenter.version for supersede writes
    - version_pinning_on_approval      # Encounter pins fee_schedule_id / income_verification_id / discount_tier_id
    - selector_policy                  # server picks the effective IncomeVerification and FeeSchedule
    - ops_run_checkpoint               # POST /_ops/compliance-sweep advances the compliance epoch

  entity_topology: flat
  # Peer entities linked by foreign keys; ownership is expressed by FK fields, not by deep URL
  # nesting. Creation of an owned child uses a single-level `/{parent}/{id}/{children}` path,
  # every other operation addresses the child directly at its own top-level collection.

  state_machine_shape: cyclic
  # ScopeChangeRequest (REVISION_REQUESTED -> SUBMITTED), IncomeVerification
  # (INSUFFICIENT_DOCUMENTATION -> SUBMITTED), CorrectiveActionPlan (REJECTED -> SUBMITTED),
  # UDSReport (RETURNED -> DRAFT) and ServiceSite (ON_HOLD -> PROPOSED) all loop. Encounter
  # additionally carries two independent state dimensions (pps_claim_status x wraparound_status).

  relationship_patterns:
    - one_to_many            # HealthCenter -> ServiceSite / FeeSchedule / BoardMember / UDSReport / SiteVisitFinding
    - self_referential       # FeeSchedule.superseded_by_fee_schedule_id, IncomeVerification.supersedes_income_verification_id
    - cross_aggregate        # Encounter pins DiscountTier (owned by FeeSchedule) and IncomeVerification (owned by Patient)
    - polymorphic            # ScopeChangeRequest.target_* points at either a ServiceSite or a ServiceDefinition per request_type

  role_model: segregation_of_duties
  # The user who submits an IncomeVerification may not verify it; the ComplianceOfficer who
  # prepares a ScopeChangeRequest may not be the BoardChair who decides it; the ComplianceOfficer
  # who prepares a CorrectiveActionPlan may not be the ProjectOfficer who adjudicates it; the
  # PatientServicesRep who requests an inability-to-pay waiver may not decide it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: HealthCenter
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: legal name of the Section 330 grantee
      - name: grant_number
        type: string
        source: input
        description: HRSA grant number; unique across HealthCenter
        constraints: "unique; non-empty"
      - name: pps_base_rate_cents
        type: integer
        source: input
        description: prospective payment system base encounter rate in cents
        constraints: "> 0"
      - name: medicare_upper_limit_cents
        type: integer
        source: input
        description: per-encounter Medicare ceiling in cents applied by the PPS rate calculation
        constraints: "> 0"
      - name: nominal_fee_cap_cents
        type: integer
        source: input
        default: 2500
        description: regulatory ceiling a FeeSchedule.nominal_fee_cents may not exceed
        constraints: "> 0"
      - name: scope_baseline_locked
        type: boolean
        source: system
        default: false
        description: false until the Notice-of-Award baseline scope is locked; while false PlatformAdmin may create sites/services directly in scope
      - name: operational_status
        type: enum
        source: computed
        default: ACTIVE
        description: award posture derived from open_condition_count
        constraints: "ACTIVE | CONDITIONS_IMPOSED"
      - name: scope_posture
        type: enum
        source: computed
        default: OPEN
        description: derived gate on change-in-scope processing; CHANGE_FROZEN whenever operational_status == CONDITIONS_IMPOSED
        constraints: "OPEN | CHANGE_FROZEN"
      - name: open_condition_count
        type: integer
        source: computed
        default: 0
        description: count of SiteVisitFinding rows for this grantee whose status == ESCALATED
      - name: in_scope_site_count
        type: integer
        source: computed
        default: 0
        description: count of ServiceSite rows for this grantee whose status == IN_SCOPE
      - name: in_scope_service_count
        type: integer
        source: computed
        default: 0
        description: count of ServiceDefinition rows for this grantee whose status == IN_SCOPE
      - name: seated_board_count
        type: integer
        source: computed
        default: 0
        description: count of BoardMember rows for this grantee whose status == SEATED
      - name: patient_seat_pct
        type: number
        source: computed
        default: 0
        description: qualified patient seats as a percentage of seated seats, 2 decimal places
      - name: governance_posture
        type: enum
        source: computed
        default: GOVERNANCE_DEFICIENT
        description: patient-majority governance verdict per calculation governance_posture
        constraints: "GOVERNANCE_COMPLIANT | GOVERNANCE_DEFICIENT"
      - name: wraparound_receivable_cents
        type: integer
        source: computed
        default: 0
        description: sum of Encounter.wraparound_due_cents over encounters of this grantee whose wraparound_status IN {PENDING, CLAIMED, REBILL_REQUIRED}

  - name: PovertyGuideline
    parent: null
    common_fields: false
    fields:
      - name: guideline_year
        type: integer
        source: input
        description: calendar year the federal poverty guideline table applies to; unique
        constraints: "unique; 2000..2100"
      - name: base_amount_cents
        type: integer
        source: input
        description: annual guideline amount in cents for a household of one
        constraints: "> 0"
      - name: increment_cents
        type: integer
        source: input
        description: additional annual guideline amount in cents per additional household member
        constraints: "> 0"

  - name: BoardMember
    parent: HealthCenter
    common_fields: true
    fields:
      - name: health_center_id
        type: string
        source: input
        description: "FK -> HealthCenter.id; the grantee whose governing board holds this seat"
      - name: seat_number
        type: integer
        source: input
        description: board seat this member occupies; a seat is a capacity-1 temporal resource
        constraints: ">= 1"
      - name: seat_type
        type: enum
        source: input
        description: whether the seat counts toward the patient majority
        constraints: "PATIENT | NON_PATIENT"
      - name: patient_id
        type: string
        source: input
        default: null
        description: "FK -> Patient.id; required when seat_type == PATIENT, MUST be null when seat_type == NON_PATIENT"
      - name: expertise_category
        type: enum
        source: input
        default: null
        description: required when seat_type == NON_PATIENT, MUST be null otherwise
        constraints: "FINANCE | LEGAL | COMMUNITY | HEALTH_PROFESSION | null"
      - name: derives_over_10pct_income_from_healthcare
        type: boolean
        source: input
        default: false
        description: true when a NON_PATIENT member derives more than 10 percent of annual income from the health care industry
      - name: term_start
        type: datetime
        source: input
        description: inclusive first instant of the seat term
      - name: term_end
        type: datetime
        source: input
        description: inclusive last instant of the seat term; seat terms are CLOSED intervals
      - name: status
        type: enum
        source: system
        default: SEATED
        description: seat occupancy state
        constraints: "SEATED | RESIGNED"
      - name: resignation_date
        type: datetime
        source: input
        default: null
        description: set by POST /board-members/{id}/resign; also truncates term_end
      - name: patient_seat_qualified
        type: boolean
        source: computed
        default: false
        description: true when this is a SEATED PATIENT seat whose Patient has a qualifying recent encounter per calculation governance_posture step G2

  - name: ServiceSite
    parent: HealthCenter
    common_fields: true
    fields:
      - name: health_center_id
        type: string
        source: input
        description: "FK -> HealthCenter.id; owning grantee"
      - name: site_name
        type: string
        source: input
        description: service site name as listed on the scope of project
      - name: site_type
        type: enum
        source: input
        description: site classification; ADMINISTRATIVE sites may never carry encounters
        constraints: "SERVICE_DELIVERY | INTERMITTENT | ADMINISTRATIVE"
      - name: address_line
        type: string
        source: input
        description: street address of the site
      - name: weekly_service_hours
        type: integer
        source: input
        description: scheduled service hours per week
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: scope listing state
        constraints: "PROPOSED | IN_SCOPE | ON_HOLD | SUSPENDED | REMOVED"
      - name: in_scope_since
        type: datetime
        source: system
        default: null
        description: logical-clock instant at which the site most recently entered IN_SCOPE
      - name: hold_reason
        type: enum
        source: system
        default: null
        description: reason a PROPOSED site was parked in ON_HOLD by a cascade
        constraints: "SCOPE_FROZEN | null"

  - name: ServiceDefinition
    parent: HealthCenter
    common_fields: true
    fields:
      - name: health_center_id
        type: string
        source: input
        description: "FK -> HealthCenter.id; owning grantee"
      - name: service_code
        type: string
        source: input
        description: scope-of-project service code; unique per health_center_id
        constraints: "unique per health_center_id"
      - name: service_category
        type: enum
        source: input
        description: required primary care service versus additional service
        constraints: "REQUIRED_PRIMARY | ADDITIONAL"
      - name: delivery_method
        type: enum
        source: input
        description: Form 5A column the service is listed under
        constraints: "COLUMN_I_DIRECT | COLUMN_II_CONTRACT | COLUMN_III_REFERRAL"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: scope listing state
        constraints: "PENDING | IN_SCOPE | OUT_OF_SCOPE"

  - name: ScopeChangeRequest
    parent: HealthCenter
    common_fields: true
    fields:
      - name: health_center_id
        type: string
        source: input
        description: "FK -> HealthCenter.id; requesting grantee"
      - name: target_site_id
        type: string
        source: input
        default: null
        description: "FK -> ServiceSite.id; required when request_type IN {ADD_SITE, REMOVE_SITE}, MUST be null otherwise"
      - name: target_service_definition_id
        type: string
        source: input
        default: null
        description: "FK -> ServiceDefinition.id; required when request_type IN {ADD_SERVICE, REMOVE_SERVICE}, MUST be null otherwise"
      - name: request_type
        type: enum
        source: input
        description: change-in-scope action requested
        constraints: "ADD_SITE | REMOVE_SITE | ADD_SERVICE | REMOVE_SERVICE"
      - name: justification
        type: string
        source: input
        description: narrative justification submitted to the awarding agency
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: request lifecycle state
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | HELD | APPROVED | DENIED"
      - name: revision_round
        type: integer
        source: computed
        default: 0
        description: number of completed REVISION_REQUESTED -> SUBMITTED loops
      - name: held_from_status
        type: enum
        source: system
        default: null
        description: status the request occupied before a scope freeze parked it in HELD
        constraints: "SUBMITTED | UNDER_REVIEW | null"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who created the request; audit identity, not a foreign key
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID (BoardMember.id) of the BoardChair who began review; audit identity, not a foreign key
      - name: decision_note
        type: string
        source: input
        default: null
        description: note captured with the most recent decision

  - name: FeeSchedule
    parent: HealthCenter
    common_fields: true
    fields:
      - name: health_center_id
        type: string
        source: input
        description: "FK -> HealthCenter.id; owning grantee"
      - name: fpg_year
        type: integer
        source: input
        description: guideline_year of the PovertyGuideline row this schedule's tiers were built from; joins PovertyGuideline.guideline_year by value, not by id
      - name: effective_start
        type: datetime
        source: input
        description: inclusive first instant of the schedule period
      - name: effective_end
        type: datetime
        source: input
        description: exclusive last instant of the schedule period; schedule periods are HALF-OPEN [effective_start, effective_end)
      - name: nominal_fee_cents
        type: integer
        source: input
        description: flat nominal charge applied to the full-discount tier
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: adoption lifecycle state
        constraints: "DRAFT | ADOPTED | SUPERSEDED | EXPIRED"
      - name: board_vote_date
        type: datetime
        source: input
        default: null
        description: date the patient-majority board voted to adopt the schedule
      - name: adopted_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant of adoption
      - name: adopted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID (BoardMember.id) of the adopting BoardChair; audit identity, not a foreign key
      - name: last_reviewed_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant of the most recent annual review; set to adopted_at on adoption
      - name: reviewed_against_guideline_year
        type: integer
        source: input
        default: null
        description: guideline_year the most recent annual review compared the tiers against
      - name: review_status
        type: enum
        source: computed
        default: CURRENT
        description: annual-review posture per calculation fee_schedule_review_status
        constraints: "CURRENT | REVIEW_DUE | OUT_OF_DATE"
      - name: superseded_by_fee_schedule_id
        type: string
        source: system
        default: null
        description: "FK -> FeeSchedule.id; the same-start schedule that superseded this one"

  - name: DiscountTier
    parent: FeeSchedule
    common_fields: true
    fields:
      - name: fee_schedule_id
        type: string
        source: input
        description: "FK -> FeeSchedule.id; owning schedule"
      - name: tier_label
        type: string
        source: input
        description: human label for the tier, unique per fee_schedule_id
        constraints: "unique per fee_schedule_id"
      - name: fpg_min_pct
        type: number
        source: input
        description: inclusive lower bound of the FPG-percent band
        constraints: ">= 0"
      - name: fpg_max_pct
        type: number
        source: input
        default: null
        description: EXCLUSIVE upper bound of the FPG-percent band; null means unbounded and is only permitted on the highest sort_order
      - name: discount_kind
        type: enum
        source: input
        description: how the tier converts a gross charge into a patient charge
        constraints: "NOMINAL | PERCENT_DISCOUNT | NONE"
      - name: discount_pct
        type: number
        source: input
        default: null
        description: fraction of the gross charge discounted; required when discount_kind == PERCENT_DISCOUNT, MUST be null otherwise
        constraints: "0 < discount_pct < 1 | null"
      - name: sort_order
        type: integer
        source: input
        description: band ordering, ascending by fpg_min_pct
        constraints: ">= 1; unique per fee_schedule_id"

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: medical record number; unique across Patient
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: patient name
      - name: household_size
        type: integer
        source: input
        description: declared family size of record
        constraints: ">= 1"
      - name: sliding_fee_status
        type: enum
        source: computed
        default: UNVERIFIED
        description: VERIFIED when the patient has an IncomeVerification with status == VERIFIED whose window contains the logical clock, EXPIRED when the most recent VERIFIED verification has been swept to EXPIRED, UNVERIFIED otherwise
        constraints: "UNVERIFIED | VERIFIED | EXPIRED"
      - name: patient_balance_cents
        type: integer
        source: computed
        default: 0
        description: conserved patient-responsibility ledger; equals sum(Encounter.patient_charge_cents - Encounter.waived_amount_cents) over this patient's encounters whose pps_claim_status != VOID

  - name: IncomeVerification
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient whose income and family size were verified"
      - name: declared_annual_income_cents
        type: integer
        source: input
        description: annual household income in cents as documented
        constraints: ">= 0"
      - name: household_size
        type: integer
        source: input
        description: family size documented for this verification; may differ from Patient.household_size
        constraints: ">= 1"
      - name: documentation_type
        type: enum
        source: input
        description: documentation presented at intake
        constraints: "TAX_RETURN | PAY_STUBS | W2 | SELF_DECLARATION | REFUSED"
      - name: effective_date
        type: datetime
        source: input
        description: inclusive first instant the verification governs
      - name: expires_at
        type: datetime
        source: computed
        description: effective_date + 365 days; the verification window is the CLOSED interval [effective_date, expires_at]
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: verification lifecycle state
        constraints: "SUBMITTED | VERIFIED | INSUFFICIENT_DOCUMENTATION | SUPERSEDED | EXPIRED"
      - name: resubmit_round
        type: integer
        source: computed
        default: 0
        description: number of completed INSUFFICIENT_DOCUMENTATION -> SUBMITTED loops
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the PatientServicesRep who submitted or last resubmitted; audit identity, not a foreign key
      - name: verified_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the EligibilityVerifier who adjudicated; audit identity, not a foreign key
      - name: insufficiency_reason
        type: string
        source: input
        default: null
        description: reason recorded when marked INSUFFICIENT_DOCUMENTATION
      - name: guideline_year_used
        type: integer
        source: computed
        default: null
        description: guideline_year fed into fpg_percent, taken from the fee schedule effective on effective_date (SCHEDULE_YEAR variant)
      - name: fpg_percent
        type: number
        source: computed
        default: null
        description: sliding-fee FPG percentage, 2 decimals, computed with the SCHEDULE_YEAR variant of calculation fpg_percent
      - name: uds_guideline_year_used
        type: integer
        source: computed
        default: null
        description: guideline_year fed into uds_fpg_percent, taken from the calendar year of effective_date (INTAKE_YEAR variant)
      - name: uds_fpg_percent
        type: number
        source: computed
        default: null
        description: reporting FPG percentage, 2 decimals, computed with the INTAKE_YEAR variant of calculation fpg_percent
      - name: assigned_discount_tier_id
        type: string
        source: computed
        default: null
        description: "FK -> DiscountTier.id; tier selected for fpg_percent on the schedule effective on effective_date"
      - name: assigned_tier_label
        type: string
        source: computed
        default: null
        description: tier_label of assigned_discount_tier_id, denormalized for reporting
      - name: supersedes_income_verification_id
        type: string
        source: computed
        default: null
        description: "FK -> IncomeVerification.id; the prior VERIFIED verification of the same patient this one superseded on verification"

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; patient seen"
      - name: service_site_id
        type: string
        source: input
        description: "FK -> ServiceSite.id; site of service, must be IN_SCOPE at creation"
      - name: service_definition_id
        type: string
        source: input
        description: "FK -> ServiceDefinition.id; service rendered, must be IN_SCOPE at creation"
      - name: fee_schedule_id
        type: string
        source: computed
        description: "FK -> FeeSchedule.id; schedule pinned at creation by the fee-schedule selector"
      - name: income_verification_id
        type: string
        source: input
        default: null
        description: "FK -> IncomeVerification.id; pinned verification; when omitted the server applies the income-verification selector, when supplied it must be VERIFIED and cover encounter_date"
      - name: pinned_discount_tier_id
        type: string
        source: computed
        default: null
        description: "FK -> DiscountTier.id; tier pinned at charge computation, null when charge_basis != SLIDING_FEE_TIER"
      - name: encounter_date
        type: datetime
        source: input
        description: date of service; must not be after the logical clock
      - name: payer_type
        type: enum
        source: input
        description: payer of record
        constraints: "SELF_PAY | MEDICAID_MCO | MEDICAID_FFS | MEDICARE | PRIVATE"
      - name: gross_charge_cents
        type: integer
        source: input
        description: undiscounted charge for the encounter in cents
        constraints: "> 0"
      - name: patient_charge_cents
        type: integer
        source: computed
        default: 0
        description: patient responsibility per calculation patient_charge_cents
      - name: charge_basis
        type: enum
        source: computed
        default: THIRD_PARTY
        description: which branch of calculation patient_charge_cents produced patient_charge_cents
        constraints: "SLIDING_FEE_TIER | FULL_CHARGE_UNVERIFIED | THIRD_PARTY"
      - name: sliding_fee_applied
        type: boolean
        source: computed
        default: false
        description: true only when charge_basis == SLIDING_FEE_TIER
      - name: charge_adjustment_cents
        type: integer
        source: computed
        default: 0
        description: most recent FINAL-minus-PROVISIONAL delta applied to patient_charge_cents by a recomputation or void
      - name: waived_amount_cents
        type: integer
        source: computed
        default: 0
        description: amount removed from patient responsibility by a GRANTED InabilityToPayWaiver
      - name: pps_encounter_rate_cents
        type: integer
        source: computed
        default: 0
        description: allowable PPS encounter rate per calculation pps_encounter_rate_cents
      - name: mco_paid_cents
        type: integer
        source: input
        default: 0
        description: managed-care organization payment posted by POST /encounters/{id}/record-payment
        constraints: ">= 0"
      - name: wraparound_due_cents
        type: integer
        source: computed
        default: 0
        description: residual state wraparound payment per calculation wraparound_due_cents
      - name: pps_claim_status
        type: enum
        source: system
        default: UNBILLED
        description: billing state dimension, independent of wraparound_status
        constraints: "UNBILLED | BILLED | PAID | PENDING_ADJUSTMENT | RECONCILED | VOID"
      - name: wraparound_status
        type: enum
        source: computed
        default: NOT_APPLICABLE
        description: wraparound state dimension, independent of pps_claim_status
        constraints: "NOT_APPLICABLE | PENDING | CLAIMED | REBILL_REQUIRED | RECEIVED"
      - name: claim_reference
        type: string
        source: input
        default: null
        description: payer claim reference recorded at billing
      - name: void_reason
        type: enum
        source: input
        default: null
        description: reason recorded when the encounter is voided
        constraints: "DUPLICATE | CODING_ERROR | NONPAYMENT | SITE_OUT_OF_SCOPE | null"

  - name: InabilityToPayWaiver
    parent: Encounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id; encounter whose nominal fee the patient cannot pay"
      - name: waiver_reason
        type: enum
        source: input
        description: protected inability-to-pay ground asserted by the patient
        constraints: "HOMELESS | NO_INCOME | HARDSHIP_ATTESTATION"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: waiver lifecycle state
        constraints: "REQUESTED | GRANTED | DENIED"
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the requesting PatientServicesRep; audit identity, not a foreign key
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the deciding ComplianceOfficer; audit identity, not a foreign key
      - name: decision_note
        type: string
        source: input
        default: null
        description: note recorded with the decision
      - name: waived_amount_cents
        type: integer
        source: computed
        default: 0
        description: patient_charge_cents removed from patient responsibility when the waiver was GRANTED, 0 otherwise

  - name: UDSReport
    parent: HealthCenter
    common_fields: true
    fields:
      - name: health_center_id
        type: string
        source: input
        description: "FK -> HealthCenter.id; reporting grantee"
      - name: reporting_year
        type: integer
        source: input
        description: uniform data system reporting year; unique per health_center_id
        constraints: "unique per health_center_id"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: report lifecycle state
        constraints: "DRAFT | SUBMITTED | ACCEPTED | RETURNED"
      - name: total_patient_count
        type: integer
        source: computed
        default: 0
        description: distinct patients with at least one non-VOID Encounter whose encounter_date falls in reporting_year
      - name: patients_at_or_below_100_count
        type: integer
        source: computed
        default: 0
        description: patients whose counted uds_fpg_percent <= 100.00
      - name: patients_101_to_150_count
        type: integer
        source: computed
        default: 0
        description: patients whose counted uds_fpg_percent is in (100.00, 150.00]
      - name: patients_151_to_200_count
        type: integer
        source: computed
        default: 0
        description: patients whose counted uds_fpg_percent is in (150.00, 200.00]
      - name: patients_over_200_count
        type: integer
        source: computed
        default: 0
        description: patients whose counted uds_fpg_percent > 200.00
      - name: unverified_patient_count
        type: integer
        source: computed
        default: 0
        description: reported patients with no counted verification for reporting_year
      - name: composite_quality_rate_pct
        type: number
        source: computed
        default: null
        description: mean of INCLUDED QualityMeasureResult.rate_pct values, 1 decimal, per calculation uds_composite_quality_rate_pct
      - name: included_measure_count
        type: integer
        source: computed
        default: 0
        description: count of QualityMeasureResult rows with inclusion_status == INCLUDED
      - name: computed_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant of the most recent POST /uds-reports/{id}/compute
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the submitting ComplianceOfficer; audit identity, not a foreign key
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the adjudicating ProjectOfficer; audit identity, not a foreign key
      - name: return_reason
        type: string
        source: input
        default: null
        description: reason recorded when the report is RETURNED
      - name: return_round
        type: integer
        source: computed
        default: 0
        description: number of completed RETURNED -> DRAFT loops

  - name: QualityMeasureResult
    parent: UDSReport
    common_fields: true
    fields:
      - name: uds_report_id
        type: string
        source: input
        description: "FK -> UDSReport.id; owning report"
      - name: measure_code
        type: string
        source: input
        description: clinical quality measure code; unique per uds_report_id
        constraints: "unique per uds_report_id"
      - name: numerator
        type: integer
        source: input
        description: measure numerator
        constraints: ">= 0"
      - name: denominator
        type: integer
        source: input
        description: measure denominator; 0 excludes the measure from the composite
        constraints: ">= 0"
      - name: benchmark_pct
        type: number
        source: input
        description: national benchmark percentage the rate is compared against
        constraints: "0 <= benchmark_pct <= 100"
      - name: rate_pct
        type: number
        source: computed
        default: null
        description: round_half_up(numerator / denominator * 100, 1); null when denominator == 0
      - name: inclusion_status
        type: enum
        source: computed
        default: INCLUDED
        description: whether the measure enters the composite
        constraints: "INCLUDED | EXCLUDED_ZERO_DENOMINATOR"
      - name: meets_benchmark
        type: boolean
        source: computed
        default: null
        description: rate_pct >= benchmark_pct; null when inclusion_status == EXCLUDED_ZERO_DENOMINATOR

  - name: SiteVisitFinding
    parent: HealthCenter
    common_fields: true
    fields:
      - name: health_center_id
        type: string
        source: input
        description: "FK -> HealthCenter.id; grantee the operational site visit finding was issued against"
      - name: service_site_id
        type: string
        source: input
        default: null
        description: "FK -> ServiceSite.id; site the finding is scoped to, null for grantee-wide findings"
      - name: requirement_code
        type: string
        source: input
        description: Section 330 program requirement cited, e.g. R7_SLIDING_FEE or R17_BOARD_COMPOSITION
      - name: severity
        type: enum
        source: input
        description: whether the finding carries a condition on the award
        constraints: "CONDITION | PROGRESS_REPORT_ONLY"
      - name: finding_summary
        type: string
        source: input
        description: narrative of the finding
      - name: cap_due_days
        type: integer
        source: input
        description: days allowed to obtain an ACCEPTED corrective action plan
        constraints: ">= 1"
      - name: cap_due_at
        type: datetime
        source: computed
        description: created_at + cap_due_days days, evaluated on the logical clock
      - name: status
        type: enum
        source: system
        default: OPEN
        description: finding lifecycle state
        constraints: "OPEN | CAP_SUBMITTED | RESOLVED | ESCALATED"
      - name: escalated_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant the compliance sweep escalated the finding
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the issuing ProjectOfficer; audit identity, not a foreign key

  - name: CorrectiveActionPlan
    parent: SiteVisitFinding
    common_fields: true
    fields:
      - name: site_visit_finding_id
        type: string
        source: input
        description: "FK -> SiteVisitFinding.id; finding this plan answers"
      - name: narrative
        type: string
        source: input
        description: corrective action narrative
      - name: milestone_count
        type: integer
        source: input
        description: number of remediation milestones committed to
        constraints: ">= 1"
      - name: target_completion_date
        type: datetime
        source: input
        description: committed completion date; must not be after the finding's cap_due_at
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: plan lifecycle state
        constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED"
      - name: submit_round
        type: integer
        source: computed
        default: 0
        description: number of completed REJECTED -> SUBMITTED loops
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the preparing ComplianceOfficer; audit identity, not a foreign key
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the adjudicating ProjectOfficer; audit identity, not a foreign key
      - name: rejection_reason
        type: string
        source: input
        default: null
        description: reason recorded when the plan is REJECTED

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ScopeChangeRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /scope-change-requests/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == DRAFT"
          - "request_type/target pairing valid per validations priority 8"
          - "HealthCenter.scope_posture == OPEN"
        side_effects:
          - "increments HealthCenter.version by 1 (touch, no field change)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /scope-change-requests/{id}/begin-review"
        actor: BoardChair
        preconditions:
          - "request.status == SUBMITTED"
          - "acting BoardChair X-User-ID is a BoardMember of request.health_center_id with status == SEATED"
          - "HealthCenter.scope_posture == OPEN"
        side_effects:
          - "sets reviewed_by_user_id to the acting X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /scope-change-requests/{id}/decide with decision == APPROVE"
        actor: BoardChair
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "prepared_by_user_id != acting X-User-ID (segregation of duties)"
          - "HealthCenter.scope_posture == OPEN"
          - "HealthCenter.governance_posture == GOVERNANCE_COMPLIANT evaluated on the PRE-transition snapshot per calculation governance_posture step G5"
          - "the ADOPTED FeeSchedule covering the logical clock has review_status != OUT_OF_DATE"
        side_effects:
          - "CASCADE hop 1 — request_type == ADD_SITE: target ServiceSite.status PROPOSED -> IN_SCOPE, in_scope_since = clock; request_type == REMOVE_SITE: target ServiceSite.status IN_SCOPE -> REMOVED; request_type == ADD_SERVICE: target ServiceDefinition.status PENDING -> IN_SCOPE; request_type == REMOVE_SERVICE: target ServiceDefinition.status IN_SCOPE -> OUT_OF_SCOPE"
          - "CASCADE hop 2 — because the target ServiceSite/ServiceDefinition status changed, HealthCenter.in_scope_site_count / in_scope_service_count are recomputed and HealthCenter.version increments by 1"
          - "CASCADE hop 3 — because a site left IN_SCOPE (REMOVE_SITE only), every Encounter at that site with pps_claim_status == UNBILLED is voided: pps_claim_status -> VOID, void_reason = SITE_OUT_OF_SCOPE, charge_adjustment_cents = -patient_charge_cents"
          - "CASCADE hop 4 — because those encounters were voided, each affected Patient.patient_balance_cents is decremented by (patient_charge_cents - waived_amount_cents) of the voided encounter, restoring the invariant in calculation patient_balance_invariant"
          - "CASCADE hop 5 — because those encounters were voided, HealthCenter.wraparound_receivable_cents is recomputed (voided encounters leave the receivable base)"
          - "recomputes HealthCenter.governance_posture on the POST-transition site statuses"
        note: "Branch APPROVE of a three-way fork; each branch carries a different side-effect set."
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /scope-change-requests/{id}/decide with decision == REQUEST_REVISION"
        actor: BoardChair
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "prepared_by_user_id != acting X-User-ID (segregation of duties)"
        side_effects:
          - "stores decision_note"
          - "no scope or counter mutation occurs"
        note: "Branch REQUEST_REVISION — the loop edge of the cycle; no target mutation."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /scope-change-requests/{id}/decide with decision == DENY"
        actor: BoardChair
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "prepared_by_user_id != acting X-User-ID (segregation of duties)"
        side_effects:
          - "stores decision_note"
          - "target ServiceSite in PROPOSED remains PROPOSED; no counter changes"
        note: "Branch DENY — terminal with no cascade."
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /scope-change-requests/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == REVISION_REQUESTED"
          - "revision_round < MAX_SCOPE_REVISION_ROUNDS (3)"
          - "HealthCenter.scope_posture == OPEN"
        side_effects:
          - "increments revision_round by 1"
          - "clears reviewed_by_user_id"
        note: "Cycle edge closing REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED."
      - from: SUBMITTED
        to: HELD
        trigger: "system: HealthCenter.scope_posture became CHANGE_FROZEN (cascade from SiteVisitFinding escalation)"
        actor: system
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets held_from_status = SUBMITTED"
          - "CASCADE — because this request entered HELD, its target ServiceSite in PROPOSED moves to ON_HOLD with hold_reason = SCOPE_FROZEN (ADD_SITE requests only)"
      - from: UNDER_REVIEW
        to: HELD
        trigger: "system: HealthCenter.scope_posture became CHANGE_FROZEN (cascade from SiteVisitFinding escalation)"
        actor: system
        preconditions:
          - "request.status == UNDER_REVIEW"
        side_effects:
          - "sets held_from_status = UNDER_REVIEW"
          - "CASCADE — because this request entered HELD, its target ServiceSite in PROPOSED moves to ON_HOLD with hold_reason = SCOPE_FROZEN (ADD_SITE requests only)"
      - from: HELD
        to: SUBMITTED
        trigger: "system: HealthCenter.scope_posture returned to OPEN and held_from_status == SUBMITTED"
        actor: system
        preconditions:
          - "request.status == HELD"
          - "HealthCenter.open_condition_count == 0"
        side_effects:
          - "clears held_from_status"
          - "CASCADE — because this request left HELD, its target ServiceSite in ON_HOLD returns to PROPOSED and hold_reason is cleared"
      - from: HELD
        to: UNDER_REVIEW
        trigger: "system: HealthCenter.scope_posture returned to OPEN and held_from_status == UNDER_REVIEW"
        actor: system
        preconditions:
          - "request.status == HELD"
          - "HealthCenter.open_condition_count == 0"
        side_effects:
          - "clears held_from_status"
          - "CASCADE — because this request left HELD, its target ServiceSite in ON_HOLD returns to PROPOSED and hold_reason is cleared"

  - entity: IncomeVerification
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /income-verifications/{id}/verify with decision == VERIFY"
        actor: EligibilityVerifier
        preconditions:
          - "verification.status == SUBMITTED"
          - "submitted_by_user_id != acting X-User-ID (segregation of duties)"
          - "documentation_type != REFUSED"
        side_effects:
          - "sets verified_by_user_id, guideline_year_used, fpg_percent, uds_guideline_year_used, uds_fpg_percent, assigned_discount_tier_id, assigned_tier_label per calculations fpg_percent and discount_tier_assignment"
          - "CASCADE hop 1 — any other IncomeVerification of the same patient with status == VERIFIED whose window overlaps this one moves to SUPERSEDED and this row's supersedes_income_verification_id is set to that row's id"
          - "CASCADE hop 2 — because a newly VERIFIED verification now covers past dates, every Encounter of that patient with pps_claim_status IN {BILLED, PAID} whose encounter_date falls inside [effective_date, expires_at] is recomputed with the FINAL variant of calculation patient_charge_cents; patient_charge_cents, charge_basis, pinned_discount_tier_id, income_verification_id and charge_adjustment_cents are rewritten and pps_claim_status moves to PENDING_ADJUSTMENT"
          - "CASCADE hop 3 — because those encounters' patient_charge_cents changed, Patient.patient_balance_cents is recomputed from the invariant formula"
          - "CASCADE hop 4 — because those encounters changed, wraparound_due_cents is recomputed for each MEDICAID_MCO encounter; any whose wraparound_status == CLAIMED and whose recomputed wraparound_due_cents differs from the claimed amount moves to REBILL_REQUIRED"
          - "CASCADE hop 5 — because wraparound_due_cents changed, HealthCenter.wraparound_receivable_cents is recomputed and HealthCenter.version increments by 1"
          - "recomputes Patient.sliding_fee_status"
        note: "Branch VERIFY of a two-way fork; depth-5 transitive cascade."
      - from: SUBMITTED
        to: INSUFFICIENT_DOCUMENTATION
        trigger: "POST /income-verifications/{id}/verify with decision == MARK_INSUFFICIENT"
        actor: EligibilityVerifier
        preconditions:
          - "verification.status == SUBMITTED"
          - "submitted_by_user_id != acting X-User-ID (segregation of duties)"
        side_effects:
          - "stores insufficiency_reason and verified_by_user_id"
          - "leaves fpg_percent, uds_fpg_percent and assigned_discount_tier_id null"
        note: "Branch MARK_INSUFFICIENT — no charge recomputation fires."
      - from: INSUFFICIENT_DOCUMENTATION
        to: SUBMITTED
        trigger: "POST /income-verifications/{id}/resubmit"
        actor: PatientServicesRep
        preconditions:
          - "verification.status == INSUFFICIENT_DOCUMENTATION"
          - "resubmit_round < MAX_VERIFICATION_RESUBMIT_ROUNDS (3)"
        side_effects:
          - "increments resubmit_round by 1"
          - "overwrites documentation_type and, when supplied, declared_annual_income_cents and household_size"
          - "clears insufficiency_reason and verified_by_user_id"
          - "sets submitted_by_user_id to the acting X-User-ID"
        note: "Cycle edge; the loop terminates at resubmit_round == 3."
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system: a later IncomeVerification for the same patient was VERIFIED with an overlapping window"
        actor: system
        preconditions:
          - "verification.status == VERIFIED"
        side_effects:
          - "recomputes Patient.sliding_fee_status"
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /_ops/compliance-sweep (step S1)"
        actor: system
        preconditions:
          - "verification.status == VERIFIED"
          - "expires_at <= logical clock"
        side_effects:
          - "sets Patient.sliding_fee_status = EXPIRED"
          - "does NOT retro-adjust already-billed encounters"

  - entity: Encounter
    initial_state: UNBILLED
    terminal_states: [RECONCILED, VOID]
    transitions:
      - from: UNBILLED
        to: BILLED
        trigger: "POST /encounters/{id}/bill"
        actor: BillingSpecialist
        preconditions:
          - "encounter.pps_claim_status == UNBILLED"
          - "encounter.service_site_id points at a ServiceSite with status == IN_SCOPE"
        side_effects:
          - "stores claim_reference"
          - "dimension wraparound_status is untouched"
      - from: BILLED
        to: PAID
        trigger: "POST /encounters/{id}/record-payment"
        actor: BillingSpecialist
        preconditions:
          - "encounter.pps_claim_status == BILLED"
          - "mco_paid_cents <= pps_encounter_rate_cents"
        side_effects:
          - "stores mco_paid_cents"
          - "recomputes wraparound_due_cents per calculation wraparound_due_cents"
          - "for payer_type == MEDICAID_MCO with wraparound_due_cents > 0, wraparound_status NOT_APPLICABLE|PENDING -> PENDING"
          - "recomputes HealthCenter.wraparound_receivable_cents and increments HealthCenter.version by 1"
      - from: PAID
        to: RECONCILED
        trigger: "POST /encounters/{id}/claim-wraparound with wraparound already RECEIVED, or POST /encounters/{id}/record-payment on a non-MCO payer"
        actor: BillingSpecialist
        preconditions:
          - "encounter.pps_claim_status == PAID"
          - "wraparound_status IN {NOT_APPLICABLE, RECEIVED}"
        side_effects:
          - "freezes patient_charge_cents against further recomputation"
      - from: PENDING_ADJUSTMENT
        to: BILLED
        trigger: "POST /encounters/{id}/bill"
        actor: BillingSpecialist
        preconditions:
          - "encounter.pps_claim_status == PENDING_ADJUSTMENT"
        side_effects:
          - "overwrites claim_reference with the rebilled reference"
        note: "Cycle edge: BILLED -> PENDING_ADJUSTMENT (system) -> BILLED."
      - from: BILLED
        to: PENDING_ADJUSTMENT
        trigger: "system: retroactive IncomeVerification VERIFIED covering encounter_date"
        actor: system
        preconditions:
          - "encounter.pps_claim_status == BILLED"
        side_effects:
          - "see IncomeVerification SUBMITTED -> VERIFIED cascade hops 2-5"
      - from: PAID
        to: PENDING_ADJUSTMENT
        trigger: "system: retroactive IncomeVerification VERIFIED covering encounter_date"
        actor: system
        preconditions:
          - "encounter.pps_claim_status == PAID"
        side_effects:
          - "see IncomeVerification SUBMITTED -> VERIFIED cascade hops 2-5"
      - from: UNBILLED
        to: VOID
        trigger: "POST /encounters/{id}/void, or system cascade from an approved REMOVE_SITE scope change"
        actor: BillingSpecialist | system
        preconditions:
          - "encounter.pps_claim_status IN {UNBILLED, BILLED, PAID, PENDING_ADJUSTMENT}"
          - "NOT (void_reason == NONPAYMENT AND a GRANTED InabilityToPayWaiver exists on the encounter)"
        side_effects:
          - "sets charge_adjustment_cents = -(patient_charge_cents - waived_amount_cents)"
          - "decrements Patient.patient_balance_cents by (patient_charge_cents - waived_amount_cents)"
          - "sets wraparound_status to NOT_APPLICABLE and recomputes HealthCenter.wraparound_receivable_cents, incrementing HealthCenter.version by 1"
      - from: BILLED
        to: VOID
        trigger: "POST /encounters/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "encounter.pps_claim_status == BILLED"
          - "NOT (void_reason == NONPAYMENT AND a GRANTED InabilityToPayWaiver exists on the encounter)"
        side_effects:
          - "same compensating side effects as UNBILLED -> VOID"
      - from: PAID
        to: VOID
        trigger: "POST /encounters/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "encounter.pps_claim_status == PAID"
          - "NOT (void_reason == NONPAYMENT AND a GRANTED InabilityToPayWaiver exists on the encounter)"
        side_effects:
          - "same compensating side effects as UNBILLED -> VOID"
    note: |
      PARALLEL DIMENSION — wraparound_status evolves independently of pps_claim_status on the
      same row:
        NOT_APPLICABLE -> PENDING          (system, on record-payment for MEDICAID_MCO with wraparound_due_cents > 0)
        PENDING        -> CLAIMED          (POST /encounters/{id}/claim-wraparound, BillingSpecialist)
        CLAIMED        -> REBILL_REQUIRED  (system, wraparound_due_cents changed after the claim)
        REBILL_REQUIRED-> CLAIMED          (POST /encounters/{id}/claim-wraparound, BillingSpecialist)
        CLAIMED        -> RECEIVED         (POST /encounters/{id}/claim-wraparound with receipt_confirmed == true)
      A GRANTED InabilityToPayWaiver mutates wraparound_status without touching pps_claim_status,
      and POST /encounters/{id}/bill mutates pps_claim_status without touching wraparound_status.

  - entity: ServiceSite
    initial_state: PROPOSED
    terminal_states: [REMOVED]
    transitions:
      - from: PROPOSED
        to: IN_SCOPE
        trigger: "POST /health-centers/{id}/service-sites with in_initial_scope == true (baseline), or system cascade from an approved ADD_SITE scope change"
        actor: PlatformAdmin | system
        preconditions:
          - "site.status == PROPOSED"
          - "for the baseline path: HealthCenter.scope_baseline_locked == false"
        side_effects:
          - "sets in_scope_since = logical clock"
          - "recomputes HealthCenter.in_scope_site_count and increments HealthCenter.version by 1"
      - from: PROPOSED
        to: ON_HOLD
        trigger: "system: the ScopeChangeRequest targeting this site entered HELD"
        actor: system
        preconditions:
          - "site.status == PROPOSED"
        side_effects:
          - "sets hold_reason = SCOPE_FROZEN"
      - from: ON_HOLD
        to: PROPOSED
        trigger: "system: the ScopeChangeRequest targeting this site left HELD"
        actor: system
        preconditions:
          - "site.status == ON_HOLD"
        side_effects:
          - "clears hold_reason"
        note: "Cycle edge PROPOSED -> ON_HOLD -> PROPOSED."
      - from: IN_SCOPE
        to: SUSPENDED
        trigger: "POST /service-sites/{id}/suspend"
        actor: ProjectOfficer
        preconditions:
          - "site.status == IN_SCOPE"
        side_effects:
          - "recomputes HealthCenter.in_scope_site_count and increments HealthCenter.version by 1"
          - "recomputes HealthCenter.governance_posture because patient-seat qualification depends on IN_SCOPE sites"
      - from: SUSPENDED
        to: IN_SCOPE
        trigger: "POST /service-sites/{id}/reinstate"
        actor: ProjectOfficer
        preconditions:
          - "site.status == SUSPENDED"
        side_effects:
          - "sets in_scope_since = logical clock"
          - "recomputes HealthCenter.in_scope_site_count and governance_posture, incrementing HealthCenter.version by 1"
      - from: IN_SCOPE
        to: REMOVED
        trigger: "system cascade from an approved REMOVE_SITE scope change"
        actor: system
        preconditions:
          - "site.status == IN_SCOPE"
        side_effects:
          - "see ScopeChangeRequest UNDER_REVIEW -> APPROVED cascade hops 1-5"

  - entity: ServiceDefinition
    initial_state: PENDING
    terminal_states: [OUT_OF_SCOPE]
    transitions:
      - from: PENDING
        to: IN_SCOPE
        trigger: "POST /health-centers/{id}/service-definitions with in_initial_scope == true (baseline), or system cascade from an approved ADD_SERVICE scope change"
        actor: PlatformAdmin | system
        preconditions:
          - "service.status == PENDING"
          - "for the baseline path: HealthCenter.scope_baseline_locked == false"
        side_effects:
          - "recomputes HealthCenter.in_scope_service_count and increments HealthCenter.version by 1"
      - from: IN_SCOPE
        to: OUT_OF_SCOPE
        trigger: "system cascade from an approved REMOVE_SERVICE scope change"
        actor: system
        preconditions:
          - "service.status == IN_SCOPE"
        side_effects:
          - "recomputes HealthCenter.in_scope_service_count and increments HealthCenter.version by 1"

  - entity: FeeSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /fee-schedules/{id}/adopt"
        actor: BoardChair
        preconditions:
          - "schedule.status == DRAFT"
          - "acting BoardChair X-User-ID is a BoardMember of schedule.health_center_id with status == SEATED"
          - "expected_health_center_version == HealthCenter.version"
          - "no other ADOPTED schedule of the same grantee overlaps [effective_start, effective_end) unless its effective_start is exactly equal, in which case that schedule is superseded"
          - "nominal_fee_cents <= HealthCenter.nominal_fee_cap_cents"
          - "tier bands valid per validations priority 25"
        side_effects:
          - "sets adopted_at = logical clock, adopted_by_user_id, last_reviewed_at = logical clock, reviewed_against_guideline_year = fpg_year"
          - "any ADOPTED schedule of the same grantee with the same effective_start moves to SUPERSEDED and its superseded_by_fee_schedule_id is set to this schedule's id"
          - "recomputes review_status per calculation fee_schedule_review_status"
          - "increments HealthCenter.version by 1"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system: another schedule with the same effective_start was adopted"
        actor: system
        preconditions:
          - "schedule.status == ADOPTED"
        side_effects:
          - "sets superseded_by_fee_schedule_id"
          - "already-created Encounters keep their pinned fee_schedule_id"
      - from: ADOPTED
        to: EXPIRED
        trigger: "POST /_ops/compliance-sweep (step S3)"
        actor: system
        preconditions:
          - "schedule.status == ADOPTED"
          - "effective_end <= logical clock"
        side_effects:
          - "sets review_status per calculation fee_schedule_review_status"

  - entity: InabilityToPayWaiver
    initial_state: REQUESTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /waivers/{id}/decide with decision == GRANT"
        actor: ComplianceOfficer
        preconditions:
          - "waiver.status == REQUESTED"
          - "requested_by_user_id != acting X-User-ID (segregation of duties)"
          - "the Encounter's pps_claim_status NOT IN {RECONCILED, VOID}"
        side_effects:
          - "sets waived_amount_cents = Encounter.patient_charge_cents and copies it onto Encounter.waived_amount_cents"
          - "CASCADE hop 1 — because Encounter.waived_amount_cents changed, Patient.patient_balance_cents is decremented by that amount"
          - "CASCADE hop 2 — because the counted patient portion dropped to 0, Encounter.wraparound_due_cents is recomputed per calculation wraparound_due_cents"
          - "CASCADE hop 3 — because wraparound_due_cents changed while wraparound_status == CLAIMED, wraparound_status moves to REBILL_REQUIRED, and HealthCenter.wraparound_receivable_cents is recomputed with HealthCenter.version incremented by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /waivers/{id}/decide with decision == DENY"
        actor: ComplianceOfficer
        preconditions:
          - "waiver.status == REQUESTED"
          - "requested_by_user_id != acting X-User-ID (segregation of duties)"
        side_effects:
          - "leaves waived_amount_cents at 0 and performs no ledger or wraparound mutation"

  - entity: SiteVisitFinding
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: CAP_SUBMITTED
        trigger: "POST /corrective-action-plans/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "finding.status IN {OPEN, ESCALATED}"
        side_effects:
          - "no grantee-level counter changes"
      - from: ESCALATED
        to: CAP_SUBMITTED
        trigger: "POST /corrective-action-plans/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "finding.status == ESCALATED"
        side_effects:
          - "finding remains counted in HealthCenter.open_condition_count until a CAP is ACCEPTED"
        note: "Cycle: OPEN -> CAP_SUBMITTED -> ESCALATED -> CAP_SUBMITTED -> RESOLVED."
      - from: CAP_SUBMITTED
        to: OPEN
        trigger: "POST /corrective-action-plans/{id}/adjudicate with decision == REJECT"
        actor: ProjectOfficer
        preconditions:
          - "finding.status == CAP_SUBMITTED"
          - "the finding has never been ESCALATED"
        side_effects:
          - "the plan returns to REJECTED and may loop back to SUBMITTED"
      - from: CAP_SUBMITTED
        to: RESOLVED
        trigger: "POST /corrective-action-plans/{id}/adjudicate with decision == ACCEPT"
        actor: ProjectOfficer
        preconditions:
          - "finding.status == CAP_SUBMITTED"
          - "prepared_by_user_id of the plan != acting X-User-ID (segregation of duties)"
        side_effects:
          - "COMPENSATING CASCADE hop 1 — if the finding had been ESCALATED, HealthCenter.open_condition_count is recomputed as count(SiteVisitFinding with status == ESCALATED)"
          - "COMPENSATING CASCADE hop 2 — because open_condition_count reached 0, HealthCenter.operational_status returns CONDITIONS_IMPOSED -> ACTIVE and scope_posture returns CHANGE_FROZEN -> OPEN, incrementing HealthCenter.version by 1"
          - "COMPENSATING CASCADE hop 3 — because scope_posture returned to OPEN, every HELD ScopeChangeRequest of that grantee returns to held_from_status"
          - "COMPENSATING CASCADE hop 4 — because those requests left HELD, every ON_HOLD target ServiceSite returns to PROPOSED and hold_reason is cleared"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /_ops/compliance-sweep (step S2)"
        actor: system
        preconditions:
          - "finding.status IN {OPEN, CAP_SUBMITTED}"
          - "finding.severity == CONDITION"
          - "cap_due_at <= logical clock"
          - "no CorrectiveActionPlan of the finding has status == ACCEPTED"
        side_effects:
          - "CASCADE hop 1 — sets escalated_at and recomputes HealthCenter.open_condition_count"
          - "CASCADE hop 2 — because open_condition_count became > 0, HealthCenter.operational_status ACTIVE -> CONDITIONS_IMPOSED"
          - "CASCADE hop 3 — because operational_status became CONDITIONS_IMPOSED, HealthCenter.scope_posture OPEN -> CHANGE_FROZEN and HealthCenter.version increments by 1"
          - "CASCADE hop 4 — because scope_posture became CHANGE_FROZEN, every ScopeChangeRequest of that grantee in {SUBMITTED, UNDER_REVIEW} moves to HELD with held_from_status recorded"
          - "CASCADE hop 5 — because those requests entered HELD, every ADD_SITE target ServiceSite in PROPOSED moves to ON_HOLD with hold_reason = SCOPE_FROZEN"
      - from: CAP_SUBMITTED
        to: ESCALATED
        trigger: "POST /_ops/compliance-sweep (step S2)"
        actor: system
        preconditions:
          - "finding.status == CAP_SUBMITTED"
          - "finding.severity == CONDITION"
          - "cap_due_at <= logical clock"
          - "no CorrectiveActionPlan of the finding has status == ACCEPTED"
        side_effects:
          - "same depth-5 cascade as OPEN -> ESCALATED"

  - entity: CorrectiveActionPlan
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /corrective-action-plans/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "plan.status == DRAFT"
          - "the parent SiteVisitFinding.status IN {OPEN, ESCALATED}"
        side_effects:
          - "parent SiteVisitFinding moves to CAP_SUBMITTED"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /corrective-action-plans/{id}/adjudicate with decision == ACCEPT"
        actor: ProjectOfficer
        preconditions:
          - "plan.status == SUBMITTED"
          - "prepared_by_user_id != acting X-User-ID (segregation of duties)"
        side_effects:
          - "sets adjudicated_by_user_id"
          - "parent SiteVisitFinding moves to RESOLVED, triggering the compensating cascade hops 1-4"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /corrective-action-plans/{id}/adjudicate with decision == REJECT"
        actor: ProjectOfficer
        preconditions:
          - "plan.status == SUBMITTED"
          - "prepared_by_user_id != acting X-User-ID (segregation of duties)"
        side_effects:
          - "stores rejection_reason"
          - "parent SiteVisitFinding returns to OPEN when it had never been ESCALATED, and stays ESCALATED otherwise"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /corrective-action-plans/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "plan.status == REJECTED"
          - "submit_round < MAX_CAP_SUBMIT_ROUNDS (2)"
        side_effects:
          - "increments submit_round by 1"
          - "clears rejection_reason and adjudicated_by_user_id"
          - "parent SiteVisitFinding moves to CAP_SUBMITTED"
        note: "Cycle edge; the loop terminates at submit_round == 2."

  - entity: UDSReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /uds-reports/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == DRAFT"
          - "computed_at is not null"
          - "included_measure_count >= 1"
        side_effects:
          - "sets submitted_by_user_id"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /uds-reports/{id}/adjudicate with decision == ACCEPT"
        actor: ProjectOfficer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "sets adjudicated_by_user_id"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /uds-reports/{id}/adjudicate with decision == RETURN"
        actor: ProjectOfficer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "stores return_reason"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /uds-reports/{id}/compute"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == RETURNED"
          - "return_round < MAX_UDS_RETURN_ROUNDS (3)"
        side_effects:
          - "increments return_round by 1"
          - "recomputes every aggregate and sets computed_at"
        note: "Cycle edge RETURNED -> DRAFT."

  - entity: BoardMember
    initial_state: SEATED
    terminal_states: [RESIGNED]
    transitions:
      - from: SEATED
        to: RESIGNED
        trigger: "POST /board-members/{id}/resign"
        actor: ComplianceOfficer
        preconditions:
          - "member.status == SEATED"
          - "resignation_date >= term_start"
        side_effects:
          - "truncates term_end to resignation_date"
          - "recomputes HealthCenter.seated_board_count, patient_seat_pct and governance_posture, incrementing HealthCenter.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: income-verification-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /patients/{id}/income-verifications"
    occ_field: "expected_patient_version"
    description: |
      Submitting an IncomeVerification against a Patient whose version has advanced since the
      client last read it is rejected. A new verification legitimately supersedes the patient's
      prior verification once adjudicated, so the write is semantically valid on its own; the
      stale version is the only signal that the submitter's view of the patient's verification
      history is out of date.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

  - rule_id: fee-schedule-adopt-stale-health-center
    parent_entity: HealthCenter
    write_endpoint: "POST /fee-schedules/{id}/adopt"
    occ_field: "expected_health_center_version"
    description: |
      Adopting a FeeSchedule whose grantee version has advanced since the client last read it is
      rejected. Adoption of a schedule sharing an effective_start with an already-ADOPTED schedule
      legitimately supersedes that schedule, so the adopting board must prove it observed the
      grantee state (including its currently ADOPTED schedule and its governance posture) that its
      vote was based on.
    error_id: ERR_STALE_HEALTH_CENTER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: fpg_percent
    trigger: "POST /income-verifications/{id}/verify with decision == VERIFY (side effect: sets fpg_percent, guideline_year_used, uds_fpg_percent, uds_guideline_year_used)"
    algorithm: threshold
    formula: |
      # Two variants of the SAME computation over the SAME IncomeVerification row. They differ
      # only in WHICH PovertyGuideline year they read, and they routinely disagree.
      #
      #   guideline_cents(year, hh) = PovertyGuideline[guideline_year == year].base_amount_cents
      #                               + (hh - 1) * PovertyGuideline[guideline_year == year].increment_cents
      #   pct(year) = round_half_up(declared_annual_income_cents / guideline_cents(year, household_size) * 100, 2)
      #
      # VARIANT SCHEDULE_YEAR  -> written to fpg_percent / guideline_year_used
      #   year = FeeSchedule.fpg_year of the schedule returned by the fee-schedule selector for
      #          (patient's health center via the encounter-independent path: the single grantee that
      #          owns an ADOPTED schedule covering effective_date) — i.e. the year the adopted
      #          sliding fee schedule's bands were built from, NOT the year of the visit.
      #   fpg_percent = pct(FeeSchedule.fpg_year)
      #
      # VARIANT INTAKE_YEAR   -> written to uds_fpg_percent / uds_guideline_year_used
      #   year = calendar year of IncomeVerification.effective_date (UTC)
      #   uds_fpg_percent = pct(calendar_year(effective_date))
      #
      # If the PovertyGuideline row for the required year does not exist the verification cannot be
      # VERIFIED -> ERR_POVERTY_GUIDELINE_MISSING.
    input_set: "the single IncomeVerification row being verified; household_size is the row's own household_size, never Patient.household_size"
    constants:
      ROUNDING: round_half_up
      DECIMALS: 2
    precision: "2 decimal places, round_half_up, on the percentage (not on the guideline)"
    variants:
      - name: SCHEDULE_YEAR
        when: "assigning the sliding fee discount tier (drives DiscountTier selection and every patient charge)"
        difference: "reads the PovertyGuideline of FeeSchedule.fpg_year — the year the adopted schedule's bands were built from"
      - name: INTAKE_YEAR
        when: "counting the patient into the UDS income-distribution bands"
        difference: "reads the PovertyGuideline of the calendar year of effective_date, so a schedule that lags the calendar year yields a different percentage and a different band from the tier assignment"

  - name: discount_tier_assignment
    trigger: "POST /income-verifications/{id}/verify with decision == VERIFY (side effect: sets assigned_discount_tier_id, assigned_tier_label)"
    algorithm: threshold
    formula: |
      schedule = fee-schedule selector applied to IncomeVerification.effective_date
      tier = the single DiscountTier of `schedule` with
               fpg_min_pct <= IncomeVerification.fpg_percent
               AND (fpg_max_pct IS NULL OR IncomeVerification.fpg_percent < fpg_max_pct)
      # HALF-OPEN bands [fpg_min_pct, fpg_max_pct). A percentage exactly equal to a band's
      # fpg_max_pct belongs to the NEXT band, never to the band it bounds. fpg_percent == 100.00
      # therefore lands in the 100-138 partial-discount band, NOT in the full-discount NOMINAL band.
      assigned_discount_tier_id = tier.id
      assigned_tier_label       = tier.tier_label
    input_set: "DiscountTier rows of the selected FeeSchedule only; tiers of DRAFT or SUPERSEDED schedules are never consulted"
    constants:
      BAND_SEMANTICS: "[fpg_min_pct, fpg_max_pct)"
    precision: "exact comparison on the 2-decimal fpg_percent value"

  - name: patient_charge_cents
    trigger: "POST /encounters (PROVISIONAL variant) and the IncomeVerification SUBMITTED -> VERIFIED cascade hop 2 (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      S1. if payer_type IN {MEDICARE, MEDICAID_FFS, PRIVATE}:
              sliding_fee_applied = false; charge_basis = THIRD_PARTY
              pinned_discount_tier_id = null
              return 0
      S2. v = income-verification selector result (see selector policy below)
          if v IS NULL:
              sliding_fee_applied = false; charge_basis = FULL_CHARGE_UNVERIFIED
              pinned_discount_tier_id = null; income_verification_id = null
              return (gross_charge_cents if payer_type == SELF_PAY else 0)
      S3. tier = the DiscountTier of the pinned FeeSchedule selected by calculation
                 discount_tier_assignment for v.fpg_percent (half-open bands)
      S4. if   tier.discount_kind == NOMINAL:          raw = FeeSchedule.nominal_fee_cents
          elif tier.discount_kind == PERCENT_DISCOUNT: raw = round_half_up(gross_charge_cents * (1 - tier.discount_pct))
          else:                                        raw = gross_charge_cents
      S5. raw = min(raw, gross_charge_cents)                              # never exceed the gross charge
      S6. if tier.discount_kind == PERCENT_DISCOUNT and raw < FeeSchedule.nominal_fee_cents:
              raw = min(FeeSchedule.nominal_fee_cents, gross_charge_cents)   # nominal floor, still capped by gross
      S7. if payer_type == MEDICAID_MCO:
              raw = min(raw, FeeSchedule.nominal_fee_cents)               # Medicaid patients pay at most the nominal fee
      S8. sliding_fee_applied = true; charge_basis = SLIDING_FEE_TIER
          pinned_discount_tier_id = tier.id; income_verification_id = v.id
          return raw
      # ROUNDING ORDER IS PINNED: exactly one rounding, at S4, on the single product
      # gross_charge_cents * (1 - discount_pct). The clamps at S5/S6/S7 operate on already-rounded
      # integers; re-rounding after a clamp is forbidden.
    input_set: |
      One Encounter row plus: the FeeSchedule pinned by the fee-schedule selector, that schedule's
      DiscountTier rows, and the IncomeVerification chosen by the income-verification selector.
      INCOME-VERIFICATION SELECTOR (server picks the row when income_verification_id is omitted):
        (a) eligibility filter: IncomeVerification.patient_id == Encounter.patient_id
            AND status == VERIFIED
            AND effective_date <= Encounter.encounter_date <= expires_at   (CLOSED window)
        (b) ranking expression: effective_date DESC
        (c) tie-break when effective_date ties: created_at DESC
        (d) empty candidate set: no error — branch S2 applies (charge_basis = FULL_CHARGE_UNVERIFIED)
      FEE-SCHEDULE SELECTOR:
        (a) eligibility filter: FeeSchedule.health_center_id == the site's health_center_id
            AND status == ADOPTED
            AND effective_start <= Encounter.encounter_date < effective_end   (HALF-OPEN period)
        (b) ranking expression: effective_start DESC
        (c) tie-break when effective_start ties: created_at DESC
        (d) empty candidate set: reject with ERR_NO_EFFECTIVE_FEE_SCHEDULE
    constants:
      ROUNDING: round_half_up
      DECIMALS: 0
    precision: "integer cents, round_half_up, applied once at S4"
    variants:
      - name: PROVISIONAL
        when: "POST /encounters — the charge computed at intake"
        difference: "runs the income-verification selector against the verifications that exist at creation time; when none covers encounter_date a SELF_PAY encounter is charged the full gross_charge_cents with charge_basis = FULL_CHARGE_UNVERIFIED"
      - name: FINAL
        when: "cascade hop 2 of IncomeVerification SUBMITTED -> VERIFIED, when the newly verified window covers an already-billed encounter_date"
        difference: "re-runs the selector after the retroactive verification exists, so the same encounter with the same gross_charge_cents yields a different patient_charge_cents; the delta is written to charge_adjustment_cents = FINAL - PROVISIONAL and the claim moves to PENDING_ADJUSTMENT"

  - name: pps_encounter_rate_cents
    trigger: "POST /encounters (side effect: sets pps_encounter_rate_cents)"
    algorithm: tiered_pricing
    formula: |
      m = 1.00
      if ServiceDefinition.service_category == ADDITIONAL:  m = m * ADDITIONAL_SERVICE_FACTOR   # 0.85
      if ServiceSite.site_type == INTERMITTENT:             m = m * INTERMITTENT_SITE_FACTOR    # 0.90
      rate = round_half_up(HealthCenter.pps_base_rate_cents * m)     # single rounding, after ALL factors multiply
      if payer_type == MEDICARE:
          rate = min(rate, HealthCenter.medicare_upper_limit_cents)
      pps_encounter_rate_cents = rate
    input_set: "the encounter's ServiceDefinition.service_category, ServiceSite.site_type, payer_type, and the grantee's pps_base_rate_cents / medicare_upper_limit_cents"
    constants:
      ADDITIONAL_SERVICE_FACTOR: 0.85
      INTERMITTENT_SITE_FACTOR: 0.90
      ROUNDING: round_half_up
    precision: "integer cents; the factors multiply exactly and the product is rounded exactly once, before the Medicare ceiling clamp"

  - name: wraparound_due_cents
    trigger: "POST /encounters/{id}/record-payment, InabilityToPayWaiver REQUESTED -> GRANTED cascade hop 2, and IncomeVerification SUBMITTED -> VERIFIED cascade hop 4"
    algorithm: constraint_propagation
    formula: |
      if payer_type != MEDICAID_MCO:
          wraparound_status = NOT_APPLICABLE
          return 0
      counted_patient_portion = 0 if EXISTS InabilityToPayWaiver
                                        WHERE encounter_id == Encounter.id AND status == GRANTED
                                else Encounter.patient_charge_cents
      wraparound_due_cents = max(0, pps_encounter_rate_cents - mco_paid_cents - counted_patient_portion)
      # PINNED EVALUATION ORDER — the dependency graph LOOKS circular because the waiver decision is
      # only legal once patient_charge_cents equals the nominal fee, patient_charge_cents is only
      # known once the tier is assigned, the tier is only known once fpg_percent is computed, and
      # wraparound_due_cents is only known once the waiver outcome is known. The order is fixed as:
      #   E1 fpg_percent (SCHEDULE_YEAR variant)
      #   E2 discount_tier_assignment
      #   E3 patient_charge_cents (steps S1..S8, including the MEDICAID_MCO nominal clamp S7)
      #   E4 waiver eligibility test (patient_charge_cents == FeeSchedule.nominal_fee_cents
      #      AND charge_basis == SLIDING_FEE_TIER) and the GRANT/DENY decision
      #   E5 counted_patient_portion
      #   E6 wraparound_due_cents
      # Every recomputation re-enters at E5 with E1..E4 frozen — a granted waiver NEVER re-runs the
      # tier assignment, and a retroactive verification NEVER re-opens a decided waiver.
    input_set: "one Encounter row plus its InabilityToPayWaiver rows; only status == GRANTED waivers zero the counted portion, REQUESTED and DENIED waivers do not"
    constants:
      FLOOR: 0
    precision: "integer cents; max(0, ...) floors the residual so an overpaying MCO never creates a negative receivable"

  - name: uds_composite_quality_rate_pct
    trigger: "POST /uds-reports/{id}/compute (side effect: sets rate_pct / inclusion_status / meets_benchmark per measure, then composite_quality_rate_pct and included_measure_count)"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 — per measure, in ascending created_at order:
      for each QualityMeasureResult of the report:
          if denominator == 0:
              rate_pct = null; inclusion_status = EXCLUDED_ZERO_DENOMINATOR; meets_benchmark = null
          else:
              rate_pct        = round_half_up(numerator / denominator * 100, 1)
              inclusion_status = INCLUDED
              meets_benchmark  = (rate_pct >= benchmark_pct)
      # STEP 2 — composite over INCLUDED measures only:
      included = [m for m in measures if m.inclusion_status == INCLUDED]
      included_measure_count = len(included)
      if included_measure_count == 0:
          composite_quality_rate_pct = null
      else:
          composite_quality_rate_pct = round_half_up(sum(m.rate_pct for m in included) / included_measure_count, 1)
      # ROUNDING ORDER IS PINNED: ROUND-PER-MEASURE-THEN-AVERAGE. The rejected alternative —
      # pooling numerators and denominators (round(sum(numerator)/sum(denominator)*100, 1)) — is
      # explicitly NOT this system's composite and produces a different number for the same data.
      # meets_benchmark compares the ROUNDED rate_pct against benchmark_pct with >= (a rate exactly
      # equal to the benchmark meets it).
    input_set: "every QualityMeasureResult row of the report, including EXCLUDED_ZERO_DENOMINATOR rows for inclusion_status purposes but excluding them from both the numerator sum and the divisor of step 2"
    constants:
      ROUNDING: round_half_up
      MEASURE_DECIMALS: 1
      COMPOSITE_DECIMALS: 1
    precision: "1 decimal place at both levels; the average is taken over already-rounded per-measure rates"

  - name: uds_income_distribution
    trigger: "POST /uds-reports/{id}/compute (side effect: sets total_patient_count and the four band counts plus unverified_patient_count)"
    algorithm: aggregation
    formula: |
      reported_patients = DISTINCT Encounter.patient_id over Encounter rows where
            the encounter's ServiceSite.health_center_id == report.health_center_id
        AND pps_claim_status != VOID
        AND calendar_year(encounter_date) == report.reporting_year
      total_patient_count = |reported_patients|
      for each patient in reported_patients:
          counted = the IncomeVerification of that patient with status IN {VERIFIED, SUPERSEDED, EXPIRED}
                    whose effective_date is the LATEST effective_date <= 31 December of reporting_year,
                    tie-broken by created_at DESC; rows still SUBMITTED or INSUFFICIENT_DOCUMENTATION
                    are never counted
          if counted IS NULL: unverified_patient_count += 1
          else:
              p = counted.uds_fpg_percent          # INTAKE_YEAR variant — NOT fpg_percent
              if   p <= 100.00: patients_at_or_below_100_count += 1
              elif p <= 150.00: patients_101_to_150_count += 1
              elif p <= 200.00: patients_151_to_200_count += 1
              else:             patients_over_200_count += 1
      # BAND SEMANTICS ARE DELIBERATELY DIFFERENT FROM THE TIER BANDS: reporting bands are
      # CLOSED-ABOVE (<= 100.00, (100.00, 150.00], (150.00, 200.00], > 200.00) while DiscountTier
      # bands are HALF-OPEN ([min, max)). uds_fpg_percent == 100.00 counts in the first reporting
      # band, whereas fpg_percent == 100.00 assigns the SECOND (partial-discount) tier.
    input_set: "non-VOID encounters of the reporting year, and per patient exactly one counted IncomeVerification chosen by the pinned latest-effective_date rule"
    constants:
      BAND_1_MAX: 100.00
      BAND_2_MAX: 150.00
      BAND_3_MAX: 200.00
    precision: "integer counts; band comparisons use the 2-decimal uds_fpg_percent value"

  - name: governance_posture
    trigger: "POST /health-centers/{id}/board-members, POST /board-members/{id}/resign, POST /encounters, ServiceSite status changes, and POST /_ops/compliance-sweep (step S4); also read by GET /health-centers/{id}/governance-summary"
    algorithm: aggregation
    formula: |
      G1. seated = BoardMember rows where health_center_id == HC.id AND status == SEATED
          seated_board_count = |seated|
      G2. a seated PATIENT seat is QUALIFIED (patient_seat_qualified = true) iff
              seat_type == PATIENT
          AND patient_id IS NOT NULL
          AND EXISTS an Encounter e with
                  e.patient_id == this.patient_id
              AND e.pps_claim_status != VOID
              AND e.encounter_date >= (logical_clock - PATIENT_ENCOUNTER_RECENCY_MONTHS months)   # INCLUSIVE
              AND the ServiceSite of e has status == IN_SCOPE at the evaluation instant
      G3. qualified_patient_seat_count = |{s in seated : s.patient_seat_qualified}|
          non_patient_seat_count       = |{s in seated : s.seat_type == NON_PATIENT}|
          healthcare_industry_seat_count = |{s in seated : s.seat_type == NON_PATIENT
                                             AND s.derives_over_10pct_income_from_healthcare}|
      G4. patient_seat_pct = 0.00 if seated_board_count == 0
                             else round_half_up(qualified_patient_seat_count / seated_board_count * 100, 2)
      G5. governance_posture = GOVERNANCE_COMPLIANT iff ALL of
              seated_board_count >= MIN_BOARD_SEATS (3)
              AND seated_board_count <= MAX_BOARD_SEATS (25)
              AND patient_seat_pct >= PATIENT_MAJORITY_MIN_PCT (51.00)          # >= , not >
              AND healthcare_industry_seat_count <= floor(non_patient_seat_count / 2)
          else GOVERNANCE_DEFICIENT
          # EMPTY-SET EDGE: seated_board_count == 0 yields patient_seat_pct 0.00 and
          # GOVERNANCE_DEFICIENT — never a divide-by-zero and never a vacuous majority.
      G6. SNAPSHOT RULE — when this posture GATES a transition (ScopeChangeRequest
          UNDER_REVIEW -> APPROVED), it is evaluated on the PRE-transition site statuses, i.e.
          before the same request's own hop-1 site mutation. The posture is then RECOMPUTED on the
          POST-transition statuses as the last side effect of that transition. This breaks the
          apparent circularity "a site becomes IN_SCOPE only if governance is compliant, and
          governance depends on encounters at IN_SCOPE sites".
    input_set: "SEATED BoardMember rows only; RESIGNED seats leave both numerator and denominator. Encounters with pps_claim_status == VOID never qualify a seat."
    constants:
      MIN_BOARD_SEATS: 3
      MAX_BOARD_SEATS: 25
      PATIENT_MAJORITY_MIN_PCT: 51.00
      PATIENT_ENCOUNTER_RECENCY_MONTHS: 24
      ROUNDING: round_half_up
      DECIMALS: 2
    precision: "2 decimal places on patient_seat_pct; the majority test is >= on the rounded value"

  - name: fee_schedule_review_status
    trigger: "POST /fee-schedules/{id}/adopt, POST /fee-schedules/{id}/annual-review, POST /_ops/compliance-sweep (step S3), and any read of FeeSchedule"
    algorithm: threshold
    formula: |
      latest_guideline_year = max(PovertyGuideline.guideline_year over all rows)
      elapsed_days = floor((logical_clock - last_reviewed_at) / 86400 seconds)      # whole days
      R1. if fpg_year < latest_guideline_year:  review_status = OUT_OF_DATE
      R2. elif elapsed_days > ANNUAL_REVIEW_MAX_DAYS (365): review_status = REVIEW_DUE
      R3. else: review_status = CURRENT
      # PRECEDENCE IS PINNED: guideline staleness (R1) dominates elapsed time (R2). A schedule
      # reviewed yesterday against last year's guideline table is OUT_OF_DATE, not CURRENT.
      # BOUNDARY: elapsed_days == 365 is still CURRENT (strict >), elapsed_days == 366 is REVIEW_DUE.
    input_set: "the schedule's own fpg_year and last_reviewed_at, plus the maximum guideline_year present in PovertyGuideline"
    constants:
      ANNUAL_REVIEW_MAX_DAYS: 365
    precision: "whole days, floor; no partial-day rounding"

  - name: patient_balance_invariant
    trigger: "POST /encounters, POST /encounters/{id}/void, POST /waivers/{id}/decide with decision == GRANT, and IncomeVerification SUBMITTED -> VERIFIED cascade hop 3"
    algorithm: aggregation
    formula: |
      # CONSERVED MONETARY QUANTITY — must hold after every request, including compensations:
      Patient.patient_balance_cents
        == SUM over Encounter e where e.patient_id == Patient.id AND e.pps_claim_status != VOID
             of (e.patient_charge_cents - e.waived_amount_cents)
      # Forward action  : POST /encounters             -> += (patient_charge_cents - 0)
      # Recompute action: retroactive verification      -> += charge_adjustment_cents
      # Waiver action   : waiver GRANTED                -> -= waived_amount_cents
      # Compensating    : POST /encounters/{id}/void    -> -= (patient_charge_cents - waived_amount_cents)
      # A forward encounter followed by its void MUST leave patient_balance_cents at its pre-encounter
      # value with ZERO drift, even when a waiver and a retroactive recomputation intervened.
    input_set: "all non-VOID encounters of the patient; VOID encounters are excluded entirely rather than zeroed"
    constants:
      DRIFT_TOLERANCE_CENTS: 0
    precision: "exact integer cents; no tolerance"

  - name: scope_listing_invariant
    trigger: "ServiceSite / ServiceDefinition status changes and SiteVisitFinding escalation or resolution"
    algorithm: aggregation
    formula: |
      # CONSERVED CARDINALITY QUANTITIES — must hold after every request, including compensations:
      HealthCenter.in_scope_site_count    == count(ServiceSite WHERE health_center_id == HC.id AND status == IN_SCOPE)
      HealthCenter.in_scope_service_count == count(ServiceDefinition WHERE health_center_id == HC.id AND status == IN_SCOPE)
      HealthCenter.open_condition_count   == count(SiteVisitFinding WHERE health_center_id == HC.id AND status == ESCALATED)
      HealthCenter.seated_board_count     == count(BoardMember WHERE health_center_id == HC.id AND status == SEATED)
      HealthCenter.wraparound_receivable_cents
        == SUM of Encounter.wraparound_due_cents over encounters whose ServiceSite.health_center_id == HC.id
           AND wraparound_status IN {PENDING, CLAIMED, REBILL_REQUIRED}
      # Forward action  : approved ADD_SITE     -> in_scope_site_count += 1
      # Compensating    : approved REMOVE_SITE  -> in_scope_site_count -= 1  (back to the original count)
      # Forward action  : finding ESCALATED     -> open_condition_count += 1, scope_posture CHANGE_FROZEN
      # Compensating    : CAP ACCEPTED          -> open_condition_count -= 1, scope_posture OPEN,
      #                                            HELD requests and ON_HOLD sites restored
    input_set: "all non-terminal and terminal child rows of the grantee, filtered by the status sets named above"
    constants:
      DRIFT_TOLERANCE: 0
    precision: "exact integer counts; a cascade that restores a status must restore the counter in the same request"

  - name: compliance_sweep_epoch
    trigger: "POST /_ops/compliance-sweep"
    algorithm: chronological
    formula: |
      # The sweep advances the compliance epoch in a PINNED step order; within each step rows are
      # processed in created_at ASC order (never by id).
      S1. every IncomeVerification with status == VERIFIED AND expires_at <= logical_clock
              -> EXPIRED; owning Patient.sliding_fee_status -> EXPIRED
      S2. every SiteVisitFinding with severity == CONDITION AND status IN {OPEN, CAP_SUBMITTED}
              AND cap_due_at <= logical_clock AND no ACCEPTED CorrectiveActionPlan
              -> ESCALATED, firing the depth-5 escalation cascade
      S3. every FeeSchedule with status == ADOPTED: recompute review_status; those with
              effective_end <= logical_clock -> EXPIRED
      S4. every HealthCenter touched by S1..S3 (plus every grantee with board or site changes):
              recompute governance_posture, patient_seat_pct, seated_board_count,
              in_scope_site_count, in_scope_service_count, open_condition_count,
              wraparound_receivable_cents, operational_status, scope_posture
      # Step order matters: S2 escalations can freeze scope BEFORE S4 recomputes posture, so a
      # single sweep both escalates a finding and reports the frozen posture.
    input_set: "all rows of all grantees; the sweep is global and idempotent within one clock instant (a second sweep at the same clock value changes nothing)"
    constants:
      STEP_ORDER: "S1 -> S2 -> S3 -> S4"
      ROW_ORDER: "created_at ASC"
    precision: "no numeric rounding; ordering is total because created_at carries three fractional digits and rows within one entity are created by distinct requests"

# =============================================================================
# §1.4 Validation Rules Table  (evaluated in ascending priority; the FIRST
#      violated row decides the response — lower priority number always wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "request body contains every required input field, every enum value is a declared member, every integer/number field satisfies its declared constraint, and no read-only (system/computed) field is supplied"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_constraint
    check: "pagination parameters are in range: 1 <= limit <= 100, offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 6
    category: existence
    check: "every id embedded in the path exists, validated left-to-right"
    error_id: "ERR_HEALTH_CENTER_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_SERVICE_SITE_NOT_FOUND | ERR_SERVICE_DEFINITION_NOT_FOUND | ERR_SCOPE_CHANGE_REQUEST_NOT_FOUND | ERR_FEE_SCHEDULE_NOT_FOUND | ERR_DISCOUNT_TIER_NOT_FOUND | ERR_INCOME_VERIFICATION_NOT_FOUND | ERR_ENCOUNTER_NOT_FOUND | ERR_WAIVER_NOT_FOUND | ERR_BOARD_MEMBER_NOT_FOUND | ERR_UDS_REPORT_NOT_FOUND | ERR_QUALITY_MEASURE_RESULT_NOT_FOUND | ERR_SITE_VISIT_FINDING_NOT_FOUND | ERR_CORRECTIVE_ACTION_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the field order declared in §1.1"
    error_id: "the matching ERR_*_NOT_FOUND of the referenced entity"
    http_status: 404
    applies_to: "POST /health-centers/{id}/service-sites, POST /health-centers/{id}/service-definitions, POST /health-centers/{id}/scope-change-requests, POST /health-centers/{id}/board-members, POST /health-centers/{id}/fee-schedules, POST /fee-schedules/{id}/discount-tiers, POST /patients/{id}/income-verifications, POST /encounters, POST /encounters/{id}/waivers, POST /health-centers/{id}/uds-reports, POST /uds-reports/{id}/quality-measure-results, POST /health-centers/{id}/site-visit-findings, POST /site-visit-findings/{id}/corrective-action-plans"

  - priority: 8
    category: business_referential
    check: "cross-entity references belong to the same grantee: ScopeChangeRequest.target_site_id / target_service_definition_id must have health_center_id == the request's health_center_id; SiteVisitFinding.service_site_id must belong to the finding's health_center_id; an Encounter's service_site_id and service_definition_id must share one health_center_id; BoardMember.patient_id must be a Patient with at least one non-VOID Encounter at a site of that grantee"
    error_id: ERR_CROSS_GRANTEE_REFERENCE
    http_status: 409
    applies_to: "POST /health-centers/{id}/scope-change-requests, POST /health-centers/{id}/site-visit-findings, POST /health-centers/{id}/board-members, POST /encounters"

  - priority: 9
    category: business_referential
    check: "polymorphic target pairing: request_type IN {ADD_SITE, REMOVE_SITE} requires target_site_id non-null and target_service_definition_id null; request_type IN {ADD_SERVICE, REMOVE_SERVICE} requires target_service_definition_id non-null and target_site_id null"
    error_id: ERR_SCOPE_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /health-centers/{id}/scope-change-requests, POST /scope-change-requests/{id}/submit"

  - priority: 10
    category: state
    check: "OCC — expected_patient_version equals Patient.version; expected_health_center_version equals HealthCenter.version (§1.2.1)"
    error_id: "ERR_STALE_PATIENT_VERSION | ERR_STALE_HEALTH_CENTER_VERSION"
    http_status: 412
    applies_to: "POST /patients/{id}/income-verifications, POST /fee-schedules/{id}/adopt"

  - priority: 11
    category: state
    check: "the addressed row occupies a state from which the requested §1.2 transition departs"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 12
    category: state
    check: "loop caps: ScopeChangeRequest.revision_round < 3, IncomeVerification.resubmit_round < 3, CorrectiveActionPlan.submit_round < 2, UDSReport.return_round < 3"
    error_id: ERR_LOOP_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /scope-change-requests/{id}/submit, POST /income-verifications/{id}/resubmit, POST /corrective-action-plans/{id}/submit, POST /uds-reports/{id}/compute"

  - priority: 13
    category: business_safety
    check: "segregation of duties — the acting X-User-ID differs from the recorded preparer/submitter/requester of the row being adjudicated (ScopeChangeRequest.prepared_by_user_id, IncomeVerification.submitted_by_user_id, InabilityToPayWaiver.requested_by_user_id, CorrectiveActionPlan.prepared_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /scope-change-requests/{id}/decide, POST /income-verifications/{id}/verify, POST /waivers/{id}/decide, POST /corrective-action-plans/{id}/adjudicate"

  - priority: 14
    category: business_safety
    check: "a BoardChair acting on a grantee's board business must be a BoardMember row of that health_center_id whose status == SEATED (identity is entity_backed:BoardMember)"
    error_id: ERR_NOT_SEATED_BOARD_MEMBER
    http_status: 403
    applies_to: "POST /scope-change-requests/{id}/begin-review, POST /scope-change-requests/{id}/decide, POST /fee-schedules/{id}/adopt"

  - priority: 15
    category: business_safety
    check: "HealthCenter.scope_posture == OPEN — a grantee with an ESCALATED condition on its award cannot move change-in-scope work forward"
    error_id: ERR_SCOPE_CHANGE_FROZEN
    http_status: 409
    applies_to: "POST /scope-change-requests/{id}/submit, POST /scope-change-requests/{id}/begin-review, POST /scope-change-requests/{id}/decide"

  - priority: 16
    category: business_safety
    check: "documentation_type != REFUSED — a refusal to document income can never be adjudicated VERIFIED (it may only be marked INSUFFICIENT_DOCUMENTATION)"
    error_id: ERR_DOCUMENTATION_REFUSED
    http_status: 422
    applies_to: "POST /income-verifications/{id}/verify with decision == VERIFY"

  - priority: 17
    category: business_safety
    check: "inability-to-pay protection — an Encounter carrying a GRANTED InabilityToPayWaiver may not be voided with void_reason == NONPAYMENT"
    error_id: ERR_INABILITY_TO_PAY_PROTECTED
    http_status: 409
    applies_to: "POST /encounters/{id}/void"

  - priority: 18
    category: business_safety
    check: "waiver eligibility — a waiver may only be requested on an Encounter whose charge_basis == SLIDING_FEE_TIER and whose patient_charge_cents equals the pinned FeeSchedule.nominal_fee_cents (the nominal fee is the only charge the inability-to-pay policy protects)"
    error_id: ERR_WAIVER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /encounters/{id}/waivers"

  - priority: 19
    category: business_safety
    check: "HealthCenter.governance_posture == GOVERNANCE_COMPLIANT, evaluated on the PRE-transition snapshot per calculation governance_posture step G6"
    error_id: ERR_GOVERNANCE_DEFICIENT
    http_status: 409
    applies_to: "POST /scope-change-requests/{id}/decide with decision == APPROVE"

  - priority: 20
    category: business_safety
    check: "the grantee's ADOPTED FeeSchedule covering the logical clock has review_status != OUT_OF_DATE — scope may not expand while the sliding fee schedule lags the current federal poverty guidelines"
    error_id: ERR_FEE_SCHEDULE_OUT_OF_DATE
    http_status: 409
    applies_to: "POST /scope-change-requests/{id}/decide with decision == APPROVE"

  - priority: 21
    category: business_temporal
    check: "period ordering: FeeSchedule.effective_start < effective_end"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /health-centers/{id}/fee-schedules"

  - priority: 22
    category: business_temporal
    check: "term ordering: BoardMember.term_start <= term_end, and resignation_date >= term_start when resigning"
    error_id: ERR_INVALID_TERM
    http_status: 422
    applies_to: "POST /health-centers/{id}/board-members, POST /board-members/{id}/resign"

  - priority: 23
    category: business_temporal
    check: "encounter_date must not be after the logical clock (no future dates of service)"
    error_id: ERR_ENCOUNTER_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /encounters"

  - priority: 24
    category: business_temporal
    check: "FeeSchedule period exclusivity — no other ADOPTED schedule of the same grantee may overlap [effective_start, effective_end) on the HALF-OPEN convention, EXCEPT when its effective_start is exactly equal, in which case the older schedule is superseded rather than rejected. Adjacency (existing.effective_end == new.effective_start) is always allowed."
    error_id: ERR_FEE_SCHEDULE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /fee-schedules/{id}/adopt"

  - priority: 25
    category: business_temporal
    check: "board seat exclusivity — a seat_number of one grantee may be held by at most one SEATED BoardMember at any instant; terms are CLOSED intervals [term_start, term_end], so adjacency (existing.term_end == new.term_start) is itself an overlap and is REJECTED"
    error_id: ERR_BOARD_SEAT_OVERLAP
    http_status: 409
    applies_to: "POST /health-centers/{id}/board-members"

  - priority: 26
    category: business_temporal
    check: "CorrectiveActionPlan.target_completion_date must not be after the parent SiteVisitFinding.cap_due_at"
    error_id: ERR_CAP_TARGET_AFTER_DUE
    http_status: 422
    applies_to: "POST /site-visit-findings/{id}/corrective-action-plans"

  - priority: 27
    category: business_temporal
    check: "an explicitly supplied income_verification_id must have status == VERIFIED and its CLOSED window [effective_date, expires_at] must contain encounter_date"
    error_id: ERR_VERIFICATION_DOES_NOT_COVER_ENCOUNTER
    http_status: 422
    applies_to: "POST /encounters"

  - priority: 28
    category: business_constraint
    check: "global uniqueness: HealthCenter.grant_number, Patient.mrn, PovertyGuideline.guideline_year"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /health-centers, POST /patients, POST /poverty-guidelines"

  - priority: 29
    category: business_constraint
    check: "uniqueness within parent: ServiceDefinition.service_code per health_center_id, DiscountTier.tier_label and DiscountTier.sort_order per fee_schedule_id, UDSReport.reporting_year per health_center_id, QualityMeasureResult.measure_code per uds_report_id"
    error_id: ERR_DUPLICATE_CHILD_KEY
    http_status: 409
    applies_to: "POST /health-centers/{id}/service-definitions, POST /fee-schedules/{id}/discount-tiers, POST /health-centers/{id}/uds-reports, POST /uds-reports/{id}/quality-measure-results"

  - priority: 30
    category: business_constraint
    check: "conditional seat fields: seat_type == PATIENT requires patient_id non-null and expertise_category null; seat_type == NON_PATIENT requires expertise_category non-null and patient_id null, and derives_over_10pct_income_from_healthcare may only be true on a NON_PATIENT seat"
    error_id: ERR_SEAT_FIELD_MISMATCH
    http_status: 422
    applies_to: "POST /health-centers/{id}/board-members"

  - priority: 31
    category: business_constraint
    check: "conditional tier fields: discount_kind == PERCENT_DISCOUNT requires 0 < discount_pct < 1; discount_kind IN {NOMINAL, NONE} requires discount_pct null"
    error_id: ERR_TIER_DISCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /fee-schedules/{id}/discount-tiers"

  - priority: 32
    category: business_constraint
    check: "tier band well-formedness at adoption: bands sorted by sort_order ASC are also sorted by fpg_min_pct ASC, the lowest band starts at 0, each band's fpg_min_pct equals the previous band's fpg_max_pct (no gap, no overlap on the half-open convention), exactly the highest sort_order carries fpg_max_pct == null, and at least two bands exist"
    error_id: ERR_TIER_BANDS_INVALID
    http_status: 422
    applies_to: "POST /fee-schedules/{id}/adopt"

  - priority: 33
    category: business_constraint
    check: "the ServiceSite of an encounter has status == IN_SCOPE"
    error_id: ERR_SITE_NOT_IN_SCOPE
    http_status: 409
    applies_to: "POST /encounters, POST /encounters/{id}/bill"

  - priority: 34
    category: business_constraint
    check: "an ADMINISTRATIVE ServiceSite may never carry an encounter"
    error_id: ERR_ADMINISTRATIVE_SITE_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /encounters"

  - priority: 35
    category: business_constraint
    check: "the ServiceDefinition of an encounter has status == IN_SCOPE"
    error_id: ERR_SERVICE_NOT_IN_SCOPE
    http_status: 409
    applies_to: "POST /encounters"

  - priority: 36
    category: business_constraint
    check: "the fee-schedule selector returns a row — an ADOPTED FeeSchedule of the grantee covers the reference date on the half-open convention"
    error_id: ERR_NO_EFFECTIVE_FEE_SCHEDULE
    http_status: 409
    applies_to: "POST /encounters, POST /income-verifications/{id}/verify"

  - priority: 37
    category: business_constraint
    check: "the PovertyGuideline row for every guideline_year the calculation needs exists (both the SCHEDULE_YEAR and the INTAKE_YEAR variant)"
    error_id: ERR_POVERTY_GUIDELINE_MISSING
    http_status: 422
    applies_to: "POST /income-verifications/{id}/verify, POST /fee-schedules/{id}/adopt"

  - priority: 38
    category: business_constraint
    check: "in_initial_scope == true is only accepted while HealthCenter.scope_baseline_locked == false; once the Notice-of-Award baseline is locked, sites and services may only enter scope through an approved ScopeChangeRequest"
    error_id: ERR_SCOPE_BASELINE_LOCKED
    http_status: 409
    applies_to: "POST /health-centers/{id}/service-sites, POST /health-centers/{id}/service-definitions, POST /health-centers/{id}/lock-scope-baseline"

  - priority: 39
    category: business_constraint
    check: "seating this member would push seated_board_count above MAX_BOARD_SEATS (25)"
    error_id: ERR_BOARD_SEAT_LIMIT
    http_status: 409
    applies_to: "POST /health-centers/{id}/board-members"

  - priority: 40
    category: business_constraint
    check: "a UDSReport may only be submitted when computed_at is non-null and included_measure_count >= 1"
    error_id: ERR_UDS_REPORT_NOT_COMPUTED
    http_status: 409
    applies_to: "POST /uds-reports/{id}/submit"

  - priority: 41
    category: business_fiscal
    check: "FeeSchedule.nominal_fee_cents <= HealthCenter.nominal_fee_cap_cents at adoption"
    error_id: ERR_NOMINAL_FEE_ABOVE_CAP
    http_status: 422
    applies_to: "POST /fee-schedules/{id}/adopt"

  - priority: 42
    category: business_fiscal
    check: "mco_paid_cents <= Encounter.pps_encounter_rate_cents — a payer may not post more than the allowable PPS encounter rate"
    error_id: ERR_PAYMENT_EXCEEDS_PPS_RATE
    http_status: 422
    applies_to: "POST /encounters/{id}/record-payment"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------- test-driving surface (/_ namespace) ----------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. Every deadline, expiry, window and review computation in this scaffold reads the logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["no entity is mutated; subsequent requests evaluate cap_due_at, expires_at, effective windows, review_status and encounter recency against the new instant"]

  - method: POST
    path: "/_ops/compliance-sweep"
    description: "Advances the compliance epoch per calculation compliance_sweep_epoch (steps S1 -> S2 -> S3 -> S4, rows in created_at ASC order). Idempotent at a fixed clock value."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ expired_verification_count: integer, escalated_finding_count: integer, expired_fee_schedule_count: integer, recomputed_health_center_count: integer }"
    side_effects:
      - "IncomeVerification VERIFIED -> EXPIRED for every row whose expires_at <= logical clock; Patient.sliding_fee_status -> EXPIRED"
      - "SiteVisitFinding {OPEN, CAP_SUBMITTED} -> ESCALATED for CONDITION findings past cap_due_at without an ACCEPTED plan, firing the depth-5 escalation cascade"
      - "FeeSchedule review_status recomputed; ADOPTED -> EXPIRED where effective_end <= logical clock"
      - "HealthCenter counters, governance_posture, operational_status and scope_posture recomputed; HealthCenter.version increments by 1 for every grantee touched"

  # ---------- HealthCenter ---------------------------------------------------
  - method: POST
    path: "/health-centers"
    description: "Registers a Section 330 grantee."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, grant_number, pps_base_rate_cents, medicare_upper_limit_cents, "nominal_fee_cap_cents?"]
    output: HealthCenter
    side_effects: ["scope_baseline_locked = false; all counters 0; governance_posture = GOVERNANCE_DEFICIENT; operational_status = ACTIVE; scope_posture = OPEN"]

  - method: GET
    path: "/health-centers/{id}"
    description: "Reads one grantee including every derived counter and posture."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: HealthCenter
    side_effects: []

  - method: GET
    path: "/health-centers"
    description: "Lists grantees."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["grant_number?", "operational_status?", "governance_posture?", "limit?", "offset?"]
    output: HealthCenter[]
    side_effects: []

  - method: POST
    path: "/health-centers/{id}/lock-scope-baseline"
    description: "Locks the Notice-of-Award baseline scope. After this call sites and services may only enter scope through an approved ScopeChangeRequest."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: HealthCenter
    side_effects: ["sets scope_baseline_locked = true and increments HealthCenter.version by 1"]

  - method: GET
    path: "/health-centers/{id}/governance-summary"
    description: "Computed read of calculation governance_posture, exposing every intermediate the patient-majority test uses."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, ProjectOfficer]
    code: 200
    input: []
    output: "{ health_center_id: string, seated_board_count: integer, qualified_patient_seat_count: integer, non_patient_seat_count: integer, healthcare_industry_seat_count: integer, patient_seat_pct: number, governance_posture: string, version: integer }"
    side_effects: []

  # ---------- PovertyGuideline ----------------------------------------------
  - method: POST
    path: "/poverty-guidelines"
    description: "Publishes one calendar year of federal poverty guidelines. Immutable once created (no update endpoint, no version field)."
    roles: [PlatformAdmin]
    code: 201
    input: [guideline_year, base_amount_cents, increment_cents]
    output: PovertyGuideline
    side_effects: ["publishing a later guideline_year can flip every ADOPTED FeeSchedule whose fpg_year is now behind to review_status OUT_OF_DATE"]

  - method: GET
    path: "/poverty-guidelines/{id}"
    description: "Reads one published guideline year."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: PovertyGuideline
    side_effects: []

  - method: GET
    path: "/poverty-guidelines"
    description: "Lists published guideline years."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["guideline_year?", "limit?", "offset?"]
    output: PovertyGuideline[]
    side_effects: []

  # ---------- BoardMember ---------------------------------------------------
  - method: POST
    path: "/health-centers/{id}/board-members"
    description: "Seats a board member. health_center_id is taken from the path when omitted from the body."
    roles: [ComplianceOfficer]
    code: 201
    input: ["health_center_id?", seat_number, seat_type, "patient_id?", "expertise_category?", "derives_over_10pct_income_from_healthcare?", term_start, term_end]
    output: BoardMember
    side_effects:
      - "status = SEATED"
      - "evaluates patient_seat_qualified per calculation governance_posture step G2"
      - "recomputes HealthCenter.seated_board_count, patient_seat_pct and governance_posture, incrementing HealthCenter.version by 1"

  - method: GET
    path: "/board-members/{id}"
    description: "Reads one board seat holder."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: BoardMember
    side_effects: []

  - method: GET
    path: "/board-members"
    description: "Filtered list of board seats; reverse-reachability for BoardMember.health_center_id and BoardMember.patient_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["health_center_id?", "patient_id?", "status?", "seat_type?", "seat_number?", "limit?", "offset?"]
    output: BoardMember[]
    side_effects: []

  - method: POST
    path: "/board-members/{id}/resign"
    description: "Resigns a seated board member and frees the seat_number for a new term."
    roles: [ComplianceOfficer]
    code: 200
    input: [resignation_date]
    output: BoardMember
    side_effects:
      - "status SEATED -> RESIGNED; term_end truncated to resignation_date"
      - "recomputes HealthCenter.seated_board_count, patient_seat_pct and governance_posture, incrementing HealthCenter.version by 1"

  # ---------- ServiceSite ---------------------------------------------------
  - method: POST
    path: "/health-centers/{id}/service-sites"
    description: "Creates a service site. in_initial_scope == true admits the site straight to IN_SCOPE as part of the Notice-of-Award baseline and is only accepted while scope_baseline_locked == false."
    roles: [PlatformAdmin]
    code: 201
    input: ["health_center_id?", site_name, site_type, address_line, weekly_service_hours, "in_initial_scope?"]
    output: ServiceSite
    side_effects:
      - "status = PROPOSED, or IN_SCOPE with in_scope_since = logical clock when in_initial_scope == true"
      - "recomputes HealthCenter.in_scope_site_count and increments HealthCenter.version by 1 when the site entered IN_SCOPE"

  - method: GET
    path: "/service-sites/{id}"
    description: "Reads one service site."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: ServiceSite
    side_effects: []

  - method: GET
    path: "/health-centers/{id}/service-sites"
    description: "Sub-resource list of a grantee's sites; reverse-reachability for ServiceSite.health_center_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["status?", "site_type?", "limit?", "offset?"]
    output: ServiceSite[]
    side_effects: []

  - method: POST
    path: "/service-sites/{id}/suspend"
    description: "Suspends an in-scope site after an operational site visit."
    roles: [ProjectOfficer]
    code: 200
    input: []
    output: ServiceSite
    side_effects:
      - "status IN_SCOPE -> SUSPENDED"
      - "recomputes HealthCenter.in_scope_site_count and governance_posture (patient-seat qualification depends on IN_SCOPE sites), incrementing HealthCenter.version by 1"

  - method: POST
    path: "/service-sites/{id}/reinstate"
    description: "Returns a suspended site to scope."
    roles: [ProjectOfficer]
    code: 200
    input: []
    output: ServiceSite
    side_effects:
      - "status SUSPENDED -> IN_SCOPE; in_scope_since = logical clock"
      - "recomputes HealthCenter.in_scope_site_count and governance_posture, incrementing HealthCenter.version by 1"

  # ---------- ServiceDefinition --------------------------------------------
  - method: POST
    path: "/health-centers/{id}/service-definitions"
    description: "Lists a service on the scope of project. in_initial_scope == true admits it straight to IN_SCOPE and is only accepted while scope_baseline_locked == false."
    roles: [PlatformAdmin]
    code: 201
    input: ["health_center_id?", service_code, service_category, delivery_method, "in_initial_scope?"]
    output: ServiceDefinition
    side_effects:
      - "status = PENDING, or IN_SCOPE when in_initial_scope == true"
      - "recomputes HealthCenter.in_scope_service_count and increments HealthCenter.version by 1 when the service entered IN_SCOPE"

  - method: GET
    path: "/service-definitions/{id}"
    description: "Reads one scope-of-project service."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: ServiceDefinition
    side_effects: []

  - method: GET
    path: "/health-centers/{id}/service-definitions"
    description: "Sub-resource list of a grantee's services; reverse-reachability for ServiceDefinition.health_center_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["status?", "service_category?", "limit?", "offset?"]
    output: ServiceDefinition[]
    side_effects: []

  # ---------- ScopeChangeRequest -------------------------------------------
  - method: POST
    path: "/health-centers/{id}/scope-change-requests"
    description: "Drafts a change-in-scope request. The polymorphic target is a ServiceSite or a ServiceDefinition according to request_type."
    roles: [ComplianceOfficer]
    code: 201
    input: ["health_center_id?", request_type, "target_site_id?", "target_service_definition_id?", justification]
    output: ScopeChangeRequest
    side_effects: ["status = DRAFT; revision_round = 0; prepared_by_user_id = acting X-User-ID"]

  - method: GET
    path: "/scope-change-requests/{id}"
    description: "Reads one change-in-scope request."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: ScopeChangeRequest
    side_effects: []

  - method: GET
    path: "/scope-change-requests"
    description: "Filtered list; reverse-reachability for ScopeChangeRequest.health_center_id, target_site_id and target_service_definition_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["health_center_id?", "target_site_id?", "target_service_definition_id?", "status?", "request_type?", "limit?", "offset?"]
    output: ScopeChangeRequest[]
    side_effects: []

  - method: POST
    path: "/scope-change-requests/{id}/submit"
    description: "Submits a DRAFT request, or resubmits one in REVISION_REQUESTED (cycle edge, capped at revision_round 3)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ScopeChangeRequest
    side_effects:
      - "status DRAFT|REVISION_REQUESTED -> SUBMITTED; revision_round increments on the loop edge; reviewed_by_user_id cleared"
      - "increments HealthCenter.version by 1"

  - method: POST
    path: "/scope-change-requests/{id}/begin-review"
    description: "A seated BoardChair takes the request under review."
    roles: [BoardChair]
    code: 200
    input: []
    output: ScopeChangeRequest
    side_effects: ["status SUBMITTED -> UNDER_REVIEW; reviewed_by_user_id = acting X-User-ID"]

  - method: POST
    path: "/scope-change-requests/{id}/decide"
    description: "Three-way fork: APPROVE (fires the scope cascade), REQUEST_REVISION (cycle edge), DENY (terminal, no cascade)."
    roles: [BoardChair]
    code: 200
    input: [decision, "decision_note?"]
    output: ScopeChangeRequest
    side_effects:
      - "APPROVE: status -> APPROVED and the depth-5 cascade of §1.2 fires (target status, grantee counters, encounter voids on REMOVE_SITE, patient balances, wraparound receivable), incrementing HealthCenter.version by 1"
      - "REQUEST_REVISION: status -> REVISION_REQUESTED, decision_note stored, no mutation of any target"
      - "DENY: status -> DENIED, decision_note stored, no counter change"

  # ---------- FeeSchedule ---------------------------------------------------
  - method: POST
    path: "/health-centers/{id}/fee-schedules"
    description: "Drafts a sliding fee discount schedule for a half-open effective period."
    roles: [ComplianceOfficer]
    code: 201
    input: ["health_center_id?", fpg_year, effective_start, effective_end, nominal_fee_cents, "board_vote_date?"]
    output: FeeSchedule
    side_effects: ["status = DRAFT; review_status = CURRENT; last_reviewed_at = null"]

  - method: GET
    path: "/fee-schedules/{id}"
    description: "Reads one fee schedule with its recomputed review_status."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  - method: GET
    path: "/fee-schedules"
    description: "Filtered list; reverse-reachability for FeeSchedule.health_center_id and the self-referential FeeSchedule.superseded_by_fee_schedule_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["health_center_id?", "superseded_by_fee_schedule_id?", "status?", "review_status?", "fpg_year?", "limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []

  - method: POST
    path: "/fee-schedules/{id}/adopt"
    description: "A seated BoardChair adopts a DRAFT schedule under OCC on the grantee's version (§1.2.1 rule fee-schedule-adopt-stale-health-center)."
    roles: [BoardChair]
    code: 200
    input: [expected_health_center_version]
    output: FeeSchedule
    side_effects:
      - "status DRAFT -> ADOPTED; adopted_at = last_reviewed_at = logical clock; adopted_by_user_id set; reviewed_against_guideline_year = fpg_year"
      - "any ADOPTED schedule of the same grantee with an identical effective_start moves to SUPERSEDED with superseded_by_fee_schedule_id set to this schedule"
      - "recomputes review_status per calculation fee_schedule_review_status"
      - "increments HealthCenter.version by 1"

  - method: POST
    path: "/fee-schedules/{id}/annual-review"
    description: "Records the annual review of the schedule against a federal poverty guideline year, resetting the 365-day review clock."
    roles: [ComplianceOfficer]
    code: 200
    input: [reviewed_against_guideline_year]
    output: FeeSchedule
    side_effects:
      - "sets last_reviewed_at = logical clock and reviewed_against_guideline_year"
      - "recomputes review_status per calculation fee_schedule_review_status (guideline staleness still dominates elapsed days)"

  # ---------- DiscountTier -------------------------------------------------
  - method: POST
    path: "/fee-schedules/{id}/discount-tiers"
    description: "Adds a half-open FPG band to a DRAFT schedule."
    roles: [ComplianceOfficer]
    code: 201
    input: ["fee_schedule_id?", tier_label, fpg_min_pct, "fpg_max_pct?", discount_kind, "discount_pct?", sort_order]
    output: DiscountTier
    side_effects: ["band well-formedness is not enforced per-tier; the whole ladder is validated at adoption by validations priority 32"]

  - method: GET
    path: "/discount-tiers/{id}"
    description: "Reads one discount tier."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: DiscountTier
    side_effects: []

  - method: GET
    path: "/fee-schedules/{id}/discount-tiers"
    description: "Sub-resource list of a schedule's bands in sort_order ASC; reverse-reachability for DiscountTier.fee_schedule_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: DiscountTier[]
    side_effects: []

  # ---------- Patient -------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Registers a patient."
    roles: [PatientServicesRep]
    code: 201
    input: [mrn, full_name, household_size]
    output: Patient
    side_effects: ["sliding_fee_status = UNVERIFIED; patient_balance_cents = 0"]

  - method: GET
    path: "/patients/{id}"
    description: "Reads one patient including the conserved patient_balance_cents ledger and version."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "Lists patients."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["mrn?", "sliding_fee_status?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  # ---------- IncomeVerification -------------------------------------------
  - method: POST
    path: "/patients/{id}/income-verifications"
    description: "Submits an income and family size verification under OCC on the patient's version (§1.2.1 rule income-verification-create-stale-patient)."
    roles: [PatientServicesRep]
    code: 201
    input: ["patient_id?", declared_annual_income_cents, household_size, documentation_type, effective_date, expected_patient_version]
    output: IncomeVerification
    side_effects:
      - "status = SUBMITTED; resubmit_round = 0; submitted_by_user_id = acting X-User-ID"
      - "expires_at = effective_date + 365 days"
      - "increments Patient.version by 1"

  - method: GET
    path: "/income-verifications/{id}"
    description: "Reads one verification including both FPG variants and the assigned tier."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: IncomeVerification
    side_effects: []

  - method: GET
    path: "/income-verifications"
    description: "Filtered list; reverse-reachability for IncomeVerification.patient_id, assigned_discount_tier_id and the self-referential supersedes_income_verification_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["patient_id?", "assigned_discount_tier_id?", "supersedes_income_verification_id?", "status?", "limit?", "offset?"]
    output: IncomeVerification[]
    side_effects: []

  - method: POST
    path: "/income-verifications/{id}/verify"
    description: "Two-way fork adjudicated by an EligibilityVerifier who is not the submitter: VERIFY computes both FPG variants, assigns the tier and fires the depth-5 retroactive cascade; MARK_INSUFFICIENT records a reason and computes nothing."
    roles: [EligibilityVerifier]
    code: 200
    input: [decision, "insufficiency_reason?"]
    output: IncomeVerification
    side_effects:
      - "VERIFY: sets guideline_year_used, fpg_percent, uds_guideline_year_used, uds_fpg_percent, assigned_discount_tier_id, assigned_tier_label, verified_by_user_id, supersedes_income_verification_id"
      - "VERIFY: supersedes the patient's overlapping VERIFIED verification, recomputes covered BILLED/PAID encounters with the FINAL charge variant (pps_claim_status -> PENDING_ADJUSTMENT), rewrites Patient.patient_balance_cents (incrementing Patient.version by 1), recomputes wraparound_due_cents (CLAIMED -> REBILL_REQUIRED on change) and HealthCenter.wraparound_receivable_cents, incrementing HealthCenter.version by 1"
      - "MARK_INSUFFICIENT: stores insufficiency_reason, leaves every computed field null, fires no cascade"

  - method: POST
    path: "/income-verifications/{id}/resubmit"
    description: "Cycle edge INSUFFICIENT_DOCUMENTATION -> SUBMITTED, capped at resubmit_round 3."
    roles: [PatientServicesRep]
    code: 200
    input: [documentation_type, "declared_annual_income_cents?", "household_size?"]
    output: IncomeVerification
    side_effects: ["increments resubmit_round; overwrites the supplied documentation fields; clears insufficiency_reason and verified_by_user_id; submitted_by_user_id = acting X-User-ID"]

  # ---------- Encounter ----------------------------------------------------
  - method: POST
    path: "/encounters"
    description: "Records a visit. Runs the fee-schedule selector, the income-verification selector, the PROVISIONAL patient charge, the PPS encounter rate and the wraparound residual in the pinned order E1..E6."
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, service_site_id, service_definition_id, encounter_date, payer_type, gross_charge_cents, "income_verification_id?"]
    output: Encounter
    side_effects:
      - "pins fee_schedule_id, income_verification_id and pinned_discount_tier_id"
      - "sets patient_charge_cents, charge_basis, sliding_fee_applied per calculation patient_charge_cents (PROVISIONAL variant)"
      - "sets pps_encounter_rate_cents per calculation pps_encounter_rate_cents"
      - "pps_claim_status = UNBILLED; wraparound_status = NOT_APPLICABLE"
      - "increments Patient.patient_balance_cents by patient_charge_cents and increments Patient.version by 1"
      - "recomputes HealthCenter.governance_posture (a new encounter can qualify a PATIENT board seat) and increments HealthCenter.version by 1"

  - method: GET
    path: "/encounters/{id}"
    description: "Reads one encounter including both state dimensions and every pinned reference."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: Encounter
    side_effects: []

  - method: GET
    path: "/encounters"
    description: "Filtered list; collapsed reverse-reachability for all six Encounter foreign keys."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["patient_id?", "service_site_id?", "service_definition_id?", "fee_schedule_id?", "income_verification_id?", "pinned_discount_tier_id?", "pps_claim_status?", "wraparound_status?", "payer_type?", "limit?", "offset?"]
    output: Encounter[]
    side_effects: []

  - method: POST
    path: "/encounters/{id}/bill"
    description: "Bills or rebills the PPS claim. Mutates pps_claim_status only — wraparound_status is untouched."
    roles: [BillingSpecialist]
    code: 200
    input: [claim_reference]
    output: Encounter
    side_effects: ["pps_claim_status UNBILLED|PENDING_ADJUSTMENT -> BILLED; claim_reference stored"]

  - method: POST
    path: "/encounters/{id}/record-payment"
    description: "Posts the payer's payment, recomputes the wraparound residual and, for non-MCO payers, reconciles the claim."
    roles: [BillingSpecialist]
    code: 200
    input: [mco_paid_cents]
    output: Encounter
    side_effects:
      - "pps_claim_status BILLED -> PAID; mco_paid_cents stored"
      - "recomputes wraparound_due_cents; MEDICAID_MCO encounters with a positive residual move wraparound_status -> PENDING"
      - "non-MCO payers move pps_claim_status PAID -> RECONCILED in the same request"
      - "recomputes HealthCenter.wraparound_receivable_cents and increments HealthCenter.version by 1"

  - method: POST
    path: "/encounters/{id}/claim-wraparound"
    description: "Claims (or re-claims) the state wraparound payment, and with receipt_confirmed == true records its receipt. Mutates wraparound_status only, except that a confirmed receipt lets pps_claim_status PAID -> RECONCILED."
    roles: [BillingSpecialist]
    code: 200
    input: ["receipt_confirmed?"]
    output: Encounter
    side_effects:
      - "wraparound_status PENDING|REBILL_REQUIRED -> CLAIMED, or CLAIMED -> RECEIVED when receipt_confirmed == true"
      - "on RECEIVED with pps_claim_status == PAID, pps_claim_status -> RECONCILED and patient_charge_cents is frozen against further recomputation"
      - "recomputes HealthCenter.wraparound_receivable_cents and increments HealthCenter.version by 1"

  - method: POST
    path: "/encounters/{id}/void"
    description: "Compensating action: removes the encounter from every conserved quantity. Blocked for void_reason == NONPAYMENT when a GRANTED inability-to-pay waiver protects the patient."
    roles: [BillingSpecialist]
    code: 200
    input: [void_reason]
    output: Encounter
    side_effects:
      - "pps_claim_status -> VOID; charge_adjustment_cents = -(patient_charge_cents - waived_amount_cents)"
      - "decrements Patient.patient_balance_cents by (patient_charge_cents - waived_amount_cents) with zero drift and increments Patient.version by 1"
      - "wraparound_status -> NOT_APPLICABLE; recomputes HealthCenter.wraparound_receivable_cents and governance_posture, incrementing HealthCenter.version by 1"

  # ---------- InabilityToPayWaiver ----------------------------------------
  - method: POST
    path: "/encounters/{id}/waivers"
    description: "A patient services representative requests an inability-to-pay waiver of the nominal fee."
    roles: [PatientServicesRep]
    code: 201
    input: ["encounter_id?", waiver_reason]
    output: InabilityToPayWaiver
    side_effects: ["status = REQUESTED; requested_by_user_id = acting X-User-ID; waived_amount_cents = 0; no ledger mutation"]

  - method: GET
    path: "/waivers/{id}"
    description: "Reads one inability-to-pay waiver."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: InabilityToPayWaiver
    side_effects: []

  - method: GET
    path: "/encounters/{id}/waivers"
    description: "Sub-resource list of an encounter's waivers; reverse-reachability for InabilityToPayWaiver.encounter_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InabilityToPayWaiver[]
    side_effects: []

  - method: POST
    path: "/waivers/{id}/decide"
    description: "A ComplianceOfficer other than the requester grants or denies the waiver. GRANT fires the depth-3 ledger and wraparound cascade; DENY mutates nothing but the waiver."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: InabilityToPayWaiver
    side_effects:
      - "GRANT: waived_amount_cents = Encounter.patient_charge_cents, copied onto Encounter.waived_amount_cents; Patient.patient_balance_cents decremented and Patient.version incremented by 1; Encounter.wraparound_due_cents recomputed with counted_patient_portion 0; CLAIMED wraparound moves to REBILL_REQUIRED; HealthCenter.wraparound_receivable_cents recomputed and HealthCenter.version incremented by 1"
      - "DENY: status -> DENIED, waived_amount_cents stays 0, no ledger or wraparound mutation"

  # ---------- UDSReport ----------------------------------------------------
  - method: POST
    path: "/health-centers/{id}/uds-reports"
    description: "Opens the uniform data system annual report for a reporting year."
    roles: [ComplianceOfficer]
    code: 201
    input: ["health_center_id?", reporting_year]
    output: UDSReport
    side_effects: ["status = DRAFT; every aggregate 0/null; computed_at = null; return_round = 0"]

  - method: GET
    path: "/uds-reports/{id}"
    description: "Reads one UDS report with its income-distribution bands and composite quality rate."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: UDSReport
    side_effects: []

  - method: GET
    path: "/health-centers/{id}/uds-reports"
    description: "Sub-resource list of a grantee's reports; reverse-reachability for UDSReport.health_center_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["status?", "reporting_year?", "limit?", "offset?"]
    output: UDSReport[]
    side_effects: []

  - method: POST
    path: "/uds-reports/{id}/compute"
    description: "Runs calculations uds_income_distribution and uds_composite_quality_rate_pct. Also the cycle edge RETURNED -> DRAFT (capped at return_round 3)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: UDSReport
    side_effects:
      - "sets total_patient_count, the four band counts and unverified_patient_count from the INTAKE_YEAR percentages"
      - "sets rate_pct, inclusion_status and meets_benchmark on every QualityMeasureResult, then composite_quality_rate_pct and included_measure_count"
      - "sets computed_at = logical clock; status RETURNED -> DRAFT with return_round incremented"

  - method: POST
    path: "/uds-reports/{id}/submit"
    description: "Submits a computed report to the awarding agency."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: UDSReport
    side_effects: ["status DRAFT -> SUBMITTED; submitted_by_user_id set"]

  - method: POST
    path: "/uds-reports/{id}/adjudicate"
    description: "The project officer ACCEPTs (terminal) or RETURNs (cycle edge) the report."
    roles: [ProjectOfficer]
    code: 200
    input: [decision, "return_reason?"]
    output: UDSReport
    side_effects: ["ACCEPT: status -> ACCEPTED, adjudicated_by_user_id set; RETURN: status -> RETURNED, return_reason stored"]

  # ---------- QualityMeasureResult ----------------------------------------
  - method: POST
    path: "/uds-reports/{id}/quality-measure-results"
    description: "Attaches a clinical quality measure to a DRAFT report. Rates are only derived by POST /uds-reports/{id}/compute."
    roles: [ComplianceOfficer]
    code: 201
    input: ["uds_report_id?", measure_code, numerator, denominator, benchmark_pct]
    output: QualityMeasureResult
    side_effects: ["rate_pct null, inclusion_status INCLUDED, meets_benchmark null until compute runs"]

  - method: GET
    path: "/quality-measure-results/{id}"
    description: "Reads one quality measure result."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: QualityMeasureResult
    side_effects: []

  - method: GET
    path: "/uds-reports/{id}/quality-measure-results"
    description: "Sub-resource list in created_at ASC order; reverse-reachability for QualityMeasureResult.uds_report_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["inclusion_status?", "limit?", "offset?"]
    output: QualityMeasureResult[]
    side_effects: []

  # ---------- SiteVisitFinding --------------------------------------------
  - method: POST
    path: "/health-centers/{id}/site-visit-findings"
    description: "Issues an operational site visit finding. severity == CONDITION makes it escalatable by the compliance sweep."
    roles: [ProjectOfficer]
    code: 201
    input: ["health_center_id?", "service_site_id?", requirement_code, severity, finding_summary, cap_due_days]
    output: SiteVisitFinding
    side_effects: ["status = OPEN; cap_due_at = created_at + cap_due_days days on the logical clock; issued_by_user_id = acting X-User-ID"]

  - method: GET
    path: "/site-visit-findings/{id}"
    description: "Reads one finding."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: SiteVisitFinding
    side_effects: []

  - method: GET
    path: "/site-visit-findings"
    description: "Filtered list; reverse-reachability for SiteVisitFinding.health_center_id and service_site_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["health_center_id?", "service_site_id?", "status?", "severity?", "limit?", "offset?"]
    output: SiteVisitFinding[]
    side_effects: []

  # ---------- CorrectiveActionPlan ----------------------------------------
  - method: POST
    path: "/site-visit-findings/{id}/corrective-action-plans"
    description: "Drafts a corrective action plan answering a finding."
    roles: [ComplianceOfficer]
    code: 201
    input: ["site_visit_finding_id?", narrative, milestone_count, target_completion_date]
    output: CorrectiveActionPlan
    side_effects: ["status = DRAFT; submit_round = 0; prepared_by_user_id = acting X-User-ID"]

  - method: GET
    path: "/corrective-action-plans/{id}"
    description: "Reads one corrective action plan."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []

  - method: GET
    path: "/site-visit-findings/{id}/corrective-action-plans"
    description: "Sub-resource list; reverse-reachability for CorrectiveActionPlan.site_visit_finding_id."
    roles: [PlatformAdmin, ComplianceOfficer, BoardChair, EligibilityVerifier, PatientServicesRep, BillingSpecialist, ProjectOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CorrectiveActionPlan[]
    side_effects: []

  - method: POST
    path: "/corrective-action-plans/{id}/submit"
    description: "Submits a DRAFT plan, or resubmits a REJECTED one (cycle edge, capped at submit_round 2). Drives the parent finding to CAP_SUBMITTED."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["status -> SUBMITTED with submit_round incremented on the loop edge; parent SiteVisitFinding -> CAP_SUBMITTED"]

  - method: POST
    path: "/corrective-action-plans/{id}/adjudicate"
    description: "A ProjectOfficer other than the preparer ACCEPTs the plan (firing the depth-4 compensating cascade that unfreezes scope) or REJECTs it."
    roles: [ProjectOfficer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: CorrectiveActionPlan
    side_effects:
      - "ACCEPT: status -> ACCEPTED; parent finding -> RESOLVED; HealthCenter.open_condition_count recomputed; on reaching 0 operational_status -> ACTIVE and scope_posture -> OPEN; every HELD ScopeChangeRequest returns to held_from_status; every ON_HOLD target ServiceSite returns to PROPOSED with hold_reason cleared; HealthCenter.version increments by 1"
      - "REJECT: status -> REJECTED, rejection_reason stored; parent finding returns to OPEN when it had never been ESCALATED and stays ESCALATED otherwise"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth ------------------------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven roles declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_SEATED_BOARD_MEMBER
    http: 403
    condition: "a BoardChair acts on a grantee whose board it does not hold a SEATED seat on"

  # --- request shape ---------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, unknown enum member, constraint-violating number, or a system/computed field supplied by the client"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset < 0"

  # --- existence -------------------------------------------------------------
  - id: ERR_HEALTH_CENTER_NOT_FOUND
    http: 404
    condition: "no HealthCenter with the given id"
  - id: ERR_POVERTY_GUIDELINE_NOT_FOUND
    http: 404
    condition: "no PovertyGuideline with the given id"
  - id: ERR_BOARD_MEMBER_NOT_FOUND
    http: 404
    condition: "no BoardMember with the given id"
  - id: ERR_SERVICE_SITE_NOT_FOUND
    http: 404
    condition: "no ServiceSite with the given id, in the path or as target_site_id / service_site_id"
  - id: ERR_SERVICE_DEFINITION_NOT_FOUND
    http: 404
    condition: "no ServiceDefinition with the given id, in the path or as target_service_definition_id / service_definition_id"
  - id: ERR_SCOPE_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "no ScopeChangeRequest with the given id"
  - id: ERR_FEE_SCHEDULE_NOT_FOUND
    http: 404
    condition: "no FeeSchedule with the given id"
  - id: ERR_DISCOUNT_TIER_NOT_FOUND
    http: 404
    condition: "no DiscountTier with the given id"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "no Patient with the given id, in the path or as patient_id"
  - id: ERR_INCOME_VERIFICATION_NOT_FOUND
    http: 404
    condition: "no IncomeVerification with the given id, in the path or as income_verification_id"
  - id: ERR_ENCOUNTER_NOT_FOUND
    http: 404
    condition: "no Encounter with the given id"
  - id: ERR_WAIVER_NOT_FOUND
    http: 404
    condition: "no InabilityToPayWaiver with the given id"
  - id: ERR_UDS_REPORT_NOT_FOUND
    http: 404
    condition: "no UDSReport with the given id"
  - id: ERR_QUALITY_MEASURE_RESULT_NOT_FOUND
    http: 404
    condition: "no QualityMeasureResult with the given id"
  - id: ERR_SITE_VISIT_FINDING_NOT_FOUND
    http: 404
    condition: "no SiteVisitFinding with the given id"
  - id: ERR_CORRECTIVE_ACTION_PLAN_NOT_FOUND
    http: 404
    condition: "no CorrectiveActionPlan with the given id"

  # --- referential integrity -------------------------------------------------
  - id: ERR_CROSS_GRANTEE_REFERENCE
    http: 409
    condition: "a referenced row belongs to a different grantee than the operation's grantee, or a PATIENT board seat names a Patient with no non-VOID encounter at that grantee"
  - id: ERR_SCOPE_TARGET_MISMATCH
    http: 422
    condition: "request_type and the supplied target_site_id / target_service_definition_id pairing disagree"

  # --- concurrency -----------------------------------------------------------
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version does not equal Patient.version (§1.2.1 rule income-verification-create-stale-patient)"
  - id: ERR_STALE_HEALTH_CENTER_VERSION
    http: 412
    condition: "expected_health_center_version does not equal HealthCenter.version (§1.2.1 rule fee-schedule-adopt-stale-health-center)"

  # --- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the addressed row is not in a state from which the requested §1.2 transition departs, including every terminal-state lockdown and every repeat of a once-only trigger"
  - id: ERR_LOOP_LIMIT_EXCEEDED
    http: 409
    condition: "a cyclic state machine has reached its loop cap: revision_round 3, resubmit_round 3, submit_round 2 or return_round 3"

  # --- safety / compliance ---------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID equals the preparer / submitter / requester recorded on the row being adjudicated"
  - id: ERR_SCOPE_CHANGE_FROZEN
    http: 409
    condition: "HealthCenter.scope_posture == CHANGE_FROZEN because an ESCALATED condition sits on the award"
  - id: ERR_DOCUMENTATION_REFUSED
    http: 422
    condition: "decision == VERIFY on a verification whose documentation_type == REFUSED"
  - id: ERR_INABILITY_TO_PAY_PROTECTED
    http: 409
    condition: "void_reason == NONPAYMENT on an Encounter carrying a GRANTED InabilityToPayWaiver"
  - id: ERR_WAIVER_NOT_ELIGIBLE
    http: 422
    condition: "a waiver is requested on an Encounter whose charge_basis != SLIDING_FEE_TIER or whose patient_charge_cents differs from the pinned FeeSchedule.nominal_fee_cents"
  - id: ERR_GOVERNANCE_DEFICIENT
    http: 409
    condition: "APPROVE on a change-in-scope request while the pre-transition governance_posture is GOVERNANCE_DEFICIENT"
  - id: ERR_FEE_SCHEDULE_OUT_OF_DATE
    http: 409
    condition: "APPROVE on a change-in-scope request while the grantee's effective FeeSchedule has review_status == OUT_OF_DATE"

  # --- temporal --------------------------------------------------------------
  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "FeeSchedule.effective_start >= effective_end"
  - id: ERR_INVALID_TERM
    http: 422
    condition: "BoardMember.term_start > term_end, or resignation_date < term_start"
  - id: ERR_ENCOUNTER_DATE_IN_FUTURE
    http: 422
    condition: "encounter_date is after the logical clock"
  - id: ERR_FEE_SCHEDULE_PERIOD_OVERLAP
    http: 409
    condition: "adoption would leave two ADOPTED schedules of one grantee overlapping on [effective_start, effective_end) with different effective_start values; adjacency (end == next start) is allowed and an identical effective_start supersedes instead"
  - id: ERR_BOARD_SEAT_OVERLAP
    http: 409
    condition: "a seat_number of one grantee would be held by two SEATED members whose CLOSED terms touch or overlap; adjacency (existing.term_end == new.term_start) is itself an overlap"
  - id: ERR_CAP_TARGET_AFTER_DUE
    http: 422
    condition: "CorrectiveActionPlan.target_completion_date is after the parent finding's cap_due_at"
  - id: ERR_VERIFICATION_DOES_NOT_COVER_ENCOUNTER
    http: 422
    condition: "an explicitly supplied income_verification_id is not VERIFIED or its CLOSED window does not contain encounter_date"

  # --- constraints -----------------------------------------------------------
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "HealthCenter.grant_number, Patient.mrn or PovertyGuideline.guideline_year already exists"
  - id: ERR_DUPLICATE_CHILD_KEY
    http: 409
    condition: "service_code, tier_label, sort_order, reporting_year or measure_code already exists within the same parent"
  - id: ERR_SEAT_FIELD_MISMATCH
    http: 422
    condition: "seat_type and the patient_id / expertise_category / derives_over_10pct_income_from_healthcare combination disagree"
  - id: ERR_TIER_DISCOUNT_MISMATCH
    http: 422
    condition: "discount_kind and discount_pct disagree"
  - id: ERR_TIER_BANDS_INVALID
    http: 422
    condition: "at adoption the tier ladder has a gap, an overlap, a misordered sort_order, no unbounded top band, more than one unbounded band, fewer than two bands, or a lowest band not starting at 0"
  - id: ERR_SITE_NOT_IN_SCOPE
    http: 409
    condition: "the encounter's ServiceSite is not IN_SCOPE"
  - id: ERR_ADMINISTRATIVE_SITE_NOT_BILLABLE
    http: 422
    condition: "the encounter's ServiceSite has site_type == ADMINISTRATIVE"
  - id: ERR_SERVICE_NOT_IN_SCOPE
    http: 409
    condition: "the encounter's ServiceDefinition is not IN_SCOPE"
  - id: ERR_NO_EFFECTIVE_FEE_SCHEDULE
    http: 409
    condition: "no ADOPTED FeeSchedule of the grantee covers the reference date on the half-open convention"
  - id: ERR_POVERTY_GUIDELINE_MISSING
    http: 422
    condition: "a PovertyGuideline row for a guideline_year the calculation requires (SCHEDULE_YEAR or INTAKE_YEAR) has not been published"
  - id: ERR_SCOPE_BASELINE_LOCKED
    http: 409
    condition: "in_initial_scope == true after scope_baseline_locked became true, or a second lock-scope-baseline call"
  - id: ERR_BOARD_SEAT_LIMIT
    http: 409
    condition: "seating this member would push seated_board_count above 25"
  - id: ERR_UDS_REPORT_NOT_COMPUTED
    http: 409
    condition: "submit on a report whose computed_at is null or whose included_measure_count is 0"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_NOMINAL_FEE_ABOVE_CAP
    http: 422
    condition: "FeeSchedule.nominal_fee_cents exceeds HealthCenter.nominal_fee_cap_cents at adoption"
  - id: ERR_PAYMENT_EXCEEDS_PPS_RATE
    http: 422
    condition: "mco_paid_cents exceeds Encounter.pps_encounter_rate_cents"

# =============================================================================
# §1.7 RBAC Matrix   (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Operator of the compliance platform: registers grantees, publishes federal poverty guidelines, establishes the Notice-of-Award baseline scope listing, and drives the logical clock and the compliance sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /health-centers"
      - "POST /poverty-guidelines"
      - "POST /health-centers/{id}/service-sites"
      - "POST /health-centers/{id}/service-definitions"
      - "POST /health-centers/{id}/lock-scope-baseline"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/compliance-sweep"
    shared_operations:
      - "every GET read endpoint"

  - name: ComplianceOfficer
    description: "Grantee-side Section 330 compliance staff: prepares change-in-scope requests, drafts fee schedules and their tier ladders, seats and resigns board members, decides inability-to-pay waivers, and prepares corrective action plans and UDS reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /health-centers/{id}/board-members"
      - "POST /board-members/{id}/resign"
      - "POST /health-centers/{id}/scope-change-requests"
      - "POST /scope-change-requests/{id}/submit"
      - "POST /health-centers/{id}/fee-schedules"
      - "POST /fee-schedules/{id}/discount-tiers"
      - "POST /fee-schedules/{id}/annual-review"
      - "POST /waivers/{id}/decide"
      - "POST /health-centers/{id}/uds-reports"
      - "POST /uds-reports/{id}/quality-measure-results"
      - "POST /uds-reports/{id}/compute"
      - "POST /uds-reports/{id}/submit"
      - "POST /site-visit-findings/{id}/corrective-action-plans"
      - "POST /corrective-action-plans/{id}/submit"
    shared_operations:
      - "every GET read endpoint"
      - "GET /health-centers/{id}/governance-summary"

  - name: BoardChair
    description: "Chair of the patient-majority governing board. Acts only on a grantee where the acting X-User-ID is a SEATED BoardMember row of that grantee, and may never decide a request it prepared."
    identity: "entity_backed:BoardMember"
    exclusive_operations:
      - "POST /scope-change-requests/{id}/begin-review"
      - "POST /scope-change-requests/{id}/decide"
      - "POST /fee-schedules/{id}/adopt"
    shared_operations:
      - "every GET read endpoint"
      - "GET /health-centers/{id}/governance-summary"

  - name: EligibilityVerifier
    description: "Adjudicates income and family size documentation. Segregation of duties: may never verify a submission it made as a PatientServicesRep."
    identity: "opaque"
    exclusive_operations:
      - "POST /income-verifications/{id}/verify"
    shared_operations:
      - "every GET read endpoint"

  - name: PatientServicesRep
    description: "Front-desk patient services: registers patients, submits and resubmits income verifications, and requests inability-to-pay waivers."
    identity: "opaque"
    exclusive_operations:
      - "POST /patients"
      - "POST /patients/{id}/income-verifications"
      - "POST /income-verifications/{id}/resubmit"
      - "POST /encounters/{id}/waivers"
    shared_operations:
      - "every GET read endpoint"

  - name: BillingSpecialist
    description: "Owns the encounter and both of its state dimensions: records visits, bills the PPS claim, posts payments, claims state wraparound payments, and voids encounters."
    identity: "opaque"
    exclusive_operations:
      - "POST /encounters"
      - "POST /encounters/{id}/bill"
      - "POST /encounters/{id}/record-payment"
      - "POST /encounters/{id}/claim-wraparound"
      - "POST /encounters/{id}/void"
    shared_operations:
      - "every GET read endpoint"

  - name: ProjectOfficer
    description: "Awarding-agency project officer: issues operational site visit findings, suspends and reinstates sites, adjudicates corrective action plans and UDS reports. May never accept a plan it prepared."
    identity: "opaque"
    exclusive_operations:
      - "POST /health-centers/{id}/site-visit-findings"
      - "POST /service-sites/{id}/suspend"
      - "POST /service-sites/{id}/reinstate"
      - "POST /corrective-action-plans/{id}/adjudicate"
      - "POST /uds-reports/{id}/adjudicate"
    shared_operations:
      - "every GET read endpoint"
      - "GET /health-centers/{id}/governance-summary"
