              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/listings/${lst_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/listings/${lst_id}/listing-decision"
