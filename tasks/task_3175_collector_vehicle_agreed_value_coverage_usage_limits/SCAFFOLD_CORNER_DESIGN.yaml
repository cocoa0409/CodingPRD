scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: member_creation_defaults_status_active
        claim_type: defaults
        grounds: ['entities.Member.fields.status']
        distinguishing_aspect: "Member created without an explicit status starts in ACTIVE (system default)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "Rae", email: "rae@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { st: $.data.status, ver: $.data.version }
          assert:
            - "Member.status == ACTIVE (default applied)"
            - "Member.version == 1"
      - name: vehicle_creation_computed_fields_initialized
        claim_type: computed_fields
        grounds: ['entities.Vehicle.fields.documentation_status', 'entities.Vehicle.fields.accepted_photo_count']
        distinguishing_aspect: "Vehicle created with no photos has documentation_status INCOMPLETE and accepted_photo_count 0 regardless of any client-sent values."
        test_recipe:
          setup: ["Member exists"]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Sam", email: "sam@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "VIN100", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { doc: $.data.documentation_status, cnt: $.data.accepted_photo_count, st: $.data.status }
          assert:
            - "documentation_status == INCOMPLETE"
            - "accepted_photo_count == 0"
            - "status == REGISTERED (initial state)"
      - name: vehicle_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ['entities.Vehicle.fields.vehicle_class', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "vehicle_class must be one of the four declared enum members; a bogus value is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Member exists"]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Tom", email: "tom@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "VIN101", year: 1970, make: "Ford", model: "Mustang", vehicle_class: SUPERCAR, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (400)"
      - name: member_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds: ['entities.Member.fields.email', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "POST /members without email is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "NoEmail", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (400)"
      - name: get_vehicle_not_found_returns_404
        claim_type: not_found
        grounds: ['errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET on a non-existent vehicle id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vehicles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"
      - name: members_list_pagination_envelope
        claim_type: listing
        grounds: ['response_envelope.pagination_fields']
        distinguishing_aspect: "GET /members with limit=1 offset=0 returns pagination fields total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["two members exist"]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "P1", email: "p1@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { full_name: "P2", email: "p2@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
          trigger:
            - call: "GET /members"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response contains data array of length 1, total_count == 2, has_more == true"
      - name: duplicate_vin_rejected
        claim_type: type_constraints
        grounds: ['entities.Vehicle.fields.vin', 'errors[ERR_DUPLICATE_VIN]']
        distinguishing_aspect: "VIN uniqueness is enforced across all vehicles."
        test_recipe:
          setup: ["one vehicle with VIN DUP1 exists"]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Uma", email: "uma@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "DUP1", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "DUP1", year: 1971, make: "Ford", model: "Torino", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_VIN (409)"
      - name: vehicle_child_requires_owning_member
        claim_type: parent_relationships
        grounds: ['entities.Vehicle.fields.member_id']
        distinguishing_aspect: "A Member acting with another member's X-User-ID cannot register vehicles 'as' that member; ownership is bound to the acting member."
        test_recipe:
          setup: ["members A and B exist"]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "A", email: "a2@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { ma: $.data.id }
            - call: "POST /members"
              payload: { full_name: "B", email: "b2@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { mb: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "VIN102", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${ma}"
              captures: { v_owner: $.data.member_id }
          assert:
            - "Vehicle.member_id == ${ma} (ownership derived from X-User-ID, not spoofable)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: guide_publish_from_published_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.ValuationGuide', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Publishing an already-PUBLISHED guide is an invalid transition -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Guide with one entry, published"]
          setup_api_calls:
            - call: "POST /valuation-guides"
              payload: { edition: "2026-Q1", effective_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /valuation-guides/${g_id}/entries"
              payload: { vehicle_class: CLASSIC, make: "Ford", year_min: 1965, year_max: 1972, base_value_cents: 3000000 }
              as: PlatformAdmin
            - call: "POST /valuation-guides/${g_id}/publish"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /valuation-guides/${g_id}/publish"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
      - name: valuation_terminal_reject_lockdown
        claim_type: terminal_state_lockdown
        grounds: ['state_machines.Valuation']
        distinguishing_aspect: "A REJECTED valuation accepts no further transitions: propose/approve/revise all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["member, vehicle, published guide; valuation PROPOSED then REJECTED"]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Val", email: "val@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN103", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /valuation-guides"
              payload: { edition: "2026-Q3", effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /valuation-guides/${g_id}/entries"
              payload: { vehicle_class: CLASSIC, make: "Ford", year_min: 1965, year_max: 1972, base_value_cents: 3000000 }
              as: PlatformAdmin
            - call: "POST /valuation-guides/${g_id}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /vehicles/${v_id}/valuations"
              payload: { method: GUIDE_TOOL, proposed_agreed_value_cents: 3000000, expected_vehicle_version: "${v_ver}" }
              as: Underwriter
              captures: { val_id: $.data.id }
            - call: "POST /valuations/${val_id}/propose"
              payload: {}
              as: Underwriter
            - call: "POST /valuations/${val_id}/reject"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /valuations/${val_id}/approve"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (REJECTED is terminal)"
      - name: photo_accept_side_effect_completes_documentation
        claim_type: side_effect_execution
        grounds: ['state_machines.VehiclePhoto.SUBMITTED_to_ACCEPTED']
        distinguishing_aspect: "Accepting the 8th distinct photo type flips documentation_status to COMPLETE (7 of 8 stays INCOMPLETE)."
        test_recipe:
          setup: ["member, vehicle; 7 photo types submitted and accepted"]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Wes", email: "wes@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN104", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: FRONT, image_ref: "img://f", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_front: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: REAR, image_ref: "img://r", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_rear: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: DRIVER_SIDE, image_ref: "img://ds", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_ds: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: PASSENGER_SIDE, image_ref: "img://ps", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_ps: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: INTERIOR, image_ref: "img://in", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ph_in: $.data.id }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: ENGINE, image_ref: "img://en", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
