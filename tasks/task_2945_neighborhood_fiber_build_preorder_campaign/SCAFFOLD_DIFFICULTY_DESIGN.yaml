# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2945 — Neighborhood Fiber Build & Preorder Campaign
#
# 9 rule_ids, 19 instances (2 each, 3 for combinatorial_formula). Every instance grounds in elements already declared in
# SCAFFOLD.yaml §1.1–§1.7; deleting this file leaves the scaffold's behavior identical.
# Every numeric assert literal below was computed by executing the §1.3 formula in code.
# Every chain starts from an empty database and pins the logical clock explicitly.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_rate_diverge_on_undetermined_address
        grounds:
          - calculations.zone_prereg_rate
          - entities.BuildZone.fields.prereg_rate_pct
          - entities.BuildZone.fields.final_rate_pct
          - state_machines.BuildZone.campaign_status.PREREG_OPEN_to_NOT_QUALIFIED
          - endpoints["POST /campaigns/{id}/qualification-run"]
        distinguishing_aspect: |
          The PROVISIONAL variant counts the UNDETERMINED address and reports prereg_rate_pct
          10.00 on a 10.00 threshold, while the FINAL variant run by qualification-run drops that
          same address and reports final_rate_pct 5.00, so identical data qualifies provisionally
          and fails finally on the BuildZone entity domain.
        test_recipe:
          setup:
            - "Campaign with default_threshold_pct 10.00 and deposit_amount_cents 1000, preregistration closing 2026-09-30T23:59:00Z."
            - "One BuildZone with household_count 20 and threshold_pct 10.00."
            - "Two SINGLE_FAMILY addresses: the first determined SERVICEABLE, the second left UNDETERMINED."
            - "One PENDING preorder at each address, each with a HELD 1000-cent deposit."
            - "Logical clock moved to 2026-10-01T00:00:00Z, past the zone's prereg_deadline_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000, max_deadline_extensions: 2, extension_grant_days: 30, claim_filing_window_days: 45, restoration_sla_days: 7, late_filing_factor: 0.60 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 20, threshold_pct: 10.00, required_permit_types: ["ROW"], max_concurrent_bury_ops: 2 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 100 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "2 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 140 }
              as: ProgramManager
              captures: { a2: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "SERVICEABLE" }
              as: ProgramManager
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Ben Ortiz", email: "ben@example.com", phone: "+13035550102", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct2: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv1: $.data.version }
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", plan_tier: "BASIC_300", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
              captures: { p1: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv2: $.data.version }
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a2}", account_id: "${acct2}", plan_tier: "BASIC_300", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv2}" }
              as: Subscriber
              as_user_id: "${acct2}"
              captures: { p2: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { rate_before: $.data.prereg_rate_pct, count_before: $.data.provisional_qualifying_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /campaigns/${camp}/qualification-run"
              payload: {}
              as: ProgramManager
          assert:
            - "${rate_before} == 10.00"
            - "${count_before} == 2"
            - "BuildZone.${z1}.final_rate_pct == 5.00"
            - "BuildZone.${z1}.final_qualifying_count == 1"
            - "BuildZone.${z1}.campaign_status == NOT_QUALIFIED"
            - "Preorder.${p1}.preorder_status == LAPSED"
            - "Preorder.${p1}.lapse_reason == ZONE_NOT_QUALIFIED"
            - "Preorder.${p2}.preorder_status == LAPSED"
            - "Preorder.${p1}.deposit_status == REFUNDED"
            - "Preorder.${p2}.deposit_status == REFUNDED"
            - "Account.${acct1}.deposit_held_cents == 0"
            - "Account.${acct2}.deposit_held_cents == 0"
            - "ServiceAddress.${a2}.serviceability == NOT_SERVICEABLE"
            - "ServiceAddress.${a2}.not_serviceable_reason == BUILD_NOT_QUALIFIED"

