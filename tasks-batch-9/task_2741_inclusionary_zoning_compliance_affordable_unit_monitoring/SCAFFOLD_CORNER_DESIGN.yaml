      - name: restriction_and_release_guards_across_tenure_agreement_and_live_resale
        claim_type: violation_to_error
        grounds:
          - validations.priority_10
          - validations.priority_11
          - validations.priority_53
          - validations.priority_54
          - errors[ERR_AGREEMENT_NOT_RECORDED]
          - errors[ERR_RESTRICTION_TENURE_MISMATCH]
          - errors[ERR_UNIT_NOT_RESTRICTED]
          - errors[ERR_RESALE_IN_PROGRESS]
        distinguishing_aspect: |
          The deed-restriction lifecycle is fenced by four rules that all look like "wrong state"
          but read four different rows. ERR_AGREEMENT_NOT_RECORDED is reachable only through a unit
          whose agreement_id points at a SECOND, still-DRAFT agreement of the same project, since
          the project itself is already AGREEMENT_RECORDED. ERR_RESTRICTION_TENURE_MISMATCH fires
          on a RENTAL unit whose agreement IS recorded, so priority 10 passes first.
          ERR_UNIT_NOT_RESTRICTED fires on refinance-review for that same RENTAL unit, ahead of the
          fiscal LTV check at priority 45. ERR_RESALE_IN_PROGRESS blocks releasing a restriction
          while a SUBMITTED transaction is live, and the release succeeds the moment nothing is live.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (R-2, 20 units, approval 2026-01-15, dev-1) screened SUBJECT, ONSITE elected; agreement A1 recorded under DOC-RG-0001 and a second agreement A2 of the SAME project left in DRAFT."
            - "Units: RG-101 OWNERSHIP 2br under A1 with its restriction recorded at 32500000; RG-201 RENTAL 2br under A1 with no restriction; RG-301 OWNERSHIP 2br under the DRAFT agreement A2."
            - "Household H1 (size 3, income 6000000) certified into RG-101 at contract_rent_cents 0, so the unit is OCCUPIED by H1."
