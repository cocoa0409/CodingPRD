# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Furnished & Mid-Term Housing — 9 Difficulty Rules x 2 instances = 18.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: booking_rent_provisional_vs_final
        grounds:
          - calculations.booking_rent
          - entities.Booking.fields.rent_cents
          - state_machines.Booking.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Booking rent domain: PROVISIONAL (monthly_rate/30 * term) and FINAL
          (calendar per-month proration) yield different rent_cents for the same
          booking [2026-06-15,2026-07-15] at rate 300000 — 300000 vs 295484.
        test_recipe:
          setup:
            - "Verified host (payout VERIFIED), verified tenant, unit LISTED at monthly_rate 300000, cleaning_included true, deposit 0"
            - "Booking [2026-06-15,2026-07-15] (term 30) created, confirmed, activated; clock at 2026-07-15"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host A", email: "hostA@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse A", email: "nurseA@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docA" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U1", address: "1 St", monthly_rate_cents: 300000, cleaning_included: true, deposit_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-15", end_date: "2026-07-15" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id, rent_prov: $.data.rent_cents }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "COMPLETED" }
              as: PlatformAdmin
              captures: { rent_final: $.data.rent_cents }
          assert:
            - "captured rent_prov == 300000 (PROVISIONAL at creation)"
            - "Booking.${booking_id}.rent_cents == 295484 after COMPLETED (FINAL)"
            - "Booking.${booking_id}.rent_basis == FINAL"
            - "300000 != 295484 — the two variants diverge"

      - name: payout_net_provisional_vs_final
        grounds:
          - calculations.payout_net
          - entities.Payout.fields.net_cents
          - state_machines.Payout.PENDING_to_SCHEDULED
        distinguishing_aspect: |
          Host payout domain (distinct from Booking rent): Payout.net_cents is
          272800 while PROVISIONAL (fee on provisional gross 310000) and 266555
          when FINAL after booking completion (fee on final gross 302903) for
          booking [2026-08-10,2026-09-10] at rate 300000.
        test_recipe:
          setup:
            - "Verified host, verified tenant, unit LISTED at rate 300000, cleaning_included true, deposit 0"
            - "Booking [2026-08-10,2026-09-10] (term 31) confirmed -> Payout PENDING with PROVISIONAL net"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host B", email: "hostB@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse B", email: "nurseB@x.com", tenant_type: "RELOCATION" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docB" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U2", address: "2 St", monthly_rate_cents: 300000, cleaning_included: true, deposit_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-08-10", end_date: "2026-09-10" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /payouts?booking_id=${booking_id}"
              payload: {}
              as: PlatformAdmin
              captures: { net_prov: "$.data[0].net_cents", basis_prov: "$.data[0].payout_basis" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "COMPLETED" }
              as: PlatformAdmin
            - call: "GET /payouts?booking_id=${booking_id}"
              payload: {}
              as: PlatformAdmin
              captures: { net_final: "$.data[0].net_cents", basis_final: "$.data[0].payout_basis" }
          assert:
            - "captured net_prov == 272800 and basis_prov == PROVISIONAL"
            - "captured net_final == 266555 and basis_final == FINAL"
            - "272800 != 266555 — payout net variants diverge on a different entity domain than booking rent"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: platform_fee_tiered_with_nested_cap
        grounds:
          - calculations.platform_fee
          - entities.Payout.fields.platform_fee_cents
          - state_machines.Booking.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (gross_rent_cents, term_days, utilities_included),
          tiered rate selection (term 90 -> 0.08) plus nested min(MAX_FEE,
          max(MIN_FEE, raw)); raw 240000 is clamped to the 200000 cap.
        test_recipe:
          setup:
            - "Verified host, verified tenant, unit LISTED at rate 1000000, utilities_included false, cleaning_included true"
            - "Booking [2026-06-01,2026-08-30] (term 90) confirmed -> Payout created"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host C", email: "hostC@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse C", email: "nurseC@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docC" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U3", address: "3 St", monthly_rate_cents: 1000000, utilities_included: false, cleaning_included: true, deposit_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-08-30" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
          trigger:
            - call: "GET /payouts?booking_id=${booking_id}"
              payload: {}
              as: PlatformAdmin
              captures: { fee: "$.data[0].platform_fee_cents", gross: "$.data[0].gross_rent_cents" }
          assert:
            - "captured gross == 3000000 (provisional rent 3000000 + 0 cleaning)"
            - "captured fee == 200000 (raw = round(3000000 * 0.08) = 240000, clamped by min(MAX_FEE_CENTS=200000, ...))"

      - name: booking_rent_rounding_order_pinned
        grounds:
          - calculations.booking_rent
          - entities.Booking.fields.rent_cents
          - state_machines.Booking.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Mode (b): FINAL rent pins round-per-calendar-month-then-sum. Booking
          [2026-02-05,2026-03-20] at rate 200000 yields 294010 (Feb 171429 +
          Mar 122581), which differs from sum-then-round (294009).
        test_recipe:
          setup:
            - "Verified host, verified tenant, unit LISTED at rate 200000, cleaning_included true, deposit 0"
            - "Booking [2026-02-05,2026-03-20] (term 43) confirmed then activated; default clock 2026-05-01 is already past end_date"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host D", email: "hostD@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse D", email: "nurseD@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docD" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U4", address: "4 St", monthly_rate_cents: 200000, cleaning_included: true, deposit_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-02-05", end_date: "2026-03-20" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id, rent_prov: $.data.rent_cents }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "COMPLETED" }
              as: PlatformAdmin
              captures: { rent_final: $.data.rent_cents }
          assert:
            - "captured rent_prov == 286667 (provisional 30-day convention)"
            - "Booking.${booking_id}.rent_cents == 294010 (round each of Feb 171429 and Mar 122581, then sum)"
            - "294010 != 294009 — sum-then-round would give 294009; the scaffold pins round-per-month-then-sum"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: damage_claim_dispute_revise_cycle
        grounds:
          - state_machines.DamageClaim.FILED_to_DISPUTED
          - state_machines.DamageClaim.DISPUTED_to_FILED
          - entities.DamageClaim.fields.claimed_cents
        distinguishing_aspect: |
          DamageClaim is cyclic: FILED -> DISPUTED (tenant) -> FILED (host revise)
          returns to a non-terminal state with a revised claimed_cents; the cycle
          lives on DamageClaim (a different entity than the Booking branch).
        test_recipe:
          setup:
            - "Verified host, verified tenant, unit LISTED deposit 150000; booking [2026-06-01,2026-07-01] confirmed -> Deposit HELD; claim FILED for 50000"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host E", email: "hostE@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse E", email: "nurseE@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docE" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U5", address: "5 St", monthly_rate_cents: 300000, cleaning_included: true, deposit_cents: 150000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /deposits?booking_id=${booking_id}"
              payload: {}
              as: PlatformAdmin
              captures: { dep_id: "$.data[0].id", dep_v: "$.data[0].version" }
            - call: "POST /damage-claims"
              payload: { deposit_id: "${dep_id}", expected_deposit_version: "${dep_v}", claimed_cents: 50000, description: "wall" }
              as: Host
              as_user_id: "${host_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /damage-claims/${claim_id}/transitions"
              payload: { to_status: "DISPUTED", tenant_response: "I dispute" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { st1: $.data.status }
            - call: "POST /damage-claims/${claim_id}/transitions"
              payload: { to_status: "FILED", claimed_cents: 30000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { st2: $.data.status, claimed2: $.data.claimed_cents }
          assert:
            - "captured st1 == DISPUTED after tenant dispute"
            - "captured st2 == FILED after host revise (cycle back to FILED)"
            - "captured claimed2 == 30000 (revised claim amount)"

      - name: booking_confirm_vs_decline_branch
        grounds:
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - state_machines.Booking.REQUESTED_to_DECLINED
          - entities.Deposit.fields.booking_id
        distinguishing_aspect: |
          Booking forks REQUESTED -> {CONFIRMED, DECLINED} with divergent side
          effects: CONFIRMED spawns Deposit + Payout + TaxAssessment; DECLINED
          spawns none — branching on Booking (different entity than DamageClaim).
        test_recipe:
          setup:
            - "Verified host, verified tenant, two LISTED units; booking A on unit1 and booking B on unit2 both REQUESTED"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host F", email: "hostF@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse F", email: "nurseF@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docF" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U6a", address: "6a St", monthly_rate_cents: 300000, cleaning_included: true, deposit_cents: 100000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit1_id: $.data.id }
            - call: "POST /units/${unit1_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U6b", address: "6b St", monthly_rate_cents: 300000, cleaning_included: true, deposit_cents: 100000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit2_id: $.data.id }
            - call: "POST /units/${unit2_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit1_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_a: $.data.id }
            - call: "POST /bookings"
              payload: { unit_id: "${unit2_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_b: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_a}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${booking_b}/transitions"
              payload: { to_status: "DECLINED" }
              as: Host
              as_user_id: "${host_id}"
          assert:
            - "Booking.${booking_a}.status == CONFIRMED; GET /deposits?booking_id=${booking_a} total_count == 1; GET /payouts?booking_id=${booking_a} total_count == 1; GET /tax-assessments?booking_id=${booking_a} total_count == 1"
            - "Booking.${booking_b}.status == DECLINED; GET /deposits?booking_id=${booking_b} total_count == 0; GET /payouts?booking_id=${booking_b} total_count == 0; GET /tax-assessments?booking_id=${booking_b} total_count == 0"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: damage_approval_depth3_cascade
        grounds:
          - state_machines.DamageClaim.FILED_to_APPROVED
          - entities.Deposit.fields.forfeited_cents
          - entities.Payout.fields.deposit_adjustment_cents
          - entities.Host.fields.projected_payout_cents
        distinguishing_aspect: |
          Depth-3 chain from DamageClaim.APPROVED: hop1 Deposit.forfeited/held,
          hop2 Payout.deposit_adjustment/net (caused by the deposit change),
          hop3 Host.projected_payout_cents (caused by the payout change):
          264000 -> 314000.
        test_recipe:
          setup:
            - "Verified host, verified tenant, unit LISTED rate 300000 cleaning_included true deposit 150000"
            - "Booking [2026-06-01,2026-07-01] confirmed -> Deposit HELD 150000, Payout PENDING net 264000, Host.projected 264000; claim FILED 50000"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host G", email: "hostG@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse G", email: "nurseG@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docG" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U7", address: "7 St", monthly_rate_cents: 300000, cleaning_included: true, utilities_included: false, deposit_cents: 150000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /deposits?booking_id=${booking_id}"
              payload: {}
              as: PlatformAdmin
              captures: { dep_id: "$.data[0].id", dep_v: "$.data[0].version" }
            - call: "POST /damage-claims"
              payload: { deposit_id: "${dep_id}", expected_deposit_version: "${dep_v}", claimed_cents: 50000, description: "carpet" }
              as: Host
