  - rule_id: resource_temporal_overlap
    instances:
      - name: reviewer_window_overlap_uses_travel_buffer_on_both_sides
        grounds:
          - validations[priority=22]
          - entities.ExternalReviewer.fields.travel_buffer_hours
          - entities.ReviewerVisit.fields.window_start_at
          - entities.ReviewerVisit.fields.window_end_at
        distinguishing_aspect: |
          The same reviewer is booked at two institutions. The requested window
          starts 2026-08-24T16:00:00Z, almost two clear days after the existing
          visit's raw window ends at 2026-08-22T17:00:00Z, so on the raw instants
          there is no overlap at all. It is refused because the existing window is
          first extended by travel_buffer_hours (48) on BOTH sides, pushing its
          effective end to 2026-08-24T17:00:00Z. Shifting the request one hour
          later to start exactly at that buffered boundary is accepted, because
          the windows are half-open and touching windows do not overlap. The pair
          pins both the buffer and the half-open geometry in one instance.
        test_recipe:
          setup:
            - "One ExternalReviewer with travel_buffer_hours 48 and no declared conflicts."
            - "Three separate programs (HIST-BA, PHIL-BA, CLAS-BA), each with its own accepted self-study, so each cycle is in SELF_STUDY_ACCEPTED and each can host a visit; the capacity aggregate at priority 23 can never fire because no program hosts more than one visit."
            - "One existing SCHEDULED visit for that reviewer on the HIST-BA cycle over [2026-08-20T09:00:00Z, 2026-08-22T17:00:00Z), whose buffered window is [2026-08-18T09:00:00Z, 2026-08-24T17:00:00Z)."
          setup_api_calls:
