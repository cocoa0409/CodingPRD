# =============================================================================
# Vehicle Service Contract & F&I Product Admin — benchmark seed tables (v1)
# =============================================================================

scenario: |
  Vehicle Service Contract & F&I Product Admin (Endurance/CARCHEX style):
  coverage plan & eligible-vehicle/mileage tiers, contract sale & financing,
  claim adjudication & labor-time/parts, repair-facility authorization &
  direct pay, deductible & rental/towing benefit, cancellation & pro-rata
  refund, GAP/ancillary bundling, reinsurance/loss reserve.

domain_name: vehicle-service-contract
api_prefix: ""

# Difficulty band: Expert (§0.4).
#   12 entities, 30+ endpoints, 27 error codes, 4 calculation rules (3+ with
#   variants), 5 state machines (cycles + parallel dimensions + branching).
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # pro-rata refund: mileage-basis vs time-basis
    - cascading_side_effects          # claim pay -> reserve release -> reinsurance ledger
    - optimistic_concurrency          # OCC on Contract.version for direct-pay disbursement
    - rate_threshold_triggers         # eligibility mileage tiers, deductible application

  entity_topology: flat
  # Peer entities (Contract, Claim, RepairAuthorization, Cancellation,
  # ReinsuranceCession, LossReserveEntry) linked by FK fields, not nested URLs.

  state_machine_shape: parallel
  # Claim carries two independent dimensions (adjudication_status ×
  # payment_status); RepairAuthorization is branching fork-join; Contract is
  # cyclic (LAPSED <-> ACTIVE reinstatement loop).

  relationship_patterns:
    - one_to_many        # CoveragePlan -> Contract; Contract -> Claim; Claim -> ClaimLine
    - cross_aggregate    # Claim references RepairFacility; Cession references Claim

  role_model: peer_roles
  # AdminUnderwriter owns plans/reinsurance; ContractAdmin owns contract sale &
  # cancellation; ClaimsAdjuster owns adjudication; RepairFacility (entity-backed)
  # submits claims & receives direct pay; Auditor reads.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity Relationship Table
# =============================================================================
entities:
  - name: CoveragePlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan marketing name" }
      - { name: tier, type: enum, source: input, description: "POWERTRAIN | ENHANCED | EXCLUSIONARY" }
      - { name: term_months, type: integer, source: input, description: "Coverage term length in months", constraints: ">= 1" }
      - { name: term_miles, type: integer, source: input, description: "Coverage term length in miles", constraints: ">= 1" }
      - { name: max_vehicle_age_years, type: integer, source: input, description: "Eligibility ceiling: vehicle model-year age at sale, in years", constraints: ">= 0" }
      - { name: max_odometer_at_sale, type: integer, source: input, description: "Eligibility ceiling: odometer reading at sale, in miles", constraints: ">= 0" }
      - { name: base_premium_cents, type: integer, source: input, description: "Base retail premium before tier surcharge", constraints: ">= 0" }
      - { name: deductible_cents, type: integer, source: input, description: "Per-visit deductible applied to each repair authorization", constraints: ">= 0" }
      - { name: labor_rate_cap_cents_per_hour, type: integer, source: input, description: "Maximum reimbursable labor rate per hour", constraints: ">= 0" }
      - { name: rental_benefit_cents_per_day, type: integer, source: input, default: 0, description: "Rental reimbursement cap per day" }
      - { name: rental_max_days, type: integer, source: input, default: 0, description: "Maximum rental days reimbursed per claim" }
      - { name: towing_benefit_cents, type: integer, source: input, default: 0, description: "Flat towing reimbursement cap per claim" }
      - { name: reinsurance_cession_pct, type: number, source: input, description: "Fraction of earned premium ceded to reinsurance pool", constraints: "0.0 .. 1.0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | RETIRED" }

  - name: ReinsurancePool
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Pool name" }
      - { name: ceded_premium_cents, type: integer, source: computed, default: 0, description: "Cumulative earned premium ceded into the pool from active contracts" }
      - { name: paid_loss_cents, type: integer, source: computed, default: 0, description: "Cumulative claim losses charged against the pool" }
      - { name: reserve_held_cents, type: integer, source: computed, default: 0, description: "Outstanding case reserves currently held against open claims in this pool" }
      - { name: surplus_cents, type: integer, source: computed, default: 0, description: "= ceded_premium_cents - paid_loss_cents - reserve_held_cents" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: coverage_plan_id, type: string, source: input, description: "FK -> CoveragePlan.id; plan whose terms this contract instantiates" }
      - { name: reinsurance_pool_id, type: string, source: input, description: "FK -> ReinsurancePool.id; pool earned premium is ceded into and losses charged against" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number" }
      - { name: vehicle_model_year, type: integer, source: input, description: "Vehicle model year" }
      - { name: odometer_at_sale, type: integer, source: input, description: "Odometer reading at contract sale, in miles", constraints: ">= 0" }
      - { name: sale_date, type: datetime, source: input, description: "Date the contract was sold (in-service date)" }
      - { name: sale_price_cents, type: integer, source: input, description: "Retail price the customer paid, including any ancillary bundle", constraints: ">= 0" }
      - { name: financed, type: boolean, source: input, default: false, description: "Whether the sale price is rolled into a finance agreement" }
      - { name: finance_term_months, type: integer, source: input, default: 0, description: "Finance term in months; required when financed=true", constraints: ">= 0" }
      - { name: earned_premium_cents, type: integer, source: computed, description: "Premium recognized as earned to date, by the pro-rata earning basis" }
      - { name: paid_claim_total_cents, type: integer, source: computed, default: 0, description: "Sum of approved-and-paid RepairAuthorization payouts on this contract" }
      - { name: cancellation_id, type: string, source: computed, default: null, description: "Back-reference id of the Cancellation opened against this contract (set on POST /cancellations; the canonical FK is Cancellation.contract_id). Null when none open." }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | LAPSED | CANCELLED | EXPIRED" }

  - name: AncillaryProduct
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; parent VSC this ancillary is bundled with" }
      - { name: product_type, type: enum, source: input, description: "GAP | TIRE_WHEEL | KEY_REPLACEMENT" }
      - { name: premium_cents, type: integer, source: input, description: "Ancillary premium portion of the bundle", constraints: ">= 0" }
      - { name: gap_cap_cents, type: integer, source: input, default: 0, description: "For GAP: maximum loan-deficiency payout; 0 for non-GAP types" }
      - { name: refundable, type: boolean, source: input, default: true, description: "Whether this ancillary is pro-rata refundable on cancellation" }
      - { name: status, type: enum, source: system, default: "BUNDLED", description: "BUNDLED | REFUNDED | CLAIMED" }

  - name: RepairFacility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Repair shop name" }
      - { name: posted_labor_rate_cents_per_hour, type: integer, source: input, description: "Shop's posted labor rate", constraints: ">= 0" }
      - { name: network_status, type: enum, source: input, default: "IN_NETWORK", description: "IN_NETWORK | OUT_OF_NETWORK" }
      - { name: direct_pay_enrolled, type: boolean, source: input, default: false, description: "Whether the shop receives direct pay (vs customer reimbursement)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract the claim is filed under" }
      - { name: repair_facility_id, type: string, source: input, description: "FK -> RepairFacility.id; shop performing the repair" }
      - { name: reinsurance_pool_id, type: string, source: computed, description: "FK -> ReinsurancePool.id; copied from the contract at claim creation" }
      - { name: odometer_at_claim, type: integer, source: input, description: "Odometer at time of claim", constraints: ">= 0" }
      - { name: claim_date, type: datetime, source: input, description: "Date of the repair event" }
      - { name: complaint, type: string, source: input, description: "Failure description" }
      - { name: requested_amount_cents, type: integer, source: computed, default: 0, description: "Sum of all ClaimLine requested_amount_cents" }
      - { name: adjudicated_amount_cents, type: integer, source: computed, default: 0, description: "Covered amount after labor/parts adjudication, before deductible" }
      - { name: rental_days_claimed, type: integer, source: input, default: 0, description: "Rental days requested", constraints: ">= 0" }
      - { name: towing_claimed, type: boolean, source: input, default: false, description: "Whether towing reimbursement is requested" }
      - { name: reserve_cents, type: integer, source: computed, default: 0, description: "Case reserve held in the pool while the claim is open" }
      - { name: adjudication_status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | AUTHORIZED | PAID | VOID" }

  - name: ClaimLine
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; parent claim" }
      - { name: line_type, type: enum, source: input, description: "PART | LABOR" }
      - { name: part_number, type: string, source: input, default: null, description: "Part identifier; required when line_type=PART" }
      - { name: requested_amount_cents, type: integer, source: input, default: 0, description: "For PART: claimed part price in cents", constraints: ">= 0" }
      - { name: labor_hours, type: number, source: input, default: 0, description: "For LABOR: published labor-time hours", constraints: ">= 0" }
      - { name: covered, type: boolean, source: input, default: true, description: "Whether this line's component is covered under the plan tier" }
      - { name: allowed_amount_cents, type: integer, source: computed, default: 0, description: "Per-line covered amount after labor-rate cap / parts adjudication" }

  - name: RepairAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the approved claim this authorization disburses" }
      - { name: repair_facility_id, type: string, source: computed, description: "FK -> RepairFacility.id; copied from claim" }
      - { name: covered_repair_cents, type: integer, source: computed, description: "Adjudicated covered repair amount before deductible" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Deductible withheld on this authorization" }
      - { name: rental_payout_cents, type: integer, source: computed, default: 0, description: "Rental benefit reimbursed" }
      - { name: towing_payout_cents, type: integer, source: computed, default: 0, description: "Towing benefit reimbursed" }
      - { name: total_payout_cents, type: integer, source: computed, description: "Net amount disbursed = covered_repair - deductible + rental + towing" }
      - { name: pay_target, type: enum, source: computed, description: "DIRECT_PAY (to facility) | CUSTOMER_REIMBURSE" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | DISBURSED | REVERSED" }

  - name: Cancellation
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract being cancelled" }
      - { name: reason, type: enum, source: input, description: "CUSTOMER_REQUEST | REPOSSESSION | TOTAL_LOSS | DEALER_UNWIND" }
      - { name: request_date, type: datetime, source: input, description: "Date the cancellation request was received" }
      - { name: refund_basis, type: enum, source: computed, description: "FULL (within free-look) | PRO_RATA_TIME | PRO_RATA_MILEAGE" }
      - { name: gross_refund_cents, type: integer, source: computed, description: "Pro-rata unearned premium before fees and prior claims" }
      - { name: cancellation_fee_cents, type: integer, source: computed, default: 0, description: "Administrative cancellation fee withheld" }
      - { name: claims_offset_cents, type: integer, source: computed, default: 0, description: "Paid claims netted against refund when reason=DEALER_UNWIND" }
      - { name: net_refund_cents, type: integer, source: computed, description: "Final refund disbursed to customer/lienholder" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | REFUNDED | REJECTED" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: reinsurance_pool_id, type: string, source: system, description: "FK -> ReinsurancePool.id; pool this entry posts against" }
      - { name: contract_id, type: string, source: system, default: null, description: "FK -> Contract.id; contract that produced this entry, if any" }
      - { name: entry_type, type: enum, source: system, description: "PREMIUM_CEDED | RESERVE_SET | RESERVE_RELEASE | LOSS_PAID | LOSS_REVERSED | REFUND_CLAWBACK" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents posted to the pool" }
      - { name: memo, type: string, source: system, description: "Human-readable description of the posting" }

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - { name: current_utc, type: datetime, source: system, default: "2026-01-01T00:00:00Z", description: "Logical server clock; drives earned-premium and pro-rata window math" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: actor_role, type: string, source: system, description: "Role that triggered the event" }
      - { name: entity_type, type: string, source: system, description: "Entity affected" }
      - { name: entity_id, type: string, source: system, description: "Affected entity id" }
      - { name: action, type: string, source: system, description: "Action verb (e.g., CLAIM_APPROVED, CONTRACT_CANCELLED)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: CoveragePlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /coverage-plans/{id}/activate"
        actor: AdminUnderwriter
        preconditions:
          - "reinsurance_cession_pct in [0.0, 1.0] (else ERR_INVALID_CESSION_PCT)"
          - "term_months >= 1 AND term_miles >= 1"
        side_effects: ["increments CoveragePlan.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /coverage-plans/{id}/retire"
        actor: AdminUnderwriter
        preconditions:
          - "no Contract in status PENDING or ACTIVE references this plan (else ERR_PLAN_IN_USE)"
        side_effects: ["increments CoveragePlan.version by 1"]
    note: "A contract may only be sold against an ACTIVE plan."

  - entity: Contract
    initial_state: PENDING
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: ContractAdmin
        preconditions:
          - "referenced CoveragePlan.status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
          - "vehicle eligible by tier: (clock.year - vehicle_model_year) <= plan.max_vehicle_age_years AND odometer_at_sale <= plan.max_odometer_at_sale (else ERR_VEHICLE_INELIGIBLE)"
          - "if financed: finance_term_months >= 1 (else ERR_FINANCE_TERM_REQUIRED)"
        side_effects:
          - "compute earned_premium_cents = 0 at activation"
          - "post LedgerEntry PREMIUM_CEDED = 0 placeholder; pool.ceded_premium recalculated lazily on earned-premium reads"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /contracts/{id}/lapse"
        actor: ContractAdmin
        preconditions:
          - "no Claim under this contract in adjudication_status UNDER_REVIEW or APPROVED with payment_status != PAID (else ERR_OPEN_CLAIM_BLOCKS)"
        side_effects: ["increments Contract.version by 1"]
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /contracts/{id}/reinstate"
        actor: ContractAdmin
        preconditions:
          - "referenced CoveragePlan.status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
        side_effects: ["increments Contract.version by 1"]
        note: "Cyclic ACTIVE<->LAPSED reinstatement loop."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic on earned-premium read when clock passes term: months elapsed >= term_months)"
        actor: system
        preconditions: []
        side_effects:
          - "release any remaining case reserves on open claims (RESERVE_RELEASE) -> pool.reserve_held decreases"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /cancellations/{id}/refund (terminal step of cancellation)"
        actor: ContractAdmin
        preconditions:
          - "Cancellation referencing this contract is in status APPROVED (else ERR_CANCELLATION_NOT_APPROVED)"
        side_effects:
          - "post LedgerEntry REFUND_CLAWBACK = -net_refund unearned portion -> pool.ceded_premium decreases (cascade: pool.surplus recomputed)"
          - "set every BUNDLED refundable AncillaryProduct on this contract to REFUNDED (cascade)"
          - "increments Contract.version by 1"
      - from: LAPSED
        to: CANCELLED
        trigger: "POST /cancellations/{id}/refund"
        actor: ContractAdmin
        preconditions:
          - "Cancellation referencing this contract is in status APPROVED (else ERR_CANCELLATION_NOT_APPROVED)"
        side_effects:
          - "post LedgerEntry REFUND_CLAWBACK -> pool.ceded_premium decreases"
          - "set every BUNDLED refundable AncillaryProduct on this contract to REFUNDED (cascade)"
          - "increments Contract.version by 1"

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: []
    note: |
      Parallel state dimensions: adjudication_status and payment_status evolve
      independently. adjudication_status: SUBMITTED -> UNDER_REVIEW -> {APPROVED,
      DENIED}. payment_status: UNPAID -> AUTHORIZED -> PAID, with PAID -> VOID on
      reversal. A claim has no single terminal state; it is fully resolved when
      adjudication_status in {APPROVED,DENIED} AND payment_status in {PAID,VOID,UNPAID}.
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "referenced Contract.status == ACTIVE (else ERR_CONTRACT_NOT_ACTIVE)"
          - "odometer_at_claim within coverage: odometer_at_claim <= contract.odometer_at_sale + plan.term_miles (else ERR_MILEAGE_EXCEEDED)"
        side_effects:
          - "run claim_adjudication calculation -> set each ClaimLine.allowed_amount_cents and Claim.adjudicated_amount_cents"
          - "set Claim.reserve_cents = adjudicated_amount_cents; post LedgerEntry RESERVE_SET -> pool.reserve_held increases (cascade: pool.surplus recomputed)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "adjudicated_amount_cents > 0 (else ERR_NOTHING_COVERED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "release case reserve: post LedgerEntry RESERVE_RELEASE = -reserve_cents -> pool.reserve_held decreases (cascade: pool.surplus recomputed); set Claim.reserve_cents = 0"

  - entity: RepairAuthorization
    initial_state: PENDING
    terminal_states: [REVERSED]
    note: "Branching: an authorization either DIRECT_PAY (to facility) or CUSTOMER_REIMBURSE (to owner); divergent side-effect sets converge on a DISBURSED payout."
    transitions:
      - from: PENDING
        to: DISBURSED
        trigger: "POST /repair-authorizations/{id}/disburse"
        actor: ClaimsAdjuster
        preconditions:
          - "referenced Claim.adjudication_status == APPROVED (else ERR_CLAIM_NOT_APPROVED)"
          - "referenced Claim.payment_status == AUTHORIZED (else ERR_CLAIM_NOT_AUTHORIZED)"
          - "expected_contract_version matches Contract.version (else ERR_STALE_CONTRACT_VERSION)"
        side_effects:
          - "if pay_target==DIRECT_PAY: facility receives total_payout_cents (RepairFacility must be direct_pay_enrolled and ACTIVE)"
          - "if pay_target==CUSTOMER_REIMBURSE: customer receives total_payout_cents"
          - "set Claim.payment_status = PAID"
          - "release reserve: post LedgerEntry RESERVE_RELEASE = -claim.reserve_cents -> pool.reserve_held decreases; set Claim.reserve_cents = 0 (cascade hop 1)"
          - "post LedgerEntry LOSS_PAID = +total_payout_cents -> pool.paid_loss increases; pool.surplus recomputed (cascade hop 2)"
          - "increment Contract.paid_claim_total_cents by total_payout_cents (cascade hop 3)"
          - "increments Contract.version by 1"
      - from: DISBURSED
        to: REVERSED
        trigger: "POST /repair-authorizations/{id}/reverse"
        actor: ClaimsAdjuster
        preconditions:
          - "status == DISBURSED (else ERR_INVALID_STATE)"
        side_effects:
          - "set Claim.payment_status = VOID (compensation)"
          - "post LedgerEntry LOSS_REVERSED = -total_payout_cents -> pool.paid_loss decreases (compensation; surplus recomputed)"
          - "decrement Contract.paid_claim_total_cents by total_payout_cents (compensation)"
          - "increments Contract.version by 1"
    note2: "Claim.payment_status UNPAID->AUTHORIZED happens on RepairAuthorization creation (POST /claims/{id}/authorize)."

  - entity: Cancellation
    initial_state: REQUESTED
    terminal_states: [REFUNDED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /cancellations/{id}/approve"
        actor: ContractAdmin
        preconditions:
          - "referenced Contract.status in {ACTIVE, LAPSED} (else ERR_CONTRACT_NOT_CANCELLABLE)"
          - "no Claim under the contract in payment_status AUTHORIZED (else ERR_CLAIM_IN_FLIGHT)"
        side_effects:
          - "run pro_rata_refund calculation -> set refund_basis, gross_refund_cents, cancellation_fee_cents, claims_offset_cents, net_refund_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /cancellations/{id}/reject"
        actor: ContractAdmin
        preconditions: []
        side_effects: ["clear Contract.cancellation_id"]
      - from: APPROVED
        to: REFUNDED
        trigger: "POST /cancellations/{id}/refund"
        actor: ContractAdmin
        preconditions:
          - "referenced Contract.status in {ACTIVE, LAPSED}"
        side_effects:
          - "transition Contract to CANCELLED (cross-entity; see Contract state machine)"
          - "post LedgerEntry REFUND_CLAWBACK = -net_refund_cents -> pool.ceded_premium decreases"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: disburse-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /repair-authorizations/{id}/disburse"
    occ_field: "expected_contract_version"
    description: |
      Disbursing a RepairAuthorization against a Contract whose version has
      advanced since the client last observed it is rejected. A prior disburse
      or reverse on a sibling authorization for the same contract bumps
      Contract.version (it adjusts paid_claim_total_cents); a disburse still
      carrying the previously observed version is therefore acting on a stale
      view of the contract's claim ledger and is refused.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_adjudication
    trigger: "Claim SUBMITTED -> UNDER_REVIEW (POST /claims/{id}/start-review)"
    algorithm: aggregation
    formula: |
      # Per ClaimLine, compute allowed_amount_cents, then aggregate.
      # Evaluation order is pinned: compute each line, ROUND each line to whole
      # cents, THEN sum (round-per-line-then-sum). Summing raw then rounding is
      # explicitly NOT used.
      for line in claim.lines:
        if line.covered == false:
          line.allowed_amount_cents = 0
        elif line.line_type == "PART":
          line.allowed_amount_cents = line.requested_amount_cents   # parts at requested, already integer cents
        elif line.line_type == "LABOR":
          # labor rate is capped at the lesser of the shop's posted rate and the
          # plan's labor_rate_cap_cents_per_hour; multiply by published hours.
          effective_rate = min(facility.posted_labor_rate_cents_per_hour,
                                plan.labor_rate_cap_cents_per_hour)
          raw = line.labor_hours * effective_rate
          line.allowed_amount_cents = round_half_up(raw)            # round THIS line
      claim.adjudicated_amount_cents = sum(line.allowed_amount_cents for line in claim.lines)
    input_set: "All ClaimLine rows under the claim; covered=false lines contribute 0."
    constants:
      ROUNDING: round_half_up
    precision: "whole cents; round each labor line before summing"

  - name: claim_payout
    trigger: "RepairAuthorization PENDING -> DISBURSED (POST /repair-authorizations/{id}/disburse) and on RepairAuthorization creation for preview"
    algorithm: threshold
    formula: |
      # Deductible is applied ONCE per authorization against the covered repair,
      # floored at zero, BEFORE rental/towing benefits are added.
      covered_repair = claim.adjudicated_amount_cents
      deductible_applied = min(covered_repair, plan.deductible_cents)   # never exceeds covered repair
      net_repair = covered_repair - deductible_applied
      # Rental: per-day cap times days, capped at rental_max_days.
      rental_days = min(claim.rental_days_claimed, plan.rental_max_days)
      rental_payout = rental_days * plan.rental_benefit_cents_per_day
      # Towing: flat benefit if requested.
      towing_payout = plan.towing_benefit_cents if claim.towing_claimed else 0
      total_payout = net_repair + rental_payout + towing_payout
      # pay_target: DIRECT_PAY iff facility.direct_pay_enrolled == true (the shop
      # opted into direct pay); else CUSTOMER_REIMBURSE. NOTE: enrollment alone
      # selects the DIRECT_PAY *route*; whether that route may actually disburse
      # is enforced separately at disburse time by validation priority 11
      # (facility must also be ACTIVE and IN_NETWORK), so an enrolled-but-
      # out-of-network facility yields pay_target=DIRECT_PAY yet is rejected
      # ERR_FACILITY_NOT_DIRECT_PAY on disburse.
    input_set: "Single claim's adjudicated amount + plan deductible/rental/towing benefit fields + facility enrollment."
    constants:
      DEDUCTIBLE_FLOOR: 0
    precision: "whole cents; no rounding needed (all integer cents)"

  - name: pro_rata_refund
    trigger: "Cancellation REQUESTED -> APPROVED (POST /cancellations/{id}/approve)"
    algorithm: chronological
    formula: |
      # FREE-LOOK: if (clock.current_utc - contract.sale_date) <= 30 days AND
      #   no paid claims on the contract: refund_basis=FULL, gross_refund = sale_price_cents.
      days_in_force = floor_days(clock.current_utc - contract.sale_date)
      if days_in_force <= FREE_LOOK_DAYS and contract.paid_claim_total_cents == 0:
        refund_basis = "FULL"
        gross_refund = contract.sale_price_cents
      else:
        # Dual-variant unearned-premium basis. The GREATER earned fraction
        # (i.e. the SMALLER refund) is used — pin: refund = sale_price * (1 - max(time_frac, mileage_frac)).
        time_frac    = min(1.0, days_in_force / (plan.term_months * 30))
        miles_used   = max(0, contract.current_odometer - contract.odometer_at_sale)  # current_odometer from latest claim, else odometer_at_sale
        mileage_frac = min(1.0, miles_used / plan.term_miles)
        earned_frac  = max(time_frac, mileage_frac)
        refund_basis = "PRO_RATA_MILEAGE" if mileage_frac >= time_frac else "PRO_RATA_TIME"
        gross_refund = round_half_up(contract.sale_price_cents * (1.0 - earned_frac))
      # Cancellation fee withheld except on free-look.
      cancellation_fee = 0 if refund_basis == "FULL" else CANCELLATION_FEE_CENTS
      # DEALER_UNWIND nets prior paid claims against the refund; other reasons do not.
      claims_offset = contract.paid_claim_total_cents if reason == "DEALER_UNWIND" else 0
      net_refund = max(0, gross_refund - cancellation_fee - claims_offset)
    input_set: "Single contract; current_odometer derived from the latest Claim by claim_date (tie-break created_at ASC), else odometer_at_sale."
    constants:
      FREE_LOOK_DAYS: 30
      CANCELLATION_FEE_CENTS: 5000
      DAYS_PER_MONTH: 30
      ROUNDING: round_half_up
    precision: "2 decimal -> whole cents, round_half_up; round AFTER multiplying sale_price by unearned fraction"
    variants:
      - name: time_basis
        when: "time_frac >= mileage_frac (e.g., low-mileage vehicle, long elapsed time)"
        difference: "refund_basis=PRO_RATA_TIME; earned fraction driven by elapsed days"
      - name: mileage_basis
        when: "mileage_frac > time_frac (e.g., high-mileage vehicle, short elapsed time)"
        difference: "refund_basis=PRO_RATA_MILEAGE; earned fraction driven by miles consumed"

  - name: pool_surplus
    trigger: "Any LedgerEntry posting (PREMIUM_CEDED, RESERVE_SET, RESERVE_RELEASE, LOSS_PAID, LOSS_REVERSED, REFUND_CLAWBACK)"
    algorithm: aggregation
    formula: |
      # Loss-reserve accounting identity. Recomputed from the signed ledger after
      # every posting; evaluation order is fixed: aggregate each ledger column,
      # then derive surplus.
      pool.ceded_premium_cents = sum(amount for entry in PREMIUM_CEDED + REFUND_CLAWBACK entries of pool)
      pool.paid_loss_cents     = sum(amount for entry in LOSS_PAID + LOSS_REVERSED entries of pool)
      pool.reserve_held_cents  = sum(amount for entry in RESERVE_SET + RESERVE_RELEASE entries of pool)
      pool.surplus_cents = pool.ceded_premium_cents - pool.paid_loss_cents - pool.reserve_held_cents
    input_set: "All LedgerEntry rows whose reinsurance_pool_id == pool.id."
    constants: {}
    precision: "whole cents"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "Body FK references (coverage_plan_id, reinsurance_pool_id, contract_id, repair_facility_id, claim_id) resolve to existing rows"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST /contracts, POST /claims, POST /ancillary-products, POST /cancellations, POST /claims/{id}/lines"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "Contract referenced by start-review is ACTIVE"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /claims/{id}/start-review"
  - priority: 7
    category: state
    check: "Coverage plan referenced by contract activate/reinstate is ACTIVE"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /contracts/{id}/activate, POST /contracts/{id}/reinstate"
  - priority: 8
    category: state
    check: "Cancellation refund requires its cancellation to be APPROVED"
    error_id: ERR_CANCELLATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /cancellations/{id}/refund"
  - priority: 9
    category: business_safety
    check: "Vehicle eligible by tier at contract activation: (clock.year - vehicle_model_year) <= plan.max_vehicle_age_years AND odometer_at_sale <= plan.max_odometer_at_sale"
    error_id: ERR_VEHICLE_INELIGIBLE
    http_status: 422
    applies_to: "POST /contracts/{id}/activate"
  - priority: 10
    category: business_safety
    check: "Claim odometer within coverage at start-review: odometer_at_claim <= contract.odometer_at_sale + plan.term_miles"
    error_id: ERR_MILEAGE_EXCEEDED
    http_status: 422
    applies_to: "POST /claims/{id}/start-review"
  - priority: 11
    category: business_referential
    check: "When the authorization's pay_target == DIRECT_PAY, the facility must be ACTIVE AND network_status == IN_NETWORK (direct_pay_enrolled is already true since pay_target was DIRECT_PAY); otherwise reject"
    error_id: ERR_FACILITY_NOT_DIRECT_PAY
    http_status: 422
    applies_to: "POST /repair-authorizations/{id}/disburse"
  - priority: 12
    category: business_constraint
    check: "GAP ancillary may only be bundled while Contract.status == PENDING (cannot add GAP after activation)"
    error_id: ERR_BUNDLE_TOO_LATE
    http_status: 422
    applies_to: "POST /ancillary-products"
  - priority: 13
    category: business_constraint
    check: "A claim cannot be approved when nothing is covered (adjudicated_amount_cents == 0)"
    error_id: ERR_NOTHING_COVERED
    http_status: 422
    applies_to: "POST /claims/{id}/approve"
  - priority: 14
    category: business_constraint
    check: "ClaimLine of type PART must include part_number; type LABOR must include labor_hours > 0"
    error_id: ERR_INVALID_CLAIM_LINE
    http_status: 422
    applies_to: "POST /claims/{id}/lines"
  - priority: 15
    category: business_temporal
    check: "Cancellation cannot be approved while a claim under the contract is payment_status AUTHORIZED (in-flight payout)"
    error_id: ERR_CLAIM_IN_FLIGHT
    http_status: 409
    applies_to: "POST /cancellations/{id}/approve"
  - priority: 16
    category: business_fiscal
    check: "OCC: expected_contract_version must equal current Contract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /repair-authorizations/{id}/disburse"
  - priority: 17
    category: business_constraint
    check: "Required body fields present and well-typed for the endpoint"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Coverage Plans ---
  - { method: POST, path: "/coverage-plans", description: "Create a draft coverage plan", roles: [AdminUnderwriter], code: 201, input: [name, tier, term_months, term_miles, max_vehicle_age_years, max_odometer_at_sale, base_premium_cents, deductible_cents, labor_rate_cap_cents_per_hour, "rental_benefit_cents_per_day?", "rental_max_days?", "towing_benefit_cents?", reinsurance_cession_pct], output: CoveragePlan, side_effects: [] }
  - { method: GET, path: "/coverage-plans", description: "List coverage plans", roles: [AdminUnderwriter, ContractAdmin, ClaimsAdjuster, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "CoveragePlan[]", side_effects: [] }
  - { method: GET, path: "/coverage-plans/{id}", description: "Get a coverage plan", roles: [AdminUnderwriter, ContractAdmin, ClaimsAdjuster, Auditor], code: 200, input: [], output: CoveragePlan, side_effects: [] }
  - { method: POST, path: "/coverage-plans/{id}/activate", description: "Activate a draft plan", roles: [AdminUnderwriter], code: 200, input: [], output: CoveragePlan, side_effects: ["DRAFT->ACTIVE", "increments CoveragePlan.version by 1"] }
  - { method: POST, path: "/coverage-plans/{id}/retire", description: "Retire an active plan", roles: [AdminUnderwriter], code: 200, input: [], output: CoveragePlan, side_effects: ["ACTIVE->RETIRED", "increments CoveragePlan.version by 1"] }

  # --- Reinsurance Pools ---
  - { method: POST, path: "/reinsurance-pools", description: "Create a reinsurance pool", roles: [AdminUnderwriter], code: 201, input: [name], output: ReinsurancePool, side_effects: [] }
  - { method: GET, path: "/reinsurance-pools", description: "List pools", roles: [AdminUnderwriter, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "ReinsurancePool[]", side_effects: [] }
  - { method: GET, path: "/reinsurance-pools/{id}", description: "Get a pool with computed surplus", roles: [AdminUnderwriter, Auditor], code: 200, input: [], output: ReinsurancePool, side_effects: ["recompute pool_surplus from ledger"] }
  - { method: GET, path: "/reinsurance-pools/{id}/ledger-entries", description: "List ledger entries posted against a pool (reverse-reachability for LedgerEntry.reinsurance_pool_id)", roles: [AdminUnderwriter, Auditor], code: 200, input: ["contract_id?", "entry_type?", "limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/reinsurance-pools/{id}/claims", description: "List claims charging against a pool (reverse-reachability for Claim.reinsurance_pool_id)", roles: [AdminUnderwriter, Auditor], code: 200, input: ["limit?", "offset?"], output: "Claim[]", side_effects: [] }

  # --- Contracts ---
  - { method: POST, path: "/contracts", description: "Sell (create) a pending contract", roles: [ContractAdmin], code: 201, input: [coverage_plan_id, reinsurance_pool_id, vin, vehicle_model_year, odometer_at_sale, sale_date, sale_price_cents, "financed?", "finance_term_months?"], output: Contract, side_effects: [] }
  - { method: GET, path: "/contracts", description: "List contracts (filterable by coverage_plan_id, reinsurance_pool_id)", roles: [ContractAdmin, ClaimsAdjuster, AdminUnderwriter, Auditor], code: 200, input: ["coverage_plan_id?", "reinsurance_pool_id?", "status?", "limit?", "offset?"], output: "Contract[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}", description: "Get a contract (earned_premium recomputed; may auto-EXPIRE)", roles: [ContractAdmin, ClaimsAdjuster, AdminUnderwriter, Auditor], code: 200, input: [], output: Contract, side_effects: ["recompute earned_premium_cents", "auto ACTIVE->EXPIRED if term elapsed"] }
  - { method: POST, path: "/contracts/{id}/activate", description: "Activate a pending contract after eligibility check", roles: [ContractAdmin], code: 200, input: [], output: Contract, side_effects: ["PENDING->ACTIVE", "eligibility validation", "increments Contract.version by 1"] }
  - { method: POST, path: "/contracts/{id}/lapse", description: "Lapse an active contract", roles: [ContractAdmin], code: 200, input: [], output: Contract, side_effects: ["ACTIVE->LAPSED", "increments Contract.version by 1"] }
  - { method: POST, path: "/contracts/{id}/reinstate", description: "Reinstate a lapsed contract", roles: [ContractAdmin], code: 200, input: [], output: Contract, side_effects: ["LAPSED->ACTIVE", "increments Contract.version by 1"] }
  - { method: GET, path: "/contracts/{id}/ancillary-products", description: "List ancillary products bundled with a contract (reverse-reachability for AncillaryProduct.contract_id)", roles: [ContractAdmin, AdminUnderwriter, Auditor], code: 200, input: [], output: "AncillaryProduct[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/claims", description: "List claims filed under a contract (reverse-reachability for Claim.contract_id)", roles: [ContractAdmin, ClaimsAdjuster, Auditor], code: 200, input: [], output: "Claim[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/cancellation", description: "List cancellation(s) opened against a contract (reverse-reachability for Cancellation.contract_id; 0 or 1)", roles: [ContractAdmin, Auditor], code: 200, input: [], output: "Cancellation[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/ledger-entries", description: "List ledger entries attributed to a contract (reverse-reachability for LedgerEntry.contract_id)", roles: [ContractAdmin, AdminUnderwriter, Auditor], code: 200, input: ["entry_type?", "limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }

  # --- Ancillary Products ---
  - { method: POST, path: "/ancillary-products", description: "Bundle an ancillary product onto a pending contract", roles: [ContractAdmin], code: 201, input: [contract_id, product_type, premium_cents, "gap_cap_cents?", "refundable?"], output: AncillaryProduct, side_effects: [] }
  - { method: GET, path: "/ancillary-products/{id}", description: "Get an ancillary product", roles: [ContractAdmin, AdminUnderwriter, Auditor], code: 200, input: [], output: AncillaryProduct, side_effects: [] }

  # --- Repair Facilities ---
  - { method: POST, path: "/repair-facilities", description: "Register a repair facility", roles: [AdminUnderwriter], code: 201, input: [name, posted_labor_rate_cents_per_hour, "network_status?", "direct_pay_enrolled?"], output: RepairFacility, side_effects: [] }
  - { method: GET, path: "/repair-facilities/{id}", description: "Get a repair facility", roles: [AdminUnderwriter, ClaimsAdjuster, RepairFacility, Auditor], code: 200, input: [], output: RepairFacility, side_effects: [] }
  - { method: GET, path: "/repair-facilities/{id}/claims", description: "List claims filed at a facility (reverse-reachability for Claim.repair_facility_id)", roles: [AdminUnderwriter, ClaimsAdjuster, RepairFacility, Auditor], code: 200, input: ["limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: GET, path: "/repair-facilities/{id}/repair-authorizations", description: "List repair authorizations directed to a facility (reverse-reachability for RepairAuthorization.repair_facility_id)", roles: [AdminUnderwriter, ClaimsAdjuster, RepairFacility, Auditor], code: 200, input: ["limit?", "offset?"], output: "RepairAuthorization[]", side_effects: [] }

  # --- Claims ---
  - { method: POST, path: "/claims", description: "File a claim under a contract", roles: [ClaimsAdjuster, RepairFacility], code: 201, input: [contract_id, repair_facility_id, odometer_at_claim, claim_date, complaint, "rental_days_claimed?", "towing_claimed?"], output: Claim, side_effects: ["copy reinsurance_pool_id from contract"] }
  - { method: GET, path: "/claims/{id}", description: "Get a claim", roles: [ClaimsAdjuster, RepairFacility, ContractAdmin, Auditor], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/claims/{id}/lines", description: "Add a claim line (part or labor)", roles: [ClaimsAdjuster, RepairFacility], code: 201, input: [line_type, "part_number?", "requested_amount_cents?", "labor_hours?", "covered?"], output: ClaimLine, side_effects: ["recompute Claim.requested_amount_cents"] }
  - { method: GET, path: "/claims/{id}/lines", description: "List claim lines (reverse-reachability for ClaimLine.claim_id)", roles: [ClaimsAdjuster, RepairFacility, Auditor], code: 200, input: [], output: "ClaimLine[]", side_effects: [] }
  - { method: POST, path: "/claims/{id}/start-review", description: "Begin adjudication; runs claim_adjudication and sets reserve", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["SUBMITTED->UNDER_REVIEW", "run claim_adjudication", "RESERVE_SET ledger posting", "pool_surplus recompute"] }
  - { method: POST, path: "/claims/{id}/approve", description: "Approve an adjudicated claim", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["UNDER_REVIEW->APPROVED (adjudication dimension)"] }
  - { method: POST, path: "/claims/{id}/deny", description: "Deny a claim; releases reserve", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["UNDER_REVIEW->DENIED", "RESERVE_RELEASE ledger posting", "pool_surplus recompute"] }
  - { method: POST, path: "/claims/{id}/authorize", description: "Create a RepairAuthorization for an approved claim (UNPAID->AUTHORIZED on payment dimension); runs claim_payout preview", roles: [ClaimsAdjuster], code: 201, input: [], output: RepairAuthorization, side_effects: ["Claim.payment_status UNPAID->AUTHORIZED", "run claim_payout -> set authorization payout fields and pay_target", "copy repair_facility_id"] }

  # --- Repair Authorizations ---
  - { method: GET, path: "/repair-authorizations/{id}", description: "Get a repair authorization", roles: [ClaimsAdjuster, RepairFacility, Auditor], code: 200, input: [], output: RepairAuthorization, side_effects: [] }
  - { method: GET, path: "/claims/{id}/repair-authorizations", description: "List repair authorizations for a claim (reverse-reachability for RepairAuthorization.claim_id)", roles: [ClaimsAdjuster, RepairFacility, Auditor], code: 200, input: [], output: "RepairAuthorization[]", side_effects: [] }
  - { method: POST, path: "/repair-authorizations/{id}/disburse", description: "Disburse payout (direct pay or customer reimburse); OCC on contract version; cascades reserve release -> loss paid -> contract ledger", roles: [ClaimsAdjuster], code: 200, input: [expected_contract_version], output: RepairAuthorization, side_effects: ["PENDING->DISBURSED", "Claim.payment_status->PAID", "RESERVE_RELEASE -> LOSS_PAID cascade", "increment Contract.paid_claim_total_cents", "increments Contract.version by 1"] }
  - { method: POST, path: "/repair-authorizations/{id}/reverse", description: "Reverse a disbursed authorization (compensation)", roles: [ClaimsAdjuster], code: 200, input: [], output: RepairAuthorization, side_effects: ["DISBURSED->REVERSED", "Claim.payment_status->VOID", "LOSS_REVERSED posting", "decrement Contract.paid_claim_total_cents", "increments Contract.version by 1"] }

  # --- Cancellations ---
  - { method: POST, path: "/cancellations", description: "Open a cancellation against a contract", roles: [ContractAdmin], code: 201, input: [contract_id, reason, request_date], output: Cancellation, side_effects: ["set Contract.cancellation_id"] }
  - { method: GET, path: "/cancellations/{id}", description: "Get a cancellation", roles: [ContractAdmin, AdminUnderwriter, Auditor], code: 200, input: [], output: Cancellation, side_effects: [] }
  - { method: POST, path: "/cancellations/{id}/approve", description: "Approve cancellation; runs pro_rata_refund", roles: [ContractAdmin], code: 200, input: [], output: Cancellation, side_effects: ["REQUESTED->APPROVED", "run pro_rata_refund"] }
  - { method: POST, path: "/cancellations/{id}/reject", description: "Reject a cancellation", roles: [ContractAdmin], code: 200, input: [], output: Cancellation, side_effects: ["REQUESTED->REJECTED", "clear Contract.cancellation_id"] }
  - { method: POST, path: "/cancellations/{id}/refund", description: "Disburse refund and cancel the contract; clawback ledger posting; refunds bundled ancillaries", roles: [ContractAdmin], code: 200, input: [], output: Cancellation, side_effects: ["APPROVED->REFUNDED", "Contract->CANCELLED", "REFUND_CLAWBACK posting", "refund BUNDLED ancillaries"] }

  # --- Clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical server clock. Startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock.", roles: [AdminUnderwriter, ContractAdmin, ClaimsAdjuster], code: 200, input: [to_iso8601], output: ClockState, side_effects: [] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body foreign-key reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing or ill-typed required body field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from current state" }
  - { id: ERR_PLAN_IN_USE, http: 409, condition: "Retiring a plan still referenced by PENDING/ACTIVE contracts" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Contract activate/reinstate against a non-ACTIVE plan" }
  - { id: ERR_INVALID_CESSION_PCT, http: 422, condition: "reinsurance_cession_pct outside [0.0, 1.0]" }
  - { id: ERR_VEHICLE_INELIGIBLE, http: 422, condition: "Vehicle age or odometer at sale exceeds plan eligibility tier" }
  - { id: ERR_FINANCE_TERM_REQUIRED, http: 422, condition: "financed=true but finance_term_months < 1" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Claim start-review against a non-ACTIVE contract" }
  - { id: ERR_MILEAGE_EXCEEDED, http: 422, condition: "Claim odometer beyond odometer_at_sale + plan term_miles" }
  - { id: ERR_OPEN_CLAIM_BLOCKS, http: 409, condition: "Lapsing a contract with an open (UNDER_REVIEW or unpaid APPROVED) claim" }
  - { id: ERR_NOTHING_COVERED, http: 422, condition: "Approving a claim whose adjudicated_amount_cents == 0" }
  - { id: ERR_INVALID_CLAIM_LINE, http: 422, condition: "PART line missing part_number, or LABOR line missing positive labor_hours" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "Disbursing an authorization whose claim is not APPROVED" }
  - { id: ERR_CLAIM_NOT_AUTHORIZED, http: 409, condition: "Disbursing an authorization whose claim payment_status is not AUTHORIZED" }
  - { id: ERR_FACILITY_NOT_DIRECT_PAY, http: 422, condition: "Direct-pay disbursement to a facility not enrolled / not ACTIVE / out-of-network" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version does not match current Contract.version (OCC)" }
  - { id: ERR_BUNDLE_TOO_LATE, http: 422, condition: "Bundling an ancillary onto a non-PENDING contract" }
  - { id: ERR_CLAIM_IN_FLIGHT, http: 409, condition: "Approving a cancellation while a claim is payment_status AUTHORIZED" }
  - { id: ERR_CANCELLATION_NOT_APPROVED, http: 409, condition: "Refunding a cancellation not in APPROVED state" }
  - { id: ERR_CONTRACT_NOT_CANCELLABLE, http: 409, condition: "Approving a cancellation when contract is not ACTIVE or LAPSED" }
  - { id: ERR_VALIDATION_RANGE, http: 422, condition: "A numeric input violates a declared range constraint (e.g., negative cents, term_months < 1)" }
  - { id: ERR_PAGINATION_INVALID, http: 422, condition: "limit/offset outside [min,max] bounds" }
  - { id: ERR_CLOCK_INVALID, http: 422, condition: "to_iso8601 is not a valid ISO 8601 UTC timestamp" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: AdminUnderwriter
    description: "Owns product catalog: coverage plans and reinsurance pools; registers repair facilities."
    identity: opaque
    exclusive_operations:
      - "POST /coverage-plans, activate/retire plans"
      - "POST /reinsurance-pools"
      - "POST /repair-facilities"
    shared_operations:
      - "read coverage plans, pools, contracts, ledger entries"
  - name: ContractAdmin
    description: "Sells and manages contract lifecycle, ancillary bundling, and cancellations."
    identity: opaque
    exclusive_operations:
      - "POST /contracts, activate/lapse/reinstate"
      - "POST /ancillary-products"
      - "POST /cancellations and approve/reject/refund"
    shared_operations:
      - "read contracts, claims, ancillaries, cancellations"
  - name: ClaimsAdjuster
    description: "Adjudicates claims, authorizes and disburses repair authorizations."
    identity: opaque
    exclusive_operations:
      - "claim start-review/approve/deny/authorize"
      - "repair-authorization disburse/reverse"
    shared_operations:
      - "POST /claims and claim lines (shared with RepairFacility)"
      - "read claims, authorizations, facilities, contracts"
  - name: RepairFacility
    description: "Repair shop user; files claims and claim lines, receives direct pay, reads own authorizations."
    identity: "entity_backed:RepairFacility"
    exclusive_operations: []
    shared_operations:
      - "POST /claims and claim lines (shared with ClaimsAdjuster)"
      - "read claims, claim lines, repair authorizations, own facility"
  - name: Auditor
    description: "Read-only oversight of all entities and the reinsurance ledger."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "read all entities and ledger entries"
