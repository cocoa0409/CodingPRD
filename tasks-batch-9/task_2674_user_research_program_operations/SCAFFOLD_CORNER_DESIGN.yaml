              as_user_id: "u_ops_1"
          assert:
            - "The repeat inside pool A returns HTTP 409 with error.code == ERR_DUPLICATE_EXTERNAL_REF and no second Participant row is created"
            - "GET /participant-pools/${pool_a}/participants still reports total_count == 1"
            - "The same external_ref under pool B returns HTTP 201 - the constraint is (participant_pool_id, external_ref)"
            - "The rejected attempt leaves ParticipantPool.${pool_a}.participant_count == 1 and version unchanged"
