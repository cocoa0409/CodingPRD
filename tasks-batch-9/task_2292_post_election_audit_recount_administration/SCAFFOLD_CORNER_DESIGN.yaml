          A recount may be filed on a canvassed contest while a sibling contest is still uncanvassed, but
          it cannot start until the election itself reaches CANVASSED: the path entity is in a legal state, so
          the failure is the election's ERR_ELECTION_NOT_CANVASSED rather than an invalid-transition error,
          and canvassing the sibling makes the identical request succeed.
