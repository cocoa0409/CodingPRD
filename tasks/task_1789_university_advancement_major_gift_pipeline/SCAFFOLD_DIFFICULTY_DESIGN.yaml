  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: proposal_requires_rated_prospect
        grounds:
          - state_machines.Prospect.research_status=IN_SCREENING_to_research_status=RATED
          - errors[ERR_PROSPECT_NOT_RATED]
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair Proposal -> Prospect: proposal creation is rejected while
          the prospect's research_status is IN_SCREENING and succeeds once the
          assessment approval flips it to RATED. Distinct pair from the
          GiftPayment -> RestrictedFund instance.
        test_recipe:
          setup:
            - "Prospect with a SUBMITTED assessment (research_status IN_SCREENING), assigned, moved to CULTIVATION"
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
