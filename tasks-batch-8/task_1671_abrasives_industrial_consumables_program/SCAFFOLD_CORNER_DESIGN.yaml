      - name: lot_expiry_sweep_boundary
        claim_type: valid_transition
        grounds:
          - "state_machines.InventoryLot.AVAILABLE_to_EXPIRED"
          - "calculations.lot_expiry_date"
        distinguishing_aspect: "Clock sweep uses strict greater-than: a lot whose expiry_date equals the new clock date stays AVAILABLE; it expires only when the clock date passes its expiry date."
        test_recipe:
          setup: ["BONDED product shelf_life_months 3 EXACT_DAY; lot manufactured 2026-07-01 -> expiry 2026-10-01; default clock 2026-08-01"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "LX-1", name: "Expiry Wheel", product_form: "BONDED", max_operating_speed_rpm: 6000, shelf_life_months: 3, shelf_life_policy: "EXACT_DAY" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-LX", manufacture_date: "2026-07-01", qty_received: 10 }
              as: AccountManager
              captures: { lot_id: $.data.id, lot_exp: $.data.expiry_date }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { swept1: $.data.lots_expired }
            - call: "GET /api/lots/${lot_id}"
              as: AccountManager
              captures: { st1: $.data.status }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { swept2: $.data.lots_expired }
            - call: "GET /api/lots/${lot_id}"
              as: AccountManager
              captures: { st2: $.data.status }
          assert:
            - "InventoryLot.${lot_id}.expiry_date == 2026-10-01"
            - "At clock 2026-10-01 (== expiry): lots_expired == 0 and lot stays AVAILABLE (strict > semantics)"
            - "At clock 2026-10-02 (> expiry): lots_expired == 1 and lot becomes EXPIRED"

      - name: contract_expiry_sweep_boundary
        claim_type: valid_transition
        grounds:
          - "state_machines.Contract.ACTIVE_to_EXPIRED"
        distinguishing_aspect: "Contract expiry uses strict greater-than on term_end: ACTIVE on term_end itself (2026-08-01), EXPIRED the day after."
        test_recipe:
          setup: ["Contract term 2026-01-01..2026-08-01, activated at the default clock 2026-08-01 (term_end == clock date)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CX-1", name: "Contract Expiry Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
