              as: FacilitiesPlanner
              captures: { bo_id: $.data.id }
            - call: "POST /convention-center/maintenance-blackouts/${bo_id}/approve"
              payload: {}
              as: FacilitiesPlanner
          trigger:
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bb_id}", event_name: "Sunbelt Holiday Bazaar", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-11-24", show_start_date: "2027-11-25", show_end_date: "2027-11-27", move_out_end_date: "2027-11-28" }
              as: SalesManager
              captures: { bk_ok_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bb_id}", event_name: "Sunbelt Holiday Bazaar Extended", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-11-25", show_start_date: "2027-11-26", show_end_date: "2027-11-28", move_out_end_date: "2027-11-29" }
