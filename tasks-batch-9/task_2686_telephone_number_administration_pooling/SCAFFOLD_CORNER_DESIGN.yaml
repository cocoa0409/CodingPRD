          setup: ["Carrier A licensed and VERIFIED in OH. NPA 614 / rate center COLUMBUS with five unassigned blocks 614-554-0..4. A submitted 2026-H1 filing claims 80.00 (blocks_held 2, assigned 1600) with forecast 3000/3000/0/0; an audit finding by admin-1 adjusts assigned to 1500 (75.00, a 5.00-point delta, penalty PROBATION) and approver-1 ACCEPTs it, driving the filing to REJECTED and carrier A to PROBATION until 2027-01-28T00:00:00Z. Only after that does carrier A file a GROWTH request, so it is still PENDING_REVIEW."]
