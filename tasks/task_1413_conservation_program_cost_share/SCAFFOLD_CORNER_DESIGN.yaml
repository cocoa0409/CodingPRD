  # ============================================================ validations
  - section: validations
    instances:
      - name: calls_missing_header_return_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Request without X-User-Role -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER; trigger call is dispatched with NO role/user headers (as: records the nominal caller only)."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "GET /eqip/programs/${prog}", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (the trigger omits auth headers entirely)"

      - name: priority_auth_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]", "errors[ERR_CONTRACT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent contract WITHOUT auth headers returns the priority-1 auth error, not the 404 — priority order observable."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /eqip/contracts/11111111-1111-4111-8111-111111111111", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (auth priority 1 beats existence priority 3; trigger omits auth headers)"

      - name: applicant_role_cannot_create_program
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Applicant role on a ProgramAdmin-only endpoint -> 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["applicant exists"]
          setup_api_calls:
            - { call: "POST /eqip/applicants", payload: { legal_name: "A", hu_category: "NONE", parcel_ids: ["P-1"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /eqip/programs", payload: { program_name: "X", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: Applicant, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE (403)"

      - name: applicant_cannot_touch_others_resources
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_APPLICANT_NOT_OWNER]"]
        distinguishing_aspect: "Applicant B submitting with applicant_id of A -> ERR_APPLICANT_NOT_OWNER (403); ownership compares X-User-ID to payload applicant_id."
        test_recipe:
          setup: ["program OPEN (pool+rate+criterion); applicants A and B"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 100000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A", hu_category: "NONE", parcel_ids: ["P-1"] }, as: ProgramAdmin, captures: { aa: $.data.id } }
            - { call: "POST /eqip/applicants", payload: { legal_name: "B", hu_category: "NONE", parcel_ids: ["P-2"] }, as: ProgramAdmin, captures: { ab: $.data.id } }
          trigger:
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${aa}", parcel_id: "P-1", planned_practices: [ { practice_code: "FENCE", quantity: 10 } ], self_reported_answers: {} }, as: Applicant, as_user_id: "${ab}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_APPLICANT_NOT_OWNER (B impersonating A)"

      - name: parcel_not_registered_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PARCEL_NOT_REGISTERED]"]
        distinguishing_aspect: "Submit with parcel P-999 not in applicant.parcel_ids -> ERR_PARCEL_NOT_REGISTERED (422) at submit time (referential check against the Applicant entity)."
        test_recipe:
          setup: ["program OPEN; applicant with parcels [P-1]; DRAFT application referencing P-999 (referential rule fires at submit, not create)"]
          setup_api_calls:
