      - name: corner_rbac_sod_estimator_prices_and_only_the_customer_approves
        claim_type: Segregation of duties
        grounds: ["roles", "segregation_of_duties", "errors[ERR_UNAUTHORIZED]", "validations[priority=2]"]
        distinguishing_aspect: |
          SOD-3 is enforced at G2_ROLE, not by a business rule: the Estimator that
          built, priced and sent the quote is refused 403 ERR_UNAUTHORIZED when it tries
          to approve it, and the CustomerContact is refused 403 ERR_UNAUTHORIZED when it
          tries to price it - the latter even though the quote is SENT and would ALSO
          fail the DRAFT/REVISION_REQUIRED state gate, because G2 (rank 2) outranks G5
          (rank 5). The owning CustomerContact then approves successfully. An
          implementation that grants Estimator a superset of CustomerContact's rights
          approves on the first call.
