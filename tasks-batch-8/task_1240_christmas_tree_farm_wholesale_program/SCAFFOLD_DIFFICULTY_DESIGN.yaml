            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 300, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id, lotv: $.data.version } }
