            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "AV 1", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "AV 2", date_of_birth: "1991-01-01", relationship: "SPOUSE" }, as: IntakeCoordinator }
