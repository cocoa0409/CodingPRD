  - name: membership_status_cycles_active_to_lapsed_and_back_to_active
    grounds:
    - state_machines.Member.ACTIVE_to_LAPSED
    - state_machines.Member.LAPSED_to_ACTIVE
    - entities.Member.fields.dues_paid_through
    - entities.Member.fields.dues_grace_until
    distinguishing_aspect: 'Member.status is cyclic on a different entity from MemberOrder: ACTIVE -> LAPSED -> ACTIVE through the same dues-payment endpoint, and the reinstating term is measured from the clock rather than from the stale dues_paid_through.'
    test_recipe:
      setup:
      - Mara paid a one-year PLUS term at clock 2026-05-05T00:00:00Z, so dues_paid_through is 2027-05-05T00:00:00Z and dues_grace_until is 2027-05-19T00:00:00Z.
      - The clock now reads 2027-05-20T00:00:00Z, one day past the grace end.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
          reefer_slots: 2
          route_minimum_cents: 1000
          max_pallets: 12
        as: ClubAdmin
        captures:
          r_north: $.data.id
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot A
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_a: $.data.id
      - call: POST /members
        payload:
          email: cora@coop.test
          full_name: Cora Ord
          home_drop_point_id: ${d_a}
          tier: PRO
        as: ClubAdmin
        captures:
          mc_id: $.data.id
          mc_v: $.data.version
      - call: POST /members/${mc_id}/dues-payments
        payload:
          amount_cents: 18000
          term_years: 1
          expected_member_version: ${mc_v}
        as: ClubAdmin
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot B
          coordinator_member_id: ${mc_id}
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_b: $.data.id
      - call: POST /members
        payload:
          email: mara@coop.test
          full_name: Mara Plus
          home_drop_point_id: ${d_b}
          tier: PLUS
        as: ClubAdmin
        captures:
          ma_id: $.data.id
          ma_v: $.data.version
      - call: POST /members/${ma_id}/dues-payments
        payload:
          amount_cents: 9000
          term_years: 1
          expected_member_version: ${ma_v}
        as: ClubAdmin
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2027-05-20T00:00:00Z'
        as: ClubAdmin
      trigger:
      - call: POST /members/${ma_id}/lapse
        payload: {}
        as: ClubAdmin
      - call: GET /members/${ma_id}
        payload: {}
        as: ClubAdmin
        captures:
          ma_v3: $.data.version
      - call: POST /members/${ma_id}/dues-payments
        payload:
          amount_cents: 9000
          term_years: 1
          expected_member_version: ${ma_v3}
        as: ClubAdmin
      assert:
      - immediately after the lapse call, Member.${ma_id}.status == LAPSED
      - after the dues payment, Member.${ma_id}.status == ACTIVE
      - Member.${ma_id}.dues_paid_through == 2028-05-19T00:00:00.000Z
      - Member.${ma_id}.dues_grace_until == 2028-06-02T00:00:00.000Z
      - Member.${ma_id}.lifetime_dues_paid_cents == 18000
