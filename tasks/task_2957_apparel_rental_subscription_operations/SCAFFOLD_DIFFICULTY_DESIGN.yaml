      - name: resale_sale_reuses_fee_pct_frozen_at_listing_tier
        grounds:
          - "1.3 calculation resale_pricing with constants TIER_MID_FLOOR_CENTS, TIER_HIGH_FLOOR_CENTS, CHANNEL_FEE_PCT, CHANNEL_HANDLING_CENTS and MAX_SALE_DISCOUNT_PCT"
          - "1.5 POST /resale-listings and POST /resale-listings/{listing_id}/sale"
          - "1.1 ResaleListing.base_price_cents, list_price_cents, channel_fee_cents, net_recovery_cents, sale_price_cents"
          - "1.4 validation priority 55 ERR_SALE_PRICE_BELOW_FLOOR"
          - "1.2 RentalUnit availability_state RETIRED to SOLD"
        distinguishing_aspect: >-
          The dependency looks circular: channel_fee_cents is a percentage of the price, and the minimum legal sale
          price is a percentage of the list price that already had that fee subtracted from it. The scaffold pins the
          order - the fee tier is resolved once from base_price_cents when the listing is created and is then frozen
          for the life of the listing. base_price_cents 21600 lands in tier HIGH, so PARTNER_RESALE fee_pct is 0.22
          forever. Selling at the exact floor of 19440 therefore yields channel_fee_cents 4277 and net_recovery_cents
          14263, whereas re-deriving the tier from the sale price (19440 is below TIER_HIGH_FLOOR_CENTS 20000, so tier
          MID at 0.18) would yield 3499 and 15041. The two orders differ by 778 cents on the fee, so the assertion
          pins the evaluation order and nothing else.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 with retail_price_cents 48000 and one grade-A size-M unit that has never rented"
            - "the unit is retired with retirement_reason PLANNED_REFRESH, which is legal because no reservation holds it and no claim is open on it"
            - "the retirement response version is captured so the listing can pass the optimistic-concurrency check on expected_rental_unit_version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-01-M-004", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /rental-units/${unit1_id}/retirement"
              payload: { retirement_reason: "PLANNED_REFRESH" }
              as: InventoryPlanner
              captures: { unit1_version: "$.data.version" }
          trigger:
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${unit1_version}", channel: "PARTNER_RESALE" }
              as: InventoryPlanner
              captures: { listing1_id: "$.data.id" }
            - call: "POST /resale-listings/${listing1_id}/sale"
              payload: { sale_price_cents: 19440 }
              as: InventoryPlanner
          assert:
            - "the created listing reports state == LISTED, markdown_step == 0, base_price_cents == 21600 (48000 times RESALE_RATE_BY_GRADE[A] 0.45) and list_price_cents == 21600"
            - "the created listing reports channel_fee_cents == 4752 (round_half_up(21600 * 0.22), the HIGH tier rate for PARTNER_RESALE) and net_recovery_cents == 15948, with floor_adjusted == false"
            - "the sale is accepted at exactly sale_price_cents == 19440, the round_half_up(21600 * 0.90) floor of validation priority 55"
            - "after the sale the listing reports state == SOLD and channel_fee_cents == 4277 == round_half_up(19440 * 0.22)"
            - "after the sale net_recovery_cents == 14263 == 19440 - 4277 - CHANNEL_HANDLING_CENTS[PARTNER_RESALE] 900"
            - "channel_fee_cents is NOT 3499 and net_recovery_cents is NOT 15041, which is what re-deriving the tier from the 19440 sale price (tier MID, 0.18) would produce"
            - "GET /rental-units/{unit_id} reports availability_state == SOLD and realized_revenue_cents == 0, so end-of-life money is reported only through the listing"
  - rule_id: non_linear_state_machine
    instances:
      - name: rental_unit_availability_and_condition_dimensions_advance_independently
        grounds:
          - "1.2 RentalUnit state machine, shape parallel, dimensions availability_state and condition_state"
          - "1.2 RentalUnit transitions FLOOR_READY to NEEDS_CLEANING and NEEDS_CLEANING to FLOOR_READY on the condition dimension"
          - "1.2 RentalUnit transition PROCESSING to IN_STOCK on the availability dimension"
          - "1.5 POST /reverse-logistics-jobs/{job_id}/inspections, cleaning-completion, photography, restock"
          - "1.2 ReverseLogisticsJob transitions RECEIVED to INSPECTED to PROCESSING to READY_FOR_PHOTO to PHOTOGRAPHED to RESTOCKED"
        distinguishing_aspect: >-
          RentalUnit is not a single-path machine: availability_state stays pinned at PROCESSING across three
          consecutive condition_state values (NEEDS_CLEANING, then FLOOR_READY after the cleaning sign-off, then still
          FLOOR_READY after photography) and only moves to IN_STOCK on the restock call, while the condition dimension
          has already finished moving. The combined state (PROCESSING, FLOOR_READY) is reachable and is exactly the
          state the photography precondition requires, so an implementation that collapses the two dimensions into one
          status column - or that flips availability_state to IN_STOCK when the garment becomes FLOOR_READY - fails
          the middle two assertions while still passing the first and last.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "plan SIG4, two certified technicians, style AUR-GOWN-01 and one grade-A size-M unit"
            - "one turn is run to inbound receipt (2026-08-10 to 2026-08-16, received 2026-08-18), which leaves the unit at availability_state PROCESSING with condition_state FLOOR_READY and a ReverseLogisticsJob in RECEIVED"
            - "the inspection reports HEAVY soil with NONE damage, so only the cleaning leg is required and no DamageClaim is opened to block the restock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
