            - { call: "POST /seafood/corrective-actions/${ca_id}/escalate", payload: { reason: "audit finding confirmed", scope_lot_ids: ["${fin_id}"] }, as: ComplianceManager, as_user_id: "cm-01", captures: { recall_id: "$.data.recall_id" } }
          trigger:
