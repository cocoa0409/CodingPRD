scenario: |
  660. Landscape Lighting & Outdoor AV: design & fixture/zone plan, quote & night demo,
  install & transformer/wiring, smart-control programming, seasonal adjustment & service plan,
  warranty & bulb/fixture replacement, add-on (audio/security), route

domain_name: landscape-lighting-outdoor-av
api_prefix: ""

# Expert difficulty. Primary archetype: quota/allocation (a transformer's usable VA is a
# finite pool that zones and their fixtures draw against — a continuous-load budget).
# Secondary archetype: temporal_windowing (smart-control schedule windows on a controller and
# service-visit windows on a crew route must obey distinct overlap/adjacency semantics).
# Complexity layers: optimistic_concurrency (OCC on Transformer.version for fixture-zone
# assignment), cascading_side_effects (warranty replacement / install / removal chains),
# dual_variant_calculation (service-plan refund and warranty replacement credit), and
# rate_threshold_triggers (volume-discount tiers + load-budget boundary).

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Flat with foreign-key references: LightingProject, Zone, Transformer, Fixture, Quote,
  # QuoteLine, InstallJob, ScheduleProgram, ServicePlan, ServiceVisit, CrewRoute,
  # WarrantyClaim, AddOnModule are peer entities linked by FK fields in their bodies (no deep
  # URL nesting beyond /projects/{id}/<segment> and a few /transformers/{id}/<segment> reads).

  state_machine_shape: parallel
  # Parallel dimensions on LightingProject (design_status × commercial_status evolve
  # independently); cyclic revision loop on Quote; branching fork-join on InstallJob;
  # cyclic seasonal loop on ServicePlan; branching on WarrantyClaim and CrewRoute.

  relationship_patterns:
    - one_to_many        # LightingProject -> Zone, Quote, ServicePlan, ServiceVisit
    - flat               # FK references across peers (Fixture.zone_id, Zone.transformer_id)
    - cross_aggregate    # WarrantyClaim references Fixture across the project boundary

  role_model: peer_roles
  # LightingDesigner owns design+quote, InstallTech owns install+wiring+routes,
  # ControlProgrammer owns smart-control schedules, Customer owns acceptance+plan+claims,
  # OperationsAdmin is the opaque operator (clock, plan catalog, overrides).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LightingProject
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the property owner this project belongs to."
      - name: property_address
        type: string
        source: input
        description: "Site address where fixtures are installed."
      - name: design_status
        type: enum
        source: system
        description: "Design dimension of the parallel state machine."
        default: DRAFT
        constraints: "One of {DRAFT, ZONED, DESIGN_LOCKED}."
      - name: commercial_status
        type: enum
        source: system
        description: "Commercial dimension of the parallel state machine; evolves independently of design_status."
        default: PRE_QUOTE
        constraints: "One of {PRE_QUOTE, QUOTED, ACCEPTED, INSTALLED, CLOSED}."
      - name: fixture_count
        type: integer
        source: computed
        description: "Computed count of Fixtures whose zone belongs to this project and whose status IN {PLANNED, INSTALLED}. Excludes REMOVED and FAILED."
        default: 0
      - name: total_committed_load_va
        type: integer
        source: computed
        description: "Computed sum of usable VA committed across all Transformers in this project (see calc transformer_committed_load summed per project)."
        default: 0

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer display name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across Customers."
        constraints: "Unique (case-insensitive)."
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: "Running store credit in cents; debited by paid line items, credited by service-plan refunds and warranty replacement credits."
        default: 0

  - name: Transformer
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> LightingProject.id; the project this transformer is installed for."
      - name: model_code
        type: string
        source: input
        description: "Manufacturer model code."
      - name: rated_capacity_va
        type: integer
        source: input
        description: "Nameplate VA rating of the transformer."
        constraints: "Integer >= 1."
      - name: usable_capacity_va
        type: integer
        source: computed
        description: "floor(rated_capacity_va * DERATE_PCT); the continuous-load budget zones may draw against. See calc transformer_usable_capacity."
        default: 0
      - name: committed_load_va
        type: integer
        source: computed
        description: "Sum of wattage_w over Fixtures in Zones assigned to this transformer whose status IN {PLANNED, INSTALLED}. See calc transformer_committed_load."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Transformer lifecycle."
        default: STAGED
        constraints: "One of {STAGED, ENERGIZED, DECOMMISSIONED}."

  - name: Zone
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> LightingProject.id; the project this zone belongs to."
      - name: transformer_id
        type: string
        source: input
        description: "FK -> Transformer.id; the transformer feeding this zone. Must reference a transformer with the same project_id."
      - name: label
        type: string
        source: input
        description: "Human label, e.g. 'Front Path', 'Patio'."
      - name: zone_load_va
        type: integer
        source: computed
        description: "Sum of wattage_w over Fixtures assigned to this zone whose status IN {PLANNED, INSTALLED}."
        default: 0

  - name: Fixture
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the zone (and thus transformer) this fixture draws from. null while unassigned."
        default: null
      - name: project_id
        type: string
        source: input
        description: "FK -> LightingProject.id; the project this fixture is planned for."
      - name: model_code
        type: string
        source: input
        description: "Fixture model code, e.g. 'PATH-3W', 'SPOT-9W'."
      - name: category
        type: enum
        source: input
        description: "Fixture category."
        constraints: "One of {PATH, SPOT, WELL, STEP, AUDIO, SECURITY}."
      - name: wattage_w
        type: integer
        source: input
        description: "Continuous draw in watts (treated 1 W = 1 VA for budget purposes)."
        constraints: "Integer >= 0."
      - name: purchase_price_cents
        type: integer
        source: input
        description: "Unit purchase price in cents; basis for warranty replacement credit."
        constraints: "Integer >= 0."
      - name: warranty_months
        type: integer
        source: input
        description: "Total warranty term in months from install."
        default: 60
        constraints: "Integer >= 1."
      - name: installed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp set when this fixture transitions PLANNED->INSTALLED; null while PLANNED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Fixture lifecycle."
        default: PLANNED
        constraints: "One of {PLANNED, INSTALLED, FAILED, REMOVED}."

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> LightingProject.id; the project being quoted."
      - name: night_demo_requested
        type: boolean
        source: input
        description: "Whether a paid night demo is included in the quote."
        default: false
      - name: night_demo_at
        type: datetime
        source: input
        description: "Scheduled night-demo timestamp; required iff night_demo_requested is true."
        default: null
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of QuoteLine.line_total_cents over this quote's lines. See calc quote_pricing."
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: "Volume-tier discount applied to the summed subtotal. See calc quote_pricing."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax on the taxable base, computed once after discount and demo fee. See calc quote_pricing."
        default: 0
      - name: grand_total_cents
        type: integer
        source: computed
        description: "Final amount the customer accepts. See calc quote_pricing."
        default: 0
      - name: revision_round
        type: integer
        source: system
        description: "Increments each time a SENT quote is returned to DRAFT for revision."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle (cyclic revision loop)."
        default: DRAFT
        constraints: "One of {DRAFT, SENT, ACCEPTED, REJECTED, EXPIRED}."

  - name: QuoteLine
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the quote this line belongs to."
      - name: model_code
        type: string
        source: input
        description: "Fixture/add-on model being quoted."
      - name: quantity
        type: integer
        source: input
        description: "Number of units on this line."
        constraints: "Integer >= 1."
      - name: unit_price_cents
        type: integer
        source: input
        description: "Per-unit price in cents."
        constraints: "Integer >= 0."
      - name: line_total_cents
        type: integer
        source: computed
        description: "quantity * unit_price_cents."
        default: 0

  - name: InstallJob
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> LightingProject.id; the project being installed."
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the accepted quote authorizing this install."
      - name: wiring_status
        type: enum
        source: system
        description: "Wiring branch of the install fork-join."
        default: PENDING
        constraints: "One of {PENDING, WIRED}."
      - name: fixtures_status
        type: enum
        source: system
        description: "Fixture-mounting branch of the install fork-join."
        default: PENDING
        constraints: "One of {PENDING, MOUNTED}."
      - name: status
        type: enum
        source: system
        description: "Overall install lifecycle; reaches ENERGIZED only when both branches complete (join)."
        default: SCHEDULED
        constraints: "One of {SCHEDULED, IN_PROGRESS, ENERGIZED, CANCELLED}."

  - name: ScheduleProgram
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> LightingProject.id; the project whose controller this program runs on."
      - name: scene_label
        type: string
        source: input
        description: "Scene name, e.g. 'Evening Warm', 'Security Flash'."
      - name: window_start_min
        type: integer
        source: input
        description: "Minutes-after-midnight window start (inclusive)."
        constraints: "Integer 0..1439."
      - name: window_end_min
        type: integer
        source: input
        description: "Minutes-after-midnight window end (exclusive). Must be > window_start_min."
        constraints: "Integer 1..1440."
      - name: status
        type: enum
        source: system
        description: "Program lifecycle."
        default: DRAFT
        constraints: "One of {DRAFT, ACTIVE, DISABLED}."

  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> LightingProject.id; the project covered by this plan."
      - name: tier
        type: enum
        source: input
        description: "Service tier."
        constraints: "One of {BASIC, PREMIUM}."
      - name: annual_fee_cents
        type: integer
        source: input
        description: "Prepaid annual fee in cents."
        constraints: "Integer >= 0."
      - name: refundable
        type: boolean
        source: input
        description: "Whether cancellation is always prorate-refundable regardless of elapsed days."
        default: false
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp set when the plan transitions PENDING->ACTIVE; basis for proration."
        default: null
      - name: season_cycle_count
        type: integer
        source: system
        description: "Number of completed seasonal adjustment cycles (ACTIVE->ADJUSTING->ACTIVE)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle (cyclic seasonal loop)."
        default: PENDING
        constraints: "One of {PENDING, ACTIVE, ADJUSTING, CANCELLED}."

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - name: service_plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan this visit is performed under."
      - name: project_id
        type: string
        source: input
        description: "FK -> LightingProject.id; redundant link for project-scoped listing."
      - name: visit_date
        type: string
        source: input
        description: "Calendar date YYYY-MM-DD on which the visit occurs (basis for route grouping)."
      - name: window_start_min
        type: integer
        source: input
        description: "Requested arrival window start, minutes-after-midnight (inclusive)."
        constraints: "Integer 0..1439."
      - name: window_end_min
        type: integer
        source: input
        description: "Requested arrival window end, minutes-after-midnight (exclusive). Must be > window_start_min."
        constraints: "Integer 1..1440."
      - name: route_id
        type: string
        source: input
        description: "FK -> CrewRoute.id; the route this visit is sequenced on; null while unrouted."
        default: null
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle."
        default: REQUESTED
        constraints: "One of {REQUESTED, ROUTED, COMPLETED, MISSED}."

  - name: CrewRoute
    parent: null
    common_fields: true
    fields:
      - name: technician_id
        type: string
        source: input
        description: "Opaque InstallTech operator identifier the route belongs to."
      - name: route_date
        type: string
        source: input
        description: "Calendar date YYYY-MM-DD the route covers."
      - name: visit_count
        type: integer
        source: computed
        description: "Count of ServiceVisits whose route_id equals this route and whose status IN {ROUTED, COMPLETED}."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Route lifecycle."
        default: OPEN
        constraints: "One of {OPEN, DISPATCHED, COMPLETED}."

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: fixture_id
        type: string
        source: input
        description: "FK -> Fixture.id; the failed fixture being claimed."
      - name: project_id
        type: string
        source: input
        description: "FK -> LightingProject.id; project the fixture belongs to."
      - name: reason
        type: string
        source: input
        description: "Failure description."
      - name: credit_variant
        type: enum
        source: computed
        description: "Which replacement-credit variant was applied. See calc warranty_replacement_credit."
        default: null
        constraints: "One of {FULL, DEPRECIATED} when APPROVED; null otherwise."
      - name: credit_cents
        type: integer
        source: computed
        description: "Store credit granted to the customer on approval. See calc warranty_replacement_credit."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle (branching: APPROVED vs DENIED)."
        default: SUBMITTED
        constraints: "One of {SUBMITTED, APPROVED, DENIED}."

  - name: AddOnModule
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> LightingProject.id; the project this add-on attaches to."
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the zone whose transformer powers this add-on; null for self-powered modules."
        default: null
      - name: kind
        type: enum
        source: input
        description: "Add-on kind."
        constraints: "One of {AUDIO, SECURITY}."
      - name: power_draw_va
        type: integer
        source: input
        description: "VA the module draws from its zone's transformer when zone_id is set."
        constraints: "Integer >= 0."
      - name: status
        type: enum
        source: system
        description: "Add-on lifecycle."
        default: PROPOSED
        constraints: "One of {PROPOSED, ACTIVE, REMOVED}."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- LightingProject: PARALLEL dimensions (design_status × commercial_status) ----
  - entity: LightingProject
    initial_state: "design_status=DRAFT; commercial_status=PRE_QUOTE"
    terminal_states: ["commercial_status=CLOSED"]
    transitions:
      - from: "design_status=DRAFT"
        to: "design_status=ZONED"
        trigger: "POST /projects/{id}/zones (first zone created on the project)"
        actor: LightingDesigner
        preconditions:
          - "project exists"
          - "at least one Transformer exists for the project before the first Zone references it"
        side_effects:
          - "design_status set to ZONED on first zone creation"
          - "increments LightingProject.version by 1"
      - from: "design_status=ZONED"
        to: "design_status=DESIGN_LOCKED"
        trigger: "POST /projects/{id}/lock-design"
        actor: LightingDesigner
        preconditions:
          - "design_status == ZONED"
          - "every Fixture with project_id == this project and status == PLANNED has a non-null zone_id"
        side_effects:
          - "design_status set to DESIGN_LOCKED"
          - "no further Zone creation or Fixture->Zone reassignment permitted while DESIGN_LOCKED and commercial_status not yet INSTALLED"
          - "increments LightingProject.version by 1"
      - from: "commercial_status=PRE_QUOTE"
        to: "commercial_status=QUOTED"
        trigger: "POST /quotes/{id}/send (first quote sent for the project)"
        actor: LightingDesigner
        preconditions:
          - "design_status == DESIGN_LOCKED"
          - "quote.project_id == this project"
        side_effects:
          - "commercial_status set to QUOTED"
          - "increments LightingProject.version by 1"
      - from: "commercial_status=QUOTED"
        to: "commercial_status=ACCEPTED"
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "commercial_status == QUOTED"
          - "quote.status == SENT"
        side_effects:
          - "commercial_status set to ACCEPTED"
          - "Customer.wallet_credit_cents debited by quote.grand_total_cents (CASCADE: project accept -> customer ledger)"
          - "increments LightingProject.version by 1"
      - from: "commercial_status=ACCEPTED"
        to: "commercial_status=INSTALLED"
        trigger: "system event when InstallJob for this project transitions to ENERGIZED"
        actor: system
        preconditions:
          - "commercial_status == ACCEPTED"
          - "InstallJob.status == ENERGIZED"
        side_effects:
          - "commercial_status set to INSTALLED"
          - "increments LightingProject.version by 1"
      - from: "commercial_status=INSTALLED"
        to: "commercial_status=CLOSED"
        trigger: "POST /projects/{id}/close"
        actor: OperationsAdmin
        preconditions:
          - "commercial_status == INSTALLED"
          - "no ServicePlan for this project in status IN {PENDING, ADJUSTING}"
        side_effects:
          - "commercial_status set to CLOSED (terminal)"
          - "increments LightingProject.version by 1"

  # ---- Transformer ----
  - entity: Transformer
    initial_state: STAGED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: STAGED
        to: ENERGIZED
        trigger: "system event when the InstallJob whose project_id matches reaches wiring_status WIRED"
        actor: system
        preconditions:
          - "transformer.status == STAGED"
          - "InstallJob.wiring_status == WIRED for the transformer's project"
        side_effects:
          - "status set to ENERGIZED"
      - from: ENERGIZED
        to: DECOMMISSIONED
        trigger: "POST /transformers/{id}/decommission"
        actor: InstallTech
        preconditions:
          - "transformer.status == ENERGIZED"
          - "no Zone on this transformer has a Fixture in status IN {PLANNED, INSTALLED}"
        side_effects:
          - "status set to DECOMMISSIONED (terminal)"

  # ---- Fixture (cross-entity guarded + cascade source) ----
  - entity: Fixture
    initial_state: PLANNED
    terminal_states: [REMOVED]
    transitions:
      - from: PLANNED
        to: PLANNED
        trigger: "POST /fixtures/{id}/assign-zone"
        actor: LightingDesigner
        preconditions:
          - "fixture.status == PLANNED"
          - "target Zone exists and zone.project_id == fixture.project_id"
          - "owning project design_status != DESIGN_LOCKED"
          - "assigning would NOT push the zone's transformer committed_load_va above usable_capacity_va (boundary: committed == usable allowed)"
          - "expected_transformer_version matches the target zone's transformer.version (OCC)"
        side_effects:
          - "fixture.zone_id set to target zone"
          - "Zone.zone_load_va recomputed (+ fixture.wattage_w)"
          - "Transformer.committed_load_va recomputed (CASCADE: fixture assign -> zone load -> transformer load)"
          - "LightingProject.total_committed_load_va recomputed"
          - "increments target Transformer.version by 1"
        note: "Self-loop on PLANNED; assignment changes fields, not the fixture's lifecycle state."
      - from: PLANNED
        to: INSTALLED
        trigger: "system event when InstallJob.fixtures_status transitions to MOUNTED (cascade over PLANNED fixtures with a zone)"
        actor: system
        preconditions:
          - "fixture.status == PLANNED"
          - "fixture.zone_id is non-null"
        side_effects:
          - "status set to INSTALLED"
          - "installed_at stamped from logical clock"
      - from: INSTALLED
        to: FAILED
        trigger: "POST /warranty-claims (submitting a claim against this fixture)"
        actor: Customer
        preconditions:
          - "fixture.status == INSTALLED"
        side_effects:
          - "status set to FAILED (CASCADE link 1: claim submit -> fixture FAILED)"
          - "Zone.zone_load_va recomputed (- fixture.wattage_w because FAILED leaves the {PLANNED,INSTALLED} set)"
          - "Transformer.committed_load_va recomputed (CASCADE link 2: fixture FAILED -> zone load -> transformer load)"
      - from: FAILED
        to: INSTALLED
        trigger: "system event when WarrantyClaim transitions SUBMITTED->APPROVED (replacement re-energized)"
        actor: system
        preconditions:
          - "fixture.status == FAILED"
          - "claim.status transitioning to APPROVED"
        side_effects:
          - "status set back to INSTALLED (replacement fixture energized)"
          - "installed_at re-stamped from logical clock"
          - "Zone.zone_load_va recomputed (+ fixture.wattage_w)"
          - "Transformer.committed_load_va recomputed"
      - from: INSTALLED
        to: REMOVED
        trigger: "POST /fixtures/{id}/remove"
        actor: InstallTech
        preconditions:
          - "fixture.status == INSTALLED"
        side_effects:
          - "status set to REMOVED (terminal)"
          - "Zone.zone_load_va recomputed (- fixture.wattage_w)"
          - "Transformer.committed_load_va recomputed"

  # ---- Quote: CYCLIC revision loop ----
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /quotes/{id}/send"
        actor: LightingDesigner
        preconditions:
          - "quote.status == DRAFT"
          - "quote has at least one QuoteLine"
          - "owning project design_status == DESIGN_LOCKED"
        side_effects:
          - "recompute quote pricing (subtotal_cents, discount_cents, tax_cents, grand_total_cents) via calc quote_pricing"
          - "status set to SENT"
          - "if this is the project's first send, project commercial_status PRE_QUOTE->QUOTED"
      - from: SENT
        to: DRAFT
        trigger: "POST /quotes/{id}/revise"
        actor: LightingDesigner
        preconditions:
          - "quote.status == SENT"
        side_effects:
          - "status set back to DRAFT (CYCLE)"
          - "revision_round incremented by 1"
        note: "Revision loop DRAFT->SENT->DRAFT; new lines may be added before re-sending."
      - from: SENT
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "quote.status == SENT"
          - "project commercial_status == QUOTED"
        side_effects:
          - "status set to ACCEPTED (terminal)"
          - "project commercial_status QUOTED->ACCEPTED"
          - "Customer.wallet_credit_cents debited by grand_total_cents"
      - from: SENT
        to: REJECTED
        trigger: "POST /quotes/{id}/reject"
        actor: Customer
        preconditions:
          - "quote.status == SENT"
        side_effects:
          - "status set to REJECTED (terminal)"
      - from: SENT
        to: EXPIRED
        trigger: "system event when logical clock passes the quote's 14-day validity from the last send"
        actor: system
        preconditions:
          - "quote.status == SENT"
          - "logical clock >= send_time + 14 days"
        side_effects:
          - "status set to EXPIRED (terminal)"
        note: "Evaluated lazily on any GET /quotes/{id} read or on accept/reject attempt."

  # ---- InstallJob: BRANCHING fork-join (wiring branch + fixtures branch -> ENERGIZED) ----
  - entity: InstallJob
    initial_state: SCHEDULED
    terminal_states: [ENERGIZED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /install-jobs/{id}/start"
        actor: InstallTech
        preconditions:
          - "install.status == SCHEDULED"
          - "the referenced Quote.status == ACCEPTED"
        side_effects:
          - "status set to IN_PROGRESS"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /install-jobs/{id}/complete-wiring"
        actor: InstallTech
        preconditions:
          - "install.status == IN_PROGRESS"
          - "wiring_status == PENDING"
        side_effects:
          - "wiring_status set to WIRED (BRANCH A)"
          - "every Transformer with project_id == install.project_id and status == STAGED -> ENERGIZED"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /install-jobs/{id}/complete-fixtures"
        actor: InstallTech
        preconditions:
          - "install.status == IN_PROGRESS"
          - "fixtures_status == PENDING"
          - "wiring_status == WIRED (fixtures may only be mounted onto energized wiring)"
        side_effects:
          - "fixtures_status set to MOUNTED (BRANCH B)"
          - "every Fixture with project_id == install.project_id, status == PLANNED, zone_id non-null -> INSTALLED (installed_at stamped)"
      - from: IN_PROGRESS
        to: ENERGIZED
        trigger: "system event when BOTH wiring_status == WIRED and fixtures_status == MOUNTED (JOIN)"
        actor: system
        preconditions:
          - "install.status == IN_PROGRESS"
          - "wiring_status == WIRED AND fixtures_status == MOUNTED"
        side_effects:
          - "status set to ENERGIZED (terminal)"
          - "project commercial_status ACCEPTED->INSTALLED (CASCADE)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /install-jobs/{id}/cancel"
        actor: InstallTech
        preconditions:
          - "install.status == SCHEDULED"
        side_effects:
          - "status set to CANCELLED (terminal)"

  # ---- ScheduleProgram ----
  - entity: ScheduleProgram
    initial_state: DRAFT
    terminal_states: [DISABLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /schedule-programs/{id}/activate"
        actor: ControlProgrammer
        preconditions:
          - "program.status == DRAFT"
          - "owning project commercial_status == INSTALLED"
          - "no other ScheduleProgram on the same project with status == ACTIVE has a window within TRANSITION_BUFFER_MIN minutes of this program's window (buffered overlap rule)"
        side_effects:
          - "status set to ACTIVE"
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /schedule-programs/{id}/disable"
        actor: ControlProgrammer
        preconditions:
          - "program.status == ACTIVE"
        side_effects:
          - "status set to DISABLED (terminal)"

  # ---- ServicePlan: CYCLIC seasonal loop ----
  - entity: ServicePlan
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /service-plans/{id}/activate"
        actor: Customer
        preconditions:
          - "plan.status == PENDING"
          - "owning project commercial_status == INSTALLED"
        side_effects:
          - "status set to ACTIVE"
          - "activated_at stamped from logical clock"
          - "Customer.wallet_credit_cents debited by annual_fee_cents"
      - from: ACTIVE
        to: ADJUSTING
        trigger: "POST /service-plans/{id}/begin-seasonal-adjustment"
        actor: InstallTech
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "status set to ADJUSTING"
      - from: ADJUSTING
        to: ACTIVE
        trigger: "POST /service-plans/{id}/complete-seasonal-adjustment"
        actor: InstallTech
        preconditions:
          - "plan.status == ADJUSTING"
        side_effects:
          - "status set back to ACTIVE (CYCLE)"
          - "season_cycle_count incremented by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /service-plans/{id}/cancel"
        actor: Customer
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "status set to CANCELLED (terminal)"
          - "Customer.wallet_credit_cents credited by refund per calc service_plan_refund (variant PRORATED or FORFEIT)"

  # ---- ServiceVisit ----
  - entity: ServiceVisit
    initial_state: REQUESTED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: REQUESTED
        to: ROUTED
        trigger: "POST /crew-routes/{id}/add-visit"
        actor: InstallTech
        preconditions:
          - "visit.status == REQUESTED"
          - "route.status == OPEN"
          - "visit.visit_date == route.route_date"
          - "visit window does not overlap any already-ROUTED visit on this route (half-open overlap rule)"
        side_effects:
          - "visit.route_id set to route; status set to ROUTED"
          - "CrewRoute.visit_count recomputed"
      - from: ROUTED
        to: COMPLETED
        trigger: "system event when CrewRoute transitions DISPATCHED->COMPLETED"
        actor: system
        preconditions:
          - "visit.status == ROUTED"
        side_effects:
          - "status set to COMPLETED (terminal)"
      - from: REQUESTED
        to: MISSED
        trigger: "system event when logical clock passes the visit_date end-of-day and the visit is still REQUESTED (unrouted)"
        actor: system
        preconditions:
          - "visit.status == REQUESTED"
          - "logical clock date > visit_date"
        side_effects:
          - "status set to MISSED (terminal)"
        note: "Evaluated lazily on GET /service-visits/{id}."

  # ---- CrewRoute: BRANCHING (dispatch then complete; cross-entity bubble to visits) ----
  - entity: CrewRoute
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /crew-routes/{id}/dispatch"
        actor: InstallTech
        preconditions:
          - "route.status == OPEN"
          - "at least one ServiceVisit with route_id == this route and status == ROUTED"
        side_effects:
          - "status set to DISPATCHED"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /crew-routes/{id}/complete"
        actor: InstallTech
        preconditions:
          - "route.status == DISPATCHED"
        side_effects:
          - "status set to COMPLETED (terminal)"
          - "every ServiceVisit with route_id == this route and status == ROUTED -> COMPLETED (CASCADE bubble route->visits)"

  # ---- WarrantyClaim: BRANCHING (APPROVED vs DENIED) ----
  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: OperationsAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "fixture.status == FAILED"
          - "fixture is within warranty: age_months < fixture.warranty_months (age_months = floor((clock_now - installed_at)/30 days)); else ERR_OUT_OF_WARRANTY"
        side_effects:
          - "status set to APPROVED (BRANCH)"
          - "credit_variant and credit_cents computed via calc warranty_replacement_credit"
          - "Customer.wallet_credit_cents credited by credit_cents (CASCADE: claim approve -> customer ledger)"
          - "fixture FAILED->INSTALLED (replacement re-energized; installed_at re-stamped; zone+transformer load recomputed)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: OperationsAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "status set to DENIED (BRANCH; fixture remains FAILED, no credit)"

  # ---- AddOnModule ----
  - entity: AddOnModule
    initial_state: PROPOSED
    terminal_states: [REMOVED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /add-ons/{id}/activate"
        actor: ControlProgrammer
        preconditions:
          - "addon.status == PROPOSED"
          - "owning project commercial_status == INSTALLED"
          - "if zone_id is set: activating must NOT push the zone's transformer committed_load_va above usable_capacity_va (add-on draw counts toward the budget; boundary == usable allowed)"
        side_effects:
          - "status set to ACTIVE"
          - "if zone_id set: Transformer.committed_load_va recomputed including this add-on's power_draw_va"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /add-ons/{id}/remove"
        actor: ControlProgrammer
        preconditions:
          - "addon.status == ACTIVE"
        side_effects:
          - "status set to REMOVED (terminal)"
          - "if zone_id set: Transformer.committed_load_va recomputed (- power_draw_va)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: fixture-assign-stale-transformer
    parent_entity: Transformer
    write_endpoint: "POST /fixtures/{id}/assign-zone"
    occ_field: "expected_transformer_version"
    description: |
      Assigning a Fixture into a Zone draws additional VA against that zone's
      Transformer's usable budget. If the Transformer's version has advanced since
      the client last observed it — because another assignment (or an add-on
      activation) already drew load it cannot see — the assignment is rejected as
      stale. This is the CREATE-with-supersede case: the second assignment would
      itself legitimately succeed against the load the client last observed, but
      its view of the transformer is out of date, so it must re-read and retry.
    error_id: ERR_STALE_TRANSFORMER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: transformer_usable_capacity
    trigger: "on Transformer create and on read of usable_capacity_va"
    algorithm: threshold
    formula: |
      usable_capacity_va = floor(rated_capacity_va * DERATE_PCT)
    input_set: "single Transformer's rated_capacity_va"
    constants:
      DERATE_PCT: 0.80
    precision: "integer VA, floor"
    variants: []

  - name: transformer_committed_load
    trigger: "recomputed on Fixture assign-zone / install / fail / remove and on AddOnModule activate/remove; read of committed_load_va"
    algorithm: aggregation
    formula: |
      committed_load_va =
          sum(fixture.wattage_w
              for fixture in Fixtures
              if fixture.zone.transformer_id == transformer.id
                 and fixture.status IN {PLANNED, INSTALLED})
        + sum(addon.power_draw_va
              for addon in AddOnModules
              if addon.zone.transformer_id == transformer.id
                 and addon.status == ACTIVE
                 and addon.zone_id is non-null)
    input_set: "Fixtures in {PLANNED, INSTALLED} and AddOnModules in {ACTIVE} whose zone's transformer is this transformer; FAILED/REMOVED fixtures and PROPOSED/REMOVED add-ons excluded"
    constants: {}
    precision: "integer VA, exact sum (no rounding)"
    variants: []
    note: "Capacity gate: an assign/activate is rejected when the post-action committed_load_va would be > usable_capacity_va. Boundary committed_load_va == usable_capacity_va is allowed (<=)."

  - name: quote_pricing
    trigger: "on POST /quotes/{id}/send (recompute before SENT)"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order — sum-then-discount-then-fee-then-tax:
      subtotal_cents = sum(line.quantity * line.unit_price_cents for line in quote lines)
      total_fixture_qty = sum(line.quantity for line in quote lines)
      tier_pct = volume_tier(total_fixture_qty)   # see constants below
      discount_cents = floor(subtotal_cents * tier_pct)        # floor, computed on summed subtotal
      demo_fee_cents = NIGHT_DEMO_FEE_CENTS if quote.night_demo_requested else 0
      taxable_base_cents = subtotal_cents - discount_cents + demo_fee_cents
      tax_cents = round_half_up(taxable_base_cents * TAX_RATE)  # tax once, on the base
      grand_total_cents = taxable_base_cents + tax_cents
    input_set: "all QuoteLines belonging to the quote at send time"
    constants:
      NIGHT_DEMO_FEE_CENTS: 15000
      TAX_RATE: 0.0825
      VOLUME_TIERS: "qty < 10 -> 0.00; 10 <= qty < 25 -> 0.05; 25 <= qty < 50 -> 0.10; qty >= 50 -> 0.15"
    precision: "integer cents; discount floored; tax round_half_up on taxable base; tier breakpoints use >= (10/25/50 inclusive into the higher tier)"
    variants: []
    note: |
      Combinatorial mode (a) [tiered-rate selection with >=3 inputs] AND mode (b)
      [rounding order pinned: discount on summed subtotal, tax once on the base,
      NOT per-line] both exercised here.

  - name: service_plan_refund
    trigger: "on POST /service-plans/{id}/cancel (ACTIVE->CANCELLED)"
    algorithm: decay_function
    formula: |
      elapsed_days = floor((clock_now - plan.activated_at) / 1 day)
      unused_days  = max(0, 365 - elapsed_days)
      if plan.refundable == true OR elapsed_days <= REFUND_GRACE_DAYS:
          # variant PRORATED
          refund_cents = round_half_up(plan.annual_fee_cents * unused_days / 365)
      else:
          # variant FORFEIT
          refund_cents = 0
    input_set: "single ServicePlan; clock and activated_at"
    constants:
      REFUND_GRACE_DAYS: 30
    precision: "integer cents, round_half_up; 365-day year"
    variants:
      - name: PRORATED
        when: "plan.refundable == true OR elapsed_days <= 30"
        difference: "refund = round_half_up(annual_fee_cents * unused_days / 365)"
      - name: FORFEIT
        when: "plan.refundable == false AND elapsed_days > 30"
        difference: "refund = 0 (whole prepaid fee forfeited)"

  - name: warranty_replacement_credit
    trigger: "on POST /warranty-claims/{id}/approve (SUBMITTED->APPROVED)"
    algorithm: decay_function
    formula: |
      age_months = floor((clock_now - fixture.installed_at) / 30 days)   # pinned 30-day months
      if age_months <= FULL_WINDOW_MONTHS:
          # variant FULL
          credit_cents = fixture.purchase_price_cents
      else:
          # variant DEPRECIATED
          remaining = fixture.warranty_months - age_months
          credit_cents = round_half_up(fixture.purchase_price_cents * remaining / fixture.warranty_months)
      # approval precondition (validation priority 13) rejects age_months >= warranty_months, so this
      # branch only runs for 12 < age_months < warranty_months, guaranteeing remaining >= 1.
    input_set: "single Fixture; clock and installed_at and warranty_months"
    constants:
      FULL_WINDOW_MONTHS: 12
    precision: "integer cents, round_half_up; 30-day months, floored age"
    variants:
      - name: FULL
        when: "age_months <= 12"
        difference: "credit = full purchase_price_cents"
      - name: DEPRECIATED
        when: "12 < age_months < warranty_months"
        difference: "credit = round_half_up(purchase_price_cents * (warranty_months - age_months) / warranty_months)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path/body id references an existing resource, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path/body ids"

  - priority: 4
    category: business_constraint
    check: "request body has all required fields with correct types/enum membership; pagination limit within [1,100]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and list endpoints"

  - priority: 5
    category: business_referential
    check: "a Zone's transformer_id references a Transformer with the same project_id; a Fixture's zone_id references a Zone with the same project_id; a QuoteLine's quote belongs to the same project the actor is operating on"
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 409
    applies_to: "POST /projects/{id}/zones, POST /fixtures/{id}/assign-zone, POST /quotes/{id}/lines"

  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_transformer_version equals the target zone's Transformer.version"
    error_id: ERR_STALE_TRANSFORMER_VERSION
    http_status: 412
    applies_to: "POST /fixtures/{id}/assign-zone"

  - priority: 8
    category: business_safety
    check: "fixtures may only be mounted onto energized wiring: complete-fixtures requires wiring_status == WIRED"
    error_id: ERR_WIRING_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /install-jobs/{id}/complete-fixtures"

  - priority: 9
    category: business_constraint
    check: "design lock requires every PLANNED fixture on the project to have a non-null zone_id"
    error_id: ERR_UNZONED_FIXTURE
    http_status: 409
    applies_to: "POST /projects/{id}/lock-design"

  - priority: 10
    category: business_temporal
    check: "adding a ServiceVisit to a CrewRoute is rejected if its half-open [start,end) window overlaps any already-ROUTED visit's window on the same route (touching at a boundary is allowed)"
    error_id: ERR_VISIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /crew-routes/{id}/add-visit"

  - priority: 11
    category: business_temporal
    check: "activating a ScheduleProgram is rejected if its window is within TRANSITION_BUFFER_MIN minutes of any ACTIVE program's window on the same project (closed-with-buffer: gap must be >= 5 minutes on both sides; touching is NOT enough)"
    error_id: ERR_SCENE_WINDOW_TOO_CLOSE
    http_status: 409
    applies_to: "POST /schedule-programs/{id}/activate"

  - priority: 12
    category: business_fiscal
    check: "assigning a fixture or activating a zone-powered add-on is rejected when the resulting committed_load_va would exceed usable_capacity_va (post-action > usable; == usable allowed)"
    error_id: ERR_TRANSFORMER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fixtures/{id}/assign-zone, POST /add-ons/{id}/activate"

  - priority: 13
    category: business_temporal
    check: "approving a warranty claim is rejected when the fixture is out of warranty, i.e. age_months >= fixture.warranty_months where age_months = floor((clock_now - installed_at) / 30 days). Boundary: age_months == warranty_months is OUT (rejected)."
    error_id: ERR_OUT_OF_WARRANTY
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/approve"

  - priority: 14
    category: business_constraint
    check: "window_end_min must be strictly greater than window_start_min for ScheduleProgram and ServiceVisit"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "POST /schedule-programs, POST /service-visits"

  - priority: 15
    category: business_constraint
    check: "night_demo_at is required when night_demo_requested is true"
    error_id: ERR_DEMO_TIME_REQUIRED
    http_status: 400
    applies_to: "POST /quotes"

  - priority: 16
    category: business_constraint
    check: "Customer email uniqueness (case-insensitive) on create"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /customers"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Customer -----
  - method: POST
    path: "/customers"
    description: "Register a customer."
    roles: [OperationsAdmin]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: ["wallet_credit_cents initialized to 0"]

  - method: GET
    path: "/customers/{id}"
    description: "Read a customer (includes wallet_credit_cents)."
    roles: [OperationsAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ----- LightingProject -----
  - method: POST
    path: "/projects"
    description: "Create a lighting project."
    roles: [LightingDesigner, OperationsAdmin]
    code: 201
    input: [customer_id, property_address]
    output: LightingProject
    side_effects: ["design_status=DRAFT, commercial_status=PRE_QUOTE"]

  - method: GET
    path: "/projects/{id}"
    description: "Read a project including computed fixture_count and total_committed_load_va."
    roles: [LightingDesigner, InstallTech, ControlProgrammer, Customer, OperationsAdmin]
    code: 200
    input: []
    output: LightingProject
    side_effects: []

  - method: GET
    path: "/projects"
    description: "List projects, filterable by customer."
    roles: [OperationsAdmin, LightingDesigner]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: LightingProject[]
    side_effects: []

  - method: POST
    path: "/projects/{id}/lock-design"
    description: "Lock the design (ZONED -> DESIGN_LOCKED)."
    roles: [LightingDesigner]
    code: 200
    input: []
    output: LightingProject
    side_effects: ["design_status=DESIGN_LOCKED", "increments LightingProject.version by 1"]

  - method: POST
    path: "/projects/{id}/close"
    description: "Close an installed project (INSTALLED -> CLOSED)."
    roles: [OperationsAdmin]
    code: 200
    input: []
    output: LightingProject
    side_effects: ["commercial_status=CLOSED", "increments LightingProject.version by 1"]

  # ----- Transformer -----
  - method: POST
    path: "/transformers"
    description: "Create a transformer for a project."
    roles: [LightingDesigner]
    code: 201
    input: [project_id, model_code, rated_capacity_va]
    output: Transformer
    side_effects: ["usable_capacity_va computed via calc transformer_usable_capacity", "status=STAGED"]

  - method: GET
    path: "/transformers/{id}"
    description: "Read a transformer including usable_capacity_va and committed_load_va and version."
    roles: [LightingDesigner, InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: Transformer
    side_effects: []

  - method: GET
    path: "/projects/{id}/transformers"
    description: "List transformers for a project (reverse-reachability for Transformer.project_id)."
    roles: [LightingDesigner, InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: Transformer[]
    side_effects: []

  - method: GET
    path: "/transformers/{id}/zones"
    description: "List zones fed by a transformer (reverse-reachability for Zone.transformer_id)."
    roles: [LightingDesigner, InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: Zone[]
    side_effects: []

  - method: POST
    path: "/transformers/{id}/decommission"
    description: "Decommission a transformer (ENERGIZED -> DECOMMISSIONED)."
    roles: [InstallTech]
    code: 200
    input: []
    output: Transformer
    side_effects: ["status=DECOMMISSIONED"]

  # ----- Zone -----
  - method: POST
    path: "/projects/{id}/zones"
    description: "Create a zone under a project (first zone sets design_status ZONED)."
    roles: [LightingDesigner]
    code: 201
    input: [transformer_id, label]
    output: Zone
    side_effects: ["design_status DRAFT->ZONED on first zone", "increments LightingProject.version by 1"]

  - method: GET
    path: "/zones/{id}"
    description: "Read a zone including zone_load_va."
    roles: [LightingDesigner, InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: Zone
    side_effects: []

  - method: GET
    path: "/projects/{id}/zones"
    description: "List zones for a project (reverse-reachability for Zone.project_id)."
    roles: [LightingDesigner, InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: Zone[]
    side_effects: []

  - method: GET
    path: "/zones/{id}/fixtures"
    description: "List fixtures assigned to a zone (reverse-reachability for Fixture.zone_id)."
    roles: [LightingDesigner, InstallTech, OperationsAdmin]
    code: 200
    input: []
    output: Fixture[]
    side_effects: []

  # ----- Fixture -----
  - method: POST
    path: "/fixtures"
    description: "Create a planned fixture (unassigned by default)."
    roles: [LightingDesigner]
    code: 201
    input: [project_id, model_code, category, wattage_w, purchase_price_cents, "warranty_months?"]
    output: Fixture
    side_effects: ["status=PLANNED, zone_id=null"]

  - method: GET
    path: "/fixtures/{id}"
    description: "Read a fixture."
    roles: [LightingDesigner, InstallTech, Customer, OperationsAdmin]
    code: 200
    input: []
    output: Fixture
    side_effects: []

  - method: GET
    path: "/projects/{id}/fixtures"
    description: "List fixtures for a project (reverse-reachability for Fixture.project_id)."
    roles: [LightingDesigner, InstallTech, Customer, OperationsAdmin]
    code: 200
    input: []
    output: Fixture[]
    side_effects: []

  - method: POST
    path: "/fixtures/{id}/assign-zone"
    description: "Assign a planned fixture to a zone (OCC on the zone's transformer; capacity-gated)."
    roles: [LightingDesigner]
    code: 200
    input: [zone_id, expected_transformer_version]
    output: Fixture
    side_effects:
      - "fixture.zone_id set; Zone.zone_load_va, Transformer.committed_load_va, LightingProject.total_committed_load_va recomputed"
      - "increments Transformer.version by 1"

  - method: POST
    path: "/fixtures/{id}/remove"
    description: "Remove an installed fixture (INSTALLED -> REMOVED)."
    roles: [InstallTech]
    code: 200
    input: []
    output: Fixture
    side_effects: ["status=REMOVED; Zone.zone_load_va and Transformer.committed_load_va recomputed"]

  # ----- Quote / QuoteLine -----
  - method: POST
    path: "/quotes"
    description: "Create a draft quote for a project."
    roles: [LightingDesigner]
    code: 201
    input: [project_id, "night_demo_requested?", "night_demo_at?"]
    output: Quote
    side_effects: ["status=DRAFT, revision_round=0"]

  - method: GET
    path: "/quotes/{id}"
    description: "Read a quote including computed pricing (lazily expires if past validity)."
    roles: [LightingDesigner, Customer, OperationsAdmin]
    code: 200
    input: []
    output: Quote
    side_effects: ["lazy SENT->EXPIRED if clock >= send_time + 14 days"]

  - method: GET
    path: "/projects/{id}/quotes"
    description: "List quotes for a project (reverse-reachability for Quote.project_id)."
    roles: [LightingDesigner, Customer, OperationsAdmin]
    code: 200
    input: []
    output: Quote[]
    side_effects: []

  - method: POST
    path: "/quotes/{id}/lines"
    description: "Add a line to a draft quote."
    roles: [LightingDesigner]
    code: 201
    input: [model_code, quantity, unit_price_cents]
    output: QuoteLine
    side_effects: ["line_total_cents computed"]

  - method: GET
    path: "/quotes/{id}/lines"
    description: "List a quote's lines (reverse-reachability for QuoteLine.quote_id)."
    roles: [LightingDesigner, Customer, OperationsAdmin]
    code: 200
    input: []
    output: QuoteLine[]
    side_effects: []

  - method: POST
    path: "/quotes/{id}/send"
    description: "Send a draft quote (recomputes pricing; DRAFT -> SENT)."
    roles: [LightingDesigner]
    code: 200
    input: []
    output: Quote
    side_effects: ["recompute pricing via calc quote_pricing", "status=SENT", "first send sets project commercial_status QUOTED"]

  - method: POST
    path: "/quotes/{id}/revise"
    description: "Return a sent quote to draft for revision (SENT -> DRAFT; cycle)."
    roles: [LightingDesigner]
    code: 200
    input: []
    output: Quote
    side_effects: ["status=DRAFT", "revision_round incremented by 1"]

  - method: POST
    path: "/quotes/{id}/accept"
    description: "Customer accepts a sent quote (SENT -> ACCEPTED)."
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["status=ACCEPTED", "project commercial_status ACCEPTED", "Customer.wallet_credit_cents debited by grand_total_cents"]

  - method: POST
    path: "/quotes/{id}/reject"
    description: "Customer rejects a sent quote (SENT -> REJECTED)."
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["status=REJECTED"]

  # ----- InstallJob -----
  - method: POST
