        distinguishing_aspect: "With window_kind valid, the remaining faults are hours_offered 0 (priority 19) and a malformed half-open interval whose ends_at precedes starts_at (priority 39): the earlier zero-hours rule answers, so 422 ERR_ZERO_HOURS_NOT_ALLOWED rather than ERR_WINDOW_OUTSIDE_CYCLE."
