            - "Three RELEASED lots sit on the same line L-01 of plant P-CHI, all of the non-regulated product SKU-MUG: LOT-B with 100000 units, LOT-C with 40000 units and LOT-D with 200000 units."
            - "Nine Complaints in handling_status INTAKE were all created at 2026-08-01T00:00:00Z: three plain FOREIGN_MATERIAL on LOT-B, two on LOT-C, and four on LOT-D of which one is an ILLNESS with medical_attention_sought true."
