            - "Exam.${el_dia_id}.report_status == INTERPRETED_FINAL yet density_category == null, so the conjunction fails on the density half"
            - "Exam.${el_scr_id}.report_status == AWAITING_INTERPRETATION, so the conjunction fails on the report half"
            - "Exam.${el_dia_id}.follow_up_status == NOT_REQUIRED and Exam.${el_scr_id}.follow_up_status == NOT_REQUIRED"
            - "GET /supplemental-orders returns total_count == 0"

      - name: an_amendment_that_changes_nothing_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=73]
          - errors[ERR_AMENDMENT_NO_CHANGE]
          - state_machines.Exam.report_status.INTERPRETED_FINAL_to_AMENDED
        distinguishing_aspect: "Re-sending the stored BI-RADS and density verbatim is rejected 422 and leaves amendment_count at 0, while changing only the density (leaving BI-RADS identical) satisfies the disjunction and moves the exam to AMENDED with amendment_count 1."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One SCREENING exam interpreted BI-RADS 1 with density B."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_two_exams_a
            - *c_two_exams_a_read
          trigger:
            - call: "POST /exams/${pk_a_id}/amend"
              payload: { birads_assessment: 1, density_category: "B", amendment_reason: "Re-sent identical values" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { am_err: $.data.error_id }
            - call: "POST /exams/${pk_a_id}/amend"
              payload: { birads_assessment: 1, density_category: "C", amendment_reason: "Density re-read as heterogeneously dense" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
          assert:
            - "No-change amendment — HTTP status == 422 and error_id == \"ERR_AMENDMENT_NO_CHANGE\""
            - "After the rejection — Exam.${pk_a_id}.report_status == INTERPRETED_FINAL and amendment_count == 0"
            - "Density-only amendment — HTTP status == 200, Exam.${pk_a_id}.report_status == AMENDED, amendment_count == 1, density_category == C"
            - "Exam.${pk_a_id}.birads_assessment == 1 and recall_flag == false"
            - "Exam.${pk_a_id}.notification_status == PENDING (the amendment reopens the notice obligation even though no letter existed)"

      - name: an_overlapping_audit_cycle_for_the_same_radiologist_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=72]
          - errors[ERR_AUDIT_CYCLE_OVERLAP]
        distinguishing_aspect: "The overlap test uses the half-open period, so a cycle starting 2026-06-01 collides with the existing 2026-01-01..2026-07-01 cycle and is rejected 409, and the same radiologist cannot hold a second OPEN cycle at all — while an identical period for a different radiologist is accepted."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff plus a second INTERPRETING_PHYSICIAN."
            - "One OPEN audit cycle for the primary radiologist covering 2026-01-01 to 2026-07-01."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - &c_rad2
              call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Rex Reader", role_type: "INTERPRETING_PHYSICIAN", initial_qualification_on: "2024-04-01T00:00:00Z", initial_training_hours: 70, initial_read_volume: 300, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { rad2_id: $.data.id }
            - *c_cycle
          trigger:
            - call: "POST /personnel/${rad_id}/audit-cycles"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", followup_window_days: 180 }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { ov_err: $.data.error_id }
            - call: "POST /personnel/${rad2_id}/audit-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { ov_cycle2_id: $.data.id }
          assert:
            - "Overlapping cycle for the same radiologist — HTTP status == 409 and error_id == \"ERR_AUDIT_CYCLE_OVERLAP\""
            - "Identical period for the second radiologist — HTTP status == 201 and RadiologistAuditCycle.${ov_cycle2_id}.status == OPEN"
            - "RadiologistAuditCycle.${ov_cycle2_id}.followup_window_days == 365"
            - "GET /personnel/${rad_id}/audit-cycles returns total_count == 1"
            - "GET /personnel/${rad2_id}/audit-cycles returns total_count == 1"

      - name: closing_an_audit_cycle_before_its_period_end_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=64]
          - errors[ERR_AUDIT_PERIOD_NOT_ELAPSED]
          - state_machines.RadiologistAuditCycle.status.OPEN_to_LOCKED
        distinguishing_aspect: "Closure is gated on the clock reaching period_end, not on the cycle merely existing: at 2026-08-01 a cycle ending 2026-12-01 cannot be closed (409) while the same call on a cycle ending 2026-07-01 succeeds, and the rejected call writes neither variant_at_close nor locked_at."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff plus a second INTERPRETING_PHYSICIAN."
            - "One OPEN cycle for the primary radiologist covering 2026-01-01 to 2026-07-01 (already elapsed) and one OPEN cycle for the second radiologist covering 2026-01-01 to 2026-12-01 (not elapsed)."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_rad2
            - *c_cycle
            - call: "POST /personnel/${rad2_id}/audit-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { fut_cycle_id: $.data.id }
          trigger:
            - call: "POST /audit-cycles/${fut_cycle_id}/close"
              payload: { variant: "PPV1_SCREENING" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { pe_err: $.data.error_id }
            - call: "POST /audit-cycles/${cycle_id}/close"
              payload: { variant: "PPV1_SCREENING" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
          assert:
            - "Early close — HTTP status == 409 and error_id == \"ERR_AUDIT_PERIOD_NOT_ELAPSED\""
            - "RadiologistAuditCycle.${fut_cycle_id}.status == OPEN, variant_at_close == null, locked_at == null"
            - "Elapsed close — HTTP status == 200, RadiologistAuditCycle.${cycle_id}.status == LOCKED, variant_at_close == PPV1_SCREENING, locked_at == \"2026-08-01T00:00:00Z\""
            - "RadiologistAuditCycle.${cycle_id}.screening_exam_count == 0, recall_count == 0, recall_rate_pct == null, ppv_pct == null (an empty period closes cleanly)"
            - "RadiologistAuditCycle.${cycle_id}.abnormal_interpretation_flag == false (a null recall rate cannot be abnormal)"

      - name: a_packet_of_fewer_than_two_distinct_exams_is_rejected_before_the_fee_check
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors[ERR_PACKET_TOO_SMALL]
        distinguishing_aspect: "MIN_PACKET_EXAMS counts DISTINCT ids, so both a single-exam packet and a two-element packet holding the same id twice are rejected 422 — and they are rejected on a facility with zero prepaid credit, proving priority 22 is evaluated before the priority 81 fee check."
