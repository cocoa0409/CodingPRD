      - name: stop_release_restores_hot_bag_slots_without_reusing_the_ordinal
        grounds:
          - state_machines.Dispatch.STACKED_to_DRAFT
          - state_machines.Order.fulfillment_status.ASSIGNED_to_READY
          - entities.Dispatch.fields.committed_hot_bag_slots
          - entities.Dispatch.fields.stop_count
          - entities.DispatchStop.fields.sequence
          - entities.DispatchStop.fields.status
          - endpoints.DELETE_dispatch_stop
        distinguishing_aspect: |
          Removing a stop must compensate every aggregate the insertion raised -
          stop_count, committed_hot_bag_slots and the Order's fulfillment_status -
          while deliberately NOT compensating the monotone insertion ordinal: the
          released stop keeps sequence 1, the surviving stop keeps sequence 2, and
          re-adding the same order mints sequence 3. This is a compensation with a
