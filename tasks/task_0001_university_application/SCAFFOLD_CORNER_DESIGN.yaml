            - call: "GET /applications/${app1}"
              payload: {}
              as: PlatformAdmin
              captures: { s1: $.data.status }
            - call: "GET /applications/${app2}"
              payload: {}
              as: PlatformAdmin
              captures: { s2: $.data.status }
            - call: "GET /applications/${app3}"
              payload: {}
              as: PlatformAdmin
              captures: { s3: $.data.status }
          assert:
            - "promoted_count == 2  # min(target=2, eligible=3) = 2"
            - "Application.${app1}.status == 'ADMITTED' (rank 1 — waitlist_added_at earliest)"
            - "Application.${app2}.status == 'ADMITTED' (rank 2)"
            - "Application.${app3}.status == 'WAITLISTED' (rank 3 — not promoted)"

      - name: calc_admission_score_threshold_sat_floor_at_zero_when_null
        claim_type: Threshold
        grounds:
          - calculations.applicant_admission_probability_score
          - entities.Applicant.fields.sat_total
        distinguishing_aspect: "sat_total == null → sat_component == 0 (the formula's null branch). With gpa=2.0, plan=REGULAR, no letters: score == 20 (only gpa contributes)."
        test_recipe:
          setup:
            - "Applicant with gpa=2.0, sat_total=null"
            - "Application DRAFT plan=REGULAR with no letters"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "TH-NULL", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "thn@x.com", full_name: "ThN", gpa: 2.0, sat_total: null }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /applications/${app_id}?score_variant=PROVISIONAL"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { score: $.data.admission_probability_score }
          assert:
            - "Application.${app_id}.admission_probability_score == 20   # gpa=20 + sat=0 + plan=0 + letters=0"

  # ==========================================================================
  # Section 4 — Validations (Table 4)
  # ==========================================================================
  - section: validations
    instances:

      - name: validation_priority_4_path_not_found_before_body_fk
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "POST /applications/{id}/submit with a non-existent application id AND a stale body returns ERR_RESOURCE_NOT_FOUND (priority 4) not ERR_FK_NOT_FOUND (priority 5)."
        test_recipe:
          setup: ["Applicant registered (so auth passes)"]
          setup_api_calls:
            - call: "POST /applicants/register"
              payload: { email: "vp@x.com", full_name: "VP", gpa: 3.0 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications/00000000-0000-4000-8000-000000000099/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_RESOURCE_NOT_FOUND'"

      - name: validation_priority_1_missing_auth_headers
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "GET /schools/{id} without X-User-Role and X-User-ID headers returns ERR_MISSING_AUTH_HEADERS (401)."
        test_recipe:
          setup:
            - "One school exists"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "NH-1", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
          trigger:
            - call: "GET /schools/${school_id}"
              payload: {}
              as: __no_auth__   # send request without X-User-Role / X-User-ID
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "error_id == 'ERR_MISSING_AUTH_HEADERS'"

      - name: validation_priority_2_unknown_role
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: "GET /schools with X-User-Role='Wizard' (not in the role set) returns ERR_UNKNOWN_ROLE (401)."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /schools"
              payload: {}
              as: Wizard
              as_user_id: "some-id"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "error_id == 'ERR_UNKNOWN_ROLE'"

      - name: validation_priority_6_not_resource_owner
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "POST /applications/{id}/withdraw by an Applicant who is NOT the owner returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup:
            - "Application owned by Applicant A in DRAFT status"
            - "Applicant B exists as the actor"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "OWN-1", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "ownA@x.com", full_name: "OwnA", gpa: 3.0 }
              as: Anonymous
              captures: { ownerA: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "ownB@x.com", full_name: "OwnB", gpa: 3.0 }
              as: Anonymous
              captures: { actorB: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${ownerA}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${ownerA}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${actorB}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == 'ERR_NOT_RESOURCE_OWNER'"

      - name: validation_priority_11_ed_binding_violation
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors[ERR_ED_BINDING_VIOLATION]
        distinguishing_aspect: "Creating a second Application with plan=EARLY_DECISION while the Applicant already has an ED Application in a non-terminal status returns ERR_ED_BINDING_VIOLATION."
        test_recipe:
          setup:
            - "Applicant with an EARLY_DECISION Application in DRAFT status on School S1"
            - "Second School S2 exists"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "ED-1", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /schools"
              payload: { name: "ED-2", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "ed@x.com", full_name: "Ed", gpa: 3.0 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${s1}", plan: "EARLY_DECISION" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${s2}", plan: "EARLY_DECISION" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_ED_BINDING_VIOLATION'"

      - name: validation_priority_13_already_enrolled
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_ALREADY_ENROLLED]
        distinguishing_aspect: "POST /applications/{id}/accept-offer when applicant is already ENROLLED on a different school returns ERR_ALREADY_ENROLLED."
        test_recipe:
          setup:
            - "Applicant with two REGULAR ADMITTED Applications across two different schools (no ED cascade)"
