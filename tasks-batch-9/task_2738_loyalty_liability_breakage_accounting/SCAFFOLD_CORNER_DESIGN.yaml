            - "PointLot.${lota_id}.lifecycle_state == FULLY_REDEEMED with points_remaining 0, and PointLot.${lotb_id}.lifecycle_state == PARTIALLY_REDEEMED with points_remaining 500 - FIFO consumed the 2026-08-01 lot first"
            - "GET /point-lots/${lota_id}/allocations returns total_count == 1 and GET /point-lots/${lotb_id}/allocations returns total_count == 1 - the same two rows, traversed from the lot side"
            - "Member.${m1_id}.point_balance == 500"

      - name: entity_graph_topology_self_referential_supersedes_link
        claim_type: graph
        grounds:
          - entities.BreakageEstimate.fields.supersedes_estimate_id
          - complexity_profile.relationship_patterns
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_estimate_supersede_forces_soft_closed_period_reopen
          rationale: "That instance asserts BreakageEstimate.supersedes_estimate_id points at the retired estimate and that the retired row moves to SUPERSEDED, which is the whole content of the self-referential-edge claim."

  # ===========================================================================
  # SECTION 2 — state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: state_program_starts_in_draft_and_blocks_issuance
        claim_type: Initial State
        grounds:
          - state_machines.LoyaltyProgram.initial_state
          - validations[priority=61]
          - errors[ERR_PROGRAM_NOT_ACTIVE]
        distinguishing_aspect: "A freshly created LoyaltyProgram is DRAFT, not ACTIVE, and issuance into it is refused with ERR_PROGRAM_NOT_ACTIVE until activate runs."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Draft Core' created but NEVER activated; rule TX, cohort C1, member M1 BASE/TX and period per1 [2026-08-01, 2026-09-01) all exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Draft Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
          trigger:
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { err: $.data.error_id }
          assert:
            - "LoyaltyProgram.${prog_id}.status == DRAFT - the declared initial state, never supplied by the client"
            - "The issuance attempt returns HTTP 409 with error_id == ERR_PROGRAM_NOT_ACTIVE (validation priority 61)"
            - "LoyaltyProgram.${prog_id}.current_breakage_rate_bp == 0 while DRAFT - the seed happens only on the DRAFT -> ACTIVE transition"
            - "GET /point-lots?period_id=${per1_id} returns total_count == 0 and Member.${m1_id}.point_balance == 0"
            - "Member and AccountingPeriod creation succeeded against a DRAFT program - only issuance, redemption, estimates and settlement require ACTIVE"

      - name: state_program_activate_without_any_cohort_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LoyaltyProgram.transitions[DRAFT->ACTIVE].preconditions
          - validations[priority=93]
          - errors[ERR_PROGRAM_CONFIG_INCOMPLETE]
        distinguishing_aspect: "DRAFT -> ACTIVE demands at least one StateExpiryRule AND at least one Cohort; a program with a rule but no cohort is refused with ERR_PROGRAM_CONFIG_INCOMPLETE and stays DRAFT."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Half Config Core' DRAFT with exactly one StateExpiryRule (TX) and NO Cohort."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Half Config Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 with error_id == ERR_PROGRAM_CONFIG_INCOMPLETE"
            - "LoyaltyProgram.${prog_id}.status is still DRAFT and current_breakage_rate_bp is still 0 - the rejected transition ran no side effect"
            - "LoyaltyProgram.${prog_id}.version is unchanged at 1 - a refused transition never bumps the version"
            - "After POST /cohorts adds one Cohort, the identical activate call returns 200 with status ACTIVE and current_breakage_rate_bp == 2500"

      - name: state_program_activate_seeds_rate_but_reactivation_does_not
        claim_type: Side Effect Execution
        grounds:
          - state_machines.LoyaltyProgram.transitions[DRAFT->ACTIVE].side_effects
          - state_machines.LoyaltyProgram.transitions[SUSPENDED->ACTIVE].side_effects
          - entities.LoyaltyProgram.fields.current_breakage_rate_bp
        distinguishing_aspect: "The SAME endpoint carries different side effects on different edges: DRAFT -> ACTIVE seeds current_breakage_rate_bp = 10000 - 7500 = 2500, while the cyclic SUSPENDED -> ACTIVE edge deliberately leaves a rate installed by an approved estimate alone."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Cycle Core' DRAFT with rule TX and cohort C1 (observed 8200, adjustment 0), historical_redemption_rate_bp 7500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Cycle Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "Single-cohort estimate for the reactivation corner.", sensitivity_low_bp: 7700, sensitivity_high_bp: 8700 }
              as: LoyaltyAccountant
              captures: { est1_id: $.data.id }
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v: $.data.version }
            - call: "POST /breakage-estimates/${est1_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: Controller
            - call: "POST /programs/${prog_id}/suspend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Immediately after the FIRST activate, LoyaltyProgram.${prog_id}.status == ACTIVE and current_breakage_rate_bp == 2500 (10000 - historical 7500)"
            - "PointLot.${lot1_id}.breakage_rate_bp_at_issue == 2500 and deferred_revenue_cents == 900 - the lot snapshotted the seeded rate"
            - "BreakageEstimate.${est1_id}.estimated_redemption_rate_bp == 8200 and breakage_rate_bp == 1800 (single candidate cohort, weight 1000 points, no division needed)"
            - "After approval, LoyaltyProgram.${prog_id}.current_breakage_rate_bp == 1800 - CASCADE LINK 1 replaced the seeded 2500"
            - "After suspend, status == SUSPENDED and current_breakage_rate_bp is still 1800"
            - "After the SECOND activate (SUSPENDED -> ACTIVE), status == ACTIVE and current_breakage_rate_bp is STILL 1800 - reactivation must NOT reseed it to 2500"
            - "A lot issued after the reactivation snapshots breakage_rate_bp_at_issue == 1800, not 2500"

      - name: state_program_activate_from_active_returns_invalid_state_transition
        claim_type: Idempotency
        grounds:
          - state_machines.LoyaltyProgram.transitions
          - validations[priority=62]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "activate is NOT idempotent-by-swallowing: a second activate on an already ACTIVE program returns HTTP 409 ERR_INVALID_STATE_TRANSITION rather than a 200 no-op, and must not re-run the seeding side effect."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Idem Core' ACTIVE (rule TX, cohort C1, historical 7500 so current_breakage_rate_bp is 2500)."
