              payload: { interconnect_id: "${ic_id}", ops_day_id: "${day1_id}", window_start_utc: "2026-08-04T06:00:00Z", window_end_utc: "2026-08-04T10:00:00Z", nominated_mmbtu: 30.000 }
              as: PipelineScheduler
              as_user_id: "u-sched"
              captures: { nom1_id: "$.data.id" }
            - call: "POST /injection-nominations"
              payload: { interconnect_id: "${ic_id}", ops_day_id: "${day1_id}", window_start_utc: "2026-08-04T10:30:00Z", window_end_utc: "2026-08-04T14:30:00Z", nominated_mmbtu: 30.000 }
              as: PipelineScheduler
              as_user_id: "u-sched"
              captures: { nom2_id: "$.data.id" }
            - call: "POST /injection-nominations"
              payload: { interconnect_id: "${ic_id}", ops_day_id: "${day1_id}", window_start_utc: "2026-08-04T15:00:00Z", window_end_utc: "2026-08-04T19:00:00Z", nominated_mmbtu: 30.000 }
              as: PipelineScheduler
              as_user_id: "u-sched"
              captures: { nom3_id: "$.data.id" }
          trigger:
            - call: "POST /injection-nominations/${nom1_id}/schedule-decision"
              payload: { decision: "CURTAIL", curtailed_mmbtu: 10.000, reason: "Receipt-point pressure" }
              as: PipelineScheduler
              as_user_id: "u-sched"
            - call: "POST /injection-nominations/${nom2_id}/schedule-decision"
              payload: { decision: "CURTAIL", curtailed_mmbtu: 10.000, reason: "Receipt-point pressure" }
              as: PipelineScheduler
              as_user_id: "u-sched"
            - call: "POST /injection-nominations"
              payload: { interconnect_id: "${ic_id}", ops_day_id: "${day1_id}", window_start_utc: "2026-08-04T19:30:00Z", window_end_utc: "2026-08-04T23:30:00Z", nominated_mmbtu: 30.000 }
              as: PipelineScheduler
              as_user_id: "u-sched"
              captures: { nom4_id: "$.data.id" }
            - call: "POST /injection-nominations/${nom3_id}/schedule-decision"
              payload: { decision: "CURTAIL", curtailed_mmbtu: 10.000, reason: "Receipt-point pressure" }
              as: PipelineScheduler
              as_user_id: "u-sched"
            - call: "POST /injection-nominations"
              payload: { interconnect_id: "${ic_id}", ops_day_id: "${day1_id}", window_start_utc: "2026-08-05T06:00:00Z", window_end_utc: "2026-08-05T10:00:00Z", nominated_mmbtu: 30.000 }
              as: PipelineScheduler
              as_user_id: "u-sched"
              captures: { err_suspended: "$.data.error_id" }
          assert:
            - "first call HTTP status == 200"
            - "second call HTTP status == 200"
            - "third call HTTP status == 201"
            - "fourth call HTTP status == 200"
            - "fifth call HTTP status == 409"
            - "${err_suspended} == ERR_NO_ACTIVE_INTERCONNECT"
            - "InterconnectAgreement.${ic_id}.curtailment_count == 3"
            - "InterconnectAgreement.${ic_id}.status == SUSPENDED"
            - "InjectionNomination.${nom1_id}.confirmed_mmbtu == 10.000"
            - "InjectionNomination.${nom3_id}.status == CURTAILED"
            - "InjectionNomination.${nom4_id}.status == NOMINATED"

      - name: ccl_material_finding_cascade_runs_four_levels_deep
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.CreditPathway.transitions.CERTIFIED_to_SUSPENDED
        excluded_because:
          difficulty_instance: tc_material_finding_suspends_pathway_revalues_batch_recomputes_statement_restricts_distribution
          rationale: "The four-level finding cascade with its ordering sensitivity is exactly the named §1.8 transitive-cascade instance."

      - name: ccl_nitrogen_basis_is_a_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.plant_available_nitrogen
        excluded_because:
          difficulty_instance: dv_plant_available_nitrogen_lab_vs_agronomic_on_identical_digestate
          rationale: "Both nitrogen bases on identical digestate, and the delta between them, are the subject of the named §1.8 divergent-variant instance."

  - section: consistency_model
    instances:
      - name: cm_close_response_already_carries_every_derived_stability_and_gas_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.biological_stability_score
          - calculations.raw_biogas_energy
          - entities.DigesterFacility.fields.ops_posture
        distinguishing_aspect: >
          Nothing lags: the close response itself carries stability_status, the loading
          rate and the raw energy, and the facility posture cascade is already visible on
          the next read with no refresh, retry or background job in between.
        test_recipe:
          setup:
            - "Canonical plant with the canonical 150.000 t load booked on the OPEN day 2026-08-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3200, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
            - call: "POST /feedstock-agreements"
              payload: { dairy_id: "${dairy1_id}", facility_id: "${facility_id}", committed_tonnes_per_day: 180.000, minimum_total_solids_pct: 6.50, term_start_date: "2026-07-01", term_end_date: "2027-06-30", revenue_share_pct: 0.2200, revenue_share_basis: "NET", curtailable: true }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { agr1_id: "$.data.id" }
            - call: "POST /feedstock-agreements/${agr1_id}/offer"
              payload: { cover_note: "August 2026 term sheet" }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/sign"
              payload: { signatory_name: "R. Alvarez" }
              as: DairyPartner
              as_user_id: "${dairy1_id}"
            - call: "POST /ops-days"
              payload: { facility_id: "${facility_id}", ops_date: "2026-08-03" }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { day1_id: "$.data.id" }
            - call: "POST /feedstock-deliveries"
              payload: { agreement_id: "${agr1_id}", ops_day_id: "${day1_id}", gross_tonnes: 150.000, tare_tonnes: 0.000, total_solids_pct: 8.0, volatile_solids_pct_of_ts: 82.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { del1_id: "$.data.id" }
          trigger:
            - call: "POST /ops-days/${day1_id}/close"
              payload: { avg_digester_temp_c: 38.4, temp_excursion_minutes: 15, vfa_mg_per_l: 2400.0, alkalinity_mg_per_l: 8000.0, raw_biogas_scf: 196000.000, raw_ch4_pct: 62.0, raw_co2_pct: 36.5, raw_h2s_ppm: 1800.0, raw_moisture_lb_per_mmscf: 120.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "GET /ops-days/${day1_id}"
              payload: {}
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "GET /facilities/${facility_id}"
              payload: {}
              as: ProjectOperator
              as_user_id: "u-ops"
          assert:
            - "first call HTTP status == 200"
            - "OperationsDay.${day1_id}.status == CLOSED"
            - "OperationsDay.${day1_id}.gas_state == RAW"
            - "OperationsDay.${day1_id}.organic_loading_rate == 1.640"
            - "OperationsDay.${day1_id}.vfa_alkalinity_ratio == 0.300"
            - "OperationsDay.${day1_id}.stress_score == 1"
            - "OperationsDay.${day1_id}.stability_status == STABLE"
            - "OperationsDay.${day1_id}.raw_hhv_btu_per_scf == 626.20"
            - "OperationsDay.${day1_id}.raw_gas_mmbtu == 122.735"
            - "second call HTTP status == 200"
            - "third call HTTP status == 200"
            - "DigesterFacility.${facility_id}.ops_posture == STABLE"
            - "DigesterFacility.${facility_id}.unseparated_manure_tonnes == 150.000"
            - "DigesterFacility.${facility_id}.mass_control_residual_tonnes == 0.000"

      - name: cm_inhibited_close_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: tc_inhibited_close_upsets_facility_suspends_curtailable_agreement_cancels_open_delivery_suspends_dairy
          rationale: "That §1.8 instance already asserts the whole inhibition cascade from the single close response, which is the immediate-consistency claim for this scenario."

      - name: cm_mass_control_residual_is_zero_at_every_observable_point
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.mass_control_invariant
        excluded_because:
          difficulty_instance: comp_mass_control_tonnes_return_to_zero_residual_after_separation_then_reopen
          rationale: "The conserved-quantity walk through separation and reopen, checking the residual after each step, is the named §1.8 conservation instance."
