# Sections skipped as N/A for this scaffold:
#   entities/immutability and entities/parent_relationships (every entity declares
#     common_fields: true and entity_topology is flat, so there is no parent chain
#     and no client-writable immutable field to defend);
#   state_machines bubble_up and compound side-effect patterns (§1.2 declares only
#     cascade_down, cross_entity, ledger_sync, compensation, conditional_cascade
#     and parallel);
#   endpoints/bulk_action (§1.5 declares no bulk endpoint);
#   calculations topological, decay_function, projection and constraint_propagation
#     rows (the last is exercised through technician_routing_selection under
#     endpoints and rbac rather than as its own algorithm row);
#   layers soft_delete, idempotency_keys, multi_tenancy, bulk_operations,
#     scheduled_actions and conditional_feature_flags (not in complexity_layers);
