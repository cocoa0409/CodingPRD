      - name: error_participant_and_cycle_invalid_state_on_second_attempt
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_PARTICIPANT_INVALID_STATE]
          - errors[ERR_CYCLE_INVALID_STATE]
          - state_machines.Participant.ACTIVE_to_TERMINATED
          - state_machines.PerformanceCycle.OPEN_to_CERTIFIED
        distinguishing_aspect: |
          TERMINATED and CERTIFIED are terminal: a second terminate is
          ERR_PARTICIPANT_INVALID_STATE and a second certify with a different actual_value is
          ERR_CYCLE_INVALID_STATE, and the already-stored payout_multiplier_bps is not
          recomputed by the rejected retry.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan; participant with no grants terminated VOLUNTARY on 2026-02-10; an OPEN PerformanceCycle with target_value 100 certified at actual_value 100 (payout_multiplier_bps 10000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Whiskey Two", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
