              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "assignments to 12h and 8h shifts both ASSIGNED (20.0 == cap allowed)"
            - "${err} == ERR_WEEKLY_HOURS_EXCEEDED (20.5 > 20.0)"
            - "Shift.${shC}.assigned_count == 0"

      - name: program_cap_auto_transition_and_extension
        claim_type: threshold
        grounds: ["calculations.calc_transitional_hours", "state_machines.Worker.ACTIVE_to_CAP_REACHED", "errors[ERR_WORKER_CAP_REACHED]"]
        distinguishing_aspect: "Landing exactly ON the 8-hour program cap flips the worker to CAP_REACHED (>= boundary) while the completing assignment still succeeds; a manager cap extension (cap_extension_hours 4 -> effective 12) returns the worker to ACTIVE and unblocks assignment."
        test_recipe:
          setup: ["TRANSITIONAL worker W with program_cap_hours 8; three 4h shifts on Mon/Tue/Wed of 2026-W33"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Cap", employment_type: "TRANSITIONAL", program_cap_hours: 8 }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/shifts"
              payload: { role_type: "SORTER", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T13:00:00Z", required_headcount: 1 }
              as: VolunteerCoordinator
              captures: { sh1: $.data.id }
            - call: "POST /api/shifts"
              payload: { role_type: "SORTER", starts_at: "2026-08-11T09:00:00Z", ends_at: "2026-08-11T13:00:00Z", required_headcount: 1 }
              as: VolunteerCoordinator
              captures: { sh2: $.data.id }
            - call: "POST /api/shifts"
              payload: { role_type: "SORTER", starts_at: "2026-08-12T09:00:00Z", ends_at: "2026-08-12T13:00:00Z", required_headcount: 1 }
              as: VolunteerCoordinator
              captures: { sh3: $.data.id }
            - call: "POST /api/shifts/${sh1}/assignments"
              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { a1: $.data.id }
            - call: "POST /api/shift-assignments/${a1}/confirm"
              as: VolunteerCoordinator
            - call: "POST /api/shift-assignments/${a1}/complete"
              as: VolunteerCoordinator
            - call: "POST /api/shifts/${sh2}/assignments"
              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { a2: $.data.id }
            - call: "POST /api/shift-assignments/${a2}/confirm"
              as: VolunteerCoordinator
          trigger:
            - call: "POST /api/shift-assignments/${a2}/complete"
              as: VolunteerCoordinator
            - call: "POST /api/shifts/${sh3}/assignments"
              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { err: $.data.error_id }
            - call: "PATCH /api/workers/${w1}"
              payload: { cap_extension_hours: 4 }
              as: StoreManager
            - call: "POST /api/shifts/${sh3}/assignments"
              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { a3: $.data.id }
          assert:
            - "after completing the second 4h shift: Worker.${w1}.credited_hours == 8 and status == CAP_REACHED (exact-hit triggers)"
            - "ShiftAssignment.${a2}.status == COMPLETED (the capping completion itself succeeds)"
            - "${err} == ERR_WORKER_CAP_REACHED"
            - "after PATCH cap_extension_hours=4: Worker.${w1}.status == ACTIVE (effective cap 12 > 8)"
            - "ShiftAssignment.${a3}.status == ASSIGNED"

  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any other check (even on a well-formed request to a real endpoint)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/donors"
              payload: { full_name: "Nobody" }
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: pricer_cannot_create_guideline
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Role check fires before existence/state: Pricer posting a guideline gets 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "TOYS", base_cents: 100 }
              as: Pricer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: existence_checked_before_state
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Triage against a non-existent item id returns 404 ERR_NOT_FOUND, never a state error — existence (priority 4) precedes state (priority 6)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: stop_window_inverted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "window_end <= window_start is a 400 schema error, evaluated before any overlap/capacity business rule."
        test_recipe:
          setup: ["STAFF driver, DRAFT route"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Drive", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/pickup-routes"
              payload: { route_date: "2026-08-10", driver_worker_id: "${w1}", truck_capacity_cuft: 500 }
              as: StoreManager
              captures: { r1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D W" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d1}", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T09:00:00Z", estimated_volume_cuft: 50 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "PickupRoute.${r1}.stop_count == 0"

      - name: allocation_sum_not_100_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority=9]", "errors[ERR_ALLOCATION_SUM_INVALID]"]
        distinguishing_aspect: "Each allocation line is individually valid, but pct summing to 90 (not exactly 100) rejects the whole transfer with ERR_ALLOCATION_SUM_INVALID; the OCC version must be current so the 422 is not masked by a 412."
        test_recipe:
          setup: ["cycle created then immediately closed (net revenue 0); version captured after close"]
          setup_api_calls:
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /api/cycles/${c1}/mission-transfers"
              payload: { expected_cycle_version: "${cv}", allocations: [ { program: "JOB_TRAINING", pct: 60.000 }, { program: "GENERAL_FUND", pct: 30.000 } ] }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ALLOCATION_SUM_INVALID"
            - "no MissionTransfer row exists for the cycle (GET /api/mission-transfers?cycle_id=... empty)"

      - name: void_window_closed_after_session_close
        claim_type: temporal_validation
        grounds: ["validations[priority=10]", "errors[ERR_SALE_VOID_WINDOW_CLOSED]"]
        distinguishing_aspect: "A COMPLETED sale (state precondition passes) whose session has been CLOSED rejects the manager void with ERR_SALE_VOID_WINDOW_CLOSED — the pure temporal failure path."
        test_recipe:
          setup: ["item 1600 floored; cashier sale CASH; session counted even (6600) and CLOSED"]
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Vw" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
            - call: "POST /api/items/${i1}/to-floor"
              as: Pricer
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 5000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: ["${i1}"], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
              captures: { sale1: $.data.id }
            - call: "POST /api/till-sessions/${s1}/count"
              payload: { counted_cash_cents: 6600 }
              as: StoreManager
            - call: "POST /api/till-sessions/${s1}/close"
              as: StoreManager
          trigger:
            - call: "POST /api/sales/${sale1}/void"
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SALE_VOID_WINDOW_CLOSED"
            - "SalesTransaction.${sale1}.status == COMPLETED (void did not happen)"
            - "DonationItem.${i1}.status == SOLD"

      - name: donor_inactive_blocks_batch
        claim_type: cross_entity_validation
        grounds: ["validations[priority=11]", "errors[ERR_DONOR_INACTIVE]"]
        distinguishing_aspect: "A PATCH-deactivated donor cannot open new donation batches (422 ERR_DONOR_INACTIVE) while existing batches are unaffected."
        test_recipe:
          setup: ["donor deactivated via PATCH"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Off" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "PATCH /api/donors/${d1}"
              payload: { status: "INACTIVE" }
              as: IntakeAttendant
          trigger:
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DONOR_INACTIVE"

      - name: volunteer_driver_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=11]", "errors[ERR_DRIVER_NOT_STAFF]"]
        distinguishing_aspect: "Route driver must be an ACTIVE STAFF worker; a VOLUNTEER driver rejects route creation with ERR_DRIVER_NOT_STAFF."
        test_recipe:
          setup: ["VOLUNTEER worker V"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Vol", employment_type: "VOLUNTEER" }
              as: VolunteerCoordinator
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /api/pickup-routes"
              payload: { route_date: "2026-08-10", driver_worker_id: "${v1}", truck_capacity_cuft: 500 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DRIVER_NOT_STAFF"

      - name: price_without_guideline_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=11]", "errors[ERR_GUIDELINE_MISSING]"]
        distinguishing_aspect: "Pricing a TOYS item with no ACTIVE TOYS guideline fails ERR_GUIDELINE_MISSING; the item stays SALABLE."
        test_recipe:
          setup: ["TOYS item triaged SALABLE; no TOYS guideline exists"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D G" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "TOYS", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
          trigger:
            - call: "POST /api/items/${i1}/price"
              as: Pricer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_GUIDELINE_MISSING"
            - "DonationItem.${i1}.status == SALABLE"

      - name: appraisal_gate_exact_boundary
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_APPRAISAL_REQUIRED]", "entities.DonationItem.fields.appraisal_confirmed"]
        distinguishing_aspect: "The $5000 appraisal gate is INCLUSIVE: an item revalued to exactly 500000 blocks the receipt while appraisal_confirmed=false; a parallel batch whose triage set appraisal_confirmed=true issues at the same amount."
        test_recipe:
          setup: ["two SORTED batches (receipt_requested, donor has address), each with one item revalued to 500000; batch A's item unconfirmed, batch B's confirmed at triage"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D App", address_line: "4 Main St" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN", receipt_requested: true }
              as: IntakeAttendant
              captures: { ba: $.data.id }
            - call: "POST /api/donation-batches/${ba}/items"
              payload: { category: "COLLECTIBLES", condition: "NEW_WITH_TAGS" }
              as: IntakeAttendant
              captures: { ia: $.data.id }
            - call: "POST /api/donation-batches/${ba}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${ba}/complete-sort"
              as: IntakeAttendant
              captures: { bva: $.data.version }
            - call: "POST /api/donation-batches/${ba}/revalue"
              payload: { expected_batch_version: "${bva}", adjustments: [ { item_id: "${ia}", provisional_value_cents: 500000 } ] }
              as: IntakeAttendant
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN", receipt_requested: true }
              as: IntakeAttendant
              captures: { bb: $.data.id }
            - call: "POST /api/donation-batches/${bb}/items"
              payload: { category: "COLLECTIBLES", condition: "NEW_WITH_TAGS" }
              as: IntakeAttendant
              captures: { ib: $.data.id }
            - call: "POST /api/donation-batches/${bb}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${ib}/triage"
              payload: { decision: "SALABLE", appraisal_confirmed: true }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${bb}/complete-sort"
              as: IntakeAttendant
              captures: { bvb: $.data.version }
            - call: "POST /api/donation-batches/${bb}/revalue"
              payload: { expected_batch_version: "${bvb}", adjustments: [ { item_id: "${ib}", provisional_value_cents: 500000 } ] }
              as: IntakeAttendant
          trigger:
            - call: "POST /api/donation-batches/${ba}/receipt"
              as: IntakeAttendant
              captures: { err: $.data.error_id }
            - call: "POST /api/donation-batches/${bb}/receipt"
              as: IntakeAttendant
              captures: { rb: $.data.id }
          assert:
            - "${err} == ERR_APPRAISAL_REQUIRED (500000 hits the inclusive gate)"
            - "TaxReceipt.${rb}.total_value_cents == 500000 and itemized_required == true and form_8283_required == true"

      - name: donor_address_gate_at_50000
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_DONOR_ADDRESS_REQUIRED]"]
        distinguishing_aspect: "The $500 address rule is INCLUSIVE: a 50000-cent receipt for a donor with no address_line fails ERR_DONOR_ADDRESS_REQUIRED; after PATCH adds the address, the same receipt issues with form_8283_required == true."
        test_recipe:
          setup: ["donor without address; SORTED batch (receipt_requested) revalued to exactly 50000"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Addr" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN", receipt_requested: true }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "TOYS", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/complete-sort"
              as: IntakeAttendant
              captures: { bv: $.data.version }
            - call: "POST /api/donation-batches/${b1}/revalue"
              payload: { expected_batch_version: "${bv}", adjustments: [ { item_id: "${i1}", provisional_value_cents: 50000 } ] }
              as: IntakeAttendant
          trigger:
            - call: "POST /api/donation-batches/${b1}/receipt"
              as: IntakeAttendant
              captures: { err: $.data.error_id }
            - call: "PATCH /api/donors/${d1}"
              payload: { address_line: "11 River Rd", city: "Springfield", state: "IL", postal_code: "62701" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/receipt"
              as: IntakeAttendant
              captures: { r1: $.data.id }
          assert:
            - "${err} == ERR_DONOR_ADDRESS_REQUIRED"
            - "TaxReceipt.${r1}.total_value_cents == 50000 and form_8283_required == true and itemized_required == true"

      - name: receipt_not_requested_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_RECEIPT_NOT_REQUESTED]"]
        distinguishing_aspect: "Receipt issuance on a batch created with receipt_requested=false fails ERR_RECEIPT_NOT_REQUESTED even when all other gates pass."
        test_recipe:
          setup: ["SORTED batch with receipt_requested omitted (defaults false)"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Nr", address_line: "1 Main" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "TOYS", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALVAGE" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/complete-sort"
              as: IntakeAttendant
          trigger:
            - call: "POST /api/donation-batches/${b1}/receipt"
              as: IntakeAttendant
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RECEIPT_NOT_REQUESTED"

      - name: sale_empty_lines_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "item_ids must be a non-empty array; [] is a 400 schema error before session/state checks."
        test_recipe:
          setup: ["cashier with OPEN session"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 1000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /api/sales"
              payload: { till_session_id: "${s1}", item_ids: [], payment_method: "CASH" }
              as: Cashier
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: sale_line_not_on_floor
        claim_type: precondition_enforcement
        grounds: ["validations[priority=6]", "errors[ERR_ITEM_INVALID_STATE]"]
        distinguishing_aspect: "Sale lines must be ON_FLOOR: a PRICED-but-never-floored item and an ON_HOLD item both reject with ERR_ITEM_INVALID_STATE, and the session totals do not move."
        test_recipe:
          setup: ["item A PRICED only; item B ON_HOLD; cashier session OPEN"]
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Nf" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { ia: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { ib: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${ib}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${ia}/price"
              as: Pricer
            - call: "POST /api/items/${ib}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
            - call: "POST /api/items/${ib}/to-floor"
              as: Pricer
