# =====================================================================================
# §1.9 Scaffold Corner Design — Satellite Broadband Provisioning & Capacity Management
# Breadth probe. Every instance is derived by walking references/claim-extraction-guide.md
# row-by-row against this scaffold's §1.1–§1.7. `excluded_because:` stubs point at the
# §1.8 instance that already covers the corner (rule_id / name).
# All logical-clock literals assume the default epoch 2026-08-01T00:00:00Z.
# =====================================================================================
scaffold_corner_design:

  # ===================================================================================
  # SECTION 1 — entities
  # ===================================================================================
  - section: entities
    instances:

      - name: spectrum_license_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.SpectrumLicense
          - 'endpoints["POST /satellite-broadband/spectrum-licenses"]'
          - response_envelope.success
        distinguishing_aspect: "A licence filed with every input field returns 201 with the six system/computed fields at their declared defaults (PENDING_COORDINATION / UNCOORDINATED / null / null) and version 1 — no coordination has been recorded yet."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
          assert:
            - "trigger response HTTP status == 201"
            - "trigger response: response_type == 'object' and meta.api_request_id is present"
            - "SpectrumLicense.${lic_id}.license_code == 'LIC-US-CA-KA-01'"
            - "SpectrumLicense.${lic_id}.jurisdiction_code == 'US-CA'"
            - "SpectrumLicense.${lic_id}.frequency_band == 'KA_FORWARD'"
            - "SpectrumLicense.${lic_id}.max_eirp_dbw == 62.5"
            - "SpectrumLicense.${lic_id}.expires_at == 2027-12-31T00:00:00.000Z"
            - "SpectrumLicense.${lic_id}.consumer_disclosure_version == 'CD-2026.1'"
            - "SpectrumLicense.${lic_id}.in_motion_permitted == true"
            - "SpectrumLicense.${lic_id}.license_state == PENDING_COORDINATION"
            - "SpectrumLicense.${lic_id}.coordination_state == UNCOORDINATED"
            - "SpectrumLicense.${lic_id}.coordination_note == null"
            - "SpectrumLicense.${lic_id}.enforcement_reason == null"
            - "SpectrumLicense.${lic_id}.version == 1"
            - "SpectrumLicense.${lic_id}.created_at == 2026-08-01T00:00:00.000Z"

      - name: beam_retrieval_returns_stored_capacity_fields
        claim_type: retrieval
        grounds:
          - entities.Beam
          - 'endpoints["GET /satellite-broadband/beams/{id}"]'
        distinguishing_aspect: "A read-back of a freshly created beam returns the stored inputs plus the zero-state capacity projection (weighted_sold_mbps 0, ratio 0, NORMAL) — no subscription exists to load it."
        test_recipe:
          setup:
            - "An ACTIVE + COORDINATED licence LIC-US-CA-KA-01 exists; one beam BEAM-01 with forward_capacity_mbps 100 was created on it with the default oversubscription policy."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
          trigger:
            - { call: "GET /satellite-broadband/beams/${beam_id}", payload: {}, as: NetworkOpsEngineer }
          assert:
            - "trigger response HTTP status == 200"
            - "Beam.${beam_id}.beam_code == 'BEAM-01'"
            - "Beam.${beam_id}.satellite_code == 'SAT-A'"
            - "Beam.${beam_id}.spectrum_license_id == ${lic_id}"
            - "Beam.${beam_id}.forward_capacity_mbps == 100"
            - "Beam.${beam_id}.weighted_sold_mbps == 0"
            - "Beam.${beam_id}.oversubscription_ratio == 0"
            - "Beam.${beam_id}.capacity_state == NORMAL"
            - "Beam.${beam_id}.beam_state == ACTIVE"
            - "Beam.${beam_id}.billing_cycle_index == 0"
            - "Beam.${beam_id}.last_cycle_closed_at == null"
            - "Beam.${beam_id}.version == 1"

      - name: service_cell_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - 'endpoints["GET /satellite-broadband/service-cells"]'
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three cells on one beam with limit=2 return total_count 3 / has_more true on the first page and total_count 3 / has_more false with a single row on the offset=2 page."
        test_recipe:
          setup:
            - "An ACTIVE + COORDINATED licence and one beam BEAM-01 exist; three cells CELL-001, CELL-002, CELL-003 were created on that beam in that order."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - { call: "POST /satellite-broadband/service-cells", payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 2 }, as: NetworkOpsEngineer }
            - { call: "POST /satellite-broadband/service-cells", payload: { cell_code: "CELL-002", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 2 }, as: NetworkOpsEngineer }
            - { call: "POST /satellite-broadband/service-cells", payload: { cell_code: "CELL-003", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 2 }, as: NetworkOpsEngineer }
          trigger:
            - { call: "GET /satellite-broadband/service-cells", payload: { beam_id: "${beam_id}", limit: 2, offset: 0 }, as: ProvisioningAgent }
            - { call: "GET /satellite-broadband/service-cells", payload: { beam_id: "${beam_id}", limit: 2, offset: 2 }, as: ProvisioningAgent }
          assert:
            - "first trigger response HTTP status == 200"
            - "first trigger response: response_type == 'array', data.total_count == 3, data.has_more == true, and exactly 2 cell rows are returned"
            - "second trigger response: data.total_count == 3, data.has_more == false, and exactly 1 cell row is returned"
            - "every returned cell row has availability_state == AVAILABLE, free_slot_count == 2, waitlist_depth == 0"

      - name: subscription_read_with_unknown_id_returns_subscription_not_found
        claim_type: not_found
        grounds:
          - 'errors[ERR_SUBSCRIPTION_NOT_FOUND]'
          - 'endpoints["GET /satellite-broadband/subscriptions/{id}"]'
          - validations[priority=5]
        distinguishing_aspect: "A well-formed UUID that matches no Subscription row returns 404 ERR_SUBSCRIPTION_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the pinned logical clock; no Subscription row exists."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "GET /satellite-broadband/subscriptions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProvisioningAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 404"
            - "trigger response: data.error_id == ERR_SUBSCRIPTION_NOT_FOUND"

      - name: service_plan_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.ServicePlan.fields.priority_data_gb
          - validations[priority=4]
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "priority_data_gb is source: input with no default, so omitting it fails schema validation at priority 4 with 400 ERR_INVALID_REQUEST — it is never defaulted to 0."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z; no plan exists."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-BROKEN", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, deprioritized_rate_mbps: 20 }
              as: ProvisioningAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 400"
            - "trigger response: data.error_id == ERR_INVALID_REQUEST"
            - "no ServicePlan row was created (a later POST /satellite-broadband/service-orders quoting plan_code PLAN-BROKEN is impossible)"

      - name: beam_creation_applies_default_oversubscription_policy
        claim_type: defaults
        grounds:
          - entities.Beam.fields.oversubscription_limit
          - entities.Beam.fields.deprioritization_grace_gb
        distinguishing_aspect: "Omitting oversubscription_limit yields exactly 4.0 and deprioritization_grace_gb (never client-supplied at creation) yields 0 — the two policy knobs the capacity-policy endpoint later overwrites."
        test_recipe:
          setup:
            - "An ACTIVE + COORDINATED licence LIC-US-CA-KA-01 exists."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
          trigger:
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-DEF", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
          assert:
            - "trigger response HTTP status == 201"
            - "Beam.${beam_id}.oversubscription_limit == 4.0"
            - "Beam.${beam_id}.deprioritization_grace_gb == 0"
            - "Beam.${beam_id}.capacity_state == NORMAL"

      - name: service_plan_creation_applies_boolean_and_overage_defaults
        claim_type: defaults
        grounds:
          - entities.ServicePlan.fields.overage_rate_cents_per_gb
          - entities.ServicePlan.fields.roaming_allowed
          - entities.ServicePlan.fields.in_motion_allowed
        distinguishing_aspect: "A second defaults corner on a different entity: omitting the three optional plan inputs yields overage_rate_cents_per_gb 25 and BOTH mobility flags false — a plan is fixed-site and non-roaming unless explicitly sold otherwise."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-BASIC", committed_rate_mbps: 100, priority_tier: "BEST_EFFORT", monthly_fee_cents: 4900, priority_data_gb: 50, deprioritized_rate_mbps: 10 }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
          assert:
            - "trigger response HTTP status == 201"
            - "ServicePlan.${plan_id}.overage_rate_cents_per_gb == 25"
            - "ServicePlan.${plan_id}.roaming_allowed == false"
            - "ServicePlan.${plan_id}.in_motion_allowed == false"
            - "ServicePlan.${plan_id}.version == 1"

      - name: obstruction_scan_computed_pct_and_verdict_at_the_marginal_boundary
        claim_type: computed_fields
        grounds:
          - entities.ObstructionScan.fields.obstruction_pct
          - entities.ObstructionScan.fields.scan_verdict
          - entities.Terminal.fields.last_scan_verdict
        distinguishing_aspect: "16 obstructed of 200 samples is exactly 8.00 pct, the closed upper edge of the MARGINAL band (PASS <= 2.00 < MARGINAL <= 8.00 < FAIL), so the verdict is MARGINAL and the terminal remains installable."
        test_recipe:
          setup:
            - "Subscriber sub1@example.com exists and terminal TRM-0001 assigned to them has been marked DELIVERED."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
          trigger:
            - call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans"
              payload: { obstructed_sample_count: 16, total_sample_count: 200 }
              as: Subscriber
              as_user_id: "${sub1_id}"
              captures: { scan_id: "$.data.id" }
          assert:
            - "trigger response HTTP status == 201"
            - "ObstructionScan.${scan_id}.obstruction_pct == 8.00"
            - "ObstructionScan.${scan_id}.scan_verdict == MARGINAL"
            - "ObstructionScan.${scan_id}.scanned_at == 2026-08-01T00:00:00.000Z"
            - "ObstructionScan.${scan_id}.terminal_id == ${term1_id}"
            - "Terminal.${term1_id}.last_scan_verdict == MARGINAL"

      - name: subscriber_creation_with_extra_field_account_state_ignored_input
        claim_type: system_fields
        grounds:
          - entities.Subscriber.fields.account_state
          - entities.Subscriber.fields.credit_balance_cents
          - entities.Subscriber.fields.pending_charge_cents
        distinguishing_aspect: "A client-supplied account_state (and any id/version) is ignored: the row is minted PROSPECT with all three money counters at 0 and version 1, and the id carries no type prefix."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z; no subscriber exists."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA", account_state: "ACTIVE", credit_balance_cents: 5000, version: 9 }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
          assert:
            - "trigger response HTTP status == 201"
            - "Subscriber.${sub1_id}.account_state == PROSPECT (the supplied ACTIVE is ignored)"
            - "Subscriber.${sub1_id}.credit_balance_cents == 0 (the supplied 5000 is ignored)"
            - "Subscriber.${sub1_id}.pending_credit_cents == 0"
            - "Subscriber.${sub1_id}.pending_charge_cents == 0"
            - "Subscriber.${sub1_id}.version == 1 (the supplied 9 is ignored)"
            - "Subscriber.${sub1_id}.created_at == 2026-08-01T00:00:00.000Z and updated_at == 2026-08-01T00:00:00.000Z"
            - "Subscriber.${sub1_id}.id is a bare UUID with no type prefix"

      - name: spectrum_license_creation_with_invalid_enum_frequency_band_rejected
        claim_type: type_constraints
        grounds:
          - entities.SpectrumLicense.fields.frequency_band
          - validations[priority=4]
        distinguishing_aspect: "frequency_band is a closed enum; a plausible-but-undeclared member (S_BAND) is rejected at priority 4 with 400 before any uniqueness or state check runs."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-BAD-BAND", jurisdiction_code: "US-CA", frequency_band: "S_BAND", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1" }
              as: ComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 400"
            - "trigger response: data.error_id == ERR_INVALID_REQUEST"

      - name: obstruction_scan_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ObstructionScan
          - 'endpoints["GET /satellite-broadband/terminals/{id}/obstruction-scans"]'
        distinguishing_aspect: "ObstructionScan is common_fields: false — rows carry only id and created_at (no version, no updated_at) and §1.5 declares no update or delete route, so a second scan appends a row instead of mutating the first."
        test_recipe:
          setup:
            - "Subscriber sub1@example.com owns terminal TRM-0001 in state DELIVERED; one scan of 16/200 (8.00 MARGINAL) was taken at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
            - call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans"
              payload: { obstructed_sample_count: 16, total_sample_count: 200 }
              as: Subscriber
              as_user_id: "${sub1_id}"
              captures: { scan1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans"
              payload: { obstructed_sample_count: 1, total_sample_count: 200 }
              as: Subscriber
              as_user_id: "${sub1_id}"
              captures: { scan2_id: "$.data.id" }
            - { call: "GET /satellite-broadband/terminals/${term1_id}/obstruction-scans", payload: { limit: 10, offset: 0 }, as: LogisticsCoordinator }
          assert:
            - "first trigger response HTTP status == 201"
            - "ObstructionScan.${scan2_id} response body contains id and created_at but NO version and NO updated_at key"
            - "ObstructionScan.${scan1_id}.obstruction_pct == 8.00 and scan_verdict == MARGINAL (unchanged by the second scan)"
            - "ObstructionScan.${scan1_id}.scanned_at == 2026-08-01T00:00:00.000Z"
            - "ObstructionScan.${scan2_id}.obstruction_pct == 0.50 and scan_verdict == PASS"
            - "second trigger response: data.total_count == 2"
            - "Terminal.${term1_id}.last_scan_verdict == PASS (newest qualifying scan wins)"

      - name: service_cell_creation_with_unknown_beam_returns_beam_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ServiceCell.fields.beam_id
          - validations[priority=6]
          - 'errors[ERR_BEAM_NOT_FOUND]'
        distinguishing_aspect: "A cell's beam_id is a body FK resolved at priority 6: an unknown beam yields 404 ERR_BEAM_NOT_FOUND and no cell row, so the cell can never dangle."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z; no beam exists."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-ORPHAN", beam_id: "00000000-0000-0000-0000-000000000000", jurisdiction_code: "US-CA", max_active_terminals: 2 }
              as: NetworkOpsEngineer
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 404"
            - "trigger response: data.error_id == ERR_BEAM_NOT_FOUND"
            - "GET /satellite-broadband/service-cells returns data.total_count == 0"

      - name: service_order_with_unknown_plan_returns_service_plan_not_found
        claim_type: cross_reference_integrity
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=6]
          - 'errors[ERR_SERVICE_PLAN_NOT_FOUND]'
        distinguishing_aspect: "entity_topology is flat, so a ServiceOrder carries three independent FKs; with a valid subscriber and cell but an unknown requested_plan_id the request still fails 404 ERR_SERVICE_PLAN_NOT_FOUND and consumes no slot."
        test_recipe:
          setup:
            - "An ACTIVE + COORDINATED licence, beam BEAM-01, cell CELL-001 (max_active_terminals 2) and subscriber sub1@example.com exist; no ServicePlan row exists."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 2 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
          trigger:
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub1_id}", service_cell_id: "${cell_id}", requested_plan_id: "00000000-0000-0000-0000-000000000000" }
              as: ProvisioningAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 404"
            - "trigger response: data.error_id == ERR_SERVICE_PLAN_NOT_FOUND"
            - "ServiceCell.${cell_id}.reserved_slot_count == 0 and free_slot_count == 2 and version == 1"
            - "Subscriber.${sub1_id}.account_state == PROSPECT"

  # ===================================================================================
  # SECTION 2 — state_machines
  # ===================================================================================
  - section: state_machines
    instances:

      - name: terminal_deliver_moves_shipped_to_delivered
        claim_type: valid_transition
        grounds:
          - state_machines.Terminal.SHIPPED_to_DELIVERED
          - 'endpoints["POST /satellite-broadband/terminals/{id}/deliver"]'
        distinguishing_aspect: "The first logistics hop: a SHIPPED terminal moves to DELIVERED and its version increments to 2, while installed_at stays null (delivery is not installation)."
        test_recipe:
          setup:
            - "Subscriber sub1@example.com exists; terminal TRM-0001 was created for them and is SHIPPED with version 1."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
          trigger:
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
          assert:
            - "trigger response HTTP status == 200"
            - "Terminal.${term1_id}.terminal_state == DELIVERED"
            - "Terminal.${term1_id}.version == 2"
            - "Terminal.${term1_id}.installed_at == null"
            - "Terminal.${term1_id}.last_scan_verdict == null"
            - "Terminal.${term1_id}.replaces_terminal_id == null"

      - name: license_coordination_refused_suspends_every_beam_on_the_licence
        claim_type: side_effect_execution
        grounds:
          - state_machines.SpectrumLicense.PENDING_COORDINATION_to_REFUSED
          - entities.Beam.fields.beam_state
        distinguishing_aspect: "Branch B of the coordination fork carries a side-effect set the GRANTED branch does not: coordination_state becomes REFUSED and every beam on the licence is driven to SUSPENDED in the same request."
        test_recipe:
          setup:
            - "A PENDING_COORDINATION licence LIC-US-CA-KA-01 exists with beam BEAM-01 (ACTIVE, version 1) created on it."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
          trigger:
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "REFUSED", coordination_note: "neighbour operator objection upheld" }, as: ComplianceOfficer }
          assert:
            - "trigger response HTTP status == 200"
            - "SpectrumLicense.${lic_id}.license_state == REFUSED"
            - "SpectrumLicense.${lic_id}.coordination_state == REFUSED"
            - "SpectrumLicense.${lic_id}.coordination_note == 'neighbour operator objection upheld'"
            - "SpectrumLicense.${lic_id}.version == 2"
            - "Beam.${beam_id}.beam_state == SUSPENDED"
            - "Beam.${beam_id}.version == 2"

      - name: service_order_takes_the_waitlisted_branch_when_no_slot_is_free
        claim_type: valid_transition
        grounds:
          - state_machines.ServiceOrder.PENDING_DETERMINATION_to_WAITLISTED
          - calculations.waitlist_priority_score
          - entities.ServiceCell.fields.waitlist_depth
        distinguishing_aspect: "Fork branch B on a single-slot cell already holding one RESERVED order: the second order becomes WAITLISTED with score 3*1000 + 0 waiting days == 3000, consumes no slot, and moves its subscriber to WAITLISTED instead."
        test_recipe:
          setup:
            - "ACTIVE + COORDINATED licence, beam BEAM-01 (100 Mbps), cell CELL-001 with max_active_terminals 1, plan PLAN-P1-200 (PRIORITY_1)."
            - "Subscriber sub1 holds the only RESERVED order on CELL-001, so free_slot_count is 0 and waitlist_depth is 0; subscriber sub2 exists as a PROSPECT."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100, oversubscription_limit: 4.0 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 1 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-200", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, priority_data_gb: 100, deprioritized_rate_mbps: 20, overage_rate_cents_per_gb: 25, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub1_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub2@example.com", full_name: "Sub Two", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub2_id: "$.data.id" }
          trigger:
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub2_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order2_id: "$.data.id" }
          assert:
            - "trigger response HTTP status == 201"
            - "ServiceOrder.${order2_id}.order_state == WAITLISTED"
            - "ServiceOrder.${order2_id}.waitlist_priority_score == 3000"
            - "ServiceOrder.${order2_id}.reservation_expires_at == null"
            - "ServiceOrder.${order2_id}.promoted_at == null"
            - "ServiceOrder.${order1_id}.order_state == RESERVED"
            - "Subscriber.${sub2_id}.account_state == WAITLISTED"
            - "ServiceCell.${cell_id}.reserved_slot_count == 1"
            - "ServiceCell.${cell_id}.free_slot_count == 0"
            - "ServiceCell.${cell_id}.waitlist_depth == 1"
            - "ServiceCell.${cell_id}.availability_state == WAITLIST_ONLY"

      - name: terminal_install_from_shipped_rejected_as_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Terminal.transitions
          - validations[priority=9]
          - 'errors[ERR_TERMINAL_STATE_INVALID]'
        distinguishing_aspect: "install is declared only from DELIVERED or TRANSFER_PENDING; from SHIPPED the priority-9 state gate fires (409 ERR_TERMINAL_STATE_INVALID) BEFORE the priority-31 obstruction-scan gate, even though no scan exists either."
        test_recipe:
          setup:
            - "Subscriber sub1@example.com owns terminal TRM-0001, which is still SHIPPED and has no obstruction scan."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
          trigger:
            - call: "POST /satellite-broadband/terminals/${term1_id}/install"
              payload: {}
              as: ProvisioningAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response: data.error_id == ERR_TERMINAL_STATE_INVALID (not ERR_OBSTRUCTION_SCAN_REQUIRED)"
            - "Terminal.${term1_id}.terminal_state == SHIPPED"
            - "Terminal.${term1_id}.installed_at == null"
            - "Terminal.${term1_id}.version == 1"

      - name: license_coordination_recorded_twice_rejected_as_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.SpectrumLicense.PENDING_COORDINATION_to_ACTIVE
          - validations[priority=8]
          - 'errors[ERR_LICENSE_STATE_INVALID]'
        distinguishing_aspect: "A GRANTED coordination is not idempotent: the second identical call finds the licence ACTIVE and already COORDINATED — neither PENDING_COORDINATION nor ACTIVE-and-UNCOORDINATED — so it is rejected 409 and the version does not move again."
        test_recipe:
          setup:
            - "Licence LIC-US-CA-KA-01 was granted coordination once and is ACTIVE + COORDINATED at version 2."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
          trigger:
            - call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination"
              payload: { outcome: "GRANTED", coordination_note: "duplicate filing" }
              as: ComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response: data.error_id == ERR_LICENSE_STATE_INVALID"
            - "SpectrumLicense.${lic_id}.license_state == ACTIVE"
            - "SpectrumLicense.${lic_id}.coordination_state == COORDINATED"
            - "SpectrumLicense.${lic_id}.coordination_note == 'no neighbour objection' (the duplicate note was not stored)"
            - "SpectrumLicense.${lic_id}.version == 2"

      - name: outage_event_resolved_twice_rejected_as_already_resolved
        claim_type: idempotency
        grounds:
          - state_machines.OutageEvent.OPEN_to_RESOLVED
          - validations[priority=14]
          - 'errors[ERR_OUTAGE_ALREADY_RESOLVED]'
        distinguishing_aspect: "A second resolve on the same event is refused 409 ERR_OUTAGE_ALREADY_RESOLVED and cannot re-stamp outage_minutes; with no authorised subscription on the beam the first resolve produced generated_credit_count 0 despite being SLA-eligible."
        test_recipe:
          setup:
            - "ACTIVE + COORDINATED licence and beam BEAM-01 exist; no subscription is provisioned on the beam."
            - "Clock at 2026-08-02T00:00:00Z; an EQUIPMENT_FAILURE / FULL_OUTAGE event ran [2026-08-01T10:00:00Z, 2026-08-01T11:00:00Z) and has already been resolved (outage_minutes 60)."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100, oversubscription_limit: 4.0 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/outage-events"
              payload: { beam_id: "${beam_id}", cause: "EQUIPMENT_FAILURE", severity: "FULL_OUTAGE", started_at: "2026-08-01T10:00:00Z" }
              as: NetworkOpsEngineer
              captures: { ev1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/outage-events/${ev1_id}/resolve", payload: { ended_at: "2026-08-01T11:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - call: "POST /satellite-broadband/outage-events/${ev1_id}/resolve"
              payload: { ended_at: "2026-08-01T12:00:00Z" }
              as: NetworkOpsEngineer
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response: data.error_id == ERR_OUTAGE_ALREADY_RESOLVED"
            - "OutageEvent.${ev1_id}.event_state == RESOLVED"
            - "OutageEvent.${ev1_id}.ended_at == 2026-08-01T11:00:00.000Z"
            - "OutageEvent.${ev1_id}.outage_minutes == 60"
            - "OutageEvent.${ev1_id}.credit_eligible == true"
            - "OutageEvent.${ev1_id}.generated_credit_count == 0"
            - "GET /satellite-broadband/outage-credits returns data.total_count == 0"

      - name: refused_licence_is_terminal_and_rejects_enforcement_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SpectrumLicense.terminal_states
          - validations[priority=8]
        distinguishing_aspect: "REFUSED is a terminal state: a SUSPEND enforcement action (which is legal only from ACTIVE) is refused 409 and cannot resurrect the licence or un-suspend its beams."
        test_recipe:
          setup:
            - "Licence LIC-US-CA-KA-01 had coordination REFUSED and sits in the terminal state REFUSED at version 2."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "REFUSED", coordination_note: "objection upheld" }, as: ComplianceOfficer }
          trigger:
            - call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/enforcement-action"
              payload: { action: "SUSPEND", reason: "attempt to act on a refused licence" }
              as: ComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response: data.error_id == ERR_LICENSE_STATE_INVALID"
            - "SpectrumLicense.${lic_id}.license_state == REFUSED"
            - "SpectrumLicense.${lic_id}.enforcement_reason == null"
            - "SpectrumLicense.${lic_id}.version == 2"

