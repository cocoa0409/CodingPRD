# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# task_3305_third_party_multifamily_management_agreements_owner_reporting
# Two instances per Difficulty Rule (§0.5), 18 instances total.
# All fixture arithmetic was executed and verified before pinning literals.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: statement_fee_cash_vs_accrual_diverge_on_late_collection
        grounds:
          - calculations.management_fee_invoice
          - calculations.management_fee_invoice.variants.cash_basis
          - calculations.management_fee_invoice.variants.accrual_basis
          - entities.MonthlyStatement.fields.basis
          - entities.LedgerEntry.fields.collected_month
        distinguishing_aspect: |
          Fee-basis dual variant on the MonthlyStatement domain: identical
          LedgerEntry rows produce base_fee_cents == 384000 under CASH and
          388000 under ACCRUAL because a 100000-cent rent charge accrued in
          2026-09 but collected in 2026-10 is excluded from CASH September
          revenue and included in ACCRUAL September revenue.
        test_recipe:
          setup:
            - "Owner O ACTIVE; Agreement AG ACTIVE with base_fee_pct=0.04, minimum_monthly_fee_cents=250000, incentive_threshold_egi_cents=12000000, incentive_tier1_rate=0.10, effective 2026-08-01, term end 2027-07-31"
            - "Property P MANAGED with one Resident R1"
            - "Ledger (all POSTED, kind RENT unless noted): L1 accrual 2026-09 collected 2026-09 amount 9000000; L2 accrual 2026-09 collected 2026-10 amount 100000; L3 kind FEE accrual 2026-09 collected 2026-09 amount 400000; L4 kind RECOVERY accrual 2026-09 collected 2026-09 amount 200000"
            - "Two OPEN statements: S_CASH (period 2026-09, basis CASH) and S_ACCR (period 2026-09, basis ACCRUAL)"
            - "Logical clock at 2026-10-01T00:00:00Z (September has ended)"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "DV Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { o_id: $.data.id }
            - call: "POST /mgmt/owners/${o_id}/properties"
              payload: { name: "DV Property", unit_count: 200 }
              as: PortfolioManager
              captures: { p_id: $.data.id }
            - call: "POST /mgmt/owners/${o_id}/agreements"
              payload: { property_id: "${p_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /mgmt/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${p_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-08-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { ob_id: $.data.id }
            - call: "POST /mgmt/properties/${p_id}/residents"
              payload: { unit_label: "101", full_name: "Res One", lease_end_date: "2027-07-31T00:00:00Z" }
              as: PropertyAccountant
              captures: { r1_id: $.data.id }
            - call: "POST /mgmt/onboardings/${ob_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/properties/${p_id}/ledger-entries"
              payload: { resident_id: "${r1_id}", kind: RENT, amount_cents: 9000000, accrual_month: "2026-09", collected_month: "2026-09" }
              as: PropertyAccountant
            - call: "POST /mgmt/properties/${p_id}/ledger-entries"
              payload: { resident_id: "${r1_id}", kind: RENT, amount_cents: 100000, accrual_month: "2026-09", collected_month: "2026-10" }
              as: PropertyAccountant
            - call: "POST /mgmt/properties/${p_id}/ledger-entries"
              payload: { resident_id: "${r1_id}", kind: FEE, amount_cents: 400000, accrual_month: "2026-09", collected_month: "2026-09" }
              as: PropertyAccountant
            - call: "POST /mgmt/properties/${p_id}/ledger-entries"
              payload: { resident_id: "${r1_id}", kind: RECOVERY, amount_cents: 200000, accrual_month: "2026-09", collected_month: "2026-09" }
              as: PropertyAccountant
            - call: "POST /mgmt/properties/${p_id}/statements"
              payload: { period_month: "2026-09", basis: CASH }
              as: PropertyAccountant
              captures: { s_cash_id: $.data.id }
            - call: "POST /mgmt/properties/${p_id}/statements"
              payload: { period_month: "2026-09", basis: ACCRUAL }
              as: PropertyAccountant
              captures: { s_accr_id: $.data.id }
            - call: "POST /mgmt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PortfolioManager
          trigger:
            - call: "POST /mgmt/statements/${s_cash_id}/close"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/statements/${s_accr_id}/close"
              payload: {}
              as: PropertyAccountant
          assert:
            - "MonthlyStatement.${s_cash_id}.collected_revenue_cents == 9600000"
            - "MonthlyStatement.${s_cash_id}.base_fee_cents == 384000"
            - "MonthlyStatement.${s_cash_id}.incentive_fee_cents == 0"
            - "MonthlyStatement.${s_accr_id}.collected_revenue_cents == 9700000"
            - "MonthlyStatement.${s_accr_id}.base_fee_cents == 388000"
            - "MonthlyStatement.${s_accr_id}.incentive_fee_cents == 0"

      - name: claim_settlement_shares_diverge_by_indemnification_domain
        grounds:
          - calculations.claim_settlement_shares
          - entities.Claim.fields.indemnified_by
          - entities.ClaimSettlement.fields.manager_share_cents
        distinguishing_aspect: |
          Risk-allocation dual variant on the Claim domain (a different entity
          domain from statement fees): identical amount_cents == 4000000 yields
          manager_share_cents == 0 under indemnified_by == OWNER but
          manager_share_cents == 1000000 (25% round_half_up) under
          indemnified_by == SHARED, and owner_share always absorbs the
          remainder so shares sum to amount_cents.
        test_recipe:
          setup:
            - "Owner O2 ACTIVE; Agreement AG2 ACTIVE (effective 2026-08-01, term end 2027-07-31); Property P2 MANAGED (onboarding completed with zero balances and one resident)"
            - "Claim C_OWNER: claim_type RESIDENT_INCIDENT, reserved 0, indemnified_by OWNER, incident 2026-09-10, moved to UNDER_REVIEW"
            - "Claim C_SHARED: claim_type EMPLOYMENT, reserved 0, indemnified_by SHARED, incident 2026-09-11, moved to UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Share Owner LLC", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { o2_id: $.data.id }
            - call: "POST /mgmt/owners/${o2_id}/properties"
              payload: { name: "Share Property", unit_count: 100 }
              as: PortfolioManager
              captures: { p2_id: $.data.id }
            - call: "POST /mgmt/owners/${o2_id}/agreements"
              payload: { property_id: "${p2_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { ag2_id: $.data.id, ag2_v: $.data.version }
            - call: "POST /mgmt/agreements/${ag2_id}/activate"
              payload: { expected_agreement_version: "${ag2_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${p2_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-08-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { ob2_id: $.data.id }
            - call: "POST /mgmt/properties/${p2_id}/residents"
              payload: { unit_label: "201", full_name: "Res Two", lease_end_date: "2027-07-31T00:00:00Z" }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob2_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob2_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob2_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob2_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob2_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/properties/${p2_id}/claims"
              payload: { claim_type: RESIDENT_INCIDENT, reserved_amount_cents: 0, indemnified_by: OWNER, incident_date: "2026-09-10T00:00:00Z" }
              as: RiskOfficer
              captures: { c_owner_id: $.data.id }
            - call: "POST /mgmt/claims/${c_owner_id}/begin_review"
              payload: {}
              as: RiskOfficer
              captures: { c_owner_v: $.data.version }
            - call: "POST /mgmt/properties/${p2_id}/claims"
              payload: { claim_type: EMPLOYMENT, reserved_amount_cents: 0, indemnified_by: SHARED, incident_date: "2026-09-11T00:00:00Z" }
              as: RiskOfficer
              captures: { c_shared_id: $.data.id }
            - call: "POST /mgmt/claims/${c_shared_id}/begin_review"
              payload: {}
              as: RiskOfficer
              captures: { c_shared_v: $.data.version }
          trigger:
            - call: "POST /mgmt/claims/${c_owner_id}/settle"
              payload: { amount_cents: 4000000, expected_claim_version: "${c_owner_v}" }
              as: RiskOfficer
            - call: "POST /mgmt/claims/${c_shared_id}/settle"
              payload: { amount_cents: 4000000, expected_claim_version: "${c_shared_v}" }
              as: RiskOfficer
            - call: "GET /mgmt/claims/${c_owner_id}/settlements"
              payload: {}
              as: RiskOfficer
              captures: { s_owner_mgr: "$.data[0].manager_share_cents", s_owner_own: "$.data[0].owner_share_cents" }
            - call: "GET /mgmt/claims/${c_shared_id}/settlements"
              payload: {}
              as: RiskOfficer
              captures: { s_shared_mgr: "$.data[0].manager_share_cents", s_shared_own: "$.data[0].owner_share_cents" }
          assert:
            - "ClaimSettlement for ${c_owner_id}: manager_share_cents == 0 and owner_share_cents == 4000000"
            - "ClaimSettlement for ${c_shared_id}: manager_share_cents == 1000000 and owner_share_cents == 3000000"
            - "manager_share_cents + owner_share_cents == 4000000 for both settlements"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: staffing_allocation_mode_a_nested_conditionals
        grounds:
          - calculations.staffing_cost_allocation
          - entities.StaffPosition.fields.shared_region_code
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction (nested
          conditional on status==ACTIVE for both the property pool and the
          cross-property regional pool, plus a property_share ratio): two
          properties sharing region R1 produce payroll_charge_cents == 570240
          for the fixture, while flipping the second property's position to
          INACTIVE (via agreement suspension) changes the regional pool and
          hence the first property's charge — a value no per-property formula
          reproduces.
        test_recipe:
          setup:
            - "Owner O3; Agreements AG3a (property P3a) and AG3b (property P3b), both ACTIVE; both properties MANAGED with zero-balance onboarding and one resident each"
            - "StaffPosition SP3a on P3a: hourly_cost_cents=3000, scheduled_hours_per_week=30, shared_region_code=R1, ACTIVE"
            - "StaffPosition SP3b on P3b: hourly_cost_cents=3000, scheduled_hours_per_week=30, shared_region_code=R1, ACTIVE"
            - "Statement SM3 (P3a, 2026-09, CASH) OPEN; no revenue ledger rows; clock at 2026-10-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Staff Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { o3_id: $.data.id }
            - call: "POST /mgmt/owners/${o3_id}/properties"
              payload: { name: "Staff Prop A", unit_count: 100 }
              as: PortfolioManager
              captures: { p3a_id: $.data.id }
            - call: "POST /mgmt/owners/${o3_id}/properties"
              payload: { name: "Staff Prop B", unit_count: 100 }
              as: PortfolioManager
              captures: { p3b_id: $.data.id }
            - call: "POST /mgmt/owners/${o3_id}/agreements"
              payload: { property_id: "${p3a_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { ag3a_id: $.data.id, ag3a_v: $.data.version }
            - call: "POST /mgmt/agreements/${ag3a_id}/activate"
              payload: { expected_agreement_version: "${ag3a_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${p3a_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-08-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { ob3a_id: $.data.id }
            - call: "POST /mgmt/properties/${p3a_id}/residents"
              payload: { unit_label: "1A", full_name: "Res A", lease_end_date: "2027-07-31T00:00:00Z" }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob3a_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob3a_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob3a_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob3a_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob3a_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/owners/${o3_id}/agreements"
