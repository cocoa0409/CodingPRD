              as: FleetPlanner
              captures: { trip_1_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/stops"
              payload: { sequence: 1, stop_type: "DELIVERY", store_id: "${store_s1_id}", replenishment_order_id: "${ord_1_id}", scheduled_arrival_at: "2026-08-03T09:00:00Z", scheduled_departure_at: "2026-08-03T10:45:00Z", drive_minutes_from_prev: 150, miles_from_prev: 150, segment_loaded: true, cases: 900 }
              as: FleetPlanner
