  # ===========================================================================
  - section: validations
    instances:

      - name: missing_role_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Any endpoint called with no X-User-Role header returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /causes"
              payload: {}
              as: Policyholder
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
          assert:
            - "a call with the X-User-Role header omitted entirely returns 401 ERR_UNAUTHENTICATED (distinct from an unknown id)"

      - name: authorize_before_existence_role_check_beats_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: "A role not allowed on the endpoint AND a nonexistent path id: priority 2 ERR_FORBIDDEN (403) beats priority 3 ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. No rate filings exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rate-filings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/approve"
              payload: {}
              as: FinanceOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (HTTP 403) — the FinanceOps role gate fires before the existence check on the missing filing"

      - name: fee_cap_violation_on_update
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors.ERR_FLAT_FEE_VIOLATES_FILING
        distinguishing_aspect: "Updating a DRAFT config to flat_fee_pct 0.40 against a filing capped at 0.25 with a CURRENT version fails 422 ERR_FLAT_FEE_VIOLATES_FILING (contrast with §1.8 stale-version priority test)."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. TX filing APPROVED cap 0.25; DRAFT FeeConfig pct 0.20."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.25, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
            - call: "POST /rate-filings/${filing}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc: $.data.id, fc_v: $.data.version }
          trigger:
            - call: "POST /fee-configs/${fc}/update"
              payload: { flat_fee_pct: 0.40, expected_fee_config_version: "${fc_v}" }
              as: UnderwritingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FLAT_FEE_VIOLATES_FILING (HTTP 422); FeeConfig.${fc}.flat_fee_pct == 0.20"

