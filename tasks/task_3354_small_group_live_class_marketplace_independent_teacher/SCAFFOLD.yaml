# =============================================================================
# SCAFFOLD.yaml — task_3354_small_group_live_class_marketplace_independent_teacher
# Small-Group Live Class Marketplace & Independent Teacher Onboarding
# §1.0–§1.7 (difficulty index lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#           corner index lives in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Small-Group Live Class Marketplace & Independent Teacher Onboarding (Outschool):
  teacher application with background screening, teaching sample review and approval to
  publish classes, class listing creation with age ranges, class size limits, formats
  across one-time, multi-day and ongoing sections, section scheduling across time zones
  with enrollment minimums and automatic cancellation, learner and parent accounts with
  parent-managed enrollment and communication monitoring, refund policy tiers by
  cancellation timing and section format with automated processing, class quality review
  from parent reports with content policy enforcement and teacher suspension, teacher
  payout schedules with platform service fees and tax documentation, subscription and
  coupon programs affecting section economics.

domain_name: outschool-marketplace
api_prefix: /outschool

complexity_profile:
  focus: "Generate task much harder than expert level!"
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
    - selector_policy
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 8
  endpoint_count: 40
  error_code_count: 39
  calculation_count: 8
  validation_count: 39
  role_count: 5

# =============================================================================
# Pinned constants — every symbolic name referenced anywhere in §1.1–§1.9
# resolves to a literal here. No CONST.* name may be used without a value.
# =============================================================================
constants:
  CURRENT_DEFAULT_UTC: "2026-09-01T00:00:00Z"
  SAMPLE_MIN_MINUTES: 5
  SCREENING_VALIDITY_PERIODS: 365
  APPLICATION_MAX_REVISIONS: 3
  REVIEWER_SLA_PERIODS: 7
  AUTO_CANCEL_CUTOFF_HOURS: 24
  REPORT_SLA_PERIODS: 14
  REPORT_MAX_PER_SECTION: 2
  PAYOUT_APPROVAL_CAP_CENTS: 100000
  TAX_DOC_REQUIRED_CENTS: 20000
  TAX_DOC_VALIDITY_CEILING_CENTS: 200000
  REFUND_PARTIAL_RATE: 0.50
  REFUND_TEACHER_LIABILITY_RATE: 0.50
  REFUND_FULL_CUTOFF_HOURS: { ONE_TIME: 168, MULTI_DAY: 336, ONGOING: 336 }
  REFUND_HALF_CUTOFF_HOURS: { ONE_TIME: 24, MULTI_DAY: 72, ONGOING: 168 }
  SPECIAL_REFUND_TIMEZONE: "America/Anchorage"
  RISK_SUSPENSION_THRESHOLD: 40
  CATEGORY_WEIGHT: { CONTENT_POLICY: 25, SAFETY: 40, CONDUCT: 15, TECHNICAL: 5, OTHER: 2 }
  SEVERITY_POINTS: { LOW: 0, MEDIUM: 10, HIGH: 25 }
  SUB_DISCOUNT_NONE: 0.00
  SUB_DISCOUNT_PLUS: 0.10
  SUB_DISCOUNT_FAMILY: 0.20
  SUBSCRIPTION_INCLUDED_CREDIT_CENTS: { NONE: 0, PLUS: 5000, FAMILY: 12000 }
  CATALOG_COUPONS:
    WELCOME5: { type: PERCENT, value: 0.05 }
    FLAT250: { type: AMOUNT_CENTS, value: 250 }
    SIBLING10: { type: PERCENT, value: 0.10 }
    SPRING15: { type: PERCENT, value: 0.15 }
  FEE_BANDS: { B0: { min_gross: 0, rate: 0.30 }, B1: { min_gross: 2000, rate: 0.25 }, B2: { min_gross: 5000, rate: 0.20 }, B3: { min_gross: 10000, rate: 0.15 } }
  FORMAT_ADJUSTMENT: { ONE_TIME: 0.00, MULTI_DAY: -0.02, ONGOING: -0.03 }
  VOLUME_DISCOUNT: 0.02
  VOLUME_DISCOUNT_THRESHOLD_CENTS: 500000
  FEE_RATE_FLOOR: 0.10
  # Deterministic screening fixtures: the background-screening provider is a
  # pure function of the applicant's email, so a screening outcome is reproducible
  # without any wall-clock or network dependency.
  SCREENING_OUTCOME_BY_APPLICATION:
    "ada@example.com": PASS
    "grace@example.com": PASS
    "linus@example.com": PASS
    "alan@example.com": FAIL
    "edsger@example.com": FAIL
    "default": PASS

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: TeacherApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_user_id, type: string, source: input, description: "Opaque applicant operator identifier supplied at application time" }
      - { name: applicant_email, type: string, source: input, description: "Applicant contact email" }
      - { name: display_name, type: string, source: input, description: "Public-facing teacher name the applicant intends to use" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCREENING_PENDING | SCREENING_FAILED | SCREENING_PASSED | SAMPLE_PENDING | SAMPLE_REJECTED | SAMPLE_APPROVED | APPROVED | REJECTED", constraints: "enum values are produced only by the TeacherApplication state machine in §1.2" }
      - { name: screening_outcome, type: enum, source: system, description: "null | PASS | FAIL", default: null }
      - { name: screening_is_stale, type: boolean, source: computed, description: "True when the latest COMPLETE screening record for this applicant is older than SCREENING_VALIDITY_PERIODS periods" }
      - { name: screening_completed_period_index, type: integer, source: system, description: "Period index at which this applicant's latest COMPLETE screening was recorded; null until one exists" }
      - { name: teaching_sample_url, type: string, source: input, description: "Reference to the uploaded teaching sample; null until submitted" }
      - { name: teaching_sample_minutes, type: integer, source: input, description: "Sample duration in whole minutes" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "Opaque Reviewer operator id currently bound as the assigned reviewer; null when unbound" }
      - { name: reviewer_bound_period_index, type: integer, source: system, description: "Period index at which reviewed_by_user_id was bound" }
      - { name: decision, type: enum, source: system, description: "null | APPROVE | REJECT", default: null, constraints: "set only by the reviewer decision transition" }
      - { name: decision_reason_code, type: enum, source: system, description: "null | SAMPLE_QUALITY | POLICY_VIOLATION | INCOMPLETE_MATERIALS", default: null }
      - { name: revision_count, type: integer, source: system, description: "Number of reviewer REJECT decisions recorded for this application; starts at 0" }
      - { name: eligible_for_appeal, type: boolean, source: computed, description: "True when status is REJECTED and revision_count is still below APPLICATION_MAX_REVISIONS" }

  # ---------------------------------------------------------------------------
  - name: Teacher
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> TeacherApplication.id; the application whose review produced this teacher" }
      - { name: display_name, type: string, source: system, description: "Public teacher name copied from the source application" }
      - { name: status, type: enum, source: system, description: "PENDING_SETUP | ACTIVE | SUSPENDED | TERMINATED", constraints: "enum values are produced only by the Teacher state machine in §1.2" }
      - { name: screening_validity_period_index, type: integer, source: computed, description: "screening_completed_period_index + SCREENING_VALIDITY_PERIODS; the period through which a re-screen is not yet due" }
      - { name: payout_tax_document_status, type: enum, source: computed, description: "ON_FILE | REQUIRED_UPDATE | EXPIRED; a pure function of lifetime_net_earnings_cents against TAX_DOC_* constants. ON_FILE at zero earnings; REQUIRED_UPDATE once earnings exceed TAX_DOC_REQUIRED_CENTS; EXPIRED beyond TAX_DOC_VALIDITY_CEILING_CENTS" }
      - { name: suspension_reason, type: string, source: system, description: "Reason text recorded when status became SUSPENDED; last-write-wins across repeated suspensions" }
      - { name: suspension_trigger, type: enum, source: system, description: "null | POLICY | MANUAL", constraints: "POLICY is written only by the report cascade; MANUAL only by the suspend endpoint. A teacher is never suspended for tax-document reasons: an out-of-date tax document blocks payout settlement (ERR_TAX_DOC_MISSING) without changing teacher status" }
      - { name: open_report_count, type: integer, source: computed, description: "Count of ParentReport rows against this teacher whose status is not CLOSED and not RESOLVED" }
      - { name: open_report_risk_score, type: integer, source: computed, description: "Sum of severity_weight over reports in OPEN status only" }
      - { name: upheld_report_risk_score, type: integer, source: computed, description: "Sum of severity_weight over reports whose disposition is WARNING or MORE_SEVERE, regardless of status" }
      - { name: actionable_risk_score, type: integer, source: computed, description: "max(open_report_risk_score, upheld_report_risk_score)" }
      - { name: peak_actionable_risk_score, type: integer, source: computed, description: "High-water mark of actionable_risk_score over the teacher's lifetime; never decreases" }
      - { name: lifetime_net_earnings_cents, type: integer, source: computed, description: "Sum over all non-VOIDED TeacherPayout rows of net_payout_cents; never decreases" }
      - { name: lifetime_fee_reversed_cents, type: integer, source: computed, description: "Sum over all non-VOIDED TeacherPayout rows of platform_fee_reversed_cents; never decreases" }
      - { name: lifetime_teacher_liability_cents, type: integer, source: computed, description: "Sum over all non-VOIDED TeacherPayout rows of teacher_liability_cents; never decreases" }
      - { name: unpaid_earnings_cents, type: integer, source: computed, description: "Sum of net_payout_cents over TeacherPayout rows whose status is not PAID and not VOIDED" }
      - { name: re_screen_required, type: boolean, source: computed, description: "True when current_period_index > screening_validity_period_index" }

  # ---------------------------------------------------------------------------
  - name: ClassListing
    parent: Teacher
    common_fields: true
    fields:
      - { name: teacher_id, type: string, source: system, description: "FK -> Teacher.id; the teacher who owns this listing" }
      - { name: title, type: string, source: input, description: "Class title shown to parents" }
      - { name: format, type: enum, source: input, description: "ONE_TIME | MULTI_DAY | ONGOING", constraints: "immutable after listing creation" }
      - { name: min_age, type: integer, source: input, description: "Minimum learner age in whole years, 3..18" }
      - { name: max_age, type: integer, source: input, description: "Maximum learner age in whole years; must be >= min_age and <= 18" }
      - { name: max_learners, type: integer, source: input, description: "Listing-level class size ceiling, 1..18; every Section capacity must be <= this" }
      - { name: list_price_cents, type: integer, source: input, description: "Published list price in cents; must be a positive integer" }
      - { name: content_review_state, type: enum, source: system, description: "PENDING_REVIEW | POLICY_APPROVED | POLICY_REJECTED", constraints: "the sole gate on Section creation" }
      - { name: policy_rejection_reason_code, type: enum, source: system, description: "null | AGE_MISMATCH | CONTENT_POLICY | PRICING_POLICY", default: null }
      - { name: lifecycle_state, type: enum, source: system, description: "DRAFT | PUBLISHED | SUSPENDED | ARCHIVED", constraints: "enum values are produced only by the ClassListing lifecycle machine in §1.2" }
      - { name: listing_sequence, type: integer, source: system, description: "Monotonic per-teacher sequence assigned at creation; used as the escalation tie-break" }
      - { name: section_count, type: integer, source: computed, description: "Number of Section rows whose status is not CANCELLED and not COMPLETED" }

  # ---------------------------------------------------------------------------
  - name: Section
    parent: ClassListing
    common_fields: true
    fields:
      - { name: class_listing_id, type: string, source: system, description: "FK -> ClassListing.id; the listing this section schedules" }
      - { name: timezone, type: string, source: input, description: "IANA timezone name, e.g. America/New_York" }
      - { name: start_utc, type: datetime, source: input, description: "Section start instant, ISO 8601 UTC" }
      - { name: end_utc, type: datetime, source: input, description: "Section end instant, ISO 8601 UTC; strictly after start_utc" }
      - { name: min_learners, type: integer, source: input, description: "Enrollment floor; below this at cancellation cutoff the section auto-cancels" }
      - { name: capacity, type: integer, source: input, description: "Seat ceiling, 1..18 and <= the parent listing's max_learners" }
      - { name: expected_learners, type: integer, source: input, default: null, description: "Optional forward-looking enrollment projection used by the cancellation sweep; defaults to min_learners" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN_FOR_ENROLLMENT | MIN_ENROLLMENT_MET | CANCELLED | COMPLETED", constraints: "auto-cancellation writes CANCELLED; learner_fault cancellation of every enrollment writes CANCELLED" }
      - { name: scheduled_start_confirmed, type: boolean, source: computed, description: "True when the current instant is at or before start_utc" }
      - { name: settled, type: boolean, source: computed, description: "True when no enrollment of this section is in RESERVED status — every seat has either been confirmed or has already been resolved" }
      - { name: enrolled_count, type: integer, source: computed, description: "Enrollments in CONFIRMED status" }
      - { name: reserved_count, type: integer, source: computed, description: "Enrollments in RESERVED status" }
      - { name: seats_remaining, type: integer, source: computed, description: "capacity - enrolled_count - reserved_count; never negative" }
      - { name: enrollment_min_met, type: boolean, source: computed, description: "enrolled_count >= min_learners" }
      - { name: outcome, type: enum, source: computed, description: "null | HELD | AUTO_CANCELLED_MIN_ENROLLMENT | AUTO_CANCELLED_SEAT_LOSS | CANCELLED_BY_TEACHER", default: null, constraints: "sealed once non-null and never rewritten" }
      - { name: cancellation_cutoff_utc, type: datetime, source: computed, description: "start_utc minus AUTO_CANCEL_CUTOFF_HOURS; the instant the automatic-cancellation sweep evaluates" }

  # ---------------------------------------------------------------------------
  - name: Learner
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Learner display name" }
      - { name: birth_date, type: datetime, source: input, description: "Date of birth; all dates strictly after CURRENT_DEFAULT_UTC are rejected" }
      - { name: parent_user_id, type: string, source: input, description: "Opaque parent operator identifier that owns this learner account; every enrollment of this learner must be issued by this id" }
      - { name: subscription_tier, type: enum, source: system, description: "NONE | PLUS | FAMILY", default: NONE, constraints: "only the subscription endpoint writes this field" }
      - { name: subscription_discount_pct, type: number, source: computed, description: "Lookup of subscription_tier against SUB_DISCOUNT_* constants" }
      - { name: confirmation_credit_cents, type: integer, source: computed, description: "Remaining free-cancellation allowance in cents; refilled to the active plan's included amount on every subscription write" }
      - { name: enrollment_sequence, type: integer, source: system, description: "Monotonic per-learner sequence assigned when an enrollment for this learner is created; used as the coupon allocation tie-break" }
      - { name: abuse_strike_count, type: integer, source: computed, description: "Count of enrollments belonging to this learner that reached a teacher_fault outcome" }

  # ---------------------------------------------------------------------------
  - name: Enrollment
    parent: Section
    common_fields: true
    fields:
      - { name: section_id, type: string, source: system, description: "FK -> Section.id; the section being enrolled into" }
      - { name: learner_id, type: string, source: input, description: "FK -> Learner.id; the learner being enrolled" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | RELEASED | CANCELLED_BY_TEACHER", constraints: "enum values are produced only by the Enrollment state machine in §1.2" }
      - { name: coupon_code, type: string, source: input, default: null, description: "Optional coupon from the declared catalog CATALOG_COUPONS" }
      - { name: coupon_discount_cents, type: integer, source: computed, description: "Discount produced by the coupon, computed in step 2 of the stacking order" }
      - { name: subscription_discount_cents, type: integer, source: computed, description: "Discount produced by the learner's plan, computed in step 1 of the stacking order" }
      - { name: discounted_price_cents, type: integer, source: computed, description: "list_price_cents - subscription_discount_cents - coupon_discount_cents; floor at zero" }
      - { name: refund_category, type: enum, source: system, description: "null | NONE | PARTIAL_HALF | FULL", default: null }
      - { name: refund_cents, type: integer, source: computed, description: "0 for NONE, floor(discounted_price_cents * REFUND_PARTIAL_RATE) for PARTIAL_HALF, discounted_price_cents for FULL" }
      - { name: cancelled_by, type: enum, source: system, description: "null | parent | teacher | platform", default: null }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Portion of refund_cents drawn from the learner's confirmation credit rather than returned as cash" }
      - { name: cash_refund_cents, type: integer, source: computed, description: "refund_cents - credit_applied_cents" }

  # ---------------------------------------------------------------------------
  - name: TeacherPayout
    parent: Teacher
    common_fields: true
    fields:
      - { name: teacher_id, type: string, source: system, description: "FK -> Teacher.id; the teacher this payout settles" }
      - { name: expected_teacher_version, type: integer, source: input, description: "Required optimistic-concurrency token: the caller's last observed Teacher.version. Payout creation is rejected with ERR_STALE_VERSION when it does not match the teacher's current version." }
      - { name: period_start, type: datetime, source: input, description: "Start of the settlement period" }
      - { name: period_end, type: datetime, source: input, description: "End of the settlement period; strictly after period_start" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SENT | FAILED | PAID | VOIDED", constraints: "enum values are produced only by the TeacherPayout state machine in §1.2" }
      - { name: gross_earnings_cents, type: integer, source: computed, description: "Sum of discounted_price_cents over the teacher's HELD sections starting in [period_start, period_end)" }
      - { name: fee_rate_applied, type: number, source: computed, description: "Effective rate from the posted-payout fee schedule, evaluated for the current-period discontinuities" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "floor(gross_earnings_cents * fee_rate_applied)" }
      - { name: net_payout_cents, type: integer, source: computed, description: "gross_earnings_cents - platform_fee_cents" }
      - { name: net_after_refunds_cents, type: integer, source: computed, description: "gross_earnings_cents - platform_fee_cents - platform_fee_reversed_cents" }
      - { name: payout_proration_factor, type: number, source: computed, description: "min(1, PAYOUT_APPROVAL_CAP_CENTS / (net_after_refunds_cents + already_approved_sent_cents))" }
      - { name: approval_status, type: enum, source: system, description: "not_required | pending_approval | approved", default: not_required, constraints: "pending_approval is written and cleared only by the payout cascade" }
      - { name: tax_document_status, type: enum, source: computed, description: "Snapshot of Teacher.payout_tax_document_status taken when this payout row was created" }
      - { name: refund_period_index, type: integer, source: system, description: "Period index of the most recent teacher-fault refund that swept this payout; null when never swept" }
      - { name: teacher_liability_cents, type: integer, source: computed, description: "Portion of refunded cash the teacher owes back under a teacher-fault refund" }
      - { name: platform_fee_reversed_cents, type: integer, source: computed, description: "Platform fee component reversed under a teacher-fault refund" }

  # ---------------------------------------------------------------------------
  - name: ParentReport
    parent: Teacher
    common_fields: true
    fields:
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id; the teacher this report concerns" }
      - { name: class_listing_id, type: string, source: input, description: "FK -> ClassListing.id; the listing the parent is reporting" }
      - { name: reported_by_user_id, type: string, source: input, description: "Opaque parent operator identifier that filed the report" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: category, type: enum, source: input, description: "CONTENT_POLICY | SAFETY | CONDUCT | TECHNICAL | OTHER" }
      - { name: severity_weight, type: integer, source: computed, description: "CATEGORY_WEIGHT_<category> + SEVERITY_POINTS_<severity>" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | RESOLVED | CLOSED", constraints: "enum values are produced only by the ParentReport state machine in §1.2" }
      - { name: disposition, type: enum, source: system, description: "null | DISMISSED | WARNING | MORE_SEVERE", default: null, constraints: "written only by the disposition transitions; an UPHELD write re-runs the teacher risk cascade" }
      - { name: high_severity, type: boolean, source: computed, description: "True when severity is HIGH" }
      - { name: is_terminal, type: boolean, source: computed, description: "True when status is RESOLVED or CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- TeacherApplication: branching with a bounded revision CYCLE -------------
  - entity: TeacherApplication
    field: status
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: SCREENING_PENDING
        trigger: "POST /outschool/teacher-applications/{applicationId}/submit"
        actor: "TeacherApplicant, PlatformAdmin"
        preconditions:
          - "application.status == DRAFT"
          - "application.applicant_user_id, applicant_email and display_name are non-empty"
          - "application.teaching_sample_url is non-empty"
          - "application.teaching_sample_minutes >= SAMPLE_MIN_MINUTES"
        side_effects:
          - "system auto-records the RESULT background screening for applicant_user_id"
          - "application.screening_outcome = lookup(SCREENING_OUTCOME_BY_APPLICATION, application.applicant_email); only PASS or FAIL are stored"
          - "application.screening_completed_period_index = current_period_index"
          - "application.reviewed_by_user_id = null; application.reviewer_bound_period_index = null"
          - "application.decision = null; application.revision_count = 0"
          - "system auto-advances to SCREENING_PASSED if screening_outcome == PASS, else to SCREENING_FAILED (same request)"

      - from: SCREENING_PENDING
        to: SCREENING_PASSED
        trigger: "system (screening evaluation, automatic on submit)"
        actor: system
        preconditions:
          - "application.screening_outcome == PASS"
        side_effects: []

      - from: SCREENING_PENDING
        to: SCREENING_FAILED
        trigger: "system (screening evaluation, automatic on submit)"
        actor: system
        preconditions:
          - "application.screening_outcome == FAIL"
        side_effects: []

      - from: SCREENING_FAILED
        to: REJECTED
        trigger: "POST /outschool/teacher-applications/{applicationId}/review with stage=SCREENING, verdict=FAIL"
        actor: TeacherReviewer
        preconditions:
          - "application.status == SCREENING_FAILED"
        side_effects:
          - "application.decision = REJECT"
          - "application.decision_reason_code = POLICY_VIOLATION"
          - "application.revision_count += 1"

      - from: SCREENING_PASSED
        to: SAMPLE_PENDING
        trigger: "POST /outschool/teacher-applications/{applicationId}/submit-sample"
        actor: "TeacherApplicant, PlatformAdmin"
        preconditions:
          - "application.status == SCREENING_PASSED"
          - "application.teaching_sample_url is non-empty"
          - "application.teaching_sample_minutes >= SAMPLE_MIN_MINUTES"
          - "application.screening_is_stale == false"
        side_effects:
          - "application.reviewed_by_user_id = null"
          - "application.reviewer_bound_period_index = null"

      - from: SAMPLE_PENDING
        to: SAMPLE_APPROVED
        trigger: "POST /outschool/teacher-applications/{applicationId}/review with sample_verdict=PASS, decision=APPROVE"
        actor: TeacherReviewer
        preconditions:
          - "application.status == SAMPLE_PENDING"
          - "application.screening_is_stale == false"
        side_effects:
          - "application.reviewed_by_user_id = reviewer operator id"
          - "application.reviewer_bound_period_index = current_period_index"
          - "application.decision = APPROVE"

      - from: SAMPLE_PENDING
        to: SAMPLE_REJECTED
        trigger: "POST /outschool/teacher-applications/{applicationId}/review with sample_verdict=FAIL, decision=REJECT"
        actor: TeacherReviewer
        preconditions:
          - "application.status == SAMPLE_PENDING"
        side_effects:
          - "application.reviewed_by_user_id = reviewer operator id"
          - "application.reviewer_bound_period_index = current_period_index"
          - "application.decision = REJECT"
          - "application.decision_reason_code = SAMPLE_QUALITY"
          - "application.revision_count += 1"
          - "if application.revision_count == APPLICATION_MAX_REVISIONS after the increment, system auto-advances status to REJECTED (exhausted revision loop)"

      - from: SAMPLE_PENDING
        to: SAMPLE_REJECTED
        trigger: "system (reviewer-bound SLA expiry on run_ops)"
        actor: system
        preconditions:
          - "application.status == SAMPLE_PENDING"
          - "application.reviewed_by_user_id != null"
          - "current_period_index >= application.reviewer_bound_period_index + REVIEWER_SLA_PERIODS"
        side_effects:
          - "application.decision = REJECT"
          - "application.decision_reason_code = INCOMPLETE_MATERIALS"
          - "application.revision_count += 1"
          - "if application.revision_count == APPLICATION_MAX_REVISIONS after the increment, system auto-advances status to REJECTED"
        note: "Automatic rejection for reviewer inaction. reviewed_by_user_id is retained so the binding remains auditable."

      - from: SAMPLE_REJECTED
        to: SAMPLE_PENDING
        trigger: "POST /outschool/teacher-applications/{applicationId}/submit-sample (revision loop)"
        actor: "TeacherApplicant, PlatformAdmin"
        preconditions:
          - "application.status == SAMPLE_REJECTED"
          - "application.revision_count < APPLICATION_MAX_REVISIONS"
          - "application.teaching_sample_minutes >= SAMPLE_MIN_MINUTES"
        side_effects:
          - "application.reviewed_by_user_id = null (reviewer binding released)"
          - "application.reviewer_bound_period_index = null"
          - "application.decision = null"

      - from: SAMPLE_APPROVED
        to: APPROVED
        trigger: "POST /outschool/teacher-applications/{applicationId}/approve"
        actor: TeacherReviewer
        preconditions:
          - "application.status == SAMPLE_APPROVED"
          - "application.reviewed_by_user_id == acting reviewer operator id"
          - "application.revision_count < APPLICATION_MAX_REVISIONS"
          - "application.screening_is_stale == false"
        side_effects:
          - "Creates a Teacher row: application_id = application.id, display_name = application.display_name, status = PENDING_SETUP"
          - "New Teacher.screening_validity_period_index = application.screening_completed_period_index + SCREENING_VALIDITY_PERIODS"
          - "New Teacher.open_report_count, open_report_risk_score, upheld_report_risk_score, actionable_risk_score, peak_actionable_risk_score, lifetime_net_earnings_cents, lifetime_fee_reversed_cents, lifetime_teacher_liability_cents, unpaid_earnings_cents all initialize to 0"
          - "New Teacher.payout_tax_document_status is derived immediately: ON_FILE at lifetime_net_earnings_cents == 0"

      - from: [DRAFT, SCREENING_PENDING, SCREENING_FAILED, SCREENING_PASSED, SAMPLE_PENDING, SAMPLE_REJECTED, SAMPLE_APPROVED]
        to: REJECTED
        trigger: "POST /outschool/teacher-applications/{applicationId}/review with verdict=FAIL at any non-terminal stage"
        actor: TeacherReviewer
        preconditions:
          - "application.status IN {DRAFT, SCREENING_PENDING, SCREENING_FAILED, SCREENING_PASSED, SAMPLE_PENDING, SAMPLE_REJECTED, SAMPLE_APPROVED}"
          - "application.revision_count + 1 >= APPLICATION_MAX_REVISIONS"
        side_effects:
          - "application.decision = REJECT"
          - "application.revision_count += 1"
        note: "The revision budget is exhausted, so the review lands on the terminal REJECTED state rather than a revisable one."

  # --- Teacher: branching lifecycle with systemic suspension -------------------
  - entity: Teacher
    field: status
    initial_state: PENDING_SETUP
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_SETUP
        to: ACTIVE
        trigger: "POST /outschool/teachers/{teacherId}/activate"
        actor: PlatformAdmin
        preconditions:
          - "teacher.status == PENDING_SETUP"
          - "teacher.payout_tax_document_status == ON_FILE"
        side_effects:
          - "teacher.suspension_reason = null; teacher.suspension_trigger = null"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /outschool/teachers/{teacherId}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "teacher.status == ACTIVE"
        side_effects:
          - "teacher.suspension_reason = supplied reason"
          - "teacher.suspension_trigger = MANUAL"
          - "Every ClassListing owned by this teacher in lifecycle_state PUBLISHED → SUSPENDED"
          - "Every Section of those listings in status SCHEDULED or OPEN_FOR_ENROLLMENT → CANCELLED with outcome CANCELLED_BY_TEACHER, cancelled_by = platform"
          - "Every Enrollment of those sections in status RESERVED or CONFIRMED → CANCELLED_BY_TEACHER with refund_category FULL at the enrollment's discounted_price_cents"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (report risk cascade — fires when a ParentReport UPHELD disposition raises actionable_risk_score)"
        actor: system
        preconditions:
          - "teacher.status == ACTIVE"
          - "teacher.actionable_risk_score >= RISK_SUSPENSION_THRESHOLD"
        side_effects:
          - "teacher.suspension_reason = 'automatic policy suspension'"
          - "teacher.suspension_trigger = POLICY"
          - "teacher.peak_actionable_risk_score is raised to teacher.actionable_risk_score first, then the same listing/section/enrollment cascade as the MANUAL suspension runs"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /outschool/teachers/{teacherId}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "teacher.status == SUSPENDED"
          - "teacher.payout_tax_document_status == ON_FILE"
          - "teacher.peak_actionable_risk_score < RISK_SUSPENSION_THRESHOLD"
        side_effects:
          - "teacher.suspension_reason = null; teacher.suspension_trigger = null"

      - from: [PENDING_SETUP, ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /outschool/teachers/{teacherId}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "No ClassListing owned by this teacher has section_count > 0"
        side_effects:
          - "Every ClassListing owned by this teacher → ARCHIVED"

  # --- ClassListing dimension 1: content review --------------------------------
  - entity: ClassListing
    field: content_review_state
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: POLICY_APPROVED
        trigger: "POST /outschool/class-listings/{listingId}/policy-review with decision=APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "listing.content_review_state == PENDING_REVIEW"
          - "listing.max_age >= listing.min_age"
          - "listing.min_age >= 3 and listing.max_age <= 18"
        side_effects: []

      - from: PENDING_REVIEW
        to: POLICY_REJECTED
        trigger: "POST /outschool/class-listings/{listingId}/policy-review with decision=REJECT"
        actor: PlatformAdmin
        preconditions:
          - "listing.content_review_state == PENDING_REVIEW"
        side_effects:
          - "listing.policy_rejection_reason_code = supplied reason_code"
          - "listing.lifecycle_state → ARCHIVED (automatic; a policy-rejected listing is terminally non-creatable)"

  # --- ClassListing dimension 2: lifecycle (parallel dimension on same entity) --
  - entity: ClassListing
    field: lifecycle_state
    initial_state: DRAFT
    terminal_states: [SUSPENDED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /outschool/class-listings/{listingId}/publish"
        actor: "Teacher, PlatformAdmin"
        preconditions:
          - "listing.content_review_state == POLICY_APPROVED"
          - "owning teacher.status == ACTIVE"
          - "acting X-User-ID == listing.teacher_id OR acting role is PlatformAdmin"
        side_effects: []

      - from: PUBLISHED
        to: SUSPENDED
        trigger: "system (owning Teacher entered SUSPENDED, or a manual teacher suspension cascaded)"
        actor: system
        preconditions:
          - "owning teacher.status == SUSPENDED or TERMINATED"
        side_effects:
          - "Every Section of this listing in SCHEDULED or OPEN_FOR_ENROLLMENT → CANCELLED with outcome CANCELLED_BY_TEACHER, cancelled_by = platform"
          - "Every Enrollment of those sections in RESERVED or CONFIRMED → CANCELLED_BY_TEACHER with refund_category FULL"

      - from: [DRAFT, PUBLISHED, SUSPENDED]
        to: ARCHIVED
        trigger: "system (content policy rejection, or owning Teacher terminated)"
        actor: system
        preconditions:
          - "listing.content_review_state == POLICY_REJECTED, or owning teacher.status == TERMINATED"
        side_effects:
          - "Every Section of this listing in SCHEDULED or OPEN_FOR_ENROLLMENT → CANCELLED with outcome CANCELLED_BY_TEACHER"

  # --- Section: branching lifecycle with automatic cancellation ----------------
  - entity: Section
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: OPEN_FOR_ENROLLMENT
        trigger: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/open"
        actor: "Teacher, PlatformAdmin"
        preconditions:
          - "section.status == SCHEDULED"
          - "owning teacher.status == ACTIVE"
          - "listing.lifecycle_state == PUBLISHED"
          - "listing.content_review_state == POLICY_APPROVED"
        side_effects: []

      - from: OPEN_FOR_ENROLLMENT
        to: MIN_ENROLLMENT_MET
        trigger: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/meet-minimum"
        actor: "Teacher, PlatformAdmin"
        preconditions:
          - "section.status == OPEN_FOR_ENROLLMENT"
          - "section.enrollment_min_met == true (section.enrolled_count >= section.min_learners)"
        side_effects:
          - "No credit movement: confirmation credit is drawn only when an individual enrollment is confirmed"

      - from: MIN_ENROLLMENT_MET
        to: COMPLETED
        trigger: "system (run_ops completion sweep)"
        actor: system
        preconditions:
          - "section.status == MIN_ENROLLMENT_MET"
          - "current instant >= section.start_utc"
          - "section.settled == true (no Enrollment of this section is in RESERVED status)"
        side_effects:
          - "if section.outcome is null: section.outcome = HELD"

      - from: [SCHEDULED, OPEN_FOR_ENROLLMENT]
        to: CANCELLED
        trigger: "system (run_ops automatic-cancellation sweep)"
        actor: system
        preconditions:
          - "current instant >= section.cancellation_cutoff_utc"
          - "COALESCE(section.expected_learners, section.min_learners) < section.min_learners"
        side_effects:
          - "section.outcome = AUTO_CANCELLED_MIN_ENROLLMENT"
          - "Every Enrollment of this section in RESERVED or CONFIRMED → RELEASED"
          - "For each such Enrollment: refund_category = FULL, refund_cents = discounted_price_cents, credit_applied_cents = min(refund_cents, owning Learner.confirmation_credit_cents), cash_refund_cents = refund_cents - credit_applied_cents, cancelled_by = platform"

      - from: [SCHEDULED, OPEN_FOR_ENROLLMENT, MIN_ENROLLMENT_MET]
        to: CANCELLED
        trigger: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/cancel"
        actor: "Teacher, PlatformAdmin"
        preconditions:
          - "current instant < section.start_utc"
          - "owning teacher.status == ACTIVE OR acting role is PlatformAdmin"
        side_effects:
          - "section.outcome = CANCELLED_BY_TEACHER"
          - "Every Enrollment of this section in RESERVED or CONFIRMED → CANCELLED_BY_TEACHER with cancelled_by = teacher"
          - "For each such Enrollment: refund_category = FULL, refund_cents = discounted_price_cents, credit_applied_cents = min(refund_cents, owning Learner.confirmation_credit_cents), cash_refund_cents = refund_cents - credit_applied_cents"
          - "CASCADE HOP 1 → HOP 2: for every TeacherPayout of the owning teacher in status REQUESTED whose [period_start, period_end) contains this section's start_utc and whose teacher_id matches, the payout is recomputed (see calculations.expected_payout_gross_cents), its status becomes FAILED, its approval_status becomes pending_approval, and its teacher_liability_cents / platform_fee_reversed_cents / refund_period_index are written"
          - "CASCADE HOP 2 → HOP 3: the recomputed net_payout_cents is re-summed into teacher.lifetime_net_earnings_cents, and tax_document_status is recomputed from that new total — a refund large enough to drop lifetime earnings to or below TAX_DOC_REQUIRED_CENTS moves the status from REQUIRED_UPDATE back to ON_FILE"

      - from: [OPEN_FOR_ENROLLMENT, MIN_ENROLLMENT_MET]
        to: CANCELLED
        trigger: "system (seat-loss cascade fired from an Enrollment cancellation)"
        actor: system
        preconditions:
          - "current instant < section.start_utc"
          - "section.status was MIN_ENROLLMENT_MET or OPEN_FOR_ENROLLMENT"
          - "a CONFIRMED Enrollment of this section was cancelled by its parent in the same request"
          - "section.enrolled_count < section.min_learners after that cancellation"
        side_effects:
          - "section.outcome = AUTO_CANCELLED_SEAT_LOSS"
          - "Every other Enrollment of this section in RESERVED or CONFIRMED → CANCELLED_BY_TEACHER with cancelled_by = platform"
          - "For each such Enrollment: refund_category = FULL, refund_cents = discounted_price_cents, credit_applied_cents = min(refund_cents, owning Learner.confirmation_credit_cents), cash_refund_cents = refund_cents - credit_applied_cents"
          - "The full teacher-fault refund cascade (HOP 1 → HOP 2 → HOP 3 above) runs for this section"

  # --- Enrollment: cyclic refund tiers with a terminal release -----------------
  - entity: Enrollment
    field: status
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED_BY_TEACHER]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /outschool/enrollments/{enrollmentId}/confirm"
        actor: "Parent, PlatformAdmin"
        preconditions:
          - "enrollment.status == RESERVED"
          - "section.status == MIN_ENROLLMENT_MET"
          - "owning learner.parent_user_id == acting X-User-ID OR acting role is PlatformAdmin"
          - "learner.confirmation_credit_cents >= enrollment.discounted_price_cents"
        side_effects:
          - "learner.confirmation_credit_cents -= enrollment.discounted_price_cents"

      - from: RESERVED
        to: RELEASED
        trigger: "system (run_ops reservation sweep at section start)"
        actor: system
        preconditions:
          - "enrollment.status == RESERVED"
          - "current instant >= section.start_utc"
          - "section.status == OPEN_FOR_ENROLLMENT"
        side_effects:
          - "enrollment.refund_category = NONE; enrollment.refund_cents = 0"
          - "enrollment.credit_applied_cents = 0; enrollment.cash_refund_cents = 0"
          - "enrollment.cancelled_by = platform"

      - from: RESERVED
        to: CANCELLED_BY_TEACHER
        trigger: "POST /outschool/enrollments/{enrollmentId}/cancel"
        actor: "Parent, PlatformAdmin"
        preconditions:
          - "enrollment.status == RESERVED"
          - "owning learner.parent_user_id == acting X-User-ID OR acting role is PlatformAdmin"
        side_effects:
          - "learner_fault = (current instant < section.cancellation_cutoff_utc)"
          - "REFUND TIMING EXCEPTION (evaluated before the general tier): if section.timezone == SPECIAL_REFUND_TIMEZONE and the tier computed below would be PARTIAL_HALF, the tier is downgraded to NONE"
          - "refund tier, expressed as hours remaining before start_utc: FULL when hours_remaining >= REFUND_FULL_CUTOFF_HOURS[listing.format]; else, when learner_fault is true, PARTIAL_HALF when hours_remaining >= REFUND_HALF_CUTOFF_HOURS[listing.format]; else NONE. Equivalently in instant form: FULL when current instant <= start_utc - REFUND_FULL_CUTOFF_HOURS[format], PARTIAL_HALF when current instant <= start_utc - REFUND_HALF_CUTOFF_HOURS[format]. Cancelling further in advance is never worse than cancelling later."
          - "enrollment.refund_category = that tier; enrollment.refund_cents = 0 for NONE, floor(discounted_price_cents * REFUND_PARTIAL_RATE) for PARTIAL_HALF, discounted_price_cents for FULL"
          - "enrollment.credit_applied_cents = min(enrollment.refund_cents, owning Learner.confirmation_credit_cents); enrollment.cash_refund_cents = enrollment.refund_cents - enrollment.credit_applied_cents"
          - "enrollment.cancelled_by = parent"
          - "If learner_fault was true: owning learner.abuse_strike_count += 1"

      - from: CONFIRMED
        to: CANCELLED_BY_TEACHER
        trigger: "POST /outschool/enrollments/{enrollmentId}/cancel"
        actor: "Parent, PlatformAdmin"
        preconditions:
          - "enrollment.status == CONFIRMED"
          - "owning learner.parent_user_id == acting X-User-ID OR acting role is PlatformAdmin"
          - "current instant < section.start_utc"
        side_effects:
          - "learner_fault = (current instant < section.cancellation_cutoff_utc)"
          - "REFUND TIMING EXCEPTION (evaluated before the general tier): if section.timezone == SPECIAL_REFUND_TIMEZONE and the tier computed below would be PARTIAL_HALF, the tier is downgraded to NONE"
          - "refund tier, expressed as hours remaining before start_utc: FULL when hours_remaining >= REFUND_FULL_CUTOFF_HOURS[listing.format]; else, when learner_fault is true, PARTIAL_HALF when hours_remaining >= REFUND_HALF_CUTOFF_HOURS[listing.format]; else NONE. Equivalently in instant form: FULL when current instant <= start_utc - REFUND_FULL_CUTOFF_HOURS[format], PARTIAL_HALF when current instant <= start_utc - REFUND_HALF_CUTOFF_HOURS[format]. Cancelling further in advance is never worse than cancelling later."
          - "enrollment.refund_category = that tier; enrollment.refund_cents = 0 for NONE, floor(discounted_price_cents * REFUND_PARTIAL_RATE) for PARTIAL_HALF, discounted_price_cents for FULL"
          - "enrollment.credit_applied_cents = min(enrollment.refund_cents, owning Learner.confirmation_credit_cents); enrollment.cash_refund_cents = enrollment.refund_cents - enrollment.credit_applied_cents"
          - "enrollment.cancelled_by = parent"
          - "If learner_fault was true: owning learner.abuse_strike_count += 1"
          - "If learner_fault was false: CASCADE HOP 1 → HOP 2 → HOP 3 as declared on the Section CANCELLED_BY_TEACHER transition (this cancellation is a teacher-fault refund, so the owning teacher's REQUESTED payouts are recomputed and may cross the tax-document threshold)"
          - "SEAT-LOSS BRANCH (evaluated after the refund is written): if section.status is OPEN_FOR_ENROLLMENT or MIN_ENROLLMENT_MET, current instant < section.start_utc, and section.enrolled_count < section.min_learners, the Section seat-loss cascade fires (outcome = AUTO_CANCELLED_SEAT_LOSS)"
          - "If the seat-loss branch did not fire and section.status == MIN_ENROLLMENT_MET and the cancellation drops enrolled_count below min_learners, section.status → OPEN_FOR_ENROLLMENT"

      - from: CONFIRMED
        to: RELEASED
        trigger: "system (owning Section entered CANCELLED)"
        actor: system
        preconditions:
          - "enrollment.status == CONFIRMED"
          - "section.status == CANCELLED"
        side_effects:
          - "enrollment.refund_category = FULL; enrollment.refund_cents = enrollment.discounted_price_cents"
          - "enrollment.credit_applied_cents = min(refund_cents, owning Learner.confirmation_credit_cents)"
          - "enrollment.cash_refund_cents = enrollment.refund_cents - enrollment.credit_applied_cents"
          - "enrollment.cancelled_by = platform"

  # --- ParentReport: review cycle with upheld dispositions ---------------------
  - entity: ParentReport
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /outschool/class-reports/{reportId}/disposition with action=START_REVIEW"
        actor: PlatformAdmin
        preconditions:
          - "report.status == OPEN"
        side_effects: []

      - from: RESOLVED
        to: UNDER_REVIEW
        trigger: "POST /outschool/class-reports/{reportId}/disposition with action=START_REVIEW (re-open a resolved report)"
        actor: PlatformAdmin
        preconditions:
          - "report.status == RESOLVED"
        side_effects:
          - "report.disposition is retained until a new disposition is written"

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /outschool/class-reports/{reportId}/disposition with action=DISMISS"
        actor: PlatformAdmin
        preconditions:
          - "report.status == UNDER_REVIEW"
        side_effects:
          - "report.disposition = DISMISSED"
          - "No teacher risk recalculation runs: a DISMISSED disposition writes no risk-bearing state"

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /outschool/class-reports/{reportId}/disposition with action=UPHOLD_WARNING"
        actor: PlatformAdmin
        preconditions:
          - "report.status == UNDER_REVIEW"
        side_effects:
          - "report.disposition = WARNING"
          - "CASCADE HOP 1: teacher.upheld_report_risk_score is recomputed over every report whose disposition is WARNING or MORE_SEVERE"
          - "CASCADE HOP 2: teacher.actionable_risk_score = max(open_report_risk_score, upheld_report_risk_score); teacher.peak_actionable_risk_score is raised to it if larger"
          - "CASCADE HOP 3: if teacher.actionable_risk_score >= RISK_SUSPENSION_THRESHOLD the report-risk cascade suspends the teacher (ACTIVE → SUSPENDED, trigger POLICY)"

      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /outschool/class-reports/{reportId}/disposition with action=UPHOLD_MORE_SEVERE"
        actor: PlatformAdmin
        preconditions:
          - "report.status == UNDER_REVIEW"
        side_effects:
          - "report.disposition = MORE_SEVERE"
          - "Same HOP 1 → HOP 2 → HOP 3 risk cascade as the WARNING disposition"

  # --- TeacherPayout: settlement pipeline with a refund-driven failure ---------
  - entity: TeacherPayout
    field: status
    initial_state: REQUESTED
    terminal_states: [VOIDED]
    transitions:
      - from: REQUESTED
        to: REQUESTED
        trigger: "POST /outschool/teachers/{teacherId}/payouts (idempotent re-request with an unchanged request fingerprint)"
        actor: "Teacher, PlatformAdmin"
        preconditions:
          - "An existing REQUESTED payout for this teacher carries an identical (period_start, period_end) fingerprint"
        side_effects:
          - "No new payout row is created; the existing row's version is still incremented by 1"
        note: "Idempotency branch — the endpoint returns 200 with the existing row instead of 201."

      - from: REQUESTED
        to: SENT
        trigger: "POST /outschool/teacher-payouts/{payoutId}/transition with action=SEND"
        actor: PlatformAdmin
        preconditions:
          - "payout.status == REQUESTED"
          - "payout.approval_status != pending_approval"
          - "payout.tax_document_status == ON_FILE"
          - "payout.net_after_refunds_cents + already_approved_sent_cents <= PAYOUT_APPROVAL_CAP_CENTS"
        side_effects:
          - "No Teacher.unpaid_earnings_cents movement (the amount stays unpaid until PAID)"

      - from: REQUESTED
        to: FAILED
        trigger: "system (teacher-fault refund cascade recomputed this payout)"
        actor: system
        preconditions:
          - "payout.status == REQUESTED"
          - "payout.approval_status == not_required"
        side_effects:
          - "payout.gross_earnings_cents, fee_rate_applied, platform_fee_cents and net_payout_cents are recomputed to include the refunded section's reduced discounted_price_cents"
          - "payout.net_after_refunds_cents = gross_earnings_cents - platform_fee_cents - platform_fee_reversed_cents"
          - "payout.platform_fee_reversed_cents = sum over refunded sections of floor(original_discounted_price_cents * fee_rate_applied)"
          - "payout.teacher_liability_cents = sum over refunded sections of floor((original_discounted_price_cents - floor(original_discounted_price_cents * fee_rate_applied)) * REFUND_TEACHER_LIABILITY_RATE)"
          - "payout.refund_period_index = current_period_index"
          - "payout.approval_status = pending_approval"
          - "teacher.lifetime_fee_reversed_cents += payout.platform_fee_reversed_cents"
          - "teacher.lifetime_teacher_liability_cents += payout.teacher_liability_cents"
          - "teacher.lifetime_net_earnings_cents is re-summed from all non-VOIDED payouts and payout_tax_document_status is re-derived from that total, so a recompute that crosses TAX_DOC_REQUIRED_CENTS moves the status to REQUIRED_UPDATE"

      - from: FAILED
        to: PAID
        trigger: "POST /outschool/teacher-payouts/{payoutId}/transition with action=APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "payout.status == FAILED"
          - "payout.approval_status == pending_approval"
        side_effects:
          - "payout.approval_status = approved"
          - "teacher.unpaid_earnings_cents -= payout.net_payout_cents"

      - from: SENT
        to: PAID
        trigger: "POST /outschool/teacher-payouts/{payoutId}/transition with action=PAY"
        actor: PlatformAdmin
        preconditions:
          - "payout.status == SENT"
        side_effects:
          - "teacher.unpaid_earnings_cents -= payout.net_payout_cents"

      - from: [REQUESTED, SENT, FAILED]
        to: VOIDED
        trigger: "POST /outschool/teacher-payouts/{payoutId}/transition with action=VOID"
        actor: PlatformAdmin
        preconditions:
          - "payout.status IN {REQUESTED, SENT, FAILED}"
        side_effects:
          - "teacher.unpaid_earnings_cents -= payout.net_payout_cents if the payout had not already been PAID"
          - "teacher.lifetime_net_earnings_cents is re-summed excluding VOIDED payout rows"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC — the only sanctioned write-write mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: payout-create-stale-unpaid-balance
    parent_entity: Teacher
    write_endpoint: "POST /outschool/teachers/{teacherId}/payouts"
    occ_field: "expected_teacher_version"
    description: |
      Creating a TeacherPayout against a Teacher whose version has advanced since the
      client last observed it is rejected. This captures the case where another writer
      has already recorded a payout (which legitimately draws down the same unpaid
      earnings balance) and the current writer's view of the teacher is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payout-create-stale-after-refund-cascade
    parent_entity: Teacher
    write_endpoint: "POST /outschool/teachers/{teacherId}/payouts"
    occ_field: "expected_teacher_version"
    description: |
      A teacher-fault refund cascade mutates Teacher fields (lifetime_fee_reversed_cents,
      lifetime_teacher_liability_cents, unpaid_earnings_cents) and therefore advances
      Teacher.version. A client that observed the teacher before the cascade and then
      submits a payout still carrying the pre-cascade version is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- COMBINATORIAL MODE (c): circular-looking dependency, evaluation order pinned ---
  - name: enrollment_discounted_price_cents
    trigger: "Enrollment creation; re-evaluated on every enrollment write"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER IS PINNED AND MUST NOT BE REORDERED. The subscription discount is
      computed first, on the undiscounted list price; the coupon discount is computed
      second, on the price that remains after the subscription discount. Swapping the two
      steps yields a different integer for the same inputs (3333 with a 10% plan and a
      15% coupon yields 2550 subscription-first and 2551 coupon-first), so the order is
      part of the contract.

      step_1_subscription_discount_cents =
          floor(listing.list_price_cents * learner.subscription_discount_pct)
      step_2_price_after_subscription_cents =
          listing.list_price_cents - step_1_subscription_discount_cents
      step_3_coupon_discount_cents =
          floor(step_2_price_after_subscription_cents * coupon_value)
              when the coupon is percent-typed
          coupon_value
              when the coupon is amount-typed
      step_4_discounted_price_cents =
          max(0, listing.list_price_cents
                 - step_1_subscription_discount_cents
                 - step_3_coupon_discount_cents)

      Every step floors to a whole cent independently; no step re-rounds an earlier step.
    input_set: "The single Enrollment being written, its parent Section, that Section's ClassListing, and the enrolling Learner's subscription_tier"
    constants:
      SUB_DISCOUNT_NONE: 0.00
      SUB_DISCOUNT_PLUS: 0.10
      SUB_DISCOUNT_FAMILY: 0.20
      CATALOG_COUPONS:
        WELCOME5: { type: PERCENT, value: 0.05 }
        FLAT250: { type: AMOUNT_CENTS, value: 250 }
        SIBLING10: { type: PERCENT, value: 0.10 }
        SPRING15: { type: PERCENT, value: 0.15 }
    precision: "floor truncation to integer cents at every step; IEEE-754 double intermediate"
    variants:
      - name: subscription_first
        when: "Always — this is the pinned base order"
        difference: "Coupon applies to the price remaining after the subscription discount"
      - name: coupon_first
        when: "Never selected by the server; retained only to document the divergence"
        difference: "Coupon applies to the list price first; produces a different discounted_price_cents whenever both discounts are percent-typed"

  # --- DUAL-VARIANT (Rule 1, instance A): timing tier vs format tier on Enrollment ---
  - name: refund_amount_cents
    trigger: "Enrollment cancellation from RESERVED or CONFIRMED"
    algorithm: threshold
    formula: |
      TWO INDEPENDENT TIER SELECTORS are declared. The TIMING selector is the one the
      server applies; the FORMAT selector is documented as the rejected alternative
      reading, and the two disagree for the same request.

      TIMING selector (applied):
        hours_before_start = (section.start_utc - current_instant) in whole hours, floored
        if hours_before_start >= REFUND_FULL_CUTOFF_HOURS[listing.format]:
            tier = FULL
        elif learner_fault and hours_before_start >= REFUND_HALF_CUTOFF_HOURS[listing.format]:
            tier = PARTIAL_HALF
        else:
            tier = NONE

      FORMAT selector (documented divergence, never applied):
        tier = FULL for ONE_TIME, PARTIAL_HALF for MULTI_DAY, NONE for ONGOING,
        irrespective of how far in advance the cancellation arrives.

      REFUND TIMING EXCEPTION: if section.timezone == SPECIAL_REFUND_TIMEZONE and the
      timing selector returned PARTIAL_HALF, the tier is downgraded to NONE.

      refund_cents = 0                                   for NONE
                   = floor(discounted_price_cents * REFUND_PARTIAL_RATE)  for PARTIAL_HALF
                   = discounted_price_cents                for FULL
    input_set: "The cancelling Enrollment, its parent Section, and that Section's ClassListing.format"
    constants:
      REFUND_FULL_CUTOFF_HOURS: { ONE_TIME: 168, MULTI_DAY: 336, ONGOING: 336 }
      REFUND_HALF_CUTOFF_HOURS: { ONE_TIME: 24, MULTI_DAY: 72, ONGOING: 168 }
      REFUND_PARTIAL_RATE: 0.50
      SPECIAL_REFUND_TIMEZONE: "America/Anchorage"
    precision: "floor truncation to integer cents"
    variants:
      - name: timing_tier
        when: "Always — the applied selector"
        difference: "Tier depends on hours remaining before start_utc, keyed by format"
      - name: format_tier
        when: "Never applied; documents the divergence"
        difference: "Tier depends only on listing.format, ignoring the cancellation instant"

  # --- AGGREGATION with an explicit status filter and a conservation invariant ---
  - name: section_seat_occupancy
    trigger: "any Enrollment status change on the section, and section capacity updates"
    algorithm: aggregation
    formula: |
      enrolled_count   = count(Enrollment where section_id == section.id
                               and status == CONFIRMED)
      reserved_count   = count(Enrollment where section_id == section.id
                               and status == RESERVED)
      seats_remaining  = section.capacity - enrolled_count - reserved_count
      enrollment_min_met = (enrolled_count >= section.min_learners)

      Enrollments in PENDING_CONFIRMATION, RELEASED and CANCELLED_BY_TEACHER are
      EXCLUDED from both counts; they hold no seat.

      Invariant (must hold after every write): seats_remaining >= 0.
    input_set: "All Enrollment rows whose section_id equals the section being evaluated"
    constants:
      SEAT_COUNTING_STATUSES: [CONFIRMED, RESERVED]
    precision: "exact integer arithmetic"

  # --- DUAL-VARIANT (Rule 1, instance B): accrual vs posted on TeacherPayout ---
  - name: expected_payout_gross_cents
    trigger: "payout creation and every teacher-fault refund cascade recompute"
    algorithm: forward_looking
    formula: |
      TWO INDEPENDENT SELECTORS are declared. The ACCRUAL selector is the one the server
      applies; the POSTED selector is the rejected alternative reading.

      ACCRUAL selector (applied) — what the teacher has earned and is owed:
        gross_earnings_cents = sum over every Section S where
              S's parent ClassListing.teacher_id == payout.teacher_id
              AND (S.outcome IS NULL OR S.outcome == HELD)
              AND S.start_utc >= payout.period_start
              AND S.start_utc <  payout.period_end
            of S.section_discounted_total_cents

        section_discounted_total_cents = sum of E.discounted_price_cents over every
            Enrollment E of S whose status is CONFIRMED

        A section that has not started yet still accrues its CONFIRMED revenue, and a
        section cancelled before it starts drops out of the sum because its outcome is no
        longer NULL or HELD. This is what makes a teacher-fault refund move the payout.

      POSTED selector (documented divergence, never applied) — what has already been
      disbursed:
        gross_earnings_cents = sum of net_payout_cents over every TeacherPayout of this
        teacher already in status PAID.

      A refunded section has its Section.outcome moved off HELD and its Enrollments moved
      to RELEASED, so it drops out of the ACCRUAL sum entirely.
    input_set: "Sections owned by the teacher with outcome HELD whose start_utc falls in the half-open period [period_start, period_end), and the enrollments of those sections"
    constants:
      ACCRUAL_INCLUDED_ENROLLMENT_STATUSES: [CONFIRMED]
    precision: "exact integer arithmetic; half-open period boundary [period_start, period_end)"

  # --- COMBINATORIAL MODE (b): nested rounding — floor per section, then sum ---
  - name: posted_payout_fee_cents
    trigger: "payout creation and recompute; also evaluated for current-period discontinuities"
    algorithm: tiered_pricing
    formula: |
      ROUNDING ORDER IS PINNED AND MUST NOT BE REORDERED. The fee is floored PER SECTION
      and the per-section results are then summed. Summing the section prices first and
      flooring once yields a different total whenever any per-section product is
      fractional.

      fee_rate_applied is the rate for the payout's gross_earnings_cents band:
        gross <  2000  -> 0.30
        gross <  5000  -> 0.25
        gross < 10000  -> 0.20
        gross >= 10000 -> 0.15
      then adjusted by the format of the sections in the period:
        + FORMAT_ADJUSTMENT[ONE_TIME]  (0.00)
        + FORMAT_ADJUSTMENT[MULTI_DAY] (-0.02)
        + FORMAT_ADJUSTMENT[ONGOING]   (-0.03)
      and by the teacher's posted-payout history:
        - VOLUME_DISCOUNT (0.02) when the teacher's already-posted lifetime gross
          >= VOLUME_DISCOUNT_THRESHOLD_CENTS
      fee_rate_applied = max(FEE_RATE_FLOOR, band_rate + format_adjustment - volume_discount)

      platform_fee_cents = sum over sections S in the ACCRUAL set of
                               floor(S.section_discounted_total_cents * fee_rate_applied)
      net_payout_cents   = gross_earnings_cents - platform_fee_cents
    input_set: "The same ACCRUAL section set as expected_payout_gross_cents, evaluated per section"
    constants:
      FEE_BANDS: { B0: { min_gross: 0, rate: 0.30 }, B1: { min_gross: 2000, rate: 0.25 }, B2: { min_gross: 5000, rate: 0.20 }, B3: { min_gross: 10000, rate: 0.15 } }
      FORMAT_ADJUSTMENT: { ONE_TIME: 0.00, MULTI_DAY: -0.02, ONGOING: -0.03 }
      VOLUME_DISCOUNT: 0.02
      VOLUME_DISCOUNT_THRESHOLD_CENTS: 500000
      FEE_RATE_FLOOR: 0.10
    precision: "floor per section, then integer sum — never sum-then-floor"
    variants:
      - name: floor_per_section_then_sum
        when: "Always — the applied order"
        difference: "Each section's fee is floored independently before summing"
      - name: sum_then_floor
        when: "Never applied; documents the divergence"
        difference: "Section totals are summed first and floored once, producing a larger fee"

  # --- WATERFALL: the approval cap distributes across already-approved payouts ---
  - name: payout_approval_cap
    trigger: "POST /outschool/teacher-payouts/{payoutId}/transition with action=SEND"
    algorithm: waterfall_allocation
    formula: |
      already_approved_sent_cents = sum of net_after_refunds_cents over every other
          TeacherPayout of this teacher whose status is SENT or PAID
      headroom_cents = max(0, PAYOUT_APPROVAL_CAP_CENTS - already_approved_sent_cents)
      payout_proration_factor = min(1.0,
          headroom_cents / max(1, payout.net_after_refunds_cents + already_approved_sent_cents))
      If payout.net_after_refunds_cents + already_approved_sent_cents
            > PAYOUT_APPROVAL_CAP_CENTS:
          the payout is HELD: approval_status = pending_approval and status stays REQUESTED
      Otherwise: approval_status = not_required and the payout may advance to SENT
    input_set: "All TeacherPayout rows of the same teacher, excluding VOIDED rows"
    constants:
      PAYOUT_APPROVAL_CAP_CENTS: 100000
    precision: "floor truncation to integer cents; ratio as IEEE-754 double"

  # --- DUAL-VARIANT (Rule 1, instance C): open-only vs upheld-any-status on Teacher ---
  - name: teacher_risk_score
    trigger: "any ParentReport status or disposition change against the teacher"
    algorithm: weighted_scoring
    formula: |
      severity_weight(report) = CATEGORY_WEIGHT[report.category]
                              + SEVERITY_POINTS[report.severity]

      TWO INDEPENDENT SCORING VARIANTS are declared and BOTH are maintained on the
      teacher. The ACTIONABLE score takes their maximum, so a report that is resolved
      away cannot un-suspend a teacher whose disposition was upheld.

      open_report_risk_score    = sum of severity_weight over reports with status == OPEN
      upheld_report_risk_score  = sum of severity_weight over reports whose disposition
                                  is WARNING or MORE_SEVERE, whatever their status
      actionable_risk_score     = max(open_report_risk_score, upheld_report_risk_score)
      peak_actionable_risk_score = max over the teacher's lifetime of actionable_risk_score

      teacher.open_report_count = count of reports whose status is neither CLOSED nor
                                  RESOLVED (so OPEN and UNDER_REVIEW both count)
    input_set: "All ParentReport rows whose teacher_id equals the teacher being scored"
    constants:
      CATEGORY_WEIGHT: { CONTENT_POLICY: 25, SAFETY: 40, CONDUCT: 15, TECHNICAL: 5, OTHER: 2 }
      SEVERITY_POINTS: { LOW: 0, MEDIUM: 10, HIGH: 25 }
      RISK_SUSPENSION_THRESHOLD: 40
    precision: "exact integer arithmetic"
    variants:
      - name: open_only
        when: "Populates open_report_risk_score; the 'is the problem still live' reading"
        difference: "Counts a report only while its status is OPEN, so resolving it drops the score"
      - name: upheld_any_status
        when: "Populates upheld_report_risk_score; the 'was the problem ever real' reading"
        difference: "Counts a report forever once its disposition is WARNING or MORE_SEVERE"

  # --- RATE / THRESHOLD: tax-document status as a pure function of lifetime earnings ---
  - name: tax_document_status
    trigger: "any change to teacher.lifetime_net_earnings_cents"
    algorithm: threshold
    formula: |
      if teacher.lifetime_net_earnings_cents <= TAX_DOC_REQUIRED_CENTS:
          payout_tax_document_status = ON_FILE
      elif teacher.lifetime_net_earnings_cents <= TAX_DOC_VALIDITY_CEILING_CENTS:
          payout_tax_document_status = REQUIRED_UPDATE
      else:
          payout_tax_document_status = EXPIRED

      A teacher who has earned nothing, or has earned no more than the reporting
      threshold, needs no tax document on file, so the initial state is ON_FILE and
      activation is not deadlocked. Crossing TAX_DOC_REQUIRED_CENTS moves the status to
      REQUIRED_UPDATE, which blocks payout SEND until earnings fall back to or below the
      threshold.

      The recompute runs after EVERY write to lifetime_net_earnings_cents, including the
      downward re-sum performed by a teacher-fault refund cascade — so a refund that
      drops lifetime earnings back to or below TAX_DOC_REQUIRED_CENTS moves the status
      from REQUIRED_UPDATE back to ON_FILE.
    input_set: "The single Teacher whose lifetime_net_earnings_cents changed"
    constants:
      TAX_DOC_REQUIRED_CENTS: 20000
      TAX_DOC_VALIDITY_CEILING_CENTS: 200000
    precision: "exact integer comparison; both boundaries are inclusive at the upper edge"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except those declaring the Anonymous role"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for the endpoint's declared roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-restricted endpoints"

  - priority: 3
    category: existence
    check: "Every path-resource id resolves, validated left to right along the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a resource id"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 5
    category: business_referential
    check: "Referenced sibling resources exist and are not archived: a ClassListing must exist for its Section, a Learner for its Enrollment, a Section for its Enrollment"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 409
    applies_to: "POST /outschool/class-listings, POST /outschool/class-listings/{listingId}/sections, POST /outschool/class-listings/{listingId}/sections/{sectionId}/enrollments, POST /outschool/class-reports"

  - priority: 6
    category: business_safety
    check: "Learner age at the section start instant falls inside the listing's [min_age, max_age] band, and the learner's date of birth is not in the future"
    error_id: ERR_LEARNER_AGE_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/enrollments"

  - priority: 7
    category: business_safety
    check: "Teacher is not suspended: enrolling into a section whose owning teacher.status is SUSPENDED or TERMINATED"
    error_id: ERR_TEACHER_SUSPENDED
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/enrollments"

  - priority: 8
    category: business_constraint
    check: "Section seat budget: seats_remaining > 0, counting CONFIRMED and RESERVED enrollments against capacity"
    error_id: ERR_SECTION_FULL
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/enrollments"

  - priority: 9
    category: business_temporal
    check: "Section start instant is strictly in the future at enrollment time"
    error_id: ERR_SECTION_ALREADY_STARTED
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/enrollments"

  - priority: 10
    category: business_constraint
    check: "Enrollment duplicate guard: the learner already holds an enrollment on this section in RESERVED, PENDING_CONFIRMATION or CONFIRMED status"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/enrollments"

  - priority: 11
    category: business_constraint
    check: "Coupon code is a member of the declared CATALOG_COUPONS catalog"
    error_id: ERR_COUPON_NOT_FOUND
    http_status: 404
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/enrollments"

  - priority: 12
    category: business_constraint
    check: "Coupon is not applied to a learner who already holds a CONFIRMED enrollment that used the same coupon code"
    error_id: ERR_COUPON_ALREADY_REDEEMED
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/enrollments"

  - priority: 13
    category: business_safety
    check: "Confirmation credit sufficiency: learner.confirmation_credit_cents >= enrollment.discounted_price_cents"
    error_id: ERR_CREDIT_INSUFFICIENT
    http_status: 409
    applies_to: "POST /outschool/enrollments/{enrollmentId}/confirm"

  - priority: 14
    category: business_temporal
    check: "Section start_utc is strictly before end_utc and both lie strictly after CURRENT_DEFAULT_UTC"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 400
    applies_to: "POST /outschool/class-listings/{listingId}/sections"

  - priority: 15
    category: business_referential
    check: "Section capacity does not exceed the parent listing's max_learners, and min_learners <= capacity"
    error_id: ERR_CAPACITY_EXCEEDS_LISTING
    http_status: 400
    applies_to: "POST /outschool/class-listings/{listingId}/sections"

  - priority: 16
    category: business_constraint
    check: "Teacher resource-ownership checks: the acting teacher owns the listing, section or payout being mutated, and the acting parent owns the learner whose enrollment is being mutated"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/cancel, POST /outschool/class-listings/{listingId}/publish, POST /outschool/enrollments/{enrollmentId}/confirm, POST /outschool/enrollments/{enrollmentId}/cancel, POST /outschool/teachers/{teacherId}/payouts"

  - priority: 17
    category: business_safety
    check: "Segregation of duties: the acting reviewer's X-User-ID may not equal the application's applicant_user_id — an applicant may not review or approve their own application"
    error_id: ERR_REVIEWER_CONFLICT
    http_status: 409
    applies_to: "POST /outschool/teacher-applications/{applicationId}/review, POST /outschool/teacher-applications/{applicationId}/approve"

  - priority: 18
    category: business_constraint
    check: "Content-review gate: a Section may only be created on a listing whose content_review_state is POLICY_APPROVED"
    error_id: ERR_LISTING_NOT_APPROVED
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/sections"

  - priority: 19
    category: business_temporal
    check: "Teaching sample duration is at least SAMPLE_MIN_MINUTES"
    error_id: ERR_SAMPLE_TOO_SHORT
    http_status: 400
    applies_to: "POST /outschool/teacher-applications, POST /outschool/teacher-applications/{applicationId}/submit, POST /outschool/teacher-applications/{applicationId}/submit-sample"

  - priority: 20
    category: business_constraint
    check: "Background screening validity: the applicant's latest COMPLETE screening record is not older than SCREENING_VALIDITY_PERIODS periods"
    error_id: ERR_SCREENING_STALE
    http_status: 409
    applies_to: "POST /outschool/teacher-applications/{applicationId}/submit-sample, POST /outschool/teacher-applications/{applicationId}/approve"

  - priority: 21
    category: state
    check: "Revision budget: the application has not exhausted APPLICATION_MAX_REVISIONS reviewer rejections"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /outschool/teacher-applications/{applicationId}/submit-sample, POST /outschool/teacher-applications/{applicationId}/approve"

  - priority: 22
    category: business_fiscal
    check: "Payout settlement window: period_end is strictly after period_start, and no other non-VOIDED payout of this teacher overlaps [period_start, period_end)"
    error_id: ERR_PAYOUT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /outschool/teachers/{teacherId}/payouts"


  - priority: 23
    category: business_fiscal
    check: "Tax-document gate: a payout may not advance to SENT while its tax_document_status is not ON_FILE"
    error_id: ERR_TAX_DOC_MISSING
    http_status: 409
    applies_to: "POST /outschool/teacher-payouts/{payoutId}/transition (action=SEND)"

  - priority: 24
    category: business_fiscal
    check: "Approval gate: a FAILED payout must carry approval_status pending_approval and be approved before it can be paid"
    error_id: ERR_PAYOUT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /outschool/teacher-payouts/{payoutId}/transition (action=APPROVE, action=PAY)"

  - priority: 25
    category: business_constraint
    check: "Payout idempotency fingerprint: an identical (period_start, period_end) pair on an existing REQUESTED payout returns that row instead of creating a second one"
    error_id: ERR_DUPLICATE_PAYOUT_PERIOD
    http_status: 409
    applies_to: "POST /outschool/teachers/{teacherId}/payouts"
    note: "Raised only when the existing REQUESTED payout's fingerprint matches but the caller supplied a different expected_teacher_version; the idempotent same-version path returns 200."

  - priority: 26
    category: business_constraint
    check: "Report filing cap: a parent may file at most REPORT_MAX_PER_SECTION reports against a given listing"
    error_id: ERR_REPORT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /outschool/class-reports"

  - priority: 27
    category: business_temporal
    check: "Report review SLA: a report left in OPEN for more than REPORT_SLA_PERIODS periods is auto-escalated to UNDER_REVIEW by run_ops"
    error_id: ERR_REPORT_SLA_EXPIRED
    http_status: 409
    applies_to: "POST /outschool/class-reports/{reportId}/disposition"

  - priority: 28
    category: business_constraint
    check: "Age-band sanity on the listing itself: min_age >= 3, max_age <= 18, min_age <= max_age"
    error_id: ERR_INVALID_AGE_BAND
    http_status: 400
    applies_to: "POST /outschool/class-listings, POST /outschool/class-listings/{listingId}/policy-review"

  - priority: 29
    category: business_constraint
    check: "Optimistic concurrency: the supplied expected_teacher_version equals the teacher's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /outschool/teachers/{teacherId}/payouts"

  - priority: 30
    category: business_constraint
    check: "Every required input field for the endpoint is present and non-blank"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 400
    applies_to: "all endpoints with required input"

  - priority: 31
    category: business_constraint
    check: "Every enum-typed input field carries a member of its declared enum"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 400
    applies_to: "all endpoints with enum input"

  - priority: 32
    category: state
    check: "The application's background screening outcome is not FAIL"
    error_id: ERR_SCREENING_FAILED
    http_status: 409
    applies_to: "POST /outschool/teacher-applications/{applicationId}/submit-sample"

  - priority: 33
    category: state
    check: "Final approval requires the application to be in SAMPLE_APPROVED"
    error_id: ERR_APPLICATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /outschool/teacher-applications/{applicationId}/approve"

  - priority: 34
    category: state
    check: "The owning teacher must be ACTIVE for section opening, publishing and section cancellation"
    error_id: ERR_TEACHER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/publish, POST /outschool/class-listings/{listingId}/sections/{sectionId}/open, POST /outschool/class-listings/{listingId}/sections/{sectionId}/cancel"

  - priority: 35
    category: state
    check: "The parent listing must be in lifecycle_state PUBLISHED for a section to be opened"
    error_id: ERR_LISTING_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/open"

  - priority: 36
    category: state
    check: "The section must be in OPEN_FOR_ENROLLMENT for its minimum to be declared met"
    error_id: ERR_SECTION_NOT_OPEN
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/meet-minimum"

  - priority: 37
    category: state
    check: "The section's confirmed enrollment must reach min_learners before the minimum can be declared met"
    error_id: ERR_MIN_ENROLLMENT_NOT_MET
    http_status: 409
    applies_to: "POST /outschool/class-listings/{listingId}/sections/{sectionId}/meet-minimum"

  - priority: 38
    category: state
    check: "A payout already in PAID status may not be transitioned again"
    error_id: ERR_PAYOUT_ALREADY_PAID
    http_status: 409
    applies_to: "POST /outschool/teacher-payouts/{payoutId}/transition"

  - priority: 39
    category: business_fiscal
    check: "The payout would push the teacher's approved-and-sent total past PAYOUT_APPROVAL_CAP_CENTS"
    error_id: ERR_PAYOUT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /outschool/teacher-payouts/{payoutId}/transition (action=SEND)"

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table  (40 endpoints)
# =============================================================================
endpoints:
  # --- TeacherApplication -----------------------------------------------------
  - method: POST
    path: "/outschool/teacher-applications"
    description: "Create a teacher application in DRAFT"
    roles: [TeacherApplicant, PlatformAdmin]
    code: 201
    input: [applicant_user_id, applicant_email, display_name, "teaching_sample_url?", "teaching_sample_minutes?"]
    output: TeacherApplication
    side_effects:
      - "status=DRAFT, screening_outcome=null, decision=null, revision_count=0"
      - "reviewed_by_user_id=null, reviewer_bound_period_index=null"

  - method: GET
    path: "/outschool/teacher-applications/{applicationId}"
    description: "Get a teacher application"
    roles: [TeacherApplicant, TeacherReviewer, PlatformAdmin]
    code: 200
    input: []
    output: TeacherApplication
    side_effects: []

  - method: POST
    path: "/outschool/teacher-applications/{applicationId}/submit"
    description: "Submit the application package: records the background screening and advances into screening"
    roles: [TeacherApplicant, PlatformAdmin]
    code: 200
    input: [teaching_sample_url, teaching_sample_minutes]
    output: TeacherApplication
    side_effects:
      - "status DRAFT → SCREENING_PENDING, then auto-advances to SCREENING_PASSED or SCREENING_FAILED"
      - "records a COMPLETE screening row for applicant_user_id; screening_outcome = PASS or FAIL"
      - "screening_completed_period_index = current_period_index"
      - "revision_count reset to 0; reviewed_by_user_id cleared"

  - method: POST
    path: "/outschool/teacher-applications/{applicationId}/submit-sample"
    description: "Submit or revise the teaching sample, entering the sample review queue"
    roles: [TeacherApplicant, PlatformAdmin]
    code: 200
    input: [teaching_sample_url, teaching_sample_minutes]
    output: TeacherApplication
    side_effects:
      - "status SCREENING_PASSED → SAMPLE_PENDING, or SAMPLE_REJECTED → SAMPLE_PENDING (revision loop)"
      - "reviewed_by_user_id=null, reviewer_bound_period_index=null, decision=null"

  - method: POST
    path: "/outschool/teacher-applications/{applicationId}/review"
    description: "Reviewer records a verdict on the screening or sample stage"
    roles: [TeacherReviewer, PlatformAdmin]
    code: 200
    input: [stage, verdict, "reason_code?"]
    output: TeacherApplication
    side_effects:
      - "binds reviewed_by_user_id to the acting reviewer and reviewer_bound_period_index to current_period_index"
      - "verdict PASS at stage SAMPLE moves status to SAMPLE_APPROVED; verdict FAIL moves it to SAMPLE_REJECTED or REJECTED"
      - "a REJECT increments revision_count"

  - method: POST
    path: "/outschool/teacher-applications/{applicationId}/approve"
    description: "Final approval: mints the Teacher account for the applicant"
    roles: [TeacherReviewer, PlatformAdmin]
    code: 201
    input: []
    output: Teacher
    side_effects:
      - "status SAMPLE_APPROVED → APPROVED"
      - "creates a Teacher row in PENDING_SETUP with screening_validity_period_index set"

  # --- Teacher -----------------------------------------------------------------
  - method: GET
    path: "/outschool/teachers/{teacherId}"
    description: "Get a teacher, including all computed risk, earnings and tax fields"
    roles: [Teacher, TeacherReviewer, PlatformAdmin]
    code: 200
    input: []
    output: Teacher
    side_effects: []

  - method: GET
    path: "/outschool/teachers"
    description: "List teachers, filterable by source application"
    roles: [TeacherReviewer, PlatformAdmin]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Teacher[]
    side_effects: []

  - method: POST
    path: "/outschool/teachers/{teacherId}/activate"
    description: "Move a teacher from PENDING_SETUP to ACTIVE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Teacher
    side_effects: ["status PENDING_SETUP → ACTIVE; suspension_reason and suspension_trigger cleared"]

  - method: POST
    path: "/outschool/teachers/{teacherId}/suspend"
    description: "Manually suspend a teacher and cascade the suspension to listings, sections and enrollments"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: Teacher
    side_effects:
      - "status ACTIVE → SUSPENDED; suspension_trigger=MANUAL"
      - "every PUBLISHED listing of this teacher → SUSPENDED"
      - "every SCHEDULED or OPEN_FOR_ENROLLMENT section of those listings → CANCELLED with outcome CANCELLED_BY_TEACHER"
      - "every RESERVED or CONFIRMED enrollment of those sections → CANCELLED_BY_TEACHER with refund_category FULL"

  - method: POST
    path: "/outschool/teachers/{teacherId}/reinstate"
    description: "Return a suspended teacher to ACTIVE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Teacher
    side_effects: ["status SUSPENDED → ACTIVE; suspension_reason and suspension_trigger cleared"]

  - method: POST
    path: "/outschool/teachers/{teacherId}/terminate"
    description: "Terminate a teacher whose listings carry no live sections"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Teacher
    side_effects: ["status → TERMINATED", "every listing of this teacher → ARCHIVED"]

  # --- ClassListing ------------------------------------------------------------
  - method: POST
    path: "/outschool/class-listings"
    description: "Create a class listing; enters content review"
    roles: [Teacher, PlatformAdmin]
    code: 201
    input: [teacher_id, title, format, min_age, max_age, max_learners, list_price_cents]
    output: ClassListing
    side_effects:
      - "content_review_state=PENDING_REVIEW, lifecycle_state=DRAFT"
      - "listing_sequence assigned monotonically within the owning teacher"

  - method: GET
    path: "/outschool/class-listings/{listingId}"
    description: "Get a class listing"
    roles: [Teacher, TeacherReviewer, Parent, PlatformAdmin]
    code: 200
    input: []
    output: ClassListing
    side_effects: []

  - method: GET
    path: "/outschool/class-listings"
    description: "List class listings, filterable by owning teacher and by review/lifecycle state"
    roles: [Teacher, TeacherReviewer, Parent, PlatformAdmin]
    code: 200
    input: ["teacher_id?", "lifecycle_state?", "content_review_state?", "format?", "limit?", "offset?"]
    output: ClassListing[]
    side_effects: []

  - method: POST
    path: "/outschool/class-listings/{listingId}/policy-review"
    description: "Content-policy review of a listing's age band and subject matter"
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "reason_code?"]
    output: ClassListing
    side_effects:
      - "decision APPROVE: content_review_state → POLICY_APPROVED"
      - "decision REJECT: content_review_state → POLICY_REJECTED and lifecycle_state → ARCHIVED"

  - method: POST
    path: "/outschool/class-listings/{listingId}/publish"
    description: "Publish an approved listing so sections can be opened"
    roles: [Teacher, PlatformAdmin]
    code: 200
    input: []
    output: ClassListing
    side_effects: ["lifecycle_state DRAFT → PUBLISHED"]

  # --- Section -----------------------------------------------------------------
  - method: POST
    path: "/outschool/class-listings/{listingId}/sections"
    description: "Schedule a section of a listing"
    roles: [Teacher, PlatformAdmin]
    code: 201
    input: [timezone, start_utc, end_utc, min_learners, capacity, "expected_learners?"]
    output: Section
    side_effects:
      - "status=SCHEDULED, outcome=null, cancellation_cutoff_utc = start_utc - AUTO_CANCEL_CUTOFF_HOURS"

  - method: GET
    path: "/outschool/class-listings/{id}/sections"
    description: "List the sections of a listing (reverse-reachability GET for Section.class_listing_id)"
    roles: [Teacher, Parent, TeacherReviewer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Section[]
    side_effects: []

  - method: POST
    path: "/outschool/class-listings/{listingId}/sections/{sectionId}/open"
    description: "Open a scheduled section for enrollment"
    roles: [Teacher, PlatformAdmin]
    code: 200
    input: []
    output: Section
    side_effects: ["status SCHEDULED → OPEN_FOR_ENROLLMENT"]

  - method: POST
    path: "/outschool/class-listings/{listingId}/sections/{sectionId}/meet-minimum"
    description: "Declare the enrollment minimum satisfied"
    roles: [Teacher, PlatformAdmin]
    code: 200
    input: []
    output: Section
    side_effects:
      - "status OPEN_FOR_ENROLLMENT → MIN_ENROLLMENT_MET"
      - "No credit movement: confirmation credit is drawn only when an individual enrollment is confirmed"

  - method: POST
    path: "/outschool/class-listings/{listingId}/sections/{sectionId}/cancel"
    description: "Cancel a section before it starts and refund every enrollment in full"
    roles: [Teacher, PlatformAdmin]
    code: 200
    input: []
    output: Section
    side_effects:
      - "status → CANCELLED with outcome=CANCELLED_BY_TEACHER"
      - "every RESERVED or CONFIRMED enrollment → CANCELLED_BY_TEACHER with refund_category FULL"
      - "teacher-fault refund cascade: REQUESTED payouts of the owning teacher overlapping this section are recomputed, set to FAILED, and their teacher_liability_cents / platform_fee_reversed_cents written"
      - "the recomputed net_payout_cents is re-summed into teacher.lifetime_net_earnings_cents"

  # --- Learner -----------------------------------------------------------------
  - method: POST
    path: "/outschool/learners"
    description: "Create a learner account owned by a parent operator id"
    roles: [Parent, PlatformAdmin]
    code: 201
    input: [display_name, birth_date, parent_user_id]
    output: Learner
    side_effects:
      - "subscription_tier=NONE, confirmation_credit_cents=0, abuse_strike_count=0"
      - "enrollment_sequence starts at 0"

  - method: GET
    path: "/outschool/learners/{learnerId}"
    description: "Get a learner"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: []
    output: Learner
    side_effects: []

  - method: POST
    path: "/outschool/learners/{learnerId}/subscription"
    description: "Set the learner's subscription tier and refill the confirmation-credit allowance"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: [subscription_tier]
    output: Learner
    side_effects:
      - "subscription_tier written; subscription_discount_pct recomputed"
      - "confirmation_credit_cents refilled to the active plan's included amount"

  # --- Enrollment --------------------------------------------------------------
  - method: POST
    path: "/outschool/class-listings/{listingId}/sections/{sectionId}/enrollments"
    description: "Reserve a seat for a learner on a section"
    roles: [Parent, PlatformAdmin]
    code: 201
    input: [learner_id, "coupon_code?"]
    output: Enrollment
    side_effects:
      - "status=RESERVED; subscription and coupon discounts computed in the pinned stacking order"
      - "learner.enrollment_sequence incremented by 1"

  - method: GET
    path: "/outschool/enrollments/{enrollmentId}"
    description: "Get an enrollment"
    roles: [Parent, Teacher, PlatformAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/outschool/enrollments"
    description: "List enrollments, filterable by learner and by section"
    roles: [Parent, Teacher, PlatformAdmin]
    code: 200
    input: ["learner_id?", "section_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/outschool/enrollments/{enrollmentId}/confirm"
    description: "Confirm a reserved seat, drawing down the learner's confirmation credit"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "status RESERVED → CONFIRMED"
      - "learner.confirmation_credit_cents -= enrollment.discounted_price_cents"

  - method: POST
    path: "/outschool/enrollments/{enrollmentId}/cancel"
    description: "Cancel an enrollment, tiering the refund by timing and by section format"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "status → CANCELLED_BY_TEACHER or RELEASED; refund_category and refund_cents computed by the timing tier"
      - "credit_applied_cents drawn from the learner's confirmation credit; cash_refund_cents is the remainder"
      - "a learner-fault cancellation increments learner.abuse_strike_count"
      - "a teacher-fault cancellation runs the refund cascade and may re-sum the teacher's lifetime earnings"
      - "if the cancellation drops a CONFIRMED section below its minimum, the seat-loss cascade cancels that section"

  # --- TeacherPayout -----------------------------------------------------------
  - method: POST
    path: "/outschool/teachers/{teacherId}/payouts"
    description: "Request a payout for a settlement period"
    roles: [Teacher, PlatformAdmin]
    code: 201
    input: [period_start, period_end, expected_teacher_version]
    output: TeacherPayout
    side_effects:
      - "status=REQUESTED; gross, fee and net computed by the accrual and per-section-floor rules"
      - "teacher.version incremented by 1"
      - "an identical (period_start, period_end) fingerprint on an existing REQUESTED payout returns that row with code 200 instead of creating a second"

  - method: GET
    path: "/outschool/teacher-payouts/{payoutId}"
    description: "Get a payout"
    roles: [Teacher, PlatformAdmin]
    code: 200
    input: []
    output: TeacherPayout
    side_effects: []

  - method: GET
    path: "/outschool/teacher-payouts"
    description: "List payouts, filterable by teacher"
    roles: [Teacher, PlatformAdmin]
    code: 200
    input: ["teacher_id?", "status?", "limit?", "offset?"]
    output: TeacherPayout[]
    side_effects: []

  - method: POST
    path: "/outschool/teacher-payouts/{payoutId}/transition"
    description: "Advance a payout through its settlement pipeline"
    roles: [PlatformAdmin]
    code: 200
    input: [action]
    output: TeacherPayout
    side_effects:
      - "action SEND: REQUESTED → SENT, gated on tax document and approval cap"
      - "action APPROVE: FAILED → PAID, clearing pending_approval"
      - "action PAY: SENT → PAID, decrementing teacher.unpaid_earnings_cents"
      - "action VOID: REQUESTED, SENT or FAILED → VOIDED and re-sums teacher.lifetime_net_earnings_cents"

  # --- ParentReport ------------------------------------------------------------
  - method: POST
    path: "/outschool/class-reports"
    description: "File a parent report against a teacher and listing"
    roles: [Parent, PlatformAdmin]
    code: 201
    input: [teacher_id, class_listing_id, reported_by_user_id, severity, category]
    output: ParentReport
    side_effects:
      - "status=OPEN, disposition=null, severity_weight computed"
      - "teacher.open_report_risk_score and open_report_count recomputed"

  - method: GET
    path: "/outschool/class-reports/{reportId}"
    description: "Get a report"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: []
    output: ParentReport
    side_effects: []

  - method: GET
    path: "/outschool/class-reports"
    description: "List reports, filterable by teacher and by listing"
    roles: [Parent, PlatformAdmin]
    code: 200
    input: ["teacher_id?", "class_listing_id?", "status?", "limit?", "offset?"]
    output: ParentReport[]
    side_effects: []

  - method: POST
    path: "/outschool/class-reports/{reportId}/disposition"
    description: "Advance a report through review and record its disposition"
    roles: [PlatformAdmin]
    code: 200
    input: [action, "reason?"]
    output: ParentReport
    side_effects:
      - "action START_REVIEW: OPEN → UNDER_REVIEW, or RESOLVED → UNDER_REVIEW (reopen)"
      - "action DISMISS: UNDER_REVIEW → RESOLVED with disposition=DISMISSED and no risk recalculation"
      - "action UPHOLD_WARNING: UNDER_REVIEW → RESOLVED with disposition=WARNING, then the risk cascade"
      - "action UPHOLD_MORE_SEVERE: UNDER_REVIEW → CLOSED with disposition=MORE_SEVERE, then the risk cascade"
      - "the risk cascade recomputes teacher.upheld_report_risk_score, raises peak_actionable_risk_score, and suspends the teacher when actionable_risk_score >= RISK_SUSPENSION_THRESHOLD"

  # --- Ops / test-driving ------------------------------------------------------
  - method: POST
    path: "/outschool/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and the clock MUST NOT fall back to real wall-clock time before this endpoint is called."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["current_period_index advances to the count of complete 24-hour periods elapsed since CURRENT_DEFAULT_UTC"]

  - method: POST
    path: "/outschool/_ops/run"
    description: "Run the batch sweep: section auto-cancellation, completion, reservation release, report SLA escalation, reviewer SLA expiry, tax-document validity"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ cancelled_section_ids: string[], completed_section_ids: string[], released_enrollment_ids: string[], escalated_report_ids: string[], expired_application_ids: string[], suspended_teacher_ids: string[] }"
    side_effects:
      - "auto-cancels sections past their cutoff whose expected enrollment falls short of the minimum"
      - "completes MIN_ENROLLMENT_MET sections whose start has passed and which are settled"
      - "releases RESERVED enrollments at section start"
      - "escalates OPEN reports older than REPORT_SLA_PERIODS periods"
      - "rejects SAMPLE_PENDING applications whose bound reviewer exceeded REVIEWER_SLA_PERIODS"
      - "recomputes payout_tax_document_status for every teacher whose lifetime earnings changed"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header absent, or X-User-Role is not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "The acting role is not listed in the endpoint's roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-resource id does not resolve, validated left to right along the path" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "The acting teacher does not own the listing, section or payout being mutated, or the acting parent does not own the learner whose enrollment is being mutated" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in a state from which the requested transition is declared" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_teacher_version does not equal the teacher's current version" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 409, condition: "A referenced sibling resource does not exist or is archived" }
  - { id: ERR_MISSING_REQUIRED_FIELD, http: 400, condition: "A required request-body field is absent or blank" }
  - { id: ERR_INVALID_ENUM_VALUE, http: 400, condition: "A field carries a value outside its declared enum" }
  - { id: ERR_INVALID_AGE_BAND, http: 400, condition: "min_age < 3, max_age > 18, or min_age > max_age" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 400, condition: "start_utc is not strictly before end_utc, or either instant is not strictly after CURRENT_DEFAULT_UTC" }
  - { id: ERR_CAPACITY_EXCEEDS_LISTING, http: 400, condition: "Section capacity exceeds the parent listing's max_learners, or min_learners exceeds capacity" }
  - { id: ERR_SAMPLE_TOO_SHORT, http: 400, condition: "teaching_sample_minutes is below SAMPLE_MIN_MINUTES" }
  - { id: ERR_LISTING_NOT_APPROVED, http: 409, condition: "Section creation attempted on a listing whose content_review_state is not POLICY_APPROVED" }
  - { id: ERR_LISTING_NOT_PUBLISHED, http: 409, condition: "Section opening attempted on a listing whose lifecycle_state is not PUBLISHED" }
  - { id: ERR_TEACHER_NOT_ACTIVE, http: 409, condition: "The owning teacher's status is not ACTIVE for an operation that requires it" }
  - { id: ERR_TEACHER_SUSPENDED, http: 409, condition: "Enrollment attempted into a section whose owning teacher is SUSPENDED or TERMINATED" }
  - { id: ERR_SECTION_FULL, http: 409, condition: "Section has no remaining seats once CONFIRMED and RESERVED enrollments are counted against capacity" }
  - { id: ERR_SECTION_ALREADY_STARTED, http: 409, condition: "Section start_utc is not strictly in the future" }
  - { id: ERR_SECTION_NOT_OPEN, http: 409, condition: "Section status is not OPEN_FOR_ENROLLMENT" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "The learner already holds a RESERVED, PENDING_CONFIRMATION or CONFIRMED enrollment on this section" }
  - { id: ERR_LEARNER_AGE_OUT_OF_RANGE, http: 409, condition: "The learner's age at the section start instant falls outside the listing's [min_age, max_age] band, or the date of birth is not strictly before CURRENT_DEFAULT_UTC" }
  - { id: ERR_COUPON_NOT_FOUND, http: 404, condition: "coupon_code is not a member of the declared CATALOG_COUPONS catalog" }
  - { id: ERR_COUPON_ALREADY_REDEEMED, http: 409, condition: "The learner already holds a CONFIRMED enrollment that used the same coupon code" }
  - { id: ERR_CREDIT_INSUFFICIENT, http: 409, condition: "learner.confirmation_credit_cents is below enrollment.discounted_price_cents" }
  - { id: ERR_MIN_ENROLLMENT_NOT_MET, http: 409, condition: "enrolled_count is below section.min_learners at the moment the minimum is declared met" }
  - { id: ERR_SCREENING_FAILED, http: 409, condition: "The application's background screening outcome is FAIL" }
  - { id: ERR_SCREENING_STALE, http: 409, condition: "The applicant's latest COMPLETE screening record is older than SCREENING_VALIDITY_PERIODS periods" }
  - { id: ERR_REVISION_LIMIT_REACHED, http: 409, condition: "revision_count has reached APPLICATION_MAX_REVISIONS" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 409, condition: "Final approval attempted on an application whose status is not SAMPLE_APPROVED" }
  - { id: ERR_REVIEWER_CONFLICT, http: 409, condition: "The acting reviewer is bound as reviewed_by_user_id from an earlier round and may not decide the same application twice" }
  - { id: ERR_PAYOUT_PERIOD_OVERLAP, http: 409, condition: "period_end is not strictly after period_start, or another non-VOIDED payout of this teacher overlaps the requested period" }
  - { id: ERR_DUPLICATE_PAYOUT_PERIOD, http: 409, condition: "A REQUESTED payout with an identical fingerprint exists and the caller supplied a different expected_teacher_version" }
  - { id: ERR_TAX_DOC_MISSING, http: 409, condition: "A payout may not advance to SENT while its tax_document_status is not ON_FILE" }
  - { id: ERR_PAYOUT_NOT_APPROVED, http: 409, condition: "A FAILED payout is not in pending_approval, or a payout is paid before its approval is recorded" }
  - { id: ERR_PAYOUT_ALREADY_PAID, http: 409, condition: "A payout already in PAID status is transitioned again" }
  - { id: ERR_PAYOUT_CAP_EXCEEDED, http: 409, condition: "The payout would push the teacher's approved-and-sent total past PAYOUT_APPROVAL_CAP_CENTS" }
  - { id: ERR_REPORT_WINDOW_CLOSED, http: 409, condition: "The reported section has not started, or the parent has reached REPORT_MAX_PER_SECTION reports on that section" }
  - { id: ERR_REPORT_SLA_EXPIRED, http: 409, condition: "The report has sat in OPEN beyond REPORT_SLA_PERIODS periods and must be escalated before a disposition is recorded" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Marketplace operator: policy review, teacher lifecycle, payout settlement, report disposition"
    identity: opaque
    exclusive_operations:
      - "POST /outschool/class-listings/{listingId}/policy-review"
      - "POST /outschool/teachers/{teacherId}/activate"
      - "POST /outschool/teachers/{teacherId}/suspend"
      - "POST /outschool/teachers/{teacherId}/reinstate"
      - "POST /outschool/teachers/{teacherId}/terminate"
      - "POST /outschool/teacher-payouts/{payoutId}/transition"
      - "POST /outschool/class-reports/{reportId}/disposition"
      - "POST /outschool/_clock/set_current_utc"
      - "POST /outschool/_ops/run"
    shared_operations:
      - "POST /outschool/teacher-applications"
      - "POST /outschool/class-listings"
      - "POST /outschool/class-listings/{listingId}/sections"
      - "POST /outschool/learners"
      - "POST /outschool/enrollments/{enrollmentId}/cancel"

  - name: TeacherReviewer
    description: "Onboarding reviewer: decides screening and teaching-sample outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /outschool/teacher-applications/{applicationId}/review"
      - "POST /outschool/teacher-applications/{applicationId}/approve"
    shared_operations:
      - "GET /outschool/teacher-applications/{applicationId}"
      - "GET /outschool/teachers/{teacherId}"
      - "GET /outschool/teachers"

  - name: TeacherApplicant
    description: "Prospective teacher working an application through onboarding"
    identity: opaque
    exclusive_operations:
      - "POST /outschool/teacher-applications/{applicationId}/submit"
      - "POST /outschool/teacher-applications/{applicationId}/submit-sample"
    shared_operations:
      - "POST /outschool/teacher-applications"
      - "GET /outschool/teacher-applications/{applicationId}"

  - name: Teacher
    description: "Approved teacher who owns listings, sections and payout entitlements"
    identity: "entity_backed:Teacher"
    exclusive_operations:
      - "POST /outschool/teachers/{teacherId}/payouts"
    shared_operations:
      - "POST /outschool/class-listings"
      - "POST /outschool/class-listings/{listingId}/sections"
      - "POST /outschool/class-listings/{listingId}/sections/{sectionId}/cancel"
      - "POST /outschool/class-listings/{listingId}/publish"

  - name: Parent
    description: "Parent operator managing learner accounts, enrollments and reports"
    identity: opaque
    exclusive_operations:
      - "POST /outschool/class-listings/{listingId}/sections/{sectionId}/enrollments"
      - "POST /outschool/enrollments/{enrollmentId}/confirm"
      - "POST /outschool/learners/{learnerId}/subscription"
    shared_operations:
      - "POST /outschool/learners"
      - "POST /outschool/class-reports"
      - "GET /outschool/class-listings"
      - "GET /outschool/class-listings/{listingId}/sections"
    parent_entity: Teacher
    write_endpoint: "POST /outschool/teachers/{teacherId}/payouts"
    occ_field: "expected_teacher_version"
    description: |
      A teacher-fault refund cascade mutates Teacher fields (lifetime_fee_reversed_cents,
      lifetime_teacher_liability_cents, unpaid_earnings_cents) and therefore advances
      Teacher.version. A client that observed the teacher before the cascade and then
      submits a payout still carrying the pre-cascade version is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412