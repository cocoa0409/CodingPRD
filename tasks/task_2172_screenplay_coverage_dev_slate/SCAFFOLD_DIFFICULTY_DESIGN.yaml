scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: coverage_normalized_vs_composite_score_diverge
        grounds:
          - calculations.coverage_score_pair
          - calculations.reader_calibration_bias
          - entities.CoverageReport.fields.composite_score
          - entities.CoverageReport.fields.normalized_score
          - entities.Reader.fields.calibration_bias
        distinguishing_aspect: |
          This dual variant lives in the COVERAGE-QUALITY domain (CoverageReport craft scoring):
          the AS_SUBMITTED variant stores 7.65 in composite_score while the CALIBRATED variant
          stores 4.15 in normalized_score for the very same five craft scores, because the author
          reader's calibration_bias is 3.50 at submit time.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Reader R1 (DRAMA, STAFF, weekly_capacity 3) has exactly one APPROVED CoverageReport whose composite_score is 9.00, so calibration_bias == 3.50 and completed_report_count == 1."
            - "A second submission on a second DRAMA property is INTAKE_CLEARED and assigned to R1; its DRAFT report carries craft scores 8/7/9/6/8, recommendation RECOMMEND, synopsis_word_count 400."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Ashfall County", material_type: "SPEC_SCRIPT", source_author_name: "J. Ruiz", genre: "DRAMA", logline: "A wildfire crew turns on itself." }
              as: StoryEditor
              captures: { p1_id: "$.data.id" }
            - call: "POST /readers"
              payload: { display_name: "R1 Vance", specialty_genre: "DRAMA", weekly_capacity: 3, employment_type: "STAFF" }
              as: SlateAdmin
              captures: { r1_id: "$.data.id" }
            - call: "POST /submissions"
              payload: { property_id: "${p1_id}", submitting_agency: "CAA", submitter_contact_email: "desk@caa.example", submitted_via: "AGENCY", priority_flag: "STANDARD" }
              as: Submitter
              captures: { s1_id: "$.data.id" }
            - call: "POST /submissions/${s1_id}/clear-intake"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-assign-1"
            - call: "POST /submissions/${s1_id}/assign-reader"
              payload: { reader_id: "${r1_id}", window_start: "2026-09-01T00:00:00Z", window_due: "2026-09-04T00:00:00Z" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { ca1_id: "$.data.id" }
            - call: "GET /coverage-reports"
              payload: { assignment_id: "${ca1_id}" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { rep1_id: "$.data[0].id" }
            - call: "PATCH /coverage-reports/${rep1_id}"
              payload: { logline_score: 9, structure_score: 9, character_score: 9, dialogue_score: 9, marketability_score: 9, recommendation: "RECOMMEND", synopsis_word_count: 400 }
              as: Reader
              as_user_id: "${r1_id}"
            - call: "POST /coverage-reports/${rep1_id}/submit"
              payload: {}
              as: Reader
              as_user_id: "${r1_id}"
            - call: "POST /coverage-reports/${rep1_id}/approve"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-approve-1"
            - call: "POST /literary-properties"
              payload: { title: "The Longer Winter", material_type: "SPEC_SCRIPT", source_author_name: "M. Okoye", genre: "DRAMA", logline: "A widowed cartographer maps a town that no longer exists." }
              as: StoryEditor
              captures: { p2_id: "$.data.id" }
            - call: "POST /submissions"
              payload: { property_id: "${p2_id}", submitting_agency: "WME", submitter_contact_email: "lit@wme.example", submitted_via: "AGENCY", priority_flag: "STANDARD" }
              as: Submitter
              captures: { s2_id: "$.data.id" }
            - call: "POST /submissions/${s2_id}/clear-intake"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-assign-1"
            - call: "POST /submissions/${s2_id}/assign-reader"
              payload: { reader_id: "${r1_id}", window_start: "2026-09-10T00:00:00Z", window_due: "2026-09-13T00:00:00Z" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { ca2_id: "$.data.id" }
            - call: "GET /coverage-reports"
              payload: { assignment_id: "${ca2_id}" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { rep2_id: "$.data[0].id" }
            - call: "PATCH /coverage-reports/${rep2_id}"
              payload: { logline_score: 8, structure_score: 7, character_score: 9, dialogue_score: 6, marketability_score: 8, recommendation: "RECOMMEND", synopsis_word_count: 400 }
              as: Reader
              as_user_id: "${r1_id}"
          trigger:
            - call: "POST /coverage-reports/${rep2_id}/submit"
              payload: {}
              as: Reader
              as_user_id: "${r1_id}"
          assert:
            - "Reader.${r1_id}.calibration_bias == 3.50"
            - "Reader.${r1_id}.completed_report_count == 1"
            - "CoverageReport.${rep2_id}.composite_score == 7.65"
            - "CoverageReport.${rep2_id}.normalized_score == 4.15"
            - "CoverageReport.${rep2_id}.composite_score - CoverageReport.${rep2_id}.normalized_score == 3.50"
            - "CoverageReport.${rep1_id}.normalized_score == 9.00"

      - name: option_net_purchase_applicable_vs_non_applicable_credit
        grounds:
          - calculations.option_net_purchase_due
          - entities.OptionAgreement.fields.applicable_to_purchase
          - entities.OptionAgreement.fields.applicable_credit_cents
          - entities.OptionAgreement.fields.net_purchase_due_cents
        distinguishing_aspect: |
          This dual variant lives in the RIGHTS-FINANCE domain (OptionAgreement purchase accounting),
          not the coverage-scoring domain: identical fee/price/budget inputs yield
          net_purchase_due_cents == 98500000 under APPLICABLE and 103500000 under NON_APPLICABLE,
          a 5000000-cent delta driven solely by applicable_to_purchase.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two DRAMA properties each carry three verified chain documents, so both are rights_chain_status CLEAR."
            - "Property A's option (fee 5000000, price 90000000, applicable_to_purchase true) is ACTIVE and already linked to a project with budget_cents 2000000000."
            - "Property B's option carries identical money fields but applicable_to_purchase false and is ACTIVE with no project yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Salt Flats", material_type: "BOOK", source_author_name: "D. Halvorsen", genre: "THRILLER", logline: "A land-speed racer outruns a subpoena." }
              as: StoryEditor
              captures: { pa_id: "$.data.id" }
            - call: "POST /literary-properties/${pa_id}/rights-documents"
              payload: { doc_type: "CHAIN_OF_TITLE", executed_on: "2026-01-15", verified: true }
              as: BusinessAffairs
            - call: "POST /literary-properties/${pa_id}/rights-documents"
              payload: { doc_type: "COPYRIGHT_CERT", executed_on: "2026-01-20", verified: true }
              as: BusinessAffairs
            - call: "POST /literary-properties/${pa_id}/rights-documents"
              payload: { doc_type: "WGA_REGISTRATION", executed_on: "2026-01-22", verified: true }
              as: BusinessAffairs
            - call: "GET /literary-properties/${pa_id}"
              payload: {}
              as: BusinessAffairs
              captures: { pa_v: "$.data.version" }
            - call: "POST /option-agreements"
              payload: { property_id: "${pa_id}", expected_property_version: "${pa_v}", option_fee_cents: 5000000, purchase_price_cents: 90000000, initial_period_months: 18, option_start_at: "2026-09-01T00:00:00Z", extension_period_months: 12, extension_fee_cents: 2500000, applicable_to_purchase: true }
              as: BusinessAffairs
              captures: { oa_id: "$.data.id" }
            - call: "POST /option-agreements/${oa_id}/execute"
              payload: {}
              as: BusinessAffairs
            - call: "POST /development-projects"
              payload: { property_id: "${pa_id}", option_agreement_id: "${oa_id}", budget_cents: 2000000000, slate_year: 2028 }
              as: DevelopmentExec
              as_user_id: "exec-alpha"
              captures: { proja_id: "$.data.id" }
            - call: "POST /literary-properties"
              payload: { title: "Salt Flats II", material_type: "BOOK", source_author_name: "D. Halvorsen", genre: "THRILLER", logline: "The subpoena wins." }
              as: StoryEditor
              captures: { pb_id: "$.data.id" }
            - call: "POST /literary-properties/${pb_id}/rights-documents"
              payload: { doc_type: "CHAIN_OF_TITLE", executed_on: "2026-02-15", verified: true }
              as: BusinessAffairs
            - call: "POST /literary-properties/${pb_id}/rights-documents"
              payload: { doc_type: "COPYRIGHT_CERT", executed_on: "2026-02-20", verified: true }
              as: BusinessAffairs
            - call: "POST /literary-properties/${pb_id}/rights-documents"
              payload: { doc_type: "WGA_REGISTRATION", executed_on: "2026-02-22", verified: true }
              as: BusinessAffairs
            - call: "GET /literary-properties/${pb_id}"
              payload: {}
              as: BusinessAffairs
              captures: { pb_v: "$.data.version" }
            - call: "POST /option-agreements"
              payload: { property_id: "${pb_id}", expected_property_version: "${pb_v}", option_fee_cents: 5000000, purchase_price_cents: 90000000, initial_period_months: 18, option_start_at: "2026-09-01T00:00:00Z", extension_period_months: 12, extension_fee_cents: 2500000, applicable_to_purchase: false }
              as: BusinessAffairs
              captures: { ob_id: "$.data.id" }
            - call: "POST /option-agreements/${ob_id}/execute"
              payload: {}
              as: BusinessAffairs
          trigger:
            - call: "POST /development-projects"
              payload: { property_id: "${pb_id}", option_agreement_id: "${ob_id}", budget_cents: 2000000000, slate_year: 2028 }
              as: DevelopmentExec
              as_user_id: "exec-alpha"
              captures: { projb_id: "$.data.id" }
          assert:
            - "OptionAgreement.${oa_id}.escalation_bps == 1500"
            - "OptionAgreement.${oa_id}.adjusted_purchase_price_cents == 103500000"
            - "OptionAgreement.${oa_id}.applicable_credit_cents == 5000000"
            - "OptionAgreement.${oa_id}.net_purchase_due_cents == 98500000"
            - "OptionAgreement.${ob_id}.escalation_bps == 1500"
            - "OptionAgreement.${ob_id}.adjusted_purchase_price_cents == 103500000"
            - "OptionAgreement.${ob_id}.applicable_credit_cents == 0"
            - "OptionAgreement.${ob_id}.net_purchase_due_cents == 103500000"
            - "OptionAgreement.${ob_id}.net_purchase_due_cents - OptionAgreement.${oa_id}.net_purchase_due_cents == 5000000"

  - rule_id: combinatorial_formula
    instances:
      - name: milestone_floor_per_line_then_remainder_to_largest_share
        grounds:
          - calculations.milestone_payment_schedule
          - entities.MilestonePayment.fields.gross_amount_cents
          - entities.MilestonePayment.fields.percentage_bps
          - state_machines.WriterEngagement.PROPOSED_to_ATTACHED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. total_fee_cents 7500001 split
          3334/3333/3333 bps floors to 2500500/2499750/2499750 leaving a 1-cent remainder that the
          pinned order pushes entirely into the largest-share line, giving 2500501/2499750/2499750;
          rounding half-up per line and summing instead yields 2500500 and a total of 7500000 that
          does not reconcile.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A CLEAR THRILLER property carries an ACTIVE option and a DevelopmentProject with budget_cents 2000000000 (writer_budget_cap_cents 240000000, committed_writer_fee_cents 0, development_status SETUP)."
            - "Guild writer W1 has committed_fee_cents 0 and a PROPOSED PRODUCTION_REWRITE engagement of total_fee_cents 7500001 (above the 5000000 guild minimum for that type)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Nine Bridges", material_type: "SPEC_SCRIPT", source_author_name: "T. Almeida", genre: "THRILLER", logline: "A demolition engineer keeps rebuilding the same span." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "CHAIN_OF_TITLE", executed_on: "2026-01-15", verified: true }
              as: BusinessAffairs
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "COPYRIGHT_CERT", executed_on: "2026-01-20", verified: true }
              as: BusinessAffairs
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "WGA_REGISTRATION", executed_on: "2026-01-22", verified: true }
              as: BusinessAffairs
            - call: "GET /literary-properties/${p_id}"
              payload: {}
              as: BusinessAffairs
              captures: { p_v: "$.data.version" }
            - call: "POST /option-agreements"
              payload: { property_id: "${p_id}", expected_property_version: "${p_v}", option_fee_cents: 5000000, purchase_price_cents: 90000000, initial_period_months: 18, option_start_at: "2026-09-01T00:00:00Z" }
              as: BusinessAffairs
              captures: { o_id: "$.data.id" }
            - call: "POST /option-agreements/${o_id}/execute"
              payload: {}
              as: BusinessAffairs
            - call: "POST /development-projects"
              payload: { property_id: "${p_id}", option_agreement_id: "${o_id}", budget_cents: 2000000000, slate_year: 2028 }
              as: DevelopmentExec
              as_user_id: "exec-alpha"
              captures: { proj_id: "$.data.id", proj_v: "$.data.version" }
            - call: "POST /writers"
              payload: { name: "W1 Ferrante", guild_member: true, quote_cents: 7500000 }
              as: SlateAdmin
              captures: { w1_id: "$.data.id" }
            - call: "POST /writer-engagements"
              payload: { project_id: "${proj_id}", writer_id: "${w1_id}", engagement_type: "PRODUCTION_REWRITE", total_fee_cents: 7500001, start_date: "2026-09-05", end_date: "2027-01-05", expected_project_version: "${proj_v}" }
              as: DevelopmentExec
              as_user_id: "exec-alpha"
              captures: { e1_id: "$.data.id" }
          trigger:
            - call: "POST /writer-engagements/${e1_id}/attach"
              payload: {}
              as: DevelopmentExec
              as_user_id: "exec-alpha"
          assert:
            - "WriterEngagement.${e1_id}.status == ATTACHED"
            - "WriterEngagement.${e1_id}.milestone_count == 3"
            - "MilestonePayment where engagement_id == ${e1_id} and milestone_type == COMMENCEMENT has sequence_index == 0, percentage_bps == 3334, gross_amount_cents == 2500501, status == DUE"
            - "MilestonePayment where engagement_id == ${e1_id} and milestone_type == REWRITE_DELIVERY has sequence_index == 1, percentage_bps == 3333, gross_amount_cents == 2499750, status == SCHEDULED"
            - "MilestonePayment where engagement_id == ${e1_id} and milestone_type == PRODUCTION_BONUS has sequence_index == 2, percentage_bps == 3333, gross_amount_cents == 2499750, status == SCHEDULED"
            - "sum of gross_amount_cents over the three MilestonePayment rows == 7500001"
            - "Writer.${w1_id}.committed_fee_cents == 7500001"
            - "Writer.${w1_id}.paid_fee_cents == 0"
            - "DevelopmentProject.${proj_id}.committed_writer_fee_cents == 7500001"
            - "DevelopmentProject.${proj_id}.development_status == WRITING"

      - name: option_credit_cap_tier_keyed_on_escalated_price
        grounds:
          - calculations.option_net_purchase_due
          - entities.OptionAgreement.fields.escalation_bps
          - entities.OptionAgreement.fields.adjusted_purchase_price_cents
          - entities.DevelopmentProject.fields.budget_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order. The credit cap tier
          is keyed on the STEP-2 escalated price 103500000 (>= CREDIT_BAND_HIGH_MIN, so 5000 bps,
          cap 51750000, net 51750000); keying it on the raw 90000000 instead selects 7500 bps, caps
          at 77625000, credits the full 60000000 fee and yields 43500000 — a different, wrong number.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A CLEAR SCIFI property carries an ACTIVE option with option_fee_cents 60000000, purchase_price_cents 90000000, applicable_to_purchase true and NO linked project, so escalation_bps is 0, adjusted_purchase_price_cents is 90000000 and net_purchase_due_cents is 22500000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Orbital Decay", material_type: "BOOK", source_author_name: "P. Nakamura", genre: "SCIFI", logline: "A salvage crew inherits a station that is falling." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "CHAIN_OF_TITLE", executed_on: "2026-03-01", verified: true }
              as: BusinessAffairs
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "COPYRIGHT_CERT", executed_on: "2026-03-02", verified: true }
              as: BusinessAffairs
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "CLEARANCE_OPINION", executed_on: "2026-03-03", verified: true }
              as: BusinessAffairs
            - call: "GET /literary-properties/${p_id}"
              payload: {}
              as: BusinessAffairs
              captures: { p_v: "$.data.version" }
            - call: "POST /option-agreements"
              payload: { property_id: "${p_id}", expected_property_version: "${p_v}", option_fee_cents: 60000000, purchase_price_cents: 90000000, initial_period_months: 24, option_start_at: "2026-09-01T00:00:00Z", applicable_to_purchase: true }
              as: BusinessAffairs
              captures: { o_id: "$.data.id" }
            - call: "POST /option-agreements/${o_id}/execute"
              payload: {}
              as: BusinessAffairs
          trigger:
            - call: "POST /development-projects"
              payload: { property_id: "${p_id}", option_agreement_id: "${o_id}", budget_cents: 2000000000, slate_year: 2029 }
              as: DevelopmentExec
              as_user_id: "exec-beta"
              captures: { proj_id: "$.data.id" }
          assert:
            - "OptionAgreement.${o_id}.escalation_bps == 1500"
            - "OptionAgreement.${o_id}.adjusted_purchase_price_cents == 103500000"
            - "OptionAgreement.${o_id}.applicable_credit_cents == 51750000"
            - "OptionAgreement.${o_id}.net_purchase_due_cents == 51750000"
            - "OptionAgreement.${o_id}.applicable_credit_cents != 60000000"
            - "OptionAgreement.${o_id}.net_purchase_due_cents != 43500000"

      - name: reader_selection_rank_key_three_factor_genre_then_load
        grounds:
          - calculations.reader_selection_policy
          - entities.Reader.fields.active_assignment_count
          - entities.Reader.fields.weekly_capacity
          - entities.CoverageAssignment.fields.auto_selected
        distinguishing_aspect: |
          Mode (a) — a non-linear three-input ranking with conditional branching on entity state:
          genre_penalty (branch on specialty vs property genre) dominates load_ratio, which dominates
          completed_report_count, so the unloaded COMEDY reader RC (load 0.00) loses to the DRAMA
          freelancer RB (load 0.25) who in turn beats the DRAMA staffer RA (load 0.50).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Three readers all with weekly_capacity 4: RA (DRAMA, STAFF) holds two open assignments, RB (DRAMA, FREELANCE) holds one, RC (COMEDY, STAFF) holds none; all three have completed_report_count 0."
            - "A DRAMA property carries an INTAKE_CLEARED submission with no reader assigned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
