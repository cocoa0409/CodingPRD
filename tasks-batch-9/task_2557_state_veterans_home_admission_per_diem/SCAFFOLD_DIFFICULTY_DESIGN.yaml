      - name: one_open_claim_per_care_unit_month
        grounds:
          - validations[priority=80,ERR_CLAIM_PERIOD_OVERLAP]
          - errors.ERR_CLAIM_PERIOD_OVERLAP
          - state_machines.PerDiemClaim.SUBMITTED_to_REJECTED
          - entities.PerDiemClaim.fields.claim_month
        distinguishing_aspect: |
          A (care_unit_id, claim_month) pair is an exclusive temporal slot: while C1 occupies
          2026-08 in status DRAFT a second claim for the same unit-month must fail
          ERR_CLAIM_PERIOD_OVERLAP, and the slot only reopens once C1 leaves the occupying set by
          being REJECTED — at which point C2 is created and re-prices the full 31 released days.
          The overlap set is {DRAFT, SUBMITTED, PAID}, so a check that keys only on DRAFT or only on
          SUBMITTED admits a duplicate claim at one of the two moments tested here.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome and one CERTIFIED NURSING CareUnit with per_diem_rate_cents 11857."
            - "One Resident admitted 2026-08-01 with 31 RESIDENT_DAY CensusDay rows for August."
            - "The logical clock stands at 2026-09-01T00:00:00Z and one DRAFT claim C1 already occupies (unit, 2026-08)."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Rainy Lake State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
