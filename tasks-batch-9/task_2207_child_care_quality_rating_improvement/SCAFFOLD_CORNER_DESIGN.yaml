      - name: coach_user_id_mismatch_blocks_session_write_before_period_checks
        claim_type: peer_roles
        grounds:
          - validations[priority=4]
          - rbac.Coach
          - errors[ERR_NOT_RESOURCE_OWNER]
          - endpoints[POST /coaching-allocations/{coaching_allocation_id}/sessions]
        distinguishing_aspect: "A session write by Coach coach_2 against an allocation whose coach_user_id is coach_1 fails 403 ERR_NOT_RESOURCE_OWNER even though the requested window lies OUTSIDE the allocation period, so the priority-4 identity check pre-empts the priority-46 ERR_SESSION_OUTSIDE_ALLOCATION_PERIOD; the identical out-of-period window then does raise 422 for coach_1."
        test_recipe:
          setup:
            - "ENROLLED provider with an ACTIVE STATE_BASE allocation for coach_1 over 2026-08-03..2026-08-31, 10.0 hours; clock 2026-08-03."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Coach Fence", license_number: "LIC-6091", county_code: "DANE", region_code: "URBAN", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
            - { call: "POST /providers/${pid}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers/${pid}/coaching-allocations", payload: { coach_user_id: "coach_1", funding_source: "STATE_BASE", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-31T00:00:00Z", allocated_hours: 10.0, hourly_rate_cents: 5000 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { alid: $.data.id } }
            - { call: "POST /coaching-allocations/${alid}/accept", payload: {}, as: Provider, as_user_id: "${pid}" }
          trigger:
            - { call: "POST /coaching-allocations/${alid}/sessions", payload: { scheduled_start: "2026-09-07T09:00:00Z", scheduled_end: "2026-09-07T11:00:00Z" }, as: Coach, as_user_id: "coach_2" }
            - { call: "POST /coaching-allocations/${alid}/sessions", payload: { scheduled_start: "2026-09-07T09:00:00Z", scheduled_end: "2026-09-07T11:00:00Z" }, as: Coach, as_user_id: "coach_1" }
          assert:
            - "trigger 1 returns HTTP status == 403 with error.id == ERR_NOT_RESOURCE_OWNER"
            - "trigger 2 returns HTTP status == 422 with error.id == ERR_SESSION_OUTSIDE_ALLOCATION_PERIOD"
            - "CoachingAllocation.${alid}.status == ACTIVE, scheduled_hours == 0 and remaining_hours == 10.0"
            - "GET /coaching-sessions?coaching_allocation_id=${alid} returns total_count == 0"

      - name: staff_credential_creation_is_shared_but_provider_cannot_registry_link
        claim_type: shared_operations
        grounds:
          - rbac.Provider.shared_operations
          - rbac.StateAdministrator.exclusive_operations
          - endpoints[POST /providers/{provider_id}/staff-credentials]
          - endpoints[POST /staff-credentials/{credential_id}/registry-link]
        distinguishing_aspect: "The same POST /providers/{id}/staff-credentials body succeeds for both Provider and StateAdministrator (a genuinely shared operation), yet the Provider is refused 403 ERR_FORBIDDEN_ROLE on the registry-link of its own credential, leaving credential_compliance_pct at 0.00 until the administrator performs the link."
        test_recipe:
          setup:
            - "ENROLLED provider with active_staff_fte 2.00 and no credentials yet; clock 2026-08-03."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Shared Ops", license_number: "LIC-6101", county_code: "DANE", region_code: "URBAN", licensed_capacity: 40, active_staff_fte: 2.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
            - { call: "POST /providers/${pid}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /providers/${pid}/staff-credentials", payload: { staff_registry_id: "REG-P", role_type: "DIRECTOR", credential_level: 5, fte: 1.00, employment_status: "ACTIVE" }, as: Provider, as_user_id: "${pid}", captures: { credP: $.data.id } }
            - { call: "POST /providers/${pid}/staff-credentials", payload: { staff_registry_id: "REG-A", role_type: "LEAD_TEACHER", credential_level: 4, fte: 1.00, employment_status: "ACTIVE" }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { credA: $.data.id } }
            - { call: "POST /staff-credentials/${credP}/registry-link", payload: { registry_status: "VERIFIED", verified_on: "2026-08-03T00:00:00Z", expires_on: "2030-01-01T00:00:00Z", credential_level: 5 }, as: Provider, as_user_id: "${pid}" }
          assert:
            - "trigger 1 and trigger 2 both return HTTP status == 201 with StaffCredential registry_status == UNLINKED"
            - "trigger 3 returns HTTP status == 403 with error.id == ERR_FORBIDDEN_ROLE"
            - "StaffCredential.${credP}.registry_status is still UNLINKED and verified_on == null"
            - "Provider.${pid}.credential_compliance_pct == 0.00"
            - "GET /staff-credentials?provider_id=${pid}&registry_status=UNLINKED returns total_count == 2 with ids {${credP}, ${credA}}"

