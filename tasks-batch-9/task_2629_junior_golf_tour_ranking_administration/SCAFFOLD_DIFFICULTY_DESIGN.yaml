          PARALLEL shape - an Entry carries two independent status dimensions that advance on
          different triggers. Paying moves fee_status UNPAID/AID_PARTIAL -> PAID while entry_status
          stays ACCEPTED; submitting the first score moves entry_status ACCEPTED -> COMPETING while
          fee_status stays PAID. A single-dimension implementation that overwrites one status field
