  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: certification_packet_return_resubmit_cycle_rescores_completeness
        grounds:
          - state_machines.CertificationPacket.SUBMITTED_to_RETURNED
          - state_machines.CertificationPacket.RETURNED_to_SUBMITTED
          - calculations.certification_document_completeness_score
          - calculations.field_certification_status
          - entities.CertificationPacket.fields.return_count
          - validations[priority=15]
        distinguishing_aspect: |
          Cyclic shape: SUBMITTED -> RETURNED -> SUBMITTED re-enters a state the packet has
          already occupied, and the loop is not idempotent - each re-entry recomputes
          documentation_completeness_score from scratch, so completing one more programme
          task between the two submissions moves the score from 83.34 to 90.00 while
          return_count records the loop count as 1.
        test_recipe:
          setup:
            - "Exactly the state of certification_completeness_rounds_each_component_before_summation: SYNTHETIC_TURF field (infill 34.0), three certification-window tasks with only GROOMING COMPLETED, PASS impact/striping/goal assessments dated 2026-08-01T00:00:00Z, clock at 2026-08-02T00:00:00Z."
            - "A packet already SUBMITTED with documentation_completeness_score 83.34, submitted by the CertificationOfficer Cyril Okafor."
            - "A second CertificationOfficer, Noor Haddad, exists so the RETURN decision satisfies segregation of duties against both the submitter and the governing assessment's inspector."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Ines Vargas", roles: ["SafetyInspector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ins: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Tobias Lund", roles: ["TurfAgronomist"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_agr: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Cyril Okafor", roles: ["CertificationOfficer"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_cert: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Noor Haddad", roles: ["CertificationOfficer"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_cert2: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_sy}", assigned_staff_member_id: "${s_agr}", task_type: "GROOMING", scheduled_start_utc: "2026-08-01T06:00:00Z", scheduled_end_utc: "2026-08-01T07:00:00Z", planned_for_certification_window: true }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t_groom: $.data.id }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_sy}", assigned_staff_member_id: "${s_agr}", task_type: "INFILL_REDISTRIBUTION", scheduled_start_utc: "2026-08-01T08:00:00Z", scheduled_end_utc: "2026-08-01T09:00:00Z", planned_for_certification_window: true }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t_infill: $.data.id }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_sy}", assigned_staff_member_id: "${s_agr}", task_type: "SEAM_INSPECTION", scheduled_start_utc: "2026-08-01T10:00:00Z", scheduled_end_utc: "2026-08-01T11:00:00Z", planned_for_certification_window: true }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_sy}", inspector_staff_member_id: "${s_ins}", assessment_type: "IMPACT_ATTENUATION", assessed_at_utc: "2026-08-01T00:00:00Z", gmax_readings: [120.0, 120.0, 120.0] }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { a_imp: $.data.id }
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_sy}", inspector_staff_member_id: "${s_ins}", assessment_type: "STRIPING_LAYOUT", assessed_at_utc: "2026-08-01T00:00:00Z", declared_result: "PASS" }
              as: SafetyInspector
              as_user_id: "${s_ins}"
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_sy}", inspector_staff_member_id: "${s_ins}", assessment_type: "GOAL_ANCHORING", assessed_at_utc: "2026-08-01T00:00:00Z", declared_result: "PASS" }
              as: SafetyInspector
              as_user_id: "${s_ins}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/maintenance-tasks/${t_groom}/transition"
              payload: { action: "START" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
            - call: "POST /turf/maintenance-tasks/${t_groom}/transition"
              payload: { action: "COMPLETE", completed_at_utc: "2026-08-01T07:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
            - call: "GET /turf/fields/${f_sy}"
              payload: {}
              as: CertificationOfficer
              as_user_id: "${s_cert}"
              captures: { f_sy_ver: $.data.version }
            - call: "POST /turf/certification-packets"
              payload: { field_id: "${f_sy}", governing_assessment_id: "${a_imp}", competition_season_label: "2026-FALL", expected_field_version: "${f_sy_ver}" }
              as: CertificationOfficer
              as_user_id: "${s_cert}"
              captures: { pkt: $.data.id }
            - call: "POST /turf/certification-packets/${pkt}/submit"
              payload: { submitted_by_staff_member_id: "${s_cert}" }
              as: CertificationOfficer
              as_user_id: "${s_cert}"
              captures: { score_first: $.data.documentation_completeness_score }
          trigger:
            - call: "POST /turf/certification-packets/${pkt}/decide"
              payload: { decision: "RETURN", decided_by_staff_member_id: "${s_cert2}", decision_notes: "Programme evidence incomplete for the window." }
              as: CertificationOfficer
              as_user_id: "${s_cert2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/maintenance-tasks/${t_infill}/transition"
              payload: { action: "START" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
            - call: "POST /turf/maintenance-tasks/${t_infill}/transition"
              payload: { action: "COMPLETE", completed_at_utc: "2026-08-01T09:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
            - call: "POST /turf/certification-packets/${pkt}/submit"
              payload: { submitted_by_staff_member_id: "${s_cert}" }
              as: CertificationOfficer
              as_user_id: "${s_cert}"
              captures: { score_second: $.data.documentation_completeness_score }
          assert:
            - "immediately after the RETURN decision CertificationPacket.${pkt}.status == \"RETURNED\", CertificationPacket.${pkt}.return_count == 1 and Field.${f_sy}.certification_status == \"NOT_CERTIFIED\""
            - "after the resubmission CertificationPacket.${pkt}.status == \"SUBMITTED\" - the packet has re-entered a state it previously occupied"
            - "CertificationPacket.${pkt}.documentation_completeness_score == 90.00 on the second submission, up from 83.34 on the first"
            - "CertificationPacket.${pkt}.return_count == 1 after the resubmission - resubmitting does not reset the loop counter"
            - "Field.${f_sy}.certification_status == \"PENDING_REVIEW\" after the resubmission"
            - "POST /turf/certification-packets/${pkt}/decide with decision APPROVE and decided_by_staff_member_id ${s_cert2} now returns 200 because 90.00 >= MIN_CERTIFICATION_COMPLETENESS_SCORE 90.00, and Field.${f_sy}.certified_until_utc == \"2027-08-03T00:00:00Z\""

      - name: replacement_plan_funding_and_disposal_axes_advance_independently
        grounds:
          - state_machines.ReplacementPlan.PENDING_to_MANIFESTED
          - state_machines.ReplacementPlan.DRAFT_to_SUBMITTED
          - validations[priority=47]
          - errors[ERR_DISPOSAL_COMPLETION_NOT_PERMITTED]
          - entities.ReplacementPlan.fields.diversion_ratio
        distinguishing_aspect: |
          Parallel shape: ReplacementPlan carries two independent state dimensions.
          disposal_status advances PENDING -> MANIFESTED while funding_status is still DRAFT
          (the manifest endpoint never reads funding_status), and funding_status advances
          DRAFT -> SUBMITTED while disposal_status stays MANIFESTED - yet the single
          cross-axis guard on /complete refuses the combination (MANIFESTED, not APPROVED).
        test_recipe:
          setup:
            - "One SYNTHETIC_TURF field installed 2016-06-01, expected_life_years 10, area 70000, infill_depth_mm 34.0, warranty_expires_on 2024-06-01."
            - "One OPEN CapitalBudget for fiscal_year 2027 with total_authorized_amount_cents 5825556."
            - "One ReplacementPlan on that field, area 70000, target SYNTHETIC_TURF, basis CONDITION_RISK: funding_status DRAFT, disposal_status PENDING, plan_funding_amount_cents 5243000."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
            - call: "POST /turf/capital-budgets"
              payload: { fiscal_year: 2027, total_authorized_amount_cents: 5825556 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { bud: $.data.id }
            - call: "GET /turf/fields/${f_sy}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy_ver: $.data.version }
            - call: "POST /turf/replacement-plans"
              payload: { field_id: "${f_sy}", capital_budget_id: "${bud}", target_surface_type: "SYNTHETIC_TURF", area_sq_ft: 70000, priority_basis: "CONDITION_RISK", planned_install_year: 2028, expected_field_version: "${f_sy_ver}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /turf/replacement-plans/${p1}/disposal-manifest"
              payload: { manifest_reference: "MAN-2027-0001", disposal_facility_name: "Rivergate Polymer Recovery", diverted_tonnage: 46.0, total_tonnage: 50.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/replacement-plans/${p1}/complete"
              payload: { completed_at_utc: "2026-08-01T12:00:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/replacement-plans/${p1}/submit"
              payload: { submitted_by_staff_member_id: "${s_dir}" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
          assert:
            - "after the manifest call ReplacementPlan.${p1}.disposal_status == \"MANIFESTED\" while ReplacementPlan.${p1}.funding_status is still \"DRAFT\""
            - "ReplacementPlan.${p1}.diversion_ratio == 0.92 and ReplacementPlan.${p1}.manifest_reference == \"MAN-2027-0001\""
            - "the /complete call returns 409 with error_id \"ERR_DISPOSAL_COMPLETION_NOT_PERMITTED\" - the only cross-axis guard in the machine"
            - "after the failed /complete ReplacementPlan.${p1}.disposal_status is still \"MANIFESTED\" and Field.${f_sy}.retired_at is null"
            - "after the submit call ReplacementPlan.${p1}.funding_status == \"SUBMITTED\" and ReplacementPlan.${p1}.disposal_status is still \"MANIFESTED\" - the funding axis moved without disturbing the disposal axis"
            - "CapitalBudget.${bud}.committed_amount_cents == 0 - neither axis commits capital before an APPROVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: failed_impact_test_cascades_through_order_posture_booking_to_ledger
        grounds:
          - calculations.impact_attenuation_result
          - calculations.field_play_status
          - state_machines.Field.OPEN_to_CLOSED_UNSAFE
          - state_machines.UsageBooking.CONFIRMED_to_CANCELLED_UNSAFE
          - entities.RemediationOrder.fields.severity
          - entities.UsageLedgerEntry.fields.entry_type
          - entities.Field.fields.unsafe_cancellation_count
        distinguishing_aspect: |
          Depth 5, each hop strictly caused by the previous one: (A) recording an
          IMPACT_ATTENUATION assessment whose mean is 210.0 yields result FAIL, which (B)
          opens a MANDATORY RemediationOrder, which (C) drives
          Field.open_mandatory_remediation_count to 1 and therefore play_status to
          CLOSED_UNSAFE, which (D) cancels the field's future CONFIRMED booking as
          CANCELLED_UNSAFE, which (E) appends an UNSAFE_CANCELLATION UsageLedgerEntry and
          increments Field.unsafe_cancellation_count.
        test_recipe:
          setup:
            - "One NATURAL_GRASS field installed 2018-04-15, expected_life_years 12, area 80000, sanctioned_level STATE, warranty_expires_on 2026-04-15, play_status OPEN, cumulative_wear_units 0.00."
            - "One UsageBooking for PRACTICE 2026-08-05T19:00:00Z to 2026-08-05T21:00:00Z, 30 participants, CONFIRMED at the default clock 2026-08-01T00:00:00Z (so its window_start_utc is still in the future)."
            - "No RemediationOrder exists yet on the field."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Priya Raman", roles: ["FieldOperationsCoordinator"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ops: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Ines Vargas", roles: ["SafetyInspector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ins: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Main 1", surface_type: "NATURAL_GRASS", installed_on_date: "2018-04-15", expected_life_years: 12, area_sq_ft: 80000, sanctioned_level: "STATE", warranty_expires_on: "2026-04-15" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_ng: $.data.id }
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_ng}", requested_by_staff_member_id: "${s_ops}", activity_type: "PRACTICE", window_start_utc: "2026-08-05T19:00:00Z", window_end_utc: "2026-08-05T21:00:00Z", expected_participant_count: 30 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { b1: $.data.id }
            - call: "POST /turf/usage-bookings/${b1}/confirm"
              payload: {}
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
          trigger:
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_ng}", inspector_staff_member_id: "${s_ins}", assessment_type: "IMPACT_ATTENUATION", assessed_at_utc: "2026-08-01T00:00:00Z", gmax_readings: [210.0, 210.0, 210.0] }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { a_fail: $.data.id, mean: $.data.gmax_mean_value }
            - call: "GET /turf/remediation-orders"
              payload: { field_id: "${f_ng}" }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { ord1: "$.data[0].id", ord1_sev: "$.data[0].severity" }
            - call: "GET /turf/usage-ledger-entries"
              payload: { booking_id: "${b1}" }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { led1: "$.data[0].id", led1_type: "$.data[0].entry_type" }
          assert:
            - "hop A: SafetyAssessment.${a_fail}.gmax_mean_value == 210.0 and SafetyAssessment.${a_fail}.result == \"FAIL\""
            - "hop B: RemediationOrder.${ord1}.severity == \"MANDATORY\", RemediationOrder.${ord1}.status == \"OPEN\", RemediationOrder.${ord1}.source_assessment_id == ${a_fail}"
            - "hop C: Field.${f_ng}.open_mandatory_remediation_count == 1 and Field.${f_ng}.play_status == \"CLOSED_UNSAFE\""
            - "hop D: UsageBooking.${b1}.status == \"CANCELLED_UNSAFE\""
            - "hop E: UsageLedgerEntry.${led1}.entry_type == \"UNSAFE_CANCELLATION\", UsageLedgerEntry.${led1}.wear_units_delta == 0.00, UsageLedgerEntry.${led1}.running_balance_after == 0.00"
            - "hop E: Field.${f_ng}.unsafe_cancellation_count == 1"
            - "Field.${f_ng}.cumulative_wear_units == 0.00 and Field.${f_ng}.rest_debt_hours == 0.00 - an unsafe cancellation costs no wear and opens no rest window"
            - "Field.${f_ng}.latest_gmax_mean_value == 210.0 and Field.${f_ng}.condition_index_agronomic == 50.00"

      - name: plan_approval_cascades_budget_commitment_lock_to_sibling_deferral
        grounds:
          - calculations.capital_budget_commitment
          - state_machines.CapitalBudget.OPEN_to_LOCKED
          - state_machines.ReplacementPlan.SUBMITTED_to_APPROVED
          - state_machines.ReplacementPlan.DRAFT_to_DEFERRED
          - validations[priority=15]
        distinguishing_aspect: |
          Depth 4 and a different cascade axis from the safety chain - money rather than
          posture: (A) approving a plan (B) raises CapitalBudget.committed_amount_cents to
          5243000, which (C) reaches lock_threshold_amount_cents 5243000 and flips the
          budget OPEN -> LOCKED, which (D) defers the unrelated sibling DRAFT plan on the
          same budget to DEFERRED. Hop D touches an entity the trigger never named.
        test_recipe:
          setup:
            - "Logical clock left at its default 2026-08-01T00:00:00Z."
            - "One SYNTHETIC_TURF field installed 2016-06-01, expected_life_years 10, area 70000, infill_depth_mm 34.0, warranty_expires_on 2024-06-01 - no impact test recorded, so condition_index_agronomic is 65.00 and the CONDITION_RISK score is 36.00 (above MIN_APPROVAL_PRIORITY_SCORE 20.00)."
            - "One NATURAL_GRASS field installed 2025-08-01, expected_life_years 12, area 60000, warranty_expires_on 2030-08-01, sanctioned_level LOCAL."
            - "One OPEN CapitalBudget for fiscal_year 2027 with total_authorized_amount_cents 5825556, so lock_threshold_amount_cents is 5243000."
            - "Plan P1 on the synthetic field: area 70000, target SYNTHETIC_TURF, basis CONDITION_RISK, plan_funding_amount_cents 5243000, SUBMITTED by Dana Reyes."
            - "Plan P2 on the natural-grass field: area 60000, target NATURAL_GRASS, basis REMAINING_LIFE, plan_funding_amount_cents 1452000, left in DRAFT."
            - "A second FacilitiesDirector, Marcus Hale, will make the decision so segregation of duties is satisfied."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Marcus Hale", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_dir2: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
