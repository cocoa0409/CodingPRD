      - name: fee_recommendation_low_tier_applies_six_percent_surcharge
        claim_type: Variant Selection
        grounds:
          - calculations.fee_rate_recommendation.formula
          - endpoints["GET /state-programs/{id}/fee-adequacy"]
        distinguishing_aspect: "A program whose pre-surcharge base is 400c (<= 800) takes the 6% administrative tier, so the computed read reports 424c with band [339, 509] instead of the 4% tier's 416c."
        test_recipe:
          setup:
            - "OR program: forecast cost 24000000c, 60000 units, no other revenue, 3-month reserve target, opening reserve 6000000c (exactly the target, so reserve_gap_cents is 0)."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "OR", program_name: "Oregon Mattress Stewardship Program", forecast_annual_cost_cents: 24000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 0, reserve_target_months: 3, reserve_opening_cents: 6000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
