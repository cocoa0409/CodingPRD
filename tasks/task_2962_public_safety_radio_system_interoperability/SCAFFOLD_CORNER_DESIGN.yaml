              payload: { name: "Locked Talkgroup Police", agency_code: "TLK01", agency_type: "LAW", interop_privilege: "PATCH_AUTHORITY", recorder_retention_days: 180 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_tlk_id: "$.data.id" }
