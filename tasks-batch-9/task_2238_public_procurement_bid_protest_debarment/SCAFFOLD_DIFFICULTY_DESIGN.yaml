          assert:
            - "the trigger returns HTTP 409 with $.data.error_id == ERR_HEARING_ROOM_CONFLICT"
            - "the error is NOT ERR_OFFICER_DOCKET_CAPACITY_EXCEEDED: 120 + 60 == 180 minutes is far below the 480 ceiling, so only the room axis is violated"
            - "the error is NOT ERR_HEARING_OFFICER_CONFLICT: U-HEARING-1 is not the issuing officer U-OFFICER-1 of either solicitation"
            - "GET /procurement/protests/${p11_id}/hearings returns an empty list"
            - "Protest.${p11_id}.status == UNDER_REVIEW (unchanged)"
            - "ProtestHearing.${h6_id}.status == SCHEDULED, room_code == ROOM-A, scheduled_end_utc == 2026-08-28T11:00:00Z (untouched)"

      - name: vendor_compliance_docket_rejects_a_notice_at_exactly_the_prior_resolution_instant
        grounds:
          - validations[priority=37]
          - errors[ERR_ACTIVE_PROCEEDING_EXISTS]
          - entities.DebarmentProceeding.fields.notice_issued_at_utc
          - entities.DebarmentProceeding.fields.decided_at_utc
          - state_machines.DebarmentProceeding.HEARING_HELD_to_DISMISSED
          - endpoints[POST /procurement/debarment-proceedings]
        distinguishing_aspect: |
          A DIFFERENT contended resource (the respondent Vendor's compliance docket, not a
          hearing room) with DIFFERENT interval semantics: an AGGREGATE CLOSED-interval
          containment test of a single instant against [notice_issued_at_utc,
          occupancy_end_utc] where occupancy_end_utc for a DISMISSED proceeding is its
          decided_at_utc. Because both endpoints are inclusive and no buffer applies, a
          notice issued at exactly the dismissal instant is still inside the interval.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V21, initially ELIGIBLE with debarment_strike_count 0"
            - "DebarmentProceeding D5 on V21 created at 2026-08-01T00:00:00Z with cause_code FRAUD, aggravating_factor_codes [FRAUD] (interim severity 40.00) and interim_suspension true, so notice_issued_at_utc is 2026-08-01T00:00:00Z and response_deadline_utc is 2026-08-15T00:00:00Z"
            - "the clock advances to 2026-08-16T00:00:00Z and the default-branch hearing is recorded, moving D5 to HEARING_HELD"
            - "the clock advances to exactly 2026-08-20T00:00:00Z and the DebarmentAuthority decides DISMISSED, so D5.decided_at_utc is 2026-08-20T00:00:00Z, V21 returns to ELIGIBLE and D5's occupancy interval is the closed [2026-08-01T00:00:00Z, 2026-08-20T00:00:00Z]"
            - "the clock is NOT advanced past the dismissal, so the second notice would be stamped at exactly the closed interval's upper endpoint"
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Ironwood Signal Contractors", tax_id: "100000021", contact_email: "v21@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { v21_id: $.data.id }
            - call: "POST /procurement/debarment-proceedings"
              payload: { vendor_id: "${v21_id}", cause_code: "FRAUD", aggravating_factor_codes: ["FRAUD"], mitigating_factor_codes: [], interim_suspension: true }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
              captures: { d5_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/debarment-proceedings/${d5_id}/hearing"
              payload: { hearing_summary: "respondent did not appear; record closed on the documentary submissions" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/debarment-proceedings/${d5_id}/decision"
              payload: { outcome: "DISMISSED", rationale: "the invoicing discrepancy was a clerical error, not a misrepresentation" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
          trigger:
            - call: "POST /procurement/debarment-proceedings"
              payload: { vendor_id: "${v21_id}", cause_code: "REPEATED_NONPERFORMANCE", aggravating_factor_codes: ["REPEATED_NONPERFORMANCE"], mitigating_factor_codes: [], interim_suspension: false }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
          assert:
            - "the trigger returns HTTP 409 with $.data.error_id == ERR_ACTIVE_PROCEEDING_EXISTS"
            - "the error is NOT ERR_VENDOR_ALREADY_DEBARRED: V21's eligibility_status is ELIGIBLE at the moment of the second notice"
            - "GET /procurement/debarment-proceedings?vendor_id=${v21_id} returns exactly one row, ${d5_id}"
            - "DebarmentProceeding.${d5_id}.status == DISMISSED, decided_at_utc == 2026-08-20T00:00:00Z, notice_issued_at_utc == 2026-08-01T00:00:00Z"
            - "DebarmentProceeding.${d5_id}.interim_status == INTERIM_LIFTED and strikes_applied == 0"
            - "Vendor.${v21_id}.eligibility_status == ELIGIBLE, debarment_strike_count == 0, active_debarment_id == null"

  - rule_id: compensating_invariant
    instances:
      - name: protest_fee_ledger_is_conserved_across_a_withdrawal
        grounds:
          - state_machines.Protest.FILED_to_WITHDRAWN
          - calculations.protest_filing_fee_cents
          - entities.Vendor.fields.protest_fee_balance_cents
          - entities.Solicitation.fields.protest_escrow_cents
          - entities.Protest.fields.fee_refunded_cents
          - endpoints[POST /procurement/protests/{id}/withdraw]
        distinguishing_aspect: |
          The conserved quantity is MONEY: Vendor.protest_fee_balance_cents +
          Solicitation.protest_escrow_cents must equal the 100000 cents deposited, before
          the filing, after the filing (64362 + 35638) and again after the withdrawal
          (100000 + 0). The withdrawal is the compensating action for the filing debit and
          must leave the ledger with zero drift.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V22 with a single fee deposit of 100000 cents, so protest_fee_balance_cents is 100000 and the ledger total is 100000"
            - "one Solicitation S18 with estimated_value_cents 10000000 in status ISSUED, issued by U-OFFICER-1, original_bid_due_utc 2026-08-27T00:00:00Z, protest_escrow_cents 0"
            - "V22 filed one PENDING QuestionSubmission on S18, giving it PROSPECTIVE_BIDDER standing for SOLICITATION_IMPROPRIETY"
            - "Protest P12 filed by V22 at 2026-08-01T00:00:00Z with filing_fee_cents 35638, so V22's balance is 64362, S18.protest_escrow_cents is 35638, P12.fee_refunded_cents is 0 and stay_status is ACTIVE"
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Oakhurst Guardrail", tax_id: "100000022", contact_email: "v22@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { v22_id: $.data.id }
            - call: "POST /procurement/vendors/${v22_id}/fee-deposits"
              payload: { amount_cents: 100000 }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-CI1"
                title: "Guardrail End Terminal Upgrade"
                issuing_agency_code: "DOT"
                estimated_value_cents: 10000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-MASH", description: "MASH TL-3 tested terminal", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { s18_id: $.data.id }
            - call: "POST /procurement/solicitations/${s18_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "POST /procurement/solicitations/${s18_id}/questions"
              payload: { vendor_id: "${v22_id}", question_text: "will an equivalent MASH TL-3 terminal be accepted?" }
              as: Vendor
              as_user_id: "${v22_id}"
            - call: "POST /procurement/protests"
              payload: { solicitation_id: "${s18_id}", protester_vendor_id: "${v22_id}", grounds_code: "SOLICITATION_IMPROPRIETY", narrative: "the named terminal is a single proprietary product" }
              as: Vendor
              as_user_id: "${v22_id}"
              captures: { p12_id: $.data.id }
          trigger:
            - call: "POST /procurement/protests/${p12_id}/withdraw"
              payload: { withdrawal_reason: "the agency issued an addendum permitting equivalents" }
              as: Vendor
              as_user_id: "${v22_id}"
          assert:
            - "before the trigger the invariant held in its debited form: Vendor.${v22_id}.protest_fee_balance_cents == 64362 and Solicitation.${s18_id}.protest_escrow_cents == 35638, summing to 100000"
            - "after the trigger Vendor.${v22_id}.protest_fee_balance_cents == 100000 and Solicitation.${s18_id}.protest_escrow_cents == 0, summing to 100000 with zero drift"
            - "Protest.${p12_id}.status == WITHDRAWN, stay_status == LIFTED, fee_refunded_cents == 35638, filing_fee_cents == 35638"
            - "Protest.${p12_id}.decision_outcome == null and remedy_code == null: a withdrawal is not a decision on the merits"
            - "Solicitation.${s18_id}.status == ISSUED (the compensation touched only the ledger, not the solicitation lifecycle)"
            - "the refunded amount equals the filed amount exactly: fee_refunded_cents - filing_fee_cents == 0"

      - name: debarment_strike_count_is_conserved_across_an_interim_suspension_dismissal
        grounds:
          - state_machines.DebarmentProceeding.HEARING_HELD_to_DISMISSED
          - state_machines.Vendor.SUSPENDED_to_ELIGIBLE
          - entities.Vendor.fields.debarment_strike_count
          - entities.DebarmentProceeding.fields.strikes_applied
          - entities.DebarmentProceeding.fields.interim_status
        distinguishing_aspect: |
          A DIFFERENT conserved quantity from the money ledger: the strike ledger, where
          Vendor.debarment_strike_count must always equal the SUM of strikes_applied over
          that vendor's proceedings. The interim suspension credits one strike, the
          dismissal must debit exactly that one strike back, and the identity must hold at
          1 == 1 before and 0 == 0 after, with active_debarment_id and
          suspension_reason_code both cleared.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V23 with eligibility_status ELIGIBLE and debarment_strike_count 0, so the strike identity starts at 0 == sum of an empty set"
            - "DebarmentProceeding D6 on V23 with cause_code FRAUD, aggravating_factor_codes [FRAUD] (interim severity 40.00 >= INTERIM_THRESHOLD 35) and interim_suspension true, which sets D6.interim_status INTERIM_SUSPENDED, D6.strikes_applied 1 and drives V23 to SUSPENDED with debarment_strike_count 1"
            - "the clock advances to 2026-08-16T00:00:00Z, past D6.response_deadline_utc 2026-08-15T00:00:00Z, and the default-branch hearing is recorded, moving D6 to HEARING_HELD without disturbing either strike field"
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Sablewood Mechanical", tax_id: "100000023", contact_email: "v23@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { v23_id: $.data.id }
            - call: "POST /procurement/debarment-proceedings"
              payload: { vendor_id: "${v23_id}", cause_code: "FRAUD", aggravating_factor_codes: ["FRAUD"], mitigating_factor_codes: [], interim_suspension: true }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
              captures: { d6_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/debarment-proceedings/${d6_id}/hearing"
              payload: { hearing_summary: "respondent appeared and rebutted the certification allegation" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
          trigger:
            - call: "POST /procurement/debarment-proceedings/${d6_id}/decision"
              payload: { outcome: "DISMISSED", rationale: "the allegation was not established by a preponderance of the record" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
          assert:
            - "before the trigger the strike identity held at one: DebarmentProceeding.${d6_id}.strikes_applied == 1 and Vendor.${v23_id}.debarment_strike_count == 1"
            - "after the trigger DebarmentProceeding.${d6_id}.strikes_applied == 0 and Vendor.${v23_id}.debarment_strike_count == 0, so the identity holds again with no residual strike"
            - "DebarmentProceeding.${d6_id}.status == DISMISSED, interim_status == INTERIM_LIFTED, decided_at_utc == 2026-08-16T00:00:00Z"
            - "DebarmentProceeding.${d6_id}.debarment_period_months == 0, debarment_start_utc == null, debarment_end_utc == null"
            - "Vendor.${v23_id}.eligibility_status == ELIGIBLE, active_debarment_id == null, suspension_reason_code == null, reinstatement_earliest_petition_utc == null"
            - "GET /procurement/debarred-vendors does not include ${v23_id}"
