            - call: "POST /trades/${t_r2}/price"
              payload: {}
              as: TransferAgentOperator
          assert:
            - "the purchase capture returns HTTP 409 with error_id ERR_ACCOUNT_RESTRICTED"
            - "ShareholderAccount.${acc_r}.status == RESTRICTED"
            - "the redemption capture returns HTTP 201 and Trade.${t_r2}.execution_status == RECEIVED"
            - "Trade.${t_r2}.trade_date == 2026-08-04"
            - "Trade.${t_r2}.gross_proceeds_amount == 1100.00"
            - "Trade.${t_r2}.cdsc_amount == 0.00 and net_proceeds_amount == 1100.00"
            - "Trade.${t_r2}.shares_transacted == -100.000"
            - "BlueSkyRegistration.${bs_ca}.consumed_amount == 60000.00 (the redemption restores no capacity)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: blue_sky_windows_are_half_open_so_touching_endpoints_do_not_collide
        grounds:
          - "validations[priority=110]"
          - errors[ERR_BLUE_SKY_WINDOW_OVERLAP]
          - entities.BlueSkyRegistration.fields.effective_date
          - entities.BlueSkyRegistration.fields.expiration_date
        distinguishing_aspect: |
          The occupied resource is a BlueSkyRegistration window and the interval arithmetic is HALF-OPEN:
          a new window starting exactly on the incumbent's expiration_date 2026-09-01 is accepted, while a
          window starting 2026-08-15 inside the incumbent is rejected.
        test_recipe:
          setup:
            - "Class A exists with one CA registration covering [2026-01-01, 2026-09-01) for 400000.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER", cutoff_time_utc: "16:00:00" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}], cdsc_enabled: false }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 400000.00, effective_date: "2026-01-01", expiration_date: "2026-09-01" }
              as: ComplianceOfficer
              captures: { bs_first: $.data.id }
          trigger:
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 600000.00, effective_date: "2026-09-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_adjacent: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 100000.00, effective_date: "2026-08-15", expiration_date: "2026-12-01" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "the adjacent filing returns HTTP 201 and BlueSkyRegistration.${bs_adjacent}.status == ACTIVE"
            - "BlueSkyRegistration.${bs_adjacent}.remaining_amount == 600000.00"
            - "the overlapping filing returns HTTP 409 with error_id ERR_BLUE_SKY_WINDOW_OVERLAP"
            - "exactly two BlueSkyRegistration rows exist for class ${sc_a} and state CA"

      - name: distribution_periods_are_closed_so_touching_endpoints_do_collide
        grounds:
          - "validations[priority=112]"
          - errors[ERR_DISTRIBUTION_PERIOD_OVERLAP]
          - entities.Distribution.fields.record_date
          - entities.Distribution.fields.pay_date
          - entities.Distribution.fields.distribution_type
        distinguishing_aspect: |
          A different occupied resource, the Distribution period on a share class, with the OPPOSITE
          interval arithmetic: the interval is CLOSED, so a new declaration whose record_date 2026-08-14
          equals the incumbent's pay_date 2026-08-14 IS an intersection and is rejected, while the same
          dates under a different distribution_type are accepted.
        test_recipe:
          setup:
            - "Class A exists with one ORDINARY_INCOME declaration covering record 2026-08-10 through pay 2026-08-14."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER", cutoff_time_utc: "16:00:00" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}], cdsc_enabled: false }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /distributions"
              payload: { share_class_id: "${sc_a}", distribution_type: "ORDINARY_INCOME", rate_per_share: 0.1000, record_date: "2026-08-10", ex_date: "2026-08-11", pay_date: "2026-08-14" }
              as: FundAccountant
              captures: { dist_first: $.data.id }
          trigger:
            - call: "POST /distributions"
              payload: { share_class_id: "${sc_a}", distribution_type: "ORDINARY_INCOME", rate_per_share: 0.0500, record_date: "2026-08-14", ex_date: "2026-08-17", pay_date: "2026-08-18" }
              as: FundAccountant
              captures: { err_id: $.data.error_id }
            - call: "POST /distributions"
              payload: { share_class_id: "${sc_a}", distribution_type: "LONG_TERM_CAPITAL_GAIN", rate_per_share: 0.2500, record_date: "2026-08-10", ex_date: "2026-08-11", pay_date: "2026-08-14" }
              as: FundAccountant
              captures: { dist_other_type: $.data.id }
            - call: "POST /distributions"
              payload: { share_class_id: "${sc_a}", distribution_type: "ORDINARY_INCOME", rate_per_share: 0.0500, record_date: "2026-08-17", ex_date: "2026-08-18", pay_date: "2026-08-19" }
              as: FundAccountant
              captures: { dist_disjoint: $.data.id }
          assert:
            - "the touching same-type declaration returns HTTP 409 with error_id ERR_DISTRIBUTION_PERIOD_OVERLAP"
            - "the identical-window declaration of a different distribution_type returns HTTP 201 and Distribution.${dist_other_type}.status == DECLARED"
            - "the disjoint same-type declaration starting 2026-08-17 returns HTTP 201 and Distribution.${dist_disjoint}.status == DECLARED"
            - "exactly three Distribution rows exist for class ${sc_a}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: trade_reversal_conserves_class_share_balance_against_ledger_sum
        grounds:
          - state_machines.Trade.SETTLED_to_REVERSED
          - entities.ShareClass.fields.total_shares_outstanding
          - entities.Position.fields.shares
          - entities.ShareLedgerEntry.fields.share_delta
          - entities.ShareLedgerEntry.fields.resulting_share_balance
        distinguishing_aspect: |
          The conserved quantity is a SHARE quantity: ShareClass.total_shares_outstanding must equal both
          the sum of Position.shares and the sum of ShareLedgerEntry.share_delta over that class at every
          step, so settling 5730.000 plus 2356.250 and then reversing the 5730.000 leg must land on exactly
          2356.250 with zero drift.
        test_recipe:
          setup:
            - "Class A, CA registration of 1000000.00, NAV 2026-08-03 at the 10.0000 seed and FINAL."
            - "Account M holds 5730.000 shares from a settled 60000.00 purchase and account N holds 2356.250 shares from a settled 25000.00 purchase."
            - "ShareClass.total_shares_outstanding is 8086.250 before the reversal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER", cutoff_time_utc: "16:00:00" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}, {min_qualifying_amount: 50000, load_pct: 0.045}], cdsc_enabled: false }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "121-21-2121", primary_owner_name: "Mona Main", dividend_option: "CASH" }
              as: TransferAgentOperator
              captures: { acc_m: $.data.id }
            - call: "POST /shareholder-accounts/${acc_m}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "131-31-3131", primary_owner_name: "Ned Neighbour", dividend_option: "CASH" }
              as: TransferAgentOperator
              captures: { acc_n: $.data.id }
            - call: "POST /shareholder-accounts/${acc_n}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /trades"
              payload: { account_id: "${acc_m}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 60000.00 }
              as: TransferAgentOperator
              captures: { t_m: $.data.id }
            - call: "POST /trades/${t_m}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_m}/settle"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades"
              payload: { account_id: "${acc_n}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 25000.00 }
              as: TransferAgentOperator
              captures: { t_n: $.data.id }
            - call: "POST /trades/${t_n}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_n}/settle"
              payload: {}
              as: TransferAgentOperator
          trigger:
            - call: "POST /trades/${t_m}/reverse"
              payload: { reversal_reason: "Order booked to the wrong registration" }
              as: ComplianceOfficer
          assert:
            - "ShareClass.${sc_a}.total_shares_outstanding == 8086.250 immediately before the reversal"
            - "ShareClass.${sc_a}.total_shares_outstanding == 2356.250 after the reversal"
            - "the Position of account ${acc_m} has shares == 0.000 and cost_basis_amount == 0.00"
            - "the Position of account ${acc_n} has shares == 2356.250 and cost_basis_amount == 25000.00"
            - "exactly two ShareLedgerEntry rows reference the Position of account ${acc_m}: one PURCHASE_SETTLEMENT with share_delta 5730.000 and resulting_share_balance 5730.000, and one TRADE_REVERSAL with share_delta -5730.000 and resulting_share_balance 0.000"
            - "the sum of share_delta over every ShareLedgerEntry of class ${sc_a} equals 2356.250, which equals ShareClass.${sc_a}.total_shares_outstanding"
            - "Trade.${t_m}.settlement_status == REVERSED and Trade.${t_m}.execution_status == PRICED_FINAL"

      - name: capture_settle_cancel_reverse_conserve_registration_capacity_identity
        grounds:
          - calculations.blue_sky_capacity_ledger
          - state_machines.BlueSkyRegistration.ACTIVE_to_EXHAUSTED
          - state_machines.BlueSkyRegistration.EXHAUSTED_to_ACTIVE
          - state_machines.Trade.RECEIVED_to_CANCELLED
          - entities.BlueSkyRegistration.fields.remaining_amount
        distinguishing_aspect: |
          A different kind of conserved quantity, DOLLARS of state registration capacity rather than
          shares: registered_amount == remaining_amount + reserved_amount + consumed_amount must hold after
          every capture, settlement, cancellation and reversal, and the 50000.00 registration must return
          to remaining 50000.00 with reserved and consumed both 0.00.
        test_recipe:
          setup:
            - "Class A with an NV registration of exactly 50000.00 and nothing reserved or consumed."
            - "Account V is DIRECT/NV and ACTIVE with no holdings."
            - "NAV 2026-08-03 exists at the 10.0000 seed and is FINAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER", cutoff_time_utc: "16:00:00" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}, {min_qualifying_amount: 50000, load_pct: 0.045}], cdsc_enabled: false }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "NV", registered_amount: 50000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_nv: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "CORPORATE", account_channel: "DIRECT", state_code: "NV", tax_id: "141-41-4141", primary_owner_name: "Vault Corp", dividend_option: "CASH" }
              as: TransferAgentOperator
              captures: { acc_v: $.data.id }
            - call: "POST /shareholder-accounts/${acc_v}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_v}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 20000.00 }
              as: TransferAgentOperator
              captures: { t_a: $.data.id }
            - call: "POST /trades/${t_a}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_a}/settle"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades"
              payload: { account_id: "${acc_v}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 30000.00 }
              as: TransferAgentOperator
              captures: { t_b: $.data.id }
            - call: "POST /trades/${t_b}/cancel"
              payload: { cancel_reason: "Client withdrew the subscription" }
              as: TransferAgentOperator
            - call: "POST /trades/${t_a}/reverse"
              payload: { reversal_reason: "Wire never funded" }
              as: ComplianceOfficer
          assert:
            - "after the first capture: reserved_amount 20000.00, consumed_amount 0.00, remaining_amount 30000.00, status ACTIVE"
            - "after the settlement: reserved_amount 0.00, consumed_amount 20000.00, remaining_amount 30000.00, status ACTIVE"
            - "after the second capture: reserved_amount 30000.00, consumed_amount 20000.00, remaining_amount 0.00, status EXHAUSTED"
            - "after the cancellation: reserved_amount 0.00, consumed_amount 20000.00, remaining_amount 30000.00, status ACTIVE"
            - "after the reversal: BlueSkyRegistration.${bs_nv}.reserved_amount == 0.00, consumed_amount == 0.00, remaining_amount == 50000.00, status ACTIVE"
            - "at every one of those five checkpoints 50000.00 == remaining_amount + reserved_amount + consumed_amount"
            - "the Position of account ${acc_v} has shares == 0.000 after the reversal"
            - "ShareClass.${sc_a}.total_shares_outstanding == 0.000 after the reversal"
