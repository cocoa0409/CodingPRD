            - { call: "POST /meters", payload: { serial_number: "SN-SP-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { m1: $.data.id } }
            - { call: "POST /meters/${m1}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
