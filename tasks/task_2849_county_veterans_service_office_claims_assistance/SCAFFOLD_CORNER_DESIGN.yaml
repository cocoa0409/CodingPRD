              as: SystemAdmin
              captures: { st: $.data.accreditation_status, ver: $.data.version }
          assert:
            - "HTTP status == 200"
            - "${st} == ACTIVE"
            - "${ver} == 2"
            - "Representative.${rep}.caseload_weight == 0.0"

      - name: corner_outcome_report_submit_before_compute_returns_report_not_computed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.OutcomeReport[OPEN->SUBMITTED]
          - validations[priority=48]
          - errors[ERR_REPORT_NOT_COMPUTED]
        distinguishing_aspect: "The OPEN -> SUBMITTED precondition weighting_basis is not null is enforced independently of the from-state: an OPEN report that has never been computed is refused with ERR_REPORT_NOT_COMPUTED (409) and stays OPEN at version 1."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "One OutcomeReport for 2026Q1 that has never been computed, so weighting_basis is null."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-371", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/outcome-reports"
              payload: { fiscal_quarter: "2026Q1" }
