  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: license_draft_to_active_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.License.DRAFT_to_ACTIVE
          - endpoints."POST /licenses/{id}/activate"
        distinguishing_aspect: |
          The activate trigger on a DRAFT license whose OEM is COMPLIANT moves status to ACTIVE
          and bumps version 1 -> 2, and the row is then listed by the manufacturer's license list
          under a status=ACTIVE filter.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; SystemArea POWERTRAIN exists"
            - "Manufacturer ACME is COMPLIANT (parity_index 1.1500) with one DRAFT License"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "SUBSCRIPTION", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id, lic_v1: $.data.version }
          trigger:
            - call: "POST /licenses/${lic_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /manufacturers/${mfr_id}/licenses"
              payload: { status: "ACTIVE" }
              as: PlatformAdmin
          assert:
            - "activate call: HTTP status == 200 and response.data.status == ACTIVE"
            - "activate call: response.data.version == 2"
            - "activate call: response.data.suspension_reason == null"
            - "list call: total_count == 1 and data[0].id == ${lic_id}"

      - name: entitlement_activate_under_suspended_license_precondition_enforced
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ShopEntitlement.PENDING_to_ACTIVE
          - validations[priority=36]
          - errors[ERR_LICENSE_NOT_ACTIVE]
        distinguishing_aspect: |
          The PENDING -> ACTIVE precondition reads the License at activation time, so an
          entitlement bought while the license was ACTIVE is refused with ERR_LICENSE_NOT_ACTIVE
          once the license is SUSPENDED, and the entitlement stays PENDING with its PROVISIONAL
          charge of 85000 already debited and untouched.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; SystemArea POWERTRAIN exists"
            - "Manufacturer ACME COMPLIANT with an ACTIVE License (monthly_fee_cents 100000, one covered system area)"
            - "Shop 'Bay Auto' tier PRO funded 200000, with a PENDING SUBSCRIPTION entitlement of seats_total 3"
            - "The license is then SUSPENDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
              as: PlatformAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /licenses"
              payload: { manufacturer_id: "${mfr_id}", license_model: "SUBSCRIPTION", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/credit-funding"
              payload: { amount_cents: 200000, funding_ref: "FUND-1" }
              as: PlatformAdmin
            - call: "POST /entitlements"
              payload: { shop_id: "${shop_id}", license_id: "${lic_id}", entitlement_model: "SUBSCRIPTION", seats_total: 3, window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: ShopManager
              as_user_id: "${shop_id}"
              captures: { ent_id: $.data.id }
            - call: "POST /licenses/${lic_id}/suspend"
              payload: { reason: "OEM_AUDIT" }
              as: PlatformAdmin
          trigger:
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: ShopManager
              as_user_id: "${shop_id}"
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_LICENSE_NOT_ACTIVE"
            - "ShopEntitlement.${ent_id}.status == PENDING"
            - "ShopEntitlement.${ent_id}.charged_cents == 85000"
            - "ShopEntitlement.${ent_id}.settlement_status == UNSETTLED"
            - "Shop.${shop_id}.data_credit_balance_cents == 115000"
            - "License.${lic_id}.status == SUSPENDED and License.${lic_id}.suspension_reason == OEM_AUDIT"

      - name: session_activate_side_effects_credential_token_and_tool_occupancy
        claim_type: side_effect_execution
        grounds:
