# =============================================================================
# Task 1173 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty
# Tests). Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Standard fixture deadlines: regalia 2026-05-10, ticket 2026-05-15,
# pronunciation 2026-05-20, ceremony_date 2026-06-01T15:00:00Z.
# Logical clock default: 2026-05-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: ceremony_create_defaults_applied
        claim_type: defaults
        grounds: [entities.Ceremony.fields.readiness_posture, entities.Ceremony.fields.weather_mode, entities.Ceremony.fields.rehearsal_required]
        distinguishing_aspect: "Omitting rain_venue_id and rehearsal_required applies defaults; computed pools initialize from the venue."
        test_recipe:
          setup: ["Venue cap 10 accessible 2 exists"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
          trigger:
            - call: "POST /api/ceremonies"
              payload: { name: "Fall Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.5, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c_post: $.data.readiness_posture, c_wx: $.data.weather_mode, c_reh: $.data.rehearsal_required, c_cap: $.data.effective_capacity, c_pool: $.data.ticket_pool_total, c_open: $.data.open_seat_count }
          assert:
            - "readiness_posture == PLANNING, weather_mode == FAIR, rehearsal_required == true, rain_venue_id == null"
            - "effective_capacity == 10, ticket_pool_total == 15 (floor(10 * 1.5)), ticket_pool_remaining == 15, open_seat_count == 10"

      - name: graduate_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Graduate.fields.ceremony_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required ceremony_id is a schema violation (priority 4) -> 400."
        test_recipe:
          setup: ["A ceremony exists"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
          trigger:
            - call: "POST /api/graduates"
              payload: { full_name: "No Ceremony", email: "nc@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"

      - name: accommodation_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.AccommodationRequest.fields.request_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Out-of-domain enum value VALET_PARKING rejected at schema validation."
        test_recipe:
          setup: ["Ceremony with a graduate"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Enum Ed", email: "ed@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
          trigger:
            - call: "POST /api/graduates/${g}/accommodation-requests"
              payload: { ceremony_id: "${c}", request_type: "VALET_PARKING" }
              as: Graduate
              as_user_id: "${g}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"

      - name: graduate_get_not_found_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/graduates/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RegistrarOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: venue_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Venue]
        distinguishing_aspect: "Client-supplied id/version on creation are ignored; server mints UUID id and version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/venues"
              payload: { name: "System Hall", address: "9 College Ave", total_capacity: 20, accessible_capacity: 2, indoor: true, id: "11111111-2222-4333-8444-555555555555", version: 99 }
              as: VenueCoordinator
              captures: { vid: $.data.id, vver: $.data.version }
          assert:
            - "response id != 11111111-2222-4333-8444-555555555555 (server-minted UUID)"
            - "version == 1 and created_at/updated_at are server-stamped ISO8601"

      - name: graduate_honor_tier_input_ignored
        claim_type: computed_fields
        grounds: [entities.Graduate.fields.honor_tier]
        distinguishing_aspect: "honor_tier is computed; client input claiming SUMMA_CUM_LAUDE is ignored (stays NONE until an audit computes it)."
        test_recipe:
          setup: ["Ceremony exists"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
          trigger:
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Claim Chuck", email: "chuck@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, credits_completed: 120, credits_required: 120, honor_tier: "SUMMA_CUM_LAUDE" }
              as: RegistrarOfficer
              captures: { g_tier: $.data.honor_tier, g_status: $.data.status }
          assert:
            - "response honor_tier == NONE (client-supplied SUMMA_CUM_LAUDE ignored) and status == PENDING_AUDIT"

      - name: graduates_list_pagination
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "limit/offset/total_count/has_more interact correctly over a 3-row collection."
        test_recipe:
          setup: ["Ceremony with exactly 3 graduates"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "P One", email: "p1@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "P Two", email: "p2@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "P Three", email: "p3@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
          trigger:
            - call: "GET /api/ceremonies/${c}/graduates?limit=2&offset=0"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/ceremonies/${c}/graduates?limit=2&offset=2"
              payload: {}
              as: RegistrarOfficer
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 item, total_count == 3, has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: graduate_withdraw_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Graduate.ANY_NON_TERMINAL_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal; a second withdraw is rejected."
        test_recipe:
          setup: ["Ceremony with one graduate (PENDING_AUDIT), already withdrawn"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Walt Twice", email: "walt@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
            - call: "POST /api/graduates/${g}/withdraw"
              payload: {}
              as: RegistrarOfficer
          trigger:
            - call: "POST /api/graduates/${g}/withdraw"
              payload: {}
              as: RegistrarOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409; graduate remains WITHDRAWN"

      - name: ceremony_commence_after_complete_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Ceremony.READY_to_COMMENCED, state_machines.Ceremony.COMMENCED_to_COMPLETED]
        distinguishing_aspect: "COMPLETED is terminal; commence after complete is rejected (no transition from COMPLETED)."
        test_recipe:
          setup: ["Ceremony driven PLANNING->AUDIT_OPEN->(1 eligible graduate with reader card)->AUDIT_LOCKED->READY->COMMENCED->COMPLETED"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Term Tina", email: "tina@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
            - call: "POST /api/graduates/${g}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates/${g}/reader-card"
              payload: { phonetic_spelling: "TUR-mee-nuh TEE-nuh" }
              as: Graduate
              as_user_id: "${g}"
            - call: "POST /api/ceremonies/${c}/mark-ready"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/ceremonies/${c}/commence"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/ceremonies/${c}/complete"
              payload: {}
              as: CommitteeChair
          trigger:
            - call: "POST /api/ceremonies/${c}/commence"
              payload: {}
              as: CommitteeChair
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409; posture remains COMPLETED"

      - name: reader_card_double_approve_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.ReaderCard.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an already-APPROVED card is a second identical trigger -> rejected."
        test_recipe:
          setup: ["Ceremony AUDIT_OPEN with eligible graduate; reader card SUBMITTED and then APPROVED"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Card Carl", email: "carl@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
            - call: "POST /api/graduates/${g}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /api/graduates/${g}/reader-card"
              payload: { phonetic_spelling: "KARL" }
              as: Graduate
              as_user_id: "${g}"
              captures: { rc: $.data.id }
            - call: "POST /api/reader-cards/${rc}/approve"
              payload: {}
              as: CommitteeChair
          trigger:
            - call: "POST /api/reader-cards/${rc}/approve"
              payload: {}
              as: CommitteeChair
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409; card remains APPROVED with original approved_by_user_id"

      - name: diploma_issue_requires_commenced_posture
        claim_type: precondition_enforcement
        grounds: [state_machines.Diploma.PRINTED_to_ISSUED, "validations[priority=9]"]
        distinguishing_aspect: "Guarded transition: diploma issue requires ceremony posture COMMENCED; READY forbids it."
        test_recipe:
          setup: ["Ceremony READY; graduate's diploma PRINTED (batch released by reg-b-1, created by reg-a-1)"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Dee Ploma", email: "dee@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 175.5, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
            - call: "POST /api/graduates/${g}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/ceremonies/${c}/print-batches"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "reg-a-1"
              captures: { b: $.data.id }
            - call: "POST /api/print-batches/${b}/diplomas"
              payload: { graduate_id: "${g}" }
              as: RegistrarOfficer
              captures: { d: $.data.id }
            - call: "POST /api/print-batches/${b}/release"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "reg-b-1"
            - call: "POST /api/print-batches/${b}/mark-printed"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /api/graduates/${g}/reader-card"
              payload: { phonetic_spelling: "DEE PLOH-muh" }
              as: Graduate
              as_user_id: "${g}"
            - call: "POST /api/ceremonies/${c}/mark-ready"
              payload: {}
              as: CommitteeChair
          trigger:
            - call: "POST /api/diplomas/${d}/issue"
              payload: {}
              as: CommitteeChair
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CEREMONY_POSTURE_FORBIDS with HTTP 409; diploma remains PRINTED"

      - name: withdraw_releases_allocation_and_evicts_seat
        claim_type: side_effect_execution
        grounds: [state_machines.Graduate.ANY_NON_TERMINAL_to_WITHDRAWN, state_machines.SeatAssignment.ASSIGNED_to_EVICTED]
        distinguishing_aspect: "Conditional cascade: withdraw releases the granted allocation AND evicts the assigned seat, restoring both pools."
        test_recipe:
          setup: ["Venue cap 5; ceremony ratio 1.0 (pool 5); eligible graduate with granted 4 (waterfall run) and seat A/1/1 ASSIGNED"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Small Hall", address: "4 College Ave", total_capacity: 5, accessible_capacity: 1, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Cascade Cass", email: "cass@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
            - call: "POST /api/graduates/${g}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/graduates/${g}/ticket-allocations"
              payload: {}
              as: RegistrarOfficer
              captures: { a: "$.data[0].id", av: "$.data[0].version" }
            - call: "POST /api/ticket-allocations/${a}/request"
              payload: { requested_count: 4, expected_ticket_allocation_version: "${av}" }
              as: Graduate
              as_user_id: "${g}"
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/ceremonies/${c}/run-ticket-waterfall"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/seat-assignments"
              payload: { ceremony_id: "${c}", graduate_id: "${g}", section: "A", row_label: "1", seat_number: 1 }
              as: VenueCoordinator
              captures: { s: $.data.id }
          trigger:
            - call: "POST /api/graduates/${g}/withdraw"
              payload: {}
              as: RegistrarOfficer
          assert:
            - "TicketAllocation.${a}: status == RELEASED, granted_count == 0; Ceremony.ticket_pool_remaining == 5"
            - "SeatAssignment.${s}: status == EVICTED, evicted_reason == WITHDRAWN; Ceremony.open_seat_count == 5"
            - "Graduate.${g}.status == WITHDRAWN"

      - name: reopen_audit_restores_provisional_honor
        claim_type: side_effect_execution
        grounds: [state_machines.Ceremony.AUDIT_LOCKED_to_AUDIT_OPEN, calculations.honor_gpa_designation]
        distinguishing_aspect: "Revert transition re-runs the PROVISIONAL (COMBINED) variant, undoing the FINAL lock-audit designation."
        test_recipe:
          setup: ["Graduate with combined 3.736 / institutional 3.600; audited (MAGNA) then locked (CUM_LAUDE)"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
