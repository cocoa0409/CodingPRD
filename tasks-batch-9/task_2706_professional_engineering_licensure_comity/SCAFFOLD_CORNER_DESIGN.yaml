            - "CPCAudit.${audit_c}.sampled_count == 1"

  - section: cross-cutting complexity layers
    instances:
      - name: cpc_report_create_with_stale_license_version_conflicts
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cpc-report-create-stale-license]
          - errors.ERR_STALE_LICENSE_VERSION
          - validations[priority=8]
        distinguishing_aspect: "The second create is NOT blocked by any state precondition (a later report legitimately supersedes the earlier SUBMITTED one) — only the stale expected_license_version stops it with 412; re-reading the licence and resubmitting with the observed version then succeeds and supersedes the first report."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Nils Ravn' holds an ACTIVE licence issued 2026-01-15; one SUBMITTED CPCReport for 2026-01-15..2028-01-15 has already been filed against the licence version observed at creation, which advanced the licence version by 1."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Nils Ravn", email: "nils.ravn@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_nils: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_nils}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_nils: $.data.id, lic_nils_v1: $.data.version }
            - call: "POST /cpc-reports"
              payload: { license_id: "${lic_nils}", period_start: "2026-01-15T00:00:00Z", period_end: "2028-01-15T00:00:00Z", self_certified_pdh: 30, carryover_pdh_claimed: 0, expected_license_version: "${lic_nils_v1}" }
              as: Licensee
              as_user_id: "${eng_nils}"
              captures: { rep_nils_1: $.data.id }
          trigger:
            - call: "POST /cpc-reports"
              payload: { license_id: "${lic_nils}", period_start: "2026-01-15T00:00:00Z", period_end: "2028-01-15T00:00:00Z", self_certified_pdh: 32, carryover_pdh_claimed: 0, expected_license_version: "${lic_nils_v1}" }
              as: Licensee
