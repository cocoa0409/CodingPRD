scenario: "969. Pet Compounding Pharmacy & Rx Delivery: script intake & vet verification, compounding & flavoring, refill & auto-ship, controlled-substance log, inventory/lot & expiration, wellness-plan/insurance, cold-chain shipping, recall"
domain_name: pet-compounding-pharmacy
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, scheduled_actions]
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Owner legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across owners", constraints: "unique" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: ship_to_address, type: string, source: input, description: "Default delivery address" }
      - { name: status, type: enum, source: system, description: "Lifecycle flag", default: ACTIVE, constraints: "enum [ACTIVE, SUSPENDED]" }

  - name: Pet
    parent: Owner
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; owning customer" }
      - { name: name, type: string, source: input, description: "Pet name" }
      - { name: species, type: enum, source: input, description: "Species for flavor compatibility", constraints: "enum [DOG, CAT, BIRD, REPTILE, OTHER]" }
      - { name: weight_kg, type: number, source: input, description: "Weight used for pricing tier; must be > 0", constraints: "> 0" }
      - { name: allergies, type: array, source: input, description: "Array of allergen tags (e.g. CHICKEN, FISH, PEANUT)", default: [] }
      - { name: status, type: enum, source: system, description: "ALIVE or DECEASED; gates auto-ship and refills", default: ALIVE, constraints: "enum [ALIVE, DECEASED]" }

  - name: Veterinarian
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Vet name" }
      - { name: license_number, type: string, source: input, description: "State license number; unique", constraints: "unique" }
      - { name: dea_registration_number, type: string, source: input, description: "DEA registration; required to prescribe controlled schedules", constraints: "nullable" }
      - { name: practice_state, type: string, source: input, description: "2-letter state of practice" }
      - { name: status, type: enum, source: system, description: "Verification lifecycle", default: PENDING, constraints: "enum [PENDING, VERIFIED, SUSPENDED, REVOKED]" }

  - name: DrugCatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: drug_name, type: string, source: input, description: "Generic drug name" }
      - { name: schedule, type: enum, source: input, description: "DEA schedule", constraints: "enum [NON_CONTROLLED, C_II, C_III, C_IV, C_V]" }
      - { name: requires_cold_chain, type: boolean, source: input, description: "Whether shipments need a conditioned cooler" }
      - { name: cold_chain_min_celsius, type: number, source: input, description: "Minimum allowed transit temperature", default: 2 }
      - { name: cold_chain_max_celsius, type: number, source: input, description: "Maximum allowed transit temperature", default: 8 }
      - { name: unit_cost_cents, type: integer, source: input, description: "Catalog cost per dispensing unit (mL/capsule)", constraints: ">= 0" }
      - { name: default_beyond_use_days, type: integer, source: input, description: "Default beyond-use dating in days", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Catalog lifecycle", default: ACTIVE, constraints: "enum [ACTIVE, DISCONTINUED]" }

  - name: Flavoring
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Flavor name" }
      - { name: allergen_tags, type: array, source: input, description: "Allergen tags carried by this flavor", default: [] }
      - { name: surcharge_cents, type: integer, source: input, description: "Flat surcharge added to compound price", constraints: ">= 0" }
      - { name: compatible_species, type: array, source: input, description: "Species enum values this flavor may serve" }
      - { name: status, type: enum, source: system, description: "Lifecycle", default: ACTIVE, constraints: "enum [ACTIVE, DISCONTINUED]" }

  - name: Formula
    parent: null
    common_fields: true
    fields:
      - { name: drug_catalog_item_id, type: string, source: input, description: "FK -> DrugCatalogItem.id; base drug" }
      - { name: name, type: string, source: input, description: "Formula name" }
      - { name: dosage_form, type: enum, source: input, description: "Compounded dosage form", constraints: "enum [SUSPENSION, CAPSULE, CHEW, TOPICAL, INJECTABLE]" }
      - { name: strength_mg_per_ml, type: number, source: input, description: "Target strength", constraints: "> 0" }
      - { name: beyond_use_days, type: integer, source: input, description: "Beyond-use dating override", constraints: "> 0" }
      - { name: base_compounding_minutes, type: integer, source: input, description: "Nominal bench time", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle", default: ACTIVE, constraints: "enum [ACTIVE, DISCONTINUED]" }

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - { name: pet_id, type: string, source: input, description: "FK -> Pet.id; patient" }
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; must equal pet.owner_id" }
      - { name: veterinarian_id, type: string, source: input, description: "FK -> Veterinarian.id; prescriber" }
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; compound to dispense" }
      - { name: quantity, type: integer, source: input, description: "Units per fill", constraints: "> 0" }
      - { name: days_supply, type: integer, source: input, description: "Days one fill covers; drives refill timing", constraints: "> 0" }
      - { name: refills_authorized, type: integer, source: input, description: "Refills the vet authorizes; must be 0 for C_II", constraints: ">= 0" }
      - { name: refills_remaining, type: integer, source: system, description: "Initialized to refills_authorized; decremented by each refill order" }
      - { name: directions, type: string, source: input, description: "Sig text" }
      - { name: written_date, type: string, source: input, description: "ISO date the prescription was written" }
      - { name: expiration_date, type: string, source: computed, description: "written_date + 365 days (NON_CONTROLLED) or + 180 days (any C_*) — input ignored" }
      - { name: is_controlled, type: boolean, source: computed, description: "Derived from formula.drug schedule != NON_CONTROLLED" }
      - { name: schedule_snapshot, type: enum, source: computed, description: "Schedule copied from DrugCatalogItem at creation; later catalog edits do not mutate it", constraints: "enum [NON_CONTROLLED, C_II, C_III, C_IV, C_V]" }
      - { name: status, type: enum, source: system, description: "Verification lifecycle", default: RECEIVED, constraints: "enum [RECEIVED, VET_VERIFICATION_PENDING, CLARIFICATION_REQUESTED, VERIFIED, REJECTED, EXPIRED, EXHAUSTED]" }
      - { name: clarification_count, type: integer, source: system, description: "Number of clarification round-trips", default: 0 }

  - name: CompoundOrder
    parent: Prescription
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: input, description: "FK -> Prescription.id; source prescription" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; copied from prescription" }
      - { name: flavoring_id, type: string, source: input, description: "FK -> Flavoring.id; chosen flavor, nullable", constraints: "nullable" }
      - { name: is_refill, type: boolean, source: input, description: "True for refill fills; false for the first fill" }
      - { name: fill_number, type: integer, source: system, description: "1 for first fill; increments per refill" }
      - { name: supersedes_order_id, type: string, source: system, description: "FK -> CompoundOrder.id; earlier order auto-cancelled by this creation, nullable", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Compounding lifecycle", default: CREATED, constraints: "enum [CREATED, ALLOCATED, COMPOUNDING, FLAVORING, REWORK, QA_PENDING, READY_TO_DISPATCH, RECALL_HOLD, DISPENSED, CANCELLED]" }
      - { name: hold_origin_state, type: string, source: system, description: "Status the order returns to on resume from RECALL_HOLD, nullable", constraints: "nullable" }
      - { name: payment_status, type: enum, source: system, description: "Independent payment dimension", default: UNPAID, constraints: "enum [UNPAID, PAID, REFUNDED]" }
      - { name: paid_via, type: enum, source: system, description: "Tender used, nullable", constraints: "nullable; enum [CARD, WELLNESS_CREDIT]" }
      - { name: quantity_snapshot, type: integer, source: system, description: "Prescription.quantity copied at creation" }
      - { name: provisional_price_cents, type: integer, source: computed, description: "Estimate at creation from catalog cost (sum-then-round)" }
      - { name: final_price_cents, type: integer, source: computed, description: "Actual at QA pass from consumed lots (per-line round then sum); null until QA pass", constraints: "nullable" }
      - { name: compounding_pharmacist_id, type: string, source: system, description: "Opaque X-User-ID of the compounding pharmacist, nullable", constraints: "nullable" }
      - { name: qa_pharmacist_id, type: string, source: system, description: "Opaque X-User-ID of the QA reviewer; must differ from compounding_pharmacist_id, nullable", constraints: "nullable" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: drug_catalog_item_id, type: string, source: input, description: "FK -> DrugCatalogItem.id; stocked drug" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number; unique per drug", constraints: "unique per drug_catalog_item_id" }
      - { name: received_qty, type: integer, source: input, description: "Units received", constraints: "> 0" }
      - { name: qty_on_hand, type: integer, source: system, description: "Unreserved units physically present" }
      - { name: qty_reserved, type: integer, source: system, description: "Units reserved by LotAllocations in RESERVED" }
      - { name: qty_dispensed, type: integer, source: system, description: "Units consumed by QA-passed orders" }
      - { name: qty_wasted, type: integer, source: system, description: "Units written off" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Actual acquisition cost per unit for final pricing", constraints: ">= 0" }
      - { name: expiration_date, type: string, source: input, description: "ISO date after which the lot is unusable" }
      - { name: status, type: enum, source: system, description: "Lot lifecycle", default: ACTIVE, constraints: "enum [ACTIVE, QUARANTINED, RECALLED, EXPIRED, EXHAUSTED]" }
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; recall that quarantined this lot, nullable", constraints: "nullable" }

  - name: LotAllocation
    parent: CompoundOrder
    common_fields: true
    fields:
      - { name: compound_order_id, type: string, source: system, description: "FK -> CompoundOrder.id; owning order" }
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; reserved lot" }
      - { name: qty_allocated, type: integer, source: system, description: "Units reserved" }
      - { name: qty_consumed, type: integer, source: system, description: "Units consumed at QA pass", default: 0 }
      - { name: status, type: enum, source: system, description: "Allocation lifecycle", default: RESERVED, constraints: "enum [RESERVED, CONSUMED, RELEASED, WASTED]" }

  - name: CompoundingBench
    parent: null
    common_fields: true
    fields:
      - { name: bench_code, type: string, source: input, description: "Bench identifier; unique", constraints: "unique" }
      - { name: supports_controlled, type: boolean, source: input, description: "Whether controlled compounds may use this bench" }
      - { name: status, type: enum, source: system, description: "Bench availability", default: ACTIVE, constraints: "enum [ACTIVE, MAINTENANCE]" }

  - name: BenchReservation
    parent: CompoundingBench
    common_fields: true
    fields:
      - { name: bench_id, type: string, source: system, description: "FK -> CompoundingBench.id; reserved bench" }
      - { name: compound_order_id, type: string, source: system, description: "FK -> CompoundOrder.id; order occupying the bench" }
      - { name: start_at, type: datetime, source: input, description: "Interval start; half-open [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Interval end; must be > start_at" }
      - { name: status, type: enum, source: system, description: "Reservation lifecycle", default: BOOKED, constraints: "enum [BOOKED, IN_USE, COMPLETED, RELEASED]" }

  - name: Shipment
    parent: CompoundOrder
    common_fields: true
    fields:
      - { name: compound_order_id, type: string, source: system, description: "FK -> CompoundOrder.id; fulfilled order" }
      - { name: cooler_asset_id, type: string, source: input, description: "FK -> CoolerAsset.id; required iff drug requires cold chain, otherwise must be omitted", constraints: "nullable" }
      - { name: carrier, type: string, source: input, description: "Carrier name" }
      - { name: service_level, type: enum, source: input, description: "Shipping speed tier", constraints: "enum [STANDARD, EXPRESS, OVERNIGHT]" }
      - { name: destination_zone, type: enum, source: input, description: "Transit zone driving ice-pack count", constraints: "enum [Z1, Z2, Z3]" }
      - { name: transit_status, type: enum, source: system, description: "Transit dimension", default: LABEL_CREATED, constraints: "enum [LABEL_CREATED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, DELIVERY_EXCEPTION, RETURNED_TO_PHARMACY, QUARANTINED]" }
      - { name: cold_chain_status, type: enum, source: system, description: "Independent cold-chain dimension; NOT_REQUIRED when drug is ambient", default: NOT_REQUIRED, constraints: "enum [NOT_REQUIRED, COMPLIANT, EXCURSION_WATCH, EXCURSION_BREACH]" }
      - { name: required_temp_min_celsius, type: number, source: system, description: "Copied from drug at creation" }
      - { name: required_temp_max_celsius, type: number, source: system, description: "Copied from drug at creation" }
      - { name: excursion_minutes_accumulated, type: integer, source: computed, description: "Cumulative out-of-range minutes across reading intervals", default: 0 }
      - { name: shipping_fee_cents, type: integer, source: computed, description: "Fee from shipping_fee calculation" }
      - { name: last_reading_at, type: datetime, source: system, description: "Timestamp of latest temperature reading, nullable", constraints: "nullable" }

  - name: TemperatureReading
    parent: Shipment
    common_fields: false
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; measured shipment" }
      - { name: recorded_at, type: datetime, source: input, description: "Measurement timestamp; must be >= previous reading's recorded_at" }
      - { name: temp_celsius, type: number, source: input, description: "Measured temperature" }

  - name: CoolerAsset
    parent: null
    common_fields: true
    fields:
      - { name: cooler_code, type: string, source: input, description: "Cooler identifier; unique", constraints: "unique" }
      - { name: status, type: enum, source: system, description: "Availability lifecycle", default: AVAILABLE, constraints: "enum [AVAILABLE, ASSIGNED, CONDITIONING, RETIRED]" }
      - { name: conditioning_available_at, type: datetime, source: system, description: "End of mandatory 2h reconditioning window after last delivery, nullable", constraints: "nullable" }

  - name: WellnessPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan name" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Subscription fee", constraints: ">= 0" }
      - { name: included_refill_credits, type: integer, source: input, description: "Credits granted per enrollment", constraints: ">= 0" }
      - { name: credit_value_cents, type: integer, source: input, description: "Redemption value of one credit", constraints: "> 0" }
      - { name: discount_pct, type: number, source: input, description: "Discount fraction applied to order subtotal", constraints: "0 <= x < 1" }
      - { name: covers_controlled, type: boolean, source: input, description: "Whether credits may pay for controlled compounds" }
      - { name: status, type: enum, source: system, description: "Plan lifecycle", default: ACTIVE, constraints: "enum [ACTIVE, RETIRED]" }

  - name: WellnessEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; enrolled owner (from pet)" }
      - { name: pet_id, type: string, source: input, description: "FK -> Pet.id; enrolled pet" }
      - { name: plan_id, type: string, source: input, description: "FK -> WellnessPlan.id; subscribed plan" }
      - { name: status, type: enum, source: system, description: "Enrollment lifecycle", default: ACTIVE, constraints: "enum [ACTIVE, SUSPENDED, CANCELLED]" }
      - { name: credits_remaining, type: integer, source: system, description: "Redeemable credits; initialized to plan.included_refill_credits" }
      - { name: credits_consumed, type: integer, source: system, description: "Lifetime credits spent", default: 0 }
      - { name: cycle_anchor_date, type: string, source: system, description: "ISO date of enrollment" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; policyholder (from pet)" }
      - { name: pet_id, type: string, source: input, description: "FK -> Pet.id; insured pet" }
      - { name: insurer_name, type: string, source: input, description: "Insurer name" }
      - { name: policy_number, type: string, source: input, description: "Policy number; unique", constraints: "unique" }
      - { name: deductible_cents, type: integer, source: input, description: "Annual deductible", constraints: ">= 0" }
      - { name: deductible_met_cents, type: integer, source: system, description: "Deductible consumed so far", default: 0 }
      - { name: coverage_pct, type: number, source: input, description: "Coinsurance fraction after deductible", constraints: "0 <= x <= 1" }
      - { name: annual_limit_cents, type: integer, source: input, description: "Annual payout cap", constraints: "> 0" }
      - { name: annual_used_cents, type: integer, source: system, description: "Payouts consumed this year", default: 0 }
      - { name: renewal_date, type: string, source: input, description: "ISO renewal date" }
      - { name: status, type: enum, source: system, description: "Policy lifecycle", default: ACTIVE, constraints: "enum [ACTIVE, LAPSED]" }

  - name: InsuranceClaim
    parent: InsurancePolicy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> InsurancePolicy.id; claimed policy" }
      - { name: compound_order_id, type: string, source: input, description: "FK -> CompoundOrder.id; claimed order" }
      - { name: status, type: enum, source: system, description: "Adjudication lifecycle", default: SUBMITTED, constraints: "enum [SUBMITTED, APPROVED, REJECTED, APPEALED, PAID]" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Must equal compound order provisional_price_cents at creation" }
      - { name: estimate_cents, type: integer, source: computed, description: "Provisional payout from provisional price and current policy snapshot" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Final payout from final price via deductible/limit waterfall; null until adjudicated", constraints: "nullable" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Deductible consumed by this claim; null until adjudicated", constraints: "nullable" }
      - { name: appeal_count, type: integer, source: system, description: "Appeals used; max 2", default: 0 }
      - { name: denial_reason, type: string, source: input, description: "Required when adjudication outcome is REJECT, nullable", constraints: "nullable" }

  - name: AutoShipSchedule
    parent: Prescription
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: input, description: "FK -> Prescription.id; refill source" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> WellnessEnrollment.id; optional plan link for credit payment", constraints: "nullable" }
      - { name: interval_days, type: integer, source: input, description: "Days between fires", constraints: "> 0" }
      - { name: next_run_date, type: string, source: input, description: "ISO date of next fire" }
      - { name: status, type: enum, source: system, description: "Schedule lifecycle", default: ACTIVE, constraints: "enum [ACTIVE, PAUSED, CANCELLED]" }
      - { name: consecutive_failures, type: integer, source: system, description: "Failed fire attempts in a row; auto-pauses at 3", default: 0 }
      - { name: last_fired_at, type: datetime, source: system, description: "Last successful fire, nullable", constraints: "nullable" }

  - name: ControlledSubstanceEntry
    parent: null
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; controlled lot touched" }
      - { name: compound_order_id, type: string, source: system, description: "FK -> CompoundOrder.id; dispensing order for DISPENSE entries, nullable", constraints: "nullable" }
      - { name: entry_type, type: enum, source: system, description: "DEA log entry kind", constraints: "enum [RECEIVE, DISPENSE, WASTE, RETURN, ADJUST]" }
      - { name: qty_delta, type: integer, source: system, description: "Signed quantity: RECEIVE/RETURN positive, DISPENSE/WASTE negative" }
      - { name: running_balance, type: integer, source: computed, description: "Per-lot chronological balance after this entry; must stay >= 0" }
      - { name: recorded_by, type: string, source: system, description: "Opaque X-User-ID of the recorder" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock at write time" }

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: scope, type: enum, source: input, description: "Recall breadth", constraints: "enum [LOT, CATALOG_ITEM]" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; required when scope=LOT, else null", constraints: "nullable" }
      - { name: drug_catalog_item_id, type: string, source: input, description: "FK -> DrugCatalogItem.id; required when scope=CATALOG_ITEM, else null", constraints: "nullable" }
      - { name: reason, type: string, source: input, description: "Recall reason" }
      - { name: severity, type: enum, source: input, description: "FDA-style severity", constraints: "enum [CLASS_I, CLASS_II, CLASS_III]" }
      - { name: status, type: enum, source: system, description: "Recall lifecycle", default: DRAFT, constraints: "enum [DRAFT, ACTIVE, COMPLETED]" }
      - { name: activated_at, type: datetime, source: system, description: "Activation timestamp, nullable", constraints: "nullable" }

  - name: RecallTask
    parent: Recall
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; owning recall" }
      - { name: compound_order_id, type: string, source: system, description: "FK -> CompoundOrder.id; affected dispensed order" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; owner to notify" }
      - { name: channel, type: enum, source: system, description: "Notification channel", default: EMAIL, constraints: "enum [EMAIL, PHONE]" }
      - { name: status, type: enum, source: system, description: "Notification lifecycle", default: PENDING, constraints: "enum [PENDING, NOTIFIED, ACKNOWLEDGED, FAILED]" }

state_machines:
  - entity: Prescription
    initial_state: RECEIVED
    terminal_states: [REJECTED, EXPIRED, EXHAUSTED]
    transitions:
      - from: RECEIVED
        to: VET_VERIFICATION_PENDING
        trigger: "POST /prescriptions/{id}/submit-verification"
        actor: PharmacyTech
        preconditions: ["veterinarian.status == VERIFIED"]
        side_effects: ["increments Prescription.version by 1"]
      - from: VET_VERIFICATION_PENDING
        to: VERIFIED
        trigger: "POST /prescriptions/{id}/vet-confirm"
        actor: Veterinarian
        preconditions: ["X-User-ID == prescription.veterinarian_id", "veterinarian.status == VERIFIED"]
        side_effects: ["increments Prescription.version by 1"]
      - from: VET_VERIFICATION_PENDING
        to: REJECTED
        trigger: "POST /prescriptions/{id}/vet-reject"
        actor: Veterinarian
        preconditions: ["X-User-ID == prescription.veterinarian_id"]
        side_effects: ["increments Prescription.version by 1"]
      - from: VET_VERIFICATION_PENDING
        to: CLARIFICATION_REQUESTED
        trigger: "POST /prescriptions/{id}/request-clarification"
        actor: Veterinarian
        preconditions: ["X-User-ID == prescription.veterinarian_id"]
        side_effects: ["clarification_count += 1", "increments Prescription.version by 1"]
      - from: CLARIFICATION_REQUESTED
        to: VET_VERIFICATION_PENDING
        trigger: "POST /prescriptions/{id}/resubmit"
        actor: PharmacyTech
        preconditions: []
        side_effects: ["increments Prescription.version by 1"]
      - from: VERIFIED
        to: EXHAUSTED
        trigger: "system: auto-transition when a refill creation decrements refills_remaining to 0"
        actor: system
        preconditions: ["refills_remaining == 0 after decrement"]
        side_effects: ["increments Prescription.version by 1"]
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: POST /_ops/expiration_sweep when expiration_date < current clock date"
        actor: system
        preconditions: ["expiration_date < current logical clock date"]
        side_effects: ["cancels ACTIVE/PAUSED AutoShipSchedules for this prescription"]
      - from: VET_VERIFICATION_PENDING
        to: REJECTED
        trigger: "system: cascade from POST /veterinarians/{id}/suspend or /revoke"
        actor: system
        preconditions: ["prescription.veterinarian_id == suspended veterinarian"]
        side_effects: ["increments Prescription.version by 1"]
      - from: CLARIFICATION_REQUESTED
        to: REJECTED
        trigger: "system: cascade from POST /veterinarians/{id}/suspend or /revoke"
        actor: system
        preconditions: ["prescription.veterinarian_id == suspended veterinarian"]
        side_effects: ["increments Prescription.version by 1"]
      - from: RECEIVED
        to: REJECTED
        trigger: "system: cascade from POST /veterinarians/{id}/suspend or /revoke"
        actor: system
        preconditions: ["prescription.veterinarian_id == suspended veterinarian"]
        side_effects: ["increments Prescription.version by 1"]

  - entity: CompoundOrder
    initial_state: CREATED
    terminal_states: [DISPENSED, CANCELLED]
    note: "payment_status (UNPAID/PAID/REFUNDED) is an independent state dimension on the same row; it evolves via pay/refund transitions without changing status"
    transitions:
      - from: CREATED
        to: ALLOCATED
        trigger: "POST /compound-orders/{id}/allocate"
        actor: PharmacyTech
        preconditions: ["prescription.status == VERIFIED", "FEFO allocation covers quantity_snapshot"]
        side_effects: ["creates LotAllocation rows status RESERVED in FEFO order", "each touched Lot.qty_reserved += allocated and qty_on_hand -= allocated", "increments CompoundOrder.version by 1"]
      - from: ALLOCATED
        to: COMPOUNDING
        trigger: "POST /compound-orders/{id}/start-compounding"
        actor: Pharmacist
        preconditions: ["bench.status == ACTIVE", "bench.supports_controlled == true when prescription.is_controlled", "no overlapping BenchReservation on the bench (half-open intervals)", "no ACTIVE recall touches any allocated lot"]
        side_effects: ["creates BenchReservation BOOKED then IN_USE", "compounding_pharmacist_id := X-User-ID", "increments CompoundOrder.version by 1"]
      - from: COMPOUNDING
        to: FLAVORING
        trigger: "POST /compound-orders/{id}/complete-compounding"
        actor: Pharmacist
        preconditions: ["X-User-ID == compounding_pharmacist_id", "flavoring_id is not null"]
        side_effects: ["increments CompoundOrder.version by 1"]
      - from: COMPOUNDING
        to: QA_PENDING
        trigger: "POST /compound-orders/{id}/complete-compounding"
        actor: Pharmacist
        preconditions: ["X-User-ID == compounding_pharmacist_id", "flavoring_id is null"]
        side_effects: ["increments CompoundOrder.version by 1"]
      - from: FLAVORING
        to: QA_PENDING
        trigger: "POST /compound-orders/{id}/complete-flavoring"
        actor: Pharmacist
        preconditions: ["X-User-ID == compounding_pharmacist_id"]
        side_effects: ["increments CompoundOrder.version by 1"]
      - from: QA_PENDING
        to: READY_TO_DISPATCH
        trigger: "POST /compound-orders/{id}/qa-pass"
        actor: Pharmacist
        preconditions: ["X-User-ID != compounding_pharmacist_id (segregation of duties)"]
        side_effects: ["qa_pharmacist_id := X-User-ID", "all RESERVED LotAllocations -> CONSUMED with qty_consumed = qty_allocated", "each Lot: qty_reserved -= qty, qty_dispensed += qty", "computes final_price_cents via compound_final_price", "BenchReservation IN_USE -> COMPLETED", "increments CompoundOrder.version by 1"]
      - from: QA_PENDING
        to: REWORK
        trigger: "POST /compound-orders/{id}/qa-fail"
        actor: Pharmacist
        preconditions: ["X-User-ID != compounding_pharmacist_id"]
        side_effects: ["waste_qty units (default 0) written off: the RESERVED allocations' qty_allocated is reduced by waste_qty in allocation creation order, Lot.qty_reserved -= waste_qty, Lot.qty_wasted += waste_qty, WASTE ControlledSubstanceEntry when controlled", "increments CompoundOrder.version by 1"]
      - from: REWORK
        to: COMPOUNDING
        trigger: "POST /compound-orders/{id}/start-compounding"
        actor: Pharmacist
        preconditions: ["remaining RESERVED allocations cover quantity_snapshot minus wasted units", "bench overlap and recall rules as for ALLOCATED -> COMPOUNDING"]
        side_effects: ["creates BenchReservation IN_USE", "compounding_pharmacist_id := X-User-ID", "increments CompoundOrder.version by 1"]
      - from: CREATED
        to: CANCELLED
        trigger: "POST /compound-orders/{id}/cancel"
        actor: Pharmacist
        preconditions: []
        side_effects: ["increments CompoundOrder.version by 1"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /compound-orders/{id}/cancel"
        actor: Pharmacist
        preconditions: []
        side_effects: ["all RESERVED LotAllocations -> RELEASED", "each Lot: qty_reserved -= allocated, qty_on_hand += allocated", "if payment_status == PAID: auto-refund (payment_status -> REFUNDED; if paid_via == WELLNESS_CREDIT, enrollment credits restored)", "increments CompoundOrder.version by 1"]
      - from: READY_TO_DISPATCH
        to: DISPENSED
        trigger: "system: from POST /shipments/{id}/mark-picked-up on its shipment"
        actor: system
        preconditions: ["payment_status == PAID"]
        side_effects: ["DISPENSE ControlledSubstanceEntry per consumed controlled lot", "increments CompoundOrder.version by 1"]
      - from: ALLOCATED
        to: RECALL_HOLD
        trigger: "system: cascade from POST /recalls/{id}/activate touching an allocated lot"
        actor: system
        preconditions: []
        side_effects: ["hold_origin_state := ALLOCATED", "increments CompoundOrder.version by 1"]
      - from: COMPOUNDING
        to: RECALL_HOLD
        trigger: "system: cascade from POST /recalls/{id}/activate touching an allocated lot"
        actor: system
        preconditions: []
        side_effects: ["hold_origin_state := COMPOUNDING", "BenchReservation IN_USE -> RELEASED", "increments CompoundOrder.version by 1"]
      - from: FLAVORING
        to: RECALL_HOLD
        trigger: "system: cascade from POST /recalls/{id}/activate touching an allocated lot"
        actor: system
        preconditions: []
        side_effects: ["hold_origin_state := FLAVORING", "increments CompoundOrder.version by 1"]
      - from: QA_PENDING
        to: RECALL_HOLD
        trigger: "system: cascade from POST /recalls/{id}/activate touching an allocated lot"
        actor: system
        preconditions: []
        side_effects: ["hold_origin_state := QA_PENDING", "increments CompoundOrder.version by 1"]
      - from: READY_TO_DISPATCH
        to: RECALL_HOLD
        trigger: "system: cascade from POST /recalls/{id}/activate touching an allocated lot"
        actor: system
        preconditions: []
        side_effects: ["hold_origin_state := READY_TO_DISPATCH", "increments CompoundOrder.version by 1"]
      - from: RECALL_HOLD
        to: ALLOCATED
        trigger: "POST /compound-orders/{id}/resume"
        actor: Pharmacist
        preconditions: ["hold_origin_state == ALLOCATED", "no ACTIVE recall touches any allocated lot"]
        side_effects: ["hold_origin_state := null", "increments CompoundOrder.version by 1"]
      - from: RECALL_HOLD
        to: COMPOUNDING
        trigger: "POST /compound-orders/{id}/resume"
        actor: Pharmacist
        preconditions: ["hold_origin_state == COMPOUNDING", "no ACTIVE recall touches any allocated lot"]
        side_effects: ["hold_origin_state := null", "increments CompoundOrder.version by 1"]
      - from: RECALL_HOLD
        to: FLAVORING
        trigger: "POST /compound-orders/{id}/resume"
        actor: Pharmacist
        preconditions: ["hold_origin_state == FLAVORING", "no ACTIVE recall touches any allocated lot"]
        side_effects: ["hold_origin_state := null", "increments CompoundOrder.version by 1"]
      - from: RECALL_HOLD
        to: QA_PENDING
        trigger: "POST /compound-orders/{id}/resume"
        actor: Pharmacist
        preconditions: ["hold_origin_state == QA_PENDING", "no ACTIVE recall touches any allocated lot"]
        side_effects: ["hold_origin_state := null", "increments CompoundOrder.version by 1"]
      - from: RECALL_HOLD
        to: READY_TO_DISPATCH
        trigger: "POST /compound-orders/{id}/resume"
        actor: Pharmacist
        preconditions: ["hold_origin_state == READY_TO_DISPATCH", "no ACTIVE recall touches any allocated lot"]
        side_effects: ["hold_origin_state := null", "increments CompoundOrder.version by 1"]
      - from: RECALL_HOLD
        to: CANCELLED
        trigger: "POST /compound-orders/{id}/cancel"
        actor: Pharmacist
        preconditions: []
        side_effects: ["all RESERVED LotAllocations -> RELEASED with lot quantity restoration", "if payment_status == PAID: auto-refund as in ALLOCATED -> CANCELLED", "increments CompoundOrder.version by 1"]

  - entity: Shipment
    initial_state: LABEL_CREATED
    terminal_states: [DELIVERED, RETURNED_TO_PHARMACY, QUARANTINED]
    note: "cold_chain_status is an independent dimension; NOT_REQUIRED shipments reject temperature readings"
    transitions:
      - from: LABEL_CREATED
        to: PICKED_UP
        trigger: "POST /shipments/{id}/mark-picked-up"
        actor: Pharmacist
        preconditions: ["no ACTIVE recall touches the order's lots"]
        side_effects: ["CompoundOrder READY_TO_DISPATCH -> DISPENSED", "increments Shipment.version by 1"]
      - from: PICKED_UP
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/mark-in-transit"
        actor: Pharmacist
        preconditions: []
        side_effects: ["increments Shipment.version by 1"]
      - from: IN_TRANSIT
        to: OUT_FOR_DELIVERY
        trigger: "POST /shipments/{id}/mark-out-for-delivery"
        actor: Pharmacist
        preconditions: []
        side_effects: ["increments Shipment.version by 1"]
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /shipments/{id}/mark-delivered"
        actor: Pharmacist
        preconditions: ["cold_chain_status != EXCURSION_BREACH"]
        side_effects: ["CoolerAsset ASSIGNED -> CONDITIONING with conditioning_available_at := clock + 2h when a cooler is attached", "increments Shipment.version by 1"]
      - from: IN_TRANSIT
        to: DELIVERY_EXCEPTION
        trigger: "POST /shipments/{id}/report-exception"
        actor: Pharmacist
        preconditions: []
        side_effects: ["increments Shipment.version by 1"]
      - from: OUT_FOR_DELIVERY
        to: DELIVERY_EXCEPTION
        trigger: "POST /shipments/{id}/report-exception"
        actor: Pharmacist
        preconditions: []
        side_effects: ["increments Shipment.version by 1"]
      - from: DELIVERY_EXCEPTION
        to: RETURNED_TO_PHARMACY
        trigger: "POST /shipments/{id}/mark-returned"
        actor: Pharmacist
        preconditions: []
        side_effects: ["CoolerAsset ASSIGNED -> CONDITIONING with conditioning_available_at := clock + 2h when attached", "increments Shipment.version by 1"]
      - from: LABEL_CREATED
        to: QUARANTINED
        trigger: "system: cold-chain breach or recall activation cascade"
        actor: system
        preconditions: ["cold_chain_status == EXCURSION_BREACH or an ACTIVE recall touches the order's lots"]
        side_effects: ["if order payment_status == PAID: payment_status -> REFUNDED; if paid_via == WELLNESS_CREDIT, enrollment credits_remaining += credits used and credits_consumed -= credits used", "CoolerAsset ASSIGNED -> CONDITIONING when attached", "increments Shipment.version by 1"]
      - from: PICKED_UP
        to: QUARANTINED
        trigger: "system: cold-chain breach or recall activation cascade"
        actor: system
        preconditions: ["cold_chain_status == EXCURSION_BREACH or an ACTIVE recall touches the order's lots"]
        side_effects: ["same refund cascade as LABEL_CREATED -> QUARANTINED", "increments Shipment.version by 1"]
      - from: IN_TRANSIT
        to: QUARANTINED
        trigger: "system: cold-chain breach or recall activation cascade"
        actor: system
        preconditions: ["cold_chain_status == EXCURSION_BREACH or an ACTIVE recall touches the order's lots"]
        side_effects: ["same refund cascade as LABEL_CREATED -> QUARANTINED", "increments Shipment.version by 1"]
      - from: OUT_FOR_DELIVERY
        to: QUARANTINED
        trigger: "system: cold-chain breach or recall activation cascade"
        actor: system
        preconditions: ["cold_chain_status == EXCURSION_BREACH or an ACTIVE recall touches the order's lots"]
        side_effects: ["same refund cascade as LABEL_CREATED -> QUARANTINED", "increments Shipment.version by 1"]

  - entity: Lot
    initial_state: ACTIVE
    terminal_states: [RECALLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: QUARANTINED
        trigger: "system: cascade from POST /recalls/{id}/activate whose scope covers this lot"
        actor: system
        preconditions: []
        side_effects: ["recall_id := recall id", "cascade: CompoundOrders with RESERVED/CONSUMED allocations from this lot and status in {ALLOCATED, COMPOUNDING, FLAVORING, QA_PENDING, READY_TO_DISPATCH} -> RECALL_HOLD; each such hold cascades to its Shipments (transit in {LABEL_CREATED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY}) -> QUARANTINED, and to ACTIVE AutoShipSchedules of the order's prescription -> PAUSED", "increments Lot.version by 1"]
      - from: QUARANTINED
        to: RECALLED
        trigger: "system: from POST /recalls/{id}/complete on the linked recall"
        actor: system
        preconditions: ["recall_id == completed recall"]
        side_effects: ["increments Lot.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_ops/expiration_sweep when expiration_date < current clock date"
        actor: system
        preconditions: ["expiration_date < current logical clock date"]
        side_effects: ["all RESERVED LotAllocations from this lot -> RELEASED with qty restoration; orders left under-allocated revert ALLOCATED -> CREATED", "increments Lot.version by 1"]
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: auto when qty_on_hand == 0 and qty_reserved == 0"
        actor: system
        preconditions: ["qty_on_hand == 0 AND qty_reserved == 0"]
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: auto when a release/return restores qty_on_hand > 0"
        actor: system
        preconditions: ["qty_on_hand > 0 after restoration"]
        side_effects: []

  - entity: Veterinarian
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /veterinarians/{id}/verify"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Veterinarian.version by 1"]
      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /veterinarians/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["cascade: this vet's Prescriptions in {RECEIVED, VET_VERIFICATION_PENDING, CLARIFICATION_REQUESTED} -> REJECTED", "increments Veterinarian.version by 1"]
      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /veterinarians/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Veterinarian.version by 1"]
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /veterinarians/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["same prescription cascade as suspend", "increments Veterinarian.version by 1"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /veterinarians/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Veterinarian.version by 1"]

  - entity: WellnessEnrollment
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /enrollments/{id}/suspend"
        actor: Owner
        preconditions: []
        side_effects: ["increments WellnessEnrollment.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /enrollments/{id}/resume"
        actor: Owner
        preconditions: []
        side_effects: ["increments WellnessEnrollment.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel or system supersede by a new enrollment for the same pet"
        actor: Owner
        preconditions: []
        side_effects: ["cancels ACTIVE/PAUSED AutoShipSchedules linked via enrollment_id", "increments WellnessEnrollment.version by 1"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel or system supersede"
        actor: Owner
        preconditions: []
        side_effects: ["cancels ACTIVE/PAUSED AutoShipSchedules linked via enrollment_id", "increments WellnessEnrollment.version by 1"]

  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [LAPSED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /insurance-policies/{id}/lapse"
        actor: InsuranceAdjuster
        preconditions: []
        side_effects: ["increments InsurancePolicy.version by 1"]

  - entity: InsuranceClaim
    initial_state: SUBMITTED
    terminal_states: [PAID]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /claims/{id}/adjudicate with outcome APPROVE"
        actor: InsuranceAdjuster
        preconditions: ["policy.status == ACTIVE", "compound order final_price_cents is not null"]
        side_effects: ["computes approved_amount_cents and deductible_applied_cents via claim_adjudication waterfall", "increments InsuranceClaim.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /claims/{id}/adjudicate with outcome REJECT"
        actor: InsuranceAdjuster
        preconditions: ["denial_reason present"]
        side_effects: ["increments InsuranceClaim.version by 1"]
      - from: APPEALED
        to: APPROVED
        trigger: "POST /claims/{id}/adjudicate with outcome APPROVE"
        actor: InsuranceAdjuster
        preconditions: ["policy.status == ACTIVE"]
        side_effects: ["computes approved_amount_cents via claim_adjudication waterfall", "increments InsuranceClaim.version by 1"]
      - from: APPEALED
        to: REJECTED
        trigger: "POST /claims/{id}/adjudicate with outcome REJECT"
        actor: InsuranceAdjuster
        preconditions: ["denial_reason present"]
        side_effects: ["increments InsuranceClaim.version by 1"]
      - from: REJECTED
        to: APPEALED
        trigger: "POST /claims/{id}/appeal"
        actor: Owner
        preconditions: ["appeal_count < 2", "X-User-ID == policy.owner_id"]
        side_effects: ["appeal_count += 1", "increments InsuranceClaim.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /claims/{id}/pay"
        actor: InsuranceAdjuster
        preconditions: ["policy.status == ACTIVE"]
        side_effects: ["policy.annual_used_cents += approved_amount_cents", "policy.deductible_met_cents += deductible_applied_cents", "increments InsurancePolicy.version by 1", "increments InsuranceClaim.version by 1"]

  - entity: AutoShipSchedule
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /auto-ship-schedules/{id}/pause, system recall cascade, or system auto-pause at 3 consecutive failures"
        actor: Owner
        preconditions: []
        side_effects: ["increments AutoShipSchedule.version by 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /auto-ship-schedules/{id}/resume"
        actor: Owner
        preconditions: ["prescription.status == VERIFIED", "pet.status == ALIVE"]
        side_effects: ["consecutive_failures := 0", "increments AutoShipSchedule.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /auto-ship-schedules/{id}/cancel, or system cascades (pet deceased, enrollment cancelled, prescription expired, supersede)"
        actor: Owner
        preconditions: []
        side_effects: ["increments AutoShipSchedule.version by 1"]
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /auto-ship-schedules/{id}/cancel or system cascades"
        actor: Owner
        preconditions: []
        side_effects: ["increments AutoShipSchedule.version by 1"]

  - entity: Recall
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /recalls/{id}/activate"
        actor: ComplianceOfficer
        preconditions: ["scope=LOT requires lot_id present; scope=CATALOG_ITEM requires drug_catalog_item_id present"]
        side_effects: ["activated_at := clock", "covered Lots ACTIVE -> QUARANTINED (cascade per Lot machine)", "creates RecallTask (channel EMAIL, status PENDING) for every CompoundOrder in DISPENSED whose lots are covered", "increments Recall.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /recalls/{id}/complete"
        actor: ComplianceOfficer
        preconditions: ["every RecallTask of this recall has status in {NOTIFIED, ACKNOWLEDGED}"]
        side_effects: ["covered QUARANTINED Lots -> RECALLED", "increments Recall.version by 1"]

  - entity: RecallTask
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, FAILED]
    transitions:
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /recall-tasks/{id}/mark-notified"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments RecallTask.version by 1"]
      - from: PENDING
        to: FAILED
        trigger: "POST /recall-tasks/{id}/mark-failed"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments RecallTask.version by 1"]
      - from: NOTIFIED
        to: ACKNOWLEDGED
        trigger: "POST /recall-tasks/{id}/acknowledge"
        actor: Owner
        preconditions: ["X-User-ID == recall_task.owner_id"]
        side_effects: ["increments RecallTask.version by 1"]

  - entity: CompoundingBench
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "PATCH /compounding-benches/{id} with status MAINTENANCE"
        actor: PharmacyAdmin
        preconditions: ["no BenchReservation in {BOOKED, IN_USE} on this bench"]
        side_effects: ["increments CompoundingBench.version by 1"]
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "PATCH /compounding-benches/{id} with status ACTIVE"
        actor: PharmacyAdmin
        preconditions: []
        side_effects: ["increments CompoundingBench.version by 1"]

  - entity: BenchReservation
    initial_state: BOOKED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: BOOKED
        to: IN_USE
        trigger: "system: same request that creates it (start-compounding)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_USE
        to: COMPLETED
        trigger: "system: from POST /compound-orders/{id}/qa-pass"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_USE
        to: RELEASED
        trigger: "system: from recall hold cascade on the order"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: RELEASED
        trigger: "system: from order cancel"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CoolerAsset
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system: from POST /compound-orders/{id}/shipments attaching this cooler"
        actor: system
        preconditions: []
        side_effects: ["increments CoolerAsset.version by 1"]
      - from: CONDITIONING
        to: ASSIGNED
        trigger: "system: from POST /compound-orders/{id}/shipments attaching this cooler once clock >= conditioning_available_at"
        actor: system
        preconditions: ["current logical clock >= conditioning_available_at"]
        side_effects: ["conditioning_available_at := null", "increments CoolerAsset.version by 1"]
      - from: ASSIGNED
        to: CONDITIONING
        trigger: "system: from shipment DELIVERED / RETURNED_TO_PHARMACY / QUARANTINED"
        actor: system
        preconditions: []
        side_effects: ["conditioning_available_at := clock + 2h", "increments CoolerAsset.version by 1"]
      - from: AVAILABLE
        to: RETIRED
        trigger: "PATCH /cooler-assets/{id} with status RETIRED"
        actor: PharmacyAdmin
        preconditions: []
        side_effects: ["increments CoolerAsset.version by 1"]

  - entity: Pet
    initial_state: ALIVE
    terminal_states: [DECEASED]
    transitions:
      - from: ALIVE
        to: DECEASED
        trigger: "PATCH /pets/{id} with status DECEASED"
        actor: Owner
        preconditions: []
        side_effects: ["cascade: all AutoShipSchedules (status ACTIVE or PAUSED) on this pet's prescriptions -> CANCELLED", "increments Pet.version by 1"]

concurrency_rules:
  - rule_id: compound-order-create-stale-prescription
    parent_entity: Prescription
    write_endpoint: "POST /prescriptions/{id}/compound-orders"
    occ_field: expected_prescription_version
    description: |
      Creating a CompoundOrder against a Prescription whose version has advanced
      since the client last observed it is rejected. The create legitimately
      supersedes an existing CREATED/ALLOCATED order under the supersede rule,
      so a writer holding a stale prescription view is turned away with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: auto-ship-create-stale-prescription
    parent_entity: Prescription
    write_endpoint: "POST /auto-ship-schedules"
    occ_field: expected_prescription_version
    description: |
      Creating an AutoShipSchedule against a Prescription whose version has
      advanced since the client last observed it is rejected. A new schedule
      legitimately supersedes the existing ACTIVE one for that prescription,
      so a stale prescription view is rejected with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: claim-create-stale-policy
    parent_entity: InsurancePolicy
    write_endpoint: "POST /insurance-policies/{id}/claims"
    occ_field: expected_policy_version
    description: |
      Creating an InsuranceClaim against an InsurancePolicy whose version has
      advanced since the client last observed it is rejected. Claim creation
      recomputes the policy's deductible estimate reserve and bumps its
      version, so a writer holding a stale policy view is turned away with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: enrollment-create-stale-owner
    parent_entity: Owner
    write_endpoint: "POST /enrollments"
    occ_field: expected_owner_version
    description: |
      Creating a WellnessEnrollment against an Owner whose version has advanced
      since the client last observed it is rejected. A new enrollment for a pet
      legitimately supersedes that pet's existing ACTIVE/SUSPENDED enrollment,
      so a stale owner view is rejected with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: compound_provisional_price
    trigger: "on CompoundOrder creation"
    algorithm: tiered_pricing
    formula: |
      base_cents = quantity_snapshot * drug_catalog_item.unit_cost_cents
      flavor_cents = flavoring.surcharge_cents if flavoring_id else 0
      mult = 1.00 if pet.weight_kg < 5
             else 1.15 if pet.weight_kg < 15
             else 1.30 if pet.weight_kg < 30
             else 1.50                       # tier lower bounds are INCLUSIVE (>=)
      surcharge = CONTROLLED_SURCHARGE_CENTS if schedule_snapshot != NON_CONTROLLED else 0
      provisional_price_cents = round_half_up((base_cents + flavor_cents) * mult) + surcharge
    input_set: "the new CompoundOrder, its Prescription, Pet, DrugCatalogItem (catalog cost), optional Flavoring"
    constants:
      CONTROLLED_SURCHARGE_CENTS: 1500
    precision: "integer cents; single round_half_up AFTER summing and multiplying (sum-then-round order pinned)"
    variants:
      - name: provisional
        when: "at order creation"
        difference: "uses DrugCatalogItem.unit_cost_cents and sum-then-round rounding order"

  - name: compound_final_price
    trigger: "on CompoundOrder QA pass"
    algorithm: aggregation
    formula: |
      for each CONSUMED LotAllocation i (processed in allocation creation order, tie-break created_at ASC):
        line_cents_i = round_half_up(qty_consumed_i * lot_i.unit_cost_cents * (1 + WASTE_SHRINK_PCT))
      lot_component = sum(line_cents_i)                      # per-line round THEN sum (pinned order)
      flavor_cents = flavoring.surcharge_cents if flavoring_id else 0
      mult = same weight tier table as compound_provisional_price
      surcharge = CONTROLLED_SURCHARGE_CENTS if schedule_snapshot != NON_CONTROLLED else 0
      final_price_cents = round_half_up((lot_component + flavor_cents) * mult) + surcharge
    input_set: "LotAllocations of this order with status CONSUMED, their Lots (actual unit_cost_cents), Flavoring, Pet, Prescription.schedule_snapshot"
    constants:
      WASTE_SHRINK_PCT: 0.03
      CONTROLLED_SURCHARGE_CENTS: 1500
    precision: "integer cents; round_half_up per line BEFORE summing (differs from provisional on identical quantities when lot costs differ from catalog)"
    variants:
      - name: final
        when: "at QA pass"
        difference: "uses actual Lot.unit_cost_cents, applies WASTE_SHRINK_PCT uplift, and rounds per line before summing — same fill data yields a different total than provisional"

  - name: claim_estimate_and_adjudication
    trigger: "estimate at InsuranceClaim creation; adjudication at POST /claims/{id}/adjudicate APPROVE"
    algorithm: waterfall_allocation
    formula: |
      waterfall(amount_cents, policy):
        deductible_applied = min(amount_cents, policy.deductible_cents - policy.deductible_met_cents)
        after_deductible = amount_cents - deductible_applied
        covered = round_half_up(after_deductible * policy.coverage_pct)
        payout = min(covered, policy.annual_limit_cents - policy.annual_used_cents)
        return (payout, deductible_applied)
      estimate_cents    = waterfall(provisional_price_cents, policy_snapshot_at_creation).payout
      approved          = waterfall(final_price_cents, policy_state_at_adjudication)   # chronological: earlier PAID claims consume deductible/limit first, in claim created_at ASC order
    input_set: "the claim's CompoundOrder (provisional then final price) and the InsurancePolicy; adjudication reads live policy counters"
    constants: {}
    precision: "integer cents, round_half_up on the coverage multiplication only"
    variants:
      - name: estimate
        when: "claim creation"
        difference: "keys on provisional_price_cents; does not mutate policy counters"
      - name: adjudicated
        when: "adjudication"
        difference: "keys on final_price_cents and live deductible/limit counters; identical claim data produces a different payout whenever provisional != final or counters moved"

  - name: shipping_fee
    trigger: "on Shipment creation"
    algorithm: threshold
    formula: |
      base = SHIPPING_BASE_CENTS[service_level]
      cold = COLD_CHAIN_SURCHARGE_CENTS if drug.requires_cold_chain else 0
      ice  = ceil(ZONE_TRANSIT_HOURS[destination_zone] / 24) * ICE_PACK_PER_24H_CENTS
      shipping_fee_cents = min(SHIPPING_FEE_CAP_CENTS, base + cold + ice)   # nested min + ceil, 4 inputs
    input_set: "Shipment.service_level, Shipment.destination_zone, order's DrugCatalogItem.requires_cold_chain"
    constants:
      SHIPPING_BASE_CENTS: { STANDARD: 500, EXPRESS: 900, OVERNIGHT: 1500 }
      COLD_CHAIN_SURCHARGE_CENTS: 1200
      ICE_PACK_PER_24H_CENTS: 300
      ZONE_TRANSIT_HOURS: { Z1: 24, Z2: 48, Z3: 72 }
      SHIPPING_FEE_CAP_CENTS: 3500
    precision: "integer cents; ceil before multiplication; cap applied last"

  - name: refill_eligibility
    trigger: "on CompoundOrder creation with is_refill == true"
    algorithm: threshold
    formula: |
      threshold_days = ceil(REFILL_ELIGIBILITY_PCT * prescription.days_supply)
      last_fill_date = max(created_at date) over this prescription's CompoundOrders with status == DISPENSED
      eligible = (current_clock_date - last_fill_date) >= threshold_days     # INCLUSIVE >=
    input_set: "prescription CompoundOrders in status DISPENSED only (CANCELLED and in-progress fills excluded)"
    constants:
      REFILL_ELIGIBILITY_PCT: 0.75
    precision: "whole days; boundary day itself is eligible"

  - name: cold_chain_excursion
    trigger: "on each POST /shipments/{id}/temperature-readings"
    algorithm: decay_function
    formula: |
      out_of_range(t) = t < required_temp_min_celsius OR t > required_temp_max_celsius   # bounds INCLUSIVE-compliant
      on new reading r_n with previous reading r_(n-1):
        if out_of_range(r_n.temp_celsius):
          excursion_minutes_accumulated += minutes(r_n.recorded_at - r_(n-1).recorded_at)   # 0 when r_n is the first reading
      # first reading establishes baseline; in-range readings stop accumulation but never reset the accumulator
      cold_chain_status = EXCURSION_BREACH if excursion_minutes_accumulated >= EXCURSION_BREACH_MINUTES
                        else EXCURSION_WATCH if (excursion_minutes_accumulated > 0 OR out_of_range(latest reading))
                        else COMPLIANT
      on EXCURSION_BREACH: transit_status -> QUARANTINED (if not already terminal DELIVERED/RETURNED_TO_PHARMACY)
    input_set: "the shipment's TemperatureReadings ordered by recorded_at ASC (tie-break created_at ASC)"
    constants:
      EXCURSION_BREACH_MINUTES: 30
    precision: "whole minutes; >= 30 breaches (exactly 30 breaches)"

  - name: lot_fefo_allocation
    trigger: "on POST /compound-orders/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      candidates = Lots where drug_catalog_item_id == formula.drug_catalog_item_id
                   AND status == ACTIVE
                   AND expiration_date >= current_clock_date + prescription.days_supply days
      order candidates by expiration_date ASC, tie-break created_at ASC      # FEFO; ids never used
      walk candidates in order, reserving min(remaining_need, lot.qty_on_hand) per lot
      if total reservable < quantity_snapshot: reject ERR_INSUFFICIENT_INVENTORY (no partial allocation persists)
    input_set: "Lots filtered as above; empty candidate set rejects"
    constants: {}
    precision: "whole units"

  - name: controlled_running_balance
    trigger: "on every ControlledSubstanceEntry write (RECEIVE/DISPENSE/WASTE/RETURN/ADJUST)"
    algorithm: chronological
    formula: |
      entries replayed per lot in recorded_at ASC, tie-break created_at ASC
      running_balance_n = running_balance_(n-1) + qty_delta_n   (genesis balance 0)
      reject any write that would make running_balance < 0
      invariant: latest running_balance == lot.qty_on_hand + lot.qty_reserved
    input_set: "all ControlledSubstanceEntry rows for the lot, chronological"
    constants: {}
    precision: "whole units"

  - name: wellness_credit_application
    trigger: "on POST /compound-orders/{id}/pay with payment_method WELLNESS_CREDIT"
    algorithm: constraint_propagation
    formula: |
      # evaluation order pinned to break the circular-looking dependency:
      step 1: subtotal = order.final_price_cents if not null else order.provisional_price_cents
      step 2: discount = round_half_up(subtotal * plan.discount_pct)
      step 3: credit_cap_cents = round_half_up(MAX_CREDIT_SHARE * (subtotal - discount))   # cap keys on POST-discount amount
      step 4: credits_used = min(enrollment.credits_remaining, floor(credit_cap_cents / plan.credit_value_cents))
      step 5: amount_due_cents = subtotal - discount - credits_used * plan.credit_value_cents
    input_set: "the order, the enrollment and its plan; enrollment must be ACTIVE, enrollment.pet_id == prescription.pet_id, and plan.covers_controlled must be true when schedule_snapshot != NON_CONTROLLED"
    constants:
      MAX_CREDIT_SHARE: 0.5
    precision: "integer cents; discount rounded before the cap is computed"

  - name: cooler_conditioning_window
    trigger: "on POST /compound-orders/{id}/shipments when cooler_asset_id supplied"
    algorithm: interval_merge
    formula: |
      a cooler is attachable iff status == AVAILABLE
         OR (status == CONDITIONING AND current_clock >= conditioning_available_at)   # inclusive: exactly at the timestamp is attachable
      after DELIVERED/RETURNED/QUARANTINED: conditioning_available_at = event_clock + COOLER_CONDITIONING_HOURS hours
      semantics: closed interval with a MANDATORY gap — unlike bench half-open adjacency, attaching before the gap elapses is rejected even when the prior shipment's window has ended
    input_set: "the CoolerAsset and current logical clock"
    constants:
      COOLER_CONDITIONING_HOURS: 2
    precision: "minute granularity on the logical clock"

validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "entity-backed ownership: X-User-ID equals the resource's owner FK where the endpoint declares an ownership rule (vet-confirm/reject/clarify, owner pay, owner appeal, recall-task acknowledge, enrollment suspend/resume/cancel, autoship pause/resume/cancel)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "ownership-guarded endpoints" }
  - { priority: 4, category: existence, check: "path ids exist, validated left-to-right; body FK references exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "required input fields present and typed; enum values in declared sets; weight_kg > 0; end_at > start_at", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals the parent's current version on the four OCC-guarded creates", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /prescriptions/{id}/compound-orders, POST /auto-ship-schedules, POST /insurance-policies/{id}/claims, POST /enrollments" }
  - { priority: 9, category: state, check: "target resource in a from-state of the invoked transition; terminal states reject all further transitions", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "prescription.status == VERIFIED for compound-order creation/allocation; EXPIRED prescription yields ERR_PRESCRIPTION_EXPIRED instead", error_id: ERR_PRESCRIPTION_NOT_VERIFIED, http_status: 409, applies_to: "POST /prescriptions/{id}/compound-orders, POST /compound-orders/{id}/allocate" }
  - { priority: 8, category: state, check: "prescription.status == EXPIRED reported distinctly", error_id: ERR_PRESCRIPTION_EXPIRED, http_status: 409, applies_to: "POST /prescriptions/{id}/compound-orders" }
  - { priority: 8, category: state, check: "no other CompoundOrder of this prescription sits in {COMPOUNDING, FLAVORING, REWORK, QA_PENDING, READY_TO_DISPATCH, RECALL_HOLD}; an existing CREATED/ALLOCATED order is superseded (auto-cancelled) instead", error_id: ERR_ORDER_IN_PROGRESS, http_status: 409, applies_to: "POST /prescriptions/{id}/compound-orders" }
  - { priority: 7, category: state, check: "order under RECALL_HOLD rejects every action except resume/cancel (supersedes the generic invalid-state check for held orders)", error_id: ERR_RECALL_HOLD_ACTIVE, http_status: 409, applies_to: "compound-order action endpoints" }
  - { priority: 10, category: state, check: "enrollment.status == ACTIVE for credit payment", error_id: ERR_ENROLLMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /compound-orders/{id}/pay" }
  - { priority: 10, category: state, check: "policy.status == ACTIVE for claim creation and payment", error_id: ERR_POLICY_NOT_ACTIVE, http_status: 409, applies_to: "POST /insurance-policies/{id}/claims, POST /claims/{id}/pay" }
  - { priority: 11, category: business_safety, check: "no Flavoring.allergen_tags element appears in Pet.allergies", error_id: ERR_ALLERGEN_CONFLICT, http_status: 422, applies_to: "POST /prescriptions/{id}/compound-orders" }
  - { priority: 12, category: business_safety, check: "Pet.species is in Flavoring.compatible_species", error_id: ERR_SPECIES_FLAVOR_INCOMPATIBLE, http_status: 422, applies_to: "POST /prescriptions/{id}/compound-orders" }
  - { priority: 13, category: business_safety, check: "controlled formula requires veterinarian.dea_registration_number present", error_id: ERR_CONTROLLED_DEA_REQUIRED, http_status: 422, applies_to: "POST /prescriptions" }
  - { priority: 14, category: business_safety, check: "C_II prescriptions: refills_authorized must be 0; is_refill orders on C_II forbidden", error_id: ERR_CONTROLLED_REFILL_FORBIDDEN, http_status: 422, applies_to: "POST /prescriptions, POST /prescriptions/{id}/compound-orders" }
  - { priority: 15, category: business_safety, check: "qa-pass/qa-fail X-User-ID differs from compounding_pharmacist_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /compound-orders/{id}/qa-pass, POST /compound-orders/{id}/qa-fail" }
  - { priority: 16, category: business_safety, check: "controlled order requires bench.supports_controlled == true", error_id: ERR_BENCH_NOT_CONTROLLED_CAPABLE, http_status: 422, applies_to: "POST /compound-orders/{id}/start-compounding" }
  - { priority: 17, category: business_safety, check: "pet.status == ALIVE for refill creation, auto-ship resume, and auto-ship firing", error_id: ERR_PET_DECEASED, http_status: 422, applies_to: "POST /prescriptions/{id}/compound-orders, POST /auto-ship-schedules/{id}/resume, POST /_ops/auto_ship_run" }
  - { priority: 18, category: business_referential, check: "enrollment.pet_id == prescription.pet_id when paying with WELLNESS_CREDIT", error_id: ERR_ENROLLMENT_PET_MISMATCH, http_status: 422, applies_to: "POST /compound-orders/{id}/pay" }
  - { priority: 19, category: business_referential, check: "claimed_amount_cents == order.provisional_price_cents", error_id: ERR_CLAIM_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /insurance-policies/{id}/claims" }
  - { priority: 20, category: business_referential, check: "no ACTIVE recall covers any lot allocated to the order (start-compounding, resume, shipment creation, mark-picked-up)", error_id: ERR_RECALL_ACTIVE_ON_LOT, http_status: 409, applies_to: "compound-order and shipment action endpoints" }
  - { priority: 21, category: business_constraint, check: "bench reservation intervals are half-open [start_at, end_at); reject when existing reservation has start_at < new.end_at AND new.start_at < existing.end_at; adjacency (new.start_at == existing.end_at) allowed", error_id: ERR_BENCH_OVERLAP, http_status: 409, applies_to: "POST /compound-orders/{id}/start-compounding" }
  - { priority: 22, category: business_constraint, check: "cooler attachable per cooler_conditioning_window; rejected while CONDITIONING with clock < conditioning_available_at", error_id: ERR_COOLER_CONDITIONING, http_status: 409, applies_to: "POST /compound-orders/{id}/shipments" }
  - { priority: 23, category: business_constraint, check: "cold-chain drug requires cooler_asset_id; ambient drug forbids it", error_id: ERR_COLD_CHAIN_COOLER_REQUIRED, http_status: 422, applies_to: "POST /compound-orders/{id}/shipments" }
  - { priority: 24, category: business_constraint, check: "(drug_catalog_item_id, lot_number) unique", error_id: ERR_DUPLICATE_LOT_NUMBER, http_status: 409, applies_to: "POST /lots" }
  - { priority: 25, category: business_constraint, check: "policy_number unique", error_id: ERR_POLICY_NUMBER_EXISTS, http_status: 409, applies_to: "POST /insurance-policies" }
  - { priority: 26, category: business_constraint, check: "FEFO candidates cover quantity_snapshot", error_id: ERR_INSUFFICIENT_INVENTORY, http_status: 422, applies_to: "POST /compound-orders/{id}/allocate" }
  - { priority: 27, category: business_constraint, check: "refills_remaining > 0 for is_refill orders", error_id: ERR_REFILLS_EXHAUSTED, http_status: 422, applies_to: "POST /prescriptions/{id}/compound-orders" }
  - { priority: 28, category: business_constraint, check: "appeal_count < 2", error_id: ERR_MAX_APPEALS_EXCEEDED, http_status: 422, applies_to: "POST /claims/{id}/appeal" }
  - { priority: 29, category: business_constraint, check: "waste qty <= lot.qty_on_hand and controlled running balance stays >= 0", error_id: ERR_WASTE_EXCEEDS_ON_HAND, http_status: 422, applies_to: "POST /lots/{id}/waste" }
  - { priority: 30, category: business_temporal, check: "refill_eligibility: clock date - last DISPENSED fill date >= ceil(0.75 * days_supply)", error_id: ERR_REFILL_TOO_EARLY, http_status: 422, applies_to: "POST /prescriptions/{id}/compound-orders" }
  - { priority: 31, category: business_temporal, check: "temperature reading recorded_at >= previous reading's recorded_at and reading only accepted when cold_chain_status != NOT_REQUIRED", error_id: ERR_COLD_CHAIN_NOT_REQUIRED, http_status: 422, applies_to: "POST /shipments/{id}/temperature-readings" }
  - { priority: 32, category: business_fiscal, check: "payment_status == PAID before shipment creation", error_id: ERR_PAYMENT_REQUIRED, http_status: 402, applies_to: "POST /compound-orders/{id}/shipments" }
  - { priority: 33, category: business_fiscal, check: "wellness_credit_application yields credits_used >= 1 and amount_due_cents >= 0; plan.covers_controlled honored; zero-credit enrollments rejected", error_id: ERR_CREDIT_LIMIT, http_status: 402, applies_to: "POST /compound-orders/{id}/pay" }

endpoints:
  - { method: POST, path: "/owners", description: "Register an owner", roles: [PharmacyAdmin], code: 201, input: [full_name, email, phone, ship_to_address], output: Owner, side_effects: [] }
  - { method: GET, path: "/owners/{id}", description: "Fetch owner", roles: [Owner, Pharmacist, PharmacyTech, ComplianceOfficer, PharmacyAdmin], code: 200, input: [], output: Owner, side_effects: [] }
  - { method: PATCH, path: "/owners/{id}", description: "Update owner contact fields", roles: [Owner, PharmacyAdmin], code: 200, input: ["full_name?", "phone?", "ship_to_address?"], output: Owner, side_effects: ["increments Owner.version by 1"] }
  - { method: GET, path: "/owners/{id}/pets", description: "List an owner's pets", roles: [Owner, Pharmacist, PharmacyTech, PharmacyAdmin], code: 200, input: [], output: "Pet[]", side_effects: [] }
  - { method: POST, path: "/owners/{id}/pets", description: "Register a pet", roles: [Owner, PharmacyAdmin], code: 201, input: [name, species, weight_kg, "allergies?"], output: Pet, side_effects: [] }
  - { method: GET, path: "/pets/{id}", description: "Fetch pet", roles: [Owner, Veterinarian, Pharmacist, PharmacyTech, PharmacyAdmin], code: 200, input: [], output: Pet, side_effects: [] }
  - { method: PATCH, path: "/pets/{id}", description: "Update weight/allergies or mark deceased", roles: [Owner, Pharmacist], code: 200, input: ["weight_kg?", "allergies?", "status?"], output: Pet, side_effects: ["status -> DECEASED cascades AutoShipSchedule cancellation", "increments Pet.version by 1"] }
  - { method: POST, path: "/veterinarians", description: "Register a veterinarian", roles: [PharmacyAdmin], code: 201, input: [full_name, license_number, "dea_registration_number?", practice_state], output: Veterinarian, side_effects: [] }
  - { method: GET, path: "/veterinarians/{id}", description: "Fetch veterinarian", roles: [Veterinarian, Pharmacist, PharmacyTech, ComplianceOfficer, PharmacyAdmin], code: 200, input: [], output: Veterinarian, side_effects: [] }
  - { method: POST, path: "/veterinarians/{id}/verify", description: "Verify vet credentials", roles: [ComplianceOfficer], code: 200, input: [], output: Veterinarian, side_effects: ["PENDING -> VERIFIED", "increments Veterinarian.version by 1"] }
  - { method: POST, path: "/veterinarians/{id}/suspend", description: "Suspend vet; cascades pending prescriptions to REJECTED", roles: [ComplianceOfficer], code: 200, input: [], output: Veterinarian, side_effects: ["VERIFIED -> SUSPENDED", "prescription rejection cascade", "increments Veterinarian.version by 1"] }
  - { method: POST, path: "/veterinarians/{id}/reinstate", description: "Reinstate suspended vet", roles: [ComplianceOfficer], code: 200, input: [], output: Veterinarian, side_effects: ["SUSPENDED -> VERIFIED", "increments Veterinarian.version by 1"] }
  - { method: POST, path: "/veterinarians/{id}/revoke", description: "Revoke vet license (terminal)", roles: [ComplianceOfficer], code: 200, input: [], output: Veterinarian, side_effects: ["-> REVOKED", "prescription rejection cascade", "increments Veterinarian.version by 1"] }
  - { method: POST, path: "/drug-catalog-items", description: "Add catalog drug", roles: [PharmacyAdmin], code: 201, input: [drug_name, schedule, requires_cold_chain, unit_cost_cents, default_beyond_use_days, "cold_chain_min_celsius?", "cold_chain_max_celsius?"], output: DrugCatalogItem, side_effects: [] }
  - { method: GET, path: "/drug-catalog-items", description: "List catalog drugs with filters and pagination", roles: [Owner, Veterinarian, Pharmacist, PharmacyTech, ComplianceOfficer, PharmacyAdmin], code: 200, input: ["schedule?", "status?", "limit?", "offset?"], output: "DrugCatalogItem[]", side_effects: [] }
  - { method: GET, path: "/drug-catalog-items/{id}", description: "Fetch drug", roles: [Owner, Veterinarian, Pharmacist, PharmacyTech, ComplianceOfficer, PharmacyAdmin], code: 200, input: [], output: DrugCatalogItem, side_effects: [] }
  - { method: PATCH, path: "/drug-catalog-items/{id}", description: "Discontinue a drug", roles: [PharmacyAdmin], code: 200, input: ["status?"], output: DrugCatalogItem, side_effects: ["increments DrugCatalogItem.version by 1"] }
  - { method: GET, path: "/drug-catalog-items/{id}/formulas", description: "List formulas built on a drug", roles: [Veterinarian, Pharmacist, PharmacyTech, PharmacyAdmin], code: 200, input: [], output: "Formula[]", side_effects: [] }
  - { method: POST, path: "/flavorings", description: "Add a flavoring", roles: [PharmacyAdmin], code: 201, input: [name, "allergen_tags?", surcharge_cents, compatible_species], output: Flavoring, side_effects: [] }
  - { method: GET, path: "/flavorings", description: "List flavorings", roles: [Owner, Veterinarian, Pharmacist, PharmacyTech, PharmacyAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Flavoring[]", side_effects: [] }
  - { method: GET, path: "/flavorings/{id}", description: "Fetch flavoring", roles: [Owner, Veterinarian, Pharmacist, PharmacyTech, PharmacyAdmin], code: 200, input: [], output: Flavoring, side_effects: [] }
