  - method: POST
    path: "/sales-events"
    description: "record a sales event against an ACTIVE listing"
    roles: [PlatformAdmin]
    code: 201
    input: ["listing_id", "units_sold", "units_returned?", "unit_price_cents", "occurred_at"]
    output: SalesEvent
    side_effects: []
  - method: GET
    path: "/sales-events/{id}"
