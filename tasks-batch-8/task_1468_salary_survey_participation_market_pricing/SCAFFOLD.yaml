# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header is missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is valid but not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist within the org scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Request body malformed, required field missing, or enum value not in declared set" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource is in a state where the requested transition is not allowed" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation-of-duties violation: approver equals proposer" }
  - { id: ERR_VENDOR_NOT_ACTIVE, http: 409, condition: "Vendor.status is not ACTIVE for the requested operation" }
  - { id: ERR_VENDOR_SCOPE_FORBIDS_SUBMISSION, http: 409, condition: "Vendor.data_use_scope is BENCHMARK_ONLY; incumbent submissions are not permitted" }
  - { id: ERR_VENDOR_CONTRACT_WINDOW, http: 409, condition: "Current date falls outside [contract_start_date, contract_end_date)" }
  - { id: ERR_VENDOR_HAS_OPEN_SUBMISSIONS, http: 409, condition: "Vendor has at least one child Survey in SUBMITTED status" }
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 409, condition: "current_utc_date > submission_deadline" }
  - { id: ERR_SURVEY_NOT_OPEN, http: 409, condition: "Survey.status is not OPEN for the requested operation" }
  - { id: ERR_SUBMISSIONS_PENDING, http: 409, condition: "Survey acceptance blocked: at least one SurveySubmission is in a non-terminal state" }
  - { id: ERR_EMPTY_SUBMISSION, http: 422, condition: "incumbent_snapshot must contain at least one entry" }
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 422, condition: "Referenced Employee is not in ACTIVE status" }
  - { id: ERR_SAMPLE_SIZE_TOO_SMALL, http: 409, condition: "Benchmark sample_size < 5 on match approval" }
  - { id: ERR_INVALID_WEIGHT, http: 422, condition: "match_weight_pct is not an integer in [1, 100]" }
  - { id: ERR_NO_SOURCES, http: 409, condition: "Composite has zero APPROVED contributing matches" }
  - { id: ERR_ALREADY_PUBLISHED, http: 409, condition: "Another PUBLISHED composite exists for the same job and strategy_policy_id" }
  - { id: ERR_GEO_INDEX_MISSING, http: 422, condition: "CUSTOM_GEO_INDEX policy requires a geo_index entry for the job_geo_code" }
  - { id: ERR_MIXED_STRATEGY_SOURCES, http: 409, condition: "Report mixes composites from different strategy policies without explicit exclusions" }
  - { id: ERR_STRATEGY_NOT_ACTIVE, http: 409, condition: "Pinned strategy policy is not ACTIVE at finalize time" }
  - { id: ERR_STRATEGY_WINDOW_OVERLAP, http: 409, condition: "Another ACTIVE strategy has an overlapping [effective_from, effective_to) window" }
  - { id: ERR_CYCLE_EFFECTIVE_OVERLAP, http: 409, condition: "A new cycle's effective_date falls inside an existing OPEN or LOCKED cycle's [created_date, effective_date] window" }
  - { id: ERR_BUDGET_EXCEEDED, http: 409, condition: "Approval would push cycle.allocated_cents above cycle.budget_cents" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "proposed_amount_cents is non-positive or exceeds 15% of current base salary" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the current parent version" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Cycle is not OPEN for the requested operation" }
  - { id: ERR_CYCLE_NOT_LOCKED, http: 409, condition: "Cycle is not LOCKED for the requested operation" }
  - { id: ERR_CYCLE_HAS_PENDING, http: 409, condition: "Cycle has at least one PENDING_APPROVAL adjustment" }
  - { id: ERR_CYCLE_HAS_UNAPPLIED, http: 409, condition: "Cycle has at least one APPROVED (not yet APPLIED) adjustment at close" }
  - { id: ERR_NO_PUBLISHED_COMPOSITE, http: 409, condition: "Job has no PUBLISHED MarketComposite at adjustment-submit time" }
  - { id: ERR_ADJUSTMENT_NOT_YET_EFFECTIVE, http: 409, condition: "current_utc_date < cycle.effective_date at apply time" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CompAnalyst
    description: "Prepares survey submissions, proposes job matches, proposes market adjustments"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /orgs/{id}/surveys/{id}/submissions — create submission"
      - "POST /orgs/{id}/submissions/{submissionId}/mark_ready"
      - "POST /orgs/{id}/submissions/{submissionId}/submit"
      - "POST /orgs/{id}/submissions/{submissionId}/rework"
      - "POST /orgs/{id}/surveys/{id}/matches — propose match"
      - "POST /orgs/{id}/matches/{matchId}/revise"
      - "POST /orgs/{id}/cycles/{id}/adjustments — propose adjustment"
      - "POST /orgs/{id}/adjustments/{adjustmentId}/submit"
      - "POST /orgs/{id}/adjustments/{adjustmentId}/retract"
    shared_operations:
      - "GET on any org-scoped resource"

  - name: CompManager
    description: "Reviews/approves matches, manages composites, strategies, cycles; approves and applies adjustments; creates reports"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /orgs/{id}/strategies — create strategy"
      - "POST /orgs/{id}/strategies/{id}/activate"
      - "POST /orgs/{id}/strategies/{id}/retire"
      - "POST /orgs/{id}/jobs — create job"
      - "POST /orgs/{id}/matches/{matchId}/review"
      - "POST /orgs/{id}/matches/{matchId}/approve"
      - "POST /orgs/{id}/matches/{matchId}/reject"
      - "POST /orgs/{id}/jobs/{id}/composites — create composite"
      - "POST /orgs/{id}/composites/{compositeId}/recompute"
      - "POST /orgs/{id}/composites/{compositeId}/publish"
      - "POST /orgs/{id}/cycles — create cycle"
      - "POST /orgs/{id}/cycles/{id}/lock"
      - "POST /orgs/{id}/cycles/{id}/unlock"
      - "POST /orgs/{id}/cycles/{id}/close"
      - "POST /orgs/{id}/adjustments/{adjustmentId}/approve"
      - "POST /orgs/{id}/adjustments/{adjustmentId}/reject"
      - "POST /orgs/{id}/adjustments/{adjustmentId}/apply"
      - "POST /orgs/{id}/reports — create report"
      - "POST /orgs/{id}/reports/{reportId}/finalize"
    shared_operations:
      - "POST /orgs/{id}/employees — create employee (shared with HRDirector)"
      - "GET on any org-scoped resource"

  - name: HRDirector
    description: "Presents finalized reports to the committee; can create employees"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /orgs/{id}/reports/{reportId}/present"
    shared_operations:
      - "POST /orgs/{id}/employees — create employee (shared with CompManager)"
      - "GET on any org-scoped resource"

  - name: CompCommitteeReviewer
    description: "Read-only committee reviewer"
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "GET on any org-scoped resource"

  - name: VendorAdmin
    description: "Survey vendor operator: creates orgs/vendors/surveys/benchmarks; opens/closes/accepts/rejects surveys; accepts/returns submissions; controls the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /orgs — create org"
      - "POST /orgs/{id}/vendors — create vendor"
      - "POST /orgs/{id}/vendors/{id}/activate"
      - "POST /orgs/{id}/vendors/{id}/terminate"
      - "POST /orgs/{id}/vendors/{id}/surveys — create survey"
      - "POST /orgs/{id}/surveys/{id}/open"
      - "POST /orgs/{id}/surveys/{id}/close"
      - "POST /orgs/{id}/surveys/{id}/accept"
      - "POST /orgs/{id}/surveys/{id}/reject"
      - "POST /orgs/{id}/surveys/{id}/benchmarks — create benchmark"
      - "POST /orgs/{id}/submissions/{submissionId}/accept"
      - "POST /orgs/{id}/submissions/{submissionId}/return"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET on any org-scoped resource"
