  - name: oversubscription_ceiling_on_acceptance
    claim_type: violation_to_error
    grounds:
    - validations[priority 14]
    - errors[ERR_OVERSUBSCRIPTION]
    excluded_because:
      difficulty_instance: boundary_precision_check / offering_fills_exactly_at_ceiling_then_next_unit_oversubscribes
      rationale: That §1.8 instance fills the offering to the cent and then asserts the next unit is refused with ERR_OVERSUBSCRIPTION.
  - name: wrap_week_in_future_rejected
    claim_type: priority_conflict
    grounds:
    - validations[priority 12]
    - errors[ERR_WRAP_WEEK_IN_FUTURE]
    - errors[ERR_WRAP_WEEK_OVERLAP]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / wrap_week_future_temporal_precedes_week_overlap_constraint
      rationale: That §1.8 instance violates the priority-12 future-week rule and the priority-13 overlap rule with one body and asserts the priority-12 error.
  - name: unaccredited_investor_cannot_be_accepted
    claim_type: cross_entity_validation
    grounds:
    - validations[priority 11]
    - errors[ERR_INVESTOR_NOT_ACCREDITED]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / investor_accreditation_safety_precedes_oversubscription_fiscal
      rationale: That §1.8 instance asserts ERR_INVESTOR_NOT_ACCREDITED wins over the fiscal ceiling on the same acceptance.
  - name: withdrawn_document_blocks_acceptance
    claim_type: cross_entity_validation
    grounds:
    - validations[priority 9]
    - errors[ERR_OFFERING_NOT_EFFECTIVE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / withdrawn_offering_document_blocks_subscription_acceptance
      rationale: That §1.8 instance asserts ERR_OFFERING_NOT_EFFECTIVE for a WITHDRAWN document and its EXPIRED sibling covers the deferred-to-priority-12 case.
  - name: uncertified_wraps_block_settlement
    claim_type: cross_entity_validation
    grounds:
    - validations[priority 9]
    - errors[ERR_UNCERTIFIED_WRAPS_EXIST]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / uncertified_wrap_blocks_closing_settlement_until_certified
      rationale: That §1.8 instance blocks settle on an uncertified wrap and then settles the notice after certification in the same trigger chain.
  - name: superseded_budget_blocks_certification
    claim_type: cross_entity_validation
    grounds:
    - validations[priority 9]
    - errors[ERR_OPERATING_BUDGET_CHANGED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / superseded_pinned_operating_budget_blocks_wrap_certification
