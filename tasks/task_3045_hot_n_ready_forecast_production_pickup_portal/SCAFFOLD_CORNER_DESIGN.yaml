        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_SHIFT_CONFLICT]
        distinguishing_aspect: "Small-footprint rule: two DIFFERENT crew members cannot hold the same station over overlapping windows — OVEN [600,780) for crew-A then OVEN [700,800) for crew-B conflicts even though the members differ."
