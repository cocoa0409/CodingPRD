  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: existence_beats_occ_on_missing_agreement_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]", "errors[ERR_AGREEMENT_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 3) is checked before OCC (priority 5): amending a nonexistent agreement id returns 404 ERR_AGREEMENT_NOT_FOUND, never a version error."
        test_recipe:
          setup: ["one parcel exists (only to source a version placeholder)"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "XP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { xp_v: $.data.version }
          trigger:
            - call: "POST /api/takedown-agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/amend"
              payload: { expected_agreement_version: "${xp_v}", price_cap_bp: 13000 }
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_AGREEMENT_NOT_FOUND (404), not any 412"

      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent without the X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/parcels"
              payload: { parcel_name: "NOAUTH", county: "Travis", earnest_money_cents: 100000 }
              captures: { err: $.data.error_id }
          assert:
            - "request carries no X-User-Role and no X-User-ID headers"
            - "captured err == ERR_UNAUTHENTICATED (401)"

      - name: duplicate_builder_license_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_BUILDER_LICENSE]"]
        distinguishing_aspect: "Second builder with the same license_number is rejected 409 ERR_DUPLICATE_BUILDER_LICENSE; a different license succeeds."
        test_recipe:
          setup: ["Builder B1 with license LIC-DUP exists"]
