  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: nonlinear_estimate_reject_resubmit_cycle_bounded_at_two
        grounds:
          - state_machines.BreakageEstimate.DRAFT_to_SUBMITTED
          - state_machines.BreakageEstimate.SUBMITTED_to_REJECTED
          - state_machines.BreakageEstimate.REJECTED_to_SUBMITTED
          - entities.BreakageEstimate.fields.revision_count
          - validations[priority=86]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          BreakageEstimate is a BOUNDED CYCLE, not a forward-only ladder: the
          REJECTED -> SUBMITTED edge re-enters an already-visited state and is
          gated on revision_count < 2, so exactly two re-entries succeed
          (revision_count 1 then 2) and the third is rejected with
          ERR_REVISION_LIMIT_EXCEEDED while the estimate stays in REJECTED and
          estimated_redemption_rate_bp stays frozen at its creation-time 8200.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Cycle Core' ACTIVE: ssp_millicents_per_point 1200, per_issuance_point_cap 5000, breakage_method COHORT_WEIGHTED, historical_redemption_rate_bp 7500 (current_breakage_rate_bp 2500)."
            - "One StateExpiryRule TX; one Cohort C1 (observed 8200 bp, adjustment 0); Member M1 BASE/TX in C1."
            - "AccountingPeriod 2026-08 OPEN over [2026-08-01, 2026-09-01) holding one 5000-point lot (remaining gross 6000)."
            - "BreakageEstimate est1 created by u_acct_1 (rate 8200 bp), already SUBMITTED once and REJECTED once, so revision_count is still 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Cycle Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 5000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "Single-cohort Aug-2026 estimate", sensitivity_low_bp: 7700, sensitivity_high_bp: 8700 }
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
              captures: { est1_id: $.data.id }
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
            - call: "POST /breakage-estimates/${est1_id}/reject"
              payload: { rejection_reason: "Sample size not evidenced" }
              as: Controller
              as_user_id: "u_ctrl_1"
          trigger:
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
            - call: "POST /breakage-estimates/${est1_id}/reject"
              payload: { rejection_reason: "Cohort mapping still unsupported" }
              as: Controller
              as_user_id: "u_ctrl_1"
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
            - call: "POST /breakage-estimates/${est1_id}/reject"
              payload: { rejection_reason: "Memo still incomplete" }
              as: Controller
              as_user_id: "u_ctrl_1"
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
              captures: { err: $.data.error_id }
          assert:
            - "The first trigger submit returns 200; BreakageEstimate.${est1_id}.state == SUBMITTED and revision_count == 1"
            - "The second trigger submit returns 200; BreakageEstimate.${est1_id}.state == SUBMITTED and revision_count == 2"
            - "The third trigger submit returns HTTP 409 with error_id == ERR_REVISION_LIMIT_EXCEEDED"
            - "After the rejected attempt, BreakageEstimate.${est1_id}.state == REJECTED and revision_count is still exactly 2"
            - "BreakageEstimate.${est1_id}.rejection_reason == 'Memo still incomplete'"
            - "BreakageEstimate.${est1_id}.estimated_redemption_rate_bp == 8200 and breakage_rate_bp == 1800 across every cycle - the rate is never re-measured on resubmission"
            - "BreakageEstimate.${est1_id}.outstanding_points_at_estimate == 5000 and outstanding_gross_ssp_cents_at_estimate == 6000 and required_liability_cents == 4920 across every cycle"
            - "LoyaltyProgram.${prog_id}.current_breakage_rate_bp is still 2500 - no approval ever occurred"

      - name: nonlinear_pointlot_parallel_lifecycle_and_settlement_dimensions
        grounds:
          - state_machines.PointLot.OUTSTANDING_to_FULLY_REDEEMED
          - state_machines.PointLot.NOT_APPLICABLE_to_PENDING_SETTLEMENT
          - state_machines.PointLot.PENDING_SETTLEMENT_to_SETTLED
