  - rule_id: non_linear_state_machine
    instances:
      - name: contract_amendment_revert_cycle_hits_limit
        grounds:
          - state_machines.AgentContract.PENDING_COMPLIANCE_REVIEW_to_DRAFT
          - state_machines.AgentContract.DRAFT_to_PENDING_AGENCY_SIGNATURE
          - state_machines.StudentApplication.ISSUED_to_INVALIDATED
          - validations[priority=74]
          - errors[ERR_AMENDMENT_LIMIT_REACHED]
          - entities.AgentContract.fields.amendment_round
        distinguishing_aspect: |
          AgentContract.status is cyclic, not a DAG: PENDING_COMPLIANCE_REVIEW reverts to DRAFT
          three times (each revert bumping disclosure_template_version and invalidating only
          ISSUED disclosures while leaving ACKNOWLEDGED ones stale), and the fourth revert is
          refused by the amendment_round < 3 guard rather than by any state guard.
