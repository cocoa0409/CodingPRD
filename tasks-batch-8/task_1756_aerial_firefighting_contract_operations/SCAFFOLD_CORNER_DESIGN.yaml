  - section: calculations
    instances:
      - name: invoice_penalty_evaluation_order
        claim_type: correct_result
        grounds: ["calculations.invoice_net_composition", "entities.Invoice.fields.penalty_cents", "entities.InvoiceLineItem.fields.carrier_amount_cents"]
        distinguishing_aspect: "Mode (c) pinned evaluation order: penalty base is the availability subtotal (750000) computed BEFORE net; compliance 1/2 = 0.5 < 0.98 triggers penalty 37500; final net == 750000 + 540000 - 37500 == 1252500, and the PENALTY line (last in pinned generation order) carries -37500."
        test_recipe:
          setup:
            - "EU contract ACTIVE; carded aircraft+pilot; availability 2026-08-03 (570 min, compliant, 500000) and 2026-08-04 (07:00-11:45 = 285 min, short, 250000)"
            - "order qty 1 ACCEPTED; assignment 2026-08-02 08:00-10:00 ON_INCIDENT with sorties 1.05 h and 0.65 h on 2026-08-02 (flight subtotal 540000)"
