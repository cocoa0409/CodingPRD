# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Currency Transaction Reporting & Exemption Management
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7 using the claim-extraction-guide
# taxonomy. Stubs (excluded_because) cite the §1.8 instance that covers them.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: branch_creation_defaults_and_system_fields
        claim_type: creation_defaults
        grounds: [entities.Branch]
        distinguishing_aspect: "Branch created with only required inputs gets status ACTIVE, region null, version 1, and server-stamped id/created_at/updated_at."
        test_recipe:
          setup: ["empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { b_id: $.data.id, b_status: $.data.status, b_region: $.data.region, b_v: $.data.version }
          assert:
            - "b_status == 'ACTIVE'"
            - "b_region == null"
            - "b_v == 1"
            - "Branch.${b_id}.created_at == '2026-08-01T00:00:00.000Z' (logical clock default)"

      - name: customer_creation_tin_optional_defaults
        claim_type: creation_defaults
        grounds: [entities.Customer]
        distinguishing_aspect: "Customer without tin is created with tin null, status ACTIVE, structuring_referral_count 0, active_exemption_id null; customer_type is stored verbatim."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { legal_name: "No Tin Nancy", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c_id: $.data.id, c_tin: $.data.tin, c_st: $.data.status, c_ref: $.data.structuring_referral_count }
          assert:
            - "c_tin == null"
            - "c_st == 'ACTIVE'"
            - "c_ref == 0"
            - "Customer.${c_id}.active_exemption_id == null"

      - name: cash_transaction_computed_business_date
        claim_type: computed_fields
        grounds: [entities.CashTransaction.fields.business_date]
        distinguishing_aspect: "business_date is computed as the UTC date of occurred_at (23:30 stays the same UTC date); the client cannot supply it."
        test_recipe:
          setup: ["branch and customer exist; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Date Dan", tin: "10-1010101", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /cash-transactions"
              payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 500000, occurred_at: "2026-08-01T08:59:00Z" }
              as: Teller
              captures: { t_bd: $.data.business_date, t_st: $.data.status }
          assert:
            - "t_bd == '2026-08-01'"
            - "t_st == 'POSTED' (initial state)"

      - name: instrument_sale_computed_fee_record_retention
        claim_type: computed_fields
        grounds: [entities.MonetaryInstrumentSale.fields.fee_cents, entities.MonetaryInstrumentSale.fields.record_required, entities.MonetaryInstrumentSale.fields.retention_until]
        distinguishing_aspect: "A 500000-cent cashier's check: record_required true (band inclusive), fee_cents = max(150, 2500) = 2500, retention_until exactly occurred_at + 5 years."
        test_recipe:
          setup: ["branch and customer exist; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Sale Sally", tin: "20-2020202", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /monetary-instrument-sales"
              payload: { customer_id: "${c1}", branch_id: "${br1}", instrument_type: "CASHIERS_CHECK", amount_cents: 500000, occurred_at: "2026-08-01T08:00:00Z", purchaser_name: "Sally", purchaser_tin: "20-2020202", purchaser_address: "2 Oak Ave", purchaser_id_number: "PP-9" }
              as: Teller
              captures: { s_fee: $.data.fee_cents, s_req: $.data.record_required, s_ret: $.data.retention_until, s_st: $.data.status }
          assert:
            - "s_fee == 2500"
            - "s_req == true"
            - "s_ret == '2031-08-01T08:00:00Z'"
            - "s_st == 'RECORDED' (initial state)"

      - name: not_found_family_sweep_returns_entity_specific_404
        claim_type: not_found
        grounds: [entities.Customer, entities.CTR, entities.StructuringAlert, entities.ExaminationCase, entities.DailyCashAggregation, entities.ExaminationFinding, entities.CashTransaction, entities.MonetaryInstrumentSale, entities.ExemptionDesignation, entities.Branch]
        distinguishing_aspect: "Every single-GET with a random UUID returns the entity-specific 404 error id, never a generic one."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /customers/00000000-0000-0000-0000-000000000000", as: Teller, captures: { e1: $.data.error_id } }
            - { call: "GET /ctrs/00000000-0000-0000-0000-000000000000", as: Teller, captures: { e2: $.data.error_id } }
            - { call: "GET /structuring-alerts/00000000-0000-0000-0000-000000000000", as: Teller, captures: { e3: $.data.error_id } }
            - { call: "GET /examination-cases/00000000-0000-0000-0000-000000000000", as: Teller, captures: { e4: $.data.error_id } }
            - { call: "GET /daily-aggregations/00000000-0000-0000-0000-000000000000", as: Teller, captures: { e5: $.data.error_id } }
            - { call: "GET /examination-findings/00000000-0000-0000-0000-000000000000", as: Teller, captures: { e6: $.data.error_id } }
            - { call: "GET /cash-transactions/00000000-0000-0000-0000-000000000000", as: Teller, captures: { e7: $.data.error_id } }
            - { call: "GET /monetary-instrument-sales/00000000-0000-0000-0000-000000000000", as: Teller, captures: { e8: $.data.error_id } }
            - { call: "GET /exemption-designations/00000000-0000-0000-0000-000000000000", as: Teller, captures: { e9: $.data.error_id } }
            - { call: "GET /branches/00000000-0000-0000-0000-000000000000", as: Teller, captures: { e10: $.data.error_id } }
          assert:
            - "e1 == 'ERR_CUSTOMER_NOT_FOUND'"
            - "e2 == 'ERR_CTR_NOT_FOUND'"
            - "e3 == 'ERR_ALERT_NOT_FOUND'"
            - "e4 == 'ERR_CASE_NOT_FOUND'"
            - "e5 == 'ERR_AGGREGATION_NOT_FOUND'"
            - "e6 == 'ERR_FINDING_NOT_FOUND'"
            - "e7 == 'ERR_TRANSACTION_NOT_FOUND'"
            - "e8 == 'ERR_INSTRUMENT_SALE_NOT_FOUND'"
            - "e9 == 'ERR_EXEMPTION_NOT_FOUND'"
            - "e10 == 'ERR_BRANCH_NOT_FOUND'"

      - name: fk_integrity_body_references_validated
        claim_type: parent_relationships
        grounds: [entities.CashTransaction.fields.customer_id, entities.CashTransaction.fields.branch_id]
        distinguishing_aspect: "POST /cash-transactions with a non-existent customer_id yields ERR_CUSTOMER_NOT_FOUND; with a valid customer but non-existent branch_id yields ERR_BRANCH_NOT_FOUND (customer checked first)."
        test_recipe:
          setup: ["one branch, one customer; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "FK Fran", tin: "30-3030303", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
          trigger:
            - { call: "POST /cash-transactions", payload: { customer_id: "00000000-0000-0000-0000-000000000000", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller, captures: { e1: $.data.error_id } }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "00000000-0000-0000-0000-000000000000", direction: "CASH_IN", amount_cents: 100, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller, captures: { e2: $.data.error_id } }
          assert:
            - "e1 == 'ERR_CUSTOMER_NOT_FOUND'"
            - "e2 == 'ERR_BRANCH_NOT_FOUND'"

      - name: list_pagination_limit_offset_has_more
        claim_type: listing
        grounds: [response_envelope, entities.CashTransaction]
        distinguishing_aspect: "With 3 posted transactions, limit=2 returns total_count 3, has_more true, 2 items; offset=2 returns 1 item, has_more false; default limit is 10."
        test_recipe:
          setup: ["one branch, one customer with three 100000-cent deposits on 2026-08-01; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Page Pat", tin: "40-4040404", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-08-01T07:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-08-01T07:05:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-08-01T07:10:00Z" }, as: Teller }
          trigger:
            - call: "GET /cash-transactions"
              payload: { customer_id: "${c1}", limit: 2, offset: 0 }
              as: Teller
              captures: { p1_total: $.meta.total_count, p1_more: $.meta.has_more }
            - call: "GET /cash-transactions"
              payload: { customer_id: "${c1}", limit: 2, offset: 2 }
              as: Teller
              captures: { p2_more: $.meta.has_more }
          assert:
            - "p1_total == 3 and p1_more == true and first page contains exactly 2 items"
            - "p2_more == false and second page contains exactly 1 item"

      - name: exemption_covers_flags_computed_from_type
        claim_type: computed_fields
        grounds: [entities.ExemptionDesignation.fields.covers_cash_in, entities.ExemptionDesignation.fields.covers_cash_out]
        distinguishing_aspect: "PHASE_II for BUSINESS_NONLISTED computes covers_cash_in=true/covers_cash_out=false; for PAYROLL_CUSTOMER the reverse; PHASE_I sets both true."
        test_recipe:
          setup: ["three customers of types BUSINESS_NONLISTED, PAYROLL_CUSTOMER, BANK; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /customers"
              payload: { legal_name: "Nonlisted Ned", customer_type: "BUSINESS_NONLISTED", account_opened_date: "2025-01-15T00:00:00Z" }
              as: BranchManager
              captures: { cn: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Payroll Pam", customer_type: "PAYROLL_CUSTOMER", account_opened_date: "2025-01-15T00:00:00Z" }
              as: BranchManager
              captures: { cp: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Sister Bank", customer_type: "BANK", account_opened_date: "2020-01-15T00:00:00Z" }
              as: BranchManager
              captures: { cb: $.data.id }
          trigger:
            - call: "POST /customers/${cn}/exemption-designations"
              payload: { phase: "PHASE_II" }
              as: BSAOfficer
              as_user_id: "officer-a"
              captures: { n_in: $.data.covers_cash_in, n_out: $.data.covers_cash_out, n_st: $.data.status }
            - call: "POST /customers/${cp}/exemption-designations"
              payload: { phase: "PHASE_II" }
              as: BSAOfficer
              as_user_id: "officer-a"
              captures: { p_in: $.data.covers_cash_in, p_out: $.data.covers_cash_out }
            - call: "POST /customers/${cb}/exemption-designations"
              payload: { phase: "PHASE_I" }
              as: BSAOfficer
              as_user_id: "officer-a"
              captures: { b_in: $.data.covers_cash_in, b_out: $.data.covers_cash_out }
          assert:
            - "n_in == true and n_out == false"
            - "p_in == false and p_out == true"
            - "b_in == true and b_out == true"
            - "n_st == 'PENDING_REVIEW' (initial state)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: ctr_superseded_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CTR]
        distinguishing_aspect: "A SUPERSEDED CTR rejects every action: validate, file, acknowledge all return ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["CTR filed then amended (original SUPERSEDED); clock 2026-08-01T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Lockdown Lou", tin: "50-5050505", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { ctr1: "$.data[0].id" }
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y" }
            - call: "GET /ctrs/${ctr1}"
              as: BSAOfficer
              captures: { ctr1_v: $.data.version }
            - { call: "POST /ctrs/${ctr1}/amendments", payload: { amendment_reason: "fix", expected_ctr_version: "${ctr1_v}" }, as: BSAOfficer, as_user_id: "officer-y" }
          trigger:
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x", captures: { e1: $.data.error_id } }
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y", captures: { e2: $.data.error_id } }
            - { call: "POST /ctrs/${ctr1}/acknowledge", payload: { regulator_tracking_id: "TRK-1" }, as: SystemAdmin, captures: { e3: $.data.error_id } }
          assert:
            - "e1 == 'ERR_INVALID_STATE_TRANSITION'"
            - "e2 == 'ERR_INVALID_STATE_TRANSITION'"
            - "e3 == 'ERR_INVALID_STATE_TRANSITION'"

      - name: ctr_voided_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CTR.DRAFT_to_VOIDED]
        distinguishing_aspect: "A CTR auto-VOIDED by the void cascade rejects validate with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["two deposits 700000 + 400000 create a DRAFT CTR; voiding the second drops the total to 700000 -> CTR VOIDED; same clock day"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Voided Vic", tin: "60-6060606", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 700000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - call: "POST /cash-transactions"
              payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 400000, occurred_at: "2026-08-01T08:05:00Z" }
              as: Teller
              captures: { txn2: $.data.id }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { ctr1: "$.data[0].id" }
            - { call: "POST /cash-transactions/${txn2}/void", payload: { void_reason: "error" }, as: Teller, as_user_id: "teller-1" }
          trigger:
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x", captures: { e1: $.data.error_id } }
          assert:
            - "e1 == 'ERR_INVALID_STATE_TRANSITION'"
            - "CTR.${ctr1}.status == 'VOIDED'"

      - name: ctr_acknowledge_requires_filed_and_acknowledge_happy_path
        claim_type: invalid_transition
        grounds: [state_machines.CTR.FILED_to_ACKNOWLEDGED]
        distinguishing_aspect: "Acknowledging a DRAFT CTR fails (ERR_INVALID_STATE_TRANSITION); acknowledging a FILED CTR sets status ACKNOWLEDGED with regulator_tracking_id and acknowledged_at."
        test_recipe:
          setup: ["two customers each with a DRAFT CTR (deposit 1100000 each); CTR-B validated and filed; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Ack Ann", tin: "70-7070707", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { ca: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Ack Ben", tin: "71-7171717", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { cb: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${ca}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${cb}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:05:00Z" }, as: Teller }
            - call: "GET /ctrs"
              payload: { customer_id: "${ca}" }
              as: BSAOfficer
              captures: { ctr_a: "$.data[0].id" }
            - call: "GET /ctrs"
              payload: { customer_id: "${cb}" }
              as: BSAOfficer
              captures: { ctr_b: "$.data[0].id" }
            - { call: "POST /ctrs/${ctr_b}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /ctrs/${ctr_b}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y" }
          trigger:
            - { call: "POST /ctrs/${ctr_a}/acknowledge", payload: { regulator_tracking_id: "TRK-A" }, as: SystemAdmin, captures: { e1: $.data.error_id } }
            - call: "POST /ctrs/${ctr_b}/acknowledge"
              payload: { regulator_tracking_id: "TRK-B" }
              as: SystemAdmin
              captures: { st: $.data.status, trk: $.data.regulator_tracking_id }
          assert:
            - "e1 == 'ERR_INVALID_STATE_TRANSITION' (DRAFT cannot be acknowledged)"
            - "st == 'ACKNOWLEDGED' and trk == 'TRK-B'"
            - "CTR.${ctr_b}.acknowledged_at == '2026-08-01T09:00:00.000Z'"

      - name: alert_referred_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.StructuringAlert]
        distinguishing_aspect: "A REFERRED alert is terminal: dismiss and reopen both fail; the referral also incremented customer.structuring_referral_count to 1."
        test_recipe:
          setup: ["branch, customer; manual alert OPEN -> UNDER_REVIEW -> REFERRED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Referred Ray", tin: "80-8080808", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "POST /structuring-alerts"
              payload: { customer_id: "${c1}", window_start_date: "2026-07-27", window_end_date: "2026-07-31", note: "tip" }
              as: BSAOfficer
              as_user_id: "officer-z"
              captures: { al1: $.data.id }
            - { call: "POST /structuring-alerts/${al1}/begin-review", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /structuring-alerts/${al1}/refer", payload: { referral_note: "pattern confirmed" }, as: BSAOfficer, as_user_id: "officer-z" }
          trigger:
            - { call: "POST /structuring-alerts/${al1}/dismiss", payload: { disposition_note: "no" }, as: BSAOfficer, as_user_id: "officer-z", captures: { e1: $.data.error_id } }
            - { call: "POST /structuring-alerts/${al1}/reopen", payload: { note: "no" }, as: BSAOfficer, as_user_id: "officer-z", captures: { e2: $.data.error_id } }
            - call: "GET /customers/${c1}"
