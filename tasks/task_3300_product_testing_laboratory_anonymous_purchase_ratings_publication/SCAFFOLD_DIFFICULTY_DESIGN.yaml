  - rule_id: resource_temporal_overlap
    instances:
      - name: survey_window_membership_boundary
        grounds: [calculations.grace_window, "validations[priority=10]"]
        distinguishing_aspect: "Interval semantics A (closed membership on a point-in-time window): submit_response at clock == field_end (closed bound) succeeds; one second after field_end rejected ERR_TEMPORAL_WINDOW. Resource: SurveyWave field window."
        test_recipe:
          setup: ["member ACTIVE with subscription; wave [2026-09-01, 2026-09-05], min_responses 2; clock at field_end exactly"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "w1@x.com", full_name: "W One" }
              as: Member
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/transitions"
              payload: { action: "add_subscription", plan_tier: "DIGITAL", term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /product-categories"
              payload: { name: "Dryers", refresh_cycle_months: 24, market_share_pct: 20, member_interest_pct: 20 }
              as: LabManager
              captures: { cat_id: $.data.id }
            - call: "POST /survey-waves"
              payload: { category_id: "${cat_id}", field_start: "2026-09-01T00:00:00Z", field_end: "2026-09-05T00:00:00Z", min_responses: 2 }
              as: SurveyDirector
              captures: { wave_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: LabManager
          trigger:
            - call: "POST /survey-waves/${wave_id}/transitions"
              payload: { action: "submit_response", member_id: "${m1_id}", model_label: "Dry1", reliability_score: 70, satisfaction_score: 80 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { rc: $.data.response_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:01Z" }
              as: LabManager
            - call: "POST /survey-waves/${wave_id}/transitions"
              payload: { action: "submit_response", member_id: "${m1_id}", model_label: "Dry1", reliability_score: 70, satisfaction_score: 80 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first submit at exactly field_end succeeds (closed upper bound), response_count == 1"
            - "second submit one second after field_end -> error_id == ERR_TEMPORAL_WINDOW"
      - name: grace_interval_closed_end
        grounds: [calculations.grace_window, state_machines.Member.ACTIVE_to_LAPSED]
        distinguishing_aspect: "Interval semantics B (closed end on a derived grace interval): at clock == grace_until the subscription is still GRACE (renew succeeds); at grace_until + 1s cycle run flips it EXPIRED and member LAPSED. Different resource (MembershipSubscription) and different semantics (derived adjacent interval vs field window)."
        test_recipe:
          setup: ["member with DIGITAL subscription term_end 2026-09-02 (grace_until 2026-09-16T00:00:00Z); clock advanced to 2026-09-10 (GRACE after cycle), then to exactly grace_until"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "g1@x.com", full_name: "G One" }
              as: Member
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/transitions"
              payload: { action: "add_subscription", plan_tier: "DIGITAL", term_start: "2026-09-01T00:00:00Z", term_end: "2026-09-02T00:00:00Z" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: LabManager
            - call: "POST /_cycle/run"
              payload: {}
              as: LabManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: LabManager
          trigger:
            - call: "POST /_cycle/run"
              payload: {}
              as: LabManager
              captures: { transitioned: $.data.subscriptions_transitioned }
            - call: "POST /members/${m1_id}/transitions"
              payload: { action: "renew", subscription_id: "1", term_end: "2027-09-16T00:00:00Z" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { subs: $.data.subscriptions }
          assert:
            - "cycle run at clock == grace_until transitions nothing (closed end: still GRACE), subscriptions_transitioned == 0"
            - "renew at clock == grace_until succeeds from GRACE; renewal_count == 1"
            - "advancing clock to 2026-09-16T00:00:01Z and running cycle would instead flip EXPIRED (verified in corner design)"
