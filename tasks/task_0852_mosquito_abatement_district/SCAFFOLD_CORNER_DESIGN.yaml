scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_create_service_area_applies_all_declared_defaults
        claim_type: Defaults
        grounds:
          - endpoints[POST /service-areas]
          - entities.ServiceArea.fields.risk_posture
          - entities.ServiceArea.fields.request_total_count
        distinguishing_aspect: "A freshly created ServiceArea must read risk_posture NORMAL, posture_source NO_ASSESSMENT, latest_confirmed_vector_index 0.00, seasonal_application_count 0, all four request counters 0 and version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock left at its 2026-05-01T00:00:00.000Z startup default."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
          trigger:
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: DistrictAdmin
          assert:
            - "ServiceArea.${area_id}.risk_posture == NORMAL"
            - "ServiceArea.${area_id}.posture_source == NO_ASSESSMENT"
            - "ServiceArea.${area_id}.latest_confirmed_vector_index == 0.00"
            - "ServiceArea.${area_id}.seasonal_application_count == 0"
            - "ServiceArea.${area_id}.request_total_count == 0"
            - "ServiceArea.${area_id}.request_open_count == 0"
            - "ServiceArea.${area_id}.request_resolved_count == 0"
            - "ServiceArea.${area_id}.request_closed_count == 0"
            - "ServiceArea.${area_id}.version == 1"
            - "HTTP status == 200"

      - name: corner_create_service_area_missing_code_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting the required `code` field from POST /service-areas returns ERR_VALIDATION with HTTP 422 and creates nothing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /service-areas"
              payload: { name: "Nameless Zone", season_start_date: "2026-05-01", population: 100 }
              as: DistrictAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: corner_get_trap_site_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_TRAP_SITE_NOT_FOUND]
        distinguishing_aspect: "GET /trap-sites/{id} with a well-formed but unknown UUID returns ERR_TRAP_SITE_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Empty database apart from the clock being set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
          trigger:
            - call: "GET /trap-sites/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: AbatementManager
              as_user_id: "u-mgr-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_TRAP_SITE_NOT_FOUND"
            - "HTTP status == 404"

      - name: corner_sensitive_site_buffer_defaults_per_site_type
        claim_type: Computed Fields
        grounds:
          - entities.SensitiveSite.fields.buffer_meters
          - constants.SENSITIVE_SITE_BUFFER_METERS_APIARY
          - constants.SENSITIVE_SITE_BUFFER_METERS_SCHOOL
        distinguishing_aspect: "With buffer_meters_override omitted, an APIARY gets buffer_meters 1600, an ORGANIC_FARM 800 and a SCHOOL 400, taken from the per-type constant table."
        test_recipe:
          setup:
            - "ServiceArea NW1 exists; three sensitive sites of different types are registered without an override."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /service-areas/${area_id}/sensitive-sites"
              payload: { site_type: "APIARY", operator_name: "Bee Bright Apiary", contact_email: "bees@example.com", x_m: 100, y_m: 100 }
              as: DistrictAdmin
              captures: { apiary_buffer: $.data.buffer_meters, apiary_id: $.data.id }
            - call: "POST /service-areas/${area_id}/sensitive-sites"
              payload: { site_type: "ORGANIC_FARM", operator_name: "Green Row Farm", contact_email: "farm@example.com", x_m: 200, y_m: 200 }
              as: DistrictAdmin
              captures: { farm_buffer: $.data.buffer_meters }
            - call: "POST /service-areas/${area_id}/sensitive-sites"
              payload: { site_type: "SCHOOL", operator_name: "Elm Street Primary", contact_email: "school@example.com", x_m: 300, y_m: 300 }
              as: DistrictAdmin
              captures: { school_buffer: $.data.buffer_meters }
          assert:
            - "${apiary_buffer} == 1600"
            - "${farm_buffer} == 800"
            - "${school_buffer} == 400"
            - "SensitiveSite.${apiary_id}.registered_on == 2026-06-01"

      - name: corner_sensitive_site_buffer_override_wins_over_type_default
        claim_type: Defaults
        grounds:
          - entities.SensitiveSite.fields.buffer_meters_override
          - entities.SensitiveSite.fields.buffer_meters
        distinguishing_aspect: "Supplying buffer_meters_override 2500 on an APIARY makes buffer_meters 2500, overriding the 1600 default for that type."
        test_recipe:
          setup:
            - "ServiceArea NW1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /service-areas/${area_id}/sensitive-sites"
              payload: { site_type: "APIARY", operator_name: "Bee Bright Apiary", contact_email: "bees@example.com", x_m: 100, y_m: 100, buffer_meters_override: 2500 }
              as: DistrictAdmin
              captures: { site_id: $.data.id, buffer: $.data.buffer_meters }
          assert:
            - "${buffer} == 2500"
            - "SensitiveSite.${site_id}.buffer_meters_override == 2500"

      - name: corner_trap_site_invalid_trap_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=6]
          - entities.TrapSite.fields.trap_type
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "trap_type outside {CDC_LIGHT, GRAVID, BG_SENTINEL} is rejected with ERR_VALIDATION (422) and no TrapSite row is created."
        test_recipe:
          setup:
            - "ServiceArea NW1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /service-areas/${area_id}/trap-sites"
              payload: { site_code: "T-001", trap_type: "OVITRAP", habitat: "URBAN", x_m: 0, y_m: 0 }
              as: DistrictAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: corner_lab_pool_above_pool_max_mosquitoes_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=6]
          - constants.POOL_MAX_MOSQUITOES
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "pool_size 51 exceeds POOL_MAX_MOSQUITOES (50) and is rejected with ERR_VALIDATION, while pool_size exactly 50 is accepted."
        test_recipe:
          setup:
            - "ServiceArea NW1 with one trap site and one SUBMITTED collection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-areas/${area_id}/trap-sites"
              payload: { site_code: "T-001", trap_type: "GRAVID", habitat: "URBAN", x_m: 0, y_m: 0 }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /trap-sites/${site_id}/collections"
              payload: { collection_date: "2026-05-28", trap_nights: 1, female_count: 80, species: "CULEX_PIPIENS" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { coll_id: $.data.id }
            - call: "POST /trap-collections/${coll_id}/transitions"
              payload: { action: "SUBMIT" }
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /trap-collections/${coll_id}/lab-pools"
              payload: { pool_size: 51, assay: "RT_PCR" }
              as: LabAnalyst
              captures: { err_id: $.data.error_id }
            - call: "POST /trap-collections/${coll_id}/lab-pools"
              payload: { pool_size: 50, assay: "RT_PCR" }
              as: LabAnalyst
              captures: { pool_id: $.data.id }
          assert:
            - "${err_id} == ERR_VALIDATION"
            - "LabPool.${pool_id}.pool_size == 50"
            - "LabPool.${pool_id}.status == CREATED"
            - "TrapCollection.${coll_id}.pooled_mosquito_count == 50"
            - "TrapCollection.${coll_id}.status == POOLED"

      - name: corner_larval_inspection_is_immutable_without_version_field
        claim_type: Immutability
        grounds:
          - entities.LarvalInspection
          - endpoints[GET /service-areas/{id}/larval-inspections]
        distinguishing_aspect: "LarvalInspection is declared common_fields: false, so it exposes only id and created_at alongside its own fields — no version, no updated_at — and there is no update or delete endpoint for it."
        test_recipe:
          setup:
            - "ServiceArea NW1 with one ACTIVE applicator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-areas/${area_id}/larval-inspections"
              payload: { inspection_date: "2026-05-30", dips: 10, larvae_count: 25, habitat: "DITCH", treated_on_site: true }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "GET /service-areas/${area_id}/larval-inspections"
              payload: { habitat: "DITCH" }
              as: FieldTech
              as_user_id: "${tech_id}"
          assert:
            - "the returned LarvalInspection ${insp_id} exposes id and created_at but no version field and no updated_at field"
            - "LarvalInspection.${insp_id}.dips == 10"
            - "LarvalInspection.${insp_id}.larvae_count == 25"
            - "LarvalInspection.${insp_id}.treated_on_site == true"
            - "total_count == 1"

      - name: corner_collection_under_unknown_trap_site_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3]
          - errors[ERR_TRAP_SITE_NOT_FOUND]
        distinguishing_aspect: "POST /trap-sites/{id}/collections against an unknown trap_site_id returns ERR_TRAP_SITE_NOT_FOUND (404) even though the body itself is valid."
        test_recipe:
          setup:
            - "One ACTIVE applicator exists so the FieldTech identity resolves; no trap site with the requested id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
          trigger:
            - call: "POST /trap-sites/00000000-0000-4000-8000-0000000000aa/collections"
              payload: { collection_date: "2026-05-30", trap_nights: 1, female_count: 5, species: "OTHER" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_TRAP_SITE_NOT_FOUND"
            - "HTTP status == 404"

      - name: corner_flat_topology_body_fk_service_area_validated_on_plan_create
        claim_type: Creation
        grounds:
          - validations[priority=4]
          - entities.TreatmentPlan.fields.service_area_id
          - errors[ERR_SERVICE_AREA_NOT_FOUND]
        distinguishing_aspect: "In this flat topology the plan's service_area_id arrives in the BODY, and an unknown value returns ERR_SERVICE_AREA_NOT_FOUND (404) from the priority-4 body-FK check."
        test_recipe:
          setup:
            - "ServiceArea NW1 with a CONFIRMED RiskAssessment exists, but the plan is created against a different, non-existent area id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { area_v: $.data.version }
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-01", expected_service_area_version: "${area_v}" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /treatment-plans"
              payload: { service_area_id: "00000000-0000-4000-8000-0000000000bb", trigger_assessment_id: "${ra_id}", treatment_type: "LARVICIDE" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_SERVICE_AREA_NOT_FOUND"
            - "HTTP status == 404"

      - name: corner_service_request_list_pagination_reports_total_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /service-requests]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three requests in one area, GET /service-requests?service_area_id=&limit=2&offset=0 returns 2 items with total_count 3 and has_more true; offset 2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "ServiceArea NW1 with exactly three ServiceRequests, all in handling_status RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /service-requests"
              payload: { service_area_id: "${area_id}", reporter_contact: "a@example.com", category: "STANDING_WATER", description: "One", x_m: 1, y_m: 1 }
              as: Resident
              as_user_id: "u-res-1"
              captures: { req_a: $.data.id }
            - call: "POST /service-requests"
              payload: { service_area_id: "${area_id}", reporter_contact: "b@example.com", category: "ADULT_ACTIVITY", description: "Two", x_m: 2, y_m: 2 }
              as: Resident
              as_user_id: "u-res-2"
              captures: { req_b: $.data.id }
            - call: "POST /service-requests"
              payload: { service_area_id: "${area_id}", reporter_contact: "c@example.com", category: "DEAD_BIRD", description: "Three", x_m: 3, y_m: 3 }
              as: Resident
              as_user_id: "u-res-3"
              captures: { req_c: $.data.id }
          trigger:
            - call: "GET /service-requests"
              payload: { service_area_id: "${area_id}", limit: 2, offset: 0 }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "GET /service-requests"
              payload: { service_area_id: "${area_id}", limit: 2, offset: 2 }
              as: AbatementManager
              as_user_id: "u-mgr-1"
          assert:
            - "first page returns 2 items with total_count == 3 and has_more == true"
            - "second page returns 1 item with total_count == 3 and has_more == false"
            - "ServiceArea.${area_id}.request_total_count == 3"
            - "ServiceArea.${area_id}.request_open_count == 3"

      - name: corner_pagination_limit_above_maximum_rejected
        claim_type: Listing
        grounds:
          - validations[priority=6]
          - response_envelope.pagination_defaults
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100 and returns ERR_VALIDATION (422) rather than being silently clamped."
        test_recipe:
          setup:
            - "ServiceArea NW1 exists with no requests."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
          trigger:
            - call: "GET /service-requests"
              payload: { service_area_id: "${area_id}", limit: 101, offset: 0 }
              as: AbatementManager
              as_user_id: "u-mgr-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: corner_lab_pools_filtered_list_returns_only_that_collections_children
        claim_type: Retrieval
        grounds:
          - endpoints[GET /lab-pools]
          - entities.LabPool.fields.trap_collection_id
        distinguishing_aspect: "GET /lab-pools?trap_collection_id= returns exactly the two pools of that collection and none of the third pool belonging to a sibling collection."
        test_recipe:
          setup:
            - "One trap site with two SUBMITTED collections; the first carries two pools, the second carries one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-areas/${area_id}/trap-sites"
              payload: { site_code: "T-001", trap_type: "GRAVID", habitat: "URBAN", x_m: 0, y_m: 0 }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /trap-sites/${site_id}/collections"
              payload: { collection_date: "2026-05-28", trap_nights: 1, female_count: 40, species: "CULEX_PIPIENS" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { coll1_id: $.data.id }
            - call: "POST /trap-collections/${coll1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /trap-sites/${site_id}/collections"
              payload: { collection_date: "2026-05-29", trap_nights: 1, female_count: 20, species: "CULEX_PIPIENS" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { coll2_id: $.data.id }
            - call: "POST /trap-collections/${coll2_id}/transitions"
              payload: { action: "SUBMIT" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /trap-collections/${coll1_id}/lab-pools"
              payload: { pool_size: 20 }
              as: LabAnalyst
              captures: { p1: $.data.id }
            - call: "POST /trap-collections/${coll1_id}/lab-pools"
              payload: { pool_size: 20 }
              as: LabAnalyst
              captures: { p2: $.data.id }
            - call: "POST /trap-collections/${coll2_id}/lab-pools"
              payload: { pool_size: 20 }
              as: LabAnalyst
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /lab-pools"
              payload: { trap_collection_id: "${coll1_id}", limit: 10, offset: 0 }
              as: LabAnalyst
          assert:
            - "total_count == 2"
            - "the returned ids are exactly ${p1} and ${p2}, and ${p3} is absent"
            - "TrapCollection.${coll1_id}.pooled_mosquito_count == 40"
            - "TrapCollection.${coll2_id}.pooled_mosquito_count == 20"

      - name: corner_trap_collection_system_fields_ignore_client_intent
        claim_type: System Fields
        grounds:
          - entities.TrapCollection.fields.recorded_by_applicator_id
          - entities.TrapCollection.fields.status
          - endpoints[POST /trap-sites/{id}/collections]
        distinguishing_aspect: "recorded_by_applicator_id is taken from the X-User-ID header (not the body) and status is forced to LOGGED, with version 1 and all derived counters zero on creation."
        test_recipe:
          setup:
            - "ServiceArea NW1 with one trap site and two registered applicators."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_a: $.data.id }
            - call: "POST /applicators"
