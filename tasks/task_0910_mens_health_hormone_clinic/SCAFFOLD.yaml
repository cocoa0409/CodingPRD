  - { method: GET,  path: "/clinic/clinicians/{id}", description: "Get clinician", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: Clinician, side_effects: [] }

  # ---- Pharmacists ----
  - { method: POST, path: "/clinic/pharmacists", description: "Register a pharmacist", roles: [ClinicAdmin], code: 201, input: [full_name, license_number], output: Pharmacist, side_effects: [] }
  - { method: GET,  path: "/clinic/pharmacists/{id}", description: "Get pharmacist", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: Pharmacist, side_effects: [] }

  # ---- Patients ----
  - { method: POST, path: "/clinic/patients", description: "Intake a patient", roles: [ClinicAdmin, Clinician], code: 201, input: [full_name, date_of_birth, sex, email], output: Patient, side_effects: [] }
  - { method: GET,  path: "/clinic/patients/{id}", description: "Get patient", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: Patient, side_effects: [] }
  - { method: GET,  path: "/clinic/patients/{id}/monitoring-summary", description: "Computed monitoring risk (dual-variant)", roles: [ClinicAdmin, Clinician], code: 200, input: [], output: "{ provisional_risk_score: integer, comprehensive_risk_score: integer, monitoring_status: string, reviewed_panels_in_window: integer }", side_effects: [] }

  # ---- Membership Plans ----
  - { method: POST, path: "/clinic/membership-plans", description: "Create a membership plan (config)", roles: [ClinicAdmin], code: 201, input: [tier, monthly_fee_cents, cycle_days, included_refills_per_cycle, included_lab_draw_credits, refill_discount_pct, titration_visit_fee_cents], output: MembershipPlan, side_effects: [] }
  - { method: GET,  path: "/clinic/membership-plans/{id}", description: "Get membership plan", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: MembershipPlan, side_effects: [] }

  # ---- Memberships ----
  - { method: POST, path: "/clinic/memberships", description: "Create a membership (TRIAL/CURRENT)", roles: [ClinicAdmin], code: 201, input: [patient_id, plan_id], output: Membership, side_effects: ["lab_draw_credits_remaining := plan.included_lab_draw_credits", "cycle_anchor_date := clock_now"] }
  - { method: GET,  path: "/clinic/memberships/{id}", description: "Get membership", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: Membership, side_effects: [] }
  - { method: GET,  path: "/clinic/memberships", description: "List/filter memberships", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: ["patient_id?", "plan_id?"], output: "Membership[]", side_effects: [] }
  - { method: POST, path: "/clinic/memberships/{id}/activate", description: "Activate membership (record initial payment)", roles: [ClinicAdmin], code: 200, input: [], output: Membership, side_effects: ["subscription_status TRIAL -> ACTIVE"] }
  - { method: POST, path: "/clinic/memberships/{id}/record-payment", description: "Record a payment outcome (payment axis)", roles: [ClinicAdmin], code: 200, input: [outcome], output: Membership, side_effects: ["payment_status CURRENT <-> DELINQUENT"] }
  - { method: POST, path: "/clinic/memberships/{id}/change-plan", description: "Switch plan with mid-cycle proration", roles: [ClinicAdmin], code: 200, input: [new_plan_id], output: Membership, side_effects: ["plan_id := new_plan_id", "last_change_charge_cents := change_plan_proration"] }
  - { method: POST, path: "/clinic/memberships/{id}/cancel", description: "Cancel membership", roles: [ClinicAdmin], code: 200, input: [], output: Membership, side_effects: ["subscription_status -> CANCELLED"] }

  # ---- Draw Stations ----
  - { method: POST, path: "/clinic/draw-stations", description: "Create a phlebotomy station", roles: [ClinicAdmin], code: 201, input: [name, concurrent_capacity], output: DrawStation, side_effects: [] }
  - { method: GET,  path: "/clinic/draw-stations/{id}", description: "Get draw station", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: DrawStation, side_effects: [] }

  # ---- Lab Panels ----
  - { method: POST, path: "/clinic/lab-panels", description: "Order a lab panel", roles: [Clinician], code: 201, input: [patient_id, clinician_id, panel_type], output: LabPanel, side_effects: [] }
  - { method: GET,  path: "/clinic/lab-panels/{id}", description: "Get lab panel", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: LabPanel, side_effects: [] }
  - { method: GET,  path: "/clinic/lab-panels", description: "List/filter lab panels", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: ["patient_id?", "clinician_id?"], output: "LabPanel[]", side_effects: [] }
  - { method: POST, path: "/clinic/lab-panels/{id}/draw", description: "Mark panel drawn", roles: [Clinician, ClinicAdmin], code: 200, input: [], output: LabPanel, side_effects: ["status ORDERED -> DRAWN"] }
  - { method: POST, path: "/clinic/lab-panels/{id}/result", description: "Enter results", roles: [Clinician], code: 200, input: [total_testosterone_ng_dl, psa_ng_ml, hematocrit_pct, drawn_at], output: LabPanel, side_effects: ["status DRAWN -> RESULTED"] }
  - { method: POST, path: "/clinic/lab-panels/{id}/review", description: "Review results; may hold plan", roles: [Clinician], code: 200, input: [], output: LabPanel, side_effects: ["status RESULTED -> REVIEWED", "is_unsafe computed", "cascade: ACTIVE plan -> MONITORING_HOLD"] }

  # ---- Lab-Draw Appointments ----
  - { method: POST, path: "/clinic/lab-draw-appointments", description: "Book a lab-draw appointment (consumes a credit)", roles: [Patient, ClinicAdmin, Clinician], code: 201, input: [patient_id, draw_station_id, start_at, end_at], output: LabDrawAppointment, side_effects: ["capacity overlap check", "Membership.lab_draw_credits_remaining -= 1"] }
  - { method: GET,  path: "/clinic/lab-draw-appointments/{id}", description: "Get appointment", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: LabDrawAppointment, side_effects: [] }
  - { method: GET,  path: "/clinic/lab-draw-appointments", description: "List/filter appointments", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: ["patient_id?", "draw_station_id?"], output: "LabDrawAppointment[]", side_effects: [] }
  - { method: POST, path: "/clinic/lab-draw-appointments/{id}/complete", description: "Complete an appointment", roles: [Clinician, ClinicAdmin], code: 200, input: [], output: LabDrawAppointment, side_effects: ["status SCHEDULED -> COMPLETED"] }
  - { method: POST, path: "/clinic/lab-draw-appointments/{id}/cancel", description: "Cancel an appointment (refund credit)", roles: [Patient, ClinicAdmin, Clinician], code: 200, input: [], output: LabDrawAppointment, side_effects: ["status SCHEDULED -> CANCELLED", "Membership.lab_draw_credits_remaining += 1"] }

  # ---- Telehealth Visits ----
  - { method: POST, path: "/clinic/telehealth-visits", description: "Book a telehealth visit (clinician buffer check)", roles: [Patient, ClinicAdmin], code: 201, input: [patient_id, clinician_id, start_at, end_at, "reason?"], output: TelehealthVisit, side_effects: ["buffer overlap check on clinician"] }
  - { method: GET,  path: "/clinic/telehealth-visits/{id}", description: "Get visit", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: TelehealthVisit, side_effects: [] }
  - { method: GET,  path: "/clinic/telehealth-visits", description: "List/filter visits", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: ["patient_id?", "clinician_id?"], output: "TelehealthVisit[]", side_effects: [] }
  - { method: POST, path: "/clinic/telehealth-visits/{id}/complete", description: "Complete a visit", roles: [Clinician], code: 200, input: [], output: TelehealthVisit, side_effects: ["status SCHEDULED -> COMPLETED"] }
  - { method: POST, path: "/clinic/telehealth-visits/{id}/cancel", description: "Cancel a visit", roles: [Patient, ClinicAdmin, Clinician], code: 200, input: [], output: TelehealthVisit, side_effects: ["status SCHEDULED -> CANCELLED"] }

  # ---- Treatment Plans ----
  - { method: POST, path: "/clinic/treatment-plans", description: "Create a treatment plan (DRAFT)", roles: [Clinician], code: 201, input: [patient_id, clinician_id, baseline_panel_id, protocol_type, starting_dose_mg], output: TreatmentPlan, side_effects: [] }
  - { method: GET,  path: "/clinic/treatment-plans/{id}", description: "Get treatment plan", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: TreatmentPlan, side_effects: [] }
  - { method: GET,  path: "/clinic/treatment-plans", description: "List/filter treatment plans", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: ["patient_id?", "clinician_id?", "baseline_panel_id?"], output: "TreatmentPlan[]", side_effects: [] }
  - { method: POST, path: "/clinic/treatment-plans/{id}/activate", description: "Activate a plan", roles: [Clinician], code: 200, input: [], output: TreatmentPlan, side_effects: ["DRAFT -> ACTIVE", "current_dose_mg := starting_dose_mg"] }
  - { method: POST, path: "/clinic/treatment-plans/{id}/titrations", description: "Propose a dose titration (OCC)", roles: [Clinician], code: 201, input: [proposed_dose_mg, expected_plan_version], output: DoseTitration, side_effects: ["ACTIVE -> TITRATION_PENDING", "creates DoseTitration(PROPOSED)", "increments TreatmentPlan.version by 1"] }
  - { method: GET,  path: "/clinic/treatment-plans/{id}/titrations", description: "List titration rounds for a plan", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: "DoseTitration[]", side_effects: [] }
  - { method: POST, path: "/clinic/treatment-plans/{id}/titrations/{titrationId}/confirm", description: "Confirm and apply the pending titration", roles: [Clinician], code: 200, input: [], output: DoseTitration, side_effects: ["TITRATION_PENDING -> ACTIVE", "current_dose_mg := proposed_dose_mg", "round_index += 1", "increments TreatmentPlan.version by 1"] }
  - { method: POST, path: "/clinic/treatment-plans/{id}/suspend", description: "Suspend a plan (cascades)", roles: [Clinician, ClinicAdmin], code: 200, input: [], output: TreatmentPlan, side_effects: ["-> SUSPENDED", "cancel PROPOSED titrations", "cascade: prescription REVOKED -> refills CANCELLED"] }
  - { method: POST, path: "/clinic/treatment-plans/{id}/resume", description: "Resume from MONITORING_HOLD", roles: [Clinician], code: 200, input: [], output: TreatmentPlan, side_effects: ["MONITORING_HOLD -> ACTIVE", "SUSPENDED prescription -> ISSUED"] }

  # ---- Prescriptions ----
  - { method: POST, path: "/clinic/prescriptions", description: "Issue a controlled-substance prescription", roles: [Clinician], code: 201, input: [plan_id, patient_id, drug_name, unit_price_cents, quantity_per_fill, refills_authorized, "is_controlled?"], output: ControlledSubstancePrescription, side_effects: ["prescriber_id := X-User-ID", "refills_remaining := refills_authorized", "status := ISSUED"] }
  - { method: GET,  path: "/clinic/prescriptions/{id}", description: "Get prescription", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: ControlledSubstancePrescription, side_effects: [] }
  - { method: GET,  path: "/clinic/prescriptions", description: "List/filter prescriptions", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: ["plan_id?", "patient_id?", "prescriber_id?"], output: "ControlledSubstancePrescription[]", side_effects: [] }
  - { method: POST, path: "/clinic/prescriptions/{id}/revoke", description: "Revoke a prescription (cascades refills)", roles: [Clinician], code: 200, input: [], output: ControlledSubstancePrescription, side_effects: ["-> REVOKED", "cascade: PENDING_REVIEW refills CANCELLED"] }

  # ---- Refill Orders ----
  - { method: POST, path: "/clinic/refill-orders", description: "Request a refill (OCC on prescription)", roles: [Patient, ClinicAdmin], code: 201, input: [prescription_id, membership_id, patient_id, requested_quantity_units, expected_prescription_version], output: RefillOrder, side_effects: ["provisional_charge_cents computed", "increments ControlledSubstancePrescription.version by 1"] }
  - { method: GET,  path: "/clinic/refill-orders/{id}", description: "Get refill order", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: RefillOrder, side_effects: [] }
  - { method: GET,  path: "/clinic/refill-orders", description: "List/filter refill orders", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: ["prescription_id?", "membership_id?", "patient_id?"], output: "RefillOrder[]", side_effects: [] }
  - { method: POST, path: "/clinic/refill-orders/{id}/dispense", description: "Dispense a refill (final charge)", roles: [Pharmacist], code: 200, input: [dispensed_quantity_units], output: RefillOrder, side_effects: ["final_charge_cents computed", "prescription.refills_remaining -= 1", "prescription EXHAUSTED at 0"] }
  - { method: POST, path: "/clinic/refill-orders/{id}/cancel", description: "Cancel a pending refill", roles: [Patient, ClinicAdmin, Clinician], code: 200, input: [], output: RefillOrder, side_effects: ["-> CANCELLED"] }
  - { method: POST, path: "/clinic/refill-orders/{id}/reverse", description: "Reverse a dispensed refill (restore refill)", roles: [Pharmacist], code: 200, input: [], output: RefillOrder, side_effects: ["-> REVERSED", "prescription.refills_remaining += 1"] }

  # ---- Adverse Events ----
  - { method: POST, path: "/clinic/adverse-events", description: "Report an adverse event", roles: [Clinician, Patient], code: 201, input: [patient_id, plan_id, description, "reported_by?"], output: AdverseEvent, side_effects: [] }
  - { method: GET,  path: "/clinic/adverse-events/{id}", description: "Get adverse event", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: [], output: AdverseEvent, side_effects: [] }
  - { method: GET,  path: "/clinic/adverse-events", description: "List/filter adverse events", roles: [ClinicAdmin, Clinician, Pharmacist, Patient], code: 200, input: ["patient_id?", "plan_id?", "reported_by?"], output: "AdverseEvent[]", side_effects: [] }
  - { method: POST, path: "/clinic/adverse-events/{id}/triage", description: "Triage an event (segregation of duties)", roles: [Clinician], code: 200, input: [severity], output: AdverseEvent, side_effects: ["severity set", "SEVERE cascade: plan SUSPENDED -> prescription REVOKED -> refills CANCELLED"] }
  - { method: POST, path: "/clinic/adverse-events/{id}/resolve", description: "Resolve a triaged event", roles: [Clinician], code: 200, input: [], output: AdverseEvent, side_effects: ["-> RESOLVED"] }

  # ---- Logical clock (test-driving) ----
  - { method: POST, path: "/clinic/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock.", roles: [ClinicAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum, or out-of-range numeric" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not enabled from the resource's current state" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Titration proposal on a plan not in ACTIVE" }
  - { id: ERR_TITRATION_NOT_PENDING, http: 409, condition: "Confirm on a plan not in TITRATION_PENDING" }
  - { id: ERR_PANEL_NOT_RESULTED, http: 409, condition: "Result on a non-DRAWN panel or review on a non-RESULTED panel" }
  - { id: ERR_BASELINE_NOT_REVIEWED, http: 409, condition: "Plan activation while baseline panel is not REVIEWED" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "Operation requires subscription_status ACTIVE" }
  - { id: ERR_MEMBERSHIP_DELINQUENT, http: 402, condition: "Refill create while payment_status is DELINQUENT" }
  - { id: ERR_INSUFFICIENT_LAB_DRAW_CREDITS, http: 402, condition: "Booking a lab-draw with zero credits remaining" }
  - { id: ERR_PATIENT_MISMATCH, http: 409, condition: "Prescription patient_id differs from referenced plan.patient_id" }
  - { id: ERR_CLINICIAN_MISMATCH, http: 403, condition: "Acting clinician does not own the plan" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Adverse-event triage reviewer equals the plan's prescribing clinician" }
  - { id: ERR_MONITORING_OVERDUE, http: 422, condition: "No REVIEWED panel within MONITORING_WINDOW_DAYS at prescribe time" }
  - { id: ERR_HEMATOCRIT_UNSAFE, http: 422, condition: "Latest REVIEWED panel hematocrit_pct >= 54.0 (or unsafe) at titration confirm/resume" }
  - { id: ERR_CLINICIAN_DOUBLE_BOOKED, http: 409, condition: "Telehealth interval within buffer of another SCHEDULED visit for the clinician" }
  - { id: ERR_DRAW_STATION_AT_CAPACITY, http: 409, condition: "Overlapping SCHEDULED lab-draw appointments >= station concurrent_capacity" }
  - { id: ERR_PRESCRIPTION_SUSPENDED, http: 409, condition: "Refill create/dispense against a SUSPENDED/REVOKED prescription" }
  - { id: ERR_REFILL_NOT_DISPENSABLE, http: 409, condition: "Dispense on a refill order not in PENDING_REVIEW" }
  - { id: ERR_NO_REFILLS_REMAINING, http: 409, condition: "Dispense when prescription.refills_remaining == 0" }
  - { id: ERR_APPOINTMENT_NOT_SCHEDULED, http: 409, condition: "Complete/cancel on an appointment not in SCHEDULED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Operational back-office: clinician/pharmacist/plan/station registration, memberships, billing, clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /clinic/clinicians, /clinic/pharmacists, /clinic/membership-plans, /clinic/draw-stations"
      - "POST /clinic/memberships and its /activate /record-payment /change-plan /cancel"
      - "POST /clinic/_clock/set_current_utc"
    shared_operations:
      - "POST /clinic/patients (with Clinician)"
      - "POST /clinic/lab-draw-appointments, /clinic/telehealth-visits and their cancel"
      - "POST /clinic/lab-panels/{id}/draw, /clinic/lab-draw-appointments/{id}/complete"
      - "POST /clinic/treatment-plans/{id}/suspend"
      - "All GET reads"

  - name: Clinician
    description: "Prescriber: intake, labs, plans, titration, prescribing, adverse-event review."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /clinic/lab-panels and its /result /review"
      - "POST /clinic/treatment-plans and its /activate /titrations /confirm /resume"
      - "POST /clinic/prescriptions and /revoke"
      - "POST /clinic/adverse-events/{id}/triage and /resolve"
      - "POST /clinic/telehealth-visits/{id}/complete"
    shared_operations:
      - "POST /clinic/patients (with ClinicAdmin)"
      - "POST /clinic/lab-panels/{id}/draw (with ClinicAdmin)"
      - "POST /clinic/lab-draw-appointments (+ complete/cancel), /clinic/adverse-events (report)"
      - "POST /clinic/treatment-plans/{id}/suspend, /clinic/refill-orders/{id}/cancel, /clinic/telehealth-visits/{id}/cancel"
      - "All GET reads"

  - name: Pharmacist
    description: "Dispensing pharmacy: dispense and reverse refill orders."
    identity: "entity_backed:Pharmacist"
    exclusive_operations:
      - "POST /clinic/refill-orders/{id}/dispense"
      - "POST /clinic/refill-orders/{id}/reverse"
    shared_operations:
      - "All GET reads"

  - name: Patient
    description: "Self-service: book telehealth/lab-draw, request/cancel refills, report adverse events."
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "POST /clinic/telehealth-visits (+ cancel), /clinic/lab-draw-appointments (+ cancel)"
      - "POST /clinic/refill-orders (+ cancel)"
      - "POST /clinic/adverse-events (report)"
      - "GET reads of own resources"
