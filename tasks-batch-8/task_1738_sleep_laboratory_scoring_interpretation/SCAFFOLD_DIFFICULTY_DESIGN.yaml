            - { call: "POST /referral-orders/${oa}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-A", approved_nights: 1, window_start: "2026-08-01", window_end: "2026-08-10", expected_referral_order_version: "${oa_v}" }, as: Scheduler, captures: { aa: $.data.id } }
            - { call: "POST /authorizations/${aa}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "PSG_DIAGNOSTIC", icd10_primary: "G47.33" }, as: Scheduler, captures: { ob: $.data.id, ob_v: $.data.version } }
            - { call: "POST /referral-orders/${ob}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-B", approved_nights: 1, window_start: "2026-08-01", window_end: "2026-08-31", expected_referral_order_version: "${ob_v}" }, as: Scheduler, captures: { ab: $.data.id } }
            - { call: "POST /authorizations/${ab}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
