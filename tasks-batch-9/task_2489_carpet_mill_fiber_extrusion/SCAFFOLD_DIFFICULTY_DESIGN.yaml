              payload: { sbr_pct: 60.0, filler_load_pct: 20.0, cure_temp_c: 130, cure_seconds: 120, secondary_backing_type: "ACTION_BAC" }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/recoat"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/roll-goods"
              payload: { roll_number: "RG-01", width_ft: 12.0, initial_yards: 200.0 }
              as: MillPlanner
          assert:
            - "after the first apply-backing, ProductionRun.${pr}.delamination_strength_lbf == 1.80 and ProductionRun.${pr}.status == BACKING_FAILED and ProductionRun.${pr}.recoat_count == 0"
            - "after the first recoat, ProductionRun.${pr}.status == GREIGE, ProductionRun.${pr}.recoat_count == 1 and ProductionRun.${pr}.delamination_strength_lbf is null"
            - "after the first recoat, ProductionRun.${pr}.greige_yards == 400.0 and ProductionRun.${pr}.face_weight_oz_per_sy == 32.04 — the greige result survives the loop"
            - "after the second apply-backing, ProductionRun.${pr}.delamination_strength_lbf == 1.82 and ProductionRun.${pr}.status == BACKING_FAILED"
            - "the second recoat returns HTTP 409 with data.error_id == ERR_RECOAT_LIMIT_REACHED"
            - "after the refused recoat, ProductionRun.${pr}.status == BACKING_FAILED and ProductionRun.${pr}.recoat_count == 1 — unchanged"
            - "the roll-goods call returns HTTP 409 with data.error_id == ERR_RUN_NOT_BACKED and no RollGood with roll_number RG-01 exists"

  # =========================================================================
  # RULE 4 — transitive_cascade
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dye_lot_rejection_five_hop_cascade_to_style_replenishment_flag
        grounds:
          - state_machines.DyeLot.APPROVED_to_REJECTED
          - state_machines.RollGood.qa_PASSED_to_qa_FAILED
          - state_machines.CutOrder.ALLOCATED_to_BACKORDERED
          - calculations.style_backorder_posture
          - calculations.dye_lot_uncommitted_yards
          - entities.CutAllocation.fields.status
          - entities.CarpetStyle.fields.open_backorder_yards
          - entities.CarpetStyle.fields.replenishment_flag
        distinguishing_aspect: |
          A single dye-lot REJECT propagates five causally chained hops — RollGood scrapped ->
          CutAllocation VOIDED -> CutOrder ALLOCATED to BACKORDERED -> CarpetStyle.open_backorder_yards
          recomputed to 300.0 -> replenishment_flag REPLENISH_REQUIRED — where each hop is caused by
          the previous one, not by the trigger directly.
        test_recipe:
          setup:
            - "Piece-dyed style ST-PD-01 ACTIVE at 4275 cents/yard with an effective DOC_FF_1_70 certificate and replenishment_flag NONE."
            - "DyeLot DL-01 APPROVED, shade band A, dyed_yards 400.0, scrapped_yards 0.0."
            - "RollGood RG-01 (400.0 yards, dye_lot_id DL-01) qa_status PASSED, fully committed to CutOrder CO-01."
            - "CutOrder CO-01 for 300.0 yards in status ALLOCATED with one RESERVED CutAllocation of 300.0 yards."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-PD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "PIECE_DYED", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 60, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/dye-vessels"
              payload: { vessel_code: "DV-01", vessel_type: "BECK", capacity_kg: 2000.0 }
              as: DyeHouseOperator
              captures: { dv: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/apply-backing"
              payload: { sbr_pct: 80.0, filler_load_pct: 20.0, cure_temp_c: 150, cure_seconds: 120, secondary_backing_type: "ACTION_BAC" }
              as: MillPlanner
            - call: "POST /mill/dye-lots"
              payload: { lot_code: "DL-01", production_run_id: "${pr}", vessel_id: "${dv}", color_code: "C-SANDSTONE", target_lab_l: 55.00, target_lab_a: 12.00, target_lab_b: -8.00, lot_kg: 400.0, dye_start_utc: "2026-08-06T08:00:00Z", dye_end_utc: "2026-08-06T14:00:00Z", dyed_yards: 400.0 }
              as: DyeHouseOperator
              captures: { dl: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/dye-lots/${dl}/start-dyeing"
              payload: {}
              as: DyeHouseOperator
              captures: { dl_v: $.data.version }
            - call: "POST /mill/dye-lots/${dl}/measurements"
              payload: { measured_lab_l: 55.48, measured_lab_a: 12.64, measured_lab_b: -8.00, expected_dye_lot_version: "${dl_v}" }
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl}/disposition"
              payload: { disposition: "APPROVE" }
              as: DyeHouseOperator
            - call: "POST /mill/production-runs/${pr}/roll-goods"
              payload: { roll_number: "RG-01", width_ft: 12.0, initial_yards: 400.0, dye_lot_id: "${dl}" }
              as: MillPlanner
              captures: { rg: $.data.id }
            - call: "POST /mill/product-tests"
              payload: { style_id: "${st}", roll_good_id: "${rg}", test_type: "FLAMMABILITY_PILL", result_value: 18.0 }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
              captures: { pt: $.data.id }
            - call: "POST /mill/certifications"
              payload: { style_id: "${st}", cert_type: "DOC_FF_1_70", source_test_ids: ["${pt}"], expires_at_utc: "2027-08-01T00:00:00Z" }
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
            - call: "POST /mill/roll-goods/${rg}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 100000000 }
              as: MillPlanner
              captures: { acct: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 300.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co: $.data.id }
            - call: "POST /mill/cut-orders/${co}/allocate"
              payload: {}
              as: MillPlanner
            - call: "GET /mill/cut-allocations"
              payload: { cut_order_id: "${co}" }
              as: MillPlanner
              captures: { alloc: "$.data[0].id" }
          trigger:
            - call: "POST /mill/dye-lots/${dl}/disposition"
              payload: { disposition: "REJECT" }
              as: DyeHouseOperator
          assert:
            - "DyeLot.${dl}.status == REJECTED"
            - "hop 1: RollGood.${rg}.qa_status == FAILED, RollGood.${rg}.inventory_status == SCRAPPED and RollGood.${rg}.available_yards == 0.0"
            - "hop 1: DyeLot.${dl}.scrapped_yards == 400.0, DyeLot.${dl}.uncommitted_yards == 0.0 and DyeLot.${dl}.shipped_basis_uncommitted_yards == 0.0"
            - "hop 2: CutAllocation.${alloc}.status == VOIDED"
            - "hop 3: CutOrder.${co}.status == BACKORDERED and CutOrder.${co}.allocated_yards == 0.0"
            - "hop 3: CutOrder.${co}.gross_cents == 0, CutOrder.${co}.freight_cents == 0 and CutOrder.${co}.net_invoice_cents == 0"
            - "hop 4: CarpetStyle.${st}.open_backorder_yards == 300.0"
            - "hop 5: CarpetStyle.${st}.replenishment_flag == REPLENISH_REQUIRED"
            - "CutOrder.${co}.reserved_credit_cents == 1282500 and Account.${acct}.credit_used_cents == 1282500 — the credit hold follows requested_yards and is untouched by the cascade"

      - name: style_discontinue_three_hop_cascade_releases_account_credit_hold
        grounds:
          - state_machines.CarpetStyle.ACTIVE_to_RUNOUT
          - state_machines.CutOrder.SUBMITTED_to_CANCELLED
          - state_machines.Account.CREDIT_HOLD_to_ACTIVE
          - calculations.account_credit_ledger
          - calculations.cut_order_credit_reservation
          - entities.CutOrder.fields.order_type
          - entities.Account.fields.credit_used_cents
        distinguishing_aspect: |
          A different trigger (style discontinuation) drives a shorter three-hop chain in a different
          entity domain — CutOrder CANCELLED -> Account.credit_used_cents decremented -> Account
          CREDIT_HOLD to ACTIVE — and it is selective: only the two CUSTOM orders are cancelled while
          the RUNNING_LINE order keeps its 42750-cent hold.
        test_recipe:
          setup:
            - "Style ST-SD-01 ACTIVE at 4275 cents/yard with no ProductionRun."
            - "Account AC-01 with credit_limit_cents 1000000."
            - "CutOrder CO-01 (CUSTOM, 120.0 yards, hold 513000) and CO-03 (RUNNING_LINE, 10.0 yards, hold 42750) submitted while the account is ACTIVE."
            - "CutOrder CO-02 (CUSTOM, 120.0 yards, hold 513000) pushes credit_used_cents to 1069350 >= the limit, so Account AC-01 is in CREDIT_HOLD."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "BUILDER", credit_limit_cents: 1000000 }
              as: MillPlanner
              captures: { acct: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${acct}", style_id: "${st}", order_type: "CUSTOM", requested_yards: 120.0, shade_tolerance: "SINGLE_LOT" }
              as: MillPlanner
              captures: { co1: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-03", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 10.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co3: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-02", account_id: "${acct}", style_id: "${st}", order_type: "CUSTOM", requested_yards: 120.0, shade_tolerance: "SINGLE_LOT" }
              as: MillPlanner
              captures: { co2: $.data.id }
          trigger:
            - call: "POST /mill/styles/${st}/discontinue"
              payload: { reason: "style runout announced" }
              as: MillPlanner
          assert:
            - "before the trigger, Account.${acct}.credit_used_cents == 1069350 and Account.${acct}.status == CREDIT_HOLD"
            - "CarpetStyle.${st}.status == RUNOUT"
            - "hop 1: CutOrder.${co1}.status == CANCELLED and CutOrder.${co2}.status == CANCELLED"
            - "hop 2: CutOrder.${co1}.reserved_credit_cents == 0 and CutOrder.${co2}.reserved_credit_cents == 0"
            - "hop 2: Account.${acct}.credit_used_cents == 42750"
            - "hop 3: Account.${acct}.status == ACTIVE"
            - "CutOrder.${co3}.status == SUBMITTED and CutOrder.${co3}.reserved_credit_cents == 42750 — the RUNNING_LINE order is not part of the cascade"

  # =========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: account_credit_hold_state_beats_credit_limit_fiscal_on_order_create
        grounds:
          - validations[priority=9]
          - validations[priority=30]
          - errors[ERR_ACCOUNT_CREDIT_HOLD]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
          - state_machines.Account.ACTIVE_to_CREDIT_HOLD
          - state_machines.Account.CREDIT_HOLD_to_ACTIVE
          - calculations.cut_order_credit_reservation
        distinguishing_aspect: |
          Category pair state (priority 9) versus business_fiscal (priority 30): the second order
          violates both the CREDIT_HOLD posture and the credit ceiling, and the response is
          409/ERR_ACCOUNT_CREDIT_HOLD, never 422/ERR_CREDIT_LIMIT_EXCEEDED; raising the limit clears
          only the state gate and the same request then succeeds.
        test_recipe:
          setup:
            - "Style ST-SD-01 ACTIVE at 4275 cents/yard."
            - "Account AC-01 with credit_limit_cents 513000, driven into CREDIT_HOLD by CO-01 for 120.0 yards (hold exactly 513000)."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 513000 }
              as: MillPlanner
              captures: { acct: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 120.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co1: $.data.id }
          trigger:
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-02", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 200.0, shade_tolerance: "ANY" }
              as: MillPlanner
            - call: "PATCH /mill/accounts/${acct}"
              payload: { credit_limit_cents: 2000000 }
              as: MillPlanner
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-02", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 200.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co2: $.data.id }
          assert:
            - "before the trigger, Account.${acct}.credit_used_cents == 513000 and Account.${acct}.status == CREDIT_HOLD"
            - "the first CO-02 attempt returns HTTP 409 with data.error_id == ERR_ACCOUNT_CREDIT_HOLD"
            - "the first CO-02 attempt does NOT return data.error_id == ERR_CREDIT_LIMIT_EXCEEDED even though 513000 + 855000 > 513000"
            - "after the first attempt, no CutOrder with order_code CO-02 exists and Account.${acct}.credit_used_cents == 513000"
            - "after the PATCH, Account.${acct}.credit_limit_cents == 2000000 and Account.${acct}.status == ACTIVE"
            - "the second CO-02 attempt returns HTTP 201 with CutOrder.${co2}.reserved_credit_cents == 855000"
            - "after the second attempt, Account.${acct}.credit_used_cents == 1368000 and Account.${acct}.status == ACTIVE"

      - name: flammability_cert_safety_beats_no_eligible_rolls_referential_on_allocate
        grounds:
          - validations[priority=11]
          - validations[priority=28]
          - errors[ERR_FLAMMABILITY_CERT_REQUIRED]
          - errors[ERR_NO_ELIGIBLE_ROLL_GOODS]
          - calculations.roll_good_selector
          - state_machines.RollGood.qa_PENDING_to_qa_HELD
        distinguishing_aspect: |
          Category pair business_safety (priority 11) versus business_referential (priority 28): with
          both violated the allocate call returns 422/ERR_FLAMMABILITY_CERT_REQUIRED, and after the
          certificate is issued the SAME call returns 409/ERR_NO_ELIGIBLE_ROLL_GOODS because the only
          roll is qa_status HELD — a strictly different category pair from the state/fiscal instance.
        test_recipe:
          setup:
            - "Style ST-SD-01 ACTIVE at 4275 cents/yard, with NO Certification of any type."
            - "RollGood RG-01 (200.0 yards) put on quality hold, so qa_status == HELD and inventory_status == IN_PROCESS."
            - "One PASS FLAMMABILITY_PILL ProductTest recorded on RG-01 by qa-tech-1."
