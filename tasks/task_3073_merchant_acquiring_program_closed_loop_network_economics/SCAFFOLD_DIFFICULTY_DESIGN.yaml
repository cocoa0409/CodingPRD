            - "the activation call on the PROSPECT-only merchant M2 returns ERR_INVALID_STATE because M2 is not ACCEPTED"

      - name: settlement_funding_gated_by_merchant_acceptance_state
        grounds:
          - state_machines.Settlement.CAPTURED_to_IN_FUNDING
          - state_machines.Merchant.ACTIVE_to_DORMANT
          - validations[priority=7]
        distinguishing_aspect: "Pair (Settlement → Merchant): finalizing a funding batch for a merchant requires that merchant to be ACTIVE, and a CAPTURED settlement that exists at capture time cannot be funded after the merchant goes DORMANT — a different entity pair from the offer→merchant dependency."
