        excluded_because:
          difficulty_instance: cross_entity_state_dependency / placement_termination_gated_by_clock_vs_guarantee_end
          rationale: "ERR_PLACEMENT_GUARANTEE_EXPIRED is the asserted outcome of the named §1.8 instance."

      - name: err_unit_day_capacity_triggerable
        claim_type: error_triggerable
        grounds:
