  # ---------------------------------------------------------------------------
  # Rule 7: cross-entity state dependencies across DIFFERENT entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: funding_requires_policy_in_force
        grounds:
          - state_machines.SettlementAgreement.ASSIGNED_to_FUNDED
          - state_machines.AnnuityPolicy.PENDING_ISSUE_to_IN_FORCE
          - state_machines.PaymentSchedule.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Pair SettlementAgreement x AnnuityPolicy: schedule activation is
          rejected while the agreement is ASSIGNED because the FUNDED transition
          itself is gated on the linked policy reaching IN_FORCE; only after
          mark-in-force flips both entities can the schedule activate.
        test_recipe:
          setup:
            - "CA profile; adult payee; agreement ASSIGNED (assignment executed); policy created but PENDING_ISSUE"
            - "DRAFT schedule with one payment 80000 due 2027-03-01 (esc 0)"
