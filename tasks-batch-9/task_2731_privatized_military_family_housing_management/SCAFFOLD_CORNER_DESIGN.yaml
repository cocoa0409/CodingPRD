              as_user_id: "spec-1"
              captures: { wo_a: "$.data.remediation_work_order_id", ep3_assessor: "$.data.assessed_by_user_id" }
            - call: "POST /work-orders/${wo_a}/assign"
              payload: { assigned_tech_user_id: "tech-7" }
              as: PropertyManager
            - call: "POST /work-orders/${wo_a}/start"
              payload: {}
              as: MaintenanceTech
              as_user_id: "tech-7"
            - call: "POST /work-orders/${wo_a}/complete"
              payload: { completion_note: "Surface treated and dried" }
              as: MaintenanceTech
              as_user_id: "tech-7"
            - call: "GET /hazard-cases/${hz_id}"
              payload: {}
              as: EnvironmentalSpecialist
              as_user_id: "spec-2"
              captures: { ep3_pending: "$.data.status" }
          trigger:
            - call: "POST /hazard-cases/${hz_id}/clearance"
              payload: { clearance_test_passed: false }
              as: EnvironmentalSpecialist
              as_user_id: "spec-2"
              captures: { ep3_fail_status: "$.data.status", ep3_wo_b: "$.data.remediation_work_order_id", ep3_fail_flag: "$.data.clearance_test_passed" }
            - call: "GET /work-orders?parent_work_order_id=${wo_a}"
              payload: {}
              as: PropertyManager
              captures: { ep3_child_id: "$.data[0].id", ep3_child_unit: "$.data[0].housing_unit_id" }
            - call: "GET /housing-units/${u1_id}"
              payload: {}
              as: PropertyManager
              captures: { ep3_unit: "$.data.status" }
            - call: "POST /work-orders/${ep3_wo_b}/assign"
              payload: { assigned_tech_user_id: "tech-7" }
              as: PropertyManager
            - call: "POST /work-orders/${ep3_wo_b}/start"
              payload: {}
              as: MaintenanceTech
              as_user_id: "tech-7"
            - call: "POST /work-orders/${ep3_wo_b}/complete"
              payload: { completion_note: "Cavity opened and remediated" }
              as: MaintenanceTech
              as_user_id: "tech-7"
            - call: "GET /hazard-cases/${hz_id}"
              payload: {}
              as: EnvironmentalSpecialist
              as_user_id: "spec-2"
              captures: { ep3_pending2: "$.data.status" }
            - call: "POST /hazard-cases/${hz_id}/clearance"
              payload: { clearance_test_passed: true }
              as: EnvironmentalSpecialist
              as_user_id: "spec-1"
              captures: { ep3_sod: "$.data.error_id" }
            - call: "POST /hazard-cases/${hz_id}/clearance"
              payload: { clearance_test_passed: true }
              as: EnvironmentalSpecialist
              as_user_id: "spec-2"
              captures: { ep3_pass_status: "$.data.status", ep3_cleared_by: "$.data.cleared_by_user_id", ep3_pass_flag: "$.data.clearance_test_passed" }
          assert:
            - "${ep3_assessor} == spec-1 and ${ep3_pending} == CLEARANCE_PENDING before the fork"
            - "the failed clearance returns HTTP 200 with ${ep3_fail_status} == REMEDIATION_IN_PROGRESS and ${ep3_fail_flag} == false"
            - "the parent-filtered listing reports total_count == 1 with ${ep3_child_id} == ${ep3_wo_b} and ${ep3_child_unit} == ${u1_id} - the follow-on order is chained to the old one and stays on the same unit"
            - "${ep3_wo_b} is not equal to ${wo_a} - remediation_work_order_id was repointed at the follow-on"
            - "${ep3_unit} == OCCUPIED - this case never displaced the family, so the failed test does not move the unit"
            - "${ep3_pending2} == CLEARANCE_PENDING after the follow-on order completes"
            - "the clearance attempted by spec-1 returns HTTP 403 with ${ep3_sod} == ERR_SEGREGATION_OF_DUTIES - the assessor may not certify"
            - "the final clearance returns HTTP 200 with ${ep3_pass_status} == CLOSED, ${ep3_pass_flag} == true and ${ep3_cleared_by} == spec-2"

      - name: a_write_that_links_two_entities_validates_the_link_before_acting
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/hazard-cases/{id}/clearance
          - entities.HazardCase.fields.remediation_work_order_id
        excluded_because:
          difficulty_instance: hazard_clearance_gated_on_remediation_work_order_completion
          rationale: "The interesting link claim here is that clearance is only reachable through the state of the work order the assessment minted, which is precisely the gated-transition chain the difficulty instance walks; the flat link-integrity case is covered by the work-order unit-mismatch instance in the entities section."


  # =========================================================================
  # ERRORS - §1.6 requires every code to be triggerable. The codes reached
  # by the entities, state_machines, validations and endpoints sections
  # above are not repeated here; what remains is the eleven-way 404 fan,
  # the offer window, the hazard hold, the two mismatch codes, the actor
  # reopen budget and the closed-ledger credit refusal.
  # =========================================================================
  - section: errors
    instances:

      - name: each_addressed_entity_has_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INSTALLATION_NOT_FOUND]
          - errors[ERR_HOUSING_UNIT_NOT_FOUND]
          - errors[ERR_SERVICE_MEMBER_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_LEASE_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
          - errors[ERR_WORK_ORDER_NOT_FOUND]
          - errors[ERR_HAZARD_CASE_NOT_FOUND]
          - errors[ERR_LODGING_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "Eleven reads of eleven unknown ids return eleven DIFFERENT error_ids, all under HTTP 404 - an implementation with one generic NOT_FOUND passes the status assertion and fails every code assertion - and the two live rows in the same database prove the reads themselves work."
        test_recipe:
          setup:
            - "One installation with the declared defaults and one unit A-101 (2 bedrooms, TOWNHOME, JUNIOR_ENLISTED) exist and nothing else does."
            - "None of the eleven literal ids used below belongs to any row."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
          trigger:
            - call: "GET /installations/inst_00000000"
              payload: {}
              as: PlatformAdmin
              captures: { n_inst: "$.data.error_id" }
            - call: "GET /housing-units/unit_00000000"
              payload: {}
              as: PlatformAdmin
              captures: { n_unit: "$.data.error_id" }
            - call: "GET /service-members/sm_00000000"
              payload: {}
              as: PlatformAdmin
              captures: { n_sm: "$.data.error_id" }
            - call: "GET /waitlist-applications/app_00000000"
              payload: {}
              as: PlatformAdmin
              captures: { n_app: "$.data.error_id" }
            - call: "GET /leases/lease_00000000"
              payload: {}
              as: PlatformAdmin
              captures: { n_lease: "$.data.error_id" }
            - call: "GET /move-in-inspections/insp_00000000"
              payload: {}
              as: PlatformAdmin
              captures: { n_insp: "$.data.error_id" }
            - call: "GET /work-orders/wo_00000000"
              payload: {}
              as: PlatformAdmin
              captures: { n_wo: "$.data.error_id" }
            - call: "GET /hazard-cases/hz_00000000"
              payload: {}
              as: PlatformAdmin
              captures: { n_hz: "$.data.error_id" }
            - call: "GET /displacement-lodgings/lodge_00000000"
              payload: {}
              as: PlatformAdmin
              captures: { n_lodge: "$.data.error_id" }
            - call: "GET /dispute-cases/disp_00000000"
              payload: {}
              as: PlatformAdmin
              captures: { n_disp: "$.data.error_id" }
            - call: "GET /reinvestment-accounts/acct_00000000"
