        distinguishing_aspect: "An ombudsman may nominate only an employer for whom they were the assignee on a RESOLVED_INFORMAL case: ombudsman O2 (certified, never assigned here) is rejected 409 ERR_NOMINATION_NOT_QUALIFIED, while O1 who resolved the case nominates successfully; coordinator nominations skip the gate."
