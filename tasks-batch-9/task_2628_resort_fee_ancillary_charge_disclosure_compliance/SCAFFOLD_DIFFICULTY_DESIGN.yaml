            - "an implementation that ignores CUTOVER_BUFFER_HOURS accepts the trigger; one that applies the buffer to only one side accepts the mirrored case where the new window ENDS 23 hours before profile A begins"

  - rule_id: compensating_invariant
    instances:

      - name: opt_out_grant_then_revoke_restores_guest_out_of_pocket_to_the_cent
        grounds:
          - calculations.guest_out_of_pocket_conservation
          - calculations.opt_out_credit
          - state_machines.OptOutRequest.GRANTED_to_REVOKED
          - state_machines.Folio.POSTED_to_ADJUSTED
        distinguishing_aspect: |
          CONSERVED QUANTITY: money — Booking.guest_out_of_pocket_cents together
          with the folio's charge/credit/tax decomposition. The compensation must
          be additive: revoking appends a mirror FEE_REBILL line rather than
          deleting or mutating the FEE_CREDIT line, so the ledger grows from 4 to
          5 to 6 lines with contiguous sequence_no while the TOTAL returns to its
          exact pre-grant value. An implementation that "undoes" by editing or
          removing lines still reports 155152 and therefore passes a naive total
          check, but breaks INVARIANT_4 and the audit trail. Note also the sign
          trap: a credit line carries a POSITIVE amount_cents and a NEGATIVE
          tax_cents, and the aggregation SUBTRACTS credits.
