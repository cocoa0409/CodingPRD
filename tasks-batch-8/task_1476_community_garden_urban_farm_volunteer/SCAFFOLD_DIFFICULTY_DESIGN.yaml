            - { call: "GET /api/tools/${tool_id}", as: GardenAdmin, captures: { avail: $.data.available_count, out: $.data.checked_out_count } }
            - { call: "POST /api/tool-checkouts", payload: { tool_id: "${tool_id}", volunteer_id: "${v1_id}", qty: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
          assert:
            - "co_status == OPEN (qty == available_count exactly is allowed)"
            - "avail == 0 and out == 3"
            - "err == ERR_TOOL_INSUFFICIENT_STOCK (qty 1 > available 0)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: signup_blocked_until_waiver_signed
        grounds:
          - state_machines.ShiftSignup
          - state_machines.Volunteer
          - errors[ERR_WAIVER_REQUIRED]
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair ShiftSignup -> Volunteer: signup creation is gated on the OWNING
          volunteer's waiver_status dimension (UNSIGNED/EXPIRED blocks; SIGNED allows). The
          dependency resolves at request time — signing the waiver flips the same request from
          error to success without touching the slot.
        test_recipe:
          setup:
            - "V1 ORIENTED but waiver UNSIGNED; season OPEN_ENROLLMENT; slot OPEN capacity 3"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots", payload: { season_id: "${season_id}", task_type: "WEEDING", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T12:00:00Z", capacity_total: 3, capacity_youth: 1 }, as: GardenAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "OPEN" }, as: GardenAdmin }
          trigger:
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err_blocked: $.data.error_id } }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { s1_id: $.data.id, s1_status: $.data.status } }
          assert:
            - "err_blocked == ERR_WAIVER_REQUIRED while waiver UNSIGNED"
            - "after waiver sign: s1_status == REQUESTED (201 created)"

      - name: crop_plan_approve_blocked_by_bed_state
        grounds:
          - state_machines.CropPlan.PROPOSED_to_APPROVED
          - state_machines.GardenBed.RESERVED_to_PLANTED
          - errors[ERR_BED_NOT_AVAILABLE]
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair CropPlan -> GardenBed (different pair than ShiftSignup -> Volunteer):
          approval requires bed in {FALLOW, RESERVED}; once the bed advances to PLANTED (driven
          by a DIFFERENT approved plan), approving another PROPOSED plan on it fails — the bed's
          lifecycle gates the plan's transition.
        test_recipe:
          setup:
            - "Season OPEN_ENROLLMENT; bed B-01 (size 100) RESERVED with plan A APPROVED (10 sqft), then bed -> PLANTED"
