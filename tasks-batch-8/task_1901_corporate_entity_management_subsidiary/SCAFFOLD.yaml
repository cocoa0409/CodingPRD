    side_effects: ["period rollover generation"]
  - method: POST
    path: "/api/filings/{filingId}/reject"
    description: "SUBMITTED -> REJECTED; reverses the fee accrual exactly"
    roles: [CorporateSecretary]
    code: 200
    input: [reason]
    output: AnnualFiling
    side_effects: ["LegalEntity.fees_accrued_cents -= fee_cents", "increments LegalEntity.version by 1"]

  # --- ForeignQualification ---
  - method: POST
    path: "/api/entities/{id}/qualifications"
    description: "Apply for foreign qualification; gated on GOOD_STANDING posture, authorizing resolution, and agent coverage"
    roles: [CorporateSecretary]
    code: 201
    input: [jurisdiction_id, agent_appointment_id]
    output: ForeignQualification
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/api/qualifications"
    description: "List foreign qualifications (filtered)"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "entity_id?", "jurisdiction_id?", "status?", "agent_appointment_id?"]
    output: "ForeignQualification[]"
    side_effects: []
  - method: GET
    path: "/api/qualifications/{qualificationId}"
    description: "Get a foreign qualification"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: []
    output: ForeignQualification
    side_effects: []
  - method: POST
    path: "/api/qualifications/{qualificationId}/confirm"
    description: "PENDING -> QUALIFIED; generates the jurisdiction's filing calendar"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: ForeignQualification
    side_effects: ["qualified_date set", "AnnualFiling generation for this jurisdiction"]
  - method: POST
    path: "/api/qualifications/{qualificationId}/commence-withdrawal"
    description: "QUALIFIED -> WITHDRAWAL_PENDING"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: ForeignQualification
    side_effects: []
  - method: POST
    path: "/api/qualifications/{qualificationId}/finalize-withdrawal"
    description: "WITHDRAWAL_PENDING -> WITHDRAWN after exit clearance; withdraws remaining future filings"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: ForeignQualification
    side_effects: ["remaining SCHEDULED/PREPARED filings in jurisdiction -> WITHDRAWN", "posture recompute"]
  - method: POST
    path: "/api/qualifications/{qualificationId}/abort-withdrawal"
    description: "WITHDRAWAL_PENDING -> QUALIFIED (cycle)"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: ForeignQualification
    side_effects: []

  # --- SignatureAuthorityGrant ---
  - method: POST
    path: "/api/entities/{id}/signature-grants"
    description: "Create a signature authority grant (direct or delegated), gated on authorizing resolution, appointment, window overlap, delegation rules"
    roles: [CorporateSecretary]
    code: 201
    input: [officer_id, scope, max_amount_cents, effective_date, expiry_date, "delegated_from_grant_id?"]
    output: SignatureAuthorityGrant
    side_effects: ["status = ACTIVE", "source_resolution_id recorded"]
  - method: GET
    path: "/api/signature-grants"
    description: "List signature grants (filtered)"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "entity_id?", "officer_id?", "scope?", "status?", "delegated_from_grant_id?", "source_resolution_id?"]
    output: "SignatureAuthorityGrant[]"
    side_effects: ["lazy EXPIRED evaluation for listed grants"]
  - method: GET
    path: "/api/signature-grants/{grantId}"
    description: "Get a signature grant"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: []
    output: SignatureAuthorityGrant
    side_effects: ["lazy EXPIRED evaluation"]
  - method: POST
    path: "/api/signature-grants/verify"
    description: "Computed read: effective signature authority of an officer for a scope/amount/date, following the delegation chain"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, ComplianceAuditor]
    code: 200
    input: [entity_id, officer_id, scope, amount_cents, as_of_date]
    output: { authorized: boolean, effective_limit_cents: integer, matching_grant_id: string }
    side_effects: []
  - method: POST
    path: "/api/signature-grants/{grantId}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [ComplianceAuditor, CorporateSecretary]
    code: 200
    input: []
    output: SignatureAuthorityGrant
    side_effects: ["suspended_by_user_id set"]
  - method: POST
    path: "/api/signature-grants/{grantId}/reinstate"
    description: "SUSPENDED -> ACTIVE; reinstater must differ from suspender"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: SignatureAuthorityGrant
    side_effects: ["suspended_by_user_id cleared"]
  - method: POST
    path: "/api/signature-grants/{grantId}/revoke"
    description: "ACTIVE/SUSPENDED -> REVOKED; cascades to delegated grants"
    roles: [CorporateSecretary]
    code: 200
    input: ["reason?"]
    output: SignatureAuthorityGrant
    side_effects: ["delegated grants -> REVOKED", "ComplianceEvent(GRANT_REVOKED)"]

  # --- GoodStandingCertificate ---
  - method: POST
    path: "/api/entities/{id}/certificate-requests"
    description: "Request a good-standing certificate; gated on GOOD_STANDING posture"
    roles: [CorporateSecretary]
    code: 201
    input: [jurisdiction_id, delivery_speed]
    output: GoodStandingCertificate
    side_effects: ["fee_cents computed per certificate_fee"]
  - method: GET
    path: "/api/certificates"
    description: "List certificates (filtered)"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "entity_id?", "jurisdiction_id?", "status?"]
    output: "GoodStandingCertificate[]"
    side_effects: ["lazy EXPIRED evaluation for listed certificates"]
  - method: GET
    path: "/api/certificates/{certificateId}"
    description: "Get a certificate"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: []
    output: GoodStandingCertificate
    side_effects: ["lazy EXPIRED evaluation"]
  - method: POST
    path: "/api/certificates/{certificateId}/issue"
    description: "REQUESTED -> ISSUED; re-checks posture; sets valid_until = issued_date + 90 days"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: GoodStandingCertificate
    side_effects: ["issued_date and valid_until set"]
  - method: POST
    path: "/api/certificates/{certificateId}/deny"
    description: "REQUESTED -> DENIED with reason"
    roles: [CorporateSecretary]
    code: 200
    input: [reason]
    output: GoodStandingCertificate
    side_effects: ["denial_reason set", "ComplianceEvent(CERTIFICATE_DENIED)"]

  # --- OwnershipRecord ---
  - method: POST
    path: "/api/ownership-records"
    description: "Create an ownership edge with OCC on the subsidiary, DAG enforcement, and temporal aggregate cap"
    roles: [CorporateSecretary]
    code: 201
    input: [parent_entity_id, subsidiary_entity_id, percentage_bps, effective_date, expected_entity_version, "supersedes_record_id?"]
    output: OwnershipRecord
    side_effects: ["status = ACTIVE", "superseded record -> SUPERSEDED with end_date := effective_date", "increments subsidiary LegalEntity.version by 1"]
  - method: GET
    path: "/api/ownership-records"
    description: "List ownership records (filtered)"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "parent_entity_id?", "subsidiary_entity_id?", "status?", "supersedes_record_id?"]
    output: "OwnershipRecord[]"
    side_effects: []
  - method: GET
    path: "/api/ownership-records/{recordId}"
    description: "Get an ownership record"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: []
    output: OwnershipRecord
    side_effects: []
  - method: POST
    path: "/api/ownership-records/{recordId}/void"
    description: "ACTIVE -> VOIDED (compensating correction)"
    roles: [CorporateSecretary]
    code: 200
    input: [reason]
    output: OwnershipRecord
    side_effects: ["frees aggregate capacity"]
  - method: GET
    path: "/api/entities/{id}/ownership-chart"
    description: "Computed org chart from this root: nodes with look-through basis points and direct edges, per ownership_consolidation"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: []
    output: { root_entity_id: string, nodes: array, edges: array }
    side_effects: []

  # --- ComplianceEvent ---
  - method: GET
    path: "/api/entities/{id}/compliance-events"
    description: "Append-only audit trail for the entity, ordered by occurred_at ASC then created_at ASC"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "event_type?"]
    output: "ComplianceEvent[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid, or entity_backed role id does not resolve" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_ACTOR, http: 403, condition: "Self-action holder mismatch: resign requires X-User-ID == appointment.officer_id; file-resignation-notice requires X-User-ID == appointment.agent_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user may not perform both sides of a control: drafter/adopter, submitter/acceptor, suspender/reinstater" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, malformed date, range violation, or bad date ordering in the request body" }
  - { id: ERR_ENTITY_NOT_FOUND, http: 404, condition: "LegalEntity id does not exist" }
  - { id: ERR_JURISDICTION_NOT_FOUND, http: 404, condition: "Jurisdiction id does not exist" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "RegisteredAgent id does not exist" }
  - { id: ERR_OFFICER_NOT_FOUND, http: 404, condition: "Officer id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "OfficerAppointment id does not exist" }
  - { id: ERR_RESOLUTION_NOT_FOUND, http: 404, condition: "Resolution id does not exist" }
  - { id: ERR_FILING_NOT_FOUND, http: 404, condition: "AnnualFiling id does not exist" }
  - { id: ERR_QUALIFICATION_NOT_FOUND, http: 404, condition: "ForeignQualification id does not exist" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "SignatureAuthorityGrant id does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "GoodStandingCertificate id does not exist" }
  - { id: ERR_OWNERSHIP_RECORD_NOT_FOUND, http: 404, condition: "OwnershipRecord id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_entity_version does not match the parent LegalEntity's current version (OCC)" }
  - { id: ERR_ENTITY_NOT_DRAFT, http: 409, condition: "submit-formation requires status == DRAFT" }
  - { id: ERR_ENTITY_NOT_FORMATION_PENDING, http: 409, condition: "confirm-formation requires status == FORMATION_PENDING" }
  - { id: ERR_ENTITY_NOT_ACTIVE, http: 409, condition: "Operation requires entity status IN {ACTIVE} (or {ACTIVE, DISSOLUTION_PENDING} for filing prepare/submit); also PATCH on non-ACTIVE entity" }
  - { id: ERR_ENTITY_NOT_DISSOLUTION_PENDING, http: 409, condition: "finalize/revoke-dissolution requires status == DISSOLUTION_PENDING" }
  - { id: ERR_ENTITY_ALREADY_DISSOLVED, http: 409, condition: "Mutation on a DISSOLVED entity" }
  - { id: ERR_REQUIRED_RESOLUTION_MISSING, http: 422, condition: "No resolution of the required type (and payload match) with status IN {ADOPTED, EFFECTIVE} exists" }
  - { id: ERR_RESOLUTION_NOT_DRAFT, http: 409, condition: "submit/withdraw requires resolution status == DRAFT" }
  - { id: ERR_RESOLUTION_NOT_SUBMITTED, http: 409, condition: "adopt/return requires resolution status == SUBMITTED" }
  - { id: ERR_RESOLUTION_NOT_ADOPTED, http: 409, condition: "rescind requires resolution status IN {ADOPTED, EFFECTIVE}" }
  - { id: ERR_RESOLUTION_NOT_RESCINDABLE, http: 409, condition: "EFFECTIVE resolution type is not compensable by rescission (only APPOINT_OFFICER, GRANT_SIGNATURE_AUTHORITY are)" }
  - { id: ERR_OFFICE_OCCUPIED, http: 409, condition: "Single-holder office_title already held by an APPOINTED appointment at this entity" }
  - { id: ERR_OFFICER_NOT_ACTIVE, http: 409, condition: "Officer.status != ACTIVE (deactivate of DEACTIVATED, or adoption of APPOINT_OFFICER for a DEACTIVATED officer)" }
  - { id: ERR_OFFICER_NOT_APPOINTED, http: 422, condition: "Grant creation requires the officer to hold an APPOINTED OfficerAppointment at the entity" }
  - { id: ERR_DUPLICATE_OFFICER, http: 409, condition: "Officer email already registered" }
  - { id: ERR_FILING_NOT_PREPARED, http: 409, condition: "submit requires status IN {PREPARED, OVERDUE}; prepare requires status IN {SCHEDULED, REJECTED}" }
  - { id: ERR_FILING_NOT_SUBMITTED, http: 409, condition: "accept/reject requires status == SUBMITTED" }
  - { id: ERR_POSTURE_NOT_GOOD_STANDING, http: 409, condition: "Qualification create, certificate request, or certificate issue while compliance_posture != GOOD_STANDING" }
  - { id: ERR_QUALIFICATION_EXISTS, http: 409, condition: "A ForeignQualification for (entity, jurisdiction) already exists with status IN {PENDING, QUALIFIED, WITHDRAWAL_PENDING}" }
  - { id: ERR_QUALIFICATION_NOT_PENDING, http: 409, condition: "confirm requires status == PENDING" }
  - { id: ERR_QUALIFICATION_NOT_QUALIFIED, http: 409, condition: "commence-withdrawal requires status == QUALIFIED" }
  - { id: ERR_QUALIFICATION_NOT_WITHDRAWAL_PENDING, http: 409, condition: "finalize/abort-withdrawal requires status == WITHDRAWAL_PENDING" }
  - { id: ERR_EXIT_CLEARANCE_FAILED, http: 422, condition: "Withdrawal finalize with filings in the jurisdiction in status IN {OVERDUE, SUBMITTED, REJECTED}" }
  - { id: ERR_OPEN_QUALIFICATIONS_EXIST, http: 409, condition: "Dissolution commencement with a qualification not in {WITHDRAWN, REVOKED}" }
  - { id: ERR_DISSOLUTION_BLOCKED, http: 422, condition: "Dissolution finalize with non-terminal filings or REQUESTED certificates outstanding" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "suspend requires grant status == ACTIVE" }
  - { id: ERR_GRANT_NOT_SUSPENDED, http: 409, condition: "reinstate requires grant status == SUSPENDED" }
  - { id: ERR_GRANT_ALREADY_TERMINAL, http: 409, condition: "revoke requires status IN {ACTIVE, SUSPENDED}" }
  - { id: ERR_GRANT_WINDOW_OVERLAP, http: 409, condition: "Another grant with same (entity, officer, scope) and status IN {ACTIVE, SUSPENDED} has a half-open window overlapping the requested window; adjacency (expiry == effective) is permitted" }
  - { id: ERR_DELEGATION_DEPTH_EXCEEDED, http: 422, condition: "delegated_from_grant_id references a grant that is itself delegated; delegation depth is at most 2" }
  - { id: ERR_DELEGATOR_GRANT_INVALID, http: 422, condition: "delegated_from_grant_id references a grant whose status != ACTIVE, or whose entity/scope does not match" }
  - { id: ERR_DELEGATOR_WINDOW_INSUFFICIENT, http: 422, condition: "Delegated grant window not contained in delegator window [effective_date, expiry_date)" }
  - { id: ERR_DELEGATION_LIMIT_EXCEEDED, http: 422, condition: "Delegated grant max_amount_cents exceeds delegator.max_amount_cents" }
  - { id: ERR_CERTIFICATE_NOT_REQUESTED, http: 409, condition: "issue/deny requires certificate status == REQUESTED" }
  - { id: ERR_APPOINTMENT_NOT_APPOINTED, http: 409, condition: "resign requires appointment status == APPOINTED" }
  - { id: ERR_AGENT_APPOINTMENT_NOT_ACTIVE, http: 409, condition: "file-resignation-notice requires appointment status == ACTIVE" }
  - { id: ERR_AGENT_APPOINTMENT_NOT_NOTICE_PENDING, http: 409, condition: "finalize-resignation requires status == NOTICE_PENDING" }
  - { id: ERR_AGENT_RESIGNATION_NOTICE_UNRIPE, http: 409, condition: "finalize-resignation before effective_end_date" }
  - { id: ERR_AGENT_APPOINTMENT_OVERLAP, http: 409, condition: "Second appointment for (entity, jurisdiction) overlapping an ACTIVE incumbent outside a notice window" }
  - { id: ERR_AGENT_COVERAGE_GAP, http: 422, condition: "Coverage continuity violated: successor start_date after incumbent's effective_end_date; or confirm-formation / qualification create without covering appointment" }
  - { id: ERR_SELF_OWNERSHIP, http: 422, condition: "parent_entity_id == subsidiary_entity_id" }
  - { id: ERR_OWNERSHIP_CYCLE, http: 422, condition: "Record would create a cycle among OwnershipRecords with status == ACTIVE" }
  - { id: ERR_OWNERSHIP_TOTAL_EXCEEDED, http: 422, condition: "Aggregate ownership of the subsidiary would exceed 10000 bps at some covered date" }
  - { id: ERR_OWNERSHIP_RECORD_NOT_ACTIVE, http: 409, condition: "void requires record status == ACTIVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CorporateSecretary
    description: "Corporate secretary office administrator; owns registry, filings adjudication, resolutions adoption, qualifications, grants, certificates, ownership"
    identity: opaque
    exclusive_operations:
      - "POST /api/jurisdictions, /api/registered-agents, /api/officers, /api/entities"
      - "All entity lifecycle actions: submit-formation, confirm-formation, commence-dissolution, finalize-dissolution, revoke-dissolution, PATCH /api/entities/{id}"
      - "POST /api/officers/{id}/deactivate"
      - "POST /api/entities/{id}/agent-appointments; POST /api/agent-appointments/{id}/finalize-resignation"
      - "Resolution return/adopt/rescind"
      - "Filing accept/reject"
      - "Qualification create/confirm/commence-withdrawal/finalize-withdrawal/abort-withdrawal"
      - "Signature grant create/revoke/reinstate"
      - "Certificate request/issue/deny"
      - "Ownership record create/void"
      - "POST /_clock/set_current_utc, POST /_system/sweep"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/entities/{id}/resolutions (draft), POST /api/resolutions/{id}/submit, /withdraw"
      - "POST /api/filings/{id}/prepare, /submit"
      - "POST /api/signature-grants/{id}/suspend"
      - "POST /api/signature-grants/verify"
  - name: FilingCoordinator
    description: "Paralegal/filing preparer; drafts resolutions and prepares/submits filings but may not adopt or accept (segregation of duties)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
      - "POST /api/entities/{id}/resolutions (draft), POST /api/resolutions/{id}/submit, /withdraw"
      - "POST /api/filings/{id}/prepare, /submit"
      - "POST /api/signature-grants/verify"
  - name: AuthorizedOfficer
    description: "An officer/director of a registered entity; may resign own appointments"
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /api/officer-appointments/{id}/resign (only when X-User-ID == appointment.officer_id)"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/signature-grants/verify"
  - name: RegisteredAgentUser
    description: "A registered-agent operator; files resignation notices for own appointments"
    identity: "entity_backed:RegisteredAgent"
    exclusive_operations:
      - "POST /api/agent-appointments/{id}/file-resignation-notice (only when X-User-ID == appointment.agent_id)"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceAuditor
    description: "Read-mostly compliance oversight; may suspend signature grants but not reinstate them"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
      - "POST /api/signature-grants/{id}/suspend"
      - "POST /api/signature-grants/verify"
