    check: "POST /monetization/creator-funds/{fund_id}/allocate requires a non-empty candidate pool per calculations.fund_allocation step 1"
    error_id: ERR_FUND_POOL_EMPTY
    http_status: 422
    applies_to: "POST /monetization/creator-funds/{fund_id}/allocate"
  - priority: 79
    category: business_fiscal
    check: "POST /monetization/creator-funds/{fund_id}/disburse requires recipient_count >= 1 (at least one FundAllocation with status == ACTIVE)"
    error_id: ERR_FUND_NO_RECIPIENTS
    http_status: 422
    applies_to: "POST /monetization/creator-funds/{fund_id}/disburse"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Response-shape contract for every row below:
#   * `output: <Entity>`   -> envelope `data` is one object carrying EVERY field
#     §1.1 declares for that entity, including the common fields
#     (id, created_at, updated_at, version) and every `source: computed` field.
#     So `$.data.id`, `$.data.version`, `$.data.available_balance_cents`,
#     `$.data.withholding_cents`, … are all capturable from any row whose
#     output is that entity.
#   * `output: <Entity>[]` -> envelope `data` is an array of such objects and the
#     envelope carries the four pagination fields from §1.0.
#   * A field marked `field?` in `input:` is optional; every other field is
#     required (validation priority 6).
#   * Every list endpoint accepts `limit?` and `offset?` in addition to the
#     filters shown.
#   * Roles are exactly the §1.7 role names. `Auditor` is read-only everywhere.
# Reverse-reachability map (§1.5 design principle 2): TaxProfile.creator_id,
# ContentItem.creator_id, RevenueEvent.{creator_id,product_id,content_item_id,
# period_id}, Appeal.{content_item_id,creator_id}, EarningsStatement.
# {period_id,creator_id,payout_id}, Payout.creator_id, Investigation.creator_id,
# CreatorFund.period_id are covered by filtered-list GETs; LedgerEntry.creator_id
# and FundAllocation.{fund_id,creator_id} are covered by the three sub-resource
# GETs (the only sub-resources in this API, per complexity_profile).
# =============================================================================
endpoints:
  # --------------------------- logical clock --------------------------------
  - method: POST
    path: "/monetization/_clock/set_current_utc"
    description: >-
      Test-driving endpoint (§1.5 priority-ladder rung 3). Moves the server's
      logical clock, which is the only source of every *_at field, of
      TaxProfile.expires_at, of the STRIKE_ACTIVE_DAYS lapse test and of the
      period-close pipeline. The clock's startup default is exactly
      2026-08-01T00:00:00Z; before the first call it reads that value and MUST
      NOT fall back to real wall-clock time. The clock is monotonic
      (validation priority 73).
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "sets the logical clock to to_iso8601; no entity row is mutated"
  # ------------------------------ creators ----------------------------------
  - method: POST
    path: "/monetization/creators"
    description: >-
      Registers a creator. eligibility_status is born PENDING_REVIEW and
      payout_state is born ACCRUING, so a brand-new creator can neither accrue
      (validation 38) nor be paid (validation 74).
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, country_code, follower_count, watch_time_minutes_365d, "payout_threshold_cents?", "payout_method?"]
    output: Creator
    side_effects:
      - "creates the Creator with version 1, eligibility_status PENDING_REVIEW, payout_state ACCRUING, all system counters at their §1.1 defaults"
      - "no evaluation runs: last_evaluated_at stays null and evaluation_count stays 0"
  - method: GET
    path: "/monetization/creators"
    description: "Lists creators with their derived balances."
    roles: [PlatformAdmin, FinanceOperator, PolicyReviewer, Auditor, Creator]
    code: 200
    input: ["eligibility_status?", "payout_state?", "country_code?", "limit?", "offset?"]
    output: Creator[]
    side_effects:
      - "recomputes calculations.creator_balance_projection for every row returned (read-only)"
      - "when X-User-Role == Creator the result is narrowed to the single row whose id == X-User-ID"
  - method: GET
    path: "/monetization/creators/{creator_id}"
    description: "Reads one creator including ledger_balance_cents, held_cents, statement_payable_cents and available_balance_cents."
    roles: [PlatformAdmin, FinanceOperator, PolicyReviewer, Auditor, Creator]
    code: 200
    input: []
    output: Creator
    side_effects:
      - "recomputes calculations.creator_balance_projection (read-only)"
  - method: PATCH
    path: "/monetization/creators/{creator_id}/metrics"
    description: >-
      Metrics ingestion. Overwrites follower_count and/or
      watch_time_minutes_365d. Deliberately does NOT re-evaluate eligibility:
      a creator whose followers just crossed MIN_FOLLOWERS stays INELIGIBLE
      until an explicit evaluate or the next period close.
    roles: [PlatformAdmin]
    code: 200
    input: ["follower_count?", "watch_time_minutes_365d?"]
    output: Creator
    side_effects:
      - "writes the supplied metric fields; increments Creator.version by 1"
      - "eligibility_status, last_evaluation_failed_criteria and evaluation_count are UNCHANGED"
  - method: POST
    path: "/monetization/creators/{creator_id}/evaluate"
    description: "Runs calculations.eligibility_evaluation (ON_DEMAND variant) against the creator's stored metrics and strike count."
    roles: [FinanceOperator]
    code: 200
    input: []
    output: Creator
    side_effects:
      - "writes eligibility_status and last_evaluation_failed_criteria per calculations.eligibility_evaluation"
      - "evaluation_count += 1; last_evaluated_at = current logical time; Creator.version += 1"
      - "payout_state is NOT touched (independent state dimension)"
  - method: POST
    path: "/monetization/creators/{creator_id}/policy-strikes"
    description: >-
      Records a policy strike. Hop 1 of a two-hop cascade: the strike increment
      itself forces the eligibility re-evaluation that lands the creator in
      SUSPENDED.
    roles: [PolicyReviewer]
    code: 200
    input: [reason]
    output: Creator
    side_effects:
      - "hop 1: active_strike_count += 1; last_strike_at = current logical time"
      - "hop 2: because active_strike_count >= 1, calculations.eligibility_evaluation re-runs and writes eligibility_status = SUSPENDED with last_evaluation_failed_criteria = [POLICY_COMPLIANCE]; evaluation_count += 1"
      - "Creator.version += 1; payout_state unchanged"
  - method: POST
    path: "/monetization/creators/{creator_id}/payout-settings"
    description: "Updates the creator's disbursement rail and/or minimum payout threshold."
    roles: [Creator, FinanceOperator]
    code: 200
    input: ["payout_method?", "payout_threshold_cents?"]
    output: Creator
    side_effects:
      - "writes payout_method and/or payout_threshold_cents; Creator.version += 1"
      - "when the supplied payout_method differs from the stored value, consecutive_payment_failures is reset to 0"
      - "existing Payout rows keep their snapshotted method and fee: nothing is recomputed"
  - method: GET
    path: "/monetization/creators/{creator_id}/ledger-entries"
    description: >-
      Append-only ledger of the creator, ordered occurred_at ASC then
      created_at ASC. Reverse-reachability GET for LedgerEntry.creator_id and the
      only way to observe cascade-created ledger rows.
    roles: [Creator, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: ["entry_type?", "source_entity?", "source_id?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: "/monetization/creators/{creator_id}/fund-allocations"
    description: "Reverse-reachability GET for FundAllocation.creator_id; ordered created_at ASC."
    roles: [Creator, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: ["status?", "fund_id?", "limit?", "offset?"]
    output: FundAllocation[]
    side_effects: []
  - method: GET
    path: "/monetization/creators/{creator_id}/earnings-summary"
    description: >-
      Computed read for creator-facing earnings reporting and audit support.
      Returns the Creator projection with every derived money field recomputed
      from source rows, so a client can reconcile
      available_balance_cents against the ledger without trusting a cache.
    roles: [Creator, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: []
    output: Creator
    side_effects:
      - "recomputes calculations.creator_balance_projection and calculations.payout_state_resolution; if the recomputed payout_state differs from the stored value the stored value is corrected and Creator.version += 1 (derived-field reconciliation on read)"
  # ----------------------------- tax profiles -------------------------------
  - method: POST
    path: "/monetization/tax-profiles"
    description: >-
      Collects a tax document. OCC-guarded write (§1.2.1
      tax-profile-create-stale-creator): the new profile legitimately supersedes
      every prior non-SUPERSEDED profile of the creator, so the only way to
      detect a caller working from a stale view is expected_creator_version.
    roles: [Creator, FinanceOperator]
    code: 201
    input: [creator_id, form_type, country_code, tin_provided, treaty_claimed, "treaty_rate_bps?", expected_creator_version]
    output: TaxProfile
    side_effects:
      - "every existing TaxProfile of this creator with status != SUPERSEDED becomes SUPERSEDED with its withholding_rate_bps frozen at its current value"
      - "creates the new TaxProfile with status DRAFT and withholding_rate_bps = BACKUP_WITHHOLDING_BPS per calculations.withholding_rate_resolution"
      - "increments Creator.version by 1"
  - method: GET
    path: "/monetization/tax-profiles"
    description: "Reverse-reachability GET for TaxProfile.creator_id; ordered created_at ASC."
    roles: [Creator, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: ["creator_id?", "status?", "form_type?", "limit?", "offset?"]
    output: TaxProfile[]
    side_effects: []
  - method: GET
    path: "/monetization/tax-profiles/{tax_profile_id}"
    description: "Reads one tax profile including its resolved withholding_rate_bps and expires_at."
    roles: [Creator, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: []
    output: TaxProfile
    side_effects: []
  - method: POST
    path: "/monetization/tax-profiles/{tax_profile_id}/submit"
    description: "Creator submits the collected form for review (DRAFT -> SUBMITTED)."
    roles: [Creator]
    code: 200
    input: []
    output: TaxProfile
    side_effects:
      - "status = SUBMITTED; submitted_at = current logical time"
      - "withholding_rate_bps re-resolved — still BACKUP_WITHHOLDING_BPS, because only VERIFIED profiles earn a statutory or treaty rate"
      - "TaxProfile.version += 1"
  - method: POST
    path: "/monetization/tax-profiles/{tax_profile_id}/verify"
    description: "Finance decision on a submitted form (SUBMITTED -> VERIFIED or REJECTED)."
    roles: [FinanceOperator]
    code: 200
    input: [decision, "rejection_reason?"]
    output: TaxProfile
    side_effects:
      - "decision == VERIFY: status = VERIFIED; verified_at = now; expires_at = verified_at + TAX_FORM_VALIDITY_DAYS; withholding_rate_bps re-resolved by calculations.withholding_rate_resolution (0 / treaty / NRA / backup)"
      - "decision == REJECT: status = REJECTED; rejection_reason written; withholding_rate_bps = BACKUP_WITHHOLDING_BPS"
      - "TaxProfile.version += 1; no EarningsStatement already created is recomputed"
  - method: POST
    path: "/monetization/tax-profiles/{tax_profile_id}/revise"
    description: "Creator corrects a rejected form and returns it to DRAFT (REJECTED -> DRAFT)."
    roles: [Creator]
    code: 200
    input: ["form_type?", "tin_provided?", "treaty_claimed?", "treaty_rate_bps?"]
    output: TaxProfile
    side_effects:
      - "supplied fields overwrite form_type / tin_provided / treaty_claimed / treaty_rate_bps; rejection_reason = null; status = DRAFT"
      - "withholding_rate_bps re-resolved (BACKUP_WITHHOLDING_BPS while DRAFT); TaxProfile.version += 1"
  # --------------------------- revenue products -----------------------------
  - method: POST
    path: "/monetization/revenue-products"
    description: >-
      Declares a monetization surface with its per-product terms. Only
      product_type == ADVERTISING is suitability_sensitive, and that flag is
      computed, not supplied.
    roles: [PlatformAdmin]
    code: 201
    input: [product_type, name, creator_share_bps, platform_fee_bps, "min_payable_cents?", "terms_version?"]
    output: RevenueProduct
    side_effects:
      - "creates the product with status ACTIVE and suitability_sensitive = (product_type == ADVERTISING)"
  - method: GET
    path: "/monetization/revenue-products"
    description: "Lists revenue products."
    roles: [PlatformAdmin, FinanceOperator, PolicyReviewer, Auditor, Creator]
    code: 200
    input: ["product_type?", "status?", "limit?", "offset?"]
    output: RevenueProduct[]
    side_effects: []
  - method: PATCH
    path: "/monetization/revenue-products/{product_id}"
    description: >-
      Amends per-product terms. Purely forward-looking: already-accrued
      RevenueEvents keep terms_version_at_accrual and creator_share_cents from
      the terms in force when they accrued.
    roles: [PlatformAdmin]
    code: 200
    input: ["creator_share_bps?", "platform_fee_bps?", "min_payable_cents?", "terms_version?"]
    output: RevenueProduct
    side_effects:
      - "writes the supplied term fields; RevenueProduct.version += 1"
      - "no RevenueEvent, EarningsStatement or LedgerEntry is recomputed"
  - method: POST
    path: "/monetization/revenue-products/{product_id}/retire"
    description: "Closes a product to new accruals (ACTIVE -> RETIRED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RevenueProduct
    side_effects:
      - "status = RETIRED; retired_at = current logical time; RevenueProduct.version += 1"
      - "existing RevenueEvents are untouched and are still swept into statements at period close"
  # ----------------------------- content items ------------------------------
  - method: POST
    path: "/monetization/content-items"
    description: "Publishes a content item. suitability_rating is born GREEN with rating_source DEFAULT, so monetization_state is MONETIZED and no appeal is admissible yet."
    roles: [Creator, PlatformAdmin]
    code: 201
    input: [creator_id, title, published_at]
    output: ContentItem
    side_effects:
      - "creates the item with suitability_rating GREEN, monetization_state MONETIZED, rating_source DEFAULT, last_rated_by_user_id null, last_rated_at null"
  - method: GET
    path: "/monetization/content-items"
    description: "Reverse-reachability GET for ContentItem.creator_id; ordered created_at ASC."
    roles: [Creator, PolicyReviewer, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: ["creator_id?", "suitability_rating?", "monetization_state?", "rating_source?", "limit?", "offset?"]
    output: ContentItem[]
    side_effects: []
  - method: GET
    path: "/monetization/content-items/{content_item_id}"
    description: "Reads one content item including monetization_state and open_appeal_count."
    roles: [Creator, PolicyReviewer, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: []
    output: ContentItem
    side_effects: []
  - method: POST
    path: "/monetization/content-items/{content_item_id}/rate"
    description: >-
      Ad-suitability rating change — hop 1 of the three-hop demonetization
      cascade. Records the acting reviewer as last_rated_by_user_id, which is the
      segregation-of-duties comparand for a later appeal decision (validation 45).
    roles: [PolicyReviewer]
    code: 200
    input: [suitability_rating, rating_source, "note?"]
    output: ContentItem
    side_effects:
      - "hop 1: suitability_rating = supplied value; monetization_state recomputed (GREEN->MONETIZED, YELLOW->LIMITED, RED->DEMONETIZED); rating_source = supplied value; last_rated_by_user_id = X-User-ID; last_rated_at = current logical time; ContentItem.version += 1"
      - "hop 2: because the rating changed, every RevenueEvent with content_item_id == this item, status IN {ACCRUED, BELOW_MINIMUM} and a suitability_sensitive product is re-scored by calculations.revenue_share_split (RESCORE_ON_RERATING variant), in occurred_at ASC, created_at ASC order; a RED rating sets status REVERSED, a YELLOW rating keeps ACCRUED or falls to BELOW_MINIMUM"
      - "hop 3: because each re-scored event's creator_share_cents fell, each appends an ACCRUAL_REVERSAL LedgerEntry for the negative delta, which itself lowers Creator.ledger_balance_cents and is stamped into that entry's balance_after_cents"
      - "EarningsStatements already created for a CLOSED or FINALIZED period are NOT recomputed"
  # ---------------------------- revenue events ------------------------------
  - method: POST
    path: "/monetization/revenue-events"
    description: >-
      Ingests one gross revenue event and accrues the creator's share.
      Resolves the owning EarningsPeriod from occurred_at (validation 71), then
      runs calculations.revenue_share_split (INITIAL_ACCRUAL variant).
    roles: [PlatformAdmin, FinanceOperator]
    code: 201
    input: [creator_id, product_id, "content_item_id?", gross_amount_cents, occurred_at]
    output: RevenueEvent
    side_effects:
      - "period_id = the single EarningsPeriod with status == OPEN whose [period_start, period_end) contains occurred_at"
      - "terms_version_at_accrual = RevenueProduct.terms_version; suitability_rating_at_accrual = ContentItem.suitability_rating (GREEN when content_item_id is null)"
      - "effective_share_bps, creator_share_cents and status (ACCRUED or BELOW_MINIMUM) written by calculations.revenue_share_split; last_status_change_at = current logical time"
      - "when creator_share_cents > 0 an ACCRUAL LedgerEntry for +creator_share_cents is appended with source_entity REVENUE_EVENT; when creator_share_cents == 0 NO ledger entry is written"
  - method: GET
    path: "/monetization/revenue-events"
    description: >-
      Reverse-reachability GET for RevenueEvent.creator_id, .product_id,
      .content_item_id and .period_id; ordered occurred_at ASC, created_at ASC.
    roles: [FinanceOperator, PlatformAdmin, PolicyReviewer, Auditor, Creator]
    code: 200
    input: ["creator_id?", "product_id?", "content_item_id?", "period_id?", "status?", "limit?", "offset?"]
    output: RevenueEvent[]
    side_effects: []
  # -------------------------------- appeals ---------------------------------
  - method: POST
    path: "/monetization/appeals"
    description: "Creator appeals a LIMITED or DEMONETIZED content item, asking for a strictly less restrictive rating."
    roles: [Creator]
    code: 201
    input: [content_item_id, requested_rating, statement_text]
    output: Appeal
    side_effects:
      - "creates the Appeal with state SUBMITTED, revision_round 0, creator_id copied from ContentItem.creator_id"
      - "ContentItem.open_appeal_count becomes 1 (derived); no rating or event changes"
  - method: GET
    path: "/monetization/appeals"
    description: "Reverse-reachability GET for Appeal.content_item_id and Appeal.creator_id; ordered created_at ASC."
    roles: [Creator, PolicyReviewer, PlatformAdmin, Auditor]
    code: 200
    input: ["content_item_id?", "creator_id?", "state?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: GET
    path: "/monetization/appeals/{appeal_id}"
    description: "Reads one appeal including revision_round, info_request and response_statement."
    roles: [Creator, PolicyReviewer, PlatformAdmin, Auditor]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/monetization/appeals/{appeal_id}/start-review"
    description: "Reviewer picks up the appeal (SUBMITTED -> UNDER_REVIEW)."
    roles: [PolicyReviewer]
    code: 200
    input: []
    output: Appeal
    side_effects:
      - "state = UNDER_REVIEW; Appeal.version += 1; no other field changes"
  - method: POST
    path: "/monetization/appeals/{appeal_id}/request-info"
    description: "Reviewer asks the creator for more information (UNDER_REVIEW -> INFO_REQUESTED); first leg of the appeal cycle."
    roles: [PolicyReviewer]
    code: 200
    input: [info_request]
    output: Appeal
    side_effects:
      - "state = INFO_REQUESTED; info_request = supplied text; Appeal.version += 1"
  - method: POST
    path: "/monetization/appeals/{appeal_id}/respond"
    description: >-
      Creator answers the information request (INFO_REQUESTED -> SUBMITTED),
      closing the cycle. revision_round is the termination counter: the boundary
      is strict (< APPEAL_MAX_ROUNDS), so exactly two responses are admissible.
    roles: [Creator]
    code: 200
    input: [response_statement]
    output: Appeal
    side_effects:
      - "state = SUBMITTED; revision_round += 1; response_statement = supplied text; Appeal.version += 1"
  - method: POST
    path: "/monetization/appeals/{appeal_id}/decide"
    description: >-
      Reviewer decides the appeal. UPHELD is hop 1 of the four-hop restoration
      cascade; DENIED is the divergent branch of the same fork and mutates
      nothing but the Appeal.
    roles: [PolicyReviewer]
    code: 200
    input: [decision, rationale]
    output: Appeal
    side_effects:
      - "both branches: state = UPHELD or DENIED; decided_by_user_id = X-User-ID; decided_at = current logical time; rationale written; Appeal.version += 1"
      - "UPHELD hop 2: the appealed ContentItem's suitability_rating becomes Appeal.requested_rating, rating_source = APPEAL, last_rated_by_user_id = null, last_rated_at = now, monetization_state recomputed"
      - "UPHELD hop 3: because the rating rose, every RevenueEvent on that item with status IN {REVERSED, BELOW_MINIMUM} on a suitability_sensitive product is re-scored (RESTORE_ON_APPEAL variant) in occurred_at ASC, created_at ASC order and returns to ACCRUED (or stays BELOW_MINIMUM)"
      - "UPHELD hop 4: because each restored event's creator_share_cents rose, each appends an ACCRUAL_RESTORE LedgerEntry for the positive delta, which itself raises Creator.ledger_balance_cents"
      - "DENIED: no ContentItem, RevenueEvent or LedgerEntry row changes at all"
  # ---------------------------- earnings periods ----------------------------
  - method: POST
    path: "/monetization/earnings-periods"
    description: "Opens an attribution window. Windows are half-open [period_start, period_end) and may abut but never overlap (validation 67)."
    roles: [PlatformAdmin]
    code: 201
    input: [label, period_start, period_end]
    output: EarningsPeriod
    side_effects:
      - "creates the period with status OPEN, closed_at null, statement_count 0, finalized_statement_count 0"
  - method: GET
    path: "/monetization/earnings-periods"
    description: "Lists attribution windows with their derived statement counters."
    roles: [PlatformAdmin, FinanceOperator, Auditor, Creator, PolicyReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EarningsPeriod[]
    side_effects: []
  - method: GET
    path: "/monetization/earnings-periods/{period_id}"
    description: "Reads one period including statement_count and finalized_statement_count (the compound-state inputs)."
    roles: [PlatformAdmin, FinanceOperator, Auditor, Creator, PolicyReviewer]
    code: 200
    input: []
    output: EarningsPeriod
    side_effects: []
  - method: POST
    path: "/monetization/earnings-periods/{period_id}/close"
    description: >-
      Ops-run checkpoint. Executes the six normative steps of the close
      pipeline in order; the ordering is observable because step 1 changes the
      rate step 4 uses and step 2 changes the strike count step 3 reads.
    roles: [FinanceOperator]
    code: 200
    input: []
    output: EarningsPeriod
    side_effects:
      - "step 1 (tax expiry): every TaxProfile with status == VERIFIED and expires_at <= close time becomes EXPIRED with withholding_rate_bps = BACKUP_WITHHOLDING_BPS"
      - "step 2 (strike lapse): every Creator with active_strike_count > 0 and last_strike_at + STRIKE_ACTIVE_DAYS <= close time has active_strike_count reset to 0"
      - "step 3 (re-evaluation): calculations.eligibility_evaluation (PERIOD_CLOSE variant) runs for every Creator in created_at ASC order; evaluation_count += 1 and last_evaluated_at = close time for every creator, even when the status does not move"
      - "step 4 (statements): one EarningsStatement per Creator holding at least one RevenueEvent with period_id == this period and status == ACCRUED, created in Creator.created_at ASC order with withholding_variant PROVISIONAL; gross_cents / creator_share_cents / event_count / withholding_rate_bps / withholding_cents / net_payable_cents written by calculations.statement_withholding (PROVISIONAL); a WITHHOLDING LedgerEntry for -withholding_cents is appended when withholding_cents > 0"
      - "step 5 (arrears offset): calculations.clawback_waterfall (PERIOD_CLOSE_ARREARS_OFFSET variant) runs for every Creator with outstanding_clawback_cents > 0 that received a step-4 statement, in Creator.created_at ASC order; each appends a CLAWBACK LedgerEntry for -offset and recomputes payout_state, which returns the creator to ACCRUING when the offset zeroed the arrears"
      - "step 6: status = CLOSED; closed_at = close logical time; EarningsPeriod.version += 1"
      - "the period does NOT become FINALIZED here: that is the compound transition evaluated after each statement finalize"
  # --------------------------- earnings statements --------------------------
  - method: GET
    path: "/monetization/earnings-statements"
    description: >-
      Reverse-reachability GET for EarningsStatement.period_id, .creator_id and
      .payout_id; ordered by EarningsPeriod.period_start ASC then created_at ASC
      (the same order the clawback waterfall and payout attachment use).
    roles: [Creator, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: ["creator_id?", "period_id?", "payout_id?", "status?", "withholding_variant?", "limit?", "offset?"]
    output: EarningsStatement[]
    side_effects: []
  - method: GET
    path: "/monetization/earnings-statements/{statement_id}"
    description: "Reads one statement including withholding_variant, withholding_cents, net_payable_cents, clawback_applied_cents and dispute_adjustment_cents."
    roles: [Creator, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: []
    output: EarningsStatement
    side_effects: []
  - method: POST
    path: "/monetization/earnings-statements/{statement_id}/finalize"
    description: >-
      Switches the statement from the PROVISIONAL (aggregate-then-round)
      withholding variant to the FINAL (per-event-then-sum) variant and
      re-resolves the tax rate, then re-evaluates the period's compound
      FINALIZED condition.
    roles: [FinanceOperator]
    code: 200
    input: []
    output: EarningsStatement
    side_effects:
      - "withholding_variant = FINAL; withholding_rate_bps re-resolved from the creator's current non-SUPERSEDED TaxProfile; withholding_cents and net_payable_cents recomputed by calculations.statement_withholding (FINAL)"
      - "when (provisional withholding_cents - final withholding_cents) != 0 a WITHHOLDING_TRUE_UP LedgerEntry for that signed delta is appended; when the delta is 0 no entry is written"
      - "status = FINALIZED; finalized_at = current logical time; EarningsStatement.version += 1"
      - "the parent EarningsPeriod re-evaluates its compound condition and becomes FINALIZED when statement_count >= 1 and finalized_statement_count == statement_count"
      - "the statement now enters Creator.statement_payable_cents, so available_balance_cents rises by (net_payable_cents - clawback_applied_cents + dispute_adjustment_cents)"
  - method: POST
    path: "/monetization/earnings-statements/{statement_id}/dispute"
    description: "Creator disputes a finalized statement (FINALIZED|ADJUSTED -> UNDER_DISPUTE), which withdraws its money from the payable set."
    roles: [Creator]
    code: 200
    input: [dispute_reason, dispute_claimed_amount_cents]
    output: EarningsStatement
    side_effects:
      - "status = UNDER_DISPUTE; dispute_reason and dispute_claimed_amount_cents written; EarningsStatement.version += 1"
      - "the statement leaves Creator.statement_payable_cents, so available_balance_cents drops by (net_payable_cents - clawback_applied_cents + dispute_adjustment_cents)"
      - "the statement also leaves the clawback waterfall's bucket list until the dispute is resolved"
  - method: POST
    path: "/monetization/earnings-statements/{statement_id}/resolve-dispute"
    description: >-
      Finance decides the dispute. REJECTED closes the cycle back to FINALIZED
      with the money exactly restored; UPHELD credits the statement and lands it
      in ADJUSTED.
    roles: [FinanceOperator]
    code: 200
    input: [decision, adjustment_cents]
    output: EarningsStatement
    side_effects:
      - "REJECTED: status = FINALIZED; dispute_resolution = REJECTED; dispute_adjustment_cents unchanged; NO LedgerEntry is appended; statement_payable_cents returns to its exact pre-dispute value"
      - "UPHELD: status = ADJUSTED; dispute_resolution = UPHELD; dispute_adjustment_cents = adjustment_cents; a DISPUTE_ADJUSTMENT LedgerEntry for +adjustment_cents is appended; statement_payable_cents returns raised by adjustment_cents"
      - "EarningsStatement.version += 1; the parent period's compound condition is re-evaluated (ADJUSTED counts as finalized)"
  # -------------------------------- payouts ---------------------------------
  - method: POST
    path: "/monetization/payouts"
    description: >-
      Creates a disbursement for the creator's whole available balance. Runs
      calculations.payout_fee_and_amount once; the fee tier is keyed on the
      PRE-fee payable and is never recomputed afterwards.
    roles: [Creator, FinanceOperator]
    code: 201
    input: [creator_id]
    output: Payout
    side_effects:
      - "method = Creator.payout_method snapshot; payable_before_fee_cents = Creator.available_balance_cents snapshot; fee_cents, amount_cents and fund_credit_cents written by calculations.payout_fee_and_amount; state = PENDING"
      - "every EarningsStatement of the creator with status IN {FINALIZED, ADJUSTED} and payout_id == null is attached (payout_id = this Payout.id) in EarningsPeriod.period_start ASC, created_at ASC order; Payout.statement_count follows"
      - "Creator.fund_credit_balance_cents = 0 (consumed into fund_credit_cents)"
      - "a PAYOUT_DEBIT LedgerEntry for -amount_cents is appended, then a PAYOUT_FEE LedgerEntry for -fee_cents when fee_cents > 0"
      - "Creator.payout_state recomputed to PAYOUT_IN_FLIGHT; Creator.version += 1"
  - method: GET
    path: "/monetization/payouts"
    description: "Reverse-reachability GET for Payout.creator_id; ordered created_at ASC."
    roles: [Creator, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: ["creator_id?", "state?", "method?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: GET
    path: "/monetization/payouts/{payout_id}"
    description: "Reads one payout including fee_cents, amount_cents, fund_credit_cents, retry_count and failure_code."
    roles: [Creator, FinanceOperator, PlatformAdmin, Auditor]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: POST
    path: "/monetization/payouts/{payout_id}/submit"
    description: >-
      Hands the payout to the processing rail (PENDING -> PROCESSING). Blocked
      when the creator's payout_state is HOLD, which is reachable after creation
      because HOLD outranks PAYOUT_IN_FLIGHT.
    roles: [FinanceOperator]
    code: 200
    input: []
    output: Payout
    side_effects:
      - "state = PROCESSING; submitted_at = current logical time; Payout.version += 1"
      - "no ledger movement: the debit was taken at creation"
  - method: POST
    path: "/monetization/payouts/{payout_id}/record-settlement"
    description: >-
      Records the processor outcome. The FAILED outcome branches on retry_count:
      below MAX_PAYOUT_RETRIES it lands in FAILED (retryable), at
      MAX_PAYOUT_RETRIES it lands in the terminal ABANDONED with an otherwise
      identical side-effect set.
    roles: [FinanceOperator]
    code: 200
    input: [outcome, "failure_code?"]
    output: Payout
    side_effects:
      - "SUCCEEDED: state = PAID; settled_at = now; Creator.lifetime_paid_cents += amount_cents; Creator.consecutive_payment_failures = 0; every attached EarningsStatement becomes PAID; Creator.payout_state recomputed; NO LedgerEntry is appended"
      - "FAILED with retry_count < MAX_PAYOUT_RETRIES: state = FAILED; failure_code written; Creator.consecutive_payment_failures += 1; a PAYOUT_REVERSAL LedgerEntry for +(amount_cents + fee_cents) is appended; attached statements are detached (payout_id = null) and keep their pre-payout status; Creator.fund_credit_balance_cents += fund_credit_cents; Creator.payout_state recomputed to ACCRUING (or HOLD/ARREARS if those outrank)"
      - "FAILED with retry_count == MAX_PAYOUT_RETRIES: state = ABANDONED; settled_at = now; the same reversal, detachment, fund-credit restore and failure-counter increment as the FAILED branch"
      - "Payout.version += 1 and Creator.version += 1 in every branch"
  - method: POST
    path: "/monetization/payouts/{payout_id}/retry"
    description: >-
      Re-submits a failed payout (FAILED -> PROCESSING), closing the retry
      cycle. fee_cents and amount_cents are reused verbatim — the fee tier is
      NOT re-selected even if the creator's balance changed in between.
    roles: [FinanceOperator]
    code: 200
    input: []
    output: Payout
    side_effects:
      - "state = PROCESSING; retry_count += 1; submitted_at = now; failure_code = null; Payout.version += 1"
      - "a PAYOUT_DEBIT LedgerEntry for -amount_cents and a PAYOUT_FEE LedgerEntry for -fee_cents (when fee_cents > 0) are appended again"
      - "the same EarningsStatements are re-attached (payout_id = this Payout.id), selected as the creator's statements with status IN {FINALIZED, ADJUSTED} and payout_id == null in period_start ASC, created_at ASC order"
      - "Creator.fund_credit_balance_cents is consumed to 0 again up to fund_credit_cents; Creator.payout_state recomputed to PAYOUT_IN_FLIGHT; Creator.version += 1"
  # ----------------------------- investigations -----------------------------
  - method: POST
    path: "/monetization/investigations"
    description: >-
      Opens a policy investigation over a CLOSED violation window
      [violation_window_start, violation_window_end]. When hold_payouts is true
      the creator's whole positive balance is encumbered at once.
    roles: [PolicyReviewer]
    code: 201
    input: [creator_id, scope, violation_window_start, violation_window_end, "hold_payouts?"]
    output: Investigation
    side_effects:
      - "creates the Investigation with state OPEN, opened_by_user_id = X-User-ID, clawback_* fields all 0"
      - "hold_payouts == true: hold_amount_cents = max(Creator.available_balance_cents, 0) snapshotted BEFORE the hold applies, then Creator.held_cents rises by that amount and available_balance_cents drops correspondingly"
      - "hold_payouts == false: hold_amount_cents = 0 and no balance moves"
      - "Creator.payout_state recomputed by calculations.payout_state_resolution (HOLD unless ARREARS outranks); Creator.version += 1"
      - "no RevenueEvent is touched at open time: assessment happens only at substantiation"
  - method: GET
    path: "/monetization/investigations"
    description: "Reverse-reachability GET for Investigation.creator_id; ordered created_at ASC."
    roles: [PolicyReviewer, FinanceOperator, PlatformAdmin, Auditor, Creator]
    code: 200
    input: ["creator_id?", "state?", "hold_payouts?", "limit?", "offset?"]
    output: Investigation[]
    side_effects: []
  - method: GET
    path: "/monetization/investigations/{investigation_id}"
    description: "Reads one investigation including hold_amount_cents and the three clawback_* results."
    roles: [PolicyReviewer, FinanceOperator, PlatformAdmin, Auditor, Creator]
    code: 200
    input: []
    output: Investigation
    side_effects: []
  - method: POST
    path: "/monetization/investigations/{investigation_id}/substantiate"
    description: >-
      Confirms the violation (OPEN -> SUBSTANTIATED) and runs the five-hop
      retroactive clawback cascade. The resolving reviewer may not be the
      opening reviewer (validation 44).
    roles: [PolicyReviewer]
    code: 200
    input: [finding]
    output: Investigation
    side_effects:
      - "hop 1: state = SUBSTANTIATED; resolved_by_user_id = X-User-ID; resolved_at = now; finding written; clawback_base_cents assessed by calculations.clawback_waterfall (SUBSTANTIATION_SWEEP) over the creator's ACCRUED RevenueEvents inside the closed window, each of which becomes CLAWED_BACK; Creator.active_strike_count += 1 and last_strike_at = now, which itself forces calculations.eligibility_evaluation to write eligibility_status = SUSPENDED with last_evaluation_failed_criteria = [POLICY_COMPLIANCE] and evaluation_count += 1"
      - "hop 2: because clawback_base_cents > 0, the waterfall consumes the creator's EarningsStatements with status IN {FINALIZED, ADJUSTED} and payout_id == null in EarningsPeriod.period_start ASC, created_at ASC order, raising each clawback_applied_cents and setting each to ADJUSTED; clawback_recovered_cents and clawback_unrecovered_cents written"
      - "hop 3: because clawback_recovered_cents > 0 a CLAWBACK LedgerEntry for -clawback_recovered_cents is appended (source_entity INVESTIGATION); because clawback_unrecovered_cents > 0, Creator.outstanding_clawback_cents += clawback_unrecovered_cents"
      - "hop 4: because outstanding_clawback_cents > 0, calculations.payout_state_resolution writes Creator.payout_state = ARREARS"
      - "hop 5: because payout_state became ARREARS, every Payout of this creator with state == PENDING becomes VOIDED, each appending a PAYOUT_REVERSAL LedgerEntry for +(amount_cents + fee_cents), detaching its statements and restoring fund_credit_cents; consecutive_payment_failures is NOT incremented"
      - "Creator.held_cents drops to 0 because this investigation is no longer OPEN; statements freed by hop 5 are NOT re-swept in this request"
      - "Investigation.version += 1; Creator.version += 1"
  - method: POST
    path: "/monetization/investigations/{investigation_id}/clear"
    description: >-
      Exonerates the creator (OPEN -> CLEARED) — the divergent branch of the
      same fork as substantiate, with a disjoint side-effect set.
    roles: [PolicyReviewer]
    code: 200
    input: [finding]
    output: Investigation
    side_effects:
      - "state = CLEARED; resolved_by_user_id = X-User-ID; resolved_at = now; finding written; Investigation.version += 1"
      - "clawback_base_cents, clawback_recovered_cents and clawback_unrecovered_cents stay 0; no RevenueEvent, EarningsStatement or LedgerEntry changes; active_strike_count is NOT incremented"
      - "Creator.held_cents drops to 0 (the hold is released) and payout_state is recomputed: ARREARS if arrears remain, else HOLD if another OPEN holding investigation exists, else PAYOUT_IN_FLIGHT if a PENDING or PROCESSING Payout exists, else ACCRUING; Creator.version += 1"
  # ------------------------------ creator funds -----------------------------
  - method: POST
    path: "/monetization/creator-funds"
    description: >-
      Declares a supplemental fund for a period, choosing between the two
      published allocation methodologies (transparency vs predictability).
    roles: [PlatformAdmin]
    code: 201
    input: [name, period_id, total_pool_cents, methodology, "min_watch_time_minutes?", "max_allocation_cents?"]
    output: CreatorFund
    side_effects:
      - "creates the fund with status DRAFT, allocation_run_count 0, allocated_cents 0, unallocated_remainder_cents = total_pool_cents, recipient_count 0"
  - method: GET
    path: "/monetization/creator-funds"
    description: "Reverse-reachability GET for CreatorFund.period_id; ordered created_at ASC."
    roles: [PlatformAdmin, FinanceOperator, Auditor, Creator]
    code: 200
    input: ["period_id?", "status?", "methodology?", "limit?", "offset?"]
    output: CreatorFund[]
    side_effects: []
  - method: GET
    path: "/monetization/creator-funds/{fund_id}"
    description: "Reads one fund including allocated_cents, unallocated_remainder_cents, recipient_count and version (the OCC comparand)."
    roles: [PlatformAdmin, FinanceOperator, Auditor, Creator]
    code: 200
    input: []
    output: CreatorFund
    side_effects: []
  - method: POST
    path: "/monetization/creator-funds/{fund_id}/allocate"
    description: >-
      Runs calculations.fund_allocation against the current candidate pool.
      OCC-guarded (§1.2.1 fund-allocate-stale-fund) because an ALLOCATED fund
      legitimately accepts a supersede run, so no state precondition can
      distinguish a caller working from a stale pool.
    roles: [FinanceOperator]
    code: 200
    input: [expected_fund_version]
    output: CreatorFund
    side_effects:
      - "when status == ALLOCATED: every FundAllocation with status == ACTIVE becomes VOIDED with voided_at = now and void_reason = \"SUPERSEDED_BY_REALLOCATION\""
      - "one FundAllocation per positive recipient is created per calculations.fund_allocation with rank, methodology_snapshot and watch_time_minutes_at_allocation snapshotted"
      - "status = ALLOCATED; allocation_run_count += 1; allocated_cents, unallocated_remainder_cents and recipient_count recomputed; the invariant allocated_cents + unallocated_remainder_cents == total_pool_cents holds"
      - "increments CreatorFund.version by 1"
  - method: POST
    path: "/monetization/creator-funds/{fund_id}/void-allocations"
    description: "Discards an allocation run and returns the fund to DRAFT (ALLOCATED -> DRAFT). OCC-guarded on the same version field as allocate."
    roles: [FinanceOperator]
    code: 200
    input: [expected_fund_version, reason]
    output: CreatorFund
    side_effects:
      - "every FundAllocation with status == ACTIVE becomes VOIDED with voided_at = now and void_reason = the supplied reason"
      - "status = DRAFT; allocated_cents returns to 0 and unallocated_remainder_cents returns to total_pool_cents; recipient_count returns to 0; allocation_run_count is NOT decremented"
      - "increments CreatorFund.version by 1; no Creator.fund_credit_balance_cents is touched because nothing was disbursed"
  - method: POST
    path: "/monetization/creator-funds/{fund_id}/disburse"
    description: "Pays the allocation set into the recipients' fund credit balances (ALLOCATED -> DISBURSED, terminal)."
    roles: [FinanceOperator]
    code: 200
    input: []
    output: CreatorFund
    side_effects:
      - "for each FundAllocation with status == ACTIVE, in rank ASC order: a FUND_CREDIT LedgerEntry for +amount_cents is appended (source_entity FUND_ALLOCATION) and the recipient's Creator.fund_credit_balance_cents += amount_cents, raising that creator's available_balance_cents"
      - "status = DISBURSED; disbursed_at = current logical time; CreatorFund.version += 1"
      - "SUM of the appended FUND_CREDIT amounts == allocated_cents (fund-pool conservation invariant I2)"
  - method: GET
    path: "/monetization/creator-funds/{fund_id}/fund-allocations"
    description: >-
      Reverse-reachability GET for FundAllocation.fund_id; ordered rank ASC.
      This is the only channel through which the cascade-created allocation rows
      (amount_cents, rank, methodology_snapshot) can be observed.
    roles: [PlatformAdmin, FinanceOperator, Auditor]
    code: 200
    input: ["status?", "creator_id?", "limit?", "offset?"]
    output: FundAllocation[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
# Every id below is referenced by at least one §1.4 validation row or one
# §1.2.1 concurrency rule, and every error_id referenced anywhere in this file
# appears below. `condition:` states the trigger; the winning error for a
# multi-violation request is decided solely by §1.4 priority order.
# =============================================================================
errors:
  # ------------------------------ 401 / 403 ---------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or blank (validation 1)"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of Creator, PolicyReviewer, FinanceOperator, PlatformAdmin, Auditor (validation 2)"
  - id: ERR_CREATOR_IDENTITY_UNKNOWN
    http: 401
    condition: "X-User-Role == Creator but X-User-ID is not the id of any Creator row (validation 3)"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is absent from the endpoint's §1.5 roles list (validation 4)"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Creator addresses a TaxProfile, ContentItem, Appeal, EarningsStatement, Payout, Investigation or creator path that belongs to another creator, or supplies a body creator_id != X-User-ID (validation 12)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The reviewer resolving an Investigation is its opened_by_user_id (validation 44), or the reviewer deciding an Appeal is the ContentItem's last_rated_by_user_id (validation 45)"
  # -------------------------------- 400 -------------------------------------
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset < 0 on a list endpoint (validation 5)"
  # -------------------------------- 404 -------------------------------------
  - id: ERR_CREATOR_NOT_FOUND
    http: 404
    condition: "creator_id in the path or body matches no Creator row (validations 10, 11)"
  - id: ERR_TAX_PROFILE_NOT_FOUND
    http: 404
    condition: "tax_profile_id in the path matches no TaxProfile row (validation 10)"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id in the path or body matches no RevenueProduct row (validations 10, 11)"
  - id: ERR_CONTENT_ITEM_NOT_FOUND
    http: 404
    condition: "content_item_id in the path or body matches no ContentItem row (validations 10, 11)"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "appeal_id in the path matches no Appeal row (validation 10)"
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "period_id in the path or body matches no EarningsPeriod row (validations 10, 11)"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "statement_id in the path matches no EarningsStatement row (validation 10)"
  - id: ERR_PAYOUT_NOT_FOUND
    http: 404
    condition: "payout_id in the path matches no Payout row (validation 10)"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "investigation_id in the path matches no Investigation row (validation 10)"
  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "fund_id in the path matches no CreatorFund row (validation 10)"
  # ------------------------- 409 state preconditions ------------------------
  - id: ERR_TAX_PROFILE_NOT_DRAFT
    http: 409
    condition: "submit called on a TaxProfile whose status != DRAFT (validation 13)"
  - id: ERR_TAX_PROFILE_NOT_SUBMITTED
    http: 409
    condition: "verify called on a TaxProfile whose status != SUBMITTED (validation 14)"
  - id: ERR_TAX_PROFILE_NOT_REJECTED
    http: 409
    condition: "revise called on a TaxProfile whose status != REJECTED (validation 15)"
  - id: ERR_PRODUCT_ALREADY_RETIRED
    http: 409
    condition: "retire or PATCH called on a RevenueProduct whose status == RETIRED (validations 16, 17)"
  - id: ERR_RATING_UNCHANGED
    http: 409
    condition: "rate called with a suitability_rating equal to the item's stored rating (validation 18)"
  - id: ERR_CONTENT_NOT_APPEALABLE
    http: 409
    condition: "An Appeal is created against a ContentItem whose monetization_state == MONETIZED (validation 19)"
  - id: ERR_APPEAL_ALREADY_OPEN
    http: 409
    condition: "An Appeal is created while the item already has one with state IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} (validation 20)"
  - id: ERR_APPEAL_NOT_SUBMITTED
    http: 409
    condition: "start-review called on an Appeal whose state != SUBMITTED (validation 21)"
  - id: ERR_APPEAL_NOT_UNDER_REVIEW
    http: 409
    condition: "request-info or decide called on an Appeal whose state != UNDER_REVIEW (validation 22)"
  - id: ERR_APPEAL_NOT_INFO_REQUESTED
    http: 409
    condition: "respond called on an Appeal whose state != INFO_REQUESTED (validation 23)"
  - id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http: 409
    condition: "respond called when revision_round == APPEAL_MAX_ROUNDS (2) — the cycle's termination condition (validation 24)"
  - id: ERR_PERIOD_NOT_OPEN
    http: 409
    condition: "close called on an EarningsPeriod whose status != OPEN (validation 25)"
  - id: ERR_STATEMENT_NOT_PROVISIONAL
    http: 409
    condition: "finalize called on an EarningsStatement whose status != PROVISIONAL (validation 26)"
  - id: ERR_PERIOD_NOT_CLOSED
    http: 409
    condition: "finalize called while the statement's EarningsPeriod.status != CLOSED (validation 27)"
  - id: ERR_STATEMENT_NOT_DISPUTABLE
    http: 409
    condition: "dispute called on an EarningsStatement whose status is not FINALIZED or ADJUSTED (validation 28)"
  - id: ERR_STATEMENT_ALREADY_ATTACHED
    http: 409
    condition: "dispute called on an EarningsStatement whose payout_id is non-null (validation 29)"
  - id: ERR_STATEMENT_NOT_UNDER_DISPUTE
    http: 409
    condition: "resolve-dispute called on an EarningsStatement whose status != UNDER_DISPUTE (validation 30)"
  - id: ERR_INVESTIGATION_NOT_OPEN
    http: 409
    condition: "substantiate or clear called on an Investigation whose state != OPEN (validation 31)"
  - id: ERR_PAYOUT_NOT_PENDING
    http: 409
    condition: "submit called on a Payout whose state != PENDING (validation 32)"
  - id: ERR_PAYOUT_HELD
    http: 409
    condition: "submit called while the payee's Creator.payout_state == HOLD (validation 33)"
  - id: ERR_PAYOUT_NOT_PROCESSING
    http: 409
    condition: "record-settlement called on a Payout whose state != PROCESSING (validation 34)"
  - id: ERR_PAYOUT_NOT_FAILED
    http: 409
    condition: "retry called on a Payout whose state != FAILED (validation 35)"
  - id: ERR_PAYOUT_RETRIES_EXHAUSTED
    http: 409
    condition: "retry called when retry_count == MAX_PAYOUT_RETRIES (2) (validation 36)"
  - id: ERR_CREATOR_NOT_PAYABLE
    http: 409
    condition: "A Payout is created while Creator.payout_state IN {HOLD, ARREARS, PAYOUT_IN_FLIGHT} (validation 37)"
  - id: ERR_CREATOR_NOT_ELIGIBLE
    http: 409
    condition: "A RevenueEvent is created while Creator.eligibility_status != ELIGIBLE (validation 38)"
  - id: ERR_PRODUCT_RETIRED
    http: 409
    condition: "A RevenueEvent is created against a RevenueProduct whose status == RETIRED (validation 39)"
  - id: ERR_FUND_NOT_ALLOCATABLE
    http: 409
    condition: "allocate called on a CreatorFund whose status == DISBURSED (validation 40)"
  - id: ERR_FUND_NOT_ALLOCATED
    http: 409
    condition: "void-allocations or disburse called on a CreatorFund whose status != ALLOCATED (validation 41)"
  - id: ERR_ACCRUAL_UNDER_INVESTIGATION
    http: 409
    condition: "A RevenueEvent's occurred_at falls inside the closed window of an OPEN Investigation of the same creator (validation 48)"
  - id: ERR_FUND_PERIOD_FINALIZED
    http: 409
    condition: "A CreatorFund is created against an EarningsPeriod whose status == FINALIZED (validation 63)"
  - id: ERR_FUND_ALREADY_EXISTS_FOR_PERIOD
    http: 409
    condition: "A CreatorFund is created while another fund for the same period has status IN {DRAFT, ALLOCATED} (validation 64)"
  - id: ERR_PERIOD_WINDOW_OVERLAP
    http: 409
    condition: "A new EarningsPeriod's half-open window intersects an existing period's half-open window; abutting endpoints do NOT intersect (validation 67)"
  - id: ERR_PERIOD_CLOSE_OUT_OF_ORDER
    http: 409
    condition: "close called while an older OPEN EarningsPeriod (strictly earlier period_start) still exists (validation 68)"
  - id: ERR_INVESTIGATION_WINDOW_OVERLAP
    http: 409
    condition: "A new Investigation's closed window intersects that of another OPEN Investigation of the same creator; touching endpoints DO intersect (validation 70)"
  # -------------------------------- 412 -------------------------------------
  - id: ERR_STALE_CREATOR_VERSION
    http: 412
    condition: "expected_creator_version != Creator.version on POST /monetization/tax-profiles (§1.2.1 tax-profile-create-stale-creator, validation 43)"
  - id: ERR_STALE_FUND_VERSION
    http: 412
    condition: "expected_fund_version != CreatorFund.version on allocate or void-allocations (§1.2.1 fund-allocate-stale-fund, validation 42)"
  # -------------------------------- 422 -------------------------------------
  - id: ERR_MISSING_REQUIRED_FIELD
    http: 422
    condition: "A required input field is absent or null (validation 6)"
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "A field has the wrong JSON type, an undeclared enum member, an unparseable datetime, or a blank/over-long text value (validations 7, 9)"
  - id: ERR_FIELD_OUT_OF_RANGE
    http: 422
    condition: "A numeric field violates its §1.1 constraint (validation 8)"
  - id: ERR_RATING_SOURCE_RESERVED
    http: 422
    condition: "rate called with rating_source DEFAULT or APPEAL (validation 46)"
  - id: ERR_TAX_DOCUMENTATION_MISSING
    http: 422
    condition: "A Payout is created for a creator with no TaxProfile in status VERIFIED (validation 47)"
  - id: ERR_CONTENT_CREATOR_MISMATCH
    http: 422
    condition: "A RevenueEvent's content_item_id belongs to a different creator than its creator_id (validation 49)"
  - id: ERR_CONTENT_LINK_REQUIRED
    http: 422
    condition: "A RevenueEvent on an ADVERTISING product omits content_item_id (validation 50)"
  - id: ERR_CONTENT_LINK_FORBIDDEN
    http: 422
    condition: "A RevenueEvent on a SUBSCRIPTIONS, TIPS or COMMERCE product supplies content_item_id (validation 51)"
  - id: ERR_TAX_COUNTRY_MISMATCH
    http: 422
    condition: "TaxProfile.country_code != Creator.country_code at creation (validation 52)"
  - id: ERR_TAX_FORM_COUNTRY_INVALID
    http: 422
    condition: "form_type W9 with country_code != US, or form_type W8BEN with country_code == US (validation 53)"
  - id: ERR_TREATY_RATE_REQUIRED
    http: 422
    condition: "treaty_claimed == true with a null treaty_rate_bps, on create, revise or submit (validation 54)"
  - id: ERR_TREATY_RATE_FORBIDDEN
    http: 422
    condition: "treaty_claimed == false with a non-null treaty_rate_bps (validation 55)"
  - id: ERR_APPEAL_RATING_NOT_IMPROVEMENT
    http: 422
    condition: "requested_rating is not strictly less restrictive than the item's current suitability_rating (validation 56)"
  - id: ERR_REJECTION_REASON_REQUIRED
    http: 422
    condition: "verify with decision REJECT and a blank or absent rejection_reason (validation 57)"
  - id: ERR_REJECTION_REASON_FORBIDDEN
    http: 422
    condition: "verify with decision VERIFY and a non-null rejection_reason (validation 58)"
  - id: ERR_FAILURE_CODE_REQUIRED
    http: 422
    condition: "record-settlement with outcome FAILED and no failure_code (validation 59)"
  - id: ERR_FAILURE_CODE_FORBIDDEN
    http: 422
    condition: "record-settlement with outcome SUCCEEDED and a non-null failure_code (validation 60)"
  - id: ERR_ADJUSTMENT_OUT_OF_BOUNDS
    http: 422
    condition: "resolve-dispute with decision REJECTED and adjustment_cents != 0, or decision UPHELD and adjustment_cents outside 0 < x <= dispute_claimed_amount_cents (validation 61)"
  - id: ERR_SHARE_SPLIT_NOT_WHOLE
    http: 422
    condition: "creator_share_bps + platform_fee_bps != 10000 on the resulting RevenueProduct row (validation 62)"
  - id: ERR_FUND_CAP_BELOW_FLOOR
    http: 422
    condition: "methodology GUARANTEED_FLOOR_WATERFALL with max_allocation_cents < FUND_GUARANTEED_FLOOR_CENTS (5000) (validation 65)"
  - id: ERR_PERIOD_WINDOW_INVALID
    http: 422
    condition: "period_end <= period_start on EarningsPeriod creation (validation 66)"
  - id: ERR_INVESTIGATION_WINDOW_INVALID
    http: 422
    condition: "violation_window_end < violation_window_start on Investigation creation (validation 69)"
  - id: ERR_NO_OPEN_PERIOD_FOR_EVENT
    http: 422
    condition: "No EarningsPeriod with status == OPEN contains the event's occurred_at in its half-open window (validation 71)"
  - id: ERR_PUBLISHED_IN_FUTURE
    http: 422
    condition: "ContentItem.published_at is after the current logical time (validation 72)"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "set_current_utc called with to_iso8601 strictly earlier than the current logical time (validation 73)"
  - id: ERR_NO_PAYABLE_BALANCE
    http: 422
    condition: "A Payout is created while Creator.available_balance_cents <= 0 (validation 74)"
  - id: ERR_BELOW_PAYOUT_THRESHOLD
    http: 422
    condition: "A Payout is created while 0 < Creator.available_balance_cents < Creator.payout_threshold_cents (validation 75)"
  - id: ERR_INSUFFICIENT_BALANCE_FOR_RETRY
    http: 422
    condition: "retry called while Creator.available_balance_cents < Payout.amount_cents + Payout.fee_cents (validation 76)"
  - id: ERR_DISPUTE_AMOUNT_EXCEEDS_STATEMENT
    http: 422
    condition: "dispute_claimed_amount_cents <= 0 or > EarningsStatement.net_payable_cents (validation 77)"
  - id: ERR_FUND_POOL_EMPTY
    http: 422
    condition: "allocate finds no Creator matching the candidate-pool filter of calculations.fund_allocation (validation 78)"
  - id: ERR_FUND_NO_RECIPIENTS
    http: 422
    condition: "disburse called while recipient_count == 0 (validation 79)"

# =============================================================================
# 1.7 RBAC Matrix   (role_model: segregation_of_duties)
# =============================================================================
# Five roles. Money movement is exclusive to FinanceOperator, policy judgement
# exclusive to PolicyReviewer, configuration exclusive to PlatformAdmin, and
# Auditor is read-only everywhere. The two intra-role segregation rules are
# enforced by validations 44 and 45 and are NOT expressible as role membership:
#   SoD-1  the PolicyReviewer who opened an Investigation may not substantiate
#          or clear it (comparand Investigation.opened_by_user_id).
#   SoD-2  the PolicyReviewer who last rated a ContentItem may not decide an
#          Appeal against that rating (comparand ContentItem.last_rated_by_user_id).
# Both comparands are opaque X-User-ID strings, so two distinct PolicyReviewer
# ids are required to drive any investigation or appeal to a decision.
# =============================================================================
roles:
  - name: Creator
    description: >-
      The monetizing creator. Sees and acts on nothing but its own subtree:
      its Creator row, its TaxProfiles, ContentItems, RevenueEvents, Appeals,
      EarningsStatements, Payouts, Investigations, FundAllocations and
      LedgerEntries. Cannot rate content, cannot decide appeals, cannot close a
      period, cannot finalize a statement and cannot settle a payout — it may
      only request money and contest decisions.
    identity: "entity_backed:Creator"
    exclusive_operations:
      - "POST /monetization/tax-profiles/{tax_profile_id}/submit"
      - "POST /monetization/tax-profiles/{tax_profile_id}/revise"
      - "POST /monetization/appeals"
      - "POST /monetization/appeals/{appeal_id}/respond"
      - "POST /monetization/earnings-statements/{statement_id}/dispute"
    shared_operations:
      - "POST /monetization/tax-profiles (shared with FinanceOperator)"
      - "POST /monetization/content-items (shared with PlatformAdmin)"
      - "POST /monetization/payouts (shared with FinanceOperator)"
      - "POST /monetization/creators/{creator_id}/payout-settings (shared with FinanceOperator)"
      - "GET /monetization/creators, GET /monetization/creators/{creator_id}, GET /monetization/creators/{creator_id}/earnings-summary, GET /monetization/creators/{creator_id}/ledger-entries, GET /monetization/creators/{creator_id}/fund-allocations"
      - "GET /monetization/tax-profiles, GET /monetization/tax-profiles/{tax_profile_id}"
      - "GET /monetization/revenue-products, GET /monetization/revenue-events"
      - "GET /monetization/content-items, GET /monetization/content-items/{content_item_id}"
      - "GET /monetization/appeals, GET /monetization/appeals/{appeal_id}"
      - "GET /monetization/earnings-periods, GET /monetization/earnings-periods/{period_id}"
      - "GET /monetization/earnings-statements, GET /monetization/earnings-statements/{statement_id}"
      - "GET /monetization/payouts, GET /monetization/payouts/{payout_id}"
      - "GET /monetization/investigations, GET /monetization/investigations/{investigation_id}"
      - "GET /monetization/creator-funds, GET /monetization/creator-funds/{fund_id}"
    scoping: >-
      Validation 12. On every single-resource path the addressed row's
      creator_id (or the Creator's own id) MUST equal X-User-ID, else
      ERR_NOT_RESOURCE_OWNER 403. Any creator_id supplied in a request body
      MUST equal X-User-ID. List endpoints do NOT error: they are silently
      narrowed to rows whose creator_id == X-User-ID (GET
      /monetization/creators returns exactly one row; GET
      /monetization/revenue-products and GET /monetization/earnings-periods are
      global configuration and are NOT narrowed).
  - name: PolicyReviewer
    description: >-
      Trust-and-safety reviewer. Owns content suitability ratings, policy
      strikes, revenue-hold investigations and appeal decisions. Has no money
      authority at all: cannot create, submit, settle or retry a Payout, cannot
      close a period and cannot finalize or adjust a statement — even though its
      actions are what cause clawbacks and holds.
    identity: opaque
    exclusive_operations:
      - "POST /monetization/creators/{creator_id}/policy-strikes"
      - "POST /monetization/content-items/{content_item_id}/rate"
      - "POST /monetization/appeals/{appeal_id}/start-review"
      - "POST /monetization/appeals/{appeal_id}/request-info"
      - "POST /monetization/appeals/{appeal_id}/decide"
      - "POST /monetization/investigations"
      - "POST /monetization/investigations/{investigation_id}/substantiate"
      - "POST /monetization/investigations/{investigation_id}/clear"
    shared_operations:
      - "GET /monetization/creators, GET /monetization/creators/{creator_id}"
      - "GET /monetization/content-items, GET /monetization/content-items/{content_item_id}"
      - "GET /monetization/revenue-products, GET /monetization/revenue-events"
      - "GET /monetization/appeals, GET /monetization/appeals/{appeal_id}"
      - "GET /monetization/earnings-periods, GET /monetization/earnings-periods/{period_id}"
      - "GET /monetization/investigations, GET /monetization/investigations/{investigation_id}"
    scoping: >-
      Unscoped across creators — a reviewer sees every creator's content,
      appeals and investigations. Constrained instead by the two per-record SoD
      rules: X-User-ID is written into Investigation.opened_by_user_id and
      ContentItem.last_rated_by_user_id and is then compared against the acting
      id at resolution time (validations 44, 45 -> ERR_SEGREGATION_OF_DUTIES).
      A reviewer may not read EarningsStatements, Payouts, LedgerEntries or
      CreatorFunds: policy judgement is deliberately blind to the money it moves.
  - name: FinanceOperator
    description: >-
      Payments and tax operator. The only role that can move money: verify tax
      documentation, ingest revenue, close a period, finalize a statement,
      resolve a dispute, create/submit/settle/retry a payout, and allocate,
      void or disburse a creator fund. Cannot rate content, cannot open or
      resolve an investigation, and cannot change platform configuration.
    identity: opaque
    exclusive_operations:
      - "POST /monetization/creators/{creator_id}/evaluate"
      - "POST /monetization/tax-profiles/{tax_profile_id}/verify"
      - "POST /monetization/earnings-periods/{period_id}/close"
      - "POST /monetization/earnings-statements/{statement_id}/finalize"
      - "POST /monetization/earnings-statements/{statement_id}/resolve-dispute"
      - "POST /monetization/payouts/{payout_id}/submit"
      - "POST /monetization/payouts/{payout_id}/record-settlement"
      - "POST /monetization/payouts/{payout_id}/retry"
      - "POST /monetization/creator-funds/{fund_id}/allocate"
      - "POST /monetization/creator-funds/{fund_id}/void-allocations"
      - "POST /monetization/creator-funds/{fund_id}/disburse"
    shared_operations:
      - "POST /monetization/tax-profiles (shared with Creator)"
      - "POST /monetization/payouts (shared with Creator)"
      - "POST /monetization/creators/{creator_id}/payout-settings (shared with Creator)"
      - "POST /monetization/revenue-events (shared with PlatformAdmin)"
      - "every GET endpoint except GET /monetization/creator-funds/{fund_id}/fund-allocations is shared; that one is shared with PlatformAdmin and Auditor and also includes FinanceOperator"
    scoping: >-
      Unscoped: operates across all creators. X-User-ID is an opaque operator
      identifier and is never compared against any entity id; no
      FinanceOperator SoD rule exists, so the same operator may close a period,
      finalize its statements and settle the resulting payout.
  - name: PlatformAdmin
    description: >-
      Configuration and data-plane administrator. Owns the catalog
      (RevenueProduct), the calendar (EarningsPeriod), fund declarations,
      creator registration, metrics ingestion and the logical clock. Deliberately
      cannot verify tax forms, close a period, settle a payout, rate content or
      resolve an investigation — configuration authority is separated from both
      money and policy authority.
    identity: opaque
    exclusive_operations:
      - "POST /monetization/_clock/set_current_utc"
      - "POST /monetization/creators"
      - "PATCH /monetization/creators/{creator_id}/metrics"
      - "POST /monetization/revenue-products"
      - "PATCH /monetization/revenue-products/{product_id}"
      - "POST /monetization/revenue-products/{product_id}/retire"
      - "POST /monetization/earnings-periods"
      - "POST /monetization/creator-funds"
    shared_operations:
      - "POST /monetization/content-items (shared with Creator)"
      - "POST /monetization/revenue-events (shared with FinanceOperator)"
      - "every GET endpoint listed for FinanceOperator, plus GET /monetization/creator-funds/{fund_id}/fund-allocations"
    scoping: >-
      Unscoped, opaque identifier, never compared to an entity id. PlatformAdmin
      is NOT a superset role: it holds no money-moving and no policy-judgement
      operation, so a scenario that needs a period closed and a payout settled
      requires a FinanceOperator regardless of admin rights.
  - name: Auditor
    description: >-
      Read-only external auditor supporting creator disputes and regulatory
      review. Can read every collection in the domain, including the ledger and
      the fund allocation rows, and can mutate nothing.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /monetization/creators, GET /monetization/creators/{creator_id}, GET /monetization/creators/{creator_id}/earnings-summary, GET /monetization/creators/{creator_id}/ledger-entries, GET /monetization/creators/{creator_id}/fund-allocations"
      - "GET /monetization/tax-profiles, GET /monetization/tax-profiles/{tax_profile_id}"
      - "GET /monetization/revenue-products, GET /monetization/revenue-events"
      - "GET /monetization/content-items, GET /monetization/content-items/{content_item_id}"
      - "GET /monetization/appeals, GET /monetization/appeals/{appeal_id}"
      - "GET /monetization/earnings-periods, GET /monetization/earnings-periods/{period_id}"
      - "GET /monetization/earnings-statements, GET /monetization/earnings-statements/{statement_id}"
      - "GET /monetization/payouts, GET /monetization/payouts/{payout_id}"
      - "GET /monetization/investigations, GET /monetization/investigations/{investigation_id}"
      - "GET /monetization/creator-funds, GET /monetization/creator-funds/{fund_id}, GET /monetization/creator-funds/{fund_id}/fund-allocations"
    scoping: >-
      Unscoped read, opaque identifier. Every POST, PATCH and DELETE returns
      ERR_ROLE_NOT_PERMITTED 403 at validation priority 4 — before existence,
      before state, and before any OCC check, so an Auditor probing a
      non-existent resource still receives 403 rather than 404.
