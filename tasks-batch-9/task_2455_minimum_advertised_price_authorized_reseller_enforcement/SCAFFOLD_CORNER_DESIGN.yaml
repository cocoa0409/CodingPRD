            - *AGRSIGN
            - *AGRACT
          trigger:
            - &SUPPLYHOLD
              call: "POST /resellers/${res}/supply-status"
              payload: { supply_status: "HOLD", hold_reason: "QUALITY_OBLIGATION", note: "Authenticity labeling audit failed" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
          assert:
