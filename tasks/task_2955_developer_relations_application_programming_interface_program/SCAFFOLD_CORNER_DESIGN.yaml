          - state_machines.AccessApplication DRAFT -> SUBMITTED
        distinguishing_aspect: >-
          The submit endpoint's optional justification_text overrides the stored draft, and a
          replacement of exactly 120 characters must pass, because the comparison is "at least
          JUSTIFICATION_MIN_CHARS". This is the >= side of the same bound the previous instance
          fails at 119, and the override must be persisted on the application row.
