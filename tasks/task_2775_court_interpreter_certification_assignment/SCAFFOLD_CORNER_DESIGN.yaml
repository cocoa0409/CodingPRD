      - name: the_filer_cannot_review_and_the_adjudicator_cannot_decide_the_appeal
        claim_type: Segregation of duties
        grounds: [segregation_of_duties.complaint-review-independence, segregation_of_duties.appeal-decision-independence, "validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", "endpoints[POST /complaints/{id}/review]", "endpoints[POST /complaints/{id}/appeal-decision]"]
        distinguishing_aspect: "Both separations compare X-User-ID against a value the complaint itself recorded earlier — filed_by_user_id for the review and adjudicator_user_id for the appeal decision — so the refusal depends on who acted before, not on the role. The identical body from a second holder of the same role is accepted, which is the only way to tell a duty separation from a role denial."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "ProgramAdmin publishes Language spa; Interpreter Ana Reyes is ACTIVE with a CERTIFIED spa credential and ethics COMPLETED. The Interpreter role's X-User-ID is Ana's Interpreter id."
