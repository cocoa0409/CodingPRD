            - "The first attempt did not bump License.${lic_p1_id}.version, which is why the same ${lic_p1_ver} still satisfied the OCC check on the retry"
      - name: corner_validation_nonpayment_reinstatement_blocked_by_balance
        claim_type: violation_error
