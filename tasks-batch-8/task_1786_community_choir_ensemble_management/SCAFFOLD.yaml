    transitions:
      - from: ISSUED
        to: PARTIAL
        trigger: "system (payment allocation covers part of balance)"
        actor: system
        preconditions: []
        side_effects: ["paid_cents updated; balance_cents recomputed"]
      - from: ISSUED
        to: PAID
        trigger: "system (payment allocation or scholarship application zeroes balance)"
        actor: system
        preconditions: []
        side_effects: ["member ENROLLED -> ACTIVE bubble-up; member.dues_balance_cents recomputed; performance_eligible recomputed"]
      - from: ISSUED
        to: WAIVED
        trigger: "system (scholarship application zeroes balance)"
        actor: system
        preconditions: []
        side_effects: ["member ENROLLED -> ACTIVE bubble-up; dues_balance_cents recomputed"]
      - from: PARTIAL
        to: PAID
        trigger: "system (payment allocation zeroes balance)"
        actor: system
        preconditions: []
        side_effects: ["member ENROLLED -> ACTIVE bubble-up; dues_balance_cents recomputed"]
      - from: PARTIAL
        to: WAIVED
        trigger: "system (scholarship application zeroes balance)"
        actor: system
        preconditions: []
        side_effects: ["member ENROLLED -> ACTIVE bubble-up; dues_balance_cents recomputed"]
      - from: ISSUED
        to: OVERDUE
        trigger: "system (checkpoint: dues_due_date < now and balance_cents > 0)"
        actor: system
        preconditions: []
        side_effects: ["late_fee_accrual runs; member ACTIVE/PROBATION -> SUSPENDED"]
      - from: PARTIAL
        to: OVERDUE
        trigger: "system (checkpoint: dues_due_date < now and balance_cents > 0)"
        actor: system
        preconditions: []
        side_effects: ["late_fee_accrual runs; member ACTIVE/PROBATION -> SUSPENDED"]
      - from: OVERDUE
        to: PAID
        trigger: "system (payment allocation zeroes balance incl. late fee)"
        actor: system
        preconditions: []
        side_effects: ["member SUSPENDED -> ACTIVE if no other OVERDUE invoice and attendance_rate >= threshold"]
      - from: OVERDUE
        to: WAIVED
        trigger: "system (scholarship application zeroes balance incl. late fee)"
        actor: system
        preconditions: []
        side_effects: ["member SUSPENDED -> ACTIVE if eligible"]
      - from: PAID
        to: ISSUED
        trigger: "system (a POSTED payment allocated to this invoice is REFUNDED)"
        actor: system
        preconditions: []
        side_effects: ["paid_cents reduced; balance_cents recomputed; member ACTIVE -> ENROLLED demotion (compensation)"]

  - entity: DuesPayment
    field: status
    initial_state: POSTED
    terminal_states: [REFUNDED]
    transitions:
      - from: POSTED
        to: REFUNDED
        trigger: "POST /v1/dues-payments/{id}/refund"
        actor: Treasurer
        preconditions: ["treasury_balance_cents >= amount_cents (ERR_INSUFFICIENT_TREASURY)"]
        side_effects:
          - "treasury debited by amount_cents"
          - "Each allocated invoice: paid_cents reduced; PAID -> ISSUED if it was PAID"
          - "Member ACTIVE -> ENROLLED if a refunded invoice reopens"
          - "performance_eligible recomputed"

  - entity: ScholarshipGrant
    field: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, APPLIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /v1/scholarship-grants/{id}/decision (decision=APPROVE)"
        actor: Treasurer
        preconditions:
          - "approved_cents (explicit or default min(requested_cents, pool_available_cents)) <= season.pool_available_cents (ERR_SCHOLARSHIP_POOL_EXHAUSTED)"
          - "approved_cents > 0"
        side_effects: ["pool_reserved_cents += approved_cents; pool_available_cents -= approved_cents; decided_by_user_id set"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /v1/scholarship-grants/{id}/decision (decision=REJECT)"
        actor: Treasurer
        preconditions: []
        side_effects: ["decided_by_user_id set"]
      - from: APPROVED
        to: APPLIED
        trigger: "POST /v1/scholarship-grants/{id}/apply"
        actor: Treasurer
        preconditions:
          - "Grant status check runs FIRST within the state tier: grant must be APPROVED (ERR_GRANT_NOT_APPROVED)"
          - "Then: target invoice status in {ISSUED, PARTIAL, OVERDUE} with balance_cents > 0 (ERR_INVOICE_NOT_OPEN)"
          - "applied amount = min(approved_cents, invoice.balance_cents); explicit amount_cents must be <= that min (ERR_GRANT_EXCEEDS_INVOICE_BALANCE)"
        side_effects:
          - "pool_reserved_cents -= approved_cents; pool_spent_cents += applied; pool_available_cents += (approved_cents - applied)"
          - "invoice.scholarship_applied_cents += applied; invoice balance recomputed; invoice -> PAID/WAIVED (WAIVED when scholarship zeroes it) with member bubble-up"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /v1/scholarship-grants/{id}/revoke"
        actor: Treasurer
        preconditions: []
        side_effects: ["pool_reserved_cents -= approved_cents; pool_available_cents += approved_cents (compensation)"]

  - entity: Rehearsal
    field: status
