# =============================================================================
# 1.9 Scaffold Corner Design  (Coverage Index for Non-Difficulty Tests)
#
# Breadth probe for task 2883. Walks references/claim-extraction-guide.md
# section by section against this scaffold's SCAFFOLD.yaml (SS1.1-1.7) and emits
# one instance per applicable row. `section:` values are the guide's nine
# sections; `claim_type:` values are the per-section table rows.
#
# Conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   opaque-role actor ids  : dir-1 (AcademyDirector), tc-1 / tc-2
#                            (TrainingCoordinator), bi-1 / bi-2
#                            (BackgroundInvestigator), me-1 / me-2
#                            (MedicalExaminer), rc-1 (RecordsCustodian)
#   entity-backed roles    : AcademyInstructor / FieldTrainingOfficer carry
#                            as_user_id ${instr_id}; Recruit carries ${rec_id}
#   non-existent id literal: 00000000-0000-4000-8000-000000000000
#   logical clock          : starts at 2026-08-01T00:00:00Z; every chain that
#                            needs a later instant walks it forward monotonically
#
# Coverage contract: every one of the 54 error codes in SS1.6 is triggered by at
# least one instance in this file or in SCAFFOLD_DIFFICULTY_DESIGN.yaml; the
# 15 codes asserted by SS1.8 appear here as `excluded_because:` stubs in the
# `errors` section so the mapping stays auditable.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: creation_certification_standard_returns_201_with_declared_curriculum_map
        claim_type: creation
        grounds:
          - entities.CertificationStandard
          - endpoints[POST /certification-standards]
        distinguishing_aspect: "Every declared input field of CertificationStandard round-trips on the 201 response, including the two-entry topic_requirements array and both optional fitness thresholds when explicitly supplied."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
          trigger:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-BASIC", state_code: "TX", min_total_hours: 40.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 24.00, exam_required: true }, { topic_code: "ETHICS", required_hours: 16.00, exam_required: false }], fitness_event_floor_points: 12, fitness_pass_score: 65 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
          assert:
            - "HTTP 201"
            - "data.code == 'TCOLE-BASIC' and data.state_code == 'TX'"
            - "data.min_total_hours == 40.00 and data.min_passing_score == 70.00"
            - "data.max_remediation_attempts == 1 and data.max_absence_hours == 4.00"
            - "data.topic_requirements has 2 entries; entry 0 == { topic_code: 'PATROL', required_hours: 24.00, exam_required: true }"
            - "data.fitness_event_floor_points == 12 and data.fitness_pass_score == 65"
            - "data.version == 1 and data.id is a UUID with no type prefix"
            - "data.created_at and data.updated_at are ISO 8601 UTC instants with three fractional digits"

      - name: creation_academy_class_starts_forming_with_full_topic_keyed_derived_maps
        claim_type: creation
        grounds:
          - entities.AcademyClass
          - endpoints[POST /academy-classes]
          - state_machines.AcademyClass.initial_state
        distinguishing_aspect: "A brand-new cohort is FORMING with a zeroed ledger, and both derived maps already carry one entry per topic_requirements entry - unmet reads the full requirement while projected reads 0.00."
        test_recipe:
          setup:
            - "A two-topic CertificationStandard exists (PATROL 4.00 exam-required, ETHICS 2.00 not)."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-TWO", state_code: "TX", min_total_hours: 6.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 4.00, exam_required: true }, { topic_code: "ETHICS", required_hours: 2.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
          trigger:
            - call: "POST /academy-classes"
              payload: { certification_standard_id: "${std_id}", class_code: "CLS-A", start_date: "2026-08-03", planned_seats: 30 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
          assert:
            - "HTTP 201"
            - "data.status == 'FORMING'"
            - "data.credited_topic_hours_total == 0.00"
            - "data.unmet_topic_hours == { PATROL: 4.00, ETHICS: 2.00 }"
            - "data.projected_topic_hours == { PATROL: 0.00, ETHICS: 0.00 }"
            - "data.graduated_count == 0"
            - "data.planned_seats == 30 and data.version == 1"

      - name: creation_recruit_initialises_all_four_state_dimensions
        claim_type: creation
        grounds:
          - entities.Recruit
          - endpoints[POST /recruits]
          - state_machines.Recruit.pipeline_stage.initial_state
          - state_machines.Recruit.clearance_status.initial_state
          - state_machines.Recruit.academy_status.initial_state
          - state_machines.Recruit.probation_status.initial_state
        distinguishing_aspect: "One create call must seat FOUR independent state dimensions at their own initial values plus every zeroed hour aggregate; a single `status` field would fail this."
        test_recipe:
          setup:
            - "A CertificationStandard and a FORMING AcademyClass exist."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-TWO", state_code: "TX", min_total_hours: 6.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 4.00, exam_required: true }, { topic_code: "ETHICS", required_hours: 2.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
            - call: "POST /academy-classes"
              payload: { certification_standard_id: "${std_id}", class_code: "CLS-A", start_date: "2026-08-03", planned_seats: 30 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
          trigger:
            - call: "POST /recruits"
              payload: { academy_class_id: "${class_id}", applicant_number: "A-001", full_name: "Rae Ortiz", date_of_birth: "1999-04-12", age_bracket: "AGE_20_29" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { rec_id: $.data.id }
          assert:
            - "HTTP 201"
            - "data.pipeline_stage == 'APPLICANT'"
            - "data.clearance_status == 'PENDING'"
            - "data.academy_status == 'NOT_STARTED'"
            - "data.probation_status == 'NOT_APPLICABLE'"
            - "data.credited_hours_total == 0.00 and data.scheduled_basis_hours_total == 0.00"
            - "data.per_topic_credited_hours == { PATROL: 0.00, ETHICS: 0.00 }"
            - "data.unexcused_absence_hours == 0.00 and data.make_up_hours_owed == 0.00"
            - "data.remediation_attempts_used == 0"
            - "data.probation_start is null and data.probation_base_days == 365 and data.probation_extension_days == 0"
            - "data.probation_milestone_due_date is null and data.probation_milestone_score is null and data.probation_scheduled_end is null"
            - "data.dismissal_reason_code is null and data.version == 1"

      - name: retrieval_instructor_get_returns_the_stored_certification_payload
        claim_type: retrieval
        grounds:
          - entities.Instructor
          - endpoints[GET /instructors/{instructorId}]
          - state_machines.Instructor.UNCERTIFIED_to_CERTIFIED
        distinguishing_aspect: "A GET after certify must echo the wholesale-replaced authorization set and the version bumped by the certify write - not the UNCERTIFIED create-time snapshot."
        test_recipe:
          setup:
            - "Instructor B-100 created (UNCERTIFIED, version 1) then certified for PATROL and ETHICS with fto_certified true (version 2)."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { badge_number: "B-100", full_name: "Ivy Nash" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { instr_id: $.data.id }
            - call: "POST /instructors/${instr_id}/certify"
              payload: { certification_expires_at: "2028-08-01T00:00:00Z", authorized_topic_codes: ["PATROL", "ETHICS"], fto_certified: true }
              as: AcademyDirector
              as_user_id: "dir-1"
          trigger:
            - call: "GET /instructors/${instr_id}"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
          assert:
            - "HTTP 200"
            - "data.badge_number == 'B-100' and data.full_name == 'Ivy Nash'"
            - "data.certification_status == 'CERTIFIED'"
            - "data.certification_expires_at == '2028-08-01T00:00:00Z'"
            - "data.authorized_topic_codes == ['PATROL', 'ETHICS']"
            - "data.fto_certified == true"
            - "data.active_trainee_count == 0 and data.revocation_reason is null"
            - "data.version == 2  # create 1 + certify 1"

      - name: listing_recruits_reports_total_count_and_has_more_across_offset_pages
        claim_type: listing
        grounds:
          - entities.Recruit
          - endpoints[GET /recruits]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "total_count is the unpaginated cohort size (3) on BOTH pages while has_more flips false only on the page that exhausts the set; the default limit of 10 returns all three."
        test_recipe:
          setup:
            - "Three recruits A-001..A-003 enrolled in the same FORMING cohort."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-TWO", state_code: "TX", min_total_hours: 6.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 4.00, exam_required: true }, { topic_code: "ETHICS", required_hours: 2.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
            - call: "POST /academy-classes"
              payload: { certification_standard_id: "${std_id}", class_code: "CLS-A", start_date: "2026-08-03", planned_seats: 30 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
            - call: "POST /recruits"
              payload: { academy_class_id: "${class_id}", applicant_number: "A-001", full_name: "Rae Ortiz", date_of_birth: "1999-04-12", age_bracket: "AGE_20_29" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { rec1_id: $.data.id }
            - call: "POST /recruits"
              payload: { academy_class_id: "${class_id}", applicant_number: "A-002", full_name: "Sam Vega", date_of_birth: "1999-04-12", age_bracket: "AGE_20_29" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { rec2_id: $.data.id }
            - call: "POST /recruits"
              payload: { academy_class_id: "${class_id}", applicant_number: "A-003", full_name: "Tao Li", date_of_birth: "1999-04-12", age_bracket: "AGE_20_29" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { rec3_id: $.data.id }
          trigger:
            - call: "GET /recruits"
              payload: { academy_class_id: "${class_id}", limit: 2, offset: 0 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "GET /recruits"
              payload: { academy_class_id: "${class_id}", limit: 2, offset: 2 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "GET /recruits"
              payload: { academy_class_id: "${class_id}" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
          assert:
            - "first call: HTTP 200, response_type == 'array', data has 2 entries, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second call: data has 1 entry, total_count == 3, has_more == false, offset == 2"
            - "third call: limit defaults to 10, data has 3 entries, has_more == false"
            - "no recruit id appears on both pages"

      - name: listing_course_sessions_filters_by_status_and_topic_code_together
        claim_type: listing
        grounds:
          - entities.CourseSession
          - endpoints[GET /course-sessions]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Two sessions of different topics, one DELIVERED and one SCHEDULED: each filter must select exactly one row, and the topic filter reads the COMPUTED topic_code copied from the lesson plan, not a request field."
        test_recipe:
          setup:
            - "Instructor certified for PATROL and ETHICS with one APPROVED plan per topic."
            - "PATROL session on 2026-08-10 delivered (recruit rostered PRESENT); ETHICS session on 2026-08-12 still SCHEDULED."
            - "Logical clock at 2026-08-10T12:00:00Z."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-TWO", state_code: "TX", min_total_hours: 6.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 4.00, exam_required: true }, { topic_code: "ETHICS", required_hours: 2.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
            - call: "POST /academy-classes"
              payload: { certification_standard_id: "${std_id}", class_code: "CLS-FT", start_date: "2026-08-03", planned_seats: 30 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
            - call: "POST /instructors"
              payload: { badge_number: "B-100", full_name: "Ivy Nash" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { instr_id: $.data.id }
            - call: "POST /instructors/${instr_id}/certify"
              payload: { certification_expires_at: "2028-08-01T00:00:00Z", authorized_topic_codes: ["PATROL", "ETHICS"], fto_certified: true }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans"
              payload: { instructor_id: "${instr_id}", topic_code: "PATROL", title: "Patrol Operations", contact_hours: 2.00 }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { lp_id: $.data.id }
            - call: "POST /lesson-plans/${lp_id}/approve"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans"
              payload: { instructor_id: "${instr_id}", topic_code: "ETHICS", title: "Ethics and Integrity", contact_hours: 2.00 }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { lp2_id: $.data.id }
            - call: "POST /lesson-plans/${lp2_id}/approve"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /recruits"
              payload: { academy_class_id: "${class_id}", applicant_number: "A-001", full_name: "Rae Ortiz", date_of_birth: "1999-04-12", age_bracket: "AGE_20_29" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { rec_id: $.data.id }
            - call: "POST /recruits/${rec_id}/screenings"
              payload: { screening_type: "BACKGROUND" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { scr_bg_id: $.data.id }
            - call: "POST /screening-records/${scr_bg_id}/findings"
              payload: { raw_metrics: { summary: "no adverse history" }, disqualifier_codes: [] }
              as: BackgroundInvestigator
              as_user_id: "bi-1"
            - call: "POST /screening-records/${scr_bg_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: BackgroundInvestigator
              as_user_id: "bi-2"
            - call: "POST /recruits/${rec_id}/screenings"
              payload: { screening_type: "MEDICAL" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { scr_med_id: $.data.id }
            - call: "POST /screening-records/${scr_med_id}/findings"
              payload: { raw_metrics: { summary: "fit for duty" }, disqualifier_codes: [] }
              as: MedicalExaminer
              as_user_id: "me-1"
            - call: "POST /screening-records/${scr_med_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: MedicalExaminer
              as_user_id: "me-2"
            - call: "POST /recruits/${rec_id}/screenings"
              payload: { screening_type: "PSYCHOLOGICAL" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { scr_psy_id: $.data.id }
            - call: "POST /screening-records/${scr_psy_id}/findings"
              payload: { raw_metrics: { summary: "no contraindication" }, disqualifier_codes: [] }
              as: MedicalExaminer
              as_user_id: "me-1"
            - call: "POST /screening-records/${scr_psy_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: MedicalExaminer
              as_user_id: "me-2"
            - call: "POST /recruits/${rec_id}/screenings"
              payload: { screening_type: "PHYSICAL_FITNESS" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { scr_pf_id: $.data.id }
            - call: "POST /screening-records/${scr_pf_id}/findings"
              payload: { raw_metrics: { push_ups: 36, sit_ups: 38, run_1_5_mile_seconds: 700, vertical_jump_inches: 16 }, disqualifier_codes: [] }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /screening-records/${scr_pf_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: TrainingCoordinator
              as_user_id: "tc-2"
            - call: "POST /recruits/${rec_id}/advance-stage"
              payload: { to_stage: "ACADEMY" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /course-sessions"
              payload: { academy_class_id: "${class_id}", lesson_plan_id: "${lp_id}", instructor_id: "${instr_id}", room_code: "R1", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T11:00:00Z", min_enrollment: 1 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { cs1_id: $.data.id }
            - call: "POST /course-sessions/${cs1_id}/attendance"
              payload: { recruit_id: "${rec_id}", status: "PRESENT", present_hours: 2.00 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /course-sessions/${cs1_id}/deliver"
              payload: {}
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /course-sessions"
              payload: { academy_class_id: "${class_id}", lesson_plan_id: "${lp2_id}", instructor_id: "${instr_id}", room_code: "R1", starts_at: "2026-08-12T09:00:00Z", ends_at: "2026-08-12T11:00:00Z", min_enrollment: 1 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { cs2_id: $.data.id }
          trigger:
            - call: "GET /course-sessions"
              payload: { academy_class_id: "${class_id}", status: "DELIVERED" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "GET /course-sessions"
              payload: { academy_class_id: "${class_id}", topic_code: "ETHICS" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
          assert:
            - "first call: HTTP 200, data has 1 entry, that entry's id == ${cs1_id}, topic_code == 'PATROL', status == 'DELIVERED', total_count == 1"
            - "second call: data has 1 entry, that entry's id == ${cs2_id}, topic_code == 'ETHICS', status == 'SCHEDULED', total_count == 1"
            - "neither filtered response includes the other session"

      - name: entity_not_found_curriculum_ids_return_scoped_404_codes
        claim_type: not_found
        grounds:
          - errors[ERR_CERTIFICATION_STANDARD_NOT_FOUND]
          - errors[ERR_ACADEMY_CLASS_NOT_FOUND]
          - errors[ERR_LESSON_PLAN_NOT_FOUND]
          - validations[priority 10]
          - endpoints[GET /certification-standards/{standardId}]
          - endpoints[GET /academy-classes/{classId}]
          - endpoints[GET /lesson-plans/{lessonPlanId}]
        distinguishing_aspect: "Three curriculum-side reads of the same syntactically valid but unknown UUID must each return the error code SCOPED TO THE ADDRESSED ENTITY, not one generic ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
          trigger:
            - call: "GET /certification-standards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
              captures: { e1: $.data.error_id }
            - call: "GET /academy-classes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
              captures: { e2: $.data.error_id }
            - call: "GET /lesson-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
              captures: { e3: $.data.error_id }
          assert:
            - "all three calls: HTTP 404 with response_type == 'error'"
            - "first call: data.error_id == 'ERR_CERTIFICATION_STANDARD_NOT_FOUND'"
            - "second call: data.error_id == 'ERR_ACADEMY_CLASS_NOT_FOUND'"
            - "third call: data.error_id == 'ERR_LESSON_PLAN_NOT_FOUND'"
            - "each error body carries a non-empty data.message"

      - name: entity_not_found_people_ids_return_scoped_404_codes
        claim_type: not_found
        grounds:
          - errors[ERR_RECRUIT_NOT_FOUND]
          - errors[ERR_INSTRUCTOR_NOT_FOUND]
          - errors[ERR_SCREENING_RECORD_NOT_FOUND]
          - validations[priority 10]
          - endpoints[GET /recruits/{recruitId}]
          - endpoints[GET /instructors/{instructorId}]
          - endpoints[GET /screening-records/{screeningRecordId}]
        distinguishing_aspect: "The people-side reads must discriminate recruit from instructor from screening record even though all three ids are drawn from the same UUID space."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
          trigger:
            - call: "GET /recruits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
              captures: { e1: $.data.error_id }
            - call: "GET /instructors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RecordsCustodian
