                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404; data.error_id == \"ERR_BUYER_NOT_FOUND\""

      - name: corner_open_order_count_falls_back_when_order_cancelled
        claim_type: computed_fields
        grounds:
          - entities.ForeignBuyer.fields.open_order_count
          - state_machines.ExportOrder.fulfillment_status.transitions.DRAFT_to_CANCELLED
          - endpoints.POST /export-orders/{export_order_id}/cancel
        distinguishing_aspect: "open_order_count counts orders whose fulfillment_status is NOT IN {CLOSED, CANCELLED}: it reads 1 while the order is DRAFT and returns to 0 the moment the order is cancelled, proving the field is derived from the enum set and not a monotonic create counter."
        test_recipe:
          setup:
            - "One buyer with exactly one DRAFT order and no ISSUED trade document."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "GET /foreign-buyers/${buyer_id}"
