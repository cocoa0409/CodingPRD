  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: class_session_overlap_half_open_on_instructor
        grounds:
          - validations[priority=15]
          - entities.ClassSession.fields.starts_at
          - entities.ClassSession.fields.ends_at
          - errors[ERR_INSTRUCTOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          ClassSession overlap on an instructor uses half-open [starts_at, ends_at): a second class
          starting exactly at the first's ends_at (10:00-11:00 then 11:00-12:00) is ALLOWED (adjacency),
          but 10:30-11:30 is rejected. Interval semantics: adjacency permitted.
        test_recipe:
          setup:
            - "Instructor with one SCHEDULED class 10:00-11:00."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "TO Prog", discipline: "BJJ", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/instructors"
              payload: { full_name: "TO I", email: "toi@x.com" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/class-sessions"
              payload: { program_id: "${prog_id}", instructor_id: "${ins_id}", starts_at: "2026-01-05T10:00:00Z", ends_at: "2026-01-05T11:00:00Z", capacity: 5 }
              as: FrontDesk
              captures: { c1_id: $.data.id }
            - call: "POST /dojo/class-sessions"
              payload: { program_id: "${prog_id}", instructor_id: "${ins_id}", starts_at: "2026-01-05T11:00:00Z", ends_at: "2026-01-05T12:00:00Z", capacity: 5 }
              as: FrontDesk
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /dojo/class-sessions"
              payload: { program_id: "${prog_id}", instructor_id: "${ins_id}", starts_at: "2026-01-05T10:30:00Z", ends_at: "2026-01-05T11:30:00Z", capacity: 5 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "The adjacent 11:00-12:00 class created successfully (half-open adjacency allowed)"
            - "The overlapping 10:30-11:30 class returns ERR_INSTRUCTOR_DOUBLE_BOOKED"

      - name: private_lesson_overlap_vs_class_cross_resource
        grounds:
          - validations[priority=15]
          - state_machines.PrivateLesson.REQUESTED_to_CONFIRMED
          - entities.PrivateLesson.fields.starts_at
          - errors[ERR_INSTRUCTOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          PrivateLesson confirmation checks overlap against the SAME instructor's SCHEDULED ClassSessions
          (cross-resource-type interval check), not just other lessons — a private lesson 10:30-11:30
          colliding with a class 10:00-11:00 is rejected at confirm time. Distinct interval semantics
          (cross-entity occupancy) on a different resource entity (PrivateLesson).
        test_recipe:
          setup:
            - "Instructor with a SCHEDULED class 10:00-11:00; a member requests a private lesson 10:30-11:30 with the same instructor."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "PL Prog", discipline: "JUDO", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/instructors"
              payload: { full_name: "PL I", email: "pli@x.com" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "PL M", email: "plm@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /dojo/class-sessions"
              payload: { program_id: "${prog_id}", instructor_id: "${ins_id}", starts_at: "2026-01-06T10:00:00Z", ends_at: "2026-01-06T11:00:00Z", capacity: 5 }
              as: FrontDesk
            - call: "POST /dojo/private-lessons"
              payload: { member_id: "${m_id}", instructor_id: "${ins_id}", starts_at: "2026-01-06T10:30:00Z", ends_at: "2026-01-06T11:30:00Z", hourly_rate_cents: 6000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /dojo/private-lessons/${pl_id}/confirm"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Confirming the private lesson overlapping the instructor's class returns ERR_INSTRUCTOR_DOUBLE_BOOKED"
            - "PrivateLesson.${pl_id}.status remains REQUESTED"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: class_cancel_restores_rank_attendance_pool
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
          - state_machines.Attendance.CONFIRMED_to_CANCELLED
          - entities.Enrollment.fields.rank_attendance_count
        distinguishing_aspect: |
          Conserved quantity = Enrollment.rank_attendance_count. Forward check-in increments it by 1;
          cancelling the class compensates by decrementing each counted attendance, leaving
          rank_attendance_count at its pre-check-in value (0). The named pool is unchanged end to end.
        test_recipe:
          setup:
            - "Member enrolled, fresh rank (rank_attendance_count==0), checks into a scheduled class (count->1), then the class is cancelled."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "CI Prog", discipline: "KARATE", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/instructors"
              payload: { full_name: "CI I", email: "cii@x.com" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "CI M", email: "cim@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { enr_id: $.data.id }
            - call: "POST /dojo/class-sessions"
              payload: { program_id: "${prog_id}", instructor_id: "${ins_id}", starts_at: "2026-01-05T10:00:00Z", ends_at: "2026-01-05T11:00:00Z", capacity: 5 }
              as: FrontDesk
              captures: { cls_id: $.data.id, cls_v: $.data.version }
            - call: "POST /dojo/attendances"
              payload: { enrollment_id: "${enr_id}", class_session_id: "${cls_id}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /dojo/enrollments/${enr_id}"
              payload: {}
              as: FrontDesk
              captures: { before: $.data }
            - call: "POST /dojo/class-sessions/${cls_id}/cancel"
              payload: { expected_class_session_version: "${cls_v}" }
              as: FrontDesk
            - call: "GET /dojo/enrollments/${enr_id}"
              payload: {}
              as: FrontDesk
              captures: { after: $.data }
          assert:
            - "Before cancel Enrollment.${enr_id}.rank_attendance_count == 1"
            - "After cancel Enrollment.${enr_id}.rank_attendance_count == 0 (compensation restores the pool)"
            - "ClassSession.${cls_id}.confirmed_count == 0 after cancel"

      - name: test_cancel_restores_invoice_ledger
        grounds:
          - state_machines.PromotionTest.SCHEDULED_to_CANCELLED
          - entities.Invoice.fields.status
          - entities.Member.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Member.outstanding_balance_cents (the unpaid-invoice ledger). Scheduling a
          test debits a TEST_FEE invoice; cancelling the test VOIDs that invoice and recomputes the
          balance back to its pre-schedule total — a different conserved quantity than the attendance pool.
        test_recipe:
          setup:
            - "Eligible member schedules a promotion test (TEST_FEE 4000 invoice raises balance to 4000), then cancels it."
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "CIv Prog", discipline: "BJJ", base_monthly_tuition_cents: 9000, test_fee_cents: 4000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "WHITE", rank_order: 0, next_rank_code: "BLUE", is_entry_rank: true }
              as: FrontDesk
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "BLUE", rank_order: 1, next_rank_code: null }
              as: FrontDesk
            - call: "POST /dojo/members"
              payload: { full_name: "CIv M", email: "civm@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { enr_id: $.data.id }
            - call: "POST /dojo/instructors"
              payload: { full_name: "CIv I", email: "civi@x.com" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/promotion-tests"
              payload: { enrollment_id: "${enr_id}", examiner_instructor_id: "${ins_id}", scheduled_for: "2026-01-10T00:00:00Z" }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /dojo/members/${m_id}"
              payload: {}
              as: FrontDesk
              captures: { before: $.data }
            - call: "POST /dojo/promotion-tests/${t_id}/cancel"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "GET /dojo/members/${m_id}"
              payload: {}
              as: FrontDesk
              captures: { after: $.data }
          assert:
            - "Before cancel Member.${m_id}.outstanding_balance_cents == 4000 (TEST_FEE charged)"
            - "After cancel the TEST_FEE Invoice.status == VOID and Member.${m_id}.outstanding_balance_cents == 0 (ledger restored)"
