            - "the international request has deadline_at \"2026-08-08T00:00:00Z\" (120 + INTERNATIONAL_GRACE_HOURS 48 = 168 h): the grace is added to the partner's own contractual hours, not to a fixed 168"
            - "all three rows carry attempt_number 1, status \"REQUESTED\", responded_at null, expired_by_sweep_at null; the three candidates now report ct_attempt_count 1"
            - "SearchRequest.${sr_id}.status == \"PRIMARY_ENGAGED\" - only the request on the PRIMARY candidate moved the search; the two BACKUP requests are legal but do not re-drive it"

      - name: scores_are_rounded_half_up_exactly_once_at_the_end
        claim_type: Precision
        grounds:
          - calculations.match_probability_score.precision
          - calculations.candidate_rank_score.precision
          - entities.MatchCandidate.fields.rank_score
        distinguishing_aspect: |
          Two non-terminating intermediates are pinned to the declared precision: D3's raw preliminary
          score 66.6666... + 2.5 = 69.16666... must land on 69.17 (2 dp, half-up, applied once - a
          pre-rounded base of 66.67 would give 69.17 too, so the discriminator is D1's rank score),
          and D1's rank sum 97.1125 must land on 97.113 rather than the banker's-rounding answer 97.112.
        test_recipe:
          setup:
            - "domestic registry, donors D1 and D3, the canonical patient, DOMESTIC_ONLY search"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0003", age_years: 55, sex: "M", weight_kg: 91.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "02:01"] }, consented_methods: ["PBSC"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { c_d1_score: "$.data[0].preliminary_score", c_d1_rank: "$.data[0].rank_score", c_d3_score: "$.data[1].preliminary_score", c_d3_rank: "$.data[1].rank_score" }
          assert:
            - "D1's preliminary_score == 94.75 and its rank_score == 97.113 - the exact half-way sum 0.55*94.75 + 25 + 20 = 97.1125 rounds UP at the third decimal (97.112 would prove round-half-even)"
            - "D3's preliminary_score == 69.17: the raw value 100*6.4/9.6 + 2.5 = 69.16666... is rounded ONCE at the end to 2 places"
            - "D3's rank_score == 65.544 (0.55*69.17 + 0.25*30.0 + 0.20*100 = 65.5435, rounded half-up to 3 places), which uses the ALREADY rounded preliminary_score 69.17 as its input"
            - "both scores are reported with their declared precision - 2 decimal places for preliminary_score, 3 for rank_score - and neither is re-rounded when the list is ordered"
            - "no score is clamped here: both are strictly inside 0.00..100.00"

      - name: a_sweep_touches_only_requested_rows_and_always_stamps_last_sweep_at
        claim_type: chronological
        grounds:
          - calculations.ct_deadline_and_expiry_sweep.formula
          - endpoints.POST_registry_search_requests_id_deadline_sweep
          - entities.SearchRequest.fields.last_sweep_at
          - entities.ConfirmatoryTypingRequest.fields.expired_by_sweep_at
        distinguishing_aspect: |
          The sweep is replayed over a search whose typing-request history is deliberately mixed: it
          expires the one REQUESTED row that is past its deadline, and - run again while the only open row
          is a later request that is not yet due - it changes nothing except last_sweep_at, never
          re-stamping the already EXPIRED row's expired_by_sweep_at. Terminal rows are outside the input
          set, which is what makes the sweep safely repeatable. The first expiry is also deliberately the
          primary's FIRST attempt, so the promotion cascade must NOT run: the cascade is reserved for
          ct_attempt_count == MAX_CT_ATTEMPTS.
