            - "response_type == error"
            - "data.error_id == ERR_COURTROOM_DOUBLE_BOOKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ----- Instance 1: parenting-time overnights conserved at 365 -----
      - name: overnights_conserved_at_365_through_revision
        grounds:
          - state_machines.ParentingPlan.DISPUTED_to_REVISED
          - entities.ParentingPlan.fields.petitioner_overnights
          - entities.ParentingPlan.fields.respondent_overnights
          - validations[priority=10]
        distinguishing_aspect: |
          Conserved quantity #1: petitioner_overnights + respondent_overnights == 365 is
          invariant. A revision that reallocates overnights (110/255 -> 200/165) leaves the
          sum at 365; a revision whose body does NOT sum to 365 is rejected (ERR_OVERNIGHTS_NOT_365)
          and the prior 365-sum allocation is preserved.
        test_recipe:
          setup:
            - "Case(CA) DISCOVERY; ParentingPlan PROPOSED by petitioner 110/255 (sum 365), then DISPUTED by respondent."
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ], spousal_payor_pct: 0.40, spousal_payee_offset_pct: 0.50, shared_custody_threshold_pct: 0.40, long_marriage_months: 120 }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of Q", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "RESPONDENT", user_id: "u-res", full_name: "Robin", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { res_id: $.data.id }
            - call: "POST /api/parenting-plans"
              payload: { case_id: "${case_id}", proposed_by_party_id: "${pet_id}", petitioner_overnights: 110, respondent_overnights: 255 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { plan_id: $.data.id }
            - call: "POST /api/parenting-plans/${plan_id}/dispute"
              payload: {}
              as: Respondent
              as_user_id: "u-res"
          trigger:
            - call: "POST /api/parenting-plans/${plan_id}/revise"
              payload: { petitioner_overnights: 200, respondent_overnights: 165 }
              as: Respondent
              as_user_id: "u-res"
              captures: { pn: $.data.petitioner_overnights, rn: $.data.respondent_overnights }
          assert:
            - "ParentingPlan.${plan_id}.petitioner_overnights == 200"
            - "ParentingPlan.${plan_id}.respondent_overnights == 165"
            - "ParentingPlan.${plan_id}.petitioner_overnights + ParentingPlan.${plan_id}.respondent_overnights == 365"

      # ----- Instance 2: support ledger conserved across supersede/vacate -----
      - name: active_support_total_conserved_across_supersede
        grounds:
          - state_machines.CourtOrder.ENTERED_to_SUPERSEDED
          - entities.Case.fields.active_support_total_cents
          - entities.SupportOrder.fields.monthly_amount_cents
          - state_machines.CourtOrder.DRAFT_to_ENTERED
        distinguishing_aspect: |
          Conserved quantity #2 (DIFFERENT from overnights): Case.active_support_total_cents
          == SUM(monthly_amount_cents of ACTIVE SupportOrder). After the TEMPORARY order
          (150000 active) is superseded by the FINAL order (100000), the ledger nets to
          exactly 100000 — the vacated temporary amount is removed, leaving no drift.
        test_recipe:
          setup:
            - "Canonical CA default case in AWAITING_JUDGMENT with BOTH disclosures VERIFIED (petitioner net 600000, respondent net 300000); TEMPORARY CourtOrder ENTERED activating a CHILD order at 150000 (active_support_total_cents == 150000); a DRAFT FINAL_JUDGMENT referencing a CALCULATED FINAL CHILD order (100000) and superseding the TEMPORARY order."
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 }, { min_combined_monthly_cents: 1000000, max_combined_monthly_cents: 1999999, base_cents_one_child: 150000, marginal_pct_per_extra_child: 0.50 } ], spousal_payor_pct: 0.40, spousal_payee_offset_pct: 0.50, shared_custody_threshold_pct: 0.40, long_marriage_months: 120 }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of R", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "RESPONDENT", user_id: "u-res", full_name: "Robin", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { res_id: $.data.id }
            - call: "POST /api/children"
              payload: { case_id: "${case_id}", full_name: "Child One", birth_year: 2016 }
              as: Clerk
            - call: "POST /api/children"
              payload: { case_id: "${case_id}", full_name: "Child Two", birth_year: 2018 }
              as: Clerk
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "PETITION", filed_by_party_id: "${pet_id}" }
              as: Clerk
              captures: { pet_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${pet_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/cases/${case_id}/default"
              payload: {}
              as: Clerk
            - call: "POST /api/parenting-plans"
              payload: { case_id: "${case_id}", proposed_by_party_id: "${pet_id}", petitioner_overnights: 110, respondent_overnights: 255 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { plan_id: $.data.id }
            - call: "POST /api/support-orders"
              payload: { case_id: "${case_id}", support_type: "CHILD", payor_party_id: "${pet_id}", payee_party_id: "${res_id}", variant: "TEMPORARY" }
              as: Clerk
              captures: { temp_child_id: $.data.id }
            - call: "POST /api/court-orders"
              payload: { case_id: "${case_id}", order_kind: "TEMPORARY", support_order_ids: ["${temp_child_id}"] }
              as: Clerk
              captures: { temp_order_id: $.data.id }
            - call: "POST /api/court-orders/${temp_order_id}/enter"
              payload: {}
              as: Judge
              as_user_id: "u-judge"
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${pet_id}", case_id: "${case_id}", gross_monthly_income_cents: 720000, tax_withholding_cents: 120000, mandatory_retirement_cents: 0, health_insurance_cents: 0 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { pet_fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${pet_fd_id}/submit"
              payload: {}
              as: Petitioner
              as_user_id: "u-pet"
            - call: "POST /api/financial-disclosures/${pet_fd_id}/verify"
              payload: {}
              as: Clerk
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${res_id}", case_id: "${case_id}", gross_monthly_income_cents: 360000, tax_withholding_cents: 60000, mandatory_retirement_cents: 0, health_insurance_cents: 0 }
              as: Respondent
              as_user_id: "u-res"
              captures: { res_fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${res_fd_id}/submit"
              payload: {}
              as: Respondent
              as_user_id: "u-res"
            - call: "POST /api/financial-disclosures/${res_fd_id}/verify"
              payload: {}
              as: Clerk
            - call: "POST /api/cases/${case_id}/advance"
              payload: { to_status: "AWAITING_JUDGMENT" }
              as: Clerk
            - call: "POST /api/support-orders"
              payload: { case_id: "${case_id}", support_type: "CHILD", payor_party_id: "${pet_id}", payee_party_id: "${res_id}", variant: "FINAL" }
              as: Clerk
              captures: { final_child_id: $.data.id }
            - call: "POST /api/court-orders"
              payload: { case_id: "${case_id}", order_kind: "FINAL_JUDGMENT", support_order_ids: ["${final_child_id}"], parenting_plan_id: "${plan_id}", supersedes_order_id: "${temp_order_id}" }
              as: Judge
              as_user_id: "u-judge"
              captures: { final_order_id: $.data.id }
            - call: "GET /api/cases/${case_id}"
              payload: {}
              as: Clerk
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /api/court-orders/${final_order_id}/enter"
              payload: { expected_case_version: "${case_v}" }
              as: Judge
              as_user_id: "u-judge"
          assert:
            - "Case.${case_id}.active_support_total_cents == 100000"
            - "SupportOrder.${temp_child_id}.status == VACATED"
            - "SupportOrder.${final_child_id}.status == ACTIVE"
