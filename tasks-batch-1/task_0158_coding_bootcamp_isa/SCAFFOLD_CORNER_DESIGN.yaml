# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Coding Bootcamp & ISA — breadth probe over claim-extraction-guide's 9 sections.
# Every setup_api_calls chain is reachable from empty-DB via §1.5 endpoints.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_cohort_returns_201_with_computed_seat_fields
        claim_type: Creation
        grounds:
          - entities.Cohort.fields.capacity
          - entities.Cohort.fields.seats_available
          - endpoints
        distinguishing_aspect: "POST /cohorts with all required fields -> 201; status=PLANNING, seats_committed=0, seats_available==capacity (5)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
          trigger:
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id, st: $.data.status, sc: $.data.seats_committed, sa: $.data.seats_available }
          assert:
            - "HTTP status == 201"
            - "Cohort.${coh}.status == PLANNING"
            - "Cohort.${coh}.seats_committed == 0"
            - "Cohort.${coh}.seats_available == 5"
            - "Cohort.${coh}.version == 1"

      - name: create_cohort_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Cohort.fields.capacity
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /cohorts omitting required capacity -> 400 ERR_INVALID_REQUEST; no cohort created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
          trigger:
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_cohort_invalid_enum_track_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Cohort.fields.track
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /cohorts with track='BIOLOGY' (not in FULLSTACK|DATA|CYBER) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
          trigger:
            - call: "POST /cohorts"
              payload: { name: "C1", track: "BIOLOGY", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_cohort_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - entities.Cohort.fields.name
        distinguishing_aspect: "GET /cohorts/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /cohorts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: attendance_record_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.AttendanceRecord.fields.present
          - entities.AttendanceRecord.fields.cumulative_progress_pct
        distinguishing_aspect: "AttendanceRecord has common_fields:false — created with id+created_at, no version field, no update/transition endpoint exists."
        test_recipe:
          setup: ["ACTIVE enrollment in a RUNNING cohort."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Att", email: "att@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${app}", financing_choice: "UPFRONT", deposit_amount_cents: 200000 }
              as: AdmissionsOfficer
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
          trigger:
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 50 }
              as: AdmissionsOfficer
              captures: { ar: $.data.id, created: $.data.created_at }
          assert:
            - "HTTP status == 201"
            - "AttendanceRecord.${ar}.id present and AttendanceRecord.${ar}.created_at present"

      - name: enrollment_attendance_progress_computed_from_records
        claim_type: Computed Fields
        grounds:
          - entities.Enrollment.fields.attendance_pct
          - entities.Enrollment.fields.progress_pct
        distinguishing_aspect: "After 2 present + 2 absent records (latest progress 75), Enrollment.attendance_pct==50 and progress_pct==75."
        test_recipe:
          setup: ["ACTIVE enrollment in a RUNNING cohort."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Cmp", email: "cmp@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${app}", financing_choice: "UPFRONT", deposit_amount_cents: 200000 }
              as: AdmissionsOfficer
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 25 }
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-03T00:00:00Z", present: false, cumulative_progress_pct: 50 }
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-04T00:00:00Z", present: true, cumulative_progress_pct: 60 }
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-05T00:00:00Z", present: false, cumulative_progress_pct: 75 }
              as: AdmissionsOfficer
          trigger:
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: AdmissionsOfficer
              captures: { att: $.data.attendance_pct, prog: $.data.progress_pct }
          assert:
            - "Enrollment.${enr}.attendance_pct == 50"
            - "Enrollment.${enr}.progress_pct == 75"

      - name: applicant_status_system_field_ignores_client_input
        claim_type: System Fields
        grounds:
          - entities.Applicant.fields.status
        distinguishing_aspect: "Applicant.status is source:system; created applicant is APPLIED regardless of body — client cannot set status at creation (status not in §1.5 input)."
        test_recipe:
          setup: ["OPEN cohort."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
          trigger:
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Sys", email: "sys@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "Applicant.${app}.status == APPLIED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: admit_applicant_from_rejected_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Applicant.APPLIED_to_REJECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A REJECTED applicant cannot be admitted; POST /applicants/{id}/admit -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A REJECTED applicant in an OPEN cohort."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Rej", email: "rej@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/reject"
              payload: {}
              as: AdmissionsOfficer
          trigger:
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: open_cohort_twice_second_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Cohort.PLANNING_to_OPEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Opening an already-OPEN cohort again -> 409 ERR_INVALID_STATE (no PLANNING source state)."
        test_recipe:
          setup: ["An OPEN cohort."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
          trigger:
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: archived_cohort_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Cohort.GRADUATED_to_ARCHIVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal ARCHIVED, POST /cohorts/{id}/graduate -> 409 ERR_INVALID_STATE; no transition leaves ARCHIVED."
        test_recipe:
          setup: ["A GRADUATED cohort (no PENDING ISA) then ARCHIVED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/archive"
              payload: {}
              as: AdmissionsOfficer
          trigger:
            - call: "POST /cohorts/${coh}/graduate"
              payload: {}
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cohort_start_before_start_date_returns_timing
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Cohort.OPEN_to_RUNNING
          - validations[priority=7]
          - errors[ERR_COHORT_TIMING]
        distinguishing_aspect: "Starting a cohort while clock < start_date -> 409 ERR_COHORT_TIMING; cohort stays OPEN."
        test_recipe:
          setup: ["An OPEN cohort with start_date in the future relative to the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
          trigger:
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_COHORT_TIMING"

      - name: payment_fail_then_retry_returns_to_pending
        claim_type: Valid Transition
        grounds:
          - state_machines.Payment.PENDING_to_FAILED
          - state_machines.Payment.FAILED_to_PENDING
        distinguishing_aspect: "A PENDING payment can fail then retry back to PENDING (cyclic collection dimension)."
        test_recipe:
          setup: ["A PENDING payment on an ACTIVE ISAContract."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Pay", email: "pay@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${app}", financing_choice: "ISA", deposit_amount_cents: 200000, isa_income_share_pct: 0.17, isa_cap_cents: 3000000, isa_term_months: 24, isa_income_threshold_cents: 400000 }
              as: AdmissionsOfficer
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 100 }
              as: AdmissionsOfficer
            - call: "POST /enrollments/${enr}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "GET /isa-contracts?enrollment_id=${enr}"
              payload: {}
              as: ServicingOfficer
              captures: { isa: "$.data[0].id" }
            - call: "POST /income-reports"
              payload: { isa_contract_id: "${isa}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", gross_income_cents: 600000, employment_status: "EMPLOYED" }
              as: ServicingOfficer
              captures: { ir: $.data.id, pay: $.data.payment_id }
            - call: "POST /payments/${pay}/fail"
              payload: {}
              as: ServicingOfficer
          trigger:
            - call: "POST /payments/${pay}/retry"
              payload: {}
              as: ServicingOfficer
              captures: { cs: $.data.collection_status }
          assert:
            - "Payment.${pay}.collection_status == PENDING (returned from FAILED)"

      - name: isa_activation_cascade_excluded
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ISAContract.PENDING_to_ACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / isa_activation_requires_enrollment_graduated
          rationale: "ISA PENDING->ACTIVE on enrollment graduation is exercised (and its negative guard) by the named §1.8 instance and the depth-4 cascade instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: monthly_payment_cap_straddle_clamps_obligation
        claim_type: Correct Result
        grounds:
          - calculations.monthly_payment_amount
          - entities.IncomeReport.fields.obligation_cents
        distinguishing_aspect: "With remaining_cap_cents=50000 and gross 600000 (raw 102000), obligation clamps to 50000; amount_paid lands exactly at cap on settle."
        test_recipe:
          setup: ["ACTIVE ISAContract pct=0.17 cap=3000000 with amount_paid_cents=2950000 (remaining 50000) from a prior settled payment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "C1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Str", email: "str@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${app}", financing_choice: "ISA", deposit_amount_cents: 200000, isa_income_share_pct: 0.17, isa_cap_cents: 3000000, isa_term_months: 24, isa_income_threshold_cents: 400000 }
              as: AdmissionsOfficer
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 100 }
              as: AdmissionsOfficer
            - call: "POST /enrollments/${enr}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "GET /isa-contracts?enrollment_id=${enr}"
              payload: {}
              as: ServicingOfficer
              captures: { isa: "$.data[0].id" }
            - call: "POST /income-reports"
              payload: { isa_contract_id: "${isa}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", gross_income_cents: 17352941, employment_status: "EMPLOYED" }
              as: ServicingOfficer
              captures: { ir1: $.data.id, pay1: $.data.payment_id }
            - call: "POST /payments/${pay1}/settle"
              payload: {}
              as: ServicingOfficer
          trigger:
            - call: "POST /income-reports"
              payload: { isa_contract_id: "${isa}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", gross_income_cents: 600000, employment_status: "EMPLOYED" }
              as: ServicingOfficer
              captures: { ir2: $.data.id, ob: $.data.obligation_cents }
          assert:
            - "IncomeReport.${ir2}.obligation_cents == 50000 (clamped to remaining cap)"

      - name: cirr_eligibility_out_of_program_not_countable
        claim_type: Constants Applied
        grounds:
          - calculations.cirr_eligibility
