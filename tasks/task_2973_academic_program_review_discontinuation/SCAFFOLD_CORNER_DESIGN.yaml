          rationale: "The named §1.8 instance asserts all four hops of the RATIFY cascade — cycle DECIDED, program TEACH_OUT_PENDING, catalog_status_pre_decision capture plus MARKETING_SUPPRESSED, the two AUTO_MINTED notices with their due_at values, and compliance_posture NOTICES_PENDING."

