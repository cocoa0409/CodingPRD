  - name: cancelling_an_already_cancelled_order_is_rejected
    claim_type: Idempotency
    grounds:
    - state_machines.PaymentOrder.transitions.PENDING_APPROVAL_to_CANCELLED
    - state_machines.Counterparty.transitions.ACTIVE_to_RESTRICTED
    distinguishing_aspect: 'Transitions are not idempotent: a second cancel of a CANCELLED order returns 409 ERR_INVALID_TRANSITION
      and does not re-fire the ACTIVE-to-RESTRICTED cascade on the counterparty, so the side effect runs exactly
      once.'
