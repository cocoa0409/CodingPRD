              payload: { narrative: "The gate swung into my mirror.", attested: true }
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /review-cases"
              payload: { crash_id: "${c_id}", committee_name: "Jackson Center Safety Review Committee" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rc_id: $.data.id, link_before: $.data.appeal_evidence_item_id }
            - call: "POST /review-cases/${rc_id}/open-deliberation"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { v1: $.data.version }
            - call: "POST /review-cases/${rc_id}/votes"
              payload: { expected_review_case_version: "${v1}", vote: "NON_PREVENTABLE", criterion_scores: { speed_and_spacing: 1, hazard_recognition: 1, vehicle_condition_precheck: 1, regulatory_compliance: 1, evasive_action: 1 } }
              as: CommitteeMember
              as_user_id: "cm-001"
              captures: { v2: $.data.version }
            - call: "POST /review-cases/${rc_id}/votes"
              payload: { expected_review_case_version: "${v2}", vote: "NON_PREVENTABLE", criterion_scores: { speed_and_spacing: 1, hazard_recognition: 1, vehicle_condition_precheck: 1, regulatory_compliance: 1, evasive_action: 1 } }
              as: CommitteeMember
              as_user_id: "cm-002"
              captures: { v3: $.data.version }
