          assert:
            - "${ti_status} == SUBMITTED  # the declared initial_state"
            - "${ti_auth} == PENDING and ${ti_appeals} == 0 and ${ti_ver} == 1"
            - "TradeIn.${ti_id}.received_at is null and TradeIn.${ti_id}.accepted_at is null and TradeIn.${ti_id}.assessed_grade is null"
            - "both listings return total_count 0 — submission alone creates no grant and no unit"
            - "${bal} == 0 and ${mass} == 0 and ${cust_ver} == 1"

      - name: trade_in_receive_applies_its_side_effects_once_and_is_not_idempotent
        claim_type: idempotency
        grounds:
          - state_machines.TradeIn.transitions[SUBMITTED -> RECEIVED]
          - errors[ERR_TRADE_IN_NOT_RECEIVABLE]
          - validations[priority=50]
        distinguishing_aspect: "The first /receive sets received_at to clock_now and bumps version to 2; the identical second call returns ERR_TRADE_IN_NOT_RECEIVABLE (409) and leaves received_at and version exactly as the first call left them."
        test_recipe:
          setup:
            - "One SUBMITTED MAIL_IN FOOTWEAR grade A trade-in; clock left at 2026-08-01T00:00:00Z, then advanced to 2026-08-05T09:00:00Z so received_at is distinguishable from created_at."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "FOOTWEAR", condition_grade: "A", base_credit_pct_bp: 3500, resale_price_pct_bp: 6500, refurb_budget_cap_pct_bp: 2500, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "FOOTWEAR", declared_grade: "A", msrp_minor: 120000, item_mass_grams: 900 }
