      - The identical payload under LeaseAdministrator returns HTTP 201 with data.status == ${ok_status}
        == "ACTIVE" and data.outstanding_balance_cents == ${ok_balance} == 0
      - 'The denied role still performs its shared read: GET /lessees/${ok_id}/outstanding-balance returns
