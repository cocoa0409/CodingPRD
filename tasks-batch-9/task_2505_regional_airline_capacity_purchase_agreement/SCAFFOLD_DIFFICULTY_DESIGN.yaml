              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-1601", seat: "CAPTAIN", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-1602", seat: "CAPTAIN", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
              captures: { p2: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p2}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p2}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N1401RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N1402RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac2: $.data.id }
            - call: "POST /cpa/aircraft/${ac2}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 10 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM5101", origin: "STL", destination: "ORD", scheduled_departure_utc: "2026-09-15T00:00:00Z", scheduled_arrival_utc: "2026-09-15T08:00:00Z", planned_block_hours: 8.000 }
              as: MainlineScheduler
              captures: { l1: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac2}", captain_pilot_id: "${p1}", flight_number: "SM5102", origin: "STL", destination: "MSP", scheduled_departure_utc: "2026-09-15T10:00:00Z", scheduled_arrival_utc: "2026-09-15T17:00:00Z", planned_block_hours: 7.000 }
              as: MainlineScheduler
              captures: { l2: $.data.id }
          trigger:
