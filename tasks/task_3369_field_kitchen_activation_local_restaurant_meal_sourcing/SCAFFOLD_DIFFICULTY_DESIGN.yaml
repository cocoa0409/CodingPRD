      - name: meal_order_quality_rework_cycle_and_rejection_branch
        grounds:
          - state_machines.MealOrder.QUALITY_HOLD_to_IN_PRODUCTION
          - state_machines.MealOrder.QUALITY_HOLD_to_REJECTED
          - state_machines.MealOrder.QUALITY_HOLD_to_READY
          - entities.MealOrder.fields.rework_count
        distinguishing_aspect: |
          QUALITY_HOLD is a fork-join point whose branch set depends on rework_count as well as the
          score: 62 with rework_count 0 loops back to IN_PRODUCTION, 70 with rework_count 1 loops again,
          and 65 with rework_count 2 is forced to REJECTED because rework_count is no longer below 2,
          so a score that would have been reworked on the first pass is a rejection on the third.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE"
            - "PartnerKitchen ${pk_id} is CONTRACTED / PRODUCING"
            - "MealOrder ${mo_id} is PLACED with ordered_meals 1000 and rework_count 0"
