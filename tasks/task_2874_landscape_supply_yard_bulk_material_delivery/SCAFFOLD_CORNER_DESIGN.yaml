scaffold_corner_design:
  - section: entities
    instances:
      - name: material_create_returns_201_with_full_envelope
        claim_type: creation
        grounds:
          - entities.Material
          - endpoints[POST /materials]
          - response_envelope
        distinguishing_aspect: "A POST /materials carrying every declared input returns 201 with the fixed envelope (success true, data object, error null) and echoes each stored field; status defaults to ACTIVE and version starts at 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /materials"
              payload: { sku: "MULCH-E1", name: "Corner Test Mulch", offered_forms: [BULK, BAGGED], seasonal_category: "MULCH", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == \"object\", a meta block carrying api_request_id / api_request_timestamp, and data.id a UUID with no type prefix"
            - "Material.${mat_id}.sku == \"MULCH-E1\", offered_forms == [BULK, BAGGED], seasonal_category == \"MULCH\", density_lb_per_cubic_yard == 1000, shrinkage_factor == 0.10"
            - "Material.${mat_id}.status == ACTIVE and version == 1"
            - "Material.${mat_id}.effective_density_lb_per_cubic_yard == 1000.00 (moisture 15.0 is the reference point)"
            - "Material.${mat_id}.available_net_cubic_yards == 0.00 because no lot exists yet"

      - name: material_get_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /materials/{materialId}]
          - entities.Material
        distinguishing_aspect: "GET /materials/{materialId} returns the same field values the create call stored, with the same version, and does not mutate updated_at."
        test_recipe:
          setup:
            - "One Material created with sku MULCH-E2 and 22.5% moisture."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "MULCH-E2", name: "Retrieval Mulch", offered_forms: [BULK], seasonal_category: "MULCH", density_lb_per_cubic_yard: 800, shrinkage_factor: 0.10, moisture_pct: 22.5, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_created: $.data.created_at }
          trigger:
            - call: "GET /materials/${mat_id}"
              payload: {}
              as: Contractor
              as_user_id: "reader-1"
          assert:
            - "HTTP 200 with data.id == ${mat_id} and data.sku == \"MULCH-E2\""
            - "Material.${mat_id}.effective_density_lb_per_cubic_yard == 860.00 (800 * 1.075)"
            - "Material.${mat_id}.version == 1 and updated_at == ${mat_created} (a read never mutates)"

      - name: material_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /materials]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The list envelope reports total_count over the whole filtered set (3) while data carries only the page; has_more is true on the first page of two and false on the last, and offset skips rather than filters."
        test_recipe:
          setup:
            - "Three Materials exist: two MULCH rows and one SALT row, all ACTIVE."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "MULCH-E3A", name: "Page Mulch A", offered_forms: [BULK], seasonal_category: "MULCH", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
            - call: "POST /materials"
              payload: { sku: "MULCH-E3B", name: "Page Mulch B", offered_forms: [BULK], seasonal_category: "MULCH", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
            - call: "POST /materials"
              payload: { sku: "SALT-E3C", name: "Page Salt C", offered_forms: [BULK], seasonal_category: "SALT", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: true }
              as: YardAdmin
          trigger:
            - call: "GET /materials"
              payload: { limit: 2, offset: 0 }
              as: YardAdmin
            - call: "GET /materials"
              payload: { limit: 2, offset: 2 }
              as: YardAdmin
            - call: "GET /materials"
              payload: { seasonal_category: "MULCH" }
              as: YardAdmin
          assert:
            - "first call: total_count == 3, has_more == true, data length == 2, limit == 2, offset == 0"
            - "second call: total_count == 3, has_more == false, data length == 1, offset == 2"
            - "third call: total_count == 2 and every returned row has seasonal_category == \"MULCH\" (filter narrows total_count, not just the page)"
            - "omitting limit on the third call applies the default limit 10 and offset 0"

      - name: material_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_MATERIAL_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: "A syntactically valid UUID that matches no Material yields 404 ERR_MATERIAL_NOT_FOUND rather than 200 with an empty body or 500."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /materials/00000000-0000-4000-8000-0000000000e4"
              payload: {}
              as: YardAdmin
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_MATERIAL_NOT_FOUND\""
            - "data.message is a non-empty human-readable string and the envelope shape matches section 1.0"

      - name: inventory_lot_create_without_moisture_returns_400
        claim_type: required_fields
        grounds:
          - endpoints[POST /inventory-lots]
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "moisture_pct_at_intake carries no default, so omitting it is a shape violation (400 ERR_INVALID_REQUEST) and must not be silently defaulted to the 15.0 reference percentage."
        test_recipe:
          setup:
            - "One Material exists."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-E5", name: "Required Field Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 50.0 }
              as: YardAdmin
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "no InventoryLot row is created and Material.${mat_id}.available_net_cubic_yards stays 0.00"

      - name: material_create_omitting_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Material.fields.moisture_pct
          - entities.Material.fields.unit_bag_cubic_yards
          - entities.Material.fields.prebuy_eligible
        distinguishing_aspect: "The three optional inputs fall back to 15.0, 0.037 and false respectively; because 15.0 is the moisture reference, the defaulted material's effective density equals its raw density exactly."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /materials"
              payload: { sku: "SOIL-E6", name: "Default Soil", offered_forms: [BULK], seasonal_category: "SOIL", density_lb_per_cubic_yard: 1200, shrinkage_factor: 0.10 }
              as: YardAdmin
              captures: { mat_id: $.data.id }
          assert:
            - "Material.${mat_id}.moisture_pct == 15.0, unit_bag_cubic_yards == 0.037, prebuy_eligible == false"
            - "Material.${mat_id}.effective_density_lb_per_cubic_yard == 1200.00"
            - "Material.${mat_id}.status == ACTIVE and version == 1"

      - name: inventory_lot_net_sellable_is_computed_not_accepted
        claim_type: computed_fields
        grounds:
          - entities.InventoryLot.fields.net_sellable_cubic_yards
          - calculations.inventory_net_sellable_volume
          - entities.Material.fields.available_net_cubic_yards
        distinguishing_aspect: "net_sellable_cubic_yards is absent from POST /inventory-lots' input and is derived on the intake basis: 40.00 gross at 25% moisture yields ROUND_HALF_UP(40 * 0.90 * 0.90, 2) = 32.40, which also becomes the material roll-up."
        test_recipe:
          setup:
            - "One Material with shrinkage_factor 0.10."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "SOIL-E7", name: "Computed Soil", offered_forms: [BULK], seasonal_category: "SOIL", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 40.0, moisture_pct_at_intake: 25.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
          assert:
            - "InventoryLot.${lot_id}.net_sellable_cubic_yards == 32.40 and basis == INTAKE"
            - "InventoryLot.${lot_id}.current_moisture_pct == 25.0, withdrawn_gross_cubic_yards == 0.0, reserved_cubic_yards == 0.0, status == AVAILABLE"
            - "Material.${mat_id}.available_net_cubic_yards == 32.40"

      - name: material_system_fields_are_server_minted_and_version_advances
        claim_type: system_fields
        grounds:
          - entities.Material
          - endpoints[PATCH /materials/{materialId}]
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted: version is 1 at create with created_at == updated_at, and a PATCH bumps version to 2 and moves updated_at while created_at and id stay frozen."
        test_recipe:
          setup:
            - "One Material at 15% moisture."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-E8", name: "System Field Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_created: $.data.created_at, mat_updated: $.data.updated_at }
          trigger:
            - call: "PATCH /materials/${mat_id}"
              payload: { moisture_pct: 20.0 }
              as: YardAdmin
          assert:
            - "before the trigger: Material.${mat_id}.version == 1 and ${mat_created} == ${mat_updated}"
            - "after the trigger: Material.${mat_id}.version == 2, id == ${mat_id}, created_at == ${mat_created}"
            - "after the trigger: Material.${mat_id}.updated_at is strictly later than ${mat_updated} and effective_density_lb_per_cubic_yard == 1050.00"

      - name: order_line_invalid_form_enum_returns_400
        claim_type: type_constraints
        grounds:
          - entities.OrderLine.fields.form
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "form is an enum of exactly {BULK, BAGGED}; a value outside the set is rejected at shape level (400) before the ERR_FORM_NOT_OFFERED business check at priority 28 can consider it."
        test_recipe:
          setup:
            - "A DRAFT DELIVERY order on an account with a large credit line, for a material offering BULK only."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-E9", name: "Enum Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Enum Landscapes", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "1 Enum St", driveway_access_class: "CLASS_A", delivery_distance_miles: 0.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "PALLET", quantity: 5.0 }
              as: Contractor
              as_user_id: "${acct_id}"
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /order-lines?material_order_id=${ord_id} returns total_count 0 and MaterialOrder.${ord_id}.fulfillment_status stays DRAFT"

      - name: inventory_lot_create_with_unknown_material_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.InventoryLot.fields.material_id
          - validations[priority=7]
          - errors[ERR_MATERIAL_NOT_FOUND]
        distinguishing_aspect: "The flat topology makes material_id a body foreign key rather than a path segment, and it must still be dereferenced: an unknown material_id yields 404 ERR_MATERIAL_NOT_FOUND, not a dangling lot."
        test_recipe:
          setup:
            - "Empty database (no Material rows at all)."
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-lots"
              payload: { material_id: "00000000-0000-4000-8000-0000000000ea", gross_cubic_yards: 50.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
          assert:
            - "HTTP 404 with data.error_id == \"ERR_MATERIAL_NOT_FOUND\""
            - "GET /inventory-lots returns total_count 0"

      - name: order_line_list_filters_by_parent_order_foreign_key
        claim_type: listing
        grounds:
          - endpoints[GET /order-lines]
          - entities.OrderLine.fields.material_order_id
        distinguishing_aspect: "The flat topology's reverse reachability runs through the filtered list: GET /order-lines?material_order_id=X returns exactly X's lines and none of the sibling order's, and the unfiltered call sees both."
        test_recipe:
          setup:
            - "One account with two DRAFT DELIVERY orders: order A carries two BULK lines, order B carries one BULK line."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-E11", name: "Filter Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Filter Grounds", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "2 Filter Way", driveway_access_class: "CLASS_A", delivery_distance_miles: 0.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ordA_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ordA_id}", material_id: "${mat_id}", form: "BULK", quantity: 3.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { lineA1: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ordA_id}", material_id: "${mat_id}", form: "BULK", quantity: 4.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { lineA2: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ordB_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ordB_id}", material_id: "${mat_id}", form: "BULK", quantity: 5.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { lineB1: $.data.id }
          trigger:
            - call: "GET /order-lines"
              payload: { material_order_id: "${ordA_id}" }
              as: YardAdmin
            - call: "GET /order-lines"
              payload: {}
              as: YardAdmin
          assert:
            - "filtered call: total_count == 2 and the ids are exactly ${lineA1} and ${lineA2}, ordered created_at ASC"
            - "filtered call: ${lineB1} is absent"
            - "unfiltered call: total_count == 3"
            - "every returned line has unit_price_cents == null and inventory_lot_id == null because neither order is confirmed"

  - section: state_machines
    instances:
      - name: price_schedule_promotes_on_clock_advance_and_supersedes_predecessor
        claim_type: valid_transition
        grounds:
          - state_machines.PriceSchedule
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "A SCHEDULED row is promoted by the clock endpoint itself, which reports the promoted id in promoted_price_schedule_ids while the same call retires the predecessor row EFFECTIVE -> SUPERSEDED in one hop."
        test_recipe:
          setup:
            - "One Material with two price rows: a July row already EFFECTIVE (its effective_from precedes the 2026-08-01 default clock) and a mid-September row still SCHEDULED."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "MULCH-S1", name: "Promotion Mulch", offered_forms: [BULK, BAGGED], seasonal_category: "MULCH", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
              captures: { sched_a: $.data.id }
            - call: "GET /materials/${mat_id}"
              payload: {}
              as: YardAdmin
              captures: { mat_ver2: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-09-15T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2400, bagged_price_per_bag_cents: 999, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver2}" }
              as: YardAdmin
              captures: { sched_b: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: YardAdmin
          assert:
            - "before the trigger: PriceSchedule.${sched_a}.status == EFFECTIVE and PriceSchedule.${sched_b}.status == SCHEDULED"
            - "trigger response data.current_utc == \"2026-09-15T00:00:00.000Z\" and data.promoted_price_schedule_ids == [\"${sched_b}\"]"
            - "trigger response data.expired_prebuy_contract_ids == []"
            - "after the trigger: PriceSchedule.${sched_b}.status == EFFECTIVE and version == 2"
            - "after the trigger: PriceSchedule.${sched_a}.status == SUPERSEDED and version == 2"

      - name: material_order_starts_in_draft_and_unbilled
        claim_type: initial_state
        grounds:
          - state_machines.MaterialOrder.fulfillment_status
          - state_machines.MaterialOrder.settlement_status
        distinguishing_aspect: "Both parallel dimensions get their own initial state on create (DRAFT and UNBILLED) and every money field is still null, so nothing is priced before confirm."
        test_recipe:
          setup:
            - "One ACTIVE contractor account with no purchase-order requirement."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { business_name: "Initial State Landscapes", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "HTTP 201 with MaterialOrder.${ord_id}.fulfillment_status == DRAFT and settlement_status == UNBILLED"
            - "MaterialOrder.${ord_id}.quoted_total_cents == null, final_total_cents == null, credit_memo_cents == 0, paid_amount_cents == null, quote_locked_at == null"
            - "MaterialOrder.${ord_id}.version == 1 and ContractorAccount.${acct_id}.credit_used_cents == 0 (a DRAFT order consumes no credit)"

      - name: deliver_on_a_planned_load_returns_409
        claim_type: invalid_transitions
        grounds:
          - state_machines.DeliveryLoad
          - errors[ERR_LOAD_NOT_DISPATCHED]
        distinguishing_aspect: "deliver is only wired from DISPATCHED; firing it from PLANNED is not in the transition list, so it returns 409 ERR_LOAD_NOT_DISPATCHED and leaves the truck AVAILABLE and the inventory untouched."
        test_recipe:
          setup:
            - "A CONFIRMED delivery order with one 8.0 cubic-yard BULK line and a PLANNED load on a TANDEM truck; the load has never been dispatched."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-S3", name: "Invalid Transition Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Invalid Transition Grounds", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "3 Invalid Rd", driveway_access_class: "CLASS_A", delivery_distance_miles: 10.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 8.0 }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /delivery-trucks"
              payload: { truck_code: "TND-S3", axle_class: "TANDEM", max_payload_lb: 40000, bed_capacity_cubic_yards: 12.0, min_driveway_access_class: "CLASS_A" }
              as: DispatchPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 8.0, window_start: "2026-08-02T08:00:00.000Z", window_end: "2026-08-02T09:00:00.000Z" }
              as: DispatchPlanner
              captures: { load_id: $.data.id }
          trigger:
