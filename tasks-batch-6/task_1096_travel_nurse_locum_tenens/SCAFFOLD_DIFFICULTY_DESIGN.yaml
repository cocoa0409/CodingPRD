  # =========================================================================
  # Rule 8 - Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: clinician_schedule_conflict_uses_buffered_closed_interval_travel_gap
        grounds:
          - validations[priority=15]
          - errors[ERR_CLINICIAN_SCHEDULE_CONFLICT]
          - entities.Assignment.fields.start_date
          - entities.Assignment.fields.end_date
        distinguishing_aspect: |
          Interval semantics 1 - PAIRWISE intervals on the CLINICIAN resource,
          expanded by TRAVEL_GAP_DAYS = 2 on both sides. The new assignment
          starting 2026-09-06, the very next day after the existing assignment
          ends on 2026-09-05, does NOT overlap geometrically yet is still
          rejected because the 2-day travel buffer swallows the gap.
        test_recipe:
          setup:
            - "Clinician Ada Reyes with a VERIFIED compact TX RN license expiring 2027-12-31."
            - "An existing DRAFT assignment at Desert Valley (capacity 2) covering 2026-06-07 .. 2026-09-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Desert Valley Medical Center", state_code: "AZ", per_diem_locality_code: "PHX-AZ", billing_contact_email: "ap@dvmc.example", is_compact_member: true, max_concurrent_travelers: 2 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_id: "$.data.id" }
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-06-07", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
              captures: { asg_a_id: "$.data.id" }
          trigger:
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-09-06", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
          assert:
            - "Assignment.${asg_a_id}.end_date == 2026-09-05"
            - "The response status is 409 and error_id == ERR_CLINICIAN_SCHEDULE_CONFLICT even though 2026-09-06 is strictly after 2026-09-05"
            - "GET /assignments filtered by clinician_id ${clin_id} returns exactly 1 row with total_count == 1"

      - name: facility_capacity_uses_unbuffered_aggregate_interval_count
        grounds:
          - validations[priority=17]
          - errors[ERR_FACILITY_CAPACITY_EXCEEDED]
          - entities.Facility.fields.max_concurrent_travelers
        distinguishing_aspect: |
          Interval semantics 2 - an AGGREGATE CAPACITY count on the FACILITY
          resource over UNBUFFERED closed intervals: the rule counts how many
          PENDING_START/ACTIVE assignments geometrically intersect the new one
          and compares that count against max_concurrent_travelers, with no
          travel buffer applied at all.
        test_recipe:
          setup:
            - "Facility `Mesa Regional` in AZ with max_concurrent_travelers 1."
            - "Clinician Ada Reyes holds a PENDING_START assignment there covering 2026-06-07 .. 2026-09-05 (contract FULLY_EXECUTED)."
            - "Clinician Ben Osei holds his own VERIFIED compact TX RN license expiring 2027-12-31, so licensure passes."
            - "The requested placement for Ben Osei runs 2026-08-30 .. 2026-11-28 and therefore intersects Ada's interval by 7 days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
