            - call: "POST /cidery/fermentation-batches/${fb_dst}/readings"
              payload: { gravity_brix: 5.0 }
              as: CellarLead
          trigger:
            - call: "POST /cidery/fermentation-batches/${fb_dst}/back-blend"
              payload: { source_batch_id: "${fb_src}", source_volume_liters: 10 }
              as: CellarLead
              captures: { fb_dst_after: $.data }
          assert:
            - "fb_dst_after.volume_liters == 80    # 70 + 10"
            - "fb_dst_after.back_blend_source_batch_id == fb_src"
            # Weighted gravity: (70*5.0 + 10*4.0)/80 = 390/80 = 4.875
            - "fb_dst_after.current_gravity_brix == 4.875"

  # =======================================================================
  # Section: errors — every error must be triggerable
  # =======================================================================
  - section: errors
    instances:
      - name: error_stale_version_triggerable
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STALE_VERSION]"
          - "concurrency_rules[contract-activate-stale-version]"
        distinguishing_aspect: |
          Activating a contract twice with the SAME expected_version: the
          first call succeeds (version advances 1->2); the second call
          (still carrying expected=1) returns 412 ERR_STALE_VERSION.
        test_recipe:
          setup: ["contract created, version=1"]
          setup_api_calls:
            - call: "POST /cidery/contracts"
              payload: { grower_name: "OCC", region_code: "NY", season_year: 2026, committed_weight_lbs: 1000, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { cocc: $.data.id, cocc_v: $.data.version }
          trigger:
            - call: "POST /cidery/contracts/${cocc}/activate"
              payload: { expected_contract_version: "${cocc_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${cocc}/activate"
              payload: { expected_contract_version: "${cocc_v}" }   # stale
              as: OrchardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_STALE_VERSION'"

      - name: error_segregation_of_duties_triggerable
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "validations[priority=6]"
        distinguishing_aspect: |
          Same X-User-ID that created a PackagingRun attempts to complete
          it -> 403 ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup: ["READY batch and ACTIVE product/label/license"]
          setup_api_calls:
            - call: "POST /cidery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cidery/varieties"
              payload: { code: "VSOD", tannin_g_per_l: 1.0, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { vsod: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "SOD", region_code: "NY", season_year: 2026, committed_weight_lbs: 200, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { csod: $.data.id, csod_v: $.data.version }
            - call: "POST /cidery/contracts/${csod}/activate"
              payload: { expected_contract_version: "${csod_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${csod}/harvest-lots"
              payload: { variety_id: "${vsod}", received_at: "2026-09-15T10:00:00Z", weight_lbs: 200, measured_brix: 13.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { hsod: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-16T08:00:00Z"
                press_window_minutes: 60
                blend_lines:
                  - { harvest_lot_id: "${hsod}", weight_lbs: 200, position: 1 }
              as: CellarLead
              captures: { pbsod: $.data.id }
            - call: "POST /cidery/press-batches/${pbsod}/start"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/press-batches/${pbsod}/complete"
              payload: { actual_juice_liters: 50 }
              as: CellarLead
            - call: "POST /cidery/tanks"
              payload: { code: "T-SOD", capacity_liters: 100, material: "STAINLESS", temperature_controlled: true }
              as: CellarLead
              captures: { tsod: $.data.id }
            - call: "POST /cidery/yeast-programs"
              payload: { code: "YSOD", kind: "CULTURED", attenuation_pct: 90, temp_min_f: 60, temp_max_f: 72, nutrient_required: false }
              as: CellarLead
              captures: { ysod: $.data.id }
            - call: "POST /cidery/fermentation-batches"
              payload: { press_batch_id: "${pbsod}", tank_id: "${tsod}", yeast_program_id: "${ysod}" }
              as: CellarLead
              captures: { fbsod: $.data.id }
            - call: "POST /cidery/fermentation-batches/${fbsod}/readings"
              payload: { gravity_brix: 4.0 }
              as: CellarLead
            - call: "POST /cidery/fermentation-batches/${fbsod}/age"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cidery/fermentation-batches/${fbsod}/ready"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/products"
              payload: { sku: "SOD-001", name: "SOD", style: "DRY", target_abv_pct: 5.0, vintage_year: 2026 }
              as: ComplianceOfficer
              captures: { psod: $.data.id }
            - call: "POST /cidery/products/${psod}/label-approvals"
              payload: { market: "FEDERAL_TTB", application_number: "TTB-SOD", expires_at: "2099-12-31T23:59:59Z" }
              as: ComplianceOfficer
              captures: { lasod: $.data.id }
            - call: "POST /cidery/label-approvals/${lasod}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cidery/products/${psod}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cidery/licenses"
              payload: { kind: "NY_FARM_CIDERY", license_number: "LICSOD", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-12-31T23:59:59Z", scope_states: ["NY"], annual_volume_cap_liters: 100000 }
              as: ComplianceOfficer
              captures: { lsod: $.data.id }
            # Same X-User-ID 'op-42' creates then attempts to complete
            - call: "POST /cidery/packaging-runs"
              payload: { product_id: "${psod}", fermentation_batch_id: "${fbsod}", package_format: "BOTTLE_500ML", volume_liters: 50, label_approval_id: "${lasod}", license_id: "${lsod}" }
              as: PackagingOperator
              as_user_id: "op-42"
              captures: { prsod: $.data.id }
            - call: "GET /cidery/fermentation-batches/${fbsod}"
              payload: {}
              as: PackagingOperator
              as_user_id: "op-42"
              captures: { fbsod_v: $.data.version }
          trigger:
            - call: "POST /cidery/packaging-runs/${prsod}/complete"
              payload: { expected_batch_version: "${fbsod_v}" }
              as: PackagingOperator
              as_user_id: "op-42"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_SEGREGATION_OF_DUTIES'"

  # =======================================================================
  # Section: rbac — role exclusivity, denial matrix
  # =======================================================================
  - section: rbac
    instances:
      - name: sales_rep_cannot_create_excise_report
        claim_type: violation_to_error
        grounds:
          - "roles"
        distinguishing_aspect: |
          SalesRep lacks exclusive_operations on POST /cidery/excise-reports
          (ComplianceOfficer-only); request denied with ERR_UNAUTHORIZED.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cidery/excise-reports"
              payload: { period_year: 2026, period_month: 10, regulator: "TTB" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNAUTHORIZED'"

      - name: packaging_operator_cannot_create_label
        claim_type: violation_to_error
        grounds:
          - "roles"
        distinguishing_aspect: |
          PackagingOperator lacks exclusive_operations on POST
          /cidery/products/{id}/label-approvals; denied.
        test_recipe:
          setup: ["product p_lbl created"]
          setup_api_calls:
            - call: "POST /cidery/products"
              payload: { sku: "LBL-001", name: "Lbl", style: "DRY", target_abv_pct: 5.0, vintage_year: 2026 }
              as: ComplianceOfficer
              captures: { p_lbl: $.data.id }
          trigger:
            - call: "POST /cidery/products/${p_lbl}/label-approvals"
              payload: { market: "FEDERAL_TTB", application_number: "TTB-LBL", expires_at: "2099-12-31T23:59:59Z" }
              as: PackagingOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNAUTHORIZED'"

      - name: platform_admin_can_set_clock
        claim_type: valid_transition
        grounds:
          - "roles.PlatformAdmin"
        distinguishing_aspect: |
          PlatformAdmin can set the logical clock; other roles cannot.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cidery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { res: $.data }
          assert:
            - "res.now_iso8601 == '2026-06-01T00:00:00Z'"

      - name: compliance_officer_cannot_set_clock
        claim_type: violation_to_error
        grounds:
          - "roles.PlatformAdmin"
        distinguishing_aspect: |
          ComplianceOfficer lacks _clock exclusive op -> ERR_UNAUTHORIZED.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cidery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNAUTHORIZED'"

  # =======================================================================
  # Section: cross_cutting_layers — OCC, cascading side effects, soft delete
  # =======================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_contract_activate_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[contract-activate-stale-version"
        excluded_because:
          difficulty_instance: error_stale_version_triggerable
          rationale: "The stale-version OCC behavior is asserted in errors section above (§1.9 errors entry)."

      - name: occ_packaging_complete_stale_batch
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[packaging-complete-stale-batch"
        distinguishing_aspect: |
          After a PackagingRun completes (bumping fb.version), a second
          complete call on the SAME packaging run with the OLD
          expected_batch_version returns 412 ERR_STALE_VERSION.
        test_recipe:
          setup: ["READY fb with 100 L; two SCHEDULED runs pr_a (30 L) and pr_b (30 L) on same fb"]
          setup_api_calls:
            - call: "POST /cidery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cidery/varieties"
              payload: { code: "VOCC2", tannin_g_per_l: 1.0, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { vocc2: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "OCC2", region_code: "NY", season_year: 2026, committed_weight_lbs: 400, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { cocc2: $.data.id, cocc2_v: $.data.version }
            - call: "POST /cidery/contracts/${cocc2}/activate"
              payload: { expected_contract_version: "${cocc2_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${cocc2}/harvest-lots"
              payload: { variety_id: "${vocc2}", received_at: "2026-09-15T10:00:00Z", weight_lbs: 400, measured_brix: 13.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { hocc2: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-16T08:00:00Z"
                press_window_minutes: 60
                blend_lines:
                  - { harvest_lot_id: "${hocc2}", weight_lbs: 400, position: 1 }
              as: CellarLead
              captures: { pbocc2: $.data.id }
            - call: "POST /cidery/press-batches/${pbocc2}/start"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/press-batches/${pbocc2}/complete"
              payload: { actual_juice_liters: 100 }
              as: CellarLead
            - call: "POST /cidery/tanks"
              payload: { code: "T-OCC2", capacity_liters: 200, material: "STAINLESS", temperature_controlled: true }
              as: CellarLead
              captures: { tocc2: $.data.id }
            - call: "POST /cidery/yeast-programs"
              payload: { code: "YOCC2", kind: "CULTURED", attenuation_pct: 90, temp_min_f: 60, temp_max_f: 72, nutrient_required: false }
              as: CellarLead
              captures: { yocc2: $.data.id }
            - call: "POST /cidery/fermentation-batches"
              payload: { press_batch_id: "${pbocc2}", tank_id: "${tocc2}", yeast_program_id: "${yocc2}" }
              as: CellarLead
              captures: { fbocc2: $.data.id }
            - call: "POST /cidery/fermentation-batches/${fbocc2}/readings"
              payload: { gravity_brix: 4.0 }
              as: CellarLead
            - call: "POST /cidery/fermentation-batches/${fbocc2}/age"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cidery/fermentation-batches/${fbocc2}/ready"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/products"
              payload: { sku: "OCC2-001", name: "OCC2", style: "DRY", target_abv_pct: 5.0, vintage_year: 2026 }
              as: ComplianceOfficer
              captures: { pocc2: $.data.id }
            - call: "POST /cidery/products/${pocc2}/label-approvals"
              payload: { market: "FEDERAL_TTB", application_number: "TTB-OCC2", expires_at: "2099-12-31T23:59:59Z" }
              as: ComplianceOfficer
              captures: { laocc2: $.data.id }
            - call: "POST /cidery/label-approvals/${laocc2}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cidery/products/${pocc2}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cidery/licenses"
              payload: { kind: "NY_FARM_CIDERY", license_number: "LICOCC2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-12-31T23:59:59Z", scope_states: ["NY"], annual_volume_cap_liters: 100000 }
              as: ComplianceOfficer
              captures: { locc2: $.data.id }
            - call: "POST /cidery/packaging-runs"
              payload: { product_id: "${pocc2}", fermentation_batch_id: "${fbocc2}", package_format: "BOTTLE_500ML", volume_liters: 30, label_approval_id: "${laocc2}", license_id: "${locc2}" }
              as: PackagingOperator
              as_user_id: "op-A"
              captures: { pr_a: $.data.id }
            - call: "POST /cidery/packaging-runs"
              payload: { product_id: "${pocc2}", fermentation_batch_id: "${fbocc2}", package_format: "BOTTLE_500ML", volume_liters: 30, label_approval_id: "${laocc2}", license_id: "${locc2}" }
              as: PackagingOperator
              as_user_id: "op-B"
              captures: { pr_b: $.data.id }
            # Snapshot fb.version AFTER both runs are scheduled but BEFORE either completes
            - call: "GET /cidery/fermentation-batches/${fbocc2}"
              payload: {}
              as: PackagingOperator
              as_user_id: "op-B"
              captures: { fbocc2_v_pre: $.data.version }
          trigger:
            # pr_a completes: bumps fb.version from fbocc2_v_pre to fbocc2_v_pre+1
            - call: "POST /cidery/packaging-runs/${pr_a}/complete"
              payload: { expected_batch_version: "${fbocc2_v_pre}" }
              as: PackagingOperator
              as_user_id: "op-A2"  # different operator -> segregation_of_duties satisfied
            # pr_b's client still holds fbocc2_v_pre; its complete call must 412
            - call: "POST /cidery/packaging-runs/${pr_b}/complete"
              payload: { expected_batch_version: "${fbocc2_v_pre}" }
              as: PackagingOperator
              as_user_id: "op-B2"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_STALE_VERSION'"

      - name: derived_field_license_volume_used
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.LicensePermit.fields.volume_used_liters"
        excluded_because:
          difficulty_instance: packaging_complete_cascades_batch_to_tank_to_license
          rationale: "Derived license.volume_used_liters increment asserted in transitive_cascade instance."

  # =======================================================================
  # Section: consistency_model — immediate consistency
  # =======================================================================
  - section: consistency_model
    instances:
      - name: create_returns_full_entity_immediately
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: |
          POST create responses return the fully-populated entity (no
          eventual consistency): computed fields like
          OrchardContract.received_weight_lbs are present and equal 0
          immediately on creation.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cidery/contracts"
              payload: { grower_name: "IC", region_code: "NY", season_year: 2026, committed_weight_lbs: 1000, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { created: $.data }
          assert:
            - "created.received_weight_lbs == 0"
            - "created.status == 'DRAFT'"
            - "created.version == 1"
