            - call: "POST /assembly-stations"
              payload: { name: "Station S", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "CLIENT_APPRECIATION", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_a_id: $.data.id }
            - call: "POST /orders/${order_a_id}/recipients/import"
              payload: { rows: [ { full_name: "Reserve All Recipient", email: "reserveall@example.com", shipping_address_line1: "23 Juniper St", city: "Roseburg", state_code: "OR", postal_code: "97470", country_code: "US", quantity: 5 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_a_id: "$.data[0].id" }
            - call: "POST /orders/${order_a_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-16" }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_a_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-16", station_id: "${station_id}", scheduled_date: "2026-03-04T00:00:00Z" }
              as: FinanceApprover
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "CLIENT_APPRECIATION", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_probe_id: $.data.id }
            - call: "POST /orders/${order_probe_id}/recipients/import"
              payload: { rows: [ { full_name: "Probe Before Cancel", email: "probebefore@example.com", shipping_address_line1: "24 Larch St", city: "Coos Bay", state_code: "OR", postal_code: "97420", country_code: "US", quantity: 5 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { probe_before_row_status: "$.data[0].import_row_status" }
            - call: "POST /orders/${order_a_id}/cancel"
              payload: {}
              as: AccountManager
