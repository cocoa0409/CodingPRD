              as: ComplianceOfficer
              captures: { prog_1: $.data.id }
            - call: "POST /safe-harbor-programs"
              payload: { program_name: "Seal Two", regulator_approved: true }
              as: ComplianceOfficer
              captures: { prog_2: $.data.id }
          trigger:
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_a}", program_id: "${prog_1}", assessment_year: 2026 }
              as: SafeHarborAssessor
              as_user_id: "assessor-4"
              captures: { asmt_1: $.data.id }
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_a}", program_id: "${prog_1}", assessment_year: 2026 }
              as: SafeHarborAssessor
              as_user_id: "assessor-4"
              captures: { err_duplicate: $.data.error_id }
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_a}", program_id: "${prog_1}", assessment_year: 2027 }
              as: SafeHarborAssessor
              as_user_id: "assessor-4"
              captures: { asmt_2: $.data.id }
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_a}", program_id: "${prog_2}", assessment_year: 2026 }
              as: SafeHarborAssessor
              as_user_id: "assessor-4"
              captures: { asmt_3: $.data.id }
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_b}", program_id: "${prog_1}", assessment_year: 2026 }
              as: SafeHarborAssessor
              as_user_id: "assessor-5"
              captures: { asmt_4: $.data.id, asmt_4_preparer: $.data.preparer_user_id }
            - call: "GET /safe-harbor-assessments"
              payload: { service_id: "${svc_a}", limit: 100, offset: 0 }
              as: ComplianceOfficer
              captures: { svc_a_total: $.meta.total_count }
            - call: "GET /safe-harbor-assessments"
              payload: { service_id: "${svc_b}", program_id: "${prog_1}", assessment_year: 2026, limit: 100, offset: 0 }
