              as: CommunityManager
              as_user_id: "cm-1"
            - call: "POST /co-living/tickets/${t2_id}/schedule"
              payload: { visit_start: "2026-06-11T09:00:00.000Z", visit_end: "2026-06-11T10:00:00.000Z", expected_house_version: "${hv1}" }
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
            - call: "GET /co-living/houses/${house_id}"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { hv2: $.data.version }
            - call: "POST /co-living/tickets/${t2_id}/schedule"
              payload: { visit_start: "2026-06-11T09:00:00.000Z", visit_end: "2026-06-11T10:00:00.000Z", expected_house_version: "${hv2}" }
              as: CommunityManager
              as_user_id: "cm-1"
          assert:
            - "the first schedule returns HTTP 200 and MaintenanceTicket.${t1_id}.status == SCHEDULED"
            - "the stale second schedule returns HTTP 412 with error_id == ERR_STALE_HOUSE_VERSION and MaintenanceTicket.${t2_id}.status stays OPEN"
            - "${hv2} == ${hv1} + 1"
            - "the retried schedule returns HTTP 200 and MaintenanceTicket.${t2_id}.status == SCHEDULED with visit_start == 2026-06-11T09:00:00.000Z"

