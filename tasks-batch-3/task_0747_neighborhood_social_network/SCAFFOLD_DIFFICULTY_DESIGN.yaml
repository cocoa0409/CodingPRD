              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
