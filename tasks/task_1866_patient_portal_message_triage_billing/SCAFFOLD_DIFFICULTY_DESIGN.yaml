  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: EVisitClaim↔PortalMessage and
  # PortalMessage↔PatientEducationNotice (different pairs).
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_create_requires_message_resolved_chargeable
        grounds:
          - validations[priority=9]
          - errors[ERR_MESSAGE_NOT_RESOLVED]
          - state_machines.PortalMessage.PENDING_CONSENT_to_IN_REVIEW
        distinguishing_aspect: |
          Entity pair EVisitClaim -> PortalMessage: claim creation is gated on
          the source message being RESOLVED (state) and CHARGEABLE (field
          derived from ConsentRecord state). IN_REVIEW + CHARGEABLE is rejected
          with ERR_MESSAGE_NOT_RESOLVED; after complete the same call succeeds.
          Distinct pair from message_create_blocked_by_education_gate
          (PortalMessage -> PatientEducationNotice).
        test_recipe:
          setup:
            - "Message IN_REVIEW with billing_disposition == CHARGEABLE (8 provider minutes, consent GRANTED, not yet completed)"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Bill S", staff_type: "BILLING_SPECIALIST" }, as: PracticeAdmin, captures: { bill_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat N", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_n: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Gate", body: "clinical" }, as: Patient, as_user_id: "${pat_n}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 8 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent_id: "$.data[0].id" } }
            - { call: "POST /inbox/consent-records/${consent_id}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat_n}" }
          trigger:
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "now resolved" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { cl: "$.data.id", cl_st: "$.data.status" } }
          assert:
            - "while message IN_REVIEW (even though CHARGEABLE): error_id == ERR_MESSAGE_NOT_RESOLVED, http 409"
            - "after complete -> RESOLVED: claim created with status == DRAFT, code == CPT_99421, fee_cents == 5000, patient_responsibility_cents == 2500"

      - name: message_create_blocked_by_education_gate
        grounds:
          - validations[priority=8]
          - calculations.education_gate
          - entities.Patient.fields.education_gate_open
          - errors[ERR_EDUCATION_ACK_REQUIRED]
        distinguishing_aspect: |
          Entity pair PortalMessage -> PatientEducationNotice (via Patient):
          message creation is rejected while any blocking ISSUED notice exists
          for the patient, and succeeds again after acknowledge flips the
          computed gate. Distinct pair from
          claim_create_requires_message_resolved_chargeable
          (EVisitClaim -> PortalMessage).
        test_recipe:
          setup:
            - "Patient with one delivered message M1; triage nurse issues a blocking EMERGENT_MISUSE notice on M1"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat O", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_o: "$.data.id" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Chest pain", body: "crushing chest pain now" }, as: Patient, as_user_id: "${pat_o}", captures: { m1: "$.data.id" } }
            - { call: "POST /inbox/education-notices", payload: { message_id: "${m1}", notice_kind: "EMERGENT_MISUSE", body: "Portal is not for emergencies; call 911." }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { notice: "$.data.id" } }
            - { call: "GET /inbox/patients/${pat_o}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { gate1: "$.data.education_gate_open" } }
          trigger:
            - { call: "POST /inbox/portal-messages", payload: { subject: "Second", body: "another message" }, as: Patient, as_user_id: "${pat_o}", captures: { err: "$.data.error_id" } }
            - { call: "POST /inbox/education-notices/${notice}/acknowledge", payload: {}, as: Patient, as_user_id: "${pat_o}" }
            - { call: "GET /inbox/patients/${pat_o}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { gate2: "$.data.education_gate_open" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Second", body: "another message" }, as: Patient, as_user_id: "${pat_o}", captures: { m2: "$.data.id", m2_st: "$.data.status" } }
          assert:
            - "gate open after blocking notice: education_gate_open == true"
            - "blocked create: error_id == ERR_EDUCATION_ACK_REQUIRED, http 403"
            - "after acknowledge: education_gate_open == false and create succeeds with status == RECEIVED (201)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: half-open CoverageWindow (adjacency
  # allowed) vs CLOSED OnCallShift (touch is conflict). Different interval
  # semantics on different resource entities.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: coverage_window_half_open_adjacency
        grounds:
          - validations[priority=19]
          - entities.CoverageWindow.fields.end_utc
          - errors[ERR_COVERAGE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on the CoverageWindow
          resource (per staff_id) — a window starting exactly at the existing
          window's end is ACCEPTED, while a straddling window is rejected.
          Distinct semantics and resource from
          oncall_shift_closed_touch_conflict (CLOSED OnCallShift).
        test_recipe:
          setup:
            - "Nurse S and a NURSE_TRIAGE pool; existing window W1 = [2026-08-03T09:00Z, 2026-08-03T12:00Z)"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse S", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "NurseTriage", pool_kind: "NURSE_TRIAGE", target_minutes_emergent: 15, target_minutes_urgent: 60, target_minutes_routine: 240, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_n: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_n}", staff_id: "${nurse_id}", start_utc: "2026-08-03T09:00:00Z", end_utc: "2026-08-03T12:00:00Z" }, as: PracticeAdmin, captures: { w1: "$.data.id" } }
          trigger:
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_n}", staff_id: "${nurse_id}", start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T15:00:00Z" }, as: PracticeAdmin, captures: { w2: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_n}", staff_id: "${nurse_id}", start_utc: "2026-08-03T11:00:00Z", end_utc: "2026-08-03T13:00:00Z" }, as: PracticeAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "adjacent window [12:00, 15:00) ACCEPTED (201): new.start == existing.end is not an intersection under half-open semantics"
            - "straddling window [11:00, 13:00) REJECTED with ERR_COVERAGE_WINDOW_OVERLAP (409)"
            - "overlap rule is per staff_id (a window intersecting the same hours but for a DIFFERENT staff member would be accepted)"

      - name: oncall_shift_closed_touch_conflict
        grounds:
          - validations[priority=20]
          - entities.OnCallShift.fields.end_utc
          - errors[ERR_ONCALL_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: CLOSED [start, end] on the OnCallShift resource
          (per provider_id) — a shift starting exactly at the existing shift's
          end CONFLICTS (touching endpoints intersect); only a strict gap is
          accepted. Distinct semantics and resource from
          coverage_window_half_open_adjacency (half-open CoverageWindow).
        test_recipe:
          setup:
            - "Provider P with existing on-call shift S1 = [2026-08-03T17:00Z, 2026-08-03T21:00Z] (closed)"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/on-call-shifts", payload: { provider_id: "${prov_id}", start_utc: "2026-08-03T17:00:00Z", end_utc: "2026-08-03T21:00:00Z" }, as: PracticeAdmin, captures: { s1: "$.data.id" } }
          trigger:
            - { call: "POST /inbox/on-call-shifts", payload: { provider_id: "${prov_id}", start_utc: "2026-08-03T21:00:00Z", end_utc: "2026-08-03T23:00:00Z" }, as: PracticeAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /inbox/on-call-shifts", payload: { provider_id: "${prov_id}", start_utc: "2026-08-03T21:00:01Z", end_utc: "2026-08-03T23:00:00Z" }, as: PracticeAdmin, captures: { s3: "$.data.id" } }
          assert:
            - "touching shift [21:00, 23:00] REJECTED with ERR_ONCALL_SHIFT_OVERLAP (409): endpoint touch intersects under closed semantics"
            - "gapped shift [21:00:01, 23:00] ACCEPTED (201)"
            - "contrast pinned: the same adjacency that CoverageWindow accepts, OnCallShift rejects"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: staff open-message COUNT conservation vs
  # patient outstanding MONEY-CENTS conservation.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: open_inbox_count_conservation
        grounds:
          - calculations.open_inbox_count_maintenance
          - entities.StaffMember.fields.open_inbox_count
        distinguishing_aspect: |
          Conserved quantity: message COUNT. Forward/compensating pairs
          (assign +1 / complete -1) and zero-sum moves (re-route, escalate)
          leave SUM over staff of open_inbox_count equal to the number of
          messages in counted statuses: after full cycle all three staff are
          back to 0. Distinct quantity type from
          outstanding_billed_conservation (money cents).
        test_recipe:
          setup:
            - "Nurse N, providers P1/P2, on-call provider P3 with shift [08:00,20:00] covering 10:00; PROVIDER_INBOX pool"
            - "Message triaged URGENT; assign P1 -> re-route P2 -> escalate to P3 -> acknowledge -> complete"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P1", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P2", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P3", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p3: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat P", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_p: "$.data.id" } }
            - { call: "POST /inbox/on-call-shifts", payload: { provider_id: "${p3}", start_utc: "2026-08-03T08:00:00Z", end_utc: "2026-08-03T20:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Count", body: "counting" }, as: Patient, as_user_id: "${pat_p}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${p1}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "GET /inbox/staff/${p1}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { c_p1_a: "$.data.open_inbox_count" } }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${p2}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/escalate", payload: { reason: "patient worsening" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { esc: "$.data.id", esc_prov: "$.data.provider_id" } }
            - { call: "GET /inbox/staff/${p1}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { c_p1_b: "$.data.open_inbox_count" } }
            - { call: "GET /inbox/staff/${p2}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { c_p2_b: "$.data.open_inbox_count" } }
            - { call: "GET /inbox/staff/${p3}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { c_p3_b: "$.data.open_inbox_count" } }
            - { call: "POST /inbox/escalations/${esc}/acknowledge", payload: {}, as: Provider, as_user_id: "${p3}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "resolved by on-call" }, as: Provider, as_user_id: "${p3}" }
            - { call: "GET /inbox/staff/${p3}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { c_p3_c: "$.data.open_inbox_count" } }
          assert:
            - "after assign to P1: P1.open_inbox_count == 1 (forward +1)"
            - "after re-route to P2: P1 == 0, P2 == 1 (zero-sum move)"
            - "after escalate: P2 == 0, P3 == 1 and escalation.provider_id == ${p3} (zero-sum move to on-call)"
            - "after complete (compensating -1): P3 == 0 — global sum returns to 0 == number of messages in counted statuses"
            - "invariant holds at every step: SUM(open_inbox_count) == COUNT(messages in {ASSIGNED, IN_REVIEW, PENDING_CONSENT, PENDING_COSIGN, ESCALATED, REOPENED} with non-null assignee)"

      - name: outstanding_billed_conservation
        grounds:
          - calculations.outstanding_billed_maintenance
          - entities.Patient.fields.outstanding_billed_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY CENTS. submit (+2500) paired with its
          compensating adjudication PAID (-2500) leaves
          patient.outstanding_billed_cents unchanged net; DRAFT never enters
          the outstanding set. Distinct quantity type from
          open_inbox_count_conservation (count).
        test_recipe:
          setup:
            - "Full billing flow to DRAFT claim: 8 provider minutes (99421/5000c), COPAY patient (responsibility 2500c), consent GRANTED, message RESOLVED"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Bill S", staff_type: "BILLING_SPECIALIST" }, as: PracticeAdmin, captures: { bill_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat Q", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_q: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Money", body: "billing" }, as: Patient, as_user_id: "${pat_q}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 8 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent_id: "$.data[0].id" } }
            - { call: "POST /inbox/consent-records/${consent_id}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat_q}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "done" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { cl: "$.data.id" } }
            - { call: "GET /inbox/patients/${pat_q}", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { out_draft: "$.data.outstanding_billed_cents" } }
          trigger:
            - { call: "POST /inbox/e-visit-claims/${cl}/submit", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}" }
            - { call: "GET /inbox/patients/${pat_q}", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { out_sub: "$.data.outstanding_billed_cents" } }
            - { call: "POST /inbox/e-visit-claims/${cl}/record-adjudication", payload: { outcome: "PAID" }, as: BillingSpecialist, as_user_id: "${bill_id}" }
            - { call: "GET /inbox/patients/${pat_q}", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { out_paid: "$.data.outstanding_billed_cents" } }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { m_st: "$.data.status" } }
          assert:
            - "DRAFT claim: outstanding_billed_cents == 0 (DRAFT not in {SUBMITTED, DENIED})"
            - "after submit (forward +2500): outstanding_billed_cents == 2500"
            - "after PAID (compensating -2500): outstanding_billed_cents == 0 — submit + PAID leave the conserved quantity unchanged"
            - "PAID cascade auto-closes the RESOLVED message: message.status == CLOSED"
            - "invariant: outstanding_billed_cents == SUM(patient_responsibility_cents) over claims in {SUBMITTED, DENIED} at every step"
