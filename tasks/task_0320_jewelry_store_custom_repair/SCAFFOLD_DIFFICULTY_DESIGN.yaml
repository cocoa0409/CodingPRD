# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Jewelry Store & Custom/Repair — EXPERT tier
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every recipe drives empty-DB -> precondition via §1.5 endpoints only.
# All formula-derived asserts are pre-computed literals (integer cents).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: custom_order_provisional_vs_final_total
        grounds:
          - calculations.custom_order_totals
          - entities.CustomDesignOrder.fields.provisional_total_cents
          - entities.CustomDesignOrder.fields.final_total_cents
          - state_machines.CustomDesignOrder.QUOTED
          - state_machines.CustomDesignOrder.IN_PRODUCTION_to_READY
        distinguishing_aspect: |
          On CustomDesignOrder the provisional quote (480000) and the final per-line
          actual total (325603) are different numbers produced by different algorithms
          at different stages on the SAME order.
        test_recipe:
          setup:
            - "A customer and a DRAFT custom order with estimated_materials_cents=300000, design_fee_cents=120000 exist; the order has been quoted, deposit (144000) paid, design started/reviewed/approved with three line items, and production has just completed."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ada Ruby", email: "ada@x.com", phone: "555-0001" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", description: "Engagement ring", estimated_materials_cents: 300000, design_fee_cents: 120000 }
              as: SalesAssociate
              captures: { co_id: $.data.id, co_v0: $.data.version }
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v0}" }
              as: SalesAssociate
              captures: { co_v1: $.data.version }
            - call: "POST /payments"
              payload: { target_type: "CUSTOM_ORDER", custom_order_id: "${co_id}", amount_cents: 144000 }
              as: SalesAssociate
            - call: "POST /custom-orders/${co_id}/start-design"
              payload: { expected_version: "${co_v1}" }
              as: Goldsmith
              captures: { co_v2: $.data.version }
            - call: "POST /custom-orders/${co_id}/submit-review"
              payload: { expected_version: "${co_v2}" }
              as: Goldsmith
              captures: { co_v3: $.data.version }
            - call: "POST /custom-orders/${co_id}/approve-design"
              payload: { line_items: [ { qty: 1, unit_price_cents: 99990, markup_pct: 0.175 }, { qty: 1, unit_price_cents: 49995, markup_pct: 0.175 }, { qty: 1, unit_price_cents: 24997, markup_pct: 0.175 } ], expected_version: "${co_v3}" }
              as: SalesAssociate
              captures: { co_v4: $.data.version }
            - call: "POST /custom-orders/${co_id}/start-production"
              payload: { expected_version: "${co_v4}" }
              as: Goldsmith
              captures: { co_v5: $.data.version }
          trigger:
            - call: "POST /custom-orders/${co_id}/complete-production"
              payload: { expected_version: "${co_v5}" }
              as: Goldsmith
              captures: { co_final: $.data.final_total_cents, co_prov: $.data.provisional_total_cents }
          assert:
            - "CustomDesignOrder.${co_id}.provisional_total_cents == 480000"
            - "CustomDesignOrder.${co_id}.final_total_cents == 325603"
            - "CustomDesignOrder.${co_id}.balance_due_cents == 181603"
            - "CustomDesignOrder.${co_id}.status == READY"

      - name: layaway_projected_payoff_vs_settlement_refund
        grounds:
          - calculations.layaway_schedule
          - entities.LayawayPlan.fields.projected_payoff_cents
          - entities.LayawayPlan.fields.settlement_refund_cents
          - state_machines.LayawayPlan.PENDING_to_ACTIVE
          - state_machines.LayawayPlan.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          On LayawayPlan the projected payoff (600000, no fees) and the cancellation
          settlement refund (230000 = paid 280000 minus 50000 restocking) are different
          numbers from different variants — a different entity domain than the custom-order
          dual variant.
        test_recipe:
          setup:
            - "A customer, an IN_STOCK item priced 600000, and an ACTIVE 6-installment layaway plan exist; down payment 120000 plus two 80000 installments have been paid (paid_to_date=280000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bea Opal", email: "bea@x.com", phone: "555-0002" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "RING-600", title: "Sapphire Band", metal_karat: "K18", list_price_cents: 600000 }
              as: StoreManager
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", installment_count: 6 }
              as: SalesAssociate
              captures: { lp_id: $.data.id, lp_v0: $.data.version }
            - call: "POST /layaway-plans/${lp_id}/activate"
              payload: { expected_inventory_item_version: "${item_v0}" }
              as: SalesAssociate
              captures: { lp_v1: $.data.version }
            - call: "POST /payments"
              payload: { target_type: "LAYAWAY", layaway_plan_id: "${lp_id}", amount_cents: 80000 }
              as: SalesAssociate
            - call: "POST /payments"
              payload: { target_type: "LAYAWAY", layaway_plan_id: "${lp_id}", amount_cents: 80000 }
              as: SalesAssociate
          trigger:
            - call: "POST /layaway-plans/${lp_id}/cancel"
              payload: { expected_version: "${lp_v1}" }
              as: StoreManager
              captures: { lp_refund: $.data.settlement_refund_cents }
          assert:
            - "LayawayPlan.${lp_id}.projected_payoff_cents == 600000"
            - "LayawayPlan.${lp_id}.restocking_fee_cents == 50000"
            - "LayawayPlan.${lp_id}.settlement_refund_cents == 230000"
            - "LayawayPlan.${lp_id}.status == CANCELLED"
            - "Customer.${cust_id}.store_credit_balance_cents == 230000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: trade_in_credit_tiered_nested_min_max
        grounds:
          - calculations.trade_in_credit
          - entities.TradeInOffer.fields.metal_value_cents
          - entities.TradeInOffer.fields.buyback_credit_cents
        distinguishing_aspect: |
          MODE (a): trade_in_credit combines >=3 inputs (weight, spot price, purity-by-karat,
          gemstone value, condition factor) through a tiered purity lookup and a nested
          min(MAX, max(MIN, raw)) clamp — non-linear interaction.
        test_recipe:
          setup:
            - "A customer exists; a trade-in offer for a 12.0g K18 piece at spot 6000 c/g, gemstone value 150000, condition GOOD is created."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cy Jade", email: "cy@x.com", phone: "555-0003" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", metal_karat: "K18", metal_weight_grams: 12.0, metal_spot_price_cents_per_gram: 6000, gemstone_value_cents: 150000, condition: "GOOD" }
              as: SalesAssociate
              captures: { ti_id: $.data.id, ti_credit: $.data.buyback_credit_cents }
          assert:
            - "TradeInOffer.${ti_id}.metal_value_cents == 54000"
            - "TradeInOffer.${ti_id}.buyback_credit_cents == 153000"
            - "TradeInOffer.${ti_id}.status == OFFERED"

      - name: custom_order_final_total_round_per_line_then_sum
        grounds:
          - calculations.custom_order_totals
          - entities.CustomDesignOrder.fields.final_total_cents
          - state_machines.CustomDesignOrder.IN_PRODUCTION_to_READY
        distinguishing_aspect: |
          MODE (b): final_total_cents rounds each line item to cents BEFORE summation
          (117488+58744+29371=205603) + design_fee 120000 = 325603; the pinned per-line
          order differs by 1 cent from sum-then-round (which yields 325604). Different mode
          from the trade-in tiered formula.
        test_recipe:
          setup:
            - "A custom order quoted (est 300000, design_fee 120000), deposit 144000 paid, design approved with three fractional-cent line items, production just completed."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dot Onyx", email: "dot@x.com", phone: "555-0004" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", description: "Pendant", estimated_materials_cents: 300000, design_fee_cents: 120000 }
              as: SalesAssociate
              captures: { co_id: $.data.id, co_v0: $.data.version }
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v0}" }
              as: SalesAssociate
              captures: { co_v1: $.data.version }
            - call: "POST /payments"
              payload: { target_type: "CUSTOM_ORDER", custom_order_id: "${co_id}", amount_cents: 144000 }
              as: SalesAssociate
            - call: "POST /custom-orders/${co_id}/start-design"
              payload: { expected_version: "${co_v1}" }
              as: Goldsmith
              captures: { co_v2: $.data.version }
            - call: "POST /custom-orders/${co_id}/submit-review"
              payload: { expected_version: "${co_v2}" }
              as: Goldsmith
              captures: { co_v3: $.data.version }
            - call: "POST /custom-orders/${co_id}/approve-design"
              payload: { line_items: [ { qty: 1, unit_price_cents: 99990, markup_pct: 0.175 }, { qty: 1, unit_price_cents: 49995, markup_pct: 0.175 }, { qty: 1, unit_price_cents: 24997, markup_pct: 0.175 } ], expected_version: "${co_v3}" }
              as: SalesAssociate
              captures: { co_v4: $.data.version }
            - call: "POST /custom-orders/${co_id}/start-production"
              payload: { expected_version: "${co_v4}" }
              as: Goldsmith
              captures: { co_v5: $.data.version }
          trigger:
            - call: "POST /custom-orders/${co_id}/complete-production"
              payload: { expected_version: "${co_v5}" }
              as: Goldsmith
              captures: { co_final: $.data.final_total_cents }
          assert:
            - "CustomDesignOrder.${co_id}.final_total_cents == 325603"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: custom_order_cyclic_revision_loop
        grounds:
          - state_machines.CustomDesignOrder.DESIGN_REVIEW_to_IN_DESIGN
          - state_machines.CustomDesignOrder.IN_DESIGN_to_DESIGN_REVIEW
          - entities.CustomDesignOrder.fields.revision_count
        distinguishing_aspect: |
          CustomDesignOrder cycles DESIGN_REVIEW -> IN_DESIGN -> DESIGN_REVIEW; revision_count
          increments per loop. This is a true cycle (revisits states), not a linear pipeline.
        test_recipe:
          setup:
            - "A custom order is quoted, deposit paid, design started and submitted (DESIGN_REVIEW), then a revision requested and re-submitted (back in DESIGN_REVIEW with revision_count=1)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Eli Pearl", email: "eli@x.com", phone: "555-0005" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", description: "Cufflinks", estimated_materials_cents: 200000, design_fee_cents: 50000 }
              as: SalesAssociate
              captures: { co_id: $.data.id, co_v0: $.data.version }
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v0}" }
              as: SalesAssociate
              captures: { co_v1: $.data.version, dep: $.data.deposit_required_cents }
            - call: "POST /payments"
              payload: { target_type: "CUSTOM_ORDER", custom_order_id: "${co_id}", amount_cents: 90000 }
              as: SalesAssociate
            - call: "POST /custom-orders/${co_id}/start-design"
              payload: { expected_version: "${co_v1}" }
              as: Goldsmith
              captures: { co_v2: $.data.version }
            - call: "POST /custom-orders/${co_id}/submit-review"
              payload: { expected_version: "${co_v2}" }
              as: Goldsmith
              captures: { co_v3: $.data.version }
            - call: "POST /custom-orders/${co_id}/request-revision"
              payload: { expected_version: "${co_v3}" }
              as: SalesAssociate
              captures: { co_v4: $.data.version }
          trigger:
            - call: "POST /custom-orders/${co_id}/submit-review"
              payload: { expected_version: "${co_v4}" }
              as: Goldsmith
              captures: { co_rev: $.data.revision_count }
          assert:
            - "CustomDesignOrder.${co_id}.status == DESIGN_REVIEW"
            - "CustomDesignOrder.${co_id}.revision_count == 1"

      - name: repair_ticket_forkjoin_and_qc_loop
        grounds:
          - state_machines.RepairTicket.ASSESSED_to_AWAITING_PARTS
          - state_machines.RepairTicket.ASSESSED_to_IN_REPAIR
          - state_machines.RepairTicket.QC_to_IN_REPAIR
        distinguishing_aspect: |
          RepairTicket forks at ASSESSED into {AWAITING_PARTS branch, direct IN_REPAIR branch}
          which join at IN_REPAIR, and QC failure loops QC -> IN_REPAIR — a non-linear shape on
          a different entity than the custom-order cycle.
        test_recipe:
          setup:
            - "A repair ticket needing parts is assessed (parts 8000, labor 15000), routed through AWAITING_PARTS, parts received, sent to QC, then failed QC (back in IN_REPAIR)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fay Coral", email: "fay@x.com", phone: "555-0006" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", repair_kind: "RESIZE", rush: false, promised_at: "2026-07-01T17:00:00Z" }
              as: SalesAssociate
              captures: { rt_id: $.data.id, rt_v0: $.data.version }
            - call: "POST /repair-tickets/${rt_id}/assess"
              payload: { parts_cents: 8000, labor_cents: 15000, expected_version: "${rt_v0}" }
              as: Goldsmith
              captures: { rt_v1: $.data.version }
            - call: "POST /repair-tickets/${rt_id}/order-parts"
              payload: { expected_version: "${rt_v1}" }
              as: Goldsmith
              captures: { rt_v2: $.data.version }
            - call: "POST /repair-tickets/${rt_id}/parts-received"
              payload: { expected_version: "${rt_v2}" }
              as: Goldsmith
              captures: { rt_v3: $.data.version }
            - call: "POST /repair-tickets/${rt_id}/submit-qc"
              payload: { expected_version: "${rt_v3}" }
              as: Goldsmith
              captures: { rt_v4: $.data.version }
          trigger:
            - call: "POST /repair-tickets/${rt_id}/fail-qc"
              payload: { expected_version: "${rt_v4}" }
              as: StoreManager
              captures: { rt_status: $.data.status }
          assert:
            - "RepairTicket.${rt_id}.status == IN_REPAIR"
            - "RepairTicket.${rt_id}.total_cents == 23000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: custom_cancel_to_ledger_to_customer_balance_depth3
        grounds:
          - state_machines.CustomDesignOrder.cancel
          - calculations.store_credit_balance
          - entities.CreditLedgerEntry.fields.amount_cents
          - entities.Customer.fields.store_credit_balance_cents
        distinguishing_aspect: |
          Depth-3 chain: cancel a CustomDesignOrder (A) -> the cancel posts a CreditLedgerEntry
          CREDIT (B, caused by the cancel) -> that ledger write recomputes Customer.store_credit
          _balance_cents (C, caused by B). Each link is caused by the previous, not by A directly.
        test_recipe:
          setup:
            - "A custom order is quoted (deposit_required computed) and deposit 90000 paid (DEPOSIT_PAID), customer store credit is 0."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gus Amber", email: "gus@x.com", phone: "555-0007" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", description: "Bracelet", estimated_materials_cents: 200000, design_fee_cents: 50000 }
              as: SalesAssociate
              captures: { co_id: $.data.id, co_v0: $.data.version }
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v0}" }
              as: SalesAssociate
              captures: { co_v1: $.data.version }
            - call: "POST /payments"
              payload: { target_type: "CUSTOM_ORDER", custom_order_id: "${co_id}", amount_cents: 90000 }
              as: SalesAssociate
          trigger:
            - call: "POST /custom-orders/${co_id}/cancel"
              payload: { expected_version: "${co_v1}" }
              as: StoreManager
              captures: { co_status: $.data.status }
          assert:
            - "CustomDesignOrder.${co_id}.status == CANCELLED"
            - "Customer.${cust_id}.store_credit_balance_cents == 90000"

      - name: warranty_pickup_bubbles_claim_resolved_depth2
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.RepairTicket.READY_to_PICKED_UP
          - state_machines.WarrantyClaim.APPROVED_to_RESOLVED
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger: a RepairTicket pickup (A) bubbles up to set
          its linked WarrantyClaim.status -> RESOLVED (B). Different propagation pattern
          (bubble-up) and different originating transition than the cancel->ledger->balance chain.
        test_recipe:
          setup:
            - "An item with a FINALIZED appraisal exists; a warranty claim is APPROVED (spawning a WARRANTY repair ticket), and that ticket is driven INTAKE->...->READY."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Hal Topaz", email: "hal@x.com", phone: "555-0008" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "WAR-1", title: "Watch", metal_karat: "K14", list_price_cents: 400000 }
              as: StoreManager
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /appraisals"
              payload: { inventory_item_id: "${item_id}", appraiser_name: "GIA-A", appointment_start: "2026-06-01T10:00:00Z", appointment_end: "2026-06-01T10:30:00Z", market_value_cents: 400000 }
              as: StoreManager
              captures: { apr_id: $.data.id, apr_v0: $.data.version }
            - call: "POST /appraisals/${apr_id}/finalize"
              payload: { expected_inventory_item_version: "${item_v0}" }
              as: StoreManager
            - call: "POST /warranty-claims"
              payload: { inventory_item_id: "${item_id}", customer_id: "${cust_id}", defect_description: "Loose stone" }
              as: SalesAssociate
              captures: { wc_id: $.data.id, wc_v0: $.data.version }
            - call: "POST /warranty-claims/${wc_id}/approve"
              payload: { expected_version: "${wc_v0}" }
              as: StoreManager
              captures: { spawned_rt_id: $.data.spawned_repair_ticket_id }
            - call: "GET /repair-tickets/${spawned_rt_id}"
              payload: {}
              as: Goldsmith
              captures: { rt_v0: $.data.version }
            - call: "POST /repair-tickets/${spawned_rt_id}/assess"
              payload: { parts_cents: 0, labor_cents: 0, expected_version: "${rt_v0}" }
              as: Goldsmith
              captures: { rt_v1: $.data.version }
            - call: "POST /repair-tickets/${spawned_rt_id}/start-repair"
              payload: { expected_version: "${rt_v1}" }
              as: Goldsmith
              captures: { rt_v2: $.data.version }
            - call: "POST /repair-tickets/${spawned_rt_id}/submit-qc"
              payload: { expected_version: "${rt_v2}" }
              as: Goldsmith
              captures: { rt_v3: $.data.version }
            - call: "POST /repair-tickets/${spawned_rt_id}/pass-qc"
              payload: { expected_version: "${rt_v3}" }
              as: StoreManager
              captures: { rt_v4: $.data.version }
          trigger:
            - call: "POST /repair-tickets/${spawned_rt_id}/pickup"
              payload: { expected_version: "${rt_v4}" }
              as: SalesAssociate
              captures: { rt_status: $.data.status }
          assert:
            - "RepairTicket.${spawned_rt_id}.status == PICKED_UP"
            - "WarrantyClaim.${wc_id}.status == RESOLVED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_complete_nonready_outstanding_balance
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BALANCE_OUTSTANDING]
        distinguishing_aspect: |
          Pair = state (priority 8) vs business_fiscal (priority 14): completing a QUOTED order
          (not READY, balance outstanding) violates both; the state check wins -> ERR_INVALID_STATE,
          not ERR_BALANCE_OUTSTANDING.
        test_recipe:
          setup:
            - "A custom order is QUOTED (not READY) with provisional balance outstanding (no deposit paid)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ivy Garnet", email: "ivy@x.com", phone: "555-0009" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", description: "Ring", estimated_materials_cents: 200000, design_fee_cents: 50000 }
              as: SalesAssociate
              captures: { co_id: $.data.id, co_v0: $.data.version }
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v0}" }
              as: SalesAssociate
              captures: { co_v1: $.data.version }
          trigger:
            - call: "POST /custom-orders/${co_id}/complete"
              payload: { expected_version: "${co_v1}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: role_vs_state_goldsmith_cancels_terminal_order
        grounds:
          - validations[priority=2]
          - validations[priority=8]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair = auth/role (priority 2) vs state (priority 8): a Goldsmith (not permitted) calls
          cancel on an IN_PRODUCTION order (non-cancellable state). Both would fail; the role check
          wins -> ERR_FORBIDDEN_ROLE (403), not ERR_INVALID_STATE. Different category pair than instance 1.
        test_recipe:
          setup:
            - "A custom order is driven all the way to IN_PRODUCTION (deposit paid, design approved, production started)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Jay Beryl", email: "jay@x.com", phone: "555-0010" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", description: "Necklace", estimated_materials_cents: 200000, design_fee_cents: 50000 }
              as: SalesAssociate
              captures: { co_id: $.data.id, co_v0: $.data.version }
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v0}" }
              as: SalesAssociate
              captures: { co_v1: $.data.version }
            - call: "POST /payments"
              payload: { target_type: "CUSTOM_ORDER", custom_order_id: "${co_id}", amount_cents: 90000 }
              as: SalesAssociate
            - call: "POST /custom-orders/${co_id}/start-design"
              payload: { expected_version: "${co_v1}" }
              as: Goldsmith
              captures: { co_v2: $.data.version }
            - call: "POST /custom-orders/${co_id}/submit-review"
              payload: { expected_version: "${co_v2}" }
              as: Goldsmith
              captures: { co_v3: $.data.version }
            - call: "POST /custom-orders/${co_id}/approve-design"
              payload: { line_items: [ { qty: 1, unit_price_cents: 100000, markup_pct: 0.1 } ], expected_version: "${co_v3}" }
              as: SalesAssociate
              captures: { co_v4: $.data.version }
            - call: "POST /custom-orders/${co_id}/start-production"
              payload: { expected_version: "${co_v4}" }
              as: Goldsmith
              captures: { co_v5: $.data.version }
          trigger:
            - call: "POST /custom-orders/${co_id}/cancel"
              payload: { expected_version: "${co_v5}" }
              as: Goldsmith
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: repair_rush_tier_boundary_50000_inclusive_mid
        grounds:
          - calculations.repair_total
          - entities.RepairTicket.fields.rush_surcharge_cents
          - state_machines.RepairTicket.INTAKE_to_ASSESSED
        distinguishing_aspect: |
          Subtotal exactly 50000 selects RUSH_PCT_MID (0.20) -> surcharge 10000 -> total 60000.
          50001 would select HIGH (0.30). The inclusive MID upper bound is the boundary; this
          metric/endpoint differs from the trade-in clamp boundary.
        test_recipe:
          setup:
            - "A rush repair ticket is assessed with parts 20000 + labor 30000 (subtotal exactly 50000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Kit Spinel", email: "kit@x.com", phone: "555-0011" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", repair_kind: "STONE_RESET", rush: true, promised_at: "2026-07-02T17:00:00Z" }
              as: SalesAssociate
              captures: { rt_id: $.data.id, rt_v0: $.data.version }
          trigger:
            - call: "POST /repair-tickets/${rt_id}/assess"
              payload: { parts_cents: 20000, labor_cents: 30000, expected_version: "${rt_v0}" }
              as: Goldsmith
              captures: { rt_total: $.data.total_cents }
          assert:
            - "RepairTicket.${rt_id}.rush_surcharge_cents == 10000"
            - "RepairTicket.${rt_id}.total_cents == 60000"

      - name: trade_in_min_buyback_clamp_floor
        grounds:
          - calculations.trade_in_credit
          - entities.TradeInOffer.fields.buyback_credit_cents
        distinguishing_aspect: |
          Raw credit (193) falls below MIN_BUYBACK_CENTS (2500); the max() clamp floors the
          observable buyback_credit_cents to 2500. Different metric (clamp floor on a valuation)
          and different endpoint (POST /trade-ins) than the repair tier boundary.
        test_recipe:
          setup:
            - "A customer exists; a near-worthless scrap trade-in (0.2g K14, spot 3000, no gems, FAIR) is offered."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Lou Zircon", email: "lou@x.com", phone: "555-0012" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", metal_karat: "K14", metal_weight_grams: 0.2, metal_spot_price_cents_per_gram: 3000, gemstone_value_cents: 0, condition: "FAIR" }
              as: SalesAssociate
              captures: { ti_id: $.data.id, ti_credit: $.data.buyback_credit_cents }
          assert:
            - "TradeInOffer.${ti_id}.metal_value_cents == 351"
            - "TradeInOffer.${ti_id}.buyback_credit_cents == 2500"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: layaway_activate_requires_item_in_stock
        grounds:
          - state_machines.LayawayPlan.PENDING_to_ACTIVE
          - validations[priority=9]
          - errors[ERR_ITEM_NOT_AVAILABLE]
          - entities.InventoryItem.fields.status
        distinguishing_aspect: |
          LayawayPlan -> InventoryItem dependency: activating a plan requires the item to be
          IN_STOCK; if the item was already RESERVED by another plan, activate fails ERR_ITEM_NOT_AVAILABLE.
        test_recipe:
          setup:
            - "An item priced 500000 is already RESERVED by a first ACTIVE layaway plan; a second PENDING plan exists for the same item."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mia Garnet", email: "mia@x.com", phone: "555-0013" }
              as: SalesAssociate
              captures: { cust1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Nan Beryl", email: "nan@x.com", phone: "555-0014" }
              as: SalesAssociate
              captures: { cust2: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "LAY-500", title: "Choker", metal_karat: "K18", list_price_cents: 500000 }
              as: StoreManager
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cust1}", inventory_item_id: "${item_id}", installment_count: 4 }
              as: SalesAssociate
              captures: { lp1_id: $.data.id }
            - call: "POST /layaway-plans/${lp1_id}/activate"
              payload: { expected_inventory_item_version: "${item_v0}" }
              as: SalesAssociate
              captures: { item_v1: $.data.version }
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cust2}", inventory_item_id: "${item_id}", installment_count: 4 }
              as: SalesAssociate
              captures: { lp2_id: $.data.id }
          trigger:
            - call: "POST /layaway-plans/${lp2_id}/activate"
              payload: { expected_inventory_item_version: "${item_v1}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ITEM_NOT_AVAILABLE"

      - name: tradein_accept_requires_customer_active
        grounds:
          - state_machines.TradeInOffer.OFFERED_to_ACCEPTED
          - validations[priority=9]
          - errors[ERR_CUSTOMER_SUSPENDED]
          - entities.Customer.fields.status
        distinguishing_aspect: |
          TradeInOffer -> Customer dependency (different entity pair than layaway->inventory):
          accepting an offer requires Customer.status == ACTIVE; a SUSPENDED customer's offer
          accept fails ERR_CUSTOMER_SUSPENDED.
        test_recipe:
          setup:
            - "A customer is SUSPENDED; an OFFERED trade-in for that customer exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ola Quartz", email: "ola@x.com", phone: "555-0015" }
              as: SalesAssociate
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", metal_karat: "K24", metal_weight_grams: 10.0, metal_spot_price_cents_per_gram: 7000, gemstone_value_cents: 0, condition: "EXCELLENT" }
              as: SalesAssociate
              captures: { ti_id: $.data.id, ti_v0: $.data.version }
            - call: "POST /customers/${cust_id}/suspend"
              payload: { expected_version: "${cust_v0}" }
              as: StoreManager
          trigger:
            - call: "POST /trade-ins/${ti_id}/accept"
              payload: { expected_version: "${ti_v0}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CUSTOMER_SUSPENDED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bench_window_half_open_overlap_rejected
        grounds:
          - calculations.bench_window_overlap
          - validations[priority=12.1]
          - errors[ERR_BENCH_CONFLICT]
          - entities.RepairTicket.fields.scheduled_start
        distinguishing_aspect: |
          Bench reservation uses HALF-OPEN [start,end) semantics with no buffer: a second ticket
          window [10:30,11:30) overlapping an existing [10:00,11:00) on the SAME bench is rejected,
          but an adjacent [11:00,12:00) would be allowed (adjacency != overlap).
        test_recipe:
          setup:
            - "A workbench has ticket T1 scheduled 10:00-11:00; a second ticket T2 (INTAKE) exists for the same bench."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pim Agate", email: "pim@x.com", phone: "555-0016" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /workbenches"
              payload: { label: "Bench A" }
              as: StoreManager
              captures: { bench_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", repair_kind: "POLISH", rush: false, promised_at: "2026-07-03T17:00:00Z" }
              as: SalesAssociate
              captures: { t1_id: $.data.id, t1_v0: $.data.version }
            - call: "POST /repair-tickets/${t1_id}/schedule"
              payload: { bench_id: "${bench_id}", scheduled_start: "2026-07-03T10:00:00Z", scheduled_end: "2026-07-03T11:00:00Z", expected_version: "${t1_v0}" }
              as: Goldsmith
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", repair_kind: "POLISH", rush: false, promised_at: "2026-07-03T18:00:00Z" }
              as: SalesAssociate
              captures: { t2_id: $.data.id, t2_v0: $.data.version }
          trigger:
            - call: "POST /repair-tickets/${t2_id}/schedule"
              payload: { bench_id: "${bench_id}", scheduled_start: "2026-07-03T10:30:00Z", scheduled_end: "2026-07-03T11:30:00Z", expected_version: "${t2_v0}" }
              as: Goldsmith
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BENCH_CONFLICT"

      - name: appraisal_slot_closed_plus_buffer_overlap_rejected
        grounds:
          - calculations.appraisal_slot_overlap
          - validations[priority=12.2]
          - errors[ERR_APPRAISAL_SLOT_CONFLICT]
          - entities.Appraisal.fields.appointment_start
        distinguishing_aspect: |
          Appraiser appointments use CLOSED intervals PLUS a 30-minute buffer (different interval
          semantics, different resource than the bench): a second appointment starting 11:15 only
          15 minutes after an existing 10:00-11:00 slot collides because 11:15 <= 11:00+30min buffer.
        test_recipe:
          setup:
            - "An item exists; appraiser 'GIA-B' has a DRAFT appraisal booked 10:00-11:00."
          setup_api_calls:
            - call: "POST /inventory-items"
              payload: { sku: "APR-ITEM", title: "Brooch", metal_karat: "K18", list_price_cents: 300000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /appraisals"
              payload: { inventory_item_id: "${item_id}", appraiser_name: "GIA-B", appointment_start: "2026-06-02T10:00:00Z", appointment_end: "2026-06-02T11:00:00Z", market_value_cents: 300000 }
              as: StoreManager
              captures: { apr1_id: $.data.id }
          trigger:
            - call: "POST /appraisals"
              payload: { inventory_item_id: "${item_id}", appraiser_name: "GIA-B", appointment_start: "2026-06-02T11:15:00Z", appointment_end: "2026-06-02T11:45:00Z", market_value_cents: 300000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPRAISAL_SLOT_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: store_credit_conserved_under_credit_then_debit
        grounds:
          - calculations.store_credit_balance
          - entities.Customer.fields.store_credit_balance_cents
          - entities.CreditLedgerEntry.fields.direction
          - state_machines.TradeInOffer.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Conserved quantity = store credit cents. Invariant pinned:
          Customer.store_credit_balance_cents == sum(CREDIT amount_cents) - sum(DEBIT amount_cents).
          A trade-in accept posts CREDIT 153000; a compensating DEBIT 153000 returns the balance
          to its original 0 — net unchanged.
        test_recipe:
          setup:
            - "A customer accepts a 153000-credit trade-in (balance 153000), then a DEBIT 153000 ledger entry is posted."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rae Jasper", email: "rae@x.com", phone: "555-0017" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", metal_karat: "K18", metal_weight_grams: 12.0, metal_spot_price_cents_per_gram: 6000, gemstone_value_cents: 150000, condition: "GOOD" }
              as: SalesAssociate
              captures: { ti_id: $.data.id, ti_v0: $.data.version }
            - call: "POST /trade-ins/${ti_id}/accept"
              payload: { expected_version: "${ti_v0}" }
              as: StoreManager
          trigger:
            - call: "POST /credit-ledger"
              payload: { customer_id: "${cust_id}", direction: "DEBIT", amount_cents: 153000, reason: "PURCHASE" }
              as: StoreManager
              captures: { le_id: $.data.id }
          assert:
            - "Customer.${cust_id}.store_credit_balance_cents == 0"

      - name: inventory_availability_conserved_under_reserve_then_cancel
        grounds:
          - state_machines.LayawayPlan.PENDING_to_ACTIVE
          - state_machines.LayawayPlan.ACTIVE_to_CANCELLED
          - entities.InventoryItem.fields.status
        distinguishing_aspect: |
          Conserved quantity = inventory availability (item lifecycle state), a DIFFERENT
          conserved quantity than store-credit cents. Reserving an item via layaway activate
          (IN_STOCK -> RESERVED) and then cancelling (RESERVED -> IN_STOCK) leaves the item's
          status back at IN_STOCK — the forward+compensating pair conserves availability.
        test_recipe:
          setup:
            - "An IN_STOCK item priced 500000; a layaway plan is activated (item RESERVED), then cancelled."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sid Citrine", email: "sid@x.com", phone: "555-0018" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "INV-CONS", title: "Anklet", metal_karat: "K14", list_price_cents: 500000 }
              as: StoreManager
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", installment_count: 5 }
              as: SalesAssociate
              captures: { lp_id: $.data.id, lp_v0: $.data.version }
            - call: "POST /layaway-plans/${lp_id}/activate"
              payload: { expected_inventory_item_version: "${item_v0}" }
              as: SalesAssociate
              captures: { lp_v1: $.data.version }
          trigger:
            - call: "POST /layaway-plans/${lp_id}/cancel"
              payload: { expected_version: "${lp_v1}" }
              as: StoreManager
              captures: { item_status_after: $.data.status }
          assert:
            - "InventoryItem.${item_id}.status == IN_STOCK"
            - "LayawayPlan.${lp_id}.status == CANCELLED"
