# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Custom Crush & Bonded Winery Services.
# Sections and claim_type values come from references/claim-extraction-guide.md.
# Standing user ids: FacilityAdmin "fa-carol", CellarSupervisor "cs-bob",
# ComplianceOfficer "co-alice" / "co-dave"; ClientRep's X-User-ID is the Client id.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: corner_client_creation_returns_defaults_and_version_one
        claim_type: Creation
        grounds: ["entities.Client", "endpoints.POST_/clients"]
        distinguishing_aspect: "A freshly created Client answers 201 with status ACTIVE, bond_gallons_in_bond 0, taxpaid_gallons_ytd 0, last_filed_period_end null and version 1."
        test_recipe:
          setup: ["Empty database; logical clock left at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
          trigger:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "HTTP 201 with response_type object"
            - "${st} == ACTIVE and ${ver} == 1"
            - "Client.${cl1}.bond_gallons_in_bond == 0 and taxpaid_gallons_ytd == 0"
            - "Client.${cl1}.last_filed_period_end == null"
            - "Client.${cl1}.created_at == 2026-08-01T00:00:00.000Z"
            - "${cl1} is a bare UUID with no type prefix"

      - name: corner_client_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds: ["entities.Client", "endpoints.GET_/clients/{id}"]
        distinguishing_aspect: "GET /clients/{id} returns exactly the row POST /clients stored, field for field."
        test_recipe:
          setup: ["One Client registered as Coombsville Cellars with permit BW-CA-15001."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
          trigger:
            - call: "GET /clients/${cl1}"
              as: ComplianceOfficer
              as_user_id: "co-alice"
              captures: { nm: $.data.name, pn: $.data.ttb_permit_number }
          assert:
            - "${nm} == Coombsville Cellars and ${pn} == BW-CA-15001"
            - "Client.${cl1}.contact_email == ops@coombsville.example"

      - name: corner_client_listing_paginates_with_limit_and_offset
        claim_type: Listing
        grounds: ["entities.Client", "endpoints.GET_/clients", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three stored clients, GET /clients?limit=2&offset=0 returns two rows with total_count 3 and has_more true."
        test_recipe:
          setup: ["Three registered Clients with permits BW-CA-15001, BW-CA-15002 and BW-CA-15003."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "a@x.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Pritchard Hill Partners", ttb_permit_number: "BW-CA-15002", contact_email: "b@x.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Howell Ridge Wines", ttb_permit_number: "BW-CA-15003", contact_email: "c@x.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
          trigger:
            - call: "GET /clients"
              payload: { limit: 2, offset: 0 }
              as: FacilityAdmin
              as_user_id: "fa-carol"
          assert:
            - "response_type == array and data has exactly 2 elements"
            - "total_count == 3, limit == 2, offset == 0, has_more == true"
            - "a follow-up GET /clients with limit 2 and offset 2 returns 1 element with has_more == false"

      - name: corner_client_get_with_unknown_id_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CLIENT_NOT_FOUND]", "validations[priority=10]"]
        distinguishing_aspect: "GET /clients/{id} with a well-formed but unknown UUID answers ERR_CLIENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
          trigger:
            - call: "GET /clients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLIENT_NOT_FOUND with HTTP 404"

      - name: corner_contract_creation_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]", "entities.Contract.fields.tank_gallons_entitled"]
        distinguishing_aspect: "Omitting tank_gallons_entitled from POST /contracts answers ERR_INVALID_REQUEST with HTTP 400 and stores nothing."
        test_recipe:
          setup: ["One registered Client."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /contracts with client_id ${cl1} returns data == [] with total_count == 0"

      - name: corner_dry_goods_item_defaults_on_hand_units_to_zero
        claim_type: Defaults
        grounds: ["entities.DryGoodsItem.fields.on_hand_units", "endpoints.POST_/dry-goods-items"]
        distinguishing_aspect: "Omitting initial_units leaves on_hand_units 0, reserved_units 0 and available_units 0 on the new DryGoodsItem."
        test_recipe:
          setup: ["One registered Client."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /dry-goods-items"
              payload: { client_id: "${cl1}", sku: "BTL-750-ANT", item_type: "BOTTLE", units_per_case: 12 }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { it1: $.data.id, oh: $.data.on_hand_units, av: $.data.available_units }
          assert:
            - "${oh} == 0 and ${av} == 0"
            - "DryGoodsItem.${it1}.reserved_units == 0 and version == 1"

      - name: corner_harvest_intake_net_weight_computed_client_value_input_ignored
        claim_type: Computed Fields
        grounds: ["entities.HarvestIntake.fields.net_weight_lbs", "calculations.intake_yield"]
        distinguishing_aspect: "net_weight_lbs is always gross minus tare (38000) — a client-supplied net_weight_lbs of 99999 is ignored, not stored."
        test_recipe:
          setup: ["One ACTIVE Contract for Coombsville Cellars."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
          trigger:
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-1001", varietal: "CABERNET_SAUVIGNON", appellation: "OAKVILLE", block_code: "B12", gross_weight_lbs: 42000, tare_weight_lbs: 4000, net_weight_lbs: 99999, estimated_gallons: 5000, status: "ACCEPTED" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { in1: $.data.id, nw: $.data.net_weight_lbs, st: $.data.status }
          assert:
            - "${nw} == 38000 (the client-supplied 99999 is ignored)"
            - "${st} == WEIGHED (the client-supplied ACCEPTED is ignored)"
            - "HarvestIntake.${in1}.estimated_gallons == 0 before ACCEPT (the client-supplied 5000 is ignored)"
            - "HarvestIntake.${in1}.brix == null and ph == null"

      - name: corner_vessel_rejects_undeclared_enum_value_invalid_enum
        claim_type: Type Constraints
        grounds: ["entities.Vessel.fields.vessel_type", "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "vessel_type AMPHORA is not a declared member of {TANK, BARREL} and must answer ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
          trigger:
            - call: "POST /vessels"
              payload: { vessel_code: "AMP-01", vessel_type: "AMPHORA", capacity_gallons: 250, facility_zone: "ZONE_A" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /vessels returns data == [] with total_count == 0"

      - name: corner_contract_creation_with_unknown_client_id_not_found
        claim_type: Parent Relationships
        grounds: ["validations[priority=15]", "errors[ERR_CLIENT_NOT_FOUND]", "entities.Contract.fields.client_id"]
        distinguishing_aspect: "A body FK that names no stored Client answers ERR_CLIENT_NOT_FOUND with HTTP 404, not ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
          trigger:
            - call: "POST /contracts"
              payload: { client_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLIENT_NOT_FOUND with HTTP 404"

      - name: corner_dry_goods_items_filtered_by_owning_client
        claim_type: Creation
        grounds: ["entities.DryGoodsItem.fields.client_id", "endpoints.GET_/dry-goods-items"]
        distinguishing_aspect: "GET /dry-goods-items?client_id={A} returns only client A's two SKUs and never client B's, proving flat FK partitioning."
        test_recipe:
          setup: ["Two registered Clients; client A owns two DryGoodsItems (a BOTTLE and a CORK SKU), client B owns one BOTTLE SKU."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "a@x.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { clA: $.data.id }
            - call: "POST /clients"
              payload: { name: "Pritchard Hill Partners", ttb_permit_number: "BW-CA-15002", contact_email: "b@x.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { clB: $.data.id }
            - call: "POST /dry-goods-items"
              payload: { client_id: "${clA}", sku: "BTL-750-ANT", item_type: "BOTTLE", units_per_case: 12, initial_units: 1000 }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { itA1: $.data.id }
            - call: "POST /dry-goods-items"
              payload: { client_id: "${clA}", sku: "CRK-44MM", item_type: "CORK", units_per_case: 1000, initial_units: 1000 }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { itA2: $.data.id }
            - call: "POST /dry-goods-items"
              payload: { client_id: "${clB}", sku: "BTL-750-BDX", item_type: "BOTTLE", units_per_case: 12, initial_units: 500 }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { itB1: $.data.id }
          trigger:
            - call: "GET /dry-goods-items"
              payload: { client_id: "${clA}" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
          assert:
            - "data contains exactly ${itA1} and ${itA2} with total_count == 2"
            - "${itB1} does not appear in the result"
            - "a follow-up GET /dry-goods-items with client_id ${clA} and item_type CORK returns exactly ${itA2}"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: corner_lot_initial_state_is_juice_and_in_bond
        claim_type: Initial State
        grounds: ["entities.Lot.fields.production_status", "entities.Lot.fields.bond_status", "entities.Lot.fields.origin", "calculations.lot_composition"]
        distinguishing_aspect: "A newly created Lot starts on both axes at once — production_status JUICE and bond_status IN_BOND — with aging_start_at null and cases_bottled 0."
        test_recipe:
          setup: ["One ACTIVE Contract with one ACCEPTED 19.0-ton load at 23.50 Brix."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-1001", varietal: "CABERNET_SAUVIGNON", appellation: "OAKVILLE", block_code: "B12", gross_weight_lbs: 42000, tare_weight_lbs: 4000 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { in1: $.data.id }
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "SAMPLE", brix: 23.50, ph: 3.62 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "ACCEPT" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
          trigger:
            - call: "POST /lots"
              payload: { contract_id: "${ct1}", lot_code: "CS-OAK-26-01", vintage_year: 2026, intake_ids: ["${in1}"] }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { lot1: $.data.id, ps: $.data.production_status, bs: $.data.bond_status, og: $.data.origin }
          assert:
            - "${ps} == JUICE and ${bs} == IN_BOND and ${og} == INTAKE"
            - "Lot.${lot1}.aging_start_at == null, aging_days == 0, cases_bottled == 0, loss_gallons == 0"
            - "Lot.${lot1}.volume_gallons == 3135.00 and brix_at_crush == 23.50"
            - "Lot.${lot1}.source_intake_ids == [${in1}] and component_manifest == []"
            - "HarvestIntake.${in1}.status == ASSIGNED and lot_id == ${lot1}"
            - "Client.${cl1}.bond_gallons_in_bond == 3135.00"

      - name: corner_contract_activate_from_draft_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.Contract.DRAFT_to_PENDING_SIGNATURE", "validations[priority=30]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACTIVATE is declared only from PENDING_SIGNATURE, so sending it against a DRAFT contract answers ERR_INVALID_STATE with HTTP 409 and leaves the contract in DRAFT."
        test_recipe:
          setup: ["One Contract still in DRAFT (never submitted)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
          trigger:
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE with HTTP 409"
            - "Contract.${ct1}.status == DRAFT and version == 1"

      - name: corner_contract_revision_loop_returns_to_draft
        claim_type: cyclic
        grounds: ["state_machines.Contract.PENDING_SIGNATURE_to_DRAFT", "state_machines.Contract.DRAFT_to_PENDING_SIGNATURE"]
        distinguishing_aspect: "SUBMIT then REVISE returns the contract to DRAFT with version 3, and a second SUBMIT moves it back to PENDING_SIGNATURE — the loop is traversable more than once."
        test_recipe:
          setup: ["One Contract in DRAFT."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
          trigger:
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { s1: $.data.status }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "REVISE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { s2: $.data.status, v2: $.data.version }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { s3: $.data.status, v3: $.data.version }
          assert:
            - "${s1} == PENDING_SIGNATURE"
            - "${s2} == DRAFT and ${v2} == 3"
            - "${s3} == PENDING_SIGNATURE and ${v3} == 4"

      - name: corner_intake_reject_straight_from_weighed
        claim_type: Valid Transition
        grounds: ["state_machines.HarvestIntake.WEIGHED_to_REJECTED", "entities.HarvestIntake.fields.rejection_reason"]
        distinguishing_aspect: "REJECT is declared from WEIGHED as well as from SAMPLED, so a load can be turned away before the lab samples it, leaving Contract.tons_received at 0.0000."
        test_recipe:
          setup: ["One ACTIVE Contract with one WEIGHED load that has not been sampled."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /harvest-intakes"
