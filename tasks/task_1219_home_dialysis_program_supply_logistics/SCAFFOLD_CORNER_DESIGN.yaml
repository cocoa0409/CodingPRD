# =============================================================================
# Task 1219 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per claim-extraction-guide; §1.8-covered corners
# appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ============================================================== ENTITIES
  - section: entities
    instances:
      - name: program_creation_stores_config_and_catalog
        claim_type: creation
        grounds: [entities.DialysisProgram, "endpoints[POST /api/dialysis-programs]"]
        distinguishing_aspect: "POST with all five config fields returns 201 with the stored catalog, version == 1, and server-minted id/created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 4, max_missed_log_streak: 2, waste_ratio_alert_threshold: 0.2, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id, ver: $.data.version } }
          assert:
            - "response contains id, created_at, version == 1"
            - "stored review_cadence_treatments == 4, max_missed_log_streak == 2, waste_ratio_alert_threshold == 0.2"
            - "supply_catalog echoed with sku DIALYSATE_2L and unit_price_cents 1200"

      - name: program_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.DialysisProgram.fields.waste_ratio_alert_threshold, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting waste_ratio_alert_threshold (no default) is rejected with ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 4, max_missed_log_streak: 2, supply_catalog: [] }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: patient_creation_applies_defaults_and_initial_state
        claim_type: defaults
        grounds: [entities.Patient.fields.program_status, entities.Patient.fields.posture, state_machines.Patient]
        distinguishing_aspect: "A freshly enrolled patient starts in TRAINING with posture NOT_READY, storage_cap_units 0, on_hand_units 0, ever_home_ready false — with no assessment/machine/plan."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id, status: $.data.program_status, posture: $.data.posture } }
          assert:
            - "program_status == TRAINING (initial state)"
            - "posture == NOT_READY, storage_cap_units == 0, on_hand_units == 0, ever_home_ready == false, missed_log_streak == 0, no_show_count == 0"

      - name: patient_computed_posture_input_ignored
        claim_type: computed_fields
        grounds: [entities.Patient.fields.posture]
        distinguishing_aspect: "Client-supplied posture in the create payload is ignored; the server-computed NOT_READY is returned."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6, posture: "HOME_READY" }, as: HomeNurse, as_user_id: "nurse-1", captures: { posture: $.data.posture } }
          assert:
            - "posture == NOT_READY (server-computed; client input ignored)"

      - name: patient_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 with the error envelope (response_type error, data.error_id, data.message)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/patients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "http 404 and data.error_id == ERR_NOT_FOUND and data.message non-empty and response_type == error"

      - name: fk_reverse_lists_return_children
        claim_type: listing
        grounds: ["endpoints[GET /api/patients/{id}/training-attempts]", entities.TrainingAttempt.fields.patient_id]
        distinguishing_aspect: "The parent's sub-resource list returns exactly the children created (2 attempts), ordered created_at ASC, with pagination fields present."
        test_recipe:
          setup: ["program + patient + 2 attempts"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: MACHINE_OPERATION, score_pct: 88 }, as: HomeNurse, as_user_id: "nurse-1" }
          trigger:
            - { call: "GET /api/patients/${pat}/training-attempts", as: ProgramAdmin, captures: { first_module: "$.data[0].module_code", second_module: "$.data[1].module_code" } }
          assert:
            - "exactly 2 rows (data[0], data[1] present, data[2] absent); first row module_code == WATER_HANDLING, second == MACHINE_OPERATION (created_at ASC)"
            - "pagination fields total_count == 2, has_more == false, limit == 10, offset == 0 present"

      - name: duplicate_serial_number_returns_conflict
        claim_type: type_constraints
        grounds: [entities.DialysisMachine.fields.serial_number, "errors[ERR_SERIAL_NUMBER_EXISTS]"]
        distinguishing_aspect: "Second machine with the same serial in the same program is rejected 409; the same serial in a DIFFERENT program is accepted."
        test_recipe:
          setup: ["two programs; machine SN-DUP in program 1"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z1", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog1: $.data.id } }
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z2", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog2: $.data.id } }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog1}", serial_number: "SN-DUP", model: "HomeX" }, as: BiomedTechnician }
          trigger:
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog1}", serial_number: "SN-DUP", model: "HomeX" }, as: BiomedTechnician, captures: { err: $.data.error_id } }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog2}", serial_number: "SN-DUP", model: "HomeX" }, as: BiomedTechnician, captures: { mach2: $.data.id } }
          assert:
            - "same-program duplicate: error_id == ERR_SERIAL_NUMBER_EXISTS"
            - "other-program same serial: created successfully (uniqueness is program-scoped)"

  # ============================================================== STATE MACHINES
  - section: state_machines
    instances:
      - name: training_attempt_lifecycle_battery
        claim_type: invalid_transition
        grounds: [state_machines.TrainingAttempt.RECORDED_to_SIGNED_OFF, entities.TrainingAttempt.fields.is_passing, "errors[ERR_SOD_SIGNOFF_BY_TRAINER]", "errors[ERR_ATTEMPT_NOT_PASSING]", "errors[ERR_ATTEMPT_NOT_RECORDED]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Score boundary 79/80 drives is_passing; failing attempts and same-nurse sign-off are rejected; a second sign-off is an invalid transition; an unknown module_code is a 400."
        test_recipe:
          setup: ["program + patient"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
          trigger:
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 79 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att_fail: $.data.id, passing_fail: $.data.is_passing } }
            - { call: "POST /api/training-attempts/${att_fail}/sign-off", as: HomeNurse, as_user_id: "nurse-2", captures: { err1: $.data.error_id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 80 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att_ok: $.data.id, passing_ok: $.data.is_passing } }
            - { call: "POST /api/training-attempts/${att_ok}/sign-off", as: HomeNurse, as_user_id: "nurse-1", captures: { err2: $.data.error_id } }
            - { call: "POST /api/training-attempts/${att_ok}/sign-off", as: HomeNurse, as_user_id: "nurse-2", captures: { status_ok: $.data.status } }
            - { call: "POST /api/training-attempts/${att_ok}/sign-off", as: HomeNurse, as_user_id: "nurse-2", captures: { err3: $.data.error_id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_SAFETY, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { err4: $.data.error_id } }
          assert:
            - "score 79 -> is_passing == false; score 80 -> is_passing == true (MODULE_PASS_PCT boundary is >=)"
            - "sign-off of failing attempt: err1 == ERR_ATTEMPT_NOT_PASSING"
            - "sign-off by the trainer: err2 == ERR_SOD_SIGNOFF_BY_TRAINER (segregation of duties)"
            - "cross-nurse sign-off: status == SIGNED_OFF with signed_off_by_user_id == nurse-2"
            - "repeat sign-off: err3 == ERR_ATTEMPT_NOT_RECORDED (terminal lockdown)"
            - "unknown module_code WATER_SAFETY: err4 == ERR_INVALID_REQUEST"

      - name: work_order_invalid_transitions_probe
        claim_type: invalid_transition
        grounds: [state_machines.HomeModificationWorkOrder, "errors[ERR_WORK_ORDER_INVALID_STATE]"]
        distinguishing_aspect: "complete from REQUESTED and cancel from COMPLETED are both rejected; the REQUESTED -> CANCELLED path succeeds."
        test_recipe:
          setup: ["program + patient + REMEDIATION_REQUIRED assessment + one work order"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.2, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/home-assessments/${asmt}/require-remediation", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-modification-work-orders", payload: { patient_id: "${pat}", assessment_id: "${asmt}", work_type: ELECTRICAL, cost_estimate_cents: 180000 }, as: HomeNurse, as_user_id: "nurse-1", captures: { wo: $.data.id } }
          trigger:
            - { call: "POST /api/home-modification-work-orders/${wo}/complete", payload: { final_cost_cents: 180000 }, as: BiomedTechnician, captures: { err1: $.data.error_id } }
            - { call: "POST /api/home-modification-work-orders/${wo}/cancel", as: HomeNurse, as_user_id: "nurse-1", captures: { st: $.data.status } }
            - { call: "POST /api/home-modification-work-orders/${wo}/approve", payload: { scheduled_window_start: "2026-05-05T08:00:00Z", scheduled_window_end: "2026-05-05T16:00:00Z" }, as: ProgramAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "complete from REQUESTED: err1 == ERR_WORK_ORDER_INVALID_STATE"
            - "cancel from REQUESTED: status == CANCELLED"
            - "approve from CANCELLED: err2 == ERR_WORK_ORDER_INVALID_STATE (terminal lockdown)"

      - name: assessment_review_battery
        claim_type: precondition_enforcement
        grounds: [state_machines.HomeAssessment, "errors[ERR_ASSESSMENT_RESULT_FAIL]", "errors[ERR_WORK_ORDERS_OUTSTANDING]", "errors[ERR_SOD_ASSESSOR_SELF_ACCEPT]", "errors[ERR_ASSESSMENT_INVALID_STATE]", calculations.home_assessment_evaluation]
        distinguishing_aspect: "Chloramine 0.1 passes (<=) and 0.11 fails; FAIL cannot be accepted; resubmit is gated on work-order settlement; resubmission refreshes the assessor so the resubmitter cannot accept (SoD)."
        test_recipe:
          setup: ["program + patient"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
          trigger:
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.1, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 30 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a_pass: $.data.id, r_pass: $.data.result } }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.11, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 30 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a_fail: $.data.id, r_fail: $.data.result } }
            - { call: "POST /api/home-assessments/${a_fail}/accept", as: HomeNurse, as_user_id: "nurse-2", captures: { err1: $.data.error_id } }
            - { call: "POST /api/home-assessments/${a_fail}/require-remediation", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-modification-work-orders", payload: { patient_id: "${pat}", assessment_id: "${a_fail}", work_type: PLUMBING, cost_estimate_cents: 90000 }, as: HomeNurse, as_user_id: "nurse-1", captures: { wo: $.data.id } }
            - { call: "POST /api/home-assessments/${a_fail}/resubmit", payload: { water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 30 }, as: HomeNurse, as_user_id: "nurse-1", captures: { err2: $.data.error_id } }
            - { call: "POST /api/home-modification-work-orders/${wo}/cancel", as: ProgramAdmin }
            - { call: "POST /api/home-assessments/${a_fail}/resubmit", payload: { water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 30 }, as: HomeNurse, as_user_id: "nurse-1", captures: { st2: $.data.status, r2: $.data.result } }
            - { call: "POST /api/home-assessments/${a_fail}/resubmit", payload: { water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 30 }, as: HomeNurse, as_user_id: "nurse-1", captures: { err3: $.data.error_id } }
            - { call: "POST /api/home-assessments/${a_fail}/accept", as: HomeNurse, as_user_id: "nurse-1", captures: { err4: $.data.error_id } }
            - { call: "POST /api/home-assessments/${a_fail}/accept", as: HomeNurse, as_user_id: "nurse-2", captures: { st3: $.data.status } }
          assert:
            - "chloramine exactly 0.1 -> result PASS; 0.11 -> result FAIL (<= boundary)"
            - "accept of FAIL assessment: err1 == ERR_ASSESSMENT_RESULT_FAIL"
            - "resubmit with outstanding work order: err2 == ERR_WORK_ORDERS_OUTSTANDING"
            - "after cancelling the work order, resubmit succeeds: status SUBMITTED, result PASS"
            - "double resubmit from SUBMITTED: err3 == ERR_ASSESSMENT_INVALID_STATE"
            - "accept by the (re)assessor nurse-1: err4 == ERR_SOD_ASSESSOR_SELF_ACCEPT; accept by nurse-2: ACCEPTED"

      - name: order_draft_superseded_by_new_create
        claim_type: side_effect_execution
        grounds: [state_machines.SupplyOrder.DRAFT_to_SUPERSEDED, "endpoints[POST /api/supply-orders]"]
        distinguishing_aspect: "Creating a second DRAFT for the same patient+month flips the first to SUPERSEDED; the first can no longer be submitted."
        test_recipe:
          setup: ["program + TRAINING patient (create does not gate on posture)"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 5 } ], expected_patient_version: "${pv1}" }, as: Patient, as_user_id: "${pat}", captures: { ord1: $.data.id } }
          trigger:
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 8 } ], expected_patient_version: "${pv2}" }, as: Patient, as_user_id: "${pat}", captures: { ord2: $.data.id } }
            - { call: "GET /api/supply-orders/${ord1}", as: ProgramAdmin, captures: { st1: $.data.order_status } }
            - { call: "POST /api/supply-orders/${ord1}/submit", as: Patient, as_user_id: "${pat}", captures: { err: $.data.error_id } }
          assert:
            - "SupplyOrder.${ord1}.order_status == SUPERSEDED after the second create"
            - "submit of the superseded order: error_id == ERR_ORDER_INVALID_STATE"
            - "SupplyOrder.${ord2}.order_status == DRAFT with provisional_total_units == 8"
      - name: machine_assignment_maintenance_and_plan_battery
        claim_type: invalid_transition
        grounds: [state_machines.DialysisMachine, state_machines.MaintenanceEvent, state_machines.EmergencyBackupPlan, "concurrency_rules[machine-assign-stale-machine]", "errors[ERR_MACHINE_INVALID_STATE]", "errors[ERR_MACHINE_BUSY_MAINTENANCE]", "errors[ERR_EVENT_INVALID_STATE]", "errors[ERR_EVENT_WINDOW_PASSED]", "errors[ERR_STALE_VERSION]", "errors[ERR_BACKUP_MACHINE_REQUIRED]", "errors[ERR_BACKUP_MACHINE_NOT_IN_STOCK]", "errors[ERR_MACHINE_REFERENCED_BY_PLAN]", "errors[ERR_PLAN_NOT_ACTIVE]"]
        distinguishing_aspect: "Machine lifecycle probes (unassign/decommission from wrong states), one-IN_PROGRESS-per-machine, cancel-from-IN_PROGRESS, window-passed start, OCC stale-version on reassignment, and backup-plan machine reference gating decommission."
        test_recipe:
          setup: ["program; machines M1 (IN_STOCK) and M2 (IN_STOCK); TRAINING patients P1 and P2 (assign only requires not-TRANSITIONED_OUT)"]
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat A", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { p1: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat B", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { p2: $.data.id } }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-M1", model: "HomeX" }, as: BiomedTechnician, captures: { m1: $.data.id } }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-M2", model: "HomeX" }, as: BiomedTechnician, captures: { m2: $.data.id } }
          trigger:
            - { call: "POST /api/dialysis-machines/${m1}/unassign", as: BiomedTechnician, captures: { e1: $.data.error_id } }
            - { call: "GET /api/dialysis-machines/${m1}", as: ProgramAdmin, captures: { m1v: $.data.version } }
