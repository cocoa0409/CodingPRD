        captures: {c_status: $.data.status, c_damages: $.data.assessed_damages_cents, c_rebate: $.data.rebate_paid_cents,
          c_recv: $.data.receivable_total_cents}
      - call: GET /group-sales/room-blocks/${master_block_id}
