scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: contract_fee_earned_percent_vs_hourly_diverges_on_identical_data
        grounds:
          - calculations.contract_fee_earned
          - entities.Contract.fields.fee_basis
          - entities.Contract.fields.earned_to_date_cents
          - entities.Contract.fields.not_to_exceed_cents
        distinguishing_aspect: |
          This dual variant lives on the Contract money domain: two projects fed the identical
          phase-completion state (SD COMPLETED at 100%) and the identical APPROVED TimeEntry
          (10.0 h at 12000 cents/h) yield earned_to_date_cents == 2000000 under
          PERCENT_OF_CONSTRUCTION and earned_to_date_cents == 120000 under HOURLY, because the
          PERCENT branch reads only Phase.percent_complete and the HOURLY branch reads only
          APPROVED TimeEntry.billable_cents capped at not_to_exceed_cents.
        test_recipe:
          setup:
            - "Two projects P_PCT and P_HR, each with a PM and an architect, each with 4 phases weighted 2000/2000/4000/2000, each with its SD phase COMPLETED, and each with one identical APPROVED TimeEntry of 10.0 hours logged by the architect."
            - "P_PCT's contract is PERCENT_OF_CONSTRUCTION (construction 100000000 cents at 1000 bp -> base_fee 10000000); P_HR's contract is HOURLY with not_to_exceed_cents 2000000."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Avery Architect", title: "ARCHITECT", billing_rate_cents_per_hour: 12000, cost_rate_cents_per_hour: 5000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { arch_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "PCT-001", name: "Percent Tower", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj_pct: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj_pct}", fee_basis: "PERCENT_OF_CONSTRUCTION", review_clock_basis: "CALENDAR_DAYS", construction_cost_estimate_cents: 100000000, fee_rate_bp: 1000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct_pct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj_pct}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD set", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd_pct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj_pct}", phase_code: "DD", weight_bp: 2000, milestone_name: "DD set", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj_pct}", phase_code: "CD", weight_bp: 4000, milestone_name: "CD set", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj_pct}", phase_code: "CA", weight_bp: 2000, milestone_name: "Substantial completion", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /contracts/${ct_pct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /phases/${sd_pct}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${sd_pct}/state"
              payload: { to_status: "COMPLETED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /time-entries"
              payload: { phase_id: "${sd_pct}", staff_member_id: "${arch_id}", start_utc: "2026-05-04T08:00:00Z", end_utc: "2026-05-04T18:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { te_pct: $.data.id }
            - call: "POST /time-entries/${te_pct}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /time-entries/${te_pct}/state"
              payload: { to_status: "APPROVED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects"
              payload: { project_number: "HR-001", name: "Hourly Loft", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj_hr: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj_hr}", fee_basis: "HOURLY", review_clock_basis: "CALENDAR_DAYS", not_to_exceed_cents: 2000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct_hr: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj_hr}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD set", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd_hr: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj_hr}", phase_code: "DD", weight_bp: 2000, milestone_name: "DD set", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj_hr}", phase_code: "CD", weight_bp: 4000, milestone_name: "CD set", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj_hr}", phase_code: "CA", weight_bp: 2000, milestone_name: "Substantial completion", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /contracts/${ct_hr}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /phases/${sd_hr}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${sd_hr}/state"
              payload: { to_status: "COMPLETED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /time-entries"
              payload: { phase_id: "${sd_hr}", staff_member_id: "${arch_id}", start_utc: "2026-05-05T08:00:00Z", end_utc: "2026-05-05T18:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { te_hr: $.data.id }
            - call: "POST /time-entries/${te_hr}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /time-entries/${te_hr}/state"
              payload: { to_status: "APPROVED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "GET /contracts/${ct_pct}"
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { earned_pct: $.data.earned_to_date_cents }
            - call: "GET /contracts/${ct_hr}"
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { earned_hr: $.data.earned_to_date_cents }
          assert:
            - "Contract.${ct_pct}.base_fee_cents == 10000000"
            - "Contract.${ct_pct}.earned_to_date_cents == 2000000"
            - "Contract.${ct_hr}.base_fee_cents == 2000000"
            - "Contract.${ct_hr}.earned_to_date_cents == 120000"
            - "TimeEntry.${te_pct}.hours == 10.0 and TimeEntry.${te_pct}.billable_cents == 120000"
            - "TimeEntry.${te_hr}.hours == 10.0 and TimeEntry.${te_hr}.billable_cents == 120000"
            - "Contract.${ct_pct}.earned_to_date_cents != Contract.${ct_hr}.earned_to_date_cents"

      - name: submittal_review_due_calendar_vs_business_days_diverges
        grounds:
          - calculations.submittal_review_due
          - entities.Contract.fields.review_clock_basis
          - entities.Submittal.fields.review_due_at
          - state_machines.Submittal.RECEIVED_to_UNDER_REVIEW
        distinguishing_aspect: |
          This dual variant lives on the Submittal schedule domain (not the money domain):
          the same review start instant 2026-06-01T09:00:00Z and the same 14-day period yield
          review_due_at == 2026-06-15T09:00:00Z under CALENDAR_DAYS and
          review_due_at == 2026-06-19T09:00:00Z under BUSINESS_DAYS, a 4-day divergence caused
          solely by skipping the two intervening weekends.
        test_recipe:
          setup:
            - "One consultant firm with concurrent_review_capacity 2 (so two overlapping reviews are both admissible)."
            - "Two executed projects: P_CAL whose contract has review_clock_basis CALENDAR_DAYS, and P_BUS whose contract has review_clock_basis BUSINESS_DAYS; both with submittal_review_period_days 14."
            - "One RECEIVED submittal on each project from the same firm. The logical clock is at 2026-06-01T09:00:00Z (a Monday)."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /consultants"
              payload: { name: "Beam & Bolt", discipline: "STRUCTURAL", concurrent_review_capacity: 2 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { firm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "CAL-001", name: "Calendar Court", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj_cal: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj_cal}", fee_basis: "PERCENT_OF_CONSTRUCTION", review_clock_basis: "CALENDAR_DAYS", construction_cost_estimate_cents: 100000000, fee_rate_bp: 1000, submittal_review_period_days: 14 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct_cal: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj_cal}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj_cal}", phase_code: "DD", weight_bp: 2000, milestone_name: "DD", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj_cal}", phase_code: "CD", weight_bp: 4000, milestone_name: "CD", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj_cal}", phase_code: "CA", weight_bp: 2000, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /contracts/${ct_cal}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /projects"
              payload: { project_number: "BUS-001", name: "Business Barn", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj_bus: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj_bus}", fee_basis: "PERCENT_OF_CONSTRUCTION", review_clock_basis: "BUSINESS_DAYS", construction_cost_estimate_cents: 100000000, fee_rate_bp: 1000, submittal_review_period_days: 14 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct_bus: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj_bus}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj_bus}", phase_code: "DD", weight_bp: 2000, milestone_name: "DD", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj_bus}", phase_code: "CD", weight_bp: 4000, milestone_name: "CD", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj_bus}", phase_code: "CA", weight_bp: 2000, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /contracts/${ct_bus}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /submittals"
              payload: { project_id: "${proj_cal}", consultant_firm_id: "${firm_id}", spec_section: "05 12 00" }
              as: ConsultantRep
              as_user_id: "${firm_id}"
              captures: { sub_cal: $.data.id }
            - call: "POST /submittals"
              payload: { project_id: "${proj_bus}", consultant_firm_id: "${firm_id}", spec_section: "05 12 00" }
              as: ConsultantRep
              as_user_id: "${firm_id}"
              captures: { sub_bus: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
          trigger:
            - call: "POST /submittals/${sub_cal}/state"
              payload: { to_status: "UNDER_REVIEW" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { due_cal: $.data.review_due_at }
            - call: "POST /submittals/${sub_bus}/state"
              payload: { to_status: "UNDER_REVIEW" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { due_bus: $.data.review_due_at }
          assert:
            - "Submittal.${sub_cal}.review_started_at == 2026-06-01T09:00:00Z"
            - "Submittal.${sub_cal}.review_due_at == 2026-06-15T09:00:00Z"
            - "Submittal.${sub_bus}.review_started_at == 2026-06-01T09:00:00Z"
            - "Submittal.${sub_bus}.review_due_at == 2026-06-19T09:00:00Z"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: phase_fee_allocation_rounds_per_phase_then_last_phase_absorbs_remainder
        grounds:
          - calculations.phase_fee_allocation
          - entities.Phase.fields.fee_allocation_cents
          - entities.Phase.fields.phase_order
          - entities.Contract.fields.total_fee_cents
          - state_machines.Contract.DRAFT_to_EXECUTED
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the cent total. With
          total_fee_cents 10802469 and weights 1667/1667/3333/3333, rounding each phase and
          letting CA (highest phase_order) absorb the remainder yields
          1800772 + 1800772 + 3600463 + 3600462 == 10802469, whereas the rejected
          "round every phase independently" order yields 3600463 for CA and a 10802470 total
          that overshoots the contract fee by one cent.
        test_recipe:
          setup:
            - "A project whose contract is PERCENT_OF_CONSTRUCTION with construction_cost_estimate_cents 123456789 at 875 bp, giving base_fee_cents 10802469."
            - "Its four phases carry weight_bp 1667 (SD), 1667 (DD), 3333 (CD), 3333 (CA), summing to exactly 10000."
            - "The contract has not yet been executed, so no allocation has run."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "RND-001", name: "Rounding House", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj}", fee_basis: "PERCENT_OF_CONSTRUCTION", review_clock_basis: "CALENDAR_DAYS", construction_cost_estimate_cents: 123456789, fee_rate_bp: 875 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 1667, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "DD", weight_bp: 1667, milestone_name: "DD", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { dd: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CD", weight_bp: 3333, milestone_name: "CD", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { cd: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CA", weight_bp: 3333, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { total_fee: $.data.total_fee_cents }
          assert:
            - "Contract.${ct}.base_fee_cents == 10802469"
            - "Contract.${ct}.total_fee_cents == 10802469"
            - "Phase.${sd}.fee_allocation_cents == 1800772"
            - "Phase.${dd}.fee_allocation_cents == 1800772"
            - "Phase.${cd}.fee_allocation_cents == 3600463"
            - "Phase.${ca}.fee_allocation_cents == 3600462"
            - "Phase.${sd}.fee_allocation_cents + Phase.${dd}.fee_allocation_cents + Phase.${cd}.fee_allocation_cents + Phase.${ca}.fee_allocation_cents == 10802469"

      - name: invoice_retainage_tier_keyed_on_cumulative_fee_after_this_invoice
        grounds:
          - calculations.invoice_totals
          - entities.Invoice.fields.retainage_bp
          - entities.Invoice.fields.net_due_cents
          - entities.Contract.fields.billed_fee_to_date_cents
          - concurrency_rules[invoice-create-stale-contract]
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency pinned to one evaluation order:
          net_due_cents needs retainage_cents, retainage_cents needs the retainage tier, and the
          tier is keyed on cumulative_after_cents which already includes this invoice's own
          fee_billed_cents. With total_fee_cents 10000000 and fee_billed_cents 5000000 the ratio
          lands on exactly 5000 bp, selecting RETAINAGE_TIER_1_BP (1000) rather than tier 2, so
          gross 5000000 -> retainage 500000 -> net_due 4500000.
        test_recipe:
          setup:
            - "An executed PERCENT_OF_CONSTRUCTION contract with base_fee_cents 10000000 (construction 100000000 at 1000 bp) and phase weights 2000/4000/2000/2000, giving allocations SD 2000000, DD 4000000, CD 2000000, CA 2000000."
            - "SD is COMPLETED (percent_complete 100, earned 2000000). DD is ACTIVE at percent_complete 75 (earned 3000000). No expenses exist, so reimbursable_cents will be 0."
            - "No invoice has been issued yet, so Contract.billed_fee_to_date_cents == 0."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "RET-001", name: "Retainage Row", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj}", fee_basis: "PERCENT_OF_CONSTRUCTION", review_clock_basis: "CALENDAR_DAYS", construction_cost_estimate_cents: 100000000, fee_rate_bp: 1000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "DD", weight_bp: 4000, milestone_name: "DD", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { dd: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CD", weight_bp: 2000, milestone_name: "CD", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CA", weight_bp: 2000, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /phases/${sd}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${sd}/state"
              payload: { to_status: "COMPLETED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases/${dd}/state"
              payload: { to_status: "ACTIVE" }
              as: ProjectManager
