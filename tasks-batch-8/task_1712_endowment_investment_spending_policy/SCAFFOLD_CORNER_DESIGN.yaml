            - { call: "POST /endowment/managers", payload: { pool_id: "${dg_pool}", manager_name: "M US", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { dg_us: $.data.id } }
