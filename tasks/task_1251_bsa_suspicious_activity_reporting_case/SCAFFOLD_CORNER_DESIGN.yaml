  - section: complexity_layers
    instances:
      - name: threshold_propose_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[threshold-propose-stale-scenario]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on MonitoringScenario.version: a proposal carrying the pre-first-proposal version (1) after a successful proposal bumped it to 2 is rejected 412 ERR_STALE_VERSION, while a proposal carrying the fresh version succeeds."
        test_recipe:
          setup: ["Scenario sc1 created (version 1); one threshold proposal already accepted (scenario version now 2)"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "GET /monitoring-scenarios/${sc1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { sc1_v2: $.data.version } }
          trigger:
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 950000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.55, weight_velocity: 0.3, weight_geo: 0.15, effective_from: "2026-06-01T00:00:00Z", tuning_rationale: "Stale-view retune attempt", backtest_precision: 0.72, backtest_recall: 0.61 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v2}", threshold_amount_cents: 950000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.55, weight_velocity: 0.3, weight_geo: 0.15, effective_from: "2026-06-01T00:00:00Z", tuning_rationale: "Fresh-view retune", backtest_precision: 0.72, backtest_recall: 0.61 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th2: $.data.id } }
          assert:
            - "Stale proposal: 412 ERR_STALE_VERSION (scenario version moved 1 -> 2 after the first proposal)"
            - "Fresh proposal: 201; ScenarioThreshold.${th2}.status == PROPOSED and version_number == 2"

      - name: narrative_update_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[narrative-update-stale-sar]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on SARReport.version via a DIFFERENT write endpoint (PUT narrative): two sequential edits — the first succeeds (v1 -> v2), the second replaying v1 is rejected 412, and the rejected edit leaves the stored narrative untouched."
        test_recipe:
          setup: ["SAR1 DRAFT (version captured at creation)"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { c1_v: $.data.version } }
            - { call: "POST /cases/${c1}/sar-decision", payload: { decision: "SAR_REQUIRED", decision_rationale: "Unexplained structuring pattern", expected_case_version: "${c1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/sar-reports", payload: { activity_start_date: "2026-03-10", activity_end_date: "2026-04-10" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar1: $.data.id, sar1_v: $.data.version } }
          trigger:
            - { call: "PUT /sar-reports/${sar1}/narrative", payload: { narrative: "Narrative: Between 2026-03-10 and 2026-04-10 the subject account received a pattern of cash deposits in amounts between 300000 and 500000 cents, each below the 1000000-cent reporting threshold, aggregating 1300000 cents across three branch and ATM visits within seven days. The customer could not explain the source of funds when contacted, the stated occupation is inconsistent with cash-intensive activity, and the deposits were followed by rapid transfers out of the account. This activity is consistent with structuring designed to evade currency transaction reporting requirements under 31 USC 5324 and is being reported as suspicious.", expected_sar_version: "${sar1_v}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar1_v2: $.data.version } }
            - { call: "PUT /sar-reports/${sar1}/narrative", payload: { narrative: "Stale overwrite attempt with different text that must not be stored anywhere at all.", expected_sar_version: "${sar1_v}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
            - { call: "GET /sar-reports/${sar1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { sar1_len: $.data.narrative_length, sar1_v_end: $.data.version } }
          assert:
            - "First edit: 200, version 1 -> 2, narrative_length == 640"
            - "Second edit (replaying expected_sar_version == 1): 412 ERR_STALE_VERSION"
            - "GET afterwards: narrative_length still == 640 and version still == 2 (no partial write)"

