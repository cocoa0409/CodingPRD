  - section: rbac
    instances:
      - name: booking_agent_cannot_activate_a_model_agreement
        claim_type: exclusive_operations
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - roles.BookingAgent
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "agreement activation is a ComplianceOfficer exclusive: a BookingAgent attempt is HTTP 403 ERR_UNAUTHORIZED and leaves the agreement DRAFT, and the check fires before the segregation-of-duties test so even a BookingAgent whose X-User-ID differs from the proposer is refused."
        test_recipe:
          setup:
            - "A DRAFT AGENCY agreement proposed by cm-1 for Hotel Lutetia."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
          trigger:
            - call: "POST /model-agreements/${ma}/activate"
              payload: {}
              as: BookingAgent
              as_user_id: "ba-1"
              captures: { err_ba: $.data.error_id }
          assert:
            - "HTTP 403 with ${err_ba} == ERR_UNAUTHORIZED"
            - "ModelAgreement.${ma}.status is still DRAFT with activated_by_user_id null and version 1"
            - "the same call as ComplianceOfficer co-1 then returns HTTP 200 with status ACTIVE"

      - name: compliance_officer_cannot_register_a_market
        claim_type: exclusive_operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.ComplianceOfficer
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "the split of powers runs both ways: market registration is a PlatformAdmin exclusive, so the ComplianceOfficer that adjudicates certifications and approves overrides is refused with HTTP 403 ERR_UNAUTHORIZED and no market row is created."
        test_recipe:
          setup:
