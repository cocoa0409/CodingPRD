      - name: corner_ep_utility_upgrade_raises_the_envelope_without_changing_status
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/lab-spaces/{id}/utility-upgrade
          - entities.LabSpace.fields.installed_power_kw
        distinguishing_aspect: "The upgrade endpoint overwrites the room's four capacity fields but is forbidden from touching either the installed load or the room status, and each supplied capacity must still cover what is already installed - so it is a write that is conditional on the room's own occupancy history rather than on any workflow state."
        test_recipe:
          setup:
            - "One AVAILABLE room BIOL-44 registered with a deliberately thin envelope: power 100.00 kW, no chilled water, 1 fume hood, floor load 250 psf. Nothing is installed in it yet, so installed_power_kw == 0.00 and installed_fume_hoods == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /lab-spaces"
              payload: { building_code: "BIOL", room_number: "44", net_sq_ft: 640, space_class: "WET", power_kw_capacity: 100.00, chilled_water_available: false, fume_hood_count: 1, floor_load_psf: 250 }
              as: FacilitiesManager
              captures: { e3_space: $.data.id, e3_v0: $.data.version }
          trigger:
            - call: "POST /lab-spaces/${e3_space}/utility-upgrade"
              payload: { power_kw_capacity: 400.00, fume_hood_count: 4, chilled_water_available: true, floor_load_psf: 600 }
              as: FacilitiesManager
          assert:
            - "response code is 200 and the body is a LabSpace with power_kw_capacity == 400.00, fume_hood_count == 4, chilled_water_available == true, floor_load_psf == 600"
            - "version went from 1 to 2 - which is precisely what invalidates a client's cached expected_space_version for POST /space-assignments"
            - "status is still AVAILABLE: the upgrade is not a renovation and never moves the room's state machine"
            - "installed_power_kw is still 0.00 and installed_fume_hoods is still 0 - only POST /equipment-orders/{id}/install raises a room's installed load"
            - "allocated_share_pct is still 0 - occupancy is untouched"
            - "all four capacity fields are required on this endpoint: it is a full overwrite of the envelope, so omitting fume_hood_count returns 422 ERR_VALIDATION rather than silently preserving 1"
            - "with 0.00 installed the floor for every capacity is 0, so an upgrade to power_kw_capacity 0.00 would be accepted here; the >= installed_load guard only bites once an INSTALLED order has raised the load"

      - name: corner_ep_rescope_returns_bid_project_to_scoping_with_a_new_estimate
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/renovation-projects/{id}/rescope
          - state_machines.RenovationProject.transitions.BID_to_SCOPING
        distinguishing_aspect: "The one backwards edge in the renovation lifecycle: rescope is the cycle in a state machine whose other edges all move forward, it overwrites the two scoping inputs, and it is the only writer of rescope_count - so a project can be bid, pulled back and re-bid without ever touching the ledger."
        test_recipe:
          setup:
            - "MINI-UNITS plus a DRAFT package holding a single RENOVATION tranche, one AVAILABLE room, and a MODERATE renovation project estimated at 8000000 that has been sent out to bid (status BID, version 2, rescope_count 0). No /award has run, so no ledger row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
