      - name: terminal_transfer_moves_installed_to_transfer_pending_and_clears_the_scan
        claim_type: cross_entity
        grounds:
          - state_machines.Terminal.INSTALLED_to_TRANSFER_PENDING
          - entities.Terminal.fields.ownership_changed_at
          - entities.Terminal.fields.last_scan_verdict
        distinguishing_aspect: "Transfer is a cross-entity write: the terminal's subscriber_id is repointed at sub2, ownership_changed_at is stamped with the current logical instant and last_scan_verdict is nulled, so the pre-transfer PASS no longer qualifies for install."
        test_recipe:
          setup:
            - "Subscribers sub1 and sub2 exist; terminal TRM-0001 belongs to sub1, has a PASS scan (1/200) taken at 2026-08-01T00:00:00Z and is INSTALLED; no subscription is bound to it."
            - "Clock advanced to 2026-08-03T00:00:00Z."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
