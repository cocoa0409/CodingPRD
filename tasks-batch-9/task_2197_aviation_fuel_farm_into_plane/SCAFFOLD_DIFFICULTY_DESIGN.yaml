  - rule_id: transitive_cascade
    instances:
      - name: receipt_quarantine_verdict_depth3_quality_cascade
        grounds:
          - state_machines.FuelReceipt.UNDER_TEST_to_QUARANTINED
          - state_machines.StorageTank.RELEASED_to_QUARANTINED
          - state_machines.FuelingOrder.ASSIGNED_to_AUTHORIZED
          - state_machines.FuelingOrder.FUELING_to_ABORTED
          - state_machines.FuelAuthorization.ISSUED_to_VOIDED
          - calculations.tank_book_inventory
          - calculations.airline_credit_exposure
        distinguishing_aspect: |
          A single verdict on entity FuelReceipt propagates three hops through three further entity types:
          hop 1 flips StorageTank.quality_status to QUARANTINED, hop 2 (caused only by hop 1, never by the
          request) drives one ASSIGNED order back to AUTHORIZED and one FUELING order to ABORTED, and hop 3
          (caused only by hop 2) voids the aborted order's POSTED uplift, credits 20000.00 liters back to the
          tank ledger, voids that order's FuelAuthorization and drops the account's accrual exposure from
          3402893 to 656500 cents. The depth-3 tail is observable independently: the uplift's VOIDED status
          and the 1000000.00 book volume cannot be produced by hop 1 or hop 2 alone.
        cascade_depth: 3
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T06:00:00Z"
            - "farm SFO, ACTIVE permit, tank T1 RELEASED with opening_volume_liters 1000000.0"
            - "two trucks TRK1 and TRK2 IN_SERVICE"
            - "account AA (base 62.00 cents/L, not tax exempt, credit limit 100000000)"
            - "order A: flight AA201, requested 10000.0, window 2026-08-10T08:00:00Z..08:30:00Z, AUTHORIZED then ASSIGNED to TRK2"
            - "order B: flight AA202, requested 20000.0, window 2026-08-10T06:00:00Z..07:30:00Z, ASSIGNED to TRK1, FUELING, one POSTED uplift of 20000.00 net liters"
            - "a second receipt R2 (meter ticket MT-8002) has been sampled by qi-alice and tested FAIL"
