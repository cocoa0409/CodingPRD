  # ===========================================================================
  # Rule 3 — non_linear_state_machine (cyclic machines on different entities:
  # DisciplinaryCase rehearing loop vs Certification lapse/reentry loop)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: disciplinary_rehearing_cycle
        grounds:
          - state_machines.DisciplinaryCase.DECIDED_to_APPEAL_PENDING
          - state_machines.DisciplinaryCase.APPEAL_PENDING_to_REHEARING
          - state_machines.DisciplinaryCase.REHEARING_to_HEARING_SCHEDULED
        distinguishing_aspect: |
          DisciplinaryCase is cyclic: DECIDED -> APPEAL_PENDING -> REHEARING ->
          HEARING_SCHEDULED -> DECIDED again; rehearing_count increments and
          decision fields are cleared on the loop-back, distinguishing it from
          a linear pipeline.
        test_recipe:
          setup:
            - "Registered candidate; open CRIMINAL_CONDUCT case walked to DECIDED with sanction WARNING, then appealed"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/candidates"
              payload: { full_name: "Rick Rehearing", email: "rick@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/disciplinary-cases"
              payload: { subject_candidate_id: "${c}", violation_type: "CRIMINAL_CONDUCT", description: "Misdemeanor reported on renewal disclosure" }
              as: RegistryAdmin
              as_user_id: "adm-1"
              captures: { dc: $.data.id }
            - { call: "POST /registry/disciplinary-cases/${dc}/issue-notice", payload: {}, as: RegistryAdmin }
            - call: "POST /registry/disciplinary-cases/${dc}/response"
              payload: { response_text: "Context and mitigation letter" }
              as: Candidate
              as_user_id: "${c}"
            - { call: "POST /registry/disciplinary-cases/${dc}/schedule-hearing", payload: {}, as: HearingOfficer, as_user_id: "ho-1" }
            - call: "GET /registry/disciplinary-cases/${dc}"
              payload: {}
              as: RegistryAdmin
              captures: { dcv: $.data.version }
            - call: "POST /registry/disciplinary-cases/${dc}/decide"
              payload: { sanction_type: "WARNING", findings: "Substantiated but minor", expected_case_version: "${dcv}" }
              as: HearingOfficer
              as_user_id: "ho-1"
            - call: "POST /registry/disciplinary-cases/${dc}/appeal"
              payload: { appeal_grounds: "Procedural error in evidence handling" }
              as: Candidate
              as_user_id: "${c}"
          trigger:
            - call: "POST /registry/disciplinary-cases/${dc}/appeal-decision"
              payload: { outcome: "OVERTURNED", rationale: "Evidence chain of custody broken" }
              as: RegistryAdmin
              captures: { st1: $.data.status, rh1: $.data.rehearing_count, sanc1: $.data.sanction_type }
            - { call: "POST /registry/disciplinary-cases/${dc}/schedule-hearing", payload: {}, as: HearingOfficer, as_user_id: "ho-1" }
            - call: "GET /registry/disciplinary-cases/${dc}"
              payload: {}
              as: RegistryAdmin
              captures: { dcv2: $.data.version }
            - call: "POST /registry/disciplinary-cases/${dc}/decide"
              payload: { sanction_type: "NONE", findings: "Not substantiated on rehearing", expected_case_version: "${dcv2}" }
              as: HearingOfficer
              as_user_id: "ho-1"
              captures: { st2: $.data.status, sanc2: $.data.sanction_type }
          assert:
            - "After OVERTURNED: DisciplinaryCase.${dc}.status == REHEARING"
            - "rehearing_count == 1 and sanction_type cleared (null) on loop-back"
            - "Case traverses REHEARING -> HEARING_SCHEDULED -> DECIDED a second time (status == DECIDED, sanction_type == NONE)"
            - "No certification side effects fired anywhere on the loop (sanctions apply only on entry to FINAL)"

      - name: certification_lapse_reentry_cycle
        grounds:
          - state_machines.Certification.ACTIVE_to_LAPSED
          - state_machines.Certification.LAPSED_to_ACTIVE
          - calculations.reentry_tier_assignment
        distinguishing_aspect: |
          Certification is cyclic across ACTIVE -> LAPSED -> ACTIVE: the clock
          sweep lapses the cert one day past expiry, and a TIER_CE_ONLY reentry
          approval reactivates it with a FRESH 24-month expiry anchored to the
          reinstatement instant (2030-09-15), in contrast to the
          anniversary-preserving recertification extension.
        test_recipe:
          setup:
            - "ACTIVE EMT certification issued 2026-09-04T00:00:00Z (expires 2028-09-04T00:00:00Z); clock advanced to 2028-09-15T00:00:00Z (lapse < 12 months)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS ambulance practice", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Lena Lapsed", email: "lena@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app: $.data.id }
            - call: "POST /registry/exam-applications/${app}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { att: $.data.att_id }
            - call: "POST /registry/cognitive-exam-attempts"
              payload: { att_id: "${att}", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: Candidate
              as_user_id: "${c}"
              captures: { at: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T12:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/cognitive-exam-attempts/${at}/responses"
              payload: { responses: [ { item_id: "l1", difficulty_b: 0.5, correct: true }, { item_id: "l2", difficulty_b: 0.5, correct: true }, { item_id: "l3", difficulty_b: 0.5, correct: true }, { item_id: "l4", difficulty_b: 0.5, correct: true }, { item_id: "l5", difficulty_b: 0.5, correct: true }, { item_id: "l6", difficulty_b: 0.5, correct: true }, { item_id: "l7", difficulty_b: 0.5, correct: true }, { item_id: "l8", difficulty_b: 0.5, correct: true } ] }
              as: ExamProctor
            - call: "POST /registry/psychomotor-verifications"
              payload: { candidate_id: "${c}", level_id: "${lv}", administered_by: "STATE", completion_record_id: "${rec}", exam_date: "2026-09-03", stations: [ { station_code: "AIRWAY", passed: true } ], documentation_attached: true }
              as: StateOfficial
              as_user_id: "so-1"
              captures: { psy: $.data.id }
            - { call: "POST /registry/psychomotor-verifications/${psy}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/certifications/issue"
              payload: { candidate_id: "${c}", level_id: "${lv}", exam_application_id: "${app}", attempt_id: "${at}", psychomotor_id: "${psy}" }
              as: RegistryAdmin
              captures: { cert: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-15T00:00:00Z" }
              as: RegistryAdmin
              captures: { lapsed_n: $.data.certifications_lapsed_count }
            - call: "GET /registry/certifications/${cert}"
              payload: {}
              as: RegistryAdmin
              captures: { st_mid: $.data.status }
            - call: "POST /registry/reentry-applications"
              payload: { certification_id: "${cert}", ce_makeup_hours_claimed: 40 }
              as: Candidate
              as_user_id: "${c}"
              captures: { ra: $.data.id, ra_tier: $.data.tier }
          trigger:
            - call: "POST /registry/reentry-applications/${ra}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
            - call: "GET /registry/certifications/${cert}"
              payload: {}
              as: RegistryAdmin
              captures: { st_end: $.data.status, exp_end: $.data.expires_on, rc_end: $.data.renewed_count }
          assert:
            - "sweep at 2028-09-15T00:00:00Z: certifications_lapsed_count == 1; Certification.${cert}.status == LAPSED"
            - "ReentryApplication.${ra}.tier == TIER_CE_ONLY (lapse <= 12 months)"
            - "After approval: Certification.${cert}.status == ACTIVE (cycle LAPSED -> ACTIVE)"
            - "Certification.${cert}.expires_on == 2030-09-15T00:00:00Z (fresh 24-month cycle from reinstatement, NOT anniversary-preserving)"
            - "Certification.${cert}.renewed_count == 0 (reentry is not a renewal)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (two cascades from different triggers: appeal
  # AFFIRMED -> FINAL vs accreditation REVOKED; depths 3 and 4)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: falsified_education_final_cascade
        grounds:
          - calculations.sanction_cascade
          - state_machines.ProgramCompletionRecord.VERIFIED_to_INVALIDATED
          - state_machines.Certification.ACTIVE_to_REVOKED
          - state_machines.LicenseApplication.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: |
          Trigger = DisciplinaryCase APPEAL_PENDING -> FINAL (appeal AFFIRMED).
          Depth-3 chain: case finalizes -> implicated completion record
          INVALIDATED -> certification based on it REVOKED -> in-flight license
          application citing that certification DENIED. Each hop is caused by
          the previous hop's mutation, not by the trigger directly.
        test_recipe:
          setup:
            - "Candidate with ACTIVE EMT cert (issued 2026-09-04) and an UNDER_REVIEW WA license application (NREMT path); a FALSIFIED_EDUCATION case implicating the basis completion record has been decided REVOCATION and appealed"
