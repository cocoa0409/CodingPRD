              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/rehearsals"
              payload: { concert_id: "${c1}", venue_id: "${v1}", service_type: "REHEARSAL", scheduled_start_utc: "2026-11-04T14:00:00Z", scheduled_end_utc: "2026-11-04T16:00:00Z", minimum_complement: 0, break_minutes: 20 }
              as: OrchestraManager
              captures: { sv1: "$.data.id" }
            - call: "POST /orchestra/rehearsals/${sv1}/publish"
              payload: {}
              as: OrchestraManager
            - call: "POST /orchestra/rehearsals"
              payload: { concert_id: "${c1}", venue_id: "${v1}", service_type: "REHEARSAL", scheduled_start_utc: "2026-11-04T16:30:00Z", scheduled_end_utc: "2026-11-04T18:00:00Z", minimum_complement: 0, break_minutes: 20 }
              as: OrchestraManager
              captures: { sv2: "$.data.id" }
          trigger:
            - call: "POST /orchestra/rehearsals/${sv2}/publish"
              payload: {}
              as: OrchestraManager
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_VENUE_CHANGEOVER_CONFLICT"
            - "HTTP status == 409"
            - "RehearsalService.${sv2}.status == DRAFT"
            - "RehearsalService.${sv1}.status == PUBLISHED"

      - name: musician_daily_service_cap_without_time_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_UNION_DAILY_SERVICE_CAP]
          - entities.UnionAgreement.fields.max_services_per_day
          - endpoints[POST /orchestra/rehearsals/{service_id}/engagements]
        distinguishing_aspect: |
          Interval semantics B — AGGREGATE CALENDAR-DATE CAPACITY on the MUSICIAN resource:
          the third service neither overlaps the other two nor violates the 90-minute rest
          gap (180 minutes of rest), yet the booking is refused purely because two CONFIRMED
          engagements already fall on the same UTC calendar date; this is counting, not
          two-interval geometry.
        test_recipe:
          setup:
            - "Season 2027 in PLANNING with a union agreement whose max_services_per_day is 2 and min_rest_minutes_between_services is 90"
            - "One PROGRAMMED concert and three DRAFT services all on 2026-11-04: 09:00-11:00, 13:00-15:00 and 18:00-20:00"
            - "Musician Pia Solberg already holds CONFIRMED engagements on the first two services"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${s1}", scale_service_fee_cents: 20000, max_services_per_day: 2, min_rest_minutes_between_services: 90, mandatory_break_minutes: 20 }
              as: OrchestraManager
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall", changeover_buffer_minutes: 60 }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1, min_renewal_priority_score: 480 }
              as: ArtisticAdmin
              captures: { sec_orch: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Opening Night", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 105 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/musicians"
              payload: { full_name: "Pia Solberg", instrument: "VIOLIN" }
              as: OrchestraManager
              captures: { m1: "$.data.id" }
            - call: "POST /orchestra/rehearsals"
              payload: { concert_id: "${c1}", venue_id: "${v1}", service_type: "REHEARSAL", scheduled_start_utc: "2026-11-04T09:00:00Z", scheduled_end_utc: "2026-11-04T11:00:00Z", minimum_complement: 0, break_minutes: 20 }
              as: OrchestraManager
              captures: { sv1: "$.data.id" }
            - call: "POST /orchestra/rehearsals"
              payload: { concert_id: "${c1}", venue_id: "${v1}", service_type: "REHEARSAL", scheduled_start_utc: "2026-11-04T13:00:00Z", scheduled_end_utc: "2026-11-04T15:00:00Z", minimum_complement: 0, break_minutes: 20 }
              as: OrchestraManager
              captures: { sv2: "$.data.id" }
            - call: "POST /orchestra/rehearsals"
              payload: { concert_id: "${c1}", venue_id: "${v1}", service_type: "DRESS_REHEARSAL", scheduled_start_utc: "2026-11-04T18:00:00Z", scheduled_end_utc: "2026-11-04T20:00:00Z", minimum_complement: 0, break_minutes: 20 }
              as: OrchestraManager
              captures: { sv3: "$.data.id" }
            - call: "POST /orchestra/rehearsals/${sv1}/engagements"
              payload: { musician_id: "${m1}", doubling_count: 0 }
              as: OrchestraManager
              captures: { e1: "$.data.id" }
            - call: "POST /orchestra/rehearsals/${sv2}/engagements"
              payload: { musician_id: "${m1}", doubling_count: 0 }
              as: OrchestraManager
              captures: { e2: "$.data.id" }
          trigger:
            - call: "POST /orchestra/rehearsals/${sv3}/engagements"
              payload: { musician_id: "${m1}", doubling_count: 0 }
              as: OrchestraManager
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_UNION_DAILY_SERVICE_CAP"
            - "HTTP status == 409"
            - "${err} != ERR_UNION_REST_VIOLATION  (the gap from 15:00 to 18:00 is 180 minutes, well over the 90-minute minimum)"
            - "RehearsalService.${sv3}.confirmed_engagement_count == 0"
            - "GET /orchestra/engagements?musician_id=${m1} returns total_count == 2"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_across_hold_and_ops_expiry
        grounds:
          - calculations.seat_inventory_conservation
          - state_machines.TicketOrder.HELD_to_EXPIRED
          - entities.TicketOrder.fields.hold_expires_at_ops_run
          - entities.Season.fields.ops_run_index
          - endpoints[POST /orchestra/seasons/{season_id}/run-ops]
        distinguishing_aspect: |
          Conserved quantity number one is a COUNT OF SEATS: capacity == available_count +
          held_count + sold_count on the ORCHESTRA element must equal 100 both while the
          30-seat hold stands (70+30+0) and after the compensating ops-run expiry restores it
          (100+0+0), with zero seats leaked or duplicated.
        test_recipe:
          setup:
            - "Season 2027 advanced to SINGLE_ON_SALE, ORCHESTRA section capacity 100"
            - "Patron Noel Vance holds 30 seats on the concert; hold_expires_at_ops_run is 2"
            - "One run-ops has already fired, so ops_run_index is 1 and the hold still stands at 70 available / 30 held / 0 sold"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${s1}", scale_service_fee_cents: 20000 }
              as: OrchestraManager
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall", changeover_buffer_minutes: 60 }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
