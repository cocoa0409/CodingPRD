# =============================================================================
# Scaffold: Adhesive & Sealant Manufacturing (task 1175)
# Reactive chemistry batches with pot life, moisture-sensitive packaging,
# cure/bond-strength lot release, pack configuration, shelf-life FIFO,
# technical-service formulation requests, hazmat shipping, consignment.
# =============================================================================

scenario: |
  1175. Adhesive & Sealant Manufacturing (adhesives manufacturer): reactive chemistry batch & pot life, moisture-sensitive handling & packaging, cure test & bond-strength lot release, cartridge/pail/drum pack configuration, shelf-life dating & FIFO enforcement, technical-service formulation request, hazmat shipping classification, distributor consignment

domain_name: adhesive-sealant-manufacturing
api_prefix: /api

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit      # lot release, SoD, hazmat gating, audit trail
  secondary_archetype: temporal_windowing  # pot life, shelf life, vessel/dry-room windows
  complexity_layers:
    - optimistic_concurrency        # OCC on ConsignmentAgreement.version (2 rules)
    - cascading_side_effects        # exposure -> run -> lot -> shipment chain; report -> stock -> replenishment chain
    - dual_variant_calculation      # QUICK vs FULL bond assessment; provisional vs final settlement
    - derived_field_reconciliation  # batch remaining volume, lot unit buckets, stock on_hand
  entity_topology: flat             # all resources are flat peers with FK references
  state_machine_shape: parallel     # ProductionLot qa_status x hold_status; cyclic machines on PackagingRun / FormulationRequest / ConsignmentAgreement / ConsumptionReport
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties # lot releaser must differ from accepted-test recorder
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Formulation
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique formulation code", constraints: "unique across all formulations" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: chemistry_family, type: enum, source: input, description: "EPOXY | POLYURETHANE | SILICONE | ACRYLIC" }
      - { name: moisture_sensitive, type: boolean, source: input, description: "True => packaging must occur in a dry room" }
      - { name: solvent_content_pct, type: number, source: input, description: "Solvent content percent, 0-100" }
      - { name: flash_point_c, type: number, source: input, description: "Flash point in Celsius" }
      - { name: pot_life_minutes, type: integer, source: input, description: "Working time after mix completion before the batch gels" }
      - { name: shelf_life_months, type: integer, source: input, description: "Shelf life in calendar months from manufacture date" }
      - { name: spec_min_bond_strength_mpa, type: number, source: input, description: "Minimum acceptable bond strength (MPa) for lot release" }
      - { name: min_remaining_shelf_life_days, type: integer, source: input, description: "Default minimum remaining shelf life (days) required at ship date" }
      - { name: status, type: enum, source: system, description: "DRAFT | EFFECTIVE | WITHDRAWN", default: DRAFT }

  - name: MixingVessel
    parent: null
    common_fields: true
    fields:
      - { name: vessel_code, type: string, source: input, description: "Unique vessel code", constraints: "unique" }
      - { name: capacity_liters, type: integer, source: input, description: "Maximum batch volume the vessel holds (liters)" }

  - name: DryRoom
    parent: null
    common_fields: true
    fields:
      - { name: room_code, type: string, source: input, description: "Unique dry room code", constraints: "unique" }
      - { name: max_concurrent_runs, type: integer, source: input, description: "Maximum number of packaging runs whose windows may overlap inside this room" }
      - { name: humidity_limit_pct, type: number, source: input, description: "Relative humidity limit (informational)" }

  - name: ProductionBatch
    parent: null
    common_fields: true
    fields:
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id; must be EFFECTIVE at creation" }
      - { name: vessel_id, type: string, source: input, description: "FK -> MixingVessel.id; booked for [mix_start_at, mix_end_at)" }
      - { name: mix_start_at, type: datetime, source: input, description: "Planned mix window start (ISO8601 UTC)" }
      - { name: mix_end_at, type: datetime, source: input, description: "Planned mix window end (must be > mix_start_at)" }
      - { name: batch_volume_ml, type: integer, source: input, description: "Total batch volume in ml; <= vessel capacity" }
      - { name: mixed_at, type: datetime, source: system, description: "Actual mix completion timestamp (logical clock), null until complete-mix" }
      - { name: pot_life_deadline, type: datetime, source: computed, description: "mixed_at + formulation.pot_life_minutes; null until mixed" }
      - { name: remaining_bulk_volume_ml, type: integer, source: computed, description: "Unpacked bulk volume; starts at batch_volume_ml; decremented on run completion" }
      - { name: written_off_volume_ml, type: integer, source: computed, description: "Volume condemned via hold-release CONDEMN or expiry cascade; starts 0" }
      - { name: production_lot_id, type: string, source: system, description: "The 1:1 ProductionLot created atomically with this batch" }
      - { name: status, type: enum, source: system, description: "MIXING | MIXED | PACKING | PACKED | EXPIRED | VOID", default: MIXING }

  - name: PackagingRun
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch must be MIXED or PACKING" }
      - { name: dry_room_id, type: string, source: input, description: "FK -> DryRoom.id; REQUIRED when the batch formulation is moisture_sensitive, optional otherwise" }
      - { name: pack_format, type: enum, source: input, description: "CARTRIDGE | PAIL | DRUM; all runs of one batch must share format and unit_volume_ml" }
      - { name: unit_volume_ml, type: integer, source: input, description: "Nominal fill volume per unit (ml)" }
      - { name: planned_units, type: integer, source: input, description: "Requested unit count" }
      - { name: planned_start_at, type: datetime, source: input, description: "Planned packing window start" }
      - { name: planned_end_at, type: datetime, source: input, description: "Planned packing window end (>= planned_start_at)" }
      - { name: per_unit_fill_ml, type: integer, source: computed, description: "round_half_up(unit_volume_ml * (1 + overfill_pct)); null until completion" }
      - { name: units_produced, type: integer, source: computed, description: "Units actually filled at completion; null until completion" }
      - { name: total_filled_ml, type: integer, source: computed, description: "units_produced * per_unit_fill_ml; null until completion" }
      - { name: held_from, type: enum, source: system, description: "OPEN | SEALED | null; the status the run was in when it entered HOLD" }
      - { name: status, type: enum, source: system, description: "OPEN | SEALED | HOLD | VOID", default: OPEN }

  - name: MoistureExposureEvent
    parent: null
    common_fields: false
    fields:
      - { name: packaging_run_id, type: string, source: input, description: "FK -> PackagingRun.id; run must be OPEN or SEALED" }
      - { name: exposure_minutes, type: integer, source: input, description: "Measured exposure duration; >= 30 triggers the HOLD cascade" }
      - { name: occurred_at, type: datetime, source: input, description: "When the exposure occurred (ISO8601 UTC)" }
      - { name: note, type: string, source: input, description: "Free-text note", default: null }

  - name: ProductionLot
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> ProductionBatch.id (1:1, created with the batch)" }
      - { name: formulation_id, type: string, source: system, description: "FK -> Formulation.id (denormalized from batch for FIFO queries)" }
      - { name: lot_number, type: string, source: system, description: "LOT- plus zero-padded 6-digit creation sequence, e.g. LOT-000001" }
      - { name: manufacture_date, type: string, source: system, description: "Date part of batch.mixed_at (YYYY-MM-DD); null until mixed" }
      - { name: expiry_date, type: string, source: computed, description: "manufacture_date + shelf_life_months calendar months, day clamped to last day of target month; null until mixed" }
      - { name: pack_format, type: enum, source: system, description: "CARTRIDGE | PAIL | DRUM | null; set by the batch's first packaging run" }
      - { name: unit_volume_ml, type: integer, source: system, description: "Nominal unit volume; set by the batch's first packaging run" }
      - { name: units_filled, type: integer, source: computed, description: "Total units filled by SEALED runs; starts 0" }
      - { name: units_quarantined, type: integer, source: computed, description: "Units currently quarantined by the exposure cascade; starts 0" }
      - { name: units_condemned, type: integer, source: computed, description: "Units condemned (hold CONDEMN or batch expiry before release); starts 0" }
      - { name: units_shipped, type: integer, source: computed, description: "Units dispatched (net of consignment returns); starts 0" }
      - { name: retest_count, type: integer, source: system, description: "Number of retest cycles used; starts 0; max 2" }
      - { name: released_by, type: string, source: system, description: "X-User-ID of the releasing QAManager; null until RELEASED" }
      - { name: qa_status, type: enum, source: system, description: "AWAITING_TEST | TESTING | UNDER_REVIEW | RELEASED | REJECTED", default: AWAITING_TEST }
      - { name: hold_status, type: enum, source: system, description: "CLEAR | QUARANTINE_HOLD", default: CLEAR }

  - name: CureTest
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ProductionLot.id; lot qa_status must be AWAITING_TEST or TESTING" }
      - { name: method, type: enum, source: input, description: "QUICK (1 specimen) | FULL (exactly 5 specimens)" }
      - { name: specimens, type: array, source: input, description: "Bond strength readings in MPa" }
      - { name: technician_id, type: string, source: system, description: "X-User-ID of the recording QATechnician" }
      - { name: evaluated_value_mpa, type: number, source: computed, description: "QUICK: the single specimen; FULL: trimmed mean (drop min+max, mean of remaining 3, round_half_up 2dp); null until ACCEPTED" }
      - { name: assessment_pass, type: boolean, source: computed, description: "Release assessment verdict per method; null until ACCEPTED" }
      - { name: status, type: enum, source: system, description: "RECORDED | ACCEPTED | SUPERSEDED | VOIDED", default: RECORDED }

  - name: FormulationRequest
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; must equal the acting Distributor's X-User-ID" }
      - { name: contact_name, type: string, source: input, description: "Requester contact" }
      - { name: target_substrate, type: string, source: input, description: "Substrate the adhesive must bond" }
      - { name: required_bond_strength_mpa, type: number, source: input, description: "Required bond strength" }
      - { name: application_notes, type: string, source: input, description: "Free-text requirements" }
      - { name: info_request_note, type: string, source: system, description: "Note set by request-info; null otherwise" }
      - { name: response_note, type: string, source: system, description: "Note set by respond; null otherwise" }
      - { name: decision_outcome, type: enum, source: system, description: "APPROVED | DECLINED | null" }
      - { name: resulting_formulation_id, type: string, source: system, description: "FK -> Formulation.id; set by convert; null otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | TECH_REVIEW | NEEDS_INFO | APPROVED | IN_DEVELOPMENT | CONVERTED | DECLINED", default: SUBMITTED }

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Distributor name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum total consigned value across ACTIVE and SUSPENDED agreements" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }

  - name: ConsignmentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id" }
      - { name: formulation_id, type: string, source: input, description: "FK -> Formulation.id; the single formulation covered" }
      - { name: unit_price_cents, type: integer, source: input, description: "Settlement price per consumed unit" }
      - { name: max_consigned_value_cents, type: integer, source: input, description: "Maximum consigned value this agreement may hold" }
      - { name: reorder_threshold_units, type: integer, source: input, description: "Replenishment triggers when total on-hand falls below this" }
      - { name: reorder_qty_units, type: integer, source: input, description: "Proposed units on an auto-created replenishment shipment" }
      - { name: min_remaining_shelf_life_days, type: integer, source: input, description: "Optional override of the formulation default for consignment shipments", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED", default: DRAFT }

  - name: ConsignmentStock
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> ConsignmentAgreement.id" }
      - { name: lot_id, type: string, source: system, description: "FK -> ProductionLot.id" }
      - { name: qty_shipped, type: integer, source: computed, description: "Units dispatched into consignment; starts 0" }
      - { name: qty_consumed, type: integer, source: computed, description: "Units reported consumed; starts 0" }
      - { name: qty_returned, type: integer, source: computed, description: "Units returned to the manufacturer; starts 0" }
      - { name: qty_on_hand, type: integer, source: computed, description: "qty_shipped - qty_consumed - qty_returned" }
      - { name: row_key, type: string, source: system, description: "Unique (agreement_id, lot_id) pair key; row upserted at dispatch", constraints: "unique per (agreement_id, lot_id)" }

  - name: ConsumptionReport
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> ConsignmentAgreement.id (from path)" }
      - { name: period, type: string, source: input, description: "Reporting period, format YYYY-MM; at most one non-VOID report per (agreement, period)" }
      - { name: consumed_units, type: integer, source: input, description: "Units consumed in the period (>= 1)" }
      - { name: provisional_settlement_cents, type: integer, source: computed, description: "consumed_units * unit_price_cents, computed at submit; null until SUBMITTED" }
      - { name: rebate_tier, type: enum, source: computed, description: "NONE | TIER1 | TIER2, computed at settle; null until SETTLED" }
      - { name: rebate_cents, type: integer, source: computed, description: "round_half_up(gross * tier_pct / 100); null until SETTLED" }
      - { name: final_net_settlement_cents, type: integer, source: computed, description: "gross - rebate; null until SETTLED" }
      - { name: dispute_reason, type: string, source: system, description: "Reason recorded at dispute; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SETTLED | DISPUTED | VOID", default: DRAFT }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: shipment_kind, type: enum, source: input, description: "SALE | CONSIGNMENT | CONSIGNMENT_REPLENISHMENT" }
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> ConsignmentAgreement.id; REQUIRED for CONSIGNMENT kinds, must be null for SALE", default: null }
      - { name: transport_mode, type: enum, source: input, description: "ROAD | AIR | SEA" }
      - { name: ship_date, type: string, source: input, description: "Planned ship date (YYYY-MM-DD); auto-created replenishment drafts receive logical-clock date + 7 days" }
      - { name: lines, type: array, source: input, description: "Array of { lot_id, units } objects; at most one line per lot per shipment; empty at creation" }
      - { name: hazmat_class, type: enum, source: computed, description: "NON_REGULATED | UN1133_CLASS3_PG_III | UN1133_CLASS3_PG_II; worst class across lines; null until PLANNED" }
      - { name: auto_replenishment, type: boolean, source: system, description: "True when created by the reorder cascade", default: false }
      - { name: proposed_units, type: integer, source: system, description: "Reorder quantity on auto-created replenishment drafts; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | PLANNED | CONFIRMED | DISPATCHED | EXCEPTION | CANCELLED", default: DRAFT }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Formulation
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /api/formulations/{formulationId}/activate"
        actor: PlantManager
        preconditions:
          - "Formulation in DRAFT (ERR_FORMULATION_INVALID_STATE)"
        side_effects: []
      - from: EFFECTIVE
        to: WITHDRAWN
        trigger: "POST /api/formulations/{formulationId}/withdraw"
        actor: PlantManager
        preconditions:
          - "Formulation in EFFECTIVE (ERR_FORMULATION_INVALID_STATE)"
          - "No ProductionBatch with formulation_id == this id in status MIXING, MIXED, or PACKING (ERR_FORMULATION_HAS_INFLIGHT_BATCHES)"
        side_effects:
          - "Existing RELEASED lots remain shippable; no lot cascade"
          - "New batch creation with this formulation becomes impossible (ERR_FORMULATION_NOT_EFFECTIVE)"
          - "Lot release referencing this formulation becomes impossible (ERR_FORMULATION_NOT_EFFECTIVE)"

  - entity: ProductionBatch
    initial_state: MIXING
    terminal_states: [PACKED, EXPIRED, VOID]
    transitions:
      - from: MIXING
        to: MIXED
        trigger: "POST /api/batches/{batchId}/complete-mix"
        actor: BatchOperator
        preconditions:
          - "Batch in MIXING (ERR_BATCH_INVALID_STATE). The clock-set sweep expires MIXING batches as soon as now > mix_end_at, so a late complete-mix observes EXPIRED and fails with ERR_BATCH_INVALID_STATE — the mix window is enforced via the sweep plus the state precondition, not a separate error."
        side_effects:
          - "mixed_at = logical clock now"
          - "pot_life_deadline = mixed_at + formulation.pot_life_minutes"
          - "ProductionLot.manufacture_date = date(mixed_at); ProductionLot.expiry_date computed"
      - from: MIXED
        to: PACKING
        trigger: "system (automatic when the first PackagingRun is created for the batch)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PACKING
        to: PACKED
        trigger: "system (automatic when a run completion drives remaining_bulk_volume_ml to exactly 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MIXING
        to: EXPIRED
        trigger: "system (clock-set sweep or on-touch: logical clock now > mix_end_at)"
        actor: system
        preconditions: []
        side_effects:
          - "ProductionLot in AWAITING_TEST|TESTING|UNDER_REVIEW -> REJECTED (released lots unaffected)"
      - from: MIXED
        to: EXPIRED
        trigger: "system (lazy on-touch at run create / run complete / batch void when now > pot_life_deadline; the triggering call fails with ERR_POT_LIFE_EXCEEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "All OPEN|HOLD PackagingRuns of this batch -> VOID"
          - "If ProductionLot.qa_status in AWAITING_TEST|TESTING|UNDER_REVIEW -> REJECTED and units of SEALED runs -> condemned (lot.units_condemned += run.units_produced, batch.written_off_volume_ml += run.total_filled_ml); RELEASED lots and their units are unaffected"
      - from: PACKING
        to: EXPIRED
        trigger: "system (same lazy on-touch rule as MIXED -> EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as MIXED -> EXPIRED"
      - from: MIXING
        to: VOID
        trigger: "POST /api/batches/{batchId}/void"
        actor: BatchOperator
        preconditions:
          - "Batch in MIXING or MIXED (ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "OPEN|HOLD PackagingRuns of this batch -> VOID"
          - "ProductionLot in AWAITING_TEST|TESTING|UNDER_REVIEW -> REJECTED"
      - from: MIXED
        to: VOID
        trigger: "POST /api/batches/{batchId}/void"
        actor: BatchOperator
        preconditions:
          - "Batch in MIXING or MIXED"
        side_effects:
          - "Same cascade as MIXING -> VOID"

  - entity: PackagingRun
    initial_state: OPEN
    terminal_states: [VOID]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /api/packaging-runs/{runId}/complete"
        actor: BatchOperator
        preconditions:
          - "Run in OPEN (ERR_RUN_INVALID_STATE)"
          - "Lazy pot-life check: now <= batch.pot_life_deadline, else batch expiry cascade fires and the call fails ERR_POT_LIFE_EXCEEDED"
          - "pack_fill_allocation must yield units_produced >= 1 (ERR_INSUFFICIENT_BATCH_VOLUME)"
        side_effects:
          - "per_unit_fill_ml / units_produced / total_filled_ml computed (per-unit rounding first)"
          - "batch.remaining_bulk_volume_ml -= total_filled_ml"
          - "lot.units_filled += units_produced"
          - "batch -> PACKED if remaining_bulk_volume_ml == 0"
      - from: OPEN
        to: HOLD
        trigger: "system (POST /api/packaging-runs/{runId}/exposure-events with exposure_minutes >= 30)"
        actor: system
        preconditions: []
        side_effects:
          - "held_from = OPEN"
          - "No unit effects (an OPEN run has produced no units)"
      - from: SEALED
        to: HOLD
        trigger: "system (exposure event with exposure_minutes >= 30 on a SEALED run)"
        actor: system
        preconditions: []
        side_effects:
          - "held_from = SEALED"
          - "Cascade hop 1 -> lot: lot.units_quarantined += run.units_produced; lot.hold_status -> QUARANTINE_HOLD"
          - "Cascade hop 2 -> shipments: every Shipment in PLANNED or CONFIRMED containing a line for this lot -> EXCEPTION"
      - from: HOLD
        to: OPEN
        trigger: "POST /api/packaging-runs/{runId}/hold-release with outcome=RELEASE (held_from == OPEN)"
        actor: QAManager
        preconditions:
          - "Run in HOLD (ERR_RUN_INVALID_STATE)"
        side_effects:
          - "Returns to held_from status; held_from cleared"
      - from: HOLD
        to: SEALED
        trigger: "POST /api/packaging-runs/{runId}/hold-release with outcome=RELEASE (held_from == SEALED)"
        actor: QAManager
        preconditions:
          - "Run in HOLD"
        side_effects:
          - "lot.units_quarantined -= run.units_produced"
          - "lot.hold_status -> CLEAR if no other HOLD runs reference this lot, else stays QUARANTINE_HOLD"
          - "held_from cleared; shipments already in EXCEPTION are NOT auto-restored (manual replan)"
      - from: HOLD
        to: VOID
        trigger: "POST /api/packaging-runs/{runId}/hold-release with outcome=CONDEMN, or batch expiry/void cascade"
        actor: QAManager
        preconditions:
          - "Run in HOLD"
        side_effects:
          - "If held_from == SEALED: lot.units_quarantined -= run.units_produced; lot.units_condemned += run.units_produced; batch.written_off_volume_ml += run.total_filled_ml (batch.remaining_bulk_volume_ml is NOT restored)"
          - "lot.hold_status -> CLEAR if no other HOLD runs reference this lot"
          - "held_from cleared"
      - from: OPEN
        to: VOID
        trigger: "batch void or batch expiry cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProductionLot
    initial_state: AWAITING_TEST
    terminal_states: [RELEASED, REJECTED]
    note: "Parallel state dimensions: qa_status and hold_status evolve independently; release is gated on hold_status == CLEAR."
    transitions:
      - from: "qa AWAITING_TEST"
        to: "qa TESTING"
        trigger: "system (first POST /api/production-lots/{lotId}/cure-tests)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "qa TESTING"
        to: "qa UNDER_REVIEW"
        trigger: "system (POST /api/cure-tests/{testId}/accept)"
        actor: system
        preconditions: []
        side_effects:
          - "assessment computed per method (QUICK vs FULL)"
      - from: "qa UNDER_REVIEW"
        to: "qa TESTING"
        trigger: "POST /api/production-lots/{lotId}/request-retest"
        actor: QAManager
        preconditions:
          - "qa_status == UNDER_REVIEW (ERR_LOT_INVALID_STATE)"
          - "retest_count < 2 (ERR_RETEST_LIMIT_EXCEEDED)"
        side_effects:
          - "retest_count += 1"
      - from: "qa UNDER_REVIEW"
        to: "qa RELEASED"
        trigger: "POST /api/production-lots/{lotId}/release"
        actor: QAManager
        preconditions:
          - "qa_status == UNDER_REVIEW (ERR_LOT_INVALID_STATE)"
          - "hold_status == CLEAR (ERR_LOT_ON_HOLD)"
          - "The most recently ACCEPTED (non-SUPERSEDED) CureTest is method FULL with assessment_pass == true (ERR_BOND_STRENGTH_BELOW_SPEC)"
          - "Segregation of duties: X-User-ID != technician_id of that ACCEPTED test (ERR_SEGREGATION_OF_DUTIES)"
          - "Formulation.status == EFFECTIVE (ERR_FORMULATION_NOT_EFFECTIVE)"
        side_effects:
          - "released_by = X-User-ID"
      - from: "qa UNDER_REVIEW"
        to: "qa REJECTED"
        trigger: "POST /api/production-lots/{lotId}/reject"
        actor: QAManager
        preconditions:
          - "qa_status == UNDER_REVIEW (ERR_LOT_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != technician_id of the ACCEPTED test (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "units of SEALED runs -> condemned: lot.units_condemned += (units_filled - units_condemned - units_quarantined); batch.written_off_volume_ml += corresponding volume; lot.units_quarantined unchanged"
      - from: "qa AWAITING_TEST|TESTING|UNDER_REVIEW"
        to: "qa REJECTED"
        trigger: "system (batch EXPIRED or VOID cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "hold CLEAR"
        to: "hold QUARANTINE_HOLD"
        trigger: "system (exposure cascade from a SEALED run of this lot)"
        actor: system
        preconditions: []
        side_effects:
          - "Shipments in PLANNED|CONFIRMED containing this lot -> EXCEPTION"
      - from: "hold QUARANTINE_HOLD"
        to: "hold CLEAR"
        trigger: "system (hold-release RELEASE or CONDEMN when no HOLD runs remain for this lot)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CureTest
    initial_state: RECORDED
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: RECORDED
        to: ACCEPTED
        trigger: "POST /api/cure-tests/{testId}/accept"
        actor: QAManager
        preconditions:
          - "Test in RECORDED (ERR_TEST_INVALID_STATE)"
          - "Lot qa_status == TESTING (ERR_LOT_INVALID_STATE)"
        side_effects:
          - "evaluated_value_mpa and assessment_pass computed per method"
          - "Any previously ACCEPTED test of the same lot -> SUPERSEDED"
          - "Lot qa_status -> UNDER_REVIEW"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /api/cure-tests/{testId}/void"
        actor: QAManager
        preconditions:
          - "Test in RECORDED (ERR_TEST_INVALID_STATE)"
        side_effects: []
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (a newer test of the same lot is accepted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FormulationRequest
    initial_state: SUBMITTED
    terminal_states: [DECLINED, CONVERTED]
    transitions:
      - from: SUBMITTED
        to: TECH_REVIEW
        trigger: "POST /api/formulation-requests/{requestId}/start-review"
        actor: TechServiceEngineer
        preconditions: ["status == SUBMITTED (ERR_REQUEST_INVALID_STATE)"]
        side_effects: []
      - from: TECH_REVIEW
        to: NEEDS_INFO
        trigger: "POST /api/formulation-requests/{requestId}/request-info"
        actor: TechServiceEngineer
        preconditions: ["status == TECH_REVIEW (ERR_REQUEST_INVALID_STATE)"]
        side_effects: ["info_request_note = payload note"]
      - from: NEEDS_INFO
        to: TECH_REVIEW
        trigger: "POST /api/formulation-requests/{requestId}/respond (cycle back into review)"
        actor: Distributor
        preconditions:
          - "status == NEEDS_INFO (ERR_REQUEST_INVALID_STATE)"
          - "request.distributor_id == X-User-ID (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: ["response_note = payload note"]
      - from: TECH_REVIEW
        to: APPROVED
        trigger: "POST /api/formulation-requests/{requestId}/decide with outcome=APPROVED"
        actor: TechServiceEngineer
        preconditions: ["status == TECH_REVIEW (ERR_REQUEST_INVALID_STATE)"]
        side_effects: ["decision_outcome = APPROVED"]
      - from: TECH_REVIEW
        to: DECLINED
        trigger: "POST /api/formulation-requests/{requestId}/decide with outcome=DECLINED"
        actor: TechServiceEngineer
        preconditions: ["status == TECH_REVIEW"]
        side_effects: ["decision_outcome = DECLINED"]
      - from: APPROVED
        to: IN_DEVELOPMENT
        trigger: "POST /api/formulation-requests/{requestId}/start-development"
        actor: TechServiceEngineer
        preconditions: ["status == APPROVED (ERR_REQUEST_INVALID_STATE)"]
        side_effects: []
      - from: IN_DEVELOPMENT
        to: CONVERTED
        trigger: "POST /api/formulation-requests/{requestId}/convert"
        actor: TechServiceEngineer
        preconditions: ["status == IN_DEVELOPMENT (ERR_REQUEST_INVALID_STATE)"]
        side_effects:
          - "Creates a new Formulation in DRAFT from the convert payload"
          - "resulting_formulation_id = new Formulation.id"

  - entity: ConsignmentAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/consignment-agreements/{agreementId}/activate"
        actor: CommercialManager
        preconditions:
          - "status == DRAFT (ERR_AGREEMENT_INVALID_STATE)"
          - "Credit check: sum of max_consigned_value_cents over the distributor's ACTIVE and SUSPENDED agreements + this agreement's max_consigned_value_cents <= distributor.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/consignment-agreements/{agreementId}/suspend"
        actor: CommercialManager
        preconditions: ["status == ACTIVE (ERR_AGREEMENT_INVALID_STATE)"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/consignment-agreements/{agreementId}/resume"
        actor: CommercialManager
        preconditions:
          - "status == SUSPENDED (ERR_AGREEMENT_INVALID_STATE)"
          - "Credit check re-run as on activate (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/consignment-agreements/{agreementId}/close"
        actor: CommercialManager
        preconditions:
          - "status == ACTIVE or SUSPENDED (ERR_AGREEMENT_INVALID_STATE)"
          - "No ConsumptionReport in DRAFT|SUBMITTED|DISPUTED for this agreement (ERR_AGREEMENT_HAS_OPEN_REPORTS)"
          - "All ConsignmentStock rows for this agreement have qty_on_hand == 0 (ERR_CONSIGNMENT_STOCK_REMAINING)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /api/consignment-agreements/{agreementId}/close"
        actor: CommercialManager
        preconditions: ["Same as ACTIVE -> CLOSED"]
        side_effects: []

  - entity: ConsumptionReport
    initial_state: DRAFT
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/consumption-reports/{reportId}/submit"
        actor: Distributor
        preconditions:
          - "status == DRAFT (ERR_REPORT_INVALID_STATE)"
          - "agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "report's agreement.distributor_id == X-User-ID (ERR_INSUFFICIENT_PERMISSIONS)"
          - "consumed_units <= total qty_on_hand across the agreement's stock rows (ERR_STOCK_NEGATIVE; no partial application)"
        side_effects:
          - "Cascade hop 1 -> stock: FIFO waterfall decrement by lot expiry_date ASC (tie: lot.created_at ASC); qty_consumed += take, qty_on_hand -= take per row"
          - "provisional_settlement_cents = consumed_units * agreement.unit_price_cents"
          - "Cascade hop 2 -> reorder check: if total qty_on_hand < agreement.reorder_threshold_units AND no shipment with agreement_id == this agreement, auto_replenishment == true, status in {DRAFT, PLANNED, CONFIRMED} exists -> create Shipment (kind CONSIGNMENT_REPLENISHMENT, auto_replenishment true, proposed_units = reorder_qty_units, distributor from agreement, transport_mode ROAD, ship_date = clock date + 7 days, status DRAFT)"
      - from: SUBMITTED
        to: SETTLED
        trigger: "POST /api/consumption-reports/{reportId}/settle"
        actor: CommercialManager
        preconditions: ["status == SUBMITTED (ERR_REPORT_INVALID_STATE)"]
        side_effects:
          - "Final settlement: gross = consumed_units * unit_price_cents; rebate_tier from gross (>= 1000000 -> TIER2 10%; >= 500000 -> TIER1 5%; else NONE 0%); rebate_cents = round_half_up(gross * pct / 100); final_net_settlement_cents = gross - rebate_cents"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /api/consumption-reports/{reportId}/dispute"
        actor: CommercialManager
        preconditions: ["status == SUBMITTED (ERR_REPORT_INVALID_STATE)"]
        side_effects: ["dispute_reason = payload reason"]
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /api/consumption-reports/{reportId}/revise (cycle back for correction)"
        actor: Distributor
        preconditions:
          - "status == DISPUTED (ERR_REPORT_INVALID_STATE)"
          - "report's agreement.distributor_id == X-User-ID (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "Compensation of the submit cascade: the waterfall decrement is rolled back per row (qty_consumed -= taken, qty_on_hand += taken); provisional_settlement_cents cleared to null"
          - "If the auto-replenishment shipment created by this report's submit is still DRAFT -> CANCELLED; if already PLANNED or beyond it is left untouched"
          - "consumed_units replaced by payload value if provided"
      - from: DRAFT
        to: VOID
        trigger: "system (a new ConsumptionReport is created for the same (agreement, period); the new DRAFT supersedes this one)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Shipment
    initial_state: DRAFT
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLANNED
        trigger: "POST /api/shipments/{shipmentId}/plan"
        actor: LogisticsCoordinator
        preconditions:
          - "status == DRAFT (ERR_SHIPMENT_INVALID_STATE)"
          - "At least one line (ERR_INVALID_REQUEST)"
        side_effects:
          - "hazmat_class computed = highest-risk class across lines (rank NON_REGULATED < UN1133_CLASS3_PG_III < UN1133_CLASS3_PG_II)"
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /api/shipments/{shipmentId}/confirm"
        actor: LogisticsCoordinator
        preconditions:
          - "status == PLANNED (ERR_SHIPMENT_INVALID_STATE)"
          - "Consignment kinds: agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "Hazmat mode gate per line (ERR_HAZMAT_MODE_FORBIDDEN) - safety, checked before temporal"
          - "Min remaining shelf life per line at ship_date (ERR_MIN_SHELF_LIFE_VIOLATION) - temporal"
        side_effects: []
      - from: CONFIRMED
        to: DISPATCHED
        trigger: "POST /api/shipments/{shipmentId}/dispatch"
        actor: LogisticsCoordinator
        preconditions:
          - "status == CONFIRMED (ERR_SHIPMENT_INVALID_STATE)"
          - "Consignment kinds: agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "Per line: lot.units_shipped += line.units"
          - "Consignment kinds per line: upsert ConsignmentStock (agreement_id, lot_id): qty_shipped += units, qty_on_hand += units"
      - from: PLANNED
        to: EXCEPTION
        trigger: "system (exposure cascade: a lot referenced by a line entered QUARANTINE_HOLD)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: EXCEPTION
        trigger: "system (same exposure cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXCEPTION
        to: PLANNED
        trigger: "POST /api/shipments/{shipmentId}/replan"
        actor: LogisticsCoordinator
        preconditions:
          - "status == EXCEPTION (ERR_SHIPMENT_INVALID_STATE)"
          - "No line references a lot with hold_status != CLEAR (ERR_SHIPMENT_BLOCKED_LINES)"
        side_effects:
          - "hazmat_class recomputed from the remaining lines"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/shipments/{shipmentId}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["status in DRAFT|PLANNED|CONFIRMED|EXCEPTION (ERR_SHIPMENT_INVALID_STATE)"]
        side_effects: ["Line reservations released by virtue of terminal status"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/shipments/{shipmentId}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["status in DRAFT|PLANNED|CONFIRMED|EXCEPTION"]
        side_effects: ["Line reservations released"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/shipments/{shipmentId}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["status in DRAFT|PLANNED|CONFIRMED|EXCEPTION"]
        side_effects: ["Line reservations released"]
      - from: EXCEPTION
        to: CANCELLED
        trigger: "POST /api/shipments/{shipmentId}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["status in DRAFT|PLANNED|CONFIRMED|EXCEPTION"]
        side_effects: ["Line reservations released"]

# =============================================================================
# Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: report-create-stale-agreement
    parent_entity: ConsignmentAgreement
    write_endpoint: "POST /api/consignment-agreements/{agreementId}/consumption-reports"
    occ_field: expected_agreement_version
    description: |
      Creating a ConsumptionReport against a ConsignmentAgreement whose version
      has advanced since the client last observed it is rejected. The create
      legitimately supersedes an existing DRAFT report for the same period, so
      a stale view of the agreement must not be allowed to supersede blindly.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-patch-stale-version
    parent_entity: ConsignmentAgreement
    write_endpoint: "PATCH /api/consignment-agreements/{agreementId}"
    occ_field: expected_agreement_version
    description: |
      Updating a ConsignmentAgreement's commercial terms with an
      expected_agreement_version older than the agreement's current version is
      rejected; the client must re-read and re-apply.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: pack_fill_allocation
    trigger: "POST /api/packaging-runs/{runId}/complete"
    algorithm: tiered_pricing
    formula: |
      per_unit_fill_ml = round_half_up(unit_volume_ml * (1 + OVERFILL_PCT[pack_format]), 0 decimals)
      units_produced = min(planned_units, floor(batch.remaining_bulk_volume_ml / per_unit_fill_ml))
      total_filled_ml = units_produced * per_unit_fill_ml
      PINNED ROUNDING ORDER: round per unit FIRST, then multiply by units.
      (The alternative order, sum exact then round once, yields a different
      total: 3 x 316.2 = 948.6 -> 949 vs pinned 3 x 316 = 948.)
      If units_produced == 0 -> reject ERR_INSUFFICIENT_BATCH_VOLUME.
    input_set: "The completing run plus its batch's current remaining_bulk_volume_ml"
    constants:
      OVERFILL_PCT: { CARTRIDGE: 0.02, PAIL: 0.01, DRUM: 0.005 }
    precision: "0 decimal places (integer ml), round_half_up at the per-unit step only"

  - name: bond_strength_assessment
    trigger: "POST /api/cure-tests/{testId}/accept"
    algorithm: aggregation
    formula: |
      QUICK: requires specimens length == 1.
        evaluated_value_mpa = specimens[0]
        assessment_pass = (evaluated_value_mpa >= spec_min_bond_strength_mpa)   # >= is inclusive
      FULL: requires specimens length == 5.
        sorted_specimens = sort(specimens ASC)
        retained = sorted_specimens[1..3]   # drop exactly one min and one max
        evaluated_value_mpa = round_half_up(mean(retained), 2)
        assessment_pass = (evaluated_value_mpa >= spec_min_bond_strength_mpa)
                          AND (min(retained) >= spec_min_bond_strength_mpa - SPECIMEN_TOLERANCE_MPA)
    input_set: "The accepted CureTest's specimens and the lot formulation's spec_min_bond_strength_mpa"
    constants:
      FULL_SPECIMEN_COUNT: 5
      TRIM_EACH_SIDE: 1
      SPECIMEN_TOLERANCE_MPA: 2.0
    precision: "2 decimal places, round_half_up (FULL mean)"
    variants:
      - name: QUICK
        when: "method == QUICK; provisional screening verdict"
        difference: "Single specimen compared directly to spec; no trimming, no tolerance band. Same lot data can pass QUICK while FULL fails (and vice versa)."
      - name: FULL
        when: "method == FULL; required verdict for lot release"
        difference: "Trimmed mean over 3 retained specimens plus per-specimen tolerance; the only variant accepted by the release transition."

  - name: expiry_dating
    trigger: "POST /api/batches/{batchId}/complete-mix"
    algorithm: projection
    formula: |
      manufacture_date = date(mixed_at)
      expiry_date = manufacture_date + shelf_life_months calendar months;
      if the day-of-month exceeds the target month's last day, clamp to that last day
      (e.g. 2026-01-31 + 1 month -> 2026-02-28).
    input_set: "The batch's mixed_at and the formulation's shelf_life_months"
    precision: "Date precision (YYYY-MM-DD)"

  - name: pot_life_window_check
    trigger: "PackagingRun create / complete and ProductionBatch void (lazy on-touch)"
    algorithm: threshold
    formula: |
      elapsed_minutes = (logical_clock_now - batch.mixed_at) in whole minutes
      The batch is usable iff elapsed_minutes <= formulation.pot_life_minutes   # inclusive boundary
      If now > pot_life_deadline at touch time: batch -> EXPIRED cascade fires
      and the triggering call fails ERR_POT_LIFE_EXCEEDED.
    input_set: "Batches in MIXED or PACKING"
    constants: {}
    precision: "Whole minutes"

  - name: min_shelf_life_check
    trigger: "POST /api/shipments/{shipmentId}/confirm (per line)"
    algorithm: threshold
    formula: |
      min_days = agreement.min_remaining_shelf_life_days if the shipment is a
                 consignment kind AND the override is not null,
                 else formulation.min_remaining_shelf_life_days
      remaining_days = (lot.expiry_date - shipment.ship_date).days   # date arithmetic
      Pass iff remaining_days >= min_days   # inclusive boundary: exactly min_days passes
    input_set: "Each shipment line's lot expiry, the shipment ship_date, and the applicable minimum"
    precision: "Whole days"

  - name: fifo_lot_selection
    trigger: "POST /api/shipments/{shipmentId}/lines"
    algorithm: constraint_propagation
    formula: |
      Let L be the requested lot, F = L.formulation_id.
      candidates = ProductionLots where formulation_id == F,
        qa_status == RELEASED, hold_status == CLEAR,
        expiry_date > shipment.ship_date (strictly), and units_available > 0.
      units_available(X) = X.units_filled - X.units_quarantined - X.units_condemned
        - X.units_shipped - reserved_units(X), where reserved_units sums line.units
        over all shipments in DRAFT|PLANNED|CONFIRMED containing a line for X.
      required_lot = argmin over candidates of (expiry_date ASC, created_at ASC).
      If L not in candidates -> ERR_LOT_NOT_SHIPPABLE / ERR_LOT_ON_HOLD as applicable.
      If L != required_lot -> ERR_FIFO_VIOLATION (strict FIFO: any older eligible
      lot with available units blocks shipping a newer lot).
    input_set: "RELEASED lots of the line's formulation relative to the shipment's ship_date"
    precision: "n/a (selector)"

  - name: lot_units_available
    trigger: "POST /api/shipments/{shipmentId}/lines (stock sufficiency)"
    algorithm: aggregation
    formula: |
      units_available = units_filled - units_quarantined - units_condemned
                        - units_shipped - reserved_units
      Line accepted iff line.units <= units_available, else ERR_INSUFFICIENT_LOT_STOCK.
    input_set: "The line's lot and all open (DRAFT|PLANNED|CONFIRMED) shipment lines referencing it"
    precision: "Integer units"

  - name: hazmat_transport_classification
    trigger: "POST /api/shipments/{shipmentId}/plan (classification) and /confirm (mode gate)"
    algorithm: tiered_pricing
    formula: |
      Per line (formulation F, lot.pack_format PF, lot.unit_volume_ml V, shipment mode M):
        if F.solvent_content_pct >= SOLVENT_THRESHOLD_PCT and F.flash_point_c < CLASS3_FLASH_BELOW_C:
          class = UN1133; pg = PG_II if F.flash_point_c < PG_II_FLASH_BELOW_C else PG_III
        else:
          class = NON_REGULATED
      Shipment hazmat_class = highest rank across lines:
        rank(NON_REGULATED)=0 < rank(UN1133_CLASS3_PG_III)=1 < rank(UN1133_CLASS3_PG_II)=2
      Mode gate at confirm (only for M == AIR):
        any PG_II line with V > LQ_MAX_UNIT_ML -> ERR_HAZMAT_MODE_FORBIDDEN
        any PG_III line with PF == DRUM        -> ERR_HAZMAT_MODE_FORBIDDEN
      ROAD and SEA impose no additional gate.
    input_set: "All lines of the shipment at plan time; re-evaluated at confirm"
    constants:
      SOLVENT_THRESHOLD_PCT: 24.0
      PG_II_FLASH_BELOW_C: 23.0
      CLASS3_FLASH_BELOW_C: 60.5
      LQ_MAX_UNIT_ML: 5000
    precision: "n/a (classifier)"

  - name: consignment_consumption_waterfall
    trigger: "POST /api/consumption-reports/{reportId}/submit"
    algorithm: waterfall_allocation
    formula: |
      rows = ConsignmentStock where agreement_id == report.agreement_id AND qty_on_hand > 0,
        ordered by lot.expiry_date ASC, tie-break lot.created_at ASC.
      remaining = consumed_units
      for row in rows:
        take = min(row.qty_on_hand, remaining)
        row.qty_consumed += take; row.qty_on_hand -= take; remaining -= take
        if remaining == 0: stop
      if remaining > 0 -> ERR_STOCK_NEGATIVE and NO row is modified (atomic, immediate consistency).
    input_set: "Stock rows of the agreement with positive on-hand"
    precision: "Integer units"

  - name: consignment_settlement
    trigger: "submit (provisional) and settle (final)"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (circular-looking dependency resolved):
        1. gross_cents = consumed_units * agreement.unit_price_cents
        2. rebate_tier = f(gross_cents):  gross >= TIER2_GROSS_CENTS -> TIER2 (10%)
                                          gross >= TIER1_GROSS_CENTS -> TIER1 (5%)
                                          else NONE (0%)
        3. rebate_cents = round_half_up(gross_cents * tier_pct / 100)  # integer cents
        4. net_cents = gross_cents - rebate_cents
      Provisional variant (at submit): provisional_settlement_cents = gross_cents (no rebate).
      Final variant (at settle): rebate_tier / rebate_cents / final_net_settlement_cents as above.
    input_set: "The report's consumed_units and the agreement's unit_price_cents"
    constants:
      TIER1_GROSS_CENTS: 500000
      TIER1_PCT: 5
      TIER2_GROSS_CENTS: 1000000
      TIER2_PCT: 10
    precision: "Integer cents, round_half_up at the rebate step only"
    variants:
      - name: PROVISIONAL
        when: "At submit; billing estimate"
        difference: "Flat list price, no rebate; always >= the final net for the same consumed_units when a tier applies."
      - name: FINAL
        when: "At settle; binding settlement"
        difference: "Tiered rebate keyed on gross; tier boundaries are inclusive (gross == 500000 already earns TIER1)."

  - name: credit_limit_check
    trigger: "POST /api/consignment-agreements/{id}/activate and /resume"
    algorithm: aggregation
    formula: |
      total = sum(max_consigned_value_cents over the distributor's agreements
                  with status IN {ACTIVE, SUSPENDED}) + candidate.max_consigned_value_cents
      Breach iff total > distributor.credit_limit_cents
      (inclusive boundary: total == credit_limit passes).
    input_set: "The distributor's ACTIVE and SUSPENDED agreements plus the candidate"
    precision: "Integer cents"

  - name: vessel_window_overlap
    trigger: "POST /api/batches"
    algorithm: interval_merge
    formula: |
      Existing = batches on the same vessel with status IN {MIXING, MIXED, PACKING}.
      Half-open interval semantics [mix_start_at, mix_end_at):
        overlap iff (new.mix_start_at < existing.mix_end_at)
                AND (existing.mix_start_at < new.mix_end_at)
      Adjacency is NOT an overlap: new.mix_start_at == existing.mix_end_at is allowed.
      Any overlap -> ERR_VESSEL_TIME_OVERLAP.
    input_set: "Non-terminal batches of the vessel"
    precision: "Second precision"

  - name: dry_room_capacity_check
    trigger: "POST /api/packaging-runs (only when dry_room_id is provided)"
    algorithm: interval_merge
    formula: |
      Occupants = runs on the same dry room with status IN {OPEN, HOLD}.
      CLOSED interval semantics [planned_start_at, planned_end_at]:
        overlap iff (existing.planned_start_at <= new.planned_end_at)
                AND (new.planned_start_at <= existing.planned_end_at)
      Adjacency COUNTS as overlap here (touching windows share the instant).
      Reject iff count(overlapping occupants) >= dry_room.max_concurrent_runs
      -> ERR_DRY_ROOM_CAPACITY_EXCEEDED. Aggregate capacity, not exclusive use.
    input_set: "OPEN and HOLD runs of the dry room"
    precision: "Second precision"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for the operation; for Distributor-role writes the targeted resource must belong to X-User-ID (FormulationRequest.distributor_id, report's agreement.distributor_id)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Request body schema: required fields present, types and enum members valid, mix_end_at > mix_start_at, planned_end_at >= planned_start_at, positive integers where required, QUICK implies exactly 1 specimen / FULL implies exactly 5, agreement_id present iff shipment_kind is CONSIGNMENT or CONSIGNMENT_REPLENISHMENT and absent for SALE"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "Path ids exist (validated left-to-right), then body FK ids exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 5
    category: state
    check: "State preconditions: transition from-states (ERR_FORMULATION_INVALID_STATE, ERR_BATCH_INVALID_STATE, ERR_RUN_INVALID_STATE, ERR_TEST_INVALID_STATE, ERR_LOT_INVALID_STATE, ERR_REQUEST_INVALID_STATE, ERR_AGREEMENT_INVALID_STATE, ERR_REPORT_INVALID_STATE, ERR_SHIPMENT_INVALID_STATE) and cross-entity state gates: formulation EFFECTIVE for batch create and lot release (ERR_FORMULATION_NOT_EFFECTIVE), no in-flight batches for withdraw (ERR_FORMULATION_HAS_INFLIGHT_BATCHES), agreement ACTIVE for report create/submit and consignment confirm/dispatch (ERR_AGREEMENT_NOT_ACTIVE), lot RELEASED/not-expired for line add (ERR_LOT_NOT_SHIPPABLE), lot hold CLEAR for line add and release (ERR_LOT_ON_HOLD), no blocked lines for replan (ERR_SHIPMENT_BLOCKED_LINES)"
    error_id: "per-check (409 family)"
    http_status: 409
    applies_to: "state transition and gated write endpoints"
  - priority: 6
    category: business_safety
    check: "Moisture protocol: run.create for a moisture_sensitive formulation REQUIRES dry_room_id (ERR_MOISTURE_PROTOCOL_VIOLATION). Hazmat mode gate at shipment confirm (ERR_HAZMAT_MODE_FORBIDDEN). Segregation of duties at lot release/reject: X-User-ID must differ from the ACCEPTED test's technician_id (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_MOISTURE_PROTOCOL_VIOLATION | ERR_HAZMAT_MODE_FORBIDDEN | ERR_SEGREGATION_OF_DUTIES"
    http_status: 422
    applies_to: "POST /api/packaging-runs; POST /api/shipments/{id}/confirm; POST /api/production-lots/{id}/release and /reject"
  - priority: 7
    category: business_temporal
    check: "Pot life at run create/complete (ERR_POT_LIFE_EXCEEDED, elapsed <= pot_life_minutes inclusive); min remaining shelf life per line at confirm (ERR_MIN_SHELF_LIFE_VIOLATION, remaining >= min_days inclusive). The mix window is enforced by the clock-set sweep (MIXING -> EXPIRED once now > mix_end_at) plus the complete-mix state precondition, so no separate mix-window error exists."
    error_id: "ERR_POT_LIFE_EXCEEDED | ERR_MIN_SHELF_LIFE_VIOLATION"
    http_status: 422
    applies_to: "POST /api/batches/{id}/complete-mix; POST /api/packaging-runs; POST /api/packaging-runs/{id}/complete; POST /api/shipments/{id}/confirm"
  - priority: 8
    category: business_constraint
    check: "Vessel half-open window overlap (ERR_VESSEL_TIME_OVERLAP) and vessel capacity in ml (ERR_VESSEL_CAPACITY_EXCEEDED) at batch create; dry-room closed-interval aggregate capacity (ERR_DRY_ROOM_CAPACITY_EXCEEDED) at run create; pack-format/unit-volume consistency within a batch (ERR_PACK_FORMAT_MISMATCH) at run create; duplicate lot line (ERR_DUPLICATE_LOT_LINE) then strict FIFO (ERR_FIFO_VIOLATION) at line add; retest limit (ERR_RETEST_LIMIT_EXCEEDED); one non-VOID report per (agreement, period) (ERR_REPORT_PERIOD_DUPLICATE)"
    error_id: "per-check (409 family)"
    http_status: 409
    applies_to: "POST /api/batches; POST /api/packaging-runs; POST /api/shipments/{id}/lines; POST /api/production-lots/{id}/request-retest; POST /api/consignment-agreements/{id}/consumption-reports"
  - priority: 9
    category: business_referential
    check: "Batch volume sufficiency at run complete (ERR_INSUFFICIENT_BATCH_VOLUME); lot units_available sufficiency at line add (ERR_INSUFFICIENT_LOT_STOCK); consumption <= total on-hand (ERR_STOCK_NEGATIVE, atomic); return <= qty_on_hand (ERR_RETURN_EXCEEDS_ON_HAND); close guards (ERR_AGREEMENT_HAS_OPEN_REPORTS, ERR_CONSIGNMENT_STOCK_REMAINING)"
    error_id: "per-check (409/422 family)"
    http_status: 422
    applies_to: "run complete; line add; report submit; stock return; agreement close"
  - priority: 10
    category: business_fiscal
    check: "Credit limit at agreement activate/resume: sum of max_consigned_value_cents over the distributor's ACTIVE|SUSPENDED agreements + candidate <= distributor.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED; equality passes)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /api/consignment-agreements/{id}/activate; POST /api/consignment-agreements/{id}/resume"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Sets the logical clock. Startup default is exactly 2026-05-01T00:00:00Z and the clock NEVER falls back to wall-clock time. Advancing the clock triggers the MIXING-batch expiry sweep (now > mix_end_at -> EXPIRED with lot-reject cascade). Pot-life expiry of MIXED|PACKING batches is NOT swept here; it is enforced lazily on-touch (see pot_life_window_check)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["MIXING batches with mix_end_at < now -> EXPIRED; their lots in AWAITING_TEST|TESTING|UNDER_REVIEW -> REJECTED"]

  # --- Formulation ---
  - { method: POST, path: "/api/formulations", description: "Create a formulation (DRAFT)", roles: [PlantManager], code: 201, input: [code, name, chemistry_family, moisture_sensitive, solvent_content_pct, flash_point_c, pot_life_minutes, shelf_life_months, spec_min_bond_strength_mpa, min_remaining_shelf_life_days], output: Formulation, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/api/formulations", description: "List formulations", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Formulation[]", side_effects: [] }
  - { method: GET, path: "/api/formulations/{formulationId}", description: "Get one formulation", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: Formulation, side_effects: [] }
  - { method: POST, path: "/api/formulations/{formulationId}/activate", description: "DRAFT -> EFFECTIVE", roles: [PlantManager], code: 200, input: [], output: Formulation, side_effects: ["status -> EFFECTIVE", "increments Formulation.version by 1"] }
  - { method: POST, path: "/api/formulations/{formulationId}/withdraw", description: "EFFECTIVE -> WITHDRAWN; guarded by in-flight batches", roles: [PlantManager], code: 200, input: [], output: Formulation, side_effects: ["status -> WITHDRAWN", "increments Formulation.version by 1"] }

  # --- MixingVessel ---
  - { method: POST, path: "/api/mixing-vessels", description: "Register a mixing vessel", roles: [PlantManager], code: 201, input: [vessel_code, capacity_liters], output: MixingVessel, side_effects: [] }
  - { method: GET, path: "/api/mixing-vessels/{vesselId}", description: "Get one vessel", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: MixingVessel, side_effects: [] }

  # --- DryRoom ---
  - { method: POST, path: "/api/dry-rooms", description: "Register a dry room", roles: [PlantManager], code: 201, input: [room_code, max_concurrent_runs, humidity_limit_pct], output: DryRoom, side_effects: [] }
  - { method: GET, path: "/api/dry-rooms/{dryRoomId}", description: "Get one dry room", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: DryRoom, side_effects: [] }

  # --- ProductionBatch ---
  - { method: POST, path: "/api/batches", description: "Create a batch in MIXING; atomically creates its 1:1 ProductionLot (AWAITING_TEST)", roles: [BatchOperator], code: 201, input: [formulation_id, vessel_id, mix_start_at, mix_end_at, batch_volume_ml], output: ProductionBatch, side_effects: ["ProductionLot created (production_lot_id)", "remaining_bulk_volume_ml = batch_volume_ml", "vessel half-open overlap and capacity checks"] }
  - { method: GET, path: "/api/batches", description: "List batches (filtered)", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?", "formulation_id?", "vessel_id?"], output: "ProductionBatch[]", side_effects: [] }
  - { method: GET, path: "/api/batches/{batchId}", description: "Get one batch", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: ProductionBatch, side_effects: [] }
  - { method: POST, path: "/api/batches/{batchId}/complete-mix", description: "MIXING -> MIXED; stamps mixed_at, pot_life_deadline, lot manufacture/expiry dates", roles: [BatchOperator], code: 200, input: [], output: ProductionBatch, side_effects: ["status -> MIXED", "mixed_at = clock now", "lot manufacture_date / expiry_date computed", "increments ProductionBatch.version by 1"] }
  - { method: POST, path: "/api/batches/{batchId}/void", description: "MIXING|MIXED -> VOID with run/lot cascade", roles: [BatchOperator], code: 200, input: ["reason?"], output: ProductionBatch, side_effects: ["OPEN|HOLD runs -> VOID", "lot (non-terminal qa) -> REJECTED", "increments ProductionBatch.version by 1"] }

  # --- PackagingRun ---
  - { method: POST, path: "/api/packaging-runs", description: "Open a packaging run for a MIXED|PACKING batch; dry-room capacity and moisture-protocol checks; first run moves batch to PACKING and pins lot pack_format/unit_volume_ml", roles: [BatchOperator], code: 201, input: [batch_id, pack_format, unit_volume_ml, planned_units, planned_start_at, planned_end_at, "dry_room_id?"], output: PackagingRun, side_effects: ["batch MIXED -> PACKING on first run", "lot.pack_format / unit_volume_ml set on first run", "lazy pot-life check (ERR_POT_LIFE_EXCEEDED + expiry cascade)"] }
  - { method: GET, path: "/api/packaging-runs", description: "List packaging runs (filtered)", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?", "batch_id?", "dry_room_id?"], output: "PackagingRun[]", side_effects: [] }
  - { method: GET, path: "/api/packaging-runs/{runId}", description: "Get one run", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: PackagingRun, side_effects: [] }
  - { method: POST, path: "/api/packaging-runs/{runId}/complete", description: "OPEN -> SEALED; computes per-unit-rounded fill; decrements batch volume; increments lot units_filled", roles: [BatchOperator], code: 200, input: [], output: PackagingRun, side_effects: ["per_unit_fill_ml / units_produced / total_filled_ml computed", "batch.remaining_bulk_volume_ml -= total_filled_ml", "lot.units_filled += units_produced", "batch -> PACKED when remaining hits exactly 0"] }
  - { method: POST, path: "/api/packaging-runs/{runId}/exposure-events", description: "Log a moisture exposure event; >= 30 min triggers the HOLD cascade (run -> lot quarantine -> shipment EXCEPTION)", roles: [BatchOperator], code: 201, input: [exposure_minutes, occurred_at, "note?"], output: MoistureExposureEvent, side_effects: ["if exposure_minutes >= 30: run OPEN|SEALED -> HOLD with full cascade"] }
  - { method: GET, path: "/api/exposure-events", description: "List exposure events (filtered)", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?", "packaging_run_id?"], output: "MoistureExposureEvent[]", side_effects: [] }
  - { method: GET, path: "/api/exposure-events/{eventId}", description: "Get one exposure event", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: MoistureExposureEvent, side_effects: [] }
  - { method: POST, path: "/api/packaging-runs/{runId}/hold-release", description: "HOLD -> held_from (outcome=RELEASE) or HOLD -> VOID with condemn accounting (outcome=CONDEMN)", roles: [QAManager], code: 200, input: [outcome, "note?"], output: PackagingRun, side_effects: ["RELEASE: restore held_from, un-quarantine units, lift lot hold when last HOLD run clears", "CONDEMN: run -> VOID, units -> condemned, batch.written_off_volume_ml += total_filled_ml, lot hold recomputed"] }

  # --- ProductionLot ---
  - { method: GET, path: "/api/production-lots", description: "List lots (filtered)", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?", "batch_id?", "formulation_id?"], output: "ProductionLot[]", side_effects: [] }
  - { method: GET, path: "/api/production-lots/{lotId}", description: "Get one lot", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: ProductionLot, side_effects: [] }
  - { method: POST, path: "/api/production-lots/{lotId}/cure-tests", description: "Record a cure/bond-strength test; first test moves lot AWAITING_TEST -> TESTING", roles: [QATechnician], code: 201, input: [method, specimens], output: CureTest, side_effects: ["technician_id = X-User-ID", "lot qa_status AWAITING_TEST -> TESTING"] }
  - { method: POST, path: "/api/production-lots/{lotId}/release", description: "UNDER_REVIEW -> RELEASED; gated on hold CLEAR, latest accepted FULL pass, SoD, formulation EFFECTIVE", roles: [QAManager], code: 200, input: [], output: ProductionLot, side_effects: ["qa_status -> RELEASED", "released_by = X-User-ID", "increments ProductionLot.version by 1"] }
  - { method: POST, path: "/api/production-lots/{lotId}/reject", description: "UNDER_REVIEW -> REJECTED; SoD applies; sealed units condemned", roles: [QAManager], code: 200, input: ["reason?"], output: ProductionLot, side_effects: ["qa_status -> REJECTED", "sealed units -> condemned", "batch.written_off_volume_ml increased"] }
  - { method: POST, path: "/api/production-lots/{lotId}/request-retest", description: "UNDER_REVIEW -> TESTING (max 2 retests)", roles: [QAManager], code: 200, input: [], output: ProductionLot, side_effects: ["retest_count += 1"] }

  # --- CureTest ---
  - { method: GET, path: "/api/cure-tests", description: "List cure tests (filtered)", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?", "lot_id?"], output: "CureTest[]", side_effects: [] }
  - { method: GET, path: "/api/cure-tests/{testId}", description: "Get one cure test", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: CureTest, side_effects: [] }
  - { method: POST, path: "/api/cure-tests/{testId}/accept", description: "RECORDED -> ACCEPTED; computes assessment; supersedes prior ACCEPTED; lot -> UNDER_REVIEW", roles: [QAManager], code: 200, input: [], output: CureTest, side_effects: ["evaluated_value_mpa / assessment_pass computed", "prior ACCEPTED test of lot -> SUPERSEDED", "lot qa_status -> UNDER_REVIEW"] }
  - { method: POST, path: "/api/cure-tests/{testId}/void", description: "RECORDED -> VOIDED", roles: [QAManager], code: 200, input: ["reason?"], output: CureTest, side_effects: [] }

  # --- FormulationRequest ---
  - { method: POST, path: "/api/formulation-requests", description: "Distributor submits a technical-service formulation request (SUBMITTED)", roles: [Distributor], code: 201, input: [distributor_id, contact_name, target_substrate, required_bond_strength_mpa, application_notes], output: FormulationRequest, side_effects: [] }
  - { method: GET, path: "/api/formulation-requests", description: "List requests (filtered; Distributor role sees only own)", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?", "distributor_id?", "resulting_formulation_id?"], output: "FormulationRequest[]", side_effects: [] }
  - { method: GET, path: "/api/formulation-requests/{requestId}", description: "Get one request", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: FormulationRequest, side_effects: [] }
  - { method: POST, path: "/api/formulation-requests/{requestId}/start-review", description: "SUBMITTED -> TECH_REVIEW", roles: [TechServiceEngineer], code: 200, input: [], output: FormulationRequest, side_effects: [] }
  - { method: POST, path: "/api/formulation-requests/{requestId}/request-info", description: "TECH_REVIEW -> NEEDS_INFO", roles: [TechServiceEngineer], code: 200, input: [info_request_note], output: FormulationRequest, side_effects: ["info_request_note set"] }
  - { method: POST, path: "/api/formulation-requests/{requestId}/respond", description: "NEEDS_INFO -> TECH_REVIEW (cycle); only the owning distributor", roles: [Distributor], code: 200, input: [response_note], output: FormulationRequest, side_effects: ["response_note set"] }
  - { method: POST, path: "/api/formulation-requests/{requestId}/decide", description: "TECH_REVIEW -> APPROVED | DECLINED (branch)", roles: [TechServiceEngineer], code: 200, input: [outcome, "decision_note?"], output: FormulationRequest, side_effects: ["decision_outcome set"] }
  - { method: POST, path: "/api/formulation-requests/{requestId}/start-development", description: "APPROVED -> IN_DEVELOPMENT", roles: [TechServiceEngineer], code: 200, input: [], output: FormulationRequest, side_effects: [] }
  - { method: POST, path: "/api/formulation-requests/{requestId}/convert", description: "IN_DEVELOPMENT -> CONVERTED; creates the resulting Formulation in DRAFT", roles: [TechServiceEngineer], code: 200, input: [formulation_code, formulation_name, chemistry_family, moisture_sensitive, solvent_content_pct, flash_point_c, pot_life_minutes, shelf_life_months, spec_min_bond_strength_mpa, min_remaining_shelf_life_days], output: FormulationRequest, side_effects: ["new Formulation created in DRAFT", "resulting_formulation_id set"] }

  # --- Distributor ---
  - { method: POST, path: "/api/distributors", description: "Register a distributor", roles: [CommercialManager], code: 201, input: [name, credit_limit_cents, contact_email], output: Distributor, side_effects: [] }
  - { method: GET, path: "/api/distributors/{distributorId}", description: "Get one distributor", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: Distributor, side_effects: [] }

  # --- ConsignmentAgreement ---
  - { method: POST, path: "/api/consignment-agreements", description: "Create a consignment agreement (DRAFT)", roles: [CommercialManager], code: 201, input: [distributor_id, formulation_id, unit_price_cents, max_consigned_value_cents, reorder_threshold_units, reorder_qty_units, "min_remaining_shelf_life_days?"], output: ConsignmentAgreement, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/api/consignment-agreements", description: "List agreements (filtered)", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?", "distributor_id?", "formulation_id?"], output: "ConsignmentAgreement[]", side_effects: [] }
  - { method: GET, path: "/api/consignment-agreements/{agreementId}", description: "Get one agreement", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: ConsignmentAgreement, side_effects: [] }
  - { method: PATCH, path: "/api/consignment-agreements/{agreementId}", description: "Update commercial terms; OCC-guarded (expected_agreement_version required)", roles: [CommercialManager], code: 200, input: ["reorder_threshold_units?", "reorder_qty_units?", "min_remaining_shelf_life_days?", "max_consigned_value_cents?", expected_agreement_version], output: ConsignmentAgreement, side_effects: ["increments ConsignmentAgreement.version by 1"] }
  - { method: POST, path: "/api/consignment-agreements/{agreementId}/activate", description: "DRAFT -> ACTIVE with credit check", roles: [CommercialManager], code: 200, input: [], output: ConsignmentAgreement, side_effects: ["increments ConsignmentAgreement.version by 1"] }
  - { method: POST, path: "/api/consignment-agreements/{agreementId}/suspend", description: "ACTIVE -> SUSPENDED", roles: [CommercialManager], code: 200, input: [], output: ConsignmentAgreement, side_effects: ["increments ConsignmentAgreement.version by 1"] }
  - { method: POST, path: "/api/consignment-agreements/{agreementId}/resume", description: "SUSPENDED -> ACTIVE with credit re-check", roles: [CommercialManager], code: 200, input: [], output: ConsignmentAgreement, side_effects: ["increments ConsignmentAgreement.version by 1"] }
  - { method: POST, path: "/api/consignment-agreements/{agreementId}/close", description: "ACTIVE|SUSPENDED -> CLOSED; guarded by open reports and remaining stock", roles: [CommercialManager], code: 200, input: [], output: ConsignmentAgreement, side_effects: ["increments ConsignmentAgreement.version by 1"] }

  # --- ConsignmentStock ---
  - { method: GET, path: "/api/consignment-stock", description: "List consignment stock rows (filtered)", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?", "agreement_id?", "lot_id?"], output: "ConsignmentStock[]", side_effects: [] }
  - { method: GET, path: "/api/consignment-stock/{stockId}", description: "Get one stock row", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: ConsignmentStock, side_effects: [] }
  - { method: POST, path: "/api/consignment-stock/{stockId}/return", description: "Return units from consignment to the manufacturer (compensating action of dispatch)", roles: [CommercialManager], code: 200, input: [units, "note?"], output: ConsignmentStock, side_effects: ["qty_returned += units", "qty_on_hand -= units", "lot.units_shipped -= units", "agreement must not be CLOSED (ERR_AGREEMENT_INVALID_STATE)", "units <= qty_on_hand (ERR_RETURN_EXCEEDS_ON_HAND)"] }

  # --- ConsumptionReport ---
  - { method: POST, path: "/api/consignment-agreements/{agreementId}/consumption-reports", description: "Create a report (DRAFT); OCC-guarded; supersedes an existing DRAFT for the same period (old one -> VOID)", roles: [Distributor], code: 201, input: [period, consumed_units, expected_agreement_version], output: ConsumptionReport, side_effects: ["increments ConsignmentAgreement.version by 1", "existing DRAFT for same (agreement, period) -> VOID"] }
  - { method: GET, path: "/api/consumption-reports", description: "List reports (filtered)", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?", "agreement_id?"], output: "ConsumptionReport[]", side_effects: [] }
  - { method: GET, path: "/api/consumption-reports/{reportId}", description: "Get one report", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: ConsumptionReport, side_effects: [] }
  - { method: POST, path: "/api/consumption-reports/{reportId}/submit", description: "DRAFT -> SUBMITTED; FIFO waterfall stock decrement; provisional settlement; reorder cascade", roles: [Distributor], code: 200, input: [], output: ConsumptionReport, side_effects: ["stock rows decremented FIFO", "provisional_settlement_cents computed", "auto-replenishment draft shipment on threshold breach"] }
  - { method: POST, path: "/api/consumption-reports/{reportId}/settle", description: "SUBMITTED -> SETTLED; final tiered settlement", roles: [CommercialManager], code: 200, input: [], output: ConsumptionReport, side_effects: ["rebate_tier / rebate_cents / final_net_settlement_cents computed"] }
  - { method: POST, path: "/api/consumption-reports/{reportId}/dispute", description: "SUBMITTED -> DISPUTED", roles: [CommercialManager], code: 200, input: [reason], output: ConsumptionReport, side_effects: ["dispute_reason set"] }
  - { method: POST, path: "/api/consumption-reports/{reportId}/revise", description: "DISPUTED -> DRAFT (cycle); rolls back the submit waterfall and cancels the linked DRAFT auto-replenishment", roles: [Distributor], code: 200, input: ["consumed_units?"], output: ConsumptionReport, side_effects: ["waterfall decrement rolled back per row", "provisional_settlement_cents -> null", "linked auto-replenishment DRAFT shipment -> CANCELLED"] }

  # --- Shipment ---
  - { method: POST, path: "/api/shipments", description: "Create a shipment (DRAFT, no lines)", roles: [LogisticsCoordinator], code: 201, input: [shipment_kind, distributor_id, transport_mode, ship_date, "agreement_id?"], output: Shipment, side_effects: [] }
  - { method: GET, path: "/api/shipments", description: "List shipments (filtered)", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: ["limit?", "offset?", "distributor_id?", "agreement_id?", "shipment_kind?", "status?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/api/shipments/{shipmentId}", description: "Get one shipment", roles: [PlantManager, BatchOperator, QATechnician, QAManager, TechServiceEngineer, CommercialManager, LogisticsCoordinator, Distributor, PlatformAdmin], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/api/shipments/{shipmentId}/lines", description: "Add a lot line (DRAFT or EXCEPTION only); lot shippability, duplicate, FIFO and stock checks", roles: [LogisticsCoordinator], code: 200, input: [lot_id, units], output: Shipment, side_effects: ["line appended; units reserved implicitly"] }
  - { method: POST, path: "/api/shipments/{shipmentId}/lines/{lotId}/remove", description: "Remove a lot line (DRAFT or EXCEPTION only)", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["line removed; reservation released"] }
  - { method: POST, path: "/api/shipments/{shipmentId}/plan", description: "DRAFT -> PLANNED; computes hazmat_class", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["hazmat_class computed (worst across lines)"] }
  - { method: POST, path: "/api/shipments/{shipmentId}/confirm", description: "PLANNED -> CONFIRMED; requires at least one line (ERR_INVALID_REQUEST); agreement ACTIVE gate, hazmat mode gate (safety) then min-shelf-life gate (temporal)", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/api/shipments/{shipmentId}/dispatch", description: "CONFIRMED -> DISPATCHED; lot.units_shipped and consignment stock upsert", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["per line: lot.units_shipped += units", "consignment: stock row upsert qty_shipped/qty_on_hand += units"] }
  - { method: POST, path: "/api/shipments/{shipmentId}/cancel", description: "DRAFT|PLANNED|CONFIRMED|EXCEPTION -> CANCELLED; releases line reservations", roles: [LogisticsCoordinator], code: 200, input: ["reason?"], output: Shipment, side_effects: [] }
  - { method: POST, path: "/api/shipments/{shipmentId}/replan", description: "EXCEPTION -> PLANNED after blocked lines were removed; recomputes hazmat_class", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["hazmat_class recomputed"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for the operation, or Distributor acting on a resource owned by another distributor" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation: missing/invalid fields, bad enum member, bad time window, wrong specimen count, missing conditional agreement_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK reference does not exist" }
  - { id: ERR_FORMULATION_NOT_EFFECTIVE, http: 409, condition: "Batch create or lot release requires the formulation in EFFECTIVE" }
  - { id: ERR_FORMULATION_INVALID_STATE, http: 409, condition: "Formulation not in the required state for the operation (activate requires DRAFT, withdraw requires EFFECTIVE)" }
  - { id: ERR_FORMULATION_HAS_INFLIGHT_BATCHES, http: 409, condition: "Withdraw blocked by batches in MIXING|MIXED|PACKING" }
  - { id: ERR_VESSEL_TIME_OVERLAP, http: 409, condition: "Half-open mix window overlaps another non-terminal batch on the vessel" }
  - { id: ERR_VESSEL_CAPACITY_EXCEEDED, http: 422, condition: "batch_volume_ml exceeds vessel capacity_liters * 1000" }
  - { id: ERR_DRY_ROOM_CAPACITY_EXCEEDED, http: 409, condition: "Closed-interval overlap would place >= max_concurrent_runs runs in the dry room" }
  - { id: ERR_MOISTURE_PROTOCOL_VIOLATION, http: 422, condition: "Moisture-sensitive formulation packed without a dry_room_id" }
  - { id: ERR_PACK_FORMAT_MISMATCH, http: 409, condition: "Run's pack_format or unit_volume_ml differs from the batch's established configuration" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "Batch not in the required state for the operation" }
  - { id: ERR_POT_LIFE_EXCEEDED, http: 422, condition: "Run create/complete touched after pot_life_deadline (batch expiry cascade fires; elapsed <= pot_life_minutes is the inclusive pass boundary)" }
  - { id: ERR_RUN_INVALID_STATE, http: 409, condition: "Run not in the required state for the operation" }
  - { id: ERR_INSUFFICIENT_BATCH_VOLUME, http: 422, condition: "pack_fill_allocation yields 0 units" }
  - { id: ERR_TEST_INVALID_STATE, http: 409, condition: "Cure test not in the required state" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "Lot qa_status not in the required state" }
  - { id: ERR_LOT_ON_HOLD, http: 409, condition: "Lot hold_status != CLEAR where CLEAR is required" }
  - { id: ERR_RETEST_LIMIT_EXCEEDED, http: 409, condition: "retest_count already at the maximum of 2" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Lot release/reject attempted by the same X-User-ID that recorded the ACCEPTED test" }
  - { id: ERR_BOND_STRENGTH_BELOW_SPEC, http: 422, condition: "Latest ACCEPTED test is not a passing FULL assessment" }
  - { id: ERR_REQUEST_INVALID_STATE, http: 409, condition: "FormulationRequest not in the required state" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement not in the required state (incl. return against CLOSED agreement)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Cross-entity gate: agreement must be ACTIVE (report create/submit, consignment confirm/dispatch)" }
  - { id: ERR_AGREEMENT_HAS_OPEN_REPORTS, http: 409, condition: "Close blocked by reports in DRAFT|SUBMITTED|DISPUTED" }
  - { id: ERR_CONSIGNMENT_STOCK_REMAINING, http: 409, condition: "Close blocked by stock rows with qty_on_hand > 0" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Activate/resume would push consigned value above the distributor credit limit (strictly greater; equality passes)" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "Report not in the required state" }
  - { id: ERR_REPORT_PERIOD_DUPLICATE, http: 409, condition: "A non-DRAFT (SUBMITTED|SETTLED|DISPUTED) report already exists for the (agreement, period)" }
  - { id: ERR_STOCK_NEGATIVE, http: 422, condition: "consumed_units exceeds total qty_on_hand; nothing is decremented" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_agreement_version does not match the agreement's current version (OCC)" }
  - { id: ERR_SHIPMENT_INVALID_STATE, http: 409, condition: "Shipment not in the required state for the operation" }
  - { id: ERR_SHIPMENT_BLOCKED_LINES, http: 409, condition: "Replan attempted while a line still references a lot with hold_status != CLEAR" }
  - { id: ERR_DUPLICATE_LOT_LINE, http: 409, condition: "The lot already has a line on this shipment" }
  - { id: ERR_LOT_NOT_SHIPPABLE, http: 409, condition: "Line-add lot is not RELEASED, or expiry_date <= ship_date" }
  - { id: ERR_FIFO_VIOLATION, http: 409, condition: "An older eligible lot (earlier expiry_date, then earlier created_at) of the same formulation still has available units" }
  - { id: ERR_INSUFFICIENT_LOT_STOCK, http: 409, condition: "line.units exceeds the lot's units_available (filled - quarantined - condemned - shipped - reserved)" }
  - { id: ERR_MIN_SHELF_LIFE_VIOLATION, http: 422, condition: "remaining_days < applicable min_remaining_shelf_life_days at confirm (remaining == min passes)" }
  - { id: ERR_HAZMAT_MODE_FORBIDDEN, http: 422, condition: "AIR shipment containing a PG_II line with unit_volume_ml > 5000 or a PG_III DRUM line" }
  - { id: ERR_RETURN_EXCEEDS_ON_HAND, http: 422, condition: "Return units exceed the stock row's qty_on_hand" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the logical clock and test-driving surface"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints (read access)"

  - name: PlantManager
    description: "Owns formulations, vessels, and dry rooms"
    identity: opaque
    exclusive_operations:
      - "POST /api/formulations"
      - "POST /api/formulations/{id}/activate"
      - "POST /api/formulations/{id}/withdraw"
      - "POST /api/mixing-vessels"
      - "POST /api/dry-rooms"
    shared_operations:
      - "All GET endpoints (read access)"

  - name: BatchOperator
    description: "Runs mixing and packaging operations, logs exposure events"
    identity: opaque
    exclusive_operations:
      - "POST /api/batches"
      - "POST /api/batches/{id}/complete-mix"
      - "POST /api/batches/{id}/void"
      - "POST /api/packaging-runs"
      - "POST /api/packaging-runs/{id}/complete"
      - "POST /api/packaging-runs/{id}/exposure-events"
    shared_operations:
      - "All GET endpoints (read access)"

  - name: QATechnician
    description: "Records cure/bond-strength tests; may never release or accept"
    identity: opaque
    exclusive_operations:
      - "POST /api/production-lots/{id}/cure-tests"
    shared_operations:
      - "All GET endpoints (read access)"

  - name: QAManager
    description: "Accepts/voids tests, releases/rejects lots, releases holds; segregation of duties versus the recording technician"
    identity: opaque
    exclusive_operations:
      - "POST /api/cure-tests/{id}/accept"
      - "POST /api/cure-tests/{id}/void"
      - "POST /api/production-lots/{id}/release"
      - "POST /api/production-lots/{id}/reject"
      - "POST /api/production-lots/{id}/request-retest"
      - "POST /api/packaging-runs/{id}/hold-release"
    shared_operations:
      - "All GET endpoints (read access)"

  - name: TechServiceEngineer
    description: "Drives the formulation-request review and development pipeline"
    identity: opaque
    exclusive_operations:
      - "POST /api/formulation-requests/{id}/start-review"
      - "POST /api/formulation-requests/{id}/request-info"
      - "POST /api/formulation-requests/{id}/decide"
      - "POST /api/formulation-requests/{id}/start-development"
      - "POST /api/formulation-requests/{id}/convert"
    shared_operations:
      - "All GET endpoints (read access)"

  - name: CommercialManager
    description: "Owns distributors, consignment agreements, settlement, and returns"
    identity: opaque
    exclusive_operations:
      - "POST /api/distributors"
      - "POST /api/consignment-agreements"
      - "PATCH /api/consignment-agreements/{id}"
      - "POST /api/consignment-agreements/{id}/activate"
      - "POST /api/consignment-agreements/{id}/suspend"
      - "POST /api/consignment-agreements/{id}/resume"
      - "POST /api/consignment-agreements/{id}/close"
      - "POST /api/consignment-stock/{id}/return"
      - "POST /api/consumption-reports/{id}/settle"
      - "POST /api/consumption-reports/{id}/dispute"
    shared_operations:
      - "All GET endpoints (read access)"

  - name: LogisticsCoordinator
    description: "Builds, confirms, and dispatches shipments; hazmat planning"
    identity: opaque
    exclusive_operations:
      - "POST /api/shipments"
      - "POST /api/shipments/{id}/lines"
      - "POST /api/shipments/{id}/lines/{lotId}/remove"
      - "POST /api/shipments/{id}/plan"
      - "POST /api/shipments/{id}/confirm"
      - "POST /api/shipments/{id}/dispatch"
      - "POST /api/shipments/{id}/cancel"
      - "POST /api/shipments/{id}/replan"
    shared_operations:
      - "All GET endpoints (read access)"

  - name: Distributor
    description: "External distributor; submits formulation requests and consumption reports for its own account only; its GET /api/formulation-requests view is auto-scoped to its own distributor_id"
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /api/formulation-requests"
      - "POST /api/formulation-requests/{id}/respond"
      - "POST /api/consignment-agreements/{id}/consumption-reports"
      - "POST /api/consumption-reports/{id}/submit"
      - "POST /api/consumption-reports/{id}/revise"
    shared_operations:
      - "All GET endpoints (read access; formulation-request listing auto-scoped to own distributor_id)"
