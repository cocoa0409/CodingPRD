            - "attr2 maps ${li1} → 70, ${li2} → 30"
            - "WrapReport.${w1}.status == DRAFT and WrapReport.${w2}.status == DRAFT"

  # ============================================================== validations
  - section: validations
    instances:
      - name: forbidden_beats_not_found_for_wrong_role
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]"]
        distinguishing_aspect: "Authorization (priority 2) precedes existence (priority 4): a Trafficker hitting a transition on a non-existent IO gets ERR_FORBIDDEN, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /insertion-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/transition", payload: { action: "APPROVE" }, as: Trafficker, captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN", "http status == 403"]

      - name: duplicate_snapshot_rejected_even_after_void
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_DUPLICATE_SNAPSHOT]"]
        distinguishing_aspect: "Uniqueness over (line_item_id, snapshot_date) covers VOIDED rows too: re-posting 2026-08-03 after voiding the first snapshot still fails."
        test_recipe:
          setup: ["LIVE line item; snapshot Aug3 posted then voided"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
