          - { call: "POST /jansan/orders", payload: { facility_id: "${fac_a}", lines: [ { product_id: "${prod_id}", qty: 1 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: DistributorAdmin, captures: { ord_id: $.data.id } }
