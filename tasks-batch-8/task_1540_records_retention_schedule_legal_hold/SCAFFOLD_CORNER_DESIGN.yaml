# =============================================================================
# §1.9 Scaffold Corner Design — Records Retention Schedule & Legal Hold
# Breadth coverage of every §1.1–§1.7 testable claim not already probed by
# §1.8. Section and claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_applies_config_defaults
        claim_type: defaults
        grounds: [entities.GovernanceProgram]
        distinguishing_aspect: "Omitting every optional config field on program creation applies the declared defaults: ack_deadline_days 14, reminder_interval_days 7, max_reminders_before_escalation 3, stale_hold_days 180, over_preservation_warn_pct 20, ack_sla_mode STRICT."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "Defaults", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id", ackd: "$.data.ack_deadline_days", rem: "$.data.reminder_interval_days", maxr: "$.data.max_reminders_before_escalation", stale: "$.data.stale_hold_days", warn: "$.data.over_preservation_warn_pct", mode: "$.data.ack_sla_mode" }
          trigger:
            - call: "GET /ig/programs/${p}"
              payload: {}
              as: Auditor
              captures: { ackd2: "$.data.ack_deadline_days", v2: $.data.version }
          assert:
            - "ackd == 14, rem == 7, maxr == 3, stale == 180, warn == 20, mode == STRICT"
            - "Re-read agrees: ackd2 == 14 and v2 == 1 (defaults persisted; version starts at 1)"

      - name: create_record_class_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.RecordClass, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required monthly_storage_cost_cents_per_gb on record-class creation is a shape violation -> ERR_INVALID_REQUEST (400), checked before any uniqueness rule."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
          trigger:
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "BROKEN", name: "No rate" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST and no RecordClass with code BROKEN exists"

      - name: get_record_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent record id returns ERR_NOT_FOUND (404); the same holds for a nonexistent hold id."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ig/records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RecordsManager
              captures: { err1: "$.data.error_id" }
            - call: "GET /ig/legal-holds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: LegalCounsel
              captures: { err2: "$.data.error_id" }
          assert:
            - "err1 == ERR_NOT_FOUND (http 404)"
            - "err2 == ERR_NOT_FOUND (http 404)"

      - name: record_create_computes_retention_fields
        claim_type: computed_fields
        grounds: [entities.Record.fields.retention_due_date, entities.Record.fields.disposition_posture, entities.Record.fields.active_hold_count]
        distinguishing_aspect: "Record creation computes retention_due_date, governing_rule_id, disposition_posture, active_hold_count and auto_delete_suspended from the governing rule — none are client-supplied."
        test_recipe:
          setup: ["Program; class; jurisdiction; ACTIVE rule EVENT_DATE 2 months effective 2020-01-01 open-ended"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-2M", retention_months: 2, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
          trigger:
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "Computed", source_system: "ERP", event_date: "2026-05-10T00:00:00Z", size_gb: 3 }
              as: RecordsManager
              captures: { r: "$.data.id", due: "$.data.retention_due_date", gov: "$.data.governing_rule_id", posture: "$.data.disposition_posture", cnt: "$.data.active_hold_count", susp: "$.data.auto_delete_suspended" }
          assert:
            - "due == 2026-07-10T00:00:00Z (event 2026-05-10 + 2 months)"
            - "gov == ${rule}"
            - "posture == ELIGIBLE at default clock 2026-08-01 (due passed)"
            - "cnt == 0 and susp == false and status == ACTIVE"

      - name: record_unscheduled_when_no_rule_covers_event
        claim_type: computed_fields
        grounds: [calculations.governing_rule_selection, entities.Record.fields.governing_rule_id]
        distinguishing_aspect: "A record whose event_date falls outside every ACTIVE rule window for its (class, jurisdiction) gets governing_rule_id null, retention_due_date null, posture UNSCHEDULED — never eligible, never swept."
        test_recipe:
          setup: ["Program; class; jurisdiction; ACTIVE rule window [2025-01-01, 2026-01-01) only"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-2025", retention_months: 6, trigger_basis: "EVENT_DATE", effective_from: "2025-01-01T00:00:00Z", effective_to: "2026-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
          trigger:
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "Old", source_system: "ERP", event_date: "2021-06-01T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { r: "$.data.id", posture: "$.data.disposition_posture", due: "$.data.retention_due_date", gov: "$.data.governing_rule_id" }
            - call: "POST /ig/sweeps/auto-delete"
              payload: { program_id: "${p}", method: "SECURE_ERASE" }
              as: RecordsManager
              captures: { destroyed: "$.data.destroyed_count" }
          assert:
            - "gov == null, due == null, posture == UNSCHEDULED (event 2021-06-01 outside [2025-01-01, 2026-01-01))"
            - "Auto-delete sweep destroys nothing: destroyed == 0 (UNSCHEDULED is never eligible)"

      - name: list_records_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed envelope: 3 records, limit 2 -> 2 rows + has_more true; offset 2 -> 1 row + has_more false."
        test_recipe:
          setup: ["Program; class; jurisdiction; ACTIVE 120-month rule; three records created"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-120", retention_months: 120, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "A", source_system: "ERP", event_date: "2026-01-15T00:00:00Z", size_gb: 1 }
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "B", source_system: "ERP", event_date: "2026-01-15T00:00:00Z", size_gb: 1 }
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "C", source_system: "ERP", event_date: "2026-01-15T00:00:00Z", size_gb: 1 }
              as: RecordsManager
          trigger:
            - call: "GET /ig/records?program_id=${p}&limit=2&offset=0"
              payload: {}
              as: RecordsManager
            - call: "GET /ig/records?program_id=${p}&limit=2&offset=2"
              payload: {}
              as: RecordsManager
          assert:
            - "Page 1 returns exactly 2 data entries with total_count == 3 and has_more == true"
            - "Page 2 (offset=2) returns exactly 1 entry with total_count == 3 and has_more == false"

      - name: jurisdiction_code_unique_per_program_only
        claim_type: type_constraints
        grounds: [entities.Jurisdiction.fields.code, "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "Jurisdiction code uniqueness is program-scoped: duplicate code in the same program -> ERR_DUPLICATE_CODE (409); the same code in a different program succeeds — proving tenant-scoped uniqueness."
        test_recipe:
          setup: ["Programs P1 and P2; jurisdiction US-FED exists in P1"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P1", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /ig/programs"
              payload: { name: "P2", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p1}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p1}", code: "US-FED", name: "Duplicate" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p2}", code: "US-FED", name: "Federal P2" }
              as: PlatformAdmin
              captures: { ok: "$.data.id" }
          assert:
            - "Same-program duplicate rejected: err == ERR_DUPLICATE_CODE"
            - "Cross-program reuse allowed: ${ok} created in ${p2}"

      - name: custodian_email_unique_per_program
        claim_type: type_constraints
        grounds: [entities.Custodian.fields.email, "errors[ERR_DUPLICATE_CUSTODIAN]"]
        distinguishing_aspect: "Second custodian with an existing email in the same program -> ERR_DUPLICATE_CUSTODIAN (409)."
        test_recipe:
          setup: ["Program; custodian c@x.com registered"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/custodians"
              payload: { program_id: "${p}", email: "c@x.com", full_name: "First", department: "Legal" }
              as: RecordsManager
              captures: { c: "$.data.id" }
          trigger:
            - call: "POST /ig/custodians"
              payload: { program_id: "${p}", email: "c@x.com", full_name: "Second", department: "HR" }
              as: RecordsManager
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_DUPLICATE_CUSTODIAN; only one custodian exists (GET /ig/custodians?program_id=${p} total_count == 1)"

      - name: certificate_immutable_system_stamped_documentation
        claim_type: immutability
        grounds: [entities.DestructionCertificate]
        distinguishing_aspect: "DestructionCertificate has common_fields: false — its read payload carries id and created_at but no version/updated_at, and all content fields are system-stamped snapshots taken at destruction time."
        test_recipe:
          setup: ["Program; class DOCS; jurisdiction; ACTIVE 1-month rule; record 'Cert Me' (event 2026-06-01) ELIGIBLE at default clock"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "DOCS", name: "Documents", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-1M", retention_months: 1, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "Cert Me", source_system: "ERP", event_date: "2026-06-01T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { r: "$.data.id" }
          trigger:
            - call: "POST /ig/sweeps/auto-delete"
              payload: { program_id: "${p}", method: "SHRED" }
              as: RecordsManager
              as_user_id: "rm-7"
              captures: { destroyed: "$.data.destroyed_count", certs: "$.data.certificate_ids" }
            - call: "GET /ig/destruction-certificates?record_id=${r}"
              payload: {}
              as: Auditor
              captures: { cert: "$.data[0].id", seq: "$.data[0].certificate_seq", m: "$.data[0].method", wit: "$.data[0].witness_user_id", t: "$.data[0].record_title", d: "$.data[0].retention_due_date", h: "$.data[0].content_hash" }
          assert:
            - "destroyed == 1 and exactly one certificate references record ${r}"
            - "Certificate: certificate_seq == 1 (first in program), method == SHRED, witness_user_id == rm-7, record_title == 'Cert Me', retention_due_date == 2026-07-01T00:00:00Z"
            - "content_hash is a 64-character lowercase hex string; response contains no version field (immutable entity)"

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: rule_invalid_transitions_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RetentionRule, "errors[ERR_RULE_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE rule and withdrawing a DRAFT rule are both invalid-from rejections returning ERR_RULE_INVALID_STATE with no side effects (no conflict created, no version bump)."
        test_recipe:
          setup: ["Program; class; jurisdiction; rule R ACTIVE; rule D in DRAFT"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-ACT", retention_months: 12, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { ra: "$.data.id" }
            - call: "POST /ig/retention-rules/${ra}/activate"
              payload: {}
              as: RecordsManager
              captures: { va: $.data.version }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-DRAFT", retention_months: 24, trigger_basis: "EVENT_DATE", effective_from: "2030-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rd: "$.data.id" }
          trigger:
            - call: "POST /ig/retention-rules/${ra}/activate"
              payload: {}
              as: RecordsManager
              captures: { err1: "$.data.error_id" }
            - call: "POST /ig/retention-rules/${rd}/withdraw"
              payload: {}
              as: RecordsManager
              captures: { err2: "$.data.error_id" }
            - call: "GET /ig/retention-rules/${ra}"
              payload: {}
              as: RecordsManager
              captures: { va_after: "$.data.version" }
          assert:
            - "err1 == ERR_RULE_INVALID_STATE (ACTIVE -> activate)"
            - "err2 == ERR_RULE_INVALID_STATE (DRAFT -> withdraw; withdraw requires PENDING_CONFLICT)"
            - "Rule ${ra} version unchanged (${va} == ${va_after}) — rejected transitions mutate nothing"

      - name: hold_invalid_and_terminal_transitions_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LegalHold, "errors[ERR_HOLD_INVALID_STATE]"]
        distinguishing_aspect: "Cancel on an ISSUED hold is rejected; after a full release, both release and cancel on the RELEASED (terminal) hold are rejected with ERR_HOLD_INVALID_STATE."
        test_recipe:
          setup: ["Program (ack_deadline_days 14); class; jurisdiction; ACTIVE 120-month rule; two records; custodian; hold H1 ISSUED with acked custodian; hold H2 ISSUED"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31, ack_deadline_days: 14 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-120", retention_months: 120, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "R1", source_system: "MAIL", event_date: "2026-01-15T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { r1: "$.data.id" }
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "R2", source_system: "MAIL", event_date: "2026-01-15T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { r2: "$.data.id" }
            - call: "POST /ig/custodians"
              payload: { program_id: "${p}", email: "c@x.com", full_name: "Cust", department: "Legal" }
              as: RecordsManager
              captures: { c: "$.data.id" }
            - call: "POST /ig/legal-holds"
              payload: { program_id: "${p}", matter_ref: "M-H1", title: "H1", reason: "Case 1", custodian_ids: ["${c}"], record_ids: ["${r1}"] }
              as: LegalCounsel
              captures: { h1: "$.data.id" }
            - call: "POST /ig/legal-holds/${h1}/issue"
              payload: {}
              as: LegalCounsel
            - call: "GET /ig/hold-custodians?hold_id=${h1}"
              payload: {}
              as: LegalCounsel
              captures: { a1: "$.data[0].id" }
            - call: "POST /ig/hold-custodians/${a1}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c}"
            - call: "POST /ig/legal-holds"
              payload: { program_id: "${p}", matter_ref: "M-H2", title: "H2", reason: "Case 2", custodian_ids: ["${c}"], record_ids: ["${r2}"] }
              as: LegalCounsel
              captures: { h2: "$.data.id" }
            - call: "POST /ig/legal-holds/${h2}/issue"
              payload: {}
              as: LegalCounsel
          trigger:
            - call: "POST /ig/legal-holds/${h2}/cancel"
              payload: {}
              as: LegalCounsel
              captures: { err_cancel_issued: "$.data.error_id" }
            - call: "GET /ig/legal-holds/${h1}"
              payload: {}
              as: LegalCounsel
              captures: { h1v: "$.data.version" }
            - call: "POST /ig/legal-holds/${h1}/release"
              payload: { release_reason: "matter closed", expected_legal_hold_version: "${h1v}" }
              as: LegalCounsel
              captures: { rel_st: "$.data.status" }
            - call: "GET /ig/legal-holds/${h1}"
              payload: {}
              as: LegalCounsel
              captures: { h1v_post: "$.data.version" }
            - call: "POST /ig/legal-holds/${h1}/release"
              payload: { release_reason: "matter closed", expected_legal_hold_version: "${h1v_post}" }
              as: LegalCounsel
              captures: { err_rerelease: "$.data.error_id" }
            - call: "POST /ig/legal-holds/${h1}/cancel"
              payload: {}
              as: LegalCounsel
              captures: { err_cancel_released: "$.data.error_id" }
          assert:
            - "Cancel on ISSUED hold ${h2}: err_cancel_issued == ERR_HOLD_INVALID_STATE"
            - "Release of ${h1} succeeds (rel_st == RELEASED)"
            - "Second release on terminal RELEASED: err_rerelease == ERR_HOLD_INVALID_STATE"
