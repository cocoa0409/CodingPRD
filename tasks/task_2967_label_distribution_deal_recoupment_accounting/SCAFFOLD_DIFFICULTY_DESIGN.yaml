              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
            - call: "POST /artist-statements"
              payload: { artist_agreement_id: "${agr_b_id}", period_start: "2026-04-01", period_end: "2026-06-30", basis_variant: "FINAL" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
          assert:
            - "the supersession happened as declared: ArtistAgreement.${agr_a_id}.status == SUPERSEDED with unrecouped_artist_advance_cents == 0 and unrecouped_recording_cents == 0"
            - "the balances were carried forward, not reset: ArtistAgreement.${agr_b_id}.status == ACTIVE with unrecouped_artist_advance_cents == 30000 and unrecouped_recording_cents == 10000"
            - "the first trigger returns 409 with error.code == ERR_AGREEMENT_NOT_STATEMENTABLE and creates nothing"
            - "the second trigger returns 201 for the successor agreement, proving the block is a state dependency on the agreement rather than a rule about the release or the period"

      - name: void_liquidation_blocked_by_finalized_statement
        grounds:
          - state_machines.PhysicalRun.PARTIALLY_LIQUIDATED_to_HELD
          - state_machines.ArtistStatement.ISSUED_to_FINALIZED
          - errors[ERR_INVALID_STATEMENT_STATE]
