  - method: GET
    path: "/fleet/projects/{id}/assignments"
    description: "List assignments of a project (sub-resource reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: GET
    path: "/fleet/projects/{id}/damage-reports"
    description: "List damage reports charged to a project (sub-resource reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DamageReport[]
    side_effects: []

  - method: GET
    path: "/fleet/projects/{id}/charges"
    description: "List assignment charges posted to a project (sub-resource reverse reachability)"
    roles: [FleetAdmin, ProjectManager]
    code: 200
    input: ["limit?", "offset?"]
    output: AssignmentCharge[]
    side_effects: []

  - method: GET
    path: "/fleet/projects/{id}/transport-jobs"
    description: "List transport jobs touching a project as origin or destination (sub-resource reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["direction?", "status?", "limit?", "offset?"]
    output: TransportJob[]
    side_effects: []

  - method: GET
    path: "/fleet/projects/{id}/mechanics"
    description: "List mechanics homed at a project (sub-resource reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: Mechanic[]
    side_effects: []

  # --- Assignment ---
  - method: POST
    path: "/fleet/assignments"
    description: "Reserve an assignment (equipment IDLE + SERVICE_OK, no window overlap)"
    roles: [FleetAdmin]
    code: 201
    input: [equipment_id, project_id, start_date, end_date, expected_equipment_version]
    output: Assignment
    side_effects: ["equipment.availability_status -> RESERVED", "increments Equipment.version by 1"]

  - method: GET
    path: "/fleet/assignments/{id}"
    description: "Get one assignment"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/fleet/assignments"
    description: "List assignments; optional filters (filtered-list reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["equipment_id?", "project_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: POST
    path: "/fleet/assignments/{id}/activate"
    description: "Activate a RESERVED assignment (budget + service gates)"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["assignment -> ACTIVE", "equipment -> ON_RENT, current_project_id/current_site_id set", "increments Equipment.version by 1", "project.active_assignment_count recomputed"]

  - method: POST
    path: "/fleet/assignments/{id}/close"
    description: "Close an ACTIVE/SUSPENDED assignment; computes allocation, own-vs-rent, utilization; posts ledger"
    roles: [FleetAdmin]
    code: 200
    input: [close_reason]
    output: Assignment
    side_effects: ["assignment -> CLOSED", "AssignmentCharge created and posted to project.billed_total_cents", "equipment -> IDLE (from ACTIVE) or stays DOWN (from SUSPENDED)", "project.active_assignment_count recomputed", "increments Equipment.version by 1"]

  - method: POST
    path: "/fleet/assignments/{id}/cancel"
    description: "Cancel a RESERVED assignment"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["assignment -> CANCELLED", "equipment -> IDLE", "increments Equipment.version by 1"]

  - method: GET
    path: "/fleet/assignments/{id}/charges"
    description: "Get the AssignmentCharge rows of an assignment (sub-resource reverse reachability; 0 or 1 rows)"
    roles: [FleetAdmin, ProjectManager]
    code: 200
    input: []
    output: AssignmentCharge[]
    side_effects: []

  # --- WorkOrder ---
  - method: POST
    path: "/fleet/work-orders"
