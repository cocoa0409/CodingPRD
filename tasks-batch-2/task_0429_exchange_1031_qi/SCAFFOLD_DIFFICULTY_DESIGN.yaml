              as: QICoordinator
              as_user_id: "coord-w45"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "15 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/identifications"
              payload: { method: "THREE_PROPERTY" }
              as: QICoordinator
              captures: { idn_id: $.data.id }
            - call: "POST /identifications/${idn_id}/candidates"
              payload: { description: "Cand W45", estimated_fmv: 420000 }
              as: QICoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-16T00:00:00Z" }
