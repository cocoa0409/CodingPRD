  - section: validations
    instances:

      - name: duplicate_state_registration_returns_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=27]
          - errors[ERR_DUPLICATE_REGISTRATION]
          - entities.StateRegistration.fields.state_code
        distinguishing_aspect: "A second registration carrying state_code CA for the same group answers HTTP 409 ERR_DUPLICATE_REGISTRATION and leaves exactly one row on the group."
        test_recipe:
          setup:
            - "A TaxpayerGroup with one CA registration."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "Duplicate Reg Group", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
          trigger:
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "SINGLE_SALES_FACTOR", tax_rate: 0.05, throwback_rule: "NONE", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {err_id: $.data.error_id}
          assert:
            - "the response is HTTP 409 with data.error_id == ERR_DUPLICATE_REGISTRATION"
            - "GET /salt/groups/${grp_id}/registrations returns exactly one row"

      - name: duplicate_installment_number_returns_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - errors[ERR_DUPLICATE_INSTALLMENT]
          - entities.EstimatedPayment.fields.installment_number
        distinguishing_aspect: "A second EstimatedPayment for the same (registration_id, tax_year 2026, installment_number 1) answers HTTP 409 ERR_DUPLICATE_INSTALLMENT and does not move total_payments_received."
        test_recipe:
          setup:
            - "A TaxpayerGroup with one CA registration carrying installment 1 of tax_year 2026 at 8000.00."
            - "Logical clock at 2026-08-01T00:00:00Z."
