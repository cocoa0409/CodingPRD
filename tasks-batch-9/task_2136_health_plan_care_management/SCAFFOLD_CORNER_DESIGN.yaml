              captures: { cm_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-5301", full_name: "Cap Cathy", birth_date: "1982-02-02", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { score_before: $.data.score }
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /care-management/social-needs"
              payload: { enrollment_id: "${enr}", domain: "FOOD", severity: "SEVERE" }
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/social-needs"
              payload: { enrollment_id: "${enr}", domain: "HOUSING", severity: "SEVERE" }
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/social-needs"
              payload: { enrollment_id: "${enr}", domain: "TRANSPORTATION", severity: "MODERATE" }
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/social-needs"
