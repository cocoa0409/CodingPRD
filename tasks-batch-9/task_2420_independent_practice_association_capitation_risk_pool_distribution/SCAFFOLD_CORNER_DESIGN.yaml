              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_e3}/enrollees"
              payload: { external_member_id: "E3-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
