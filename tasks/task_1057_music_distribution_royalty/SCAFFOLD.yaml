scenario: "1057. Music Distribution & Royalty (DistroKid/TuneCore style): release & metadata/ISRC, store delivery & takedown, streaming/royalty ingest & split, collaborator payout & 1099, subscription vs commission, pre-save & release-date, YouTube/Content-ID, reporting"
domain_name: "music-distribution-royalty"
api_prefix: "/api"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Release->Track is a tree, but SplitShare is a true many-to-many junction between
  # SplitSheet (per-Track) and Collaborator, RoyaltyLine is a 3-way junction
  # (RoyaltyStatement x Track x Store), and Delivery is a junction (Release x Store).

  state_machine_shape: cyclic
  # Delivery cycles QUEUED->SENT->REJECTED->QUEUED and ACCEPTED->TAKEDOWN_REQUESTED->TAKEN_DOWN;
  # SplitSheet cycles DRAFT->PENDING_ACCEPTANCE->DRAFT; Subscription cycles ACTIVE->PAST_DUE->ACTIVE.
  # Release additionally carries two PARALLEL independent state dimensions
  # (editorial `status` x distribution `delivery_status`) on the same row.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =========================================================================
# §1.1 Entity-Relationship Table
# =========================================================================
entities:

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique plan code, uppercase."
        constraints: "unique across SubscriptionPlan; 2-32 chars"
      - name: name
        type: string
        source: input
        description: "Human readable plan name."
      - name: annual_fee_cents
        type: integer
        source: input
        description: "Yearly subscription price in cents."
        constraints: ">= 0"
      - name: included_release_slots
        type: integer
        source: input
        description: "Maximum number of Releases the subscriber may hold in status IN {SUBMITTED, IN_REVIEW, APPROVED, LIVE} at once."
        constraints: ">= 1"
      - name: commission_bps
        type: integer
        source: input
        description: "Platform commission rate in basis points applied to non-CONTENT_ID royalty gross."
        constraints: "0..10000"
      - name: allows_content_id
        type: boolean
        source: input
        description: "Whether subscribers on this plan may enable YouTube Content-ID on a Track."
        default: false
      - name: status
        type: enum
        source: input
        description: "Plan availability; defaults to ACTIVE when omitted at creation."
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique store code, e.g. SPOTIFY, APPLE, YOUTUBE."
        constraints: "unique across Store"
      - name: name
        type: string
        source: input
        description: "Store display name."
      - name: supports_pre_save
        type: boolean
        source: input
        description: "Whether the store supports pre-save campaigns."
        default: false
      - name: requires_isrc
        type: boolean
        source: input
        description: "Whether the store rejects a delivery when any Track of the Release has a null isrc."
        default: true
      - name: requires_explicit_flag
        type: boolean
        source: input
        description: "Whether the store rejects a delivery when any Track of the Release has explicit == null."
        default: true
      - name: delivery_lead_days
        type: integer
        source: input
        description: "Whole days a delivery must be sent ahead of the Release.release_date."
        constraints: ">= 0"
      - name: surcharge_bps
        type: integer
        source: input
        description: "Store-specific commission surcharge in basis points, entering the weighted surcharge of statement_commission_cents."
        default: 0
        constraints: "0..2000"
      - name: max_concurrent_deliveries
        type: integer
        source: input
        description: "Aggregate capacity: maximum number of buffer-expanded delivery windows on this store that may intersect at any instant."
        default: 2
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: "Store availability; defaults to ACTIVE when omitted at creation. A delivery may only be sent to a store whose status is ACTIVE."
        default: ACTIVE
        constraints: "ACTIVE | PAUSED"

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Public artist name."
      - name: legal_name
        type: string
        source: input
        description: "Legal entity/person name used for payouts."
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of tax residence."
        constraints: "exactly 2 uppercase letters"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across Artist."
        constraints: "unique across Artist"
      - name: status
        type: enum
        source: system
        description: "Account status."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | CLOSED"
      - name: lifetime_gross_cents
        type: integer
        source: computed
        description: "Sum of RoyaltyStatement.gross_cents over this artist's statements with status == CLOSED. Drives the loyalty discount tier of statement_commission_cents."
        default: 0
      - name: live_track_count
        type: integer
        source: computed
        description: "Count of Track rows with status == ACTIVE belonging to Releases of this artist."
        default: 0

  - name: Subscription
    parent: Artist
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the subscriber."
      - name: plan_id
        type: string
        source: input
        description: "FK -> SubscriptionPlan.id; the purchased plan."
      - name: status
        type: enum
        source: system
        description: "Billing lifecycle state."
        default: PENDING
        constraints: "PENDING | ACTIVE | PAST_DUE | EXPIRED | CANCELLED"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent PENDING->ACTIVE or PAST_DUE->ACTIVE transition; null while PENDING."
      - name: past_due_since
        type: datetime
        source: system
        description: "Logical-clock instant the subscription entered PAST_DUE; null otherwise. Grace expiry is measured from this field."
      - name: releases_used
        type: integer
        source: computed
        description: "Count of Releases of this artist whose status IN {SUBMITTED, IN_REVIEW, APPROVED, LIVE}. Conserved quantity of the submit/withdraw compensating pair."
        default: 0
      - name: auto_renew
        type: boolean
        source: input
        description: "Whether the subscription renews automatically."
        default: true

  - name: Release
    parent: Artist
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the owning artist."
      - name: title
        type: string
        source: input
        description: "Release title."
        constraints: "1-200 chars"
      - name: upc
        type: string
        source: input
        description: "Universal Product Code; unique across Release when non-null."
        constraints: "null or exactly 12 digits; unique when non-null"
      - name: release_date
        type: datetime
        source: input
        description: "Scheduled public availability instant (ISO 8601 UTC)."
      - name: primary_genre
        type: string
        source: input
        description: "Primary genre label."
      - name: label_name
        type: string
        source: input
        description: "Record label name."
      - name: status
        type: enum
        source: system
        description: "Editorial dimension of the Release state (independent of delivery_status)."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | IN_REVIEW | APPROVED | REJECTED | LIVE | TAKEN_DOWN"
      - name: delivery_status
        type: enum
        source: system
        description: "Distribution dimension of the Release state, evolving independently of status."
        default: NONE
        constraints: "NONE | QUEUED | PARTIAL | DELIVERED | TAKEDOWN_PENDING | TAKEN_DOWN"
      - name: rejection_reason_code
        type: string
        source: system
        description: "Reason code recorded by DistributionOps on reject; null otherwise."
      - name: pre_save_enabled
        type: boolean
        source: input
        description: "Whether fans may register pre-saves for this Release."
        default: false
      - name: pre_save_opens_at
        type: datetime
        source: input
        description: "Instant from which pre-saves are accepted; null when pre_save_enabled is false."
      - name: pre_save_count
        type: integer
        source: computed
        description: "Number of accepted pre-save registrations."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent DRAFT->SUBMITTED transition."
      - name: taken_down_at
        type: datetime
        source: system
        description: "Logical-clock instant the Release reached status TAKEN_DOWN."

  - name: Track
    parent: Release
    common_fields: true
    fields:
      - name: release_id
        type: string
        source: input
        description: "FK -> Release.id; the owning release."
      - name: title
        type: string
        source: input
        description: "Track title."
      - name: isrc
        type: string
        source: input
        description: "International Standard Recording Code; unique across Track when non-null."
        constraints: "null or exactly 12 alphanumeric chars; unique when non-null"
      - name: duration_seconds
        type: integer
        source: input
        description: "Runtime in whole seconds."
        constraints: ">= 1"
      - name: track_number
        type: integer
        source: input
        description: "1-based ordinal within the Release; unique per release_id."
        constraints: ">= 1; unique per release_id"
      - name: explicit
        type: boolean
        source: input
        description: "Explicit-content flag; null means undeclared."
      - name: content_id_enabled
        type: boolean
        source: input
        description: "Whether YouTube Content-ID monetisation is requested for this track."
        default: false
      - name: status
        type: enum
        source: system
        description: "Track availability."
        default: PENDING
        constraints: "PENDING | ACTIVE | INACTIVE"
      - name: locked_split_sheet_id
        type: string
        source: computed
        description: "Identifier of the SplitSheet of this track whose status is LOCKED, or null when none is locked. Computed pointer, not an input foreign key."

  - name: Collaborator
    parent: Artist
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the artist account that registered this payee."
      - name: name
        type: string
        source: input
        description: "Payee name."
      - name: email
        type: string
        source: input
        description: "Payee email; unique per artist_id."
        constraints: "unique per artist_id"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of tax residence; drives withholding."
        constraints: "exactly 2 uppercase letters"
      - name: tax_form_status
        type: enum
        source: input
        description: "Tax documentation state used by collaborator_withholding_bps."
        default: MISSING
        constraints: "MISSING | SUBMITTED | VERIFIED | EXPIRED"
      - name: payout_method
        type: enum
        source: input
        description: "Payout rail."
        default: PAYPAL
        constraints: "PAYPAL | BANK_TRANSFER"
      - name: withholding_bps
        type: integer
        source: computed
        description: "Current withholding rate in basis points per collaborator_withholding_bps."
        default: 2400
      - name: pending_payout_cents
        type: integer
        source: computed
        description: "Sum of Payout.net_cents for this collaborator with status IN {PENDING, APPROVED}."
        default: 0
      - name: lifetime_paid_cents
        type: integer
        source: computed
        description: "Sum of Payout.net_cents for this collaborator with status == PAID."
        default: 0
      - name: reversed_payout_cents
        type: integer
        source: computed
        description: "Sum of Payout.net_cents for this collaborator with status == REVERSED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Payee availability."
        default: ACTIVE
        constraints: "ACTIVE | ARCHIVED"

  - name: SplitSheet
    parent: Track
    common_fields: true
    fields:
      - name: track_id
        type: string
        source: input
        description: "FK -> Track.id; the recording whose revenue this sheet divides."
      - name: effective_from
        type: datetime
        source: input
        description: "Instant from which this sheet governs revenue allocation."
      - name: status
        type: enum
        source: system
        description: "Sheet lifecycle; cycles PENDING_ACCEPTANCE->DRAFT when any share is rejected."
        default: DRAFT
        constraints: "DRAFT | PENDING_ACCEPTANCE | LOCKED | SUPERSEDED"
      - name: total_share_bps
        type: integer
        source: computed
        description: "Sum of share_bps over this sheet's SplitShare rows."
        default: 0
      - name: accepted_share_count
        type: integer
        source: computed
        description: "Count of this sheet's SplitShare rows with accepted == true."
        default: 0
      - name: locked_at
        type: datetime
        source: system
        description: "Logical-clock instant the sheet reached LOCKED; null otherwise."

  - name: SplitShare
    parent: SplitSheet
    common_fields: true
    fields:
      - name: split_sheet_id
        type: string
        source: input
        description: "FK -> SplitSheet.id; the sheet this share belongs to."
      - name: collaborator_id
        type: string
        source: input
        description: "FK -> Collaborator.id; the payee entitled to this share."
      - name: share_bps
        type: integer
        source: input
        description: "Share of the track's allocated net in basis points."
        constraints: "1..10000; unique (split_sheet_id, collaborator_id)"
      - name: accepted
        type: boolean
        source: system
        description: "Whether the collaborator has accepted this share."
        default: false
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant of acceptance; null when not accepted."

  - name: Delivery
    parent: Release
    common_fields: true
    fields:
      - name: release_id
        type: string
        source: input
        description: "FK -> Release.id; the release being delivered."
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the destination store."
      - name: scheduled_send_at
        type: datetime
        source: input
        description: "Planned dispatch instant; anchors the buffer-expanded occupancy window on the store."
      - name: status
        type: enum
        source: system
        description: "Delivery lifecycle; cyclic via retry and redelivery."
        default: QUEUED
        constraints: "QUEUED | SENT | ACCEPTED | REJECTED | TAKEDOWN_REQUESTED | TAKEN_DOWN"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of QUEUED->SENT transitions this delivery has undergone."
        default: 0
      - name: last_error_code
        type: string
        source: system
        description: "Store-reported error code from the most recent REJECTED acknowledgement; null otherwise."
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent QUEUED->SENT transition."
      - name: taken_down_at
        type: datetime
        source: system
        description: "Logical-clock instant the delivery reached TAKEN_DOWN."

  - name: RoyaltyStatement
    parent: Artist
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the artist the statement belongs to."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the reporting period."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the reporting period; the interval is half-open [period_start, period_end)."
      - name: status
        type: enum
        source: system
        description: "Statement lifecycle."
        default: OPEN
        constraints: "OPEN | INGESTING | RECONCILED | CLOSED"
      - name: line_count
        type: integer
        source: computed
        description: "Count of RoyaltyLine rows attached to this statement."
        default: 0
      - name: gross_cents
        type: integer
        source: computed
        description: "Sum of RoyaltyLine.gross_cents over this statement's lines."
        default: 0
      - name: content_id_gross_cents
        type: integer
        source: computed
        description: "Sum of RoyaltyLine.gross_cents over lines with source == CONTENT_ID."
        default: 0
      - name: commission_cents
        type: integer
        source: computed
        description: "Platform commission per statement_commission_cents; variant depends on reconcile vs close."
        default: 0
      - name: content_id_bonus_cents
        type: integer
        source: computed
        description: "Content-ID tier bonus per content_id_bonus_cents; zero until close."
        default: 0
      - name: provisional_net_cents
        type: integer
        source: computed
        description: "Net payable computed by the PROVISIONAL variant of statement_net_cents at reconcile; retained after close for divergence reporting."
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: "Net payable currently in force; PROVISIONAL value after reconcile, FINAL value after close."
        default: 0
      - name: reconciled_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FinanceOps operator who reconciled; null before reconcile."
      - name: closed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FinanceOps operator who closed; null before close."

  - name: RoyaltyLine
    parent: RoyaltyStatement
    common_fields: false
    fields:
      - name: royalty_statement_id
        type: string
        source: input
        description: "FK -> RoyaltyStatement.id; the statement this line was ingested into."
      - name: track_id
        type: string
        source: input
        description: "FK -> Track.id; the recording that earned the revenue."
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the reporting store."
      - name: units
        type: integer
        source: input
        description: "Reported streams or downloads."
        constraints: ">= 0"
      - name: gross_cents
        type: integer
        source: input
        description: "Reported gross revenue in cents for this line."
        constraints: ">= 0"
      - name: source
        type: enum
        source: input
        description: "Revenue source class."
        constraints: "STREAMING | DOWNLOAD | CONTENT_ID"
      - name: reported_at
        type: datetime
        source: input
        description: "Store-reported instant the revenue was earned; must fall inside [statement.period_start, statement.period_end)."

  - name: Payout
    parent: Collaborator
    common_fields: true
    fields:
      - name: collaborator_id
        type: string
        source: input
        description: "FK -> Collaborator.id; the payee."
      - name: royalty_statement_id
        type: string
        source: input
        description: "FK -> RoyaltyStatement.id; the statement this payout settles."
      - name: gross_cents
        type: integer
        source: computed
        description: "Cents allocated to this collaborator by payout_split_allocation across all tracks of the statement."
        default: 0
      - name: withholding_bps
        type: integer
        source: computed
        description: "Withholding rate pinned at statement close from collaborator_withholding_bps."
        default: 0
      - name: withholding_cents
        type: integer
        source: computed
        description: "Tax withheld per payout_net_cents."
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: "gross_cents minus withholding_cents."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Payout lifecycle."
        default: PENDING
        constraints: "PENDING | APPROVED | PAID | REVERSED"
      - name: auto_approved
        type: boolean
        source: system
        description: "True when the PENDING->APPROVED transition was performed by the close cascade rather than by an operator."
        default: false
      - name: approved_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FinanceOps operator who approved; null when auto_approved is true or still PENDING."
      - name: paid_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FinanceOps operator who paid; null before payment."
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant of payment; anchors the reversal window."
      - name: reversal_reason_code
        type: string
        source: system
        description: "Reason code recorded on reversal; null otherwise."

  - name: TaxForm1099
    parent: Collaborator
    common_fields: true
    fields:
      - name: collaborator_id
        type: string
        source: input
        description: "FK -> Collaborator.id; the payee the form reports."
      - name: tax_year
        type: integer
        source: input
        description: "Calendar year reported; unique per collaborator_id among forms with status IN {DRAFT, ISSUED}."
        constraints: "2020..2100"
      - name: total_paid_cents
        type: integer
        source: computed
        description: "Sum of Payout.net_cents for this collaborator with status == PAID and paid_at inside the tax_year."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Form lifecycle."
        default: DRAFT
        constraints: "DRAFT | ISSUED | VOIDED"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the form was issued; null otherwise."

# =========================================================================
# §1.2 State Machine Table
# =========================================================================
state_machines:

  - entity: Subscription
    initial_state: PENDING
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /api/subscriptions/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == PENDING"
          - "Artist.status == ACTIVE"
        side_effects:
          - "sets Subscription.activated_at to the current logical clock"
          - "sets Subscription.past_due_since to null"
          - "recomputes Subscription.releases_used per calculations.release_slot_usage"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /api/subscriptions/{id}/lapse"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == ACTIVE"
        side_effects:
          - "sets Subscription.past_due_since to the current logical clock"
          - "increments Subscription.version by 1"
        note: "Grace window of SUBSCRIPTION_GRACE_DAYS = 30 runs from past_due_since; release submission stays permitted inside it."
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /api/subscriptions/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == PAST_DUE"
        side_effects:
          - "sets Subscription.activated_at to the current logical clock"
          - "sets Subscription.past_due_since to null"
          - "increments Subscription.version by 1"
        note: "Cycle: ACTIVE -> PAST_DUE -> ACTIVE."
      - from: PAST_DUE
        to: EXPIRED
        trigger: "POST /api/subscriptions/{id}/expire"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == PAST_DUE"
        side_effects:
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/subscriptions/{id}/expire"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == ACTIVE"
          - "subscription.auto_renew == false"
        side_effects:
          - "increments Subscription.version by 1"

  - entity: Release
    initial_state: DRAFT
    terminal_states: [TAKEN_DOWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/releases/{id}/submit"
        actor: Artist
        preconditions:
          - "release.status == DRAFT"
          - "the artist's Subscription.status IN {ACTIVE} OR (Subscription.status == PAST_DUE AND current_clock < past_due_since + 30 days)"
          - "release has at least 1 Track"
          - "release.release_date >= current_clock + MIN_RELEASE_LEAD_DAYS (7) days"
          - "Subscription.releases_used < SubscriptionPlan.included_release_slots"
        side_effects:
          - "sets Release.submitted_at to the current logical clock"
          - "recomputes Subscription.releases_used per calculations.release_slot_usage (increments by 1)"
          - "increments Release.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/releases/{id}/withdraw"
        actor: Artist
        preconditions:
          - "release.status == SUBMITTED"
        side_effects:
          - "clears Release.submitted_at"
          - "recomputes Subscription.releases_used per calculations.release_slot_usage (decrements by 1)"
          - "increments Release.version by 1"
        note: "Compensating action of submit; conserves Subscription.releases_used."
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /api/releases/{id}/review"
        actor: DistributionOps
        preconditions:
          - "release.status == SUBMITTED"
        side_effects:
          - "increments Release.version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /api/releases/{id}/approve"
        actor: DistributionOps
        preconditions:
          - "release.status == IN_REVIEW"
          - "release.upc is non-null"
        side_effects:
          - "increments Release.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /api/releases/{id}/reject"
        actor: DistributionOps
        preconditions:
          - "release.status == IN_REVIEW"
        side_effects:
          - "sets Release.rejection_reason_code from the request body"
          - "recomputes Subscription.releases_used per calculations.release_slot_usage (decrements by 1)"
          - "increments Release.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /api/releases/{id}/withdraw"
        actor: Artist
        preconditions:
          - "release.status == REJECTED"
        side_effects:
          - "clears Release.rejection_reason_code"
          - "increments Release.version by 1"
        note: "Cycle: DRAFT -> SUBMITTED -> IN_REVIEW -> REJECTED -> DRAFT."
      - from: APPROVED
        to: LIVE
        trigger: "POST /api/releases/{id}/go-live"
        actor: DistributionOps
        preconditions:
          - "release.status == APPROVED"
          - "release.delivery_status == DELIVERED"
          - "current logical clock >= release.release_date"
        side_effects:
          - "sets every Track of the release with status == PENDING to status ACTIVE"
          - "recomputes Artist.live_track_count"
          - "increments Release.version by 1"
        note: "Explicit path used when the clock reaches release_date after the last store acknowledgement."
      - from: APPROVED
        to: LIVE
        trigger: "system, on the POST /api/deliveries/{id}/ack that makes Release.delivery_status become DELIVERED"
        actor: system
        preconditions:
          - "release.status == APPROVED"
          - "release.delivery_status == DELIVERED"
          - "current logical clock >= release.release_date"
        side_effects:
          - "sets every Track of the release with status == PENDING to status ACTIVE"
          - "recomputes Artist.live_track_count"
          - "increments Release.version by 1"
      - from: LIVE
        to: TAKEN_DOWN
        trigger: "system, on the POST /api/deliveries/{id}/confirm-takedown that makes Release.delivery_status become TAKEN_DOWN"
        actor: system
        preconditions:
          - "release.status == LIVE"
          - "release.delivery_status == TAKEN_DOWN"
        side_effects:
          - "sets Release.taken_down_at to the current logical clock"
          - "cascade hop 3: sets every Track of the release with status == ACTIVE to status INACTIVE and content_id_enabled = false"
          - "cascade hop 4 (caused by hop 3): recomputes Artist.live_track_count and recomputes Subscription.releases_used per calculations.release_slot_usage"
          - "increments Release.version by 1"

  - entity: Release
    initial_state: NONE
    terminal_states: [TAKEN_DOWN]
    note: "Second, independent state dimension on the same Release row: Release.delivery_status evolves independently of Release.status."
    transitions:
      - from: NONE
        to: QUEUED
        trigger: "POST /api/releases/{id}/deliveries"
        actor: DistributionOps
        preconditions:
          - "release.status IN {APPROVED, LIVE}"
          - "every Track of the release has a SplitSheet with status == LOCKED"
        side_effects:
          - "creates a Delivery in status QUEUED"
          - "increments Release.version by 1"
      - from: QUEUED
        to: PARTIAL
        trigger: "system, on POST /api/deliveries/{id}/ack with outcome ACCEPTED while at least one sibling Delivery is still in {QUEUED, SENT, REJECTED}"
        actor: system
        preconditions:
          - "at least one Delivery of the release has status == ACCEPTED"
          - "at least one Delivery of the release has status IN {QUEUED, SENT, REJECTED}"
        side_effects:
          - "increments Release.version by 1"
      - from: PARTIAL
        to: DELIVERED
        trigger: "system, on POST /api/deliveries/{id}/ack with outcome ACCEPTED that leaves no Delivery of the release in {QUEUED, SENT, REJECTED}"
        actor: system
        preconditions:
          - "every Delivery of the release has status == ACCEPTED"
        side_effects:
          - "may trigger the Release.status APPROVED -> LIVE transition when the clock has reached release_date"
          - "increments Release.version by 1"
      - from: QUEUED
        to: DELIVERED
        trigger: "system, on POST /api/deliveries/{id}/ack with outcome ACCEPTED when the release has exactly one Delivery"
        actor: system
        preconditions:
          - "every Delivery of the release has status == ACCEPTED"
        side_effects:
          - "may trigger the Release.status APPROVED -> LIVE transition when the clock has reached release_date"
          - "increments Release.version by 1"
      - from: DELIVERED
        to: TAKEDOWN_PENDING
        trigger: "POST /api/releases/{id}/takedown"
        actor: Artist
        preconditions:
          - "release.delivery_status == DELIVERED"
        side_effects:
          - "cascade hop 1: sets every Delivery of the release with status == ACCEPTED to status TAKEDOWN_REQUESTED"
          - "increments Release.version by 1"
      - from: TAKEDOWN_PENDING
        to: TAKEN_DOWN
        trigger: "system, on the POST /api/deliveries/{id}/confirm-takedown that leaves no Delivery of the release in {QUEUED, SENT, ACCEPTED, TAKEDOWN_REQUESTED}"
        actor: system
        preconditions:
          - "every Delivery of the release has status IN {TAKEN_DOWN, REJECTED}"
        side_effects:
          - "triggers the Release.status LIVE -> TAKEN_DOWN transition"
          - "increments Release.version by 1"

  - entity: Delivery
    initial_state: QUEUED
    terminal_states: [TAKEN_DOWN]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /api/deliveries/{id}/send"
        actor: DistributionOps
        preconditions:
          - "delivery.status == QUEUED"
          - "Store.status == ACTIVE"
        side_effects:
          - "increments Delivery.attempt_count by 1"
          - "sets Delivery.sent_at to the current logical clock"
          - "increments Delivery.version by 1"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /api/deliveries/{id}/ack with outcome == ACCEPTED"
        actor: DistributionOps
        preconditions:
          - "delivery.status == SENT"
        side_effects:
          - "clears Delivery.last_error_code"
          - "recomputes Release.delivery_status (NONE/QUEUED -> PARTIAL or DELIVERED)"
          - "increments Delivery.version by 1"
      - from: SENT
        to: REJECTED
        trigger: "POST /api/deliveries/{id}/ack with outcome == REJECTED"
        actor: DistributionOps
        preconditions:
          - "delivery.status == SENT"
        side_effects:
          - "sets Delivery.last_error_code from the request body"
          - "increments Delivery.version by 1"
      - from: REJECTED
        to: QUEUED
        trigger: "POST /api/deliveries/{id}/retry"
        actor: DistributionOps
        preconditions:
          - "delivery.status == REJECTED"
          - "delivery.attempt_count < MAX_DELIVERY_ATTEMPTS (3)"
        side_effects:
          - "increments Delivery.version by 1"
        note: "Cycle: QUEUED -> SENT -> REJECTED -> QUEUED."
      - from: ACCEPTED
        to: TAKEDOWN_REQUESTED
        trigger: "system, on POST /api/releases/{id}/takedown"
        actor: system
        preconditions:
          - "delivery.status == ACCEPTED"
        side_effects:
          - "increments Delivery.version by 1"
      - from: TAKEDOWN_REQUESTED
        to: TAKEN_DOWN
        trigger: "POST /api/deliveries/{id}/confirm-takedown"
        actor: DistributionOps
        preconditions:
          - "delivery.status == TAKEDOWN_REQUESTED"
        side_effects:
          - "sets Delivery.taken_down_at to the current logical clock"
          - "cascade hop 2 (caused by hop 1): when no Delivery of the release remains in {QUEUED, SENT, ACCEPTED, TAKEDOWN_REQUESTED}, sets Release.delivery_status = TAKEN_DOWN and Release.status = TAKEN_DOWN"
          - "increments Delivery.version by 1"

  - entity: SplitSheet
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_ACCEPTANCE
        trigger: "POST /api/split-sheets/{id}/send"
        actor: Artist
        preconditions:
          - "sheet.status == DRAFT"
          - "sheet.total_share_bps == SPLIT_TOTAL_BPS (10000)"
          - "sheet has at least 1 SplitShare"
        side_effects:
          - "increments SplitSheet.version by 1"
      - from: PENDING_ACCEPTANCE
        to: DRAFT
        trigger: "POST /api/split-shares/{id}/reject"
        actor: Collaborator
        preconditions:
          - "sheet.status == PENDING_ACCEPTANCE"
          - "share.accepted == false"
        side_effects:
          - "sets accepted = false and accepted_at = null on EVERY SplitShare of the sheet"
          - "recomputes SplitSheet.accepted_share_count to 0"
          - "increments SplitSheet.version by 1"
        note: "Cycle: DRAFT -> PENDING_ACCEPTANCE -> DRAFT."
      - from: PENDING_ACCEPTANCE
        to: LOCKED
        trigger: "POST /api/split-sheets/{id}/lock"
        actor: Artist
        preconditions:
          - "sheet.status == PENDING_ACCEPTANCE"
          - "sheet.total_share_bps == SPLIT_TOTAL_BPS (10000)"
          - "sheet.accepted_share_count == count of the sheet's SplitShare rows AND that count >= 1"
        side_effects:
          - "sets SplitSheet.locked_at to the current logical clock"
          - "sets Track.locked_split_sheet_id to this sheet's id"
          - "moves any other SplitSheet of the same track whose status == LOCKED to SUPERSEDED"
          - "increments SplitSheet.version by 1"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system, on POST /api/split-sheets/{id}/lock of a newer sheet for the same track"
        actor: system
        preconditions:
          - "sheet.status == LOCKED"
        side_effects:
          - "increments SplitSheet.version by 1"

  - entity: RoyaltyStatement
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: INGESTING
        trigger: "POST /api/royalty-statements/{id}/ingest"
        actor: FinanceOps
        preconditions:
          - "statement.status IN {OPEN, INGESTING}"
          - "expected_statement_version matches statement.version"
        side_effects:
          - "appends one RoyaltyLine per submitted line"
          - "recomputes RoyaltyStatement.line_count, gross_cents and content_id_gross_cents"
          - "increments RoyaltyStatement.version by 1"
      - from: INGESTING
        to: INGESTING
        trigger: "POST /api/royalty-statements/{id}/ingest (subsequent batches)"
        actor: FinanceOps
        preconditions:
          - "statement.status == INGESTING"
          - "expected_statement_version matches statement.version"
        side_effects:
          - "appends one RoyaltyLine per submitted line"
          - "recomputes RoyaltyStatement.line_count, gross_cents and content_id_gross_cents"
          - "increments RoyaltyStatement.version by 1"
      - from: INGESTING
        to: RECONCILED
        trigger: "POST /api/royalty-statements/{id}/reconcile"
        actor: FinanceOps
        preconditions:
          - "statement.status == INGESTING"
        side_effects:
          - "computes RoyaltyStatement.commission_cents with the PROVISIONAL variant of calculations.statement_commission_cents"
          - "computes RoyaltyStatement.provisional_net_cents and copies it into net_cents per calculations.statement_net_cents (PROVISIONAL)"
          - "records RoyaltyStatement.reconciled_by_user_id from the X-User-ID header"
          - "increments RoyaltyStatement.version by 1"
      - from: OPEN
        to: RECONCILED
        trigger: "POST /api/royalty-statements/{id}/reconcile"
        actor: FinanceOps
        preconditions:
          - "statement.status == OPEN"
        side_effects:
          - "computes RoyaltyStatement.commission_cents = 0 and provisional_net_cents = 0 (empty line set)"
          - "records RoyaltyStatement.reconciled_by_user_id from the X-User-ID header"
          - "increments RoyaltyStatement.version by 1"
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /api/royalty-statements/{id}/close"
        actor: FinanceOps
        preconditions:
          - "statement.status == RECONCILED"
          - "X-User-ID differs from statement.reconciled_by_user_id (segregation of duties)"
        side_effects:
          - "cascade hop 1: recomputes commission_cents with the FINAL variant, computes content_id_bonus_cents, and sets net_cents per calculations.statement_net_cents (FINAL)"
          - "cascade hop 2 (caused by hop 1): creates one Payout per Collaborator holding a share in the LOCKED SplitSheets of the statement's tracks, per calculations.payout_split_allocation and calculations.payout_net_cents, and increments each Collaborator.pending_payout_cents by the payout's net_cents"
          - "cascade hop 3 (caused by hop 2): every created Payout whose net_cents >= PAYOUT_THRESHOLD_CENTS (2000) auto-transitions PENDING -> APPROVED with auto_approved = true"
          - "increments Artist.lifetime_gross_cents by statement.gross_cents"
          - "records RoyaltyStatement.closed_by_user_id from the X-User-ID header"
          - "increments RoyaltyStatement.version by 1"

  - entity: Payout
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/payouts/{id}/approve"
        actor: FinanceOps
        preconditions:
          - "payout.status == PENDING"
        side_effects:
          - "sets Payout.approved_by_user_id from the X-User-ID header and auto_approved = false"
          - "increments Payout.version by 1"
      - from: PENDING
        to: APPROVED
        trigger: "system, cascade hop 3 of POST /api/royalty-statements/{id}/close"
        actor: system
        preconditions:
          - "payout.net_cents >= PAYOUT_THRESHOLD_CENTS (2000)"
        side_effects:
          - "sets Payout.auto_approved = true and leaves approved_by_user_id null"
          - "increments Payout.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /api/payouts/{id}/pay"
        actor: FinanceOps
        preconditions:
          - "payout.status == APPROVED"
          - "Collaborator.tax_form_status == VERIFIED"
          - "payout.net_cents >= PAYOUT_THRESHOLD_CENTS (2000)"
          - "X-User-ID differs from payout.approved_by_user_id when approved_by_user_id is non-null (segregation of duties)"
        side_effects:
          - "sets Payout.paid_at to the current logical clock and paid_by_user_id from the X-User-ID header"
          - "decrements Collaborator.pending_payout_cents by payout.net_cents and increments Collaborator.lifetime_paid_cents by payout.net_cents"
          - "increments Payout.version by 1"
      - from: PAID
        to: REVERSED
        trigger: "POST /api/payouts/{id}/reverse"
        actor: FinanceOps
        preconditions:
          - "payout.status == PAID"
          - "current logical clock < payout.paid_at + PAYOUT_REVERSAL_WINDOW_DAYS (90) days"
        side_effects:
          - "sets Payout.reversal_reason_code from the request body"
          - "decrements Collaborator.lifetime_paid_cents by payout.net_cents and increments Collaborator.reversed_payout_cents by payout.net_cents"
          - "increments Payout.version by 1"
        note: "Compensating action of pay; conserves pending_payout_cents + lifetime_paid_cents against the {PENDING, APPROVED, PAID} payout set."

  - entity: TaxForm1099
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/tax-forms/{id}/issue"
        actor: FinanceOps
        preconditions:
          - "form.status == DRAFT"
          - "form.total_paid_cents >= TAX_1099_THRESHOLD_CENTS (60000)"
        side_effects:
          - "sets TaxForm1099.issued_at to the current logical clock"
          - "increments TaxForm1099.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /api/tax-forms/{id}/void"
        actor: FinanceOps
        preconditions:
          - "form.status == ISSUED"
        side_effects:
          - "increments TaxForm1099.version by 1"

# =========================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =========================================================================
concurrency_rules:
  - rule_id: split-sheet-create-stale-track
    parent_entity: Track
    write_endpoint: "POST /api/split-sheets"
    occ_field: "expected_track_version"
    description: |
      Creating a SplitSheet against a Track whose version has advanced since the
      client last observed it is rejected with a stale-version error. A newly
      locked sheet legitimately supersedes the prior one under the SplitSheet
      LOCKED -> SUPERSEDED transition, so a second create is not blocked by any
      state precondition; the client's stale view of the Track is the only signal.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: royalty-ingest-stale-statement
    parent_entity: RoyaltyStatement
    write_endpoint: "POST /api/royalty-statements/{id}/ingest"
    occ_field: "expected_statement_version"
    description: |
      Appending a royalty batch to a statement whose version has advanced since the
      client last observed it is rejected with a stale-version error. Ingest is
      append-only and a repeat batch would otherwise be accepted, so the stale
      version is the only way to detect a duplicated or superseded feed file.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =========================================================================
# Domain constants (every named constant used anywhere in this scaffold)
# =========================================================================
domain_constants:
  MIN_RELEASE_LEAD_DAYS: 7
  SUBSCRIPTION_GRACE_DAYS: 30
  MAX_DELIVERY_ATTEMPTS: 3
  SPLIT_TOTAL_BPS: 10000
  STORE_DELIVERY_WINDOW_MINUTES: 60
  STORE_DELIVERY_BUFFER_MINUTES: 15
  PAYOUT_THRESHOLD_CENTS: 2000
  PAYOUT_REVERSAL_WINDOW_DAYS: 90
  TAX_1099_THRESHOLD_CENTS: 60000
  MIN_COMMISSION_CENTS: 50
  COMMISSION_CAP_BPS: 2000
  CONTENT_ID_COMMISSION_BPS: 3000
  BACKUP_WITHHOLDING_BPS: 2400
  US_WITHHOLDING_BPS: 0
  TREATY_REDUCED_WITHHOLDING_BPS: 1000
  DEFAULT_FOREIGN_WITHHOLDING_BPS: 3000
  TREATY_COUNTRIES: ["GB", "DE", "NL", "AU", "JP"]
  LOYALTY_TIER_1_MIN_GROSS_CENTS: 100000
  LOYALTY_TIER_1_DISCOUNT_BPS: 100
  LOYALTY_TIER_2_MIN_GROSS_CENTS: 500000
  LOYALTY_TIER_2_DISCOUNT_BPS: 250
  CONTENT_ID_BONUS_TIER_1_MIN_CENTS: 50000
  CONTENT_ID_BONUS_TIER_1_BPS: 200
  CONTENT_ID_BONUS_TIER_2_MIN_CENTS: 200000
  CONTENT_ID_BONUS_TIER_2_BPS: 500
  SERVER_DEFAULT_CLOCK_UTC: "2026-07-01T00:00:00Z"

# =========================================================================
# §1.3 Calculation Rules Table
# =========================================================================
calculations:

  - name: release_slot_usage
    trigger: "on Release submit / withdraw / reject / approve, and on the LIVE -> TAKEN_DOWN transition; recomputed on Subscription activate"
    algorithm: aggregation
    formula: |
      Subscription.releases_used =
        count(Release r
              where r.artist_id == subscription.artist_id
                and r.status IN {SUBMITTED, IN_REVIEW, APPROVED, LIVE})
    input_set: "Releases of the subscription's artist whose status is one of SUBMITTED, IN_REVIEW, APPROVED, LIVE. DRAFT, REJECTED and TAKEN_DOWN releases are excluded."
    constants: {}
    precision: "integer count, no rounding"

  - name: statement_gross_cents
    trigger: "on POST /api/royalty-statements/{id}/ingest"
    algorithm: aggregation
    formula: |
      RoyaltyStatement.gross_cents            = sum(l.gross_cents for l in lines(statement))
      RoyaltyStatement.content_id_gross_cents = sum(l.gross_cents for l in lines(statement) if l.source == "CONTENT_ID")
      RoyaltyStatement.line_count             = count(lines(statement))
      non_cid_gross_cents                     = gross_cents - content_id_gross_cents
    input_set: "Every RoyaltyLine whose royalty_statement_id equals this statement's id; RoyaltyLine is append-only so no status filter applies."
    constants: {}
    precision: "integer cents, no rounding"

  - name: statement_commission_cents
    trigger: "on POST /api/royalty-statements/{id}/reconcile (PROVISIONAL variant) and on POST /api/royalty-statements/{id}/close (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      # --- Step 1: loyalty discount tier, selected from the artist's CLOSED-statement history ---
      g = Artist.lifetime_gross_cents        # excludes the statement being reconciled/closed
      loyalty_discount_bps = 250 if g >= 500000
                             else 100 if g >= 100000
                             else 0

      # --- Step 2: gross-weighted store surcharge (HALF_UP to whole bps) ---
      if statement.gross_cents == 0:
          weighted_surcharge_bps = 0
      else:
          weighted_surcharge_bps = round_half_up(
              sum(l.gross_cents * store(l.store_id).surcharge_bps for l in lines(statement))
              / statement.gross_cents )

      # --- Step 3: effective rate, clamped to [0, 10000] ---
      effective_bps = max(0, min(10000,
          plan.commission_bps - loyalty_discount_bps + weighted_surcharge_bps))

      # --- Step 4: variant-dependent basis ---
      if variant == "PROVISIONAL":
          raw = round_half_up(statement.gross_cents * effective_bps / 10000)
      else:  # FINAL
          raw = round_half_up(non_cid_gross_cents * effective_bps / 10000) \
              + round_half_up(statement.content_id_gross_cents * CONTENT_ID_COMMISSION_BPS / 10000)

      # --- Step 5: floor and cap ---
      cap = round_half_up(statement.gross_cents * COMMISSION_CAP_BPS / 10000)
      commission_cents = 0 if statement.gross_cents == 0
                         else max(MIN_COMMISSION_CENTS, min(raw, cap))
    input_set: "All RoyaltyLine rows of the statement. plan is the SubscriptionPlan of the artist's Subscription (the Subscription row with status IN {ACTIVE, PAST_DUE, EXPIRED, CANCELLED} having the greatest created_at for that artist)."
    constants:
      MIN_COMMISSION_CENTS: 50
      COMMISSION_CAP_BPS: 2000
      CONTENT_ID_COMMISSION_BPS: 3000
      LOYALTY_TIER_1_MIN_GROSS_CENTS: 100000
      LOYALTY_TIER_1_DISCOUNT_BPS: 100
      LOYALTY_TIER_2_MIN_GROSS_CENTS: 500000
      LOYALTY_TIER_2_DISCOUNT_BPS: 250
    precision: "whole cents, round_half_up; the weighted surcharge is rounded to whole basis points BEFORE it enters effective_bps"
    variants:
      - name: PROVISIONAL
        when: "computed at POST /api/royalty-statements/{id}/reconcile"
        difference: "The whole statement gross is commissioned at effective_bps, including CONTENT_ID revenue."
      - name: FINAL
        when: "recomputed at POST /api/royalty-statements/{id}/close"
        difference: "CONTENT_ID revenue is split out of the plan-rate basis and commissioned at CONTENT_ID_COMMISSION_BPS = 3000 instead, so identical line data yields a different commission than PROVISIONAL whenever content_id_gross_cents > 0 and effective_bps != 3000."

  - name: content_id_bonus_cents
    trigger: "on POST /api/royalty-statements/{id}/close only"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED: the tier is selected from the PRE-BONUS
      # content_id_gross_cents. The bonus is never fed back into tier selection,
      # even though the bonus is later added to the same statement total.
      c = statement.content_id_gross_cents
      bonus_tier_bps = 500 if c >= 200000
                       else 200 if c >= 50000
                       else 0
      content_id_bonus_cents = round_half_up(c * bonus_tier_bps / 10000)
    input_set: "RoyaltyLine rows of the statement with source == CONTENT_ID."
    constants:
      CONTENT_ID_BONUS_TIER_1_MIN_CENTS: 50000
      CONTENT_ID_BONUS_TIER_1_BPS: 200
      CONTENT_ID_BONUS_TIER_2_MIN_CENTS: 200000
      CONTENT_ID_BONUS_TIER_2_BPS: 500
    precision: "whole cents, round_half_up"

  - name: statement_net_cents
    trigger: "on POST /api/royalty-statements/{id}/reconcile (PROVISIONAL) and POST /api/royalty-statements/{id}/close (FINAL)"
    algorithm: aggregation
    formula: |
      if variant == "PROVISIONAL":
          provisional_net_cents = statement.gross_cents - commission_cents(PROVISIONAL)
          net_cents             = provisional_net_cents
          content_id_bonus_cents = 0
      else:  # FINAL
          net_cents = statement.gross_cents
                    - commission_cents(FINAL)
                    + content_id_bonus_cents
          # provisional_net_cents is retained unchanged for divergence reporting
    input_set: "The statement's own computed gross_cents, commission_cents and content_id_bonus_cents."
    constants: {}
    precision: "whole cents; no further rounding — the inputs are already whole cents"
    variants:
      - name: PROVISIONAL
        when: "reconcile"
        difference: "Content-ID bonus is excluded and CONTENT_ID gross is commissioned at the plan rate."
      - name: FINAL
        when: "close"
        difference: "Content-ID bonus is credited and CONTENT_ID gross is commissioned at 3000 bps."

  - name: collaborator_withholding_bps
    trigger: "on PATCH /api/collaborators/{id} and pinned onto each Payout at POST /api/royalty-statements/{id}/close"
    algorithm: threshold
    formula: |
      if collaborator.tax_form_status IN {MISSING, EXPIRED}:
          withholding_bps = BACKUP_WITHHOLDING_BPS          # 2400  (variant BACKUP)
      elif collaborator.country_code == "US":
          withholding_bps = US_WITHHOLDING_BPS              # 0
      elif collaborator.country_code IN TREATY_COUNTRIES and collaborator.tax_form_status == "VERIFIED":
          withholding_bps = TREATY_REDUCED_WITHHOLDING_BPS  # 1000  (variant TREATY)
      else:
          withholding_bps = DEFAULT_FOREIGN_WITHHOLDING_BPS # 3000  (variant STATUTORY)
    input_set: "The Collaborator's own country_code and tax_form_status; no other entity participates."
    constants:
      BACKUP_WITHHOLDING_BPS: 2400
      US_WITHHOLDING_BPS: 0
      TREATY_REDUCED_WITHHOLDING_BPS: 1000
      DEFAULT_FOREIGN_WITHHOLDING_BPS: 3000
      TREATY_COUNTRIES: ["GB", "DE", "NL", "AU", "JP"]
    precision: "whole basis points"
    variants:
      - name: TREATY
        when: "country_code IN TREATY_COUNTRIES and tax_form_status == VERIFIED"
        difference: "Withholds 1000 bps."
      - name: STATUTORY
        when: "country_code IN TREATY_COUNTRIES but tax_form_status == SUBMITTED (not yet VERIFIED)"
        difference: "Withholds 3000 bps — identical payee country and identical gross yield a different net than TREATY."
      - name: BACKUP
        when: "tax_form_status IN {MISSING, EXPIRED}, regardless of country"
        difference: "Withholds 2400 bps and overrides both the US zero rate and any treaty rate."

  - name: payout_split_allocation
    trigger: "on POST /api/royalty-statements/{id}/close, after statement_net_cents (FINAL)"
    algorithm: waterfall_allocation
    formula: |
      # ===== ROUNDING ORDER IS PINNED: floor-then-largest-remainder at EACH of the
      # ===== two levels. "round each share then sum" is explicitly NOT the rule and
      # ===== yields a different cent distribution.

      N  = statement.net_cents
      G  = statement.gross_cents
      T  = [tracks with at least one RoyaltyLine in this statement]

      # ---- Level 1: net across tracks ----
      if G == 0:  track_net[t] = 0 for all t
      else:
        raw_track[t]  = N * track_gross_cents[t] / G          # exact rational
        track_net[t]  = floor(raw_track[t])
        residual_1    = N - sum(track_net[t] for t in T)
        order tracks by (frac(raw_track[t]) DESC, Track.created_at ASC)
        give 1 extra cent to each of the first residual_1 tracks in that order

      # ---- Level 2: each track's net across its shares ----
      sheet[t]        = the SplitSheet of t with status == LOCKED (Track.locked_split_sheet_id)
      shares[t]       = SplitShare rows of sheet[t]
      raw_share[t,s]  = track_net[t] * s.share_bps / 10000     # exact rational
      share_cents[t,s]= floor(raw_share[t,s])
      residual_2[t]   = track_net[t] - sum(share_cents[t,s] for s in shares[t])
      order shares by (frac(raw_share[t,s]) DESC, s.share_bps DESC, SplitShare.created_at ASC)
      give 1 extra cent to each of the first residual_2[t] shares in that order

      # ---- Level 3: fold to one Payout per collaborator ----
      Payout(collaborator c).gross_cents = sum(share_cents[t,s] for all t, for s in shares[t] if s.collaborator_id == c)

      # INVARIANT: sum over all created Payouts of gross_cents == statement.net_cents, exactly.
    input_set: "Tracks having at least one RoyaltyLine in this statement; for each such track, the SplitShare rows of its single LOCKED SplitSheet. Tracks with no LOCKED sheet cannot occur because POST /api/releases/{id}/deliveries requires every track to hold a LOCKED sheet."
    constants:
      SPLIT_TOTAL_BPS: 10000
    precision: "whole cents; floor at each level with largest-remainder distribution of the residual; ties broken by Track.created_at ASC (level 1) and by share_bps DESC then SplitShare.created_at ASC (level 2)"

  - name: payout_net_cents
    trigger: "on POST /api/royalty-statements/{id}/close, after payout_split_allocation"
    algorithm: aggregation
    formula: |
      payout.withholding_bps   = collaborator_withholding_bps(collaborator)  # pinned at close
      payout.withholding_cents = round_half_up(payout.gross_cents * payout.withholding_bps / 10000)
      payout.net_cents         = payout.gross_cents - payout.withholding_cents
    input_set: "The single Payout row and its Collaborator."
    constants: {}
    precision: "whole cents, round_half_up on the withholding"

  - name: collaborator_balance_invariant
    trigger: "on POST /api/payouts/{id}/approve, /pay and /reverse, and on the close cascade that creates payouts"
    algorithm: aggregation
    formula: |
      Collaborator.pending_payout_cents  = sum(p.net_cents for p in payouts(c) if p.status IN {PENDING, APPROVED})
      Collaborator.lifetime_paid_cents   = sum(p.net_cents for p in payouts(c) if p.status == "PAID")
      Collaborator.reversed_payout_cents = sum(p.net_cents for p in payouts(c) if p.status == "REVERSED")

      # NAMED CONSERVED QUANTITY (money):
      #   collaborator_settled_total_cents(c) =
      #       Collaborator.pending_payout_cents
      #     + Collaborator.lifetime_paid_cents
      #     + Collaborator.reversed_payout_cents
      # The forward action POST /api/payouts/{id}/pay moves net_cents from the
      # pending bucket to the paid bucket; the compensating action
      # POST /api/payouts/{id}/reverse moves the same net_cents from the paid
      # bucket to the reversed bucket. collaborator_settled_total_cents is
      # therefore identical before pay, after pay and after reverse — zero drift.
      #
      # Secondary identity that must also hold at every observable instant:
      #   pending_payout_cents + lifetime_paid_cents
      #     == sum(p.net_cents for p in payouts(c) if p.status IN {PENDING, APPROVED, PAID})
    input_set: "All Payout rows whose collaborator_id equals this collaborator's id."
    constants: {}
    precision: "integer cents"

  - name: tax_form_total_paid_cents
    trigger: "on POST /api/tax-forms (creation) and recomputed on POST /api/tax-forms/{id}/issue"
    algorithm: aggregation
    formula: |
      TaxForm1099.total_paid_cents =
        sum(p.net_cents for p in payouts(collaborator)
            if p.status == "PAID"
            and form.tax_year == year_of(p.paid_at))
    input_set: "Payout rows of the collaborator with status == PAID whose paid_at falls in the calendar year tax_year (UTC). REVERSED payouts are excluded, so a reversal before issue lowers the reported total."
    constants:
      TAX_1099_THRESHOLD_CENTS: 60000
    precision: "integer cents"

  - name: store_window_occupancy
    trigger: "on POST /api/releases/{id}/deliveries, before the Delivery row is created"
    algorithm: interval_merge
    formula: |
      # Buffer-expanded, half-open occupancy interval of a delivery d on its store:
      win(d) = [ d.scheduled_send_at - 15 minutes ,
                 d.scheduled_send_at + 60 minutes + 15 minutes )

      occupancy = count(existing Delivery e
                        where e.store_id == new.store_id
                          and e.status IN {QUEUED, SENT}
                          and win(e) intersects win(new) with a non-empty intersection)

      reject with ERR_STORE_WINDOW_SATURATED when
          occupancy >= store.max_concurrent_deliveries
    input_set: "Deliveries on the same store with status IN {QUEUED, SENT}. ACCEPTED, REJECTED, TAKEDOWN_REQUESTED and TAKEN_DOWN deliveries no longer occupy the store."
    constants:
      STORE_DELIVERY_WINDOW_MINUTES: 60
      STORE_DELIVERY_BUFFER_MINUTES: 15
    precision: "minute-resolution instants; the interval is closed on the left and open on the right, so two windows touching exactly at an endpoint do NOT intersect"

  - name: statement_period_overlap
    trigger: "on POST /api/royalty-statements"
    algorithm: interval_merge
    formula: |
      # Pairwise half-open interval test on the Artist as the occupied resource.
      overlaps = exists(RoyaltyStatement s
                        where s.artist_id == new.artist_id
                          and s.period_start < new.period_end
                          and new.period_start < s.period_end)
      reject with ERR_STATEMENT_PERIOD_OVERLAP when overlaps
      # Adjacency is allowed: s.period_end == new.period_start passes.
    input_set: "All RoyaltyStatement rows of the same artist, in every status (OPEN, INGESTING, RECONCILED, CLOSED)."
    constants: {}
    precision: "instant comparison on half-open intervals [period_start, period_end)"

# =========================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =========================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /api/releases/{id}/pre-saves, which accepts role Fan with any X-User-ID"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID owns the addressed resource (Artist owns the Release/Track/Collaborator/SplitSheet chain; Collaborator owns the SplitShare/Payout)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "all endpoints whose roles include Artist or Collaborator"

  - priority: 4
    category: business_constraint
    check: "request body parses, all required input fields are present, enum members and numeric ranges are legal, and identifier formats match (upc = 12 digits, isrc = 12 alphanumerics, country_code = 2 uppercase letters)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: existence
    check: "every path-templated resource exists, validated left to right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys"

  - priority: 7
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/split-sheets, POST /api/royalty-statements/{id}/ingest"

  - priority: 9
    category: business_safety
    check: "segregation of duties: the acting X-User-ID differs from the operator recorded on the prior step (statement.reconciled_by_user_id on close; payout.approved_by_user_id on pay when non-null)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/royalty-statements/{id}/close, POST /api/payouts/{id}/pay"

  - priority: 10
    category: business_safety
    check: "store metadata compliance: when Store.requires_explicit_flag is true, every Track of the Release has a non-null explicit flag"
    error_id: ERR_METADATA_NONCOMPLIANT
    http_status: 422
    applies_to: "POST /api/releases/{id}/deliveries"

  - priority: 11
    category: business_referential
    check: "when Store.requires_isrc is true, every Track of the Release has a non-null isrc"
    error_id: ERR_ISRC_MISSING
    http_status: 422
    applies_to: "POST /api/releases/{id}/deliveries"

  - priority: 12
    category: business_referential
    check: "every Track of the Release has a SplitSheet with status == LOCKED"
    error_id: ERR_SPLIT_SHEET_NOT_LOCKED
    http_status: 409
    applies_to: "POST /api/releases/{id}/deliveries"

  - priority: 13
    category: business_constraint
    check: "the SplitSheet has at least one SplitShare"
    error_id: ERR_SPLIT_SHEET_EMPTY
    http_status: 422
    applies_to: "POST /api/split-sheets/{id}/send, POST /api/split-sheets/{id}/lock"

  - priority: 14
    category: business_constraint
    check: "the sum of the sheet's SplitShare.share_bps equals SPLIT_TOTAL_BPS (10000)"
    error_id: ERR_SPLIT_TOTAL_INVALID
    http_status: 422
    applies_to: "POST /api/split-sheets/{id}/send, POST /api/split-sheets/{id}/lock"

  - priority: 15
    category: business_constraint
    check: "every SplitShare of the sheet has accepted == true"
    error_id: ERR_SPLIT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /api/split-sheets/{id}/lock"

  - priority: 16
    category: business_constraint
    check: "identifier uniqueness: Release.upc, Track.isrc, SubscriptionPlan.code, Store.code, Artist.email, Collaborator.email per artist_id, Track.track_number per release_id, SplitShare (split_sheet_id, collaborator_id), TaxForm1099 (collaborator_id, tax_year) among forms with status IN {DRAFT, ISSUED}"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /api/subscription-plans, POST /api/stores, POST /api/artists, POST /api/collaborators, POST /api/releases, PATCH /api/releases/{id}, POST /api/releases/{id}/tracks, PATCH /api/tracks/{id}, POST /api/split-sheets/{id}/shares, POST /api/tax-forms"

  - priority: 17
    category: business_temporal
    check: "release_date >= current logical clock + MIN_RELEASE_LEAD_DAYS (7) days"
    error_id: ERR_RELEASE_DATE_TOO_SOON
    http_status: 422
    applies_to: "POST /api/releases/{id}/submit"

  - priority: 18
    category: business_temporal
    check: "scheduled_send_at + Store.delivery_lead_days days <= Release.release_date (equality passes)"
    error_id: ERR_DELIVERY_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /api/releases/{id}/deliveries"

  - priority: 19
    category: business_temporal
    check: "store window occupancy per calculations.store_window_occupancy is below Store.max_concurrent_deliveries"
    error_id: ERR_STORE_WINDOW_SATURATED
    http_status: 409
    applies_to: "POST /api/releases/{id}/deliveries"

  - priority: 20
    category: business_temporal
    check: "the new statement's half-open period does not overlap any existing statement of the same artist per calculations.statement_period_overlap"
    error_id: ERR_STATEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /api/royalty-statements"

  - priority: 21
    category: business_temporal
    check: "every ingested line's reported_at falls inside [statement.period_start, statement.period_end)"
    error_id: ERR_LINE_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST /api/royalty-statements/{id}/ingest"

  - priority: 22
    category: business_temporal
    check: "Release.pre_save_enabled is true and pre_save_opens_at <= current logical clock < Release.release_date"
    error_id: ERR_PRE_SAVE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /api/releases/{id}/pre-saves"

  - priority: 23
    category: business_temporal
    check: "current logical clock < payout.paid_at + PAYOUT_REVERSAL_WINDOW_DAYS (90) days"
    error_id: ERR_REVERSAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/payouts/{id}/reverse"

  - priority: 24
    category: business_fiscal
    check: "the artist's Subscription.status == ACTIVE, or == PAST_DUE with current clock < past_due_since + SUBSCRIPTION_GRACE_DAYS (30) days"
    error_id: ERR_SUBSCRIPTION_INACTIVE
    http_status: 402
    applies_to: "POST /api/releases/{id}/submit"

  - priority: 25
    category: business_fiscal
    check: "Subscription.releases_used < SubscriptionPlan.included_release_slots"
    error_id: ERR_RELEASE_SLOTS_EXHAUSTED
    http_status: 402
    applies_to: "POST /api/releases/{id}/submit"

  - priority: 26
    category: business_fiscal
    check: "the artist's SubscriptionPlan.allows_content_id is true when content_id_enabled is being set to true"
    error_id: ERR_CONTENT_ID_NOT_ENTITLED
    http_status: 403
    applies_to: "POST /api/releases/{id}/tracks, PATCH /api/tracks/{id}"

  - priority: 27
    category: business_fiscal
    check: "the payee's Collaborator.tax_form_status == VERIFIED"
    error_id: ERR_TAX_FORM_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /api/payouts/{id}/pay"

  - priority: 28
    category: business_fiscal
    check: "payout.net_cents >= PAYOUT_THRESHOLD_CENTS (2000)"
    error_id: ERR_PAYOUT_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /api/payouts/{id}/pay"

  - priority: 29
    category: business_fiscal
    check: "TaxForm1099.total_paid_cents >= TAX_1099_THRESHOLD_CENTS (60000)"
    error_id: ERR_1099_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /api/tax-forms/{id}/issue"

  - priority: 30
    category: business_temporal
    check: "current logical clock >= Release.release_date"
    error_id: ERR_RELEASE_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /api/releases/{id}/go-live"

# =========================================================================
# §1.5 API Endpoint Table
# =========================================================================
endpoints:

  # ---- test-driving: logical clock -------------------------------------
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is exactly 2026-07-01T00:00:00Z; before any call to this endpoint the server MUST read that instant and MUST NOT fall back to real wall-clock time. Every deadline, grace window, lead-time and expiry rule in this scaffold reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["repositions the logical clock; no entity is mutated"]

  # ---- subscription plans ----------------------------------------------
  - method: POST
    path: "/api/subscription-plans"
    description: "Creates a subscription plan."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, annual_fee_cents, included_release_slots, commission_bps, "allows_content_id?", "status?"]
    output: SubscriptionPlan
    side_effects: ["none"]
  - method: GET
    path: "/api/subscription-plans/{id}"
    description: "Reads one subscription plan."
    roles: [PlatformAdmin, Artist, FinanceOps, DistributionOps]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []
  - method: GET
    path: "/api/subscription-plans"
    description: "Lists subscription plans."
    roles: [PlatformAdmin, Artist, FinanceOps, DistributionOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SubscriptionPlan[]
    side_effects: []

  # ---- stores ------------------------------------------------------------
  - method: POST
    path: "/api/stores"
    description: "Creates a store (delivery destination)."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, delivery_lead_days, "supports_pre_save?", "requires_isrc?", "requires_explicit_flag?", "surcharge_bps?", "max_concurrent_deliveries?", "status?"]
    output: Store
    side_effects: ["none"]
  - method: GET
    path: "/api/stores/{id}"
    description: "Reads one store."
    roles: [PlatformAdmin, DistributionOps, FinanceOps, Artist]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: GET
    path: "/api/stores"
    description: "Lists stores."
    roles: [PlatformAdmin, DistributionOps, FinanceOps, Artist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  # ---- artists -----------------------------------------------------------
  - method: POST
    path: "/api/artists"
    description: "Registers an artist account."
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, legal_name, country_code, email]
    output: Artist
    side_effects: ["initialises lifetime_gross_cents and live_track_count to 0"]
  - method: GET
    path: "/api/artists/{id}"
    description: "Reads one artist."
    roles: [PlatformAdmin, Artist, FinanceOps, DistributionOps]
    code: 200
    input: []
    output: Artist
    side_effects: []
  - method: GET
    path: "/api/artists"
    description: "Lists artists."
    roles: [PlatformAdmin, FinanceOps, DistributionOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []
  - method: PATCH
    path: "/api/artists/{id}"
    description: "Updates mutable artist attributes."
    roles: [PlatformAdmin]
    code: 200
    input: ["display_name?", "legal_name?", "country_code?", "status?"]
    output: Artist
    side_effects: ["increments Artist.version by 1"]

  # ---- subscriptions -----------------------------------------------------
  - method: POST
    path: "/api/subscriptions"
    description: "Creates a PENDING subscription for an artist on a plan."
    roles: [PlatformAdmin]
    code: 201
    input: [artist_id, plan_id, "auto_renew?"]
    output: Subscription
    side_effects: ["creates the Subscription in status PENDING with releases_used = 0"]
  - method: GET
    path: "/api/subscriptions/{id}"
    description: "Reads one subscription."
    roles: [PlatformAdmin, Artist, FinanceOps]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/api/subscriptions"
    description: "Lists subscriptions, filterable by owning artist or plan."
    roles: [PlatformAdmin, Artist, FinanceOps]
    code: 200
    input: ["artist_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/api/subscriptions/{id}/activate"
    description: "Activates a PENDING subscription or restores a PAST_DUE one."
    roles: [PlatformAdmin]
    code: 200
    input: [payment_reference]
    output: Subscription
    side_effects: ["sets activated_at", "clears past_due_since", "recomputes releases_used", "increments Subscription.version by 1"]
  - method: POST
    path: "/api/subscriptions/{id}/lapse"
    description: "Marks an ACTIVE subscription PAST_DUE and starts the 30-day grace window."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["sets past_due_since to the logical clock", "increments Subscription.version by 1"]
  - method: POST
    path: "/api/subscriptions/{id}/expire"
    description: "Expires a PAST_DUE subscription, or cancels an ACTIVE subscription whose auto_renew is false."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["increments Subscription.version by 1"]

  # ---- releases ----------------------------------------------------------
  - method: POST
    path: "/api/releases"
    description: "Creates a DRAFT release."
    roles: [Artist]
    code: 201
    input: [artist_id, title, release_date, primary_genre, label_name, "upc?", "pre_save_enabled?", "pre_save_opens_at?"]
    output: Release
    side_effects: ["creates the Release with status DRAFT and delivery_status NONE"]
  - method: GET
    path: "/api/releases/{id}"
    description: "Reads one release."
    roles: [Artist, DistributionOps, FinanceOps, PlatformAdmin]
    code: 200
    input: []
    output: Release
    side_effects: []
  - method: GET
    path: "/api/releases"
    description: "Lists releases, filterable by owning artist and by either state dimension."
    roles: [Artist, DistributionOps, FinanceOps, PlatformAdmin]
    code: 200
    input: ["artist_id?", "status?", "delivery_status?", "limit?", "offset?"]
    output: Release[]
    side_effects: []
  - method: PATCH
    path: "/api/releases/{id}"
    description: "Updates mutable release metadata while the release is in DRAFT."
    roles: [Artist]
    code: 200
    input: ["title?", "upc?", "release_date?", "primary_genre?", "label_name?", "pre_save_enabled?", "pre_save_opens_at?"]
    output: Release
    side_effects: ["increments Release.version by 1"]
  - method: POST
    path: "/api/releases/{id}/submit"
    description: "Submits a DRAFT release for editorial review."
    roles: [Artist]
    code: 200
    input: []
    output: Release
    side_effects: ["sets submitted_at", "recomputes Subscription.releases_used (+1)", "increments Release.version by 1"]
  - method: POST
    path: "/api/releases/{id}/withdraw"
    description: "Withdraws a SUBMITTED or REJECTED release back to DRAFT; compensating action of submit."
    roles: [Artist]
    code: 200
    input: []
    output: Release
    side_effects: ["clears submitted_at or rejection_reason_code", "recomputes Subscription.releases_used", "increments Release.version by 1"]
  - method: POST
    path: "/api/releases/{id}/review"
    description: "Moves a SUBMITTED release into IN_REVIEW."
    roles: [DistributionOps]
    code: 200
    input: []
    output: Release
    side_effects: ["increments Release.version by 1"]
  - method: POST
    path: "/api/releases/{id}/approve"
    description: "Approves an IN_REVIEW release for distribution."
    roles: [DistributionOps]
    code: 200
    input: []
    output: Release
    side_effects: ["increments Release.version by 1"]
  - method: POST
    path: "/api/releases/{id}/reject"
    description: "Rejects an IN_REVIEW release."
    roles: [DistributionOps]
    code: 200
    input: [reason_code]
    output: Release
    side_effects: ["sets rejection_reason_code", "recomputes Subscription.releases_used (-1)", "increments Release.version by 1"]
  - method: POST
    path: "/api/releases/{id}/takedown"
    description: "Requests takedown of a DELIVERED release from every store."
    roles: [Artist, DistributionOps]
    code: 200
    input: []
    output: Release
    side_effects: ["sets delivery_status to TAKEDOWN_PENDING", "cascade hop 1: every ACCEPTED Delivery becomes TAKEDOWN_REQUESTED", "increments Release.version by 1"]
  - method: POST
    path: "/api/releases/{id}/go-live"
    description: "Publishes an APPROVED, fully DELIVERED release once the logical clock has reached its release_date."
    roles: [DistributionOps]
    code: 200
    input: []
    output: Release
    side_effects: ["sets every PENDING Track of the release to ACTIVE", "recomputes Artist.live_track_count", "increments Release.version by 1"]
  - method: POST
    path: "/api/releases/{id}/pre-saves"
    description: "Registers a fan pre-save for a release."
    roles: [Fan]
    code: 200
    input: [fan_reference]
    output: Release
    side_effects: ["increments Release.pre_save_count by 1", "increments Release.version by 1"]

  # ---- tracks ------------------------------------------------------------
  - method: POST
    path: "/api/releases/{id}/tracks"
    description: "Adds a track to a DRAFT release."
    roles: [Artist]
    code: 201
    input: [title, duration_seconds, track_number, "isrc?", "explicit?", "content_id_enabled?"]
    output: Track
    side_effects: ["creates the Track with status PENDING"]
  - method: GET
    path: "/api/tracks/{id}"
    description: "Reads one track."
    roles: [Artist, DistributionOps, FinanceOps, PlatformAdmin]
    code: 200
    input: []
    output: Track
    side_effects: []
  - method: GET
    path: "/api/tracks"
    description: "Lists tracks, filterable by owning release."
    roles: [Artist, DistributionOps, FinanceOps, PlatformAdmin]
    code: 200
    input: ["release_id?", "status?", "limit?", "offset?"]
    output: Track[]
    side_effects: []
  - method: PATCH
    path: "/api/tracks/{id}"
    description: "Updates mutable track metadata."
    roles: [Artist]
    code: 200
    input: ["title?", "isrc?", "explicit?", "content_id_enabled?", "duration_seconds?"]
    output: Track
    side_effects: ["increments Track.version by 1"]

  # ---- collaborators -----------------------------------------------------
  - method: POST
    path: "/api/collaborators"
    description: "Registers a payee under an artist account."
    roles: [Artist]
    code: 201
    input: [artist_id, name, email, country_code, "tax_form_status?", "payout_method?"]
    output: Collaborator
    side_effects: ["computes withholding_bps per calculations.collaborator_withholding_bps"]
  - method: GET
    path: "/api/collaborators/{id}"
    description: "Reads one collaborator."
    roles: [Artist, Collaborator, FinanceOps, PlatformAdmin]
    code: 200
    input: []
    output: Collaborator
    side_effects: []
  - method: GET
    path: "/api/collaborators"
    description: "Lists collaborators, filterable by owning artist."
    roles: [Artist, FinanceOps, PlatformAdmin]
    code: 200
    input: ["artist_id?", "status?", "limit?", "offset?"]
    output: Collaborator[]
    side_effects: []
  - method: PATCH
    path: "/api/collaborators/{id}"
    description: "Updates a payee's tax documentation state or payout rail."
    roles: [Artist, FinanceOps]
    code: 200
    input: ["tax_form_status?", "payout_method?", "country_code?", "status?"]
    output: Collaborator
    side_effects: ["recomputes withholding_bps per calculations.collaborator_withholding_bps", "increments Collaborator.version by 1"]

  # ---- split sheets & shares --------------------------------------------
  - method: POST
    path: "/api/split-sheets"
    description: "Creates a DRAFT split sheet for a track. OCC-guarded on the parent Track."
    roles: [Artist]
    code: 201
    input: [track_id, effective_from, expected_track_version]
    output: SplitSheet
    side_effects: ["creates the SplitSheet in DRAFT", "increments Track.version by 1"]
  - method: GET
    path: "/api/split-sheets/{id}"
    description: "Reads one split sheet."
    roles: [Artist, Collaborator, FinanceOps, PlatformAdmin]
    code: 200
    input: []
    output: SplitSheet
    side_effects: []
  - method: GET
    path: "/api/split-sheets"
    description: "Lists split sheets, filterable by owning track."
    roles: [Artist, Collaborator, FinanceOps, PlatformAdmin]
    code: 200
    input: ["track_id?", "status?", "limit?", "offset?"]
    output: SplitSheet[]
    side_effects: []
  - method: POST
    path: "/api/split-sheets/{id}/shares"
    description: "Adds a collaborator share to a DRAFT split sheet."
    roles: [Artist]
    code: 201
    input: [collaborator_id, share_bps]
    output: SplitShare
    side_effects: ["recomputes SplitSheet.total_share_bps", "increments SplitSheet.version by 1"]
  - method: GET
    path: "/api/split-shares/{id}"
    description: "Reads one split share."
    roles: [Artist, Collaborator, FinanceOps, PlatformAdmin]
    code: 200
    input: []
    output: SplitShare
    side_effects: []
  - method: GET
    path: "/api/split-shares"
    description: "Lists split shares, filterable by sheet or by payee."
    roles: [Artist, Collaborator, FinanceOps, PlatformAdmin]
    code: 200
    input: ["split_sheet_id?", "collaborator_id?", "limit?", "offset?"]
    output: SplitShare[]
    side_effects: []
  - method: POST
    path: "/api/split-sheets/{id}/send"
    description: "Sends a complete DRAFT sheet to its collaborators for acceptance."
    roles: [Artist]
    code: 200
    input: []
    output: SplitSheet
    side_effects: ["increments SplitSheet.version by 1"]
  - method: POST
    path: "/api/split-shares/{id}/accept"
    description: "A collaborator accepts their share."
    roles: [Collaborator]
    code: 200
    input: []
    output: SplitShare
    side_effects: ["sets accepted = true and accepted_at", "recomputes SplitSheet.accepted_share_count", "increments SplitShare.version by 1"]
  - method: POST
    path: "/api/split-shares/{id}/reject"
    description: "A collaborator rejects their share, returning the whole sheet to DRAFT and clearing every acceptance."
    roles: [Collaborator]
    code: 200
    input: [reason_code]
    output: SplitShare
    side_effects: ["sets SplitSheet.status = DRAFT", "clears accepted/accepted_at on every SplitShare of the sheet", "recomputes SplitSheet.accepted_share_count to 0", "increments SplitShare.version by 1"]
  - method: POST
    path: "/api/split-sheets/{id}/lock"
    description: "Locks a fully accepted sheet, superseding any previously LOCKED sheet of the same track."
    roles: [Artist]
    code: 200
    input: []
    output: SplitSheet
    side_effects: ["sets locked_at", "sets Track.locked_split_sheet_id", "moves the prior LOCKED sheet of the track to SUPERSEDED", "increments SplitSheet.version by 1"]

  # ---- deliveries --------------------------------------------------------
  - method: POST
    path: "/api/releases/{id}/deliveries"
    description: "Queues a delivery of an APPROVED release to a store."
    roles: [DistributionOps]
    code: 201
    input: [store_id, scheduled_send_at]
    output: Delivery
    side_effects: ["creates the Delivery in QUEUED", "sets Release.delivery_status to QUEUED when it was NONE", "increments Release.version by 1"]
  - method: GET
    path: "/api/deliveries/{id}"
    description: "Reads one delivery."
    roles: [DistributionOps, Artist, PlatformAdmin]
    code: 200
    input: []
    output: Delivery
    side_effects: []
  - method: GET
    path: "/api/deliveries"
    description: "Lists deliveries, filterable by release or store."
    roles: [DistributionOps, Artist, PlatformAdmin]
    code: 200
    input: ["release_id?", "store_id?", "status?", "limit?", "offset?"]
    output: Delivery[]
    side_effects: []
  - method: POST
    path: "/api/deliveries/{id}/send"
    description: "Dispatches a QUEUED delivery to the store."
    roles: [DistributionOps]
    code: 200
    input: []
    output: Delivery
    side_effects: ["increments attempt_count", "sets sent_at", "increments Delivery.version by 1"]
  - method: POST
    path: "/api/deliveries/{id}/ack"
    description: "Records the store's acknowledgement of a SENT delivery."
    roles: [DistributionOps]
    code: 200
    input: [outcome, "error_code?"]
    output: Delivery
    side_effects: ["on ACCEPTED recomputes Release.delivery_status and may drive Release.status APPROVED -> LIVE", "on REJECTED sets last_error_code", "increments Delivery.version by 1"]
  - method: POST
    path: "/api/deliveries/{id}/retry"
    description: "Requeues a REJECTED delivery for another attempt."
    roles: [DistributionOps]
    code: 200
    input: []
    output: Delivery
    side_effects: ["increments Delivery.version by 1"]
  - method: POST
    path: "/api/deliveries/{id}/confirm-takedown"
    description: "Confirms the store has removed the release."
    roles: [DistributionOps]
    code: 200
    input: []
    output: Delivery
    side_effects: ["sets taken_down_at", "cascade hop 2: may set Release.delivery_status = TAKEN_DOWN and Release.status = TAKEN_DOWN", "increments Delivery.version by 1"]

  # ---- royalty statements & lines ---------------------------------------
  - method: POST
    path: "/api/royalty-statements"
    description: "Opens a royalty statement for an artist over a half-open reporting period."
    roles: [FinanceOps]
    code: 201
    input: [artist_id, period_start, period_end]
    output: RoyaltyStatement
    side_effects: ["creates the RoyaltyStatement in OPEN with all money fields at 0"]
  - method: GET
    path: "/api/royalty-statements/{id}"
    description: "Reads one royalty statement."
    roles: [FinanceOps, Artist, PlatformAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []
  - method: GET
    path: "/api/royalty-statements"
    description: "Lists royalty statements, filterable by artist."
    roles: [FinanceOps, Artist, PlatformAdmin]
    code: 200
    input: ["artist_id?", "status?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []
  - method: POST
    path: "/api/royalty-statements/{id}/ingest"
    description: "Appends a batch of reported royalty lines. OCC-guarded on the statement's version."
    roles: [FinanceOps]
    code: 200
    input: [expected_statement_version, lines]
    output: RoyaltyStatement
    side_effects: ["appends one RoyaltyLine per element of lines", "recomputes line_count, gross_cents, content_id_gross_cents", "increments RoyaltyStatement.version by 1"]
  - method: GET
    path: "/api/royalty-lines/{id}"
    description: "Reads one ingested royalty line."
    roles: [FinanceOps, Artist, PlatformAdmin]
    code: 200
    input: []
    output: RoyaltyLine
    side_effects: []
  - method: GET
    path: "/api/royalty-lines"
    description: "Lists royalty lines, filterable by statement, track or store."
    roles: [FinanceOps, Artist, PlatformAdmin]
    code: 200
    input: ["royalty_statement_id?", "track_id?", "store_id?", "source?", "limit?", "offset?"]
    output: RoyaltyLine[]
    side_effects: []
  - method: POST
    path: "/api/royalty-statements/{id}/reconcile"
    description: "Computes the PROVISIONAL commission and net for the statement."
    roles: [FinanceOps]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["computes commission_cents and provisional_net_cents (PROVISIONAL variant)", "records reconciled_by_user_id", "increments RoyaltyStatement.version by 1"]
  - method: POST
    path: "/api/royalty-statements/{id}/close"
    description: "Closes the statement: recomputes commission and net with the FINAL variant and materialises collaborator payouts."
    roles: [FinanceOps]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["recomputes commission_cents (FINAL) and content_id_bonus_cents", "sets net_cents (FINAL)", "creates one Payout per entitled Collaborator", "auto-approves payouts at or above the 2000-cent threshold", "increments Artist.lifetime_gross_cents", "records closed_by_user_id", "increments RoyaltyStatement.version by 1"]
  - method: GET
    path: "/api/royalty-statements/{id}/summary"
    description: "Computed report: gross, commission, bonus, provisional vs final net and their divergence, plus payout roll-up."
    roles: [FinanceOps, Artist, PlatformAdmin]
    code: 200
    input: []
    output: "{ statement_id: string, gross_cents: integer, content_id_gross_cents: integer, commission_cents: integer, content_id_bonus_cents: integer, provisional_net_cents: integer, net_cents: integer, variant_delta_cents: integer, payout_count: integer, payout_gross_total_cents: integer }"
    side_effects: []

  # ---- payouts -----------------------------------------------------------
  - method: GET
    path: "/api/payouts/{id}"
    description: "Reads one payout."
    roles: [FinanceOps, Collaborator, Artist, PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: GET
    path: "/api/payouts"
    description: "Lists payouts, filterable by payee or statement."
    roles: [FinanceOps, Collaborator, Artist, PlatformAdmin]
    code: 200
    input: ["collaborator_id?", "royalty_statement_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: POST
    path: "/api/payouts/{id}/approve"
    description: "Manually approves a PENDING payout and records the approving operator."
    roles: [FinanceOps]
    code: 200
    input: []
    output: Payout
    side_effects: ["sets approved_by_user_id and auto_approved = false", "increments Payout.version by 1"]
  - method: POST
    path: "/api/payouts/{id}/pay"
    description: "Pays an APPROVED payout; segregated from the approving operator."
    roles: [FinanceOps]
    code: 200
    input: []
    output: Payout
    side_effects: ["sets paid_at and paid_by_user_id", "moves net_cents from Collaborator.pending_payout_cents to lifetime_paid_cents", "increments Payout.version by 1"]
  - method: POST
    path: "/api/payouts/{id}/reverse"
    description: "Reverses a PAID payout inside the 90-day reversal window; compensating action of pay."
    roles: [FinanceOps]
    code: 200
    input: [reason_code]
    output: Payout
    side_effects: ["sets reversal_reason_code", "moves net_cents from Collaborator.lifetime_paid_cents to reversed_payout_cents", "increments Payout.version by 1"]

  # ---- 1099 tax forms ----------------------------------------------------
  - method: POST
    path: "/api/tax-forms"
    description: "Drafts a 1099 for a collaborator and a tax year."
    roles: [FinanceOps]
    code: 201
    input: [collaborator_id, tax_year]
    output: TaxForm1099
    side_effects: ["computes total_paid_cents per calculations.tax_form_total_paid_cents"]
  - method: GET
    path: "/api/tax-forms/{id}"
    description: "Reads one 1099 form."
    roles: [FinanceOps, Collaborator, PlatformAdmin]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: []
  - method: GET
    path: "/api/tax-forms"
    description: "Lists 1099 forms, filterable by payee."
    roles: [FinanceOps, Collaborator, PlatformAdmin]
    code: 200
    input: ["collaborator_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: TaxForm1099[]
    side_effects: []
  - method: POST
    path: "/api/tax-forms/{id}/issue"
    description: "Issues a DRAFT 1099 once the reportable total reaches the 60000-cent threshold."
    roles: [FinanceOps]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: ["recomputes total_paid_cents", "sets issued_at", "increments TaxForm1099.version by 1"]
  - method: POST
    path: "/api/tax-forms/{id}/void"
    description: "Voids an ISSUED 1099."
    roles: [FinanceOps]
    code: 200
    input: [reason_code]
    output: TaxForm1099
    side_effects: ["increments TaxForm1099.version by 1"]

# =========================================================================
# §1.6 Error Code Catalog
# =========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "An entity_backed role addresses a resource it does not own (Artist acting on another artist's release, Collaborator acting on another payee's share or payout)."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, illegal enum member, out-of-range number, or malformed upc/isrc/country_code."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path-templated id or a body foreign key does not resolve to an existing row."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared in §1.2."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_track_version or expected_statement_version does not equal the parent's current version."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals the operator recorded on the prior step (statement.reconciled_by_user_id on close, payout.approved_by_user_id on pay)."
  - id: ERR_METADATA_NONCOMPLIANT
    http: 422
    condition: "The destination store requires an explicit-content declaration and at least one Track of the release has explicit == null."
  - id: ERR_ISRC_MISSING
    http: 422
    condition: "The destination store requires ISRCs and at least one Track of the release has isrc == null."
  - id: ERR_SPLIT_SHEET_NOT_LOCKED
    http: 409
    condition: "At least one Track of the release has no SplitSheet in status LOCKED."
  - id: ERR_SPLIT_SHEET_EMPTY
    http: 422
    condition: "A split sheet with zero SplitShare rows is sent or locked."
  - id: ERR_SPLIT_TOTAL_INVALID
    http: 422
    condition: "The sheet's total_share_bps is not exactly 10000."
  - id: ERR_SPLIT_NOT_ACCEPTED
    http: 409
    condition: "A sheet is locked while at least one of its shares has accepted == false."
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "A uniqueness constraint listed in validation priority 16 is violated."
  - id: ERR_RELEASE_DATE_TOO_SOON
    http: 422
    condition: "release_date is earlier than the logical clock plus 7 days at submit time."
  - id: ERR_DELIVERY_LEAD_TIME_VIOLATION
    http: 422
    condition: "scheduled_send_at plus the store's delivery_lead_days falls after the release_date."
  - id: ERR_STORE_WINDOW_SATURATED
    http: 409
    condition: "The store already has max_concurrent_deliveries buffer-expanded windows intersecting the requested one."
  - id: ERR_STATEMENT_PERIOD_OVERLAP
    http: 409
    condition: "The requested half-open period overlaps an existing statement of the same artist."
  - id: ERR_LINE_OUTSIDE_PERIOD
    http: 422
    condition: "An ingested line's reported_at falls outside [period_start, period_end)."
  - id: ERR_PRE_SAVE_WINDOW_CLOSED
    http: 422
    condition: "Pre-save is disabled on the release, the clock is before pre_save_opens_at, or the clock has reached release_date."
  - id: ERR_REVERSAL_WINDOW_EXPIRED
    http: 422
    condition: "A payout reversal is attempted 90 days or more after paid_at."
  - id: ERR_SUBSCRIPTION_INACTIVE
    http: 402
    condition: "The artist has no ACTIVE subscription and no PAST_DUE subscription inside the 30-day grace window."
  - id: ERR_RELEASE_SLOTS_EXHAUSTED
    http: 402
    condition: "releases_used has reached the plan's included_release_slots."
  - id: ERR_CONTENT_ID_NOT_ENTITLED
    http: 403
    condition: "content_id_enabled is set true while the artist's plan has allows_content_id == false."
  - id: ERR_TAX_FORM_NOT_VERIFIED
    http: 422
    condition: "A payout is paid while the payee's tax_form_status is not VERIFIED."
  - id: ERR_PAYOUT_BELOW_THRESHOLD
    http: 422
    condition: "A payout whose net_cents is below 2000 is paid."
  - id: ERR_1099_THRESHOLD_NOT_MET
    http: 422
    condition: "A 1099 is issued while total_paid_cents is below 60000."
  - id: ERR_RELEASE_DATE_NOT_REACHED
    http: 422
    condition: "go-live is called before the logical clock reaches the release_date."

# =========================================================================
# §1.7 RBAC Matrix
# =========================================================================
roles:
  - name: PlatformAdmin
    description: "Operates platform configuration: plans, stores, artist accounts, subscription billing state and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/subscription-plans"
      - "POST /api/stores"
      - "POST /api/artists"
      - "PATCH /api/artists/{id}"
      - "POST /api/subscriptions"
      - "POST /api/subscriptions/{id}/activate"
      - "POST /api/subscriptions/{id}/lapse"
      - "POST /api/subscriptions/{id}/expire"
    shared_operations:
      - "GET reads across subscription-plans, stores, artists, subscriptions, releases, tracks, collaborators, split-sheets, split-shares, deliveries, royalty-statements, royalty-lines, payouts, tax-forms"

  - name: Artist
    description: "Owns releases, tracks, collaborators and split sheets under a single artist account."
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /api/releases"
      - "PATCH /api/releases/{id}"
      - "POST /api/releases/{id}/submit"
      - "POST /api/releases/{id}/withdraw"
      - "POST /api/releases/{id}/tracks"
      - "PATCH /api/tracks/{id}"
      - "POST /api/collaborators"
      - "POST /api/split-sheets"
      - "POST /api/split-sheets/{id}/shares"
      - "POST /api/split-sheets/{id}/send"
      - "POST /api/split-sheets/{id}/lock"
    shared_operations:
      - "POST /api/releases/{id}/takedown (with DistributionOps)"
      - "PATCH /api/collaborators/{id} (with FinanceOps)"
      - "GET reads scoped to own artist_id"

  - name: Collaborator
    description: "A payee who accepts or rejects split shares and reads their own payouts and 1099s."
    identity: "entity_backed:Collaborator"
    exclusive_operations:
      - "POST /api/split-shares/{id}/accept"
      - "POST /api/split-shares/{id}/reject"
    shared_operations:
      - "GET /api/split-shares, GET /api/payouts, GET /api/tax-forms scoped to own collaborator_id"

  - name: DistributionOps
    description: "Reviews release metadata and drives store delivery and takedown."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/releases/{id}/review"
      - "POST /api/releases/{id}/approve"
      - "POST /api/releases/{id}/reject"
      - "POST /api/releases/{id}/go-live"
      - "POST /api/releases/{id}/deliveries"
      - "POST /api/deliveries/{id}/send"
      - "POST /api/deliveries/{id}/ack"
      - "POST /api/deliveries/{id}/retry"
      - "POST /api/deliveries/{id}/confirm-takedown"
    shared_operations:
      - "POST /api/releases/{id}/takedown (with Artist)"
      - "GET reads across releases, tracks, deliveries, stores"

  - name: FinanceOps
    description: "Runs the royalty ledger: statement creation, ingest, reconcile, close, payouts and 1099s. Segregation of duties applies between reconcile and close, and between payout approve and pay."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/royalty-statements"
      - "POST /api/royalty-statements/{id}/ingest"
      - "POST /api/royalty-statements/{id}/reconcile"
      - "POST /api/royalty-statements/{id}/close"
      - "POST /api/payouts/{id}/approve"
      - "POST /api/payouts/{id}/pay"
      - "POST /api/payouts/{id}/reverse"
      - "POST /api/tax-forms"
      - "POST /api/tax-forms/{id}/issue"
      - "POST /api/tax-forms/{id}/void"
    shared_operations:
      - "PATCH /api/collaborators/{id} (with Artist)"
      - "GET reads across the whole ledger surface"

  - name: Fan
