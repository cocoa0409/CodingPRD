              payload: { quote_id: "${quote_id}", instrument_id: "${inst_card}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the PUT succeeded (200) and ServiceCatalogItem.${svc_id}.version == 3"
            - "FeeQuote.${quote_id}.service_version_pinned == 2"
            - "authorize returns 409 and err_id == ERR_STALE_SERVICE_VERSION; FeeQuote.${quote_id}.status remains OPEN"

      - name: err_quote_expired_at_exact_expiry
        claim_type: violation_to_error
        grounds:
          - errors.ERR_QUOTE_EXPIRED
          - entities.FeeQuote.fields.expires_at
        distinguishing_aspect: "Expiry is inclusive at the boundary: authorize at logical clock == expires_at (created_at + 30 minutes exactly) fails 409 ERR_QUOTE_EXPIRED."
        test_recipe:
          setup:
            - "CF agency base chain; quote created at clock 2026-09-01T00:00:00Z; clock advanced to exactly 2026-09-01T00:30:00Z."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_quote100k
            - call: "POST /_clock/set_current_utc"
