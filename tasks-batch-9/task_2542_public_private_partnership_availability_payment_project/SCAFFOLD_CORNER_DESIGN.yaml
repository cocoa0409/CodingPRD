          trigger:
            - call: "PATCH /ppp/concessions/${csn_id}"
              payload: { masp_cents: 120000000, deduction_cap_pct: 0.25 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
          assert:
            - "HTTP status is 200"
            - "${csn_v1} == 1"
            - "Concession.${csn_id}.masp_cents == 120000000 and deduction_cap_pct == 0.25"
            - "Concession.${csn_id}.indexation_pct == 0.0325 and ld_cap_cents == 5000000 — omitted fields are untouched"
            - "Concession.${csn_id}.monthly_unitary_charge_cents == null — the charge is still undecided"
            - "Concession.${csn_id}.status == \"DRAFTED\" and financial_close_date == null"
            - "Concession.${csn_id}.version == 2 and updated_at moved to the logical clock"

