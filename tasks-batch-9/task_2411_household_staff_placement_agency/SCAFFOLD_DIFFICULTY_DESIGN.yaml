      asserts:
      - the trigger returns 200 with actual_first_year_compensation_cents == 15000000 and fee_percent_bps == 2233
      - fee_cents == 3349499, not 3349500
      - the per-component fees are 893758, 782108, 558808 and 1114825 - each one a quarter cent lower than its unrounded
        product
      - fee_variant == FINAL and guarantee_window_days == 120
      - guarantee_expires_on == 2026-12-30 (2026-09-01 plus 120 days)
      - GET /placements/${plc_id}/fee-milestones amounts are 1004850, 1004850 and 1339799 and sum to fee_cents exactly
  - name: refund_proration_pins_gross_then_tier_then_retention_mode_c
    grounds: calculations.replacement_refund_proration (five pinned steps); entities.ReplacementClaim.gross_refund_cents
      / retained_admin_fee_cents / net_refund_cents; state_machines.ReplacementClaim.UNDER_REVIEW -> APPROVED_REFUND
    mode: c - order of the pipeline stages
