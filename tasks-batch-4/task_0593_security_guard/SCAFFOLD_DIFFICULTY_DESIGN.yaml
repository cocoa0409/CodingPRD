              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Gatehouse", bill_rate_cents_per_hour: 4500, max_concurrent_guards: 1, required_cert_codes: [], checkpoint_tag_uids: [], tour_compliance_floor_pct: 80.0 }
              as: AccountManager
              captures: { post_id: $.data.id, post_v: $.data.version }
            - call: "POST /post-orders"
              payload: { post_id: "${post_id}", expected_post_version: "${post_v}", body_text: "Control vehicle access.", revision_label: "REV-A" }
              as: AccountManager
              captures: { po_id: $.data.id }
            - call: "POST /post-orders/${po_id}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /guards"
              payload: { full_name: "Nox Vega", employee_code: "G-010", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "L-010", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T20:00:00Z", planned_break_minutes: 0 }
              as: Scheduler
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /shifts/${s1_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${s1_v}" }
              as: Scheduler
            - call: "POST /shifts/${s1_id}/actions"
