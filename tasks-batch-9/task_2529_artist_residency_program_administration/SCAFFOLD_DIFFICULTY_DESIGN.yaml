            - "after the FOURTH score the tie appears: sum 309.58, 309.58/4 == 77.395 exactly, and provisional_screening_score == 77.40 - round_half_up carries the trailing 5 UP"
            - "the tie is the discriminator: truncation and round-half-down both yield 77.39, so 77.40 is the only value consistent with the declared precision rule"
            - "final_panel_score on the same four legs == 78.79: the trim drops exactly one 82.00 and one 70.00, leaving (80.00 + 77.58)/2 == 78.79, so the two variants differ by 1.39 on identical data"
            - "double rounding is observable: pa3's 77.58 is itself a rounded reviewer leg (86.2 x 0.90 = 77.58 with no residue), and it is the mismatch multiplier that moves the mean onto the half-cent - an implementation that applied the 0.90 multiplier after averaging would not produce 77.395"
            - "Application.scored_panelist_count == 4 and status == 'SCORED' after the fourth call; every panelist_total_100 is stored with exactly 2 decimal places"
            - "the boundary is one-sided-sensitive: replacing pa1's technical_readiness 7 with 6 gives 80.5 -> 80.50 and a sum of 308.08, mean 77.02 exactly, which no longer distinguishes the rounding modes"

  # ===================================================================================
  # RULE 7 - cross_entity_state_dependency
  # Differentiation: three DIFFERENT entity pairs, each a genuine guard where entity A's
  # transition is legal in A's own machine yet blocked by entity B's state.
  #   1. Residency  <- VisaCase             (CHECK_IN needs VisaCase.status == APPROVED)
  #   2. PanelAssignment <- Cycle           (scoring needs Cycle.status == PANEL_REVIEW)
  #   3. StipendDisbursement <- Obligation  (final PAY needs zero BREACHED obligations)
  # ===================================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: residency_checkin_gated_on_visa_case_approval
        grounds: "§1.2 Residency SCHEDULED -> IN_RESIDENCE precondition 'when Residency.visa_required == true, the residency's VisaCase.status == APPROVED' (note: cross-entity guard); §1.4 P38 ERR_VISA_NOT_APPROVED (422); §1.3 calculations.visa_timeline"
        distinguishing_aspect: |
          Entity pair Residency <- VisaCase. Every precondition that lives INSIDE the Residency is
          satisfied at the moment of the failed call: the residency is SCHEDULED, the clock has
          reached session_start_date, and compliance_status is CLEARED because both required
          trainings are recorded. The transition is blocked purely by the state of a DIFFERENT
          entity whose row is not even named in the request. Approving the visa mutates nothing on
          the residency, and the identical CHECK_IN call then succeeds - which is the only way to
          show the guard is a live read of VisaCase.status rather than a cached flag copied onto the
          residency at creation time.
        test_recipe:
          setup: |
            The logical clock starts at 2026-06-01 so the visa filing window is still open: for a
            FRENCH applicant (default backlog 21 days) on a session starting 2026-11-02 the
            filing_deadline_date is 2026-11-02 - (90 + 21) = 2026-07-14 and the earliest_entry_date
            is 2026-10-03. An invited 8-week SCULPT residency is created for the international
            applicant, which auto-creates a VisaCase in INITIATED with visa_required true. The case
            is walked INITIATED -> DOCS_REQUESTED -> DOCS_SUBMITTED -> FILED with a consulate
            appointment on 2026-09-15 (inside now..earliest_entry_date), but deliberately NOT
            approved. Both required trainings are recorded so compliance_status reaches CLEARED, then
            the clock is moved to the session start.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-05-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Camille Roux", email: "camille.roux@example.org",
                         affiliation_org: "Atelier Sud", citizenship_country: "FR",
                         treaty_country: true, declared_annual_income_cents: 1900000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /visa-cases"
              payload: {}
              as: VisaCoordinator
              as_user_id: "visa-01"
              captures: { vc: "$.data[0].id" }
            - call: "POST /visa-cases/${vc}/docs"
              payload: { action: "REQUEST", doc_list: ["PASSPORT", "INVITATION_LETTER", "FUNDING_PROOF"] }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /visa-cases/${vc}/docs"
              payload: { action: "SUBMIT", doc_list: ["PASSPORT", "INVITATION_LETTER", "FUNDING_PROOF"] }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /visa-cases/${vc}/adjudication"
              payload: { action: "FILE", consulate_appointment_date: "2026-09-15" }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "SAFETY_ORIENTATION" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "EQUIPMENT_WELDING" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-02T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "CHECK_IN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
            - call: "POST /visa-cases/${vc}/adjudication"
              payload: { action: "APPROVE" }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "CHECK_IN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "visa timeline derived at creation: backlog_days == 21 (FR is not in HIGH_VOLUME_VISA_COUNTRIES), filing_deadline_date == '2026-07-14' (2026-11-02 minus 111 days), earliest_entry_date == '2026-10-03', case_type == 'B1_SHORT_TERM' because 8 < VISA_J1_MIN_SESSION_WEEKS 9"
            - "days_to_filing_deadline == 43 while the clock sits at 2026-06-01, which is why the FILE call is inside its window"
            - "pre-state of the RESIDENCY side of the guard is fully satisfied: status == 'SCHEDULED', session_start_date == '2026-11-02', date(now) == '2026-11-02' so date(now) >= session_start_date, compliance_status == 'CLEARED', completed_training_types == ['EQUIPMENT_WELDING', 'SAFETY_ORIENTATION'] covering required_training_types exactly"
            - "the ONLY unsatisfied condition is on the other entity: VisaCase.status == 'FILED', not 'APPROVED', and visa_required == true"
            - "the first trigger returns 422 with error_id == 'ERR_VISA_NOT_APPROVED' and the residency stays 'SCHEDULED' with an unchanged version"
            - "the APPROVE call touches ONLY the VisaCase: status becomes 'APPROVED' and VisaCase.version increments, while Residency.version is untouched by it"
            - "the third call replays the IDENTICAL CHECK_IN payload and returns 200 with status == 'IN_RESIDENCE' - the guard is re-read live from VisaCase on every attempt"
            - "the coupling is specific to international residents: an otherwise identical US applicant has visa_required == false and no VisaCase at all, and its CHECK_IN succeeds on the first attempt"
            - "P34 ERR_TRAINING_NOT_COMPLETE is NOT what fires: recording only SAFETY_ORIENTATION would surface that error at priority 34 and mask the visa guard, so both trainings are recorded first"

      - name: panel_scoring_gated_on_cycle_stage_after_slate_lock
        grounds: "§1.4 P18 ERR_CYCLE_STAGE_INVALID (state, 409, 'PANEL_REVIEW for panel assignment / scoring / conflict declaration'); §1.2 Cycle PANEL_REVIEW -> SLATE_LOCKED; §1.1 PanelAssignment.status ASSIGNED"
        distinguishing_aspect: |
          Entity pair PanelAssignment <- Cycle, a different pair on a different axis: the parent
          moves and freezes a child that never changed. The PanelAssignment is still ASSIGNED, so
          P24's own-state check passes; the Panelist is still ACTIVE, so P25 passes; the panelist is
          the acting user, so P15 passes. The scoring call fails only because the CYCLE advanced
          underneath it. This is the temporal inverse of instance 1: there the dependency was
          resolved by advancing the OTHER entity forward, here the other entity advancing forward is
          precisely what breaks the operation, and the Cycle's terminal-ward motion means the failure
          is permanent rather than retryable.
        test_recipe:
          setup: |
            One cycle, one SCULPT application advanced to PANEL_REVIEW and scored by TWO panelists to
            80.00 each (meeting panel_quorum 2, so final_panel_score is 80.00 and the cycle's
            panel_review_complete becomes true). A THIRD panelist is assigned to the same application
            WHILE the cycle is still in PANEL_REVIEW, so the assignment is legally created and left
            in ASSIGNED. The PanelChair then locks the slate, moving the Cycle to SLATE_LOCKED and
            the application to OFFERED. The third panelist now tries to file the scores they were
            legitimately asked for.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}",
