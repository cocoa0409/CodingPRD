              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Bo Tech", home_station_id: "${st_id}", decon_endorsement: true }
              as: ProgramAdmin
              captures: { insp_b: $.data.id }
            - call: "POST /inspectors/${insp_b}/training-records"
              payload: { module_code: "AIS-DECON-200", hours: 40, passed: true }
              as: TrainingOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Cy Verify", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_c: $.data.id }
            - call: "POST /inspectors/${insp_c}/training-records"
              payload: { module_code: "AIS-101", hours: 24, passed: true }
              as: TrainingOfficer
            - call: "POST /inspectors/${insp_c}/training-records"
              payload: { module_code: "AIS-QA-300", hours: 20, passed: false }
              as: TrainingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspectors/${insp_c}/training-records"
              payload: { module_code: "AIS-QA-300", hours: 16, passed: true }
