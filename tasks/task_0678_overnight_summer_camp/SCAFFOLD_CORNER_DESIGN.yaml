# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of testable claims
# Overnight / Sleepaway Summer Camp (Expert)
# Walks references/claim-extraction-guide.md row-by-row against §1.1–§1.7.
# Same 7-point per-instance contract & §1.5 lint gates as §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_camp_returns_201_with_config_defaults
        claim_type: Creation
        grounds:
          - "entities.Camp"
          - "endpoints"
        distinguishing_aspect: "POST /camps with only {name} returns 201 and applies config defaults: counselor_camper_ratio=6, deposit_cents=25000, deposit_grace_days=7, cit_counts_as_half=true, canteen_low_balance_cents=1000, version=1."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
          trigger:
            - call: "POST /camps"
              payload: { name: "Solo Camp" }
              as: CampDirector
              captures: { camp_id: $.data.id, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Camp.${camp_id}.counselor_camper_ratio == 6"
            - "Camp.${camp_id}.deposit_cents == 25000"
            - "Camp.${camp_id}.deposit_grace_days == 7"
            - "Camp.${camp_id}.cit_counts_as_half == true"
            - "Camp.${camp_id}.canteen_low_balance_cents == 1000"
            - "Camp.${camp_id}.version == 1"

      - name: create_session_missing_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Session.fields.capacity"
          - "validations[priority=14]"
        distinguishing_aspect: "POST /camps/{id}/sessions omitting the required `capacity` field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A Camp exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "C" }
              as: CampDirector
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "S", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z" }
              as: CampDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_session_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.Session"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /sessions/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
          trigger:
            - call: "GET /sessions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CampDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: session_create_ends_before_starts_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Session.fields.ends_on"
          - "validations[priority=14]"
        distinguishing_aspect: "POST /camps/{id}/sessions with ends_on <= starts_on returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A Camp exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "C" }
              as: CampDirector
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "S", starts_on: "2026-07-14T00:00:00Z", ends_on: "2026-07-01T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: cabin_create_max_age_below_min_age_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Cabin.fields.max_age"
          - "validations[priority=14]"
        distinguishing_aspect: "POST /sessions/{id}/cabins with max_age < min_age returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A Camp + Session exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "C" }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "S", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Bad", gender_band: "BOYS", min_age: 12, max_age: 8, bunk_capacity: 6 }
              as: CampDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: camper_system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - "entities.Camper.fields.health_status"
          - "entities.Camper.fields.guardian_user_id"
        distinguishing_aspect: "POST /campers ignores any client-supplied id/health_status; server stamps guardian_user_id=X-User-ID and health_status=NONE."
        test_recipe:
          setup:
            - "A registered Guardian."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /guardians/register"
              payload: { email: "cgr@x.com", full_name: "CG", phone: "555-0001" }
              as: Anonymous
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /campers"
              payload: { full_name: "Kid", age: 9, gender: "BOY" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { c_id: $.data.id, hs: $.data.health_status, guid: $.data.guardian_user_id }
          assert:
            - "response.status == 201"
            - "Camper.${c_id}.health_status == NONE"
            - "Camper.${c_id}.guardian_user_id == ${g_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_enrollment_with_no_cabins_returns_no_cabins
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Session.PLANNING_to_ENROLLING"
          - "errors[ERR_NO_CABINS]"
        distinguishing_aspect: "PLANNING->ENROLLING is rejected ERR_NO_CABINS (409) when the session has zero cabins."
        test_recipe:
          setup:
            - "A PLANNING Session with no cabins."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "C" }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "S", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
          trigger:
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_CABINS"

      - name: session_start_before_starts_on_returns_not_started
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Session.ENROLLING_to_RUNNING"
          - "errors[ERR_SESSION_NOT_STARTED]"
        distinguishing_aspect: "ENROLLING->RUNNING is rejected ERR_SESSION_NOT_STARTED (422) when clock (2026-04-01) is before Session.starts_on (2026-07-01)."
        test_recipe:
          setup:
            - "An ENROLLING Session (>=1 cabin) with clock still at 2026-04-01, before starts_on 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "C" }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "S", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
              captures: { sess_v1: $.data.version }
          trigger:
            - call: "POST /sessions/${sess_id}/start"
              payload: { expected_session_version: "${sess_v1}" }
              as: CampDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_SESSION_NOT_STARTED"

      - name: drop_already_dropped_enrollment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.ActivityEnrollment.BOOKED_to_DROPPED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Dropping an ActivityEnrollment already in DROPPED returns ERR_INVALID_STATE (409); no further seat decrement."
        test_recipe:
          setup:
            - "An ActivityEnrollment already DROPPED (booked then dropped once)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "C" }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "S", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/activities"
              payload: { name: "Crafts", slot_day: 1, starts_minute: 60, ends_minute: 120, seat_capacity: 5 }
              as: CampDirector
              captures: { off_id: $.data.id }
            - call: "POST /guardians/register"
              payload: { email: "dd@x.com", full_name: "DD", phone: "555-2020" }
              as: Anonymous
              captures: { g_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Kid", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { c_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c_id}" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { hf_id: $.data.id }
            - call: "POST /health-forms/${hf_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
            - call: "POST /applications"
              payload: { camper_id: "${c_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
            - call: "POST /activity-enrollments"
              payload: { offering_id: "${off_id}", application_id: "${app_id}" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { ae_id: $.data.id }
            - call: "POST /activity-enrollments/${ae_id}/drop"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /activity-enrollments/${ae_id}/drop"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: health_clear_with_allergy_no_epipen_returns_epipen_required
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.HealthForm.SUBMITTED_to_CLEARED"
          - "errors[ERR_EPIPEN_REQUIRED]"
        distinguishing_aspect: "Submit succeeds for a life-threatening-allergy form only if epipen_on_file=true; submitting with epipen_on_file=false is rejected ERR_EPIPEN_REQUIRED (422) at the submit gate."
        test_recipe:
          setup:
            - "A DRAFT HealthForm with has_life_threatening_allergy=true and epipen_on_file=false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "C" }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /guardians/register"
              payload: { email: "ep@x.com", full_name: "EP", phone: "555-3030" }
              as: Anonymous
              captures: { g_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Kid", age: 10, gender: "GIRL" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { c_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c_id}", has_life_threatening_allergy: true, epipen_on_file: false }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { hf_id: $.data.id }
          trigger:
            - call: "POST /health-forms/${hf_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_EPIPEN_REQUIRED"

      - name: aid_revoke_reverts_paid_in_full_to_balance_due
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.FinancialAidAward.APPROVED_to_REVOKED"
          - "entities.Application.fields.payment_status"
        distinguishing_aspect: "Revoking an APPROVED award recomputes Application.aid_cents downward; an Application that was PAID_IN_FULL on the strength of that aid reverts to BALANCE_DUE."
        test_recipe:
          setup:
            - "Application ENROLLED, deposit 25000 paid, an aid of 345000 APPROVED so settled_balance==0 and payment_status==PAID_IN_FULL (list 370000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "C", deposit_cents: 25000, counselor_camper_ratio: 6 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "S", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 10 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
              captures: { cab_id: $.data.id }
            - call: "POST /camps/${camp_id}/staff"
              payload: { full_name: "Couns", role_kind: "COUNSELOR", is_background_cleared: true }
              as: CampDirector
              captures: { staff_id: $.data.id }
            - call: "POST /cabin-assignments"
              payload: { cabin_id: "${cab_id}", staff_member_id: "${staff_id}" }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /guardians/register"
              payload: { email: "rv@x.com", full_name: "RV", phone: "555-4040" }
              as: Anonymous
              captures: { g_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Kid", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { c_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c_id}" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { hf_id: $.data.id }
            - call: "POST /health-forms/${hf_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
            - call: "POST /health-forms/${hf_id}/clear"
              payload: { review_note: "ok" }
              as: InfirmaryNurse
            - call: "POST /applications"
              payload: { camper_id: "${c_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g_id}"
            - call: "POST /applications/${app_id}/pay-deposit"
              payload: { amount_cents: 25000 }
              as: Guardian
              as_user_id: "${g_id}"
            - call: "POST /financial-aid"
              payload: { application_id: "${app_id}", kind: "NEED_GRANT", amount_cents: 345000 }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { aid_id: $.data.id }
            - call: "GET /applications/${app_id}"
              payload: {}
              as: CampDirector
              captures: { app_v: $.data.version }
            - call: "POST /financial-aid/${aid_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: CampDirector
            - call: "GET /cabins/${cab_id}"
              payload: {}
              as: CampDirector
              captures: { cab_v: $.data.version }
            - call: "POST /cabins/${cab_id}/assign-bunk"
              payload: { application_id: "${app_id}", expected_cabin_version: "${cab_v}" }
              as: CampDirector
            - call: "POST /applications/${app_id}/enroll"
              payload: {}
              as: CampDirector
          trigger:
            - call: "POST /financial-aid/${aid_id}/revoke"
              payload: {}
              as: CampDirector
          assert:
            - "FinancialAidAward.${aid_id}.status == REVOKED"
            - "Application.${app_id}.aid_cents == 0"
            - "Application.${app_id}.settled_balance_cents == 345000"
            - "Application.${app_id}.payment_status == BALANCE_DUE"

      - name: run_intake_promotes_earliest_waitlisted_into_freed_seat
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Application.WAITLISTED_to_OFFERED"
          - "state_machines.Application.OFFERED_to_WITHDRAWN"
          - "entities.Session.fields.waitlist_length"
        distinguishing_aspect: "After a capacity-1 session has one OFFERED and one WAITLISTED application, withdrawing the offered one then run-intake promotes the earliest-submitted WAITLISTED application to OFFERED (waitlist_length 1 -> 0)."
        test_recipe:
          setup:
            - "Capacity-1 session, one cabin. App-A submitted first -> OFFERED. App-B submitted second -> WAITLISTED. App-A then withdrawn (seat freed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CampDirector
            - call: "POST /camps"
              payload: { name: "C", deposit_cents: 25000 }
              as: CampDirector
              captures: { camp_id: $.data.id }
            - call: "POST /camps/${camp_id}/sessions"
              payload: { name: "S", starts_on: "2026-07-01T00:00:00Z", ends_on: "2026-07-14T00:00:00Z", visiting_day_on: "2026-07-07T00:00:00Z", capacity: 1 }
              as: CampDirector
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /sessions/${sess_id}/cabins"
              payload: { name: "Birch", gender_band: "BOYS", min_age: 8, max_age: 12, bunk_capacity: 6 }
              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /guardians/register"
              payload: { email: "wa@x.com", full_name: "WA", phone: "555-5050" }
              as: Anonymous
              captures: { ga_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Kid A", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${ga_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${ca_id}" }
              as: Guardian
              as_user_id: "${ga_id}"
              captures: { hfa_id: $.data.id }
            - call: "POST /health-forms/${hfa_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${ga_id}"
            - call: "POST /applications"
              payload: { camper_id: "${ca_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${ga_id}"
              captures: { appa_id: $.data.id }
            - call: "POST /applications/${appa_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${ga_id}"
            - call: "POST /guardians/register"
              payload: { email: "wb@x.com", full_name: "WB", phone: "555-5051" }
              as: Anonymous
              captures: { gb_id: $.data.id }
            - call: "POST /campers"
