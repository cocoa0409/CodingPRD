  # ===========================================================================
  # Section 8: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_batch_create_stale_formula_version
        claim_type: occ_stale_version_conflict
        grounds:
          - concurrency_rules[batch-create-stale-formula]
          - errors[ERR_STALE_FORMULA_VERSION]
        distinguishing_aspect: |
          OCC on Formula.version: after observing version N and creating batch
          B1 (which bumps the formula to N+1 as a declared side effect), a
          second create still carrying expected_formula_version N fails with
          ERR_STALE_FORMULA_VERSION (412) — two strictly sequential requests.
        test_recipe:
          setup:
            - "LOCKED formula; client has observed Formula.version"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Occ Co", fein: "556000010", contact_email: "qa@occ.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "Occ Supply", fsma_facility_id: "FSMA-O200", country_code: "US", risk_tier: "LOW" }
