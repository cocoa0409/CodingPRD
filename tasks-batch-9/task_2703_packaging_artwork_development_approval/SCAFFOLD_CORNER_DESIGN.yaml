            - "POST /artwork-assets/${asset_2}/versions with supersedes_version_id ${v1_id} returns 422 with data.error_id == ERR_SUPERSEDES_VERSION_MISMATCH"
            - "POST /artwork-assets/${asset_1}/versions with claim_ids [${claim_de}] returns 422 with data.error_id == ERR_CLAIM_MARKET_MISMATCH"
