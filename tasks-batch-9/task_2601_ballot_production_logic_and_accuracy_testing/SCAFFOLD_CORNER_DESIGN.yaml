# =============================================================================
# 1.9 Scaffold Corner Design - breadth probe over SCAFFOLD.yaml sections 1.1-1.7
# Taxonomy: references/claim-extraction-guide.md (9 sections; claim_type values
# are that guide's per-section rows). Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as excluded_because stubs.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: en_election_creation_returns_declared_initial_ledger_fields
        claim_type: creation
        grounds:
          - entities.Election
          - endpoints.POST /elections
          - response_envelope.success
        distinguishing_aspect: "A freshly created Election echoes its six input fields and exposes every derived ledger field at its declared initial value (status SETUP, deployment_readiness BLOCKED, ballot_accountability_status PENDING, all counters 0, version 1) in the creation response itself."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
          trigger:
            - call: "POST /elections"
              payload: { name: "Special District Election", jurisdiction: "Kestrel County", election_date: "2027-03-02T00:00:00Z", rotation_policy: "DISTRICT_ROTATION", candidate_order_method: "FILING_ORDER", la_notice_hours: 72 }
              as: ElectionsDirector
              captures: { el_new: $.data.id }
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id / meta.api_request_timestamp present per the §1.0 success envelope."
            - "data.name == \"Special District Election\", data.jurisdiction == \"Kestrel County\", data.election_date == \"2027-03-02T00:00:00Z\", data.rotation_policy == \"DISTRICT_ROTATION\", data.candidate_order_method == \"FILING_ORDER\", data.la_notice_hours == 72."
            - "data.status == \"SETUP\", data.certified_contest_count == 0, data.committed_print_cents == 0, data.deployment_readiness == \"BLOCKED\", data.open_seal_count == 0."
            - "data.total_ballots_received == 0, data.total_ballots_issued == 0, data.ballot_accountability_status == \"PENDING\", data.net_ballot_variance == 0."
            - "data.reconciliation_basis == null and data.last_reconciled_at == null (no reconciliation has run)."
            - "data.id is a non-empty server-minted string, data.version == 1, data.created_at == \"2026-08-01T00:00:00Z\" (the logical clock, not the host wall clock)."

      - name: en_election_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Election.fields.rotation_policy
          - entities.Election.fields.candidate_order_method
          - entities.Election.fields.la_notice_hours
          - entities.Contest.fields.rotation_required
          - entities.PrintVendor.fields.status
        distinguishing_aspect: "Every §1.1 field carrying a `default:` and reachable through an optional (`?`) §1.5 input takes exactly that default when the key is omitted: NONE, ALPHABETICAL_BY_BALLOT_NAME, 48, rotation_required false, vendor status ACTIVE, and nullable optionals stay null."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
          trigger:
            - call: "POST /elections"
              payload: { name: "Default Probe Election", jurisdiction: "Kestrel County", election_date: "2026-11-03T00:00:00Z" }
              as: ElectionsDirector
              captures: { el_d: $.data.id }
            - call: "POST /elections/${el_d}/contests"
              payload: { title: "County Clerk", contest_type: "CANDIDATE", district_code: "D-07", seats_open: 1 }
              as: BallotCoordinator
              captures: { ct_d: $.data.id }
            - call: "POST /contests/${ct_d}/candidates"
              payload: { full_name: "Bea Brooks", ballot_name: "Brooks", filing_received_at: "2026-06-02T09:00:00Z" }
              as: BallotCoordinator
            - call: "POST /print-vendors"
              payload: { name: "Larkspur Press", press_line_count: 1, certified_secure: true }
              as: ElectionsDirector
              captures: { vend_d: $.data.id }
            - call: "POST /elections/${el_d}/tabulator-units"
              payload: { asset_tag: "TAB-D01" }
              as: VotingSystemTechnician
          assert:
            - "The election response has rotation_policy == \"NONE\", candidate_order_method == \"ALPHABETICAL_BY_BALLOT_NAME\" and la_notice_hours == 48."
            - "The contest response has rotation_required == false (§1.1 Contest.rotation_required default), status == \"DRAFT\" and ballot_order_index == null."
            - "The candidate response has party_code == null and status == \"FILED\" (party_code is an optional input with no default)."
            - "The vendor response has status == \"ACTIVE\", quality_defect_rate_bp == 0 and active_job_count == 0."
            - "The tabulator response has firmware_version == null, program_status == \"UNPROGRAMMED\" and custody_status == \"IN_VAULT\"."

      - name: en_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.request-schema-valid
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Each omitted §1.5 required input field (name on POST /elections, press_line_count on POST /print-vendors, polling_place on POST /elections/{id}/precincts, withdrawn_reason on POST /contests/{id}/withdraw) returns ERR_INVALID_REQUEST with HTTP 400 and creates no row."
        test_recipe:
          setup:
            - "One election in SETUP with one DRAFT contest and one filed candidate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
          trigger:
            - call: "POST /elections"
              payload: { jurisdiction: "Kestrel County", election_date: "2026-11-03T00:00:00Z" }
              as: ElectionsDirector
              captures: { e_no_name: $.data.error_id }
            - call: "POST /print-vendors"
              payload: { name: "Nameless Press", certified_secure: true }
              as: ElectionsDirector
              captures: { e_no_lines: $.data.error_id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-900", district_codes: ["D-12"], registered_voter_count: 10 }
              as: BallotCoordinator
              captures: { e_no_place: $.data.error_id }
            - call: "POST /contests/${ct}/withdraw"
              payload: {}
              as: ElectionsDirector
              captures: { e_no_reason: $.data.error_id }
          assert:
            - "All four calls return HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" and a non-empty data.message, per §1.4 request-schema-valid (priority 30)."
            - "GET /elections/${el}/contests returns exactly 1 contest, still status DRAFT with withdrawn_reason null: the rejected withdraw wrote nothing."
            - "GET /precincts?election_id=${el} returns an empty array with total_count == 0: the rejected precinct was not created."

      - name: en_field_constraints_reject_invalid_enum_and_out_of_range_values
        claim_type: type_constraints
        grounds:
          - entities.Election.fields.rotation_policy
          - entities.Contest.fields.contest_type
          - entities.Contest.fields.seats_open
          - entities.Precinct.fields.registered_voter_count
          - entities.BallotStyle.fields.language_set
          - entities.BallotStyle.fields.required_formats
          - entities.PrintJob.fields.press_window_end
          - validations.request-schema-valid
        distinguishing_aspect: "Every §1.1 `constraints:` clause reachable from a §1.5 input is enforced at priority 30: an out-of-set enum, a count below its declared floor, a negative quantity, a language_set without EN, a required_formats without PAPER_STANDARD and a press window whose end is not after its start each return ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One election in SETUP (its id is ${el}) with one DRAFT contest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
          trigger:
            - call: "POST /elections"
              payload: { name: "Bad Rotation", jurisdiction: "Kestrel County", election_date: "2026-11-03T00:00:00Z", rotation_policy: "MONTHLY_ROTATION" }
              as: ElectionsDirector
              captures: { e_enum: $.data.error_id }
            - call: "POST /elections"
              payload: { name: "Bad Notice", jurisdiction: "Kestrel County", election_date: "2026-11-03T00:00:00Z", la_notice_hours: 0 }
              as: ElectionsDirector
              captures: { e_hours: $.data.error_id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "Ballot Question 1", contest_type: "REFERENDUM", district_code: "D-12", seats_open: 1 }
              as: BallotCoordinator
              captures: { e_ctype: $.data.error_id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "Zero Seat Race", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 0 }
              as: BallotCoordinator
              captures: { e_seats: $.data.error_id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-901", district_codes: ["D-12"], registered_voter_count: -5, polling_place: "Nowhere" }
              as: BallotCoordinator
              captures: { e_rvc: $.data.error_id }
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-900", district_codes: ["D-12"], language_set: ["ES"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { e_lang: $.data.error_id }
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-901", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["LARGE_PRINT"] }
              as: BallotCoordinator
              captures: { e_fmt: $.data.error_id }
          assert:
            - "All seven calls return HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
            - "rotation_policy \"MONTHLY_ROTATION\" is outside {NONE, PRECINCT_ROTATION, DISTRICT_ROTATION}; contest_type \"REFERENDUM\" is outside {CANDIDATE, MEASURE}."
            - "la_notice_hours 0 violates \">= 1\", seats_open 0 violates \">= 1\", registered_voter_count -5 violates \">= 0\"."
            - "language_set [\"ES\"] violates \"must contain EN\" and required_formats [\"LARGE_PRINT\"] violates \"must contain PAPER_STANDARD\"."
            - "GET /ballot-styles?election_id=${el} returns an empty array with total_count == 0: neither rejected style exists."

      - name: en_system_and_computed_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Election.fields.status
          - entities.Election.fields.certified_contest_count
          - entities.Election.fields.committed_print_cents
          - validations.request-schema-valid
        distinguishing_aspect: "Client-supplied values for `source: system` and `source: computed` fields (id, status, version, certified_contest_count, committed_print_cents) are ignored rather than rejected - §1.4 request-schema-valid lists no unknown-field violation - and the server-generated values win."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
          trigger:
            - call: "POST /elections"
              payload: { name: "Smuggled Fields", jurisdiction: "Kestrel County", election_date: "2026-11-03T00:00:00Z", id: "00000000-0000-0000-0000-000000000099", status: "RECONCILED", version: 77, certified_contest_count: 42, committed_print_cents: 999999, created_at: "1999-01-01T00:00:00Z" }
              as: ElectionsDirector
              captures: { el_x: $.data.id }
          assert:
            - "HTTP 201 - the extra keys are ignored, not rejected: data.error_id is absent."
            - "data.id != \"00000000-0000-0000-0000-000000000099\" (server-minted)."
            - "data.status == \"SETUP\" (the system field ignores the submitted RECONCILED), data.version == 1 (ignores 77)."
            - "data.certified_contest_count == 0 (ignores 42) and data.committed_print_cents == 0 (ignores 999999)."
            - "data.created_at == \"2026-08-01T00:00:00Z\" (the logical clock, ignoring the submitted 1999 timestamp)."

      - name: en_precinct_required_ballot_quantity_computed_from_registered_voters
        claim_type: computed_fields
        grounds:
          - entities.Precinct.fields.required_ballot_quantity
          - calculations.precinct_ballot_requirement
          - endpoints.POST /elections/{id}/precincts
        distinguishing_aspect: "required_ballot_quantity is written by the server as ceil(registered_voter_count * 11 / 10) in the creation response itself: 100 -> 110, 9 -> 10 (9.9 rounded up), 1750 -> 1925 (exact, no rounding) and 0 -> 0."
        test_recipe:
          setup:
            - "One election in SETUP, no precincts yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
          trigger:
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-001", district_codes: ["D-12"], registered_voter_count: 100, polling_place: "Kestrel Community Hall" }
              as: BallotCoordinator
              captures: { pr_a: $.data.id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-002", district_codes: ["D-12"], registered_voter_count: 9, polling_place: "Grange Annex" }
              as: BallotCoordinator
              captures: { pr_b: $.data.id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-003", district_codes: ["D-07", "D-12"], registered_voter_count: 1750, polling_place: "Civic Center" }
              as: BallotCoordinator
              captures: { pr_c: $.data.id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-004", district_codes: ["D-19"], registered_voter_count: 0, polling_place: "Vacant Township Hall" }
              as: BallotCoordinator
              captures: { pr_d: $.data.id }
            - call: "GET /elections/${el}"
              payload: {}
              as: ElectionsDirector
          assert:
            - "Precinct.${pr_a}.required_ballot_quantity == 110, Precinct.${pr_b}.required_ballot_quantity == 10, Precinct.${pr_c}.required_ballot_quantity == 1925, Precinct.${pr_d}.required_ballot_quantity == 0."
            - "All four precincts have assigned_style_id == null, ballots_received == 0 and deployment_status == \"NOT_READY\"."
            - "The submitted district_codes are echoed as sets: Precinct.${pr_c}.district_codes == [\"D-07\", \"D-12\"]."
            - "Election.${el}.deployment_readiness == \"BLOCKED\" in the final GET: adding NOT_READY precincts can only block readiness (§1.3 election_deployment_readiness step 3)."

      - name: en_ballot_style_creation_recomputes_rotation_seed_index_across_election
        claim_type: computed_fields
        grounds:
          - entities.BallotStyle.fields.rotation_seed_index
          - entities.BallotStyle.fields.contest_count
          - endpoints.POST /elections/{id}/ballot-styles
        distinguishing_aspect: "rotation_seed_index is not a creation-order sequence: inserting style S-100 after S-200 renumbers EVERY non-superseded style of the election by style_code ASC, so S-200's seed moves 0 -> 1 without S-200 being written by the client."
        test_recipe:
          setup:
            - "One election in SETUP with one CERTIFIED CANDIDATE contest in district D-12, and one ballot style S-200 covering D-12 created first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-200", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st_200: $.data.id, seed_200_initial: $.data.rotation_seed_index }
          trigger:
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN", "ES"], required_formats: ["PAPER_STANDARD", "LARGE_PRINT"] }
              as: BallotCoordinator
              captures: { st_100: $.data.id }
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-300", district_codes: ["D-19"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st_300: $.data.id }
            - call: "GET /ballot-styles/${st_200}"
              payload: {}
              as: BallotCoordinator
          assert:
            - "${seed_200_initial} == 0: S-200 was the only non-superseded style when it was created."
            - "BallotStyle.${st_100}.rotation_seed_index == 0 and BallotStyle.${st_300}.rotation_seed_index == 2 (ranks of style_code ASC over S-100, S-200, S-300)."
            - "The final GET shows BallotStyle.${st_200}.rotation_seed_index == 1: the pre-existing style was renumbered by the insert of a lower style_code."
            - "BallotStyle.${st_100}.contest_count == 1 and BallotStyle.${st_200}.contest_count == 1 (the CERTIFIED D-12 contest is a member), while BallotStyle.${st_300}.contest_count == 0 (D-19 covers no certified contest)."
            - "All three styles have status \"DRAFT\", revision 1, proof_cycle_count 0, translated_languages [], certified_formats [], precinct_count 0."

      - name: en_ballot_lot_retrieval_returns_stored_accounting_line
        claim_type: retrieval
        grounds:
          - entities.BallotLot
          - endpoints.GET /ballot-lots/{id}
          - endpoints.POST /ballot-lots/{id}/issue
        distinguishing_aspect: "A single GET after receipt and partial issue returns the whole accounting line at once: quantity_received 12500 splits into issued_quantity 3000 and unused_quantity 9500, while the return-side counters stay 0 and lot_variance stays null because custody_state is ISSUED, not RETURNED."
        test_recipe:
          setup:
            - "One print job delivered as a single 12500-ballot lot L-001, received under seal SEAL-1001, then 3000 ballots issued to precinct P-001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st: $.data.id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-001", district_codes: ["D-12"], registered_voter_count: 100, polling_place: "Kestrel Community Hall" }
              as: BallotCoordinator
              captures: { pr: $.data.id }
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
            - call: "POST /ballot-styles/${st}/language-certifications"
              payload: { translated_languages: ["EN"], certified_formats: ["PAPER_STANDARD"] }
              as: LanguageAccessCoordinator
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "APPROVE", decision_note: "Artwork accepted" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
            - call: "POST /precincts/${pr}/assign-style"
              payload: { style_id: "${st}" }
              as: BallotCoordinator
            - call: "POST /elections/${el}/lock-styles"
              payload: {}
              as: ElectionsDirector
            - call: "GET /ballot-styles/${st}"
              payload: {}
              as: BallotCoordinator
              captures: { st_v: $.data.version }
            - call: "POST /print-vendors"
              payload: { name: "Ridgeline Secure Print", press_line_count: 2, certified_secure: true, status: "ACTIVE" }
              as: ElectionsDirector
              captures: { vend: $.data.id }
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-10T08:00:00Z", press_window_end: "2026-08-12T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job: $.data.id }
            - call: "POST /print-jobs/${job}/approve-proof"
              payload: {}
              as: ElectionsDirector
            - call: "POST /print-jobs/${job}/inspect"
              payload: { sample_size: 500, defect_count: 6 }
              as: WarehouseCustodian
            - call: "POST /print-jobs/${job}/deliver"
              payload: { lots: [{ lot_code: "L-001", quantity_shipped: 12500, seal_number: "SEAL-1001" }] }
              as: PrintVendorRep
              as_user_id: "${vend}"
