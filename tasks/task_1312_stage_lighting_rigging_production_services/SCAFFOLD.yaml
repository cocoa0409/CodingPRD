errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint or for the requested transition per the state machine actor" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties breach: point approver is its submitter, or FINAL inspection passer approved a rigging point on the same production" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Identity-bound action attempted by a different user (CrewChief self-confirm/self-report; inspection pass/fail continuity)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-positive number, or window end not after start" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path or body resource id does not resolve" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not declared from the current state, or child creation attempted while the parent is in a wrong state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_production_version != Production.version or expected_plot_version != LightingPlot.version" }
  - { id: ERR_POINT_OVERLOAD, http: 422, condition: "factored_load_kg strictly greater than venue.max_point_capacity_kg" }
  - { id: ERR_BAY_OVERLOAD, http: 422, condition: "Bay aggregate factored load strictly greater than venue.bay_aggregate_limit_kg at plot or point approval" }
  - { id: ERR_GENERATOR_CAPACITY_EXCEEDED, http: 422, condition: "required_kva exceeds the largest generator tier (400 kVA)" }
  - { id: ERR_HOUSE_POWER_OVERLOAD, http: 422, condition: "A phase exceeds house_power_amps_per_phase x 208 watts on a house-powered plan" }
  - { id: ERR_PHASE_IMBALANCE, http: 422, condition: "(max phase - min phase) / max phase strictly greater than 0.15" }
  - { id: ERR_TRUCK_OVERLOAD, http: 422, condition: "Recomputed pack_weight_kg strictly greater than truck.capacity_kg at check-out" }
  - { id: ERR_POINT_ALREADY_RESERVED, http: 409, condition: "point_label held by a non-RELEASED point at the same venue over an intersecting closed occupancy window" }
  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 409, condition: "New production's closed occupancy window intersects another non-CANCELLED production at the same venue" }
  - { id: ERR_DOCK_WINDOW_CONFLICT, http: 409, condition: "CONFIRMED/AUTHORIZED schedule already occupies the same dock door over an intersecting half-open window" }
  - { id: ERR_DOCK_DOOR_INVALID, http: 422, condition: "dock_door_index >= venue.dock_doors" }
  - { id: ERR_TECHNICIAN_TURNAROUND, http: 409, condition: "Gap between two of the technician's call windows strictly less than venue.turnaround_min_hours" }
  - { id: ERR_CLASSIFICATION_MISMATCH, http: 422, condition: "Technician classification does not match the call department mapping" }
  - { id: ERR_DUPLICATE_DAMAGE_REPORT, http: 409, condition: "A FILED or ASSESSED damage report already exists for the pull list entry" }
  - { id: ERR_SETTLEMENT_EXISTS, http: 409, condition: "A SettlementStatement already exists for the production" }
  - { id: ERR_ENGINEERING_DEADLINE_PASSED, http: 422, condition: "Engineering submission after load_in_at - engineering_submission_lead_hours" }
  - { id: ERR_CREW_CALL_LATE, http: 422, condition: "Publish attempted after call_start - crew_call_publish_lead_hours" }
  - { id: ERR_TOO_EARLY, http: 422, condition: "Clock-gated transition attempted before its time (load-in, show complete, call complete)" }
  - { id: ERR_EMPTY_PLOT, http: 422, condition: "Plot submit attempted with zero points in RESERVED/UNDER_REVIEW/APPROVED" }
  - { id: ERR_PLOT_NOT_SUBMITTED, http: 409, condition: "Engineering review requested while the plot is DRAFT or SUPERSEDED" }
  - { id: ERR_STALE_PLOT_REVISION, http: 409, condition: "Point approval attempted after the plot's version advanced past plot_version_at_submission" }
  - { id: ERR_PRODUCTION_NOT_READY, http: 409, condition: "mark-ready attempted while posture is BLOCKED or PARTIAL" }
  - { id: ERR_ASSET_NOT_AVAILABLE, http: 409, condition: "Reserve attempted while the asset is not AVAILABLE; pull creation attempted on a RETIRED/LOST/DAMAGED asset" }
  - { id: ERR_SCHEDULE_NOT_AUTHORIZED, http: 409, condition: "Check-out against a schedule that is not AUTHORIZED LOAD_IN; or AUTHORIZE attempted while the production state does not match the direction" }
  - { id: ERR_CREW_HEADCOUNT_UNMET, http: 409, condition: "Call confirm attempted with fewer CONFIRMED assignments than required_headcount" }
  - { id: ERR_OPEN_PULL_LIST, http: 409, condition: "CLOSE attempted with pull list entries still in REQUESTED/RESERVED/PREPPED/OUT" }
  - { id: ERR_OPEN_LOAD_SCHEDULE, http: 409, condition: "CLOSE attempted with load schedules still in PLANNED/CONFIRMED/AUTHORIZED" }
  - { id: ERR_PREREQUISITE_INSPECTION_MISSING, http: 409, condition: "FINAL inspection begun before the latest RIGGING and ELECTRICAL inspections both passed" }
  - { id: ERR_RIGGING_NOT_APPROVED, http: 409, condition: "RIGGING inspection begun while a point on the current APPROVED plot is not APPROVED" }
  - { id: ERR_POWER_PLAN_NOT_APPROVED, http: 409, condition: "ELECTRICAL inspection begun without an APPROVED power plan" }
  - { id: ERR_SETTLEMENT_NOT_DRAFT, http: 409, condition: "Charge or waive-from-CHARGED attempted while the settlement is missing or not DRAFT" }
  - { id: ERR_UNRESOLVED_DAMAGE_REPORTS, http: 409, condition: "Settlement issue attempted with damage reports still FILED or ASSESSED" }
  - { id: ERR_VALUATION_METHOD_INVALID, http: 422, condition: "LOSS report assessed with REPAIR_QUOTE" }
  - { id: ERR_REPAIR_QUOTE_REQUIRED, http: 422, condition: "REPAIR_QUOTE valuation without repair_quote_cents" }
  - { id: ERR_ADJUSTMENT_OUT_OF_RANGE, http: 422, condition: "abs(dispute_adjustment_cents) exceeds damage_total_cents at resolve" }
  - { id: ERR_HOURS_OUT_OF_RANGE, http: 422, condition: "worked_hours not in (0, 24] or with more than 2 decimal places" }

roles:
  - name: PlatformAdmin
    description: "Test-infrastructure operator; drives the logical clock only"
    identity: opaque
    exclusive_operations: ["POST /api/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: ProductionManager
    description: "Vendor-side producer: owns venues, technicians, productions, plots (create/submit), crew calls, assignments, power plans, load schedules, inspection scheduling, settlements, damage waivers"
    identity: opaque
    exclusive_operations: ["venue/technician/production/truck-free creation surface", "production transitions", "plot create + submit", "crew call create + transitions", "assignment create + no-show + manager hour entry", "power plan create + submit + revise", "load schedule create + transitions", "inspection schedule + reschedule", "settlement create + issue + resolve + mark paid", "damage report waive"]
    shared_operations: ["all GET endpoints"]
  - name: RiggingSupervisor
    description: "Leads the rigging crew: reserves points, submits them to engineering, revises rejected points, releases points"
    identity: opaque
    exclusive_operations: ["POST /api/plots/{id}/rigging-points", "rigging point submit/revise/release transitions"]
    shared_operations: ["all GET endpoints"]
  - name: StructuralEngineer
    description: "Independent engineer: approves/rejects plots and rigging points; never the submitter of what they approve"
    identity: opaque
    exclusive_operations: ["plot approve/reject", "rigging point approve/reject"]
    shared_operations: ["all GET endpoints"]
  - name: WarehouseChief
    description: "Runs the shop: assets, trucks, pull list fulfillment, check-in/out, damage filing and assessment, charging"
    identity: opaque
    exclusive_operations: ["asset create/transitions", "truck create", "pull list entry create + transitions", "damage report file + assess + charge"]
    shared_operations: ["all GET endpoints"]
  - name: SafetyInspector
    description: "Certifying inspector: electrical sign-off on power plans; runs and records safety inspections"
    identity: opaque
    exclusive_operations: ["power plan approve/reject", "inspection begin/pass/fail"]
    shared_operations: ["all GET endpoints"]
  - name: CrewChief
    description: "Working crew lead; identity-bound to a Technician record for self-confirm and self hour-reporting"
    identity: "entity_backed:Technician"
    exclusive_operations: ["assignment confirm (own)", "assignment report-hours (own)"]
