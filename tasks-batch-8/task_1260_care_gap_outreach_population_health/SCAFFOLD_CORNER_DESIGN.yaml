# =============================================================================
# §1.9 Scaffold Corner Design — task 1260 Care Gap Outreach
# Breadth coverage: every non-§1.8 testable claim across §1.1–§1.7
# =============================================================================

scaffold_corner_design:

  # -------------------------------------------------------------------------
  # Section: entities
  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: registry_creation_returns_default_fields
        claim_type: creation_success
        grounds: [entities.PopulationRegistry, endpoints]
        distinguishing_aspect: "POST /population-health/registries returns 201 with system-populated status=ACTIVE and current_business_date = 2026-05-01T00:00:00Z default."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { rid: $.data.id, status: $.data.status, bus_date: $.data.current_business_date }
          assert:
            - "${status} == ACTIVE"
            - "${bus_date} == 2026-05-01T00:00:00Z"
            - "${rid} is non-null"

      - name: registry_get_returns_stored_data
        claim_type: retrieval
        grounds: [entities.PopulationRegistry]
        distinguishing_aspect: "GET /population-health/registries/{id} returns the same name and program_year supplied on create."
        test_recipe:
          setup: ["one registry exists"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RX", program_year: 2026 }
              as: ProgramAdministrator
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /population-health/registries/${rid}"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "PopulationRegistry.${rid}.name == RX"
            - "PopulationRegistry.${rid}.program_year == 2026"

      - name: registry_list_paginated
        claim_type: listing
        grounds: [entities.PopulationRegistry, response_envelope]
        distinguishing_aspect: "GET /population-health/registries honors limit/offset; response envelope exposes limit, offset, total_count, has_more."
        test_recipe:
          setup: ["two registries exist"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RA", program_year: 2026 }
              as: ProgramAdministrator
            - call: "POST /population-health/registries"
              payload: { name: "RB", program_year: 2026 }
              as: ProgramAdministrator
          trigger:
            - call: "GET /population-health/registries"
              payload: { limit: 1, offset: 0 }
              as: ProgramAdministrator
          assert:
            - "response.meta is present"
            - "data is an array of length 1"
            - "pagination reports total_count == 2 and has_more == true"

      - name: registry_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a random UUID that was never created returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /population-health/registries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: measure_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.MeasureDefinition]
        distinguishing_aspect: "POST measure-definitions without lookback_days (required, no default) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["registry exists"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: measure_exclusion_window_default_applied
        claim_type: defaults
        grounds: [entities.MeasureDefinition.fields.exclusion_window_days]
        distinguishing_aspect: "Omitting exclusion_window_days yields default 90 on the created MeasureDefinition."
        test_recipe:
          setup: ["registry exists"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { mid: $.data.id }
          assert:
            - "MeasureDefinition.${mid}.exclusion_window_days == 90"
            - "MeasureDefinition.${mid}.reporting_lag_days == 30"

      - name: care_gap_computed_fields_ignore_input
        claim_type: computed_fields
        grounds: [entities.CareGap.fields.priority_score, entities.CareGap.fields.days_overdue]
        distinguishing_aspect: "POST endpoints never accept priority_score or days_overdue from input; they are computed by the system."
        test_recipe:
          setup: ["registry, measure, cohort, panel activated -> CareGap exists"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id, score: $.data.0.priority_score }
          trigger: []
          assert:
            - "CareGap.${gap_id}.priority_score is a system-computed integer (>= 0)"
            - "CareGap.${gap_id}.due_date == 2026-05-01T00:00:00Z  # default clock, no qualifying event"

      - name: outreach_attempt_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.OutreachAttempt]
        distinguishing_aspect: "OutreachAttempt has common_fields: false -> response contains id and created_at but no version field, and there is no update endpoint."
        test_recipe:
          setup: ["one OUTREACH_IN_PROGRESS care gap with at least one attempt"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/outreach-campaigns"
              payload:
                panel_id: "${panel_id}"
                measure_id: "${meas_id}"
                name: "C"
                channel: "CALL"
                starts_at: "2026-05-01T00:00:00Z"
                ends_at: "2026-12-31T23:59:59Z"
              as: ProgramAdministrator
              captures: { camp_id: $.data.id }
            - call: "POST /population-health/outreach-campaigns/${camp_id}/schedule"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/outreach-campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id, gap_v: $.data.0.version }
          trigger:
            - call: "POST /population-health/care-gaps/${gap_id}/outreach-attempts"
              payload: { campaign_id: "${camp_id}", channel: "CALL", outcome: "NO_ANSWER", expected_care_gap_version: "${gap_v}" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { att_id: $.data.id }
          assert:
            - "OutreachAttempt.${att_id}.version is absent from the response body"
            - "OutreachAttempt.${att_id}.id is present"

      - name: member_enrollment_status_enum_enforced
        claim_type: type_constraints
        grounds: [entities.Member.fields.enrollment_status]
        distinguishing_aspect: "POST /members rejects an invalid risk_tier enum value with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["registry exists"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "ULTRA" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

  # -------------------------------------------------------------------------
  # Section: state_machines
  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: initial_state_care_gap_is_open
        claim_type: initial_state
        grounds: [state_machines.CareGap]
        distinguishing_aspect: "A newly materialized CareGap starts in OPEN with closure_source null."
        test_recipe:
          setup: ["registry, measure, cohort, panel activated"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_status: $.data.0.status }
          assert:
            - "${gap_status} == OPEN"

      - name: terminal_state_lockdown_expired_gap
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CareGap
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An EXPIRED CareGap cannot accept an outreach attempt — POST returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["CareGap EXPIRED (clock advanced past due_date + reporting_lag_days); campaign ACTIVE"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365, reporting_lag_days: 30 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            # move clock way past due_date + lag to expire all open gaps
            - call: "POST /population-health/_clock/set_current_utc"
              payload: { registry_id: "${reg_id}", to_iso8601: "2027-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/outreach-campaigns"
              payload:
                panel_id: "${panel_id}"
                measure_id: "${meas_id}"
                name: "C"
                channel: "CALL"
                starts_at: "2026-05-01T00:00:00Z"
                ends_at: "2027-12-31T23:59:59Z"
              as: ProgramAdministrator
              captures: { camp_id: $.data.id }
            - call: "POST /population-health/outreach-campaigns/${camp_id}/schedule"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/outreach-campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id, gap_v: $.data.0.version, gap_status: $.data.0.status }
          trigger:
            - call: "POST /population-health/care-gaps/${gap_id}/outreach-attempts"
              payload: { campaign_id: "${camp_id}", channel: "CALL", outcome: "NO_ANSWER", expected_care_gap_version: "${gap_v}" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "${gap_status} == EXPIRED"
            - "${err} == ERR_INVALID_STATE"

      - name: campaign_invalid_transition_draft_to_active
        claim_type: invalid_transition
        grounds:
          - state_machines.OutreachCampaign
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cannot launch a campaign directly from DRAFT — must go through SCHEDULED first; calling /launch from DRAFT returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["registry, measure, cohort, panel, DRAFT campaign"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/outreach-campaigns"
              payload:
                panel_id: "${panel_id}"
                measure_id: "${meas_id}"
                name: "C"
                channel: "CALL"
                starts_at: "2026-05-01T00:00:00Z"
                ends_at: "2026-12-31T23:59:59Z"
              as: ProgramAdministrator
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /population-health/outreach-campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: evidence_approve_side_effects_fire
        claim_type: side_effect_execution
        grounds: [state_machines.GapClosureEvidence.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Approving evidence transitions CareGap to CLOSED, sets closure_source, decrements Member.open_gap_count."
        excluded_because:
          difficulty_instance: evidence_approve_to_incentive_payout_chain
          rationale: "Covered as the head of the depth>=3 cascade asserted in §1.8."

      - name: exclusion_approve_cascades_to_excluded_gaps
        claim_type: cascade_down
        grounds: [state_machines.ExclusionRequest.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "Approving an exclusion transitions all matching CareGaps to EXCLUDED (cascade down from exclusion -> care gaps)."
        test_recipe:
          setup: ["Member with two OPEN care gaps for the same measure (two panels), exclusion request UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/members/${m_id}/exclusion-requests"
              payload: { measure_id: "${meas_id}", exclusion_kind: "MEMBER_REFUSAL", justification: "member declined" , effective_from: "2026-05-01T00:00:00Z" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { exr_id: $.data.id }
            - call: "POST /population-health/exclusion-requests/${exr_id}/start-review"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_1"
          trigger:
            - call: "POST /population-health/exclusion-requests/${exr_id}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_2"
          assert:
            - "Member.${m_id}.open_gap_count == 0"

      - name: no_show_appointment_revert_compensation
        claim_type: compensation
        grounds: [state_machines.Appointment.SCHEDULED_to_NO_SHOW]
        distinguishing_aspect: "After NO_SHOW, the CareGap reverts OUTREACH_IN_PROGRESS and the linked TransportationAssist is cancelled — full compensation of the appointment-forward side effects."
        excluded_because:
          difficulty_instance: no_show_cascade_cancels_transport
          rationale: "Covered as §1.8 transitive_cascade instance."

  # -------------------------------------------------------------------------
  # Section: calculations
  # -------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: priority_score_correct_result_known_inputs
        claim_type: correct_result
        grounds: [calculations.priority_score]
        distinguishing_aspect: "Freshly materialized gap with days_overdue=0, risk=LOW, domain=SCREENING, attempt_count=0 yields priority_score = 0 + 5 + 20 = 25 (P4_LOW)."
        test_recipe:
          setup: ["CareGap just materialized at default clock"]
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
