# §1.8 Scaffold Difficulty Design — task 2357 Home and Hospital Instruction Program
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1–§1.7 declarations.
# All formula-derived numbers below were computed by executing the §1.3 formulas
# with their declared constants.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_accrual_vs_final_verified_apportionment_diverge_on_weekly_cap
        grounds:
          - calculations.case_apportionment_minutes
          - calculations.funding_reconciliation_net
          - state_machines.HomeboundCase.funding_status.ACCRUING_to_RECONCILED
          - entities.HomeboundCase.fields.provisional_apportionment_minutes
          - entities.HomeboundCase.fields.final_apportionment_minutes
        distinguishing_aspect: |
          The PROVISIONAL_ACCRUAL variant caps once against weekly_cap * window_weeks over the whole
          certified window and yields 480, while the FINAL_VERIFIED variant enforces weekly_cap inside
          each ISO week and drops the per-week excess, yielding 390 on the identical four sessions —
          a 90-minute divergence produced purely by the cap scope of the two variants.
        test_recipe:
          setup:
            - "One MIDDLE/IN_HOME EntitlementRule PUBLISHED with base 360, cap 480, max_session 120, max_daily 240, min_gap 15, travel_buffer 30."
            - "Student in grade 7 (grade_band MIDDLE), ENROLLED, special_ed_status NONE."
            - "HomeboundCase ACTIVE / funding ACCRUING, weekly_entitled_minutes 390, certified window 2026-09-07..2026-10-07, service_start_date 2026-09-07."
            - "Four DELIVERED and verified 120-minute IN_HOME sessions, all inside ISO week 37 (2026-09-07 and 2026-09-08), credited_minutes 120 each."
            - "Logical clock advanced to 2026-09-20T00:00:00Z before reconciliation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "MIDDLE", delivery_mode: "IN_HOME", base_weekly_minutes: 360, cap_weekly_minutes: 480, min_session_minutes: 30, max_session_minutes: 120, max_daily_minutes: 240, min_gap_minutes: 15, travel_buffer_minutes: 30, status: "PUBLISHED" }
              as: ProgramAdministrator
              captures: { rule_home_id: $.data.id }
            - call: "POST /hhi/students"
              payload: { student_number: "S-0001", full_name: "Ada Lin", grade_level: 7, campus_code: "MS-01", special_ed_status: "NONE", iep_service_minutes_weekly: 0, enrollment_status: "ENROLLED" }
              as: ProgramAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /hhi/teachers"
              payload: { full_name: "Tara Ng", employee_number: "E-1001", credential_areas: ["MATH", "ELA"], grade_bands: ["MIDDLE", "HIGH"], max_weekly_caseload_minutes: 1200, safety_clearance_status: "CLEARED", clearance_expires_on: "2027-06-30", home_visit_eligible: true }
              as: ProgramAdministrator
              captures: { tch_primary_id: $.data.id }
            - call: "POST /hhi/cases"
              payload: { student_id: "${stu_id}", referral_date: "2026-09-01", delivery_mode: "IN_HOME", referral_note: "Post-surgical recovery" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /hhi/certifications"
              payload: { case_id: "${case_id}", physician_npi: "1234567890", diagnosis_category: "MEDICAL_ACUTE", certified_start_date: "2026-09-07", certified_end_date: "2026-10-07", expected_absence_days: 30, signature_date: "2026-09-01", expected_case_version: "${case_v0}", clinical_note: "Thirty-day recovery" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cert_id: $.data.id }
            - call: "POST /hhi/certifications/${cert_id}/review"
              payload: { decision: "ACCEPT", review_note: "Documentation complete" }
              as: NurseReviewer
              as_user_id: "nr-001"
            - call: "POST /hhi/safety-reviews"
              payload: { case_id: "${case_id}", evidence_source: "ONSITE_WALKTHROUGH", review_date: "2026-09-02", hazard_findings: ["UNLIT_ACCESS"], escort_available: false }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { sr_id: $.data.id }
            - call: "POST /hhi/safety-reviews/${sr_id}/finalize"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /hhi/assignments"
              payload: { case_id: "${case_id}", role: "PRIMARY", teacher_id: "${tch_primary_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { asg_primary_id: $.data.id }
            - call: "POST /hhi/assignments/${asg_primary_id}/accept"
              payload: {}
              as: HomeboundTeacher
              as_user_id: "${tch_primary_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/cases/${case_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
            - call: "POST /hhi/sessions"
              payload: { case_id: "${case_id}", assignment_id: "${asg_primary_id}", scheduled_start: "2026-09-07T09:00:00Z", scheduled_end: "2026-09-07T11:00:00Z", delivery_mode: "IN_HOME", subject: "MATH" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ses_a_id: $.data.id }
            - call: "POST /hhi/sessions"
              payload: { case_id: "${case_id}", assignment_id: "${asg_primary_id}", scheduled_start: "2026-09-07T13:00:00Z", scheduled_end: "2026-09-07T15:00:00Z", delivery_mode: "IN_HOME", subject: "ELA" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ses_b_id: $.data.id }
            - call: "POST /hhi/sessions"
              payload: { case_id: "${case_id}", assignment_id: "${asg_primary_id}", scheduled_start: "2026-09-08T09:00:00Z", scheduled_end: "2026-09-08T11:00:00Z", delivery_mode: "IN_HOME", subject: "MATH" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ses_c_id: $.data.id }
            - call: "POST /hhi/sessions"
              payload: { case_id: "${case_id}", assignment_id: "${asg_primary_id}", scheduled_start: "2026-09-08T13:00:00Z", scheduled_end: "2026-09-08T15:00:00Z", delivery_mode: "IN_HOME", subject: "ELA" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ses_d_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T18:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/sessions/${ses_a_id}/log"
              payload: { outcome: "DELIVERED", actual_minutes: 120 }
              as: HomeboundTeacher
              as_user_id: "${tch_primary_id}"
            - call: "POST /hhi/sessions/${ses_b_id}/log"
              payload: { outcome: "DELIVERED", actual_minutes: 120 }
              as: HomeboundTeacher
              as_user_id: "${tch_primary_id}"
            - call: "POST /hhi/sessions/${ses_c_id}/log"
              payload: { outcome: "DELIVERED", actual_minutes: 120 }
              as: HomeboundTeacher
              as_user_id: "${tch_primary_id}"
            - call: "POST /hhi/sessions/${ses_d_id}/log"
              payload: { outcome: "DELIVERED", actual_minutes: 120 }
              as: HomeboundTeacher
              as_user_id: "${tch_primary_id}"
            - call: "POST /hhi/sessions/${ses_a_id}/verify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
            - call: "POST /hhi/sessions/${ses_b_id}/verify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
            - call: "POST /hhi/sessions/${ses_c_id}/verify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
            - call: "POST /hhi/sessions/${ses_d_id}/verify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /hhi/cases/${case_id}/funding/report"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
            - call: "GET /hhi/cases/${case_id}/funding-summary"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
            - call: "POST /hhi/cases/${case_id}/funding/reconcile"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
          assert:
            - "HomeboundCase.${case_id}.weekly_entitled_minutes == 390"
            - "HomeboundCase.${case_id}.provisional_apportionment_minutes == 480"
            - "GET /hhi/cases/${case_id}/funding-summary → provisional_minutes == 480"
            - "GET /hhi/cases/${case_id}/funding-summary → final_verified_minutes == 390"
            - "GET /hhi/cases/${case_id}/funding-summary → window_weeks == 5"
            - "GET /hhi/cases/${case_id}/funding-summary → service_weeks == 2"
            - "GET /hhi/cases/${case_id}/funding-summary → entitled_total_minutes == 780"
            - "HomeboundCase.${case_id}.final_apportionment_minutes == 390"
            - "HomeboundCase.${case_id}.provisional_apportionment_minutes - HomeboundCase.${case_id}.final_apportionment_minutes == 90"
            - "HomeboundCase.${case_id}.funding_status == RECONCILED"
            - "HomeboundCase.${case_id}.service_status == ACTIVE"

      - name: credited_minutes_per_session_rounding_vs_weekly_unrounded_projection
        grounds:
          - calculations.session_credited_minutes
          - entities.InstructionSession.fields.credited_minutes
          - entities.HomeboundCase.fields.reported_apportionment_minutes
          - endpoints[GET /hhi/cases/{id}/funding-summary]
        distinguishing_aspect: |
          PER_SESSION_ROUNDED rounds each VIRTUAL_SYNC session's 67.5 raw minutes up to 70 before it
          reaches the ledger (140 total), while WEEKLY_UNROUNDED_PROJECTION sums 67.5 + 67.5 = 135 and
          rounds once, so projected_unrounded_minutes is 135 — a 5-minute rounding-accumulation delta on
          identical session data.
        test_recipe:
          setup:
            - "One MIDDLE/VIRTUAL_SYNC EntitlementRule PUBLISHED with base 240, cap 400, min_session 20, max_session 90, max_daily 180, min_gap 10, travel_buffer 0."
            - "HomeboundCase with delivery_mode VIRTUAL_SYNC, ACTIVE / ACCRUING, weekly_entitled_minutes 270, service_start_date 2026-09-07."
            - "Two SCHEDULED 90-minute VIRTUAL_SYNC sessions on 2026-09-07 (09:00-10:30 and 10:40-12:10), each later logged with actual_minutes 75."
            - "Logical clock at 2026-09-09T18:00:00Z when both sessions are logged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "MIDDLE", delivery_mode: "VIRTUAL_SYNC", base_weekly_minutes: 240, cap_weekly_minutes: 400, min_session_minutes: 20, max_session_minutes: 90, max_daily_minutes: 180, min_gap_minutes: 10, travel_buffer_minutes: 0, status: "PUBLISHED" }
              as: ProgramAdministrator
              captures: { rule_virtual_id: $.data.id }
            - call: "POST /hhi/students"
              payload: { student_number: "S-0003", full_name: "Ivo Park", grade_level: 8, campus_code: "MS-02", special_ed_status: "NONE", iep_service_minutes_weekly: 0, enrollment_status: "ENROLLED" }
              as: ProgramAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /hhi/teachers"
              payload: { full_name: "Tara Ng", employee_number: "E-1001", credential_areas: ["MATH", "ELA"], grade_bands: ["MIDDLE", "HIGH"], max_weekly_caseload_minutes: 1200, safety_clearance_status: "CLEARED", clearance_expires_on: "2027-06-30", home_visit_eligible: true }
              as: ProgramAdministrator
              captures: { tch_primary_id: $.data.id }
            - call: "POST /hhi/cases"
              payload: { student_id: "${stu_id}", referral_date: "2026-09-01", delivery_mode: "VIRTUAL_SYNC", referral_note: "Immunosuppressed, virtual only" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /hhi/certifications"
              payload: { case_id: "${case_id}", physician_npi: "1234567890", diagnosis_category: "MEDICAL_ACUTE", certified_start_date: "2026-09-07", certified_end_date: "2026-10-07", expected_absence_days: 30, signature_date: "2026-09-01", expected_case_version: "${case_v0}", clinical_note: "Thirty-day absence" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cert_id: $.data.id }
            - call: "POST /hhi/certifications/${cert_id}/review"
              payload: { decision: "ACCEPT", review_note: "Accepted" }
              as: NurseReviewer
              as_user_id: "nr-001"
            - call: "POST /hhi/assignments"
              payload: { case_id: "${case_id}", role: "PRIMARY", teacher_id: "${tch_primary_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { asg_primary_id: $.data.id }
            - call: "POST /hhi/assignments/${asg_primary_id}/accept"
              payload: {}
              as: HomeboundTeacher
              as_user_id: "${tch_primary_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/cases/${case_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-001"
            - call: "POST /hhi/sessions"
              payload: { case_id: "${case_id}", assignment_id: "${asg_primary_id}", scheduled_start: "2026-09-07T09:00:00Z", scheduled_end: "2026-09-07T10:30:00Z", delivery_mode: "VIRTUAL_SYNC", subject: "MATH" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ses_v1_id: $.data.id }
            - call: "POST /hhi/sessions"
              payload: { case_id: "${case_id}", assignment_id: "${asg_primary_id}", scheduled_start: "2026-09-07T10:40:00Z", scheduled_end: "2026-09-07T12:10:00Z", delivery_mode: "VIRTUAL_SYNC", subject: "ELA" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ses_v2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T18:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /hhi/sessions/${ses_v1_id}/log"
              payload: { outcome: "DELIVERED", actual_minutes: 75 }
              as: HomeboundTeacher
              as_user_id: "${tch_primary_id}"
            - call: "POST /hhi/sessions/${ses_v2_id}/log"
              payload: { outcome: "DELIVERED", actual_minutes: 75 }
              as: HomeboundTeacher
              as_user_id: "${tch_primary_id}"
            - call: "GET /hhi/cases/${case_id}/funding-summary"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          assert:
            - "InstructionSession.${ses_v1_id}.credited_minutes == 70"
            - "InstructionSession.${ses_v2_id}.credited_minutes == 70"
            - "HomeboundCase.${case_id}.reported_apportionment_minutes == 140"
            - "GET /hhi/cases/${case_id}/funding-summary → reported_apportionment_minutes == 140"
            - "GET /hhi/cases/${case_id}/funding-summary → projected_unrounded_minutes == 135"
            - "GET /hhi/cases/${case_id}/funding-summary → reported_apportionment_minutes - projected_unrounded_minutes == 5"
            - "Both AttendanceLedgerEntry rows for this case have attendance_code HB_VIRTUAL_PRESENT and apportionment_minutes 70"

      - name: safety_risk_self_reported_versus_onsite_verified_band_split
        grounds:
          - calculations.home_visit_risk_score
          - entities.HomeVisitSafetyReview.fields.scoring_variant
          - entities.HomeVisitSafetyReview.fields.clearance
          - state_machines.HomeVisitSafetyReview.DRAFT_to_FINALIZED
          - calculations.weekly_entitlement_minutes
        distinguishing_aspect: |
          With the identical hazard set {AGGRESSIVE_ANIMAL, NO_SECONDARY_EXIT, UNLIT_ACCESS} (raw 45) and
          escort_available true, the SELF_REPORTED variant scores 34 (0.75 discount, escort ignored) and
          bands CLEARED_WITH_ESCORT, while ONSITE_VERIFIED scores 35 (undiscounted minus flat 10) and
          bands VIRTUAL_ONLY — one point apart, opposite sides of VIRTUAL_ONLY_THRESHOLD, and only the
          second one rewrites the case's delivery_mode and entitlement.
        test_recipe:
          setup:
            - "MIDDLE/IN_HOME rule PUBLISHED (base 360, cap 480) and MIDDLE/VIRTUAL_SYNC rule PUBLISHED (base 240, cap 400)."
            - "Two ENROLLED grade-7 students, each with one HomeboundCase in service_status ELIGIBLE (certification ACCEPTED, expected_absence_days 30, weekly_entitled_minutes 390)."
            - "Case A carries a DRAFT HomeVisitSafetyReview with evidence_source PARENT_ATTESTATION; case B a DRAFT review with evidence_source ONSITE_WALKTHROUGH; both list the same three hazards and escort_available true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "MIDDLE", delivery_mode: "IN_HOME", base_weekly_minutes: 360, cap_weekly_minutes: 480, min_session_minutes: 30, max_session_minutes: 120, max_daily_minutes: 240, min_gap_minutes: 15, travel_buffer_minutes: 30, status: "PUBLISHED" }
              as: ProgramAdministrator
              captures: { rule_home_id: $.data.id }
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "MIDDLE", delivery_mode: "VIRTUAL_SYNC", base_weekly_minutes: 240, cap_weekly_minutes: 400, min_session_minutes: 20, max_session_minutes: 90, max_daily_minutes: 180, min_gap_minutes: 10, travel_buffer_minutes: 0, status: "PUBLISHED" }
              as: ProgramAdministrator
              captures: { rule_virtual_id: $.data.id }
            - call: "POST /hhi/students"
              payload: { student_number: "S-0001", full_name: "Ada Lin", grade_level: 7, campus_code: "MS-01", special_ed_status: "NONE", iep_service_minutes_weekly: 0, enrollment_status: "ENROLLED" }
              as: ProgramAdministrator
              captures: { stu_a_id: $.data.id }
            - call: "POST /hhi/students"
              payload: { student_number: "S-0002", full_name: "Ben Ortiz", grade_level: 7, campus_code: "MS-01", special_ed_status: "NONE", iep_service_minutes_weekly: 0, enrollment_status: "ENROLLED" }
              as: ProgramAdministrator
              captures: { stu_b_id: $.data.id }
            - call: "POST /hhi/cases"
              payload: { student_id: "${stu_a_id}", referral_date: "2026-09-01", delivery_mode: "IN_HOME", referral_note: "Case A" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_a_id: $.data.id, case_a_v0: $.data.version }
            - call: "POST /hhi/certifications"
              payload: { case_id: "${case_a_id}", physician_npi: "1234567890", diagnosis_category: "MEDICAL_ACUTE", certified_start_date: "2026-09-07", certified_end_date: "2026-10-07", expected_absence_days: 30, signature_date: "2026-09-01", expected_case_version: "${case_a_v0}", clinical_note: "Case A cert" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cert_a_id: $.data.id }
            - call: "POST /hhi/certifications/${cert_a_id}/review"
              payload: { decision: "ACCEPT", review_note: "Accepted" }
              as: NurseReviewer
              as_user_id: "nr-001"
            - call: "POST /hhi/cases"
              payload: { student_id: "${stu_b_id}", referral_date: "2026-09-01", delivery_mode: "IN_HOME", referral_note: "Case B" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_b_id: $.data.id, case_b_v0: $.data.version }
            - call: "POST /hhi/certifications"
              payload: { case_id: "${case_b_id}", physician_npi: "1234567891", diagnosis_category: "MEDICAL_ACUTE", certified_start_date: "2026-09-07", certified_end_date: "2026-10-07", expected_absence_days: 30, signature_date: "2026-09-01", expected_case_version: "${case_b_v0}", clinical_note: "Case B cert" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cert_b_id: $.data.id }
            - call: "POST /hhi/certifications/${cert_b_id}/review"
              payload: { decision: "ACCEPT", review_note: "Accepted" }
              as: NurseReviewer
              as_user_id: "nr-001"
            - call: "POST /hhi/safety-reviews"
              payload: { case_id: "${case_a_id}", evidence_source: "PARENT_ATTESTATION", review_date: "2026-09-02", hazard_findings: ["AGGRESSIVE_ANIMAL", "NO_SECONDARY_EXIT", "UNLIT_ACCESS"], escort_available: true }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { sr_a_id: $.data.id }
            - call: "POST /hhi/safety-reviews"
              payload: { case_id: "${case_b_id}", evidence_source: "ONSITE_WALKTHROUGH", review_date: "2026-09-02", hazard_findings: ["AGGRESSIVE_ANIMAL", "NO_SECONDARY_EXIT", "UNLIT_ACCESS"], escort_available: true }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { sr_b_id: $.data.id }
          trigger:
            - call: "POST /hhi/safety-reviews/${sr_a_id}/finalize"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /hhi/safety-reviews/${sr_b_id}/finalize"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          assert:
            - "HomeVisitSafetyReview.${sr_a_id}.scoring_variant == SELF_REPORTED"
            - "HomeVisitSafetyReview.${sr_a_id}.risk_score == 34"
            - "HomeVisitSafetyReview.${sr_a_id}.clearance == CLEARED_WITH_ESCORT"
            - "HomeVisitSafetyReview.${sr_b_id}.scoring_variant == ONSITE_VERIFIED"
            - "HomeVisitSafetyReview.${sr_b_id}.risk_score == 35"
            - "HomeVisitSafetyReview.${sr_b_id}.clearance == VIRTUAL_ONLY"
            - "HomeboundCase.${case_a_id}.escort_required == true"
            - "HomeboundCase.${case_a_id}.delivery_mode == IN_HOME"
            - "HomeboundCase.${case_a_id}.weekly_entitled_minutes == 390"
            - "HomeboundCase.${case_b_id}.escort_required == false"
            - "HomeboundCase.${case_b_id}.delivery_mode == VIRTUAL_SYNC"
            - "HomeboundCase.${case_b_id}.entitlement_rule_id == ${rule_virtual_id}"
            - "HomeboundCase.${case_b_id}.weekly_entitled_minutes == 270"

  - rule_id: combinatorial_formula
    instances:
      - name: entitlement_sped_floor_dominates_psychiatric_dx_factor_and_duration_bonus
        grounds:
          - calculations.weekly_entitlement_minutes
          - entities.Student.fields.iep_service_minutes_weekly
          - entities.Student.fields.grade_band
          - entities.HomeboundCase.fields.weekly_entitled_minutes
          - state_machines.PhysicianCertification.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Four independent inputs combine in one formula — grade_band HIGH selects base 420,
