          assert:
            - "Protocol.${proto_id}.status == APPROVED after the full cycle"
            - "Protocol traversed RETURNED and CHANGES_REQUESTED before the first APPROVED (revision loop), then SUSPENDED and back (suspension loop)"
            - "Protocol.${proto_id}.pre_suspension_state == null after reinstatement"
            - "Protocol.${proto_id}.version > ${proto_v0}"

      - name: board_meeting_failed_quorum_reschedule_cycle
        grounds:
          - state_machines.BoardMeeting.SCHEDULED_to_FAILED_QUORUM
          - state_machines.BoardMeeting.FAILED_QUORUM_to_SCHEDULED
          - state_machines.BoardMeeting.SCHEDULED_to_CONVENED
          - state_machines.BoardMeeting.CONVENED_to_ADJOURNED
        distinguishing_aspect: |
          BoardMeeting machine is cyclic on a different entity than Protocol:
          SCHEDULED ->(clock sweep past start+30min grace) FAILED_QUORUM
          ->(reschedule) SCHEDULED ->(convene) CONVENED ->(adjourn)
          ADJOURNED; the loop returns to a previously-visited state, which a
          linear pipeline cannot express.
        test_recipe:
          setup:
            - "3 ACTIVE members: chair(SCIENTIST), nonsci(NON_SCIENTIST), unaff(UNAFFILIATED); quorum threshold floor(3/2)+1 == 2"
            - "Meeting M room R-CYC scheduled 2026-06-01T10:00:00Z (created at the default clock 2026-05-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair M", email: "chairm@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "NS Member", email: "nsm@univ.edu", member_category: "NON_SCIENTIST" }
              as: IrbAdmin
              captures: { nonsci: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "UN Member", email: "unm@univ.edu", member_category: "UNAFFILIATED" }
              as: IrbAdmin
              captures: { unaff: $.data.id }
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-CYC", scheduled_at: "2026-06-01T10:00:00Z", duration_minutes: 60 }
              as: IrbCoordinator
              captures: { mtg: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:31:00Z" }
              as: IrbAdmin
            - call: "POST /irb/board-meetings/${mtg}/reschedule"
              payload: { scheduled_at: "2026-06-08T10:00:00Z" }
              as: IrbCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T10:00:00Z" }
              as: IrbAdmin
            - call: "POST /irb/board-meetings/${mtg}/convene"
              payload: { attendee_member_ids: ["${chair_id}", "${nonsci}", "${unaff}"] }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/board-meetings/${mtg}/adjourn"
              payload: {}
              as: IrbChair
              as_user_id: "${chair_id}"
          assert:
            - "BoardMeeting.${mtg}.status == FAILED_QUORUM after the 10:31 sweep"
            - "BoardMeeting.${mtg}.status == SCHEDULED after reschedule (cycle closed)"
            - "BoardMeeting.${mtg}.status == CONVENED after convene"
            - "BoardMeeting.${mtg}.status == ADJOURNED after adjourn"
            - "BoardMeeting.${mtg}.quorum_threshold == 2"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (finding trigger depth 3 vs clock-sweep
  # trigger depth 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: finding_confirmed_cascade_to_meeting_cancellation
        grounds:
          - state_machines.NonComplianceCase.INVESTIGATION_to_FINDING_CONFIRMED
          - state_machines.Protocol.APPROVED_to_SUSPENDED
          - state_machines.RelianceAgreement.EXECUTED_to_SUSPENDED
          - state_machines.AgendaItem.LISTED_to_REMOVED
          - state_machines.BoardMeeting.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from the issue-finding trigger: finding CONFIRMED
          ->(1) Protocol APPROVED->SUSPENDED ->(2a) EXECUTED reliance ->
          SUSPENDED and ->(2b) LISTED agenda item -> REMOVED ->(3) the meeting
          whose item_count falls to 0 via that removal -> CANCELLED; link 3 is
          caused by link 2's removal, not by the finding directly.
        test_recipe:
          setup:
            - "Protocol P APPROVED via expedited track (chair, reviewers rev1/rev2)"
            - "Reliance agreement R for P/INST_A EXECUTED"
            - "MAJOR modification Mod on P in SUBMITTED"
            - "Meeting M (room R-CASC, 2026-06-01T10:00:00Z) whose ONLY agenda item is Mod's item on P"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Cascade", email: "cascade@univ.edu", department: "Medicine", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
