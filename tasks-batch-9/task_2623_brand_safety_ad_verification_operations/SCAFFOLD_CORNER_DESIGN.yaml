              captures: { entry_block: $.data.id }
            - call: "POST /inventory-lists/${incl_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /inventory-lists/${excl_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /pre-bid-segments"
              payload: { campaign_id: "${camp_id}", suitability_floor_tier: "MEDIUM_RISK", inclusion_list_id: "${incl_id}", exclusion_list_id: "${excl_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
