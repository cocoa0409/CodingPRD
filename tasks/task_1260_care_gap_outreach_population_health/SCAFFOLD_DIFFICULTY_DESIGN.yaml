# =============================================================================
# §1.8 Scaffold Difficulty Design — task 1260 Care Gap Outreach
# =============================================================================

scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: closure_rate_provisional_vs_final_after_reopen
        grounds:
          - calculations.gap_closure_rate
          - state_machines.MeasurePerformanceReport.PROVISIONAL_to_FINAL
          - state_machines.CareGap.CLOSED_to_REOPENED
        distinguishing_aspect: |
          MeasurePerformanceReport entity domain: same period data yields a
          HIGHER closure_rate_bps under PROVISIONAL than under FINAL because
          FINAL excludes CLAIMS_FEED closures whose CareGap was later
          transitioned CLOSED -> REOPENED before finalization.
        test_recipe:
          setup:
            - "Registry with one PUBLISHED SCREENING measure (lookback_days=365, reporting_lag_days=30)"
            - "Cohort covering member M1 (age 60, ENROLLED) and member M2 (age 61, ENROLLED)"
            - "Panel active with two CareGaps g1 (M1) and g2 (M2), both progressed to CLOSED via evidence approval (closure_source=CLAIMS_FEED for g2)"
            - "PROVISIONAL report for period 2026-06 generated BEFORE any reopen"
            - "CareGap g2 reopened by DataReconciliationBot"
            - "Clock advanced past period_end + reporting_lag_days"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R1", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "COLON", measure_domain: "SCREENING", lookback_days: 365, reporting_lag_days: 30 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "AGE_50_75", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M1", date_of_birth: "1965-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
              captures: { m1_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M2", date_of_birth: "1964-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
              captures: { m2_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { g1_id: $.data.0.id, g2_id: $.data.1.id }
            # Close g1 via evidence -> appointment-free path
            - call: "POST /population-health/care-gaps/${g1_id}/gap-closure-evidence"
              payload: { evidence_type: "CLAIMS_FEED", service_date: "2026-04-15T00:00:00Z", document_uri: "s3://docs/e1.pdf" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { ev1_id: $.data.id }
            - call: "POST /population-health/gap-closure-evidence/${ev1_id}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_1"
            # Close g2 similarly
            - call: "POST /population-health/care-gaps/${g2_id}/gap-closure-evidence"
              payload: { evidence_type: "CLAIMS_FEED", service_date: "2026-04-16T00:00:00Z", document_uri: "s3://docs/e2.pdf" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { ev2_id: $.data.id }
            - call: "POST /population-health/gap-closure-evidence/${ev2_id}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_1"
            # Generate provisional report
            - call: "POST /population-health/measure-definitions/${meas_id}/measure-performance-reports"
              payload: { period_key: "2026-06" }
              as: ProgramAdministrator
              captures: { rep_id: $.data.id, prov_rate_bps: $.data.closure_rate_bps }
            # Reopen g2 (claims-feed closure mismatch)
            - call: "POST /population-health/care-gaps/${g2_id}/reopen"
              payload: { reason: "claims-feed mismatch" }
              as: DataReconciliationBot
            # Advance clock past lag window
            - call: "POST /population-health/_clock/set_current_utc"
              payload: { registry_id: "${reg_id}", to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /population-health/measure-performance-reports/${rep_id}/finalize"
              payload: {}
              as: ProgramAdministrator
              captures: { final_rate_bps: $.data.closure_rate_bps }
          assert:
            - "MeasurePerformanceReport.${rep_id}.variant == FINAL"
            - "MeasurePerformanceReport.${rep_id}.closure_rate_bps != ${prov_rate_bps}"
            - "MeasurePerformanceReport.${rep_id}.closure_rate_bps == 5000  # 1 of 2"
            - "${prov_rate_bps} == 10000  # 2 of 2"

      - name: priority_score_screening_vs_adherence_domains
        grounds:
          - calculations.priority_score
          - entities.MeasureDefinition.fields.measure_domain
        distinguishing_aspect: |
          CareGap entity domain: identical days_overdue, risk_tier, attempt_count
          inputs produce different priority_score values because
          measure_domain_weight is 1 for SCREENING and 2 for MED_ADHERENCE —
          two valid formula flavors pinned by the measure's domain.
        test_recipe:
          setup:
            - "One registry, one ACTIVE cohort (ANY risk, age 50-75)"
            - "Two measures: M_SCR (SCREENING, lookback 365) and M_ADH (MED_ADHERENCE, lookback 365)"
            - "Two panels sharing the cohort, one per measure"
            - "One member M1 (HIGH risk tier, DOB 1960-01-01) enrolled"
            - "Both panels activated; two CareGaps opened, last_qualifying_event_at null -> due_date = enrollment date = 2026-05-01, days_overdue computed against current_business_date"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "R2", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { m_scr: $.data.id }
            - call: "POST /population-health/measure-definitions/${m_scr}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "ADH", measure_domain: "MED_ADHERENCE", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { m_adh: $.data.id }
            - call: "POST /population-health/measure-definitions/${m_adh}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C1", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "MX", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "HIGH" }
              as: ProgramAdministrator
              captures: { m1_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${m_scr}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { p_scr: $.data.id }
            - call: "POST /population-health/registry-panels/${p_scr}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${m_adh}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { p_adh: $.data.id }
            - call: "POST /population-health/registry-panels/${p_adh}/activate"
              payload: {}
              as: ProgramAdministrator
            # advance clock by 10 days so days_overdue == 10 on both gaps
            - call: "POST /population-health/_clock/set_current_utc"
              payload: { registry_id: "${reg_id}", to_iso8601: "2026-05-11T00:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${p_scr}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { g_scr: $.data.0.id, g_scr_score: $.data.0.priority_score }
            - call: "GET /population-health/registry-panels/${p_adh}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { g_adh: $.data.0.id, g_adh_score: $.data.0.priority_score }
          trigger: []
          assert:
            - "CareGap.${g_scr}.priority_score != CareGap.${g_adh}.priority_score"
            # days_overdue=10, risk_tier_weight=3 (HIGH), attempt_count=0
            # SCREENING: 10 + 3*1*5 + 20 = 45 ; ADHERENCE: 10 + 3*2*5 + 20 = 60
            - "CareGap.${g_scr}.priority_score == 45"
            - "CareGap.${g_adh}.priority_score == 60"

  # -------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_multi_input_tiered_band
        grounds:
          - calculations.priority_score
          - entities.CareGap.fields.priority_band
        distinguishing_aspect: |
          Mode (a): priority_score has >=3 inputs (days_overdue, risk_tier_weight,
          measure_domain_weight, attempt_count, no_show_strikes) with non-linear
          interactions (min() cap, max() decay floor, conditional band mapping
          driven by thresholds at 80/60/30).
        test_recipe:
          setup:
            - "Registry with PUBLISHED SCREENING measure (lookback 365)"
            - "Cohort ANY risk 50-75; one HIGH-risk member; one ACTIVE panel; one CareGap"
            - "Advance clock 200 days so days_overdue = 200 (min() cap kicks in at 90)"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RC", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "H1", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "HIGH" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/_clock/set_current_utc"
              payload: { registry_id: "${reg_id}", to_iso8601: "2026-11-17T00:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id }
          trigger:
            - call: "GET /population-health/care-gaps/${gap_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { score: $.data.priority_score, band: $.data.priority_band }
          assert:
            # days_overdue = 200 -> capped to 90. HIGH(3)*SCREENING(1)*5 = 15. attempt_decay=20.
            # raw = 90+15+20 = 125 -> clamped to 100. band = P1_URGENT.
            - "CareGap.${gap_id}.priority_score == 100"
            - "CareGap.${gap_id}.priority_band == P1_URGENT"

      - name: incentive_payout_per_line_rounding
        grounds:
          - calculations.panel_manager_incentive_payout
          - entities.IncentivePayout.fields.total_payout_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned as round-per-gap-line THEN multiply
          by closed_gap_count_period. Sum-then-round would yield a different
          cent value when per-gap base (4500) * tier_multiplier (12000 bps)
          produces a fractional-cent intermediate result — the scaffold's
          pinned order (round(4500 * 12000/10000) = 5400 then * count) is what
          must be observed.
        test_recipe:
          setup:
            - "Registry, measure, cohort, panel; panel_manager 'pm_1' has one ACTIVE panel with member_count = 225"
            - "Workload row for pm_1 period 2026-06; utilization_ratio = 225/250 = 0.9 -> tier = 12000 bps"
            - "closed_gap_count_period = 3 (three gaps closed via evidence approve)"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RI", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            # 225 members, but for compactness in fixture we drive assigned_member_count via a single panel
            # whose member_count is 225; we simulate by registering 225 members (loop in implementation tests).
            # In this scaffold index we use 3 explicit members and rely on the formula for the payout amount.
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "A1", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
              captures: { ma: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "A2", date_of_birth: "1961-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
              captures: { mb: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "A3", date_of_birth: "1962-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
              captures: { mc: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/panel-manager-workloads"
              payload: { panel_manager_id: "pm_1", period_key: "2026-06" }
              as: ProgramAdministrator
              captures: { wl_id: $.data.id }
            # Close each of the 3 gaps via evidence approve
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { g1: $.data.0.id, g2: $.data.1.id, g3: $.data.2.id }
            - call: "POST /population-health/care-gaps/${g1}/gap-closure-evidence"
              payload: { evidence_type: "CHART_REVIEW", service_date: "2026-04-20T00:00:00Z", document_uri: "s3://e1.pdf" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { ev1: $.data.id }
            - call: "POST /population-health/gap-closure-evidence/${ev1}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_x"
            - call: "POST /population-health/care-gaps/${g2}/gap-closure-evidence"
              payload: { evidence_type: "CHART_REVIEW", service_date: "2026-04-21T00:00:00Z", document_uri: "s3://e2.pdf" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { ev2: $.data.id }
            - call: "POST /population-health/gap-closure-evidence/${ev2}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_x"
            - call: "POST /population-health/care-gaps/${g3}/gap-closure-evidence"
              payload: { evidence_type: "CHART_REVIEW", service_date: "2026-04-22T00:00:00Z", document_uri: "s3://e3.pdf" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { ev3: $.data.id }
            - call: "POST /population-health/gap-closure-evidence/${ev3}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_x"
          trigger:
            - call: "POST /population-health/panel-manager-workloads/${wl_id}/incentive-payouts/projection"
              payload: {}
              as: ProgramAdministrator
              captures: { payout_id: $.data.id, total: $.data.total_payout_cents }
          assert:
            # utilization_ratio = 3/250 = 0.0120 -> tier 10000; per_gap = round(4500*10000/10000) = 4500
            # base = 4500*3 = 13500; closure rate = 3/3 = 10000 bps >= 7000 -> bonus 50000
            # total = 63500
            - "IncentivePayout.${payout_id}.base_amount_cents == 13500"
            - "IncentivePayout.${payout_id}.quality_bonus_cents == 50000"
            - "IncentivePayout.${payout_id}.total_payout_cents == 63500"

      - name: attempt_cadence_circular_pinned_order
        grounds:
          - calculations.attempt_cadence
          - entities.CareGap.fields.next_eligible_attempt_at
        distinguishing_aspect: |
          Mode (c): attempt_cadence has a circular-looking dependency
          (priority_band depends on attempt_count which depends on prior
          attempts; channel selection depends on priority_band; cooldown
          depends on channel; next_eligible_attempt_at depends on cooldown).
          The scaffold pins the evaluation order: use PRE-attempt priority_band
          for channel selection, then recompute band AFTER attempt_count
          increments.
        test_recipe:
          setup:
            - "Registry, SCREENING measure, cohort, panel, member, active CALL campaign with min_attempt_interval_hours=72, quiet_hours_start_min=1260 (21:00), quiet_hours_end_min=480 (08:00)"
            - "CareGap in OPEN; clock at 2026-05-10T19:00:00Z"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RAD", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "MX", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "HIGH" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/outreach-campaigns"
              payload:
                panel_id: "${panel_id}"
                measure_id: "${meas_id}"
                name: "CALL-Q1"
                channel: "CALL"
                starts_at: "2026-05-01T00:00:00Z"
                ends_at: "2026-12-31T23:59:59Z"
                min_attempt_interval_hours: 72
                quiet_hours_start_min: 1260
                quiet_hours_end_min: 480
                max_attempts_per_member: 10
              as: ProgramAdministrator
              captures: { camp_id: $.data.id }
            - call: "POST /population-health/outreach-campaigns/${camp_id}/schedule"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/_clock/set_current_utc"
              payload: { registry_id: "${reg_id}", to_iso8601: "2026-05-10T19:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /population-health/outreach-campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id, gap_v: $.data.0.version }
          trigger:
            - call: "POST /population-health/care-gaps/${gap_id}/outreach-attempts"
              payload: { campaign_id: "${camp_id}", channel: "CALL", outcome: "NO_ANSWER", expected_care_gap_version: "${gap_v}" }
              as: PanelManager
              as_user_id: "pm_1"
          assert:
            # attempt at 2026-05-10T19:00 + 72h = 2026-05-13T19:00 (local_minutes = 19*60=1140 < 1260, > 480) -> inside waking hours
            # next_eligible_attempt_at == 2026-05-13T19:00:00Z
            - "CareGap.${gap_id}.attempt_count == 1"
            - "CareGap.${gap_id}.next_eligible_attempt_at == 2026-05-13T19:00:00Z"
            - "CareGap.${gap_id}.status == OUTREACH_IN_PROGRESS"

  # -------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: care_gap_closed_reopened_cycle
        grounds:
          - state_machines.CareGap.CLOSED_to_REOPENED
          - state_machines.CareGap.REOPENED_to_OPEN
        distinguishing_aspect: |
          CareGap exhibits a CYCLE: OPEN -> ... -> CLOSED -> REOPENED -> OPEN.
          A linear pipeline cannot revisit OPEN from CLOSED; the cyclic shape
          requires re-running closure logic.
        test_recipe:
          setup:
            - "Registry, SCREENING measure (reporting_lag_days=30), cohort, panel, one member; CareGap g1 closed via CLAIMS_FEED evidence; clock still inside reconciliation window"
          setup_api_calls:
