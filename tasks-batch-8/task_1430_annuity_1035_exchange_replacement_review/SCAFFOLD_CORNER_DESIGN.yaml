          assert:
            - "HTTP 409 with error_id == ERR_DUPLICATE_CONTRACT_NUMBER"

      - name: anti_churn_12m_boundary
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_CONTRACT_EXCHANGED_WITHIN_12M]"
        distinguishing_aspect: "Inclusive boundary at 365 days: a contract whose last exchange completed exactly 365 days before submission is exchangeable again; one day less is blocked."
        test_recipe:
          setup: ["Producer, client; contract CN-A with last_exchange_completed_at 2025-08-02T00:00:00Z (364 days before the default clock) and contract CN-B with 2025-08-01T00:00:00Z (exactly 365 days)"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false, last_exchange_completed_at: "2025-08-02T00:00:00Z" }, as: Producer, as_user_id: "${p_id}", captures: { k_a: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-B", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false, last_exchange_completed_at: "2025-08-01T00:00:00Z" }, as: Producer, as_user_id: "${p_id}", captures: { k_b: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_a}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_a: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_b}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_b: $.data.id } }
          trigger:
            - { call: "POST /cases/${case_a}/submit", payload: {}, as: Producer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
            - { call: "POST /cases/${case_b}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
          assert:
            - "Case A (364 days): HTTP 409 with error_id == ERR_CONTRACT_EXCHANGED_WITHIN_12M"
            - "Case B (exactly 365 days): HTTP 200, status == SUBMITTED (gap >= 365 days is INCLUSIVE at 365)"

      - name: partial_below_minimum_boundary
        claim_type: violation_to_error
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_PARTIAL_BELOW_MINIMUM]"
        distinguishing_aspect: "MIN_PARTIAL_CENTS is inclusive: 99,999 cents fails with ERR_PARTIAL_BELOW_MINIMUM while exactly 100,000 passes the floor."
        test_recipe:
          setup: ["Producer, client; contracts CN-A/CN-B; PARTIAL case A amount 99,999; PARTIAL case B amount 100,000"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_a: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-B", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_b: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_a}", exchange_type: "PARTIAL", exchange_amount_cents: 99999, new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_a: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_b}", exchange_type: "PARTIAL", exchange_amount_cents: 100000, new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_b: $.data.id } }
          trigger:
            - { call: "POST /cases/${case_a}/submit", payload: {}, as: Producer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
            - { call: "POST /cases/${case_b}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
          assert:
            - "Case A (99,999): HTTP 409 with error_id == ERR_PARTIAL_BELOW_MINIMUM"
            - "Case B (100,000): HTTP 200, status == SUBMITTED"

      - name: document_locked_after_verify
        claim_type: violation_to_error
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_DOCUMENT_LOCKED]"
        distinguishing_aspect: "A doc_type with a VERIFIED document is locked: resubmission is refused instead of silently forking a second row."
        test_recipe:
          setup: ["Case in SUITABILITY_REVIEW; REPLACEMENT_DISCLOSURE VERIFIED"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id } }
            - { call: "POST /documents/${d_1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_DOCUMENT_LOCKED"
            - "The VERIFIED document is unchanged (revision still 1)"

      - name: producer_cannot_touch_other_producers_case
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_CASE_NOT_OWNED_BY_PRODUCER]"
        distinguishing_aspect: "Ownership is identity-based: a second registered Producer calling submit on the first producer's case gets 403 ERR_CASE_NOT_OWNED_BY_PRODUCER, distinct from the role check."
        test_recipe:
          setup: ["Producers P1 and P2; client; contract; DRAFT case owned by P1"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p1_id: $.data.id } }
            - { call: "POST /producers", payload: { license_number: "LIC-002", full_name: "Pete Other", home_state_code: "CA" }, as: CarrierAdmin, captures: { p2_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p1_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p1_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p1_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p1_id}", captures: { case_id: $.data.id } }
          trigger:
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p2_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 with error_id == ERR_CASE_NOT_OWNED_BY_PRODUCER"
            - "Case remains DRAFT"

      - name: cooling_off_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
        excluded_because:
          difficulty_instance: client_rescission_cooling_off_gap
          rationale: "Day-29 rejection and day-30 acceptance asserted in the named §1.8 instance."

      - name: occupation_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
        excluded_because:
          difficulty_instance: contract_occupation_overlap
          rationale: "Collision while occupied and success after terminal release asserted in the named §1.8 instance."

      - name: contract_not_in_force_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
        excluded_because:
          difficulty_instance: submit_requires_contract_in_force
          rationale: "EXCHANGED contract blocks submit with ERR_CONTRACT_NOT_IN_FORCE in the named §1.8 instance."

      - name: free_look_expired_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
        excluded_because:
          difficulty_instance: free_look_deadline_inclusive_boundary
          rationale: "Deadline-day success and deadline+1 ERR_FREE_LOOK_EXPIRED asserted in the named §1.8 instance."

      - name: suspended_producer_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
        excluded_because:
          difficulty_instance: producer_suspension_beats_partial_amount_bounds
          rationale: "ERR_PRODUCER_SUSPENDED asserted (and prioritized over the fiscal error) in the named §1.8 instance."

      - name: priority_state_beats_safety_corner
        claim_type: priority_ordering
        grounds:
          - "validations[priority=6]"
          - "validations[priority=10]"
        excluded_because:
          difficulty_instance: state_precondition_beats_document_safety
          rationale: "Dual-failure priority asserted in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: rescind_by_carrier_admin_shared_operation
        claim_type: conditional_action
        grounds:
          - "endpoints[POST /cases/{id}/rescind]"
          - "roles[CarrierAdmin]"
        distinguishing_aspect: "Rescind is shared: CarrierAdmin may rescind a case it does not own (ownership check applies to Producer callers only)."
        test_recipe:
          setup: ["Junior client; FULL case IN_FREE_LOOK at default clock"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Jim Junior", date_of_birth: "1990-06-15", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
