      - name: error_trading_plan_conflict_on_second_pending_adoption
        claim_type: violation_to_error
        grounds:
          - validations[priority=88]
          - errors[ERR_TRADING_PLAN_CONFLICT]
          - state_machines.TradingPlan.PENDING_COOLING_OFF
          - endpoints[POST /trading-plans]
        distinguishing_aspect: |
          A participant may hold at most one plan still inside its cooling-off period: the
          second adoption is refused with ERR_TRADING_PLAN_CONFLICT (409) and not with
          ERR_STALE_PARTICIPANT_VERSION, because the retry sends the freshly re-read version 2,
          so priority 45 passes and priority 88 is what fires.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan; DESIGNATED_INSIDER participant (cooling-off 30 days)."
            - "One TradingPlan adopted at version 1, leaving the participant at version 2 with the plan in PENDING_COOLING_OFF (first_trade_allowed_at 2026-02-04T09:00:00.000Z)."
