              captures: { ao3_id: $.data.id }
            - call: "POST /ancillary-orders/${ao1_id}/resolve"
              payload: { outcome: "RESULTED" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /ancillary-orders/${ao2_id}/resolve"
              payload: { outcome: "RESULTED" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /ancillary-orders/${ao3_id}/resolve"
              payload: { outcome: "RESULTED" }
              as: EmergencyPhysician
