- rule_id: priority_pair_validation_conflict
  instances:
  - name: duplicate_window_vs_capacity_conflict
    grounds:
    - validations[priority=7]
    - validations[priority=9]
    - errors.ERR_SHARE_CAPACITY_EXCEEDED
    - errors.ERR_DUPLICATE_LEAD
    distinguishing_aspect: 'business_constraint (priority 7, share capacity) vs business_temporal

      (priority 9, duplicate window): a lead intake in a fully allocated market

      for a consumer seen 10 days ago violates both; the capacity error must win

      because it is evaluated before the temporal duplicate check.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market IL/60601 base 10000; agent FULL with a 10000-bps ACTIVE order (allocated == 10000); an earlier lead
        for consumer c-race@x.com exists (created day 0, ASSIGNED to FULL).
