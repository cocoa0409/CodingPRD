  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mariners", payload: { full_name: "No Auth", mariner_reference_number: "MRN-VA1-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400, no user-context headers sent)"
      - name: existence_beats_state_on_missing_assignment
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=9]", "errors[ERR_ASSIGNMENT_NOT_FOUND]"]
        distinguishing_aspect: "A confirm against a non-existent assignment id returns 404 ERR_ASSIGNMENT_NOT_FOUND (priority 4 existence) rather than any state error — path existence is validated before machine preconditions."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /assignments/11111111-2222-3333-4444-555555555555/confirm", payload: {}, as: CrewingManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ASSIGNMENT_NOT_FOUND"
      - name: role_denied_before_resource_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "A Mariner-role call to POST /vessels with a path that would 404 anyway returns 403 ERR_UNAUTHORIZED_ROLE — role permission (priority 2) is checked before resource existence (priority 4)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vessels", payload: { vessel_name: "SS Nope", imo_number: "IMO-VA3", vessel_class: "BULK", flag_state: "US" }, as: Mariner, as_user_id: "11111111-2222-3333-4444-555555555555", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE (403 precedes any existence check)"

  - section: errors
    instances:
      - name: error_mariner_assignment_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_MARINER_ASSIGNMENT_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / mariner_strict_half_open_zero_tolerance"
          rationale: "Asserted as the failure branch of the named §1.8 instance (1-day overlap rejected; touching accepted)."
      - name: error_handover_window_exceeded_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_HANDOVER_WINDOW_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / handover_overlap_exactly_max_days_allowed"
          rationale: "Asserted at overlap 4 (reject) vs 3 (accept) in the named §1.8 instance."
      - name: error_course_full_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_COURSE_FULL]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / course_full_at_zero_open_seats"
          rationale: "Asserted at seats_open == 0 in the named §1.8 instance."
      - name: error_mariner_not_clear_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_MARINER_NOT_CLEAR]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / confirm_gated_by_mariner_posture"
          rationale: "Asserted as the posture-gate failure in the named §1.8 instance."
      - name: error_restricted_window_exceeded_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESTRICTED_WINDOW_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / readiness_posture_evaluation_order_snapshot"
          rationale: "Asserted for planned_relief_date beyond the earliest restricting expiry in the named §1.8 instance."
      - name: error_upgrade_requirements_not_met_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_UPGRADE_REQUIREMENTS_NOT_MET]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / upgrade_eligibility_exactly_360_days_qualifies"
          rationale: "Asserted for the 359-day mariner in the named §1.8 instance."
      - name: error_relief_not_onboard_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_RELIEF_NOT_ONBOARD]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / relieve_gated_by_incoming_onboard"
          rationale: "Asserted while the incoming relief is merely CONFIRMED in the named §1.8 instance."
      - name: error_union_dispatch_gates_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUES_NOT_CURRENT]", "errors[ERR_UNION_REGISTRATION_INVALID]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / union_dispatch_gated_by_registration_and_dues"
          rationale: "Both union-gate errors asserted in sequence in the named §1.8 instance."
      - name: error_sod_reimburse_same_approver_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SOD_REIMBURSE_SAME_APPROVER]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / reimburse_sod_error_beats_state_error"
          rationale: "Asserted as the winning error of the SoD-vs-state priority pair in the named §1.8 instance."
      - name: budget_exceeded_pure_fiscal_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRAINING_BUDGET_EXCEEDED]", calculations.training_reimbursement]
        distinguishing_aspect: "With safety gates satisfied (posture CLEAR) the fiscal gate fires alone: cap 1000 < provisional 160000 -> 402 ERR_TRAINING_BUDGET_EXCEEDED, and NO TrainingBudget row is persisted after the failed enroll."
        test_recipe:
          setup: ["M activated with annual_training_cap_cents 1000 (posture CLEAR); course cost 250000; enrollment APPROVED"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Fiscal One", mariner_reference_number: "MRN-CC6-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB", annual_training_cap_cents: 1000 }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
