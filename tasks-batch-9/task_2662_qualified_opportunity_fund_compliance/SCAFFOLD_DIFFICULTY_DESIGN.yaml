            - "Fund.${fund_id}.aggregate_qualified_basis == 400000.00"
            - "Fund.${fund_id}.compliance_posture == UNTESTED (no MEASURED AssetTest existed for the disqualification cascade to re-measure)"

  - rule_id: transitive_cascade
    instances:
      - name: second_consecutive_failed_test_decertification_chain
        grounds:
          - state_machines.AssetTest.MEASURED_to_CERTIFIED_FAIL
          - state_machines.Fund.DEFICIENT_to_FAILED_FINAL
          - state_machines.Fund.SELF_CERTIFIED_to_DECERTIFIED
          - state_machines.DeferralElection.DEFERRED_to_INCLUDED_FULL
          - calculations.failed_test_penalty
          - calculations.inclusion_event_amount
        distinguishing_aspect: |
          Depth-5 cascade with the trigger POST /qof/asset-tests/{id}/certify
          on a SECOND consecutive failing test: certify -> Fund posture
          FAILED_FINAL -> Fund certification DECERTIFIED -> a
          FUND_DECERTIFICATION InclusionEvent is minted for every DEFERRED
          election -> the election closes INCLUDED_FULL -> the Investor's
          deferred_gain_outstanding drains. Nothing in the chain is triggered
          by the first failure, so an implementation that reacts to a single
          failed test produces the wrong depth.
        test_recipe:
          setup:
            - "One ATTESTED Investor and one SELF_CERTIFIED Fund whose version is captured at self-certification."
            - "One EligibleGain of 400000.00 realized 2026-03-15 on SALE_DATE basis, fully elected into the fund on the clock date 2026-08-01 (139 days from basis)."
            - "Assets 800000.00 QUALIFIED plus 200000.00 CASH, so every asset test measures 80.0000 with shortfall 100000.00."
            - "A first AssetTest over [2026-01-01, 2026-07-01) already measured and certified FAIL: PenaltyAssessment #1 exists, Fund.compliance_posture is DEFICIENT and consecutive_failed_tests is 1."
            - "A second AssetTest over [2026-07-01, 2027-01-01) measured FAIL and left in MEASURED."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Cascade Investor", taxpayer_type: "INDIVIDUAL", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Decert Cascade Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 400000.00, realization_date: "2026-03-15T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 400000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elect_id: $.data.id, days_at_election: $.data.days_from_basis }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 800000.00, afs_fair_value: 800000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 200000.00, afs_fair_value: 200000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { t1_id: $.data.id }
            - call: "POST /qof/asset-tests/${t1_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/asset-tests/${t1_id}/certify"
              payload: {}
