- section: cross_cutting_layers
  instances:
  - name: occ_stale_version_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[amendment-create-stale-agreement]
    - errors[ERR_STALE_AGREEMENT_VERSION]
    distinguishing_aspect: After amendment M1 advances the agreement to version 4, a second create still carrying the pre-M1
      observation (version 3) is rejected 412 ERR_STALE_AGREEMENT_VERSION — two strictly sequential requests, no wall-clock
      dependence.
    test_recipe:
      setup:
      - ACTIVE agreement A at version 3 (create 1 -> submit 2 -> countersign 3); amendment M1 created against version 3 (agreement
        now at 4)
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      - call: POST /agreements/${agr_id}/submit
        as: RailroadContractsManager
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
        captures:
          agr_v3: $.data.version
      - call: POST /agreements/${agr_id}/amendments
        payload:
          amendment_type: LIABILITY_CAP
          expected_agreement_version: ${agr_v3}
          new_liability_cap_cents: 250000
        as: RailroadContractsManager
        captures:
          amd1: $.data.id
      trigger:
      - call: POST /agreements/${agr_id}/amendments
        payload:
          amendment_type: STORAGE_RATE
          expected_agreement_version: ${agr_v3}
          new_storage_rate_per_car_month_cents: 12000
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_STALE_AGREEMENT_VERSION and HTTP status == 412 (stale expected_agreement_version 3 vs current 4)
      - Amendment.${amd1}.status remains PENDING (the rejected write did not supersede it)
  - name: occ_current_version_supersedes_pending
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[amendment-create-stale-agreement]
    - state_machines.Amendment.PENDING_to_SUPERSEDED
    distinguishing_aspect: A create carrying the CURRENT version succeeds, supersedes the prior PENDING amendment, and bumps
      the agreement version again (4 -> 5) — the legitimate CREATE-with-supersede path.
    test_recipe:
      setup:
      - ACTIVE agreement A; amendment M1 PENDING created at agreement version 3 (agreement now at 4)
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      - call: POST /agreements/${agr_id}/submit
        as: RailroadContractsManager
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
        captures:
          agr_v3: $.data.version
      - call: POST /agreements/${agr_id}/amendments
        payload:
          amendment_type: LIABILITY_CAP
          expected_agreement_version: ${agr_v3}
          new_liability_cap_cents: 250000
        as: RailroadContractsManager
        captures:
          amd1: $.data.id
      - call: GET /agreements/${agr_id}
        as: RailroadContractsManager
        captures:
          agr_v4: $.data.version
      trigger:
      - call: POST /agreements/${agr_id}/amendments
        payload:
          amendment_type: STORAGE_RATE
          expected_agreement_version: ${agr_v4}
          new_storage_rate_per_car_month_cents: 12000
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
        captures:
          amd2: $.data.id
          amd2_st: $.data.status
      - call: GET /amendments/${amd1}
        as: RailroadContractsManager
        captures:
          amd1_st: $.data.status
      - call: GET /agreements/${agr_id}
        as: RailroadContractsManager
        captures:
          agr_v5: $.data.version
      assert:
      - amd2_st == PENDING (created against the current version 4)
      - amd1_st == SUPERSEDED (superseded by the newer create)
      - agr_v5 == 5 (each amendment create increments the parent version by 1)
