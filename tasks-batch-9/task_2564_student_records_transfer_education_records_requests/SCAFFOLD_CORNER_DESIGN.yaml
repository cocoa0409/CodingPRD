            - "trigger call 7 returns HTTP 409 with data.error_id == \"ERR_APPOINTMENT_NOT_SCHEDULED\""
            - "after trigger call 9 InspectionRequest.${insp_x}.status == \"EXPIRED\""
            - "trigger call 11 returns HTTP 409 with data.error_id == \"ERR_INSPECTION_EXPIRED\""
            - "GET /records-office/students/${student_w}/disclosure-log returns exactly 1 row with disclosure_type == \"PARENT_INSPECTION\" and source_id == ${insp_w}"

