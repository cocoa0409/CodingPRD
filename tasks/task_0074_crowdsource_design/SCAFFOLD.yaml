scenario: |
  Crowdsourced design competition platform: client project publishing with project-brief
  submission, design-category classification, requirement description and reference materials,
  prize-pool and timeline configuration, submission-review by platform, and project on-shelf
  workflow; designer submission with designer profile and qualification, submission-format and
  quantity rules, original-work declaration, anti-plagiarism preliminary screening,
  submission-modification window, and submission-volume limit per project; review rules and
  reviewer assignment with review-stage configuration (preliminary/semi-final/final), reviewer
  pool management, reviewer-qualification matching, conflict-of-interest avoidance,
  scoring-rubric configuration, and client-participation rules in final stage; multi-round
  screening with stage-passing threshold, anonymous-review for fairness, scoring aggregation,
  dispute-handling within review, advancing-list publication, and round-time-limit enforcement;
  copyright transfer with winning-work copyright-transfer agreement, multi-party signing
  workflow, transfer-scope (full/limited) configuration, copyright-registration coordination,
  and post-transfer usage rights; prize distribution with prize-tier configuration, winner
  announcement, prize-payment to designer, tax withholding, runner-up consolation prize
  handling, and prize-payment record archiving; dispute mediation with dispute-type
  classification (plagiarism/scoring-fairness/copyright/payment), evidence submission,
  multi-stage mediation, third-party arbitration option, and dispute-resolution record;
  event-driven synchronization with payment, electronic-signature, and copyright-authority
  systems; audit logging for review actions and copyright transfers.

domain_name: crowdsource-design
api_prefix: /projects

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - version_pinning_on_approval
    - dual_variant_calculation

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: saga

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: Client organization name
        constraints: 1..200 chars
      - name: contact_email
        type: string
        source: input
        description: Primary contact email
        constraints: RFC-5322 email
      - name: status
        type: enum
        source: system
        description: Client account status
        default: ACTIVE
        constraints: "values: ACTIVE, SUSPENDED"
      - name: tax_jurisdiction
        type: enum
        source: input
        description: Tax jurisdiction for withholding rules
        constraints: "values: RESIDENT, NON_RESIDENT"

  - name: Designer
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Designer public display name
        constraints: 1..80 chars, unique
      - name: qualification_level
        type: enum
        source: input
        description: Designer skill tier per portfolio review
        default: NOVICE
        constraints: "values: NOVICE, JUNIOR, SENIOR, EXPERT"
      - name: categories
        type: array
        source: input
        description: List of category codes the designer is qualified for
        constraints: "non-empty subset of DesignCategory codes"
      - name: tax_residency
        type: enum
        source: input
        description: Tax residency status for prize withholding
        constraints: "values: RESIDENT, NON_RESIDENT"
      - name: status
        type: enum
        source: system
        description: Designer account status
        default: ACTIVE
        constraints: "values: ACTIVE, SUSPENDED, BANNED"
      - name: trust_score
        type: number
        source: computed
        description: Anti-plagiarism trust score, 0..100, recomputed on each Submission preliminary screen
        default: 100
        constraints: "0..100, two decimals"

  - name: DesignCategory
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: Stable category code (e.g., LOGO, UI, PACKAGING)
        constraints: uppercase A-Z and underscore, unique
      - name: name
        type: string
        source: input
        description: Human-readable name
      - name: similarity_corpus_id
        type: string
        source: input
        description: Identifier of the public-image corpus used for preliminary plagiarism scan

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK to Client.id
      - name: category_code
        type: string
        source: input
        description: FK to DesignCategory.code
      - name: title
        type: string
        source: input
        description: Project title
        constraints: 1..200 chars
      - name: brief
        type: string
        source: input
        description: Requirement description
        constraints: 1..5000 chars
      - name: reference_material_urls
        type: array
        source: input
        description: List of HTTPS URLs to reference assets
        constraints: 0..20 items, each a valid https URL
      - name: prize_pool_cents
        type: integer
        source: input
        description: Total prize pool in minor currency units; sum of tier amounts must equal this
        constraints: ">= 100000 (i.e., 1000.00)"
      - name: opens_at
        type: datetime
        source: input
        description: Submission window opens at this instant (inclusive)
      - name: submission_deadline
        type: datetime
        source: input
        description: Submission window closes at this instant (exclusive); must be >= opens_at + 72h
      - name: final_decision_deadline
        type: datetime
        source: input
        description: Final stage decision deadline; must be >= submission_deadline + 168h (7 days)
      - name: status
        type: enum
        source: system
        description: Lifecycle status
        default: DRAFT
        constraints: "values: DRAFT, UNDER_PLATFORM_REVIEW, ON_SHELF, IN_PRELIMINARY, IN_SEMIFINAL, IN_FINAL, AWARDED, CLOSED, REJECTED, CANCELLED"
      - name: max_submissions_per_designer
        type: integer
        source: input
        description: Per-designer submission cap on this project
        default: 3
        constraints: 1..10
      - name: client_participates_final
        type: boolean
        source: input
        description: Whether the client casts a vote in the final stage
        default: false
      - name: anonymity_unmasked_at
        type: datetime
        source: system
        description: Set when AWARDED; before this, reviewer queries return masked designer references
        default: null
      - name: published_winner_list
        type: array
        source: computed
        description: Ordered Submission.id list set on AWARDED; immutable thereafter
        default: []

  - name: ReviewStage
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id
      - name: stage_kind
        type: enum
        source: input
        description: Stage kind
        constraints: "values: PRELIMINARY, SEMIFINAL, FINAL"
      - name: passing_threshold
        type: number
        source: input
        description: Minimum aggregate score to advance; on the [0,100] scale, two decimals
        constraints: "0.00..100.00"
      - name: reviewer_quorum
        type: integer
        source: input
        description: Minimum number of reviewer scores required to compute aggregate
        constraints: ">= 3"
      - name: rubric
        type: object
        source: input
        description: Map criterion_code -> weight; weights are non-negative numbers that MUST sum to exactly 100
        constraints: "weights sum == 100; 1..8 criteria"
      - name: starts_at
        type: datetime
        source: input
        description: Stage opens at this instant (inclusive)
      - name: ends_at
        type: datetime
        source: input
        description: Stage closes at this instant (exclusive); round time limit
      - name: status
        type: enum
        source: system
        description: Stage status
        default: PENDING
        constraints: "values: PENDING, OPEN, AGGREGATING, PUBLISHED, EXPIRED"
      - name: advancing_submission_ids
        type: array
        source: computed
        description: List of Submission.id that passed; immutable once PUBLISHED

  - name: Submission
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id
      - name: designer_id
        type: string
        source: input
        description: FK to Designer.id
      - name: title
        type: string
        source: input
        description: Submission title
        constraints: 1..120 chars
      - name: asset_urls
        type: array
        source: input
        description: 1..10 HTTPS asset URLs
        constraints: 1..10 items
      - name: original_work_declared
        type: boolean
        source: input
        description: Declaration of original work; must be true on create
        constraints: must be true
      - name: status
        type: enum
        source: system
        description: Submission lifecycle status
        default: DRAFT
        constraints: "values: DRAFT, SCREENING, SCREEN_REJECTED, ACCEPTED, ADVANCING_SEMIFINAL, ADVANCING_FINAL, WINNER, RUNNER_UP, ELIMINATED, WITHDRAWN"
      - name: modify_window_closes_at
        type: datetime
        source: system
        description: After project moves to IN_PRELIMINARY, modifications are forbidden; equals min(Project.submission_deadline, ReviewStage[PRELIMINARY].starts_at)
      - name: originality_score
        type: number
        source: computed
        description: Latest anti-plagiarism score, 0..100 (higher = more original); recomputed on screen
        constraints: 0..100, two decimals
      - name: originality_variant
        type: enum
        source: system
        description: Which originality variant produced the latest score
        constraints: "values: PRELIMINARY_SCAN, FINAL_CROSSCHECK"
      - name: aggregate_score_by_stage
        type: object
        source: computed
        description: Map stage_kind -> aggregate score (number, two decimals)
      - name: prize_tier_id
        type: string
        source: computed
        description: FK to PrizeTier.id once AWARDED; null otherwise
        default: null

  - name: ReviewerPool
    parent: null
    common_fields: false
    fields:
      - name: reviewer_id
        type: string
        source: input
        description: Stable reviewer identifier (opaque)
        constraints: unique
      - name: name
        type: string
        source: input
        description: Reviewer display name (hidden under anonymity)
      - name: categories
        type: array
        source: input
        description: Category codes the reviewer is qualified for
        constraints: non-empty subset of DesignCategory.code
      - name: max_concurrent_assignments
        type: integer
        source: input
        description: Cap on simultaneous OPEN assignments
        default: 20
        constraints: 1..100
      - name: conflict_designer_ids
        type: array
        source: input
        description: Designer.ids the reviewer is in conflict-of-interest with
        default: []

  - name: ReviewAssignment
    parent: null
    common_fields: true
    fields:
      - name: review_stage_id
        type: string
        source: input
        description: FK to ReviewStage.id
      - name: submission_id
        type: string
        source: input
        description: FK to Submission.id
      - name: reviewer_id
        type: string
        source: input
        description: FK to ReviewerPool.reviewer_id
      - name: anonymized_alias
        type: string
        source: system
        description: Server-minted alias shown to reviewer in place of designer/submission identity
      - name: criterion_scores
        type: object
        source: input
        description: Map criterion_code -> numeric score in [0,100], one entry per rubric criterion
      - name: aggregated_score
        type: number
        source: computed
        description: Weighted sum per rubric; two decimals, derived from criterion_scores
      - name: status
        type: enum
        source: system
        description: Assignment status
        default: PENDING
        constraints: "values: PENDING, SUBMITTED, DISPUTED, VOIDED"
      - name: submitted_at
        type: datetime
        source: system
        description: When reviewer submitted scores

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id (always required for scoping)
      - name: dispute_type
        type: enum
        source: input
        description: Dispute classification
        constraints: "values: PLAGIARISM, SCORING_FAIRNESS, COPYRIGHT, PAYMENT"
      - name: subject_ref_kind
        type: enum
        source: input
        description: What the dispute is about
        constraints: "values: SUBMISSION, REVIEW_ASSIGNMENT, COPYRIGHT_TRANSFER, PRIZE_PAYMENT"
      - name: subject_ref_id
        type: string
        source: input
        description: id of the entity the dispute targets; type matches subject_ref_kind
      - name: filer_kind
        type: enum
        source: input
        description: Who filed
        constraints: "values: CLIENT, DESIGNER, REVIEWER, PLATFORM"
      - name: filer_id
        type: string
        source: input
        description: id of the filer (Client.id / Designer.id / ReviewerPool.reviewer_id / opaque PlatformOps user)
      - name: evidence_urls
        type: array
        source: input
        description: Initial evidence URLs (HTTPS)
        constraints: 0..20 items
      - name: status
        type: enum
        source: system
        description: Dispute lifecycle
        default: FILED
        constraints: "values: FILED, MEDIATING_STAGE1, MEDIATING_STAGE2, ARBITRATION, RESOLVED_UPHELD, RESOLVED_REJECTED, WITHDRAWN"
      - name: resolution_note
        type: string
        source: input
        description: Final resolution rationale (set on resolution)
        default: null
      - name: filed_within_window
        type: boolean
        source: system
        description: Whether the dispute was filed before its window expired
        default: true

  - name: CopyrightTransfer
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id
      - name: submission_id
        type: string
        source: input
        description: FK to Submission.id (must be WINNER or RUNNER_UP)
      - name: scope
        type: enum
        source: input
        description: Transfer scope
        constraints: "values: FULL, LIMITED"
      - name: usage_rights
        type: array
        source: input
        description: Permitted usage tags when scope=LIMITED; must be non-empty for LIMITED, must be empty for FULL
        default: []
      - name: signers
        type: array
        source: system
        description: Ordered list of required signer records, each {party_kind, party_id, signed_at|null}; parties are CLIENT then DESIGNER then PLATFORM_NOTARY
      - name: status
        type: enum
        source: system
        description: Transfer status
        default: DRAFTED
        constraints: "values: DRAFTED, PENDING_SIGNATURES, ALL_SIGNED, REGISTERING, REGISTERED, VOIDED"
      - name: registration_ref
        type: string
        source: system
        description: External copyright-authority registration reference
        default: null
      - name: registered_at
        type: datetime
        source: system
        description: When external authority confirmed registration
        default: null

  - name: PrizeTier
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id
      - name: rank
        type: integer
        source: input
        description: 1=first place, 2=second, etc.; unique within project
        constraints: ">= 1, unique within project_id"
      - name: gross_amount_cents
        type: integer
        source: input
        description: Gross prize for this tier in minor currency units
        constraints: ">= 0"
      - name: tier_kind
        type: enum
        source: input
        description: Distinguishes main prize from runner-up consolation
        constraints: "values: MAIN, CONSOLATION"
      - name: winner_submission_id
        type: string
        source: computed
        description: Submission.id selected for this tier on AWARDED; null otherwise
        default: null

  - name: PrizePayment
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id
      - name: prize_tier_id
        type: string
        source: input
        description: FK to PrizeTier.id
      - name: designer_id
        type: string
        source: input
        description: FK to Designer.id (the winning designer)
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Mirrors PrizeTier.gross_amount_cents at creation; pinned at version-on-approval time
      - name: withholding_cents
        type: integer
        source: computed
        description: "Tax withheld in minor units (see calc prize_withholding)"
      - name: net_amount_cents
        type: integer
        source: computed
        description: gross_amount_cents - withholding_cents
      - name: status
        type: enum
        source: system
        description: Payment lifecycle
        default: SCHEDULED
        constraints: "values: SCHEDULED, PAYING, PAID, FAILED, REVERSED"
      - name: external_payment_ref
        type: string
        source: system
        description: Reference returned by payment system event
        default: null
      - name: idempotency_key
        type: string
        source: input
        description: Client-supplied key to prevent duplicate payment dispatch
        constraints: unique per (project_id, prize_tier_id)

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: occurred_at
        type: datetime
        source: system
        description: When the audited action happened (server time)
      - name: action_kind
        type: enum
        source: system
        description: What kind of audited action this is
        constraints: "values: REVIEW_SUBMITTED, REVIEW_VOIDED, REVIEW_DISPUTED, STAGE_PUBLISHED, COPYRIGHT_DRAFTED, COPYRIGHT_SIGNED, COPYRIGHT_REGISTERED, COPYRIGHT_VOIDED, DISPUTE_FILED, DISPUTE_RESOLVED, PRIZE_PAID"
      - name: actor_kind
        type: enum
        source: system
        description: Who acted
        constraints: "values: CLIENT, DESIGNER, REVIEWER, PLATFORM, SYSTEM"
      - name: actor_id
        type: string
        source: system
        description: id of the actor (entity id or opaque operator)
      - name: subject_kind
        type: enum
        source: system
        description: What entity was acted upon
        constraints: "values: SUBMISSION, REVIEW_ASSIGNMENT, REVIEW_STAGE, COPYRIGHT_TRANSFER, DISPUTE, PRIZE_PAYMENT"
      - name: subject_id
        type: string
        source: system
        description: id of the subject
      - name: payload
        type: object
        source: system
        description: Action-specific structured payload (e.g., previous and new status)

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [CLOSED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: UNDER_PLATFORM_REVIEW
        trigger: "POST /projects/{id}/submit-for-review"
        actor: Client
        preconditions:
          - "Project.prize_pool_cents == sum(PrizeTier.gross_amount_cents) for tiers of this project"
          - "Project has >= 1 MAIN PrizeTier with rank=1"
          - "Project.submission_deadline >= Project.opens_at + 72h"
          - "Project.final_decision_deadline >= Project.submission_deadline + 168h"
          - "ReviewStage rows exist for {PRELIMINARY, SEMIFINAL, FINAL}, each with starts_at < ends_at"
        side_effects: []
      - from: UNDER_PLATFORM_REVIEW
        to: ON_SHELF
        trigger: "POST /projects/{id}/approve"
        actor: PlatformOps
        preconditions:
          - "now() < Project.opens_at"
        side_effects:
          - "ReviewStage[PRELIMINARY].status set to PENDING"
          - "AuditEvent of action_kind=STAGE_PUBLISHED is NOT emitted yet (stage not published)"
      - from: UNDER_PLATFORM_REVIEW
        to: REJECTED
        trigger: "POST /projects/{id}/reject"
        actor: PlatformOps
        preconditions: []
        side_effects: []
      - from: ON_SHELF
        to: IN_PRELIMINARY
        trigger: "POST /_clock/advance crossing Project.submission_deadline OR POST /projects/{id}/advance-stage"
        actor: system
        preconditions:
          - "now() >= Project.submission_deadline"
          - "ReviewStage[PRELIMINARY].starts_at <= now()"
        side_effects:
          - "All Submission rows with status=DRAFT for this project transition to SCREENING (cascade)"
          - "Submission.modify_window_closes_at is fixed to now() for all submissions"
          - "ReviewStage[PRELIMINARY].status set to OPEN"
      - from: IN_PRELIMINARY
        to: IN_SEMIFINAL
        trigger: "POST /review-stages/{id}/publish"
        actor: PlatformOps
        preconditions:
          - "ReviewStage[PRELIMINARY].status == AGGREGATING"
          - "Every ACCEPTED Submission in this project has aggregated_score_by_stage[PRELIMINARY] computed from >= reviewer_quorum SUBMITTED ReviewAssignments"
        side_effects:
          - "ReviewStage[PRELIMINARY].status -> PUBLISHED, advancing_submission_ids pinned"
          - "Each Submission with score >= passing_threshold transitions to ADVANCING_SEMIFINAL (cascade)"
          - "Each Submission with score < passing_threshold transitions to ELIMINATED (cascade)"
          - "ReviewStage[SEMIFINAL].status -> OPEN; AuditEvent STAGE_PUBLISHED emitted"
      - from: IN_SEMIFINAL
        to: IN_FINAL
        trigger: "POST /review-stages/{id}/publish (for SEMIFINAL stage)"
        actor: PlatformOps
        preconditions:
          - "ReviewStage[SEMIFINAL].status == AGGREGATING"
        side_effects:
          - "ReviewStage[SEMIFINAL].status -> PUBLISHED, advancing list pinned"
          - "Advancing submissions transition to ADVANCING_FINAL; non-advancing to ELIMINATED (cascade)"
          - "ReviewStage[FINAL].status -> OPEN; AuditEvent STAGE_PUBLISHED emitted"
      - from: IN_FINAL
        to: AWARDED
        trigger: "POST /projects/{id}/award"
        actor: PlatformOps
        preconditions:
          - "ReviewStage[FINAL].status == AGGREGATING"
          - "For every PrizeTier of this project, a winning Submission has been selected"
        side_effects:
          - "ReviewStage[FINAL].status -> PUBLISHED"
          - "Project.anonymity_unmasked_at set to now()"
          - "Project.published_winner_list set in tier-rank order"
          - "Each selected Submission's status -> WINNER for MAIN tiers, RUNNER_UP for CONSOLATION tiers (cascade)"
          - "All other ADVANCING_FINAL submissions transition to ELIMINATED (cascade)"
          - "For each winning Submission a CopyrightTransfer is auto-DRAFTED (cascade)"
          - "For each PrizeTier with a winner a PrizePayment row is auto-created in SCHEDULED status (cascade); calc prize_withholding pins gross_amount_cents/withholding_cents/net_amount_cents"
      - from: AWARDED
        to: CLOSED
        trigger: "POST /projects/{id}/close"
        actor: PlatformOps
        preconditions:
          - "All PrizePayment rows in {PAID, REVERSED}"
          - "All CopyrightTransfer rows in {REGISTERED, VOIDED}"
          - "All open Dispute rows in resolved terminal states"
        side_effects: []
      - from: ON_SHELF
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Client
        preconditions:
          - "No Submission rows with status NOT IN {DRAFT, WITHDRAWN}"
        side_effects:
          - "Project.status -> CANCELLED; all ReviewStage rows transition to EXPIRED (cascade)"
      - from: IN_PRELIMINARY
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: PlatformOps
        preconditions:
          - "An UPHELD Dispute of type=PLAGIARISM exists for this project's reference-material legitimacy"
        side_effects:
          - "All ReviewStage rows -> EXPIRED; all active ReviewAssignments -> VOIDED (cascade)"
      - from: IN_PRELIMINARY
        to: IN_PRELIMINARY
        trigger: "POST /review-stages/{id}/start-aggregation"
        actor: PlatformOps
        preconditions:
          - "now() >= ReviewStage[PRELIMINARY].ends_at"
          - "ReviewStage[PRELIMINARY].status == OPEN"
        side_effects:
          - "ReviewStage[PRELIMINARY].status -> AGGREGATING (no Project-level change)"
        note: "Self-loop: stage internal transition, Project status unchanged"

  - entity: Submission
    initial_state: DRAFT
    terminal_states: [SCREEN_REJECTED, WINNER, RUNNER_UP, ELIMINATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SCREENING
        trigger: "POST /_clock/advance crossing Project.submission_deadline (cascade from Project ON_SHELF→IN_PRELIMINARY) OR POST /submissions/{id}/submit"
        actor: system
        preconditions:
          - "Submission.original_work_declared == true"
          - "Project.status IN {ON_SHELF, IN_PRELIMINARY}"
        side_effects:
          - "calc submission_originality_score (variant=PRELIMINARY_SCAN) recomputes Submission.originality_score and updates Designer.trust_score (cascade)"
      - from: SCREENING
        to: SCREEN_REJECTED
        trigger: "system on preliminary-scan completion"
        actor: system
        preconditions:
          - "Submission.originality_score < PRELIM_ORIGINALITY_FLOOR"
        side_effects:
          - "Designer.trust_score decremented by TRUST_PENALTY_ON_REJECT (cascade); AuditEvent REVIEW_VOIDED emitted for any prior assignments"
      - from: SCREENING
        to: ACCEPTED
        trigger: "system on preliminary-scan completion"
        actor: system
        preconditions:
          - "Submission.originality_score >= PRELIM_ORIGINALITY_FLOOR"
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "DELETE /submissions/{id}"
        actor: Designer
        preconditions:
          - "now() < Submission.modify_window_closes_at"
        side_effects: []
      - from: ACCEPTED
        to: ADVANCING_SEMIFINAL
        trigger: "POST /review-stages/{id}/publish (preliminary publishes)"
        actor: system
        preconditions:
          - "aggregated_score_by_stage[PRELIMINARY] >= ReviewStage[PRELIMINARY].passing_threshold"
        side_effects: []
      - from: ACCEPTED
        to: ELIMINATED
        trigger: "POST /review-stages/{id}/publish (preliminary publishes)"
        actor: system
        preconditions:
          - "aggregated_score_by_stage[PRELIMINARY] < ReviewStage[PRELIMINARY].passing_threshold"
        side_effects: []
      - from: ADVANCING_SEMIFINAL
        to: ADVANCING_FINAL
        trigger: "POST /review-stages/{id}/publish (semifinal publishes)"
        actor: system
        preconditions:
          - "aggregated_score_by_stage[SEMIFINAL] >= ReviewStage[SEMIFINAL].passing_threshold"
        side_effects: []
      - from: ADVANCING_SEMIFINAL
        to: ELIMINATED
        trigger: "POST /review-stages/{id}/publish (semifinal publishes)"
        actor: system
        preconditions:
          - "aggregated_score_by_stage[SEMIFINAL] < ReviewStage[SEMIFINAL].passing_threshold"
        side_effects: []
      - from: ADVANCING_FINAL
        to: WINNER
        trigger: "POST /projects/{id}/award"
        actor: system
        preconditions:
          - "Submission is selected as winner of a PrizeTier where tier_kind=MAIN"
        side_effects:
          - "Submission.prize_tier_id pinned; calc submission_originality_score (variant=FINAL_CROSSCHECK) recomputes Submission.originality_score"
          - "CopyrightTransfer auto-DRAFTED for this Submission (cascade)"
          - "PrizePayment auto-created in SCHEDULED status (cascade)"
      - from: ADVANCING_FINAL
        to: RUNNER_UP
        trigger: "POST /projects/{id}/award"
        actor: system
        preconditions:
          - "Submission is selected as winner of a PrizeTier where tier_kind=CONSOLATION"
        side_effects:
          - "Submission.prize_tier_id pinned; CopyrightTransfer auto-DRAFTED; PrizePayment auto-created"
      - from: ADVANCING_FINAL
        to: ELIMINATED
        trigger: "POST /projects/{id}/award"
        actor: system
        preconditions:
          - "Submission is not selected for any PrizeTier"
        side_effects: []

  - entity: ReviewAssignment
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /review-assignments/{id}/submit-scores"
        actor: Reviewer
        preconditions:
          - "now() < ReviewStage.ends_at"
          - "Submitted criterion_scores keys == ReviewStage.rubric keys exactly"
          - "Each criterion_score in [0,100]"
          - "ReviewerPool.reviewer_id is NOT in conflict with Submission.designer_id (Designer.id NOT IN reviewer.conflict_designer_ids)"
        side_effects:
          - "aggregated_score is computed (per rubric weights, two decimals)"
          - "AuditEvent REVIEW_SUBMITTED emitted"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /disputes (type=SCORING_FAIRNESS targeting this assignment)"
        actor: Designer
        preconditions:
          - "ReviewStage.status IN {OPEN, AGGREGATING, PUBLISHED}"
          - "Dispute.filed_within_window == true"
        side_effects:
          - "AuditEvent REVIEW_DISPUTED emitted; assignment excluded from aggregation until resolved"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /disputes/{id}/resolve with outcome=REJECTED"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "Assignment re-included in aggregation; Submission.aggregate_score_by_stage recomputed (cascade)"
        note: "Cyclic: DISPUTED→SUBMITTED revives the assignment"
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /disputes/{id}/resolve with outcome=UPHELD"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "AuditEvent REVIEW_VOIDED emitted; Submission.aggregate_score_by_stage recomputed without this score (cascade)"
          - "If remaining SUBMITTED count < ReviewStage.reviewer_quorum, ReviewStage.status reverts OPEN (cascade) and a new Assignment must be created to reach quorum"
      - from: PENDING
        to: VOIDED
        trigger: "POST /review-assignments/{id}/void"
        actor: PlatformOps
        preconditions:
          - "ReviewStage.status IN {OPEN, AGGREGATING}"
        side_effects:
          - "AuditEvent REVIEW_VOIDED emitted"

  - entity: ReviewStage
    initial_state: PENDING
    terminal_states: [PUBLISHED, EXPIRED]
    transitions:
      - from: PENDING
        to: OPEN
        trigger: "system on Project entering corresponding stage"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: AGGREGATING
        trigger: "POST /review-stages/{id}/start-aggregation"
        actor: PlatformOps
        preconditions:
          - "now() >= ReviewStage.ends_at"
        side_effects:
          - "calc submission_aggregate_score runs for each in-stage Submission"
      - from: AGGREGATING
        to: PUBLISHED
        trigger: "POST /review-stages/{id}/publish"
        actor: PlatformOps
        preconditions:
          - "For every in-stage Submission, at least reviewer_quorum SUBMITTED assignments exist"
          - "No DISPUTED assignment exists on any in-stage Submission"
        side_effects:
          - "advancing_submission_ids pinned; AuditEvent STAGE_PUBLISHED emitted"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /projects/{id}/cancel (or upstream cancellation)"
        actor: system
        preconditions:
          - "Project.status IN {CANCELLED, REJECTED}"
        side_effects: []
      - from: AGGREGATING
        to: OPEN
        trigger: "POST /disputes/{id}/resolve with outcome=UPHELD that voids an assignment"
        actor: system
        preconditions:
          - "After voiding the assignment, some in-stage Submission has fewer than reviewer_quorum SUBMITTED assignments"
        side_effects:
          - "ReviewStage.status reverts to OPEN to admit new ReviewAssignments"
        note: "Cyclic: AGGREGATING→OPEN; allows recovery from dispute-induced shortfall"

  - entity: CopyrightTransfer
    initial_state: DRAFTED
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFTED
        to: PENDING_SIGNATURES
        trigger: "POST /copyright-transfers/{id}/issue-for-signing"
        actor: PlatformOps
        preconditions:
          - "Linked Submission.status IN {WINNER, RUNNER_UP}"
          - "If scope=LIMITED, usage_rights non-empty; if scope=FULL, usage_rights empty"
        side_effects:
          - "External signature system notified; signers pre-populated in fixed order [CLIENT, DESIGNER, PLATFORM_NOTARY]"
          - "AuditEvent COPYRIGHT_DRAFTED emitted"
      - from: PENDING_SIGNATURES
        to: ALL_SIGNED
        trigger: "POST /copyright-transfers/{id}/sign (final signer's call)"
        actor: Client | Designer | PlatformOps
        preconditions:
          - "Signer matches next-unsigned slot in signers[] (in declared order); cannot sign out of order"
          - "Signer identity matches the role (CLIENT slot signed by Project.client_id; DESIGNER slot signed by linked Submission.designer_id; PLATFORM_NOTARY slot signed by PlatformOps)"
        side_effects:
          - "AuditEvent COPYRIGHT_SIGNED emitted per slot; on last slot status -> ALL_SIGNED"
      - from: ALL_SIGNED
        to: REGISTERING
        trigger: "POST /copyright-transfers/{id}/register"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "External copyright-authority registration request emitted"
      - from: REGISTERING
        to: REGISTERED
        trigger: "POST /_events/emit (event_type=COPYRIGHT_REGISTERED with this transfer's id)"
        actor: system
        preconditions: []
        side_effects:
          - "registration_ref and registered_at pinned; AuditEvent COPYRIGHT_REGISTERED emitted"
      - from: PENDING_SIGNATURES
        to: VOIDED
        trigger: "POST /copyright-transfers/{id}/void"
        actor: PlatformOps
        preconditions:
          - "An UPHELD Dispute of type=COPYRIGHT or PLAGIARISM exists targeting the linked Submission"
        side_effects:
          - "AuditEvent COPYRIGHT_VOIDED emitted"
          - "Linked PrizePayment (if any) transitions to REVERSED (cascade), which in turn triggers compensating refund to platform-funds via /_events/emit (PAYMENT_REVERSED)"
      - from: ALL_SIGNED
        to: VOIDED
        trigger: "POST /copyright-transfers/{id}/void"
        actor: PlatformOps
        preconditions:
          - "An UPHELD Dispute of type=COPYRIGHT exists targeting the linked Submission"
          - "registration_ref is null (not yet REGISTERED)"
        side_effects:
          - "Same cascade as PENDING_SIGNATURES->VOIDED"
      - from: REGISTERED
        to: VOIDED
        trigger: "POST /copyright-transfers/{id}/void (post-registration reversal driven by UPHELD COPYRIGHT/PLAGIARISM dispute resolution)"
        actor: PlatformOps
        preconditions:
          - "An UPHELD Dispute of type=COPYRIGHT or PLAGIARISM exists targeting the linked Submission"
        side_effects:
          - "External copyright-authority deregistration request emitted; AuditEvent COPYRIGHT_VOIDED emitted"
          - "Linked PrizePayment.status cascades PAID -> REVERSED (compensating payment refund event emitted)"
        note: "Distinct from PENDING_SIGNATURES->VOIDED and ALL_SIGNED->VOIDED because the registry must be notified to deregister; Submission stays in WINNER/RUNNER_UP (terminal) — only fiscal/registry side effects are reversed."

  - entity: PrizePayment
    initial_state: SCHEDULED
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: SCHEDULED
        to: PAYING
        trigger: "POST /prize-payments/{id}/dispatch"
        actor: PlatformOps
        preconditions:
          - "Linked CopyrightTransfer.status == REGISTERED"
          - "Idempotency: no other PrizePayment with same idempotency_key in PAYING|PAID"
        side_effects:
          - "External payment system request emitted with idempotency_key"
      - from: PAYING
        to: PAID
        trigger: "POST /_events/emit (event_type=PAYMENT_COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "external_payment_ref pinned; AuditEvent PRIZE_PAID emitted"
      - from: PAYING
        to: FAILED
        trigger: "POST /_events/emit (event_type=PAYMENT_FAILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /prize-payments/{id}/retry"
        actor: PlatformOps
        preconditions: []
        side_effects: []
        note: "Cyclic: retry loop"
      - from: PAID
        to: REVERSED
        trigger: "system cascade from CopyrightTransfer -> VOIDED"
        actor: system
        preconditions: []
        side_effects:
          - "AuditEvent PRIZE_PAID payload extended with reversal note"

  - entity: Dispute
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_REJECTED, WITHDRAWN]
    transitions:
      - from: FILED
        to: MEDIATING_STAGE1
        trigger: "POST /disputes/{id}/start-mediation"
        actor: PlatformOps
        preconditions: []
        side_effects: []
      - from: MEDIATING_STAGE1
        to: MEDIATING_STAGE2
        trigger: "POST /disputes/{id}/escalate"
        actor: PlatformOps
        preconditions: []
        side_effects: []
      - from: MEDIATING_STAGE2
        to: ARBITRATION
        trigger: "POST /disputes/{id}/request-arbitration"
        actor: Client | Designer | PlatformOps
        preconditions: []
        side_effects: []
      - from: MEDIATING_STAGE1
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve outcome=UPHELD"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "Dispute-type-specific cascades: SCORING_FAIRNESS -> assignment VOIDED; COPYRIGHT/PLAGIARISM -> CopyrightTransfer VOIDED cascade; PAYMENT -> PrizePayment SCHEDULED -> REVERSED cascade"
          - "AuditEvent DISPUTE_RESOLVED emitted"
      - from: MEDIATING_STAGE1
        to: RESOLVED_REJECTED
        trigger: "POST /disputes/{id}/resolve outcome=REJECTED"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "If subject_ref_kind=REVIEW_ASSIGNMENT and prior assignment status=DISPUTED, assignment reverts to SUBMITTED (cascade); AuditEvent DISPUTE_RESOLVED emitted"
      - from: MEDIATING_STAGE2
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve outcome=UPHELD"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "Same as MEDIATING_STAGE1->RESOLVED_UPHELD"
      - from: MEDIATING_STAGE2
        to: RESOLVED_REJECTED
        trigger: "POST /disputes/{id}/resolve outcome=REJECTED"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "Same as MEDIATING_STAGE1->RESOLVED_REJECTED"
      - from: ARBITRATION
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve outcome=UPHELD"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "Same cascades"
      - from: ARBITRATION
        to: RESOLVED_REJECTED
        trigger: "POST /disputes/{id}/resolve outcome=REJECTED"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "Same cascades"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Client | Designer
        preconditions:
          - "Filer is the withdrawer"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two reviewers race POST /review-assignments to assign the same reviewer to the same submission in the same stage"
    guarantee: "At most one ReviewAssignment exists per (review_stage_id, submission_id, reviewer_id); the second is rejected"
    error_id: ERR_REVIEWER_ALREADY_ASSIGNED
    http_status: 409
    serialization: "First-writer-wins on (review_stage_id, submission_id, reviewer_id) unique key"

  - scenario: "Two PlatformOps users race POST /review-stages/{id}/publish on the same stage"
    guarantee: "Exactly one publish call wins; loser sees ERR_STAGE_ALREADY_PUBLISHED"
    error_id: ERR_STAGE_ALREADY_PUBLISHED
    http_status: 409
    serialization: "First-writer-wins on ReviewStage.status transition AGGREGATING->PUBLISHED"

  - scenario: "Two dispatch calls race POST /prize-payments/{id}/dispatch with the same idempotency_key"
    guarantee: "Exactly one outbound payment request; the second is rejected and the first PrizePayment.id is returned"
    error_id: ERR_DUPLICATE_IDEMPOTENCY_KEY
    http_status: 409
    serialization: "First-writer-wins on PrizePayment.idempotency_key uniqueness per (project_id, prize_tier_id)"

  - scenario: "Two signers race POST /copyright-transfers/{id}/sign while the previous slot is still unsigned"
    guarantee: "Only the next-in-order signer succeeds; an out-of-order signer is rejected"
    error_id: ERR_SIGNATURE_OUT_OF_ORDER
    http_status: 409
    serialization: "Sequential signing per signers[] index; loser sees out-of-order error"

  - scenario: "Award call races with a pending UPHELD dispute resolution that would void an assignment"
    guarantee: "Award is rejected if any DISPUTED assignment exists at moment of award; dispute resolution wins if it commits first"
    error_id: ERR_DISPUTE_PENDING
    http_status: 409
    serialization: "First-writer-wins on Project.status IN_FINAL -> AWARDED"

  - scenario: "Designer creates two Submission rows over the per-designer cap simultaneously"
    guarantee: "At most max_submissions_per_designer non-WITHDRAWN submissions; the over-cap create is rejected"
    error_id: ERR_SUBMISSION_LIMIT_REACHED
    http_status: 409
    serialization: "First-writer-wins on count(Submission WHERE project_id, designer_id, status != WITHDRAWN)"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: prize_withholding
    trigger: "Project AWARDED transition creates PrizePayment rows (cascade)"
    algorithm: tiered_pricing
    formula: |
      # Inputs: gross = PrizeTier.gross_amount_cents (integer cents);
      #         residency = Designer.tax_residency at the moment of AWARDED (version-pinned).
      # Variant selection:
      if residency == RESIDENT:
          withholding = round_half_up( gross * RESIDENT_RATE )   # 20% flat
      elif residency == NON_RESIDENT:
          # Two tiers measured in cents:
          tier1 = min(gross, TIER_BREAK_CENTS) * NONRES_TIER1_RATE
          tier2 = max(gross - TIER_BREAK_CENTS, 0) * NONRES_TIER2_RATE
          withholding = round_half_up(tier1) + round_half_up(tier2)
      net = gross - withholding
      # All cents arithmetic; round_half_up to integer cents.
    input_set: "Single PrizeTier.gross_amount_cents (integer cents) and the winning Designer.tax_residency at AWARDED time"
    constants:
      RESIDENT_RATE: 0.20
      NONRES_TIER1_RATE: 0.20
      NONRES_TIER2_RATE: 0.30
      TIER_BREAK_CENTS: 400000   # 4000.00 minor units boundary
    precision: "integer cents, round_half_up applied per tier then summed"
    variants:
      - name: resident_flat
        when: "Designer.tax_residency == RESIDENT"
        difference: "Flat 20% on full gross; identical gross of 1,000,000 cents -> withholding=200,000 cents"
      - name: non_resident_tiered
        when: "Designer.tax_residency == NON_RESIDENT"
        difference: "Tiered 20% up to 400,000 cents + 30% above; identical gross of 1,000,000 cents -> 80,000 + 180,000 = 260,000 cents"

  - name: submission_originality_score
    trigger: "Submission enters SCREENING (preliminary scan) AND Submission enters WINNER/RUNNER_UP (final cross-check)"
    algorithm: weighted_scoring
    formula: |
      # Two variants on the same field, producing different originality_score for the same submission.
      if variant == PRELIMINARY_SCAN:
          public_sim = max_similarity_against_public_corpus(Submission.asset_urls, DesignCategory.similarity_corpus_id)
          # public_sim in [0,1]; score = round_half_up( (1 - public_sim) * 100, 2 )
          score = round_half_up( (1 - public_sim) * 100, 2 )
      elif variant == FINAL_CROSSCHECK:
          public_sim = max_similarity_against_public_corpus(...)
          peer_sim = max_similarity_against_peer_submissions(
              this Submission,
              peers = Submission rows in same Project with status IN {WINNER, RUNNER_UP, ADVANCING_FINAL}, excluding self
          )
          combined = max(public_sim, PEER_WEIGHT * peer_sim + (1 - PEER_WEIGHT) * public_sim)
          score = round_half_up( (1 - combined) * 100, 2 )
    input_set: "PRELIMINARY_SCAN: only public corpus. FINAL_CROSSCHECK: public corpus + peer ADVANCING_FINAL/WINNER/RUNNER_UP submissions (excluding self)."
    constants:
      PEER_WEIGHT: 0.70
      PRELIM_ORIGINALITY_FLOOR: 60.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PRELIMINARY_SCAN
        when: "Submission.DRAFT->SCREENING (preliminary plagiarism screen)"
        difference: "Considers ONLY public corpus; peer cross-check is excluded"
      - name: FINAL_CROSSCHECK
        when: "Submission.ADVANCING_FINAL -> WINNER/RUNNER_UP (recompute on award)"
        difference: "Includes peer cross-check against other ADVANCING_FINAL/WINNER/RUNNER_UP submissions; same Submission asset can yield a strictly lower score than PRELIMINARY_SCAN"

  - name: assignment_aggregated_score
    trigger: "ReviewAssignment.PENDING -> SUBMITTED"
    algorithm: weighted_scoring
    formula: |
      # Inputs: criterion_scores (map criterion_code -> [0,100]); rubric (criterion_code -> weight, sum=100).
      # Step 1: round each criterion_score to 2 decimals (input pre-rounding).
      # Step 2: multiply by weight/100 and sum; the multiplication result is NOT pre-rounded.
      # Step 3: round the final sum to 2 decimals (round_half_up).
      # ROUNDING ORDER IS PINNED: per-criterion (no rounding) -> sum (full precision) -> final round to 2 dp.
      sum = 0
      for c in rubric.keys():
          sum += criterion_scores[c] * (rubric[c] / 100.0)
      aggregated = round_half_up(sum, 2)
    input_set: "Single ReviewAssignment, all rubric criteria present"
    constants: {}
    precision: "2 decimal places at the final step; intermediate per-criterion products are NOT rounded"

  - name: submission_aggregate_score
    trigger: "ReviewStage.OPEN -> AGGREGATING; also recomputed on cascade after dispute resolution"
    algorithm: aggregation
    formula: |
      # Inputs: For target (Submission, ReviewStage):
      #   scores = [a.aggregated_score for a in ReviewAssignment
      #             WHERE a.review_stage_id == stage.id
      #               AND a.submission_id == submission.id
      #               AND a.status == SUBMITTED]
      # If len(scores) < stage.reviewer_quorum: aggregate is UNDEFINED, stage cannot publish.
      n = len(scores)
      if n >= OUTLIER_TRIM_THRESHOLD:
          # Drop one highest and one lowest before averaging.
          sorted_scores = sorted(scores)
          trimmed = sorted_scores[1:-1]
      else:
          trimmed = scores
      mean = sum(trimmed) / len(trimmed)
      # Stage-specific client weighting:
      if stage.stage_kind == FINAL and Project.client_participates_final == true:
          # The lowest-id Client-submitted assignment is treated separately:
          client_score = client_assignment.aggregated_score  # already in scores list; remove duplicate
          trimmed_without_client = [s for s in trimmed if assignment.actor != Client]
          mean_reviewers = sum(trimmed_without_client) / max(len(trimmed_without_client), 1)
          weighted = CLIENT_WEIGHT * client_score + (1 - CLIENT_WEIGHT) * mean_reviewers
          aggregate = round_half_up(weighted, 2)
      else:
          aggregate = round_half_up(mean, 2)
      Submission.aggregate_score_by_stage[stage.stage_kind] = aggregate
    input_set: |
      All ReviewAssignment rows for the (submission_id, review_stage_id) pair whose status==SUBMITTED.
      Tie-break on sorted scores: when two scores tie at the boundary, sort secondary by ReviewAssignment.id ascending so the trimmed selection is deterministic.
    constants:
      OUTLIER_TRIM_THRESHOLD: 5
      CLIENT_WEIGHT: 0.30
    precision: "2 decimal places, round_half_up at the final step"
    variants:
      - name: standard_average
        when: "stage.stage_kind != FINAL OR Project.client_participates_final == false"
        difference: "No client weighting; trimmed mean (or simple mean if n<5)"
      - name: client_weighted_final
        when: "stage.stage_kind == FINAL AND Project.client_participates_final == true"
        difference: "Client assignment contributes CLIENT_WEIGHT=30% of the final score, reviewers contribute 70%; same raw scores produce a different aggregate"

# =============================================================================
# §1.4 Validation Rules Table (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-id resources exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "All foreign-key references in body exist"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with FK fields"

  - priority: 5
    category: state
    check: "Target entity is in a valid source state for this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "When creating a Submission, Submission.original_work_declared must be true"
    error_id: ERR_ORIGINAL_DECLARATION_REQUIRED
    http_status: 422
    applies_to: "POST /projects/{id}/submissions"

  - priority: 7
    category: business_safety
    check: "Reviewer is not in conflict with Submission.designer_id (Designer.id NOT IN ReviewerPool.conflict_designer_ids)"
    error_id: ERR_REVIEWER_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /review-assignments, POST /review-assignments/{id}/submit-scores"

  - priority: 8
    category: business_safety
    check: "Reviewer's categories must include Project.category_code"
    error_id: ERR_REVIEWER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /review-assignments"

  - priority: 9
    category: business_temporal
    check: "Submission modifications/withdrawals must occur strictly before Submission.modify_window_closes_at"
    error_id: ERR_MODIFY_WINDOW_CLOSED
    http_status: 422
    applies_to: "PATCH /submissions/{id}, DELETE /submissions/{id}"

  - priority: 10
    category: business_temporal
    check: "Submitting review scores must occur strictly before ReviewStage.ends_at"
    error_id: ERR_REVIEW_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /review-assignments/{id}/submit-scores"

  - priority: 11
    category: business_temporal
    check: "Project.submission_deadline >= Project.opens_at + 72h and Project.final_decision_deadline >= Project.submission_deadline + 168h"
    error_id: ERR_TIMELINE_TOO_TIGHT
    http_status: 422
    applies_to: "POST /projects, PATCH /projects/{id}"

  - priority: 12
    category: business_temporal
    check: "Stage intervals on the same project are strictly ordered with non-overlapping half-open windows: PRELIMINARY.ends_at <= SEMIFINAL.starts_at and SEMIFINAL.ends_at <= FINAL.starts_at"
    error_id: ERR_STAGE_OVERLAP
    http_status: 422
    applies_to: "POST /projects/{id}/review-stages, PATCH /review-stages/{id}"

  - priority: 13
    category: business_constraint
    check: "Per-designer non-WITHDRAWN submission count on a project must not exceed Project.max_submissions_per_designer"
    error_id: ERR_SUBMISSION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /projects/{id}/submissions"

  - priority: 14
    category: business_constraint
    check: "Reviewer's count of currently PENDING assignments across stages must not exceed ReviewerPool.max_concurrent_assignments"
    error_id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /review-assignments"

  - priority: 15
    category: business_constraint
    check: "ReviewStage.rubric weights are 1..8 entries, each >= 0, sum exactly equal to 100"
    error_id: ERR_RUBRIC_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST /projects/{id}/review-stages, PATCH /review-stages/{id}"

  - priority: 16
    category: business_constraint
    check: "Submitted criterion_scores keys equal ReviewStage.rubric keys exactly; each score in [0,100]"
    error_id: ERR_CRITERION_SCORES_INVALID
    http_status: 422
    applies_to: "POST /review-assignments/{id}/submit-scores"

  - priority: 17
    category: business_constraint
    check: "CopyrightTransfer.scope=LIMITED requires usage_rights non-empty; scope=FULL requires usage_rights empty"
    error_id: ERR_TRANSFER_SCOPE_INVALID
    http_status: 422
    applies_to: "POST /copyright-transfers, PATCH /copyright-transfers/{id}"

  - priority: 18
    category: business_referential
    check: "CopyrightTransfer.sign call comes from the role matching the next unsigned slot"
    error_id: ERR_SIGNATURE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /copyright-transfers/{id}/sign"

  - priority: 19
    category: business_referential
    check: "PrizePayment.dispatch requires linked CopyrightTransfer.status == REGISTERED"
    error_id: ERR_COPYRIGHT_NOT_REGISTERED
    http_status: 422
    applies_to: "POST /prize-payments/{id}/dispatch"

  - priority: 20
    category: business_fiscal
    check: "On project submission-for-review, sum(PrizeTier.gross_amount_cents for project) == Project.prize_pool_cents"
    error_id: ERR_PRIZE_POOL_MISMATCH
    http_status: 422
    applies_to: "POST /projects/{id}/submit-for-review"

  - priority: 21
    category: business_fiscal
    check: "Project.prize_pool_cents >= 100000 (1000.00 minimum) and each PrizeTier.gross_amount_cents >= 0"
    error_id: ERR_PRIZE_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /projects, POST /projects/{id}/prize-tiers"

  - priority: 22
    category: business_constraint
    check: "Stage publish requires every in-stage Submission to have >= reviewer_quorum SUBMITTED assignments and zero DISPUTED assignments"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /review-stages/{id}/publish"

  - priority: 23
    category: business_constraint
    check: "Dispute filing window: SCORING_FAIRNESS must be filed before the stage transitions to PUBLISHED; COPYRIGHT/PAYMENT must be filed within 14 days of CopyrightTransfer.REGISTERED or PrizePayment.PAID respectively"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /disputes"

  - priority: 24
    category: business_constraint
    check: "Optimistic concurrency: when version supplied on PATCH/state-action, entity.version must match"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH and state-action endpoints with version body field"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Catalog / setup ---
  - method: POST
    path: "/design-categories"
    description: "PlatformOps creates a design category"
    roles: [PlatformOps]
    code: 201
    input: [code, name, similarity_corpus_id]
    output: DesignCategory
    side_effects: []

  - method: GET
    path: "/design-categories"
    description: "List design categories"
    roles: [PlatformOps, Client, Designer, Reviewer]
    code: 200
    input: []
    output: DesignCategory[]
    side_effects: []

  - method: POST
    path: "/clients"
    description: "Register a client account"
    roles: [PlatformOps]
    code: 201
    input: [company_name, contact_email, tax_jurisdiction]
    output: Client
    side_effects: []

  - method: POST
    path: "/designers"
    description: "Register a designer profile and qualification"
    roles: [PlatformOps]
    code: 201
    input: [display_name, qualification_level, categories, tax_residency]
    output: Designer
    side_effects: []

  - method: GET
    path: "/designers/{designer_id}"
    description: "Fetch designer profile"
    roles: [PlatformOps, Designer]
    code: 200
    input: []
    output: Designer
    side_effects: []

  - method: POST
    path: "/reviewer-pool"
    description: "PlatformOps adds reviewer to the reviewer pool"
    roles: [PlatformOps]
    code: 201
    input: ["reviewer_id, name, categories, max_concurrent_assignments, conflict_designer_ids?"]
    output: ReviewerPool
    side_effects: []

  # --- Projects ---
  - method: POST
    path: "/projects"
    description: "Client creates a draft project with brief and reference materials"
    roles: [Client]
    code: 201
    input: ["client_id, category_code, title, brief, reference_material_urls, prize_pool_cents, opens_at, submission_deadline, final_decision_deadline, max_submissions_per_designer?, client_participates_final?"]
    output: Project
    side_effects: []

  - method: GET
    path: "/projects/{project_id}"
    description: "Get project (includes computed published_winner_list when AWARDED)"
    roles: [PlatformOps, Client, Designer, Reviewer]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/projects"
    description: "List projects with filters status, category_code, client_id"
    roles: [PlatformOps, Client, Designer, Reviewer]
    code: 200
    input: ["status?, category_code?, client_id?, limit?, offset?"]
    output: Project[]
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/prize-tiers"
    description: "Configure a prize tier"
    roles: [Client]
    code: 201
    input: [rank, gross_amount_cents, tier_kind]
    output: PrizeTier
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/review-stages"
    description: "Configure a review stage with rubric and timing"
    roles: [Client]
    code: 201
    input: [stage_kind, passing_threshold, reviewer_quorum, rubric, starts_at, ends_at]
    output: ReviewStage
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/submit-for-review"
    description: "Client submits project to PlatformOps review (state: DRAFT->UNDER_PLATFORM_REVIEW)"
    roles: [Client]
    code: 200
    input: ["version?"]
    output: Project
    side_effects: ["§1.4 prize-pool sum check; §1.4 timeline checks"]

  - method: POST
    path: "/projects/{project_id}/approve"
    description: "PlatformOps approves project for on-shelf"
    roles: [PlatformOps]
    code: 200
    input: ["version?"]
    output: Project
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/reject"
    description: "PlatformOps rejects project"
    roles: [PlatformOps]
    code: 200
    input: ["version?, reason"]
    output: Project
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/cancel"
    description: "Cancel project (Client only ON_SHELF; PlatformOps in later stages with upheld dispute)"
    roles: [Client, PlatformOps]
    code: 200
    input: ["version?, reason?"]
    output: Project
    side_effects: ["Cascade ReviewStage -> EXPIRED, ReviewAssignment -> VOIDED"]

  - method: POST
    path: "/projects/{project_id}/award"
    description: "PlatformOps finalizes winners; assigns each PrizeTier.winner_submission_id"
    roles: [PlatformOps]
    code: 200
    input: [tier_assignments]   # list of {prize_tier_id, submission_id}
    output: Project
    side_effects: ["Submission state transitions; CopyrightTransfer auto-DRAFTED; PrizePayment auto-SCHEDULED; calc prize_withholding pins amounts; submission_originality_score (variant=FINAL_CROSSCHECK) recomputes for winners"]

  - method: POST
    path: "/projects/{project_id}/close"
    description: "Close project after all settlements"
    roles: [PlatformOps]
    code: 200
    input: ["version?"]
    output: Project
    side_effects: []

  # --- Submissions ---
  - method: POST
    path: "/projects/{project_id}/submissions"
    description: "Designer creates submission; per-designer cap and original-work declaration enforced"
    roles: [Designer]
    code: 201
    input: [designer_id, title, asset_urls, original_work_declared]
    output: Submission
    side_effects: []

  - method: GET
    path: "/projects/{project_id}/submissions"
    description: "List submissions; designer can only see own pre-AWARDED; PlatformOps and reviewer see anonymized aliases; full identity revealed after Project.anonymity_unmasked_at"
    roles: [PlatformOps, Client, Designer, Reviewer]
    code: 200
    input: ["status?, designer_id?, limit?, offset?"]
    output: Submission[]
    side_effects: []

  - method: GET
    path: "/submissions/{submission_id}"
    description: "Get a submission"
    roles: [PlatformOps, Client, Designer, Reviewer]
    code: 200
    input: []
    output: Submission
    side_effects: []

  - method: PATCH
    path: "/submissions/{submission_id}"
    description: "Modify submission within modify window"
    roles: [Designer]
    code: 200
    input: ["title?, asset_urls?, version?"]
    output: Submission
    side_effects: []

  - method: DELETE
    path: "/submissions/{submission_id}"
    description: "Withdraw submission within modify window"
    roles: [Designer]
    code: 200
    input: ["version?"]
    output: Submission
    side_effects: []

  # --- Review stages / assignments ---
  - method: POST
    path: "/review-stages/{review_stage_id}/start-aggregation"
    description: "Move stage OPEN -> AGGREGATING after ends_at"
    roles: [PlatformOps]
    code: 200
    input: ["version?"]
    output: ReviewStage
    side_effects: ["Runs calc submission_aggregate_score for each in-stage submission"]

  - method: POST
    path: "/review-stages/{review_stage_id}/publish"
    description: "Publish stage results; cascades Submission advance/eliminate"
    roles: [PlatformOps]
    code: 200
    input: ["version?"]
    output: ReviewStage
    side_effects: ["Cascade Submission states; AuditEvent STAGE_PUBLISHED"]

  - method: POST
    path: "/review-assignments"
    description: "Assign a reviewer to a submission within a stage"
    roles: [PlatformOps]
    code: 201
    input: [review_stage_id, submission_id, reviewer_id]
    output: ReviewAssignment
    side_effects: []

  - method: POST
    path: "/review-assignments/{review_assignment_id}/submit-scores"
    description: "Reviewer submits per-criterion scores"
    roles: [Reviewer, Client]   # Client allowed only for FINAL stage when Project.client_participates_final=true
    code: 200
    input: ["criterion_scores, version?"]
    output: ReviewAssignment
    side_effects: ["calc assignment_aggregated_score; AuditEvent REVIEW_SUBMITTED"]

  - method: POST
    path: "/review-assignments/{review_assignment_id}/void"
    description: "PlatformOps voids an assignment (e.g., conflict discovered)"
    roles: [PlatformOps]
    code: 200
    input: ["version?, reason?"]
    output: ReviewAssignment
    side_effects: ["AuditEvent REVIEW_VOIDED"]

  - method: GET
    path: "/review-assignments/{review_assignment_id}"
    description: "Fetch assignment (designer identity is anonymized until Project.AWARDED)"
    roles: [PlatformOps, Reviewer, Client]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: []

  # --- Copyright ---
  - method: POST
    path: "/copyright-transfers"
    description: "Create a copyright transfer (auto-DRAFTED on award; this endpoint allows manual creation when missing)"
    roles: [PlatformOps]
    code: 201
    input: ["project_id, submission_id, scope, usage_rights?"]
    output: CopyrightTransfer
    side_effects: []

  - method: POST
    path: "/copyright-transfers/{transfer_id}/issue-for-signing"
    description: "Move DRAFTED -> PENDING_SIGNATURES"
    roles: [PlatformOps]
    code: 200
    input: ["version?"]
    output: CopyrightTransfer
    side_effects: ["AuditEvent COPYRIGHT_DRAFTED"]

  - method: POST
    path: "/copyright-transfers/{transfer_id}/sign"
    description: "Signer (Client/Designer/PlatformOps) signs the next slot in order"
    roles: [Client, Designer, PlatformOps]
    code: 200
    input: ["signer_party_kind, version?"]
    output: CopyrightTransfer
    side_effects: ["AuditEvent COPYRIGHT_SIGNED; on last slot transitions to ALL_SIGNED"]

  - method: POST
    path: "/copyright-transfers/{transfer_id}/register"
    description: "Submit transfer to copyright authority"
    roles: [PlatformOps]
    code: 200
    input: ["version?"]
    output: CopyrightTransfer
    side_effects: ["External copyright-authority registration request emitted"]

  - method: POST
    path: "/copyright-transfers/{transfer_id}/void"
    description: "Void transfer (only on UPHELD COPYRIGHT/PLAGIARISM dispute)"
    roles: [PlatformOps]
    code: 200
    input: ["dispute_id, version?"]
    output: CopyrightTransfer
    side_effects: ["Cascade PrizePayment -> REVERSED"]

  - method: GET
    path: "/copyright-transfers/{transfer_id}"
    description: "Get transfer"
    roles: [PlatformOps, Client, Designer]
    code: 200
    input: []
    output: CopyrightTransfer
    side_effects: []

  # --- Prize payments ---
  - method: POST
    path: "/prize-payments/{prize_payment_id}/dispatch"
    description: "Dispatch payment to external payment system"
    roles: [PlatformOps]
    code: 200
    input: ["idempotency_key, version?"]
    output: PrizePayment
    side_effects: []

  - method: POST
    path: "/prize-payments/{prize_payment_id}/retry"
    description: "Retry a FAILED payment"
    roles: [PlatformOps]
    code: 200
    input: ["version?"]
    output: PrizePayment
    side_effects: []

  - method: GET
    path: "/prize-payments/{prize_payment_id}"
    description: "Get prize payment"
    roles: [PlatformOps, Designer]
    code: 200
    input: []
    output: PrizePayment
    side_effects: []

  - method: GET
    path: "/prize-payments"
    description: "List prize payments (filter by project_id, designer_id, status)"
    roles: [PlatformOps, Designer]
    code: 200
    input: ["project_id?, designer_id?, status?, limit?, offset?"]
    output: PrizePayment[]
    side_effects: []

  # --- Disputes ---
  - method: POST
    path: "/disputes"
    description: "File a dispute"
    roles: [Client, Designer, Reviewer, PlatformOps]
    code: 201
    input: ["project_id, dispute_type, subject_ref_kind, subject_ref_id, filer_kind, filer_id, evidence_urls?"]
    output: Dispute
    side_effects: ["If type=SCORING_FAIRNESS and subject_ref_kind=REVIEW_ASSIGNMENT, transitions the assignment SUBMITTED -> DISPUTED (cascade)"]

  - method: POST
    path: "/disputes/{dispute_id}/start-mediation"
    description: "PlatformOps starts stage-1 mediation"
    roles: [PlatformOps]
    code: 200
    input: ["version?"]
    output: Dispute
    side_effects: []

  - method: POST
    path: "/disputes/{dispute_id}/escalate"
    description: "Escalate to stage-2 mediation"
    roles: [PlatformOps]
    code: 200
    input: ["version?"]
    output: Dispute
    side_effects: []

  - method: POST
    path: "/disputes/{dispute_id}/request-arbitration"
    description: "Move to ARBITRATION"
    roles: [PlatformOps, Client, Designer]
    code: 200
    input: ["version?"]
    output: Dispute
    side_effects: []

  - method: POST
    path: "/disputes/{dispute_id}/resolve"
    description: "Resolve dispute with outcome=UPHELD or REJECTED"
    roles: [PlatformOps]
    code: 200
    input: ["outcome, resolution_note, version?"]
    output: Dispute
    side_effects: ["Cascades per dispute_type; AuditEvent DISPUTE_RESOLVED"]

  - method: POST
    path: "/disputes/{dispute_id}/withdraw"
    description: "Filer withdraws dispute"
    roles: [Client, Designer]
    code: 200
    input: ["version?"]
    output: Dispute
    side_effects: []

  - method: GET
    path: "/disputes/{dispute_id}"
    description: "Get dispute"
    roles: [PlatformOps, Client, Designer, Reviewer]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List disputes (filter by project_id, dispute_type, status)"
    roles: [PlatformOps, Client, Designer]
    code: 200
    input: ["project_id?, dispute_type?, status?, limit?, offset?"]
    output: Dispute[]
    side_effects: []

  # --- Audit ---
  - method: GET
    path: "/audit-events"
    description: "List audit events with filters"
    roles: [PlatformOps]
    code: 200
    input: ["project_id?, subject_kind?, subject_id?, action_kind?, limit?, offset?"]
    output: AuditEvent[]
    side_effects: []

  # --- Test-driving endpoints (clock + external events) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance virtual server clock to a given ISO 8601 instant; drives all time-gated transitions"
    roles: [PlatformOps]
    code: 200
    input: [to]
    output: null
    side_effects: ["Cascades Project ON_SHELF->IN_PRELIMINARY when crossing submission_deadline; sets Submission.modify_window_closes_at"]

  - method: POST
    path: "/_events/emit"
    description: "Simulate inbound event from payment / e-signature / copyright authority"
    roles: [PlatformOps]
    code: 200
    input: ["event_type, subject_id, payload?"]
    output: null
    side_effects: ["event_type=PAYMENT_COMPLETED moves PrizePayment PAYING->PAID; event_type=PAYMENT_FAILED PAYING->FAILED; event_type=COPYRIGHT_REGISTERED moves CopyrightTransfer REGISTERING->REGISTERED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-ID / X-User-Role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Foreign-key reference in body resolves to a non-existent resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a valid source state for the requested transition"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied version does not match current entity.version"
  - id: ERR_ORIGINAL_DECLARATION_REQUIRED
    http: 422
    condition: "Submission created without original_work_declared=true"
  - id: ERR_REVIEWER_CONFLICT_OF_INTEREST
    http: 422
    condition: "Reviewer.conflict_designer_ids includes the submission's designer_id"
  - id: ERR_REVIEWER_NOT_QUALIFIED
    http: 422
    condition: "Reviewer.categories does not include Project.category_code"
  - id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http: 422
    condition: "Reviewer's PENDING assignment count exceeds max_concurrent_assignments"
  - id: ERR_MODIFY_WINDOW_CLOSED
    http: 422
    condition: "Submission edit/withdraw after modify_window_closes_at"
  - id: ERR_REVIEW_WINDOW_CLOSED
    http: 422
    condition: "Score submission after ReviewStage.ends_at"
  - id: ERR_TIMELINE_TOO_TIGHT
    http: 422
    condition: "Project intervals violate 72h / 168h minimum gaps"
  - id: ERR_STAGE_OVERLAP
    http: 422
    condition: "Two stages on the same project overlap or are out of order"
  - id: ERR_SUBMISSION_LIMIT_REACHED
    http: 422
    condition: "Per-designer non-WITHDRAWN submission count exceeds max_submissions_per_designer"
  - id: ERR_RUBRIC_WEIGHTS_INVALID
    http: 422
    condition: "Rubric weights count out of [1,8] or do not sum to 100"
  - id: ERR_CRITERION_SCORES_INVALID
    http: 422
    condition: "criterion_scores keys do not match rubric keys exactly or score out of [0,100]"
  - id: ERR_TRANSFER_SCOPE_INVALID
    http: 422
    condition: "Transfer scope/usage_rights inconsistency"
  - id: ERR_SIGNATURE_OUT_OF_ORDER
    http: 409
    condition: "Caller is not the next signer in signers[]"
  - id: ERR_COPYRIGHT_NOT_REGISTERED
    http: 422
    condition: "PrizePayment dispatch attempted before linked CopyrightTransfer.status == REGISTERED"
  - id: ERR_PRIZE_POOL_MISMATCH
    http: 422
    condition: "sum(PrizeTier.gross_amount_cents) != Project.prize_pool_cents at submit-for-review"
  - id: ERR_PRIZE_AMOUNT_INVALID
    http: 422
    condition: "Prize pool < 100000 cents or a tier amount < 0"
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "Stage publish attempted with insufficient SUBMITTED assignments or active DISPUTED assignment"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "Dispute filed after its window expired"
  - id: ERR_DISPUTE_PENDING
    http: 409
    condition: "Award attempted while a DISPUTED assignment exists in the FINAL stage"
  - id: ERR_REVIEWER_ALREADY_ASSIGNED
    http: 409
    condition: "Duplicate (review_stage_id, submission_id, reviewer_id) ReviewAssignment"
  - id: ERR_STAGE_ALREADY_PUBLISHED
    http: 409
    condition: "Stage already in PUBLISHED status"
  - id: ERR_DUPLICATE_IDEMPOTENCY_KEY
    http: 409
    condition: "PrizePayment.dispatch with an idempotency_key already in use for the same (project_id, prize_tier_id)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformOps
    description: "Platform operations staff. Approves projects, manages reviewer pool, dispatches payments, resolves disputes, coordinates copyright registration."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/approve"
      - "POST /projects/{id}/reject"
      - "POST /projects/{id}/award"
      - "POST /projects/{id}/close"
      - "POST /review-stages/{id}/start-aggregation"
      - "POST /review-stages/{id}/publish"
      - "POST /review-assignments"
      - "POST /review-assignments/{id}/void"
      - "POST /copyright-transfers/{id}/issue-for-signing"
      - "POST /copyright-transfers/{id}/register"
      - "POST /copyright-transfers/{id}/void"
      - "POST /prize-payments/{id}/dispatch"
      - "POST /prize-payments/{id}/retry"
      - "POST /disputes/{id}/start-mediation"
      - "POST /disputes/{id}/escalate"
      - "POST /disputes/{id}/resolve"
      - "POST /reviewer-pool"
      - "POST /design-categories"
      - "POST /clients"
      - "POST /designers"
      - "GET /audit-events"
      - "POST /_clock/advance"
      - "POST /_events/emit"
    shared_operations:
      - "POST /copyright-transfers/{id}/sign (as PLATFORM_NOTARY slot)"
      - "POST /disputes"
      - "POST /disputes/{id}/request-arbitration"
      - "POST /projects/{id}/cancel (after on-shelf)"
      - "GET /projects, GET /submissions, GET /review-assignments, GET /copyright-transfers, GET /prize-payments, GET /disputes"

  - name: Client
    description: "Project sponsor. Publishes projects, configures prize tiers and stages, signs copyright transfers as the CLIENT slot, and may participate in FINAL review when configured."
    identity: entity_backed:Client
    exclusive_operations:
      - "POST /projects"
      - "POST /projects/{id}/prize-tiers"
      - "POST /projects/{id}/review-stages"
      - "POST /projects/{id}/submit-for-review"
    shared_operations:
      - "POST /projects/{id}/cancel (only while ON_SHELF, owner only)"
      - "POST /copyright-transfers/{id}/sign (only on CLIENT slot of own project)"
      - "POST /review-assignments/{id}/submit-scores (only for FINAL stage of own project where client_participates_final=true)"
      - "POST /disputes (filer_kind=CLIENT, filer_id=self)"
      - "POST /disputes/{id}/withdraw (only own filings)"
      - "POST /disputes/{id}/request-arbitration"
      - "GET /projects/*, GET /submissions/*, GET /copyright-transfers (own project only), GET /prize-payments (own project only)"

  - name: Designer
    description: "Crowdsource designer. Submits work, signs copyright transfers as DESIGNER slot, files disputes."
    identity: entity_backed:Designer
    exclusive_operations:
      - "POST /projects/{id}/submissions (own designer_id only)"
      - "PATCH /submissions/{id} (own submissions only)"
      - "DELETE /submissions/{id} (own submissions only)"
    shared_operations:
      - "POST /copyright-transfers/{id}/sign (only on DESIGNER slot of own submission)"
      - "POST /disputes (filer_kind=DESIGNER, filer_id=self)"
      - "POST /disputes/{id}/withdraw"
      - "POST /disputes/{id}/request-arbitration"
      - "GET /projects (public), GET /submissions/{id} (own only pre-AWARDED), GET /prize-payments (own only), GET /copyright-transfers (own only)"

  - name: Reviewer
    description: "Reviewer pool member. Scores assigned submissions under anonymity; files SCORING_FAIRNESS disputes when applicable."
    identity: entity_backed:ReviewerPool
    exclusive_operations:
      - "POST /review-assignments/{id}/submit-scores (own assignments only)"
    shared_operations:
      - "POST /disputes (filer_kind=REVIEWER, filer_id=self)"
      - "GET /review-assignments/{id} (own only), GET /submissions/{id} (only when assigned and within stage window; anonymized identity)"

# =============================================================================
# Notes for downstream skills
# =============================================================================
# - All datetime fields are ISO 8601 UTC with millisecond precision.
# - now() refers to virtual server clock, advanced only via POST /_clock/advance.
# - All currency arithmetic operates on integer cents; calc prize_withholding pins the order.
# - Anonymity: before Project.anonymity_unmasked_at, any read of Submission/ReviewAssignment by
#   Reviewer or Client returns ReviewAssignment.anonymized_alias instead of the designer_id, and
#   redacts Submission.designer_id (returned as null). After AWARDED, identities are revealed.
