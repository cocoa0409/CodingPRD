# SCAFFOLD_DIFFICULTY_DESIGN.yaml - task 2803 Venue Event-Day Staffing & Guest Services
# Test Targeting Index for SKILL.md §1.8. Every instance grounds exclusively in SCAFFOLD.yaml
# §1.1-§1.7; deleting this file must not change one declared behaviour.
#
# Conventions used by every test_recipe below:
#   * The logical clock starts at 2026-08-01T00:00:00Z; every recipe sets it explicitly first.
#   * Every mutating call carries an X-User-ID header (§1.4 priority 1). `as_user_id:` is written
#     out only where the identity is load-bearing (StaffMember ownership §1.4 priority 7, refund
#     segregation of duties §1.4 priority 8, audit-field assertions); elsewhere the test may use any
#     stable non-empty id for that role.
#   * Money is integer cents. Every numeric literal in an `assert:` line was computed by executing
#     the relevant §1.3 formula, not estimated.
#   * `expected_event_version` is always a ${var} captured from an earlier Event-returning response,
#     never a literal.

scaffold_difficulty_design:

  # =====================================================================================
  # Rule 1 - dual-variant calculations across DIFFERENT entity domains
  # =====================================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: headcount_variant_forecast_vs_historical
        grounds:
          - calculations.position_slot_required_headcount
          - calculations.event_attendance_tier
          - calculations.staffing_plan_projected_labor_cost
          - entities.StaffingPlan.fields.plan_variant
          - entities.StaffingPlan.fields.basis_attendance
          - entities.PositionSlot.fields.ratio_derived_headcount
          - entities.PositionSlot.fields.required_headcount
        distinguishing_aspect: |
          Domain: labour-capacity planning on PositionSlot/StaffingPlan. Two identical USHER slots on
          the same Event diverge purely because their owning plan's plan_variant re-selects both the
          basis attendance and the tier multiplier: FORECAST_BASED reads expected_attendance 40000
          (TIER_4, x1.45) and yields required_headcount 87, HISTORICAL_ACTUAL reads
          historical_actual_attendance 25000 (TIER_3, x1.25) and yields 47 - a delta of 40 heads and
          528194 cents of projected labour cost on byte-identical slot input.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One Event with expected_attendance 40000 and historical_actual_attendance 25000, so both variants are computable."
            - "One USHER PositionType: 2200 cents/h, attendance_ratio_per_1000 1.5, min_headcount 4."
            - "Two DRAFT StaffingPlans on that event, one per plan_variant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: GuestExperienceDirector
            - call: "POST /events"
              payload: { name: "Season Opener", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 40000, historical_actual_attendance: 25000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, min_headcount: 4, required_certifications: ["EVACUATION_PROCEDURES"], is_tip_eligible: false, is_contracted_position: false }
              as: StaffingCoordinator
              captures: { pt_usher_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_f_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "HISTORICAL_ACTUAL" }
              as: StaffingCoordinator
              captures: { plan_h_id: $.data.id }
          trigger:
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_f_id}", position_type_id: "${pt_usher_id}", zone_code: "Z100", shift_start: "2026-09-12T16:00:00Z", shift_end: "2026-09-12T22:00:00Z" }
              as: StaffingCoordinator
              captures: { slot_f_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_h_id}", position_type_id: "${pt_usher_id}", zone_code: "Z100", shift_start: "2026-09-12T16:00:00Z", shift_end: "2026-09-12T22:00:00Z" }
              as: StaffingCoordinator
              captures: { slot_h_id: $.data.id }
          assert:
            - "Event.${ev_id}.attendance_tier == TIER_4"
            - "StaffingPlan.${plan_f_id}.basis_attendance == 40000 and StaffingPlan.${plan_f_id}.basis_attendance_tier == TIER_4"
            - "StaffingPlan.${plan_h_id}.basis_attendance == 25000 and StaffingPlan.${plan_h_id}.basis_attendance_tier == TIER_3"
            - "PositionSlot.${slot_f_id}.ratio_derived_headcount == 87 and PositionSlot.${slot_f_id}.required_headcount == 87"
            - "PositionSlot.${slot_h_id}.ratio_derived_headcount == 47 and PositionSlot.${slot_h_id}.required_headcount == 47"
            - "PositionSlot.${slot_f_id}.required_headcount - PositionSlot.${slot_h_id}.required_headcount == 40"
            - "PositionSlot.${slot_f_id}.shift_minutes == 360 and PositionSlot.${slot_h_id}.shift_minutes == 360"
            - "PositionSlot.${slot_f_id}.slot_labor_cost_cents == 1148400 and PositionSlot.${slot_h_id}.slot_labor_cost_cents == 620400"
            - "StaffingPlan.${plan_f_id}.total_required_headcount == 87, accessibility_surcharge_cents == 40194 (350 bp) and projected_labor_cost_cents == 1188594"
            - "StaffingPlan.${plan_h_id}.total_required_headcount == 47, accessibility_surcharge_cents == 0 (47 < 60) and projected_labor_cost_cents == 620400"

      - name: reliability_rolling_window_vs_season_to_date
        grounds:
          - calculations.staff_member_reliability_score
          - state_machines.StaffAssignment.CHECKED_IN_to_COMPLETED
          - state_machines.StaffAssignment.SCHEDULED_to_NO_SHOW
          - state_machines.StaffMember.ACTIVE_to_PROBATION
          - entities.StaffMember.fields.reliability_score
          - entities.StaffMember.fields.season_reliability_score
        distinguishing_aspect: |
          Domain: workforce risk scoring on StaffMember - a different entity domain and a different
          metric type (integer reputation points) from the labour-cost variant above. The same six
          attendance rows produce reliability_score 81 (ROLLING_WINDOW, the 3 rows with the latest
          PositionSlot.shift_start) and season_reliability_score 34 (SEASON_TO_DATE, all six), and
          only the rolling variant gates the ACTIVE -> PROBATION demotion, so the member stays ACTIVE
          with a season score 31 points below the RELIABILITY_PROBATION_FLOOR of 65.
        test_recipe:
          setup:
            - "Clock at 2026-09-07T08:00:00Z, i.e. before every shift_start, so no CHECK_IN is late."
            - "One IN_PROGRESS Event with an ACTIVE-then-LOCKED plan carrying six single-head TICKET_TAKER slots, shift_start 2026-09-08 .. 2026-09-12."
            - "One PART_TIME_EMPLOYEE StaffMember at 2000 cents/h; the TICKET_TAKER PositionType requires no certification."
            - "Five of the six rows are already terminal: slots 6, 5 and 3 COMPLETED (never late), slots 4 and 2 NO_SHOW."
            - "Processing order keeps the rolling score at or above 65 at every step, so no PROBATION demotion interrupts the chain."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T08:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Reliability Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 20000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z101", shift_start: "2026-09-08T10:00:00Z", shift_end: "2026-09-08T12:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_1: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z101", shift_start: "2026-09-08T14:00:00Z", shift_end: "2026-09-08T16:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_2: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z101", shift_start: "2026-09-09T10:00:00Z", shift_end: "2026-09-09T12:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_3: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z101", shift_start: "2026-09-10T10:00:00Z", shift_end: "2026-09-10T12:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_4: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z101", shift_start: "2026-09-11T10:00:00Z", shift_end: "2026-09-11T12:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_5: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z101", shift_start: "2026-09-12T10:00:00Z", shift_end: "2026-09-12T12:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_6: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Mia Vance", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-03-01T00:00:00Z", hourly_rate_cents: 2000, in_backfill_pool: true }
              as: StaffingCoordinator
              captures: { sm_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_6}", staff_member_id: "${sm_id}" }
              as: StaffingCoordinator
              captures: { asg_6: $.data.id }
            - call: "POST /staff-assignments/${asg_6}/attendance"
              payload: { action: "CHECK_IN" }
              as: StaffMember
              as_user_id: "${sm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T10:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments/${asg_6}/attendance"
              payload: { action: "CHECK_OUT" }
              as: StaffMember
              as_user_id: "${sm_id}"
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_5}", staff_member_id: "${sm_id}" }
              as: StaffingCoordinator
              captures: { asg_5: $.data.id }
            - call: "POST /staff-assignments/${asg_5}/attendance"
              payload: { action: "CHECK_IN" }
              as: StaffMember
              as_user_id: "${sm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T12:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments/${asg_5}/attendance"
              payload: { action: "CHECK_OUT" }
              as: StaffMember
              as_user_id: "${sm_id}"
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_3}", staff_member_id: "${sm_id}" }
              as: StaffingCoordinator
              captures: { asg_3: $.data.id }
            - call: "POST /staff-assignments/${asg_3}/attendance"
              payload: { action: "CHECK_IN" }
              as: StaffMember
              as_user_id: "${sm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T14:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments/${asg_3}/attendance"
              payload: { action: "CHECK_OUT" }
              as: StaffMember
              as_user_id: "${sm_id}"
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_4}", staff_member_id: "${sm_id}" }
              as: StaffingCoordinator
              captures: { asg_4: $.data.id }
            - call: "POST /staff-assignments/${asg_4}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_2}", staff_member_id: "${sm_id}" }
              as: StaffingCoordinator
              captures: { asg_2: $.data.id }
            - call: "POST /staff-assignments/${asg_2}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffingCoordinator
          trigger:
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_1}", staff_member_id: "${sm_id}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id }
            - call: "POST /staff-assignments/${asg_1}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffingCoordinator
          assert:
            - "StaffMember.${sm_id}.reliability_score == 81 (rolling window = slots 6, 5, 4 -> 100 - 25*1 - 8*0 + 3*2)"
            - "StaffMember.${sm_id}.season_reliability_score == 34 (all six rows -> 100 - 25*3 - 8*0 + 3*3)"
            - "StaffMember.${sm_id}.reliability_score - StaffMember.${sm_id}.season_reliability_score == 47"
            - "StaffMember.${sm_id}.status == ACTIVE (only reliability_score gates PROBATION, and 81 >= 65)"
            - "StaffMember.${sm_id}.in_backfill_pool == true"
            - "StaffMember.${sm_id}.no_show_strikes == 3 and StaffMember.${sm_id}.completed_assignment_count == 3"
            - "reliability_score was 81 immediately after the slot-4 NO_SHOW and is still 81 after the slot-2 and slot-1 NO_SHOWs, while season_reliability_score fell 84 -> 59 -> 34"
            - "StaffAssignment.${asg_6}.late_check_in == false, worked_minutes == 120, base_pay_cents == 4000"
            - "StaffAssignment.${asg_1}.attendance_status == NO_SHOW and payout_status == VOIDED"

      - name: refund_authority_supervisor_vs_director
        grounds:
          - calculations.refund_authorized_amount
          - calculations.event_refund_budget_ledger
          - state_machines.GuestIssue.IN_PROGRESS_to_AWAITING_AUTHORIZATION
          - state_machines.GuestIssue.AWAITING_AUTHORIZATION_to_RESOLVED
          - entities.GuestIssue.fields.refund_approved_cents
          - entities.Event.fields.refund_budget_remaining_cents
          - validations[priority=8]
        distinguishing_aspect: |
          Domain: fiscal authority on GuestIssue/Event - a third entity domain, and the variant is
          selected by the acting X-User-Role rather than by stored data. On one unchanged
          refund_requested_cents of 12000 the SUPERVISOR_DECISION variant authorises 7500 and parks
          the issue in AWAITING_AUTHORIZATION, while the DIRECTOR_DECISION variant REPLACES that
          amount with 12000 and resolves the issue, moving the event ledger by the 4500 delta only
          (never by 7500 + 12000).
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:00:00Z; Event IN_PROGRESS with refund_budget_total_cents 100000."
            - "One CONTRACTED StaffMember holding a VALID CODE_OF_CONDUCT certification, assignable as the issue responder."
            - "One CRITICAL category OTHER GuestIssue, reported by u-sup-reporter, moved to IN_PROGRESS by /assign."
            - "A refund of 12000 cents filed by a different operator, u-sup-filer, so refund_status is PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:00:00Z" }
              as: GuestExperienceDirector
            - call: "POST /events"
              payload: { name: "Refund Authority Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 20000, refund_budget_total_cents: 100000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "GUEST_SERVICES_REP", display_name: "Guest Services Rep", base_hourly_rate_cents: 2400, attendance_ratio_per_1000: 0.35, min_headcount: 2, required_certifications: ["CODE_OF_CONDUCT"], is_tip_eligible: true, is_contracted_position: true }
              as: StaffingCoordinator
              captures: { pt_gsr_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_gsr_id}", zone_code: "Z102", shift_start: "2026-09-12T17:00:00Z", shift_end: "2026-09-12T23:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Rex Hall", employment_type: "CONTRACTED", seniority_date: "2023-05-01T00:00:00Z", hourly_rate_cents: 2400, in_backfill_pool: true }
              as: StaffingCoordinator
              captures: { sm_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${sm_id}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "CRITICAL", description: "Ejected from seat without cause" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-reporter"
              captures: { gi_id: $.data.id }
            - call: "POST /guest-issues/${gi_id}/assign"
              payload: { staff_member_id: "${sm_id}" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-reporter"
            - call: "POST /guest-issues/${gi_id}/refund-request"
              payload: { refund_requested_cents: 12000 }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-filer"
          trigger:
            - call: "POST /guest-issues/${gi_id}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-approver"
            - call: "POST /guest-issues/${gi_id}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestExperienceDirector
              as_user_id: "u-dir-approver"
          assert:
            - "after the supervisor decision: GuestIssue.${gi_id}.refund_approved_cents == 7500 (role cap 5000 + CRITICAL uplift 5000 bp)"
            - "after the supervisor decision: GuestIssue.${gi_id}.refund_status == PARTIALLY_APPROVED and status == AWAITING_AUTHORIZATION"
            - "after the supervisor decision: Event.${ev_id}.refund_approved_total_cents == 7500 and refund_budget_remaining_cents == 92500"
            - "after the director decision: GuestIssue.${gi_id}.refund_approved_cents == 12000 (director cap 75000; the supervisor amount is replaced, not added)"
            - "after the director decision: GuestIssue.${gi_id}.refund_status == APPROVED, status == RESOLVED, resolution_type == REFUND"
            - "after the director decision: GuestIssue.${gi_id}.refund_decided_by_user_id == u-dir-approver and resolved_at == 2026-09-12T18:00:00.000Z"
            - "after the director decision: Event.${ev_id}.refund_approved_total_cents == 12000 and refund_budget_remaining_cents == 88000 (delta 4500 applied, never 19500)"
            - "Event.${ev_id}.refund_budget_remaining_cents + Event.${ev_id}.refund_approved_total_cents == 100000 at every step"

  # =====================================================================================
  # Rule 2 - combinatorial formulas, one instance per mode (a) / (b) / (c)
  # =====================================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: refund_effective_cap_nonlinear_composition
        grounds:
          - calculations.refund_authorized_amount
          - calculations.event_refund_budget_ledger
          - state_machines.GuestIssue.IN_PROGRESS_to_AWAITING_AUTHORIZATION
          - entities.GuestIssue.fields.severity
          - entities.GuestIssue.fields.category
          - entities.Event.fields.refund_budget_remaining_cents
        distinguishing_aspect: |
          Mode (a): four inputs (acting role cap, severity uplift basis points, the SEAT_RELOCATION
          category hard cap, and the event's remaining budget) interact through a nested
          min(request, min(role_cap + uplift, category_cap), available) with a state branch keyed on
          WHICH term bound. Same supervisor, same 12000-cent request: on the OTHER issue the role cap
          binds (7500) and the issue escalates to AWAITING_AUTHORIZATION, while on the
          SEAT_RELOCATION issue the remaining budget binds (1500) and the issue stays IN_PROGRESS -
          a branch no linear cap formula can produce.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z; Event IN_PROGRESS with refund_budget_total_cents 9000."
            - "One CONTRACTED responder holding a VALID CODE_OF_CONDUCT certification."
            - "Issue X: category OTHER, severity CRITICAL, IN_PROGRESS, refund_requested_cents 12000."
            - "Issue Y: category SEAT_RELOCATION, severity CRITICAL, IN_PROGRESS, refund_requested_cents 12000."
            - "Reporter, filer and decider are three distinct X-User-IDs so segregation of duties never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestExperienceDirector
            - call: "POST /events"
              payload: { name: "Cap Composition Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 20000, refund_budget_total_cents: 9000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "GUEST_SERVICES_REP", display_name: "Guest Services Rep", base_hourly_rate_cents: 2400, attendance_ratio_per_1000: 0.35, min_headcount: 2, required_certifications: ["CODE_OF_CONDUCT"], is_tip_eligible: true, is_contracted_position: true }
              as: StaffingCoordinator
              captures: { pt_gsr_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_gsr_id}", zone_code: "Z110", shift_start: "2026-09-12T17:00:00Z", shift_end: "2026-09-12T23:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
