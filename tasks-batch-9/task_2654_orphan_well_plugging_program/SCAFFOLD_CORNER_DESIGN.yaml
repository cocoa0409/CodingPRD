# =============================================================================
# 1.9 Scaffold Corner Design - orphan-well-plugging-program
#
# Breadth probe: every testable claim the SCAFFOLD.yaml surface (1.1-1.7)
# declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml (1.8) does not already cover.
# section: / claim_type: values come from references/claim-extraction-guide.md.
# Corners already asserted by a 1.8 instance carry an excluded_because: stub
# naming that instance and no test_recipe.
#
# Logical clock: every recipe starts from the fixed 2026-08-01T00:00:00Z default
# declared on POST /_clock/set_current_utc and only moves it explicitly.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: operator_creation_returns_zero_exposure_and_version_one
        claim_type: Creation
        grounds:
          - endpoints["POST /operators"]
          - entities.Operator.fields.required_bond_cents
          - entities.Operator.fields.active_well_count
          - entities.Operator.fields.status
        distinguishing_aspect: |
          A brand-new operator with no wells must come back 201 with required_bond_cents 0,
          active_well_count 0, orphan_candidate_count 0, status ACTIVE and version 1 - the
          assurance calculation over an empty well set is 0, not null, and an operator with a
          posted bond of 0 is still ACTIVE because the deficiency test uses strict less-than.
        test_recipe:
          setup:
            - "empty database; logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 0 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response_type == object and data is the Operator object"
            - "data.name == 'Cottonwood Energy LLC' and data.region_code == 'WY'"
            - "data.financial_assurance_tier == BLANKET and data.bond_amount_cents == 0"
            - "data.status == ACTIVE"
            - "data.required_bond_cents == 0"
            - "data.active_well_count == 0 and data.orphan_candidate_count == 0"
            - "data.successor_operator_id == null, data.insolvency_declared_at == null, data.bond_forfeited_at == null"
            - "data.version == 1 and data.created_at == 2026-08-01T00:00:00.000Z"

      - name: well_creation_computed_and_system_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Well.fields.screening_score
          - entities.Well.fields.remediation_score
          - entities.Well.fields.status
          - calculations.orphan_priority_score
        distinguishing_aspect: |
          screening_score, remediation_score, idle_months, cumulative_boe_60mo, status and
          access_status are source computed/system: values supplied for them in the create payload
          are ignored and the server-computed 59.90 / 81.00 / 999 / 0 / PRODUCING /
          NO_ACCESS_REQUESTED appear instead.
        test_recipe:
          setup:
            - "one ACTIVE operator; logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0, screening_score: 99.99, remediation_score: 0.01, status: "ORPHAN_CONFIRMED", access_status: "ENTRY_ORDERED", idle_months: 1, version: 77 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "data.screening_score == 59.90 (not the supplied 99.99)"
            - "data.remediation_score == 81.00 (not the supplied 0.01)"
            - "data.status == PRODUCING (not the supplied ORPHAN_CONFIRMED)"
            - "data.access_status == NO_ACCESS_REQUESTED (not the supplied ENTRY_ORDERED)"
            - "data.idle_months == 999 (last_production_month omitted, so the well is treated as never produced)"
            - "data.cumulative_boe_60mo == 0"
            - "data.orphan_confirmed_at == null"
            - "data.version == 1 (not the supplied 77)"

      - name: well_retrieval_returns_the_stored_and_computed_state
        claim_type: Retrieval
        grounds:
          - endpoints["GET /wells/{id}"]
          - entities.Well
        distinguishing_aspect: |
          GET /wells/{id} echoes exactly what the create call computed - the same 59.90 / 81.00
          scores, the same 999 idle_months and version 1 - proving the values are persisted
          rather than recomputed differently per read.
        test_recipe:
          setup:
            - "one PRODUCING well under an ACTIVE operator; logical clock at its default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02002", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /wells/${w_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "HTTP status is 200 and response_type == object"
            - "data.id == ${w_id} and data.api_well_number == '49-001-02002'"
            - "data.operator_id == ${op_id}"
            - "data.total_depth_ft == 2500 and data.methane_scfd == 250"
            - "data.screening_score == 59.90 and data.remediation_score == 81.00"
            - "data.status == PRODUCING and data.access_status == NO_ACCESS_REQUESTED"
            - "data.version == 1"

      - name: nonexistent_path_ids_return_the_owning_entitys_not_found_error
        claim_type: Not Found
        grounds:
          - validations[priority 20]
          - errors[ERR_WELL_NOT_FOUND]
          - errors[ERR_OPERATOR_NOT_FOUND]
          - errors[ERR_FUNDING_ALLOCATION_NOT_FOUND]
        distinguishing_aspect: |
          Each of the fourteen path-addressable entities reports its OWN 404 error_id for the same
          syntactically valid but absent UUID - a shared generic ERR_NOT_FOUND would fail this.
        test_recipe:
          setup:
            - "empty database; logical clock at its default"
          setup_api_calls: []
          trigger:
            - call: "GET /operators/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e1: $.data.error_id }
            - call: "GET /wells/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e2: $.data.error_id }
            - call: "GET /orphan-determinations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e3: $.data.error_id }
            - call: "GET /site-accesses/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e4: $.data.error_id }
            - call: "GET /well-transfers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e5: $.data.error_id }
            - call: "GET /contractors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e6: $.data.error_id }
            - call: "GET /solicitations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { e7: $.data.error_id }
            - call: "GET /bids/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { e8: $.data.error_id }
            - call: "GET /unit-cost-contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { e9: $.data.error_id }
            - call: "GET /plugging-jobs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e10: $.data.error_id }
            - call: "GET /reclamation-tasks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e11: $.data.error_id }
            - call: "GET /funding-sources/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { e12: $.data.error_id }
            - call: "GET /funding-allocations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { e13: $.data.error_id }
            - call: "GET /grant-reports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { e14: $.data.error_id }
          assert:
            - "every one of the fourteen calls returns HTTP 404 with response_type == error"
            - "${e1} == ERR_OPERATOR_NOT_FOUND"
            - "${e2} == ERR_WELL_NOT_FOUND"
            - "${e3} == ERR_ORPHAN_DETERMINATION_NOT_FOUND"
            - "${e4} == ERR_SITE_ACCESS_NOT_FOUND"
            - "${e5} == ERR_WELL_TRANSFER_NOT_FOUND"
            - "${e6} == ERR_CONTRACTOR_NOT_FOUND"
            - "${e7} == ERR_SOLICITATION_NOT_FOUND"
            - "${e8} == ERR_BID_NOT_FOUND"
            - "${e9} == ERR_UNIT_COST_CONTRACT_NOT_FOUND"
            - "${e10} == ERR_PLUGGING_JOB_NOT_FOUND"
            - "${e11} == ERR_RECLAMATION_TASK_NOT_FOUND"
            - "${e12} == ERR_FUNDING_SOURCE_NOT_FOUND"
            - "${e13} == ERR_FUNDING_ALLOCATION_NOT_FOUND"
            - "${e14} == ERR_GRANT_REPORT_NOT_FOUND"

      - name: missing_required_inputs_return_invalid_request_on_every_create
        claim_type: Required Fields
        grounds:
          - validations[priority 30]
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /operators"].input
          - endpoints["POST /wells"].input
        distinguishing_aspect: |
          Every field in an endpoint's input: list without a trailing ? is mandatory: omitting
          bond_amount_cents, methane_scfd, min_technical_score or gas_mcf each returns
          ERR_INVALID_REQUEST 422 and persists nothing.
        test_recipe:
          setup:
            - "one ACTIVE operator with one PRODUCING well; logical clock at its default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02003", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /operators"
              payload: { name: "No Bond Co", region_code: "WY", financial_assurance_tier: "BLANKET" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e1: $.data.error_id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02004", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { e2: $.data.error_id }
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-07", oil_bbl: 10.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { e3: $.data.error_id }
            - call: "POST /solicitations"
              payload: { region_code: "WY", scope_description: "plugging services", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { e4: $.data.error_id }
          assert:
            - "all four calls return HTTP 422 with response_type == error"
            - "${e1} == ERR_INVALID_REQUEST (bond_amount_cents missing)"
            - "${e2} == ERR_INVALID_REQUEST (methane_scfd missing)"
            - "${e3} == ERR_INVALID_REQUEST (gas_mcf missing)"
            - "${e4} == ERR_INVALID_REQUEST (min_technical_score missing)"
            - "GET /operators returns total_count == 1 (the rejected operator was not persisted)"
            - "GET /wells returns total_count == 1 (the rejected well was not persisted)"
            - "GET /wells/${w_id}/production-records returns total_count == 0"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.SiteAccess.fields.waiting_period_days
          - entities.SiteAccess.fields.compensation_cents
          - entities.FundingSource.fields.federal_match_required_pct
          - entities.Well.fields.idle_months
        distinguishing_aspect: |
          waiting_period_days defaults by mode (30 for STATUTORY_ENTRY, 0 for AGREEMENT) so an
          AGREEMENT request's window_end_at equals its notice_sent_at, compensation_cents defaults
          to 0, and an omitted federal_match_required_pct stays null on a non-federal source.
        test_recipe:
          setup:
            - "two PRODUCING wells under one ACTIVE operator; logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02005", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02006", operator_id: "${op_id}", spud_year: 1976, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w2_id: $.data.id }
          trigger:
            - call: "POST /wells/${w1_id}/site-accesses"
              payload: { surface_owner_name: "Halvorsen Ranch", mode: "AGREEMENT" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa1_id: $.data.id }
            - call: "POST /wells/${w2_id}/site-accesses"
              payload: { surface_owner_name: "Halvorsen Ranch", mode: "STATUTORY_ENTRY" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa2_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "STATE_FUND", name: "Wyoming orphan well account", authorized_cents: 10000000, expires_at: "2027-12-31T00:00:00Z", allowable_cost_categories: ["PLUGGING"] }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_id: $.data.id }
          assert:
            - "SiteAccess.${sa1_id}.waiting_period_days == 0 and compensation_cents == 0"
            - "SiteAccess.${sa1_id}.notice_sent_at == 2026-08-01T00:00:00Z and window_end_at == 2026-08-01T00:00:00Z"
            - "SiteAccess.${sa2_id}.waiting_period_days == 30 and window_end_at == 2026-08-31T00:00:00Z"
            - "both site accesses have status == REQUESTED and legal_authority_citation == null"
            - "FundingSource.${fs_id}.federal_match_required_pct == null and bond_operator_id == null"
            - "FundingSource.${fs_id}.committed_cents == 0, disbursed_cents == 0, status == ACTIVE, reporting_required == false"
            - "Well.${w1_id}.idle_months == 999 (last_production_month omitted)"

      - name: production_record_is_immutable_with_no_version_or_updated_at
        claim_type: Immutability
        grounds:
          - entities.ProductionRecord.common_fields
          - entities.ProductionRecord.fields.boe
          - entities.ProductionRecord.fields.reported_by_user_id
        distinguishing_aspect: |
          ProductionRecord is declared common_fields: false, so its rows carry id and created_at
          only - no version and no updated_at - and the scaffold exposes no update or delete
          endpoint for them; boe and reported_by_user_id are still server-derived.
        test_recipe:
          setup:
            - "one PRODUCING well under an ACTIVE operator; logical clock at its default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02007", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0, last_production_month: "2026-06" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-07", oil_bbl: 150.0, gas_mcf: 180.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { pr_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "data.boe == 180.00 (150.0 + 180.0 / 6)"
            - "data.reported_by_user_id == 'u_insp'"
            - "data.well_id == ${w_id} and data.month == '2026-07'"
            - "data.id and data.created_at are present; data has no version field and no updated_at field"
            - "Well.${w_id}.last_production_month == '2026-07' (advanced past the stored 2026-06)"
            - "Well.${w_id}.idle_months == 1 and cumulative_boe_60mo == 180.00"

      - name: out_of_range_and_unknown_enum_values_are_rejected_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority 30]
          - entities.Operator.fields.financial_assurance_tier.constraints
          - entities.Bid.fields.technical_score
          - entities.Well.fields.api_well_number
        distinguishing_aspect: |
          Enum values outside their declared set, a negative methane_scfd, a technical_score above
          100, a limit of 0 and a duplicate api_well_number all fail the same priority-30 schema
          gate with ERR_INVALID_REQUEST 422, before any business rule runs.
        test_recipe:
          setup:
            - "one ACTIVE operator with one PRODUCING well; logical clock at its default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02008", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /operators"
              payload: { name: "Bad Tier Co", region_code: "WY", financial_assurance_tier: "PARTIAL", bond_amount_cents: 100000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e1: $.data.error_id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02009", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: -1, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { e2: $.data.error_id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02008", operator_id: "${op_id}", spud_year: 1980, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 10, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { e3: $.data.error_id }
            - call: "POST /wells/${w_id}/site-accesses"
              payload: { surface_owner_name: "Halvorsen Ranch", mode: "COURT_ORDER" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e4: $.data.error_id }
            - call: "GET /wells?limit=0"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e5: $.data.error_id }
          assert:
            - "all five calls return HTTP 422 with ERR_INVALID_REQUEST"
            - "${e1} == ERR_INVALID_REQUEST (financial_assurance_tier PARTIAL is outside {BLANKET, INDIVIDUAL})"
            - "${e2} == ERR_INVALID_REQUEST (methane_scfd may not be negative)"
            - "${e3} == ERR_INVALID_REQUEST (api_well_number 49-001-02008 already exists)"
            - "${e4} == ERR_INVALID_REQUEST (mode COURT_ORDER is outside {AGREEMENT, STATUTORY_ENTRY})"
            - "${e5} == ERR_INVALID_REQUEST (limit must be within 1..100)"
            - "GET /wells returns total_count == 1"

      - name: body_foreign_keys_must_name_existing_rows_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority 22]
          - entities.Well.fields.operator_id
          - entities.PluggingJob.fields.well_id
          - entities.PluggingJob.fields.contract_id
        distinguishing_aspect: |
          entity_topology is graph, so referential integrity is enforced on request-body foreign
          keys as well as on path ids: an absent operator_id, to_operator_id, contractor_id,
          well_id or contract_id each raises that referenced entity's own 404.
        test_recipe:
          setup:
            - "one ACTIVE operator, one PRODUCING well, one OPEN solicitation; logical clock at its default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-02010", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
