        claim_type: listing
        grounds: [response_envelope, "endpoints: GET /adnet/episodes/{id}/downloads"]
        distinguishing_aspect: "Pagination envelope is honored: limit 10 over 15 rows yields total_count 15 and has_more true; offset 10 yields 5 rows and has_more false."
