            - "e_break == ERR_STAFF_IDENTITY_MISMATCH (403)"
            - "e_out == ERR_STAFF_IDENTITY_MISMATCH (403)"
            - "StaffMember.${t2}.shift_status == OFF_SHIFT (none of the cross-identity calls mutated it)"

      - name: start_complete_require_assigned_technician
        claim_type: role_denied
