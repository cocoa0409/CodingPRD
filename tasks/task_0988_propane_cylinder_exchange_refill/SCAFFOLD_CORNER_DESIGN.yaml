  # ================================================== Calculations
  - section: calculations
    instances:
      - name: refill_charge_full_computation
        claim_type: correct_result
        grounds:
          - calculations.refill_charge
          - entities.RefillTicket.fields.hazmat_fee_cents
        distinguishing_aspect: "18.50 lbs on a site with hazmat_fee 75 and no promo: tier1 15.00*349=5235, tier2 round_half_up(3.50*299)=1047, hazmat 75, total 6357; close with exact payment yields change 0 and flips the cylinder FULL."
        test_recipe:
          setup: ["site S (hazmat_fee_cents 75, promo false) with policy; 1 EMPTY CUSTOMER cylinder WC 47.60 TW 17.00"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000, hazmat_fee_cents: 75 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-RC", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${c_id}", pre_weight_lbs: 17.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { t_id: $.data.id }
            - call: "POST /refill-tickets/${t_id}/weigh"
              payload: { measured_tare_lbs: 17.00 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /refill-tickets/${t_id}/fill"
              payload: { post_weight_lbs: 35.50 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { t_prop: $.data.propane_lbs, t_chg: $.data.propane_charge_cents, t_hz: $.data.hazmat_fee_cents, t_tot: $.data.total_cents }
            - call: "POST /refill-tickets/${t_id}/close"
              payload: { payment_cash_cents: 6357 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { t_st: $.data.status, t_chg_due: $.data.change_due_cents, t_seq: $.data.sale_seq }
            - call: "GET /cylinders/${c_id}"
              as: PlatformAdmin
              captures: { c_fill: $.data.fill_status }
          assert:
            - "propane_lbs == 18.50; propane_charge_cents == 6282; hazmat_fee_cents == 75; total_cents == 6357"
            - "close: status == CLOSED; change_due_cents == 0; sale_seq == 1; cylinder fill_status == FULL"

