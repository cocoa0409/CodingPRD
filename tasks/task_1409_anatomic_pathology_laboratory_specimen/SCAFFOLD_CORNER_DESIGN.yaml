        distinguishing_aspect: "Role-based denial: Histotech lacks the reflex-rule permission, so the create fails with ERR_FORBIDDEN (403) even with a well-formed body."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
