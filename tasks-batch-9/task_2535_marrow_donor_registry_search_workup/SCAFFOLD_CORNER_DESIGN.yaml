            - "all three ClearanceItem rows report result \"PENDING\" with resulted_at null, resulted_by_user_id null and expires_at null"
            - "the cascade-created ReimbursementClaim reports status \"PROVISIONAL\", variant_applied \"PROVISIONAL\" and finalized_at null"
            - "no entity is created in a terminal state: none of the seven rows starts in EXCLUDED, ABORTED, VOID, WITHDRAWN, FULFILLED or NO_MATCH_FOUND"

      - name: screening_pass_moves_the_candidate_from_typing_responded_to_screening_passed
        claim_type: Valid Transition
        grounds:
          - state_machines.MatchCandidate.TYPING_RESPONDED_to_SCREENING_PASSED
          - endpoints.POST_registry_match_candidates_id_screening
          - entities.MatchCandidate.fields.screening_outcome
        distinguishing_aspect: |
          The declared happy transition is exercised in isolation: the candidate is in TYPING_RESPONDED
          with a stored confirmed_score, and a PASS screening moves only the candidate's status while
          recording screening_outcome / screening_deferral_type and leaving the donor AVAILABLE, the
          search PRIMARY_ENGAGED and the typing request RESPONDED untouched.
        test_recipe:
          setup:
            - "domestic registry, donor D1, patient, search, typing request answered with the full 9/10 typing"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
