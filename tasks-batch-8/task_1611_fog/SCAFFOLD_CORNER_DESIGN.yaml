  - section: validations
    instances:
      - name: c_missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID headers is rejected 401 before role or existence checks."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /establishments"
              payload: { name: "No Auth", street_address: "17 N St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status 401"

      - name: c_escalate_before_cure_deadline_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=11]", "errors[ERR_ESCALATION_NOT_DUE]", state_machines.Violation.NOTICED_to_CITATION]
        distinguishing_aspect: "Manual escalate one day before the MAJOR cure deadline fails; escalate exactly AT the deadline succeeds (>= comparison) and sets fine_cents 50000."
        test_recipe:
          setup:
            - "LOW establishment with a NOTICED MAJOR violation created at the default clock 2026-08-01T00:00:00Z (cure_deadline 2026-08-15T00:00:00Z)"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Early Bird", street_address: "18 O St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /inspections"
              payload: { establishment_id: "${est_id}", items: [ { category: "GREASE_TRAP_MAINTENANCE", severity: "MAJOR" }, { category: "RECORD_KEEPING", severity: "MAJOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "STRUCTURAL", severity: "MINOR" }, { category: "STRUCTURAL", severity: "MINOR" }, { category: "RECORD_KEEPING", severity: "MINOR" } ] }
              as: Inspector
            - call: "GET /violations?establishment_id=${est_id}&status=NOTICED"
              as: Inspector
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /violations/${viol_id}/escalate"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /violations/${viol_id}/escalate"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "at 2026-08-14 (deadline - 1 day): error_id == ERR_ESCALATION_NOT_DUE, status stays NOTICED"
            - "at 2026-08-15T00:00:00Z (exactly the deadline): escalate succeeds, status == CITATION, fine_cents == 50000"

