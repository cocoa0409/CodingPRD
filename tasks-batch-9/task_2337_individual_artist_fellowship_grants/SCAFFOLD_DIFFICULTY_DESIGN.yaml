  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: blocking_conflict_cascades_six_levels_to_slot_and_cycle_posture
        grounds:
          - state_machines.ConflictDeclaration.DECLARED_to_BLOCKING
          - state_machines.Panelist.SEATED_to_RECUSED
          - state_machines.Review.SUBMITTED_to_INVALIDATED
          - state_machines.RecommendationSlot.PROPOSED_to_VOIDED
          - calculations.cycle_budget_posture
        distinguishing_aspect: |
          One conflict screening must propagate six levels — conflict BLOCKING, panelist
          RECUSED, that panelist's review INVALIDATED, the application's provisional score
          recomputed from 7.28 to 7.10, the panel's readiness recomputed to 92.00 with
          reopen_required set, the slot VOIDED and the cycle's posture flipped to RESTRICTED —
          and any implementation that stops at any level leaves at least one asserted field
          at its pre-screening value.
        test_recipe:
          setup:
            - "CycleMain slated: panel SLATE_SUBMITTED, one PROPOSED slot at rank 1, cycle BOARD_REVIEW"
            - "Application SCORED with provisional 7.28, final 7.30 and five SUBMITTED reviews"
            - "The conflict is SAME_INSTITUTION, so severity is DISCRETIONARY and the screening is a policy choice, not a mandatory block"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *k_panel_review
            - *k_panel
            - *k_pl1
            - *k_pl2
            - *k_pl3
            - *k_pl4
            - *k_pl5
            - *k_seat1
            - *k_seat2
            - *k_seat3
            - *k_seat4
            - *k_seat5
            - *k_charter
            - *k_round1
            - *k_rev1
            - *k_srev1
            - *k_rev2
            - *k_srev2
            - *k_rev3
            - *k_srev3
            - *k_rev4
            - *k_srev4
            - *k_rev5
            - *k_srev5
            - *k_close_round
            - *x_board_review
            - *x_get_panel
            - *x_slate
            - *x_get_slots
          trigger:
            - &c_declare1 { call: "POST /grants/conflicts", payload: { panelist_id: "${pl1}", application_id: "${app1}", relationship_type: SAME_INSTITUTION, disclosure_note: "The applicant and I both hold appointments at the lakeshore arts centre." }, as: ProgramOfficer, as_user_id: "officer-1", captures: { cf1: "$.data.id" } }
            - &c_screen1 { call: "POST /grants/conflicts/${cf1}/screen", payload: { disposition: BLOCKING }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panelists/${pl1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/reviews/${rv1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
