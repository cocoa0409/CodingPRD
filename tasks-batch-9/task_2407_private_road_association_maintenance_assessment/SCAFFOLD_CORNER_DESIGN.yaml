      - name: competitive_bid_threshold_is_inclusive_at_exactly_one_million_cents
        claim_type: threshold
        grounds:
          - calculations.lowest_responsive_bid
          - validations[priority=41]
          - errors[ERR_INSUFFICIENT_BIDS]
        distinguishing_aspect: "At exactly 1,000,000 cents the three-bid rule binds: two responsive bids give ERR_INSUFFICIENT_BIDS and a third makes the same award succeed, while a 999,999-cent award with a single responsive bid is allowed - the threshold is inclusive, not strictly greater."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one Association, one RoadSegment, two GRADING projects with disjoint windows created by rc-1 (GRADING never draws on the reserve, so the reserve gates stay out of the way)."
            - "Project A carries bonded bids of 1,000,000 (c-1) and 1,200,000 (c-2); project B carries a single bonded bid of 999,999 (c-1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RoadCommissioner
              as_user_id: "rc-1"
            - call: "POST /associations"
              payload: { name: "Copper Creek Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
