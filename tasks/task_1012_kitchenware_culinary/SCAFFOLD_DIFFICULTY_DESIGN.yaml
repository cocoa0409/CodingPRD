# =============================================================================
# Task 1012 — Kitchenware & Culinary Store
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_provisional_vs_final
        grounds:
          - calculations.order_pricing
          - state_machines.Order.RESERVED_to_FULFILLED
          - entities.Order.fields.total_cents
          - entities.Order.fields.subtotal_cents
        distinguishing_aspect: "Same order, provisional total over all lines = 27188 but final total over FULFILLED lines only = 21750 after one line is excluded at fulfillment; the two variants differ on the Order domain."
        test_recipe:
          setup:
            - "CA store (tax 0.0875), STANDARD member, skuA list 10000 (on_hand 10), skuB list 5000 (on_hand 10)"
            - "Order of A x2 + B x1: provisional subtotal 25000, tax 2188, total 27188, pending_points 250"
            - "Order paid; fulfilled excluding line B"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "SF Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_ca: $.data.id }
            - call: "POST /skus"
              payload: { name: "Dutch Oven", category: "COOKWARE", list_price_cents: 10000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_a: $.data.id }
            - call: "POST /skus"
              payload: { name: "Whisk", category: "COOKWARE", list_price_cents: 5000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_b: $.data.id }
            - call: "POST /members"
              payload: { email: "p1@x.com", full_name: "Pat One", home_store_id: "${store_ca}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store_ca}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku_a}", qty: 2 }, { sku_id: "${sku_b}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id, prov_total: $.data.total_cents, line_b: "$.data.lines[1].line_id" }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${ord}/fulfill"
              payload: { exclude_line_ids: [ "${line_b}" ] }
              as: StoreAssociate
              captures: { final_total: $.data.total_cents }
          assert:
            - "Order.${ord}.subtotal_cents == 20000"
            - "Order.${ord}.total_cents == 21750"
            - "Order.${ord}.pending_points == 250"
            - "Order.${ord}.earned_points == 200"
            - "provisional total observed at create == 27188 differs from final total 21750"

      - name: loyalty_points_pending_vs_earned
        grounds:
          - calculations.loyalty_points_accrual
          - state_machines.Order.RESERVED_to_FULFILLED
          - entities.Member.fields.pending_points
          - entities.Member.fields.earned_points
        distinguishing_aspect: "On the Member domain, Member.pending_points accrues 400 over all lines at creation but Member.earned_points posts only 300 over the FULFILLED line at fulfillment (excluded line dropped)."
        test_recipe:
          setup:
            - "OR store (tax 0), STANDARD member, skuA list 30000, skuB list 10000"
            - "Order A x1 + B x1: pending 400 (300+100). Fulfilled excluding B -> earned 300"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "PDX Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store_or: $.data.id }
            - call: "POST /skus"
              payload: { name: "Stand Mixer", category: "APPLIANCE", list_price_cents: 30000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku_a: $.data.id }
            - call: "POST /skus"
              payload: { name: "Kettle", category: "COFFEE", list_price_cents: 10000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku_b: $.data.id }
            - call: "POST /members"
              payload: { email: "p2@x.com", full_name: "Pat Two", home_store_id: "${store_or}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store_or}", fulfillment_type: "SHIP_FROM_STORE", lines: [ { sku_id: "${sku_a}", qty: 1 }, { sku_id: "${sku_b}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id, line_b: "$.data.lines[1].line_id" }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${ord}/fulfill"
              payload: { exclude_line_ids: [ "${line_b}" ] }
              as: StoreAssociate
          assert:
            - "Member.${mem}.pending_points == 0"
            - "Member.${mem}.earned_points == 300"
            - "Order.${ord}.pending_points == 400 diverges from Order.${ord}.earned_points == 300"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: order_total_tiered_discount_cap
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.tier_discount_cents
          - entities.Member.fields.tier
        distinguishing_aspect: "Mode (a): tier_discount = min(round(subtotal*0.05)=25000, DISCOUNT_CAP_CENTS=20000) = 20000; the min-cap and tier/state branches interact non-linearly across >=3 inputs so the discount is 20000, not 25000."
        test_recipe:
          setup:
            - "OR store (tax 0). Member first fulfills a 50000 order -> annual_spend 50000 -> SILVER"
            - "Second order subtotal 500000 at SILVER: raw 5% = 25000 exceeds cap 20000 -> discount 20000, total 480000"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "OR Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store_or: $.data.id }
            - call: "POST /skus"
              payload: { name: "Copper Set", category: "COOKWARE", list_price_cents: 50000, on_hand_qty: 20 }
              as: PlatformAdmin
              captures: { sku_big: $.data.id }
            - call: "POST /members"
              payload: { email: "p3@x.com", full_name: "Pat Three", home_store_id: "${store_or}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store_or}", fulfillment_type: "IN_STORE", lines: [ { sku_id: "${sku_big}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord1: $.data.id }
            - call: "POST /orders/${ord1}/pay"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${ord1}/fulfill"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store_or}", fulfillment_type: "IN_STORE", lines: [ { sku_id: "${sku_big}", qty: 10 } ] }
              as: PlatformAdmin
              captures: { ord2: $.data.id }
          assert:
            - "Order.${ord2}.tier_at_pricing == SILVER"
            - "Order.${ord2}.subtotal_cents == 500000"
            - "Order.${ord2}.tier_discount_cents == 20000"
            - "Order.${ord2}.total_cents == 480000"

      - name: loyalty_points_per_line_rounding
        grounds:
          - calculations.loyalty_points_accrual
          - entities.Order.fields.pending_points
        distinguishing_aspect: "Mode (b): round-per-line-then-sum is pinned: round(10.5)=11 + round(20.5)=21 = 32, whereas sum-then-round would give round(31.0)=31; the pinned order yields 32."
        test_recipe:
          setup:
            - "CA store, STANDARD member, skuX list 1050, skuY list 2050"
            - "Order X x1 + Y x1: per-line points 11 + 21 = 32"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "LA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_ca: $.data.id }
            - call: "POST /skus"
              payload: { name: "Paring Knife", category: "KNIVES", list_price_cents: 1050, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku_x: $.data.id }
            - call: "POST /skus"
              payload: { name: "Peeler", category: "KNIVES", list_price_cents: 2050, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku_y: $.data.id }
            - call: "POST /members"
              payload: { email: "p4@x.com", full_name: "Pat Four", home_store_id: "${store_ca}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store_ca}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku_x}", qty: 1 }, { sku_id: "${sku_y}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
          assert:
            - "Order.${ord}.subtotal_cents == 3100"
            - "Order.${ord}.pending_points == 32"
            - "pending_points 32 (round-per-line) differs from 31 (sum-then-round)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_fulfillment
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.RESERVED_to_FULFILLED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "Order carries two independent axes: paying advances payment_status UNPAID->PAID while fulfillment_status stays RESERVED; fulfilling then advances fulfillment_status RESERVED->FULFILLED while payment_status stays PAID."
        test_recipe:
          setup:
            - "OPEN store, member, sku on_hand 5; order created (UNPAID, RESERVED)"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Par Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Skillet", category: "COOKWARE", list_price_cents: 8000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "p5@x.com", full_name: "Pat Five", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
          assert:
            - "after pay: Order.${ord}.payment_status == PAID and fulfillment_status == RESERVED"
            - "after fulfill: Order.${ord}.payment_status == PAID and fulfillment_status == FULFILLED"

      - name: special_order_quote_revision_cycle
        grounds:
          - state_machines.SpecialOrder.QUOTED_to_REVISION_REQUESTED
          - state_machines.SpecialOrder.REVISION_REQUESTED_to_QUOTED
          - entities.SpecialOrder.fields.quote_revision
          - concurrency_rules[special-order-quote-supersede]
        distinguishing_aspect: "SpecialOrder cycles QUOTED->REVISION_REQUESTED->QUOTED: after re-quoting a revision-requested order it returns to QUOTED with quote_revision incremented to 2 and version advanced to 4."
        test_recipe:
          setup:
            - "member, store, special order created DRAFT version 1"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SO Store", state_code: "NY" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /members"
              payload: { email: "p6@x.com", full_name: "Pat Six", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /special-orders"
              payload: { member_id: "${mem}", store_id: "${store}", description: "Monogrammed knife block", estimated_cost_cents: 40000 }
              as: PlatformAdmin
              captures: { so: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /special-orders/${so}/quote"
              payload: { expected_special_order_version: "${v0}", quoted_total_cents: 42000, deposit_cents: 10000 }
              as: StoreAssociate
              captures: { v1: $.data.version }
            - call: "POST /special-orders/${so}/request-revision"
              payload: {}
              as: Member
              as_user_id: "${mem}"
              captures: { v2: $.data.version }
            - call: "POST /special-orders/${so}/quote"
              payload: { expected_special_order_version: "${v2}", quoted_total_cents: 39000, deposit_cents: 9000 }
              as: StoreAssociate
              captures: { v3: $.data.version }
          assert:
            - "SpecialOrder.${so}.status == QUOTED"
            - "SpecialOrder.${so}.quote_revision == 2"
            - "SpecialOrder.${so}.version == 4"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: return_approve_line_points_tier
        grounds:
          - state_machines.Return.REQUESTED_to_APPROVED
          - calculations.return_refund
          - calculations.annual_spend
          - calculations.member_tier
          - entities.Member.fields.tier
        distinguishing_aspect: "Depth-3 chain: approve -> target line becomes RETURNED (link1) -> that RETURNED line reverses Member.annual_spend_cents to 0 and earned_points to 0 (link2, caused by link1) -> the spend drop recomputes Member.tier SILVER->STANDARD (link3, caused by link2)."
        test_recipe:
          setup:
            - "OR store, member, skuP list 50000 on_hand 3; order fulfilled -> earned 500, annual_spend 50000, tier SILVER, on_hand 2"
            - "Return requested full (qty 1, WALLET)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Casc Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Espresso Machine", category: "COFFEE", list_price_cents: 50000, on_hand_qty: 3 }
              as: PlatformAdmin
              captures: { sku_p: $.data.id }
            - call: "POST /members"
              payload: { email: "p7@x.com", full_name: "Pat Seven", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku_p}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id, line_p: "$.data.lines[0].line_id" }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
            - call: "POST /returns"
              payload: { order_id: "${ord}", member_id: "${mem}", line_id: "${line_p}", return_qty: 1, reason: "DEFECTIVE", refund_destination: "WALLET" }
              as: StoreAssociate
              captures: { ret: $.data.id }
          trigger:
            - call: "POST /returns/${ret}/approve"
              payload: {}
              as: StoreAssociate
          assert:
            - "Return.${ret}.refund_amount_cents == 50000"
            - "Return.${ret}.points_reversed == 500"
            - "Member.${mem}.earned_points == 0"
            - "Member.${mem}.annual_spend_cents == 0"
            - "Member.${mem}.tier == STANDARD"
            - "Member.${mem}.wallet_credit_cents == 50000"
            - "Sku.${sku_p}.on_hand_qty == 3"

      - name: order_cancel_line_inventory
        grounds:
          - state_machines.Order.RESERVED_to_CANCELED
          - calculations.sku_inventory
          - entities.Sku.fields.reserved_qty
          - entities.Sku.fields.available_qty
        distinguishing_aspect: "Depth-2 chain from a different trigger (order cancel): cancel -> each RESERVED line becomes VOID (link1) -> each VOID line releases sku.reserved_qty back to 0 and recomputes available_qty to 10 (link2, caused by link1)."
        test_recipe:
          setup:
            - "OPEN store, member, skuI list 10000 on_hand 10; order of 3 units reserved (reserved 3, available 7)"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Inv Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Sheet Pan", category: "COOKWARE", list_price_cents: 10000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_i: $.data.id }
            - call: "POST /members"
              payload: { email: "p8@x.com", full_name: "Pat Eight", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku_i}", qty: 3 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/cancel"
              payload: {}
              as: StoreAssociate
          assert:
            - "Order.${ord}.fulfillment_status == CANCELED"
            - "Sku.${sku_i}.reserved_qty == 0"
            - "Sku.${sku_i}.available_qty == 10"
            - "Sku.${sku_i}.on_hand_qty == 10"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: return_state_over_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_LINE_ALREADY_RETURNED]
          - errors[ERR_REFUND_EXCEEDS_PAID]
        distinguishing_aspect: "A second approve on an already-RETURNED line violates both the state check (priority 6, ERR_LINE_ALREADY_RETURNED) and the fiscal check (priority 9, ERR_REFUND_EXCEEDS_PAID); the lower-numbered state check wins so the error is ERR_LINE_ALREADY_RETURNED."
        test_recipe:
          setup:
            - "OR store, member, skuR list 50000 on_hand 5; order qty1 fulfilled"
            - "Two returns REQUESTED on the same line; the first is approved so the line is RETURNED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Conf Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Grinder", category: "COFFEE", list_price_cents: 50000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku_r: $.data.id }
            - call: "POST /members"
              payload: { email: "p9@x.com", full_name: "Pat Nine", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku_r}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id, line_r: "$.data.lines[0].line_id" }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
            - call: "POST /returns"
              payload: { order_id: "${ord}", member_id: "${mem}", line_id: "${line_r}", return_qty: 1, reason: "DEFECTIVE", refund_destination: "WALLET" }
              as: StoreAssociate
              captures: { ret1: $.data.id }
            - call: "POST /returns"
              payload: { order_id: "${ord}", member_id: "${mem}", line_id: "${line_r}", return_qty: 1, reason: "UNWANTED", refund_destination: "WALLET" }
              as: StoreAssociate
              captures: { ret2: $.data.id }
            - call: "POST /returns/${ret1}/approve"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /returns/${ret2}/approve"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LINE_ALREADY_RETURNED"
            - "http status == 409 (state check wins over fiscal ERR_REFUND_EXCEEDS_PAID)"

      - name: registration_temporal_over_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_REGISTRATION_CLOSED]
          - errors[ERR_CLASS_FULL]
        distinguishing_aspect: "Registering into a class that is both full (priority 8, ERR_CLASS_FULL) and already past start_at (priority 7, ERR_REGISTRATION_CLOSED) returns the lower-numbered temporal error ERR_REGISTRATION_CLOSED, a different category pair than the state-vs-fiscal conflict."
        test_recipe:
          setup:
            - "store; capacity-1 class starting 2026-07-10T10:00Z, opened; member1 booked (registered_count 1 == capacity)"
            - "clock advanced to 2026-07-11 (past start_at)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Cls Store", state_code: "NY" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /members"
              payload: { email: "c1@x.com", full_name: "Cook One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "c2@x.com", full_name: "Cook Two", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { m2: $.data.id }
            - call: "POST /cooking-classes"
              payload: { store_id: "${store}", title: "Knife Skills", station: "DEMO_KITCHEN", start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T12:00:00Z", capacity: 1, price_cents: 6000 }
              as: StoreAssociate
              captures: { cls: $.data.id }
            - call: "POST /cooking-classes/${cls}/open"
              payload: {}
              as: StoreAssociate
            - call: "POST /class-registrations"
              payload: { class_id: "${cls}", member_id: "${m1}" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /class-registrations"
              payload: { class_id: "${cls}", member_id: "${m2}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REGISTRATION_CLOSED"
            - "http status == 422 (temporal check wins over constraint ERR_CLASS_FULL)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: member_tier_silver_threshold
        grounds:
          - calculations.member_tier
          - calculations.annual_spend
          - entities.Member.fields.tier
        distinguishing_aspect: "annual_spend_cents of exactly 50000 crosses to SILVER because the bound is inclusive (>=); at 49999 the member would stay STANDARD. Reached through POST /orders/{id}/fulfill."
        test_recipe:
          setup:
            - "OR store, STANDARD member, skuT list 50000 on_hand 3; order qty1 paid"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Thr Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Range", category: "APPLIANCE", list_price_cents: 50000, on_hand_qty: 3 }
              as: PlatformAdmin
              captures: { sku_t: $.data.id }
            - call: "POST /members"
              payload: { email: "t1@x.com", full_name: "Thr One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "IN_STORE", lines: [ { sku_id: "${sku_t}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
          assert:
            - "Member.${mem}.annual_spend_cents == 50000"
            - "Member.${mem}.tier == SILVER"

      - name: class_capacity_full_boundary
        grounds:
          - calculations.class_registered_count
          - errors[ERR_CLASS_FULL]
          - entities.CookingClass.fields.capacity
        distinguishing_aspect: "At registered_count == capacity (2) zero seats remain, so the (capacity+1)th registration on POST /class-registrations returns 409 ERR_CLASS_FULL; a collection-count boundary on a different endpoint than the numeric tier threshold."
        test_recipe:
          setup:
            - "store; capacity-2 class opened; two members booked (registered_count 2)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Cap Store", state_code: "NY" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /members"
              payload: { email: "k1@x.com", full_name: "Cap One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "k2@x.com", full_name: "Cap Two", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { m2: $.data.id }
            - call: "POST /members"
              payload: { email: "k3@x.com", full_name: "Cap Three", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { m3: $.data.id }
            - call: "POST /cooking-classes"
              payload: { store_id: "${store}", title: "Pasta Night", station: "HEARTH_BAR", start_at: "2026-07-20T18:00:00Z", end_at: "2026-07-20T20:00:00Z", capacity: 2, price_cents: 7000 }
              as: StoreAssociate
              captures: { cls: $.data.id }
            - call: "POST /cooking-classes/${cls}/open"
              payload: {}
              as: StoreAssociate
            - call: "POST /class-registrations"
              payload: { class_id: "${cls}", member_id: "${m1}" }
              as: PlatformAdmin
            - call: "POST /class-registrations"
              payload: { class_id: "${cls}", member_id: "${m2}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /class-registrations"
              payload: { class_id: "${cls}", member_id: "${m3}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CLASS_FULL"
            - "CookingClass.${cls}.registered_count == 2 (== capacity, zero seats remaining)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: return_requires_order_fulfilled
        grounds:
          - state_machines.Return.null_to_REQUESTED
          - errors[ERR_ORDER_NOT_FULFILLED]
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "A Return can only be created when its Order.fulfillment_status == FULFILLED; a paid-but-RESERVED order rejects return creation with ERR_ORDER_NOT_FULFILLED (Return depends on Order state)."
        test_recipe:
          setup:
            - "OR store, member, skuF on_hand 5; order qty1 paid but NOT fulfilled (RESERVED)"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Dep Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Board", category: "TABLETOP", list_price_cents: 10000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku_f: $.data.id }
            - call: "POST /members"
              payload: { email: "d1@x.com", full_name: "Dep One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku_f}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id, line_f: "$.data.lines[0].line_id" }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${ord}", member_id: "${mem}", line_id: "${line_f}", return_qty: 1, reason: "UNWANTED", refund_destination: "WALLET" }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_FULFILLED"

      - name: fulfill_requires_store_open
        grounds:
          - state_machines.Order.RESERVED_to_FULFILLED
          - errors[ERR_STORE_CLOSED]
          - entities.Store.fields.status
        distinguishing_aspect: "An Order can only be fulfilled when its Store.status == OPEN; a paid order at a CLOSED store rejects fulfill with ERR_STORE_CLOSED (Order depends on Store state, a different entity pair than Return->Order)."
        test_recipe:
          setup:
            - "CLOSED store, member, sku on_hand 5; order qty1 paid"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Shut Store", state_code: "OR", status: "CLOSED" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Tongs", category: "COOKWARE", list_price_cents: 4000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "s1@x.com", full_name: "Shut One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STORE_CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: class_station_halfopen_overlap
        grounds:
          - state_machines.CookingClass.null_to_DRAFT
          - errors[ERR_CLASS_STATION_CONFLICT]
          - entities.CookingClass.fields.station
        distinguishing_aspect: "Class scheduling uses half-open [start,end): a 11:00-13:00 class overlapping an existing 10:00-12:00 class on the same store+station is rejected (ERR_CLASS_STATION_CONFLICT), but an adjacent 12:00-14:00 class starting exactly at the prior end is accepted."
        test_recipe:
          setup:
            - "store S; class1 DEMO_KITCHEN 2026-07-10T10:00-12:00 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Ovl Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /cooking-classes"
              payload: { store_id: "${store}", title: "Class 1", station: "DEMO_KITCHEN", start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T12:00:00Z", capacity: 8, price_cents: 5000 }
              as: StoreAssociate
              captures: { cls1: $.data.id }
          trigger:
            - call: "POST /cooking-classes"
              payload: { store_id: "${store}", title: "Class 2 overlap", station: "DEMO_KITCHEN", start_at: "2026-07-10T11:00:00Z", end_at: "2026-07-10T13:00:00Z", capacity: 8, price_cents: 5000 }
              as: StoreAssociate
              captures: { err: $.data.error_id }
            - call: "POST /cooking-classes"
              payload: { store_id: "${store}", title: "Class 3 adjacent", station: "DEMO_KITCHEN", start_at: "2026-07-10T12:00:00Z", end_at: "2026-07-10T14:00:00Z", capacity: 8, price_cents: 5000 }
              as: StoreAssociate
              captures: { cls3: $.data.id }
          assert:
            - "class 2 create response error_id == ERR_CLASS_STATION_CONFLICT"
            - "class 3 (adjacent, start == prior end) is created 201 with status == DRAFT"

      - name: service_bar_buffer_conflict
        grounds:
          - state_machines.ServiceTicket.null_to_SCHEDULED
          - errors[ERR_SERVICE_SLOT_CONFLICT]
          - entities.ServiceTicket.fields.service_type
        distinguishing_aspect: "Service tickets use closed intervals padded by SERVICE_BUFFER_MINUTES=30: a 09:45-10:15 ticket only 15 min after a 09:00-09:30 ticket conflicts (ERR_SERVICE_SLOT_CONFLICT) even without overlap, while a 10:00-10:30 ticket exactly 30 min later is accepted — different interval semantics than the class half-open rule."
        test_recipe:
          setup:
            - "store S; ticket1 KNIFE_SHARPENING 2026-07-11T09:00-09:30 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Bar Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /service-tickets"
              payload: { store_id: "${store}", service_type: "KNIFE_SHARPENING", start_at: "2026-07-11T09:00:00Z", end_at: "2026-07-11T09:30:00Z", price_cents: 1500 }
              as: StoreAssociate
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /service-tickets"
              payload: { store_id: "${store}", service_type: "KNIFE_SHARPENING", start_at: "2026-07-11T09:45:00Z", end_at: "2026-07-11T10:15:00Z", price_cents: 1500 }
              as: StoreAssociate
              captures: { err: $.data.error_id }
            - call: "POST /service-tickets"
              payload: { store_id: "${store}", service_type: "KNIFE_SHARPENING", start_at: "2026-07-11T10:00:00Z", end_at: "2026-07-11T10:30:00Z", price_cents: 1500 }
              as: StoreAssociate
              captures: { t3: $.data.id }
          assert:
            - "ticket 2 (15-min gap) create response error_id == ERR_SERVICE_SLOT_CONFLICT"
            - "ticket 3 (30-min gap) is created 201 with status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: loyalty_points_conservation_fulfill_return
        grounds:
          - state_machines.Order.RESERVED_to_FULFILLED
          - state_machines.Return.REQUESTED_to_APPROVED
          - calculations.loyalty_points_accrual
          - calculations.return_refund
          - entities.Member.fields.earned_points
        distinguishing_aspect: "Conserved quantity Member.earned_points: fulfillment posts +300 and a full return reverses exactly -300, leaving earned_points == 0 (its pre-fulfillment value); no point drift remains."
        test_recipe:
          setup:
            - "OR store, member, skuC list 30000 on_hand 5; order qty1 fulfilled -> earned_points 300"
            - "full return requested (qty1, WALLET)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Pts Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Blender", category: "APPLIANCE", list_price_cents: 30000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku_c: $.data.id }
            - call: "POST /members"
              payload: { email: "pc1@x.com", full_name: "Pts One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku_c}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id, line_c: "$.data.lines[0].line_id" }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
            - call: "POST /returns"
              payload: { order_id: "${ord}", member_id: "${mem}", line_id: "${line_c}", return_qty: 1, reason: "DEFECTIVE", refund_destination: "WALLET" }
              as: StoreAssociate
              captures: { ret: $.data.id }
          trigger:
            - call: "POST /returns/${ret}/approve"
              payload: {}
              as: StoreAssociate
          assert:
            - "Return.${ret}.points_reversed == 300"
            - "Member.${mem}.earned_points == 0"

      - name: inventory_units_conservation_reserve_cancel
        grounds:
          - state_machines.Order.RESERVED_to_CANCELED
          - calculations.sku_inventory
          - entities.Sku.fields.on_hand_qty
          - entities.Sku.fields.reserved_qty
        distinguishing_aspect: "Conserved quantity physical units: reserving 5 moves units available->reserved with on_hand_qty unchanged at 8, and cancel moves them back, so available_qty+reserved_qty==on_hand_qty==8 holds before and after with reserved_qty returning to 0 — a different conserved quantity than loyalty points."
        test_recipe:
          setup:
            - "OPEN store, member, skuV list 10000 on_hand 8; order of 5 units reserved (reserved 5, available 3)"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Con Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Ramekin", category: "TABLETOP", list_price_cents: 10000, on_hand_qty: 8 }
              as: PlatformAdmin
              captures: { sku_v: $.data.id }
            - call: "POST /members"
              payload: { email: "cv1@x.com", full_name: "Con One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku_v}", qty: 5 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/cancel"
              payload: {}
              as: StoreAssociate
          assert:
            - "Sku.${sku_v}.on_hand_qty == 8"
            - "Sku.${sku_v}.reserved_qty == 0"
            - "Sku.${sku_v}.available_qty == 8"
