            - "the same cancel issued as ClearingMember is refused with ERR_UNAUTHORIZED, since cancelling a LOCKED_IN trade is PlatformAdmin-only"

      - name: net_position_fund_mark_to_market_only_recomputes_mark
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/clearing/net-positions/{id}/fund
          - calculations.fail_mark_to_market
          - entities.NetPosition.fields.mark_to_market_cents
        distinguishing_aspect: "The mark_to_market_only flag changes the action's meaning: it recomputes mark_to_market_cents without incrementing funded_amount_cents."
        test_recipe:
          setup:
