        distinguishing_aspect: "With zero physicians the eligible pool is empty for every slot: all slots stay OPEN and each gets a GENERATION_SHORTFALL gap; generation still succeeds."
        test_recipe:
          setup: ["program 2026-09-08..2026-09-09, 1 weekday primary per day; no physicians exist"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Empty", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-09", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
