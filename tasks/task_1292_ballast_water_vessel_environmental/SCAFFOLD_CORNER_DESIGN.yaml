          setup:
            - "Vessel with APPROVED plan; voyage A V9801 departed, arrived_at 2026-08-10 (report due 2026-08-09T00:00:00Z); voyage B V9802 created with arrived_at 2026-08-03 (report due 2026-08-02T00:00:00Z)"
            - "2026-08-09T00:00:01Z: A OVERDUE -> MINOR A (due 2026-09-08T00:00:01Z); 2026-09-15T00:00:02Z: MINOR A ESCALATED -> case ACTIVE, posture RESTRICTED"
