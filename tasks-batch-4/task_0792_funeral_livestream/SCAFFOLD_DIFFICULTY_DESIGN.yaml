# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules × 2 instances = 18 instances. All grounds resolve into SCAFFOLD.yaml.
# Setup runs as PlatformAdmin (opaque, override authority) except where a guest
# or role-specific actor is under test; OCC version inputs are always ${var}.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: service_cost_estimated_vs_final_diverges
        grounds:
          - calculations.service_billing
          - entities.ServiceOrder.fields.estimated_cost_cents
          - entities.ServiceOrder.fields.final_invoice_cents
          - state_machines.ServiceOrder.DRAFT_to_SCHEDULED
          - state_machines.ServiceOrder.UNBILLED_to_INVOICED
        distinguishing_aspect: "On a ServiceOrder, estimated_cost_cents (scheduled 120-min duration) is 25000 while final_invoice_cents (actual 150-min duration) is 28000 — same order, two variants, different numbers."
        test_recipe:
          setup:
            - "FuneralHome with 1 stream credit; a Venue; a ServiceOrder camera_count=2, priority_support=false, scheduled 10:00-12:00 (120 min); booking CONFIRMED; stream READY; order SCHEDULED (estimated computed)."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Chapel", contact_email: "rose@x.com", initial_credits: 1 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Main Hall", capacity: 120, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "J Doe", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T12:00:00Z", camera_count: 2, priority_support: false }
              as: PlatformAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T12:00:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { booking_id: $.data.id }
            - call: "POST /venue-bookings/${booking_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SET_STREAM_READY" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SCHEDULE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "GO_LIVE" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:35:00Z" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "END" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "INVOICE" }
              as: PlatformAdmin
          assert:
            - "ServiceOrder.${order_id}.estimated_cost_cents == 25000"
            - "ServiceOrder.${order_id}.final_invoice_cents == 28000"
            - "ServiceOrder.${order_id}.estimated_cost_cents != ServiceOrder.${order_id}.final_invoice_cents"

      - name: donation_pledged_gross_vs_settled_net_diverges
        grounds:
          - calculations.donation_ledger
          - entities.FuneralHome.fields.donations_pledged_cents
          - entities.FuneralHome.fields.donations_net_cents
          - state_machines.Donation.PLEDGED_to_SETTLED
        distinguishing_aspect: "On the FuneralHome ledger (different domain than ServiceOrder cost), donations_pledged_cents is 4050 (gross over PLEDGED+SETTLED) while donations_net_cents is 3387 (net over SETTLED only)."
        test_recipe:
          setup:
            - "A FuneralHome, an order with PUBLISHED memorial page; two settled donations (gross 1000, 2550) and one still-pledged donation (gross 500)."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Elm Home", contact_email: "elm@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Elm Hall", capacity: 80, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "M Roe", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "PUBLISH_MEMORIAL" }
              as: PlatformAdmin
            - call: "POST /donations"
              payload: { order_id: "${order_id}", donor_name: "D1", gross_amount_cents: 1000 }
              as: Guest
              captures: { d1: $.data.id }
            - call: "POST /donations"
              payload: { order_id: "${order_id}", donor_name: "D2", gross_amount_cents: 2550 }
              as: Guest
              captures: { d2: $.data.id }
            - call: "POST /donations"
              payload: { order_id: "${order_id}", donor_name: "D3", gross_amount_cents: 500 }
              as: Guest
              captures: { d3: $.data.id }
            - call: "POST /donations/${d1}/transitions"
              payload: { action: "SETTLE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /donations/${d2}/transitions"
              payload: { action: "SETTLE" }
              as: PlatformAdmin
          assert:
            - "FuneralHome.${home_id}.donations_pledged_cents == 4050"
            - "FuneralHome.${home_id}.donations_net_cents == 3387"
            - "FuneralHome.${home_id}.donations_pledged_cents != FuneralHome.${home_id}.donations_net_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: final_invoice_tiered_overage_with_priority_surcharge
        grounds:
          - calculations.service_billing
          - entities.ServiceOrder.fields.final_invoice_cents
          - entities.ServiceOrder.fields.camera_count
          - entities.ServiceOrder.fields.priority_support
        distinguishing_aspect: "Mode (a): final_invoice_cents = 15000 + 5000*2 cameras + 60*100 tier1 + 15*150 tier2 + 10000 priority = 43250, a ≥3-input non-linear formula with two-tier overage selection and a conditional surcharge."
        test_recipe:
          setup:
            - "FuneralHome 1 credit; Venue; order camera_count=2, priority_support=true; booking CONFIRMED; stream READY; SCHEDULED; broadcast run for an actual 195 minutes."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Oak Home", contact_email: "oak@x.com", initial_credits: 1 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Oak Hall", capacity: 200, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "P Vale", scheduled_start: "2026-06-03T10:00:00Z", scheduled_end: "2026-06-03T13:15:00Z", camera_count: 2, priority_support: true }
              as: PlatformAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-03T10:00:00Z", window_end: "2026-06-03T13:15:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { booking_id: $.data.id }
            - call: "POST /venue-bookings/${booking_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SET_STREAM_READY" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SCHEDULE" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "GO_LIVE" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T13:15:00Z" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "END" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "INVOICE" }
              as: PlatformAdmin
          assert:
            - "ServiceOrder.${order_id}.recording_duration_minutes == 195"
            - "ServiceOrder.${order_id}.final_invoice_cents == 43250"

      - name: donation_net_rounds_per_donation_before_summing
        grounds:
          - calculations.donation_ledger
          - entities.Donation.fields.fee_cents
          - entities.Donation.fields.net_amount_cents
          - entities.ServiceOrder.fields.donations_net_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned — fee is round_half_up per donation (59 for 1000; 104 for 2550) THEN nets summed to 3387; sum-then-round would give 3417."
        test_recipe:
          setup:
            - "A FuneralHome, an order with PUBLISHED memorial page; two pledged donations gross 1000 and 2550."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Fir Home", contact_email: "fir@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Fir Hall", capacity: 60, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "L Fenn", scheduled_start: "2026-06-04T10:00:00Z", scheduled_end: "2026-06-04T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "PUBLISH_MEMORIAL" }
              as: PlatformAdmin
            - call: "POST /donations"
              payload: { order_id: "${order_id}", donor_name: "D1", gross_amount_cents: 1000 }
              as: Guest
              captures: { d1: $.data.id }
            - call: "POST /donations"
              payload: { order_id: "${order_id}", donor_name: "D2", gross_amount_cents: 2550 }
              as: Guest
              captures: { d2: $.data.id }
            - call: "POST /donations/${d1}/transitions"
              payload: { action: "SETTLE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /donations/${d2}/transitions"
              payload: { action: "SETTLE" }
              as: PlatformAdmin
          assert:
            - "Donation.${d1}.fee_cents == 59"
            - "Donation.${d1}.net_amount_cents == 941"
            - "Donation.${d2}.fee_cents == 104"
            - "Donation.${d2}.net_amount_cents == 2446"
            - "ServiceOrder.${order_id}.donations_net_cents == 3387"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: tribute_video_revision_cycle_increments_revision_count
        grounds:
          - state_machines.TributeVideo.DRAFT_to_SUBMITTED
          - state_machines.TributeVideo.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.TributeVideo.CHANGES_REQUESTED_to_SUBMITTED
          - entities.TributeVideo.fields.revision_count
        distinguishing_aspect: "TributeVideo is cyclic: CHANGES_REQUESTED->SUBMITTED is a back-edge; after one loop status is SUBMITTED again and revision_count == 1 (a linear pipeline could never re-enter SUBMITTED)."
        test_recipe:
          setup:
            - "A FuneralHome, a Venue, an order, and a DRAFT TributeVideo."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Ash Home", contact_email: "ash@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Ash Hall", capacity: 50, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "T Ash", scheduled_start: "2026-06-05T10:00:00Z", scheduled_end: "2026-06-05T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
            - call: "POST /tribute-videos"
              payload: { order_id: "${order_id}", title: "In Memory", photo_count: 20 }
              as: PlatformAdmin
              captures: { tv_id: $.data.id }
            - call: "POST /tribute-videos/${tv_id}/transitions"
              payload: { action: "SUBMIT" }
              as: PlatformAdmin
            - call: "POST /tribute-videos/${tv_id}/transitions"
              payload: { action: "REQUEST_CHANGES" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tribute-videos/${tv_id}/transitions"
              payload: { action: "SUBMIT" }
              as: PlatformAdmin
          assert:
            - "TributeVideo.${tv_id}.status == SUBMITTED"
            - "TributeVideo.${tv_id}.revision_count == 1"

      - name: service_order_broadcast_and_settlement_axes_evolve_independently
        grounds:
          - state_machines.ServiceOrder.LIVE_to_ENDED
          - state_machines.ServiceOrder.RAW_to_EDITING
          - entities.ServiceOrder.fields.broadcast_status
          - entities.ServiceOrder.fields.settlement_status
          - entities.ServiceOrder.fields.recording_status
        distinguishing_aspect: "On a single ServiceOrder (different entity than TributeVideo) three axes hold distinct values on one row at the same observation point: broadcast_status=ENDED, recording_status=EDITING, settlement_status=UNBILLED — independent state dimensions, not one linear chain."
        test_recipe:
          setup:
            - "A schedulable order taken LIVE then ENDED (recording auto RAW), then recording advanced to EDITING while settlement is left untouched."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Bay Home", contact_email: "bay@x.com", initial_credits: 1 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Bay Hall", capacity: 90, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "N Bay", scheduled_start: "2026-06-06T10:00:00Z", scheduled_end: "2026-06-06T11:00:00Z", camera_count: 1 }
              as: PlatformAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-06T10:00:00Z", window_end: "2026-06-06T11:00:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { booking_id: $.data.id }
            - call: "POST /venue-bookings/${booking_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SET_STREAM_READY" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SCHEDULE" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "GO_LIVE" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "END" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "START_EDIT" }
              as: PlatformAdmin
          assert:
            - "ServiceOrder.${order_id}.broadcast_status == ENDED"
            - "ServiceOrder.${order_id}.recording_status == EDITING"
            - "ServiceOrder.${order_id}.settlement_status == UNBILLED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cancel_scheduled_order_cascades_booking_then_camera_release
        grounds:
          - state_machines.ServiceOrder.SCHEDULED_to_CANCELLED
          - state_machines.VenueBooking.CONFIRMED_to_RELEASED
          - state_machines.CameraAssignment.ASSIGNED_to_RELEASED
        distinguishing_aspect: "Depth-3 chain from CANCEL: order->booking (RELEASED) is caused by the cancel, and camera->RELEASED is caused by the booking's release (not directly by the cancel), so each link causes the next."
        test_recipe:
          setup:
            - "A SCHEDULED order with a CONFIRMED booking and an ASSIGNED CameraAssignment (operator ON_DUTY); home had 1 credit, now 0 after SCHEDULE."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Cyc Home", contact_email: "cyc@x.com", initial_credits: 1 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Cyc Hall", capacity: 70, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /operators"
              payload: { home_id: "${home_id}", full_name: "Op One", skill: "CAMERA" }
              as: PlatformAdmin
              captures: { op_id: $.data.id }
            - call: "POST /operators/${op_id}/duty"
              payload: { duty_status: "ON_DUTY" }
              as: PlatformAdmin
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "C Ryn", scheduled_start: "2026-06-07T10:00:00Z", scheduled_end: "2026-06-07T12:00:00Z", camera_count: 1 }
              as: PlatformAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-07T10:00:00Z", window_end: "2026-06-07T12:00:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { booking_id: $.data.id }
            - call: "POST /venue-bookings/${booking_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /camera-assignments"
              payload: { order_id: "${order_id}", operator_id: "${op_id}", role: "CAMERA" }
              as: PlatformAdmin
              captures: { cam_id: $.data.id }
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SET_STREAM_READY" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SCHEDULE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "CANCEL" }
              as: PlatformAdmin
          assert:
            - "ServiceOrder.${order_id}.broadcast_status == CANCELLED"
            - "ServiceOrder.${order_id}.settlement_status == VOID"
            - "VenueBooking.${booking_id}.status == RELEASED"
            - "CameraAssignment.${cam_id}.status == RELEASED"
            - "FuneralHome.${home_id}.stream_credit_balance == 1"

      - name: settle_donation_rolls_up_order_then_home_net
        grounds:
          - state_machines.Donation.PLEDGED_to_SETTLED
          - calculations.donation_ledger
          - entities.ServiceOrder.fields.donations_net_cents
          - entities.FuneralHome.fields.donations_net_cents
        distinguishing_aspect: "Depth-2 chain from a different trigger (SETTLE): the donation's settle recomputes ORDER.donations_net_cents (941), and that recompute bubbles to HOME.donations_net_cents (941)."
        test_recipe:
          setup:
            - "A FuneralHome, an order with PUBLISHED memorial, one PLEDGED donation gross 1000."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Dew Home", contact_email: "dew@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Dew Hall", capacity: 40, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "D Ewe", scheduled_start: "2026-06-08T10:00:00Z", scheduled_end: "2026-06-08T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "PUBLISH_MEMORIAL" }
              as: PlatformAdmin
            - call: "POST /donations"
              payload: { order_id: "${order_id}", donor_name: "D1", gross_amount_cents: 1000 }
              as: Guest
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /donations/${d1}/transitions"
              payload: { action: "SETTLE" }
              as: PlatformAdmin
          assert:
            - "Donation.${d1}.net_amount_cents == 941"
            - "ServiceOrder.${order_id}.donations_net_cents == 941"
            - "FuneralHome.${home_id}.donations_net_cents == 941"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: schedule_state_precondition_beats_credit_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.ServiceOrder.DRAFT_to_SCHEDULED
        distinguishing_aspect: "Category pair state(P6) vs business_fiscal(P11): an already-SCHEDULED order with 0 credits fails both, and the lower-priority state error ERR_ORDER_NOT_DRAFT wins over ERR_INSUFFICIENT_STREAM_CREDITS."
        test_recipe:
          setup:
            - "A schedulable order already SCHEDULED once (credit consumed to 0); a second SCHEDULE would violate both the DRAFT state check and the credit check."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Fig Home", contact_email: "fig@x.com", initial_credits: 1 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Fig Hall", capacity: 60, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "F Igg", scheduled_start: "2026-06-09T10:00:00Z", scheduled_end: "2026-06-09T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-09T10:00:00Z", window_end: "2026-06-09T11:00:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { booking_id: $.data.id }
            - call: "POST /venue-bookings/${booking_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SET_STREAM_READY" }
              as: PlatformAdmin
