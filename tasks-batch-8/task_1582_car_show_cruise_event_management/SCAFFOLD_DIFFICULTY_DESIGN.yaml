  - rule_id: non_linear_state_machine
    instances:
      - name: event_parallel_lifecycle_weather_axes
        grounds:
          - state_machines.Event
          - entities.Event.fields.lifecycle_status
          - entities.Event.fields.weather_posture
        distinguishing_aspect: |
          Event carries two independent state dimensions: while lifecycle_status stays pinned
          at REGISTRATION_OPEN, weather_posture cycles NORMAL -> WATCH -> POSTPONED -> NORMAL
          (a revert cycle), proving the weather axis evolves without disturbing the lifecycle axis.
        test_recipe:
          setup:
            - "Event published and opened; no registrations"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Axes Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
          trigger:
            - { call: "POST /events/${ev}/weather-decision", payload: { posture: "WATCH", reason: "radar cell" }, as: Organizer, captures: { p1: $.data.weather_posture } }
            - { call: "POST /events/${ev}/weather-decision", payload: { posture: "POSTPONED", reason: "hail" }, as: Organizer, captures: { p2: $.data.weather_posture } }
            - { call: "POST /events/${ev}/weather-decision", payload: { posture: "NORMAL", reason: "all clear" }, as: Organizer, captures: { p3: $.data.weather_posture } }
            - { call: "GET /events/${ev}", payload: {}, as: Organizer, captures: { life: $.data.lifecycle_status } }
          assert:
            - "weather_posture sequence: WATCH then POSTPONED then NORMAL (cycle completed)"
            - "Event.lifecycle_status == REGISTRATION_OPEN after the whole weather cycle (axes independent)"

      - name: registration_refund_denied_cycle
        grounds:
          - state_machines.Registration.REFUND_REQUESTED_to_CONFIRMED
          - state_machines.Registration.CONFIRMED_to_REFUND_REQUESTED
          - calculations.withdrawal_refund_calc
        distinguishing_aspect: |
          Registration (different entity than Event) exhibits a true cycle:
          CONFIRMED -> REFUND_REQUESTED -> (DENY) CONFIRMED -> REFUND_REQUESTED -> (APPROVE) REFUNDED,
          with withdrawn_at cleared on deny and the 100% refund (3000) applied only on approve.
        test_recipe:
          setup:
            - "Event REGISTRATION_OPEN; registrant paid 3000 (CONFIRMED); clock at 2026-08-05T00:00:00Z = 249h before gates (100% tier)"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Cycle Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "Cy", email: "cy@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Torino" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Organizer }
          trigger:
            - { call: "POST /registrations/${r1}/withdraw", payload: { reason: "first attempt" }, as: RegistrationDesk, captures: { st1: $.data.status } }
            - { call: "POST /registrations/${r1}/refund-decision", payload: { decision: "DENY", note: "registration stands" }, as: Organizer, captures: { st2: $.data.status } }
            - { call: "POST /registrations/${r1}/withdraw", payload: { reason: "second attempt" }, as: RegistrationDesk, captures: { st3: $.data.status } }
            - { call: "POST /registrations/${r1}/refund-decision", payload: { decision: "APPROVE" }, as: Organizer, captures: { st4: $.data.status } }
            - { call: "GET /registrations/${r1}/payments", payload: {}, as: Organizer }
          assert:
            - "status sequence: REFUND_REQUESTED -> CONFIRMED -> REFUND_REQUESTED -> REFUNDED (cycle traversed)"
            - "after DENY, Registration.withdrawn_at is null and no REFUND payment exists yet"
            - "after APPROVE, a REFUND payment of 3000 exists (100% of gross at 249h) and refunded_cents == 3000"

      - name: score_sheet_submit_reopen_cycle
        grounds:
          - state_machines.ScoreSheet.SUBMITTED_to_DRAFT
          - state_machines.ScoreSheet.DRAFT_to_SUBMITTED
          - entities.Judge.fields.submitted_sheet_count
        distinguishing_aspect: |
          ScoreSheet (third entity with non-linear shape) cycles DRAFT -> SUBMITTED -> DRAFT ->
          SUBMITTED via organizer reopen while the event is still JUDGING; submitted_sheet_count
          tracks the cycle (+1, -1, +1) and the event stays JUDGING because a second judge's
          pair is still outstanding.
        test_recipe:
          setup:
            - "Event JUDGING with judged class; judges J1 and J2 assigned; one CHECKED_IN registration; clock inside judging window"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Sheet Cycle", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "MUSCLE", name: "Muscle", min_year: 1950, max_year: 1975, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "JUDGED", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer, captures: { zn: $.data.id } }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "Dee", email: "dee@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${ev}", registrant_id: "${p1}", signature_name: "Dee" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
