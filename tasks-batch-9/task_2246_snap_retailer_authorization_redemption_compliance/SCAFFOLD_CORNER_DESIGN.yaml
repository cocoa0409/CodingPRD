          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - &k_store_reread
              call: "GET /stores/${store_id}"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_v2: $.data.version }
          trigger:
            - call: "POST /equipment-orders"
              payload: { store_id: "${store_id}", lines: [ { item_code: "COMMERCIAL_POS_INTEGRATION", qty: 1 }, { item_code: "RECEIPT_PAPER_CASE", qty: 1 } ] }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { order_unsub_id: $.data.id }
            - call: "PATCH /stores/${store_id}"
              payload: { expected_store_version: "${store_v2}", annual_gross_sales_cents: 600000000 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_v3: $.data.version }
            - call: "POST /equipment-orders"
              payload: { store_id: "${store_id}", lines: [ { item_code: "EBT_ONLY_WIRELESS_TERMINAL", qty: 1 }, { item_code: "SIGNAGE_PACK", qty: 1 } ] }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { order_ceiling_id: $.data.id }
          assert:
            - "EquipmentOrder.${order_unsub_id}.subtotal_cents == 189000 and subsidy_cents == 0"
            - "EquipmentOrder.${order_unsub_id}.net_equipment_cents == 189000 and handling_fee_cents == 0 and total_due_cents == 189000"
            - "Store.${store_id}.annual_gross_sales_cents == 600000000 and staple_sales_bps == 333 and criterion_b_pass == false"
            - "${store_v3} > ${store_v2}"
            - "EquipmentOrder.${order_ceiling_id}.subtotal_cents == 44700 and subsidy_cents == 0"
            - "EquipmentOrder.${order_ceiling_id}.net_equipment_cents == 44700 and handling_fee_cents == 0 and total_due_cents == 44700"

      - name: criterion_b_share_is_strictly_above_five_thousand_bps
        claim_type: Precision
        grounds:
          - calculations.criterion_b_staple_sales_share
        excluded_because:
          difficulty_instance: criterion_b_strict_boundary_at_exactly_five_thousand_bps
          rationale: "The exactly-5000 rejection and the 5001 acceptance, including the floor on the bps division, are asserted as a matched pair there."

      - name: desk_and_onsite_staple_variants_disagree_on_shallow_broad_stock
        claim_type: Correct Result
        grounds:
          - calculations.staple_criterion_a_qualification
        excluded_because:
          difficulty_instance: staple_criterion_a_desk_variety_first_vs_onsite_depth_first_divergence
          rationale: "Both variants are computed over the same inventory there, with the desk pass and the on-site failure asserted field by field."

      - name: anomaly_score_weights_three_components_with_a_single_rounding
        claim_type: Precision
        grounds:
          - calculations.redemption_anomaly_score
        excluded_because:
          difficulty_instance: redemption_anomaly_weighted_three_component_score_with_small_format_weights
          rationale: "The small-format weight set, the exact-rational components and the single round_half_up are pinned there; the FLAG_L2/FLAG_L3 boundary is pinned by anomaly_flag_l3_boundary_sixty_nine_versus_exactly_seventy."

      - name: cmp_basis_variant_selection_and_rounding_order
        claim_type: Correct Result
        grounds:
          - calculations.civil_money_penalty_amount
        excluded_because:
          difficulty_instance: cmp_basis_trailing_twelve_period_variant_selected_after_full_year
          rationale: "Variant selection by seasoning days is covered by that instance and its PEAK_3 twin, and the round-before-multiply order is covered by cmp_rounding_order_monthly_penalty_rounded_before_month_multiplier."

      - name: handling_fee_threshold_reads_the_post_subsidy_net
        claim_type: Correct Result
        grounds:
          - calculations.equipment_order_totals
        excluded_because:
          difficulty_instance: equipment_handling_fee_threshold_read_off_net_not_total
          rationale: "The 24000 -> 1500 -> 25500 case and its 25500-total trap are asserted there together with the fully subsidized zero-net case."

      - name: ineligible_tax_is_summed_before_the_rate_is_applied
        claim_type: Precision
        grounds:
          - calculations.pos_eligibility_split_tender
        excluded_because:
          difficulty_instance: pos_ineligible_tax_summed_before_rate_applied_once
          rationale: "That instance pins 214 against the per-line 213 on a multi-line ineligible bucket, which is the only case where the two orders diverge."

      - name: depot_counters_conserve_units_across_every_move
        claim_type: Correct Result
        grounds:
          - calculations.depot_unit_ledger
        excluded_because:
          difficulty_instance: depot_unit_conservation_reserve_activate_return_round_trip
          rationale: "The five-counter identity is asserted after every single move there."

      - name: committed_minutes_return_to_their_prior_value_after_a_cancel
        claim_type: Correct Result
        grounds:
          - calculations.inspector_committed_minutes
        excluded_because:
          difficulty_instance: inspector_committed_minutes_conservation_schedule_then_cancel_round_trip
          rationale: "The schedule/cancel round trip and the exact restoration of committed_minutes are asserted there."

      - name: interval_families_use_deliberately_different_endpoint_semantics
        claim_type: Correct Result
        grounds:
          - calculations.interval_overlap_rules
        excluded_because:
          difficulty_instance: inspector_half_open_window_with_travel_buffer_boundary_one_minute_apart
          rationale: "The half-open-plus-buffer visit boundary is asserted there, the closed-interval terminal touch by terminal_deployment_closed_interval_touching_endpoint_collides, and the aggregate store-slot ceiling by store_terminal_slot_aggregate_capacity_allows_equality_refuses_third."

  - section: validations
    instances:

      - name: uniqueness_rules_reject_duplicate_serial_period_index_and_second_open_application
        claim_type: Violation → Error
        grounds:
          - validations.priority_14_uniqueness
          - errors.ERR_DUPLICATE_TERMINAL_SERIAL
          - errors.ERR_DUPLICATE_PERIOD_INDEX
          - errors.ERR_APPLICATION_ALREADY_OPEN
        distinguishing_aspect: "Three independent uniqueness scopes fire from one fixture: a repeated serial on a non-RETIRED terminal, a repeated period_index for the same store even with a non-overlapping window (so the answer is ERR_DUPLICATE_PERIOD_INDEX, not ERR_REDEMPTION_PERIOD_OVERLAP), and a second application while the first is still DRAFT."
        test_recipe:
          setup:
            - "One owner, the shared store with a DRAFT application, a depot holding terminal EBT-0001 and period_index 1 covering February."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_depot
            - *k_term
            - *k_p1
          trigger:
            - call: "POST /ebt-terminals"
              payload: { depot_id: "${depot_id}", serial_number: "EBT-0001", model: "EBT_ONLY_DIAL" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { dup_serial_error_id: $.data.error_id }
            - call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 1, period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { dup_index_error_id: $.data.error_id }
            - call: "POST /applications"
              payload: { store_id: "${store_id}", expected_store_version: "${store_v}", application_type: "INITIAL", claimed_criterion: "CRITERION_A", reported_inventory_lines: *k_inv_pass }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { second_app_error_id: $.data.error_id }
          assert:
            - "all three return 409"
            - "${dup_serial_error_id} == ERR_DUPLICATE_TERMINAL_SERIAL and GET /ebt-terminals?depot_id=${depot_id} returns total_count == 1"
            - "${dup_index_error_id} == ERR_DUPLICATE_PERIOD_INDEX (not ERR_REDEMPTION_PERIOD_OVERLAP)"
            - "${second_app_error_id} == ERR_APPLICATION_ALREADY_OPEN and GET /applications?store_id=${store_id} returns total_count == 1"
            - "EquipmentDepot.${depot_id}.units_in_stock == 5"

      - name: overlapping_period_is_rejected_while_an_abutting_period_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - calculations.interval_overlap_rules
          - errors.ERR_REDEMPTION_PERIOD_OVERLAP
        distinguishing_aspect: "Monitoring periods are half-open per store: a window starting inside February's period is refused with 409 ERR_REDEMPTION_PERIOD_OVERLAP, while a window starting exactly at the previous period_end is accepted - which is how consecutive periods are chained."
        test_recipe:
          setup:
            - "One store with period_index 1 covering 2026-02-01 (inclusive) to 2026-03-01 (exclusive)."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_p1
          trigger:
            - call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 5, period_start: "2026-02-15T00:00:00Z", period_end: "2026-03-15T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { overlap_error_id: $.data.error_id }
            - call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 6, period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { abut_period_id: $.data.id }
          assert:
            - "the first attempt is 409 with ${overlap_error_id} == ERR_REDEMPTION_PERIOD_OVERLAP"
            - "the second attempt is 201 and RedemptionPeriod.${abut_period_id}.status == OPEN"
            - "GET /redemption-periods?store_id=${store_id} returns total_count == 2"

      - name: inspector_daily_minute_ceiling_blocks_the_same_day_and_frees_the_next
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_15_capacity
          - calculations.inspector_committed_minutes
          - errors.ERR_INSPECTOR_DAILY_LIMIT_EXCEEDED
        distinguishing_aspect: "The 480-minute ceiling is per UTC calendar date, not per inspector: a 180-minute visit on the same day as an existing 360-minute visit is refused (540 > 480) while the identical window one day later is accepted, and the travel-buffer conflict rule is not what refuses it (08:00 clears the 06:00 + 60 min buffer)."
        test_recipe:
          setup:
            - "Two SUBMITTED applications on two stores of one owner, and Dana Ruiz holding a 360-minute visit on 2026-08-01."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - call: "POST /store-visits"
              payload: { application_id: "${app_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T06:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit_long_id: $.data.id }
            - *k_store_b
            - *k_app_b
            - *k_submit_b
          trigger:
            - call: "POST /store-visits"
              payload: { application_id: "${app_b_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T11:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { daily_limit_error_id: $.data.error_id }
            - call: "POST /store-visits"
              payload: { application_id: "${app_b_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T11:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit_nextday_id: $.data.id }
          assert:
            - "the first attempt is 409 with ${daily_limit_error_id} == ERR_INSPECTOR_DAILY_LIMIT_EXCEEDED"
            - "the first attempt does NOT return ERR_INSPECTOR_WINDOW_CONFLICT"
            - "the second attempt is 201 and StoreVisit.${visit_nextday_id}.window_minutes == 180"
            - "Inspector.${insp_id}.committed_minutes == 540 (360 on 08-01 plus 180 on 08-02; only the per-day sums are capped)"
            - "Application.${app_b_id}.status == PENDING_VISIT"
            - "StoreVisit.${visit_long_id}.status == SCHEDULED"

      - name: terminal_awaiting_return_cannot_be_committed_to_a_new_deployment
        claim_type: Violation → Error
        grounds:
          - validations.priority_15_capacity
          - errors.ERR_DEPOT_STOCK_EXHAUSTED
        distinguishing_aspect: "A recalled unit sits in PENDING_RETURN, so even a future window that clears the closed-interval conflict rule is refused with 409 ERR_DEPOT_STOCK_EXHAUSTED rather than ERR_TERMINAL_ALREADY_COMMITTED, and the depot's pending-return counter is what makes it unavailable."
        test_recipe:
          setup:
            - "An authorized store with one activated deployment that is then recalled, leaving the unit PENDING_RETURN."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_depot
            - *k_term
            - *k_deploy
            - *k_activate
            - call: "POST /terminal-deployments/${dep_id}/recall"
              payload: { close_reason_code: "RETAILER_REQUEST" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term_id}", deploy_start: "2026-10-01T00:00:00Z", deploy_end: "2026-10-31T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { exhausted_error_id: $.data.error_id }
          assert:
            - "the response is 409 and ${exhausted_error_id} == ERR_DEPOT_STOCK_EXHAUSTED"
            - "EbtTerminal.${term_id}.status == PENDING_RETURN"
            - "EquipmentDepot.${depot_id}.units_pending_return == 1 and units_in_stock == 4 and units_deployed == 0"
            - "Store.${store_id}.active_terminal_count == 0"
            - "GET /terminal-deployments?terminal_id=${term_id} returns total_count == 1"

      - name: criterion_a_submit_with_only_three_qualifying_categories_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_16_eligibility
          - errors.ERR_STAPLE_STOCK_INSUFFICIENT
          - calculations.staple_criterion_a_qualification.DESK_VARIETY_FIRST
        distinguishing_aspect: "Meat carries only 2 distinct varieties (18 aggregate units is irrelevant - the desk variant needs 3 varieties AND 9 units), so desk_qualifying_categories is 3 and the submit is refused with 422 ERR_STAPLE_STOCK_INSUFFICIENT while the application stays DRAFT and re-submittable."
        test_recipe:
          setup:
            - "A DRAFT CRITERION_A application whose meat category lists only 2 varieties."
          setup_api_calls:
            - *k_owner
            - *k_store
            - call: "POST /applications"
              payload:
                store_id: "${store_id}"
                expected_store_version: "${store_v}"
                application_type: "INITIAL"
                claimed_criterion: "CRITERION_A"
                reported_inventory_lines: &k_inv_desk_fail
                  - { category: "BREAD_CEREAL", variety_key: "RICE", unit_count: 4, is_perishable: false }
                  - { category: "BREAD_CEREAL", variety_key: "OATS", unit_count: 3, is_perishable: false }
                  - { category: "BREAD_CEREAL", variety_key: "TORTILLA", unit_count: 5, is_perishable: false }
                  - { category: "DAIRY", variety_key: "MILK", unit_count: 6, is_perishable: true }
                  - { category: "DAIRY", variety_key: "CHEESE", unit_count: 4, is_perishable: true }
                  - { category: "DAIRY", variety_key: "YOGURT", unit_count: 3, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "APPLE", unit_count: 5, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "ONION", unit_count: 4, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "CANNED_CORN", unit_count: 3, is_perishable: false }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "CHICKEN", unit_count: 9, is_perishable: true }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "TUNA_CAN", unit_count: 9, is_perishable: false }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { app_fail_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_fail_id}/submit"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { staple_error_id: $.data.error_id }
          assert:
            - "the response is 422 and ${staple_error_id} == ERR_STAPLE_STOCK_INSUFFICIENT"
            - "Application.${app_fail_id}.desk_qualifying_categories == 3 and desk_criterion_pass == false"
            - "Application.${app_fail_id}.status == DRAFT and submitted_at == null"

      - name: approval_is_refused_when_the_verified_shelf_depth_is_below_the_floor
        claim_type: Violation → Error
        grounds:
          - validations.priority_16_eligibility
          - errors.ERR_DEPTH_OF_STOCK_INSUFFICIENT
          - state_machines.Application.PENDING_VISIT_to_UNDER_REVIEW
        distinguishing_aspect: "23 observed feet fails the 24-foot CONVENIENCE floor but the depth check is deliberately NOT part of the findings transition, so the application still reaches UNDER_REVIEW and is only refused at the decision with 422 ERR_DEPTH_OF_STOCK_INSUFFICIENT - the store is never authorized and no fns_number is minted."
        test_recipe:
          setup:
            - "A PENDING_VISIT application whose findings report 23 staple shelf feet (discrepancy 2333 bps, under the flag) with the staple criterion satisfied."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - call: "POST /store-visits/${visit_id}/findings"
              payload: { observed_inventory_lines: *k_inv_pass, observed_staple_shelf_linear_feet: 23 }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /applications/${app_id}/decision"
              payload: { outcome: "APPROVED" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { depth_error_id: $.data.error_id }
          assert:
            - "StoreVisit.${visit_id}.depth_of_stock_pass == false and shelf_discrepancy_flag == false"
            - "Application.${app_id}.status == UNDER_REVIEW (findings did not fail the transition)"
            - "the response is 422 and ${depth_error_id} == ERR_DEPTH_OF_STOCK_INSUFFICIENT"
            - "Store.${store_id}.authorization_status == NOT_AUTHORIZED and fns_number == null"
            - "Application.${app_id}.decided_at == null"

      - name: sale_on_a_reserved_deployment_is_rejected_before_any_tender_math
        claim_type: Priority Ordering
        grounds:
          - validations.priority_9_state
          - errors.ERR_TERMINAL_DEPLOYMENT_NOT_ACTIVE
          - validations.priority_19_business_fiscal
        distinguishing_aspect: "The store is AUTHORIZED so the priority-10 trading gate passes, but the named deployment is still RESERVED: the priority-9 answer ERR_TERMINAL_DEPLOYMENT_NOT_ACTIVE wins over the priority-19 basket check even though this all-ineligible basket would also have failed ERR_NO_ELIGIBLE_ITEMS."
        test_recipe:
          setup:
            - "An authorized store with a RESERVED (never activated) deployment."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_depot
            - *k_term
            - *k_deploy
          trigger:
            - call: "POST /pos-transactions"
              payload: { store_id: "${store_id}", terminal_deployment_id: "${dep_id}", household_ebt_card_last4: "4417", line_items: [ { sku: "BEER-1", item_class: "ALCOHOL", unit_price_cents: 1200, qty: 1 } ], snap_benefit_available_cents: 5000, other_tender_offered_cents: 5000 }
              as: StoreClerk
              as_user_id: "${store_id}"
