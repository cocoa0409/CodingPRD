              as_user_id: "${f2_id}"
            - call: "POST /sourcing/shipments/${sh0_id}/confirm-receipt"
              payload: {}
              as: BuyerManager
              as_user_id: "${b1_id}"
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "Main goods", product_category: "APPAREL", target_price_cents: 25000, quantity: 20, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/quotations"
              payload: { unit_price_cents: 25000, moq: 1, lead_time_days: 45, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${f1_id}"
              captures: { q1_id: "$.data.id", q1_v: "$.data.version" }
            - call: "POST /sourcing/factories/${f1_id}/compliance-documents"
              payload: { doc_type: "SOCIAL_AUDIT", issued_date: "2026-01-01", expires_at: "2027-06-01T00:00:00Z" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { d1_sa: "$.data.id" }
            - call: "POST /sourcing/compliance-documents/${d1_sa}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/factories/${f1_id}/compliance-documents"
              payload: { doc_type: "PRODUCT_TEST", issued_date: "2026-01-01", expires_at: "2027-06-01T00:00:00Z" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { d1_pt: "$.data.id" }
            - call: "POST /sourcing/compliance-documents/${d1_pt}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a2_id}", title: "Booster goods", product_category: "FURNITURE", target_price_cents: 600000, quantity: 10, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { srB_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${srB_id}/quotations"
              payload: { unit_price_cents: 600000, moq: 1, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${f2_id}"
              captures: { qB_id: "$.data.id", qB_v: "$.data.version" }
          trigger:
            - call: "POST /sourcing/quotations/${q1_id}/accept"
              payload: { ordered_qty: 20, delivery_month: "2026-10", expected_quotation_version: "${q1_v}" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { po1_id: "$.data.id", po1_prov: "$.data.provisional_commission_cents", po1_rate: "$.data.commission_rate_bp" }
            - call: "POST /sourcing/quotations/${qB_id}/accept"
              payload: { ordered_qty: 10, delivery_month: "2026-10", expected_quotation_version: "${qB_v}" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { poB_id: "$.data.id" }
            - call: "POST /sourcing/purchase-orders/${po1_id}/milestones"
              payload: { name: "FULL", weight_pct: 100 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { m1_id: "$.data.id" }
            - call: "POST /sourcing/milestones/${m1_id}/submit"
              payload: { evidence_note: "done" }
              as: FactoryRep
              as_user_id: "${f1_id}"
            - call: "POST /sourcing/milestones/${m1_id}/verify"
              payload: {}
              as: SourcingAgent
              as_user_id: "${a1_id}"
            - call: "POST /sourcing/purchase-orders/${po1_id}/inspections"
              payload: { inspector_id: "${in0_id}", inspection_type: "PSI", scheduled_date: "2026-10-05", duration_days: 1, lot_size: 20 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { insp1_id: "$.data.id" }
            - call: "POST /sourcing/inspections/${insp1_id}/record-result"
              payload: { defects_critical: 0, defects_major: 0, defects_minor: 0 }
              as: Inspector
              as_user_id: "${in0_id}"
            - call: "POST /sourcing/purchase-orders/${po1_id}/shipments"
              payload: { shipped_qty: 20, vessel_ref: "V1" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
