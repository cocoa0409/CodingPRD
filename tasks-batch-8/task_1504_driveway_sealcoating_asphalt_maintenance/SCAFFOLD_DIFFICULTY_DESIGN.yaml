  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: quote_patch_state_vs_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): PATCHing a SENT quote with a
          floor-breaching 30% discount violates ERR_QUOTE_NOT_EDITABLE (state,
          p5) and would violate ERR_PRICE_BELOW_COST_FLOOR (fiscal, p10); the
          state error must win.
        test_recipe:
          setup:
            - "Quote on PREMIUM material (coverage 70, price 1400c/gal -> cost floor 54800c), area 2000, seal-only; quote is SENT at total 72300c; a 30% discount would price 52860c < floor 54800c"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Beta Retail LLC", customer_type: "COMMERCIAL", email: "ops@beta.example", phone: "555-0200" }, as: OfficeAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${cust_id}", address: "55 Market St", lot_kind: "COMMERCIAL_LOT" }, as: OfficeAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${prop_id}", measured_area_sqft: 2000, crack_linear_ft: 0, pothole_count: 0, pothole_area_sqft: 0, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { asm_id: "$.data.id" } }
            - { call: "POST /api/assessments/${asm_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Premium", grade: "PREMIUM", coverage_sqft_per_gallon: 70, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 36, warranty_months: 24, price_per_gallon_cents: 1400 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "GET /api/properties/${prop_id}", payload: {}, as: OfficeAdmin, captures: { prop_v: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${prop_id}", assessment_id: "${asm_id}", material_id: "${mat_id}", include_crack_fill: false, include_patch: false, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${prop_v}" }, as: Estimator, captures: { quote_id: "$.data.id" } }
            - { call: "POST /api/quotes/${quote_id}/send", payload: {}, as: Estimator }
          trigger:
            - { call: "PATCH /api/quotes/${quote_id}", payload: { discount_pct: 0.30 }, as: Estimator, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_QUOTE_NOT_EDITABLE (state, priority 5) — not ERR_PRICE_BELOW_COST_FLOOR (fiscal, priority 10)"
            - "Quote remains SENT with discount_pct == 0 and total_cents == 72300 (64800 + 7500 mobilization)"

      - name: schedule_safety_vs_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal): scheduling with
          no weather snapshot for the date (safety, p6, ERR_WEATHER_DATA_MISSING)
