      - name: a_stale_expected_well_version_on_interest_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.well-interest-create-stale-well
          - errors.ERR_STALE_WELL_VERSION
          - "validations[priority=48, error_id=ERR_STALE_WELL_VERSION]"
        distinguishing_aspect: |
          Two division-order rows posted from the same observed Well version: the first bumps the well
          to version 2, so the second - still carrying version 1 in expected_well_version - returns
          ERR_STALE_WELL_VERSION (412) and no second WellInterest is written, exactly the
          double-posting the rule exists to stop.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Well Sandstone 1H, OIL, 9500 ft, with no interests"
            - "Owners OP and OA registered"
            - "The client has read the well once and holds that version in ${wv1}"
          setup_api_calls:
