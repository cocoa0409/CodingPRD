scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dvc_mutual_select_legacy_vs_standard_pass
        grounds:
          - calculations.mutual_selection_match
          - state_machines.RecruitmentRound.MUTUAL_SELECTION_to_BID_DAY
          - entities.Chapter.fields.legacy_priority_slots
        distinguishing_aspect: |
          Same Preference inputs, two algorithm variants produce different
          BidMatch.priority_kind on a Chapter domain entity (Chapter): legacy_pass
          matches the legacy PNM first into the chapter's reserved legacy slot
          (priority_kind=LEGACY), while standard_pass would otherwise match the
          higher-ranked non-legacy PNM into that same slot (priority_kind=STANDARD).
        test_recipe:
          setup:
            - "One chapter A with quota_total=2, legacy_priority_slots=1, dues_per_member_cents=50000, risk_status=GOOD_STANDING."
            - "Two PNMs: L (legacy of A, gpa=3.50) and S (non-legacy, gpa=3.80), both ACTIVE with one ATTENDED party hosted by A in this round."
            - "L files PNM_TO_CHAPTER rank=1 for A; S files PNM_TO_CHAPTER rank=1 for A."
            - "A files CHAPTER_TO_PNM rank=1 for S, rank=2 for L."
            - "Round.phase is MUTUAL_SELECTION."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "Alpha", greek_type: "SORORITY", quota_total: 2, dues_per_member_cents: 50000, legacy_priority_slots: 1 }
              as: PanhellenicAdmin
              captures: { ch_a: $.data.id }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 dvc1", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: $.data.id }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "L Legacy", gpa: 3.50, legacy_chapter_id: "${ch_a}" }
              as: Anonymous
              captures: { pnm_l: $.data.id }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "S Standard", gpa: 3.80 }
              as: Anonymous
              captures: { pnm_s: $.data.id }
            - call: "POST /rush/pnms/${pnm_l}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/pnms/${pnm_s}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_a}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 20 }
              as: ChapterOfficer
              as_user_id: "${ch_a}"
              captures: { party_a: $.data.id }
            - call: "POST /rush/parties/${party_a}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_a}"
            - call: "POST /rush/invitations"
              payload: { party_id: "${party_a}", pnm_id: "${pnm_l}" }
              as: ChapterOfficer
              as_user_id: "${ch_a}"
              captures: { inv_l: $.data.id }
            - call: "POST /rush/invitations"
              payload: { party_id: "${party_a}", pnm_id: "${pnm_s}" }
              as: ChapterOfficer
              as_user_id: "${ch_a}"
              captures: { inv_s: $.data.id }
            - call: "POST /rush/invitations/${inv_l}/accept"
              payload: {}
              as: PNM
              as_user_id: "${pnm_l}"
            - call: "POST /rush/invitations/${inv_s}/accept"
              payload: {}
              as: PNM
              as_user_id: "${pnm_s}"
            - call: "POST /rush/parties/${party_a}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_a}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${pnm_l}", chapter_id: "${ch_a}", rank: 1 }
              as: PNM
              as_user_id: "${pnm_l}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${pnm_s}", chapter_id: "${ch_a}", rank: 1 }
              as: PNM
              as_user_id: "${pnm_s}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${pnm_s}", chapter_id: "${ch_a}", rank: 1 }
              as: ChapterOfficer
              as_user_id: "${ch_a}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${pnm_l}", chapter_id: "${ch_a}", rank: 2 }
              as: ChapterOfficer
              as_user_id: "${ch_a}"
          trigger:
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
          assert:
            - "BidMatch row exists with chapter_id=${ch_a} AND pnm_id=${pnm_l} AND status=PROPOSED AND priority_kind=LEGACY"
            - "BidMatch row exists with chapter_id=${ch_a} AND pnm_id=${pnm_s} AND status=PROPOSED AND priority_kind=STANDARD"
            - "Without legacy_pass, ${pnm_s} (chapter_rank=1) would have taken the legacy slot and ${pnm_l} would have matched STANDARD or not at all — divergent BidMatch.priority_kind on identical preference inputs."
            - "PNM ${pnm_l}.status == MATCHED"
            - "PNM ${pnm_s}.status == MATCHED"

      - name: dvc_dues_snapshot_vs_live_at_read
        grounds:
          - calculations.bid_acceptance_dues_snapshot
          - state_machines.BidMatch.PROPOSED_to_ACCEPTED
          - entities.BidMatch.fields.dues_charged_cents
        distinguishing_aspect: |
          Same Chapter, two algorithm variants produce different stored
          BidMatch.dues_charged_cents on the BidMatch domain entity: the
          pinned snapshot_at_acceptance variant freezes dues at the instant
          of accept, so subsequent PUT /chapters/{id} that changes
          dues_per_member_cents does NOT alter the past bid's stored value;
          the rejected live_at_read variant would have shown the new dues.
        test_recipe:
          setup:
            - "Chapter B with initial dues_per_member_cents=50000."
            - "PNM P1 has an accepted bid against B at the old dues."
            - "Chapter B's dues_per_member_cents is then updated to 75000 mid-cycle."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "Beta", greek_type: "SORORITY", quota_total: 5, dues_per_member_cents: 50000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_b: $.data.id, ch_b_v0: $.data.version }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 dvc2", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: $.data.id }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "P1", gpa: 3.50 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /rush/pnms/${p1}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_b}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch_b}"
              captures: { party_b: $.data.id }
            - call: "POST /rush/parties/${party_b}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_b}"
            - call: "POST /rush/invitations"
              payload: { party_id: "${party_b}", pnm_id: "${p1}" }
              as: ChapterOfficer
              as_user_id: "${ch_b}"
              captures: { inv_p1: $.data.id }
            - call: "POST /rush/invitations/${inv_p1}/accept"
              payload: {}
              as: PNM
              as_user_id: "${p1}"
            - call: "POST /rush/parties/${party_b}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_b}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${p1}", chapter_id: "${ch_b}", rank: 1 }
              as: PNM
              as_user_id: "${p1}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${p1}", chapter_id: "${ch_b}", rank: 1 }
              as: ChapterOfficer
              as_user_id: "${ch_b}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "GET /rush/pnms/${p1}/bid-matches"
              payload: {}
              as: PanhellenicAdmin
              captures: { bid_p1: "$.data[0].id" }
            - call: "POST /rush/bid-matches/${bid_p1}/accept"
              payload: {}
              as: PNM
              as_user_id: "${p1}"
            - call: "GET /rush/chapters/${ch_b}"
              payload: {}
              as: PanhellenicAdmin
              captures: { ch_b_v_after_accept: $.data.version }
            - call: "PUT /rush/chapters/${ch_b}"
              payload: { dues_per_member_cents: 75000 }
              as: PanhellenicAdmin
          trigger:
            - call: "GET /rush/bid-matches/${bid_p1}"
              payload: {}
              as: PanhellenicAdmin
          assert:
            - "BidMatch ${bid_p1}.dues_charged_cents == 50000 (frozen at acceptance, NOT 75000)"
            - "Chapter ${ch_b}.dues_per_member_cents == 75000 (updated after the bid)"
            - "DuesLedgerEntry on bid_match_id=${bid_p1} with entry_kind=CHARGE has amount_cents == 50000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: comb_mutual_select_nested_ranks_chapter_then_pnm_then_created_at
        grounds:
          - calculations.mutual_selection_match
          - entities.Preference.fields.rank
          - entities.Chapter.fields.quota_total
        distinguishing_aspect: |
          Mode (a) — nested non-linear formula with three inputs:
          (chapter_rank_of(C,P), pnm_rank_of(P,C), P.created_at ASC). When
          a chapter has quota_total=1 and two PNMs both ranked rank=1 on
          its CHAPTER_TO_PNM list but with DIFFERENT pnm-side ranks, the
          tie-break flows chapter_rank then pnm_rank then created_at — a
          formula with three nested keys and branches on chapter risk
          status. No round-then-sum issue; no circular dependency. Pure
          mode (a).
        test_recipe:
          setup:
            - "Chapter C with quota_total=1, legacy_priority_slots=0."
            - "Two PNMs PA, PB both ATTENDED a party at C."
            - "C files CHAPTER_TO_PNM rank=1 for PA and rank=1 for PB? NO — preference uniqueness forbids that. Instead: C files PA rank=1, PB rank=2. PA files PNM_TO_CHAPTER rank=2 for C (also pref C2). PB files rank=1 for C."
            - "Round advanced into MUTUAL_SELECTION then advanced into BID_DAY."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "Gamma", greek_type: "SORORITY", quota_total: 1, dues_per_member_cents: 40000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_c: $.data.id }
            - call: "POST /rush/chapters"
              payload: { name: "Delta", greek_type: "SORORITY", quota_total: 1, dues_per_member_cents: 40000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_d: $.data.id }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 comb1", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: $.data.id }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "PA", gpa: 3.50 }
              as: Anonymous
              captures: { pa: $.data.id }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "PB", gpa: 3.50 }
              as: Anonymous
              captures: { pb: $.data.id }
            - call: "POST /rush/pnms/${pa}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/pnms/${pb}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_c}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch_c}"
              captures: { party_c: $.data.id }
            - call: "POST /rush/parties/${party_c}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_c}"
            - call: "POST /rush/invitations"
              payload: { party_id: "${party_c}", pnm_id: "${pa}" }
              as: ChapterOfficer
              as_user_id: "${ch_c}"
              captures: { inv_pa: $.data.id }
            - call: "POST /rush/invitations"
              payload: { party_id: "${party_c}", pnm_id: "${pb}" }
              as: ChapterOfficer
              as_user_id: "${ch_c}"
              captures: { inv_pb: $.data.id }
            - call: "POST /rush/invitations/${inv_pa}/accept"
              payload: {}
              as: PNM
              as_user_id: "${pa}"
            - call: "POST /rush/invitations/${inv_pb}/accept"
              payload: {}
              as: PNM
              as_user_id: "${pb}"
            - call: "POST /rush/parties/${party_c}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_c}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${pa}", chapter_id: "${ch_c}", rank: 2 }
              as: PNM
              as_user_id: "${pa}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${pb}", chapter_id: "${ch_c}", rank: 1 }
              as: PNM
              as_user_id: "${pb}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${pa}", chapter_id: "${ch_c}", rank: 1 }
              as: ChapterOfficer
              as_user_id: "${ch_c}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${pb}", chapter_id: "${ch_c}", rank: 2 }
              as: ChapterOfficer
              as_user_id: "${ch_c}"
          trigger:
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
          assert:
            - "Exactly one BidMatch exists for chapter_id=${ch_c}, with pnm_id=${pa} (chapter_rank=1 wins despite PA's lower pnm_rank=2)"
            - "BidMatch.priority_kind == STANDARD (no legacy slots)"
            - "PNM ${pa}.status == MATCHED"
            - "PNM ${pb}.status == ACTIVE (not matched)"

      - name: comb_dues_ledger_pinned_order_mode_a_vs_mode_b
        grounds:
          - calculations.chapter_dues_balance
          - entities.DuesLedgerEntry.fields.running_balance_cents
          - state_machines.BidMatch.PROPOSED_to_ACCEPTED
          - state_machines.BidMatch.ACCEPTED_to_DECLINED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned to an explicit
          evaluation order. The per-row running_balance_cents (MODE A) is
          order-sensitive (depends on created_at ASC of preceding entries);
          the chapter aggregate (MODE B) is commutative. The scaffold pins
          MODE A's evaluation order so the row-level number is well-defined,
          and the invariant MODE_A_last == MODE_B holds — a different
          combinatorial axis than instance comb_mutual_select (mode a).
        test_recipe:
          setup:
            - "Chapter E with dues_per_member_cents=30000, quota_total=3."
            - "Two PNMs Q1 and Q2 both accept bids in sequence; then Q1's bid is rescinded (REFUND posts)."
            - "Three DuesLedgerEntry rows: CHARGE 30000 (Q1), CHARGE 30000 (Q2), REFUND -30000 (Q1 rescind)."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "Epsilon", greek_type: "SORORITY", quota_total: 3, dues_per_member_cents: 30000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_e: $.data.id }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 comb2", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: $.data.id }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "Q1", gpa: 3.50 }
              as: Anonymous
              captures: { q1: $.data.id }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "Q2", gpa: 3.50 }
              as: Anonymous
              captures: { q2: $.data.id }
            - call: "POST /rush/pnms/${q1}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/pnms/${q2}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_e}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch_e}"
              captures: { party_e: $.data.id }
            - call: "POST /rush/parties/${party_e}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_e}"
            - call: "POST /rush/invitations"
              payload: { party_id: "${party_e}", pnm_id: "${q1}" }
              as: ChapterOfficer
              as_user_id: "${ch_e}"
              captures: { inv_q1: $.data.id }
            - call: "POST /rush/invitations"
              payload: { party_id: "${party_e}", pnm_id: "${q2}" }
              as: ChapterOfficer
              as_user_id: "${ch_e}"
              captures: { inv_q2: $.data.id }
            - call: "POST /rush/invitations/${inv_q1}/accept"
              payload: {}
              as: PNM
              as_user_id: "${q1}"
            - call: "POST /rush/invitations/${inv_q2}/accept"
              payload: {}
              as: PNM
              as_user_id: "${q2}"
            - call: "POST /rush/parties/${party_e}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_e}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${q1}", chapter_id: "${ch_e}", rank: 1 }
              as: PNM
              as_user_id: "${q1}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${q2}", chapter_id: "${ch_e}", rank: 1 }
              as: PNM
              as_user_id: "${q2}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${q1}", chapter_id: "${ch_e}", rank: 1 }
              as: ChapterOfficer
              as_user_id: "${ch_e}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${q2}", chapter_id: "${ch_e}", rank: 2 }
              as: ChapterOfficer
              as_user_id: "${ch_e}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "GET /rush/pnms/${q1}/bid-matches"
              payload: {}
              as: PanhellenicAdmin
              captures: { bid_q1: "$.data[0].id" }
            - call: "GET /rush/pnms/${q2}/bid-matches"
              payload: {}
              as: PanhellenicAdmin
              captures: { bid_q2: "$.data[0].id" }
            - call: "POST /rush/bid-matches/${bid_q1}/accept"
              payload: {}
              as: PNM
              as_user_id: "${q1}"
            - call: "POST /rush/bid-matches/${bid_q2}/accept"
              payload: {}
              as: PNM
              as_user_id: "${q2}"
            - call: "GET /rush/chapters/${ch_e}"
              payload: {}
              as: PanhellenicAdmin
              captures: { ch_e_v: $.data.version }
            - call: "POST /rush/bid-matches/${bid_q1}/rescind"
              payload: { expected_chapter_version: "${ch_e_v}" }
              as: ChapterOfficer
              as_user_id: "${ch_e}"
          trigger:
            - call: "GET /rush/chapters/${ch_e}/dues-ledger"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_e}"
          assert:
            - "Ledger has exactly 3 entries in created_at ASC order: [CHARGE +30000, CHARGE +30000, REFUND -30000]."
            - "MODE A per-row running_balance_cents == [30000, 60000, 30000] in that order."
            - "MODE B chapter aggregate == 30000 (sum of all amount_cents)."
            - "MODE A last running == MODE B aggregate (== 30000) — pinned evaluation order produces equal final but row-order-sensitive intermediate values."

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: nlsm_party_branching_open_cancel_complete
        grounds:
          - state_machines.Party.SCHEDULED_to_OPEN
          - state_machines.Party.SCHEDULED_to_CANCELLED
          - state_machines.Party.OPEN_to_COMPLETED
          - state_machines.Party.OPEN_to_CANCELLED
        distinguishing_aspect: |
          The Party state machine branches at TWO states: from SCHEDULED it
          forks {OPEN, CANCELLED}, and from OPEN it again forks {COMPLETED,
          CANCELLED}. The COMPLETED branch cascades ACCEPTED->ATTENDED and
          INVITED->NO_SHOW, while the CANCELLED branch cascades non-terminal
          invitations to DECLINED — divergent side-effect sets per branch on
          the same entity. Not a linear pipeline. Different entity from
          instance nlsm_pnm_branching_revert (PNM).
        test_recipe:
          setup:
            - "Round.phase=PARTY; chapter F GOOD_STANDING; two parties scheduled."
            - "PNM W1 ACTIVE and INVITED to both parties; W2 ACTIVE and INVITED to one."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "Zeta", greek_type: "SORORITY", quota_total: 5, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_f: $.data.id }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 nlsm1", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: $.data.id }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "W1", gpa: 3.50 }
