- section: consistency_model
  instances:
  - name: immediate_read_after_write
    claim_type: immediate_consistency
    grounds:
    - response_envelope
    distinguishing_aspect: 'Immediate consistency: a GET issued after a PATCH reflects the mutation in the same logical instant (no async reconciliation lag).'
    test_recipe:
      setup:
      - product P-IC exists
      setup_api_calls:
      - call: POST /products
        payload:
          sku_code: P-IC
          product_name: IC Bar
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          p1: $.data.id
      trigger:
      - call: PATCH /products/${p1}
        payload:
          target_overrun_pct: 55
        as: PlantManager
      - call: GET /products/${p1}
        as: PlantManager
        captures:
          ovr: $.data.target_overrun_pct
      assert:
      - GET immediately after PATCH returns target_overrun_pct == 55
