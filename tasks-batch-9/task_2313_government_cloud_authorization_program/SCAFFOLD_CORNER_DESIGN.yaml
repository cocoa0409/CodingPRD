        not'
      - 'fourth call: HTTP 404 with error_id ERR_AUTHORIZATION_NOT_FOUND, checked in the endpoint''s declared input order
        (authorization_id before agency_id); the expected_authorization_version carried is a live capture whose value is irrelevant
        because priority 7 precedes priority 10'
      - 'fifth call: HTTP 404 with error_id ERR_AGENCY_NOT_FOUND — priority 7 outranks priority 11, so the DRAFT status of
        the offering is never reported here'
      - 'sixth call: total_count == 0; CloudServiceOffering.${offering_id}.status == ''DRAFT'', authorization_path == null
