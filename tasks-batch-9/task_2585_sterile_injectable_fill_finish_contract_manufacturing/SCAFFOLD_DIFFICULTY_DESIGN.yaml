      - name: aseptic_qualification_gated_by_media_fill_status_and_participant_membership
        grounds:
          - validations[priority=64]
          - state_machines.MediaFill.status.INCUBATING_to_INVESTIGATION_REQUIRED
          - state_machines.MediaFill.status.INVESTIGATION_REQUIRED_to_PASSED
          - state_machines.PersonnelQualification.status.PENDING_to_QUALIFIED
          - state_machines.FillingSuite.aseptic_qualification_status.NOT_QUALIFIED_to_QUALIFIED
          - calculations.suite_posture
          - entities.PersonnelQualification.fields.qualification_type
        distinguishing_aspect: |
          A different cross-entity shape: the gate lives on a DIFFERENT entity's terminal status
          plus set membership inside one of its array fields, and it is conditional on the
          qualifying row's own qualification_type. A single-unit media fill read leaves MF-1 in
          INVESTIGATION_REQUIRED, so qualifying OP-A as ASEPTIC_INTERVENTION fails with
          ERR_MEDIA_FILL_NOT_PASSED; a QA adjudication to PASSED flips both MF-1 and the suite and
          the identical call then succeeds; OP-Z, who is absent from
          participating_operator_names, still fails against the same PASSED media fill; and a
          GOWNING qualification with media_fill_id null bypasses the rule entirely. The final
          assert then pins the exact counting semantics of the derived posture: MIN_QUALIFIED_OPERATORS
          is a strict less-than on qualified_operator_count, which counts EVERY QUALIFIED
          PersonnelQualification row of the suite regardless of qualification_type, so OP-A plus
          the GOWNING row OP-G is exactly 2 and the suite reaches OPEN with only ONE aseptic
          operator qualified.
