              payload: { name: "Cards Tiebreak", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-09", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Early", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p_early: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Late", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p_late: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot1: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-09"
              as: SchedulerAdmin
              captures: { slot2: $.data.0.id }
          trigger:
            - call: "GET /api/call-assignments?slot_id=${slot1}"
              as: SchedulerAdmin
              captures: { s1_phys: $.data.0.physician_id, s1_origin: $.data.0.origin }
            - call: "GET /api/call-assignments?slot_id=${slot2}"
              as: SchedulerAdmin
              captures: { s2_phys: $.data.0.physician_id }
          assert:
            - "slot 2026-09-08 assigned to the earliest-created physician: s1_phys == ${p_early} and origin == GENERATED (captured ${s1_phys}, ${s1_origin})"
            - "slot 2026-09-09 assigned to ${p_late} (s2_phys == ${p_late}) — after the tie-break, run-projection penalizes P_early's new 1.0 points"

      - name: generation_empty_pool_creates_shortfall_gaps
