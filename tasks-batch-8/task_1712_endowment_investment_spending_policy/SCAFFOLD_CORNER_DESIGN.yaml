            - { call: "POST /endowment/managers/${dg_us}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/managers/${dg_ca}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${dg_us}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 5000000, flows: [ { day_offset: 0, amount_cents: 5000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${dg_ca}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 5000000, flows: [ { day_offset: 0, amount_cents: 5000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${dg_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { dg_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${dg_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${dg_pv}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${dg_us}", quarter_index: 2, beginning_mv_cents: 5000000, ending_mv_cents: 5000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${dg_ca}", quarter_index: 2, beginning_mv_cents: 5000000, ending_mv_cents: 5000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${dg_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { dg_v2: $.data.id } }
            - { call: "GET /endowment/pools/${dg_pool}", as: InvestmentOfficer, captures: { dg_pv2: $.data.version } }
            - { call: "POST /endowment/valuations/${dg_v2}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${dg_pv2}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${dg_us}", quarter_index: 3, beginning_mv_cents: 5000000, ending_mv_cents: 5000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${dg_ca}", quarter_index: 3, beginning_mv_cents: 5000000, ending_mv_cents: 5000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${dg_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { dg_v3: $.data.id } }
