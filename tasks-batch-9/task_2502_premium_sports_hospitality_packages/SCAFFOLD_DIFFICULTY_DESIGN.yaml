          assert: >-
            ${status} == "PRICED", ${base_cost} == 125072, ${subtotal} == 141692,
            ${list_price} == 177115 and ${margin} == 0.2938.
            ${subtotal} is NOT 141690 and ${list_price} is NOT 177113, which are
            the values produced by summing the raw line prices and rounding once.
            GET /package-components/${c1_id} has line_cost_cents == 49980 and
            line_price_cents == 58727 (raw 58726.5).
            GET /package-components/${c2_id} has line_cost_cents == 54980 and
            line_price_cents == 59104 (raw 59103.5).
            GET /package-components/${c3_id} has line_cost_cents == 7772 and
            line_price_cents == 8744 (raw 8743.5).
            GET /package-components/${c4_id} has line_cost_cents == 12340 and
            line_price_cents == 15117 (raw 15116.5).
            58727 + 59104 + 8744 + 15117 == 141692 == ${subtotal}, and
            49980 + 54980 + 7772 + 12340 == 125072 == ${base_cost}.
            ${list_price} * 1 == round_half_up(141692 * 1.25) == 177115 exactly,
            i.e. the tier multiplier is applied to the rounded subtotal, not to
            the raw component sum.

      - name: booking_net_price_percentages_keyed_on_discounted_subtotal_not_net
        grounds: >-
          calculations.booking_net_price steps 1-6 (gross -> units-keyed volume
          tier -> discounted_subtotal -> channel commission -> guarantee
          surcharge -> net), constants CHANNEL_COMMISSION_PCT.TRAVEL_PARTNER = 0.10,
          VOLUME_TIER_UNITS [5, 10, 20] and SURCHARGE_TIER_CENTS [1000000, 5000000];
          entities.Booking.gross_price_cents / volume_discount_pct /
          discounted_subtotal_cents / partner_commission_cents /
          guarantee_surcharge_cents / net_price_cents;
          entities.RightsDeal.deal_status and released_units (the deal_exposure
          predicate that switches the surcharge on);
          calculations.payment_schedule_generation (DEPOSIT_PCT 0.30,
          SECOND_PCT 0.40, remainder on the last line);
          endpoints "POST /bookings".
        distinguishing_aspect: >-
          Mode (c): identical operands, different pairing/keying. Three different
          money bases are available for the two percentages — gross 2125380,
          discounted_subtotal 1955350 and net 1828252 — and the pinned rule keys
          BOTH the 10% travel-partner commission and the guarantee surcharge tier
          on discounted_subtotal. Every wrong pairing yields a different literal:
          commission on gross is 212538 (not 195535), surcharge on net is 63989
          and on gross 74388 (not 68437). The surcharge TIER is also selected by
          discounted_subtotal, so a fixture is used where all three candidate
          bases sit in the same 3.5% band — the divergence is therefore purely a
          base-selection error and cannot be masked by landing in another band.
          Finally volume_discount_pct is keyed on units (12 -> 0.0800), not on any
          money amount, and the schedule splits the NET, so the three installments
          548476 / 731301 / 548475 sum to net exactly with the remainder cent on
          the last line rather than the first.
        test_recipe:
          setup: >-
            One event with a COMMITTED ticket deal that has released nothing yet,
            so released_units (0) < contracted_units (100) and the deal is in the
            exposure set — this is what switches the guarantee surcharge on. The
            canonical GOLD package is published at list_price_cents 177115 and a
            TRAVEL_PARTNER client with plenty of credit head-room is created.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 100, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_status: "$.data.deal_status", deal_released: "$.data.released_units" } }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version", list_price: "$.data.list_price_cents" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Aventine Travel Group", client_type: "TRAVEL_PARTNER", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
          trigger:
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "TRAVEL_PARTNER", units: 12 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b_id: "$.data.id", gross: "$.data.gross_price_cents", vd: "$.data.volume_discount_pct", ds: "$.data.discounted_subtotal_cents", comm: "$.data.partner_commission_cents", sur: "$.data.guarantee_surcharge_cents", net: "$.data.net_price_cents" }
          assert: >-
            ${deal_status} == "COMMITTED" and ${deal_released} == 0 and
            ${list_price} == 177115, establishing the exposure predicate and the
            price base before the trigger.
            ${gross} == 2125380 (177115 * 12), ${vd} == 0.0800 (keyed on units 12,
            not on money), volume_discount_cents == 170030,
            ${ds} == 1955350, ${comm} == 195535, ${sur} == 68437 and
            ${net} == 1828252.
            ${comm} is NOT 212538 (10% of gross) and NOT 182825 (10% of net).
            ${sur} is NOT 74388 (3.5% of gross) and NOT 63989 (3.5% of net).
            ${net} == ${ds} - ${comm} + ${sur} exactly (1955350 - 195535 + 68437),
            i.e. the surcharge is ADDED and the commission SUBTRACTED;
            subtracting the surcharge instead of adding it would give 1691378.
            All three candidate bases (2125380, 1955350, 1828252) fall inside the
            same [1000000, 5000000) surcharge band, so the 0.035 rate is not what
            distinguishes them — only the base is.
            GET /payment-installments?booking_id=${b_id} returns exactly three
            SCHEDULE lines in sequence_no ASC order with amount_cents
            548476, 731301 and 548475 (summing to 1828252, remainder cent on the
            LAST line) and due_at values "2026-08-04T00:00:00.000Z",
            "2026-11-03T15:00:00.000Z" and "2027-01-02T15:00:00.000Z".
            GET /bookings/${b_id} shows fulfillment_status == "RESERVED",
            payment_status == "UNPAID" and paid_cents == 0.

  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # Instance A is a cyclic status field traversed twice with a branch on the same
  # trigger. Instance B is a genuine two-dimensional state product on one entity.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: rights_deal_shortfall_reopens_to_partially_released_twice
        grounds: >-
          state_machines.RightsDeal transitions
          DRAFT -> COMMITTED, COMMITTED -> SHORTFALL_DECLARED,
          SHORTFALL_DECLARED -> PARTIALLY_RELEASED,
          PARTIALLY_RELEASED -> SHORTFALL_DECLARED and the
          PARTIALLY_RELEASED -> PARTIALLY_RELEASED self-loop;
          state_machines.ReleaseTranche PENDING -> CONFIRMED and PENDING -> LAPSED;
          calculations.rights_deal_minimum_liability (the deal status function and
          SHORTFALL_LIABILITY_PCT = 0.60);
          endpoints "POST /release-tranches", "POST /release-tranches/{id}/confirm",
          "POST /operations/daily-run", "POST /_clock/set_current_utc";
          entities.RightsDeal.deal_status / released_units / shortfall_units /
          minimum_liability_cents.
        distinguishing_aspect: >-
          The status field is not a ladder. SHORTFALL_DECLARED is entered, left,
          re-entered and left again inside one fixture, and the two exits are
          driven by the SAME endpoint (POST /release-tranches) whose target state
          is chosen by a guard on released_units — with released_units == 0 it
          would go to COMMITTED, with released_units > 0 it goes to
          PARTIALLY_RELEASED. The two entries are driven by two DIFFERENT
          endpoints (a confirm that under-covers the guarantee, then a daily-run
          lapse). The run ends on the PARTIALLY_RELEASED self-loop, where a
          confirm changes released_units, shortfall_units and
          minimum_liability_cents without changing deal_status at all. Crucially
          shortfall_units stays 40 across the whole PARTIALLY_RELEASED excursion:
          promising a replacement tranche re-opens the deal but does not retire
          the liability, so an implementation that derives shortfall_units from
          deal_status (or resets it on re-entry to a non-shortfall state) produces
          different numbers at steps 2, 3 and 4.
        test_recipe:
          setup: >-
            One event and one committed ticket deal with contracted_units 200 and
            guaranteed_minimum_units 100 at unit_cost_cents 20000, plus a first
            PENDING tranche promising 60 units.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 200, guaranteed_minimum_units: 100, unit_cost_cents: 20000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { st0: "$.data.deal_status" } }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-09-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { t1_id: "$.data.id" }
          trigger:
            # step 1 — confirm 60 of 60. released 60, no PENDING left,
            # 60 + 0 < 100 => COMMITTED -> SHORTFALL_DECLARED.
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dv1: "$.data.version" } }
            - { call: "POST /release-tranches/${t1_id}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${dv1}" }, as: RightsManager, as_user_id: u_rights }
            - call: "GET /rights-deals/${deal_id}"
              payload: {}
              as: RightsManager
              as_user_id: u_rights
              captures: { st1: "$.data.deal_status", sf1: "$.data.shortfall_units", ml1: "$.data.minimum_liability_cents", rel1: "$.data.released_units" }
            # step 2 — a fresh 50-unit promise re-opens the deal. released 60 > 0
            # and 60 + 50 >= 100 => SHORTFALL_DECLARED -> PARTIALLY_RELEASED.
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 50, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { t2_id: "$.data.id" }
            - call: "GET /rights-deals/${deal_id}"
              payload: {}
              as: RightsManager
              as_user_id: u_rights
              captures: { st2: "$.data.deal_status", sf2: "$.data.shortfall_units", ml2: "$.data.minimum_liability_cents" }
            # step 3 — the promise lapses. released 60, no PENDING left,
            # 60 < 100 => PARTIALLY_RELEASED -> SHORTFALL_DECLARED again.
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-10-02T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /operations/daily-run", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { lapsed: "$.data.lapsed_tranche_count", shortfalls: "$.data.shortfall_deal_count" } }
            - call: "GET /rights-deals/${deal_id}"
              payload: {}
              as: RightsManager
              as_user_id: u_rights
              captures: { st3: "$.data.deal_status", sf3: "$.data.shortfall_units", ml3: "$.data.minimum_liability_cents" }
            # step 4 — the SAME endpoint as step 2 re-opens it a second time, and
            # this time the new promise lands exactly on the guarantee boundary
            # (60 + 40 == 100, a `>=` comparison).
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-11-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { t3_id: "$.data.id" }
            - call: "GET /rights-deals/${deal_id}"
              payload: {}
              as: RightsManager
              as_user_id: u_rights
              captures: { st4: "$.data.deal_status", sf4: "$.data.shortfall_units", dv2: "$.data.version" }
            # step 5 — the self-loop: a confirm that moves the numbers but leaves
            # deal_status where it was.
            - { call: "POST /release-tranches/${t3_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${dv2}" }, as: RightsManager, as_user_id: u_rights }
            - call: "GET /rights-deals/${deal_id}"
              payload: {}
              as: RightsManager
              as_user_id: u_rights
              captures: { st5: "$.data.deal_status", sf5: "$.data.shortfall_units", ml5: "$.data.minimum_liability_cents", rel5: "$.data.released_units" }
          assert: >-
            ${st0} == "COMMITTED".
            Step 1: ${st1} == "SHORTFALL_DECLARED", ${rel1} == 60, ${sf1} == 40 and
            ${ml1} == 1680000 (= 60 * 20000 + 40 * round_half_up(20000 * 0.60)
            = 1200000 + 480000).
            Step 2: ${st2} == "PARTIALLY_RELEASED" while ${sf2} == 40 and
            ${ml2} == 1680000 — the status left the shortfall state but the
            liability did NOT move, because no units were actually released.
            Step 3: ${lapsed} == 1, ${shortfalls} == 1,
            ${st3} == "SHORTFALL_DECLARED", ${sf3} == 40, ${ml3} == 1680000, and
            GET /release-tranches/${t2_id} shows tranche_state == "LAPSED",
            confirmed_units == 0 and lapsed_at == "2026-10-02T00:00:00.000Z".
            Step 4: ${st4} == "PARTIALLY_RELEASED" and ${sf4} == 40, reached by the
            same endpoint as step 2 on a boundary sum of exactly 100.
            Step 5: ${st5} == "PARTIALLY_RELEASED" (unchanged — a self-loop),
            ${rel5} == 100, ${sf5} == 0 and ${ml5} == 2000000 (= 100 * 20000, the
            shortfall leg now gone).
            The visited sequence is COMMITTED, SHORTFALL_DECLARED,
            PARTIALLY_RELEASED, SHORTFALL_DECLARED, PARTIALLY_RELEASED,
            PARTIALLY_RELEASED — so ${st1} == ${st3} and ${st2} == ${st4} == ${st5}
            with different underlying numbers at each visit, which no monotone
            status ladder can produce.
            GET /release-tranches?rights_deal_id=${deal_id} returns three rows:
            ${t1_id} CONFIRMED with confirmed_units 60, ${t2_id} LAPSED with
            confirmed_units 0, ${t3_id} CONFIRMED with confirmed_units 40.

      - name: booking_parallel_fulfillment_and_payment_dimensions_advance_independently
        grounds: >-
          state_machines.Booking, whose initial_state is declared as
          "RESERVED (fulfillment_status) x UNPAID (payment_status)" and whose
          transition list drives the two dimensions with disjoint triggers —
          RESERVED -> ALLOCATED and ALLOCATED -> CREDENTIALED on the fulfillment
          axis, UNPAID -> DEPOSIT_PAID and DEPOSIT_PAID -> PAID_IN_FULL on the
          payment axis;
          state_machines.PaymentInstallment SCHEDULED -> PAID;
          entities.Booking.fulfillment_status / payment_status / paid_cents /
          credentials_issued_count;
          validations[priority=45] (which lists only fulfillment_status guards),
          validations[priority=46] (which guards the installment, not the
          fulfillment axis) and validations[priority=58];
          endpoints "POST /payment-installments/{id}/pay",
          "POST /bookings/{id}/allocate", "POST /bookings/{id}/issue-credentials",
          "GET /bookings/{id}".
        distinguishing_aspect: >-
          One entity carries two orthogonal state fields, and the recipe walks a
          zig-zag through their cross product, reading both fields after every
          step: (RESERVED, DEPOSIT_PAID) -> (ALLOCATED, DEPOSIT_PAID) ->
          (ALLOCATED, DEPOSIT_PAID) -> (ALLOCATED, PAID_IN_FULL) ->
          (CREDENTIALED, PAID_IN_FULL). The very first observed pair is
          impossible in any single-status model: money has moved while the
          inventory dimension is still at its initial state. The independence is
          falsifiable in both directions — an implementation that gates the
          deposit payment on allocation fails at step 1, and one that gates
          issue-credentials on PAID_IN_FULL would still pass here, so the recipe
          additionally asserts that the second schedule payment leaves
          payment_status at DEPOSIT_PAID (paid_cents 1106402 < net 1580574),
          proving the payment axis advances on a money threshold rather than on an
          installment count.
        test_recipe:
          setup: >-
            One event with a fully released ticket deal, a CORPORATE allocation
            block holding 40 units, the canonical GOLD package published, a
            CORPORATE booking of 10 units (net 1580574, schedule
            474172 / 632230 / 474172) and a READY hospitality build so that
            credential issuance is reachable at the end.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /allocation-blocks"
              payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { blk_id: "$.data.id" }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_id: "$.data.id" }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b_id: "$.data.id", b_net: "$.data.net_price_cents" }
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 40, catering_covers: 24, staff_count: 6, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { hb_id: "$.data.id" }
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin }
            - { call: "POST /hospitality-builds/${hb_id}/ready", payload: {}, as: OperationsManager, as_user_id: u_ops }
            - call: "GET /payment-installments"
              payload: { booking_id: "${b_id}" }
              as: FinanceController
              as_user_id: u_fin
              captures: { i1_id: "$.data[0].id", i2_id: "$.data[1].id", i3_id: "$.data[2].id" }
          trigger:
            # money moves first, on a booking whose fulfillment axis has not moved
            - { call: "POST /payment-installments/${i1_id}/pay", payload: { amount_cents_paid: 474172 }, as: FinanceController, as_user_id: u_fin }
            - { call: "GET /bookings/${b_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { fs1: "$.data.fulfillment_status", ps1: "$.data.payment_status", paid1: "$.data.paid_cents" } }
            # inventory axis advances, payment axis untouched
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v: "$.data.version" } }
            - { call: "POST /bookings/${b_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { fs2: "$.data.fulfillment_status", ps2: "$.data.payment_status" } }
            # second schedule payment: still short of net, so the payment axis holds
            - { call: "POST /payment-installments/${i2_id}/pay", payload: { amount_cents_paid: 632230 }, as: FinanceController, as_user_id: u_fin }
            - { call: "GET /bookings/${b_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { fs3: "$.data.fulfillment_status", ps3: "$.data.payment_status", paid3: "$.data.paid_cents" } }
            - { call: "POST /payment-installments/${i3_id}/pay", payload: { amount_cents_paid: 474172 }, as: FinanceController, as_user_id: u_fin }
            - { call: "GET /bookings/${b_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { fs4: "$.data.fulfillment_status", ps4: "$.data.payment_status", paid4: "$.data.paid_cents" } }
            - { call: "POST /bookings/${b_id}/issue-credentials", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { fs5: "$.data.fulfillment_status", ps5: "$.data.payment_status", creds: "$.data.credentials_issued_count" } }
          assert: >-
            ${b_net} == 1580574.
            (${fs1}, ${ps1}) == ("RESERVED", "DEPOSIT_PAID") with ${paid1} == 474172
            — the payment axis has left its initial UNPAID value while the
            fulfillment axis is still at its own initial value, which is the pair
            a single-status model cannot represent.
            (${fs2}, ${ps2}) == ("ALLOCATED", "DEPOSIT_PAID") — the allocate call
            moved only the fulfillment axis.
            (${fs3}, ${ps3}) == ("ALLOCATED", "DEPOSIT_PAID") with ${paid3} == 1106402
            — a second installment was paid and the payment axis did NOT advance,
            because 1106402 < 1580574.
            (${fs4}, ${ps4}) == ("ALLOCATED", "PAID_IN_FULL") with ${paid4} == 1580574
            — the payment axis advanced on the money threshold, not on the third
            call.
            (${fs5}, ${ps5}) == ("CREDENTIALED", "PAID_IN_FULL") with
            ${creds} == 30 (= units 10 * (tickets_per_package 2 + 1)).
            GET /payment-installments?booking_id=${b_id} shows all three SCHEDULE
            lines with installment_state == "PAID" and paid_amount_cents equal to
            their amount_cents.
            GET /clients/${cl_id} shows outstanding_cents == 0 and
            overdue_installment_count == 0.
            GET /allocation-blocks/${blk_id} shows committed_units == 20 and
            block_state == "EXHAUSTED".

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # Instance A is depth 4 driven by an Event-level status change.
  # Instance B is depth 3 driven by a CREATE on a sibling entity — the only input
  # in the whole system that can REDUCE an existing allocation.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: postpone_event_depth4_cascade_to_host_counter_and_client_overdue
        grounds: >-
          state_machines.Event SCHEDULED -> POSTPONED, whose side effects declare
          CASCADE hop 2 / 2b (Bookings to REBOOK_PENDING, block committed_units
          released back), hop 3 (PaymentInstallment due_at rewritten to
          rebook_deadline_at and state forced to SCHEDULED), hop 3b
          (HostAssignment ASSIGNED -> VOIDED), hop 4 (OnSiteHost
          active_assignment_count recomputed) and hop 4b (Client
          outstanding_cents and overdue_installment_count recomputed);
          conventions REBOOK_WINDOW_DAYS = 21;
          state_machines.Booking CREDENTIALED -> REBOOK_PENDING;
          state_machines.PaymentInstallment SCHEDULED -> OVERDUE (seeded by
          "POST /operations/daily-run");
          state_machines.HostAssignment ASSIGNED -> VOIDED;
          state_machines.Client ACTIVE -> ON_HOLD;
          calculations.client_credit_exposure;
          calculations.event_fulfillment_risk_score (POSTPONED_WEIGHT = 10);
          endpoints "POST /events/{id}/postpone".
        distinguishing_aspect: >-
          Depth 4, and every hop is caused by the PREVIOUS hop rather than by the
          postpone call. The OnSiteHost counter (hop 4) changes only because a
          HostAssignment was voided (hop 3b), which happened only because the
          booking left CREDENTIALED (hop 2), which happened only because the Event
          entered POSTPONED (hop 1). Likewise Client.overdue_installment_count
          drops from 1 to 0 (hop 4b) only because hop 3 pulled an OVERDUE
          installment back to SCHEDULED. Neither the OnSiteHost nor the Client is
          reachable from the request payload — the call carries no body at all —
          so a one- or two-hop implementation leaves active_assignment_count at 1
          and overdue_installment_count at 1. The recipe also pins the negative
          controls: Client.client_status stays ON_HOLD (the credit-standing
          machine only runs on daily-run, so the counter and the status move on
          different clocks) and AllocationBlock.block_state stays EXHAUSTED
          (allocation, not sales, drives it) even though committed_units falls to 0.
        test_recipe:
          setup: >-
            One event 184 days out with a fully released ticket deal, a CORPORATE
            block allocated 40 units, the canonical GOLD package published, one
            CORPORATE booking of 10 units allocated and credentialed, one READY
            hospitality build, one on-site host with a shift assigned to that
            booking, and then the clock pushed one day past the first
            installment's due date and a daily-run executed so that the
            installment is OVERDUE and the client sits at ON_HOLD.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /allocation-blocks"
              payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { blk_id: "$.data.id" }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_id: "$.data.id" }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b_id: "$.data.id", b_net: "$.data.net_price_cents" }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v: "$.data.version" } }
            - { call: "POST /bookings/${b_id}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v}" }, as: ClientServiceAgent, as_user_id: u_csa }
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 40, catering_covers: 24, staff_count: 6, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { hb_id: "$.data.id" }
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin }
            - { call: "POST /hospitality-builds/${hb_id}/ready", payload: {}, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b_id}/issue-credentials", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { creds_before: "$.data.credentials_issued_count" } }
            - call: "POST /on-site-hosts"
              payload: { full_name: "Alina Petrova", languages: ["EN", "IT"], max_concurrent_bookings: 2 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { host_id: "$.data.id" }
            - call: "POST /host-assignments"
              payload: { on_site_host_id: "${host_id}", booking_id: "${b_id}", hospitality_build_id: "${hb_id}", shift_start: "2027-02-01T10:00:00.000Z", shift_end: "2027-02-01T18:00:00.000Z" }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { ha_id: "$.data.id" }
            - { call: "GET /on-site-hosts/${host_id}", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { host_count_before: "$.data.active_assignment_count" } }
            # push past installment 1's due_at (2026-08-04) and sweep, so the
            # client is carrying one OVERDUE line and sits at ON_HOLD
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /operations/daily-run", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { swept: "$.data.overdue_installment_count" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_overdue_before: "$.data.overdue_installment_count", cl_status_before: "$.data.client_status" } }
          trigger:
            - call: "POST /events/${ev_id}/postpone"
              payload: {}
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_status: "$.data.status", ev_pc: "$.data.postponement_count", ev_deadline: "$.data.rebook_deadline_at", ev_risk: "$.data.fulfillment_risk_score", ev_posture: "$.data.risk_posture" }
          assert: >-
            Preconditions established by setup: ${b_net} == 1580574,
            ${creds_before} == 30, ${host_count_before} == 1, ${swept} == 1,
            ${cl_overdue_before} == 1 and ${cl_status_before} == "ON_HOLD".
            Hop 1 — ${ev_status} == "POSTPONED", ${ev_pc} == 1,
            ${ev_deadline} == "2026-08-26T00:00:00.000Z"
            (logical_now 2026-08-05 + REBOOK_WINDOW_DAYS 21),
            original_event_date == "2027-02-01T15:00:00.000Z" and event_date still
            "2027-02-01T15:00:00.000Z" (no new date was supplied);
            ${ev_risk} == 10 and ${ev_posture} == "NORMAL" (POSTPONED_WEIGHT only).
            Hop 2 — GET /bookings/${b_id} has fulfillment_status ==
            "REBOOK_PENDING", allocation_block_id == null and
            credentials_issued_count == 0 (down from 30).
            Hop 2b — GET /allocation-blocks/${blk_id} has committed_units == 0,
            released_back_units == 20, allocated_units == 40 and
            block_state == "EXHAUSTED" (deliberately UNCHANGED).
            Hop 3 — GET /payment-installments?booking_id=${b_id} returns the three
            SCHEDULE lines all with installment_state == "SCHEDULED",
            days_overdue == 0 and due_at == "2026-08-26T00:00:00.000Z"; the line
            that daily-run had marked OVERDUE is back to SCHEDULED.
            Hop 3b — GET /host-assignments/${ha_id} has assignment_state ==
            "VOIDED" and released_at == "2026-08-05T00:00:00.000Z".
            Hop 4 — GET /on-site-hosts/${host_id} has active_assignment_count == 0
            (down from ${host_count_before} == 1).
            Hop 4b — GET /clients/${cl_id} has overdue_installment_count == 0
            (down from 1) and outstanding_cents == 1580574, while
            client_status is still "ON_HOLD" because only
            POST /operations/daily-run runs the credit-standing machine.

      - name: block_preemption_depth3_cascade_reverts_a_sold_allocation
        grounds: >-
          calculations.channel_allocation_waterfall — the distribution pass
          (priority_rank ASC, tie-break created_at ASC) and the revert pass whose
          only reachable trigger is "POST /allocation-blocks";
          state_machines.AllocationBlock EXHAUSTED -> OPEN;
          state_machines.Booking ALLOCATED -> RESERVED;
          entities.AllocationBlock.allocated_units / committed_units /
          released_back_units / block_state;
          entities.RightsDeal.unallocated_units;
          validations[priority=66] (one live block per channel per deal);
          calculations.event_fulfillment_risk_score;
          endpoints "POST /allocation-blocks" and "POST /bookings/{id}/allocate".
        distinguishing_aspect: >-
          Depth 3 with a completely different trigger shape from instance A: the
          request creates a BRAND NEW row and names neither the incumbent block nor
          the booking it unwinds. Because RightsDeal.released_units can only ever
          grow, a confirm, a lapse or a recall can only RAISE a block's
          allocated_units; inserting a block whose priority_rank sorts ahead of an
          incumbent is the sole input that lowers one. Hop 2 is the incumbent's
          allocated_units falling 30 -> 20 with block_state EXHAUSTED -> OPEN; hop
          3 is the consequence of hop 2 alone — allocated_units (20) is now below
          committed_units (30), so the revert pass drags an ALLOCATED booking back
          to RESERVED, zeroes committed_units and records 30 in
          released_back_units. A distribute-only waterfall passes hop 2 and fails
          hop 3, leaving a block that has sold 30 units it no longer holds. The
          recipe also pins that the unwind is fulfillment-only: the booking's
          net_price_cents, paid_cents and payment_status are untouched, and
          block_state is recomputed from allocation (20 < 30 -> OPEN) rather than
          from the now-zero committed_units.
        test_recipe:
          setup: >-
            One event with a partially released ticket deal (40 of 60 units
            released), a single TRAVEL_PARTNER block at priority_rank 5 with
            target 30 that the waterfall has filled to 30 (EXHAUSTED) leaving
            RightsDeal.unallocated_units at 10, and one TRAVEL_PARTNER booking of
            15 units allocated against it so that committed_units == 30 ==
            allocated_units and the block has zero free capacity.
