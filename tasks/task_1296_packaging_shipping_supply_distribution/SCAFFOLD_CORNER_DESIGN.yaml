              as: CatalogManager
              captures: { p1: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "J-2", name: "J2", category: "CUSHIONING", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 15.0001 }
              as: CatalogManager
              captures: { p2: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "J-3", name: "J3", category: "CUSHIONING", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 1.0 }
              as: CatalogManager
              captures: { p3: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${p1}", warehouse_id: "${wh_atl}", on_hand_qty: 10 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${p2}", warehouse_id: "${wh_atl}", on_hand_qty: 10 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${p3}", warehouse_id: "${wh_atl}", on_hand_qty: 10 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
