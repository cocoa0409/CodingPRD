  # ==========================================================================
  # RULE 8 - resource_temporal_overlap
  # Two overlap regimes with deliberately different calibrations: press checks
  # reserve (printer_id, press_line_code) with a symmetric 120-minute buffer,
  # while claim clearances reserve (claim_code, market_code) with no buffer at
  # all and only against CLEARED rows.
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: press_check_buffer_blocks_a_three_hour_gap_but_admits_a_four_hour_one
        grounds:
          - validations[priority=52]
          - validations[priority=31]
          - errors[ERR_PRESS_CHECK_OVERLAP]
          - calculations.proof_state_resolution.constants.PRESS_CHECK_BUFFER_MINUTES
          - entities.PrinterProof.fields.press_line_code
          - entities.PrinterProof.fields.press_check_start_utc
          - entities.PrinterProof.fields.press_check_status
        distinguishing_aspect: |
          The reserved resource is (printer_id, press_line_code) and the exclusion
          window is the requested interval widened by 120 minutes on BOTH sides, so
          08:00-12:00 blocks 13:00-15:00 even though the raw intervals are an hour
          apart, and admits 16:00-18:00 whose widened window [14:00, 20:00) merely
          touches the widened [06:00, 14:00). An implementation that compares raw
          intervals accepts the first attempt; one that applies the buffer on one side
          only, or that treats a touching endpoint as an overlap, gets exactly one of
          the two answers wrong. The last two calls prove the scope key: the same
          13:00-15:00 slot is free on another press line of the same printer and on
          the same line code at a different printer.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED; ArtworkAsset (CARTON / COATED_PAPER / US) with brand_critical_color true, so every proof of this asset is created with press_check_required true and press_check_status PRESS_CHECK_REQUIRED."
            - "ArtworkVersion v1 APPROVED through all three stages."
            - "Two CERTIFIED G7_MASTER printers: printer A 'Cascade Print Co' and printer B 'Riverside Litho'."
            - "Four PrinterProofs on v1 - proofs 1, 2 and 3 belong to printer A, proof 4 belongs to printer B - all COATED_PAPER, all PROOF_IN_REVIEW with press_check_status PRESS_CHECK_REQUIRED."
            - "Proof 1 already holds an attended press check on press line LINE-A from 2026-09-10T08:00:00Z to 2026-09-10T12:00:00Z (press_check_status PRESS_CHECK_ATTENDED), whose buffered exclusion window is [2026-09-10T06:00:00Z, 2026-09-10T14:00:00Z)."
            - "No other press check exists, so every refusal below can only come from proof 1's window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
