        as_user_id: ${pa_id}
        captures:
          err_overlap: $.data.error_id
      - call: POST /accelerators/supply-contracts
        payload:
          product_sku_id: ${sku_id}
          start_month: 2026-04
          end_month: 2026-06
          contracted_units: 300
        as: LifecycleProgramManager
        as_user_id: ${pa_id}
        captures:
          sc_adjacent: $.data.id
      assert:
      - the third-month request returns 409 and ${err_overlap} == ERR_CONTRACT_WINDOW_OVERLAP
      - ${sc_adjacent} is present in the response, so the April start was accepted as adjacent
      - SupplyContract.${sc_first}.end_month == 2026-03
      - GET /accelerators/supply-contracts?product_sku_id=${sku_id} returns 2 rows
  - name: preview_grant_closed_day_windows_with_buffer
    grounds:
