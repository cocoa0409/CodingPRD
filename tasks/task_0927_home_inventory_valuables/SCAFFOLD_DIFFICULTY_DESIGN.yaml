        grounds:
          - state_machines.Appraisal.status.CERTIFIED_to_VOIDED
          - calculations.effective_value_resolution
          - calculations.policy_coverage_gap
          - state_machines.DocumentationPackage.status.GENERATED_to_EXPIRED
