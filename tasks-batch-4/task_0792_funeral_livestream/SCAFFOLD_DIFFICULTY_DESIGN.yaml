  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: refund_settled_donation_restores_home_net_cents
        grounds:
          - state_machines.Donation.SETTLED_to_REFUNDED
          - state_machines.Donation.PLEDGED_to_SETTLED
          - calculations.donation_ledger
          - entities.FuneralHome.fields.donations_net_cents
        distinguishing_aspect: "Conserved quantity = donations_net_cents (money): settling gross-1000 sets home.donations_net_cents to 941, and refunding it returns the value to 0 — the settle/refund pair leaves the ledger unchanged, no drift."
        test_recipe:
          setup:
            - "Order with PUBLISHED memorial; one donation gross 1000 SETTLED (home net 941)."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Owl Home", contact_email: "owl@x.com", initial_credits: 0 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Owl Hall", capacity: 40, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "O Wll", scheduled_start: "2026-06-17T10:00:00Z", scheduled_end: "2026-06-17T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "PUBLISH_MEMORIAL" }
              as: PlatformAdmin
            - call: "POST /donations"
              payload: { order_id: "${order_id}", donor_name: "D1", gross_amount_cents: 1000 }
              as: Guest
              captures: { d1: $.data.id }
            - call: "POST /donations/${d1}/transitions"
              payload: { action: "SETTLE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /donations/${d1}/transitions"
              payload: { action: "REFUND" }
              as: PlatformAdmin
          assert:
            - "Donation.${d1}.status == REFUNDED"
            - "ServiceOrder.${order_id}.donations_net_cents == 0"
            - "FuneralHome.${home_id}.donations_net_cents == 0"

      - name: cancel_scheduled_order_refunds_stream_credit
        grounds:
          - state_machines.ServiceOrder.SCHEDULED_to_CANCELLED
          - state_machines.ServiceOrder.DRAFT_to_SCHEDULED
          - calculations.stream_credit_ledger
          - entities.FuneralHome.fields.stream_credit_balance
        distinguishing_aspect: "Conserved quantity = stream_credit_balance (credits, not money): SCHEDULE consumes 1 credit (1->0) and CANCEL of that SCHEDULED order refunds exactly 1 (0->1), leaving the balance identical to its pre-SCHEDULE value."
        test_recipe:
          setup:
            - "FuneralHome with 1 credit; order booked+confirmed+stream-ready then SCHEDULED (credit now 0)."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Pea Home", contact_email: "pea@x.com", initial_credits: 1 }
              as: PlatformAdmin
              captures: { home_id: $.data.id }
            - call: "POST /venues"
              payload: { home_id: "${home_id}", name: "Pea Hall", capacity: 60, turnaround_minutes: 0 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-orders"
              payload: { home_id: "${home_id}", venue_id: "${venue_id}", decedent_name: "P Eaa", scheduled_start: "2026-06-18T10:00:00Z", scheduled_end: "2026-06-18T11:00:00Z" }
              as: PlatformAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /venue-bookings"
              payload: { order_id: "${order_id}", venue_id: "${venue_id}", window_start: "2026-06-18T10:00:00Z", window_end: "2026-06-18T11:00:00Z", expected_order_version: "${order_v}" }
              as: PlatformAdmin
              captures: { booking_id: $.data.id }
            - call: "POST /venue-bookings/${booking_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SET_STREAM_READY" }
              as: PlatformAdmin
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "SCHEDULE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-orders/${order_id}/transitions"
              payload: { action: "CANCEL" }
              as: PlatformAdmin
          assert:
            - "ServiceOrder.${order_id}.broadcast_status == CANCELLED"
            - "FuneralHome.${home_id}.stream_credit_balance == 1"
