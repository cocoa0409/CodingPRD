# =============================================================================
# SCAFFOLD — Statutory Digital Performance Royalty Collection & Split
# (SoundExchange-style collective: licensee registration, statutory rates,
# usage-report ingestion, royalty computation, distribution splits,
# payee registration/verification, ownership disputes, unclaimed accrual,
# rate proceedings, licensee audit & underpayment recovery)
# =============================================================================

scenario: |
  Statutory Digital Performance Royalty Collection & Split (SoundExchange):
  licensee registration for noninteractive digital services with statutory
  rate application by service category, usage report ingestion with sound
  recording identification and unmatched play handling, royalty computation
  under statutory rates with minimum fees and per-performance calculations,
  distribution split allocating shares to the recording owner, featured
  artist and nonfeatured performer funds, artist and rights owner
  registration with payee verification and dispute over ownership claims,
  unclaimed royalty accrual with matching campaigns and eventual
  distribution rules, rate proceedings before a statutory board affecting
  future periods, audit of licensee reporting and underpayment recovery.

domain_name: statutory-royalty-collection
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 14
  state_machine_count: 10
  calculation_count: 10
  endpoint_count: 60
  error_code_count: 30
  role_count: 7

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the digital service" }
      - { name: service_category, type: enum, source: input, description: "PREEXISTING_SUBSCRIPTION | NONSUBSCRIPTION_AD_SUPPORTED | BUSINESS_ESTABLISHMENT; determines applicable statutory rate schedule", constraints: "enum" }
      - { name: license_status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED", constraints: "enum; initial DRAFT" }
      - { name: notice_date, type: datetime, source: input, description: "Date of statutory notice of use filing" }
      - { name: annual_minimum_fee_cents, type: integer, source: computed, description: "Annual minimum fee for the service_category, sourced from the currently EFFECTIVE RateSchedule at the time of the liability run", constraints: ">= 0" }
      - { name: suspended_reason, type: string, source: system, description: "Free-text reason recorded on SUSPENDED transitions; null otherwise", default: null }

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: proceeding_ref, type: string, source: input, description: "Docket-style reference for the rate proceeding that produced this schedule" }
      - { name: effective_start, type: datetime, source: input, description: "First day (inclusive) of the term this schedule covers" }
      - { name: effective_end, type: datetime, source: input, description: "Last day (inclusive) of the term this schedule covers", constraints: "> effective_start" }
      - { name: rate_per_performance_microcents, type: integer, source: input, description: "Statutory per-performance rate in millionths of a cent", constraints: "> 0" }
      - { name: min_fee_cents, type: integer, source: input, description: "Annual minimum fee for the covered service_category", constraints: "> 0" }
      - { name: category, type: enum, source: input, description: "PREEXISTING_SUBSCRIPTION | NONSUBSCRIPTION_AD_SUPPORTED | BUSINESS_ESTABLISHMENT", constraints: "enum" }
      - { name: schedule_status, type: enum, source: system, description: "DRAFT | EFFECTIVE | SUPERSEDED", constraints: "enum; initial DRAFT" }

  - name: RateProceeding
    parent: null
    common_fields: true
    fields:
      - { name: docket_no, type: string, source: input, description: "Statutory board docket number" }
      - { name: proceeding_status, type: enum, source: system, description: "OPEN | DECIDED | PUBLISHED | CLOSED", constraints: "enum; initial OPEN" }
      - { name: decided_schedule_id, type: string, source: system, description: "FK -> RateSchedule.id; the rate schedule adopted by the decision; null until decide", default: null }

  - name: UsageReport
    parent: Licensee
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; reporting service" }
      - { name: period_start, type: datetime, source: input, description: "First day (inclusive) of the reporting period" }
      - { name: period_end, type: datetime, source: input, description: "Last day (inclusive) of the reporting period", constraints: ">= period_start" }
      - { name: report_status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | AMENDED", constraints: "enum; initial DRAFT" }
      - { name: total_performances, type: integer, source: computed, description: "Sum of performance_count over every PlayLine of this report (any identification_status)" }
      - { name: matched_performances, type: integer, source: computed, description: "Sum of performance_count over PlayLines with identification_status == MATCHED" }
      - { name: unmatched_performances, type: integer, source: computed, description: "Sum of performance_count over PlayLines with identification_status == UNMATCHED" }

  - name: PlayLine
    parent: UsageReport
    common_fields: true
    fields:
      - { name: usage_report_id, type: string, source: input, description: "FK -> UsageReport.id; containing report" }
      - { name: isrc, type: string, source: input, description: "ISRC supplied by the licensee; not required to resolve at ingestion", constraints: "non-empty" }
      - { name: track_title, type: string, source: input, description: "Licensee-supplied track title" }
      - { name: artist_name, type: string, source: input, description: "Licensee-supplied artist name" }
      - { name: performance_count, type: integer, source: input, description: "Number of digital performances on this line", constraints: "> 0" }
      - { name: identification_status, type: enum, source: computed, description: "MATCHED | UNMATCHED; MATCHED iff isrc resolves to exactly one Recording", constraints: "enum" }
      - { name: matched_recording_id, type: string, source: system, description: "FK -> Recording.id; resolved recording when identification_status == MATCHED; null otherwise", default: null }
      - { name: match_attempt_count, type: integer, source: system, description: "Number of matching campaigns that have attempted this line; starts 0" }

  - name: Recording
    parent: null
    common_fields: true
    fields:
      - { name: isrc, type: string, source: input, description: "International Standard Recording Code", constraints: "unique across all recordings" }
      - { name: track_title, type: string, source: input, description: "Official track title" }
      - { name: rights_owner_id, type: string, source: input, description: "FK -> RightsOwner.id; recording copyright owner" }
      - { name: featured_artist_id, type: string, source: input, description: "FK -> Artist.id; featured (headlining) artist" }
      - { name: catalog_status, type: enum, source: system, description: "ACTIVE | WITHDRAWN", constraints: "enum; initial ACTIVE" }

  - name: RoyaltyLiability
    parent: UsageReport
    common_fields: true
    fields:
      - { name: usage_report_id, type: string, source: input, description: "FK -> UsageReport.id; exactly one liability per report (uniqueness enforced at compute)" }
      - { name: period_start, type: datetime, source: system, description: "Copied from the UsageReport at creation" }
      - { name: gross_performance_royalty_cents, type: integer, source: computed, description: "Per-performance calculation before any minimum-fee floor; recomputed on every compute run" }
      - { name: minimum_fee_cents, type: integer, source: computed, description: "Minimum-fee floor applicable per the calc_royalty_liability mode rule" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Final amount due per the calc_royalty_liability mode rule" }
      - { name: liability_status, type: enum, source: system, description: "COMPUTED | BILLED | PAID | SETTLED | WRITTEN_OFF", constraints: "enum; initial COMPUTED" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "Collective administrative deduction retained before splits; floor-borne amount when the minimum fee binds (see calc_royalty_liability)" }
      - { name: distributable_pool_cents, type: integer, source: computed, description: "amount_due_cents - admin_fee_cents; the pool that calc_distribution_split splits" }

  - name: DistributionBatch
    parent: UsageReport
    common_fields: true
    fields:
      - { name: usage_report_id, type: string, source: input, description: "FK -> UsageReport.id; exactly one batch per report (uniqueness enforced at creation)" }
      - { name: batch_status, type: enum, source: system, description: "PLANNED | EXECUTED | REVERSED", constraints: "enum; initial PLANNED" }
      - { name: scheduled_for, type: datetime, source: input, description: "Scheduled execution datetime; must be strictly after the logical clock at creation", constraints: "future" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp at execution; null until EXECUTED", default: null }

  - name: DistributionLine
    parent: DistributionBatch
    common_fields: true
    fields:
      - { name: distribution_batch_id, type: string, source: input, description: "FK -> DistributionBatch.id; containing batch" }
      - { name: payee_type, type: enum, source: system, description: "RIGHTS_OWNER | FEATURED_ARTIST | NONFEATURED_FUND", constraints: "enum" }
      - { name: payee_artist_id, type: string, source: system, description: "FK -> Artist.id; set iff payee_type == FEATURED_ARTIST", default: null }
      - { name: payee_rights_owner_id, type: string, source: system, description: "FK -> RightsOwner.id; set iff payee_type == RIGHTS_OWNER", default: null }
      - { name: fund_type, type: enum, source: system, description: "AFM | SAG_AFTRA; set iff payee_type == NONFEATURED_FUND", default: null }
      - { name: amount_cents, type: integer, source: computed, description: "Split amount per calc_distribution_split waterfall and remainder rules", constraints: ">= 0" }

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: stage_name, type: string, source: input, description: "Artist or band name" }
      - { name: contact_email, type: string, source: input, description: "Notification contact" }
      - { name: registration_status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | REJECTED | SUSPENDED", constraints: "enum; initial PENDING_VERIFICATION" }
      - { name: payee_verified_at, type: datetime, source: system, description: "Logical-clock timestamp of verification; null until VERIFIED", default: null }

  - name: RightsOwner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Label or rights-holder legal name" }
      - { name: contact_email, type: string, source: input, description: "Notification contact" }
      - { name: registration_status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | REJECTED | SUSPENDED", constraints: "enum; initial PENDING_VERIFICATION" }
      - { name: payee_verified_at, type: datetime, source: system, description: "Logical-clock timestamp of verification; null until VERIFIED", default: null }

  - name: OwnershipClaim
    parent: Recording
    common_fields: true
    fields:
      - { name: recording_id, type: string, source: input, description: "FK -> Recording.id; disputed recording" }
      - { name: claimant_type, type: enum, source: input, description: "RIGHTS_OWNER | FEATURED_ARTIST", constraints: "enum" }
      - { name: claimant_id, type: string, source: input, description: "FK -> RightsOwner.id or Artist.id per claimant_type; the party asserting entitlement" }
      - { name: claimed_share_pct, type: number, source: input, description: "Percentage of the disputed bucket asserted", constraints: "0 < x <= 100" }
      - { name: claim_status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | UPHELD | REJECTED | WITHDRAWN", constraints: "enum; initial OPEN" }
      - { name: resolution_note, type: string, source: input, description: "Free-text note captured at resolve; null otherwise", default: null }

  - name: UnclaimedPool
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "First day (inclusive) of the accrual period" }
      - { name: period_end, type: datetime, source: input, description: "Last day (inclusive) of the accrual period", constraints: ">= period_start" }
      - { name: accrued_unmatched_cents, type: integer, source: computed, description: "Sum of unmatched-share cents contributed by batches whose period lies inside this pool's window" }
      - { name: pool_status, type: enum, source: system, description: "ACCRUING | MATCHING_CAMPAIGN | DISTRIBUTION_ELIGIBLE | DISTRIBUTED | EXPIRED", constraints: "enum; initial ACCRUING" }
      - { name: distributed_cents, type: integer, source: computed, description: "Cents released by release_unclaimed; equals accrued_unmatched_cents at DISTRIBUTED" }
      - { name: campaign_count, type: integer, source: system, description: "Number of completed matching campaigns against this pool; starts 0" }

  - name: AuditCase
    parent: Licensee
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; audited service" }
      - { name: auditor_ref, type: string, source: input, description: "Auditor engagement reference" }
      - { name: period_start, type: datetime, source: input, description: "First day (inclusive) of the audited period" }
      - { name: period_end, type: datetime, source: input, description: "Last day (inclusive) of the audited period", constraints: ">= period_start" }
      - { name: audit_status, type: enum, source: system, description: "OPENED | FINDINGS_ISSUED | SETTLED | CLOSED | WAIVED", constraints: "enum; initial OPENED" }
      - { name: assessed_underpayment_cents, type: integer, source: computed, description: "Underpayment computed per calc_audit_underpayment at findings issuance; 0 until FINDINGS_ISSUED" }
      - { name: recovered_cents, type: integer, source: computed, description: "Cents recorded via record_recovery; never exceeds assessed_underpayment_cents at settlement" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Licensee
    field: license_status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /licensees/{id}/activate"
        actor: Admin
        preconditions:
          - "Licensee is DRAFT"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licensees/{id}/suspend"
        actor: Admin
        preconditions:
          - "Licensee is ACTIVE"
        side_effects:
          - "Records suspended_reason from payload"
          - "Blocks new usage report submission while SUSPENDED"
          - "All UsageReports of this licensee in SUBMITTED status auto-flip SUBMITTED -> REJECTED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licensees/{id}/reinstate"
        actor: Admin
        preconditions:
          - "Licensee is SUSPENDED"
        side_effects:
          - "Clears suspended_reason"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (AuditCase settles with recovered_cents < assessed_underpayment_cents)"
        actor: system
        preconditions:
          - "The settled AuditCase has recovered_cents < assessed_underpayment_cents"
        side_effects:
          - "Licensee suspended_reason set to UNDERPAYMENT_SHORTFALL"
          - "All UsageReports of this licensee in SUBMITTED status auto-flip SUBMITTED -> REJECTED"
          - "Cascade link 3 of the audit-settlement cascade (see AuditCase OPENED -> FINDINGS_ISSUED and SETTLED transitions); link 4 is the report auto-rejection above"

      - from: [DRAFT, ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /licensees/{id}/terminate"
        actor: Admin
        preconditions:
          - "No UsageReport for this licensee is in SUBMITTED status"
          - "No DistributionBatch on any report of this licensee is in PLANNED status"
          - "No AuditCase for this licensee is in OPENED or FINDINGS_ISSUED status"
        side_effects:
          - "Terminal; nothing further mutates this licensee"

  - entity: RateSchedule
    field: schedule_status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /rate-schedules/{id}/activate"
        actor: Admin
        preconditions:
          - "Schedule is DRAFT"
          - "No other RateSchedule with the same category in DRAFT or EFFECTIVE status has a window that overlaps [effective_start, effective_end] under half-open collision semantics (see ERR_RATE_SCHEDULE_OVERLAP)"
        side_effects:
          - "Becomes the rate source for liabilities whose period_start falls inside the window"
          - "If another EFFECTIVE schedule of the same category exists with an earlier effective_start, that schedule flips EFFECTIVE -> SUPERSEDED (caused by this activation)"

      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (a same-category schedule with a later effective_start became EFFECTIVE, via activate or proceeding publish)"
        actor: system
        preconditions:
          - "The superseding schedule has the same category and its effective_start > this schedule's effective_start"
        side_effects:
          - "The category's resolved-rate cache is invalidated; the next snapshot_rate for this category resolves the superseding schedule"
          - "Existing liabilities whose period is fully inside this window are NOT recomputed (past periods keep their original rates)"

  - entity: RateProceeding
    field: proceeding_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DECIDED
        trigger: "POST /rate-proceedings/{id}/decide"
        actor: StatutoryBoard
        preconditions:
          - "Proceeding is OPEN"
          - "new_schedule_id references a DRAFT RateSchedule"
        side_effects:
          - "Records decided_schedule_id"

      - from: DECIDED
        to: PUBLISHED
        trigger: "POST /rate-proceedings/{id}/publish"
        actor: StatutoryBoard
        preconditions:
          - "Proceeding is DECIDED"
        side_effects:
          - "Decided RateSchedule flips DRAFT -> EFFECTIVE; that EFFECTIVE transition itself supersedes the previously EFFECTIVE RateSchedule of the same category (flips it EFFECTIVE -> SUPERSEDED), which in turn invalidates the category's rate cache so the next snapshot_rate resolves the new schedule"
          - "Liabilities already COMPUTED for past periods keep their snapshot rates and are NOT recomputed"

      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /rate-proceedings/{id}/close"
        actor: StatutoryBoard
        preconditions:
          - "Proceeding is PUBLISHED"
        side_effects: []

  - entity: UsageReport
    field: report_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /usage-reports/{id}/submit"
        actor: Licensee
        preconditions:
          - "Report is DRAFT"
          - "Report has at least one PlayLine (else ERR_REPORT_NO_PLAY_LINES)"
          - "Licensee.license_status == ACTIVE"
          - "For every other UsageReport of the same licensee in status SUBMITTED, ACCEPTED, or AMENDED: the proposed [period_start, period_end] does not overlap that report's window under aggregate-coverage semantics (any shared day, inclusive both ends, is a conflict)"
        side_effects:
          - "snapshot_rate run at submit: resolves and stores the RateSchedule used for this report's period (by licensee.service_category and period_start)"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /usage-reports/{id}/accept"
        actor: RoyaltyOps
        preconditions:
          - "Report is SUBMITTED"
        side_effects:
          - "Report becomes eligible for liability computation"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /usage-reports/{id}/reject"
        actor: RoyaltyOps
        preconditions:
          - "Report is SUBMITTED"
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /usage-reports/{id}/amend"
        actor: Licensee
        preconditions:
          - "Report is REJECTED"
        side_effects:
          - "Cycle reopens the report for edit and resubmission"

      - from: ACCEPTED
        to: AMENDED
        trigger: "POST /usage-reports/{id}/amend"
        actor: Licensee
        preconditions:
          - "Report is ACCEPTED"
          - "No DistributionBatch for this report is in EXECUTED status"
        side_effects:
          - "If a RoyaltyLiability exists for this report: it is recomputed (calc_royalty_liability, YTD_MINIMUM_FEE mode) and, when amount_due_cents changes, the licensee's annual minimum-fee paid-to-date ledger is reconciled"
          - "Any DistributionBatch for this report in PLANNED status is cancelled (batch_status -> REVERSED) so stale splits cannot execute against amended data"

      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /usage-reports/{id}/submit"
        actor: Licensee
        preconditions:
          - "Report is AMENDED"
          - "Report has at least one PlayLine (else ERR_REPORT_NO_PLAY_LINES)"
          - "Licensee.license_status == ACTIVE"
          - "Same aggregate-coverage non-overlap rule as the DRAFT -> SUBMITTED transition (self excluded)"
        side_effects:
          - "snapshot_rate re-run against the (possibly new) effective schedule for the period"

  - entity: RoyaltyLiability
    field: liability_status
    initial_state: COMPUTED
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: COMPUTED
        to: BILLED
        trigger: "POST /royalty-liabilities/{id}/bill"
        actor: RoyaltyOps
        preconditions:
          - "Liability is COMPUTED"
        side_effects: []

      - from: BILLED
        to: PAID
        trigger: "POST /royalty-liabilities/{id}/record_payment"
        actor: RoyaltyOps
        preconditions:
          - "Liability is BILLED"
        side_effects:
          - "Licensee's annual minimum-fee paid-to-date accumulator for the calendar year of period_start is incremented by amount_due_cents (this accumulator drives the YTD_MINIMUM_FEE mode of calc_royalty_liability)"

      - from: PAID
        to: SETTLED
        trigger: "system (DistributionBatch for the same usage_report executes)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 2 of the distribution cascade: batch execution -> liability settles"

      - from: BILLED
        to: WRITTEN_OFF
        trigger: "POST /royalty-liabilities/{id}/write_off"
        actor: Admin
        preconditions:
          - "Liability is BILLED"
        side_effects: []

  - entity: DistributionBatch
    field: batch_status
    initial_state: PLANNED
    terminal_states: [REVERSED]
    transitions:
      - from: PLANNED
        to: EXECUTED
        trigger: "POST /distribution-batches/{id}/execute"
        actor: RoyaltyOps
        preconditions:
          - "Batch is PLANNED"
          - "The RoyaltyLiability for the same usage_report is in PAID status"
          - "scheduled_for <= current logical clock time"
        side_effects:
          - "calc_distribution_split runs over the liability's distributable_pool_cents"
          - "DistributionLines are created for every MATCHED recording: RIGHTS_OWNER and FEATURED_ARTIST lines plus the NONFEATURED_FUND AFM and SAG_AFTRA lines, allocated per the waterfall and remainder rules"
          - "Unmatched share (proportional on unmatched_performances) is accrued into the UnclaimedPool covering the report's period"
          - "Liability flips PAID -> SETTLED"
          - "Records executed_at from the logical clock"

      - from: PLANNED
        to: REVERSED
        trigger: "system (UsageReport ACCEPTED -> AMENDED) or POST /distribution-batches/{id}/cancel"
        actor: "system or RoyaltyOps"
        preconditions:
          - "Batch is PLANNED"
        side_effects:
          - "No funds move; the report may be re-batched after re-acceptance"

  - entity: Artist
    field: registration_status
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /artists/{id}/verify"
        actor: PayeeAdmin
        preconditions:
          - "Registration is PENDING_VERIFICATION"
        side_effects:
          - "payee_verified_at set from the logical clock"
          - "Artist becomes eligible as a claimant and as a split payee"

      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /artists/{id}/reject_registration"
        actor: PayeeAdmin
        preconditions:
          - "Registration is PENDING_VERIFICATION"
        side_effects: []

      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /artists/{id}/suspend_registration"
        actor: PayeeAdmin
        preconditions:
          - "Registration is VERIFIED"
        side_effects:
          - "Blocks opening new OwnershipClaims as this artist"

  - entity: RightsOwner
    field: registration_status
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /rights-owners/{id}/verify"
        actor: PayeeAdmin
        preconditions:
          - "Registration is PENDING_VERIFICATION"
        side_effects:
          - "payee_verified_at set from the logical clock"

      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /rights-owners/{id}/reject_registration"
        actor: PayeeAdmin
        preconditions:
          - "Registration is PENDING_VERIFICATION"
        side_effects: []

      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /rights-owners/{id}/suspend_registration"
        actor: PayeeAdmin
        preconditions:
          - "Registration is VERIFIED"
        side_effects:
          - "Blocks opening new OwnershipClaims as this rights owner"

  - entity: OwnershipClaim
    field: claim_status
    initial_state: OPEN
    terminal_states: [UPHELD, REJECTED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /ownership-claims/{id}/start_review"
        actor: PayeeAdmin
        preconditions:
          - "Claim is OPEN"
        side_effects: []

      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /ownership-claims/{id}/reopen"
        actor: PayeeAdmin
        preconditions:
          - "Claim is UNDER_REVIEW"
        side_effects: []

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /ownership-claims/{id}/resolve with outcome=UPHELD"
        actor: PayeeAdmin
        preconditions:
          - "Claim is UNDER_REVIEW"
        side_effects:
          - "Recording.rights_owner_id or Recording.featured_artist_id (per claimant_type) is reassigned to the claimant"
          - "Distribution lines computed AFTER this resolution use the reassigned payee; already-EXECUTED batches are untouched"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /ownership-claims/{id}/resolve with outcome=REJECTED"
        actor: PayeeAdmin
        preconditions:
          - "Claim is UNDER_REVIEW"
        side_effects: []

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /ownership-claims/{id}/withdraw"
        actor: PayeeAdmin
        preconditions:
          - "Claim is OPEN"
        side_effects: []

  - entity: UnclaimedPool
    field: pool_status
    initial_state: ACCRUING
    terminal_states: [DISTRIBUTED, EXPIRED]
    transitions:
      - from: ACCRUING
        to: MATCHING_CAMPAIGN
        trigger: "POST /unclaimed-pools/{id}/start_campaign"
        actor: MatchingAgent
        preconditions:
          - "Pool is ACCRUING"
          - "accrued_unmatched_cents > 0"
        side_effects: []

      - from: MATCHING_CAMPAIGN
        to: ACCRUING
        trigger: "POST /unclaimed-pools/{id}/complete_campaign"
        actor: MatchingAgent
        preconditions:
          - "Pool is MATCHING_CAMPAIGN (else ERR_CAMPAIGN_NOT_OPEN)"
        side_effects:
          - "campaign_count incremented by 1"
          - "Every UNMATCHED PlayLine whose usage_report period lies inside the pool window is re-attempted against the current catalog; lines that now resolve flip UNMATCHED -> MATCHED and their unmatched share is moved OUT of accrued_unmatched_cents (calc_unclaimed_accrual, campaign-adjusted variant)"
          - "If campaign_count reaches CAMPAIGNS_BEFORE_DISTRIBUTION (3) and accrued_unmatched_cents is still > 0, pool auto-transitions ACCRUING -> DISTRIBUTION_ELIGIBLE"

      - from: ACCRUING
        to: DISTRIBUTION_ELIGIBLE
        trigger: "system (complete_campaign brings campaign_count to 3 with residual accrual)"
        actor: system
        preconditions:
          - "campaign_count == 3 after the completing campaign"
          - "accrued_unmatched_cents > 0"
        side_effects: []

      - from: DISTRIBUTION_ELIGIBLE
        to: DISTRIBUTED
        trigger: "POST /unclaimed-pools/{id}/release"
        actor: RoyaltyOps
        preconditions:
          - "Pool is DISTRIBUTION_ELIGIBLE"
        side_effects:
          - "accrued_unmatched_cents is released pro-rata to VERIFIED RightsOwners by matched catalog weight (calc_unclaimed_accrual distribution variant)"
          - "distributed_cents set equal to accrued_unmatched_cents at release time"

      - from: ACCRUING
        to: EXPIRED
        trigger: "POST /unclaimed-pools/{id}/expire"
        actor: Admin
        preconditions:
          - "Pool is ACCRUING"
          - "current logical clock > period_end + UNCLAIMED_EXPIRY_DAYS (365)"
        side_effects:
          - "Residual accrual is forfeited to the collective; no further campaigns"

  - entity: AuditCase
    field: audit_status
    initial_state: OPENED
    terminal_states: [CLOSED, WAIVED]
    transitions:
      - from: OPENED
        to: FINDINGS_ISSUED
        trigger: "POST /audit-cases/{id}/issue_findings"
        actor: RoyaltyAuditor
        preconditions:
          - "Audit is OPENED"
          - "At least one UsageReport of the licensee with period overlapping the audit window is in ACCEPTED or AMENDED status"
        side_effects:
          - "calc_audit_underpayment runs: recomputes each in-scope liability under the schedule effective at the ORIGINAL computation time versus auditor-declared true performances; assessed_underpayment_cents set (may be 0)"
          - "Cascade link 1 of the audit cascade: findings issued -> licensee flagged"

      - from: FINDINGS_ISSUED
        to: SETTLED
        trigger: "POST /audit-cases/{id}/record_recovery with final=true"
        actor: RoyaltyAuditor
        preconditions:
          - "Audit is FINDINGS_ISSUED"
          - "recovered_cents (this payment plus prior recoveries) <= assessed_underpayment_cents"
        side_effects:
          - "recovered_cents incremented by the recorded amount"
          - "Cascade link 2: if recovered_cents == assessed_underpayment_cents the licensee is unaffected; otherwise cascade link 3 fires"
          - "Cascade link 3: recovered_cents < assessed_underpayment_cents -> Licensee flips ACTIVE -> SUSPENDED with suspended_reason=UNDERPAYMENT_SHORTFALL"
          - "Recovered amount is added to the licensee's annual minimum-fee paid-to-date accumulator for the audit period's calendar year"

      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /audit-cases/{id}/close"
        actor: RoyaltyAuditor
        preconditions:
          - "Audit is FINDINGS_ISSUED"
          - "assessed_underpayment_cents == 0 OR recovered_cents == assessed_underpayment_cents"
        side_effects: []

      - from: OPENED
        to: WAIVED
        trigger: "POST /audit-cases/{id}/waive"
        actor: RoyaltyAuditor
        preconditions:
          - "Audit is OPENED"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: liability-compute-stale-report
    parent_entity: UsageReport
    write_endpoint: "POST /usage-reports/{id}/compute-liability"
    occ_field: "expected_usage_report_version"
    description: |
      Computing (or recomputing) a RoyaltyLiability against a UsageReport whose
      version has advanced since the caller last observed it is rejected. An
      intervening amendment or resubmission legitimately changes the report's
      play lines, so the caller's snapshot of the report is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: batch-execute-stale-batch
    parent_entity: DistributionBatch
    write_endpoint: "POST /distribution-batches/{id}/execute"
    occ_field: "expected_distribution_batch_version"
    description: |
      Executing a DistributionBatch whose version has advanced since the caller
      last observed it is rejected. An intervening cancel-and-rebatch or an
      amendment-driven reversal legitimately supersedes the batch, so the
      caller's view of the batch is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_per_performance_royalty
    trigger: "POST /usage-reports/{id}/compute-liability"
    algorithm: aggregation
    formula: |
      per_line_cents_raw = performance_count * rate_microcents / 1_000_000
      per_line_cents = round_half_up(per_line_cents_raw)   # ROUND PER LINE FIRST (pinned)
      gross_performance_royalty_cents = sum(per_line_cents over every PlayLine of the report, any identification_status)
      rate_microcents = the EFFECTIVE RateSchedule.rate_per_performance_microcents for
        (licensee.service_category, covering report.period_start); if the licensee has a
        stored snapshot_rate (from submit), the snapshot rate wins over a later schedule change.
    constants:
      MICROCENTS_PER_CENT: 1000000
    precision: "integer cents; per-line round_half_up THEN sum (pinned rounding order)"

  - name: calc_royalty_liability
    trigger: "POST /usage-reports/{id}/compute-liability"
    algorithm: threshold
    formula: |
      EVALUATION ORDER (pinned):
        1. gross = calc_per_performance_royalty
        2. mode = PER_PERIOD_MINIMUM if the liability is the FIRST liability computed for
           this licensee in the calendar year of period_start, else YTD_MINIMUM_FEE
        3. PER_PERIOD_MINIMUM:   minimum_fee_cents = schedule.min_fee_cents
           YTD_MINIMUM_FEE:      minimum_fee_cents = max(0, schedule.min_fee_cents - min_fee_paid_ytd_cents)
                                 where min_fee_paid_ytd_cents is the licensee's annual
                                 minimum-fee paid-to-date accumulator for that calendar year
        4. amount_due_cents = max(gross, minimum_fee_cents)
        5. admin_fee_cents = ADMIN_FEE_PCT * gross (round_half_up) when gross >= minimum_fee_cents;
           admin_fee_cents = 0 when the minimum fee binds (gross < minimum_fee_cents)
        6. distributable_pool_cents = amount_due_cents - admin_fee_cents
    constants:
      ADMIN_FEE_PCT: 0.05
    precision: "integer cents, round_half_up"
    variants:
      - name: PER_PERIOD_MINIMUM
        when: "First liability computed for this licensee in the calendar year of period_start"
        difference: "Full schedule.min_fee_cents is the floor; the two variants produce different amount_due_cents for the same report"
      - name: YTD_MINIMUM_FEE
        when: "Any subsequent liability in the same calendar year (including recompute after amendment)"
        difference: "Floor is reduced by min_fee_paid_ytd_cents; the same report evaluated under the two modes yields a different amount_due_cents whenever min_fee_paid_ytd_cents > 0"

  - name: calc_distribution_split
    trigger: "POST /distribution-batches/{id}/execute"
    algorithm: waterfall_allocation
    formula: |
      matched_pool_cents = round_half_up(distributable_pool_cents * matched_performances / total_performances)
      unmatched_pool_cents = distributable_pool_cents - matched_pool_cents
      unmatched_pool_cents accrues to the UnclaimedPool covering the report period.
      Per matched recording r (recording_pool_cents_r = round_half_up(matched_pool_cents * perfs_r / matched_performances)):
        rights_owner_cents_r  = floor(0.50 * recording_pool_cents_r)
        featured_cents_r      = floor(0.45 * recording_pool_cents_r)
        remainder_r           = recording_pool_cents_r - rights_owner_cents_r - featured_cents_r  # >= 0
        afm_cents_r           = floor(remainder_r / 2)
        sag_aftra_cents_r     = remainder_r - afm_cents_r   # remainder cent goes to SAG_AFTRA
      Nonfeatured pool taken over ALL matched recordings never exceeds 5% of matched_pool_cents.
      Tie-break / processing order: recordings processed by created_at ASC of the Recording entity.
    constants:
      RIGHTS_OWNER_SHARE: 0.50
      FEATURED_ARTIST_SHARE: 0.45
      NONFEATURED_SHARE: 0.05
    precision: "integer cents; floor per bucket; remainder cent to SAG_AFTRA"

  - name: calc_audit_underpayment
    trigger: "POST /audit-cases/{id}/issue_findings"
    algorithm: forward_looking
    formula: |
      For each in-scope RoyaltyLiability L (usage_report.period overlaps the audit window,
      liability not WRITTEN_OFF), processed in chronological order of period_start
      (tie-break: UsageReport.created_at ASC):
        recomputed_L = calc_royalty_liability with auditor-declared true performance counts
                       BUT evaluated under the RateSchedule effective at L's ORIGINAL
                       computation (the snapshot rate), and under L's original
                       minimum-fee mode (PER_PERIOD_MINIMUM vs YTD_MINIMUM_FEE)
        delta_L = recomputed_L - L.amount_due_cents
      declared_underpayment_cents = sum(max(0, delta_L) over all L)   # under-report only
      EVALUATION ORDER (pinned): base = declared_underpayment_cents
      penalty = round_half_up(UNDERREPORT_PENALTY_PCT * base)
      assessed_underpayment_cents = base + penalty + AUDIT_COST_RECOVERY_CENTS
    constants:
      UNDERREPORT_PENALTY_PCT: 0.15
      AUDIT_COST_RECOVERY_CENTS: 50000
    precision: "integer cents, round_half_up"

  - name: calc_unclaimed_accrual
    trigger: "DistributionBatch execution; POST /unclaimed-pools/{id}/complete_campaign; POST /unclaimed-pools/{id}/release"
    algorithm: aggregation
    formula: |
      accrue variant (batch execution):
        pool.accrued_unmatched_cents += unmatched_pool_cents of the executing batch
          when the batch's report period lies inside the pool window
      campaign-adjusted variant (complete_campaign):
        for every UNMATCHED PlayLine in reports whose period lies inside the pool window:
          if isrc now resolves to exactly one ACTIVE Recording:
            line flips to MATCHED; its proportional unmatched cents move OUT of
            accrued_unmatched_cents; report matched/unmatched counters recomputed
      distribution variant (release):
        each VERIFIED RightsOwner receives accrued_unmatched_cents * (matched catalog
        weight_w / total_weight), where weight_w = count of ACTIVE Recordings owned by w
        that were MATCHED in reports inside the pool window; owners processed by
        RightsOwner.created_at ASC; per-owner amounts floor()ed; the residual cents
        (accrued_unmatched_cents - sum of floors) go to the EARLIEST-created VERIFIED
        RightsOwner with weight > 0 (created_at ASC tie-break, never id)
    precision: "integer cents; floor with deterministic remainder assignment"

  - name: snapshot_rate
    trigger: "UsageReport DRAFT -> SUBMITTED and AMENDED -> SUBMITTED"
    algorithm: threshold
    formula: |
      Resolve the RateSchedule with category == licensee.service_category,
      schedule_status == EFFECTIVE, effective_start <= report.period_start <= effective_end.
      If none exists, submission fails with ERR_NO_EFFECTIVE_RATE_SCHEDULE.
      The resolved schedule's rates are stored on the report snapshot and used for every
      later computation for that report, even after the schedule is SUPERSEDED.

  - name: calc_report_counters
    trigger: "PlayLine create/delete; matching campaign completion"
    algorithm: aggregation
    formula: |
      total_performances     = sum(performance_count) over all PlayLines of the report
      matched_performances   = sum(performance_count) over PlayLines with identification_status == MATCHED
      unmatched_performances = total_performances - matched_performances

  - name: calc_min_fee_paid_ytd
    trigger: "RoyaltyLiability BILLED -> PAID; AuditCase settlement recovery"
    algorithm: chronological
    formula: |
      On payment: accumulator[licensee, year(period_start)] += amount_due_cents.
      On audit settlement: accumulator[licensee, year(audit period_start)] += recovered amount.
      The accumulator is a chronological running total; reading it inside
      calc_royalty_liability YTD_MINIMUM_FEE mode reflects only payments recorded
      strictly before the current compute call.

  - name: calc_playline_identification
    trigger: "PlayLine ingestion; matching campaign completion"
    algorithm: constraint_propagation
    formula: |
      identification_status = MATCHED iff count(Recording where isrc == line.isrc
      AND catalog_status == ACTIVE) == 1; else UNMATCHED.
      matched_recording_id set to the resolved Recording.id when MATCHED; null otherwise.

  - name: calc_featured_split_weighting
    trigger: "calc_distribution_split per matched recording"
    algorithm: weighted_scoring
    formula: |
      recording_pool_cents_r = round_half_up(matched_pool_cents * perfs_r / matched_performances)
      A recording with higher matched performance count receives a proportionally larger
      recording pool before the fixed 50/45/5 split is applied; weights are raw
      performance counts (no normalization), remainder handling per calc_distribution_split.

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Segregation of duties: the same X-User-ID that opened an AuditCase may not issue its findings, record its recovery, or close it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /audit-cases/{id}/issue_findings, POST /audit-cases/{id}/record_recovery, POST /audit-cases/{id}/close"

  - priority: 4
    category: existence
    check: "Every id referenced in the path and body (licensee, report, schedule, proceeding, recording, artist, rights owner, claim, pool, batch, liability, audit) must exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: business_constraint
    check: "Required fields present, types valid, enum members valid, numeric ranges respected (performance_count > 0, claimed_share_pct in (0,100], effective_end > effective_start, period_end >= period_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition exists in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version on OCC-guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /usage-reports/{id}/compute-liability, POST /distribution-batches/{id}/execute"

  - priority: 8
    category: business_temporal
    check: "Uniqueness of reporting coverage: the proposed [period_start, period_end] does not overlap any other UsageReport of the same licensee in SUBMITTED, ACCEPTED, or AMENDED status (any shared day, inclusive both ends)"
    error_id: ERR_USAGE_REPORT_OVERLAP
    http_status: 409
    applies_to: "POST /usage-reports, POST /usage-reports/{id}/submit"

  - priority: 9
    category: business_temporal
    check: "Rate-schedule half-open collision: no DRAFT/EFFECTIVE RateSchedule with the same category may have a window overlapping the new one under [start, end) adjacency semantics (back-to-back schedules are allowed); end-day-in-use aggregate check rejects schedules whose window contains another report's period day in use"
    error_id: ERR_RATE_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /rate-schedules, POST /rate-schedules/{id}/activate"

  - priority: 10
    category: business_temporal
    check: "An EFFECTIVE RateSchedule with category == licensee.service_category covering report.period_start must exist at submit time"
    error_id: ERR_NO_EFFECTIVE_RATE_SCHEDULE
    http_status: 409
    applies_to: "POST /usage-reports/{id}/submit"

  - priority: 11
    category: business_referential
    check: "Licensee.license_status == ACTIVE at usage-report submission"
    error_id: ERR_LICENSEE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /usage-reports, POST /usage-reports/{id}/submit"

  - priority: 12
    category: business_referential
    check: "Recording referenced by an OwnershipClaim is not WITHDRAWN; claimant (Artist or RightsOwner per claimant_type) exists and is VERIFIED"
    error_id: ERR_RECORDING_WITHDRAWN
    http_status: 409
    applies_to: "POST /recordings/{id}/ownership-claims"

  - priority: 13
    category: business_referential
    check: "Claimant registration_status == VERIFIED (distinct error from the recording check)"
    error_id: ERR_PAYEE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /recordings/{id}/ownership-claims"

  - priority: 14
    category: business_referential
    check: "Termination preconditions: no UsageReport in SUBMITTED, no DistributionBatch in PLANNED, no AuditCase in OPENED or FINDINGS_ISSUED for this licensee"
    error_id: ERR_TERMINATION_BLOCKED
    http_status: 409
    applies_to: "POST /licensees/{id}/terminate"

  - priority: 15
    category: business_fiscal
    check: "Distribution batch execution requires the report's RoyaltyLiability in PAID status"
    error_id: ERR_LIABILITY_NOT_PAID
    http_status: 409
    applies_to: "POST /distribution-batches/{id}/execute"

  - priority: 16
    category: business_temporal
    check: "Distribution batch may execute only at or after its scheduled_for time"
    error_id: ERR_BATCH_NOT_DUE
    http_status: 409
    applies_to: "POST /distribution-batches/{id}/execute"

  - priority: 17
    category: business_constraint
    check: "Uniqueness: one RoyaltyLiability per UsageReport; one DistributionBatch per UsageReport"
    error_id: ERR_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /usage-reports/{id}/compute-liability, POST /usage-reports/{id}/distribution-batches"

  - priority: 18
    category: business_fiscal
    check: "Audit settlement guard: cumulative recovered_cents must not exceed assessed_underpayment_cents"
    error_id: ERR_RECOVERY_EXCEEDS_ASSESSMENT
    http_status: 409
    applies_to: "POST /audit-cases/{id}/record_recovery"

  - priority: 19
    category: business_fiscal
    check: "Audit close guard: assessed_underpayment_cents == 0 or fully recovered"
    error_id: ERR_AUDIT_NOT_SETTLABLE
    http_status: 409
    applies_to: "POST /audit-cases/{id}/close"

  - priority: 20
    category: business_constraint
    check: "Unclaimed pool release requires pool_status == DISTRIBUTION_ELIGIBLE (campaign count and residual accrual gates already applied)"
    error_id: ERR_POOL_NOT_DISTRIBUTABLE
    http_status: 409
    applies_to: "POST /unclaimed-pools/{id}/release"

  - priority: 21
    category: business_temporal
    check: "Unclaimed pool expiry requires current logical clock > period_end + 365 days"
    error_id: ERR_POOL_NOT_EXPIRABLE
    http_status: 409
    applies_to: "POST /unclaimed-pools/{id}/expire"

  - priority: 22
    category: state
    check: "RateProceeding operation invalid for current status: decide requires OPEN with a DRAFT new_schedule_id; publish requires DECIDED; close requires PUBLISHED"
    error_id: ERR_RATE_PROCEEDING_INVALID
    http_status: 409
    applies_to: "POST /rate-proceedings/{id}/decide, POST /rate-proceedings/{id}/publish, POST /rate-proceedings/{id}/close"

  - priority: 23
    category: business_safety
    check: "Catalog withdrawal guard: a Recording may not be withdrawn while any OwnershipClaim on it is OPEN or UNDER_REVIEW"
    error_id: ERR_RECORDING_IN_DISPUTE
    http_status: 409
    applies_to: "POST /recordings/{id}/withdraw"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced"]

  # --- Licensees ---
  - method: POST
    path: "/licensees"
    description: "Register a licensee (draft)"
    roles: [Admin]
    code: 201
    input: [legal_name, service_category, notice_date]
    output: Licensee
    side_effects: ["license_status=DRAFT"]

  - method: GET
    path: "/licensees"
    description: "List licensees"
    roles: [Admin, RoyaltyOps, RoyaltyAuditor, Licensee, PayeeAdmin, MatchingAgent]
    code: 200
    input: ["license_status?", "service_category?"]
    output: "Licensee[]"
    side_effects: []

  - method: GET
    path: "/licensees/{id}"
    description: "Get licensee"
    roles: [Admin, RoyaltyOps, RoyaltyAuditor, Licensee, PayeeAdmin, MatchingAgent]
    code: 200
    input: []
    output: Licensee
    side_effects: []

  - method: POST
    path: "/licensees/{id}/activate"
    description: "Activate licensee"
    roles: [Admin]
    code: 200
    input: []
    output: Licensee
    side_effects: ["license_status DRAFT -> ACTIVE"]

  - method: POST
    path: "/licensees/{id}/suspend"
    description: "Suspend licensee"
    roles: [Admin]
    code: 200
    input: [reason]
    output: Licensee
    side_effects: ["license_status ACTIVE -> SUSPENDED"]

  - method: POST
    path: "/licensees/{id}/reinstate"
    description: "Reinstate licensee"
    roles: [Admin]
    code: 200
    input: []
    output: Licensee
    side_effects: ["license_status SUSPENDED -> ACTIVE"]

  - method: POST
    path: "/licensees/{id}/terminate"
    description: "Terminate licensee (terminal)"
    roles: [Admin]
    code: 200
    input: []
    output: Licensee
    side_effects: ["license_status -> TERMINATED"]

  - method: GET
    path: "/licensees/{id}/usage-reports"
    description: "List usage reports of a licensee (FK reverse reachability)"
    roles: [Admin, RoyaltyOps, RoyaltyAuditor, Licensee]
    code: 200
    input: ["report_status?"]
    output: "UsageReport[]"
    side_effects: []

  - method: GET
    path: "/licensees/{id}/audit-cases"
    description: "List audit cases of a licensee (FK reverse reachability)"
    roles: [Admin, RoyaltyOps, RoyaltyAuditor]
    code: 200
    input: ["audit_status?"]
    output: "AuditCase[]"
    side_effects: []

  # --- Rate schedules ---
  - method: POST
    path: "/rate-schedules"
    description: "Create a rate schedule (draft)"
    roles: [Admin]
    code: 201
    input: [proceeding_ref, effective_start, effective_end, rate_per_performance_microcents, min_fee_cents, category]
    output: RateSchedule
    side_effects: ["schedule_status=DRAFT"]

  - method: GET
    path: "/rate-schedules"
    description: "List rate schedules"
    roles: [Admin, RoyaltyOps, StatutoryBoard]
    code: 200
    input: ["category?", "schedule_status?"]
