  - method: GET
    path: "/consumers/{consumerId}/report-entries"
    description: "List report claim entries snapshotting this consumer's claims"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReportClaimEntry[]"
