      - name: observation_cycle_half_open_windows_permit_touching_but_reject_overlap
        grounds:
          - "state_machines.ObservationCycle"
          - "validations[priority=33]"
          - "errors.ERR_CYCLE_WINDOW_CONFLICT"
          - "endpoints.POST /epp/observation-cycles/{cycle_id}/reschedule"
          - "entities.ObservationCycle.reschedule_count"
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN INSTANT WINDOWS [window_start, window_end) WITH NO BUFFER, over
          the OBSERVATION CYCLE CALENDAR of one placement as the contended resource. A missed formative
          cycle is rescheduled twice: first into 2026-10-22..2026-10-24, which lies strictly inside the
          SUMMATIVE cycle's window and is refused, then into 2026-10-25..2026-10-27, which starts exactly
          at the summative window's exclusive upper bound and is accepted. The refused attempt must not
          consume a reschedule allowance. This is the deliberate mirror of the sibling instance, where the
          contended resource is a cooperating teacher and the intervals are closed-closed dates padded by
          a 14-day buffer, so touching is a conflict rather than a legal adjacency.
        test_recipe:
          setup:
            - "Build the base fixture and confirm a 14-week placement at clock 2026-08-01T00:00:00Z."
            - "Schedule a FORMATIVE cycle 3 for 2026-10-01T00:00:00Z..2026-10-05T00:00:00Z and a SUMMATIVE cycle 4 for 2026-10-20T00:00:00Z..2026-10-25T00:00:00Z."
