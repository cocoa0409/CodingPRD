        claim_type: chronological
        claim: "package_effective_expiry extends the expiry by the ceiling of the frozen duration in days, so a 3.25-day freeze pushes effective_expires_on out by 4 days"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-20T09:00:00Z" }
