              as_user_id: "u_ops_alice"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "Port of Norfolk", origin_country_code: "US", destination_country_code: "IT", destination_zone: "ZONE_2", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              captures: { order_id: "$.data.id" }
