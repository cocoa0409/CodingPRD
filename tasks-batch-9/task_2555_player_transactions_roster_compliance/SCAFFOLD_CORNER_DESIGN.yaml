# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe
# Task 2555 — Player Transactions & Roster Compliance
#
# Walks references/claim-extraction-guide.md section by section against this
# scaffold's §1.1–§1.7 surface. Corners already asserted by an instance in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub instead of a
# recipe. Shared literals (identical to the difficulty file):
#   PROCESSING_WINDOW [13:00:00Z, 21:00:00Z) | FILING_DEADLINE_HOURS 48
#   WAIVER_CLEARANCE_HOURS REVOCABLE 24 / IRREVOCABLE 48
#   WAIVER_IRREVOCABLE_CUTOFF 2026-08-25T16:00:00Z | TENDER_RESPONSE_HOURS 72
#   PHYSICAL_VALIDITY_DAYS 14 | MEDICAL_REVIEW_WINDOW_HOURS 72
#   MAX_PRORATION_YEARS 5 | SERVICE_DAYS_PER_SEASON 170
#   GRACE_PERIOD_HOURS 24 | FREEZE_AFTER_CONSECUTIVE_CHECKS 3
#   MAX_TRADE_ROUNDS 3 | MAX_TRANSACTION_REVISIONS 2
# Canonical money: 3 years / base 80000000 / bonus 10000000 ->
#   proration_years 3, annual 3333333, final 3333334,
#   current_season_cap_charge 83333333, total_value 250000000.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_team_returns_every_declared_field_with_zeroed_counters
        claim_type: creation
        grounds:
          - entities.Team.fields.market_code
          - entities.Team.fields.salary_cap_limit_cents
          - entities.Team.fields.compliance_status
          - endpoints[POST /teams]
        distinguishing_aspect: "POST /teams with all four required inputs returns 201 and a Team whose eight computed counters are all 0, cap_space_cents equals salary_cap_limit_cents and compliance_status is COMPLIANT."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-10T14:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1, active_roster_limit: 26, reserve_roster_limit: 4, injured_reserve_limit: 3, practice_squad_limit: 6 }
              as: LeagueOfficer
              captures: { ct_team_id: $.data.id, ct_version: $.data.version }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "Team.${ct_team_id}.name == Harbor Kings, market_code == HKG, salary_cap_limit_cents == 500000000, waiver_priority_rank == 1"
            - "Team.${ct_team_id}.active_roster_count == 0, reserve_roster_count == 0, injured_reserve_count == 0, practice_squad_count == 0"
            - "Team.${ct_team_id}.provisional_cap_committed_cents == 0, final_cap_committed_cents == 0, dead_money_cents == 0, cap_space_cents == 500000000"
            - "Team.${ct_team_id}.open_medical_review_count == 0, consecutive_noncompliant_checks == 0, grace_expires_at == null"
            - "Team.${ct_team_id}.compliance_status == COMPLIANT and the captured ${ct_version} == 1"

      - name: get_player_returns_the_stored_record
        claim_type: retrieval
        grounds:
          - endpoints[GET /players/{id}]
          - entities.Player.fields.full_name
          - entities.Player.fields.position
        distinguishing_aspect: "GET /players/{id} echoes the stored row: full_name Ray Alder, position QB, roster_designation UNROSTERED, medical_status CLEARED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; one player Ray Alder (QB) registered with no accrued days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { gp_player_id: $.data.id }
          trigger:
            - call: "GET /players/${gp_player_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${gp_player_id}"
          assert:
            - "HTTP 200 with Player.${gp_player_id}.full_name == Ray Alder and position == QB"
            - "Player.${gp_player_id}.roster_designation == UNROSTERED, medical_status == CLEARED, current_team_id == null"
            - "Player.${gp_player_id}.pension_credit_days == 0, roster_service_days == 0, service_years == 0, contract_rights_class == NONE"
            - "Player.${gp_player_id}.practice_squad_eligible == true and waiver_revocability_class == REVOCABLE"

      - name: list_players_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /players]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three players registered, GET /players?limit=2&offset=0 returns exactly 2 rows, total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; three players registered in this order: Ray Alder, Nate Orr, Cy Boone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
            - call: "POST /players"
              payload: { full_name: "Nate Orr", position: "WR" }
              as: LeagueOfficer
            - call: "POST /players"
              payload: { full_name: "Cy Boone", position: "DB" }
              as: LeagueOfficer
          trigger:
            - call: "GET /players"
              payload: { limit: 2, offset: 0 }
              as: LeagueOfficer
            - call: "GET /players"
              payload: { limit: 2, offset: 2 }
              as: LeagueOfficer
          assert:
            - "first list — HTTP 200, response_type == array, len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second list — len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "no row appears in both pages"

      - name: get_transaction_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=8]
          - errors[ERR_TRANSACTION_NOT_FOUND]
          - endpoints[GET /transactions/{id}]
        distinguishing_aspect: "GET /transactions/00000000-0000-0000-0000-00000000dead returns ERR_TRANSACTION_NOT_FOUND with HTTP 404, not an empty object."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; no filings exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "GET /transactions/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: LeagueOfficer
              captures: { nf_err: $.data.error_id }
          assert:
            - "the captured ${nf_err} == ERR_TRANSACTION_NOT_FOUND with HTTP 404"
            - "response_type == error and data.message is a non-blank string"

      - name: path_id_family_each_returns_its_own_not_found_error
        claim_type: not_found
        grounds:
          - validations[priority=8]
          - errors[ERR_TEAM_NOT_FOUND]
          - errors[ERR_PLAYER_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_BONUS_ALLOCATION_NOT_FOUND]
          - errors[ERR_WAIVER_REQUEST_NOT_FOUND]
          - errors[ERR_WAIVER_CLAIM_NOT_FOUND]
          - errors[ERR_TRADE_NOT_FOUND]
          - errors[ERR_TENDER_NOT_FOUND]
          - errors[ERR_INJURY_DESIGNATION_NOT_FOUND]
          - errors[ERR_PHYSICAL_EXAM_NOT_FOUND]
        distinguishing_aspect: "Every path-parameter family returns its own entity-specific 404 code rather than one generic NOT_FOUND, verified across ten reads with the same bogus id."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; empty database, so every id below is unknown."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "GET /teams/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: LeagueOfficer
              captures: { nf_team: $.data.error_id }
            - call: "GET /players/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: LeagueOfficer
              captures: { nf_player: $.data.error_id }
            - call: "GET /contracts/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: LeagueOfficer
              captures: { nf_contract: $.data.error_id }
            - call: "POST /bonus-allocations/00000000-0000-0000-0000-00000000dead/earn"
              payload: {}
              as: LeagueOfficer
              captures: { nf_bonus: $.data.error_id }
            - call: "GET /waiver-requests/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: LeagueOfficer
              captures: { nf_wire: $.data.error_id }
            - call: "GET /waiver-claims/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: LeagueOfficer
              captures: { nf_claim: $.data.error_id }
            - call: "GET /trades/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: LeagueOfficer
              captures: { nf_trade: $.data.error_id }
            - call: "GET /qualifying-offers/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: LeagueOfficer
              captures: { nf_tender: $.data.error_id }
            - call: "GET /injury-designations/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: LeagueOfficer
              captures: { nf_injury: $.data.error_id }
            - call: "GET /physical-exams/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: LeagueOfficer
              captures: { nf_exam: $.data.error_id }
          assert:
            - "${nf_team} == ERR_TEAM_NOT_FOUND, ${nf_player} == ERR_PLAYER_NOT_FOUND, ${nf_contract} == ERR_CONTRACT_NOT_FOUND"
            - "${nf_bonus} == ERR_BONUS_ALLOCATION_NOT_FOUND, ${nf_wire} == ERR_WAIVER_REQUEST_NOT_FOUND, ${nf_claim} == ERR_WAIVER_CLAIM_NOT_FOUND"
            - "${nf_trade} == ERR_TRADE_NOT_FOUND, ${nf_tender} == ERR_TENDER_NOT_FOUND, ${nf_injury} == ERR_INJURY_DESIGNATION_NOT_FOUND, ${nf_exam} == ERR_PHYSICAL_EXAM_NOT_FOUND"
            - "every one of the ten responses carries HTTP 404"

      - name: create_team_missing_market_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
          - entities.Team.fields.market_code
        distinguishing_aspect: "POST /teams without market_code returns ERR_INVALID_REQUEST 400 and creates no Team row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; no clubs registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /teams"
              payload: { name: "Harbor Kings", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { rf_err: $.data.error_id }
          assert:
            - "the captured ${rf_err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /teams returns total_count == 0"

      - name: create_team_omitting_limits_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Team.fields.active_roster_limit
          - entities.Team.fields.reserve_roster_limit
          - entities.Team.fields.injured_reserve_limit
          - entities.Team.fields.practice_squad_limit
        distinguishing_aspect: "Omitting all four optional limits yields active_roster_limit 26, reserve_roster_limit 4, injured_reserve_limit 3 and practice_squad_limit 6."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /teams"
              payload: { name: "Basin Otters", market_code: "BSN", salary_cap_limit_cents: 500000000, waiver_priority_rank: 2 }
              as: LeagueOfficer
              captures: { df_team_id: $.data.id }
          assert:
            - "Team.${df_team_id}.active_roster_limit == 26, reserve_roster_limit == 4, injured_reserve_limit == 3, practice_squad_limit == 6"
            - "HTTP 201 and Team.${df_team_id}.version == 1"

      - name: team_active_roster_count_input_ignored_on_create
        claim_type: computed_fields
        grounds:
          - entities.Team.fields.active_roster_count
          - entities.Team.fields.cap_space_cents
          - calculations.designation_count_recompute
        distinguishing_aspect: "A client-supplied active_roster_count of 99 and cap_space_cents of 1 are ignored: both computed fields come out 0 and 500000000 respectively, from the recompute rules alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /teams"
              payload: { name: "Coastal Rays", market_code: "CST", salary_cap_limit_cents: 500000000, waiver_priority_rank: 3, active_roster_count: 99, cap_space_cents: 1 }
              as: LeagueOfficer
              captures: { cf_team_id: $.data.id }
          assert:
            - "Team.${cf_team_id}.active_roster_count == 0 — the supplied 99 is discarded"
            - "Team.${cf_team_id}.cap_space_cents == 500000000 — the supplied 1 is discarded"
            - "HTTP 201 (unknown computed keys are ignored, not fatal, because only §1.1 `source: input` fields are read)"

      - name: player_system_fields_are_server_generated_on_create
        claim_type: system_fields
        grounds:
          - entities.Player.fields.designation_effective_at
          - entities.Player.fields.last_physical_passed_at
          - endpoints[POST /players]
        distinguishing_aspect: "A newly registered Player receives a server-minted id, created_at and updated_at equal to the logical clock 2026-08-10T14:00:00Z, version 1, and null designation_effective_at and last_physical_passed_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /players"
              payload: { full_name: "Vic Lund", position: "LB" }
              as: LeagueOfficer
              captures: { sf_player_id: $.data.id, sf_version: $.data.version }
          assert:
            - "the captured ${sf_player_id} is a non-blank server-generated id and ${sf_version} == 1"
            - "Player.${sf_player_id}.created_at == 2026-08-10T14:00:00Z and updated_at == 2026-08-10T14:00:00Z"
            - "Player.${sf_player_id}.designation_effective_at == null and last_physical_passed_at == null"

      - name: create_player_with_unknown_position_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
          - entities.Player.fields.position
          - entities.Team.fields.market_code
        distinguishing_aspect: "position GOALIE is not in the declared enum and market_code hk are not three uppercase letters — both return ERR_INVALID_REQUEST 400 and persist nothing."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /players"
              payload: { full_name: "Odd Position", position: "GOALIE" }
              as: LeagueOfficer
              captures: { tc_err1: $.data.error_id }
            - call: "POST /teams"
              payload: { name: "Bad Code", market_code: "hk", salary_cap_limit_cents: 500000000, waiver_priority_rank: 9 }
              as: LeagueOfficer
              captures: { tc_err2: $.data.error_id }
          assert:
            - "the captured ${tc_err1} == ERR_INVALID_REQUEST with HTTP 400"
            - "the captured ${tc_err2} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /players returns total_count == 0 and GET /teams returns total_count == 0"

      - name: compliance_check_row_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ComplianceCheck.fields.checked_at
          - entities.ComplianceCheck.fields.result
          - endpoints[POST /compliance-checks/run]
          - endpoints[GET /teams/{id}/compliance-checks]
        distinguishing_aspect: "ComplianceCheck is declared common_fields: false — the sweep row exposes no version and no updated_at, and §1.5 declares no PATCH, PUT or DELETE for it, so the audit log is append-only."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z with one compliant club Harbor Kings (cap 500000000) and no players."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { im_team_id: $.data.id }
          trigger:
            - call: "POST /compliance-checks/run"
              payload: { team_id: "${im_team_id}" }
              as: LeagueOfficer
              captures: { im_checked_at: $.data.checked_at, im_result: $.data.result }
          assert:
            - "HTTP 201 with the captured ${im_checked_at} == 2026-08-10T14:00:00Z and ${im_result} == COMPLIANT"
            - "the ComplianceCheck payload contains no version field and no updated_at field"
            - "ComplianceCheck.violation_codes == [] and resulting_compliance_status == COMPLIANT"
            - "GET /teams/${im_team_id}/compliance-checks returns total_count == 1 with that same row"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint whose path contains compliance-checks"

      - name: waiver_claim_on_unknown_parent_wire_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=8]
          - errors[ERR_WAIVER_REQUEST_NOT_FOUND]
          - entities.WaiverClaim.fields.waiver_request_id
          - endpoints[POST /waiver-requests/{id}/claims]
        distinguishing_aspect: "WaiverClaim is a child of WaiverRequest: claiming under an unknown wire id fails with ERR_WAIVER_REQUEST_NOT_FOUND 404 at priority 8, before the OCC check at priority 10 can look at expected_team_version."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z; one club Basin Otters exists and no waiver wire has ever been placed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Basin Otters", market_code: "BSN", salary_cap_limit_cents: 500000000, waiver_priority_rank: 2 }
              as: LeagueOfficer
              captures: { pr_team_id: $.data.id, pr_team_v1: $.data.version }
          trigger:
            - call: "POST /waiver-requests/00000000-0000-0000-0000-00000000dead/claims"
              payload: { claiming_team_id: "${pr_team_id}", expected_team_version: "${pr_team_v1}" }
              as: TeamCapAnalyst
              as_user_id: "${pr_team_id}"
              captures: { pr_err: $.data.error_id }
          assert:
            - "the captured ${pr_err} == ERR_WAIVER_REQUEST_NOT_FOUND with HTTP 404"
            - "GET /waiver-claims returns total_count == 0"
            - "Team.${pr_team_id}.version == ${pr_team_v1} — unchanged"

      - name: trade_asset_junction_links_a_trade_to_a_contract_both_ways
        claim_type: many_to_many_junction
        grounds:
          - entities.TradeAsset.fields.trade_id
          - entities.TradeAsset.fields.contract_id
          - endpoints[GET /trades/{id}/assets]
          - endpoints[GET /contracts/{id}/trade-assets]
          - calculations.trade_cap_compatibility
        distinguishing_aspect: "entity_topology is graph: TradeAsset is the junction between Trade and Contract, and the same row is reachable from both parents while the trade's cap deltas become exact negations (-83333333 / +83333333)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Harbor Kings (rank 1) and Basin Otters (rank 2), both cap 500000000."
            - "Ray Alder is signed to Harbor Kings on an APPROVED 3-year deal, so his Contract is ACTIVE with current_season_cap_charge_cents 83333333."
            - "Harbor Kings opened a Trade to Basin Otters with conditional_clause_type NONE, still PROPOSED at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { jn_a_id: $.data.id, jn_a_v1: $.data.version }
            - call: "POST /teams"
              payload: { name: "Basin Otters", market_code: "BSN", salary_cap_limit_cents: 500000000, waiver_priority_rank: 2 }
              as: LeagueOfficer
              captures: { jn_b_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { jn_p_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${jn_a_id}", player_id: "${jn_p_id}", transaction_type: "SIGNING", expected_team_version: "${jn_a_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${jn_a_id}"
              captures: { jn_txn_id: $.data.id, jn_c_id: $.data.contract_id }
            - call: "POST /physical-exams"
              payload: { player_id: "${jn_p_id}", team_id: "${jn_a_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${jn_txn_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${jn_a_id}"
              captures: { jn_ex_id: $.data.id }
            - call: "POST /physical-exams/${jn_ex_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${jn_a_id}"
            - call: "POST /transactions/${jn_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${jn_a_id}"
            - call: "POST /transactions/${jn_txn_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "POST /trades"
              payload: { initiating_team_id: "${jn_a_id}", counterparty_team_id: "${jn_b_id}", conditional_clause_type: "NONE" }
              as: TeamCapAnalyst
              as_user_id: "${jn_a_id}"
              captures: { jn_tr_id: $.data.id, jn_tr_v1: $.data.version }
          trigger:
            - call: "POST /trades/${jn_tr_id}/assets"
              payload: { asset_kind: "CONTRACT", direction: "TO_COUNTERPARTY", expected_trade_version: "${jn_tr_v1}", contract_id: "${jn_c_id}" }
              as: TeamCapAnalyst
