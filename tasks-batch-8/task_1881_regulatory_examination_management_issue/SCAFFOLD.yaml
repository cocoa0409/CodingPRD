scenario: |
  1881. Regulatory Examination Management & Issue Remediation (bank regulatory affairs office): exam scheduling & first-day-letter response coordination, document request tracking & submission quality control, examiner meeting log & informal findings capture, MRA/MRIA remediation plan & milestone tracking, validation evidence & closure request, repeat-finding risk & escalation, board reporting & regulator commitment log, cross-exam consistency

domain_name: regulatory-exam-management
api_prefix: /regulatory-exams

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RegulatorAgency
    parent: null
    common_fields: true
    fields:
      - name: agency_code
        type: string
        source: input
        description: "Unique short code for the regulator (e.g. OCC, FRB, FDIC, CFPB). Unique across all agencies."
        constraints: "1–20 chars, unique, immutable after creation"
      - name: agency_name
        type: string
        source: input
        description: "Full legal name of the regulator agency"
      - name: jurisdiction
        type: enum
        source: input
        description: "Geographic/jurisdictional scope of this regulator"
        constraints: "one of FEDERAL, STATE, FOREIGN"
      - name: escalation_threshold_days
        type: integer
        source: input
        description: "Days an MRA may sit past due before the agency mandates escalation to the board"
        constraints: "integer >= 1 and <= 730"
      - name: repeat_finding_multiplier_bp
        type: integer
        source: input
        description: "Basis-point multiplier applied to repeat-finding severity scores (10000 = 1.0x)"
        constraints: "integer >= 10000 and <= 40000"
      - name: active
        type: boolean
        source: input
        description: "Whether the agency may be linked to new examinations"
        default: true

  - name: Examination
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> RegulatorAgency.id; regulator conducting this examination"
      - name: exam_cycle_code
        type: string
        source: input
        description: "Business code such as 2026-SAFETY-Q3 identifying the exam cycle"
      - name: exam_type
        type: enum
        source: input
        description: "Examination scope class"
        constraints: "one of SAFETY_SOUNDNESS, COMPLIANCE, IT, TRUST, SPECIALTY"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state machine: SCHEDULED -> FIRST_DAY_ISSUED -> FIELDWORK -> FINDINGS_DELIVERED -> REMEDIATION -> VALIDATION -> CLOSED; REJECTED branch via CANCELLED"
        constraints: "one of SCHEDULED, FIRST_DAY_ISSUED, FIELDWORK, FINDINGS_DELIVERED, REMEDIATION, VALIDATION, CLOSED, CANCELLED"
        default: SCHEDULED
      - name: scheduled_start_date
        type: datetime
        source: input
        description: "Planned first day of fieldwork (ISO8601 date)"
      - name: scheduled_end_date
        type: datetime
        source: input
        description: "Planned last day of fieldwork; must be strictly after scheduled_start_date"
      - name: first_day_letter_due_date
        type: datetime
        source: computed
        description: "Computed as scheduled_start_date + 10 business days (Mon–Fri), inclusive of start when start is a business day"
      - name: posture
        type: enum
        source: computed
        description: "Derived posture: NORMAL (no overdue items), RESTRICTED (1–2 overdue first-day items or any milestone at risk), FROZEN (>=3 overdue first-day items or any issue overdue beyond escalation threshold). FROZEN blocks new document submissions."
        constraints: "one of NORMAL, RESTRICTED, FROZEN"
        default: NORMAL
      - name: repeat_finding_risk_score_bp
        type: integer
        source: computed
        description: "Weighted severity score across all issues linked to this exam, in basis points (0–100000); see calculations.repeat_finding_risk"
        default: 0
      - name: overdue_item_count
        type: integer
        source: computed
        description: "Count of FirstDayLetterItem rows with status != SUBMITTED and due_date < current logical date"
        default: 0
      - name: cancelled_reason
        type: string
        source: input
        description: "Free-text reason required when transitioning to CANCELLED"
        constraints: "required on cancel; immutable once set"

  - name: FirstDayLetterItem
    parent: Examination
    common_fields: true
    fields:
      - name: examination_id
        type: string
        source: input
        description: "FK -> Examination.id; owning examination"
      - name: request_ref
        type: string
        source: input
        description: "Regulator's document-request reference number, unique within the examination"
        constraints: "unique per examination_id"
      - name: description
        type: string
        source: input
        description: "Narrative description of the requested documents"
      - name: due_date
        type: datetime
        source: input
        description: "Regulator-imposed due date for this item"
      - name: status
        type: enum
        source: system
        description: "PENDING -> SUBMITTED; WAIVED terminal branch via regulator waiver"
        constraints: "one of PENDING, SUBMITTED, WAIVED"
        default: PENDING
      - name: submitted_at
        type: datetime
        source: system
        description: "Timestamp of the latest accepted DocumentSubmission"
      - name: waived_reason
        type: string
        source: input
        description: "Required when status transitions to WAIVED"

  - name: DocumentSubmission
    parent: FirstDayLetterItem
    common_fields: true
    fields:
      - name: first_day_item_id
        type: string
        source: input
        description: "FK -> FirstDayLetterItem.id; item this submission answers"
      - name: submission_round
        type: integer
        source: computed
        description: "1-based round index computed as count of prior submissions for the same first_day_item_id + 1"
      - name: document_manifest
        type: array
        source: input
        description: "Array of document descriptor objects [{doc_id, title, page_count, sha256}] — must be non-empty"
      - name: quality_status
        type: enum
        source: system
        description: "PENDING_REVIEW on creation; transitions to ACCEPTED or REJECTED via QC review"
        constraints: "one of PENDING_REVIEW, ACCEPTED, REJECTED"
        default: PENDING_REVIEW
      - name: quality_reject_reason
        type: string
        source: input
        description: "Required when transitioning to REJECTED"
      - name: page_count_total
        type: integer
        source: computed
        description: "Sum of manifest[].page_count, computed at creation and stored"

  - name: ExaminerMeeting
    parent: Examination
    common_fields: true
    fields:
      - name: examination_id
        type: string
        source: input
        description: "FK -> Examination.id; owning examination"
      - name: meeting_date
        type: datetime
        source: input
        description: "Logical date of the meeting"
      - name: attendees
        type: array
        source: input
        description: "Array of participant name strings; must include at least one examiner and one bank officer"
      - name: minutes_summary
        type: string
        source: input
        description: "Narrative minutes"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> FINALIZED; finalized meetings are immutable and may carry informal findings"
        constraints: "one of DRAFT, FINALIZED"
        default: DRAFT

  - name: InformalFinding
    parent: ExaminerMeeting
    common_fields: true
    fields:
      - name: examiner_meeting_id
        type: string
        source: input
        description: "FK -> ExaminerMeeting.id; meeting at which the finding was raised"
      - name: finding_text
        type: string
        source: input
        description: "Narrative description of the informal finding"
      - name: severity_hint
        type: enum
        source: input
        description: "Examiner's expressed severity"
        constraints: "one of LOW, MODERATE, HIGH, CRITICAL"
      - name: promoted_issue_id
        type: string
        source: system
        description: "FK -> Issue.id; set when this informal finding is promoted into a formal Issue; null until promoted"

  - name: Issue
    parent: Examination
    common_fields: true
    fields:
      - name: examination_id
        type: string
        source: input
        description: "FK -> Examination.id; examination in which this issue was raised"
      - name: informal_finding_id
        type: string
        source: input
        description: "FK -> InformalFinding.id; optional origin finding. Present when promoted from an informal finding; absent when filed directly by regulator letter."
        constraints: "nullable"
      - name: issue_ref
        type: string
        source: input
        description: "Regulator reference (e.g. MRA-2026-07); unique per examination"
        constraints: "unique per examination_id"
      - name: classification
        type: enum
        source: input
        description: "MRA (Matter Requiring Attention) or MRIA (Matter Requiring Immediate Attention)"
        constraints: "one of MRA, MRIA"
      - name: severity
        type: enum
        source: input
        description: "Regulator severity grade"
        constraints: "one of LOW, MODERATE, HIGH, CRITICAL"
      - name: is_repeat_finding
        type: boolean
        source: computed
        description: "Computed: true when a CLOSED Issue with the same normalized issue_ref stem exists on any prior Examination for the same agency_id; see calculations.repeat_finding_detection"
      - name: due_date
        type: datetime
        source: input
        description: "Regulator-imposed remediation due date"
      - name: status
        type: enum
        source: system
        description: "OPEN -> REMEDIATION_PLANNED -> IN_PROGRESS -> VALIDATION_SUBMITTED -> CLOSED; OVERDUE flag orthogonal; may cycle VALIDATION_SUBMITTED -> IN_PROGRESS on rejection"
        constraints: "one of OPEN, REMEDIATION_PLANNED, IN_PROGRESS, VALIDATION_SUBMITTED, CLOSED, OVERDUE"
        default: OPEN
      - name: escalated_to_board
        type: boolean
        source: computed
        description: "True when the issue has been escalated per repeat-finding or threshold rules"
        default: false
      - name: closed_at
        type: datetime
        source: system
        description: "Timestamp of final closure; null until CLOSED"

  - name: RemediationPlan
    parent: Issue
    common_fields: true
    fields:
      - name: issue_id
        type: string
        source: input
        description: "FK -> Issue.id; issue this plan remediates"
      - name: plan_version
        type: integer
        source: computed
        description: "1-based superseding version; each new plan for the same issue increments"
      - name: owner_user_id
        type: string
        source: input
        description: "FK -> BankOfficer.id; accountable remediation owner"
      - name: root_cause_narrative
        type: string
        source: input
        description: "Root cause analysis text"
      - name: corrective_action_summary
        type: string
        source: input
        description: "Summary of corrective actions"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> SUBMITTED -> APPROVED -> ACTIVE -> COMPLETE; REJECTED branch returns to DRAFT (revision loop); SUPERSEDED when a new plan is approved for the same issue"
        constraints: "one of DRAFT, SUBMITTED, APPROVED, ACTIVE, COMPLETE, REJECTED, SUPERSEDED"
        default: DRAFT
      - name: submitted_at
        type: datetime
        source: system
        description: "When plan moved DRAFT -> SUBMITTED"
      - name: approved_at
        type: datetime
        source: system
        description: "When plan moved SUBMITTED -> APPROVED"

  - name: RemediationMilestone
    parent: RemediationPlan
    common_fields: true
    fields:
      - name: remediation_plan_id
        type: string
        source: input
        description: "FK -> RemediationPlan.id; owning plan"
      - name: milestone_name
        type: string
        source: input
        description: "Human-readable milestone name"
      - name: sequence_index
        type: integer
        source: input
        description: "Strictly increasing integer ordering milestones within the plan; must be unique per plan"
        constraints: "integer >= 1; unique per remediation_plan_id"
      - name: due_date
        type: datetime
        source: input
        description: "Milestone due date"
      - name: status
        type: enum
        source: system
        description: "PENDING -> IN_PROGRESS -> COMPLETE; OVERDUE derived flag via due_date crossing"
        constraints: "one of PENDING, IN_PROGRESS, COMPLETE, OVERDUE"
        default: PENDING
      - name: completed_at
        type: datetime
        source: system
        description: "Set when transitioning to COMPLETE"

  - name: ValidationEvidence
    parent: Issue
    common_fields: true
    fields:
      - name: issue_id
        type: string
        source: input
        description: "FK -> Issue.id; issue this evidence supports"
      - name: evidence_type
        type: enum
        source: input
        description: "Form of validation evidence"
        constraints: "one of DOCUMENT_PACKAGE, TEST_RESULTS, INTERNAL_AUDIT_REPORT, THIRD_PARTY_ATTESTATION"
      - name: artifact_manifest
        type: array
        source: input
        description: "Array of artifact descriptors [{artifact_id, name, sha256}]"
      - name: submitted_by_user_id
        type: string
        source: input
        description: "FK -> BankOfficer.id; officer submitting evidence"
      - name: review_status
        type: enum
        source: system
        description: "PENDING -> SUFFICIENT | INSUFFICIENT"
        constraints: "one of PENDING, SUFFICIENT, INSUFFICIENT"
        default: PENDING
      - name: review_notes
        type: string
        source: input
        description: "Reviewer notes, required when marking INSUFFICIENT"

  - name: ClosureRequest
    parent: Issue
    common_fields: true
    fields:
      - name: issue_id
        type: string
        source: input
        description: "FK -> Issue.id; issue being closed"
      - name: request_round
        type: integer
        source: computed
        description: "1-based count of closure requests for this issue; each rejection allows a new round (cyclic)"
      - name: closure_narrative
        type: string
        source: input
        description: "Narrative asserting the issue is remediated"
      - name: validation_evidence_id
        type: string
        source: input
        description: "FK -> ValidationEvidence.id; must reference evidence with review_status == SUFFICIENT on the same issue"
      - name: status
        type: enum
        source: system
        description: "PENDING -> APPROVED | REJECTED; APPROVED closes the issue, REJECTED returns the issue to IN_PROGRESS"
        constraints: "one of PENDING, APPROVED, REJECTED"
        default: PENDING
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "FK -> ComplianceReviewer.id; set when reviewed"
      - name: rejection_reason
        type: string
        source: input
        description: "Required when status transitions to REJECTED"

  - name: BoardReport
    parent: Examination
    common_fields: true
    fields:
      - name: examination_id
        type: string
        source: input
        description: "FK -> Examination.id; exam summarized"
      - name: reporting_period_start
        type: datetime
        source: input
        description: "Start of reporting period (inclusive)"
      - name: reporting_period_end
        type: datetime
        source: input
        description: "End of reporting period (inclusive); must be >= reporting_period_start"
      - name: open_issue_count
        type: integer
        source: computed
        description: "Snapshot count of issues on this exam with status NOT IN {CLOSED} at generation time"
      - name: overdue_issue_count
        type: integer
        source: computed
        description: "Snapshot count of issues with status == OVERDUE at generation time"
      - name: escalated_issue_count
        type: integer
        source: computed
        description: "Snapshot count of issues with escalated_to_board == true at generation time"
      - name: total_repeat_finding_risk_bp
        type: integer
        source: computed
        description: "Snapshot of examination.repeat_finding_risk_score_bp at generation"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> FINALIZED; finalized reports immutable"
        constraints: "one of DRAFT, FINALIZED"
        default: DRAFT

  - name: CommitmentLogEntry
    parent: Examination
    common_fields: false
    fields:
      - name: examination_id
        type: string
        source: input
        description: "FK -> Examination.id; exam this commitment attaches to"
      - name: commitment_text
        type: string
        source: input
        description: "Text of the commitment made to the regulator"
      - name: committed_by_user_id
        type: string
        source: input
        description: "FK -> BankOfficer.id; officer making the commitment"
      - name: committed_at
        type: datetime
        source: system
        description: "Logical timestamp of commitment; immutable after creation"
      - name: due_date
        type: datetime
        source: input
        description: "Date by which the commitment must be honored"
      - name: fulfilled_at
        type: datetime
        source: system
        description: "Set when commitment is marked fulfilled; null while open"

  - name: BankOfficer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Officer display name"
      - name: email
        type: string
        source: input
        description: "Unique officer email"
        constraints: "unique, RFC5322-ish"
      - name: officer_role_title
        type: string
        source: input
        description: "Business title (e.g. CRO, BSA Officer)"
      - name: active
        type: boolean
        source: input
        description: "Inactive officers cannot be assigned to new plans"
        default: true

  - name: ComplianceReviewer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Reviewer display name"
      - name: email
        type: string
        source: input
        description: "Unique reviewer email"
        constraints: "unique"
      - name: certification_level
        type: enum
        source: input
        description: "Reviewer's certification tier; L3 required to approve MRIA closures"
        constraints: "one of L1, L2, L3"
      - name: active
        type: boolean
        source: input
        default: true
        description: "Inactive reviewers cannot perform reviews"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Examination
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: FIRST_DAY_ISSUED
        trigger: "POST /regulatory-exams/examinations/{id}/issue-first-day-letter"
        actor: RegulatoryAffairsManager
        preconditions:
          - "examination.status == SCHEDULED"
          - "at least one FirstDayLetterItem exists for this examination"
        side_effects:
          - "sets examination.status = FIRST_DAY_ISSUED"
          - "increments examination.version by 1"
      - from: FIRST_DAY_ISSUED
        to: FIELDWORK
        trigger: "POST /regulatory-exams/examinations/{id}/begin-fieldwork"
        actor: RegulatoryAffairsManager
        preconditions:
          - "examination.status == FIRST_DAY_ISSUED"
          - "all FirstDayLetterItem rows have status IN {SUBMITTED, WAIVED}"
        side_effects:
          - "sets examination.status = FIELDWORK"
          - "increments examination.version by 1"
      - from: FIELDWORK
        to: FINDINGS_DELIVERED
        trigger: "POST /regulatory-exams/examinations/{id}/deliver-findings"
        actor: RegulatoryAffairsManager
        preconditions:
          - "examination.status == FIELDWORK"
          - "at least one ExaminerMeeting with status == FINALIZED exists"
        side_effects:
          - "sets examination.status = FINDINGS_DELIVERED"
          - "increments examination.version by 1"
      - from: FINDINGS_DELIVERED
        to: REMEDIATION
        trigger: "POST /regulatory-exams/examinations/{id}/open-remediation"
        actor: RegulatoryAffairsManager
        preconditions:
          - "examination.status == FINDINGS_DELIVERED"
          - "at least one Issue exists for the examination"
        side_effects:
          - "sets examination.status = REMEDIATION"
          - "increments examination.version by 1"
      - from: REMEDIATION
        to: VALIDATION
        trigger: "system auto-transition when every Issue for this exam has status IN {VALIDATION_SUBMITTED, CLOSED} and at least one Issue exists"
        actor: system
        preconditions:
          - "examination.status == REMEDIATION"
          - "count(Issue where examination_id = id) >= 1"
          - "every Issue.status IN {VALIDATION_SUBMITTED, CLOSED}"
        side_effects:
          - "sets examination.status = VALIDATION"
          - "increments examination.version by 1"
      - from: VALIDATION
        to: CLOSED
        trigger: "POST /regulatory-exams/examinations/{id}/close"
        actor: RegulatoryAffairsManager
        preconditions:
          - "examination.status == VALIDATION"
          - "every Issue.status == CLOSED"
          - "every CommitmentLogEntry for this exam has fulfilled_at != null"
        side_effects:
          - "sets examination.status = CLOSED"
          - "increments examination.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /regulatory-exams/examinations/{id}/cancel"
        actor: RegulatoryAffairsManager
        preconditions:
          - "examination.status == SCHEDULED"
          - "payload.cancelled_reason non-empty"
        side_effects:
          - "sets examination.status = CANCELLED, cancelled_reason = payload"
          - "increments examination.version by 1"

  - entity: FirstDayLetterItem
    initial_state: PENDING
    terminal_states: [SUBMITTED, WAIVED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "system transition when a DocumentSubmission for this item transitions PENDING_REVIEW -> ACCEPTED"
        actor: system
        preconditions:
          - "first_day_letter_item.status == PENDING"
          - "triggering DocumentSubmission.quality_status transitions to ACCEPTED"
        side_effects:
          - "sets first_day_letter_item.status = SUBMITTED, submitted_at = now"
          - "increments first_day_letter_item.version by 1"
          - "recomputes examination.overdue_item_count"
          - "recomputes examination.posture (may relax FROZEN/RESTRICTED)"
          - "increments examination.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /regulatory-exams/first-day-items/{id}/waive"
        actor: RegulatoryAffairsManager
        preconditions:
          - "first_day_letter_item.status == PENDING"
          - "payload.waived_reason non-empty"
        side_effects:
          - "sets status = WAIVED, waived_reason = payload"
          - "recomputes examination.overdue_item_count and posture"
          - "increments first_day_letter_item.version and examination.version by 1"

  - entity: DocumentSubmission
    initial_state: PENDING_REVIEW
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /regulatory-exams/document-submissions/{id}/accept"
        actor: ComplianceReviewer
        preconditions:
          - "document_submission.quality_status == PENDING_REVIEW"
          - "parent FirstDayLetterItem.status == PENDING"
          - "examination.status IN {FIRST_DAY_ISSUED, FIELDWORK}"
          - "examination.posture != FROZEN"
        side_effects:
          - "sets quality_status = ACCEPTED"
          - "transitions parent FirstDayLetterItem PENDING -> SUBMITTED"
          - "recomputes examination.overdue_item_count and posture"
          - "increments document_submission.version, first_day_letter_item.version, examination.version"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /regulatory-exams/document-submissions/{id}/reject"
        actor: ComplianceReviewer
        preconditions:
          - "document_submission.quality_status == PENDING_REVIEW"
          - "payload.quality_reject_reason non-empty"
        side_effects:
          - "sets quality_status = REJECTED, quality_reject_reason = payload"
          - "increments document_submission.version by 1"

  - entity: ExaminerMeeting
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /regulatory-exams/examiner-meetings/{id}/finalize"
        actor: RegulatoryAffairsManager
        preconditions:
          - "examiner_meeting.status == DRAFT"
          - "minutes_summary non-empty"
          - "examination.status IN {FIELDWORK, FINDINGS_DELIVERED}"
        side_effects:
          - "sets status = FINALIZED"
          - "increments examiner_meeting.version by 1"

  - entity: Issue
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REMEDIATION_PLANNED
        trigger: "system transition when first RemediationPlan for the issue transitions SUBMITTED -> APPROVED"
        actor: system
        preconditions:
          - "issue.status == OPEN"
          - "a RemediationPlan with issue_id = issue.id transitions SUBMITTED -> APPROVED"
        side_effects:
          - "sets issue.status = REMEDIATION_PLANNED"
          - "increments issue.version by 1"
      - from: REMEDIATION_PLANNED
        to: IN_PROGRESS
        trigger: "system transition when any RemediationMilestone of the ACTIVE plan transitions PENDING -> IN_PROGRESS"
        actor: system
        preconditions:
          - "issue.status == REMEDIATION_PLANNED"
          - "a milestone on the issue's ACTIVE plan moves to IN_PROGRESS"
        side_effects:
          - "sets issue.status = IN_PROGRESS"
          - "increments issue.version by 1"
      - from: IN_PROGRESS
        to: VALIDATION_SUBMITTED
        trigger: "POST /regulatory-exams/issues/{id}/submit-validation"
        actor: RemediationOwner
        preconditions:
          - "issue.status == IN_PROGRESS"
          - "payload.validation_evidence_id references a ValidationEvidence with review_status == SUFFICIENT on this issue"
          - "every milestone of the ACTIVE plan has status == COMPLETE"
        side_effects:
          - "sets issue.status = VALIDATION_SUBMITTED"
          - "creates a ClosureRequest (status PENDING, request_round = count prior + 1, validation_evidence_id = payload)"
          - "re-evaluates examination auto-transition to VALIDATION"
          - "increments issue.version and examination.version by 1"
      - from: VALIDATION_SUBMITTED
        to: CLOSED
        trigger: "system transition when the latest ClosureRequest transitions PENDING -> APPROVED"
        actor: system
        preconditions:
          - "issue.status == VALIDATION_SUBMITTED"
          - "latest ClosureRequest.status transitions to APPROVED"
        side_effects:
          - "sets issue.status = CLOSED, closed_at = now"
          - "re-evaluates examination auto-transition to VALIDATION/CLOSED readiness"
          - "increments issue.version and examination.version by 1"
      - from: VALIDATION_SUBMITTED
        to: IN_PROGRESS
        trigger: "system transition when the latest ClosureRequest transitions PENDING -> REJECTED (revision loop)"
        actor: system
        preconditions:
          - "issue.status == VALIDATION_SUBMITTED"
          - "latest ClosureRequest.status transitions to REJECTED"
        side_effects:
          - "sets issue.status = IN_PROGRESS"
          - "increments issue.version and examination.version by 1"
      - from: OPEN
        to: OVERDUE
        trigger: "system clock-driven transition when logical current date > issue.due_date and status == OPEN"
        actor: system
        preconditions:
          - "issue.status IN {OPEN, REMEDIATION_PLANNED, IN_PROGRESS}"
          - "logical current date > issue.due_date"
        side_effects:
          - "sets issue.status = OVERDUE"
          - "recomputes examination.repeat_finding_risk_score_bp"
          - "increments issue.version and examination.version by 1"
          - "if is_repeat_finding == true OR days_overdue >= agency.escalation_threshold_days, sets issue.escalated_to_board = true"
      - from: OVERDUE
        to: IN_PROGRESS
        trigger: "system transition when a milestone moves IN_PROGRESS while issue is OVERDUE (resume work)"
        actor: system
        preconditions:
          - "issue.status == OVERDUE"
          - "a milestone on the ACTIVE plan moves to IN_PROGRESS"
        side_effects:
          - "sets issue.status = IN_PROGRESS (escalated_to_board flag remains true if previously set)"
          - "increments issue.version by 1"

  - entity: RemediationPlan
    initial_state: DRAFT
    terminal_states: [COMPLETE, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /regulatory-exams/remediation-plans/{id}/submit"
        actor: RemediationOwner
        preconditions:
          - "remediation_plan.status == DRAFT"
          - "at least one RemediationMilestone exists for this plan"
          - "issue.status IN {OPEN, REMEDIATION_PLANNED, IN_PROGRESS, OVERDUE}"
        side_effects:
          - "sets status = SUBMITTED, submitted_at = now"
          - "increments remediation_plan.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /regulatory-exams/remediation-plans/{id}/approve"
        actor: ComplianceReviewer
        preconditions:
          - "remediation_plan.status == SUBMITTED"
          - "reviewer.certification_level == L3 when issue.classification == MRIA (L1+ sufficient for MRA)"
          - "no other RemediationPlan for the same issue currently has status == ACTIVE"
        side_effects:
          - "sets status = APPROVED, approved_at = now"
          - "transitions issue OPEN -> REMEDIATION_PLANNED when applicable"
          - "increments remediation_plan.version and issue.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /regulatory-exams/remediation-plans/{id}/activate"
        actor: RemediationOwner
        preconditions:
          - "remediation_plan.status == APPROVED"
          - "issue.status IN {REMEDIATION_PLANNED, IN_PROGRESS, OVERDUE}"
        side_effects:
          - "sets status = ACTIVE"
          - "increments remediation_plan.version by 1"
      - from: ACTIVE
        to: COMPLETE
        trigger: "system transition when every RemediationMilestone of this plan has status == COMPLETE"
        actor: system
        preconditions:
          - "remediation_plan.status == ACTIVE"
          - "every milestone.status == COMPLETE"
          - "at least one milestone exists"
        side_effects:
          - "sets status = COMPLETE"
          - "increments remediation_plan.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /regulatory-exams/remediation-plans/{id}/reject"
        actor: ComplianceReviewer
        preconditions:
          - "remediation_plan.status == SUBMITTED"
          - "payload.rejection_reason non-empty"
        side_effects:
          - "sets status = REJECTED"
          - "increments remediation_plan.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /regulatory-exams/remediation-plans/{id}/revise"
        actor: RemediationOwner
        preconditions:
          - "remediation_plan.status == REJECTED"
        side_effects:
          - "sets status = DRAFT (revision loop)"
          - "increments remediation_plan.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system transition when a NEWER RemediationPlan for the same issue transitions APPROVED -> ACTIVE"
        actor: system
        preconditions:
          - "remediation_plan.status == ACTIVE"
          - "another plan with same issue_id and higher plan_version transitions to ACTIVE"
        side_effects:
          - "sets status = SUPERSEDED"
          - "milestones of superseded plan that are PENDING become OVERDUE-equivalent (frozen: no further transitions)"
          - "increments remediation_plan.version by 1"

  - entity: RemediationMilestone
    initial_state: PENDING
    terminal_states: [COMPLETE, OVERDUE]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /regulatory-exams/remediation-milestones/{id}/start"
        actor: RemediationOwner
        preconditions:
          - "remediation_milestone.status == PENDING"
          - "parent RemediationPlan.status == ACTIVE"
          - "all milestones with smaller sequence_index on same plan have status IN {IN_PROGRESS, COMPLETE}"
        side_effects:
          - "sets status = IN_PROGRESS"
          - "transitions parent issue REMEDIATION_PLANNED -> IN_PROGRESS when applicable"
          - "increments milestone.version, plan.version, issue.version by 1"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /regulatory-exams/remediation-milestones/{id}/complete"
        actor: RemediationOwner
        preconditions:
          - "remediation_milestone.status == IN_PROGRESS"
        side_effects:
          - "sets status = COMPLETE, completed_at = now"
          - "re-evaluates RemediationPlan ACTIVE -> COMPLETE"
          - "increments milestone.version and plan.version by 1"
      - from: PENDING
        to: OVERDUE
        trigger: "system clock-driven transition when logical current date > due_date and status == PENDING"
        actor: system
        preconditions:
          - "status == PENDING"
          - "logical current date > milestone.due_date"
        side_effects:
          - "sets status = OVERDUE"
          - "recomputes examination.posture (may escalate to RESTRICTED/FROZEN)"
          - "increments milestone.version and examination.version by 1"
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system clock-driven transition when logical current date > due_date and status == IN_PROGRESS"
        actor: system
        preconditions:
          - "status == IN_PROGRESS"
          - "logical current date > milestone.due_date"
        side_effects:
          - "sets status = OVERDUE"
          - "recomputes examination.posture"
          - "increments milestone.version and examination.version by 1"

  - entity: ValidationEvidence
    initial_state: PENDING
    terminal_states: [SUFFICIENT, INSUFFICIENT]
    transitions:
      - from: PENDING
        to: SUFFICIENT
        trigger: "POST /regulatory-exams/validation-evidence/{id}/mark-sufficient"
        actor: ComplianceReviewer
        preconditions:
          - "validation_evidence.review_status == PENDING"
        side_effects:
          - "sets review_status = SUFFICIENT"
          - "increments validation_evidence.version by 1"
      - from: PENDING
        to: INSUFFICIENT
        trigger: "POST /regulatory-exams/validation-evidence/{id}/mark-insufficient"
        actor: ComplianceReviewer
        preconditions:
          - "validation_evidence.review_status == PENDING"
          - "payload.review_notes non-empty"
        side_effects:
          - "sets review_status = INSUFFICIENT, review_notes = payload"
          - "increments validation_evidence.version by 1"

  - entity: ClosureRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /regulatory-exams/closure-requests/{id}/approve"
        actor: ComplianceReviewer
        preconditions:
          - "closure_request.status == PENDING"
          - "reviewer.certification_level == L3 when issue.classification == MRIA"
          - "validation_evidence referenced still has review_status == SUFFICIENT"
          - "reviewer.id != issue's ACTIVE remediation plan's owner_user_id (segregation of duties)"
        side_effects:
          - "sets status = APPROVED, reviewed_by_user_id = caller"
          - "transitions parent Issue VALIDATION_SUBMITTED -> CLOSED"
          - "recomputes examination.repeat_finding_risk_score_bp (closed issues drop out of forward-looking set)"
          - "increments closure_request.version, issue.version, examination.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /regulatory-exams/closure-requests/{id}/reject"
        actor: ComplianceReviewer
        preconditions:
          - "closure_request.status == PENDING"
          - "payload.rejection_reason non-empty"
          - "reviewer.id != issue's ACTIVE remediation plan's owner_user_id (segregation of duties)"
        side_effects:
          - "sets status = REJECTED, reviewed_by_user_id = caller, rejection_reason = payload"
          - "transitions parent Issue VALIDATION_SUBMITTED -> IN_PROGRESS"
          - "increments closure_request.version, issue.version, examination.version by 1"

  - entity: BoardReport
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /regulatory-exams/board-reports/{id}/finalize"
        actor: BoardReporter
        preconditions:
          - "board_report.status == DRAFT"
        side_effects:
          - "sets status = FINALIZED (immutable thereafter)"
          - "increments board_report.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: issue-create-stale-exam
    parent_entity: Examination
    write_endpoint: "POST /regulatory-exams/examinations/{id}/issues"
    occ_field: "expected_examination_version"
    description: |
      Creating an Issue against an Examination whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has filed an issue, modified the first-day-item
      roster, or transitioned the exam since the client's last read, making
      the client's view of the exam's findings baseline stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: milestone-create-stale-plan
    parent_entity: RemediationPlan
    write_endpoint: "POST /regulatory-exams/remediation-plans/{id}/milestones"
    occ_field: "expected_plan_version"
    description: |
      Creating a RemediationMilestone against a RemediationPlan whose version
      has advanced since the client last observed it is rejected. A client
      holding a stale plan view would otherwise interleave sequence_index
      values against a milestone roster that has already been mutated.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: closure-approve-stale-issue
    parent_entity: Issue
    write_endpoint: "POST /regulatory-exams/closure-requests/{id}/approve"
    occ_field: "expected_issue_version"
    description: |
      Approving a ClosureRequest while carrying a stale view of the parent
      Issue's version is rejected. The issue's version advances whenever its
      state, evidence linkage, or escalation flag changes; approving against
      a stale version would silently close a materially different issue than
      the reviewer inspected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: repeat_finding_risk
    trigger: "Recomputed whenever an Issue is created, closed, marked OVERDUE, or when an examination's posture is recalculated. Stored on examination.repeat_finding_risk_score_bp."
    algorithm: weighted_scoring
    formula: |
      # Evaluation order (pinned to avoid circular ambiguity):
      #   step 1: base_severity per issue (severity -> bp)
      #   step 2: repeat multiplier from agency.repeat_finding_multiplier_bp
      #   step 3: overdue surcharge (only for forward_looking variant)
      #   step 4: aggregate weighted sum, cap at MAX_SCORE_BP
      #
      # Base table (bp):
      #   LOW -> 2500, MODERATE -> 5000, HIGH -> 7500, CRITICAL -> 10000
      #
      # For each issue in input_set:
      #   raw = base[issue.severity]
      #   if issue.is_repeat_finding: raw = raw * agency.repeat_finding_multiplier_bp / 10000
      #   (variant point — see variants)
      # score_bp = min(sum over issues, MAX_SCORE_BP)
    input_set: "Issues where examination_id = exam.id. Variant determines which statuses are included (see variants)."
    constants:
      LOW_BP: 2500
      MODERATE_BP: 5000
      HIGH_BP: 7500
      CRITICAL_BP: 10000
      MAX_SCORE_BP: 100000
      OVERDUE_SURCHARGE_BP_PER_DAY: 25
      OVERDUE_SURCHARGE_CAP_BP: 5000
    precision: "integer basis points; intermediate repeat multiplication uses round-half-up to integer bp before summing"
    variants:
      - name: forward_looking
        when: "Used for BoardReport.total_repeat_finding_risk_bp snapshots and examination.repeat_finding_risk_score_bp when the exam is in REMEDIATION or earlier"
        difference: "Includes issues with status IN {OPEN, REMEDIATION_PLANNED, IN_PROGRESS, OVERDUE, VALIDATION_SUBMITTED} (excludes CLOSED). Adds per-issue overdue surcharge: min(days_overdue * 25, 5000) bp, only for status == OVERDUE."
      - name: historical
        when: "Used for cross-exam trend reporting (GET /regulatory-exams/examinations/{id}/risk-history)"
        difference: "Includes issues with status IN {CLOSED, OVERDUE, VALIDATION_SUBMITTED} only — captures resolved exposure. Does NOT add the overdue surcharge; closed issues contribute their final-severity base (with repeat multiplier) only."

  - name: first_day_letter_due_date
    trigger: "Computed at Examination creation; stored on examination.first_day_letter_due_date"
    algorithm: chronological
    formula: |
      # Business-day arithmetic (Mon–Fri are business days; Sat/Sun are not).
      # If scheduled_start_date falls on a business day, that day counts as day 1.
      # Otherwise the next business day is day 1.
      # Advance 10 business days total; the resulting date is due_date (inclusive).
      d = scheduled_start_date
      if weekday(d) in {Sat, Sun}: d = next Monday
      # d is now day 1
      count = 1
      while count < 10:
          d = d + 1 day
          if weekday(d) in {Mon..Fri}: count += 1
      return date(d)
    input_set: "Single Examination.scheduled_start_date"
    constants:
      BUSINESS_DAY_COUNT: 10
    precision: "date-granularity (no time component on output)"

  - name: overdue_item_count
    trigger: "Recomputed when a FirstDayLetterItem is created, submitted, waived, or when the logical clock advances past a due_date"
    algorithm: aggregation
    formula: |
      overdue_item_count = count of FirstDayLetterItem where
          examination_id = exam.id
          AND status == PENDING
          AND due_date < current_logical_date (strict less-than; an item due today is NOT overdue)
    input_set: "FirstDayLetterItem rows for the exam with status == PENDING and due_date strictly before current logical date"
    precision: "integer count"

  - name: exam_posture
    trigger: "Recomputed whenever overdue_item_count changes, an issue transitions to OVERDUE, a milestone becomes OVERDUE, or days-past-due crosses agency.escalation_threshold_days"
    algorithm: threshold
    formula: |
      # Pinned evaluation order (threshold then set semantics):
      #   1. compute overdue_item_count (see overdue_item_count calc)
      #   2. compute overdue_issue_max_days = max days any Issue with status == OVERDUE
      #      has been overdue (logical_current_date - issue.due_date in days); 0 if none
      #   3. compute any_milestone_overdue = exists RemediationMilestone
      #      with status == OVERDUE on any plan of any issue of this exam
      #
      # if overdue_item_count >= FROZEN_ITEM_THRESHOLD  -> FROZEN
      # else if overdue_issue_max_days >= agency.escalation_threshold_days -> FROZEN
      # else if overdue_item_count >= 1 OR any_milestone_overdue -> RESTRICTED
      # else -> NORMAL
      #
      # Boundary: ">= FROZEN_ITEM_THRESHOLD" is inclusive at 3 (exactly 3 -> FROZEN).
      # "overdue_issue_max_days >= threshold" is inclusive at the threshold value.
    input_set: "overdue_item_count, Issue rows with status == OVERDUE, RemediationMilestone rows with status == OVERDUE (joined via plan.issue.examination_id = exam.id)"
    constants:
      FROZEN_ITEM_THRESHOLD: 3
    precision: "integer day counts; boundary is >= (inclusive)"

  - name: milestone_sequence_gap_allocation
    trigger: "Computed at milestone creation to assign sequence_index when payload requests next-available"
    algorithm: constraint_propagation
    formula: |
      # If payload.sequence_index omitted:
      #   assigned = max(existing sequence_index on this plan) + 1 (or 1 if none)
      # If provided and already used on this plan -> ERR_DUPLICATE_SEQUENCE.
      # Order-sensitive: when two milestones would be created against the same
      # plan, the request carrying the lower created_at order is processed
      # first; ties on created_at are impossible (server-stamped with ms
      # precision, but if two records land at the same ms, the request whose
      # payload milestone_name sorts lexicographically ASC wins).
    input_set: "RemediationMilestone rows on the parent plan"
    precision: "integer"

  - name: repeat_finding_detection
    trigger: "Computed at Issue creation; stored on issue.is_repeat_finding"
    algorithm: projection
    formula: |
      # Normalize issue_ref: strip whitespace, uppercase, drop any trailing
      # "-R<n>" suffix (e.g. "MRA-2026-07-R2" -> "MRA-2026-07").
      # is_repeat_finding = true IFF there exists a CLOSED Issue j' such that
      #   j'.id != new_issue.id
      #   AND j'.examination.agency_id == new_issue.examination.agency_id
      #   AND normalize(j'.issue_ref) == normalize(new_issue.issue_ref)
      #   AND j'.closed_at < new_issue.created_at (strictly prior closure)
      # Tie-break: if multiple prior closures match, the LATEST closed_at is
      # used; ties on closed_at (same ms) are broken by the lexicographically
      # smaller j'.issue_ref.
    input_set: "All CLOSED Issue rows whose examination belongs to the same agency_id as the new issue's examination"
    precision: "boolean"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-referenced resource exists (examination, item, submission, plan, milestone, issue, evidence, closure request, report, officer, reviewer)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource state-machine precondition satisfied for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: ClosureRequest reviewer MUST NOT equal the owner_user_id of the issue's ACTIVE remediation plan; DocumentSubmission reviewer MUST NOT equal the officer who originally created the parent FirstDayLetterItem's examination linkage when that officer is the same user (checked via acting reviewer id vs recorded owner id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /regulatory-exams/closure-requests/{id}/approve", "POST /regulatory-exams/closure-requests/{id}/reject"]

  - priority: 6
    category: business_safety
    check: "Certification gate: reviewer.certification_level MUST be L3 when issue.classification == MRIA (plan approve, closure approve); L1/L2 sufficient for MRA"
    error_id: ERR_CERTIFICATION_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /regulatory-exams/remediation-plans/{id}/approve", "POST /regulatory-exams/closure-requests/{id}/approve"]

  - priority: 7
    category: business_constraint
    check: "OCC: payload.expected_<parent>_version MUST equal current parent.version on OCC-guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /regulatory-exams/examinations/{id}/issues", "POST /regulatory-exams/remediation-plans/{id}/milestones", "POST /regulatory-exams/closure-requests/{id}/approve"]

  - priority: 8
    category: business_temporal
    check: "Examination temporal overlap: new Examination for the same agency_id MUST NOT have [scheduled_start_date, scheduled_end_date] overlapping any existing examination for that agency with status NOT IN {CANCELLED, CLOSED}. Half-open interval: existing [s1,e1) and new [s2,e2) overlap IFF s2 < e1 AND s1 < e2. Adjacent intervals (e1 == s2) are NOT overlap."
    error_id: ERR_EXAM_SCHEDULE_OVERLAP
    http_status: 422
    applies_to: ["POST /regulatory-exams/examinations"]

  - priority: 9
    category: business_temporal
    check: "ExaminerMeeting temporal conflict: a meeting's meeting_date MUST NOT coincide with another FINALIZED ExaminerMeeting on the same examination where the two meetings' calendar dates are equal (same UTC calendar date = conflict). Unlike exam scheduling (interval overlap), this is a point collision on the date grain."
    error_id: ERR_MEETING_DATE_CONFLICT
    http_status: 422
    applies_to: ["POST /regulatory-exams/examiner-meetings"]

  - priority: 10
    category: business_temporal
    check: "scheduled_end_date MUST be strictly after scheduled_start_date; reporting_period_end >= reporting_period_start"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: ["POST /regulatory-exams/examinations", "POST /regulatory-exams/board-reports"]

  - priority: 11
    category: business_constraint
    check: "Uniqueness: agency_code globally unique; FirstDayLetterItem.request_ref unique per examination; Issue.issue_ref unique per examination; RemediationMilestone.sequence_index unique per plan"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: ["POST /regulatory-exams/agencies", "POST /regulatory-exams/examinations/{id}/first-day-items", "POST /regulatory-exams/examinations/{id}/issues", "POST /regulatory-exams/remediation-plans/{id}/milestones"]

  - priority: 12
    category: business_constraint
    check: "Referential: every *_id foreign key in payload MUST reference an existing resource of the correct type, and (where applicable) belonging to the same examination ancestry"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "all POST/PUT with FK fields"

  - priority: 13
    category: business_fiscal
    check: "Posture gate: examination.posture == FROZEN blocks creation of new DocumentSubmission (no further submissions until posture relaxes); posture IN {RESTRICTED, FROZEN} blocks creation of new FirstDayLetterItem"
    error_id: ERR_EXAM_POSTURE_FROZEN
    http_status: 422
    applies_to: ["POST /regulatory-exams/first-day-items/{id}/submissions", "POST /regulatory-exams/examinations/{id}/first-day-items"]

  - priority: 14
    category: business_constraint
    check: "Required-field and shape: payload must contain all required fields with valid enum values and non-empty arrays where specified"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- RegulatorAgency ---
  - method: POST
    path: "/regulatory-exams/agencies"
    description: "Create a regulator agency"
    roles: [PlatformAdmin]
    code: 201
    input: [agency_code, agency_name, jurisdiction, escalation_threshold_days, repeat_finding_multiplier_bp, "active?"]
    output: RegulatorAgency
    side_effects: []

  - method: GET
    path: "/regulatory-exams/agencies"
    description: "List agencies (pagination)"
    roles: [PlatformAdmin, RegulatoryAffairsManager, ComplianceReviewer, RemediationOwner, BoardReporter]
    code: 200
    input: ["limit?", "offset?", "jurisdiction?", "active?"]
    output: RegulatorAgency[]
    side_effects: []

  - method: GET
