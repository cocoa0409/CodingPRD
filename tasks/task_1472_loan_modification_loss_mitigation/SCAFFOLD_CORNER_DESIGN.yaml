  - section: validations
    instances:
      - name: evaluation_missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1: a request without X-User-Role/X-User-ID is rejected ERR_UNAUTHENTICATED before any role, existence, or state logic runs (the application id is valid and the package is complete — still 401)."
        test_recipe:
          setup: ["one application exists (SUBMITTED)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Noah N", email: "noah@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-VAL1", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "OTHER", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent, captures: { err: $.data.error_id } }
          assert:
            - "The trigger is sent WITHOUT X-User-Role / X-User-ID headers (the `as:` line only documents intent)"
            - "error_id == ERR_UNAUTHENTICATED, http 401"

      - name: request_shape_error_precedes_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_VALIDATION]", "errors[ERR_LOAN_NOT_FOUND]"]
        distinguishing_aspect: "A body missing required hardship_type against a NONEXISTENT loan id returns ERR_VALIDATION (priority 3), not ERR_LOAN_NOT_FOUND (priority 4) — request shape is validated before resource lookup."
        test_recipe:
          setup: ["one real loan exists only to source a well-formed version placeholder; the trigger targets a different, nonexistent loan id"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Olga O", email: "olga@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-VAL2", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_v: $.data.version } }
          trigger:
            - { call: "POST /loans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/applications", payload: { expected_loan_version: "${loan_v}", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (missing hardship_type), http 400 — NOT ERR_LOAN_NOT_FOUND"

      - name: nested_parent_not_found_returns_typed_404
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "Existence is evaluated left-to-right along the path: a document submission under a nonexistent application id yields ERR_APPLICATION_NOT_FOUND."
        test_recipe:
          setup: ["borrower exists (to pass auth/ownership plumbing)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Pete P", email: "pete@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_NOT_FOUND, http 404"

      - name: program_rank_duplicate_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PROGRAM_RANK_DUPLICATE]"]
        distinguishing_aspect: "waterfall_rank is globally unique across program options (the waterfall order must be unambiguous); a duplicate rank is rejected even with a different code."
        test_recipe:
          setup: ["STD_MOD exists at rank 1"]
          setup_api_calls:
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
          trigger:
            - { call: "POST /program-options", payload: { code: "FLEX_MOD", waterfall_rank: 1, target_dti_bp: 2500, rate_floor_bp: 300, rate_step_bp: 25, max_term_months: 360, max_forbearance_pct_bp: 2000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROGRAM_RANK_DUPLICATE, http 409"

      - name: invalid_comp_year_months_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_COMP_MONTHS]"]
        distinguishing_aspect: "comp_year_months is pinned per analysis_type: STANDARD_ANNUAL must be exactly 12; POST_MODIFICATION must be 1..12 — both violations share ERR_INVALID_COMP_MONTHS."
        test_recipe:
          setup: ["loan exists"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Ruth R", email: "ruth@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-VAL5", property_state_code: "WA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 0 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
          trigger:
            - { call: "POST /loans/${loan_id}/escrow-analyses", payload: { analysis_type: "STANDARD_ANNUAL", comp_year_start_month: "2026-08", comp_year_months: 6, projected_annual_disbursements_cents: 420000 }, as: ServicingOps, captures: { err1: $.data.error_id } }
            - { call: "POST /loans/${loan_id}/escrow-analyses", payload: { analysis_type: "POST_MODIFICATION", comp_year_start_month: "2026-08", comp_year_months: 13, projected_annual_disbursements_cents: 420000 }, as: ServicingOps, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_COMP_MONTHS (STANDARD_ANNUAL requires exactly 12)"
            - "err2 == ERR_INVALID_COMP_MONTHS (POST_MODIFICATION allows at most 12); http 422 both"

      - name: payment_amount_zero_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_PAYMENT_AMOUNT_INVALID]"]
        distinguishing_aspect: "A zero/negative amount is a fiscal validation failure (priority 11) — the payment stays SCHEDULED and no suspense accrues."
        test_recipe:
          setup: ["Fixture A plan ACTIVE at first due date"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Seth S", email: "seth@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-VAL6", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "INCOME_REDUCTION", stated_monthly_income_cents: 480000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "TAX_RETURN", annual_gross_cents: 600000 }, as: Borrower, as_user_id: "${b_id}", captures: { d_tax: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_tax}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
            - { call: "GET /trial-plans?application_id=${app_id}", as: ServicingOps, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /trial-plans/${plan_id}/accept", as: Borrower, as_user_id: "${b_id}" }
            - { call: "GET /trial-plans/${plan_id}/payments", as: ServicingOps, captures: { p1: "$.data[0].id" } }
          trigger:
            - { call: "POST /trial-payments/${p1}/pay", payload: { amount_cents: 0 }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAYMENT_AMOUNT_INVALID, http 422"
            - "TrialPayment.${p1}.status still SCHEDULED; plan still ACTIVE; Loan.suspense_cents == 0"

      - name: escrow_void_blocked_when_later_analysis_applied
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ANALYSIS_VOID_BLOCKED]"]
        distinguishing_aspect: "Voids must unwind in reverse order: voiding the EARLIER of two APPLIED analyses is rejected (its restoration values were overwritten); voiding the later one first succeeds."
        test_recipe:
          setup: ["loan with two adjacent APPLIED analyses: A1 [2026-08,+12) then A2 [2027-08,+12)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Tess T", email: "tess@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-VAL7", property_state_code: "WA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 0 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /loans/${loan_id}/escrow-analyses", payload: { analysis_type: "STANDARD_ANNUAL", comp_year_start_month: "2026-08", comp_year_months: 12, projected_annual_disbursements_cents: 420000 }, as: ServicingOps, captures: { an1: $.data.id } }
            - { call: "POST /escrow-analyses/${an1}/apply", as: ServicingOps }
            - { call: "POST /loans/${loan_id}/escrow-analyses", payload: { analysis_type: "STANDARD_ANNUAL", comp_year_start_month: "2027-08", comp_year_months: 12, projected_annual_disbursements_cents: 480000 }, as: ServicingOps, captures: { an2: $.data.id } }
            - { call: "POST /escrow-analyses/${an2}/apply", as: ServicingOps }
          trigger:
            - { call: "POST /escrow-analyses/${an1}/void", as: ServicingOps, captures: { err: $.data.error_id } }
            - { call: "POST /escrow-analyses/${an2}/void", as: ServicingOps }
          assert:
            - "err == ERR_ANALYSIS_VOID_BLOCKED, http 409 (A1 has a later APPLIED analysis)"
            - "EscrowAnalysis.${an2}.status == VOIDED; Loan.${loan_id}.escrow_monthly_cents == 38333 (restored to the value A2 overwrote)"

      - name: document_reject_requires_reason
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "rejection_reason is a required input on the reject action; omitting it is a request-shape error (400), not a state error."
        test_recipe:
          setup: ["application with one SUBMITTED document"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Ugo U", email: "ugo@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-VAL8", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "OTHER", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /documents/${d_id}/reject", payload: {}, as: LossMitAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION, http 400; document stays SUBMITTED"

      - name: supersede_blocked_while_prior_application_in_trial
        claim_type: violation_to_error
        grounds: ["state_machines.LossMitApplication", "errors[ERR_APPLICATION_STATE_INVALID]"]
        distinguishing_aspect: "The create-with-supersede path refuses to supersede an application that is TRIAL_ACTIVE: the new application is rejected outright (correct OCC version, still 409) — an in-flight trial cannot be escaped by reapplying."
        test_recipe:
          setup: ["Fixture A through accepted trial (application TRIAL_ACTIVE)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Vera V", email: "vera@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-VAL9", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "INCOME_REDUCTION", stated_monthly_income_cents: 480000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
            - { call: "GET /trial-plans?application_id=${app_id}", as: ServicingOps, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /trial-plans/${plan_id}/accept", as: Borrower, as_user_id: "${b_id}" }
            - { call: "GET /loans/${loan_id}", as: ServicingOps, captures: { loan_v2: $.data.version } }
          trigger:
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v2}", hardship_type: "MEDICAL", stated_monthly_income_cents: 500000 }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_STATE_INVALID, http 409 (existing application is TRIAL_ACTIVE)"
            - "LossMitApplication.${app_id}.status remains TRIAL_ACTIVE; no new application created"

  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: list_pagination_defaults_envelope_and_filtering
        claim_type: pagination_with_filtering
        grounds: ["response_envelope", "endpoints[GET /program-options]"]
        distinguishing_aspect: "Default pagination (limit 10, offset 0) wraps arrays in the fixed envelope with total_count and has_more; limit=2 paginates (has_more true then false at offset 2); status filter narrows the set."
        test_recipe:
          setup: ["three program options exist; one RETIRED"]
          setup_api_calls:
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin, captures: { p1: $.data.id } }
            - { call: "POST /program-options", payload: { code: "FLEX_MOD", waterfall_rank: 2, target_dti_bp: 2500, rate_floor_bp: 300, rate_step_bp: 25, max_term_months: 360, max_forbearance_pct_bp: 2000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /program-options", payload: { code: "LEGACY_MOD", waterfall_rank: 3, target_dti_bp: 3600, rate_floor_bp: 400, rate_step_bp: 25, max_term_months: 360, max_forbearance_pct_bp: 1000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin, captures: { p3: $.data.id } }
            - { call: "POST /program-options/${p3}/retire", as: ServicingAdmin }
          trigger:
            - { call: "GET /program-options", as: ServicingAdmin }
            - { call: "GET /program-options?limit=2", as: ServicingAdmin }
            - { call: "GET /program-options?limit=2&offset=2", as: ServicingAdmin }
            - { call: "GET /program-options?status=RETIRED", as: ServicingAdmin }
          assert:
            - "default page: response_type == array, meta.api_request_id present, total_count == 3, has_more == false, 3 items"
            - "limit=2: 2 items, has_more == true; limit=2&offset=2: 1 item, has_more == false"
            - "status=RETIRED: total_count == 1 and the single item is ${p3}"

      - name: error_envelope_exact_shape
        claim_type: response_envelope
        grounds: ["response_envelope", "errors[ERR_ESCROW_ANALYSIS_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry exactly the fixed envelope: meta block, response_type error, and data with error_id + message — nothing else."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /escrow-analyses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ServicingOps, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ESCROW_ANALYSIS_NOT_FOUND; body has meta.api_request_id, meta.api_request_timestamp, response_type == error, data.error_id, data.message"

  # =====================================================================
  # Section: errors
  # =====================================================================
  - section: errors
    instances:
      - name: error_application_not_complete_on_early_evaluation
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPLICATION_NOT_COMPLETE]", "validations[priority=7]"]
        distinguishing_aspect: "Evaluation from ACKNOWLEDGED (documents still outstanding) is ERR_APPLICATION_NOT_COMPLETE — the OCC version is correct, so the state rule is what fires."
        test_recipe:
          setup: ["application ACKNOWLEDGED with no documents accepted; STD_MOD configured"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Will W", email: "will@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ERR1", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "OTHER", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
          trigger:
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_NOT_COMPLETE, http 409; no evaluation created"

      - name: error_sale_min_notice_clean_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_SALE_MIN_NOTICE]", "calculations.sale_eligibility_window"]
        distinguishing_aspect: "With no applications and no notices, a sale_date 9 days after referral violates only the 14-day minimum notice; day 14 exactly (2026-08-15) is allowed."
        test_recipe:
          setup: ["loan delinquency 150; case REFERRED at default clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Xiu X", email: "xiu@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ERR2", property_state_code: "AZ", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /loans/${loan_id}/foreclosure-cases", payload: { county: "Maricopa", docket_number: "FC-140" }, as: ForeclosureCounsel, captures: { fc_id: $.data.id } }
