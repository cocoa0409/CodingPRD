  - rule_id: non_linear_state_machine
    instances:
      - name: placement_lifecycle_and_health_axes_advance_independently
        grounds:
          - state_machines.MachinePlacement.placement_status
          - state_machines.MachinePlacement.operational_status
          - complexity_profile.state_machine_shape
          - calculations.telemetry_alert_evaluation
        distinguishing_aspect: |
          Parallel shape on MachinePlacement: two dimensions on the SAME entity advance on unrelated
          triggers and are only joined at the very end. install moves placement_status
          PENDING_INSTALL -> INSTALLED and leaves operational_status UP; a WARNING telemetry alert moves
          operational_status UP -> DEGRADED and leaves placement_status INSTALLED; retrieval-order moves
          placement_status INSTALLED -> RETRIEVAL_SCHEDULED and locks the dispenser out with reason
          AGREEMENT_ENDED, which by design does NOT touch the health axis (only EFFICACY_FAILURE and
          INVESTIGATION_HOLD lockouts do), so the pair is (RETRIEVAL_SCHEDULED, DEGRADED); only
          retrieval-completion joins both axes at once into (RETRIEVED, OFFLINE). Four of the five
          observed pairs are unreachable in any single-dimension reading of the lifecycle.
        test_recipe:
          setup:
            - "Logical clock starts at its 2026-08-01T00:00:00Z default."
            - "One ACTIVE agreement and one placement on model DT-88 whose min_rinse_pressure_psi is 15 (so 14 psi is a WARNING breach and 12 psi or lower would be CRITICAL)."
            - "One DET-100 dispenser on the placement, ACTIVE at dose 8.00."
            - "No service ticket is ever created, so retrieval-completion is not blocked by ERR_OPEN_TICKET_BLOCKS_RETRIEVAL."
