scenario: |
  Whistleblower Hotline & Investigation Case Management (corporate ethics & compliance office): anonymous intake channel & case creation with confidentiality controls, triage/severity assignment & routing to investigator, conflict screening for assigned investigators, interview documentation & evidence preservation, substantiation determination & remediation recommendation, retaliation monitoring after report, audit committee reporting & metrics, closure notification to reporter

domain_name: whistleblower-hotline-investigations
api_prefix: /hotline

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit          # confidentiality firewall, segregation of duties, tamper-evident event log, dual-control gates
  secondary_archetype: workflow_orchestration  # intake → triage → routing → screening → interviews → evidence → determination → remediation → monitoring → closure
  complexity_layers:
    - optimistic_concurrency       # OCC on HotlineCase.version for assignment-propose and determination-create supersede
    - cascading_side_effects       # retaliation escalation chain (flag → case → plan → event); remediation verify chain (action → case → notice)
    - selector_policy              # investigator routing: eligibility filter + ranking + tie-break + empty-pool error
    - derived_field_reconciliation # case posture (FROZEN/NORMAL) from LegalHold children; workload/count fields on StaffMember

  entity_topology: flat                        # all resources top-level under /hotline; FK links in bodies; sub-resource GETs for reverse reachability
  state_machine_shape: branching               # case machine has cycles + branches; assignment forks on screening; remediation has overdue loop
  relationship_patterns:
    - one_to_many          # HotlineCase → assignments/interviews/evidence/determinations/actions/flags/holds/events
    - self_referential     # HotlineCase.duplicate_of_case_id
    - cross_aggregate      # actor references to StaffMember (triaged_by, decided_by, uploaded_by, placed_by)
  role_model: segregation_of_duties            # 7 SoD rules: triager≠investigator, screener≠candidate, waiver≠screener, reviewer≠decider, sealer≠uploader, verifier≠creator, hold releaser≠placer
  consistency_model: immediate                 # every mutation atomic in-request; clock sweep applies deferred effects synchronously

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Staff full name" }
      - { name: email, type: string, source: input, description: "Staff email; unique across StaffMember" }
      - { name: department, type: string, source: input, description: "Owning department" }
      - { name: capabilities, type: array, source: input, description: "Subset of [INTAKE, INVESTIGATION, OFFICER]; entity-backed role calls require the matching capability", constraints: "each element in {INTAKE, INVESTIGATION, OFFICER}" }
      - { name: employment_status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | ON_LEAVE | TERMINATED; only ACTIVE staff are eligible for routing and role checks", constraints: "enum {ACTIVE, ON_LEAVE, TERMINATED}" }
      - { name: max_active_cases, type: integer, source: input, description: "Capacity cap: count of CaseAssignment rows with status ACTIVE must stay <= this", constraints: "integer >= 1" }
      - { name: active_case_count, type: integer, source: computed, default: 0, description: "Count of CaseAssignment rows with investigator_id == this staff and status == ACTIVE" }
      - { name: weighted_caseload, type: integer, source: computed, default: 0, description: "Sum of severity weights over ACTIVE assignments: CRITICAL 8, HIGH 4, MEDIUM 2, LOW 1" }

  - name: HotlineCase
    parent: null
    common_fields: true
    fields:
      - { name: channel, type: enum, source: input, description: "Intake channel", constraints: "enum {WEB_PORTAL, PHONE, EMAIL, IN_PERSON, MAIL}" }
      - { name: category, type: enum, source: input, description: "Allegation category as reported", constraints: "enum {FRAUD, HARASSMENT, SAFETY, FINANCIAL_REPORTING, DATA_PRIVACY, CONFLICT_OF_INTEREST, OTHER}" }
      - { name: confirmed_category, type: enum, source: system, description: "Category confirmed at triage; equals triage input", constraints: "enum same as category; null until TRIAGED" }
      - { name: description, type: string, source: input, description: "Allegation narrative", constraints: "length >= 20" }
      - { name: region, type: enum, source: input, description: "Region for metrics bucketing", constraints: "enum {NORTH, SOUTH, EAST, WEST}" }
      - { name: is_anonymous, type: boolean, source: input, default: true, description: "Whether reporter declined to identify" }
      - { name: reporter_contact, type: string, source: input, description: "CONFIDENTIAL: allowed only when is_anonymous == false; NEVER returned in any staff-facing response" , constraints: "required iff is_anonymous == false; redacted from all outputs" }
      - { name: reporter_access_key, type: string, source: system, description: "CONFIDENTIAL: server-minted key returned once in the POST /hotline/cases response; reporter role calls must send it as X-User-ID; redacted from all staff-facing outputs" }
      - { name: subject_employee_ids, type: array, source: input, description: "Employee identifiers named as subjects; any StaffMember whose email or display_name matches an entry is ineligible for routing on this case" }
      - { name: status, type: enum, source: system, description: "Case lifecycle state machine (§1.2)", constraints: "enum {RECEIVED, TRIAGED, ASSIGNED, UNDER_INVESTIGATION, DETERMINATION_REVIEW, REMEDIATION, CLOSURE_READY, MONITORING, REOPENED, CLOSED, REJECTED, WITHDRAWN}" }
      - { name: posture, type: enum, source: computed, default: NORMAL, description: "FROZEN iff exists LegalHold with case_id == this and status == ACTIVE, else NORMAL; gates interview creation, evidence exclusion, assignment create/activate, and CLOSURE_READY entry", constraints: "enum {NORMAL, FROZEN}" }
      - { name: severity, type: enum, source: computed, description: "Computed by severity_score at triage; bumped one band on reopen escalation", constraints: "enum {LOW, MEDIUM, HIGH, CRITICAL}; null until TRIAGED" }
      - { name: sla_days, type: integer, source: computed, description: "SLA calendar-day budget keyed on current severity: CRITICAL 30, HIGH 60, MEDIUM 90, LOW 120" }
      - { name: triaged_by_id, type: string, source: system, description: "StaffMember.id of the triaging IntakeSpecialist (audit reference); SoD: ineligible as investigator for this case" }
      - { name: assigned_investigator_id, type: string, source: system, description: "StaffMember.id of the candidate/confirmed investigator; set on assignment creation, cleared on release/supersede" }
      - { name: duplicate_of_case_id, type: string, source: input, description: "FK -> HotlineCase.id; set only on REJECT-as-duplicate; target must be in a non-terminal state", constraints: "optional; self-referential" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: closure_ready_at, type: datetime, source: system, description: "Logical clock timestamp when case entered CLOSURE_READY; null until then" }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock timestamp when case reached CLOSED; null until then" }
      - { name: retaliation_risk_score, type: integer, source: computed, default: 0, description: "Sum of weights of RetaliationFlag rows with status OPEN and flagged_at within [now-90d, now]: REPORTER_CHECKIN 3, HR_SIGNAL 2, MANUAL 1" }
      - { name: reopen_count, type: integer, source: computed, default: 0, description: "Number of MONITORING -> REOPENED escalations" }
      - { name: determination_finding, type: enum, source: system, description: "Finding of the APPROVED determination; null until approval", constraints: "enum {SUBSTANTIATED, UNSUBSTANTIATED, INCONCLUSIVE}; null" }

  - name: CaseAssignment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> HotlineCase.id" }
      - { name: investigator_id, type: string, source: system, description: "StaffMember.id of the candidate investigator (selected by routing or explicit officer override)" }
      - { name: routed_by_id, type: string, source: system, description: "StaffMember.id of the creator (audit reference)" }
      - { name: selection_mode, type: enum, source: system, description: "AUTO (selector policy) | OVERRIDE (explicit investigator_id by ComplianceOfficer)", constraints: "enum {AUTO, OVERRIDE}" }
      - { name: status, type: enum, source: system, description: "Assignment lifecycle (§1.2)", constraints: "enum {PROPOSED, CONFLICT_PENDING, CLEARED, ACTIVE, RELEASED, SUPERSEDED}" }
      - { name: screened_by_id, type: string, source: system, description: "StaffMember.id of the screener (audit reference); must differ from investigator_id" }
      - { name: conflict_type, type: enum, source: input, description: "Required when screen outcome is CONFLICT_FOUND", constraints: "enum {PERSONAL_RELATIONSHIP, FINANCIAL_INTEREST, PRIOR_INVOLVEMENT, REPORTING_LINE}; null otherwise" }
      - { name: waived_by_id, type: string, source: system, description: "StaffMember.id of the waiving ComplianceOfficer; must differ from screened_by_id and investigator_id" }
      - { name: waiver_justification, type: string, source: input, description: "Required on waive", constraints: "length >= 20" }

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> HotlineCase.id" }
      - { name: investigator_id, type: string, source: system, description: "StaffMember.id of the creating investigator; must equal case.assigned_investigator_id" }
      - { name: interviewee_role, type: enum, source: input, description: "Role of the interviewee", constraints: "enum {SUBJECT, WITNESS, REPORTER}" }
      - { name: interviewee_identifier, type: string, source: input, description: "Free-text identifier of the interviewee" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start [start, end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end; must be > scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CONDUCTED | NO_SHOW | CANCELLED", constraints: "enum {SCHEDULED, CONDUCTED, NO_SHOW, CANCELLED}" }
      - { name: summary, type: string, source: input, description: "Interview documentation; required on conclude with outcome CONDUCTED", constraints: "length >= 50 when CONDUCTED" }
      - { name: conducted_at, type: datetime, source: system, description: "Logical clock at CONDUCTED" }

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> HotlineCase.id" }
      - { name: uploaded_by_id, type: string, source: system, description: "StaffMember.id of uploader; SoD: sealer must differ" }
      - { name: evidence_type, type: enum, source: input, description: "Evidence kind", constraints: "enum {DOCUMENT, PHOTO, EMAIL, AUDIO, OTHER}" }
      - { name: description, type: string, source: input, description: "Evidence description", constraints: "length >= 10" }
      - { name: checksum, type: string, source: input, description: "SHA-256 hex of content; 64 lowercase hex chars; tamper-evidence anchor", constraints: "^[0-9a-f]{64}$" }
      - { name: captured_at, type: datetime, source: input, description: "When the evidence was originally captured" }
      - { name: status, type: enum, source: system, description: "PRESERVED -> SEALED -> EXCLUDED; PRESERVED -> EXCLUDED", constraints: "enum {PRESERVED, SEALED, EXCLUDED}" }
      - { name: sealed_by_id, type: string, source: system, description: "StaffMember.id of sealer; != uploaded_by_id" }
      - { name: excluded_by_id, type: string, source: system, description: "StaffMember.id of excluding officer" }
      - { name: exclusion_reason, type: string, source: input, description: "Required on exclude", constraints: "length >= 20" }

  - name: Determination
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> HotlineCase.id" }
      - { name: finding, type: enum, source: input, description: "Substantiation finding", constraints: "enum {SUBSTANTIATED, UNSUBSTANTIATED, INCONCLUSIVE}" }
      - { name: rationale, type: string, source: input, description: "Determination rationale", constraints: "length >= 50" }
      - { name: decided_by_id, type: string, source: system, description: "StaffMember.id of creating investigator; must equal case.assigned_investigator_id" }
      - { name: reviewed_by_id, type: string, source: system, description: "StaffMember.id of reviewing officer; SoD: != decided_by_id" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | RETURNED; DRAFT -> SUPERSEDED", constraints: "enum {DRAFT, SUBMITTED, APPROVED, RETURNED, SUPERSEDED}" }
      - { name: review_notes, type: string, source: input, description: "Required on review", constraints: "length >= 10" }

  - name: RemediationAction
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> HotlineCase.id; denormalized from parent determination for direct filtering" }
      - { name: determination_id, type: string, source: system, description: "Parent Determination.id (the APPROVED determination this action belongs to)" }
      - { name: action_type, type: enum, source: input, description: "Remediation kind", constraints: "enum {POLICY_CHANGE, DISCIPLINE, TRAINING, PROCESS_FIX, MONITORING}" }
      - { name: owner_department, type: string, source: input, description: "Department accountable for execution" }
      - { name: description, type: string, source: input, description: "Action description", constraints: "length >= 10" }
      - { name: due_date, type: datetime, source: input, description: "Due timestamp; extension must set a new due_date > now and <= now + 30 days" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> IN_PROGRESS -> VERIFIED; PROPOSED -> REJECTED; IN_PROGRESS -> OVERDUE -> IN_PROGRESS", constraints: "enum {PROPOSED, IN_PROGRESS, VERIFIED, REJECTED, OVERDUE}" }
      - { name: created_by_id, type: string, source: system, description: "StaffMember.id of proposing officer; SoD: decider/verifier must differ" }
      - { name: verified_by_id, type: string, source: system, description: "StaffMember.id of verifying officer; != created_by_id" }
      - { name: extension_count, type: integer, source: computed, default: 0, description: "Number of OVERDUE -> IN_PROGRESS extensions" }

  - name: RetaliationFlag
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> HotlineCase.id" }
      - { name: reported_via, type: enum, source: input, description: "Signal channel; reporter role forces REPORTER_CHECKIN; officer chooses HR_SIGNAL | MANUAL", constraints: "enum {REPORTER_CHECKIN, HR_SIGNAL, MANUAL}" }
      - { name: description, type: string, source: input, description: "Flag description", constraints: "length >= 10" }
      - { name: weight, type: integer, source: computed, description: "REPORTER_CHECKIN 3, HR_SIGNAL 2, MANUAL 1" }
      - { name: flagged_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: status, type: enum, source: system, description: "OPEN -> DISMISSED | ESCALATED", constraints: "enum {OPEN, DISMISSED, ESCALATED}" }
      - { name: dismissed_by_id, type: string, source: system, description: "StaffMember.id of dismissing officer" }

  - name: MonitoringPlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> HotlineCase.id; 1:1 per case, created when notice acknowledged" }
      - { name: start_at, type: datetime, source: system, description: "= notice acknowledged_at" }
      - { name: end_at, type: datetime, source: computed, description: "= start_at + 365 days" }
      - { name: check_in_interval_days, type: integer, source: system, default: 30, description: "Fixed 30-day check-in cadence" }
      - { name: next_check_in_due, type: datetime, source: computed, description: "= start_at + 30d initially; after check-in = check_in time + 30d; null while SUSPENDED or COMPLETED" }
      - { name: last_check_in_at, type: datetime, source: system, description: "Timestamp of latest check-in; null until first" }
      - { name: missed_checkin_count, type: integer, source: computed, default: 0, description: "Clock sweep increments by 1 each time now passes next_check_in_due + 3-day grace while ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> COMPLETED (window end) | SUSPENDED (case reopened)", constraints: "enum {ACTIVE, COMPLETED, SUSPENDED}" }

  - name: CaseClosureNotice
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> HotlineCase.id; 1:1 per closure cycle; latest notice per case drives monitoring" }
      - { name: closure_summary, type: string, source: system, description: "Reporter-safe redacted summary composed by the reviewing officer at approval time" }
      - { name: status, type: enum, source: system, description: "SENT -> ACKNOWLEDGED (reporter ack or auto-ack at sent_at + 14 days)", constraints: "enum {SENT, ACKNOWLEDGED}" }
      - { name: sent_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Logical clock at acknowledgment (manual or auto)" }

  - name: LegalHold
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> HotlineCase.id" }
      - { name: start_at, type: datetime, source: input, description: "Closed-interval start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Closed-interval end (inclusive); must be >= start_at" }
      - { name: reason, type: string, source: input, description: "Hold reason", constraints: "length >= 10" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RELEASED", constraints: "enum {ACTIVE, RELEASED}" }
      - { name: placed_by_id, type: string, source: system, description: "StaffMember.id of placing officer; SoD: releaser must differ" }
      - { name: released_by_id, type: string, source: system, description: "StaffMember.id of releasing officer; != placed_by_id" }

  - name: AuditCommitteeReport
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Half-open reporting window start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Half-open reporting window end (exclusive); must be > period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT -> FINALIZED -> PRESENTED; metric fields re-computed at finalize, immutable afterwards", constraints: "enum {DRAFT, FINALIZED, PRESENTED}" }
      - { name: total_received, type: integer, source: computed, description: "Cases with received_at in [period_start, period_end)" }
      - { name: total_closures, type: integer, source: computed, description: "Cases with closure_ready_at in [period_start, period_end) (any region)" }
      - { name: avg_days_to_close_calendar, type: number, source: computed, description: "Mean of (closure_ready_at - received_at) in whole UTC days over closure set; 2dp round_half_up; null if no closures" }
      - { name: avg_days_to_close_hold_adjusted, type: number, source: computed, description: "Same mean but each case's days reduced by the count of distinct UTC dates covered by any of its LegalHolds (ACTIVE or RELEASED) intersected with [received_at, closure_ready_at]; 2dp round_half_up; null if no closures" }
      - { name: org_substantiation_rate, type: number, source: computed, description: "Per-region substantiation rate (SUBSTANTIATED closures / all closures with closure_ready_at in window) rounded to 4dp half-up per region, then averaged over regions with >= 1 closure, final rounded 4dp half-up" }
      - { name: pooled_substantiation_rate, type: number, source: computed, description: "Reference variant: total SUBSTANTIATED closures / total closures in window, 4dp half-up" }
      - { name: overdue_remediation_count, type: integer, source: computed, description: "RemediationAction rows with status OVERDUE at computation time" }
      - { name: retaliation_escalation_count, type: integer, source: computed, description: "RetaliationFlag rows with status ESCALATED and flagged_at in window" }
      - { name: generated_by_id, type: string, source: system, description: "StaffMember.id or opaque id of creator" }

  - name: CaseStatusEvent
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> HotlineCase.id" }
      - { name: event_type, type: enum, source: system, description: "CASE_CREATED | TRIAGED | ASSIGNMENT_PROPOSED | SCREENED | CONFLICT_WAIVED | ASSIGNMENT_ACTIVATED | ASSIGNMENT_RELEASED | ASSIGNMENT_SUPERSEDED | DETERMINATION_DRAFTED | DETERMINATION_SUBMITTED | DETERMINATION_APPROVED | DETERMINATION_RETURNED | CLOSURE_READY | NOTICE_ACKNOWLEDGED | MONITORING_STARTED | MONITORING_COMPLETED | RETALIATION_ESCALATED | CASE_REOPENED | CASE_CLOSED | CASE_REJECTED | CASE_WITHDRAWN | LEGAL_HOLD_PLACED | LEGAL_HOLD_RELEASED", constraints: "enum of listed values" }
      - { name: from_status, type: string, source: system, description: "Prior case status or entity status; null when not applicable" }
      - { name: to_status, type: string, source: system, description: "New case status or entity status; null when not applicable" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the triggering call, or SYSTEM for clock sweeps" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the triggering call, or SYSTEM" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock at event" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: HotlineCase
    initial_state: RECEIVED
    terminal_states: [CLOSED, REJECTED, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /hotline/cases/{id}/triage with triage_decision=PROCEED"
        actor: IntakeSpecialist
        preconditions:
          - "case.status == RECEIVED (ERR_CASE_NOT_RECEIVED)"
        side_effects:
          - "confirmed_category set; severity = severity_score(...); sla_days per severity; triaged_by_id = X-User-ID"
          - "append CaseStatusEvent TRIAGED"
          - "increments HotlineCase.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /hotline/cases/{id}/triage with triage_decision=REJECT"
        actor: IntakeSpecialist
        preconditions:
          - "case.status == RECEIVED (ERR_CASE_NOT_RECEIVED)"
          - "if duplicate_of_case_id provided: target exists and its status NOT IN {CLOSED, REJECTED, WITHDRAWN} (ERR_DUPLICATE_TARGET_INVALID)"
        side_effects:
          - "duplicate_of_case_id stored when provided"
          - "append CaseStatusEvent CASE_REJECTED"
      - from: TRIAGED
        to: ASSIGNED
        trigger: "POST /hotline/cases/{id}/assignments (selector or override succeeds)"
        actor: IntakeSpecialist | ComplianceOfficer
        preconditions:
          - "case.status IN {TRIAGED, REOPENED} OR (case.status == ASSIGNED and existing assignment status IN {PROPOSED, CONFLICT_PENDING, CLEARED} to supersede) (ERR_CASE_NOT_TRIAGED_OR_REOPENED)"
          - "case.posture == NORMAL (ERR_LEGAL_HOLD_FREEZE)"
          - "expected_case_version == case.version (ERR_STALE_VERSION)"
          - "explicit investigator_id path: caller is ComplianceOfficer, target eligible, target != triaged_by_id (ERR_SOD_TRIAGER_INELIGIBLE), target not named in subject_employee_ids (ERR_SUBJECT_NAMED_AS_INVESTIGATOR)"
          - "auto path: eligibility pool non-empty (ERR_NO_ELIGIBLE_INVESTIGATOR)"
        side_effects:
          - "prior assignment in {PROPOSED, CONFLICT_PENDING, CLEARED} -> SUPERSEDED (event ASSIGNMENT_SUPERSEDED)"
          - "CaseAssignment created status=PROPOSED; assigned_investigator_id = candidate"
          - "append CaseStatusEvent ASSIGNMENT_PROPOSED"
          - "increments HotlineCase.version by 1"
      - from: REOPENED
        to: ASSIGNED
        trigger: "POST /hotline/cases/{id}/assignments"
        actor: IntakeSpecialist | ComplianceOfficer
        preconditions:
          - "same as TRIAGED -> ASSIGNED"
        side_effects:
          - "same as TRIAGED -> ASSIGNED"
      - from: ASSIGNED
        to: UNDER_INVESTIGATION
        trigger: "POST /hotline/assignments/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "assignment.status == CLEARED (ERR_ASSIGNMENT_NOT_CLEARED); a CLEARED assignment implies case.status == ASSIGNED with this candidate by construction (release/supersede always retire the assignment with the case state)"
          - "case.posture == NORMAL (ERR_LEGAL_HOLD_FREEZE)"
          - "investigator.active_case_count < investigator.max_active_cases (ERR_INVESTIGATOR_CAPACITY_EXCEEDED)"
        side_effects:
          - "assignment.status -> ACTIVE; investigator.active_case_count += 1; weighted_caseload recomputed"
          - "append CaseStatusEvent ASSIGNMENT_ACTIVATED"
          - "increments HotlineCase.version by 1"
      - from: ASSIGNED
        to: TRIAGED
        trigger: "POST /hotline/assignments/{id}/release for assignment in {PROPOSED, CONFLICT_PENDING, CLEARED}"
        actor: ComplianceOfficer
        preconditions:
          - "assignment.status IN {PROPOSED, CONFLICT_PENDING, CLEARED, ACTIVE} (ERR_ASSIGNMENT_NOT_RELEASABLE)"
        side_effects:
          - "assignment -> RELEASED; case.assigned_investigator_id cleared"
          - "append CaseStatusEvent ASSIGNMENT_RELEASED"
          - "increments HotlineCase.version by 1"
      - from: UNDER_INVESTIGATION
        to: TRIAGED
        trigger: "POST /hotline/assignments/{id}/release for ACTIVE assignment"
        actor: ComplianceOfficer
        preconditions:
          - "no Interview of this case has status == CONDUCTED (ERR_CASE_HAS_CONDUCTED_INTERVIEWS)"
        side_effects:
          - "assignment -> RELEASED; investigator.active_case_count -= 1; weighted_caseload recomputed; case.assigned_investigator_id cleared"
          - "append CaseStatusEvent ASSIGNMENT_RELEASED"
          - "increments HotlineCase.version by 1"
      - from: UNDER_INVESTIGATION
        to: DETERMINATION_REVIEW
        trigger: "POST /hotline/determinations/{id}/submit"
        actor: Investigator
        preconditions:
          - "determination.status == DRAFT (ERR_DETERMINATION_NOT_DRAFT)"
          - "caller X-User-ID == determination.decided_by_id (ERR_NOT_ASSIGNED_INVESTIGATOR)"
          - "at least one Interview of the case has status == CONDUCTED (ERR_NO_CONDUCTED_INTERVIEW)"
          - "no EvidenceItem of the case has status == PRESERVED (ERR_UNSEALED_EVIDENCE)"
        side_effects:
          - "determination -> SUBMITTED"
          - "append CaseStatusEvent DETERMINATION_SUBMITTED"
          - "increments HotlineCase.version by 1"
      - from: DETERMINATION_REVIEW
        to: UNDER_INVESTIGATION
        trigger: "POST /hotline/determinations/{id}/review with decision=RETURN"
        actor: ComplianceOfficer
        preconditions:
          - "determination.status == SUBMITTED (ERR_DETERMINATION_NOT_SUBMITTED)"
          - "caller != determination.decided_by_id (ERR_SOD_SELF_REVIEW)"
        side_effects:
          - "determination -> RETURNED; review_notes stored"
          - "append CaseStatusEvent DETERMINATION_RETURNED"
          - "increments HotlineCase.version by 1"
      - from: DETERMINATION_REVIEW
        to: REMEDIATION
        trigger: "POST /hotline/determinations/{id}/review with decision=APPROVE and finding=SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "determination.status == SUBMITTED (ERR_DETERMINATION_NOT_SUBMITTED)"
          - "caller != determination.decided_by_id (ERR_SOD_SELF_REVIEW)"
        side_effects:
          - "determination -> APPROVED; case.determination_finding = SUBSTANTIATED; closure_summary composed on notice creation later"
          - "append CaseStatusEvent DETERMINATION_APPROVED"
          - "increments HotlineCase.version by 1"
      - from: DETERMINATION_REVIEW
        to: CLOSURE_READY
        trigger: "POST /hotline/determinations/{id}/review with decision=APPROVE and finding IN {UNSUBSTANTIATED, INCONCLUSIVE}"
        actor: ComplianceOfficer
        preconditions:
          - "determination.status == SUBMITTED (ERR_DETERMINATION_NOT_SUBMITTED)"
          - "caller != determination.decided_by_id (ERR_SOD_SELF_REVIEW)"
          - "case.posture == NORMAL (ERR_LEGAL_HOLD_FREEZE)"
        side_effects:
          - "determination -> APPROVED; case.determination_finding set; closure_ready_at = now"
          - "CaseClosureNotice created status=SENT, sent_at = now, closure_summary composed by reviewing officer (passed as review payload field notice_summary)"
          - "append CaseStatusEvent DETERMINATION_APPROVED + CLOSURE_READY"
          - "increments HotlineCase.version by 1"
      - from: REMEDIATION
        to: CLOSURE_READY
        trigger: "system (auto when the open-action count becomes 0, re-evaluated on every remediation mutation and on LegalHold release)"
        actor: system
        preconditions:
          - "at least one RemediationAction row exists for the case AND zero rows have status IN {PROPOSED, IN_PROGRESS, OVERDUE} (a SUBSTANTIATED case with zero actions stays in REMEDIATION until an action is proposed and then decided/verified)"
          - "case.posture == NORMAL (evaluation deferred while FROZEN; re-evaluated on hold release)"
        side_effects:
          - "closure_ready_at = now; CaseClosureNotice created status=SENT"
          - "append CaseStatusEvent CLOSURE_READY"
          - "increments HotlineCase.version by 1"
      - from: CLOSURE_READY
        to: MONITORING
        trigger: "POST /hotline/closure-notices/{id}/acknowledge OR clock sweep auto-ack when now >= notice.sent_at + 14 days"
        actor: HotlineReporter | system
        preconditions:
          - "notice.status == SENT (ERR_NOTICE_NOT_SENT)"
          - "reporter path: X-User-ID == case.reporter_access_key (ERR_REPORTER_ACCESS_DENIED)"
        side_effects:
          - "notice -> ACKNOWLEDGED, acknowledged_at = now"
          - "MonitoringPlan created ACTIVE: start_at = acknowledged_at, end_at = start_at + 365d, next_check_in_due = start_at + 30d"
          - "append CaseStatusEvent NOTICE_ACKNOWLEDGED + MONITORING_STARTED"
          - "increments HotlineCase.version by 1"
      - from: MONITORING
        to: CLOSED
        trigger: "system (clock sweep when now >= monitoring_plan.end_at)"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "plan -> COMPLETED, next_check_in_due = null; case.closed_at = now"
          - "append CaseStatusEvent MONITORING_COMPLETED + CASE_CLOSED"
      - from: MONITORING
        to: REOPENED
        trigger: "system (cascade when a RetaliationFlag creation pushes retaliation_risk_score >= 4)"
        actor: system
        preconditions:
          - "retaliation_risk_score >= 4 after the flag insert (weights: REPORTER_CHECKIN 3, HR_SIGNAL 2, MANUAL 1; OPEN flags within [now-90d, now])"
        side_effects:
          - "all contributing OPEN flags -> ESCALATED"
          - "severity bumped one band (LOW->MEDIUM->HIGH->CRITICAL; CRITICAL stays CRITICAL); sla_days recomputed"
          - "reopen_count += 1; assigned_investigator_id cleared"
          - "MonitoringPlan -> SUSPENDED, next_check_in_due = null (caused by this reopen, link 3)"
          - "append CaseStatusEvent RETALIATION_ESCALATED + CASE_REOPENED (link 4: event rows caused by the plan/case mutations)"
          - "increments HotlineCase.version by 1"
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /hotline/cases/{id}/withdraw"
        actor: HotlineReporter
        preconditions:
          - "case.status IN {RECEIVED, TRIAGED} (ERR_CASE_NOT_WITHDRAWABLE)"
          - "X-User-ID == case.reporter_access_key (ERR_REPORTER_ACCESS_DENIED)"
        side_effects:
          - "append CaseStatusEvent CASE_WITHDRAWN"
      - from: TRIAGED
        to: WITHDRAWN
        trigger: "POST /hotline/cases/{id}/withdraw"
        actor: HotlineReporter
        preconditions:
          - "case.status IN {RECEIVED, TRIAGED} (ERR_CASE_NOT_WITHDRAWABLE)"
          - "X-User-ID == case.reporter_access_key (ERR_REPORTER_ACCESS_DENIED)"
        side_effects:
          - "append CaseStatusEvent CASE_WITHDRAWN"

  - entity: CaseAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: CLEARED
        trigger: "POST /hotline/assignments/{id}/screen with outcome=CLEAR"
        actor: IntakeSpecialist | ComplianceOfficer
        preconditions:
          - "assignment.status == PROPOSED (ERR_ASSIGNMENT_NOT_PROPOSED)"
          - "caller != assignment.investigator_id (ERR_SOD_SELF_SCREEN)"
        side_effects:
          - "screened_by_id = X-User-ID; append CaseStatusEvent SCREENED"
      - from: PROPOSED
        to: CONFLICT_PENDING
        trigger: "POST /hotline/assignments/{id}/screen with outcome=CONFLICT_FOUND"
        actor: IntakeSpecialist | ComplianceOfficer
        preconditions:
          - "assignment.status == PROPOSED (ERR_ASSIGNMENT_NOT_PROPOSED)"
          - "caller != assignment.investigator_id (ERR_SOD_SELF_SCREEN)"
          - "conflict_type provided (ERR_INVALID_REQUEST)"
        side_effects:
          - "screened_by_id = X-User-ID; conflict_type stored; append CaseStatusEvent SCREENED"
      - from: CONFLICT_PENDING
        to: CLEARED
        trigger: "POST /hotline/assignments/{id}/waive-conflict"
        actor: ComplianceOfficer
        preconditions:
          - "assignment.status == CONFLICT_PENDING (ERR_ASSIGNMENT_NOT_CONFLICT_PENDING)"
          - "caller != assignment.screened_by_id AND caller != assignment.investigator_id (ERR_SOD_SELF_WAIVER)"
        side_effects:
          - "waived_by_id = X-User-ID; waiver_justification stored; append CaseStatusEvent CONFLICT_WAIVED"
      - from: CLEARED
        to: ACTIVE
        trigger: "POST /hotline/assignments/{id}/activate (see HotlineCase ASSIGNED -> UNDER_INVESTIGATION)"
        actor: ComplianceOfficer
        preconditions: ["see case transition"]
        side_effects: ["see case transition"]
      - from: PROPOSED
        to: RELEASED
        trigger: "POST /hotline/assignments/{id}/release"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["case -> TRIAGED"]
      - from: CONFLICT_PENDING
        to: RELEASED
        trigger: "POST /hotline/assignments/{id}/release"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["case -> TRIAGED"]
      - from: CLEARED
        to: RELEASED
        trigger: "POST /hotline/assignments/{id}/release"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["case -> TRIAGED"]
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /hotline/assignments/{id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "no Interview of the case has status == CONDUCTED (ERR_CASE_HAS_CONDUCTED_INTERVIEWS)"
        side_effects: ["investigator.active_case_count -= 1; case -> TRIAGED"]
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (a newer CaseAssignment is created for the same case)"
        actor: system
        preconditions: []
        side_effects: ["append CaseStatusEvent ASSIGNMENT_SUPERSEDED"]
      - from: CONFLICT_PENDING
        to: SUPERSEDED
        trigger: "system (a newer CaseAssignment is created for the same case)"
        actor: system
        preconditions: []
        side_effects: ["append CaseStatusEvent ASSIGNMENT_SUPERSEDED"]
      - from: CLEARED
        to: SUPERSEDED
        trigger: "system (a newer CaseAssignment is created for the same case)"
        actor: system
        preconditions: []
        side_effects: ["append CaseStatusEvent ASSIGNMENT_SUPERSEDED"]

  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [CONDUCTED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /hotline/interviews/{id}/conclude with outcome=CONDUCTED"
        actor: Investigator
        preconditions:
          - "interview.status == SCHEDULED (ERR_INTERVIEW_NOT_SCHEDULED)"
          - "caller == interview.investigator_id (ERR_NOT_ASSIGNED_INVESTIGATOR)"
          - "summary provided with length >= 50 (ERR_INVALID_REQUEST)"
        side_effects:
          - "conducted_at = now"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /hotline/interviews/{id}/conclude with outcome=NO_SHOW"
        actor: Investigator
        preconditions:
          - "interview.status == SCHEDULED (ERR_INTERVIEW_NOT_SCHEDULED)"
          - "caller == interview.investigator_id (ERR_NOT_ASSIGNED_INVESTIGATOR)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hotline/interviews/{id}/conclude with outcome=CANCELLED"
        actor: Investigator | ComplianceOfficer
        preconditions:
          - "interview.status == SCHEDULED (ERR_INTERVIEW_NOT_SCHEDULED)"
        side_effects: []

  - entity: EvidenceItem
    initial_state: PRESERVED
    terminal_states: [EXCLUDED]
    transitions:
      - from: PRESERVED
        to: SEALED
        trigger: "POST /hotline/evidence-items/{id}/seal"
        actor: IntakeSpecialist | Investigator | ComplianceOfficer
        preconditions:
          - "evidence.status == PRESERVED (ERR_EVIDENCE_NOT_PRESERVED)"
          - "caller != evidence.uploaded_by_id (ERR_SOD_SELF_SEAL)"
        side_effects:
          - "sealed_by_id = X-User-ID"
      - from: PRESERVED
        to: EXCLUDED
        trigger: "POST /hotline/evidence-items/{id}/exclude"
        actor: ComplianceOfficer
        preconditions:
          - "evidence.status IN {PRESERVED, SEALED} (ERR_EVIDENCE_NOT_EXCLUDABLE)"
          - "case.posture == NORMAL (ERR_LEGAL_HOLD_FREEZE)"
          - "exclusion_reason length >= 20 (ERR_INVALID_REQUEST)"
        side_effects:
          - "excluded_by_id = X-User-ID"
      - from: SEALED
        to: EXCLUDED
        trigger: "POST /hotline/evidence-items/{id}/exclude"
        actor: ComplianceOfficer
        preconditions:
          - "evidence.status IN {PRESERVED, SEALED} (ERR_EVIDENCE_NOT_EXCLUDABLE)"
          - "case.posture == NORMAL (ERR_LEGAL_HOLD_FREEZE)"
        side_effects:
          - "excluded_by_id = X-User-ID"

  - entity: Determination
    initial_state: DRAFT
    terminal_states: [APPROVED, RETURNED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hotline/determinations/{id}/submit (see HotlineCase UNDER_INVESTIGATION -> DETERMINATION_REVIEW)"
        actor: Investigator
        preconditions: ["see case transition"]
        side_effects: ["case -> DETERMINATION_REVIEW"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /hotline/determinations/{id}/review decision=APPROVE"
        actor: ComplianceOfficer
        preconditions: ["see case transition"]
        side_effects: ["case -> REMEDIATION (SUBSTANTIATED) or CLOSURE_READY (otherwise)"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /hotline/determinations/{id}/review decision=RETURN"
        actor: ComplianceOfficer
        preconditions: ["see case transition"]
        side_effects: ["case -> UNDER_INVESTIGATION"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new Determination draft is created for the same case)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RemediationAction
    initial_state: PROPOSED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: IN_PROGRESS
        trigger: "POST /hotline/remediation-actions/{id}/decide with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "action.status == PROPOSED (ERR_REMEDIATION_INVALID_STATE)"
          - "caller != action.created_by_id (ERR_SOD_SELF_VERIFY)"
        side_effects:
          - "re-evaluate case REMEDIATION -> CLOSURE_READY rule (not triggered: count of open actions > 0)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /hotline/remediation-actions/{id}/decide with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "action.status == PROPOSED (ERR_REMEDIATION_INVALID_STATE)"
          - "caller != action.created_by_id (ERR_SOD_SELF_VERIFY)"
        side_effects:
          - "re-evaluate case REMEDIATION -> CLOSURE_READY (fires if this was the last open action and posture NORMAL)"
      - from: IN_PROGRESS
        to: VERIFIED
        trigger: "POST /hotline/remediation-actions/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "action.status == IN_PROGRESS (ERR_REMEDIATION_INVALID_STATE)"
          - "caller != action.created_by_id (ERR_SOD_SELF_VERIFY)"
        side_effects:
          - "verified_by_id = X-User-ID"
          - "re-evaluate case REMEDIATION -> CLOSURE_READY (fires if this was the last open action and posture NORMAL; that transition creates the CaseClosureNotice)"
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system (clock sweep: now > due_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: IN_PROGRESS
        trigger: "POST /hotline/remediation-actions/{id}/extend"
        actor: ComplianceOfficer
        preconditions:
          - "action.status == OVERDUE (ERR_REMEDIATION_INVALID_STATE)"
          - "new due_date > now AND <= now + 30 days (ERR_EXTENSION_WINDOW_EXCEEDED)"
        side_effects:
          - "due_date = new value; extension_count += 1"

  - entity: RetaliationFlag
    initial_state: OPEN
    terminal_states: [DISMISSED, ESCALATED]
    transitions:
      - from: OPEN
        to: DISMISSED
        trigger: "POST /hotline/retaliation-flags/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "flag.status == OPEN (ERR_FLAG_NOT_OPEN)"
        side_effects:
          - "dismissed_by_id = X-User-ID; case.retaliation_risk_score recomputed (dismissed flags excluded)"
      - from: OPEN
        to: ESCALATED
        trigger: "system (case MONITORING -> REOPENED cascade escalates all contributing OPEN flags)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MonitoringPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED, SUSPENDED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (clock sweep: now >= end_at)"
        actor: system
        preconditions: []
        side_effects: ["case MONITORING -> CLOSED"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (case MONITORING -> REOPENED cascade)"
        actor: system
        preconditions: []
        side_effects: ["next_check_in_due = null"]

  - entity: CaseClosureNotice
    initial_state: SENT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /hotline/closure-notices/{id}/acknowledge OR clock sweep auto-ack at sent_at + 14 days"
        actor: HotlineReporter | system
        preconditions: ["see HotlineCase CLOSURE_READY -> MONITORING"]
        side_effects: ["MonitoringPlan created; case -> MONITORING"]

  - entity: LegalHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /hotline/legal-holds/{id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "hold.status == ACTIVE (ERR_HOLD_NOT_ACTIVE)"
          - "caller != hold.placed_by_id (ERR_SOD_HOLD_RELEASE)"
        side_effects:
          - "released_by_id = X-User-ID; case.posture recomputed"
          - "re-evaluate case REMEDIATION -> CLOSURE_READY if case was deferred by FROZEN posture"

  - entity: AuditCommitteeReport
    initial_state: DRAFT
    terminal_states: [PRESENTED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /hotline/audit-committee-reports/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == DRAFT (ERR_REPORT_NOT_DRAFT)"
        side_effects:
          - "all metric fields re-computed as of finalize, then frozen"
      - from: FINALIZED
        to: PRESENTED
        trigger: "POST /hotline/audit-committee-reports/{id}/present"
        actor: AuditCommitteeMember | ComplianceOfficer
        preconditions:
          - "report.status == FINALIZED (ERR_REPORT_NOT_FINALIZED)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-propose-stale-case
    parent_entity: HotlineCase
    write_endpoint: "POST /hotline/cases/{id}/assignments"
    occ_field: expected_case_version
    description: |
      Creating a CaseAssignment against a HotlineCase whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just proposed an assignment (which legitimately supersedes
      the prior non-terminal assignment) and the current writer's view of the case
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: determination-draft-stale-case
    parent_entity: HotlineCase
    write_endpoint: "POST /hotline/cases/{id}/determinations"
    occ_field: expected_case_version
    description: |
      Creating a Determination draft against a HotlineCase whose version has
      advanced since the client last observed it is rejected. A new draft
      legitimately supersedes an existing DRAFT determination, so the check
      guards a writer whose supersede decision was made against a stale case.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: severity_score
    trigger: "POST /hotline/cases/{id}/triage with triage_decision=PROCEED"
    algorithm: weighted_scoring
    formula: |
      score = category_base[confirmed_category]
            + seniority_factor[subject_seniority]
            + exposure_factor[financial_exposure_band]
            + vulnerability_factor[reporter_vulnerability]
      severity = CRITICAL if score >= 75
                 HIGH     if 55 <= score <= 74
                 MEDIUM   if 35 <= score <= 54
                 LOW      if score <= 34
    input_set: "the four triage questionnaire inputs on this case only"
    constants:
      category_base: { FRAUD: 30, FINANCIAL_REPORTING: 30, SAFETY: 25, HARASSMENT: 20, DATA_PRIVACY: 20, CONFLICT_OF_INTEREST: 15, OTHER: 10 }
      seniority_factor: { EXECUTIVE: 25, MANAGER: 15, STAFF: 5, UNKNOWN: 0 }
      exposure_factor: { ABOVE_1M: 30, HIGH_1M: 20, MID_100K: 10, LOW_10K: 5, NONE: 0 }
      vulnerability_factor: { DIRECT_REPORT: 15, SAME_TEAM: 10, NONE: 0 }
      CRITICAL_MIN: 75
      HIGH_MIN: 55
      MEDIUM_MIN: 35
    precision: "integer score; band boundary uses >="

  - name: routing_workload
    trigger: "POST /hotline/cases/{id}/assignments (auto path) and StaffMember reads"
    algorithm: aggregation
    formula: |
      simple_count = count of CaseAssignment rows with investigator_id == staff.id and status == ACTIVE
      severity_weighted = sum over those rows of severity_weight[case.severity]
      Both computed over the identical assignment set; both exposed on StaffMember as
      active_case_count (simple_count) and weighted_caseload (severity_weighted).
    input_set: "CaseAssignment rows with status == ACTIVE only (RELEASED/SUPERSEDED excluded)"
    constants:
      severity_weight: { CRITICAL: 8, HIGH: 4, MEDIUM: 2, LOW: 1 }
    variants:
      - name: simple_count
        when: "capacity gate at POST /hotline/assignments/{id}/activate"
        difference: "counts assignments regardless of severity; active_case_count < max_active_cases must hold"
      - name: severity_weighted
        when: "selector ranking at POST /hotline/cases/{id}/assignments (auto path)"
        difference: "weights each ACTIVE assignment by case severity; least-weighted eligible staff wins"

  - name: routing_selector
    trigger: "POST /hotline/cases/{id}/assignments without investigator_id"
    algorithm: constraint_propagation
    formula: |
      eligibility(s) = s.employment_status == ACTIVE
                       AND 'INVESTIGATION' IN s.capabilities
                       AND s.id != case.triaged_by_id
                       AND NOT (s.email IN case.subject_employee_ids OR s.display_name IN case.subject_employee_ids)
                       AND s.active_case_count < s.max_active_cases
      ranking: weighted_caseload ASC, then active_case_count ASC, then created_at ASC
      empty pool -> ERR_NO_ELIGIBLE_INVESTIGATOR
    input_set: "all StaffMember rows"
    precision: "integer comparisons; created_at tie-break ISO8601 ASC"

  - name: days_to_close
    trigger: "AuditCommitteeReport create/finalize over cases with closure_ready_at in window"
    algorithm: aggregation
    formula: |
      Per case: calendar_days = (closure_ready_at - received_at) in whole UTC days (floor).
      hold_days = count of distinct UTC dates D such that D falls in [date(received_at), date(closure_ready_at)]
                  AND D falls inside [date(hold.start_at), date(hold.end_at)] for at least one LegalHold
                  of the case (ACTIVE or RELEASED; a date covered by two holds counts once).
      adjusted_days = calendar_days - hold_days
      Report fields are the arithmetic mean over the closure set, 2dp round_half_up.
    input_set: "cases with closure_ready_at in [period_start, period_end); statuses CLOSURE_READY, MONITORING, CLOSED, REOPENED all qualify (reopen does not erase closure_ready_at of the prior cycle)"
    variants:
      - name: calendar
        when: "report field avg_days_to_close_calendar"
        difference: "ignores legal holds entirely"
      - name: hold_adjusted
        when: "report field avg_days_to_close_hold_adjusted"
        difference: "subtracts distinct hold-covered UTC dates; identical inputs, smaller-or-equal result"

  - name: org_substantiation_rate
    trigger: "AuditCommitteeReport create/finalize"
    algorithm: aggregation
    formula: |
      Closure set: cases with closure_ready_at in [period_start, period_end).
      For each region R with >= 1 closure:
        rate_R = round_half_up(substantiated_R / closures_R, 4)
      org_substantiation_rate = round_half_up(mean(rate_R over regions with closures), 4)
      ROUNDING ORDER PINNED: round each per-region rate FIRST, then average the rounded
      values, then round the final average. (Summing all cases first and rounding once
      is the pooled variant and produces a different value; it is exposed separately as
      pooled_substantiation_rate for contrast.)
    input_set: "closure set as above; regions with zero closures excluded from the mean"
    precision: "4 decimal places, round_half_up, nested order pinned above"

  - name: effective_sla_deadline
    trigger: "SLA breach evaluation on reads of HotlineCase (derived at read time)"
    algorithm: threshold
    formula: |
      EVALUATION ORDER PINNED (circular-looking dependency resolved):
      (1) sev = case.severity as of the latest of {triage time, last reopen time}
      (2) base = date(received_at) + SLA_DAYS[sev]   (reopen does not reset received_at)
      (3) frozen_days = count of distinct UTC dates covered by any LegalHold (ACTIVE or RELEASED)
          intersected with [date(received_at), today]
      (4) deadline = base + frozen_days
      (5) breached = (today > deadline) AND case.status NOT IN {CLOSED, REJECTED, WITHDRAWN, CLOSURE_READY, MONITORING}
      Note: severity used is current severity (reopen bump moves the SLA band), but received_at
      never resets; the dependency order severity -> base -> frozen -> sum is fixed.
    constants:
      SLA_DAYS: { CRITICAL: 30, HIGH: 60, MEDIUM: 90, LOW: 120 }
    input_set: "single case + its LegalHold rows"

  - name: retaliation_risk_score
    trigger: "RetaliationFlag create/dismiss; case reads"
    algorithm: decay_function
    formula: |
      score = sum of weight[reported_via] over RetaliationFlag rows of the case with
              status == OPEN AND flagged_at IN [now - 90 days, now]
      weight: REPORTER_CHECKIN 3, HR_SIGNAL 2, MANUAL 1
      If a creation makes score >= 4 AND case.status == MONITORING: escalate (all contributing
      OPEN flags -> ESCALATED; case -> REOPENED; plan -> SUSPENDED; severity bump).
      Dismissal recomputes the score excluding the dismissed flag.
    constants:
      ESCALATION_THRESHOLD: 4
      WINDOW_DAYS: 90
    input_set: "RetaliationFlag rows of the case: status OPEN, flagged_at within rolling 90-day window inclusive of both ends"
    precision: "integer; threshold comparison uses >="

  - name: monitoring_schedule
    trigger: "notice acknowledgment, check-in, clock sweep"
    algorithm: chronological
    formula: |
      plan.start_at = notice.acknowledged_at
      plan.end_at = start_at + 365 days
      next_check_in_due = start_at + 30 days initially; after a check-in at time t: t + 30 days
      Missed check-in: while plan ACTIVE, if now > next_check_in_due + 3 days, the clock sweep
      increments missed_checkin_count by exactly 1 and advances next_check_in_due by +30 days
      (repeat evaluation catches up multiple missed intervals in one sweep).
      Plan completion: sweep sets COMPLETED when now >= end_at; case -> CLOSED.
      Auto-ack: sweep acknowledges a SENT notice when now >= sent_at + 14 days (boundary inclusive).
    constants:
      CHECKIN_INTERVAL_DAYS: 30
      CHECKIN_GRACE_DAYS: 3
      MONITORING_WINDOW_DAYS: 365
      AUTO_ACK_DAYS: 14
    precision: "all comparisons on logical clock; >= vs > pinned per rule above"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role in the declared role set"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Entity-backed roles: X-User-ID resolves to a StaffMember with employment_status == ACTIVE and the capability matching the role (INTAKE for IntakeSpecialist, INVESTIGATION for Investigator, OFFICER for ComplianceOfficer)"
    error_id: ERR_CAPABILITY_MISSING
    http_status: 403
    applies_to: "all endpoints for entity-backed roles"
  - priority: 4
    category: auth
    check: "Actor-resource binding: reporter endpoints require X-User-ID == case.reporter_access_key; Investigator action endpoints require caller == case.assigned_investigator_id / interview.investigator_id / determination.decided_by_id"
    error_id: ERR_REPORTER_ACCESS_DENIED | ERR_NOT_ASSIGNED_INVESTIGATOR
    http_status: 403
    applies_to: "reporter self-service endpoints; investigator-owned action endpoints"
  - priority: 5
    category: existence
    check: "Path resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 6
    category: existence
    check: "Request-body well-formed: required fields present, enum values valid, string length floors met, intervals well-formed (end > start for half-open; end >= start for closed), checksum format valid"
    error_id: ERR_INVALID_REQUEST | ERR_INVALID_INTERVAL
    http_status: 400
    applies_to: all mutation endpoints
  - priority: 7
    category: state
    check: "OCC: expected_case_version == HotlineCase.version where the endpoint declares it"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hotline/cases/{id}/assignments, POST /hotline/cases/{id}/determinations"
  - priority: 8
    category: state
    check: "Target entity in a legal from-state for the requested transition (case/assignment/interview/evidence/determination/action/flag/notice/plan/hold/report state preconditions)"
    error_id: "ERR_CASE_NOT_RECEIVED | ERR_CASE_NOT_TRIAGED_OR_REOPENED | ERR_CASE_NOT_UNDER_INVESTIGATION | ERR_CASE_NOT_WITHDRAWABLE | ERR_CASE_TERMINAL | ERR_ASSIGNMENT_NOT_PROPOSED | ERR_ASSIGNMENT_NOT_CONFLICT_PENDING | ERR_ASSIGNMENT_NOT_CLEARED | ERR_ASSIGNMENT_NOT_RELEASABLE | ERR_INTERVIEW_NOT_SCHEDULED | ERR_EVIDENCE_NOT_PRESERVED | ERR_EVIDENCE_NOT_EXCLUDABLE | ERR_DETERMINATION_NOT_DRAFT | ERR_DETERMINATION_NOT_SUBMITTED | ERR_DETERMINATION_NOT_APPROVED | ERR_REMEDIATION_INVALID_STATE | ERR_FLAG_NOT_OPEN | ERR_HOLD_NOT_ACTIVE | ERR_NOTICE_NOT_SENT | ERR_PLAN_NOT_ACTIVE | ERR_REPORT_NOT_DRAFT | ERR_REPORT_NOT_FINALIZED"
    http_status: 409
    applies_to: all action endpoints
  - priority: 9
    category: business_safety
    check: "Confidentiality/hold freeze gate: case.posture == NORMAL required for assignment create/activate, interview create, evidence exclude, and CLOSURE_READY entry"
    error_id: ERR_LEGAL_HOLD_FREEZE
    http_status: 409
    applies_to: "POST assignments, POST activate, POST interviews, POST evidence exclude, determination review approve (non-substantiated), remediation close-out evaluation"
  - priority: 10
    category: business_constraint
    check: "Segregation of duties: triager != investigator (ERR_SOD_TRIAGER_INELIGIBLE); screener != candidate (ERR_SOD_SELF_SCREEN); waiver officer != screener and != candidate (ERR_SOD_SELF_WAIVER); reviewer != decider (ERR_SOD_SELF_REVIEW); sealer != uploader (ERR_SOD_SELF_SEAL); remediation decider/verifier != creator (ERR_SOD_SELF_VERIFY); hold releaser != placer (ERR_SOD_HOLD_RELEASE)"
    error_id: "ERR_SOD_*"
    http_status: 409
    applies_to: "assignments create (override), screen, waive, review, seal, decide, verify, hold release"
  - priority: 11
    category: business_constraint
    check: "Routing eligibility/capacity: explicit override target eligible (ERR_SUBJECT_NAMED_AS_INVESTIGATOR); auto pool non-empty (ERR_NO_ELIGIBLE_INVESTIGATOR); activate keeps active_case_count <= max_active_cases (ERR_INVESTIGATOR_CAPACITY_EXCEEDED)"
    error_id: "ERR_SUBJECT_NAMED_AS_INVESTIGATOR | ERR_NO_ELIGIBLE_INVESTIGATOR | ERR_INVESTIGATOR_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST assignments, POST activate"
  - priority: 12
    category: business_temporal
    check: "Interview half-open intervals for one investigator require >= 15-minute gap to any SCHEDULED/CONDUCTED interview (ERR_INTERVIEW_OVERLAP); LegalHold closed intervals on one case must not touch or overlap (ERR_LEGAL_HOLD_OVERLAP)"
    error_id: "ERR_INTERVIEW_OVERLAP | ERR_LEGAL_HOLD_OVERLAP"
    http_status: 409
    applies_to: "POST /hotline/interviews, POST /hotline/legal-holds"
  - priority: 13
    category: business_referential
    check: "Cross-entity integrity: duplicate_of target non-terminal (ERR_DUPLICATE_TARGET_INVALID); release of ACTIVE assignment requires zero CONDUCTED interviews (ERR_CASE_HAS_CONDUCTED_INTERVIEWS); remediation create requires APPROVED SUBSTANTIATED determination (ERR_DETERMINATION_NOT_APPROVED)"
    error_id: "ERR_DUPLICATE_TARGET_INVALID | ERR_CASE_HAS_CONDUCTED_INTERVIEWS | ERR_DETERMINATION_NOT_APPROVED"
    http_status: 409
    applies_to: "triage REJECT, assignment release, remediation create"
  - priority: 14
    category: business_referential
    check: "Determination completeness gates: >= 1 CONDUCTED interview (ERR_NO_CONDUCTED_INTERVIEW); zero PRESERVED evidence (ERR_UNSEALED_EVIDENCE); monitoring window active for flags (ERR_MONITORING_WINDOW_INACTIVE); extension window <= now+30d (ERR_EXTENSION_WINDOW_EXCEEDED)"
    error_id: "ERR_NO_CONDUCTED_INTERVIEW | ERR_UNSEALED_EVIDENCE | ERR_MONITORING_WINDOW_INACTIVE | ERR_EXTENSION_WINDOW_EXCEEDED"
    http_status: 409
    applies_to: "determination submit, retaliation flag create, remediation extend"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Staff registry ---
  - method: POST
    path: "/hotline/staff-members"
    description: "Register a staff member"
    roles: [EthicsPlatformAdmin]
    code: 201
    input: [display_name, email, department, capabilities, max_active_cases, "employment_status?"]
    output: StaffMember
    side_effects: ["employment_status defaults ACTIVE"]
  - method: GET
    path: "/hotline/staff-members"
    description: "List staff members"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: ["employment_status?", "capability?", "limit?", "offset?"]
    output: "StaffMember[]"
    side_effects: []
  - method: PATCH
    path: "/hotline/staff-members/{id}"
    description: "Update staff capacity/capabilities/employment status"
    roles: [EthicsPlatformAdmin]
    code: 200
    input: ["department?", "capabilities?", "max_active_cases?", "employment_status?"]
    output: StaffMember
    side_effects: ["increments StaffMember.version by 1"]

  # --- Case intake & lifecycle ---
  - method: POST
    path: "/hotline/cases"
    description: "Anonymous hotline intake; mints reporter_access_key; reporter_contact required iff is_anonymous == false"
    roles: [HotlineReporter]
    code: 201
    input: [channel, category, description, region, "is_anonymous?", "reporter_contact?", "subject_employee_ids?"]
    output: HotlineCase
    side_effects: ["status=RECEIVED; received_at=now; reporter_access_key minted and returned in this response only; append CASE_CREATED event"]
  - method: GET
    path: "/hotline/cases"
    description: "List cases (staff view; reporter_contact and reporter_access_key NEVER present)"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: ["status?", "severity?", "region?", "assigned_investigator_id?", "duplicate_of_case_id?", "limit?", "offset?"]
    output: "HotlineCase[]"
    side_effects: []
  - method: GET
    path: "/hotline/cases/{id}"
    description: "Get a case (staff view; redacted as above)"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: []
    output: HotlineCase
    side_effects: []
  - method: GET
    path: "/hotline/cases/{id}/reporter-status"
    description: "Reporter self-service view; X-User-ID must equal reporter_access_key"
    roles: [HotlineReporter]
    code: 200
    input: []
    output: "{ case_status: string, severity: string, closure_summary: string, monitoring_active: boolean }"
    side_effects: []
  - method: POST
    path: "/hotline/cases/{id}/withdraw"
    description: "Reporter withdraws an un-triaged/un-assigned report"
    roles: [HotlineReporter]
    code: 200
    input: []
    output: HotlineCase
    side_effects: ["RECEIVED|TRIAGED -> WITHDRAWN; CASE_WITHDRAWN event"]
  - method: POST
    path: "/hotline/cases/{id}/triage"
    description: "Triage: compute severity, set triaged_by_id, or reject (optionally as duplicate)"
    roles: [IntakeSpecialist]
    code: 200
    input: [confirmed_category, subject_seniority, financial_exposure_band, reporter_vulnerability, triage_decision, "reject_reason?", "duplicate_of_case_id?"]
    output: HotlineCase
    side_effects: ["PROCEED -> TRIAGED with severity/SLA computed; REJECT -> REJECTED; TRIAGED/CASE_REJECTED events; increments HotlineCase.version by 1"]

  # --- Assignments (routing + conflict screening) ---
  - method: POST
    path: "/hotline/cases/{id}/assignments"
    description: "Propose an assignment (auto selector or officer override); supersedes non-terminal prior assignment; OCC on case version"
    roles: [IntakeSpecialist, ComplianceOfficer]
    code: 201
    input: [expected_case_version, "investigator_id?", "override_reason?"]
    output: CaseAssignment
    side_effects: ["assignment PROPOSED; case -> ASSIGNED; assigned_investigator_id set; prior non-terminal assignment -> SUPERSEDED; ASSIGNMENT_PROPOSED (+ASSIGNMENT_SUPERSEDED) events; increments HotlineCase.version by 1"]
  - method: GET
    path: "/hotline/cases/{id}/assignments"
    description: "List assignments of a case"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CaseAssignment[]"
    side_effects: []
  - method: POST
    path: "/hotline/assignments/{id}/screen"
    description: "Conflict screening outcome; screener != candidate"
    roles: [IntakeSpecialist, ComplianceOfficer]
    code: 200
    input: [outcome, "conflict_type?", "notes?"]
    output: CaseAssignment
    side_effects: ["PROPOSED -> CLEARED | CONFLICT_PENDING; screened_by_id set; SCREENED event"]
  - method: POST
    path: "/hotline/assignments/{id}/waive-conflict"
    description: "Officer waives a found conflict; officer != screener and != candidate"
    roles: [ComplianceOfficer]
    code: 200
    input: [waiver_justification]
    output: CaseAssignment
    side_effects: ["CONFLICT_PENDING -> CLEARED; waived_by_id set; CONFLICT_WAIVED event"]
  - method: POST
    path: "/hotline/assignments/{id}/activate"
    description: "Activate a cleared assignment; capacity gate; case -> UNDER_INVESTIGATION"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CaseAssignment
    side_effects: ["CLEARED -> ACTIVE; active_case_count += 1; weighted_caseload recomputed; case -> UNDER_INVESTIGATION; ASSIGNMENT_ACTIVATED event; increments HotlineCase.version by 1"]
  - method: POST
    path: "/hotline/assignments/{id}/release"
    description: "Release an assignment (pre- or post-activation); case returns to TRIAGED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CaseAssignment
    side_effects: ["-> RELEASED; if ACTIVE: active_case_count -= 1; case -> TRIAGED; ASSIGNMENT_RELEASED event; increments HotlineCase.version by 1"]

  # --- Interviews ---
  - method: POST
    path: "/hotline/interviews"
    description: "Schedule an interview; caller must be the assigned investigator; 15-minute buffer overlap rule per investigator"
    roles: [Investigator]
    code: 201
    input: [case_id, interviewee_role, interviewee_identifier, scheduled_start, scheduled_end]
    output: Interview
    side_effects: ["status=SCHEDULED; investigator_id = caller"]
  - method: GET
    path: "/hotline/cases/{id}/interviews"
    description: "List interviews of a case"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Interview[]"
    side_effects: []
  - method: POST
    path: "/hotline/interviews/{id}/conclude"
    description: "Conclude an interview as CONDUCTED (summary >= 50 chars), NO_SHOW, or CANCELLED"
    roles: [Investigator, ComplianceOfficer]
    code: 200
    input: [outcome, "summary?"]
    output: Interview
    side_effects: ["SCHEDULED -> CONDUCTED | NO_SHOW | CANCELLED; conducted_at set on CONDUCTED"]

  # --- Evidence ---
  - method: POST
    path: "/hotline/evidence-items"
    description: "Register evidence; caller must be the assigned investigator of the case"
    roles: [Investigator]
    code: 201
    input: [case_id, evidence_type, description, checksum, captured_at]
    output: EvidenceItem
    side_effects: ["status=PRESERVED; uploaded_by_id = caller"]
  - method: GET
    path: "/hotline/cases/{id}/evidence-items"
    description: "List evidence of a case"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EvidenceItem[]"
    side_effects: []
  - method: POST
    path: "/hotline/evidence-items/{id}/seal"
    description: "Dual-control seal; sealer != uploader"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: ["PRESERVED -> SEALED; sealed_by_id set"]
  - method: POST
    path: "/hotline/evidence-items/{id}/exclude"
    description: "Exclude evidence; blocked while case FROZEN by legal hold"
    roles: [ComplianceOfficer]
    code: 200
    input: [exclusion_reason]
    output: EvidenceItem
    side_effects: ["PRESERVED|SEALED -> EXCLUDED; excluded_by_id set"]

  # --- Determinations ---
  - method: POST
    path: "/hotline/cases/{id}/determinations"
    description: "Create a determination draft; supersedes existing DRAFT; OCC on case version"
    roles: [Investigator]
    code: 201
    input: [finding, rationale, expected_case_version]
    output: Determination
    side_effects: ["draft DRAFT created; prior DRAFT -> SUPERSEDED; decided_by_id = caller; DETERMINATION_DRAFTED event; increments HotlineCase.version by 1"]
  - method: GET
    path: "/hotline/cases/{id}/determinations"
    description: "List determinations of a case"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Determination[]"
    side_effects: []
  - method: GET
    path: "/hotline/determinations/{id}"
    description: "Get a determination"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: []
    output: Determination
    side_effects: []
  - method: POST
    path: "/hotline/determinations/{id}/submit"
    description: "Submit determination; requires >= 1 CONDUCTED interview and zero PRESERVED evidence; case -> DETERMINATION_REVIEW"
    roles: [Investigator]
    code: 200
    input: []
    output: Determination
    side_effects: ["DRAFT -> SUBMITTED; case -> DETERMINATION_REVIEW; DETERMINATION_SUBMITTED event; increments HotlineCase.version by 1"]
  - method: POST
    path: "/hotline/determinations/{id}/review"
    description: "Officer approves or returns; reviewer != decider; approve(SUBSTANTIATED) -> REMEDIATION; approve(other) -> CLOSURE_READY + notice; return -> UNDER_INVESTIGATION"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, review_notes, "notice_summary?"]
    output: Determination
    side_effects: ["SUBMITTED -> APPROVED | RETURNED; case transition per finding; CaseClosureNotice SENT created when entering CLOSURE_READY (notice_summary required then); increments HotlineCase.version by 1"]

  # --- Remediation ---
  - method: POST
    path: "/hotline/determinations/{id}/remediation-actions"
    description: "Propose a remediation action on an APPROVED SUBSTANTIATED determination"
    roles: [ComplianceOfficer]
    code: 201
    input: [action_type, owner_department, description, due_date]
    output: RemediationAction
    side_effects: ["status=PROPOSED; created_by_id = caller; case_id denormalized"]
  - method: GET
    path: "/hotline/cases/{id}/remediation-actions"
    description: "List remediation actions of a case"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RemediationAction[]"
    side_effects: []
  - method: POST
    path: "/hotline/remediation-actions/{id}/decide"
    description: "Approve (-> IN_PROGRESS) or reject a proposed action; decider != creator"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: RemediationAction
    side_effects: ["PROPOSED -> IN_PROGRESS | REJECTED; re-evaluate case close-out rule"]
  - method: POST
    path: "/hotline/remediation-actions/{id}/verify"
    description: "Verify completion; verifier != creator; last-open-action verification cascades case -> CLOSURE_READY + notice"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RemediationAction
    side_effects: ["IN_PROGRESS -> VERIFIED; verified_by_id set; cascade: if zero open actions remain and posture NORMAL: case -> CLOSURE_READY, CaseClosureNotice SENT created, CLOSURE_READY event"]
  - method: POST
    path: "/hotline/remediation-actions/{id}/extend"
    description: "Extend an OVERDUE action; new due_date in (now, now+30d]"
    roles: [ComplianceOfficer]
    code: 200
    input: [due_date]
    output: RemediationAction
    side_effects: ["OVERDUE -> IN_PROGRESS; extension_count += 1"]

  # --- Closure notice & monitoring ---
  - method: GET
    path: "/hotline/cases/{id}/closure-notices"
    description: "List closure notices of a case (0..1 per closure cycle)"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: []
    output: "CaseClosureNotice[]"
    side_effects: []
  - method: POST
    path: "/hotline/closure-notices/{id}/acknowledge"
    description: "Reporter acknowledges closure; creates MonitoringPlan; case -> MONITORING"
    roles: [HotlineReporter]
    code: 200
    input: []
    output: CaseClosureNotice
    side_effects: ["SENT -> ACKNOWLEDGED; MonitoringPlan ACTIVE created; case -> MONITORING; NOTICE_ACKNOWLEDGED + MONITORING_STARTED events"]
  - method: GET
    path: "/hotline/cases/{id}/monitoring-plans"
    description: "List monitoring plans of a case (0..1)"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: []
    output: "MonitoringPlan[]"
    side_effects: []
  - method: POST
    path: "/hotline/monitoring-plans/{id}/check-in"
    description: "Record a monitoring check-in; resets next_check_in_due = now + 30d"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MonitoringPlan
    side_effects: ["last_check_in_at = now; next_check_in_due = now + 30 days"]

  # --- Retaliation ---
  - method: POST
    path: "/hotline/cases/{id}/retaliation-flags"
    description: "File a retaliation signal; reporter role (access key) forces REPORTER_CHECKIN; officer picks HR_SIGNAL | MANUAL; escalation cascade at score >= 4"
    roles: [HotlineReporter, ComplianceOfficer]
    code: 201
    input: ["reported_via?", description]
    output: RetaliationFlag
    side_effects: ["flag OPEN created with computed weight; case.retaliation_risk_score recomputed; if score >= 4 and case MONITORING: flags -> ESCALATED, case -> REOPENED (severity bump, reopen_count += 1), plan -> SUSPENDED, events appended"]
  - method: GET
    path: "/hotline/cases/{id}/retaliation-flags"
    description: "List retaliation flags of a case"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RetaliationFlag[]"
    side_effects: []
  - method: POST
    path: "/hotline/retaliation-flags/{id}/dismiss"
    description: "Dismiss an OPEN flag; risk score recomputed excluding it"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RetaliationFlag
    side_effects: ["OPEN -> DISMISSED; dismissed_by_id set; case.retaliation_risk_score recomputed"]

  # --- Legal holds ---
  - method: POST
    path: "/hotline/legal-holds"
    description: "Place a legal hold (closed interval); overlapping ACTIVE hold on same case rejected; target case must be non-terminal (ERR_CASE_TERMINAL); case posture -> FROZEN"
    roles: [ComplianceOfficer]
    code: 201
    input: [case_id, start_at, end_at, reason]
    output: LegalHold
    side_effects: ["status=ACTIVE; placed_by_id = caller; case.posture recomputed (FROZEN); LEGAL_HOLD_PLACED event"]
  - method: GET
    path: "/hotline/cases/{id}/legal-holds"
    description: "List legal holds of a case"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, EthicsPlatformAdmin]
    code: 200
    input: ["status?"]
    output: "LegalHold[]"
    side_effects: []
  - method: POST
    path: "/hotline/legal-holds/{id}/release"
    description: "Release a hold; releaser != placer; posture recomputed; deferred close-out re-evaluated"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LegalHold
    side_effects: ["ACTIVE -> RELEASED; released_by_id set; case.posture recomputed; LEGAL_HOLD_RELEASED event; if case REMEDIATION with zero open actions: case -> CLOSURE_READY + notice"]

  # --- Audit committee reporting ---
  - method: POST
    path: "/hotline/audit-committee-reports"
    description: "Create a DRAFT report with metric snapshot over [period_start, period_end)"
    roles: [ComplianceOfficer]
    code: 201
    input: [period_start, period_end]
    output: AuditCommitteeReport
    side_effects: ["status=DRAFT; metrics computed at creation"]
  - method: GET
    path: "/hotline/audit-committee-reports"
    description: "List reports"
    roles: [ComplianceOfficer, AuditCommitteeMember, EthicsPlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AuditCommitteeReport[]"
    side_effects: []
  - method: POST
    path: "/hotline/audit-committee-reports/{id}/finalize"
    description: "Re-compute and freeze metrics; report DRAFT -> FINALIZED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AuditCommitteeReport
    side_effects: ["metrics re-computed then immutable"]
  - method: POST
    path: "/hotline/audit-committee-reports/{id}/present"
    description: "Mark report presented to the audit committee"
    roles: [AuditCommitteeMember, ComplianceOfficer]
    code: 200
    input: []
    output: AuditCommitteeReport
    side_effects: ["FINALIZED -> PRESENTED"]

  # --- Audit trail ---
  - method: GET
    path: "/hotline/cases/{id}/case-status-events"
    description: "Append-only event log of a case"
    roles: [IntakeSpecialist, Investigator, ComplianceOfficer, AuditCommitteeMember, EthicsPlatformAdmin]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: "CaseStatusEvent[]"
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default before any call: 2026-08-01T00:00:00Z (server never falls back to wall-clock). Sweep effects applied synchronously: remediation OVERDUE marking; notice auto-ack at sent_at + 14d (creates MonitoringPlan, case -> MONITORING); missed check-in accounting; plan completion at end_at (case -> CLOSED)"
    roles: [EthicsPlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sweep effects listed in description"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_CAPABILITY_MISSING, http: 403, condition: "Entity-backed role: staff missing matching capability or not ACTIVE" }
  - { id: ERR_REPORTER_ACCESS_DENIED, http: 403, condition: "Reporter endpoint: X-User-ID != case.reporter_access_key" }
  - { id: ERR_NOT_ASSIGNED_INVESTIGATOR, http: 403, condition: "Caller is not the assigned investigator / decider / interview owner" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, length floor unmet, checksum malformed, or invalid triage/screen/review payload" }
  - { id: ERR_INVALID_INTERVAL, http: 400, condition: "Interval malformed: interview end <= start, or hold end < start, or report period_end <= period_start" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version != HotlineCase.version (OCC)" }
  - { id: ERR_CASE_NOT_RECEIVED, http: 409, condition: "Triage requires case RECEIVED" }
  - { id: ERR_CASE_NOT_TRIAGED_OR_REOPENED, http: 409, condition: "Assignment create requires case TRIAGED/REOPENED or supersede-eligible ASSIGNED" }
  - { id: ERR_CASE_NOT_UNDER_INVESTIGATION, http: 409, condition: "Interview/evidence/determination-create require case UNDER_INVESTIGATION" }
  - { id: ERR_CASE_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw requires case RECEIVED or TRIAGED" }
  - { id: ERR_CASE_TERMINAL, http: 409, condition: "Legal-hold create on a CLOSED/REJECTED/WITHDRAWN case (holds only on non-terminal cases)" }
  - { id: ERR_ASSIGNMENT_NOT_PROPOSED, http: 409, condition: "Screen requires assignment PROPOSED" }
  - { id: ERR_ASSIGNMENT_NOT_CONFLICT_PENDING, http: 409, condition: "Waive requires assignment CONFLICT_PENDING" }
  - { id: ERR_ASSIGNMENT_NOT_CLEARED, http: 409, condition: "Activate requires assignment CLEARED" }
  - { id: ERR_ASSIGNMENT_NOT_RELEASABLE, http: 409, condition: "Release from terminal assignment state" }
  - { id: ERR_INTERVIEW_NOT_SCHEDULED, http: 409, condition: "Conclude requires interview SCHEDULED" }
  - { id: ERR_EVIDENCE_NOT_PRESERVED, http: 409, condition: "Seal requires evidence PRESERVED" }
  - { id: ERR_EVIDENCE_NOT_EXCLUDABLE, http: 409, condition: "Exclude requires evidence PRESERVED or SEALED" }
  - { id: ERR_DETERMINATION_NOT_DRAFT, http: 409, condition: "Submit requires determination DRAFT" }
  - { id: ERR_DETERMINATION_NOT_SUBMITTED, http: 409, condition: "Review requires determination SUBMITTED" }
  - { id: ERR_DETERMINATION_NOT_APPROVED, http: 409, condition: "Remediation create requires an APPROVED SUBSTANTIATED determination" }
  - { id: ERR_REMEDIATION_INVALID_STATE, http: 409, condition: "Remediation action not in the required from-state" }
  - { id: ERR_FLAG_NOT_OPEN, http: 409, condition: "Dismiss requires flag OPEN" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "Release requires hold ACTIVE" }
  - { id: ERR_NOTICE_NOT_SENT, http: 409, condition: "Acknowledge requires notice SENT" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Check-in requires plan ACTIVE" }
  - { id: ERR_REPORT_NOT_DRAFT, http: 409, condition: "Finalize requires report DRAFT" }
  - { id: ERR_REPORT_NOT_FINALIZED, http: 409, condition: "Present requires report FINALIZED" }
  - { id: ERR_LEGAL_HOLD_FREEZE, http: 409, condition: "Case FROZEN by an ACTIVE legal hold; operation gated" }
  - { id: ERR_SOD_TRIAGER_INELIGIBLE, http: 409, condition: "Triager of the case cannot be its investigator (explicit override)" }
  - { id: ERR_SOD_SELF_SCREEN, http: 409, condition: "Candidate investigator cannot screen their own assignment" }
  - { id: ERR_SOD_SELF_WAIVER, http: 409, condition: "Waiver officer must differ from screener and candidate" }
  - { id: ERR_SOD_SELF_REVIEW, http: 409, condition: "Determination reviewer must differ from decider" }
  - { id: ERR_SOD_SELF_SEAL, http: 409, condition: "Evidence sealer must differ from uploader" }
  - { id: ERR_SOD_SELF_VERIFY, http: 409, condition: "Remediation decider/verifier must differ from creator" }
  - { id: ERR_SOD_HOLD_RELEASE, http: 409, condition: "Hold releaser must differ from placer" }
  - { id: ERR_INVESTIGATOR_CAPACITY_EXCEEDED, http: 409, condition: "Activate would push active_case_count above max_active_cases" }
  - { id: ERR_NO_ELIGIBLE_INVESTIGATOR, http: 409, condition: "Routing selector pool empty after eligibility filters" }
  - { id: ERR_SUBJECT_NAMED_AS_INVESTIGATOR, http: 409, condition: "Override target is named in case.subject_employee_ids" }
  - { id: ERR_INTERVIEW_OVERLAP, http: 409, condition: "Interview violates 15-minute buffer vs another SCHEDULED/CONDUCTED interview of the same investigator" }
  - { id: ERR_LEGAL_HOLD_OVERLAP, http: 409, condition: "Hold closed interval touches/overlaps an ACTIVE hold on the same case" }
  - { id: ERR_DUPLICATE_TARGET_INVALID, http: 409, condition: "duplicate_of_case_id missing on REJECT-as-duplicate, or target is terminal" }
  - { id: ERR_CASE_HAS_CONDUCTED_INTERVIEWS, http: 409, condition: "Release of ACTIVE assignment blocked: case has CONDUCTED interviews" }
  - { id: ERR_NO_CONDUCTED_INTERVIEW, http: 409, condition: "Determination submit requires >= 1 CONDUCTED interview" }
  - { id: ERR_UNSEALED_EVIDENCE, http: 409, condition: "Determination submit blocked: evidence still PRESERVED" }
  - { id: ERR_MONITORING_WINDOW_INACTIVE, http: 409, condition: "Retaliation flag requires case MONITORING" }
  - { id: ERR_EXTENSION_WINDOW_EXCEEDED, http: 409, condition: "Extension due_date must be in (now, now + 30 days]" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HotlineReporter
    description: "Anonymous or identified reporter; X-User-ID is the case's reporter_access_key (opaque, minted at intake)"
    identity: opaque
    exclusive_operations:
      - "POST /hotline/cases — file a report"
      - "GET /hotline/cases/{id}/reporter-status — own case view"
      - "POST /hotline/cases/{id}/withdraw — withdraw own report"
      - "POST /hotline/closure-notices/{id}/acknowledge — acknowledge closure"
    shared_operations:
      - "POST /hotline/cases/{id}/retaliation-flags — REPORTER_CHECKIN signal (shared with ComplianceOfficer)"
  - name: IntakeSpecialist
    description: "Hotline intake/triage operator; routes cases and screens conflicts"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /hotline/cases/{id}/triage — triage with severity computation"
    shared_operations:
      - "POST /hotline/cases/{id}/assignments — auto-route only (override requires officer)"
      - "POST /hotline/assignments/{id}/screen — conflict screening (shared with officer)"
      - "POST /hotline/evidence-items/{id}/seal — dual-control seal (any staff != uploader)"
      - "GET staff/case/child list endpoints"
  - name: Investigator
    description: "Assigned case investigator; documents interviews, preserves evidence, drafts determinations"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /hotline/interviews — schedule interview (must be assigned)"
      - "POST /hotline/evidence-items — register evidence (must be assigned)"
      - "POST /hotline/cases/{id}/determinations — draft determination (must be assigned)"
      - "POST /hotline/determinations/{id}/submit — submit own draft"
    shared_operations:
      - "POST /hotline/interviews/{id}/conclude — CONDUCTED/NO_SHOW by owner (CANCELLED shared with officer)"
      - "POST /hotline/evidence-items/{id}/seal — as non-uploader staff"
      - "GET staff/case/child list endpoints"
  - name: ComplianceOfficer
    description: "Ethics & compliance officer; screening waivers, assignment activation/release, determination review, remediation oversight, legal holds, retaliation handling, reporting"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /hotline/assignments/{id}/waive-conflict — conflict waiver"
      - "POST /hotline/assignments/{id}/activate — activate assignment"
      - "POST /hotline/assignments/{id}/release — release assignment"
      - "POST /hotline/evidence-items/{id}/exclude — exclude evidence"
      - "POST /hotline/determinations/{id}/review — approve/return"
      - "POST /hotline/determinations/{id}/remediation-actions — propose action"
      - "POST /hotline/remediation-actions/{id}/decide — approve/reject action"
      - "POST /hotline/remediation-actions/{id}/verify — verify action"
      - "POST /hotline/remediation-actions/{id}/extend — extend overdue action"
      - "POST /hotline/monitoring-plans/{id}/check-in — record check-in"
      - "POST /hotline/retaliation-flags/{id}/dismiss — dismiss flag"
      - "POST /hotline/legal-holds — place hold"
      - "POST /hotline/legal-holds/{id}/release — release hold (!= placer)"
      - "POST /hotline/audit-committee-reports — create report"
      - "POST /hotline/audit-committee-reports/{id}/finalize — freeze metrics"
    shared_operations:
      - "POST /hotline/cases/{id}/assignments — incl. explicit override"
      - "POST /hotline/assignments/{id}/screen — conflict screening"
      - "POST /hotline/cases/{id}/retaliation-flags — HR_SIGNAL | MANUAL"
      - "POST /hotline/audit-committee-reports/{id}/present — shared with AuditCommitteeMember"
      - "POST /hotline/evidence-items/{id}/seal — as non-uploader staff"
      - "GET staff/case/child/report/event list endpoints"
  - name: AuditCommitteeMember
    description: "Audit committee reader; report consumption and audit-trail inspection"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /hotline/audit-committee-reports — list reports"
      - "POST /hotline/audit-committee-reports/{id}/present — mark presented"
      - "GET /hotline/cases/{id}/case-status-events — audit trail"
  - name: EthicsPlatformAdmin
    description: "Platform operator; staff registry maintenance and logical clock control"
    identity: opaque
    exclusive_operations:
      - "POST /hotline/staff-members — register staff"
      - "PATCH /hotline/staff-members/{id} — update staff"
      - "POST /_clock/set_current_utc — advance logical clock with sweep"
    shared_operations:
      - "GET staff/case/child/report/event list endpoints"
