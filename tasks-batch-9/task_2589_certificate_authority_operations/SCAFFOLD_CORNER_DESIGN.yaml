# Scaffold Corner Design (§1.9) for task_2589_certificate_authority_operations
# Breadth probe over §1.1-§1.7 of SCAFFOLD.yaml, walked section-by-section against
# references/claim-extraction-guide.md. Depth corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear here as `excluded_because:` stubs.
#
# Fixed conventions used by every recipe below:
#   * the logical clock starts at 2026-08-01T00:00:00Z and is only ever moved forward
#     with POST /_clock/set_current_utc (the payload field is `current_utc`);
#   * acting identities: u_pol_1 (POLICY_ADMIN), u_val_1 / u_val_2 (VALIDATION_OFFICER),
#     u_appr_1 (VETTING_APPROVER), u_iss_1 / u_iss_2 / u_iss_3 (ISSUANCE_OPERATOR),
#     u_rev_1 (REVOCATION_OFFICER), u_aud_1 / u_aud_2 (COMPLIANCE_AUDITOR);
#   * every intentionally failing call captures $.data.error_id so the assertion pins
#     the error identity rather than only the HTTP status.
scaffold_corner_design:
  - section: entities
    instances:
      - name: certificate_profile_creation_returns_every_declared_field_with_derived_vetting_level
        claim_type: creation
        grounds:
          - entities.CertificateProfile
          - entities.CertificateProfile.fields.required_vetting_level
          - entities.CertificateProfile.fields.status
          - entities.CertificateProfile.fields.status_service_posture
          - endpoints[POST /ca/certificate-profiles]
        distinguishing_aspect: "A single POST with all eleven input fields returns 201 and the server derives required_vetting_level EV from validation_type EV while status is DRAFT, status_service_posture NOMINAL and all four counters are 0."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
          trigger:
            - call: "POST /ca/certificate-profiles"
              payload: { name: "corner-ev-1", validation_type: "EV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 60, allowed_dcv_methods: ["DNS_TXT", "HTTP_TOKEN"], required_sct_count: 2, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_id: $.data.id }
          assert:
            - "HTTP 201"
            - "CertificateProfile.${profile_id}.status == DRAFT"
            - "CertificateProfile.${profile_id}.status_service_posture == NOMINAL"
            - "CertificateProfile.${profile_id}.required_vetting_level == EV"
            - "CertificateProfile.${profile_id}.pending_crl_entry_count == 0"
            - "CertificateProfile.${profile_id}.revoked_certificate_count == 0"
            - "CertificateProfile.${profile_id}.total_crl_entries_published == 0"
            - "CertificateProfile.${profile_id}.last_crl_number == 0"
            - "CertificateProfile.${profile_id}.version == 1"
            - "CertificateProfile.${profile_id}.activated_at is null"
            - "response meta carries api_request_id and api_request_timestamp and response_type == object"

      - name: certificate_profile_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.CertificateProfile
          - endpoints[GET /ca/certificate-profiles/{id}]
        distinguishing_aspect: "GET /{id} after activation returns status ACTIVE, activated_at equal to the activation clock and version 2 - the same row the activate response returned, not a re-derived object."
        test_recipe:
          setup:
            - "One DV profile created at 2026-08-01T00:00:00Z and activated at the same clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/certificate-profiles"
              payload: { name: "corner-dv-get", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 0, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${profile_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
          trigger:
            - call: "GET /ca/certificate-profiles/${profile_id}"
              payload: {}
              as: COMPLIANCE_AUDITOR
          assert:
            - "HTTP 200"
            - "CertificateProfile.${profile_id}.status == ACTIVE"
            - "CertificateProfile.${profile_id}.activated_at == 2026-08-01T00:00:00Z"
            - "CertificateProfile.${profile_id}.required_vetting_level == NONE"
            - "CertificateProfile.${profile_id}.version == 2"
            - "CertificateProfile.${profile_id}.name == corner-dv-get"

      - name: certificate_profile_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /ca/certificate-profiles]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With exactly three profiles stored, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, limit 2 offset 2 returns 1 row with has_more false, and omitting both parameters applies the declared defaults limit 10 / offset 0."
        test_recipe:
          setup:
            - "Three DRAFT DV profiles named corner-list-a, corner-list-b and corner-list-c, created in that order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/certificate-profiles"
              payload: { name: "corner-list-a", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 0, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_a_id: $.data.id }
            - call: "POST /ca/certificate-profiles"
              payload: { name: "corner-list-b", validation_type: "OV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 60, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_b_id: $.data.id }
            - call: "POST /ca/certificate-profiles"
              payload: { name: "corner-list-c", validation_type: "EV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 60, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 2, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_c_id: $.data.id }
          trigger:
            - call: "GET /ca/certificate-profiles?limit=2&offset=0"
              payload: {}
              as: POLICY_ADMIN
            - call: "GET /ca/certificate-profiles?limit=2&offset=2"
              payload: {}
              as: POLICY_ADMIN
            - call: "GET /ca/certificate-profiles"
              payload: {}
              as: POLICY_ADMIN
            - call: "GET /ca/certificate-profiles?validation_type=EV"
              payload: {}
              as: POLICY_ADMIN
          assert:
            - "first list call: HTTP 200, response_type == array, len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second list call: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "third list call: limit == 10, offset == 0, len(data) == 3, has_more == false"
            - "fourth list call: len(data) == 1, total_count == 1, data[0].id == ${profile_c_id}"

      - name: subscriber_get_with_unknown_uuid_returns_subscriber_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /ca/subscribers/{id}]
          - validations[priority=11]
          - errors[ERR_SUBSCRIBER_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but absent UUID on the subscriber read path returns HTTP 404 with error_id ERR_SUBSCRIBER_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
          trigger:
            - call: "GET /ca/subscribers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: POLICY_ADMIN
              captures: { err_missing_subscriber: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err_missing_subscriber} == ERR_SUBSCRIBER_NOT_FOUND"
            - "response_type == error"

      - name: certificate_profile_creation_without_base_fee_is_rejected_as_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /ca/certificate-profiles]
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required input field base_fee_cents (a field with source input and no default) returns HTTP 400 ERR_INVALID_REQUEST and persists no profile, so a following list call still returns total_count 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
          trigger:
            - call: "POST /ca/certificate-profiles"
              payload: { name: "corner-missing-fee", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 0, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { err_missing_field: $.data.error_id }
            - call: "GET /ca/certificate-profiles"
              payload: {}
              as: POLICY_ADMIN
          assert:
            - "HTTP 400 on the create call"
            - "${err_missing_field} == ERR_INVALID_REQUEST"
            - "the following list call returns total_count == 0"

      - name: certificate_request_expedited_defaults_to_false_and_counters_start_at_zero
        claim_type: defaults
        grounds:
          - entities.CertificateRequest.fields.expedited
          - entities.CertificateRequest.fields.return_count
          - entities.CertificateRequest.fields.consumed_authorization_ids
          - endpoints[POST /ca/certificate-requests]
        distinguishing_aspect: "Omitting the optional input field expedited yields the declared default false (so no expedite fee can ever apply), while return_count defaults to 0 and consumed_authorization_ids to the empty array."
        test_recipe:
          setup:
            - "One ACTIVE DV profile and one ACTIVE subscriber."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/certificate-profiles"
              payload: { name: "corner-dv-def", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 0, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${profile_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Corner Defaults Ltd", jurisdiction_code: "US-DE", registry_id: "REG-2001", contact_email: "ops@defaults.example", callback_phone: "+1-202-555-0101", credit_limit_cents: 500000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /ca/certificate-requests"
              payload: { subscriber_id: "${sub_id}", profile_id: "${profile_id}", requested_domains: ["www.defaults.example"], requested_validity_days: 90, csr_key_bits: 2048 }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { req_id: $.data.id }
          assert:
            - "HTTP 201"
            - "CertificateRequest.${req_id}.expedited == false"
            - "CertificateRequest.${req_id}.state == DRAFT"
            - "CertificateRequest.${req_id}.return_count == 0"
            - "CertificateRequest.${req_id}.consumed_authorization_ids == []"
            - "CertificateRequest.${req_id}.projected_charge_cents is null"
            - "CertificateRequest.${req_id}.version == 1"
            - "Subscriber.${sub_id}.outstanding_balance_cents == 0"
            - "Subscriber.${sub_id}.account_status == ACTIVE"

      - name: clearance_writes_the_computed_projection_fields_and_input_cannot_supply_them
        claim_type: computed_fields
        grounds:
          - entities.CertificateRequest.fields.projected_not_before
          - entities.CertificateRequest.fields.projected_not_after
          - entities.CertificateRequest.fields.projected_charge_cents
          - entities.CertificateRequest.fields.consumed_authorization_ids
          - calculations.certificate_validity_window
          - calculations.issuance_charge_settlement
          - endpoints[POST /ca/certificate-requests/{id}/clear-validation]
        distinguishing_aspect: "clear-validation takes an empty body, yet it writes all four computed fields: projected_not_before 2026-08-01T00:00:00Z, projected_not_after 2026-10-30T00:00:00Z (90-day cap), projected_charge_cents 20000 (DV multiplier 1.0, one domain, 0 percent band) and consumed_authorization_ids [the one validated authorization]."
        test_recipe:
          setup:
            - "ACTIVE DV profile: max_validity_days 90, dcv_reuse_days 30, max_dcv_reuse_count 5, base_fee_cents 20000."
            - "One ACTIVE subscriber with one VALIDATED DNS_TXT authorization for www.calc.example, validated at 2026-08-01T00:00:00Z."
            - "One SUBMITTED request for that single domain with requested_validity_days 90."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/certificate-profiles"
              payload: { name: "corner-dv-proj", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 0, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${profile_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Corner Projection Ltd", jurisdiction_code: "US-DE", registry_id: "REG-2002", contact_email: "ops@calc.example", callback_phone: "+1-202-555-0102", credit_limit_cents: 500000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${profile_id}", domain_name: "www.calc.example", method: "DNS_TXT" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_id: $.data.id, auth_token: $.data.challenge_token }
            - call: "POST /ca/domain-authorizations/${auth_id}/validate"
              payload: { challenge_token: "${auth_token}" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/certificate-requests"
              payload: { subscriber_id: "${sub_id}", profile_id: "${profile_id}", requested_domains: ["www.calc.example"], requested_validity_days: 90, csr_key_bits: 2048 }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { req_id: $.data.id }
            - call: "POST /ca/certificate-requests/${req_id}/submit"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
          trigger:
            - call: "POST /ca/certificate-requests/${req_id}/clear-validation"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
          assert:
            - "HTTP 200"
            - "CertificateRequest.${req_id}.state == READY_TO_ISSUE"
            - "CertificateRequest.${req_id}.projected_not_before == 2026-08-01T00:00:00Z"
            - "CertificateRequest.${req_id}.projected_not_after == 2026-10-30T00:00:00Z"
            - "CertificateRequest.${req_id}.projected_charge_cents == 20000"
            - "CertificateRequest.${req_id}.consumed_authorization_ids == [${auth_id}]"
            - "CertificateRequest.${req_id}.validation_cleared_by_user_id == u_val_1"
            - "CertificateRequest.${req_id}.validation_cleared_at == 2026-08-01T00:00:00Z"
            - "DomainAuthorization.${auth_id}.reuse_count == 1"
            - "DomainAuthorization.${auth_id}.expires_at == 2026-08-31T00:00:00Z"

      - name: certificate_system_fields_are_server_minted_at_issuance
        claim_type: system_fields
        grounds:
          - entities.Certificate.fields.serial_number
          - entities.Certificate.fields.request_id
          - entities.Certificate.fields.subscriber_id
          - entities.Certificate.fields.profile_id
          - entities.Certificate.fields.lifecycle_status
          - endpoints[POST /ca/certificate-requests/{id}/issue]
        distinguishing_aspect: "The issue body carries only ceremony_id, yet the Certificate comes back with a system serial_number and with request_id, subscriber_id and profile_id copied from the request - none of them accepted as input - plus id, created_at, updated_at and version 1."
        test_recipe:
          setup:
            - "Full happy-path issuance chain on an ACTIVE DV profile (base_fee_cents 20000, dcv_reuse_days 30, max_validity_days 90)."
            - "Ceremony window 2026-08-01T00:00:00Z..00:30:00Z, attestation_valid_days 60, witnessed by u_iss_1 and u_iss_2, attested by u_aud_1 at 2026-08-01T00:30:00Z."
            - "Validation cleared by u_val_1; the certificate is issued by the different operator u_iss_3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/certificate-profiles"
              payload: { name: "corner-dv-sys", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 0, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${profile_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Corner System Ltd", jurisdiction_code: "US-DE", registry_id: "REG-2003", contact_email: "ops@sys.example", callback_phone: "+1-202-555-0103", credit_limit_cents: 500000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${profile_id}", domain_name: "www.sys.example", method: "DNS_TXT" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_id: $.data.id, auth_token: $.data.challenge_token }
            - call: "POST /ca/domain-authorizations/${auth_id}/validate"
              payload: { challenge_token: "${auth_token}" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/hsm-partitions"
              payload: { label: "Corner Signer", serial: "HSM-2003" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { part_id: $.data.id }
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T00:30:00Z", attestation_valid_days: 60 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { cer_id: $.data.id }
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:30:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/attest"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /ca/certificate-requests"
              payload: { subscriber_id: "${sub_id}", profile_id: "${profile_id}", requested_domains: ["www.sys.example"], requested_validity_days: 90, csr_key_bits: 2048 }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { req_id: $.data.id }
            - call: "POST /ca/certificate-requests/${req_id}/submit"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/certificate-requests/${req_id}/clear-validation"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
          trigger:
            - call: "POST /ca/certificate-requests/${req_id}/issue"
              payload: { ceremony_id: "${cer_id}" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_3"
              captures: { cert_id: $.data.id, cert_serial: $.data.serial_number, cert_version_v1: $.data.version }
          assert:
            - "HTTP 201"
            - "Certificate.${cert_id}.serial_number is a non-empty server-minted string equal to ${cert_serial}"
            - "Certificate.${cert_id}.request_id == ${req_id}"
            - "Certificate.${cert_id}.subscriber_id == ${sub_id}"
            - "Certificate.${cert_id}.profile_id == ${profile_id}"
            - "Certificate.${cert_id}.ceremony_id == ${cer_id}"
            - "Certificate.${cert_id}.lifecycle_status == PREISSUANCE"
            - "Certificate.${cert_id}.revocation_status == NONE"
            - "Certificate.${cert_id}.sct_count == 0"
            - "Certificate.${cert_id}.not_before == 2026-08-01T00:30:00Z"
