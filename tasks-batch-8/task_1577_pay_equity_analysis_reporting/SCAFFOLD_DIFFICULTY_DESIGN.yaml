            - { call: "POST /api/employee-snapshots", payload: { study_id: "${si}", employee_ref: "IM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 11000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { i_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${si}", employee_ref: "IM2", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { i_m2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${si}", employee_ref: "IM3", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { i_m3: "$.data.id" } }
