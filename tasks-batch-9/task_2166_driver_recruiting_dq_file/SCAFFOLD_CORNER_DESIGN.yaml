# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against §1.1-§1.7.
# Logical clock startup default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
    - name: carrier_creation_returns_201_with_computed_posture
      claim_type: creation
      grounds:
      - entities.Carrier
      - endpoints[POST /carriers]
      distinguishing_aspect: POST /carriers with every knob supplied returns 201 and echoes all inputs plus the server-minted id, version 1 and the computed posture OPEN.
      test_recipe:
        setup:
        - Empty database; the logical clock is pinned to its 2026-08-01T00:00:00Z startup default.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload:
            to_iso8601: '2026-08-01T00:00:00Z'
          as: Recruiter
        trigger:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        assert:
        - HTTP status == 201
        - Carrier.${carrier_id}.legal_name == Redline Freight LLC and dot_number == DOT-CORNER-1
        - Carrier.${carrier_id}.version == 1 and filled_requisitions == 0 and deficiency_ratio == 0.0
        - Carrier.${carrier_id}.posture == OPEN
        - response data.id is a bare UUID with no type prefix
    - name: carrier_defaults_applied_when_optional_knobs_omitted
      claim_type: defaults
      grounds:
      - entities.Carrier.fields.mvr_validity_days
      - entities.Carrier.fields.annual_review_grace_days
      - entities.Carrier.fields.safety_rating
      distinguishing_aspect: 'Omitting every optional knob applies the declared defaults: safety_rating SATISFACTORY, mvr_validity_days 365, annual_review_interval_days 365, annual_review_grace_days
        30, mvr_point_threshold 7, rehire_cooldown_days 180, medical_cert_grace_days 15.'
      test_recipe:
        setup:
        - Empty database; the logical clock is pinned to its 2026-08-01T00:00:00Z startup default.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload:
            to_iso8601: '2026-08-01T00:00:00Z'
          as: Recruiter
        trigger:
        - call: POST /carriers
          payload:
            legal_name: Sparse Carrier
            dot_number: DOT-CORNER-1
            open_requisitions: 3
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        assert:
        - HTTP status == 201
        - Carrier.${carrier_id}.safety_rating == SATISFACTORY
        - Carrier.${carrier_id}.mvr_validity_days == 365 and annual_review_interval_days == 365
        - Carrier.${carrier_id}.annual_review_grace_days == 30 and mvr_point_threshold == 7
        - Carrier.${carrier_id}.rehire_cooldown_days == 180 and medical_cert_grace_days == 15
        - Carrier.${carrier_id}.posture == OPEN
    - name: driver_applicant_retrieval_returns_stored_and_derived_fields
      claim_type: retrieval
      grounds:
      - entities.DriverApplicant
      - endpoints[GET /driver-applicants/{applicant_id}]
      distinguishing_aspect: GET /driver-applicants/{id} returns every stored field verbatim plus the freshly derived cdl_downgrade_risk NO_CERTIFICATE and rehire_eligibility ELIGIBLE for a brand-new
        applicant.
      test_recipe:
        setup:
        - One Carrier and one DriverApplicant with no DQ documents and no hire history.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Dana Ruiz
            date_of_birth: '1988-04-12'
            email: dana.ruiz@example.com
            cdl_number: CDL-77120
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_id: $.data.id
        trigger:
        - call: GET /driver-applicants/${applicant_id}
          payload: {}
          as: Recruiter
        assert:
        - HTTP status == 200
        - DriverApplicant.${applicant_id}.full_name == Dana Ruiz and cdl_state == TX
        - DriverApplicant.${applicant_id}.experience_months == 24 and cdl_class == CLASS_A
        - DriverApplicant.${applicant_id}.cdl_downgrade_risk == NO_CERTIFICATE
        - DriverApplicant.${applicant_id}.governing_medical_cert_expires_on == null
        - DriverApplicant.${applicant_id}.rehire_eligibility == ELIGIBLE and outstanding_clawback_cents == 0
    - name: driver_applications_listing_paginates_with_total_count
      claim_type: listing
      grounds:
      - endpoints[GET /driver-applications]
      - response_envelope.pagination_fields
      distinguishing_aspect: GET /driver-applications with limit 2 offset 1 over three applications returns exactly 2 rows, total_count 3 and has_more true.
      test_recipe:
        setup:
        - Three applicants each holding one DRAFT DriverApplication at the same carrier.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Dana Ruiz
            date_of_birth: '1988-04-12'
            email: dana.ruiz@example.com
            cdl_number: CDL-77120
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_id: $.data.id
        - call: POST /driver-applications
          payload:
            applicant_id: ${applicant_id}
            position_type: OTR
          as: Recruiter
          captures:
            app_id: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Bo Lund
            date_of_birth: '1991-01-01'
            email: bo.lund@example.com
            cdl_number: CDL-2
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_b: $.data.id
        - call: POST /driver-applications
          payload:
            applicant_id: ${applicant_b}
            position_type: LOCAL
          as: Recruiter
          captures:
            app_b: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Cy Nord
            date_of_birth: '1992-02-02'
            email: cy.nord@example.com
            cdl_number: CDL-3
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_c: $.data.id
        - call: POST /driver-applications
          payload:
            applicant_id: ${applicant_c}
            position_type: REGIONAL
          as: Recruiter
          captures:
            app_c: $.data.id
        trigger:
        - call: GET /driver-applications
          payload:
            carrier_id: ${carrier_id}
            limit: 2
            offset: 1
          as: Recruiter
        assert:
        - HTTP status == 200
        - response_type == array
        - len(data) == 2
        - meta/pagination total_count == 3, limit == 2, offset == 1, has_more == false
    - name: driver_application_get_unknown_id_not_found_returns_404
      claim_type: not_found
      grounds:
      - validations[priority=5]
      - errors[ERR_APPLICATION_NOT_FOUND]
      distinguishing_aspect: GET /driver-applications/{id} with a syntactically valid but unknown UUID returns 404 ERR_APPLICATION_NOT_FOUND, not an empty object.
      test_recipe:
        setup:
        - One Carrier exists; no DriverApplication rows.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        trigger:
        - call: GET /driver-applications/00000000-0000-4000-8000-000000000000
          payload: {}
          as: Recruiter
          captures:
            err: $.data.error_id
        assert:
        - HTTP status == 404
        - response data.error_id == ERR_APPLICATION_NOT_FOUND
        - response_type == error
    - name: driver_applicant_create_missing_required_cdl_number_returns_422
      claim_type: required_fields
      grounds:
      - validations[priority=7]
      - errors[ERR_VALIDATION]
      distinguishing_aspect: POST /driver-applicants without cdl_number is rejected with 422 ERR_VALIDATION and creates no row.
      test_recipe:
        setup:
        - One Carrier exists.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        trigger:
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: No CDL
            date_of_birth: '1990-01-01'
            email: no.cdl@example.com
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 12
          as: Recruiter
          captures:
            err: $.data.error_id
        assert:
        - HTTP status == 422
        - response data.error_id == ERR_VALIDATION
        - GET /driver-applicants?carrier_id=${carrier_id} returns an empty array
    - name: carrier_create_invalid_enum_safety_rating_returns_422
      claim_type: type_constraints
      grounds:
      - entities.Carrier.fields.safety_rating
      - validations[priority=7]
      - errors[ERR_VALIDATION]
      distinguishing_aspect: POST /carriers with safety_rating MARGINAL, which is not one of {SATISFACTORY, CONDITIONAL, UNSATISFACTORY}, is rejected with 422 ERR_VALIDATION.
      test_recipe:
        setup:
        - Empty database; the logical clock is pinned to its 2026-08-01T00:00:00Z startup default.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload:
            to_iso8601: '2026-08-01T00:00:00Z'
          as: Recruiter
        trigger:
        - call: POST /carriers
          payload:
            legal_name: Bad Enum Co
            dot_number: DOT-CORNER-1
            open_requisitions: 2
            safety_rating: MARGINAL
          as: SafetyDirector
          captures:
            err: $.data.error_id
        assert:
        - HTTP status == 422
        - response data.error_id == ERR_VALIDATION
        - GET /carriers returns an empty array
    - name: carrier_duplicate_dot_number_rejected
      claim_type: type_constraints
      grounds:
      - validations[priority=9]
      - errors[ERR_DUPLICATE_DOT_NUMBER]
      distinguishing_aspect: A second POST /carriers reusing dot_number DOT-CORNER-1 is rejected with 409 ERR_DUPLICATE_DOT_NUMBER.
      test_recipe:
        setup:
        - One Carrier already registered with dot_number DOT-CORNER-1.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        trigger:
        - call: POST /carriers
          payload:
            legal_name: Copycat Lines
            dot_number: DOT-CORNER-1
            open_requisitions: 1
          as: SafetyDirector
          captures:
            err: $.data.error_id
        assert:
        - HTTP status == 409
        - response data.error_id == ERR_DUPLICATE_DOT_NUMBER
        - GET /carriers returns exactly 1 row
    - name: driver_applicant_duplicate_email_within_carrier_rejected
      claim_type: type_constraints
      grounds:
      - validations[priority=9]
      - entities.DriverApplicant.fields.email
      distinguishing_aspect: A second DriverApplicant reusing dana.ruiz@example.com at the same carrier_id is rejected with 409 ERR_DUPLICATE_DOT_NUMBER (the shared uniqueness error).
      test_recipe:
        setup:
        - One Carrier with one DriverApplicant whose email is dana.ruiz@example.com.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Dana Ruiz
            date_of_birth: '1988-04-12'
            email: dana.ruiz@example.com
            cdl_number: CDL-77120
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_id: $.data.id
        trigger:
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Dana Twin
            date_of_birth: '1988-04-12'
            email: dana.ruiz@example.com
            cdl_number: CDL-9999
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 10
          as: Recruiter
          captures:
            err: $.data.error_id
        assert:
        - HTTP status == 409
        - response data.error_id == ERR_DUPLICATE_DOT_NUMBER
        - GET /driver-applicants?carrier_id=${carrier_id} returns exactly 1 row
    - name: driver_application_computed_fields_initialised_on_create
      claim_type: computed_fields
      grounds:
      - entities.DriverApplication.fields.screening_status
      - entities.DriverApplication.fields.qualification_status
      - entities.DriverApplication.fields.gap_days_unexplained
      distinguishing_aspect: A freshly created DriverApplication carries the computed defaults DRAFT / NOT_STARTED, revision_round 0, verified_coverage_days 0, gap_days_unexplained 1095 and a carrier_id
        copied from the applicant.
      test_recipe:
        setup:
        - One Carrier and one DriverApplicant.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Dana Ruiz
            date_of_birth: '1988-04-12'
            email: dana.ruiz@example.com
            cdl_number: CDL-77120
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_id: $.data.id
        trigger:
        - call: POST /driver-applications
          payload:
            applicant_id: ${applicant_id}
            position_type: OTR
          as: Recruiter
          captures:
            app_id: $.data.id
        assert:
        - HTTP status == 201
        - DriverApplication.${app_id}.screening_status == DRAFT
        - DriverApplication.${app_id}.qualification_status == NOT_STARTED
        - DriverApplication.${app_id}.revision_round == 0 and version == 1
        - DriverApplication.${app_id}.verified_coverage_days == 0 and gap_days_unexplained == 1095
        - DriverApplication.${app_id}.carrier_id == ${carrier_id}
        - DriverApplication.${app_id}.submitted_at == null and recruiter_user_id == null and prior_application_id == null
    - name: driver_application_create_unknown_applicant_not_found_returns_404
      claim_type: parent_relationships
      grounds:
      - validations[priority=6]
      - errors[ERR_APPLICANT_NOT_FOUND]
      distinguishing_aspect: POST /driver-applications whose applicant_id does not resolve is rejected with 404 ERR_APPLICANT_NOT_FOUND.
      test_recipe:
        setup:
        - One Carrier exists; no DriverApplicant rows.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        trigger:
        - call: POST /driver-applications
          payload:
            applicant_id: 00000000-0000-4000-8000-000000000001
            position_type: OTR
          as: Recruiter
          captures:
            err: $.data.error_id
        assert:
        - HTTP status == 404
        - response data.error_id == ERR_APPLICANT_NOT_FOUND
        - GET /driver-applications returns an empty array
    - name: carrier_create_system_fields_input_ignored
      claim_type: system_fields
      grounds:
      - entities.Carrier
      - response_envelope.success
      distinguishing_aspect: 'Client-supplied id, created_at and version on POST /carriers are ignored: the server mints its own UUID, stamps created_at itself and sets version to 1.'
      test_recipe:
        setup:
        - Empty database; the logical clock is pinned to its 2026-08-01T00:00:00Z startup default.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload:
            to_iso8601: '2026-08-01T00:00:00Z'
          as: Recruiter
        trigger:
        - call: POST /carriers
          payload:
            legal_name: Spoofed Co
            dot_number: DOT-CORNER-1
            open_requisitions: 2
            id: 11111111-1111-4111-8111-111111111111
            created_at: '1999-01-01T00:00:00.000Z'
            version: 77
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        assert:
        - HTTP status == 201
        - Carrier.${carrier_id}.id != 11111111-1111-4111-8111-111111111111
        - Carrier.${carrier_id}.version == 1
        - Carrier.${carrier_id}.created_at != 1999-01-01T00:00:00.000Z
  - section: state_machines
    instances:
    - name: submit_creates_dq_file_and_twelve_seeded_documents
      claim_type: side_effect_execution
      grounds:
      - state_machines.DriverApplication.DRAFT_to_SUBMITTED
      - entities.DqFile
      - entities.DqDocument.fields.doc_type
      distinguishing_aspect: 'Submit is the only producer of DQ artifacts: it creates exactly one DqFile (status OPEN, review_state NOT_DUE, total_weight 33, opened_on 2026-08-01) and exactly twelve
        DqDocument rows, of which only APPLICATION_FORM is PRESENT.'
      test_recipe:
        setup:
        - One Carrier, one DriverApplicant and one DRAFT DriverApplication; logical clock at the 2026-08-01T00:00:00Z default.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Dana Ruiz
            date_of_birth: '1988-04-12'
            email: dana.ruiz@example.com
            cdl_number: CDL-77120
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_id: $.data.id
        - call: POST /driver-applications
          payload:
            applicant_id: ${applicant_id}
            position_type: OTR
          as: Recruiter
          captures:
            app_id: $.data.id
        trigger:
        - call: POST /driver-applications/${app_id}/submit
          payload: {}
          as: Recruiter
          as_user_id: rec-001
        - call: GET /dq-files
          payload:
            application_id: ${app_id}
          as: Recruiter
          captures:
            dqf_id: $.data[0].id
        - call: GET /dq-documents
          payload:
            dq_file_id: ${dqf_id}
            limit: 100
          as: Recruiter
        assert:
        - DriverApplication.${app_id}.screening_status == SUBMITTED and qualification_status == IN_PROGRESS
        - DriverApplication.${app_id}.recruiter_user_id == rec-001 and submitted_at == 2026-08-01T00:00:00.000Z
        - GET /dq-files?application_id=${app_id} returns exactly 1 row
        - DqFile.${dqf_id}.status == OPEN, review_state == NOT_DUE, total_weight == 33, opened_on == 2026-08-01
        - DqFile.${dqf_id}.next_review_due_on == 2027-08-01 and last_annual_review_at == null
        - GET /dq-documents?dq_file_id=${dqf_id} total_count == 12
        - exactly one document has status PRESENT and its doc_type == APPLICATION_FORM
        - DqFile.${dqf_id}.completeness_pct == 10.71 and deficiency_count == 9
    - name: submit_twice_returns_409_invalid_state
      claim_type: idempotency
      grounds:
      - state_machines.DriverApplication.DRAFT_to_SUBMITTED
      - validations[priority=20]
      - errors[ERR_INVALID_STATE]
      distinguishing_aspect: A second submit on an application already in SUBMITTED is rejected with 409 ERR_INVALID_STATE and does not create a second DqFile.
      test_recipe:
        setup:
        - One submitted DriverApplication with its DqFile already created.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Dana Ruiz
            date_of_birth: '1988-04-12'
            email: dana.ruiz@example.com
            cdl_number: CDL-77120
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_id: $.data.id
        - call: POST /driver-applications
          payload:
