        distinguishing_aspect: "Pair business_referential(p4 ERR_REFERENCE_NOT_FOUND) vs business_constraint(p6 ERR_DUPLICATE_ACCOUNT_REF): creating a debt account with a nonexistent creditor_id AND a duplicate account_ref returns ERR_REFERENCE_NOT_FOUND (lower priority number), since FK resolution precedes uniqueness."
        test_recipe:
          setup:
