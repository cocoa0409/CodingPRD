              as: Customer
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /orders/${o1_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 1 }
              as: Customer
              as_user_id: "${c1_id}"
            - call: "POST /orders/${o1_id}/submit"
