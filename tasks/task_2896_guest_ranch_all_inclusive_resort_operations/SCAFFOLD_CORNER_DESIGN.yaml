        distinguishing_aspect: "The eligibility filter empties out on a single clause — the only horse in the herd carries a 120 lb weight limit against a 165 lb rider — so auto-assign returns ERR_NO_ELIGIBLE_MOUNT (422) while the seat stays PENDING and a heavier-capacity horse then succeeds."
