  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_storefront_version_on_link_channel
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[storefront-link-channel-stale-version]
          - errors[ERR_STALE_STOREFRONT_VERSION]
        distinguishing_aspect: |
          Second link-channel call using expected_storefront_version equal to the pre-update
          version (one behind) yields ERR_STALE_STOREFRONT_VERSION (412). Two strictly sequential
          calls; the first successful link bumped Storefront.version.
        test_recipe:
          setup:
            - "One VERIFIED Creator with a Storefront (integration_channel=SHOPIFY, integration_status=NONE)."
            - "Storefront.version captured pre-link."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
