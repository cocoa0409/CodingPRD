  - rule_id: compensating_invariant
    instances:
      - name: ledger_reversal_conserves_balance_without_touching_deficiency_points
        grounds:
          - calculations.penalty_ledger_balance
          - entities.PenaltyLedgerEntry.immutable
          - validations[priority=34]
          - validations[priority=35]
          - errors[ERR_ENTRY_ALREADY_REVERSED]
          - errors[ERR_NOT_REVERSIBLE_ENTRY]
        distinguishing_aspect: |
          A reversal never mutates or deletes the original entry: it APPENDS a compensating ABATEMENT
          of -30000 carrying reverses_entry_id, so the ledger holds exactly 2 rows summing to 0 and
          penalty_exposure_cents falls to 0 while deficiency_points stays 6 and the posture stays
          DEFICIENT (money and deficiency state are independent axes). Reversing the same accrual
          twice is refused ERR_ENTRY_ALREADY_REVERSED and reversing the reversal itself is refused
          ERR_NOT_REVERSIBLE_ENTRY, so the compensating pair can never be unbalanced. An
          implementation that deletes the accrual, or that also drops the 6 points, fails.
        test_recipe:
          setup:
            - "Logical clock at 2027-05-04T09:00:00Z."
            - "ACTIVE PlanYear PY2027, covered_lives 6000 (multiplier 2.0)."
            - "The TPA contract was gag-reviewed with prohibited_clause_count 4 and escalated to NON_COMPLIANT, posting one GAG_CLAUSE ACCRUAL of 30000; deficiency_points 6, compliance_posture DEFICIENT, penalty_exposure_cents 30000."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-05-04T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/contracts/${c_tpa}/gag-review"
              payload: { clause_inventory_count: 40, prohibited_clause_count: 4 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/contracts/${c_tpa}/escalate-gag"
              payload: { escalation_note: "Vendor refuses to strike the cost-data restrictions." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /compliance/penalty-ledger-entries?plan_year_id=${py}&entry_type=ACCRUAL"
              payload: {}
              as: ExternalAuditor
              as_user_id: "auditor-1"
              captures: { acc1: "$.data[0].id" }
          trigger:
            - call: "POST /compliance/penalty-ledger-entries/${acc1}/reverse"
              payload: { reason: "Accrual priced before the DOL grace bulletin; withdrawn on audit review." }
              as: ExternalAuditor
              as_user_id: "auditor-1"
              captures: { rev1: "$.data.id" }
            - call: "POST /compliance/penalty-ledger-entries/${acc1}/reverse"
              payload: { reason: "Duplicate withdrawal attempt." }
              as: ExternalAuditor
              as_user_id: "auditor-1"
            - call: "POST /compliance/penalty-ledger-entries/${rev1}/reverse"
              payload: { reason: "Attempt to reverse the reversal." }
              as: ExternalAuditor
              as_user_id: "auditor-1"
          assert:
            - "the first reverse response HTTP status == 201 with data.entry_type == \"ABATEMENT\", data.deficiency_type == \"GAG_CLAUSE\", data.signed_amount_cents == -30000, data.reverses_entry_id == \"${acc1}\", data.daily_rate_cents == 0, data.days_open == 0, data.size_multiplier == 1.0, data.onset_date == null, data.remediation_plan_id == null"
            - "GET /compliance/penalty-ledger-entries/${acc1} -> data.signed_amount_cents == 30000 and data.entry_type == \"ACCRUAL\" (the original row is untouched)"
            - "GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> exactly 2 entries whose signed_amount_cents sum to 0"
            - "GET /compliance/plan-years/${py} -> data.penalty_exposure_cents == 0, data.deficiency_points == 6, data.compliance_posture == \"DEFICIENT\""
            - "the second reverse response HTTP status == 409 and its data.error_id == \"ERR_ENTRY_ALREADY_REVERSED\""
            - "the third reverse response HTTP status == 409 and its data.error_id == \"ERR_NOT_REVERSIBLE_ENTRY\""
            - "GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> still exactly 2 entries after both refusals"

