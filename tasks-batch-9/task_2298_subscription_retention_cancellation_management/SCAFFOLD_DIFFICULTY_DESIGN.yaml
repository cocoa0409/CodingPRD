  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: write_off_cascade_invoice_subscription_subscriber_session
        grounds:
          - state_machines.Invoice.FAILED_to_WRITTEN_OFF
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - state_machines.Subscription.PAST_DUE_to_DELINQUENT
          - state_machines.CancellationSession.REASON_CAPTURED_to_ABANDONED
          - calculations.subscriber_lifetime_value
          - entities.Subscriber.fields.churn_type
          - entities.Subscriber.fields.winback_suppressed_until
        distinguishing_aspect: |
          One HARD_DECLINE settlement propagates five hops through five different entities:
          Invoice -> WRITTEN_OFF, Subscription -> DELINQUENT plus CANCELLED, Subscriber ->
          INVOLUNTARY with lapsed_at 2026-02-10 and winback_suppressed_until 2026-03-12,
          Subscriber.projected_ltv_cents collapsing onto realized_ltv_cents at 1058, and the
          subscriber's open CancellationSession -> ABANDONED.
