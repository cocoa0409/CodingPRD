  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: authority_rejection_three_hop_cascade
        grounds:
          - state_machines.FilingAttempt.PENDING_to_REJECTED
          - state_machines.TaxReturn.SUBMITTED_to_REJECTED
          - state_machines.StateReturn.FILED_to_READY
        distinguishing_aspect: |
          Depth-3 cascade from the authority-callback trigger: callback
          resolves FilingAttempt PENDING->REJECTED (hop 1); that mutation
          drives the parent TaxReturn SUBMITTED->REJECTED with hint
          computation (hop 2); the return's rejection itself rolls every
          FILED StateReturn back to READY (hop 3) — each hop caused by the
          previous, not by the original callback.
        test_recipe:
          setup:
            - "Account A (AGI 1000000c, resident CA), return R(2025) SUBMITTED with one PENDING FilingAttempt; CA StateReturn is FILED and a non-resident NY StateReturn (no residency window) is FILED"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "casc1@x.com", full_name: "Casc One", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "CA", expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { sr_ca: $.data.id, ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "NY", allocation_numerator_cents: 0, expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { sr_ny: $.data.id, ret_v4: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns/${sr_ca}/ready"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v5: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns/${sr_ny}/ready"
              payload: { expected_return_version: "${ret_v5}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v6: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v6}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v7: $.data.version }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-1", expected_return_version: "${ret_v7}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa1: $.data.id }
          trigger:
            - call: "POST /tax/_authority/filing-callback"
              payload: { filing_attempt_id: "${fa1}", outcome: "REJECTED", rejection_code: "R3000_MATH_ERROR" }
              as: PlatformOperator
          assert:
            - "FilingAttempt.${fa1}.outcome == REJECTED (hop 1)"
            - "FilingAttempt.${fa1}.correction_hint == 'The authority recomputed a line; review the flagged worksheet totals.'"
            - "TaxReturn.${ret_id}.status == REJECTED (hop 2)"
            - "StateReturn.${sr_ca}.status == READY (hop 3)"
            - "StateReturn.${sr_ny}.status == READY (hop 3)"

      - name: snapshot_import_tier_prompt_cascade
        grounds:
          - state_machines.PriorYearReturnSnapshot.AVAILABLE_to_IMPORTED
          - state_machines.UpgradePrompt.PENDING_to_SUPERSEDED
          - calculations.minimum_tier_classification
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (snapshot import, not the
          authority callback): import mutates snapshot AVAILABLE->IMPORTED
          (hop 1); the imported carryforward rows themselves trigger tier
          recomputation, which creates a new PENDING UpgradePrompt and
          supersedes the existing one (hop 2).
        test_recipe:
          setup:
            - "Account A (AGI 1000000c, CA), return R(2025, DRAFT) with ACTIVE F1040 + SCH_D; SCH_D's form-add created PENDING prompt P1 (FREE->PREMIER)"
            - "Snapshot S registered for tax_year 2024 with one CAPITAL_LOSS carryforward item (200000c)"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "PREMIER", price_cents: 12999, state_addon_price_cents: 4999, supported_forms: ["SCH_D", "F8949", "F4562"], tier_rank: 2 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "SELF_EMPLOYED", price_cents: 19999, state_addon_price_cents: 5999, supported_forms: ["SCH_C"], tier_rank: 3 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_D", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "casc2@x.com", full_name: "Casc Two", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "SCH_D", amount_cents: -200000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "GET /tax/returns/${ret_id}/upgrade-prompts"
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures:
                prompt1: "$.data[0].id"
            - call: "POST /tax/accounts/${acct_id}/prior-year-snapshots"
              payload:
                tax_year: 2024
                carryforward_items:
                  - item_type: "CAPITAL_LOSS"
                    asset_tag: "stocks-2024"
                    remaining_amount_cents: 200000
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { snap_id: $.data.id }
          trigger:
            - call: "POST /tax/accounts/${acct_id}/prior-year-snapshots/${snap_id}/import"
              payload: { return_id: "${ret_id}", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
          assert:
            - "PriorYearReturnSnapshot.${snap_id}.import_status == IMPORTED (hop 1)"
            - "UpgradePrompt.${prompt1}.status == SUPERSEDED (hop 2: the import's recomputation spawned a fresh PENDING prompt)"
            - "TaxReturn.${ret_id}.minimum_required_tier == PREMIER (imported SCH_D row keeps the minimum at PREMIER)"
            - "TaxReturn.${ret_id}.free_file_eligible == false (imported SCH_D disqualifies free file)"
            - "TaxReturn.${ret_id}.upgrade_prompt_pending == true"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_account_masks_free_file_ineligibility
        grounds:
          - validations[priority=5]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair state(p5) vs business_safety(p9): a submit-review that violates
          BOTH (account SUSPENDED and a FREE-tier return with a
          disqualifying form) must surface ERR_ACCOUNT_SUSPENDED, the higher-
          priority state error — never ERR_FREE_FILE_INELIGIBLE.
        test_recipe:
          setup:
            - "Account A (AGI 1000000c) with return R holding ACTIVE F1040 + SCH_D (free_file_eligible == false, current_tier == FREE, PENDING prompt exists); account suspended by ops"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
