  - rule_id: non_linear_state_machine
    instances:
      - name: formula_revision_claim_review_reject_cycle
        grounds:
          - state_machines.FormulaRevision.CLAIM_REVIEW_to_DRAFT
          - state_machines.FormulaRevision.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          FormulaRevision is cyclic: CLAIM_REVIEW -> DRAFT via reject-back, then loops
          DRAFT -> SUBMITTED -> NUTRITION_VERIFIED -> CLAIM_REVIEW -> APPROVED a second time —
          not a linear pipeline (contrasts with the parallel-dimension machine on ProductionRun).
        test_recipe:
          setup:
            - "customer C1 ACTIVE; formula F6 bar 60g; revision R6 (WHEY ingredient line, claims []) in DRAFT"
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED", allergens_handled: ["MILK"] }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "F6", bar_weight_g: 60, serving_count_per_bar: 1 }, as: FormulationScientist, captures: { f6: "$.data.id" } }
            - { call: "POST /mfg/formulas/${f6}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 19, claim_tags: [] }, as: FormulationScientist, captures: { r6: "$.data.id" } }
          trigger:
            - { call: "POST /mfg/revisions/${r6}/submit", payload: {}, as: FormulationScientist, captures: { s1: "$.data.status" } }
            - { call: "POST /mfg/revisions/${r6}/verify-nutrition", payload: {}, as: QualityManager, captures: { s2: "$.data.status" } }
            - { call: "POST /mfg/revisions/${r6}/send-claim-review", payload: {}, as: FormulationScientist, captures: { s3: "$.data.status" } }
            - { call: "POST /mfg/revisions/${r6}/reject-back", payload: {}, as: QualityManager, captures: { s4: "$.data.status" } }
            - { call: "POST /mfg/revisions/${r6}/submit", payload: {}, as: FormulationScientist, captures: { s5: "$.data.status" } }
            - { call: "POST /mfg/revisions/${r6}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${r6}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r6}/approve", payload: {}, as: QualityManager, captures: { s8: "$.data.status", v8: "$.data.version" } }
          assert:
            - "after reject-back the revision is DRAFT again (cycle CLAIM_REVIEW -> DRAFT)"
            - "second loop reaches APPROVED: statuses SUBMITTED -> NUTRITION_VERIFIED -> CLAIM_REVIEW -> DRAFT -> SUBMITTED -> ... -> APPROVED"
            - "FormulaRevision.${r6}.version == 9 after 8 transitions from creation (version 1)"

      - name: production_run_parallel_release_axis
        grounds:
          - state_machines.ProductionRun
          - entities.ProductionRun.fields.release_status
          - state_machines.LotRelease
        distinguishing_aspect: |
          ProductionRun carries two independent state axes (status x release_status):
          completion flips release_status NOT_READY -> PENDING_QC while status goes
          IN_PRODUCTION -> COMPLETED, and LotRelease decisions then move release_status
          PENDING_QC -> HOLD_REWORK -> SCRAPPED without ever touching status — a parallel
          machine, distinct from FormulaRevision's cycle.
        test_recipe:
