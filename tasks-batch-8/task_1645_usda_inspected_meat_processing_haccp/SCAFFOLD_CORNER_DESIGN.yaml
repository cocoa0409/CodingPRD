        test_recipe:
          setup: ["plant; label in DRAFT"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-15", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
