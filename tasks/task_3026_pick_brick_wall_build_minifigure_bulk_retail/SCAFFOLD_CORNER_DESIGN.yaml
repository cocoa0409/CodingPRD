  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_launch_version_on_a_grant_batch_is_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[launch-grant-stale-launch]", "errors[ERR_STALE_VERSION]", "endpoints.POST_/stores/launch-queues/grant"]
        distinguishing_aspect: "The grant batch checks the observed launch version: a batch replayed with the pre-grant version is rejected with the stale-version error while the first batch succeeds and advances the version."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0230 with element 6701, two members, one bin holding 600 g, launch LEGO-H1 allocated 4 units releasing on 2026-09-02, and two WAITING queue rows."]
