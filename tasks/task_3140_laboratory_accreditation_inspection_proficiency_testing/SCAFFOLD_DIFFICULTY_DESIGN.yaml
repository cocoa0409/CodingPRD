              captures: { f2: $.data.id }
            - call: "POST /inspection-cycles/${cyc2}/issue-findings"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-findings/${f2}/respond"
              payload: { response_text: "Corrected." }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "POST /inspection-findings/${f2}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_c2}"
          trigger:
            - call: "POST /laboratories/${lab_id}/reinstate"
              payload: {}
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
            - call: "POST /pt-investigations/${inv_id}/resolve"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /laboratories/${lab_id}/reinstate"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "First reinstate: 409 ERR_OPEN_INVESTIGATION_EXISTS; Laboratory.${lab_id}.accreditation_status stays PROBATION"
            - "Resolving INV (UNDER_REVIEW -> RESOLVED) does NOT touch the SUSPENDED enrollment (resolve restores only from CORRECTIVE_ACTION_REQUIRED)"
            - "Second reinstate: 200; Laboratory.${lab_id}.accreditation_status == ENROLLED"
            - "DisciplineEnrollment.${enr_id}.status == ACTIVE again (reinstate cascade)"
            - "Laboratory.${lab_id}.active_discipline_count == 1"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: inspection_cycle_window_half_open_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
        distinguishing_aspect: "HALF-OPEN interval semantics on the InspectionCycle resource: a new cycle whose scheduled_start == an existing open cycle's scheduled_end does NOT overlap (touching boundaries admitted), while a start one second earlier inside the existing window is rejected with ERR_CYCLE_WINDOW_OVERLAP."
        test_recipe:
          setup:
            - "Clock default. Lab L created (no enrollments needed — window conflict is checked at creation)."
            - "Existing cycle C1 on L: window [2026-10-01, 2026-10-10), status TEAM_ASSEMBLY."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Overlap Lab", clia_number: "45D0000070" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /inspection-cycles"
              payload: { laboratory_id: "${lab_id}", scheduled_start: "2026-10-01T00:00:00Z", scheduled_end: "2026-10-10T00:00:00Z" }
              as: AccreditationOfficer
              captures: { cyc1: $.data.id }
          trigger:
            - call: "POST /inspection-cycles"
              payload: { laboratory_id: "${lab_id}", scheduled_start: "2026-10-10T00:00:00Z", scheduled_end: "2026-10-20T00:00:00Z" }
              as: AccreditationOfficer
              captures: { cyc2: $.data.id }
            - call: "POST /inspection-cycles"
              payload: { laboratory_id: "${lab_id}", scheduled_start: "2026-10-09T23:59:59Z", scheduled_end: "2026-10-15T00:00:00Z" }
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "The touching cycle [10-10, 10-20) is created (201): half-open semantics admit shared endpoints"
            - "The one-second-earlier cycle [10-09 23:59:59, 10-15) is rejected: 409 ERR_CYCLE_WINDOW_OVERLAP"
            - "A third cycle fully outside (2026-11-01..2026-11-05) is also created successfully"

      - name: pt_shipment_closed_interval_overlap_at_due_at
        grounds:
          - validations[priority=6]
          - errors[ERR_SHIPMENT_WINDOW_OVERLAP]
          - entities.PTShipment.fields.due_at
        distinguishing_aspect: "CLOSED-interval semantics on the PTShipment resource — different geometry than the half-open cycle windows: a new shipment whose shipped_at EQUALS the open shipment's due_at (2026-09-11T00:00:00Z) IS an overlap (inclusive end) and is rejected with ERR_SHIPMENT_WINDOW_OVERLAP; only after the prior shipment CLOSES (deadline elapses at > due_at) may a new shipment be created."
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Lab with one ACTIVE CHEMISTRY enrollment (section assigned); PT subscription (analytes [glucose critical])."
            - "Shipment S1 created at 2026-09-01 (window [09-01, 09-11] closed both ends, OPEN)."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Shipment Lab", clia_number: "45D0000071" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /pt-subscriptions"
              payload: { enrollment_id: "${enr_id}", analytes: [{ name: "glucose", critical: true }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-A" }
              as: PTCoordinator
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-B" }
              as: PTCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-B" }
              as: PTCoordinator
              captures: { sh2: $.data.id }
          assert:
            - "At 2026-09-11T00:00:00Z (== S1.due_at, S1 still OPEN because the deadline closes only when clock > due_at): creating S2 is rejected 409 ERR_SHIPMENT_WINDOW_OVERLAP (closed interval: due_at itself is inside S1's window)"
            - "At 2026-09-12T00:00:00Z the clock advance auto-closes S1 (status CLOSED, closure_reason DEADLINE_ELAPSED)"
            - "Creating S2 now succeeds (201): closed shipments no longer participate in overlap"
            - "PTShipment.${sh2}.due_at == 2026-09-22T00:00:00Z (shipped_at + 10 days)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: active_discipline_count_invariant_under_suspend_restore
        grounds:
          - entities.Laboratory.fields.active_discipline_count
          - state_machines.PTInvestigation.UNDER_REVIEW_to_CORRECTIVE_ACTION_REQUIRED
          - state_machines.PTInvestigation.CORRECTIVE_ACTION_REQUIRED_to_RESOLVED
        distinguishing_aspect: "Conserved quantity: Laboratory.active_discipline_count. Invariant pinned: active_discipline_count == count(DisciplineEnrollment where laboratory_id == L and status == ACTIVE) after every operation. require-corrective-action (suspend) paired with resolve (restore) leaves the count unchanged net-net (2 -> 1 -> 2), and every intermediate read is exact."
        test_recipe:
          setup:
            - "Clock default. Lab L with two ACTIVE enrollments: E1 CHEMISTRY (PT subscribed, analytes [glucose critical]) and E2 MOLECULAR. active_discipline_count == 2."
            - "E1 graded UNSATISFACTORY once ([50] -> 0.0): INV auto-created, moved OPEN -> UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Invariant Lab", clia_number: "45D0000080" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr1: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "MOLECULAR" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr2: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr1}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec1: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr2}", section_name: "PCR", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec2: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /checklist-editions"
              payload: { checklist_code: "MOL", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec1}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec2}/assign-checklist"
              payload: { checklist_code: "MOL", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /pt-subscriptions"
              payload: { enrollment_id: "${enr1}", analytes: [{ name: "glucose", critical: true }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-A" }
              as: PTCoordinator
              captures: { sh1: $.data.id }
            - call: "POST /pt-results"
              payload: { shipment_id: "${sh1}", collected_at: "2026-09-02T00:00:00Z", analyte_scores: [{ name: "glucose", score: 50 }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "GET /pt-investigations"
              payload: { enrollment_id: "${enr1}" }
              as: AccreditationOfficer
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /pt-investigations/${inv_id}/begin-review"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /pt-investigations/${inv_id}/require-corrective-action"
              payload: { corrective_action_notes: "Retrain staff; recalibrate analyzer." }
              as: AccreditationOfficer
            - call: "GET /laboratories/${lab_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { count_mid: $.data.active_discipline_count }
            - call: "POST /pt-investigations/${inv_id}/resolve"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /laboratories/${lab_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { count_end: $.data.active_discipline_count }
          assert:
            - "After require-corrective-action: DisciplineEnrollment.${enr1}.status == SUSPENDED and count_mid == 1"
            - "DisciplineEnrollment.${enr2}.status == ACTIVE throughout"
            - "After resolve: DisciplineEnrollment.${enr1}.status == ACTIVE and count_end == 2 — the suspend/restore pair conserves active_discipline_count exactly"
            - "DisciplineEnrollment.${enr1}.unsuccessful_event_streak == 0 after resolve"

      - name: deficiency_burden_invariant_under_cite_withdraw
        grounds:
          - calculations.deficiency_burden_score
          - state_machines.InspectionFinding.CITED_to_WITHDRAWN
          - state_machines.InspectionFinding.RESPONSE_SUBMITTED_to_ACCEPTED
        distinguishing_aspect: "Conserved quantity: InspectionCycle.deficiency_burden_score over unresolved findings. Invariant pinned: burden == sum over findings with status in {CITED, RESPONSE_SUBMITTED, ESCALATED} of level-weight x critical-multiplier, and ACCEPTED/WITHDRAWN contribute 0. Cite (burden 0 -> 2) paired with withdraw (2 -> 0), and cite + respond + accept (0 -> 2 -> 2 -> 0), both return the cycle to exactly 0 with no drift; provisional_decision stamped at issue-findings does NOT drift back (it is frozen at issue time)."
        test_recipe:
          setup:
            - "Clock default. Lab L ENROLLED, one ACTIVE CHEMISTRY enrollment (section SEC assigned, personnel QUALIFIED, method APPROVED)."
            - "Cycle C conducted (window entered at 2026-09-12). No findings yet."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Drift Lab", clia_number: "45D0000081" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /laboratories"
              payload: { name: "Drift Peer", clia_number: "45D0000082" }
              as: AccreditationOfficer
              captures: { lab_b_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /personnel-records"
              payload: { enrollment_id: "${enr_id}", person_name: "Dot Drift", personnel_role: "TESTING_PERSONNEL" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { pers_id: $.data.id }
            - call: "POST /personnel-records/${pers_id}/verify-qualification"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /method-validations"
              payload: { enrollment_id: "${enr_id}", method_name: "M1", instrument_name: "I1", correlation_r_squared: 0.99, precision_cv_pct: 2.0 }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { mv_id: $.data.id }
            - call: "POST /method-validations/${mv_id}/submit"
              payload: {}
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "POST /method-validations/${mv_id}/approve"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-cycles"
              payload: { laboratory_id: "${lab_id}", scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-20T00:00:00Z" }
              as: AccreditationOfficer
              captures: { cyc_id: $.data.id }
            - call: "POST /inspector-profiles"
              payload: { full_name: "Drift Inspector One", affiliated_laboratory_id: "${lab_b_id}", specialties: ["CHEMISTRY"] }
              as: AccreditationOfficer
              captures: { insp1: $.data.id }
            - call: "POST /inspector-profiles"
              payload: { full_name: "Drift Inspector Two", affiliated_laboratory_id: "${lab_b_id}", specialties: ["CHEMISTRY"] }
              as: AccreditationOfficer
              captures: { insp2: $.data.id }
            - call: "POST /team-assignments"
              payload: { inspection_cycle_id: "${cyc_id}", inspector_id: "${insp1}", role_in_team: "LEAD" }
              as: AccreditationOfficer
              captures: { asg1: $.data.id }
            - call: "POST /team-assignments/${asg1}/clear"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-cycles/${cyc_id}/screen-team"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /inspection-cycles/${cyc_id}/conduct"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /inspection-findings"
              payload: { inspection_cycle_id: "${cyc_id}", section_id: "${sec_id}", checklist_item_code: "CHM.10010", deficiency_level: "LEVEL_1" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { f1: $.data.id }
            - call: "POST /inspection-findings/${f1}/withdraw"
              payload: {}
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /inspection-findings"
              payload: { inspection_cycle_id: "${cyc_id}", section_id: "${sec_id}", checklist_item_code: "CHM.10011", deficiency_level: "LEVEL_1" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { f2: $.data.id }
            - call: "POST /inspection-cycles/${cyc_id}/issue-findings"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-findings/${f2}/respond"
              payload: { response_text: "Corrected." }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "POST /inspection-findings/${f2}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp2}"
            - call: "GET /inspection-cycles/${cyc_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { burden_end: $.data.deficiency_burden_score, prov_end: $.data.provisional_decision }
          assert:
            - "After citing F1 then withdrawing it, burden returns to exactly 0 (withdraw is the compensating action for cite)"
            - "After citing F2 (burden 2), respond keeps burden at 2 (RESPONSE_SUBMITTED still unresolved), accept returns burden to exactly 0"
            - "burden_end == 0 with no drift after the full cite/withdraw + cite/respond/accept round trip"
            - "prov_end == CONDITIONAL (frozen at issue-findings when F2 was unresolved with burden 2) — the provisional variant does NOT recompute as findings resolve, distinguishing it from the live burden"
