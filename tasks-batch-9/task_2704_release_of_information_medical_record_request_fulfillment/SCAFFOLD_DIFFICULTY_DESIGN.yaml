  - rule_id: compensating_invariant
    instances:

      - name: invoice_void_restores_facility_money_three_way_sum
        grounds:
          - calculations.facility_money_ledger
          - state_machines.Request.billing_status.INVOICED_to_PENDING_INVOICE
          - endpoints.POST_/roi/invoices/{id}/settlement
        distinguishing_aspect: >
          The invariant checked is a three-way partition, not a single field:
          receivable + collected + written_off must always equal the sum of
          amount_due over every ISSUED, PAID or WAIVED invoice. A VOID must
          un-post exactly the bucket the invoice had landed in and leave the other
          two untouched, and the void must be a true compensation — the request
          becomes re-invoiceable and re-issuing restores the original figure with
          no drift. A second facility-level invoice is live throughout so the
          reversal cannot hide behind an all-zero ledger.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CA fee rule; one facility; one patient; one ATTORNEY requester with a VALID authorization."
            - "Request A: THIRD_PARTY_AUTHORIZATION, PAPER_MAIL, certification_requested, one 62-page GENERAL_MEDICAL segment -> amount_due 4501."
            - "Request B: THIRD_PARTY_AUTHORIZATION, SECURE_PORTAL, no certification, one 25-page GENERAL_MEDICAL segment -> amount_due 2188."
            - "The two requests use disjoint date ranges so the duplicate-in-flight rule at priority 35 does not fire."
            - "Both requests are walked to RELEASE_READY; nothing is released, so both penalty measures stay 0 and no forfeiture applies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
