  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_role_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "An undeclared role header value is rejected at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any schema or role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /orgs", payload: { name: "X", org_type: "MEDICAL", credit_limit_cents: 1000 }, as: Anonymous, captures: { err_auth: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"

      - name: role_check_precedes_existence_returns_unauthorized
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]"]
        distinguishing_aspect: "OrgRequester calling POST /interpreters/{unknown-uuid}/activate gets ERR_UNAUTHORIZED_ROLE (priority 3), not ERR_INTERPRETER_NOT_FOUND (priority 5)."
        test_recipe:
          setup: ["org exists (to authenticate as a valid OrgRequester)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orgs", payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
          trigger:
            - { call: "POST /interpreters/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/activate", payload: {}, as: OrgRequester, as_user_id: "${org1}", captures: { err_role: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403), not a 404"

      - name: submit_within_two_hour_lead_returns_invalid_schedule
        claim_type: temporal_validation
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_SCHEDULE]"]
        distinguishing_aspect: "Submit at 2026-06-10T12:30:00Z for a 13:30 start violates the >= 2h lead by 1h; ERR_INVALID_SCHEDULE (422)."
        test_recipe:
          setup: ["DRAFT request scheduled 2026-06-10T13:30:00Z; clock at 12:30 same day"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orgs", payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Dee Af", modality: "VRI", scheduled_start: "2026-06-10T13:30:00Z", scheduled_end: "2026-06-10T14:30:00Z" }, as: OrgRequester, as_user_id: "${org1}", captures: { req1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T12:30:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}", captures: { err_sched: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_SCHEDULE (422); request remains DRAFT"

      - name: create_onsite_request_without_address_returns_error
        claim_type: conditional_validation
        grounds: ["validations[priority=2]", "errors[ERR_ONSITE_ADDRESS_REQUIRED]"]
        distinguishing_aspect: "onsite_address is conditionally required: omitted with modality ASL_ONSITE -> ERR_ONSITE_ADDRESS_REQUIRED; the same body with modality VRI succeeds."
        test_recipe:
          setup: ["org exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orgs", payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { org1: $.data.id } }
          trigger:
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Dee Af", modality: "ASL_ONSITE", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }, as: OrgRequester, as_user_id: "${org1}", captures: { err_addr: $.data.error_id } }
            - { call: "POST /requests", payload: { org_id: "${org1}", consumer_name: "Dee Af", modality: "VRI", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }, as: OrgRequester, as_user_id: "${org1}", captures: { req_vri: $.data.id } }
          assert:
            - "first call error_id == ERR_ONSITE_ADDRESS_REQUIRED (400)"
            - "second call succeeds (201): VRI has no address requirement"

