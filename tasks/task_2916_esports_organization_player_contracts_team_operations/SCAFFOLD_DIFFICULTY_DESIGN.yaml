            - "Counter 3 returned 409 ERR_NEGOTIATION_ROUNDS_EXHAUSTED (round_number 3 is not < max_negotiation_rounds 3) and offer_status is still SENT"
            - "decline returned 200 and offer_status == DECLINED"
            - "The counter attempted after DECLINED returned 409 ERR_OFFER_NOT_OPEN — the terminal state admits no further transition"

      - name: player_contract_parallel_dimensions_suspension_versus_obligation_escalation
        grounds:
          - state_machines.PlayerContract.ACTIVE_to_SUSPENDED
          - state_machines.PlayerContract.COMPLIANT_to_WARNED
          - state_machines.PlayerContract.WARNED_to_BREACH
          - entities.PlayerContract.fields.obligation_status
          - entities.PlayerContract.fields.wellness_hold_until
          - calculations.burnout_score
        distinguishing_aspect: |
          PlayerContract carries two independent state dimensions on one row. contract_status is
          administratively driven (ACTIVE -> SUSPENDED) while obligation_status is escalation-only
          and system-driven by the ROLLING_7DAY burnout score (COMPLIANT -> WARNED -> BREACH, no
          path back to COMPLIANT even when the score falls). Suspension leaves obligation_status
          untouched and a breach leaves contract_status untouched, so the combined state
          (SUSPENDED, BREACH) is reachable only by walking both dimensions.
