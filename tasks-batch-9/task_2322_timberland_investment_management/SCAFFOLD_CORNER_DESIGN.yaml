          valuation_basis_stale_count is a COUNT over the fund's owned tracts, so it must be re-derived
          after each of the three writes that can change it and not incremented ad hoc: 0 while SIGNED,
          1 once invalidated, still 1 while merely re-SUBMITTED (SUBMITTED is not SIGNED), and back to 0
