            - "HoneyAllocation.${alloc}.reserve_kg == 0.890 (round3(17.800 * 0.03) = 0.534, then + edu portion 0.356 — order pinned: host share first, edu top-up after)"
            - "HoneyAllocation.${alloc}.operator_kg == 11.659 (remainder: 17.800 - 5.251 - 0.890)"
            - "HoneyAllocation.${alloc}.host_kg + reserve_kg + operator_kg == 17.800 == pool_net_kg"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: three instances on DIFFERENT entities
  # (Agreement amendment cycle, Inspection revision loop, Subscription cure cycle)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_amendment_cycle_reject_then_accept
        grounds:
          - state_machines.Agreement.ACTIVE_to_AMENDMENT_PENDING
          - state_machines.Agreement.AMENDMENT_PENDING_to_ACTIVE
          - concurrency_rules[agreement-amendment-occ]
        distinguishing_aspect: |
          Agreement is cyclic: ACTIVE -> AMENDMENT_PENDING -> ACTIVE (reject exit, terms
          unchanged at 2500) -> AMENDMENT_PENDING again (re-proposal allowed after reject)
          -> ACTIVE (accept exit, terms now 3200). Two full loops with both exit branches.
        test_recipe:
          setup:
            - "Host ACTIVE with waiver; site CLEAR; agreement signed (ACTIVE, host_share_base_bps 2500, version captured after sign)"
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Host Seven", email: "h7@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "7 Walnut Way", base_capacity_hives: 2, water_source: true, setback_feet: 7 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}", captures: { ag_v: $.data.version } }
          trigger:
            - { call: "POST /api/agreements/${ag}/propose-amendment", payload: { proposed_host_share_base_bps: 3000, expected_agreement_version: "${ag_v}" }, as: PlatformOps, captures: { ag_v3: $.data.version } }
            - { call: "POST /api/agreements/${ag}/reject-amendment", payload: {}, as: Host, as_user_id: "${h}", captures: { ag_v4: $.data.version, bps_after_reject: $.data.host_share_base_bps, status_after_reject: $.data.status } }
            - { call: "POST /api/agreements/${ag}/propose-amendment", payload: { proposed_host_share_base_bps: 3200, expected_agreement_version: "${ag_v4}" }, as: PlatformOps, captures: { ag_v5: $.data.version } }
            - { call: "POST /api/agreements/${ag}/accept-amendment", payload: {}, as: Host, as_user_id: "${h}", captures: { bps_final: $.data.host_share_base_bps, status_final: $.data.status } }
          assert:
            - "captured ${status_after_reject} == ACTIVE and ${bps_after_reject} == 2500 (reject exit restores ACTIVE with terms unchanged)"
            - "second propose succeeded after reject (cycle ACTIVE -> AMENDMENT_PENDING reachable again): ${ag_v5} == ${ag_v4} + 1"
            - "captured ${status_final} == ACTIVE and ${bps_final} == 3200 (accept exit applies the second proposal)"
            - "each mutation bumped Agreement.version by exactly 1 (OCC chain ${ag_v} -> +1 -> +1 -> +1 -> +1)"

      - name: inspection_return_resubmit_revision_loop
        grounds:
          - state_machines.Inspection.SUBMITTED_to_RETURNED
          - state_machines.Inspection.RETURNED_to_SUBMITTED
          - state_machines.Inspection.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Inspection is a revision-loop cycle (SUBMITTED -> RETURNED -> SUBMITTED -> VERIFIED)
          on the Inspection entity — distinct from the Agreement cycle; RETURNED is non-terminal
          and the loop preserves return_reason as audit while allowing resubmission.
        test_recipe:
          setup:
            - "Host/site/agreement/hive in place (host ACTIVE, waiver current, agreement ACTIVE)"
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Host Eight", email: "h8@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "8 Cherry Ln", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-05-10T00:00:00Z", mites_counted: 4, bees_sampled: 300, disease_flag: false, brood_score: 7, queen_seen: true, stores_kg: 9.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /api/inspections/${insp}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${insp}/return", payload: { return_reason: "redo brood frames" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { st_returned: $.data.status } }
            - { call: "POST /api/inspections/${insp}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1", captures: { st_resub: $.data.status } }
            - { call: "POST /api/inspections/${insp}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1", captures: { st_final: $.data.status, verifier: $.data.verified_by_id, reason_kept: $.data.return_reason } }
          assert:
            - "captured ${st_returned} == RETURNED (revision exit from SUBMITTED)"
            - "captured ${st_resub} == SUBMITTED (loop back into SUBMITTED from RETURNED is legal)"
            - "captured ${st_final} == VERIFIED and ${verifier} == mgr-1"
            - "captured ${reason_kept} == redo brood frames (return_reason retained as audit across the loop)"
            - "Hive.${hv}.posture == STABLE after verify (mites 1.33/100, brood 7, stores 9 — no threshold crossed)"

      - name: subscription_past_due_cure_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - state_machines.Subscription.PAST_DUE_to_ACTIVE
          - calculations.invoice_total
        distinguishing_aspect: |
          Subscription is cyclic via billing: ACTIVE -> PAST_DUE (rollover aging) -> ACTIVE
          (full cure). The cure is all-or-nothing: paying invoice1 while invoice2 remains OPEN
          does NOT cure; only paying the last unpaid invoice closes the loop.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE; BASIC subscription ACTIVE with invoice1 (2999 cents, due 2026-05-08) UNPAID"
            - "Logical clock advanced to 2026-06-01 for rollover"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Nine", email: "h9@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "BASIC" }, as: PlatformOps, captures: { sub: $.data.id } }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/seasons/${s1}/rollover", payload: { name: "S2026-mid", frost_date: "2027-10-15T00:00:00Z" }, as: PlatformOps }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv2: "$.data[1].id" } }
            - { call: "GET /api/subscriptions/${sub}", payload: {}, as: PlatformOps, captures: { sub_past_due: $.data.status } }
          trigger:
            - { call: "POST /api/invoices/${inv1}/pay", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "GET /api/subscriptions/${sub}", payload: {}, as: PlatformOps, captures: { sub_mid: $.data.status } }
            - { call: "POST /api/invoices/${inv2}/pay", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "GET /api/subscriptions/${sub}", payload: {}, as: PlatformOps, captures: { sub_cured: $.data.status } }
            - { call: "GET /api/hosts/${h}", payload: {}, as: PlatformOps, captures: { host_cured: $.data.status } }
          assert:
            - "captured ${sub_past_due} == PAST_DUE (rollover aged invoice1 to OVERDUE and moved the subscription)"
            - "captured ${sub_mid} == PAST_DUE (paying invoice1 does NOT cure while invoice2 is still OPEN — partial payment stays in the loop)"
            - "captured ${sub_cured} == ACTIVE (paying the last unpaid invoice closes ACTIVE -> PAST_DUE -> ACTIVE)"
            - "captured ${host_cured} == ACTIVE (host LIMITED -> ACTIVE via the same cure cascade)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: two instances from DIFFERENT triggers,
  # depths 3 and 3 (first >= 3, second >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: verify_inspection_quarantine_cascade_chain
        grounds:
          - state_machines.Inspection.SUBMITTED_to_VERIFIED
          - state_machines.Hive.ACTIVE_to_QUARANTINED
          - state_machines.Harvest.RECORDED_to_VOIDED
          - calculations.honey_share_allocation
        distinguishing_aspect: |
          Depth-3 chain from the verify trigger: verify mutates the Hive (posture + lifecycle
          QUARANTINED); the hive quarantine itself voids the RECORDED harvest h2; the harvest
          void itself recomputes the (season, hive) HoneyAllocation (projected pool drops from
          10.000 to 5.000). Each link is caused by the previous link, not by the verify call.
