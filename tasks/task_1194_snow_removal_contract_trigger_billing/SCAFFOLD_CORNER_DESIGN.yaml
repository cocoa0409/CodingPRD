# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# (task 1194). Breadth probe over §1.1-§1.7 claims not covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: client_creation_defaults_and_default_clock
        claim_type: creation_defaults
        grounds:
          - entities.Client
          - response_envelope
        distinguishing_aspect: "Minimal create yields 201 with system fields; the unset logical clock reads the fixed default 2026-05-01T00:00:00Z so created_at is deterministic."
        test_recipe:
          setup: ["Empty DB; clock never set"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Default Tester", credit_limit_cents: 500000 }, as: OpsDispatcher, captures: { cl_id: $.data.id, cl_created: $.data.created_at, cl_version: $.data.version, cl_exposure: $.data.credit_exposure_cents } }
          trigger:
            - { call: "GET /clients/${cl_id}", as: OpsDispatcher, captures: { cl_get_name: $.data.name } }
          assert:
            - "Create returns 201 with server-minted UUID id, version == 1, credit_exposure_cents == 0"
            - "created_at == \"2026-05-01T00:00:00.000Z\" — the fixed startup clock default (ISO 8601 UTC, three fractional digits)"
            - "GET round-trip returns the same name \"Default Tester\""

      - name: site_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Site.fields.pavement_area_sqft
          - validations[priority=9]
        distinguishing_aspect: "pavement_area_sqft has source input and no default; omitting it must fail with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Req Fields Co", credit_limit_cents: 500000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "No Area Lot", address: "1 Void St", region_code: "NE" }, as: OpsDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status 400"

      - name: contract_type_conditional_required_fields
        claim_type: conditional_validation
        grounds:
          - validations[priority=9]
          - entities.Contract.fields.contract_type
        distinguishing_aspect: "Required-field set is conditional on contract_type: PER_PUSH without per_push_rate_cents and SEASONAL without seasonal_push_cap both fail with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Conditional Co", credit_limit_cents: 500000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z" }, as: OpsDispatcher, captures: { err1: $.data.error_id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "SEASONAL", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", seasonal_fee_cents: 1000000 }, as: OpsDispatcher, captures: { err2: $.data.error_id } }
          assert:
            - "PER_PUSH without per_push_rate_cents: error_id == ERR_INVALID_REQUEST"
            - "SEASONAL without seasonal_push_cap and seasonal_overage_rate_cents: error_id == ERR_INVALID_REQUEST"

      - name: contract_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Contract.fields.contract_type
          - validations[priority=9]
        distinguishing_aspect: "contract_type outside {PER_PUSH, SEASONAL, HOURLY} is rejected."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Enum Co", credit_limit_cents: 500000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "DAILY", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z" }, as: OpsDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status 400"

      - name: get_nonexistent_contract_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /contracts/00000000-0000-0000-0000-000000000000", as: OpsDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status 404"

      - name: weather_observation_append_only_immutable
        claim_type: immutability
        grounds:
          - entities.WeatherObservation
        distinguishing_aspect: "common_fields: false — the observation carries id and created_at but no version/updated_at, and the surface exposes no update or delete endpoint."
        test_recipe:
          setup: ["Storm event exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e: $.data.id } }
          trigger:
            - { call: "POST /observations", payload: { storm_event_id: "${e}", source_name: "NOAA", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.1 }, as: PlatformAdmin, captures: { ob: $.data.id, ob_created: $.data.created_at } }
          assert:
            - "Create returns 201 with id and created_at == \"2026-12-10T07:00:00.000Z\" (logical clock stamp)"
            - "Response contains no version and no updated_at keys (common_fields: false)"

      - name: contract_computed_field_input_returns_invalid_request
        claim_type: computed_fields
        grounds:
          - entities.Contract.fields.season_billed_cents
          - validations[priority=9]
        distinguishing_aspect: "Strict schema: submitting a computed field (season_billed_cents) in a create payload is rejected rather than silently ignored."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Strict Schema Co", credit_limit_cents: 500000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, season_billed_cents: 999 }, as: OpsDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (unknown/computed field in payload)"

      - name: contract_defaults_applied_on_create
        claim_type: defaults
        grounds:
          - entities.Contract.fields.trigger_depth_inches
          - entities.Contract.fields.sla_miss_penalty_cents
          - entities.Contract.fields.require_photo_verification
        distinguishing_aspect: "Omitted optional fields take their declared defaults."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Defaults Co", credit_limit_cents: 500000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000 }, as: OpsDispatcher, captures: { trig: $.data.trigger_depth_inches, pen: $.data.sla_miss_penalty_cents, photo: $.data.require_photo_verification, night: $.data.night_premium_pct, tier: $.data.hourly_tier_threshold_minutes } }
          assert:
            - "trigger_depth_inches == 2.0, sla_miss_penalty_cents == 15000, require_photo_verification == true, night_premium_pct == 0.25, hourly_tier_threshold_minutes == 2400"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds:
          - state_machines.Contract
          - state_machines.StormEvent
          - state_machines.ServiceVisit
          - state_machines.Subcontractor
          - state_machines.Dispute
        distinguishing_aspect: "Every machine-bearing entity lands in its declared initial_state on creation."
        test_recipe:
          setup: ["Client, site, DRAFT contract created"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Init States Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Init Lot", address: "1 Start St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { s: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id, k_status: $.data.status } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e: $.data.id, e_status: $.data.status } }
            - { call: "POST /subcontractors", payload: { legal_name: "Init Sub", contact_email: "i@sub.example" }, as: OpsDispatcher, captures: { sub_status: $.data.status, sub_score: $.data.reliability_score } }
            - { call: "POST /contracts/${k}/activate", as: OpsDispatcher }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${s}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { cs: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e}", contract_site_id: "${cs}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v_exec: $.data.execution_status, v_bill: $.data.billing_status, v_sla: $.data.sla_deadline_at } }
          assert:
            - "Contract created with status == DRAFT; StormEvent == REPORTED; Subcontractor == PENDING with reliability_score == 0"
            - "Visit created with execution_status == SCHEDULED and billing_status == PENDING"
            - "Visit sla_deadline_at == \"2026-12-10T14:00:00.000Z\" (window_end 08:00 + 360 min, no grace)"

      - name: visit_complete_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_IN_PROGRESS
          - validations[priority=5]
        distinguishing_aspect: "complete is only legal from IN_PROGRESS; from SCHEDULED it must fail with ERR_INVALID_STATE and leave no side effects (actual_start_at stays null)."
        test_recipe:
          setup: ["ACTIVE per-push contract; one SCHEDULED visit, never started"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Bad Trans Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Skip Lot", address: "2 Skip St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { s: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${s}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { cs: $.data.id } }
            - { call: "POST /contracts/${k}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e}", contract_site_id: "${cs}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /visits/${v}/complete", as: CrewLead, captures: { err: $.data.error_id } }
            - { call: "GET /visits/${v}", as: OpsDispatcher, captures: { v_exec: $.data.execution_status, v_start: $.data.actual_start_at } }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP status 409"
            - "Visit remains execution_status == SCHEDULED with actual_start_at == null"

      - name: terminal_lockdown_paid_invoice_and_rejected_photo
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Invoice
          - state_machines.ServicePhoto
          - validations[priority=5]
        distinguishing_aspect: "Terminal states reject every further trigger: voiding a PAID invoice and accepting a REJECTED photo both fail with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["Issued invoice fully paid (PAID); one photo REJECTED"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Terminal Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Final Lot", address: "3 End St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { s: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, trigger_depth_inches: 1.0, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${s}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { cs: $.data.id } }
            - { call: "POST /contracts/${k}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e}", contract_site_id: "${cs}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v}/start", as: CrewLead }
            - { call: "POST /photos", payload: { visit_id: "${v}", phase: "BEFORE", image_uri: "s3://proof/before.jpg" }, as: CrewLead, captures: { ph: $.data.id } }
            - { call: "POST /photos/${ph}/reject", as: OpsDispatcher, captures: { ph_status: $.data.review_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v}/complete", as: CrewLead }
            - { call: "POST /observations", payload: { storm_event_id: "${e}", source_name: "NOAA", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.0 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${e}", source_name: "DTN", observed_at: "2026-12-10T08:00:00Z", accumulation_inches: 2.1 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${e}/verify", as: OpsDispatcher }
            - { call: "POST /invoices", payload: { contract_id: "${k}", kind: "EVENT", storm_event_id: "${e}" }, as: OpsDispatcher, captures: { inv: $.data.id } }
            - { call: "POST /invoices/${inv}/issue", as: OpsDispatcher }
            - { call: "POST /invoices/${inv}/pay", payload: { amount_cents: 45000 }, as: OpsDispatcher, captures: { inv_paid: $.data.status } }
          trigger:
            - { call: "POST /invoices/${inv}/void", as: OpsDispatcher, captures: { err1: $.data.error_id } }
            - { call: "POST /photos/${ph}/accept", as: OpsDispatcher, captures: { err2: $.data.error_id } }
          assert:
            - "Invoice reached PAID (paid 45000 == total 45000); voiding it now fails with error_id == ERR_ALREADY_TERMINAL"
            - "Photo was REJECTED (terminal); accept attempt fails with error_id == ERR_ALREADY_TERMINAL"

      - name: contract_suspend_resume_cycle_gates_visit_creation
        claim_type: guarded_transitions
        grounds:
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - state_machines.Contract.SUSPENDED_to_ACTIVE
          - validations[priority=20]
        distinguishing_aspect: "The ACTIVE<->SUSPENDED cycle on Contract gates child operations: visit creation fails while SUSPENDED (ERR_CONTRACT_NOT_ACTIVE) and succeeds again after resume — cross-entity gate Visit -> Contract."
        test_recipe:
          setup: ["ACTIVE per-push contract with one site; storm event reported"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Suspend Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Hold Lot", address: "4 Pause St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { s: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${s}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { cs: $.data.id } }
            - { call: "POST /contracts/${k}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e: $.data.id } }
            - { call: "POST /contracts/${k}/suspend", as: OpsDispatcher, captures: { k_status: $.data.status } }
          trigger:
            - { call: "POST /visits", payload: { storm_event_id: "${e}", contract_site_id: "${cs}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /contracts/${k}/resume", as: OpsDispatcher, captures: { k_status2: $.data.status } }
            - { call: "POST /visits", payload: { storm_event_id: "${e}", contract_site_id: "${cs}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v: $.data.id, v_exec: $.data.execution_status } }
          assert:
            - "While SUSPENDED: visit creation fails with error_id == ERR_CONTRACT_NOT_ACTIVE"
            - "After resume (status == ACTIVE again — cycle closed): identical creation succeeds with execution_status == SCHEDULED"

      - name: dispute_evidence_cycle_and_upheld_resolution
        claim_type: valid_transition
        grounds:
          - state_machines.Dispute.OPEN_to_EVIDENCE_REVIEW
          - state_machines.Dispute.EVIDENCE_REVIEW_to_OPEN
          - state_machines.Dispute.EVIDENCE_REVIEW_to_RESOLVED_UPHELD
        distinguishing_aspect: "The Dispute machine loops EVIDENCE_REVIEW -> OPEN -> EVIDENCE_REVIEW before resolving; UPHELD resolution settles the visit with zero credit and leaves the invoice total unchanged."
        test_recipe:
          setup: ["Issued invoice invD (total 45000) covering visit vD; dispute dD opened by the owning client; invoice issued by dispatcher user disp-1, visit completed by crew user crew-9"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Cycle Client", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Cycle Lot", address: "5 Loop St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { s: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, trigger_depth_inches: 1.0, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${s}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { cs: $.data.id } }
            - { call: "POST /contracts/${k}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e}", contract_site_id: "${cs}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { vD: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vD}/start", as: CrewLead, as_user_id: "crew-9" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vD}/complete", as: CrewLead, as_user_id: "crew-9" }
            - { call: "POST /observations", payload: { storm_event_id: "${e}", source_name: "NOAA", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.0 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${e}", source_name: "DTN", observed_at: "2026-12-10T08:00:00Z", accumulation_inches: 2.1 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${e}/verify", as: OpsDispatcher }
