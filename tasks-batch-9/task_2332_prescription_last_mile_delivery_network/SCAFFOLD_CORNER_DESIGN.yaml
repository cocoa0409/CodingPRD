      - name: cold_excursion_forces_the_recorded_outcome_over_the_requested_one
        claim_type: side_effect_execution
        grounds:
          - state_machines.Delivery.OUT_FOR_DELIVERY->RETURN_PENDING(cold override)
          - calculations.handling_class_and_verification_requirements
        distinguishing_aspect: "The requested_outcome DELIVERED is overwritten with COLD_BREACH once the excursion clock passes 120 minutes, and the override drives a four-link cascade."
        excluded_because:
          difficulty_instance: cold_breach_forced_outcome_cascade_depth_four
          rationale: "§1.8 already drives this transition end to end, including the forced-outcome substitution and the resulting ExceptionCase / FeeAllocation / PlanGrant links; a §1.9 duplicate would only re-assert the same rows."
      - name: custody_and_settlement_dimensions_advance_independently
        claim_type: parallel_shape
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Delivery.custody
          - state_machines.Delivery.settlement
        distinguishing_aspect: "The parallel shape claim: a custody move does not imply a settlement move and vice versa, and the pair (custody, settlement) is what determines legality."
        excluded_because:
          difficulty_instance: delivery_custody_and_settlement_dimensions_advance_independently
          rationale: "§1.8 walks the full cross-product of the two dimensions on one delivery, which subsumes any single-pair §1.9 probe."

