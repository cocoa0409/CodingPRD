      - name: writeoff_amount_mismatch_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "errors[ERR_WRITEOFF_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "A write-off amount_cents 50000 on an 80000-dunnable invoice returns ERR_WRITEOFF_AMOUNT_MISMATCH (422) — must equal dunnable exactly."
        test_recipe:
          setup: ["OPEN invoice balance 80000, no dispute"]
