        grounds:
          - calculations.early_bird_contract_pricing
          - entities.SeasonalContract.fields.early_bird
          - state_machines.SeasonalContract.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Datetime boundary reached via POST /contracts/{id}/sign: signed_date == early_bird_cutoff (exactly
          2026-08-15T00:00:00Z) still qualifies because the rule is signed_date <= cutoff (inclusive); early_bird
          is true and discount 10500 applies. This metric (the cutoff instant) is distinct from the route-capacity
          count boundary.
        test_recipe:
          setup:
            - "Clock set exactly to 2026-08-15T00:00:00Z; a DRAFT contract with the same early_bird_cutoff, base 80000, storage surcharge 25000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SalesRep
            - call: "POST /customers"
              payload: { name: "Lee Owner", service_address: "12 Cliff St", roofline_feet: 175 }
