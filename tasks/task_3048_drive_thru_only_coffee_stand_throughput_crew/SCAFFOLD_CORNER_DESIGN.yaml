        distinguishing_aspect: "Lane payment sequencing: lane A holds order seq 1 (UNPAID) and seq 2 (AUTHORIZED); capturing seq 2 fails ERR_CAPTURE_OUT_OF_SEQUENCE until seq 1 is authorized and captured."
