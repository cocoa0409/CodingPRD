              payload: { mold_code: "MLD-CVK-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 20.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - &cvK_oven
              call: "POST /oven-stations"
              payload: { station_code: "OV-CVK", arm_count: 1, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - &cvK_bay
              call: "POST /cooling-bays"
              payload: { bay_code: "CB-CVK", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - *cvA_wh
