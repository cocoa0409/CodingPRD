        grounds:
          - validations[priority=11]
          - validations[priority=30]
          - errors.ERR_REFERRAL_ALREADY_OUTSTANDING
        excluded_because:
          difficulty_instance: outstanding_referral_constraint_beats_registration_state
          rationale: "That §1.8 priority_pair_validation_conflict instance violates priority 11 and priority 30 with a single named-call issuance and asserts ERR_REFERRAL_ALREADY_OUTSTANDING, plus the isolating control that surfaces ERR_REGISTRATION_NOT_ACTIVE when only the lower row is violated."
      - name: named_call_list_size_is_checked_against_the_computed_allowance
        claim_type: aggregate_validation
        grounds:
          - validations[priority=33]
          - validations[priority=34]
          - calculations.named_call_and_skill_allowance
        excluded_because:
          difficulty_instance: named_call_and_skill_allowance_nested_min_max
          rationale: "That §1.8 combinatorial_formula instance already tests the collective limits — each named member exists and is individually dispatchable, but the array as a whole exceeds named_call_allowance — at the exact min/max boundary for both allowances."
  - section: endpoints
    instances:
      - name: contractor_create_read_list_and_status_update_all_work
        claim_type: standard_crud
        grounds:
          - endpoints["POST /hiring-hall/contractors"]
          - endpoints["GET /hiring-hall/contractors/{id}"]
          - endpoints["GET /hiring-hall/contractors"]
          - endpoints["PATCH /hiring-hall/contractors/{id}/signatory-status"]
        distinguishing_aspect: "The Contractor surface is create / read / list / narrow update with no delete: the created row reads back identically, the list filter selects by signatory_status, and the PATCH changes only that field while bumping version from 1 to 2."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; no contractors on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
          trigger:
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Aldridge Mechanical", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "SIGNATORY" }
              as: HallAdmin
              captures: { c1_id: $.data.id, c1_name: $.data.name, c1_status: $.data.signatory_status, c1_v: $.data.version }
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Delinquent Drilling", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "DELINQUENT_TRUST_FUNDS" }
              as: HallAdmin
              captures: { c2_id: $.data.id }
            - call: "GET /hiring-hall/contractors/${c1_id}"
              payload: {}
              as: Dispatcher
              captures: { read_name: $.data.name, read_expires: $.data.agreement_expires_at, read_status: $.data.signatory_status }
            - call: "GET /hiring-hall/contractors"
              payload: { signatory_status: "SIGNATORY" }
              as: Dispatcher
              captures: { list_first: "$.data[0].id", list_total: $.meta.total_count }
            - call: "PATCH /hiring-hall/contractors/${c1_id}/signatory-status"
              payload: { signatory_status: "TERMINATED" }
              as: BusinessManager
              as_user_id: "bm-09"
              captures: { patched_status: $.data.signatory_status, patched_name: $.data.name, patched_v: $.data.version }
            - call: "GET /hiring-hall/contractors"
              payload: { signatory_status: "SIGNATORY" }
