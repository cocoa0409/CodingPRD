              payload: { target_response_state: "MITIGATED" }
              as: NocAnalyst
            - call: "POST /sla-credit-claims/${low_claim_id}/submit"
              payload: { basis: "CARRIER_CLOCK", attestation_note: "restoration exceeded the 4-hour target" }
              as: VendorManager
              as_user_id: "vm-1"
          assert:
            - "first submit -> 409 with error_id ERR_INCIDENT_NOT_MITIGATED (priority 43 wins even though the 422 condition is also true)"
            - "SlaCreditClaim.${low_claim_id}.state == DRAFT and submitted_at == null after the rejected first submit"
            - "SlaCreditClaim.${low_claim_id}.credit_amount_cents == 45999 while Carrier.min_claim_amount_cents == 100000"
            - "control: after the incident reaches MITIGATED the second submit -> 422 with error_id ERR_CLAIM_BELOW_MINIMUM"
            - "SlaCreditClaim.${low_claim_id}.state is still DRAFT after both rejections"
            - "Carrier.${nlc_id}.open_credit_exposure_cents == 45999 throughout (a DRAFT claim is already in the open set)"

      - name: window_review_redundancy_risk_beats_window_overlap
        grounds:
          - validations[priority=70]
          - validations[priority=80]
          - errors.ERR_REDUNDANCY_RISK_UNACKNOWLEDGED
          - errors.ERR_WINDOW_OVERLAP
          - endpoints["POST /maintenance-windows/{id}/review"]
          - state_machines.MaintenanceWindow.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          A different pair and a different shape from the claim-submit conflict: here the higher-priority
          rule (70, 422) is a safety precondition on the request BODY and the lower one (80, 409) is a
          temporal conflict against stored rows, so flipping risk_acknowledged from false to true on an
          otherwise identical request changes the response from 422 to 409 without ever approving it.
        test_recipe:
          setup:
            - "Carrier EWT with two MONITORED circuits EWT-CKT-2001 (LEG_A) and EWT-CKT-2002 (LEG_B)."
            - "One GOLD ApplicationPath spanning both legs with min_surviving_legs 1, so taking either circuit out leaves projected_healthy_legs 1 <= min_surviving_legs and requires an explicit risk acknowledgement."
            - "Window V on circuit 2001 covering 02:00-03:00 is already APPROVED (reviewed with risk_acknowledged true)."
            - "Window W on circuit 2001 covering 03:20-04:00 is PROPOSED; the 30-minute change buffer makes W conflict with V (03:20 < 03:30)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Eastward Telecom", carrier_code: "EWT" }
              as: PlatformAdmin
              captures: { ewt_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${ewt_id}", carrier_circuit_identifier: "EWT-CKT-2001", site_a_code: "NYC01", site_z_code: "PHL01", bandwidth_mbps: 1000, mrc_cents: 500000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c5_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${ewt_id}", carrier_circuit_identifier: "EWT-CKT-2002", site_a_code: "NYC01", site_z_code: "PHL01", bandwidth_mbps: 1000, mrc_cents: 500000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c6_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Core Voice Path", service_tier: "GOLD", protection_scheme: "ACTIVE_ACTIVE", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { px_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${px_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c5_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${px_id}", leg_group: "LEG_B", sequence_index: 1, circuit_id: "${c6_id}" }
              as: PlatformAdmin
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${c5_id}", origin: "CARRIER_NOTIFIED", window_start: "2026-08-11T02:00:00Z", window_end: "2026-08-11T03:00:00Z", suppresses_monitoring: true }
              as: CarrierLiaison
              as_user_id: "${ewt_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /maintenance-windows/${wv_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: true }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${c5_id}", origin: "INTERNAL_CHANGE", window_start: "2026-08-11T03:20:00Z", window_end: "2026-08-11T04:00:00Z", suppresses_monitoring: true }
              as: NocAnalyst
              captures: { ww_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows/${ww_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: false }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /maintenance-windows/${ww_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: true }
              as: NocShiftLead
              as_user_id: "lead-1"
          assert:
            - "first review -> 422 with error_id ERR_REDUNDANCY_RISK_UNACKNOWLEDGED (priority 70 wins over the also-true priority-80 overlap)"
            - "MaintenanceWindow.${ww_id}.state == PROPOSED and risk_acknowledged == false after the 422"
            - "second review -> 409 with error_id ERR_WINDOW_OVERLAP (the buffered conflict with V now surfaces)"
            - "MaintenanceWindow.${ww_id}.state == PROPOSED and approved_by_user_id == null after both rejections"
            - "MaintenanceWindow.${wv_id}.state == APPROVED throughout"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: utilization_threshold_inclusive_at_exactly_80_00
        grounds:
          - calculations.capacity_threshold_evaluation
          - entities.CapacityReading.fields.threshold_state
          - entities.Circuit.fields.consecutive_high_readings
          - entities.Circuit.fields.capacity_state
          - state_machines.Circuit.capacity_state_dimension
        distinguishing_aspect: |
          Two-decimal inclusivity on a >= threshold: 79.99 is NORMAL (accumulator stays 0, capacity_state
          NORMAL) while 80.00 on the very next sample is HIGH (accumulator 1, capacity_state WATCH), and
          because CONSECUTIVE_HIGH_READINGS_FOR_UPGRADE is 3 the boundary hit must NOT auto-create an
          UpgradeOrder — the one-cent-equivalent step moves exactly one dimension.
        test_recipe:
          setup:
            - "Carrier WBF with one MONITORED circuit WBF-CKT-4001 at bandwidth_mbps 100."
            - "The circuit starts with consecutive_high_readings 0 and capacity_state NORMAL and has no CapacityReading rows."
            - "HIGH_UTILIZATION_PCT is 80.00 and CONSECUTIVE_HIGH_READINGS_FOR_UPGRADE is 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Westbound Fiber", carrier_code: "WBF" }
              as: PlatformAdmin
              captures: { wbf_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${wbf_id}", carrier_circuit_identifier: "WBF-CKT-4001", site_a_code: "DEN01", site_z_code: "SLC01", bandwidth_mbps: 100, mrc_cents: 300000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c4_id: $.data.id }
          trigger:
            - call: "POST /circuits/${c4_id}/capacity-readings"
              payload: { sample_at: "2026-08-05T01:00:00Z", utilization_pct: 79.99, direction: "EGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T01:05:00Z" }
              as: PlatformAdmin
            - call: "POST /circuits/${c4_id}/capacity-readings"
              payload: { sample_at: "2026-08-05T01:05:00Z", utilization_pct: 80.00, direction: "EGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { r2_id: $.data.id }
            - call: "GET /circuits/${c4_id}/upgrade-orders"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
          assert:
            - "CapacityReading.${r1_id}.threshold_state == NORMAL"
            - "after the 79.99 reading: Circuit.${c4_id}.consecutive_high_readings == 0 and capacity_state == NORMAL"
            - "CapacityReading.${r2_id}.threshold_state == HIGH (80.00 satisfies the inclusive >= bound)"
            - "after the 80.00 reading: Circuit.${c4_id}.consecutive_high_readings == 1 and capacity_state == WATCH"
            - "GET /circuits/{id}/upgrade-orders returns total_count 0 (1 < 3 consecutive HIGH readings)"
            - "Carrier.${wbf_id}.committed_upgrade_mbps == 0"

      - name: sla_breach_requires_strictly_exceeding_the_target_minute
        grounds:
          - calculations.sla_credit_amount
          - validations[priority=92]
          - errors.ERR_NO_SLA_BREACH
          - endpoints["POST /sla-credit-claims"]
          - concurrency_rules[manual-claim-create-stale-ticket]
        distinguishing_aspect: |
          The mirror-image inclusivity to the utilization threshold: restoration exactly AT the 240-minute
          target is not a breach (strictly-greater comparison), so no AUTO_DRAFT claim is synthesised at
          all and a manual CARRIER_CLOCK claim is refused, while the NOC_CLOCK reading of the same outage
          sits one 30-minute step past the target and yields a 45999-cent claim on the same ticket version.
        test_recipe:
          setup:
            - "Carrier NLC with default terms (sla_restore_minutes_critical 240, min_claim_amount_cents 5000)."
            - "Circuit NLC-CKT-1001 MONITORED, mrc_cents 920000, with the four single-leg GOLD/SILVER/SILVER/BRONZE paths (W = 9)."
            - "Alarm detected 00:00 -> SEV1 incident (target 240); ticket opened 00:30; no maintenance window."
            - "Carrier reports RESTORED at 04:30, so restoration_minutes_carrier_clock is exactly 240.00 and restoration_minutes_noc_clock is 270.00."
            - "Alarm cleared 04:30; restoration confirmed at 05:00 by lead-1 and NO claim is auto-drafted, so the manual create path is reachable; the ticket version returned by that confirm is captured for the OCC guard."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "NorthLink Communications", carrier_code: "NLC" }
              as: PlatformAdmin
              captures: { nlc_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${nlc_id}", carrier_circuit_identifier: "NLC-CKT-1001", site_a_code: "NYC01", site_z_code: "BOS01", bandwidth_mbps: 200, mrc_cents: 920000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Trading Gateway", service_tier: "GOLD", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Claims Portal", service_tier: "SILVER", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { ps1_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Payroll Feed", service_tier: "SILVER", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { ps2_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest WiFi", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pg_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${ps1_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${ps2_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${pb_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-10T00:00:00Z", source_circuit_id: "${c1_id}" }
              as: NocAnalyst
              captures: { a1_id: $.data.id, i1_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${i1_id}", circuit_id: "${c1_id}", carrier_reference: "NLC-TT-88006" }
              as: NocAnalyst
              captures: { t2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:30:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${t2_id}/carrier-update"
              payload: { update: "RESTORED", restored_at: "2026-08-10T04:30:00Z" }
              as: CarrierLiaison
              as_user_id: "${nlc_id}"
            - call: "POST /alarms/${a1_id}/clear"
              payload: { cleared_at: "2026-08-10T04:30:00Z" }
              as: NocAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T05:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${t2_id}/confirm-restoration"
              payload: { soak_passed: true }
              as: NocShiftLead
              as_user_id: "lead-1"
              captures: { t2_v: $.data.version }
          trigger:
            - call: "POST /sla-credit-claims"
              payload: { carrier_ticket_id: "${t2_id}", expected_carrier_ticket_version: "${t2_v}", basis: "CARRIER_CLOCK" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /sla-credit-claims"
              payload: { carrier_ticket_id: "${t2_id}", expected_carrier_ticket_version: "${t2_v}", basis: "NOC_CLOCK" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { manual_claim_id: $.data.id }
          assert:
            - "CarrierTicket.${t2_id}.restoration_minutes_carrier_clock == 240.00 and restoration_minutes_noc_clock == 270.00"
            - "confirm-restoration created no claim: GET /sla-credit-claims for the ticket had total_count 0"
            - "Carrier.${nlc_id}.open_credit_exposure_cents == 0 immediately after the confirmation"
            - "first create -> 422 with error_id ERR_NO_SLA_BREACH (240.00 == 240 is not a breach)"
            - "second create -> 201; SlaCreditClaim.${manual_claim_id}.origin == MANUAL and basis == NOC_CLOCK"
            - "SlaCreditClaim.${manual_claim_id}.breach_minutes == 30.00 and breach_hours == 1"
            - "SlaCreditClaim.${manual_claim_id}.credit_amount_cents == 45999"
            - "Carrier.${nlc_id}.open_credit_exposure_cents == 45999 after the successful create"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: carrier_ticket_open_requires_monitored_circuit_not_suppressed
        grounds:
          - validations[priority=62]
          - errors.ERR_CIRCUIT_NOT_MONITORED
          - state_machines.Circuit.monitoring_state_dimension
          - state_machines.MaintenanceWindow.APPROVED_to_IN_PROGRESS
          - state_machines.MaintenanceWindow.IN_PROGRESS_to_COMPLETED
          - endpoints["POST /maintenance-windows/{id}/state"]
          - endpoints["POST /carrier-tickets"]
        distinguishing_aspect: |
          The gate is a field on a THIRD entity: whether a ticket may be opened depends on
          Circuit.monitoring_state, which is owned by neither the ticket nor the incident but is written
          by the MaintenanceWindow lifecycle — starting the window suppresses monitoring and blocks the
          ticket, completing it restores monitoring_state_before_start and unblocks the identical request.
        test_recipe:
          setup:
            - "Carrier SRG with one MONITORED circuit SRG-CKT-3001 and one GOLD single-leg path on it."
            - "A CRITICAL alarm at 00:00 opens Incident i3 and drives the circuit DOWN."
            - "A window on that circuit covering 01:00-02:00 with suppresses_monitoring true is APPROVED (risk acknowledged) and then started at 01:30, so Circuit.monitoring_state is MAINTENANCE_SUPPRESSED and monitoring_state_before_start records MONITORED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Southridge Networks", carrier_code: "SRG" }
              as: PlatformAdmin
              captures: { srg_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${srg_id}", carrier_circuit_identifier: "SRG-CKT-3001", site_a_code: "ATL01", site_z_code: "MIA01", bandwidth_mbps: 500, mrc_cents: 400000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c3_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Card Auth Path", service_tier: "GOLD", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pa_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c3_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-12T00:00:00Z", source_circuit_id: "${c3_id}" }
              as: NocAnalyst
              captures: { a3_id: $.data.id, i3_id: $.data.incident_id }
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${c3_id}", origin: "CARRIER_NOTIFIED", window_start: "2026-08-12T01:00:00Z", window_end: "2026-08-12T02:00:00Z", suppresses_monitoring: true }
              as: CarrierLiaison
              as_user_id: "${srg_id}"
              captures: { w3_id: $.data.id }
            - call: "POST /maintenance-windows/${w3_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: true }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T01:30:00Z" }
              as: PlatformAdmin
            - call: "POST /maintenance-windows/${w3_id}/state"
              payload: { target_state: "IN_PROGRESS" }
              as: NocShiftLead
              as_user_id: "lead-1"
          trigger:
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${i3_id}", circuit_id: "${c3_id}", carrier_reference: "SRG-TT-5501" }
              as: NocAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maintenance-windows/${w3_id}/state"
              payload: { target_state: "COMPLETED" }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${i3_id}", circuit_id: "${c3_id}", carrier_reference: "SRG-TT-5501" }
              as: NocAnalyst
              captures: { t3_id: $.data.id }
          assert:
            - "while the window is IN_PROGRESS: Circuit.${c3_id}.monitoring_state == MAINTENANCE_SUPPRESSED and monitoring_state_before_start == MONITORED"
            - "first ticket POST -> 409 with error_id ERR_CIRCUIT_NOT_MONITORED"
            - "no CarrierTicket row was created by the rejected call (GET /carrier-tickets filtered on the incident had total_count 0)"
            - "after COMPLETED: MaintenanceWindow.${w3_id}.state == COMPLETED and Circuit.${c3_id}.monitoring_state == MONITORED"
            - "second ticket POST -> 201 with the identical body; CarrierTicket.${t3_id}.state == OPEN and tier_level == 1"
            - "CarrierTicket.${t3_id}.reported_circuit_identifier == SRG-CKT-3001"
            - "CarrierTicket.${t3_id}.carrier_id == ${srg_id} (copied from the circuit, not supplied)"

      - name: failover_start_blocked_by_approved_window_on_the_sibling_leg
        grounds:
          - validations[priority=71]
          - validations[priority=72]
          - errors.ERR_MAINTENANCE_IN_EFFECT
          - state_machines.FailoverTest.SCHEDULED_to_IN_PROGRESS
          - endpoints["POST /failover-tests/{id}/start"]
          - entities.MaintenanceWindow.fields.state
        distinguishing_aspect: |
          The blocking entity is not on the operation's own leg and not even in an active state: the test
          targets LEG_A while the APPROVED (never started) window sits on the LEG_B circuit, so the
          path's own posture check at priority 71 passes (PROTECTED) and only the priority-72 sweep across
          every circuit reachable from the path refuses the start; cancelling that window unblocks it.
        test_recipe:
          setup:
            - "Carrier EWT with two MONITORED, UP circuits EWT-CKT-2001 (LEG_A) and EWT-CKT-2002 (LEG_B)."
            - "GOLD ApplicationPath 'Core Voice Path' ACTIVE_ACTIVE, min_surviving_legs 1, posture PROTECTED with healthy_leg_count 2."
            - "A window on the LEG_B circuit covering 06:00-07:00 with suppresses_monitoring false is APPROVED but never started, so no circuit or path state changes."
            - "A FailoverTest on LEG_A is SCHEDULED for 06:00-07:00 and the clock is moved to 06:30, inside both intervals."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T05:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Eastward Telecom", carrier_code: "EWT" }
              as: PlatformAdmin
              captures: { ewt_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${ewt_id}", carrier_circuit_identifier: "EWT-CKT-2001", site_a_code: "NYC01", site_z_code: "PHL01", bandwidth_mbps: 1000, mrc_cents: 500000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c5_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${ewt_id}", carrier_circuit_identifier: "EWT-CKT-2002", site_a_code: "NYC01", site_z_code: "PHL01", bandwidth_mbps: 1000, mrc_cents: 500000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c6_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Core Voice Path", service_tier: "GOLD", protection_scheme: "ACTIVE_ACTIVE", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { px_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${px_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c5_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${px_id}", leg_group: "LEG_B", sequence_index: 1, circuit_id: "${c6_id}" }
              as: PlatformAdmin
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${c6_id}", origin: "CARRIER_NOTIFIED", window_start: "2026-08-11T06:00:00Z", window_end: "2026-08-11T07:00:00Z", suppresses_monitoring: false }
              as: CarrierLiaison
              as_user_id: "${ewt_id}"
              captures: { wb_id: $.data.id }
            - call: "POST /maintenance-windows/${wb_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: true }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /failover-tests"
              payload: { application_path_id: "${px_id}", tested_leg_group: "LEG_A", scheduled_start: "2026-08-11T06:00:00Z", scheduled_end: "2026-08-11T07:00:00Z" }
              as: NocShiftLead
              as_user_id: "lead-1"
              captures: { ft1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T06:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /failover-tests/${ft1_id}/start"
              payload: {}
              as: NocAnalyst
            - call: "POST /maintenance-windows/${wb_id}/state"
              payload: { target_state: "CANCELLED" }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /failover-tests/${ft1_id}/start"
              payload: {}
              as: NocAnalyst
          assert:
            - "ApplicationPath.${px_id}.posture == PROTECTED before the first start (so priority 71 is satisfied)"
            - "first start -> 409 with error_id ERR_MAINTENANCE_IN_EFFECT (the window is on the sibling LEG_B circuit and only APPROVED)"
            - "FailoverTest.${ft1_id}.state == SCHEDULED after the 409"
            - "MaintenanceWindow.${wb_id}.state == CANCELLED after the cancel and Circuit.${c6_id}.monitoring_state == MONITORED (nothing to reverse: it never suppressed)"
            - "second start -> 200 with FailoverTest.${ft1_id}.state == IN_PROGRESS"
            - "FailoverTest.${ft1_id}.carrier_id_set contains exactly one entry, ${ewt_id}"
            - "while the test runs ApplicationPath.${px_id}.healthy_leg_count == 1 and posture == DEGRADED_NO_REDUNDANCY"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: maintenance_windows_buffered_closed_intervals_per_circuit
        grounds:
          - validations[priority=80]
          - errors.ERR_WINDOW_OVERLAP
          - endpoints["POST /maintenance-windows/{id}/review"]
          - entities.MaintenanceWindow.fields.window_start
          - entities.MaintenanceWindow.fields.window_end
        distinguishing_aspect: |
          Buffered CLOSED intervals scoped to one circuit: with CHANGE_BUFFER_MINUTES 30 a window starting
          20 minutes after the approved one ends conflicts, a window that merely TOUCHES the approved end
          instant conflicts, and a window starting exactly 30 minutes after it ends does not — so the
          conflict predicate is inclusive at the buffer edge and the gap boundary is the pass case.
        test_recipe:
          setup:
            - "Carrier WBF with one MONITORED circuit WBF-CKT-4002 that carries no ApplicationPath segments, so the priority-70 redundancy check is vacuous and the temporal rule is isolated."
            - "Window V covering 02:00-03:00 is already APPROVED."
            - "Three PROPOSED windows on the same circuit: W2 03:20-04:00 (inside the buffer), W4 03:00-03:40 (touching V's end) and W3 03:30-04:30 (exactly 30 minutes after V's end)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Westbound Fiber", carrier_code: "WBF" }
              as: PlatformAdmin
              captures: { wbf_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${wbf_id}", carrier_circuit_identifier: "WBF-CKT-4002", site_a_code: "DEN01", site_z_code: "PHX01", bandwidth_mbps: 500, mrc_cents: 350000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c7_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${c7_id}", origin: "CARRIER_NOTIFIED", window_start: "2026-08-13T02:00:00Z", window_end: "2026-08-13T03:00:00Z", suppresses_monitoring: true }
              as: CarrierLiaison
              as_user_id: "${wbf_id}"
              captures: { wv2_id: $.data.id }
            - call: "POST /maintenance-windows/${wv2_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: false }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${c7_id}", origin: "INTERNAL_CHANGE", window_start: "2026-08-13T03:20:00Z", window_end: "2026-08-13T04:00:00Z", suppresses_monitoring: true }
              as: NocAnalyst
              captures: { w2_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${c7_id}", origin: "INTERNAL_CHANGE", window_start: "2026-08-13T03:00:00Z", window_end: "2026-08-13T03:40:00Z", suppresses_monitoring: true }
              as: NocAnalyst
              captures: { w4_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${c7_id}", origin: "INTERNAL_CHANGE", window_start: "2026-08-13T03:30:00Z", window_end: "2026-08-13T04:30:00Z", suppresses_monitoring: true }
              as: NocAnalyst
              captures: { w5_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows/${w2_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: false }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /maintenance-windows/${w4_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: false }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /maintenance-windows/${w5_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: false }
              as: NocShiftLead
              as_user_id: "lead-1"
          assert:
            - "review of W2 (03:20-04:00) -> 409 with error_id ERR_WINDOW_OVERLAP (03:20 < 03:00 + 30)"
            - "MaintenanceWindow.${w2_id}.state == PROPOSED after the 409"
            - "review of W4 (03:00-03:40) -> 409 with error_id ERR_WINDOW_OVERLAP (a touching start is still a conflict)"
            - "MaintenanceWindow.${w4_id}.state == PROPOSED after the 409"
            - "review of W3 (03:30-04:30) -> 200 with MaintenanceWindow.${w5_id}.state == APPROVED (a gap of exactly 30 minutes clears the buffer)"
            - "MaintenanceWindow.${w5_id}.approved_by_user_id == lead-1"
            - "MaintenanceWindow.${wv2_id}.state == APPROVED throughout"

      - name: failover_tests_unbuffered_half_open_ceiling_per_carrier
        grounds:
          - validations[priority=81]
          - errors.ERR_FAILOVER_TEST_CONFLICT
          - endpoints["POST /failover-tests"]
          - entities.FailoverTest.fields.carrier_id_set
          - entities.FailoverTest.fields.scheduled_start
          - entities.FailoverTest.fields.scheduled_end
        distinguishing_aspect: |
          The opposite interval convention on a different resource: failover reservations are UNBUFFERED
          and half-open with an aggregate ceiling of one in-flight test per carrier, so a test starting
          exactly when the scheduled one ends is accepted (adjacency never conflicts) while a 30-minute
          straddle is refused — the same 30-minute offset that passes the window rule fails here, and
          vice versa.
        test_recipe:
          setup:
            - "Carrier EWT with two MONITORED circuits EWT-CKT-2001 (LEG_A) and EWT-CKT-2002 (LEG_B) under one GOLD ACTIVE_ACTIVE path with min_surviving_legs 1."
            - "A FailoverTest T1 on LEG_A is SCHEDULED for 01:00-02:00; its carrier_id_set is [EWT]."
            - "MAX_CONCURRENT_FAILOVER_TESTS_PER_CARRIER is 1 and the clock stays at 00:30, before every interval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Eastward Telecom", carrier_code: "EWT" }
              as: PlatformAdmin
              captures: { ewt_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${ewt_id}", carrier_circuit_identifier: "EWT-CKT-2001", site_a_code: "NYC01", site_z_code: "PHL01", bandwidth_mbps: 1000, mrc_cents: 500000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c5_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${ewt_id}", carrier_circuit_identifier: "EWT-CKT-2002", site_a_code: "NYC01", site_z_code: "PHL01", bandwidth_mbps: 1000, mrc_cents: 500000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c6_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Core Voice Path", service_tier: "GOLD", protection_scheme: "ACTIVE_ACTIVE", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { px_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${px_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c5_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${px_id}", leg_group: "LEG_B", sequence_index: 1, circuit_id: "${c6_id}" }
              as: PlatformAdmin
            - call: "POST /failover-tests"
              payload: { application_path_id: "${px_id}", tested_leg_group: "LEG_A", scheduled_start: "2026-08-14T01:00:00Z", scheduled_end: "2026-08-14T02:00:00Z" }
              as: NocShiftLead
              as_user_id: "lead-1"
              captures: { ft2_id: $.data.id }
          trigger:
            - call: "POST /failover-tests"
              payload: { application_path_id: "${px_id}", tested_leg_group: "LEG_B", scheduled_start: "2026-08-14T01:30:00Z", scheduled_end: "2026-08-14T02:30:00Z" }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /failover-tests"
              payload: { application_path_id: "${px_id}", tested_leg_group: "LEG_B", scheduled_start: "2026-08-14T02:00:00Z", scheduled_end: "2026-08-14T03:00:00Z" }
              as: NocShiftLead
              as_user_id: "lead-1"
              captures: { ft3_id: $.data.id }
          assert:
            - "the straddling create (01:30-02:30) -> 409 with error_id ERR_FAILOVER_TEST_CONFLICT"
            - "the adjacent create (02:00-03:00) -> 201 because [01:00,02:00) and [02:00,03:00) do not overlap under the half-open convention"
            - "FailoverTest.${ft3_id}.state == SCHEDULED and scheduled_by_user_id == lead-1"
            - "FailoverTest.${ft3_id}.carrier_id_set contains exactly one entry, ${ewt_id}"
            - "GET /application-paths/{id}/failover-tests on ${px_id} returns total_count 2 (the refused one was never persisted)"
            - "FailoverTest.${ft2_id}.state == SCHEDULED (unaffected by either attempt)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_withdraw_restores_exposure_and_watchlist_exactly
        grounds:
          - state_machines.SlaCreditClaim.DRAFT_to_WITHDRAWN
          - calculations.carrier_exposure_ledger
          - entities.Carrier.fields.open_credit_exposure_cents
          - entities.Carrier.fields.watchlist_state
          - endpoints["POST /sla-credit-claims/{id}/withdraw"]
        distinguishing_aspect: |
          A MONEY invariant whose compensation must also reverse a derived threshold flag: withdrawing the
          45999-cent claim removes it from the open set, so open_credit_exposure_cents returns to exactly 0
          and watchlist_state falls back from WATCHLIST to ACTIVE — the ledger is recomputed from the
          surviving claims rather than decremented, so no residue is left behind on either field.
        test_recipe:
          setup:
            - "Carrier NLC created with watchlist_exposure_threshold_cents 45999."
            - "Circuit NLC-CKT-1001 MONITORED, mrc_cents 920000, with the four single-leg GOLD/SILVER/SILVER/BRONZE paths (W = 9)."
            - "Alarm 00:00 -> SEV1 incident; ticket opened 00:30; carrier reports RESTORED 05:00; alarm cleared 05:00; restoration confirmed 05:30 by lead-1."
            - "That confirmation auto-drafted a 45999-cent claim, pushing Carrier.open_credit_exposure_cents to 45999 and watchlist_state to WATCHLIST."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "NorthLink Communications", carrier_code: "NLC", watchlist_exposure_threshold_cents: 45999 }
              as: PlatformAdmin
              captures: { nlc_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${nlc_id}", carrier_circuit_identifier: "NLC-CKT-1001", site_a_code: "NYC01", site_z_code: "BOS01", bandwidth_mbps: 200, mrc_cents: 920000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Trading Gateway", service_tier: "GOLD", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Claims Portal", service_tier: "SILVER", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { ps1_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Payroll Feed", service_tier: "SILVER", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { ps2_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest WiFi", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pg_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${ps1_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${ps2_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${pb_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-10T00:00:00Z", source_circuit_id: "${c1_id}" }
              as: NocAnalyst
              captures: { a1_id: $.data.id, i1_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:30:00Z" }
