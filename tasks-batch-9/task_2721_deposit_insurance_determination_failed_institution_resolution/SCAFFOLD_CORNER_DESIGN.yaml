            - "trigger[2]: HTTP 200, total_distributed_cents == round_half_up(25000000 * 100 / 10000) == 250000, certificate_count == 0"
            - "trigger[4]: HTTP 201, distribution_round == 2, priority_class == 'GENERAL_UNSECURED'"
            - "trigger[5]: HTTP 200, total_distributed_cents == round_half_up(5000000 * 1000 / 10000) == 500000, certificate_count == 1"
            - "trigger[7]: HTTP 409, data.error_id == 'ERR_PRIORITY_CLASS_OUT_OF_ORDER'"
            - "trigger[8]: HTTP 201, distribution_round == 3 — the refused subrogation round consumed no round number"
            - "trigger[9]: receivership_cash_cents == 10000000 - 250000 - 500000 == 9250000, dividends_paid_cents == 750000, cash_conservation_delta_cents == 0"

      - name: error_code_certify_state_gate_is_triggered_by_the_priority_ladder_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DETERMINATION_NOT_UNDER_REVIEW]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
        excluded_because:
          difficulty_instance: certify_state_error_outranks_segregation_of_duties
          rationale: "Both codes are already returned by that instance — ERR_DETERMINATION_NOT_UNDER_REVIEW on the out-of-state certify and ERR_SEGREGATION_OF_DUTIES_VIOLATION once the state is repaired — so no additional trigger is needed for Table 6 coverage."

      - name: error_code_bid_window_and_bidder_qualification_are_triggered_by_the_priority_ladder_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BID_WINDOW_CLOSED]
          - errors[ERR_BIDDER_NOT_QUALIFIED]
        excluded_because:
          difficulty_instance: bid_deadline_temporal_error_outranks_bidder_qualification
          rationale: "That instance returns ERR_BID_WINDOW_CLOSED for the doubly-invalid bid and ERR_BIDDER_NOT_QUALIFIED once the clock is rewound inside the window, covering both codes."

      - name: error_code_institution_not_closed_is_triggered_by_the_prepare_gate_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INSTITUTION_NOT_CLOSED]
        excluded_because:
          difficulty_instance: prepare_blocked_until_institution_closed_in_receivership
          rationale: "That instance drives prepare at every pre-closure institution status and asserts ERR_INSTITUTION_NOT_CLOSED each time before the closure unblocks it."

      - name: error_code_notice_not_acknowledged_is_triggered_by_the_release_hold_gate_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NOTICE_NOT_ACKNOWLEDGED]
        excluded_because:
          difficulty_instance: release_hold_blocked_until_depositor_acknowledges_notice
          rationale: "That instance attempts release-hold before the depositor acknowledges and asserts ERR_NOTICE_NOT_ACKNOWLEDGED, then repeats it after the acknowledgement."

      - name: error_code_branch_window_overlap_is_triggered_by_the_half_open_adjacency_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BRANCH_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: branch_window_half_open_adjacency_allowed_overlap_conflict
          rationale: "That instance accepts the exactly-adjacent window and asserts ERR_BRANCH_WINDOW_OVERLAP for the one-second overlap, on both the create and the reschedule path."

      - name: error_code_data_room_window_conflict_is_triggered_by_the_sixty_minute_buffer_instance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DATA_ROOM_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: data_room_closed_interval_requires_more_than_sixty_minute_buffer
          rationale: "That instance asserts ERR_DATA_ROOM_WINDOW_CONFLICT at exactly a 60-minute gap and acceptance at 60 minutes plus one second, which is the sharpest available trigger for this code."


  - section: rbac
    coverage_note: |
      role_model is segregation_of_duties over seven roles, two of which are entity-backed
      (Bidder -> Bidder.id, Depositor -> DepositorRecord.id). Covered here: authentication
      (priority 1), the exclusive-operation denial matrix (priority 2) including its precedence
      over the NOT_FOUND family, the shared-operation surface, cross-entity-type identity
      binding, and a stub for the same-user certify prohibition already driven in §1.8.
    instances:
      - name: unauthenticated_when_missing_auth_headers_or_when_the_role_is_undeclared
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "Priority 1 runs before every other check, so a request with no X-User-Role, no X-User-ID, or a role string that is not one of the seven declared roles is ERR_UNAUTHENTICATED (401) even when the path id does not exist and even on a GET that any role could otherwise perform — 401 is never downgraded to 404 or 403."
        test_recipe:
          setup:
            - "Institution 61079 exists in PRE_FAILURE_MONITORING (created by a properly authenticated ClosingManager)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61079", legal_name: "Auth Gate Bank", charter_state: "KY", book_asset_value_cents: 9000000, estimated_liquidation_recovery_cents: 3000000 }
              as: ClosingManager
              captures: { ag_inst_id: $.data.id }
          trigger:
            - call: "GET /institutions/${ag_inst_id}"
              as: "(request sent with no X-User-Role and no X-User-ID header)"
              captures: { ag_err1: $.data.error_id }
            - call: "GET /institutions/${ag_inst_id}"
              as: "(X-User-ID present, X-User-Role header omitted)"
              captures: { ag_err2: $.data.error_id }
            - call: "GET /institutions/${ag_inst_id}"
              as: "(X-User-Role: ClosingManager, X-User-ID header omitted)"
              captures: { ag_err3: $.data.error_id }
            - call: "GET /institutions/${ag_inst_id}"
              as: "(X-User-Role: Auditor — not one of the seven declared roles)"
              captures: { ag_err4: $.data.error_id }
            - call: "GET /institutions/00000000-0000-4000-8000-000000000000"
              as: "(no X-User-Role header)"
              captures: { ag_err5: $.data.error_id }
            - call: "POST /institutions"
              payload: { cert_number: "61080", legal_name: "Ghost Bank", charter_state: "KY", book_asset_value_cents: 1000000, estimated_liquidation_recovery_cents: 500000 }
              as: "(X-User-Role: closingmanager — wrong case, so not a declared role)"
              captures: { ag_err6: $.data.error_id }
            - call: "GET /institutions"
              as: ClosingManager
          assert:
            - "trigger[0]: HTTP 401, data.error_id == 'ERR_UNAUTHENTICATED'"
            - "trigger[1]: HTTP 401, data.error_id == 'ERR_UNAUTHENTICATED'"
            - "trigger[2]: HTTP 401, data.error_id == 'ERR_UNAUTHENTICATED' — both headers are required, not just the role"
            - "trigger[3]: HTTP 401, data.error_id == 'ERR_UNAUTHENTICATED' — an undeclared role is an authentication failure, not a 403"
            - "trigger[4]: HTTP 401, data.error_id == 'ERR_UNAUTHENTICATED' — priority 1 outranks the priority-10 NOT_FOUND check"
            - "trigger[5]: HTTP 401, data.error_id == 'ERR_UNAUTHENTICATED' — role matching is case-sensitive"
            - "trigger[6]: 1 row, total_count == 1 — the refused create never happened"

      - name: every_exclusive_operation_is_denied_to_all_other_roles_before_any_row_lookup
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles
        distinguishing_aspect: "Each of the seven roles owns a disjoint slice of the POST surface, and priority 2 is evaluated before the priority-10..19 NOT_FOUND family and before every state precondition — so ClaimsAgent calling certify on a non-existent determination is ERR_UNAUTHORIZED (403), not ERR_DETERMINATION_NOT_FOUND (404), and none of the refused calls advances the institution's version."
        test_recipe:
          setup:
            - "Institution 61081 is in PRE_FAILURE_MONITORING with depositor Viktor (notice_status PENDING) and one SINGLE account of 8000000."
            - "Bidder 62013 exists in qualification_status PENDING."
            - "the institution's and the depositor's current versions were read so the OCC fields in the refused payloads are well-formed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61081", legal_name: "Role Matrix Bank", charter_state: "SC", book_asset_value_cents: 11000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { rb_inst_id: $.data.id }
            - call: "POST /institutions/${rb_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-RB-1", legal_name: "Viktor Sorokin", depositor_type: "NATURAL_PERSON", contact_email: "viktor@example.com" }
              as: ClaimsAgent
              captures: { rb_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${rb_inst_id}", primary_depositor_id: "${rb_dep_id}", account_number: "RB-0001", ownership_category: "SINGLE", balance_cents: 8000000, accrued_interest_cents: 0, opened_at: "2024-04-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { rb_acct_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Matrix Federal", cert_number: "62013", tier1_capital_ratio_bps: 2000, camels_composite: 2 }
              as: ResolutionAnalyst
              captures: { rb_bidder_id: $.data.id }
            - call: "GET /institutions/${rb_inst_id}"
              as: ClosingManager
              captures: { rb_inst_ver: $.data.version }
            - call: "GET /depositor-records/${rb_dep_id}"
              as: ClaimsAgent
              captures: { rb_dep_ver: $.data.version }
          trigger:
            - call: "POST /institutions/${rb_inst_id}/close"
              as: ClaimsAgent
              captures: { rb_e1: $.data.error_id }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${rb_dep_id}", expected_depositor_record_version: "${rb_dep_ver}" }
              as: ClosingManager
              captures: { rb_e2: $.data.error_id }
            - call: "POST /insurance-determinations/00000000-0000-4000-8000-000000000000/certify"
              as: ClaimsAgent
              captures: { rb_e3: $.data.error_id }
            - call: "POST /insurance-determinations/00000000-0000-4000-8000-000000000000/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsCertifier
              captures: { rb_e4: $.data.error_id }
            - call: "POST /institutions/${rb_inst_id}/dividend-distributions"
              payload: { priority_class: "GENERAL_UNSECURED", declared_rate_bps: 1000, expected_institution_version: "${rb_inst_ver}" }
              as: ResolutionAnalyst
              captures: { rb_e5: $.data.error_id }
            - call: "POST /institutions/${rb_inst_id}/least-cost-test/award"
              as: ReceivershipTrustee
              captures: { rb_e6: $.data.error_id }
            - call: "POST /bids"
              payload: { institution_id: "${rb_inst_id}", bidder_id: "${rb_bidder_id}", structure: "WHOLE_BANK_PA", deposit_premium_bps: 100, asset_discount_bps: 1000, asset_retention_pool_cents: 0, data_room_window_start: "2026-08-06T09:00:00Z", data_room_window_end: "2026-08-06T10:00:00Z" }
              as: Depositor
              as_user_id: "${rb_dep_id}"
              captures: { rb_e7: $.data.error_id }
            - call: "POST /depositor-records/${rb_dep_id}/acknowledge-notice"
              as: Bidder
              as_user_id: "${rb_bidder_id}"
              captures: { rb_e8: $.data.error_id }
            - call: "POST /deposit-accounts/${rb_acct_id}/release-hold"
              as: ClaimsAgent
              captures: { rb_e9: $.data.error_id }
            - call: "POST /branch-reopenings/00000000-0000-4000-8000-000000000000/reschedule"
              payload: { reopen_window_start: "2026-08-10T09:00:00Z", reopen_window_end: "2026-08-10T17:00:00Z" }
              as: ResolutionAnalyst
              captures: { rb_e10: $.data.error_id }
            - call: "GET /institutions/${rb_inst_id}"
              as: ClosingManager
          assert:
            - "trigger[0]..trigger[9]: every response is HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "trigger[2] and trigger[3]: 403 rather than 404 — priority 2 outranks the priority-14 determination lookup"
            - "trigger[8]: 403 rather than the priority-49 ERR_HOLD_NOT_PLACED — the role check precedes the state check"
            - "trigger[9]: 403 rather than the priority-18 ERR_BRANCH_REOPENING_NOT_FOUND"
            - "trigger[10]: status == 'PRE_FAILURE_MONITORING', version == '${rb_inst_ver}' — no refused call mutated anything"

      - name: shared_read_and_clock_operations_are_open_to_all_seven_roles
        claim_type: shared_operation_allowed
        grounds:
          - roles
          - endpoints[GET /institutions/{id}]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Every role declares `all GET endpoints` and the clock endpoint as shared operations, so the same read succeeds for all seven roles — including the two entity-backed roles acting under their own row ids — and the clock is advanceable by a Depositor even though every business write is denied to that role."
        test_recipe:
          setup:
            - "Institution 61082 is in PRE_FAILURE_MONITORING with depositor Wanda and Bidder 62014 (PENDING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61082", legal_name: "Shared Read Bank", charter_state: "TN", book_asset_value_cents: 7000000, estimated_liquidation_recovery_cents: 3000000 }
              as: ClosingManager
              captures: { sh_inst_id: $.data.id }
            - call: "POST /institutions/${sh_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-SH-1", legal_name: "Wanda Mbeki", depositor_type: "NATURAL_PERSON", contact_email: "wanda@example.com" }
              as: ClaimsAgent
              captures: { sh_dep_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Shared Federal", cert_number: "62014", tier1_capital_ratio_bps: 1900, camels_composite: 2 }
              as: ResolutionAnalyst
              captures: { sh_bidder_id: $.data.id }
          trigger:
            - call: "GET /institutions/${sh_inst_id}"
              as: ClosingManager
            - call: "GET /institutions/${sh_inst_id}"
              as: ClaimsAgent
            - call: "GET /institutions/${sh_inst_id}"
              as: ClaimsCertifier
            - call: "GET /institutions/${sh_inst_id}"
              as: ResolutionAnalyst
            - call: "GET /institutions/${sh_inst_id}"
              as: ReceivershipTrustee
            - call: "GET /institutions/${sh_inst_id}"
              as: Bidder
              as_user_id: "${sh_bidder_id}"
            - call: "GET /institutions/${sh_inst_id}/insurance-summary"
              as: Depositor
              as_user_id: "${sh_dep_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T11:00:00Z" }
              as: Depositor
              as_user_id: "${sh_dep_id}"
            - call: "GET /depositor-records"
              payload: { institution_id: "${sh_inst_id}" }
              as: Bidder
              as_user_id: "${sh_bidder_id}"
          assert:
            - "trigger[0]..trigger[6]: every response is HTTP 200 and returns the same institution_id / id — reads are role-blind"
            - "trigger[7]: HTTP 200 — the clock is a shared operation for every role, including Depositor"
            - "trigger[8]: HTTP 200, 1 row, total_count == 1 — a Bidder may read the depositor roster of an institution it does not own"

      - name: entity_backed_identities_are_checked_against_their_own_entity_type
        claim_type: entity_backed_identity
        grounds:
          - validations[priority=26]
          - validations[priority=27]
          - roles
        distinguishing_aspect: "The identity check is not merely 'some id' — a Bidder acting under a DepositorRecord id is ERR_BIDDER_MISMATCH (403) and a Depositor acting under a Bidder id is ERR_DEPOSITOR_MISMATCH (403), so an X-User-ID drawn from the wrong entity type fails exactly like an id belonging to a different peer of the right type, and both mismatches are reported after the role check but before any state precondition."
        test_recipe:
          setup:
            - "Institution 61083 is CLOSED_IN_RECEIVERSHIP with franchise_marketing_status OPEN (deadline 2026-08-12T00:00:00Z) and depositor Xiulan whose notice_status is still PENDING."
            - "Bidder 62015 is QUALIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61083", legal_name: "Identity Type Bank", charter_state: "AL", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
