# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3381_charter_candidate_progression_exam_windows_experience_verification
# Domain: charter candidate progression, computer-based exam windows,
#         work-experience verification, professional-conduct enforcement,
#         membership & continuing education (CFA-Institute-style).
# =============================================================================

scenario: |
  Charter Candidate Progression, Exam Windows & Experience Verification (CFA Institute): candidate registration with education or work eligibility requirements and program enrollment fees, examination scheduling across computer-based windows with seat capacity and rescheduling policies, level progression requiring passage before advancing with no time limit but retake constraints, exam content updates on an annual cycle with curriculum access provided to registered candidates, testing policy enforcement including calculator restrictions, identity verification and misconduct investigation, work experience submission for charter award with role evaluation against investment decision-making criteria and reference verification, professional conduct statement and ethics enforcement with sanctions, membership and society affiliation with continuing education programs

domain_name: charter-candidate-progression
api_prefix: /charter

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # exam windows, scheduling/reschedule deadlines, blackout buffers
  secondary_archetype: compliance_audit        # misconduct investigation, sanctions, segregation of duties
  complexity_layers:
    - optimistic_concurrency                   # OCC on Appointment / WorkExperienceSubmission / MisconductCase versions
    - cascading_side_effects                   # sanction -> attempt invalidation -> progression -> curriculum access
    - dual_variant_calculation                 # experience months (cumulative vs contiguous), CE standing (calendar vs rolling), eligibility pathways
    - rate_threshold_triggers                  # MPS boundary, attempt caps, seat capacity boundary
  entity_topology: graph                       # peer entities joined by cross-aggregate FKs; SocietyMembership is a many-to-many junction
  state_machine_shape: cyclic                  # appeal loops, revision loops, reinstatement loops; ExamAppointment carries two parallel state dimensions
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties            # case investigator != adjudicator; candidate != own reference; proctor != adjudicator
  consistency_model: immediate                 # every mutation visible in the same response envelope

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Candidate
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: email, type: string, source: input, description: "Candidate email; unique across all candidates (ERR_DUPLICATE_CANDIDATE_EMAIL)" }
      - { name: full_name, type: string, source: input, description: "Legal full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: gov_id_number, type: string, source: input, description: "Government identity document number; compared verbatim at exam-day check-in" }
      - { name: highest_level_passed_code, type: enum, source: computed, default: null, description: "null | LEVEL_I | LEVEL_II | LEVEL_III; recomputed from ExamAttempt rows with result=PASS and validity IN {VALID, REINSTATED} on every score/invalidation/reinstatement" }
      - { name: charter_awarded, type: boolean, source: system, default: false, description: "Set true by award-charter; cleared by CHARTER_REVOCATION sanction" }
      - { name: suspended_until, type: datetime, source: system, default: null, description: "Set by SUSPENSION_12M sanction to sanctioned_at + 365 days; cleared on dismissal-after-appeal" }
      - { name: conduct_revoked, type: boolean, source: system, default: false, description: "Set by CHARTER_REVOCATION sanction; cleared on dismissal-after-appeal" }
      - { name: conduct_standing, type: enum, source: computed, description: "REVOKED if conduct_revoked; else SUSPENDED if suspended_until > current logical clock; else GOOD_STANDING" }
      - { name: conduct_statements, type: array, source: system, default: [], description: "Embedded append-only annual statements, appended by POST /charter/candidates/{id}/conduct-statements: [{disclosure_year, has_disclosures, disclosure_text, created_at}]; disclosure_year unique within the array (ERR_DUPLICATE_CONDUCT_STATEMENT)" }

  - name: ProgramEnrollment
    parent: Candidate
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; exactly one enrollment per candidate ever (ERR_DUPLICATE_ENROLLMENT)" }
      - { name: pathway, type: enum, source: input, description: "EDUCATION | WORK_EXPERIENCE" }
      - { name: degree_completed, type: boolean, source: input, required: false, description: "Required when pathway=EDUCATION" }
      - { name: graduation_date, type: string, source: input, required: false, description: "ISO date YYYY-MM-DD; required when pathway=EDUCATION" }
      - { name: declared_work_months, type: integer, source: input, required: false, description: "Required when pathway=WORK_EXPERIENCE" }
      - { name: declared_work_hours, type: integer, source: input, required: false, description: "Required when pathway=WORK_EXPERIENCE" }
      - { name: scholarship_pct, type: number, source: input, default: 0, description: "0..0.5; per-line discount on program fee and exam fees (never reschedule fees)" }
      - { name: status, type: enum, source: system, description: "PENDING_PAYMENT -> ENROLLED -> CHARTER_AWARDED" }
      - { name: lifetime_charges_cents, type: integer, source: computed, default: 0, description: "Sum of every posted charge (program fee, exam fees, reschedule fees), each line rounded half-up to cents BEFORE summing" }
      - { name: lifetime_payments_cents, type: integer, source: computed, default: 0, description: "Sum of all payment amounts" }
      - { name: lifetime_credits_posted_cents, type: integer, source: computed, default: 0, description: "Sum of all compensation credits (appointment cancel / window cancel)" }
      - { name: lifetime_credits_applied_cents, type: integer, source: computed, default: 0, description: "Portion of posted credits absorbed by outstanding charges" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "= lifetime_credits_posted_cents - lifetime_credits_applied_cents; overpayments land here too" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "= lifetime_charges_cents - lifetime_payments_cents - lifetime_credits_applied_cents" }
      - { name: net_billed_cents, type: integer, source: computed, default: 0, description: "= lifetime_charges_cents - lifetime_credits_posted_cents; compensating-invariant anchor" }
      - { name: curriculum_access_cycle_ids, type: array, source: computed, default: [], description: "PUBLISHED CurriculumCycle ids for all levels up to and including the candidate's lowest unpassed level; empty while PENDING_PAYMENT; all PUBLISHED cycles when CHARTER_AWARDED" }
      - { name: chartered_at, type: datetime, source: system, default: null, description: "Set at award-charter" }

  - name: ExamLevel
    parent: null
    common_fields: true
    fields:
      - { name: level_code, type: enum, source: input, description: "LEVEL_I | LEVEL_II | LEVEL_III; unique (ERR_DUPLICATE_EXAM_LEVEL); progression order is the enum order (LEVEL_I has no prerequisite)" }
      - { name: mps_scaled_score, type: integer, source: input, description: "Minimum passing scaled score 0..1000; PASS iff scaled_score >= mps_scaled_score" }
      - { name: max_attempts, type: integer, source: input, description: "1..10; counted over attempts with validity IN {VALID, REINSTATED}" }
      - { name: early_fee_cents, type: integer, source: input, description: "> 0; charged when appointment created_at <= window.early_fee_deadline_at" }
      - { name: standard_fee_cents, type: integer, source: input, description: ">= early_fee_cents" }

  - name: CurriculumCycle
    parent: ExamLevel
    common_fields: true
    fields:
      - { name: exam_level_id, type: string, source: system, description: "FK -> ExamLevel.id (from path)" }
      - { name: cycle_year, type: integer, source: input, description: "Annual content cycle year; unique per exam_level_id (ERR_DUPLICATE_CURRICULUM_YEAR)" }
      - { name: effective_from, type: datetime, source: input, description: "Cycle effective start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Cycle effective end (exclusive); must be > effective_from" }
      - { name: content_version, type: string, source: input, description: "Curriculum edition label" }
      - { name: status, type: enum, source: system, description: "PUBLISHED on creation; auto-ARCHIVED when a newer cycle for the same level is published" }

  - name: ExamWindow
    parent: null
    common_fields: true
    fields:
      - { name: exam_level_id, type: string, source: input, description: "FK -> ExamLevel.id" }
      - { name: window_opens_at, type: datetime, source: input, description: "First exam instant (inclusive)" }
      - { name: window_closes_at, type: datetime, source: input, description: "Last exam instant (exclusive); half-open interval [opens, closes)" }
      - { name: scheduling_deadline_at, type: datetime, source: input, description: "New bookings allowed while clock <= this; must be <= window_opens_at" }
      - { name: reschedule_deadline_at, type: datetime, source: input, description: "Reschedules allowed while clock <= this; must be <= window_closes_at" }
      - { name: early_fee_deadline_at, type: datetime, source: input, description: "EARLY fee tier when appointment created_at <= this; must be <= scheduling_deadline_at" }
      - { name: status, type: enum, source: system, description: "OPEN on creation -> RESULTS_PUBLISHED (auto when every attempt of the window is SCORED) | CANCELLED" }

  - name: TestCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Center name" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: daily_seat_capacity, type: integer, source: input, description: ">= 1; seats available per exam date" }
      - { name: blackout_windows, type: array, source: input, default: [], description: "Maintenance closures: [{blackout_start_date, blackout_end_date, reason}]; dates ISO YYYY-MM-DD, BOTH bounds INCLUSIVE, plus a 1-day buffer on each side blocks bookings" }

  - name: ExamAppointment
    parent: null
    common_fields: true
    fields:
      - { name: program_enrollment_id, type: string, source: input, description: "FK -> ProgramEnrollment.id" }
      - { name: exam_window_id, type: string, source: input, description: "FK -> ExamWindow.id" }
      - { name: test_center_id, type: string, source: input, description: "FK -> TestCenter.id" }
      - { name: candidate_id, type: string, source: system, description: "Denormalized from ProgramEnrollment.candidate_id for list filtering" }
      - { name: exam_date, type: string, source: input, description: "ISO date YYYY-MM-DD; must satisfy window.window_opens_at <= exam_dateT00:00:00Z < window.window_closes_at" }
      - { name: calculator_model, type: enum, source: input, description: "Declared calculator: TI_BA_II_PLUS | HP_12C (the only approved models)" }
      - { name: fee_tier, type: enum, source: computed, description: "EARLY if created_at <= window.early_fee_deadline_at else STANDARD (boundary: exactly at deadline is EARLY)" }
      - { name: exam_fee_cents, type: integer, source: computed, description: "Level fee card by fee_tier, scholarship-discounted per line (round half-up)" }
      - { name: reschedule_count, type: integer, source: system, default: 0, description: "Increments on each successful reschedule" }
      - { name: reschedule_fees_total_cents, type: integer, source: system, default: 0, description: "Sum of reschedule fees charged on this appointment" }
      - { name: booking_status, type: enum, source: system, description: "Parallel dimension 1: SCHEDULED -> CHECKED_IN -> COMPLETED; SCHEDULED -> CANCELLED | NO_SHOW" }
      - { name: compliance_status, type: enum, source: system, description: "Parallel dimension 2: CLEAR -> POLICY_FLAGGED -> CONFIRMED_VIOLATION | CLEARED; CONFIRMED_VIOLATION -> CLEARED on dismissal-after-appeal" }

  - name: ExamAttempt
    parent: null
    common_fields: true
    fields:
      - { name: exam_appointment_id, type: string, source: system, description: "FK -> ExamAppointment.id; created as a side effect of check-in" }
      - { name: candidate_id, type: string, source: system, description: "Denormalized from appointment for list filtering" }
      - { name: exam_level_code, type: string, source: system, description: "Denormalized level_code of the appointment's window level" }
      - { name: attempt_sequence, type: integer, source: computed, description: "1-based count of ALL attempts ever created for (candidate, level), ordered by created_at" }
      - { name: scaled_score, type: integer, source: input, default: null, description: "0..1000; written by the score endpoint" }
      - { name: result, type: enum, source: computed, default: null, description: "PASS iff scaled_score >= level.mps_scaled_score else FAIL; null until scored" }
      - { name: score_status, type: enum, source: system, description: "AWAITING_SCORE -> SCORED" }
      - { name: validity, type: enum, source: system, description: "VALID -> INVALIDATED -> REINSTATED (appeal-driven cycle)" }

  - name: WorkExperienceSubmission
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id (from path)" }
      - { name: segments, type: array, source: input, description: "[{employer_name, role_title, start_date, end_date, qualifying_activity_pct, hours}]; end_date >= start_date; pct 0..100; hours > 0" }
      - { name: provisional_months, type: integer, source: computed, default: null, description: "Cumulative variant computed at submit: sum of months_between over segments with qualifying_activity_pct >= 50 (overlaps double-counted)" }
      - { name: committee_months, type: integer, source: computed, default: null, description: "Contiguous variant computed at review: interval-merge of qualifying segments (overlaps counted once), then sum of months_between over merged runs" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | REJECTED | RETURNED_FOR_REVISION; RETURNED_FOR_REVISION -> DRAFT via amend (cycle)" }
      - { name: reviewer_user_id, type: string, source: system, default: null, description: "X-User-ID of the ExperienceReviewer who issued the latest review decision" }

  - name: ReferenceContact
    parent: null
    common_fields: true
    fields:
      - { name: experience_submission_id, type: string, source: system, description: "FK -> WorkExperienceSubmission.id (from path)" }
      - { name: referee_name, type: string, source: input, description: "Reference's name" }
      - { name: referee_email, type: string, source: input, description: "Reference's email" }
      - { name: status, type: enum, source: system, description: "PENDING -> VERIFIED | DECLINED | EXPIRED (EXPIRED is lazy: now > expires_at on any respond)" }
      - { name: expires_at, type: datetime, source: system, description: "= created_at + 30 days" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "Set on VERIFIED" }

  - name: MisconductCase
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: appointment_id, type: string, source: input, required: false, description: "FK -> ExamAppointment.id; present for exam-day incidents (sets origin EXAM_INCIDENT)" }
      - { name: origin, type: enum, source: system, description: "EXAM_INCIDENT (appointment_id present) | CONDUCT_STATEMENT (auto from PCS) | EXTERNAL_REPORT (manual, default)" }
      - { name: allegation, type: string, source: input, description: "Free-text allegation" }
      - { name: investigator_user_id, type: string, source: system, default: null, description: "X-User-ID of case creator; null for auto-opened PCS cases" }
      - { name: adjudicator_user_id, type: string, source: system, default: null, description: "X-User-ID of latest adjudicator; must differ from investigator_user_id (ERR_SEGREGATION_OF_DUTIES)" }
      - { name: status, type: enum, source: system, description: "OPENED -> SANCTIONED | DISMISSED; SANCTIONED -> APPEALED; APPEALED -> SANCTIONED | DISMISSED (appeal cycle)" }
      - { name: sanction_type, type: enum, source: input, default: null, description: "WARNING | SUSPENSION_12M | EXAM_INVALIDATION | CHARTER_REVOCATION; required iff outcome=SANCTIONED" }
      - { name: sanctioned_at, type: datetime, source: system, default: null, description: "Clock value at latest sanction; appeal deadline = sanctioned_at + 30 days" }
      - { name: appeal_reason, type: string, source: input, default: null, description: "Recorded at appeal" }

  - name: Society
    parent: null
    common_fields: true
    fields:
      - { name: society_code, type: string, source: input, description: "Unique society code (ERR_DUPLICATE_SOCIETY_CODE)" }
      - { name: name, type: string, source: input, description: "Society name" }
      - { name: region, type: string, source: input, description: "Region" }
      - { name: annual_dues_cents, type: integer, source: input, description: "> 0; exact dues amount for join and renew" }
      - { name: ce_credits_required_per_year, type: integer, source: input, default: 20, description: "Calendar-year CE credits required to renew" }

  - name: SocietyMembership
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: society_id, type: string, source: system, description: "FK -> Society.id (from path)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> TERMINATED (charter revocation cascade only)" }
      - { name: paid_through_year, type: integer, source: system, description: "Calendar year dues are paid through; join sets it to the clock's current year; renew increments by exactly 1" }
      - { name: ce_records, type: array, source: system, default: [], description: "Appended via POST .../ce-records: [{activity_title, credit_hours, completed_on}]" }
      - { name: calendar_year_credits, type: number, source: computed, description: "Sum of ce_records credit_hours with completed_on inside the logical clock's current calendar year" }
      - { name: rolling_12m_credits, type: number, source: computed, description: "Sum of ce_records credit_hours with completed_on > (current date - 365 days), i.e. within the trailing 365 days including today" }
      - { name: ce_standing_met, type: boolean, source: computed, description: "= calendar_year_credits >= society.ce_credits_required_per_year" }
# === SCAFFOLD PART 2 MARKER ===

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProgramEnrollment
    initial_state: PENDING_PAYMENT
    terminal_states: [CHARTER_AWARDED]
    transitions:
      - from: PENDING_PAYMENT
        to: ENROLLED
        trigger: "system (automatic on POST /charter/program-enrollments/{enrollmentId}/payments when outstanding_balance_cents reaches 0)"
        actor: system
        preconditions:
          - "Payment amount_cents > 0 (ERR_INVALID_PAYMENT_AMOUNT)"
        side_effects:
          - "curriculum_access_cycle_ids recomputed (PUBLISHED cycles of levels up to and including lowest unpassed level)"
      - from: ENROLLED
        to: CHARTER_AWARDED
        trigger: "POST /charter/program-enrollments/{enrollmentId}/award-charter"
        actor: ProgramAdmin
        preconditions:
          - "Enrollment is ENROLLED (ERR_ENROLLMENT_NOT_ENROLLED)"
          - "Candidate holds a PASS attempt with validity IN {VALID, REINSTATED} for every ExamLevel row (ERR_LEVELS_NOT_ALL_PASSED)"
          - "Sum of committee_months over candidate's APPROVED WorkExperienceSubmission rows >= 36 (ERR_EXPERIENCE_REQUIREMENT_UNMET)"
          - "Candidate.conduct_statements holds an entry with disclosure_year == the logical clock's current calendar year (ERR_MISSING_CONDUCT_STATEMENT)"
          - "No MisconductCase for the candidate in status OPENED or APPEALED (ERR_OPEN_MISCONDUCT_CASE)"
          - "outstanding_balance_cents == 0 (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "Candidate.charter_awarded = true; Candidate.chartered_at via enrollment.chartered_at = current clock"
          - "enrollment.chartered_at = current clock; curriculum_access_cycle_ids = all PUBLISHED cycles"

  - entity: ExamWindow
    initial_state: OPEN
    terminal_states: [RESULTS_PUBLISHED, CANCELLED]
    transitions:
      - from: OPEN
        to: CANCELLED
        trigger: "POST /charter/exam-windows/{windowId}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "Window is OPEN (ERR_WINDOW_NOT_CANCELLABLE from RESULTS_PUBLISHED or CANCELLED)"
        side_effects:
          - "Each appointment of this window with booking_status == SCHEDULED -> CANCELLED (CHECKED_IN appointments are NOT touched)"
          - "For each so-cancelled appointment: full exam_fee_cents credited to its ProgramEnrollment (credits auto-apply to outstanding first, remainder to credit_balance); reschedule fees are never credited"
          - "Window cancel itself does NOT create attempts and does NOT touch compliance_status"
      - from: OPEN
        to: RESULTS_PUBLISHED
        trigger: "system (automatic on POST /charter/exam-attempts/{attemptId}/score when, after scoring, every attempt whose appointment belongs to this window is SCORED)"
        actor: system
        preconditions:
          - "Current clock >= window_closes_at (ERR_WINDOW_NOT_CONCLUDED enforced on the score call)"
        side_effects:
          - "First: every appointment of this window still SCHEDULED -> NO_SHOW (no attempt is created for a no-show; seat stays consumed, no credit)"
          - "Then: every appointment with booking_status == CHECKED_IN -> COMPLETED"

  - entity: CurriculumCycle
    initial_state: PUBLISHED
    terminal_states: [ARCHIVED]
    transitions:
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "system (automatic when POST /charter/exam-levels/{levelId}/curriculum-cycles publishes a newer cycle_year for the same level)"
        actor: system
        preconditions: []
        side_effects:
          - "Every enrollment's curriculum_access_cycle_ids recomputed (archived cycles drop out of all access lists)"

  - entity: ExamAppointment
    initial_state: SCHEDULED  # booking_status dimension; compliance_status dimension starts at CLEAR
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]  # booking_status terminals; compliance_status has no terminal
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /charter/appointments/{appointmentId}/reschedule"
        actor: "Candidate (owner) | ProgramAdmin"
        preconditions:
          - "OCC: expected_appointment_version == appointment.version (ERR_STALE_VERSION, checked before business rules)"
          - "booking_status == SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED)"
          - "Current clock <= ORIGINAL window.reschedule_deadline_at (ERR_RESCHEDULE_DEADLINE_PASSED)"
          - "If exam_window_id changes: target window OPEN (ERR_WINDOW_NOT_OPEN), same level (ERR_WINDOW_LEVEL_MISMATCH), clock <= target scheduling_deadline_at (ERR_WINDOW_SCHEDULING_CLOSED), retake-gap re-checked (ERR_RETAKE_WINDOW_TOO_SOON)"
          - "Effective exam_date inside effective window [opens, closes) (ERR_EXAM_DATE_OUTSIDE_WINDOW)"
          - "No blackout buffer conflict at effective center+date (ERR_CENTER_BLACKOUT_CONFLICT); seat available at effective center+date excluding this appointment's own current seat (ERR_NO_SEAT_CAPACITY)"
          - "Enrollment outstanding_balance_cents == 0 before the reschedule fee posts (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "exam_window_id / test_center_id / exam_date / calculator_model mutated to effective values"
          - "reschedule_count += 1; reschedule fee per reschedule_fee_quote posted to enrollment (never scholarship-discounted); reschedule_fees_total_cents += fee"
          - "version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /charter/appointments/{appointmentId}/cancel  |  window-cancel cascade"
        actor: "Candidate (owner) | ProgramAdmin | system"
        preconditions:
          - "booking_status == SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED)"
        side_effects:
          - "Seat released (seats_consumed for center+date decreases by 1)"
          - "Candidate-initiated cancel: exam_fee_cents credited iff clock <= window.scheduling_deadline_at, else 0; window-cancel cascade: always full exam_fee_cents; reschedule fees never credited"
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /charter/appointments/{appointmentId}/check-in"
        actor: Proctor
        preconditions:
          - "booking_status == SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED); compliance_status does NOT gate check-in"
          - "Current clock's calendar date == exam_date (ERR_CHECKIN_NOT_ON_EXAM_DATE)"
          - "identity_document_number == candidate.gov_id_number (ERR_IDENTITY_VERIFICATION_FAILED)"
          - "actual_calculator_model == declared calculator_model (ERR_CALCULATOR_POLICY_VIOLATION)"
        side_effects:
          - "ExamAttempt created: score_status AWAITING_SCORE, validity VALID, attempt_sequence computed (all-attempts count for candidate+level, created_at order)"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (window results publication)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (first score event of the window flips every still-SCHEDULED appointment of that window)"
        actor: system
        preconditions: []
        side_effects:
          - "No attempt created; exam fee forfeited (no credit)"
      - from: CLEAR
        to: POLICY_FLAGGED
        trigger: "system (MisconductCase created with this appointment_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: POLICY_FLAGGED
        to: CONFIRMED_VIOLATION
        trigger: "system (appointment-linked case adjudicated SANCTIONED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: POLICY_FLAGGED
        to: CLEARED
        trigger: "system (appointment-linked case adjudicated DISMISSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED_VIOLATION
        to: CLEARED
        trigger: "system (case DISMISSED after appeal — compensation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ExamAttempt
    initial_state: AWAITING_SCORE  # score_status dimension; validity dimension starts at VALID
    terminal_states: [SCORED]      # score_status terminal; validity has no terminal
    transitions:
      - from: AWAITING_SCORE
        to: SCORED
        trigger: "POST /charter/exam-attempts/{attemptId}/score"
        actor: ProgramAdmin
        preconditions:
          - "score_status == AWAITING_SCORE (ERR_ATTEMPT_ALREADY_SCORED)"
          - "Current clock >= appointment's window.window_closes_at (ERR_WINDOW_NOT_CONCLUDED)"
          - "0 <= scaled_score <= 1000 (ERR_SCORE_OUT_OF_RANGE)"
        side_effects:
          - "result = PASS iff scaled_score >= level.mps_scaled_score else FAIL"
          - "Candidate.highest_level_passed_code recomputed"
          - "Enrollment curriculum_access_cycle_ids recomputed"
          - "Window auto-publication sweep (see ExamWindow OPEN -> RESULTS_PUBLISHED)"
      - from: VALID
        to: INVALIDATED
        trigger: "system (EXAM_INVALIDATION sanction: the linked appointment's attempt, or ALL of the candidate's VALID attempts when the case is not appointment-linked)"
        actor: system
        preconditions: []
        side_effects:
          - "Candidate.highest_level_passed_code recomputed (may DROP)"
          - "Enrollment curriculum_access_cycle_ids recomputed (may SHRINK)"
      - from: INVALIDATED
        to: REINSTATED
        trigger: "system (case DISMISSED after appeal — compensation for every attempt this case invalidated)"
        actor: system
        preconditions: []
        side_effects:
          - "Candidate.highest_level_passed_code recomputed (restored)"
          - "Enrollment curriculum_access_cycle_ids recomputed (restored)"

  - entity: WorkExperienceSubmission
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /charter/experience-submissions/{submissionId}/submit"
        actor: "Candidate (owner)"
        preconditions:
          - "status == DRAFT (ERR_INVALID_SUBMISSION_STATE)"
          - ">= 2 ReferenceContact rows exist for this submission in any non-EXPIRED status (ERR_INSUFFICIENT_REFERENCES)"
        side_effects:
          - "provisional_months computed (cumulative variant)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /charter/experience-submissions/{submissionId}/review with decision=APPROVED"
        actor: ExperienceReviewer
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_SUBMISSION_STATE)"
          - ">= 2 ReferenceContact rows with status == VERIFIED (ERR_INSUFFICIENT_VERIFIED_REFERENCES)"
        side_effects:
          - "committee_months computed (contiguous/interval-merged variant) and stored"
          - "reviewer_user_id = acting X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /charter/experience-submissions/{submissionId}/review with decision=REJECTED"
        actor: ExperienceReviewer
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_SUBMISSION_STATE)"
        side_effects:
          - "committee_months computed and stored; reviewer_user_id recorded"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /charter/experience-submissions/{submissionId}/review with decision=RETURNED_FOR_REVISION"
        actor: ExperienceReviewer
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_SUBMISSION_STATE)"
        side_effects:
          - "reviewer_user_id recorded"
      - from: RETURNED_FOR_REVISION
        to: DRAFT
        trigger: "POST /charter/experience-submissions/{submissionId}/amend"
        actor: "Candidate (owner)"
        preconditions:
          - "OCC: expected_submission_version == submission.version (ERR_STALE_VERSION)"
          - "status == RETURNED_FOR_REVISION (ERR_SUBMISSION_NOT_EDITABLE)"
        side_effects:
          - "segments replaced; provisional_months and committee_months reset to null; version += 1; references keep their current status"

  - entity: ReferenceContact
    initial_state: PENDING
    terminal_states: [VERIFIED, DECLINED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /charter/references/{referenceId}/respond with decision=VERIFIED"
        actor: "ReferenceProvider (X-User-ID == reference id)"
        preconditions:
          - "status == PENDING and clock <= expires_at; if clock > expires_at the reference first transitions to EXPIRED and the call fails (ERR_REFERENCE_NOT_PENDING)"
        side_effects:
          - "verified_at = current clock"
      - from: PENDING
        to: DECLINED
        trigger: "POST /charter/references/{referenceId}/respond with decision=DECLINED"
        actor: "ReferenceProvider (X-User-ID == reference id)"
        preconditions:
          - "status == PENDING and clock <= expires_at (ERR_REFERENCE_NOT_PENDING otherwise)"
        side_effects: []
      - from: PENDING
        to: EXPIRED
        trigger: "system (lazy: any respond arriving when clock > expires_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MisconductCase
    initial_state: OPENED
    terminal_states: [DISMISSED]
    transitions:
      - from: OPENED
        to: SANCTIONED
        trigger: "POST /charter/misconduct-cases/{caseId}/adjudicate with outcome=SANCTIONED"
        actor: ConductAdjudicator
        preconditions:
          - "OCC: expected_case_version == case.version (ERR_STALE_VERSION)"
          - "status IN {OPENED, APPEALED} (ERR_INVALID_CASE_STATE)"
          - "Adjudicator X-User-ID != investigator_user_id when investigator_user_id is non-null (ERR_SEGREGATION_OF_DUTIES)"
          - "sanction_type present (ERR_INVALID_REQUEST)"
        side_effects:
          - "sanctioned_at = current clock; adjudicator_user_id recorded; version += 1"
          - "WARNING: no further effects"
          - "SUSPENSION_12M: candidate.suspended_until = sanctioned_at + 365 days"
          - "EXAM_INVALIDATION: appointment-linked case -> that appointment's attempt validity INVALIDATED and appointment.compliance_status POLICY_FLAGGED -> CONFIRMED_VIOLATION; non-appointment case -> ALL candidate attempts with validity VALID -> INVALIDATED; then progression + curriculum access recomputed"
          - "CHARTER_REVOCATION: candidate.charter_awarded = false, conduct_revoked = true; every SocietyMembership of the candidate ACTIVE -> TERMINATED"
      - from: APPEALED
        to: SANCTIONED
        trigger: "POST /charter/misconduct-cases/{caseId}/adjudicate with outcome=SANCTIONED"
        actor: ConductAdjudicator
        preconditions:
          - "Same as OPENED -> SANCTIONED (OCC, state, SoD, sanction_type)"
        side_effects:
          - "Same as OPENED -> SANCTIONED; effects of the new sanction_type apply on top of the current state (previously INVALIDATED attempts stay INVALIDATED unless the case is later DISMISSED)"
      - from: OPENED
        to: DISMISSED
        trigger: "POST /charter/misconduct-cases/{caseId}/adjudicate with outcome=DISMISSED"
        actor: ConductAdjudicator
        preconditions:
          - "OCC: expected_case_version == case.version (ERR_STALE_VERSION)"
          - "status IN {OPENED, APPEALED} (ERR_INVALID_CASE_STATE)"
          - "Adjudicator X-User-ID != investigator_user_id when investigator_user_id is non-null (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "adjudicator_user_id recorded; version += 1"
          - "Appointment-linked case: appointment.compliance_status -> CLEARED (from POLICY_FLAGGED or CONFIRMED_VIOLATION)"
          - "Compensation (only when a prior SANCTIONED existed on this case): attempts invalidated by this case -> REINSTATED; suspended_until -> null; conduct_revoked -> false and charter_awarded restored to true if it had been revoked by THIS case; progression + curriculum access recomputed; TERMINATED memberships are NOT restored"
      - from: APPEALED
        to: DISMISSED
        trigger: "POST /charter/misconduct-cases/{caseId}/adjudicate with outcome=DISMISSED"
        actor: ConductAdjudicator
        preconditions:
          - "Same as OPENED -> DISMISSED"
        side_effects:
          - "Same as OPENED -> DISMISSED (compensation fires)"
      - from: SANCTIONED
        to: APPEALED
        trigger: "POST /charter/misconduct-cases/{caseId}/appeal"
        actor: "Candidate (owner of the case)"
        preconditions:
          - "status == SANCTIONED (ERR_INVALID_CASE_STATE)"
          - "Current clock <= sanctioned_at + 30 days (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects:
          - "appeal_reason recorded; version += 1"

  - entity: SocietyMembership
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /charter/memberships/{membershipId}/renew"
        actor: "Candidate (owner)"
        preconditions:
          - "status == ACTIVE (ERR_INVALID_MEMBERSHIP_STATE)"
          - "calendar_year_credits (current clock year) >= society.ce_credits_required_per_year (ERR_CE_REQUIREMENT_NOT_MET)"
          - "dues_payment_cents == society.annual_dues_cents (ERR_INCORRECT_DUES_AMOUNT)"
        side_effects:
          - "paid_through_year += 1; version += 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (CHARTER_REVOCATION sanction on the candidate)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: appointment-reschedule-stale-version
    parent_entity: ExamAppointment
    write_endpoint: "POST /charter/appointments/{appointmentId}/reschedule"
    occ_field: expected_appointment_version
    description: |
      A reschedule supersedes the appointment's current schedule. A request
      carrying an expected_appointment_version that no longer matches the
      appointment's current version is rejected as stale: the caller's view
      predates a committed mutation (a prior reschedule, a cancel, or a
      check-in side effect), so the supersede must not proceed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: submission-amend-stale-version
    parent_entity: WorkExperienceSubmission
    write_endpoint: "POST /charter/experience-submissions/{submissionId}/amend"
    occ_field: expected_submission_version
    description: |
      An amend replaces the submission's segments wholesale. A request
      carrying an expected_submission_version that no longer matches the
      submission's current version is rejected as stale: the RETURNED_FOR_REVISION
      state the caller observed has been superseded by another committed write.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: case-adjudicate-stale-version
    parent_entity: MisconductCase
    write_endpoint: "POST /charter/misconduct-cases/{caseId}/adjudicate"
    occ_field: expected_case_version
    description: |
      An adjudication decides the case as the caller last observed it. A
      request carrying an expected_case_version that no longer matches the
      case's current version is rejected as stale: an appeal or a prior
      adjudication has advanced the case since the caller's observation.
    error_id: ERR_STALE_VERSION
    http_status: 412
# === SCAFFOLD PART 3 MARKER ===

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: enrollment_eligibility_evaluation
    trigger: "POST /charter/candidates/{candidateId}/program-enrollments (before the enrollment is created)"
    algorithm: threshold
    formula: |
      months_between(s, e) = (e.year - s.year)*12 + (e.month - s.month) - (1 if e.day < s.day else 0)
      Variant EDUCATION: eligible iff degree_completed == true
                         OR (graduation_date > today AND months_between(today, graduation_date) <= EDUCATION_WINDOW_MONTHS)
      Variant WORK_EXPERIENCE: eligible iff declared_work_months >= WORK_MIN_MONTHS
                               AND declared_work_hours >= WORK_MIN_HOURS
      Ineligible -> ERR_ELIGIBILITY_NOT_MET (422), no enrollment created.
    input_set: "the enrollment request payload only; 'today' is the logical clock date"
    constants:
      EDUCATION_WINDOW_MONTHS: 23
      WORK_MIN_MONTHS: 36
      WORK_MIN_HOURS: 4000
    precision: "whole calendar months, integer"
    variants:
      - name: education_path
        when: "pathway == EDUCATION"
        difference: "Qualifies on degree completion or graduation within 23 months; work inputs ignored"
      - name: work_experience_path
        when: "pathway == WORK_EXPERIENCE"
        difference: "Qualifies on declared months AND hours thresholds; education inputs ignored — a candidate can qualify under one pathway and fail the other"

  - name: enrollment_line_charges
    trigger: "enrollment creation (program fee line) and appointment creation (exam fee line)"
    algorithm: tiered_pricing
    formula: |
      PINNED ROUNDING ORDER (per-line then sum):
        line_cents(fee_list_cents) = round_half_up(fee_list_cents * (1 - enrollment.scholarship_pct))
      Each charge line is rounded half-up to whole cents BEFORE being added to
      lifetime_charges_cents. Summing list prices first and rounding once is the
      REJECTED interpretation (can differ by >= 1 cent, e.g. 35003 and 99995 at
      pct 0.10 -> per-line 31503 + 89996 = 121499 vs sum-then-round 121498).
      Program fee line = PROGRAM_FEE_CENTS. Exam fee line = level.early_fee_cents
      or level.standard_fee_cents per fee_tier. Reschedule fees are never discounted.
    input_set: "the new charge only; scholarship_pct snapshot stored on the enrollment"
    constants:
      PROGRAM_FEE_CENTS: 35003
    precision: "integer cents, round_half_up per line"

  - name: exam_fee_tier_quote
    trigger: "appointment creation"
    algorithm: threshold
    formula: |
      fee_tier = EARLY if appointment.created_at <= window.early_fee_deadline_at else STANDARD
      Boundary: created_at exactly equal to early_fee_deadline_at is EARLY (<=).
    input_set: "the appointment being created and its window"
    constants: {}
    precision: "datetime comparison, second precision"

  - name: reschedule_fee_quote
    trigger: "POST /charter/appointments/{appointmentId}/reschedule (after all validations pass)"
    algorithm: tiered_pricing
    formula: |
      days_before_exam = whole days between current clock date and the appointment's CURRENT exam_date
      fee = RESCHEDULE_BASE_CENTS
      if days_before_exam < LATE_THRESHOLD_DAYS: fee += RESCHEDULE_LATE_SURCHARGE_CENTS
      fee += PER_PRIOR_RESCHEDULE_CENTS * min(reschedule_count, PRIOR_CAP_COUNT)   # reschedule_count BEFORE this reschedule
      fee = min(fee, RESCHEDULE_FEE_CAP_CENTS)
      Worked: count=0, days=9  -> 25000 + 25000 + 0     = 50000
              count=1, days=9  -> 25000 + 25000 + 10000 = 60000 (cap binds exactly at 60000)
              count=2, days=9  -> 25000 + 25000 + 20000 = 70000 -> capped to 60000
              count=0, days=20 -> 25000
    input_set: "the appointment being rescheduled"
    constants:
      RESCHEDULE_BASE_CENTS: 25000
      LATE_THRESHOLD_DAYS: 14
      RESCHEDULE_LATE_SURCHARGE_CENTS: 25000
      PER_PRIOR_RESCHEDULE_CENTS: 10000
      PRIOR_CAP_COUNT: 2
      RESCHEDULE_FEE_CAP_CENTS: 60000
    precision: "integer cents"

  - name: retake_eligibility_evaluation
    trigger: "POST /charter/appointments (and reschedule with a new exam_window_id), after referential level checks"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (the steps feed each other; do not reorder):
      (1) passed_levels = set of level codes with a PASS attempt whose validity IN {VALID, REINSTATED}
      (2) target level must not already be passed (ERR_LEVEL_ALREADY_PASSED)
      (3) target level's enum predecessor, if any, must be in passed_levels (ERR_PREREQUISITE_LEVEL_NOT_PASSED)
      (4) attempts_used = count of candidate's attempts at the target level with validity IN {VALID, REINSTATED};
          INVALIDATED attempts do not count; require attempts_used < level.max_attempts (ERR_MAX_ATTEMPTS_REACHED)
      (5) latest_failed = the most recent (by created_at) attempt at the target level with
          result == FAIL and validity IN {VALID, REINSTATED}; if it exists, require
          target_window.window_opens_at > latest_failed_window.window_closes_at (ERR_RETAKE_WINDOW_TOO_SOON)
      Note the evaluation-order dependency: invalidation (which an appeal can later
      reverse via REINSTATED) changes steps (1), (4) and (5), so eligibility is always
      recomputed from current attempt validity at scheduling time, never cached.
    input_set: "candidate's ExamAttempt rows at the window's level, all states"
    constants: {}
    precision: "datetime comparison, second precision"

  - name: experience_months_evaluation
    trigger: "submit (provisional) and review (committee)"
    algorithm: interval_merge
    formula: |
      months_between(s, e) = (e.year - s.year)*12 + (e.month - s.month) - (1 if e.day < s.day else 0)
      Qualifying segments: qualifying_activity_pct >= MIN_QUALIFYING_PCT.
      Variant provisional (cumulative): sum months_between over qualifying segments;
        overlaps are double-counted. Computed at submit, stored in provisional_months.
      Variant committee (contiguous): sort qualifying segments by start_date
        (tie-break: earlier end_date first, then created order of the segment in the array);
        merge segments into runs where next.start_date <= current_run.end_date + 1 day
        (touching counts as contiguous); committee_months = sum of months_between over merged runs;
        overlaps counted once. Computed at review, stored in committee_months.
      Worked: S1 2022-01-10..2024-01-10 (80%), S2 2023-07-10..2025-06-10 (60%):
        months_between(S1) = 24, months_between(S2) = 23 -> provisional = 47;
        merged run 2022-01-10..2025-06-10 -> committee = 41.
    input_set: "segments array of the submission; segments with pct < 50 excluded from both variants"
    constants:
      MIN_QUALIFYING_PCT: 50
      MIN_CHARTER_MONTHS: 36
      MIN_REFERENCES: 2
    precision: "whole calendar months, integer"
    variants:
      - name: provisional_cumulative
        when: "computed automatically at submit"
        difference: "Overlapping qualifying segments double-counted (optimistic candidate-facing estimate)"
      - name: committee_contiguous
        when: "computed at reviewer decision"
        difference: "Overlapping qualifying segments interval-merged and counted once (strict charter-grade evaluation); identical inputs, different totals"

  - name: ce_standing_evaluation
    trigger: "membership read / renew gate / CE record append"
    algorithm: aggregation
    formula: |
      calendar_year_credits = sum of ce_records.credit_hours with completed_on inside
        the logical clock's current calendar year [YYYY-01-01, YYYY-12-31] inclusive
      rolling_12m_credits = sum of ce_records.credit_hours with
        completed_on > (current_date - 365 days)  (trailing 365 days including today)
      ce_standing_met = calendar_year_credits >= society.ce_credits_required_per_year
      Renewal uses the CALENDAR_YEAR variant only.
      Worked at clock 2027-06-15 with records 5 @2026-12-20, 15 @2027-03-10, 6 @2027-06-15:
        calendar_year_credits = 21, rolling_12m_credits = 26.
    input_set: "ce_records of the membership; all records regardless of age feed the rolling variant"
    constants:
      ROLLING_WINDOW_DAYS: 365
      DEFAULT_CE_CREDITS_REQUIRED: 20
    precision: "1 decimal place on credit_hours; sums exact"
    variants:
      - name: calendar_year
        when: "renewal gate and ce_standing_met"
        difference: "Only credits completed in the current calendar year count; identical record set, different total than rolling"
      - name: rolling_12_month
        when: "reported alongside on membership read"
        difference: "Credits from the trailing 365 days count; year-boundary credits included that calendar_year excludes"

  - name: mps_pass_determination
    trigger: "POST /charter/exam-attempts/{attemptId}/score"
    algorithm: threshold
    formula: |
      result = PASS iff scaled_score >= level.mps_scaled_score else FAIL
      Boundary: scaled_score == mps_scaled_score is PASS; mps - 1 is FAIL.
    input_set: "the scored attempt and its level's mps_scaled_score"
    constants: {}
    precision: "integer comparison"

  - name: seat_capacity_tracking
    trigger: "appointment creation, reschedule (effective center+date), cancel, no-show is NOT a release"
    algorithm: aggregation
    formula: |
      seats_consumed(center, date) = count of appointments with test_center_id == center,
        exam_date == date, booking_status IN {SCHEDULED, CHECKED_IN, COMPLETED}
      Consuming set: booking_status IN {SCHEDULED, CHECKED_IN, COMPLETED, NO_SHOW};
        CANCELLED releases the seat (a no-show keeps the seat consumed: the seat was
        held through exam day and the fee is forfeited).
      available = center.daily_seat_capacity - seats_consumed
      Booking/reschedule requires available >= 1 (ERR_NO_SEAT_CAPACITY).
      Boundary: the booking that fills the last seat (seats_consumed == capacity - 1
      beforehand) succeeds; the next booking (seats_consumed == capacity) fails.
    input_set: "appointments of the center on the date in booking_status SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW consume seats; CANCELLED excluded"
    constants: {}
    precision: "integer counts"

  - name: candidate_progression_recompute
    trigger: "attempt scored, attempt invalidated, attempt reinstated"
    algorithm: constraint_propagation
    formula: |
      passed_levels = levels with >= 1 attempt result == PASS and validity IN {VALID, REINSTATED}
      highest_level_passed_code = highest passed level in enum order LEVEL_I < LEVEL_II < LEVEL_III, else null
      Recompute runs AFTER the triggering write commits, and feeds
      enrollment.curriculum_access_cycle_ids: while ENROLLED, access = PUBLISHED cycles of
      levels up to and including the lowest unpassed level; while CHARTER_AWARDED, all
      PUBLISHED cycles; while PENDING_PAYMENT, empty.
    input_set: "all ExamAttempt rows of the candidate (every score_status and validity)"
    constants: {}
    precision: "n/a"

  - name: window_cancellation_credit
    trigger: "window cancel cascade"
    algorithm: aggregation
    formula: |
      For each SCHEDULED appointment of the cancelled window:
        credit = appointment.exam_fee_cents (full, deadline-independent)
        Post credit: applied = min(credit, enrollment.outstanding_balance_cents);
          outstanding -= applied; lifetime_credits_applied_cents += applied;
          credit_balance += (credit - applied); lifetime_credits_posted_cents += credit
      Reschedule fees are never credited.
      Candidate-initiated appointment cancel: credit = exam_fee_cents iff
        clock <= window.scheduling_deadline_at else 0 (same posting mechanics).
    input_set: "appointments of the window with booking_status == SCHEDULED, processed in created_at ASC order"
    constants: {}
    precision: "integer cents"
# === SCAFFOLD PART 4 MARKER ===

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-template resource ids exist, validated left-to-right; each segment raises its own ERR_<ENTITY>_NOT_FOUND"
    error_id: "ERR_CANDIDATE_NOT_FOUND / ERR_ENROLLMENT_NOT_FOUND / ERR_EXAM_LEVEL_NOT_FOUND / ERR_EXAM_WINDOW_NOT_FOUND / ERR_TEST_CENTER_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_ATTEMPT_NOT_FOUND / ERR_SUBMISSION_NOT_FOUND / ERR_REFERENCE_NOT_FOUND / ERR_CASE_NOT_FOUND / ERR_SOCIETY_NOT_FOUND / ERR_MEMBERSHIP_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: request_shape
    check: "Required fields present; types, enum memberships, and ranges valid (score 0..1000 -> ERR_SCORE_OUT_OF_RANGE; amount_cents <= 0 -> ERR_INVALID_PAYMENT_AMOUNT; pathway-conditional required fields: EDUCATION needs degree_completed + graduation_date, WORK_EXPERIENCE needs declared_work_months + declared_work_hours; unknown payload fields are rejected; reschedule requires at least one change field; adjudicate with outcome=SANCTIONED requires sanction_type)"
    error_id: "ERR_INVALID_REQUEST / ERR_SCORE_OUT_OF_RANGE / ERR_INVALID_PAYMENT_AMOUNT"
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 5
    category: existence
    check: "Body foreign keys exist, validated in the order the fields are listed in the endpoint's input (program_enrollment_id, then exam_window_id, then test_center_id; candidate_id; appointment_id; society path id before body candidate_id)"
    error_id: "ERR_ENROLLMENT_NOT_FOUND / ERR_EXAM_WINDOW_NOT_FOUND / ERR_TEST_CENTER_NOT_FOUND / ERR_CANDIDATE_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND"
    http_status: 404
    applies_to: "mutation endpoints with body FKs"

  - priority: 6
    category: ownership
    check: "Entity-backed caller owns the target: Candidate acting on own candidate_id / own enrollment / own appointment / own submission / own case / own membership; ReferenceProvider X-User-ID == reference id on respond"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "candidate-scoped and reference endpoints"

  - priority: 7
    category: concurrency
    check: "OCC: expected_<parent>_version == current version (checked before all business rules, after ownership)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST reschedule / POST amend / POST adjudicate"

  - priority: 8
    category: state
    check: "Target entity in the state required by the transition: enrollment ENROLLED for booking (ERR_ENROLLMENT_NOT_ENROLLED); window OPEN for booking (ERR_WINDOW_NOT_OPEN); appointment SCHEDULED for reschedule/cancel/check-in (ERR_APPOINTMENT_NOT_SCHEDULED); attempt AWAITING_SCORE (ERR_ATTEMPT_ALREADY_SCORED); submission DRAFT for submit / SUBMITTED for review (ERR_INVALID_SUBMISSION_STATE) / RETURNED_FOR_REVISION for amend (ERR_SUBMISSION_NOT_EDITABLE); reference PENDING (ERR_REFERENCE_NOT_PENDING); case OPENED|APPEALED for adjudicate, SANCTIONED for appeal (ERR_INVALID_CASE_STATE); membership ACTIVE for renew (ERR_INVALID_MEMBERSHIP_STATE); window OPEN for cancel (ERR_WINDOW_NOT_CANCELLABLE)"
    error_id: "ERR_ENROLLMENT_NOT_ENROLLED / ERR_WINDOW_NOT_OPEN / ERR_APPOINTMENT_NOT_SCHEDULED / ERR_ATTEMPT_ALREADY_SCORED / ERR_INVALID_SUBMISSION_STATE / ERR_SUBMISSION_NOT_EDITABLE / ERR_REFERENCE_NOT_PENDING / ERR_INVALID_CASE_STATE / ERR_INVALID_MEMBERSHIP_STATE / ERR_WINDOW_NOT_CANCELLABLE"
    http_status: 409
    applies_to: "action endpoints"

  - priority: 9
    category: business_temporal
    check: "Clock rules: booking while clock <= window.scheduling_deadline_at (ERR_WINDOW_SCHEDULING_CLOSED); exam_date inside [window_opens_at, window_closes_at) (ERR_EXAM_DATE_OUTSIDE_WINDOW); reschedule while clock <= original window.reschedule_deadline_at (ERR_RESCHEDULE_DEADLINE_PASSED) and, when retargeting windows, clock <= target scheduling_deadline_at; check-in only when clock date == exam_date (ERR_CHECKIN_NOT_ON_EXAM_DATE); score only when clock >= window.window_closes_at (ERR_WINDOW_NOT_CONCLUDED); appeal within sanctioned_at + 30 days (ERR_APPEAL_WINDOW_EXPIRED)"
    error_id: "ERR_WINDOW_SCHEDULING_CLOSED / ERR_EXAM_DATE_OUTSIDE_WINDOW / ERR_RESCHEDULE_DEADLINE_PASSED / ERR_CHECKIN_NOT_ON_EXAM_DATE / ERR_WINDOW_NOT_CONCLUDED / ERR_APPEAL_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "booking, reschedule, check-in, score, appeal"

  - priority: 10
    category: business_safety
    check: "Exam-day policy at check-in, in this order: identity_document_number == candidate.gov_id_number (ERR_IDENTITY_VERIFICATION_FAILED); then actual_calculator_model == declared calculator_model and in {TI_BA_II_PLUS, HP_12C} (ERR_CALCULATOR_POLICY_VIOLATION)"
    error_id: "ERR_IDENTITY_VERIFICATION_FAILED / ERR_CALCULATOR_POLICY_VIOLATION"
    http_status: 422
    applies_to: "POST check-in"

  - priority: 11
    category: business_constraint
    check: "Capacity/overlap/uniqueness: same-level window [opens, closes) half-open overlap (ERR_WINDOW_OVERLAP); blackout closed interval plus 1-day buffer each side blocks center+date (ERR_CENTER_BLACKOUT_CONFLICT); seat capacity (ERR_NO_SEAT_CAPACITY); one active (SCHEDULED|CHECKED_IN) appointment per candidate per level (ERR_DOUBLE_BOOKING_LEVEL); one case in {OPENED, SANCTIONED, APPEALED} per appointment (ERR_CASE_ALREADY_OPEN_FOR_APPOINTMENT); uniqueness: candidate email / one enrollment per candidate / level_code / (level, cycle_year) / ACTIVE membership per (candidate, society) / (candidate, disclosure_year)"
    error_id: "ERR_WINDOW_OVERLAP / ERR_CENTER_BLACKOUT_CONFLICT / ERR_NO_SEAT_CAPACITY / ERR_DOUBLE_BOOKING_LEVEL / ERR_CASE_ALREADY_OPEN_FOR_APPOINTMENT / ERR_DUPLICATE_CANDIDATE_EMAIL / ERR_DUPLICATE_ENROLLMENT / ERR_DUPLICATE_EXAM_LEVEL / ERR_DUPLICATE_CURRICULUM_YEAR / ERR_DUPLICATE_MEMBERSHIP / ERR_DUPLICATE_CONDUCT_STATEMENT"
    http_status: 409
    applies_to: "creation and scheduling endpoints"

  - priority: 12
    category: business_referential
    check: "Cross-entity requirements: eligibility pathway thresholds (ERR_ELIGIBILITY_NOT_MET); retake_eligibility_evaluation order: already-passed (ERR_LEVEL_ALREADY_PASSED) -> predecessor passed (ERR_PREREQUISITE_LEVEL_NOT_PASSED) -> attempts cap (ERR_MAX_ATTEMPTS_REACHED) -> retake gap (ERR_RETAKE_WINDOW_TOO_SOON); reschedule window retarget keeps same level (ERR_WINDOW_LEVEL_MISMATCH); submit needs >= 2 references (ERR_INSUFFICIENT_REFERENCES); APPROVED needs >= 2 VERIFIED references (ERR_INSUFFICIENT_VERIFIED_REFERENCES); award chain in order: all levels passed (ERR_LEVELS_NOT_ALL_PASSED) -> experience >= 36 committee months (ERR_EXPERIENCE_REQUIREMENT_UNMET) -> current-year conduct statement (ERR_MISSING_CONDUCT_STATEMENT) -> no OPENED|APPEALED case (ERR_OPEN_MISCONDUCT_CASE); membership join requires charter_awarded (ERR_CHARTER_REQUIRED); renew CE gate (ERR_CE_REQUIREMENT_NOT_MET); adjudicator != investigator (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_ELIGIBILITY_NOT_MET / ERR_LEVEL_ALREADY_PASSED / ERR_PREREQUISITE_LEVEL_NOT_PASSED / ERR_MAX_ATTEMPTS_REACHED / ERR_RETAKE_WINDOW_TOO_SOON / ERR_WINDOW_LEVEL_MISMATCH / ERR_INSUFFICIENT_REFERENCES / ERR_INSUFFICIENT_VERIFIED_REFERENCES / ERR_LEVELS_NOT_ALL_PASSED / ERR_EXPERIENCE_REQUIREMENT_UNMET / ERR_MISSING_CONDUCT_STATEMENT / ERR_OPEN_MISCONDUCT_CASE / ERR_CHARTER_REQUIRED / ERR_CE_REQUIREMENT_NOT_MET / ERR_SEGREGATION_OF_DUTIES"
    http_status: 422
    applies_to: "enrollment create, booking, reschedule, submit, review, award, membership join/renew, adjudicate"

  - priority: 13
    category: business_fiscal
    check: "Money gates last: booking and reschedule require enrollment.outstanding_balance_cents == 0 before the new charge posts (ERR_OUTSTANDING_BALANCE); award requires outstanding_balance_cents == 0 (ERR_OUTSTANDING_BALANCE); membership join/renew dues_payment_cents == society.annual_dues_cents exactly (ERR_INCORRECT_DUES_AMOUNT)"
    error_id: "ERR_OUTSTANDING_BALANCE / ERR_INCORRECT_DUES_AMOUNT"
    http_status: 402
    applies_to: "booking, reschedule, award-charter, membership join/renew"
    note: "ERR_INCORRECT_DUES_AMOUNT carries http 422; ERR_OUTSTANDING_BALANCE carries http 402"
# === SCAFFOLD PART 5 MARKER ===

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock set; lazy EXPIRED transitions evaluate against the new clock on subsequent reads/actions"]

  # --- Candidates ---
  - method: POST
    path: "/charter/candidates"
    description: "Register a candidate"
    roles: &ALL_ROLES_ADMIN [ProgramAdmin]
    code: 201
    input: [email, full_name, date_of_birth, gov_id_number]
    output: Candidate
    side_effects: ["conduct_revoked=false, charter_awarded=false, highest_level_passed_code=null"]

  - method: GET
    path: "/charter/candidates/{candidateId}"
    description: "Read a candidate (standing, progression, charter flag)"
    roles: &ALL_ROLES [Candidate, ProgramAdmin, Proctor, ExperienceReviewer, ReferenceProvider, ConductInvestigator, ConductAdjudicator]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  # --- Program enrollments ---
  - method: POST
    path: "/charter/candidates/{candidateId}/program-enrollments"
    description: "Enroll a candidate in the charter program; evaluates pathway eligibility; posts the program fee charge (scholarship-discounted per line)"
    roles: [Candidate, ProgramAdmin]
    code: 201
    input: [pathway, "degree_completed?", "graduation_date?", "declared_work_months?", "declared_work_hours?", "scholarship_pct?"]
    output: ProgramEnrollment
    side_effects: ["status=PENDING_PAYMENT", "program fee charge posted (lifetime_charges_cents += round_half_up(35003 * (1 - scholarship_pct)))", "ownership: Candidate caller must match path candidateId"]

  - method: GET
    path: "/charter/program-enrollments"
    description: "List enrollments (FK reverse-reachability for candidate_id)"
    roles: *ALL_ROLES
    code: 200
    input: ["candidate_id?", "status?", "limit?", "offset?"]
    output: "ProgramEnrollment[]"
    side_effects: []

  - method: GET
    path: "/charter/program-enrollments/{enrollmentId}"
    description: "Read one enrollment (ledger, status, curriculum access)"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ProgramEnrollment
    side_effects: []

  - method: POST
    path: "/charter/program-enrollments/{enrollmentId}/payments"
    description: "Apply a payment to outstanding balance; overpayment lands in credit_balance_cents; auto-transitions PENDING_PAYMENT -> ENROLLED at zero balance"
    roles: [Candidate, ProgramAdmin]
    code: 200
    input: [amount_cents]
    output: ProgramEnrollment
    side_effects: ["lifetime_payments_cents += amount_cents; outstanding reduced; PENDING_PAYMENT -> ENROLLED when outstanding hits 0"]

  - method: POST
    path: "/charter/program-enrollments/{enrollmentId}/award-charter"
    description: "Award the charter after all gates (levels, experience, conduct statement, no open case, zero balance)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramEnrollment
    side_effects: ["status -> CHARTER_AWARDED", "Candidate.charter_awarded = true", "chartered_at set", "curriculum access widened to all PUBLISHED cycles"]

  # --- Exam levels & curriculum cycles ---
  - method: POST
    path: "/charter/exam-levels"
    description: "Create an exam level configuration (fee card, MPS, attempt cap)"
    roles: [ProgramAdmin]
    code: 201
    input: [level_code, mps_scaled_score, max_attempts, early_fee_cents, standard_fee_cents]
    output: ExamLevel
    side_effects: []

  - method: POST
    path: "/charter/exam-levels/{levelId}/curriculum-cycles"
    description: "Publish an annual curriculum cycle for a level; supersedes (archives) any other PUBLISHED cycle of that level"
    roles: [ProgramAdmin]
    code: 201
    input: [cycle_year, effective_from, effective_to, content_version]
    output: CurriculumCycle
    side_effects: ["new cycle status=PUBLISHED", "prior PUBLISHED cycle of same level -> ARCHIVED", "all enrollments' curriculum_access_cycle_ids recomputed"]

  - method: GET
    path: "/charter/curriculum-cycles"
    description: "List curriculum cycles (FK reverse-reachability for exam_level_id)"
    roles: *ALL_ROLES
    code: 200
    input: ["exam_level_id?", "status?", "limit?", "offset?"]
    output: "CurriculumCycle[]"
    side_effects: []

  - method: GET
    path: "/charter/curriculum-cycles/{cycleId}"
    description: "Read one curriculum cycle"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: CurriculumCycle
    side_effects: []

  # --- Exam windows ---
  - method: POST
    path: "/charter/exam-windows"
    description: "Create a computer-based exam window (starts OPEN). Half-open [opens, closes) per level; adjacent windows allowed"
    roles: [ProgramAdmin]
    code: 201
    input: [exam_level_id, window_opens_at, window_closes_at, scheduling_deadline_at, reschedule_deadline_at, early_fee_deadline_at]
    output: ExamWindow
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/charter/exam-windows"
    description: "List exam windows (FK reverse-reachability for exam_level_id)"
    roles: *ALL_ROLES
    code: 200
    input: ["exam_level_id?", "status?", "limit?", "offset?"]
    output: "ExamWindow[]"
    side_effects: []

  - method: GET
    path: "/charter/exam-windows/{windowId}"
    description: "Read one exam window"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ExamWindow
    side_effects: []

  - method: POST
    path: "/charter/exam-windows/{windowId}/cancel"
    description: "Cancel an OPEN window; cascade-cancels its SCHEDULED appointments with full exam-fee credit"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ExamWindow
    side_effects: ["status -> CANCELLED", "SCHEDULED appointments -> CANCELLED", "full exam_fee_cents credit posted per cancelled appointment (auto-applied to outstanding first)"]

  # --- Test centers ---
  - method: POST
    path: "/charter/test-centers"
    description: "Create a test center with daily seat capacity and optional embedded blackout_windows (inclusive dates + 1-day buffer each side)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, city, daily_seat_capacity, "blackout_windows?"]
    output: TestCenter
    side_effects: []

  # --- Appointments ---
  - method: POST
    path: "/charter/appointments"
    description: "Schedule an exam appointment: books a seat, computes fee tier, posts the scholarship-discounted exam fee charge"
    roles: [Candidate, ProgramAdmin]
    code: 201
    input: [program_enrollment_id, exam_window_id, test_center_id, exam_date, calculator_model]
    output: ExamAppointment
    side_effects: ["booking_status=SCHEDULED, compliance_status=CLEAR", "fee_tier + exam_fee_cents computed", "exam fee charge posted to enrollment (credit_balance auto-applied first)", "ownership: Candidate caller must own program_enrollment_id"]

  - method: GET
    path: "/charter/appointments"
    description: "List appointments (FK reverse-reachability for program_enrollment_id, exam_window_id, test_center_id)"
    roles: *ALL_ROLES
    code: 200
    input: ["program_enrollment_id?", "exam_window_id?", "test_center_id?", "candidate_id?", "booking_status?", "status?", "limit?", "offset?"]
    output: "ExamAppointment[]"
    side_effects: []

  - method: GET
    path: "/charter/appointments/{appointmentId}"
    description: "Read one appointment (both state dimensions, fee fields)"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ExamAppointment
    side_effects: []

  - method: POST
    path: "/charter/appointments/{appointmentId}/reschedule"
    description: "Reschedule (OCC): change window/center/date/calculator; charges tiered reschedule fee; original-window reschedule deadline governs"
    roles: [Candidate, ProgramAdmin]
    code: 200
    input: ["exam_window_id?", "test_center_id?", "exam_date?", "calculator_model?", expected_appointment_version]
    output: ExamAppointment
    side_effects: ["reschedule_count += 1", "reschedule fee posted (never discounted)", "reschedule_fees_total_cents += fee", "increments ExamAppointment.version by 1", "seat released at old center+date, consumed at new center+date"]

  - method: POST
    path: "/charter/appointments/{appointmentId}/cancel"
    description: "Cancel a SCHEDULED appointment; full exam-fee credit iff clock <= window.scheduling_deadline_at else zero credit"
    roles: [Candidate, ProgramAdmin]
    code: 200
    input: []
    output: ExamAppointment
    side_effects: ["booking_status -> CANCELLED", "seat released", "conditional exam-fee credit posted"]

  - method: POST
    path: "/charter/appointments/{appointmentId}/check-in"
    description: "Exam-day check-in: identity + calculator policy enforcement; creates the ExamAttempt"
    roles: [Proctor]
    code: 200
    input: [identity_document_number, actual_calculator_model]
    output: ExamAppointment
    side_effects: ["booking_status -> CHECKED_IN", "ExamAttempt created (AWAITING_SCORE, VALID, attempt_sequence computed)"]

  # --- Exam attempts ---
  - method: GET
    path: "/charter/exam-attempts"
    description: "List attempts (FK reverse-reachability for exam_appointment_id)"
    roles: *ALL_ROLES
    code: 200
    input: ["exam_appointment_id?", "candidate_id?", "limit?", "offset?"]
    output: "ExamAttempt[]"
    side_effects: []

  - method: GET
    path: "/charter/exam-attempts/{attemptId}"
    description: "Read one attempt"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ExamAttempt
    side_effects: []

  - method: POST
    path: "/charter/exam-attempts/{attemptId}/score"
    description: "Publish a scaled score; computes PASS/FAIL vs the level MPS; drives no-show sweep, window auto-publication and progression recompute"
    roles: [ProgramAdmin]
    code: 200
    input: [scaled_score]
    output: ExamAttempt
    side_effects: ["score_status -> SCORED, result computed", "candidate progression recomputed", "curriculum access recomputed", "window auto-publish sweep (SCHEDULED -> NO_SHOW; CHECKED_IN -> COMPLETED when fully scored)"]

  # --- Work experience ---
  - method: POST
    path: "/charter/candidates/{candidateId}/experience-submissions"
    description: "Create a DRAFT work-experience submission with embedded role segments"
    roles: [Candidate]
    code: 201
    input: [segments]
    output: WorkExperienceSubmission
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/charter/experience-submissions"
    description: "List experience submissions (FK reverse-reachability for candidate_id)"
    roles: *ALL_ROLES
    code: 200
    input: ["candidate_id?", "status?", "limit?", "offset?"]
    output: "WorkExperienceSubmission[]"
    side_effects: []

  - method: GET
    path: "/charter/experience-submissions/{submissionId}"
    description: "Read one experience submission"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: WorkExperienceSubmission
    side_effects: []

  - method: POST
    path: "/charter/experience-submissions/{submissionId}/amend"
    description: "Amend a RETURNED_FOR_REVISION submission back to DRAFT with replacement segments (OCC)"
    roles: [Candidate]
    code: 200
    input: [segments, expected_submission_version]
    output: WorkExperienceSubmission
    side_effects: ["status -> DRAFT", "segments replaced", "provisional_months/committee_months reset to null", "increments WorkExperienceSubmission.version by 1"]

  - method: POST
    path: "/charter/experience-submissions/{submissionId}/submit"
    description: "Submit a DRAFT for review; computes provisional (cumulative) months; requires >= 2 attached references"
    roles: [Candidate]
    code: 200
    input: []
    output: WorkExperienceSubmission
    side_effects: ["status -> SUBMITTED", "provisional_months computed (cumulative variant)"]

  - method: POST
    path: "/charter/experience-submissions/{submissionId}/review"
    description: "Reviewer decision: APPROVED (requires >= 2 VERIFIED references) | REJECTED | RETURNED_FOR_REVISION; computes committee (contiguous) months"
    roles: [ExperienceReviewer]
    code: 200
    input: [decision, "reviewer_notes?"]
    output: WorkExperienceSubmission
    side_effects: ["status transition per decision", "committee_months computed (contiguous variant)", "reviewer_user_id recorded"]

  # --- References ---
  - method: POST
    path: "/charter/experience-submissions/{submissionId}/references"
    description: "Attach a reference contact to a submission (PENDING, expires at created_at + 30 days)"
    roles: [Candidate]
    code: 201
    input: [referee_name, referee_email]
    output: ReferenceContact
    side_effects: ["status=PENDING", "expires_at = created_at + 30 days"]

  - method: GET
    path: "/charter/references"
    description: "List reference contacts (FK reverse-reachability for experience_submission_id)"
    roles: *ALL_ROLES
    code: 200
    input: ["experience_submission_id?", "status?", "limit?", "offset?"]
    output: "ReferenceContact[]"
    side_effects: []

  - method: GET
    path: "/charter/references/{referenceId}"
    description: "Read one reference contact"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ReferenceContact
    side_effects: []

  - method: POST
    path: "/charter/references/{referenceId}/respond"
    description: "Reference verifies or declines (ReferenceProvider must act as the reference's own id); lazy expiry past expires_at"
    roles: [ReferenceProvider]
    code: 200
    input: [decision, "attestation_text?"]
    output: ReferenceContact
    side_effects: ["status -> VERIFIED (verified_at set) | DECLINED; late respond -> EXPIRED + ERR_REFERENCE_NOT_PENDING"]

  # --- Professional conduct statements ---
  - method: POST
    path: "/charter/candidates/{candidateId}/conduct-statements"
    description: "File the annual professional conduct statement; has_disclosures=true auto-opens a MisconductCase (origin CONDUCT_STATEMENT)"
    roles: [Candidate]
    code: 201
    input: [disclosure_year, has_disclosures, "disclosure_text?"]
    output: Candidate
    side_effects: ["conduct_statements appended (disclosure_year unique per candidate)", "has_disclosures=true -> MisconductCase auto-created OPENED with investigator_user_id=null"]

  # --- Misconduct cases ---
  - method: POST
    path: "/charter/misconduct-cases"
    description: "Open a misconduct case; with appointment_id it reports an exam-day incident (origin EXAM_INCIDENT) and flags the appointment"
    roles: [ConductInvestigator, Proctor]
    code: 201
    input: [candidate_id, "appointment_id?", allegation, "origin?"]
    output: MisconductCase
    side_effects: ["status=OPENED", "investigator_user_id = acting X-User-ID", "appointment_id present -> origin=EXAM_INCIDENT and appointment.compliance_status CLEAR -> POLICY_FLAGGED"]

  - method: GET
    path: "/charter/misconduct-cases"
    description: "List misconduct cases (FK reverse-reachability for candidate_id and appointment_id)"
    roles: *ALL_ROLES
    code: 200
    input: ["candidate_id?", "appointment_id?", "status?", "limit?", "offset?"]
    output: "MisconductCase[]"
    side_effects: []

  - method: GET
    path: "/charter/misconduct-cases/{caseId}"
    description: "Read one misconduct case"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: MisconductCase
    side_effects: []

  - method: POST
    path: "/charter/misconduct-cases/{caseId}/adjudicate"
    description: "Adjudicate (OCC): DISMISSED (with compensation when previously sanctioned) or SANCTIONED with sanction_type cascade; adjudicator != investigator"
    roles: [ConductAdjudicator]
    code: 200
    input: [outcome, "sanction_type?", expected_case_version]
    output: MisconductCase
    side_effects: ["status -> DISMISSED | SANCTIONED", "sanction cascades per sanction_type (suspension / exam invalidation / charter revocation)", "dismissal compensations (reinstate attempts, clear suspension/revocation)", "increments MisconductCase.version by 1"]

  - method: POST
    path: "/charter/misconduct-cases/{caseId}/appeal"
    description: "Candidate appeals a sanction within 30 days of sanctioned_at"
    roles: [Candidate]
    code: 200
    input: [appeal_reason]
    output: MisconductCase
    side_effects: ["status SANCTIONED -> APPEALED", "appeal_reason recorded", "increments MisconductCase.version by 1"]

  # --- Societies, memberships, continuing education ---
  - method: POST
    path: "/charter/societies"
    description: "Create a local society"
    roles: [ProgramAdmin]
    code: 201
    input: [society_code, name, region, annual_dues_cents, "ce_credits_required_per_year?"]
    output: Society
    side_effects: []

  - method: POST
    path: "/charter/societies/{societyId}/memberships"
    description: "Join a society; requires charter awarded; exact dues; one ACTIVE membership per (candidate, society)"
    roles: [Candidate, ProgramAdmin]
    code: 201
    input: [candidate_id, dues_payment_cents]
    output: SocietyMembership
    side_effects: ["status=ACTIVE", "paid_through_year = current clock calendar year"]

  - method: GET
    path: "/charter/memberships"
    description: "List memberships with computed CE fields (FK reverse-reachability for candidate_id, society_id)"
    roles: *ALL_ROLES
    code: 200
    input: ["candidate_id?", "society_id?", "status?", "limit?", "offset?"]
    output: "SocietyMembership[]"
    side_effects: []

  - method: GET
    path: "/charter/memberships/{membershipId}"
    description: "Read one membership (with computed CE standing fields)"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: SocietyMembership
    side_effects: []

  - method: POST
    path: "/charter/memberships/{membershipId}/renew"
    description: "Renew for the next year: calendar-year CE gate + exact dues; paid_through_year += 1"
    roles: [Candidate]
    code: 200
    input: [dues_payment_cents]
    output: SocietyMembership
    side_effects: ["paid_through_year += 1", "increments SocietyMembership.version by 1"]

  - method: POST
    path: "/charter/memberships/{membershipId}/ce-records"
    description: "Self-report a continuing-education record onto the membership"
    roles: [Candidate]
    code: 200
    input: [activity_title, credit_hours, completed_on]
    output: SocietyMembership
    side_effects: ["ce_records appended", "calendar_year_credits / rolling_12m_credits / ce_standing_met recomputed", "increments SocietyMembership.version by 1"]
# === SCAFFOLD PART 6 MARKER ===

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth & ownership ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role name not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not in the endpoint's roles list" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller acts on a resource owned by another (candidate path/body mismatch; ReferenceProvider id != reference id)" }
  # --- Not found (path or body FK) ---
  - { id: ERR_CANDIDATE_NOT_FOUND, http: 404, condition: "Candidate id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "ProgramEnrollment id does not exist" }
  - { id: ERR_EXAM_LEVEL_NOT_FOUND, http: 404, condition: "ExamLevel id does not exist" }
  - { id: ERR_EXAM_WINDOW_NOT_FOUND, http: 404, condition: "ExamWindow id does not exist" }
  - { id: ERR_TEST_CENTER_NOT_FOUND, http: 404, condition: "TestCenter id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "ExamAppointment id does not exist" }
  - { id: ERR_ATTEMPT_NOT_FOUND, http: 404, condition: "ExamAttempt id does not exist" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http: 404, condition: "WorkExperienceSubmission id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "ReferenceContact id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "MisconductCase id does not exist" }
  - { id: ERR_SOCIETY_NOT_FOUND, http: 404, condition: "Society id does not exist" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "SocietyMembership id does not exist" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, bad enum, unknown field, violated conditional-requirement, or reschedule/adjudicate missing its change fields" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 400, condition: "scaled_score outside 0..1000" }
  - { id: ERR_INVALID_PAYMENT_AMOUNT, http: 400, condition: "Payment amount_cents <= 0" }
  # --- Uniqueness ---
  - { id: ERR_DUPLICATE_CANDIDATE_EMAIL, http: 409, condition: "Email already registered" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Candidate already has a ProgramEnrollment (one ever)" }
  - { id: ERR_DUPLICATE_EXAM_LEVEL, http: 409, condition: "level_code already exists" }
  - { id: ERR_DUPLICATE_CURRICULUM_YEAR, http: 409, condition: "cycle_year already exists for the level" }
  - { id: ERR_DUPLICATE_MEMBERSHIP, http: 409, condition: "ACTIVE membership already exists for (candidate, society)" }
  - { id: ERR_DUPLICATE_CONDUCT_STATEMENT, http: 409, condition: "Statement already filed for (candidate, disclosure_year)" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the entity's current version" }
  # --- Eligibility & enrollment state ---
  - { id: ERR_ELIGIBILITY_NOT_MET, http: 422, condition: "Pathway thresholds unmet (EDUCATION: degree or graduation within 23 months; WORK_EXPERIENCE: >= 36 months AND >= 4000 hours)" }
  - { id: ERR_ENROLLMENT_NOT_ENROLLED, http: 409, condition: "Enrollment not in ENROLLED state (booking requires ENROLLED; award requires ENROLLED)" }
  # --- Window state ---
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "Window not OPEN (CANCELLED or RESULTS_PUBLISHED) for booking/retarget" }
  - { id: ERR_WINDOW_NOT_CANCELLABLE, http: 409, condition: "Window already RESULTS_PUBLISHED or CANCELLED" }
  # --- Appointment / attempt state ---
  - { id: ERR_APPOINTMENT_NOT_SCHEDULED, http: 409, condition: "Appointment booking_status != SCHEDULED for reschedule/cancel/check-in" }
  - { id: ERR_ATTEMPT_ALREADY_SCORED, http: 409, condition: "Attempt already SCORED" }
  # --- Submission / reference state ---
  - { id: ERR_INVALID_SUBMISSION_STATE, http: 409, condition: "submit requires DRAFT; review requires SUBMITTED" }
  - { id: ERR_SUBMISSION_NOT_EDITABLE, http: 409, condition: "amend requires RETURNED_FOR_REVISION" }
  - { id: ERR_REFERENCE_NOT_PENDING, http: 409, condition: "Reference not PENDING (already VERIFIED/DECLINED, or past expires_at -> EXPIRED)" }
  # --- Case / membership state ---
  - { id: ERR_INVALID_CASE_STATE, http: 409, condition: "adjudicate requires OPENED|APPEALED; appeal requires SANCTIONED" }
  - { id: ERR_INVALID_MEMBERSHIP_STATE, http: 409, condition: "renew requires ACTIVE" }
  # --- Temporal ---
  - { id: ERR_WINDOW_SCHEDULING_CLOSED, http: 422, condition: "Clock past window.scheduling_deadline_at for new booking or window-retargeting reschedule" }
  - { id: ERR_EXAM_DATE_OUTSIDE_WINDOW, http: 422, condition: "exam_date outside [window_opens_at, window_closes_at)" }
  - { id: ERR_RESCHEDULE_DEADLINE_PASSED, http: 422, condition: "Clock past the ORIGINAL window's reschedule_deadline_at" }
  - { id: ERR_CHECKIN_NOT_ON_EXAM_DATE, http: 422, condition: "Check-in clock date != exam_date" }
  - { id: ERR_WINDOW_NOT_CONCLUDED, http: 409, condition: "Score attempted before window.window_closes_at" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Clock past sanctioned_at + 30 days" }
  # --- Exam-day safety ---
  - { id: ERR_IDENTITY_VERIFICATION_FAILED, http: 422, condition: "identity_document_number != candidate.gov_id_number" }
  - { id: ERR_CALCULATOR_POLICY_VIOLATION, http: 422, condition: "actual_calculator_model != declared calculator_model or not in {TI_BA_II_PLUS, HP_12C}" }
  # --- Constraint ---
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Same-level window [opens, closes) overlaps an existing window (half-open: touching endpoints allowed)" }
  - { id: ERR_CENTER_BLACKOUT_CONFLICT, http: 409, condition: "exam_date within a blackout's inclusive range plus 1-day buffer on each side" }
  - { id: ERR_NO_SEAT_CAPACITY, http: 409, condition: "seats_consumed == daily_seat_capacity for center+date" }
  - { id: ERR_DOUBLE_BOOKING_LEVEL, http: 409, condition: "Candidate already holds an active (SCHEDULED|CHECKED_IN) appointment for the level" }
  - { id: ERR_CASE_ALREADY_OPEN_FOR_APPOINTMENT, http: 409, condition: "Another case in {OPENED, SANCTIONED, APPEALED} exists for the appointment" }
  # --- Referential ---
  - { id: ERR_LEVEL_ALREADY_PASSED, http: 422, condition: "Target level already passed with a VALID|REINSTATED attempt" }
  - { id: ERR_PREREQUISITE_LEVEL_NOT_PASSED, http: 422, condition: "Predecessor level not passed" }
  - { id: ERR_MAX_ATTEMPTS_REACHED, http: 422, condition: "attempts with validity IN {VALID, REINSTATED} at the level >= level.max_attempts" }
  - { id: ERR_RETAKE_WINDOW_TOO_SOON, http: 422, condition: "Target window does not open strictly after the latest failed attempt's window closed" }
  - { id: ERR_WINDOW_LEVEL_MISMATCH, http: 422, condition: "Reschedule target window belongs to a different level" }
  - { id: ERR_INSUFFICIENT_REFERENCES, http: 422, condition: "submit requires >= 2 attached non-EXPIRED references" }
  - { id: ERR_INSUFFICIENT_VERIFIED_REFERENCES, http: 422, condition: "APPROVED requires >= 2 references in VERIFIED status" }
  - { id: ERR_LEVELS_NOT_ALL_PASSED, http: 422, condition: "Award gate: some ExamLevel lacks a passing VALID|REINSTATED attempt" }
  - { id: ERR_EXPERIENCE_REQUIREMENT_UNMET, http: 422, condition: "Award gate: sum of committee_months over APPROVED submissions < 36" }
  - { id: ERR_MISSING_CONDUCT_STATEMENT, http: 422, condition: "Award gate: candidate.conduct_statements has no entry for the current calendar year" }
  - { id: ERR_OPEN_MISCONDUCT_CASE, http: 409, condition: "Award gate: a case in OPENED or APPEALED exists for the candidate" }
  - { id: ERR_CHARTER_REQUIRED, http: 422, condition: "Membership join requires candidate.charter_awarded == true" }
  - { id: ERR_CE_REQUIREMENT_NOT_MET, http: 422, condition: "Renewal gate: calendar_year_credits < society.ce_credits_required_per_year" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Adjudicator X-User-ID == case.investigator_user_id" }
  # --- Fiscal ---
  - { id: ERR_OUTSTANDING_BALANCE, http: 402, condition: "Booking/reschedule/award requires outstanding_balance_cents == 0" }
  - { id: ERR_INCORRECT_DUES_AMOUNT, http: 422, condition: "dues_payment_cents != society.annual_dues_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Candidate
    description: "Charter candidate; acts on own enrollments, appointments, experience submissions, conduct statements, appeals, memberships and CE records"
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /charter/candidates/{candidateId}/experience-submissions"
      - "POST /charter/experience-submissions/{id}/amend"
      - "POST /charter/experience-submissions/{id}/submit"
      - "POST /charter/experience-submissions/{id}/references"
      - "POST /charter/candidates/{candidateId}/conduct-statements"
      - "POST /charter/misconduct-cases/{id}/appeal"
      - "POST /charter/memberships/{id}/renew"
      - "POST /charter/memberships/{id}/ce-records"
    shared_operations:
      - "POST /charter/candidates/{candidateId}/program-enrollments (with ProgramAdmin; own candidateId only)"
      - "POST /charter/program-enrollments/{id}/payments (with ProgramAdmin; own enrollment only)"
      - "POST /charter/appointments (with ProgramAdmin; own enrollment only)"
      - "POST /charter/appointments/{id}/reschedule and /cancel (with ProgramAdmin; own appointment only)"
      - "POST /charter/societies/{id}/memberships (with ProgramAdmin; own candidate_id only)"
      - "All GET endpoints (shared with every role)"

  - name: ProgramAdmin
    description: "Program operator; configures levels, cycles, windows, centers, societies; registers candidates; scores attempts; awards charters"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /charter/candidates"
      - "POST /charter/exam-levels"
      - "POST /charter/exam-levels/{id}/curriculum-cycles"
      - "POST /charter/exam-windows and /charter/exam-windows/{id}/cancel"
      - "POST /charter/test-centers"
      - "POST /charter/exam-attempts/{id}/score"
      - "POST /charter/program-enrollments/{id}/award-charter"
      - "POST /charter/societies"
    shared_operations:
      - "Enrollment create/payments, appointment create/reschedule/cancel, membership create (shared with Candidate, no ownership restriction)"
      - "All GET endpoints (shared with every role)"

  - name: Proctor
    description: "Test-center staff; exam-day check-in and incident reporting"
    identity: "opaque"
    exclusive_operations:
      - "POST /charter/appointments/{id}/check-in"
    shared_operations:
      - "POST /charter/misconduct-cases (with ConductInvestigator; exam-day incident reports)"
      - "All GET endpoints (shared with every role)"

  - name: ExperienceReviewer
    description: "Committee reviewer for work-experience submissions"
    identity: "opaque"
    exclusive_operations:
      - "POST /charter/experience-submissions/{id}/review"
    shared_operations:
      - "All GET endpoints (shared with every role)"

  - name: ReferenceProvider
    description: "A named reference acting as its own ReferenceContact id to verify or decline an attestation"
    identity: "entity_backed:ReferenceContact"
    exclusive_operations:
      - "POST /charter/references/{id}/respond (X-User-ID == reference id)"
    shared_operations:
      - "All GET endpoints (shared with every role)"

  - name: ConductInvestigator
    description: "Opens and documents misconduct cases; may never adjudicate a case it opened (segregation of duties)"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /charter/misconduct-cases (with Proctor)"
      - "All GET endpoints (shared with every role)"

  - name: ConductAdjudicator
    description: "Decides misconduct cases; barred from adjudicating any case whose investigator_user_id equals the adjudicator's X-User-ID"
    identity: "opaque"
    exclusive_operations:
      - "POST /charter/misconduct-cases/{id}/adjudicate"
    shared_operations:
      - "All GET endpoints (shared with every role)"
