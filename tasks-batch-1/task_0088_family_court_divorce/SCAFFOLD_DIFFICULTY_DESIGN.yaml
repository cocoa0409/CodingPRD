  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ----- Instance 1: depth-3 cascade from MediationSession FULL_AGREEMENT -----
      - name: full_agreement_cascade_plan_support_case_depth3
        grounds:
          - state_machines.MediationSession.IN_SESSION_to_FULL_AGREEMENT
          - state_machines.ParentingPlan.AGREED_to_ADOPTED
          - state_machines.Case.MEDIATION_to_AWAITING_JUDGMENT
          - entities.Case.fields.status
        distinguishing_aspect: |
          Depth-3 chain each link caused by the prior: conclude FULL_AGREEMENT mutates
          MediationSession -> that drives ParentingPlan AGREED->ADOPTED -> ADOPTED drives
          Case MEDIATION->AWAITING_JUDGMENT. Not a fan-out: each hop is the consequence
          of the previous hop's mutation.
        test_recipe:
          setup:
            - "Canonical CA contested case in MEDIATION (mediator u-med); both disclosures VERIFIED; ParentingPlan AGREED; one SCHEDULED MediationSession."
