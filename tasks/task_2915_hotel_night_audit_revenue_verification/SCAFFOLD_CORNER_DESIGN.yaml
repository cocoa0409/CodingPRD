          trigger: "POST /night-audit/journal-postings with business_date_id ${bd1_id}, charge_type DEPOSIT_APPLIED, amount 300.00, ledger_account_id ${deposit_acct_id} and memo Apply advance deposit - ledger leg, as NightAuditor (X-User-ID u_na_1)."
