            - { call: "PATCH /rating-briefings/${brf}", payload: { narrative: "Analyst revision: coverage of 7713 bps sits above the disclosed 500 bps target." }, as: RatingAnalyst, as_user_id: "ra-1", captures: { v_after_analyst: $.data.version } }
            - { call: "PATCH /rating-briefings/${brf}", payload: { narrative: "Director revision: adequacy band ADEQUATE is confirmed for agency circulation." }, as: ForecastDirector, as_user_id: "dir-1", captures: { v_after_director: $.data.version } }
          assert:
            - "both triggers: HTTP 200, no 403 from either role"
            - "${v_after_analyst} == 2 and ${v_after_director} == 3"
            - "RatingAgencyBriefing.${brf}.status == DRAFT, snapshot_fund_version == 2, snapshot_adequacy_band == ADEQUATE, snapshot_coverage_ratio_bps == 7713 — the two PATCHes touched only the narrative"
            - "RatingAgencyBriefing.${brf}.narrative == \"Director revision: adequacy band ADEQUATE is confirmed for agency circulation.\""

      - name: economist_who_filed_the_estimate_cannot_resolve_the_disagreement
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 38 ERR_SEGREGATION_OF_DUTIES]
          - roles.ForecastDirector.exclusive_operations
          - entities.DisagreementRecord
        distinguishing_aspect: |
          Resolution is checked per acting USER, not per role: the very same
          POST /disagreement-records/{id}/resolve that succeeds for dir-1 returns
          ERR_SEGREGATION_OF_DUTIES 403 when the ForecastDirector role header is paired with
