            - "naming tied non-winner without override: err == ERR_AWARD_NOT_TOP_SCORE"
            - "default award goes to the earliest-submitted quote (tie-break by submitted_at then created_at, never id): awarded_quote_id == the first quote"

      - name: utilization_cycle_scoping_filters_old_debits
        claim_type: input_set_filtering
        grounds: ["calculations.pcard_utilization", "calculations.reconciliation_aging"]
        distinguishing_aspect: "Input-set filtering by cycle_index: after close-cycle, the previous cycle's unreconciled debits stop counting toward utilization even though they remain POSTED — the new cycle's utilization reflects only new-cycle activity."
        test_recipe:
          setup: ["Card (single 100,000, monthly 500,000); DEBIT 30,000 posted in cycle 0 and left unreconciled; cycle closed once (counter 1)"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Grounds", cost_center: "CC-3400", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
