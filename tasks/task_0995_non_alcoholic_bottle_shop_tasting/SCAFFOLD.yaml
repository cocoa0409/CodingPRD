    side_effects: []
  - method: GET
    path: "/nabs/categories"
    description: "List categories"
    roles: [PlatformAdmin, ShopStaff, Member, Anonymous]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: Category[]
    side_effects: []
  - method: GET
    path: "/nabs/categories/{id}"
    description: "Fetch one category"
    roles: [PlatformAdmin, ShopStaff, Member, Anonymous]
    code: 200
    input: []
    output: Category
    side_effects: []
  - method: GET
    path: "/nabs/categories/{id}/skus"
    description: "Reverse-reachability: SKUs under a category"
    roles: [PlatformAdmin, ShopStaff, Member, Anonymous]
    code: 200
