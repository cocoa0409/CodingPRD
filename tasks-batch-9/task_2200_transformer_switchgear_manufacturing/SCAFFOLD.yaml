    applies_to: "/test-bays/{id}, POST /factory-acceptance-tests/{id}/schedule"
  - priority: 16
    category: existence
    check: "the FactoryAcceptanceTest named by {id}, by factory_acceptance_test_id or by retest_of_fat_id exists"
    error_id: ERR_FAT_NOT_FOUND
    http_status: 404
    applies_to: "all /factory-acceptance-tests/{id}/** paths, POST /factory-acceptance-tests"
  - priority: 17
    category: existence
    check: "the WitnessParty named by {id} or by witness_party_id exists"
