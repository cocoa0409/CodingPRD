            - "VoteReport.${rep_b}.status == FLAGGED (deviation 0.55 > 0.40)"

      - name: margin_pct_rounds_to_six_decimals
        claim_type: Precision
        grounds:
          - calculations.tabulation_rollup
          - entities.Contest.fields.margin_pct
        distinguishing_aspect: "1/3999 = 0.00025006... must store as margin_pct 0.00025 with round_half_up at 6 decimal places — not 0.0003 and not a float echo."
        test_recipe:
          setup: ["Standard universe at LIVE, contest linked to Contra Costa only; report p5 W2000/T1999 (total 3999, deviation 0.00025 within QC) accepted."]
          setup_api_calls:
            - *k_clock
            - *k_ev
