  - rule_id: transitive_cascade
    instances:

      - name: day_close_cascades_four_links_to_special_waste_suspension
        grounds:
          - state_machines.OperatingDay.OPEN_to_CLOSED
          - state_machines.Cell.ACTIVE_to_FULL
          - state_machines.SpecialWasteApproval.APPROVED_to_SUSPENDED
          - calculations.daily_airspace_consumption
          - entities.Landfill.fields.active_cell_count
          - entities.Landfill.fields.operating_status
        distinguishing_aspect: |
          One POST /operating-days/{id}/close produces a four-link chain in which each link is
          caused by the previous one, not by the request: the day's airspace consumption
          (link 1) fills the cell to exactly 98.00 percent so the Cell goes ACTIVE -> FULL
          (link 2); because that was the site's only active cell, active_cell_count drops to 0
          and the Landfill goes SUSPENDED_NO_AIRSPACE (link 3); because the site stopped
          accepting waste, an unrelated APPROVED SpecialWasteApproval — never referenced by any
          load in this test — is driven to SUSPENDED (link 4). The chain is also
          order-sensitive: the later LEDGER SYNC step computes remaining_life_years 0.00, which
          is under the 2.0-year restriction threshold, yet operating_status stays
          SUSPENDED_NO_AIRSPACE and is NOT overwritten with RESTRICTED_AIRSPACE, because that
          step only fires when the status is still OPEN.
        test_recipe:
          setup:
            - "Landfill LF with exactly one cell C-2 whose design_airspace_cy is 200, driven to ACTIVE with a FUNDED assurance position and an EXECUTED HostCommunityAgreement."
            - "SpecialWasteApproval SW for LF in status APPROVED (approved_tons_cap 500, effective 2026-01-01 to 2027-01-01), referenced by no load."
            - "OperatingDay D1 on 2026-08-05 with cover ALTERNATIVE_TARP and working_face_area_sf 5000, so effective density is exactly 0.8500."
            - "One CLEARED MSW load on D1 with manifest_tons 166.60 and certified_net_tons 166.60."
