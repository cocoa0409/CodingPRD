        distinguishing_aspect: "Store-hold interval semantics on the Repair resource are adjacency-INCLUSIVE: the hold [delivered_at, delivered_at + store_hold_days] rejects at its closing instant, so a second claim on the same store hold slot that begins exactly at pickup_deadline_at is refused whereas one beginning one second later is admitted — the geometric treatment differs from the parallel-capacity rule on the bench shop."
