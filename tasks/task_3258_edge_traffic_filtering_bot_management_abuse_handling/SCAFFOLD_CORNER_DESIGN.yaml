        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/abuse-reports
        payload:
          zone_id: ${zone}
          reporter_email: r@example.org
          category: MALWARE
          description: d
          target_url: https://proxied.example.com/m
          reporter_trust_score: 50
        as: Anonymous
        captures:
          rep: $.data.id
      - call: POST /api/abuse-reports/${rep}/claim
        payload: {}
        as: TrustSafetyAnalyst
      trigger:
      - call: POST /api/abuse-reports/${rep}/disposition
        payload:
          disposition: TAKE_ACTION
        as: TrustSafetyAnalyst
        captures:
          err: $.data.error_id
      - call: POST /api/abuse-reports/${rep}/disposition
        payload:
          disposition: FORWARD
        as: TrustSafetyAnalyst
        captures:
          fwd: $.data.forwarded_to
      assert:
      - 'take-action: error_id == ERR_ABUSE_ROUTING_VIOLATION (409)'
      - 'forward succeeds: status == FORWARDED and forwarded_to == "abuse@originhost.example.net" (origin host forwarding policy)'
  - name: stale_zone_version_occ_conflict
    claim_type: Violation → Error
    grounds:
    - concurrency_rules[zone-sensitivity-stale-version]
    - errors.ERR_STALE_VERSION
    distinguishing_aspect: A zone PATCH carrying dos_sensitivity with the zone version observed before an intervening bot_fight_mode PATCH is rejected with ERR_STALE_VERSION (412); the correct current version
      succeeds.
    test_recipe:
      setup:
      - BUSINESS account with ACTIVE zone; a bot-fight-mode toggle bumps the zone version between the client's read and the sensitivity write.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Biz Corp
          plan_tier: BUSINESS
          account_email: ops@biz.example.com
        as: PlatformAdmin
