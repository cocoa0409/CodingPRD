      - name: corner_validation_priority_ordering
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: priority_state_beats_business_fiscal_on_repeat_deduction_post
          rationale: "The generic two-rules-violated claim is driven there with the state rung (priority 8) and the fiscal rung (priority 33) both violated by one call, asserting that only the higher-priority error_id and its 409 status come back."

      - name: corner_priority_conflict_across_adjacent_categories
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: priority_business_referential_beats_business_temporal_on_late_filing_of_future_guide
          rationale: "The priority-P versus priority-P+N conflict is exercised there on the referential (11) versus temporal (12) pair, where both rungs return 422 so only the error_id discriminates - a strictly harder version of this row."

      - name: corner_cross_entity_validation_dependency
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: deduction_posting_depends_on_allocated_chargeback_dispute_state
          rationale: "Validity depending on another entity's state, tested in both polarities, is that instance's subject: posting is refused while the allocated chargeback's dispute_status is OPEN and succeeds once the dispute is adjudicated to UPHELD."

      - name: corner_temporal_validation_future_conflict
        claim_type: temporal
        excluded_because:
          difficulty_instance: routing_guide_scope_timeline_half_open_adjacency_allowed
          rationale: "The temporal-validation claim (an operation legal now that would create a future interval conflict) is driven there against priority 14's half-open scope timeline, including the adjacency case that must be allowed and the wildcard ALL collision that must not."

      - name: corner_cascading_validation_ordering
        claim_type: cascading
        excluded_because:
          difficulty_instance: priority_business_temporal_beats_business_constraint_on_second_dispute_after_window
          rationale: "Check-A-requires-check-B ordering is asserted there: the dispute window rung (13) must be evaluated before the one-dispute-per-chargeback rung (16), even though the lower-priority rule carries the louder 409 status."
  - section: endpoints
    instances:
      - name: corner_clock_endpoint_returns_its_inline_output_schema
        claim_type: standard_crud
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - program_constants.LOGICAL_CLOCK_DEFAULT_UTC
          - response_envelope
        distinguishing_aspect: "The test-driving clock endpoint returns the inline schema { current_utc: string } echoing the value just set, and the value it installs is what subsequent server-stamped fields use: a vendor created after moving the clock to 2026-08-15 carries created_at 2026-08-15T00:00:00Z rather than the 2026-08-01 default."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at the LOGICAL_CLOCK_DEFAULT_UTC value 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { now: $.data.current_utc }
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2050", legal_name: "Clockwise Cartons", payment_terms_days: 30 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id }
          assert:
            - "First trigger call returns HTTP 200 with response_type == entity"
            - "$.data.current_utc == '2026-08-15T00:00:00Z'"
            - "Vendor.${v_id}.created_at == 2026-08-15T00:00:00Z"
            - "Vendor.${v_id}.updated_at == 2026-08-15T00:00:00Z"

      - name: corner_allocation_link_requires_both_sides_to_exist
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /compliance/deductions/{id}/allocations]
          - validations[priority=5]
          - errors.ERR_CHARGEBACK_NOT_FOUND
          - errors.ERR_DEDUCTION_NOT_FOUND
        distinguishing_aspect: "The junction write validates both endpoints of the link independently: a real deduction with an unknown body chargeback_id returns 404 ERR_CHARGEBACK_NOT_FOUND (body FK rung, priority 5) while an unknown path deduction id returns 404 ERR_DEDUCTION_NOT_FOUND (path rung, priority 4), and neither attempt raises the deduction's allocation_count above 0."
        test_recipe:
          setup:
            - "Vendor V-2051 with one DRAFT deduction against INV-LINK and no chargebacks anywhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-2051", legal_name: "Danglinglink Distributors", payment_terms_days: 30 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /compliance/deductions"
              payload: { vendor_id: "${v_id}", invoice_reference: "INV-LINK", expected_vendor_version: "${v_ver}" }
              as: APAccountant
              as_user_id: "ap-1"
              captures: { ded_id: $.data.id }
          trigger:
            - call: "POST /compliance/deductions/${ded_id}/allocations"
              payload: { chargeback_id: "00000000-0000-4000-8000-000000000000", allocated_cents: 1000 }
              as: APAccountant
              as_user_id: "ap-1"
              captures: { err_cb: $.data.error_id }
            - call: "POST /compliance/deductions/00000000-0000-4000-8000-000000000000/allocations"
              payload: { chargeback_id: "00000000-0000-4000-8000-000000000000", allocated_cents: 1000 }
              as: APAccountant
              as_user_id: "ap-1"
              captures: { err_ded: $.data.error_id }
          assert:
            - "First trigger call returns HTTP 404 with $.data.error_id == ERR_CHARGEBACK_NOT_FOUND"
            - "Second trigger call returns HTTP 404 with $.data.error_id == ERR_DEDUCTION_NOT_FOUND"
            - "Deduction.${ded_id}.allocation_count == 0"
            - "Deduction.${ded_id}.amount_cents == 0"
            - "Deduction.${ded_id}.status == DRAFT"
            - "GET /compliance/recovery-allocations?deduction_id=${ded_id} returns total_count == 0"

      - name: corner_chargeback_read_reflects_partial_settlement_derivation
        claim_type: computed_read
        grounds:
          - endpoints[GET /compliance/chargebacks/{id}]
          - calculations.chargeback_settlement_reconciliation
          - entities.Chargeback.fields.outstanding_cents
        distinguishing_aspect: "The read-back carries derived settlement data, not stored inputs: after a single 10000-cent cash application against a 38000-cent chargeback the GET returns recovered_cents 10000, outstanding_cents 28000 (38000 - 0 reversal - 10000) and settlement_status PARTIALLY_RECOVERED, with deduction_posted still false because the cash path never touches a Deduction."
