          setup:
            - "Empty database. Clock starts at 2026-08-01T00:00:00Z, then advances to 2026-11-01T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD; ENTERED order, monthly_obligation_cents 75000; DIRECT_APPLICATION so all arrears are unassigned."
            - "Two CURRENT_SUPPORT charges of 75000 due 2026-08-15 and 2026-09-15; no payments at all."
            - "STATUTORY_INTEREST_ANNUAL_PCT is 0.06 so MONTHLY_RATE is 0.005."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Anais Verhoeven", ssn_last4: "6231", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpe1: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Kasper Verhoeven", ssn_last4: "6232", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpe1: "$.data.id" }
            - call: "POST /child-support/participants/${ncpe1}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpe1}", noncustodial_party_id: "${ncpe1}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casee1: "$.data.id" }
            - call: "POST /child-support/cases/${casee1}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casee1}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { ordere1: "$.data.id" }
            - call: "POST /child-support/orders/${ordere1}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${ordere1}/entry"
              payload: {}
