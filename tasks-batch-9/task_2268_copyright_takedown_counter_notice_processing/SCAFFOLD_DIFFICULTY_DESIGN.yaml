# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2268
# 9 rule_ids x 2 instances = 18 instances. Every literal below was computed
# against SCAFFOLD.yaml's §1.3 formulas and constants.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: notice_compliance_strict_vs_substantial_same_payload
        grounds:
          - calculations.notice_statutory_completeness
          - entities.TakedownNotice.fields.compliance_variant
          - entities.TakedownNotice.fields.completeness_score
          - state_machines.TakedownNotice.RECEIVED_to_VALIDATED
          - state_machines.TakedownNotice.RECEIVED_to_REJECTED
        distinguishing_aspect: |
          Two notices carrying byte-identical statutory elements (accuracy_statement
          omitted, score 92) diverge purely on variant selection: the WEB_FORM notice
          is VALIDATED under substantial_compliance (92 >= 92) while the API_BULK
          notice is REJECTED under strict_compliance (92 < 100) — the dual-variant
          subject here is notice compliance on the TakedownNotice entity domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Provider with published public contact and one REGISTERED designated agent."
            - "One RightsHolder in PROSPECT / STANDARD tier."
            - "Two TakedownNotices in RECEIVED with identical elements except submission_channel: one WEB_FORM, one API_BULK; both omit accuracy_statement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/providers/${prov_id}/publish-contact"
              payload: { public_contact_url: "https://northstar.example/legal/dmca-agent" }
              as: ComplianceOfficer
              captures: { prov_v1: "$.data.version" }
            - call: "POST /dmca/designated-agents"
              payload: { provider_id: "${prov_id}", agent_name: "Dana Reyes", agent_email: "dmca@northstar.example", agent_phone: "+1-555-0100", mailing_address: "1 Harbor Way, Springfield, IL 62701" }
              as: ComplianceOfficer
              captures: { agent_id: "$.data.id" }
            - call: "POST /dmca/designated-agents/${agent_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/designated-agents/${agent_id}/register"
              payload: { expected_provider_version: "${prov_v1}", copyright_office_receipt: "CO-2026-0001" }
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example" }
              as: ComplianceOfficer
              captures: { rh_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/1"], signature_present: true, work_identification: "Sound recording: Orbit Vol. 1, track 3", material_identification: "Track 3 posted at /v/1", contact_email: "legal@orbit.example", good_faith_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n_web_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "API_BULK", claimed_urls: ["https://northstar.example/v/1"], signature_present: true, work_identification: "Sound recording: Orbit Vol. 1, track 3", material_identification: "Track 3 posted at /v/1", contact_email: "legal@orbit.example", good_faith_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n_bulk_id: "$.data.id" }
          trigger:
            - call: "POST /dmca/notices/${n_web_id}/validate"
              payload: {}
              as: TakedownAgent
            - call: "POST /dmca/notices/${n_bulk_id}/validate"
              payload: {}
              as: TakedownAgent
          assert:
            - "TakedownNotice.${n_web_id}.completeness_score == 92"
            - "TakedownNotice.${n_web_id}.compliance_variant == SUBSTANTIAL_COMPLIANCE"
            - "TakedownNotice.${n_web_id}.status == VALIDATED"
            - "TakedownNotice.${n_web_id}.rejection_reason == null"
            - "TakedownNotice.${n_bulk_id}.completeness_score == 92"
            - "TakedownNotice.${n_bulk_id}.compliance_variant == STRICT_COMPLIANCE"
            - "TakedownNotice.${n_bulk_id}.status == REJECTED"
            - "TakedownNotice.${n_bulk_id}.rejection_reason == \"SCORE_BELOW_THRESHOLD\""
            - "RightsHolder.${rh_id}.rejected_count == 1"
            - "RightsHolder.${rh_id}.abuse_score == 40.00"
            - "GET /dmca/misrepresentation-cases?rights_holder_id=${rh_id} returns total_count == 0 (abuse_score reached AUTO_OPEN_FLOOR but the holder owns no eligible claim, so the empty-pool fallback applies)"

      - name: strike_points_chronological_vs_snapshot_diverge_on_decayed_strike
        grounds:
          - calculations.account_strike_points
          - entities.StrikeRecord.fields.effective_points
          - entities.Account.fields.strike_points
          - state_machines.StrikeRecord.ACTIVE_to_DECAYED
          - state_machines.Account.ACTIVE_to_LIMITED
        distinguishing_aspect: |
          Two strikes on the same Account total 19.75 under the pinned
          chronological_replay variant (10.00 + round(10*1.5*0.65,2)=9.75) but
          25.00 under the snapshot_aggregate reading, and only the wrong reading
          crosses limitation_threshold_points 20 — the dual-variant subject here is
          repeat-infringer risk scoring on the Account entity domain, not notice
          compliance.
        test_recipe:
          setup:
            - "Provider fully documented (contact published, agent REGISTERED, policy PUBLISHED with defaults: decay_step_days 90, limitation 20, termination 40)."
            - "Account with two ContentItems, both AVAILABLE at the start."
            - "RightsHolder Orbit ENROLLED and promoted to VERIFIED (strike weight 1.5); RightsHolder Meridian left at STANDARD (weight 1.0)."
            - "Orbit's notice already processed at 2026-08-01, producing one strike of base_points 15."
            - "Clock advanced to 2026-11-09 (strike age 100 days -> step 1 -> factor 0.65 -> DECAYED, effective_points 9.75)."
            - "Meridian's notice on the second item is VALIDATED and awaiting process."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/providers/${prov_id}/publish-contact"
              payload: { public_contact_url: "https://northstar.example/legal/dmca-agent" }
              as: ComplianceOfficer
              captures: { prov_v1: "$.data.version" }
            - call: "POST /dmca/designated-agents"
              payload: { provider_id: "${prov_id}", agent_name: "Dana Reyes", agent_email: "dmca@northstar.example", agent_phone: "+1-555-0100", mailing_address: "1 Harbor Way, Springfield, IL 62701" }
              as: ComplianceOfficer
              captures: { agent_id: "$.data.id" }
            - call: "POST /dmca/designated-agents/${agent_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/designated-agents/${agent_id}/register"
              payload: { expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
            - call: "GET /dmca/providers/${prov_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prov_v2: "$.data.version" }
            - call: "POST /dmca/repeat-infringer-policies"
              payload: { provider_id: "${prov_id}", policy_text: "Strikes decay in 90-day steps; 20 points limit an account and 40 points open a termination case." }
              as: ComplianceOfficer
              captures: { policy_id: "$.data.id" }
            - call: "POST /dmca/repeat-infringer-policies/${policy_id}/publish"
              payload: { expected_provider_version: "${prov_v2}" }
              as: ComplianceOfficer
            - call: "POST /dmca/accounts"
              payload: { provider_id: "${prov_id}", handle: "ada_lovelace", email: "ada@subscriber.example" }
              as: ComplianceOfficer
              captures: { acct_id: "$.data.id" }
            - call: "POST /dmca/content-items"
              payload: { account_id: "${acct_id}", content_url: "https://northstar.example/v/1", title: "Clip One", fingerprint_hash: "0123456789abcdef0123456789abcdef" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { item1_id: "$.data.id" }
            - call: "POST /dmca/content-items"
              payload: { account_id: "${acct_id}", content_url: "https://northstar.example/v/2", title: "Clip Two", fingerprint_hash: "11111111111111111111111111111111" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { item2_id: "$.data.id" }
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example" }
              as: ComplianceOfficer
              captures: { rh_orbit_id: "$.data.id" }
            - call: "POST /dmca/rights-holders/${rh_orbit_id}/enroll"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders/${rh_orbit_id}/promote-tier"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Meridian Music Group", contact_email: "legal@meridian.example" }
              as: ComplianceOfficer
              captures: { rh_meridian_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_orbit_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/1"], signature_present: true, work_identification: "Sound recording: Orbit Vol. 1, track 3", material_identification: "Track 3 posted at /v/1", contact_email: "legal@orbit.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n_orbit_id: "$.data.id" }
            - call: "POST /dmca/notices/${n_orbit_id}/validate"
              payload: {}
              as: TakedownAgent
            - call: "POST /dmca/notices/${n_orbit_id}/process"
              payload: {}
              as: TakedownAgent
            - call: "GET /dmca/accounts/${acct_id}/strikes"
              payload: {}
              as: ComplianceOfficer
              captures: { strike_orbit_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-09T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_meridian_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/2"], signature_present: true, work_identification: "Sound recording: Meridian Sessions", material_identification: "Full track posted at /v/2", contact_email: "legal@meridian.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n_meridian_id: "$.data.id" }
            - call: "POST /dmca/notices/${n_meridian_id}/validate"
              payload: {}
              as: TakedownAgent
