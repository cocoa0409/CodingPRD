      # SCAFFOLD CONFLICT (reported): §1.7 lists POST /molding-cycles/{id}/abort
      # as a PlantAdmin shared_operation and §1.5 lists roles
      # [MoldingOperator, PlantAdmin], but every SCHEDULED/OVEN_RUNNING/COOLING
      # -> ABORTED transition in §1.2 carries the unconditional precondition
      # "acting X-User-ID == cycle.operator_technician_id ->
      # ERR_ROLE_IDENTITY_MISMATCH", which the opaque audit id admin-1 can never
      # satisfy. This instance therefore exercises the abort under the role that
      # is unambiguously able to perform it and does not claim an outcome for the
      # PlantAdmin leg.
      - name: rbac_positive_matrix_every_role_performs_its_own_and_its_shared_operations
        claim_type: "Can perform all exclusive_operations and shared_operations"
        grounds:
