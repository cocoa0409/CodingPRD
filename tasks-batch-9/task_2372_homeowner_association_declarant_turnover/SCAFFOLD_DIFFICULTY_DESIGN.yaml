            - call: "POST /hoa/associations"
              payload: { name: "Gladstone Park", total_planned_lots: 16, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-09-01T00:00:00Z", statute_of_repose_years: 9, reserve_pool_cents: 300000, reserve_claim_pool_cents: 900000, declarant_monthly_subsidy_cents: 60000 }
