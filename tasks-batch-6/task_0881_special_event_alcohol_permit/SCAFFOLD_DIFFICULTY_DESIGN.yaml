  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fine_reversal_conserves_balance
        grounds:
          - state_machines.Violation.CONTESTED_to_DISMISSED
          - calculations.violation_penalty
          - entities.PermitApplication.fields.balance_due_cents
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: "Money conservation: issuing a MINOR fine (FINE +2500) then dismissing it (FINE_REVERSAL -2500) leaves balance_due_cents identical (33789 before the fine and after the reversal); the conserved quantity is application money in cents."
        test_recipe:
          setup:
            - "Application APPROVED (unpaid, balance_due_cents=33789) with an inspection SCHEDULED."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
