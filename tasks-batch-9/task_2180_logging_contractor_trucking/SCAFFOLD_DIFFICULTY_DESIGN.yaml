  - rule_id: cross_entity_state_dependency
    instances:

      - name: load_dispatch_is_gated_by_the_tract_status_of_a_different_aggregate
        grounds:
          - validations[priority=65]
          - errors[ERR_TRACT_NOT_ACTIVE]
          - state_machines.Tract.ACTIVE_to_SUSPENDED
          - state_machines.Tract.SUSPENDED_to_ACTIVE
          - entities.Load.fields.tract_id
        distinguishing_aspect: |
          Entity pair Load -> Tract: whether a Load may be created at all depends on a status
          field owned by the Tract aggregate. The identical dispatch body is refused with
          ERR_TRACT_NOT_ACTIVE while the tract is SUSPENDED and succeeds unchanged once the
          shutdown order is lifted.
        test_recipe:
          setup:
            - "MillContract A quota 500 tons, mill receiving OPEN, route OPEN, carrier COMPLIANT with score 100"
            - "Tract Section 14 NE has been suspended by a FIRE_DANGER shutdown order at moisture 20"
            - "No load exists yet, so reserved_tons is 0.00 and every non-tract precondition passes"
