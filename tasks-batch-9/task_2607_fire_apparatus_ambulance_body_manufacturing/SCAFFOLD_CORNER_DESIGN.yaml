# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  —  §1.9 Scaffold Corner Design
# Task 2607 — Fire Apparatus & Ambulance Body Manufacturing
#
# Breadth probe over the surface declared in SCAFFOLD.yaml §1.1–§1.7:
# 12 entities / 10 state-machine blocks / 2 concurrency rules / 11 calculations /
# 53 ordered validations / 61 endpoints / 63 error codes / 5 roles.
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry `excluded_because:` stubs and no
# test_recipe. Every instance name is unique across BOTH design files.
#
# Logical clock: unless a recipe calls POST /_clock/set_current_utc, the clock
# reads 2026-08-01T00:00:00Z, so every row created by these recipes carries
# created_at == "2026-08-01T00:00:00.000Z".
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: program_creation_returns_201_with_system_defaults
        claim_type: Creation
        grounds:
          - entities.ApparatusProgram
          - endpoints[POST /programs]
          - response_envelope.success
        distinguishing_aspect: |
          A create call supplying only the seven declared input fields must come
          back 201 with every system and computed field at its declared default —
          status DRAFT, committed_cents 0, options_exercised_count 0,
          suspension_reason null, version 1 — inside the meta/response_type/data
          envelope.
        test_recipe:
          setup:
            - "empty database, logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "Metro FD 2024-2029 Apparatus", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 3, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id / meta.api_request_timestamp present"
            - "data.name == \"Metro FD 2024-2029 Apparatus\", data.agency_name == \"Metro Fire District\", data.base_year == 2024, data.base_unit_price_cents == 62500000, data.escalation_index_pct_per_year == 4.0, data.max_option_units == 3, data.contract_ceiling_cents == 400000000"
            - "data.status == \"DRAFT\", data.committed_cents == 0, data.options_exercised_count == 0, data.suspension_reason == null"
            - "data.id is a bare UUID with no type prefix, data.version == 1, data.created_at == \"2026-08-01T00:00:00.000Z\" and data.updated_at == data.created_at"

      - name: program_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints[GET /programs/{program_id}]
          - entities.ApparatusProgram
        distinguishing_aspect: |
          The single-resource read returns exactly the persisted row — same id,
          same version, same computed fields — and is readable by every one of the
          five roles because all GETs are shared operations.
        test_recipe:
          setup:
            - "one ApparatusProgram in status DRAFT"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Metro FD 2024-2029 Apparatus", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 3, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "GET /programs/${prog_id}"
              as: ThirdPartyTester
              as_user_id: "tester-1"
          assert:
            - "both reads return HTTP 200 with data.id == ${prog_id}, data.status == \"DRAFT\", data.committed_cents == 0 and data.version == 1"
            - "reading does not mutate: data.updated_at is unchanged and data.version stays 1 after both calls"

      - name: program_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /programs]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list envelope pins limit/offset/total_count/has_more against three
          rows: limit 2 offset 0 yields two items with has_more true, offset 2
          yields the last item with has_more false, and total_count stays 3 in both
          pages. Ordering is created_at ASC, never by id.
        test_recipe:
          setup:
            - "three ApparatusProgram rows created in this order: Alpha, Bravo, Charlie"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Alpha program", agency_name: "Alpha Fire", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { alpha_id: $.data.id }
            - call: "POST /programs"
              payload: { name: "Bravo program", agency_name: "Bravo Fire", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { bravo_id: $.data.id }
            - call: "POST /programs"
              payload: { name: "Charlie program", agency_name: "Charlie Fire", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { charlie_id: $.data.id }
            - call: "POST /programs/${bravo_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /programs?limit=2&offset=0"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { first_page_first_id: "$.data[0].id" }
            - call: "GET /programs?limit=2&offset=2"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { second_page_first_id: "$.data[0].id" }
            - call: "GET /programs?status=ACTIVE"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { active_first_id: "$.data[0].id" }
          assert:
            - "page one: response_type == \"array\", 2 items, meta/pagination reports limit == 2, offset == 0, total_count == 3, has_more == true"
            - "page one is ordered created_at ASC: ${first_page_first_id} == ${alpha_id} and the second item is ${bravo_id}"
            - "page two: 1 item (${second_page_first_id} == ${charlie_id}), limit == 2, offset == 2, total_count == 3, has_more == false"
            - "the status filter returns exactly 1 item with ${active_first_id} == ${bravo_id} and total_count == 1"
            - "an unfiltered GET /programs applies the declared defaults limit == 10 and offset == 0 and returns all 3 rows with has_more == false"

      - name: all_entity_reads_return_not_found_for_unknown_uuid
        claim_type: Not Found
        grounds:
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_SPECIFICATION_NOT_FOUND
          - errors.ERR_CLAUSE_NOT_FOUND
          - errors.ERR_COMPLIANCE_ENTRY_NOT_FOUND
          - errors.ERR_UNIT_ORDER_NOT_FOUND
          - errors.ERR_SLOT_LINE_NOT_FOUND
          - errors.ERR_RESERVATION_NOT_FOUND
          - errors.ERR_PLANT_BAY_NOT_FOUND
          - errors.ERR_INSPECTION_TRIP_NOT_FOUND
          - errors.ERR_CHANGE_ORDER_NOT_FOUND
          - errors.ERR_CERTIFICATION_TEST_NOT_FOUND
          - errors.ERR_WARRANTY_STARTUP_NOT_FOUND
        distinguishing_aspect: |
          Each of the twelve single-resource reads maps to its OWN 404 error_id —
          a generic ERR_NOT_FOUND or a 200 with null data both fail this corner —
          and the error envelope carries response_type "error".
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /programs/00000000-0000-0000-0000-000000000001"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e1: $.data.error_id }
            - call: "GET /specifications/00000000-0000-0000-0000-000000000002"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e2: $.data.error_id }
            - call: "GET /clauses/00000000-0000-0000-0000-000000000003"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e3: $.data.error_id }
            - call: "GET /compliance-entries/00000000-0000-0000-0000-000000000004"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e4: $.data.error_id }
            - call: "GET /unit-orders/00000000-0000-0000-0000-000000000005"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e5: $.data.error_id }
            - call: "GET /slot-lines/00000000-0000-0000-0000-000000000006"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e6: $.data.error_id }
            - call: "GET /chassis-reservations/00000000-0000-0000-0000-000000000007"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e7: $.data.error_id }
            - call: "GET /plant-bays/00000000-0000-0000-0000-000000000008"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e8: $.data.error_id }
            - call: "GET /inspection-trips/00000000-0000-0000-0000-000000000009"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e9: $.data.error_id }
            - call: "GET /change-orders/00000000-0000-0000-0000-00000000000a"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e10: $.data.error_id }
            - call: "GET /certification-tests/00000000-0000-0000-0000-00000000000b"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e11: $.data.error_id }
            - call: "GET /warranty-startups/00000000-0000-0000-0000-00000000000c"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e12: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with response_type == \"error\""
            - "${e1} == ERR_PROGRAM_NOT_FOUND, ${e2} == ERR_SPECIFICATION_NOT_FOUND, ${e3} == ERR_CLAUSE_NOT_FOUND, ${e4} == ERR_COMPLIANCE_ENTRY_NOT_FOUND"
            - "${e5} == ERR_UNIT_ORDER_NOT_FOUND, ${e6} == ERR_SLOT_LINE_NOT_FOUND, ${e7} == ERR_RESERVATION_NOT_FOUND, ${e8} == ERR_PLANT_BAY_NOT_FOUND"
            - "${e9} == ERR_INSPECTION_TRIP_NOT_FOUND, ${e10} == ERR_CHANGE_ORDER_NOT_FOUND, ${e11} == ERR_CERTIFICATION_TEST_NOT_FOUND, ${e12} == ERR_WARRANTY_STARTUP_NOT_FOUND"
            - "each error body carries a non-empty data.message and no business fields"

      - name: unit_order_missing_required_fields_rejected
        claim_type: Required Fields
        grounds:
          - endpoints[POST /unit-orders]
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: |
          Every POST /unit-orders input without a `?` suffix is mandatory: omitting
          gvwr_kg, or weight_calc_engineer_user_id, or crew_seat_count each yields
          400 ERR_INVALID_REQUEST before any FK lookup or fiscal check runs, and
          nothing is persisted.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE with one RELEASED specification"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Metro FD 2024-2029 Apparatus", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 3, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Pumper spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
          trigger:
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { err_no_gvwr: $.data.error_id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4 }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { err_no_engineer: $.data.error_id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { err_no_crew: $.data.error_id }
          assert:
            - "all three calls return HTTP 400 with ${err_no_gvwr} == ${err_no_engineer} == ${err_no_crew} == ERR_INVALID_REQUEST"
            - "GET /unit-orders?program_id=${prog_id} returns total_count == 0 — no partial row was written"
            - "ApparatusProgram.${prog_id}.committed_cents == 0 and version is unchanged by the three rejections"

      - name: slot_line_and_clause_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.SupplierSlotLine.fields.changeover_buffer_days
          - entities.SpecClause.fields.mandatory
          - entities.SpecClause.fields.is_restrictive
        distinguishing_aspect: |
          Three optional inputs carry declared defaults that must be materialised
          server-side when omitted: changeover_buffer_days 7 on SupplierSlotLine,
          mandatory true and is_restrictive false on SpecClause — note mandatory
          defaults to TRUE, the less obvious direction.
        test_recipe:
          setup:
            - "one ApparatusProgram and one DRAFT BidSpecification"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Defaults program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Defaults spec" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
          trigger:
            - call: "POST /slot-lines"
              payload: { supplier_name: "Freightline Custom Chassis", component_type: "CHASSIS", total_slot_count: 3 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_id: $.data.id, buffer: $.data.changeover_buffer_days }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "D1", category: "ELECTRICAL", requirement_text: "Load manager required" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { clause_id: $.data.id }
          assert:
            - "SupplierSlotLine.${line_id}.changeover_buffer_days == 7 (${buffer} == 7), reserved_slot_count == 0 and available_slot_count == 3"
            - "SpecClause.${clause_id}.mandatory == true and is_restrictive == false"
            - "BidSpecification.${spec_id}.clause_count == 1, mandatory_clause_count == 1 and restrictive_clause_ratio_pct == 0.00"
            - "BidSpecification.${spec_id}.compliance_score_strict == 0.00 and compliance_score_provisional == 0.00 (a clause with no entry is non-compliant in both variants)"

      - name: unit_order_computed_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.UnitOrder.fields.price_cents
          - entities.UnitOrder.fields.weight_status
          - entities.UnitOrder.fields.rear_axle_load_kg
          - calculations.unit_award_price
          - calculations.axle_load_distribution
        distinguishing_aspect: |
          price_cents, the three axle loads, weight_status, change_order_total_cents
          and open_change_order_count are computed: values for them in the request
          body are ignored and the server's own formulas win (68276000 and
          5810/10110/15920 WITHIN_LIMITS), not the client's 1 and OVER_GVWR.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE (base_year 2024, base_unit_price_cents 62500000, index 4.0) with one RELEASED specification"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Metro FD 2024-2029 Apparatus", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 3, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Pumper spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
          trigger:
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1", price_cents: 1, front_axle_load_kg: 1, rear_axle_load_kg: 1, gross_weight_kg: 1, weight_status: "OVER_GVWR", change_order_total_cents: 999, open_change_order_count: 7, build_status: "DELIVERED" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_id: $.data.id }
          assert:
            - "the call is admitted 201 and the client-supplied computed values are discarded"
            - "UnitOrder.${unit_id}.price_cents == 68276000, front_axle_load_kg == 5810, rear_axle_load_kg == 10110, gross_weight_kg == 15920, weight_status == \"WITHIN_LIMITS\""
            - "UnitOrder.${unit_id}.change_order_total_cents == 0 and open_change_order_count == 0"
            - "UnitOrder.${unit_id}.build_status == \"SPEC_LOCKED\" (the system-owned initial state, not the supplied DELIVERED)"
            - "ApparatusProgram.${prog_id}.committed_cents == 68276000"

      - name: program_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.ApparatusProgram.fields.status
          - entities.ApparatusProgram.fields.options_exercised_count
          - endpoints[POST /programs]
        distinguishing_aspect: |
          id, created_at, updated_at, version, status, suspension_reason and
          options_exercised_count are server-minted: a create body carrying all of
          them must be admitted with the server's own values, including a fresh
          UUID different from the supplied one.
        test_recipe:
          setup:
            - "empty database, logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "System field program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 3, contract_ceiling_cents: 400000000, id: "11111111-1111-1111-1111-111111111111", created_at: "2001-01-01T00:00:00.000Z", updated_at: "2001-01-01T00:00:00.000Z", version: 99, status: "CLOSED", suspension_reason: "MANUAL", options_exercised_count: 5, committed_cents: 12345 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201 and data.id != \"11111111-1111-1111-1111-111111111111\""
            - "data.created_at == \"2026-08-01T00:00:00.000Z\" (the logical clock), not the supplied 2001 timestamp, and data.version == 1"
            - "data.status == \"DRAFT\", data.suspension_reason == null, data.options_exercised_count == 0, data.committed_cents == 0"
            - "GET /programs/${prog_id} returns the same server-minted values, confirming they were persisted rather than merely echoed"

      - name: unit_order_enum_and_range_constraints_rejected
        claim_type: Type Constraints
        grounds:
          - entities.UnitOrder.fields.unit_type
          - entities.UnitOrder.fields.crew_seat_count
          - entities.UnitOrder.fields.gvwr_kg
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Enum membership and numeric ranges are enforced at the request-shape
          layer (400), never silently coerced: unit_type TANKER, crew_seat_count 9
          against the 0..8 range, and gvwr_kg 3999 against the 4000..40000 range
          are all ERR_INVALID_REQUEST, while crew_seat_count 8 and gvwr_kg 4000 at
          the exact range edges are admitted.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE with one RELEASED specification"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Constraint program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 3, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Ambulance spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PATIENT_COMPARTMENT", requirement_text: "Type I module", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
          trigger:
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "TANKER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { err_enum: $.data.error_id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 9, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { err_crew: $.data.error_id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "AMBULANCE", award_year: 2026, gvwr_kg: 3999, front_axle_rating_kg: 2600, rear_axle_rating_kg: 3800, base_curb_front_kg: 2100, base_curb_rear_kg: 3080, crew_seat_count: 2, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { err_gvwr: $.data.error_id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "AMBULANCE", award_year: 2026, gvwr_kg: 4000, front_axle_rating_kg: 2000, rear_axle_rating_kg: 2600, base_curb_front_kg: 1000, base_curb_rear_kg: 1400, crew_seat_count: 8, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { edge_unit_id: $.data.id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 400 — TANKER is not a member of {PUMPER, AERIAL, AMBULANCE}"
            - "${err_crew} == ERR_INVALID_REQUEST with HTTP 400 — crew_seat_count 9 is outside 0..8"
            - "${err_gvwr} == ERR_INVALID_REQUEST with HTTP 400 — gvwr_kg 3999 is outside 4000..40000"
            - "the edge-value call is ADMITTED 201: both crew_seat_count == 8 and gvwr_kg == 4000 sit exactly on their declared bounds"
            - "UnitOrder.${edge_unit_id}: payload == min(900, floor(4000 * 20 / 100) == 800) == 800, front_axle_load_kg == 1000 + 200 + 160 == 1360, rear_axle_load_kg == 1400 + 600 + 480 == 2480, gross_weight_kg == 3840, weight_status == \"WITHIN_LIMITS\""
            - "GET /unit-orders?program_id=${prog_id} returns total_count == 1 — only the edge-value unit persisted"

      - name: immutable_entities_carry_no_version_or_updated_at
        claim_type: Immutability
        grounds:
          - entities.PlantBay
          - entities.SpecClause
        distinguishing_aspect: |
          PlantBay and SpecClause are declared common_fields: false, so their rows
          expose only id and created_at — no version, no updated_at — and the §1.5
          surface offers no PUT/PATCH/DELETE for either; every downstream mutation
          happens on other entities.
        test_recipe:
          setup:
            - "one ApparatusProgram and one DRAFT BidSpecification"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Immutability program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Immutability spec" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
          trigger:
            - call: "POST /plant-bays"
              payload: { name: "Bay Z", max_concurrent_visitors: 12 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { bay_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "Z1", category: "PAINT", requirement_text: "Two tone paint", mandatory: false, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { clause_id: $.data.id }
            - call: "GET /plant-bays/${bay_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /clauses/${clause_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "PlantBay.${bay_id} exposes id, created_at, name and max_concurrent_visitors only — no version and no updated_at key"
            - "SpecClause.${clause_id} exposes id, created_at, specification_id, clause_code, category, requirement_text, mandatory, is_restrictive only — no version and no updated_at key"
            - "created_at == \"2026-08-01T00:00:00.000Z\" on both rows"
            - "the §1.5 endpoint table declares no update or delete route for either entity, so an immutable row can never diverge from its creation payload"

      - name: unit_order_foreign_keys_validated_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_SPECIFICATION_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so parenthood is expressed by validated foreign
          keys rather than nested routes: an unknown program_id and an unknown
          specification_id each resolve to their OWN 404 at priority 5, ahead of
          every state, safety and fiscal rule.
        test_recipe:
          setup:
            - "one ACTIVE ApparatusProgram with one RELEASED specification"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "FK program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "FK spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
          trigger:
            - call: "POST /unit-orders"
              payload: { program_id: "00000000-0000-0000-0000-0000000000ff", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { err_prog: $.data.error_id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "00000000-0000-0000-0000-0000000000fe", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { err_spec: $.data.error_id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "00000000-0000-0000-0000-0000000000fd", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { err_clause: $.data.error_id }
          assert:
            - "${err_prog} == ERR_PROGRAM_NOT_FOUND with HTTP 404"
            - "${err_spec} == ERR_SPECIFICATION_NOT_FOUND with HTTP 404, even though award_year 2026 would also have been checked against a real program's base_year later in the ladder"
            - "${err_clause} == ERR_CLAUSE_NOT_FOUND with HTTP 404 (priority 5 runs before the priority-10 specification-state check that would also have rejected this RELEASED spec)"
            - "GET /unit-orders returns total_count == 0 and BidSpecification.${spec_id}.compliance_score_strict == 100.00, unchanged by the rejected entry"

      - name: compliance_entry_creation_records_responder_and_pending_disposition
        claim_type: Creation
        grounds:
          - entities.ComplianceMatrixEntry
          - endpoints[POST /compliance-entries]
          - errors.ERR_DUPLICATE_COMPLIANCE_ENTRY
        distinguishing_aspect: |
          A compliance response captures the acting BodyEngineer's X-User-ID in
          responded_by_user_id and starts at disposition PENDING with a null
          disposition_note; the (specification_id, clause_id) pair is unique, so a
          second response on the same clause is 409 ERR_DUPLICATE_COMPLIANCE_ENTRY.
        test_recipe:
          setup:
            - "one ApparatusProgram and one DRAFT BidSpecification with one mandatory clause"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Matrix program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Matrix spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "AERIAL", requirement_text: "105 ft rear mount aerial", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "EXCEPTION", exception_text: "Offering 100 ft rear mount" }
              as: BodyEngineer
              as_user_id: "eng-7"
              captures: { entry_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-7"
              captures: { dup_err: $.data.error_id }
          assert:
            - "HTTP 201 with ComplianceMatrixEntry.${entry_id}.response == \"EXCEPTION\", exception_text == \"Offering 100 ft rear mount\", disposition == \"PENDING\", disposition_note == null"
            - "ComplianceMatrixEntry.${entry_id}.responded_by_user_id == \"eng-7\" (taken from X-User-ID, never from the body) and version == 1"
            - "BidSpecification.${spec_id}.compliance_score_strict == 0.00 and compliance_score_provisional == 100.00 — a PENDING exception is optimistic-only"
            - "${dup_err} == ERR_DUPLICATE_COMPLIANCE_ENTRY with HTTP 409 and GET /compliance-entries?clause_id=${c1_id} returns total_count == 1"

  - section: state_machines
    instances:

      - name: program_lifecycle_manual_suspension_and_reactivation
        claim_type: Valid Transition
        grounds:
          - state_machines.ApparatusProgram.DRAFT_to_ACTIVE
          - state_machines.ApparatusProgram.ACTIVE_to_SUSPENDED_manual
          - state_machines.ApparatusProgram.SUSPENDED_to_ACTIVE
          - entities.ApparatusProgram.fields.suspension_reason
        distinguishing_aspect: |
          The three operator-driven program hops each set suspension_reason to a
          specific value — null on activate, MANUAL on suspend, null again on
          reactivate — and each bumps version by exactly 1, so version reaches 4
          after three transitions.
        test_recipe:
          setup:
            - "one ApparatusProgram in DRAFT with no units, so the soft-ceiling guard on reactivate is satisfied at committed_cents 0"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Lifecycle program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/suspend"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/reactivate"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "after activate: HTTP 200, ApparatusProgram.${prog_id}.status == \"ACTIVE\", suspension_reason == null, version == 2"
            - "after suspend: status == \"SUSPENDED\", suspension_reason == \"MANUAL\", version == 3"
            - "after reactivate: status == \"ACTIVE\", suspension_reason == null, version == 4"
            - "committed_cents stays 0 across all three hops and created_at is unchanged"

      - name: program_initial_state_and_duplicate_activate_rejected
        claim_type: Initial State
        grounds:
          - state_machines.ApparatusProgram.initial_state
          - validations[priority=9]
          - errors.ERR_INVALID_PROGRAM_STATE
        distinguishing_aspect: |
          A freshly created program is in the declared initial_state DRAFT, and
          activate is single-shot: the second activate is 409
          ERR_INVALID_PROGRAM_STATE and leaves version at 2, proving the rejected
          call performed no write.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Idempotency program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { dup_err: $.data.error_id }
            - call: "POST /programs/${prog_id}/reactivate"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { react_err: $.data.error_id }
          assert:
            - "the read shows status == \"DRAFT\" and version == 1 — the declared initial_state"
            - "the first activate returns 200 with status == \"ACTIVE\" and version == 2"
            - "${dup_err} == ERR_INVALID_PROGRAM_STATE with HTTP 409, and ApparatusProgram.${prog_id}.version is still 2"
            - "${react_err} == ERR_INVALID_PROGRAM_STATE with HTTP 409 — reactivate requires SUSPENDED, not ACTIVE"

      - name: closed_program_rejects_every_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ApparatusProgram.terminal_states
          - state_machines.ApparatusProgram.ACTIVE_to_CLOSED
          - validations[priority=9]
        distinguishing_aspect: |
          CLOSED is terminal: activate, suspend, reactivate, close and even the
          ops-run sweep are all rejected 409 ERR_INVALID_PROGRAM_STATE afterwards,
          and the program's version stays frozen at the value the close produced.
        test_recipe:
          setup:
            - "one ApparatusProgram with zero UnitOrder rows, so the priority-50 all-units-terminal guard on close is vacuously satisfied"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Closure program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /programs/${prog_id}/close"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_activate: $.data.error_id }
            - call: "POST /programs/${prog_id}/suspend"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_suspend: $.data.error_id }
            - call: "POST /programs/${prog_id}/reactivate"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_reactivate: $.data.error_id }
            - call: "POST /programs/${prog_id}/close"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_close: $.data.error_id }
            - call: "POST /programs/${prog_id}/ops-run"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_ops: $.data.error_id }
          assert:
            - "the close returns 200 with status == \"CLOSED\" and version == 3"
            - "${e_activate} == ${e_suspend} == ${e_reactivate} == ${e_close} == ERR_INVALID_PROGRAM_STATE, all HTTP 409"
            - "${e_ops} == ERR_INVALID_PROGRAM_STATE with HTTP 409 — the sweep runs only from ACTIVE or SUSPENDED"
            - "ApparatusProgram.${prog_id}.version is still 3 after all five rejections and status is still \"CLOSED\""

      - name: specification_review_cycle_and_clause_write_window
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.BidSpecification.DRAFT_to_UNDER_REVIEW
          - state_machines.BidSpecification.UNDER_REVIEW_to_DRAFT
          - validations[priority=10]
          - validations[priority=44]
          - errors.ERR_SPEC_HAS_NO_CLAUSES
          - errors.ERR_INVALID_SPEC_STATE
        distinguishing_aspect: |
          Clause and compliance writes are legal only while the specification is
          DRAFT, and review entry additionally requires clause_count >= 1: an empty
          specification is rejected 422 ERR_SPEC_HAS_NO_CLAUSES, and once
          UNDER_REVIEW both POST clauses and POST /compliance-entries turn into 409
          ERR_INVALID_SPEC_STATE until rework returns the row to DRAFT.
        test_recipe:
          setup:
            - "one ApparatusProgram and one BidSpecification in DRAFT with zero clauses"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Review cycle program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Review cycle spec" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
          trigger:
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { empty_err: $.data.error_id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C2", category: "ELECTRICAL", requirement_text: "Load manager required", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { clause_err: $.data.error_id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { entry_err: $.data.error_id }
            - call: "POST /specifications/${spec_id}/rework"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/rework"
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { rework_err: $.data.error_id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C2", category: "ELECTRICAL", requirement_text: "Load manager required", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c2_id: $.data.id }
          assert:
            - "${empty_err} == ERR_SPEC_HAS_NO_CLAUSES with HTTP 422 and BidSpecification.${spec_id}.status stays \"DRAFT\" at version 1"
            - "after the first clause: clause_count == 1, mandatory_clause_count == 1, restrictive_clause_ratio_pct == 0.00, version == 2"
            - "the second submit-review returns 200 with status == \"UNDER_REVIEW\" and version == 3"
            - "${clause_err} == ERR_INVALID_SPEC_STATE with HTTP 409 and clause_count is still 1"
            - "${entry_err} == ERR_INVALID_SPEC_STATE with HTTP 409 — compliance responses are DRAFT-only writes"
            - "rework returns 200 with status == \"DRAFT\" and version == 4"
            - "${rework_err} == ERR_INVALID_SPEC_STATE with HTTP 409 — rework requires UNDER_REVIEW"
            - "the final clause add is admitted 201 with SpecClause.${c2_id}.clause_code == \"C2\" and BidSpecification.${spec_id}.clause_count == 2 at version 5"

      - name: compliance_disposition_is_single_shot_and_rescores_both_variants
        claim_type: Idempotency
        grounds:
          - state_machines.ComplianceMatrixEntry.PENDING_to_ACCEPTED
          - state_machines.ComplianceMatrixEntry.terminal_states
          - validations[priority=11]
          - errors.ERR_INVALID_ENTRY_STATE
          - calculations.compliance_readiness_score
        distinguishing_aspect: |
          A disposition may be written exactly once and only while the parent
          specification is DRAFT: accepting one of two PENDING exceptions moves
          compliance_score_strict from 0.00 to 50.00 (weight 3 of 6) while
          provisional stays 100.00, a second dispose on the same entry is 409
          ERR_INVALID_ENTRY_STATE, and after submit-review the still-PENDING sibling
          entry is 409 as well.
        test_recipe:
          setup:
            - "one BidSpecification in DRAFT with two mandatory clauses, each answered EXCEPTION and therefore PENDING"
          setup_api_calls:
            - call: "POST /programs"
