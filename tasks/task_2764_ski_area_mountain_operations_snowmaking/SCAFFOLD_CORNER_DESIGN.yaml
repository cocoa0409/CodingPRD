            - "Trigger 1: admitted_guest_count == 0, non_season_admitted_count == 0, waitlisted_guest_count == 0, parking_stalls_total == 500, parking_stalls_used == 0, held_area_count == 0, wind_held_lift_count == 0, mech_held_lift_count == 0."
            - "Trigger 6: byte-identical numbers to trigger 1 - a STANDBY lift contributes no capacity, so open_lift_capacity_pph is still 750 and raw_ccc still 450."
            - "Trigger 8: open_lift_capacity_pph == 810, raw_ccc == 486, and crowding_density 486 / 18.0 == 27.0 > 25.0 fires the reduction: guest_capacity == 413 (floor(486 * 0.85) == floor(413.1)) and non_season_pool == 289 (floor(413 * 0.70) == floor(289.1))."
