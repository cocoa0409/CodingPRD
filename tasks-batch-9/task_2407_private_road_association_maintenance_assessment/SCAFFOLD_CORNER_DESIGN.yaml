        excluded_because:
          difficulty_instance: reserve_draw_equal_to_balance_allowed_then_underfunded_gate_blocks_next_award
          rationale: "ERR_RESERVE_UNDERFUNDED is triggered there on a CULVERT award with an UNDERFUNDED posture, and that instance also proves the response is not ERR_INSUFFICIENT_RESERVE."

