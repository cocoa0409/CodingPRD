scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (two entity domains: FeeWaiverRequest fiscal
  # tier vs Applicant readiness scoring)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_waiver_provisional_vs_verified_tier
        grounds:
          - calculations.fee_waiver_tier
          - entities.FeeWaiverRequest.fields.provisional_tier
          - entities.FeeWaiverRequest.fields.final_tier
        distinguishing_aspect: |
          Dual-variant calculation on the FeeWaiverRequest (fiscal domain): the SAME
          formula runs on self-reported inputs at creation (provisional) and on
          documented inputs at decide (verified); for identical request structure the
          two variants yield different tiers (FULL vs PARTIAL) because the documented
          income differs from the self-reported income.
        test_recipe:
          setup:
            - "Program with default constants; applicant with an ACTIVE ELIGIBLE screening (res 61, pres 1000, eng 3, civ 25, no legal flag)"
            - "FeeWaiverRequest created with household_size=1, self_reported_income_cents=2000000 (FULL provisional), then submitted with 2 documents, then decided APPROVED with documented_income_cents=2600000"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Ana Paz", email: "ana@x.com", date_of_birth: "1986-04-02" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 40, english_level: 3, civics_practice_pct: 25, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/applicants/${app_id}/fee-waiver-requests"
              payload: { household_size: 1, self_reported_income_cents: 2000000, self_reported_benefit: false }
              as: IntakeCoordinator
              captures: { fwr_id: $.data.id }
            - call: "POST /naturalization/fee-waiver-requests/${fwr_id}/submit"
              payload: { attached_document_count: 2 }
              as: IntakeCoordinator
          trigger:
            - call: "POST /naturalization/fee-waiver-requests/${fwr_id}/decide"
              payload: { decision: APPROVED, documented_income_cents: 2600000, documented_benefit: false }
              as: ProgramAdmin
          assert:
            - "FeeWaiverRequest.${fwr_id}.provisional_tier == FULL (2000000*100 <= 1565000*150)"
            - "FeeWaiverRequest.${fwr_id}.final_tier == PARTIAL (2600000*100 > 234750000 but <= 313000000)"
            - "FeeWaiverRequest.${fwr_id}.status == APPROVED"
            - "provisional_tier != final_tier for the same request row"

      - name: readiness_attained_vs_projected
        grounds:
          - calculations.readiness_score
          - entities.Applicant.fields.stage
        distinguishing_aspect: |
          Dual-variant calculation on the Applicant (readiness domain, not fiscal):
          attained counts only realized evidence while projected is forward-looking
          (active enrollment bumps english level +1 capped at 4; a SCHEDULED mock
          floors civics at 70) — identical underlying rows, scores 80 vs 94.
        test_recipe:
          setup:
            - "Program defaults; applicant with ACTIVE ELIGIBLE screening (eng 3, civ 25, res 61, pres 1000, no legal flag)"
            - "GENERAL instructor volunteer; one section (capacity 2, 10 sessions); applicant ENROLLED"
            - "one SCHEDULED mock interview for the applicant with the instructor"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Ana Paz", email: "ana@x.com", date_of_birth: "1986-04-02" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 40, english_level: 3, civics_practice_pct: 25, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Vic Torres", email: "vic@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vol_id}/training-credits"
              payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vol_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/class-sections"
              payload: { title: "Civics AM", weekday: "MON", start_minute: 600, end_minute: 660, room_id: "R1", instructor_volunteer_id: "${vol_id}", capacity: 2, total_sessions: 10 }
              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${app_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v}" }
              as: IntakeCoordinator
            - call: "POST /naturalization/mock-interviews"
              payload: { applicant_id: "${app_id}", volunteer_id: "${vol_id}", scheduled_start: "2026-08-10T15:00:00Z", duration_minutes: 30 }
              as: IntakeCoordinator
          trigger:
            - call: "GET /naturalization/applicants/${app_id}/readiness"
              payload: { variant: "attained" }
              as: IntakeCoordinator
              captures: { score_att: $.data.score }
            - call: "GET /naturalization/applicants/${app_id}/readiness"
              payload: { variant: "projected" }
              as: IntakeCoordinator
              captures: { score_proj: $.data.score }
          assert:
            - "attained score == 80 (25 residence + 25 presence + 15 english level3 + 5 civics 25pct + 10 legal-clear)"
            - "projected score == 94 (english bumped to level 4 -> 20 pts; civics floored at 70 -> 14 pts)"
            - "attained score != projected score for identical underlying data"

  # ===================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c all exercised)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_waiver_household_size_income_benefit_interaction
        grounds:
          - calculations.fee_waiver_tier
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: tiered-rate selection
          driven by household-size-dependent guideline, with a conditional branch on
          the benefit flag. Household of 4 at income 4822500 cents is exactly FULL;
          one cent more is PARTIAL; a household of 1 with benefit=true is FULL at any
          income.
        test_recipe:
          setup:
            - "Program defaults; three applicants each with ACTIVE ELIGIBLE screening"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A Four", email: "a4@x.com", date_of_birth: "1980-01-01" }
              as: IntakeCoordinator
              captures: { a4_id: $.data.id, a4_v: $.data.version }
            - call: "POST /naturalization/applicants/${a4_id}/screenings"
              payload: { expected_applicant_version: "${a4_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 46, english_level: 2, civics_practice_pct: 40, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/applicants"
              payload: { full_name: "B Four", email: "b4@x.com", date_of_birth: "1981-01-01" }
              as: IntakeCoordinator
              captures: { b4_id: $.data.id, b4_v: $.data.version }
            - call: "POST /naturalization/applicants/${b4_id}/screenings"
              payload: { expected_applicant_version: "${b4_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 45, english_level: 2, civics_practice_pct: 40, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/applicants"
              payload: { full_name: "C Ben", email: "cb@x.com", date_of_birth: "1979-01-01" }
              as: IntakeCoordinator
              captures: { cb_id: $.data.id, cb_v: $.data.version }
            - call: "POST /naturalization/applicants/${cb_id}/screenings"
              payload: { expected_applicant_version: "${cb_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 47, english_level: 2, civics_practice_pct: 40, has_legal_flag: false }
              as: IntakeCoordinator
          trigger:
            - call: "POST /naturalization/applicants/${a4_id}/fee-waiver-requests"
              payload: { household_size: 4, self_reported_income_cents: 4822500, self_reported_benefit: false }
              as: IntakeCoordinator
              captures: { fwr_a: $.data.id }
            - call: "POST /naturalization/applicants/${b4_id}/fee-waiver-requests"
              payload: { household_size: 4, self_reported_income_cents: 4822501, self_reported_benefit: false }
              as: IntakeCoordinator
              captures: { fwr_b: $.data.id }
            - call: "POST /naturalization/applicants/${cb_id}/fee-waiver-requests"
              payload: { household_size: 1, self_reported_income_cents: 9999900, self_reported_benefit: true }
              as: IntakeCoordinator
              captures: { fwr_c: $.data.id }
          assert:
            - "FeeWaiverRequest.${fwr_a}.provisional_tier == FULL (guideline 3215000, 4822500*100 <= 3215000*150 exactly)"
            - "FeeWaiverRequest.${fwr_b}.provisional_tier == PARTIAL (one cent over the FULL cap, still <= 200 pct)"
            - "FeeWaiverRequest.${fwr_c}.provisional_tier == FULL (benefit branch overrides income)"
            - "FeeWaiverRequest.${fwr_c}.required_document_count == 2 (benefit-based doc rule)"

      - name: filing_fee_partial_per_line_rounding_order
        grounds:
          - calculations.filing_fee_total
          - state_machines.ApplicationPacket.IN_LEGAL_REVIEW_to_CERTIFIED
        distinguishing_aspect: |
          Mode (b) — nested rounding order: PARTIAL tier discounts each fee line by
          50% with round_half_up per line THEN sums (38000 + 4251 + 1501 = 43752);
          the alternative sum-then-round order yields 43751 and is explicitly NOT the
          spec. The pinned order is observable on the certified packet.
        test_recipe:
          setup:
            - "Program defaults (fees 76000 / 8501 / 3001); applicant with ELIGIBLE screening (attained readiness 80)"
            - "GENERAL instructor Vp (preparer), LEGAL supervisor Vs (bar path), LEGAL certifier Vc (bar path)"
            - "Workshop supervised by Vs held at 2026-08-05T10:00:00Z; applicant's seat ATTENDED"
            - "FeeWaiverRequest APPROVED with final_tier PARTIAL (income 2800000, household 1)"
            - "Packet created from the attended seat, prepared by Vp, linked to the waiver; submitted to review"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Ana Paz", email: "ana@x.com", date_of_birth: "1986-04-02" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 40, english_level: 3, civics_practice_pct: 25, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Prep Vol", email: "vp@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vp_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vp_id}/training-credits"
              payload: { topic: "forms", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vp_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Sup Vol", email: "vs@x.com", background_check_cleared: true, bar_number: "BAR111" }
              as: ProgramAdmin
              captures: { vs_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vs_id}/training-credits"
              payload: { topic: "ethics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vs_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vs_id}/accredit"
              payload: { target_level: LEGAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Cert Vol", email: "vc@x.com", background_check_cleared: true, bar_number: "BAR222" }
              as: ProgramAdmin
              captures: { vc_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vc_id}/training-credits"
              payload: { topic: "ethics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vc_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vc_id}/accredit"
              payload: { target_level: LEGAL }
              as: ProgramAdmin
            - call: "POST /naturalization/workshops"
              payload: { title: "N-400 Workshop", supervising_volunteer_id: "${vs_id}", scheduled_start: "2026-08-05T10:00:00Z", duration_hours: 3, capacity: 5 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id, ws_v: $.data.version }
            - call: "POST /naturalization/workshops/${ws_id}/seats"
              payload: { applicant_id: "${app_id}", expected_workshop_version: "${ws_v}" }
              as: IntakeCoordinator
              captures: { seat_id: $.data.id }
            - { call: "POST /naturalization/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ProgramAdmin }
            - call: "POST /naturalization/workshops/${ws_id}/complete"
              payload: {}
              as: Volunteer
              as_user_id: "${vs_id}"
            - call: "POST /naturalization/applicants/${app_id}/fee-waiver-requests"
              payload: { household_size: 1, self_reported_income_cents: 2800000, self_reported_benefit: false }
              as: IntakeCoordinator
              captures: { fwr_id: $.data.id }
            - call: "POST /naturalization/fee-waiver-requests/${fwr_id}/submit"
              payload: { attached_document_count: 2 }
              as: IntakeCoordinator
            - call: "POST /naturalization/fee-waiver-requests/${fwr_id}/decide"
              payload: { decision: APPROVED, documented_income_cents: 2800000, documented_benefit: false }
              as: ProgramAdmin
            - call: "POST /naturalization/applicants/${app_id}/packets"
              payload: { workshop_seat_id: "${seat_id}", prepared_by_volunteer_id: "${vp_id}", fee_waiver_request_id: "${fwr_id}" }
              as: IntakeCoordinator
              captures: { pkt_id: $.data.id }
            - call: "POST /naturalization/packets/${pkt_id}/submit-review"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /naturalization/packets/${pkt_id}/certify"
              payload: {}
              as: Volunteer
              as_user_id: "${vc_id}"
          assert:
            - "ApplicationPacket.${pkt_id}.status == CERTIFIED"
            - "ApplicationPacket.${pkt_id}.filing_fee_cents == 43752 (per-line half-up 38000+4251+1501; NOT 43751 from sum-first)"
            - "ApplicationPacket.${pkt_id}.certified_by_volunteer_id == ${vc_id}"

      - name: seat_ledger_promotion_evaluation_order
        grounds:
          - calculations.seat_ledger
          - state_machines.Enrollment.WAITLISTED_to_PENDING_PROMOTION
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: pending
          promotions consume seats before availability is recomputed, and promotions
          are issued only while seats_open >= 1. When a seat frees, exactly one
          promotion is issued (lowest created_at first); a second waiting enrollment
          stays WAITLISTED even though enrolled_count dropped.
        test_recipe:
          setup:
            - "Program defaults; section capacity 1, 10 sessions; A ENROLLED; B and C WAITLISTED (B created before C)"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vol_id}/training-credits"
              payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vol_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/class-sections"
              payload: { title: "Evening", weekday: "TUE", start_minute: 1080, end_minute: 1140, room_id: "R2", instructor_volunteer_id: "${vol_id}", capacity: 1, total_sessions: 10 }
              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v1: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /naturalization/applicants/${a_id}/screenings"
              payload: { expected_applicant_version: "${a_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${a_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v1}" }
              as: IntakeCoordinator
              captures: { enr_a: $.data.id }
            - call: "GET /naturalization/class-sections/${sec_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { sec_v2: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "B Two", email: "b@x.com", date_of_birth: "1991-01-01" }
              as: IntakeCoordinator
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /naturalization/applicants/${b_id}/screenings"
              payload: { expected_applicant_version: "${b_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 35, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${b_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v2}" }
              as: IntakeCoordinator
              captures: { enr_b: $.data.id }
            - call: "GET /naturalization/class-sections/${sec_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { sec_v3: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "C Three", email: "c@x.com", date_of_birth: "1992-01-01" }
              as: IntakeCoordinator
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /naturalization/applicants/${c_id}/screenings"
              payload: { expected_applicant_version: "${c_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 34, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${c_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v3}" }
              as: IntakeCoordinator
              captures: { enr_c: $.data.id }
          trigger:
            - call: "POST /naturalization/enrollments/${enr_a}/withdraw"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "Enrollment.${enr_b}.status == PENDING_PROMOTION (lowest created_at among WAITLISTED wins the freed seat)"
            - "Enrollment.${enr_c}.status == WAITLISTED (pending promotion holds the seat: seats_open == 0 despite enrolled_count == 0)"
            - "ClassSection.${sec_id}.enrolled_count == 0 AND pending_promotion_count == 1 AND waitlisted_count == 1 AND seats_open == 0"
            - "Enrollment.${enr_b}.offer_expires_at == 2026-08-04T00:00:00Z (clock default + 72h)"

  # ===================================================================
  # Rule 3 — non_linear_state_machine (three different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: packet_revision_cycle
        grounds:
          - state_machines.ApplicationPacket
        distinguishing_aspect: |
          Cyclic machine on ApplicationPacket: DRAFT -> IN_LEGAL_REVIEW ->
          NEEDS_REVISION -> DRAFT -> IN_LEGAL_REVIEW -> CERTIFIED; the cycle can be
          traversed repeatedly and each pass increments version.
        test_recipe:
          setup:
            - "Packet in DRAFT for an applicant with ATTENDED workshop seat and APPROVED PARTIAL waiver; LEGAL certifier Vc != preparer Vp; attained readiness 80"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Ana Paz", email: "ana@x.com", date_of_birth: "1986-04-02" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 40, english_level: 3, civics_practice_pct: 25, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Prep Vol", email: "vp@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vp_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vp_id}/training-credits"
              payload: { topic: "forms", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vp_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Sup Vol", email: "vs@x.com", background_check_cleared: true, bar_number: "BAR111" }
              as: ProgramAdmin
              captures: { vs_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vs_id}/training-credits"
              payload: { topic: "ethics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vs_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vs_id}/accredit"
              payload: { target_level: LEGAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Cert Vol", email: "vc@x.com", background_check_cleared: true, bar_number: "BAR222" }
              as: ProgramAdmin
              captures: { vc_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vc_id}/training-credits"
              payload: { topic: "ethics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vc_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vc_id}/accredit"
              payload: { target_level: LEGAL }
              as: ProgramAdmin
            - call: "POST /naturalization/workshops"
