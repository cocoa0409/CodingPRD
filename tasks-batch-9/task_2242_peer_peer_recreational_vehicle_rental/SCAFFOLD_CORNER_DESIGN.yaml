      - name: confirm_without_wallet_funds_is_rejected_with_payment_required
        claim_type: error_triggerable
        grounds:
          - validations[priority 39]
          - errors[ERR_INSUFFICIENT_RENTER_FUNDS]
          - state_machines.Booking settlement_status
        distinguishing_aspect: >-
          The fiscal gate is the last rule in the ladder and uses 402, not 422:
          an unfunded but perfectly qualified renter may create and have the
          booking approved, then /confirm fails with 402 leaving trip_status at
          OWNER_APPROVED, settlement_status NONE, hold 0 and no ledger row
          — the hold is never partially taken.
        test_recipe:
          setup: >-
            Full canonical marketplace with NO wallet top-up; booking B1 created
            and owner-approved.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_booking
            - *k_bk_approve
          trigger:
            - call: "POST /rv-marketplace/bookings/${booking_id}/confirm"
              as: Renter
              as_user_id: "${renter_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response 402"
            - "data.error_id == 'ERR_INSUFFICIENT_RENTER_FUNDS'"
            - "GET /rv-marketplace/bookings/${booking_id} returns data.trip_status == 'OWNER_APPROVED'"
            - "GET /rv-marketplace/bookings/${booking_id} returns data.settlement_status == 'NONE' and data.hold_amount_cents == 0"
            - "GET /rv-marketplace/renters/${renter_id} returns data.wallet_credit_cents == 0"
            - "GET /rv-marketplace/ledger-entries with booking_id == ${booking_id} returns total_count == 0"

