          setup:
            - "A PRESENTED proposal carrying three OFFERED options: rank 1 speaker Dana at 1275000, rank 2 speaker Rafael at 1150000, rank 3 speaker Noor at 1050000"
            - "The client has selected rank 1, so option 1 is SELECTED, options 2 and 3 are REJECTED, the proposal is ACCEPTED, the inquiry is WON and an OFFERED engagement exists"
          setup_api_calls:
