          - roles.PlatformAdmin.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Operational administration and compliance adjudication are disjoint: PlatformAdmin runs the clock and the enrolment lifecycle but cannot reach the cross-sell decision, which only ComplianceOfficer holds."
        test_recipe:
          setup:
