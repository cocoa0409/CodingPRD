            - call: "GET /nutrient-applications/9f000000-0000-4000-8000-00000000000b"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_application: "$.data.error_id" }
            - call: "GET /revenue-statements/9f000000-0000-4000-8000-00000000000c"
