  # ===========================================================================
  # RULE 6 - boundary_precision_check
  # Instance 1: metric = Offtaker.credit_score / credit_tier at exactly 62.00,
  #             endpoint POST /ppa/offtakers/{id}/submit-qualification.
  # Instance 2: metric = Deal.cp_completion_pct at the vacuous 0/0 boundary,
  #             endpoint POST /ppa/deals/{id}/execute - a different metric on a
  #             different entity reached through a different endpoint.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: credit_tier_at_exact_standard_threshold_62_00
        grounds:
          - calculations.offtaker_credit_score
          - calculations.offtaker_credit_tier
          - calculations.unsecured_credit_limit
          - endpoints.POST_/ppa/offtakers/{id}/submit-qualification
        distinguishing_aspect: |
          The metric is Offtaker.credit_score and the boundary is the inclusive
          TIER_STANDARD_MIN of 62.00, probed from both sides by moving ONE input by
          0.01 of leverage: net_debt_to_ebitda 1.3 lands the score on exactly 62.00
          and must be STANDARD, while 1.31 lands on 61.97 and must be SUBPRIME. The
          test also pins the second-order consequence - the unsecured limit drops
          from 800000.00 to 200000.00 across a 0.03-point score change - so an
          implementation that uses a strict > comparison, or that rounds the score to
          whole points, fails visibly.
        test_recipe:
          setup:
            - "Two offtakers are created with identical profiles except net_debt_to_ebitda: credit_rating B (RATING_POINTS 38), rating_agency MOODYS, disclosure_framework CDP_AND_TCFD (DISCLOSURE_POINTS 100), has_science_based_target true, re100_member false, scope2_target_year 2035, reported_ebitda_usd 40000000.00, no parent guarantor (so both are the STANDALONE variant)."
            - "Offtaker ON has net_debt_to_ebitda 1.3, so leverage_points = 100 - 10 * 1.3 = 87.0 and credit_score = 0.55*38 + 0.30*87.0 + 0.15*100 = 20.90 + 26.10 + 15.00 = 62.00 exactly."
            - "Offtaker OFF has net_debt_to_ebitda 1.31, so leverage_points = 86.9 and credit_score = 20.90 + 26.07 + 15.00 = 61.97."
            - "Neither offtaker has a registry account, which is irrelevant here because no deal is created."
            - "Logical clock is the 2026-08-01T00:00:00Z startup default throughout."
          setup_api_calls:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Meridian Foods Group Inc", credit_rating: "B", rating_agency: "MOODYS", reported_ebitda_usd: 40000000.00, net_debt_to_ebitda: 1.3, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: false, scope2_target_year: 2035 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { on_id: $.data.id, on_tier_before: $.data.credit_tier }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Meridian Foods Holdings Inc", credit_rating: "B", rating_agency: "MOODYS", reported_ebitda_usd: 40000000.00, net_debt_to_ebitda: 1.31, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: false, scope2_target_year: 2035 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /ppa/offtakers/${on_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${off_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "at creation both offtakers have credit_score null, credit_tier null, sustainability_score null and unsecured_credit_limit_usd null; ${on_tier_before} is null"
            - "Offtaker.${on_id}.credit_score == 62.00 exactly, and Offtaker.${on_id}.credit_tier == STANDARD - the comparison at TIER_STANDARD_MIN is inclusive"
            - "Offtaker.${off_id}.credit_score == 61.97, and Offtaker.${off_id}.credit_tier == SUBPRIME"
            - "Offtaker.${on_id}.unsecured_credit_limit_usd == 800000.00 (min of the 10000000.00 STANDARD cap and 40000000.00 * 0.02)"
            - "Offtaker.${off_id}.unsecured_credit_limit_usd == 200000.00 (min of the 2000000.00 SUBPRIME cap and 40000000.00 * 0.005), a 600000.00 cliff caused by a 0.03 move in the score"
            - "both offtakers have credit_score_variant STANDALONE, sustainability_score 50.00 (PTS_SBT 40 plus PTS_DISCLOSING 10; scope2_target_year 2035 is beyond NEAR_TERM_YEAR and re100_member is false) and qualification_status UNDER_REVIEW"
            - "the two scores differ by 0.03 and the two tiers differ, which is only possible if the score is carried at 2 decimals rather than rounded to whole points"

      - name: cp_completion_pct_vacuous_100_00_on_empty_template
        grounds:
          - calculations.cp_completion_pct
          - calculations.cp_template_selection
          - state_machines.Deal.TERMS_AGREED_to_EXECUTED
          - state_machines.Deal.EXECUTED_to_EFFECTIVE
          - endpoints.POST_/ppa/deals/{id}/execute
        distinguishing_aspect: |
          A different metric (Deal.cp_completion_pct, a percentage over a set that
          may be EMPTY) probed at a different kind of boundary - the vacuous 0-of-0
          case - through a different endpoint (execute rather than
          submit-qualification). Two otherwise identical deals differ only in the
          status of their project, which changes the CP template size from 0 to 1:
          the empty set must read exactly 100.00 and go straight to EFFECTIVE in the
          same request, while the one-element set must read exactly 0.00 and stop at
