  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: increase_notice_gap_exactly_at_threshold_allowed
        grounds:
          - calculations.dues_increase_notice_gap
          - validations[priority=9]
          - errors[ERR_INCREASE_NOTICE_GAP]
        distinguishing_aspect: |
          Boundary metric = day-gap between noticed_at and
          effective_from. The threshold is `actual_gap_days >= required`
          (inclusive). At exactly == required, publish SUCCEEDS; one day
          earlier, publish FAILS. Endpoint = POST
          /api/dues-schedules/{id}/publish.
        test_recipe:
          setup:
            - "Category PROF, schedule S1 PUBLISHED with effective_from=2026-01-01, annual=120000, increase_notice_days=60"
            - "Schedule S2 in DRAFT with effective_from=2026-08-30, annual=130000, increase_notice_days=60 — the increase requires 60 days notice"
            - "Notice issued on 2026-07-01 (exactly 60 days before 2026-08-30)"
            - "Attempt publish of S2 — must succeed (boundary >=)"
            - "Then schedule S3 in DRAFT with effective_from=2026-09-15, increase_notice_days=60, noticed on 2026-07-17 (gap=59 days) — publish must FAIL"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
