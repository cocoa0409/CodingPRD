            - { call: "POST /shop/reservations/${r1}/confirm", payload: { deposit_authorized_cents: 1600 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${r1}/pickup", payload: {}, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-02T17:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${r1}/return", payload: {}, as: FrontDesk }
            - { call: "POST /shop/equipment-items/${unit}/inspect", payload: { outcome: "NEEDS_TUNE" }, as: Technician, captures: { ust: "$.data.status" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2027-01-05", end_date: "2027-01-06", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { r2: "$.data.id" } }
