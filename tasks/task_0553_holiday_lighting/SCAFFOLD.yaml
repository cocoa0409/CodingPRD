scenario: "553. Holiday & Permanent Lighting Installation (Trimlight/Christmas Decor style): design & footage estimate, install & takedown scheduling, off-season storage of customer lights, recurring seasonal contract & early-bird, weather/repair service call, financing (permanent system), route/crew, renewal"
domain_name: holiday-lighting-installation
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  # SeasonalContract is a hub with one-to-many children (Job, Estimate, ServiceCall,
  # StorageRecord, FinancingPlan) plus cross-aggregate links into the route/crew
  # scheduling subsystem (RouteDay/RouteAssignment) and a self-referential renewal chain.
  state_machine_shape: cyclic
  # Job carries a SCHEDULED<->RESCHEDULED weather cycle; ServiceCall carries a
  # WARRANTY/BILLABLE branch with divergent resolve side-effects.
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: property owner name
      - name: service_address
        type: string
        source: input
        description: street address of the property being lit
      - name: roofline_feet
        type: integer
        source: input
        description: total measured roofline in linear feet for the property
        constraints: ">= 0"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "sum of total_cents over this customer's Invoices whose status == ISSUED (VOID and PAID excluded); recomputed on every Invoice create/void"
        default: 0
      - name: status
        type: enum
        source: system
        description: account status
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: SeasonalContract
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the property owner this contract serves"
      - name: contract_type
        type: enum
        source: input
        description: rental of seasonal lights vs purchase of a permanent system
        constraints: "one of {SEASONAL_RENTAL, PERMANENT_PURCHASE}"
      - name: season_year
        type: integer
        source: input
        description: the calendar year the season covers
      - name: base_season_fee_cents
        type: integer
        source: input
        description: base contract fee before storage surcharge and early-bird discount
        constraints: ">= 0"
      - name: storage_included
        type: boolean
        source: input
        description: whether off-season storage of the customer's lights is bundled
        default: false
      - name: storage_surcharge_cents
        type: integer
        source: input
        description: surcharge added to the subtotal when storage_included is true
        default: 0
        constraints: ">= 0"
      - name: early_bird_cutoff
        type: datetime
        source: input
        description: ISO8601 instant; signing on or before it makes the contract early-bird eligible
      - name: signed_date
        type: datetime
        source: system
        description: logical-clock instant captured when the contract is signed; null until signed
      - name: early_bird
        type: boolean
        source: computed
        description: "true iff signed_date <= early_bird_cutoff (inclusive boundary); set at sign time"
        default: false
      - name: subtotal_cents
        type: integer
        source: computed
        description: "base_season_fee_cents + (storage_surcharge_cents if storage_included else 0); pinned before discount"
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: early-bird discount; tier keyed on subtotal_cents (see calculations.early_bird_contract_pricing)
        default: 0
      - name: contract_price_cents
        type: integer
        source: computed
        description: "subtotal_cents - discount_cents; final signed price"
        default: 0
      - name: renewed_from_id
        type: string
        source: input
        description: "FK -> SeasonalContract.id; set by renewal to the prior season's contract; null for a first contract"
      - name: status
        type: enum
        source: system
        description: contract lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RENEWED, CANCELLED, COMPLETED}"

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; who the design is for"
      - name: contract_id
        type: string
        source: input
        description: "FK -> SeasonalContract.id; contract this estimate is attached to; may be null at DRAFT"
      - name: product_line
        type: enum
        source: input
        description: seasonal rental design vs permanent system design (drives base fee)
        constraints: "one of {SEASONAL, PERMANENT}"
      - name: estimated_footage
        type: integer
        source: input
        description: designer's projected lit footage used for the QUOTED variant
        constraints: ">= 0"
      - name: roofline_complexity
        type: enum
        source: input
        description: complexity multiplier bucket
        constraints: "one of {SIMPLE, MODERATE, COMPLEX}"
      - name: accessory_count
        type: integer
        source: input
        description: number of add-on accessories (timers, stakes, wreaths)
        default: 0
        constraints: ">= 0"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: provisional total from estimated_footage (see calculations.footage_estimate_quote); null until QUOTED
      - name: measured_footage
        type: integer
        source: computed
        description: actual footage captured from the linked install Job completion; null until install completes
      - name: final_total_cents
        type: integer
        source: computed
        description: final total recomputed from measured_footage (final variant); null until install completes
      - name: status
        type: enum
        source: system
        description: estimate lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, QUOTED, ACCEPTED, REJECTED, INVOICED}"

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: crew display name
      - name: home_zone
        type: string
        source: input
        description: dispatch zone the crew is based in
      - name: daily_stop_capacity
        type: integer
        source: input
        description: default number of stops the crew can serve per route day
        constraints: ">= 1"
      - name: active
        type: boolean
        source: input
        description: whether the crew can be assigned route days
        default: true

  - name: RouteDay
    parent: null
    common_fields: true
    fields:
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; the crew working this calendar day"
      - name: service_date
        type: datetime
        source: input
        description: ISO8601 date the crew is dispatched
      - name: zone
        type: string
        source: input
        description: service zone for the day
      - name: max_stops
        type: integer
        source: input
        description: hard cap on booked assignments for the day
        constraints: ">= 1"
      - name: booked_stops
        type: integer
        source: computed
        description: "count of RouteAssignment rows with route_day_id == this.id AND status IN {BOOKED, DISPATCHED}; recomputed on assignment create/release/dispatch"
        default: 0
      - name: status
        type: enum
        source: system
        description: route day lifecycle
        default: PLANNED
        constraints: "one of {PLANNED, DISPATCHED, CLOSED}"

  - name: RouteAssignment
    parent: null
    common_fields: true
    fields:
      - name: route_day_id
        type: string
        source: input
        description: "FK -> RouteDay.id; the day/crew this stop is booked on"
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job to be worked at this stop"
      - name: window_start
        type: datetime
        source: input
        description: ISO8601 start of the on-site time window (half-open interval start)
      - name: window_end
        type: datetime
        source: input
        description: ISO8601 end of the on-site time window (half-open interval end; exclusive)
      - name: status
        type: enum
        source: system
        description: assignment lifecycle
        default: BOOKED
        constraints: "one of {BOOKED, DISPATCHED, RELEASED, COMPLETED}"

  - name: Job
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> SeasonalContract.id; contract the work order belongs to"
      - name: estimate_id
        type: string
        source: input
        description: "FK -> Estimate.id; the accepted estimate for an INSTALL job; null for TAKEDOWN/SERVICE"
      - name: job_type
        type: enum
        source: input
        description: kind of work order
        constraints: "one of {INSTALL, TAKEDOWN, SERVICE}"
      - name: scheduled_date
        type: datetime
        source: input
        description: ISO8601 target date for the work
      - name: completed_footage
        type: integer
        source: input
        description: footage actually installed, supplied at completion of an INSTALL job; null otherwise
      - name: reschedule_count
        type: integer
        source: computed
        description: number of times the job has cycled through RESCHEDULED back to SCHEDULED
        default: 0
      - name: status
        type: enum
        source: system
        description: job lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, RESCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}"

  - name: ServiceCall
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> SeasonalContract.id; contract the service pertains to"
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the SERVICE job spawned when the call is scheduled; null until scheduled"
      - name: reported_issue
        type: string
        source: input
        description: free-text description of the reported problem
      - name: cause
        type: enum
        source: input
        description: root cause category
        constraints: "one of {WEATHER, DEFECT, VANDALISM}"
      - name: service_fee_cents
        type: integer
        source: input
        description: fee billed when the call is classified BILLABLE
        default: 0
        constraints: ">= 0"
      - name: classification
        type: enum
        source: computed
        description: whether the visit is covered (WARRANTY) or chargeable (BILLABLE); set at classify time; null until then
        constraints: "one of {WARRANTY, BILLABLE}"
      - name: status
        type: enum
        source: system
        description: service call lifecycle
        default: OPEN
        constraints: "one of {OPEN, CLASSIFIED, SCHEDULED, RESOLVED}"

  - name: StorageBin
    parent: null
    common_fields: true
    fields:
      - name: bin_code
        type: string
        source: input
        description: physical bin label
      - name: warehouse_zone
        type: string
        source: input
        description: warehouse aisle/zone
      - name: buffer_days
        type: integer
        source: input
        description: mandatory idle/cleaning buffer (in days) enforced between two occupancies of this bin
        default: 0
        constraints: ">= 0"

  - name: StorageRecord
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> SeasonalContract.id; whose lights are stored"
      - name: storage_bin_id
        type: string
        source: input
        description: "FK -> StorageBin.id; the bin holding the lights"
      - name: stored_from
        type: datetime
        source: input
        description: ISO8601 first day of the occupancy (closed interval start; inclusive)
      - name: stored_until
        type: datetime
        source: input
        description: ISO8601 last day of the occupancy (closed interval end; inclusive)
      - name: status
        type: enum
        source: system
        description: storage record lifecycle
        default: STORED
        constraints: "one of {STORED, RETRIEVED, DISPOSED}"

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> SeasonalContract.id; the PERMANENT_PURCHASE contract being financed"
      - name: original_principal_cents
        type: integer
        source: input
        description: amount financed at origination
        constraints: ">= 1"
      - name: apr_bps
        type: integer
        source: input
        description: annual percentage rate in basis points (e.g. 1000 == 10.00%)
        constraints: ">= 0"
      - name: term_months
        type: integer
        source: input
        description: number of scheduled monthly installments
        constraints: ">= 1"
      - name: total_interest_cents
        type: integer
        source: computed
        description: "round_half_up(original_principal_cents * apr_bps/10000 * term_months/12); simple interest over the term"
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "round_half_up((original_principal_cents + total_interest_cents) / term_months)"
      - name: remaining_principal_cents
        type: integer
        source: computed
        description: "starts at original_principal_cents; decremented by each POSTED Payment's principal_portion_cents, restored on reversal"
      - name: status
        type: enum
        source: system
        description: plan lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, PAID_OFF, DEFAULTED}"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: financing_plan_id
        type: string
        source: input
        description: "FK -> FinancingPlan.id; the plan this payment applies to"
      - name: amount_cents
        type: integer
        source: input
        description: gross payment amount
        constraints: ">= 1"
      - name: interest_portion_cents
        type: integer
        source: computed
        description: "round_half_up(plan.total_interest_cents / plan.term_months); level interest allocation per payment"
      - name: principal_portion_cents
        type: integer
        source: computed
        description: "amount_cents - interest_portion_cents; the amount applied against remaining_principal_cents"
      - name: payment_date
        type: datetime
        source: system
        description: logical-clock instant when the payment posted
      - name: status
        type: enum
        source: system
        description: payment lifecycle
        default: POSTED
        constraints: "one of {POSTED, REVERSED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; billed party"
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job this invoice bills (install or spawned service job); null for MANUAL"
      - name: source_type
        type: enum
        source: input
        description: what generated the invoice
        constraints: "one of {INSTALL, STORAGE, SERVICE, MANUAL}"
      - name: line_items
        type: array
        source: input
        description: "list of { description: string, amount_cents: integer, taxable: boolean }"
      - name: tax_rate_bps
        type: integer
        source: input
        description: tax rate in basis points applied per taxable line
        default: 0
        constraints: ">= 0"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "sum of amount_cents over all line_items"
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "sum over taxable line_items of round_half_up(amount_cents * tax_rate_bps / 10000) -- rounded PER LINE then summed"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + tax_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: invoice lifecycle
        default: ISSUED
        constraints: "one of {ISSUED, PAID, VOID}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: SeasonalContract
    initial_state: DRAFT
    terminal_states: [RENEWED, CANCELLED, COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/sign"
        actor: SalesRep
        preconditions:
          - "contract.status == DRAFT"
        side_effects:
          - "set signed_date = current logical clock"
          - "compute subtotal_cents, early_bird, discount_cents, contract_price_cents (calculations.early_bird_contract_pricing)"
          - "increments SeasonalContract.version by 1"
      - from: ACTIVE
        to: RENEWED
        trigger: "POST /contracts/{id}/renew"
        actor: SalesRep
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "create a new SeasonalContract (status DRAFT) for the next season with renewed_from_id == this.id, same customer_id and contract_type"
          - "increments SeasonalContract.version by 1"
        note: "the created next-season contract is returned by the renew endpoint"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /contracts/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "CASCADE hop1: every Job with contract_id == this.id and status IN {SCHEDULED, RESCHEDULED} transitions to CANCELLED"
          - "increments SeasonalContract.version by 1"
        note: "hop1 of the depth-3 cancel cascade; hops 2-3 are declared on Job.* -> CANCELLED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: season closeout (no test-driving endpoint; reachable only via renew/cancel in tests)"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "increments SeasonalContract.version by 1"
        note: "COMPLETED is a natural terminal; not exercised by difficulty/corner recipes"

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [REJECTED, INVOICED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /estimates/{id}/quote"
        actor: SalesRep
        preconditions:
          - "estimate.status == DRAFT"
        side_effects:
          - "compute quoted_total_cents from estimated_footage (calculations.footage_estimate_quote, variant=quoted)"
          - "increments Estimate.version by 1"
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /estimates/{id}/accept"
        actor: Customer
        preconditions:
          - "estimate.status == QUOTED"
          - "acting Customer owns the estimate (estimate.customer_id == X-User-ID)"
        side_effects:
          - "increments Estimate.version by 1"
      - from: QUOTED
        to: REJECTED
        trigger: "system: quote declined (not exercised by recipes)"
        actor: Customer
        preconditions:
          - "estimate.status == QUOTED"
        side_effects:
          - "increments Estimate.version by 1"
      - from: ACCEPTED
        to: INVOICED
        trigger: "side-effect of POST /jobs/{id}/complete when the completed INSTALL job's estimate_id == this.id"
        actor: system
        preconditions:
          - "estimate.status == ACCEPTED"
        side_effects:
          - "set measured_footage = job.completed_footage"
          - "compute final_total_cents from measured_footage (calculations.footage_estimate_quote, variant=final)"
          - "increments Estimate.version by 1"

  - entity: Job
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /jobs/{id}/weather-hold"
        actor: Dispatcher
        preconditions:
          - "job.status == SCHEDULED"
        side_effects:
          - "increments Job.version by 1"
        note: "cyclic edge 1 of the weather loop"
      - from: RESCHEDULED
        to: SCHEDULED
        trigger: "POST /jobs/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "job.status == RESCHEDULED"
        side_effects:
          - "set scheduled_date = new_scheduled_date"
          - "increment reschedule_count by 1"
          - "increments Job.version by 1"
        note: "cyclic edge 2 of the weather loop (SCHEDULED<->RESCHEDULED)"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /jobs/{id}/start"
        actor: CrewLead
        preconditions:
          - "job.status == SCHEDULED"
          - "there exists a RouteAssignment with job_id == this.id whose RouteDay.status == DISPATCHED (cross-entity: RouteDay must be DISPATCHED)"
          - "acting CrewLead owns that RouteDay's crew (RouteDay.crew_id == X-User-ID)"
        side_effects:
          - "increments Job.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /jobs/{id}/complete"
        actor: CrewLead
        preconditions:
          - "job.status == IN_PROGRESS"
          - "if job_type == INSTALL then completed_footage must be supplied"
        side_effects:
          - "set completed_footage = supplied value (INSTALL)"
          - "if job_type == INSTALL and estimate_id is set: drive linked Estimate ACCEPTED -> INVOICED (recompute final_total_cents)"
          - "increments Job.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel OR cascade from SeasonalContract ACTIVE->CANCELLED"
        actor: Dispatcher
        preconditions:
          - "job.status IN {SCHEDULED, RESCHEDULED}"
        side_effects:
          - "CASCADE hop2: every RouteAssignment with job_id == this.id and status IN {BOOKED, DISPATCHED} transitions to RELEASED"
          - "increments Job.version by 1"
        note: "hop2 of the depth-3 cancel cascade"
      - from: RESCHEDULED
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel OR cascade from SeasonalContract ACTIVE->CANCELLED"
        actor: Dispatcher
        preconditions:
          - "job.status IN {SCHEDULED, RESCHEDULED}"
        side_effects:
          - "CASCADE hop2: every RouteAssignment with job_id == this.id and status IN {BOOKED, DISPATCHED} transitions to RELEASED"
          - "increments Job.version by 1"

  - entity: RouteAssignment
    initial_state: BOOKED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: BOOKED
        to: DISPATCHED
        trigger: "side-effect of POST /route-days/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "assignment.status == BOOKED"
        side_effects:
          - "increments RouteAssignment.version by 1"
        note: "booked_stops is unaffected (both BOOKED and DISPATCHED count toward booked_stops)"
      - from: BOOKED
        to: RELEASED
        trigger: "cascade from Job -> CANCELLED"
        actor: system
        preconditions:
          - "assignment.status IN {BOOKED, DISPATCHED}"
        side_effects:
          - "CASCADE hop3: recompute RouteDay.booked_stops (decrement) and refresh RouteDay.updated_at"
          - "increments RouteAssignment.version by 1"
        note: "hop3 of the depth-3 cancel cascade"
      - from: DISPATCHED
        to: RELEASED
        trigger: "cascade from Job -> CANCELLED"
        actor: system
        preconditions:
          - "assignment.status IN {BOOKED, DISPATCHED}"
        side_effects:
          - "CASCADE hop3: recompute RouteDay.booked_stops (decrement) and refresh RouteDay.updated_at"
          - "increments RouteAssignment.version by 1"

  - entity: RouteDay
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /route-days/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "route_day.status == PLANNED"
        side_effects:
          - "every RouteAssignment with route_day_id == this.id and status == BOOKED transitions to DISPATCHED"
          - "increments RouteDay.version by 1"
      - from: DISPATCHED
        to: CLOSED
        trigger: "system: end-of-day closeout (not exercised by recipes)"
        actor: system
        preconditions:
          - "route_day.status == DISPATCHED"
        side_effects:
          - "increments RouteDay.version by 1"

  - entity: ServiceCall
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: CLASSIFIED
        trigger: "POST /service-calls/{id}/classify"
        actor: BillingAdmin
        preconditions:
          - "service_call.status == OPEN"
        side_effects:
          - "set classification = supplied WARRANTY|BILLABLE (branch point)"
          - "increments ServiceCall.version by 1"
      - from: CLASSIFIED
        to: SCHEDULED
        trigger: "POST /service-calls/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "service_call.status == CLASSIFIED"
          - "parent SeasonalContract.status == ACTIVE"
        side_effects:
          - "create a Job (job_type == SERVICE, contract_id == service_call.contract_id, scheduled_date == supplied) in status SCHEDULED"
          - "set service_call.job_id = created Job.id"
          - "increments ServiceCall.version by 1"
      - from: SCHEDULED
        to: RESOLVED
        trigger: "POST /service-calls/{id}/resolve"
        actor: BillingAdmin
        preconditions:
          - "service_call.status == SCHEDULED"
        side_effects:
          - "BRANCH BILLABLE: CASCADE hop1 -> create Invoice (source_type SERVICE, customer_id == contract.customer_id, job_id == service_call.job_id, single line item {amount_cents == service_fee_cents, taxable false}, tax_rate_bps 0) in status ISSUED; CASCADE hop2 -> recompute Customer.outstanding_balance_cents"
          - "BRANCH WARRANTY: no Invoice created, Customer.outstanding_balance_cents unchanged"
          - "increments ServiceCall.version by 1"
        note: "divergent side-effect sets per branch; depth-2 cascade on the BILLABLE branch"

  - entity: StorageRecord
    initial_state: STORED
    terminal_states: [RETRIEVED, DISPOSED]
    transitions:
      - from: STORED
        to: RETRIEVED
        trigger: "POST /storage-records/{id}/retrieve"
        actor: BillingAdmin
        preconditions:
          - "storage_record.status == STORED"
          - "parent SeasonalContract.status == ACTIVE (cross-entity: lights only released while the contract is active)"
        side_effects:
          - "increments StorageRecord.version by 1"
      - from: STORED
        to: DISPOSED
        trigger: "system: unclaimed disposal (not exercised by recipes)"
        actor: system
        preconditions:
          - "storage_record.status == STORED"
        side_effects:
          - "increments StorageRecord.version by 1"

  - entity: FinancingPlan
    initial_state: ACTIVE
    terminal_states: [PAID_OFF, DEFAULTED]
    transitions:
      - from: ACTIVE
        to: PAID_OFF
        trigger: "side-effect of POST /financing-plans/{id}/payments when remaining_principal_cents reaches 0"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
          - "remaining_principal_cents == 0 after applying the payment"
        side_effects:
          - "increments FinancingPlan.version by 1"
        note: "bubble-up: plan auto-transitions when principal is fully retired"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system: delinquency (not exercised by recipes)"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "increments FinancingPlan.version by 1"

  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /payments/{id}/reverse"
        actor: BillingAdmin
        preconditions:
          - "payment.status == POSTED"
          - "parent FinancingPlan.status == ACTIVE"
        side_effects:
          - "restore FinancingPlan.remaining_principal_cents += principal_portion_cents (compensating action)"
          - "increments Payment.version by 1"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "recompute Customer.outstanding_balance_cents (this invoice no longer counts)"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "system: payment received (not exercised by recipes)"
        actor: system
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "recompute Customer.outstanding_balance_cents"
          - "increments Invoice.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-route-day
    parent_entity: RouteDay
    write_endpoint: "POST /route-assignments"
    occ_field: "expected_route_day_version"
    description: |
      Creating a RouteAssignment against a RouteDay whose version has advanced
      since the client last observed it is rejected. Booking validates the day's
      current capacity and the current set of occupied time windows; if another
      stop was booked (bumping RouteDay.version and changing booked_stops / the
      window set) after the client read the day, the client's view is stale and
      the create is refused so it cannot book against an outdated availability
      snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: footage_estimate_quote
    trigger: "Estimate DRAFT->QUOTED (quoted variant); Estimate ACCEPTED->INVOICED via Job complete (final variant)"
    algorithm: tiered_pricing
    formula: |
      base = SEASONAL_BASE_CENTS if product_line == "SEASONAL" else PERMANENT_BASE_CENTS
      ft = footage   # estimated_footage for quoted; measured_footage for final
      t1 = min(ft, 100) * TIER1_RATE_CENTS
      t2 = min(max(ft - 100, 0), 100) * TIER2_RATE_CENTS
      t3 = max(ft - 200, 0) * TIER3_RATE_CENTS
      footage_cost = t1 + t2 + t3
      mult = COMPLEXITY_MULT[roofline_complexity]           # 1.00 / 1.15 / 1.30
      complexity_cost = round_half_up(footage_cost * mult)  # rounding applied to the multiplied footage cost only
      accessory_cost = accessory_count * ACCESSORY_UNIT_CENTS
      total = base + complexity_cost + accessory_cost
    input_set: "single Estimate row; footage source depends on variant"
    constants:
      SEASONAL_BASE_CENTS: 15000
      PERMANENT_BASE_CENTS: 40000
      TIER1_RATE_CENTS: 300
      TIER2_RATE_CENTS: 250
      TIER3_RATE_CENTS: 200
      ACCESSORY_UNIT_CENTS: 1200
      COMPLEXITY_MULT: "{SIMPLE: 1.00, MODERATE: 1.15, COMPLEX: 1.30}"
    precision: "integer cents, round_half_up on the multiplied footage cost"
    variants:
      - name: quoted
        when: "Estimate QUOTED transition"
        difference: "footage = estimated_footage (designer projection); writes quoted_total_cents"
      - name: final
        when: "linked INSTALL Job completes"
        difference: "footage = measured_footage (job.completed_footage); writes final_total_cents; diverges from quoted whenever measured != estimated"

  - name: financing_payoff_balance
    trigger: "GET /financing-plans/{id}/payoff-quote"
    algorithm: aggregation
    formula: |
      posted = count of Payment rows with financing_plan_id == plan.id and status == POSTED
      remaining_installments = plan.term_months - posted
      # variant scheduled_payoff: keep paying the schedule (includes future interest)
      scheduled_remaining_cents = plan.monthly_payment_cents * remaining_installments
      # variant early_payoff: retire principal now, rebate unearned interest, add prepay fee
      early_payoff_cents = plan.remaining_principal_cents
                           + round_half_up(plan.remaining_principal_cents * PREPAY_FEE_BPS / 10000)
    input_set: "one FinancingPlan and its POSTED Payments"
    constants:
      PREPAY_FEE_BPS: 200
    precision: "integer cents, round_half_up on the prepay fee"
    variants:
      - name: scheduled_payoff
        when: "customer keeps the monthly schedule"
        difference: "monthly_payment_cents * remaining_installments; carries future interest"
      - name: early_payoff
        when: "customer settles the permanent-system loan early"
        difference: "remaining_principal_cents + 2% prepay fee; excludes future interest, so it is strictly lower than scheduled_payoff whenever interest > fee"

  - name: early_bird_contract_pricing
    trigger: "SeasonalContract DRAFT->ACTIVE (POST /contracts/{id}/sign)"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS PINNED (circular-looking: discount depends on a tier keyed
      # on the total, and the final price depends on the discount):
      # 1) subtotal_cents = base_season_fee_cents + (storage_surcharge_cents if storage_included else 0)
      # 2) early_bird = (signed_date <= early_bird_cutoff)          # inclusive boundary
      # 3) tier/rate is looked up from subtotal_cents (the PRE-discount amount), NOT from the final price
      # 4) discount_cents = round_half_up(subtotal_cents * rate) if early_bird else 0
      # 5) contract_price_cents = subtotal_cents - discount_cents
      subtotal = base_season_fee_cents + (storage_surcharge_cents if storage_included else 0)
      early_bird = signed_date <= early_bird_cutoff
      if not early_bird:
        rate = 0.0
      elif subtotal >= TIER_HI_CENTS:      # >= 100000
        rate = RATE_HI
      elif subtotal >= TIER_LO_CENTS:      # >= 50000
        rate = RATE_LO
      else:
        rate = 0.0
      discount = round_half_up(subtotal * rate)
      contract_price = subtotal - discount
    input_set: "single SeasonalContract row plus the logical clock"
    constants:
      TIER_LO_CENTS: 50000
      TIER_HI_CENTS: 100000
      RATE_LO: 0.05
      RATE_HI: 0.10
    precision: "integer cents, round_half_up on the discount"

  - name: invoice_total_rounding
    trigger: "POST /invoices; and BILLABLE ServiceCall resolve"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: tax is rounded PER LINE, then summed
      # (NOT sum-of-taxable-then-round-once).
      subtotal_cents = sum(li.amount_cents for li in line_items)
      tax_cents = sum(round_half_up(li.amount_cents * tax_rate_bps / 10000)
                      for li in line_items if li.taxable)
      total_cents = subtotal_cents + tax_cents
    input_set: "the invoice's line_items array"
    constants: {}
    precision: "integer cents, round_half_up applied independently to each taxable line before summation"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "path resources exist, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "foreign-key resources named in the body exist (customer_id, contract_id, crew_id, route_day_id, job_id, storage_bin_id, estimate_id, financing_plan_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all creates referencing FKs"
  - priority: 5
    category: business_constraint
    check: "required fields present, enums valid, integers within declared constraints, window_end > window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 6
    category: business_constraint
    check: "window_end must be strictly greater than window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /route-assignments"
  - priority: 7
    category: auth
    check: "entity-backed actor owns the target (Customer.customer_id == X-User-ID for estimate accept / financing payments; CrewLead RouteDay.crew_id == X-User-ID for job start/complete)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /estimates/{id}/accept, POST /jobs/{id}/start, POST /jobs/{id}/complete"
  - priority: 8
    category: state
    check: "target resource is in a state that permits the requested transition (contract signable/renewable/active, estimate quoted, job scheduled/in-progress, service-call state, storage-record stored, invoice issued, payment posted, plan active)"
    error_id: "ERR_<DOMAIN>_INVALID_STATE (e.g. ERR_JOB_NOT_SCHEDULED, ERR_PLAN_NOT_ACTIVE)"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: state
    check: "cross-entity state gate: job start requires its RouteDay DISPATCHED; storage retrieve requires parent contract ACTIVE; service schedule requires parent contract ACTIVE"
    error_id: "ERR_ROUTE_DAY_NOT_DISPATCHED / ERR_CONTRACT_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /jobs/{id}/start, POST /storage-records/{id}/retrieve, POST /service-calls/{id}/schedule"
  - priority: 10
    category: business_referential
    check: "referenced Job is bookable (job.status IN {SCHEDULED, RESCHEDULED}); a CANCELLED/COMPLETED/IN_PROGRESS job cannot be booked onto a route day"
    error_id: ERR_JOB_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /route-assignments"
  - priority: 11
    category: business_temporal
    check: "route-assignment time window does not overlap another BOOKED/DISPATCHED window on the same RouteDay (half-open [start,end); adjacency end==start allowed)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /route-assignments"
  - priority: 12
    category: business_temporal
    check: "storage occupancy does not collide with another STORED occupancy of the same bin within buffer_days (closed [from,until] inflated by buffer on both sides)"
    error_id: ERR_BIN_OCCUPIED
    http_status: 409
    applies_to: "POST /storage-records"
  - priority: 13
    category: business_constraint
    check: "route day has capacity: booked_stops < max_stops before adding the assignment"
    error_id: ERR_ROUTE_DAY_FULL
    http_status: 409
    applies_to: "POST /route-assignments"
  - priority: 14
    category: business_fiscal
    check: "payment does not overpay: principal_portion_cents <= plan.remaining_principal_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /financing-plans/{id}/payments"
  - priority: 15
    category: state
    check: "optimistic concurrency: expected_route_day_version matches RouteDay.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /route-assignments"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock time."
    roles: [SalesRep, Dispatcher, BillingAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced to to_iso8601"]

  # ---- customers ----
  - method: POST
    path: "/customers"
    description: "Register a property owner"
    roles: [SalesRep]
    code: 201
    input: [name, service_address, roofline_feet]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer, including computed outstanding_balance_cents"
    roles: [SalesRep, Dispatcher, BillingAdmin, CrewLead, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- contracts ----
  - method: POST
    path: "/contracts"
    description: "Create a DRAFT seasonal or permanent contract"
    roles: [SalesRep]
    code: 201
    input: [customer_id, contract_type, season_year, base_season_fee_cents, early_bird_cutoff, "storage_included?", "storage_surcharge_cents?"]
    output: SeasonalContract
    side_effects: []
  - method: POST
    path: "/contracts/{id}/sign"
    description: "Sign a DRAFT contract; computes early-bird pricing"
    roles: [SalesRep]
    code: 200
    input: []
    output: SeasonalContract
    side_effects: ["DRAFT->ACTIVE", "compute subtotal_cents/early_bird/discount_cents/contract_price_cents", "set signed_date", "increments SeasonalContract.version by 1"]
  - method: POST
    path: "/contracts/{id}/renew"
    description: "Renew an ACTIVE contract into a new next-season DRAFT contract"
    roles: [SalesRep]
    code: 201
    input: [season_year, base_season_fee_cents, early_bird_cutoff, "storage_included?", "storage_surcharge_cents?"]
    output: SeasonalContract
    side_effects: ["prior contract ACTIVE->RENEWED", "new DRAFT contract created with renewed_from_id == prior id", "increments SeasonalContract.version by 1"]
  - method: POST
    path: "/contracts/{id}/cancel"
    description: "Cancel an ACTIVE contract; cascades to jobs, assignments, route days"
    roles: [SalesRep, BillingAdmin]
    code: 200
    input: []
    output: SeasonalContract
    side_effects: ["ACTIVE->CANCELLED", "cascade hop1: SCHEDULED/RESCHEDULED Jobs -> CANCELLED", "increments SeasonalContract.version by 1"]
  - method: GET
    path: "/contracts/{id}"
    description: "Fetch a contract"
    roles: [SalesRep, Dispatcher, BillingAdmin, Customer]
    code: 200
    input: []
    output: SeasonalContract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List contracts; filterable by customer, status, renewal parent"
    roles: [SalesRep, Dispatcher, BillingAdmin, Customer]
    code: 200
    input: ["customer_id?", "status?", "renewed_from_id?", "limit?", "offset?"]
    output: SeasonalContract[]
    side_effects: []

  # ---- estimates ----
  - method: POST
    path: "/estimates"
    description: "Create a DRAFT design/footage estimate"
    roles: [SalesRep]
    code: 201
    input: [customer_id, product_line, estimated_footage, roofline_complexity, "contract_id?", "accessory_count?"]
    output: Estimate
    side_effects: []
  - method: POST
    path: "/estimates/{id}/quote"
    description: "Compute the quoted total from estimated footage"
    roles: [SalesRep]
    code: 200
    input: []
    output: Estimate
    side_effects: ["DRAFT->QUOTED", "compute quoted_total_cents", "increments Estimate.version by 1"]
  - method: POST
    path: "/estimates/{id}/accept"
    description: "Customer accepts a quoted estimate"
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["QUOTED->ACCEPTED", "increments Estimate.version by 1"]
  - method: GET
    path: "/estimates/{id}"
    description: "Fetch an estimate"
    roles: [SalesRep, BillingAdmin, Customer, Dispatcher]
    code: 200
    input: []
    output: Estimate
    side_effects: []
  - method: GET
    path: "/estimates"
    description: "List estimates; filterable by customer, contract, status"
    roles: [SalesRep, BillingAdmin, Customer, Dispatcher]
    code: 200
    input: ["customer_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: Estimate[]
    side_effects: []

  # ---- crews ----
  - method: POST
    path: "/crews"
    description: "Create an install crew"
    roles: [Dispatcher]
    code: 201
    input: [name, home_zone, daily_stop_capacity, "active?"]
    output: Crew
    side_effects: []

  # ---- route days ----
  - method: POST
    path: "/route-days"
    description: "Plan a crew's route day"
    roles: [Dispatcher]
    code: 201
    input: [crew_id, service_date, zone, max_stops]
    output: RouteDay
    side_effects: []
  - method: POST
    path: "/route-days/{id}/dispatch"
    description: "Dispatch a planned route day; promotes its booked assignments"
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteDay
    side_effects: ["PLANNED->DISPATCHED", "each BOOKED RouteAssignment -> DISPATCHED", "increments RouteDay.version by 1"]
  - method: GET
    path: "/route-days/{id}"
    description: "Fetch a route day, including computed booked_stops and version"
    roles: [Dispatcher, SalesRep, BillingAdmin, CrewLead]
    code: 200
    input: []
    output: RouteDay
    side_effects: []
  - method: GET
    path: "/route-days"
    description: "List route days; filterable by crew and date"
    roles: [Dispatcher, SalesRep, BillingAdmin, CrewLead]
    code: 200
    input: ["crew_id?", "service_date?", "limit?", "offset?"]
    output: RouteDay[]
    side_effects: []

  # ---- route assignments ----
  - method: POST
    path: "/route-assignments"
    description: "Book a job onto a route day time window (OCC-guarded)"
    roles: [Dispatcher]
    code: 201
    input: [route_day_id, job_id, window_start, window_end, expected_route_day_version]
    output: RouteAssignment
    side_effects: ["create BOOKED assignment", "recompute RouteDay.booked_stops (increment)", "increments RouteDay.version by 1"]
  - method: GET
    path: "/route-assignments/{id}"
    description: "Fetch a route assignment"
    roles: [Dispatcher, SalesRep, BillingAdmin, CrewLead]
    code: 200
    input: []
    output: RouteAssignment
    side_effects: []
  - method: GET
    path: "/route-assignments"
    description: "List route assignments; filterable by route day and job"
    roles: [Dispatcher, SalesRep, BillingAdmin, CrewLead]
    code: 200
    input: ["route_day_id?", "job_id?", "limit?", "offset?"]
    output: RouteAssignment[]
    side_effects: []

  # ---- jobs ----
  - method: POST
    path: "/jobs"
    description: "Create a work order (INSTALL/TAKEDOWN/SERVICE) against an ACTIVE contract"
    roles: [Dispatcher]
    code: 201
    input: [contract_id, job_type, scheduled_date, "estimate_id?"]
    output: Job
    side_effects: []
  - method: POST
    path: "/jobs/{id}/weather-hold"
    description: "Put a scheduled job on weather hold"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Job
    side_effects: ["SCHEDULED->RESCHEDULED", "increments Job.version by 1"]
  - method: POST
    path: "/jobs/{id}/reschedule"
    description: "Re-book a held job on a new date"
    roles: [Dispatcher]
    code: 200
    input: [new_scheduled_date]
    output: Job
    side_effects: ["RESCHEDULED->SCHEDULED", "set scheduled_date", "increment reschedule_count", "increments Job.version by 1"]
  - method: POST
    path: "/jobs/{id}/start"
    description: "Crew starts a job (requires a DISPATCHED route day)"
    roles: [CrewLead]
    code: 200
    input: []
    output: Job
    side_effects: ["SCHEDULED->IN_PROGRESS", "increments Job.version by 1"]
  - method: POST
    path: "/jobs/{id}/complete"
    description: "Crew completes a job; INSTALL finalizes the linked estimate"
    roles: [CrewLead]
    code: 200
    input: ["completed_footage?"]
    output: Job
    side_effects: ["IN_PROGRESS->COMPLETED", "set completed_footage (INSTALL)", "INSTALL with estimate_id: Estimate ACCEPTED->INVOICED, compute final_total_cents/measured_footage", "increments Job.version by 1"]
  - method: POST
    path: "/jobs/{id}/cancel"
    description: "Cancel a scheduled/held job; releases its assignments"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Job
    side_effects: ["SCHEDULED/RESCHEDULED->CANCELLED", "cascade hop2: BOOKED/DISPATCHED assignments -> RELEASED", "increments Job.version by 1"]
  - method: GET
    path: "/jobs/{id}"
    description: "Fetch a job"
    roles: [Dispatcher, SalesRep, BillingAdmin, CrewLead, Customer]
    code: 200
    input: []
    output: Job
    side_effects: []
  - method: GET
    path: "/jobs"
    description: "List jobs; filterable by contract, estimate, status"
    roles: [Dispatcher, SalesRep, BillingAdmin, CrewLead, Customer]
    code: 200
    input: ["contract_id?", "estimate_id?", "status?", "limit?", "offset?"]
    output: Job[]
    side_effects: []

  # ---- service calls ----
  - method: POST
    path: "/service-calls"
    description: "Open a weather/repair service call"
    roles: [Customer, BillingAdmin]
    code: 201
    input: [contract_id, reported_issue, cause, "service_fee_cents?"]
    output: ServiceCall
    side_effects: []
  - method: POST
    path: "/service-calls/{id}/classify"
    description: "Classify the call WARRANTY or BILLABLE"
    roles: [BillingAdmin]
    code: 200
    input: [classification]
    output: ServiceCall
    side_effects: ["OPEN->CLASSIFIED", "set classification", "increments ServiceCall.version by 1"]
  - method: POST
    path: "/service-calls/{id}/schedule"
    description: "Schedule the visit; spawns a SERVICE job (requires ACTIVE contract)"
    roles: [Dispatcher]
    code: 200
    input: [scheduled_date]
    output: ServiceCall
    side_effects: ["CLASSIFIED->SCHEDULED", "create SERVICE Job, set job_id", "increments ServiceCall.version by 1"]
  - method: POST
    path: "/service-calls/{id}/resolve"
    description: "Resolve the call; BILLABLE creates an invoice"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: ServiceCall
    side_effects: ["SCHEDULED->RESOLVED", "BILLABLE: create ISSUED Invoice + recompute Customer.outstanding_balance_cents", "WARRANTY: no invoice", "increments ServiceCall.version by 1"]
  - method: GET
    path: "/service-calls/{id}"
    description: "Fetch a service call"
    roles: [BillingAdmin, Dispatcher, SalesRep, Customer]
    code: 200
    input: []
    output: ServiceCall
    side_effects: []
  - method: GET
    path: "/service-calls"
    description: "List service calls; filterable by contract, job, status"
    roles: [BillingAdmin, Dispatcher, SalesRep, Customer]
    code: 200
    input: ["contract_id?", "job_id?", "status?", "limit?", "offset?"]
    output: ServiceCall[]
    side_effects: []

  # ---- storage ----
  - method: POST
    path: "/storage-bins"
    description: "Create a storage bin"
    roles: [BillingAdmin]
    code: 201
    input: [bin_code, warehouse_zone, "buffer_days?"]
    output: StorageBin
    side_effects: []
  - method: POST
    path: "/storage-records"
    description: "Store a customer's lights in a bin (buffered-overlap guarded)"
    roles: [BillingAdmin]
    code: 201
    input: [contract_id, storage_bin_id, stored_from, stored_until]
    output: StorageRecord
    side_effects: []
  - method: POST
    path: "/storage-records/{id}/retrieve"
    description: "Retrieve stored lights (requires ACTIVE parent contract)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: StorageRecord
    side_effects: ["STORED->RETRIEVED", "increments StorageRecord.version by 1"]
  - method: GET
    path: "/storage-records/{id}"
    description: "Fetch a storage record"
    roles: [BillingAdmin, SalesRep, Customer]
    code: 200
    input: []
    output: StorageRecord
    side_effects: []
  - method: GET
    path: "/storage-records"
    description: "List storage records; filterable by contract, bin, status"
    roles: [BillingAdmin, SalesRep, Customer]
    code: 200
    input: ["contract_id?", "storage_bin_id?", "status?", "limit?", "offset?"]
    output: StorageRecord[]
    side_effects: []

  # ---- financing ----
  - method: POST
    path: "/financing-plans"
    description: "Originate a financing plan for a PERMANENT_PURCHASE contract"
    roles: [BillingAdmin]
    code: 201
    input: [contract_id, original_principal_cents, apr_bps, term_months]
    output: FinancingPlan
    side_effects: ["compute total_interest_cents/monthly_payment_cents", "set remaining_principal_cents = original_principal_cents"]
  - method: GET
    path: "/financing-plans/{id}/payoff-quote"
    description: "Dual-variant payoff quote (scheduled vs early)"
    roles: [BillingAdmin, Customer, SalesRep]
    code: 200
    input: []
    output: "{ scheduled_remaining_cents: integer, early_payoff_cents: integer, remaining_principal_cents: integer, remaining_installments: integer }"
    side_effects: []
  - method: POST
    path: "/financing-plans/{id}/payments"
    description: "Post a payment against the plan"
    roles: [Customer, BillingAdmin]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects: ["create POSTED Payment", "compute interest/principal split", "reduce plan.remaining_principal_cents", "plan -> PAID_OFF if remaining hits 0"]
  - method: GET
    path: "/financing-plans/{id}"
    description: "Fetch a financing plan"
    roles: [BillingAdmin, Customer, SalesRep]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: []
  - method: GET
    path: "/financing-plans"
    description: "List financing plans; filterable by contract"
    roles: [BillingAdmin, Customer, SalesRep]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: FinancingPlan[]
    side_effects: []
  - method: POST
    path: "/payments/{id}/reverse"
    description: "Reverse a posted payment; restores plan principal"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: ["POSTED->REVERSED", "restore plan.remaining_principal_cents", "increments Payment.version by 1"]
  - method: GET
    path: "/payments/{id}"
    description: "Fetch a payment"
    roles: [BillingAdmin, Customer, SalesRep]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/payments"
    description: "List payments; filterable by financing plan, status"
    roles: [BillingAdmin, Customer, SalesRep]
    code: 200
    input: ["financing_plan_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- invoices ----
  - method: POST
    path: "/invoices"
    description: "Issue an invoice with explicit line items"
    roles: [BillingAdmin]
    code: 201
    input: [customer_id, source_type, line_items, "tax_rate_bps?", "job_id?"]
    output: Invoice
    side_effects: ["compute subtotal_cents/tax_cents/total_cents", "recompute Customer.outstanding_balance_cents"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an issued invoice"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["ISSUED->VOID", "recompute Customer.outstanding_balance_cents", "increments Invoice.version by 1"]
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice"
    roles: [BillingAdmin, Customer, SalesRep]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices; filterable by customer, job, status"
    roles: [BillingAdmin, Customer, SalesRep]
    code: 200
    input: ["customer_id?", "job_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or unknown X-User-Role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted, or entity-backed actor does not own the target resource"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer id (path or FK) does not exist"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract id (path or FK) does not exist"
  - id: ERR_ESTIMATE_NOT_FOUND
    http: 404
    condition: "estimate id (path or FK) does not exist"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "crew id (FK) does not exist"
  - id: ERR_ROUTE_DAY_NOT_FOUND
    http: 404
    condition: "route day id (path or FK) does not exist"
  - id: ERR_ROUTE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "route assignment id does not exist"
  - id: ERR_JOB_NOT_FOUND
    http: 404
    condition: "job id (path or FK) does not exist"
  - id: ERR_SERVICE_CALL_NOT_FOUND
    http: 404
    condition: "service call id does not exist"
  - id: ERR_STORAGE_BIN_NOT_FOUND
    http: 404
    condition: "storage bin id (FK) does not exist"
  - id: ERR_STORAGE_RECORD_NOT_FOUND
    http: 404
    condition: "storage record id does not exist"
  - id: ERR_FINANCING_PLAN_NOT_FOUND
    http: 404
    condition: "financing plan id (path or FK) does not exist"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "payment id does not exist"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad enum value, or numeric constraint violated"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "route-assignment window_end is not strictly after window_start"
  - id: ERR_CONTRACT_NOT_SIGNABLE
    http: 409
    condition: "sign attempted on a non-DRAFT contract"
  - id: ERR_CONTRACT_NOT_RENEWABLE
    http: 409
    condition: "renew attempted on a non-ACTIVE contract"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "operation requires the parent/target contract to be ACTIVE (job create, service schedule, storage retrieve)"
  - id: ERR_ESTIMATE_NOT_QUOTED
    http: 409
    condition: "accept attempted on an estimate not in QUOTED"
  - id: ERR_JOB_NOT_SCHEDULED
    http: 409
    condition: "start attempted on a job not in SCHEDULED"
  - id: ERR_JOB_NOT_IN_PROGRESS
    http: 409
    condition: "complete attempted on a job not in IN_PROGRESS"
  - id: ERR_JOB_NOT_HELD
    http: 409
    condition: "reschedule attempted on a job not in RESCHEDULED"
  - id: ERR_JOB_NOT_CANCELLABLE
    http: 409
    condition: "cancel attempted on a job not in {SCHEDULED, RESCHEDULED}"
  - id: ERR_ROUTE_DAY_NOT_PLANNED
    http: 409
    condition: "booking or dispatch requires the route day to be PLANNED"
  - id: ERR_ROUTE_DAY_NOT_DISPATCHED
    http: 409
    condition: "job start requires the job's route day to be DISPATCHED"
  - id: ERR_JOB_NOT_BOOKABLE
    http: 409
    condition: "referenced job is not in {SCHEDULED, RESCHEDULED} and cannot be booked onto a route day"
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "assignment time window overlaps another BOOKED/DISPATCHED window on the same route day"
  - id: ERR_BIN_OCCUPIED
    http: 409
    condition: "storage occupancy collides with another STORED occupancy of the bin within buffer_days"
  - id: ERR_ROUTE_DAY_FULL
    http: 409
    condition: "route day booked_stops already equals max_stops"
  - id: ERR_SERVICE_CALL_INVALID_STATE
    http: 409
    condition: "classify/schedule/resolve attempted from the wrong service-call state"
  - id: ERR_STORAGE_RECORD_NOT_STORED
    http: 409
    condition: "retrieve attempted on a storage record not in STORED"
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "payment or reversal attempted on a plan not in ACTIVE"
  - id: ERR_PAYMENT_NOT_POSTED
    http: 409
    condition: "reverse attempted on a payment not in POSTED"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "payment principal_portion_cents exceeds plan.remaining_principal_cents"
  - id: ERR_INVOICE_NOT_ISSUED
    http: 409
    condition: "void attempted on an invoice not in ISSUED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_route_day_version does not match RouteDay.version"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: SalesRep
    description: "Sells and manages contracts and estimates"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /contracts"
      - "POST /contracts/{id}/sign"
      - "POST /contracts/{id}/renew"
      - "POST /estimates"
      - "POST /estimates/{id}/quote"
    shared_operations:
      - "POST /contracts/{id}/cancel (with BillingAdmin)"
      - "POST /_clock/set_current_utc (with Dispatcher, BillingAdmin)"
      - "GET reads"
  - name: Customer
    description: "Property owner acting on their own resources"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /estimates/{id}/accept (must own the estimate)"
    shared_operations:
      - "POST /service-calls (with BillingAdmin)"
      - "POST /financing-plans/{id}/payments (with BillingAdmin)"
      - "GET reads of own resources"
  - name: Dispatcher
    description: "Runs crews, route days, assignments, and job scheduling"
    identity: "opaque"
    exclusive_operations:
      - "POST /crews"
      - "POST /route-days"
      - "POST /route-days/{id}/dispatch"
      - "POST /route-assignments"
      - "POST /jobs"
      - "POST /jobs/{id}/weather-hold"
      - "POST /jobs/{id}/reschedule"
      - "POST /jobs/{id}/cancel"
      - "POST /service-calls/{id}/schedule"
    shared_operations:
      - "POST /_clock/set_current_utc (with SalesRep, BillingAdmin)"
      - "GET reads"
  - name: CrewLead
    description: "Field crew lead; starts and completes jobs on their own route days"
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /jobs/{id}/start (must own the route day's crew)"
      - "POST /jobs/{id}/complete (must own the route day's crew)"
    shared_operations:
      - "GET reads"
  - name: BillingAdmin
    description: "Handles storage, financing, service classification, invoicing"
    identity: "opaque"
    exclusive_operations:
      - "POST /service-calls/{id}/classify"
      - "POST /service-calls/{id}/resolve"
      - "POST /storage-bins"
      - "POST /storage-records"
      - "POST /storage-records/{id}/retrieve"
      - "POST /financing-plans"
      - "POST /payments/{id}/reverse"
      - "POST /invoices"
      - "POST /invoices/{id}/void"
    shared_operations:
      - "POST /contracts/{id}/cancel (with SalesRep)"
      - "POST /service-calls (with Customer)"
      - "POST /financing-plans/{id}/payments (with Customer)"
      - "POST /_clock/set_current_utc (with SalesRep, Dispatcher)"
      - "GET reads"
