# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Food Truck Operations & Permits — Expert
# Nine §0.5 rules, >= 2 instances each (20 instances total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_live_vs_settled_diverge_on_happy_hour
        grounds:
          - calculations.order_live_total
          - calculations.order_settled_total
          - state_machines.Order.OPEN_to_SETTLED
          - entities.Order.fields.live_total_cents
          - entities.Order.fields.settled_total_cents
        distinguishing_aspect: "Identical OrderLines yield live_total_cents=404 (estimate, no discount) but settled_total_cents=344 once HAPPY_HOUR applies — divergence on the Order domain (POS estimate vs settlement)."
        test_recipe:
          setup:
            - "An OPERABLE truck with an ARRIVED booking and an AVAILABLE menu item priced 101 cents, prepared_units >= 4."
            - "An OPEN order under that booking with two lines (qty 1 and qty 3 of the 101-cent item), payment CAPTURED with no tip."
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "Central", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T18:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /trucks"
              payload: { name: "Taco One", commissary_id: "${comm_id}", home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /health-permits"
              payload: { truck_id: "${truck_id}", permit_number: "P-1", state_code: "CA", issued_at: "2026-05-01T00:00:00.000Z", expires_at: "2026-12-01T00:00:00.000Z" }
              as: HealthInspector
            - call: "POST /utility-logs"
              payload: { truck_id: "${truck_id}", utility: "PROPANE", propane_psi_after: 50 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Dee", role: "DRIVER", shift_start: "2026-06-01T16:00:00.000Z", shift_end: "2026-06-01T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Coe", role: "COOK", shift_start: "2026-06-01T16:00:00.000Z", shift_end: "2026-06-01T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /menu-items"
              payload: { truck_id: "${truck_id}", sku: "X1", name: "Taco", unit_price_cents: 101, par_units: 10 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { item_id: $.data.id }
            - call: "POST /prep-batches"
              payload: { truck_id: "${truck_id}", menu_item_id: "${item_id}", units_made: 10 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /spots"
              payload: { name: "Plaza", state_code: "CA", concurrent_capacity: 2, reservation_fee_cents: 2500 }
              as: Dispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Night Market", starts_at: "2026-06-01T17:00:00.000Z", ends_at: "2026-06-01T22:00:00.000Z" }
              as: Dispatcher
              captures: { event_id: $.data.id }
            - call: "GET /trucks/${truck_id}"
              payload: {}
              as: Dispatcher
              captures: { truck_v: $.data.version }
            - call: "POST /bookings"
              payload: { truck_id: "${truck_id}", spot_id: "${spot_id}", event_id: "${event_id}", window_start: "2026-06-01T17:30:00.000Z", window_end: "2026-06-01T21:00:00.000Z", expected_truck_version: "${truck_v}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/arrive"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /orders"
              payload: { booking_id: "${booking_id}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", menu_item_id: "${item_id}", quantity: 1 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", menu_item_id: "${item_id}", quantity: 3 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /orders/${order_id}/authorize-payment"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /orders/${order_id}/capture-payment"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { live_before: $.data.live_total_cents }
          trigger:
            - call: "POST /orders/${order_id}/settle"
              payload: { discount_code: "HAPPY_HOUR" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { settled: $.data.settled_total_cents }
          assert:
            - "live_before == 404"
            - "Order.${order_id}.settled_total_cents == 344"
            - "Order.${order_id}.live_total_cents == 404"
            - "Order.${order_id}.settled_total_cents != Order.${order_id}.live_total_cents"

      - name: reservation_fee_balance_vs_gross_sales_distinct_domains
        grounds:
          - calculations.reservation_fee_balance
          - calculations.order_settled_total
          - entities.OperatorTruck.fields.reservation_fee_balance_cents
          - entities.OperatorTruck.fields.gross_sales_cents
          - state_machines.Order.OPEN_to_SETTLED
        distinguishing_aspect: "Two independently-derived truck money fields on different domains: reservation_fee_balance_cents tracks Booking fees (=2500 after one RESERVED booking) while gross_sales_cents tracks SETTLED Order revenue (=900) — neither contaminates the other."
        test_recipe:
          setup:
            - "An OPERABLE truck with one RESERVED booking on a spot whose reservation_fee_cents=2500 (so reservation_fee_balance_cents=2500)."
            - "The truck arrives, opens one order with a single line (item 450 x 2 = 900), pays, and settles it with NONE discount."
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "Central", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
