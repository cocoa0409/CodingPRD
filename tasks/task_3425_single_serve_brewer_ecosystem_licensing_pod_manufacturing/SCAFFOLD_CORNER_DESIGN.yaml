  - section: cross_cutting_layers
    instances:
      - name: occ_license_amend_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[license-amend-stale-agreement]"
          - "errors.ERR_STALE_VERSION"
        distinguishing_aspect: "Two strictly sequential amends against the same observed version: the first succeeds (source version 2 -> 3, new DRAFT minted), the second carrying the same expected version fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Agreement created (version 1) then activated (version 2 captured)."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "OCC License Co", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { la1_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${la1_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { la1_ag: $.data.id }
            - call: "POST /license-agreements/${la1_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
              captures: { la1_v2: $.data.version }
          trigger:
            - call: "POST /license-agreements/${la1_ag}/amend"
              payload: { expected_license_agreement_version: "${la1_v2}", territory_code: "US", effective_start: "2027-01-01", effective_end: "2027-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 550}], quality_min_cup_score: 82, exclusive: false }
              as: LicensingManager
              captures: { la1_amend: $.data.id, la1_amend_status: $.data.status }
            - call: "POST /license-agreements/${la1_ag}/amend"
              payload: { expected_license_agreement_version: "${la1_v2}", territory_code: "US", effective_start: "2027-01-01", effective_end: "2027-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 600}], quality_min_cup_score: 82, exclusive: false }
              as: LicensingManager
              captures: { la1_err: $.data.error_id }
            - call: "GET /license-agreements/${la1_ag}"
              payload: {}
              as: LicensingManager
              captures: { la1_src_v: $.data.version }
          assert:
            - "first amend: 201, new agreement status DRAFT, amendment_of_id == ${la1_ag}"
            - "source agreement version == 3 after the successful amend (1 create + 1 activate + 1 amend)"
            - "second amend with the same observed version: 412 ERR_STALE_VERSION"

      - name: occ_assortment_plan_stale_version
