            - "immediately after the 412 GET /shipment-lines?shipment_id=${shpo} returns total_count 1 and FinishedUnit.${fu2}.logistics_status is still 'STORED'"
            - "${sh_b} == ${sh_a} + 1 and the retry with ${sh_b} returns 201 with nest_position 2 and line_nested_cube_m3 1.0000"
            - "the shipment then reports nested_cube_m3 3.0000 and loaded_weight_kg 48.000 with status 'LOADING'"
            - "${sh_c} == ${sh_b} + 1: the 412 consumed no version and the retry consumed exactly one"

      - name: occ_claim_approve_stale_product_model_version_across_an_intervening_patch
        claim_type: immediate
        grounds:
          - concurrency_rules.claim-approve-stale-product-model
          - errors.ERR_STALE_PRODUCT_MODEL_VERSION
          - calculations.warranty_payout
          - validations.priority_84
        distinguishing_aspect: |
          The intervening write is a PATCH that has nothing to do with money —
          min_cooling_minutes 30 to 31 — yet it invalidates the agent's
          expected_product_model_version, because the OCC token guards the whole
          funding parent; the refreshed approval then books exactly 165600 cents
          (gross 180000 at 100.00 pct pro-rata coverage, 8.00 pct admin fee
          14400, no storage deduction because the review VERIFIED) and leaves
          334400 cents of reserve.
        test_recipe:
          setup:
            - "Base plant with hull 1 delivered to CUS-CD-1 at 2026-08-02T09:00:00Z and CLM-CD-1 (HULL_DEFORMATION, reported_deformation_mm 4.50) UNDER_REVIEW."
            - "The storage review has been recorded VERIFIED, so storage_review_status is GUIDANCE_VERIFIED and the payout carries no storage deduction."
            - "ProductModel PM-CD-KM: msrp_cents 180000, warranty_basis PRO_RATA_AGE, warranty_reserve_cents 500000, warranty_paid_cents 0."
            - "Logical clock at 2026-08-02T09:00:00Z, so months_in_service is 0 and coverage_pct is 100.00."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
            - *cd2_cust
            - *cd2_ack
            - *cd2_shp
            - *cd2_shpv1
            - *cd2_line1
            - *cd2_shpv2
            - *cd2_line2
            - *cd2_seal
            - *cd2_clk1100
            - *cd2_depart
            - *cd2_clk0802
            - *cd2_deliver
            - *cd2_claim
            - *cd2_review
            - call: "POST /warranty-claims/${claim}/storage-review"
              payload: { outcome: "VERIFIED", storage_description: "stored on a cradle under cover" }
              as: WarrantyAgent
              as_user_id: "agent-1"
          trigger:
            - call: "GET /product-models/${pm}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { wm_a: $.data.version }
            - call: "PATCH /product-models/${pm}"
              payload: { min_cooling_minutes: 31 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warranty-claims/${claim}/approve"
              payload: { expected_product_model_version: "${wm_a}" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /product-models/${pm}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { wm_b: $.data.version }
            - call: "POST /warranty-claims/${claim}/approve"
              payload: { expected_product_model_version: "${wm_b}" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /product-models/${pm}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { wm_c: $.data.version }
          assert:
            - "the storage review leaves WarrantyClaim.${claim}.storage_review_status 'GUIDANCE_VERIFIED' with claim_status still 'UNDER_REVIEW'"
            - "the PATCH returns 200 with min_cooling_minutes 31 and ${wm_b} == ${wm_a} + 1"
            - "the approval with the pre-PATCH version returns status 412 with data.error_id 'ERR_STALE_PRODUCT_MODEL_VERSION' — not ERR_STORAGE_REVIEW_INCOMPLETE, not ERR_WARRANTY_TERM_EXPIRED and not ERR_WARRANTY_RESERVE_EXHAUSTED, all of which pass"
            - "immediately after the 412 ProductModel.${pm}.warranty_reserve_cents is still 500000, warranty_paid_cents is still 0 and WarrantyClaim.${claim}.claim_status is still 'UNDER_REVIEW'"
            - "the retry with ${wm_b} returns 200 with claim_status 'APPROVED' and net_payout_cents 165600, computed as gross 180000 minus admin fee 14400 minus storage deduction 0"
            - "ProductModel.${pm}.warranty_reserve_cents == 334400 and warranty_paid_cents == 165600 in that same response's aftermath, and ${wm_c} == ${wm_b} + 1"
            - "500000 == 334400 + 165600: the reserve ledger is conserved by the approval that the 412 had deferred"

      - name: occ_immediate_visibility_of_cascade_derived_fields_in_the_next_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - "endpoints.POST_/finished-units/{finished_unit_id}/release-storage"
          - "endpoints.GET_/warehouses/{warehouse_id}/footprint-summary"
          - state_machines.FinishedUnit
        distinguishing_aspect: |
          CASCADE-C is a multi-row recomputation — the released anchor's sibling
          is PROMOTED to anchor and re-priced from 1.0000 to 2.0000 m3, the zone
          and site totals are recomputed and the posture is re-derived — yet all
          of it is readable in the request immediately following the release, with
          no settle, poll or second write, which is what consistency_model
          "immediate" means.
        test_recipe:
          setup:
            - "Base plant with hull 1 stored as the Z-A anchor at 2.0000 m3 and hull 2 nested behind it at 1.0000 m3, so Z-A is committed 3.0000 of 20.0000 m3 and the site is NORMAL at 15.00 pct."
            - "Logical clock at 2026-08-01T10:35:00Z."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
          trigger:
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu1}/release-storage"
              payload: { release_reason: "seasonal reallocation" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units/${fu2}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units?is_zone_anchor=true"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "the first summary reports zone Z-A committed_cube_m3 3.0000, utilization_pct 15.00 and posture 'NORMAL', with hull 1 as the only anchor"
            - "the release returns 200 with FinishedUnit.${fu1}.logistics_status 'UNALLOCATED', warehouse_id null and is_zone_anchor false"
            - "the very next read of hull 2 already reports is_zone_anchor true and footprint_cube_m3 2.0000 — the promotion is not deferred"
            - "the second summary reports zone Z-A committed_cube_m3 2.0000, remaining_cube_m3 18.0000, utilization_pct 10.00 and posture 'NORMAL' in that same following request"
            - "GET /finished-units?is_zone_anchor=true returns total_count 1 and its single row is ${fu2}"
            - "no endpoint in this instance accepts or returns a token, cursor, retry-after or lock handle: reads are immediately consistent with the write that preceded them"
