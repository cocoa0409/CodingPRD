              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { auC0: "$.data.id" }
            - call: "POST /sourcing/audits/${auC0}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/factories/${fB}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 75, social_compliance_score: 75, production_capability_score: 75, financial_stability_score: 75, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { auB0: "$.data.id" }
            - call: "POST /sourcing/audits/${auB0}/approve"
              payload: {}
