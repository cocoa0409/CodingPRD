            - { call: "POST /endowment/managers/${rl_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${rl_pool}", fund_code: "FRL", fund_name: "Fund RL", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { rl_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D RL", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { rl_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${rl_fund}", donor_id: "${rl_donor}", external_ref: "RL1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { rl_g1: $.data.id } }
            - { call: "POST /endowment/funds/${rl_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${rl_g1}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${rl_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${rl_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { rl_v1: $.data.id } }
            - { call: "GET /endowment/pools/${rl_pool}", as: InvestmentOfficer, captures: { rl_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${rl_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${rl_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/distributions", payload: { fund_id: "${rl_fund}", fiscal_year: 2026 }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { rl_d: $.data.id } }
            - { call: "POST /endowment/distributions/${rl_d}/propose", payload: {}, as: DevelopmentOfficer, as_user_id: "dev-1" }
            - { call: "POST /endowment/distributions/${rl_d}/request_revision", payload: {}, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/distributions/${rl_d}/repropose", payload: {}, as: DevelopmentOfficer, as_user_id: "dev-1" }
            - { call: "POST /endowment/distributions/${rl_d}/request_revision", payload: {}, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/distributions/${rl_d}/repropose", payload: {}, as: DevelopmentOfficer, as_user_id: "dev-1" }
