          - validations[priority=57]
          - validations[priority=58]
          - validations[priority=92]
        distinguishing_aspect: |
          Draws are strictly sequential from 1 and cannot be funded before certification; claims
          cannot be disputed before adjudication and cannot be adjudicated twice in a row. Four
          sequencing errors that all depend on the CURRENT status of the row, not on the payload.
