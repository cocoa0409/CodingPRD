    side_effects:
      - "creates the ticket with status = SCHEDULED, store_id and unit_id copied from the agreement, replacement_unit_id = null, rent_credit_days = 0"
      - "sets issued_by_user_id = X-User-ID"
    notes: "issue_code is MECHANICAL | COSMETIC | ELECTRICAL | INFESTATION. Windows are checked against the store's service_bay_capacity using CLOSED intervals (touching endpoints collide), unlike crew windows which are half-open."

  - method: GET
    path: /service-tickets/{id}
    roles: [PlatformAdmin, ComplianceOfficer, StoreManager, SalesAssociate, ServiceTechnician, Customer]
    input: {}
    output: ServiceTicket
    side_effects: []

  - method: GET
    path: /service-tickets
    roles: [PlatformAdmin, ComplianceOfficer, StoreManager, SalesAssociate, ServiceTechnician]
    input:
      agreement_id?: string
      store_id?: string
      unit_id?: string
      replacement_unit_id?: string
      status?: enum
      limit?: integer
      offset?: integer
    output: ServiceTicket[]
    side_effects: []
    notes: "Reverse-reachability for all four ServiceTicket FKs. Ordered by window_start_at ASC, then created_at ASC."

  - method: POST
    path: /service-tickets/{id}/issue-swap
    roles: [PlatformAdmin, StoreManager, ServiceTechnician]
    input:
      replacement_unit_id: string
    output: ServiceTicket
    side_effects:
      - "sets status = SWAP_ISSUED and replacement_unit_id"
      - "runs the four-step swap cascade: ticket -> agreement possession_status DELIVERED -> SERVICE_SWAP_PENDING and swap_count + 1 -> old unit ON_RENT -> IN_SERVICE and replacement unit AVAILABLE -> ON_RENT with replaced_unit_id set to the old unit -> Store.units_in_service_count + 1, which recomputes service_intake_open"
      - "moves Agreement.unit_id to the replacement unit and carries accumulated_rent_received_cents forward onto the replacement unit"
    notes: "The replacement unit must be AVAILABLE, at the same store and of the same category (ERR_REPLACEMENT_UNIT_INVALID)."

  - method: POST
    path: /service-tickets/{id}/resolve
    roles: [PlatformAdmin, StoreManager, ServiceTechnician]
    input:
      resolution: enum
      rent_credit_days: integer
    output: ServiceTicket
    side_effects:
      - "sets status = RESOLVED, resolution and rent_credit_days, and adds rent_credit_days to Agreement.service_credit_days"
      - "on resolution == REPAIRED nothing moves in the possession dimension: no swap was ever issued, so the agreement is still DELIVERED and the unit is still ON_RENT at its existing condition_grade"
      - "on resolution == SWAPPED the agreement returns to DELIVERED, the swapped-out unit goes IN_SERVICE -> AVAILABLE with condition_grade stepped down one notch and rent_cycle_count + 1, and Store.units_in_service_count is decremented, which recomputes service_intake_open"
    notes: "resolution is REPAIRED | SWAPPED and must match the ticket's current status (ERR_TICKET_RESOLUTION_MISMATCH). rent_credit_days is 0..30."

  # ------------------------------------------------------- returns and grading
  - method: POST
    path: /agreements/{id}/return
    roles: [PlatformAdmin, StoreManager, SalesAssociate, Customer]
    input:
      return_reason: enum
    output: ReturnInspection
    side_effects:
      - "creates the inspection with status = PENDING, unit_id copied from the agreement, assessed_grade = null and depreciation_tier left at its TIER_1 default until grading bands it"
      - "runs the four-step return cascade: agreement possession_status -> RETURN_PENDING_INSPECTION -> unit ON_RENT -> RETURNED_PENDING_GRADE -> Store.units_on_rent_count - 1 -> calculations.unit_residual_value in its PROVISIONAL_AT_RETURN variant writes the unit's residual_value_cents with residual_valuation_basis = PROVISIONAL"
    notes: "return_reason must be VOLUNTARY_RETURN on this endpoint; the other member of the enum, REPOSSESSION_RECOVERY, is written only by the inspection that POST /agreements/{id}/repossess opens. Returning does not close the agreement; only grading does."

  - method: GET
    path: /return-inspections/{id}
    roles: [PlatformAdmin, ComplianceOfficer, StoreManager, SalesAssociate, ServiceTechnician]
    input: {}
    output: ReturnInspection
    side_effects: []

  - method: GET
    path: /return-inspections
    roles: [PlatformAdmin, ComplianceOfficer, StoreManager, SalesAssociate, ServiceTechnician]
    input:
      agreement_id?: string
      unit_id?: string
      status?: enum
      limit?: integer
      offset?: integer
    output: ReturnInspection[]
    side_effects: []
    notes: "Reverse-reachability for ReturnInspection.agreement_id and ReturnInspection.unit_id. Ordered by created_at ASC."

  - method: POST
    path: /return-inspections/{id}/grade
    roles: [PlatformAdmin, ServiceTechnician]
    input:
      assessed_grade: enum
      damage_deduction_cents: integer
      missing_parts_count: integer
    output: ReturnInspection
    side_effects:
      - "sets status = GRADED, graded_by_user_id = X-User-ID and stores the three graded inputs"
      - "runs calculations.unit_residual_value in its FINAL_AT_GRADING variant, then calculations.re_rent_rate and calculations.depreciation_tier, storing final_residual_value_cents, re_rent_rate_cents and depreciation_tier on the inspection and residual_value_cents / residual_valuation_basis = FINAL on the unit"
      - "steps the unit's condition_grade down to assessed_grade, increments rent_cycle_count and returns it RETURNED_PENDING_GRADE -> AVAILABLE, except on depreciation_tier == WRITE_OFF where the unit goes RETIRED with retired_reason = UNRENTABLE_ON_GRADING"
      - "closes the agreement: possession_status RETURN_PENDING_INSPECTION -> RETURNED and payment_status -> CLOSED, freezing all money counters"
    notes: "assessed_grade is GRADE_A | GRADE_B | GRADE_C | UNRENTABLE; UNRENTABLE short-circuits the residual to 0, which bands to WRITE_OFF and retires the unit instead of stepping its condition_grade. damage_deduction_cents >= 0, missing_parts_count 0..20."

  # ----------------------------------------------------- early purchase option
  - method: POST
    path: /agreements/{id}/early-purchase-quotes
    roles: [PlatformAdmin, StoreManager, SalesAssociate, Customer]
    input:
      expected_agreement_version: integer
    output: EarlyPurchaseQuote
    side_effects:
      - "runs calculations.early_purchase_payoff in the variant named by the snapshotted state rule and stores formula_applied, rent_applied_snapshot_cents, pre_discount_cents, loyalty_tier_snapshot, loyalty_discount_cents, late_fee_component_cents and payoff_amount_cents"
      - "sets status = OPEN, issued_at = the logical clock and expires_at = issued_at + QUOTE_VALID_DAYS days"
      - "supersedes every other OPEN quote on the agreement (OPEN -> SUPERSEDED)"
      - "increments Agreement.version by 1"
    notes: "OCC guard: expected_agreement_version must equal Agreement.version or the write is rejected with ERR_STALE_AGREEMENT_VERSION (412). Because posting a payment also bumps the version, a quote computed against a pre-payment view can never be issued."

  - method: GET
    path: /agreements/{id}/early-purchase-quotes
    roles: [PlatformAdmin, ComplianceOfficer, StoreManager, SalesAssociate, Customer]
    input:
      status?: enum
      limit?: integer
      offset?: integer
    output: EarlyPurchaseQuote[]
    side_effects: []
    notes: "Reverse-reachability for EarlyPurchaseQuote.agreement_id. Ordered by issued_at ASC, then created_at ASC."

  - method: POST
    path: /early-purchase-quotes/{id}/accept
    roles: [PlatformAdmin, StoreManager, SalesAssociate]
    input:
      payment_amount_cents: integer
    output: Agreement
    side_effects:
      - "sets the quote status = ACCEPTED"
      - "sets Agreement.early_purchase_paid_cents = payoff_amount_cents, clears late_fee_balance_cents and reinstatement_fee_balance_cents, sets paid_pct = 1.0000, payment_status -> CLOSED and possession_status -> OWNED"
      - "transitions the unit ON_RENT -> SOLD and decrements Store.units_on_rent_count"
      - "writes a LoyaltyLedgerEntry with entry_type = EARLY_PAYOFF_BONUS and delta_points = EARLY_PAYOFF_BONUS_POINTS, then recomputes the customer's balance, lifetime and tier"
    notes: "payment_amount_cents must equal the quote's payoff_amount_cents to the cent (ERR_PAYOFF_AMOUNT_MISMATCH)."

  # ---------------------------------------------- collections and repossession
  - method: POST
    path: /agreements/{id}/collection-contacts
    roles: [PlatformAdmin, CollectionsAgent]
    input:
      channel: enum
      outcome: enum
    output: CollectionContact
    side_effects:
      - "creates the contact with contacted_at = the logical clock, contacted_by_user_id = X-User-ID and rolling_7d_count_at_contact = the pre-insert value of calculations.collection_contact_window_count"
      - "sets Agreement.collection_contact_count_7d to the post-insert rolling count"
      - "does NOT touch Agreement.collections_stage: the stage is NONE | ADVERSE and is moved only by the delinquency/default sweep and by the cure cascade, so working an account never changes its posture"
    notes: "channel is PHONE | SMS | EMAIL | IN_PERSON. outcome is NO_ANSWER | LEFT_MESSAGE | SPOKE_TO_CUSTOMER | PROMISE_TO_PAY."

  - method: GET
    path: /agreements/{id}/collection-contacts
    roles: [PlatformAdmin, ComplianceOfficer, StoreManager, CollectionsAgent]
    input:
      channel?: enum
      limit?: integer
      offset?: integer
    output: CollectionContact[]
    side_effects: []
    notes: "Reverse-reachability for CollectionContact.agreement_id. Ordered by contacted_at ASC, then created_at ASC."

  - method: POST
    path: /agreements/{id}/repossess
    roles: [PlatformAdmin, CollectionsAgent]
    input:
      confirm: boolean
    output: Agreement
    side_effects:
      - "sets possession_status -> REPOSSESSED, payment_status -> CLOSED and collections_stage = ADVERSE"
      - "creates a ReturnInspection with status = PENDING, return_reason = REPOSSESSION_RECOVERY and unit_id = Agreement.unit_id, so the recovered unit still passes through condition grading"
      - "transitions the unit ON_RENT -> RETURNED_PENDING_GRADE, decrements Store.units_on_rent_count and writes the PROVISIONAL residual on the unit"
      - "recomputes Customer.adverse_agreement_count as the number of that customer's agreements with collections_stage == ADVERSE (never a blind increment, so a repossession that follows a default sweep does not double-count) and sets Customer.account_flag = ADVERSE while that count >= 1"
    notes: "confirm must be true. Guarded by segregation of duties (the customer's verifying ComplianceOfficer may not repossess), by the open-reinstatement-window bar, by the equity-protection limit and by the documented-notice requirement, in that priority order."

# =============================================================================
# §1.6 Error Catalog (61 codes; every code is reachable from at least one
#      §1.4 row and every §1.4 row cites codes from this list)
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    when: "X-User-Role or X-User-ID is missing, empty, or names a role outside the seven declared roles"
  - error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    when: "the caller's role is not listed in the endpoint's roles"
  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    when: "a Customer caller addresses a customer, agreement, quote or ticket that is not its own"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    when: "the X-User-ID authorizing repossession equals Customer.verified_by_user_id"
  - error_id: ERR_STORE_NOT_FOUND
    http_status: 404
    when: "the store id in the path does not resolve"
  - error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    when: "the customer id in the path or body does not resolve"
  - error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    when: "the customer-reference id in the path does not resolve"
  - error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    when: "the inventory-unit id in the path or body (unit_id, replacement_unit_id) does not resolve"
  - error_id: ERR_CREW_NOT_FOUND
    http_status: 404
    when: "crew_id in the body does not resolve"
  - error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    when: "the agreement id in the path does not resolve"
  - error_id: ERR_DELIVERY_ORDER_NOT_FOUND
    http_status: 404
    when: "the delivery-order id in the path does not resolve"
  - error_id: ERR_TICKET_NOT_FOUND
    http_status: 404
    when: "the service-ticket id in the path does not resolve"
  - error_id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    when: "the return-inspection id in the path does not resolve"
  - error_id: ERR_PAYMENT_NOT_FOUND
    http_status: 404
    when: "the renewal-payment id in the path does not resolve"
  - error_id: ERR_QUOTE_NOT_FOUND
    http_status: 404
    when: "the early-purchase-quote id in the path does not resolve"
  - error_id: ERR_STATE_RULE_NOT_FOUND
    http_status: 404
    when: "the state-rto-rule id in the path does not resolve"
  - error_id: ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    when: "the loyalty-ledger-entry id in the path does not resolve"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    when: "the body fails shape validation: a required field is absent, a type is wrong, an enum value is unknown, an integer is negative where non-negative is required, limit is outside 1..100 or offset is negative"
  - error_id: ERR_INVALID_WINDOW
    http_status: 400
    when: "window_end_at is not strictly after window_start_at"
  - error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    when: "expected_agreement_version does not equal the agreement's current version"
  - error_id: ERR_AGREEMENT_CLOSED
    http_status: 409
    when: "any write is attempted against an agreement whose payment_status is CLOSED"
  - error_id: ERR_AGREEMENT_DEFAULTED
    http_status: 409
    when: "a payment, quote, delivery order, service ticket or return is attempted on a DEFAULTED agreement"
  - error_id: ERR_AGREEMENT_NOT_CURRENT
    http_status: 409
    when: "an early-purchase quote is requested on an agreement whose payment_status is not CURRENT"
  - error_id: ERR_AGREEMENT_NOT_DEFAULTED
    http_status: 409
    when: "repossession is attempted on an agreement whose payment_status is not DEFAULTED"
  - error_id: ERR_POSSESSION_STATE_INVALID
    http_status: 409
    when: "the agreement's possession_status does not permit the operation (for example a swap on a unit that was never delivered, or a return on an already RETURNED agreement)"
  - error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    when: "the inventory unit is not in the status the operation requires (AVAILABLE to reserve on agreement creation, RESERVED to deliver, RETURNED_PENDING_GRADE to grade); replacement-unit eligibility is reported as ERR_REPLACEMENT_UNIT_INVALID instead"
  - error_id: ERR_DELIVERY_ORDER_STATE_INVALID
    http_status: 409
    when: "complete or fail-attempt is called on a delivery order whose status is not SCHEDULED"
  - error_id: ERR_TICKET_STATE_INVALID
    http_status: 409
    when: "issue-swap is called on a ticket that is not SCHEDULED, or resolve is called on a ticket that is neither SCHEDULED nor SWAP_ISSUED"
  - error_id: ERR_INSPECTION_ALREADY_GRADED
    http_status: 409
    when: "grade is called on an inspection whose status is not PENDING"
  - error_id: ERR_QUOTE_NOT_OPEN
    http_status: 409
    when: "accept is called on a quote whose status is SUPERSEDED, EXPIRED or ACCEPTED"
  - error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    when: "the logical clock is strictly after the quote's expires_at"
  - error_id: ERR_REFERENCE_ALREADY_CHECKED
    http_status: 409
    when: "check is called on a reference whose check_status is not PENDING"
  - error_id: ERR_PAYMENT_NOT_REVERSIBLE
    http_status: 409
    when: "reverse is called on a payment that is already REVERSED, or on a POSTED payment that is not the agreement's most recent POSTED payment"
  - error_id: ERR_REINSTATEMENT_WINDOW_OPEN
    http_status: 409
    when: "repossession is attempted while an OPEN ReinstatementWindow still exists on the agreement"
  - error_id: ERR_COLLECTION_NOT_DELINQUENT
    http_status: 409
    when: "a collection contact is logged against an agreement whose payment_status is CURRENT"
  - error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    when: "serial_number already exists at the same store"
  - error_id: ERR_DUPLICATE_STATE_RULE
    http_status: 409
    when: "a StateRtoRule already exists for that state_code"
  - error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    when: "the crew already has a SCHEDULED order whose interval collides under the asymmetric travel-buffer rule"
  - error_id: ERR_SERVICE_INTAKE_CLOSED
    http_status: 409
    when: "Store.service_intake_open is false because units_in_service_count has reached service_bay_capacity"
  - error_id: ERR_SERVICE_CAPACITY_EXCEEDED
    http_status: 409
    when: "the requested service window collides (closed intervals) with as many open tickets as the store's service_bay_capacity"
  - error_id: ERR_STATE_RULE_NOT_CONFIGURED
    http_status: 422
    when: "no StateRtoRule row matches the relevant state_code natural key — the submitted state_code on store creation, the unit's Store.state_code on agreement creation, or the Customer.state_code on verification"
  - error_id: ERR_CREDIT_REPORT_PROHIBITED
    http_status: 422
    when: "a verification request carries credit_score while the customer's state sets credit_inquiry_prohibited = true"
  - error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    when: "disclosure_acknowledged is false while the state requires the total-of-payments disclosure"
  - error_id: ERR_CUSTOMER_NOT_VERIFIED
    http_status: 422
    when: "an agreement is created for a customer whose verification_status is not VERIFIED"
  - error_id: ERR_INSUFFICIENT_REFERENCES
    http_status: 422
    when: "an APPROVE decision is made without government_id_verified or with fewer than two VERIFIED references"
  - error_id: ERR_VERIFICATION_SCORE_TOO_LOW
    http_status: 422
    when: "an APPROVE decision is made while customer_verification_score is below 70"
  - error_id: ERR_TERM_EXCEEDS_STATE_CAP
    http_status: 422
    when: "renewal_count exceeds the state's max_term_renewals"
  - error_id: ERR_CREW_STORE_MISMATCH
    http_status: 422
    when: "the crew belongs to a different store than the agreement"
  - error_id: ERR_CREW_INACTIVE
    http_status: 422
    when: "the crew's status is INACTIVE"
  - error_id: ERR_CREW_NOT_SETUP_CERTIFIED
    http_status: 422
    when: "a DELIVERY_SETUP order for an APPLIANCE unit is assigned to a crew whose setup_certified is false"
  - error_id: ERR_SETUP_NOT_COMPLETED
    http_status: 422
    when: "an APPLIANCE delivery is completed with setup_completed = false"
  - error_id: ERR_REPLACEMENT_UNIT_INVALID
    http_status: 422
    when: "the replacement unit is not AVAILABLE, sits at another store, or is of a different category than the serviced unit"
  - error_id: ERR_TICKET_RESOLUTION_MISMATCH
    http_status: 422
    when: "resolution REPAIRED is submitted for a SWAP_ISSUED ticket, or SWAPPED for a merely SCHEDULED ticket"
  - error_id: ERR_QUIET_HOURS_VIOLATION
    http_status: 422
    when: "the logical clock's UTC hour falls inside the state's quiet hours"
  - error_id: ERR_CONTACT_FREQUENCY_EXCEEDED
    http_status: 422
    when: "the rolling 7-day contact count has already reached max_collection_contacts_per_week"
  - error_id: ERR_CONTACT_CHANNEL_UNAVAILABLE
    http_status: 422
    when: "the requested channel has no usable coordinate on the customer (empty phone/email, or IN_PERSON without consent)"
  - error_id: ERR_COLLECTION_NOTICE_REQUIRED
    http_status: 422
    when: "repossession is attempted with no CollectionContact on record for the agreement"
  - error_id: ERR_REPOSSESSION_EQUITY_PROTECTED
    http_status: 422
    when: "Agreement.paid_pct has reached the state's repossession_paid_pct_limit"
  - error_id: ERR_INVALID_PAYMENT_AMOUNT
    http_status: 422
    when: "amount_cents is below 1"
  - error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    when: "amount_cents exceeds the remaining total-of-payments plus outstanding fees"
  - error_id: ERR_PAYOFF_AMOUNT_MISMATCH
    http_status: 422
    when: "payment_amount_cents differs from the quote's payoff_amount_cents by one cent or more"

# =============================================================================
# §1.7 Roles & Permissions (segregation_of_duties)
# =============================================================================
roles:
  - name: PlatformAdmin
    identity: opaque
    description: "Configuration and break-glass role. Seeds StateRtoRule and Store rows and may call every endpoint; still bound by every state, temporal, fiscal and safety rule, and still bound by segregation of duties on repossession."
  - name: ComplianceOfficer
    identity: opaque
    description: "Approves or rejects customer verification and reads every record for audit. May never create an agreement, post a payment, log a collection contact or authorize a repossession — the officer who approved a customer is structurally barred from repossessing that customer's unit."
  - name: StoreManager
    identity: opaque
    description: "Owns store operations: inventory units, delivery crews, delivery orders and the day-close checkpoint. May post and reverse payments, create agreements, accept payoff quotes and open returns. May not verify customers and may not log collection contacts."
  - name: SalesAssociate
    identity: opaque
    description: "Front-counter role: creates customers and references, records reference-check results, creates agreements, posts renewal payments, issues and accepts early-purchase quotes and opens returns. May not verify customers, reverse payments, grade returns, schedule crews, work collections or repossess."
  - name: CollectionsAgent
    identity: opaque
    description: "Works delinquent accounts only: posts renewal payments, logs collection contacts and authorizes repossession. Has no read or write access to inventory, delivery, service or grading, and cannot create agreements or issue quotes."
  - name: ServiceTechnician
    identity: opaque
    description: "Field and bay role: completes or fails delivery attempts, opens service tickets, issues swaps, resolves tickets and grades returned units. Touches no money — cannot post payments, issue quotes or work collections."
  - name: Customer
    identity: entity_backed:Customer
    description: "The renter. X-User-ID is a Customer.id. May read its own customer row, agreements, payments, reinstatement windows, quotes and ledger entries, request an early-purchase quote, open a service ticket and initiate a return on its own agreement. May never post a payment, accept a quote, grade a return, log a contact or read another customer's data."
