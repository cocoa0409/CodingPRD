            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1055 }, { line_code: "B_TUBING_PACK", quantity: 1, unit_cost_cents: 1155 }, { line_code: "C_CANNULA_SET", quantity: 1, unit_cost_cents: 1255 } ], required_safety_check_codes: ["ACT_BASELINE", "CIRCUIT_INTEGRITY", "GAS_LINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22, revision: 1 }
              as: Surgeon
