            - "R1 (${req1_id}) status == APPROVED with decided_by == 'clin-1'"
            - "R2 (${req2_id}) status == REJECTED with rationale == 'AUTO_RESOLVED' — the cascade's third link"
            - "allocated_total == 40, approved_sub_total == 60, remaining_pool == 0, covered_quantity == 100"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_create_state_gate_beats_fiscal_gate
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - errors[ERR_COMMITMENT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: one order-create
          request violates both the agreement-state gate (agreement SUSPENDED)
          and the fiscal gate (total would exceed the commitment); the state
          error ERR_AGREEMENT_NOT_ACTIVE must win (priority 5 < 10).
        test_recipe:
          setup:
            - "Facility F; product P1 price 100, case 1, multiple 1"
            - "Agreement: committed 95.0, annual_commitment_cents 50000, window 2026-08-01..2027-08-31"
            - "Order O1 (P1 x200) shipped 170 with cancel, received -> rolling 89.47 < 95.0 -> agreement SUSPENDED (spent 20000)"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac P", health_system_name: "HS P", facility_type: "ACUTE_CARE", ship_to_address: "10 Poplar St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "PP-1", name: "Mask", brand_type: "BRANDED", category: "RESPIRATORY", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /supply/prime-vendor-agreements"
              payload: { facility_id: "${fac_id}", committed_fill_rate_pct: 95.0, deliveries_per_week: 5, lum_commitment: false, annual_commitment_cents: 50000, start_date: "2026-08-01", end_date: "2027-08-31" }
              as: SupplyChainAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-10", lines: [ { product_id: "${p1_id}", ordered_qty: 200 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /supply/distribution-orders/${o1_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 170, backorder_cancelled: true } ] }
              as: SupplyChainAdmin
            - call: "POST /supply/distribution-orders/${o1_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
          trigger:
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-20", lines: [ { product_id: "${p1_id}", ordered_qty: 400 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_AGREEMENT_NOT_ACTIVE (state, priority 5)"
            - "ERR_COMMITMENT_EXCEEDED (business_fiscal, priority 10) is NOT reported even though spent 20000 + 40000 > 50000"
      - name: tray_safety_gate_beats_referential_gate
        grounds:
          - validations[priority=6.5]
          - validations[priority=9]
          - errors[ERR_STERILE_COMPONENT_REQUIRED]
          - errors[ERR_PRODUCT_NOT_ORDERABLE]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential: one
          tray create violates both the sterile-assembly rule (component NS is
          non-sterile) and the orderability rule (component DS is
          DISCONTINUED); the safety error ERR_STERILE_COMPONENT_REQUIRED must
          win (priority 6.5 < 9).
        test_recipe:
          setup:
            - "Facility F; product NS: sterile false, availability ACTIVE; product DS: sterile true, availability DISCONTINUED"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac X", health_system_name: "HS X", facility_type: "SURGERY_CENTER", ship_to_address: "11 Maple Ave" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "NS-1", name: "Basin", brand_type: "BRANDED", category: "SURGICAL_INSTRUMENTS", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { ns_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "DS-1", name: "Retired kit", brand_type: "BRANDED", category: "SURGICAL_INSTRUMENTS", sterile: true, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 100, availability: "DISCONTINUED" }
              as: SupplyChainAdmin
              captures: { ds_id: $.data.id }
          trigger:
            - call: "POST /supply/tray-templates"
              payload: { facility_id: "${fac_id}", name: "Mixed tray", procedure_type: "GENERAL", sterile_assembly: true, components: [ { product_id: "${ns_id}", quantity: 1 }, { product_id: "${ds_id}", quantity: 1 } ] }
              as: SupplyChainAdmin
              as_user_id: "admin-9"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_STERILE_COMPONENT_REQUIRED (business_safety, priority 6.5)"
            - "ERR_PRODUCT_NOT_ORDERABLE (business_referential, priority 9) is NOT reported even though DS is DISCONTINUED"

  - rule_id: boundary_precision_check
    instances:
      - name: fill_rate_exactly_committed_is_compliant
        grounds:
          - state_machines.PrimeVendorAgreement.ACTIVE_to_SUSPENDED
          - calculations.rolling_agreement_fill_rate
        distinguishing_aspect: |
          Numeric-threshold boundary on the fill-rate metric reached via
          fulfillment-events: rolling 95.00 == committed 95.0 is COMPLIANT
          (breach is strictly less-than), while 94.92 after the next receipt
          suspends the agreement — and exercises round_half_up at the 2nd
          decimal (94.9166 -> 94.92).
        test_recipe:
          setup:
            - "Facility F; agreement committed_fill_rate_pct 95.0, lum_commitment false, window 2026-08-01..2027-08-31"
            - "Product P1 price 100, case 1, multiple 1"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac B", health_system_name: "HS B", facility_type: "ACUTE_CARE", ship_to_address: "12 Hickory Rd" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "PB-1", name: "Catheter", brand_type: "PRIVATE_LABEL", category: "UROLOGICAL", sterile: true, device_class: "CLASS_II", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /supply/prime-vendor-agreements"
              payload: { facility_id: "${fac_id}", committed_fill_rate_pct: 95.0, deliveries_per_week: 5, lum_commitment: false, annual_commitment_cents: 100000000, start_date: "2026-08-01", end_date: "2027-08-31" }
              as: SupplyChainAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-10", lines: [ { product_id: "${p1_id}", ordered_qty: 200 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /supply/distribution-orders/${oa_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 190, backorder_cancelled: false } ] }
              as: SupplyChainAdmin
            - call: "POST /supply/distribution-orders/${oa_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
              captures: { fa: $.data.final_fill_rate_pct }
            - call: "GET /supply/prime-vendor-agreements/${agr_id}"
              payload: {}
              as: SupplyChainAdmin
              captures: { status_a: $.data.status, roll_a: $.data.rolling_fill_rate_pct }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-18", lines: [ { product_id: "${p1_id}", ordered_qty: 1000 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /supply/distribution-orders/${ob_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 949, backorder_cancelled: false } ] }
              as: SupplyChainAdmin
          trigger:
            - call: "POST /supply/distribution-orders/${ob_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
            - call: "GET /supply/prime-vendor-agreements/${agr_id}"
              payload: {}
              as: SupplyChainAdmin
              captures: { status_b: $.data.status, roll_b: $.data.rolling_fill_rate_pct }
          assert:
            - "Order A final_fill_rate_pct == 95.00 (190/200, open shortfall counted against)"
            - "After A: rolling_fill_rate_pct == 95.00 and status == ACTIVE — equality with committed 95.0 is COMPLIANT (>= boundary)"
            - "Order B final_fill_rate_pct == 94.90 (949/1000)"
            - "After B: rolling_fill_rate_pct == 94.92 (1139/1200 = 94.9166.. rounds half-up) and status == SUSPENDED (94.92 < 95.0)"
      - name: reorder_point_inclusive_boundary_and_zero_critical
        grounds:
          - calculations.reorder_suggestion
          - endpoints."POST /supply/inventory-programs/{id}/stock-events"
        distinguishing_aspect: |
          Integer-quantity boundary reached via stock-events (different metric
          and endpoint from the fill-rate percentage): on_hand == reorder_point
          is DUE (inclusive <=), on_hand == reorder_point + 1 is OK, and
          on_hand == 0 is CRITICAL.
        test_recipe:
          setup:
            - "Facility F; products PA, PB, PC (no agreement -> open_pipeline_qty 0)"
            - "InventoryProgram positions: PA {par 50, reorder 25, on_hand 30}, PB {par 50, reorder 25, on_hand 26}, PC {par 10, reorder 5, on_hand 5}"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac I", health_system_name: "HS I", facility_type: "CLINIC", ship_to_address: "13 Dogwood St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "IA-1", name: "Item A", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "IB-1", name: "Item B", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "IC-1", name: "Item C", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /supply/inventory-programs"
              payload: { facility_id: "${fac_id}", program_type: "CRASH_CART", positions: [ { product_id: "${pa_id}", par_level: 50, reorder_point: 25, on_hand: 30 }, { product_id: "${pb_id}", par_level: 50, reorder_point: 25, on_hand: 26 }, { product_id: "${pc_id}", par_level: 10, reorder_point: 5, on_hand: 5 } ] }
              as: SupplyChainAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /supply/inventory-programs/${prog_id}/stock-events"
              payload: { product_id: "${pa_id}", quantity_delta: -5, event_type: "ISSUE" }
              as: SupplyChainAdmin
            - call: "POST /supply/inventory-programs/${prog_id}/stock-events"
              payload: { product_id: "${pc_id}", quantity_delta: -5, event_type: "ISSUE" }
              as: SupplyChainAdmin
            - call: "GET /supply/inventory-programs/${prog_id}"
              payload: {}
              as: SupplyChainAdmin
          assert:
            - "Position PA: on_hand == 25 == reorder_point -> reorder_status == DUE (inclusive boundary), suggested_order_qty == 25"
            - "Position PB: on_hand == 26 > reorder_point -> reorder_status == OK, suggested_order_qty == 24"
            - "Position PC: on_hand == 0 -> reorder_status == CRITICAL, suggested_order_qty == 10"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: conversion_approve_requires_active_agreement
        grounds:
          - state_machines.ConversionProgram.IN_REVIEW_to_CONVERTED
          - validations[priority=9.2]
        distinguishing_aspect: |
          Entity pair ConversionProgram -> PrimeVendorAgreement: the APPROVE
          transition is gated on a DIFFERENT entity's state (the facility's
          agreement must be ACTIVE and unexpired); a SUSPENDED agreement
          blocks conversion even when every line item passed and is trained.
        test_recipe:
          setup:
            - "Facility F; product P1 price 100 case 1 multiple 1; agreement committed 95.0 window 2026-08-01..2027-08-31"
            - "Order P1 x200 shipped 170 with cancel, received -> agreement SUSPENDED"
            - "Conversion program for F with one line item (incumbent INC, replacement REP, both ACTIVE); evaluation PASSED + training_completed true -> program auto-advanced to IN_REVIEW"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac G", health_system_name: "HS G", facility_type: "ACUTE_CARE", ship_to_address: "14 Sycamore St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "PG-1", name: "Stock item", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "PG-INC", name: "Incumbent dressing", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 50 }
              as: SupplyChainAdmin
              captures: { inc_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "PG-REP", name: "Replacement dressing", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 40 }
              as: SupplyChainAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /supply/prime-vendor-agreements"
              payload: { facility_id: "${fac_id}", committed_fill_rate_pct: 95.0, deliveries_per_week: 5, lum_commitment: false, annual_commitment_cents: 100000000, start_date: "2026-08-01", end_date: "2027-08-31" }
              as: SupplyChainAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-10", lines: [ { product_id: "${p1_id}", ordered_qty: 200 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /supply/distribution-orders/${o1_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 170, backorder_cancelled: true } ] }
              as: SupplyChainAdmin
            - call: "POST /supply/distribution-orders/${o1_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
            - call: "POST /supply/conversion-programs"
              payload: { facility_id: "${fac_id}", name: "Wound care switch", target_categories: ["WOUND_CARE"], line_items: [ { incumbent_product_id: "${inc_id}", replacement_product_id: "${rep_id}" } ] }
              as: ConversionManager
              captures: { prog_id: $.data.id, line_id: "$.data.line_items[0].line_id" }
            - call: "POST /supply/conversion-programs/${prog_id}/line-item-evaluations"
              payload: { line_id: "${line_id}", outcome: "PASSED", training_completed: true, notes: "staff in-serviced" }
              as: Clinician
              as_user_id: "clin-9"
          trigger:
            - call: "POST /supply/conversion-programs/${prog_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: ConversionManager
              captures: { err: $.data.error_id }
          assert:
            - "Program auto-advanced to IN_REVIEW after the evaluation (precondition for the gate test)"
            - "HTTP 409 with error_id == ERR_AGREEMENT_NOT_ACTIVE because agreement ${agr_id} is SUSPENDED (89.47 rolling < 95.0)"
            - "ConversionProgram.${prog_id}.status remains IN_REVIEW"
      - name: lot_release_requires_sterility_passed
        grounds:
          - state_machines.ManufacturingLot.AWAITING_QA_to_RELEASED
          - validations[priority=6.2]
        distinguishing_aspect: |
          Entity pair ManufacturingLot -> SterilizationBatch: the RELEASE
          transition is gated on the derived sterility_status of a DIFFERENT
          entity (the batch containing the lot); RELEASE fails while the batch
          result is PENDING and succeeds only after the batch records PASSED.
        test_recipe:
          setup:
            - "REGISTERED PRIVATE_LABEL sterile product SP"
            - "Lot L of SP (AWAITING_QA, sterility_status PENDING); created by planner-1 so qm-1 may disposition"
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "LS-1", name: "Sterile drape", brand_type: "PRIVATE_LABEL", category: "STERILIZATION_SUPPLIES", sterile: true, device_class: "CLASS_II", units_per_case: 1, each_price_cents: 300 }
              as: SupplyChainAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /supply/products/${sp_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${sp_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-9001", product_id: "${sp_id}", quantity: 500, manufacture_date: "2026-08-20", expiry_date: "2027-08-20" }
              as: ManufacturingPlanner
              as_user_id: "planner-1"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /supply/manufacturing-lots/${lot_id}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QualityManager
              as_user_id: "qm-1"
              captures: { err: $.data.error_id }
            - call: "POST /supply/sterilization-batches"
              payload: { batch_code: "SB-001", chamber_id: "CH-1", scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T12:00:00Z", lot_ids: ["${lot_id}"] }
              as: ManufacturingPlanner
              as_user_id: "planner-1"
              captures: { batch_id: $.data.id }
            - call: "POST /supply/sterilization-batches/${batch_id}/record-sterility-result"
              payload: { result: "PASSED" }
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /supply/manufacturing-lots/${lot_id}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QualityManager
              as_user_id: "qm-1"
              captures: { lot_status: $.data.status }
          assert:
            - "First RELEASE: HTTP 422 error_id == ERR_STERILITY_NOT_PASSED (batch result still PENDING)"
            - "After batch PASSED: lot ${lot_id}.sterility_status == PASSED (visible via GET /supply/manufacturing-lots/${lot_id})"
            - "Second RELEASE: lot status == RELEASED"
            - "Registration gate also satisfied throughout (SP was REGISTERED), isolating the sterility dependency"

