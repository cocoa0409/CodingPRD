      - name: withdrawn_draft_disclosure_is_locked_and_cascades_nothing
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Disclosure.DRAFT_to_WITHDRAWN
          - state_machines.Disclosure.terminal_states
          - errors[ERR_DISCLOSURE_INVALID_STATE]
        distinguishing_aspect: "WITHDRAWN is terminal: after a DRAFT row is withdrawn (the divergent branch that fires no draft/inquiry/company cascade) both publish and a second withdraw return ERR_DISCLOSURE_INVALID_STATE and the row stays at version 2."
