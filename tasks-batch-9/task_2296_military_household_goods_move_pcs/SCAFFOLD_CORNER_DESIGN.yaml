              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { block_ref: $.data.capacity_block_id }
          assert:
            - "${err_id} == ERR_STALE_CAPACITY_BLOCK_VERSION with HTTP 412, not ERR_CAPACITY_EXCEEDED — the peak general pool is 9000 and only 5286 is committed"
            - "${committed_mid} == 5286 and ${cb_v2} != ${cb_v}: the refused award added nothing"
            - "the retry with ${cb_v2} returns HTTP 200 with ${block_ref} == ${cb_id} and the block then reports committed_lbs == 5580"

      - name: active_shipment_count_reconciles_after_create_and_cancel_and_deliver
        claim_type: derived_field_reconciliation
        grounds:
          - entities[ServiceMember.active_shipment_count]
          - state_machines[Shipment.movement_status]
        distinguishing_aspect: >-
          The member-level counter is not a create-only tally: it goes 2 -> 1 on cancellation and
          1 -> 0 on delivery, so both exit states have to be excluded from the same derived count.
        test_recipe:
          setup:
            - "One member with two shipments on one authorized entitlement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /hhg/service-members"
              payload: { dod_id: "7000000063", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id, count_initial: $.data.active_shipment_count }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-C-63", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
            - call: "POST /hhg/counseling-sessions"
              payload: { order_id: "${o_id}", session_type: "IN_PERSON", scheduled_at: "2026-08-05T00:00:00Z" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { cs_id: $.data.id }
            - call: "POST /hhg/counseling-sessions/${cs_id}/complete"
              payload: { entitlement_briefed: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/counseling-sessions/${cs_id}/entitlements"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_id: "$.data[0].id" }
            - call: "POST /hhg/entitlements/${ent_id}/authorize"
              payload: { admin_weight_bump_lbs: 0 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v: $.data.version }
            - call: "POST /hhg/tsps"
              payload: { name: "Chesapeake Van Lines", scac_code: "CVLQ", markets: ["MKT-BWI"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_id: $.data.id }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-C63A", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-17T00:00:00Z", requested_delivery_date: "2026-08-24T00:00:00Z", expected_entitlement_version: "${ent_v}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { s1_id: $.data.id }
            - call: "GET /hhg/entitlements/${ent_id}"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v2: $.data.version }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-C63B", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-16T00:00:00Z", requested_pickup_date: "2026-08-19T00:00:00Z", requested_delivery_date: "2026-08-26T00:00:00Z", expected_entitlement_version: "${ent_v2}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { s2_id: $.data.id }
            - call: "GET /hhg/service-members/${m_id}"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { count_two: $.data.active_shipment_count }
          trigger:
            - call: "POST /hhg/shipments/${s2_id}/cancel"
              payload: { cancel_reason: "CONSOLIDATED INTO ONE SHIPMENT" }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/service-members/${m_id}"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { count_after_cancel: $.data.active_shipment_count }
            - call: "POST /hhg/shipments/${s1_id}/survey"
              payload: { estimate_method: "CUBE_X7", room_estimates: [{ room_name: "KITCHEN", cube_feet: 143.5 }, { room_name: "LIVING_ROOM", cube_feet: 268.25 }, { room_name: "MASTER_BEDROOM", cube_feet: 210.5 }, { room_name: "GARAGE", cube_feet: 96.75 }] }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/capacity-blocks"
              payload: { tsp_id: "${tsp_id}", market_code: "MKT-BWI", week_start_date: "2026-08-17T00:00:00Z", total_capacity_lbs: 12000, short_notice_reserve_pct: 0.15 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { cb_id: $.data.id, cb_v: $.data.version }
            - call: "POST /hhg/capacity-blocks/${cb_id}/awards"
              payload: { shipment_id: "${s1_id}", expected_capacity_block_version: "${cb_v}" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s1_id}/pack"
              payload: { pack_date: "2026-08-15T00:00:00Z" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s1_id}/record-actual-weight"
              payload: { actual_gross_lbs: 6200, actual_tare_lbs: 1500, weigh_date: "2026-08-17T00:00:00Z", scale_certified: true }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s1_id}/pickup"
              payload: { actual_pickup_date: "2026-08-17T00:00:00Z" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "GET /hhg/service-members/${m_id}"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { count_picked_up: $.data.active_shipment_count }
            - call: "POST /hhg/shipments/${s1_id}/deliver"
              payload: { delivery_date: "2026-08-20T00:00:00Z" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "GET /hhg/service-members/${m_id}"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { count_final: $.data.active_shipment_count }
          assert:
            - "${count_initial} == 0 and ${count_two} == 2"
            - "${count_after_cancel} == 1: CANCELLED leaves the active set"
            - "${count_picked_up} == 1: PICKED_UP is still active, so the counter only drops at the two exit states"
            - "${count_final} == 0: DELIVERED leaves the active set as well"
            - "GET /hhg/orders/${o_id}/shipments still returns total_count == 2 — the rows survive, only the derived counter moves"

      - name: claim_settlement_cascade_layer_excluded_stub
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile[complexity_layers.cascading_side_effects]
          - state_machines[LossDamageClaim.UNDER_REVIEW->SETTLED]
        excluded_because:
          difficulty_instance: claim_settlement_cascades_four_links_to_capacity_block_restriction
          rationale: >-
            The §1.8 instance already verifies all four links of the settle cascade end to end
            (item settlement, TSP totals, TSP status, capacity block status) with pre-computed
            literals at each link; a §1.9 instance would re-walk the identical chain.

      - name: billable_weight_dual_variant_layer_excluded_stub
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile[complexity_layers.dual_variant_calculation]
          - calculations[billable_weight_determination]
        excluded_because:
          difficulty_instance: billable_weight_provisional_estimate_replaced_by_final_actual
          rationale: >-
            The §1.8 instance drives both variants on one shipment (ESTIMATED 5286 then ACTUAL
            4700) and checks the ledger delta on the switch, which is exactly the layer's claim.

  - section: consistency_model
    instances:
      - name: survey_response_already_carries_the_recomputed_weight_fields
        claim_type: immediate
        grounds:
          - complexity_profile[consistency_model: immediate]
          - calculations[survey_estimated_gross_weight]
        distinguishing_aspect: >-
          No read-after-write delay is tolerated: the survey response itself must already contain
          estimated_gross_lbs 5286 and billable_basis ESTIMATED, and the entitlement read taken
          immediately afterwards must already charge those 5286 lbs.
        test_recipe:
          setup:
            - "Authorized E6-with-dependents entitlement (cap 11000) with one AWARDED shipment."
