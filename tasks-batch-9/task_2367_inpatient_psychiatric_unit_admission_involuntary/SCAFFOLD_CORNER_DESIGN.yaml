      - name: dual_variant_hold_deadline_divergence
        claim_type: correct_result
        excluded_because:
          difficulty_instance: hold_deadline_calendar_vs_judicial_day_variants_diverge
          rationale: "The variant_divergence, variant_selection and correct_result claims for hold_deadline_pair are all driven there: the same clock anchor produces release_deadline_at by exact wall-clock arithmetic and petition_filing_deadline_at by judicial-day rolling, and the case where the two coincide is included."

      - name: dual_variant_monitoring_compliance_divergence
        claim_type: correct_result
        excluded_because:
          difficulty_instance: restraint_monitoring_grid_vs_raw_compliance_diverge
          rationale: "monitoring_compliance_pair's two variants, which one gates debriefing, and the delta between them are established there with a 30-minute mechanical restraint scoring grid 50.0 against raw 100.0."

      - name: acuity_tier_threshold_boundaries
        claim_type: correct_result
        excluded_because:
          difficulty_instance: acuity_tier_thresholds_at_six_seven_eleven_and_twelve
          rationale: "The threshold algorithm's boundary claims for acuity_score_and_tier - scores 6, 7, 11 and 12 mapping to LOW, MODERATE, MODERATE and HIGH - are exhaustively covered there, including the inclusive lower bounds."

      - name: bed_placement_selector_ordering
        claim_type: correct_result
        excluded_because:
          difficulty_instance: bed_selector_cohort_filter_then_exact_fit_then_occupancy_rank
          rationale: "The multi-key selector - cohort filtering before exact-fit bed_type preference before occupancy ranking, with Bed.room_number then bed_label as deterministic tie-breaks - is exercised there against a unit stocked to make every key matter."

      - name: aggregation_rounding_order_for_observation_hours
        claim_type: precision
        excluded_because:
          difficulty_instance: observation_quarter_hours_per_episode_ceiling_before_sum
          rationale: "The pinned per-episode-ceiling-then-sum order (two 20-minute episodes yielding 4 quarter-hours rather than ceil(40/15) = 3) is the entire subject of that difficulty instance."

      - name: business_hours_response_deadline_calendar_skips
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: hold_rescission_cascades_to_voluntary_then_grants_discharge_request
          rationale: "The 24-business-hour walk with weekend and HOLIDAY_DATES skipping is asserted as a literal there (requested_at 2026-09-03T08:00:00Z -> response_deadline_at 2026-09-08T14:00:00.000Z), and the corner instance compliance_sweep_expires_unanswered_discharge_request_and_flags_violation additionally pins that deadline's inclusive edge."

