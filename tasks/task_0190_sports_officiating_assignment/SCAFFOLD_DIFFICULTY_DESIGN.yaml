        distinguishing_aspect: "business_safety (rank, P7) vs business_constraint (travel radius, P11): a ROOKIE offered a REFEREE slot at a far venue violates both; P7 wins => ERR_RANK_INELIGIBLE."
        test_recipe:
          setup:
            - "League OPEN; ROOKIE official home (lat 40, lon -75) far from venue (lat 41, lon -75 => ~69mi > max_travel 50)."
