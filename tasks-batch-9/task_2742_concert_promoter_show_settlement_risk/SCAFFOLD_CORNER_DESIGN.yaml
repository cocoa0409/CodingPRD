              as: TalentBuyer
              captures: { va_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${va_ar_id}", venue_id: "${va_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { va_sh_id: $.data.id, va_sh_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${va_sh_id}", expected_show_version: "${va_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 500000, deposit_cents: 0, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { va_of_id: $.data.id }
            - call: "POST /offers/${va_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${va_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${va_ar_id}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${va_sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 400 }
              as: TalentBuyer
              captures: { va_tt_id: $.data.id }
            - call: "POST /shows/${va_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${va_tt_id}/sales"
              payload: { qty: 395 }
              as: TalentBuyer
              captures: { va_avail_before: $.data.available_qty }
          trigger:
            # priority 21, clause 1 - load_in_at is not before event_at
            - call: "POST /shows"
              payload: { artist_id: "${va_ar_id}", venue_id: "${va_vn_id}", event_at: "2026-12-20T02:00:00.000Z", load_in_at: "2026-12-21T00:00:00.000Z", load_out_at: "2026-12-22T00:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { va_err_window1: $.data.error_id }
            # priority 21, clause 2 - announce_at is after event_at
            - call: "POST /shows"
              payload: { artist_id: "${va_ar_id}", venue_id: "${va_vn_id}", event_at: "2026-12-20T02:00:00.000Z", load_in_at: "2026-12-19T14:00:00.000Z", load_out_at: "2026-12-20T08:00:00.000Z", announce_at: "2026-12-25T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { va_err_window2: $.data.error_id }
            # priority 22 - a perfectly coherent window, entirely in the past
            - call: "POST /shows"
              payload: { artist_id: "${va_ar_id}", venue_id: "${va_vn_id}", event_at: "2026-07-15T02:00:00.000Z", load_in_at: "2026-07-14T14:00:00.000Z", load_out_at: "2026-07-15T08:00:00.000Z", announce_at: "2026-07-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { va_err_past: $.data.error_id }
            # priority 45 - duplicate tier name, small enough that capacity is not the issue
            - call: "POST /ticket-tiers"
              payload: { show_id: "${va_sh_id}", tier_name: "GA", price_cents: 3000, allocation_qty: 10 }
              as: TalentBuyer
              captures: { va_err_dupe: $.data.error_id }
            # priority 33 - one seat too many, on the sale site
            - call: "POST /ticket-tiers/${va_tt_id}/sales"
              payload: { qty: 6 }
              as: TalentBuyer
              captures: { va_err_oversell: $.data.error_id }
            # priority 33 - one seat too many, on the hold site
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${va_tt_id}", kind: "PROMOTER_HOLD", qty: 6, holder: "Promoter friends" }
              as: TalentBuyer
              captures: { va_err_overhold: $.data.error_id }
            # exactly available_qty must PASS
            - call: "POST /ticket-tiers/${va_tt_id}/sales"
              payload: { qty: 5 }
              as: TalentBuyer
              captures: { va_sold_after: $.data.sold_qty, va_avail_after: $.data.available_qty, va_gross_after: $.data.gross_sold_cents }
            # and now even one seat is too many
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${va_tt_id}", kind: "PROMOTER_HOLD", qty: 1, holder: "Promoter friends" }
              as: TalentBuyer
              captures: { va_err_final: $.data.error_id }
            - call: "GET /shows"
              payload: { venue_id: "${va_vn_id}" }
              as: TalentBuyer
            - call: "GET /ticket-tiers"
              payload: { show_id: "${va_sh_id}" }
              as: TalentBuyer
          assert:
            - "WINDOW, CLAUSE 1 — ${va_err_window1} == ERR_INVALID_SHOW_WINDOW with HTTP 422 (load_in_at 2026-12-21 is after event_at 2026-12-20)"
            - "WINDOW, CLAUSE 2 — ${va_err_window2} == ERR_INVALID_SHOW_WINDOW with HTTP 422: announce_at 2026-12-25 is after event_at 2026-12-20 even though load_in < event < load_out holds; dropping the announce clause is the common miss"
            - "PAST EVENT IS A DIFFERENT RULE — ${va_err_past} == ERR_EVENT_DATE_IN_PAST with HTTP 422, not ERR_INVALID_SHOW_WINDOW: the window itself is coherent, only the clock comparison fails"
            - "DUPLICATE NAME — ${va_err_dupe} == ERR_DUPLICATE_TIER_NAME with HTTP 409 (a conflict, not a 422); the 10-seat allocation keeps 400 + 10 well under the 1000 capacity so priority 44 cannot be what fired"
            - "OVER-SALE, BOTH SITES — ${va_err_oversell} == ${va_err_overhold} == ERR_INSUFFICIENT_TIER_INVENTORY with HTTP 422; ${va_avail_before} == 5 and 6 is one too many on the sale endpoint and on the hold endpoint alike"
            - "EXACTLY AVAILABLE PASSES — the 5-seat sale returns 200 with ${va_sold_after} == 400, ${va_avail_after} == 0 and ${va_gross_after} == 2000000; the rule is qty <= available_qty, not qty < available_qty"
            - "AT ZERO EVEN ONE IS TOO MANY — ${va_err_final} == ERR_INSUFFICIENT_TIER_INVENTORY 422"
            - "NO PARTIAL WRITES — GET /shows?venue_id=${va_vn_id} returns total_count 1 (none of the three refused shows exists) and GET /ticket-tiers?show_id=${va_sh_id} returns total_count 1 with the tier still named GA"

      - name: settlement_offer_and_claim_rule_violations_each_return_their_own_error_id
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=20]"
          - "validations[priority=27]"
          - "validations[priority=37]"
          - "validations[priority=38]"
          - "validations[priority=39]"
          - "validations[priority=43]"
          - "validations[priority=46]"
        distinguishing_aspect: "Seven rules from the back half of the catalog, each on a fixture where only that rule can fail, plus the two satisfaction mirrors that share the fixture: a claim filed at exactly occurred_at + 30 days PASSES while the same call one millisecond later is 422, and the settlement that was refused for an unresolved variance calculates cleanly the moment the variance is decided. The invoice probe is the sharp one: both the show_id and the budget_line_id exist, so every 404 passes and only the cross-reference coherence rule at priority 20 can fire."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market Rule Market limit 5000000 (so 2x the limit is exactly 10000000), Venue Rule Hall cap 1000 / facility 0 / tax 0, six Artists so the 36-hour routing buffer never interferes."
            - "Show X: ON_SALE on an accepted FLAT_GUARANTEE offer of 300000, GA 5000 x 400 with 100 sold; one PRODUCTION line budgeted 200000 (is_artist_deductible false) whose single 260000 invoice is APPROVED, so the line sits at variance_pct 30.00 / PENDING_APPROVAL / required_approver_role RISK_OFFICER."
            - "Show Y: PLANNED, no offer, carrying its own PRODUCTION line L2 budgeted 50000 — the wrong-show line for the invoice probe, the bogus replacement for the reschedule probe, and the target of the exposure-override probe."
            - "Show Z: PLANNED with an offer SUBMITTED at 2026-08-01T00:00:00Z, so expires_at is 2026-08-04T00:00:00.000Z."
            - "Show P: CONFIRMED, then POSTPONED by a POSTPONED cancellation event, so it has an OPENED event to reschedule."
            - "Shows W1 and W2: identical, ON_SALE with GA 5000 x 200 and 100 sold each, on accepted offers of guarantee 500000 / deposit 100000."
            - "All six shows have disjoint half-open load windows at the one venue and distinct artists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Rule Market", region_code: "RL", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { rl_mk_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${rl_mk_id}", name: "Rule Hall", gross_capacity: 1000, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { rl_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Rule Act X", agency: "Rul Talent", tier: "THEATER", historical_sellthrough_pct: 60.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { rl_ar_x: $.data.id }
            - call: "POST /artists"
              payload: { name: "Rule Act Y", agency: "Rul Talent", tier: "THEATER", historical_sellthrough_pct: 60.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { rl_ar_y: $.data.id }
            - call: "POST /artists"
              payload: { name: "Rule Act Z", agency: "Rul Talent", tier: "THEATER", historical_sellthrough_pct: 60.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { rl_ar_z: $.data.id }
            - call: "POST /artists"
              payload: { name: "Rule Act P", agency: "Rul Talent", tier: "THEATER", historical_sellthrough_pct: 60.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { rl_ar_p: $.data.id }
            - call: "POST /artists"
              payload: { name: "Rule Act W One", agency: "Rul Talent", tier: "CLUB", historical_sellthrough_pct: 50.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { rl_ar_w1: $.data.id }
            - call: "POST /artists"
              payload: { name: "Rule Act W Two", agency: "Rul Talent", tier: "CLUB", historical_sellthrough_pct: 50.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { rl_ar_w2: $.data.id }
            # ---- show X
            - call: "POST /shows"
              payload: { artist_id: "${rl_ar_x}", venue_id: "${rl_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
