# =============================================================================
# §1.8: Scaffold Difficulty Design — Test Targeting Index
# Nine rules x 2 instances each. All times use the logical clock
# (startup default 2026-09-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: purchase_split_developer_first_vs_platform_first
        grounds:
          - calculations.purchase_split
          - entities.Purchase.fields.platform_fee_cents
          - entities.Purchase.fields.developer_share_cents
        distinguishing_aspect: |
          Dual-variant on the Purchase domain: DEVELOPER_FIRST (pinned) computes
          developer_share = gross - round_half_up(gross * rate) first; PLATFORM_FIRST
          rounds the fee first. For gross 101 cents at 30% the pinned mode yields
          developer_share = 101 - round_half_up(30.3) = 71 and platform_fee = 30,
          whereas platform_first would floor the developer remainder to 70 — the
          two variants diverge by exactly 1 cent on identical input.
        test_recipe:
          setup:
            - "Activated developer with a RELEASED title priced at 101 USD cents (tier 1, 30%)"
            - "Active buyer user account"
          setup_api_calls:
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Split Studio", contact_email: "split@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Cent Split", base_price_usd_cents: 101, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/release-now"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/user-accounts"
              payload: { email: "buyer1@players.example" }
              as: PlatformOps
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /storefront/purchases"
              payload: { user_account_id: "${u_id}", title_id: "${t_id}", currency: "USD" }
              as: User
              as_user_id: "${u_id}"
          assert:
            - "Purchase.gross_price_cents == 101"
            - "Purchase.developer_share_cents == 71 (pinned DEVELOPER_FIRST: 101 - round_half_up(101*0.30))"
            - "Purchase.platform_fee_cents == 30"
            - "Purchase.platform_fee_cents + Purchase.developer_share_cents == 101"

      - name: review_score_weighted_vs_unweighted
        grounds:
          - calculations.review_score_aggregation
          - entities.Title.fields.review_score_bps
        distinguishing_aspect: |
          Dual-variant on the Review domain: WEIGHTED (pinned) weights each review by
          max(1, floor(sqrt(author_playtime_minutes))); UNWEIGHTED counts 1 each.
          With one positive review at playtime 25 (weight 5) and one negative at
          playtime 0 (weight 1) the pinned weighted score is 10000*5/6 = 8333 bps,
          while unweighted would give 5000 bps — the variants diverge on identical data.
        test_recipe:
          setup:
            - "RELEASED title with two distinct owner accounts: owner A with 25 minutes playtime, owner B with 0 minutes"
            - "Logical clock at 2026-09-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformOps
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Score Studio", contact_email: "score@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Score Game", base_price_usd_cents: 2000, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/release-now"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/user-accounts"
              payload: { email: "ownerA@players.example" }
              as: PlatformOps
              captures: { u_a: $.data.id }
            - call: "POST /storefront/user-accounts"
              payload: { email: "ownerB@players.example" }
              as: PlatformOps
              captures: { u_b: $.data.id }
            - call: "POST /storefront/purchases"
              payload: { user_account_id: "${u_a}", title_id: "${t_id}", currency: "USD" }
              as: User
              as_user_id: "${u_a}"
              captures: { p_a: $.data.id }
            - call: "POST /storefront/purchases/${p_a}/playtime"
              payload: { minutes: 25 }
              as: User
              as_user_id: "${u_a}"
            - call: "POST /storefront/purchases"
              payload: { user_account_id: "${u_b}", title_id: "${t_id}", currency: "USD" }
              as: User
              as_user_id: "${u_b}"
            - call: "GET /storefront/titles/${t_id}"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_v1: $.data.version }
            - call: "POST /storefront/reviews"
              payload: { title_id: "${t_id}", user_account_id: "${u_a}", is_positive: true, body: "deep and great", expected_title_version: "${t_v1}" }
              as: User
              as_user_id: "${u_a}"
            - call: "GET /storefront/titles/${t_id}"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_v2: $.data.version }
            - call: "POST /storefront/reviews"
              payload: { title_id: "${t_id}", user_account_id: "${u_b}", is_positive: false, body: "not for me", expected_title_version: "${t_v2}" }
              as: User
              as_user_id: "${u_b}"
          trigger:
            - call: "GET /storefront/titles/${t_id}"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
          assert:
            - "Title.${t_id}.review_score_bps == 8333 (pinned WEIGHTED: 10000*5/(5+1) round_half_up)"
            - "Unweighted alternative would be 5000 — weighted diverges from unweighted on identical reviews"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: regional_price_multifactor_branch
        grounds:
          - calculations.regional_price_recommendation
          - entities.RegionPriceOverride.fields.deviation_bps
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — base USD price x FX x
          PPP multiplier, then a conditional branch (override present vs absent)
          selecting the effective price. EUR effective price with an ACTIVE 800-cent
          override is 800 while the recommendation is round_half_up(6000*0.92*0.90) = 4968.
        test_recipe:
          setup:
            - "RELEASED title, base_price_usd_cents 6000, EUR override of 800 cents (deviation -84% would breach the 2500 bps cap, so use 4000 cents: deviation round_half_up((4000-4968)*10000/4968) = -1950 bps, inside cap)"
            - "Title version captured for OCC"
          setup_api_calls:
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Price Studio", contact_email: "price@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Price Game", base_price_usd_cents: 6000, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/release-now"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_v: $.data.version }
            - call: "POST /storefront/regional-prices"
              payload: { title_id: "${t_id}", currency: "EUR", price_cents: 4000, expected_title_version: "${t_v}" }
              as: Developer
              as_user_id: "${dv_id}"
          trigger:
            - call: "GET /storefront/titles/${t_id}/pricing-recommendation"
              payload: { currency: "EUR" }
              as: Developer
              as_user_id: "${dv_id}"
          assert:
            - "recommended_cents == 4968 (round_half_up(6000 * 0.92 * 0.90))"
            - "effective_cents == 4000 (ACTIVE override branch wins over recommendation)"
            - "usd_recognized_per_unit == 4348 (round_half_up(4000 / 0.92))"

      - name: workshop_share_nested_rounding_order
        grounds:
          - calculations.workshop_creator_share
          - entities.WorkshopSale.fields.creator_share_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — creator share floored FIRST
          and platform absorbs the remainder. gross 999 cents at 3333 bps gives
          creator floor(999*3333/10000) = 332 and platform 667; the reversed order
          (platform floored first) would give creator 333 / platform 666.
        test_recipe:
          setup:
            - "RELEASED host title; PUBLISHED workshop item priced 999 cents with creator_share_bps 3333; active buyer"
          setup_api_calls:
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Mod Studio", contact_email: "mod@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Mod Game", base_price_usd_cents: 2000, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/release-now"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/user-accounts"
              payload: { email: "creator@players.example" }
              as: PlatformOps
              captures: { u_cr: $.data.id }
            - call: "POST /storefront/user-accounts"
              payload: { email: "buyer@players.example" }
              as: PlatformOps
              captures: { u_by: $.data.id }
            - call: "POST /storefront/workshop-items"
              payload: { title_id: "${t_id}", creator_account_id: "${u_cr}", item_name: "Skin Pack", price_cents: 999, creator_share_bps: 3333 }
              as: User
              as_user_id: "${u_cr}"
              captures: { wi_id: $.data.id }
            - call: "POST /storefront/workshop-items/${wi_id}/publish"
              payload: {}
              as: User
              as_user_id: "${u_cr}"
          trigger:
            - call: "POST /storefront/workshop-sales"
              payload: { workshop_item_id: "${wi_id}", buyer_account_id: "${u_by}" }
              as: User
              as_user_id: "${u_by}"
              captures: { ws_id: $.data.id }
          assert:
            - "WorkshopSale.${ws_id}.gross_cents == 999"
            - "WorkshopSale.${ws_id}.creator_share_cents == 332 (floor(999*3333/10000) = floor(332.9667))"
            - "WorkshopSale.${ws_id}.platform_share_cents == 667 (999 - 332; platform absorbs remainder)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: title_review_reject_resubmit_cycle
        grounds:
          - state_machines.Title
          - state_machines.StorePageReview
        distinguishing_aspect: |
          Title runs a revision cycle DRAFT -> PENDING_REVIEW -> DRAFT -> ... ->
          APPROVED -> RELEASE_SCHEDULED -> APPROVED (two distinct back-edges), and
          the review sequence counter increments per loop iteration — non-linear
          cyclic shape on the Title entity.
        test_recipe:
          setup:
            - "Active developer; title submitted once, rejected back to DRAFT (submission_seq 1 REJECTED)"
          setup_api_calls:
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Loop Studio", contact_email: "loop@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Loop Game", base_price_usd_cents: 1500, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr1: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr1}/reject"
              payload: { review_notes: "capsule art missing" }
              as: StoreReviewer
          trigger:
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr2_id: $.data.1.id, spr2_seq: $.data.1.submission_seq }
            - call: "POST /storefront/store-page-reviews/${spr2_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/schedule-release"
              payload: { release_at: "2026-09-20T00:00:00Z" }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/titles/${t_id}/cancel-release"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
          assert:
            - "Second StorePageReview.submission_seq == 2 (cycle counter advanced)"
            - "Title.${t_id}.status == APPROVED after schedule then cancel (RELEASE_SCHEDULED -> APPROVED back-edge)"
            - "Title.${t_id}.scheduled_release_at == null after cancel"
            - "Title.${t_id}.review_notes == 'capsule art missing' persists from rejection"

      - name: user_account_restrict_unrestrict_cycle
        grounds:
          - state_machines.UserAccount
        distinguishing_aspect: |
          UserAccount cycles ACTIVE -> RESTRICTED -> ACTIVE (manual or system-driven),
          a different entity than Title: RESTRICTED blocks refund creation while
          purchases remain blocked only for BANNED, and the cycle can repeat.
        test_recipe:
          setup:
            - "Active user account"
          setup_api_calls:
            - call: "POST /storefront/user-accounts"
              payload: { email: "cycler@players.example" }
              as: PlatformOps
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /storefront/user-accounts/${u_id}/restrict"
              payload: {}
              as: TrustSafety
            - call: "POST /storefront/user-accounts/${u_id}/unrestrict"
              payload: {}
              as: TrustSafety
            - call: "POST /storefront/user-accounts/${u_id}/restrict"
              payload: {}
              as: TrustSafety
          assert:
            - "UserAccount.${u_id}.status == RESTRICTED after the second restrict (cycle re-entered)"
            - "UserAccount.${u_id}.refund_restricted == true"
            - "UserAccount.${u_id}.version == 4 (one increment per transition from initial 1)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: refund_cascades_through_title_tier_to_key_batch_gate
        grounds:
          - state_machines.Purchase.COMPLETED_to_REFUNDED
          - state_machines.ActivationKeyBatch
          - calculations.revenue_share_tier_evaluation
        distinguishing_aspect: |
          Depth-3 cascade: RefundRequest APPROVED -> Purchase REFUNDED -> Title
          recognized revenue debited and current_tier re-evaluated AND
          refund_abuse_flag recomputed -> ActivationKeyBatch approval blocked by
          ERR_GRAY_MARKET_RISK. Each link is caused by the previous link, not by
          the original request.
        test_recipe:
          setup:
            - "RELEASED title with 4 completed USD purchases at 1000 cents each"
            - "One purchase (buyer P1) fully auto-refunded (0 playtime, same day) leaving 3 sales; a second refund attempt on another purchase with playtime 200 stays REQUESTED"
            - "Title.lifetime_recognized_revenue_usd_cents == 3000 after the first refund; refund_abuse_flag true after a second completed refund (2 refunds > 0.30 * 2 remaining sales is false; need 2 refunds vs 2 remaining: complete the second refund via manual approve so refunds=2, sales=2, 2 > 0.6 true)"
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /storefront/developer-accounts"
              payload: { company_name: "Cascade Studio", contact_email: "cascade@studio.example" }
              as: PlatformOps
              captures: { dv_id: $.data.id }
            - call: "POST /storefront/developer-accounts/${dv_id}/payment-info"
              payload: { pay_fee: true, submit_bank_details: true }
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/developer-accounts/${dv_id}/activate"
              payload: {}
              as: PlatformOps
            - call: "POST /storefront/titles"
              payload: { developer_account_id: "${dv_id}", title_name: "Cascade Game", base_price_usd_cents: 1000, early_access: false }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { t_id: $.data.id }
            - call: "POST /storefront/titles/${t_id}/submit-review"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "GET /storefront/titles/${t_id}/store-page-reviews"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
              captures: { spr_id: $.data.0.id }
            - call: "POST /storefront/store-page-reviews/${spr_id}/approve"
              payload: {}
              as: StoreReviewer
            - call: "POST /storefront/titles/${t_id}/release-now"
              payload: {}
              as: Developer
              as_user_id: "${dv_id}"
            - call: "POST /storefront/user-accounts"
              payload: { email: "p1@players.example" }
              as: PlatformOps
              captures: { u1: $.data.id }
            - call: "POST /storefront/user-accounts"
              payload: { email: "p2@players.example" }
              as: PlatformOps
              captures: { u2: $.data.id }
            - call: "POST /storefront/user-accounts"
              payload: { email: "p3@players.example" }
              as: PlatformOps
              captures: { u3: $.data.id }
            - call: "POST /storefront/user-accounts"
              payload: { email: "p4@players.example" }
              as: PlatformOps
              captures: { u4: $.data.id }
            - call: "POST /storefront/purchases"
              payload: { user_account_id: "${u1}", title_id: "${t_id}", currency: "USD" }
              as: User
              as_user_id: "${u1}"
              captures: { p1: $.data.id }
            - call: "POST /storefront/purchases"
              payload: { user_account_id: "${u2}", title_id: "${t_id}", currency: "USD" }
              as: User
              as_user_id: "${u2}"
              captures: { p2: $.data.id }
            - call: "POST /storefront/purchases"
              payload: { user_account_id: "${u3}", title_id: "${t_id}", currency: "USD" }
              as: User
              as_user_id: "${u3}"
            - call: "POST /storefront/purchases"
              payload: { user_account_id: "${u4}", title_id: "${t_id}", currency: "USD" }
              as: User
              as_user_id: "${u4}"
            - call: "POST /storefront/purchases/${p2}/playtime"
              payload: { minutes: 200 }
              as: User
              as_user_id: "${u2}"
            - call: "POST /storefront/refund-requests"
              payload: { purchase_id: "${p1}", reason: "not fun" }
              as: User
              as_user_id: "${u1}"
            - call: "POST /storefront/refund-requests"
              payload: { purchase_id: "${p2}", reason: "ran badly" }
              as: User
              as_user_id: "${u2}"
              captures: { rr2: $.data.id }
            - call: "POST /storefront/refund-requests/${rr2}/approve"
              payload: {}
              as: TrustSafety
            - call: "POST /storefront/key-batches"
              payload: { title_id: "${t_id}", requested_quantity: 100, free_keys_in_batch: 0 }
              as: Developer
              as_user_id: "${dv_id}"
              captures: { kb_id: $.data.id }
          trigger:
            - call: "POST /storefront/key-batches/${kb_id}/approve"
              payload: {}
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with ERR_GRAY_MARKET_RISK (2 refunds > 0.30 * 2 remaining sales)"
            - "Title.${t_id}.refund_abuse_flag == true"
            - "Title.${t_id}.lifetime_recognized_revenue_usd_cents == 2000"
            - "ActivationKeyBatch.${kb_id}.status == REQUESTED (unchanged)"

      - name: developer_suspend_delists_title_then_blocks_sale
        grounds:
          - state_machines.DeveloperAccount.ACTIVE_to_SUSPENDED
          - state_machines.Title
