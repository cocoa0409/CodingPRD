              as_user_id: "${est}"
              captures: { b2: $.data.id }
            - call: "POST /menu-boards/${b2}/listings"
              payload: { menu_item_id: "${item}", sodium_warning_icon: false }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "POST /menu-boards/${b2}/publish"
              payload: { effective_from: "2026-09-01T00:00:00Z" }
              as: MenuboardPublisher
              as_user_id: "${est}"
          trigger:
            - call: "POST /menu-boards/${b1}/publish"
              payload: { effective_from: "2026-09-15T00:00:00Z" }
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_BOARD_NOT_DRAFT"
            - "trigger response data.error_id != ERR_BOARD_WINDOW_CONFLICT even though the requested window also collides with B2"
            - "MenuBoard.${b1}.effective_from == 2026-08-01T00:00:00Z and MenuBoard.${b1}.effective_to == 2026-09-01T00:00:00Z (unchanged)"
            - "MenuBoard.${b2}.effective_from == 2026-09-01T00:00:00Z and MenuBoard.${b2}.effective_to == null (unchanged)"
            - "MenuBoard.${b1}.publication_status == PUBLISHED and MenuBoard.${b2}.publication_status == PUBLISHED"

      - name: succinct_statement_mismatch_outranks_undeclared_item_calories
        grounds:
          - validations[priority=28]
          - validations[priority=30]
          - errors[ERR_SUCCINCT_STATEMENT_MISMATCH]
          - errors[ERR_ITEM_CALORIES_UNDECLARED]
          - entities.Jurisdiction.required_succinct_statement_variant
          - entities.MenuBoard.succinct_statement_variant
          - entities.MenuItem.labeling_status
          - endpoints[POST /menu-boards/{id}/publish]
