              captures: { slot_id: $.data.id }
            - call: "POST /bed-runs"
              payload: { bed_id: "${bed_id}", mix_design_id: "${mix_id}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-04T06:00:00Z" }
