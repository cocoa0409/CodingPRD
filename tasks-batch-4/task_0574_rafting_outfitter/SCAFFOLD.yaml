# =============================================================================
# Whitewater Rafting & River Outfitter — Seed Tables (§1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: |
  574. Whitewater Rafting & River Outfitter: trip type (river/class) & date,
  capacity & guide-to-guest ratio, gear (raft/wetsuit/PFD) assignment, waiver &
  age/weight rule, shuttle & put-in/take-out, weather/flow cancellation,
  group/private & photo add-on, deposit/gratuity

domain_name: rafting-outfitter
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # flat: peer entities (RiverTrip, Guide, Reservation, Guest, Waiver, GearItem,
  # ShuttleVehicle, ...) linked by foreign keys carried in request bodies; no
  # nesting in URL paths. Every collection is a root-level sibling.

  state_machine_shape: parallel
  # Reservation carries two independent dimensions (payment_status ×
  # fulfillment_status); RiverTrip is cyclic/posture-driven
  # (OPEN <-> FULL <-> WEATHER_HOLD). Both are non-linear.

  relationship_patterns:
    - one_to_many        # RiverTrip -> Reservation, Reservation -> Guest
    - cross_aggregate    # GearAssignment references GearItem + Guest + RiverTrip

  role_model: peer_roles
  # OutfitterManager owns trips/guides/gear/shuttle inventory; Reservationist
  # owns bookings/payments/check-in/gear assignment; SafetyOfficer owns river
  # condition readings and safety cancellation; Guest self-serves their waiver.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RiverTrip
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: river_name, type: string, source: input, description: "Named river run (e.g., Gauley, Arkansas)" }
      - { name: difficulty_class, type: enum, source: input, description: "Whitewater class", constraints: "one of CLASS_I|CLASS_II|CLASS_III|CLASS_IV|CLASS_V" }
      - { name: trip_date, type: datetime, source: input, description: "Launch/departure instant (ISO 8601 UTC); interval start for guide overlap" }
      - { name: end_time, type: datetime, source: input, description: "Scheduled take-out instant (ISO 8601 UTC); must be > trip_date; interval end (half-open) for guide overlap" }
      - { name: put_in_location, type: string, source: input, description: "Put-in access point name" }
      - { name: take_out_location, type: string, source: input, description: "Take-out access point name" }
      - { name: max_capacity, type: integer, source: input, description: "Maximum committed guests across all confirmed reservations", constraints: ">= 1" }
      - { name: guide_ratio_max, type: integer, source: input, description: "Maximum guests one guide may cover (guide-to-guest ratio ceiling)", constraints: ">= 1" }
      - { name: base_rate_cents, type: integer, source: input, description: "Per-guest base fare in cents", constraints: ">= 0" }
      - { name: min_age, type: integer, source: input, description: "Minimum guest age for this run", default: 0, constraints: ">= 0" }
      - { name: safe_flow_min, type: number, source: input, description: "Lower bound of the SAFE flow band in CFS (inclusive)" }
      - { name: safe_flow_max, type: number, source: input, description: "Upper bound of the SAFE flow band in CFS (inclusive)" }
      - { name: marginal_flow_max, type: number, source: input, description: "Upper bound of the MARGINAL flow band in CFS (inclusive); above this is UNSAFE" }
      - { name: booking_mode, type: enum, source: computed, description: "Set to PRIVATE once a PRIVATE reservation is confirmed, else GROUP", default: "GROUP", constraints: "one of GROUP|PRIVATE" }
      - { name: committed_guests, type: integer, source: computed, description: "Sum of party_size over reservations whose fulfillment_status IN {CONFIRMED, CHECKED_IN, COMPLETED}" }
      - { name: assigned_guide_count, type: integer, source: computed, description: "Count of GuideAssignment rows for this trip with status = ASSIGNED" }
      - { name: deposits_held_cents, type: integer, source: computed, description: "Sum of deposit_cents over reservations whose payment_status IN {DEPOSIT_PAID, SETTLED}" }
      - { name: status, type: enum, source: system, description: "Posture gate", constraints: "one of SCHEDULED|OPEN|FULL|WEATHER_HOLD|CANCELLED|COMPLETED" }

  - name: Guide
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: full_name, type: string, source: input, description: "Guide display name" }
      - { name: max_class, type: enum, source: input, description: "Highest whitewater class this guide is certified to lead", constraints: "one of CLASS_I|CLASS_II|CLASS_III|CLASS_IV|CLASS_V" }
      - { name: status, type: enum, source: system, description: "Employment status", default: "ACTIVE", constraints: "one of ACTIVE|INACTIVE" }

  - name: GuideAssignment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: trip_id, type: string, source: input, description: "FK -> RiverTrip.id" }
      - { name: guide_id, type: string, source: input, description: "FK -> Guide.id" }
      - { name: role, type: enum, source: input, description: "Guide role on this trip", constraints: "one of LEAD|SAFETY|SWEEP" }
      - { name: provisional_gratuity_share_cents, type: integer, source: computed, description: "Equal-split estimate of pooled gratuity, refreshed on each reservation settlement", default: 0 }
      - { name: final_gratuity_share_cents, type: integer, source: computed, description: "Role-weighted gratuity share, computed at trip completion", default: 0 }
      - { name: status, type: enum, source: system, description: "Assignment lifecycle", constraints: "one of ASSIGNED|RELEASED" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: trip_id, type: string, source: input, description: "FK -> RiverTrip.id" }
      - { name: booking_type, type: enum, source: input, description: "GROUP shares the trip; PRIVATE buys out remaining capacity on confirm", constraints: "one of GROUP|PRIVATE" }
      - { name: party_size, type: integer, source: input, description: "Number of booked guests on this reservation", constraints: ">= 1" }
      - { name: photo_addon, type: boolean, source: input, description: "Whether the photo package add-on was purchased", default: false }
      - { name: deposit_cents, type: integer, source: input, description: "Deposit amount tendered at booking in cents", constraints: ">= 0" }
      - { name: gratuity_cents, type: integer, source: input, description: "Gratuity tendered at settlement in cents; supplied on settle, 0 before", default: 0, constraints: ">= 0" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Provisional charge computed at booking from party_size" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final charge computed at settlement from checked-in guest count" }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension (independent of fulfillment)", constraints: "one of UNPAID|DEPOSIT_PAID|SETTLED|REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "Fulfillment dimension (independent of payment)", constraints: "one of PENDING|CONFIRMED|CHECKED_IN|COMPLETED|CANCELLED" }
      - { name: checked_in_guest_count, type: integer, source: computed, description: "Count of Guest rows on this reservation with status = CHECKED_IN", default: 0 }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only; equals X-User-ID when acting as Guest" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id" }
      - { name: full_name, type: string, source: input, description: "Guest legal name" }
      - { name: age, type: integer, source: input, description: "Guest age in years at trip date", constraints: ">= 0" }
      - { name: weight_lbs, type: number, source: input, description: "Guest weight in pounds; used for PFD sizing", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Guest lifecycle", constraints: "one of BOOKED|CHECKED_IN|REMOVED" }

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: guardian_required, type: boolean, source: computed, description: "True when the guest's age < GUARDIAN_AGE_THRESHOLD (18) at creation" }
      - { name: guardian_name, type: string, source: input, description: "Signing guardian name; required to sign when guardian_required is true", default: null }
      - { name: status, type: enum, source: system, description: "Waiver lifecycle", constraints: "one of PENDING|SIGNED|VOID" }

  - name: GearItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: gear_type, type: enum, source: input, description: "Kind of gear", constraints: "one of RAFT|WETSUIT|PFD" }
      - { name: size_label, type: string, source: input, description: "Human size label (e.g., M, L, XL)" }
      - { name: min_weight_lbs, type: number, source: input, description: "Lowest wearer weight this item safely fits (inclusive); relevant for PFD/WETSUIT", default: 0 }
      - { name: max_weight_lbs, type: number, source: input, description: "Highest wearer weight this item safely fits (inclusive); relevant for PFD/WETSUIT", default: 100000 }
      - { name: status, type: enum, source: system, description: "Inventory lifecycle", constraints: "one of AVAILABLE|ASSIGNED|OUT_OF_SERVICE" }

  - name: GearAssignment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: gear_item_id, type: string, source: input, description: "FK -> GearItem.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: trip_id, type: string, source: input, description: "FK -> RiverTrip.id" }
      - { name: status, type: enum, source: system, description: "Assignment lifecycle", constraints: "one of ASSIGNED|RELEASED" }

  - name: ShuttleVehicle
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: name, type: string, source: input, description: "Vehicle display name" }
      - { name: seat_capacity, type: integer, source: input, description: "Passenger seats", constraints: ">= 1" }

  - name: ShuttleRun
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: trip_id, type: string, source: input, description: "FK -> RiverTrip.id" }
      - { name: shuttle_vehicle_id, type: string, source: input, description: "FK -> ShuttleVehicle.id" }
      - { name: direction, type: enum, source: input, description: "Leg direction", constraints: "one of TO_PUT_IN|FROM_TAKE_OUT" }
      - { name: depart_time, type: datetime, source: input, description: "Departure instant (ISO 8601 UTC); interval start" }
      - { name: arrive_time, type: datetime, source: input, description: "Arrival instant (ISO 8601 UTC); must be > depart_time; interval end" }
      - { name: status, type: enum, source: system, description: "Run lifecycle", constraints: "one of SCHEDULED|CANCELLED" }

  - name: RiverConditionReading
    parent: null
    common_fields: false   # append-only event log: carries only id + created_at
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: trip_id, type: string, source: input, description: "FK -> RiverTrip.id" }
      - { name: flow_cfs, type: number, source: input, description: "Observed river flow in cubic feet per second" }
      - { name: reading_time, type: datetime, source: input, description: "When the reading was taken (ISO 8601 UTC)" }
      - { name: resulting_band, type: enum, source: computed, description: "Band this reading classifies the flow into", constraints: "one of SAFE|MARGINAL|UNSAFE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RiverTrip
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /trips/{id}/open"
        actor: OutfitterManager
        preconditions:
          - "trip.assigned_guide_count >= 1 (ERR_NO_GUIDE_ASSIGNED)"
        side_effects:
          - "Trip becomes bookable; reservations may be confirmed"

      - from: OPEN
        to: FULL
        trigger: "system: reservation confirm pushes committed_guests to max_capacity, OR a PRIVATE reservation confirms"
        actor: system
        preconditions:
          - "committed_guests == max_capacity OR confirming reservation.booking_type == PRIVATE"
        side_effects:
          - "If triggered by a PRIVATE confirm, RiverTrip.booking_mode := PRIVATE"
          - "New reservation confirmations are blocked while FULL"

      - from: FULL
        to: OPEN
        trigger: "system: a CONFIRMED/CHECKED_IN reservation cancels and frees capacity below max_capacity"
        actor: system
        preconditions:
          - "committed_guests < max_capacity after the cancellation"
          - "booking_mode is GROUP (a PRIVATE buy-out does not reopen until its reservation cancels)"
        side_effects:
          - "Trip becomes bookable again"

      - from: [OPEN, FULL]
        to: WEATHER_HOLD
        trigger: "system: POST /condition-readings classifies flow as MARGINAL"
        actor: system
        preconditions:
          - "resulting_band == MARGINAL"
        side_effects:
          - "Reservation confirm and check-in are blocked while WEATHER_HOLD"

      - from: WEATHER_HOLD
        to: OPEN
        trigger: "system: POST /condition-readings classifies flow as SAFE"
        actor: system
        preconditions:
          - "resulting_band == SAFE"
        side_effects:
          - "Trip becomes bookable again (recomputed to FULL on next confirm if at capacity)"

      - from: [OPEN, FULL, WEATHER_HOLD, SCHEDULED]
        to: CANCELLED
        trigger: "system: POST /condition-readings classifies flow as UNSAFE  |  POST /trips/{id}/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE L1: every Reservation on this trip with fulfillment_status IN {PENDING, CONFIRMED, CHECKED_IN} -> fulfillment_status := CANCELLED"
          - "each such Reservation with payment_status IN {DEPOSIT_PAID, SETTLED} -> payment_status := REFUNDED (deposit refunded; deposits_held_cents recomputed)"
          - "each cancelled Reservation's ASSIGNED GearAssignments -> RELEASED (each release sets its GearItem.status := AVAILABLE)"
          - "each cancelled Reservation's Guests -> REMOVED; their SIGNED/PENDING Waivers -> VOID"
          - "every ASSIGNED GuideAssignment on this trip -> RELEASED"
          - "every SCHEDULED ShuttleRun on this trip -> CANCELLED"

      - from: [OPEN, FULL]
        to: COMPLETED
        trigger: "POST /trips/{id}/complete"
        actor: OutfitterManager
        preconditions:
          - "no Reservation on this trip has fulfillment_status == PENDING (ERR_UNRESOLVED_RESERVATIONS)"
          - "every CHECKED_IN reservation has payment_status == SETTLED (ERR_UNSETTLED_RESERVATION)"
        side_effects:
          - "every CHECKED_IN Reservation -> fulfillment_status := COMPLETED"
          - "final_gratuity_share_cents computed for every ASSIGNED GuideAssignment (role-weighted)"

  - entity: Reservation
    field: fulfillment_status
    initial_state: PENDING
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: Reservationist
        preconditions:
          - "parent RiverTrip.status IN {OPEN, FULL} (ERR_TRIP_NOT_BOOKABLE)  [cross-entity: Reservation depends on RiverTrip]"
          - "committed_guests + party_size <= max_capacity (ERR_CAPACITY_EXCEEDED)"
          - "if booking_type == PRIVATE, no other reservation is CONFIRMED/CHECKED_IN on the trip (ERR_PRIVATE_CONFLICT)"
        side_effects:
          - "RiverTrip.committed_guests recomputed (+party_size)"
          - "If committed_guests reaches max_capacity or booking_type == PRIVATE, RiverTrip OPEN -> FULL"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check-in"
        actor: Reservationist
        preconditions:
          - "parent RiverTrip.status IN {OPEN, FULL} (ERR_TRIP_NOT_BOOKABLE)"
          - "assigned_guide_count >= required_guides for the trip (ERR_GUIDE_RATIO_UNMET)  [cross-entity: Reservation depends on GuideAssignment]"
          - "every non-REMOVED Guest on the reservation has a SIGNED Waiver (ERR_WAIVER_NOT_SIGNED)  [cross-entity: Reservation depends on Waiver]"
          - "every non-REMOVED Guest on the reservation has an ASSIGNED PFD GearAssignment (ERR_GEAR_NOT_ASSIGNED)"
        side_effects:
          - "every non-REMOVED Guest on the reservation -> status := CHECKED_IN"
          - "checked_in_guest_count recomputed"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Reservationist
        preconditions: []
        side_effects:
          - "CASCADE L2 origin: RiverTrip.committed_guests recomputed (-party_size); if trip FULL and now below capacity and booking_mode GROUP, FULL -> OPEN"
          - "ASSIGNED GearAssignments of this reservation's guests -> RELEASED (each release sets GearItem.status := AVAILABLE)"
          - "Guests -> REMOVED; their Waivers -> VOID"
          - "if payment_status IN {DEPOSIT_PAID, SETTLED}, payment_status := REFUNDED (deposits_held_cents recomputed)"

      - from: [PENDING, CHECKED_IN]
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Reservationist
        preconditions: []
        side_effects:
          - "same release + refund cascade as CONFIRMED -> CANCELLED"

  - entity: Reservation
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /reservations/{id}/pay-deposit"
        actor: Reservationist
        preconditions:
          - "fulfillment_status != CANCELLED (ERR_RESERVATION_CANCELLED)"
          - "deposit_cents >= required deposit = round_half_up(estimated_total_cents * 0.25) (ERR_DEPOSIT_TOO_LOW)"
        side_effects:
          - "RiverTrip.deposits_held_cents recomputed (+deposit_cents)"

      - from: DEPOSIT_PAID
        to: SETTLED
        trigger: "POST /reservations/{id}/settle"
        actor: Reservationist
        preconditions:
          - "fulfillment_status == CHECKED_IN (ERR_NOT_CHECKED_IN)"
        side_effects:
          - "gratuity_cents set from request; final_total_cents computed"
          - "provisional_gratuity_share_cents recomputed (equal split) for every ASSIGNED GuideAssignment on the trip"

      - from: [UNPAID, DEPOSIT_PAID, SETTLED]
        to: REFUNDED
        trigger: "system: reservation cancellation or trip cancellation cascade"
        actor: system
        preconditions:
          - "cancellation occurred while payment_status IN {DEPOSIT_PAID, SETTLED}"
        side_effects:
          - "RiverTrip.deposits_held_cents recomputed (-deposit_cents)"

  - entity: Guest
    field: status
    initial_state: BOOKED
    terminal_states: [REMOVED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "system: parent Reservation check-in"
        actor: system
        preconditions: []
        side_effects: []

      - from: [BOOKED, CHECKED_IN]
        to: REMOVED
        trigger: "POST /guests/{id}/remove  |  system: reservation/trip cancellation cascade"
        actor: Reservationist
        preconditions: []
        side_effects:
          - "CASCADE L2 alt origin: the guest's ASSIGNED GearAssignments -> RELEASED (each release sets GearItem.status := AVAILABLE)"
          - "the guest's Waiver -> VOID"
          - "parent Reservation.checked_in_guest_count recomputed"

  - entity: Waiver
    field: status
    initial_state: PENDING
    terminal_states: [VOID]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /waivers/{id}/sign"
        actor: Guest
        preconditions:
          - "acting Guest owns the waiver: X-User-ID == waiver.guest_id (ERR_NOT_WAIVER_OWNER)"
          - "if guardian_required is true, guardian_name is present in the request (ERR_GUARDIAN_REQUIRED)"
        side_effects: []

      - from: [PENDING, SIGNED]
        to: VOID
        trigger: "system: guest removal or reservation/trip cancellation cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GearItem
    field: status
    initial_state: AVAILABLE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /gear-assignments"
        actor: Reservationist
        preconditions:
          - "gear item status == AVAILABLE (ERR_GEAR_UNAVAILABLE)"
        side_effects:
          - "a GearAssignment (status ASSIGNED) is created linking this item to a guest and trip"

      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system: GearAssignment release (via POST /gear-assignments/{id}/release, guest removal, or cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /gear-items/{id}/retire"
        actor: OutfitterManager
        preconditions:
          - "gear item status == AVAILABLE (ERR_GEAR_UNAVAILABLE)"
        side_effects: []

  - entity: GearAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /gear-assignments/{id}/release  |  system: guest removal or cancellation cascade"
        actor: Reservationist
        preconditions: []
        side_effects:
          - "linked GearItem.status := AVAILABLE"

  - entity: GuideAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /guide-assignments/{id}/release  |  system: trip cancellation cascade"
        actor: OutfitterManager
        preconditions: []
        side_effects:
          - "RiverTrip.assigned_guide_count recomputed (-1)"

  - entity: ShuttleRun
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shuttle-runs/{id}/cancel  |  system: trip cancellation cascade"
        actor: OutfitterManager
        preconditions: []
        side_effects: []

  - entity: Guide
    field: status
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /guides/{id}/deactivate"
        actor: OutfitterManager
        preconditions:
          - "guide has no ASSIGNED GuideAssignment on a non-terminal trip (ERR_GUIDE_IN_USE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-trip
    parent_entity: RiverTrip
    write_endpoint: "POST /reservations"
    occ_field: "expected_trip_version"
    description: |
      Creating a Reservation against a RiverTrip whose version has advanced since
      the client last observed it is rejected. Booking attaches the reservation to
      the trip and advances RiverTrip.version; a client whose expected_trip_version
      is behind the current trip version has a stale view of the trip's booking set
      (another reservation may already have consumed the capacity the client
      intended to claim) and is rejected. Two strictly sequential creates carrying
      the same expected_trip_version: the first advances the version, the second is
      stale.
    error_id: ERR_STALE_TRIP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reservation_estimated_total
    trigger: "on POST /reservations (booking); provisional variant"
    algorithm: tiered_pricing
    formula: |
      disc = group_discount_pct(party_size)          # see group_discount tiers
      base = round_half_up(base_rate_cents * party_size * (1 - disc))
      photo = PHOTO_FEE_CENTS if photo_addon else 0
      estimated_total_cents = base + photo
    input_set: "single Reservation at creation; party_size is the booked count"
    constants:
      PHOTO_FEE_CENTS: 4000
    precision: "integer cents, round_half_up applied to the base term before adding photo"
    variants:
      - name: provisional_at_booking
        when: "reservation creation"
        difference: "uses party_size (booked count); this is the estimate the deposit is derived from"

  - name: reservation_final_total
    trigger: "on POST /reservations/{id}/settle; final variant"
    algorithm: tiered_pricing
    formula: |
      disc = group_discount_pct(party_size)          # tier keyed on the BOOKED party_size
      base = round_half_up(base_rate_cents * checked_in_guest_count * (1 - disc))
      photo = PHOTO_FEE_CENTS if photo_addon else 0
      final_total_cents = base + photo + gratuity_cents
    input_set: "single Reservation at settlement; charges only checked-in guests"
    constants:
      PHOTO_FEE_CENTS: 4000
    precision: "integer cents, round_half_up applied to the base term before adding photo + gratuity"
    variants:
      - name: final_at_settlement
        when: "reservation settlement"
        difference: "uses checked_in_guest_count (actuals) instead of party_size; diverges from the estimate whenever a guest was removed. Discount tier still keyed on booked party_size."

  - name: group_discount_pct
    trigger: "helper used by estimated and final totals"
    algorithm: threshold
    formula: |
      if party_size >= 8: return 0.15
      elif party_size >= 4: return 0.10
      else: return 0.00
    input_set: "the reservation's booked party_size"
    constants:
      TIER1_MIN: 4
      TIER1_PCT: 0.10
      TIER2_MIN: 8
      TIER2_PCT: 0.15
    precision: "exact decimal fractions"

  - name: required_guides
    trigger: "checked on POST /reservations/{id}/check-in and on POST /guide-assignments/{id}/release"
    algorithm: threshold
    formula: |
      required_guides = ceil(committed_guests / guide_ratio_max)
      # boundary: committed_guests == guide_ratio_max -> 1 guide; +1 guest -> 2 guides
    input_set: "RiverTrip.committed_guests and guide_ratio_max"
    constants: {}
    precision: "integer; ceiling division"

  - name: deposits_held_cents
    trigger: "recomputed on pay-deposit, settle, reservation cancel, trip cancel"
    algorithm: aggregation
    formula: |
      deposits_held_cents = sum(r.deposit_cents
                                for r in Reservations where r.trip_id == trip.id
                                and r.payment_status IN {DEPOSIT_PAID, SETTLED})
    input_set: "reservations of the trip in payment_status DEPOSIT_PAID or SETTLED"
    constants: {}
    precision: "integer cents"

  - name: serviceable_gear_count
    trigger: "invariant checked after any gear assign/release"
    algorithm: aggregation
    formula: |
      serviceable_gear_count(T) = count(GearItem where gear_type == T and status == AVAILABLE)
                                + count(GearItem where gear_type == T and status == ASSIGNED)
      # OUT_OF_SERVICE items are excluded; assign moves AVAILABLE->ASSIGNED and
      # release moves ASSIGNED->AVAILABLE, so this sum is invariant across a
      # forward-assign + compensating-release cycle.
    input_set: "all GearItem rows of type T not OUT_OF_SERVICE"
    constants: {}
    precision: "integer count"

  - name: provisional_gratuity_share_cents
    trigger: "on POST /reservations/{id}/settle; equal-split variant"
    algorithm: waterfall_allocation
    formula: |
      pool = sum(r.gratuity_cents for r in Reservations of trip where r.payment_status == SETTLED)
      guides = GuideAssignments of trip with status == ASSIGNED, ordered by created_at ASC (tie-break created_at, never id)
      n = count(guides)
      if n == 0: no distribution
      base_share = floor(pool / n)
      remainder = pool - base_share * n
      each guide gets base_share; the first `remainder` guides (created_at ASC) get +1 cent
    input_set: "pooled gratuity of SETTLED reservations; ASSIGNED guide assignments"
    constants: {}
    precision: "integer cents; floor then distribute remainder by created_at ASC"
    variants:
      - name: equal_split
        when: "on each settlement (provisional)"
        difference: "ignores guide role; every guide shares equally"

  - name: final_gratuity_share_cents
    trigger: "on POST /trips/{id}/complete; role-weighted variant"
    algorithm: weighted_scoring
    formula: |
      pool = sum(r.gratuity_cents for r in Reservations of trip where r.payment_status == SETTLED)
      guides = GuideAssignments of trip with status == ASSIGNED, ordered by created_at ASC
      weight(role) = LEAD:3, SAFETY:2, SWEEP:1
      W = sum(weight(g.role) for g in guides)
      if W == 0: no distribution
      raw_share(g) = floor(pool * weight(g.role) / W)
      remainder = pool - sum(raw_share)
      distribute the `remainder` leftover cents one at a time to guides ordered by
      created_at ASC (never by id)
    input_set: "pooled gratuity of SETTLED reservations; ASSIGNED guide assignments with roles"
    constants:
      WEIGHT_LEAD: 3
      WEIGHT_SAFETY: 2
      WEIGHT_SWEEP: 1
    precision: "integer cents; floor per guide then distribute remainder by created_at ASC (round-per-guide-then-remainder order is pinned)"
    variants:
      - name: role_weighted
        when: "at trip completion (final)"
        difference: "weights by role (LEAD>SAFETY>SWEEP), diverging from the equal-split provisional shares"

  - name: flow_safety_band
    trigger: "on POST /condition-readings"
    algorithm: threshold
    formula: |
      if flow_cfs >= safe_flow_min and flow_cfs <= safe_flow_max: band = SAFE
      elif flow_cfs > safe_flow_max and flow_cfs <= marginal_flow_max: band = MARGINAL
      else: band = UNSAFE      # flow_cfs < safe_flow_min OR flow_cfs > marginal_flow_max
      # boundary: flow == safe_flow_max -> SAFE (inclusive); flow == safe_flow_max + epsilon -> MARGINAL
    input_set: "the reading's flow_cfs against the trip's safe/marginal bounds"
    constants: {}
    precision: "band boundaries are inclusive at safe_flow_min, safe_flow_max, marginal_flow_max"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id referenced in the path or FK body field exists (validated left-to-right)"
    error_id: "ERR_TRIP_NOT_FOUND | ERR_GUIDE_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_GUEST_NOT_FOUND | ERR_WAIVER_NOT_FOUND | ERR_GEAR_NOT_FOUND | ERR_GEAR_ASSIGNMENT_NOT_FOUND | ERR_GUIDE_ASSIGNMENT_NOT_FOUND | ERR_SHUTTLE_VEHICLE_NOT_FOUND | ERR_SHUTTLE_RUN_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids or FK bodies

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition (e.g., trip bookable, reservation not cancelled, gear available)"
    error_id: "ERR_TRIP_NOT_BOOKABLE | ERR_INVALID_TRIP_STATE | ERR_RESERVATION_CANCELLED | ERR_NOT_CHECKED_IN | ERR_INVALID_RESERVATION_STATE | ERR_GEAR_UNAVAILABLE | ERR_INVALID_GEAR_STATE | ERR_WAIVER_NOT_PENDING | ERR_GUIDE_IN_USE | ERR_UNRESOLVED_RESERVATIONS | ERR_NO_GUIDE_ASSIGNED"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 5
    category: business_safety
    check: "Age/weight safety: guest.age >= trip.min_age; guardian waiver for minors; PFD weight within [min_weight_lbs, max_weight_lbs]"
    error_id: "ERR_GUEST_UNDER_MIN_AGE | ERR_GUARDIAN_REQUIRED | ERR_WEIGHT_OUT_OF_RANGE"
    http_status: 422
    applies_to: "POST /guests, POST /waivers/{id}/sign, POST /gear-assignments"

  - priority: 6
    category: business_referential
    check: "Referential compatibility: guide max_class >= trip difficulty_class; PFD assignment gear_type must be PFD for the check-in gear requirement; waiver must be SIGNED before check-in"
    error_id: "ERR_GUIDE_CLASS_INSUFFICIENT | ERR_WAIVER_NOT_SIGNED | ERR_GEAR_NOT_ASSIGNED"
    http_status: 409
    applies_to: "POST /guide-assignments, POST /reservations/{id}/check-in"

  - priority: 7
    category: business_constraint
    check: "Capacity, ratio, uniqueness, private buyout, and resource temporal-overlap constraints"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_GUIDE_RATIO_UNMET | ERR_PRIVATE_CONFLICT | ERR_GUIDE_DOUBLE_BOOKED | ERR_SHUTTLE_BUFFER_CONFLICT | ERR_DUPLICATE_GEAR_TYPE"
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm, POST /reservations/{id}/check-in, POST /guide-assignments, POST /shuttle-runs, POST /gear-assignments"

  - priority: 8
    category: business_fiscal
    check: "Deposit sufficiency: deposit_cents >= round_half_up(estimated_total_cents * 0.25) (DEPOSIT_PCT = 0.25, i.e. 25%)"
    error_id: ERR_DEPOSIT_TOO_LOW
    http_status: 402
    applies_to: "POST /reservations/{id}/pay-deposit"

  - priority: 9
    category: state
    check: "OCC: expected_trip_version matches current RiverTrip.version on reservation create"
    error_id: ERR_STALE_TRIP_VERSION
    http_status: 412
    applies_to: "POST /reservations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- RiverTrip ----
  - method: POST
    path: "/trips"
    description: "Create a RiverTrip (status SCHEDULED)"
    roles: [OutfitterManager]
    code: 201
    input: [river_name, difficulty_class, trip_date, end_time, put_in_location, take_out_location, max_capacity, guide_ratio_max, base_rate_cents, "min_age?", safe_flow_min, safe_flow_max, marginal_flow_max]
    output: RiverTrip
    side_effects: ["status := SCHEDULED; booking_mode := GROUP; committed_guests, assigned_guide_count, deposits_held_cents := 0"]

  - method: GET
    path: "/trips"
    description: "List RiverTrips"
    roles: [OutfitterManager, Reservationist, SafetyOfficer, Guest]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RiverTrip[]
    side_effects: []

  - method: GET
    path: "/trips/{id}"
    description: "Get a RiverTrip"
    roles: [OutfitterManager, Reservationist, SafetyOfficer, Guest]
    code: 200
    input: []
    output: RiverTrip
    side_effects: []

  - method: POST
    path: "/trips/{id}/open"
    description: "Open a SCHEDULED trip for booking"
    roles: [OutfitterManager]
    code: 200
    input: []
    output: RiverTrip
    side_effects: ["status SCHEDULED -> OPEN"]

  - method: POST
    path: "/trips/{id}/complete"
    description: "Complete a trip; finalize gratuity shares"
    roles: [OutfitterManager]
    code: 200
    input: []
    output: RiverTrip
    side_effects: ["CHECKED_IN reservations -> COMPLETED; final_gratuity_share_cents computed for each ASSIGNED GuideAssignment"]

  - method: POST
    path: "/trips/{id}/cancel"
    description: "Manually cancel a trip (safety authority); triggers full cascade"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: RiverTrip
    side_effects: ["status -> CANCELLED; CASCADE L1 over reservations, gear, guides, shuttle runs, waivers, deposits"]

  # ---- Guide ----
  - method: POST
    path: "/guides"
    description: "Create a Guide"
    roles: [OutfitterManager]
    code: 201
    input: [full_name, max_class]
    output: Guide
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/guides"
    description: "List Guides"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Guide[]
    side_effects: []

  - method: GET
    path: "/guides/{id}"
    description: "Get a Guide"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: []
    output: Guide
    side_effects: []

  - method: POST
    path: "/guides/{id}/deactivate"
    description: "Deactivate a Guide"
    roles: [OutfitterManager]
    code: 200
    input: []
    output: Guide
    side_effects: ["status ACTIVE -> INACTIVE"]

  # ---- GuideAssignment ----
  - method: POST
    path: "/guide-assignments"
    description: "Assign a guide to a trip; enforces certification class and guide temporal-overlap"
    roles: [OutfitterManager]
    code: 201
    input: [trip_id, guide_id, role]
    output: GuideAssignment
    side_effects: ["status := ASSIGNED; RiverTrip.assigned_guide_count recomputed (+1)"]

  - method: GET
    path: "/guide-assignments"
    description: "List/filter guide assignments"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: ["trip_id?", "guide_id?", "status?", "limit?", "offset?"]
    output: GuideAssignment[]
    side_effects: []

  - method: GET
    path: "/guide-assignments/{id}"
    description: "Get a guide assignment"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: []
    output: GuideAssignment
    side_effects: []

  - method: POST
    path: "/guide-assignments/{id}/release"
    description: "Release a guide assignment"
    roles: [OutfitterManager]
    code: 200
    input: []
    output: GuideAssignment
    side_effects: ["status ASSIGNED -> RELEASED; RiverTrip.assigned_guide_count recomputed (-1)"]

  # ---- Reservation ----
  - method: POST
    path: "/reservations"
    description: "Create a Reservation (OCC on the parent trip via expected_trip_version)"
    roles: [Reservationist]
    code: 201
    input: [trip_id, booking_type, party_size, "photo_addon?", deposit_cents, expected_trip_version]
    output: Reservation
    side_effects:
      - "payment_status := UNPAID; fulfillment_status := PENDING"
      - "estimated_total_cents computed"
      - "increments RiverTrip.version by 1"

  - method: GET
    path: "/reservations"
    description: "List/filter reservations"
    roles: [OutfitterManager, Reservationist, SafetyOfficer, Guest]
    code: 200
    input: ["trip_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/reservations/{id}"
    description: "Get a Reservation"
    roles: [OutfitterManager, Reservationist, SafetyOfficer, Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/reservations/{id}/confirm"
    description: "Confirm a reservation; commits capacity"
    roles: [Reservationist]
    code: 200
    input: []
    output: Reservation
    side_effects: ["fulfillment_status PENDING -> CONFIRMED; committed_guests recomputed; trip may transition OPEN -> FULL"]

  - method: POST
    path: "/reservations/{id}/pay-deposit"
    description: "Record the deposit payment"
    roles: [Reservationist]
    code: 200
    input: []
    output: Reservation
    side_effects: ["payment_status UNPAID -> DEPOSIT_PAID; RiverTrip.deposits_held_cents recomputed"]

  - method: POST
    path: "/reservations/{id}/check-in"
    description: "Check in a reservation; enforces guide ratio, waivers, gear"
    roles: [Reservationist]
    code: 200
    input: []
    output: Reservation
    side_effects: ["fulfillment_status CONFIRMED -> CHECKED_IN; guests -> CHECKED_IN; checked_in_guest_count recomputed"]

  - method: POST
    path: "/reservations/{id}/settle"
    description: "Settle a reservation with gratuity; computes final total; distributes provisional gratuity"
    roles: [Reservationist]
    code: 200
    input: [gratuity_cents]
    output: Reservation
    side_effects: ["payment_status DEPOSIT_PAID -> SETTLED; final_total_cents computed; provisional_gratuity_share_cents recomputed for ASSIGNED guides"]

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a reservation; releases gear, refunds deposit, reopens capacity"
    roles: [Reservationist]
    code: 200
    input: []
    output: Reservation
    side_effects: ["fulfillment_status -> CANCELLED; CASCADE L2 (gear release, guests removed, waivers void, deposit refund, trip FULL -> OPEN)"]

  # ---- Guest ----
  - method: POST
    path: "/guests"
    description: "Add a Guest to a reservation; auto-creates a PENDING Waiver"
    roles: [Reservationist]
    code: 201
    input: [reservation_id, full_name, age, weight_lbs]
    output: Guest
    side_effects: ["status := BOOKED; a Waiver (status PENDING, guardian_required derived from age) is created for the guest"]

  - method: GET
    path: "/guests"
    description: "List/filter guests"
    roles: [OutfitterManager, Reservationist, SafetyOfficer, Guest]
    code: 200
    input: ["reservation_id?", "status?", "limit?", "offset?"]
    output: Guest[]
    side_effects: []

  - method: GET
    path: "/guests/{id}"
    description: "Get a Guest"
    roles: [OutfitterManager, Reservationist, SafetyOfficer, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: POST
    path: "/guests/{id}/remove"
    description: "Remove a guest from a reservation; releases their gear, voids waiver"
    roles: [Reservationist]
    code: 200
    input: []
    output: Guest
    side_effects: ["status -> REMOVED; CASCADE L2 alt (gear release -> gear available, waiver -> VOID, checked_in_guest_count recomputed)"]

  # ---- Waiver ----
  - method: GET
    path: "/waivers"
    description: "List/filter waivers"
    roles: [OutfitterManager, Reservationist, SafetyOfficer, Guest]
    code: 200
    input: ["guest_id?", "status?", "limit?", "offset?"]
    output: Waiver[]
    side_effects: []

  - method: GET
    path: "/waivers/{id}"
    description: "Get a Waiver"
    roles: [OutfitterManager, Reservationist, SafetyOfficer, Guest]
    code: 200
    input: []
    output: Waiver
    side_effects: []

  - method: POST
    path: "/waivers/{id}/sign"
    description: "Guest signs their own waiver"
    roles: [Guest]
    code: 200
    input: ["guardian_name?"]
    output: Waiver
    side_effects: ["status PENDING -> SIGNED"]

  # ---- GearItem ----
  - method: POST
    path: "/gear-items"
    description: "Create a GearItem"
    roles: [OutfitterManager]
    code: 201
    input: [gear_type, size_label, "min_weight_lbs?", "max_weight_lbs?"]
    output: GearItem
    side_effects: ["status := AVAILABLE"]

  - method: GET
    path: "/gear-items"
    description: "List/filter gear items"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: ["gear_type?", "status?", "limit?", "offset?"]
    output: GearItem[]
    side_effects: []

  - method: GET
    path: "/gear-items/{id}"
    description: "Get a GearItem"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: []
    output: GearItem
    side_effects: []

  - method: POST
    path: "/gear-items/{id}/retire"
    description: "Retire a gear item (out of service)"
    roles: [OutfitterManager]
    code: 200
    input: []
    output: GearItem
    side_effects: ["status AVAILABLE -> OUT_OF_SERVICE"]

  # ---- GearAssignment ----
  - method: POST
    path: "/gear-assignments"
    description: "Assign a gear item to a guest for a trip; enforces PFD weight range and availability"
    roles: [Reservationist]
    code: 201
    input: [gear_item_id, guest_id, trip_id]
    output: GearAssignment
    side_effects: ["status := ASSIGNED; linked GearItem.status AVAILABLE -> ASSIGNED"]

  - method: GET
    path: "/gear-assignments"
    description: "List/filter gear assignments"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: ["gear_item_id?", "guest_id?", "trip_id?", "status?", "limit?", "offset?"]
    output: GearAssignment[]
    side_effects: []

  - method: GET
    path: "/gear-assignments/{id}"
    description: "Get a gear assignment"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: []
    output: GearAssignment
    side_effects: []

  - method: POST
    path: "/gear-assignments/{id}/release"
    description: "Release a gear assignment; frees the gear item"
    roles: [Reservationist]
    code: 200
    input: []
    output: GearAssignment
    side_effects: ["status ASSIGNED -> RELEASED; linked GearItem.status -> AVAILABLE"]

  # ---- ShuttleVehicle ----
  - method: POST
    path: "/shuttle-vehicles"
    description: "Create a ShuttleVehicle"
    roles: [OutfitterManager]
    code: 201
    input: [name, seat_capacity]
    output: ShuttleVehicle
    side_effects: []

  - method: GET
    path: "/shuttle-vehicles"
    description: "List shuttle vehicles"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ShuttleVehicle[]
    side_effects: []

  - method: GET
    path: "/shuttle-vehicles/{id}"
    description: "Get a shuttle vehicle"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: []
    output: ShuttleVehicle
    side_effects: []

  # ---- ShuttleRun ----
  - method: POST
    path: "/shuttle-runs"
    description: "Schedule a shuttle run for a trip; enforces vehicle turnaround buffer"
    roles: [OutfitterManager]
    code: 201
    input: [trip_id, shuttle_vehicle_id, direction, depart_time, arrive_time]
    output: ShuttleRun
    side_effects: ["status := SCHEDULED"]

  - method: GET
    path: "/shuttle-runs"
    description: "List/filter shuttle runs"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: ["trip_id?", "shuttle_vehicle_id?", "status?", "limit?", "offset?"]
    output: ShuttleRun[]
    side_effects: []

  - method: GET
    path: "/shuttle-runs/{id}"
    description: "Get a shuttle run"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: []
    output: ShuttleRun
    side_effects: []

  - method: POST
    path: "/shuttle-runs/{id}/cancel"
    description: "Cancel a shuttle run"
    roles: [OutfitterManager]
    code: 200
    input: []
    output: ShuttleRun
    side_effects: ["status SCHEDULED -> CANCELLED"]

  # ---- RiverConditionReading ----
  - method: POST
    path: "/condition-readings"
    description: "Record a river flow reading; classifies the band and may hold/cancel the trip"
    roles: [SafetyOfficer]
    code: 201
    input: [trip_id, flow_cfs, reading_time]
    output: RiverConditionReading
    side_effects:
      - "resulting_band computed via flow_safety_band"
      - "MARGINAL -> trip OPEN/FULL -> WEATHER_HOLD; SAFE -> trip WEATHER_HOLD -> OPEN; UNSAFE -> trip -> CANCELLED with CASCADE L1"

  - method: GET
    path: "/condition-readings"
    description: "List/filter condition readings"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: ["trip_id?", "limit?", "offset?"]
    output: RiverConditionReading[]
    side_effects: []

  - method: GET
    path: "/condition-readings/{id}"
    description: "Get a condition reading"
    roles: [OutfitterManager, Reservationist, SafetyOfficer]
    code: 200
    input: []
    output: RiverConditionReading
    side_effects: []

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set the clock reads exactly this default and never falls back to wall-clock time."
    roles: [OutfitterManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical now := to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- auth --
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_WAIVER_OWNER, http: 403, condition: "Acting Guest's X-User-ID does not equal waiver.guest_id" }
  # -- not found --
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "RiverTrip id does not exist" }
  - { id: ERR_GUIDE_NOT_FOUND, http: 404, condition: "Guide id does not exist" }
  - { id: ERR_GUIDE_ASSIGNMENT_NOT_FOUND, http: 404, condition: "GuideAssignment id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "Reservation id does not exist" }
  - { id: ERR_GUEST_NOT_FOUND, http: 404, condition: "Guest id does not exist" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "Waiver id does not exist" }
  - { id: ERR_GEAR_NOT_FOUND, http: 404, condition: "GearItem id does not exist" }
  - { id: ERR_GEAR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "GearAssignment id does not exist" }
  - { id: ERR_SHUTTLE_VEHICLE_NOT_FOUND, http: 404, condition: "ShuttleVehicle id does not exist" }
  - { id: ERR_SHUTTLE_RUN_NOT_FOUND, http: 404, condition: "ShuttleRun id does not exist" }
  # -- request validation --
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or invalid enum value" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 400, condition: "end_time <= trip_date, or arrive_time <= depart_time" }
  # -- state --
  - { id: ERR_TRIP_NOT_BOOKABLE, http: 409, condition: "Trip is not in OPEN/FULL when a confirm/check-in requires it" }
  - { id: ERR_INVALID_TRIP_STATE, http: 409, condition: "Trip not in a valid state for the requested lifecycle transition" }
  - { id: ERR_NO_GUIDE_ASSIGNED, http: 409, condition: "Opening a trip with zero assigned guides" }
  - { id: ERR_RESERVATION_CANCELLED, http: 409, condition: "Operation attempted on a cancelled reservation" }
  - { id: ERR_INVALID_RESERVATION_STATE, http: 409, condition: "Reservation not in the required fulfillment/payment state for this transition" }
  - { id: ERR_NOT_CHECKED_IN, http: 409, condition: "Settle attempted before the reservation is CHECKED_IN" }
  - { id: ERR_UNRESOLVED_RESERVATIONS, http: 409, condition: "Completing a trip while a reservation is still PENDING" }
  - { id: ERR_UNSETTLED_RESERVATION, http: 409, condition: "Completing a trip while a CHECKED_IN reservation is not SETTLED" }
  - { id: ERR_WAIVER_NOT_PENDING, http: 409, condition: "Signing a waiver that is not PENDING" }
  - { id: ERR_GEAR_UNAVAILABLE, http: 409, condition: "Gear item is not AVAILABLE (assigned or out of service)" }
  - { id: ERR_INVALID_GEAR_STATE, http: 409, condition: "Gear assignment not in the required state for this transition" }
  - { id: ERR_GUIDE_IN_USE, http: 409, condition: "Deactivating a guide that still holds an ASSIGNED assignment on a non-terminal trip" }
  # -- safety --
  - { id: ERR_GUEST_UNDER_MIN_AGE, http: 422, condition: "Guest age below the trip's min_age" }
  - { id: ERR_GUARDIAN_REQUIRED, http: 422, condition: "Minor guest waiver signed without a guardian_name" }
  - { id: ERR_WEIGHT_OUT_OF_RANGE, http: 422, condition: "Guest weight outside the PFD/wetsuit [min_weight_lbs, max_weight_lbs]" }
  # -- referential --
  - { id: ERR_GUIDE_CLASS_INSUFFICIENT, http: 409, condition: "Guide max_class below the trip difficulty_class" }
  - { id: ERR_WAIVER_NOT_SIGNED, http: 409, condition: "Check-in with a non-REMOVED guest whose waiver is not SIGNED" }
  - { id: ERR_GEAR_NOT_ASSIGNED, http: 409, condition: "Check-in with a non-REMOVED guest lacking an ASSIGNED PFD gear assignment" }
  # -- constraint --
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "committed_guests + party_size would exceed max_capacity" }
  - { id: ERR_GUIDE_RATIO_UNMET, http: 409, condition: "assigned_guide_count below required_guides at check-in" }
  - { id: ERR_PRIVATE_CONFLICT, http: 409, condition: "PRIVATE reservation confirm while another reservation is CONFIRMED/CHECKED_IN, or GROUP confirm while a PRIVATE holds the trip" }
  - { id: ERR_GUIDE_DOUBLE_BOOKED, http: 409, condition: "Guide already ASSIGNED to another trip whose half-open [trip_date, end_time) interval strictly overlaps this trip's interval; exact adjacency (next.trip_date == prev.end_time) is allowed" }
  - { id: ERR_SHUTTLE_BUFFER_CONFLICT, http: 409, condition: "A SCHEDULED run on the same vehicle sits within SHUTTLE_BUFFER_MINUTES=30; reject when the gap between the nearer endpoints is strictly less than 30 minutes (gap == 30 is allowed)" }
  - { id: ERR_DUPLICATE_GEAR_TYPE, http: 409, condition: "Guest already holds an ASSIGNED gear assignment of the same gear_type" }
  # -- fiscal --
  - { id: ERR_DEPOSIT_TOO_LOW, http: 402, condition: "deposit_cents below round_half_up(estimated_total_cents * 0.25)" }
  # -- concurrency --
  - { id: ERR_STALE_TRIP_VERSION, http: 412, condition: "expected_trip_version does not match current RiverTrip.version on reservation create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OutfitterManager
    description: "Operations owner: trips, guides, gear inventory, shuttle inventory, trip completion"
    identity: opaque
    exclusive_operations:
      - "POST /trips, POST /trips/{id}/open, POST /trips/{id}/complete"
      - "POST /guides, POST /guides/{id}/deactivate"
      - "POST /guide-assignments, POST /guide-assignments/{id}/release"
      - "POST /gear-items, POST /gear-items/{id}/retire"
      - "POST /shuttle-vehicles, POST /shuttle-runs, POST /shuttle-runs/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET across trips, guides, gear, guide-assignments, shuttle, condition-readings"

  - name: Reservationist
    description: "Front desk: bookings, guests, payments, gear assignment, check-in, settlement"
    identity: opaque
    exclusive_operations:
      - "POST /reservations and its confirm/pay-deposit/check-in/settle/cancel actions"
      - "POST /guests, POST /guests/{id}/remove"
      - "POST /gear-assignments, POST /gear-assignments/{id}/release"
    shared_operations:
      - "GET across reservations, guests, waivers, gear, guide-assignments"

  - name: SafetyOfficer
    description: "Safety authority: records river flow readings and cancels trips for safety"
    identity: opaque
    exclusive_operations:
      - "POST /condition-readings"
      - "POST /trips/{id}/cancel"
    shared_operations:
      - "GET across trips, reservations, guides, gear, condition-readings"

  - name: Guest
    description: "Booked guest: signs own waiver, reads own reservation/guest/waiver"
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /waivers/{id}/sign (only for a waiver whose guest_id == X-User-ID)"
    shared_operations:
      - "GET /trips, GET /reservations, GET /guests, GET /waivers"
