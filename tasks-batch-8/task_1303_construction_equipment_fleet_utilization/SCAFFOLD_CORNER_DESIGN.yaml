          rationale: "Asserted there as 'Equipment.availability_status == IDLE (RESERVED side effect fully compensated)'."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: fuel_burn_rate_inclusive_window_both_ends
        claim_type: correct_result
        grounds: [calculations.fuel_burn_rate, "endpoints[GET /fleet/equipment/{id}/fuel-summary]"]
        distinguishing_aspect: "fuel_burn_rate uses an INCLUSIVE [from_date, to_date] window (contrast with assignment half-open windows): readings on exactly from_date and to_date both count — [08-03, 08-04] yields 12000 ml / 12000 milli h = 1000 ml/h; the single day [08-04, 08-04] yields 7000/4000 -> 1750 ml/h."
        test_recipe:
          setup: ["Class C300 (service_interval_hours 10000), Equipment E300 with ACCEPTED readings: 08-03 (8000 milli h, 5000 ml), 08-04 (4000, 7000), 08-05 (8000, 9000)"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-300", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c300_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-300", class_id: "${c300_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e300_id: $.data.id }
            - call: "POST /fleet/equipment/${e300_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 8000, fuel_used_milliliters: 5000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e300_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 4000, fuel_used_milliliters: 7000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e300_id}/readings"
              payload: { recorded_date: "2026-08-05", engine_hours_delta_milli: 8000, fuel_used_milliliters: 9000 }
              as: FleetAdmin
          trigger:
            - call: "GET /fleet/equipment/${e300_id}/fuel-summary"
              payload: { from_date: "2026-08-03", to_date: "2026-08-04" }
              as: FleetAdmin
              captures: { f1_fuel: $.data.total_fuel_ml, f1_hours: $.data.total_hours_milli, f1_burn: $.data.burn_ml_per_hour }
            - call: "GET /fleet/equipment/${e300_id}/fuel-summary"
              payload: { from_date: "2026-08-04", to_date: "2026-08-04" }
              as: FleetAdmin
              captures: { f2_fuel: $.data.total_fuel_ml, f2_burn: $.data.burn_ml_per_hour }
            - call: "GET /fleet/equipment/${e300_id}/fuel-summary"
              payload: { from_date: "2026-08-03", to_date: "2026-08-05" }
              as: FleetAdmin
              captures: { f3_fuel: $.data.total_fuel_ml, f3_hours: $.data.total_hours_milli, f3_burn: $.data.burn_ml_per_hour }
          assert:
            - "[08-03, 08-04]: total_fuel_ml == 12000, total_hours_milli == 12000, burn_ml_per_hour == 1000 (round_half_up(12000*1000/12000)) — both window endpoints INCLUDED"
            - "[08-04, 08-04]: total_fuel_ml == 7000, burn_ml_per_hour == 1750 (single-day inclusive window)"
            - "[08-03, 08-05]: total_fuel_ml == 21000, total_hours_milli == 20000, burn_ml_per_hour == 1050"

      - name: fuel_burn_rate_zero_hours_returns_null
        claim_type: correct_result
        grounds: [calculations.fuel_burn_rate]
        distinguishing_aspect: "Division-by-zero pin: with only zero-hour readings in the window, total_hours_milli == 0 and burn_ml_per_hour is null (NOT an error, NOT 0)."
        test_recipe:
          setup: ["Class C301 (service_interval_hours 10000), Equipment E301 with one ACCEPTED reading 08-03 (0 milli h, 500 ml)"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-301", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c301_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-301", class_id: "${c301_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e301_id: $.data.id }
            - call: "POST /fleet/equipment/${e301_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 0, fuel_used_milliliters: 500 }
              as: FleetAdmin
          trigger:
            - call: "GET /fleet/equipment/${e301_id}/fuel-summary"
              payload: { from_date: "2026-08-03", to_date: "2026-08-03" }
              as: FleetAdmin
              captures: { fz_fuel: $.data.total_fuel_ml, fz_hours: $.data.total_hours_milli, fz_burn: $.data.burn_ml_per_hour }
          assert:
            - "total_fuel_ml == 500 and total_hours_milli == 0"
            - "burn_ml_per_hour == null (zero-hours pin)"

      - name: redeployment_score_bonuses_and_ranking
        claim_type: correct_result
        grounds: [calculations.redeployment_scan, "endpoints[GET /fleet/equipment/{id}/redeployment-score]"]
        distinguishing_aspect: "Weighted scoring composes three pinned components: P_A scores 5000 (closed-assignment utilization_billing 5000) + 0 (another class-mate unit ON_RENT there kills the +1000 absence bonus) + 100 (budget runway >= 30*daily) = 5100; P_B scores 0 + 1000 + 100 = 1100; ranking score_bp DESC recommends P_A."
        test_recipe:
          setup:
            - "Class C302 daily_rate_cents=10000, weekend 5000, idle 5000, service_interval_hours 10000; projects P_A and P_B OPEN, budget 10000000 each"
            - "Equipment E302 closed an assignment at P_A over [08-03, 08-07): 4 billable days, 16000 milli h -> utilization_billing_bp == 5000, allocated 30000 posted to P_A"
            - "Equipment E302b (same class) currently ON_RENT at P_A (ACTIVE assignment) — class presence on P_A"
            - "E302 is now IDLE"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-302", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c302_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-RA", name: "Redeploy A", equipment_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { pra_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-RB", name: "Redeploy B", equipment_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { prb_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-302", class_id: "${c302_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e302_id: $.data.id, e302_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e302_id}", project_id: "${pra_id}", start_date: "2026-08-03", end_date: "2026-08-07", expected_equipment_version: "${e302_v}" }
              as: FleetAdmin
              captures: { a302_id: $.data.id }
            - call: "POST /fleet/assignments/${a302_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e302_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e302_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e302_id}/readings"
              payload: { recorded_date: "2026-08-05", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e302_id}/readings"
              payload: { recorded_date: "2026-08-06", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/assignments/${a302_id}/close"
              payload: { close_reason: "COMPLETED" }
              as: FleetAdmin
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-302B", class_id: "${c302_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e302b_id: $.data.id, e302b_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e302b_id}", project_id: "${pra_id}", start_date: "2026-08-10", end_date: "2026-08-20", expected_equipment_version: "${e302b_v}" }
              as: FleetAdmin
              captures: { a302b_id: $.data.id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/assignments/${a302b_id}/activate"
              as: FleetAdmin
          trigger:
            - call: "GET /fleet/equipment/${e302_id}/redeployment-score"
              as: FleetAdmin
              captures: { rec: $.data.recommended_project_id, idle_alert: $.data.idle_alert }
          assert:
            - "recommended_project_id == ${pra_id} (P_A score 5000+0+100 == 5100 > P_B score 0+1000+100 == 1100)"
            - "candidates contains exactly 2 entries (both OPEN projects pass the eligibility guard billed + 10000 <= 10000000)"
            - "idle_alert == false for E302 (it was ON_RENT/just-closed, not 5 consecutive IDLE days)"

      - name: redeployment_score_tie_break_created_at_then_project_code
        claim_type: correct_result
        grounds: [calculations.redeployment_scan]
        distinguishing_aspect: "Tie-break chain: two same-class-eligible projects both scoring 1100 with EQUAL created_at (same logical clock) fall through to the final project_code ASC tie-break — PRJ-TB1 created SECOND beats PRJ-TB2 created FIRST."
        test_recipe:
          setup:
            - "Clock frozen at 2026-08-01T00:00:00Z for both project creates so created_at ties exactly"
            - "Class C303 daily 10000; PRJ-TB2 created first, PRJ-TB1 created second (both budget 10000000, OPEN); Equipment E303 IDLE with no assignment history"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-303", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c303_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-TB2", name: "Tie Two", equipment_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { ptb2_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-TB1", name: "Tie One", equipment_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { ptb1_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-303", class_id: "${c303_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e303_id: $.data.id }
          trigger:
            - call: "GET /fleet/equipment/${e303_id}/redeployment-score"
              as: FleetAdmin
              captures: { rec: $.data.recommended_project_id }
          assert:
            - "Both candidates score 0 + 1000 + 100 == 1100 and share created_at 2026-08-01T00:00:00.000Z"
            - "recommended_project_id == ${ptb1_id} — project_code ASC breaks the created_at tie (PRJ-TB1 < PRJ-TB2) even though PRJ-TB2 was created first"

      - name: redeployment_score_empty_pool_returns_null_recommendation
        claim_type: correct_result
        grounds: [calculations.redeployment_scan]
        distinguishing_aspect: "Empty-pool fallback is NOT an error: the only project has budget 0 so 0 + 10000 > 0 makes it ineligible — response is 200 with candidates == [] and recommended_project_id == null."
        test_recipe:
          setup: ["Class C304 daily 10000; Project P304 budget 0 OPEN; Equipment E304 IDLE"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-304", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c304_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-304", name: "No Budget", equipment_budget_cents: 0 }
              as: FleetAdmin
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-304", class_id: "${c304_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e304_id: $.data.id }
          trigger:
            - call: "GET /fleet/equipment/${e304_id}/redeployment-score"
              as: FleetAdmin
              captures: { rec: $.data.recommended_project_id }
          assert:
            - "http 200 (NOT an error); candidates == [] (empty array)"
            - "recommended_project_id == null"

      - name: utilization_rate_clamped_at_10000
        claim_type: correct_result
        grounds: [calculations.utilization_rate, entities.Assignment.fields.utilization_billing_bp]
        distinguishing_aspect: "Precision pin: utilization above 10000 bp is clamped to 10000 — a 1-day window with a 24000-milli (24 h) reading yields raw 30000 bp on BOTH variants, stored as exactly 10000."
        test_recipe:
          setup: ["Class C305 daily 10000 service_interval_hours 10000; project budget 100000000; assignment [08-03, 08-04) ACTIVE; reading 08-03 24000 milli; clock 2026-08-04 at close"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-305", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c305_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-305", name: "P305", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p305_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-305", class_id: "${c305_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e305_id: $.data.id, e305_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e305_id}", project_id: "${p305_id}", start_date: "2026-08-03", end_date: "2026-08-04", expected_equipment_version: "${e305_v}" }
              as: FleetAdmin
              captures: { a305_id: $.data.id }
            - call: "POST /fleet/assignments/${a305_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e305_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/assignments/${a305_id}/close"
              payload: { close_reason: "COMPLETED" }
              as: FleetAdmin
          trigger:
            - call: "GET /fleet/assignments/${a305_id}"
              as: FleetAdmin
              captures: { a305_ue: $.data.utilization_elapsed_bp, a305_ub: $.data.utilization_billing_bp }
          assert:
            - "utilization_elapsed_bp == 10000 and utilization_billing_bp == 10000 (raw 30000 clamped to the 0..10000 precision bound)"

      - name: own_vs_rent_tie_when_variants_equal
        claim_type: correct_result
        grounds: [calculations.own_vs_rent, entities.AssignmentCharge.fields.cheaper_variant]
        distinguishing_aspect: "cheaper_variant == TIE exactly when own_cost_cents == rent_cost_cents: engineered 1-day window (idle multiplier 10000 so the zero-hour day is undiscounted) gives own == 10000 + 0 + 4200 == 14200 and rent == 12700 + 1500 == 14200."
        test_recipe:
          setup: ["Class C306 daily 10000, external 12700, weekend 10000, idle 10000, service_interval_hours 10000; project budget 100000000; assignment [08-03, 08-04) ACTIVE; reading 08-03 0 milli; clock 2026-08-04 at close"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-306", daily_rate_cents: 10000, external_daily_rate_cents: 12700, weekend_multiplier_bp: 10000, idle_day_multiplier_bp: 10000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c306_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-306", name: "P306", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p306_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-306", class_id: "${c306_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e306_id: $.data.id, e306_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e306_id}", project_id: "${p306_id}", start_date: "2026-08-03", end_date: "2026-08-04", expected_equipment_version: "${e306_v}" }
              as: FleetAdmin
              captures: { a306_id: $.data.id }
            - call: "POST /fleet/assignments/${a306_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e306_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
