scenario: "1035. Pool & Billiards Hall / Table Retail: table time & league, membership, table sales/recover service, tournament & handicap, food-beverage, pro-shop (cue) & repair, reservation, event"
domain_name: "pool-billiards-hall"
api_prefix: "/v1"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  # Peer entities linked by FK references (member_id, table_id, session_id, ...);
  # no nesting in URL paths — every resource is addressed at its own collection root.
  state_machine_shape: parallel
  # Event carries two independent axes (booking_status x payment_status); PoolTable and
  # Member both cycle (ACTIVE<->MAINTENANCE, ACTIVE<->EXPIRED). Not a single linear pipeline.
  relationship_patterns:
    - one_to_many        # Member -> Reservation, Tournament -> TournamentEntry, TableSession -> FnbOrder
    - cross_aggregate    # TableSession.reservation_id, Reservation.event_id span aggregate roots
  role_model: peer_roles
  # Member owns its own bookings/entries/repairs/events (entity_backed); FrontDesk, Manager,
  # ProShopStaff are opaque operational roles owning disjoint operation sets.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# Domain constants referenced across §1.2 preconditions / §1.4 validations (pinned values).
global_constants:
  CYCLE_DAYS: 30
  NO_SHOW_GRACE_MINUTES: 15            # a CONFIRMED reservation may be marked NO_SHOW at start_at + 15 min
  NO_SHOW_SUSPEND_THRESHOLD: 3         # 3rd no-show in a cycle suspends the member
  CHECKIN_EARLY_MINUTES: 15            # check-in allowed from start_at - 15 min
  TURNOVER_BUFFER_MINUTES: 10          # required clear gap between two reservations on the same table
  MIN_TOURNAMENT_ENTRIES: 4            # minimum captured entries to seed a bracket
  DEFAULT_CLOCK_UTC: "2026-07-01T00:00:00Z"

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Plan tier"
        constraints: "one of {BRONZE, SILVER, GOLD}; unique across active plans"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Monthly membership fee in cents"
        constraints: ">= 0"
      - name: table_discount_pct
        type: number
        source: input
        description: "Fraction discount applied to final table_session_charge for members on this plan"
        constraints: "0.0 <= x <= 0.5"
      - name: included_hours_per_month
        type: integer
        source: input
        description: "Free table-hours per cycle (informational; not auto-deducted in this scaffold)"
        default: 0
      - name: reservation_horizon_days
        type: integer
        source: input
        description: "How many days ahead this tier may reserve a table"
        default: 14

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login email; unique"
      - name: full_name
        type: string
        source: input
        description: "Member display name"
      - name: plan_id
        type: string
        source: input
        description: "FK -> MembershipPlan.id; the member's current plan"
      - name: pending_plan_id
        type: string
        source: computed
        description: "Deferred downgrade target (references a MembershipPlan.id) that activates at renewal, else null; not an owned-child FK"
        default: null
      - name: membership_status
        type: enum
        source: computed
        description: "Lifecycle state"
        constraints: "one of {ACTIVE, EXPIRED, SUSPENDED}; initial ACTIVE"
        default: ACTIVE
      - name: membership_expires_at
        type: datetime
        source: computed
        description: "End of current paid cycle; set to created_at + CYCLE_DAYS at registration"
      - name: handicap_rating
        type: integer
        source: input
        description: "Skill rating 1..9 used by tournament_handicap_spot"
        constraints: "1 <= x <= 9"
        default: 5
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: "House-account balance in cents; debited by charges, credited by refunds/adjustments"
        default: 0
        constraints: ">= 0"
      - name: no_show_strikes
        type: integer
        source: computed
        description: "Count of NO_SHOW reservations in the current cycle; suspends at NO_SHOW_SUSPEND_THRESHOLD"
        default: 0

  - name: PoolTable
    parent: null
    common_fields: true
    fields:
      - name: table_number
        type: integer
        source: input
        description: "Physical table number; unique"
        constraints: ">= 1"
      - name: table_type
        type: enum
        source: input
        description: "Table style"
        constraints: "one of {POOL_7FT, POOL_9FT, SNOOKER, BILLIARDS}"
      - name: seat_capacity
        type: integer
        source: input
        description: "Max party_size a reservation on this table may request"
        constraints: ">= 1"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Off-peak base rate per hour in cents; peak applies PEAK_MULTIPLIER"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Availability lifecycle"
        constraints: "one of {ACTIVE, MAINTENANCE, RETIRED}; initial ACTIVE"
        default: ACTIVE

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; who booked the table"
      - name: table_id
        type: string
        source: input
        description: "FK -> PoolTable.id; the reserved table"
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; set when this reservation was created by an Event booking, else null"
        default: null
      - name: start_at
        type: datetime
        source: input
        description: "Reservation window start (inclusive)"
      - name: end_at
        type: datetime
        source: input
        description: "Reservation window end (exclusive)"
      - name: party_size
        type: integer
        source: input
        description: "Number of players; must be <= table.seat_capacity"
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Reservation lifecycle"
        constraints: "one of {PENDING, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW}; initial PENDING"
        default: PENDING

  - name: TableSession
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; the reservation this session realizes, or null for a walk-in"
        default: null
      - name: table_id
        type: string
        source: input
        description: "FK -> PoolTable.id; the occupied table"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the billed member, or null for an anonymous walk-in"
        default: null
      - name: started_at
        type: datetime
        source: computed
        description: "Clock time at open (check-in / walk-in open)"
      - name: ended_at
        type: datetime
        source: computed
        description: "Clock time at close, else null"
        default: null
      - name: provisional_charge_cents
        type: integer
        source: computed
        description: "table_session_charge variant=provisional, stamped at open"
        default: 0
      - name: final_charge_cents
        type: integer
        source: computed
        description: "table_session_charge variant=final, stamped at close"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Session lifecycle"
        constraints: "one of {OPEN, CLOSED, VOIDED}; initial OPEN"
        default: OPEN

  - name: FnbOrder
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> TableSession.id; the open session this tab attaches to"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; billed member, or null"
        default: null
      - name: line_items
        type: array
        source: input
        description: "Array of {name, unit_price_cents, qty}; taxed per fnb_order_total"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum over line_items of unit_price_cents * qty"
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Per-line rounded tax summed (fnb_order_total, mode b)"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + tax_cents"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Tab lifecycle"
        constraints: "one of {OPEN, SUBMITTED, VOIDED}; initial OPEN"
        default: OPEN

  - name: Tournament
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Tournament / league event name"
      - name: format
        type: enum
        source: input
        description: "Competition format"
        constraints: "one of {SINGLE_ELIM, DOUBLE_ELIM, ROUND_ROBIN, LEAGUE}"
      - name: handicap_mode
        type: enum
        source: input
        description: "Selects tournament_handicap_spot variant"
        constraints: "one of {FULL, CAPPED, NONE}"
        default: CAPPED
      - name: entry_fee_cents
        type: integer
        source: input
        description: "Fee charged to each entrant's wallet; also feeds prize_pool_cents"
        constraints: ">= 0"
      - name: max_entries
        type: integer
        source: input
        description: "Bracket capacity; open_slots + active entries is conserved at this value"
        constraints: ">= MIN_TOURNAMENT_ENTRIES"
      - name: open_slots
        type: integer
        source: computed
        description: "Remaining bracket slots; initialized to max_entries, decremented on entry, restored on withdraw"
      - name: prize_pool_cents
        type: integer
        source: computed
        description: "Sum of captured entry fees; incremented on entry, decremented on withdraw refund"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Tournament lifecycle"
        constraints: "one of {SCHEDULED, REGISTRATION_OPEN, SEEDED, IN_PROGRESS, COMPLETED, CANCELLED}; initial SCHEDULED"
        default: SCHEDULED

  - name: TournamentEntry
    parent: null
    common_fields: true
    fields:
      - name: tournament_id
        type: string
        source: input
        description: "FK -> Tournament.id; the bracket entered"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the entrant"
      - name: entry_fee_cents
        type: integer
        source: computed
        description: "Copied from Tournament.entry_fee_cents at entry time"
      - name: handicap_spot
        type: integer
        source: computed
        description: "tournament_handicap_spot computed at seed time relative to top seed, else null"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Entry lifecycle"
        constraints: "one of {ENTERED, CHECKED_IN, WITHDRAWN, ELIMINATED}; initial ENTERED"
        default: ENTERED

  - name: ProShopProduct
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Stock keeping unit; unique"
      - name: name
        type: string
        source: input
        description: "Product name (e.g., 'Predator Revo Cue')"
      - name: category
        type: enum
        source: input
        description: "Product category"
        constraints: "one of {CUE, CASE, ACCESSORY, TABLE, PART}"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Retail price per unit in cents"
        constraints: ">= 0"
      - name: stock_qty
        type: integer
        source: computed
        description: "On-hand units; decremented on sell, incremented on restock"
        constraints: ">= 0"

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; who dropped off the item"
      - name: product_id
        type: string
        source: input
        description: "FK -> ProShopProduct.id; a cue/part being serviced, or null for a member-owned item"
        default: null
      - name: table_id
        type: string
        source: input
        description: "FK -> PoolTable.id; the table for a TABLE_RECOVER service, else null"
        default: null
      - name: service_type
        type: enum
        source: input
        description: "Kind of service"
        constraints: "one of {CUE_RETIP, CUE_REPAIR, TABLE_RECOVER}"
      - name: quote_cents
        type: integer
        source: input
        description: "Agreed price in cents charged to member wallet at pickup"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Repair lifecycle"
        constraints: "one of {RECEIVED, IN_PROGRESS, READY, PICKED_UP, CANCELLED}; initial RECEIVED"
        default: RECEIVED

  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: host_member_id
        type: string
        source: input
        description: "FK -> Member.id; the member hosting the private event"
      - name: table_count
        type: integer
        source: input
        description: "Number of ACTIVE tables to block for the event window"
        constraints: ">= 1"
      - name: start_at
        type: datetime
        source: input
        description: "Event window start (inclusive)"
      - name: end_at
        type: datetime
        source: input
        description: "Event window end (exclusive)"
      - name: quote_cents
        type: integer
        source: computed
        description: "event_quote total, stamped at QUOTED"
        default: 0
      - name: deposit_cents
        type: integer
        source: computed
        description: "Required deposit = round(quote_cents * EVENT_DEPOSIT_PCT), stamped at QUOTED"
        default: 0
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: "Amount of deposit collected so far from host wallet"
        default: 0
      - name: booking_status
        type: enum
        source: computed
        description: "Booking axis (independent of payment_status)"
        constraints: "one of {INQUIRY, QUOTED, BOOKED, CONFIRMED, COMPLETED, CANCELLED}; initial INQUIRY"
        default: INQUIRY
      - name: payment_status
        type: enum
        source: computed
        description: "Payment axis (independent of booking_status)"
        constraints: "one of {UNPAID, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED}; initial UNPAID"
        default: UNPAID

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock passes membership_expires_at (evaluated on any member read/write via /_clock)"
        actor: system
        preconditions: ["current_utc >= membership_expires_at"]
        side_effects:
          - "if pending_plan_id != null: set plan_id = pending_plan_id, pending_plan_id = null (deferred downgrade applies)"
        note: "Expiry does not auto-cancel bookings; only SUSPENSION does."
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /v1/members/{id}/renew"
        actor: Member
        preconditions: ["membership_status == EXPIRED"]
        side_effects:
          - "membership_renewal_charge (variant=lapsed_prorated) debits wallet_credit_cents"
          - "membership_expires_at = current_utc + CYCLE_DAYS days"
          - "no_show_strikes reset to 0"
        note: "ACTIVE<->EXPIRED renewal is a cycle (non-linear)."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /v1/members/{id}/renew"
        actor: Member
        preconditions: ["membership_status == ACTIVE"]
        side_effects:
          - "membership_renewal_charge (variant=auto_renew) debits wallet_credit_cents"
          - "membership_expires_at extended by CYCLE_DAYS days from prior membership_expires_at"
          - "no_show_strikes reset to 0"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: no_show_strikes reaches NO_SHOW_SUSPEND_THRESHOLD (fired inside Reservation no-show cascade)"
        actor: system
        preconditions: ["no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD"]
        side_effects:
          - "all Reservations of this member in {PENDING, CONFIRMED} -> CANCELLED (cascade link 2 of no-show chain)"
        note: "Cross-entity cascade origin: Reservation NO_SHOW -> Member strike -> Member SUSPENDED -> Reservations CANCELLED."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/members/{id}/renew"
        actor: Member
        preconditions: ["membership_status == SUSPENDED"]
        side_effects:
          - "membership_renewal_charge (variant=auto_renew) debits wallet_credit_cents"
          - "no_show_strikes reset to 0"
          - "membership_expires_at extended by CYCLE_DAYS days"

  - entity: PoolTable
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /v1/tables/{id}/maintenance"
        actor: Manager
        preconditions: ["no TableSession with this table_id in status OPEN"]
        side_effects: ["future Reservations (status in {PENDING, CONFIRMED}, start_at >= current_utc) on this table -> CANCELLED"]
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /v1/tables/{id}/activate"
        actor: Manager
        preconditions: ["status == MAINTENANCE"]
        side_effects: []
        note: "ACTIVE<->MAINTENANCE is a cycle (non-linear)."
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /v1/tables/{id}/retire"
        actor: Manager
        preconditions: ["no TableSession with this table_id in status OPEN"]
        side_effects: ["future Reservations (status in {PENDING, CONFIRMED}) on this table -> CANCELLED"]
      - from: MAINTENANCE
        to: RETIRED
        trigger: "POST /v1/tables/{id}/retire"
        actor: Manager
        preconditions: ["status == MAINTENANCE"]
        side_effects: ["future Reservations (status in {PENDING, CONFIRMED}) on this table -> CANCELLED"]

  - entity: Reservation
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /v1/reservations/{id}/confirm"
        actor: FrontDesk
        preconditions: ["reservation.status == PENDING", "table.status == ACTIVE"]
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /v1/reservations/{id}/cancel"
        actor: Member
        preconditions: ["reservation.status == PENDING"]
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/reservations/{id}/cancel  OR  cascade from table retire/maintenance OR member suspension OR event cancel"
        actor: Member | system
        preconditions: ["reservation.status == CONFIRMED"]
        side_effects:
          - "if event_id != null and its Event.booking_status in {BOOKED, CONFIRMED}: that Event -> CANCELLED (cascade link; used by the table-retire depth-3 chain Table -> Reservation -> Event -> host wallet)"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /v1/reservations/{id}/check-in"
        actor: FrontDesk
        preconditions: ["reservation.status == CONFIRMED", "table.status == ACTIVE", "current_utc >= start_at - CHECKIN_EARLY_MINUTES minutes"]
        side_effects:
          - "create TableSession (status OPEN, reservation_id=this.id, table_id, member_id) — cascade link 1"
          - "TableSession.provisional_charge_cents stamped via table_session_charge variant=provisional"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system: the realizing TableSession transitions OPEN->CLOSED"
        actor: system
        preconditions: ["reservation.status == CHECKED_IN"]
        side_effects: []
        note: "Bubble-up: session close completes its reservation."
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /v1/reservations/{id}/no-show"
        actor: FrontDesk
        preconditions: ["reservation.status == CONFIRMED", "current_utc >= start_at + NO_SHOW_GRACE_MINUTES minutes"]
        side_effects:
          - "member.no_show_strikes += 1 (cascade link 1)"
          - "if member.no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD: member.membership_status ACTIVE->SUSPENDED (cascade link 2) which cancels member's other {PENDING,CONFIRMED} reservations (cascade link 3)"

  - entity: TableSession
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/sessions/{id}/close"
        actor: FrontDesk
        preconditions: ["session.status == OPEN"]
        side_effects:
          - "ended_at = current_utc"
          - "final_charge_cents stamped via table_session_charge variant=final"
          - "member.wallet_credit_cents -= final_charge_cents (only when member_id != null)"
          - "if reservation_id != null: reservation.status CHECKED_IN->COMPLETED (bubble-up)"
      - from: OPEN
        to: VOIDED
        trigger: "POST /v1/sessions/{id}/void  OR  cascade from event cancel"
        actor: FrontDesk | Manager | system
        preconditions: ["session.status == OPEN"]
        side_effects:
          - "ended_at = current_utc; final_charge_cents = 0; no wallet debit"
          - "if reservation_id != null and reservation.status == CHECKED_IN: reservation.status -> CANCELLED"

  - entity: FnbOrder
    initial_state: OPEN
    terminal_states: [SUBMITTED, VOIDED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /v1/fnb-orders/{id}/submit"
        actor: FrontDesk
        preconditions: ["order.status == OPEN", "parent TableSession.status == OPEN"]
        side_effects:
          - "fnb_order_total computed -> subtotal_cents, tax_cents, total_cents"
          - "member.wallet_credit_cents -= total_cents (only when member_id != null)"
      - from: OPEN
        to: VOIDED
        trigger: "POST /v1/fnb-orders/{id}/void"
        actor: FrontDesk
        preconditions: ["order.status == OPEN"]
        side_effects: []

  - entity: Tournament
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: REGISTRATION_OPEN
        trigger: "POST /v1/tournaments/{id}/open"
        actor: Manager
        preconditions: ["status == SCHEDULED"]
        side_effects: []
      - from: REGISTRATION_OPEN
        to: SEEDED
        trigger: "POST /v1/tournaments/{id}/seed"
        actor: Manager
        preconditions: ["status == REGISTRATION_OPEN", "count of TournamentEntry in {ENTERED, CHECKED_IN} >= MIN_TOURNAMENT_ENTRIES"]
        side_effects: ["each entry.handicap_spot stamped via tournament_handicap_spot relative to top seed"]
      - from: SEEDED
        to: IN_PROGRESS
        trigger: "POST /v1/tournaments/{id}/start"
        actor: Manager
        preconditions: ["status == SEEDED"]
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /v1/tournaments/{id}/complete"
        actor: Manager
        preconditions: ["status == IN_PROGRESS"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/tournaments/{id}/cancel"
        actor: Manager
        preconditions: ["status == SCHEDULED"]
        side_effects: []
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /v1/tournaments/{id}/cancel"
        actor: Manager
        preconditions: ["status == REGISTRATION_OPEN"]
        side_effects:
          - "each TournamentEntry in {ENTERED, CHECKED_IN} -> WITHDRAWN (cascade link 1)"
          - "each withdrawn entry refunds entry_fee_cents to member.wallet_credit_cents and decrements tournament.prize_pool_cents (cascade link 2)"
          - "each withdrawn entry restores tournament.open_slots += 1 (cascade link 2, slot conservation)"
      - from: SEEDED
        to: CANCELLED
        trigger: "POST /v1/tournaments/{id}/cancel"
        actor: Manager
        preconditions: ["status == SEEDED"]
        side_effects:
          - "each TournamentEntry in {ENTERED, CHECKED_IN} -> WITHDRAWN (cascade link 1)"
          - "each withdrawn entry refunds entry_fee_cents to member.wallet_credit_cents and decrements tournament.prize_pool_cents and restores open_slots (cascade link 2)"

  - entity: TournamentEntry
    initial_state: ENTERED
    terminal_states: [WITHDRAWN, ELIMINATED]
    transitions:
      - from: ENTERED
        to: CHECKED_IN
        trigger: "POST /v1/tournament-entries/{id}/check-in"
        actor: FrontDesk
        preconditions: ["entry.status == ENTERED", "tournament.status == SEEDED"]
        side_effects: []
      - from: ENTERED
        to: WITHDRAWN
        trigger: "POST /v1/tournament-entries/{id}/withdraw  OR  cascade from tournament cancel"
        actor: Member | system
        preconditions: ["entry.status == ENTERED", "tournament.status in {REGISTRATION_OPEN, SEEDED}"]
        side_effects:
          - "member.wallet_credit_cents += entry_fee_cents (compensation)"
          - "tournament.prize_pool_cents -= entry_fee_cents"
          - "tournament.open_slots += 1 (slot conservation)"
      - from: CHECKED_IN
        to: ELIMINATED
        trigger: "system: bracket result recorded (via tournament complete for remaining entries)"
        actor: system
        preconditions: ["entry.status == CHECKED_IN", "tournament.status == IN_PROGRESS"]
        side_effects: []

  - entity: RepairOrder
    initial_state: RECEIVED
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - from: RECEIVED
        to: IN_PROGRESS
        trigger: "POST /v1/repair-orders/{id}/start"
        actor: ProShopStaff
        preconditions: ["status == RECEIVED"]
        side_effects: []
      - from: IN_PROGRESS
        to: READY
        trigger: "POST /v1/repair-orders/{id}/ready"
        actor: ProShopStaff
        preconditions: ["status == IN_PROGRESS", "if service_type == TABLE_RECOVER: table.status == MAINTENANCE"]
        side_effects: []
      - from: READY
        to: PICKED_UP
        trigger: "POST /v1/repair-orders/{id}/pickup"
        actor: FrontDesk
        preconditions: ["status == READY"]
        side_effects: ["member.wallet_credit_cents -= quote_cents"]
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /v1/repair-orders/{id}/cancel"
        actor: Member | ProShopStaff
        preconditions: ["status == RECEIVED"]
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /v1/repair-orders/{id}/cancel"
        actor: ProShopStaff
        preconditions: ["status == IN_PROGRESS"]
        side_effects: []

  - entity: Event
    initial_state: "INQUIRY / UNPAID"
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: "booking_status=INQUIRY"
        to: "booking_status=QUOTED"
        trigger: "POST /v1/events/{id}/quote"
        actor: Manager
        preconditions: ["booking_status == INQUIRY", "event_quote candidate table set is non-empty (>= table_count ACTIVE tables free in window)"]
        side_effects: ["quote_cents = event_quote total; deposit_cents = round(quote_cents * EVENT_DEPOSIT_PCT)"]
      - from: "payment_status=UNPAID"
        to: "payment_status=DEPOSIT_PAID"
        trigger: "POST /v1/events/{id}/pay-deposit"
        actor: Member
        preconditions: ["booking_status in {QUOTED, BOOKED}", "payment_status == UNPAID", "host.wallet_credit_cents >= deposit_cents"]
        side_effects: ["host.wallet_credit_cents -= deposit_cents", "deposit_paid_cents = deposit_cents"]
        note: "Payment axis moves independently of booking axis (parallel dimensions)."
      - from: "booking_status=QUOTED"
        to: "booking_status=BOOKED"
        trigger: "POST /v1/events/{id}/book"
        actor: Member
        preconditions: ["booking_status == QUOTED", "table_count ACTIVE tables free across [start_at, end_at)"]
        side_effects: ["create table_count Reservations (status CONFIRMED, event_id=this.id) on the selected ACTIVE tables"]
      - from: "booking_status=BOOKED"
        to: "booking_status=CONFIRMED"
        trigger: "POST /v1/events/{id}/confirm"
        actor: Manager
        preconditions: ["booking_status == BOOKED", "payment_status in {DEPOSIT_PAID, PAID_IN_FULL}"]
        side_effects: []
        note: "Cross-axis guard: confirm requires the payment axis to have reached at least DEPOSIT_PAID."
      - from: "booking_status=CONFIRMED"
        to: "booking_status=COMPLETED"
        trigger: "POST /v1/events/{id}/complete"
        actor: Manager
        preconditions: ["booking_status == CONFIRMED"]
        side_effects: ["payment_status -> PAID_IN_FULL if not already REFUNDED"]
      - from: "booking_status in {INQUIRY,QUOTED,BOOKED,CONFIRMED}"
        to: "booking_status=CANCELLED"
        trigger: "POST /v1/events/{id}/cancel"
        actor: Member | Manager
        preconditions: ["booking_status not in {COMPLETED, CANCELLED}"]
        side_effects:
          - "each Reservation with event_id=this.id in status CONFIRMED -> CANCELLED (cascade link 1)"
          - "each such Reservation that had an OPEN TableSession -> that TableSession VOIDED (cascade link 2)"
          - "each VOIDED TableSession zeroes final_charge_cents and refunds any provisional wallet hold (none by default) (cascade link 3)"
          - "if payment_status == DEPOSIT_PAID: host.wallet_credit_cents += deposit_paid_cents and payment_status -> REFUNDED (compensation, money conservation)"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version — true CREATE/UPDATE-supersede races only)
# =====================================================================
concurrency_rules:
  - rule_id: member-plan-change-stale
    parent_entity: Member
    write_endpoint: "POST /v1/members/{id}/plan-change"
    occ_field: "expected_member_version"
    description: |
      Submitting a plan-change against a Member whose version has advanced since the
      client last observed it is rejected. A new plan-change legitimately supersedes a
      prior pending change (it overwrites pending_plan_id / plan_id), so a client acting
      on a stale view of the member is rejected with a precondition failure rather than
      silently clobbering an intervening change.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reservation-reschedule-stale
    parent_entity: Reservation
    write_endpoint: "POST /v1/reservations/{id}/reschedule"
    occ_field: "expected_reservation_version"
    description: |
      Rescheduling a Reservation to a new [start_at, end_at) window supersedes its prior
      window. A reschedule carrying a version older than the reservation's current version
      is acting on a stale view (an intervening reschedule/confirm already moved it) and is
      rejected with a precondition failure.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: table_session_charge
    trigger: "provisional at Reservation CONFIRMED->CHECKED_IN (session open); final at TableSession OPEN->CLOSED"
    algorithm: threshold
    formula: |
      # per_minute rate is exact rational hourly_rate_cents/60; peak = 18:00<=hour<24:00 (UTC).
      # provisional (at open):
      reserved_minutes = (reservation.end_at - reservation.start_at) in whole minutes  # walk-in (no reservation): use MIN_BILLED_MINUTES
      billed_p = max(reserved_minutes, MIN_BILLED_MINUTES)
      provisional_charge_cents = round_half_up(billed_p * hourly_rate_cents / 60)   # off-peak rate only, NO member discount
      # final (at close):
      actual_minutes = (ended_at - started_at) in whole minutes
      billed_f = max(actual_minutes, MIN_BILLED_MINUTES)
      window = [started_at, started_at + billed_f minutes)
      peak_min    = minutes of window whose hour-of-day is in [PEAK_START_HOUR, PEAK_END_HOUR)
      offpeak_min = billed_f - peak_min
      gross = offpeak_min * hourly_rate_cents/60 + peak_min * hourly_rate_cents/60 * PEAK_MULTIPLIER
      discount = (member_id != null) ? member.plan.table_discount_pct : 0.0
      final_charge_cents = round_half_up(gross * (1 - discount))   # SINGLE final rounding, after discount
    input_set: "One TableSession; its table (rate) and, when member_id set, the member's plan discount."
    constants:
      PEAK_START_HOUR: 18
      PEAK_END_HOUR: 24
      PEAK_MULTIPLIER: 1.5
      MIN_BILLED_MINUTES: 30
    precision: "whole cents, round_half_up, applied ONCE at the end of each variant"
    variants:
      - name: provisional
        when: "stamped at session open (check-in); off-peak flat estimate over the reserved window, no discount"
        difference: "ignores peak multiplier and member discount; uses reserved window not elapsed time"
      - name: final
        when: "stamped at session close; elapsed time with peak split and member discount"
        difference: "applies PEAK_MULTIPLIER to peak minutes and the plan discount to the whole gross"

  - name: tournament_handicap_spot
    trigger: "Tournament REGISTRATION_OPEN->SEEDED, stamped on each entry"
    algorithm: weighted_scoring
    formula: |
      top_rating = max(member.handicap_rating) over entries in {ENTERED, CHECKED_IN}   # tie: value only, order-independent
      spot_raw = top_rating - this_entry.member.handicap_rating
      FULL:   handicap_spot = spot_raw
      CAPPED: handicap_spot = min(HANDICAP_SPOT_CAP, spot_raw)
      NONE:   handicap_spot = 0
    input_set: "All non-withdrawn entries of the tournament being seeded."
    constants:
      HANDICAP_SPOT_CAP: 3
    precision: "integer games; no rounding"
    variants:
      - name: full
        when: "tournament.handicap_mode == FULL"
        difference: "handicap_spot = top_rating - player_rating, uncapped"
      - name: capped
        when: "tournament.handicap_mode == CAPPED"
        difference: "handicap_spot = min(HANDICAP_SPOT_CAP, top_rating - player_rating)"

  - name: fnb_order_total
    trigger: "FnbOrder OPEN->SUBMITTED"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum over line_items of (unit_price_cents * qty)
      # ROUND PER LINE THEN SUM (pinned order; differs from sum-then-round at half-cent boundaries):
      tax_cents = sum over line_items of round_half_up(unit_price_cents * qty * FNB_TAX_PCT)
      total_cents = subtotal_cents + tax_cents
    input_set: "One FnbOrder's line_items array."
    constants:
      FNB_TAX_PCT: 0.0875
    precision: "whole cents, round_half_up, applied PER LINE ITEM before summing"

  - name: tournament_prize_pool
    trigger: "incrementally on TournamentEntry create (+=) and withdraw/cancel (-=)"
    algorithm: aggregation
    formula: |
      prize_pool_cents = sum(entry.entry_fee_cents) over TournamentEntry of this tournament
                         whose status in {ENTERED, CHECKED_IN, ELIMINATED}   # WITHDRAWN excluded
    input_set: "All captured (non-withdrawn) entries of one tournament."
    constants: {}
    precision: "whole cents; maintained as running integer accumulator"

  - name: event_quote
    trigger: "Event booking_status INQUIRY->QUOTED"
    algorithm: tiered_pricing
    formula: |
      hours = (end_at - start_at) in whole hours
      base = table_count * hours * EVENT_TABLE_HOUR_RATE_CENTS
      bulk_pct = (table_count >= 10) ? 0.15 : (table_count >= 6) ? 0.10 : (table_count >= 3) ? 0.05 : 0.0
      quote_cents = round_half_up(base * (1 - bulk_pct))
      deposit_cents = round_half_up(quote_cents * EVENT_DEPOSIT_PCT)
    input_set: "One Event's window and table_count."
    constants:
      EVENT_TABLE_HOUR_RATE_CENTS: 4000
      EVENT_DEPOSIT_PCT: 0.25
    precision: "whole cents, round_half_up; bulk tier boundaries are inclusive (>=)"

  - name: membership_renewal_charge
    trigger: "Member renew transitions (ACTIVE/SUSPENDED/EXPIRED -> ACTIVE)"
    algorithm: aggregation
    formula: |
      charge_cents = member.plan.monthly_fee_cents
      auto_renew (from ACTIVE/SUSPENDED): new_expiry = prior membership_expires_at + CYCLE_DAYS days
      lapsed_prorated (from EXPIRED):     new_expiry = current_utc + CYCLE_DAYS days
    input_set: "One member and its current plan."
    constants:
      CYCLE_DAYS: 30
    precision: "whole cents"
    variants:
      - name: auto_renew
        when: "member was ACTIVE or SUSPENDED"
        difference: "extends existing expiry; does not reset the cycle anchor to now"
      - name: lapsed_prorated
        when: "member was EXPIRED"
        difference: "starts a fresh cycle anchored at current_utc"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /v1/members (register) and GET reads that allow Anonymous"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; entity_backed Member acting only on its own resources"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body id resolves to a live entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/members/{id}/plan-change, POST /v1/reservations/{id}/reschedule"
  - priority: 6
    category: business_safety
    check: "Reservation/session/event table must be ACTIVE (not MAINTENANCE/RETIRED) for confirm/check-in/book"
    error_id: ERR_TABLE_NOT_ACTIVE
    http_status: 409
    applies_to: "reservations confirm/check-in/reschedule, sessions create, events book"
  - priority: 7
    category: business_referential
    check: "Cross-entity precondition holds (e.g., FnbOrder submit requires its TableSession OPEN; entry check-in requires tournament SEEDED; event confirm requires payment_status>=DEPOSIT_PAID)"
    error_id: ERR_DEPENDENT_STATE
    http_status: 409
    applies_to: "fnb submit, tournament-entry check-in, event confirm"
  - priority: 8
    category: business_temporal
    check: "Reservation window [start_at,end_at) must not overlap another {PENDING,CONFIRMED,CHECKED_IN} reservation on the same table within TURNOVER_BUFFER_MINUTES (buffered pairwise overlap)"
    error_id: ERR_TABLE_TIME_CONFLICT
    http_status: 409
    applies_to: "reservations create, reservations reschedule"
  - priority: 9
    category: business_temporal
    check: "Event window must have >= table_count ACTIVE tables with no {CONFIRMED,CHECKED_IN} reservation overlapping [start_at,end_at) (aggregate-capacity overlap across the table pool)"
    error_id: ERR_EVENT_CAPACITY_UNAVAILABLE
    http_status: 409
    applies_to: "events quote, events book"
  - priority: 10
    category: business_constraint
    check: "party_size <= table.seat_capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "reservations create, reservations reschedule"
  - priority: 11
    category: business_constraint
    check: "start_at < end_at; window within plan.reservation_horizon_days of current_utc; times aligned to whole minutes"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "reservations create/reschedule, events create/quote"
  - priority: 12
    category: business_constraint
    check: "Tournament seed requires >= MIN_TOURNAMENT_ENTRIES captured entries; product sell requires stock_qty >= qty"
    error_id: ERR_PRECONDITION_NOT_MET
    http_status: 409
    applies_to: "tournaments seed, products sell"
  - priority: 13
    category: business_fiscal
    check: "Wallet debit (session close, fnb submit, tournament entry, repair pickup, event deposit, membership renew, product sell paid from wallet) must not drive wallet_credit_cents below 0"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "sessions close, fnb submit, tournament-entries create, repair pickup, events pay-deposit, members renew"
  - priority: 14
    category: business_constraint
    check: "Body field types/enums/ranges valid; required fields present"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all writes"
  - priority: 15
    category: business_safety
    check: "Acting/owning member must not be SUSPENDED when creating a reservation, tournament entry, or event"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: "reservations create, tournament-entries create, events create"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- MembershipPlan ----
  - { method: POST, path: "/v1/plans", description: "Create a membership plan", roles: [Manager], code: 201, input: [tier, monthly_fee_cents, table_discount_pct, "included_hours_per_month?", "reservation_horizon_days?"], output: MembershipPlan, side_effects: [] }
  - { method: GET, path: "/v1/plans", description: "List membership plans", roles: [Manager, FrontDesk, Member], code: 200, input: ["tier?", "limit?", "offset?"], output: "MembershipPlan[]", side_effects: [] }
  - { method: GET, path: "/v1/plans/{id}", description: "Get a plan", roles: [Manager, FrontDesk, Member], code: 200, input: [], output: MembershipPlan, side_effects: [] }
  # ---- Member ----
  - { method: POST, path: "/v1/members", description: "Register a member (Anonymous)", roles: [Anonymous, Manager], code: 201, input: [email, full_name, plan_id, "handicap_rating?"], output: Member, side_effects: ["membership_status=ACTIVE", "membership_expires_at=created_at+CYCLE_DAYS"] }
  - { method: GET, path: "/v1/members", description: "List/filter members", roles: [Manager, FrontDesk], code: 200, input: ["plan_id?", "membership_status?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: GET, path: "/v1/members/{id}", description: "Get a member (evaluates lazy ACTIVE->EXPIRED on read)", roles: [Manager, FrontDesk, Member], code: 200, input: [], output: Member, side_effects: ["system: ACTIVE->EXPIRED if current_utc>=membership_expires_at"] }
  - { method: POST, path: "/v1/members/{id}/plan-change", description: "Change plan; upgrade immediate, downgrade deferred; OCC-guarded", roles: [Member], code: 200, input: [target_plan_id, expected_member_version], output: Member, side_effects: ["increments Member.version by 1", "upgrade: plan_id=target now; downgrade: pending_plan_id=target"] }
  - { method: POST, path: "/v1/members/{id}/renew", description: "Renew membership (membership_renewal_charge debits wallet)", roles: [Member, FrontDesk], code: 200, input: [], output: Member, side_effects: ["wallet_credit_cents -= monthly_fee_cents", "membership_expires_at extended", "no_show_strikes=0", "membership_status->ACTIVE"] }
  - { method: POST, path: "/v1/members/{id}/wallet/adjustments", description: "Operator credit/debit of a member's wallet (business admin surface)", roles: [Manager, FrontDesk], code: 200, input: [amount_cents, "reason?"], output: Member, side_effects: ["wallet_credit_cents += amount_cents (may be negative but not below 0)"] }
  # ---- PoolTable ----
  - { method: POST, path: "/v1/tables", description: "Create a pool table", roles: [Manager], code: 201, input: [table_number, table_type, seat_capacity, hourly_rate_cents], output: PoolTable, side_effects: [] }
  - { method: GET, path: "/v1/tables", description: "List/filter tables", roles: [Manager, FrontDesk, Member], code: 200, input: ["status?", "table_type?", "limit?", "offset?"], output: "PoolTable[]", side_effects: [] }
  - { method: GET, path: "/v1/tables/{id}", description: "Get a table", roles: [Manager, FrontDesk, Member], code: 200, input: [], output: PoolTable, side_effects: [] }
  - { method: POST, path: "/v1/tables/{id}/maintenance", description: "Put table into MAINTENANCE", roles: [Manager], code: 200, input: [], output: PoolTable, side_effects: ["ACTIVE->MAINTENANCE", "future {PENDING,CONFIRMED} reservations -> CANCELLED"] }
  - { method: POST, path: "/v1/tables/{id}/activate", description: "Return table to ACTIVE", roles: [Manager], code: 200, input: [], output: PoolTable, side_effects: ["MAINTENANCE->ACTIVE"] }
  - { method: POST, path: "/v1/tables/{id}/retire", description: "Retire a table (terminal)", roles: [Manager], code: 200, input: [], output: PoolTable, side_effects: ["->RETIRED", "future {PENDING,CONFIRMED} reservations -> CANCELLED"] }
  # ---- Reservation ----
  - { method: POST, path: "/v1/reservations", description: "Create a table reservation", roles: [Member, FrontDesk], code: 201, input: [member_id, table_id, start_at, end_at, party_size], output: Reservation, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/v1/reservations", description: "List/filter reservations", roles: [Manager, FrontDesk, Member], code: 200, input: ["member_id?", "table_id?", "event_id?", "status?", "limit?", "offset?"], output: "Reservation[]", side_effects: [] }
  - { method: GET, path: "/v1/reservations/{id}", description: "Get a reservation", roles: [Manager, FrontDesk, Member], code: 200, input: [], output: Reservation, side_effects: [] }
  - { method: POST, path: "/v1/reservations/{id}/confirm", description: "Confirm a reservation", roles: [FrontDesk], code: 200, input: [], output: Reservation, side_effects: ["PENDING->CONFIRMED"] }
  - { method: POST, path: "/v1/reservations/{id}/reschedule", description: "Move a reservation window; OCC-guarded", roles: [Member, FrontDesk], code: 200, input: [start_at, end_at, expected_reservation_version], output: Reservation, side_effects: ["increments Reservation.version by 1", "re-checks overlap/capacity/window"] }
  - { method: POST, path: "/v1/reservations/{id}/cancel", description: "Cancel a reservation", roles: [Member, FrontDesk], code: 200, input: [], output: Reservation, side_effects: ["{PENDING,CONFIRMED}->CANCELLED"] }
  - { method: POST, path: "/v1/reservations/{id}/check-in", description: "Check in; opens a TableSession", roles: [FrontDesk], code: 201, input: [], output: TableSession, side_effects: ["Reservation CONFIRMED->CHECKED_IN", "create TableSession OPEN", "provisional_charge_cents stamped"] }
  - { method: POST, path: "/v1/reservations/{id}/no-show", description: "Mark a confirmed reservation as no-show", roles: [FrontDesk], code: 200, input: [], output: Reservation, side_effects: ["CONFIRMED->NO_SHOW", "member.no_show_strikes+=1", "possible SUSPENSION cascade"] }
  # ---- TableSession ----
  - { method: POST, path: "/v1/sessions", description: "Open a walk-in table session", roles: [FrontDesk], code: 201, input: [table_id, "member_id?"], output: TableSession, side_effects: ["status=OPEN, started_at=current_utc", "provisional_charge_cents stamped"] }
  - { method: GET, path: "/v1/sessions", description: "List/filter sessions", roles: [Manager, FrontDesk, Member], code: 200, input: ["reservation_id?", "table_id?", "member_id?", "status?", "limit?", "offset?"], output: "TableSession[]", side_effects: [] }
  - { method: GET, path: "/v1/sessions/{id}", description: "Get a session", roles: [Manager, FrontDesk, Member], code: 200, input: [], output: TableSession, side_effects: [] }
  - { method: POST, path: "/v1/sessions/{id}/close", description: "Close a session; final charge debits wallet", roles: [FrontDesk], code: 200, input: [], output: TableSession, side_effects: ["OPEN->CLOSED", "final_charge_cents stamped", "wallet debit", "reservation CHECKED_IN->COMPLETED"] }
  - { method: POST, path: "/v1/sessions/{id}/void", description: "Void a session (no charge)", roles: [FrontDesk, Manager], code: 200, input: [], output: TableSession, side_effects: ["OPEN->VOIDED", "final_charge_cents=0", "reservation CHECKED_IN->CANCELLED"] }
  # ---- FnbOrder ----
  - { method: POST, path: "/v1/fnb-orders", description: "Open a food/beverage tab on a session", roles: [Member, FrontDesk], code: 201, input: [session_id, "member_id?", line_items], output: FnbOrder, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/v1/fnb-orders", description: "List/filter fnb orders", roles: [Manager, FrontDesk, Member], code: 200, input: ["session_id?", "member_id?", "status?", "limit?", "offset?"], output: "FnbOrder[]", side_effects: [] }
  - { method: GET, path: "/v1/fnb-orders/{id}", description: "Get an fnb order", roles: [Manager, FrontDesk, Member], code: 200, input: [], output: FnbOrder, side_effects: [] }
  - { method: POST, path: "/v1/fnb-orders/{id}/submit", description: "Submit tab; totals + wallet debit", roles: [FrontDesk], code: 200, input: [], output: FnbOrder, side_effects: ["OPEN->SUBMITTED", "fnb_order_total stamped", "wallet debit"] }
  - { method: POST, path: "/v1/fnb-orders/{id}/void", description: "Void an open tab", roles: [FrontDesk], code: 200, input: [], output: FnbOrder, side_effects: ["OPEN->VOIDED"] }
  # ---- Tournament ----
  - { method: POST, path: "/v1/tournaments", description: "Create a tournament/league event", roles: [Manager], code: 201, input: [name, format, "handicap_mode?", entry_fee_cents, max_entries], output: Tournament, side_effects: ["status=SCHEDULED", "open_slots=max_entries", "prize_pool_cents=0"] }
  - { method: GET, path: "/v1/tournaments", description: "List/filter tournaments", roles: [Manager, FrontDesk, Member], code: 200, input: ["status?", "format?", "limit?", "offset?"], output: "Tournament[]", side_effects: [] }
  - { method: GET, path: "/v1/tournaments/{id}", description: "Get a tournament", roles: [Manager, FrontDesk, Member], code: 200, input: [], output: Tournament, side_effects: [] }
  - { method: POST, path: "/v1/tournaments/{id}/open", description: "Open registration", roles: [Manager], code: 200, input: [], output: Tournament, side_effects: ["SCHEDULED->REGISTRATION_OPEN"] }
  - { method: POST, path: "/v1/tournaments/{id}/seed", description: "Seed the bracket (stamps handicap spots)", roles: [Manager], code: 200, input: [], output: Tournament, side_effects: ["REGISTRATION_OPEN->SEEDED", "each entry.handicap_spot stamped"] }
  - { method: POST, path: "/v1/tournaments/{id}/start", description: "Start play", roles: [Manager], code: 200, input: [], output: Tournament, side_effects: ["SEEDED->IN_PROGRESS"] }
  - { method: POST, path: "/v1/tournaments/{id}/complete", description: "Complete tournament", roles: [Manager], code: 200, input: [], output: Tournament, side_effects: ["IN_PROGRESS->COMPLETED"] }
  - { method: POST, path: "/v1/tournaments/{id}/cancel", description: "Cancel; withdraw + refund all entries", roles: [Manager], code: 200, input: [], output: Tournament, side_effects: ["->CANCELLED", "entries WITHDRAWN + refunds + slot/pool restore"] }
  # ---- TournamentEntry ----
  - { method: POST, path: "/v1/tournament-entries", description: "Enter a tournament (entry fee debits wallet)", roles: [Member], code: 201, input: [tournament_id, member_id], output: TournamentEntry, side_effects: ["status=ENTERED", "entry_fee_cents copied", "wallet debit", "prize_pool += fee", "open_slots -= 1"] }
  - { method: GET, path: "/v1/tournament-entries", description: "List/filter entries", roles: [Manager, FrontDesk, Member], code: 200, input: ["tournament_id?", "member_id?", "status?", "limit?", "offset?"], output: "TournamentEntry[]", side_effects: [] }
  - { method: GET, path: "/v1/tournament-entries/{id}", description: "Get an entry", roles: [Manager, FrontDesk, Member], code: 200, input: [], output: TournamentEntry, side_effects: [] }
  - { method: POST, path: "/v1/tournament-entries/{id}/check-in", description: "Check in an entry", roles: [FrontDesk], code: 200, input: [], output: TournamentEntry, side_effects: ["ENTERED->CHECKED_IN"] }
  - { method: POST, path: "/v1/tournament-entries/{id}/withdraw", description: "Withdraw; refund + slot/pool restore", roles: [Member], code: 200, input: [], output: TournamentEntry, side_effects: ["ENTERED->WITHDRAWN", "wallet refund", "prize_pool -= fee", "open_slots += 1"] }
  # ---- ProShopProduct ----
  - { method: POST, path: "/v1/products", description: "Create a pro-shop product", roles: [ProShopStaff, Manager], code: 201, input: [sku, name, category, unit_price_cents, stock_qty], output: ProShopProduct, side_effects: [] }
  - { method: GET, path: "/v1/products", description: "List/filter products", roles: [Manager, FrontDesk, ProShopStaff, Member], code: 200, input: ["category?", "limit?", "offset?"], output: "ProShopProduct[]", side_effects: [] }
  - { method: GET, path: "/v1/products/{id}", description: "Get a product", roles: [Manager, FrontDesk, ProShopStaff, Member], code: 200, input: [], output: ProShopProduct, side_effects: [] }
  - { method: POST, path: "/v1/products/{id}/restock", description: "Add units to stock", roles: [ProShopStaff, Manager], code: 200, input: [qty], output: ProShopProduct, side_effects: ["stock_qty += qty"] }
  - { method: POST, path: "/v1/products/{id}/sell", description: "Sell units (table/cue retail); decrements stock, optional member wallet charge", roles: [ProShopStaff, Manager], code: 200, input: [qty, "member_id?"], output: ProShopProduct, side_effects: ["stock_qty -= qty", "if member_id: wallet -= unit_price_cents*qty"] }
  # ---- RepairOrder ----
  - { method: POST, path: "/v1/repair-orders", description: "Drop off a cue/table for service", roles: [Member, ProShopStaff], code: 201, input: [member_id, service_type, quote_cents, "product_id?", "table_id?"], output: RepairOrder, side_effects: ["status=RECEIVED"] }
  - { method: GET, path: "/v1/repair-orders", description: "List/filter repair orders", roles: [Manager, FrontDesk, ProShopStaff, Member], code: 200, input: ["member_id?", "product_id?", "table_id?", "status?", "limit?", "offset?"], output: "RepairOrder[]", side_effects: [] }
  - { method: GET, path: "/v1/repair-orders/{id}", description: "Get a repair order", roles: [Manager, FrontDesk, ProShopStaff, Member], code: 200, input: [], output: RepairOrder, side_effects: [] }
  - { method: POST, path: "/v1/repair-orders/{id}/start", description: "Begin service", roles: [ProShopStaff], code: 200, input: [], output: RepairOrder, side_effects: ["RECEIVED->IN_PROGRESS"] }
  - { method: POST, path: "/v1/repair-orders/{id}/ready", description: "Mark ready for pickup", roles: [ProShopStaff], code: 200, input: [], output: RepairOrder, side_effects: ["IN_PROGRESS->READY"] }
  - { method: POST, path: "/v1/repair-orders/{id}/pickup", description: "Customer pickup; quote debits wallet", roles: [FrontDesk], code: 200, input: [], output: RepairOrder, side_effects: ["READY->PICKED_UP", "wallet -= quote_cents"] }
  - { method: POST, path: "/v1/repair-orders/{id}/cancel", description: "Cancel a repair before pickup", roles: [Member, ProShopStaff], code: 200, input: [], output: RepairOrder, side_effects: ["{RECEIVED,IN_PROGRESS}->CANCELLED"] }
  # ---- Event ----
  - { method: POST, path: "/v1/events", description: "Create a private event inquiry", roles: [Member, Manager], code: 201, input: [host_member_id, table_count, start_at, end_at], output: Event, side_effects: ["booking_status=INQUIRY", "payment_status=UNPAID"] }
  - { method: GET, path: "/v1/events", description: "List/filter events", roles: [Manager, FrontDesk, Member], code: 200, input: ["host_member_id?", "booking_status?", "limit?", "offset?"], output: "Event[]", side_effects: [] }
  - { method: GET, path: "/v1/events/{id}", description: "Get an event", roles: [Manager, FrontDesk, Member], code: 200, input: [], output: Event, side_effects: [] }
  - { method: POST, path: "/v1/events/{id}/quote", description: "Quote the event (event_quote)", roles: [Manager], code: 200, input: [], output: Event, side_effects: ["INQUIRY->QUOTED", "quote_cents, deposit_cents stamped"] }
  - { method: POST, path: "/v1/events/{id}/pay-deposit", description: "Pay deposit from host wallet (payment axis)", roles: [Member], code: 200, input: [], output: Event, side_effects: ["payment_status UNPAID->DEPOSIT_PAID", "wallet -= deposit_cents"] }
  - { method: POST, path: "/v1/events/{id}/book", description: "Book tables for the event (creates CONFIRMED reservations)", roles: [Member], code: 200, input: [], output: Event, side_effects: ["QUOTED->BOOKED", "create table_count CONFIRMED reservations"] }
  - { method: POST, path: "/v1/events/{id}/confirm", description: "Confirm event (requires deposit paid)", roles: [Manager], code: 200, input: [], output: Event, side_effects: ["BOOKED->CONFIRMED"] }
  - { method: POST, path: "/v1/events/{id}/complete", description: "Complete event", roles: [Manager], code: 200, input: [], output: Event, side_effects: ["CONFIRMED->COMPLETED", "payment_status->PAID_IN_FULL"] }
  - { method: POST, path: "/v1/events/{id}/cancel", description: "Cancel event; cascade reservations/sessions + deposit refund", roles: [Member, Manager], code: 200, input: [], output: Event, side_effects: ["->CANCELLED", "reservations CANCELLED -> sessions VOIDED", "deposit refunded if DEPOSIT_PAID"] }
  # ---- test-driving ----
  - { method: POST, path: "/v1/_clock/set_current_utc", description: "Set the logical clock. Server default before any call is 2026-07-01T00:00:00Z (never real wall-clock).", roles: [Manager], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set; re-evaluates lazy member expiry on subsequent reads"] }

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or a Member acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced entity id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version != parent's current version" }
  - { id: ERR_TABLE_NOT_ACTIVE, http: 409, condition: "Operation requires table.status == ACTIVE but table is MAINTENANCE/RETIRED" }
  - { id: ERR_DEPENDENT_STATE, http: 409, condition: "A required related entity is in the wrong state (session not OPEN, tournament not SEEDED, event deposit unpaid)" }
  - { id: ERR_TABLE_TIME_CONFLICT, http: 409, condition: "Reservation window overlaps another reservation on the same table within the turnover buffer" }
  - { id: ERR_EVENT_CAPACITY_UNAVAILABLE, http: 409, condition: "Fewer than table_count ACTIVE tables are free across the event window" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "party_size exceeds table.seat_capacity" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "start_at >= end_at, window outside reservation horizon, or misaligned time" }
  - { id: ERR_PRECONDITION_NOT_MET, http: 409, condition: "Tournament seed below MIN_TOURNAMENT_ENTRIES, or product sell qty exceeds stock" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "A wallet debit would drive wallet_credit_cents below 0" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, bad enum/type, or out-of-range value" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "A SUSPENDED member attempts to create a reservation, entry, or event" }
  - { id: ERR_STOCK_NEGATIVE, http: 422, condition: "Restock/sell qty non-positive, or sell would drive stock below 0 (alias reported as ERR_PRECONDITION_NOT_MET for sell)" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation (plan.tier, table.table_number, member.email, product.sku)" }
  - { id: ERR_PAGINATION, http: 422, condition: "limit/offset out of allowed range" }

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Member
    description: "A billiards-hall member acting on their own bookings, entries, tabs, repairs and events."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /v1/members/{id}/plan-change (own)"
      - "POST /v1/tournament-entries (self as member_id)"
      - "POST /v1/tournament-entries/{id}/withdraw (own)"
      - "POST /v1/events/{id}/pay-deposit (own)"
      - "POST /v1/events/{id}/book (own)"
    shared_operations:
      - "POST /v1/members (register, also Manager)"
      - "POST /v1/members/{id}/renew (also FrontDesk)"
      - "POST /v1/reservations, /cancel, /reschedule (also FrontDesk)"
      - "POST /v1/fnb-orders (also FrontDesk)"
      - "POST /v1/repair-orders, /cancel (also ProShopStaff)"
      - "POST /v1/events, /cancel (also Manager)"
      - "GET reads (plans, tables, members own, reservations own, sessions, tournaments, entries, products, events own, repair-orders own)"
  - name: FrontDesk
    description: "Front-of-house operator: confirms/checks-in reservations, opens/closes sessions, submits tabs, checks in entries, processes pickups."
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/reservations/{id}/confirm"
      - "POST /v1/reservations/{id}/check-in"
      - "POST /v1/reservations/{id}/no-show"
      - "POST /v1/sessions (walk-in), /close"
      - "POST /v1/fnb-orders/{id}/submit, /void"
      - "POST /v1/tournament-entries/{id}/check-in"
      - "POST /v1/repair-orders/{id}/pickup"
    shared_operations:
      - "POST /v1/members/{id}/renew, /wallet/adjustments"
      - "POST /v1/sessions/{id}/void (also Manager)"
      - "POST /v1/reservations (on behalf), /cancel, /reschedule"
      - "GET reads (all)"
  - name: Manager
    description: "Operator with configuration + tournament/table/event administration authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/plans, /v1/tables, /v1/tables/{id}/{maintenance,activate,retire}"
      - "POST /v1/tournaments and all /v1/tournaments/{id}/* lifecycle"
      - "POST /v1/events/{id}/quote, /confirm, /complete"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "POST /v1/members (register), /wallet/adjustments"
      - "POST /v1/products (also ProShopStaff)"
      - "POST /v1/events, /cancel"
      - "POST /v1/sessions/{id}/void"
      - "GET reads (all)"
  - name: ProShopStaff
    description: "Pro-shop operator: manages products/inventory and repair-order servicing."
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/products/{id}/restock, /sell"
      - "POST /v1/repair-orders/{id}/start, /ready"
    shared_operations:
      - "POST /v1/products (also Manager)"
      - "POST /v1/repair-orders (drop-off), /cancel"
      - "GET reads (products, repair-orders)"

