            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "C2", title: "Course Two", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { c2: $.data.id } }
