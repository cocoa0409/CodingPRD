          - calculations.audit_support_score
        distinguishing_aspect: "Every declared side effect of the accept transition is observable: accepted_by_user_id, accepted_at, the stored sampled_audit score of 100.00, no auto-opened case at or above the risk floor, and a version bump."
        test_recipe:
          setup:
            - "A SUBMITTED submission with one payroll-supported and SUPPORTED 8.00-hour RN shift and one RECONCILED census day, so the sampled score is 100.00"
            - "The verifying auditor is auditor-verify-01 and the accepting auditor is auditor-accept-01, satisfying the acceptance segregation-of-duties rule"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_validate
            - *k_submit
          trigger:
            - call: "POST /submissions/${sub}/accept"
              payload: {}
              as: StateAuditor
              as_user_id: "auditor-accept-01"
          assert:
            - "QuarterlySubmission.${sub}.status == ACCEPTED, accepted_by_user_id == auditor-accept-01, accepted_at == 2026-08-01T00:00:00Z"
            - "QuarterlySubmission.${sub}.audit_support_score == 100.00, computed as 100 * (0.50 * 1.0000 + 0.30 * 1.0000 + 0.20 * 1.0000)"
            - "GET /discrepancy-cases with facility_id ${fac} returns total_count == 0 because 100.00 is not below AUDIT_RISK_FLOOR 70.00"
            - "Facility.${fac}.posture == REPORTING_OPEN with open_case_count == 0"

      - name: accept_from_draft_is_rejected_as_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - validations[priority 18 ERR_SUBMISSION_STATE_INVALID]
          - state_machines.QuarterlySubmission.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: "accept declares a from-set of SUBMITTED only; firing it against a DRAFT submission returns ERR_SUBMISSION_STATE_INVALID and none of the accept side effects run."
        test_recipe:
