  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: provider_inactive_state_trumps_enrollment_referential_check
        grounds:
          - validations.priority_6_state
          - validations.priority_10_business_referential
          - errors.ERR_PROVIDER_NOT_ACTIVE
          - errors.ERR_ENROLLMENT_NOT_APPROVED
        distinguishing_aspect: |
          Error-category pair (state vs business_referential): when a claim
          intake request fails BOTH the provider-not-active check (priority 6)
          AND the enrollment-not-approved check (priority 10), the response
          MUST be ERR_PROVIDER_NOT_ACTIVE because state checks outrank
          business_referential checks.
        test_recipe:
          setup:
            - "Provider prov_a is SUSPENDED."
            - "No APPROVED CLAIMS_837 enrollment exists for (prov_a, pay_a)."
            - "SubmitterCredential cred_a is in ACTIVE state (suspended provider does not auto-revoke credentials)."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Priority Provider", tax_identification_number: "555555555", national_provider_identifier: "1555555555", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { prov_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-PR1", trading_partner_agreement_ref: "TPA-PR1", effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials/${cred_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYPC", display_name: "Priority Payer", claims_lead_time_days: 5, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED", monthly_minimum_cents: 0 }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/suspend"
              payload: {}
              as: ClearinghouseOps
          trigger:
            - call: "POST /clearinghouse/providers/${prov_a}/claims"
              payload: { payer_id: "${pay_a}", submitter_credential_id: "${cred_a}", patient_control_number: "PCN-X1", idempotency_key: "IDEM-X1", service_date: "2026-09-01T00:00:00Z", total_charge_cents: 100, diagnosis_codes: ["Z00.0"], rendering_npi: "1555555555", subscriber_id: "MBR-X", lines: [{ cpt_code: "99213", units: 1, unit_charge_cents: 100 }] }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PROVIDER_NOT_ACTIVE"
            - "error_id != ERR_ENROLLMENT_NOT_APPROVED — the lower-priority referential check is masked"

      - name: enrollment_referential_trumps_fiscal_total_mismatch
        grounds:
          - validations.priority_10_business_referential
          - validations.priority_13_business_constraint
          - errors.ERR_ENROLLMENT_NOT_APPROVED
          - errors.ERR_CLAIM_TOTAL_MISMATCH
        distinguishing_aspect: |
          Error-category pair (business_referential vs business_constraint):
          when claim intake fails BOTH the enrollment-not-approved check
          (priority 10) AND the total-mismatch check (priority 13), the
          response MUST be ERR_ENROLLMENT_NOT_APPROVED. Different category
          pair from the state-vs-referential conflict.
        test_recipe:
          setup:
            - "Provider prov_a ACTIVE with ACTIVE credential cred_a."
            - "Payer pay_a exists, but NO enrollment for (prov_a, pay_a, CLAIMS_837)."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Priority2 Provider", tax_identification_number: "666666666", national_provider_identifier: "1666666664", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { prov_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-P2", trading_partner_agreement_ref: "TPA-P2", effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials/${cred_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYP2", display_name: "Priority2 Payer", claims_lead_time_days: 5, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED", monthly_minimum_cents: 0 }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
          trigger:
            - call: "POST /clearinghouse/providers/${prov_a}/claims"
              payload: { payer_id: "${pay_a}", submitter_credential_id: "${cred_a}", patient_control_number: "PCN-Y1", idempotency_key: "IDEM-Y1", service_date: "2026-09-01T00:00:00Z", total_charge_cents: 99999, diagnosis_codes: ["Z00.0"], rendering_npi: "1666666664", subscriber_id: "MBR-Y", lines: [{ cpt_code: "99213", units: 1, unit_charge_cents: 100 }] }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ENROLLMENT_NOT_APPROVED"
            - "error_id != ERR_CLAIM_TOTAL_MISMATCH — the fiscal check is masked by the higher-priority referential failure"

  # ===========================================================================
  - rule_id: boundary_precision_check
