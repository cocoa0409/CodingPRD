            - call: "POST /slate/program-blocks"
              payload: { season_id: "${season_id}", name: "Friday Premieres", block_start: "2027-11-05T00:00:00Z", premiere_cadence_days: 7, max_encores_per_title: 5, min_minutes_between_airings: 1440 }
              as: ProgrammingExec
              captures: { block_id: $.data.id }
            - call: "POST /slate/program-blocks/${block_id}/publish"
              payload: {}
              as: ProgrammingExec
              captures: { bv: $.data.version }
            - call: "POST /slate/air-slots"
              payload: { block_id: "${block_id}", title_id: "${t1}", air_start: "2027-11-07T00:00:00Z", kind: "ENCORE", expected_block_version: "${bv}" }
              as: ProgrammingExec
