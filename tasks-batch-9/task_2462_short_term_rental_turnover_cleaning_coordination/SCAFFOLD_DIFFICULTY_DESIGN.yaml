              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties"
              payload: { code: "AUS-102", name: "Zilker Studio", zone_code: "ZONE_A", size_tier: "STUDIO", owner_contact_email: "owner2@example.com", bedroom_count: 1, bathroom_count: 1, bed_count: 1, local_utc_offset_minutes: -300, min_clean_minutes: 60, min_skill_level: 1 }
              as: PlatformAdmin
              captures: { p1b: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-SHEET-Q", name: "Queen sheet set", category: "LINEN", unit_cost_cents: 260, par_qty: 6, unit: "SET", initial_on_hand_qty: 6 }
              as: PlatformAdmin
              captures: { sl1: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-TOWEL-B", name: "Bath towel", category: "LINEN", unit_cost_cents: 180, par_qty: 8, unit: "EACH", initial_on_hand_qty: 8 }
              as: PlatformAdmin
              captures: { sl2: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner A", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { ca: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner B", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cb: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1b}", external_ref: "OUT-2", guest_name: "Guest Out 2", checkin_at: "2026-08-06T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out2: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_v: "$.data.version" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out2}" }
              as: Coordinator
              captures: { t2: "$.data.id", t2_v: "$.data.version" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "${ca}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a1: "$.data.id" }
            - call: "POST /turnovers/${t2}/assign"
              payload: { expected_turnover_version: "${t2_v}", cleaner_id: "${cb}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a2: "$.data.id" }
            - call: "POST /assignments/${a1}/accept"
              payload: {}
              as: Cleaner
              as_user_id: "${ca}"
            - call: "POST /assignments/${a2}/accept"
              payload: {}
              as: Cleaner
              as_user_id: "${cb}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b_out}/checkout"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_out2}/checkout"
              payload: {}
              as: Coordinator
            - call: "POST /turnovers/${t1}/start"
              payload: {}
              as: Cleaner
              as_user_id: "${ca}"
            - call: "GET /turnovers/${t1}/checklist-tasks"
              payload: {}
              as: Cleaner
              as_user_id: "${ca}"
              captures: { k1: "$.data[0].id", k2: "$.data[1].id", k3: "$.data[2].id", k4: "$.data[3].id" }
            - call: "POST /checklist-tasks/${k1}/submit"
              payload: { note: "stripped" }
              as: Cleaner
              as_user_id: "${ca}"
            - call: "POST /checklist-tasks/${k2}/submit"
              payload: { photo_uri: "https://ph/b1.jpg" }
              as: Cleaner
              as_user_id: "${ca}"
            - call: "POST /checklist-tasks/${k3}/submit"
              payload: { photo_uri: "https://ph/b2.jpg" }
              as: Cleaner
              as_user_id: "${ca}"
            - call: "POST /checklist-tasks/${k4}/submit"
              payload: { photo_uri: "https://ph/b3.jpg", restock_entries: [{ supply_line_id: "${sl1}", qty_used: 1 }, { supply_line_id: "${sl2}", qty_used: 1 }] }
              as: Cleaner
              as_user_id: "${ca}"
            - call: "POST /checklist-tasks/${k1}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /checklist-tasks/${k2}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /checklist-tasks/${k3}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /checklist-tasks/${k4}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /turnovers/${t1}/complete"
              payload: {}
              as: Cleaner
              as_user_id: "${ca}"
            - call: "POST /turnovers/${t2}/start"
              payload: {}
              as: Cleaner
              as_user_id: "${cb}"
            - call: "GET /turnovers/${t2}/checklist-tasks"
              payload: {}
              as: Cleaner
              as_user_id: "${cb}"
              captures: { m1: "$.data[0].id", m2: "$.data[1].id", m3: "$.data[2].id", m4: "$.data[3].id" }
            - call: "POST /checklist-tasks/${m1}/submit"
              payload: { note: "stripped" }
              as: Cleaner
              as_user_id: "${cb}"
            - call: "POST /checklist-tasks/${m2}/submit"
              payload: { photo_uri: "https://ph/c1.jpg" }
              as: Cleaner
              as_user_id: "${cb}"
            - call: "POST /checklist-tasks/${m3}/submit"
              payload: { photo_uri: "https://ph/c2.jpg" }
              as: Cleaner
              as_user_id: "${cb}"
            - call: "POST /checklist-tasks/${m1}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /checklist-tasks/${m2}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /checklist-tasks/${m3}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /checklist-tasks/${m4}/review"
              payload: { action: "WAIVE", reject_reason: "no supply lines configured on this unit" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /turnovers/${t2}/complete"
              payload: {}
              as: Cleaner
              as_user_id: "${cb}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T21:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b_in}/guest-review"
              payload: { cleanliness_rating: 4 }
              as: Coordinator
            - call: "POST /quality-audits"
              payload: { turnover_id: "${t1}", score: 88 }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { q1: "$.data.id" }
            - call: "POST /quality-audits"
              payload: { turnover_id: "${t2}", score: 88 }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { q2: "$.data.id" }
          trigger:
            - call: "POST /quality-audits/${q1}/finalize"
              payload: {}
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { q1_variant: "$.data.variant_applied", q1_observed: "$.data.observed_score", q1_result: "$.data.resulting_quality_score" }
            - call: "POST /quality-audits/${q2}/finalize"
              payload: {}
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { q2_variant: "$.data.variant_applied", q2_observed: "$.data.observed_score", q2_result: "$.data.resulting_quality_score" }
          assert:
            - "${q1_variant} == BLENDED and ${q2_variant} == AUDIT_ONLY"
            - "${q1_observed} == 84.80 and ${q2_observed} == 88.00"
            - "${q1_result} == 89.84 and ${q2_result} == 90.80"
            - "QualityAudit.${q1}.guest_rating_at_audit == 4 and QualityAudit.${q2}.guest_rating_at_audit == null"
            - "Cleaner.${ca}.quality_score == 89.84"
            - "Cleaner.${cb}.quality_score == 90.80"
            - "${q2_result} - ${q1_result} == 0.96"
            - "QualityAudit.${q1}.pay_adjustment_cents == 0 and QualityAudit.${q2}.pay_adjustment_cents == 0"
            - "PayLine of ${t1} keeps status FINAL (no ADJUSTED transition on a zero adjustment)"

      - name: quality_variant_selection_late_guest_review_does_not_rescore_finalized_audit
        grounds:
          - calculations.cleaner_quality_score_recompute
          - entities.Booking.fields.cleanliness_rating
          - entities.QualityAudit.fields.variant_applied
          - endpoints["POST /bookings/{id}/guest-review"]
        distinguishing_aspect: |
          Variant selection is pinned to the state at finalization time: finalizing before any
          rating exists selects AUDIT_ONLY (resulting_quality_score 90.80), and a cleanliness_rating
          of 4 recorded afterwards is stored on the booking yet leaves the audit's
          variant_applied, observed_score and the cleaner's quality_score byte-identical.
        test_recipe:
          setup:
            - "Same P1 / cleaner C / OUT-1 / IN-1 / T1 world as pay_variant_divergence_provisional_vs_final_linen_units, driven through COMPLETED at clock 2026-08-08T16:00:00Z."
            - "No guest review has been filed on IN-1 at audit time."
            - "Audit Q on T1 with score 88 is FINALIZED first, while the clock still reads 2026-08-08T16:00:00Z, so AUDIT_ONLY is selected."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-SHEET-Q", name: "Queen sheet set", category: "LINEN", unit_cost_cents: 260, par_qty: 6, unit: "SET", initial_on_hand_qty: 6 }
              as: PlatformAdmin
              captures: { sl1: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cc: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
