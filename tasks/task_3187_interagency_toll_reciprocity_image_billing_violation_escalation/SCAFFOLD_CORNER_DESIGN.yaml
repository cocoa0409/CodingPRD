            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Rob Role", holder_email: "rob@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 10000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-RB", vehicle_class: "CLASS_2", plate_number: "ROL100", plate_state: "NY" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-RB", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-23T09:00:00Z", is_peak: false, idempotency_key: "rb1" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "Account.${acct}.balance_cents == 10000"

      - name: violations_officer_cannot_generate_settlement_files
        claim_type: role_denial
        grounds:
          - endpoints.POST_/toll/settlement-files/generate
          - roles.ViolationsOfficer
        distinguishing_aspect: "Settlement generation is SettlementOfficer-exclusive; ViolationsOfficer gets 403 — the peer-role boundary is enforced even though both are back-office roles."
        test_recipe:
          setup:
            - "Agencies HOME and AWAY exist."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
          trigger:
            - call: "POST /toll/settlement-files/generate"
              payload: { from_agency_id: "${home_id}", to_agency_id: "${away_id}" }
              as: ViolationsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE"

      - name: plate_lookup_agent_cannot_issue_notices
        claim_type: role_denial
        grounds:
          - endpoints.POST_/toll/violations/{violationId}/issue_notice
          - roles.PlateLookupAgent
        distinguishing_aspect: "Notice issuance is ViolationsOfficer-exclusive; PlateLookupAgent — whose resolve creates the violation — still cannot escalate it."
        test_recipe:
          setup:
            - "One unregistered-plate violation exists (OPEN)."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 800, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { plate_number: "UNREG8", plate_state: "PA", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-24T09:00:00Z", is_peak: false, idempotency_key: "u8" }
              as: AgencyOperations
            - call: "GET /toll/image-bills"
              payload: { status: "PENDING_LOOKUP" }
              as: PlateLookupAgent
              captures: { b8: "$.data[0].id" }
            - call: "POST /toll/image-bills/${b8}/resolve"
              payload: {}
              as: PlateLookupAgent
            - call: "GET /toll/violations"
              payload: {}
              as: ViolationsOfficer
              captures: { v8: "$.data[0].id" }
          trigger:
            - call: "POST /toll/violations/${v8}/issue_notice"
              payload: {}
              as: PlateLookupAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "Violation.${v8}.notice_count == 0"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_replenishment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[replenish-stale-account-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "A replenishment carrying the pre-toll account version is rejected 412: client reads version 1, a toll debit bumps it to 2, and the replenishment still citing 1 fails ERR_STALE_VERSION without touching the balance."
        test_recipe:
          setup:
            - "Account (version observed) with TAG-O; AWAY P1 base 800 schedule."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 800, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Ora Occ", holder_email: "ora@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 5000 }
              as: AgencyOperations
              captures: { acct: "$.data.id", v_seen: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-O", vehicle_class: "CLASS_2", plate_number: "OCC100", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-O", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-25T09:00:00Z", is_peak: false, idempotency_key: "o1" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "SUCCEEDED", expected_account_version: "${v_seen}" }
              as: AgencyOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "Account.${acct}.balance_cents == 4200 (toll debit applied; stale replenishment did NOT credit)"

      - name: occ_adjustment_succeeds_with_current_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[account-adjust-stale-version]
        distinguishing_aspect: "The same OCC rule admits the happy path: an adjustment carrying the CURRENT version succeeds, bumps version by 1, and applies the delta; a second adjustment with the now-stale version then fails 412."
        test_recipe:
          setup:
            - "Account balance 5000; client holds version v_cur from a fresh GET."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: [] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Ada Just", holder_email: "ada@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 5000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { v_cur: "$.data.version" }
          trigger:
            - call: "POST /toll/accounts/${acct}/adjustments"
              payload: { delta_cents: 500, reason: "GOODWILL", expected_account_version: "${v_cur}" }
              as: AgencyOperations
            - call: "POST /toll/accounts/${acct}/adjustments"
              payload: { delta_cents: 500, reason: "GOODWILL", expected_account_version: "${v_cur}" }
              as: AgencyOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "first adjustment: 201, Account.${acct}.balance_cents == 5500"
            - "second adjustment (same stale version): 412 ERR_STALE_VERSION; balance stays 5500"

      - name: rate_not_found_outside_schedule_window
        claim_type: derived_field_reconciliation
        grounds:
          - errors.ERR_RATE_NOT_FOUND
          - entities.RateSchedule.fields.effective_to
        distinguishing_aspect: "A trip at 2026-10-01T00:00:00Z against a schedule whose half-open window ends exactly at that instant finds NO covering schedule (the endpoint instant is excluded) and fails ERR_RATE_NOT_FOUND."
        test_recipe:
          setup:
            - "AWAY P1 CLASS_2 schedule window [2026-09-01, 2026-10-01); account TAG-WND balance 10000."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 800, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Wen Dow", holder_email: "wen@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 10000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-WND", vehicle_class: "CLASS_2", plate_number: "WND100", plate_state: "NY" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-WND", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-10-01T00:00:00Z", is_peak: false, idempotency_key: "wnd1" }
              as: AgencyOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_RATE_NOT_FOUND (half-open window excludes effective_to instant)"
            - "Account.${acct}.balance_cents == 10000"

      - name: discount_usage_resets_on_day_rollover
        claim_type: rate_threshold_triggers
        grounds:
          - entities.Account.fields.discount_used_today_cents
          - endpoints.POST_/toll/_clock/advance_day
        distinguishing_aspect: "advance_day resets discount_used_today_cents: after a capped day (300 used), the first trip next UTC day receives the full per-trip discount again (115), proving the cap is per-day not lifetime."
        test_recipe:
          setup:
            - "Capped-plan fixture: base 575, 20% plan cap 300; three trips on day 1 used the whole cap (460/460/505)."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P2", vehicle_class: "CLASS_2", base_rate_cents: 575, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "COMMUTER", discount_pct: 0.20, daily_discount_cap_cents: 300, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Dre Set", holder_email: "dre@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 100000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-DS", vehicle_class: "CLASS_2", plate_number: "RST100", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-DS", away_agency_id: "${away_id}", plaza_code: "P2", trip_timestamp: "2026-09-04T09:00:00Z", is_peak: false, idempotency_key: "ds1" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-DS", away_agency_id: "${away_id}", plaza_code: "P2", trip_timestamp: "2026-09-04T10:00:00Z", is_peak: false, idempotency_key: "ds2" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-DS", away_agency_id: "${away_id}", plaza_code: "P2", trip_timestamp: "2026-09-04T11:00:00Z", is_peak: false, idempotency_key: "ds3" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 1 }
              as: SettlementOfficer
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-DS", away_agency_id: "${away_id}", plaza_code: "P2", trip_timestamp: "2026-09-05T09:00:00Z", is_peak: false, idempotency_key: "ds4" }
              as: AgencyOperations
              captures: { t4: "$.data.id" }
          assert:
            - "after day 1: Account.${acct}.discount_used_today_cents == 300"
            - "TollTransaction.${t4}.discount_amount_cents == 115 (full per-trip discount restored after rollover)"
            - "Account.${acct}.discount_used_today_cents == 115 after the day-2 trip"

