              as: Consultant
              captures: { srv_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys/${srv_id}/complete"
              payload: {}
              as: FieldTechnician
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "WATER_INGRESS", severity: "CRITICAL", description: "c1" }
              as: Consultant
              captures: { c1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "WATER_INGRESS", severity: "CRITICAL", description: "c2" }
              as: Consultant
              captures: { c2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "WATER_INGRESS", severity: "CRITICAL", description: "c3" }
              as: Consultant
              captures: { c3_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies/${c1_id}/verify"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/anomalies/${c2_id}/verify"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/anomalies/${c3_id}/verify"
              payload: {}
              as: Consultant
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { risk_mid: $.data.risk_score, posture_mid: $.data.posture }
          trigger:
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { risk_final: $.data.risk_score, posture_final: $.data.posture }
          assert:
            - "risk_mid == 55 and posture_mid == FROZEN (VERIFIED CRITICAL anomaly present)"
            - "risk_final == 55 and posture_final == FROZEN (read-back is stable)"
      - name: posture_derivation_open_anomaly_restricts
        claim_type: input_set_filtering
        grounds:
          - "calculations.posture_derivation"
        distinguishing_aspect: "Posture input set is anomalies with status IN {OPEN, VERIFIED}: a DISMISSED anomaly neither restricts nor freezes; a VERIFIED CRITICAL freezes even with risk >= 70; an OPEN CRITICAL only restricts (verify is what freezes)."
        test_recipe:
          setup: ["engagement IN_PROGRESS; survey completed; anomalies: A1 CRITICAL OPEN, A2 LOW DISMISSED"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "EP", client_name: "C", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "AP", assembly_type: "ROOFING", design_u_factor: 0.8, required_airtightness_lps_m2: 3.0 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys"
              payload: { assembly_id: "${asm_id}", survey_type: "MOISTURE", survey_date: "2026-09-01", ambient_delta_t_c: 1.0 }
              as: Consultant
              captures: { srv_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys/${srv_id}/complete"
              payload: {}
              as: FieldTechnician
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "WATER_INGRESS", severity: "CRITICAL", description: "open critical" }
              as: Consultant
              captures: { a1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "MOISTURE_TRAP", severity: "LOW", description: "to dismiss" }
              as: Consultant
              captures: { a2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies/${a2_id}/dismiss"
              payload: {}
              as: Principal
          trigger:
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { posture1: $.data.posture, risk1: $.data.risk_score }
            - call: "POST /engagements/${eng_id}/anomalies/${a1_id}/verify"
              payload: {}
              as: Consultant
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: Consultant
              captures: { posture2: $.data.posture, risk2: $.data.risk_score }
          assert:
            - "posture1 == RESTRICTED and risk1 == 100 (OPEN CRITICAL restricts but does not freeze; DISMISSED excluded; verify deltas apply only at verify time)"
            - "posture2 == FROZEN and risk2 == 85 (VERIFIED CRITICAL freezes; -15 delta applied once)"

