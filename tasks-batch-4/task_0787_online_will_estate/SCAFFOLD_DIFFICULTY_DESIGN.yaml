          total_assigned_value_cents == 50000 unchanged; the conserved quantity is a monetary asset-value sum.
        test_recipe:
          setup:
            - "ACTIVE subscription; beneficiaries ben1 and ben2; one 50000-cent asset earmarked to ben1 (total_assigned_value_cents == 50000)."
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
