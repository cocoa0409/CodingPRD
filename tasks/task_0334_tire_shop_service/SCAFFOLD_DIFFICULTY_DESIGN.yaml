              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
          assert:
            - "WorkOrder.${wo_id}.fulfillment_status == CANCELLED"
            - "WorkOrderLine.${line_id}.line_status == VOID"
            - "TireModel.${tm_id}.stock_qty == 10"
            - "InstallAppointment.${appt_id}.status == CANCELLED"

      - name: complete_service_cascade_depth2
        grounds:
          - state_machines.WorkOrder.IN_SERVICE_to_COMPLETED
          - state_machines.InstallAppointment.CHECKED_IN_to_COMPLETED
          - state_machines.WorkOrder.AUTHORIZED_to_PAID
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (complete, not cancel): completing service
          (WorkOrder IN_SERVICE->COMPLETED) causes the linked CHECKED_IN InstallAppointment to
          transition to COMPLETED, and because payment_status was AUTHORIZED it is captured to PAID.
          The appointment completion is caused by the order completion, a second-hop effect.
        test_recipe:
