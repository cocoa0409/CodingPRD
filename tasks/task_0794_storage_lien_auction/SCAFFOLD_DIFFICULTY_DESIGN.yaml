  - rule_id: resource_temporal_overlap
    instances:
      - name: onsite_facility_buffer_conflict
        grounds:
          - validations[priority=14]
          - errors[ERR_ONSITE_SLOT_CONFLICT]
          - entities.Auction.fields.mode
        distinguishing_aspect: |
          Facility resource, closed-interval-plus-120min-buffer semantics: two ONSITE
          auctions at the same facility (different units) scheduled 30 minutes apart
          edge-to-edge are rejected with ERR_ONSITE_SLOT_CONFLICT.
        test_recipe:
          setup:
            - "Two matured units u1, u2 at the same facility; an ONSITE auction on u1 spans 10:00-11:00."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "U1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { u1: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "U2", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { u2: "$.data.id" } }
            - { call: "POST /units/${u1}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { n1: "$.data.id" } }
            - { call: "POST /units/${u2}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { n2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${n1}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /lien-notices/${n2}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${u1}", mode: "ONSITE", start_at: "2026-03-21T10:00:00Z", end_at: "2026-03-21T11:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /auctions", payload: { unit_id: "${u2}", mode: "ONSITE", start_at: "2026-03-21T11:30:00Z", end_at: "2026-03-21T12:30:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409 with data.error_id == ERR_ONSITE_SLOT_CONFLICT (30-min gap < 120-min buffer)"

      - name: unit_window_half_open_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_AUCTION_WINDOW_CONFLICT]
          - entities.Auction.fields.start_at
          - entities.Auction.fields.end_at
        distinguishing_aspect: |
          StorageUnit resource, half-open [start_at, end_at) semantics: a second auction
          on the SAME matured unit whose window overlaps the first is rejected with
          ERR_AUCTION_WINDOW_CONFLICT (adjacency at a shared endpoint would NOT conflict).
        test_recipe:
          setup:
            - "One matured unit with a SCHEDULED auction spanning [2026-03-21,2026-03-22); the unit stays LIEN_MATURED because it is not yet opened."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T12:00:00Z", end_at: "2026-03-23T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409 with data.error_id == ERR_AUCTION_WINDOW_CONFLICT (windows [03-21,03-22) and [03-21T12,03-23) overlap)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_conservation_hold_then_release
        grounds:
          - entities.Buyer.fields.deposit_available_cents
          - entities.Buyer.fields.deposit_held_cents
          - state_machines.Auction.LIVE_to_CLOSED
          - state_machines.Sale.UNPAID_to_PAID
        distinguishing_aspect: |
          Conserved quantity Q1 = Buyer.deposit_available_cents + Buyer.deposit_held_cents.
          The forward hold at close (available 100000->80000, held 0->20000) and the
          compensating release at pay (available 80000->100000, held 20000->0) both leave
          Q1 == 100000 unchanged.
        test_recipe:
          setup:
            - "Full pipeline to a Sale created at close; buyer funded 100000 (Q1 = 100000; at close available 80000, held 20000)."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 150000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "GET /sales?auction_id=${auc}", as: PlatformAdmin, captures: { sale: "$.data[0].id" } }
          trigger:
            - { call: "POST /sales/${sale}/pay", payload: {}, as: Buyer, as_user_id: "${buyer}" }
          assert:
            - "At close: Buyer.${buyer}.deposit_available_cents == 80000 AND deposit_held_cents == 20000 (sum 100000)"
            - "After pay: Buyer.${buyer}.deposit_available_cents == 100000 AND deposit_held_cents == 0 (sum 100000)"
            - "deposit_available_cents + deposit_held_cents == 100000 unchanged across hold and release"

      - name: proceeds_identity_settlement_reverse
        grounds:
          - entities.Settlement.fields.gross_proceeds_cents
          - entities.Settlement.fields.surplus_cents
          - state_machines.Settlement.FINALIZED_to_REVERSED
          - entities.Tenant.fields.surplus_balance_cents
        distinguishing_aspect: |
          Conserved quantity Q2 = gross_proceeds_cents, pinned as gross == lien_recovered +
          facility_fee + surplus (150000 == 94000 + 15000 + 41000). Finalize credits tenant
          surplus 41000; the compensating reversal (dispute UPHELD on the Settlement) debits
          it back to 0 while the proceeds identity still holds on the reversed record.
        test_recipe:
          setup:
            - "Full pipeline through pay (Settlement FINALIZED, tenant surplus 41000); a SETTLEMENT dispute is raised and reviewed."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 150000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "GET /sales?auction_id=${auc}", as: PlatformAdmin, captures: { sale: "$.data[0].id" } }
            - { call: "POST /sales/${sale}/pay", payload: {}, as: Buyer, as_user_id: "${buyer}" }
            - { call: "GET /sales/${sale}/settlement", as: PlatformAdmin, captures: { setl: "$.data[0].id" } }
            - { call: "POST /disputes", payload: { subject_type: "SETTLEMENT", settlement_id: "${setl}", raised_by: "TENANT", reason: "surplus miscomputed" }, as: Tenant, as_user_id: "${ten}", captures: { disp: "$.data.id" } }
            - { call: "POST /disputes/${disp}/review", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /disputes/${disp}/resolve", payload: { decision: "UPHOLD" }, as: PlatformAdmin }
          assert:
            - "Before reversal: Settlement.${setl}.surplus_cents == 41000 AND Tenant.${ten}.surplus_balance_cents == 41000"
            - "After reversal: Settlement.${setl}.status == REVERSED AND Tenant.${ten}.surplus_balance_cents == 0"
            - "Proceeds identity holds on reversed record: gross_proceeds_cents 150000 == 94000 + 15000 + 41000"
