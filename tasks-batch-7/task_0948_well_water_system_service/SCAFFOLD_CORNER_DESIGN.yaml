      - name: corner_calc_billable_minutes_increment_and_floor_on_completion
        claim_type: Precision
        grounds: ["calculations.billable_minutes", "calculations.labor_charge_cents", "entities.WorkOrder.fields.billable_minutes", "entities.WorkOrder.fields.labor_charge_cents"]
        distinguishing_aspect: |
          Two MASTER work orders started at 12:00Z on ordinary weekdays (STANDARD band,
          rate 13500) differ only in reported minutes. 46 raw minutes rounds up to
          ceil(46/15)*15 = 60 and the 60-minute floor does not bind, giving
          round_half_up(13500*60/60) = 13500; 61 raw minutes rounds up to 75, giving
          round_half_up(13500*75/60) = 16875. An implementation that bills raw minutes
          returns 10350 and 13725; one that rounds to the nearest increment instead of
          up returns 13500 for both.
        test_recipe:
          setup:
            - "One NONE-tier account, one property 10.0 miles out with household 3, two wells and one MASTER technician."
            - "Two PRE_AUTHORIZED emergency work orders of scope REPAIR, one per well, scheduled on 2026-06-03 and 2026-06-04 so neither the technician buffer nor the per-well daily cap binds."
            - "No parts consumed on either work order."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Billable Minutes Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "bm@corner.example" }
              as: PlatformAdmin
