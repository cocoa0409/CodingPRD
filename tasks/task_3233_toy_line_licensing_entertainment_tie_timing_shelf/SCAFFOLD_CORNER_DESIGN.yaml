# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3233_toy_line_licensing_entertainment_tie_timing_shelf
#
# Breadth probe over the claims §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: studio_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Studio
          - endpoints.POST_/toy-licensing/studios
        distinguishing_aspect: "Creating a studio with only a name returns 201 with confidentiality_tier STANDARD, status ACTIVE, version 1, and system id/created_at/updated_at."
        test_recipe:
          setup:
            - "Clock 2026-09-01 (default). Empty DB."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-licensing/studios"
              payload: { name: "Studio One" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
          assert:
            - "Studio.${st1}.confidentiality_tier == STANDARD (default applied)"
            - "Studio.${st1}.status == ACTIVE"
            - "Studio.${st1}.version == 1"
            - "id, created_at, updated_at present and non-null"
      - name: property_get_round_trips_configuration
        claim_type: Retrieval
        grounds:
          - entities.Property
          - endpoints.GET_/toy-licensing/properties/{id}
        distinguishing_aspect: "Every posted property field round-trips through GET unchanged; lifecycle is CONFIDENTIAL at default clock 2026-09-01 when reveal is later."
        test_recipe:
          setup:
            - "Studio exists; clock default 2026-09-01."
          setup_api_calls:
            - call: "POST /toy-licensing/studios"
              payload: { name: "Studio One" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/properties"
              payload: { studio_id: "${st1}", title: "Galaxy Racers", category: "FILM", reveal_date: "2026-12-01T00:00:00Z", release_date: "2027-06-01T00:00:00Z" }
              as: StudioRep
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /toy-licensing/properties/${p1}"
              payload: {}
              as: BrandManager
          assert:
            - "Property.${p1}.title == \"Galaxy Racers\" and category == FILM"
            - "Property.${p1}.shift_count == 0"
            - "Property.${p1}.lifecycle == CONFIDENTIAL (clock < reveal_date)"
      - name: skus_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/toy-licensing/skus
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three SKUs on a line, limit=2 returns total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Evergreen line EL with three SKUs."
          setup_api_calls:
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "A", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "B", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "C", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
          trigger:
            - call: "GET /toy-licensing/skus?toy_line_id=${el}&limit=2&offset=0"
              payload: {}
              as: BrandManager
          assert:
            - "page 1 returns 2 rows, total_count == 3, has_more == true"
            - "offset=2 returns 1 row, total_count == 3, has_more == false"
      - name: get_nonexistent_property_returns_404
        claim_type: Not Found
        grounds:
          - errors.ERR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "GET with a random UUID that matches no property returns ERR_NOT_FOUND 404."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /toy-licensing/properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: BrandManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"
      - name: sku_create_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Sku
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /skus without moq_units fails ERR_INVALID_REQUEST 400."
        test_recipe:
          setup:
            - "Evergreen line EL exists."
          setup_api_calls:
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
          trigger:
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "A", age_grade_months: 36, packaging_claims: ["BPA_FREE"], unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
      - name: property_lifecycle_boundary_at_reveal_date
        claim_type: Computed Fields
        grounds:
          - calculations.property_lifecycle
          - entities.Property.fields.lifecycle
        distinguishing_aspect: "clock == reveal_date yields REVEALED (not CONFIDENTIAL); clock == release_date yields RELEASED."
        test_recipe:
          setup:
            - "Studio + property reveal 2026-10-01, release 2027-01-01."
          setup_api_calls:
            - call: "POST /toy-licensing/studios"
              payload: { name: "Studio One" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/properties"
              payload: { studio_id: "${st1}", title: "P", category: "SERIES", reveal_date: "2026-10-01T00:00:00Z", release_date: "2027-01-01T00:00:00Z" }
              as: StudioRep
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /toy-licensing/properties/${p1}"
              payload: {}
              as: BrandManager
              captures: { lc1: $.data.lifecycle }
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /toy-licensing/properties/${p1}"
              payload: {}
              as: BrandManager
              captures: { lc2: $.data.lifecycle }
          assert:
            - "lifecycle at reveal instant == REVEALED"
            - "lifecycle at release instant == RELEASED"
      - name: sku_invalid_packaging_claim_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Sku.fields.packaging_claims
          - errors.ERR_SAFETY_GATE
        distinguishing_aspect: "A packaging claim outside [CHOKING_HAZARD_FREE, FLAME_RESISTANT, BPA_FREE] is rejected."
        test_recipe:
          setup:
            - "Evergreen line EL."
          setup_api_calls:
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
          trigger:
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "A", age_grade_months: 36, packaging_claims: ["EDIBLE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SAFETY_GATE (422)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: license_amend_from_negotiation_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.LicenseAgreement
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "amend requires status ACTIVE; calling it on a NEGOTIATION agreement fails ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Studio + revealed property + agreement in NEGOTIATION."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/studios"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/properties"
              payload: { studio_id: "${st1}", title: "P", category: "FILM", reveal_date: "2026-09-01T00:00:00Z", release_date: "2027-01-01T00:00:00Z" }
              as: StudioRep
              captures: { p1: $.data.id }
            - call: "POST /toy-licensing/license-agreements"
              payload: { property_id: "${p1}", territory: "GLOBAL", royalty_rate_pct: 0.10, advance_guarantee_cents: 0, annual_minimum_guarantee_cents: 0, start_date: "2026-01-01T00:00:00Z", end_date: "2028-12-31T00:00:00Z", approval_rights_required: false }
              as: BrandManager
              captures: { la1: $.data.id }
          trigger:
            - call: "POST /toy-licensing/license-agreements/${la1}/amend"
              payload: { royalty_rate_pct: 0.15, advance_guarantee_cents: 0, end_date: "2029-12-31T00:00:00Z" }
              as: BrandManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
      - name: safety_test_record_result_drives_sku_status
        claim_type: Valid Transition
        grounds:
          - state_machines.SafetyTest.SUBMITTED_to_PASSED
          - state_machines.Sku.TESTING_to_PASSED
        distinguishing_aspect: "PASS with conforming age/claims moves SafetyTest to PASSED and Sku to PASSED with tested_age_grade_months and claims_validated updated."
        test_recipe:
          setup:
            - "Evergreen line + sku age 48 claims [BPA_FREE]; test submitted."
          setup_api_calls:
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Bucket", age_grade_months: 48, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/safety-tests"
              payload: { sku_id: "${sk1}", test_type: "MECHANICAL", lab_name: "LabA", claimed_age_grade_months: 48 }
              as: SafetyEngineer
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /toy-licensing/safety-tests/${st1}/record_result"
              payload: { outcome: "PASS", result_age_grade_months: 48, validated_claims: ["BPA_FREE"] }
              as: SafetyEngineer
          assert:
            - "SafetyTest.${st1}.status == PASSED"
            - "Sku.${sk1}.safety_status == PASSED and tested_age_grade_months == 48 and claims_validated == true"
      - name: record_result_pass_with_age_over_claim_fails_test
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Sku.TESTING_to_FAILED
          - errors.ERR_SAFETY_GATE
        distinguishing_aspect: "A PASS whose result_age_grade_months exceeds the printed claim flips the SKU to FAILED (lab says older than package claims)."
        test_recipe:
          setup:
            - "Evergreen line + sku age 36 claims [BPA_FREE]; test submitted."
          setup_api_calls:
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Bucket", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/safety-tests"
              payload: { sku_id: "${sk1}", test_type: "MECHANICAL", lab_name: "LabA", claimed_age_grade_months: 36 }
              as: SafetyEngineer
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /toy-licensing/safety-tests/${st1}/record_result"
              payload: { outcome: "PASS", result_age_grade_months: 48, validated_claims: ["BPA_FREE"] }
              as: SafetyEngineer
              captures: { status: $.data.status }
          assert:
            - "SafetyTest.${st1}.status == FAILED"
            - "Sku.${sk1}.safety_status == FAILED and claims_validated == false"
      - name: shipment_record_sale_after_street_date_assesses_no_penalty
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Shipment.PLANNED_to_SOLD
          - calculations.embargo_penalty
        distinguishing_aspect: "Sale recorded when clock >= street_date yields penalty_cents 0, penalty_status NONE, retailer ledger untouched."
        test_recipe:
          setup:
            - "Evergreen line street 2026-09-01, sku, retailer, CONFIRMED review, commitment 100c, shipment 500 units; clock 2026-10-01 (past street)."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2026-09-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Bucket", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "ToyBox", region: "NA" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z", commitment_deadline: "2026-11-01T00:00:00Z", shelf_slots_total: 20 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { lr1: $.data.id }
            - call: "POST /toy-licensing/line-reviews/${lr1}/approve"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr1}", sku_id: "${sk1}", committed_units: 500, unit_price_cents: 100, shelf_slots: 4 }
              as: BrandManager
              captures: { c1: $.data.id }
            - call: "POST /toy-licensing/shipments"
              payload: { commitment_id: "${c1}", planned_ship_date: "2026-09-01T00:00:00Z", units: 500 }
              as: BrandManager
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /toy-licensing/shipments/${sh1}/record_sale"
              payload: { units_sold: 200 }
              as: RetailerOps
              as_user_id: "${r1}"
          assert:
            - "Shipment.${sh1}.status == SOLD and sold_units == 200"
            - "Shipment.${sh1}.penalty_cents == 0 and penalty_status == NONE"
            - "Retailer.${r1}.credit_balance_cents == 0 and violation_count == 0"
      - name: retired_line_is_terminal_no_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ToyLine
        distinguishing_aspect: "Once RETIRED, advance/revert/enter_closeout/exit_closeout/retire all fail ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Evergreen line in CLOSEOUT with no PLANNED shipments and no APPROVED tooling orders; retire succeeds."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Nostalgia Minis", brand_kind: "EVERGREEN", target_street_date_input: "2026-09-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id, el_v: $.data.version }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Mini", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "ToyBox", region: "NA" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z", commitment_deadline: "2026-11-01T00:00:00Z", shelf_slots_total: 20 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { lr1: $.data.id }
            - call: "POST /toy-licensing/line-reviews/${lr1}/approve"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/safety-tests"
              payload: { sku_id: "${sk1}", test_type: "MECHANICAL", lab_name: "LabA", claimed_age_grade_months: 36 }
              as: SafetyEngineer
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/safety-tests/${st1}/record_result"
              payload: { outcome: "PASS", result_age_grade_months: 36, validated_claims: ["BPA_FREE"] }
              as: SafetyEngineer
            - call: "POST /toy-licensing/factories"
              payload: { name: "F1", capacity_units_per_month: 100000, tooling_lead_weeks: 4 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2026-10", units: 10 }
              as: BrandManager
              captures: { to1: $.data.id }
            - call: "POST /toy-licensing/toy-lines/${el}/advance"
              payload: { expected_toy_line_version: "${el_v}" }
              as: BrandManager
              captures: { el_v1: $.data.version }
            - call: "POST /toy-licensing/toy-lines/${el}/advance"
              payload: { expected_toy_line_version: "${el_v1}" }
              as: BrandManager
              captures: { el_v2: $.data.version }
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr1}", sku_id: "${sk1}", committed_units: 10, unit_price_cents: 500, shelf_slots: 1 }
              as: BrandManager
            - call: "POST /toy-licensing/toy-lines/${el}/advance"
              payload: { expected_toy_line_version: "${el_v2}" }
              as: BrandManager
            - call: "POST /toy-licensing/toy-lines/${el}/enter_closeout"
              payload: { markdown_pct: 0.20 }
              as: BrandManager
            - call: "POST /toy-licensing/tooling-orders/${to1}/scrap"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/toy-lines/${el}/retire"
              payload: {}
              as: BrandManager
          trigger:
            - call: "POST /toy-licensing/toy-lines/${el}/exit_closeout"
              payload: {}
              as: BrandManager
              captures: { err: $.data.error_id }
          assert:
            - "ToyLine.${el}.status == RETIRED"
            - "error_id == ERR_INVALID_STATE on any further lifecycle action"

  # ===========================================================================
  - section: calculations
    instances:
      - name: royalty_recoup_caps_at_advance
        claim_type: Correct Result
        grounds:
          - calculations.royalty_accrual
          - invariants.advance_recoup_conservation
        distinguishing_aspect: "Earned royalties above the remaining advance are recouped only up to the advance; payable is the excess."
        test_recipe:
          setup:
            - "ACTIVE agreement royalty 0.50, advance 10000c, MG 0; licensed line/sku; retailer + CONFIRMED review; commitment 100c; shipment 1000 units SOLD 400 (sold_at in quarter 1)."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/studios"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/properties"
              payload: { studio_id: "${st1}", title: "P", category: "FILM", reveal_date: "2026-09-01T00:00:00Z", release_date: "2026-09-01T00:00:00Z" }
              as: StudioRep
              captures: { p1: $.data.id }
            - call: "POST /toy-licensing/license-agreements"
              payload: { property_id: "${p1}", territory: "GLOBAL", royalty_rate_pct: 0.50, advance_guarantee_cents: 10000, annual_minimum_guarantee_cents: 0, start_date: "2026-01-01T00:00:00Z", end_date: "2028-12-31T00:00:00Z", approval_rights_required: false }
              as: BrandManager
              captures: { la1: $.data.id, la1_v: $.data.version }
            - call: "POST /toy-licensing/license-agreements/${la1}/activate"
              payload: { expected_license_agreement_version: "${la1_v}" }
              as: BrandManager
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Racers", brand_kind: "LICENSED", property_id: "${p1}", license_agreement_id: "${la1}" }
              as: BrandManager
              captures: { l1: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${l1}", name: "Racer", age_grade_months: 48, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "ToyBox", region: "NA" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
