            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/run_ops"
              payload: {}
              as: ProgramAdmin
            - call: "GET /programs/${prog_id}/host-agreements/${agr_id}"
              payload: {}
              as: ProgramAdmin
              captures: { agr_status: $.data.status }
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { site_posture: $.data.posture }
          assert:
            - "agr_status == EXPIRED"
            - "site_posture == CLOSED (no active agreement)"

