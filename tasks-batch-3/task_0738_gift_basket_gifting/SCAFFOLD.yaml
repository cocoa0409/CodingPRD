scenario: |
  738. Gift-Basket & Corporate-Gifting Service: catalog & customization/branding, bulk/corporate order & recipient list (CSV), occasion & scheduled-send, assembly & inventory (perishable), shipping zone & multi-address, gift message & proof, reorder/recurring, budget/approval

domain_name: "gift-basket-gifting"
api_prefix: ""

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Scheduled / deferred actions"
    - "Bulk operations"
    - "Version-pinning on approval"

  entity_topology: hybrid
  # CorporateAccount -> BrandingProfile/CorporateOrder -> Recipient -> {MessageProof, InventoryReservation, AssemblyTask, Shipment}
  # tree, cross-cut by peer references into GiftBasketTemplate, ComponentSKU, AssemblyStation, ShippingZone.

  state_machine_shape: parallel
  # CorporateOrder carries two independent dimensions (approval_status x production_status) that
  # evolve on separate tracks with cross-dimension gating; MessageProof is a cyclic revision loop
  # on a different entity. See state_machines below.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    # cross_aggregate: CorporateOrder -> GiftBasketTemplate/BrandingProfile, InventoryReservation -> ComponentSKU,
    # AssemblyTask -> AssemblyStation, Shipment -> ShippingZone, RecurringOrderSeries -> CorporateOrder.

  role_model: segregation_of_duties
  # The employee who requests a budget decision or submits a gift-message proof may never be the
  # same acting user who decides that same request (ERR_SELF_APPROVAL_FORBIDDEN / ERR_SELF_PROOF_APPROVAL_FORBIDDEN).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CorporateAccount
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal/display name of the corporate customer.
      - name: billing_email
        type: string
        source: input
        description: Invoice recipient email address.
      - name: monthly_budget_cents
        type: integer
        source: input
        description: Hard ceiling on total order spend recognized within the current calendar month.
        constraints: "> 0"
      - name: approval_threshold_cents
        type: integer
        source: input
        description: Orders whose final total_cost_cents strictly exceeds this value require FinanceApprover sign-off; at or below, the order auto-approves.
        constraints: ">= 0"
      - name: ytd_spend_cents
        type: integer
        source: computed
        description: Running total of total_cost_cents for orders APPROVED within the current calendar month (see calculations.ytd_spend_recompute); resets to 0 at the start of each calendar month.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Account standing.
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"

  - name: GiftBasketTemplate
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Catalog display name of the basket template.
      - name: category
        type: enum
        source: input
        description: Merchandising category.
        constraints: "one of HOLIDAY, CORPORATE_WELCOME, CLIENT_APPRECIATION, CUSTOM"
      - name: base_price_cents
        type: integer
        source: input
        description: Per-unit catalog price before branding surcharge, discounts, or fees.
        constraints: "> 0"
      - name: is_perishable
        type: boolean
        source: input
        description: Whether every component in this template is treated as perishable stock.
      - name: shelf_life_days
        type: integer
        source: input
        description: Days from assembly before a made-up basket of this template is considered spoiled; required when is_perishable is true.
        default: null
      - name: components
        type: array
        source: input
        description: "Composition list: array of { sku_id, quantity } objects naming which ComponentSKU rows (and how many units of each) go into one basket of this template. Not a separate persisted entity; sku_id values are validated against ComponentSKU.id at write time."
      - name: active
        type: boolean
        source: input
        description: Whether the template is currently orderable.
        default: true

  - name: ComponentSKU
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Physical component name (e.g. "Artisan Chocolate Box").
      - name: unit_cost_cents
        type: integer
        source: input
        description: Wholesale cost per unit (informational; not part of customer-facing pricing).
      - name: is_perishable
        type: boolean
        source: input
        description: Whether units of this SKU spoil.
      - name: shelf_life_days
        type: integer
        source: input
        description: Days from receipt before a unit of this SKU is unsafe to assemble; required when is_perishable is true.
        default: null
      - name: on_hand_qty
        type: integer
        source: input
        description: Physical units currently in the warehouse; decremented by the system when an AssemblyTask referencing this SKU reaches COMPLETE (units consumed), independent of the reservation bookkeeping in InventoryReservation.
        default: 0
        constraints: ">= 0"

  - name: BrandingProfile
    parent: CorporateAccount
    common_fields: true
    fields:
      - name: corporate_account_id
        type: string
        source: system
        description: "FK -> CorporateAccount.id"
      - name: name
        type: string
        source: input
        description: Label for this branding configuration (e.g. "Q3 Onboarding Kit").
      - name: logo_url
        type: string
        source: input
        description: URL of the corporate logo to print on the card/ribbon.
      - name: accent_color
        type: string
        source: input
        description: Hex color code used on the branded card stock and ribbon.
      - name: card_stock
        type: enum
        source: input
        description: Physical card material.
        constraints: "one of MATTE, GLOSS, RECYCLED"
      - name: approved
        type: boolean
        source: computed
        description: Set true only by POST /branding-profiles/{id}/approve; a CorporateOrder cannot reach APPROVED while its branding_profile_id points at an unapproved profile.
        default: false

  - name: CorporateOrder
    parent: CorporateAccount
    common_fields: true
    fields:
      - name: corporate_account_id
        type: string
        source: system
        description: "FK -> CorporateAccount.id"
      - name: template_id
        type: string
        source: input
        description: "FK -> GiftBasketTemplate.id"
      - name: branding_profile_id
        type: string
        source: input
        description: "FK -> BrandingProfile.id; nullable when the order uses unbranded default packaging."
        default: null
      - name: occasion
        type: enum
        source: input
        description: Business occasion driving this order.
        constraints: "one of HOLIDAY, ANNIVERSARY, ONBOARDING, THANK_YOU, CUSTOM"
      - name: scheduled_send_date
        type: datetime
        source: input
        description: Requested ship-by date for every recipient in this order; nullable for send-immediately orders.
        default: null
      - name: approval_status
        type: enum
        source: computed
        description: "Independent dimension 1 of the order's parallel state machine (see state_machines.CorporateOrder)."
        default: DRAFT
        constraints: "one of DRAFT, PENDING_APPROVAL, APPROVED, REJECTED"
      - name: production_status
        type: enum
        source: computed
        description: "Independent dimension 2 of the order's parallel state machine (see state_machines.CorporateOrder)."
        default: DRAFT
        constraints: "one of DRAFT, ASSEMBLING, READY_TO_SHIP, SHIPPED, COMPLETED, CANCELLED"
      - name: locked_template_version
        type: integer
        source: computed
        description: GiftBasketTemplate.version pinned at the moment approval_status becomes APPROVED; freezes which catalog price snapshot the final calculation used.
        default: null
      - name: locked_branding_version
        type: integer
        source: computed
        description: BrandingProfile.version pinned at the moment approval_status becomes APPROVED (null if no branding_profile_id).
        default: null
      - name: subtotal_cents
        type: integer
        source: computed
        description: Pre-discount, pre-fee line total from calculations.order_total_cost.
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: Final customer-facing cost from calculations.order_total_cost (provisional variant before APPROVED, final variant after).
        default: 0
      - name: requires_approval
        type: boolean
        source: computed
        description: Output of calculations.budget_utilization_and_approval_trigger; true when total_cost_cents strictly exceeds account.approval_threshold_cents.
        default: false

  - name: Recipient
    parent: CorporateOrder
    common_fields: true
    fields:
      - name: corporate_order_id
        type: string
        source: system
        description: "FK -> CorporateOrder.id"
      - name: full_name
        type: string
        source: input
        description: Recipient's name as printed on the gift message.
      - name: email
        type: string
        source: input
        description: Recipient contact email (must be unique within the same order's recipient set).
      - name: shipping_address_line1
        type: string
        source: input
        description: Street address line.
      - name: city
        type: string
        source: input
        description: Destination city.
      - name: state_code
        type: string
        source: input
        description: Destination state/province code.
      - name: postal_code
        type: string
        source: input
        description: Destination postal code.
      - name: country_code
        type: string
        source: input
        description: ISO country code; must be covered by a ShippingZone.country_codes entry to be shippable.
      - name: quantity
        type: integer
        source: input
        description: Number of baskets of the order's template to send this recipient.
        default: 1
        constraints: "> 0"
      - name: import_row_status
        type: enum
        source: system
        description: Outcome of this row's CSV-import validation; REJECTED rows are excluded from all downstream aggregation (recipient counts, cost, cascades).
        default: ACCEPTED
        constraints: "one of ACCEPTED, REJECTED"

  - name: MessageProof
    parent: Recipient
    common_fields: true
    fields:
      - name: recipient_id
        type: string
        source: system
        description: "FK -> Recipient.id"
      - name: message_text
        type: string
        source: input
        description: Gift-card message body.
      - name: proof_status
        type: enum
        source: computed
        description: See state_machines.MessageProof (cyclic revision loop).
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, LOCKED"
      - name: revision_count
        type: integer
        source: computed
        description: Number of times a ProofApprover has sent this message back for revision.
        default: 0
      - name: submitted_by_user_id
        type: string
        source: input
        description: Opaque id of the individual AccountManager-side employee who last submitted this message for proof; required for the segregation-of-duties check against decided_by_user_id.
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ProofApprover who last decided this proof; must differ from submitted_by_user_id.
        default: null

  - name: InventoryReservation
    parent: Recipient
    common_fields: true
    fields:
      - name: recipient_id
        type: string
        source: system
        description: "FK -> Recipient.id"
      - name: sku_id
        type: string
        source: system
        description: "FK -> ComponentSKU.id"
      - name: reserved_qty
        type: integer
        source: system
        description: Units of sku_id reserved for this recipient's basket(s); derived from GiftBasketTemplate.components quantity times Recipient.quantity at creation.
      - name: status
        type: enum
        source: computed
        description: See state_machines.InventoryReservation.
        default: RESERVED
        constraints: "one of RESERVED, ALLOCATED, ASSEMBLED, RELEASED, EXPIRED, CANCELLED"
      - name: expires_at
        type: datetime
        source: computed
        description: created_at plus ComponentSKU.shelf_life_days for perishable SKUs; drives the auto-expiry transition.
        default: null

  - name: AssemblyStation
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: Warehouse assembly station label.
      - name: daily_capacity
        type: integer
        source: input
        description: Maximum total basket quantity (summed across all AssemblyTask rows) this station can assemble on a single calendar day.
        constraints: "> 0"

  - name: AssemblyTask
    parent: Recipient
    common_fields: true
    fields:
      - name: recipient_id
        type: string
        source: system
        description: "FK -> Recipient.id"
      - name: station_id
        type: string
        source: system
        description: "FK -> AssemblyStation.id"
      - name: scheduled_date
        type: datetime
        source: system
        description: Calendar production day this task occupies station capacity on; pinned from the order's budget-decision APPROVE payload.
      - name: quantity
        type: integer
        source: system
        description: Mirrors Recipient.quantity; the unit count this task contributes to the station+date capacity sum.
      - name: status
        type: enum
        source: computed
        description: See state_machines.AssemblyTask.
        default: QUEUED
        constraints: "one of QUEUED, IN_PROGRESS, COMPLETE, FAILED"

  - name: ShippingZone
    parent: null
    common_fields: false
    fields:
      - name: zone_code
        type: string
        source: input
        description: Short zone identifier (e.g. "US-WEST").
      - name: country_codes
        type: array
        source: input
        description: ISO country codes this zone serves.
      - name: carrier
        type: string
        source: input
        description: Carrier name servicing this zone.
      - name: base_rate_cents
        type: integer
        source: input
        description: Flat per-shipment base rate.
      - name: per_kg_rate_cents
        type: integer
        source: input
        description: Marginal rate per kilogram of estimated basket weight.
      - name: transit_days_min
        type: integer
        source: input
        description: Fastest guaranteed transit time in days.
      - name: transit_days_max
        type: integer
        source: input
        description: Slowest guaranteed transit time in days.
      - name: blackout_dates
        type: array
        source: input
        description: ISO date strings (YYYY-MM-DD) on which the carrier will not accept pickups in this zone.

  - name: Shipment
    parent: Recipient
    common_fields: true
    fields:
      - name: recipient_id
        type: string
        source: system
        description: "FK -> Recipient.id"
      - name: zone_id
        type: string
        source: system
        description: "FK -> ShippingZone.id"
      - name: ship_date
        type: datetime
        source: input
        description: Carrier pickup date requested at shipment creation.
      - name: tracking_number
        type: string
        source: computed
        description: Set when the shipment's label is generated as part of creation.
        default: null
      - name: status
        type: enum
        source: computed
        description: See state_machines.Shipment.
        default: CREATED
        constraints: "one of CREATED, LABEL_GENERATED, IN_TRANSIT, DELIVERED, EXCEPTION, RETURNED"
      - name: shipping_cost_cents
        type: integer
        source: computed
        description: Output of calculations.shipping_cost_total for this shipment.
        default: 0
      - name: delivered_at
        type: datetime
        source: computed
        description: Set when status becomes DELIVERED.
        default: null

  - name: BudgetApproval
    parent: CorporateOrder
    common_fields: true
    fields:
      - name: corporate_order_id
        type: string
        source: system
        description: "FK -> CorporateOrder.id"
      - name: requested_by_user_id
        type: string
        source: input
        description: Opaque id of the individual AccountManager-side employee who submitted the order for approval; required for the segregation-of-duties check against approver_user_id.
      - name: approver_user_id
        type: string
        source: computed
        description: X-User-ID of the FinanceApprover who decided this request; must differ from requested_by_user_id.
        default: null
      - name: decision
        type: enum
        source: computed
        description: See state_machines.BudgetApproval.
        default: PENDING
        constraints: "one of PENDING, APPROVED, REJECTED"
      - name: decision_reason
        type: string
        source: input
        description: Free-text rationale supplied by the FinanceApprover.
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: Timestamp of the decision.
        default: null

  - name: RecurringOrderSeries
    parent: CorporateAccount
    common_fields: true
    fields:
      - name: corporate_account_id
        type: string
        source: system
        description: "FK -> CorporateAccount.id"
      - name: source_order_id
        type: string
        source: input
        description: The CorporateOrder (template_id + branding_profile_id + occasion) this series re-orders on each cycle. Referenced by id as a cloning source; not treated as a structural foreign key requiring reverse-reachability, since RecurringOrderSeries rows are discovered via their own FK-reverse GET (below), not via CorporateOrder.
      - name: interval_days
        type: integer
        source: input
        description: Days between consecutive generated orders.
        constraints: "> 0"
      - name: next_run_date
        type: datetime
        source: computed
        description: Logical-clock timestamp at which the next order will be generated.
      - name: active
        type: boolean
        source: computed
        description: See state_machines.RecurringOrderSeries.
        default: true
      - name: last_generated_order_id
        type: string
        source: computed
        description: Most recently generated CorporateOrder's id (system-set cache, not a reverse-reachability FK).
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CorporateOrder
    initial_state: "DRAFT (both dimensions)"
    terminal_states: [REJECTED, CANCELLED, COMPLETED]
    transitions:
      # --- approval_status dimension (cyclic: PENDING_APPROVAL <-> REJECTED) ---
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /orders/{id}/submit-for-approval"
        actor: AccountManager
        preconditions:
          - "order.approval_status IN {DRAFT, REJECTED}"
          - "order.production_status != CANCELLED"
          - "count(Recipient where corporate_order_id == order.id AND import_row_status == ACCEPTED) >= 1"
          - "order.scheduled_send_date is null OR order.scheduled_send_date > clock.now_utc"
        side_effects:
          - "runs calculations.order_total_cost (provisional variant) then calculations.budget_utilization_and_approval_trigger to set order.subtotal_cents, order.total_cost_cents, order.requires_approval"
          - "creates BudgetApproval row (decision=PENDING, requested_by_user_id = payload.requested_by_user_id) the first time this order is submitted; on a resubmission from REJECTED, resets that SAME row (decision=PENDING, requested_by_user_id = payload.requested_by_user_id, approver_user_id=null, decided_at=null) rather than creating a second row, keeping BudgetApproval a true 1:1 with CorporateOrder"
          - "if order.requires_approval == false: system immediately and atomically re-fires the PENDING_APPROVAL -> APPROVED transition below (auto-approval path) using approver_user_id = null and decision = APPROVED (no human approver involved, so the segregation-of-duties check does not apply), using body.station_id/body.scheduled_date (required in this call's payload whenever the auto-approval path might fire) as Cascade A's station_id/scheduled_date; if any APPROVED-transition precondition below fails during this auto-fire, the entire submit-for-approval call fails atomically and the order remains DRAFT with no BudgetApproval row persisted"
        note: "Re-enterable from REJECTED, forming the cycle PENDING_APPROVAL -> REJECTED -> PENDING_APPROVAL that satisfies non-linear (cyclic) shape."
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /orders/{id}/budget-decision (decision=APPROVE)"
        actor: FinanceApprover
        preconditions:
          - "BudgetApproval.decision == PENDING for this order"
          - "body.approver_user_id != BudgetApproval.requested_by_user_id"
          - "every ComponentSKU used by the order's basket composition passes the perishable safety check (validations priority 19)"
          - "order.branding_profile_id is null OR BrandingProfile.approved == true"
          - "chronological component_available_qty >= reserved_qty for every InventoryReservation this order would move to ALLOCATED"
          - "AssemblyStation(body.station_id).daily_capacity is not exceeded by adding this order's total recipient quantity on body.scheduled_date (validations priority 26)"
          - "(account.ytd_spend_cents + order.total_cost_cents) <= account.monthly_budget_cents"
        side_effects:
          - "runs calculations.order_total_cost (final variant, using locked_template_version/locked_branding_version) and re-sets order.total_cost_cents"
          - "order.locked_template_version = GiftBasketTemplate.version; order.locked_branding_version = BrandingProfile.version (or null)"
          - "BudgetApproval.decision = APPROVED, approver_user_id = body.approver_user_id, decided_at = clock.now_utc"
          - "runs calculations.ytd_spend_recompute forward leg: account.ytd_spend_cents += order.total_cost_cents"
          - "CASCADE A hop 1 (caused by this APPROVE, depth 3 total): every InventoryReservation for this order's recipients transitions RESERVED -> ALLOCATED"
          - "CASCADE A hop 2 (caused by hop 1's ALLOCATED reservations existing, not directly by APPROVE): one AssemblyTask (status=QUEUED, station_id=body.station_id, scheduled_date=body.scheduled_date) is created per Recipient"
          - "CASCADE A hop 3 (caused by hop 2's AssemblyTask rows existing, not directly by APPROVE): order.production_status DRAFT -> ASSEMBLING"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /orders/{id}/budget-decision (decision=REJECT)"
        actor: FinanceApprover
        preconditions:
          - "BudgetApproval.decision == PENDING for this order"
          - "body.approver_user_id != BudgetApproval.requested_by_user_id"
        side_effects:
          - "BudgetApproval.decision = REJECTED, approver_user_id = body.approver_user_id, decision_reason = body.decision_reason, decided_at = clock.now_utc"
        note: "order.production_status remains DRAFT; AccountManager may resubmit (REJECTED -> PENDING_APPROVAL above), closing the cycle."
      # --- production_status dimension (independent track, gated by approval_status where noted) ---
      - from: ASSEMBLING
        to: READY_TO_SHIP
        trigger: "system event: last AssemblyTask for this order's recipients reaches COMPLETE"
        actor: system
        preconditions:
          - "order.production_status == ASSEMBLING"
          - "every AssemblyTask where recipient.corporate_order_id == order.id has status == COMPLETE"
        side_effects:
          - "order.production_status = READY_TO_SHIP"
          - "CASCADE B hop 1 (caused by the triggering AssemblyTask's own COMPLETE transition, a different trigger from Cascade A's APPROVE): this transition itself"
          - "CASCADE B hop 2 (caused by hop 1, i.e. by production_status reaching READY_TO_SHIP, not directly by the AssemblyTask completion): every InventoryReservation for this order's recipients still ALLOCATED transitions ALLOCATED -> ASSEMBLED"
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "system event: every Shipment for this order's recipients reaches IN_TRANSIT or a later status"
        actor: system
        preconditions:
          - "order.production_status == READY_TO_SHIP"
          - "every Shipment where recipient.corporate_order_id == order.id has status IN {IN_TRANSIT, DELIVERED}"
        side_effects:
          - "order.production_status = SHIPPED"
      - from: SHIPPED
        to: COMPLETED
        trigger: "system event: every Shipment for this order's recipients reaches DELIVERED"
        actor: system
        preconditions:
          - "order.production_status == SHIPPED"
          - "every Shipment where recipient.corporate_order_id == order.id has status == DELIVERED"
        side_effects:
          - "order.production_status = COMPLETED"
      - from: "{DRAFT, ASSEMBLING}"
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: "AccountManager | PlatformAdmin"
        preconditions:
          - "order.production_status IN {DRAFT, ASSEMBLING}"
        side_effects:
          - "order.production_status = CANCELLED"
          - "COMPENSATION (Rule 9 instance 1, conserved quantity = ComponentSKU available units): every InventoryReservation for this order's recipients still in {RESERVED, ALLOCATED} transitions to RELEASED, removing it from the active-status filter used by calculations.component_available_qty so available_qty returns to its pre-reservation value"
          - "COMPENSATION (Rule 9 instance 2, conserved quantity = CorporateAccount.ytd_spend_cents): if order.approval_status == APPROVED, runs calculations.ytd_spend_recompute reverse leg: account.ytd_spend_cents -= order.total_cost_cents"
          - "every AssemblyTask for this order's recipients still QUEUED transitions to FAILED"

  - entity: MessageProof
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /recipients/{id}/message-proof"
        actor: AccountManager
        preconditions:
          - "MessageProof for this recipient does not already exist, or exists with proof_status IN {DRAFT, REVISION_REQUESTED}"
        side_effects:
          - "MessageProof.message_text = body.message_text; submitted_by_user_id = body.submitted_by_user_id; proof_status = SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /message-proofs/{id}/decision (decision=APPROVE)"
        actor: ProofApprover
        preconditions:
          - "proof_status == SUBMITTED"
          - "body.decided_by_user_id != MessageProof.submitted_by_user_id"
        side_effects:
          - "proof_status = APPROVED; decided_by_user_id = body.decided_by_user_id"
      - from: APPROVED
        to: LOCKED
        trigger: "system event: immediately following APPROVE"
        actor: system
        preconditions:
          - "proof_status == APPROVED"
        side_effects:
          - "proof_status = LOCKED (final card text frozen; enables Shipment creation for this recipient, see validations priority 22)"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /message-proofs/{id}/decision (decision=REQUEST_REVISION)"
        actor: ProofApprover
        preconditions:
          - "proof_status == SUBMITTED"
          - "body.decided_by_user_id != MessageProof.submitted_by_user_id"
        side_effects:
          - "proof_status = REVISION_REQUESTED; decided_by_user_id = body.decided_by_user_id; revision_count += 1"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "system event: immediately following REQUEST_REVISION"
        actor: system
        preconditions:
          - "proof_status == REVISION_REQUESTED"
        side_effects:
          - "proof_status = DRAFT"
        note: "Closes the cycle SUBMITTED -> REVISION_REQUESTED -> DRAFT -> SUBMITTED (revision loop), the second non-linear (cyclic) instance required by Rule 3, on a different entity than CorporateOrder's parallel dimensions."

  - entity: InventoryReservation
    initial_state: RESERVED
    terminal_states: [RELEASED, EXPIRED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ALLOCATED
        trigger: "system event: CorporateOrder budget-decision APPROVE (Cascade A hop 1)"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "expires_at is null OR expires_at > clock.now_utc"
        side_effects:
          - "status = ALLOCATED"
      - from: ALLOCATED
        to: ASSEMBLED
        trigger: "system event: order.production_status reaches READY_TO_SHIP (Cascade B hop 2)"
        actor: system
        preconditions:
          - "status == ALLOCATED"
        side_effects:
          - "status = ASSEMBLED"
      - from: ASSEMBLED
        to: RELEASED
        trigger: "system event: order.production_status reaches COMPLETED"
        actor: system
        preconditions:
          - "status == ASSEMBLED"
        side_effects:
          - "status = RELEASED (basket fully shipped; reservation no longer competes for stock)"
      - from: "{RESERVED, ALLOCATED}"
        to: RELEASED
        trigger: "system event: CorporateOrder cancel (compensation, Rule 9 instance 1)"
        actor: system
        preconditions:
          - "status IN {RESERVED, ALLOCATED}"
          - "the owning CorporateOrder.production_status just transitioned to CANCELLED"
        side_effects:
          - "status = RELEASED"
      - from: RESERVED
        to: EXPIRED
        trigger: "system event: clock.now_utc passes expires_at while still RESERVED"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "expires_at is not null AND clock.now_utc >= expires_at"
        side_effects:
          - "status = EXPIRED (perishable stock spoiled before it could be allocated; removed from the active-status filter)"

  - entity: AssemblyTask
    initial_state: QUEUED
    terminal_states: [COMPLETE, FAILED]
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: "POST /assembly-tasks/{id}/advance (target_status=IN_PROGRESS)"
        actor: WarehouseOps
        preconditions:
          - "status == QUEUED"
        side_effects:
          - "status = IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /assembly-tasks/{id}/advance (target_status=COMPLETE)"
        actor: WarehouseOps
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "status = COMPLETE"
          - "ComponentSKU.on_hand_qty -= (reserved_qty of each InventoryReservation tied to this task's recipient), for every sku in the recipient's basket composition"
          - "may trigger state_machines.CorporateOrder ASSEMBLING -> READY_TO_SHIP if this was the order's last remaining task"
      - from: "{QUEUED, IN_PROGRESS}"
        to: FAILED
        trigger: "POST /assembly-tasks/{id}/advance (target_status=FAILED)"
        actor: WarehouseOps
        preconditions:
          - "status IN {QUEUED, IN_PROGRESS}"
        side_effects:
          - "status = FAILED"
      - from: "{QUEUED, IN_PROGRESS}"
        to: FAILED
        trigger: "system event: CorporateOrder cancel"
        actor: system
        preconditions:
          - "status IN {QUEUED, IN_PROGRESS}"
          - "the owning CorporateOrder.production_status just transitioned to CANCELLED"
        side_effects:
          - "status = FAILED"

  - entity: Shipment
    initial_state: CREATED
    terminal_states: [DELIVERED, RETURNED]
    transitions:
      - from: CREATED
        to: LABEL_GENERATED
        trigger: "POST /shipments/{id}/advance (target_status=LABEL_GENERATED)"
        actor: ShippingOps
        preconditions:
          - "status == CREATED"
        side_effects:
          - "status = LABEL_GENERATED; tracking_number = system-generated string"
      - from: LABEL_GENERATED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/advance (target_status=IN_TRANSIT)"
        actor: ShippingOps
        preconditions:
          - "status == LABEL_GENERATED"
        side_effects:
          - "status = IN_TRANSIT"
          - "may trigger state_machines.CorporateOrder READY_TO_SHIP -> SHIPPED if this was the order's last remaining shipment to leave LABEL_GENERATED"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/advance (target_status=DELIVERED)"
        actor: ShippingOps
        preconditions:
          - "status == IN_TRANSIT"
        side_effects:
          - "status = DELIVERED; delivered_at = clock.now_utc"
          - "may trigger state_machines.CorporateOrder SHIPPED -> COMPLETED if this was the order's last remaining shipment to reach DELIVERED"
      - from: "{LABEL_GENERATED, IN_TRANSIT}"
        to: EXCEPTION
        trigger: "POST /shipments/{id}/advance (target_status=EXCEPTION)"
        actor: ShippingOps
        preconditions:
          - "status IN {LABEL_GENERATED, IN_TRANSIT}"
        side_effects:
          - "status = EXCEPTION"
      - from: EXCEPTION
        to: RETURNED
        trigger: "POST /shipments/{id}/advance (target_status=RETURNED)"
        actor: ShippingOps
        preconditions:
          - "status == EXCEPTION"
        side_effects:
          - "status = RETURNED"

  - entity: BudgetApproval
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /orders/{id}/budget-decision (decision=APPROVE) — see state_machines.CorporateOrder"
        actor: FinanceApprover
        preconditions: ["decision == PENDING"]
        side_effects: ["decision = APPROVED"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /orders/{id}/budget-decision (decision=REJECT) — see state_machines.CorporateOrder"
        actor: FinanceApprover
        preconditions: ["decision == PENDING"]
        side_effects: ["decision = REJECTED"]

  - entity: RecurringOrderSeries
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "PATCH /recurring-series/{id} (active=false)"
        actor: AccountManager
        preconditions: ["active == true"]
        side_effects: ["active = false"]
      - from: PAUSED
        to: ACTIVE
        trigger: "PATCH /recurring-series/{id} (active=true)"
        actor: AccountManager
        preconditions: ["active == false"]
        side_effects: ["active = true; next_run_date = clock.now_utc + interval_days"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "system event: clock.now_utc >= next_run_date (checked whenever POST /_clock/set_current_utc advances the clock)"
        actor: system
        preconditions:
          - "active == true"
          - "clock.now_utc >= next_run_date"
        side_effects:
          - "clones source_order_id's template_id/branding_profile_id/occasion into a new CorporateOrder (DRAFT, no recipients) for the same corporate_account_id"
          - "last_generated_order_id = new order's id"
          - "next_run_date += interval_days"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: branding-profile-create-stale-account
    parent_entity: CorporateAccount
    write_endpoint: "POST /corporate-accounts/{id}/branding-profiles"
    occ_field: "expected_corporate_account_version"
    description: |
      Creating a BrandingProfile against a CorporateAccount whose version has advanced since
      the client last observed it is rejected. This captures the case where another branding
      profile has already been created for the account (which legitimately becomes the account's
      current branding default under its onboarding policy) and the current writer's view of the
      account is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: order-create-stale-account
    parent_entity: CorporateAccount
    write_endpoint: "POST /corporate-accounts/{id}/orders"
    occ_field: "expected_corporate_account_version"
    description: |
      Creating a CorporateOrder against a CorporateAccount whose version has advanced since the
      client last observed it is rejected. This captures the case where the account's budget
      configuration was just adjusted via PATCH /corporate-accounts/{id}/budget (which legitimately
      changes which template/branding combinations are affordable going forward) and the current
      writer's view of the account is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_total_cost
    trigger: "recomputed on POST /orders/{id}/submit-for-approval (provisional variant) and again on POST /orders/{id}/budget-decision decision=APPROVE (final variant)"
    algorithm: tiered_pricing
    formula: |
      per_unit_price_cents = template.base_price_cents + (order.branding_profile_id is not null ? BRANDING_SURCHARGE_CENTS : 0)
      total_units = sum(recipient.quantity for recipient in order.recipients if recipient.import_row_status == ACCEPTED)
      subtotal_cents = per_unit_price_cents * total_units
      tier =
        total_units >= 500 ? "TIER_3" :
        total_units >= 100 ? "TIER_2" :
        total_units >= 25  ? "TIER_1" : "TIER_0"
      discount_pct = {TIER_0: 0.00, TIER_1: 0.05, TIER_2: 0.10, TIER_3: 0.15}[tier]
      discounted_subtotal_cents = round_half_up(subtotal_cents * (1 - discount_pct))   # rounded ONCE on the whole discounted subtotal
      rush_fee_cents =
        (order.scheduled_send_date is not null
         AND (order.scheduled_send_date - clock.now_utc) <= RUSH_WINDOW_DAYS
         AND tier == "TIER_0")
        ? RUSH_FEE_CENTS : 0
      # order.total_cost_cents is finalized by calculations.budget_utilization_and_approval_trigger, which
      # applies loyalty_discount_pct on top of discounted_subtotal_cents before adding rush_fee_cents.
    input_set: "Recipient rows for this order with import_row_status == ACCEPTED, at the price/branding snapshot named by the variant below"
    constants:
      BRANDING_SURCHARGE_CENTS: 150
      RUSH_WINDOW_DAYS: 3
      RUSH_FEE_CENTS: 2500
      TIER_1_THRESHOLD_UNITS: 25
      TIER_2_THRESHOLD_UNITS: 100
      TIER_3_THRESHOLD_UNITS: 500
    precision: "integer cents, round_half_up, applied once at discounted_subtotal_cents (not per recipient row)"
    variants:
      - name: provisional
        when: "order.approval_status IN {DRAFT, PENDING_APPROVAL}"
        difference: "Uses GiftBasketTemplate.base_price_cents and BrandingProfile at their CURRENT (live) version; recomputed on every submit-for-approval, so a catalog price edit between DRAFT and APPROVE changes the provisional figure."
      - name: final
        when: "order.approval_status == APPROVED"
        difference: "Uses GiftBasketTemplate/BrandingProfile pinned at order.locked_template_version/locked_branding_version — the price snapshot taken at the moment of approval — so it no longer moves even if the catalog changes afterward. For identical recipient/quantity data, final can differ numerically from the last provisional figure if PlatformAdmin edited base_price_cents between submit-for-approval and budget-decision."

  - name: shipping_cost_total
    trigger: "computed once per Shipment at POST /recipients/{id}/shipments; order-level total is the sum for reporting only"
    algorithm: aggregation
    formula: |
      estimated_weight_kg = TEMPLATE_BASE_WEIGHT_KG * recipient.quantity
      per_shipment_cost_cents = round_half_up(zone.base_rate_cents + zone.per_kg_rate_cents * estimated_weight_kg)
      # Rounding order is PINNED: round PER SHIPMENT first, THEN sum across the order's shipments.
      order_shipping_total_cents = sum(shipment.shipping_cost_cents for shipment in order.shipments)
      # Summing unrounded fractional per-kg costs first and rounding once at the end (sum-then-round)
      # yields a different (generally lower) total whenever any per-shipment cost has a fractional-cent
      # remainder; this scaffold forbids that ordering.
    input_set: "the single Shipment being created, using its recipient's quantity and its zone's rate fields"
    constants:
      TEMPLATE_BASE_WEIGHT_KG: 1.2
    precision: "integer cents, round_half_up, applied per-shipment before any cross-shipment sum"

  - name: budget_utilization_and_approval_trigger
    trigger: "runs immediately after order_total_cost (provisional variant) inside POST /orders/{id}/submit-for-approval, before the BudgetApproval row is created"
    algorithm: constraint_propagation
    formula: |
      # Step 1: remaining_budget_cents depends ONLY on account fields, never on this order's cost.
      remaining_budget_cents = account.monthly_budget_cents - account.ytd_spend_cents
      # Step 2: loyalty_tier/loyalty_discount_pct is picked from remaining_budget_cents, computed BEFORE
      # this order's total_cost_cents exists.
      loyalty_tier =
        remaining_budget_cents >= GOLD_THRESHOLD_CENTS   ? "GOLD" :
        remaining_budget_cents >= SILVER_THRESHOLD_CENTS ? "SILVER" : "STANDARD"
      loyalty_discount_pct = {GOLD: 0.03, SILVER: 0.01, STANDARD: 0.00}[loyalty_tier]
      # Step 3: loyalty_discount_pct is applied to order_total_cost's discounted_subtotal_cents to produce
      # the order's final total_cost_cents. Evaluation order is fixed: remaining_budget -> loyalty_tier ->
      # order.total_cost_cents. order.total_cost_cents MUST NOT feed back into remaining_budget_cents
      # within this same evaluation (that would make the dependency truly circular and ill-defined).
      order.total_cost_cents = round_half_up(discounted_subtotal_cents * (1 - loyalty_discount_pct)) + rush_fee_cents
      # Step 4: requires_approval boundary is STRICT greater-than (Rule 6 instance 1).
      order.requires_approval = order.total_cost_cents > account.approval_threshold_cents
      # Step 5: independent hard-cap check, enforced later at budget-decision APPROVE time (validations priority 32).
      would_exceed_hard_cap = (account.ytd_spend_cents + order.total_cost_cents) > account.monthly_budget_cents
    input_set: "the submitting order's discounted_subtotal_cents/rush_fee_cents plus the owning CorporateAccount's monthly_budget_cents/ytd_spend_cents/approval_threshold_cents"
    constants:
      GOLD_THRESHOLD_CENTS: 1000000
      SILVER_THRESHOLD_CENTS: 250000
    precision: "integer cents, round_half_up"

  - name: component_available_qty
    trigger: "evaluated per InventoryReservation candidate: forward_looking at POST /orders/{id}/recipients/import (per row), chronological at POST /orders/{id}/budget-decision decision=APPROVE (per reservation being moved to ALLOCATED)"
    algorithm: threshold
    formula: |
      # forward_looking variant (used at import time):
      active_reservations_fwd = InventoryReservation where sku_id == sku.id
                                 AND status IN {RESERVED, ALLOCATED}
                                 AND (expires_at is null OR expires_at > candidate_recipient.order.scheduled_send_date_or_now)
      available_qty_forward_looking = sku.on_hand_qty - sum(active_reservations_fwd.reserved_qty)
      # chronological variant (used at allocate/approve time):
      # process every RESERVED/ALLOCATED reservation on this sku in created_at ASC order (ties broken by
      # created_at alone — no other field participates), running a cumulative-reserved accumulator; a
      # reservation is satisfiable only if the accumulator (including itself) does not exceed on_hand_qty.
      available_qty_chronological = sku.on_hand_qty - running_sum(reserved_qty ordered by created_at ASC,
                                                                    over RESERVED/ALLOCATED reservations up to
                                                                    and including the reservation being checked)
    input_set: "InventoryReservation rows for the given ComponentSKU with status IN {RESERVED, ALLOCATED}"
    constants: {}
    precision: "integer units"
    variants:
      - name: forward_looking
        when: "POST /orders/{id}/recipients/import, per recipient row, before creating that row's InventoryReservation"
        difference: "Excludes reservations that will have already EXPIRED by the order's scheduled_send_date (or now, if unscheduled) from the competing set — projects forward to the fulfillment date."
      - name: chronological
        when: "POST /orders/{id}/budget-decision decision=APPROVE, per reservation being moved RESERVED -> ALLOCATED"
        difference: "Ignores future expiry entirely; processes ALL RESERVED/ALLOCATED reservations on the sku strictly in created_at order (first-come-first-served), so a reservation created earlier can exhaust stock a later, not-yet-expired reservation would otherwise have projected as available. Produces a different available_qty than forward_looking whenever any competing reservation is within its shelf life but was created after the one being checked."

  - name: ytd_spend_recompute
    trigger: "forward leg on CorporateOrder budget-decision APPROVE; reverse leg (compensation, Rule 9 instance 2) on CorporateOrder cancel when order.approval_status == APPROVED"
    algorithm: aggregation
    formula: |
      # Reset mechanism: account.ytd_spend_cents is zeroed by the system at the first mutation of any
      # kind observed after clock.now_utc crosses into a new calendar month (inclusive of the 1st
      # 00:00:00.000Z through the last instant of the month, UTC calendar boundary).
      # Forward leg:
      account.ytd_spend_cents += order.total_cost_cents
      # Reverse leg (only if order.approval_status == APPROVED at cancel time, i.e. it was already counted):
      account.ytd_spend_cents -= order.total_cost_cents
    input_set: "the single order being approved or cancelled; NOT a full re-sum of all orders (incremental update)"
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the authenticated role is permitted to call this endpoint per §1.7's exclusive/shared operations"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "CorporateAccount named by the path/body corporate_account_id exists"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints under /corporate-accounts/{id}/* and any body referencing corporate_account_id"

  - priority: 4
    category: existence
    check: "CorporateOrder named by the path order id exists"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints under /orders/{id}/*"

  - priority: 5
    category: existence
    check: "Recipient named by the path recipient id exists"
    error_id: ERR_RECIPIENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints under /recipients/{id}/*"

  - priority: 6
    category: existence
    check: "GiftBasketTemplate named by body.template_id exists and active == true"
    error_id: ERR_TEMPLATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /corporate-accounts/{id}/orders, POST /corporate-accounts/{id}/recurring-series"

  - priority: 7
    category: existence
    check: "BrandingProfile named by body.branding_profile_id (when provided) exists and belongs to the same corporate_account_id"
    error_id: ERR_BRANDING_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "POST /corporate-accounts/{id}/orders"

  - priority: 8
    category: existence
    check: "ComponentSKU named by any components[].sku_id exists"
    error_id: ERR_SKU_NOT_FOUND
    http_status: 404
    applies_to: "POST /gift-basket-templates"

  - priority: 9
    category: existence
    check: "AssemblyStation named by body.station_id (budget-decision APPROVE, or submit-for-approval when it will auto-approve) or ShippingZone named by body.zone_id (shipment creation) exists"
    error_id: ERR_FULFILLMENT_REF_NOT_FOUND
    http_status: 404
    applies_to: "POST /orders/{id}/budget-decision, POST /orders/{id}/submit-for-approval, POST /recipients/{id}/shipments"

  - priority: 10
    category: existence
    check: "the sub-resource named by the path id (AssemblyTask, Shipment, MessageProof, or RecurringOrderSeries) exists"
    error_id: ERR_SUBRESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /assembly-tasks/{id}/advance, POST /shipments/{id}/advance, GET /recipients/{id}/message-proof, POST /message-proofs/{id}/decision, PATCH /recurring-series/{id}"

  - priority: 11
    category: state
    check: "order.approval_status IN {DRAFT, REJECTED} AND order.production_status != CANCELLED"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /orders/{id}/submit-for-approval"

  - priority: 12
    category: state
    check: "BudgetApproval.decision == PENDING (budget-decision) OR MessageProof.proof_status == SUBMITTED (proof decision)"
    error_id: ERR_INVALID_DECISION_STATE
    http_status: 409
    applies_to: "POST /orders/{id}/budget-decision, POST /message-proofs/{id}/decision"

  - priority: 13
    category: state
    check: "AssemblyTask/Shipment target_status is a legal next state from the resource's current status per §1.2"
    error_id: ERR_INVALID_FULFILLMENT_STATE
    http_status: 409
    applies_to: "POST /assembly-tasks/{id}/advance, POST /shipments/{id}/advance"

  - priority: 14
    category: state
    check: "order.production_status IN {DRAFT, ASSEMBLING}"
    error_id: ERR_ORDER_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /orders/{id}/cancel"

  - priority: 15
    category: state
    check: "RecurringOrderSeries.active == true (target active=false) or == false (target active=true)"
    error_id: ERR_INVALID_SERIES_STATE
    http_status: 409
    applies_to: "PATCH /recurring-series/{id}"

  - priority: 16
    category: business_safety
    check: "every ComponentSKU used by the order's basket composition has remaining shelf life (created_at + shelf_life_days) that will not expire before body.scheduled_date + AssemblyStation lead time of 0 days (i.e. must still be unexpired on the scheduled assembly day)"
    error_id: ERR_PERISHABLE_SAFETY_VIOLATION
    http_status: 422
    applies_to: "POST /orders/{id}/budget-decision (decision=APPROVE), and the auto-approval path inside POST /orders/{id}/submit-for-approval"

  - priority: 17
    category: business_safety
    check: "calculations.component_available_qty (chronological variant) >= reserved_qty for every InventoryReservation this order would move to ALLOCATED"
    error_id: ERR_INSUFFICIENT_INVENTORY_CHRONOLOGICAL
    http_status: 409
    applies_to: "POST /orders/{id}/budget-decision (decision=APPROVE), and the auto-approval path inside POST /orders/{id}/submit-for-approval"

  - priority: 18
    category: business_referential
    check: "order.branding_profile_id is null OR BrandingProfile.approved == true"
    error_id: ERR_BRANDING_PROFILE_NOT_APPROVED
    http_status: 422
    applies_to: "POST /orders/{id}/budget-decision (decision=APPROVE), and the auto-approval path inside POST /orders/{id}/submit-for-approval"

  - priority: 19
    category: business_referential
    check: "the Recipient's MessageProof.proof_status == LOCKED"
    error_id: ERR_MESSAGE_PROOF_NOT_LOCKED
    http_status: 422
    applies_to: "POST /recipients/{id}/shipments"

  - priority: 20
    category: business_constraint
    check: "body.approver_user_id != BudgetApproval.requested_by_user_id (segregation of duties: requester cannot decide their own request)"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /orders/{id}/budget-decision"

  - priority: 21
    category: business_constraint
    check: "body.decided_by_user_id != MessageProof.submitted_by_user_id (segregation of duties: submitter cannot decide their own proof)"
    error_id: ERR_SELF_PROOF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /message-proofs/{id}/decision"

  - priority: 22
    category: business_constraint
    check: "count(Recipient where corporate_order_id == order.id AND import_row_status == ACCEPTED) >= 1"
    error_id: ERR_EMPTY_RECIPIENT_LIST
    http_status: 422
    applies_to: "POST /orders/{id}/submit-for-approval"

  - priority: 23
    category: business_constraint
    check: "at least one row of the submitted CSV batch passes per-row validation (accepted_rows > 0)"
    error_id: ERR_IMPORT_BATCH_ALL_ROWS_REJECTED
    http_status: 422
    applies_to: "POST /orders/{id}/recipients/import"

  - priority: 24
    category: business_constraint
    check: "no two ACCEPTED rows in the same import batch (or the batch and the order's existing recipients) share the same email"
    error_id: ERR_DUPLICATE_RECIPIENT_EMAIL
    http_status: 422
    applies_to: "POST /orders/{id}/recipients/import"

  - priority: 25
    category: business_constraint
    check: "calculations.component_available_qty (forward_looking variant) >= (template.components[sku].quantity * recipient.quantity) for every sku in the template, for this recipient row"
    error_id: ERR_INSUFFICIENT_INVENTORY_FORWARD
    http_status: 422
    applies_to: "POST /orders/{id}/recipients/import (evaluated per row; a failing row is REJECTED but does not abort the rest of the batch)"

  - priority: 26
    category: business_constraint
    check: "sum(AssemblyTask.quantity where station_id == body.station_id AND scheduled_date == body.scheduled_date), across ALL orders, plus this order's total recipient quantity, does not exceed AssemblyStation.daily_capacity"
    error_id: ERR_ASSEMBLY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/budget-decision (decision=APPROVE), and the auto-approval path inside POST /orders/{id}/submit-for-approval"

  - priority: 27
    category: business_temporal
    check: "order.scheduled_send_date, if set, is strictly after clock.now_utc"
    error_id: ERR_SCHEDULED_SEND_IN_PAST
    http_status: 422
    applies_to: "POST /corporate-accounts/{id}/orders, POST /orders/{id}/submit-for-approval"

  - priority: 28
    category: business_temporal
    check: "the half-open interval [body.ship_date, body.ship_date + zone.transit_days_min) contains no date in zone.blackout_dates, AND body.ship_date + zone.transit_days_max <= recipient.corporate_order.scheduled_send_date when scheduled_send_date is set"
    error_id: ERR_SHIPPING_BLACKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /recipients/{id}/shipments"

  - priority: 29
    category: business_fiscal
    check: "(account.ytd_spend_cents + order.total_cost_cents) <= account.monthly_budget_cents, re-checked at approval time even when order.requires_approval == false"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /orders/{id}/budget-decision (decision=APPROVE), and the auto-approval path inside POST /orders/{id}/submit-for-approval"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Catalog & config (PlatformAdmin fixtures) ---
  - method: POST
    path: "/gift-basket-templates"
    description: "Create a catalog gift-basket template with its SKU composition."
    roles: [PlatformAdmin]
    code: 201
    input: [name, category, base_price_cents, is_perishable, "shelf_life_days?", components, "active?"]
    output: GiftBasketTemplate
    side_effects: []

  - method: PATCH
    path: "/gift-basket-templates/{id}"
    description: "Update a template's catalog price/composition/active flag. A price edit between an order's submit-for-approval and its budget-decision APPROVE is what makes calculations.order_total_cost's provisional and final variants diverge."
    roles: [PlatformAdmin]
    code: 200
    input: ["base_price_cents?", "active?", "components?"]
    output: GiftBasketTemplate
    side_effects: ["increments GiftBasketTemplate.version by 1"]

  - method: POST
    path: "/component-skus"
    description: "Register a warehouse component SKU with initial stock."
    roles: [PlatformAdmin]
    code: 201
    input: [name, unit_cost_cents, is_perishable, "shelf_life_days?", "on_hand_qty?"]
    output: ComponentSKU
    side_effects: []

  - method: POST
    path: "/shipping-zones"
    description: "Create a shipping zone with carrier rates and blackout dates."
    roles: [PlatformAdmin]
    code: 201
    input: [zone_code, country_codes, carrier, base_rate_cents, per_kg_rate_cents, transit_days_min, transit_days_max, "blackout_dates?"]
    output: ShippingZone
    side_effects: []

  - method: POST
    path: "/assembly-stations"
    description: "Create a warehouse assembly station with its daily capacity."
    roles: [PlatformAdmin]
    code: 201
    input: [name, daily_capacity]
    output: AssemblyStation
    side_effects: []

  # --- CorporateAccount ---
  - method: POST
    path: "/corporate-accounts"
    description: "Onboard a new corporate customer with its budget policy."
    roles: [PlatformAdmin]
    code: 201
    input: [name, billing_email, monthly_budget_cents, approval_threshold_cents]
    output: CorporateAccount
    side_effects: []

  - method: GET
    path: "/corporate-accounts/{id}"
    description: "Fetch a corporate account, including ytd_spend_cents and version."
    roles: [PlatformAdmin, AccountManager, FinanceApprover]
    code: 200
    input: []
    output: CorporateAccount
    side_effects: []

  - method: PATCH
    path: "/corporate-accounts/{id}/budget"
    description: "Adjust an account's monthly budget or approval threshold."
    roles: [PlatformAdmin]
    code: 200
    input: ["monthly_budget_cents?", "approval_threshold_cents?"]
    output: CorporateAccount
    side_effects: ["increments CorporateAccount.version by 1"]

  # --- BrandingProfile ---
  - method: POST
    path: "/corporate-accounts/{id}/branding-profiles"
    description: "Create a branding/customization profile for the account (OCC-guarded, see concurrency_rules.branding-profile-create-stale-account)."
    roles: [AccountManager]
    code: 201
    input: [name, logo_url, accent_color, card_stock, expected_corporate_account_version]
    output: BrandingProfile
    side_effects: ["increments CorporateAccount.version by 1"]

  - method: GET
    path: "/corporate-accounts/{id}/branding-profiles"
    description: "List branding profiles for the account (FK reverse-reachability for BrandingProfile.corporate_account_id)."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: BrandingProfile[]
    side_effects: []

  - method: POST
    path: "/branding-profiles/{id}/approve"
    description: "Mark a branding profile as compliance-approved; required before it can be used on an APPROVED order."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BrandingProfile
    side_effects: ["BrandingProfile.approved = true"]

  # --- CorporateOrder ---
  - method: POST
    path: "/corporate-accounts/{id}/orders"
    description: "Create a DRAFT bulk order against a template (OCC-guarded, see concurrency_rules.order-create-stale-account)."
    roles: [AccountManager]
    code: 201
    input: [template_id, "branding_profile_id?", occasion, "scheduled_send_date?", expected_corporate_account_version]
    output: CorporateOrder
    side_effects: ["increments CorporateAccount.version by 1"]

  - method: GET
    path: "/orders"
    description: "Filtered list of orders (FK reverse-reachability for CorporateOrder.corporate_account_id, .template_id, .branding_profile_id, collapsed into one endpoint)."
    roles: [AccountManager, FinanceApprover, PlatformAdmin]
    code: 200
    input: ["corporate_account_id?", "template_id?", "branding_profile_id?", "approval_status?", "production_status?"]
    output: CorporateOrder[]
    side_effects: []

  - method: GET
    path: "/orders/{id}"
    description: "Fetch a single order, including computed cost/approval/production fields."
    roles: [AccountManager, FinanceApprover, WarehouseOps, ShippingOps, PlatformAdmin]
    code: 200
    input: []
    output: CorporateOrder
    side_effects: []

  - method: POST
    path: "/orders/{id}/recipients/import"
    description: "Bulk-import a CSV recipient list; partial success — invalid/duplicate/under-stocked rows are REJECTED without aborting the batch."
    roles: [AccountManager]
    code: 201
    input: [rows]
    output: Recipient[]
    side_effects:
      - "creates one Recipient per row (import_row_status ACCEPTED or REJECTED)"
      - "for each ACCEPTED row, creates one InventoryReservation per sku in template.components (status RESERVED, reserved_qty = components[sku].quantity * row.quantity, expires_at = created_at + sku.shelf_life_days when sku.is_perishable)"

  - method: GET
    path: "/orders/{id}/recipients"
    description: "List recipients for an order (FK reverse-reachability for Recipient.corporate_order_id)."
    roles: [AccountManager, WarehouseOps, ShippingOps, PlatformAdmin]
    code: 200
    input: []
    output: Recipient[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/submit-for-approval"
    description: "Submit a DRAFT/REJECTED order for budget approval; auto-approves when under threshold. station_id/scheduled_date are required whenever the order might auto-approve (used by Cascade A if requires_approval resolves to false) and are otherwise ignored (a human FinanceApprover supplies them on POST /orders/{id}/budget-decision instead)."
    roles: [AccountManager]
    code: 200
    input: [requested_by_user_id, "station_id?", "scheduled_date?"]
    output: CorporateOrder
    side_effects:
      - "runs calculations.order_total_cost (provisional) and calculations.budget_utilization_and_approval_trigger"
      - "creates BudgetApproval (decision=PENDING)"
      - "order.approval_status = PENDING_APPROVAL"
      - "if requires_approval == false: auto-fires budget-decision APPROVE with approver_user_id = null"

  - method: POST
    path: "/orders/{id}/budget-decision"
    description: "FinanceApprover approves or rejects a pending budget request."
    roles: [FinanceApprover]
    code: 200
    input: [decision, approver_user_id, "decision_reason?", "station_id?", "scheduled_date?"]
    output: CorporateOrder
    side_effects:
      - "decision=APPROVE: see state_machines.CorporateOrder PENDING_APPROVAL -> APPROVED (Cascade A, depth 3) and calculations.ytd_spend_recompute forward leg"
      - "decision=REJECT: see state_machines.CorporateOrder PENDING_APPROVAL -> REJECTED"

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a non-terminal order; releases reservations and refunds ytd_spend_cents if already approved."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: CorporateOrder
    side_effects: ["see state_machines.CorporateOrder {DRAFT, ASSEMBLING} -> CANCELLED (Rule 9 compensations)"]

  - method: GET
    path: "/orders/{id}/budget-approvals"
    description: "List budget-approval records for an order (FK reverse-reachability for BudgetApproval.corporate_order_id; 0 or 1 entries)."
    roles: [AccountManager, FinanceApprover, PlatformAdmin]
    code: 200
    input: []
    output: BudgetApproval[]
    side_effects: []

  - method: GET
    path: "/recipients/{id}"
    description: "Fetch a single recipient (canonical single-resource GET for Recipient; also the sub-resource anchor for MessageProof's reverse-reachability)."
    roles: [AccountManager, WarehouseOps, ShippingOps, PlatformAdmin]
    code: 200
    input: []
    output: Recipient
    side_effects: []

  # --- MessageProof ---
  - method: POST
    path: "/recipients/{id}/message-proof"
    description: "Create or resubmit a recipient's gift message for proofing."
    roles: [AccountManager]
    code: 201
    input: [message_text, submitted_by_user_id]
    output: MessageProof
    side_effects: ["proof_status = SUBMITTED"]

  - method: GET
    path: "/recipients/{id}/message-proof"
    description: "Fetch the recipient's message proof (FK reverse-reachability for MessageProof.recipient_id; 1:1, length 0 or 1)."
    roles: [AccountManager, ProofApprover]
    code: 200
    input: []
    output: MessageProof[]
    side_effects: []

  - method: POST
    path: "/message-proofs/{id}/decision"
    description: "ProofApprover approves (auto-locks) or requests revision on a submitted proof."
    roles: [ProofApprover]
    code: 200
    input: [decision, decided_by_user_id]
    output: MessageProof
    side_effects: ["see state_machines.MessageProof SUBMITTED -> {APPROVED -> LOCKED, REVISION_REQUESTED -> DRAFT}"]

  # --- Inventory & Assembly ---
  - method: GET
    path: "/inventory-reservations"
    description: "Filtered list of reservations (FK reverse-reachability for InventoryReservation.recipient_id and .sku_id, collapsed)."
    roles: [WarehouseOps, AccountManager]
    code: 200
    input: ["recipient_id?", "sku_id?", "status?"]
    output: InventoryReservation[]
    side_effects: []

  - method: GET
    path: "/inventory-reservations/{id}"
    description: "Fetch a single inventory reservation (canonical single-resource GET for InventoryReservation)."
    roles: [WarehouseOps, AccountManager]
    code: 200
    input: []
    output: InventoryReservation
    side_effects: []

  - method: GET
    path: "/assembly-tasks"
    description: "Filtered list of assembly tasks (FK reverse-reachability for AssemblyTask.recipient_id and .station_id, collapsed)."
    roles: [WarehouseOps]
    code: 200
    input: ["recipient_id?", "station_id?", "status?"]
    output: AssemblyTask[]
    side_effects: []

  - method: GET
    path: "/assembly-tasks/{id}"
    description: "Fetch a single assembly task (canonical single-resource GET for AssemblyTask)."
    roles: [WarehouseOps]
    code: 200
    input: []
    output: AssemblyTask
    side_effects: []

  - method: POST
    path: "/assembly-tasks/{id}/advance"
    description: "Advance an assembly task to the given target status."
    roles: [WarehouseOps]
    code: 200
    input: [target_status]
    output: AssemblyTask
    side_effects: ["see state_machines.AssemblyTask; target_status=COMPLETE also decrements ComponentSKU.on_hand_qty and may cascade order.production_status to READY_TO_SHIP"]

  # --- Shipment ---
  - method: GET
    path: "/shipments"
    description: "Filtered list of shipments (FK reverse-reachability for Shipment.recipient_id and .zone_id, collapsed)."
    roles: [ShippingOps, AccountManager]
    code: 200
    input: ["recipient_id?", "zone_id?", "status?"]
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/shipments/{id}"
    description: "Fetch a single shipment (canonical single-resource GET for Shipment)."
    roles: [ShippingOps, AccountManager]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/recipients/{id}/shipments"
    description: "Create a shipment for a recipient whose message proof is LOCKED."
    roles: [ShippingOps]
    code: 201
    input: [zone_id, ship_date]
    output: Shipment
    side_effects: ["runs calculations.shipping_cost_total for this shipment"]

  - method: POST
    path: "/shipments/{id}/advance"
    description: "Advance a shipment to the given target status (label, transit, delivered, exception, returned)."
    roles: [ShippingOps]
    code: 200
    input: [target_status]
    output: Shipment
    side_effects: ["see state_machines.Shipment; target_status=LABEL_GENERATED sets tracking_number; IN_TRANSIT/DELIVERED may cascade order.production_status"]

  # --- RecurringOrderSeries ---
  - method: POST
    path: "/corporate-accounts/{id}/recurring-series"
    description: "Set up a recurring re-order series cloning an existing order on an interval."
    roles: [AccountManager]
    code: 201
    input: [source_order_id, interval_days]
    output: RecurringOrderSeries
    side_effects: ["next_run_date = clock.now_utc + interval_days"]

  - method: GET
    path: "/recurring-series"
    description: "Filtered list of recurring series (FK reverse-reachability for RecurringOrderSeries.corporate_account_id, collapsed)."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: ["corporate_account_id?"]
    output: RecurringOrderSeries[]
    side_effects: []

  - method: GET
    path: "/recurring-series/{id}"
    description: "Fetch a single recurring series (canonical single-resource GET for RecurringOrderSeries)."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: RecurringOrderSeries
    side_effects: []

  - method: PATCH
    path: "/recurring-series/{id}"
    description: "Pause (active=false) or resume (active=true) a recurring series."
    roles: [AccountManager]
    code: 200
    input: [active]
    output: RecurringOrderSeries
    side_effects: ["active = body.active; on resume (false -> true): next_run_date = clock.now_utc + interval_days"]

  # --- System / test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock, used for scheduled_send_date, perishable expiry, and recurring-series due-date evaluation. Server starts at the fixed default 2026-03-01T00:00:00Z until this is called."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "clock.now_utc = to_iso8601"
      - "every InventoryReservation with status RESERVED and expires_at <= clock.now_utc transitions to EXPIRED"
      - "every ACTIVE RecurringOrderSeries with next_run_date <= clock.now_utc generates its next CorporateOrder (see state_machines.RecurringOrderSeries)"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role/X-User-ID headers missing or X-User-Role is not a recognized role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The authenticated role is not permitted to call this endpoint."
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "Referenced CorporateAccount id does not exist."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced CorporateOrder id does not exist."
  - id: ERR_RECIPIENT_NOT_FOUND
    http: 404
    condition: "Referenced Recipient id does not exist."
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "Referenced GiftBasketTemplate id does not exist or active == false."
  - id: ERR_BRANDING_PROFILE_NOT_FOUND
    http: 404
    condition: "Referenced BrandingProfile id does not exist, or does not belong to the given corporate_account_id."
  - id: ERR_SKU_NOT_FOUND
    http: 404
    condition: "Referenced ComponentSKU id does not exist."
  - id: ERR_FULFILLMENT_REF_NOT_FOUND
    http: 404
    condition: "Referenced AssemblyStation id (station_id) or ShippingZone id (zone_id) does not exist."
  - id: ERR_SUBRESOURCE_NOT_FOUND
    http: 404
    condition: "Referenced AssemblyTask, Shipment, MessageProof, or RecurringOrderSeries path id does not exist."
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "CorporateOrder.approval_status is not in {DRAFT, REJECTED}, or production_status == CANCELLED, on submit-for-approval."
  - id: ERR_INVALID_DECISION_STATE
    http: 409
    condition: "BudgetApproval.decision != PENDING on budget-decision, or MessageProof.proof_status != SUBMITTED on proof decision."
  - id: ERR_INVALID_FULFILLMENT_STATE
    http: 409
    condition: "Requested target_status is not a legal next state for the AssemblyTask/Shipment's current status."
  - id: ERR_ORDER_ALREADY_TERMINAL
    http: 409
    condition: "CorporateOrder.production_status is not in {DRAFT, ASSEMBLING} on cancel."
  - id: ERR_INVALID_SERIES_STATE
    http: 409
    condition: "RecurringOrderSeries.active already matches the requested target active value."
  - id: ERR_PERISHABLE_SAFETY_VIOLATION
    http: 422
    condition: "A ComponentSKU in the order's basket composition would be expired by the scheduled assembly date."
  - id: ERR_INSUFFICIENT_INVENTORY_CHRONOLOGICAL
    http: 409
    condition: "calculations.component_available_qty (chronological variant) is below the reserved_qty needed to allocate at budget-decision APPROVE time."
  - id: ERR_BRANDING_PROFILE_NOT_APPROVED
    http: 422
    condition: "order.branding_profile_id is set but BrandingProfile.approved == false at budget-decision APPROVE time."
  - id: ERR_MESSAGE_PROOF_NOT_LOCKED
    http: 422
    condition: "The recipient's MessageProof.proof_status != LOCKED at shipment creation."
  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http: 403
    condition: "budget-decision body.approver_user_id equals BudgetApproval.requested_by_user_id."
  - id: ERR_SELF_PROOF_APPROVAL_FORBIDDEN
    http: 403
    condition: "message-proof decision body.decided_by_user_id equals MessageProof.submitted_by_user_id."
  - id: ERR_EMPTY_RECIPIENT_LIST
    http: 422
    condition: "Order has zero ACCEPTED recipients at submit-for-approval time."
  - id: ERR_IMPORT_BATCH_ALL_ROWS_REJECTED
    http: 422
    condition: "Every row in a CSV recipient-import batch failed per-row validation (accepted_rows == 0)."
  - id: ERR_DUPLICATE_RECIPIENT_EMAIL
    http: 422
    condition: "A recipient row's email duplicates another ACCEPTED row in the same order."
  - id: ERR_INSUFFICIENT_INVENTORY_FORWARD
    http: 422
    condition: "calculations.component_available_qty (forward_looking variant) is below the quantity a recipient row's basket needs at import time; that row is REJECTED."
  - id: ERR_ASSEMBLY_CAPACITY_EXCEEDED
    http: 409
    condition: "Adding this order's recipient quantity to the named station+date would exceed AssemblyStation.daily_capacity."
  - id: ERR_SCHEDULED_SEND_IN_PAST
    http: 422
    condition: "scheduled_send_date is set and is not strictly after clock.now_utc."
  - id: ERR_SHIPPING_BLACKOUT_CONFLICT
    http: 409
    condition: "The shipment's transit window intersects a carrier blackout date, or does not leave enough buffer before the order's scheduled_send_date."
  - id: ERR_BUDGET_EXCEEDED
    http: 402
    condition: "account.ytd_spend_cents + order.total_cost_cents would exceed account.monthly_budget_cents."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_corporate_account_version in the request body does not match CorporateAccount.version (OCC conflict)."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operates the catalog and fulfillment configuration surface: templates, SKUs, shipping zones, assembly stations, account onboarding/budget, and branding compliance sign-off."
    identity: "opaque"
    exclusive_operations:
      - "POST /gift-basket-templates"
      - "PATCH /gift-basket-templates/{id}"
      - "POST /component-skus"
      - "POST /shipping-zones"
      - "POST /assembly-stations"
      - "POST /corporate-accounts"
      - "PATCH /corporate-accounts/{id}/budget"
      - "POST /branding-profiles/{id}/approve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /corporate-accounts/{id}"
      - "GET /corporate-accounts/{id}/branding-profiles"
      - "GET /orders"
      - "GET /orders/{id}"
      - "GET /orders/{id}/recipients"
      - "GET /orders/{id}/budget-approvals"
      - "GET /recipients/{id}"
      - "GET /recurring-series"
      - "GET /recurring-series/{id}"
      - "POST /orders/{id}/cancel"

  - name: AccountManager
    description: "Entity-backed corporate customer identity: creates branding profiles, orders, CSV recipient imports, message proofs, and recurring series for its own account. X-User-ID must equal the CorporateAccount.id it acts as."
    identity: "entity_backed:CorporateAccount"
    exclusive_operations:
      - "POST /corporate-accounts/{id}/branding-profiles"
      - "POST /corporate-accounts/{id}/orders"
      - "POST /orders/{id}/recipients/import"
      - "POST /orders/{id}/submit-for-approval"
      - "POST /recipients/{id}/message-proof"
      - "POST /corporate-accounts/{id}/recurring-series"
      - "PATCH /recurring-series/{id}"
    shared_operations:
      - "GET /corporate-accounts/{id}"
      - "GET /corporate-accounts/{id}/branding-profiles"
      - "GET /orders"
      - "GET /orders/{id}"
      - "GET /orders/{id}/recipients"
      - "GET /orders/{id}/budget-approvals"
      - "GET /recipients/{id}"
      - "GET /recipients/{id}/message-proof"
      - "GET /inventory-reservations"
      - "GET /inventory-reservations/{id}"
      - "GET /shipments"
      - "GET /shipments/{id}"
      - "GET /recurring-series"
      - "GET /recurring-series/{id}"
      - "POST /orders/{id}/cancel"

  - name: FinanceApprover
    description: "Decides budget-approval requests; must never be the same individual (requested_by_user_id) who submitted the request (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/budget-decision"
    shared_operations:
      - "GET /corporate-accounts/{id}"
      - "GET /orders"
      - "GET /orders/{id}"
      - "GET /orders/{id}/budget-approvals"

  - name: ProofApprover
    description: "Decides gift-message proofs (approve/request-revision); must never be the same individual (submitted_by_user_id) who submitted the message (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /message-proofs/{id}/decision"
    shared_operations:
      - "GET /recipients/{id}/message-proof"

  - name: WarehouseOps
    description: "Runs the physical warehouse: SKU registration support, inventory-reservation visibility, and assembly-task execution."
    identity: "opaque"
    exclusive_operations:
      - "GET /assembly-tasks"
