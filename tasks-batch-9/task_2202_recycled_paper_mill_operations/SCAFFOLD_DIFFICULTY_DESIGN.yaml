      - name: receipt_net_tons_per_sublot_rounding_before_summation
        grounds:
          - calculations.receipt_net_tons
          - state_machines.FiberReceipt.initial_SAMPLED
          - entities.FiberReceipt.fields.net_tons
          - entities.FiberReceipt.fields.moisture_deduction_tons
        distinguishing_aspect: |
          Mode b — rounding order: ten identical sublots each accumulate a 0.0005-ton rounding
          step when ded_i is quantised to 3dp before subtraction (raw 0.03550 -> 0.036, dry
          7.064), so the mandated per-sublot-then-sum order pins net_tons at exactly 70.64 while
          summing raw deductions first and rounding once yields 70.65 — the two orders straddle
          a cent boundary.
        test_recipe:
          setup:
            - "FiberGrade MIX_54 (max_moisture_pct 14.00, max_contamination_pct 6.00) declared."
            - "Supplier Riverbend with freight_per_ton 22.00 and a CONFIRMED 200.00-ton MIX_54 purchase order."
            - "The receipt is left at SAMPLED — no disposition is taken, because only the weighing arithmetic is under test."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "MIX_54", contracted_tons: 200.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-M-010", sublots: [ { sublot_no: 1, gross_tons: 8.100, tare_tons: 1.000, moisture_pct: 14.50, contamination_pct: 5.00 }, { sublot_no: 2, gross_tons: 8.100, tare_tons: 1.000, moisture_pct: 14.50, contamination_pct: 5.00 }, { sublot_no: 3, gross_tons: 8.100, tare_tons: 1.000, moisture_pct: 14.50, contamination_pct: 5.00 }, { sublot_no: 4, gross_tons: 8.100, tare_tons: 1.000, moisture_pct: 14.50, contamination_pct: 5.00 }, { sublot_no: 5, gross_tons: 8.100, tare_tons: 1.000, moisture_pct: 14.50, contamination_pct: 5.00 }, { sublot_no: 6, gross_tons: 8.100, tare_tons: 1.000, moisture_pct: 14.50, contamination_pct: 5.00 }, { sublot_no: 7, gross_tons: 8.100, tare_tons: 1.000, moisture_pct: 14.50, contamination_pct: 5.00 }, { sublot_no: 8, gross_tons: 8.100, tare_tons: 1.000, moisture_pct: 14.50, contamination_pct: 5.00 }, { sublot_no: 9, gross_tons: 8.100, tare_tons: 1.000, moisture_pct: 14.50, contamination_pct: 5.00 }, { sublot_no: 10, gross_tons: 8.100, tare_tons: 1.000, moisture_pct: 14.50, contamination_pct: 5.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id" } }
          assert:
            - "FiberReceipt.${rcpt_id}.net_tons == 70.64"
            - "FiberReceipt.${rcpt_id}.net_tons != 70.65"
            - "FiberReceipt.${rcpt_id}.moisture_deduction_tons == 0.360"
            - "FiberReceipt.${rcpt_id}.weighted_moisture_pct == 14.50"
            - "FiberReceipt.${rcpt_id}.weighted_contamination_pct == 5.00"
            - "FiberReceipt.${rcpt_id}.status == SAMPLED"

      - name: deink_removal_fraction_nested_min_max_with_unit_tonnage_guard
        grounds:
          - calculations.deink_chemical_cost
          - calculations.pulp_yield_final
          - state_machines.PulpBatch.CLEANED_to_DEINKING
          - state_machines.PulpBatch.DEINKING_to_APPROVED
          - entities.PulpBatch.fields.cumulative_chemical_cost
          - entities.RejectStream
        distinguishing_aspect: |
          Mode a — a single expression combining five inputs through a max() denominator guard,
          a linear sensitivity term, a multiplicative effectiveness decay and an outer min()
          ceiling: with charged_tons 0.800 the max(1.000, charged_tons) guard holds the
          surfactant ratio at 6.0 rather than 7.5, so removal_frac is 0.8300 and DEINK_SLUDGE is
          0.030 tons, whereas dropping the guard saturates at MAX_REMOVAL_FRACTION 0.9500 and
          0.034 tons.
        test_recipe:
          setup:
            - "FiberGrade DLK_37 (nominal_yield 72.00, deink_required true, max_contamination 2.00, max_moisture 10.00) and PaperGradeSpec TIS_16 (TISSUE, min_brightness_iso 80.0, requires_deink_pulp true) declared."
            - "Supplier Northgate with a CONFIRMED 150.00-ton DLK_37 order and one ACCEPTED single-sublot receipt of net_tons 1.00 at contamination 1.50."
            - "PulpBatch on DIP_LINE targeting TIS_16 charging only 0.800 tons, driven to CLEANED with measured_reject_tons 0.200 (inside the 40% plausibility bound)."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "DLK_37", index_symbol: "PPI_DLK", max_contamination_pct: 2.00, max_moisture_pct: 10.00, nominal_yield_pct: 72.00, deink_required: true, rank_order: 3 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-grade-specs", payload: { product_code: "TIS_16", family: "TISSUE", basis_weight_gsm: 16.0, target_moisture_pct: 5.00, moisture_tolerance_pct: 0.50, min_sct_kn_m: 0.00, min_brightness_iso: 80.0, requires_deink_pulp: true, rank_order: 20 }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_DLK", effective_month: "2026-07", published_price_per_ton: 150.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Northgate Recovered", freight_per_ton: 18.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "DLK_37", contracted_tons: 150.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-D-002", sublots: [ { sublot_no: 1, gross_tons: 2.000, tare_tons: 1.000, moisture_pct: 8.00, contamination_pct: 1.50 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_id}" }, as: MachineOperator, as_user_id: "mo_1", captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /pulp-batches", payload: { pulper_line: "DIP_LINE", target_product_code: "TIS_16", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 0.800 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { pb_id: "$.data.id" } }
            - { call: "POST /pulp-batches/${pb_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/screen", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/clean", payload: { measured_reject_tons: 0.200 }, as: MachineOperator, as_user_id: "mo_1" }
          trigger:
            - { call: "POST /pulp-batches/${pb_id}/deink", payload: { caustic_kg: 5.0, peroxide_kg: 3.0, surfactant_kg: 6.0 }, as: MachineOperator, as_user_id: "mo_1" }
          assert:
            - "PulpBatch.${pb_id}.cumulative_chemical_cost == 29.65"
            - "PulpBatch.${pb_id}.deink_pass_count == 1"
            - "GET /reject-streams?source_ref_id=${pb_id}&source_kind=DEINK_SLUDGE returns total_count == 1 with dry_solids_tons == 0.030"
            - "GET /reject-streams?source_ref_id=${pb_id}&source_kind=DEINK_SLUDGE does NOT return dry_solids_tons == 0.034"
            - "PulpBatch.${pb_id}.provisional_accepted_tons == 0.554"
            - "PulpBatch.${pb_id}.status == DEINKING"

      - name: cogen_credit_per_tier_rounding_before_total
        grounds:
          - calculations.cogen_credit
          - calculations.steam_waterfall_dispatch
          - entities.SteamAllocation.fields.cogen_credit_usd
          - entities.SteamAllocation.fields.granted_tph
        distinguishing_aspect: |
          Mode b — rounding order inside a banded rate schedule: duration_hours is quantised to
          0.5833 and each of the three tier products is quantised to 4dp before summation
          (71.7459 + 118.1183 + 160.9908 = 350.8550 -> 350.86), whereas multiplying the
          unrounded 35/60-hour duration through and rounding once gives 350.85; all three bands
          are exactly filled at 30.000 tph so the divergence cannot be masked by band selection.
        test_recipe:
          setup:
            - "No prior SteamAllocation exists, so the header consumed figure is 0.000 and HEADER_CAPACITY_TPH 180.000 is fully available."
            - "The logical clock is still at its initial 2026-08-01T00:00:00Z, so a window starting 2026-08-01T06:00:00Z satisfies the window_start-not-in-the-past rule."
          setup_api_calls: []
          trigger:
            - { call: "POST /steam-allocations", payload: { consumer_kind: "EVAPORATOR", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T06:35:00Z", demand_tph: 90.000, priority_rank: 1 }, as: EnergyManager, as_user_id: "em_1", captures: { alloc_id: "$.data.id" } }
          assert:
            - "SteamAllocation.${alloc_id}.status == GRANTED"
            - "SteamAllocation.${alloc_id}.granted_tph == 90.000"
            - "SteamAllocation.${alloc_id}.curtailed_tph == 0.000"
            - "SteamAllocation.${alloc_id}.cogen_credit_usd == 350.86"
            - "SteamAllocation.${alloc_id}.cogen_credit_usd != 350.85"

  # ===========================================================================
  # Rule 3 — non-linear state machines on three different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: production_run_quality_axis_cycles_while_run_axis_frozen
        grounds:
          - state_machines.ProductionRun.PROVISIONAL_to_HELD
          - state_machines.ProductionRun.HELD_to_REWORK
          - state_machines.ProductionRun.REWORK_to_PROVISIONAL
          - state_machines.ProductionRun.PROVISIONAL_to_CERTIFIED
          - calculations.run_quality_index_provisional
          - calculations.run_quality_index_certified
          - entities.ProductionRun.fields.quality_status
          - entities.ProductionRun.fields.run_status
        distinguishing_aspect: |
          Non-linearity on ProductionRun is a two-axis product space: quality_status traverses the
          PROVISIONAL -> HELD -> REWORK -> PROVISIONAL -> CERTIFIED cycle and re-enters
          PROVISIONAL with a different provisional_quality_index (78.57 then 97.15) while
          run_status is pinned at COMPLETED for every one of those four hops, so the run
          re-occupies a state it has already left and the two axes never interlock again after
          the single RUNNING -> COMPLETED touch point.
        test_recipe:
          setup:
            - "FiberGrade MIX_54 / OCC_11 and PaperGradeSpec TL_140 declared; PaperMachine PM1 RUNNABLE; EffluentPermit MILL-NPDES-01 at COMPLIANT."
            - "An APPROVED non-deink PulpBatch with available_tons 25.500."
            - "ProductionRun R1 on PM1 started by mo_1 and COMPLETED with two reels: reel 1 exactly on target and reel 2 at 155.0 gsm (10.714% deviation, off-spec)."
            - "The run has produced no RollSet rows, so the REWORK -> PROVISIONAL rollset precondition is vacuously satisfied and the cycle can be driven purely on the quality axis."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-grade-specs", payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.80, min_sct_kn_m: 2.20, requires_deink_pulp: false, rank_order: 10 }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /effluent-permits", payload: { permit_number: "MILL-NPDES-01", bod_limit_kg_per_day: 100.00, tss_limit_kg_per_day: 200.00, flow_limit_m3_per_day: 5000.00, rolling_window_days: 7 }, as: EnvironmentalOfficer, as_user_id: "eo_log" }
            - { call: "POST /paper-machines", payload: { name: "PM1", wire_width_mm: 4200, max_tons_per_hour: 20.00, changeover_buffer_minutes: 60, steam_tph_per_ton: 1.400 }, as: MillPlanner, as_user_id: "mp_1", captures: { pm1_id: "$.data.id", pm1_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 200.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-A-001", sublots: [ { sublot_no: 1, gross_tons: 22.000, tare_tons: 2.000, moisture_pct: 14.50, contamination_pct: 2.50 }, { sublot_no: 2, gross_tons: 18.000, tare_tons: 1.500, moisture_pct: 11.00, contamination_pct: 3.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_id}" }, as: MachineOperator, as_user_id: "mo_1", captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /pulp-batches", payload: { pulper_line: "OCC_LINE", target_product_code: "TL_140", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 30.000 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { pb_id: "$.data.id" } }
            - { call: "POST /pulp-batches/${pb_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/screen", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/clean", payload: { measured_reject_tons: 4.500 }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/approve", payload: {}, as: QualityLab, as_user_id: "ql_cert" }
            - { call: "POST /paper-machines/${pm1_id}/runs", payload: { product_code: "TL_140", pulp_batch_id: "${pb_id}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", pulp_draw_tons: 20.000, expected_machine_version: "${pm1_v1}" }, as: MillPlanner, as_user_id: "mp_1", captures: { run_id: "$.data.id" } }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_id}/complete", payload: { broke_tons: 0.000, reel_readings: [ { reel_no: 1, reel_tons: 5.000, basis_weight_gsm: 140.0, moisture_pct: 7.50, sct_kn_m: 2.50 }, { reel_no: 2, reel_tons: 5.000, basis_weight_gsm: 155.0, moisture_pct: 7.50, sct_kn_m: 2.50 } ] }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_id}/hold", payload: {}, as: QualityLab, as_user_id: "ql_cert" }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_id}/rework", payload: {}, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_id}/resubmit-quality", payload: { reel_readings: [ { reel_no: 1, reel_tons: 5.000, basis_weight_gsm: 140.0, moisture_pct: 7.50, sct_kn_m: 2.50 }, { reel_no: 2, reel_tons: 5.000, basis_weight_gsm: 142.0, moisture_pct: 7.50, sct_kn_m: 2.50 } ] }, as: QualityLab, as_user_id: "ql_cert" }
          trigger:
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_id}/certify", payload: {}, as: QualityLab, as_user_id: "ql_cert" }
          assert:
            - "after the /complete call ProductionRun.${run_id}.provisional_quality_index == 78.57 AND off_spec_reel_count == 1"
            - "after the /hold call ProductionRun.${run_id}.quality_status == HELD AND certified_quality_index == 78.57 AND run_status == COMPLETED"
            - "after the /rework call ProductionRun.${run_id}.quality_status == REWORK AND run_status == COMPLETED"
            - "after the /resubmit-quality call ProductionRun.${run_id}.quality_status == PROVISIONAL AND provisional_quality_index == 97.15 AND off_spec_reel_count == 0"
            - "ProductionRun.${run_id}.quality_status == CERTIFIED"
            - "ProductionRun.${run_id}.certified_quality_index == 97.15"
            - "ProductionRun.${run_id}.certified_by_user_id == \"ql_cert\""
            - "ProductionRun.${run_id}.run_status == COMPLETED throughout all five quality-axis hops"

      - name: pulp_batch_deink_loop_reentry_until_pass_limit
        grounds:
          - state_machines.PulpBatch.CLEANED_to_DEINKING
          - state_machines.PulpBatch.DEINKING_to_DEINK_HOLD
          - state_machines.PulpBatch.DEINK_HOLD_to_DEINKING
          - calculations.deink_chemical_cost
          - validations.priority_54
          - errors.ERR_DEINK_PASS_LIMIT
          - entities.PulpBatch.fields.deink_pass_count
        distinguishing_aspect: |
          Non-linearity on PulpBatch is a self-loop with a monotone counter rather than a
          two-axis product: DEINKING and DEINK_HOLD are re-entered three times, and because
          PASS_DECAY compounds on pass_index the same nominal chemistry buys less removal each
          lap (effectiveness 1.0000 / 0.6500 / 0.4225), until the fourth /deink is refused at
          deink_pass_count == 3 with ERR_DEINK_PASS_LIMIT while the batch stays parked in
          DEINK_HOLD rather than failing forward.
        test_recipe:
          setup:
            - "FiberGrade DLK_37 and PaperGradeSpec TIS_16 (min_brightness_iso 80.0, requires_deink_pulp true) declared."
