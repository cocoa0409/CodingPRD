# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Task 1853: Problem Loan Workout
# §1.9 Coverage Index — breadth: every testable claim NOT already covered by
# §1.8's difficulty instances. Sections per claim-extraction-guide.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: borrower_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Borrower]
        distinguishing_aspect: "POST /borrowers with required fields only applies defaults (guarantor_name '', guarantor_net_worth_cents 0), sets status ACTIVE, and system-mints id/created_at/version==1; input-supplied id/version are ignored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Solo Prop", tax_id: "55-0000001", naics_code: "541110", internal_risk_rating: 5 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
          trigger:
            - call: "GET /borrowers/${bor_id}"
              payload: {}
              as: WorkoutOfficer
          assert:
            - "Borrower.status == ACTIVE; guarantor_name == ''; guarantor_net_worth_cents == 0; version == 1; id is a bare UUID (no prefix)"

      - name: borrower_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Borrower, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent borrower UUID returns ERR_NOT_FOUND (404), exercising the existence validation at priority 3."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /borrowers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: WorkoutOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP 404"

      - name: loan_creation_computed_defaults
        claim_type: defaults
        grounds: [entities.Loan]
        distinguishing_aspect: "On creation current_principal_cents == original_principal_cents, is_tdr == false, nonaccrual == false, charged_off_principal_cents == 0, status == PERFORMING."
        test_recipe:
          setup: ["One borrower"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Default Check Co", tax_id: "55-0000002", naics_code: "522110", internal_risk_rating: 4 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-D01", original_principal_cents: 12345678, contractual_rate_bps: 750, days_past_due: 0 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
          assert:
            - "Loan.current_principal_cents == 12345678; charged_off_principal_cents == 0; is_tdr == false; nonaccrual == false; status == PERFORMING"

      - name: workout_case_entry_rating_downgrade_requires_rating_gte_6
        claim_type: required_fields
        grounds: [entities.WorkoutCase, "validations[priority=7]", "errors[ERR_REGULATORY_TIMING]"]
        distinguishing_aspect: "entry_trigger == RISK_RATING_DOWNGRADE with risk_rating_at_entry == 5 is rejected; == 6 passes — the watchlist entry criterion is enforced at case creation."
        test_recipe:
          setup: ["One borrower with rating 5 and one PERFORMING loan"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Mild Risk LLC", tax_id: "55-0000003", naics_code: "531310", internal_risk_rating: 5 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-D02", original_principal_cents: 10000000, contractual_rate_bps: 700, days_past_due: 10 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "RISK_RATING_DOWNGRADE", risk_rating_at_entry: 5, case_officer_id: "officer-x" }
              as: WorkoutOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REGULATORY_TIMING (rating < 6 with downgrade trigger)"

      - name: chargeoff_event_immutable_no_version
        claim_type: immutability
        grounds: [entities.ChargeOffEvent]
        distinguishing_aspect: "ChargeOffEvent has common_fields: false — it carries id/created_at only; no update endpoint exists and no version field is exposed; booked_at is system-stamped."
        test_recipe:
          setup: ["Case in NEGOTIATION (charge-offs are bookable on any open case)"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Ledger Immut Co", tax_id: "55-0000004", naics_code: "541211", internal_risk_rating: 8 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-D03", original_principal_cents: 9000000, contractual_rate_bps: 800, days_past_due: 65 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 8, case_officer_id: "officer-i1" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/charge-offs"
              payload: { amount_cents: 1000000, reason_code: "STATUTORY" }
              as: LoanAccounting
              as_user_id: "acct-i1"
              captures: { co_id: $.data.id }
          assert:
            - "ChargeOffEvent response has booked_at populated by the system and exposes NO version field (append-only)"
            - "GET /loans/${loan_id}/workout-cases/${case_id}/charge-offs returns the event; there is no PUT/PATCH/DELETE on charge-offs in the API surface"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: workout_case_initial_state_watchlist
        claim_type: initial_state
        grounds: [state_machines.WorkoutCase]
        distinguishing_aspect: "A newly created WorkoutCase starts in WATCHLIST with tdr_status NOT_EVALUATED and resolution_path NONE."
        test_recipe:
          setup: ["One PERFORMING loan"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Init State Co", tax_id: "55-0000005", naics_code: "541330", internal_risk_rating: 7 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-S01", original_principal_cents: 15000000, contractual_rate_bps: 900, days_past_due: 61 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 7, case_officer_id: "officer-s1" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id }
          assert:
            - "WorkoutCase.status == WATCHLIST; tdr_status == NOT_EVALUATED; resolution_path == NONE; loss_given_default_cents == 0 (no charge-offs, no collateral yet — recomputed as max(0, 15,000,000 - 0) == 15000000 on first recompute trigger)"

      - name: case_create_on_non_performing_loan_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Loan.PERFORMING_to_WATCHLIST, "errors[ERR_LOAN_NOT_PERFORMING]"]
        distinguishing_aspect: "A second workout case on the same loan (already WATCHLIST) is rejected with ERR_LOAN_NOT_PERFORMING."
        test_recipe:
          setup: ["Loan already in WATCHLIST via first case"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Double Case Co", tax_id: "55-0000006", naics_code: "541511", internal_risk_rating: 8 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-S02", original_principal_cents: 12000000, contractual_rate_bps: 850, days_past_due: 70 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 8, case_officer_id: "officer-s2" }
              as: WorkoutOfficer
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "MANUAL_REFERRAL", risk_rating_at_entry: 8, case_officer_id: "officer-s2b" }
              as: WorkoutOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOAN_NOT_PERFORMING (loan already WATCHLIST)"

      - name: proposal_counter_identical_terms_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RestructureProposal.UNDER_BORROWER_REVIEW_to_COUNTERED, "errors[ERR_COUNTER_NOT_MATERIAL]"]
        distinguishing_aspect: "A counter with all four term fields identical to the current terms is rejected as non-material."
        test_recipe:
          setup: ["Proposal in UNDER_BORROWER_REVIEW with terms (700, 6, 0, 100000)"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Counter Test Co", tax_id: "55-0000007", naics_code: "541611", internal_risk_rating: 7 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-S03", original_principal_cents: 11000000, contractual_rate_bps: 900, days_past_due: 63 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 7, case_officer_id: "officer-s3" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Negotiate", target_resolution_date: "2027-01-15T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-s3"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s3"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-s3"
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v2: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals"
              payload: { proposal_kind: "FORBEARANCE", concession_rate_bps: 700, term_extension_months: 6, principal_forgiveness_cents: 0, borrower_concession_cents: 100000, expected_case_version: "${case_v2}" }
              as: WorkoutOfficer
              as_user_id: "officer-s3"
              captures: { prop_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s3"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/counter"
              payload: { concession_rate_bps: 700, term_extension_months: 6, principal_forgiveness_cents: 0, borrower_concession_cents: 100000 }
              as: WorkoutOfficer
              as_user_id: "officer-s3"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COUNTER_NOT_MATERIAL (no term field changed)"

      - name: withdraw_from_committee_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RestructureProposal, "errors[ERR_PROPOSAL_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "Withdraw is allowed only from DRAFT/SUBMITTED/UNDER_BORROWER_REVIEW/COUNTERED; COMMITTEE_REVIEW is outside that set."
        test_recipe:
          setup: ["Proposal escalated to COMMITTEE_REVIEW"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Withdraw Test Co", tax_id: "55-0000008", naics_code: "541612", internal_risk_rating: 7 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-S04", original_principal_cents: 13000000, contractual_rate_bps: 880, days_past_due: 64 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 7, case_officer_id: "officer-s4" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Withdraw probe", target_resolution_date: "2027-02-10T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-s4"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s4"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-s4"
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v2: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals"
              payload: { proposal_kind: "MODIFICATION", concession_rate_bps: 800, term_extension_months: 3, principal_forgiveness_cents: 0, borrower_concession_cents: 0, expected_case_version: "${case_v2}" }
              as: WorkoutOfficer
              as_user_id: "officer-s4"
              captures: { prop_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s4"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/escalate-to-committee"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s4"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/withdraw"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s4"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROPOSAL_NOT_WITHDRAWABLE (COMMITTEE_REVIEW not in the withdrawable set)"

      - name: terminal_state_lockdown_consummated_proposal
        claim_type: terminal_lockdown
        grounds: [state_machines.RestructureProposal]
        distinguishing_aspect: "A CONSUMMATED proposal is terminal: counter, resubmit, withdraw, and escalate all fail with the respective state error."
        test_recipe:
          setup: ["One CONSUMMATED proposal"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Terminal Lock Co", tax_id: "55-0000009", naics_code: "541613", internal_risk_rating: 8 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-S05", original_principal_cents: 14000000, contractual_rate_bps: 920, days_past_due: 66 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 8, case_officer_id: "officer-s5" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Lock", target_resolution_date: "2027-03-10T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-s5"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s5"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-s5"
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v2: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals"
              payload: { proposal_kind: "MODIFICATION", concession_rate_bps: 500, term_extension_months: 12, principal_forgiveness_cents: 0, borrower_concession_cents: 0, expected_case_version: "${case_v2}" }
              as: WorkoutOfficer
              as_user_id: "officer-s5"
              captures: { prop_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s5"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/escalate-to-committee"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s5"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/committee-approve"
              payload: {}
              as: CreditCommittee
              as_user_id: "cc-s5"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/consummate"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s5"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/withdraw"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s5"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROPOSAL_NOT_WITHDRAWABLE (CONSUMMATED is terminal; no outgoing transitions)"

      - name: case_close_with_open_referral_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.WorkoutCase.RESOLUTION_to_CLOSED, "errors[ERR_OPEN_REFERRALS_EXIST]"]
        distinguishing_aspect: "Close requires all referrals SETTLED or DISMISSED; an ACTIVE referral blocks the transition."
        test_recipe:
          setup: ["Case in RESOLUTION via LEGAL path with one ACTIVE referral still open"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Open Referral Co", tax_id: "55-0000010", naics_code: "541614", internal_risk_rating: 9 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-S06", original_principal_cents: 16000000, contractual_rate_bps: 940, days_past_due: 95 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 9, case_officer_id: "officer-s6" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Foreclose", target_resolution_date: "2027-04-15T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-s6"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-s6"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-s6"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/legal-referrals"
              payload: { referral_kind: "FORECLOSURE", demand_amount_cents: 0, statute_deadline: "2028-01-01T00:00:00Z", decision_rationale: "Foreclosure optimal" }
              as: WorkoutOfficer
              as_user_id: "officer-s6"
              captures: { ref_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/legal-referrals/${ref_id}/accept"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-s6"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/exit-decision"
              payload: { chosen_path: "FORECLOSURE", npv_foreclosure_cents: 9000000, npv_deed_in_lieu_cents: 8000000 }
              as: SpecialAssetsManager
              as_user_id: "mgr-s6"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/close"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-s6"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OPEN_REFERRALS_EXIST (referral still ACTIVE)"

      - name: exit_decision_foreclosure_requires_legal_status
        claim_type: guarded_transition
        grounds: [state_machines.WorkoutCase.NEGOTIATION_to_RESOLUTION, "errors[ERR_PATH_REQUIRES_LEGAL]"]
        distinguishing_aspect: "From NEGOTIATION, only RETURN_TO_PERFORMING or NOTE_SALE exits are permitted; choosing FORECLOSURE from NEGOTIATION is rejected with ERR_PATH_REQUIRES_LEGAL."
        test_recipe:
          setup: ["Case in NEGOTIATION with a CONSUMMATED proposal is NOT needed for this gate — the NEGOTIATION→RESOLUTION path with FORECLOSURE triggers the error; use a plain NEGOTIATION case"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Path Gate Co", tax_id: "55-0000011", naics_code: "541615", internal_risk_rating: 8 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-S07", original_principal_cents: 17000000, contractual_rate_bps: 960, days_past_due: 67 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 8, case_officer_id: "officer-s7" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
