# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe over §1.1–§1.7 claims)
# Sections/claim_types come from references/claim-extraction-guide.md.
# Corners already asserted by a §1.8 instance are emitted as excluded_because
# stubs (no test_recipe). Clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: client_create_returns_all_fields_and_defaults
        claim_type: Creation
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "POST /clients with required fields -> 201; status defaults ACTIVE and credit_available_cents == credit_limit_cents."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { company_name: "Acme", primary_contact_email: "a@acme.test", credit_limit_cents: 250000 }
              as: ServiceManager
              captures: { cid: $.data.id, st: $.data.status, ca: $.data.credit_available_cents }
          assert:
            - "HTTP 201; Client.status == ACTIVE; Client.credit_available_cents == 250000; Client.id present"

      - name: client_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Client.fields.company_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /clients omitting company_name -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { primary_contact_email: "a@acme.test" }
              as: ServiceManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_VALIDATION; HTTP 400"]

      - name: contract_invalid_service_tier_enum_returns_invalid_enum
        claim_type: Type Constraints
        grounds: [entities.Contract.fields.service_tier, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /contracts with service_tier PLATINUM (outside {BRONZE,SILVER,GOLD}) -> ERR_INVALID_ENUM."
        test_recipe:
          setup: ["Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Beta", primary_contact_email: "b@beta.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "PLATINUM", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_INVALID_ENUM; HTTP 400"]

      - name: asset_system_fields_ignored_on_create
        claim_type: System Fields
        grounds: [entities.Asset.fields.monitoring_status, entities.Asset.fields.contract_id]
        distinguishing_aspect: "POST /assets ignores any client-supplied monitoring_status/contract_id; server forces UNMONITORED and null contract_id."
        test_recipe:
          setup: ["Client + site exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Gamma", primary_contact_email: "g@gamma.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${cid}", label: "HQ", address: "1 Main" }
              as: ServiceManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { client_id: "${cid}", site_id: "${sid}", asset_type: "LAPTOP", hostname: "l1" }
              as: ServiceManager
              captures: { ms: $.data.monitoring_status, pc: $.data.patch_compliance_pct }
          assert: ["Asset.monitoring_status == UNMONITORED; Asset.patch_compliance_pct == 100.0"]

      - name: asset_not_found_returns_404
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_ASSET_NOT_FOUND]"]
        distinguishing_aspect: "GET /assets/{nonexistent} -> ERR_ASSET_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /assets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ServiceManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_ASSET_NOT_FOUND; HTTP 404"]

  - section: state_machines
    instances:
      - name: contract_activate_from_terminated_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Contract, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A TERMINATED contract cannot be activated: activate -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Contract activated then terminated (TERMINATED)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Del", primary_contact_email: "d@del.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /contracts/${ctr}/terminate"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_INVALID_STATE; HTTP 409"]

      - name: ticket_assign_second_time_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Ticket.NEW_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Assigning an already-assigned (IN_PROGRESS) ticket -> ERR_INVALID_STATE on the second call."
        test_recipe:
          setup: ["Client+SILVER contract active; technician; ticket assigned (IN_PROGRESS)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Eps", primary_contact_email: "e@eps.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /technicians"
              payload: { full_name: "T1", hourly_rate_cents: 8000 }
              as: ServiceManager
              captures: { tid: $.data.id }
            - call: "POST /tickets"
              payload: { client_id: "${cid}", contract_id: "${ctr}", priority: "P3", subject: "x" }
              as: ServiceManager
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/assign"
              payload: { technician_id: "${tid}" }
              as: Dispatcher
          trigger:
            - call: "POST /tickets/${tk}/assign"
              payload: { technician_id: "${tid}" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_INVALID_STATE; HTTP 409"]

      - name: remote_dispatch_arrive_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Dispatch.SCHEDULED_to_ON_SITE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REMOTE dispatch has no ON_SITE step: arrive -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Client+SILVER contract active; technician; ticket IN_PROGRESS; REMOTE dispatch SCHEDULED."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Zet", primary_contact_email: "z@zet.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /technicians"
              payload: { full_name: "T2", hourly_rate_cents: 8000 }
              as: ServiceManager
              captures: { tid: $.data.id }
            - call: "POST /tickets"
              payload: { client_id: "${cid}", contract_id: "${ctr}", priority: "P3", subject: "x" }
              as: ServiceManager
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/assign"
              payload: { technician_id: "${tid}" }
              as: Dispatcher
            - call: "POST /tickets/${tk}/dispatches"
              payload: { technician_id: "${tid}", mode: "REMOTE", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Dispatcher
              captures: { did: $.data.id }
          trigger:
            - call: "POST /dispatches/${did}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_INVALID_STATE; HTTP 409"]

      - name: quote_accept_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Quote.SENT_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a DRAFT (never-sent) quote -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Client active; DRAFT quote."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Eta", primary_contact_email: "h@eta.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /quotes"
              payload: { client_id: "${cid}", quote_type: "PROJECT", title: "q", line_items: [ { description: "w", unit_price_cents: 1000, qty: 1 } ], valid_until: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { qid: $.data.id }
          trigger:
            - call: "POST /quotes/${qid}/accept"
              payload: {}
              as: ClientContact
              as_user_id: "${cid}"
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_INVALID_STATE; HTTP 409"]

      - name: quote_accept_after_expiry_returns_quote_expired
        claim_type: Invalid Transitions
        grounds: [state_machines.Quote.SENT_to_EXPIRED, "errors[ERR_QUOTE_EXPIRED]"]
        distinguishing_aspect: "A SENT quote whose valid_until has passed cannot be accepted: accept -> ERR_QUOTE_EXPIRED."
        test_recipe:
          setup: ["Clock 2026-05-01. Client active; quote SENT with valid_until 2026-05-02; clock advanced to 2026-05-03."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /clients"
              payload: { company_name: "The", primary_contact_email: "t@the.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /quotes"
              payload: { client_id: "${cid}", quote_type: "PROJECT", title: "q", line_items: [ { description: "w", unit_price_cents: 1000, qty: 1 } ], valid_until: "2026-05-02T00:00:00Z" }
              as: AccountManager
              captures: { qid: $.data.id }
            - call: "POST /quotes/${qid}/send"
              payload: {}
              as: AccountManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: ServiceManager
          trigger:
            - call: "POST /quotes/${qid}/accept"
              payload: {}
              as: ClientContact
              as_user_id: "${cid}"
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_QUOTE_EXPIRED; HTTP 409"]

  - section: calculations
    instances:
      - name: quote_total_round_per_line_then_sum
        claim_type: Computed Fields
        grounds: [calculations.order_total, entities.Quote.fields.subtotal_cents, entities.Quote.fields.total_cents]
        distinguishing_aspect: "Quote subtotal_cents == 1333 (pre-tax) and total_cents == 1440 (round(1080)+round(359.64->360)), per-line-then-sum."
        test_recipe:
          setup: ["Client active."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Iot", primary_contact_email: "i@iot.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload: { client_id: "${cid}", quote_type: "PROCUREMENT", title: "q", line_items: [ { description: "a", unit_price_cents: 500, qty: 2 }, { description: "b", unit_price_cents: 333, qty: 1 } ], tax_rate: 0.08, valid_until: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { sub: $.data.subtotal_cents, tot: $.data.total_cents }
          assert: ["Quote.subtotal_cents == 1333", "Quote.total_cents == 1440"]

      - name: invoice_overage_charge_from_accrued_ticket_minutes
        claim_type: Correct Result
        grounds: [calculations.invoice_total, entities.Invoice.fields.overage_charge_cents, entities.Contract.fields.period_ticket_minutes]
        distinguishing_aspect: "SILVER included 1200; accruing 1500 ticket minutes gives overage 300*250=75000, total 122500 (base 50000 - discount 2500 + overage 75000)."
        test_recipe:
          setup: ["Clock 2026-05-01. SILVER contract seat 10 rate 5000 active; technician; one P1 ticket assigned, dispatched REMOTE, completed logged 1500 (resolves ticket -> period_ticket_minutes 1500)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /clients"
              payload: { company_name: "Kap", primary_contact_email: "k@kap.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 10, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /technicians"
              payload: { full_name: "T3", hourly_rate_cents: 8000 }
              as: ServiceManager
              captures: { tid: $.data.id }
            - call: "POST /tickets"
              payload: { client_id: "${cid}", contract_id: "${ctr}", priority: "P1", subject: "outage" }
              as: ServiceManager
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/assign"
              payload: { technician_id: "${tid}" }
              as: Dispatcher
            - call: "POST /tickets/${tk}/dispatches"
              payload: { technician_id: "${tid}", mode: "REMOTE", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T04:00:00Z" }
              as: Dispatcher
              captures: { did: $.data.id }
            - call: "POST /dispatches/${did}/complete"
              payload: { logged_minutes: 1500 }
              as: Technician
              as_user_id: "${tid}"
          trigger:
            - call: "POST /contracts/${ctr}/invoices"
              payload: { variant: "PROVISIONAL" }
              as: ServiceManager
              captures: { over: $.data.overage_charge_cents, tot: $.data.total_cents }
          assert:
            - "Invoice.overage_charge_cents == 75000"
            - "Invoice.total_cents == 122500"

  - section: validations
    instances:
      - name: missing_auth_context_returns_401
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_CONTEXT]"]
        distinguishing_aspect: "A request with no X-User-Role header -> ERR_MISSING_AUTH_CONTEXT (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { company_name: "NoAuth", primary_contact_email: "n@x.test" }
              as: MISSING
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_MISSING_AUTH_CONTEXT; HTTP 401 (no/blank X-User-Role)"]

      - name: forbidden_role_on_activate_returns_403
        claim_type: Priority Ordering
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Dispatcher calling POST /contracts/{id}/activate (ServiceManager-exclusive) -> ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Client + DRAFT contract."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Lam", primary_contact_email: "l@lam.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
          trigger:
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_FORBIDDEN_ROLE; HTTP 403"]

      - name: seat_adjustment_below_assigned_floor_returns_422
        claim_type: Aggregate validation
        grounds: ["validations[priority=8]", "errors[ERR_SEAT_FLOOR_VIOLATION]"]
        distinguishing_aspect: "Contract seat_count 1 with 1 ACTIVE assigned asset; a -1 seat adjustment would drop below the assigned floor -> ERR_SEAT_FLOOR_VIOLATION."
        test_recipe:
          setup: ["SILVER contract seat_count 1 active; one asset assigned (ACTIVE); expected_contract_version captured from activate."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Mu", primary_contact_email: "m@mu.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${cid}", label: "S", address: "1 Rd" }
              as: ServiceManager
              captures: { sid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 1, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
              captures: { cv: $.data.version }
            - call: "POST /assets"
              payload: { client_id: "${cid}", site_id: "${sid}", asset_type: "DESKTOP", hostname: "pc1" }
              as: ServiceManager
              captures: { aid: $.data.id }
            - call: "POST /assets/${aid}/assign-contract"
              payload: { contract_id: "${ctr}" }
              as: ServiceManager
          trigger:
            - call: "POST /contracts/${ctr}/seat-adjustments"
              payload: { delta: -1, effective_at: "2026-05-02T00:00:00Z", expected_contract_version: "${cv}" }
              as: ServiceManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_SEAT_FLOOR_VIOLATION; HTTP 422"]

      - name: no_seats_available_on_assign_returns_422
        claim_type: Aggregate validation
        grounds: ["validations[priority=8]", "errors[ERR_NO_SEATS_AVAILABLE]", calculations.contract_seats_available]
        distinguishing_aspect: "Contract seat_count 1 already fully consumed; assigning a 2nd asset -> ERR_NO_SEATS_AVAILABLE."
        test_recipe:
          setup: ["SILVER contract seat_count 1 active; asset1 assigned (seats_available 0); asset2 UNMONITORED."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Nu", primary_contact_email: "n@nu.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${cid}", label: "S", address: "2 Rd" }
              as: ServiceManager
              captures: { sid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 1, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /assets"
              payload: { client_id: "${cid}", site_id: "${sid}", asset_type: "DESKTOP", hostname: "pc1" }
              as: ServiceManager
              captures: { a1: $.data.id }
            - call: "POST /assets/${a1}/assign-contract"
              payload: { contract_id: "${ctr}" }
              as: ServiceManager
            - call: "POST /assets"
              payload: { client_id: "${cid}", site_id: "${sid}", asset_type: "DESKTOP", hostname: "pc2" }
              as: ServiceManager
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /assets/${a2}/assign-contract"
              payload: { contract_id: "${ctr}" }
              as: ServiceManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_NO_SEATS_AVAILABLE; HTTP 422"]

      - name: empty_line_items_on_procurement_returns_422
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_EMPTY_LINE_ITEMS]"]
        distinguishing_aspect: "POST /procurement-orders with an empty line_items array -> ERR_EMPTY_LINE_ITEMS (422)."
        test_recipe:
          setup: ["Client active."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Xi", primary_contact_email: "x@xi.test", credit_limit_cents: 100000 }
              as: ServiceManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /procurement-orders"
              payload: { client_id: "${cid}", line_items: [] }
              as: AccountManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_EMPTY_LINE_ITEMS; HTTP 422"]

      - name: seat_adjustment_zero_delta_returns_422
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_SEAT_DELTA]"]
        distinguishing_aspect: "A seat adjustment with delta 0 -> ERR_INVALID_SEAT_DELTA (422)."
        test_recipe:
          setup: ["SILVER contract active; expected_contract_version captured."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Omi", primary_contact_email: "o@omi.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /contracts/${ctr}/seat-adjustments"
              payload: { delta: 0, effective_at: "2026-05-02T00:00:00Z", expected_contract_version: "${cv}" }
              as: ServiceManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_INVALID_SEAT_DELTA; HTTP 422"]

      - name: patch_window_end_before_start_returns_invalid_time_window
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_TIME_WINDOW]"]
        distinguishing_aspect: "POST /assets/{id}/patch-jobs with window_end <= window_start -> ERR_INVALID_TIME_WINDOW (400)."
        test_recipe:
          setup: ["SILVER contract active; asset ACTIVE."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Pi", primary_contact_email: "p@pi.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${cid}", label: "S", address: "3 Rd" }
              as: ServiceManager
              captures: { sid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /assets"
              payload: { client_id: "${cid}", site_id: "${sid}", asset_type: "SERVER", hostname: "s1" }
              as: ServiceManager
              captures: { aid: $.data.id }
            - call: "POST /assets/${aid}/assign-contract"
              payload: { contract_id: "${ctr}" }
              as: ServiceManager
