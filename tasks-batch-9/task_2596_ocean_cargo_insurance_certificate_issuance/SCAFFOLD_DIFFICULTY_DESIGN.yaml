  - rule_id: non_linear_state_machine
    instances:
      - name: certificate_transit_and_war_axes_advance_independently
        grounds:
          - state_machines.Certificate.status
          - state_machines.Certificate.war_cover_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Non-linearity by PARALLEL state dimensions on the Certificate row:
          `status` (DRAFT -> ISSUED -> TRANSIT_ENDED, the transit axis) and
          `war_cover_status` (PENDING -> ATTACHED -> TERMINATED -> REINSTATED,
          the political-risk axis, itself cyclic) move on their own triggers.
          Listing a port terminates war cover while the certificate stays
          ISSUED; reinstating war cover does not touch the transit axis; and
          confirming delivery ends transit while the war axis stays REINSTATED.
          The combined state (TRANSIT_ENDED, REINSTATED) is reachable, which a
          single-axis implementation cannot represent.
