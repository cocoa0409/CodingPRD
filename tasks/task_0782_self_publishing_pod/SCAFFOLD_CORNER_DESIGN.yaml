# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7 claims the §1.8 depth probe does not cover.
# Same seven-point per-instance contract as §1.8. Names are unique across the
# union of both design files.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_publisher_returns_all_fields
        claim_type: Creation
        grounds: [entities.Publisher, endpoints]
        distinguishing_aspect: "POST /publishers with name+email returns 201 with a server-minted id, reserve_held_cents==0, lifetime_paid_cents==0, status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id", rh: "$.data.reserve_held_cents", st: "$.data.status" }
          assert:
            - "HTTP 201"
            - "Publisher.${pub}.reserve_held_cents == 0"
            - "Publisher.${pub}.status == ACTIVE"

      - name: get_title_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Title", "errors[ERR_TITLE_NOT_FOUND]"]
        distinguishing_aspect: "GET /titles/{id} with an unknown UUID returns ERR_TITLE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /titles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "response data.error_id == ERR_TITLE_NOT_FOUND"

      - name: create_format_missing_format_type_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Format.fields.format_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /titles/{id}/formats without the required format_type returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["one publisher and title"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "T", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
          trigger:
            - call: "POST /titles/${title}/formats"
              payload: { trim_size: "6x9" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: publisher_payout_method_defaults_to_bank
        claim_type: Defaults
        grounds: [entities.Publisher.fields.payout_method]
        distinguishing_aspect: "Omitting payout_method on POST /publishers applies the default BANK."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id", pm: "$.data.payout_method" }
          assert:
            - "Publisher.${pub}.payout_method == BANK"

      - name: channel_invalid_channel_type_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.Channel.fields.channel_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /channels with channel_type outside {RETAIL,LIBRARY,DIRECT} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /channels"
              payload: { name: "BAD", channel_type: "WHOLESALE", supports_formats: ["PRINT"], distribution_discount_standard: 0.4, distribution_discount_expanded: 0.6, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "response data.error_id == ERR_INVALID_REQUEST"

  - section: state_machines
    instances:
      - name: validate_already_validated_asset_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.Asset.PENDING_to_VALIDATED", "errors[ERR_ASSET_INVALID_STATE]"]
        distinguishing_aspect: "Re-validating an already VALIDATED asset (not PENDING) returns ERR_ASSET_INVALID_STATE (409)."
        test_recipe:
          setup: ["publisher, title, print format, one INTERIOR asset already VALIDATED"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "T", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id" }
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "INTERIOR", file_ref: "s3://int.pdf", file_format: "PDF", declared_page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { a: "$.data.id" }
            - call: "POST /assets/${a}/validate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /assets/${a}/validate"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "response data.error_id == ERR_ASSET_INVALID_STATE"

      - name: pay_statement_before_issue_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.RoyaltyStatement.ISSUED_to_PAID", "errors[ERR_STATEMENT_INVALID_STATE]"]
        distinguishing_aspect: "POST /royalty-statements/{id}/pay while the statement is still ACCRUING (never ISSUED) returns ERR_STATEMENT_INVALID_STATE (409)."
        test_recipe:
          setup: ["publisher with an ACCRUING statement"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /publishers/${pub}/royalty-statements"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { stmt: "$.data.id" }
          trigger:
            - call: "POST /royalty-statements/${stmt}/pay"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "response data.error_id == ERR_STATEMENT_INVALID_STATE"

      - name: withdraw_non_live_distribution_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.DistributionRequest.LIVE_to_WITHDRAWN", "errors[ERR_DISTRIBUTION_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing a REQUESTED (not LIVE) distribution request returns ERR_DISTRIBUTION_INVALID_STATE (409)."
        test_recipe:
          setup: ["AMZ channel, publisher, title, PRINT format LOCKED with an ACTIVE US price, one REQUESTED distribution request"]
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "AMZ", channel_type: "RETAIL", supports_formats: ["PRINT","EBOOK"], ebook_high_rate: 0.70, ebook_low_rate: 0.35, ebook_rate_low_threshold_cents: 299, ebook_rate_high_threshold_cents: 999, delivery_fee_per_mb_cents: 15, distribution_discount_standard: 0.40, distribution_discount_expanded: 0.60, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { amz: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "T", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id" }
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "INTERIOR", file_ref: "s3://int.pdf", file_format: "PDF", declared_page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { aInt: "$.data.id" }
            - call: "POST /assets/${aInt}/validate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "COVER", file_ref: "s3://cov.jpg", file_format: "JPG", paper_type: "WHITE", declared_spine_mm: 11.44 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { aCov: "$.data.id" }
            - call: "POST /assets/${aCov}/validate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /formats/${fmt}/lock"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "GET /formats/${fmt}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { v: "$.data.version" }
            - call: "POST /formats/${fmt}/prices"
              payload: { expected_format_version: "${v}", channel_id: "${amz}", territory: "US", list_price_cents: 1500, effective_from: "2026-01-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /formats/${fmt}/distribution-requests"
              payload: { channel_id: "${amz}", territory: "US" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { dr: "$.data.id" }
          trigger:
            - call: "POST /distribution-requests/${dr}/withdraw"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "response data.error_id == ERR_DISTRIBUTION_INVALID_STATE"

  - section: calculations
    instances:
      - name: print_royalty_expanded_reach_variant_selection
        claim_type: Variant Selection
        grounds: [calculations.royalty_per_unit, entities.ChannelPrice.fields.expanded_reach]
        distinguishing_aspect: "With expanded_reach true the print variant uses the 0.60 expanded discount: royalty = round(1500*(1-0.60)-325) = 275, versus 575 at standard reach."
        test_recipe:
          setup: ["AMZ channel, publisher, title, PRINT format 200pg BW (print_cost 325)"]
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "AMZ", channel_type: "RETAIL", supports_formats: ["PRINT","EBOOK"], ebook_high_rate: 0.70, ebook_low_rate: 0.35, ebook_rate_low_threshold_cents: 299, ebook_rate_high_threshold_cents: 999, delivery_fee_per_mb_cents: 15, distribution_discount_standard: 0.40, distribution_discount_expanded: 0.60, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { amz: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "T", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /formats/${fmt}/prices"
              payload: { expected_format_version: "${v1}", channel_id: "${amz}", territory: "US", list_price_cents: 1500, effective_from: "2026-01-01T00:00:00Z", expanded_reach: true }
              as: Publisher
              as_user_id: "${pub}"
              captures: { price: "$.data.id", roy: "$.data.royalty_per_unit_cents" }
          assert:
            - "ChannelPrice.${price}.royalty_per_unit_cents == 275"

      - name: cover_spine_width_computed_from_page_count
        claim_type: Computed Fields
        grounds: [calculations.cover_spine_width, entities.Asset.fields.spine_width_mm]
        distinguishing_aspect: "Uploading a COVER asset with paper WHITE for a 200-page format computes spine_width_mm == 11.44 (200*0.0572), independent of any declared value."
        test_recipe:
          setup: ["publisher, title, PRINT format with page_count 200"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "T", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id" }
          trigger:
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "COVER", file_ref: "s3://cov.jpg", file_format: "JPG", paper_type: "WHITE", declared_spine_mm: 25.0 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { a: "$.data.id", spine: "$.data.spine_width_mm" }
          assert:
            - "Asset.${a}.spine_width_mm == 11.44"

      - name: cover_spine_mismatch_moves_asset_to_rejected
        claim_type: Correct Result
        grounds: ["state_machines.Asset.PENDING_to_VALIDATED", "entities.Asset.fields.rejection_reason", "errors[ERR_SPINE_MISMATCH]"]
        distinguishing_aspect: "Validating a COVER whose declared_spine_mm (25.0) differs from the computed 11.44 by more than 0.5mm returns HTTP 200 with status REJECTED and rejection_reason ERR_SPINE_MISMATCH."
        test_recipe:
          setup: ["publisher, title, PRINT format 200pg, one COVER asset PENDING with declared_spine_mm 25.0"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "T", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id" }
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "COVER", file_ref: "s3://cov.jpg", file_format: "JPG", paper_type: "WHITE", declared_spine_mm: 25.0 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { a: "$.data.id" }
          trigger:
            - call: "POST /assets/${a}/validate"
              payload: {}
              as: PlatformAdmin
              captures: { st: "$.data.status", rr: "$.data.rejection_reason" }
          assert:
            - "HTTP 200"
            - "Asset.${a}.status == REJECTED"
            - "Asset.${a}.rejection_reason == ERR_SPINE_MISMATCH"

  - section: validations
    instances:
      - name: assign_isbn_already_assigned_returns_not_available
        claim_type: Violation to Error
        grounds: ["validations[priority=6]", "errors[ERR_ISBN_NOT_AVAILABLE]"]
        distinguishing_aspect: "Assigning an ISBN that is already ASSIGNED to another format returns ERR_ISBN_NOT_AVAILABLE (409)."
        test_recipe:
          setup: ["publisher with one pool ISBN, two DRAFT print formats; the ISBN already assigned to the first"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /publishers/${pub}/isbns"
              payload: { isbn_13: "9780000000058" }
              as: PlatformAdmin
              captures: { isbn: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "T", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt1: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 180 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt2: "$.data.id" }
            - call: "POST /formats/${fmt1}/assign-isbn"
              payload: { isbn_id: "${isbn}" }
              as: Publisher
              as_user_id: "${pub}"
          trigger:
            - call: "POST /formats/${fmt2}/assign-isbn"
              payload: { isbn_id: "${isbn}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "response data.error_id == ERR_ISBN_NOT_AVAILABLE"

      - name: publish_without_isbn_returns_isbn_not_assigned
        claim_type: Violation to Error
        grounds: ["validations[priority=6]", "errors[ERR_ISBN_NOT_ASSIGNED]", "state_machines.Format.CONTENT_LOCKED_to_PUBLISHED"]
        distinguishing_aspect: "Publishing a CONTENT_LOCKED format with proof APPROVED but no ISBN assigned returns ERR_ISBN_NOT_ASSIGNED (409)."
        test_recipe:
          setup: ["publisher, title, PRINT format interior+cover VALIDATED, LOCKED, proof APPROVED, NO ISBN assigned"]
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "T", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id" }
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "INTERIOR", file_ref: "s3://int.pdf", file_format: "PDF", declared_page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { aInt: "$.data.id" }
            - call: "POST /assets/${aInt}/validate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /formats/${fmt}/assets"
              payload: { asset_type: "COVER", file_ref: "s3://cov.jpg", file_format: "JPG", paper_type: "WHITE", declared_spine_mm: 11.44 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { aCov: "$.data.id" }
            - call: "POST /assets/${aCov}/validate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /formats/${fmt}/lock"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /formats/${fmt}/proofs"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { proof: "$.data.id" }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
          trigger:
            - call: "POST /formats/${fmt}/publish"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "response data.error_id == ERR_ISBN_NOT_ASSIGNED"

      - name: price_out_of_bounds_returns_price_out_of_bounds
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_PRICE_OUT_OF_BOUNDS]"]
        distinguishing_aspect: "Creating a ChannelPrice with list_price_cents 50 (below the channel minimum 99) returns ERR_PRICE_OUT_OF_BOUNDS (422)."
        test_recipe:
          setup: ["AMZ channel (min 99), publisher, title, PRINT format"]
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "AMZ", channel_type: "RETAIL", supports_formats: ["PRINT","EBOOK"], ebook_high_rate: 0.70, ebook_low_rate: 0.35, ebook_rate_low_threshold_cents: 299, ebook_rate_high_threshold_cents: 999, delivery_fee_per_mb_cents: 15, distribution_discount_standard: 0.40, distribution_discount_expanded: 0.60, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { amz: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "T", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /formats/${fmt}/prices"
              payload: { expected_format_version: "${v1}", channel_id: "${amz}", territory: "US", list_price_cents: 50, effective_from: "2026-01-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "response data.error_id == ERR_PRICE_OUT_OF_BOUNDS"

      - name: price_on_unsupported_format_returns_channel_format_unsupported
        claim_type: Conditional validation
        grounds: ["validations[priority=7]", "errors[ERR_CHANNEL_FORMAT_UNSUPPORTED]", "entities.Channel.fields.supports_formats"]
        distinguishing_aspect: "Pricing an EBOOK format on the IGS channel (supports_formats [PRINT] only) returns ERR_CHANNEL_FORMAT_UNSUPPORTED (422)."
        test_recipe:
          setup: ["IGS channel (PRINT only), publisher, title, EBOOK format"]
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "IGS", channel_type: "LIBRARY", supports_formats: ["PRINT"], distribution_discount_standard: 0.53, distribution_discount_expanded: 0.53, returns_reserve_pct: 0.15, min_list_price_cents: 599, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { igs: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
