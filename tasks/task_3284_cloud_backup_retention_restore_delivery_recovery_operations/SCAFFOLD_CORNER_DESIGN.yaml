# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3284_cloud_backup_retention_restore_delivery_recovery_operations
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: account_create_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Account
          - endpoints.POST_/backup-provider/accounts
        distinguishing_aspect: "An account created with the three required fields comes back 201 with status ACTIVE, version 1, deposit_held_cents 0 and a server-minted UUID id that carries no type prefix — status and the ledger fields are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &clk
              call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - &acct
              call: "POST /backup-provider/accounts"
              payload: { name: "Northwind Personal", account_type: "PERSONAL", region: "US_WEST", storage_tier: "PLUS", encryption_key_id: "aes-256-key-personal", usage_gb: 0 }
              as: SystemOperator
              captures: { acct_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Account.${acct_id}.name == \"Northwind Personal\" and account_type == PERSONAL and region == US_WEST"
            - "Account.${acct_id}.status == ACTIVE and version == 1"
            - "Account.${acct_id}.deposit_held_cents == 0 and usage_gb == 0 and restore_download_gb == 0"
            - "Account.${acct_id}.id matches the bare UUID form ^[0-9a-f-]{36}$ with no type prefix"
            - "the response data carries non-null created_at and updated_at"

      - name: backup_set_get_returns_the_stored_configuration_unchanged
        claim_type: Retrieval
        grounds:
          - entities.BackupSet
          - endpoints.GET_/backup-provider/backup-sets/{id}
        distinguishing_aspect: "Every BackupSet configuration field round-trips through GET exactly as created: durability_class is preserved, state is PROVISIONING, is_initial_flush is false and retention_floor_utc is null until versions arrive."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a group, a RETENTION policy and one activated agent; the agent's backup set has just been provisioned."
          setup_api_calls:
            - *clk
            - *acct
            - &grp
              call: "POST /backup-provider/backup-groups"
              payload: { account_id: "${acct_id}", name: "Personal Laptops", tier: "STANDARD", retention_days_override: 45 }
              as: SystemOperator
              captures: { grp_id: $.data.id, grp_v: $.data.version }
            - &pol
              call: "POST /backup-provider/backup-groups/${grp_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: true, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - &agt
              call: "POST /backup-provider/agents"
              payload: { account_id: "${acct_id}", group_id: "${grp_id}", hostname: "nw-laptop-01", os_type: "MACOS", license_type: "PERSONAL", throttle_month: 202609 }
              as: BackupOperator
              captures: { agt_id: $.data.id }
            - &act
              call: "POST /backup-provider/agents/${agt_id}/activate"
              payload: {}
              as: BackupOperator
            - &setb
              call: "POST /backup-provider/backup-sets"
              payload: { agent_id: "${agt_id}", account_id: "${acct_id}", durability_class: "DEEP_ARCHIVE" }
              as: BackupOperator
              captures: { set_id: $.data.id }
          trigger:
            - call: "GET /backup-provider/backup-sets/${set_id}"
              payload: {}
              as: BackupOperator
              captures: { set_state: $.data.state, set_class: $.data.durability_class }
          assert:
            - "the response status is 200 and response_type is object"
            - "${set_state} == PROVISIONING"
            - "${set_class} == DEEP_ARCHIVE"
            - "BackupSet.${set_id}.is_initial_flush == false and version_chain_depth == 0"
            - "BackupSet.${set_id}.retention_floor_utc is null"
            - "BackupSet.${set_id}.agent_id == ${agt_id} and account_id == ${acct_id}"

      - name: agents_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/backup-provider/agents
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three agents on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a group, a policy and three installed agents."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - call: "POST /backup-provider/agents"
              payload: { account_id: "${acct_id}", group_id: "${grp_id}", hostname: "nw-laptop-02", os_type: "WINDOWS", license_type: "PERSONAL", throttle_month: 202609 }
              as: BackupOperator
            - call: "POST /backup-provider/agents"
              payload: { account_id: "${acct_id}", group_id: "${grp_id}", hostname: "nw-laptop-03", os_type: "LINUX", license_type: "PERSONAL", throttle_month: 202609 }
              as: BackupOperator
          trigger:
            - call: "GET /backup-provider/agents"
              payload: { account_id: "${acct_id}", limit: 2, offset: 0 }
              as: BackupOperator
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /backup-provider/agents?account_id=${acct_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /backup-provider/agents?account_id=${acct_id}&status=PENDING_AUTH returns 3 rows"
            - "GET /backup-provider/agents?account_id=${acct_id} with no limit defaults limit to 10 and offset to 0"

      - name: storage_pod_get_with_unknown_id_returns_storage_pod_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/backup-provider/storage-pods/{id}
          - errors.ERR_STORAGE_POD_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on a path segment produces the entity-specific 404 ERR_STORAGE_POD_NOT_FOUND, not a generic error and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No storage pod has been registered."
          setup_api_calls:
            - *clk
          trigger:
            - call: "GET /backup-provider/storage-pods/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SystemOperator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_STORAGE_POD_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: file_version_create_missing_content_hash_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.FileVersion.fields.content_hash
          - validations[priority=1]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "content_hash is a required input with no default, so omitting it entirely is a 400 ERR_INVALID_REQUEST, and no FileVersion row is persisted — it is not a 402 ERR_NO_CHANGE_DETECTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a group, policy, activated agent and a backup set in INITIAL_RUNNING."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - &fv_a1
              call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/archive.tar", version_number: 1, operation: "CREATE", size_bytes: 107374182400, content_hash: "sha256-arc-v1", event_utc: "2026-09-10T00:00:00Z" }
              as: BackupOperator
          trigger:
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/second.bin", version_number: 1, operation: "CREATE", size_bytes: 1024, event_utc: "2026-09-11T00:00:00Z" }
              as: BackupOperator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /backup-provider/backup-sets/${set_id}/file-versions returns exactly 1 row"
            - "BackupSet.${set_id}.version_chain_depth == 1 (the rejected version did not advance the chain)"

      - name: account_create_omitting_storage_tier_defaults_to_basic
        claim_type: Defaults
        grounds:
          - entities.Account.fields.storage_tier
          - calculations.storage_charge_cents
        distinguishing_aspect: "storage_tier declares a default of BASIC, so omitting it stores BASIC rather than null, and a billing period closed against the account uses the 6-cents-per-GB BASIC rate rather than the 4-cents PRO rate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An account created without storage_tier, holding a 10 GB live file."
          setup_api_calls:
            - *clk
            - call: "POST /backup-provider/accounts"
              payload: { name: "Northwind Default", account_type: "PERSONAL", region: "US_EAST", encryption_key_id: "aes-256-key-default", usage_gb: 0 }
              as: SystemOperator
              captures: { acct_d_id: $.data.id }
            - call: "POST /backup-provider/backup-groups"
              payload: { account_id: "${acct_d_id}", name: "Default Group", tier: "STANDARD" }
              as: SystemOperator
              captures: { grp_d_id: $.data.id }
            - call: "POST /backup-provider/backup-groups/${grp_d_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: true, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - call: "POST /backup-provider/agents"
              payload: { account_id: "${acct_d_id}", group_id: "${grp_d_id}", hostname: "nw-laptop-09", os_type: "LINUX", license_type: "PERSONAL", throttle_month: 202609 }
              as: BackupOperator
              captures: { agt_d_id: $.data.id }
            - call: "POST /backup-provider/agents/${agt_d_id}/activate"
              payload: {}
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets"
              payload: { agent_id: "${agt_d_id}", account_id: "${acct_d_id}", durability_class: "STANDARD" }
              as: BackupOperator
              captures: { set_d_id: $.data.id }
            - call: "POST /backup-provider/backup-sets/${set_d_id}/file-versions"
              payload: { file_path: "/home/u/ten.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-ten-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_d_id}/complete-initial"
              payload: {}
              as: BackupOperator
          trigger:
            - call: "GET /backup-provider/accounts/${acct_d_id}"
              payload: {}
              as: SystemOperator
              captures: { acct_d_tier: $.data.storage_tier }
            - call: "POST /backup-provider/billing-periods"
              payload: { account_id: "${acct_d_id}", period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z", restore_active_days: 0 }
              as: SystemOperator
              captures: { bp_d_id: $.data.id }
            - call: "POST /backup-provider/billing-periods/${bp_d_id}/close"
              payload: {}
              as: SystemOperator
              captures: { bp_d_fee: $.data.storage_fee_cents }
          assert:
            - "${acct_d_tier} == BASIC (the declared default was applied, not null)"
            - "BillingPeriod.${bp_d_id}.usage_gb_avg == 10.0"
            - "${bp_d_fee} == 60 (10 GB at the 6-cent BASIC rate, gross 60 minus the 60-cent one-time credit)"
            - "${bp_d_fee} != 40"

      - name: backup_set_storage_gb_is_computed_on_read_and_never_stored
        claim_type: Computed Fields
        grounds:
          - entities.BackupSet.fields.storage_gb
          - calculations.account_usage_gb
          - endpoints.GET_/backup-provider/backup-sets/{id}
        distinguishing_aspect: "storage_gb is derived from the live FileVersion sizes divided by GB_BYTES on every read: two 50 GB CREATEs make it 100.0, and a later MODIFY that enlarges one file to 80 GB makes it 130.0 with no write to BackupSet itself beyond the version bump."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with an ACTIVE set holding two 50 GB files."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/a.bin", version_number: 1, operation: "CREATE", size_bytes: 53687091200, content_hash: "sha256-a-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/b.bin", version_number: 1, operation: "CREATE", size_bytes: 53687091200, content_hash: "sha256-b-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
          trigger:
            - call: "GET /backup-provider/backup-sets/${set_id}"
              payload: {}
              as: BackupOperator
              captures: { sg_before: $.data.storage_gb }
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/a.bin", version_number: 2, operation: "MODIFY", size_bytes: 85899345920, content_hash: "sha256-a-v2", event_utc: "2026-09-03T00:00:00Z" }
              as: BackupOperator
            - call: "GET /backup-provider/backup-sets/${set_id}"
              payload: {}
              as: BackupOperator
              captures: { sg_after: $.data.storage_gb }
          assert:
            - "${sg_before} == 100.0"
            - "${sg_after} == 130.0"
            - "Account.${acct_id}.usage_gb == 130.0"
            - "Account.${acct_id}.peak_usage_gb == 130.0"

      - name: file_version_create_client_supplied_identity_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.FileVersion.fields.id
          - entities.FileVersion.fields.recoverable_until_utc
          - endpoints.POST_/backup-provider/backup-sets/{id}/file-versions
        distinguishing_aspect: "FileVersion is a common_fields:false log entity, so it carries id and created_at and no version field: a client that fabricates a UUID id is ignored, the row is persisted under a server-minted UUID, and recoverable_until_utc is stamped from event_utc plus the group window (45 days)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with an ACTIVE-capable set in INITIAL_RUNNING."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
          trigger:
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/ignored.bin", version_number: 1, operation: "CREATE", size_bytes: 1024, content_hash: "sha256-ign-v1", event_utc: "2026-09-10T00:00:00Z", version: 99, id: "00000000-0000-4000-8000-0000000000ff" }
              as: BackupOperator
              captures: { fv_ign_id: $.data.id }
          assert:
            - "the response status is 201"
            - "FileVersion.${fv_ign_id}.id != \"00000000-0000-4000-8000-0000000000ff\""
            - "FileVersion.${fv_ign_id}.is_deleted == false and is_expired == false"
            - "FileVersion.${fv_ign_id}.recoverable_until_utc == 2026-10-25T00:00:00Z (2026-09-10 plus the 45-day group retention override)"
            - "FileVersion.${fv_ign_id}.version_number == 1"

      - name: agent_create_with_out_of_enum_os_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Agent.fields.os_type
          - validations[priority=1]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "os_type is a closed enum of WINDOWS, MACOS and LINUX; a value such as SOLARIS is rejected at the request-validation layer with 400 ERR_INVALID_REQUEST rather than being silently stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a group and a policy."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
          trigger:
            - call: "POST /backup-provider/agents"
              payload: { account_id: "${acct_id}", group_id: "${grp_id}", hostname: "nw-bad-os", os_type: "SOLARIS", license_type: "PERSONAL", throttle_month: 202609 }
              as: BackupOperator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /backup-provider/agents?account_id=${acct_id} returns 0 rows and no Agent was persisted"
            - "BackupGroup.${grp_id}.agent_count == 0"

      - name: backup_set_create_with_unknown_agent_returns_agent_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.BackupSet.fields.agent_id
          - validations[priority=3]
          - errors.ERR_AGENT_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "agent_id is checked before account_id in the endpoint's declared input order: with both ids unknown the answer is ERR_AGENT_NOT_FOUND, and no BackupSet row is created under the flat topology."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *clk
          trigger:
            - call: "POST /backup-provider/backup-sets"
              payload: { agent_id: "00000000-0000-4000-8000-000000000001", account_id: "00000000-0000-4000-8000-000000000002", durability_class: "STANDARD" }
              as: BackupOperator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_AGENT_NOT_FOUND"
            - "error_id != ERR_ACCOUNT_NOT_FOUND"
            - "GET /backup-provider/backup-sets returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: backup_set_starts_in_provisioning_before_any_version
        claim_type: Initial State
        grounds:
          - state_machines.BackupSet.initial_state
          - entities.BackupSet.fields.state
        distinguishing_aspect: "A freshly provisioned set is PROVISIONING, not INITIAL_RUNNING — the throttled initial backup does not begin until the first non-DELETE version arrives."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a policy and an activated agent."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
          trigger:
            - call: "POST /backup-provider/backup-sets"
              payload: { agent_id: "${agt_id}", account_id: "${acct_id}", durability_class: "STANDARD" }
              as: BackupOperator
              captures: { set_new_id: $.data.id, set_new_state: $.data.state }
          assert:
            - "the response status is 201"
            - "${set_new_state} == PROVISIONING"
            - "BackupSet.${set_new_id}.is_initial_flush == false"
            - "Agent.${agt_id}.in_throttle_window == false"

      - name: complete_initial_from_provisioning_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BackupSet.PROVISIONING_to_INITIAL_RUNNING
          - state_machines.BackupSet.INITIAL_RUNNING_to_ACTIVE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "complete-initial is only valid from INITIAL_RUNNING; called against a still-PROVISIONING set it is rejected and the set keeps state PROVISIONING with is_initial_flush false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a policy, an activated agent and a set left in PROVISIONING."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
          trigger:
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "BackupSet.${set_id}.state == PROVISIONING"
            - "BackupSet.${set_id}.is_initial_flush == false"

      - name: retention_change_apply_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RetentionChangeRequest.SUBMITTED_to_COOLING_OFF
          - state_machines.RetentionChangeRequest.COOLING_OFF_to_APPLIED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "apply is reachable only from COOLING_OFF; applied directly to a SUBMITTED request it is rejected and the group retention is untouched — the cooling-off stage cannot be skipped."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a group whose policy sets min_retention_days 10 and max_extended_history_days 800."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - call: "POST /backup-provider/retention-change-requests"
              payload: { account_id: "${acct_id}", group_id: "${grp_id}", requested_retention_days: 120, reason_code: "UPGRADE", expected_group_version: "${grp_v}" }
              as: RetentionOfficer
              captures: { rcr_skip_id: $.data.id }
          trigger:
            - call: "POST /backup-provider/retention-change-requests/${rcr_skip_id}/apply"
              payload: {}
              as: RetentionOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "RetentionChangeRequest.${rcr_skip_id}.state == SUBMITTED"
            - "BackupGroup.${grp_id}.group_retention_days == 45"

      - name: restore_request_completed_state_has_no_outgoing_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.RestoreRequest.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "COMPLETED is terminal: neither reverse (valid only from READY) nor cancel (valid only from REQUESTED or VALIDATING) is accepted once the restore has completed and its egress has accrued."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-04T00:00:00Z. PERSONAL account with an ACTIVE set holding a 10 GB file and one restore already completed."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/small.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-s-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { acct_v_c: $.data.version }
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}", subject_agent_id: "${agt_id}", restore_point_in_utc: "2026-09-03T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 10.0, restore_transaction_count: 0, requester_mfa_ticket: "mfa-ticket-c1", expected_account_version: "${acct_v_c}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { rr_c_id: $.data.id }
            - call: "POST /backup-provider/restore-requests/${rr_c_id}/validate"
              payload: { requester_mfa_ticket: "mfa-ticket-c1" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /backup-provider/restore-requests/${rr_c_id}/begin"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /backup-provider/restore-requests/${rr_c_id}/prepare"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /backup-provider/restore-requests/${rr_c_id}/complete"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /backup-provider/restore-requests/${rr_c_id}/reverse"
              payload: {}
              as: SystemOperator
              captures: { err_reverse: $.data.error_id }
            - call: "POST /backup-provider/restore-requests/${rr_c_id}/cancel"
