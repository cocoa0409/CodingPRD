  # --- Test-driving clock (platform endpoint, outside api_prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default before any call is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. The new time must be strictly greater than the current value (ERR_CLOCK_REGRESSION). Setting the clock fires every time-based transition: JD expiry checks become effective, published notices close when the comment period has fully elapsed, DUE monitoring reports flip to OVERDUE, reports more than 60 days overdue suspend their permit and auto-open a MONITORING_BREACH enforcement case, unexpired permits past expiration_date flip to EXPIRED (defaulting ACTIVE plans), and RESTORATION-track cases past deadline flip to DEFAULTED."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all time-based auto-transitions fire in this pinned evaluation order: (1) notices PUBLISHED -> COMMENT_PERIOD_CLOSED; (2) permits ISSUED or ACTIVE past expiration_date -> EXPIRED, with ACTIVE plans -> DEFAULTED; (3) reports DUE -> OVERDUE only for permits still ACTIVE; (4) breach suspension: reports OVERDUE strictly past due_date + 60 days on ACTIVE permits -> permit SUSPENDED + MONITORING_BREACH case created; (5) RESTORATION-track cases past deadline -> DEFAULTED"]

# =============================================================================
# §1.6 Error Code Catalog (56 codes)
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Applicant-role caller's X-User-ID does not own the target resource" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "render-decision by the screening reviewer, or confirm-violation by the case-opening officer" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, out-of-range number, malformed impacts array, missing conditional field (general_permit_code, enforcement_case_id, stewardship_entity_name, new_jd_id, deficiency_notes)" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "No Applicant with the given id" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "No WatersSite with the given id" }
  - { id: ERR_JD_NOT_FOUND, http: 404, condition: "No JurisdictionalDetermination with the given id" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "No Appeal with the given id" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "No PermitApplication with the given id" }
  - { id: ERR_AA_NOT_FOUND, http: 404, condition: "No AlternativesAnalysis with the given id" }
  - { id: ERR_COMMENT_NOT_FOUND, http: 404, condition: "No AgencyComment with the given id" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "No MitigationPlan with the given id" }
  - { id: ERR_BANK_NOT_FOUND, http: 404, condition: "No MitigationBank with the given id" }
  - { id: ERR_CREDIT_TXN_NOT_FOUND, http: 404, condition: "No CreditTransaction with the given id" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "No Permit with the given id" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "No MonitoringReport with the given id" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "No EnforcementCase with the given id" }
  - { id: ERR_JD_INVALID_STATE, http: 409, condition: "JD not in the state the operation requires (issue requires DRAFT; appeal and submit require ISSUED)" }
  - { id: ERR_APPEAL_INVALID_STATE, http: 409, condition: "Appeal is not FILED" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Application not in a state from which the invoked transition is defined" }
  - { id: ERR_AA_INVALID_STATE, http: 409, condition: "AlternativesAnalysis not in the required state (review requires SUBMITTED; PATCH requires REVISION_REQUESTED; create requires application ALTERNATIVES_REVIEW)" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "MitigationPlan not in the required state (submit requires DRAFT; review requires SUBMITTED; secure/pay require APPROVED with matching mechanism; credit-transaction creation requires APPROVED)" }
  - { id: ERR_CREDIT_TXN_INVALID_STATE, http: 409, condition: "CreditTransaction not in the required state (purchase/release require RESERVED)" }
  - { id: ERR_PERMIT_INVALID_STATE, http: 409, condition: "Permit not in the required state (commence requires ISSUED; reinstate requires SUSPENDED; close requires ACTIVE)" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "MonitoringReport not in the required state (submit requires DUE/OVERDUE/DEFICIENT; review requires SUBMITTED)" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "EnforcementCase not in the required state, wrong resolution track for the operation, or ATF linkage broken" }
  - { id: ERR_BANK_NOT_OPERATIONAL, http: 409, condition: "Bank not OPERATIONAL for reservation or not in a valid state for approve/suspend" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_application_version / expected_plan_version does not equal the entity's current version" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc to a value not strictly greater than the current logical clock" }
  - { id: ERR_JD_NOT_APPEALABLE, http: 422, condition: "Appeal attempted on a PRELIMINARY JD" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal filed more than 60 days after jd.issued_date" }
  - { id: ERR_JD_EXPIRED, http: 409, condition: "Referenced JD's expiration_date is before the current clock at submit" }
  - { id: ERR_COMMENT_PERIOD_CLOSED, http: 422, condition: "Agency comment filed while the application's notice_status is not PUBLISHED" }
  - { id: ERR_NOTICE_PERIOD_STILL_OPEN, http: 422, condition: "advance-to-decision attempted before the comment period has fully elapsed" }
  - { id: ERR_GENERAL_PERMIT_INELIGIBLE, http: 422, condition: "General pathway but code not in {NWP-29, NWP-39}, total impact > 0.50 acres, or a disallowed resource type" }
  - { id: ERR_LEDPA_NOT_DEMONSTRATED, http: 422, condition: "AA accept without demonstrated avoidance, at least 2 minimization steps, and a PROPOSED_IS_LEDPA conclusion" }
  - { id: ERR_PUBLIC_INTEREST_UNFAVORABLE, http: 422, condition: "render-decision ISSUE on an individual pathway with pir_outcome UNFAVORABLE" }
  - { id: ERR_JD_NOT_JURISDICTIONAL, http: 422, condition: "Submit with a JD whose determination is NON_JURISDICTIONAL" }
  - { id: ERR_AA_NOT_ACCEPTED, http: 422, condition: "Plan creation or notice publication before the alternatives analysis is ACCEPTED" }
  - { id: ERR_UNRESOLVED_AGENCY_OBJECTIONS, http: 422, condition: "advance-to-decision with a SUBSTANTIVE_OBJECTION comment still FILED" }
  - { id: ERR_ACTIVE_JD_EXISTS, http: 409, condition: "Another JD of the same site is ISSUED and unexpired" }
  - { id: ERR_APPEAL_ALREADY_FILED, http: 409, condition: "An appeal already exists for this JD" }
  - { id: ERR_AA_ALREADY_EXISTS, http: 409, condition: "The application already has an AlternativesAnalysis" }
  - { id: ERR_NOTICE_ALREADY_PUBLISHED, http: 409, condition: "The application's notice_status is not NONE" }
  - { id: ERR_ACTIVE_PLAN_EXISTS, http: 409, condition: "The application already has a MitigationPlan in a non-terminal status" }
  - { id: ERR_OUT_OF_SERVICE_AREA, http: 422, condition: "Bank state_code differs from the site state_code" }
  - { id: ERR_COVERAGE_INTERVAL_CONFLICT, http: 409, condition: "Monitoring coverage breaks zero-gap contiguity or overlaps a sibling report" }
  - { id: ERR_EXTENSION_ALREADY_USED, http: 409, condition: "grant-extension when extension_used is already true" }
  - { id: ERR_INSUFFICIENT_CREDIT_INVENTORY, http: 422, condition: "Requested credits exceed the bank's available_credits_by_type for the resource type" }
  - { id: ERR_CREDITS_NOT_SECURED, http: 422, condition: "Purchased credits below the final per-type requirement at secure-credits" }
  - { id: ERR_INSUFFICIENT_FINANCIAL_ASSURANCE, http: 422, condition: "financial_assurance_dollars below the required amount, or stewardship not secured, at secure-credits" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "pay-in-lieu-fee amount_dollars does not equal ilf_fee_due_dollars" }
  - { id: ERR_MITIGATION_NOT_SECURED, http: 422, condition: "render-decision ISSUE while compensatory_mitigation_required and no plan is CREDITS_SECURED" }
  - { id: ERR_REPORTS_OVERDUE_EXIST, http: 422, condition: "Permit reinstate while any of its reports is OVERDUE" }
  - { id: ERR_MONITORING_INCOMPLETE, http: 422, condition: "Permit close before 5 ACCEPTED reports and a COMPLETED plan" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; provisions applicants, sites, and mitigation banks; drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /wetland-permits/applicants"
      - "POST /wetland-permits/sites"
      - "POST /wetland-permits/mitigation-banks"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: Applicant
    description: "Permit seeker; owns sites, applications, alternatives analyses, mitigation plans, credit transactions, appeals, monitoring submissions, and work commencement"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /wetland-permits/applications, PATCH, submit, withdraw"
      - "POST /wetland-permits/alternatives-analyses, PATCH"
      - "POST /wetland-permits/mitigation-plans, PATCH, submit, secure-credits, pay-in-lieu-fee"
      - "POST /wetland-permits/credit-transactions, purchase, release"
      - "POST /wetland-permits/appeals"
      - "POST /wetland-permits/permits/{id}/commence-work"
      - "POST /wetland-permits/monitoring-reports/{id}/submit"
    shared_operations:
      - "All GET endpoints (applicant-owned resources only where ownership applies)"
  - name: Reviewer
    description: "Corps project manager; drafts JDs, screens applications, reviews alternatives analyses and mitigation plans, resolves agency comments, reviews monitoring reports"
    identity: opaque
    exclusive_operations:
      - "POST /wetland-permits/jurisdictional-determinations"
      - "POST /wetland-permits/applications/{id}/screening"
      - "POST /wetland-permits/applications/{id}/publish-notice"
      - "POST /wetland-permits/applications/{id}/advance-to-decision"
      - "POST /wetland-permits/alternatives-analyses/{id}/review"
      - "POST /wetland-permits/mitigation-plans/{id}/review"
      - "POST /wetland-permits/agency-comments/{id}/resolve"
      - "POST /wetland-permits/monitoring-reports/{id}/review"
    shared_operations:
      - "All GET endpoints"
  - name: DistrictEngineer
    description: "Decision authority; issues JDs, decides appeals, approves and suspends banks, renders permit decisions, reinstates and closes permits, grants restoration extensions"
    identity: opaque
    exclusive_operations:
      - "POST /wetland-permits/jurisdictional-determinations/{id}/issue"
      - "POST /wetland-permits/appeals/{id}/decide"
      - "POST /wetland-permits/mitigation-banks/{id}/approve and suspend"
      - "POST /wetland-permits/applications/{id}/render-decision"
      - "POST /wetland-permits/permits/{id}/reinstate and close"
      - "POST /wetland-permits/enforcement-cases/{id}/grant-extension"
    shared_operations:
      - "All GET endpoints"
  - name: AgencyReviewer
    description: "Cooperating agency reviewer (EPA, FWS, NMFS, state water quality, tribal); files comments during open comment periods"
    identity: opaque
    exclusive_operations:
      - "POST /wetland-permits/agency-comments"
    shared_operations:
      - "All GET endpoints"
  - name: EnforcementOfficer
    description: "Compliance and enforcement officer; opens and confirms cases (never both on the same case), sets resolution tracks, verifies restoration"
    identity: opaque
    exclusive_operations:
      - "POST /wetland-permits/enforcement-cases"
      - "POST /wetland-permits/enforcement-cases/{id}/confirm-violation"
      - "POST /wetland-permits/enforcement-cases/{id}/set-resolution"
      - "POST /wetland-permits/enforcement-cases/{id}/verify-restoration"
    shared_operations:
      - "All GET endpoints"
