scaffold_corner_design:
  - section: entities
    instances:
      - name: integrator_org_creation_and_defaults
        claim_type: creation_and_defaults
        grounds: [entities.IntegratorOrg, "endpoints[POST /robotics/integrator-orgs]"]
        distinguishing_aspect: "POST with all required fields returns 201 and server-minted id, created_at, updated_at, version==1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "Acme Integration", brand_specialization: "DUAL", retention_rate_bps: 1500, default_pl_category_target: "PLe" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id, org_version: $.data.version }
          trigger:
            - call: "GET /robotics/integrator-orgs/${org_id}"
              payload: {}
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
          assert:
            - "org_version == 1"
            - "GET returns legal_name == 'Acme Integration', brand_specialization == DUAL, retention_rate_bps == 1500"
            - "response envelope has meta.api_request_id and response_type == 'object'"

      - name: cell_project_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.CellProject, "validations[priority=18]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting contract_value_cents (required input, no default) on project creation yields ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["org + site exist"]
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "Acme", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "S1", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-MISS", contracted_cycle_time_s: 10.0, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: get_nonexistent_project_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed UUID that does not exist returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB except nothing needed"]
          setup_api_calls: []
          trigger:
            - call: "GET /robotics/cell-projects/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: list_projects_pagination_envelope
        claim_type: listing_pagination
        grounds: [response_envelope, "endpoints[GET /robotics/customer-sites/{id}/cell-projects]"]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["site with 3 projects"]
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "Acme", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "S2", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-A", contracted_cycle_time_s: 10.0, contract_value_cents: 100000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-B", contracted_cycle_time_s: 10.0, contract_value_cents: 100000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-C", contracted_cycle_time_s: 10.0, contract_value_cents: 100000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
          trigger:
            - call: "GET /robotics/customer-sites/${site_id}/cell-projects"
              payload: { limit: 2, offset: 0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
          assert:
            - "response.data is an array of length 2"
            - "response contains total_count == 3 and has_more == true"

      - name: computed_field_ignores_client_input
        claim_type: computed_fields
        grounds: [entities.CellProject.fields.retention_balance_cents]
        distinguishing_aspect: "retention_balance_cents is computed from org retention rate; a client-supplied value on create is ignored and the server value (1000000*1000/10000 = 100000) is stored."
        test_recipe:
          setup: ["org with retention_rate_bps=1000; site"]
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "Acme", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "S3", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-COMP", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { bal: $.data.retention_balance_cents }
          assert:
            - "bal == 100000"

      - name: retention_ledger_entry_has_no_version_field
        claim_type: immutability
        grounds: [entities.RetentionLedgerEntry]
        distinguishing_aspect: "RetentionLedgerEntry declares common_fields: false — its response has id and created_at but no version field and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["project created (posts initial WITHHOLD entry)"]
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "Acme", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "S4", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-IMM", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "GET /robotics/cell-projects/${proj_id}/retention-ledger-entries"
              payload: {}
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
          assert:
            - "first ledger entry JSON has keys id, created_at but no version and no updated_at"
            - "first ledger entry entry_type == WITHHOLD and amount_cents == 100000"

  - section: state_machines
    instances:
      - name: project_initial_state_draft_and_terminal_lockdown
        claim_type: initial_and_terminal_state
        grounds: [state_machines.CellProject]
        distinguishing_aspect: "New CellProject starts DRAFT; from TERMINATED no further transition (e.g. advance) is possible."
        test_recipe:
          setup: ["project created, then terminated (retention balance zeroed first via PENALTY posted atomically by terminate when balance nonzero is allowed only outside GUARANTEE; here use fresh DRAFT project with balance — terminate posts compensating PENALTY)"]
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "Acme", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "S5", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-INIT", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id, init_status: $.data.status }
            - call: "POST /robotics/cell-projects/${proj_id}/terminate"
              payload: {}
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { term_status: $.data.status }
            - call: "GET /robotics/cell-projects/${proj_id}"
              payload: {}
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { v_term: $.data.version }
          trigger:
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${v_term}" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
          assert:
            - "init_status == DRAFT"
            - "term_status == TERMINATED"
            - "advance from TERMINATED fails ERR_INVALID_STATE 409"

      - name: hold_resume_roundtrip_restores_prior_status
        claim_type: valid_transition_with_side_effects
        grounds: [state_machines.CellProject.ON_HOLD]
        distinguishing_aspect: "hold captures the current status and sets hold_reason; resume restores exactly that status and clears hold_reason."
        test_recipe:
          setup: ["project in STUDY"]
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "Acme", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "S6", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-HOLD", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id, v0: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${v0}" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
          trigger:
            - call: "POST /robotics/cell-projects/${proj_id}/hold"
              payload: { hold_reason: "supply delay" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { held_status: $.data.status, held_reason: $.data.hold_reason }
            - call: "POST /robotics/cell-projects/${proj_id}/resume"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { resumed_status: $.data.status, resumed_reason: $.data.hold_reason }
          assert:
            - "held_status == ON_HOLD and held_reason == 'supply delay'"
            - "resumed_status == STUDY and resumed_reason == null"

      - name: program_release_without_sim_pass_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RobotProgram, "validations[priority=19]"]
        distinguishing_aspect: "release requires sim_status == SIM_PASSED; releasing a PEER_REVIEWED program whose sim is UNSIMULATED fails."
        test_recipe:
          setup: ["project in DESIGN; program CODED then PEER_REVIEWED, never simulated"]
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "Acme", brand_specialization: "ABB", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Safety Lead", user_role: "SAFETY_LEAD" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { sl_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Prog One", user_role: "CONTROLS_PROGRAMMER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { p1: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Prog Two", user_role: "CONTROLS_PROGRAMMER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { p2: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "S7", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-PRE", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id, v0: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${v0}" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { v1: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/application-studies"
              payload: { expected_project_version: "${v1}", sim_cycle_time_s: 9.0, sim_confidence_pct: 100.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { st: $.data.id }
            - call: "POST /robotics/application-studies/${st}/submit"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/application-studies/${st}/approve"
              payload: {}
              as: SafetyLead
              as_user_id: "${sl_id}"
            - call: "POST /robotics/cell-projects/${proj_id}/safety-risk-assessments"
              payload: { risk_score_pre_mitigation: 100, pl_target: "PLc", fencing_length_m: 15.0, light_curtain_zones: 1, muting_required: false }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { sra: $.data.id }
            - call: "POST /robotics/safety-risk-assessments/${sra}/submit"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/safety-risk-assessments/${sra}/approve"
              payload: {}
              as: SafetyLead
              as_user_id: "${sl_id}"
            - call: "GET /robotics/cell-projects/${proj_id}"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { v2: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${v2}" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/cell-projects/${proj_id}/robot-programs"
              payload: { program_name: "NS" }
              as: ControlsProgrammer
              as_user_id: "${p1}"
              captures: { rp: $.data.id }
            - call: "POST /robotics/robot-programs/${rp}/code-complete"
              payload: {}
              as: ControlsProgrammer
              as_user_id: "${p1}"
            - call: "POST /robotics/robot-programs/${rp}/peer-review"
              payload: {}
              as: ControlsProgrammer
              as_user_id: "${p2}"
          trigger:
            - call: "POST /robotics/robot-programs/${rp}/release"
              payload: {}
              as: ControlsProgrammer
              as_user_id: "${p1}"
          assert:
            - "response error_id == ERR_INVALID_STATE (sim_status UNSIMULATED != SIM_PASSED)"

      - name: safety_assessment_reject_revise_loop
        claim_type: cyclic_transition
        grounds: [state_machines.SafetyRiskAssessment.REJECTED_to_DRAFT]
        distinguishing_aspect: "REJECTED assessment can be revised back to DRAFT with assessment_revision incremented; terminal SUPERSEDED occurs only via SAT-fail cascade."
        test_recipe:
          setup: ["project in STUDY; assessment submitted then rejected"]
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "Acme", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Safety Lead", user_role: "SAFETY_LEAD" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { sl_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "S8", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-REV", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id, v0: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${v0}" }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/cell-projects/${proj_id}/safety-risk-assessments"
              payload: { risk_score_pre_mitigation: 100, pl_target: "PLc", fencing_length_m: 15.0, light_curtain_zones: 1, muting_required: false }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { sra: $.data.id }
            - call: "POST /robotics/safety-risk-assessments/${sra}/submit"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/safety-risk-assessments/${sra}/reject"
              payload: {}
              as: SafetyLead
              as_user_id: "${sl_id}"
          trigger:
            - call: "POST /robotics/safety-risk-assessments/${sra}/revise"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { rev_status: $.data.status, rev_n: $.data.assessment_revision }
          assert:
            - "rev_status == DRAFT and rev_n == 2"

      - name: terminate_cascades_children_to_terminal
        claim_type: cascade_down
        grounds: [state_machines.CellProject."any non-terminal"_to_TERMINATED]
        distinguishing_aspect: "Terminating a project cancels non-terminal children: SCHEDULED training session -> CANCELLED, QUOTED spare package -> terminal (SUPERSEDED excluded; QUOTED moves to its terminal), DRAFT study -> terminal, ACTIVE maintenance plan -> CLOSED."
        test_recipe:
          setup: ["project in STUDY with a DRAFT study and a SCHEDULED training session... training sessions require project TRAINING state only at start; creation allowed any time"]
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "Acme", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
