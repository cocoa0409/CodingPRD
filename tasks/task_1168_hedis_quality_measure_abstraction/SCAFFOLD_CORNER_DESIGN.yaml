            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id" } }
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a1: $.data.id, owner: $.data.abstractor_user_id } }
          trigger:
            - { call: "POST /hedis/abstractions/${a1}/submit", as: Abstractor, as_user_id: "abs-2", captures: { err: $.data.error_id } }
          assert:
            - "owner == 'abs-1' and err == 'ERR_INSUFFICIENT_PERMISSIONS'"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_spec_load_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[spec-load-stale-season]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Spec load OCC: after spec #1 bumps the season version to 2, a second load carrying the pre-load observed version (1) is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["season created (version 1); spec BCS loaded with expected_season_version == 1 (season now version 2)"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { sp1: $.data.id }
          trigger:
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_STALE_VERSION' — the client never re-read the season after the first load bumped its version"

      - name: occ_stale_compute_rate_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[compute-rate-stale-run]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "compute-rate OCC: the version captured at run creation (1) is stale after identify-population bumped the run to 2; the recomputation is rejected with 412."
        test_recipe:
          setup: ["ADMIN fixture: run created (v1 captured), identify-population done (run now v2)"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id, v_create: $.data.version } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
          trigger:
            - { call: "POST /hedis/measure-runs/${run_id}/compute-rate", payload: { expected_measure_run_version: "${v_create}" }, as: QualityAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "v_create == 1"
            - "err == 'ERR_STALE_VERSION' — identify-population advanced the run to version 2"

      - name: occ_spec_load_success_increments_season_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[spec-load-stale-season]"
          - "endpoints.POST /hedis/measure-specifications"
        distinguishing_aspect: "Happy path: a spec load carrying the current season version succeeds (201) and increments the season version by exactly 1 (1 -> 2)."
        test_recipe:
          setup: ["season created (version 1)"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
          trigger:
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { sp: $.data.id, sp_st: $.data.status }
            - { call: "GET /hedis/seasons/${season_id}", as: QualityAdmin, captures: { v_after: $.data.version } }
          assert:
            - "sp_st == 'LOADED'"
            - "season_v == 1 and v_after == 2 — exactly one increment per successful load"

      - name: default_logical_clock_accepts_predeadline_submit
        claim_type: scheduled_actions
        grounds:
          - "endpoints.POST /hedis/_clock/set_current_utc"
          - "validations[priority=9]"
        distinguishing_aspect: "Without any set_current_utc call the logical clock is exactly 2026-05-01T00:00:00Z (the pinned startup default, never wall clock): a season with deadline 2026-06-15 accepts a submit."
        test_recipe:
          setup: ["NO clock call is made anywhere in this fixture; season deadline 2026-06-15; ADMIN run RATE_COMPUTED"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { v1: $.data.version } }
            - { call: "POST /hedis/measure-runs/${run_id}/compute-rate", payload: { expected_measure_run_version: "${v1}" }, as: QualityAnalyst, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /hedis/measure-runs/${run_id}/submit", as: QualityAnalyst, as_user_id: "qa-1", captures: { st: $.data.reporting_status } }
          assert:
            - "st == 'SUBMITTED' — the default clock (2026-05-01) precedes the 2026-06-15 deadline"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: a member created by POST is fully visible to the very next GET (no replication lag, no eventual fields)."
        test_recipe:
          setup: ["provider P1 exists"]
          setup_api_calls:
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin }
          trigger:
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { mid: $.data.id } }
            - { call: "GET /hedis/members/${mid}", as: QualityAnalyst, captures: { mr: $.data.member_ref, g: $.data.gender, ap: $.data.attributed_provider_ref } }
          assert:
            - "mr == 'M1' and g == 'F' and ap == 'P1' — the read-after-write reflects the mutation in full"

