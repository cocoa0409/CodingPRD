        distinguishing_aspect: "One action endpoint fires four documented side effects at once: verification_status UNVERIFIED -> REJECTED with the note stored, the device's registration_status ADDRESS_UNVERIFIED -> SUSPENDED_911, both versions incremented, and the HARD_FAIL class driving the account posture to BLOCKED."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one device holding number 3501 with an UNVERIFIED registration"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1031", billing_name: "FENNEL SRL", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
