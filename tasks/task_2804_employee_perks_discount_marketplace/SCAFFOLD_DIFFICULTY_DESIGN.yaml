  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stale_agreement_version_outranks_exhausted_negotiation_round_budget
        grounds:
          - validations[priority=40]
          - validations[priority=80]
          - concurrency_rules[propose-stale-agreement]
          - errors[ERR_STALE_VERSION]
          - errors[ERR_NEGOTIATION_ROUND_LIMIT]
        distinguishing_aspect: |
          The colliding pair is concurrency (priority 40, ERR_STALE_VERSION, 412) against
          capacity (priority 80, ERR_NEGOTIATION_ROUND_LIMIT, 409): one propose call that is
          both version-stale and over the 4-round budget must return
          ERR_STALE_VERSION with HTTP 412, and the round budget must never be consulted.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno with one agreement for (merchant, DINING, CA)."
            - "Four negotiation rounds already exchanged (propose, counter, propose, counter), so round_count is 4 and status is MERCHANT_COUNTERED with standing commission_rate_bps 1000."
            - "The PartnerManager still holds agreement_v0, the version the agreement carried at creation, which four rounds have since superseded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
