              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-FORK", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SLATE", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 24.000, expires_on: "2035-12-31" }
