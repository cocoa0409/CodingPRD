              as_user_id: "mgr_cath"
            - call: "POST /chargemaster/code-update-cycles/${c1}/lifecycle"
              payload: { action: "APPROVE_CROSSWALK" }
              as: PricingCommitteeApprover
              as_user_id: "pca_2"
              captures: { c1_status: $.data.status }
          assert:
            - "${c1_mapping} == MAPPING, ${e1_status} == MAPPED, ${e2_status} == MAPPED and ${e3_status} == DEFERRED"
            - "dual_2 approving the crosswalk of ${c1} returns 403 with error_id ERR_SEGREGATION_OF_DUTIES — it mapped only ${e1}, and one mapped entry is enough to bar it"
            - "${c2_status} == CROSSWALK_APPROVED — dual_2 approves the cycle whose only disposition was performed by ria_9"
            - "the ContractManager APPROVE_CROSSWALK returns 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "the DepartmentManager MAP disposition returns 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "the DepartmentManager cycle create returns 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "${c1_status} == CROSSWALK_APPROVED once pca_2, who mapped nothing, approves it"

