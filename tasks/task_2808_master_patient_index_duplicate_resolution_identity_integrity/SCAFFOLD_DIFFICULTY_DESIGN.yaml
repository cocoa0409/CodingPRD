          A THIRD distinct category pair - business_temporal (priority 43,
          ERR_PROPAGATION_WINDOW_EXPIRED) versus business_fiscal (priority 45,
          ERR_DISPATCH_CAPACITY_EXCEEDED), both HTTP 409: the identical send request returns
          ERR_DISPATCH_CAPACITY_EXCEEDED while the clock is inside the task's
