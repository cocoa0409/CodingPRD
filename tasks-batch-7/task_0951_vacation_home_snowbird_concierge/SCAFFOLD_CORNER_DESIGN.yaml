              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Sig Line", email: "sig.line@example.com", phone: "+15550708", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Sign House", address_line: "68 Sign St", state_code: "FL", travel_distance_miles: 18.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
              captures: { cycle_id: $.data.current_cycle_id }
            - call: "POST /property-care/billing-cycles/${cycle_id}/invoices"
              payload: {}
              as: AccountManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /property-care/invoices/${inv_id}/lines"
              payload: { line_type: "GUARANTEE_CREDIT", description: "Wrongly positive credit", amount_cents: 15000, taxable: false }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_LINE_SIGN_INVALID"
            - "GET /property-care/invoice-lines with invoice_id ${inv_id} returns total_count == 1"
            - "Invoice.${inv_id}.total_cents == 21385"

      - name: err_winterization_step_invalid_for_unknown_step_code_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINTERIZATION_STEP_INVALID]", "validations[priority=68]", "global_constants.WINTERIZATION_REQUIRED_STEPS"]
        distinguishing_aspect: "step_code ROOF_TARP is outside WINTERIZATION_REQUIRED_STEPS, WINTERIZATION_OPTIONAL_STEPS and the ALL_REQUIRED literal, so the call returns 400 ERR_WINTERIZATION_STEP_INVALID and completeness stays 0.0."
        test_recipe:
          setup: ["A property with a NOT_STARTED WinterizationRecord."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Step Bad", email: "step.bad@example.com", phone: "+15550709", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Step House", address_line: "1 Step St", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/properties/${prop_id}/winterization-records"
              payload: {}
              as: Dispatcher
              captures: { wr_id: $.data.id }
          trigger:
            - call: "POST /property-care/winterization-records/${wr_id}/steps"
              payload: { step_code: "ROOF_TARP" }
              as: FieldTech
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_WINTERIZATION_STEP_INVALID"
            - "WinterizationRecord.${wr_id}.status == NOT_STARTED and completeness_pct == 0.0"

      - name: err_thermostat_below_minimum_on_all_required_shortcut_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_THERMOSTAT_BELOW_MINIMUM]", "state_machines.WinterizationRecord.NOT_STARTED_to_COMPLETE", "global_constants.WINTERIZATION_MIN_THERMOSTAT_F"]
        distinguishing_aspect: "The ALL_REQUIRED shortcut demands thermostat_f >= 50; a value of 45 returns 400 ERR_THERMOSTAT_BELOW_MINIMUM and records nothing, unlike a plain THERMOSTAT_SET at 45 which is accepted but simply not counted."
        test_recipe:
          setup: ["A property with a NOT_STARTED WinterizationRecord."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Cold Set", email: "cold.set@example.com", phone: "+15550710", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Cold House", address_line: "50 Deg Dr", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/properties/${prop_id}/winterization-records"
              payload: {}
              as: Dispatcher
              captures: { wr_id: $.data.id }
          trigger:
            - call: "POST /property-care/winterization-records/${wr_id}/steps"
              payload: { step_code: "ALL_REQUIRED", thermostat_f: 45 }
              as: FieldTech
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_THERMOSTAT_BELOW_MINIMUM"
