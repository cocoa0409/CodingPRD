# ===========================================================================
# 1.9 Scaffold Corner Design - breadth probe
# Convenience-Store Made-to-Order Foodservice Program (task 2643)
#
# Walk of references/claim-extraction-guide.md sections 1..9 against this
# scaffold's SS1.1-SS1.7 surface. Corners already asserted by an SS1.8 instance
# carry an `excluded_because:` stub instead of a test_recipe.
#
# Shared fixture vocabulary (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   Store            WAWA-0101, hot_case_slot_capacity 4, pickup_slot_capacity 2
#   HoldingUnit      BC-1, BAKERY_CASE, band 135..185 F, slot_count 3
#   MenuItem HOAGIE  HOAGIE-ITAL  SANDWICH MADE_TO_ORDER   899c / 300c cost / prep 180s / 1 premium included
#   MenuItem COFFEE  COFFEE-LG    BEVERAGE MADE_TO_ORDER   249c /  40c cost / prep  45s
#   MenuItem WRAP    WRAP-CHKN    SANDWICH MADE_TO_ORDER   505c / 180c cost / prep 120s
#   MenuItem PRETZEL PRETZEL-SOFT BAKERY   PAR_BAKED_CASE  199c /  40c cost / bake 25m / hold 240m
#   The logical clock starts at 2026-08-01T00:00:00Z (OVERNIGHT) before any
#   POST /_clock/set_current_utc, and a store starts in BREAKFAST.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: create_store_returns_201_with_every_declared_field_seeded
        claim_type: creation
        grounds:
          - endpoints[POST /stores]
          - entities.Store
        distinguishing_aspect: |
          A create must return the whole Store projection, not just the id: store_code, name,
          is_fuel_site, current_daypart BREAKFAST, daypart_epoch 0, both capacities as supplied and all
          four computed counters at 0, plus id / created_at / updated_at / version 1.
        test_recipe:
          setup:
            - "empty database; the logical clock is left at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id, dp: $.data.current_daypart, epoch: $.data.daypart_epoch, slots: $.data.hot_case_slots_used, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "response_type == object"
            - "${dp} == BREAKFAST"
            - "${epoch} == 0"
            - "${slots} == 0"
            - "${ver} == 1"
            - "Store.${store_id}.store_code == WAWA-0101"
            - "Store.${store_id}.hot_case_slot_capacity == 4"
            - "Store.${store_id}.pickup_slot_capacity == 2"
            - "Store.${store_id}.is_fuel_site == true"
            - "Store.${store_id}.waste_cost_cents_mtd == 0"
            - "Store.${store_id}.rework_waste_cents_mtd == 0"
            - "Store.${store_id}.created_at is a non-null ISO8601 instant"

      - name: get_holding_unit_returns_the_stored_band_and_slot_count
        claim_type: retrieval
        grounds:
          - endpoints[GET /holding-units/{id}]
          - entities.HoldingUnit
        distinguishing_aspect: |
          The read-back must reproduce the temperature band and slot count exactly as written and expose
          the system-seeded status OPERATIONAL, consecutive_out_of_range_count 0 and last_temp_log_at null.
        test_recipe:
          setup:
            - "one store with one BAKERY_CASE unit BC-1 banded 135..185 F with 3 slots"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
          trigger:
            - call: "GET /holding-units/${unit_id}"
              payload: {}
              as: FoodSafetyLead
              captures: { status: $.data.status, lo: $.data.min_temp_f, hi: $.data.max_temp_f, slots: $.data.slot_count, strikes: $.data.consecutive_out_of_range_count }
          assert:
            - "HTTP status == 200"
            - "${status} == OPERATIONAL"
            - "${lo} == 135"
            - "${hi} == 185"
            - "${slots} == 3"
            - "${strikes} == 0"
            - "HoldingUnit.${unit_id}.store_id == ${store_id}"
            - "HoldingUnit.${unit_id}.unit_code == BC-1"
            - "HoldingUnit.${unit_id}.last_temp_log_at == null"

      - name: list_store_holding_units_pages_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /stores/{id}/holding-units]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          total_count is the size of the FILTERED set, not of the returned page: with three units and
          limit 2 the first page carries 2 rows, total_count 3, has_more true; offset 2 carries 1 row,
          total_count 3, has_more false. An implementation that sets total_count to len(page) or that
          computes has_more from len(page) == limit gets the second page wrong.
        test_recipe:
          setup:
            - "one store with exactly three OPERATIONAL holding units BC-1, HC-1 and CC-1"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "HC-1", unit_type: "HOT_CASE", min_temp_f: 140, max_temp_f: 190, slot_count: 2 }
              as: StoreManager
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "CC-1", unit_type: "COLD_CASE", min_temp_f: 33, max_temp_f: 41, slot_count: 4 }
              as: StoreManager
          trigger:
            - call: "GET /stores/${store_id}/holding-units"
              payload: { limit: 2, offset: 0 }
              as: StoreManager
              captures: { p1_first: "$.data[0].unit_code" }
            - call: "GET /stores/${store_id}/holding-units"
              payload: { limit: 2, offset: 2 }
              as: StoreManager
              captures: { p2_first: "$.data[0].unit_code" }
          assert:
            - "first page returns exactly 2 HoldingUnit rows and ${p1_first} == BC-1"
            - "first page: total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page returns exactly 1 HoldingUnit row and ${p2_first} == CC-1"
            - "second page: total_count == 3, has_more == false, limit == 2, offset == 2"
            - "response_type == array on both pages"

      - name: get_production_batch_with_unknown_id_returns_batch_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /production-batches/{id}]
          - errors[ERR_PRODUCTION_BATCH_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          An unknown path id must produce the entity-specific 404 ERR_PRODUCTION_BATCH_NOT_FOUND, not a
          generic 404 and not an empty 200 body.
        test_recipe:
          setup:
            - "empty database - no ProductionBatch row exists at all"
          setup_api_calls: []
          trigger:
            - call: "GET /production-batches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: KitchenAssociate
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response_type == error"
            - "${err_id} == ERR_PRODUCTION_BATCH_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: create_menu_item_missing_required_valid_dayparts_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /menu-items]
          - entities.MenuItem.fields.valid_dayparts
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: |
          valid_dayparts carries no default, so omitting it is a payload defect and not an empty-array
          fallback: the create must fail with ERR_INVALID_REQUEST (400) and no MenuItem row may be written.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300 }
              as: ChainAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "GET /menu-items with the created id is impossible - no MenuItem row was persisted"

      - name: optional_inputs_fall_back_to_the_declared_entity_defaults
        claim_type: defaults
        grounds:
          - entities.MenuItem.fields.prep_seconds
          - entities.MenuItem.fields.is_catering_eligible
          - entities.Store.fields.is_fuel_site
          - entities.ModifierOption.fields.is_premium
          - entities.ModifierOption.fields.max_qty
        distinguishing_aspect: |
          Three different defaults are probed in one chain, including the two that are easy to invert:
          Store.is_fuel_site defaults to TRUE while MenuItem.is_catering_eligible defaults to FALSE, and
          ModifierOption.max_qty defaults to 1 rather than to 0 or null.
        test_recipe:
          setup:
            - "empty database; every optional input is omitted from each create"
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2 }
              as: ChainAdmin
              captures: { store_id: $.data.id, fuel: $.data.is_fuel_site }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, valid_dayparts: ["LUNCH"] }
              as: ChainAdmin
              captures: { item_id: $.data.id, prep: $.data.prep_seconds, cater: $.data.is_catering_eligible, prem: $.data.included_premium_count }
            - call: "POST /menu-items/${item_id}/modifier-options"
              payload: { code: "EXTRA-PROV", modifier_class: "CHEESE", price_delta_cents: 60 }
              as: ChainAdmin
              captures: { mod_id: $.data.id, is_prem: $.data.is_premium, maxq: $.data.max_qty }
          assert:
            - "${fuel} == true"
            - "${prep} == 0"
            - "${cater} == false"
            - "${prem} == 0"
            - "${is_prem} == false"
            - "${maxq} == 1"
            - "MenuItem.${item_id}.bake_minutes == 0"
            - "MenuItem.${item_id}.hold_minutes == 0"
            - "ModifierOption.${mod_id}.menu_item_id == ${item_id}"

      - name: fuel_transaction_spend_cents_is_computed_from_gallons_and_posted_price
        claim_type: computed_fields
        grounds:
          - entities.FuelTransaction.fields.fuel_spend_cents
          - endpoints[POST /loyalty-accounts/{id}/fuel-transactions]
          - global_conventions.rounding
        distinguishing_aspect: |
          12.5 gallons at 329 cents is exactly 4112.5 cents, the round_half_up midpoint, so the persisted
          fuel_spend_cents must be 4113 and not 4112 (banker's rounding) or 4112.5 (a float leak into a
          cents field).
        test_recipe:
          setup:
            - "one loyalty member with no fuel history"
          setup_api_calls:
            - call: "POST /loyalty-accounts"
              payload: { member_code: "WAWA-M-001", email: "member1@example.com" }
              as: ChainAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /loyalty-accounts/${acct_id}/fuel-transactions"
              payload: { gallons: 12.5, price_per_gallon_cents: 329, occurred_at: "2026-07-20T09:00:00Z" }
              as: StoreTerminal
              captures: { ft_id: $.data.id, spend: $.data.fuel_spend_cents }
          assert:
            - "HTTP status == 201"
            - "${spend} == 4113"
            - "FuelTransaction.${ft_id}.loyalty_account_id == ${acct_id}"
            - "FuelTransaction.${ft_id}.gallons == 12.5"
            - "FuelTransaction.${ft_id}.occurred_at == 2026-07-20T09:00:00Z"
            - "GET /loyalty-accounts/${acct_id}/fuel-transactions -> total_count == 1"

      - name: store_system_fields_are_server_seeded_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Store.fields.current_daypart
          - entities.Store.fields.daypart_epoch
          - entities.Store.fields.hot_case_slots_used
          - global_conventions.daypart_authority
        distinguishing_aspect: |
          current_daypart, daypart_epoch and hot_case_slots_used are `source: system`/`computed` and are
          NOT in the endpoint's `input:` list, so supplying them must leave the seeded values BREAKFAST /
          0 / 0 in place rather than honouring LUNCH / 7 / 3.
        test_recipe:
          setup:
            - "empty database; the create payload carries three fields the endpoint does not declare as input"
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, current_daypart: "LUNCH", daypart_epoch: 7, hot_case_slots_used: 3 }
              as: ChainAdmin
              captures: { store_id: $.data.id, dp: $.data.current_daypart, epoch: $.data.daypart_epoch, slots: $.data.hot_case_slots_used, ver: $.data.version }
          assert:
            - "${dp} == BREAKFAST"
            - "${epoch} == 0"
            - "${slots} == 0"
            - "${ver} == 1"
            - "Store.${store_id}.id is a server-generated identifier that differs from any client-supplied value"

      - name: create_holding_unit_with_unknown_unit_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.HoldingUnit.fields.unit_type
          - endpoints[POST /stores/{id}/holding-units]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          unit_type is closed over {HOT_CASE, COLD_CASE, BAKERY_CASE}; FREEZER is outside the enum and must
          be refused with ERR_INVALID_REQUEST (400) before any row is written, rather than stored verbatim.
        test_recipe:
          setup:
            - "one store with no holding units"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "FZ-1", unit_type: "FREEZER", min_temp_f: -10, max_temp_f: 10, slot_count: 2 }
              as: StoreManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "GET /stores/${store_id}/holding-units -> total_count == 0"

      - name: temperature_log_is_immutable_with_no_update_endpoint_and_no_version
        claim_type: immutability
        grounds:
          - entities.TemperatureLog
          - entities.WasteLog
          - endpoints[GET /holding-units/{id}/temperature-logs]
        distinguishing_aspect: |
          TemperatureLog and WasteLog both declare `common_fields: false`, so the food-safety record is
          append-only: SS1.5 exposes a create and two reads for them and NO update or delete, and neither
          row carries a `version` field to bump. The correction path is a CorrectiveAction row, not an edit.
        test_recipe:
          setup:
            - "one store with one OPERATIONAL unit; one in-range reading of 160 F has been logged"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /holding-units/${unit_id}/temperature-logs"
              payload: { reading_f: 160 }
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { log_id: $.data.id, in_range: $.data.in_range, by: $.data.logged_by_user_id }
          assert:
            - "HTTP status == 201"
            - "${in_range} == true"
            - "${by} == assoc-1"
            - "TemperatureLog.${log_id} response body contains no version field"
            - "TemperatureLog.${log_id}.recorded_at == 2026-08-01T00:00:00Z"
            - "SS1.5 declares no PATCH, PUT or DELETE on /holding-units/{id}/temperature-logs or on any /waste-logs path"
            - "HoldingUnit.${unit_id}.status == OPERATIONAL"
            - "HoldingUnit.${unit_id}.consecutive_out_of_range_count == 0"

      - name: create_modifier_option_under_unknown_menu_item_returns_menu_item_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ModifierOption.parent
          - endpoints[POST /menu-items/{id}/modifier-options]
          - errors[ERR_MENU_ITEM_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          ModifierOption is parented on MenuItem, so an unknown parent id must fail with
          ERR_MENU_ITEM_NOT_FOUND (404) rather than creating an orphan row keyed to a dangling FK.
        test_recipe:
          setup:
            - "empty database - no MenuItem row exists"
          setup_api_calls: []
          trigger:
            - call: "POST /menu-items/00000000-0000-4000-8000-000000000000/modifier-options"
              payload: { code: "EXTRA-PROV", modifier_class: "CHEESE", price_delta_cents: 60, is_premium: true, max_qty: 2 }
              as: ChainAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_MENU_ITEM_NOT_FOUND"

      - name: order_line_junction_ties_an_order_to_a_menu_item_and_its_modifiers
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.OrderLine.fields.modifiers
          - endpoints[POST /orders/{id}/lines]
          - endpoints[GET /order-lines]
        distinguishing_aspect: |
          The graph topology's junction row is OrderLine: it carries order_id, menu_item_id, a modifier
          payload and later a fulfillment_batch_id pointing into a completely different root. The same row
          must be reachable from BOTH sides - filtered by order_id and filtered by menu_item_id - and the
          modifiers array must round-trip with its modifier_option_id references intact.
        test_recipe:
          setup:
            - "one store, one Italian Hoagie with an EXTRA-PROV cheese modifier (60c, premium, max_qty 2)"
            - "one anonymous DRAFT TOUCHSCREEN order"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /menu-items/${hoagie_id}/modifier-options"
              payload: { code: "EXTRA-PROV", modifier_class: "CHEESE", price_delta_cents: 60, is_premium: true, max_qty: 2 }
              as: ChainAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1, modifiers: [{ modifier_option_id: "${prov_id}", qty: 1 }] }
              as: StoreTerminal
              captures: { line_id: $.data.id, station: $.data.station, unit_px: $.data.unit_price_cents, surcharge: $.data.premium_surcharge_cents, gross: $.data.line_gross_cents }
            - call: "GET /order-lines"
              payload: { order_id: "${order_id}" }
              as: StoreManager
              captures: { by_order_first: "$.data[0].id" }
            - call: "GET /order-lines"
              payload: { menu_item_id: "${hoagie_id}" }
              as: StoreManager
              captures: { by_item_first: "$.data[0].id" }
          assert:
            - "HTTP status == 201 on the line create"
            - "${station} == SANDWICH"
            - "${unit_px} == 959"
            - "${surcharge} == 0"
            - "${gross} == 959"
            - "GET /order-lines?order_id=${order_id} -> total_count == 1"
            - "${by_order_first} == ${line_id}"
            - "GET /order-lines?menu_item_id=${hoagie_id} -> total_count == 1"
            - "${by_item_first} == ${line_id}"
            - "OrderLine.${line_id}.order_id == ${order_id}"
            - "OrderLine.${line_id}.menu_item_id == ${hoagie_id}"
            - "OrderLine.${line_id}.modifiers has exactly one element with modifier_option_id ${prov_id} and qty 1"
            - "OrderLine.${line_id}.fulfillment_batch_id == null"
            - "OrderLine.${line_id}.reserved_qty == 0"
            - "Order.${order_id}.subtotal_gross_cents == 959"

  # =========================================================================
  - section: state_machines
    instances:

      - name: bake_moves_a_planned_batch_to_baking_and_claims_a_hot_case_slot
        claim_type: valid_transition
        grounds:
          - state_machines.ProductionBatch.PLANNED_to_BAKING
          - endpoints[POST /production-batches/{id}/bake]
          - entities.Store.fields.hot_case_slots_used
        distinguishing_aspect: |
          The forward transition writes THREE things at once: status BAKING, baked_qty and remaining_qty
          both set to planned_qty 40 (they are 0 while PLANNED), and Store.hot_case_slots_used incremented
          to 1. hold_started_at and hold_expires_at stay null until the pull.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T06:00:00Z; store WAWA-0101 in its initial BREAKFAST daypart"
            - "one BAKERY_CASE unit BC-1; one PLANNED pretzel batch of 40 in slot 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
