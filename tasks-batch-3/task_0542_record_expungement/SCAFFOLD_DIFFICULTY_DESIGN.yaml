  - rule_id: compensating_invariant
    instances:
      - name: withdraw_refunds_fee_ledger
        grounds:
          - state_machines.Petition.SCREENED_to_WITHDRAWN
          - calculations.fee_ledger_reconciliation
          - entities.Petitioner.fields.fee_paid_cents
          - entities.Petitioner.fields.fee_refunded_cents
        distinguishing_aspect: |
          After paying 12900 and withdrawing, fee_refunded_cents == 12900 so NET_FEES =
          fee_paid_cents - fee_refunded_cents returns to 0 — the fee ledger (cents) is the
          conserved quantity.
        test_recipe:
          setup:
            - "SCREENED petition with 12900 paid (Petitioner.fee_paid_cents == 12900, fee_refunded_cents == 0)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Cy Fund", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
          trigger:
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "WITHDRAWN" }, as: Clerk }
            - { call: "GET /expungement/petitioners/${p}", payload: {}, as: Clerk, captures: { fp: "$.data.fee_paid_cents", fr: "$.data.fee_refunded_cents" } }
          assert:
            - "Petitioner.${p}.fee_paid_cents == 12900"
            - "Petitioner.${p}.fee_refunded_cents == 12900 (NET_FEES = 12900 - 12900 = 0, conserved)"

      - name: vacate_unseals_record_count
        grounds:
          - state_machines.CourtOrder.ENTERED_to_VACATED
          - state_machines.CriminalRecord.SEALED_to_ELIGIBLE
          - entities.CriminalRecord.fields.status
        distinguishing_aspect: |
          Vacating the GRANTED order flips the one SEALED record back to ELIGIBLE, returning the
          sealed-record count to 0 — the conserved quantity is record-seal count, distinct from
          the fee ledger.
        test_recipe:
          setup:
            - "GRANTED order with its one record SEALED (full grant chain)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/courtrooms", payload: { name: "Room 5", jurisdiction_code: "CA-01" }, as: Clerk, captures: { cr: "$.data.id" } }
            - { call: "POST /expungement/judges", payload: { name: "Judge D", jurisdiction_code: "CA-01" }, as: Clerk, captures: { jg: "$.data.id" } }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Va Kate", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk }
            - { call: "GET /expungement/agency-notifications", payload: { petition_id: "${pet}" }, as: Clerk, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id" } }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "GET /expungement/petitions/${pet}", payload: {}, as: Clerk, captures: { pv: "$.data.version" } }
            - { call: "POST /expungement/petitions/${pet}/hearings", payload: { courtroom_id: "${cr}", judge_id: "${jg}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", expected_petition_version: "${pv}" }, as: Clerk, captures: { h: "$.data.id" } }
            - { call: "POST /expungement/hearings/${h}/transition", payload: { to_status: "HELD" }, as: Clerk }
            - { call: "POST /expungement/hearings/${h}/order", payload: { disposition: "GRANTED" }, as: Judge, captures: { co: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/court-orders/${co}/vacate", payload: {}, as: Judge, captures: { ost: "$.data.status" } }
            - { call: "GET /expungement/criminal-records/${r}", payload: {}, as: Clerk, captures: { rst: "$.data.status" } }
          assert:
            - "CourtOrder.${co}.status == VACATED"
            - "CriminalRecord.${r}.status == ELIGIBLE (unsealed; sealed-record count for the order returns to 0)"
