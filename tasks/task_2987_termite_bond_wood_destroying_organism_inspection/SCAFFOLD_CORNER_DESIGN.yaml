        distinguishing_aspect: >-
          All four date fields are derived once, from the issuance clock: 2026-09-01 gives
          current_term_end 2027-09-01 (fixed 365 days, so the 2028 leap year is irrelevant) and
          renewal_window_opens_on 2027-07-03 (term end minus 60 days, which is NOT the first of a
