      - name: group_dismiss_blocked_by_proposed_then_confirmed_links
        claim_type: violation_to_error
        grounds: ["errors[ERR_GROUP_HAS_PROPOSED_LINKS]", "errors[ERR_GROUP_NOT_LINKABLE]", state_machines.OrcGroup.IDENTIFIED_to_DISMISSED]
        distinguishing_aspect: "Dismiss gating is staged: with a PROPOSED link outstanding it fails ERR_GROUP_HAS_PROPOSED_LINKS; after the link is CONFIRMED it fails ERR_GROUP_NOT_LINKABLE (confirmed_case_count > 0); after the confirmed case is MERGED away (dropping the count to 0) dismiss succeeds."
        test_recipe:
          setup: ["Stores SA/SB; group G IDENTIFIED; cases C1 (SA, 1000) and C2 (SA, 500) both INVESTIGATING; link L1 (C1<->G) PROPOSED"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S084", name: "Store 84", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { sa: $.data.id }
            - call: "POST /orc-groups"
              payload: { name: "Ring Delta" }
              as: LPManager
              as_user_id: mgr-1
              captures: { g: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${sa}", subject_type: "EXTERNAL", manual_loss_cents: 1000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { c1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${sa}", subject_type: "EXTERNAL", manual_loss_cents: 500 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { c2: $.data.id }
            - call: "POST /cases/${c1}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /cases/${c2}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /case-links"
              payload: { case_id: "${c1}", orc_group_id: "${g}", link_score: 50 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /orc-groups/${g}/dismiss"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
              captures: { err1: $.data.error_id }
            - call: "POST /case-links/${l1}/confirm"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /orc-groups/${g}/dismiss"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
              captures: { err2: $.data.error_id }
            - call: "POST /cases/${c1}/merge"
              payload: { target_case_id: "${c2}" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /orc-groups/${g}/dismiss"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
          assert:
            - "err1 == ERR_GROUP_HAS_PROPOSED_LINKS"
            - "err2 == ERR_GROUP_NOT_LINKABLE  # confirmed_case_count == 1"
            - "after merging C1 into C2: GET /orc-groups/${g}.confirmed_case_count == 0  # MERGED source drops out of the counter"
            - "final dismiss succeeds: OrcGroup.${g}.status == DISMISSED"

