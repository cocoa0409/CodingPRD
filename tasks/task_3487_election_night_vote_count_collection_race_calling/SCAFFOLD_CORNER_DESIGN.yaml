          assert:
            - "err == ERR_UNAUTHORIZED_ROLE"
            - "StringerAssignment.${asg}.status == SCHEDULED"

  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_vote_report_rejected
        claim_type: Stale Version Conflict
        grounds:
          - concurrency_rules[vote-report-stale-contest]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two strictly sequential submissions carrying the same expected_contest_version: the first succeeds (bumping Contest.version), the second is rejected 412 ERR_STALE_VERSION — deterministic OCC, no timing dependence."
        test_recipe:
          setup: ["Standard universe at LIVE; client holds contest version cv read before either submission."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cty_b
            - *k_cst
            - *k_lnk_a
            - *k_lnk_b
            - *k_cw
            - *k_ct
            - *k_feed
            - *k_lock
            - *k_eday
            - *k_live
            - *k_cv
          trigger:
            - *k_rep_a
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_b}", source: "FEED", precincts_reporting: 2, candidate_votes: [{ candidate_id: "${cand_w}", votes: 1300 }, { candidate_id: "${cand_t}", votes: 1200 }], expected_contest_version: "${cv}" }
              as: FeedOperator
              captures: { err: $.data.error_id }
          assert:
            - "VoteReport.${rep_a} created 201 and Contest.${cst}.version == cv + 1"
            - "err == ERR_STALE_VERSION (http 412) for the second submission carrying the pre-bump version"

      - name: occ_stale_version_on_call_proposal_rejected
        claim_type: Stale Version Conflict
        grounds:
          - concurrency_rules[call-propose-stale-contest]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The second proposal carrying the version captured before the first proposal lands fails 412 — proposal creation itself bumps the contest version."
        test_recipe:
          setup: ["Standard universe at TABULATION with one accepted report; analyst holds version cv_c."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cty_b
            - *k_cst
            - *k_lnk_a
            - *k_lnk_b
            - *k_cw
            - *k_ct
            - *k_feed
            - *k_lock
            - *k_eday
            - *k_live
            - *k_cv
            - *k_rep_a
            - *k_acc_a
            - *k_tab
            - call: "GET /contests/${cst}"
              payload: {}
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { cv_c: $.data.version }
          trigger:
            - call: "POST /contests/${cst}/calls"
              payload: { winner_candidate_id: "${cand_w}", expected_contest_version: "${cv_c}" }
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { call1: $.data.id }
            - call: "POST /contests/${cst}/calls"
              payload: { winner_candidate_id: "${cand_t}", expected_contest_version: "${cv_c}" }
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { err: $.data.error_id }
          assert:
            - "RaceCall.${call1} created 201 PROPOSED"
            - "err == ERR_STALE_VERSION (http 412) for the second proposal on the same captured version"

      - name: contest_version_increments_on_every_mutation
        claim_type: Derived Field Reconciliation
        grounds:
          - concurrency_rules[vote-report-stale-contest]
          - entities.Contest
        distinguishing_aspect: "Version bookkeeping is observable: 1 at creation, 2 after the report submission, 3 after the call proposal — clients can chain OCC writes by re-reading."
        test_recipe:
          setup: ["Standard universe at TABULATION with one accepted report and one proposal already made."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cst
            - *k_lnk_a
            - *k_cw
            - *k_ct
            - *k_feed
            - *k_lock
            - *k_eday
            - *k_live
            - *k_cv
            - *k_rep_a
            - *k_acc_a
            - *k_tab
            - call: "GET /contests/${cst}"
              payload: {}
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
              captures: { cv_c: $.data.version }
            - call: "POST /contests/${cst}/calls"
              payload: { winner_candidate_id: "${cand_w}", expected_contest_version: "${cv_c}" }
              as: DecisionAnalyst
              as_user_id: "analyst-nina"
          trigger:
            - call: "GET /contests/${cst}"
              payload: {}
              as: ElectionOpsAdmin
          assert:
            - "cv at creation was 1 (captured by the first GET)"
            - "Contest.${cst}.version == 4: report submission +1, accept-driven rollup recompute +1, call proposal +1"

      - name: selector_picks_highest_career_reliability
        claim_type: Selector Policy
        grounds:
          - state_machines.StringerAssignment.creation_to_SCHEDULED
          - calculations.stringer_reliability_score
          - entities.ElectionEvent.fields.stringer_selection_mode
        distinguishing_aspect: "Auto-select ranks by the event's CAREER variant: Sally (75 after an old NO_SHOW) loses to fresh Sam (100); the response marks auto_selected true."
        test_recipe:
          setup: ["Sally carries a 2024 NO_SHOW (career 75); Sam is fresh (100); event in SETUP with Alameda."]
          setup_api_calls:
            - *k_clock
            - call: "POST /election-events"
              payload: { event_name: "2024 General Election", event_date: "2024-11-05", event_type: "GENERAL", total_stringer_hour_budget: 100 }
              as: ElectionOpsAdmin
              captures: { ev_old: $.data.id }
            - call: "POST /election-events/${ev_old}/counties"
              payload: { county_fips: "01001", county_name: "Autauga", state_code: "AL", expected_precincts: 4, expected_vote_total: 2000 }
              as: ElectionOpsAdmin
              captures: { cty_old: $.data.id }
            - *k_str
            - call: "POST /election-events/${ev_old}/assignments"
              payload: { county_id: "${cty_old}", window_start: "2024-11-05T08:00:00Z", window_end: "2024-11-05T20:00:00Z", stringer_id: "${str_s}" }
              as: StringerCoordinator
              captures: { asg_old: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2024-11-06T00:00:00Z" }
              as: ElectionOpsAdmin
            - call: "POST /assignments/${asg_old}/status-actions"
              payload: { action: "NO_SHOW" }
              as: StringerCoordinator
            - call: "POST /stringers"
              payload: { stringer_name: "Sam Stringer", home_state: "NV" }
              as: StringerCoordinator
              captures: { str_t: $.data.id }
            - *k_ev
            - *k_cty_a
          trigger:
            - call: "POST /election-events/${ev}/assignments"
              payload: { county_id: "${cty_a}", window_start: "2026-11-03T08:00:00Z", window_end: "2026-11-03T20:00:00Z" }
              as: StringerCoordinator
              captures: { asg: $.data.id }
          assert:
            - "StringerAssignment.${asg}.stringer_id == ${str_t} (100 beats 75)"
            - "StringerAssignment.${asg}.auto_selected == true"

      - name: selector_tie_breaks_by_earliest_created_at
        claim_type: Selector Policy
        grounds:
          - state_machines.StringerAssignment.creation_to_SCHEDULED
          - calculations.stringer_reliability_score
        distinguishing_aspect: "Two stringers tied at 100 are broken by created_at ASC: the first-registered stringer wins the auto-select — id is never consulted."
        test_recipe:
          setup: ["Event in SETUP with Alameda; Sally registered before Sam; both career 100."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_str
            - call: "POST /stringers"
              payload: { stringer_name: "Sam Stringer", home_state: "NV" }
              as: StringerCoordinator
              captures: { str_t: $.data.id }
          trigger:
            - call: "POST /election-events/${ev}/assignments"
              payload: { county_id: "${cty_a}", window_start: "2026-11-03T08:00:00Z", window_end: "2026-11-03T20:00:00Z" }
              as: StringerCoordinator
              captures: { asg: $.data.id }
          assert:
            - "StringerAssignment.${asg}.stringer_id == ${str_s} (Sally registered earlier)"
            - "StringerAssignment.${asg}.auto_selected == true"

      - name: selector_empty_pool_returns_no_eligible_stringer
        claim_type: Selector Policy
        grounds:
          - state_machines.StringerAssignment.creation_to_SCHEDULED
          - errors[ERR_NO_ELIGIBLE_STRINGER]
        distinguishing_aspect: "The only rostered stringer already holds an overlapping SCHEDULED assignment, so the auto-select pool is empty and creation fails 422 ERR_NO_ELIGIBLE_STRINGER."
        test_recipe:
          setup: ["Event in SETUP with Alameda; Sally assigned [08:00, 20:00)."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_str
            - call: "POST /election-events/${ev}/assignments"
              payload: { county_id: "${cty_a}", window_start: "2026-11-03T08:00:00Z", window_end: "2026-11-03T20:00:00Z", stringer_id: "${str_s}" }
              as: StringerCoordinator
              captures: { asg1: $.data.id }
          trigger:
            - call: "POST /election-events/${ev}/assignments"
              payload: { county_id: "${cty_a}", window_start: "2026-11-03T19:00:00Z", window_end: "2026-11-03T23:00:00Z" }
              as: StringerCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_ELIGIBLE_STRINGER"

      - name: call_deliveries_reach_premium_but_not_basic
        claim_type: Conditional Feature Flag
        grounds:
          - state_machines.Contest.call_status_UNCALLED_to_CALLED
