              as: PlayerAgent
              as_user_id: "${p1_id}"
              captures: { e3: $.data.error_id }
            - call: "POST /organizations/${org_id}/team-houses"
              payload: { name: "Rogue House", timezone: "America/Los_Angeles" }
              as: CoachingStaff
              as_user_id: "coach-1"
