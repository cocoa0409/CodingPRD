      - name: discharge_administers_the_dose_and_bubbles_plan_completion_upward
        claim_type: side_effect_execution
        grounds:
          - state_machines[Appointment/schedule_status].transitions[OBSERVING -> COMPLETED].side_effects
          - state_machines[TreatmentPlan].transitions[ACTIVE -> COMPLETED]
          - state_machines[DrugPreparation].transitions[PREPARED -> ADMINISTERED]
          - calculations.billable_chair_units
        distinguishing_aspect: |
          One discharge fires a five-target bubble-up on a single-cycle plan: the
          preparation goes PREPARED -> ADMINISTERED with the lot's units_administered
          moving to 1 (units_committed back to 0, units_available still 9), the chair's
          committed_minutes drops from 240 to 0 and the nurse's acuity from 3 to 0
          because COMPLETED leaves the committed set, the patient's
          completed_appointment_count becomes 1 with no_show_risk_score 0.00, and
          because total_cycles is 1 the plan itself transitions ACTIVE -> COMPLETED with
          completed_cycles 1 and first_dose_completed true.
        test_recipe:
          setup:
            - "Same canonical full chain as the terminal-lockdown corner, except TreatmentPlan.total_cycles is 1 so the discharge exhausts the regimen."
            - "Lot LOT-A holds 10 units; the single preparation requests 1 unit."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
