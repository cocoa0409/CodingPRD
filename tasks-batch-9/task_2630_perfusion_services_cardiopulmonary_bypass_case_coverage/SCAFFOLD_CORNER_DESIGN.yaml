# §1.9 Scaffold Corner Design — breadth probe for
# task_2630_perfusion_services_cardiopulmonary_bypass_case_coverage
#
# Every claim below is derived by walking references/claim-extraction-guide.md
# section by section against this scaffold's §1.1–§1.7. Section values are the
# guide's nine sections; claim_type values are the guide's per-section rows.
# Corners already asserted by a §1.8 instance appear as excluded_because stubs.
#
# Error-catalog coverage: all 72 §1.6 codes are reachable — 61 through the
# instances in this file, 11 through the named §1.8 instances.

scaffold_corner_design:
  - section: entities
    instances:
      - name: contract_creation_returns_declared_fields_with_system_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /hospital-contracts]
          - entities.HospitalContract.fields.accrued_case_fee_cents
          - entities.HospitalContract.fields.coverage_posture
          - entities.HospitalContract.fields.last_settlement_period
        distinguishing_aspect: |
          The plain creation claim for the aggregate root: POST with exactly the five required
          inputs returns 201 and every declared field of §1.1's HospitalContract, with the
          computed money ledger at zero, coverage_posture at UNCOVERED (no rotation slot exists
          yet) and version at 1. Falsified by any implementation that omits computed fields from
          the create response or that seeds coverage_posture optimistically.
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5 }
              as: ContractAdmin
              captures: { c1: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "HospitalContract.${c1}.hospital_name == 'St Aldate Cardiac Center', staffing_model == COVERAGE_PLUS_PER_CASE, per_case_fee_cents == 400000, ecmo_hourly_fee_cents == 90000, monthly_case_cap == 5"
            - "HospitalContract.${c1}.accrued_case_fee_cents == 0, accrued_case_count == 0, coverage_posture == UNCOVERED, last_settlement_period == null"
            - "id, created_at, updated_at are server-generated and version == 1"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.HospitalContract.fields.prolonged_surcharge_pct
          - entities.HospitalContract.fields.prolonged_pump_threshold_minutes
          - entities.HospitalContract.fields.disposable_discount_pct
          - entities.PerfusionDevice.fields.service_interval_hours
          - entities.Perfusionist.fields.employment_status
          - entities.PreferenceCard.fields.revision
        distinguishing_aspect: |
          Every `default:` in §1.1 that an endpoint's `input:` marks optional must be applied by
          the server, not left null: the contract's commercial defaults (0.15 / 180 / 0.20 / 0.00
          / 0), the device's 500-hour service interval and AVAILABLE status, the perfusionist's
          ACTIVE employment with is_chief and ecmo_privileged false and career_case_count 0, and
          the preference card's revision 1 with status ACTIVE. Falsified by any field that comes
          back null after omission.
        test_recipe:
          setup:
            - "Empty database. Every call below supplies only the endpoint's required inputs."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "Brackenridge Heart Institute", staffing_model: "PER_CASE", per_case_fee_cents: 380000, ecmo_hourly_fee_cents: 85000, monthly_case_cap: 4 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-010", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Ada Nwosu", employee_code: "EMP-2001" }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1000 } ], required_safety_check_codes: ["ACT_BASELINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { pc1: $.data.id }
          assert:
            - "HospitalContract.${c1}.monthly_coverage_fee_cents == 0, prolonged_surcharge_pct == 0.15, prolonged_pump_threshold_minutes == 180, disposable_markup_pct == 0.20, disposable_discount_pct == 0.00"
            - "Surgeon.${s1}.status == ACTIVE"
            - "PerfusionDevice.${d1}.service_interval_hours == 500, status == AVAILABLE, backup_device_id == null, runtime_hours_since_service == 0, alarm_count_since_service == 0, open_reservation_count == 0, last_service_completed_at == null"
            - "Perfusionist.${p1}.employment_status == ACTIVE, is_chief == false, ecmo_privileged == false, career_case_count == 0, ce_credits_verified == 0, ce_credits_pending == 0, readiness_score == 0.0, readiness_variant_last == null"
            - "PreferenceCard.${pc1}.revision == 1 and status == ACTIVE"

      - name: case_creation_extra_field_bypass_status_is_ignored_input
        claim_type: system_fields
        grounds:
          - entities.BypassCase.fields.bypass_status
          - entities.BypassCase.fields.billing_status
          - entities.BypassCase.fields.assigned_perfusionist_id
          - endpoints[POST /bypass-cases]
        distinguishing_aspect: |
          POST /bypass-cases declares only six inputs; bypass_status, billing_status,
          assigned_perfusionist_id, accrued_fee_cents and version are `source: system` and must be
          server-owned. A client that posts them anyway still gets a SCHEDULED / UNBILLED case with
          no perfusionist and version 1 — the extra keys are dropped, never honoured and never
          echoed back with the client's values.
        test_recipe:
          setup:
            - "Contract c1 with surgeon s1 and an ACTIVE CABG preference card; perfusionist p1 holds a PRIMARY_CALL slot spanning the whole 72-hour horizon, so HospitalContract.${c1}.coverage_posture == THIN and ELECTIVE case creation is admitted."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1055 } ], required_safety_check_codes: ["ACT_BASELINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22, revision: 1 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { pc1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p1}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ContractAdmin
              captures: { slot_p1: $.data.id }
          trigger:
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T06:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", acuity: "ELECTIVE", bypass_status: "ON_BYPASS", billing_status: "FINAL_ACCRUED", assigned_perfusionist_id: "${p1}", accrued_fee_cents: 999999, version: 47 }
              as: ChiefPerfusionist
              as_user_id: "${p1}"
              captures: { case1: $.data.id }
          assert:
            - "HTTP 201 - the unknown keys are dropped, not treated as an invalid request"
            - "BypassCase.${case1}.bypass_status == SCHEDULED and billing_status == UNBILLED, never the posted ON_BYPASS / FINAL_ACCRUED"
            - "BypassCase.${case1}.assigned_perfusionist_id == null, primary_device_id == null, backup_device_id == null, accrued_fee_cents == 0, provisional_fee_cents == null, final_fee_cents == null"
            - "BypassCase.${case1}.readiness_flag == NONE, setup_verified_at == null, adverse_event_count == 0 and version == 1, not 47"
            - "HospitalContract.${c1}.accrued_case_count == 0 - creation alone never accrues"

      - name: pack_cost_cents_is_server_computed_extra_field_ignored
        claim_type: computed_fields
        grounds:
          - calculations.disposable_pack_cost
          - entities.DisposablePack.fields.pack_cost_cents
          - entities.DisposablePack.fields.line_items
          - entities.DisposablePack.fields.applied_preference_card_id
          - entities.DisposablePack.fields.prime_volume_ml
        distinguishing_aspect: |
          pack_cost_cents, line_items, applied_preference_card_id, requires_surgeon_approval and
          prime_volume_ml are all derived at configuration time from the selected card and the
          contract's discount/markup; a client-supplied pack_cost_cents is ignored. The literal
          3741 is the per-line rounding of three lines (1055/1155/1255 at -10% then +20% giving
          1139 + 1247 + 1355), so an implementation that rounds the aggregate instead reports 3742
          and fails.
        test_recipe:
          setup:
            - "Contract c1 (disposable_discount_pct 0.10, disposable_markup_pct 0.20), surgeon s1 with an ACTIVE three-line CABG card, chief, p1 with a current CCP certification and 20 in-cycle CE hours, a PRIMARY_CALL slot covering the horizon, and machines d1 (backup_device_id = d2) and d2."
            - "Case case1 [2026-08-02T06:00:00Z, 12:00:00Z) is STAFFED with p1."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1055 }, { line_code: "B_TUBING_PACK", quantity: 1, unit_cost_cents: 1155 }, { line_code: "C_CANNULA_SET", quantity: 1, unit_cost_cents: 1255 } ], required_safety_check_codes: ["ACT_BASELINE", "CIRCUIT_INTEGRITY", "GAS_LINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22, revision: 1 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { pc1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Nadia Oyelaran", employee_code: "EMP-1002", is_chief: true, career_case_count: 200 }
              as: ContractAdmin
              captures: { chief: $.data.id }
            - call: "POST /perfusionists/${p1}/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { cert1: $.data.id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 20, activity_date: "2026-03-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { ce1: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-002", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d2: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-001", device_class: "HEART_LUNG_MACHINE", backup_device_id: "${d2}" }
              as: BiomedTech
              captures: { d1: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p1}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { slot_p1: $.data.id }
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T06:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /bypass-cases/${case1}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${case1_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
          trigger:
            - call: "POST /bypass-cases/${case1}/disposable-packs"
              payload: { primary_device_id: "${d1}", pack_cost_cents: 1, prime_volume_ml: 99, approval_status: "APPROVED" }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { pack1: $.data.id }
          assert:
            - "HTTP 201 and DisposablePack.${pack1}.pack_cost_cents == 3741, never the posted 1"
            - "DisposablePack.${pack1}.line_items has 3 elements ordered A_OXYGENATOR, B_TUBING_PACK, C_CANNULA_SET with line_total_cents 1139, 1247 and 1355 and substituted == false on each"
            - "DisposablePack.${pack1}.applied_preference_card_id == ${pc1} and prime_volume_ml == 1500, never the posted 99"
            - "DisposablePack.${pack1}.substitutions == [], requires_surgeon_approval == false and approval_status == NOT_REQUIRED, never the posted APPROVED"
            - "BypassCase.${case1}.bypass_status == PACK_CONFIGURED with primary_device_id == ${d1} and backup_device_id == ${d2}"

      - name: case_creation_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /bypass-cases]
          - endpoints[POST /perfusionists]
          - endpoints[POST /call-rotation-slots]
        distinguishing_aspect: |
          Priority 6 fires before every domain rule, on every POST/PUT, for any required `input:`
          field that is absent or null. The three probes cover a datetime (scheduled_end), a string
          (employee_code) and an enum (slot_type), and each returns 400 rather than a 422 domain
          error, proving the request-shape gate runs ahead of the business ladder.
        test_recipe:
          setup:
            - "Contract c1, surgeon s1 with an ACTIVE CABG card and a chief perfusionist exist; nothing else is needed because priority 6 answers before any lookup."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Nadia Oyelaran", employee_code: "EMP-1002", is_chief: true, career_case_count: 200 }
              as: ContractAdmin
              captures: { chief: $.data.id }
          trigger:
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T06:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { err_case: $.data.error_id }
            - call: "POST /perfusionists"
              payload: { full_name: "Ada Nwosu" }
              as: ContractAdmin
              captures: { err_perf: $.data.error_id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${chief}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ContractAdmin
              captures: { err_slot: $.data.error_id }
          assert:
            - "the case creation returns HTTP 400 with ${err_case} == ERR_INVALID_REQUEST (scheduled_end missing), not ERR_INVALID_TIME_WINDOW"
            - "the perfusionist creation returns HTTP 400 with ${err_perf} == ERR_INVALID_REQUEST (employee_code missing), not ERR_DUPLICATE_CODE"
            - "the slot creation returns HTTP 400 with ${err_slot} == ERR_INVALID_REQUEST (slot_type missing)"
            - "no row is persisted by any of the three calls: GET /bypass-cases returns total_count == 0 and GET /call-rotation-slots returns total_count == 0"

      - name: invalid_enum_and_out_of_range_values_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=7]
          - errors.ERR_INVALID_FIELD_VALUE
          - entities.BypassCase.fields.acuity
          - entities.CeActivity.fields.credit_hours
          - entities.PumpChecklist.fields.hematocrit_pct
          - entities.PreferenceCard.fields.pack_line_items
        distinguishing_aspect: |
          Priority 7 covers four distinct constraint kinds declared in §1.1 - enum membership
          (acuity), a numeric upper bound (credit_hours <= 20), a numeric range
          (5 <= hematocrit_pct <= 45) and array cardinality (pack_line_items 1..12) - and all four
          answer 422 ERR_INVALID_FIELD_VALUE rather than the domain error that would have applied
          had the value been in range.
        test_recipe:
          setup:
            - "Contract c1, surgeon s1 with an ACTIVE CABG card, chief, p1 with a current CCP certification, and a PRIMARY_CALL slot covering the horizon so posture is THIN."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Nadia Oyelaran", employee_code: "EMP-1002", is_chief: true, career_case_count: 200 }
              as: ContractAdmin
              captures: { chief: $.data.id }
            - call: "POST /perfusionists/${p1}/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { cert1: $.data.id }
          trigger:
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T06:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", acuity: "SEMI_URGENT" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 25, activity_date: "2026-03-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { err_hours: $.data.error_id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "VALVE", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [], required_safety_check_codes: ["ACT_BASELINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { err_lines: $.data.error_id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "VALVE", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1000 } ], required_safety_check_codes: ["ACT_BASELINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 60 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { err_range: $.data.error_id }
          assert:
            - "the case creation returns HTTP 422 with ${err_enum} == ERR_INVALID_FIELD_VALUE - SEMI_URGENT is not in {ELECTIVE, URGENT, EMERGENT} - and not ERR_CONTRACT_COVERAGE_INSUFFICIENT, even though posture is UNCOVERED (no slot exists), proving priority 7 precedes priority 70"
            - "the CE claim returns HTTP 422 with ${err_hours} == ERR_INVALID_FIELD_VALUE (credit_hours 25 exceeds the declared maximum of 20)"
            - "the empty-pack card returns HTTP 422 with ${err_lines} == ERR_INVALID_FIELD_VALUE (pack_line_items must hold 1 to 12 elements)"
            - "the out-of-range card returns HTTP 422 with ${err_range} == ERR_INVALID_FIELD_VALUE (min_hematocrit_pct 60 is outside 5..45)"
            - "Perfusionist.${p1}.ce_credits_pending == 0 and GET /preference-cards returns total_count == 0 - no partial row was written by any refusal"

      - name: contract_and_case_reads_return_the_persisted_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /hospital-contracts/{id}]
          - endpoints[GET /bypass-cases/{id}]
          - entities.HospitalContract.fields.version
          - entities.BypassCase.fields.scheduled_start
        distinguishing_aspect: |
          A read-after-write claim on the two roots that carry version counters: the GET body must
          echo exactly what the POST persisted, including the untouched computed ledger fields, and
          a GET must not itself advance version or mutate any state. Falsified by handlers that
          recompute posture or accruals on read and bump version as a side effect of the read.
        test_recipe:
          setup:
            - "Contract c1, surgeon s1 with an ACTIVE CABG card, perfusionist p1 with a PRIMARY_CALL slot across the horizon (posture THIN), and case case1 [2026-08-02T06:00:00Z, 12:00:00Z)."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
            - call: "POST /preference-cards"
