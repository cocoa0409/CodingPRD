        distinguishing_aspect: |
          Resource: Vessel. Interval semantics: ADJACENCY BUFFER — the vessel
          requires at least one FULL in-port calendar day between an existing
          deployment's return and the next departure:
          gap = (new_departure - existing_return).days - 1 must be >= 1.
          Departing the day AFTER the existing return (gap == 0) violates, and
