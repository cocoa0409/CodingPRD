              as: CrisisCounselor
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 403"
            - "trigger response data.error_id == ERR_UNAUTHORIZED"

  # ---- Cross-Cutting Complexity Layers (OCC) --------------------------------
  - section: cross_cutting
    instances:
      - name: bed_referral_stale_center_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bed-referral-create-stale-center]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one referral advances CrisisCenter.version, a second create carrying the previously-observed (now stale) expected_crisis_center_version returns 412 ERR_STALE_VERSION even though a bed remains."
        test_recipe:
          setup: ["Capacity-2 center; two HIGH contacts in DISPATCH_PENDING; one HELD referral has advanced center.version from 1 to 2."]
          setup_api_calls:
            - call: "POST /crisis-centers"
              payload: {name: "Center OCC", bed_capacity: 2, accepted_acuities: ["HIGH"]}
              as: ClinicalSupervisor
              captures: {center_id: "$.data.id", center_v: "$.data.version"}
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "occ-c-1"}
              as: ClinicalSupervisor
              captures: {c1: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c1}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c1}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c1}", crisis_center_id: "${center_id}", acuity: "HIGH", window_start: "2026-03-01T02:00:00Z", window_end: "2026-03-01T06:00:00Z", expected_crisis_center_version: "${center_v}"}
              as: CrisisDispatcher
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "occ-c-2"}
              as: ClinicalSupervisor
              captures: {c2: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c2}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c2}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
          trigger:
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c2}", crisis_center_id: "${center_id}", acuity: "HIGH", window_start: "2026-03-01T07:00:00Z", window_end: "2026-03-01T08:00:00Z", expected_crisis_center_version: "${center_v}"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 412"
            - "trigger response data.error_id == ERR_STALE_VERSION"

      - name: dispatch_stale_team_version_returns_412
