              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 412 with error_id == ERR_STALE_POLICY_VERSION (not ERR_REPORT_PERIOD_OVERLAP — July does not touch June)"
            - "PolicyProfile.${pol_id}.report_count == 1 (${rep_count}) and version == 2 (${pol_ver_fresh})"
            - "GET /compliance/policy-profiles/${pol_id}/regulator-reports returns total_count == 1 with data[0].id == ${rep_june_id}"
            - "Resending the identical July body with expected_policy_profile_version = ${pol_ver_fresh} returns 201 with status == DRAFT, and the profile moves to report_count 2 / version 3"

      - name: booking_version_increments_on_every_write_including_child_creates
        claim_type: optimistic_concurrency
        grounds: ["entities.Booking.version", "endpoints[POST /compliance/bookings/{id}/flight-segments]", "endpoints[POST /compliance/ancillary-purchases]", "endpoints[POST /compliance/checked-bags]", "calculations.booking_ledger_recompute"]
