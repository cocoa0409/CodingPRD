      # ----- Flexologist: closed-with-buffer interval geometry
      - name: flexologist_buffer_gap_must_meet_minimum
        grounds:
          - validations[priority=11]
          - errors[ERR_FLEXOLOGIST_UNAVAILABLE]
          - entities.Location.fields.flexologist_buffer_minutes
        distinguishing_aspect: |
          The FLEXOLOGIST rule rejects when the inter-session gap is strictly less than
          flexologist_buffer_minutes (15): a session starting 10 minutes after the prior
          ends is rejected, while one starting exactly 15 minutes after is accepted. This
          buffer geometry differs from the table's plain half-open arithmetic, and sits on
          the Flexologist resource.
        test_recipe:
          setup:
            - "Member with intro completed; an existing CONFIRMED 50-min booking with FlexA on T1 at 2026-04-20T10:00Z (ends 10:50)."
            - "Location flexologist_buffer_minutes = 15 (default)."
