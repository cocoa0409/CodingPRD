scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: observation_provisional_vs_final_points_diverge
        grounds:
          - calculations.observation_quality_points
          - entities.Observation.fields.provisional_quality_points
          - entities.Observation.fields.final_quality_points
          - state_machines.Observation.UNDER_REVIEW_to_ACCEPTED
        distinguishing_aspect: |
          This dual-variant lives on the Observation entity domain (per-record scientific scoring):
          the provisional variant rounds `raw` to 2 dp and ignores verification output, while the
          final variant multiplies the UNROUNDED `raw` by confidence_multiplier, so the same
          observation reports provisional_quality_points 60.00 and final_quality_points 66.00.
        test_recipe:
          setup:
            - "Protocol BBS-2026 ACTIVE with min_photo_count 1, max_submission_lag_hours 96, required_certification_level BASIC, required_equipment_type NONE"
            - "Volunteer Vera is ACTIVE holding a CERTIFIED ADVANCED certification on BBS-2026 trained by expert Tess"
            - "Campaign Autumn Count is OPEN over 2026-08-01..2026-10-31 with target_observations_per_site 3 and one site S-HI at priority_weight 1.5"
            - "Observation o1 at S-HI observed 2026-08-05T06:00:00Z, submitted at logical clock 2026-08-05T09:00:00Z (lag 3 h), one ACCEPTED photo, review_status UNDER_REVIEW with one CONFIRM vote of confidence 5 from a weight-2.00 expert"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /citizen-science/protocols"
              payload: { code: "BBS-2026", title: "Breeding Bird Survey 2026", required_certification_level: "BASIC", min_photo_count: 1, max_submission_lag_hours: 96, required_equipment_type: "NONE", certification_valid_days: 365 }
              as: ProgramAdmin
              captures: { p1: $.data.id }
            - call: "POST /citizen-science/protocols/${p1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/volunteers"
              payload: { full_name: "Vera Finch", email: "vera@example.org", home_region_code: "NE-01" }
              as: ProgramAdmin
              captures: { v1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Tess Trainer", specialty_taxon: "AVES", verification_weight: 1.00 }
              as: ProgramAdmin
              captures: { et: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Ada Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Bo Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e2: $.data.id }
            - call: "POST /citizen-science/certifications"
              payload: { volunteer_id: "${v1}", protocol_id: "${p1}", trainer_expert_id: "${et}", level: "ADVANCED" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /citizen-science/certifications/${c1}/complete-training"
              payload: { exam_score: 88 }
              as: Expert
              as_user_id: "${et}"
            - call: "POST /citizen-science/certifications/${c1}/grant"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/campaigns"
              payload: { name: "Autumn Count", protocol_id: "${p1}", season_start_date: "2026-08-01", season_end_date: "2026-10-31", target_observations_per_site: 3 }
              as: ProgramAdmin
              captures: { cam1: $.data.id }
            - call: "POST /citizen-science/campaigns/${cam1}/sites"
              payload: { site_code: "S-HI", latitude: 44.0, longitude: -70.0, habitat_type: "WETLAND", priority_weight: 1.5 }
              as: ProgramAdmin
              captures: { s_hi: $.data.id }
            - call: "POST /citizen-science/campaigns/${cam1}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/observations"
              payload: { campaign_id: "${cam1}", site_id: "${s_hi}", volunteer_id: "${v1}", observed_at: "2026-08-05T06:00:00Z", latitude: 44.0, longitude: -70.0, species_code: "BAEA", count_value: 3 }
              as: Volunteer
              as_user_id: "${v1}"
              captures: { o1: $.data.id }
            - call: "POST /citizen-science/observations/${o1}/photos"
              payload: { file_hash: "ph-o1-a", captured_at: "2026-08-05T06:05:00Z", exif_latitude: 44.0, exif_longitude: -70.0 }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /citizen-science/observations/${o1}/start-review"
              payload: {}
              as: Expert
              as_user_id: "${e1}"
              captures: { o1_v1: $.data.version, o1_prov: $.data.provisional_quality_points }
            - call: "POST /citizen-science/observations/${o1}/votes"
              payload: { decision: "CONFIRM", confidence: 5, expected_observation_version: "${o1_v1}" }
              as: Expert
              as_user_id: "${e1}"
            - call: "GET /citizen-science/observations/${o1}"
              payload: {}
              as: ProgramAdmin
              captures: { o1_v2: $.data.version }
          trigger:
            - call: "POST /citizen-science/observations/${o1}/votes"
              payload: { decision: "CONFIRM", confidence: 5, expected_observation_version: "${o1_v2}" }
              as: Expert
              as_user_id: "${e2}"
          assert:
            - "Observation.${o1}.provisional_quality_points == 60.00"
            - "Observation.${o1}.consensus_confidence == 5.0000"
            - "Observation.${o1}.confirm_weight == 4.4000"
            - "Observation.${o1}.final_quality_points == 66.00"
            - "Observation.${o1}.final_quality_points != Observation.${o1}.provisional_quality_points"
            - "Observation.${o1}.review_status == ACCEPTED"
            - "Observation.${o1}.publication_status == QUEUED"

      - name: volunteer_rolling_vs_lifetime_quality_score_diverge
        grounds:
          - calculations.volunteer_quality_score
          - entities.Volunteer.fields.quality_score
          - entities.Volunteer.fields.lifetime_quality_score
          - entities.Volunteer.fields.recognition_tier
        distinguishing_aspect: |
          This dual-variant lives on the Volunteer entity domain (observer reputation), not on the
          Observation: with one 89-day-old ACCEPTED and one 1-day-old REJECTED adjudication the
          unweighted rolling_window variant reports quality_score 0.5000 while the age-decayed
