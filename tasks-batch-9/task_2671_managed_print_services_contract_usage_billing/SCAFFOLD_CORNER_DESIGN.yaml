      - name: cross_reference_link_spare_part_stock_upserts_then_refuses_to_go_negative
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/sites/{id}/spare-part-stocks
          - validations.priority_31
          - errors.ERR_PART_STOCK_UNDERFLOW
        distinguishing_aspect: "One endpoint both creates and adjusts the (site_id, part_sku) association: the first positive delta mints the row, a negative delta decrements it, a zero delta and an over-drawing delta are both refused, and an unknown site never creates a row."
        test_recipe:
          setup:
            - "contract C1 with site S1 and no SparePartStock rows"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /sites"
              payload: { contract_id: "${c1}", name: "Plant 1", address_region: "NE-01", toner_unit_cap: 4, network_vlan_tag: 2001 }
              as: AccountManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /sites/${s1}/spare-part-stocks"
              payload: { part_sku: "FUSER-9", qty_delta: 2 }
              as: FleetOpsController
            - call: "POST /sites/${s1}/spare-part-stocks"
              payload: { part_sku: "FUSER-9", qty_delta: -1 }
              as: FleetOpsController
            - call: "POST /sites/${s1}/spare-part-stocks"
              payload: { part_sku: "FUSER-9", qty_delta: 0 }
              as: FleetOpsController
            - call: "POST /sites/${s1}/spare-part-stocks"
              payload: { part_sku: "FUSER-9", qty_delta: -2 }
              as: FleetOpsController
            - call: "POST /sites/00000000-0000-4000-8000-000000000000/spare-part-stocks"
              payload: { part_sku: "FUSER-9", qty_delta: 5 }
              as: FleetOpsController
          assert:
            - "trigger call 1 returns HTTP status 200 with on_hand_qty == 2, reserved_qty == 0 and version == 1"
            - "trigger call 2 returns HTTP status 200 with on_hand_qty == 1 and version == 2"
            - "trigger call 3 returns HTTP status 409 with error.id == ERR_PART_STOCK_UNDERFLOW"
            - "trigger call 4 returns HTTP status 409 with error.id == ERR_PART_STOCK_UNDERFLOW"
            - "trigger call 5 returns HTTP status 404 with error.id == ERR_SITE_NOT_FOUND"
            - "GET /sites/${s1}/spare-part-stocks returns exactly 1 row with part_sku FUSER-9 and on_hand_qty 1"
            - "GET /sites/${s1}/spare-part-stocks?part_sku=DRUM-4 returns exactly 0 rows"

