              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme Health", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /authorizations/${auth_id}/submit"
              payload: {}
              as: Authorizer
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", authorization_id: "${auth_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_AUTH_NOT_APPROVED"
            - "TreatmentPlan.${plan_id}.status remains DRAFT"

      - name: cross_dispense_requires_garment_order_approved
        grounds:
          - validations[priority=6]
          - entities.Dispense.fields.garment_order_id
        distinguishing_aspect: "Dispense creation is gated by the GarmentOrder state: dispensing against a DRAFT (not APPROVED) order returns ERR_GARMENT_ORDER_NOT_APPROVED (Dispense depends on GarmentOrder) — a different entity pair than plan/auth."
        test_recipe:
          setup:
            - "Patient with FINALIZED LEFT_ARM eval; a DRAFT garment order (l_code L8100); a DME item with matching l_code L8100 and stock 10."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Cro Two", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Clinician
              captures: { pat_v2: $.data.version }
            - call: "POST /garment-orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", quantity: 1, expected_patient_version: "${pat_v2}" }
              as: Clinician
              captures: { go_id: $.data.id }
            - call: "POST /dme-items"
              payload: { sku: "SLV-L8100", l_code: "L8100", initial_stock_qty: 10 }
              as: DMECoordinator
              captures: { dme_id: $.data.id }
          trigger:
            - call: "POST /dispenses"
              payload: { garment_order_id: "${go_id}", dme_item_id: "${dme_id}", quantity: 1 }
              as: DMECoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_GARMENT_ORDER_NOT_APPROVED"
            - "DMEItem.${dme_id}.on_hand_qty remains 10 (no stock decremented)"

