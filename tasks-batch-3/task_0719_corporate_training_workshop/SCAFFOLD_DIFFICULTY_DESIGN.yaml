      - name: withdraw_promotion_conserves_total_occupancy
        grounds:
          - state_machines.Registration.CONFIRMED_to_WITHDRAWN
          - state_machines.Registration.WAITLISTED_to_ENROLLED
          - entities.Cohort.fields.seats_reserved
          - entities.Cohort.fields.seats_confirmed
          - entities.Cohort.fields.seats_waitlisted
        distinguishing_aspect: |
          DIFFERENT conserved quantity = seat occupancy ledger (seats_reserved + seats_confirmed): when a CONFIRMED
          learner withdraws and the earliest WAITLISTED is promoted, the freed confirmed seat is reoccupied by the
          promotion, so seats_reserved + seats_confirmed is unchanged (1 before, 1 after) — a different invariant
          quantity than the contract budget ledger.
        test_recipe:
          setup:
