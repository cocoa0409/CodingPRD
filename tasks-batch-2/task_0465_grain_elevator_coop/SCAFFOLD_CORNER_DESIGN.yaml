        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / settlement_state_beats_referential_contract_not_priced_vs_commodity_mismatch
          rationale: "ERR_COMMODITY_MISMATCH is asserted as the winning error of the named §1.8 priority-pair instance."

      - name: error_stale_version_settlement_post_412
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[settlement-post-stale-position]"]
        distinguishing_aspect: "ERR_STALE_VERSION is triggerable: posting a settlement whose expected_storage_position_version is one behind the position's current version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A 1000-bushel DELAYED_PRICE position; a PRICED 1000-bushel contract; a DRAFT 400-bushel settlement; the position version observed BEFORE any version-advancing freeze."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${cid}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "SS Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos: $.data.storage_position_id }
            - call: "GET /commodities/storage-positions/${pos}"
              payload: {}
              as: SettlementOfficer
              captures: { pv_stale: $.data.version }
            - call: "POST /commodities/storage-positions/${pos}/freeze-charge"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/contracts"
              payload: { member_id: "${mid}", commodity_id: "${cid}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { con: $.data.id }
            - call: "POST /commodities/contracts/${con}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${con}", storage_position_id: "${pos}", priced_bushels: 400, storage_basis: "ESTIMATE" }
              as: SettlementOfficer
              captures: { st: $.data.id }
          trigger:
            - call: "POST /commodities/settlements/${st}/post"
              payload: { expected_storage_position_version: "${pv_stale}" }
              as: SettlementOfficer
              captures: { err: $.data.error_id }
          assert:
