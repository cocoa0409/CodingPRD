  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_occ_series_hold_plan_rejects_superseded_version
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[hold-plan-supersede-stale-series]
          - endpoints[POST /series/{seriesId}/hold-plans]
          - errors[ERR_STALE_SERIES_VERSION]
        distinguishing_aspect: "The hold-plan write is guarded by the Series version, and activation already consumed one increment: the version captured at creation is stale by the time the plan is granted, the current one succeeds, and replaying that same value is stale in turn — the guard is checked after the series-active gate but before any hold slots are written."
        test_recipe:
          setup:
            - "Producer P is ACTIVE and BASIC with [STUDIO_FLOOR]."
            - "Series S is created (version v0), then activated (version v1)."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {e_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${e_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${e_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /series"
              payload: {producer_id: "${p_id}", title: "Harbor Nights", cadence: "WEEKLY", first_air_date: "2026-08-20"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {s_id: $.data.id, v0: $.data.version}
            - call: "POST /series/${s_id}/activate"
              payload: {}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {s_state: $.data.status, v1: $.data.version}
          trigger:
            - call: "POST /series/${s_id}/hold-plans"
              payload: {expected_series_version: "${v0}", hold_plan_slots_granted: 4}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {stale_err: $.data.error_id}
            - call: "GET /series/${s_id}"
              payload: {}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {mid_granted: $.data.hold_plan_slots_granted, mid_v: $.data.version}
            - call: "POST /series/${s_id}/hold-plans"
              payload: {expected_series_version: "${v1}", hold_plan_slots_granted: 4}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {ok_granted: $.data.hold_plan_slots_granted, ok_remaining: $.data.remaining_hold_slots, v2: $.data.version}
            - call: "POST /series/${s_id}/hold-plans"
              payload: {expected_series_version: "${v1}", hold_plan_slots_granted: 9}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {replay_err: $.data.error_id}
            - call: "POST /series/${s_id}/hold-plans"
              payload: {expected_series_version: "${v2}", hold_plan_slots_granted: 6}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {second_granted: $.data.hold_plan_slots_granted, v3: $.data.version}
          assert:
            - "${s_state} == ACTIVE and ${v1} == ${v0} + 1 — activation itself bumps the version"
            - "${stale_err} == ERR_STALE_SERIES_VERSION (412) for the creation-time version"
            - "${mid_granted} == 0 and ${mid_v} == ${v1} — the refused write left no partial hold plan and did not bump the version"
            - "${ok_granted} == 4, ${ok_remaining} == 4 and ${v2} == ${v1} + 1"
            - "${replay_err} == ERR_STALE_SERIES_VERSION (412) — replaying the just-consumed version is stale"
            - "${second_granted} == 6 and ${v3} == ${v2} + 1 — every accepted write increments exactly once"

      - name: corner_occ_funding_revision_rejects_superseded_version
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[period-revision-stale-funding-period]
          - endpoints[POST /funding-periods/{periodId}/revise]
          - errors[ERR_STALE_FUNDING_PERIOD_VERSION]
        distinguishing_aspect: "The funding period carries its own version guard with its own error code, so the second revision must present the version the first revision produced; a stale value is refused with ERR_STALE_FUNDING_PERIOD_VERSION rather than the series code, and the refused call leaves basis and revision_round untouched."
        test_recipe:
          setup:
            - "FundingPeriod FP for 2026 Q3 is DRAFT on the ACCRUAL basis with service_period_earned 5000000 and remittance_received 4800000."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: {fiscal_year: 2026, quarter: 3, basis: "ACCRUAL", gross_franchise_fee_cents: 5000000, service_period_earned_cents: 5000000, remittance_received_cents: 4800000, capital_grant_cents: 0}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {fp_id: $.data.id, fv0: $.data.version, fr0: $.data.revision_round}
          trigger:
            - call: "POST /funding-periods/${fp_id}/revise"
              payload: {expected_funding_period_version: "${fv0}", remittance_received_cents: 4900000}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {rev1_remit: $.data.remittance_received_cents, fv1: $.data.version, fr1: $.data.revision_round}
            - call: "POST /funding-periods/${fp_id}/revise"
              payload: {expected_funding_period_version: "${fv0}", basis: "CASH"}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {stale_err: $.data.error_id}
            - call: "GET /funding-periods/${fp_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {mid_basis: $.data.basis, mid_v: $.data.version, mid_round: $.data.revision_round}
            - call: "POST /funding-periods/${fp_id}/revise"
              payload: {expected_funding_period_version: "${fv1}", basis: "CASH"}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {rev2_basis: $.data.basis, fv2: $.data.version, fr2: $.data.revision_round}
          assert:
            - "${rev1_remit} == 4900000, ${fv1} == ${fv0} + 1 and ${fr1} == ${fr0} + 1"
            - "${stale_err} == ERR_STALE_FUNDING_PERIOD_VERSION (412) — not the Series code"
            - "${mid_basis} == ACCRUAL, ${mid_v} == ${fv1} and ${mid_round} == ${fr1} — the refused revision changed nothing"
            - "${rev2_basis} == CASH, ${fv2} == ${fv1} + 1 and ${fr2} == ${fr1} + 1"
            - "FundingPeriod.${fp_id}.allocable_base_cents is still 0 — revisions do not run the allocation before submission"

      - name: corner_channel_airtime_ledger_reconciles_across_create_cancel_air
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers[derived_field_reconciliation]
          - entities.Channel.fields.scheduled_seconds
          - entities.Channel.fields.aired_seconds
          - entities.Channel.fields.slot_sequence_high
          - calculations.playback_window_fit
        distinguishing_aspect: "The channel's two airtime ledgers are maintained by every slot event and must reconcile after each one: booking adds the buffered footprint, cancelling removes only the cancelled slot's share, and airing moves the footprint from scheduled to aired rather than double-counting it — while slot_sequence_high never decreases."
        test_recipe:
          setup:
            - "Producer P is ACTIVE; channel PATV1 is PUBLIC with window 1080-1380 and inter_program_buffer_seconds 120."
            - "Programs PR1 and PR2 are APPROVED, CLEARED, runtime 1800, no crew roles, so each footprint is 1920 seconds."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /channels"
              payload: {call_sign: "PATV1", tier: "PUBLIC", daily_window_start_minute: 1080, daily_window_end_minute: 1380, inter_program_buffer_seconds: 120}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {ch_id: $.data.id, ch_sched0: $.data.scheduled_seconds, ch_aired0: $.data.aired_seconds, ch_seq0: $.data.slot_sequence_high}
            - call: "POST /programs"
              payload: {producer_id: "${p_id}", title: "Harbor History", runtime_seconds: 1800, is_live: false, required_crew_roles: []}
              as: Producer
              as_user_id: "${p_id}"
              captures: {pr1_id: $.data.id}
            - call: "POST /programs/${pr1_id}/attestations"
              payload: {attestation_kind: "INDEMNIFICATION", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${pr1_id}/attestations"
              payload: {attestation_kind: "COPYRIGHT_CLEARANCE", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${pr1_id}/attestations"
              payload: {attestation_kind: "CONTENT_POLICY", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${pr1_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${pr1_id}/review-claim"
              payload: {}
              as: ContentReviewer
              as_user_id: "rev-1"
            - call: "POST /programs/${pr1_id}/review-decision"
              payload: {decision: "APPROVE"}
              as: ContentReviewer
              as_user_id: "rev-1"
            - call: "POST /programs"
              payload: {producer_id: "${p_id}", title: "Harbor History Two", runtime_seconds: 1800, is_live: false, required_crew_roles: []}
              as: Producer
              as_user_id: "${p_id}"
              captures: {pr2_id: $.data.id}
            - call: "POST /programs/${pr2_id}/attestations"
              payload: {attestation_kind: "INDEMNIFICATION", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${pr2_id}/attestations"
              payload: {attestation_kind: "COPYRIGHT_CLEARANCE", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${pr2_id}/attestations"
              payload: {attestation_kind: "CONTENT_POLICY", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${pr2_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${pr2_id}/review-claim"
              payload: {}
              as: ContentReviewer
              as_user_id: "rev-1"
            - call: "POST /programs/${pr2_id}/review-decision"
              payload: {decision: "APPROVE"}
              as: ContentReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /playback-slots"
              payload: {channel_id: "${ch_id}", program_id: "${pr1_id}", start_at: "2026-08-20T18:00:00Z"}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {sl1_id: $.data.id, sl1_occ: $.data.occupied_seconds, sl1_end: $.data.end_at, sl1_seq: $.data.sequence_number}
            - call: "GET /channels/${ch_id}"
              payload: {}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {sched1: $.data.scheduled_seconds, aired1: $.data.aired_seconds, seq1: $.data.slot_sequence_high}
            - call: "POST /playback-slots"
              payload: {channel_id: "${ch_id}", program_id: "${pr2_id}", start_at: "2026-08-20T19:00:00Z"}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {sl2_id: $.data.id, sl2_seq: $.data.sequence_number}
            - call: "GET /channels/${ch_id}"
              payload: {}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {sched2: $.data.scheduled_seconds, seq2: $.data.slot_sequence_high}
            - call: "POST /playback-slots/${sl2_id}/cancel"
              payload: {cancellation_reason: "Tape not delivered"}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {sl2_status: $.data.status}
            - call: "GET /channels/${ch_id}"
              payload: {}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {sched3: $.data.scheduled_seconds, aired3: $.data.aired_seconds, seq3: $.data.slot_sequence_high}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-20T18:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /playback-slots/${sl1_id}/air"
              payload: {measured_households: 500}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {sl1_status: $.data.status}
            - call: "GET /channels/${ch_id}"
              payload: {}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {sched4: $.data.scheduled_seconds, aired4: $.data.aired_seconds, seq4: $.data.slot_sequence_high}
          assert:
            - "${ch_sched0} == 0, ${ch_aired0} == 0 and ${ch_seq0} == 0 on a fresh channel"
            - "${sl1_occ} == 1920 and ${sl1_end} == 2026-08-20T18:32:00Z — runtime 1800 plus the 120 second buffer"
            - "${sched1} == 1920 with ${aired1} == 0 and ${seq1} == ${sl1_seq} == 1"
            - "${sched2} == 3840 and ${seq2} == ${sl2_seq} == 2"
            - "${sl2_status} == CANCELLED and ${sched3} == 1920, ${aired3} == 0 — only the cancelled slot's footprint is removed"
            - "${seq3} == 2 — the high-water sequence never decreases on cancellation"
            - "${sl1_status} == AIRED and ${sched4} == 0 with ${aired4} == 1920 — the footprint moves, it is not counted twice"
            - "${seq4} == 2 and scheduled_seconds + aired_seconds == 1920 after every step in the sequence"

      - name: corner_cascading_side_effects_full_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.DamageAssessment.FILED_to_FINALIZED
          - state_machines.Producer.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / finalized_major_assessment_cascades_four_levels_to_slot_staffing
          rationale: "That instance verifies the four-level chain end-to-end (assessment to producer to reservations to crew assignments to slot staffing) and pins the ordering, and its sibling covers the withdrawal chain."

      - name: corner_dual_variant_calculation_both_variants
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.franchise_fee_allocation.variants
          - calculations.community_impact_index.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / franchise_allocation_accrual_vs_cash_diverges_on_funding_period
          rationale: "Both declared dual-variant calculations are covered there and in its sibling impact-index instance, including the delta on the PROVISIONAL to FINAL switch."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: corner_immediate_consistency_derived_fields_in_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - entities.Reservation.fields.deposit_hold_cents
          - entities.Producer.fields.deposit_held_cents
        distinguishing_aspect: "Consistency is immediate, so a write's own response already carries every field it derived — the confirm response holds the computed deposit — and a read issued immediately afterwards, with no intervening call, shows the cross-entity ledgers already updated. No second read is ever needed to settle a value."
        test_recipe:
          setup:
            - "Producer P is ACTIVE and BASIC with [STUDIO_FLOOR]."
            - "StudioResource STUDIO-A has base_deposit 12345, replacement_value 900000, capacity_slots 1."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {e_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${e_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${e_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {grade_status: $.data.status}
            - call: "POST /studio-resources"
              payload: {resource_code: "STUDIO-A", resource_class: "STUDIO", required_competency_code: "STUDIO_FLOOR", capacity_slots: 1, turnaround_minutes: 30, base_deposit_cents: 12345, replacement_value_cents: 900000}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {res_id: $.data.id}
          trigger:
            - call: "GET /producers/${p_id}"
              payload: {}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {cert_now: $.data.certification_level, comps: $.data.competency_codes}
            - call: "POST /reservations"
              payload: {producer_id: "${p_id}", resource_id: "${res_id}", start_at: "2026-08-20T10:00:00Z", end_at: "2026-08-20T12:00:00Z"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {r_id: $.data.id, r_hold_at_request: $.data.deposit_hold_cents, r_risk: $.data.risk_bp}
            - call: "POST /reservations/${r_id}/confirm"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {conf_hold: $.data.deposit_hold_cents, conf_status: $.data.status}
            - call: "GET /producers/${p_id}"
              payload: {}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_held: $.data.deposit_held_cents}
            - call: "GET /studio-resources/${res_id}"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {res_open: $.data.open_reservation_count}
          assert:
            - "${grade_status} == PASSED and the very next read shows ${cert_now} == BASIC with ${comps} containing STUDIO_FLOOR — the certification recompute is not deferred"
            - "${r_hold_at_request} == 0 and ${r_risk} == 0 while the reservation is only REQUESTED"
            - "${conf_status} == CONFIRMED and ${conf_hold} == 12962 is present in the confirm response itself, not only on a later read"
            - "${p_held} == 12962 and ${res_open} == 1 on reads issued immediately after the confirm, with no intervening call"
            - "Repeating either read returns the identical values — nothing settles late"
