          The outreach launch reads a different aggregate's state: the area is DESIGNATED and
          ANALYZED and the target is valid, yet the launch fails with ERR_CYCLE_NOT_OPEN
          because the referenced CrsCycle has already moved to SUBMITTED.
        test_recipe:
          setup:
            - "Community with one parcel in mapped_area_code RLA-1 and a DESIGNATED, ANALYZED repetitive loss area with property_count 1."
            - "One SUBMITTED HigherStandard so the cycle can be submitted; CrsCycle 2026 moved from OPEN to SUBMITTED."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
