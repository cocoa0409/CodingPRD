            - "A PORT_CANCELLED itinerary change is drafted but never published."
            - "The clock is then advanced to 2026-09-01T12:00:00Z and ops-run sails the voyage."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
