      - name: kit_allocation_handling_rate_tier_flips_at_five_thousand_of_parts_value
        claim_type: tiered_pricing
        grounds:
          - calculations.kit_allocation_charge
          - endpoints["POST /kit-allocations"]
        distinguishing_aspect: |
          The handling tier is keyed on parts_extended, and the boundary is inclusive at 5000: five units
          at 1000.00 give parts_extended 5000.00 in the 0.08 band for a 5400.00 total, while five units at
          1000.01 give 5000.05, cross into the 0.05 band and total only 5250.05 - the dearer kit is
          cheaper overall, which is impossible if the rate is keyed on total_charge or the boundary is
          exclusive.
        test_recipe:
          setup:
            - "Two RepairKits in group IG-HSC-14 cover generation 2: KIT-TIER-A at 1000.00 and KIT-TIER-B at 1000.01."
            - "Each kit has received 5 units; BuildOrder SN-0001 is PLANNED."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
