              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SAFETY_HOLD (priority 8 beats priority 9 temporal coupon window)"
            - "Sale.${sale_id}.status == OPEN"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: print_coupon_daily_limit_exact_boundary
        grounds:
          - calculations.coupon_redemption_gate
          - errors[ERR_COUPON_CUSTOMER_LIMIT_REACHED]
        distinguishing_aspect: |
          Numeric equality boundary on the redemption-count metric reached via
          POST /sales/{saleId}/apply-coupon: a PRINT coupon with
          per_customer_limit 2 allows the 2nd redemption (count 1 < 2) and
          rejects the 3rd ON THE SAME DAY (count == 2), while a redemption on
          the NEXT day succeeds again (daily reset — the count metric resets at
          calendar-day boundary for PRINT only).
        test_recipe:
          setup:
            - "Item ACTIVE retail 1000; store; customer; PRINT coupon limit 2, PERCENT_OFF_BASKET 10%, window 2026-09-01..2026-09-30, ACTIVE"
            - "clock at 2026-09-05T10:00:00Z"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "BD1", name: "Tape", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1000, floor_margin_pct: 0.05, lead_time_days: 20, unit_weight_kg: 0.1 }
