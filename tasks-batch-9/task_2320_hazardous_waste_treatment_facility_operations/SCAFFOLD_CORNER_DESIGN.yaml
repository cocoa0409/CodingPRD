              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /tsdf/inspection-events"
              payload: { storage_unit_id: "${unit_id}", inspection_type: "AIR_MONITORING", finding_code: "NONE", measured_organic_vapor_ppm: 300.0 }
              as: ComplianceManager
              as_user_id: "cm-01"
            - call: "GET /tsdf/emission-repair-orders?storage_unit_id=${unit_id}"
              payload: {}
              as: ComplianceManager
              captures: { order_id: "$.data[0].id" }
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D001"], physical_form: "SOLID", compatibility_class: "ORGANIC_SOLVENT", ldr_subcategory: "NONE", declared_constituent_ppm: 12000.0, declared_flash_point_c: 42.0, declared_ph: 7.0, requested_treatment_method: "INCINERATION", recertification_months: 1 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${prof_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_v1: $.data.version }
            - call: "POST /tsdf/waste-profiles/${prof_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 12500.0, measured_flash_point_c: 43.0, measured_ph: 7.2, expected_waste_profile_version: "${prof_v1}" }
              as: WasteApprovalChemist
              as_user_id: "chem-01"
            - call: "POST /tsdf/waste-profiles/${prof_id}/decision"
              payload: { decision: "APPROVE", approved_treatment_method: "INCINERATION" }
              as: WasteApprovalChemist
              as_user_id: "chem-02"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Before the move: WasteProfile.${prof_id}.status == APPROVED, EmissionRepairOrder.${order_id}.is_overdue == false, StorageUnit.${unit_id}.posture == OPEN"
            - "EmissionRepairOrder.${order_id}.repair_due_at == 2026-08-16T00:00:00Z"
            - "WasteProfile.${prof_id}.recertification_due_at == 2026-09-01T00:00:00Z"
            - "After the move: WasteProfile.${prof_id}.status == EXPIRED"
            - "After the move: EmissionRepairOrder.${order_id}.is_overdue == true and status == OPEN"
            - "After the move: StorageUnit.${unit_id}.posture == SUSPENDED"
            - "WasteProfile.${prof_id}.version is unchanged by the clock move"

      - name: layer_cascading_side_effects_from_a_leak_finding
        claim_type: cascading_side_effects
        grounds:
          - state_machines.container_compliance_lifecycle.transitions
          - calculations.storage_unit_posture
        excluded_because:
          difficulty_instance: inspection_leak_condemn_unit_suspend_batch_hold_reserved_release
          rationale: |
            That §1.8 instance already walks the four-link CASCADE-1 chain end to end and asserts every
            derived figure it moves, including the released reserve; a second walk would add nothing.

      - name: layer_dual_variant_acceptance_charge
        claim_type: dual_variant_calculation
        grounds:
          - calculations.acceptance_charge
        excluded_because:
          difficulty_instance: manifest_charge_provisional_vs_final_diverges
          rationale: |
            The PROVISIONAL versus FINAL divergence is precisely that §1.8 instance's subject, with both
            variants computed to the cent.

