            - { call: "POST /credentialing/nurses", payload: { full_name: "Cora Constraint", email: "cora.constraint@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-CC1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-10T07:00:00Z", ends_at: "2026-08-10T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh1_id: "$.data.id" } }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-10T12:00:00Z", ends_at: "2026-08-10T20:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Trigger fails 409 with error_id == 'ERR_SHIFT_OVERLAP' (priority 7 constraint) — NOT 'ERR_SHIFT_IN_PAST' (priority 8 temporal), even though 2026-08-10 < current_date 2026-08-15 as well"
            - "Exactly 1 ShiftAssignment exists for ${n_id} (the original ${sh1_id}, still SCHEDULED)"

      - name: discipline_create_referential_beats_state
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_CROSS_NURSE_REFERENCE]
          - errors[ERR_INVALID_NURSE_STATE]
        distinguishing_aspect: |
          Category pair business_referential vs state: the request names a license belonging to a
          DIFFERENT nurse (priority 4 referential) AND targets a TERMINATED nurse (priority 5
          state); the referential error ERR_CROSS_NURSE_REFERENCE MUST win. Third distinct category
          pair.
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; nurse A fully credentialed then TERMINATED; nurse B exists with a DRAFT license L_B."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Ann Ref", email: "ann.ref@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_a: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_a}", state_code: "AZ", license_number: "RN-AZ-AR1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_a: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_a}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_a}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_a: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_a}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_a}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_a}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_a}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_a}" }
            - { call: "POST /credentialing/nurses/${n_a}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses/${n_a}/terminate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Bob Ref", email: "bob.ref@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_b: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_b}", state_code: "AZ", license_number: "RN-AZ-BR1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_b: "$.data.id" } }
          trigger:
            - { call: "POST /credentialing/disciplinary-actions", payload: { nurse_id: "${n_a}", scope: "LICENSE", action_type: "SUSPENSION", effective_on: "2026-08-01", license_id: "${lic_b}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Trigger fails 422 with error_id == 'ERR_CROSS_NURSE_REFERENCE' (priority 4 referential) — NOT 'ERR_INVALID_NURSE_STATE' (priority 5), even though nurse A is TERMINATED"
            - "No DisciplinaryAction row exists for nurse A (GET /credentialing/disciplinary-actions?nurse_id=${n_a} returns 0 rows)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: license_expiry_inclusive_date_boundary
        grounds:
          - state_machines.StateLicense.ACTIVE_to_EXPIRED
          - entities.StateLicense.fields.expires_on
          - calculations.expiry_monitoring_buckets
        distinguishing_aspect: |
          Metric = license expiry DATE vs clock, reached via POST /credentialing/_ops/expiry-sweep.
          The boundary is strictly-greater: expires_on == current_date stays ACTIVE (valid THROUGH
          the expiry date inclusive); only current_date > expires_on expires the license.
        test_recipe:
          setup:
            - "Clock 2026-08-01; nurses M1 and M2 each hold an ACTIVE license expiring 2026-08-15 (submit + PSV VERIFIED + attest completed)."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Mia One", email: "mia.one@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_m1: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_m1}", state_code: "AZ", license_number: "RN-AZ-MO1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2026-08-15" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_m1: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_m1}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_m1}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_m1: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_m1}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_m1}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Max Two", email: "max.two@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_m2: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_m2}", state_code: "AZ", license_number: "RN-AZ-MT1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2026-08-15" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_m2: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_m2}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_m2}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_m2: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_m2}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_m2}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
          trigger:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T23:59:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/_ops/expiry-sweep", payload: {}, as: SystemOperator, as_user_id: "ops-1", captures: { sweep_day_of: "$.data.licenses_expired" } }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/_ops/expiry-sweep", payload: {}, as: SystemOperator, as_user_id: "ops-1", captures: { sweep_day_after: "$.data.licenses_expired" } }
          assert:
            - "On 2026-08-15 (== expires_on): sweep licenses_expired == 0; both licenses remain ACTIVE (inclusive expiry)"
            - "On 2026-08-16 (expires_on + 1 day): sweep licenses_expired == 2; StateLicense.${lic_m1}.status == 'EXPIRED' and StateLicense.${lic_m2}.status == 'EXPIRED'"

      - name: session_capacity_exact_full_boundary
        grounds:
          - validations[priority=7]
          - entities.CompetencySession.fields.booked_count
          - errors[ERR_SESSION_FULL]
        distinguishing_aspect: |
          Metric = aggregate booking COUNT vs capacity, reached via
          POST /credentialing/competency-sessions/{id}/bookings. booked_count == capacity - 1 admits
          the next booking; booked_count == capacity rejects with ERR_SESSION_FULL (>= comparison).
          Different metric and endpoint than the license-expiry boundary.
        test_recipe:
          setup:
            - "Clock 2026-08-01; a (non-mandatory) requirement and a session (2026-08-05 09:00-12:00, capacity 2) exist; nurses N1, N2, N3 exist."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "SKILLS_FAIR", name: "Skills Fair", validity_months: 12, window_mode: "ROLLING", mandatory: false, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/competency-sessions", payload: { requirement_id: "${req_id}", title: "Skills Fair AM", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T12:00:00Z", capacity: 2 }, as: NurseManager, as_user_id: "mgr-1", captures: { sess_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Nia One", email: "nia.one@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n1: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Ned Two", email: "ned.two@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n2: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Noa Three", email: "noa.three@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n3: "$.data.id" } }
          trigger:
            - { call: "POST /credentialing/competency-sessions/${sess_id}/bookings", payload: { nurse_id: "${n1}" }, as: NurseManager, as_user_id: "mgr-1", captures: { bk1: "$.data.id" } }
            - { call: "POST /credentialing/competency-sessions/${sess_id}/bookings", payload: { nurse_id: "${n2}" }, as: NurseManager, as_user_id: "mgr-1", captures: { bk2: "$.data.id" } }
            - { call: "POST /credentialing/competency-sessions/${sess_id}/bookings", payload: { nurse_id: "${n3}" }, as: NurseManager, as_user_id: "mgr-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Bookings 1 and 2 succeed (booked_count 0 -> 1 -> 2); booking 3 fails 409 with error_id == 'ERR_SESSION_FULL' exactly at booked_count == capacity == 2"
            - "CompetencySession.${sess_id}.booked_count == 2 after the rejection"
            - "Nurse ${n3} has no booking (GET /credentialing/session-bookings?nurse_id=${n3} returns 0 rows)"

      - name: weekly_hours_exactly_60_allowed
        grounds:
          - calculations.weekly_rolling_hours
          - validations[priority=9]
          - errors[ERR_WEEKLY_HOURS_EXCEEDED]
        distinguishing_aspect: |
          Metric = rolling 7-day integer-minute total vs the 3600-minute cap, reached via
          POST /credentialing/shift-assignments. A cumulative total of exactly 3600 minutes (60.0h)
          is ALLOWED (cap is strictly-greater); adding 480 more minutes (4080 > 3600) is rejected.
          Third distinct metric and endpoint.
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; unit MED (no required certs); nurse Wren ACTIVE/CLEAR (license 2027-06-30, BLS 2027-03-31, competency CURRENT)."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "MED", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Wren Weekly", email: "wren.weekly@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-WW1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
