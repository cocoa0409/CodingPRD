      - name: cycle_draft_to_data_collection_advances_and_recomputes_posture
        claim_type: Valid Transition
        grounds:
          - state_machines.AssessmentCycle.transitions[DRAFT->DATA_COLLECTION]
          - calculations.cycle_posture
        distinguishing_aspect: "The first declared advance moves DRAFT -> DATA_COLLECTION, bumps version 1 -> 2, leaves posture OPEN, and only then are health indicators creatable on the cycle."
        test_recipe:
          setup:
            - "one AssessmentCycle in DRAFT"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
          trigger:
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 409 with data.error_id == ERR_INVALID_STATE — the creation-time parent gate requires cycle.status == DATA_COLLECTION"
            - "trigger call 2: HTTP 200 with data.status == DATA_COLLECTION, data.posture == OPEN, data.version == 2"
            - "trigger call 3: HTTP 201 — the same request that failed before the transition now succeeds"

      - name: advance_rejected_when_coverage_or_selected_priority_preconditions_unmet
        claim_type: Precondition Enforcement
        grounds:
          - validations.priority_23.ERR_INSUFFICIENT_INDICATOR_COVERAGE
          - validations.priority_23.ERR_NO_SELECTED_PRIORITY
          - state_machines.PriorityCandidate.transitions[SCORED->DEFERRED]
        distinguishing_aspect: "Each advance carries its own quantitative precondition: with zero SUFFICIENT indicators the DATA_COLLECTION -> INPUT_GATHERING advance is rejected, and after the only scored candidate is DEFERRED instead of selected the PRIORITIZATION -> STRATEGY_DEVELOPMENT advance is rejected."
        test_recipe:
          setup:
            - "AssessmentCycle in DATA_COLLECTION with one HealthIndicator carrying a single OVERALL data point (data_state INSUFFICIENT)"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
