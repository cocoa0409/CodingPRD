  - rule_id: cross_entity_state_dependency
    instances:
      - name: ready_for_construction_requires_effective_offtake
        grounds:
          - state_machines.Project.DEVELOPMENT_to_READY_FOR_CONSTRUCTION
          - errors[ERR_OFFTAKE_REQUIRED]
        distinguishing_aspect: |
          Entity pair Project -> OfftakeAgreement: the project transition is gated
          on a DIFFERENT entity reaching EFFECTIVE; an EXECUTED-but-not-EFFECTIVE
          offtake does not satisfy the gate.
        test_recipe:
          setup:
            - "Project P in DEVELOPMENT with interconnection request in AGREEMENT_EXECUTED; offtake OA in EXECUTED (not yet EFFECTIVE)"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Gate Farm", technology: "WIND", target_capacity_mw: 90, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/site-control-instruments"
              payload: { parcel_id: "PCL-G1", instrument_type: "LAND_OPTION", start_date: "2026-09-01T00:00:00Z", end_date: "2028-09-01T00:00:00Z", exercise_price_usd: 60000 }
              as: DeveloperAdmin
              captures: { sc: $.data.id }
            - call: "POST /api/site-control-instruments/${sc}/transitions"
              payload: { to: "EXECUTED" }
              as: DeveloperAdmin
            - call: "POST /api/site-control-instruments/${sc}/transitions"
              payload: { to: "EXERCISED" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "SITE_SECURED" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/interconnection-requests"
              payload: { cluster_id: "CL-G", requested_capacity_mw: 90 }
              as: OriginationManager
              captures: { ir: $.data.id }
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "DEVELOPMENT" }
              as: DeveloperAdmin
            - call: "POST /api/interconnection-requests/${ir}/transitions"
              payload: { to: "FEASIBILITY_STUDY" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/studies"
              payload: { phase: "FEASIBILITY", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T00:00:00Z" }
              as: OriginationManager
              captures: { s1: $.data.id }
            - call: "POST /api/interconnection-studies/${s1}/transitions"
              payload: { to: "IN_PROGRESS" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${s1}/transitions"
              payload: { to: "DELIVERED" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${s1}/transitions"
              payload: { to: "ACCEPTED" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/transitions"
              payload: { to: "SYSTEM_IMPACT_STUDY" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/studies"
              payload: { phase: "SYSTEM_IMPACT", window_start: "2026-11-06T00:00:00Z", window_end: "2026-12-15T00:00:00Z" }
              as: OriginationManager
              captures: { s2: $.data.id }
            - call: "POST /api/interconnection-studies/${s2}/transitions"
              payload: { to: "IN_PROGRESS" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${s2}/transitions"
              payload: { to: "DELIVERED" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${s2}/transitions"
              payload: { to: "ACCEPTED" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/allocate-upgrade-costs"
