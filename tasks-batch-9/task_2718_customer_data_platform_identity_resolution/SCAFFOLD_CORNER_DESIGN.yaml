# =============================================================================
# §1.9 Scaffold Corner Design — customer-data-platform-identity-resolution (task 2718)
#
# BREADTH probe. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth probe: 9 hard reasoning
# rules x 2 instances. This file walks references/claim-extraction-guide.md row by row against
# SCAFFOLD.yaml §1.1-§1.7 and emits one instance per applicable row. Where a §1.8 instance
# already asserts the corner, an `excluded_because:` stub cites it by name and carries no
# test_recipe.
#
# `section:` values are the guide's nine sections; `claim_type:` values are that section's
# table rows (snake_cased). Every setup_api_calls chain drives empty-DB to the precondition
# using only endpoints declared in §1.5, so test-state reachability is guaranteed.
#
# The logical clock defaults to 2026-08-01T00:00:00Z (§1.5 POST /cdp/_clock/set_current_utc);
# every chain sets it explicitly anyway so no instance depends on the default.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES (13 entities; entity_topology: graph)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_source_system_returns_201_with_envelope_and_defaults
        claim_type: creation
        grounds:
          - entities.SourceSystem
          - endpoints[POST /cdp/source-systems]
          - response_envelope.success
        distinguishing_aspect: "POST /cdp/source-systems with only the three required fields returns 201, response_type object, and a data payload carrying every declared field including the system and computed ones."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /cdp/source-systems"
              payload:
                code: "POS_MAIN"
                display_name: "Point of Sale Main"
                channel_type: "TRANSACTIONS"
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
          assert:
            - "the response status is 201 and meta.api_request_id and meta.api_request_timestamp are both present"
            - "response_type == object"
            - "SourceSystem.${src_id}.code == POS_MAIN and display_name == Point of Sale Main and channel_type == TRANSACTIONS"
            - "SourceSystem.${src_id}.status == REGISTERED"
            - "SourceSystem.${src_id}.dq_window_start_at == 2026-08-01T00:00:00Z"
            - "SourceSystem.${src_id}.version == 1 and created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"

      - name: get_destination_returns_stored_configuration
        claim_type: retrieval
        grounds:
          - entities.Destination
          - endpoints[GET /cdp/destinations/{destinationId}]
        distinguishing_aspect: "GET /cdp/destinations/{destinationId} echoes exactly the stored configuration, including the derived remaining_daily_hash_quota and quota_reset_on that the create call seeded."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one Destination registered with an explicit non-default configuration."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/destinations"
              payload:
                code: "ADNET_READ"
                platform_kind: "ADVERTISING"
                channel: "EMAIL"
                hashing_algorithm: "SHA256_EMAIL_LOWER"
                daily_hash_quota: 750
                match_rate_basis: "NET"
                min_match_rate: 0.6500
                min_audience_size: 5
                cooldown_minutes: 30
                max_concurrent_activations: 3
                sensitive_attribute_permitted: true
                deletion_ack_sla_hours: 48
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { dest_id: "$.data.id" }
          trigger:
            - call: "GET /cdp/destinations/${dest_id}"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          assert:
            - "the response status is 200"
            - "Destination.${dest_id}.match_rate_basis == NET and min_match_rate == 0.6500 and min_audience_size == 5"
            - "Destination.${dest_id}.cooldown_minutes == 30 and max_concurrent_activations == 3 and deletion_ack_sla_hours == 48"
            - "Destination.${dest_id}.sensitive_attribute_permitted == true and status == ACTIVE"
            - "Destination.${dest_id}.remaining_daily_hash_quota == 750 and quota_reset_on == 2026-08-01"
            - "Destination.${dest_id}.underperforming_activation_count == 0"

      - name: list_profiles_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /cdp/profiles]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /cdp/profiles with limit 2 over a three-profile batch returns exactly 2 elements with total_count 3 and has_more true, and offset 2 returns the last element with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem and one PROMOTED batch of three fully valid records with distinct identifiers, so exactly three Profiles exist, ordered created_at ASC then id ASC."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "PAGE_SRC"
                display_name: "Pagination Feed"
                channel_type: "WEB"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Pagination Triple"
                records:
                  - external_id: "PG1"
                    email_raw: "pg1@example.com"
                    phone_raw: "+1 (555) 200-0001"
                    loyalty_number: "LY00002001"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-20T10:00:00Z"
                    consent_signals: []
                  - external_id: "PG2"
                    email_raw: "pg2@example.com"
                    phone_raw: "+1 (555) 200-0002"
                    loyalty_number: "LY00002002"
                    first_name: "Ben"
                    last_name: "Bravo"
                    postal_code: "10002"
                    address_line: null
                    event_timestamp: "2026-07-20T11:00:00Z"
                    consent_signals: []
                  - external_id: "PG3"
                    email_raw: "pg3@example.com"
                    phone_raw: "+1 (555) 200-0003"
                    loyalty_number: "LY00002003"
                    first_name: "Cleo"
                    last_name: "Charlie"
                    postal_code: "10003"
                    address_line: null
                    event_timestamp: "2026-07-20T12:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
          trigger:
            - call: "GET /cdp/profiles"
              payload: { origin_batch_id: "${batch_id}", limit: 2, offset: 0 }
              as: IdentitySteward
              as_user_id: "u_steward"
              captures: { first_page_head_id: "$.data[0].id" }
            - call: "GET /cdp/profiles"
              payload: { origin_batch_id: "${batch_id}", limit: 2, offset: 2 }
              as: IdentitySteward
              as_user_id: "u_steward"
              captures: { second_page_head_id: "$.data[0].id" }
          assert:
            - "trigger step 1 returns response_type array with exactly 2 elements, total_count 3, has_more true, limit 2, offset 0"
            - "trigger step 2 returns exactly 1 element, total_count 3, has_more false, offset 2"
            - "${first_page_head_id} != ${second_page_head_id}"
            - "the concatenation of both pages is ordered created_at ASC then id ASC with no duplicated and no omitted profile"

      - name: get_profile_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=7]
          - errors[ERR_PROFILE_NOT_FOUND]
          - endpoints[GET /cdp/profiles/{profileId}]
        distinguishing_aspect: "GET /cdp/profiles/{profileId} for an id that was never minted returns 404 ERR_PROFILE_NOT_FOUND, not an empty 200."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "GET /cdp/profiles/prof_does_not_exist"
              payload: {}
              as: IdentitySteward
              as_user_id: "u_steward"
          assert:
            - "the response status is 404"
            - "the response body error_id == ERR_PROFILE_NOT_FOUND"
            - "response_type == error"

      - name: create_destination_without_hashing_algorithm_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /cdp/destinations]
        distinguishing_aspect: "hashing_algorithm has source input and no default, so omitting it from POST /cdp/destinations returns 400 ERR_INVALID_REQUEST and no Destination is created."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /cdp/destinations"
              payload:
                code: "NO_HASH"
                platform_kind: "ADVERTISING"
                channel: "EMAIL"
                daily_hash_quota: 500
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          assert:
            - "the response status is 400"
            - "the response body error_id == ERR_INVALID_REQUEST"
            - "GET /cdp/destinations returns total_count 0"

      - name: destination_optional_config_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Destination.fields.match_rate_basis
          - entities.Destination.fields.min_audience_size
          - entities.Destination.fields.cooldown_minutes
          - endpoints[POST /cdp/destinations]
        distinguishing_aspect: "Omitting every optional Destination field yields exactly the declared defaults: GROSS, 0.70, 50, 60, 2, false, 72, ACTIVE."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /cdp/destinations"
              payload:
                code: "DEFAULTS_ONLY"
                platform_kind: "MESSAGING"
                channel: "SMS"
                hashing_algorithm: "SHA256_PHONE_E164"
                daily_hash_quota: 400
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { dest_id: "$.data.id" }
          assert:
            - "Destination.${dest_id}.match_rate_basis == GROSS"
            - "Destination.${dest_id}.min_match_rate == 0.70"
            - "Destination.${dest_id}.min_audience_size == 50"
            - "Destination.${dest_id}.cooldown_minutes == 60"
            - "Destination.${dest_id}.max_concurrent_activations == 2"
            - "Destination.${dest_id}.sensitive_attribute_permitted == false"
            - "Destination.${dest_id}.deletion_ack_sla_hours == 72"
            - "Destination.${dest_id}.status == ACTIVE and remaining_daily_hash_quota == 400"

      - name: segment_uses_sensitive_attributes_is_computed_from_criteria
        claim_type: computed_fields
        grounds:
          - entities.Segment.fields.uses_sensitive_attributes
          - calculations.segment_membership_set
          - endpoints[POST /cdp/segments]
        distinguishing_aspect: "uses_sensitive_attributes is derived from the criteria attribute set (true when any criterion names inferred_health_interest, inferred_ethnicity_affinity or precise_geolocation_grid) and is never read from the request body."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no profiles needed because the claim is about the derived flag."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /cdp/segments"
              payload:
                name: "Plain Postal Segment"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { plain_seg_id: "$.data.id" }
            - call: "POST /cdp/segments"
              payload:
                name: "Health Interest Segment"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
                  - { attribute: "inferred_health_interest", operator: "EQ", value: "DIABETES_CARE" }
                governance_justification: "Pharmacy adherence outreach approved by legal counsel."
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { sensitive_seg_id: "$.data.id" }
          assert:
            - "Segment.${plain_seg_id}.uses_sensitive_attributes == false"
            - "Segment.${sensitive_seg_id}.uses_sensitive_attributes == true"
            - "both segments have status DRAFT, sensitive_use_approved false, rejection_count 0 and member_count 0"

      - name: source_system_status_and_counters_are_system_owned_input_ignored
        claim_type: system_fields
        grounds:
          - entities.SourceSystem.fields.status
          - entities.SourceSystem.fields.dq_pass_rate
          - endpoints[POST /cdp/source-systems]
        distinguishing_aspect: "status, dq_pass_rate, submitted_record_total, quarantine_count, id, created_at, updated_at and version are server-owned: a create body that tries to set them is ignored and the server values are used."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /cdp/source-systems"
              payload:
                code: "SYS_FIELDS"
                display_name: "System Fields Probe"
                channel_type: "APP"
                status: "ACTIVE"
                dq_pass_rate: 0.1234
                submitted_record_total: 999
                quarantine_count: 7
                id: "src_client_chosen"
                version: 42
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
          assert:
            - "${src_id} != src_client_chosen"
            - "SourceSystem.${src_id}.status == REGISTERED, not ACTIVE"
            - "SourceSystem.${src_id}.dq_pass_rate == 1.0"
            - "SourceSystem.${src_id}.submitted_record_total == 0 and valid_record_total == 0 and quarantine_count == 0"
            - "SourceSystem.${src_id}.version == 1"

      - name: create_source_system_with_invalid_channel_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.SourceSystem.fields.channel_type
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "channel_type outside {TRANSACTIONS, LOYALTY, WEB, APP, SUPPORT} and trust_tier outside 1..5 are both 400 ERR_INVALID_REQUEST at §1.4 priority 4, before any uniqueness or business check."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /cdp/source-systems"
              payload:
                code: "BAD_ENUM"
                display_name: "Bad Enum Feed"
                channel_type: "CALL_CENTER"
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "BAD_TIER"
                display_name: "Bad Tier Feed"
                channel_type: "WEB"
                trust_tier: 9
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "lowercase_bad"
                display_name: "Bad Code Feed"
                channel_type: "WEB"
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          assert:
            - "all three trigger calls return status 400 with error_id ERR_INVALID_REQUEST"
            - "GET /cdp/source-systems returns total_count 0"

      - name: consent_record_is_append_only_and_corrected_by_supersession
        claim_type: immutability
        grounds:
          - entities.ConsentRecord
          - calculations.effective_channel_consent
          - endpoints[POST /cdp/consent-records]
        distinguishing_aspect: "§1.5 declares no update or delete endpoint for ConsentRecord, so a corrected election is expressed by capturing a NEW record: the later capture becomes precedence_rank 1 / ACTIVE and the earlier one is rewritten to SUPERSEDED rather than edited away."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem and one PROMOTED batch of a single fully valid record carrying an EMAIL/MARKETING OPT_IN signal captured at 2026-07-21T10:00:00Z, so one ACTIVE ConsentRecord exists."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "IMMUT_SRC"
                display_name: "Immutability Feed"
                channel_type: "LOYALTY"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Immutability Single"
                records:
                  - external_id: "IM1"
                    email_raw: "im1@example.com"
                    phone_raw: "+1 (555) 210-0001"
                    loyalty_number: "LY00002101"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-21T10:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "GET /cdp/profiles"
              payload: { origin_batch_id: "${batch_id}" }
              as: PrivacyOfficer
              as_user_id: "u_privacy"
              captures: { subject_id: "$.data[0].id", subject_v: "$.data[0].version" }
            - call: "GET /cdp/consent-records"
              payload: { profile_id: "${subject_id}" }
              as: PrivacyOfficer
              as_user_id: "u_privacy"
              captures: { first_consent_id: "$.data[0].id" }
          trigger:
            - call: "POST /cdp/consent-records"
              payload:
                profile_id: "${subject_id}"
                source_system_id: "${src_id}"
                channel: "EMAIL"
                purpose: "MARKETING"
                consent_state: "OPT_OUT"
                captured_at: "2026-07-25T10:00:00Z"
                expected_profile_version: "${subject_v}"
              as: PrivacyOfficer
              as_user_id: "u_privacy"
              captures: { second_consent_id: "$.data.id" }
          assert:
            - "the response status is 201 and ${second_consent_id} != ${first_consent_id}"
            - "ConsentRecord.${second_consent_id}.precedence_rank == 1 and status == ACTIVE and consent_state == OPT_OUT"
            - "ConsentRecord.${first_consent_id}.precedence_rank == 2 and status == SUPERSEDED and consent_state is still OPT_IN"
            - "ConsentRecord.${first_consent_id}.captured_at is unchanged at 2026-07-21T10:00:00Z"
            - "Profile.${subject_id}.activatable_channels == []"
            - "Profile.${subject_id}.channel_engagement_score == 0.00"

      - name: create_ingest_batch_with_unknown_source_system_not_found
        claim_type: parent_relationships
        grounds:
          - entities.IngestBatch.fields.source_system_id
          - validations[priority=5]
          - errors[ERR_SOURCE_SYSTEM_NOT_FOUND]
        distinguishing_aspect: "IngestBatch.source_system_id is a declared FK, so a batch naming a source id that does not exist returns 404 ERR_SOURCE_SYSTEM_NOT_FOUND and no batch is stored."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z. No SourceSystem is registered."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "src_does_not_exist"
                batch_label: "Orphan Batch"
                records:
                  - external_id: "OR1"
                    email_raw: "or1@example.com"
                    phone_raw: "+1 (555) 220-0001"
                    loyalty_number: "LY00002201"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-22T10:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
          assert:
            - "the response status is 404"
            - "the response body error_id == ERR_SOURCE_SYSTEM_NOT_FOUND"
            - "GET /cdp/ingest-batches returns total_count 0"

      - name: identity_link_junction_is_reverse_listable_from_both_profiles
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.IdentityLink.fields.left_profile_id
          - endpoints[GET /cdp/identity-links]
        distinguishing_aspect: "IdentityLink is the many-to-many junction of the profile graph: one link is reachable by filtering GET /cdp/identity-links on left_profile_id and on right_profile_id, and the pair is unordered for duplicate detection but ordered in storage."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem, one PROMOTED batch of two fully valid records with different postal codes and different last names (so the promote pass mints no automatic link), and one PROBABILISTIC MatchRule with review_floor 0.65."
            - "One PROPOSED IdentityLink over the pair at confidence 0.8500."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "GRAPH_SRC"
                display_name: "Graph Feed"
                channel_type: "WEB"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
