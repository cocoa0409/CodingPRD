scenario: |
  Campus Space & Event Scheduling (university scheduling office): room inventory
  with capacity/features & academic priority windows, term scheduling optimization
  vs ad-hoc event requests, conflict detection & bumping rules, service orders
  (AV/catering/custodial/security) attached to events, internal vs external rate
  structure & insurance, cancellation policy & no-show tracking, utilization
  analytics, key/access provisioning

domain_name: campus-space-event-scheduling
api_prefix: /campus

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Organization display name" }
      - { name: org_type, type: enum, source: input, description: "INTERNAL_DEPARTMENT | STUDENT_GROUP | EXTERNAL; drives precedence_tier and rate selection" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: insurance_certificate_expiry, type: datetime, source: input, description: "Liability insurance certificate expiry (null allowed; required-valid for EXTERNAL confirm)", default: null }
      - { name: insurance_coverage_cents, type: integer, source: input, description: "Liability coverage amount in cents (EXTERNAL confirm gate)", default: null }
      - { name: no_show_count, type: integer, source: computed, description: "Cumulative no-show strikes; incremented by daily-close NO_SHOW marking; reset by reinstate", default: 0 }
      - { name: standing, type: enum, source: computed, description: "GOOD | PROBATION | SUSPENDED; derived from no_show_count (==2 PROBATION, >=3 SUSPENDED)" }
      - { name: deposit_held_cents, type: integer, source: computed, description: "Sum of deposit_cents over this org's AccessGrants in ISSUED or OVERDUE status", default: 0 }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum over this org's Invoices in PROVISIONAL/FINALIZED/PARTIALLY_PAID of (total_cents - paid_cents - waived_cents)", default: 0 }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room name" }
      - { name: building_code, type: string, source: input, description: "Building code" }
      - { name: capacity, type: integer, source: input, description: "Maximum legal occupancy (attendance <= capacity)" }
      - { name: features, type: array, source: input, description: "Subset of PROJECTOR | VIDEO_CONF | SOUND_SYSTEM | STAGE | PIANO | LAB_BENCHES | KITCHEN_ACCESS | ADA_LIFT", default: [] }
      - { name: turnaround_buffer_minutes, type: integer, source: input, description: "Asymmetric post-event buffer appended to occupancy, not billed", default: 30 }
      - { name: internal_hourly_rate_cents, type: integer, source: input, description: "Hourly rate for INTERNAL_DEPARTMENT requesters" }
      - { name: student_hourly_rate_cents, type: integer, source: input, description: "Hourly rate for STUDENT_GROUP requesters" }
      - { name: external_hourly_rate_cents, type: integer, source: input, description: "Hourly rate for EXTERNAL requesters" }
      - { name: peak_multiplier_bps, type: integer, source: input, description: "Peak multiplier in basis points (12500 = 1.25x); peak = clock-hour bucket starting >= 18:00 UTC or on Sat/Sun (UTC)", default: 12500 }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE" }
      - { name: outage_start_at, type: datetime, source: system, description: "Current outage window start (set by out-of-service)", default: null }
      - { name: outage_end_at, type: datetime, source: system, description: "Current outage window end; daily-close auto-returns room when now >= outage_end_at", default: null }
      - { name: outage_windows, type: array, source: system, description: "Append-only history of {start_at, end_at} outage windows; used by utilization denominator", default: [] }
      - { name: key_count, type: integer, source: input, description: "Physical key inventory slots; decremented permanently when a grant is marked LOST", default: 0 }
      - { name: keys_issued, type: integer, source: computed, description: "Count of this room's AccessGrants in ISSUED or OVERDUE with grant_type PHYSICAL_KEY", default: 0 }
      - { name: keys_lost_total, type: integer, source: computed, description: "Cumulative PHYSICAL_KEY grants marked LOST; key_count + keys_lost_total is invariant", default: 0 }

  - name: TermWindow
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Term name (e.g. Fall 2026)" }
      - { name: term_start_date, type: datetime, source: input, description: "First instructional date (inclusive, UTC midnight)" }
      - { name: term_end_date, type: datetime, source: input, description: "Last instructional date (inclusive, UTC midnight)" }
      - { name: priority_open_at, type: datetime, source: input, description: "Academic priority window opens; daily-close advances DRAFT->SCHEDULING at/after this" }
      - { name: general_open_at, type: datetime, source: input, description: "General ad-hoc approval opens; daily-close advances SCHEDULING->GENERAL at/after this" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULING | GENERAL | CLOSED; advanced only by daily-close clock comparisons" }
      - { name: current_draft_run_id, type: string, source: system, description: "SchedulingRun.id of the live DRAFT run for this term; null when none", default: null }

  - name: AcademicBlock
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> TermWindow.id; term this block competes in" }
      - { name: course_code, type: string, source: input, description: "Course code" }
      - { name: instructor_name, type: string, source: input, description: "Instructor name" }
      - { name: enrollment, type: integer, source: input, description: "Enrolled headcount; room must satisfy capacity >= enrollment" }
      - { name: required_features, type: array, source: input, description: "Subset of Room.features vocabulary the assigned room must superset", default: [] }
      - { name: days_of_week, type: array, source: input, description: "Non-empty subset of MON | TUE | WED | THU | FRI | SAT | SUN (UTC weekdays)" }
      - { name: start_time, type: string, source: input, description: "HH:MM UTC start-of-day time; must be < end_time" }
      - { name: end_time, type: string, source: input, description: "HH:MM UTC end-of-day time" }
      - { name: priority_score, type: integer, source: computed, description: "enrollment*10 + sum(feature weights) + 100 if enrollment >= 100; computed from request data only, never from assigned room" }
      - { name: status, type: enum, source: system, description: "UNPLACED | PLACED" }
      - { name: assigned_room_id, type: string, source: system, description: "FK -> Room.id; null until placed", default: null }
      - { name: scheduling_run_id, type: string, source: system, description: "FK -> SchedulingRun.id; run that placed the block; null until placed", default: null }

  - name: SchedulingRun
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> TermWindow.id; exactly one DRAFT run per term; creating a new one supersedes the prior DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUPERSEDED" }
      - { name: placed_count, type: integer, source: system, description: "Blocks placed by finalize", default: 0 }
      - { name: bumped_event_ids, type: array, source: system, description: "EventReservation ids bumped by finalize, in placement processing order", default: [] }
      - { name: unplaced_block_ids, type: array, source: system, description: "AcademicBlock ids left UNPLACED by finalize, in processing order", default: [] }
      - { name: finalized_at, type: datetime, source: system, description: "Clock time of finalize; null until FINALIZED", default: null }

  - name: EventReservation
    parent: null
    common_fields: true
    fields:
      - { name: requester_org_id, type: string, source: system, description: "FK -> Organization.id; set from X-User-ID of the creating OrgRequester" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; requested room; system-cleared to null on BUMP, set again by rebook" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: expected_attendance, type: integer, source: input, description: "Expected headcount; must be >= 1 and <= room.capacity" }
      - { name: required_features, type: array, source: input, description: "Subset of Room.features vocabulary the room must superset", default: [] }
      - { name: start_at, type: datetime, source: input, description: "Event start (UTC); end_at - start_at must be in [30 minutes, 8 hours]" }
      - { name: end_at, type: datetime, source: input, description: "Event end (UTC); must be > start_at" }
      - { name: setup_minutes, type: integer, source: input, description: "Pre-event occupancy minutes", default: 0 }
      - { name: teardown_minutes, type: integer, source: input, description: "Post-event occupancy minutes", default: 0 }
      - { name: precedence_tier, type: integer, source: computed, description: "From org_type at creation: INTERNAL_DEPARTMENT=200, STUDENT_GROUP=100, EXTERNAL=50; academic blocks outrank all (placement-only)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | CONFIRMED | IN_PROGRESS | COMPLETED | NO_SHOW | CANCELLED | DECLINED | EXPIRED | BUMPED" }
      - { name: decision_deadline, type: datetime, source: computed, description: "created_at + 72h; daily-close EXPIRES REQUESTED events past this" }
      - { name: confirm_deadline, type: datetime, source: computed, description: "approval/rebook time + 48h; confirm allowed while now <= confirm_deadline; daily-close EXPIRES APPROVED past this" }
      - { name: checked_in_at, type: datetime, source: system, description: "Set by check-in; null until IN_PROGRESS", default: null }
      - { name: pinned_hourly_rate_cents, type: integer, source: system, description: "Room rate for requester org_type pinned at approve/rebook time; later room rate edits never reprice this event", default: null }
      - { name: pinned_peak_multiplier_bps, type: integer, source: system, description: "Room peak_multiplier_bps pinned at approve/rebook time", default: null }
      - { name: cancellation_fee_cents, type: integer, source: system, description: "Fee computed at cancel; 0 for ADMIN/BUMPED/ORG_SUSPENDED reasons and >=72h notice", default: null }
      - { name: cancel_reason, type: enum, source: system, description: "CLIENT | ADMIN | BUMPED | ORG_SUSPENDED; null until cancelled", default: null }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the Scheduler who approved (or rebooked); feeds segregation-of-duties on waive", default: null }
      - { name: decline_reason, type: string, source: system, description: "Decline rationale; null unless DECLINED", default: null }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> EventReservation.id; parent event" }
      - { name: category, type: enum, source: input, description: "AV | CATERING | CUSTODIAL | SECURITY" }
      - { name: quantity, type: integer, source: input, description: "Units ordered (>= 1)" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Per-unit cost set at quote; null until QUOTED", default: null }
      - { name: quoted_total_cents, type: integer, source: computed, description: "quantity * unit_cost_cents at quote time; null until QUOTED" }
      - { name: service_start_at, type: datetime, source: input, description: "Service window start; must be within [event.start_at - 2h, event.end_at + 2h]" }
      - { name: service_end_at, type: datetime, source: input, description: "Service window end; > service_start_at; crew shift must cover [service_start_at, service_end_at)" }
      - { name: crew_id, type: string, source: system, description: "FK -> ServiceCrew.id; assigned at schedule; null until SCHEDULED", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | QUOTED | NEEDS_REVISION | APPROVED | SCHEDULED | FULFILLED | INVOICED | CANCELLED" }
      - { name: fee_waived, type: boolean, source: system, description: "True when cancelled by a cascade (bump/admin/no-show), false for requester cancels", default: false }
      - { name: revision_note, type: string, source: system, description: "Note from last request-revision; null otherwise", default: null }

  - name: ServiceCrew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew name" }
      - { name: category, type: enum, source: input, description: "AV | CATERING | CUSTODIAL | SECURITY; must equal order category at schedule" }
      - { name: concurrent_capacity, type: integer, source: input, description: "Max overlapping SCHEDULED orders at any instant (>= 1)" }
      - { name: shift_start, type: string, source: input, description: "HH:MM UTC shift start; shift must cover the full service window" }
      - { name: shift_end, type: string, source: input, description: "HH:MM UTC shift end; > shift_start" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> EventReservation.id; exactly one PROVISIONAL/FINALIZED invoice per event at a time; VOIDED history retained" }
      - { name: org_id, type: string, source: system, description: "FK -> Organization.id; denormalized from event for finance queries" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | PARTIALLY_PAID | PAID | VOIDED | REFUNDED" }
      - { name: room_charge_cents, type: integer, source: computed, description: "Per-bucket rounded sum over billable occupancy [start-setup, end+teardown) using pinned rates" }
      - { name: service_charge_cents, type: integer, source: computed, description: "Provisional: sum quoted_total_cents over orders in QUOTED|APPROVED|SCHEDULED|FULFILLED; Final: sum over FULFILLED|INVOICED only" }
      - { name: insurance_surcharge_cents, type: integer, source: computed, description: "EXTERNAL only: round_half_up(0.02 * (room_charge + service_charge)); 0 otherwise; not applied on cancellation or no-show invoices" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Set at cancel from notice tiers over provisional room+service; 0 otherwise", default: 0 }
      - { name: no_show_fee_cents, type: integer, source: computed, description: "Flat 5000 added on NO_SHOW finalization only", default: 0 }
      - { name: deposit_charge_cents, type: integer, source: computed, description: "Accumulated forfeited key/card deposits (lost=100%, late return=50%)", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "room + service + insurance_surcharge + cancellation_fee + no_show_fee + deposit_charge" }
      - { name: paid_cents, type: integer, source: computed, description: "Cumulative payments", default: 0 }
      - { name: waived_cents, type: integer, source: computed, description: "Cumulative waivers (SoD-gated)", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Cumulative refunds against paid_cents", default: 0 }

  - name: AccessGrant
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> EventReservation.id; event the grant provisions access for" }
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; copied from event.room_id at creation" }
      - { name: grant_type, type: enum, source: input, description: "PHYSICAL_KEY | CARD_ACCESS" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ISSUED | OVERDUE | RETURNED | LOST | REVOKED" }
      - { name: key_slot, type: integer, source: system, description: "Lowest free slot in 1..key_count at issue; PHYSICAL_KEY only; freed on RETURN, retired on LOST", default: null }
      - { name: deposit_cents, type: integer, source: system, description: "7500 for PHYSICAL_KEY, 2500 for CARD_ACCESS; set at issue", default: 0 }
      - { name: deposit_forfeit_cents, type: integer, source: system, description: "0 on-time return; round_half_up(deposit*0.5) late return; full deposit on LOST", default: 0 }
      - { name: return_deadline, type: datetime, source: computed, description: "event.end_at + 24h; daily-close marks ISSUED grants OVERDUE past this" }
      - { name: returned_at, type: datetime, source: system, description: "Return timestamp; null until RETURNED", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Organization
    field: standing
    initial_state: GOOD
    terminal_states: []
    note: "standing is derived from no_show_count; recomputed inside the same daily-close run that increments the count, and by reinstate"
    transitions:
      - from: GOOD
        to: PROBATION
        trigger: "system (POST /campus/ops/daily-close: no_show_count becomes exactly 2)"
        actor: system
        preconditions: ["no_show_count == 2 after increment"]
        side_effects: ["Future confirms by this org require full prepayment of the PROVISIONAL invoice"]
      - from: PROBATION
        to: SUSPENDED
        trigger: "system (POST /campus/ops/daily-close: no_show_count becomes >= 3)"
        actor: system
        preconditions: ["no_show_count >= 3 after increment"]
        side_effects:
          - "This org's events in REQUESTED -> DECLINED (decline_reason ORG_SUSPENDED)"
          - "This org's events in APPROVED -> CANCELLED (cancel_reason ORG_SUSPENDED, fee 0, PROVISIONAL invoice -> VOIDED)"
          - "CONFIRMED/IN_PROGRESS events are NOT touched"
      - from: SUSPENDED
        to: GOOD
        trigger: "POST /campus/organizations/{id}/reinstate"
        actor: Scheduler
        preconditions: ["standing == SUSPENDED"]
        side_effects: ["no_show_count reset to 0"]

  - entity: Room
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "POST /campus/rooms/{id}/out-of-service"
        actor: FacilitiesManager
        preconditions:
          - "No non-bumpable event occupancy overlaps [outage_start_at, outage_end_at); non-bumpable = CONFIRMED with (start_at - now < 72h or ISSUED/OVERDUE grants) or IN_PROGRESS (else ERR_ROOM_BLOCKED)"
        side_effects:
          - "outage_start_at/outage_end_at set; window appended to outage_windows"
          - "Bumpable overlapping events (REQUESTED|APPROVED any; CONFIRMED with start_at - now >= 72h and no ISSUED/OVERDUE grants) -> BUMPED with full bump cascade (invoice VOIDED, service orders CANCELLED waived, REQUESTED grants REVOKED, room_id null)"
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "system (POST /campus/ops/daily-close when now >= outage_end_at)"
        actor: system
        preconditions: ["now >= outage_end_at"]
        side_effects: ["outage_start_at/outage_end_at cleared (history retained in outage_windows)"]

  - entity: TermWindow
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SCHEDULING
        trigger: "system (POST /campus/ops/daily-close when priority_open_at <= now < general_open_at)"
        actor: system
        preconditions: ["now >= priority_open_at"]
        side_effects: ["Ad-hoc approvals for events intersecting [term_start_date, term_end_date] are blocked (ERR_TERM_PRIORITY_LOCKED) until GENERAL"]
      - from: SCHEDULING
        to: GENERAL
        trigger: "system (POST /campus/ops/daily-close when now >= general_open_at)"
        actor: system
        preconditions: ["now >= general_open_at"]
        side_effects: []
      - from: [DRAFT, SCHEDULING, GENERAL]
        to: CLOSED
        trigger: "system (POST /campus/ops/daily-close when now > term_end_date + 1 day)"
        actor: system
        preconditions: ["now > term_end_date + 1 day"]
        side_effects: ["No new academic blocks; no new runs"]

  - entity: AcademicBlock
    field: status
    initial_state: UNPLACED
    terminal_states: []
    transitions:
      - from: UNPLACED
        to: PLACED
        trigger: "system (POST /campus/scheduling-runs/{id}/finalize placement pass)"
        actor: system
        preconditions:
          - "Term status == SCHEDULING"
          - "A feasible or bumpable room selected by scheduling_placement"
        side_effects:
          - "assigned_room_id and scheduling_run_id set"
          - "Any bumpable conflicting events -> BUMPED with bump cascade"
      - from: PLACED
        to: UNPLACED
        trigger: "POST /campus/academic-blocks/{id}/unplace"
        actor: Scheduler
        preconditions: ["status == PLACED"]
        side_effects:
          - "assigned_room_id and scheduling_run_id cleared"
          - "Previously bumped events are NOT retroactively restored (they remain BUMPED and must be rebooked)"

  - entity: SchedulingRun
    field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (POST /campus/scheduling-runs for the same term supersedes the prior DRAFT)"
        actor: system
        preconditions: []
        side_effects: ["Term.current_draft_run_id repointed to the new run"]
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /campus/scheduling-runs/{id}/finalize"
        actor: Scheduler
        preconditions:
          - "status == DRAFT"
          - "Term status == SCHEDULING (else ERR_TERM_PRIORITY_LOCKED)"
          - "No other FINALIZED run exists for this term (else ERR_TERM_ALREADY_FINALIZED)"
        side_effects:
          - "Runs scheduling_placement over the term's UNPLACED blocks"
          - "placed_count, bumped_event_ids, unplaced_block_ids, finalized_at set"
          - "term.current_draft_run_id cleared to null (the run is no longer DRAFT)"
          - "Bump cascade per bumped event (see EventReservation BUMPED transition)"

  - entity: EventReservation
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED, DECLINED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /campus/event-reservations/{id}/approve"
        actor: Scheduler
        preconditions:
          - "Room ACTIVE and capacity >= expected_attendance and features superset required_features"
          - "Occupied interval [start_at - setup, end_at + teardown + room.buffer) conflicts with no APPROVED/CONFIRMED/IN_PROGRESS event occupancy and no outage window on that room"
          - "If [start_at, end_at) intersects a term's [term_start_date, term_end_date], that term must be in GENERAL (else ERR_TERM_PRIORITY_LOCKED)"
          - "Org standing != SUSPENDED (else ERR_ORG_SUSPENDED)"
          - "now <= decision_deadline (else ERR_INVALID_STATE)"
        side_effects:
          - "pinned_hourly_rate_cents and pinned_peak_multiplier_bps captured from room by org_type"
          - "PROVISIONAL Invoice created (room_charge + provisional service + insurance surcharge)"
          - "confirm_deadline = now + 48h; approved_by_user_id = Scheduler X-User-ID"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /campus/event-reservations/{id}/decline"
        actor: Scheduler
        preconditions: ["status == REQUESTED"]
        side_effects: ["decline_reason set"]
      - from: REQUESTED
        to: EXPIRED
        trigger: "system (daily-close when now > decision_deadline)"
        actor: system
        preconditions: ["now > decision_deadline"]
        side_effects: []
      - from: APPROVED
        to: CONFIRMED
        trigger: "POST /campus/event-reservations/{id}/confirm"
        actor: OrgRequester
        preconditions:
          - "Actor owns the event (requester_org_id == X-User-ID, else ERR_NOT_FOUND)"
          - "EXTERNAL org: insurance_certificate_expiry >= end_at AND insurance_coverage_cents >= 100000000 (else ERR_INSURANCE_INVALID)"
          - "now <= confirm_deadline (else ERR_CONFIRM_WINDOW_EXPIRED)"
          - "PROBATION org: provisional invoice paid_cents + waived_cents >= total_cents (else ERR_PREPAYMENT_REQUIRED)"
        side_effects: ["Occupancy becomes hard-locked for conflict checks"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system (daily-close when now > confirm_deadline)"
        actor: system
        preconditions: ["now > confirm_deadline"]
        side_effects: ["PROVISIONAL invoice -> VOIDED"]
      - from: [REQUESTED, APPROVED, CONFIRMED, BUMPED]
        to: CANCELLED
        trigger: "POST /campus/event-reservations/{id}/cancel"
        actor: "OrgRequester (owner, reason CLIENT; reason BUMPED when cancelling from BUMPED) or Scheduler (reason ADMIN)"
        preconditions:
          - "CONFIRMED with any AccessGrant in ISSUED or OVERDUE -> rejected (ERR_ACCESS_GRANTS_OUTSTANDING); return or mark-lost first"
        side_effects:
          - "cancellation_fee_cents per cancellation_fee tiers (CLIENT: >=72h notice 0, [24h,72h) 50% of provisional room+service, <24h 100%; ADMIN: 0; from BUMPED: reason BUMPED, fee 0); REQUESTED and BUMPED events have no live invoice (REQUESTED never had one; BUMPED had its provisional VOIDED at bump time): fee is 0 and no invoice is created or transitioned"
          - "Invoice (if one exists): fee==0 and no FULFILLED orders -> VOIDED; else -> FINALIZED with total = fee + FULFILLED service charges"
          - "Non-terminal service orders -> CANCELLED (fee_waived = (reason != CLIENT))"
          - "AccessGrants in REQUESTED -> REVOKED"
      - from: [REQUESTED, APPROVED, CONFIRMED]
        to: BUMPED
        trigger: "system (scheduling-run finalize placement, room out-of-service, or room capacity reduction below expected_attendance)"
        actor: system
        preconditions:
          - "REQUESTED/APPROVED always bumpable; CONFIRMED bumpable only when start_at - now >= 72h AND no ISSUED/OVERDUE grants"
        side_effects:
          - "room_id -> null"
          - "PROVISIONAL invoice, if one exists (APPROVED/CONFIRMED), -> VOIDED (full waiver); REQUESTED events have no invoice"
          - "Non-terminal service orders -> CANCELLED with fee_waived = true"
          - "AccessGrants in REQUESTED -> REVOKED"
      - from: BUMPED
        to: APPROVED
        trigger: "POST /campus/event-reservations/{id}/rebook"
        actor: "Scheduler or OrgRequester (owner)"
        preconditions:
          - "status == BUMPED"
          - "New room ACTIVE, capacity >= expected_attendance, features superset, no occupancy/outage conflict, term-priority check as approve"
        side_effects:
          - "room_id set to new room; rates re-pinned from the NEW room at rebook time"
          - "New PROVISIONAL Invoice created at new rates (VOIDED history retained)"
          - "confirm_deadline = now + 48h (event must be re-confirmed)"
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /campus/event-reservations/{id}/check-in"
        actor: "OrgRequester (owner) or FacilitiesManager"
        preconditions:
          - "start_at - 30min <= now <= start_at + 15min inclusive (else ERR_CHECKIN_WINDOW_CLOSED)"
        side_effects: ["checked_in_at set"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (daily-close when now > start_at + 15min and checked_in_at is null)"
        actor: system
        preconditions: ["now > check-in deadline; never checked in"]
        side_effects:
          - "Invoice -> FINALIZED: room_charge (100%) + FULFILLED service charges + no_show_fee 5000; no insurance surcharge"
          - "FULFILLED service orders -> INVOICED; other non-terminal orders -> CANCELLED (fee_waived = false)"
          - "Organization.no_show_count += 1; standing recomputed (==2 PROBATION, >=3 SUSPENDED with suspension cascade)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (daily-close when now >= end_at)"
        actor: system
        preconditions: ["now >= end_at"]
        side_effects:
          - "Invoice -> FINALIZED at final variant (FULFILLED service only, insurance surcharge included for EXTERNAL)"
          - "FULFILLED service orders -> INVOICED; SCHEDULED/APPROVED/QUOTED/REQUESTED/NEEDS_REVISION orders -> CANCELLED (fee_waived = true)"

  - entity: ServiceOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /campus/service-orders/{id}/quote"
        actor: ServiceCoordinator
        preconditions: ["Parent event in APPROVED or CONFIRMED (else ERR_INVALID_STATE)"]
        side_effects: ["unit_cost_cents set; quoted_total_cents = quantity * unit_cost_cents; parent PROVISIONAL invoice service_charge recomputed"]
      - from: NEEDS_REVISION
        to: QUOTED
        trigger: "POST /campus/service-orders/{id}/quote"
        actor: ServiceCoordinator
        preconditions: ["Parent event in APPROVED or CONFIRMED"]
        side_effects: ["quoted_total_cents recomputed; revision_note cleared; provisional invoice recomputed"]
      - from: QUOTED
        to: APPROVED
        trigger: "POST /campus/service-orders/{id}/approve"
        actor: OrgRequester
        preconditions: ["Actor owns parent event"]
        side_effects: ["Provisional invoice service_charge recomputed"]
      - from: QUOTED
        to: NEEDS_REVISION
        trigger: "POST /campus/service-orders/{id}/request-revision"
        actor: OrgRequester
        preconditions: ["Actor owns parent event"]
        side_effects: ["revision_note set; order excluded from provisional service_charge while NEEDS_REVISION"]
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /campus/service-orders/{id}/schedule"
        actor: ServiceCoordinator
        preconditions:
          - "crew.category == order.category (else ERR_CREW_CATEGORY_MISMATCH)"
          - "Crew shift [shift_start, shift_end) covers [service_start_at, service_end_at) (else ERR_CREW_SHIFT_MISMATCH)"
          - "Count of the crew's other SCHEDULED orders whose service window overlaps [service_start_at, service_end_at) (half-open; end==start is NOT overlap) < crew.concurrent_capacity (else ERR_CREW_CAPACITY_EXCEEDED)"
        side_effects: ["crew_id set"]
      - from: SCHEDULED
        to: FULFILLED
        trigger: "POST /campus/service-orders/{id}/fulfill"
        actor: ServiceCoordinator
        preconditions: ["now >= service_end_at"]
        side_effects: []
      - from: FULFILLED
        to: INVOICED
        trigger: "system (parent event finalization: completion, cancellation-with-charges, or no-show)"
        actor: system
        preconditions: []
        side_effects: ["Order charge locked into final invoice"]
      - from: [REQUESTED, QUOTED, NEEDS_REVISION, APPROVED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /campus/service-orders/{id}/cancel or system (event bump/cancel/no-show/complete cascade)"
        actor: "ServiceCoordinator, OrgRequester (owner), or system"
        preconditions: []
        side_effects: ["Provisional invoice service_charge recomputed; fee_waived = true only for system cascades"]

  - entity: Invoice
    field: status
    initial_state: PROVISIONAL
    terminal_states: [PAID, VOIDED, REFUNDED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "system (event COMPLETED or NO_SHOW) or POST /campus/event-reservations/{id}/cancel with fee>0 or FULFILLED charges>0"
        actor: "system or OrgRequester/Scheduler via cancel"
        preconditions: []
        side_effects: ["Final-variant totals computed (see final_invoice_total)"]
      - from: PROVISIONAL
        to: VOIDED
        trigger: "system (event BUMPED, APPROVED-expired, ADMIN cancel, ORG_SUSPENDED cancel, or CLIENT cancel with fee==0 and no FULFILLED charges)"
        actor: system
        preconditions: []
        side_effects: ["Excluded from org outstanding_balance_cents"]
      - from: FINALIZED
        to: PARTIALLY_PAID
        trigger: "POST /campus/invoices/{id}/pay with amount_cents < remaining balance"
        actor: "OrgRequester (owner) or FinanceAdmin"
        preconditions: ["amount_cents <= total - paid - waived (else ERR_OVERPAYMENT)"]
        side_effects: ["paid_cents += amount_cents"]
      - from: [PROVISIONAL, FINALIZED, PARTIALLY_PAID]
        to: PAID
        trigger: "POST /campus/invoices/{id}/pay or /waive bringing paid_cents + waived_cents == total_cents"
        actor: "OrgRequester (owner), FinanceAdmin"
        preconditions: ["paid + waived == total exactly (boundary)"]
        side_effects: []
      - from: [PAID, PARTIALLY_PAID]
        to: REFUNDED
        trigger: "POST /campus/invoices/{id}/refund accumulating refunded_cents == paid_cents"
        actor: FinanceAdmin
        preconditions: ["amount_cents <= paid_cents - refunded_cents (else ERR_REFUND_EXCEEDS_PAID)"]
        side_effects: ["refunded_cents += amount_cents; REFUNDED only at full equality"]

  - entity: AccessGrant
    field: status
    initial_state: REQUESTED
    terminal_states: [RETURNED, LOST, REVOKED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /campus/access-grants/{id}/issue"
        actor: FacilitiesManager
        preconditions:
          - "Event status == CONFIRMED (else ERR_INVALID_STATE)"
          - "PHYSICAL_KEY: room.keys_issued < room.key_count (else ERR_NO_KEYS_AVAILABLE)"
        side_effects:
          - "deposit_cents set (7500 key / 2500 card); org.deposit_held_cents += deposit"
          - "PHYSICAL_KEY: key_slot = lowest free slot in 1..key_count; room.keys_issued += 1"
      - from: ISSUED
        to: OVERDUE
        trigger: "system (daily-close when now > return_deadline)"
        actor: system
        preconditions: ["now > event.end_at + 24h"]
        side_effects: []
      - from: [ISSUED, OVERDUE]
        to: RETURNED
        trigger: "POST /campus/access-grants/{id}/return"
        actor: FacilitiesManager
        preconditions: []
        side_effects:
          - "On-time (now <= return_deadline): deposit_forfeit_cents = 0; late: round_half_up(deposit * 0.5)"
          - "org.deposit_held_cents -= deposit_cents; forfeit added to event invoice deposit_charge_cents and total recomputed"
          - "PHYSICAL_KEY: key_slot freed; room.keys_issued -= 1"
      - from: [ISSUED, OVERDUE]
        to: LOST
        trigger: "POST /campus/access-grants/{id}/mark-lost"
        actor: FacilitiesManager
        preconditions: []
        side_effects:
          - "deposit_forfeit_cents = deposit_cents (100%); org.deposit_held_cents -= deposit_cents; forfeit added to event invoice"
          - "PHYSICAL_KEY: room.key_count -= 1 and room.keys_issued -= 1; room.keys_lost_total += 1; key_slot retired (never reused)"
      - from: REQUESTED
        to: REVOKED
        trigger: "system (event bumped, cancelled, declined, or suspended cascade)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-term
    parent_entity: TermWindow
    write_endpoint: "POST /campus/scheduling-runs"
    occ_field: expected_term_version
    description: |
      Creating a SchedulingRun against a TermWindow whose version has advanced
      since the client last observed it is rejected. A successful run creation
      legitimately supersedes the term's prior DRAFT run and repoints
      current_draft_run_id, so a second create carrying the older observed
      version is stale and must be rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reservation-create-stale-room
    parent_entity: Room
    write_endpoint: "POST /campus/event-reservations"
    occ_field: expected_room_version
    description: |
      Creating an EventReservation against a Room whose version has advanced
      since the client last observed it is rejected. Room mutations (capacity,
      rates, buffer, key_count, features, outage) change the booking terms the
      requester priced against, so a create carrying the older observed version
      is stale and must be rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: occupied_interval
    trigger: "event create, approve, rebook, room out-of-service, room PATCH, scheduling-run finalize"
    algorithm: interval_merge
    formula: |
      event_occupancy(e, room) = [e.start_at - e.setup_minutes, e.end_at + e.teardown_minutes + room.turnaround_buffer_minutes)
      Half-open: a conflict exists iff occ1.start < occ2.end AND occ2.start < occ1.end.
      An event ending (occupancy end) at exactly the next event's occupancy start does NOT conflict.
      Buffer is asymmetric: appended after teardown only, never before setup.
      Block instances: for each date d in [term_start_date .. term_end_date] inclusive with
      weekday(d) in days_of_week: [d + start_time, d + end_time); blocks carry NO buffer.
    input_set: "Events in APPROVED|CONFIRMED|IN_PROGRESS on the same room; outage_windows on the room; PLACED blocks on the same room (finalize)"
    precision: "minute resolution; datetimes compared exactly"

  - name: priority_score
    trigger: "scheduling-run finalize, on each UNPLACED block, computed BEFORE any assignment"
    algorithm: weighted_scoring
    formula: |
      score = enrollment * 10
            + sum(FEATURE_WEIGHT[f] for f in required_features)
            + (100 if enrollment >= 100 else 0)
      Feature weights: PIANO 50, STAGE 40, LAB_BENCHES 30, KITCHEN_ACCESS 25,
      VIDEO_CONF 20, SOUND_SYSTEM 15, PROJECTOR 10, ADA_LIFT 5.
      Score depends ONLY on the block's request data — never on any candidate room
      (evaluation order is pinned: score all blocks first, then sort, then assign).
    input_set: "UNPLACED AcademicBlocks of the term at finalize time"
    constants:
      LARGE_CLASS_BONUS: 100
      LARGE_CLASS_THRESHOLD: 100
      ENROLLMENT_WEIGHT: 10
    precision: "integer, exact"

  - name: room_charge_cents
    trigger: "event approve and rebook (provisional invoice creation)"
    algorithm: tiered_pricing
    formula: |
      billable = [start_at - setup_minutes, end_at + teardown_minutes)   # buffer NOT billed
      Split billable into wall-clock-hour buckets aligned to UTC hour boundaries.
      Every touched bucket counts as ONE full billed hour (partial buckets round UP to a full hour).
      A bucket is PEAK iff bucket.start.hour >= 18 (UTC) OR bucket date is Sat/Sun (UTC).
      bucket_charge = round_half_up(pinned_hourly_rate_cents * pinned_peak_multiplier_bps / 10000) if PEAK
                      else pinned_hourly_rate_cents
      room_charge_cents = sum(bucket_charge over buckets)
      ROUNDING ORDER PINNED: round each bucket to cents FIRST, then sum.
      (Sum-then-round is a different, forbidden order: e.g. rate 9999, 3 peak buckets
      gives 37497 per-bucket vs 37496 sum-then-round.)
    input_set: "Single event's billable interval; pinned rate and multiplier"
    precision: "integer cents, round_half_up per bucket then sum"

  - name: cancellation_fee
    trigger: "POST /campus/event-reservations/{id}/cancel with reason CLIENT"
    algorithm: threshold
    formula: |
      notice = event.start_at - now   (exact minute precision)
      base   = provisional invoice.room_charge_cents + provisional invoice.service_charge_cents (pinned snapshot, NOT recomputed)
      fee_bps = 0      if notice >= 72h
                5000   if 24h <= notice < 72h
                10000  if notice < 24h
      cancellation_fee_cents = round_half_up(base * fee_bps / 10000)
      Boundary: notice exactly 72h -> 0; exactly 24h -> 50% tier.
      ADMIN / BUMPED / ORG_SUSPENDED cancels: fee 0 regardless of notice.
    input_set: "The event's PROVISIONAL invoice pinned room/service charges"
    constants:
      TIER_FREE_HOURS: 72
      TIER_HALF_HOURS: 24
      TIER_HALF_BPS: 5000
    precision: "integer cents, round_half_up applied once over the pinned base"

  - name: final_invoice_total
    trigger: "event completion, no-show, or cancellation-with-charges finalization"
    algorithm: forward_looking
    formula: |
      PROVISIONAL variant (at approve/rebook):
        service_charge = sum(quoted_total_cents over orders in {QUOTED, APPROVED, SCHEDULED, FULFILLED})
        insurance_surcharge = round_half_up(0.02 * (room_charge + service_charge)) if org_type == EXTERNAL else 0
        total = room_charge + service_charge + insurance_surcharge
      FINAL variant (at finalization):
        COMPLETED: service_charge = sum over orders in {FULFILLED, INVOICED} only;
                   insurance_surcharge recomputed on final base (EXTERNAL only);
                   total = room_charge + final service_charge + insurance_surcharge + deposit_charge
        NO_SHOW:   total = room_charge + final service_charge + 5000 + deposit_charge
                   (insurance_surcharge NOT applied; room charged at 100%)
        CANCELLED: total = cancellation_fee + final service_charge + deposit_charge
                   (insurance_surcharge NOT applied; room_charge line excluded)
      The two variants diverge whenever any order sits in QUOTED/APPROVED/SCHEDULED
      but never reaches FULFILLED.
    input_set: "Event's service orders by status; pinned charges; deposit forfeits"
    constants:
      INSURANCE_SURCHARGE_BPS: 200
      NO_SHOW_FLAT_FEE_CENTS: 5000
      MIN_LIABILITY_COVERAGE_CENTS: 100000000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Invoice created at approve/rebook (status PROVISIONAL)"
        difference: "Forward-looking: includes QUOTED/APPROVED/SCHEDULED service orders at quoted amounts"
      - name: final
        when: "Invoice finalized at completion/no-show/cancellation (status FINALIZED)"
        difference: "Actuals only: FULFILLED/INVOICED orders; outcome-specific lines (no-show fee, cancellation fee, deposit charges); surcharge rules differ per outcome"

  - name: utilization_bps
    trigger: "GET /campus/rooms/{id}/utilization (computed read)"
    algorithm: interval_merge
    formula: |
      booked interval per event = [start_at - setup, end_at + teardown)   # buffer NOT counted
      clamped to [window_start, window_end)
      scheduled variant input: events in {APPROVED, CONFIRMED, IN_PROGRESS, COMPLETED}
      realized variant input:  events in {COMPLETED} only
      Overlapping booked intervals are MERGED before summing (no double counting).
      denominator_minutes = (window_end - window_start) - merged outage_windows overlap minutes
      utilization_bps = round_half_up(10000 * booked_minutes / denominator_minutes)
      If denominator_minutes <= 0: both utilization_bps fields are null (minutes still reported).
    input_set: "Room's events filtered by status variant; room outage_windows"
    precision: "basis points integer, round_half_up"
    variants:
      - name: scheduled
        when: "scheduled_utilization_bps field"
        difference: "Forward-looking: includes APPROVED/CONFIRMED/IN_PROGRESS future occupancy"
      - name: realized
        when: "realized_utilization_bps field"
        difference: "Chronological actuals: COMPLETED events only"

  - name: crew_load_overlap
    trigger: "POST /campus/service-orders/{id}/schedule"
    algorithm: aggregation
    formula: |
      load(crew, window) = count of crew's SCHEDULED orders o (excluding the order being scheduled)
        where [o.service_start_at, o.service_end_at) overlaps window (half-open; end==start does NOT overlap)
      schedule allowed iff load < crew.concurrent_capacity
      Boundary: load == concurrent_capacity - 1 allowed; == concurrent_capacity rejected.
    input_set: "SCHEDULED ServiceOrders with crew_id == crew"
    precision: "integer count, exact"

  - name: standing_threshold
    trigger: "daily-close no-show marking; reinstate"
    algorithm: threshold
    formula: |
      standing = SUSPENDED if no_show_count >= 3
                 PROBATION if no_show_count == 2
                 GOOD      if no_show_count <= 1
      Boundary: count exactly 2 -> PROBATION (not SUSPENDED); exactly 3 -> SUSPENDED.
    input_set: "Organization.no_show_count"
    precision: "integer, exact"

  - name: scheduling_placement
    trigger: "POST /campus/scheduling-runs/{id}/finalize"
    algorithm: waterfall_allocation
    formula: |
      PASS 1 (score): compute priority_score for every UNPLACED block (request data only).
      PASS 2 (order): sort blocks by (priority_score DESC, enrollment DESC, created_at ASC).
      PASS 3 (assign): for each block in order:
        candidates = ACTIVE rooms with capacity >= enrollment AND features superset of required_features
        (a) free = candidates with no PLACED-block instance overlap and no non-bumpable event occupancy overlap
            pick best-fit: min(capacity - enrollment); tie-break earliest Room.created_at
        (b) else bumpable = candidates whose only event conflicts are bumpable events
            (REQUESTED|APPROVED always; CONFIRMED iff start_at - now >= 72h AND no ISSUED|OVERDUE grants)
            and no PLACED-block overlaps; pick same best-fit rule; bump all conflicting bumpable events
        (c) else block remains UNPLACED (recorded in unplaced_block_ids)
      bumped_event_ids accumulate in processing order.
    input_set: "Term's UNPLACED blocks; all ACTIVE rooms; room events and outages; term PLACED blocks"
    precision: "discrete assignment, deterministic"

  - name: deposit_refund
    trigger: "access-grant return or mark-lost"
    algorithm: threshold
    formula: |
      return with now <= return_deadline: forfeit = 0
      return with now >  return_deadline: forfeit = round_half_up(deposit_cents * 0.5)
      mark-lost: forfeit = deposit_cents (100%)
      Forfeit accrues to the event invoice deposit_charge_cents (totals recomputed even on FINALIZED invoices).
    input_set: "Single AccessGrant deposit and timing"
    constants:
      KEY_DEPOSIT_CENTS: 7500
      CARD_DEPOSIT_CENTS: 2500
      LATE_RETURN_FORFEIT_BPS: 5000
      RETURN_DEADLINE_HOURS: 24
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist left-to-right, then body FK ids exist; OrgRequester accessing a resource whose owning org != X-User-ID is masked as not-found"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-addressed endpoints"
  - priority: 4
    category: business_constraint
    check: "Request shape: required fields, enum membership, types; end_at > start_at (ERR_INVALID_TIME_RANGE); event duration in [30min, 8h] (ERR_DURATION_OUT_OF_RANGE); service window inside [event.start-2h, event.end+2h] (ERR_SERVICE_WINDOW_OUT_OF_RANGE); block times inside term dates with start_time < end_time (ERR_BLOCK_WINDOW_OUT_OF_TERM)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_term_version / expected_room_version equals current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /campus/scheduling-runs, POST /campus/event-reservations"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the requested transition (incl. decision_deadline not passed at approve)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Compliance holds: EXTERNAL insurance valid through end_at with coverage >= 100000000 (confirm); waive actor != event.approved_by_user_id (ERR_SEGREGATION_OF_DUTIES); org not SUSPENDED (event create/approve, ERR_ORG_SUSPENDED)"
    error_id: ERR_INSURANCE_INVALID
    http_status: 422
    applies_to: "confirm, waive, event create, event approve"
  - priority: 8
    category: business_temporal
    check: "Term priority lock on approve/rebook; confirm window not expired; check-in inside [start-30m, start+15m]"
    error_id: ERR_TERM_PRIORITY_LOCKED
    http_status: 409
    applies_to: "approve, rebook, confirm, check-in"
  - priority: 9
    category: business_constraint
    check: "Resource constraints: room occupancy/outage conflict (ERR_ROOM_NOT_AVAILABLE), capacity (ERR_CAPACITY_EXCEEDED), features superset (ERR_FEATURE_MISMATCH), crew category/shift/capacity, key inventory, outstanding grants on cancel, room edit/outage blocked by shielded events, term already finalized"
    error_id: ERR_ROOM_NOT_AVAILABLE
    http_status: 409
    applies_to: "create/approve/rebook, schedule, issue, cancel, room PATCH, out-of-service, finalize"
  - priority: 10
    category: business_fiscal
    check: "Money rules last: probation prepayment on confirm; payment not exceeding balance; waive amount not exceeding (total - paid - waived); refund not exceeding paid-refunded"
    error_id: ERR_PREPAYMENT_REQUIRED
    http_status: 402
    applies_to: "confirm, pay, refund"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Server starts at exactly 2026-08-01T00:00:00Z before any set call and MUST NOT fall back to wall-clock. All deadline/window rules read this clock."
    roles: [Scheduler]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced (never backwards; to_iso8601 must be > current)"]

  - method: POST
    path: "/campus/organizations"
    description: "Create an organization (internal dept, student group, or external client)"
    roles: [Scheduler]
    code: 201
    input: [name, org_type, contact_email, "insurance_certificate_expiry?", "insurance_coverage_cents?"]
    output: Organization
    side_effects: ["standing=GOOD, no_show_count=0, balances 0"]

  - method: GET
    path: "/campus/organizations/{id}"
    description: "Get organization details incl. computed standing and balances"
    roles: [Scheduler, FinanceAdmin, OrgRequester]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: PATCH
    path: "/campus/organizations/{id}"
    description: "Update organization contact/insurance fields"
    roles: [Scheduler]
    code: 200
    input: ["contact_email?", "insurance_certificate_expiry?", "insurance_coverage_cents?"]
    output: Organization
    side_effects: ["increments Organization.version by 1"]

  - method: POST
    path: "/campus/organizations/{id}/reinstate"
    description: "Reinstate a SUSPENDED organization; resets no_show_count to 0 and standing to GOOD"
    roles: [Scheduler]
    code: 200
    input: []
    output: Organization
    side_effects: ["standing GOOD, no_show_count 0; increments Organization.version by 1"]

  - method: POST
    path: "/campus/rooms"
    description: "Create a room in the inventory"
    roles: [FacilitiesManager]
    code: 201
    input: [name, building_code, capacity, internal_hourly_rate_cents, student_hourly_rate_cents, external_hourly_rate_cents, "features?", "turnaround_buffer_minutes?", "peak_multiplier_bps?", "key_count?"]
    output: Room
    side_effects: ["status=ACTIVE, keys_issued=0, keys_lost_total=0"]

  - method: GET
    path: "/campus/rooms/{id}"
    description: "Get room details incl. computed key counters"
    roles: [Scheduler, FacilitiesManager, ServiceCoordinator, FinanceAdmin, OrgRequester]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: PATCH
    path: "/campus/rooms/{id}"
    description: "Edit room configuration. Capacity reduction auto-bumps over-capacity REQUESTED/APPROVED events; rejected when a CONFIRMED/IN_PROGRESS event would exceed new capacity (ERR_ROOM_EDIT_BLOCKED)"
    roles: [FacilitiesManager]
    code: 200
    input: ["capacity?", "features?", "turnaround_buffer_minutes?", "internal_hourly_rate_cents?", "student_hourly_rate_cents?", "external_hourly_rate_cents?", "peak_multiplier_bps?", "key_count?"]
    output: Room
    side_effects: ["increments Room.version by 1", "capacity cut: REQUESTED/APPROVED events with expected_attendance > new capacity -> BUMPED with full bump cascade"]

  - method: POST
    path: "/campus/rooms/{id}/out-of-service"
    description: "Take room out of service over a window; bumps bumpable overlapping events"
    roles: [FacilitiesManager]
    code: 200
    input: [outage_start_at, outage_end_at]
    output: Room
    side_effects: ["status OUT_OF_SERVICE; outage window recorded; bumpable overlapping events -> BUMPED with cascade; increments Room.version by 1"]

  - method: GET
    path: "/campus/rooms/{id}/utilization"
    description: "Computed utilization analytics over a window; scheduled (forward-looking) and realized (COMPLETED-only) variants"
    roles: [Scheduler, FacilitiesManager]
    code: 200
    input: [window_start, window_end]
    output: { window_minutes: integer, outage_minutes: integer, scheduled_minutes: integer, realized_minutes: integer, scheduled_utilization_bps: integer, realized_utilization_bps: integer }
    side_effects: []

  - method: POST
    path: "/campus/terms"
    description: "Create a term window"
    roles: [Scheduler]
    code: 201
    input: [name, term_start_date, term_end_date, priority_open_at, general_open_at]
    output: TermWindow
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/campus/terms/{id}"
    description: "Get term details"
    roles: [Scheduler, FacilitiesManager, ServiceCoordinator, FinanceAdmin, OrgRequester]
    code: 200
    input: []
    output: TermWindow
    side_effects: []

  - method: POST
    path: "/campus/academic-blocks"
    description: "Create an academic block (recurring weekly placement demand) in a DRAFT or SCHEDULING term"
    roles: [Scheduler]
    code: 201
    input: [term_id, course_code, instructor_name, enrollment, days_of_week, start_time, end_time, "required_features?"]
    output: AcademicBlock
    side_effects: ["status=UNPLACED; priority_score computed from request data"]

  - method: GET
    path: "/campus/academic-blocks/{id}"
    description: "Get academic block"
    roles: [Scheduler]
    code: 200
    input: []
    output: AcademicBlock
    side_effects: []

  - method: GET
    path: "/campus/academic-blocks"
    description: "List academic blocks with filters"
    roles: [Scheduler]
    code: 200
    input: ["term_id?", "assigned_room_id?", "scheduling_run_id?", "status?", "limit?", "offset?"]
    output: AcademicBlock[]
    side_effects: []

  - method: POST
    path: "/campus/academic-blocks/{id}/unplace"
    description: "Remove a block's placement (does NOT restore bumped events)"
    roles: [Scheduler]
    code: 200
    input: []
    output: AcademicBlock
    side_effects: ["status UNPLACED; assigned_room_id and scheduling_run_id cleared"]

  - method: POST
    path: "/campus/scheduling-runs"
    description: "Create a DRAFT scheduling run for a term (supersedes prior DRAFT); OCC on term version"
    roles: [Scheduler]
    code: 201
    input: [term_id, expected_term_version]
    output: SchedulingRun
    side_effects: ["Prior DRAFT run for the term -> SUPERSEDED; term.current_draft_run_id repointed; increments TermWindow.version by 1"]

  - method: GET
    path: "/campus/scheduling-runs/{id}"
    description: "Get scheduling run"
    roles: [Scheduler]
    code: 200
    input: []
    output: SchedulingRun
    side_effects: []

  - method: GET
    path: "/campus/scheduling-runs"
    description: "List scheduling runs with filters"
    roles: [Scheduler]
    code: 200
    input: ["term_id?", "status?", "limit?", "offset?"]
    output: SchedulingRun[]
    side_effects: []

  - method: POST
    path: "/campus/scheduling-runs/{id}/finalize"
    description: "Execute placement pass: scores, sorts, assigns rooms, bumps bumpable conflicting events"
    roles: [Scheduler]
    code: 200
    input: []
    output: SchedulingRun
    side_effects: ["scheduling_placement executed; bump cascades fire; run -> FINALIZED"]

  - method: POST
    path: "/campus/event-reservations"
    description: "Create an ad-hoc event request (initial REQUESTED); OCC on room version"
    roles: [OrgRequester]
    code: 201
    input: [room_id, title, expected_attendance, start_at, end_at, expected_room_version, "required_features?", "setup_minutes?", "teardown_minutes?"]
    output: EventReservation
    side_effects: ["status=REQUESTED; decision_deadline=now+72h; precedence_tier from org_type; increments Room.version by 1"]

  - method: GET
    path: "/campus/event-reservations/{id}"
    description: "Get event; OrgRequester may only read own org's events (else 404)"
    roles: [Scheduler, FacilitiesManager, ServiceCoordinator, FinanceAdmin, OrgRequester]
    code: 200
    input: []
    output: EventReservation
    side_effects: []

  - method: GET
    path: "/campus/event-reservations"
    description: "List events; OrgRequester results auto-scoped to own org"
    roles: [Scheduler, FacilitiesManager, ServiceCoordinator, FinanceAdmin, OrgRequester]
    code: 200
    input: ["room_id?", "requester_org_id?", "status?", "limit?", "offset?"]
    output: EventReservation[]
    side_effects: []

  - method: POST
    path: "/campus/event-reservations/{id}/approve"
    description: "Approve a request: pins rates, creates PROVISIONAL invoice, sets confirm deadline"
    roles: [Scheduler]
    code: 200
    input: []
    output: EventReservation
    side_effects: ["Rates pinned; PROVISIONAL Invoice created; confirm_deadline = now+48h; approved_by_user_id set"]

  - method: POST
    path: "/campus/event-reservations/{id}/decline"
    description: "Decline a request"
    roles: [Scheduler]
    code: 200
    input: [reason]
    output: EventReservation
    side_effects: ["status DECLINED"]

  - method: POST
    path: "/campus/event-reservations/{id}/confirm"
    description: "Requester confirms an approved event; insurance/prepayment gates apply"
    roles: [OrgRequester]
    code: 200
    input: []
    output: EventReservation
    side_effects: ["status CONFIRMED"]

  - method: POST
    path: "/campus/event-reservations/{id}/cancel"
    description: "Cancel an event; CLIENT cancels incur tiered fees; ADMIN/BUMPED/ORG_SUSPENDED are free"
    roles: [OrgRequester, Scheduler]
    code: 200
    input: []
    output: EventReservation
    side_effects: ["Fee per cancellation_fee tiers; invoice VOIDED or FINALIZED; non-terminal service orders CANCELLED; REQUESTED grants REVOKED"]

  - method: POST
    path: "/campus/event-reservations/{id}/rebook"
    description: "Rebook a BUMPED event into a new room; re-pins rates, fresh PROVISIONAL invoice, restarts confirm window"
    roles: [Scheduler, OrgRequester]
    code: 200
    input: [room_id]
    output: EventReservation
    side_effects: ["status APPROVED; new PROVISIONAL invoice at new room's pinned rates; confirm_deadline = now+48h"]

  - method: POST
    path: "/campus/event-reservations/{id}/check-in"
    description: "Check in within [start-30m, start+15m]; transitions CONFIRMED -> IN_PROGRESS"
    roles: [OrgRequester, FacilitiesManager]
    code: 200
    input: []
    output: EventReservation
    side_effects: ["checked_in_at set"]

  - method: POST
    path: "/campus/service-orders"
    description: "Attach a service order (AV/catering/custodial/security) to an APPROVED or CONFIRMED event"
    roles: [OrgRequester]
    code: 201
    input: [event_id, category, quantity, service_start_at, service_end_at]
    output: ServiceOrder
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/campus/service-orders/{id}"
    description: "Get service order; OrgRequester may only read own org's orders (else 404)"
    roles: [ServiceCoordinator, Scheduler, OrgRequester]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []

  - method: GET
    path: "/campus/service-orders"
    description: "List service orders with filters; OrgRequester scoped to own org"
    roles: [ServiceCoordinator, Scheduler, OrgRequester]
    code: 200
    input: ["event_id?", "crew_id?", "category?", "status?", "limit?", "offset?"]
    output: ServiceOrder[]
    side_effects: []

  - method: POST
    path: "/campus/service-orders/{id}/quote"
    description: "Quote or re-quote a service order (REQUESTED or NEEDS_REVISION -> QUOTED)"
    roles: [ServiceCoordinator]
    code: 200
    input: [unit_cost_cents]
    output: ServiceOrder
    side_effects: ["quoted_total_cents computed; provisional invoice service_charge recomputed"]

  - method: POST
    path: "/campus/service-orders/{id}/approve"
    description: "Requester approves a quote"
    roles: [OrgRequester]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status APPROVED"]

  - method: POST
    path: "/campus/service-orders/{id}/request-revision"
    description: "Requester sends a quote back for revision (QUOTED -> NEEDS_REVISION)"
    roles: [OrgRequester]
    code: 200
    input: [note]
    output: ServiceOrder
    side_effects: ["revision_note set; excluded from provisional service_charge"]

  - method: POST
    path: "/campus/service-orders/{id}/schedule"
    description: "Assign a crew to an APPROVED order; crew category/shift/capacity validated"
    roles: [ServiceCoordinator]
    code: 200
    input: [crew_id]
    output: ServiceOrder
    side_effects: ["crew_id set; status SCHEDULED"]

  - method: POST
    path: "/campus/service-orders/{id}/fulfill"
    description: "Mark a SCHEDULED order fulfilled once its service window has ended"
    roles: [ServiceCoordinator]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status FULFILLED"]

  - method: POST
    path: "/campus/service-orders/{id}/cancel"
    description: "Cancel a non-terminal service order (requester cancel: fee_waived=false)"
    roles: [ServiceCoordinator, OrgRequester]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status CANCELLED; provisional invoice recomputed"]

  - method: POST
    path: "/campus/service-crews"
    description: "Create a service crew with category, shift window, and concurrent capacity"
    roles: [ServiceCoordinator]
    code: 201
    input: [name, category, concurrent_capacity, shift_start, shift_end]
    output: ServiceCrew
    side_effects: []

  - method: GET
    path: "/campus/invoices/{id}"
    description: "Get invoice; OrgRequester may only read own org's invoices (else 404)"
    roles: [FinanceAdmin, Scheduler, OrgRequester]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/campus/invoices"
    description: "List invoices with filters; OrgRequester scoped to own org"
    roles: [FinanceAdmin, Scheduler, OrgRequester]
    code: 200
    input: ["event_id?", "org_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/campus/invoices/{id}/pay"
    description: "Pay toward an invoice (prepay PROVISIONAL allowed; FINALIZED/PARTIALLY_PAID standard); exact-balance payment -> PAID"
    roles: [OrgRequester, FinanceAdmin]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["paid_cents += amount_cents; status transitions PARTIALLY_PAID/PAID per balance"]

  - method: POST
    path: "/campus/invoices/{id}/waive"
    description: "Waive part of an invoice; segregation of duties: actor must differ from event.approved_by_user_id (else ERR_SEGREGATION_OF_DUTIES); amount capped at total - paid - waived (else ERR_OVERPAYMENT)"
    roles: [FinanceAdmin]
    code: 200
    input: [amount_cents, reason]
    output: Invoice
    side_effects: ["waived_cents += amount_cents; PAID when paid+waived == total"]

  - method: POST
    path: "/campus/invoices/{id}/refund"
    description: "Refund against paid amounts; REFUNDED when refunded == paid"
    roles: [FinanceAdmin]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["refunded_cents += amount_cents"]

  - method: POST
    path: "/campus/access-grants"
    description: "Request key/card access provisioning for an event"
    roles: [OrgRequester, FacilitiesManager]
    code: 201
    input: [event_id, grant_type]
    output: AccessGrant
    side_effects: ["status=REQUESTED; room_id copied from event; return_deadline = event.end_at + 24h"]

  - method: GET
    path: "/campus/access-grants/{id}"
    description: "Get access grant; OrgRequester may only read own org's grants (else 404)"
    roles: [FacilitiesManager, Scheduler, OrgRequester]
    code: 200
    input: []
    output: AccessGrant
    side_effects: []

  - method: GET
    path: "/campus/access-grants"
    description: "List access grants with filters; OrgRequester scoped to own org"
    roles: [FacilitiesManager, Scheduler, OrgRequester]
    code: 200
    input: ["event_id?", "room_id?", "status?", "limit?", "offset?"]
    output: AccessGrant[]
    side_effects: []

  - method: POST
    path: "/campus/access-grants/{id}/issue"
    description: "Issue a key/card for a CONFIRMED event; physical keys draw from room inventory with lowest-free-slot assignment"
    roles: [FacilitiesManager]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["deposit held on org; key_slot assigned; room.keys_issued incremented for PHYSICAL_KEY"]

  - method: POST
    path: "/campus/access-grants/{id}/return"
    description: "Return an issued/overdue grant; late returns forfeit 50% of deposit"
    roles: [FacilitiesManager]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["deposit released minus forfeit; key slot freed"]

  - method: POST
    path: "/campus/access-grants/{id}/mark-lost"
    description: "Mark an issued/overdue grant lost; 100% deposit forfeit; physical key inventory permanently shrinks"
    roles: [FacilitiesManager]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["full deposit forfeited to invoice; room.key_count decremented; slot retired"]

  - method: POST
    path: "/campus/ops/daily-close"
    description: "Ops-run checkpoint applying clock-driven transitions in pinned order: (1) term status advances; (2) room auto-return-to-service; (3) REQUESTED past decision_deadline -> EXPIRED; (4) APPROVED past confirm_deadline -> EXPIRED (invoice VOIDED); (5) CONFIRMED past check-in deadline without check-in -> NO_SHOW (strike, standing, suspension cascade); (6) IN_PROGRESS past end -> COMPLETED (final invoice); (7) ISSUED grants past return_deadline -> OVERDUE; (8) org balances recomputed"
    roles: [Scheduler]
    code: 200
    input: []
    output: { terms_advanced: integer, rooms_returned: integer, requests_expired: integer, approvals_expired: integer, no_shows_marked: integer, events_completed: integer, grants_overdue: integer, orgs_suspended: integer }
    side_effects: ["All clock-driven state transitions applied in the pinned order"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist; also masks OrgRequester access to another org's resources" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum/type, non-positive quantity/amount" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "end_at <= start_at, outage_end <= outage_start, or utilization window_end <= window_start" }
  - { id: ERR_DURATION_OUT_OF_RANGE, http: 422, condition: "Event duration outside [30 minutes, 8 hours]" }
  - { id: ERR_SERVICE_WINDOW_OUT_OF_RANGE, http: 422, condition: "Service window not within [event.start_at - 2h, event.end_at + 2h]" }
  - { id: ERR_BLOCK_WINDOW_OUT_OF_TERM, http: 422, condition: "Block start_time >= end_time, empty days_of_week, or recurrence would produce no instance inside term dates" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_room_version/expected_term_version does not match current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (incl. terminal lockdown and decision-deadline pass at approve)" }
  - { id: ERR_INSURANCE_INVALID, http: 422, condition: "EXTERNAL org confirm without insurance valid through end_at and coverage >= 100000000" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Waive actor X-User-ID equals the event's approved_by_user_id" }
  - { id: ERR_ORG_SUSPENDED, http: 409, condition: "SUSPENDED org creating an event, or approve of a SUSPENDED org's event" }
  - { id: ERR_TERM_PRIORITY_LOCKED, http: 409, condition: "Approve/rebook/finalize touching term dates while term is in SCHEDULING priority window (or finalize while not SCHEDULING)" }
  - { id: ERR_CONFIRM_WINDOW_EXPIRED, http: 409, condition: "Confirm after confirm_deadline" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 409, condition: "Check-in before start_at-30m or after start_at+15m" }
  - { id: ERR_ROOM_NOT_AVAILABLE, http: 409, condition: "Occupancy conflict with another APPROVED/CONFIRMED/IN_PROGRESS event, a PLACED block, or an outage window (buffered half-open semantics)" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "expected_attendance > room.capacity or enrollment > capacity" }
  - { id: ERR_FEATURE_MISMATCH, http: 422, condition: "required_features not a subset of room.features" }
  - { id: ERR_CREW_CATEGORY_MISMATCH, http: 422, condition: "Crew category differs from order category at schedule" }
  - { id: ERR_CREW_SHIFT_MISMATCH, http: 422, condition: "Crew shift window does not cover the full service window" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 409, condition: "Scheduling would make the crew's overlapping SCHEDULED orders equal concurrent_capacity + 1" }
  - { id: ERR_NO_KEYS_AVAILABLE, http: 409, condition: "PHYSICAL_KEY issue while room.keys_issued == room.key_count" }
  - { id: ERR_ACCESS_GRANTS_OUTSTANDING, http: 409, condition: "Cancelling a CONFIRMED event with ISSUED or OVERDUE access grants" }
  - { id: ERR_ROOM_EDIT_BLOCKED, http: 409, condition: "Room capacity reduction would leave a CONFIRMED/IN_PROGRESS event over capacity" }
  - { id: ERR_ROOM_BLOCKED, http: 409, condition: "Out-of-service window overlaps a non-bumpable (shielded/IN_PROGRESS) event" }
  - { id: ERR_TERM_ALREADY_FINALIZED, http: 409, condition: "Finalizing a run when another FINALIZED run already exists for the term" }
  - { id: ERR_PREPAYMENT_REQUIRED, http: 402, condition: "PROBATION org confirming without provisional invoice fully paid/waived" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment or waiver exceeds remaining balance (total - paid - waived); also payment on VOIDED/REFUNDED invoice" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 422, condition: "Refund exceeds paid_cents - refunded_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OrgRequester
    description: "Requester acting for a client organization (internal dept, student group, or external client); sees only own org's resources"
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /campus/event-reservations — create event request (org taken from X-User-ID)"
      - "POST /campus/event-reservations/{id}/confirm — confirm own event"
      - "POST /campus/service-orders — attach service order to own event"
      - "POST /campus/service-orders/{id}/approve — approve quote on own event"
      - "POST /campus/service-orders/{id}/request-revision — send quote back on own event"
    shared_operations:
      - "POST /campus/event-reservations/{id}/cancel — own events (CLIENT reason; shared with Scheduler as ADMIN)"
      - "POST /campus/event-reservations/{id}/rebook — own bumped events (shared with Scheduler)"
      - "POST /campus/event-reservations/{id}/check-in — own events (shared with FacilitiesManager)"
      - "POST /campus/service-orders/{id}/cancel — own orders (shared with ServiceCoordinator)"
      - "POST /campus/invoices/{id}/pay — own invoices (shared with FinanceAdmin)"
      - "POST /campus/access-grants — request access for own events (shared with FacilitiesManager)"
      - "GET reads scoped to own org (events, orders, invoices, grants, rooms, terms)"

  - name: Scheduler
    description: "University scheduling office staff; owns terms, academic blocks, scheduling runs, approvals, orgs, and the ops clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc — logical clock"
      - "POST /campus/organizations and PATCH /campus/organizations/{id} and reinstate"
      - "POST /campus/terms"
      - "POST /campus/academic-blocks and unplace"
      - "POST /campus/scheduling-runs and finalize"
      - "POST /campus/event-reservations/{id}/approve and decline"
      - "POST /campus/ops/daily-close"
    shared_operations:
      - "POST /campus/event-reservations/{id}/cancel — ADMIN reason (shared with OrgRequester)"
      - "POST /campus/event-reservations/{id}/rebook (shared with OrgRequester)"
      - "GET reads across all orgs (rooms, terms, events, orders, invoices, grants, utilization)"

  - name: ServiceCoordinator
    description: "Service operations staff; owns crews, quoting, scheduling, and fulfillment"
    identity: "opaque"
    exclusive_operations:
      - "POST /campus/service-crews"
      - "POST /campus/service-orders/{id}/quote"
      - "POST /campus/service-orders/{id}/schedule"
      - "POST /campus/service-orders/{id}/fulfill"
    shared_operations:
      - "POST /campus/service-orders/{id}/cancel (shared with OrgRequester)"
      - "GET reads (events, orders, rooms, terms)"

  - name: FacilitiesManager
    description: "Facilities staff; owns room inventory, outages, and key/access provisioning"
    identity: "opaque"
    exclusive_operations:
      - "POST /campus/rooms and PATCH /campus/rooms/{id}"
      - "POST /campus/rooms/{id}/out-of-service"
      - "POST /campus/access-grants/{id}/issue, return, mark-lost"
    shared_operations:
      - "POST /campus/event-reservations/{id}/check-in (shared with OrgRequester)"
      - "POST /campus/access-grants — create request on behalf (shared with OrgRequester)"
      - "GET reads (rooms, terms, events, grants, utilization)"

  - name: FinanceAdmin
    description: "Bursar staff; owns invoice waivers and refunds; segregation of duties vs event approver"
    identity: "opaque"
    exclusive_operations:
      - "POST /campus/invoices/{id}/waive — SoD-gated"
      - "POST /campus/invoices/{id}/refund"
