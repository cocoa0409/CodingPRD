  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: station_cell_exact_double_book
        grounds:
          - validations[priority=12]
          - errors[ERR_STATION_DOUBLE_BOOKED]
          - entities.TreatmentSession.fields.station_id
        distinguishing_aspect: "Interval semantics A — exact-cell equality on the STATION resource: a second non-terminal session on the identical (station_id, shift_id, service_date) tuple is rejected with ERR_STATION_DOUBLE_BOOKED (no buffers, no geometry, pure key collision)."
        test_recipe:
          setup:
            - "One BOOKED session on (station,shift,2026-06-01); a second different patient attempts the same cell."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "OvClinic1", dialyzer_reuse_limit: 99 }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "OVM1", model: "Nipro", supports_hdf: false }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "OVC1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "AM", day_pattern: "MWF", start_minute: 360, end_minute: 600 }
              as: ClinicAdmin
              captures: { shid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "OV1", full_name: "Ov One", coinsurance_pct: 0.0 }
              as: Scheduler
              captures: { p1: $.data.id, p1v: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${p1}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${p1}", order_id: "${o1}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${p1v}" }
              as: Scheduler
              captures: { first: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "OV2", full_name: "Ov Two", coinsurance_pct: 0.0 }
              as: Scheduler
              captures: { p2: $.data.id, p2v: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${p2}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/activate"
              payload: {}
              as: Nephrologist
          trigger:
            - call: "POST /sessions"
              payload: { patient_id: "${p2}", order_id: "${o2}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${p2v}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "Response data.error_id == ERR_STATION_DOUBLE_BOOKED"
            - "Distinct shift on the same station/date does NOT collide on this rule (only the buffer rule governs adjacency)"

      - name: machine_turnover_buffer_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_TURNOVER_BUFFER_VIOLATION]
          - entities.Shift.fields.turnover_buffer_minutes
          - entities.Station.fields.machine_id
        distinguishing_aspect: "Interval semantics B — buffered half-open adjacency on the MACHINE resource (different resource than station-cell): two sessions on different stations sharing one machine on the same date violate earlier.end_minute(600)+buffer(45)=645 > later.start_minute(615), rejected with ERR_TURNOVER_BUFFER_VIOLATION; a 45+-minute gap passes."
        test_recipe:
          setup:
            - "Two stations on ONE machine; an earlier BOOKED session on station A shift AM (06:00-10:00, buffer 45) on 2026-06-01; the new create targets station B shift MID starting 10:15 (615) which is inside the 645 buffer boundary."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "OvClinic2", dialyzer_reuse_limit: 99 }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "OV2M1", model: "Nipro", supports_hdf: false }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "OV2A", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { stA: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "OV2B", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { stB: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "AM", day_pattern: "MWF", start_minute: 360, end_minute: 600, turnover_buffer_minutes: 45 }
              as: ClinicAdmin
              captures: { shAM: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "MID", day_pattern: "MWF", start_minute: 615, end_minute: 720, turnover_buffer_minutes: 45 }
              as: ClinicAdmin
              captures: { shMID: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "OV2P1", full_name: "Ov2 One", coinsurance_pct: 0.0 }
              as: Scheduler
              captures: { p1: $.data.id, p1v: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${p1}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${p1}", order_id: "${o1}", station_id: "${stA}", shift_id: "${shAM}", service_date: "2026-06-01", expected_patient_version: "${p1v}" }
              as: Scheduler
              captures: { earlier: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "OV2P2", full_name: "Ov2 Two", coinsurance_pct: 0.0 }
              as: Scheduler
              captures: { p2: $.data.id, p2v: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${p2}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/activate"
              payload: {}
              as: Nephrologist
          trigger:
            - call: "POST /sessions"
              payload: { patient_id: "${p2}", order_id: "${o2}", station_id: "${stB}", shift_id: "${shMID}", service_date: "2026-06-01", expected_patient_version: "${p2v}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "Response data.error_id == ERR_TURNOVER_BUFFER_VIOLATION (645 buffer end > 615 start, different stations same machine)"
            - "The station-cell rule (priority 12) does NOT fire here because station_id differs"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transport_confirm_cancel_conserves_account_balance
        grounds:
          - state_machines.TransportTrip.REQUESTED_to_CONFIRMED
          - state_machines.TransportTrip.CONFIRMED_to_CANCELLED
          - entities.Patient.fields.account_balance_cents
          - entities.TransportTrip.fields.fare_cents
        distinguishing_aspect: "Conserved quantity = MONEY (patient.account_balance_cents): confirm posts +fare_cents (2650) and cancel-of-confirmed posts -fare_cents, so account_balance_cents returns exactly to its pre-confirm value (0); invariant pinned as account_balance_after == account_balance_before."
        test_recipe:
          setup:
            - "A BOOKED session with a REQUESTED transport trip (fare 2650); patient.account_balance_cents == 0 before confirm."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "InvClinic1", dialyzer_reuse_limit: 99 }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
