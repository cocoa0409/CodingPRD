            - "After verify: status VERIFIED and book == 9700"

  # ============================================================ calculations
  - section: calculations
    instances:
      - name: meter_delta_out_of_order_recompute
        claim_type: correct_result
        grounds: ["calculations.metered_gallons_delta"]
        distinguishing_aspect: "Chronological calculation is order-insensitive: inserting a reading between two existing ones recomputes its own delta AND its successor's (500 splits into 200 + 300)."
        test_recipe:
          setup: ["station + tank; readings 10000@08:00 (baseline) and 10500@12:00 exist"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Moo", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/meter-readings"
              payload: { tank_id: "${t_id}", reading_at: "2026-05-01T08:00:00Z", totalizer_gallons: 10000 }
              as: DealerOperator
              as_user_id: "${s_id}"
            - call: "POST /api/meter-readings"
              payload: { tank_id: "${t_id}", reading_at: "2026-05-01T12:00:00Z", totalizer_gallons: 10500 }
              as: DealerOperator
              as_user_id: "${s_id}"
              captures: { mid_delta_pre: $.data.metered_gallons }
          trigger:
            - call: "POST /api/meter-readings"
              payload: { tank_id: "${t_id}", reading_at: "2026-05-01T10:00:00Z", totalizer_gallons: 10200 }
              as: DealerOperator
              as_user_id: "${s_id}"
              captures: { new_delta: $.data.metered_gallons }
            - call: "GET /api/meter-readings"
              payload: { tank_id: "${t_id}" }
              as: JobberAdmin
              captures: { d0: "$.data[0].metered_gallons", d1: "$.data[1].metered_gallons", d2: "$.data[2].metered_gallons" }
          assert:
            - "Pre-insert delta of the 12:00 reading was 500"
            - "Inserted 10:00 reading has metered_gallons == 200"
            - "After recompute, list order (reading_at ASC, created_at ASC): deltas == [0, 200, 300]"

      - name: meter_regression_rejected
        claim_type: violation_to_error
        grounds: ["calculations.metered_gallons_delta", "errors[ERR_METER_READING_REGRESSION]"]
        distinguishing_aspect: "A totalizer below its chronological predecessor is rejected with ERR_METER_READING_REGRESSION (422)."
        test_recipe:
          setup: ["station + tank; baseline reading 10000@08:00"]
