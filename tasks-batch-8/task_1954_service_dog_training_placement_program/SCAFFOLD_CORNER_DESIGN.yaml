  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: approve_response_immediately_consistent
        claim_type: immediate_visibility
        grounds: [state_machines.Applicant.IN_REVIEW_to_WAITLISTED, endpoints]
        distinguishing_aspect: "Immediate consistency: the approve response body itself shows application_status WAITLISTED, and the waitlist sub-resource GET in the next call already lists the created PENDING entry with the provisional requirement — no read-repair lag."
        test_recipe:
          setup: ["applicant IN_REVIEW with FINALIZED_ACCEPTED assessment (FACILITY track, income 12000000)"]
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Cons Ida", email: "cons.i@x.com", placement_track: FACILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [GUIDE_NAVIGATION], task_urgency_tier: STANDARD, home_environment_score: 5 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator, captures: { st: $.data.application_status } }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { prov: "$.data[0].requirement_provisional_cents", est: "$.data[0].status" } }
          assert:
            - "approve response: application_status == WAITLISTED (side effects visible in the same response)"
            - "immediately after: one WaitlistEntry PENDING with requirement_provisional_cents == 765000"

      - name: response_envelope_shapes
        claim_type: immediate_visibility
        grounds: [response_envelope]
        distinguishing_aspect: "Envelope contract: success bodies carry meta.api_request_id + response_type 'object' + data; error bodies carry response_type 'error' + data.error_id + data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/applicants", payload: { full_name: "Env Eva", email: "env.e@x.com", placement_track: MOBILITY, household_income_cents: 7000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - call: "GET /api/applicants/00000000-0000-0000-0000-000000000000"
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "success response: meta.api_request_id present, response_type == 'object', data.id == ${a_id}"
            - "error response: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message present"

