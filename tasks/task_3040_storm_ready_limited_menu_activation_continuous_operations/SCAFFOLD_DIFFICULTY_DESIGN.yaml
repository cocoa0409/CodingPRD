            - call: "POST /ops/crew-members"
              payload: { full_name: "Ada Ruiz", role: "SERVER", home_unit_id: "${u1}", is_jump_team: true }
              as: FieldCoordinator
              captures: { m2: $.data.id }
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m2}", unit_id: "${u2}", assigned_from: "2026-09-10T07:00:00Z", assigned_until: "2026-09-12T00:00:00Z", travel_origin: "Macon" }
              as: FieldCoordinator
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /ops/assignments/${a1}/start"
              payload: {}
              as: FieldCoordinator
              captures: { err1: $.data.error_id }
            - call: "POST /ops/assignments/${a2}/start"
