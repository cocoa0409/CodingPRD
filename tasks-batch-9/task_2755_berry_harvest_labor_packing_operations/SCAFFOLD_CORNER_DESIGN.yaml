            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk_b}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-C6", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker C6", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk: $.data.id }
            - call: "POST /berry-ops/crews/${crew}/support-plan"
              payload: { housing_unit_code: "H-C6", beds_confirmed: 1, transport_route_code: "R-C6", vehicle_seats: 1 }
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews/${crew}/certify"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk_a}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win_a: $.data.id }
            - call: "POST /berry-ops/harvest-windows/${win_a}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows/${win_a}/open"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk_b}", crew_id: "${crew}", start_at: "2026-08-04T06:00:00Z", end_at: "2026-08-04T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 50, clamshell_net_weight_lbs: 0.50 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win_b: $.data.id }
            - call: "POST /berry-ops/harvest-windows/${win_b}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows/${win_b}/open"
              payload: {}
              as: HarvestManager
