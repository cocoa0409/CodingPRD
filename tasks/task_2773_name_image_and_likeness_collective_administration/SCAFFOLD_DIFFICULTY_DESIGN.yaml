              as: CollectiveDirector
              captures: { del_roster_post_id: $.data.id }
            - call: "POST /nil/deal-contracts/${rc_id}/deliverables"
              payload: { deliverable_kind: "APPEARANCE", unit_value_cents: 100000, due_at: "2026-09-01T00:00:00Z" }
              as: CollectiveDirector
