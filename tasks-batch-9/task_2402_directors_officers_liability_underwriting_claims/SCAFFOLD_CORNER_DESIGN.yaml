            - "the trigger returns 200 with activated_policy_count == 1, expired_policy_count == 1 and delinquent_policy_count == 1 — the same run walks INCEPTED to ACTIVE to EXPIRED and marks the unpaid premium"
            - "after the trigger GET /dno/policies/${policy_id}/coverage-parts reads SIDE_A status == \"RELEASED\", SIDE_C status == \"RELEASED\" and SIDE_B still status == \"EXHAUSTED\" with eroded_usd == 10000000.00 — the cascade skips the terminal child"
            - "after the trigger GET /dno/layers with policy_id == ${policy_id} reads the excess layer RELEASED and the primary layer still EXHAUSTED"
            - "the policy reads coverage_status == \"EXPIRED\", premium_status == \"DELINQUENT\", tower_posture == \"RELEASED\" (the RELEASED rung outranks ERODED once coverage_status is EXPIRED) and total_eroded_usd == 10000000.00 — release does not rewrite the erosion ledger"
