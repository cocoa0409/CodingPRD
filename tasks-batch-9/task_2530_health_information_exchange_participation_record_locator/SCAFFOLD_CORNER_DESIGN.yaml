      - name: segmented_locator_query_returns_partial_disclosure_with_one_audit_row_per_member
        claim_type: Computed read
        grounds:
          - endpoints.POST_hie_record_locator_queries
          - endpoints.GET_hie_record_locator_queries_id
          - endpoints.GET_hie_access_audit_entries
          - calculations.consent_disclosure_decision
          - entities.AccessAuditEntry
        distinguishing_aspect: |
          The stored query row and the audit trail are two views of one derived computation and must agree
          exactly. A two-member cluster where only the second member carries BEHAVIORAL_HEALTH, governed
          by a SENSITIVE_CATEGORY_RESTRICTION directive over a policy that segments BEHAVIORAL_HEALTH,
          yields consent_decision PARTIAL_SEGMENTED with disclosed_record_count 1, withheld_record_count 1
          and withheld_categories [BEHAVIORAL_HEALTH]; governing_directive_id stays null because a
          SENSITIVE_CATEGORY_RESTRICTION is not an OPT_IN/OPT_OUT row. Exactly two AccessAuditEntry rows
          exist in member created_at ASC order - DISCLOSED then WITHHELD with suppression_reason
          SENSITIVE_CATEGORY - and the withheld row names the contributing participant, not the querier.
        test_recipe:
          setup:
            - "An ACTIVE ConsentPolicy segments BEHAVIORAL_HEALTH under the OPT_OUT model with default_share_for_treatment true."
            - "A DETERMINISTIC_FIRST generation is ACTIVE so the two identical-identifier records auto-link into one cluster."
            - "Participant A is CERTIFIED and owns a MONITORED CCDA feed; participant B is at CONFORMANCE_TESTING and contributes the BEHAVIORAL_HEALTH-tagged record."
            - "A SENSITIVE_CATEGORY_RESTRICTION directive over BEHAVIORAL_HEALTH is ACTIVE on the surviving cluster."
          setup_api_calls:
            - call: "POST /hie/consent-policies"
              payload: { policy_version: "E4-POLICY-1", model: "OPT_OUT", sensitive_categories_segmented: ["BEHAVIORAL_HEALTH"], default_share_for_treatment: true, effective_from: "2026-01-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
              captures: { polE4_id: $.data.id }
            - call: "POST /hie/consent-policies/${polE4_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-DET-E4", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "DETERMINISTIC_FIRST", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgE4_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgE4_id}/activation"
              payload: {}
              as: PrivacyOfficer
