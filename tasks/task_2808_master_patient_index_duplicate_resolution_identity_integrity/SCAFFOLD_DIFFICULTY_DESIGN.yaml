              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/match-rule-sets/${rs_base_id}/activate"
              payload: {}
              as: MpiAdmin
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_home_id}", mrn: "H-9100", last_name: "Kowalczyk", first_name: "Marta", dob: "1966-12-05", sex: "F", ssn_last4: "2244", postal_code: "60302", phone: "3125550190", clinical_element_count: 21 }
              as: IdentityAnalyst
              captures: { rec_home_id: $.data.id }
            - call: "POST /mpi/registration-sites/${site_away_id}/search-attempts"
              payload: { searched_last_name: "Kowalczyk", searched_first_name: "Marta", searched_dob: "1966-12-05", searched_sex: "F", searched_ssn_last4: "2244", searched_postal_code: "60302", searched_phone: "3125550190" }
              as: SiteRegistrar
              as_user_id: "${site_away_id}"
              captures: { att_hit_id: $.data.id, att_hit_top_score: $.data.top_score, att_hit_blocked: $.data.blocked_creation }
            - call: "POST /mpi/registration-sites/${site_away_id}/search-attempts"
              payload: { searched_last_name: "Zielinski" }
              as: SiteRegistrar
              as_user_id: "${site_away_id}"
              captures: { att_miss_id: $.data.id, att_miss_top_score: $.data.top_score }
          trigger:
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_away_id}", mrn: "W-4100", last_name: "Kowalczyk", first_name: "Marta", dob: "1966-12-05", sex: "F", ssn_last4: "2244", postal_code: "60302", phone: "3125550190", clinical_element_count: 0, origin_search_attempt_id: "${att_hit_id}" }
              as: SiteRegistrar
              as_user_id: "${site_away_id}"
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_away_id}", mrn: "W-4100", last_name: "Zielinski", first_name: "Ewa", dob: "1971-04-18", sex: "F", clinical_element_count: 0, origin_search_attempt_id: "${att_miss_id}" }
              as: SiteRegistrar
              as_user_id: "${site_away_id}"
          assert:
            - "RegistrationSearchAttempt.${att_hit_id}.result_count == 1 and top_score == 100.00"
            - "RegistrationSearchAttempt.${att_hit_id}.top_match_record_mrn == \"H-9100\" (a record owned by SITE-HOME, proving the pool is enterprise-wide)"
            - "RegistrationSearchAttempt.${att_hit_id}.blocked_creation == true and rule_set_version_label == \"V-BASE-1\""
            - "RegistrationSearchAttempt.${att_miss_id}.result_count == 0 and top_score == 0.00 and top_match_record_mrn == null and blocked_creation == false"
            - "First trigger call: HTTP 409 with $.data.error_id == \"ERR_DUPLICATE_CREATION_BLOCKED\""
            - "First trigger call: RegistrationSite.${site_away_id}.active_record_count == 0 (no record was created)"
            - "Second trigger call: HTTP 201 with $.data.identity_state == ACTIVE and $.data.integrity_state == CLEAR"
