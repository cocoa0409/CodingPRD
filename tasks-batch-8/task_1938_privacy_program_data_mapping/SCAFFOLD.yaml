  - { id: ERR_NO_DOCUMENTED_PURPOSE, http: 422, condition: "Activation with zero DOCUMENTED purposes" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, bad array element, or violated numeric range" }

