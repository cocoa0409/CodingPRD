              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o_id}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o_id}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/warranty-claims"
              payload: { treatment_order_id: "${o_id}", claim_reason: DECAY_RECURRENCE }
              as: ProgramManager
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /pole-program/warranty-claims/${cl_id}/adjudicate"
              payload: { outcome: HONOR, adjudication_note: "decay under wrap" }
              as: ProgramManager
            - call: "GET /pole-program/treatment-work-orders"
              payload: { source_claim_id: "${cl_id}" }
              as: ProgramManager
              captures: { ro_id: "$.data[0].id", ro_flag: "$.data[0].is_warranty_retreat", ro_cost: "$.data[0].cost_cents", ro_st: "$.data[0].status" }
            - call: "GET /pole-program/poles/${p_id}"
              payload: {}
              as: ProgramManager
              captures: { otc: $.data.open_treatment_count }
          assert:
            - "WarrantyClaim.${cl_id}.status == HONORED"
            - "retreat order: is_warranty_retreat == true, cost_cents == 0, status == CREATED, pole_id == ${p_id}, product_code == PENTA_GEL"
            - "Pole.${p_id}.open_treatment_count == 1 (order creation cascaded to the pole)"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_fund
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_ORDER_NOT_QUEUED]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: funding a DEFERRED order against a budget
          with available 0 violates both rules; the state rule (priority 5) wins over the fiscal
          rule (priority 11), so the response is ERR_ORDER_NOT_QUEUED, not ERR_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Budget total 0 (available 0); plain pole; manual order cost 100000 deferred to DEFERRED"
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 0 }
              as: ProgramManager
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-PC1", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}", estimated_cost_cents: 100000 }
              as: ProgramManager
              captures: { o_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders/${o_id}/defer"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /pole-program/replacement-work-orders/${o_id}/fund"
              payload: { budget_id: "${b_id}", expected_budget_version: "${b_v}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response == 409 ERR_ORDER_NOT_QUEUED (state, priority 5) even though ERR_BUDGET_EXCEEDED (fiscal, priority 11) also holds"
            - "ReplacementWorkOrder.${o_id}.status stays DEFERRED; budget.committed_cents == 0"

      - name: existence_beats_state_on_schedule
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_CREW_NOT_FOUND]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair existence vs state: scheduling an APPLIED order with a non-existent
          crew_id violates both; the existence rule (priority 4) wins over the state rule
          (priority 5), so the response is ERR_CREW_NOT_FOUND, not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Pole, crew CR-E, treatment order already APPLIED (schedule is now an invalid state)"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-PC2", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-E", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o_id: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o_id}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o_id}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
          trigger:
            - call: "POST /pole-program/treatment-work-orders/${o_id}/schedule"
              payload: { crew_id: "00000000-0000-0000-0000-000000000000", work_start_date: "2026-09-01", work_end_date: "2026-09-03" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response == 404 ERR_CREW_NOT_FOUND (existence, priority 4) even though the APPLIED state also forbids scheduling"
            - "TreatmentWorkOrder.${o_id}.status stays APPLIED and crew_id stays ${cr_id}"

      - name: safety_beats_referential_on_submit
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_HAZARD_FLAG_REQUIRED]
          - errors[ERR_PHOTO_EVIDENCE_REQUIRED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential: a submit whose readings
          compute REJECT_PRIORITY with hazard_flag false AND an empty photos array violates both;
          the safety rule (priority 7) wins over the evidence rule (priority 10).
        test_recipe:
          setup:
            - "Cycle CONSERVATIVE OPEN pct 0; pole P-PC3 class 3; task OPEN"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-PC3", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload: { shell_thickness_in: 2.00, sound_wood_pct: 30, decay_pocket_depth_in: 0.4, moisture_pct: 25, hazard_flag: false, photos: [] }
              as: Inspector
              as_user_id: "insp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response == 422 ERR_HAZARD_FLAG_REQUIRED (safety, priority 7) even though ERR_PHOTO_EVIDENCE_REQUIRED (referential, priority 10) also holds"
            - "InspectionTask.${t_id}.status stays OPEN; no AttachmentAudit created"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: classification_boundary_exactly_60_is_serviceable
        grounds:
          - calculations.pole_serviceability_classification
          - calculations.remaining_strength_pct
        distinguishing_aspect: |
          Inclusive lower bound on the strength metric: effective_rs == 60.00 classifies
          SERVICEABLE while 59.90 classifies MONITOR — a >= vs > distinction on the
          remaining-strength metric via the submit endpoint.
        test_recipe:
          setup:
            - "Cycle CONSERVATIVE OPEN pct 0; poles P-B60 and P-B59 (both class 3 SOUTHERN_PINE); one task each"
          setup_api_calls:
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-B60", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p1: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-B59", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.1, gis_lon: -122.1, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p2: $.data.id }
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p1}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t1: $.data.id }
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p2}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /pole-program/inspection-tasks/${t1}/submit"
              payload:
                shell_thickness_in: 2.00
                sound_wood_pct: 62
                decay_pocket_depth_in: 0.4
                moisture_pct: 25
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g1.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t1.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
              captures: { rs1: $.data.effective_rs_pct, cl1: $.data.classification }
            - call: "POST /pole-program/inspection-tasks/${t2}/submit"
              payload:
                shell_thickness_in: 2.00
                sound_wood_pct: 61.9
                decay_pocket_depth_in: 0.4
                moisture_pct: 25
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g2.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t2.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
              captures: { rs2: $.data.effective_rs_pct, cl2: $.data.classification }
          assert:
            - "InspectionTask.${t1}: effective_rs_pct == 60.00 -> classification == SERVICEABLE (boundary inclusive)"
            - "InspectionTask.${t2}: effective_rs_pct == 59.90 -> classification == MONITOR (one step below the boundary)"

      - name: fund_exact_available_equality
        grounds:
          - calculations.budget_waterfall_funding
          - validations[priority=11]
        distinguishing_aspect: |
          Inclusive equality on the cents metric: escalated_cost_cents == available_cents exactly
          funds the order, while cost 1 cent over a zeroed remainder is rejected — a boundary on
          the budget metric via the fund endpoint, distinct from the strength submit boundary.
        test_recipe:
          setup:
            - "Budget total exactly 200000; plain pole; order O1 cost 200000 (deferral 0)"
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 200000 }
              as: ProgramManager
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-FB", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}", estimated_cost_cents: 200000 }
              as: ProgramManager
              captures: { o1: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}", estimated_cost_cents: 100000 }
              as: ProgramManager
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /pole-program/replacement-work-orders/${o1}/fund"
              payload: { budget_id: "${b_id}", expected_budget_version: "${b_v}" }
              as: ProgramManager
              captures: { st1: $.data.status }
            - call: "GET /pole-program/budgets/${b_id}"
              payload: {}
              as: ProgramManager
              captures: { avail: $.data.available_cents, b_v2: $.data.version }
            - call: "POST /pole-program/replacement-work-orders/${o2}/fund"
              payload: { budget_id: "${b_id}", expected_budget_version: "${b_v2}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "O1 funds at exact equality: status == FUNDED, budget.available_cents == 0"
            - "O2 with available 0 rejected 422 ERR_BUDGET_EXCEEDED (100000 > 0)"

      - name: empty_sample_pool_opens_clean
        grounds:
          - calculations.inspection_sample_selection
          - state_machines.InspectionCycle.DRAFT_to_OPEN
        distinguishing_aspect: |
          Empty-collection boundary on the open endpoint: with zero poles in the database the
          eligible pool is empty and opening still succeeds with sample_pool_size == 0 and
          tasks_total == 0 — a different metric (collection cardinality) and endpoint than the
          numeric boundaries above.
        test_recipe:
          setup:
            - "Empty database except one DRAFT cycle with sample_pct 100"
          setup_api_calls:
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 100, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
              captures: { st: $.data.status, pool: $.data.sample_pool_size, tt: $.data.tasks_total }
          assert:
            - "open returns 200 with status == OPEN"
            - "sample_pool_size == 0 and tasks_total == 0 (empty pool is not an error)"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_blocked_when_pole_replaced
        grounds:
          - state_machines.InspectionTask.OPEN_to_SUBMITTED
          - state_machines.Pole.PRIORITY_REJECT_to_REPLACED
          - errors[ERR_POLE_REPLACED]
        distinguishing_aspect: |
          Entity pair InspectionTask -> Pole: a task that was OPEN before its pole was REPLACED
          (via a completed funded replacement order) can no longer be submitted; the pole's
          terminal state gates the task's transition.
        test_recipe:
          setup:
            - "Budget 1000000; crew CR-X; pole P-RP; cycle OPEN pct 0; task T on the pole (still OPEN)"
            - "Manual replacement order on the pole, funded, then completed -> pole REPLACED"
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 1000000 }
              as: ProgramManager
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-X", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-RP", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}", estimated_cost_cents: 300000 }
              as: ProgramManager
              captures: { o_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders/${o_id}/fund"
              payload: { budget_id: "${b_id}", expected_budget_version: "${b_v}" }
              as: ProgramManager
            - call: "POST /pole-program/replacement-work-orders/${o_id}/complete"
              payload: { actual_cost_cents: 300000 }
              as: Contractor
              as_user_id: "${cr_id}"
          trigger:
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.50
                sound_wood_pct: 90
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response == 409 ERR_POLE_REPLACED"
            - "InspectionTask.${t_id}.status stays OPEN"

      - name: claim_requires_verified_order_and_live_warranty
        grounds:
          - state_machines.WarrantyClaim
          - entities.WarrantyClaim.fields.treatment_order_id
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair WarrantyClaim -> TreatmentWorkOrder: filing against an order that is APPLIED
          but not yet VERIFIED fails with ERR_INVALID_STATE; the same filing succeeds once the
          order reaches VERIFIED and filed_at <= warranty_end_date.
        test_recipe:
          setup:
            - "Pole P-CL; crew CR-C; PENTA_GEL order scheduled and APPLIED at 2026-08-01 (warranty_end 2034-08-01)"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-CL", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-C", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: PENTA_GEL, cost_cents: 21000 }
              as: ProgramManager
              captures: { o_id: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o_id}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o_id}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
          trigger:
            - call: "POST /pole-program/warranty-claims"
              payload: { treatment_order_id: "${o_id}", claim_reason: DECAY_RECURRENCE }
              as: ProgramManager
              captures: { err: $.data.error_id }
            - call: "POST /pole-program/treatment-work-orders/${o_id}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/warranty-claims"
              payload: { treatment_order_id: "${o_id}", claim_reason: DECAY_RECURRENCE }
              as: ProgramManager
              captures: { cl_id: $.data.id, cl_st: $.data.status }
            - call: "GET /pole-program/treatment-work-orders/${o_id}"
              payload: {}
              as: ProgramManager
              captures: { w_end: $.data.warranty_end_date }
          assert:
            - "first filing == 409 ERR_INVALID_STATE (order APPLIED, not VERIFIED)"
            - "after qa PASS the identical filing succeeds: status == FILED"
            - "order warranty_end_date == 2034-08-01T00:00:00Z (PENTA_GEL 8 years from 2026-08-01)"

      - name: schedule_blocked_when_crew_suspended
        grounds:
          - validations[priority=5]
          - errors[ERR_CREW_SUSPENDED]
          - state_machines.ContractorCrew.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair TreatmentWorkOrder -> ContractorCrew: after a single FAIL on the crew's
          only event drops quality_score_rolling to 0.00 and cascades SUSPENDED, scheduling a
          different order for that crew is rejected even though the order itself is in a valid
          CREATED state.
        test_recipe:
          setup:
            - "Crew CR-Z with one order APPLIED then qa FAIL (rolling 0.00 -> SUSPENDED); a second order O2 in CREATED"
          setup_api_calls:
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-Z", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-SB", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o1: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o1}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o1}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o1}/qa-review"
              payload: { decision: FAIL }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /pole-program/treatment-work-orders/${o2}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-20", work_end_date: "2026-08-22" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response == 409 ERR_CREW_SUSPENDED"
            - "TreatmentWorkOrder.${o2}.status stays CREATED with crew_id null"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_halfopen_window_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_CREW_SCHEDULE_CONFLICT]
          - state_machines.TreatmentWorkOrder.CREATED_to_SCHEDULED
        distinguishing_aspect: |
          Half-open interval semantics on the ContractorCrew resource: [2026-08-12, 2026-08-15)
          touching an existing [2026-08-10, 2026-08-12) at the endpoint is ALLOWED (adjacency),
          while [2026-08-11, 2026-08-13) strictly overlapping is rejected.
        test_recipe:
          setup:
            - "Crew CR-H; poles P-H1/P-H2/P-H3; order O1 SCHEDULED for the crew with window [2026-08-10, 2026-08-12)"
          setup_api_calls:
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-H", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-H1", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p1: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-H2", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.1, gis_lon: -122.1, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p2: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-H3", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.2, gis_lon: -122.2, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p3: $.data.id }
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p1}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o1: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o1}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p2}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o2: $.data.id }
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p3}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o3: $.data.id }
          trigger:
            - call: "POST /pole-program/treatment-work-orders/${o2}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-12", work_end_date: "2026-08-15" }
              as: ProgramManager
              captures: { st2: $.data.status }
            - call: "POST /pole-program/treatment-work-orders/${o3}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-11", work_end_date: "2026-08-13" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "adjacent schedule [08-12, 08-15) succeeds: TreatmentWorkOrder.${o2}.status == SCHEDULED (half-open end excluded)"
            - "overlapping schedule [08-11, 08-13) rejected 409 ERR_CREW_SCHEDULE_CONFLICT; ${o3} stays CREATED"

      - name: pole_closed_window_touch_conflicts
        grounds:
          - validations[priority=8]
          - errors[ERR_TASK_WINDOW_OVERLAP]
          - entities.InspectionTask.fields.due_window_end
        distinguishing_aspect: |
          Closed-interval semantics on the Pole resource: a new task window [2026-08-20, 2026-08-30]
          touching an existing non-terminal window [2026-08-10, 2026-08-20] at a single shared day
          IS a conflict (both ends inclusive), while [2026-08-21, 2026-08-30] succeeds — the
          opposite adjacency treatment from the crew half-open rule, on a different resource.
        test_recipe:
          setup:
            - "Two OPEN cycles C1 and C2 (pct 0); pole P-CW with a non-terminal task in C1 over [2026-08-10, 2026-08-20]"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-CW", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c1: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c1}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2027, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c2: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c2}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c1}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c2}", pole_id: "${p_id}", due_window_start: "2026-08-20T00:00:00Z", due_window_end: "2026-08-30T00:00:00Z" }
              as: ProgramManager
              captures: { err: $.data.error_id }
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c2}", pole_id: "${p_id}", due_window_start: "2026-08-21T00:00:00Z", due_window_end: "2026-08-30T00:00:00Z" }
              as: ProgramManager
              captures: { t3: $.data.id, st3: $.data.status }
          assert:
            - "touching window [08-20, 08-30] rejected 409 ERR_TASK_WINDOW_OVERLAP (closed intervals share 08-20)"
            - "disjoint window [08-21, 08-30] succeeds: InspectionTask.${t3}.status == OPEN in cycle ${c2}"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: fund_defund_restores_available_cents
        grounds:
          - state_machines.ReplacementWorkOrder.QUEUED_to_FUNDED
          - state_machines.ReplacementWorkOrder.FUNDED_to_QUEUED
          - entities.ProgramBudget.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity: budget cents. Invariant total_cents == available + committed + spent
          is checked after each step, and the fund/defund pair returns available_cents to exactly
          its pre-fund value 500000 — no drift from the compensating action.
        test_recipe:
          setup:
            - "Budget total 500000 (available 500000, committed 0, spent 0); plain pole; order cost 200000 (deferral 0)"
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 500000 }
              as: ProgramManager
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-IV", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}", estimated_cost_cents: 200000 }
              as: ProgramManager
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /pole-program/replacement-work-orders/${o_id}/fund"
              payload: { budget_id: "${b_id}", expected_budget_version: "${b_v}" }
              as: ProgramManager
            - call: "GET /pole-program/budgets/${b_id}"
              payload: {}
              as: ProgramManager
              captures: { a1: $.data.available_cents, c1: $.data.committed_cents, s1: $.data.spent_cents }
            - call: "POST /pole-program/replacement-work-orders/${o_id}/defund"
              payload: {}
              as: ProgramManager
            - call: "GET /pole-program/budgets/${b_id}"
              payload: {}
              as: ProgramManager
              captures: { a2: $.data.available_cents, c2: $.data.committed_cents, s2: $.data.spent_cents }
          assert:
            - "after fund: available 300000, committed 200000, spent 0 (500000 == 300000 + 200000 + 0)"
            - "after defund: available 500000 == pre-fund value, committed 0, spent 0 (500000 == 500000 + 0 + 0)"
            - "ReplacementWorkOrder.${o_id}.status == QUEUED and budget_id == null after defund"

      - name: sample_waive_restores_eligibility_pool
        grounds:
          - calculations.inspection_sample_selection
          - state_machines.InspectionTask.OPEN_to_WAIVED
        distinguishing_aspect: |
          Conserved quantity: pole eligibility-pool membership. Sampling pole P-SW into cycle A
          removes it from the candidate pool; waiving the task (the compensating action) restores
          eligibility because last_inspection_date is unchanged, so a later cycle B samples the
          same pole again — pool membership net-unchanged across the pair.
        test_recipe:
          setup:
            - "Single pole P-SW (never inspected); cycle A 2026 pct 100 opened -> P-SW sampled (pool 1, task 1)"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-SW", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 100, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { ca: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${ca}/open"
              payload: {}
              as: ProgramManager
              captures: { pool_a: $.data.sample_pool_size }
            - call: "GET /pole-program/inspection-tasks"
              payload: { cycle_id: "${ca}" }
              as: ProgramManager
              captures: { ta_id: "$.data[0].id", ta_pole: "$.data[0].pole_id" }
          trigger:
            - call: "POST /pole-program/inspection-tasks/${ta_id}/waive"
              payload: { reason: "NO_ACCESS" }
              as: ProgramManager
              captures: { st: $.data.status }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2027, cycle_length_years: 10, sample_pct: 100, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { cb: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${cb}/open"
              payload: {}
              as: ProgramManager
              captures: { pool_b: $.data.sample_pool_size }
            - call: "GET /pole-program/inspection-tasks"
              payload: { cycle_id: "${cb}" }
              as: ProgramManager
              captures: { tb_pole: "$.data[0].pole_id" }
          assert:
            - "cycle A sampled the pole: sample_pool_size == 1 and task pole_id == ${p_id}"
            - "waived task: status == WAIVED, pole.last_inspection_date unchanged (null)"
            - "cycle B samples the same pole again: sample_pool_size == 1 and its task pole_id == ${p_id} (membership restored)"



