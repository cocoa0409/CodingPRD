  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_slot_rebook_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[slot-rebook-stale-slot]", "errors[ERR_SLOT_VERSION_STALE]", endpoints]
        distinguishing_aspect: "After C1 places an order consuming the last slot unit (slot.version 1 -> 2), a second placement still carrying expected_slot_version=1 (the pre-booking value) is rejected ERR_SLOT_VERSION_STALE (412)."
        test_recipe:
          setup:
            - "Store, two Customers C1/C2, slot cap 2, UNIT A(349). C1 reads slot.version=1 and places one order (slot.version -> 2)."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cc27a@x.com", full_name: "C1", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cc27b@x.com", full_name: "C2", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 2 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c1_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v0}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
          trigger:
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c2_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v0}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
