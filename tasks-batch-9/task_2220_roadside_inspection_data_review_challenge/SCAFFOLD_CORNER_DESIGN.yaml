  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_carrier_version_on_cap_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.cap-create-stale-carrier
          - errors.ERR_STALE_CARRIER_VERSION
          - endpoints["POST /corrective-action-plans"]
        distinguishing_aspect: |
          The version the analyst read at the first fitness determination is invalidated by the second
          determination, so the create is refused with 412 even though every business precondition
          (role, carrier scope, UNSATISFACTORY fitness, no active plan) is satisfied; replaying the same
          payload with the current version succeeds, proving the refusal was purely the version guard.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM) registered, then determined CONDITIONAL and afterwards UNSATISFACTORY by auditor_bob."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id, c1_v_create: $.data.version }
            - call: "POST /carriers/${c1_id}/fitness-determination"
              payload: { determination: "CONDITIONAL", basis_note: "Compliance review found HOS recordkeeping deficiencies." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_bob"
              captures: { c1_v_stale: $.data.version }
            - call: "POST /carriers/${c1_id}/fitness-determination"
              payload: { determination: "UNSATISFACTORY", basis_note: "Follow-up review downgraded the carrier." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_bob"
              captures: { c1_v_fresh: $.data.version }
          trigger:
            - call: "POST /corrective-action-plans"
              payload: { carrier_id: "${c1_id}", expected_carrier_version: "${c1_v_stale}", narrative: "Plan written against the pre-downgrade carrier view." }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /corrective-action-plans"
              payload: { carrier_id: "${c1_id}", expected_carrier_version: "${c1_v_fresh}", narrative: "Plan written against the current carrier view." }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { cap1_id: $.data.id, cap1_status: $.data.status }
          assert:
            - "before trigger[0]: ${c1_v_create} == 1"
            - "before trigger[0]: ${c1_v_stale} == 2 and ${c1_v_fresh} == 3"
            - "before trigger[0]: Carrier.${c1_id}.safety_fitness_status == UNSATISFACTORY"
            - "trigger[0] -> 412 ERR_STALE_CARRIER_VERSION"
            - "after trigger[0]: no CorrectiveActionPlan row exists"
            - "after trigger[0]: Carrier.${c1_id}.version == 3 (a refused write does not bump the version)"
            - "trigger[1] -> 201; CorrectiveActionPlan.${cap1_id}.status == DRAFT"
            - "after trigger[1]: CorrectiveActionPlan.${cap1_id}.triggering_fitness_status == UNSATISFACTORY"
            - "after trigger[1]: CorrectiveActionPlan.${cap1_id}.item_count == 0"
            - "after trigger[1]: CorrectiveActionPlan.${cap1_id}.completion_pct == 0.0"
            - "after trigger[1]: CorrectiveActionPlan.${cap1_id}.superseded_cap_id == null"

      - name: stale_report_version_on_amendment_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.amendment-create-stale-report
          - errors.ERR_STALE_REPORT_VERSION
          - state_machines.InspectionReport.SCORED_to_AMENDED
        distinguishing_aspect: |
          Scoring is itself a write, so the version the officer read while the report was VALIDATED is
          already stale by the time the correction is filed; the amendment is refused at 412 and the
          report stays SCORED with its score intact, while the retry with the post-score version moves
          the report to AMENDED and drops it out of the measure (percentile null, NOT_ENOUGH_DATA).
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM, 20 power units, 1,600,000 VMT -> utilization factor 1.5, power_unit_exposure 30.0)."
            - "UNSAFE_DRIVING codes 392.2S (weight 5) and 392.2C (weight 8); UNSAFE_DRIVING/MEDIUM threshold with p50 0.5, p65 1.0, p80 2.0."
            - "Report r1 (inspection_start 2026-07-01, age 31 days, time weight 3) with one 392.2S violation v1, validated then scored: time_weighted_severity 15.0, certified_measure 15.0 / 30.0 = 0.500, percentile 50.0, MONITOR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "392.2S", description: "Speeding 15 or more over the limit", basic_category: "UNSAFE_DRIVING", severity_weight: 5 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_ud5_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "392.2C", description: "Failure to obey traffic control device", basic_category: "UNSAFE_DRIVING", severity_weight: 8 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_ud8_id: $.data.id }
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "UNSAFE_DRIVING", carrier_segment: "MEDIUM", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 0.5, measure_at_p65: 1.0, measure_at_p80: 2.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070419", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00423", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "${vc_ud5_id}", unit_type: "VEHICLE" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { v1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/validate"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_v_validated: $.data.version }
            - call: "POST /inspection-reports/${r1_id}/score"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_v_scored: $.data.version, r1_status: $.data.status }
          trigger:
            - call: "POST /inspection-reports/${r1_id}/amendments"
              payload: { expected_report_version: "${r1_v_validated}", amendment_type: "VIOLATION_CODE_CORRECTION", rationale: "Officer recorded the wrong control-device code.", target_violation_id: "${v1_id}", corrected_violation_code_id: "${vc_ud8_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { e1: $.data.error_id }
            - call: "POST /inspection-reports/${r1_id}/amendments"
              payload: { expected_report_version: "${r1_v_scored}", amendment_type: "VIOLATION_CODE_CORRECTION", rationale: "Officer recorded the wrong control-device code.", target_violation_id: "${v1_id}", corrected_violation_code_id: "${vc_ud8_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { am1_id: $.data.id, am1_before: $.data.report_version_before }
          assert:
            - "before trigger[0]: ${r1_v_scored} == ${r1_v_validated} + 1 (scoring is itself a write)"
            - "before trigger[0]: InspectionReport.${r1_id}.status == SCORED"
            - "before trigger[0]: BasicScore(carrier ${c1_id}, UNSAFE_DRIVING).certified_measure == 0.500 and percentile == 50.0 and alert_status == MONITOR"
            - "trigger[0] -> 412 ERR_STALE_REPORT_VERSION"
            - "after trigger[0]: InspectionReport.${r1_id}.status == SCORED and version == ${r1_v_scored}"
            - "after trigger[0]: Violation.${v1_id}.effective_violation_code_id == ${vc_ud5_id} and status == ACTIVE"
            - "after trigger[0]: GET /report-amendments?report_id=${r1_id} returns total_count 0"
            - "trigger[1] -> 201; ReportAmendment.${am1_id}.report_version_before == ${r1_v_scored}"
            - "after trigger[1]: ReportAmendment.${am1_id}.report_version_after == ${r1_v_scored} + 1"
            - "after trigger[1]: InspectionReport.${r1_id}.status == AMENDED and version == ${r1_v_scored} + 1"
            - "after trigger[1]: Violation.${v1_id}.effective_violation_code_id == ${vc_ud8_id} and status == RECODED"
            - "after trigger[1]: BasicScore(carrier ${c1_id}, UNSAFE_DRIVING).relevant_inspection_count == 0, certified_measure == 0.000, percentile == null, alert_status == NOT_ENOUGH_DATA"
            - "after trigger[1]: Carrier.${c1_id}.iss_value == 0.0 and selection_band == PASS"

