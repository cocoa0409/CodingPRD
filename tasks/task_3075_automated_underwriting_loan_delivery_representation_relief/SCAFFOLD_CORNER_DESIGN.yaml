- section: cross_cutting_layers
  instances:
  - name: occ_stale_case_covered_by_difficulty
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[uw-finalize-stale-case]
    excluded_because:
      difficulty_instance: underwriting_case_failure_revision_loop
      rationale: OCC stale-version on case finalize is exercised as a corner via error_stale_version_on_underwriting_finalize and grounded by the difficulty instance's version-aware chain.
  - name: occ_stale_pool_covered_by_difficulty
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[pool-issue-stale-pool]
    excluded_because:
      difficulty_instance: deliver_state_beats_referential_pool_closed
      rationale: OCC on pool issue is covered by error_stale_version_on_pool_issue; the pool lifecycle chains are shared with this difficulty instance.
  - name: cascade_coverage_via_difficulty_instances
    claim_type: cascading_side_effects
    grounds:
    - state_machines.Loan.UNDERWRITTEN_to_DELIVERED
    - state_machines.QcFinding.UPHELD_to_REMEDIATED
    excluded_because:
      difficulty_instance: delivery_cascade_loan_pool_pipeline_three_hops
      rationale: Both transitive cascades (delivery and demand-settle) are asserted hop-by-hop in the difficulty design.
  - name: rate_threshold_pool_capacity_covered_by_difficulty
    claim_type: rate_threshold_triggers
    grounds:
    - calculations.pool_balance
    - errors[ERR_POOL_CAPACITY_EXCEEDED]
    excluded_because:
      difficulty_instance: pool_capacity_exact_fit_then_one_cent_over
      rationale: The cumulative capacity threshold boundary (equal fits, one cent over fails) is fully exercised by the named difficulty instance.
  - name: ops_clock_drives_expiry_and_transfer_completion
    claim_type: ops_run_checkpoint
    grounds:
    - state_machines.MasterAgreement.ACTIVE_to_EXPIRED
    - state_machines.ServicingTransfer.APPROVED_to_COMPLETED
    distinguishing_aspect: 'The logical clock endpoint is the ops-run checkpoint: advancing it expires agreements and completes due servicing transfers; before any set call the clock reads the 2026-09-01T00:00:00Z
      default.'
    test_recipe:
      setup:
      - 'Clock never set: default 2026-09-01T00:00:00Z. Seller S, servicer V approved; agreement effective 2026-01-01 to 2028-01-01 ACTIVE.'
      setup_api_calls:
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      trigger:
      - call: GET /gse/master-agreements/${a1}
        payload: {}
        as: GseAdmin
        captures:
          st: $.data.status
      assert:
      - with the clock never set, the logical time is exactly the 2026-09-01T00:00:00Z default and st == ACTIVE (agreement window 2026-01-01..2028-01-01 contains the default)
  - name: derived_field_reconciliation_servicer_score
    claim_type: derived_field_reconciliation
    grounds:
    - entities.Servicer.fields.oversight_score
    - calculations.servicer_oversight_score
    distinguishing_aspect: 'oversight_score reconciles with its sources: 100 with no demands, 95 after one pending demand, back to 100 after the demand is WITHDRAWN via an overturned appeal.'
    test_recipe:
      setup:
      - Clock 2026-09-01. Full chain; loan PURCHASED serviced by V; demand ISSUED then appealed and OVERTURNED.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id010
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-REC
          borrower_name: Buyer REC
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          lr: $.data.id
      - call: POST /gse/underwriting-cases
        payload:
          loan_id: ${lr}
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          cr: $.data.id
      - call: POST /gse/underwriting-cases/${cr}/reports
        payload:
          service_type: INCOME
          provider_reference: PR-REC-INCOME
        as: Underwriter
        captures:
          cr_income: $.data.id
      - call: POST /gse/validation-reports/${cr_income}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${cr}/reports
        payload:
          service_type: ASSET
          provider_reference: PR-REC-ASSET
        as: Underwriter
        captures:
          cr_asset: $.data.id
      - call: POST /gse/validation-reports/${cr_asset}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${cr}/reports
        payload:
          service_type: EMPLOYMENT
          provider_reference: PR-REC-EMPLOYMENT
        as: Underwriter
        captures:
          cr_employment: $.data.id
      - call: POST /gse/validation-reports/${cr_employment}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: GET /gse/underwriting-cases/${cr}
        payload: {}
        as: GseAdmin
        captures:
          cr_v: $.data.version
      - call: POST /gse/underwriting-cases/${cr}/finalize
        payload:
          expected_case_version: ${cr_v}
        as: GseUnderwritingEngine
      - call: POST /gse/loans/${lr}/deliver
        payload:
          pool_id: ${pl1}
        as: SellerOfficer
        as_user_id: ${s1}
      - *id012
      - *id011
      - *id013
      - call: POST /gse/qc-audits
        payload:
          seller_id: ${s1}
          sampling_method: RANDOM
        as: QcAuditor
        captures:
          au: $.data.id
      - call: POST /gse/qc-audits/${au}/findings
        payload:
          loan_id: ${lr}
          defect_category: COLLATERAL
          severity: SIGNIFICANT
        as: QcAuditor
        captures:
          f1: $.data.id
      - call: POST /gse/qc-audits/${au}/issue-findings
        payload: {}
        as: QcAuditor
      - call: POST /gse/qc-findings/${f1}/issue-demand
        payload: {}
        as: GseAdmin
        captures:
          d1: $.data.id
      trigger:
      - call: GET /gse/servicers/${v1}
        payload: {}
        as: GseAdmin
        captures:
          sc1: $.data.oversight_score
      - call: POST /gse/repurchase-demands/${d1}/appeal
        payload:
          appeal_reason: wrong collateral read
        as: SellerOfficer
        as_user_id: ${s1}
      - call: POST /gse/repurchase-demands/${d1}/resolve-appeal
        payload:
          outcome: OVERTURNED
        as: GseAdmin
      - call: GET /gse/servicers/${v1}
        payload: {}
        as: GseAdmin
        captures:
          sc2: $.data.oversight_score
      assert:
      - 'sc1 == 95 (one pending ISSUED demand: 100 - 5)'
      - after the overturned appeal the demand is WITHDRAWN and sc2 == 100
- section: consistency_model
