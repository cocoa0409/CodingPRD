      - name: the_clock_endpoint_is_the_single_authorisation_exemption
        claim_type: shared_operations
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - validations[priority 10 ERR_UNAUTHENTICATED]
          - validations[priority 30 ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          The logical clock is test infrastructure, so it is the one endpoint granted to every role and the
          one endpoint excluded from the authentication rule - a request with no identity header at all is
          accepted. It is not exempt from shape validation, which is what separates an infrastructure
          exemption from an unguarded endpoint.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { t1: "$.data.current_utc" }
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { t2: "$.data.current_utc" }
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T11:00:00Z" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { t3: "$.data.current_utc" }
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: MultistateCoordinator
              as_user_id: "55555555-5555-5555-5555-555555555555"
              captures: { t4: "$.data.current_utc" }
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:00:00Z" }
              as: InsurerRespondent
              captures: { t5: "$.data.current_utc", swept: "$.data.data_calls_flagged_overdue" }
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T14:00:00Z" }
              as: SupervisingExaminer
              captures: { t6: "$.data.current_utc" }
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "01/09/2026 15:00" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { e1: "$.data.error_id" }
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T15:00:00+02:00" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { e2: "$.data.error_id" }
          assert:
            - "All five roles set the clock successfully and each response echoes the requested instant in current_utc"
            - "The carrier respondent succeeds with no identity header, which no other endpoint permits"
            - "A request with no identity header at all is accepted and returns data_calls_flagged_overdue == 0"
            - "A non-RFC3339 instant returns 422 ERR_INVALID_REQUEST, so the endpoint is exempt from authentication but not from validation"
            - "A correctly formatted instant carrying a non-UTC offset returns the same 422 ERR_INVALID_REQUEST"

