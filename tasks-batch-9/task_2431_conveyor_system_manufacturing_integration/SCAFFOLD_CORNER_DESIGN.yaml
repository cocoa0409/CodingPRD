            - call: "POST /segments"
              payload: { project_id: "${proj_n2}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_n2a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_n2}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_n2b: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_n2}", from_segment_id: "${seg_n2a}", to_segment_id: "${seg_n2b}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_n2}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_n2}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-061"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-16", concurrent_capacity: 1 }
              as: ShopSupervisor
              captures: { bay_n2: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_n2}", lot_code: "LOT-1600", staging_bay_id: "${bay_n2}", segment_codes: ["IB-01", "TR-02"], occupancy_start_utc: "2026-08-02T00:00:00Z", occupancy_end_utc: "2026-08-05T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_n2: $.data.id }
          trigger:
            - call: "POST /spare-part-lines"
              payload: { project_id: "33333333-3333-4333-8333-333333333333", part_no: "SP-X", criticality: "CRITICAL", unit_cost_cents: 100000, min_stock_qty: 1, lead_time_days: 10 }
              as: ProjectDirector
              as_user_id: "pd-061"
              captures: { err_n8: $.data.error_id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_n2}", lot_code: "LOT-1601", staging_bay_id: "33333333-3333-4333-8333-333333333333", segment_codes: ["IB-01"], occupancy_start_utc: "2026-08-02T00:00:00Z", occupancy_end_utc: "2026-08-05T00:00:00Z" }
              as: ShopSupervisor
              captures: { err_n9: $.data.error_id }
            - call: "POST /cutover-windows"
              payload: { project_id: "${proj_n2}", site_zone_id: "33333333-3333-4333-8333-333333333333", fabrication_lot_id: "${lot_n2}", start_utc: "2026-08-10T19:00:00Z", end_utc: "2026-08-10T23:00:00Z" }
              as: SiteManager
              as_user_id: "sm-061"
              captures: { err_n10: $.data.error_id }
          assert:
            - "all three calls return 404"
            - "the spare-part-line create returns error_id ERR_PROJECT_NOT_FOUND"
            - "the lot create returns error_id ERR_STAGING_BAY_NOT_FOUND"
            - "the window create returns error_id ERR_ZONE_NOT_FOUND"
            - "GET /fabrication-lots?project_id=${proj_n2} still returns total_count == 1 and GET /cutover-windows?project_id=${proj_n2} returns total_count == 0"

      - name: unknown_role_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: |
          An X-User-Role of Auditor is not one of the five declared roles, so the request dies at priority 1 with
          401 ERR_UNAUTHENTICATED before the priority-4 existence check can report the unknown project id.
        test_recipe:
          setup:
            - "No authentication state is needed; the id 44444444-4444-4444-8444-444444444444 does not exist."
          setup_api_calls: []
          trigger:
            - call: "GET /projects/44444444-4444-4444-8444-444444444444"
