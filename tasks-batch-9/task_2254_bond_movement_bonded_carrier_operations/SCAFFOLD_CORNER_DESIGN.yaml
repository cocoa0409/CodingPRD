      - name: export_proof_is_accepted_once_and_only_from_pending_proof
        claim_type: conditional_action
        grounds:
          - endpoints[POST /in-bond/reports/{id}/proof]
          - state_machines.InBondMovement.transit_status.ARRIVED_to_EXPORTED
          - validations[priority=9].ERR_REPORT_INVALID_STATE
        distinguishing_aspect: "A TE export report filed without proof must sit at PENDING_PROOF with the movement still ARRIVED; the proof call then drives EXPORTED -> CLOSED with a MOVEMENT_EXPORTED release, and a second proof call on the now-ACCEPTED report must fail with ERR_REPORT_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Ports 4601 (NE) / 3901 (MW); carrier ACTIVE; CONTINUOUS bond 50000.00."
            - "M_te = TE 4601->3901 filed 2026-08-01 (obligation 41.75, deadline 2026-09-05) and departed."
            - "At 2026-08-10T00:00:00Z it reports ARRIVAL at 3901; at 2026-08-12T00:00:00Z it files an EXPORT report with no proof_of_export_ref."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
