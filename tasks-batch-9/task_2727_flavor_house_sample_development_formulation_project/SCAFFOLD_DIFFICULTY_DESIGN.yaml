            - "SampleLot.${lot}.allocated_g == 170 and available_g == 330 (the rejected aliquot allocated nothing)"

      - name: costing_an_empty_component_set_is_rejected
        grounds:
          - validations[priority=61]
          - errors.ERR_FORMULA_NO_COMPONENTS
          - calculations.formula_bench_cost
          - entities.Formula.fields.component_count
          - state_machines.Formula.DRAFT_to_COSTED
        distinguishing_aspect: |
          The empty-input-set boundary of the same costing pipeline, on a third
          endpoint (POST /formulas/{formula_id}/cost). A formula with zero component
          lines must not cost to 0 cents and must not reach COSTED; the cardinality
          guard at priority 61 fires before the weight-sum guard at 62, so the
          error_id is ERR_FORMULA_NO_COMPONENTS and not ERR_WEIGHT_SUM_INVALID even
          though total_weight_pct 0.0000 also differs from 100.0000.
        test_recipe:
          setup:
            - "Brief BRF-0001 in ACCEPTED."
            - "Formula F4 created under it with no component lines at all, still in DRAFT."
          setup_api_calls:
