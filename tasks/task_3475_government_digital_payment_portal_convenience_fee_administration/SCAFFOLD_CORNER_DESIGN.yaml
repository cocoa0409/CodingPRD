      - name: err_no_statutory_coverage_on_service_activate
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NO_STATUTORY_COVERAGE
          - state_machines.ServiceCatalogItem.DRAFT_to_ACTIVE
        distinguishing_aspect: "A CONVENIENCE_FEE service with zero APPROVED authorizations cannot activate: 422 ERR_NO_STATUTORY_COVERAGE; an ABSORBED service activates without any authorization."
        test_recipe:
          setup:
