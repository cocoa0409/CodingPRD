            - call: "POST /members"
              payload: { legal_name: "Pier 9 Oyster Bar Inc", tier_id: "${tier_id}", committed_annual_spend_cents: 9000000 }
              as: GpoAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m2_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "T Okafor", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
