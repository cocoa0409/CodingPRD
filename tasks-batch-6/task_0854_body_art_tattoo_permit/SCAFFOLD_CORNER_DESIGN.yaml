          - errors[ERR_STERILIZATION_SUPERSEDE_INVALID]
          - errors[ERR_CYCLE_TIMESTAMP_FUTURE]
        distinguishing_aspect: "supersedes_record_id pointing at another establishment's record returns ERR_STERILIZATION_SUPERSEDE_INVALID (409), and a cycle_completed_at after the logical clock returns ERR_CYCLE_TIMESTAMP_FUTURE (422)."
        test_recipe:
