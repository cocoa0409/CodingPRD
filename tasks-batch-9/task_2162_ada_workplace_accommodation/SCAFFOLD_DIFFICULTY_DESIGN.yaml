              as: AccommodationCoordinator
              captures: { empG_id: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "M-E002", full_name: "Ruth Baye", department_code: "LOG", job_title: "Logistics Manager", hire_date: "2016-02-08", job_profile_id: "${jpG_id}", is_people_manager: true, annual_salary_cents: 9500000 }
