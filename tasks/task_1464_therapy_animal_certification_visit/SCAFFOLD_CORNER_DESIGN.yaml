  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: role_check_precedes_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
        distinguishing_aspect: "Authorization (priority 2) is evaluated before path existence (priority 4): a Handler calling a ProgramAdmin-only endpoint with a non-existent id gets ERR_FORBIDDEN_ROLE, not 404."
        test_recipe:
          setup: ["handler h ACTIVE"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H PR", email: "hpr@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "PATCH /v1/facilities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: { max_visit_minutes: 45 }, as: Handler, as_user_id: "${h}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (403), NOT ERR_FACILITY_NOT_FOUND (404)"

      - name: ownership_mismatch_on_checkin_returns_403
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_OWNERSHIP_MISMATCH]
        distinguishing_aspect: "A handler checking in to a visit owned by a DIFFERENT handler's team is rejected with ERR_OWNERSHIP_MISMATCH before any state or window logic."
        test_recipe:
          setup: ["visit v SCHEDULED for team of handler h1; second handler h2 ACTIVE"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H O1", email: "ho1c@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h1: $.data.id } }
