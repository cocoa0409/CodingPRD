            - "After both reciprocal accepts: second finalize returns 200, Member.${x_id}.vetting_status == VETTED, co_op_joined_at non-null"
            - "Member.${x_id}.credit_balance_hours == 10.00 and credit-ledger contains exactly one JOINING_GRANT +10.0 row"
            - "MemberReference.${ref_xf1}.reciprocal_reference_id == ${ref_f1x} and MemberReference.${ref_f1x}.reciprocal_reference_id == ${ref_xf1} (mutual link set when the reverse row was accepted)"

      - name: removal_requires_escalated_dispute
        grounds:
          - state_machines.Member.transitions.VETTED_or_SUSPENDED_to_REMOVED
          - state_machines.Dispute.transitions.MEDIATION_to_ESCALATED_REMOVAL
          - validations[priority=19]
          - calculations.removal_eligibility_check
        distinguishing_aspect: |
          Pair {Member, Dispute}: Member -> REMOVED is gated on a Dispute in
          ESCALATED_REMOVAL naming the member as respondent. Before escalation the
          remove call fails with 409 ERR_REMOVAL_CRITERIA_NOT_MET; after the mediator
          escalates a BEHAVIOR dispute, the identical remove succeeds and zeroes the
          respondent's credit with a compensating ledger row.
        test_recipe:
          setup:
            - "Founders VETTED; F2 owns pet P2 (to observe deactivation); F1 files BEHAVIOR dispute against F2; F3 (mediator_flag) assigned"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - call: "POST /coop/members/${f2_id}/pet-profiles"
              payload: { pet_name: "Mochi", species: "CAT", routine_notes: "Indoor cat.", medical_notes: "None.", emergency_vet_name: "Maple Vet Clinic", emergency_vet_phone: "+15550911", emergency_vet_address: "12 Maple St", liability_waiver_accepted: true }
              as: Member
              as_user_id: "${f2_id}"
              captures: { pet2_id: $.data.id }
            - call: "POST /coop/disputes"
              payload: { respondent_member_id: "${f2_id}", dispute_type: "BEHAVIOR", statement: "Repeated hostile messages toward neighbors in the co-op channel." }
              as: Member
              as_user_id: "${f1_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /coop/disputes/${disp_id}/assign-mediator"
              payload: { mediator_member_id: "${f3_id}" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/members/${f2_id}/remove"
              payload: { removal_reason: "Attempt before escalation" }
              as: CoopAdmin
              captures: { err: $.data.error_id }
            - call: "POST /coop/disputes/${disp_id}/escalate"
              payload: { resolution_notes: "Mediation failed; escalating to removal track." }
              as: Member
              as_user_id: "${f3_id}"
            - call: "POST /coop/members/${f2_id}/remove"
              payload: { removal_reason: "Escalated behavior case" }
              as: CoopAdmin
              captures: { f2_status: $.data.vetting_status }
          assert:
            - "First remove: 409 ERR_REMOVAL_CRITERIA_NOT_MET (dispute still MEDIATION, no at-fault incidents)"
            - "Escalate: Dispute.${disp_id}.status == ESCALATED_REMOVAL and Member.${f2_id}.reliability_score == 25 (50 - 25)"
            - "Second remove: 200, vetting_status == REMOVED (terminal), removal_reason recorded"
            - "Member.${f2_id}.credit_balance_hours == 0.00 with MEDIATION_ADJUSTMENT -10.00 ledger row; PetProfile.${pet2_id}.active == false"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (3 instances, differing interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sitter_overlap_half_open_adjacency
        grounds:
          - calculations.sitter_overlap_check
          - validations[priority=10]
          - state_machines.SittingClaim.transitions.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          Resource: sitter (Member) schedule; semantics: half-open intervals
          [start_at, end_at) with adjacency allowed — [10:00,14:00) and [14:00,18:00)
          touch but do NOT overlap (a2 == b1 passes), while [13:59,17:00) overlaps by
          one minute and is rejected with ERR_SITTER_OVERLAP. Zero-width adjacency is
          the discriminator.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet1; F3 owns pet3; F2 sits F1's canonical 10:00-14:00 request (CONFIRMED)"
            - "F3 posts R_adj 2026-09-10T14:00-18:00 and F1 posts R_ovl 2026-09-10T13:59-17:00; F2 claims both"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - call: "POST /coop/members/${f3_id}/pet-profiles"
              payload: { pet_name: "Kiwi", species: "BIRD", routine_notes: "Cover cage at night.", medical_notes: "None.", emergency_vet_name: "Maple Vet Clinic", emergency_vet_phone: "+15550911", emergency_vet_address: "12 Maple St", liability_waiver_accepted: true }
              as: Member
              as_user_id: "${f3_id}"
              captures: { pet3_id: $.data.id }
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet3_id}", start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T18:00:00Z", instructions: "Adjacent sit" }
              as: Member
              as_user_id: "${f3_id}"
              captures: { radj_id: $.data.id, radj_v: $.data.version }
            - call: "POST /coop/sitting-requests/${radj_id}/claims"
              payload: { message: "Adjacent OK" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { claimAdj_id: $.data.id }
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet1_id}", start_at: "2026-09-10T13:59:00Z", end_at: "2026-09-10T17:00:00Z", instructions: "One-minute overlap sit" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { rovl_id: $.data.id, rovl_v: $.data.version }
            - call: "POST /coop/sitting-requests/${rovl_id}/claims"
              payload: { message: "Overlapping claim" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { claimOvl_id: $.data.id }
          trigger:
            - call: "POST /coop/sitting-requests/${radj_id}/claims/${claimAdj_id}/accept"
              payload: { expected_sitting_request_version: "${radj_v}" }
              as: Member
              as_user_id: "${f3_id}"
              captures: { adj_status: $.data.status }
            - call: "POST /coop/sitting-requests/${rovl_id}/claims/${claimOvl_id}/accept"
              payload: { expected_sitting_request_version: "${rovl_v}" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent accept: 200, SittingClaim.${claimAdj_id}.status == ACCEPTED — [10:00,14:00) vs [14:00,18:00) do not overlap (half-open adjacency allowed)"
            - "Overlapping accept: 409 ERR_SITTER_OVERLAP — [13:59,17:00) intersects both existing assignments"
            - "F2.provisional_credit_hours == 8.00 (4.00 + 4.00; only the adjacent acceptance booked)"

      - name: entry_window_closed_buffered_containment
        grounds:
          - validations[priority=13]
          - entities.EntryLog.fields.occurred_at
          - entities.SittingAssignment.fields.scheduled_start_at
        distinguishing_aspect: |
          Resource: SittingAssignment loggable window; semantics: CLOSED interval with
          asymmetric buffers [scheduled_start-30m, scheduled_end+4h] — 09:30:00 and
          18:00:00 are inclusive-valid (201), 09:29:59 and 18:00:01 are
          ERR_ENTRY_OUT_OF_WINDOW. Different geometry from the sitter-overlap rule:
          closed bounds plus buffers, containment rather than collision.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet; canonical sit accepted (assignment CONFIRMED, scheduled 2026-09-10T10:00:00Z-14:00:00Z)"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - *get_asg
          trigger:
            - call: "POST /coop/sitting-assignments/${asg_id}/entry-logs"
              payload: { event_type: "PET_FED", occurred_at: "2026-09-10T09:29:59Z" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { err_low: $.data.error_id }
            - call: "POST /coop/sitting-assignments/${asg_id}/entry-logs"
              payload: { event_type: "PET_FED", occurred_at: "2026-09-10T09:30:00Z" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { entry_low: $.data.id }
            - call: "POST /coop/sitting-assignments/${asg_id}/entry-logs"
              payload: { event_type: "PET_FED", occurred_at: "2026-09-10T18:00:00Z" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { entry_high: $.data.id }
            - call: "POST /coop/sitting-assignments/${asg_id}/entry-logs"
              payload: { event_type: "PET_FED", occurred_at: "2026-09-10T18:00:01Z" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { err_high: $.data.error_id }
          assert:
            - "09:29:59 -> 422 ERR_ENTRY_OUT_OF_WINDOW (1s before the -30m buffer bound)"
            - "09:30:00 -> 201 (lower bound inclusive)"
            - "18:00:00 -> 201 (upper bound scheduled_end+4h inclusive)"
            - "18:00:01 -> 422 ERR_ENTRY_OUT_OF_WINDOW (1s past the +4h buffer bound)"
            - "GET /coop/sitting-assignments/${asg_id}/entry-logs returns exactly 2 rows (only the in-window entries persisted)"

      - name: holiday_window_edge_touch_exclusion
        grounds:
          - calculations.credit_hours_offered
          - entities.HolidayWindow.fields.window_start
          - entities.HolidayWindow.fields.window_end
        distinguishing_aspect: |
          Resource: HolidayWindow pricing interval; semantics: half-open intersection
          test (w.window_start < end_at AND w.window_end > start_at) driving the
          multiplier — a sit starting exactly at window_end (2026-12-26T00:00:00Z)
          touches the window's exclusive edge and gets multiplier 1.0 (offered 4.00),
          while a sit starting one hour before window_end intersects and gets 2.0
          (offered 8.00). Edge-touch exclusion on a third resource entity, exercised
          through pricing rather than rejection.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet; window W [2026-12-25T00:00:00Z, 2026-12-26T00:00:00Z) mult 2.0 enabled"
            - "R_edge: 2026-12-26T00:00:00Z + 4h (touches exclusive end); R_in: 2026-12-25T23:00:00Z + 4h (intersects W by 1h)"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - call: "POST /coop/holiday-windows"
              payload: { name: "ChristmasDay", window_start: "2026-12-25T00:00:00Z", window_end: "2026-12-26T00:00:00Z", demand_multiplier: 2.0 }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet1_id}", start_at: "2026-12-26T00:00:00Z", end_at: "2026-12-26T04:00:00Z", instructions: "Edge-touch sit" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { edge_offered: $.data.credit_hours_offered }
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet1_id}", start_at: "2026-12-25T23:00:00Z", end_at: "2026-12-26T03:00:00Z", instructions: "Intersecting sit" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { in_offered: $.data.credit_hours_offered }
          assert:
            - "R_edge.credit_hours_offered == 4.00 (window_end == start_at fails w.window_end > start_at; multiplier 1.0)"
            - "R_in.credit_hours_offered == 8.00 (intersection by 1h; multiplier 2.0)"
            - "Both requests 201 OPEN (F1 balance 10.00 passes each fiscal check independently)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (3 instances, distinct conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: settle_double_entry_conserves_total_credit
        grounds:
          - state_machines.SittingAssignment.transitions.COMPLETED_PENDING_REVIEW_to_SETTLED
          - calculations.member_credit_balance
          - entities.CreditLedgerEntry.fields.delta_hours
        distinguishing_aspect: |
          Conserved quantity: total settled credit-hours across the two members.
          Settle posts SIT_EARNED +4.00 to the sitter and SIT_SPENT -4.00 to the
          owner, so credit_balance_hours(F1) + credit_balance_hours(F2) == 20.00
          before and after; the ledger rows for the settle sum to exactly 0.00.
        test_recipe:
          setup:
            - "Founders VETTED (balances 10.00 each; combined F1+F2 == 20.00); canonical sit completed to COMPLETED_PENDING_REVIEW (full 4h)"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - *get_asg
            - *get_ho
            - *clock_0830
            - *confirm_ho
            - *clock_1000
            - *checkin_1000
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T14:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asg_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${f2_id}"
          trigger:
            - call: "POST /coop/sitting-assignments/${asg_id}/settle"
              payload: {}
              as: CoopAdmin
          assert:
            - "Member.${f2_id}.credit_balance_hours == 14.00 and Member.${f1_id}.credit_balance_hours == 6.00 — sum 20.00 unchanged by the settle"
            - "GET /coop/members/${f2_id}/credit-ledger has SIT_EARNED +4.00 referencing ${asg_id}; GET /coop/members/${f1_id}/credit-ledger has SIT_SPENT -4.00 referencing ${asg_id}"
            - "The two settle-posted ledger rows sum to 0.00 (double-entry conservation)"

      - name: accept_cancel_roundtrip_conserves_provisional
        grounds:
          - state_machines.SittingClaim.transitions.PENDING_to_ACCEPTED
          - state_machines.SittingRequest.transitions.ASSIGNED_to_CANCELLED
          - state_machines.SittingAssignment.transitions.CONFIRMED_to_CANCELLED_BY_OWNER
          - entities.Member.fields.provisional_credit_hours
        distinguishing_aspect: |
          Conserved quantity: sitter provisional (in-flight) credit — a different
          quantity type from settled ledger balance. The forward action (accept:
          provisional 0.00 -> 4.00) paired with its compensating action (owner
          cancel: provisional 4.00 -> 0.00) is an exact identity:
          provisional_credit_hours and both credit_balance_hours fields are
          bit-identical before accept and after cancel, and no penalty rows exist.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet; canonical request OPEN; F2's claim PENDING (F2.provisional_credit_hours == 0.00, balances 10.00/10.00)"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - *get_asg
          trigger:
            - call: "POST /coop/sitting-requests/${req_id}/cancel"
              payload: { cancelled_reason: "Owner trip cancelled" }
              as: Member
              as_user_id: "${f1_id}"
          assert:
            - "After accept F2.provisional_credit_hours was 4.00; after owner-cancel it is 0.00 exactly (forward+compensating pair is identity on the provisional quantity)"
            - "Member.${f2_id}.credit_balance_hours == 10.00 and Member.${f1_id}.credit_balance_hours == 10.00 (no SIT_EARNED/SIT_SPENT/CANCELLATION_PENALTY rows — owner-cancel carries no sitter penalty)"
            - "SittingAssignment.${asg_id}.status == CANCELLED_BY_OWNER and SittingRequest.${req_id}.status == CANCELLED"
            - "F2 ledger contains exactly 1 row (JOINING_GRANT +10.0)"

      - name: removal_zeroing_preserves_ledger_replay
        grounds:
          - state_machines.Member.transitions.VETTED_or_SUSPENDED_to_REMOVED
          - calculations.member_credit_balance
          - calculations.removal_eligibility_check
          - entities.CreditLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Conserved quantity: ledger-replay consistency (credit_balance_hours ==
          SUM(delta_hours) in created_at order) across a removal that zeroes the
          balance field. Removal posts MEDIATION_ADJUSTMENT -10.00 exactly cancelling
          the +10.00 JOINING_GRANT, so the replayed sum (0.00) still equals the
          stored field (0.00) — a reconciliation invariant, distinct from the
          transfer-sum and provisional round-trip quantities.
        test_recipe:
          setup:
            - "Founders VETTED; F2 is respondent on a BEHAVIOR dispute escalated to ESCALATED_REMOVAL by mediator F3 (F2 balance 10.00, one JOINING_GRANT row)"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - call: "POST /coop/disputes"
              payload: { respondent_member_id: "${f2_id}", dispute_type: "BEHAVIOR", statement: "Aggressive conduct toward other members during handoffs." }
              as: Member
              as_user_id: "${f1_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /coop/disputes/${disp_id}/assign-mediator"
              payload: { mediator_member_id: "${f3_id}" }
              as: CoopAdmin
            - call: "POST /coop/disputes/${disp_id}/escalate"
              payload: { resolution_notes: "Unresolvable; proceeding to removal track." }
              as: Member
              as_user_id: "${f3_id}"
          trigger:
            - call: "POST /coop/members/${f2_id}/remove"
              payload: { removal_reason: "Escalated behavior removal" }
              as: CoopAdmin
          assert:
            - "Member.${f2_id}.credit_balance_hours == 0.00 and provisional_credit_hours == 0.00"
            - "GET /coop/members/${f2_id}/credit-ledger returns [JOINING_GRANT +10.0, MEDIATION_ADJUSTMENT -10.00] in created_at order; SUM(delta_hours) == 0.00 == credit_balance_hours (replay consistency preserved across the zeroing)"
            - "Member.${f2_id}.vetting_status == REMOVED and reliability_score == 25 (escalation side effect retained, not reset)"
