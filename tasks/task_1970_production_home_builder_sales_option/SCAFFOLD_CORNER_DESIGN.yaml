# =============================================================================
# Task 1970 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: community_creation_defaults_and_envelope
        claim_type: creation
        grounds: [entities.Community, entities.Community.fields.incentive_budget_remaining_cents, response_envelope]
        distinguishing_aspect: "Creating a community returns 201 with the fixed envelope (meta.api_request_id present, response_type == object), status defaulting to SETUP, and the computed budget remaining equal to the total."
        test_recipe:
          setup: ["Empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id, c_status: $.data.status } }
          assert:
            - "HTTP 201; envelope has meta.api_request_id and response_type == object"
            - "Community.${c_id}.status == SETUP (initial state)"
            - "Community.${c_id}.incentive_budget_remaining_cents == 1000000 (computed field initialized from total; client input for it is not accepted)"
            - "Community.${c_id}.version == 1 and created_at == 2026-08-01T00:00:00Z (system fields server-stamped from the logical clock)"

      - name: lot_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Lot.fields.lot_number, "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field lot_number on POST /homebuilder/lots is rejected with ERR_INVALID_REQUEST before any existence or business check."
        test_recipe:
          setup: ["Community exists (SETUP is sufficient for lot creation)"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 0 }, as: SalesDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (missing required lot_number)"

      - name: option_item_invalid_enum_category_rejected
        claim_type: type_constraints
        grounds: [entities.OptionCatalogItem.fields.category, "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A category outside the declared enum (APPLIANCES) is rejected with ERR_INVALID_REQUEST; the enum is closed."
        test_recipe:
          setup: ["Community exists"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/option-catalog-items", payload: { community_id: "${c_id}", option_name: "Fridge", category: "APPLIANCES", price_cents: 300000, cutoff_stage: "DRYWALL", install_stage: "FINAL_WALKTHROUGH" }, as: SalesDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (category not in STRUCTURAL | KITCHEN | BATH | FLOORING | ELECTRICAL | OUTDOOR)"

      - name: get_lot_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_LOT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent lot id returns 404 ERR_LOT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /homebuilder/lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SalesAgent, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404; error_id == ERR_LOT_NOT_FOUND; envelope response_type == error"

      - name: lot_listing_pagination_window
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "GET /homebuilder/lots honors limit/offset and reports total_count and has_more; with 3 lots and limit 2 the first page has has_more == true and the second page holds the remaining 1."
        test_recipe:
          setup: ["Community with 3 lots created (L-101, L-102, L-103), all DRAFT"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 0 }, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-102", base_price_cents: 5000000, lot_type: "STANDARD", view_adjustment_cents: 0 }, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-103", base_price_cents: 6000000, lot_type: "VIEW", view_adjustment_cents: 0 }, as: SalesDirector }
          trigger:
            - { call: "GET /homebuilder/lots?community_id=${c_id}&limit=2&offset=0", payload: {}, as: SalesAgent }
            - { call: "GET /homebuilder/lots?community_id=${c_id}&limit=2&offset=2", payload: {}, as: SalesAgent }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true (created_at ASC order)"
            - "Page 2: 1 item, total_count == 3, has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: community_open_sales_gates_lot_release
        claim_type: precondition_enforcement
        grounds: [state_machines.Community.SETUP_to_SELLING, state_machines.Lot.DRAFT_to_RELEASED, "errors[ERR_COMMUNITY_NOT_SELLING]"]
        distinguishing_aspect: "Releasing a lot while its community is SETUP fails with ERR_COMMUNITY_NOT_SELLING; after open-sales the same release succeeds and prices the lot."
        test_recipe:
          setup: ["Community SETUP with phase P1 ACTIVE window and lot L-101 DRAFT"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector, captures: { err: $.data.error_id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector, captures: { st: $.data.status } }
          assert:
            - "First release (community SETUP): error_id == ERR_COMMUNITY_NOT_SELLING; lot stays DRAFT"
            - "After open-sales: release succeeds, status == RELEASED, release_price_cents == 9991000"

      - name: lot_release_from_released_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Lot.DRAFT_to_RELEASED, "errors[ERR_LOT_INVALID_STATE]"]
        distinguishing_aspect: "Release is only valid from DRAFT; releasing an already-RELEASED lot fails with ERR_LOT_INVALID_STATE and does not re-price."
        test_recipe:
          setup: ["Community SELLING, phase P1 ACTIVE, lot L-101 already RELEASED at 9991000"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
          trigger:
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOT_INVALID_STATE"
            - "Lot.${lot_id}.release_price_cents == 9991000 (unchanged; no re-evaluation on rejected release)"

      - name: agreement_sign_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PurchaseAgreement.DRAFT_to_PENDING_CONTINGENCIES, "errors[ERR_AGREEMENT_INVALID_STATE]"]
        distinguishing_aspect: "Sign is only valid from DRAFT; a second sign on the same agreement (now PENDING_CONTINGENCIES) fails with ERR_AGREEMENT_INVALID_STATE — the transition is not idempotent."
        test_recipe:
          setup: ["Fully signed agreement (default fixtures)"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AGREEMENT_INVALID_STATE (second sign from PENDING_CONTINGENCIES)"
            - "PurchaseAgreement.${agr_id}.status still == PENDING_CONTINGENCIES"

      - name: milestone_complete_out_of_order_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ConstructionMilestone.NOT_STARTED_to_COMPLETE, "errors[ERR_MILESTONE_OUT_OF_ORDER]"]
        distinguishing_aspect: "Completing milestone sequence_no 2 while sequence_no 1 is NOT_STARTED fails with ERR_MILESTONE_OUT_OF_ORDER; milestones only complete in stage order."
        test_recipe:
          setup: ["Signed agreement (default fixtures); milestones m1..m5 NOT_STARTED"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "GET /homebuilder/milestones?agreement_id=${agr_id}", payload: {}, as: SalesAgent, captures: { m2: "$.data[1].id" } }
          trigger:
            - { call: "POST /homebuilder/milestones/${m2}/complete", payload: {}, as: ConstructionManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MILESTONE_OUT_OF_ORDER"
            - "ConstructionMilestone.${m2}.status still NOT_STARTED; agreement current_stage still PRE_CONSTRUCTION"

      - name: milestone_double_complete_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ConstructionMilestone.NOT_STARTED_to_COMPLETE, "errors[ERR_MILESTONE_ALREADY_COMPLETE]"]
        distinguishing_aspect: "Completing an already-COMPLETE milestone fails with ERR_MILESTONE_ALREADY_COMPLETE (terminal lockdown on the milestone's single transition)."
        test_recipe:
          setup: ["Signed agreement; milestone m1 already COMPLETE"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "GET /homebuilder/milestones?agreement_id=${agr_id}", payload: {}, as: SalesAgent, captures: { m1: "$.data[0].id" } }
            - { call: "POST /homebuilder/milestones/${m1}/complete", payload: {}, as: ConstructionManager }
          trigger:
            - { call: "POST /homebuilder/milestones/${m1}/complete", payload: {}, as: ConstructionManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MILESTONE_ALREADY_COMPLETE"
            - "PurchaseAgreement.${agr_id}.current_stage == FOUNDATION (unchanged by the rejected repeat)"

      - name: contingency_double_clear_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PurchaseAgreement.PENDING_CONTINGENCIES_to_CONTINGENCIES_CLEARED, "errors[ERR_CONTINGENCY_NOT_PENDING]"]
        distinguishing_aspect: "Clearing a contingency that is already CLEARED fails with ERR_CONTINGENCY_NOT_PENDING; the OCC version must be current for the request to even reach this check."
        test_recipe:
          setup: ["Signed agreement; financing contingency already CLEARED once (version captured after that clearance)"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { agr_v_s: $.data.version } }
            - { call: "POST /homebuilder/agreements/${agr_id}/contingency-clearance", payload: { contingency_type: "financing", action: "CLEARED", expected_agreement_version: "${agr_v_s}" }, as: SalesAgent, captures: { agr_v_c1: $.data.version } }
          trigger:
            - { call: "POST /homebuilder/agreements/${agr_id}/contingency-clearance", payload: { contingency_type: "financing", action: "CLEARED", expected_agreement_version: "${agr_v_c1}" }, as: SalesAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONTINGENCY_NOT_PENDING (financing already CLEARED; a current OCC version does not rescue a repeat)"
            - "PurchaseAgreement.${agr_id}.financing_contingency_status still == CLEARED"

      - name: incentive_double_decide_rejected
        claim_type: invalid_transition
        grounds: [state_machines.IncentiveRequest.SUBMITTED_to_DENIED, "errors[ERR_INCENTIVE_INVALID_STATE]"]
        distinguishing_aspect: "Deciding an already-DENIED incentive request fails with ERR_INCENTIVE_INVALID_STATE; DENIED is terminal."
        test_recipe:
          setup: ["Signed agreement; incentive request 300001 (above the auto-approve limit) in SUBMITTED, then DENIED once"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
