              payload: { order_id: "${order_k2_id}", delivery_center_id: "${center_bay1_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-22T17:00:00Z", scheduled_end: "2026-09-22T18:00:00Z", expected_order_version: "${order_k2_v}" }
