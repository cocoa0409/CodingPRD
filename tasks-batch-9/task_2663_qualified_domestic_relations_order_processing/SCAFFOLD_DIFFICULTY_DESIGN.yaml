            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 4000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-12-31", balance_cents: 4120000, source: "RECORDKEEPER_FEED" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
