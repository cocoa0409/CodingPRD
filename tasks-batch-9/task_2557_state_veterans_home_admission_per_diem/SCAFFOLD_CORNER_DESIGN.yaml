              payload: { veterans_home_id: "${home_id}", date_of_birth: "1950-01-01", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 80, nursing_care_for_service_connected: false, state_residency_years: 6, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { shape_err: "$.data.error_id" }
            - call: "GET /svh/veterans-homes/${home_id}/applicants"
              payload: { limit: 10 }
              as: AdmissionsCoordinator
              captures: { app_total: "$.meta.total_count" }
          assert:
            - "the create returns HTTP 422"
            - "shape_err == ERR_INVALID_REQUEST"
            - "app_total == 0"

      - name: val_invalid_enum_rejected_before_home_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=30,ERR_INVALID_REQUEST]
          - validations[priority=40,ERR_HOME_NOT_FOUND]
          - errors.ERR_HOME_NOT_FOUND
        distinguishing_aspect: |
          Priority 30 outranks priority 40: a care-unit create that carries the invalid care_level
          SKILLED against a home id that does not exist must answer ERR_INVALID_REQUEST with HTTP
          422, never ERR_HOME_NOT_FOUND with HTTP 404 - and the same bad enum against a REAL home id
          still answers ERR_INVALID_REQUEST, proving the enum check is what fired.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome exists; the id `home-does-not-exist` is guaranteed absent."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Verdant State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
          trigger:
            - call: "POST /svh/veterans-homes/home-does-not-exist/care-units"
              payload: { unit_name: "Bad Enum Unit", care_level: "SKILLED", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { both_err: "$.data.error_id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Bad Enum Unit", care_level: "SKILLED", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { enum_err: "$.data.error_id" }
            - call: "POST /svh/veterans-homes/home-does-not-exist/care-units"
              payload: { unit_name: "Good Enum Unit", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nf_err: "$.data.error_id" }
          assert:
            - "the doubly-invalid create returns HTTP 422"
            - "both_err == ERR_INVALID_REQUEST"
            - "enum_err == ERR_INVALID_REQUEST"
            - "the well-formed create against the missing home returns HTTP 404"
            - "nf_err == ERR_HOME_NOT_FOUND"

      - name: val_resident_state_beats_no_available_bed_on_transfer
        claim_type: priority_ordering
        grounds:
          - validations[priority=60,ERR_RESIDENT_STATE_INVALID]
          - validations[priority=90,ERR_NO_AVAILABLE_BED]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / resident_state_beats_no_available_bed_on_transfer"
          rationale: |
            The §1.8 instance already stages a DISCHARGED resident against a target unit whose
            available bed count is 0 and asserts ERR_RESIDENT_STATE_INVALID rather than
            ERR_NO_AVAILABLE_BED, then repairs only the bed shortage to prove the resident-state rung
            still fires. Restating the same doubly-violating transfer here would duplicate that test
            with no new distinguishing assertion available.

      - name: val_home_recognition_beats_claim_month_not_closed_on_submit
        claim_type: priority_ordering
        grounds:
          - validations[priority=70,ERR_HOME_NOT_RECOGNIZED]
          - validations[priority=85,ERR_CLAIM_MONTH_NOT_CLOSED]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / home_recognition_beats_claim_month_not_closed_on_submit"
          rationale: |
            The §1.8 instance submits a claim for the still-open current month from a SUSPENDED home
            and asserts ERR_HOME_NOT_RECOGNIZED, then restores recognition and re-submits to expose
            ERR_CLAIM_MONTH_NOT_CLOSED underneath. Both rungs of the pair are already pinned with
            exact error ids and HTTP statuses.

      - name: val_admission_requires_certified_unit
        claim_type: cross_entity_state_dependency
        grounds:
          - validations[priority=70,ERR_UNIT_NOT_CERTIFIED]
          - endpoints.POST_svh_applicants_id_admission_decision
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / admission_requires_care_unit_certified"
          rationale: |
            The §1.8 instance drives the unit to DECERTIFIED through a survey result while the
            applicant stays OFFER_ACCEPTED, asserts the admission decision fails with
            ERR_UNIT_NOT_CERTIFIED, and then re-certifies and re-runs the identical decision to
            201. A corner restatement would only re-check the same guard on the same endpoint.

      - name: val_transfer_requires_active_care_plan
        claim_type: cross_entity_state_dependency
        grounds:
          - validations[priority=75,ERR_CARE_LEVEL_MISMATCH]
          - validations[priority=76,ERR_NO_ACTIVE_CARE_PLAN]
          - endpoints.POST_svh_residents_id_transfer
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / transfer_requires_active_care_plan_matching_target_level"
          rationale: |
            The §1.8 instance already covers both halves of the dependency - a resident with no
            ACTIVE CarePlan and a resident whose ACTIVE plan names the wrong care level - and pins
            ERR_CARE_LEVEL_MISMATCH for each before amending the plan and letting the transfer
            through.

      - name: val_readmission_blocked_at_thirty_bed_hold_days
        claim_type: violation_error
        grounds:
          - validations[priority=90,ERR_BED_HOLD_EXHAUSTED]
          - calculations.census_day_classification
        excluded_because:
          difficulty_instance: "boundary_precision_check / readmission_blocked_at_exactly_thirty_bed_hold_days"
          rationale: |
            The §1.8 instance walks bed_hold_days_used to 29, 30 and 31 across separate
            hospitalization intervals and pins which readmission attempts return 201 versus
            ERR_BED_HOLD_EXHAUSTED, so the inclusive/exclusive edge of BED_HOLD_MAX_DAYS is
            already nailed to the exact day.

      - name: val_admission_posture_blocked_at_exactly_zero_beds
        claim_type: violation_error
        grounds:
          - validations[priority=72,ERR_UNIT_POSTURE_BLOCKED]
          - validations[priority=90,ERR_NO_AVAILABLE_BED]
          - calculations.care_unit_bed_availability
          - calculations.care_unit_operational_posture
        excluded_because:
          difficulty_instance: "boundary_precision_check / admission_posture_flips_at_exactly_zero_available_beds"
          rationale: |
            The §1.8 instance admits into both beds of a 2-bed unit, asserts available_bed_count 1 /
            posture OPEN and then available_bed_count 0 / posture RESTRICTED, and pins the third
            admission decision to ERR_UNIT_POSTURE_BLOCKED - which is the rung that actually fires on
            an admission at zero beds, because posture flips to RESTRICTED at available <= 0 and
            priority 72 outranks priority 90. The priority-90 ERR_NO_AVAILABLE_BED rung is only
            reachable through a transfer in (priority 72 blocks transfers only when the target is
            FROZEN), and that path is already pinned by the §1.8 priority-pair instance
            resident_state_beats_no_available_bed_on_transfer.

      - name: val_redetermination_limit_rejected_on_third_cycle
        claim_type: violation_error
        grounds:
          - validations[priority=60,ERR_REDETERMINATION_LIMIT]
          - state_machines.Applicant
        excluded_because:
          difficulty_instance: "non_linear_state_machine / applicant_ineligible_redetermination_cycle"
          rationale: |
            The §1.8 instance cycles INELIGIBLE -> UNDER_REVIEW twice, asserts
            redetermination_count 2, and pins the third request to ERR_REDETERMINATION_LIMIT with the
            applicant left in INELIGIBLE. MAX_REDETERMINATIONS therefore has no untested edge left
            for a corner instance to claim.

  - section: endpoints
    instances:
      - name: endpoint_startup_clock_default_gates_claim_month_closure
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_svh__clock_set_current_utc
          - endpoints.POST_svh__ops_census_run
          - validations[priority=85,ERR_CLAIM_MONTH_NOT_CLOSED]
        distinguishing_aspect: |
          The logical clock reads exactly 2026-08-01T00:00:00Z before ANY call to
          /_clock/set_current_utc, and that default is what business rules see - not real wall-clock
          time. Submitting a 2026-08 claim is rejected with ERR_CLAIM_MONTH_NOT_CLOSED while the
          2026-07 claim gets past the closure rung and dies one rung later at
          ERR_CLAIM_CENSUS_EMPTY. An implementation that falls back to real time would treat 2026-08
          as long closed and answer ERR_CLAIM_CENSUS_EMPTY for both.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING unit and no residents."
            - "CRITICAL: /svh/_clock/set_current_utc is NOT called anywhere in setup, so the clock holds its startup default."
          setup_api_calls:
            - call: "POST /svh/veterans-homes"
              payload: { name: "Ashfield State Veterans Home", state_code: "MN", recognition_effective_date: "2026-06-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id", rec: "$.data.recognition_status" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
          trigger:
            - call: "POST /svh/_ops/census-run"
              payload: { through_date: "2026-07-31" }
              as: StateProgramAdmin
              captures: { clock0: "$.data.current_utc", gen0: "$.data.generated_census_day_count" }
            - call: "POST /svh/per-diem-claims"
              payload: { veterans_home_id: "${home_id}", care_unit_id: "${nu_id}", claim_month: "2026-08", basis: "AUDITED_BASIS" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { aug_id: "$.data.id" }
            - call: "POST /svh/per-diem-claims/${aug_id}/submit"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { aug_err: "$.data.error_id" }
            - call: "POST /svh/per-diem-claims"
              payload: { veterans_home_id: "${home_id}", care_unit_id: "${nu_id}", claim_month: "2026-07", basis: "AUDITED_BASIS" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { jul_id: "$.data.id" }
            - call: "POST /svh/per-diem-claims/${jul_id}/submit"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { jul_err: "$.data.error_id" }
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T06:00:00Z" }
              as: StateProgramAdmin
              captures: { clock1: "$.data.current_utc" }
            - call: "POST /svh/per-diem-claims/${aug_id}/submit"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { aug_err2: "$.data.error_id" }
          assert:
            - "rec == RECOGNIZED"
            - "clock0 == 2026-08-01T00:00:00Z"
            - "gen0 == 0"
            - "the first submit of the 2026-08 claim returns HTTP 409"
            - "aug_err == ERR_CLAIM_MONTH_NOT_CLOSED"
            - "the submit of the 2026-07 claim returns HTTP 409"
            - "jul_err == ERR_CLAIM_CENSUS_EMPTY"
            - "clock1 == 2026-09-15T06:00:00Z"
            - "the second submit of the 2026-08 claim returns HTTP 409"
            - "aug_err2 == ERR_CLAIM_CENSUS_EMPTY"

      - name: endpoint_census_run_offers_before_expiring_offers
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_svh__ops_census_run
          - state_machines.WaitlistEntry
          - calculations.waitlist_queue_order
        distinguishing_aspect: |
          Step 4 of the checkpoint issues offers BEFORE it expires elapsed ones, so the run that
          lets an offer lapse cannot re-offer the same entry in that same run: the lapsing run reports
          offered_waitlist_entry_count 0 with expired_offer_count 1, and only the NEXT run re-offers
          it. An implementation that expires first would report offered 1 / expired 1 in the middle
          run and would never leave the entry sitting ACTIVE between runs.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING unit (licensed_bed_count 1, out_of_service_bed_count 0, so available_bed_count 1 and operational_posture OPEN)."
            - "One ELIGIBLE applicant holding a single ACTIVE WaitlistEntry on that unit, with a SUBMITTED NURSING assessment; declined_offer_count starts at 0."
            - "The logical clock stands at 2026-08-01T00:00:00Z and OFFER_WINDOW_DAYS is 7."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
