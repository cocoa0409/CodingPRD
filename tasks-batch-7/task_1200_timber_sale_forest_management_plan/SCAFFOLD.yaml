  - { method: POST, path: "/forestry/carbon-valuations/{id}/accept", description: "VALUED -> ACCEPTED; enrolls tract and cancels open sales", roles: [Landowner], code: 200, input: [], output: CarbonValuation, side_effects: ["valuation VALUED -> ACCEPTED", "tract OPEN -> ENROLLED_CONSERVATION with enrollment window", "open tract sales -> CANCELLED; their SUBMITTED bids -> WITHDRAWN"] }
  - { method: POST, path: "/forestry/carbon-valuations/{id}/reject", description: "VALUED -> REJECTED", roles: [Landowner], code: 200, input: [], output: CarbonValuation, side_effects: ["valuation VALUED -> REJECTED"] }
  # --- test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO8601 UTC). Startup default is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }

