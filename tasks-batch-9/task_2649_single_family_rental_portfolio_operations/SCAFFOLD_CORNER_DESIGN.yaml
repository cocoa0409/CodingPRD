# =============================================================================
# 1.9 Scaffold Corner Design - sfr-portfolio-ops
#
# Breadth pass over SCAFFOLD.yaml: one instance per extractable claim row of the
# nine claim-extraction sections. Claims whose *interesting* half is already the
# subject of a section 1.8 difficulty instance carry `excluded_because` instead
# of a `test_recipe`, naming that instance verbatim.
#
# Fixture vocabulary (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   Market ATL   - millage 125, cost_index 10250, tolerance 1000 bps, buffer 30,
#                  fraud block 6000, rti max 4000, yield floor 500, disposition
#                  floor 540, concession 500 bps, standard term 12, max_pets 2.
#   Home H1      - 118 Peachtree Way, assessed 28000000 (property tax 350000),
#                  asking rent 215000, binder 2027-06-30, HOA 60000.
#   Templates    - PAINT_INT (PAINT, HOME, 285050, 3/3, not safety critical),
#                  HVAC_REPLACE (HVAC, SYSTEM, 612450, 3/3, safety critical),
#                  FLOOR_LVP (FLOOR, SQFT, 475, 2/2, not safety critical).
#   Chain S      - clock 2026-08-01, Market ATL, three templates, Home H1, UC1
#                  submitted + APPROVED (home ACQUIRED), project (budget 400000)
#                  with one IN_HOUSE PAINT_INT order quoted 300000, scope locked
#                  2026-08-05 (home RENOVATING / FROZEN), order dispatched, clock
#                  2026-09-06, order completed at 300000 -> project RENT_READY,
#                  home STABILIZED, posture OPEN.
#   Actors       - admin-1 (PortfolioAdmin), analyst-1 / analyst-2
#                  (AcquisitionAnalyst), ic-1 (InvestmentCommittee), ops-1
#                  (OperationsManager), vm-1 (VendorManager), agent-1
#                  (LeasingAgent), co-1 / co-2 (ComplianceOfficer), rd-1
#                  (RegionalDirector), device-pN (Anonymous prospect devices).
#
# Every numeric literal in `assert:` is pre-computed from the section 1.3
# formulas; no assert contains an expression for the implementation to evaluate.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: market_creation_persists_every_policy_field
        claim_type: creation
        grounds:
          - entities.Market
          - endpoints[POST /markets]
        distinguishing_aspect: |
          POST /markets stores all 24 declared policy inputs verbatim - including the
          restricted_breeds string array - and returns the row with version 1; an implementation
          that drops or defaults any policy field fails here rather than later inside a calculation.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
          trigger:
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { mkt_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Market.${mkt_id}.code == ATL"
            - "Market.${mkt_id}.tax_jurisdiction_code == GA-FULTON"
            - "Market.${mkt_id}.millage_bps == 125"
            - "Market.${mkt_id}.cost_index_bps == 10250"
            - "Market.${mkt_id}.cost_variance_tolerance_bps == 1000"
            - "Market.${mkt_id}.turn_holdback_cap_bps == 1500"
            - "Market.${mkt_id}.showing_buffer_minutes == 30"
            - "Market.${mkt_id}.max_pets == 2"
            - "Market.${mkt_id}.restricted_breeds == [PIT_BULL, ROTTWEILER]"
            - "Market.${mkt_id}.underwriting_yield_floor_bps == 500"
            - "Market.${mkt_id}.disposition_yield_floor_bps == 540"
            - "Market.${mkt_id}.max_rent_concession_bps == 500"
            - "Market.${mkt_id}.version == 1"

      - name: home_retrieval_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - entities.Home
          - endpoints[GET /homes/{homeId}]
        distinguishing_aspect: |
          A freshly created Home reads back with both dimensions at their initial states
          (asset_status PIPELINE, occupancy_status VACANT), the derived property tax 350000, the
          derived posture RESTRICTED from clause 5 of home_leasing_posture, and every disposition
          field at its zero value - one GET that pins the whole initial row.
        test_recipe:
          setup:
            - "Market ATL exists; Home H1 has just been created and nothing else has happened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { mkt_id: $.data.id }
            - call: "POST /homes"
              payload: { market_id: "${mkt_id}", address_line1: "118 Peachtree Way", city: "Atlanta", state_code: "GA", postal_code: "30318", bedrooms: 3, bathrooms: 2, square_feet: 1650, year_built: 1998, assessed_value_cents: 28000000, asking_rent_cents: 215000, insurance_carrier_name: "Southeast Mutual", insurance_annual_premium_cents: 180000, insurance_binder_expires_on: "2027-06-30", hoa_name: "Peachtree HOA", hoa_annual_cents: 60000 }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { home_id: $.data.id }
          trigger:
            - call: "GET /homes/${home_id}"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
          assert:
            - "response.http_status == 200"
            - "Home.${home_id}.market_id == ${mkt_id}"
            - "Home.${home_id}.address_line1 == 118 Peachtree Way"
            - "Home.${home_id}.assessed_value_cents == 28000000"
            - "Home.${home_id}.asking_rent_cents == 215000"
            - "Home.${home_id}.property_tax_annual_cents == 350000"
            - "Home.${home_id}.asset_status == PIPELINE"
            - "Home.${home_id}.occupancy_status == VACANT"
            - "Home.${home_id}.leasing_posture == RESTRICTED"
            - "Home.${home_id}.booked_showing_count == 0"
            - "Home.${home_id}.disposition_mode == NONE"
            - "Home.${home_id}.lot_code is the empty string"
            - "Home.${home_id}.bpo_value_cents == 0"
            - "Home.${home_id}.net_sale_proceeds_cents == 0"
            - "Home.${home_id}.realized_gain_cents == 0"
            - "Home.${home_id}.hold_sell_score_bps is null (no APPROVED case yet)"
            - "Home.${home_id}.disposition_flagged == false"
            - "Home.${home_id}.version == 1"

      - name: home_listing_filters_by_market_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /homes]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three ATL homes and one DAL home stored, GET /homes?market_id=<ATL> reports
          total_count 3 (not 4) and has_more true on a limit-2 page, and the offset-2 page returns
          the single remaining ATL row with has_more false - the filter is applied before the count,
          not after the page slice.
        test_recipe:
          setup:
            - "Markets ATL and DAL exist; three homes in ATL and one home in DAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { mkt_id: $.data.id }
            - call: "POST /markets"
              payload: { code: "DAL", name: "Dallas", tax_jurisdiction_code: "TX-DALLAS", millage_bps: 200, rent_index_cents: 190000, cost_index_bps: 9900, cost_variance_tolerance_bps: 800, make_ready_target_days: 25, turn_holdback_cap_bps: 1200, showing_buffer_minutes: 45, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 25000, pet_deposit_cap_cents: 40000, max_pets: 1, restricted_breeds: ["PIT_BULL"], standard_lease_term_months: 12, fraud_block_threshold_bps: 5500, rent_to_income_max_bps: 3800, vacancy_loss_bps: 600, bad_debt_bps: 150, mgmt_fee_bps: 750, underwriting_yield_floor_bps: 520, disposition_yield_floor_bps: 560, max_rent_concession_bps: 300 }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { dal_id: $.data.id }
            - call: "POST /homes"
              payload: { market_id: "${mkt_id}", address_line1: "118 Peachtree Way", city: "Atlanta", state_code: "GA", postal_code: "30318", bedrooms: 3, bathrooms: 2, square_feet: 1650, year_built: 1998, assessed_value_cents: 28000000, asking_rent_cents: 215000, insurance_carrier_name: "Southeast Mutual", insurance_annual_premium_cents: 180000, insurance_binder_expires_on: "2027-06-30", hoa_name: "Peachtree HOA", hoa_annual_cents: 60000 }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { home_id: $.data.id }
            - call: "POST /homes"
              payload: { market_id: "${mkt_id}", address_line1: "220 Marietta Street", city: "Atlanta", state_code: "GA", postal_code: "30313", bedrooms: 4, bathrooms: 3, square_feet: 2100, year_built: 2004, assessed_value_cents: 31000000, asking_rent_cents: 240000, insurance_carrier_name: "Southeast Mutual", insurance_annual_premium_cents: 195000, insurance_binder_expires_on: "2027-06-30" }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { home2_id: $.data.id }
            - call: "POST /homes"
              payload: { market_id: "${mkt_id}", address_line1: "330 Ponce Avenue", city: "Atlanta", state_code: "GA", postal_code: "30308", bedrooms: 2, bathrooms: 1, square_feet: 1200, year_built: 1975, assessed_value_cents: 19000000, asking_rent_cents: 165000, insurance_carrier_name: "Southeast Mutual", insurance_annual_premium_cents: 150000, insurance_binder_expires_on: "2027-06-30" }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { home3_id: $.data.id }
            - call: "POST /homes"
              payload: { market_id: "${dal_id}", address_line1: "77 Elm Street", city: "Dallas", state_code: "TX", postal_code: "75201", bedrooms: 3, bathrooms: 2, square_feet: 1700, year_built: 2001, assessed_value_cents: 24000000, asking_rent_cents: 195000, insurance_carrier_name: "Lone Star Casualty", insurance_annual_premium_cents: 170000, insurance_binder_expires_on: "2027-06-30" }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { home4_id: $.data.id }
          trigger:
            - call: "GET /homes?market_id=${mkt_id}&limit=2&offset=0"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "admin-1"
            - call: "GET /homes?market_id=${mkt_id}&limit=2&offset=2"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "admin-1"
            - call: "GET /homes?limit=10&offset=0"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1: response.http_status == 200"
            - "trigger call 1: total_count == 3"
            - "trigger call 1: has_more == true"
            - "trigger call 1: limit == 2 and offset == 0"
            - "trigger call 1: the returned array holds exactly 2 rows, each one of ${home_id} / ${home2_id} / ${home3_id}"
            - "trigger call 1: ${home4_id} does not appear in the returned array"
            - "trigger call 2: total_count == 3"
            - "trigger call 2: has_more == false"
            - "trigger call 2: the returned array holds exactly 1 row - the ATL home absent from trigger call 1"
            - "trigger call 3: total_count == 4"
            - "trigger call 3: has_more == false"

      - name: unknown_catalog_and_acquisition_ids_not_found_404
        claim_type: not_found
        grounds:
          - validations[V050]
          - validations[V052]
          - validations[V054]
          - validations[V056]
        distinguishing_aspect: |
          Four independent catalog / acquisition roots each answer an unknown id with their own
          error_id at 404 - ERR_MARKET_NOT_FOUND, ERR_SCOPE_TEMPLATE_NOT_FOUND, ERR_HOME_NOT_FOUND
          and ERR_UNDERWRITING_CASE_NOT_FOUND - so a shared generic 404 handler fails three of the
          four asserts.
        test_recipe:
          setup:
            - "Empty database except the logical clock; no row of any kind is required."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
          trigger:
            - call: "GET /markets/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "admin-1"
            - call: "GET /scope-templates/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "admin-1"
            - call: "GET /homes/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "admin-1"
            - call: "GET /underwriting-cases/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
          assert:
            - "trigger call 1: response.http_status == 404 and response.error_id == ERR_MARKET_NOT_FOUND"
            - "trigger call 2: response.http_status == 404 and response.error_id == ERR_SCOPE_TEMPLATE_NOT_FOUND"
            - "trigger call 3: response.http_status == 404 and response.error_id == ERR_HOME_NOT_FOUND"
            - "trigger call 4: response.http_status == 404 and response.error_id == ERR_UNDERWRITING_CASE_NOT_FOUND"

      - name: unknown_vendor_and_project_ids_not_found_404
        claim_type: not_found
        grounds:
          - validations[V058]
          - validations[V060]
          - validations[V062]
          - validations[V064]
        distinguishing_aspect: |
          The vendor-network and renovation roots answer unknown ids with ERR_VENDOR_NOT_FOUND,
          ERR_VENDOR_CERTIFICATION_NOT_FOUND, ERR_RENOVATION_PROJECT_NOT_FOUND and
          ERR_WORK_ORDER_NOT_FOUND respectively, each at 404.
        test_recipe:
          setup:
            - "Empty database except the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
          trigger:
            - call: "GET /vendors/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: VendorManager
              as_user_id: "vm-1"
            - call: "GET /vendor-certifications/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: VendorManager
              as_user_id: "vm-1"
            - call: "GET /renovation-projects/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "GET /work-orders/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
          assert:
            - "trigger call 1: response.http_status == 404 and response.error_id == ERR_VENDOR_NOT_FOUND"
            - "trigger call 2: response.http_status == 404 and response.error_id == ERR_VENDOR_CERTIFICATION_NOT_FOUND"
            - "trigger call 3: response.http_status == 404 and response.error_id == ERR_RENOVATION_PROJECT_NOT_FOUND"
            - "trigger call 4: response.http_status == 404 and response.error_id == ERR_WORK_ORDER_NOT_FOUND"

      - name: unknown_leasing_and_compliance_ids_not_found_404
        claim_type: not_found
        grounds:
          - validations[V066]
          - validations[V068]
          - validations[V070]
          - validations[V072]
          - validations[V074]
        distinguishing_aspect: |
          The five leasing / compliance roots answer unknown ids with ERR_PROSPECT_NOT_FOUND,
          ERR_SHOWING_SLOT_NOT_FOUND, ERR_RENTAL_APPLICATION_NOT_FOUND, ERR_LEASE_NOT_FOUND and
          ERR_COMPLIANCE_OBLIGATION_NOT_FOUND, completing the 13-root existence layer.
        test_recipe:
          setup:
            - "Empty database except the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
          trigger:
            - call: "GET /prospects/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: LeasingAgent
              as_user_id: "agent-1"
            - call: "GET /showing-slots/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: LeasingAgent
              as_user_id: "agent-1"
            - call: "GET /rental-applications/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: LeasingAgent
              as_user_id: "agent-1"
            - call: "GET /leases/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: LeasingAgent
              as_user_id: "agent-1"
            - call: "GET /compliance-obligations/00000000-0000-4000-8000-000000000013"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "trigger call 1: response.http_status == 404 and response.error_id == ERR_PROSPECT_NOT_FOUND"
            - "trigger call 2: response.http_status == 404 and response.error_id == ERR_SHOWING_SLOT_NOT_FOUND"
            - "trigger call 3: response.http_status == 404 and response.error_id == ERR_RENTAL_APPLICATION_NOT_FOUND"
            - "trigger call 4: response.http_status == 404 and response.error_id == ERR_LEASE_NOT_FOUND"
            - "trigger call 5: response.http_status == 404 and response.error_id == ERR_COMPLIANCE_OBLIGATION_NOT_FOUND"

      - name: missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[V010]
          - validations[V012]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          V010 (absent required field) and V012 (degenerate interval) both surface as
          ERR_INVALID_REQUEST at 400 and both fire ahead of every existence and business check, so a
          work-order payload missing crew_size is rejected even though its home and template exist,
          and a zero-length showing slot is rejected before the min-duration rule V450 is consulted.
        test_recipe:
          setup:
            - "Market ATL, the PAINT_INT template and Home H1 exist; nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { mkt_id: $.data.id }
            - call: "POST /scope-templates"
              payload: { code: "PAINT_INT", name: "Interior Paint", certification_code: "PAINT", unit: "HOME", benchmark_unit_cost_cents: 285050, default_crew_size: 3, default_crew_days: 3, safety_critical: false }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { st_paint_id: $.data.id }
            - call: "POST /homes"
              payload: { market_id: "${mkt_id}", address_line1: "118 Peachtree Way", city: "Atlanta", state_code: "GA", postal_code: "30318", bedrooms: 3, bathrooms: 2, square_feet: 1650, year_built: 1998, assessed_value_cents: 28000000, asking_rent_cents: 215000, insurance_carrier_name: "Southeast Mutual", insurance_annual_premium_cents: 180000, insurance_binder_expires_on: "2027-06-30", hoa_name: "Peachtree HOA", hoa_annual_cents: 60000 }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /homes"
              payload: { market_id: "${mkt_id}", address_line1: "440 Boulevard NE", city: "Atlanta", state_code: "GA", postal_code: "30312", bedrooms: 3, bathrooms: 2, square_feet: 1500, year_built: 1990, assessed_value_cents: 22000000, insurance_carrier_name: "Southeast Mutual", insurance_annual_premium_cents: 160000, insurance_binder_expires_on: "2027-06-30" }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", scope_template_id: "${st_paint_id}", work_type: "RESIDENT_MAINTENANCE", quantity: 1, scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-11", fulfillment_channel: "IN_HOUSE", quoted_cost_cents: 300000 }
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /showing-slots"
              payload: { home_id: "${home_id}", starts_at: "2026-08-20T15:00:00Z", ends_at: "2026-08-20T15:00:00Z", access_mode: "SMART_LOCK" }
              as: LeasingAgent
              as_user_id: "agent-1"
          assert:
            - "trigger call 1: response.http_status == 400 and response.error_id == ERR_INVALID_REQUEST (asking_rent_cents absent)"
            - "trigger call 2: response.http_status == 400 and response.error_id == ERR_INVALID_REQUEST (crew_size absent)"
            - "trigger call 3: response.http_status == 400 and response.error_id == ERR_INVALID_REQUEST (starts_at == ends_at)"
            - "trigger call 3: response.error_id != ERR_SLOT_DURATION_INVALID"
            - "after all three triggers, GET /homes?market_id=${mkt_id} still reports total_count == 1"

      - name: omitted_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Home.fields.hoa_name
          - entities.Home.fields.hoa_annual_cents
          - entities.WorkOrder.fields.project_id
