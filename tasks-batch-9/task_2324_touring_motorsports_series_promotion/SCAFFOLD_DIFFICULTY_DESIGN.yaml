  - rule_id: non_linear_state_machine
    instances:
      - name: booking_negotiation_cycles_until_the_round_cap_bites
        grounds:
          - state_machines.VenueBooking.TERMS_PROPOSED_to_COUNTERED
          - state_machines.VenueBooking.COUNTERED_to_TERMS_PROPOSED
          - entities.VenueBooking.fields.negotiation_round
          - entities.VenueBooking.fields.terms_source
          - validations[priority=14]
        distinguishing_aspect: |
          A true cycle, not a linear chain: the row re-enters TERMS_PROPOSED after every counter and
          the loop is bounded by a monotone counter rather than by the state itself. Round 1 -> 2 -> 3
          are all legal from the identical state; the fourth counter is rejected from that same state
          purely because negotiation_round has saturated at MAX_NEGOTIATION_ROUNDS.
        test_recipe:
          setup:
            - "Season and Venue 'Atlanta Dome' with market_code ATL"
            - "One booking for 2026-11-14 in state TERMS_PROPOSED, negotiation_round 1, terms_source PROMOTER"
            - "The VenueManager acting with X-User-ID equal to the booked venue's id"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
          trigger:
            - call: "POST /venue-bookings/${b_atl}/counter"
              payload: { rental_base_cents: 3400000, revenue_share_pct: 0.14, per_ticket_facility_fee_cents: 400, note: "round 2 from the building" }
              as: VenueManager
              as_user_id: "${venue_atl}"
            - call: "POST /venue-bookings/${b_atl}/revise"
              payload: { rental_base_cents: 3100000, revenue_share_pct: 0.13, per_ticket_facility_fee_cents: 375, note: "promoter re-proposal" }
              as: SeriesPromoter
            - call: "POST /venue-bookings/${b_atl}/counter"
              payload: { rental_base_cents: 3300000, revenue_share_pct: 0.135, per_ticket_facility_fee_cents: 390, note: "round 3 from the building" }
              as: VenueManager
              as_user_id: "${venue_atl}"
            - call: "POST /venue-bookings/${b_atl}/revise"
              payload: { rental_base_cents: 3200000, revenue_share_pct: 0.13, per_ticket_facility_fee_cents: 380, note: "final promoter position" }
              as: SeriesPromoter
            - call: "POST /venue-bookings/${b_atl}/counter"
              payload: { rental_base_cents: 3250000, revenue_share_pct: 0.132, per_ticket_facility_fee_cents: 385, note: "one counter too many" }
              as: VenueManager
              as_user_id: "${venue_atl}"
              captures: { err_rounds: "$.data.error_id" }
          assert:
            - "after trigger call 1: VenueBooking.${b_atl}.state == COUNTERED, negotiation_round == 2, terms_source == VENUE, last_counter_by_user_id == \"${venue_atl}\""
            - "after trigger call 2: VenueBooking.${b_atl}.state == TERMS_PROPOSED, negotiation_round == 2, terms_source == PROMOTER, rental_base_cents == 3100000"
            - "after trigger call 3: VenueBooking.${b_atl}.state == COUNTERED and negotiation_round == 3"
            - "after trigger call 4: VenueBooking.${b_atl}.state == TERMS_PROPOSED and negotiation_round == 3 (revise never advances the round)"
            - "trigger call 5 returns HTTP 409 with ${err_rounds} == ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
            - "after trigger call 5: VenueBooking.${b_atl}.state == TERMS_PROPOSED, negotiation_round == 3, rental_base_cents == 3200000 (the rejected counter left no trace)"

      - name: tech_inspection_self_loops_on_failure_then_falls_out_to_tech_held
        grounds:
          - state_machines.VehicleEntry.tech_status_branching
          - entities.VehicleEntry.fields.tech_status
          - entities.VehicleEntry.fields.tech_attempt_count
          - entities.VehicleEntry.fields.failed_attempt_count
          - entities.TechInspection.fields.attempt_no
          - validations[priority=22]
        distinguishing_aspect: |
          Branching plus a bounded self-loop rather than a forward chain: the identical FAILED trigger
          keeps the entry in TECH_PENDING on attempts 1 and 2 and only diverts it to the absorbing
          TECH_HELD state on attempt 3, when the attempt budget is spent. A fourth attempt is refused
          outright, so the same trigger produces three different outcomes from what looks like the
          same state.
        test_recipe:
          setup:
            - "A CONFIRMED ATL booking with its TourStop and show_start_utc 2026-11-14T23:00:00Z"
            - "One vehicle entry CHECKED IN (STAGED) with the clock at 2026-11-14T17:00:00Z"
            - "MAX_TECH_ATTEMPTS is 3 and no TechInspection rows exist for the entry"
