        distinguishing_aspect: "Covers concurrency_rules.weather-declare-stale-course on POST /weather-events: the bump comes from an unrelated allocation revision, so the declarer's token is invalidated by a write on a different aspect of the same course, and the refusal creates no WeatherEvent at all."
        test_recipe:
          setup:
