            - call: "GET /drawing-packages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SealingEngineer
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProductionPlanner
            - call: "GET /production-lines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProductionPlanner
            - call: "GET /production-lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProductionPlanner
            - call: "GET /shipment-loads/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "all ten calls return HTTP 404 with response_type == error"
            - "the error_ids are, in call order, ERR_JURISDICTION_NOT_FOUND, ERR_BUILDER_NOT_FOUND, ERR_CONFIGURATION_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_DESIGN_NOT_FOUND, ERR_DRAWING_PACKAGE_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_LOAD_NOT_FOUND"
            - "no call returns a bare ERR_NOT_FOUND and none returns 200 with a null data payload"
            - "every response carries a non-empty data.message and the standard meta envelope"

