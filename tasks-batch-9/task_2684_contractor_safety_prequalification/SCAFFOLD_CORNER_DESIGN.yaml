            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2025, hours_worked: 500000, recordable_incidents: 2, dart_cases: 1, fatalities: 0, emr: 0.80, citation_count_willful: 0, citation_count_serious: 0, citation_count_other: 1, source_document_ref: "OSHA300A-2025" }
