    side_effects:
      - "status=FILED; crash_evidence_retained and retention_expires_at computed per §1.3 incident_retention_expiry"
      - "territory.total_severe_incidents recomputed per §1.3 territory_total_severe_incidents"
  - method: GET
    path: "/fleet/incident-reports"
    description: "List IncidentReports, optionally filtered by status, session or vehicle"
    roles: [SafetyReviewer, FleetOperations]
    code: 200
    input: ["status?", "assistance_session_id?", "vehicle_id?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []
  - method: GET
    path: "/fleet/incident-reports/{incidentId}"
    description: "Get an IncidentReport with its computed retention fields"
    roles: [SafetyReviewer, FleetOperations]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: GET
    path: "/fleet/assistance-sessions/{sessionId}/incident-reports"
    description: "List IncidentReports filed from an assistance session"
