            - "call 4: HTTP 409 error_id \"ERR_CORRECTION_ALREADY_RESOLVED\"; the request stays REJECTED and the game stays PROVISIONAL with collection_status \"COLLECTED\""

      - name: certify_admitted_at_exactly_the_quality_index_floor
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=69]
          - calculations.event_tag_quality_index.constants.QUALITY_INDEX_FLOOR
          - state_machines.Game
        distinguishing_aspect: |
          A single accepted tag at confidence 0.90 scores 0.5*0.90 + 0.3*1 + 0.2*(1/4) = 0.8000, which is
          equal to QUALITY_INDEX_FLOOR, and the gate is inclusive, so certification must succeed on the
          exact boundary and carry the game to OFFICIAL/ARCHIVED with certified_at_utc stamped from the
          logical clock. Falsified by a strict > comparison or by a certified_at_utc taken from wall time.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z; Harbor Arena CERTIFIED"
            - "game COLLECTED, certification_status PROVISIONAL, one ACCEPTED tag at confidence 0.90, no corrections"
