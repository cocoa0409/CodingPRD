              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Walter Nkemelu", birth_date: "1958-03-01", hire_date: "1988-09-01", retirement_date: "2023-03-31", credited_service_months: 402, medicare_status: "MEDICARE_ENROLLED", medicare_part_b_effective_date: "2023-04-01" }
