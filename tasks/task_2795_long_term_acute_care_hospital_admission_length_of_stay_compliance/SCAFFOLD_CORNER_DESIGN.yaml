          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207."
            - "Two referring hospitals: Metro General (ACUTE_CARE, not co-located, threshold 25.00) and Rural Access (CRITICAL_ACCESS, threshold 50.00)."
            - "Five patients MRN-550..MRN-554, each with a qualifying PMV referral (240 vent hours, 5 ICU days)."
