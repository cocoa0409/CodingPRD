# =============================================================================
# SCAFFOLD.yaml — Bank-Fintech Partnership Oversight
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml (siblings of this file).
# =============================================================================

scenario: |
  Bank-Fintech Partnership Oversight (sponsor bank fintech program office):
  partner due diligence covering business model, funding, compliance capability
  and consumer complaint history, program agreement with responsibility
  allocation, oversight rights, audit access and termination triggers,
  compliance management system extension over the partner including marketing
  review and disclosure approval, transaction monitoring, customer
  identification and dispute handling ownership, settlement, reserve accounts
  and end-user funds custody with ledger reconciliation, complaint aggregation
  from all channels with root cause analysis, program growth limits,
  concentration caps and wind-down planning.

domain_name: bank-fintech-partnership-oversight
api_prefix: /oversight

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: flat
  # Every entity is a peer collection directly under /oversight; parentage is
  # expressed only through FK body fields, never through nested URL segments.
  # The single hierarchy in the model is Partner -> Partner (corporate group
  # tree) and it is also expressed as an FK field, not as a URL path.

  state_machine_shape: cyclic
  # DiligenceReview (SUBMITTED -> INFO_REQUESTED -> SUBMITTED),
  # MarketingReview (SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED),
  # ProgramAgreement (PENDING_RISK_APPROVAL -> DRAFT -> PENDING_RISK_APPROVAL),
  # Complaint (ROOT_CAUSE_ASSIGNED -> ESCALATED -> ROOT_CAUSE_ASSIGNED),
  # CustodyAccount (ACTIVE -> FROZEN -> ACTIVE),
  # WindDownPlan (PENDING_APPROVAL -> DRAFT -> PENDING_APPROVAL),
  # TransactionMonitoringAlert (OPEN -> PARTNER_RESPONSE_PENDING -> OPEN);
  # SettlementBatch additionally carries two independent state dimensions
  # (reconciliation_status and funding_status) on the same row.

  relationship_patterns:
    - one_to_many          # Partner -> DiligenceReview / SettlementBatch / Complaint / ...
    - self_referential     # Partner.parent_partner_id -> Partner.id (corporate group tree)
    - cross_aggregate      # LedgerEntry references CustodyAccount AND SettlementBatch
    - polymorphic_owner    # ProgramAgreement.responsibility allocation names BANK|PARTNER|SHARED owners

  role_model: segregation_of_duties
  # The bank user who drafts a ProgramAgreement may not be the RiskCommittee
  # user who executes it; the user who files a MarketingReview may not be the
  # ComplianceOfficer who approves it. Enforced on X-User-ID.

  consistency_model: immediate
  # Every cascade (ledger -> custody balance -> reserve shortfall -> posture ->
  # custody freeze) completes inside the triggering request. The only deferred
  # work is the ops-run checkpoint POST /oversight/cycles/{id}/close, which is
  # itself an explicit synchronous request.

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Partner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the fintech partner.
        constraints: "1..120 chars, non-blank"
      - name: parent_partner_id
        type: string
        source: input
        description: "FK -> Partner.id; nullable self-reference naming the immediate corporate parent inside a partner group. null means this Partner is a group root."
        default: null
        constraints: "must reference an existing Partner; the resulting parent chain must be acyclic (see validations priority 22)"
      - name: business_model
        type: enum
        source: input
        description: Revenue/product model of the partner program.
        constraints: "one of LENDING, DEPOSIT_WALLET, CARD_ISSUING, PAYMENT_FACILITATION"
      - name: funding_stage
        type: enum
        source: input
        description: Equity funding maturity used by the funding sub-score.
        constraints: "one of SEED, SERIES_A, SERIES_B_PLUS, PUBLIC"
      - name: months_runway
        type: integer
        source: input
        description: Partner-declared months of cash runway at diligence time.
        constraints: ">= 0, <= 120"
      - name: disclosed_complaints_per_10k
        type: number
        source: input
        description: Partner-disclosed pre-onboarding consumer complaints per 10000 end-user accounts.
        constraints: ">= 0, <= 10000, 2 decimal places"
      - name: end_user_account_count
        type: integer
        source: input
        description: Most recent partner-reported count of live end-user accounts; denominator of complaint_rate_bps.
        default: 0
        constraints: ">= 0; replaced by POST /oversight/partners/{id}/account-census"
      - name: status
        type: enum
        source: system
        description: Partner program lifecycle state (see §1.2 Partner).
        default: PROSPECT
        constraints: "one of PROSPECT, IN_DILIGENCE, DILIGENCE_PASSED, DILIGENCE_FAILED, CONTRACTED, LIVE, WIND_DOWN, TERMINATED"
      - name: oversight_posture
        type: enum
        source: computed
        description: Derived supervisory posture gating child operations; recomputed by calculation partner_oversight_posture.
        default: OPEN
        constraints: "one of OPEN, HEIGHTENED, RESTRICTED, FROZEN"
      - name: capability_tier
        type: enum
        source: computed
        description: Tier written by calculation diligence_composite_score when a DiligenceReview reaches PASSED.
        default: UNRATED
        constraints: "one of UNRATED, TIER_1, TIER_2, TIER_3"
      - name: latest_composite_score
        type: number
        source: computed
        description: Composite diligence score (1 decimal) of the most recently PASSED or FAILED DiligenceReview for this Partner.
        default: 0.0
      - name: complaint_rate_bps
        type: integer
        source: computed
        description: Trailing-90-day complaints per 10000 end-user accounts, integer basis points; see calculation complaint_rate_bps.
        default: 0
      - name: total_complaint_count
        type: integer
        source: computed
        description: Count of all Complaint rows whose partner_id equals this Partner.id.
        default: 0
      - name: open_complaint_count
        type: integer
        source: computed
        description: Count of Complaint rows for this Partner with status IN {RECEIVED, ROOT_CAUSE_ASSIGNED}.
        default: 0
      - name: escalated_complaint_count
        type: integer
        source: computed
        description: Count of Complaint rows for this Partner with status == ESCALATED.
        default: 0
      - name: resolved_complaint_count
        type: integer
        source: computed
        description: Count of Complaint rows for this Partner with status == RESOLVED.
        default: 0
      - name: withdrawn_complaint_count
        type: integer
        source: computed
        description: Count of Complaint rows for this Partner with status == WITHDRAWN.
        default: 0
      - name: open_sanctions_alert_count
        type: integer
        source: computed
        description: Count of TransactionMonitoringAlert rows for this Partner with alert_type == SANCTIONS_HIT and disposition IN {OPEN, PARTNER_RESPONSE_PENDING}.
        default: 0
      - name: unreconciled_variance_cents
        type: integer
        source: computed
        description: Sum of absolute variance_cents over SettlementBatch rows for this Partner with reconciliation_status == VARIANCE_OPEN.
        default: 0
      - name: required_reserve_cents
        type: integer
        source: computed
        description: Reserve floor produced by calculation required_reserve_cents.
        default: 0
      - name: reserve_shortfall_cents
        type: integer
        source: computed
        description: "max(0, required_reserve_cents - RESERVE CustodyAccount.balance_cents) for this Partner."
        default: 0
      - name: consecutive_shortfall_cycles
        type: integer
        source: computed
        description: Number of consecutively CLOSED OversightCycles at whose close reserve_shortfall_cents was greater than 0; reset to 0 at a close where it is 0.
        default: 0
      - name: growth_breach_count
        type: integer
        source: computed
        description: Cumulative count of OversightCycle closes at which calculation monthly_growth_pct reported a breach for this Partner.
        default: 0
      - name: concentration_ratio_pct
        type: number
        source: computed
        description: Share of the bank's total end-user custody balance held by this Partner's group; see calculation concentration_ratio_pct (2 decimals).
        default: 0.00
      - name: cumulative_paid_out_cents
        type: integer
        source: computed
        description: Cumulative net settlement cents paid out of custody to this Partner (increased on fund, decreased on clawback).
        default: 0
      - name: cumulative_bank_fee_cents
        type: integer
        source: computed
        description: Cumulative sponsor-bank fee cents retained from this Partner's settlements (increased on fund, decreased on clawback).
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramOfficer who created this Partner record.

  - name: DiligenceReview
    parent: Partner
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the fintech under diligence."
      - name: review_type
        type: enum
        source: input
        description: Selects the composite-score variant (INITIAL uses partner-disclosed complaint history, RENEWAL derives it from Complaint records).
        constraints: "one of INITIAL, RENEWAL"
      - name: business_model_score
        type: integer
        source: input
        description: Analyst score for business-model durability.
        constraints: "0..100"
      - name: funding_score
        type: integer
        source: input
        description: Analyst score for funding adequacy.
        constraints: "0..100"
      - name: compliance_capability_score
        type: integer
        source: input
        description: Analyst score for the partner's compliance management capability.
        constraints: "0..100"
      - name: complaint_history_score
        type: integer
        source: input
        description: Analyst score for consumer complaint history as submitted; ignored and replaced when review_type == RENEWAL.
        constraints: "0..100"
      - name: effective_complaint_history_score
        type: integer
        source: computed
        description: The complaint-history score actually used by the composite formula after variant selection.
        default: 0
      - name: composite_score
        type: number
        source: computed
        description: Weighted composite produced by calculation diligence_composite_score (1 decimal).
        default: 0.0
      - name: tier
        type: enum
        source: computed
        description: Tier band derived from composite_score.
        default: UNRATED
        constraints: "one of UNRATED, TIER_1, TIER_2, TIER_3"
      - name: status
        type: enum
        source: system
        description: Diligence workflow state (see §1.2 DiligenceReview).
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, INFO_REQUESTED, PASSED, FAILED"
      - name: revision_round
        type: integer
        source: computed
        description: Number of times this review has entered SUBMITTED; 1 on first submit, incremented on each resubmission after INFO_REQUESTED.
        default: 0
      - name: requested_info_items
        type: array
        source: input
        description: Outstanding information requests recorded by the last INFO_REQUESTED decision; array of strings.
        default: []
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramOfficer who last submitted this review.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who recorded the last decision.
        default: null

  - name: ProgramAgreement
    parent: Partner
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the fintech the agreement governs."
      - name: kyc_owner
        type: enum
        source: input
        description: Party owning customer identification obligations.
        constraints: "one of BANK, PARTNER, SHARED"
      - name: dispute_owner
        type: enum
        source: input
        description: Party owning end-user dispute handling; copied onto each Complaint at creation as handling_owner.
        constraints: "one of BANK, PARTNER, SHARED"
      - name: marketing_owner
        type: enum
        source: input
        description: Party owning marketing production; the bank always retains approval regardless of this value.
        constraints: "one of BANK, PARTNER, SHARED"
      - name: oversight_rights_level
        type: enum
        source: input
        description: Depth of the bank's contractual oversight rights.
        constraints: "one of STANDARD, ENHANCED, FULL_ACCESS"
      - name: audit_access_notice_days
        type: integer
        source: input
        description: Advance notice in days the bank owes the partner before onsite audit access.
        constraints: "1..30"
      - name: termination_triggers
        type: array
        source: input
        description: "Contractual termination triggers; array of enum strings from {COMPLAINT_RATE, RESERVE_SHORTFALL, SANCTIONS_EVENT, CONCENTRATION_CAP, GROWTH_BREACH, VOLUNTARY}."
        constraints: "non-empty; VOLUNTARY may appear alone"
      - name: monthly_growth_cap_pct
        type: number
        source: input
        description: Maximum permitted cycle-over-cycle growth in new end-user credits, percent, 2 decimals.
        constraints: "> 0, <= 500.00"
      - name: concentration_cap_pct
        type: number
        source: input
        description: Maximum share of the bank's total end-user custody balance this partner group may hold, percent, 2 decimals.
        constraints: "> 0, <= 100.00"
      - name: max_end_user_balance_cents
        type: integer
        source: input
        description: Program cap on the FBO_END_USER custody balance and hard ceiling on required_reserve_cents.
        constraints: "> 0"
      - name: reserve_requirement_bps
        type: integer
        source: input
        description: Contractual reserve requirement in basis points applied to the end-user balance and to settlement volume.
        constraints: "1..10000"
      - name: effective_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant from which the agreement governs; must not precede the logical clock at creation.
      - name: status
        type: enum
        source: system
        description: Agreement workflow state (see §1.2 ProgramAgreement).
        default: DRAFT
        constraints: "one of DRAFT, PENDING_RISK_APPROVAL, EXECUTED, TERMINATED"
      - name: revision_round
        type: integer
        source: computed
        description: Number of times this agreement has been returned to DRAFT by a REJECT risk-decision, plus 1.
        default: 1
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the agreement reached EXECUTED; null before that.
        default: null
      - name: termination_trigger_fired
        type: enum
        source: system
        description: The termination trigger cited when the agreement moved to TERMINATED.
        default: null
        constraints: "null or one of COMPLAINT_RATE, RESERVE_SHORTFALL, SANCTIONS_EVENT, CONCENTRATION_CAP, GROWTH_BREACH, VOLUNTARY"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramOfficer who drafted the agreement; the RiskCommittee decider must differ from this value.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the RiskCommittee member who recorded the last risk decision.
        default: null

  - name: MarketingReview
    parent: Partner
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the fintech whose material is under review."
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ProgramAgreement.id; the governing agreement; its partner_id must equal this row's partner_id."
      - name: material_type
        type: enum
        source: input
        description: Kind of consumer-facing material submitted for review.
        constraints: "one of AD, DISCLOSURE, APP_SCREEN, EMAIL"
      - name: placement_channel
        type: enum
        source: input
        description: Where the material runs; part of the approved-window uniqueness key.
        constraints: "one of PAID_SOCIAL, SEARCH, IN_APP, DIRECT_MAIL, PARTNER_SITE"
      - name: disclosure_elements
        type: array
        source: input
        description: "Disclosure elements present in the material; array of enum strings from {APR, FEE_SCHEDULE, FDIC_SIGNAGE, BANK_NAME, PASS_THROUGH_INSURANCE, DISPUTE_RIGHTS}."
        default: []
      - name: apr_disclosed
        type: boolean
        source: input
        description: Whether an APR is stated on the material.
        default: false
      - name: fdic_signage_correct
        type: boolean
        source: input
        description: Whether FDIC/pass-through insurance signage is present and accurate.
        default: false
      - name: effective_from
        type: datetime
        source: input
        description: First instant the approved material may run; closed lower bound of the approved window.
      - name: effective_until
        type: datetime
        source: input
        description: Last instant the approved material may run; closed upper bound of the approved window.
      - name: status
        type: enum
        source: system
        description: Marketing review state (see §1.2 MarketingReview).
        default: SUBMITTED
        constraints: "one of SUBMITTED, CHANGES_REQUESTED, APPROVED, REJECTED, EXPIRED"
      - name: review_round
        type: integer
        source: computed
        description: Number of times this material has entered SUBMITTED; 1 at creation, incremented on each resubmit.
        default: 1
      - name: change_requests
        type: array
        source: input
        description: Change requests recorded by the last CHANGES_REQUESTED decision; array of strings.
        default: []
      - name: risk_flags
        type: array
        source: computed
        description: "Deterministic flags computed at each decision attempt; subset of {MISSING_APR, MISSING_FDIC_SIGNAGE, MISSING_DISPUTE_RIGHTS} per calculation marketing_risk_flags."
        default: []
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who filed or last resubmitted the material; the deciding ComplianceOfficer must differ from this value.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who recorded the last decision.
        default: null

  - name: CustodyAccount
    parent: Partner
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the fintech whose funds this account holds."
      - name: account_type
        type: enum
        source: system
        description: Account role; exactly one of each type is created per Partner when its ProgramAgreement reaches EXECUTED.
        constraints: "one of FBO_END_USER, RESERVE"
      - name: balance_cents
        type: integer
        source: computed
        description: Sum of LedgerEntry.amount_cents over entries whose custody_account_id equals this row's id.
        default: 0
      - name: status
        type: enum
        source: system
        description: Custody account state (see §1.2 CustodyAccount).
        default: ACTIVE
        constraints: "one of ACTIVE, FROZEN, CLOSED"
      - name: frozen_at
        type: datetime
        source: system
        description: Logical-clock instant at which the account last entered FROZEN; null when never frozen or after unfreeze.
        default: null

  - name: LedgerEntry
    parent: CustodyAccount
    common_fields: false
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; denormalised owner of the custody account, must equal CustodyAccount.partner_id."
      - name: custody_account_id
        type: string
        source: input
        description: "FK -> CustodyAccount.id; the account this entry moves."
      - name: settlement_batch_id
        type: string
        source: system
        description: "FK -> SettlementBatch.id; set only on entries synthesised by settlement funding, clawback or variance clearing; null for manual entries."
        default: null
      - name: entry_type
        type: enum
        source: input
        description: Movement classification; determines the required sign of amount_cents.
        constraints: "one of END_USER_CREDIT, END_USER_DEBIT, RESERVE_FUND, RESERVE_RELEASE, FEE, VARIANCE_ADJUSTMENT, CLAWBACK"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed movement in cents; positive for END_USER_CREDIT, RESERVE_FUND and CLAWBACK, negative for END_USER_DEBIT, RESERVE_RELEASE and FEE, any non-zero sign for VARIANCE_ADJUSTMENT."
        constraints: "non-zero"
      - name: effective_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the movement is booked at; must fall inside an OPEN OversightCycle period.
      - name: sequence_no
        type: integer
        source: system
        description: Monotonic per-custody-account insertion index starting at 1; fixes replay order for balance reconstruction.
      - name: memo
        type: string
        source: input
        description: Free-text annotation.
        default: ""
      - name: reversal_of_entry_id
        type: string
        source: system
        description: "FK -> LedgerEntry.id; set on CLAWBACK entries to the funding entry they reverse; null otherwise."
        default: null

  - name: SettlementBatch
    parent: Partner
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the fintech being settled."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the settlement window; windows for one Partner are half-open [window_start, window_end).
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the settlement window; a new batch may start exactly at a prior batch's window_end.
      - name: gross_settlement_cents
        type: integer
        source: input
        description: Gross transaction volume settled in the window.
        constraints: ">= 0"
      - name: interchange_cents
        type: integer
        source: input
        description: Interchange earned in the window.
        constraints: ">= 0"
      - name: returns_cents
        type: integer
        source: input
        description: ACH returns and chargebacks charged back in the window.
        constraints: ">= 0"
      - name: partner_reported_net_cents
        type: integer
        source: input
        description: Net proceeds the partner's own ledger claims for this window.
      - name: bank_reported_net_cents
        type: integer
        source: input
        description: Net proceeds the bank's ledger computes for this window; supplied at reconcile.
        default: null
      - name: variance_cents
        type: integer
        source: computed
        description: "bank_reported_net_cents - partner_reported_net_cents, computed at reconcile; 0 before reconcile."
        default: 0
      - name: variance_adjustment_cents
        type: integer
        source: input
        description: Signed correction booked by clear-variance; 0 until a variance is cleared.
        default: 0
      - name: settlement_base_cents
        type: integer
        source: computed
        description: "gross_settlement_cents + interchange_cents - returns_cents + variance_adjustment_cents; see calculation settlement_net_to_partner_cents."
        default: 0
      - name: bank_fee_bps_applied
        type: integer
        source: computed
        description: Tier rate in basis points selected on gross_settlement_cents at funding time.
        default: 0
      - name: bank_fee_cents
        type: integer
        source: computed
        description: Sponsor-bank fee retained at funding time.
        default: 0
      - name: reserve_funding_cents
        type: integer
        source: computed
        description: Cents routed into the RESERVE custody account at funding time; basis depends on the reconciliation dimension (see variants).
        default: 0
      - name: net_to_partner_cents
        type: integer
        source: computed
        description: Cents paid out of custody to the partner at funding time; floored at 0.
        default: 0
      - name: shortfall_carry_cents
        type: integer
        source: computed
        description: Positive magnitude by which fees plus reserve funding exceeded settlement_base_cents at funding time; absorbed by the RESERVE account.
        default: 0
      - name: reconciliation_status
        type: enum
        source: system
        description: First independent state dimension (see §1.2 SettlementBatch).
        default: UNRECONCILED
        constraints: "one of UNRECONCILED, MATCHED, VARIANCE_OPEN, VARIANCE_CLEARED"
      - name: funding_status
        type: enum
        source: system
        description: Second independent state dimension (see §1.2 SettlementBatch).
        default: UNFUNDED
        constraints: "one of UNFUNDED, FUNDED, CLAWED_BACK"
      - name: funded_at
        type: datetime
        source: system
        description: Logical-clock instant of funding; null before funding and unchanged by clawback.
        default: null
      - name: funding_reference
        type: string
        source: input
        description: Wire/ACH reference recorded at funding.
        default: null
      - name: clawback_reason
        type: enum
        source: input
        description: Reason cited when funding is reversed.
        default: null
        constraints: "null or one of RECONCILIATION_ERROR, PARTNER_FRAUD, RESERVE_BREACH, DUPLICATE_FUNDING"

  - name: Complaint
    parent: Partner
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the fintech the complaint concerns."
      - name: channel
        type: enum
        source: input
        description: Intake channel; selects the response SLA arithmetic.
        constraints: "one of CFPB_PORTAL, STATE_AG, SOCIAL, BANK_CALL_CENTER, PARTNER_APP, EMAIL"
      - name: category
        type: enum
        source: input
        description: Complaint subject taxonomy.
        constraints: "one of FEES, DISCLOSURE, ACCOUNT_ACCESS, UNAUTHORIZED_TRANSACTION, CREDIT_REPORTING, SERVICING"
      - name: severity
        type: enum
        source: input
        description: Triage severity.
        constraints: "one of LOW, MEDIUM, HIGH, CRITICAL"
      - name: received_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the complaint was received; must not exceed the logical clock.
      - name: narrative
        type: string
        source: input
        description: Consumer narrative text.
        constraints: "1..2000 chars"
      - name: is_reg_e_dispute
        type: boolean
        source: input
        description: Whether the complaint is also an electronic-funds-transfer dispute requiring provisional credit.
        default: false
      - name: handling_owner
        type: enum
        source: computed
        description: Copied from the Partner's EXECUTED ProgramAgreement.dispute_owner at complaint creation; BANK when no EXECUTED agreement exists.
        default: BANK
        constraints: "one of BANK, PARTNER, SHARED"
      - name: response_due_at
        type: datetime
        source: computed
        description: Deadline produced by calculation complaint_response_due_at.
      - name: status
        type: enum
        source: system
        description: Complaint workflow state (see §1.2 Complaint).
        default: RECEIVED
        constraints: "one of RECEIVED, ROOT_CAUSE_ASSIGNED, ESCALATED, RESOLVED, WITHDRAWN"
      - name: root_cause_code
        type: enum
        source: input
        description: Root cause assigned by analysis; null until assigned.
        default: null
        constraints: "null or one of DISCLOSURE_DEFECT, SYSTEM_OUTAGE, FEE_CONFIG_ERROR, KYC_FRICTION, VENDOR_ERROR, PARTNER_TRAINING_GAP"
      - name: escalation_count
        type: integer
        source: computed
        description: Number of times this complaint has entered ESCALATED, whether by disposition or by ops-run checkpoint.
        default: 0
      - name: redress_cents
        type: integer
        source: input
        description: Consumer redress paid at resolution; 0 when none.
        default: 0
        constraints: ">= 0"
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant the complaint reached RESOLVED or WITHDRAWN; null otherwise.
        default: null

  - name: TransactionMonitoringAlert
    parent: Partner
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the fintech whose flow triggered the alert."
      - name: alert_type
        type: enum
        source: input
        description: Monitoring rule that fired; SANCTIONS_HIT drives the FROZEN posture predicate.
        constraints: "one of STRUCTURING, VELOCITY, SANCTIONS_HIT, ACH_RETURN_RATE"
      - name: triggered_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the monitoring rule fired; must not exceed the logical clock.
      - name: transaction_volume_cents
        type: integer
        source: input
        description: Cents of flow implicated by the alert.
        constraints: "> 0"
      - name: detection_note
        type: string
        source: input
        description: Analyst detection narrative.
        constraints: "1..1000 chars"
      - name: sla_due_at
        type: datetime
        source: computed
        description: "triggered_at + ALERT_SLA_HOURS[alert_type] (see calculation alert_sla_due_at); the ops-run checkpoint returns breached PARTNER_RESPONSE_PENDING alerts to OPEN."
      - name: disposition
        type: enum
        source: system
        description: Alert disposition state (see §1.2 TransactionMonitoringAlert).
        default: OPEN
        constraints: "one of OPEN, PARTNER_RESPONSE_PENDING, CLEARED, SAR_FILED"
      - name: sla_breach_count
        type: integer
        source: computed
        description: Number of ops-run checkpoints at which this alert was returned from PARTNER_RESPONSE_PENDING to OPEN for breaching sla_due_at.
        default: 0
      - name: disposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who recorded the last disposition.
        default: null

  - name: OversightCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_index
        type: integer
        source: system
        description: Monotonic epoch index starting at 1, assigned in creation order; the prior cycle for growth comparison is cycle_index - 1.
      - name: cycle_label
        type: string
        source: input
        description: Human label such as "2026-08".
        constraints: "1..40 chars"
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the cycle period; cycle periods are half-open [period_start, period_end) and must not overlap.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the cycle period.
      - name: status
        type: enum
        source: system
        description: Cycle state (see §1.2 OversightCycle).
        default: OPEN
        constraints: "one of OPEN, CLOSING, CLOSED"
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant the cycle reached CLOSED; null before that.
        default: null
      - name: partners_frozen_count
        type: integer
        source: computed
        description: Number of Partners whose oversight_posture became FROZEN during this close.
        default: 0
      - name: marketing_approvals_expired_count
        type: integer
        source: computed
        description: Number of MarketingReview rows moved APPROVED -> EXPIRED during this close.
        default: 0
      - name: complaints_escalated_count
        type: integer
        source: computed
        description: Number of Complaint rows moved to ESCALATED by this close for breaching response_due_at.
        default: 0
      - name: alerts_reopened_count
        type: integer
        source: computed
        description: Number of TransactionMonitoringAlert rows moved PARTNER_RESPONSE_PENDING -> OPEN by this close for breaching sla_due_at.
        default: 0
      - name: growth_breach_partner_count
        type: integer
        source: computed
        description: Number of Partners for which calculation monthly_growth_pct reported a breach at this close.
        default: 0
      - name: plans_completed_count
        type: integer
        source: computed
        description: Number of WindDownPlan rows moved IN_EXECUTION -> COMPLETED by this close.
        default: 0

  - name: WindDownPlan
    parent: Partner
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the fintech being wound down."
      - name: trigger_reason
        type: enum
        source: input
        description: Termination trigger that motivated the plan; must appear in the Partner's agreement termination_triggers.
        constraints: "one of COMPLAINT_RATE, RESERVE_SHORTFALL, SANCTIONS_EVENT, CONCENTRATION_CAP, GROWTH_BREACH, VOLUNTARY"
      - name: end_user_funds_disposition
        type: enum
        source: input
        description: How end-user balances are to be discharged.
        constraints: "one of RETURN_TO_END_USERS, TRANSFER_TO_SUCCESSOR_BANK, ESCHEAT"
      - name: notice_days
        type: integer
        source: input
        description: Days of notice given to end users; must be at least MIN_WIND_DOWN_NOTICE_DAYS.
        constraints: ">= 1, <= 180"
      - name: target_completion_date
        type: datetime
        source: input
        description: Planned completion instant; must be at least notice_days after the logical clock at creation.
      - name: milestones
        type: array
        source: input
        description: "Ordered milestone labels; array of enum strings from {STOP_NEW_ACCOUNTS, NOTIFY_END_USERS, FINAL_SETTLEMENT, RETURN_FUNDS, CLOSE_CUSTODY}."
        constraints: "non-empty; must contain RETURN_FUNDS and CLOSE_CUSTODY"
      - name: status
        type: enum
        source: system
        description: Wind-down workflow state (see §1.2 WindDownPlan).
        default: DRAFT
        constraints: "one of DRAFT, PENDING_APPROVAL, APPROVED, IN_EXECUTION, COMPLETED"
      - name: revision_round
        type: integer
        source: computed
        description: Number of times this plan has been returned to DRAFT by a REVISE decision, plus 1.
        default: 1
      - name: residual_balance_cents
        type: integer
        source: computed
        description: "Sum of balance_cents over this Partner's CustodyAccount rows with status IN {ACTIVE, FROZEN}; see calculation wind_down_residual_balance_cents."
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the RiskCommittee member who approved the plan; must differ from created_by_user_id.
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramOfficer who drafted the plan.
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the plan reached COMPLETED; null before that.
        default: null

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: Partner
    initial_state: PROSPECT
    terminal_states: [DILIGENCE_FAILED, TERMINATED]
    transitions:
      - from: PROSPECT
        to: IN_DILIGENCE
        trigger: "POST /oversight/diligence-reviews/{id}/submit (side effect of DiligenceReview DRAFT -> SUBMITTED)"
        actor: system
        preconditions:
          - "partner.status == PROSPECT"
        side_effects:
          - "increments Partner.version by 1"
          - "refreshes Partner.updated_at"
        note: "Submitting the first DiligenceReview is what opens diligence; there is no direct partner-status endpoint."
      - from: IN_DILIGENCE
        to: DILIGENCE_PASSED
        trigger: "POST /oversight/diligence-reviews/{id}/decide with outcome=PASSED"
        actor: system
        preconditions:
          - "the deciding DiligenceReview.status == SUBMITTED"
          - "DiligenceReview.compliance_capability_score >= COMPLIANCE_CAPABILITY_FLOOR (60)"
          - "DiligenceReview.composite_score >= DILIGENCE_PASS_FLOOR (55.0)"
        side_effects:
          - "sets Partner.capability_tier = DiligenceReview.tier"
          - "sets Partner.latest_composite_score = DiligenceReview.composite_score"
          - "increments Partner.version by 1"
      - from: IN_DILIGENCE
        to: DILIGENCE_FAILED
        trigger: "POST /oversight/diligence-reviews/{id}/decide with outcome=FAILED"
        actor: system
        preconditions:
          - "the deciding DiligenceReview.status == SUBMITTED"
        side_effects:
          - "sets Partner.capability_tier = UNRATED"
          - "sets Partner.latest_composite_score = DiligenceReview.composite_score"
          - "increments Partner.version by 1"
        note: "Terminal for the Partner: no further DiligenceReview, ProgramAgreement, Complaint or LedgerEntry may be created for it."
      - from: DILIGENCE_PASSED
        to: IN_DILIGENCE
        trigger: "POST /oversight/diligence-reviews/{id}/submit for a later review with review_type=RENEWAL"
        actor: system
        preconditions:
          - "partner.status == DILIGENCE_PASSED"
          - "no other DiligenceReview for this Partner has status IN {DRAFT, SUBMITTED, INFO_REQUESTED} apart from the one being submitted"
        side_effects:
          - "increments Partner.version by 1"
        note: "Cycle edge: diligence re-opens for renewal underwriting before contracting."
      - from: DILIGENCE_PASSED
        to: CONTRACTED
        trigger: "POST /oversight/agreements/{id}/risk-decision with decision=EXECUTE"
        actor: system
        preconditions:
          - "partner.status == DILIGENCE_PASSED"
          - "the deciding ProgramAgreement.status == PENDING_RISK_APPROVAL"
        side_effects:
          - "creates CustodyAccount(account_type=FBO_END_USER, status=ACTIVE, balance_cents=0) for this Partner"
          - "creates CustodyAccount(account_type=RESERVE, status=ACTIVE, balance_cents=0) for this Partner"
          - "recomputes Partner.required_reserve_cents and Partner.reserve_shortfall_cents (calculation required_reserve_cents)"
          - "recomputes Partner.oversight_posture (calculation partner_oversight_posture)"
          - "increments Partner.version by 1"
        note: "Cascade C link 1->2->3: agreement execution creates custody accounts, custody creation makes the reserve computable, and the computed shortfall re-derives posture."
      - from: CONTRACTED
        to: LIVE
        trigger: "POST /oversight/partners/{id}/go-live"
        actor: ProgramOfficer
        preconditions:
          - "partner.status == CONTRACTED"
          - "exactly one ProgramAgreement for this Partner has status == EXECUTED"
          - "both CustodyAccount rows for this Partner have status == ACTIVE"
          - "Partner.reserve_shortfall_cents == 0"
          - "Partner.oversight_posture IN {OPEN, HEIGHTENED}"
        side_effects:
          - "increments Partner.version by 1"
        note: "Cross-entity gate (Rule 7): the Partner transition is decided by ProgramAgreement and CustodyAccount state, not by any Partner field."
      - from: CONTRACTED
        to: WIND_DOWN
        trigger: "POST /oversight/agreements/{id}/terminate"
        actor: system
        preconditions:
          - "the terminating ProgramAgreement.status == EXECUTED"
        side_effects:
          - "increments Partner.version by 1"
      - from: LIVE
        to: WIND_DOWN
        trigger: "POST /oversight/agreements/{id}/terminate"
        actor: system
        preconditions:
          - "the terminating ProgramAgreement.status == EXECUTED"
        side_effects:
          - "moves every MarketingReview for this Partner with status IN {SUBMITTED, CHANGES_REQUESTED, APPROVED} to EXPIRED"
          - "increments Partner.version by 1"
      - from: WIND_DOWN
        to: TERMINATED
        trigger: "POST /oversight/cycles/{id}/close (system, when the Partner's WindDownPlan reaches COMPLETED)"
        actor: system
        preconditions:
          - "a WindDownPlan for this Partner has status == IN_EXECUTION"
          - "WindDownPlan.residual_balance_cents == 0"
        side_effects:
          - "sets every CustodyAccount for this Partner to status = CLOSED"
          - "increments Partner.version by 1"

  - entity: DiligenceReview
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /oversight/diligence-reviews/{id}/submit"
        actor: ProgramOfficer
        preconditions:
          - "review.status == DRAFT"
          - "partner.status IN {PROSPECT, DILIGENCE_PASSED}"
        side_effects:
          - "sets revision_round = 1"
          - "sets submitted_by_user_id = X-User-ID"
          - "recomputes effective_complaint_history_score, composite_score and tier (calculation diligence_composite_score)"
          - "advances Partner.status PROSPECT -> IN_DILIGENCE or DILIGENCE_PASSED -> IN_DILIGENCE"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /oversight/diligence-reviews/{id}/decide with outcome=INFO_REQUESTED"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == SUBMITTED"
          - "requested_info_items is a non-empty array"
          - "X-User-ID != review.submitted_by_user_id"
        side_effects:
          - "stores requested_info_items"
          - "sets decided_by_user_id = X-User-ID"
        note: "Partner.status stays IN_DILIGENCE across the whole INFO_REQUESTED loop."
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /oversight/diligence-reviews/{id}/submit"
        actor: ProgramOfficer
        preconditions:
          - "review.status == INFO_REQUESTED"
          - "partner.status == IN_DILIGENCE"
        side_effects:
          - "increments revision_round by 1"
          - "clears requested_info_items to []"
          - "sets submitted_by_user_id = X-User-ID"
          - "recomputes effective_complaint_history_score, composite_score and tier (calculation diligence_composite_score)"
        note: "Cycle edge SUBMITTED -> INFO_REQUESTED -> SUBMITTED; unbounded rounds."
      - from: SUBMITTED
        to: PASSED
        trigger: "POST /oversight/diligence-reviews/{id}/decide with outcome=PASSED"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == SUBMITTED"
          - "compliance_capability_score >= 60"
          - "composite_score >= 55.0"
          - "X-User-ID != review.submitted_by_user_id"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
          - "advances Partner.status IN_DILIGENCE -> DILIGENCE_PASSED and writes Partner.capability_tier / latest_composite_score"
      - from: SUBMITTED
        to: FAILED
        trigger: "POST /oversight/diligence-reviews/{id}/decide with outcome=FAILED"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == SUBMITTED"
          - "X-User-ID != review.submitted_by_user_id"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
          - "advances Partner.status IN_DILIGENCE -> DILIGENCE_FAILED"
        note: "Branching fork from SUBMITTED into three outcomes with disjoint side-effect sets."

  - entity: ProgramAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_RISK_APPROVAL
        trigger: "POST /oversight/agreements/{id}/submit-for-approval"
        actor: ProgramOfficer
        preconditions:
          - "agreement.status == DRAFT"
          - "partner.status == DILIGENCE_PASSED"
          - "Partner.capability_tier IN {TIER_1, TIER_2, TIER_3}"
        side_effects:
          - "refreshes updated_at and increments version by 1"
      - from: PENDING_RISK_APPROVAL
        to: EXECUTED
        trigger: "POST /oversight/agreements/{id}/risk-decision with decision=EXECUTE"
        actor: RiskCommittee
        preconditions:
          - "agreement.status == PENDING_RISK_APPROVAL"
          - "partner.status == DILIGENCE_PASSED"
          - "X-User-ID != agreement.created_by_user_id"
          - "agreement.effective_date >= the logical clock"
        side_effects:
          - "sets executed_at = logical clock, decided_by_user_id = X-User-ID"
          - "creates the FBO_END_USER and RESERVE CustodyAccount rows for the Partner (see Partner DILIGENCE_PASSED -> CONTRACTED)"
          - "advances Partner.status DILIGENCE_PASSED -> CONTRACTED"
          - "recomputes Partner.required_reserve_cents, Partner.reserve_shortfall_cents and Partner.oversight_posture"
      - from: PENDING_RISK_APPROVAL
        to: DRAFT
        trigger: "POST /oversight/agreements/{id}/risk-decision with decision=REJECT"
        actor: RiskCommittee
        preconditions:
          - "agreement.status == PENDING_RISK_APPROVAL"
          - "X-User-ID != agreement.created_by_user_id"
        side_effects:
          - "increments revision_round by 1"
          - "sets decided_by_user_id = X-User-ID"
          - "does NOT create custody accounts and does NOT touch Partner.status"
        note: "Cycle edge: rejected agreements return to DRAFT and may be resubmitted; the branch side-effect set is disjoint from EXECUTE."
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /oversight/agreements/{id}/terminate"
        actor: RiskCommittee
        preconditions:
          - "agreement.status == EXECUTED"
          - "the supplied termination_trigger appears in agreement.termination_triggers"
          - "partner.status IN {CONTRACTED, LIVE}"
        side_effects:
          - "sets termination_trigger_fired = the supplied trigger"
          - "advances Partner.status CONTRACTED|LIVE -> WIND_DOWN"
          - "moves every MarketingReview for this Partner with status IN {SUBMITTED, CHANGES_REQUESTED, APPROVED} to EXPIRED"
          - "increments Partner.version by 1"

  - entity: MarketingReview
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /oversight/marketing-reviews/{id}/decide with decision=CHANGES_REQUESTED"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == SUBMITTED"
          - "change_requests is a non-empty array"
          - "X-User-ID != review.created_by_user_id"
        side_effects:
          - "stores change_requests and recomputes risk_flags"
          - "sets decided_by_user_id = X-User-ID"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /oversight/marketing-reviews/{id}/resubmit"
        actor: FintechPartner
        preconditions:
          - "review.status == CHANGES_REQUESTED"
          - "X-User-ID == review.partner_id"
          - "partner.oversight_posture IN {OPEN, HEIGHTENED}"
        side_effects:
          - "overwrites disclosure_elements, apr_disclosed, fdic_signage_correct, effective_from, effective_until"
          - "increments review_round by 1, clears change_requests to []"
          - "sets created_by_user_id = X-User-ID"
          - "recomputes risk_flags"
        note: "Cycle edge SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED; the approved-window overlap check re-runs on the new window at APPROVE time, not at resubmit time."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /oversight/marketing-reviews/{id}/decide with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == SUBMITTED"
          - "partner.oversight_posture IN {OPEN, HEIGHTENED}"
          - "risk_flags == [] after recomputation"
          - "no other MarketingReview for the same partner_id, material_type and placement_channel with status == APPROVED conflicts with [effective_from, effective_until] under the 3-day cooling buffer"
          - "X-User-ID != review.created_by_user_id"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
        note: "Cross-entity gate (Rule 7, MarketingReview -> Partner): approval is decided by the Partner's derived posture."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /oversight/marketing-reviews/{id}/decide with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == SUBMITTED"
          - "X-User-ID != review.created_by_user_id"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /oversight/cycles/{id}/close (system) or POST /oversight/agreements/{id}/terminate (system)"
        actor: system
        preconditions:
          - "review.status == APPROVED"
          - "at cycle close: effective_until < the logical clock, OR the Partner's recomputed oversight_posture IN {RESTRICTED, FROZEN}"
        side_effects:
          - "increments OversightCycle.marketing_approvals_expired_count by 1 when driven by a cycle close"
        note: "Cascade B link 4: the posture recomputed earlier in the same close is what expires still-valid approvals."

  - entity: CustodyAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "system, whenever a recompute pass sets Partner.oversight_posture = FROZEN"
        actor: system
        preconditions:
          - "account.status == ACTIVE"
          - "Partner.oversight_posture == FROZEN after the recompute pass"
        side_effects:
          - "sets frozen_at = the logical clock"
          - "increments version by 1"
        note: "Cascade A final link: ledger insert -> custody balance -> reserve shortfall -> posture FROZEN -> custody freeze."
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /oversight/cycles/{id}/close (system, when the recomputed posture is no longer FROZEN)"
        actor: system
        preconditions:
          - "account.status == FROZEN"
          - "Partner.oversight_posture != FROZEN after this close's recompute pass"
        side_effects:
          - "sets frozen_at = null"
          - "increments version by 1"
        note: "Cycle edge ACTIVE -> FROZEN -> ACTIVE; unfreezing only ever happens at an ops-run checkpoint, never inside a business write."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /oversight/cycles/{id}/close (system, when the Partner's WindDownPlan reaches COMPLETED)"
        actor: system
        preconditions:
          - "account.status == ACTIVE"
          - "account.balance_cents == 0"
        side_effects:
          - "increments version by 1"
      - from: FROZEN
        to: CLOSED
        trigger: "POST /oversight/cycles/{id}/close (system, when the Partner's WindDownPlan reaches COMPLETED)"
        actor: system
        preconditions:
          - "account.status == FROZEN"
          - "account.balance_cents == 0"
        side_effects:
          - "sets frozen_at = null"
          - "increments version by 1"

  - entity: SettlementBatch
    initial_state: "UNRECONCILED + UNFUNDED"
    terminal_states: ["VARIANCE_CLEARED + CLAWED_BACK", "MATCHED + CLAWED_BACK"]
    note: |
      Two independent state dimensions live on one row. `reconciliation_status`
      advances UNRECONCILED -> MATCHED | VARIANCE_OPEN -> VARIANCE_CLEARED and is
      driven by reconcile / clear-variance. `funding_status` advances UNFUNDED ->
      FUNDED -> CLAWED_BACK and is driven by fund / clawback. Neither dimension
      constrains the other except for one gate: fund requires
      reconciliation_status != UNRECONCILED. clear-variance is permitted while
      funding_status == FUNDED and then books a compensating VARIANCE_ADJUSTMENT
      ledger entry instead of restating bank_fee_cents.
    transitions:
      - from: "reconciliation_status=UNRECONCILED"
        to: "reconciliation_status=MATCHED"
        trigger: "POST /oversight/settlement-batches/{id}/reconcile with bank_reported_net_cents equal to partner_reported_net_cents"
        actor: InternalAudit
        preconditions:
          - "batch.reconciliation_status == UNRECONCILED"
          - "bank_reported_net_cents - partner_reported_net_cents == 0"
        side_effects:
          - "sets variance_cents = 0"
          - "recomputes Partner.unreconciled_variance_cents"
          - "increments version by 1"
      - from: "reconciliation_status=UNRECONCILED"
        to: "reconciliation_status=VARIANCE_OPEN"
        trigger: "POST /oversight/settlement-batches/{id}/reconcile with bank_reported_net_cents differing from partner_reported_net_cents"
        actor: InternalAudit
        preconditions:
          - "batch.reconciliation_status == UNRECONCILED"
          - "bank_reported_net_cents - partner_reported_net_cents != 0"
        side_effects:
          - "sets variance_cents = bank_reported_net_cents - partner_reported_net_cents"
          - "adds abs(variance_cents) to Partner.unreconciled_variance_cents"
          - "recomputes Partner.oversight_posture (variance >= VARIANCE_RESTRICT_CENTS drives RESTRICTED)"
          - "increments version by 1"
      - from: "reconciliation_status=VARIANCE_OPEN"
        to: "reconciliation_status=VARIANCE_CLEARED"
        trigger: "POST /oversight/settlement-batches/{id}/clear-variance"
        actor: InternalAudit
        preconditions:
          - "batch.reconciliation_status == VARIANCE_OPEN"
          - "variance_adjustment_cents + partner_reported_net_cents == bank_reported_net_cents"
        side_effects:
          - "stores variance_adjustment_cents and recomputes settlement_base_cents"
          - "removes abs(variance_cents) from Partner.unreconciled_variance_cents"
          - "when funding_status == FUNDED: creates a VARIANCE_ADJUSTMENT LedgerEntry on the RESERVE CustodyAccount for variance_adjustment_cents"
          - "recomputes the affected CustodyAccount.balance_cents, then Partner.required_reserve_cents / reserve_shortfall_cents, then Partner.oversight_posture"
          - "increments version by 1"
        note: "Independent-dimension proof: this edge is legal at funding_status == UNFUNDED and at funding_status == FUNDED, with different side-effect sets."
      - from: "funding_status=UNFUNDED"
        to: "funding_status=FUNDED"
        trigger: "POST /oversight/settlement-batches/{id}/fund"
        actor: ProgramOfficer
        preconditions:
          - "batch.funding_status == UNFUNDED"
          - "batch.reconciliation_status IN {MATCHED, VARIANCE_CLEARED}"
          - "partner.status == LIVE"
          - "the Partner's RESERVE CustodyAccount.status == ACTIVE"
          - "Partner.reserve_shortfall_cents == 0"
        side_effects:
          - "computes bank_fee_bps_applied, bank_fee_cents, reserve_funding_cents, net_to_partner_cents, shortfall_carry_cents (calculation settlement_net_to_partner_cents)"
          - "creates LedgerEntry(entry_type=END_USER_DEBIT, custody_account_id=FBO account, amount_cents = -settlement_base_cents, settlement_batch_id=batch.id)"
          - "creates LedgerEntry(entry_type=RESERVE_FUND, custody_account_id=RESERVE account, amount_cents = +reserve_funding_cents + shortfall_carry_cents, settlement_batch_id=batch.id)"
          - "creates LedgerEntry(entry_type=FEE, custody_account_id=RESERVE account, amount_cents = -bank_fee_cents, settlement_batch_id=batch.id) when bank_fee_cents > 0"
          - "adds net_to_partner_cents to Partner.cumulative_paid_out_cents and bank_fee_cents to Partner.cumulative_bank_fee_cents"
          - "each ledger insert recomputes its CustodyAccount.balance_cents (cascade A link 2)"
          - "the changed balances recompute Partner.required_reserve_cents, Partner.reserve_shortfall_cents and Partner.concentration_ratio_pct (cascade A link 3)"
          - "the recomputed shortfall re-derives Partner.oversight_posture (cascade A link 4)"
          - "a posture of FROZEN moves both CustodyAccount rows ACTIVE -> FROZEN (cascade A link 5)"
          - "sets funded_at = the logical clock; increments version by 1"
      - from: "funding_status=FUNDED"
        to: "funding_status=CLAWED_BACK"
        trigger: "POST /oversight/settlement-batches/{id}/clawback"
        actor: ProgramOfficer
        preconditions:
          - "batch.funding_status == FUNDED"
          - "partner.status IN {LIVE, WIND_DOWN}"
        side_effects:
          - "creates one CLAWBACK LedgerEntry per funding entry, each with amount_cents equal to the negation of the entry it reverses and reversal_of_entry_id set to that entry's id"
          - "subtracts net_to_partner_cents from Partner.cumulative_paid_out_cents and bank_fee_cents from Partner.cumulative_bank_fee_cents"
          - "recomputes both CustodyAccount.balance_cents, then Partner.required_reserve_cents / reserve_shortfall_cents / concentration_ratio_pct, then Partner.oversight_posture"
          - "leaves funded_at, bank_fee_cents, reserve_funding_cents and net_to_partner_cents unchanged as the historical record"
          - "increments version by 1"
        note: "Compensating invariant (Rule 9): fbo.balance_cents + reserve.balance_cents + Partner.cumulative_paid_out_cents + Partner.cumulative_bank_fee_cents is identical before fund and after clawback."

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: ROOT_CAUSE_ASSIGNED
        trigger: "POST /oversight/complaints/{id}/assign-root-cause"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status == RECEIVED"
        side_effects:
          - "stores root_cause_code"
          - "recomputes Partner.open_complaint_count (unchanged: RECEIVED and ROOT_CAUSE_ASSIGNED are both open)"
          - "increments version by 1"
      - from: ESCALATED
        to: ROOT_CAUSE_ASSIGNED
        trigger: "POST /oversight/complaints/{id}/assign-root-cause"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status == ESCALATED"
        side_effects:
          - "overwrites root_cause_code"
          - "decrements Partner.escalated_complaint_count by 1 and increments Partner.open_complaint_count by 1"
          - "recomputes Partner.complaint_rate_bps then Partner.oversight_posture"
          - "increments version by 1"
        note: "Cycle edge ROOT_CAUSE_ASSIGNED -> ESCALATED -> ROOT_CAUSE_ASSIGNED; the count conservation invariant holds at every step."
      - from: ROOT_CAUSE_ASSIGNED
        to: RESOLVED
        trigger: "POST /oversight/complaints/{id}/disposition with outcome=RESOLVED"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status == ROOT_CAUSE_ASSIGNED"
          - "complaint.root_cause_code != null"
        side_effects:
          - "sets resolved_at = the logical clock and stores redress_cents"
          - "decrements Partner.open_complaint_count by 1 and increments Partner.resolved_complaint_count by 1"
          - "recomputes Partner.complaint_rate_bps then Partner.oversight_posture"
          - "increments version by 1"
      - from: ROOT_CAUSE_ASSIGNED
        to: ESCALATED
        trigger: "POST /oversight/complaints/{id}/disposition with outcome=ESCALATED"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status == ROOT_CAUSE_ASSIGNED"
        side_effects:
          - "increments escalation_count by 1"
          - "decrements Partner.open_complaint_count by 1 and increments Partner.escalated_complaint_count by 1"
          - "recomputes Partner.complaint_rate_bps then Partner.oversight_posture"
          - "increments version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /oversight/complaints/{id}/disposition with outcome=RESOLVED"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status == ESCALATED"
          - "complaint.root_cause_code != null"
        side_effects:
          - "sets resolved_at = the logical clock and stores redress_cents"
          - "decrements Partner.escalated_complaint_count by 1 and increments Partner.resolved_complaint_count by 1"
          - "recomputes Partner.complaint_rate_bps then Partner.oversight_posture"
          - "increments version by 1"
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /oversight/complaints/{id}/disposition with outcome=WITHDRAWN"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status == RECEIVED"
        side_effects:
          - "sets resolved_at = the logical clock"
          - "decrements Partner.open_complaint_count by 1 and increments Partner.withdrawn_complaint_count by 1"
          - "recomputes Partner.complaint_rate_bps (WITHDRAWN complaints leave the numerator) then Partner.oversight_posture"
          - "increments version by 1"
      - from: RECEIVED
        to: ESCALATED
        trigger: "POST /oversight/cycles/{id}/close (system, response_due_at breached)"
        actor: system
        preconditions:
          - "complaint.status == RECEIVED"
          - "complaint.response_due_at < the logical clock at close"
        side_effects:
          - "increments escalation_count by 1 and OversightCycle.complaints_escalated_count by 1"
          - "decrements Partner.open_complaint_count by 1 and increments Partner.escalated_complaint_count by 1 (cascade B link 2)"
          - "the changed counts recompute Partner.complaint_rate_bps, which re-derives Partner.oversight_posture (cascade B link 3)"
          - "a resulting posture IN {RESTRICTED, FROZEN} expires the Partner's APPROVED MarketingReviews (cascade B link 4)"
      - from: ROOT_CAUSE_ASSIGNED
        to: ESCALATED
        trigger: "POST /oversight/cycles/{id}/close (system, response_due_at breached)"
        actor: system
        preconditions:
          - "complaint.status == ROOT_CAUSE_ASSIGNED"
          - "complaint.response_due_at < the logical clock at close"
        side_effects:
          - "same cascade as the RECEIVED -> ESCALATED close edge"

  - entity: TransactionMonitoringAlert
    initial_state: OPEN
    terminal_states: [CLEARED, SAR_FILED]
    transitions:
      - from: OPEN
        to: PARTNER_RESPONSE_PENDING
        trigger: "POST /oversight/alerts/{id}/dispose with disposition=PARTNER_RESPONSE_PENDING"
        actor: ComplianceOfficer
        preconditions:
          - "alert.disposition == OPEN"
        side_effects:
          - "sets disposed_by_user_id = X-User-ID"
          - "increments version by 1"
      - from: PARTNER_RESPONSE_PENDING
        to: OPEN
        trigger: "POST /oversight/cycles/{id}/close (system, sla_due_at breached)"
        actor: system
        preconditions:
          - "alert.disposition == PARTNER_RESPONSE_PENDING"
          - "alert.sla_due_at < the logical clock at close"
        side_effects:
          - "increments sla_breach_count by 1 and OversightCycle.alerts_reopened_count by 1"
          - "for alert_type == SANCTIONS_HIT the alert stays inside the open set, so Partner.open_sanctions_alert_count is unchanged and the FROZEN predicate remains satisfied"
        note: "Cycle edge OPEN -> PARTNER_RESPONSE_PENDING -> OPEN."
      - from: OPEN
        to: CLEARED
        trigger: "POST /oversight/alerts/{id}/dispose with disposition=CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "alert.disposition == OPEN"
          - "disposition_note length >= 20 characters"
        side_effects:
          - "recomputes Partner.open_sanctions_alert_count when alert_type == SANCTIONS_HIT"
          - "recomputes Partner.oversight_posture"
          - "increments version by 1"
      - from: PARTNER_RESPONSE_PENDING
        to: CLEARED
        trigger: "POST /oversight/alerts/{id}/dispose with disposition=CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "alert.disposition == PARTNER_RESPONSE_PENDING"
          - "disposition_note length >= 20 characters"
        side_effects:
          - "recomputes Partner.open_sanctions_alert_count when alert_type == SANCTIONS_HIT"
          - "recomputes Partner.oversight_posture"
          - "increments version by 1"
      - from: OPEN
        to: SAR_FILED
        trigger: "POST /oversight/alerts/{id}/dispose with disposition=SAR_FILED"
        actor: ComplianceOfficer
        preconditions:
          - "alert.disposition == OPEN"
          - "disposition_note length >= 20 characters"
        side_effects:
          - "recomputes Partner.open_sanctions_alert_count when alert_type == SANCTIONS_HIT"
          - "recomputes Partner.oversight_posture"
          - "increments version by 1"
      - from: PARTNER_RESPONSE_PENDING
        to: SAR_FILED
        trigger: "POST /oversight/alerts/{id}/dispose with disposition=SAR_FILED"
        actor: ComplianceOfficer
        preconditions:
          - "alert.disposition == PARTNER_RESPONSE_PENDING"
          - "disposition_note length >= 20 characters"
        side_effects:
          - "recomputes Partner.open_sanctions_alert_count when alert_type == SANCTIONS_HIT"
          - "recomputes Partner.oversight_posture"
          - "increments version by 1"

  - entity: OversightCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSING
        trigger: "POST /oversight/cycles/{id}/close (phase 1, inside the same request)"
        actor: ProgramOfficer
        preconditions:
          - "cycle.status == OPEN"
          - "no other OversightCycle has status == CLOSING"
          - "cycle.period_end <= the logical clock"
        side_effects:
          - "the cycle stops accepting LedgerEntry rows: any effective_at inside [period_start, period_end) is rejected with ERR_NO_OPEN_CYCLE from this point on"
          - "increments version by 1"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /oversight/cycles/{id}/close (phase 2, same request, executed in the pinned order below)"
        actor: system
        preconditions:
          - "cycle.status == CLOSING"
        side_effects:
          - "step 1 — escalate every Complaint with status IN {RECEIVED, ROOT_CAUSE_ASSIGNED} whose response_due_at < the logical clock, ordered by Complaint.received_at ASC then Complaint.created_at ASC"
          - "step 2 — return every PARTNER_RESPONSE_PENDING TransactionMonitoringAlert whose sla_due_at < the logical clock to OPEN, ordered by TransactionMonitoringAlert.triggered_at ASC then created_at ASC"
          - "step 3 — for each Partner with status IN {CONTRACTED, LIVE, WIND_DOWN}, ordered by Partner.created_at ASC: recompute complaint_rate_bps, monthly_growth_pct (updating growth_breach_count), concentration_ratio_pct, required_reserve_cents and reserve_shortfall_cents, then consecutive_shortfall_cycles, then oversight_posture"
          - "step 4 — apply posture consequences: FROZEN freezes both CustodyAccount rows; a posture that is no longer FROZEN unfreezes them; RESTRICTED or FROZEN expires the Partner's APPROVED MarketingReviews; every posture change also expires APPROVED MarketingReviews whose effective_until < the logical clock"
          - "step 5 — complete every WindDownPlan with status == IN_EXECUTION whose residual_balance_cents == 0, closing that Partner's CustodyAccount rows and advancing the Partner WIND_DOWN -> TERMINATED"
          - "step 6 — write partners_frozen_count, marketing_approvals_expired_count, complaints_escalated_count, alerts_reopened_count, growth_breach_partner_count, plans_completed_count and closed_at"
        note: "Ops-run checkpoint. The step order is normative: step 1 changes complaint counts that step 3 reads, and step 3's posture is what step 4 acts on."

  - entity: WindDownPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /oversight/wind-down-plans/{id}/submit"
        actor: ProgramOfficer
        preconditions:
          - "plan.status == DRAFT"
          - "partner.status == WIND_DOWN"
          - "plan.milestones contains RETURN_FUNDS and CLOSE_CUSTODY"
        side_effects:
          - "recomputes residual_balance_cents"
          - "increments version by 1"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /oversight/wind-down-plans/{id}/decide with decision=REVISE"
        actor: RiskCommittee
        preconditions:
          - "plan.status == PENDING_APPROVAL"
          - "X-User-ID != plan.created_by_user_id"
        side_effects:
          - "increments revision_round by 1"
        note: "Cycle edge PENDING_APPROVAL -> DRAFT -> PENDING_APPROVAL."
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /oversight/wind-down-plans/{id}/decide with decision=APPROVE"
        actor: RiskCommittee
        preconditions:
          - "plan.status == PENDING_APPROVAL"
          - "partner.status == WIND_DOWN"
          - "plan.notice_days >= MIN_WIND_DOWN_NOTICE_DAYS (30)"
          - "X-User-ID != plan.created_by_user_id"
        side_effects:
          - "sets approved_by_user_id = X-User-ID"
          - "recomputes residual_balance_cents"
          - "increments version by 1"
      - from: APPROVED
        to: IN_EXECUTION
        trigger: "POST /oversight/wind-down-plans/{id}/execute"
        actor: ProgramOfficer
        preconditions:
          - "plan.status == APPROVED"
          - "no SettlementBatch for this Partner has funding_status == UNFUNDED"
          - "no SettlementBatch for this Partner has reconciliation_status IN {UNRECONCILED, VARIANCE_OPEN}"
          - "the logical clock >= plan.created_at + notice_days days"
        side_effects:
          - "recomputes residual_balance_cents"
          - "increments version by 1"
        note: "Cross-entity gate (Rule 7, WindDownPlan -> SettlementBatch): execution is decided by the funding and reconciliation dimensions of every sibling SettlementBatch."
      - from: IN_EXECUTION
        to: COMPLETED
        trigger: "POST /oversight/cycles/{id}/close (system, step 5)"
        actor: system
        preconditions:
          - "plan.status == IN_EXECUTION"
          - "plan.residual_balance_cents == 0"
        side_effects:
          - "sets completed_at = the logical clock"
          - "sets both CustodyAccount rows for the Partner to CLOSED"
          - "advances Partner.status WIND_DOWN -> TERMINATED"
          - "increments OversightCycle.plans_completed_count by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:

  - rule_id: diligence-create-stale-partner
    parent_entity: Partner
    write_endpoint: "POST /oversight/diligence-reviews"
    occ_field: "expected_partner_version"
    description: |
      Creating a DiligenceReview against a Partner whose version has advanced
      since the client last read it is rejected. A renewal review legitimately
      supersedes the Partner's prior PASSED review and rewrites
      capability_tier and latest_composite_score once decided, so a writer
      holding a stale view of the Partner would silently re-underwrite against
      superseded scores. The stale-version check makes the attempt observable
      instead.
    error_id: ERR_STALE_PARTNER_VERSION
    http_status: 412

  - rule_id: agreement-create-stale-partner
    parent_entity: Partner
    write_endpoint: "POST /oversight/agreements"
    occ_field: "expected_partner_version"
    description: |
      Creating a ProgramAgreement against a Partner whose version has advanced
      since the client last read it is rejected. A new agreement legitimately
      supersedes the Partner's earlier draft terms (growth cap, concentration
      cap, reserve bps), so a second create carrying an older observed Partner
      version is writing caps derived from a superseded view of the partner's
      posture and tier.
    error_id: ERR_STALE_PARTNER_VERSION
    http_status: 412

  - rule_id: ledger-entry-stale-custody-account
    parent_entity: CustodyAccount
    write_endpoint: "POST /oversight/ledger-entries"
    occ_field: "expected_custody_account_version"
    description: |
      Booking a LedgerEntry against a CustodyAccount whose version has advanced
      since the client last read it is rejected. Ledger movements are additive
      and carry no state gate of their own, so a repeat booking would otherwise
      post a second, legitimate movement on top of a balance the client never
      observed — exactly the condition under which the end-user balance cap and
      the concentration cap are evaluated against a stale denominator.
    error_id: ERR_STALE_CUSTODY_ACCOUNT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: diligence_composite_score
    trigger: "DiligenceReview DRAFT -> SUBMITTED and INFO_REQUESTED -> SUBMITTED (POST /oversight/diligence-reviews/{id}/submit); writes effective_complaint_history_score, composite_score and tier"
    algorithm: weighted_scoring
    formula: |
      # ---- Step 0: variant selection for the complaint-history input --------
      if review.review_type == "INITIAL":
          effective_complaint_history_score = review.complaint_history_score
      else:  # review_type == "RENEWAL"
          effective_complaint_history_score =
              max(0, 100 - floor(partner.complaint_rate_bps / 5))

      # ---- Step 1..4: round EACH weighted component to 2 dp FIRST ----------
      c1 = round_half_up(review.business_model_score        * 0.20, 2)
      c2 = round_half_up(review.funding_score               * 0.25, 2)
      c3 = round_half_up(review.compliance_capability_score * 0.35, 2)
      c4 = round_half_up(effective_complaint_history_score  * 0.20, 2)

      # ---- Step 5: sum the ROUNDED components, THEN round to 1 dp ----------
      composite_score = round_half_up(c1 + c2 + c3 + c4, 1)

      # ---- Step 6: tier band (>= is inclusive at every boundary) -----------
      if composite_score >= 85.0:   tier = "TIER_1"
      elif composite_score >= 70.0: tier = "TIER_2"
      elif composite_score >= 55.0: tier = "TIER_3"
      else:                         tier = "UNRATED"
    input_set: |
      The four analyst sub-scores on this DiligenceReview row. For RENEWAL the
      complaint-history sub-score submitted in the request body is stored on
      complaint_history_score but is NOT used: the formula substitutes a value
      derived from partner.complaint_rate_bps as it stands at submit time.
      partner.complaint_rate_bps itself is the value persisted on the Partner
      at submit time (already recomputed by any earlier complaint disposition
      or cycle close); this calculation never recomputes it.
    constants:
      BUSINESS_MODEL_WEIGHT: 0.20
      FUNDING_WEIGHT: 0.25
      COMPLIANCE_CAPABILITY_WEIGHT: 0.35
      COMPLAINT_HISTORY_WEIGHT: 0.20
      COMPLIANCE_CAPABILITY_FLOOR: 60
      DILIGENCE_PASS_FLOOR: 55.0
      TIER_1_FLOOR: 85.0
      TIER_2_FLOOR: 70.0
      TIER_3_FLOOR: 55.0
      RENEWAL_BPS_PER_POINT: 5
    precision: "Each weighted component: 2 decimal places, round_half_up. Composite: 1 decimal place, round_half_up, applied to the SUM OF ROUNDED COMPONENTS — never round once at the end over unrounded products."
    variants:
      - name: initial_underwrite
        when: "review_type == INITIAL"
        difference: "Uses the analyst-submitted complaint_history_score verbatim, i.e. the partner's self-disclosed history."
      - name: renewal_underwrite
        when: "review_type == RENEWAL"
        difference: "Discards the submitted complaint_history_score and substitutes max(0, 100 - floor(partner.complaint_rate_bps / 5)), so identical submitted sub-scores yield a different composite_score, a different tier and a different PASS/FAIL outcome."

  - name: complaint_rate_bps
    trigger: "Every Complaint status change (create, assign-root-cause, disposition, cycle-close escalation), every POST /oversight/partners/{id}/account-census, and step 3 of every cycle close; writes Partner.complaint_rate_bps"
    algorithm: aggregation
    formula: |
      numerator = count of Complaint rows where
          Complaint.partner_id == partner.id
          AND Complaint.status IN {RECEIVED, ROOT_CAUSE_ASSIGNED, ESCALATED, RESOLVED}
          AND Complaint.received_at >  (logical_clock - 90 days)   # exclusive lower bound
          AND Complaint.received_at <= logical_clock               # inclusive upper bound
      denominator = max(1, partner.end_user_account_count)
      complaint_rate_bps = round_half_up(numerator * 10000 / denominator, 0)
    input_set: |
      Source entity Complaint, filtered to statuses {RECEIVED, ROOT_CAUSE_ASSIGNED,
      ESCALATED, RESOLVED}; WITHDRAWN complaints are excluded from the numerator.
      Window is the half-open interval (logical_clock - 90 days, logical_clock]
      on Complaint.received_at. Not order-sensitive (a pure count), so no
      tie-break is required. When the Partner has never filed a census,
      end_user_account_count is 0 and the denominator floor of 1 applies, so a
      single complaint yields 10000 bps.
    constants:
      COMPLAINT_WINDOW_DAYS: 90
      BPS_SCALE: 10000
      DENOMINATOR_FLOOR: 1
    precision: "Integer basis points, round_half_up at 0 decimal places."

  - name: alert_sla_due_at
    trigger: "POST /oversight/alerts (creation); writes TransactionMonitoringAlert.sla_due_at"
    algorithm: interval_merge
    formula: |
      hours = ALERT_SLA_HOURS[alert.alert_type]
      sla_due_at = alert.triggered_at + hours hours     # exact instant arithmetic, UTC
    input_set: "The alert's own alert_type and triggered_at. No calendar or business-day adjustment: alert SLAs run on wall-clock hours including weekends."
    constants:
      ALERT_SLA_HOURS:
        SANCTIONS_HIT: 24
        STRUCTURING: 72
        VELOCITY: 120
        ACH_RETURN_RATE: 168
    precision: "Whole hours; ISO 8601 UTC with three fractional digits, fractional part copied from triggered_at."

  - name: complaint_response_due_at
    trigger: "POST /oversight/complaints (creation); writes Complaint.response_due_at"
    algorithm: interval_merge
    formula: |
      spec = CHANNEL_SLA[complaint.channel]          # {days: N, basis: CALENDAR|BUSINESS}

      if spec.basis == "CALENDAR":
          # No weekend adjustment; the time-of-day of received_at is preserved.
          response_due_at = complaint.received_at + spec.days days

      else:  # spec.basis == "BUSINESS"
          # Anchor: if received_at falls on Saturday or Sunday (UTC), the anchor
          # moves forward to the next Monday at 00:00:00.000Z. Otherwise the
          # anchor is the UTC calendar date of received_at at 00:00:00.000Z.
          if weekday(complaint.received_at) in {SATURDAY, SUNDAY}:
              anchor_date = next Monday strictly after complaint.received_at
          else:
              anchor_date = the UTC date of complaint.received_at
          # Step spec.days business days forward from anchor_date, counting
          # Monday..Friday only and never counting anchor_date itself.
          d = anchor_date
          remaining = spec.days
          while remaining > 0:
              d = d + 1 day
              if weekday(d) in {MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY}:
                  remaining = remaining - 1
          response_due_at = d at 23:59:59.999Z
    input_set: "The complaint's own channel and received_at. No holiday calendar exists; only Saturday and Sunday are non-business days."
    constants:
      CHANNEL_SLA:
        CFPB_PORTAL: { days: 15, basis: CALENDAR }
        STATE_AG: { days: 10, basis: BUSINESS }
        SOCIAL: { days: 5, basis: BUSINESS }
        BANK_CALL_CENTER: { days: 30, basis: CALENDAR }
        PARTNER_APP: { days: 30, basis: CALENDAR }
        EMAIL: { days: 30, basis: CALENDAR }
    precision: "ISO 8601 UTC with three fractional digits. CALENDAR results keep received_at's time-of-day; BUSINESS results are pinned to 23:59:59.999Z."
    variants:
      - name: calendar_basis
        when: "channel IN {CFPB_PORTAL, BANK_CALL_CENTER, PARTNER_APP, EMAIL}"
        difference: "Straight instant arithmetic; weekends consumed; time-of-day preserved."
      - name: business_basis
        when: "channel IN {STATE_AG, SOCIAL}"
        difference: "Weekend-skipping day count from a normalised midnight anchor, pinned to end-of-day; a Saturday intake and the following Monday intake produce the SAME due date."

  - name: required_reserve_cents
    trigger: "Every LedgerEntry insert, every SettlementBatch fund / clawback / clear-variance, ProgramAgreement PENDING_RISK_APPROVAL -> EXECUTED, and step 3 of every cycle close; writes Partner.required_reserve_cents and Partner.reserve_shortfall_cents"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS NORMATIVE. required_reserve_cents depends on the
      # posture, and the posture depends on reserve_shortfall_cents, which
      # depends on required_reserve_cents. The dependency is broken by pinning
      # a SINGLE PASS that reads the posture as it was PERSISTED BEFORE this
      # recompute began. There is no fixed-point iteration: the posture value
      # written later in the same pass is NOT fed back into this formula.
      posture_in = partner.oversight_posture      # value persisted before this pass
      fbo_balance     = balance_cents of this Partner's CustodyAccount with account_type == FBO_END_USER
      reserve_balance = balance_cents of this Partner's CustodyAccount with account_type == RESERVE
      agreement       = the ProgramAgreement for this Partner with status IN {EXECUTED, TERMINATED};
                        if none exists, required_reserve_cents = 0 and reserve_shortfall_cents = 0 and STOP

      trailing_gross = sum of SettlementBatch.gross_settlement_cents over rows where
                          SettlementBatch.partner_id == partner.id
                          AND SettlementBatch.reconciliation_status IN {MATCHED, VARIANCE_CLEARED}
                          AND SettlementBatch.window_end >  (logical_clock - 90 days)   # exclusive
                          AND SettlementBatch.window_end <= logical_clock               # inclusive

      # Step 1 — three-way floor (nested max over three heterogeneous inputs)
      base = max(
               floor(fbo_balance     * agreement.reserve_requirement_bps / 10000),
               floor(trailing_gross  * RESERVE_VOLUME_FLOOR_BPS          / 10000),
               RESERVE_ABSOLUTE_FLOOR_CENTS
             )

      # Step 2 — posture multiplier, floored to whole cents AFTER multiplying
      scaled = floor(base * POSTURE_MULTIPLIER[posture_in])

      # Step 3 — contractual ceiling
      required_reserve_cents = min(scaled, agreement.max_end_user_balance_cents)

      # Step 4 — shortfall
      reserve_shortfall_cents = max(0, required_reserve_cents - reserve_balance)
    input_set: |
      Source entities: the Partner's two CustodyAccount rows (by account_type,
      any status including FROZEN, excluding CLOSED — a CLOSED account
      contributes 0); the Partner's ProgramAgreement with status IN {EXECUTED,
      TERMINATED} (there is at most one such row per Partner); SettlementBatch
      rows filtered to reconciliation_status IN {MATCHED, VARIANCE_CLEARED} with
      window_end in the half-open window (logical_clock - 90 days,
      logical_clock]. A pure sum, so no tie-break is required.
    constants:
      RESERVE_VOLUME_FLOOR_BPS: 150
      RESERVE_ABSOLUTE_FLOOR_CENTS: 250000
      RESERVE_TRAILING_WINDOW_DAYS: 90
      POSTURE_MULTIPLIER:
        OPEN: 1.00
        HEIGHTENED: 1.25
        RESTRICTED: 1.50
        FROZEN: 2.00
    precision: "Integer cents throughout. Each bps product is floored to cents BEFORE the max; the posture multiplier is applied to the already-floored base and the product is floored again. Rounding never happens after the min."

  - name: partner_oversight_posture
    trigger: "Every recompute pass that changes complaint counts, custody balances, variance, growth breaches or sanctions-alert counts, and step 3 of every cycle close; writes Partner.oversight_posture"
    algorithm: constraint_propagation
    formula: |
      # Ordered predicate evaluation, FIRST MATCH WINS, most severe first.
      # Every input is the value persisted at the moment this predicate runs,
      # i.e. AFTER required_reserve_cents / reserve_shortfall_cents have been
      # rewritten by the same pass (single pass, see required_reserve_cents).
      if partner.open_sanctions_alert_count >= 1
         OR partner.consecutive_shortfall_cycles >= 2:
          oversight_posture = "FROZEN"
      elif partner.complaint_rate_bps >= RESTRICT_COMPLAINT_RATE_BPS
         OR partner.unreconciled_variance_cents >= VARIANCE_RESTRICT_CENTS
         OR partner.growth_breach_count >= 2:
          oversight_posture = "RESTRICTED"
      elif partner.complaint_rate_bps >= HEIGHTEN_COMPLAINT_RATE_BPS
         OR partner.growth_breach_count == 1
         OR partner.reserve_shortfall_cents > 0:
          oversight_posture = "HEIGHTENED"
      else:
          oversight_posture = "OPEN"
    input_set: |
      All five inputs are computed fields already persisted on the Partner row:
      open_sanctions_alert_count, consecutive_shortfall_cycles,
      complaint_rate_bps, unreconciled_variance_cents, growth_breach_count and
      reserve_shortfall_cents. Partners with status IN {PROSPECT, IN_DILIGENCE,
      DILIGENCE_PASSED, DILIGENCE_FAILED, TERMINATED} keep oversight_posture ==
      OPEN and are skipped by this calculation.
    constants:
      RESTRICT_COMPLAINT_RATE_BPS: 250
      HEIGHTEN_COMPLAINT_RATE_BPS: 120
      VARIANCE_RESTRICT_CENTS: 500000
      RESTRICT_GROWTH_BREACH_COUNT: 2
    precision: "Integer comparisons; every threshold is inclusive (>=), including RESTRICT_COMPLAINT_RATE_BPS: exactly 250 bps yields RESTRICTED, 249 bps yields HEIGHTENED."

  - name: settlement_net_to_partner_cents
    trigger: "SettlementBatch funding_status UNFUNDED -> FUNDED (POST /oversight/settlement-batches/{id}/fund); writes bank_fee_bps_applied, bank_fee_cents, settlement_base_cents, reserve_funding_cents, net_to_partner_cents and shortfall_carry_cents"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS NORMATIVE (steps 1..6 in sequence). The fee tier
      # looks like it should key on the amount actually paid out, which is only
      # known after the fee is deducted. The order below breaks that by pinning
      # the tier to gross_settlement_cents, evaluated BEFORE any deduction.
      agreement = the ProgramAgreement for this Partner with status IN {EXECUTED, TERMINATED}

      # Step 1 — tier selection on GROSS, flat (non-marginal) rate on the whole gross
      if   batch.gross_settlement_cents <  TIER_2_GROSS_FLOOR_CENTS: bank_fee_bps_applied = 45
      elif batch.gross_settlement_cents <  TIER_3_GROSS_FLOOR_CENTS: bank_fee_bps_applied = 32
      else:                                                          bank_fee_bps_applied = 21

      # Step 2 — bank fee
      bank_fee_cents = BANK_BASE_FEE_CENTS
                     + floor(batch.gross_settlement_cents * bank_fee_bps_applied / 10000)

      # Step 3 — settlement base (variance_adjustment_cents is 0 unless a
      #          variance was cleared before funding)
      settlement_base_cents = batch.gross_settlement_cents
                            + batch.interchange_cents
                            - batch.returns_cents
                            + batch.variance_adjustment_cents

      # Step 4 — reserve funding basis; VARIANT SELECTION (see variants below)
      if batch.reconciliation_status == "MATCHED":
          reserve_funding_cents = floor(batch.gross_settlement_cents  * agreement.reserve_requirement_bps / 10000)
      else:  # reconciliation_status == "VARIANCE_CLEARED"
          reserve_funding_cents = floor(settlement_base_cents         * agreement.reserve_requirement_bps / 10000)

      # Step 5 — payout, floored at zero
      raw_net = settlement_base_cents - bank_fee_cents - reserve_funding_cents
      net_to_partner_cents = max(0, raw_net)

      # Step 6 — the amount the reserve must absorb when fees outrun the base
      shortfall_carry_cents = max(0, -raw_net)
    input_set: |
      The batch's own gross_settlement_cents, interchange_cents, returns_cents,
      variance_adjustment_cents and reconciliation_status, plus
      reserve_requirement_bps read from the Partner's ProgramAgreement with
      status IN {EXECUTED, TERMINATED}. No aggregation over sibling batches.
    constants:
      BANK_BASE_FEE_CENTS: 25000
      TIER_1_BPS: 45
      TIER_2_BPS: 32
      TIER_3_BPS: 21
      TIER_2_GROSS_FLOOR_CENTS: 10000000
      TIER_3_GROSS_FLOOR_CENTS: 100000000
    precision: "Integer cents. Each bps product is floored independently before it enters any sum or difference; the base fee is added AFTER the bps product is floored, never before."
    variants:
      - name: gross_basis_reserve
        when: "reconciliation_status == MATCHED at funding time"
        difference: "reserve_funding_cents is taken on gross_settlement_cents alone, ignoring interchange, returns and adjustments."
      - name: net_basis_reserve
        when: "reconciliation_status == VARIANCE_CLEARED at funding time"
        difference: "reserve_funding_cents is taken on settlement_base_cents, so identical gross/interchange/returns inputs produce a different reserve_funding_cents and a different net_to_partner_cents than the gross basis."

  - name: concentration_ratio_pct
    trigger: "Every LedgerEntry insert, every SettlementBatch fund / clawback / clear-variance, and step 3 of every cycle close; writes Partner.concentration_ratio_pct"
    algorithm: aggregation
    formula: |
      # Step 1 — walk parent_partner_id upward to the group root. The chain is
      # guaranteed acyclic by validation priority 22.
      root = partner
      while root.parent_partner_id != null:
          root = Partner(root.parent_partner_id)

      # Step 2 — the group is the root plus every transitive descendant.
      group = {root} UNION {p : p reachable from root by following
                                parent_partner_id edges in reverse}

      # Step 3 — numerator: end-user custody held anywhere in the group.
      group_balance_cents = sum of CustodyAccount.balance_cents over rows where
          CustodyAccount.partner_id IN group
          AND CustodyAccount.account_type == "FBO_END_USER"
          AND CustodyAccount.status IN {ACTIVE, FROZEN}      # CLOSED excluded

      # Step 4 — denominator: the whole bank's end-user custody.
      bank_total_cents = sum of CustodyAccount.balance_cents over ALL rows where
          CustodyAccount.account_type == "FBO_END_USER"
          AND CustodyAccount.status IN {ACTIVE, FROZEN}      # CLOSED excluded

      # Step 5 — empty-denominator edge is a defined value, not an error.
      if bank_total_cents == 0:
          concentration_ratio_pct = 0.00
      else:
          concentration_ratio_pct = round_half_up(group_balance_cents * 100 / bank_total_cents, 2)

      # Step 6 — cap test (inclusive)
      breach = concentration_ratio_pct >= agreement.concentration_cap_pct
    input_set: |
      Source entity CustodyAccount, filtered to account_type == FBO_END_USER and
      status IN {ACTIVE, FROZEN}. Numerator scope is the Partner's group
      subtree resolved through parent_partner_id; denominator scope is every
      Partner in the system, including Partners in PROSPECT or TERMINATED
      status, so long as an FBO_END_USER account with status IN {ACTIVE, FROZEN}
      exists for them. A pure sum in both cases, so no tie-break is required.
      Every Partner in the group is written with the SAME
      concentration_ratio_pct: the ratio is a group property.
    constants:
      CLOSED_ACCOUNTS_EXCLUDED: true
    precision: "2 decimal places, round_half_up, applied once at step 5 to the exact rational group_balance_cents*100/bank_total_cents. The cap comparison at step 6 uses the ROUNDED value, so a true ratio of 24.995% rounds to 25.00 and breaches a 25.00 cap."

  - name: monthly_growth_pct
    trigger: "Step 3 of POST /oversight/cycles/{id}/close; may increment Partner.growth_breach_count and OversightCycle.growth_breach_partner_count"
    algorithm: threshold
    formula: |
      cycle       = the OversightCycle being closed
      prior_cycle = the OversightCycle with cycle_index == cycle.cycle_index - 1
                    and status == CLOSED, or none

      curr = sum of LedgerEntry.amount_cents over rows where
                LedgerEntry.partner_id == partner.id
                AND LedgerEntry.entry_type == "END_USER_CREDIT"
                AND LedgerEntry.effective_at >= cycle.period_start   # inclusive
                AND LedgerEntry.effective_at <  cycle.period_end     # exclusive

      prior = 0 if prior_cycle is none else the same sum evaluated over
                [prior_cycle.period_start, prior_cycle.period_end)

      if prior == 0:
          # No baseline: the percentage is undefined, so an ABSOLUTE cap applies.
          monthly_growth_pct = 0.00
          breach = curr > GROWTH_SEED_ABSOLUTE_CAP_CENTS          # STRICT >
      else:
          monthly_growth_pct = round_half_up((curr - prior) * 100 / prior, 2)
          breach = monthly_growth_pct > agreement.monthly_growth_cap_pct   # STRICT >

      if breach:
          partner.growth_breach_count = partner.growth_breach_count + 1
          cycle.growth_breach_partner_count = cycle.growth_breach_partner_count + 1
    input_set: |
      Source entity LedgerEntry, filtered to entry_type == END_USER_CREDIT (so
      settlement debits, reserve movements, fees and clawbacks are excluded),
      windowed on effective_at over the half-open interval [period_start,
      period_end) of the cycle being closed and of the immediately preceding
      CLOSED cycle selected by cycle_index - 1 (never by created_at, never by
      id). A pure sum, so no tie-break is required.
    constants:
      GROWTH_SEED_ABSOLUTE_CAP_CENTS: 5000000
    precision: "2 decimal places, round_half_up. Both cap comparisons are STRICT greater-than: a growth of exactly monthly_growth_cap_pct is compliant, and curr exactly equal to GROWTH_SEED_ABSOLUTE_CAP_CENTS is compliant. This is deliberately the opposite convention from concentration_ratio_pct's inclusive >=."

  - name: marketing_risk_flags
    trigger: "POST /oversight/marketing-reviews (creation), POST /oversight/marketing-reviews/{id}/resubmit, and every POST /oversight/marketing-reviews/{id}/decide; writes MarketingReview.risk_flags"
    algorithm: constraint_propagation
    formula: |
      flags = []
      if partner.business_model == "LENDING"
         and (review.apr_disclosed == false or "APR" not in review.disclosure_elements):
          flags.append("MISSING_APR")
      if partner.business_model == "DEPOSIT_WALLET"
         and (review.fdic_signage_correct == false
              or "FDIC_SIGNAGE" not in review.disclosure_elements
              or "PASS_THROUGH_INSURANCE" not in review.disclosure_elements):
          flags.append("MISSING_FDIC_SIGNAGE")
      if review.material_type == "DISCLOSURE"
         and "DISPUTE_RIGHTS" not in review.disclosure_elements:
          flags.append("MISSING_DISPUTE_RIGHTS")
      risk_flags = flags sorted ascending by the fixed order
                   [MISSING_APR, MISSING_FDIC_SIGNAGE, MISSING_DISPUTE_RIGHTS]
    input_set: "The review's own material_type, disclosure_elements, apr_disclosed and fdic_signage_correct, plus the owning Partner's business_model. Order of the emitted array is the fixed declaration order above, never insertion order."
    constants:
      FLAG_ORDER: [MISSING_APR, MISSING_FDIC_SIGNAGE, MISSING_DISPUTE_RIGHTS]
    precision: "Exact string set; an empty array is the only value that permits APPROVE."

  - name: systemic_root_cause_code
    trigger: "Step 3 of POST /oversight/cycles/{id}/close; returned by GET /oversight/partners/{id}/oversight-summary as systemic_root_cause_code"
    algorithm: aggregation
    formula: |
      pool = Complaint rows where
                Complaint.partner_id == partner.id
                AND Complaint.status IN {ROOT_CAUSE_ASSIGNED, ESCALATED, RESOLVED}
                AND Complaint.root_cause_code != null
                AND Complaint.received_at >= cycle.period_start   # inclusive
                AND Complaint.received_at <  cycle.period_end     # exclusive

      if pool is empty: systemic_root_cause_code = null and STOP

      counts = count of pool rows grouped by root_cause_code
      top_count = max(counts.values())
      candidates = {code : counts[code] == top_count}

      # Tie-break 1: the code whose EARLIEST qualifying complaint was created first.
      # Tie-break 2 (identical created_at): lexicographically smallest code.
      # `id` is never consulted.
      systemic_root_cause_code = the candidate minimising
          (min(Complaint.created_at over pool rows bearing that code), code)
    input_set: "Source entity Complaint, filtered to statuses {ROOT_CAUSE_ASSIGNED, ESCALATED, RESOLVED} with a non-null root_cause_code, windowed on received_at over the half-open interval [period_start, period_end) of the cycle being closed. WITHDRAWN and RECEIVED complaints never enter the pool."
    constants:
      QUALIFYING_STATUSES: [ROOT_CAUSE_ASSIGNED, ESCALATED, RESOLVED]
    precision: "Exact enum string or null. Tie-break keys are (created_at ASC, root_cause_code ASC) — never id."

  - name: wind_down_residual_balance_cents
    trigger: "WindDownPlan submit / decide / execute, and step 5 of every cycle close; writes WindDownPlan.residual_balance_cents"
    algorithm: aggregation
    formula: |
      residual_balance_cents = sum of CustodyAccount.balance_cents over rows where
          CustodyAccount.partner_id == plan.partner_id
          AND CustodyAccount.status IN {ACTIVE, FROZEN}     # CLOSED excluded
      # Both account types are included: the plan cannot complete while either
      # end-user funds OR reserve funds remain in custody.
    input_set: "Source entity CustodyAccount for the plan's Partner, both account_types, filtered to status IN {ACTIVE, FROZEN}. A pure sum, so no tie-break is required."
    constants:
      COMPLETION_RESIDUAL_CENTS: 0
    precision: "Integer cents. Completion requires exactly 0; a residual of 1 cent blocks completion."

  - name: settlement_conservation_invariant
    trigger: "Asserted after every SettlementBatch fund and after every clawback; not persisted as a field"
    algorithm: aggregation
    formula: |
      CONSERVED_SETTLEMENT_CENTS(partner) =
            (this Partner's FBO_END_USER CustodyAccount.balance_cents)
          + (this Partner's RESERVE      CustodyAccount.balance_cents)
          + partner.cumulative_paid_out_cents
          + partner.cumulative_bank_fee_cents

      # Invariant 1: funding only MOVES cents between the four terms.
      #   CONSERVED_SETTLEMENT_CENTS after fund == CONSERVED_SETTLEMENT_CENTS before fund
      # Invariant 2: clawback is the exact compensating action, so each of the
      #   four terms individually returns to its pre-fund value.
      #   fbo.balance_cents         after clawback == fbo.balance_cents         before fund
      #   reserve.balance_cents     after clawback == reserve.balance_cents     before fund
      #   cumulative_paid_out_cents after clawback == cumulative_paid_out_cents before fund
      #   cumulative_bank_fee_cents after clawback == cumulative_bank_fee_cents before fund
    input_set: "The Partner's two CustodyAccount rows with status IN {ACTIVE, FROZEN} plus the two cumulative counters on the Partner row. Holds regardless of whether net_to_partner_cents was floored at 0 with a shortfall_carry_cents."
    constants:
      CONSERVED_QUANTITY_KIND: money_cents
    precision: "Exact integer equality; no tolerance."

  - name: complaint_disposition_conservation_invariant
    trigger: "Asserted after every Complaint status change, including cycle-close escalations; not persisted as a field"
    algorithm: aggregation
    formula: |
      COMPLAINT_SLOTS(partner) =
            partner.open_complaint_count
          + partner.escalated_complaint_count
          + partner.resolved_complaint_count
          + partner.withdrawn_complaint_count

      # Invariant 1: the four buckets always partition the Partner's complaints.
      #   COMPLAINT_SLOTS(partner) == partner.total_complaint_count
      #                            == count of Complaint rows with this partner_id
      # Invariant 2: escalate followed by its compensating action (assign-root-cause
      #   back from ESCALATED) leaves COMPLAINT_SLOTS unchanged and returns
      #   open_complaint_count and escalated_complaint_count to their pre-escalation
      #   values, while escalation_count on the Complaint records the round trip.
    input_set: "The four bucket counters and total_complaint_count on the Partner row, cross-checked against Complaint rows filtered by partner_id with no status filter."
    constants:
      CONSERVED_QUANTITY_KIND: record_count
    precision: "Exact integer equality; no tolerance. Distinct in kind from settlement_conservation_invariant, which conserves cents rather than record slots."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure
# wins and short-circuits every later check)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 5
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 8
    category: existence
    check: "Every id in the path exists, validated left to right. Emits the resource-specific not-found error for the first missing segment."
    error_id: ERR_PARTNER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id; sibling errors ERR_REVIEW_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_MARKETING_REVIEW_NOT_FOUND, ERR_CUSTODY_ACCOUNT_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_ALERT_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_PLAN_NOT_FOUND cover the other collections"

  - priority: 10
    category: existence
    check: "Every foreign-key id supplied in the request body references an existing row, validated in body-field declaration order: partner_id, then agreement_id, then custody_account_id, then parent_partner_id."
    error_id: ERR_PARTNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /oversight/partners, POST /oversight/diligence-reviews, POST /oversight/agreements, POST /oversight/marketing-reviews, POST /oversight/settlement-batches, POST /oversight/ledger-entries, POST /oversight/complaints, POST /oversight/alerts, POST /oversight/wind-down-plans"

  - priority: 12
    category: auth
    check: "When X-User-Role == FintechPartner, X-User-ID equals the partner_id of the target resource (body partner_id on creates, the resource's partner_id on actions, the path id on POST /oversight/partners/{id}/account-census)."
    error_id: ERR_PARTNER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /oversight/partners/{id}/account-census, POST /oversight/marketing-reviews, POST /oversight/marketing-reviews/{id}/resubmit, POST /oversight/settlement-batches, POST /oversight/ledger-entries, POST /oversight/complaints, GET endpoints that return partner-scoped rows"

  - priority: 14
    category: auth
    check: "Segregation of duties: the acting X-User-ID must differ from the id recorded as the originator of the artefact being decided — agreement.created_by_user_id on risk-decision, review.submitted_by_user_id on diligence decide, review.created_by_user_id on marketing decide, plan.created_by_user_id on wind-down decide."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /oversight/agreements/{id}/risk-decision, POST /oversight/diligence-reviews/{id}/decide, POST /oversight/marketing-reviews/{id}/decide, POST /oversight/wind-down-plans/{id}/decide"

  - priority: 18
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: all required fields present, enum members recognised, numeric ranges and string lengths inside the constraints declared in §1.1, and limit/offset inside the §1.0 pagination bounds."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 20
    category: business_referential
    check: "parent_partner_id, when supplied, must not create a cycle in the Partner group tree: walking parent_partner_id upward from the supplied parent must not reach the Partner being created or updated."
    error_id: ERR_PARTNER_GROUP_CYCLE
    http_status: 422
    applies_to: "POST /oversight/partners"

  - priority: 22
    category: business_referential
    check: "The ProgramAgreement named by body agreement_id has agreement.partner_id equal to the body partner_id."
    error_id: ERR_AGREEMENT_PARTNER_MISMATCH
    http_status: 409
    applies_to: "POST /oversight/marketing-reviews"

  - priority: 24
    category: business_referential
    check: "The CustodyAccount named by body custody_account_id has custody_account.partner_id equal to the body partner_id."
    error_id: ERR_CUSTODY_PARTNER_MISMATCH
    http_status: 409
    applies_to: "POST /oversight/ledger-entries"

  - priority: 28
    category: state
    check: "The OCC field expected_partner_version equals the current Partner.version (concurrency rules diligence-create-stale-partner and agreement-create-stale-partner)."
    error_id: ERR_STALE_PARTNER_VERSION
    http_status: 412
    applies_to: "POST /oversight/diligence-reviews, POST /oversight/agreements"

  - priority: 29
    category: state
    check: "The OCC field expected_custody_account_version equals the current CustodyAccount.version (concurrency rule ledger-entry-stale-custody-account)."
    error_id: ERR_STALE_CUSTODY_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /oversight/ledger-entries"

  - priority: 32
    category: state
    check: "The Partner is not in a terminal status: no DiligenceReview, ProgramAgreement, MarketingReview, SettlementBatch, LedgerEntry, Complaint, TransactionMonitoringAlert or WindDownPlan may be created for a Partner whose status IN {DILIGENCE_FAILED, TERMINATED}."
    error_id: ERR_PARTNER_TERMINAL
    http_status: 409
    applies_to: "all POST endpoints carrying a body partner_id, plus POST /oversight/partners/{id}/account-census and POST /oversight/partners/{id}/go-live"

  - priority: 34
    category: state
    check: "The target resource is in a state the requested transition declares as `from` in §1.2. Emits the state error specific to the resource and endpoint."
    error_id: ERR_REVIEW_NOT_SUBMITTED
    http_status: 409
    applies_to: "all action endpoints; sibling errors ERR_REVIEW_NOT_DRAFT_OR_INFO_REQUESTED, ERR_AGREEMENT_NOT_DRAFT, ERR_AGREEMENT_NOT_PENDING_APPROVAL, ERR_AGREEMENT_NOT_EXECUTED, ERR_MARKETING_NOT_DECIDABLE, ERR_MARKETING_NOT_CHANGES_REQUESTED, ERR_BATCH_NOT_UNRECONCILED, ERR_BATCH_NO_OPEN_VARIANCE, ERR_BATCH_ALREADY_FUNDED, ERR_BATCH_NOT_FUNDED, ERR_COMPLAINT_NOT_DISPOSABLE, ERR_ALERT_TERMINAL, ERR_CYCLE_NOT_OPEN, ERR_PLAN_NOT_DRAFT, ERR_PLAN_NOT_PENDING_APPROVAL, ERR_PLAN_NOT_APPROVED cover the individual machines"

  - priority: 36
    category: state
    check: "Funding requires the reconciliation dimension to have left UNRECONCILED: batch.reconciliation_status IN {MATCHED, VARIANCE_CLEARED}."
    error_id: ERR_BATCH_NOT_RECONCILED
    http_status: 409
    applies_to: "POST /oversight/settlement-batches/{id}/fund"

  - priority: 38
    category: state
    check: "The Partner is LIVE where the endpoint requires an operating program: funding a settlement batch and booking an END_USER_CREDIT ledger entry both require partner.status == LIVE."
    error_id: ERR_PARTNER_NOT_LIVE
    http_status: 409
    applies_to: "POST /oversight/settlement-batches/{id}/fund, POST /oversight/ledger-entries when entry_type == END_USER_CREDIT"

  - priority: 39
    category: state
    check: "go-live requires the Partner's own status to be exactly CONTRACTED. This status guard is evaluated before the readiness sweep at priority 40, so a Partner still in DILIGENCE_PASSED with no agreement at all reports the status error rather than the readiness error."
    error_id: ERR_PARTNER_NOT_CONTRACTED
    http_status: 409
    applies_to: "POST /oversight/partners/{id}/go-live"

  - priority: 40
    category: state
    check: "go-live requires exactly one EXECUTED ProgramAgreement for the Partner and both of the Partner's CustodyAccount rows in status ACTIVE."
    error_id: ERR_PROGRAM_NOT_READY_FOR_LAUNCH
    http_status: 409
    applies_to: "POST /oversight/partners/{id}/go-live"

  - priority: 42
    category: state
    check: "A WindDownPlan may only be created, submitted, approved or executed while partner.status == WIND_DOWN."
    error_id: ERR_PARTNER_NOT_IN_WIND_DOWN
    http_status: 409
    applies_to: "POST /oversight/wind-down-plans, POST /oversight/wind-down-plans/{id}/submit, POST /oversight/wind-down-plans/{id}/decide, POST /oversight/wind-down-plans/{id}/execute"

  - priority: 44
    category: state
    check: "Plan execution requires no SettlementBatch for the Partner with funding_status == UNFUNDED and none with reconciliation_status IN {UNRECONCILED, VARIANCE_OPEN}."
    error_id: ERR_UNSETTLED_BATCHES_OUTSTANDING
    http_status: 409
    applies_to: "POST /oversight/wind-down-plans/{id}/execute"

  - priority: 46
    category: state
    check: "The CustodyAccount the operation moves is not FROZEN or CLOSED: funding requires the Partner's RESERVE account ACTIVE, and a ledger entry requires its own custody account ACTIVE."
    error_id: ERR_CUSTODY_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /oversight/settlement-batches/{id}/fund, POST /oversight/ledger-entries"

  - priority: 50
    category: business_safety
    check: "Marketing gate: filing a MarketingReview, resubmitting one, or deciding one with decision=APPROVE is refused while partner.oversight_posture IN {RESTRICTED, FROZEN}."
    error_id: ERR_POSTURE_BLOCKS_MARKETING
    http_status: 403
    applies_to: "POST /oversight/marketing-reviews, POST /oversight/marketing-reviews/{id}/resubmit, POST /oversight/marketing-reviews/{id}/decide with decision=APPROVE"

  - priority: 52
    category: business_safety
    check: "Inflow gate: booking a LedgerEntry with entry_type == END_USER_CREDIT is refused while partner.oversight_posture == FROZEN."
    error_id: ERR_POSTURE_BLOCKS_INFLOW
    http_status: 403
    applies_to: "POST /oversight/ledger-entries"

  - priority: 54
    category: business_safety
    check: "Disclosure completeness: decision=APPROVE requires the recomputed MarketingReview.risk_flags to be empty (calculation marketing_risk_flags)."
    error_id: ERR_DISCLOSURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /oversight/marketing-reviews/{id}/decide"

  - priority: 56
    category: business_safety
    check: "Diligence compliance floor: outcome=PASSED requires DiligenceReview.compliance_capability_score >= 60, checked before the composite floor."
    error_id: ERR_COMPLIANCE_CAPABILITY_FLOOR
    http_status: 422
    applies_to: "POST /oversight/diligence-reviews/{id}/decide"

  - priority: 57
    category: business_safety
    check: "Diligence composite floor: outcome=PASSED requires DiligenceReview.composite_score >= 55.0."
    error_id: ERR_DILIGENCE_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /oversight/diligence-reviews/{id}/decide"

  - priority: 58
    category: business_safety
    check: "Root-cause discipline: outcome=RESOLVED requires complaint.root_cause_code != null."
    error_id: ERR_ROOT_CAUSE_REQUIRED
    http_status: 409
    applies_to: "POST /oversight/complaints/{id}/disposition"

  - priority: 59
    category: business_safety
    check: "Termination discipline: the supplied termination_trigger appears in agreement.termination_triggers, and a WindDownPlan's trigger_reason appears in the Partner's agreement termination_triggers."
    error_id: ERR_TERMINATION_TRIGGER_NOT_CONTRACTED
    http_status: 422
    applies_to: "POST /oversight/agreements/{id}/terminate, POST /oversight/wind-down-plans"

  - priority: 60
    category: business_temporal
    check: "Interval sanity: window_end > window_start on SettlementBatch, period_end > period_start on OversightCycle, effective_until >= effective_from on MarketingReview."
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /oversight/settlement-batches, POST /oversight/cycles, POST /oversight/marketing-reviews, POST /oversight/marketing-reviews/{id}/resubmit"

  - priority: 62
    category: business_temporal
    check: "Settlement window overlap: for the same partner_id, the new half-open interval [window_start, window_end) must not intersect the half-open interval of any existing SettlementBatch. Adjacency is legal: new.window_start == existing.window_end is accepted, and so is new.window_end == existing.window_start. Intersection means new.window_start < existing.window_end AND existing.window_start < new.window_end."
    error_id: ERR_SETTLEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /oversight/settlement-batches"

  - priority: 63
    category: business_temporal
    check: "Approved-marketing window conflict: for the same (partner_id, material_type, placement_channel), the new CLOSED interval [effective_from, effective_until] must be separated from every existing APPROVED review's CLOSED interval by more than DISCLOSURE_COOLING_BUFFER_DAYS (3) days on BOTH sides. Conflict means new.effective_from <= existing.effective_until + 3 days AND existing.effective_from <= new.effective_until + 3 days. Unlike the settlement rule, touching endpoints conflict and so does a 3-day gap; only a gap strictly greater than 3 days clears."
    error_id: ERR_DISCLOSURE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /oversight/marketing-reviews/{id}/decide with decision=APPROVE"

  - priority: 64
    category: business_temporal
    check: "Cycle period overlap: the new half-open interval [period_start, period_end) must not intersect any existing OversightCycle period, regardless of that cycle's status."
    error_id: ERR_CYCLE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /oversight/cycles"

  - priority: 66
    category: business_temporal
    check: "Backdating limits: Complaint.received_at and TransactionMonitoringAlert.triggered_at must be <= the logical clock."
    error_id: ERR_TIMESTAMP_IN_FUTURE
    http_status: 422
    applies_to: "POST /oversight/complaints, POST /oversight/alerts"

  - priority: 67
    category: business_temporal
    check: "Agreement effective_date must be >= the logical clock at creation."
    error_id: ERR_EFFECTIVE_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /oversight/agreements"

  - priority: 68
    category: business_temporal
    check: "Cycle close requires cycle.period_end <= the logical clock; a cycle whose period has not elapsed cannot be closed."
    error_id: ERR_CYCLE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /oversight/cycles/{id}/close"

  - priority: 69
    category: business_temporal
    check: "Wind-down notice: plan.notice_days >= 30 and target_completion_date >= created_at + notice_days days at creation; execution additionally requires the logical clock >= plan.created_at + notice_days days."
    error_id: ERR_WIND_DOWN_NOTICE_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /oversight/wind-down-plans, POST /oversight/wind-down-plans/{id}/execute"

  - priority: 70
    category: business_constraint
    check: "At most one DiligenceReview per Partner may have status IN {DRAFT, SUBMITTED, INFO_REQUESTED} at any time."
    error_id: ERR_DILIGENCE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /oversight/diligence-reviews"

  - priority: 71
    category: business_constraint
    check: "At most one ProgramAgreement per Partner may have status IN {DRAFT, PENDING_RISK_APPROVAL}, and none may be created once one has reached EXECUTED that is not TERMINATED."
    error_id: ERR_AGREEMENT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /oversight/agreements"

  - priority: 72
    category: business_constraint
    check: "At most one WindDownPlan per Partner may have status IN {DRAFT, PENDING_APPROVAL, APPROVED, IN_EXECUTION}."
    error_id: ERR_PLAN_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /oversight/wind-down-plans"

  - priority: 73
    category: business_constraint
    check: "LedgerEntry sign discipline: amount_cents > 0 is required for END_USER_CREDIT, RESERVE_FUND and CLAWBACK; amount_cents < 0 is required for END_USER_DEBIT, RESERVE_RELEASE and FEE; VARIANCE_ADJUSTMENT accepts either sign but never 0. The entry_type must also match the account: END_USER_CREDIT and END_USER_DEBIT only on FBO_END_USER, RESERVE_FUND and RESERVE_RELEASE only on RESERVE."
    error_id: ERR_LEDGER_SIGN_MISMATCH
    http_status: 422
    applies_to: "POST /oversight/ledger-entries"

  - priority: 74
    category: business_constraint
    check: "LedgerEntry.effective_at must fall inside the half-open period [period_start, period_end) of an OversightCycle whose status == OPEN."
    error_id: ERR_NO_OPEN_CYCLE
    http_status: 409
    applies_to: "POST /oversight/ledger-entries"

  - priority: 75
    category: business_constraint
    check: "clear-variance must fully explain the variance: variance_adjustment_cents + partner_reported_net_cents == bank_reported_net_cents."
    error_id: ERR_VARIANCE_NOT_EXPLAINED
    http_status: 422
    applies_to: "POST /oversight/settlement-batches/{id}/clear-variance"

  - priority: 80
    category: business_fiscal
    check: "No custody account may go negative: after applying amount_cents, CustodyAccount.balance_cents must be >= 0. Applies to manual debits and releases and to the END_USER_DEBIT leg synthesised by funding."
    error_id: ERR_CUSTODY_INSUFFICIENT_FUNDS
    http_status: 409
    applies_to: "POST /oversight/ledger-entries, POST /oversight/settlement-batches/{id}/fund"

  - priority: 82
    category: business_fiscal
    check: "End-user balance cap: after an END_USER_CREDIT, the FBO_END_USER CustodyAccount.balance_cents must not exceed the Partner's agreement.max_end_user_balance_cents. The comparison is strict on the post-credit balance: exactly equal to the cap is accepted."
    error_id: ERR_END_USER_BALANCE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /oversight/ledger-entries"

  - priority: 84
    category: business_fiscal
    check: "Concentration cap: after an END_USER_CREDIT, the recomputed concentration_ratio_pct of the Partner's group must be strictly below agreement.concentration_cap_pct. A recomputed ratio exactly equal to the cap is a breach and the credit is refused."
    error_id: ERR_CONCENTRATION_CAP_BREACH
    http_status: 409
    applies_to: "POST /oversight/ledger-entries"

  - priority: 86
    category: business_fiscal
    check: "Reserve adequacy blocks payout: funding is refused while partner.reserve_shortfall_cents > 0."
    error_id: ERR_RESERVE_SHORTFALL_BLOCKS_FUNDING
    http_status: 402
    applies_to: "POST /oversight/settlement-batches/{id}/fund"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table   (api_prefix = /oversight; flat peer collections)
# -----------------------------------------------------------------------------
endpoints:

  # ---- Partner ---------------------------------------------------------------
  - method: POST
    path: "/oversight/partners"
    description: "Register a prospective fintech partner. Optionally attaches it to a corporate parent for group concentration accounting."
    roles: [ProgramOfficer]
    code: 201
    input: [legal_name, business_model, funding_stage, months_runway, disclosed_complaints_per_10k, end_user_account_count, "parent_partner_id?"]
    output: Partner
    side_effects:
      - "creates the Partner with status=PROSPECT, oversight_posture=OPEN, capability_tier=UNRATED, version=1"
      - "sets created_by_user_id = X-User-ID"
      - "recomputes concentration_ratio_pct for every Partner in the resulting group (all zero until custody exists)"

  - method: GET
    path: "/oversight/partners"
    description: "List partners with filters; the parent_partner_id filter is the reverse-reachability channel for the Partner self-reference."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["parent_partner_id?", "status?", "oversight_posture?", "business_model?", "limit?", "offset?"]
    output: Partner[]
    side_effects: []

  - method: GET
    path: "/oversight/partners/{id}"
    description: "Read one partner including every derived oversight field."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: Partner
    side_effects: []

  - method: GET
    path: "/oversight/partners/{id}/oversight-summary"
    description: "Computed read: the partner's current supervisory picture, including the group concentration ratio computed live (0.00 when the bank holds no end-user custody at all) and the systemic root cause from the most recently CLOSED cycle."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit]
    code: 200
    input: []
    output: "{ partner_id: string, oversight_posture: string, capability_tier: string, complaint_rate_bps: integer, concentration_ratio_pct: number, group_root_partner_id: string, group_balance_cents: integer, bank_total_fbo_balance_cents: integer, required_reserve_cents: integer, reserve_shortfall_cents: integer, consecutive_shortfall_cycles: integer, growth_breach_count: integer, unreconciled_variance_cents: integer, open_sanctions_alert_count: integer, systemic_root_cause_code: string, last_closed_cycle_index: integer }"
    side_effects: []

  - method: POST
    path: "/oversight/partners/{id}/account-census"
    description: "Partner reports its live end-user account count; this is the denominator of complaint_rate_bps."
    roles: [FintechPartner, ProgramOfficer]
    code: 200
    input: [end_user_account_count, as_of_date]
    output: Partner
    side_effects:
      - "overwrites Partner.end_user_account_count"
      - "recomputes Partner.complaint_rate_bps, then Partner.oversight_posture"
      - "increments Partner.version by 1"

  - method: POST
    path: "/oversight/partners/{id}/go-live"
    description: "Launch the program. Gated on the agreement being EXECUTED, both custody accounts ACTIVE, no reserve shortfall and a posture of OPEN or HEIGHTENED."
    roles: [ProgramOfficer]
    code: 200
    input: ["attestation_note?"]
    output: Partner
    side_effects:
      - "advances Partner.status CONTRACTED -> LIVE"
      - "increments Partner.version by 1"

  # ---- DiligenceReview -------------------------------------------------------
  - method: POST
    path: "/oversight/diligence-reviews"
    description: "Open a diligence file on a partner. OCC-guarded on the partner's version because a RENEWAL review supersedes the partner's prior scoring."
    roles: [ProgramOfficer]
    code: 201
    input: [partner_id, review_type, business_model_score, funding_score, compliance_capability_score, complaint_history_score, expected_partner_version]
    output: DiligenceReview
    side_effects:
      - "creates the DiligenceReview with status=DRAFT, revision_round=0, composite_score=0.0, tier=UNRATED"
      - "increments Partner.version by 1"

  - method: GET
    path: "/oversight/diligence-reviews"
    description: "List diligence reviews, filterable by partner."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["partner_id?", "status?", "review_type?", "limit?", "offset?"]
    output: DiligenceReview[]
    side_effects: []

  - method: GET
    path: "/oversight/diligence-reviews/{id}"
    description: "Read one diligence review including the composite score and tier."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: DiligenceReview
    side_effects: []

  - method: POST
    path: "/oversight/diligence-reviews/{id}/submit"
    description: "Submit or resubmit the review for compliance decision; recomputes the composite score under the variant selected by review_type."
    roles: [ProgramOfficer]
    code: 200
    input: ["submission_note?"]
    output: DiligenceReview
    side_effects:
      - "advances DiligenceReview DRAFT|INFO_REQUESTED -> SUBMITTED and sets revision_round"
      - "writes effective_complaint_history_score, composite_score and tier"
      - "advances Partner.status PROSPECT|DILIGENCE_PASSED -> IN_DILIGENCE and increments Partner.version by 1"

  - method: POST
    path: "/oversight/diligence-reviews/{id}/decide"
    description: "Compliance decision on a submitted review: PASSED, FAILED or INFO_REQUESTED. Segregation of duties forbids the submitter from deciding."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "requested_info_items?", "decision_note?"]
    output: DiligenceReview
    side_effects:
      - "PASSED: advances Partner.status IN_DILIGENCE -> DILIGENCE_PASSED and writes Partner.capability_tier and Partner.latest_composite_score"
      - "FAILED: advances Partner.status IN_DILIGENCE -> DILIGENCE_FAILED (terminal) and writes Partner.latest_composite_score"
      - "INFO_REQUESTED: stores requested_info_items and leaves Partner.status at IN_DILIGENCE"
      - "increments Partner.version by 1 on PASSED and FAILED"

  # ---- ProgramAgreement ------------------------------------------------------
  - method: POST
    path: "/oversight/agreements"
    description: "Draft the program agreement: responsibility allocation, oversight rights, audit notice, termination triggers, growth and concentration caps, reserve requirement. OCC-guarded on the partner's version."
    roles: [ProgramOfficer]
    code: 201
    input: [partner_id, kyc_owner, dispute_owner, marketing_owner, oversight_rights_level, audit_access_notice_days, termination_triggers, monthly_growth_cap_pct, concentration_cap_pct, max_end_user_balance_cents, reserve_requirement_bps, effective_date, expected_partner_version]
    output: ProgramAgreement
    side_effects:
      - "creates the ProgramAgreement with status=DRAFT, revision_round=1"
      - "sets created_by_user_id = X-User-ID"
      - "increments Partner.version by 1"

  - method: GET
    path: "/oversight/agreements"
    description: "List program agreements, filterable by partner."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["partner_id?", "status?", "limit?", "offset?"]
    output: ProgramAgreement[]
    side_effects: []

  - method: GET
    path: "/oversight/agreements/{id}"
    description: "Read one program agreement."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: ProgramAgreement
    side_effects: []

  - method: POST
    path: "/oversight/agreements/{id}/submit-for-approval"
    description: "Route the draft agreement to the risk committee."
    roles: [ProgramOfficer]
    code: 200
    input: ["submission_note?"]
    output: ProgramAgreement
    side_effects:
      - "advances ProgramAgreement DRAFT -> PENDING_RISK_APPROVAL and increments version by 1"

  - method: POST
    path: "/oversight/agreements/{id}/risk-decision"
    description: "Risk committee executes or rejects the agreement. EXECUTE creates both custody accounts and contracts the partner; REJECT returns the agreement to DRAFT."
    roles: [RiskCommittee]
    code: 200
    input: [decision, "decision_note?"]
    output: ProgramAgreement
    side_effects:
      - "EXECUTE: sets executed_at, creates the FBO_END_USER and RESERVE CustodyAccount rows, advances Partner.status DILIGENCE_PASSED -> CONTRACTED, then recomputes required_reserve_cents, reserve_shortfall_cents and oversight_posture"
      - "REJECT: returns the agreement to DRAFT and increments revision_round by 1, touching no other entity"
      - "increments ProgramAgreement.version by 1; increments Partner.version by 1 on EXECUTE"

  - method: POST
    path: "/oversight/agreements/{id}/terminate"
    description: "Fire a contracted termination trigger. Moves the partner into wind-down and expires every non-terminal marketing approval."
    roles: [RiskCommittee]
    code: 200
    input: [termination_trigger, notice_days]
    output: ProgramAgreement
    side_effects:
      - "advances ProgramAgreement EXECUTED -> TERMINATED and sets termination_trigger_fired"
      - "advances Partner.status CONTRACTED|LIVE -> WIND_DOWN and increments Partner.version by 1"
      - "moves every MarketingReview for the Partner with status IN {SUBMITTED, CHANGES_REQUESTED, APPROVED} to EXPIRED"

  # ---- MarketingReview -------------------------------------------------------
  - method: POST
    path: "/oversight/marketing-reviews"
    description: "File consumer-facing material for bank review and disclosure approval."
    roles: [FintechPartner, ProgramOfficer]
    code: 201
    input: [partner_id, agreement_id, material_type, placement_channel, disclosure_elements, apr_disclosed, fdic_signage_correct, effective_from, effective_until]
    output: MarketingReview
    side_effects:
      - "creates the MarketingReview with status=SUBMITTED, review_round=1"
      - "sets created_by_user_id = X-User-ID"
      - "computes risk_flags (calculation marketing_risk_flags)"

  - method: GET
    path: "/oversight/marketing-reviews"
    description: "List marketing reviews; the agreement_id filter is the reverse-reachability channel for MarketingReview.agreement_id."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["partner_id?", "agreement_id?", "material_type?", "placement_channel?", "status?", "limit?", "offset?"]
    output: MarketingReview[]
    side_effects: []

  - method: GET
    path: "/oversight/marketing-reviews/{id}"
    description: "Read one marketing review including its computed risk_flags."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: MarketingReview
    side_effects: []

  - method: POST
    path: "/oversight/marketing-reviews/{id}/decide"
    description: "Compliance decision: APPROVE, CHANGES_REQUESTED or REJECT. APPROVE enforces the posture gate, empty risk_flags and the 3-day cooling buffer against other approved windows on the same material type and placement channel."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "change_requests?", "decision_note?"]
    output: MarketingReview
    side_effects:
      - "recomputes risk_flags before evaluating the decision"
      - "APPROVE: advances SUBMITTED -> APPROVED; CHANGES_REQUESTED: advances SUBMITTED -> CHANGES_REQUESTED and stores change_requests; REJECT: advances SUBMITTED -> REJECTED"
      - "sets decided_by_user_id = X-User-ID and increments version by 1"

  - method: POST
    path: "/oversight/marketing-reviews/{id}/resubmit"
    description: "Partner resubmits corrected material after changes were requested; the effective window may be restated."
    roles: [FintechPartner]
    code: 200
    input: [disclosure_elements, apr_disclosed, fdic_signage_correct, effective_from, effective_until]
    output: MarketingReview
    side_effects:
      - "advances CHANGES_REQUESTED -> SUBMITTED, increments review_round by 1, clears change_requests"
      - "recomputes risk_flags and sets created_by_user_id = X-User-ID"
      - "increments version by 1"

  # ---- CustodyAccount --------------------------------------------------------
  - method: GET
    path: "/oversight/custody-accounts"
    description: "List custody accounts. Custody accounts are only ever created as a cascade of agreement execution, so this filtered list is their sole discovery channel."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["partner_id?", "account_type?", "status?", "limit?", "offset?"]
    output: CustodyAccount[]
    side_effects: []

  - method: GET
    path: "/oversight/custody-accounts/{id}"
    description: "Read one custody account including its ledger-derived balance and version (the version an OCC ledger write must quote)."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: CustodyAccount
    side_effects: []

  # ---- SettlementBatch -------------------------------------------------------
  - method: POST
    path: "/oversight/settlement-batches"
    description: "Open a settlement batch for a half-open window; windows for one partner may abut but never overlap."
    roles: [FintechPartner, ProgramOfficer]
    code: 201
    input: [partner_id, window_start, window_end, gross_settlement_cents, interchange_cents, returns_cents, partner_reported_net_cents]
    output: SettlementBatch
    side_effects:
      - "creates the batch with reconciliation_status=UNRECONCILED, funding_status=UNFUNDED, variance_cents=0, variance_adjustment_cents=0"

  - method: GET
    path: "/oversight/settlement-batches"
    description: "List settlement batches, filterable on either state dimension independently."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["partner_id?", "reconciliation_status?", "funding_status?", "limit?", "offset?"]
    output: SettlementBatch[]
    side_effects: []

  - method: GET
    path: "/oversight/settlement-batches/{id}"
    description: "Read one settlement batch including both state dimensions and every computed money field."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []

  - method: POST
    path: "/oversight/settlement-batches/{id}/reconcile"
    description: "Internal audit posts the bank's own net figure; equality lands the batch on MATCHED, any difference opens a variance."
    roles: [InternalAudit, ProgramOfficer]
    code: 200
    input: [bank_reported_net_cents]
    output: SettlementBatch
    side_effects:
      - "sets variance_cents = bank_reported_net_cents - partner_reported_net_cents"
      - "advances reconciliation_status UNRECONCILED -> MATCHED or -> VARIANCE_OPEN"
      - "recomputes Partner.unreconciled_variance_cents, then Partner.oversight_posture; increments Partner.version by 1"
      - "increments SettlementBatch.version by 1"

  - method: POST
    path: "/oversight/settlement-batches/{id}/clear-variance"
    description: "Internal audit books the correction that explains an open variance. Legal on the reconciliation dimension whether or not the batch has already been funded."
    roles: [InternalAudit]
    code: 200
    input: [variance_adjustment_cents, root_cause_note]
    output: SettlementBatch
    side_effects:
      - "stores variance_adjustment_cents, recomputes settlement_base_cents, advances reconciliation_status VARIANCE_OPEN -> VARIANCE_CLEARED"
      - "when funding_status == FUNDED: creates a VARIANCE_ADJUSTMENT LedgerEntry on the RESERVE account and recomputes that account's balance_cents"
      - "recomputes Partner.unreconciled_variance_cents, required_reserve_cents, reserve_shortfall_cents, concentration_ratio_pct, then Partner.oversight_posture"
      - "increments SettlementBatch.version and Partner.version by 1"

  - method: POST
    path: "/oversight/settlement-batches/{id}/fund"
    description: "Pay the batch out of custody. Computes the fee tier on gross, selects the reserve basis from the reconciliation dimension, books three ledger legs and drives the reserve/posture/custody-freeze cascade."
    roles: [ProgramOfficer]
    code: 200
    input: [funding_reference]
    output: SettlementBatch
    side_effects:
      - "computes bank_fee_bps_applied, bank_fee_cents, settlement_base_cents, reserve_funding_cents, net_to_partner_cents, shortfall_carry_cents"
      - "creates the END_USER_DEBIT, RESERVE_FUND and FEE LedgerEntry legs with settlement_batch_id set"
      - "recomputes both CustodyAccount.balance_cents, then Partner.required_reserve_cents / reserve_shortfall_cents / concentration_ratio_pct, then Partner.oversight_posture, then freezes both custody accounts when the posture became FROZEN"
      - "adds net_to_partner_cents to Partner.cumulative_paid_out_cents and bank_fee_cents to Partner.cumulative_bank_fee_cents"
      - "advances funding_status UNFUNDED -> FUNDED, sets funded_at, increments SettlementBatch.version and Partner.version by 1"

  - method: POST
    path: "/oversight/settlement-batches/{id}/clawback"
    description: "Reverse a funded batch. Books one CLAWBACK ledger entry per funding leg and restores every conserved term to its pre-funding value."
    roles: [ProgramOfficer]
    code: 200
    input: [clawback_reason]
    output: SettlementBatch
    side_effects:
      - "creates one CLAWBACK LedgerEntry per funding leg with reversal_of_entry_id set and amount_cents negated"
      - "subtracts net_to_partner_cents from Partner.cumulative_paid_out_cents and bank_fee_cents from Partner.cumulative_bank_fee_cents"
      - "recomputes both CustodyAccount.balance_cents, then Partner.required_reserve_cents / reserve_shortfall_cents / concentration_ratio_pct, then Partner.oversight_posture"
      - "advances funding_status FUNDED -> CLAWED_BACK, leaves funded_at and the computed money fields as the historical record"
      - "increments SettlementBatch.version and Partner.version by 1"

  # ---- LedgerEntry -----------------------------------------------------------
  - method: POST
    path: "/oversight/ledger-entries"
    description: "Book a manual custody movement: end-user credits and debits, reserve funding and release, or a variance adjustment. OCC-guarded on the custody account's version."
    roles: [ProgramOfficer, FintechPartner]
    code: 201
    input: [partner_id, custody_account_id, entry_type, amount_cents, effective_at, expected_custody_account_version, "memo?"]
    output: LedgerEntry
    side_effects:
      - "assigns sequence_no as the next per-custody-account index starting at 1"
      - "recomputes CustodyAccount.balance_cents and increments CustodyAccount.version by 1"
      - "recomputes Partner.required_reserve_cents, Partner.reserve_shortfall_cents and Partner.concentration_ratio_pct for every Partner in the group"
      - "recomputes Partner.oversight_posture; a resulting FROZEN posture freezes both of that Partner's custody accounts"
      - "increments Partner.version by 1"

  - method: GET
    path: "/oversight/ledger-entries"
    description: "List ledger entries. Collapses all four LedgerEntry foreign keys into one filtered list; results are ordered by custody_account_id then sequence_no ASC."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["partner_id?", "custody_account_id?", "settlement_batch_id?", "reversal_of_entry_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/oversight/ledger-entries/{id}"
    description: "Read one ledger entry."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  # ---- Complaint -------------------------------------------------------------
  - method: POST
    path: "/oversight/complaints"
    description: "Intake a consumer complaint from any channel. The response deadline is computed from the channel's SLA basis and the dispute owner is copied from the executed agreement."
    roles: [ProgramOfficer, ComplianceOfficer, FintechPartner]
    code: 201
    input: [partner_id, channel, category, severity, received_at, narrative, is_reg_e_dispute]
    output: Complaint
    side_effects:
      - "creates the Complaint with status=RECEIVED, root_cause_code=null, escalation_count=0"
      - "computes response_due_at (calculation complaint_response_due_at) and handling_owner from the EXECUTED ProgramAgreement.dispute_owner"
      - "increments Partner.total_complaint_count and Partner.open_complaint_count by 1"
      - "recomputes Partner.complaint_rate_bps, then Partner.oversight_posture; increments Partner.version by 1"

  - method: GET
    path: "/oversight/complaints"
    description: "List complaints across all intake channels, filterable by partner, channel, status and root cause."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["partner_id?", "channel?", "status?", "root_cause_code?", "severity?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: GET
    path: "/oversight/complaints/{id}"
    description: "Read one complaint including its computed response deadline and handling owner."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/oversight/complaints/{id}/assign-root-cause"
    description: "Record root-cause analysis. Also the compensating action that brings an escalated complaint back into the open bucket."
    roles: [ComplianceOfficer]
    code: 200
    input: [root_cause_code, investigation_note]
    output: Complaint
    side_effects:
      - "advances RECEIVED|ESCALATED -> ROOT_CAUSE_ASSIGNED and stores root_cause_code"
      - "from ESCALATED: decrements Partner.escalated_complaint_count by 1 and increments Partner.open_complaint_count by 1, then recomputes complaint_rate_bps and oversight_posture"
      - "increments Complaint.version by 1"

  - method: POST
    path: "/oversight/complaints/{id}/disposition"
    description: "Close, escalate or withdraw a complaint."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "resolution_note?", "redress_cents?"]
    output: Complaint
    side_effects:
      - "RESOLVED: sets resolved_at and redress_cents, moves one slot from the open or escalated bucket into the resolved bucket"
      - "ESCALATED: increments escalation_count, moves one slot from the open bucket into the escalated bucket"
      - "WITHDRAWN: sets resolved_at, moves one slot from the open bucket into the withdrawn bucket"
      - "recomputes Partner.complaint_rate_bps then Partner.oversight_posture; increments Partner.version and Complaint.version by 1"

  # ---- TransactionMonitoringAlert --------------------------------------------
  - method: POST
    path: "/oversight/alerts"
    description: "Raise a transaction-monitoring alert against a partner's flow. SANCTIONS_HIT alerts drive the FROZEN posture predicate while open."
    roles: [ComplianceOfficer]
    code: 201
    input: [partner_id, alert_type, triggered_at, transaction_volume_cents, detection_note]
    output: TransactionMonitoringAlert
    side_effects:
      - "creates the alert with disposition=OPEN, sla_breach_count=0 and computes sla_due_at"
      - "recomputes Partner.open_sanctions_alert_count when alert_type == SANCTIONS_HIT"
      - "recomputes Partner.oversight_posture; a resulting FROZEN posture freezes both of that Partner's custody accounts"
      - "increments Partner.version by 1"

  - method: GET
    path: "/oversight/alerts"
    description: "List transaction-monitoring alerts, filterable by partner, type and disposition."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["partner_id?", "alert_type?", "disposition?", "limit?", "offset?"]
    output: TransactionMonitoringAlert[]
    side_effects: []

  - method: GET
    path: "/oversight/alerts/{id}"
    description: "Read one alert including its computed SLA deadline and breach count."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: TransactionMonitoringAlert
    side_effects: []

  - method: POST
    path: "/oversight/alerts/{id}/dispose"
    description: "Move the alert to PARTNER_RESPONSE_PENDING, CLEARED or SAR_FILED."
    roles: [ComplianceOfficer]
    code: 200
    input: [disposition, disposition_note]
    output: TransactionMonitoringAlert
    side_effects:
      - "advances the disposition dimension per §1.2 and sets disposed_by_user_id"
      - "on CLEARED or SAR_FILED for a SANCTIONS_HIT alert: recomputes Partner.open_sanctions_alert_count, then Partner.oversight_posture, then unfreezing is deferred to the next cycle close"
      - "increments version by 1"

  # ---- OversightCycle --------------------------------------------------------
  - method: POST
    path: "/oversight/cycles"
    description: "Open the next oversight epoch. cycle_index is assigned as the current maximum plus one; periods are half-open and must not overlap any existing cycle."
    roles: [ProgramOfficer]
    code: 201
    input: [cycle_label, period_start, period_end]
    output: OversightCycle
    side_effects:
      - "creates the cycle with status=OPEN, cycle_index = max(existing cycle_index) + 1 or 1, and all counters at 0"

  - method: GET
    path: "/oversight/cycles"
    description: "List oversight cycles ordered by cycle_index ASC."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OversightCycle[]
    side_effects: []

  - method: GET
    path: "/oversight/cycles/{id}"
    description: "Read one oversight cycle including every counter written by its close."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: OversightCycle
    side_effects: []

  - method: POST
    path: "/oversight/cycles/{id}/close"
    description: "Ops-run checkpoint. Runs the six normative steps of §1.2 OversightCycle CLOSING -> CLOSED in order: escalate overdue complaints, reopen SLA-breached alerts, recompute every partner's rates/growth/concentration/reserve/posture, apply posture consequences to custody and marketing, complete drained wind-down plans, then write the counters."
    roles: [ProgramOfficer]
    code: 200
    input: ["closing_note?"]
    output: OversightCycle
    side_effects:
      - "advances the cycle OPEN -> CLOSING -> CLOSED and sets closed_at"
      - "escalates overdue Complaint rows; reopens SLA-breached PARTNER_RESPONSE_PENDING alerts"
      - "recomputes complaint_rate_bps, monthly_growth_pct (updating growth_breach_count), concentration_ratio_pct, required_reserve_cents, reserve_shortfall_cents, consecutive_shortfall_cycles and oversight_posture for every Partner with status IN {CONTRACTED, LIVE, WIND_DOWN}, in Partner.created_at ASC order"
      - "freezes or unfreezes custody accounts and expires APPROVED MarketingReview rows per the recomputed posture and effective_until"
      - "completes IN_EXECUTION WindDownPlan rows whose residual_balance_cents == 0, closing custody accounts and advancing those Partners WIND_DOWN -> TERMINATED"
      - "writes partners_frozen_count, marketing_approvals_expired_count, complaints_escalated_count, alerts_reopened_count, growth_breach_partner_count, plans_completed_count"

  # ---- WindDownPlan ----------------------------------------------------------
  - method: POST
    path: "/oversight/wind-down-plans"
    description: "Draft the wind-down plan for a partner already in WIND_DOWN, naming the end-user funds disposition, notice period and milestones."
    roles: [ProgramOfficer]
    code: 201
    input: [partner_id, trigger_reason, end_user_funds_disposition, notice_days, target_completion_date, milestones]
    output: WindDownPlan
    side_effects:
      - "creates the plan with status=DRAFT, revision_round=1 and computes residual_balance_cents"
      - "sets created_by_user_id = X-User-ID"

  - method: GET
    path: "/oversight/wind-down-plans"
    description: "List wind-down plans, filterable by partner."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: ["partner_id?", "status?", "limit?", "offset?"]
    output: WindDownPlan[]
    side_effects: []

  - method: GET
    path: "/oversight/wind-down-plans/{id}"
    description: "Read one wind-down plan including its live residual custody balance."
    roles: [ProgramOfficer, ComplianceOfficer, RiskCommittee, InternalAudit, FintechPartner]
    code: 200
    input: []
    output: WindDownPlan
    side_effects: []

  - method: POST
    path: "/oversight/wind-down-plans/{id}/submit"
    description: "Route the plan to the risk committee."
    roles: [ProgramOfficer]
    code: 200
    input: ["submission_note?"]
    output: WindDownPlan
    side_effects:
      - "advances DRAFT -> PENDING_APPROVAL, recomputes residual_balance_cents, increments version by 1"

  - method: POST
    path: "/oversight/wind-down-plans/{id}/decide"
    description: "Risk committee approves the plan or returns it for revision. Segregation of duties forbids the drafter from approving."
    roles: [RiskCommittee]
    code: 200
    input: [decision, "decision_note?"]
    output: WindDownPlan
    side_effects:
      - "APPROVE: advances PENDING_APPROVAL -> APPROVED and sets approved_by_user_id"
      - "REVISE: returns the plan to DRAFT and increments revision_round by 1"
      - "recomputes residual_balance_cents and increments version by 1"

  - method: POST
    path: "/oversight/wind-down-plans/{id}/execute"
    description: "Begin execution once the notice period has elapsed and every settlement batch is both reconciled and funded."
    roles: [ProgramOfficer]
    code: 200
    input: ["execution_note?"]
    output: WindDownPlan
    side_effects:
      - "advances APPROVED -> IN_EXECUTION, recomputes residual_balance_cents, increments version by 1"

  # ---- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Every deadline, window and trailing-90-day computation reads this clock, never the host wall clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z, which is at or before every default fixture date; the server MUST NOT fall back to real wall-clock time."
    roles: [ProgramOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; performs no recomputation of any entity"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # ---- auth ------------------------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty (validation priority 1)."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the five roles declared in §1.7 (validation priority 2)."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The role is valid but does not appear in the target endpoint's roles list (validation priority 5)."
  - id: ERR_PARTNER_SCOPE_VIOLATION
    http: 403
    condition: "A FintechPartner acts on a resource whose partner_id differs from its X-User-ID (validation priority 12)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The deciding X-User-ID equals the originator recorded on the artefact being decided (validation priority 14)."

  # ---- existence -------------------------------------------------------------
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "No Partner with the given path or body id."
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "No DiligenceReview with the given path id."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No ProgramAgreement with the given path or body id."
  - id: ERR_MARKETING_REVIEW_NOT_FOUND
    http: 404
    condition: "No MarketingReview with the given path id."
  - id: ERR_CUSTODY_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No CustodyAccount with the given path or body id."
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "No SettlementBatch with the given path id."
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "No LedgerEntry with the given path id."
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "No Complaint with the given path id."
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "No TransactionMonitoringAlert with the given path id."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "No OversightCycle with the given path id."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No WindDownPlan with the given path id."

  # ---- schema / referential --------------------------------------------------
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, unrecognised enum member, out-of-range number, over-length string, or pagination limit/offset outside the §1.0 bounds (validation priority 18)."
  - id: ERR_PARTNER_GROUP_CYCLE
    http: 422
    condition: "The supplied parent_partner_id would make the Partner group tree cyclic (validation priority 20)."
  - id: ERR_AGREEMENT_PARTNER_MISMATCH
    http: 409
    condition: "body agreement_id names a ProgramAgreement belonging to a different Partner than body partner_id (validation priority 22)."
  - id: ERR_CUSTODY_PARTNER_MISMATCH
    http: 409
    condition: "body custody_account_id names a CustodyAccount belonging to a different Partner than body partner_id (validation priority 24)."

  # ---- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_PARTNER_VERSION
    http: 412
    condition: "expected_partner_version does not equal the Partner's current version (concurrency rules diligence-create-stale-partner, agreement-create-stale-partner)."
  - id: ERR_STALE_CUSTODY_ACCOUNT_VERSION
    http: 412
    condition: "expected_custody_account_version does not equal the CustodyAccount's current version (concurrency rule ledger-entry-stale-custody-account)."

  # ---- state -----------------------------------------------------------------
  - id: ERR_PARTNER_TERMINAL
    http: 409
    condition: "The Partner's status is DILIGENCE_FAILED or TERMINATED and no child artefact may be created for it (validation priority 32)."
  - id: ERR_REVIEW_NOT_SUBMITTED
    http: 409
    condition: "decide called on a DiligenceReview whose status is not SUBMITTED."
  - id: ERR_REVIEW_NOT_DRAFT_OR_INFO_REQUESTED
    http: 409
    condition: "submit called on a DiligenceReview whose status is not DRAFT or INFO_REQUESTED."
  - id: ERR_AGREEMENT_NOT_DRAFT
    http: 409
    condition: "submit-for-approval called on a ProgramAgreement whose status is not DRAFT."
  - id: ERR_AGREEMENT_NOT_PENDING_APPROVAL
    http: 409
    condition: "risk-decision called on a ProgramAgreement whose status is not PENDING_RISK_APPROVAL."
  - id: ERR_AGREEMENT_NOT_EXECUTED
    http: 409
    condition: "terminate called on a ProgramAgreement whose status is not EXECUTED."
  - id: ERR_MARKETING_NOT_DECIDABLE
    http: 409
    condition: "decide called on a MarketingReview whose status is not SUBMITTED."
  - id: ERR_MARKETING_NOT_CHANGES_REQUESTED
    http: 409
    condition: "resubmit called on a MarketingReview whose status is not CHANGES_REQUESTED."
  - id: ERR_BATCH_NOT_UNRECONCILED
    http: 409
    condition: "reconcile called on a SettlementBatch whose reconciliation_status is not UNRECONCILED."
  - id: ERR_BATCH_NO_OPEN_VARIANCE
    http: 409
    condition: "clear-variance called on a SettlementBatch whose reconciliation_status is not VARIANCE_OPEN."
  - id: ERR_BATCH_ALREADY_FUNDED
    http: 409
    condition: "fund called on a SettlementBatch whose funding_status is not UNFUNDED. Outranks every fiscal check on the same request (validation priority 34 vs 86)."
  - id: ERR_BATCH_NOT_FUNDED
    http: 409
    condition: "clawback called on a SettlementBatch whose funding_status is not FUNDED."
  - id: ERR_BATCH_NOT_RECONCILED
    http: 409
    condition: "fund called while reconciliation_status is UNRECONCILED (validation priority 36)."
  - id: ERR_PARTNER_NOT_LIVE
    http: 409
    condition: "Funding a batch or booking an END_USER_CREDIT while partner.status != LIVE (validation priority 38)."
  - id: ERR_PROGRAM_NOT_READY_FOR_LAUNCH
    http: 409
    condition: "go-live called without exactly one EXECUTED ProgramAgreement or with a custody account not ACTIVE (validation priority 40)."
  - id: ERR_PARTNER_NOT_CONTRACTED
    http: 409
    condition: "go-live called on a Partner whose status is not CONTRACTED."
  - id: ERR_PARTNER_NOT_IN_WIND_DOWN
    http: 409
    condition: "A wind-down operation is attempted while partner.status != WIND_DOWN (validation priority 42)."
  - id: ERR_UNSETTLED_BATCHES_OUTSTANDING
    http: 409
    condition: "execute called while any SettlementBatch for the Partner is UNFUNDED, UNRECONCILED or VARIANCE_OPEN (validation priority 44)."
  - id: ERR_CUSTODY_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "The custody account the operation would move is FROZEN or CLOSED (validation priority 46)."
  - id: ERR_COMPLAINT_NOT_DISPOSABLE
    http: 409
    condition: "assign-root-cause or disposition called from a Complaint status that declares no such transition in §1.2."
  - id: ERR_ALERT_TERMINAL
    http: 409
    condition: "dispose called on a TransactionMonitoringAlert already CLEARED or SAR_FILED."
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "close called on an OversightCycle whose status is not OPEN, or another cycle is already CLOSING."
  - id: ERR_PLAN_NOT_DRAFT
    http: 409
    condition: "submit called on a WindDownPlan whose status is not DRAFT."
  - id: ERR_PLAN_NOT_PENDING_APPROVAL
    http: 409
    condition: "decide called on a WindDownPlan whose status is not PENDING_APPROVAL."
  - id: ERR_PLAN_NOT_APPROVED
    http: 409
    condition: "execute called on a WindDownPlan whose status is not APPROVED."

  # ---- business_safety -------------------------------------------------------
  - id: ERR_POSTURE_BLOCKS_MARKETING
    http: 403
    condition: "Marketing filing, resubmission or approval attempted while oversight_posture is RESTRICTED or FROZEN (validation priority 50)."
  - id: ERR_POSTURE_BLOCKS_INFLOW
    http: 403
    condition: "END_USER_CREDIT attempted while oversight_posture is FROZEN (validation priority 52)."
  - id: ERR_DISCLOSURE_INCOMPLETE
    http: 422
    condition: "APPROVE attempted while the recomputed risk_flags array is non-empty (validation priority 54)."
  - id: ERR_COMPLIANCE_CAPABILITY_FLOOR
    http: 422
    condition: "PASSED attempted with compliance_capability_score < 60 (validation priority 56)."
  - id: ERR_DILIGENCE_SCORE_BELOW_FLOOR
    http: 422
    condition: "PASSED attempted with composite_score < 55.0 (validation priority 57)."
  - id: ERR_ROOT_CAUSE_REQUIRED
    http: 409
    condition: "RESOLVED attempted on a Complaint with root_cause_code == null (validation priority 58)."
  - id: ERR_TERMINATION_TRIGGER_NOT_CONTRACTED
    http: 422
    condition: "The cited termination trigger or plan trigger_reason is absent from agreement.termination_triggers (validation priority 59)."

  # ---- business_temporal -----------------------------------------------------
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "An interval's end precedes or equals its start where strict ordering is required (validation priority 60)."
  - id: ERR_SETTLEMENT_WINDOW_OVERLAP
    http: 409
    condition: "A new half-open settlement window intersects an existing one for the same Partner; abutting endpoints are accepted (validation priority 62)."
  - id: ERR_DISCLOSURE_WINDOW_CONFLICT
    http: 409
    condition: "An approval's closed window sits within 3 days of another APPROVED review's closed window on the same partner, material_type and placement_channel (validation priority 63)."
  - id: ERR_CYCLE_PERIOD_OVERLAP
    http: 409
    condition: "A new cycle period intersects an existing cycle period (validation priority 64)."
  - id: ERR_TIMESTAMP_IN_FUTURE
    http: 422
    condition: "Complaint.received_at or TransactionMonitoringAlert.triggered_at exceeds the logical clock (validation priority 66)."
  - id: ERR_EFFECTIVE_DATE_IN_PAST
    http: 422
    condition: "ProgramAgreement.effective_date precedes the logical clock at creation (validation priority 67)."
  - id: ERR_CYCLE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "close called while cycle.period_end exceeds the logical clock (validation priority 68)."
  - id: ERR_WIND_DOWN_NOTICE_NOT_ELAPSED
    http: 409
    condition: "notice_days below 30, target_completion_date inside the notice window, or execute called before the notice period elapsed (validation priority 69)."

  # ---- business_constraint ---------------------------------------------------
  - id: ERR_DILIGENCE_ALREADY_OPEN
    http: 409
    condition: "A DiligenceReview with status IN {DRAFT, SUBMITTED, INFO_REQUESTED} already exists for the Partner (validation priority 70)."
  - id: ERR_AGREEMENT_ALREADY_OPEN
    http: 409
    condition: "A ProgramAgreement with status IN {DRAFT, PENDING_RISK_APPROVAL, EXECUTED} already exists for the Partner (validation priority 71)."
  - id: ERR_PLAN_ALREADY_OPEN
    http: 409
    condition: "A WindDownPlan with status IN {DRAFT, PENDING_APPROVAL, APPROVED, IN_EXECUTION} already exists for the Partner (validation priority 72)."
  - id: ERR_LEDGER_SIGN_MISMATCH
    http: 422
    condition: "amount_cents sign contradicts entry_type, amount_cents is 0, or entry_type does not match the custody account's account_type (validation priority 73)."
  - id: ERR_NO_OPEN_CYCLE
    http: 409
    condition: "LedgerEntry.effective_at falls outside every OPEN OversightCycle period (validation priority 74)."
  - id: ERR_VARIANCE_NOT_EXPLAINED
    http: 422
    condition: "variance_adjustment_cents does not close the gap between partner_reported_net_cents and bank_reported_net_cents (validation priority 75)."

  # ---- business_fiscal -------------------------------------------------------
  - id: ERR_CUSTODY_INSUFFICIENT_FUNDS
    http: 409
    condition: "The movement would drive a CustodyAccount.balance_cents below 0 (validation priority 80)."
  - id: ERR_END_USER_BALANCE_CAP_EXCEEDED
    http: 409
    condition: "The post-credit FBO_END_USER balance would exceed agreement.max_end_user_balance_cents; exactly equal is accepted (validation priority 82)."
  - id: ERR_CONCENTRATION_CAP_BREACH
    http: 409
    condition: "The recomputed group concentration_ratio_pct would be >= agreement.concentration_cap_pct; exactly equal is a breach (validation priority 84)."
  - id: ERR_RESERVE_SHORTFALL_BLOCKS_FUNDING
    http: 402
    condition: "fund attempted while partner.reserve_shortfall_cents > 0 (validation priority 86)."

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
