            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { ca: $.data.id } }
          trigger:
            - { call: "POST /coverage-assignments/${ca}/acknowledge", payload: {}, as: AthleticTrainer, as_user_id: "${tr2}", captures: { err1: $.data.error_id } }
            - { call: "POST /coverage-assignments/${ca}/acknowledge", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ca_s: $.data.status, ca_ack: $.data.acknowledged_at } }
            - { call: "POST /coverage-assignments/${ca}/decline", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err2: $.data.error_id } }
          assert:
