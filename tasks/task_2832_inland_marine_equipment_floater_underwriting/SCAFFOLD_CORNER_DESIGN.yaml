      - name: corner_loss_of_use_only_on_rented_leased_parts
        claim_type: Violation → Error
        grounds:
          - validations[priority=61]
          - errors[ERR_LOSS_OF_USE_NOT_COVERED]
          - calculations.claim_settlement_amount
          - endpoints[POST /inland-marine/claims/{id}/adjust]
