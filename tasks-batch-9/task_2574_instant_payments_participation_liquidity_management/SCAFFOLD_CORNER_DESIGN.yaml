        distinguishing_aspect: "THROTTLED_PER_TXN_CAP_CENTS (50,000,000) overrides the governing policy's much larger per-transaction limit whenever the posture is THROTTLED, so an amount of 60,000,000 that passes the policy check at priority 92 is still refused at priority 93 - and an amount of exactly 50,000,000 is admitted because the cap comparison is 'must not exceed'."
