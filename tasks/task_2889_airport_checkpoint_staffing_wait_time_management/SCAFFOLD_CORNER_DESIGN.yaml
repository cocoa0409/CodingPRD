              as: DutyManager
              captures: { sh_obs2: $.data.published_wait_minutes_snapshot }
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 300, measurement_method: "STAFF_ESTIMATE", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { sh_obs3: $.data.published_wait_minutes_snapshot }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T11:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: PlatformAdmin
              captures: { sh_band_admin: $.data.id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T11:30:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { sh_band_planner: $.data.id }
            - call: "POST /lane-assignments/${asg1_id}/duty"
