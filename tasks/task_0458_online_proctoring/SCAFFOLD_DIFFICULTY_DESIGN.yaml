              captures: { esc_v: $.data.version }
          trigger:
            - call: "POST /escalations/${esc_id}/decide"
              payload: { verdict: "DISMISSED", expected_escalation_version: "${esc_v}" }
              as: ReviewOfficer
              as_user_id: "${officer_id}"
              captures: { final_status: $.data.status }
          assert:
            - "ProctoringSession.${sess_id}.status == ACTIVE after the dismiss (returned to ACTIVE a second time)"
            - "Escalation.${esc_id}.status == DISMISSED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: uphold_voids_session_consumes_appointment_recomputes_proctor_load
        grounds:
          - state_machines.Escalation.UNDER_REVIEW_to_UPHELD
          - state_machines.ProctoringSession.REVIEW_HELD_to_VOIDED
          - state_machines.Appointment.CHECKED_IN_to_CONSUMED
          - entities.Proctor.fields.load_factor
        distinguishing_aspect: |
          Depth-3 cascade originating at escalation decide: decide(UPHELD) mutates the Escalation, which itself
          drives the ProctoringSession REVIEW_HELD -> VOIDED, which itself drives the Appointment -> CONSUMED and
          the Proctor.load_factor recompute — each hop caused by the prior hop, not by the decide call directly.
        test_recipe:
          setup:
            - "One REVIEW_HELD session (cap 4, single LIVE session so load was 0.2500) under an UNDER_REVIEW escalation claimed by a separate officer."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst G" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Opener G", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { opener_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Officer G", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { officer_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand G", email: "g@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Casc Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${opener_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/flags"
              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { flag_id: $.data.id }
            - call: "POST /escalations"
              payload: { session_id: "${sess_id}", incident_flag_id: "${flag_id}" }
              as: Proctor
              as_user_id: "${opener_id}"
              captures: { esc_id: $.data.id }
            - call: "POST /escalations/${esc_id}/claim"
              payload: {}
              as: ReviewOfficer
              as_user_id: "${officer_id}"
              captures: { esc_v: $.data.version }
          trigger:
            - call: "POST /escalations/${esc_id}/decide"
              payload: { verdict: "UPHELD", expected_escalation_version: "${esc_v}" }
              as: ReviewOfficer
              as_user_id: "${officer_id}"
          assert:
            - "ProctoringSession.${sess_id}.status == VOIDED (hop 1->2)"
            - "Appointment.${appt_id}.status == CONSUMED (hop 2->3)"
            - "Proctor.${opener_id}.load_factor == 0.0000 (hop 3 recompute; voided session no longer counted)"

      - name: auto_void_on_flag_consumes_appointment
        grounds:
          - state_machines.ProctoringSession.ACTIVE_to_VOIDED
          - state_machines.Appointment.CHECKED_IN_to_CONSUMED
          - calculations.session_integrity_score
          - entities.ProctoringSession.fields.void_reason
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (POST /sessions/{id}/flags): raising a CRITICAL+MAJOR flag set
          drops integrity_score to 45 (< 50), which itself drives session -> VOIDED (AUTO_THRESHOLD), which itself
          drives appointment -> CONSUMED — a distinct propagation origin from the escalation cascade above.
        test_recipe:
          setup:
            - "One ACTIVE session; raise a CRITICAL flag then a MAJOR flag (penalty 55, score 45 < 50)."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst H" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
