        distinguishing_aspect: "claimed_amount_cents == 0 violates the fiscal floor: ERR_INVALID_AMOUNT (422)."
        test_recipe:
          setup: ["eligible account with a PAID item"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB ZA", routing_number: "222000033" }
