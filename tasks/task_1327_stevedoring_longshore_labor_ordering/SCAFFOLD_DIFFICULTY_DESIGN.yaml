  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: gang_order_create_requires_open_shift
        grounds:
          - validations[priority=6]
          - state_machines.ShiftWindow.PLANNED_to_OPEN_FOR_ORDERS
        distinguishing_aspect: |
          Pair GangOrder -> ShiftWindow: creating a gang order against a PLANNED shift
          fails with ERR_SHIFT_NOT_OPEN_FOR_ORDERS; after the shift's own transition to
          OPEN_FOR_ORDERS the identical request succeeds — the dependency is on the
          sibling entity's state, not on anything in the payload.
