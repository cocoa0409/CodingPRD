              captures: { b106: $.data.band_result, d106: $.data.deviation_ratio, s106: $.data.feature_score }
          assert:
            - "the 90 um measurement has band_result == IN_SPEC and deviation_ratio == 0.000000"
            - "the 91 um measurement has band_result == REWORKABLE and deviation_ratio == 0.020000"
            - "the 105 um measurement has band_result == REWORKABLE"
            - "the 106 um measurement has band_result == OUT_OF_SPEC, deviation_ratio == 0.320000 and feature_score == 68.000000"
            - "the four measurements carry sequence_no 1, 2, 3 and 4 in creation order"

      - name: iso_velocity_zone_floor_inclusive_at_four_point_five
        grounds:
          - calculations.vibration_zone_classification
          - entities.VibrationReading.fields.iso_zone
          - constants ZONE_D_FLOOR in calculations.vibration_zone_classification
        distinguishing_aspect: |
          Boundary metric 2 — a different metric on a different endpoint
          (POST /shop/vibration-readings): overall velocity 4.50 mm/s lands in
          zone D because the floor is inclusive, while 4.49 mm/s lands in zone C
          and 2.80 mm/s lands in zone C rather than B.
        test_recipe:
          setup:
            - "One customer asset to hang route readings on. No order, inspection or core is required."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Edge Works", account_code: "EDG-002" }
              as: ShopAdmin
