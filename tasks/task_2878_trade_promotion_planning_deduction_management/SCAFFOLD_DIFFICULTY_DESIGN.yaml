            - "Promotion.${promo_id}.gross_accrued_amount == 2500.00 (unchanged) and reversed_accrual_amount == 2500.00"
            - "Promotion.${promo_id}.accrued_balance == 0.00 and consumed_deduction_amount == 0.00, so the identity 2500.00 == 2500.00 + 0.00 + 0.00 holds"
            - "Promotion.${promo_id}.recognized_spend_amount == 0.00, spend_ratio == 0.0000, spend_status == WITHIN_BUDGET"
            - "BudgetAllocation.${alloc_id}.accrued_amount == 0.00, committed_amount == 2500.00 (the commitment is untouched by accrual reversal), available_amount == 97500.00"
            - "GET /trade-marketing/accruals?promotion_id=${promo_id} returns total_count 2 — both the ACCRUAL and its REVERSAL twin remain visible"

      - name: promotion_withdrawal_restores_the_allocation_unit_identity
        conserved_quantity: "incremental volume units — planned_incremental_units == committed_units + unreserved_units"
        grounds:
          - calculations.allocation_ledger_rollup
          - state_machines.Promotion.lifecycle_status
          - state_machines.PromotionTactic.status
          - entities.BudgetAllocation.fields.unreserved_units
        distinguishing_aspect: |
          A different conserved quantity from the accrual instance — volume units rather than
          dollars — and a different compensating action. Approving the promotion reserves 8000 of
          the allocation's 20000 incremental units and 10200.00 of its 100000.00 dollars;
          withdrawing it must return committed_units to 0, unreserved_units to 20000 and
          available_amount to exactly the original planned_amount, with the unit identity holding
          at every step (20000 == 8000 + 12000 mid-flight, 20000 == 0 + 20000 after). The
          conditional cascade must also be observable: the tactic is CANCELLED, which drops it
          out of the PLANNED/ACTIVE/COMPLETED input set so the promotion's own
          tactic_subtotal_amount, off_invoice_allowance_amount, planned_total_spend and
          committed_units all fall to zero. An implementation that only flips
          lifecycle_status to WITHDRAWN leaves 8000 units stranded and permanently shrinks the
          allocation's spendable capacity; one that recomputes dollars but forgets units breaks
          the identity in the other direction.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01."
            - "One program, brand and customer; one APPROVED allocation with planned_amount 100000.00 and planned_incremental_units 20000, so committed_amount is 0.00, available_amount 100000.00, committed_units 0 and unreserved_units 20000."
            - "One promotion, window 2026-08-03 -> 2026-08-31, with one TPR tactic of 8000 cases at rate_per_case 1.25 (subtotal 10000.00, allowance 200.00, planned_total_spend 10200.00, committed_units 8000), submitted and APPROVED."
            - "No activation run and no accrual, so gross_accrued_amount stays 0.00 and the withdraw precondition is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 5000000.00, accrual_method_default: "SHIPMENT" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Cancelled Fall Event", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "SHIPMENT", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 8000, window_start: "2026-08-03", window_end: "2026-08-31", rate_per_case: 1.25 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { tactic_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/submit"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /trade-marketing/promotions/${promo_id}/withdraw"
              payload: { withdraw_reason: "Retailer cancelled the event before it started" }
              as: KeyAccountManager
              as_user_id: "kam-1"
          assert:
            - "mid-flight, immediately after approve: BudgetAllocation.${alloc_id}.committed_amount == 10200.00, available_amount == 89800.00, committed_units == 8000, unreserved_units == 12000, and 20000 == 8000 + 12000"
            - "after withdraw: Promotion.${promo_id}.lifecycle_status == WITHDRAWN"
            - "after withdraw: PromotionTactic.${tactic_id}.status == CANCELLED"
            - "after withdraw: Promotion.${promo_id}.tactic_subtotal_amount == 0.00, allowance_rate == 0.000, off_invoice_allowance_amount == 0.00, planned_total_spend == 0.00, committed_units == 0"
            - "after withdraw: BudgetAllocation.${alloc_id}.committed_units == 0 and unreserved_units == 20000, so 20000 == 0 + 20000 — no units are stranded"
            - "after withdraw: BudgetAllocation.${alloc_id}.committed_amount == 0.00 and available_amount == 100000.00, exactly the pre-approval planned_amount"
            - "after withdraw: Promotion.${promo_id}.spend_ratio == 0.0000 and spend_status == WITHIN_BUDGET (planned_total_spend is 0.00, so the ratio is defined as 0.0000 rather than a division by zero)"
            - "TradeProgram.${prog_id}.allocated_amount == 100000.00 (withdrawal frees allocation capacity, not program capacity)"
