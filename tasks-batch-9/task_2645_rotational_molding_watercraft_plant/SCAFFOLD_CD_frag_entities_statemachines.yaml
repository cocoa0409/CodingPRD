            - "start-oven on the already DEMOLDED CYC-DONE: 409 ERR_CYCLE_INVALID_STATE — DEMOLDED is a terminal state with no outbound edges"
            - "outfit on the DEMOLDED hull: 409 ERR_UNIT_INVALID_BUILD_STATE — the build axis requires TRIMMED, and trim has not been run"
            - "inspect on the DEMOLDED hull: 409 ERR_UNIT_INVALID_BUILD_STATE — six valid measurement points are supplied, so this is NOT ERR_INSUFFICIENT_MEASUREMENTS"
            - "release-storage on the UNALLOCATED hull: 409 ERR_UNIT_INVALID_LOGISTICS_STATE — the logistics axis rejects it independently of the build axis"
