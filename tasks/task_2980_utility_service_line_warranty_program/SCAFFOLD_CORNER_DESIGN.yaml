          setup:
            - "An ACTIVE enrollment (version 2) with one APPROVED claim dispatched manually to a contractor billing 18000 cents an hour, so one open dispatch holds a 228000 provisional reservation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
