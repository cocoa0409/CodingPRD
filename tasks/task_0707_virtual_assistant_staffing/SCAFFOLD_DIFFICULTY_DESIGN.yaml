            - "RetainerCycle.${cyc}.consumed_hours == 4"
            - "RetainerCycle.${cyc}.available_hours == 6"

      # --- 9.B engagement-count conservation across a replacement (different conserved quantity)
      - name: replacement_conserves_total_active_engagement_count
        grounds:
          - state_machines.Escalation.OPEN_to_REPLACED
          - state_machines.Engagement.ACTIVE_to_ENDED
          - entities.VirtualAssistant.fields.active_engagement_count
          - entities.Client.fields.active_engagement_id
