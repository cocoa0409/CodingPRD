            - { call: "POST /eqip/applicants", payload: { legal_name: "B Two", hu_category: "NONE", parcel_ids: ["P-101"] }, as: ProgramAdmin, captures: { ab: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${aa}", parcel_id: "P-100", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 30 } }, as: Applicant, as_user_id: "${aa}", captures: { appa: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${ab}", parcel_id: "P-101", planned_practices: [ { practice_code: "FENCE", quantity: 300 } ], self_reported_answers: { SOIL_HEALTH: 20 } }, as: Applicant, as_user_id: "${ab}", captures: { appb: $.data.id } }
            - { call: "POST /eqip/applications/${appa}/submit", payload: {}, as: Applicant, as_user_id: "${aa}" }
            - { call: "POST /eqip/applications/${appb}/submit", payload: {}, as: Applicant, as_user_id: "${ab}" }
            - { call: "POST /eqip/applications/${appa}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 30 } }, as: ConservationPlanner }
            - { call: "POST /eqip/applications/${appb}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 20 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${appa}" }, as: ConservationPlanner, captures: { cona: $.data.id } }
            - { call: "POST /eqip/contracts/${cona}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner }
            - { call: "POST /eqip/contracts/${cona}/obligate", payload: {}, as: ProgramAdmin }
