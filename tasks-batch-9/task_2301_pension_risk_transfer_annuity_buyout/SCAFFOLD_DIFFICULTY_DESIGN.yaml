            - "hop 7: PensionPlan.${plan_id}.accounting_funded_status_bp == 9007, down from 9035 — a participant grievance moved the plan-level funded status"
            - "PensionPlan.${plan_id}.plan_status == RESIDUAL, set when the only tranche settled"

      - name: window_settlement_cascades_elections_participants_plan_then_residual
        grounds:
          - state_machines.LumpSumWindow.CLOSED_to_SETTLED
          - state_machines.ParticipantElection.ELECTED_LUMP_SUM_to_PAID
          - state_machines.ParticipantRecord.IN_PLAN_to_SETTLED_LUMP_SUM
          - state_machines.PensionPlan.SETTLEMENT_AUTHORIZED_to_RESIDUAL
          - state_machines.DeRiskingStrategy.APPROVED_to_EXECUTED
          - calculations.funded_status_measurement
        distinguishing_aspect: |
          A single sponsor call on the window fans out one level and then bubbles
          up three: hop 1 pays both ELECTED_LUMP_SUM elections, hop 2 moves both
          ParticipantRecords IN_PLAN -> SETTLED_LUMP_SUM, hop 3 rewrites the plan's
          total_liability_cents / plan_assets_cents / participant_liability_total_cents
          / accounting_funded_status_bp, and hop 4 auto-transitions the plan
          SETTLEMENT_AUTHORIZED -> RESIDUAL, which itself drives hop 5, the APPROVED
          DeRiskingStrategy to EXECUTED. Crucially the liability leaving the plan
          (13752000, the accounting PBO) and the cash leaving the plan (14310000,
          the net lump sums) are DIFFERENT numbers, so the funded status moves in a
          direction no single-figure implementation reproduces: 9200 bp -> 9008 bp,
          i.e. paying out cash to shed liability made the plan LESS funded.
