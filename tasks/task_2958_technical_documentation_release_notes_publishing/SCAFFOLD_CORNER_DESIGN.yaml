      - name: authoring_and_review_gate_rejections_swept_in_one_lifecycle
        claim_type: error_triggerable
        grounds: ["errors.ERR_NO_REVISIONS", "errors.ERR_TOPIC_NOT_IN_REVIEW", "errors.ERR_NOT_ASSIGNED_WRITER", "errors.ERR_TERMINOLOGY_BLOCKER_PRESENT", "errors.ERR_TOPIC_ALREADY_IN_REVIEW", "errors.ERR_NO_NEW_REVISION", "state_machines.Topic.review_state"]
        distinguishing_aspect: "Six distinct gate errors are reachable only from six distinct points of ONE topic's lifecycle, and their order proves they are separate rules: no revisions, then not-in-review, then wrong writer, then a live BLOCKER, then already-in-review, and finally no-new-revision from CHANGES_REQUESTED — a state ERR_TOPIC_ALREADY_IN_REVIEW would otherwise mask."
        test_recipe:
          setup:
            - "One PLANNED train (posture OPEN, so the posture gate never fires), one ACTIVE BLOCKER term 'login', writer Anna assigned to the plan item, writer Ben assigned to nothing, and one ENGINEERING reviewer."
            - "One topic under Anna's plan item with no revisions yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
            - call: "POST /terminology-terms"
              payload: { term: "login", preferred_form: "sign-in", forbidden_forms: ["log in", "logon"], enforcement_severity: "BLOCKER" }
              as: DocsLead
              captures: { term_id: "$.data.id" }
            - call: "POST /writers"
              payload: { person_key: "w-anna", full_name: "Anna Reyes", seniority_tier: "SENIOR", capacity_points: 40.0 }
              as: DocsLead
              captures: { w_a: "$.data.id" }
            - call: "POST /writers"
              payload: { person_key: "w-ben", full_name: "Ben Ortiz", seniority_tier: "SENIOR", capacity_points: 40.0 }
              as: DocsLead
              captures: { w_b: "$.data.id" }
            - call: "POST /reviewers"
              payload: { person_key: "r-erin", full_name: "Erin Cole", discipline: "ENGINEERING" }
              as: DocsLead
              captures: { rv_e: "$.data.id" }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-a", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: "$.data.id" }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w_a}", window_start_date: "2026-08-03", window_end_date: "2026-08-17" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-feature-a", title: "Feature A guide" }
              as: Writer
              as_user_id: "${w_a}"
              captures: { t_id: "$.data.id" }
          trigger:
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w_a}"
              captures: { e_norev: "$.data.error_id" }
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_e}" }
              as: DocsLead
              captures: { e_notinreview: "$.data.error_id" }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 500, used_terms: [], summary: "Ben tries to write on Anna's topic" }
              as: Writer
              as_user_id: "${w_b}"
              captures: { e_notassigned: "$.data.error_id" }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1200, used_terms: ["logon"], summary: "Anna first draft with a forbidden form" }
              as: Writer
              as_user_id: "${w_a}"
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w_a}"
              captures: { e_blocker: "$.data.error_id" }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1250, used_terms: ["sign-in"], summary: "Anna second draft using the preferred form" }
              as: Writer
              as_user_id: "${w_a}"
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w_a}"
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w_a}"
              captures: { e_already: "$.data.error_id" }
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_e}" }
              as: DocsLead
              captures: { so_e: "$.data.id" }
            - call: "POST /sign-offs/${so_e}/decide"
              payload: { decision: "CHANGES_REQUESTED", comment: "Add the migration caveat" }
              as: Reviewer
              as_user_id: "${rv_e}"
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w_a}"
              captures: { e_nonew: "$.data.error_id" }
          assert:
            - "${e_norev} == ERR_NO_REVISIONS with HTTP 409 (current_revision_number was 0)"
            - "${e_notinreview} == ERR_TOPIC_NOT_IN_REVIEW with HTTP 409 — sign-offs cannot be requested for a NOT_SUBMITTED topic"
            - "${e_notassigned} == ERR_NOT_ASSIGNED_WRITER with HTTP 403 and Topic.${t_id}.current_revision_number is still 0"
            - "${e_blocker} == ERR_TERMINOLOGY_BLOCKER_PRESENT with HTTP 409 while Topic.${t_id}.open_blocker_violations == 1"
            - "the clean second revision leaves Topic.${t_id}.current_revision_number == 2 and open_blocker_violations == 0, and the following submit-review returns 200 with review_state PENDING_SIGNOFF and last_submitted_revision_number == 2"
            - "${e_already} == ERR_TOPIC_ALREADY_IN_REVIEW with HTTP 409"
            - "after the CHANGES_REQUESTED decision, ${e_nonew} == ERR_NO_NEW_REVISION with HTTP 409 — current_revision_number 2 is not greater than last_submitted_revision_number 2, and this error is only observable from CHANGES_REQUESTED"

      - name: plan_item_and_train_state_gate_rejections_swept_together
