  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_citizen_beats_precinct_full
        grounds:
          - validations[priority=8]
          - validations[priority=18]
          - errors[ERR_NOT_CITIZEN]
          - errors[ERR_PRECINCT_FULL]
        distinguishing_aspect: |
          A non-citizen registration whose only matching precinct is also FULL fails BOTH the
          business_constraint citizenship check (priority 8) and the business_fiscal capacity check
          (priority 18); the lower priority number wins -> ERR_NOT_CITIZEN, not ERR_PRECINCT_FULL.
          Pair: business_constraint vs business_fiscal.
        test_recipe:
          setup:
            - "Precinct max_registrations=1 already filled by another ACTIVE registration (posture FULL); a PENDING registration with is_citizen=false matching that precinct."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 1 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "B", last_name: "B", national_id: "N2", is_citizen: false, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 20 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /registrations/${r2_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_CITIZEN"
            - "VoterRegistration.${r2_id}.status == PENDING"

      - name: invalid_state_beats_segregation_on_recount_pass
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Submitting a recount MACHINE pass on a CERTIFIED (terminal) RecountCase by the same
          Canvasser who recorded the precinct tally violates BOTH the state precondition (priority 4)
          and segregation of duties (priority 5); the state check wins -> ERR_INVALID_STATE.
          Pair: state vs business_safety.
        test_recipe:
          setup:
            - "A CERTIFIED RecountCase on a TALLIED precinct whose tally was recorded by canvasser-tally-1; the trigger reuses canvasser-tally-1 (a segregation conflict)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 50 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /precincts/${p_id}/tally"
              payload: { reported_vote_count: 100 }
              as: Canvasser
              as_user_id: "canvasser-tally-1"
            - call: "POST /recount-cases"
              payload: { election_id: "${e_id}", precinct_id: "${p_id}" }
              as: ElectionAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /recount-cases/${rc_id}/submit-pass"
              payload: { pass: "MACHINE", count: 100 }
              as: Canvasser
              as_user_id: "canvasser-recount-2"
            - call: "POST /recount-cases/${rc_id}/submit-pass"
              payload: { pass: "HAND", count: 100 }
              as: Canvasser
              as_user_id: "canvasser-recount-2"
            - call: "POST /recount-cases/${rc_id}/transition"
              payload: { target_status: "CERTIFIED" }
              as: ElectionAdmin
          trigger:
            - call: "POST /recount-cases/${rc_id}/submit-pass"
              payload: { pass: "MACHINE", count: 100 }
              as: Canvasser
              as_user_id: "canvasser-tally-1"
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "RecountCase.${rc_id}.status == CERTIFIED"

