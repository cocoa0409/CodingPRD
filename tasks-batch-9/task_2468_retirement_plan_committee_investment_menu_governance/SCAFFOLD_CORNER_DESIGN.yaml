        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology_flat
          - validations.priority_35
          - errors.ERR_CROSS_PLAN_REFERENCE
        distinguishing_aspect: "With a flat topology the plan scope lives in FK columns, not in the URL: an EMERGING_MKTS fund registered under a second plan is refused for a matching EMERGING_MKTS slot on the first plan with 422 ERR_CROSS_PLAN_REFERENCE at priority 35 — before the asset-class check at 56 could ever pass it."
        test_recipe:
          setup:
            - "Full menu from L3."
            - "The first three trigger calls are preparation: a second plan, an EMERGING_MKTS fund owned by that second plan, and an empty EMERGING_MKTS slot on the first plan."
