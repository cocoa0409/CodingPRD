              as: Dispatcher
              captures: { stale_v: $.data.version }
            - call: "POST /assignments"
              payload: { reservation_id: "${res}", chauffeur_id: "${drv}", vehicle_id: "${veh}", expected_reservation_version: "${stale_v}" }
              as: Dispatcher
