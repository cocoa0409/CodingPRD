              as: Attendant
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INSUFFICIENT_POINTS (402)"

      - name: reload_over_cap_active_card
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_CARD_BALANCE_CAP_EXCEEDED]"]
        distinguishing_aspect: "A reload that would push chip_balance above 100000 on an ACTIVE card returns ERR_CARD_BALANCE_CAP_EXCEEDED (422)."
        test_recipe:
          setup: ["An ACTIVE card reloaded to 96000."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "cap@x.com", full_name: "Cap" }
