  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: trainer_cannot_record_milestone_for_other_trainers_dog_returns_403
        claim_type: role_denial
        grounds: ["validations[priority=4]", "errors[ERR_OWNERSHIP_SCOPE]", "roles[Trainer]"]
        distinguishing_aspect: "Entity-backed Trainer scoping: certified trainer T2 recording a milestone on a dog whose primary_trainer_id is T1 gets ERR_OWNERSHIP_SCOPE; T1 succeeds — the same endpoint behaves per ownership."
        test_recipe:
          setup: ["dog IN_ADVANCED_TRAINING with primary trainer T1; second certified trainer T2 exists"]
          setup_api_calls:
            - { call: "POST /api/trainers", payload: { full_name: "Trainer One", pat_certified: false }, as: ProgramAdmin, captures: { t1_id: $.data.id } }
