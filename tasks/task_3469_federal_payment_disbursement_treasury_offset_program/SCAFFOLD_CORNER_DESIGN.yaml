            - call: "POST /refund-claims/${claim_1}/decide"
              payload: { decision: "DENY" }
              as: RefundOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /refund-claims/${claim_1}/appeal"
              payload: {}
              as: TreasuryOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the first appeal succeeded: status APPEALED with appeal_count == 1"
            - "the second appeal is 409 with error_id == ERR_APPEAL_LIMIT_REACHED (appeal_count 1 blocks further appeals)"
            - "RefundClaim.${claim_1}.status remains DENIED"

      - name: duplicate_registry_codes_return_conflict
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUPLICATE_CREDITOR_CODE
          - errors.ERR_DUPLICATE_AGENCY_CODE
          - validations[priority=10]
        distinguishing_aspect: "Registry codes are unique per registry: a second creditor_code IRS-7469 is 409 ERR_DUPLICATE_CREDITOR_CODE and a second collection agency_code PCA-A is 409 ERR_DUPLICATE_AGENCY_CODE — the two uniqueness scopes do not interfere."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Creditor IRS-7469 and collection agency PCA-A already registered."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - call: "POST /collection-agencies"
              payload: { agency_code: "PCA-A", name: "Pioneer Collections", capacity_max_active: 5 }
              as: TreasurySupervisor
          trigger:
            - call: "POST /creditor-agencies"
              payload: { creditor_code: "IRS-7469", legal_name: "Impostor Bureau", creditor_type: "FEDERAL" }
              as: TreasurySupervisor
              captures: { err_1: $.data.error_id }
            - call: "POST /collection-agencies"
              payload: { agency_code: "PCA-A", name: "Pioneer Again", capacity_max_active: 3 }
              as: TreasurySupervisor
              captures: { err_2: $.data.error_id }
          assert:
            - "409 with err_1 == ERR_DUPLICATE_CREDITOR_CODE"
            - "409 with err_2 == ERR_DUPLICATE_AGENCY_CODE"

      - name: collection_action_field_conditionals
        claim_type: Violation → Error
        grounds:
          - entities.CollectionAction.fields.notice_sent_at
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "The action-type field set is conditional and bidirectional: AWG without notice_sent_at is a 400 ERR_INVALID_REQUEST, and CROSS_SERVICING carrying notice_sent_at is also a 400 — schema validation fires before the agency selector would even run."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Federal creditor with ACTIVE 50000-cent debt. No collection agency is registered (proving schema validation precedes the selector)."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - *k_debt50
            - *k_debt50_act
          trigger:
            - call: "POST /debts/${debt_1}/collection-actions"
              payload: { action_type: "AWG", disposable_pay_estimate_cents: 30000 }
              as: TreasuryOperator
              captures: { err_1: $.data.error_id }
            - call: "POST /debts/${debt_1}/collection-actions"
              payload: { action_type: "CROSS_SERVICING", notice_sent_at: "2026-09-01T00:00:00Z" }
              as: TreasuryOperator
              captures: { err_2: $.data.error_id }
          assert:
            - "AWG without notice_sent_at: 400 with err_1 == ERR_INVALID_REQUEST"
            - "CROSS_SERVICING with notice_sent_at: 400 with err_2 == ERR_INVALID_REQUEST (not ERR_NO_COLLECTION_AGENCY_AVAILABLE — schema beats selector)"
            - "GET /collection-actions?debt_id=${debt_1} returns 0 rows and Debt.${debt_1}.status remains ACTIVE"

      - name: exemption_policy_field_conditionals
        claim_type: Violation → Error
        grounds:
          - entities.ExemptionPolicy.fields.protected_minimum_cents
          - entities.ExemptionPolicy.fields.max_offset_pct
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "PARTIAL requires both numeric fields and EXEMPT/FULL forbid them: PARTIAL missing max_offset_pct is 400, and EXEMPT carrying protected_minimum_cents is 400 — the class field reshapes the required schema."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /exemption-policies"
              payload: { payment_type: "VENDOR", exemption_class: "PARTIAL", protected_minimum_cents: 75000 }
              as: TreasurySupervisor
              captures: { err_1: $.data.error_id }
            - call: "POST /exemption-policies"
              payload: { payment_type: "GRANT", exemption_class: "EXEMPT", protected_minimum_cents: 5000 }
              as: TreasurySupervisor
              captures: { err_2: $.data.error_id }
          assert:
            - "PARTIAL without max_offset_pct: 400 with err_1 == ERR_INVALID_REQUEST"
            - "EXEMPT with protected_minimum_cents: 400 with err_2 == ERR_INVALID_REQUEST"

      - name: due_process_attestation_required_for_activation
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUE_PROCESS_NOT_COMPLETED
          - validations[priority=8]
        distinguishing_aspect: "Due process is a distinct compliance gate from the notice window: a debt whose notice window HAS elapsed but whose attestation is false fails activation with 409 ERR_DUE_PROCESS_NOT_COMPLETED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Federal creditor; debt NOTICED with notice_sent_at 2026-08-01T00:00:00Z (window elapsed) but due_process_completed false."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 50000, delinquent_since: "2026-01-15T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: false }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
          trigger:
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUE_PROCESS_NOT_COMPLETED (not ERR_NOTICE_WINDOW_NOT_ELAPSED — the window did elapse)"
            - "Debt.${debt_1}.status remains NOTICED"

      - name: payment_create_without_active_policy_returns_no_active_policy
        claim_type: Violation → Error
        grounds:
          - errors.ERR_NO_ACTIVE_POLICY
          - validations[priority=10]
        distinguishing_aspect: "Every payment type needs a governing ACTIVE policy at intake: a GRANT payment with only a DRAFT (never activated) GRANT policy is 409 ERR_NO_ACTIVE_POLICY."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Payee present; a GRANT policy exists in DRAFT; one file."
          setup_api_calls:
            - *k_clock
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "GRANT", exemption_class: "FULL" }
              as: TreasurySupervisor
            - *k_file1
          trigger:
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 10000, payment_type: "GRANT" }
              as: PaymentAgencyAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_ACTIVE_POLICY"
            - "GET /payments?payment_file_id=${file_1} returns 0 rows"

      - name: error_notice_window_not_elapsed
        claim_type: Violation → Error
        grounds:
          - errors.ERR_NOTICE_WINDOW_NOT_ELAPSED
        excluded_because:
          difficulty_instance: "boundary_precision_check / notice_window_exact_30_days"
          rationale: "Asserted as the one-second-short failure path of the named §1.8 boundary instance."

      - name: error_claim_window_expired
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CLAIM_WINDOW_EXPIRED
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / claim_window_vs_amount"
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_offset_not_applied
        claim_type: Violation → Error
        grounds:
          - errors.ERR_OFFSET_NOT_APPLIED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / refund_claim_requires_offset_applied"
          rationale: "Asserted as the PROPOSED-offset failure path of the named §1.8 instance."

      - name: error_agreement_overlap
        claim_type: Violation → Error
        grounds:
          - errors.ERR_AGREEMENT_OVERLAP
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / reciprocal_agreement_half_open"
          rationale: "Asserted twice (same-scope overlap and BIDIRECTIONAL conflict) in the named §1.8 instance."

      - name: error_dnp_window_overlap
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DNP_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / dnp_record_closed_interval_touching"
          rationale: "Asserted as the touching-closed-interval failure of the named §1.8 instance."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: clock_default_reads_2026_09_01
        claim_type: Action endpoint
        grounds:
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z: the very first entity created in a fresh database (no clock call in the chain) is stamped created_at == 2026-09-01T00:00:00Z, not wall-clock time."
        test_recipe:
          setup:
            - "Empty database; the logical clock has never been set."
          setup_api_calls: []
          trigger:
            - call: "POST /creditor-agencies"
              payload: { creditor_code: "IRS-7469", legal_name: "Federal Test Creditor", creditor_type: "FEDERAL" }
              as: TreasurySupervisor
              captures: { cred_fed0: $.data.id, cred_created: $.data.created_at }
          assert:
            - "CreditorAgency.${cred_fed0}.created_at == 2026-09-01T00:00:00Z (the pinned startup default)"
            - "CreditorAgency.${cred_fed0}.updated_at == 2026-09-01T00:00:00Z"

      - name: reverse_confirm_recaps_to_current_balance
        claim_type: Action endpoint
        grounds:
          - state_machines.ReverseOffsetRequest.MATCHED_to_CONFIRMED
          - calculations.remittance_fee_assessment
          - entities.ReverseOffsetRequest.fields.applied_total_cents
        distinguishing_aspect: "Confirmation re-caps each match against the balance at confirm time: a request that matched 30000 applies only 20000 after an ordinary offset shaved the debt, and the debtor side effects (PAID_IN_FULL, creditor ledger) follow the re-capped amount."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. WA STATE_TO_FED agreement ACTIVE; federal creditor with ACTIVE 30000-cent FEDERAL_TAX debt for tin 111-22-3333; reverse request for 50000 MATCHED at 30000. In between, a 10000-cent SALARY payment is offset against the same debt, leaving 20000."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "SALARY", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_s: $.data.id }
            - call: "POST /exemption-policies/${pol_s}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /reciprocal-agreements"
              payload: { state_code: "WA", direction: "STATE_TO_FED", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: TreasurySupervisor
              captures: { agr_wa: $.data.id }
            - call: "POST /reciprocal-agreements/${agr_wa}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_TAX", original_amount_cents: 30000, delinquent_since: "2026-01-10T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "POST /reverse-offset-requests"
              payload: { state_code: "WA", payee_tin: "111-22-3333", requested_amount_cents: 50000 }
              as: StateCoordinator
              captures: { ror_1: $.data.id, ror_total: $.data.matched_total_cents }
            - *k_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 10000, payment_type: "SALARY" }
              as: PaymentAgencyAnalyst
              captures: { pay_1: $.data.id, pay_1_v: $.data.version }
            - call: "POST /payments/${pay_1}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_1_v}" }
              as: TreasuryOperator
            - call: "POST /payments/${pay_1}/execute"
              payload: {}
              as: TreasuryOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /reverse-offset-requests/${ror_1}/confirm"
              payload: {}
              as: StateCoordinator
              captures: { ror_applied: $.data.applied_total_cents, ror_status: $.data.status }
            - call: "GET /debts/${debt_1}"
              payload: {}
              as: Auditor
              captures: { debt_1_bal: $.data.current_balance_cents, debt_1_status: $.data.status }
            - call: "GET /creditor-agencies/${cred_fed}"
              payload: {}
              as: Auditor
          assert:
            - "at creation the request matched 30000 (matched_total_cents == 30000)"
            - "after the intervening offset, confirm applies min(30000, 20000): applied_total_cents == 20000 and status == CONFIRMED"
            - "Debt.${debt_1}.current_balance_cents == 0 and status == PAID_IN_FULL"
            - "CreditorAgency.${cred_fed}.remitted_net_total_cents == 29100 (9700 net from the offset at 3% + 19400 net from the confirmation at 3% — both events read the low band since pre-event gross 0 and 10000 are below 60000)"

      - name: reverse_request_confirm_expiry_boundary
        claim_type: Action endpoint
        grounds:
          - state_machines.ReverseOffsetRequest.MATCHED_to_EXPIRED
          - errors.ERR_REQUEST_EXPIRED
          - entities.ReverseOffsetRequest.fields.expires_at
        distinguishing_aspect: "The 10-day TTL is inclusive at the boundary: confirm at exactly created_at + 10 days succeeds, and confirm one second later is 409 ERR_REQUEST_EXPIRED with the request flipped to EXPIRED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. WA STATE_TO_FED agreement ACTIVE; federal creditor with ACTIVE 25000-cent (tin 111-22-3333) and 15000-cent (tin 555-66-7777) FEDERAL_NONTAX debts. Two requests created at 2026-09-01T00:00:00Z, both expiring 2026-09-11T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - call: "POST /reciprocal-agreements"
              payload: { state_code: "WA", direction: "STATE_TO_FED", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: TreasurySupervisor
              captures: { agr_wa: $.data.id }
            - call: "POST /reciprocal-agreements/${agr_wa}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 25000, delinquent_since: "2026-01-10T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "555-66-7777", debtor_name: "Sam Poe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 15000, delinquent_since: "2026-01-10T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_2: $.data.id }
            - call: "POST /debts/${debt_2}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "POST /reverse-offset-requests"
              payload: { state_code: "WA", payee_tin: "111-22-3333", requested_amount_cents: 30000 }
              as: StateCoordinator
              captures: { ror_1: $.data.id }
            - call: "POST /reverse-offset-requests"
              payload: { state_code: "WA", payee_tin: "555-66-7777", requested_amount_cents: 10000 }
              as: StateCoordinator
              captures: { ror_2: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: TreasurySupervisor
            - call: "POST /reverse-offset-requests/${ror_1}/confirm"
              payload: {}
              as: StateCoordinator
              captures: { ror_1_status: $.data.status, ror_1_applied: $.data.applied_total_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:01Z" }
              as: TreasurySupervisor
            - call: "POST /reverse-offset-requests/${ror_2}/confirm"
              payload: {}
              as: StateCoordinator
              captures: { err_id: $.data.error_id }
            - call: "POST /reverse-offset-requests/${ror_2}/confirm"
              payload: {}
              as: StateCoordinator
              captures: { err_id_2: $.data.error_id }
          assert:
            - "confirm at exactly expires_at (2026-09-11T00:00:00Z): 200, status CONFIRMED, applied_total_cents == 25000"
            - "confirm one second later: 409 with error_id == ERR_REQUEST_EXPIRED"
            - "a further confirm on the same request is 409 with error_id == ERR_INVALID_STATE — the failed confirm flipped it to EXPIRED, which is terminal"

      - name: reverse_request_no_match_empty_set
        claim_type: Computed read
        grounds:
          - calculations.reverse_match_waterfall
          - entities.ReverseOffsetRequest.fields.status
        distinguishing_aspect: "The empty eligible set is a first-class outcome, not an error: a reverse request whose TIN matches no ACTIVE federal debt returns 201 with status NO_MATCH, matched_total_cents == 0, and an empty matches array."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. WA STATE_TO_FED agreement ACTIVE; no debts exist for tin 777-88-9999."
          setup_api_calls:
            - *k_clock
            - call: "POST /reciprocal-agreements"
              payload: { state_code: "WA", direction: "STATE_TO_FED", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: TreasurySupervisor
              captures: { agr_wa: $.data.id }
            - call: "POST /reciprocal-agreements/${agr_wa}/activate"
              payload: {}
              as: TreasurySupervisor
          trigger:
            - call: "POST /reverse-offset-requests"
              payload: { state_code: "WA", payee_tin: "777-88-9999", requested_amount_cents: 50000 }
              as: StateCoordinator
              captures: { ror_1: $.data.id, ror_status: $.data.status, ror_total: $.data.matched_total_cents }
          assert:
            - "the response status is 201 with ReverseOffsetRequest.${ror_1}.status == NO_MATCH"
            - "matched_total_cents == 0 and matches == [] (empty set, not an error)"

      - name: reverse_request_without_agreement_returns_no_reciprocal_agreement
        claim_type: Conditional action
        grounds:
          - errors.ERR_NO_RECIPROCAL_AGREEMENT
          - validations[priority=10]
        distinguishing_aspect: "The covering-agreement selector failing is a 409 ERR_NO_RECIPROCAL_AGREEMENT: no ACTIVE agreement for the state with a STATE_TO_FED-compatible scope spanning the clock means the request is never created."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No reciprocal agreements exist."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /reverse-offset-requests"
              payload: { state_code: "WA", payee_tin: "111-22-3333", requested_amount_cents: 50000 }
              as: StateCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_RECIPROCAL_AGREEMENT"

  # ===========================================================================
  - section: errors
    instances:

      - name: payment_create_missing_auth_headers_returns_400
        claim_type: Violation → Error
        grounds:
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
          - validations[priority=1]
        distinguishing_aspect: "Authentication is priority 1: a well-formed payee create with no X-User-ID / X-User-Role headers is 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before schema, existence, or duplicate checks run."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /payees"
              payload: { tin: "111-22-3333", tin_type: "SSN", legal_name: "Pat Doe" }
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "response_type is error and data carries error_id and message"

  # ===========================================================================
  - section: rbac
    instances:

      - name: payment_agency_analyst_cannot_execute_payment
        claim_type: Violation → Error
        grounds:
          - roles.PaymentAgencyAnalyst
          - errors.ERR_FORBIDDEN_FOR_ROLE
          - validations[priority=2]
        distinguishing_aspect: "Role scoping is per-endpoint: PaymentAgencyAnalyst may create files and payments but execute is TreasuryOperator-only — the same user id in the wrong role is 403 ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A 25000-cent VENDOR payment sits EVALUATED (offset proposed against an ACTIVE 50000-cent debt)."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "VENDOR", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_v: $.data.id }
            - call: "POST /exemption-policies/${pol_v}/activate"
              payload: {}
              as: TreasurySupervisor
            - *k_debt50
            - *k_debt50_act
            - *k_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 25000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
              captures: { pay_1: $.data.id, pay_1_v: $.data.version }
            - call: "POST /payments/${pay_1}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_1_v}" }
              as: TreasuryOperator
          trigger:
            - call: "POST /payments/${pay_1}/execute"
              payload: {}
              as: PaymentAgencyAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "Payment.${pay_1}.processing_status remains EVALUATED"

      - name: creditor_analyst_cannot_notice_other_creditors_debt
        claim_type: Violation → Error
        grounds:
          - roles.CreditorAnalyst
          - errors.ERR_FORBIDDEN_FOR_ROLE
          - validations[priority=2]
        distinguishing_aspect: "CreditorAnalyst is entity-backed: X-User-ID must equal the debt's creditor_agency_id, so creditor A's analyst posting a notice on creditor B's debt is 403 ERR_FORBIDDEN_FOR_ROLE even though the role is correct for the endpoint."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two federal creditors (IRS-7469 and SSA-111); a REFERRED debt belongs to SSA-111."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - call: "POST /creditor-agencies"
              payload: { creditor_code: "SSA-111", legal_name: "Social Security Test Bureau", creditor_type: "FEDERAL" }
              as: TreasurySupervisor
              captures: { cred_ssa: $.data.id }
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_ssa}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 50000, delinquent_since: "2026-01-15T00:00:00Z" }
              as: CreditorAnalyst
              as_user_id: "${cred_ssa}"
              captures: { debt_1: $.data.id }
          trigger:
            - call: "POST /debts/${debt_1}/notice"
              payload: { notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE (ownership, not role, fails)"
            - "Debt.${debt_1}.status remains REFERRED and notice_sent_at remains null"

      - name: refund_officer_cannot_file_claim
        claim_type: Violation → Error
        grounds:
          - roles.RefundOfficer
          - errors.ERR_FORBIDDEN_FOR_ROLE
        distinguishing_aspect: "Segregation starts at filing: RefundOfficer reviews and decides but cannot file — a RefundOfficer POSTing /refund-claims is 403 ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. (The offset referenced does not matter: role denial precedes existence checks.)"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /refund-claims"
              payload: { offset_id: "00000000-0000-4000-8000-000000000009", claimed_amount_cents: 100, reason: "DEBT_NOT_OWED" }
              as: RefundOfficer
              as_user_id: "ro-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE (not 404 — role denial at priority 2 precedes offset existence at priority 6)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_evaluate_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payment-reevaluate-stale-version]
          - errors.ERR_STALE_VERSION
          - endpoints.POST /payments/{paymentId}/evaluate-offsets
        distinguishing_aspect: "OCC on Payment.version: after a successful re-evaluation bumps the version, a strictly sequential second evaluate carrying the pre-supersede expected_payment_version is 412 ERR_STALE_VERSION — the stale writer is rejected even though EVALUATED -> EVALUATED re-evaluation is otherwise legal."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A 30000-cent SALARY payment against an ACTIVE 50000-cent debt, evaluated once (version advanced past the captured one)."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "SALARY", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_s: $.data.id }
            - call: "POST /exemption-policies/${pol_s}/activate"
              payload: {}
              as: TreasurySupervisor
            - *k_debt50
            - *k_debt50_act
            - *k_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 30000, payment_type: "SALARY" }
              as: PaymentAgencyAnalyst
              captures: { pay_1: $.data.id, pay_1_v: $.data.version }
            - call: "POST /payments/${pay_1}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_1_v}" }
              as: TreasuryOperator
          trigger:
            - call: "POST /payments/${pay_1}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_1_v}" }
              as: TreasuryOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "Payment.${pay_1}.version == the value returned by the first evaluate (the failed re-evaluation did not bump it)"
            - "GET /offsets?payment_id=${pay_1}&status=PROPOSED still returns exactly 1 row (no supersede happened)"

      - name: occ_collect_stale_debt_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[garnishment-collect-stale-debt]
          - errors.ERR_STALE_VERSION
          - endpoints.POST /collection-actions/{collectionActionId}/collect
        distinguishing_aspect: "OCC on Debt.version: after one collect reduces the balance, a strictly sequential second collect carrying the pre-collection expected_debt_version is 412 ERR_STALE_VERSION — the garnishment basis is stale even though the action is still ACTIVE and the operation would otherwise succeed."
        test_recipe:
          setup:
            - "Clock advanced to 2026-09-05T00:00:00Z. Federal creditor; ACTIVE 100000-cent debt; AWG action ACTIVATED; one collect of 3250 already applied (debt at 96750, version advanced past the captured one)."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "222-33-4444", debtor_name: "Jamie Roe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 100000, delinquent_since: "2026-02-01T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "POST /debts/${debt_1}/collection-actions"
              payload: { action_type: "AWG", notice_sent_at: "2026-08-20T00:00:00Z", disposable_pay_estimate_cents: 25000 }
              as: TreasuryOperator
              captures: { ca_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: TreasurySupervisor
            - call: "POST /collection-actions/${ca_1}/activate"
              payload: {}
              as: TreasuryOperator
            - call: "GET /debts/${debt_1}"
              payload: {}
              as: Auditor
              captures: { debt_1_v: $.data.version }
            - call: "POST /collection-actions/${ca_1}/collect"
              payload: { expected_debt_version: "${debt_1_v}", disposable_pay_cents: 25000 }
              as: TreasuryOperator
          trigger:
            - call: "POST /collection-actions/${ca_1}/collect"
              payload: { expected_debt_version: "${debt_1_v}", disposable_pay_cents: 25000 }
              as: TreasuryOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "Debt.${debt_1}.current_balance_cents == 96750 (only the first collect applied)"
            - "CollectionAction.${ca_1}.collected_total_cents == 3250"

      - name: selector_ranks_fewest_open_then_spare_then_created_at
        claim_type: selector_policy
        grounds:
          - entities.CollectionAction.fields.collection_agency_id
          - entities.CollectionAgency.fields.capacity_max_active
        distinguishing_aspect: "The cross-servicing selector is fully pinned: eligible agencies (open actions < capacity) rank by open count ASC, then spare capacity DESC, then created_at ASC — so the first referral lands on B (spare 10 beats A's 5; B predates C) and the second lands on C (B now has 1 open; A and C tie at 0 open and C's spare 10 beats A's 5)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Agencies registered in order A (capacity 5), B (capacity 10), C (capacity 10). Federal creditor with two ACTIVE debts (60000 and 70000)."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - call: "POST /collection-agencies"
              payload: { agency_code: "PCA-A", name: "Pioneer Collections", capacity_max_active: 5 }
              as: TreasurySupervisor
              captures: { pca_a: $.data.id }
            - call: "POST /collection-agencies"
              payload: { agency_code: "PCA-B", name: "Beacon Recovery", capacity_max_active: 10 }
              as: TreasurySupervisor
              captures: { pca_b: $.data.id }
            - call: "POST /collection-agencies"
              payload: { agency_code: "PCA-C", name: "Cascade Asset Management", capacity_max_active: 10 }
              as: TreasurySupervisor
              captures: { pca_c: $.data.id }
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "222-33-4444", debtor_name: "Jamie Roe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 60000, delinquent_since: "2026-02-01T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "333-44-5555", debtor_name: "Alex Moe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 70000, delinquent_since: "2026-02-01T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_2: $.data.id }
            - call: "POST /debts/${debt_2}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
          trigger:
            - call: "POST /debts/${debt_1}/collection-actions"
              payload: { action_type: "CROSS_SERVICING" }
              as: TreasuryOperator
              captures: { ca_1: $.data.id, ca_1_agency: $.data.collection_agency_id }
            - call: "POST /debts/${debt_2}/collection-actions"
              payload: { action_type: "CROSS_SERVICING" }
              as: TreasuryOperator
              captures: { ca_2: $.data.id, ca_2_agency: $.data.collection_agency_id }
          assert:
            - "first referral: CollectionAction.${ca_1}.collection_agency_id == ${pca_b} (open-count tie at 0 broken by spare capacity 10 > 5, then B before C by created_at)"
            - "second referral: CollectionAction.${ca_2}.collection_agency_id == ${pca_c} (B excluded from the tie at 1 open; C's spare 10 beats A's spare 5)"
            - "both debts are IN_COLLECTION"

      - name: selector_empty_pool_returns_error
        claim_type: selector_policy
        grounds:
          - errors.ERR_NO_COLLECTION_AGENCY_AVAILABLE
          - endpoints.POST /debts/{debtId}/collection-actions
        distinguishing_aspect: "The empty-pool fallback is an error, not a queue: with no registered agencies a CROSS_SERVICING referral is 409 ERR_NO_COLLECTION_AGENCY_AVAILABLE and leaves the debt ACTIVE with zero actions persisted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Federal creditor with an ACTIVE 50000-cent debt; no collection agencies registered."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - *k_debt50
            - *k_debt50_act
          trigger:
            - call: "POST /debts/${debt_1}/collection-actions"
              payload: { action_type: "CROSS_SERVICING" }
              as: TreasuryOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_COLLECTION_AGENCY_AVAILABLE"
            - "GET /collection-actions?debt_id=${debt_1} returns 0 rows"
            - "Debt.${debt_1}.status remains ACTIVE (the failed referral did not flip it)"

      - name: dnp_hold_and_release_cascade
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Payment.VERIFIED_to_HELD
          - state_machines.Payment.HELD_to_VERIFIED
        excluded_because:
          difficulty_instance: "transitive_cascade / dnp_record_creation_depth2"
          rationale: "The flag -> hold cascade and its release are both asserted in the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: execute_response_reflects_all_side_effects_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /payments/{paymentId}/execute
        distinguishing_aspect: "Immediate consistency: the execute response body itself carries processing_status EXECUTED, total_offset_cents 30000, and disbursed_cents 20000 — the full cascade (offset application, balance reduction, ledger credit) is committed before the response, and a follow-up GET agrees byte-for-byte."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Federal creditor; ACTIVE 30000-cent debt; FULL SALARY policy; a 50000-cent SALARY payment EVALUATED."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "SALARY", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_s: $.data.id }
            - call: "POST /exemption-policies/${pol_s}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 30000, delinquent_since: "2026-01-15T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - *k_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 50000, payment_type: "SALARY" }
              as: PaymentAgencyAnalyst
              captures: { pay_1: $.data.id, pay_1_v: $.data.version }
            - call: "POST /payments/${pay_1}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_1_v}" }
              as: TreasuryOperator
          trigger:
            - call: "POST /payments/${pay_1}/execute"
              payload: {}
              as: TreasuryOperator
              as_user_id: "op-1"
              captures: { p_status: $.data.processing_status, p_off: $.data.total_offset_cents, p_disb: $.data.disbursed_cents }
            - call: "GET /payments/${pay_1}"
              payload: {}
              as: Auditor
            - call: "GET /debts/${debt_1}"
              payload: {}
              as: Auditor
          assert:
            - "the execute RESPONSE itself shows processing_status == EXECUTED, total_offset_cents == 30000, disbursed_cents == 20000"
            - "the follow-up GET /payments/${pay_1} returns identical field values (no lag, no reconciliation window)"
            - "GET /debts/${debt_1} already shows current_balance_cents == 0 and status == PAID_IN_FULL"
