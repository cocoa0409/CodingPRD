  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: trial_start_blocked_by_active_continuous_leave
        grounds:
          - state_machines.AccommodationRequest.TRIAL_SETUP_to_TRIAL_ACTIVE
          - state_machines.AbsenceRecord.SCHEDULED_to_ACTIVE
          - validations[priority=71]
          - errors[ERR_TRIAL_BLOCKED_BY_ABSENCE]
        distinguishing_aspect: |
          TrialPeriod creation is gated on the state of a different entity,
          AbsenceRecord: the identical POST /trial-periods succeeds when the
          FMLA_CONTINUOUS record is SCHEDULED and fails once that record is
          ACTIVE; the pair is TrialPeriod x AbsenceRecord, different from the
          Appeal x AccommodationRequest and AccommodationOption x
          EssentialFunction pairs of the sibling instances.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "PUBLISHED JobProfile 'HSP-NURSE-1' in department HSP with one ACTIVE essential function EF-ROUNDS of weight 5."
            - "Employee E-D001 with a case in stage TRIAL_SETUP whose selected option OPT-CART is SELECTED."
            - "The employee also has an AbsenceRecord of record_type FMLA_CONTINUOUS running 2026-08-25..2026-10-31 that has been moved to status ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "HSP-NURSE-1", title: "Ward Nurse", department_code: "HSP", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { jpF_id: $.data.id }
            - call: "POST /job-profiles/${jpF_id}/essential-functions"
              payload: { function_code: "EF-ROUNDS", description: "Complete ward medication rounds", criticality_weight: 5, frequency_per_week: 35, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              captures: { ef_rounds_id: $.data.id }
            - call: "POST /job-profiles/${jpF_id}/publish"
              payload: { profile_version_label: "2026.1" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "E-D001", full_name: "Neve Ronan", department_code: "HSP", job_title: "Ward Nurse", hire_date: "2020-01-13", job_profile_id: "${jpF_id}", is_people_manager: false, annual_salary_cents: 7400000 }
              as: AccommodationCoordinator
              captures: { empF_id: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "M-D002", full_name: "Hana Reid", department_code: "HSP", job_title: "Ward Manager", hire_date: "2014-10-06", job_profile_id: "${jpF_id}", is_people_manager: true, annual_salary_cents: 11900000 }
              as: AccommodationCoordinator
              captures: { mgrF_id: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${empF_id}", request_channel: "WRITTEN", requested_accommodation_text: "Powered medication cart", disability_obvious: true }
              as: Employee
              as_user_id: "${empF_id}"
              captures: { reqF_id: $.data.id }
            - call: "POST /accommodation-requests/${reqF_id}/advance"
              payload: { target_stage: "FUNCTION_ANALYSIS" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${reqF_id}/function-analyses"
              payload: { essential_function_id: "${ef_rounds_id}", can_perform_unaided: false, limitation_severity: 3, proposed_treatment: "PERFORM_WITH_AID" }
              as: Manager
              as_user_id: "${mgrF_id}"
            - call: "POST /accommodation-requests/${reqF_id}/advance"
              payload: { target_stage: "OPTION_EXPLORATION" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${reqF_id}/options"
              payload: { option_code: "OPT-CART", category: "EQUIPMENT", one_time_cost_cents: 40000, recurring_monthly_cost_cents: 0, implementation_days: 10, coverage_function_ids: ["${ef_rounds_id}"] }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { optF_id: $.data.id }
            - call: "POST /accommodation-requests/${reqF_id}/advance"
              payload: { target_stage: "HARDSHIP_REVIEW" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "GET /accommodation-options/${optF_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { optF_v: $.data.version }
            - call: "POST /accommodation-options/${optF_id}/hardship-assessments"
              payload: { assessment_basis: "SITE_LOCAL", expected_option_version: "${optF_v}" }
              as: FinanceOfficer
              as_user_id: "FIN-1"
            - call: "POST /accommodation-requests/${reqF_id}/advance"
              payload: { target_stage: "DECISION_PENDING" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${reqF_id}/decide"
              payload: { decision: "GRANT_WITH_TRIAL", selected_option_id: "${optF_id}" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /absence-records"
              payload: { employee_id: "${empF_id}", record_type: "FMLA_CONTINUOUS", start_date: "2026-08-25", end_date: "2026-10-31", weekly_intermittent_days: 0, restriction_severity: 0, modified_duty_available: false }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { absF_id: $.data.id }
            - call: "POST /absence-records/${absF_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
          trigger:
            - call: "POST /trial-periods"
              payload: { request_id: "${reqF_id}", option_id: "${optF_id}", start_date: "2026-09-01", end_date: "2026-11-30", checkin_cadence_days: 14, scoring_mode: "LATEST_WEIGHTED" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { absence_block_err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_TRIAL_BLOCKED_BY_ABSENCE"
            - "AbsenceRecord.${absF_id}.status == ACTIVE"
            - "Employee.${empF_id}.employment_status == ON_LEAVE"
            - "AccommodationRequest.${reqF_id}.stage == TRIAL_SETUP (unchanged)"
            - "GET /trial-periods filtered by request_id ${reqF_id} returns an empty array with total_count 0"

      - name: appeal_review_blocked_by_sealed_case_posture
        grounds:
          - state_machines.Appeal.FILED_to_UNDER_REVIEW
          - state_machines.AccommodationRequest.RESTRICTED_to_SEALED
          - validations[priority=50]
          - errors[ERR_CASE_SEALED]
          - calculations.disclosure_authorization
        distinguishing_aspect: |
          The Appeal FILED -> UNDER_REVIEW transition is gated on the parallel
          confidentiality dimension of a different entity, the
          AccommodationRequest: once an unauthorized MedicalDisclosure seals
          the case the identical START_REVIEW call is rejected; the pair is
          Appeal x AccommodationRequest, different from the TrialPeriod x
          AbsenceRecord and AccommodationOption x EssentialFunction pairs of
          the sibling instances.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "PUBLISHED JobProfile 'LOG-PICK-1' in department LOG with one ACTIVE essential function EF-PICK of weight 5."
            - "Employee E-E001 whose case was denied by COORD-1 and who has filed an appeal that is still in status FILED."
