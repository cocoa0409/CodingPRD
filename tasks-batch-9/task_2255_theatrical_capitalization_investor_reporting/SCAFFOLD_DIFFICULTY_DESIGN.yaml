  - name: wrap_certify_then_void_conserves_recoupment_and_deferral_ledgers
    grounds:
    - §1.2 WeeklyWrap CERTIFIED -> VOID side effects (reverse allocations, back out profit and deferral)
    - §1.1 RoyaltyParticipant.cumulative_pool_paid_cents
    - §1.1 Production.recouped_amount_cents, .deferred_royalty_cents, .recoupment_status
    - §1.1 InvestorAccount.distribution_basis, .recoupment_credited_cents
    distinguishing_aspect: |
      The void must unwind a five-hop cascade in full, including the parts that are easy
      to forget: the losing week's 800,000 deferral, RP1's cumulative 4,394,445, the
      RECOUPED flip and the investor account's NET_PROFIT basis. With target 18,362,500 the
      certify flips everything on; voiding both wraps must return the production to
      recouped 0, deferred 0, UNRECOUPED, and the account to RECOUPMENT_RETURN with
      recoupment_credited_cents 0. An implementation that only flips the wrap status leaves
      18,362,500 credited; one that reverses the profit but not the deferral leaves
      deferred_royalty_cents at 800,000.
