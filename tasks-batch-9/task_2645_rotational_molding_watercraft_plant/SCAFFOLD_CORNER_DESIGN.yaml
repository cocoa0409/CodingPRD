          Each shared operation is exercised by MORE THAN ONE of its declared
          sharers in the same run — customers by LogisticsPlanner and by
          PlantAdmin, an order released by LogisticsPlanner and cancelled by
          PlantAdmin, a resin lot created by ResinTechnician, and storage
          guidance acknowledged once by the Customer itself and once by
