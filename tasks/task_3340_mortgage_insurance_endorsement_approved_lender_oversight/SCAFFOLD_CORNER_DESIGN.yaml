            - "response.data.error_id == ERR_ESCROW_WINDOW_OVERLAP"

      - name: qc_plan_missing_at_approval
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_QC_PLAN_MISSING]", "state_machines.Lender.FIELD_REVIEW_to_APPROVED"]
        distinguishing_aspect: "APPROVE on a lender onboarded with qc_plan_on_file false fails the fiscal-attestation check with 422 ERR_QC_PLAN_MISSING even when the financials are sufficient."
