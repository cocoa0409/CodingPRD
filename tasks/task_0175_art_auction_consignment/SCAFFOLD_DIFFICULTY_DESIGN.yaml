  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_unique_lot_number_in_sale
        grounds:
          - validations[priority=13]
          - entities.Lot.fields.lot_number
        distinguishing_aspect: |
          Interval semantics: lot_number occupies a discrete catalog 'slot'
          within an auction_sale_id; a second non-WITHDRAWN lot claiming the
          same lot_number collides (point-occupancy uniqueness over the
          {auction_sale_id} partition) -> ERR_DUPLICATE. The geometry is a
          single-point slot, scoped to one sale.
        test_recipe:
          setup:
            - "Sale CATALOGING with lot_number 5 already cataloged; a second lot with lot_number 5 is added."
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Standard", tiers: [ { upper_bound_cents: 3000000, rate_bps: 2600 }, { upper_bound_cents: 60000000, rate_bps: 2000 }, { upper_bound_cents: null, rate_bps: 1450 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate N", email: "estaten@x.com", country_code: "US", payout_iban: "US00000000000000000000014" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Sale N", sale_date_utc: "2026-07-06T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 5, title: "Work N1", artist_name: "Artist N", artist_alive: false, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
              captures: { lot1_id: $.data.id }
          trigger:
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 5, title: "Work N2", artist_name: "Artist N", artist_alive: false, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_DUPLICATE (lot_number 5 already taken in sale)"

      - name: overlap_one_paddle_per_bidder_per_sale
        grounds:
          - validations[priority=13]
          - entities.PaddleRegistration.fields.bidder_id
          - entities.PaddleRegistration.fields.auction_sale_id
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource entity
          (PaddleRegistration): the conflict is on the COMPOSITE
          {auction_sale_id, bidder_id} pair — a bidder may hold at most one
          paddle per sale (aggregate cardinality 1 per partition), not a
          numeric slot. A second registration for the same bidder+sale ->
          ERR_DUPLICATE.
        test_recipe:
          setup:
            - "Bidder already has a paddle in a sale; a second registration for the same bidder+sale is attempted."
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Standard", tiers: [ { upper_bound_cents: 3000000, rate_bps: 2600 }, { upper_bound_cents: 60000000, rate_bps: 2000 }, { upper_bound_cents: null, rate_bps: 1450 } ] }
              as: SaleAdministrator
