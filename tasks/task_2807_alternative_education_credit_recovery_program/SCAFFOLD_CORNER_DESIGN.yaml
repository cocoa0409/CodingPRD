              payload: {}
              as: DistrictAdmin
              as_user_id: "admin-01"
            - call: "GET /support-providers/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: DistrictAdmin
              as_user_id: "admin-01"
            - call: "GET /support-sessions/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: DistrictAdmin
              as_user_id: "admin-01"
          assert:
            - "each call returns HTTP 404 with, in order, ERR_COURSE_NOT_FOUND, ERR_PRIOR_RECORD_NOT_FOUND, ERR_REFERRAL_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_AWARD_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_STATION_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_PROVIDER_NOT_FOUND and ERR_SUPPORT_SESSION_NOT_FOUND"
            - "every body follows the declared error envelope with an error id and message and no data payload"
            - "the corresponding list endpoints return HTTP 200 with empty collections, so the 404 is about the path id and not about an empty database"

      - name: uniqueness_rung_rejects_duplicate_identifiers
