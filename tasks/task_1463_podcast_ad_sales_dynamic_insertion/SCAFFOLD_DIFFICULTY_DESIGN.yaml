              as: AdOps
              captures: { lib: $.data.id }
          trigger:
            - call: "POST /adnet/line-items/${lib}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
          assert:
            - "ACTIVATE fails with ERR_CATEGORY_EXCLUSIVE_CONFLICT: [2026-08-15, 2026-09-15) overlaps CA's [2026-08-01, 2026-09-01) with positive duration"
            - "LineItem.${lib}.status remains DRAFT and Show.${sh}.reserved_impressions == 10 (only LI_A's reservation)"

      - name: episode_slot_aggregate_capacity_overflow
        grounds:
          - calculations.episode_slot_occupancy
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
          - validations[priority=10]
        distinguishing_aspect: |
          Interval semantics: aggregate capacity on the Episode resource — two
          concurrent overlapping episode-targeted line items are ALLOWED
          (slot_capacity 2), and only the third overlapping activation is
          rejected; this differs from the show-level rule where ANY pairwise
          same-category overlap rejects.
        test_recipe:
          setup:
            - "Show; one episode (slot_capacity 2, publish 2026-08-01); three advertisers with distinct categories (TECHNOLOGY, FINTECH, ALCOHOL) so exclusivity cannot interfere"
            - "Three campaigns with identical flights [2026-08-01, 2026-09-01), all ACTIVE, each with APPROVED copy; three DRAFT episode-targeted line items"
