# =============================================================================
# Task 988: Propane Cylinder Exchange & Refill — Scaffold Corner Design (§1.9)
# Breadth coverage of every testable claim in §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Common fixtures: policy P = {swap 2499,
# deposit 3500, tax 825bps, refill tiers 349/299 @15.00 lbs, effective
# 2026-05-01}; standard cylinder WC=47.60 TW=17.00; default clock 2026-05-01.
# =============================================================================
scaffold_corner_design:
  # ================================================== Entities
  - section: entities
    instances:
      - name: site_creation_applies_defaults
        claim_type: defaults
        grounds:
          - entities.HostSite
          - state_machines.HostSite
        distinguishing_aspect: "A minimal POST /sites yields status ACTIVE, opening_float_cents 20000, commission_basis GROSS, recon_basis BOOK, hazmat_fee_cents 0, promo_waives_hazmat false, counts 0, sales_posture SALES_OPEN, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Default Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_st: $.data.status, s_float: $.data.opening_float_cents, s_cb: $.data.commission_basis, s_rb: $.data.recon_basis, s_hz: $.data.hazmat_fee_cents, s_pr: $.data.promo_waives_hazmat, s_full: $.data.full_on_hand, s_post: $.data.sales_posture, s_v: $.data.version, s_floor: $.data.reorder_floor_full }
          assert:
            - "status == ACTIVE; sales_posture == SALES_OPEN; version == 1"
            - "opening_float_cents == 20000; commission_basis == GROSS; recon_basis == BOOK; hazmat_fee_cents == 0; promo_waives_hazmat == false"
            - "full_on_hand == 0; empty_on_hand == 0; quarantined_on_hand == 0; reorder_floor_full == 6 (ceil(12*0.5)); restock_alert == true (0 <= 6)"

      - name: cylinder_registration_computes_initial_certification
        claim_type: computed_fields
        grounds:
          - entities.Cylinder.fields.certification_expires_on
          - calculations.cylinder_certification_expiry
        distinguishing_aspect: "Registration derives certified_on = manufacture_date, certification_expires_on = manufacture_date + 12 years, cert_method_last = INITIAL, cert_status = CERTIFIED — all without client input."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cylinders"
              payload: { serial_number: "SN-INIT", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
              captures: { c_on: $.data.certified_on, c_exp: $.data.certification_expires_on, c_m: $.data.cert_method_last, c_st: $.data.cert_status, c_fill: $.data.fill_status }
          assert:
            - "certified_on == 2020-01-15; certification_expires_on == 2032-01-15; cert_method_last == INITIAL; cert_status == CERTIFIED; fill_status == FULL"

      - name: get_missing_site_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /sites/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; http status 404"

      - name: create_site_missing_required_field
        claim_type: required_fields
        grounds:
          - entities.HostSite.fields.commission_rate_bps
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting required commission_rate_bps returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Bad Site", cage_capacity_cylinders: 20, par_level_full: 12 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION; http status 400"

      - name: create_technician_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.Technician.fields.cert_level
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "cert_level outside {VISUAL_ONLY, FULL} returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /technicians"
              payload: { name: "Tech X", cert_level: "MEGA" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION; http status 400"

      - name: customer_cylinder_with_site_rejected
        claim_type: type_constraints
        grounds:
          - entities.Cylinder.fields.owner_kind
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "A CUSTOMER cylinder registered with a current_site_id is rejected (CUSTOMER stock never counts in cage inventory)."
        test_recipe:
          setup: ["site S exists"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /cylinders"
              payload: { serial_number: "SN-CUST", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY, current_site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION; http status 400"

      - name: host_site_cage_counts_computed
        claim_type: computed_fields
        grounds:
          - calculations.site_cage_counts
          - entities.HostSite.fields.full_on_hand
        distinguishing_aspect: "Registering 2 FULL + 1 EMPTY fleet cylinders at a site makes GET /sites/{id} report exactly 2/1/0 without any site write."
        test_recipe:
          setup: ["site S exists"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Count Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /cylinders"
              payload: { serial_number: "SN-C1", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-C2", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-C3", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY, current_site_id: "${s_id}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { s_full: $.data.full_on_hand, s_empty: $.data.empty_on_hand, s_q: $.data.quarantined_on_hand }
          assert:
            - "full_on_hand == 2; empty_on_hand == 1; quarantined_on_hand == 0"

  # ================================================== State Machines
  - section: state_machines
    instances:
      - name: refill_ticket_initial_state_and_weigh
        claim_type: initial_state
        grounds:
          - state_machines.RefillTicket
        distinguishing_aspect: "A new ticket starts OPEN; weigh with in-tolerance tare moves it to WEIGHED and stores measured_tare_lbs."
        test_recipe:
          setup: ["site S with policy; 1 EMPTY CUSTOMER cylinder"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-W1", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${c_id}", pre_weight_lbs: 17.50 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { t_st: $.data.status, t_max: $.data.max_fill_lbs, t_id: $.data.id }
            - call: "POST /refill-tickets/${t_id}/weigh"
              payload: { measured_tare_lbs: 17.05 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { t_st2: $.data.status, t_mt: $.data.measured_tare_lbs }
          assert:
            - "create: status == OPEN; max_fill_lbs == 19.99"
            - "weigh: status == WEIGHED; measured_tare_lbs == 17.05 (|17.05-17.00| = 0.05 <= 0.10)"

      - name: close_open_ticket_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RefillTicket
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSE is only valid from FILLED; closing an OPEN ticket fails with ERR_INVALID_STATE and records nothing."
        test_recipe:
          setup: ["site S with policy; 1 EMPTY CUSTOMER cylinder; OPEN ticket"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-W2", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { c_id: $.data.id }
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${c_id}", pre_weight_lbs: 17.50 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /refill-tickets/${t_id}/close"
              payload: { payment_cash_cents: 9999 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; http status 409"

      - name: double_complete_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ExchangeOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing an already-COMPLETED order fails with ERR_INVALID_STATE; no double cash is recorded."
        test_recipe:
          setup: ["site S with policy and 1 FULL fleet cylinder; order completed"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-DC", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 6494 }
              as: SiteClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 6494 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; http status 409"

      - name: refunded_order_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ExchangeOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REFUNDED is terminal: a second refund attempt fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["site S with policy and 1 FULL fleet cylinder; order completed and refunded same day (no session exists)"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-TL", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 6494 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /exchange-orders/${o_id}/refund"
              payload: {}
              as: SiteClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /exchange-orders/${o_id}/refund"
              payload: {}
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; http status 409"

      - name: false_alarm_confirmed_leak_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.LeakReport
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "FALSE_ALARM is only reachable from REPORTED; a CONFIRMED leak cannot be false-alarmed."
        test_recipe:
          setup: ["site S; MINOR leak (quarantine_cage false) REPORTED then CONFIRMED"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /leak-reports"
              payload: { site_id: "${s_id}", severity: MINOR }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { lr_id: $.data.id }
            - call: "POST /leak-reports/${lr_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /leak-reports/${lr_id}/false-alarm"
              payload: { reason: "gauge misread" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; http status 409"

      - name: condemned_cylinder_certification_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Cylinder
          - errors[ERR_CYLINDER_CONDEMNED]
        distinguishing_aspect: "cert_status=CONDEMNED is terminal: any new certification record on the cylinder is rejected with ERR_CYLINDER_CONDEMNED."
        test_recipe:
          setup: ["fleet cylinder condemned via two-technician CONDEMN flow"]
          setup_api_calls:
            - call: "POST /cylinders"
              payload: { serial_number: "SN-CD", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2014-06-01", initial_fill: EMPTY }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T1", cert_level: FULL }
              as: PlatformAdmin
              captures: { t1: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T2", cert_level: FULL }
              as: PlatformAdmin
              captures: { t2: $.data.id }
            - call: "POST /certification-records"
              payload: { cylinder_id: "${c_id}", method: VISUAL, outcome: CONDEMN }
              as: Technician
              as_user_id: "${t1}"
              captures: { r_id: $.data.id }
            - call: "POST /certification-records/${r_id}/confirm"
              payload: {}
              as: Technician
              as_user_id: "${t2}"
          trigger:
            - call: "POST /certification-records"
              payload: { cylinder_id: "${c_id}", method: HYDROSTATIC, outcome: PASS }
              as: Technician
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CYLINDER_CONDEMNED; http status 409"

      - name: arrive_on_wrong_date_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RestockRun.DISPATCHED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "arrive requires current logical date == planned_date; arriving on a different date fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["site S with 3 FULL fleet (planned_full 9); driver D; 9 depot fulls; run planned 2026-05-20 DISPATCHED; clock still at 2026-05-01"]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { name: "D", license_number: "CDL-A", dot_medical_expires_on: "2027-01-01", vehicle_max_payload_lbs: 2000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /cylinders"
              payload: { serial_number: "SN-A1", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-A2", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-A3", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "DP-A1", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "DP-A2", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "DP-A3", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "DP-A4", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "DP-A5", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "DP-A6", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "DP-A7", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "DP-A8", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "DP-A9", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: PlatformAdmin
            - call: "POST /restock-runs"
              payload: { site_id: "${s_id}", driver_id: "${d_id}", planned_date: "2026-05-20", expected_site_version: "${s_v}" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /restock-runs/${r_id}/dispatch"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /restock-runs/${r_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (clock 2026-05-01 != planned_date 2026-05-20)"

      - name: supersede_cancels_prior_draft_run
        claim_type: side_effect_execution
        grounds:
          - state_machines.RestockRun.DRAFT_to_CANCELLED
          - concurrency_rules[restock-run-create-stale-site]
        distinguishing_aspect: "Creating a run for a site with an existing DRAFT run (with the current site version) auto-cancels the older DRAFT run."
        test_recipe:
          setup: ["site S; driver D; run1 DRAFT"]
          setup_api_calls:
