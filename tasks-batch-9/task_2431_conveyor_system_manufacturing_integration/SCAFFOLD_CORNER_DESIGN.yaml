            - call: "POST /segments"
              payload: { project_id: "${proj_v2}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_v2: $.data.id }
