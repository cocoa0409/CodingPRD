          assert:
            - "Ballot.${b1}.status == DRAFT after create"
            - "after first submit: Ballot.${b1}.status == SUBMITTED and Pairing.${p1}.status == BALLOT_SUBMITTED"
            - "after recall: Ballot.${b1}.status == DRAFT and Pairing.${p1}.status == BALLOT_RELEASED (cycle back)"
            - "second submit succeeds: Ballot.${b1}.status == SUBMITTED again"
            - "after verify: Ballot.${b1}.status == VERIFIED and Pairing.${p1}.status == VERIFIED and Pairing.${p1}.winner_entry_id == ${p1w}"

      - name: tournament_parallel_axes_independent_evolution
        grounds:
          - state_machines.Tournament.DRAFT_to_REGISTRATION_OPEN
          - state_machines.Tournament.REGISTRATION_OPEN_to_REGISTRATION_LOCKED
          - state_machines.Tournament.HIDDEN_to_PUBLISHED
          - entities.Tournament.fields.status
          - entities.Tournament.fields.results_visibility
        distinguishing_aspect: |
          Parallel state dimensions on Tournament (distinct entity from the Ballot cycle):
          the status axis advances DRAFT -> REGISTRATION_OPEN -> REGISTRATION_LOCKED ->
          PRELIMS_ACTIVE while the results_visibility axis stays HIDDEN throughout, and a
          visibility transition (publish) is rejected from a non-COMPLETED status — the two
          axes evolve independently and the combined state is observable at each step.
        test_recipe:
          setup:
            - "Empty tournament (no schools, no divisions), registration opened at the default clock, then locked at 2026-08-10 (aggregate school gate is vacuous with zero schools)."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Districts PA", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { t_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TournamentDirector }
            - { call: "POST /tournaments/${t}/lock-registration", payload: { expected_tournament_version: "${t_v}" }, as: TournamentDirector }
          trigger:
            - { call: "GET /tournaments/${t}", as: TournamentDirector }
            - { call: "POST /tournaments/${t}/publish-results", as: TournamentDirector, captures: { err1: $.data.error_id } }
            - { call: "POST /tournaments/${t}/start-prelims", as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector }
          assert:
            - "after open: Tournament.${t}.status == REGISTRATION_OPEN and results_visibility == HIDDEN"
            - "after lock: Tournament.${t}.status == REGISTRATION_LOCKED and results_visibility == HIDDEN (status axis moved, visibility did not)"
            - "publish attempt from REGISTRATION_LOCKED rejected with ERR_TOURNAMENT_PHASE_FORBIDDEN (visibility axis gated on status == COMPLETED)"
            - "after start-prelims: Tournament.${t}.status == PRELIMS_ACTIVE and results_visibility == HIDDEN"
  # ---------------------------------------------------------------- rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: entry_withdraw_triggers_hired_round_auto_release
        grounds:
          - state_machines.Entry.CONFIRMED_to_WITHDRAWN
          - state_machines.HiredJudgeContract.REQUESTED_to_CANCELLED
          - calculations.judge_obligation_rounds
          - calculations.judge_coverage_shortfall
          - calculations.school_invoice_total
        distinguishing_aspect: |
          Depth-3 cascade triggered by entry withdrawal (distinct trigger from the ballot
          void instance): (1) withdraw recomputes School.judge_obligation_rounds; (2) the
          obligation drop makes the REQUESTED contract's rounds surplus, auto-releasing all
          4 rounds and auto-cancelling the contract; (3) the contract mutation feeds the
          School.invoice_balance_cents recomputation. Each link is caused by the previous.
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 4, fee 2500); DEBATE/CX/VARSITY division; school Alpha with 4 confirmed entries (obligation 8) and 1 committed judge (4 rounds, shortfall 4); one REQUESTED contract for 4 rounds (quote 20000)."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Districts AR", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 4, entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "E-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "E-Two" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e2: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "E-Three" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e3: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "E-Four" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e4: $.data.id } }
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e2}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e3}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e4}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_a}", name: "J-Alpha" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { j_a: $.data.id } }
            - { call: "POST /judges/${j_a}/commit", payload: { commitment_rounds: 4 }, as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}", captures: { s_a_v: $.data.version } }
            - { call: "POST /hired-judge-contracts", payload: { school_id: "${s_a}", rounds_requested: 4, expected_school_version: "${s_a_v}" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { c_a: $.data.id } }
          trigger:
            - { call: "POST /entries/${e3}/withdraw", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e4}/withdraw", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /hired-judge-contracts/${c_a}", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}" }
          assert:
            - "School.${s_a}.judge_obligation_rounds == 4 (2 remaining entries -> ceil(2/2) * 4)"
            - "School.${s_a}.shortfall_rounds == 0 and obligation_status == SATISFIED (judge alone covers the reduced obligation)"
            - "HiredJudgeContract.${c_a}.rounds_released == 4 and status == CANCELLED (auto-release drained the surplus to zero)"
            - "School.${s_a}.invoice_balance_cents == 5000 (2 remaining entries x 2500; withdrawn entries left the invoice status set)"

      - name: ballot_void_reopens_round_and_recomputes_standings
        grounds:
          - state_machines.Ballot.VERIFIED_to_VOIDED
          - state_machines.Pairing.VERIFIED_to_BALLOT_RELEASED
          - state_machines.Round.TABULATED_to_BALLOTS_OPEN
          - calculations.speaker_point_tabulation
        distinguishing_aspect: |
          Depth-3 cascade triggered by ballot void (distinct trigger from entry withdraw):
          (1) void reverts its Pairing VERIFIED -> BALLOT_RELEASED and clears the winner;
          (2) the pairing leaving VERIFIED breaks the round's all-verified invariant,
          auto-reverting Round TABULATED -> BALLOTS_OPEN; (3) the reopen recomputes Entry
          stats excluding the voided ballot (winner drops from 1 win / 28 points to 0/0).
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 2) with DEBATE/CX/VARSITY division; schools A-D with 1 confirmed entry each; school E with 2 committed judges; locked; round 1 paired (A1,B1) and (C1,D1), staffed, balloted (A1 beats B1 28/26; C1 beats D1 27/25), both ballots VERIFIED; round 1 TABULATED (A1 wins 1, speaker_points_raw 28)."
