            - *c_ac2
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/aircraft/${ac2_id}/depart-origin"
              payload: {}
              as: GatewayCoordinator
            - call: "POST /airhub/aircraft/${ac2_id}/land"
              payload: { inbound_weight_grams: 40000 }
              as: GatewayCoordinator
            - call: "POST /airhub/aircraft/${ac2_id}/begin-unload"
              payload: {}
              as: SortSupervisor
            - call: "POST /airhub/aircraft/${ac2_id}/complete-unload"
              payload: { unload_completed_minutes: 1401 }
              as: SortSupervisor
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", tracking_number: "1Z-AC-0001", commodity_class: "GENERAL", destination_hub_code: "ORD", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_ac: $.data.id }
            - call: "POST /airhub/aircraft/${ac2_id}/cancel"
              payload: { cause_code: "MECHANICAL" }
              as: HubOpsManager
              captures: { held_status: $.data.status }
            - call: "GET /airhub/packages/${pkg_ac}"
              payload: {}
              as: CommitmentController
              captures: { held_commitment: $.data.commitment_status }
          trigger:
            - call: "POST /airhub/packages/${pkg_ac}/clear-upgrade-hold"
              payload: {}
              as: CommitmentController
              captures: { err: $.data.error_id }
          assert:
            - "the aircraft is ${held_status} == CANCELLED and the package is ${held_commitment} == UPGRADED_HELD with handling_status HOLD_AT_HUB"
            - "the clear is refused with ${err} == ERR_AIRCRAFT_NOT_CANCELLED even though the message reads as the inverse of the gate"
            - "Package.${pkg_ac}.commitment_status is still UPGRADED_HELD"
            - "the hub's contingency is not in force, so only the aircraft clause fails"

      - name: aircraft_maintenance_diversion_is_a_self_transition_that_clears_the_arrival_stamp
        claim_type: valid_transition
        grounds:
          - state_machines.Aircraft.transitions.IN_FLIGHT_to_IN_FLIGHT
          - errors.ERR_CONTINGENCY_NOT_DECLARED
        distinguishing_aspect: "POST /aircraft/{id}/divert-maintenance leaves status IN_FLIGHT and only flips maintenance_hold while clearing actual_arrival_minutes, so it is a self-transition whose observable effect is entirely on derived fields."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub with alternate IND, BANK_A with N701UP already UNLOADED and free, shift N-A, and a second aircraft N703UP in BANK_B that has landed."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/banks"
              payload: { hub_id: "${hub_id}", bank_code: "BANK_B", scheduled_start_minutes: 1400, scheduled_end_minutes: 1550, hydraulic_crew_available: true }
              as: HubOpsManager
              captures: { bank_b_id: $.data.id }
            - call: "POST /airhub/aircraft"
              payload: { bank_id: "${bank_b_id}", tail_number: "N703UP", origin_station_code: "DFW", scheduled_arrival_minutes: 1390, capacity_weight_grams: 200000 }
              as: GatewayCoordinator
              captures: { ac3_id: $.data.id }
            - call: "POST /airhub/aircraft/${ac3_id}/depart-origin"
              payload: {}
              as: GatewayCoordinator
          trigger:
            - call: "POST /airhub/aircraft/${ac3_id}/divert-maintenance"
              payload: {}
              as: WeatherOfficer
              captures: { err_cont: $.data.error_id }
            - call: "POST /airhub/hubs/${hub_id}/declare-contingency"
              payload: {}
              as: WeatherOfficer
            - call: "POST /airhub/aircraft/${ac3_id}/divert-maintenance"
              payload: {}
              as: WeatherOfficer
              captures: { after_status: $.data.status, after_hold: $.data.maintenance_hold, after_arrival: $.data.actual_arrival_minutes }
          assert:
            - "the diversion without a contingency returns 409 with ${err_cont} == ERR_CONTINGENCY_NOT_DECLARED"
            - "under contingency it succeeds and reports ${after_status} == IN_FLIGHT and ${after_hold} == true"
            - "Aircraft.${ac3_id}.actual_arrival_minutes is null, so the aircraft is excluded from every unload calculation"
            - "the parent bank's effective_sort_budget_minutes drops to 45 because a diverted aircraft contributes its full budget but no arrival slack"

      - name: package_load_and_unload_version_guards
        claim_type: valid_transition
        grounds:
          - state_machines.Package.transitions.SECONDARY_SORTED_to_LOADED
          - state_machines.Package.transitions.LOADED_to_SECONDARY_SORTED
        excluded_because:
          difficulty_instance: combinatorial_formula / forward_capacity_tier_derives_from_raw_value_and_override_is_discarded
          rationale: "Both directions of the load/unload round trip are asserted as the load path of the named §1.8 instance."

      - name: hub_posture_recompute_is_automatic_on_every_package_mutation
        claim_type: side_effect_execution
        grounds:
          - state_machines.Hub.transitions.OPEN_to_CONGESTED
          - calculations.live_planned_package_total
          - calculations.hub_posture
        excluded_because:
          difficulty_instance: dual_variant_calc / hub_posture_settled_vs_provisional_row_set_variant
          rationale: "The automatic posture recompute, including its settled row filter, is the subject of the named §1.8 instance."

      - name: ops_run_release_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.OpsRun.transitions.HELD_to_RELEASED
        excluded_because:
          difficulty_instance: transitive_cascade / ops_advance_three_hop_reroute_and_aircraft_reinstatement_cascade
          rationale: "The sibling transition's two-hop effects are the subject of the named §1.8 instance, which exercises the same HELD seed."

  # ===========================================================================
  - section: calculations
    instances:

      - name: commitment_cutoff_maps_each_service_level_to_its_own_slip
        claim_type: Correct Result
        grounds:
          - calculations.commitment_cutoff
          - entities.Package.fields.commitment_cutoff_minutes
        distinguishing_aspect: "The same hub close of 1560 yields three different cutoffs: NEXT_DAY_AIR 1560, SECOND_DAY_AIR 3000 and GROUND 4440, so the cutoff is a function of service level and not of the aircraft or the clock."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A, three GENERAL packages on the three service levels."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-CU-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_cu1: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-CU-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "SECOND_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_cu2: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-CU-0003", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "GROUND", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_cu3: $.data.id }
          trigger:
            - call: "GET /airhub/packages/${pkg_cu1}"
              payload: {}
              as: SortOperator
              captures: { cut1: $.data.commitment_cutoff_minutes }
            - call: "GET /airhub/packages/${pkg_cu2}"
              payload: {}
              as: SortOperator
              captures: { cut2: $.data.commitment_cutoff_minutes }
            - call: "GET /airhub/packages/${pkg_cu3}"
              payload: {}
              as: SortOperator
              captures: { cut3: $.data.commitment_cutoff_minutes }
          assert:
            - "Package.${pkg_cu1}.commitment_cutoff_minutes == ${cut1} == 1560 (hub close + 0)"
            - "Package.${pkg_cu2}.commitment_cutoff_minutes == ${cut2} == 3000 (hub close + 1440)"
            - "Package.${pkg_cu3}.commitment_cutoff_minutes == ${cut3} == 4440 (hub close + 2880)"
            - "all three packages share the same aircraft, hub and clock, so only service_level differs"

      - name: lane_load_excludes_loaded_packages_from_the_sum
        claim_type: Input Set Filtering
        grounds:
          - calculations.sort_lane_load
          - entities.SortLane.fields.lane_load_grams
          - endpoints.POST_/airhub/moves/{move_id}/load-package
        distinguishing_aspect: "The lane sum includes only PRIMARY_SORTED and SECONDARY_SORTED members, so onboarding a package onto a move drops lane_load_grams by that package's rated weight even though the package still exists on the hub."
        test_recipe:
          setup:
            - "Clock 1450. SDF hub, lanes P-01 and S-01 with capacity 400000, BANK_A with N701UP landed and unloaded, N702UP the move aircraft, shift N-A, load move M with weight_limit 400000, and one 40000-gram GENERAL package inducted and secondary-sorted."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "S-01", lane_kind: "SECONDARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_s1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_ac2
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/moves"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", weight_limit_grams: 400000 }
              as: LoadPlanner
              captures: { move_id: $.data.id, move_v0: $.data.version }
            - call: "POST /airhub/moves/${move_id}/plan-load"
              payload: {}
              as: LoadPlanner
              captures: { move_v1: $.data.version }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-LL-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 40000, dimension_weight_grams: 40000 }
              as: SortOperator
              captures: { pkg_ll: $.data.id }
            - call: "POST /airhub/packages/${pkg_ll}/induct"
              payload: { dimension_weight_grams: 40000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_ll}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_ll}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { pkg_ll_v: $.data.version }
          trigger:
            - call: "GET /airhub/lanes/${lane_s1_id}"
              payload: {}
              as: SortOperator
              captures: { load_before: $.data.lane_load_grams }
            - call: "POST /airhub/moves/${move_id}/load-package"
              payload: { package_id: "${pkg_ll}", expected_load_move_version: "${move_v1}", expected_package_version: "${pkg_ll_v}" }
              as: LoadPlanner
            - call: "GET /airhub/lanes/${lane_s1_id}"
              payload: {}
              as: SortOperator
              captures: { load_after: $.data.lane_load_grams }
            - call: "GET /airhub/packages/${pkg_ll}"
              payload: {}
              as: SortOperator
              captures: { after_sort: $.data.sort_status, after_lane: $.data.assigned_lane_id }
          assert:
            - "the lane reads ${load_before} == 40000 while the package is SECONDARY_SORTED"
            - "after onboarding the lane reads ${load_after} == 0 even though the package still exists"
            - "Package.${pkg_ll}.sort_status == ${after_sort} == LOADED and its assigned_lane_id ${after_lane} is null"
            - "GET /airhub/packages?hub_id=${hub_id} still returns 1 row, so the package was not deleted, only re-filtered out of the lane sum"
            - "Move.${move_id}.planned_weight_grams == 40000"

      - name: labor_posture_triggers_at_the_overrun_constant_and_red_dominates
        claim_type: Constants Applied
        grounds:
          - calculations.labor_variance_and_posture
          - constants.LABOR_OVERRUN_VARIANCE_PCT
          - constants.LABOR_UNDERSTAFF_VARIANCE_PCT
          - entities.LaborShift.fields.staffing_posture
        distinguishing_aspect: "The declared constants are applied exactly: with capacity_grams 504000 and forecast 380000 the shift reads AMBER at variance 0.1497, SATURATED at exactly 0.1500 (the >= boundary), and RED once the live total passes 504000 — the capacity rule taking precedence over the variance rule."
        test_recipe:
          setup:
