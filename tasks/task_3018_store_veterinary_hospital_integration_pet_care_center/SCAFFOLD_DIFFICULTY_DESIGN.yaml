              as: GroomingStaff
              captures: { booking_i_id: $.data.id }
          trigger:
            - call: "POST /stores/${store_i_id}/service-bookings"
              payload: { bay_id: "${bay_i1_id}", pet_id: "${pet_i2_id}", service_type: "GROOMING", starts_at: "2026-06-04T09:30:00Z", expected_pet_version: "${pet_i2_id_v}", ends_at: "2026-06-04T10:30:00Z" }
              as: GroomingStaff
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 422 with error_id ERR_BREED_NOT_GROOMABLE, not 409 ERR_BAY_SLOT_CONFLICT"
            - "no ServiceBooking row exists for pet Bruno, so the priority-9 conflict never had to be evaluated"

