            - "DisagreementRecord.${dis}.status == OPEN, rationale == null, resolution_method == null"
            - "ConsensusRound.${rnd}.status == DISPUTED and open_disagreement_count == 1"

      - name: lapsed_authorization_masks_fiscal_ceilings
        claim_type: priority_conflict
        grounds:
          - validations[priority 22 ERR_AUTHORIZATION_LAPSED]
          - validations[priority 56 ERR_ANNUAL_CAP_EXCEEDED]
          - validations[priority 57 ERR_INSUFFICIENT_RESERVE_BALANCE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / lapsed_authorization_at_priority_22_masks_both_fiscal_ceilings
          rationale: "The priority-22-over-56-and-57 masking, and the repair path that exposes each fiscal ceiling in turn, are asserted by the named §1.8 instance."

      - name: policy_window_overlap_is_half_open_per_category
        claim_type: temporal_validation
        grounds:
          - validations[priority 31 ERR_POLICY_WINDOW_OVERLAP]
          - validations[priority 30 ERR_INVALID_EFFECTIVE_WINDOW]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / policy_windows_are_half_open_so_adjacency_is_legal_per_category
          rationale: "Half-open adjacency, the one-day overlap and the per-category scoping of the overlap rule are asserted by the named §1.8 instance."

      - name: fiscal_year_withdrawals_aggregate_against_the_annual_cap
        claim_type: aggregate_validation
        grounds:
          - validations[priority 56 ERR_ANNUAL_CAP_EXCEEDED]
          - calculations.withdrawal_authorization
        excluded_because:
          difficulty_instance: resource_temporal_overlap / cooling_off_window_is_closed_at_its_boundary_and_fy_cap_aggregates
          rationale: "Individually-legal withdrawals that collectively breach the fiscal-year ceiling, and the closed cooling-off boundary, are asserted by the named §1.8 instance."

      - name: briefing_publication_depends_on_current_fund_version
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 40 ERR_ADEQUACY_STALE]
          - entities.RatingAgencyBriefing.fields.snapshot_fund_version
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / briefing_publication_depends_on_reserve_fund_version_being_current
          rationale: "Validity of a publish depending on another entity's version, in both the valid and invalid direction, is asserted by the named §1.8 instance."

  # ===========================================================================
  # SECTION 5 — Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: adequacy_read_before_any_certification_returns_null_requirement
        claim_type: computed_read
        grounds:
          - endpoints[GET /reserve-funds/{id}/adequacy]
          - calculations.reserve_adequacy
          - calculations.withdrawal_authorization
        distinguishing_aspect: |
          With no CERTIFIED cycle in existence the adequacy read is not an error and not zero
          throughout: reference_cycle_id, required_reserve_cents, cap_cents and headroom_cents are
          all null, the disclosure defaults stand (volatility_index_bps 0, target_pct_bps 500,
          coverage_ratio_bps 0, INSUFFICIENT, cushion 0, disclosed 500) — yet the two
          fiscal-year fields are already live, because they depend only on the fund itself:
          annual_withdrawal_cap_cents round_half_up(50000000 * 3000 / 10000) == 15000000 and
          cap_headroom_cents 15000000.
        test_recipe:
          setup:
            - "One fund with opening_balance_cents 50000000, annual_withdrawal_cap_pct_bps 3000, cap_pct_bps 1000. No ForecastCycle exists at all, so no reference cycle can be selected. Clock at 2026-08-01T00:00:00Z, i.e. FY2027, and no transaction has been minted, so fy_opening_balance_cents == opening_balance_cents."
          setup_api_calls:
            - { call: "POST /reserve-funds", payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 3, opening_balance_cents: 50000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { fnd: $.data.id } }
          trigger:
            - { call: "GET /reserve-funds/${fnd}/adequacy", payload: {}, as: RatingAnalyst, as_user_id: "ra-1" }
          assert:
            - "HTTP 200; response.fund_id == ${fnd} and reference_cycle_id == null"
            - "volatility_index_bps == 0, target_pct_bps == 500, required_reserve_cents == null, coverage_ratio_bps == 0"
            - "adequacy_band == INSUFFICIENT, cushion_credit_bps == 0, disclosed_target_pct_bps == 500"
            - "cap_cents == null and headroom_cents == null"
            - "annual_withdrawal_cap_cents == 15000000 and cap_headroom_cents == 15000000"
            - "ReserveFund.${fnd}.balance_cents == 50000000, fy_opening_balance_cents == 50000000, fy_withdrawn_cents == 0, deposit_posture == ACCEPTING, last_transaction_at == null"

      - name: revenue_source_patch_to_retired_then_blocks_dependent_writes
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /revenue-sources/{id}]
          - validations[priority 41 ERR_SOURCE_RETIRED]
          - entities.RevenueSource.fields.status
        distinguishing_aspect: |
          The update endpoint is the only way a source is retired — there is no delete and no retire
          action — and retirement is not cosmetic: the same POST /one-time-items that would have been
          accepted a moment earlier returns ERR_SOURCE_RETIRED 422, while the source itself remains
          readable with status RETIRED and version 2.
        test_recipe:
          setup:
            - "One ACTIVE PIT source and one DRAFT FY2027 cycle."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
          trigger:
            - { call: "PATCH /revenue-sources/${src_pit}", payload: { status: "RETIRED" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_v: $.data.version } }
            - { call: "POST /one-time-items", payload: { cycle_id: "${cyc}", source_id: "${src_pit}", item_type: "SETTLEMENT", amount_cents: 12000000, description: "Settlement booked against a retired source" }, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "first trigger: HTTP 200; RevenueSource.${src_pit}.status == RETIRED and ${src_v} == 2"
            - "first trigger: base_year_receipts_cents, the four elasticities and volatility_class are unchanged"
            - "second trigger: HTTP 422 and ${err} == ERR_SOURCE_RETIRED"
            - "GET /one-time-items with cycle_id ${cyc} returns total_count == 0"
            - "GET /revenue-sources with status RETIRED returns total_count == 1"

      - name: certify_action_writes_every_aggregate_and_owes_no_deposit_below_trend
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /forecast-cycles/{id}/certify]
          - calculations.reserve_deposit_amount
          - calculations.shortfall_trigger
          - calculations.reserve_adequacy
        distinguishing_aspect: |
          The certify action writes all four certified aggregates and both shortfall measures in one
          call, and it re-runs the deposit rule even when nothing is owed: the SHORT chain's measured
          recurring 1296456684 sits below the 1545000000 trend line, so excess and gross are 0, NO
          ReserveTransaction is minted at all (last_transaction_at stays null) — yet the fund's
          adequacy fields are still refreshed (cap_cents 129645668, required 64822834, coverage 7713)
          and its version still moves to 2.
        test_recipe:
          setup:
            - "SHORT chain in CONSENSUS_REACHED with a RATIFIED round (reconciled_total_cents 1296456684, no one-time item) and one GROWTH_ABOVE_TREND fund with opening_balance_cents 50000000, created before the certification."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/ratify", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /reserve-funds", payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 3, opening_balance_cents: 50000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { fnd: $.data.id } }
          trigger:
            - { call: "POST /forecast-cycles/${cyc}/certify", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v_certified: $.data.version } }
          assert:
            - "HTTP 200; ForecastCycle.${cyc}.status == CERTIFIED and certified_at == \"2026-08-01T00:00:00Z\""
            - "ForecastCycle.${cyc}.certified_total_cents == 1296456684, certified_one_time_cents == 0, certified_recurring_total_cents == 1296456684"
            - "ForecastCycle.${cyc}.shortfall_gap_cents == 353543316 and shortfall_pct_bps == 2142"
            - "GET /reserve-transactions with fund_id ${fnd} returns total_count == 0 (measured 1296456684 < trend line 1545000000, so gross was 0 and no row was minted)"
            - "ReserveFund.${fnd}.balance_cents == 50000000, last_transaction_at == null, deposit_posture == ACCEPTING, version == 2"
            - "ReserveFund.${fnd}.cap_cents == 129645668, required_reserve_cents == 64822834, coverage_ratio_bps == 7713, adequacy_band == ADEQUATE, disclosed_target_pct_bps == 500"

      - name: scenario_estimate_preview_matches_the_persisted_estimate
        claim_type: computed_read
        grounds:
          - endpoints[GET /forecast-cycles/{id}/scenario-estimates]
        excluded_because:
          difficulty_instance: combinatorial_formula / scenario_weighting_rounds_per_scenario_before_weighting
          rationale: "The preview read and the persisted estimate are asserted to agree on every term (weighted / policy / one-time / recurring / total) by the named §1.8 instance."

      - name: manual_deposit_allowed_only_within_remaining_headroom
        claim_type: conditional_action
        grounds:
          - endpoints[POST /reserve-funds/{id}/deposits]
          - validations[priority 55 ERR_DEPOSIT_EXCEEDS_CAP]
        excluded_because:
          difficulty_instance: boundary_precision_check / coverage_ratio_strong_band_at_exactly_10000_bps_versus_9999
          rationale: "The headroom-bounded manual deposit — accepted one cent below the ceiling, ERR_DEPOSIT_EXCEEDS_CAP one cent above it — is the vehicle of the named §1.8 boundary instance."

  # ===========================================================================
  # SECTION 6 — Errors
  # ===========================================================================
  - section: errors
    instances:
      - name: unknown_id_on_every_read_path_returns_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4 existence checks]
          - errors[ERR_SCENARIO_NOT_FOUND]
          - errors[ERR_ADJUSTMENT_NOT_FOUND]
          - errors[ERR_ONE_TIME_ITEM_NOT_FOUND]
          - errors[ERR_ROUND_NOT_FOUND]
          - errors[ERR_ESTIMATE_NOT_FOUND]
          - errors[ERR_DISAGREEMENT_NOT_FOUND]
          - errors[ERR_TRANSACTION_NOT_FOUND]
          - errors[ERR_REQUEST_NOT_FOUND]
          - errors[ERR_VOTE_NOT_FOUND]
          - errors[ERR_ACTUAL_NOT_FOUND]
          - errors[ERR_BRIEFING_NOT_FOUND]
        distinguishing_aspect: |
          Every entity in §1.1 owns its own 404 code, and each is reachable through its own read
          path: eleven reads against syntactically valid but unknown UUIDs return eleven DISTINCT
          error_ids, never a shared generic not-found.
        test_recipe:
          setup:
            - "Empty database. Every id below is a well-formed UUID that matches no row."
          setup_api_calls: []
          trigger:
            - { call: "GET /economic-scenarios/00000000-0000-0000-0000-000000000001", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { e1: $.data.error_id } }
            - { call: "GET /policy-adjustments/00000000-0000-0000-0000-000000000002", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { e2: $.data.error_id } }
