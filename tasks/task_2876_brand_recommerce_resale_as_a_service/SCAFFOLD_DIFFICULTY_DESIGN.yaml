      - name: cash_remainder_exactly_at_policy_minimum_is_accepted
        grounds:
          - calculations.resale_order_settlement
          - validations[priority=78]
          - entities.CreditPolicy.fields.min_cash_remainder_minor
          - errors[ERR_MIN_CASH_REMAINDER]
          - entities.ResaleOrder.fields.cash_due_minor
        distinguishing_aspect: |
          A different metric (cash_due_minor against CreditPolicy.min_cash_remainder_minor) tested
          at the opposite endpoint: this is a LOWER bound, inclusive. Requesting 20756 of credit
          leaves cash_due 499 and is refused; requesting one minor unit less leaves exactly 500
          and is accepted. The redemption cap is set to 10000 bp so the higher-priority rule 76
          cannot mask the boundary.
        test_recipe:
          setup:
            - "A single ACTIVE CreditPolicy with max_redemption_pct_bp 10000 and min_cash_remainder_minor 500, so only the cash-remainder floor can bind."
            - "Seller Ava's accepted OUTERWEAR grade B trade-in (msrp 50000) yields a unit refurbished with zero task lines and listed at list_price_minor 19500 on a RESALE_MARKETPLACE channel."
            - "Buyer Ben's accepted MAIL_IN FOOTWEAR grade A trade-in (msrp 120000) yields Ben exactly one CreditGrant of 48300, so the available-credit rule 77 cannot bind either."
            - "Order arithmetic: gross 19500 -> fee tier 1 (900 bp) -> 1755 -> order_total 21255, redemption cap floor(21255 * 10000 / 10000) = 21255."
