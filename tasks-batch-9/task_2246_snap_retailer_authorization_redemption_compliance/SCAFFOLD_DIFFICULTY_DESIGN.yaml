          assert:
            - "RedemptionPeriod.${pj_id}.size_expectation_cents == 1250000"
            - "RedemptionPeriod.${pj_id}.redemption_total_cents == 4375000"
            - "RedemptionPeriod.${pj_id}.transaction_count == 25"
            - "RedemptionPeriod.${pj_id}.anomaly_score == 92"
            - "RedemptionPeriod.${pj_id}.flag_level == FLAG_L3"
            - "RedemptionPeriod.${pj_id}.status == CLOSED"
            - "RedemptionPeriod.${pj_id}.reconciliation_status == VARIANCE"
            - "RedemptionPeriod.${pj_id}.reconciliation_variance_cents == 4375000"
            - "Store.${store_id}.redemption_flag_level == FLAG_L3"
            - "Store.${store_id}.sanction_status == UNDER_INVESTIGATION"
            - "GET /investigations?store_id=${store_id} returns exactly 1 Investigation with opened_reason == ANOMALY_FLAG_L3 and trigger_period_id == ${pj_id}"

  - rule_id: non_linear_state_machine
    instances:

      - name: application_deficiency_cycle_loops_twice_then_third_failure_denies
        grounds:
          - state_machines.Application.PENDING_VISIT_to_PENDING_DOCUMENTS
          - state_machines.Application.PENDING_DOCUMENTS_to_SUBMITTED
          - state_machines.Application.PENDING_VISIT_to_DENIED
          - entities.Application.fields.deficiency_cycle_count
          - entities.Application.fields.decision_reason_code
          - calculations.inspector_committed_minutes
        distinguishing_aspect: |
          Cyclic re-entry with a counted exit: PENDING_VISIT -> PENDING_DOCUMENTS ->
          SUBMITTED -> PENDING_VISIT is walked twice on the very same application, and
          the third identical failing findings call routes to DENIED instead of looping
          again because deficiency_cycle_count has reached 2. The trigger is byte-for-byte
          the same call that produced a 200-with-loop the first two times, so only the
          accumulated counter can explain the different destination.
        test_recipe:
          setup:
            - "The shared owner/store with a CRITERION_A application whose reported inventory passes the desk variant but whose observed inventory fails the on-site depth variant."
            - "One inspector and three PRE_AUTHORIZATION visit windows on 2026-08-01 at 00:00-02:00, 04:00-06:00 and 08:00-10:00, each started once the clock reaches its window_start."
            - "The first two failing findings calls drive PENDING_DOCUMENTS and are answered with a documents resubmission of the same inventory."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_div
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_div
            - &a_docs
              call: "POST /applications/${app_id}/documents"
              payload: { reported_inventory_lines: *inv_div }
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - call: "POST /store-visits"
              payload: { application_id: "${app_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T04:00:00Z", window_end: "2026-08-01T06:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T04:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "POST /store-visits/${visit2_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /store-visits/${visit2_id}/findings"
              payload: { observed_inventory_lines: *inv_div, observed_staple_shelf_linear_feet: 30 }
              as: Inspector
              as_user_id: "${insp_id}"
            - *a_docs
            - call: "POST /store-visits"
              payload: { application_id: "${app_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T10:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "POST /store-visits/${visit3_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /store-visits/${visit3_id}/findings"
              payload: { observed_inventory_lines: *inv_div, observed_staple_shelf_linear_feet: 30 }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "Application.${app_id}.status == DENIED"
            - "Application.${app_id}.deficiency_cycle_count == 3"
            - "Application.${app_id}.decision_reason_code == DEFICIENCY_CYCLES_EXHAUSTED"
            - "Application.${app_id}.decided_at == 2026-08-01T08:00:00Z"
            - "Application.${app_id}.verified_criterion_pass == false"
            - "StoreVisit.${visit_id}.status == FINDINGS_SUBMITTED"
            - "StoreVisit.${visit2_id}.status == FINDINGS_SUBMITTED"
            - "StoreVisit.${visit3_id}.status == FINDINGS_SUBMITTED"
            - "Store.${store_id}.authorization_status == NOT_AUTHORIZED"
            - "Store.${store_id}.fns_number == null"
            - "Inspector.${insp_id}.committed_minutes == 0"
            - "the second findings call returned 200 with status PENDING_DOCUMENTS while the identical third call returned 200 with status DENIED"

      - name: store_parallel_dimensions_move_independently_and_pair_gates_pos_sales
        grounds:
          - state_machines.Store.authorization_status
          - state_machines.Store.sanction_status
          - validations.priority_10_store_not_authorized
          - entities.Store.fields.sanction_status
          - entities.PosTransaction.fields.status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The two Store dimensions are driven apart on purpose: the store stays
          AUTHORIZED while sanction_status walks NONE -> UNDER_INVESTIGATION -> CHARGED
          and a determination lands, and POS sales keep succeeding the whole way. Only
          finalize couples the dimensions, flipping authorization_status to SUSPENDED,
          and the identical sale then fails. The same investigation that releases
          RESERVED deployments leaves the ACTIVE one alone, proving the cascade is
          state-conditional rather than blanket.
