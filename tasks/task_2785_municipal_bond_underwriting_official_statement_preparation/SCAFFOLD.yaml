scenario: |
  2785. Municipal Bond Underwriting & Official Statement Preparation (municipal underwriter and municipal
  advisor): transaction structuring with maturity schedule, call features and credit enhancement decisions,
  official statement drafting with continuing disclosure undertakings and material risk factors, rating agency
  presentation and credit review coordination, competitive versus negotiated sale determination and municipal
  advisor independence rules, order period, priority of orders and allotment among syndicate members, pricing,
  underwriter compensation disclosure and fair dealing obligations, closing documents, opinions and tax
  certificate execution, arbitrage yield restriction and post-issuance compliance handoff

domain_name: municipal-bond-underwriting
api_prefix: "/bond-offerings"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - conditional_feature_flags

  entity_topology: graph
  # Deal is a hub, but MaturityTranche.refunded_tranche_id and
  # OfficialStatementSection.parent_section_id are self-referential edges, Order is a
  # three-way junction (OrderPeriod x MaturityTranche x SyndicateMember), and
  # SyndicateMember is a Deal x Firm junction. URLs are a mix of flat collections and
  # sub-resources; nesting is never deeper than one level.

  state_machine_shape: cyclic
  # OfficialStatement: DRAFTING -> IN_REVIEW -> REVISION_REQUESTED -> DRAFTING (bounded loop).
  # RatingEngagement: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW (unbounded loop).
  # OrderPeriod: OPEN -> CLOSED -> OPEN (compensating loop that voids allotments).
  # Deal: branching fork-join STRUCTURING -> {PRICING_COMPETITIVE, PRICING_NEGOTIATED} -> PRICED
  #       with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # MSRB Rule G-23: the Firm engaged as the deal's municipal advisor may not also sit on the
  # underwriting syndicate for that deal. MSRB Rule G-17 fair dealing: the BondCounsel user who
  # authored an Official Statement section may not be the user who approves it.

  consistency_model: immediate
  difficulty_level: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Issuer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the governmental issuer
        constraints: "1..160 chars, non-blank"
      - name: state_code
        type: string
        source: input
        description: two-letter US state code of the issuer
        constraints: "exactly 2 uppercase letters"
      - name: entity_type
        type: enum
        source: input
        description: governmental character of the issuer, feeds the disclosure risk surcharge
        constraints: "one of {CITY, COUNTY, SCHOOL_DISTRICT, AUTHORITY, STATE}"
      - name: prior_late_annual_filings
        type: integer
        source: input
        description: count of annual financial reports filed after the undertaking deadline in the last five years
        default: 0
        constraints: ">= 0 and <= 20"
      - name: prior_late_event_notices
        type: integer
        source: input
        description: count of Rule 15c2-12 material event notices filed after the deadline in the last five years
        default: 0
        constraints: ">= 0 and <= 20"
      - name: has_prior_material_event
        type: boolean
        source: input
        description: whether a reportable material event (default, draw on reserve) occurred in the last five years
        default: false
      - name: is_bank_qualified_eligible
        type: boolean
        source: input
        description: whether the issuer expects to issue under the USD 10,000,000 bank-qualified limit this year
        default: false
      - name: disclosure_risk_score
        type: integer
        source: computed
        description: "0..100 continuing-disclosure risk score from calculations.issuer_disclosure_risk_score; gates the mandatory continuing-disclosure risk-factor section at the >= DISCLOSURE_RISK_GATE boundary"
        constraints: "integer in [0, 100]"

  - name: Firm
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: registered name of the broker-dealer or municipal advisory firm
        constraints: "1..160 chars, non-blank"
      - name: firm_type
        type: enum
        source: input
        description: MSRB registration category the firm may act under
        constraints: "one of {UNDERWRITER, MUNICIPAL_ADVISOR, DUAL_REGISTERED}"
      - name: msrb_registration_id
        type: string
        source: input
        description: MSRB registration identifier, unique across firms
        constraints: "exactly 6 chars, uppercase alphanumeric, globally unique"
      - name: is_suspended
        type: boolean
        source: input
        description: whether the firm is under regulatory suspension and barred from new engagements
        default: false

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - name: issuer_id
        type: string
        source: input
        description: "FK -> Issuer.id; the governmental issuer of this series"
      - name: municipal_advisor_firm_id
        type: string
        source: input
        description: "FK -> Firm.id; the engaged independent municipal advisor, null when no MA is engaged; the same Firm may never appear as a SyndicateMember on this Deal (MSRB G-23)"
        default: null
      - name: series_designation
        type: string
        source: input
        description: series label such as 'Series 2026A'
        constraints: "1..40 chars, non-blank, unique per issuer_id"
      - name: tax_status
        type: enum
        source: input
        description: federal tax treatment of the interest
        constraints: "one of {TAX_EXEMPT, TAXABLE, AMT}"
      - name: dated_date
        type: datetime
        source: input
        description: dated date of the bonds; every maturity and call date must be a whole number of semiannual periods after this instant
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: expected_par_amount_usd
        type: number
        source: input
        description: par amount the issuer authorized; the maturity schedule must sum to exactly this figure before structuring is submitted
        constraints: "> 0, multiple of 5000"
      - name: par_amount_usd
        type: number
        source: computed
        description: sum of MaturityTranche.principal_amount_usd over all tranches of this deal, set when structuring is submitted
        default: 0
      - name: sale_method
        type: enum
        source: system
        description: competitive versus negotiated sale determination, set by the designate-sale-method fork
        default: UNDETERMINED
        constraints: "one of {UNDETERMINED, COMPETITIVE, NEGOTIATED}"
      - name: status
        type: enum
        source: system
        description: transaction lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, STRUCTURING, PRICING_COMPETITIVE, PRICING_NEGOTIATED, PRICED, AWARDED, CLOSED, CANCELLED}"
      - name: disclosure_clearance
        type: enum
        source: computed
        description: derived disclosure gate recomputed on every OfficialStatement or OfficialStatementSection mutation; CLEARED only while the deal's governing OfficialStatement has mandatory_sections_approved true and status in {IN_REVIEW, PRELIMINARY_POSTED, FINAL_POSTED}; BLOCKED while that OS has mandatory_sections_approved false and status in {REVISION_REQUESTED, WITHDRAWN}; PENDING otherwise
        default: PENDING
        constraints: "one of {PENDING, CLEARED, BLOCKED}"
      - name: requires_g17_letter
        type: boolean
        source: system
        description: set true only on the NEGOTIATED branch of the sale-method fork; drives creation of the G17_DISCLOSURE_LETTER closing document at award
        default: false
      - name: requires_notice_of_sale
        type: boolean
        source: system
        description: set true only on the COMPETITIVE branch of the sale-method fork; drives creation of the NOTICE_OF_SALE_CERTIFICATE closing document at award
        default: false
      - name: gross_spread_basis
        type: enum
        source: system
        description: which variant of calculations.gross_spread_disclosure applies to this deal
        default: UNDETERMINED
        constraints: "one of {UNDETERMINED, COMPETITIVE, NEGOTIATED}"
      - name: takedown_per_bond_usd
        type: number
        source: system
        description: disclosed takedown per USD 1000 of par, supplied at pricing on the NEGOTIATED branch, 0 on the COMPETITIVE branch
        default: null
      - name: management_fee_per_bond_usd
        type: number
        source: system
        description: disclosed management fee per USD 1000 of par, supplied at pricing on the NEGOTIATED branch only
        default: null
      - name: expenses_per_bond_usd
        type: number
        source: system
        description: disclosed underwriter expenses per USD 1000 of par, supplied at pricing on the NEGOTIATED branch only
        default: null
      - name: winning_bid_price_pct
        type: number
        source: system
        description: winning bid price as a percent of par, supplied at pricing on the COMPETITIVE branch only
        default: null
      - name: issue_price_total_usd
        type: number
        source: computed
        description: aggregate reoffering proceeds from calculations.deal_issue_price_total, set at pricing
        default: null
      - name: gross_spread_total_usd
        type: number
        source: computed
        description: total underwriter compensation from calculations.gross_spread_disclosure, set at pricing
        default: null
      - name: gross_spread_per_bond_usd
        type: number
        source: computed
        description: gross_spread_total_usd expressed per USD 1000 of par, the figure disclosed in the Official Statement underwriting section
        default: null
      - name: credit_enhancement_premium_usd
        type: number
        source: computed
        description: committed credit enhancement premium from calculations.credit_enhancement_premium_and_net_proceeds; recomputed to 0.00 when the enhancement is withdrawn
        default: 0
      - name: net_proceeds_to_issuer_usd
        type: number
        source: computed
        description: "issue_price_total_usd - gross_spread_total_usd - credit_enhancement_premium_usd; the conserved money identity of this deal"
        default: null
      - name: arbitrage_yield_pct
        type: number
        source: computed
        description: bond-year-weighted issue yield from calculations.arbitrage_yield_and_restriction, set at pricing and required before the tax certificate may be executed
        default: null
      - name: par_allotted_total_usd
        type: number
        source: computed
        description: sum of MaturityTranche.par_allotted_usd across the deal; the conserved par identity of this deal
        default: 0
      - name: post_issuance_handoff_status
        type: enum
        source: system
        description: post-issuance compliance handoff state, must be READY before the tax certificate may be executed and before the deal may close
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, READY}"
      - name: record_retention_years
        type: integer
        source: system
        description: record retention commitment captured at handoff
        default: null
      - name: cancellation_reason
        type: string
        source: system
        description: reason recorded when the deal is cancelled
        default: null

  - name: MaturityTranche
    parent: Deal
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> Deal.id; the series this maturity belongs to"
      - name: sequence_number
        type: integer
        source: input
        description: position of this maturity in the schedule, unique per deal_id
        constraints: ">= 1 and <= 40, unique per deal_id"
      - name: maturity_date
        type: datetime
        source: input
        description: stated maturity, must be a whole number of semiannual periods after Deal.dated_date
        constraints: "ISO 8601 UTC with three fractional digits, strictly after Deal.dated_date"
      - name: principal_amount_usd
        type: number
        source: input
        description: principal maturing on maturity_date
        constraints: "> 0, multiple of 5000"
      - name: coupon_rate_pct
        type: number
        source: input
        description: annual coupon rate in percent, paid semiannually
        constraints: ">= 0 and <= 12, at most 3 decimal places"
      - name: yield_pct
        type: number
        source: input
        description: reoffering yield in percent used to price this maturity
        constraints: "> 0 and <= 12, at most 3 decimal places"
      - name: is_callable
        type: boolean
        source: input
        description: whether the maturity carries an optional redemption feature
        default: false
      - name: first_call_date
        type: datetime
        source: input
        description: first optional redemption date, required when is_callable is true, must be a whole number of semiannual periods after Deal.dated_date and strictly before maturity_date
        default: null
      - name: call_price_pct
        type: number
        source: input
        description: optional redemption price as a percent of par, required when is_callable is true
        default: null
        constraints: ">= 100 and <= 103 when present"
      - name: periods_to_maturity
        type: integer
        source: computed
        description: whole semiannual periods from Deal.dated_date to maturity_date
      - name: periods_to_call
        type: integer
        source: computed
        description: whole semiannual periods from Deal.dated_date to first_call_date, null when not callable
        default: null
      - name: price_to_maturity_pct
        type: number
        source: computed
        description: present value per 100 of par discounted to maturity_date, variant price_to_maturity of calculations.tranche_reoffering_price
      - name: price_to_call_pct
        type: number
        source: computed
        description: present value per 100 of par discounted to first_call_date at call_price_pct, variant price_to_call of calculations.tranche_reoffering_price, null when not callable
        default: null
      - name: reoffering_price_pct
        type: number
        source: computed
        description: the price actually used in the Official Statement, the lower of price_to_maturity_pct and price_to_call_pct
      - name: is_priced_to_call
        type: boolean
        source: computed
        description: true only when price_to_call_pct is strictly less than price_to_maturity_pct
        default: false
      - name: is_insured
        type: boolean
        source: input
        description: whether this maturity is proposed for credit enhancement; flipped to true when an enhancement naming it is committed and back to false when that enhancement is withdrawn
        default: false
      - name: rating_basis
        type: enum
        source: system
        description: whether the marketed rating on this maturity is the issuer underlying rating or the enhanced rating
        default: UNDERLYING
        constraints: "one of {UNDERLYING, ENHANCED}"
      - name: par_allotted_usd
        type: number
        source: computed
        description: sum of Order.par_allotted_usd over this tranche's orders whose status is in {ALLOTTED, PARTIALLY_ALLOTTED}
        default: 0
      - name: par_unsold_usd
        type: number
        source: computed
        description: "principal_amount_usd - par_allotted_usd; the balance retained by the syndicate"
        default: 0
      - name: refunded_tranche_id
        type: string
        source: input
        description: "FK -> MaturityTranche.id; the prior-issue maturity this tranche advance-refunds, null for new money; must belong to a different Deal whose status is CLOSED"
        default: null

  - name: CreditEnhancement
    parent: Deal
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> Deal.id; the series this enhancement proposal covers"
      - name: provider_name
        type: string
        source: input
        description: name of the insurer, bank or state intercept program
        constraints: "1..120 chars, non-blank"
      - name: enhancement_type
        type: enum
        source: input
        description: form of credit enhancement offered
        constraints: "one of {BOND_INSURANCE, LETTER_OF_CREDIT, STATE_INTERCEPT}"
      - name: enhanced_rating
        type: string
        source: input
        description: rating the enhancement carries, cleared to null when the enhancement is withdrawn
        constraints: "1..6 chars"
      - name: premium_bps
        type: number
        source: input
        description: premium in basis points applied to insured aggregate debt service
        constraints: "> 0 and <= 200, at most 2 decimal places"
      - name: insured_tranche_ids
        type: array
        source: input
        description: ids of the MaturityTranche rows this enhancement covers; every id must belong to deal_id
        constraints: "1..40 unique MaturityTranche ids"
      - name: status
        type: enum
        source: system
        description: enhancement negotiation state
        default: PROPOSED
        constraints: "one of {PROPOSED, COMMITTED, WITHDRAWN, DECLINED}"
      - name: insured_debt_service_usd
        type: number
        source: computed
        description: aggregate principal plus semiannual interest over the insured tranches, computed at commit
        default: null
      - name: premium_usd
        type: number
        source: computed
        description: premium in dollars from calculations.credit_enhancement_premium_and_net_proceeds, computed at commit
        default: null
      - name: withdrawal_reason
        type: string
        source: system
        description: reason recorded when a committed enhancement is withdrawn
        default: null

  - name: OfficialStatement
    parent: Deal
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> Deal.id; the series this disclosure document describes"
      - name: version_label
        type: string
        source: input
        description: drafting label such as 'POS v1'
        constraints: "1..40 chars, non-blank"
      - name: is_preliminary
        type: boolean
        source: input
        description: whether this document is drafted as a preliminary official statement
        default: true
      - name: status
        type: enum
        source: system
        description: drafting and posting state
        default: DRAFTING
        constraints: "one of {DRAFTING, IN_REVIEW, REVISION_REQUESTED, PRELIMINARY_POSTED, FINAL_POSTED, WITHDRAWN, SUPERSEDED}"
      - name: draft_round
        type: integer
        source: system
        description: number of drafting rounds consumed; starts at 1 and increments on every revision request; a request while draft_round equals MAX_DRAFT_ROUNDS is refused
        default: 1
      - name: mandatory_sections_approved
        type: boolean
        source: computed
        description: true only when every section_type in MANDATORY_SECTION_TYPES has at least one section on this OS with review_status APPROVED
        default: false
      - name: posted_preliminary_at
        type: datetime
        source: system
        description: logical clock instant the preliminary official statement was posted
        default: null
      - name: posted_final_at
        type: datetime
        source: system
        description: logical clock instant the final official statement was posted
        default: null
      - name: revision_reason
        type: string
        source: system
        description: reason recorded by the most recent revision request
        default: null

  - name: OfficialStatementSection
    parent: OfficialStatement
    common_fields: true
    fields:
      - name: official_statement_id
        type: string
        source: input
        description: "FK -> OfficialStatement.id; the document this section belongs to"
      - name: parent_section_id
        type: string
        source: input
        description: "FK -> OfficialStatementSection.id; the enclosing section for nested subsections, null for a top-level section; must belong to the same official_statement_id"
        default: null
      - name: section_code
        type: string
        source: input
        description: outline code such as 'RISK-03', unique per official_statement_id
        constraints: "1..16 chars, unique per official_statement_id"
      - name: title
        type: string
        source: input
        description: section heading printed in the document
        constraints: "1..160 chars, non-blank"
      - name: body_text
        type: string
        source: input
        description: section prose
        constraints: "1..8000 chars, non-blank"
      - name: section_type
        type: enum
        source: input
        description: disclosure category of the section
        constraints: "one of {RISK_FACTOR, TAX_MATTERS, CONTINUING_DISCLOSURE, UNDERWRITING, GENERAL}"
      - name: is_material_risk
        type: boolean
        source: input
        description: whether the section discloses a material risk factor
        default: false
      - name: references_credit_enhancement
        type: boolean
        source: input
        description: whether the section's prose depends on a committed credit enhancement; such sections are reopened when the enhancement is withdrawn
        default: false
      - name: review_status
        type: enum
        source: system
        description: bond counsel review state of this section
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED, NEEDS_REVISION}"
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the BondCounsel user who created the section; that user may not approve it (MSRB G-17 fair dealing separation)
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the BondCounsel user who approved the section
        default: null
      - name: word_count
        type: integer
        source: computed
        description: count of whitespace-delimited tokens in body_text, recomputed on every write

  - name: ContinuingDisclosureUndertaking
    parent: Deal
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> Deal.id; the series this undertaking binds"
      - name: annual_report_due_days
        type: integer
        source: input
        description: days after each fiscal year end by which the annual report must be filed
        constraints: ">= 120 and <= 270"
      - name: material_event_notice_days
        type: integer
        source: input
        description: days after a reportable event by which the notice must be filed; Rule 15c2-12 caps this at MAX_EVENT_NOTICE_DAYS
        constraints: ">= 1 and <= 10"
      - name: dissemination_agent
        type: string
        source: input
        description: name of the dissemination agent responsible for EMMA filings
        constraints: "1..120 chars, non-blank"
      - name: audited_financials_included
        type: boolean
        source: input
        description: whether audited financial statements are part of the annual report commitment
        default: true
      - name: status
        type: enum
        source: system
        description: undertaking lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED}"

  - name: RatingEngagement
    parent: Deal
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> Deal.id; the series under credit review"
      - name: agency
        type: enum
        source: input
        description: rating agency engaged; at most one non-WITHDRAWN engagement per deal and agency
        constraints: "one of {MOODYS, SP, FITCH, KBRA}"
      - name: status
        type: enum
        source: system
        description: credit review state
        default: REQUESTED
        constraints: "one of {REQUESTED, UNDER_REVIEW, INFO_REQUESTED, RATED, WITHDRAWN}"
      - name: assigned_analyst_user_id
        type: string
        source: system
        description: X-User-ID of the RatingAnalyst who acknowledged the engagement; only that user may request information or assign the rating
        default: null
      - name: info_request_count
        type: integer
        source: system
        description: number of information requests issued on this engagement, incremented by an analyst request and by the disclosure-block cascade
        default: 0
      - name: latest_information_request
        type: string
        source: system
        description: text of the most recent information request
        default: null
      - name: assigned_rating
        type: string
        source: system
        description: rating assigned at the end of credit review
        default: null
      - name: outlook
        type: enum
        source: system
        description: rating outlook assigned with the rating
        default: null
        constraints: "one of {POSITIVE, STABLE, NEGATIVE, DEVELOPING} when present"

  - name: RatingPresentation
    parent: RatingEngagement
    common_fields: true
    fields:
      - name: rating_engagement_id
        type: string
        source: input
        description: "FK -> RatingEngagement.id; the credit review this presentation supports"
      - name: starts_at
        type: datetime
        source: input
        description: start of the presentation window
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: ends_at
        type: datetime
        source: input
        description: end of the presentation window
        constraints: "strictly after starts_at, at most MAX_PRESENTATION_MINUTES (180) after starts_at"
      - name: attendee_count
        type: integer
        source: input
        description: number of issuer and advisor attendees
        constraints: ">= 1 and <= 25"
      - name: status
        type: enum
        source: system
        description: presentation state; SCHEDULED becomes HELD when the logical clock is advanced past ends_at
        default: SCHEDULED
        constraints: "one of {SCHEDULED, HELD, CANCELLED}"
      - name: cancellation_reason
        type: string
        source: system
        description: reason recorded when the presentation is cancelled by a cascade
        default: null

  - name: SyndicateMember
    parent: Deal
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> Deal.id; the series this underwriting commitment is on"
      - name: firm_id
        type: string
        source: input
        description: "FK -> Firm.id; the underwriting firm; may never equal Deal.municipal_advisor_firm_id (MSRB G-23)"
      - name: member_role
        type: enum
        source: input
        description: position in the underwriting syndicate; exactly one SENIOR_MANAGER per deal
        constraints: "one of {SENIOR_MANAGER, CO_MANAGER, SELLING_GROUP}"
      - name: liability_pct
        type: number
        source: input
        description: share of the underwriting liability in percent; ACTIVE members must sum to at most 100.0000 at all times and to exactly 100.0000 before a negotiated deal may be priced
        constraints: "> 0 and <= 100, at most 4 decimal places"
      - name: takedown_share_pct
        type: number
        source: input
        description: share of the syndicate takedown pot in percent, disclosed in the underwriting section
        constraints: "> 0 and <= 100, at most 4 decimal places"
      - name: priority_rank
        type: integer
        source: input
        description: syndicate seniority used only for reporting order, unique per deal_id
        constraints: ">= 1 and <= 40, unique per deal_id"
      - name: status
        type: enum
        source: system
        description: membership state
        default: ACTIVE
        constraints: "one of {ACTIVE, RESIGNED}"
      - name: liability_par_usd
        type: number
        source: computed
        description: liability_pct applied to Deal.par_amount_usd, recomputed whenever the schedule or the membership changes
        default: 0
      - name: takedown_credit_usd
        type: number
        source: computed
        description: takedown dollars earned on this member's allotted orders from calculations.syndicate_takedown_reconciliation
        default: 0

  - name: OrderPeriod
    parent: Deal
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> Deal.id; the series this order period collects orders for"
      - name: period_type
        type: enum
        source: input
        description: which investor class the period is opened for
        constraints: "one of {RETAIL, INSTITUTIONAL}"
      - name: opens_at
        type: datetime
        source: input
        description: inclusive start of the order window
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: closes_at
        type: datetime
        source: input
        description: exclusive end of the order window
        constraints: "strictly after opens_at"
      - name: priority_policy
        type: enum
        source: input
        description: conditional policy flag; RETAIL_ONLY restricts the period to RETAIL orders, STANDARD_PRIORITY admits every order type
        constraints: "one of {STANDARD_PRIORITY, RETAIL_ONLY}"
      - name: status
        type: enum
        source: system
        description: order period state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, OPEN, CLOSED, SETTLED, CANCELLED}"
      - name: allotment_run_count
        type: integer
        source: system
        description: number of times the allotment waterfall has been executed on this period
        default: 0
      - name: orders_received_count
        type: integer
        source: computed
        description: count of Order rows on this period whose status is not CANCELLED
        default: 0
      - name: allotted_order_count
        type: integer
        source: computed
        description: count of Order rows on this period whose status is in {ALLOTTED, PARTIALLY_ALLOTTED} after the most recent allotment run
        default: 0
      - name: reopen_reason
        type: string
        source: system
        description: reason recorded when a closed period is reopened and its allotments voided
        default: null

  - name: Order
    parent: OrderPeriod
    common_fields: true
    fields:
      - name: order_period_id
        type: string
        source: input
        description: "FK -> OrderPeriod.id; the period this order was entered in"
      - name: maturity_tranche_id
        type: string
        source: input
        description: "FK -> MaturityTranche.id; the maturity being ordered; must belong to the same deal as the order period"
      - name: syndicate_member_id
        type: string
        source: input
        description: "FK -> SyndicateMember.id; the syndicate member entering the order; must belong to the same deal as the order period"
      - name: order_type
        type: enum
        source: input
        description: priority class of the order, driving the allotment waterfall tier
        constraints: "one of {RETAIL, INSTITUTIONAL_PRIORITY, MEMBER, STOCK}"
      - name: par_requested_usd
        type: number
        source: input
        description: par requested at the stated price or yield
        constraints: "> 0, multiple of MIN_DENOMINATION_USD"
      - name: price_or_yield_pct
        type: number
        source: input
        description: price or yield the investor is willing to accept, recorded for the order book
        constraints: "> 0 and <= 130, at most 3 decimal places"
      - name: submitted_at
        type: datetime
        source: system
        description: logical clock instant the order was accepted; primary allotment sort key within a tier
      - name: par_allotted_usd
        type: number
        source: computed
        description: par allotted by calculations.order_allotment_waterfall, 0 until the period closes
        default: 0
      - name: status
        type: enum
        source: system
        description: order state after allotment
        default: PENDING
        constraints: "one of {PENDING, ALLOTTED, PARTIALLY_ALLOTTED, UNFILLED, CANCELLED}"
      - name: cancellation_reason
        type: string
        source: system
        description: reason recorded when the order is withdrawn via POST /bond-offerings/orders/{id}/cancel or when the deal cancellation cascade voids it
        default: null

  - name: ClosingDocument
    parent: Deal
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> Deal.id; the series this closing document belongs to"
      - name: doc_type
        type: enum
        source: system
        description: closing document category; the set created at award depends on the sale-method branch
        constraints: "one of {BOND_OPINION, TAX_CERTIFICATE, ISSUE_PRICE_CERTIFICATE, CONTINUING_DISCLOSURE_AGREEMENT, UNDERWRITER_RECEIPT, G17_DISCLOSURE_LETTER, NOTICE_OF_SALE_CERTIFICATE}"
      - name: is_required
        type: boolean
        source: system
        description: whether the deal may not close until this document is EXECUTED or WAIVED
        default: true
      - name: execution_status
        type: enum
        source: system
        description: execution state of the document
        default: PENDING
        constraints: "one of {PENDING, EXECUTED, WAIVED}"
      - name: signatory_role
        type: enum
        source: system
        description: the role that must execute this doc_type
        constraints: "one of {BondCounsel, IssuerOfficial, Underwriter, MunicipalAdvisor}"
      - name: signatory_name
        type: string
        source: input
        description: printed name of the person who executed the document
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: logical clock instant of execution
        default: null
      - name: waiver_reason
        type: string
        source: system
        description: reason recorded when the document requirement is waived
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Deal: branching fork-join. STRUCTURING forks into two pricing branches whose
  # side-effect sets differ, and the branches rejoin at PRICED.
  # ---------------------------------------------------------------------------
  - entity: Deal
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: STRUCTURING
        trigger: "POST /bond-offerings/deals/{id}/submit-structure"
        actor: MunicipalAdvisor
        preconditions:
          - "at least one MaturityTranche exists with deal_id == this deal"
          - "sum of MaturityTranche.principal_amount_usd over this deal == Deal.expected_par_amount_usd, else ERR_PAR_SCHEDULE_MISMATCH"
          - "every MaturityTranche.periods_to_maturity is a positive integer (already enforced at tranche creation)"
        side_effects:
          - "Deal.par_amount_usd = sum of MaturityTranche.principal_amount_usd over this deal"
          - "for every MaturityTranche of this deal, par_unsold_usd = principal_amount_usd and par_allotted_usd = 0"
          - "for every SyndicateMember of this deal with status ACTIVE, liability_par_usd = round(liability_pct / 100 * Deal.par_amount_usd, 2)"
          - "increments Deal.version by 1"

      - from: STRUCTURING
        to: PRICING_COMPETITIVE
        trigger: "POST /bond-offerings/deals/{id}/designate-sale-method with sale_method == COMPETITIVE"
        actor: MunicipalAdvisor | IssuerOfficial
        preconditions:
          - "Deal.municipal_advisor_firm_id is not null, else ERR_MA_ENGAGEMENT_REQUIRED"
          - "the Firm at Deal.municipal_advisor_firm_id has firm_type in {MUNICIPAL_ADVISOR, DUAL_REGISTERED} and is_suspended == false, else ERR_FIRM_SUSPENDED"
          - "no SyndicateMember row exists with deal_id == this deal, else ERR_SALE_METHOD_CONFLICT"
        side_effects:
          - "Deal.sale_method = COMPETITIVE"
          - "Deal.gross_spread_basis = COMPETITIVE"
          - "Deal.requires_notice_of_sale = true"
          - "Deal.requires_g17_letter stays false"
          - "increments Deal.version by 1"
        note: "COMPETITIVE branch: no pre-sale syndicate, exactly one INSTITUTIONAL order period permitted, compensation derives from the winning bid."

      - from: STRUCTURING
        to: PRICING_NEGOTIATED
        trigger: "POST /bond-offerings/deals/{id}/designate-sale-method with sale_method == NEGOTIATED"
        actor: MunicipalAdvisor | IssuerOfficial
        preconditions:
          - "exactly one SyndicateMember with deal_id == this deal, member_role == SENIOR_MANAGER and status == ACTIVE exists, else ERR_SENIOR_MANAGER_REQUIRED"
          - "the Firm of that SENIOR_MANAGER has is_suspended == false, else ERR_FIRM_SUSPENDED"
        side_effects:
          - "Deal.sale_method = NEGOTIATED"
          - "Deal.gross_spread_basis = NEGOTIATED"
          - "Deal.requires_g17_letter = true"
          - "Deal.requires_notice_of_sale stays false"
          - "increments Deal.version by 1"
        note: "NEGOTIATED branch: syndicate present, RETAIL and INSTITUTIONAL order periods both permitted, compensation is the disclosed component stack."

      - from: PRICING_COMPETITIVE
        to: PRICED
        trigger: "POST /bond-offerings/deals/{id}/price"
        actor: Underwriter
        preconditions:
          - "winning_bid_price_pct is present and takedown_per_bond_usd, management_fee_per_bond_usd and expenses_per_bond_usd are all absent, else ERR_COMPENSATION_INPUT_MISSING"
          - "no OrderPeriod of this deal has status OPEN, else ERR_PRICING_PRECONDITION_UNMET"
          - "at least one OrderPeriod of this deal has status CLOSED with allotment_run_count >= 1, else ERR_PRICING_PRECONDITION_UNMET"
          - "the governing OfficialStatement of this deal has status PRELIMINARY_POSTED, else ERR_DISCLOSURE_NOT_CLEARED"
          - "Deal.disclosure_clearance == CLEARED, else ERR_DISCLOSURE_NOT_CLEARED"
          - "net proceeds computed by calculations.credit_enhancement_premium_and_net_proceeds are > 0, else ERR_PREMIUM_EXCEEDS_PROCEEDS"
        side_effects:
          - "Deal.winning_bid_price_pct is stored, Deal.takedown_per_bond_usd = 0"
          - "Deal.issue_price_total_usd = calculations.deal_issue_price_total"
          - "Deal.gross_spread_total_usd and Deal.gross_spread_per_bond_usd = calculations.gross_spread_disclosure variant competitive_sale_basis"
          - "Deal.credit_enhancement_premium_usd and Deal.net_proceeds_to_issuer_usd = calculations.credit_enhancement_premium_and_net_proceeds"
          - "Deal.arbitrage_yield_pct = calculations.arbitrage_yield_and_restriction"
          - "for every SyndicateMember with status ACTIVE, takedown_credit_usd = calculations.syndicate_takedown_reconciliation (0.00 on the competitive branch because takedown_per_bond_usd is 0)"
          - "every OrderPeriod of this deal with status CLOSED transitions to SETTLED"
          - "increments Deal.version by 1"

      - from: PRICING_NEGOTIATED
        to: PRICED
        trigger: "POST /bond-offerings/deals/{id}/price"
        actor: Underwriter
        preconditions:
          - "takedown_per_bond_usd, management_fee_per_bond_usd and expenses_per_bond_usd are all present and winning_bid_price_pct is absent, else ERR_COMPENSATION_INPUT_MISSING"
          - "sum of SyndicateMember.liability_pct over members with status ACTIVE == 100.0000 exactly, else ERR_LIABILITY_PCT_SUM_INVALID"
          - "no OrderPeriod of this deal has status OPEN, else ERR_PRICING_PRECONDITION_UNMET"
          - "at least one OrderPeriod of this deal has status CLOSED with allotment_run_count >= 1, else ERR_PRICING_PRECONDITION_UNMET"
          - "the governing OfficialStatement of this deal has status PRELIMINARY_POSTED, else ERR_DISCLOSURE_NOT_CLEARED"
          - "Deal.disclosure_clearance == CLEARED, else ERR_DISCLOSURE_NOT_CLEARED"
          - "net proceeds computed by calculations.credit_enhancement_premium_and_net_proceeds are > 0, else ERR_PREMIUM_EXCEEDS_PROCEEDS"
        side_effects:
          - "Deal.takedown_per_bond_usd, Deal.management_fee_per_bond_usd and Deal.expenses_per_bond_usd are stored"
          - "Deal.issue_price_total_usd = calculations.deal_issue_price_total"
          - "Deal.gross_spread_total_usd and Deal.gross_spread_per_bond_usd = calculations.gross_spread_disclosure variant negotiated_sale_basis"
          - "Deal.credit_enhancement_premium_usd and Deal.net_proceeds_to_issuer_usd = calculations.credit_enhancement_premium_and_net_proceeds"
          - "Deal.arbitrage_yield_pct = calculations.arbitrage_yield_and_restriction"
          - "for every SyndicateMember with status ACTIVE, takedown_credit_usd = calculations.syndicate_takedown_reconciliation"
          - "every OrderPeriod of this deal with status CLOSED transitions to SETTLED"
          - "increments Deal.version by 1"

      - from: PRICED
        to: AWARDED
        trigger: "POST /bond-offerings/deals/{id}/award"
        actor: IssuerOfficial
        preconditions:
          - "Deal.net_proceeds_to_issuer_usd > 0, else ERR_PREMIUM_EXCEEDS_PROCEEDS"
          - "the governing OfficialStatement of this deal has status PRELIMINARY_POSTED, else ERR_OS_INVALID_STATE"
        side_effects:
          - "creates five ClosingDocument rows with execution_status PENDING and is_required true: BOND_OPINION (signatory_role BondCounsel), TAX_CERTIFICATE (IssuerOfficial), ISSUE_PRICE_CERTIFICATE (Underwriter), CONTINUING_DISCLOSURE_AGREEMENT (IssuerOfficial), UNDERWRITER_RECEIPT (Underwriter)"
          - "when Deal.requires_g17_letter is true, additionally creates a G17_DISCLOSURE_LETTER ClosingDocument with signatory_role Underwriter and is_required true"
          - "when Deal.requires_notice_of_sale is true, additionally creates a NOTICE_OF_SALE_CERTIFICATE ClosingDocument with signatory_role MunicipalAdvisor and is_required true"
          - "increments Deal.version by 1"
        note: "Divergent branch side effects rejoin here: a NEGOTIATED deal ends with six required closing documents, a COMPETITIVE deal with six of a different composition."

      - from: AWARDED
        to: CLOSED
        trigger: "POST /bond-offerings/deals/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "every ClosingDocument of this deal with is_required true has execution_status in {EXECUTED, WAIVED}, else ERR_CLOSING_DOCS_INCOMPLETE"
          - "the governing OfficialStatement of this deal has status FINAL_POSTED, else ERR_OS_NOT_FINAL_POSTED"
          - "Deal.post_issuance_handoff_status == READY, else ERR_POST_ISSUANCE_HANDOFF_INCOMPLETE"
        side_effects:
          - "increments Deal.version by 1"

      - from: DRAFT | STRUCTURING | PRICING_COMPETITIVE | PRICING_NEGOTIATED | PRICED
        to: CANCELLED
        trigger: "POST /bond-offerings/deals/{id}/cancel"
        actor: IssuerOfficial
        preconditions:
          - "Deal.status is not in {CLOSED, CANCELLED}, else ERR_DEAL_INVALID_STATE"
        side_effects:
          - "Deal.cancellation_reason = reason"
          - "every OfficialStatement of this deal with status in {DRAFTING, IN_REVIEW, REVISION_REQUESTED, PRELIMINARY_POSTED} transitions to WITHDRAWN"
          - "every Order of this deal with status in {PENDING, ALLOTTED, PARTIALLY_ALLOTTED, UNFILLED} transitions to CANCELLED with par_allotted_usd = 0 and cancellation_reason = 'DEAL_CANCELLED'"
          - "every OrderPeriod of this deal with status in {SCHEDULED, OPEN, CLOSED} transitions to CANCELLED"
          - "every MaturityTranche of this deal recomputes par_allotted_usd = 0 and par_unsold_usd = principal_amount_usd; Deal.par_allotted_total_usd = 0"
          - "every RatingEngagement of this deal with status in {REQUESTED, UNDER_REVIEW, INFO_REQUESTED} transitions to WITHDRAWN"
          - "every RatingPresentation with status SCHEDULED on those engagements transitions to CANCELLED with cancellation_reason = 'DEAL_CANCELLED'"
          - "every CreditEnhancement of this deal with status PROPOSED transitions to DECLINED; with status COMMITTED transitions to WITHDRAWN with withdrawal_reason = 'DEAL_CANCELLED'"
          - "increments Deal.version by 1"

  # ---------------------------------------------------------------------------
  # OfficialStatement: cyclic drafting loop with a hard round bound.
  # ---------------------------------------------------------------------------
  - entity: OfficialStatement
    initial_state: DRAFTING
    terminal_states: [FINAL_POSTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFTING
        to: IN_REVIEW
        trigger: "POST /bond-offerings/official-statements/{id}/submit-for-review"
        actor: BondCounsel
        preconditions:
          - "at least one OfficialStatementSection exists with official_statement_id == this OS, else ERR_OS_INVALID_STATE"
          - "Deal.status of the owning deal is not in {CLOSED, CANCELLED}, else ERR_DEAL_INVALID_STATE"
        side_effects:
          - "OfficialStatement.mandatory_sections_approved is recomputed"
          - "Deal.disclosure_clearance is recomputed"
          - "increments OfficialStatement.version by 1"

      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /bond-offerings/official-statements/{id}/request-revision"
        actor: MunicipalAdvisor
        preconditions:
          - "OfficialStatement.draft_round < MAX_DRAFT_ROUNDS, else ERR_REVISION_LIMIT_EXCEEDED"
        side_effects:
          - "hop 1: OfficialStatement.status = REVISION_REQUESTED, draft_round += 1, revision_reason = reason"
          - "hop 2, caused by hop 1: every OfficialStatementSection on this OS with section_type == RISK_FACTOR and review_status == APPROVED transitions to NEEDS_REVISION with approved_by_user_id = null"
          - "hop 3, caused by hop 2: OfficialStatement.mandatory_sections_approved is recomputed and becomes false because no APPROVED RISK_FACTOR section remains"
          - "hop 4, caused by hop 3: Deal.disclosure_clearance becomes BLOCKED because the governing OS now has mandatory_sections_approved false and status REVISION_REQUESTED"
          - "hop 5, caused by hop 4: every RatingPresentation with status SCHEDULED belonging to a RatingEngagement of this deal transitions to CANCELLED with cancellation_reason = 'DISCLOSURE_BLOCKED', and every RatingEngagement of this deal with status UNDER_REVIEW transitions to INFO_REQUESTED with info_request_count += 1 and latest_information_request = 'DISCLOSURE_BLOCKED_PENDING_OS_REVISION'"
          - "increments OfficialStatement.version by 1 and Deal.version by 1"

      - from: REVISION_REQUESTED
        to: DRAFTING
        trigger: "POST /bond-offerings/official-statements/{id}/resume-drafting"
        actor: BondCounsel
        preconditions:
          - "Deal.status of the owning deal is not in {CLOSED, CANCELLED}, else ERR_DEAL_INVALID_STATE"
        side_effects:
          - "Deal.disclosure_clearance is recomputed and becomes PENDING"
          - "increments OfficialStatement.version by 1 and Deal.version by 1"
        note: "Closes the cycle DRAFTING -> IN_REVIEW -> REVISION_REQUESTED -> DRAFTING."

      - from: IN_REVIEW
        to: PRELIMINARY_POSTED
        trigger: "POST /bond-offerings/official-statements/{id}/post-preliminary"
        actor: MunicipalAdvisor
        preconditions:
          - "OfficialStatement.mandatory_sections_approved == true, else ERR_MANDATORY_SECTION_NOT_APPROVED"
          - "a ContinuingDisclosureUndertaking with deal_id == this deal and status ACTIVE exists, else ERR_UNDERTAKING_NOT_ACTIVE"
          - "when Issuer.disclosure_risk_score >= DISCLOSURE_RISK_GATE, at least one OfficialStatementSection on this OS has section_type == CONTINUING_DISCLOSURE, is_material_risk == true and review_status == APPROVED, else ERR_DISCLOSURE_RISK_SECTION_REQUIRED"
          - "Deal.status is in {PRICING_COMPETITIVE, PRICING_NEGOTIATED}, else ERR_DEAL_INVALID_STATE"
        side_effects:
          - "OfficialStatement.posted_preliminary_at = logical clock"
          - "Deal.disclosure_clearance is recomputed and becomes CLEARED"
          - "increments OfficialStatement.version by 1 and Deal.version by 1"

      - from: PRELIMINARY_POSTED
        to: FINAL_POSTED
        trigger: "POST /bond-offerings/official-statements/{id}/post-final"
        actor: MunicipalAdvisor
        preconditions:
          - "Deal.status == AWARDED, else ERR_DEAL_INVALID_STATE"
          - "every OfficialStatementSection on this OS has review_status == APPROVED, else ERR_MANDATORY_SECTION_NOT_APPROVED"
        side_effects:
          - "OfficialStatement.posted_final_at = logical clock"
          - "Deal.disclosure_clearance stays CLEARED"
          - "increments OfficialStatement.version by 1"

      - from: DRAFTING | IN_REVIEW | REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "system event: a new OfficialStatement is created on the same deal via POST /bond-offerings/deals/{id}/official-statements"
        actor: system
        preconditions:
          - "the OS being superseded has status in {DRAFTING, IN_REVIEW, REVISION_REQUESTED}"
        side_effects:
          - "increments the superseded OfficialStatement.version by 1"
          - "Deal.disclosure_clearance is recomputed against the newly created OS"

      - from: DRAFTING | IN_REVIEW | REVISION_REQUESTED | PRELIMINARY_POSTED
        to: WITHDRAWN
        trigger: "system event: POST /bond-offerings/deals/{id}/cancel cascade"
        actor: system
        preconditions:
          - "the owning Deal transitions to CANCELLED"
        side_effects:
          - "Deal.disclosure_clearance is recomputed and becomes BLOCKED"
          - "increments OfficialStatement.version by 1"

  # ---------------------------------------------------------------------------
  # OfficialStatementSection: two-actor review with author/approver separation.
  # ---------------------------------------------------------------------------
  - entity: OfficialStatementSection
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /bond-offerings/os-sections/{id}/approve"
        actor: BondCounsel
        preconditions:
          - "OfficialStatementSection.review_status is in {DRAFT, NEEDS_REVISION}, else ERR_SECTION_INVALID_STATE"
          - "the owning OfficialStatement.status is in {DRAFTING, IN_REVIEW}, else ERR_OS_INVALID_STATE"
          - "X-User-ID != OfficialStatementSection.authored_by_user_id, else ERR_SECTION_SELF_APPROVAL"
        side_effects:
          - "OfficialStatementSection.approved_by_user_id = X-User-ID"
          - "OfficialStatement.mandatory_sections_approved is recomputed"
          - "Deal.disclosure_clearance is recomputed"
          - "increments OfficialStatementSection.version by 1 and OfficialStatement.version by 1"

      - from: NEEDS_REVISION
        to: APPROVED
        trigger: "POST /bond-offerings/os-sections/{id}/approve"
        actor: BondCounsel
        preconditions:
          - "the owning OfficialStatement.status is in {DRAFTING, IN_REVIEW}, else ERR_OS_INVALID_STATE"
          - "X-User-ID != OfficialStatementSection.authored_by_user_id, else ERR_SECTION_SELF_APPROVAL"
        side_effects:
          - "OfficialStatementSection.approved_by_user_id = X-User-ID"
          - "OfficialStatement.mandatory_sections_approved is recomputed"
          - "Deal.disclosure_clearance is recomputed"
          - "increments OfficialStatementSection.version by 1 and OfficialStatement.version by 1"

      - from: APPROVED
        to: NEEDS_REVISION
        trigger: "system event: POST /bond-offerings/official-statements/{id}/request-revision cascade (RISK_FACTOR sections) or POST /bond-offerings/credit-enhancements/{id}/withdraw cascade (sections with references_credit_enhancement true)"
        actor: system
        preconditions:
          - "OfficialStatementSection.review_status == APPROVED"
        side_effects:
          - "OfficialStatementSection.approved_by_user_id = null"
          - "OfficialStatement.mandatory_sections_approved is recomputed"
          - "increments OfficialStatementSection.version by 1"

  # ---------------------------------------------------------------------------
  # RatingEngagement: cyclic credit review with unbounded information rounds.
  # ---------------------------------------------------------------------------
  - entity: RatingEngagement
    initial_state: REQUESTED
    terminal_states: [RATED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /bond-offerings/rating-engagements/{id}/acknowledge"
        actor: RatingAnalyst
        preconditions:
          - "RatingEngagement.status == REQUESTED, else ERR_RATING_ENGAGEMENT_INVALID_STATE"
        side_effects:
          - "RatingEngagement.assigned_analyst_user_id = X-User-ID"
          - "increments RatingEngagement.version by 1"

      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /bond-offerings/rating-engagements/{id}/request-info"
        actor: RatingAnalyst
        preconditions:
          - "X-User-ID == RatingEngagement.assigned_analyst_user_id, else ERR_ROLE_IDENTITY_MISMATCH"
        side_effects:
          - "RatingEngagement.info_request_count += 1"
          - "RatingEngagement.latest_information_request = information_request"
          - "increments RatingEngagement.version by 1"

      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /bond-offerings/rating-engagements/{id}/respond-info"
        actor: MunicipalAdvisor
        preconditions:
          - "RatingEngagement.status == INFO_REQUESTED, else ERR_RATING_ENGAGEMENT_INVALID_STATE"
        side_effects:
          - "increments RatingEngagement.version by 1"
        note: "Closes the cycle UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW; info_request_count is the loop counter and is never reset."

      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "system event: POST /bond-offerings/official-statements/{id}/request-revision cascade hop 5"
        actor: system
        preconditions:
          - "Deal.disclosure_clearance transitioned to BLOCKED"
        side_effects:
          - "RatingEngagement.info_request_count += 1"
          - "RatingEngagement.latest_information_request = 'DISCLOSURE_BLOCKED_PENDING_OS_REVISION'"
          - "increments RatingEngagement.version by 1"

      - from: UNDER_REVIEW
        to: RATED
        trigger: "POST /bond-offerings/rating-engagements/{id}/assign-rating"
        actor: RatingAnalyst
        preconditions:
          - "X-User-ID == RatingEngagement.assigned_analyst_user_id, else ERR_ROLE_IDENTITY_MISMATCH"
          - "at least one RatingPresentation with rating_engagement_id == this engagement has status HELD, else ERR_PRESENTATION_REQUIRED"
        side_effects:
          - "RatingEngagement.assigned_rating = assigned_rating, RatingEngagement.outlook = outlook"
          - "increments RatingEngagement.version by 1"

      - from: REQUESTED | UNDER_REVIEW | INFO_REQUESTED
        to: WITHDRAWN
        trigger: "system event: POST /bond-offerings/deals/{id}/cancel cascade"
        actor: system
        preconditions:
          - "the owning Deal transitions to CANCELLED"
        side_effects:
          - "increments RatingEngagement.version by 1"

  # ---------------------------------------------------------------------------
  # RatingPresentation: clock-driven auto transition to HELD.
  # ---------------------------------------------------------------------------
  - entity: RatingPresentation
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "system event: POST /bond-offerings/_clock/set_current_utc advances the logical clock to an instant >= RatingPresentation.ends_at"
        actor: system
        preconditions:
          - "RatingPresentation.status == SCHEDULED and RatingPresentation.ends_at <= the new logical clock value"
        side_effects:
          - "increments RatingPresentation.version by 1"
        note: "Presentations are promoted in ascending (ends_at, created_at) order within one clock advance."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /bond-offerings/rating-presentations/{id}/cancel"
        actor: MunicipalAdvisor
        preconditions:
          - "RatingPresentation.status == SCHEDULED, else ERR_PRESENTATION_INVALID_STATE"
        side_effects:
          - "RatingPresentation.cancellation_reason = cancellation_reason"
          - "increments RatingPresentation.version by 1"
        note: "A cancelled slot no longer contends for the per-agency buffer, so the freed window may be rescheduled."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: POST /bond-offerings/official-statements/{id}/request-revision cascade hop 5, POST /bond-offerings/credit-enhancements/{id}/withdraw cascade, or POST /bond-offerings/deals/{id}/cancel cascade"
        actor: system
        preconditions:
          - "RatingPresentation.status == SCHEDULED"
        side_effects:
          - "RatingPresentation.cancellation_reason = 'DISCLOSURE_BLOCKED' or 'DEAL_CANCELLED'"
          - "increments RatingPresentation.version by 1"

  # ---------------------------------------------------------------------------
  # OrderPeriod: cyclic allotment loop; reopen is the compensating action that
  # must restore the conserved par identity exactly.
  # ---------------------------------------------------------------------------
  - entity: OrderPeriod
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /bond-offerings/order-periods/{id}/open"
        actor: Underwriter
        preconditions:
          - "Deal.status is in {PRICING_COMPETITIVE, PRICING_NEGOTIATED}, else ERR_DEAL_INVALID_STATE"
          - "no other OrderPeriod of the same deal has status OPEN, else ERR_ORDER_PERIOD_INVALID_STATE"
          - "the logical clock is >= OrderPeriod.opens_at and < OrderPeriod.closes_at, else ERR_ORDER_PERIOD_WINDOW_CLOSED"
        side_effects:
          - "increments OrderPeriod.version by 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /bond-offerings/order-periods/{id}/close"
        actor: Underwriter
        preconditions:
          - "OrderPeriod.status == OPEN, else ERR_ORDER_PERIOD_INVALID_STATE"
        side_effects:
          - "runs calculations.order_allotment_waterfall over every MaturityTranche of the deal, setting Order.par_allotted_usd and Order.status for every PENDING order in this period"
          - "OrderPeriod.allotment_run_count += 1; OrderPeriod.allotted_order_count is recomputed"
          - "every MaturityTranche touched recomputes par_allotted_usd and par_unsold_usd = principal_amount_usd - par_allotted_usd"
          - "Deal.par_allotted_total_usd = sum of MaturityTranche.par_allotted_usd over the deal"
          - "increments OrderPeriod.version by 1 and Deal.version by 1"
        note: "Closing with zero PENDING orders is legal: allotted_order_count becomes 0 and every tranche keeps par_unsold_usd == principal_amount_usd."

      - from: CLOSED
        to: OPEN
        trigger: "POST /bond-offerings/order-periods/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "OrderPeriod.status == CLOSED, else ERR_ORDER_PERIOD_INVALID_STATE"
          - "Deal.status is in {PRICING_COMPETITIVE, PRICING_NEGOTIATED}, else ERR_DEAL_INVALID_STATE"
          - "the logical clock is < OrderPeriod.closes_at, else ERR_ORDER_PERIOD_WINDOW_CLOSED"
        side_effects:
          - "hop 1: OrderPeriod.status = OPEN, reopen_reason = reason"
          - "hop 2, caused by hop 1: every Order in this period with status in {ALLOTTED, PARTIALLY_ALLOTTED, UNFILLED} returns to PENDING with par_allotted_usd = 0"
          - "hop 3, caused by hop 2: every MaturityTranche referenced by those orders recomputes par_allotted_usd from the surviving allotted orders and par_unsold_usd = principal_amount_usd - par_allotted_usd"
          - "hop 4, caused by hop 3: Deal.par_allotted_total_usd is recomputed and every SyndicateMember.takedown_credit_usd is recomputed by calculations.syndicate_takedown_reconciliation"
          - "increments OrderPeriod.version by 1 and Deal.version by 1"
        note: "Compensating action for the CLOSED allotment; the identity par_allotted_usd + par_unsold_usd == principal_amount_usd must hold before and after with zero drift."

      - from: CLOSED
        to: SETTLED
        trigger: "system event: POST /bond-offerings/deals/{id}/price"
        actor: system
        preconditions:
          - "the owning Deal transitions to PRICED"
        side_effects:
          - "increments OrderPeriod.version by 1"

      - from: SCHEDULED | OPEN | CLOSED
        to: CANCELLED
        trigger: "system event: POST /bond-offerings/deals/{id}/cancel cascade"
        actor: system
        preconditions:
          - "the owning Deal transitions to CANCELLED"
        side_effects:
          - "increments OrderPeriod.version by 1"

  # ---------------------------------------------------------------------------
  # Order: allotment outcome states, all driven by the order period's book.
  # ---------------------------------------------------------------------------
  - entity: Order
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: CANCELLED
        trigger: "POST /bond-offerings/orders/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "Order.status == PENDING, else ERR_ORDER_INVALID_STATE"
          - "the owning OrderPeriod.status == OPEN, else ERR_ORDER_PERIOD_INVALID_STATE"
          - "the logical clock is < OrderPeriod.closes_at, else ERR_ORDER_PERIOD_WINDOW_CLOSED"
        side_effects:
          - "Order.par_allotted_usd = 0 and Order.cancellation_reason = cancellation_reason"
          - "OrderPeriod.orders_received_count is recomputed"
          - "increments Order.version by 1 and OrderPeriod.version by 1"
        note: "Withdrawing an order is only possible while the book is OPEN; a cancelled order is excluded from every later allotment run."

      - from: PENDING
        to: ALLOTTED | PARTIALLY_ALLOTTED | UNFILLED
        trigger: "system event: POST /bond-offerings/order-periods/{id}/close"
        actor: system
        preconditions:
          - "Order.status == PENDING and the owning OrderPeriod transitions OPEN -> CLOSED"
        side_effects:
          - "Order.par_allotted_usd = the share assigned by calculations.order_allotment_waterfall; ALLOTTED when it equals par_requested_usd, PARTIALLY_ALLOTTED when it is between 1 and par_requested_usd - 1, UNFILLED when it is 0"
          - "increments Order.version by 1"

      - from: ALLOTTED | PARTIALLY_ALLOTTED | UNFILLED
        to: PENDING
        trigger: "system event: POST /bond-offerings/order-periods/{id}/reopen"
        actor: system
        preconditions:
          - "the owning OrderPeriod transitions CLOSED -> OPEN"
        side_effects:
          - "Order.par_allotted_usd = 0"
          - "increments Order.version by 1"
        note: "Closes the cycle PENDING -> allotment outcome -> PENDING; the par identity must be conserved across it."

      - from: PENDING | ALLOTTED | PARTIALLY_ALLOTTED | UNFILLED
        to: CANCELLED
        trigger: "system event: POST /bond-offerings/deals/{id}/cancel cascade"
        actor: system
        preconditions:
          - "the owning Deal transitions to CANCELLED"
        side_effects:
          - "Order.par_allotted_usd = 0 and Order.cancellation_reason = 'DEAL_CANCELLED'"
          - "increments Order.version by 1"

  # ---------------------------------------------------------------------------
  # CreditEnhancement: commit and its compensating withdrawal.
  # ---------------------------------------------------------------------------
  - entity: CreditEnhancement
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN, DECLINED]
    transitions:
      - from: PROPOSED
        to: COMMITTED
        trigger: "POST /bond-offerings/credit-enhancements/{id}/commit"
        actor: IssuerOfficial
        preconditions:
          - "CreditEnhancement.status == PROPOSED, else ERR_ENHANCEMENT_INVALID_STATE"
          - "Deal.status is in {STRUCTURING, PRICING_COMPETITIVE, PRICING_NEGOTIATED}, else ERR_DEAL_INVALID_STATE"
          - "no other CreditEnhancement of this deal has status COMMITTED, else ERR_ENHANCEMENT_ALREADY_COMMITTED"
        side_effects:
          - "every MaturityTranche whose id appears in insured_tranche_ids sets is_insured = true and rating_basis = ENHANCED"
          - "CreditEnhancement.insured_debt_service_usd and CreditEnhancement.premium_usd = calculations.credit_enhancement_premium_and_net_proceeds steps 4 and 5"
          - "Deal.credit_enhancement_premium_usd = CreditEnhancement.premium_usd"
          - "when Deal.status == PRICED, Deal.net_proceeds_to_issuer_usd is recomputed"
          - "increments CreditEnhancement.version by 1 and Deal.version by 1"

      - from: COMMITTED
        to: WITHDRAWN
        trigger: "POST /bond-offerings/credit-enhancements/{id}/withdraw"
        actor: IssuerOfficial
        preconditions:
          - "CreditEnhancement.status == COMMITTED, else ERR_ENHANCEMENT_INVALID_STATE"
          - "Deal.status is in {STRUCTURING, PRICING_COMPETITIVE, PRICING_NEGOTIATED, PRICED}, else ERR_DEAL_INVALID_STATE"
        side_effects:
          - "hop 1: CreditEnhancement.status = WITHDRAWN, enhanced_rating = null, withdrawal_reason = reason"
          - "hop 2, caused by hop 1: every MaturityTranche listed in insured_tranche_ids with is_insured true sets is_insured = false and rating_basis = UNDERLYING"
          - "hop 3, caused by hop 2: because the deal now has no insured tranche, Deal.credit_enhancement_premium_usd = 0.00 and, when Deal.status == PRICED, Deal.net_proceeds_to_issuer_usd = round(Deal.issue_price_total_usd - Deal.gross_spread_total_usd - 0.00, 2)"
          - "hop 4, caused by hop 3: because the disclosed proceeds figure changed, every OfficialStatementSection with references_credit_enhancement true and review_status APPROVED on the deal's governing OfficialStatement transitions to NEEDS_REVISION, OfficialStatement.mandatory_sections_approved is recomputed and Deal.disclosure_clearance becomes BLOCKED when the governing OS status is REVISION_REQUESTED or WITHDRAWN, PENDING otherwise"
          - "increments CreditEnhancement.version by 1 and Deal.version by 1"
        note: "Compensating action for commit; the identity issue_price_total_usd == net_proceeds_to_issuer_usd + gross_spread_total_usd + credit_enhancement_premium_usd must hold before and after."

      - from: PROPOSED
        to: DECLINED
        trigger: "system event: POST /bond-offerings/deals/{id}/cancel cascade"
        actor: system
        preconditions:
          - "the owning Deal transitions to CANCELLED"
        side_effects:
          - "increments CreditEnhancement.version by 1"

  # ---------------------------------------------------------------------------
  # ContinuingDisclosureUndertaking
  # ---------------------------------------------------------------------------
  - entity: ContinuingDisclosureUndertaking
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /bond-offerings/undertakings/{id}/activate"
        actor: IssuerOfficial
        preconditions:
          - "ContinuingDisclosureUndertaking.status == DRAFT, else ERR_UNDERTAKING_INVALID_STATE"
          - "Deal.status is not in {CLOSED, CANCELLED}, else ERR_DEAL_INVALID_STATE"
        side_effects:
          - "every other ContinuingDisclosureUndertaking of the same deal with status ACTIVE transitions to SUPERSEDED"
          - "increments ContinuingDisclosureUndertaking.version by 1"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: another ContinuingDisclosureUndertaking on the same deal is activated"
        actor: system
        preconditions:
          - "a sibling undertaking on the same deal transitions to ACTIVE"
        side_effects:
          - "increments ContinuingDisclosureUndertaking.version by 1"

  # ---------------------------------------------------------------------------
  # ClosingDocument: guarded execution with per-doc_type cross-entity gates.
  # ---------------------------------------------------------------------------
  - entity: ClosingDocument
    initial_state: PENDING
    terminal_states: [EXECUTED, WAIVED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /bond-offerings/closing-documents/{id}/execute"
        actor: BondCounsel | IssuerOfficial | Underwriter | MunicipalAdvisor
        preconditions:
          - "ClosingDocument.execution_status == PENDING, else ERR_CLOSING_DOC_ALREADY_EXECUTED"
          - "X-User-Role == ClosingDocument.signatory_role, else ERR_SIGNATORY_ROLE_INVALID"
          - "Deal.status == AWARDED, else ERR_DEAL_INVALID_STATE"
          - "when doc_type == BOND_OPINION, the governing OfficialStatement of the deal has status FINAL_POSTED, else ERR_OS_NOT_FINAL_POSTED"
          - "when doc_type == TAX_CERTIFICATE, Deal.arbitrage_yield_pct is not null and Deal.post_issuance_handoff_status == READY, else ERR_POST_ISSUANCE_HANDOFF_INCOMPLETE"
          - "when doc_type == CONTINUING_DISCLOSURE_AGREEMENT, a ContinuingDisclosureUndertaking of the deal has status ACTIVE, else ERR_UNDERTAKING_NOT_ACTIVE"
        side_effects:
          - "ClosingDocument.signatory_name = signatory_name, executed_at = logical clock"
          - "increments ClosingDocument.version by 1"

      - from: PENDING
        to: WAIVED
        trigger: "POST /bond-offerings/closing-documents/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "ClosingDocument.execution_status == PENDING, else ERR_CLOSING_DOC_ALREADY_EXECUTED"
          - "ClosingDocument.doc_type is not in {BOND_OPINION, TAX_CERTIFICATE}, else ERR_SIGNATORY_ROLE_INVALID"
          - "Deal.status == AWARDED, else ERR_DEAL_INVALID_STATE"
        side_effects:
          - "ClosingDocument.waiver_reason = reason"
          - "increments ClosingDocument.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: os-revision-create-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /bond-offerings/deals/{id}/official-statements"
    occ_field: "expected_deal_version"
    description: |
      Creating a new OfficialStatement against a Deal whose version has advanced since
      the client last observed it is rejected. Creating an OS legitimately supersedes
      the deal's prior non-terminal OS, so a writer holding a stale view of the deal
      would silently discard a drafting round it never saw; the stale-version check
      turns that into an explicit rejection.
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412

  - rule_id: order-place-stale-order-period
    parent_entity: OrderPeriod
    write_endpoint: "POST /bond-offerings/order-periods/{id}/orders"
    occ_field: "expected_order_period_version"
    description: |
      Placing an Order against an OrderPeriod whose version has advanced since the
      client last observed it is rejected. Order entry is legitimately repeatable, so
      nothing in the order-period state machine would refuse the write; the stale
      version is the only signal that the period was closed, reopened with its
      allotments voided, or otherwise re-shaped under the writer's feet.
    error_id: ERR_STALE_ORDER_PERIOD_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation & Aggregation Rules
# =============================================================================
calculations:

  - name: tranche_reoffering_price
    algorithm_type: threshold
    description: |
      Prices one MaturityTranche per USD 100 of principal on a semiannual actuarial basis and
      selects the reoffering price under the yield-to-worst convention. Two variants are ALWAYS
      both evaluated for a callable tranche and the lower price wins; a non-callable tranche has
      only the to-maturity variant.
    variants:
      - variant: price_to_maturity
        applies_when: "always (every tranche, callable or not)"
        formula: |
          n = periods_to_maturity
          i = yield_pct / 200                                  # semiannual yield, decimal
          c = coupon_rate_pct / 2                              # semiannual coupon per 100 of par
          v = (1 + i) ** (-n)
          annuity = (1 - v) / i
          price_to_maturity_pct = round(c * annuity + REDEMPTION_AT_MATURITY_PCT * v, 3)
      - variant: price_to_call
        applies_when: "is_callable == true (null when is_callable == false)"
        formula: |
          n = periods_to_call
          i = yield_pct / 200
          c = coupon_rate_pct / 2
          v = (1 + i) ** (-n)
          annuity = (1 - v) / i
          price_to_call_pct = round(c * annuity + call_price_pct * v, 3)
    formula: |
      periods_to_maturity = the whole number of semiannual periods from Deal.dated_date to
                            MaturityTranche.maturity_date (validated at creation:
                            maturity_date must land exactly on a semiannual anniversary of
                            dated_date, else ERR_MATURITY_DATE_UNALIGNED)
      periods_to_call     = same computation against first_call_date, null when is_callable is false

      Selection (yield-to-worst):
        if is_callable == false:
            reoffering_price_pct = price_to_maturity_pct
            is_priced_to_call    = false
        else if price_to_call_pct < price_to_maturity_pct:
            reoffering_price_pct = price_to_call_pct
            is_priced_to_call    = true
        else:
            # strictly-lower test: an exact tie resolves to the to-maturity variant
            reoffering_price_pct = price_to_maturity_pct
            is_priced_to_call    = false
    precision: "3 decimal places, ROUND_HALF_UP, applied to each variant independently before the comparison"
    constants:
      REDEMPTION_AT_MATURITY_PCT: 100.000
      SEMIANNUAL_PERIODS_PER_YEAR: 2
    input_set: "the single MaturityTranche being priced, plus Deal.dated_date"
    recompute_triggers:
      - "POST /bond-offerings/deals/{id}/maturity-tranches (creation)"
    worked_examples:
      - name: "non-callable premium tranche"
        inputs: "coupon_rate_pct 5.000, yield_pct 4.250, periods_to_maturity 20, is_callable false"
        outputs: "price_to_maturity_pct 106.058, price_to_call_pct null, reoffering_price_pct 106.058, is_priced_to_call false"
      - name: "callable premium tranche priced to call"
        inputs: "coupon_rate_pct 5.000, yield_pct 4.000, periods_to_maturity 40, is_callable true, periods_to_call 20, call_price_pct 100.000"
        outputs: "price_to_maturity_pct 113.678, price_to_call_pct 108.176, reoffering_price_pct 108.176, is_priced_to_call true"
      - name: "callable premium tranche with call premium"
        inputs: "coupon_rate_pct 5.000, yield_pct 4.000, periods_to_maturity 40, is_callable true, periods_to_call 20, call_price_pct 102.000"
        outputs: "price_to_call_pct 109.522, reoffering_price_pct 109.522, is_priced_to_call true"
      - name: "callable discount tranche priced to maturity"
        inputs: "coupon_rate_pct 3.000, yield_pct 4.000, periods_to_maturity 40, is_callable true, periods_to_call 20, call_price_pct 100.000"
        outputs: "price_to_maturity_pct 86.322, price_to_call_pct 91.824, reoffering_price_pct 86.322, is_priced_to_call false"
      - name: "par bond, exact tie"
        inputs: "coupon_rate_pct 4.000, yield_pct 4.000, periods_to_maturity 40, is_callable true, periods_to_call 20, call_price_pct 100.000"
        outputs: "price_to_maturity_pct 100.000, price_to_call_pct 100.000, reoffering_price_pct 100.000, is_priced_to_call false"

  - name: deal_issue_price_total
    algorithm_type: aggregation
    description: "Aggregate reoffering proceeds of the whole maturity schedule; the anchor of the money identity."
    formula: |
      for each MaturityTranche t of the deal (all tranches, no state filter, ordered by
      sequence_number ASC):
          tranche_proceeds_usd(t) = round(t.principal_amount_usd / 100 * t.reoffering_price_pct, 2)
      issue_price_total_usd = sum of tranche_proceeds_usd(t)
    precision: "2 decimal places, ROUND_HALF_UP, rounded PER TRANCHE and then summed (never summed first)"
    constants: {}
    input_set: "every MaturityTranche of the deal"
    recompute_triggers:
      - "POST /bond-offerings/deals/{id}/price"
    worked_examples:
      - name: "two-tranche schedule"
        inputs: "T1 principal 5000000, reoffering 106.058; T2 principal 5000000, reoffering 108.176"
        outputs: "tranche_proceeds 5302900.00 and 5408800.00, issue_price_total_usd 10711700.00"

  - name: gross_spread_disclosure
    algorithm_type: aggregation
    description: |
      Underwriter compensation disclosed under MSRB Rule G-17. The two sale methods derive the
      same disclosed figure from structurally different inputs: a negotiated sale builds the
      spread up from per-bond components, a competitive sale backs it out of the winning bid.
      Deal.gross_spread_basis selects the variant and is frozen at designate-sale-method time.
    variants:
      - variant: negotiated_sale_basis
        applies_when: "Deal.gross_spread_basis == NEGOTIATED"
        formula: |
          component_per_bond_usd = takedown_per_bond_usd
                                 + management_fee_per_bond_usd
                                 + expenses_per_bond_usd
          for each MaturityTranche t (ordered by sequence_number ASC):
              bonds(t) = t.principal_amount_usd / BOND_DENOMINATION_USD
              tranche_spread_usd(t) = round(bonds(t) * component_per_bond_usd, 2)
          gross_spread_total_usd = sum of tranche_spread_usd(t)
      - variant: competitive_sale_basis
        applies_when: "Deal.gross_spread_basis == COMPETITIVE"
        formula: |
          bid_proceeds_usd = round(Deal.par_amount_usd * winning_bid_price_pct / 100, 2)
          gross_spread_total_usd = round(Deal.issue_price_total_usd - bid_proceeds_usd, 2)
    formula: |
      gross_spread_per_bond_usd = round(gross_spread_total_usd
                                        / (Deal.par_amount_usd / BOND_DENOMINATION_USD), 3)
      # identical closing formula on both variants; only gross_spread_total_usd diverges
    precision: |
      PINNED ORDER, negotiated variant: round each tranche's spread to 2 decimals FIRST, then sum
      the rounded tranche figures. Summing bonds across tranches and rounding once at the end is
      a different (wrong) answer whenever a per-bond component has more than 2 significant
      decimals. gross_spread_per_bond_usd is 3 decimals, ROUND_HALF_UP, and is derived from the
      already-rounded gross_spread_total_usd, never recomputed from the components.
    constants:
      BOND_DENOMINATION_USD: 1000
    input_set: "every MaturityTranche of the deal; on the competitive variant, Deal.issue_price_total_usd computed in the same request"
    recompute_triggers:
      - "POST /bond-offerings/deals/{id}/price"
    worked_examples:
      - name: "negotiated"
        inputs: "takedown 5.000, management fee 2.500, expenses 1.250; T1 and T2 each 5000000 par (10000 bonds total)"
        outputs: "component_per_bond 8.750, tranche_spread 43750.00 and 43750.00, gross_spread_total_usd 87500.00, gross_spread_per_bond_usd 8.750"
      - name: "competitive"
        inputs: "par_amount_usd 10000000, winning_bid_price_pct 106.000, issue_price_total_usd 10711700.00"
        outputs: "bid_proceeds_usd 10600000.00, gross_spread_total_usd 111700.00, gross_spread_per_bond_usd 11.170"

  - name: credit_enhancement_premium_and_net_proceeds
    algorithm_type: constraint_propagation
    description: |
      Insurance premium and net proceeds to the issuer. The evaluation order is PINNED and
      single-pass: the premium is charged against total insured debt service, NOT against net
      proceeds, and net proceeds are never grossed up and re-fed into the premium. A
      fixed-point / iterative reading of this rule produces a different number.
    formula: |
      step 1: issue_price_total_usd = calculations.deal_issue_price_total
      step 2: gross_spread_total_usd = calculations.gross_spread_disclosure (variant per basis)
      step 3: insured_set = the MaturityTranches whose id appears in insured_tranche_ids of the
              deal's CreditEnhancement with status == COMMITTED; empty when no enhancement is
              COMMITTED
      step 4: for each t in insured_set (ordered by sequence_number ASC):
                  debt_service_usd(t) = round(t.principal_amount_usd
                        + t.principal_amount_usd * t.coupon_rate_pct / 100
                          / SEMIANNUAL_PERIODS_PER_YEAR * t.periods_to_maturity, 2)
              insured_debt_service_usd = sum of debt_service_usd(t)
      step 5: premium_usd = round(insured_debt_service_usd * premium_bps / BPS_DENOMINATOR, 2)
              credit_enhancement_premium_usd = premium_usd, or 0.00 when insured_set is empty
      step 6: net_proceeds_to_issuer_usd = round(issue_price_total_usd
                                                 - gross_spread_total_usd
                                                 - credit_enhancement_premium_usd, 2)
      Invariant that must hold after every write that touches any of these fields:
        issue_price_total_usd == net_proceeds_to_issuer_usd
                              + gross_spread_total_usd
                              + credit_enhancement_premium_usd
    precision: "2 decimal places, ROUND_HALF_UP, at each of steps 4, 5 and 6; debt service is rounded per tranche then summed"
    constants:
      BPS_DENOMINATOR: 10000
      SEMIANNUAL_PERIODS_PER_YEAR: 2
    input_set: "every MaturityTranche of the deal; the single COMMITTED CreditEnhancement if any (PROPOSED, WITHDRAWN and DECLINED enhancements are excluded)"
    recompute_triggers:
      - "POST /bond-offerings/deals/{id}/price"
      - "POST /bond-offerings/credit-enhancements/{id}/commit"
      - "POST /bond-offerings/credit-enhancements/{id}/withdraw"
    worked_examples:
      - name: "negotiated, T1 insured at 45 bps"
        inputs: "T1 principal 5000000 coupon 5.000 periods_to_maturity 20; issue_price_total 10711700.00; gross spread 87500.00; premium_bps 45"
        outputs: "insured_debt_service_usd 7500000.00, premium_usd 33750.00, net_proceeds_to_issuer_usd 10590450.00"
      - name: "negotiated, enhancement withdrawn"
        inputs: "same deal after POST /credit-enhancements/{id}/withdraw"
        outputs: "credit_enhancement_premium_usd 0.00, net_proceeds_to_issuer_usd 10624200.00"
      - name: "competitive, uninsured"
        inputs: "issue_price_total 10711700.00; gross spread 111700.00; no COMMITTED enhancement"
        outputs: "credit_enhancement_premium_usd 0.00, net_proceeds_to_issuer_usd 10600000.00"
      - name: "T2 insured at 45 bps"
        inputs: "T2 principal 5000000 coupon 5.000 periods_to_maturity 40; premium_bps 45"
        outputs: "insured_debt_service_usd 10000000.00, premium_usd 45000.00"

  - name: order_allotment_waterfall
    algorithm_type: waterfall_allocation
    description: |
      Allotment of a MaturityTranche's principal among the orders received in an order period,
      by priority of orders. Higher-priority tiers are satisfied in full before any lower tier
      receives a single bond; the tier that runs out of principal is pro-rated.
    formula: |
      Runs once per MaturityTranche of the deal, independently, when an OrderPeriod is closed.

      available_usd = t.principal_amount_usd - (par already allotted to t by other order periods
                      of the same deal, i.e. sum of par_allotted_usd over Orders on t with status
                      in {ALLOTTED, PARTIALLY_ALLOTTED} belonging to other order periods)

      candidates = Orders in this period with maturity_tranche_id == t.id and status == PENDING,
                   grouped by priority tier of order_type:
                       RETAIL                 -> tier 1
                       INSTITUTIONAL_PRIORITY -> tier 2
                       MEMBER                 -> tier 3
                       STOCK                  -> tier 4
                   and within a tier ordered by submitted_at ASC, then created_at ASC

      for tier in 1, 2, 3, 4:
          tier_demand = sum of par_requested_usd over the tier's candidates
          if tier_demand <= available_usd:
              every candidate is allotted its full par_requested_usd and status ALLOTTED
              available_usd -= tier_demand
          else:
              # pro-rata, floored to whole minimum denominations
              for each candidate o in tier order:
                  raw = available_usd * o.par_requested_usd / tier_demand
                  o.par_allotted_usd = floor(raw / MIN_DENOMINATION_USD) * MIN_DENOMINATION_USD
              remainder = available_usd - sum of the floored allotments
              # distribute the remainder in whole MIN_DENOMINATION_USD increments, one increment
              # per pass, in tier order (submitted_at ASC, then created_at ASC), skipping any
              # order already at its par_requested_usd, until remainder < MIN_DENOMINATION_USD
              available_usd = 0
          status per candidate:
              par_allotted_usd == par_requested_usd  -> ALLOTTED
              0 < par_allotted_usd < par_requested_usd -> PARTIALLY_ALLOTTED
              par_allotted_usd == 0                  -> UNFILLED
      after all tiers:
          t.par_allotted_usd = sum of par_allotted_usd over Orders on t with status in
                               {ALLOTTED, PARTIALLY_ALLOTTED}
          t.par_unsold_usd   = t.principal_amount_usd - t.par_allotted_usd
    precision: "whole USD; every allotted amount is an exact multiple of MIN_DENOMINATION_USD"
    constants:
      MIN_DENOMINATION_USD: 5000
      ORDER_PRIORITY_TIERS: "{RETAIL: 1, INSTITUTIONAL_PRIORITY: 2, MEMBER: 3, STOCK: 4}"
    input_set: "Orders in the closing period with status PENDING only; CANCELLED orders and orders from other periods are excluded from candidacy"
    recompute_triggers:
      - "POST /bond-offerings/order-periods/{id}/close"
      - "POST /bond-offerings/order-periods/{id}/reopen (voids the run, resetting every allotment to 0 and every order to PENDING)"
    worked_examples:
      - name: "tier 2 pro-rated, tier 3 starved"
        inputs: |
          tranche principal 5000000; O1 RETAIL 2005000 (submitted first), O2 INSTITUTIONAL_PRIORITY 2000000,
          O3 INSTITUTIONAL_PRIORITY 1500000, O4 MEMBER 1000000
        outputs: |
          O1 2005000 ALLOTTED; available 2995000 against tier-2 demand 3500000;
          raw shares 1711428.571... and 1283571.428..., floored 1710000 and 1280000, remainder 5000
          goes to O2 (earlier submitted_at): O2 1715000 PARTIALLY_ALLOTTED, O3 1280000
          PARTIALLY_ALLOTTED; O4 0 UNFILLED; tranche par_allotted_usd 5000000, par_unsold_usd 0
      - name: "no orders"
        inputs: "order period closed with zero PENDING orders"
        outputs: "allotment_run_count 1, allotted_order_count 0, every tranche keeps par_allotted_usd 0 and par_unsold_usd == principal_amount_usd"

  - name: syndicate_takedown_reconciliation
    algorithm_type: aggregation
    description: "Takedown credit earned by each syndicate member on the bonds it actually placed."
    formula: |
      for each SyndicateMember m of the deal with status == ACTIVE:
          for each Order o with syndicate_member_id == m.id and status in
              {ALLOTTED, PARTIALLY_ALLOTTED}, ordered by submitted_at ASC then created_at ASC:
              order_credit_usd(o) = round(o.par_allotted_usd / BOND_DENOMINATION_USD
                                          * Deal.takedown_per_bond_usd, 2)
          m.takedown_credit_usd = sum of order_credit_usd(o)
      Also: m.liability_par_usd = round(m.liability_pct / 100 * Deal.par_amount_usd, 2)
    precision: "2 decimal places, ROUND_HALF_UP, rounded PER ORDER then summed"
    constants:
      BOND_DENOMINATION_USD: 1000
    input_set: "Orders with status ALLOTTED or PARTIALLY_ALLOTTED only; PENDING, UNFILLED and CANCELLED orders contribute 0"
    recompute_triggers:
      - "POST /bond-offerings/deals/{id}/price"
      - "POST /bond-offerings/order-periods/{id}/reopen"
    worked_examples:
      - name: "two members, takedown 5.000 per bond"
        inputs: "M1 holds O1 2005000 and O2 1715000; M2 holds O3 1280000 and O4 (UNFILLED, 0)"
        outputs: "M1 takedown_credit_usd 18600.00, M2 takedown_credit_usd 6400.00, sum 25000.00"

  - name: arbitrage_yield_and_restriction
    algorithm_type: threshold
    description: |
      IRC section 148 arbitrage yield on the issue and the yield-restriction test applied to
      unspent proceeds. The permitted investment yield is the bond yield plus the one-eighth of
      one percent allowance; the test is a STRICT comparison, so a projected yield exactly equal
      to the permitted yield does not trigger restriction.
    formula: |
      for each MaturityTranche t of the deal:
          bond_years(t) = t.principal_amount_usd / BOND_DENOMINATION_USD
                          * t.periods_to_maturity / SEMIANNUAL_PERIODS_PER_YEAR
      arbitrage_yield_pct = round(sum(t.yield_pct * bond_years(t)) / sum(bond_years(t)), 4)
      permitted_investment_yield_pct = round(arbitrage_yield_pct + ONE_EIGHTH_ALLOWANCE_PCT, 4)
      yield_restriction_applies = projected_investment_yield_pct > permitted_investment_yield_pct
      if yield_restriction_applies:
          excess_earnings_usd = round(unspent_proceeds_usd
                * (projected_investment_yield_pct - permitted_investment_yield_pct) / 100
                * investment_days / ARBITRAGE_DAY_COUNT_BASIS, 2)
      else:
          excess_earnings_usd = 0.00
    precision: "arbitrage_yield_pct and permitted_investment_yield_pct 4 decimal places ROUND_HALF_UP; excess_earnings_usd 2 decimal places ROUND_HALF_UP"
    constants:
      ONE_EIGHTH_ALLOWANCE_PCT: 0.125
      ARBITRAGE_DAY_COUNT_BASIS: 360
      BOND_DENOMINATION_USD: 1000
      SEMIANNUAL_PERIODS_PER_YEAR: 2
    input_set: "every MaturityTranche of the deal; the projected yield, unspent proceeds and investment days are request inputs to the analysis endpoint"
    recompute_triggers:
      - "POST /bond-offerings/deals/{id}/price (stores Deal.arbitrage_yield_pct)"
      - "POST /bond-offerings/deals/{id}/yield-restriction-analysis (read-only projection)"
    worked_examples:
      - name: "two-tranche issue, restriction applies"
        inputs: "T1 yield 4.250 principal 5000000 periods 20; T2 yield 4.000 principal 5000000 periods 40; projected 4.600, unspent 5000000, investment_days 180"
        outputs: "bond_years 50000 and 100000, arbitrage_yield_pct 4.0833, permitted_investment_yield_pct 4.2083, yield_restriction_applies true, excess_earnings_usd 9792.50"
      - name: "projected exactly at the permitted yield"
        inputs: "same tranches; projected 4.2083"
        outputs: "yield_restriction_applies false, excess_earnings_usd 0.00"

  - name: issuer_disclosure_risk_score
    algorithm_type: weighted_scoring
    description: |
      Continuing-disclosure compliance risk of the issuer, derived from its Rule 15c2-12 filing
      history and governmental character. At or above DISCLOSURE_RISK_GATE the deal cannot post
      a preliminary official statement without an approved material continuing-disclosure risk
      factor section.
    formula: |
      raw = LATE_ANNUAL_FILING_WEIGHT * prior_late_annual_filings
          + LATE_EVENT_NOTICE_WEIGHT  * prior_late_event_notices
          + (MATERIAL_EVENT_WEIGHT if has_prior_material_event else 0)
          + ENTITY_TYPE_SURCHARGE[entity_type]
      disclosure_risk_score = min(100, max(0, raw))          # clamped to [0, 100]
      gate_applies = disclosure_risk_score >= DISCLOSURE_RISK_GATE      # inclusive at the gate
    precision: "integer arithmetic throughout; no rounding is possible"
    constants:
      LATE_ANNUAL_FILING_WEIGHT: 12
      LATE_EVENT_NOTICE_WEIGHT: 8
      MATERIAL_EVENT_WEIGHT: 25
      ENTITY_TYPE_SURCHARGE: "{CITY: 5, COUNTY: 5, SCHOOL_DISTRICT: 10, AUTHORITY: 15, STATE: 0}"
      DISCLOSURE_RISK_GATE: 40
    input_set: "the single Issuer being scored"
    recompute_triggers:
      - "POST /bond-offerings/issuers (creation)"
    worked_examples:
      - name: "clean state issuer"
        inputs: "entity_type STATE, 0 late annual, 0 late event, no material event"
        outputs: "disclosure_risk_score 0, gate_applies false"
      - name: "one below the gate"
        inputs: "entity_type AUTHORITY, 0 late annual, 3 late event notices, no material event"
        outputs: "disclosure_risk_score 39 (15 + 24), gate_applies false"
      - name: "exactly at the gate"
        inputs: "entity_type AUTHORITY, 0 late annual, 0 late event notices, has_prior_material_event true"
        outputs: "disclosure_risk_score 40 (15 + 25), gate_applies true"
      - name: "clamped"
        inputs: "entity_type AUTHORITY, 5 late annual, 5 late event notices, has_prior_material_event true"
        outputs: "raw 140, disclosure_risk_score 100, gate_applies true"

# =============================================================================
# 1.4 Validation Rules (evaluated in ascending priority; the first violated rule
#     is the only one reported)
# =============================================================================
validations:

  # --- priority 1-3: identity -------------------------------------------------
  - rule_id: auth-header-present
    priority: 1
    category: auth
    condition: "X-User-Id and X-User-Role headers are both present and non-blank"
    on_violation: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint"

  - rule_id: auth-role-permits-operation
    priority: 2
    category: auth
    condition: "X-User-Role is one of the roles listed for the endpoint in section 1.5"
    on_violation: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every authenticated endpoint"

  - rule_id: auth-identity-resolves
    priority: 3
    category: auth
    condition: |
      For an entity-backed role the acting principal resolves from X-User-Id alone (see section
      1.7 identity): X-User-Role IssuerOfficial requires X-User-Id to be the id of an existing
      Issuer; X-User-Role MunicipalAdvisor or Underwriter requires X-User-Id to be the id of an
      existing Firm whose firm_type admits the role (MUNICIPAL_ADVISOR or DUAL_REGISTERED for
      MunicipalAdvisor, UNDERWRITER or DUAL_REGISTERED for Underwriter).
    on_violation: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "every endpoint whose role list contains an entity-backed role"

  # --- priority 4: path existence --------------------------------------------
  - rule_id: path-resource-exists
    priority: 4
    category: existence
    condition: "every {id} path parameter names an existing row of the expected entity"
    on_violation: "the entity's not-found error: ERR_ISSUER_NOT_FOUND, ERR_FIRM_NOT_FOUND, ERR_DEAL_NOT_FOUND, ERR_TRANCHE_NOT_FOUND, ERR_OFFICIAL_STATEMENT_NOT_FOUND, ERR_SECTION_NOT_FOUND, ERR_UNDERTAKING_NOT_FOUND, ERR_ENHANCEMENT_NOT_FOUND, ERR_RATING_ENGAGEMENT_NOT_FOUND, ERR_PRESENTATION_NOT_FOUND, ERR_ORDER_PERIOD_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_CLOSING_DOCUMENT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  # --- priority 5-6: request shape -------------------------------------------
  - rule_id: request-shape-valid
    priority: 5
    category: schema
    condition: |
      Every required body field is present and non-null; every field has the declared type;
      enum fields carry a listed member; strings satisfy their length bounds; numbers satisfy
      their range bounds; datetimes are ISO 8601 UTC; no unknown top-level field is present.
    on_violation: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "every endpoint with a request body"

  - rule_id: pagination-params-valid
    priority: 6
    category: schema
    condition: "limit is an integer in [1, 100] and offset is an integer >= 0"
    on_violation: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "every list endpoint"

  # --- priority 7: body reference existence ----------------------------------
  - rule_id: body-reference-exists
    priority: 7
    category: existence
    condition: |
      Every foreign key supplied in the request body names an existing row: issuer_id,
      municipal_advisor_firm_id, firm_id, maturity_tranche_id, syndicate_member_id,
      refunded_tranche_id, parent_section_id and every member of insured_tranche_ids.
    on_violation: "the referenced entity's not-found error (see priority 4)"
    http_status: 404
    applies_to: "POST /bond-offerings/deals, POST /bond-offerings/deals/{id}/maturity-tranches, POST /bond-offerings/deals/{id}/credit-enhancements, POST /bond-offerings/deals/{id}/syndicate-members, POST /bond-offerings/order-periods/{id}/orders, POST /bond-offerings/official-statements/{id}/sections"

  # --- priority 8-9: ownership and tenancy -----------------------------------
  - rule_id: actor-owns-resource
    priority: 8
    category: ownership
    condition: |
      An IssuerOfficial may only act on a Deal whose issuer_id equals X-User-Id. A
      MunicipalAdvisor may only act on a Deal whose municipal_advisor_firm_id equals X-User-Id.
      An Underwriter may only act on a Deal on which the Firm identified by X-User-Id holds an
      ACTIVE SyndicateMember row, except on a COMPETITIVE deal, where any non-suspended
      UNDERWRITER firm may act, and except on POST /bond-offerings/deals/{id}/syndicate-members,
      where an unseated Underwriter may add its own firm (firm_id == X-User-Id).
    on_violation: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "every mutating deal-scoped endpoint"

  - rule_id: references-share-one-deal
    priority: 9
    category: integrity
    condition: |
      Every entity referenced together in one request belongs to the same Deal:
      Order.maturity_tranche_id and Order.syndicate_member_id must belong to the OrderPeriod's
      deal; insured_tranche_ids must all belong to the enhancement's deal;
      MaturityTranche.refunded_tranche_id must belong to a DIFFERENT deal of the SAME issuer (a
      refunding tranche never refunds a tranche of its own series);
      OfficialStatementSection.parent_section_id must belong to the same OfficialStatement.
    on_violation: ERR_CROSS_DEAL_REFERENCE
    http_status: 422
    applies_to: "POST /bond-offerings/order-periods/{id}/orders, POST /bond-offerings/deals/{id}/credit-enhancements, POST /bond-offerings/deals/{id}/maturity-tranches, POST /bond-offerings/official-statements/{id}/sections"

  # --- priority 10: optimistic concurrency -----------------------------------
  - rule_id: occ-deal-version-current
    priority: 10
    category: concurrency
    condition: "expected_deal_version equals the current Deal.version"
    on_violation: ERR_STALE_DEAL_VERSION
    http_status: 412
    applies_to: "POST /bond-offerings/deals/{id}/official-statements"

  - rule_id: occ-order-period-version-current
    priority: 10
    category: concurrency
    condition: "expected_order_period_version equals the current OrderPeriod.version"
    on_violation: ERR_STALE_ORDER_PERIOD_VERSION
    http_status: 412
    applies_to: "POST /bond-offerings/order-periods/{id}/orders"

  # --- priority 11: state ----------------------------------------------------
  - rule_id: state-transition-legal
    priority: 11
    category: state
    condition: "the entity's current state admits the requested transition per section 1.2"
    on_violation: "ERR_DEAL_INVALID_STATE, ERR_OS_INVALID_STATE, ERR_SECTION_INVALID_STATE, ERR_UNDERTAKING_INVALID_STATE, ERR_ENHANCEMENT_INVALID_STATE, ERR_RATING_ENGAGEMENT_INVALID_STATE, ERR_PRESENTATION_INVALID_STATE, ERR_ORDER_PERIOD_INVALID_STATE, ERR_ORDER_INVALID_STATE or ERR_CLOSING_DOC_ALREADY_EXECUTED, whichever entity is being transitioned"
    http_status: 409
    applies_to: "every action endpoint and every child-creation endpoint whose parent must be in a permitting state"

  # --- priority 12: MSRB conduct (business_safety) ---------------------------
  - rule_id: ma-underwriter-conflict
    priority: 12
    category: business_safety
    condition: |
      MSRB Rule G-23: the Firm engaged as Deal.municipal_advisor_firm_id may not be added as a
      SyndicateMember of the same Deal in any role, and a Deal may not designate as its municipal
      advisor a Firm that already holds a SyndicateMember row on that Deal.
    on_violation: ERR_MA_UNDERWRITER_CONFLICT
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/syndicate-members, POST /bond-offerings/deals"

  - rule_id: firm-not-suspended
    priority: 12
    category: business_safety
    condition: "a Firm with is_suspended true may not be engaged as municipal advisor, added as a SyndicateMember, or act as the Underwriter on a pricing action"
    on_violation: ERR_FIRM_SUSPENDED
    http_status: 422
    applies_to: "POST /bond-offerings/deals, POST /bond-offerings/deals/{id}/syndicate-members, POST /bond-offerings/deals/{id}/designate-sale-method, POST /bond-offerings/deals/{id}/price"

  - rule_id: ma-engagement-required-for-competitive
    priority: 12
    category: business_safety
    condition: "designating COMPETITIVE requires Deal.municipal_advisor_firm_id to be non-null and that Firm's firm_type to be MUNICIPAL_ADVISOR or DUAL_REGISTERED"
    on_violation: ERR_MA_ENGAGEMENT_REQUIRED
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/designate-sale-method"

  - rule_id: senior-manager-required-for-negotiated
    priority: 12
    category: business_safety
    condition: "designating NEGOTIATED requires exactly one ACTIVE SyndicateMember with member_role SENIOR_MANAGER on the deal"
    on_violation: ERR_SENIOR_MANAGER_REQUIRED
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/designate-sale-method"

  - rule_id: sale-method-precondition-consistent
    priority: 12
    category: business_safety
    condition: |
      Designating COMPETITIVE requires that no SyndicateMember row exists on the deal; a deal
      whose sale_method is already COMPETITIVE or NEGOTIATED may not be re-designated; an
      OrderPeriod with period_type RETAIL may not be created on a COMPETITIVE deal.
    on_violation: ERR_SALE_METHOD_CONFLICT
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/designate-sale-method, POST /bond-offerings/deals/{id}/order-periods"

  - rule_id: section-author-is-not-approver
    priority: 12
    category: business_safety
    condition: "MSRB Rule G-17 segregation of duties: X-User-Id approving an OfficialStatementSection differs from that section's authored_by_user_id"
    on_violation: ERR_SECTION_SELF_APPROVAL
    http_status: 422
    applies_to: "POST /bond-offerings/os-sections/{id}/approve"

  - rule_id: signatory-role-matches-document
    priority: 12
    category: business_safety
    condition: "X-User-Role equals ClosingDocument.signatory_role on execute; BOND_OPINION and TAX_CERTIFICATE may never be waived"
    on_violation: ERR_SIGNATORY_ROLE_INVALID
    http_status: 422
    applies_to: "POST /bond-offerings/closing-documents/{id}/execute, POST /bond-offerings/closing-documents/{id}/waive"

  # --- priority 13: disclosure adequacy (business_safety) --------------------
  - rule_id: mandatory-sections-approved
    priority: 13
    category: business_safety
    condition: |
      Posting a preliminary official statement requires OfficialStatement.mandatory_sections_approved
      true, i.e. at least one APPROVED section of each of section_type RISK_FACTOR, TAX_MATTERS,
      CONTINUING_DISCLOSURE and UNDERWRITING, with at least one APPROVED RISK_FACTOR section
      carrying is_material_risk true. Posting the final statement additionally requires every
      section on the statement to be APPROVED.
    on_violation: ERR_MANDATORY_SECTION_NOT_APPROVED
    http_status: 422
    applies_to: "POST /bond-offerings/official-statements/{id}/post-preliminary, POST /bond-offerings/official-statements/{id}/post-final"

  - rule_id: high-risk-issuer-needs-disclosure-section
    priority: 13
    category: business_safety
    condition: |
      When the deal's Issuer has disclosure_risk_score >= DISCLOSURE_RISK_GATE (40), the
      official statement must carry an APPROVED section with section_type CONTINUING_DISCLOSURE
      and is_material_risk true before the preliminary statement may be posted.
    on_violation: ERR_DISCLOSURE_RISK_SECTION_REQUIRED
    http_status: 422
    applies_to: "POST /bond-offerings/official-statements/{id}/post-preliminary"

  - rule_id: undertaking-active-required
    priority: 13
    category: business_safety
    condition: "a ContinuingDisclosureUndertaking with status ACTIVE exists on the deal"
    on_violation: ERR_UNDERTAKING_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /bond-offerings/official-statements/{id}/post-preliminary, POST /bond-offerings/closing-documents/{id}/execute"

  - rule_id: revision-rounds-bounded
    priority: 13
    category: business_safety
    condition: "OfficialStatement.draft_round < MAX_DRAFT_ROUNDS (4) when a revision is requested"
    on_violation: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /bond-offerings/official-statements/{id}/request-revision"

  - rule_id: final-statement-before-closing
    priority: 13
    category: business_safety
    condition: "closing the deal, and executing a BOND_OPINION, require the deal's governing OfficialStatement to have status FINAL_POSTED"
    on_violation: ERR_OS_NOT_FINAL_POSTED
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/close, POST /bond-offerings/closing-documents/{id}/execute"

  - rule_id: rating-requires-held-presentation
    priority: 13
    category: business_safety
    condition: "assigning a rating requires at least one RatingPresentation with status HELD on the engagement"
    on_violation: ERR_PRESENTATION_REQUIRED
    http_status: 422
    applies_to: "POST /bond-offerings/rating-engagements/{id}/assign-rating"

  - rule_id: disclosure-cleared-for-pricing
    priority: 13
    category: business_safety
    condition: "Deal.disclosure_clearance == CLEARED and the governing OfficialStatement has status PRELIMINARY_POSTED"
    on_violation: ERR_DISCLOSURE_NOT_CLEARED
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/price"

  - rule_id: pricing-order-book-complete
    priority: 13
    category: business_safety
    condition: "no OrderPeriod of the deal is OPEN and at least one OrderPeriod is CLOSED with allotment_run_count >= 1"
    on_violation: ERR_PRICING_PRECONDITION_UNMET
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/price"

  # --- priority 14: temporal (business_temporal) -----------------------------
  - rule_id: order-period-no-overlap
    priority: 14
    category: business_temporal
    condition: |
      A new OrderPeriod's [opens_at, closes_at) half-open window must not overlap any existing
      non-CANCELLED OrderPeriod of the same Deal. Abutting windows (one period's closes_at equal
      to the next period's opens_at) do NOT overlap and are permitted. opens_at < closes_at.
    on_violation: ERR_ORDER_PERIOD_OVERLAP
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/order-periods"

  - rule_id: presentation-buffer-per-agency
    priority: 14
    category: business_temporal
    condition: |
      A new RatingPresentation's [starts_at, ends_at] CLOSED interval, expanded by
      PRESENTATION_BUFFER_MINUTES (60) on both sides, must not contain any instant of an existing
      non-CANCELLED RatingPresentation belonging to a RatingEngagement of the SAME Deal with the
      SAME agency. A gap of exactly 60 minutes between one presentation's ends_at and the next
      presentation's starts_at is permitted; 59 minutes is not. Presentations for different
      agencies on the same deal may overlap freely. attendee_count is in [1, 25].
    on_violation: ERR_PRESENTATION_BUFFER_CONFLICT
    http_status: 422
    applies_to: "POST /bond-offerings/rating-engagements/{id}/presentations"

  - rule_id: order-window-open
    priority: 14
    category: business_temporal
    condition: |
      Opening an OrderPeriod requires the logical clock to satisfy
      opens_at <= now < closes_at; reopening additionally requires now < closes_at; placing an
      Order requires the period status OPEN and now < closes_at.
    on_violation: ERR_ORDER_PERIOD_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /bond-offerings/order-periods/{id}/open, POST /bond-offerings/order-periods/{id}/reopen, POST /bond-offerings/order-periods/{id}/orders"

  - rule_id: maturity-dates-aligned
    priority: 14
    category: business_temporal
    condition: |
      MaturityTranche.maturity_date must fall exactly on a semiannual anniversary of
      Deal.dated_date and be strictly after it; when is_callable is true, first_call_date must
      also fall exactly on a semiannual anniversary of dated_date.
    on_violation: ERR_MATURITY_DATE_UNALIGNED
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/maturity-tranches"

  # --- priority 15: structural constraints (business_constraint) -------------
  - rule_id: call-feature-coherent
    priority: 15
    category: business_constraint
    condition: |
      When is_callable is true, first_call_date and call_price_pct are both required,
      first_call_date is strictly before maturity_date, and call_price_pct is in [100.000,
      103.000]. When is_callable is false, first_call_date and call_price_pct must both be
      absent.
    on_violation: ERR_CALL_FEATURE_INVALID
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/maturity-tranches"

  - rule_id: denomination-multiple
    priority: 15
    category: business_constraint
    condition: "MaturityTranche.principal_amount_usd and Order.par_requested_usd are positive whole multiples of MIN_DENOMINATION_USD (5000)"
    on_violation: ERR_DENOMINATION_INVALID
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/maturity-tranches, POST /bond-offerings/order-periods/{id}/orders"

  - rule_id: par-schedule-matches-authorization
    priority: 15
    category: business_constraint
    condition: "the sum of MaturityTranche.principal_amount_usd over the deal equals Deal.expected_par_amount_usd exactly when structuring is submitted"
    on_violation: ERR_PAR_SCHEDULE_MISMATCH
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/submit-structure"

  - rule_id: tranche-sequence-unique
    priority: 15
    category: business_constraint
    condition: "MaturityTranche.sequence_number is unique within the deal and maturity_date strictly increases with sequence_number"
    on_violation: ERR_TRANCHE_SEQUENCE_CONFLICT
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/maturity-tranches"

  - rule_id: syndicate-member-unique
    priority: 15
    category: business_constraint
    condition: "at most one non-RESIGNED SyndicateMember row per (deal_id, firm_id); at most one SENIOR_MANAGER per deal; priority_rank unique among ACTIVE members of the deal"
    on_violation: ERR_DUPLICATE_SYNDICATE_MEMBER
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/syndicate-members"

  - rule_id: rating-engagement-unique
    priority: 15
    category: business_constraint
    condition: "at most one non-WITHDRAWN RatingEngagement per (deal_id, agency)"
    on_violation: ERR_DUPLICATE_RATING_ENGAGEMENT
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/rating-engagements"

  - rule_id: refunded-tranche-eligible
    priority: 15
    category: business_constraint
    condition: |
      When refunded_tranche_id is supplied, the referenced MaturityTranche must belong to a Deal
      with status CLOSED, must not already be referenced as refunded_tranche_id by another
      tranche, and must not be the tranche itself.
    on_violation: ERR_REFUNDED_TRANCHE_INVALID
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/maturity-tranches"

  - rule_id: order-type-permitted-in-period
    priority: 15
    category: business_constraint
    condition: |
      Orders of order_type RETAIL may only be placed into an OrderPeriod with period_type
      RETAIL. When an OrderPeriod's priority_policy is RETAIL_ONLY, only order_type RETAIL is
      accepted. An order_type MEMBER or STOCK order requires the referenced SyndicateMember to
      have member_role SENIOR_MANAGER or CO_MANAGER.
    on_violation: ERR_ORDER_TYPE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /bond-offerings/order-periods/{id}/orders"

  - rule_id: natural-keys-unique
    priority: 15
    category: business_constraint
    condition: "Firm.msrb_registration_id is globally unique; Deal.series_designation is unique within its issuer_id"
    on_violation: "ERR_DUPLICATE_MSRB_REGISTRATION on firms, ERR_DUPLICATE_SERIES_DESIGNATION on deals"
    http_status: 422
    applies_to: "POST /bond-offerings/firms, POST /bond-offerings/deals"

  # --- priority 16: fiscal (business_fiscal) --------------------------------
  - rule_id: liability-shares-sum-to-whole
    priority: 16
    category: business_fiscal
    condition: |
      The sum of liability_pct over ACTIVE SyndicateMembers of a deal may never exceed 100.0000
      when a member is added, and must equal exactly 100.0000 when a NEGOTIATED deal is priced.
      The same bound applies to takedown_share_pct.
    on_violation: ERR_LIABILITY_PCT_SUM_INVALID
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/syndicate-members, POST /bond-offerings/deals/{id}/price"

  - rule_id: compensation-inputs-match-basis
    priority: 16
    category: business_fiscal
    condition: |
      Pricing a NEGOTIATED deal requires takedown_per_bond_usd, management_fee_per_bond_usd and
      expenses_per_bond_usd and forbids winning_bid_price_pct; pricing a COMPETITIVE deal
      requires winning_bid_price_pct and forbids the three per-bond components.
    on_violation: ERR_COMPENSATION_INPUT_MISSING
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/price"

  - rule_id: premium-within-proceeds
    priority: 16
    category: business_fiscal
    condition: "net_proceeds_to_issuer_usd computed by calculations.credit_enhancement_premium_and_net_proceeds is strictly greater than 0"
    on_violation: ERR_PREMIUM_EXCEEDS_PROCEEDS
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/price, POST /bond-offerings/deals/{id}/award"

  - rule_id: single-committed-enhancement
    priority: 16
    category: business_fiscal
    condition: "at most one CreditEnhancement per deal may hold status COMMITTED; premium_bps is in [1, 200]; insured_tranche_ids is a non-empty set of distinct tranche ids"
    on_violation: ERR_ENHANCEMENT_ALREADY_COMMITTED
    http_status: 422
    applies_to: "POST /bond-offerings/credit-enhancements/{id}/commit, POST /bond-offerings/deals/{id}/credit-enhancements"

  - rule_id: closing-documents-complete
    priority: 16
    category: business_fiscal
    condition: "every ClosingDocument of the deal with is_required true has execution_status EXECUTED or WAIVED"
    on_violation: ERR_CLOSING_DOCS_INCOMPLETE
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/close"

  - rule_id: post-issuance-handoff-ready
    priority: 16
    category: business_fiscal
    condition: |
      Marking the post-issuance handoff READY requires Deal.status PRICED or AWARDED,
      Deal.arbitrage_yield_pct non-null, an ACTIVE ContinuingDisclosureUndertaking, and
      record_retention_years >= 6. Closing the deal, and executing a TAX_CERTIFICATE, require
      Deal.post_issuance_handoff_status == READY.
    on_violation: ERR_POST_ISSUANCE_HANDOFF_INCOMPLETE
    http_status: 422
    applies_to: "POST /bond-offerings/deals/{id}/post-issuance-handoff, POST /bond-offerings/deals/{id}/close, POST /bond-offerings/closing-documents/{id}/execute"

# =============================================================================
# 1.5 API Endpoint Table  (all paths are under api_prefix /bond-offerings)
# =============================================================================
endpoints:

  # --- Issuer -----------------------------------------------------------------
  - method: POST
    path: "/bond-offerings/issuers"
    description: "Register a governmental issuer and score its continuing-disclosure risk."
    roles: [IssuerOfficial, MunicipalAdvisor, ComplianceOfficer]
    code: 201
    input: ["name", "state_code", "entity_type", "prior_late_annual_filings?", "prior_late_event_notices?", "has_prior_material_event?", "is_bank_qualified_eligible?"]
    output: Issuer
    side_effects: ["computes disclosure_risk_score via calculations.issuer_disclosure_risk_score"]

  - method: GET
    path: "/bond-offerings/issuers"
    description: "List issuers, optionally filtered by state."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["state_code?", "entity_type?", "limit?", "offset?"]
    output: Issuer[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/issuers/{id}"
    description: "Read one issuer, including its computed disclosure_risk_score."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: Issuer
    side_effects: []

  # --- Firm -------------------------------------------------------------------
  - method: POST
    path: "/bond-offerings/firms"
    description: "Register an underwriting or municipal advisory firm."
    roles: [ComplianceOfficer]
    code: 201
    input: ["name", "firm_type", "msrb_registration_id", "is_suspended?"]
    output: Firm
    side_effects: []

  - method: GET
    path: "/bond-offerings/firms"
    description: "List firms, optionally filtered by registration category or suspension state."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, ComplianceOfficer]
    code: 200
    input: ["firm_type?", "is_suspended?", "limit?", "offset?"]
    output: Firm[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/firms/{id}"
    description: "Read one firm."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, ComplianceOfficer]
    code: 200
    input: []
    output: Firm
    side_effects: []

  - method: GET
    path: "/bond-offerings/firms/{id}/syndicate-memberships"
    description: "Reverse lookup for SyndicateMember.firm_id: every syndicate seat this firm holds across deals."
    roles: [Underwriter, MunicipalAdvisor, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SyndicateMember[]
    side_effects: []

  # --- Deal -------------------------------------------------------------------
  - method: POST
    path: "/bond-offerings/deals"
    description: "Open a new bond issue in DRAFT and optionally engage an independent municipal advisor."
    roles: [IssuerOfficial, MunicipalAdvisor]
    code: 201
    input: ["issuer_id", "series_designation", "tax_status", "dated_date", "expected_par_amount_usd", "municipal_advisor_firm_id?", "record_retention_years?"]
    output: Deal
    side_effects: ["status DRAFT, sale_method UNDETERMINED, disclosure_clearance PENDING, post_issuance_handoff_status NOT_STARTED, version 1"]

  - method: GET
    path: "/bond-offerings/deals"
    description: "List deals. Reverse lookup for Deal.issuer_id and Deal.municipal_advisor_firm_id."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["issuer_id?", "municipal_advisor_firm_id?", "status?", "sale_method?", "limit?", "offset?"]
    output: Deal[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/deals/{id}"
    description: "Read one deal with its computed money fields, disclosure_clearance and version (the OCC token for official-statement creation)."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: Deal
    side_effects: []

  - method: POST
    path: "/bond-offerings/deals/{id}/submit-structure"
    description: "Freeze the maturity schedule and move the deal from DRAFT to STRUCTURING."
    roles: [MunicipalAdvisor]
    code: 200
    input: []
    output: Deal
    side_effects: ["Deal.status DRAFT -> STRUCTURING", "sets Deal.par_amount_usd", "initialises every tranche's par_allotted_usd and par_unsold_usd", "sets SyndicateMember.liability_par_usd for ACTIVE members"]

  - method: POST
    path: "/bond-offerings/deals/{id}/designate-sale-method"
    description: "Choose competitive or negotiated sale; the two branches set different flags and later create different closing documents."
    roles: [MunicipalAdvisor, IssuerOfficial]
    code: 200
    input: [sale_method]
    output: Deal
    side_effects: ["Deal.status STRUCTURING -> PRICING_COMPETITIVE or PRICING_NEGOTIATED", "sets sale_method and gross_spread_basis", "sets requires_notice_of_sale (competitive) or requires_g17_letter (negotiated)"]

  - method: POST
    path: "/bond-offerings/deals/{id}/price"
    description: "Price the issue and disclose underwriter compensation; the compensation inputs required depend on the sale method."
    roles: [Underwriter]
    code: 200
    input: ["takedown_per_bond_usd?", "management_fee_per_bond_usd?", "expenses_per_bond_usd?", "winning_bid_price_pct?"]
    output: Deal
    side_effects: ["Deal.status PRICING_COMPETITIVE or PRICING_NEGOTIATED -> PRICED", "runs calculations.deal_issue_price_total, gross_spread_disclosure, credit_enhancement_premium_and_net_proceeds, arbitrage_yield_and_restriction and syndicate_takedown_reconciliation", "every CLOSED OrderPeriod of the deal -> SETTLED"]

  - method: POST
    path: "/bond-offerings/deals/{id}/award"
    description: "Award the bonds and generate the required closing document set for this sale method."
    roles: [IssuerOfficial]
    code: 200
    input: []
    output: Deal
    side_effects: ["Deal.status PRICED -> AWARDED", "creates the five universal ClosingDocuments plus G17_DISCLOSURE_LETTER (negotiated) or NOTICE_OF_SALE_CERTIFICATE (competitive)"]

  - method: POST
    path: "/bond-offerings/deals/{id}/post-issuance-handoff"
    description: "Hand the issue to post-issuance tax compliance; required before closing and before the tax certificate may be executed."
    roles: [ComplianceOfficer]
    code: 200
    input: [record_retention_years]
    output: Deal
    side_effects: ["Deal.post_issuance_handoff_status NOT_STARTED -> READY", "stores record_retention_years"]

  - method: POST
    path: "/bond-offerings/deals/{id}/yield-restriction-analysis"
    description: "Read-only IRC section 148 projection: bond yield, the one-eighth allowance and any excess earnings on unspent proceeds. Stores nothing."
    roles: [ComplianceOfficer, MunicipalAdvisor]
    code: 200
    input: [projected_investment_yield_pct, unspent_proceeds_usd, investment_days]
    output: "{ deal_id: string, arbitrage_yield_pct: number, permitted_investment_yield_pct: number, projected_investment_yield_pct: number, yield_restriction_applies: boolean, excess_earnings_usd: number }"
    side_effects: ["runs calculations.arbitrage_yield_and_restriction; mutates nothing"]

  - method: POST
    path: "/bond-offerings/deals/{id}/close"
    description: "Close the issue once every required closing document is executed or waived."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Deal
    side_effects: ["Deal.status AWARDED -> CLOSED"]

  - method: POST
    path: "/bond-offerings/deals/{id}/cancel"
    description: "Cancel the issue and unwind every open child record."
    roles: [IssuerOfficial]
    code: 200
    input: [cancellation_reason]
    output: Deal
    side_effects: ["Deal.status -> CANCELLED", "withdraws official statements, cancels order periods and orders, withdraws rating engagements, cancels scheduled presentations, declines or withdraws credit enhancements, zeroes allotted par"]

  # --- MaturityTranche --------------------------------------------------------
  - method: POST
    path: "/bond-offerings/deals/{id}/maturity-tranches"
    description: "Add one maturity to the schedule and price it under the yield-to-worst convention."
    roles: [MunicipalAdvisor]
    code: 201
    input: ["sequence_number", "maturity_date", "principal_amount_usd", "coupon_rate_pct", "yield_pct", "is_callable?", "first_call_date?", "call_price_pct?", "refunded_tranche_id?"]
    output: MaturityTranche
    side_effects: ["computes periods_to_maturity, periods_to_call, price_to_maturity_pct, price_to_call_pct, reoffering_price_pct and is_priced_to_call via calculations.tranche_reoffering_price"]

  - method: GET
    path: "/bond-offerings/deals/{id}/maturity-tranches"
    description: "Reverse lookup for MaturityTranche.deal_id: the deal's maturity schedule in sequence order."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["is_callable?", "is_insured?", "limit?", "offset?"]
    output: MaturityTranche[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/maturity-tranches"
    description: "List tranches across deals. Reverse lookup for MaturityTranche.refunded_tranche_id."
    roles: [MunicipalAdvisor, Underwriter, ComplianceOfficer]
    code: 200
    input: ["deal_id?", "refunded_tranche_id?", "limit?", "offset?"]
    output: MaturityTranche[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/maturity-tranches/{id}"
    description: "Read one maturity with both price variants and its allotment counters."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: MaturityTranche
    side_effects: []

  # --- CreditEnhancement ------------------------------------------------------
  - method: POST
    path: "/bond-offerings/deals/{id}/credit-enhancements"
    description: "Record a proposed bond insurance policy, letter of credit or state intercept."
    roles: [MunicipalAdvisor, IssuerOfficial]
    code: 201
    input: [provider_name, enhancement_type, enhanced_rating, premium_bps, insured_tranche_ids]
    output: CreditEnhancement
    side_effects: ["status PROPOSED"]

  - method: GET
    path: "/bond-offerings/deals/{id}/credit-enhancements"
    description: "Reverse lookup for CreditEnhancement.deal_id."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CreditEnhancement[]
    side_effects: []

  - method: POST
    path: "/bond-offerings/credit-enhancements/{id}/commit"
    description: "Commit the enhancement: insure the named maturities and charge the premium against insured debt service."
    roles: [IssuerOfficial]
    code: 200
    input: []
    output: CreditEnhancement
    side_effects: ["status PROPOSED -> COMMITTED", "insured tranches set is_insured true and rating_basis ENHANCED", "computes insured_debt_service_usd and premium_usd", "sets Deal.credit_enhancement_premium_usd and recomputes Deal.net_proceeds_to_issuer_usd when the deal is PRICED"]

  - method: POST
    path: "/bond-offerings/credit-enhancements/{id}/withdraw"
    description: "Withdraw a committed enhancement; compensating action that reverses the insurance and re-opens the affected disclosure."
    roles: [IssuerOfficial]
    code: 200
    input: [withdrawal_reason]
    output: CreditEnhancement
    side_effects: ["status COMMITTED -> WITHDRAWN", "insured tranches revert to is_insured false and rating_basis UNDERLYING", "Deal.credit_enhancement_premium_usd -> 0.00 and net proceeds recomputed", "APPROVED sections referencing the enhancement -> NEEDS_REVISION, mandatory_sections_approved recomputed, Deal.disclosure_clearance downgraded", "SCHEDULED rating presentations on the deal -> CANCELLED"]

  # --- OfficialStatement ------------------------------------------------------
  - method: POST
    path: "/bond-offerings/deals/{id}/official-statements"
    description: "Start a new official statement draft. Supersedes any non-terminal predecessor on the deal, so it is guarded by the deal's version."
    roles: [BondCounsel, MunicipalAdvisor]
    code: 201
    input: [version_label, is_preliminary, expected_deal_version]
    output: OfficialStatement
    side_effects: ["status DRAFTING, draft_round 1", "any predecessor OfficialStatement in DRAFTING, IN_REVIEW or REVISION_REQUESTED -> SUPERSEDED", "Deal.disclosure_clearance recomputed", "increments Deal.version"]

  - method: GET
    path: "/bond-offerings/deals/{id}/official-statements"
    description: "Reverse lookup for OfficialStatement.deal_id, newest first."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OfficialStatement[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/official-statements/{id}"
    description: "Read one official statement with mandatory_sections_approved, draft_round and version."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: OfficialStatement
    side_effects: []

  - method: POST
    path: "/bond-offerings/official-statements/{id}/submit-for-review"
    description: "Send the draft to the municipal advisor for review."
    roles: [BondCounsel]
    code: 200
    input: []
    output: OfficialStatement
    side_effects: ["status DRAFTING -> IN_REVIEW", "recomputes mandatory_sections_approved and Deal.disclosure_clearance"]

  - method: POST
    path: "/bond-offerings/official-statements/{id}/request-revision"
    description: "Reject the draft; five-hop cascade that unapproves risk factors, blocks disclosure clearance and re-opens credit review."
    roles: [MunicipalAdvisor]
    code: 200
    input: [revision_reason]
    output: OfficialStatement
    side_effects: ["status IN_REVIEW -> REVISION_REQUESTED and draft_round += 1", "APPROVED RISK_FACTOR sections -> NEEDS_REVISION", "mandatory_sections_approved -> false", "Deal.disclosure_clearance -> BLOCKED", "SCHEDULED rating presentations -> CANCELLED and UNDER_REVIEW rating engagements -> INFO_REQUESTED with info_request_count += 1"]

  - method: POST
    path: "/bond-offerings/official-statements/{id}/resume-drafting"
    description: "Return a rejected statement to drafting, closing the revision cycle."
    roles: [BondCounsel]
    code: 200
    input: []
    output: OfficialStatement
    side_effects: ["status REVISION_REQUESTED -> DRAFTING", "Deal.disclosure_clearance -> PENDING"]

  - method: POST
    path: "/bond-offerings/official-statements/{id}/post-preliminary"
    description: "Post the preliminary official statement, clearing the deal for pricing."
    roles: [MunicipalAdvisor]
    code: 200
    input: []
    output: OfficialStatement
    side_effects: ["status IN_REVIEW -> PRELIMINARY_POSTED", "sets posted_preliminary_at from the logical clock", "Deal.disclosure_clearance -> CLEARED"]

  - method: POST
    path: "/bond-offerings/official-statements/{id}/post-final"
    description: "Post the final official statement after award; prerequisite for the bond opinion and for closing."
    roles: [MunicipalAdvisor]
    code: 200
    input: []
    output: OfficialStatement
    side_effects: ["status PRELIMINARY_POSTED -> FINAL_POSTED", "sets posted_final_at from the logical clock"]

  # --- OfficialStatementSection ----------------------------------------------
  - method: POST
    path: "/bond-offerings/official-statements/{id}/sections"
    description: "Add a section or nested subsection to the statement; the author is recorded from X-User-Id."
    roles: [BondCounsel]
    code: 201
    input: ["section_code", "title", "body_text", "section_type", "is_material_risk?", "references_credit_enhancement?", "parent_section_id?"]
    output: OfficialStatementSection
    side_effects: ["review_status DRAFT", "authored_by_user_id = X-User-Id", "computes word_count"]

  - method: GET
    path: "/bond-offerings/official-statements/{id}/sections"
    description: "Reverse lookup for OfficialStatementSection.official_statement_id."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["section_type?", "review_status?", "limit?", "offset?"]
    output: OfficialStatementSection[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/os-sections"
    description: "List sections across statements. Reverse lookup for OfficialStatementSection.parent_section_id."
    roles: [MunicipalAdvisor, BondCounsel, ComplianceOfficer]
    code: 200
    input: ["official_statement_id?", "parent_section_id?", "review_status?", "limit?", "offset?"]
    output: OfficialStatementSection[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/os-sections/{id}"
    description: "Read one section with its review status and approver."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: OfficialStatementSection
    side_effects: []

  - method: POST
    path: "/bond-offerings/os-sections/{id}/approve"
    description: "Approve a section. MSRB Rule G-17 forbids the author from approving their own section."
    roles: [BondCounsel]
    code: 200
    input: []
    output: OfficialStatementSection
    side_effects: ["review_status DRAFT or NEEDS_REVISION -> APPROVED", "approved_by_user_id = X-User-Id", "recomputes OfficialStatement.mandatory_sections_approved and Deal.disclosure_clearance"]

  # --- ContinuingDisclosureUndertaking ---------------------------------------
  - method: POST
    path: "/bond-offerings/deals/{id}/undertakings"
    description: "Draft the Rule 15c2-12 continuing disclosure undertaking."
    roles: [BondCounsel, MunicipalAdvisor]
    code: 201
    input: ["annual_report_due_days", "material_event_notice_days", "dissemination_agent", "audited_financials_included?"]
    output: ContinuingDisclosureUndertaking
    side_effects: ["status DRAFT"]

  - method: GET
    path: "/bond-offerings/deals/{id}/undertakings"
    description: "Reverse lookup for ContinuingDisclosureUndertaking.deal_id."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ContinuingDisclosureUndertaking[]
    side_effects: []

  - method: POST
    path: "/bond-offerings/undertakings/{id}/activate"
    description: "Execute the undertaking; supersedes any earlier active undertaking on the deal."
    roles: [IssuerOfficial]
    code: 200
    input: []
    output: ContinuingDisclosureUndertaking
    side_effects: ["status DRAFT -> ACTIVE", "any other ACTIVE undertaking on the deal -> SUPERSEDED"]

  # --- RatingEngagement / RatingPresentation ---------------------------------
  - method: POST
    path: "/bond-offerings/deals/{id}/rating-engagements"
    description: "Request a credit rating from one agency."
    roles: [MunicipalAdvisor, IssuerOfficial]
    code: 201
    input: [agency]
    output: RatingEngagement
    side_effects: ["status REQUESTED, info_request_count 0"]

  - method: GET
    path: "/bond-offerings/deals/{id}/rating-engagements"
    description: "Reverse lookup for RatingEngagement.deal_id."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["agency?", "status?", "limit?", "offset?"]
    output: RatingEngagement[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/rating-engagements/{id}"
    description: "Read one credit review with its assigned analyst and information-request counter."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: RatingEngagement
    side_effects: []

  - method: POST
    path: "/bond-offerings/rating-engagements/{id}/acknowledge"
    description: "Analyst picks up the engagement and is pinned to it for the rest of the review."
    roles: [RatingAnalyst]
    code: 200
    input: []
    output: RatingEngagement
    side_effects: ["status REQUESTED -> UNDER_REVIEW", "assigned_analyst_user_id = X-User-Id"]

  - method: POST
    path: "/bond-offerings/rating-engagements/{id}/request-info"
    description: "Analyst asks the deal team for more information, suspending the review."
    roles: [RatingAnalyst]
    code: 200
    input: [information_request]
    output: RatingEngagement
    side_effects: ["status UNDER_REVIEW -> INFO_REQUESTED", "info_request_count += 1", "stores latest_information_request"]

  - method: POST
    path: "/bond-offerings/rating-engagements/{id}/respond-info"
    description: "Deal team answers the information request, closing the review cycle."
    roles: [MunicipalAdvisor]
    code: 200
    input: [response_summary]
    output: RatingEngagement
    side_effects: ["status INFO_REQUESTED -> UNDER_REVIEW"]

  - method: POST
    path: "/bond-offerings/rating-engagements/{id}/assign-rating"
    description: "Assign the rating; requires a presentation that has actually been held."
    roles: [RatingAnalyst]
    code: 200
    input: [assigned_rating, outlook]
    output: RatingEngagement
    side_effects: ["status UNDER_REVIEW -> RATED", "stores assigned_rating and outlook"]

  - method: POST
    path: "/bond-offerings/rating-engagements/{id}/presentations"
    description: "Schedule a rating agency presentation; per-agency buffer rules apply across the whole deal."
    roles: [MunicipalAdvisor, Underwriter]
    code: 201
    input: [starts_at, ends_at, attendee_count]
    output: RatingPresentation
    side_effects: ["status SCHEDULED"]

  - method: GET
    path: "/bond-offerings/rating-engagements/{id}/presentations"
    description: "Reverse lookup for RatingPresentation.rating_engagement_id."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RatingPresentation[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/rating-presentations/{id}"
    description: "Read one scheduled presentation with its status and cancellation reason."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: RatingPresentation
    side_effects: []

  - method: POST
    path: "/bond-offerings/rating-presentations/{id}/cancel"
    description: "Cancel a scheduled agency presentation, freeing its window for the per-agency buffer test."
    roles: [MunicipalAdvisor, Underwriter]
    code: 200
    input: [cancellation_reason]
    output: RatingPresentation
    side_effects: ["status SCHEDULED -> CANCELLED", "stores cancellation_reason", "increments RatingPresentation.version"]

  # --- SyndicateMember --------------------------------------------------------
  - method: POST
    path: "/bond-offerings/deals/{id}/syndicate-members"
    description: "Add an underwriting firm to the syndicate. MSRB Rule G-23 bars the deal's municipal advisor."
    roles: [Underwriter, MunicipalAdvisor]
    code: 201
    input: [firm_id, member_role, liability_pct, takedown_share_pct, priority_rank]
    output: SyndicateMember
    side_effects: ["status ACTIVE", "sets liability_par_usd when Deal.par_amount_usd is already known"]

  - method: GET
    path: "/bond-offerings/deals/{id}/syndicate-members"
    description: "Reverse lookup for SyndicateMember.deal_id, ordered by priority_rank."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["member_role?", "status?", "limit?", "offset?"]
    output: SyndicateMember[]
    side_effects: []

  # --- OrderPeriod / Order ----------------------------------------------------
  - method: POST
    path: "/bond-offerings/deals/{id}/order-periods"
    description: "Schedule a retail or institutional order period."
    roles: [Underwriter, MunicipalAdvisor]
    code: 201
    input: ["period_type", "opens_at", "closes_at", "priority_policy?"]
    output: OrderPeriod
    side_effects: ["status SCHEDULED, allotment_run_count 0"]

  - method: GET
    path: "/bond-offerings/deals/{id}/order-periods"
    description: "Reverse lookup for OrderPeriod.deal_id."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: ["period_type?", "status?", "limit?", "offset?"]
    output: OrderPeriod[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/order-periods/{id}"
    description: "Read one order period with its order counters and version (the OCC token for order entry)."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, RatingAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: OrderPeriod
    side_effects: []

  - method: POST
    path: "/bond-offerings/order-periods/{id}/open"
    description: "Open the order book."
    roles: [Underwriter]
    code: 200
    input: []
    output: OrderPeriod
    side_effects: ["status SCHEDULED -> OPEN"]

  - method: POST
    path: "/bond-offerings/order-periods/{id}/close"
    description: "Close the book and run the priority-of-orders allotment waterfall over every maturity."
    roles: [Underwriter]
    code: 200
    input: []
    output: OrderPeriod
    side_effects: ["status OPEN -> CLOSED", "runs calculations.order_allotment_waterfall", "allotment_run_count += 1", "updates every tranche's par_allotted_usd and par_unsold_usd and Deal.par_allotted_total_usd"]

  - method: POST
    path: "/bond-offerings/order-periods/{id}/reopen"
    description: "Compliance reopens a closed book; compensating action that voids the allotment run without drift."
    roles: [ComplianceOfficer]
    code: 200
    input: [reopen_reason]
    output: OrderPeriod
    side_effects: ["status CLOSED -> OPEN", "every allotted, partially allotted or unfilled Order -> PENDING with par_allotted_usd 0", "tranche and deal par counters recomputed", "SyndicateMember.takedown_credit_usd recomputed"]

  - method: POST
    path: "/bond-offerings/order-periods/{id}/orders"
    description: "Enter an order into the open book. Guarded by the order period's version because order entry is otherwise unconditionally repeatable."
    roles: [Underwriter]
    code: 201
    input: [maturity_tranche_id, syndicate_member_id, order_type, par_requested_usd, price_or_yield_pct, expected_order_period_version]
    output: Order
    side_effects: ["status PENDING, par_allotted_usd 0", "submitted_at = logical clock", "increments OrderPeriod.version", "recomputes OrderPeriod.orders_received_count"]

  - method: GET
    path: "/bond-offerings/order-periods/{id}/orders"
    description: "Reverse lookup for Order.order_period_id, in submitted_at order."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, ComplianceOfficer]
    code: 200
    input: ["order_type?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/orders"
    description: "List orders across periods. Reverse lookup for Order.maturity_tranche_id and Order.syndicate_member_id."
    roles: [MunicipalAdvisor, Underwriter, ComplianceOfficer]
    code: 200
    input: ["maturity_tranche_id?", "syndicate_member_id?", "order_period_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/orders/{id}"
    description: "Read one order with its allotted par and allotment status."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, ComplianceOfficer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/bond-offerings/orders/{id}/cancel"
    description: "Withdraw an order while the book is still open; the order is excluded from every later allotment run."
    roles: [Underwriter]
    code: 200
    input: [cancellation_reason]
    output: Order
    side_effects: ["status PENDING -> CANCELLED", "par_allotted_usd 0", "recomputes OrderPeriod.orders_received_count", "increments Order.version and OrderPeriod.version"]

  # --- ClosingDocument --------------------------------------------------------
  - method: GET
    path: "/bond-offerings/deals/{id}/closing-documents"
    description: "Reverse lookup for ClosingDocument.deal_id. Closing documents have no creation endpoint: they exist only as a side effect of award, so this GET is their only discovery channel."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, ComplianceOfficer]
    code: 200
    input: ["doc_type?", "execution_status?", "limit?", "offset?"]
    output: ClosingDocument[]
    side_effects: []

  - method: GET
    path: "/bond-offerings/closing-documents/{id}"
    description: "Read one closing document."
    roles: [IssuerOfficial, MunicipalAdvisor, Underwriter, BondCounsel, ComplianceOfficer]
    code: 200
    input: []
    output: ClosingDocument
    side_effects: []

  - method: POST
    path: "/bond-offerings/closing-documents/{id}/execute"
    description: "Execute a closing document; the acting role must match the document's signatory_role and per-doc_type cross-entity gates apply."
    roles: [BondCounsel, IssuerOfficial, Underwriter, MunicipalAdvisor]
    code: 200
    input: [signatory_name]
    output: ClosingDocument
    side_effects: ["execution_status PENDING -> EXECUTED", "sets signatory_name and executed_at from the logical clock"]

  - method: POST
    path: "/bond-offerings/closing-documents/{id}/waive"
    description: "Waive a non-opinion, non-tax closing document."
    roles: [ComplianceOfficer]
    code: 200
    input: [waiver_reason]
    output: ClosingDocument
    side_effects: ["execution_status PENDING -> WAIVED"]

  # --- test-driving endpoint --------------------------------------------------
  - method: POST
    path: "/bond-offerings/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z and the logical clock NEVER falls back to wall-clock time. Advancing the clock to or past a SCHEDULED RatingPresentation's ends_at promotes it to HELD, in ascending (ends_at, created_at) order."
    roles: [ComplianceOfficer, MunicipalAdvisor, Underwriter, BondCounsel, IssuerOfficial, RatingAnalyst]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, held_presentation_ids: string[] }"
    side_effects: ["every SCHEDULED RatingPresentation whose ends_at <= current_utc transitions to HELD", "order-period window checks and every system timestamp read this clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization ----------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Id or X-User-Role header missing or blank"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the endpoint"
  - id: ERR_ROLE_IDENTITY_MISMATCH
    http: 403
    condition: "the acting principal does not resolve to an existing Issuer or Firm compatible with the role, or does not own the deal-scoped resource"

  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, unknown field, out-of-range number, malformed datetime or unlisted enum member"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset negative or non-integer"

  # --- not found -------------------------------------------------------------
  - id: ERR_ISSUER_NOT_FOUND
    http: 404
    condition: "issuer_id in the path or body names no Issuer"
  - id: ERR_FIRM_NOT_FOUND
    http: 404
    condition: "firm_id or municipal_advisor_firm_id names no Firm"
  - id: ERR_DEAL_NOT_FOUND
    http: 404
    condition: "deal_id names no Deal"
  - id: ERR_TRANCHE_NOT_FOUND
    http: 404
    condition: "tranche_id, maturity_tranche_id, refunded_tranche_id or a member of insured_tranche_ids names no MaturityTranche"
  - id: ERR_ENHANCEMENT_NOT_FOUND
    http: 404
    condition: "enhancement_id names no CreditEnhancement"
  - id: ERR_OFFICIAL_STATEMENT_NOT_FOUND
    http: 404
    condition: "os_id names no OfficialStatement"
  - id: ERR_SECTION_NOT_FOUND
    http: 404
    condition: "section_id or parent_section_id names no OfficialStatementSection"
  - id: ERR_UNDERTAKING_NOT_FOUND
    http: 404
    condition: "undertaking_id names no ContinuingDisclosureUndertaking"
  - id: ERR_RATING_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "engagement_id names no RatingEngagement"
  - id: ERR_PRESENTATION_NOT_FOUND
    http: 404
    condition: "presentation_id names no RatingPresentation"
  - id: ERR_ORDER_PERIOD_NOT_FOUND
    http: 404
    condition: "order_period_id names no OrderPeriod"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order_id names no Order"
  - id: ERR_CLOSING_DOCUMENT_NOT_FOUND
    http: 404
    condition: "document_id names no ClosingDocument"

  # --- referential integrity -------------------------------------------------
  - id: ERR_CROSS_DEAL_REFERENCE
    http: 422
    condition: "entities referenced together in one request do not belong to the same deal (or, for refunded_tranche_id, do not belong to a different deal of the same issuer)"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_DEAL_VERSION
    http: 412
    condition: "expected_deal_version does not equal the current Deal.version"
  - id: ERR_STALE_ORDER_PERIOD_VERSION
    http: 412
    condition: "expected_order_period_version does not equal the current OrderPeriod.version"

  # --- state -----------------------------------------------------------------
  - id: ERR_DEAL_INVALID_STATE
    http: 409
    condition: "the Deal's current status does not admit the requested action, or a child operation requires a deal status the deal is not in"
  - id: ERR_OS_INVALID_STATE
    http: 409
    condition: "the OfficialStatement's current status does not admit the requested action"
  - id: ERR_SECTION_INVALID_STATE
    http: 409
    condition: "the section is already APPROVED and cannot be approved again"
  - id: ERR_UNDERTAKING_INVALID_STATE
    http: 409
    condition: "the undertaking is not in DRAFT when activation is attempted"
  - id: ERR_ENHANCEMENT_INVALID_STATE
    http: 409
    condition: "the enhancement is not PROPOSED on commit, or not COMMITTED on withdraw"
  - id: ERR_RATING_ENGAGEMENT_INVALID_STATE
    http: 409
    condition: "the rating engagement's current status does not admit the requested action"
  - id: ERR_PRESENTATION_INVALID_STATE
    http: 409
    condition: "a presentation is scheduled on an engagement that is already RATED or WITHDRAWN"
  - id: ERR_ORDER_PERIOD_INVALID_STATE
    http: 409
    condition: "the order period's current status does not admit open, close, reopen or order entry, or another period of the deal is already OPEN"
  - id: ERR_ORDER_INVALID_STATE
    http: 409
    condition: "an order that is already CANCELLED is targeted by an allotment-affecting operation"
  - id: ERR_CLOSING_DOC_ALREADY_EXECUTED
    http: 409
    condition: "the closing document's execution_status is not PENDING"

  # --- MSRB conduct ----------------------------------------------------------
  - id: ERR_MA_UNDERWRITER_CONFLICT
    http: 422
    condition: "MSRB Rule G-23: the deal's municipal advisor firm would also sit on the deal's underwriting syndicate"
  - id: ERR_FIRM_SUSPENDED
    http: 422
    condition: "a suspended firm would be engaged, seated in the syndicate, or act on a pricing action"
  - id: ERR_MA_ENGAGEMENT_REQUIRED
    http: 422
    condition: "a competitive sale is designated without an engaged independent municipal advisor"
  - id: ERR_SENIOR_MANAGER_REQUIRED
    http: 422
    condition: "a negotiated sale is designated without exactly one ACTIVE senior manager"
  - id: ERR_SALE_METHOD_CONFLICT
    http: 422
    condition: "the sale method is incompatible with the deal's existing syndicate or with the order period being created, or the sale method is already designated"
  - id: ERR_SECTION_SELF_APPROVAL
    http: 422
    condition: "MSRB Rule G-17: the approving user is the section's author"
  - id: ERR_SIGNATORY_ROLE_INVALID
    http: 422
    condition: "the acting role is not the document's signatory_role, or a bond opinion or tax certificate is being waived"

  # --- disclosure adequacy ---------------------------------------------------
  - id: ERR_MANDATORY_SECTION_NOT_APPROVED
    http: 422
    condition: "the official statement lacks an approved section of every mandatory type, or lacks an approved material risk factor, or (on final posting) still has an unapproved section"
  - id: ERR_DISCLOSURE_RISK_SECTION_REQUIRED
    http: 422
    condition: "the issuer's disclosure_risk_score is at or above 40 and no approved material continuing-disclosure section exists"
  - id: ERR_UNDERTAKING_NOT_ACTIVE
    http: 422
    condition: "no ACTIVE continuing disclosure undertaking exists on the deal"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 422
    condition: "a revision is requested when draft_round has already reached MAX_DRAFT_ROUNDS (4)"
  - id: ERR_OS_NOT_FINAL_POSTED
    http: 422
    condition: "closing the deal or executing a bond opinion while the official statement is not FINAL_POSTED"
  - id: ERR_PRESENTATION_REQUIRED
    http: 422
    condition: "a rating is assigned with no HELD presentation on the engagement"
  - id: ERR_DISCLOSURE_NOT_CLEARED
    http: 422
    condition: "pricing is attempted while disclosure_clearance is not CLEARED or the official statement is not PRELIMINARY_POSTED"
  - id: ERR_PRICING_PRECONDITION_UNMET
    http: 422
    condition: "pricing is attempted with an order period still OPEN or with no closed period that has run an allotment"

  # --- temporal --------------------------------------------------------------
  - id: ERR_ORDER_PERIOD_OVERLAP
    http: 422
    condition: "the new order period's half-open window overlaps an existing non-cancelled period of the same deal, or opens_at is not before closes_at"
  - id: ERR_PRESENTATION_BUFFER_CONFLICT
    http: 422
    condition: "the new presentation's closed interval, expanded by the 60-minute buffer, touches another non-cancelled presentation for the same agency on the same deal"
  - id: ERR_ORDER_PERIOD_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is outside the order period's window for open, reopen or order entry"
  - id: ERR_MATURITY_DATE_UNALIGNED
    http: 422
    condition: "maturity_date or first_call_date does not fall exactly on a semiannual anniversary of the deal's dated_date"

  # --- structural constraints ------------------------------------------------
  - id: ERR_CALL_FEATURE_INVALID
    http: 422
    condition: "call fields are missing when is_callable is true, present when it is false, first_call_date is not before maturity_date, or call_price_pct is outside [100.000, 103.000]"
  - id: ERR_DENOMINATION_INVALID
    http: 422
    condition: "a principal or requested par amount is not a positive whole multiple of 5000"
  - id: ERR_PAR_SCHEDULE_MISMATCH
    http: 422
    condition: "the maturity schedule does not sum to the deal's authorized par amount"
  - id: ERR_TRANCHE_SEQUENCE_CONFLICT
    http: 422
    condition: "sequence_number is already used on the deal, or maturity_date does not increase with sequence_number"
  - id: ERR_DUPLICATE_SYNDICATE_MEMBER
    http: 422
    condition: "the firm already holds a non-resigned seat on the deal, a second senior manager is added, or priority_rank collides"
  - id: ERR_DUPLICATE_RATING_ENGAGEMENT
    http: 422
    condition: "a non-withdrawn engagement with the same agency already exists on the deal"
  - id: ERR_REFUNDED_TRANCHE_INVALID
    http: 422
    condition: "the refunded tranche's deal is not CLOSED, the tranche is already refunded by another tranche, or it refers to itself"
  - id: ERR_ORDER_TYPE_NOT_PERMITTED
    http: 422
    condition: "the order type is not accepted by the period's period_type or priority_policy, or a member or stock order names a selling-group member"
  - id: ERR_DUPLICATE_MSRB_REGISTRATION
    http: 422
    condition: "msrb_registration_id is already registered to another firm"
  - id: ERR_DUPLICATE_SERIES_DESIGNATION
    http: 422
    condition: "series_designation is already used by another deal of the same issuer"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_LIABILITY_PCT_SUM_INVALID
    http: 422
    condition: "active syndicate liability shares would exceed 100.0000, or do not equal 100.0000 exactly when a negotiated deal is priced"
  - id: ERR_COMPENSATION_INPUT_MISSING
    http: 422
    condition: "the compensation inputs supplied at pricing do not match the deal's gross_spread_basis"
  - id: ERR_PREMIUM_EXCEEDS_PROCEEDS
    http: 422
    condition: "computed net proceeds to the issuer would not be strictly positive"
  - id: ERR_ENHANCEMENT_ALREADY_COMMITTED
    http: 422
    condition: "another credit enhancement on the deal is already COMMITTED, premium_bps is outside [1, 200], or insured_tranche_ids is empty or contains duplicates"
  - id: ERR_CLOSING_DOCS_INCOMPLETE
    http: 422
    condition: "a required closing document is still PENDING when the deal is closed"
  - id: ERR_POST_ISSUANCE_HANDOFF_INCOMPLETE
    http: 422
    condition: "the post-issuance handoff prerequisites are unmet, or an operation requiring post_issuance_handoff_status READY is attempted before the handoff"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: IssuerOfficial
    description: "Finance officer of the governmental issuer; owns the decision to insure, to award and to cancel, and signs the tax certificate and the continuing disclosure agreement."
    identity: "entity_backed:Issuer"
    exclusive_operations:
      - "POST /bond-offerings/deals/{id}/award"
      - "POST /bond-offerings/deals/{id}/cancel"
      - "POST /bond-offerings/credit-enhancements/{id}/commit"
      - "POST /bond-offerings/credit-enhancements/{id}/withdraw"
      - "POST /bond-offerings/undertakings/{id}/activate"
    shared_operations:
      - "POST /bond-offerings/issuers"
      - "POST /bond-offerings/deals"
      - "POST /bond-offerings/deals/{id}/designate-sale-method"
      - "POST /bond-offerings/deals/{id}/credit-enhancements"
      - "POST /bond-offerings/deals/{id}/rating-engagements"
      - "POST /bond-offerings/closing-documents/{id}/execute (TAX_CERTIFICATE and CONTINUING_DISCLOSURE_AGREEMENT only)"
      - "every GET listed in section 1.5"

  - name: MunicipalAdvisor
    description: "Independent registered municipal advisor to the issuer; structures the maturity schedule, drives the official statement review and posts the statements. Under MSRB Rule G-23 the advisor's firm may never sit on the same deal's syndicate."
    identity: "entity_backed:Firm"
    exclusive_operations:
      - "POST /bond-offerings/deals/{id}/submit-structure"
      - "POST /bond-offerings/deals/{id}/maturity-tranches"
      - "POST /bond-offerings/official-statements/{id}/request-revision"
      - "POST /bond-offerings/official-statements/{id}/post-preliminary"
      - "POST /bond-offerings/official-statements/{id}/post-final"
      - "POST /bond-offerings/rating-engagements/{id}/respond-info"
    shared_operations:
      - "POST /bond-offerings/issuers"
      - "POST /bond-offerings/deals"
      - "POST /bond-offerings/deals/{id}/designate-sale-method"
      - "POST /bond-offerings/deals/{id}/credit-enhancements"
      - "POST /bond-offerings/deals/{id}/official-statements"
      - "POST /bond-offerings/deals/{id}/undertakings"
      - "POST /bond-offerings/deals/{id}/rating-engagements"
      - "POST /bond-offerings/rating-engagements/{id}/presentations"
      - "POST /bond-offerings/deals/{id}/syndicate-members"
      - "POST /bond-offerings/deals/{id}/order-periods"
      - "POST /bond-offerings/deals/{id}/yield-restriction-analysis"
      - "POST /bond-offerings/closing-documents/{id}/execute (NOTICE_OF_SALE_CERTIFICATE only)"
      - "every GET listed in section 1.5"

  - name: Underwriter
    description: "Broker-dealer that buys the bonds and resells them; runs the order book, prices the issue and discloses its compensation under MSRB Rule G-17."
    identity: "entity_backed:Firm"
    exclusive_operations:
      - "POST /bond-offerings/deals/{id}/price"
      - "POST /bond-offerings/order-periods/{id}/open"
      - "POST /bond-offerings/order-periods/{id}/close"
      - "POST /bond-offerings/order-periods/{id}/orders"
    shared_operations:
      - "POST /bond-offerings/deals/{id}/syndicate-members"
      - "POST /bond-offerings/deals/{id}/order-periods"
      - "POST /bond-offerings/rating-engagements/{id}/presentations"
      - "POST /bond-offerings/closing-documents/{id}/execute (ISSUE_PRICE_CERTIFICATE, UNDERWRITER_RECEIPT and G17_DISCLOSURE_LETTER only)"
      - "every GET listed in section 1.5"

  - name: BondCounsel
    description: "Law firm user drafting the official statement, the undertaking and the bond opinion. Segregation of duties: the user who authored a section may not approve it."
    identity: "opaque"
    exclusive_operations:
      - "POST /bond-offerings/official-statements/{id}/sections"
      - "POST /bond-offerings/os-sections/{id}/approve"
      - "POST /bond-offerings/official-statements/{id}/submit-for-review"
      - "POST /bond-offerings/official-statements/{id}/resume-drafting"
    shared_operations:
      - "POST /bond-offerings/deals/{id}/official-statements"
      - "POST /bond-offerings/deals/{id}/undertakings"
      - "POST /bond-offerings/closing-documents/{id}/execute (BOND_OPINION only)"
      - "every GET listed in section 1.5"

  - name: RatingAnalyst
    description: "Rating agency analyst; the analyst who acknowledges an engagement is pinned to it and is the only user who may request information or assign the rating on it."
    identity: "opaque"
    exclusive_operations:
      - "POST /bond-offerings/rating-engagements/{id}/acknowledge"
      - "POST /bond-offerings/rating-engagements/{id}/request-info"
      - "POST /bond-offerings/rating-engagements/{id}/assign-rating"
    shared_operations:
      - "every GET listed in section 1.5 except the order endpoints"

  - name: ComplianceOfficer
    description: "Firm compliance and post-issuance tax officer; registers firms, waives non-opinion closing documents, reopens a closed order book, runs the arbitrage analysis, performs the post-issuance handoff and closes the deal."
    identity: "opaque"
    exclusive_operations:
      - "POST /bond-offerings/firms"
      - "POST /bond-offerings/order-periods/{id}/reopen"
      - "POST /bond-offerings/closing-documents/{id}/waive"
      - "POST /bond-offerings/deals/{id}/post-issuance-handoff"
      - "POST /bond-offerings/deals/{id}/close"
    shared_operations:
      - "POST /bond-offerings/issuers"
      - "POST /bond-offerings/deals/{id}/yield-restriction-analysis"
      - "every GET listed in section 1.5"
