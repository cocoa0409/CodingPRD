    description: "Deny a REQUESTED or EVENT_VERIFIED request"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: DistributionRequest
    side_effects: ["status -> DENIED", "denial_reason set", "increments DistributionRequest.version by 1"]

  # --- Change in control ---
  - method: POST
    path: "/api/change-in-control-events"
    description: "Report a change in control for a plan"
    roles: [PlanSponsor]
    code: 201
    input: [plan_id, event_type, effective_date, stake_change_bp]
    output: ChangeInControlEvent
    side_effects: ["status = REPORTED"]
  - method: GET
    path: "/api/change-in-control-events"
    description: "List change-in-control events, optionally filtered by plan"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: "ChangeInControlEvent[]"
    side_effects: []
  - method: GET
    path: "/api/change-in-control-events/{cicId}"
    description: "Get a change-in-control event"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: ChangeInControlEvent
    side_effects: []
  - method: POST
    path: "/api/change-in-control-events/{cicId}/adjudicate"
    description: "Verify or reject a reported CIC; VERIFIED triggers trust 125% funding requirement and optional acceleration distribution creation"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: ChangeInControlEvent
    side_effects: ["status -> VERIFIED | REJECTED", "trust cic_funding_required = true and required_funding_cents recomputed at 12500 bp", "if plan.accelerate_on_cic: acceleration DistributionRequest rows created (EVENT_VERIFIED) for vested accounts", "increments ChangeInControlEvent.version by 1"]

  # --- Operational failures ---
  - method: POST
    path: "/api/operational-failures"
    description: "Report an operational failure on an account"
    roles: [BenefitsAdministrator]
    code: 201
    input: [account_id, failure_type, failure_date, amount_cents, "distribution_request_id?", "description?"]
    output: OperationalFailureCase
    side_effects: ["status = IDENTIFIED", "reported_by_user_id = X-User-ID", "correction_deadline computed (Dec 31 of failure year + 2)"]
  - method: GET
    path: "/api/operational-failures"
    description: "List operational failure cases with filters"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["account_id?", "distribution_request_id?", "participant_id?", "limit?", "offset?"]
    output: "OperationalFailureCase[]"
    side_effects: []
  - method: GET
    path: "/api/operational-failures/{failureId}"
    description: "Get an operational failure case"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: OperationalFailureCase
    side_effects: []
  - method: POST
    path: "/api/operational-failures/{failureId}/quantify"
    description: "Compute the 409A income inclusion amounts (pinned evaluation order: credit -> base -> interest -> tax)"
    roles: [ComplianceOfficer]
    code: 200
    input: [correction_credit_cents]
    output: OperationalFailureCase
    side_effects: ["status -> QUANTIFIED", "includible_base_cents, premium_interest_cents, additional_tax_cents, total_inclusion_cents computed", "increments OperationalFailureCase.version by 1"]
  - method: POST
    path: "/api/operational-failures/{failureId}/assess-inclusion"
    description: "Assess income inclusion (segregation of duties: assessor != reporter); participant liability increases; account flagged"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OperationalFailureCase
    side_effects: ["status -> INCLUSION_ASSESSED", "Participant.inclusion_liability_cents += total_inclusion_cents", "Account ACTIVE -> FLAGGED_FOR_INCLUSION", "assessed_by_user_id set", "increments OperationalFailureCase.version by 1"]
  - method: POST
    path: "/api/operational-failures/{failureId}/correct"
    description: "Correct a quantified or assessed failure within the correction window; reverses any assessed liability exactly"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OperationalFailureCase
    side_effects: ["status -> CORRECTED", "if was INCLUSION_ASSESSED: Participant.inclusion_liability_cents -= total_inclusion_cents", "Account FLAGGED_FOR_INCLUSION -> ACTIVE when no other open failures", "increments OperationalFailureCase.version by 1"]

  # --- Document findings ---
  - method: POST
    path: "/api/document-findings"
    description: "Report a plan document failure; plan posture recomputed"
    roles: [ComplianceOfficer]
    code: 201
    input: [plan_id, description, failure_year]
    output: DocumentFinding
    side_effects: ["status = REPORTED", "correction_deadline computed (Dec 31 of failure_year + 2)", "Plan.document_posture recomputed", "Plan.open_findings_count recomputed"]
  - method: GET
    path: "/api/document-findings"
    description: "List document findings, optionally filtered by plan"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: "DocumentFinding[]"
    side_effects: []
  - method: GET
    path: "/api/document-findings/{findingId}"
    description: "Get a document finding"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: DocumentFinding
    side_effects: []
  - method: POST
    path: "/api/document-findings/{findingId}/file-correction"
    description: "File a documentary correction within the correction window (inclusive deadline)"
    roles: [ComplianceOfficer]
    code: 200
    input: [correction_text]
    output: DocumentFinding
    side_effects: ["status -> CORRECTION_FILED", "correction_text, filed_by_user_id set", "increments DocumentFinding.version by 1"]
  - method: POST
    path: "/api/document-findings/{findingId}/adjudicate"
    description: "Adjudicate a filed correction: CORRECTED resolves the finding; REJECTED returns it to REPORTED (cycle)"
    roles: [PlanSponsor]
    code: 200
    input: [outcome]
    output: DocumentFinding
    side_effects: ["status -> CORRECTED | REPORTED", "adjudicated_by_user_id set", "Plan.document_posture recomputed", "Plan.open_findings_count recomputed", "increments DocumentFinding.version by 1"]

  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. to_iso8601 must be >= current clock (monotonic). After the move, the sweep fires in pinned order: (1) ElectionWindow SCHEDULED->OPEN / OPEN->CLOSED with election LOCK/EXPIRED effects; (2) DocumentFinding -> LAPSED with plan posture recompute; (3) Plan TERMINATION_PENDING -> TERMINATED; (4) DistributionRequest SCHEDULED -> PAYABLE."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced", "scheduled transitions fired in pinned order (1)-(4)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing/empty, or X-User-Role names an undeclared role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role is not in the endpoint's allowed roles"
  - id: ERR_RESOURCE_OWNERSHIP_MISMATCH
    http: 403
    condition: "Participant-role caller's X-User-ID does not match the owning Participant id of the target resource"
  # --- Existence / input ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body-referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, type mismatch, invalid enum member, constraint violation on scalar input (e.g., percent out of 1..7500, amount <= 0)"
  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "start >= end for a date-range input, or FIXED_TIME fixed_date not after creation clock date"
  # --- OCC ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_plan_version does not equal current Plan.version on an OCC-guarded write"
  # --- Plan state ---
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "Child write requires plan.status == ACTIVE (plan is DRAFT, SUSPENDED, TERMINATION_PENDING, or TERMINATED)"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "Plan transition precondition failed (activate/suspend/resume/terminate/amend from a state that does not allow it)"
  # --- Participant / account state ---
  - id: ERR_PARTICIPANT_NOT_ACTIVE
    http: 409
    condition: "Operation requires participant.status == ACTIVE (account create, election create, election submit)"
  - id: ERR_PARTICIPANT_STATE_INVALID
    http: 409
    condition: "Participant transition precondition failed (rehire requires SEPARATED; DISABLED/DECEASED targets per Participant machine)"
  - id: ERR_ACCOUNT_CLOSED
    http: 409
    condition: "Account is CLOSED; no further deferrals, distributions, settlements, or assessments"
  # --- Election ---
  - id: ERR_ELECTION_NOT_MODIFIABLE
    http: 409
    condition: "Election action requires a specific from-state: submit needs DRAFT, void needs DRAFT|SUBMITTED, post-deferral needs LOCKED"
  - id: ERR_DUPLICATE_ELECTION
    http: 409
    condition: "An election already exists for (participant_id, election_window_id)"
  - id: ERR_WINDOW_NOT_OPEN
    http: 409
    condition: "GENERAL election create requires window.status == OPEN"
  - id: ERR_ELECTION_DEADLINE_PASSED
    http: 422
    condition: "GENERAL submit after general_close_date, or NEWLY_ELIGIBLE create/submit after initial_eligibility_date + 30 days"
  - id: ERR_PERFORMANCE_ELECTION_TOO_LATE
    http: 422
    condition: "PERFORMANCE create/submit after performance_period_end - 6 calendar months"
  - id: ERR_INVALID_WINDOW_DATES
    http: 422
    condition: "general_close_date not in calendar year plan_year-1, open > close, or performance period shorter than 365 days"
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "Election window [general_open_date, general_close_date] overlaps another window of the same plan under closed-interval semantics (touching dates conflict)"
  # --- Crediting ---
  - id: ERR_CREDITING_PERIOD_OVERLAP
    http: 409
    condition: "Crediting period [period_start, period_end) overlaps an existing POSTED run of the same plan under half-open semantics"
  - id: ERR_INDEX_RATE_MISSING
    http: 422
    condition: "Crediting run omits index_rates for an ACTIVE INDEX_LINKED fund of the plan with positive settled balances"
  - id: ERR_CREDITING_RUN_STATE_INVALID
    http: 409
    condition: "Reverse requires run status POSTED"
  - id: ERR_CREDITING_RUN_NOT_LATEST
    http: 409
    condition: "Only the latest POSTED run of the plan (max period_end, tie-break later created_at) may be reversed"
  # --- Fiscal ---
  - id: ERR_DEFERRAL_CAP_EXCEEDED
    http: 402
    condition: "post-deferral would push posted_cents above elected_cap_cents"
  - id: ERR_INSUFFICIENT_VESTED_BALANCE
    http: 402
    condition: "Distribution create: requested_amount_cents > vested_balance_cents; schedule: vested_balance_cents == 0; pay: settled_balance_cents < locked_amount_cents"
  - id: ERR_EXCEEDS_EMERGENCY_NEED
    http: 402
    condition: "UNFORESEEABLE_EMERGENCY request exceeds emergency_need_cents (checked at verify-event)"
  - id: ERR_NEGATIVE_TRUST_ASSETS
    http: 402
    condition: "Funding event would drive RabbiTrust assets_cents below zero"
  - id: ERR_CIC_FUNDING_AMOUNT_MISMATCH
    http: 402
    condition: "CIC_MANDATORY_FUNDING amount_cents != required_funding_cents at post time (exact equality required)"
  # --- Distribution ---
  - id: ERR_EVENT_TYPE_NOT_PERMITTED
    http: 409
    condition: "event_type not in plan.distribution_events_allowed"
  - id: ERR_EVENT_NOT_CONFIRMED
    http: 409
    condition: "verify-event type condition unmet: separation case not DETERMINED_SEPARATED, CIC not VERIFIED, participant not DECEASED/DISABLED, or linkage mismatch"
  - id: ERR_DISTRIBUTION_STATE_INVALID
    http: 409
    condition: "verify requires REQUESTED; deny requires REQUESTED|EVENT_VERIFIED; schedule requires EVENT_VERIFIED"
  - id: ERR_DISTRIBUTION_NOT_PAYABLE
    http: 409
    condition: "pay requires status == PAYABLE (request still SCHEDULED before its payment date, or in any other non-PAYABLE state)"
  - id: ERR_PLAN_DOCUMENT_LAPSED
    http: 403
    condition: "Distribution pay forbidden while plan.document_posture == LAPSED_FAILURE"
  # --- Separation ---
  - id: ERR_OPEN_CASE_EXISTS
    http: 409
    condition: "Participant already has a SeparationCase in OPEN, EVIDENCE_SUBMITTED, or REOPENED"
  - id: ERR_CASE_STATE_INVALID
    http: 409
    condition: "Case action from wrong state (records need OPEN|REOPENED|EVIDENCE_SUBMITTED; determine needs EVIDENCE_SUBMITTED; reopen needs a determined status)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID on both sides of a segregated pair: case opener vs determiner, or failure reporter vs assessor"
  - id: ERR_SERVICE_RECORD_GAP
    http: 409
    condition: "Service records are not contiguous (a period boundary is not shared by the next record's start)"
  - id: ERR_SERVICE_RECORD_OVERLAP
    http: 409
    condition: "Service records overlap (next.period_start < prev.period_end)"
  - id: ERR_SERVICE_FRACTION_CONTRADICTS_OUTCOME
    http: 409
    condition: "Determination outcome contradicts the computed presumption: CONFIRMED requires avg < threshold, REBUTTED requires avg >= threshold"
  - id: ERR_CASE_REOPEN_LIMIT
    http: 409
    condition: "reopen_count already == 1"
  - id: ERR_REOPEN_WINDOW_EXPIRED
    http: 422
    condition: "Reopen attempted after date(determined_at) + 30 days"
  - id: ERR_CASE_HAS_PAID_DISTRIBUTIONS
    http: 409
    condition: "Case has a linked DistributionRequest in PAID; reopening would invalidate a completed payment"
  # --- Specified employees ---
  - id: ERR_LIST_STATE_INVALID
    http: 409
    condition: "Member add or finalize requires list status DRAFT"
  - id: ERR_DRAFT_LIST_EXISTS
    http: 409
    condition: "A DRAFT SpecifiedEmployeeList already exists for the plan"
  - id: ERR_DUPLICATE_MEMBER
    http: 409
    condition: "Participant already has a member row in this list"
  - id: ERR_INVALID_EFFECTIVE_DATE
    http: 422
    condition: "effective_date not in (identification_date, identification_date + 120 days]"
  # --- CIC ---
  - id: ERR_CIC_STATE_INVALID
    http: 409
    condition: "CIC adjudicate requires status REPORTED"
  - id: ERR_CIC_THRESHOLD_NOT_MET
    http: 422
    condition: "stake_change_bp below the event-type threshold (5000 OWNERSHIP / 3500 EFFECTIVE_CONTROL / 4000 ASSET)"
  - id: ERR_NO_VERIFIED_CIC
    http: 409
    condition: "CIC_MANDATORY_FUNDING posted without a VERIFIED ChangeInControlEvent for the plan"
  # --- Failures / findings ---
  - id: ERR_FAILURE_STATE_INVALID
    http: 409
    condition: "quantify requires IDENTIFIED; assess requires QUANTIFIED; correct requires QUANTIFIED|INCLUSION_ASSESSED"
  - id: ERR_CORRECTION_WINDOW_EXPIRED
    http: 422
    condition: "file-correction or correct after the correction deadline (Dec 31 of failure year + 2, inclusive)"
  - id: ERR_FINDING_STATE_INVALID
    http: 409
    condition: "file-correction requires REPORTED; adjudicate requires CORRECTION_FILED"
  - id: ERR_TRUST_EXISTS
    http: 409
    condition: "Plan already has a RabbiTrust"
  - id: ERR_ACCOUNT_EXISTS
    http: 409
    condition: "An Account already exists for (participant_id, plan_id)"
  - id: ERR_ACCOUNT_REQUIRED
    http: 409
    condition: "post-deferral requires an existing Account for the election's (participant, plan)"
  - id: ERR_CROSS_PLAN_REFERENCE
    http: 409
    condition: "Referenced entities belong to different plans/participants (election window/fund/participant mismatch; account/participant plan mismatch; distribution linkage mismatch; list member not in plan; failure distribution not of the same account)"
  # --- Clock ---
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "to_iso8601 earlier than the current logical clock"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanSponsor
    description: "Employer plan sponsor: owns plan configuration, lifecycle, election windows, notional funds, rabbi trust creation, CIC reporting, and adjudication of filed document corrections"
    identity: opaque
    exclusive_operations:
      - "POST /api/plans"
      - "PATCH /api/plans/{planId}"
      - "POST /api/plans/{planId}/activate | suspend | resume | terminate"
      - "POST /api/election-windows"
      - "POST /api/notional-funds"
      - "POST /api/rabbi-trusts"
      - "POST /api/change-in-control-events"
      - "POST /api/document-findings/{findingId}/adjudicate"
    shared_operations:
      - "all GET endpoints"
  - name: BenefitsAdministrator
    description: "Recordkeeper: enrolls participants, opens accounts, posts deferrals, settles ledger entries, runs crediting, opens/evidences/reopens separation cases, schedules and pays distributions, reports operational failures"
    identity: opaque
    exclusive_operations:
      - "POST /api/participants, PATCH /api/participants/{participantId}, POST /api/participants/{participantId}/rehire"
      - "POST /api/accounts, POST /api/accounts/{accountId}/settle-entries"
      - "POST /api/deferral-elections/{electionId}/post-deferral"
      - "POST /api/crediting-runs, POST /api/crediting-runs/{runId}/reverse"
      - "POST /api/separation-cases, POST /api/separation-cases/{caseId}/service-records, POST /api/separation-cases/{caseId}/reopen"
      - "POST /api/distribution-requests/{requestId}/schedule, POST /api/distribution-requests/{requestId}/pay"
      - "POST /api/operational-failures"
    shared_operations:
      - "all GET endpoints"
  - name: ComplianceOfficer
    description: "Compliance: determines separation cases (never own-opened), manages specified-employee lists, verifies/denies distribution events, quantifies/assesses/corrects operational failures (never own-reported assessments), reports and files document findings"
    identity: opaque
    exclusive_operations:
      - "POST /api/separation-cases/{caseId}/determine"
      - "POST /api/specified-employee-lists, POST /api/specified-employee-lists/{listId}/members, POST /api/specified-employee-lists/{listId}/finalize"
      - "POST /api/distribution-requests/{requestId}/verify-event, POST /api/distribution-requests/{requestId}/deny"
      - "POST /api/operational-failures/{failureId}/quantify | assess-inclusion | correct"
      - "POST /api/document-findings, POST /api/document-findings/{findingId}/file-correction"
      - "POST /api/change-in-control-events/{cicId}/adjudicate"
    shared_operations:
      - "all GET endpoints"
  - name: TrustOfficer
    description: "Rabbi trust officer: posts trust funding events; segregated from plan administration and compliance determination"
    identity: opaque
    exclusive_operations:
      - "POST /api/rabbi-trusts/{trustId}/funding-events"
    shared_operations:
      - "all GET endpoints"
  - name: Participant
    description: "Plan participant: creates/submits/voids own deferral elections and requests distributions from own accounts"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /api/deferral-elections, POST /api/deferral-elections/{electionId}/submit, POST /api/deferral-elections/{electionId}/void"
      - "POST /api/distribution-requests"
    shared_operations:
      - "all GET endpoints"
  - name: PlatformAdmin
    description: "Test-driving operator: advances the logical clock only"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
