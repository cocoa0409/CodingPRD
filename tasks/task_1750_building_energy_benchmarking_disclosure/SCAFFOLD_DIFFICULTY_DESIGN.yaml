  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: report_flagged_resubmission_cycle
        grounds:
          - state_machines.BenchmarkReport.FLAGGED_to_SUBMITTED
          - state_machines.BenchmarkReport.SUBMITTED_to_FLAGGED
          - entities.BenchmarkReport.fields.revision_number
        distinguishing_aspect: |
          Cyclic machine on BenchmarkReport: the report revisits SUBMITTED twice
          through the FLAGGED -> SUBMITTED revision loop, with revision_number
          incrementing 0 -> 1 -> 2; a linear pipeline could never re-enter
          SUBMITTED.
        test_recipe:
          setup:
            - "Owner o1; cycle c27 OPEN (standard constants); building b1 50000 sqft OFFICE; units 20000/15000/5000; consents u1,u2 (completeness 90.00)"
            - "Report rep1 created and submitted on time (no usage needed) -> SUBMITTED, revision_number 0"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner F", contact_email: "of@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "7 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u2: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
            - { call: "POST /v1/tenant-units/${u2}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg2: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg2}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u2}" }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id } }
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
          trigger:
            - { call: "POST /v1/benchmark-reports/${rep1}/anomaly-flags", payload: { detail: "Meter mismatch on account E-1" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { af1: $.data.id } }
            - { call: "POST /v1/anomaly-flags/${af1}/resolve", payload: { resolution_note: "Re-read confirmed meter E-1 correct" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "GET /v1/benchmark-reports/${rep1}", as: ComplianceOfficer, captures: { st1: $.data.status, rev1: $.data.revision_number } }
            - { call: "POST /v1/benchmark-reports/${rep1}/anomaly-flags", payload: { detail: "Second audit query on E-1" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { af2: $.data.id } }
            - { call: "POST /v1/anomaly-flags/${af2}/resolve", payload: { resolution_note: "Second review also confirms data" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "GET /v1/benchmark-reports/${rep1}", as: ComplianceOfficer, captures: { st2: $.data.status, rev2: $.data.revision_number } }
          assert:
            - "after first loop: status == SUBMITTED and revision_number == 1"
            - "after second loop: status == SUBMITTED and revision_number == 2"
            - "SUBMITTED -> FLAGGED -> SUBMITTED ran twice on the same report (cyclic revisit)"

      - name: exemption_appeal_loop_reenters_review
        grounds:
          - state_machines.ExemptionRequest.DENIED_to_APPEALED
          - state_machines.ExemptionRequest.APPEALED_to_UNDER_REVIEW
          - state_machines.ExemptionRequest.UNDER_REVIEW_to_DENIED_FINAL
        distinguishing_aspect: |
          Branching + bounded cycle on ExemptionRequest (a different entity from
          BenchmarkReport): UNDER_REVIEW forks APPROVED / DENIED / DENIED_FINAL,
          and the DENIED -> APPEALED -> UNDER_REVIEW loop is gated by appeal_used
          so the second denial lands in the distinct terminal DENIED_FINAL.
        test_recipe:
          setup:
            - "Owner o1; cycle c27 OPEN (standard constants); building b1 50000 sqft OFFICE with NO report filed"
            - "EXEMPTION request er1 created -> SUBMITTED"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner G", contact_email: "og@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "8 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/exemption-requests", payload: { cycle_id: "${c27}", request_type: "EXEMPTION", reason: "Building gut renovation, vacant all year" }, as: BuildingOwner, as_user_id: "${o1}", captures: { er1: $.data.id } }
          trigger:
            - { call: "POST /v1/exemption-requests/${er1}/start-review", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/exemption-requests/${er1}/decide", payload: { decision: "DENIED", decision_note: "Insufficient vacancy evidence" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { s_denied: $.data.status } }
            - { call: "POST /v1/exemption-requests/${er1}/appeal", payload: { appeal_note: "Attaching utility disconnect records" }, as: BuildingOwner, as_user_id: "${o1}", captures: { s_appealed: $.data.status, used: $.data.appeal_used } }
            - { call: "POST /v1/exemption-requests/${er1}/start-review", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/exemption-requests/${er1}/decide", payload: { decision: "DENIED", decision_note: "Evidence still insufficient" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { s_final: $.data.status } }
            - { call: "POST /v1/exemption-requests/${er1}/appeal", payload: { appeal_note: "Second appeal attempt" }, as: BuildingOwner, as_user_id: "${o1}", captures: { err: $.data.error_id } }
          assert:
            - "first decide lands in DENIED (s_denied == DENIED)"
            - "appeal lands in APPEALED with appeal_used == true (the cycle DENIED -> APPEALED -> UNDER_REVIEW)"
            - "second decide with appeal_used == true lands in the distinct terminal DENIED_FINAL (s_final == DENIED_FINAL)"
            - "further appeal is rejected: err == ERR_INVALID_STATE_TRANSITION (loop is bounded by appeal_used)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: usage_void_downgrades_report_and_supersedes_disclosure
        grounds:
          - state_machines.UsageRecord.ACTIVE_to_VOIDED
          - state_machines.BenchmarkReport.VERIFIED_to_FLAGGED
          - state_machines.DisclosurePublication.PUBLISHED_to_SUPERSEDED
          - calculations.correction_delta_evaluation
        distinguishing_aspect: |
          Depth-3 chain from POST /v1/usage-records/{id}/void: the void recomputes
          the VERIFIED report (link 1), the 100% EUI delta downgrades it to
          FLAGGED with a VERIFICATION_REOPENED anomaly (link 2), and that
          downgrade supersedes the PUBLISHED disclosure and spawns a replacement
          DRAFT at version 2 (link 3). Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Owner o1; verifier v1; cycle c27 OPEN (standard constants)"
            - "Building b1 50000 sqft OFFICE; units 20000/15000/5000; consents u1,u2 (completeness 90.00)"
            - "Account E-1; one usage record 1200000 kWh for all of 2027 (4094400 kBtu, eui 81.89)"
            - "Report rep1 submitted on time, verified (VERIFIED, verified_site_eui 81.89)"
            - "Clock past deadline; close-filing (no fines: verified and under tolerance); publication created and PUBLISHED with included_report_count 1; cycle PUBLISHED"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner H", contact_email: "oh@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
