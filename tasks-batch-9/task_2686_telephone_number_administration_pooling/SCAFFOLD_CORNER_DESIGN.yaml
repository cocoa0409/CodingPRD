      - name: npa_posture_cycles_jeopardy_then_back_to_active_as_inventory_loads
        claim_type: cyclic
        grounds: ["state_machines.NPA.transitions.ACTIVE_to_JEOPARDY", "state_machines.NPA.transitions.JEOPARDY_to_ACTIVE", "calculations.npa_exhaust_posture"]
        distinguishing_aspect: "The posture axis is a genuine loop driven by inventory: the first loaded block pushes 614 to JEOPARDY (available 1 <= 4), and the fifth returns it to ACTIVE with jeopardy_declared_at cleared back to null and every rate center's jeopardy_flag lowered."
        test_recipe:
          setup: ["NPA 614 with rate center COLUMBUS. Blocks 614-554-0 through 614-554-3 have been loaded unassigned one at a time, so available_block_count is 4 and the code is already in JEOPARDY with jeopardy_declared_at 2026-08-01T00:00:00Z."]
