scenario: "Concert Verified Fan Ticketing: presale code, virtual queue, dynamic pricing, transfer restrictions, Resale price cap, refund policy, Bot detection, Mobile-only entry"
domain_name: concert-verified-fan-ticketing
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation

  entity_topology: flat
  # Peer entities (Fan, Event, PriceTier, QueueEntry, Order, Ticket, Transfer, ResaleListing)
  # linked by foreign keys; no nesting in URL paths.

  state_machine_shape: branching
  # QueueEntry forks WAITING -> {OFFERED -> {PURCHASED, EXPIRED}, REVOKED}; Order branches
  # to PAID or CANCELLED with divergent side-effects. Ticket carries a parallel entry_status.

  relationship_patterns:
    - one_to_many   # Event -> PriceTier, Event -> QueueEntry, Order -> Ticket
    - flat_fk       # Ticket -> Fan (holder), Transfer -> Ticket, ResaleListing -> Ticket
    - cross_aggregate  # ResaleListing references both Ticket and Event-derived price cap

  role_model: peer_roles
  # Fan owns queue entries / orders / tickets; PromoterAdmin owns events and pricing;
  # GateScanner performs mobile-only entry scans; opaque operational roles.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ───────────────────────────────────────────────────────────────────────────
# §1.1 Entity-Relationship Table
# ───────────────────────────────────────────────────────────────────────────
entities:
  - name: Fan
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique across all Fans."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Fan legal name printed on tickets for entry."
      - name: device_fingerprint
        type: string
        source: input
        description: "Opaque device hash captured at registration; reused to detect bot rings."
      - name: risk_score
        type: integer
        source: computed
        description: "Bot-detection score 0..100 recomputed on registration and on each queue join; see calculations.bot_risk_score."
        default: 0
      - name: verification_status
        type: enum
        source: computed
        description: "Verified-fan gate derived from risk_score thresholds; see state_machines.Fan."
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED, FLAGGED}"
      - name: completed_purchase_count
        type: integer
        source: computed
        description: "Count of this Fan's Orders in PAID state; used by resale eligibility and refund tiering."
        default: 0
      - name: version
        type: integer
        source: system
        description: "OCC version, starts at 1, +1 on every mutation including cascades."

  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only."
      - name: title
        type: string
        source: input
        description: "Concert title."
      - name: venue_capacity
        type: integer
        source: input
        description: "Total mobile-entry capacity of the venue."
        constraints: "> 0"
      - name: presale_code
        type: string
        source: input
        description: "Single shared presale code required to join the virtual queue during presale."
        constraints: "non-empty"
      - name: face_value_cents
        type: integer
        source: input
        description: "Base face value used as the dynamic-pricing floor and the resale price-cap basis."
        constraints: "> 0"
      - name: resale_cap_pct
        type: integer
        source: input
        description: "Maximum resale markup over face value, percent; resale price cap = face_value_cents * (100 + resale_cap_pct) / 100."
        default: 110
        constraints: ">= 100"
      - name: tickets_sold_count
        type: integer
        source: computed
        description: "Count of Tickets issued for this Event (Order PAID); drives dynamic-pricing demand band."
        default: 0
      - name: sales_status
        type: enum
        source: computed
        description: "Lifecycle gate for the Event; see state_machines.Event."
        default: DRAFT
        constraints: "one of {DRAFT, PRESALE, GENERAL, SOLD_OUT, CLOSED}"
      - name: version
        type: integer
        source: system
        description: "OCC version, starts at 1, +1 on every mutation including cascades."

  - name: PriceTier
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only."
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the Event this tier belongs to."
      - name: name
        type: string
        source: input
        description: "Tier label, e.g. FLOOR, MEZZANINE."
      - name: allocation
        type: integer
        source: input
        description: "Seats allocated to this tier; the finite pool the virtual queue competes for."
        constraints: "> 0"
      - name: base_multiplier_bps
        type: integer
        source: input
        description: "Tier price multiplier over Event.face_value_cents, in basis points (10000 = 1.0x)."
        constraints: ">= 10000"
      - name: reserved_count
        type: integer
        source: computed
        description: "Seats currently held by OFFERED (not yet paid, not expired) QueueEntries for this tier; incremented on WAITING->OFFERED, decremented on OFFERED->EXPIRED/REVOKED and on conversion to sold at pay. Tier occupancy = reserved_count + sold_count."
        default: 0
      - name: sold_count
        type: integer
        source: computed
        description: "Seats committed by PAID Orders for this tier."
        default: 0
      - name: version
        type: integer
        source: system
        description: "OCC version, starts at 1, +1 on every mutation including cascades."

  - name: QueueEntry
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only."
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the Event being queued for."
      - name: fan_id
        type: string
        source: input
        description: "FK -> Fan.id; the Fan holding this queue position."
      - name: tier_id
        type: string
        source: input
        description: "FK -> PriceTier.id; the tier this entry requests a seat in."
      - name: presale_code_used
        type: string
        source: input
        description: "Presale code submitted at join time; must equal Event.presale_code during PRESALE."
      - name: queue_position
        type: integer
        source: computed
        description: "1-based admission rank assigned at join; lower admits first; ordered by join time (created_at ASC)."
      - name: requested_qty
        type: integer
        source: input
        description: "Seats requested (1..MAX_PER_FAN)."
        constraints: "1..6"
      - name: status
        type: enum
        source: computed
        description: "Queue lifecycle; see state_machines.QueueEntry."
        default: WAITING
        constraints: "one of {WAITING, OFFERED, PURCHASED, EXPIRED, REVOKED}"
      - name: offer_expires_at
        type: datetime
        source: computed
        description: "When set (on OFFERED), the offer window deadline = offer time + OFFER_WINDOW_SECONDS; null otherwise."
      - name: version
        type: integer
        source: system
        description: "OCC version, starts at 1, +1 on every mutation including cascades."

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only."
      - name: queue_entry_id
        type: string
        source: input
        description: "FK -> QueueEntry.id; the OFFERED entry this order redeems."
      - name: fan_id
        type: string
        source: input
        description: "FK -> Fan.id; purchasing Fan (must equal the queue entry's fan_id)."
      - name: tier_id
        type: string
        source: input
        description: "FK -> PriceTier.id; tier purchased (inherited from the queue entry)."
      - name: quantity
        type: integer
        source: input
        description: "Seats purchased; must equal the queue entry's requested_qty."
        constraints: "1..6"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Per-seat dynamic price locked at order creation; see calculations.dynamic_unit_price."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "unit_price_cents * quantity."
      - name: service_fee_cents
        type: integer
        source: computed
        description: "Per-order fee; see calculations.order_total (rounding order pinned there)."
      - name: total_cents
        type: integer
        source: computed
        description: "Final charge; see calculations.order_total."
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Amount returned on cancellation; see calculations.refund_amount; 0 until refunded."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Order lifecycle; see state_machines.Order."
        default: PENDING
        constraints: "one of {PENDING, PAID, REFUNDED, CANCELLED}"
      - name: version
        type: integer
        source: system
        description: "OCC version, starts at 1, +1 on every mutation including cascades."

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only."
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the paid Order that issued this ticket."
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the Event admitted to."
      - name: holder_fan_id
        type: string
        source: input
        description: "FK -> Fan.id; current ticket holder (changes on completed Transfer)."
      - name: seat_label
        type: string
        source: system
        description: "Seat assignment string minted at issuance."
      - name: entry_status
        type: enum
        source: computed
        description: "Mobile-entry dimension, independent of transfer/resale; see state_machines.Ticket."
        default: VALID
        constraints: "one of {VALID, SCANNED, VOID}"
      - name: holding_status
        type: enum
        source: computed
        description: "Transfer/resale dimension, independent of entry_status; see state_machines.Ticket."
        default: HELD
        constraints: "one of {HELD, TRANSFER_PENDING, LISTED}"
      - name: version
        type: integer
        source: system
        description: "OCC version, starts at 1, +1 on every mutation including cascades."

  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket being transferred."
      - name: sender_fan_id
        type: string
        source: input
        description: "FK -> Fan.id; the current holder initiating the transfer."
      - name: recipient_fan_id
        type: string
        source: input
        description: "FK -> Fan.id; the verified Fan receiving the ticket."
      - name: status
        type: enum
        source: computed
        description: "Transfer lifecycle; see state_machines.Transfer."
        default: PENDING
        constraints: "one of {PENDING, ACCEPTED, DECLINED, CANCELLED}"
      - name: version
        type: integer
        source: system
        description: "OCC version, starts at 1, +1 on every mutation including cascades."

  - name: ResaleListing
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket offered for resale."
      - name: seller_fan_id
        type: string
        source: input
        description: "FK -> Fan.id; the current holder reselling."
      - name: list_price_cents
        type: integer
        source: input
        description: "Asking price per ticket; must be <= resale price cap (see validations)."
        constraints: "> 0"
      - name: buyer_fan_id
        type: string
        source: computed
        description: "FK -> Fan.id; set on completion to the purchasing Fan; null while OPEN."
      - name: status
        type: enum
        source: computed
        description: "Resale lifecycle; see state_machines.ResaleListing."
        default: OPEN
        constraints: "one of {OPEN, SOLD, CANCELLED}"
      - name: version
        type: integer
        source: system
        description: "OCC version, starts at 1, +1 on every mutation including cascades."

# ───────────────────────────────────────────────────────────────────────────
# §1.2 State Machine Table
# ───────────────────────────────────────────────────────────────────────────
state_machines:
  - entity: Fan
    initial_state: UNVERIFIED
    terminal_states: [FLAGGED]
    note: "Registration always lands a Fan in UNVERIFIED with risk_score computed; an explicit verify step resolves to VERIFIED or FLAGGED. UNVERIFIED is a real resting state: an UNVERIFIED fan may not receive transfers or buy resale (priority-9 restriction) but is not bot-flagged."
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /fans/{id}/verify"
        actor: Fan
        preconditions:
          - "Fan.verification_status == UNVERIFIED"
          - "risk_score < BOT_FLAG_THRESHOLD (70)"
        side_effects:
          - "set verification_status = VERIFIED"
        note: "VERIFIED is required before a Fan may join a queue, accept a transfer, or buy resale."
      - from: UNVERIFIED
        to: FLAGGED
        trigger: "POST /fans/{id}/verify when risk_score >= BOT_FLAG_THRESHOLD"
        actor: Fan
        preconditions:
          - "Fan.verification_status == UNVERIFIED"
          - "risk_score >= BOT_FLAG_THRESHOLD (70)"
        side_effects:
          - "set verification_status = FLAGGED"
        note: "Terminal; FLAGGED fans cannot verify, join queues, purchase, transfer, or receive transfers."
      - from: VERIFIED
        to: FLAGGED
        trigger: "system on subsequent queue join when recomputed risk_score >= BOT_FLAG_THRESHOLD"
        actor: system
        preconditions:
          - "risk_score >= BOT_FLAG_THRESHOLD (70)"
        side_effects:
          - "set verification_status = FLAGGED"
          - "cascade: REVOKE all of this Fan's QueueEntries in {WAITING, OFFERED} (see QueueEntry.* -> REVOKED)"
        note: "Cross-entity cascade: flagging a previously-verified fan revokes their live queue holds."

  - entity: Event
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PRESALE
        trigger: "POST /events/{id}/open-presale"
        actor: PromoterAdmin
        preconditions:
          - "at least one PriceTier exists for the Event"
          - "expected_event_version matches Event.version"
        side_effects:
          - "set sales_status = PRESALE"
          - "increments Event.version by 1"
        note: "During PRESALE, joining the queue requires a matching presale_code."
      - from: PRESALE
        to: GENERAL
        trigger: "POST /events/{id}/open-general"
        actor: PromoterAdmin
        preconditions:
          - "expected_event_version matches Event.version"
        side_effects:
          - "set sales_status = GENERAL"
          - "increments Event.version by 1"
        note: "During GENERAL, presale_code is not required to join the queue."
      - from: GENERAL
        to: SOLD_OUT
        trigger: "system when tickets_sold_count == venue_capacity after an Order reaches PAID"
        actor: system
        preconditions:
          - "tickets_sold_count == venue_capacity"
        side_effects:
          - "set sales_status = SOLD_OUT"
          - "cascade: REVOKE all WAITING QueueEntries for this Event (bubble from capacity reached)"
      - from: PRESALE
        to: SOLD_OUT
        trigger: "system when tickets_sold_count == venue_capacity after an Order reaches PAID"
        actor: system
        preconditions:
          - "tickets_sold_count == venue_capacity"
        side_effects:
          - "set sales_status = SOLD_OUT"
          - "cascade: REVOKE all WAITING QueueEntries for this Event"
      - from: SOLD_OUT
        to: CLOSED
        trigger: "POST /events/{id}/close"
        actor: PromoterAdmin
        preconditions:
          - "expected_event_version matches Event.version"
        side_effects:
          - "set sales_status = CLOSED"
          - "increments Event.version by 1"
      - from: GENERAL
        to: CLOSED
        trigger: "POST /events/{id}/close"
        actor: PromoterAdmin
        preconditions:
          - "expected_event_version matches Event.version"
        side_effects:
          - "set sales_status = CLOSED"
          - "increments Event.version by 1"

  - entity: QueueEntry
    initial_state: WAITING
    terminal_states: [PURCHASED, EXPIRED, REVOKED]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "POST /events/{id}/advance-queue (PromoterAdmin advances the next admittable entries)"
        actor: PromoterAdmin
        preconditions:
          - "Event.sales_status IN {PRESALE, GENERAL}"
          - "this entry has the lowest queue_position among WAITING entries for the tier (created_at ASC) whose requested_qty still fits remaining allocation"
          - "tier remaining = allocation - (reserved_count + sold_count) >= entry.requested_qty"
        side_effects:
          - "set status = OFFERED"
          - "set offer_expires_at = now + OFFER_WINDOW_SECONDS"
          - "increment PriceTier.reserved_count by requested_qty (ledger sync)"
          - "increments PriceTier.version by 1"
        note: "Admission order is queue_position ASC (created_at ASC); never id."
      - from: OFFERED
        to: PURCHASED
        trigger: "POST /orders (Fan redeems the offer)"
        actor: Fan
        preconditions:
          - "offer not expired: now <= offer_expires_at"
          - "an Order reaches PAID for this entry"
        side_effects:
          - "set status = PURCHASED"
        note: "PURCHASED is reached only via a PAID Order; reserved seats convert to sold in the Order cascade."
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /events/{id}/advance-queue (system sweeps expired offers) or system on stale offer"
        actor: system
        preconditions:
          - "now > offer_expires_at"
        side_effects:
          - "set status = EXPIRED"
          - "decrement PriceTier.reserved_count by requested_qty (release seats back to pool)"
          - "increments PriceTier.version by 1"
        note: "Released seats return to the finite pool for the next WAITING entry."
      - from: WAITING
        to: REVOKED
        trigger: "system cascade (Event SOLD_OUT, or Fan FLAGGED)"
        actor: system
        preconditions:
          - "triggering cascade condition holds"
        side_effects:
          - "set status = REVOKED"
      - from: OFFERED
        to: REVOKED
        trigger: "system cascade (Fan FLAGGED)"
        actor: system
        preconditions:
          - "owning Fan transitioned to FLAGGED"
        side_effects:
          - "set status = REVOKED"
          - "decrement PriceTier.reserved_count by requested_qty (release held seats)"
          - "increments PriceTier.version by 1"

  - entity: Order
    initial_state: PENDING
    terminal_states: [REFUNDED, CANCELLED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: Fan
        preconditions:
          - "Order.status == PENDING"
          - "linked QueueEntry.status == OFFERED and not expired"
          - "expected_order_version matches Order.version"
        side_effects:
          - "set status = PAID"
          - "transition linked QueueEntry WAITING/OFFERED -> PURCHASED"
          - "move PriceTier seats reserved -> sold: reserved_count -= quantity, sold_count += quantity"
          - "issue `quantity` Tickets (entry_status=VALID, holding_status=HELD, holder_fan_id=fan_id)"
          - "increment Event.tickets_sold_count by quantity"
          - "increment Fan.completed_purchase_count by 1"
          - "increments Order.version by 1"
          - "cascade: if Event.tickets_sold_count == venue_capacity, Event -> SOLD_OUT (which revokes WAITING entries)"
        note: "Depth-3 cascade: pay -> Event.tickets_sold_count update -> Event SOLD_OUT -> WAITING QueueEntries REVOKED."
      - from: PENDING
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel (before payment) or system on offer expiry"
        actor: Fan
        preconditions:
          - "Order.status == PENDING"
        side_effects:
          - "set status = CANCELLED"
          - "set refund_amount_cents = 0"
        note: "Unpaid cancel releases nothing extra; the QueueEntry offer handles seat release on expiry."
      - from: PAID
        to: REFUNDED
        trigger: "POST /orders/{id}/refund"
        actor: Fan
        preconditions:
          - "Order.status == PAID"
          - "none of the Order's Tickets are SCANNED (entry_status)"
          - "expected_order_version matches Order.version"
        side_effects:
          - "set status = REFUNDED"
          - "set refund_amount_cents per calculations.refund_amount"
          - "VOID all of the Order's Tickets (entry_status -> VOID)"
          - "PriceTier.sold_count -= quantity (seats return to pool)"
          - "Event.tickets_sold_count -= quantity"
          - "Fan.completed_purchase_count -= 1"
          - "increments Order.version by 1"
          - "cascade: if Event.sales_status == SOLD_OUT, Event -> GENERAL (seats freed re-open general sales)"
        note: "Depth-3 compensation cascade: refund -> tickets_sold_count decrement -> Event SOLD_OUT->GENERAL re-open."

  - entity: Ticket
    initial_state: VALID
    terminal_states: [VOID]
    note: "Parallel dimensions: entry_status {VALID,SCANNED,VOID} evolves independently of holding_status {HELD,TRANSFER_PENDING,LISTED}."
    transitions:
      - from: VALID
        to: SCANNED
        trigger: "POST /tickets/{id}/scan"
        actor: GateScanner
        preconditions:
          - "entry_status == VALID"
          - "Event.sales_status IN {GENERAL, SOLD_OUT, CLOSED}"
          - "scan request carries device_channel == MOBILE (mobile-only entry)"
          - "holding_status != TRANSFER_PENDING and holding_status != LISTED"
        side_effects:
          - "set entry_status = SCANNED"
        note: "Mobile-only entry: a non-MOBILE channel is rejected."
      - from: VALID
        to: VOID
        trigger: "system cascade on Order refund or completed resale supersession"
        actor: system
        preconditions:
          - "owning Order refunded OR ticket superseded by completed resale"
        side_effects:
          - "set entry_status = VOID"
      - from: HELD
        to: TRANSFER_PENDING
        trigger: "POST /transfers (sender initiates)"
        actor: Fan
        preconditions:
          - "holding_status == HELD"
          - "entry_status == VALID"
        side_effects:
          - "set holding_status = TRANSFER_PENDING"
        note: "holding_status dimension; entry_status untouched."
      - from: TRANSFER_PENDING
        to: HELD
        trigger: "POST /transfers/{id}/accept (recipient) or /decline or /cancel"
        actor: Fan
        preconditions:
          - "holding_status == TRANSFER_PENDING"
        side_effects:
          - "set holding_status = HELD"
          - "on accept: set holder_fan_id = recipient_fan_id"
      - from: HELD
        to: LISTED
        trigger: "POST /resale-listings"
        actor: Fan
        preconditions:
          - "holding_status == HELD"
          - "entry_status == VALID"
        side_effects:
          - "set holding_status = LISTED"
      - from: LISTED
        to: HELD
        trigger: "POST /resale-listings/{id}/cancel"
        actor: Fan
        preconditions:
          - "holding_status == LISTED"
        side_effects:
          - "set holding_status = HELD"

  - entity: Transfer
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /transfers/{id}/accept"
        actor: Fan
        preconditions:
          - "Transfer.status == PENDING"
          - "acting Fan == recipient_fan_id"
          - "recipient Fan.verification_status == VERIFIED (transfer restriction)"
          - "Ticket.holding_status == TRANSFER_PENDING"
        side_effects:
          - "set status = ACCEPTED"
          - "set Ticket.holder_fan_id = recipient_fan_id"
          - "set Ticket.holding_status = HELD"
      - from: PENDING
        to: DECLINED
        trigger: "POST /transfers/{id}/decline"
        actor: Fan
        preconditions:
          - "Transfer.status == PENDING"
          - "acting Fan == recipient_fan_id"
        side_effects:
          - "set status = DECLINED"
          - "set Ticket.holding_status = HELD"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /transfers/{id}/cancel"
        actor: Fan
        preconditions:
          - "Transfer.status == PENDING"
          - "acting Fan == sender_fan_id"
        side_effects:
          - "set status = CANCELLED"
          - "set Ticket.holding_status = HELD"

  - entity: ResaleListing
    initial_state: OPEN
    terminal_states: [SOLD, CANCELLED]
    transitions:
      - from: OPEN
        to: SOLD
        trigger: "POST /resale-listings/{id}/buy"
        actor: Fan
        preconditions:
          - "ResaleListing.status == OPEN"
          - "buyer Fan.verification_status == VERIFIED"
          - "buyer_fan_id != seller_fan_id"
          - "expected_resalelisting_version matches ResaleListing.version"
        side_effects:
          - "set status = SOLD"
          - "set buyer_fan_id = acting Fan"
          - "set Ticket.holder_fan_id = buyer_fan_id"
          - "set Ticket.holding_status = HELD"
          - "increments ResaleListing.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /resale-listings/{id}/cancel"
        actor: Fan
        preconditions:
          - "ResaleListing.status == OPEN"
          - "acting Fan == seller_fan_id"
        side_effects:
          - "set status = CANCELLED"
          - "set Ticket.holding_status = HELD"

# ───────────────────────────────────────────────────────────────────────────
# §1.2.1 Concurrency Rules (OCC on parent version only)
# ───────────────────────────────────────────────────────────────────────────
concurrency_rules:
  - rule_id: order-pay-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/pay"
    occ_field: "expected_order_version"
    description: |
      Paying an Order whose version has advanced since the client last
      observed it is rejected as stale. This captures the case where a
      prior mutation (e.g. a cancel attempt that bumped the order, or a
      system offer-expiry cascade touching the order) has advanced the
      order's version and the current payer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: resale-buy-stale-listing
    parent_entity: ResaleListing
    write_endpoint: "POST /resale-listings/{id}/buy"
    occ_field: "expected_resalelisting_version"
    description: |
      Buying a ResaleListing whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      buyer has already completed the purchase (legitimately moving the
      listing OPEN->SOLD and advancing its version) and the current
      buyer's view of the listing is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ───────────────────────────────────────────────────────────────────────────
# §1.3 Calculation Rules Table
# ───────────────────────────────────────────────────────────────────────────
calculations:
  - name: bot_risk_score
    trigger: "on POST /fans (registration) and on POST /queue-entries (queue join), recompute Fan.risk_score"
    algorithm: weighted_scoring
    formula: |
      # Bot-detection risk scoring on the Fan domain (0..100, clamped).
      shared_device = count of OTHER Fans (id != this.id) with the same device_fingerprint
      # tiered contribution from device sharing
      device_pts = min(60, shared_device * DEVICE_SHARE_WEIGHT)        # 20 pts per shared device, cap 60
      velocity = count of QueueEntries this Fan created in the last VELOCITY_WINDOW_SECONDS (by created_at),
                 INCLUDING the queue-entry being created by the current join (so the Nth join sees velocity=N
                 when all prior joins fall inside the window)
      velocity_pts = min(30, max(0, velocity - VELOCITY_FREE) * VELOCITY_WEIGHT)  # free first 2, then 15/join, cap 30
      email_pts = EMAIL_PLUS_PENALTY if email contains '+' else 0       # alias-email heuristic
      risk_score = min(100, device_pts + velocity_pts + email_pts)
    input_set: "OTHER Fans sharing device_fingerprint; this Fan's QueueEntries within the velocity window."
    constants:
      DEVICE_SHARE_WEIGHT: 20
      VELOCITY_WINDOW_SECONDS: 3600
      VELOCITY_FREE: 2
      VELOCITY_WEIGHT: 15
      EMAIL_PLUS_PENALTY: 25
      BOT_FLAG_THRESHOLD: 70
    precision: "integer points; clamp to [0,100]"
    variants: []

  - name: dynamic_unit_price
    trigger: "computed at POST /orders creation; locks Order.unit_price_cents"
    algorithm: tiered_pricing
    formula: |
      # Dynamic pricing on the Order/Event domain: demand band x tier multiplier.
      base = Event.face_value_cents
      tier_priced = round_half_up(base * PriceTier.base_multiplier_bps / 10000)   # tier multiplier first
      sold_ratio = Event.tickets_sold_count / Event.venue_capacity                 # demand band BEFORE this order
      # tiered demand surcharge bands (>= boundaries are inclusive at the lower edge)
      if sold_ratio < 0.50:      demand_bps = 0
      elif sold_ratio < 0.80:    demand_bps = 1500      # 15%
      elif sold_ratio < 1.00:    demand_bps = 3000      # 30%
      else:                      demand_bps = 3000
      unit_price_cents = round_half_up(tier_priced * (10000 + demand_bps) / 10000)
      # floor: never below face value
      unit_price_cents = max(unit_price_cents, base)
    input_set: "Event.tickets_sold_count snapshot at order creation (before this order's seats commit)."
    constants:
      BAND1_RATIO: 0.50
      BAND2_RATIO: 0.80
      BAND1_BPS: 1500
      BAND2_BPS: 3000
    precision: "integer cents; round_half_up at each pinned step"
    variants:
      - name: presale_locked
        when: "Event.sales_status == PRESALE at order creation"
        difference: "demand_bps is forced to 0 (presale buyers pay tier price with no surcharge), independent of sold_ratio."

  - name: order_total
    trigger: "computed at POST /orders creation; sets subtotal_cents, service_fee_cents, total_cents"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: compute per-seat price, then sum (subtotal),
      # then apply the percentage fee to the subtotal (sum-then-fee), NOT per seat.
      subtotal_cents = unit_price_cents * quantity                       # exact, no rounding (integer cents)
      service_fee_cents = round_half_up(subtotal_cents * SERVICE_FEE_BPS / 10000)   # fee on the SUM
      total_cents = subtotal_cents + service_fee_cents
    input_set: "Order.unit_price_cents (from dynamic_unit_price) and Order.quantity."
    constants:
      SERVICE_FEE_BPS: 1200
    precision: "integer cents; round_half_up applied once, to the fee on the summed subtotal."
    variants: []

  - name: refund_amount
    trigger: "computed on POST /orders/{id}/refund; sets Order.refund_amount_cents"
    algorithm: threshold
    formula: |
      # Refund policy on the Order/Fan domain: loyalty-tiered refund of total_cents.
      # Fee is non-refundable; principal refunded depends on the holder's loyalty tier.
      principal = subtotal_cents                                          # service_fee never refunded
      if Fan.completed_purchase_count >= LOYALTY_THRESHOLD:               # loyal fans (>=3 prior PAID)
          refund_amount_cents = principal                                 # full principal
      else:
          refund_amount_cents = round_half_up(principal * STANDARD_REFUND_BPS / 10000)  # 90% of principal
    input_set: "Order.subtotal_cents, Order.service_fee_cents, holder Fan.completed_purchase_count at refund time."
    constants:
      LOYALTY_THRESHOLD: 3
      STANDARD_REFUND_BPS: 9000
    precision: "integer cents; round_half_up."
    variants:
      - name: loyal_full_refund
        when: "Fan.completed_purchase_count >= 3"
        difference: "principal refunded in full instead of at 90%."

  - name: resale_price_cap
    trigger: "computed on POST /resale-listings to validate list_price_cents"
    algorithm: threshold
    formula: |
      # Resale price cap on the ResaleListing/Event domain.
      resale_cap_cents = round_half_up(Event.face_value_cents * (100 + Event.resale_cap_pct) / 100)
      # validation passes iff list_price_cents <= resale_cap_cents
    input_set: "Event.face_value_cents and Event.resale_cap_pct of the listed Ticket's Event."
    constants: {}
    precision: "integer cents; round_half_up."
    variants: []

# ───────────────────────────────────────────────────────────────────────────
# §1.4 Validation Rules Table (ordered by priority)
# ───────────────────────────────────────────────────────────────────────────
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right (event, tier, fan, queue entry, order, ticket, transfer, listing)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "Acting entity_backed Fan (X-User-ID) owns the resource being mutated (e.g. order.fan_id, ticket.holder_fan_id, listing.seller_fan_id, transfer party)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /orders, /orders/{id}/pay, /orders/{id}/refund, /transfers, /resale-listings, transfer accept/decline/cancel"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Bot-detection gate: acting Fan.verification_status == FLAGGED is barred from verifying, queue join, order pay, initiating/accepting transfers, listing/buying resale"
    error_id: ERR_FAN_FLAGGED
    http_status: 403
    applies_to: "POST /fans/{id}/verify, /queue-entries, /orders/{id}/pay, /transfers, /transfers/{id}/accept, /resale-listings, /resale-listings/{id}/buy"
  - priority: 7
    category: business_constraint
    check: "Presale gate: during Event.sales_status == PRESALE, presale_code_used must equal Event.presale_code"
    error_id: ERR_INVALID_PRESALE_CODE
    http_status: 422
    applies_to: "POST /queue-entries"
  - priority: 8
    category: business_constraint
    check: "Mobile-only entry: POST /tickets/{id}/scan must carry device_channel == MOBILE"
    error_id: ERR_NON_MOBILE_ENTRY
    http_status: 422
    applies_to: "POST /tickets/{id}/scan"
  - priority: 9
    category: business_constraint
    check: "Verified-fan restriction: the acting Fan must be VERIFIED (== VERIFIED, not UNVERIFIED). On queue join / order pay / transfer initiate / resale list, the acting Fan; on transfer accept / resale buy, the recipient/buyer who is the acting Fan. (FLAGGED actors are caught earlier at priority 6.)"
    error_id: ERR_FAN_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /queue-entries, /orders/{id}/pay, /transfers, /transfers/{id}/accept, /resale-listings, /resale-listings/{id}/buy"
  - priority: 10
    category: business_constraint
    check: "Self-dealing barred: resale buyer_fan_id != seller_fan_id; transfer recipient_fan_id != sender_fan_id"
    error_id: ERR_SELF_DEALING
    http_status: 422
    applies_to: "POST /resale-listings/{id}/buy, /transfers"
  - priority: 11
    category: business_fiscal
    check: "Resale price cap: list_price_cents <= resale_price_cap (see calculations.resale_price_cap)"
    error_id: ERR_RESALE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /resale-listings"
  - priority: 12
    category: business_constraint
    check: "Order quantity must equal the redeemed QueueEntry.requested_qty; requested_qty in 1..MAX_PER_FAN(6)"
    error_id: ERR_QTY_MISMATCH
    http_status: 422
    applies_to: "POST /orders"
  - priority: 13
    category: business_constraint
    check: "Refund barred once any of the Order's Tickets is SCANNED (entry already used)"
    error_id: ERR_TICKET_ALREADY_SCANNED
    http_status: 422
    applies_to: "POST /orders/{id}/refund"
  - priority: 14
    category: business_constraint
    check: "Offer expiry: redeeming a QueueEntry whose offer_expires_at < now is rejected"
    error_id: ERR_OFFER_EXPIRED
    http_status: 422
    applies_to: "POST /orders"
  - priority: 15
    category: business_fiscal
    check: "Allocation cap: a tier offer/order may not push reserved_count+sold_count above PriceTier.allocation"
    error_id: ERR_ALLOCATION_EXCEEDED
    http_status: 422
    applies_to: "POST /events/{id}/advance-queue, POST /orders"
  - priority: 16
    category: business_constraint
    check: "Required input fields present and well-typed per endpoint input schema"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 17
    category: business_constraint
    check: "OCC: expected_<parent>_version equals current parent.version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/pay, /resale-listings/{id}/buy, /events/{id}/open-presale, /open-general, /close"

# ───────────────────────────────────────────────────────────────────────────
# §1.5 API Endpoint Table
# ───────────────────────────────────────────────────────────────────────────
endpoints:
  # ---- Fan ----
  - method: POST
    path: "/fans"
    description: "Register a Fan; computes risk_score; lands in UNVERIFIED."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, device_fingerprint]
    output: Fan
    side_effects: ["compute bot_risk_score", "verification_status = UNVERIFIED"]
  - method: POST
    path: "/fans/{id}/verify"
    description: "Verified-fan check: UNVERIFIED -> VERIFIED if risk_score < 70, else -> FLAGGED."
    roles: [Fan]
    code: 200
    input: []
    output: Fan
    side_effects: ["set verification_status = VERIFIED or FLAGGED per risk_score", "increments Fan.version by 1"]
  - method: GET
    path: "/fans/{id}"
    description: "Fetch a Fan."
    roles: [Anonymous, Fan, PromoterAdmin]
    code: 200
    input: []
    output: Fan
    side_effects: []
  - method: GET
    path: "/fans"
    description: "List Fans; filterable."
    roles: [PromoterAdmin]
    code: 200
    input: ["email?", "verification_status?", "limit?", "offset?"]
    output: Fan[]
    side_effects: []

  # ---- Event ----
  - method: POST
    path: "/events"
    description: "Create an Event in DRAFT."
    roles: [PromoterAdmin]
    code: 201
    input: ["title", "venue_capacity", "presale_code", "face_value_cents", "resale_cap_pct?"]
    output: Event
    side_effects: []
  - method: GET
    path: "/events/{id}"
    description: "Fetch an Event."
    roles: [Anonymous, Fan, PromoterAdmin]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: GET
    path: "/events"
    description: "List Events."
    roles: [Anonymous, Fan, PromoterAdmin]
    code: 200
    input: ["sales_status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []
  - method: POST
    path: "/events/{id}/open-presale"
    description: "DRAFT -> PRESALE."
    roles: [PromoterAdmin]
    code: 200
    input: [expected_event_version]
    output: Event
    side_effects: ["set sales_status=PRESALE", "increments Event.version by 1"]
  - method: POST
    path: "/events/{id}/open-general"
    description: "PRESALE -> GENERAL."
    roles: [PromoterAdmin]
    code: 200
    input: [expected_event_version]
    output: Event
    side_effects: ["set sales_status=GENERAL", "increments Event.version by 1"]
  - method: POST
    path: "/events/{id}/close"
    description: "GENERAL/SOLD_OUT -> CLOSED."
    roles: [PromoterAdmin]
    code: 200
    input: [expected_event_version]
    output: Event
    side_effects: ["set sales_status=CLOSED", "increments Event.version by 1"]
  - method: POST
    path: "/events/{id}/advance-queue"
    description: "Offer the next admittable WAITING QueueEntries (queue_position ASC) up to remaining allocation, and sweep expired OFFERED entries to EXPIRED."
    roles: [PromoterAdmin]
    code: 200
    input: ["tier_id?", "max_offers?"]
    output: QueueEntry[]
    side_effects: ["WAITING->OFFERED with offer_expires_at", "increment PriceTier.reserved_count", "OFFERED->EXPIRED for stale offers, release reserved_count", "increments PriceTier.version"]

  # ---- PriceTier ----
  - method: POST
    path: "/price-tiers"
    description: "Create a PriceTier under an Event (Event must be DRAFT)."
    roles: [PromoterAdmin]
    code: 201
    input: [event_id, name, allocation, base_multiplier_bps]
    output: PriceTier
    side_effects: []
  - method: GET
    path: "/price-tiers/{id}"
    description: "Fetch a PriceTier."
    roles: [Anonymous, Fan, PromoterAdmin]
    code: 200
    input: []
    output: PriceTier
    side_effects: []
  - method: GET
    path: "/price-tiers"
    description: "List PriceTiers; filter by event_id (FK reverse-reachability for PriceTier.event_id)."
    roles: [Anonymous, Fan, PromoterAdmin]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: PriceTier[]
    side_effects: []

  # ---- QueueEntry ----
  - method: POST
    path: "/queue-entries"
    description: "Join the virtual queue for a tier; assigns queue_position; recomputes Fan risk_score."
    roles: [Fan]
    code: 201
    input: [event_id, fan_id, tier_id, presale_code_used, requested_qty]
    output: QueueEntry
    side_effects: ["recompute bot_risk_score", "possible Fan VERIFIED/FLAGGED transition", "assign queue_position (created_at ASC)"]
  - method: GET
    path: "/queue-entries/{id}"
    description: "Fetch a QueueEntry."
    roles: [Fan, PromoterAdmin]
    code: 200
    input: []
    output: QueueEntry
    side_effects: []
  - method: GET
    path: "/queue-entries"
    description: "List QueueEntries; filter by event_id / fan_id / tier_id (FK reverse-reachability for all three)."
    roles: [Fan, PromoterAdmin]
    code: 200
    input: ["event_id?", "fan_id?", "tier_id?", "status?", "limit?", "offset?"]
    output: QueueEntry[]
    side_effects: []

  # ---- Order ----
  - method: POST
    path: "/orders"
    description: "Redeem an OFFERED QueueEntry to create a PENDING Order; locks dynamic pricing."
    roles: [Fan]
    code: 201
    input: [queue_entry_id, fan_id, tier_id, quantity]
    output: Order
    side_effects: ["compute dynamic_unit_price (presale_locked variant if PRESALE)", "compute order_total", "Order created PENDING"]
  - method: POST
    path: "/orders/{id}/pay"
    description: "PENDING -> PAID; issues Tickets, commits seats, may cascade Event SOLD_OUT."
    roles: [Fan]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["QueueEntry OFFERED->PURCHASED", "reserved->sold seats", "issue Tickets", "Event.tickets_sold_count += qty", "Fan.completed_purchase_count += 1", "cascade Event->SOLD_OUT revoking WAITING entries", "increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "PENDING -> CANCELLED (unpaid abandon)."
    roles: [Fan]
    code: 200
    input: []
    output: Order
    side_effects: ["set status=CANCELLED", "refund_amount_cents=0"]
  - method: POST
    path: "/orders/{id}/refund"
    description: "PAID -> REFUNDED per refund policy; voids tickets; releases seats; may re-open SOLD_OUT->GENERAL."
    roles: [Fan]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["compute refund_amount", "VOID tickets", "sold_count -= qty", "Event.tickets_sold_count -= qty", "Fan.completed_purchase_count -= 1", "cascade Event SOLD_OUT->GENERAL", "increments Order.version by 1"]
  - method: GET
    path: "/orders/{id}"
    description: "Fetch an Order."
    roles: [Fan, PromoterAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List Orders; filter by fan_id / queue_entry_id / tier_id (FK reverse-reachability)."
    roles: [Fan, PromoterAdmin]
    code: 200
    input: ["fan_id?", "queue_entry_id?", "tier_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  # ---- Ticket ----
  - method: GET
    path: "/tickets/{id}"
    description: "Fetch a Ticket."
    roles: [Fan, PromoterAdmin, GateScanner]
    code: 200
    input: []
    output: Ticket
    side_effects: []
  - method: GET
    path: "/tickets"
    description: "List Tickets; filter by order_id / event_id / holder_fan_id (FK reverse-reachability)."
    roles: [Fan, PromoterAdmin, GateScanner]
    code: 200
    input: ["order_id?", "event_id?", "holder_fan_id?", "entry_status?", "holding_status?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []
  - method: POST
    path: "/tickets/{id}/scan"
    description: "Mobile-only gate entry: VALID -> SCANNED."
    roles: [GateScanner]
    code: 200
    input: [device_channel]
    output: Ticket
    side_effects: ["set entry_status=SCANNED"]

  # ---- Transfer ----
  - method: POST
    path: "/transfers"
    description: "Sender initiates a transfer of a HELD/VALID ticket to a recipient Fan."
    roles: [Fan]
    code: 201
    input: [ticket_id, sender_fan_id, recipient_fan_id]
    output: Transfer
    side_effects: ["Ticket holding_status HELD->TRANSFER_PENDING", "Transfer PENDING"]
  - method: POST
    path: "/transfers/{id}/accept"
    description: "Recipient accepts; ticket holder changes."
    roles: [Fan]
    code: 200
    input: []
    output: Transfer
    side_effects: ["Transfer->ACCEPTED", "Ticket.holder_fan_id=recipient", "Ticket holding_status->HELD"]
  - method: POST
    path: "/transfers/{id}/decline"
    description: "Recipient declines."
    roles: [Fan]
    code: 200
    input: []
    output: Transfer
    side_effects: ["Transfer->DECLINED", "Ticket holding_status->HELD"]
  - method: POST
    path: "/transfers/{id}/cancel"
    description: "Sender cancels a pending transfer."
    roles: [Fan]
    code: 200
    input: []
    output: Transfer
    side_effects: ["Transfer->CANCELLED", "Ticket holding_status->HELD"]
  - method: GET
    path: "/transfers/{id}"
    description: "Fetch a Transfer."
    roles: [Fan, PromoterAdmin]
    code: 200
    input: []
    output: Transfer
    side_effects: []
  - method: GET
    path: "/transfers"
    description: "List Transfers; filter by ticket_id / sender_fan_id / recipient_fan_id (FK reverse-reachability)."
    roles: [Fan, PromoterAdmin]
    code: 200
    input: ["ticket_id?", "sender_fan_id?", "recipient_fan_id?", "status?", "limit?", "offset?"]
    output: Transfer[]
    side_effects: []

  # ---- ResaleListing ----
  - method: POST
    path: "/resale-listings"
    description: "List a HELD/VALID ticket for resale at or below the price cap."
    roles: [Fan]
    code: 201
    input: [ticket_id, seller_fan_id, list_price_cents]
    output: ResaleListing
    side_effects: ["validate resale_price_cap", "Ticket holding_status HELD->LISTED", "Listing OPEN"]
  - method: POST
    path: "/resale-listings/{id}/buy"
    description: "Buy an OPEN listing; ticket holder changes; superseded ticket stays VALID for buyer."
    roles: [Fan]
    code: 200
    input: [buyer_fan_id, expected_resalelisting_version]
    output: ResaleListing
    side_effects: ["Listing->SOLD", "set buyer_fan_id", "Ticket.holder_fan_id=buyer", "Ticket holding_status->HELD", "increments ResaleListing.version by 1"]
  - method: POST
    path: "/resale-listings/{id}/cancel"
    description: "Seller cancels an OPEN listing."
    roles: [Fan]
    code: 200
    input: []
    output: ResaleListing
    side_effects: ["Listing->CANCELLED", "Ticket holding_status->HELD"]
  - method: GET
    path: "/resale-listings/{id}"
    description: "Fetch a ResaleListing."
    roles: [Fan, PromoterAdmin]
    code: 200
    input: []
    output: ResaleListing
    side_effects: []
  - method: GET
    path: "/resale-listings"
    description: "List ResaleListings; filter by ticket_id / seller_fan_id / buyer_fan_id (FK reverse-reachability)."
    roles: [Anonymous, Fan, PromoterAdmin]
    code: 200
    input: ["ticket_id?", "seller_fan_id?", "buyer_fan_id?", "status?", "limit?", "offset?"]
    output: ResaleListing[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC clock for offer-expiry / velocity-window tests."
    roles: [PromoterAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server now() returns to_iso8601 until next set"]

# ───────────────────────────────────────────────────────────────────────────
# §1.6 Error Code Catalog
# ───────────────────────────────────────────────────────────────────────────
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource does not exist."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Acting Fan is not the owner of the targeted resource."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_FAN_FLAGGED
    http: 403
    condition: "Acting Fan.verification_status == FLAGGED (bot-detected) attempting a gated action."
  - id: ERR_INVALID_PRESALE_CODE
    http: 422
    condition: "Presale-phase queue join with presale_code_used != Event.presale_code."
  - id: ERR_NON_MOBILE_ENTRY
    http: 422
    condition: "Gate scan with device_channel != MOBILE (mobile-only entry)."
  - id: ERR_FAN_NOT_VERIFIED
    http: 422
    condition: "The acting Fan is not VERIFIED (UNVERIFIED) on a verified-fan-gated action (queue join, pay, transfer initiate/accept, resale list/buy)."
  - id: ERR_SELF_DEALING
    http: 422
    condition: "Resale buyer equals seller, or transfer recipient equals sender."
  - id: ERR_RESALE_CAP_EXCEEDED
    http: 422
    condition: "Resale list_price_cents exceeds the computed resale price cap."
  - id: ERR_QTY_MISMATCH
    http: 422
    condition: "Order quantity != redeemed QueueEntry.requested_qty, or qty out of 1..6."
  - id: ERR_TICKET_ALREADY_SCANNED
    http: 422
    condition: "Refund attempted while at least one of the Order's Tickets is SCANNED."
  - id: ERR_OFFER_EXPIRED
    http: 422
    condition: "Order redemption against a QueueEntry whose offer window has passed."
  - id: ERR_ALLOCATION_EXCEEDED
    http: 422
    condition: "Tier reserved_count + sold_count would exceed PriceTier.allocation."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match current parent.version on a guarded write."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed body, or out-of-range scalar."

# ───────────────────────────────────────────────────────────────────────────
# §1.7 RBAC Matrix
# ───────────────────────────────────────────────────────────────────────────
roles:
  - name: Anonymous
    description: "Unauthenticated public; can register and browse public catalog."
    identity: opaque
    exclusive_operations: ["POST /fans"]
    shared_operations: ["GET /events", "GET /events/{id}", "GET /price-tiers", "GET /price-tiers/{id}", "GET /fans/{id}", "GET /resale-listings"]
  - name: Fan
    description: "A registered fan; owns queue entries, orders, tickets, transfers, listings."
    identity: "entity_backed:Fan"
    exclusive_operations:
      - "POST /fans/{id}/verify"
      - "POST /queue-entries"
      - "POST /orders"
      - "POST /orders/{id}/pay"
      - "POST /orders/{id}/cancel"
      - "POST /orders/{id}/refund"
      - "POST /transfers"
      - "POST /transfers/{id}/accept"
      - "POST /transfers/{id}/decline"
      - "POST /transfers/{id}/cancel"
      - "POST /resale-listings"
      - "POST /resale-listings/{id}/buy"
      - "POST /resale-listings/{id}/cancel"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}"
      - "GET /price-tiers"
      - "GET /price-tiers/{id}"
      - "GET /queue-entries"
      - "GET /queue-entries/{id}"
      - "GET /orders"
      - "GET /orders/{id}"
      - "GET /tickets"
      - "GET /tickets/{id}"
      - "GET /transfers"
      - "GET /transfers/{id}"
      - "GET /resale-listings"
      - "GET /resale-listings/{id}"
      - "GET /fans/{id}"
  - name: PromoterAdmin
    description: "Event operator; owns events, pricing, queue advancement."
    identity: opaque
    exclusive_operations:
      - "POST /events"
      - "POST /price-tiers"
      - "POST /events/{id}/open-presale"
      - "POST /events/{id}/open-general"
      - "POST /events/{id}/close"
      - "POST /events/{id}/advance-queue"
      - "GET /fans"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}"
      - "GET /price-tiers"
      - "GET /price-tiers/{id}"
      - "GET /queue-entries"
      - "GET /queue-entries/{id}"
      - "GET /orders"
      - "GET /orders/{id}"
      - "GET /tickets"
      - "GET /tickets/{id}"
      - "GET /transfers"
      - "GET /transfers/{id}"
      - "GET /resale-listings"
      - "GET /resale-listings/{id}"
      - "GET /fans/{id}"
  - name: GateScanner
    description: "Venue gate operator performing mobile-only entry scans."
    identity: opaque
    exclusive_operations: ["POST /tickets/{id}/scan"]
    shared_operations: ["GET /tickets", "GET /tickets/{id}"]
