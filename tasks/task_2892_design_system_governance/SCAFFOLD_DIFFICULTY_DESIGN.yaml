              as: EngineeringReviewer
              as_user_id: "eng-1"
              captures: { review_result_state: $.data.resulting_proposal_state }
            - call: "GET /design-system/contribution-proposals/${prop_id}"
              payload: {}
              as: DesignSystemLead
              captures: { prop_state: $.data.state }
