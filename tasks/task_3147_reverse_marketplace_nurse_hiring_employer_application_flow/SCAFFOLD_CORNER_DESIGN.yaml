# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task: task_3147_reverse_marketplace_nurse_hiring_employer_application_flow
#
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Claims §1.8 covers
# appear as `excluded_because:` stubs with no test_recipe.
# Anchors defined here are local to this file (YAML anchors do not cross files).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: nurse_create_returns_all_fields_in_draft_with_version_1
        claim_type: Creation
        grounds:
          - entities.Nurse
          - endpoints.POST_/marketplace/nurses
        distinguishing_aspect: "A nurse created with the ten required inputs comes back 201 with status DRAFT, version 1, license_verified false, active_application_count 0, empty confidentiality_exclusions, and system-minted id/created_at/updated_at — status and computed fields are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (server default). Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_nurse
              call: "POST /marketplace/nurses"
              payload: { full_name: "Nora Icu", email: "nora@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 8, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-nora"
              captures: { nurse_id: $.data.id, nurse_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Nurse.${nurse_id}.status == DRAFT and version == 1"
            - "Nurse.${nurse_id}.license_verified == false and active_application_count == 0"
            - "Nurse.${nurse_id}.confidentiality_exclusions == []"
            - "the response data carries non-null id, created_at, updated_at; meta.api_request_id is present"

      - name: nurse_create_with_duplicate_email_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Nurse.fields.email
          - validations[priority=11]
          - errors.ERR_DUPLICATE_RESOURCE
        distinguishing_aspect: "The second nurse registration reusing nora@x.com is rejected ERR_DUPLICATE_RESOURCE even though every other field differs — email uniqueness is global across nurses."
        test_recipe:
          setup:
            - "One nurse already registered with email nora@x.com."
          setup_api_calls:
            - *k_clock
            - *k_nurse
          trigger:
            - call: "POST /marketplace/nurses"
              payload: { full_name: "Imposter", email: "nora@x.com", home_state: "OR", primary_specialty: "ER", years_experience: 2, desired_shift: "NIGHT", desired_hourly_rate_cents: 6000, max_commute_miles: 10, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-imposter"
              captures: { err_dup: $.data.error_id }
          assert:
            - "err_dup == ERR_DUPLICATE_RESOURCE"
            - "GET /marketplace/nurses as PlatformAdmin still returns exactly 1 row"

      - name: nurse_create_with_missing_required_field_returns_validation_error
        claim_type: Required Fields
        grounds:
          - entities.Nurse.fields.primary_specialty
          - errors.ERR_VALIDATION
        distinguishing_aspect: "Omitting primary_specialty (a source:input field with no default) yields ERR_VALIDATION with http 400, and no nurse row is persisted."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /marketplace/nurses"
              payload: { full_name: "NoSpec", email: "nospec@x.com", home_state: "CA", years_experience: 3, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-nospec"
              captures: { err_req: $.data.error_id }
          assert:
            - "err_req == ERR_VALIDATION"
            - "the response status is 400"

      - name: nurse_create_with_invalid_enum_and_low_rate_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Nurse.fields.primary_specialty
          - entities.Nurse.fields.desired_hourly_rate_cents
          - errors.ERR_VALIDATION
        distinguishing_aspect: "primary_specialty 'BRAIN_SURGERY' is outside the declared enum and desired_hourly_rate_cents 1500 is below the 2000 floor — either violation alone yields ERR_VALIDATION."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /marketplace/nurses"
              payload: { full_name: "BadEnum", email: "badenum@x.com", home_state: "CA", primary_specialty: "BRAIN_SURGERY", years_experience: 3, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-badenum"
              captures: { err_enum: $.data.error_id }
            - call: "POST /marketplace/nurses"
              payload: { full_name: "LowRate", email: "lowrate@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 3, desired_shift: "DAY", desired_hourly_rate_cents: 1500, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-lowrate"
              captures: { err_rate: $.data.error_id }
          assert:
            - "err_enum == ERR_VALIDATION and err_rate == ERR_VALIDATION"
            - "GET /marketplace/nurses as PlatformAdmin returns 0 rows"

      - name: nurse_get_by_employer_confidentially_excluded_returns_404
        claim_type: Retrieval
        grounds:
          - entities.Nurse.fields.confidentiality_exclusions
          - endpoints.GET_/marketplace/nurses/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "A nurse who listed employer E in confidentiality_exclusions is invisible to E: GET by E returns 404 ERR_NOT_FOUND (cloaking), while PlatformAdmin and the nurse herself read the row fine — confidentiality is a read-cloak, not a hard error, for reads."
        test_recipe:
          setup:
            - "Employer E registered; nurse created with confidentiality_exclusions [E.id] supplied at registration."
          setup_api_calls:
            - *k_clock
            - &k_emp
              call: "POST /marketplace/employers"
              payload: { legal_name: "Bayview Medical", facility_state: "CA", fee_model: "PER_PLACEMENT", subscription_tier: "BASIC", sla_response_hours: 48, guarantee_days: 60, placement_fee_bps: 2000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - &k_nurse_shy
              call: "POST /marketplace/nurses"
              payload: { full_name: "Shy Nurse", email: "shy@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 5, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "Bayview Medical" }
              as: Candidate
              as_user_id: "seed-shy"
              captures: { shy_id: $.data.id }
            - &k_lic_shy
              call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${shy_id}", license_number: "RN-CA-800", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${shy_id}"
              captures: { lic_shy: $.data.id }
            - &k_submit_shy
              call: "POST /marketplace/nurses/${shy_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${shy_id}"
            - &k_verify_shy
              call: "POST /marketplace/license-verifications/${lic_shy}/verify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /marketplace/nurses/${shy_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_cloak: $.data.error_id }
            - call: "GET /marketplace/nurses/${shy_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "err_cloak == ERR_NOT_FOUND with http 404 (the excluded employer cannot even learn the nurse exists)"
            - "PlatformAdmin's GET returns 200 with Nurse.${shy_id}.confidentiality_exclusions containing ${emp_id} (auto-added on activation because current_employer_name matched an Employer.legal_name)"

      - name: nurses_list_paginates_with_defaults_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/marketplace/nurses
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three ACTIVE nurses, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; the specialty filter narrows before pagination counts."
        test_recipe:
          setup:
            - "Three ACTIVE ICU nurses and one ACTIVE ER nurse."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - &k_lic
              call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${nurse_id}", license_number: "RN-CA-100", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { lic_id: $.data.id }
            - &k_submit
              call: "POST /marketplace/nurses/${nurse_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
            - &k_verify
              call: "POST /marketplace/license-verifications/${lic_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/nurses"
              payload: { full_name: "P2", email: "p2@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 4, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-p2"
              captures: { p2: $.data.id }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${p2}", license_number: "RN-CA-102", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${p2}"
              captures: { lp2: $.data.id }
            - call: "POST /marketplace/nurses/${p2}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${p2}"
            - call: "POST /marketplace/license-verifications/${lp2}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/nurses"
              payload: { full_name: "P3", email: "p3@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 6, desired_shift: "NIGHT", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-p3"
              captures: { p3: $.data.id }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${p3}", license_number: "RN-CA-103", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${p3}"
              captures: { lp3: $.data.id }
            - call: "POST /marketplace/nurses/${p3}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${p3}"
            - call: "POST /marketplace/license-verifications/${lp3}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/nurses"
              payload: { full_name: "P4", email: "p4@x.com", home_state: "CA", primary_specialty: "ER", years_experience: 6, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-p4"
              captures: { p4: $.data.id }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${p4}", license_number: "RN-CA-104", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${p4}"
              captures: { lp4: $.data.id }
            - call: "POST /marketplace/nurses/${p4}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${p4}"
            - call: "POST /marketplace/license-verifications/${lp4}/verify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /marketplace/nurses"
              payload: { primary_specialty: "ICU", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response is an array of exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /marketplace/nurses?primary_specialty=ICU&limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET /marketplace/nurses?status=ACTIVE returns 4 rows (all four nurses)"
            - "GET /marketplace/nurses with no parameters honors defaults limit 10, offset 0"

      - name: requisition_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/marketplace/requisitions/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated requisition id returns 404 ERR_NOT_FOUND, not a 400 and not an empty body."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; no requisitions exist."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /marketplace/requisitions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "err_nf == ERR_NOT_FOUND"
            - "the response status is 404 and response_type is error"

      - name: certification_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Certification
        distinguishing_aspect: "Certification carries common_fields: false — its response has id and created_at but NO version and NO updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "One nurse with an ACLS certification."
          setup_api_calls:
            - *k_clock
            - *k_nurse
            - &k_cert
              call: "POST /marketplace/certifications"
              payload: { nurse_id: "${nurse_id}", cert_code: "ACLS", expires_on: "2027-06-01" }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "GET /marketplace/certifications/${cert_id}"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
          assert:
            - "the response carries id, created_at, nurse_id, cert_code ACLS, expires_on 2027-06-01"
            - "the response carries no version field and no updated_at field"
            - "the response status is 200"

      - name: certification_with_past_expiry_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Certification.fields.expires_on
          - errors.ERR_LICENSE_EXPIRED
        distinguishing_aspect: "expires_on must be strictly after the clock's current date at creation: 2026-09-01 (today) is rejected ERR_LICENSE_EXPIRED, as is any past date."
        test_recipe:
          setup:
            - "Clock at 2026-09-01; one nurse exists."
          setup_api_calls:
            - *k_clock
            - *k_nurse
          trigger:
            - call: "POST /marketplace/certifications"
              payload: { nurse_id: "${nurse_id}", cert_code: "PALS", expires_on: "2026-09-01" }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { err_cert: $.data.error_id }
          assert:
            - "err_cert == ERR_LICENSE_EXPIRED"
            - "GET /marketplace/nurses/${nurse_id}/certifications returns 0 rows"

      - name: placement_fields_copied_from_offer_and_application_at_acceptance
        claim_type: Computed Fields
        grounds:
          - entities.Placement.fields.annualized_salary_cents
          - entities.Placement.fields.guarantee_ends_on
        distinguishing_aspect: "The Placement returned by offer accept carries computed copies — annualized_salary_cents == hourly 8500 * 2080 == 17680000 and guarantee_ends_on == start_date 2026-09-15 + 60 days == 2026-11-14 — client input cannot supply them."
        test_recipe:
          setup:
            - "Full hiring pipeline: ACTIVE nurse, application INTERVIEWING with a COMPLETED interview, screening COMPLETE, SIGNED_CONTRACT APPROVED, offer ISSUED at 8500 with start_date 2026-09-15 under a 60-day-guarantee PER_PLACEMENT employer."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - &k_req
              call: "POST /marketplace/requisitions"
              payload: { employer_id: "${emp_id}", specialty: "ICU", unit_name: "ICU-4West", required_certs: [], facility_state: "CA", distance_from_facility_miles: 20, shift: "DAY", offered_hourly_rate_cents: 8000, openings_total: 2 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - &k_app
              call: "POST /marketplace/applications"
              payload: { requisition_id: "${req_id}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 8500, proposed_shift: "DAY", expected_nurse_version: "${nurse_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { app_id: $.data.id }
            - &k_review
              call: "POST /marketplace/applications/${app_id}/review"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
            - &k_iv
              call: "POST /marketplace/applications/${app_id}/interviews"
              payload: { starts_at: "2026-09-02T10:00:00Z", ends_at: "2026-09-02T11:00:00Z" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { iv_id: $.data.id }
            - &k_clock_iv
              call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - &k_iv_done
              call: "POST /marketplace/interviews/${iv_id}/complete"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - &k_scr
              call: "POST /marketplace/screenings"
              payload: { application_id: "${app_id}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { scr_id: $.data.id }
            - &k_scr_cred
              call: "POST /marketplace/screenings/${scr_id}/verify-credentials"
              payload: {}
              as: PlatformAdmin
            - &k_scr_bg
              call: "POST /marketplace/screenings/${scr_id}/clear-background"
              payload: {}
              as: PlatformAdmin
            - &k_doc
              call: "POST /marketplace/onboarding-documents"
              payload: { application_id: "${app_id}", doc_type: "SIGNED_CONTRACT" }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { doc_id: $.data.id }
            - &k_doc_ok
              call: "POST /marketplace/onboarding-documents/${doc_id}/approve"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - &k_offer
              call: "POST /marketplace/applications/${app_id}/offers"
              payload: { offered_hourly_rate_cents: 8500, start_date: "2026-09-15", expected_requisition_version: "${req_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /marketplace/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { placement_id: $.data.id }
          assert:
            - "Placement.${placement_id}.annualized_salary_cents == 17680000 (8500 * 2080)"
            - "Placement.${placement_id}.guarantee_ends_on == 2026-11-14 (start 2026-09-15 + 60 days)"
            - "Placement.${placement_id}.status == PENDING_START and hourly_rate_cents == 8500"
            - "Placement.${placement_id}.employer_id == ${emp_id} and requisition_id == ${req_id} (copied, not supplied)"

      - name: suppressed_match_hidden_from_employer_visible_to_admin
        claim_type: Computed Fields
        grounds:
          - entities.Match.fields.suppressed
          - endpoints.GET_/marketplace/requisitions/{id}/matches
          - validations[priority=6]
        distinguishing_aspect: "A match row whose nurse excludes the requisition's employer is persisted with suppressed true: the Employer role's list hides it while PlatformAdmin with include_suppressed sees it — filtering is by role, not by deletion."
        test_recipe:
          setup:
            - "Employer E and a second employer E2; nurse excludes E2 (E2 legal_name equals nurse.current_employer_name, auto-added at activation). E2 has an OPEN ICU requisition; matches generated."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - call: "POST /marketplace/employers"
              payload: { legal_name: "Shady Pines", facility_state: "CA", fee_model: "SUBSCRIPTION", subscription_tier: "PRO", sla_response_hours: 48, guarantee_days: 90, placement_fee_bps: 1500 }
              as: PlatformAdmin
              captures: { emp2_id: $.data.id }
            - call: "POST /marketplace/nurses"
              payload: { full_name: "Shy Two", email: "shy2@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 5, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "Shady Pines" }
              as: Candidate
              as_user_id: "seed-shy2"
              captures: { shy2_id: $.data.id }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${shy2_id}", license_number: "RN-CA-801", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${shy2_id}"
              captures: { lic_shy2: $.data.id }
            - call: "POST /marketplace/nurses/${shy2_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${shy2_id}"
            - call: "POST /marketplace/license-verifications/${lic_shy2}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/requisitions"
              payload: { employer_id: "${emp2_id}", specialty: "ICU", unit_name: "ICU-South", required_certs: [], facility_state: "CA", distance_from_facility_miles: 20, shift: "DAY", offered_hourly_rate_cents: 8000, openings_total: 1 }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { req2_id: $.data.id }
            - call: "POST /marketplace/requisitions/${req2_id}/generate-matches"
              payload: {}
              as: Employer
              as_user_id: "${emp2_id}"
          trigger:
            - call: "GET /marketplace/requisitions/${req2_id}/matches"
              payload: {}
              as: Employer
              as_user_id: "${emp2_id}"
            - call: "GET /marketplace/requisitions/${req2_id}/matches"
              payload: { include_suppressed: true }
              as: PlatformAdmin
          assert:
            - "the Employer's list returns 0 rows (suppressed match hidden)"
            - "PlatformAdmin with include_suppressed returns 1 row with Match.suppressed == true and nurse_id == ${shy2_id}"
            - "GET /marketplace/nurses/${shy2_id}/matches as PlatformAdmin also returns the suppressed row"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: nurse_draft_to_pending_requires_existing_license
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Nurse.DRAFT_to_PENDING_VERIFICATION
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Submitting a DRAFT nurse who has NO LicenseVerification row at all is rejected ERR_INVALID_STATE — the precondition demands at least one PENDING or VERIFIED verification before the profile can enter PENDING_VERIFICATION."
        test_recipe:
          setup:
            - "One nurse in DRAFT with zero license verifications."
          setup_api_calls:
            - *k_clock
            - *k_nurse
          trigger:
            - call: "POST /marketplace/nurses/${nurse_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { err_sub: $.data.error_id }
          assert:
            - "err_sub == ERR_INVALID_STATE"
            - "Nurse.${nurse_id}.status remains DRAFT"

      - name: license_reject_reverts_nurse_to_draft_and_requires_reason
        claim_type: side_effect_execution
        grounds:
          - state_machines.LicenseVerification.PENDING_to_REJECTED
          - errors.ERR_REVIEW_NOTE_REQUIRED
        distinguishing_aspect: "Rejecting the only PENDING verification of a PENDING_VERIFICATION nurse reverts the nurse to DRAFT in the same request; the reject call without rejection_reason fails ERR_REVIEW_NOTE_REQUIRED."
        test_recipe:
          setup:
            - "Nurse in PENDING_VERIFICATION with one PENDING verification."
          setup_api_calls:
            - *k_clock
            - *k_nurse
            - *k_lic
            - *k_submit
          trigger:
            - call: "POST /marketplace/license-verifications/${lic_id}/reject"
              payload: {}
              as: PlatformAdmin
              captures: { err_note: $.data.error_id }
            - call: "POST /marketplace/license-verifications/${lic_id}/reject"
              payload: { rejection_reason: "license number not found on state board" }
              as: PlatformAdmin
          assert:
            - "err_note == ERR_REVIEW_NOTE_REQUIRED (missing rejection_reason)"
            - "after the successful reject: LicenseVerification.${lic_id}.status == REJECTED and rejection_reason stored"
            - "Nurse.${nurse_id}.status == DRAFT (revert cascade) and license_verified == false"

      - name: nurse_deactivate_blocked_with_live_applications
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Nurse.ACTIVE_to_INACTIVE
          - errors.ERR_NURSE_HAS_LIVE_APPLICATIONS
        distinguishing_aspect: "An ACTIVE nurse with an application in UNDER_REVIEW cannot deactivate: ERR_NURSE_HAS_LIVE_APPLICATIONS; after the nurse declines the application (active_application_count drops to 0) the same deactivate succeeds."
        test_recipe:
          setup:
            - "ACTIVE nurse; application created and moved to UNDER_REVIEW."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - *k_req
            - *k_app
            - *k_review
          trigger:
            - call: "POST /marketplace/nurses/${nurse_id}/deactivate"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { err_deact: $.data.error_id }
            - call: "POST /marketplace/applications/${app_id}/decline"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
            - call: "POST /marketplace/nurses/${nurse_id}/deactivate"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
          assert:
            - "err_deact == ERR_NURSE_HAS_LIVE_APPLICATIONS while the application was UNDER_REVIEW"
            - "after decline: Nurse.${nurse_id}.active_application_count == 0 and deactivation succeeds with status INACTIVE"

      - name: nurse_reactivate_requires_license_still_verified
        claim_type: precondition_enforcement
        grounds:
