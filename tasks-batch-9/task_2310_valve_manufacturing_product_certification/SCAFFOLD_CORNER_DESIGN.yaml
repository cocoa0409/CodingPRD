      - name: corner_scrapped_component_cannot_be_voided
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Component.terminal_states
          - errors[ERR_STATE_INVALID]
          - validations[priority=30]
        distinguishing_aspect: "SCRAPPED is terminal for Component: a following VOID disposition returns ERR_STATE_INVALID (409) and the lot's scrapped mass is unchanged."
        test_recipe:
          setup:
            - "A RELEASED 500.000 kg lot with one 60.250 kg BONNET component already SCRAPPED."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C6", name: "Corner Term Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
