  - rule_id: compensating_invariant
    rule_summary: "Two ledgers must return exactly to their prior value when an action is undone: charge green board feet under allocate/deallocate, and the product line warranty reserve under approve/reverse."
    instances:
      - name: receipt_allocate_deallocate_conserves_charge_green_volume
        summary: "Deallocating a receipt restores charged_green_bf 5800 and weighted_initial_moisture_pct 46.0 exactly; re-allocating it restores 9700 and 45.2 with no drift."
        mechanism: "charged_green_bf and the volume-weighted moisture are both recomputed from the current ALLOCATED set rather than incrementally adjusted, so the inverse operation is exact."
        entities_touched: [KilnCharge, GreenReceipt]
        rules_referenced: [green_board_feet_conservation, weighted_initial_moisture]
        test_recipe:
          setup: "Charge A with receipts R1 (5800 bf at 46.0 pct) and R2 (3900 bf at 44.0 pct) both allocated: charged_green_bf 9700, weighted 45.2."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: ProcurementClerk, captures: { r2: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r2}/accept", payload: { accepted_board_feet: 3900 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
          trigger:
            - { call: "POST /mill/kiln-charges/${charge_a}/deallocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
          assert:
            - "Before the trigger the charge showed charged_green_bf == 9700 and weighted_initial_moisture_pct == 45.2."
            - "deallocate_receipt: status 200 with data.charged_green_bf == 5800 and data.weighted_initial_moisture_pct == 46.0 (exactly the single-receipt value, not a subtracted approximation)."
            - "GET /mill/green-receipts/{r2} shows status \"ACCEPTED\" with kiln_charge_id == null; accepted_board_feet is still 3900."
            - "Re-allocating: status 200 with data.charged_green_bf == 9700 and data.weighted_initial_moisture_pct == 45.2 - identical to the pre-trigger values."
            - "GET /mill/green-receipts?kiln_charge_id={charge_a} returns total_count 2 at the end and returned total_count 1 in between."
            - "No rounding residue accumulates: repeating the deallocate/allocate pair a second time yields the same 9700 / 45.2 pair."

      - name: claim_approve_reverse_conserves_warranty_reserve
        summary: "Reversing an approved claim returns warranty_balance_cents to 600000 and warranty_committed_cents to 0, restores posture OPEN and cancels the open remediation, with the invariant balance + committed == funded_total holding at every step."
        mechanism: "The reversal credits exactly the stored adjudicated_liability_cents, so the compensation is value-identical to the original debit rather than recomputed from current inputs."
        entities_touched: [WarrantyClaim, ProductLine, PrefinishRun]
        rules_referenced: [warranty_reserve_conservation, product_line_posture]
        test_recipe:
          setup: "A SOLID line funded with 600000 cents and an APPROVED claim charging 151474 cents, leaving balance 448526 and posture RESTRICTED; remediation has been started."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 240, installation_date: "2026-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 210, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
            - { call: "POST /mill/warranty-claims/${claim_id}/start_remediation", payload: {}, as: MillSupervisor }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_id}/reverse", payload: { reversal_reason: "Moisture log showed a plumbing leak, not a product defect" }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          assert:
            - "Response status 200 with data.adjudication_status == \"REVERSED\" and data.remediation_status == \"CANCELLED\"."
            - "data.adjudicated_liability_cents is retained at 151474 as the audit record of what was credited back."
            - "GET /mill/product-lines/{line_id} shows warranty_funded_total_cents == 600000, warranty_committed_cents == 0, warranty_balance_cents == 600000 and posture == \"OPEN\"."
            - "The invariant balance + committed == funded_total held at 448526 + 151474 == 600000 before the reversal and 600000 + 0 == 600000 after it."
            - "GET /mill/warranty-claims?product_line_id={line_id}&adjudication_status=APPROVED returns total_count 0, so committed cents and the approved claim set agree."
            - "A second reverse attempt returns 409 ERR_CLAIM_STATE_INVALID, so the compensation cannot be applied twice."

