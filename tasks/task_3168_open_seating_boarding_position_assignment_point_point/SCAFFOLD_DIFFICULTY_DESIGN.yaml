              payload: { weight_lbs: 20 }
              as: GateAgent
          trigger:
            - call: "GET /ops/flight-legs/${leg1}/staffing-check"
              payload: {}
              as: GateAgent
              captures: { lf: $.data.load_factor, bpr: $.data.bags_per_ramp_agent, us: $.data.understaffed }
          assert:
            - "the generated 90-passenger fixture on this endpoint yields load_factor == 0.90 (round_half_up 2dp; >= boundary: 0.90 itself satisfies the high-load co-condition, whereas 89 journeys yield 0.89 and fail it)"
            - "with exactly 60 ACCEPTED bags and ramp_agent_count 4: bags_per_ramp_agent == 15.0 and understaffed == false (strict > against 15; equality is adequate)"
            - "adding the 61st ACCEPTED bag yields bags_per_ramp_agent == 15.3 (15.25 rounded 1dp half-up) and understaffed == true (0.90 >= 0.90 AND 15.3 > 15)"
            - "the smoke fixture above (1 journey, 1 bag) shows load_factor == 0.01 and understaffed == false — co-condition gate works"

      - name: a1_a15_pool_exhaustion_at_capacity
        grounds:
          - calculations.boarding_position_assignment
          - validations[priority=17]
        distinguishing_aspect: |
          Empty-pool / count boundary on a different metric (pool slots) and a
          different endpoint (upgrades): with aircraft seat_count=3 the
          A1-A15 purchasable pool is min(15, 3) = 3; the third
